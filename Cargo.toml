[workspace]
resolver = "2"
members = ["crates/core", "crates/sim", "crates/sidecar", "bindings/c", "bindings/node", "bindings/python"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/meros-co/integrations"
rust-version = "1.89"

[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
