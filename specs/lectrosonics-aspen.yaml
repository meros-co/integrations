maps:
  crosspoint_mode: { direct: "0", override: "1", background: "2", auto: "3", phantom: "5" }
  output_attenuation: { "0": "0", "20": "20", "40": "40" }

commands:
  get_baud_rate:
    summary: "Read the serial port baud rate (baud)"
    send: "!baud?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_baud_rate:
    summary: "Set the serial port baud rate and read it back (baud)"
    params:
      value: { type: enum, values: ["9600", "19200", "38400", "57600", "115200"], required: true, label: Baud rate, description: "RS-232 port speed in bits per second; Control Panel needs 57600." }
    send: "!baud={value}"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_description:
    summary: "Read the device description string (desc)"
    send: "!desc?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_description:
    summary: "Set the device description string and read it back (desc)"
    params:
      value: { type: string, required: true, max_length: 32, pattern: '^[\x20\x21\x23-\x5b\x5d-\x7e]*$', label: Description, description: "The device's description, up to 32 characters. No double quotes or backslashes." }
    send: "!desc=\"{value}\""
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_fan_status:
    summary: "Read the fan status (fanstat)"
    send: "!fanstat?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_hardware_status:
    summary: "Read the hardware status (hwstat)"
    send: "!hwstat?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_model_id:
    summary: "Read the device id string (id)"
    send: "!id?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_lcd_backlight:
    summary: "Read the lcd backlight (lcdbl)"
    send: "!lcdbl?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_lcd_backlight:
    summary: "Set the lcd backlight and read it back (lcdbl)"
    params:
      value: { type: bool, required: true, label: LCD backlight, description: "On lights the LCD, off turns it off." }
    send: "!lcdbl={value:bool01}"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_system_mode:
    summary: "Read the master/slave mode (mode)"
    send: "!mode?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_monitor_source:
    summary: "Read the headphone monitor source (monsrc)"
    send: "!monsrc?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_monitor_source:
    summary: "Set the headphone monitor source and read it back (monsrc)"
    params:
      value: { type: int, min: 1, max: 48, required: true, label: Monitor source, description: "Mix bus heard on the headphone monitor, 1 to 48." }
    send: "!monsrc={value}"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_port_control:
    summary: "Read the communication port control flags (portctl)"
    params:
      port: { type: int, min: 0, max: 4, required: true, label: Port, description: "Communication port: 0 USB, 1 RS-232, 2 TCP port 1, 3 TCP port 2, 4 HTTP (3 and 4 from firmware 1.4.0)." }
    send: "!portctl({port})?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_port_control:
    summary: "Set the communication port control flags and read it back (portctl)"
    params:
      port: { type: int, min: 0, max: 4, required: true, label: Port, description: "Communication port: 0 USB, 1 RS-232, 2 TCP port 1, 3 TCP port 2, 4 HTTP (3 and 4 from firmware 1.4.0)." }
      value: { type: int, min: 0, max: 3, required: true, label: Access, description: "0 disabled, 1 receive only, 2 send only, 3 send and receive (the default; USB always 3)." }
    send: "!portctl({port})={value}"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_serial_number:
    summary: "Read the device serial number string (serial)"
    send: "!serial?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_temperature:
    summary: "Read the device internal temperature (temp)"
    send: "!temp?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_firmware_version:
    summary: "Read the device firmware version (version)"
    send: "!version?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_remote_port:
    summary: "Read the remote control port assignment (rcport)"
    params:
      port: { type: int, min: 1, max: 2, required: true, label: Remote port, description: "Remote control port, 1 or 2." }
    send: "!rcport({port})?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_remote_port:
    summary: "Set the remote control port assignment and read it back (rcport)"
    params:
      port: { type: int, min: 1, max: 2, required: true, label: Remote port, description: "Remote control port, 1 or 2." }
      value: { type: int, min: 1, max: 3, required: true, label: Interface, description: "1 TEL, 2 CODEC1, 3 CODEC2." }
    send: "!rcport({port})={value}"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_input_active:
    summary: "Read the audio input activity status (inact)"
    params:
      input: { type: int, min: 1, max: 32, required: true, label: Input, description: "Audio input number from 1 (not the test-signal inputs)." }
    send: "!inact({input})?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_input_active_on_bus:
    summary: "Read the audio input activity status (inact)"
    params:
      bus: { type: int, min: 1, max: 48, required: true, label: Mix bus, description: "System mix bus, 1 to 48." }
      input: { type: int, min: 1, max: 32, required: true, label: Input, description: "Audio input number from 1 (not the test-signal inputs)." }
    send: "!inact({bus},{input})?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_input_clipping:
    summary: "Read the audio input clipping status (incl)"
    params:
      input: { type: int, min: 1, max: 32, required: true, label: Input, description: "Audio input number from 1 (not the test-signal inputs)." }
    send: "!incl({input})?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_input_delay:
    summary: "Read the audio input delay (indel)"
    params:
      input: { type: int, min: 1, max: 32, required: true, label: Input, description: "Audio input number from 1 (not the test-signal inputs)." }
    send: "!indel({input})?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_input_delay:
    summary: "Set the audio input delay and read it back (indel)"
    params:
      input: { type: int, min: 1, max: 32, required: true, label: Input, description: "Audio input number from 1 (not the test-signal inputs)." }
      value: { type: int, min: 0, max: 200, required: true, label: Delay, description: "Delay in half milliseconds, 0 to 200 (0 to 100 ms)." }
    send: "!indel({input})={value}"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_input_gain:
    summary: "Read the audio input gain (ingn)"
    params:
      input: { type: int, min: 1, max: 36, required: true, label: Input, description: "Input number from 1, the test-signal inputs after the audio inputs (SPN1624: 1-16 audio, 17-20 test)." }
    send: "!ingn({input})?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_input_gain:
    summary: "Set the audio input gain and read it back (ingn)"
    params:
      input: { type: int, min: 1, max: 36, required: true, label: Input, description: "Input number from 1, the test-signal inputs after the audio inputs (SPN1624: 1-16 audio, 17-20 test)." }
      value: { type: int, min: -70, max: 60, required: true, label: Gain, description: "Input gain in dB: -10 to +60 on audio inputs, -70 to +20 on test inputs, -20 to +20 on SPNConference and SPNTrio conferencing inputs." }
