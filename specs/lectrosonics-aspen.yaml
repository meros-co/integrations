spec: 1
id: lectrosonics-aspen
name: Lectrosonics ASPEN processors (ASPEN control protocol)
vendor: Lectrosonics
category: mixer

# The ASPEN control language on TCP 4080 (and 4081 from firmware 1.4.0) and
# RS-232: one request ended by CR, one reply ended by CR LF, OK with any data
# or ERROR. Every query and update here is sent in verbose mode ("!"), so the
# reply names what it answers (OK ingn(3)=50) and an update reads the value
# back. State is kept by polling: the device sends nothing unasked.
source:
  - title: "ASPEN Control Protocol and Language (ASPEN Support WebHelp, read 27 October 2026)"
    author: Lectrosonics
    url: https://lectrosonics.com/aspensupport/WebHelp/aspen_cmd/aspen_cmd_proto.html
    note: >
      Manufacturer document. Request and reply syntax, CR and CR LF, one
      request at a time, device addresses, verbose mode, query (?), update
      (=) and action forms, wildcard (*) and range addressing, argument types
      (integers, floats with a point, quoted strings with escapes, arrays in
      braces), the keep values 99, 9999 and 999, OK and ERROR.
  - title: "ABNF Grammar for ASPEN Control Language; Macros and the ASPEN Control Language"
    author: Lectrosonics
    url: https://lectrosonics.com/aspensupport/WebHelp/aspen_cmd/aspen_cmd_grammar.html
    note: >
      Manufacturer documents. The formal grammar, and the macro language
      (variables, sleep, macvrport for verbose replies of macro commands).
  - title: "ASPEN command reference, per model (gen, adfe, in, incomp, infil, nrf, xp, mix, out, outcomp, outfil, outlim, rp, io, pre, macro, rtc, sig_gen, event, netwk, aspen, tel, cod, aec, lec)"
    author: Lectrosonics
    url: https://lectrosonics.com/aspensupport/WebHelp/spn1624/commands/spn1624_in_cmds.html
    note: >
      Manufacturer documents, one set per model under
      WebHelp/<model>/commands/<model>_<group>_cmds.html (spn16i, spn32i,
      spn812, spn1612, spn1624, spn2412, spnconference with the prefix
      spnconf_, spntrio, spndnt). Each target's addressing, access (query,
      update, action), range and units, and which models have it.
  - title: "Connecting over a network; Connecting by RS-232; per-model network setup and baud rate pages"
    author: Lectrosonics
    url: https://lectrosonics.com/aspensupport/WebHelp/cp_general/connect_net.html
    note: >
      Manufacturer documents. TCP port 4080 (tcpport) and the secondary port
      one above it from firmware 1.4.0; HTTP 80; network changes applied at
      the next power cycle; RS-232 at 9600 to 115200 bps, Control Panel at
      57600, a Lectrosonics cable.

transport:
  type: line-tcp
  port: 4080
  framing: terminated
  terminator: cr
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  reply_match: '^(?:\S+ )?(?:OK|ERROR)'
  error_match: '^(?:\S+ )?ERROR'
  probe: "id?"
  # The same language on the RS-232 port. Lectrosonics gives the speeds
  # (baud) but not the other line settings: 8N1 without flow control is
  # assumed (see the quirks).
  serial:
    baud_rate: { default: 57600, values: [9600, 19200, 38400, 57600, 115200] }
    data_bits: 8
    parity: none
    stop_bits: 1
    flow_control: none

ports:
  - { port: 4080, protocol: tcp, role: control, when: "link tcp", note: "Primary port (tcpport); from firmware 1.4.0 the same protocol also on the next port, 4081" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "RS-232 port with Lectrosonics' cable (not straight-through)" }

