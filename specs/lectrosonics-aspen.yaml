  updates:
    - match: '^(?:\S+ )?OK baud=(-?[0-9]+(?:\.[0-9]+)?)$'
      state: { "device.baud_rate": "{1}" }
    - match: '^(?:\S+ )?OK desc="((?:[^"\\]|\\.)*)"$'
      state: { "device.description": "{1}" }
    - match: '^(?:\S+ )?OK fanstat=(-?[0-9]+(?:\.[0-9]+)?)$'
      state: { "device.fan_status": "{1}" }
    - match: '^(?:\S+ )?OK hwstat=(-?[0-9]+(?:\.[0-9]+)?)$'
      state: { "device.hardware_status": "{1}" }
    - match: '^(?:\S+ )?OK id="((?:[^"\\]|\\.)*)"$'
      state: { "device.id": "{1}" }
    - match: '^(?:\S+ )?OK lcdbl=(-?[0-9]+(?:\.[0-9]+)?)$'
      state: { "device.lcd_backlight": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^(?:\S+ )?OK mode=(-?[0-9]+(?:\.[0-9]+)?)$'
      state: { "device.master": "{1}" }
    - match: '^(?:\S+ )?OK monsrc=(-?[0-9]+(?:\.[0-9]+)?)$'
      state: { "device.monitor_source": "{1}" }
    - match: '^(?:\S+ )?OK portctl\(([0-9]+)\)=(-?[0-9]+(?:\.[0-9]+)?)$'
      state: { "device.port_control.{1}": "{2}" }
    - match: '^(?:\S+ )?OK portctl\(\*\)=\{([^}]*)\}$'
      match_each: '(-?[0-9]+(?:\.[0-9]+)?)'
      match_each_in: 1
      state: { "device.port_control.{index}": "{2}" }
    - match: '^(?:\S+ )?OK serial="((?:[^"\\]|\\.)*)"$'
      state: { "device.serial": "{1}" }
    - match: '^(?:\S+ )?OK temp=(-?[0-9]+(?:\.[0-9]+)?)$'
      state: { "device.temperature": "{1}" }
