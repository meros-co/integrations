    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_aec_enabled:
    summary: "Read the acoustic echo canceller enable (aecen)"
    send: "!aecen?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_aec_enabled:
    summary: "Set the acoustic echo canceller enable and read it back (aecen)"
    params:
      value: { type: bool, required: true, label: Enabled, description: "On turns the acoustic echo canceller on." }
    send: "!aecen={value:bool01}"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_aec_erl:
    summary: "Read the aec erl (aecerl)"
    send: "!aecerl?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_aec_erle:
    summary: "Read the aec erle (aecerle)"
    send: "!aecerle?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_aec_enr:
    summary: "Read the aec enr (aecenr)"
    send: "!aecenr?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
