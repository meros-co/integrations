    send: "!lecavg?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_lec_averaging:
    summary: "Set the line echo canceller averaging and read it back (lecavg)"
    params:
      value: { type: int, min: 2, max: 5, required: true, label: Averaging, description: "The line echo canceller's averaging, 2 to 5 (5 by default)." }
    send: "!lecavg={value}"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_lec_enabled:
    summary: "Read the line echo canceller enable (lecen)"
    send: "!lecen?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_lec_enabled:
    summary: "Set the line echo canceller enable and read it back (lecen)"
    params:
      value: { type: bool, required: true, label: Enabled, description: "On turns the line echo canceller on." }
    send: "!lecen={value:bool01}"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
