  network.tcp_port: { type: int, description: "Primary control port, 4080 by default (the secondary is one more); applied at the next power cycle (tcpport)" }
  aspen.devices.*: { type: string, description: "aspen (aspen)" }
  aspen.default_address: { type: string, description: "Serial number of the device this port addresses by default, or empty for the master (aspenaddr)" }
  aspen.count: { type: int, description: "Devices in the ASPEN system (aspencnt)" }
  conferencing.telephone.auto_answer: { type: int, description: "Rings before answering, or 0 for no auto-answer (telautoans)" }
  conferencing.telephone.auto_disconnect: { type: bool, description: "On hangs up when the far end does (telautodis)" }
  conferencing.telephone.connected: { type: bool, description: "On takes the line off hook, off hangs up (telconn)" }
  conferencing.telephone.connect_chime_level: { type: int, description: "Connection chime level in dB, -12 to +12 (telcchmlv)" }
  conferencing.telephone.connect_chime: { type: bool, description: "On plays a chime on connecting (telconnchm)" }
  conferencing.telephone.dial_speed: { type: int, description: "Dialling speed, 1 to 5 (teldialspd)" }
  conferencing.telephone.dtmf_level: { type: int, description: "DTMF level in dB, -6 to +6 (teldtmflv)" }
  conferencing.telephone.dtmf_monitor: { type: bool, description: "On lets the room hear DTMF tones (teldtmfmon)" }
  conferencing.telephone.flash_time: { type: int, description: "Hookswitch flash in milliseconds, 100 to 2500 in steps of 100 (telflashtm)" }
  conferencing.phone_book.*.number: { type: string, description: "Up to 30 of 0-9 * # A-D, ! for a flash and , for a one-second pause (telnbr)" }
  conferencing.phone_book.*.title: { type: string, description: "Up to 30 characters (telnbrti)" }
  conferencing.telephone.privacy: { type: bool, description: "On turns telephone privacy on (telpriv)" }
  conferencing.telephone.privacy_mode: { type: int, description: "1 send muted, 2 receive muted, 3 both (telprivmod)" }
  conferencing.telephone.ring_chime_level: { type: int, description: "Ring chime level in dB, -12 to +12 (telrchmlv)" }
  conferencing.telephone.ring_chime: { type: bool, description: "On plays a chime when the line rings (telringchm)" }
  conferencing.telephone.ringing: { type: bool, description: "Line ringing (telringing)" }
  conferencing.codecs.*.connected: { type: bool, description: "On connects the codec interface, off disconnects it (codconn)" }
  conferencing.codecs.*.connect_chime_level: { type: int, description: "Connection chime level in dB, -12 to +12 (codcchmlv)" }
  conferencing.codecs.*.connect_chime: { type: bool, description: "On plays a chime on connecting (codconnchm)" }
  conferencing.codecs.*.privacy: { type: bool, description: "On turns the codec's privacy on (codpriv)" }
  conferencing.codecs.*.privacy_mode: { type: int, description: "1 send muted, 2 receive muted, 3 both (codprivmod)" }
  conferencing.aec.averaging: { type: int, description: "The acoustic echo canceller's averaging, 2 to 5 (5 by default) (aecavg)" }
  conferencing.aec.enabled: { type: bool, description: "On turns the acoustic echo canceller on (aecen)" }
  conferencing.aec.erl: { type: int, description: "AEC echo return loss in dB (aecerl)" }
  conferencing.aec.erle: { type: int, description: "AEC echo return loss enhancement in dB (aecerle)" }
  conferencing.aec.enr: { type: int, description: "AEC noise reduction in dB (aecenr)" }
  conferencing.lec.averaging: { type: int, description: "The line echo canceller's averaging, 2 to 5 (5 by default) (lecavg)" }
  conferencing.lec.enabled: { type: bool, description: "On turns the line echo canceller on (lecen)" }
