      codec: { type: int, min: 1, max: 2, required: true, label: Codec, description: "Codec interface, 1 or 2." }
    send: "!codprivmod({codec})?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_codec_privacy_mode:
    summary: "Set the codec privacy mode and read it back (codprivmod)"
    params:
      codec: { type: int, min: 1, max: 2, required: true, label: Codec, description: "Codec interface, 1 or 2." }
      value: { type: int, min: 1, max: 3, required: true, label: Mode, description: "1 send muted, 2 receive muted, 3 both." }
    send: "!codprivmod({codec})={value}"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  get_aec_averaging:
    summary: "Read the acoustic echo canceller averaging (aecavg)"
    send: "!aecavg?"
    expect: { matches: 'OK [a-z]+(?:\([^)]*\))?=(.*)$' }
    returns: value

  set_aec_averaging:
    summary: "Set the acoustic echo canceller averaging and read it back (aecavg)"
    params:
      value: { type: int, min: 2, max: 5, required: true, label: Averaging, description: "The acoustic echo canceller's averaging, 2 to 5 (5 by default)." }
