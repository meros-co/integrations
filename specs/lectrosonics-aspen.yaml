  outputs.*.rear_panel.minimum: { type: int, description: "Lowest rear-panel gain in dB, -61 to 0 (rpoutgnmin)" }
  outputs.*.rear_panel.preset: { type: int, description: "Rear-panel gain in dB at power-up, -61 to 0 (rpoutgnpre)" }
