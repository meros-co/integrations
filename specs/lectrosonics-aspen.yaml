  programmable_inputs.*.definition: { type: string, description: "prgindef as the device writes it, braces left out: the function, then its targets (prgindef)" }
  programmable_outputs.*.state: { type: bool, description: "On closes the output; only when no function is assigned to it (prgout)" }
