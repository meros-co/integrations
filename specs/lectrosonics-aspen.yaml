  outputs.*.eq.stages.*: { type: string, description: "outfil as the device writes it, braces left out: type, slope, approximation, frequency, gain, bandwidth (outfil)" }
  outputs.*.eq.bypass: { type: bool, description: "On bypasses every stage of the output's EQ (outfilby)" }
  outputs.*.limiter.gain_reduction: { type: int, unit: dB, description: "Limiter gain reduction in dB (outlmgn)" }
