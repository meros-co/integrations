spec: 1
id: denon-dn500cb
name: Denon Professional DN-500CB CD player (RS-232C)
vendor: Denon Professional
category: playback

# The DN-500CB's serial command protocol on its RS-232C port: every message is "@0" (the start character and ID),
# a command, then CR. The player answers each command with the ACK byte (06H), or NACK (15H) when it cannot take
# it; a status request is answered ACK and then the status ("@0?ST" is answered "@0STPL"). It also sends a status by
# itself when it changes from the unit, and expects the host to answer it with ACK. The guide documents no network
# control.
source:
  - title: "Denon Professional DN-500CB Serial Command Protocol Guide, Manual Version 1.4"
    author: inMusic Brands, Inc.
    url: https://cdn.inmusicbrands.com/DenonPro/cdn/1672/downloads/DN-500CB_Serial_Command_Protocol_Guide_v1.4.pdf
    note: >
      Manufacturer document (retrieved 2026-10-27). Code structure "@0", command, CR, in ASCII 20H-7FH (p.5); the
      transmission rules: an answer within 300 ms, ACK (06H) on success and with the status for a request, NACK
      (15H) otherwise, the next command only after ACK or NACK (BUSY "@0BDERBUSY" otherwise), at most 5 ms between
      characters, one second after power on before the next command, automatic statuses answered ACK by the host
      and sent once more without it (p.5); control commands (p.6); status requests and answers (p.7); RS-232C at
      9600, 38400 or 115200 bit/s, 8 data bits, no parity, 1 stop bit, no flow control (p.8).

transport:
  type: line-serial
  framing: terminated
  terminator: cr
  encoding: utf-8
  timeout_ms: 1000
  reply: expected
  # The player's messages: the ACK or NACK byte alone, and statuses from "@0" to CR.
  reply_framing: terminated
  reply_terminators: ["\r", "\u0006", "\u0015"]
  reply_match: '^(\x06|\x15|@0)'
  error_match: '^(\x15|@0BDERBUSY)'
  probe: "@0?PW"
  # One second after power on before the next command (p.5).
  pacing:
    groups:
      power_on:
        match: "^@0PW00$"
        after_ms: 1000

settings:
  serial_port: { type: string, required: true, max_length: 256, label: Serial port,
    description: "The host's serial port wired to the RS-232C connector: COM3 on Windows, /dev/ttyUSB0 on Linux, /dev/cu.usbserial-1420 on macOS." }
  baud_rate: { type: enum, values: ["9600", "38400", "115200"], default: "115200", label: Baud rate,
    description: "The RS-232C speed in bits per second, as set on the player: 9600, 38400 or 115200." }
  data_bits: { type: int, min: 8, max: 8, default: 8, label: Data bits, description: "Bits per character; the player uses 8." }
  parity: { type: enum, values: [none], default: none, label: Parity, description: "The player uses no parity." }
  stop_bits: { type: int, min: 1, max: 1, default: 1, label: Stop bits, description: "The player uses 1 stop bit." }
  flow_control: { type: enum, values: [none], default: none, label: Flow control, description: "The player uses no flow control." }

ports:
  - { port: null, protocol: serial, role: control, setting: serial_port, note: "RS-232C, D-sub 9-pin female; pin 7 can supply 5 V, 500 mA" }

models:
  - id: dn-500cb
    name: Denon Professional DN-500CB
    supports: [power_on, power_off, get_power, eject, play, pause, stop, set_mute, next_track, previous_track,
      locate_track, rewind, fast_forward, number_key, set_time_display, get_disc_status, get_status, get_track,
      get_track_count, get_title, get_artist, get_album, get_track_time, get_elapsed, get_remaining]
    verification: none

maps:
  mute: { "true": "00", "false": "01" }
  time_display: { elapsed: EL, total_elapsed: TL, total_remaining: TR }

commands:
  power_on:
    summary: Power on (PW00); the next command waits a second
    send: "@0PW00"
    expect: &ack { reply_contains: "\u0006", contains: "\u0006" }
    returns: ack
  power_off:
    summary: Power off (PW01)
    send: "@0PW01"
    expect: *ack
    returns: ack
  get_power:
    summary: "Ask whether the player is on (?PW): answered ACK when on, nothing when off"
    send: "@0?PW"
    expect: *ack
    returns: ack
  eject:
    summary: Eject the disc from the CD slot (PCDTRYOP)
    send: "@0PCDTRYOP"
    expect: *ack
    returns: ack
  play:
    summary: Play the current track (2353)
    send: "@02353"
    expect: *ack
    returns: ack
  pause:
    summary: Pause the current track (2348)
    send: "@02348"
    expect: *ack
    returns: ack
  stop:
    summary: Stop (2354)
    send: "@02354"
    expect: *ack
    returns: ack
  set_mute:
    summary: Mute or unmute the audio (mt); the player has no request to read it back
    params:
      muted: { type: bool, required: true, label: Muted, description: "On mutes the audio, off unmutes it." }
    send: "@0mt{muted:map.mute}"
    expect: *ack
    returns: ack
  next_track:
    summary: Skip to the next track (2332)
    send: "@02332"
    expect: *ack
    returns: ack
  previous_track:
    summary: Restart the current track, or skip to the previous one (2333)
    send: "@02333"
    expect: *ack
    returns: ack
  locate_track:
    summary: Select a track by number (Tr)
    params:
      track: { type: int, min: 1, max: 9999, required: true, label: Track, description: "The track's number in the track list, 1-9999." }
    send: "@0Tr{track:04d}"
    expect: *ack
    returns: ack
  rewind:
    summary: Rewind the current track (PCSLSR)
    send: "@0PCSLSR"
    expect: *ack
    returns: ack
  fast_forward:
    summary: Fast forward the current track (PCSLSF)
    send: "@0PCSLSF"
    expect: *ack
    returns: ack
  number_key:
    summary: Press a number key to select a track (PCTKEY)
    params:
      digit: { type: int, min: 0, max: 9, required: true, label: Digit, description: "The number key, 0-9." }
    send: "@0PCTKEY{digit}"
    expect: *ack
    returns: ack
  set_time_display:
    summary: Choose the time the display shows (PCTMD); the player has no request to read it back
    params:
      mode: { type: enum, values: [elapsed, total_elapsed, total_remaining], required: true, label: Time display,
        description: "elapsed in the track, or total_elapsed or total_remaining of the track list." }
    send: "@0PCTMD{mode:map.time_display}"
    expect: *ack
    returns: ack
  get_disc_status:
    summary: "Read whether a disc is in the slot (?CD): CI disc, NC no disc"
    send: "@0?CD"
    expect: { reply_contains: "@0CD", matches: '^@0CD([A-Z]{2})\r?$' }
    returns: value
  get_status:
    summary: "Read the track status (?ST): PL playing, PP paused, DVFR rewinding, DVFF fast forwarding"
    send: "@0?ST"
    expect: { reply_contains: "@0ST", matches: '^@0ST([A-Z]+)\r?$' }
    returns: value
  get_track:
    summary: "Read the current track's number (?Tr): four digits, or UNKN"
    send: "@0?Tr"
    expect: { reply_contains: "@0Tr", matches: '^@0Tr([0-9]{4}|UNKN)\r?$' }
    returns: value
  get_track_count:
    summary: "Read the number of tracks in the track list (?Tt): four digits, or UNKN"
    send: "@0?Tt"
    expect: { reply_contains: "@0Tt", matches: '^@0Tt([0-9]{4}|UNKN)\r?$' }
    returns: value
  get_title:
    summary: "Read the current track's title (?ti): up to 64 characters"
    send: "@0?ti"
    expect: { reply_contains: "@0ti", matches: '^@0ti([^\r]*)\r?$' }
    returns: value
  get_artist:
    summary: "Read the current track's artist (?at): up to 64 characters"
    send: "@0?at"
    expect: { reply_contains: "@0at", matches: '^@0at ?([^\r]*)\r?$' }
    returns: value
  get_album:
    summary: "Read the current track's album (?al): up to 64 characters"
    send: "@0?al"
    expect: { reply_contains: "@0al", matches: '^@0al ?([^\r]*)\r?$' }
    returns: value
  get_track_time:
    summary: "Read the time position in the current track (?tl): MMMSS"
    send: "@0?tl"
    expect: { reply_contains: "@0tl", matches: '^@0tl([0-9]{5})\r?$' }
    returns: value
  get_elapsed:
    summary: "Read the time elapsed in the track (?ET): hhhmmss"
    send: "@0?ET"
    expect: { reply_contains: "@0ET", matches: '^@0ET([0-9]{7})\r?$' }
    returns: value
  get_remaining:
    summary: "Read the time remaining in the track (?RM): hhhmmss"
    send: "@0?RM"
    expect: { reply_contains: "@0RM", matches: '^@0RM([0-9]{7})\r?$' }
    returns: value

quirks:
  - models: [all]
    severity: warning
    text: >
      The player expects the host to answer each status it sends by itself with ACK within 300 ms; the spec format
      cannot answer a push without awaiting a reply, so the player sends each such status twice and then stops
      repeating it. State is unaffected. NACK, or BUSY when commands come too fast, fails the command.
  - models: [all]
    severity: info
    text: >
      Mute and the time display cannot be read back: the guide has no request for them. get_power is answered ACK
      when on and not at all when off (a timeout). The guide documents no network control, only RS-232C.
  - models: [all]
    severity: info
    text: >
      The guide does not give the RS-232C speed's factory setting; 115200 is assumed (the speed the DN-500BD's guide
      asks for). It shows a space after "Tr" in the track selection and after "at" and "al" in the answers; the
      spec sends none, and reads the answers with or without it.

state:
  disc.status: { type: string, description: "disc or no_disc (CD)" }
  transport.status: { type: string, description: "play, pause, rewind or fast_forward (ST)" }
  track.number: { type: int, description: "The current track in the track list (Tr)" }
  tracks.total: { type: int, description: "Tracks in the track list (Tt)" }
  track.title: { type: string, description: "The current track's title (ti)" }
  track.artist: { type: string, description: "The current track's artist (at)" }
  track.album: { type: string, description: "The current track's album (al)" }
  track.position: { type: string, description: "The time position in the current track, M:SS (tl)" }
  time.elapsed: { type: string, description: "Time elapsed in the track, H:MM:SS (ET)" }
  time.remaining: { type: string, description: "Time remaining in the track, H:MM:SS (RM)" }

telemetry:
  poll:
    - every_ms: 1000
      send: ["@0?ST", "@0?ET", "@0?RM"]
    - every_ms: 5000
      send: ["@0?CD", "@0?Tr", "@0?Tt"]
  updates:
    - match: '^@0CD([A-Z]{2})\r?$'
      state: { disc.status: { value: "{1}", map: { CI: disc, NC: no_disc } } }
    - match: '^@0ST([A-Z]+)\r?$'
      state: { transport.status: { value: "{1}", map: { PL: play, PP: pause, DVFR: rewind, DVFF: fast_forward } } }
    # A new track: its title, artist and album are read.
    - match: '^@0Tr([0-9]{4})\r?$'
      state: { track.number: "{1}" }
      then_send: ["@0?ti", "@0?at", "@0?al"]
    - match: '^@0TrUNKN\r?$'
      state: { track.number: { delete: true } }
    - match: '^@0Tt([0-9]{4})\r?$'
      state: { tracks.total: "{1}" }
    - match: '^@0TtUNKN\r?$'
      state: { tracks.total: { delete: true } }
    - match: '^@0ti([^\r]*)\r?$'
      state: { track.title: "{1}" }
    - match: '^@0at ?([^\r]*)\r?$'
      state: { track.artist: "{1}" }
    - match: '^@0al ?([^\r]*)\r?$'
      state: { track.album: "{1}" }
    - match: '^@0tl([0-9]{3})([0-9]{2})\r?$'
      state: { track.position: "{1}:{2:02d}" }
    - match: '^@0ET([0-9]{3})([0-9]{2})([0-9]{2})\r?$'
      state: { time.elapsed: "{1}:{2:02d}:{3:02d}" }
    - match: '^@0RM([0-9]{3})([0-9]{2})([0-9]{2})\r?$'
      state: { time.remaining: "{1}:{2:02d}:{3:02d}" }
