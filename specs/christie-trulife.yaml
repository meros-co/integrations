    summary: "Move every lens axis to an absolute position at once (LMV)"
    params:
      horizontal: { type: "int", min: -65535, max: 65535, required: true, label: "Horizontal shift", description: "Absolute horizontal shift position, within the range the projector reports for the lens fitted." }
      vertical: { type: "int", min: -65535, max: 65535, required: true, label: "Vertical shift", description: "Absolute vertical shift position, within the range the projector reports for the lens fitted." }
      zoom: { type: "int", min: -65535, max: 65535, required: true, label: "Zoom", description: "Absolute zoom position, within the range the projector reports for the lens fitted." }
      focus: { type: "int", min: -65535, max: 65535, required: true, label: "Focus", description: "Absolute focus position, within the range the projector reports for the lens fitted." }
    send: "#LMV {horizontal} {vertical} {zoom} {focus}"
    expect: { reply_contains: "LMV {horizontal} {vertical} {zoom} {focus}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  run_lens_motor:
    summary: "Start or stop one lens motor (LMV+HRUN, VRUN, ZRUN, FRUN)"
    params:
      axis: { type: "enum", values: ["horizontal", "vertical", "zoom", "focus"], required: true, label: "Axis", description: "The lens motor." }
      value: { type: "int", min: -1, max: 1, required: true, label: "Direction", description: "-1 runs toward the negative end (left, down, smaller, outward), 0 stops, 1 runs toward the positive end." }
    send: "#LMV+{axis:map.lens_axis}RUN {value}"
    expect: { reply_contains: "LMV+", matches: '^\(#?[A-Za-z]' }
    returns: ack
  step_lens_motor:
    summary: "Move one lens motor a number of steps (LMV+HSTP, VSTP, ZSTP, FSTP)"
    params:
      axis: { type: "enum", values: ["horizontal", "vertical", "zoom", "focus"], required: true, label: "Axis", description: "The lens motor." }
      value: { type: "int", min: -65535, max: 65535, required: true, label: "Steps", description: "Relative steps: negative moves left, down, smaller or outward, positive the other way; the axis range limits it." }
    send: "#LMV+{axis:map.lens_axis}STP {value}"
    expect: { reply_contains: "LMV+", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_ust_lens_area:
    summary: "Use the UST lens keep-out area or the normal one (UST+ENBL)"
