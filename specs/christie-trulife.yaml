      state: { "device.type": "{1}", "device.software_version": "{2}.{3}.{4}" }
    - match: '^\(SST\+([A-Z]{4})!(\d+) (\d+) "([^"]*)'
      state: { "status.items.{1}.{2}.state": "{3}", "status.items.{1}.{2}.value": "{4}" }
    - match: '^\(SST\+([A-Z]{4})!(\d+) \d+ "[^"]*" "([^"]*)'
      state: { "status.items.{1}.{2}.name": "{3}" }
    - match: '^\(SST\+([A-Z]{4})!(\d+) \d+ "\s*(-?\d+(?:\.\d+)?)'
      state: { "status.items.{1}.{2}.number": "{3}" }
    - match: '^\(SST\+[A-Z]{4}!\d+ \d+ "([^"]*)" "Projector\ Model"'
      state: { "device.model": "{1}" }
    - match: '^\(SST\+[A-Z]{4}!\d+ \d+ "([^"]*)" "Projector\ S/N"'
      state: { "device.serial_number": "{1}" }
    - match: '^\(SST\+[A-Z]{4}!\d+ \d+ "([^"]*)" "Output\ Resolution"'
      state: { "device.native_resolution": "{1}" }
    - match: '^\(SST\+[A-Z]{4}!\d+ \d+ "([^"]*)" "Projector\ Build\ Date"'
      state: { "device.build_date": "{1}" }
    - match: '^\(SST\+[A-Z]{4}!\d+ \d+ "([^"]*)" "Main\ Control\ Board\ SW\ Version"'
      state: { "device.firmware_version": "{1}" }
    - match: '^\(SST\+[A-Z]{4}!\d+ \d+ "(\d+):(\d+)[^"]*" "Projector Hours"'
      state: { "status.projector_hours": "{1}", "status.projector_minutes": "{2}" }
    - match: '^\(SST\+([A-Z]{4})!(\d+) \d+ "(\d+)(?::\d+)?[^"]*" "[^"]*(?:Laser On|Laser Standby|Lamp) Hours'
      state: { "status.light_hours.{1}.{2}": "{3}" }
    - match: '^\(SST\+TEMP!(\d+) (\d+) "\s*(-?\d+(?:\.\d+)?)'
      state: { "status.temperatures.{1}.value": "{3}", "status.temperatures.{1}.state": "{2}" }
    - match: '^\(SST\+TEMP!(\d+) \d+ "[^"]*" "([^"]*)'
      state: { "status.temperatures.{1}.name": "{2}" }
    - match: '^\(\d+ \d+ (FYI|ERR)(\d+) "([^"]*)'
      state: { "status.last_message.type": "{1}", "status.last_message.code": "{2}", "status.last_message.text": "{3}" }
    - match: '^\(\d+ \d+ (?:FYI|ERR)\d+ "(?:System (?:Warning|Error): )?\\?\(SST\+([A-Z]{4})\?(\d+)'
      then_send: ["SST+{1}?{2}"]
    - match: '^\(\d+ \d+ ERR0*([1-9]\d*) "([^"]*)'
      state: { "status.last_error.code": "{1}", "status.last_error.text": "{2}" }
    - match: '^\(EVT!(\d+) "([^"]*)" "([^"]*)" "([^"]*)'
      state: { "events.{1}.time": "{2}", "events.{1}.severity": "{3}", "events.{1}.text": "{4}" }
    - match: '^\(BST!L0*([01]) \d+ (-?\d+) "([^"]*)'
      state: { "options.self_test_suites.{2}.name": "{3}", "options.self_test_suites.{2}.available": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(BST\+TEST!L0*([01]) \d+ (-?\d+) "([^"]*)'
      state: { "options.self_tests.{2}.name": "{3}", "options.self_tests.{2}.available": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(BST(?:\+TEST)?!(\d+) "([^"]*)"'
      state: { "self_test.results.{1}.result": "{2}" }
    - match: '^\(BST(?:\+TEST)?!(\d+) "[^"]*" "([^"]*)'
      state: { "self_test.results.{1}.detail": "{2}" }

