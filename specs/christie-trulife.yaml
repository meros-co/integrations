    expect: { reply_contains: "NET+PORT!", matches: 'NET\+PORT!\s*(-?\d+)' }
    returns: value
  set_network_switching:
    summary: "Set the internal network switching mode (NET+SWIT)"
    params:
      value: { type: "int", min: 0, max: 2, required: true, label: "Switching", description: "Internal network switching: 0 = split (the default), 1 = all ports joined, 2 = HDBaseT joined with Ethernet (loop-through)." }
