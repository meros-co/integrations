  set_environment_manual:
    summary: "Choose manual or automatic LiteLOC environment settings (LAS+UDEC)"
    params:
      value: { type: "bool", required: true, label: "Manual", description: "True lets LAS+MAXA and LAS+MAXH set the LiteLOC environment by hand; false calculates them (the default)." }
    send: "#LAS+UDEC {value:bool01}"
    expect: { reply_contains: "LAS+UDEC {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_realblack:
    summary: "Turn RealBlack on or off (RBK+SLCT)"
    params:
      value: { type: "bool", required: true, label: "RealBlack", description: "True turns the lasers off during runs of fully black frames." }
    send: "#RBK+SLCT {value:bool01}"
    expect: { reply_contains: "RBK+SLCT {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_realblack_threshold:
    summary: "Set the RealBlack black threshold (RBK+LOSL)"
    params:
      value: { type: "int", min: 0, max: 255, required: true, label: "Threshold", description: "Pixel value at or below which a frame counts as black, 0 to 255." }
    send: "#RBK+LOSL {value}"
    expect: { reply_contains: "RBK+LOSL {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_realblack_time:
    summary: "Set how long black lasts before RealBlack turns the lasers off (RBK+TIME)"
    params:
      value: { type: "int", min: 0, max: 25, required: true, label: "Time", description: "Tenths of a second of black frames before the lasers go off, 0 to 25 (5 by default)." }
    send: "#RBK+TIME {value}"
    expect: { reply_contains: "RBK+TIME {value}", matches: '^\(#?[A-Za-z]' }
