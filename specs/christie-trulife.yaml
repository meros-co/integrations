      value: { type: "int", min: 0, max: 2, required: true, label: "Access level", description: "Serial protocol access on the Ethernet ports: 0 = no access (disables the port), 1 = login required (read-only until UID), 2 = free access at operator level (the default)." }
    send: "#RAL {value}"
