  set_language:
    summary: "Set the interface language (LOC+LANG)"
    params:
      value: { type: "int", min: 0, max: 8, required: true, label: "Language", description: "0 = English, 1 = French, 2 = German, 3 = Spanish, 4 = Italian, 5 = Chinese (simplified), 6 = Japanese, 7 = Korean, 8 = Russian." }
    send: "#LOC+LANG {value}"
    expect: { reply_contains: "LOC+LANG {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_language:
    summary: "Read the interface language (LOC+LANG?)"
    send: "LOC+LANG?"
    expect: { reply_contains: "LOC+LANG!", matches: 'LOC\+LANG!\s*(-?\d+)' }
    returns: value
  set_temperature_unit:
    summary: "Set the temperature unit (LOC+TEMP)"
