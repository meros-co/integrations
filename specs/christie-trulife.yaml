  set_control_port:
    summary: "Change the TCP port of the serial protocol over Ethernet (NET+PORT)"
    params:
      value: { type: "int", min: 1024, max: 49151, required: true, label: "Port", description: "TCP port for the Christie serial protocol over Ethernet, 1024 to 49151 (3003 is reserved); the connection then moves to it." }
    send: "#NET+PORT {value}"
