  set_artnet_base_channel:
    summary: "Set the Art-Net base channel (DMX+CHAN)"
    params:
      value: { type: "int", min: 1, max: 488, required: true, label: "Base channel", description: "First DMX channel the projector uses, 1 to 488 (1 by default)." }
    send: "#DMX+CHAN {value}"
    expect: { reply_contains: "DMX+CHAN {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_artnet_net:
    summary: "Set the Art-Net net (DMX+NETS)"
    params:
      value: { type: "int", min: 0, max: 127, required: true, label: "Net", description: "Art-Net network, 0 to 127." }
    send: "#DMX+NETS {value}"
    expect: { reply_contains: "DMX+NETS {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_artnet_subnet:
    summary: "Set the Art-Net subnet (DMX+SUBN)"
    params:
      value: { type: "int", min: 0, max: 15, required: true, label: "Subnet", description: "Art-Net subnet, 0 to 15." }
    send: "#DMX+SUBN {value}"
    expect: { reply_contains: "DMX+SUBN {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_artnet_universe:
    summary: "Set the Art-Net universe (DMX+UNVS)"
    params:
      value: { type: "int", min: 0, max: 15, required: true, label: "Universe", description: "Art-Net universe, 0 to 15." }
    send: "#DMX+UNVS {value}"
    expect: { reply_contains: "DMX+UNVS {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_static_ip:
    summary: "Set a static IP address, netmask and gateway, turning DHCP off (NET)"
    params:
      ip: { type: "string", max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: "IP address", description: "The projector's IPv4 address." }
      netmask: { type: "string", max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: "Netmask", description: "The IPv4 netmask." }
      gateway: { type: "string", max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: "Gateway", description: "The IPv4 default gateway." }
    send: "#NET \"{ip}\" \"{netmask}\" \"{gateway}\""
    expect: { reply_contains: "NET \"{ip}\" \"{netmask}\" \"{gateway}\"", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_static_ip_without_gateway:
    summary: "Set a static IP address and netmask with no gateway, turning DHCP off (NET)"
    params:
      ip: { type: "string", max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: "IP address", description: "The projector's IPv4 address." }
      netmask: { type: "string", max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: "Netmask", description: "The IPv4 netmask." }
    send: "#NET \"{ip}\" \"{netmask}\""
    expect: { reply_contains: "NET \"{ip}\" \"{netmask}\"", matches: '^\(#?[A-Za-z]' }
    returns: ack
  enable_dhcp:
    summary: "Turn DHCP on (NET+DHCP 1); a static address turns it off"
    send: "#NET+DHCP 1"
    expect: { reply_contains: "NET+DHCP 1", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_ip_address:
    summary: "Read the projector IP address (NET+ETH0?)"
    send: "NET+ETH0?"
    expect: { reply_contains: "NET+ETH0!", matches: 'NET\+ETH0!\s*"?([^")]*)' }
    returns: value
  get_netmask:
    summary: "Read the projector netmask (NET+SUB0?)"
    send: "NET+SUB0?"
    expect: { reply_contains: "NET+SUB0!", matches: 'NET\+SUB0!\s*"?([^")]*)' }
    returns: value
  get_gateway:
    summary: "Read the projector gateway (NET+GATE?)"
    send: "NET+GATE?"
    expect: { reply_contains: "NET+GATE!", matches: 'NET\+GATE!\s*"?([^")]*)' }
    returns: value
  get_mac_address:
    summary: "Read the projector MAC address (NET+MAC0?)"
    send: "NET+MAC0?"
    expect: { reply_contains: "NET+MAC0!", matches: 'NET\+MAC0!\s*"?([^")]*)' }
    returns: value
  set_device_group:
    summary: "Set the device group name (NET+DGRP)"
    params:
      value: { type: "string", max_length: 64, pattern: "^[^\"()\\\\]*$", required: true, label: "Group", description: "Device group name, which helps broadcast searches find projectors by group." }
    send: "#NET+DGRP \"{value}\""
    expect: { reply_contains: "NET+DGRP \"{value}\"", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_hostname:
    summary: "Set the projector name (NET+HOST)"
    params:
      value: { type: "string", max_length: 64, pattern: "^[^\"()\\\\ ]*$", required: true, label: "Name", description: "The projector's name; devices on its subnet reach it as <name>.local." }
    send: "#NET+HOST \"{value}\""
    expect: { reply_contains: "NET+HOST \"{value}\"", matches: '^\(#?[A-Za-z]' }
