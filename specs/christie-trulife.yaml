  get_edge_blend_list:
    summary: "Read the list of edge blends (EBL+SLCT?L)"
    send: "EBL+SLCT?L"
    expect: { reply_contains: "EBL+SLCT!L", matches: '!L(.*)\)$' }
    returns: value
  set_black_level_blend:
    summary: "Select the black level blend (EBB+SLCT)"
    params:
      value: { type: "int", min: 0, max: 11, required: true, label: "Black level blend", description: "0 = black level blending off, 1 to 4 = one of the four black level blends loaded with Twist or Mystique, 11 = basic built-in black level blending (TruLife+, Boxer)." }
    send: "#EBB+SLCT {value}"
    expect: { reply_contains: "EBB+SLCT {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_black_level_blend_list:
    summary: "Read the list of black level blends (EBB+SLCT?L)"
    send: "EBB+SLCT?L"
    expect: { reply_contains: "EBB+SLCT!L", matches: '!L(.*)\)$' }
    returns: value
  set_keep_blend_on_input_switch:
    summary: "Keep the black level blend during input switching, or not (VID+BLND)"
    params:
      value: { type: "bool", required: true, label: "Keep blend", description: "True keeps the black level blend while the input switches." }
    send: "#VID+BLND {value:bool01}"
    expect: { reply_contains: "VID+BLND {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_keep_blend_on_input_switch:
    summary: "Read whether the black level blend is kept during input switching (VID+BLND?)"
    send: "VID+BLND?"
    expect: { reply_contains: "VID+BLND!", matches: 'VID\+BLND!\s*(\d+)' }
    returns: value
  set_3d_mode:
    summary: "Set when inputs are processed as 3D (TDM)"
    params:
      value: { type: "int", min: 0, max: 6, required: true, label: "3D mode", description: "0 = 3D off for direct inputs (for 2D 120 Hz), 1 = automatic (the default), 2 = 3D where possible (frame doubling or tripling), 3 = side-by-side, 5 = top-and-bottom, 6 = frame packing (3, 5 and 6 on TruLife+); needs the Mirage license." }
    send: "#TDM {value}"
    expect: { reply_contains: "TDM {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_3d_sync_delay:
    summary: "Set the 3D emitter sync delay (TDD)"
    params:
      value: { type: "int", min: -65535, max: 65535, required: true, label: "Sync delay", description: "Where the 3D sync pulse falls relative to the DMD on/off transition: 0 = on it, negative before, positive after (TDD 2000 is documented as 20.00 ms); used with 3D sync out to an emitter." }
    send: "#TDD {value}"
    expect: { reply_contains: "TDD {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_3d_sync_delay:
    summary: "Read the 3D emitter sync delay (TDD?)"
    send: "TDD?"
    expect: { reply_contains: "TDD!", matches: 'TDD!\s*(-?\d+)' }
    returns: value
  set_3d_invert:
    summary: "Swap the left and right eye frames, or not (TDN)"
    params:
      value: { type: "bool", required: true, label: "Inverted", description: "True swaps the left and right eye frames." }
    send: "#TDN {value:bool01}"
    expect: { reply_contains: "TDN {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_3d_invert:
    summary: "Read whether the 3D eye frames are swapped (TDN?)"
    send: "TDN?"
    expect: { reply_contains: "TDN!", matches: 'TDN!\s*(\d+)' }
    returns: value
  set_3d_sync_out:
    summary: "Configure the 3D sync out port (TDO)"
    params:
      value: { type: "int", min: 0, max: 1, required: true, label: "Sync out", description: "0 = 3D sync out to an emitter (with delay and inversion), 1 = to another projector downstream (without them)." }
    send: "#TDO {value}"
    expect: { reply_contains: "TDO {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_3d_sync_out:
    summary: "Read the 3D sync out configuration (TDO?)"
    send: "TDO?"
    expect: { reply_contains: "TDO!", matches: 'TDO!\s*(-?\d+)' }
    returns: value
  set_3d_dark_interval:
    summary: "Set the 3D dark interval (DRK)"
    params:
      value: { type: "int", min: 200, max: 3000, required: true, label: "Dark time", description: "Microseconds the DMDs stay off between 3D frames: 250 to 3000 (690 by default) on TruLife+, 200 to 3000 (700 by default) on Mirage SST." }
    send: "#DRK {value}"
    expect: { reply_contains: "DRK {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  toggle_high_frame_rate:
    summary: "Turn high frame rate mode on if it is off, off if it is on; the projector reboots (HFR+ENBL, standby only, HFR or Mirage license)"
    send: "#HFR+ENBL"
    expect: { reply_contains: "HFR+ENBL", matches: '^\(#?[A-Za-z]' }
    returns: ack
  recall_profile:
    summary: "Apply a stored profile, recalling every setting it holds (PRO)"
    params:
      value: { type: "int", min: 0, max: 20, required: true, label: "Profile", description: "0 = the default profile, 1 to 20 = custom profiles (TruLife+; 1 to 10 on Mirage SST and Boxer, 1 to 4 on the 4K40-RGB); an empty profile does nothing." }
    send: "#PRO {value}"
    expect: { reply_contains: "PRO {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_profile_list:
    summary: "Read the list of local profiles (PRO?L)"
    send: "PRO?L"
    expect: { reply_contains: "PRO!L", matches: '!L(.*)\)$' }
    returns: value
  clear_profile:
    summary: "Clear a custom profile (PRO+RSET)"
    params:
      value: { type: "int", min: 1, max: 20, required: true, label: "Profile", description: "Custom profile to clear, 1 to 20." }
    send: "#PRO+RSET {value}"
    expect: { reply_contains: "PRO+RSET {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_artnet:
    summary: "Turn the Art-Net interface on or off (DMX+ENBL)"
    params:
      value: { type: "bool", required: true, label: "Art-Net", description: "True enables the Art-Net interface." }
    send: "#DMX+ENBL {value:bool01}"
