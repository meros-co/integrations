  set_thermal_profile:
    summary: "Select the fan control profile (TMC+MODE)"
    params:
      value: { type: "int", min: 0, max: 2, required: true, label: "Fan profile", description: "0 = standard (balance noise and brightness), 1 = quiet, 2 = performance (M RGB Series, Griffyn 4K35-RGB and 4K50-RGB)." }
    send: "#TMC+MODE {value}"
    expect: { reply_contains: "TMC+MODE {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_thermal_profile:
    summary: "Read the fan control profile (TMC+MODE ?)"
    send: "TMC+MODE?"
    expect: { reply_contains: "TMC+MODE!", matches: 'TMC\+MODE!\s*(-?\d+)' }
    returns: value
  set_pressurized_filter:
    summary: "Say whether the pressurized filter is installed (COO+HEPA)"
    params:
      value: { type: "bool", required: true, label: "Filter installed", description: "True tells the projector the pressurized filter is installed, so its two fans (16 and 17) are monitored." }
    send: "#COO+HEPA {value:bool01}"
    expect: { reply_contains: "COO+HEPA {value:bool01}", matches: '^\(#?[A-Za-z]' }
