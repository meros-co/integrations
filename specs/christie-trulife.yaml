  set_serial_access_level:
    summary: "Set the serial protocol access level of the RS232 port (RAL+PRTA)"
    params:
      value: { type: "int", min: 0, max: 2, required: true, label: "Access level", description: "Serial protocol access on the RS232 port: 0 = no access, 1 = login required, 2 = free access (the default)." }
    send: "#RAL+PRTA {value}"
    expect: { reply_contains: "RAL+PRTA {value}", matches: '^\(#?[A-Za-z]' }
