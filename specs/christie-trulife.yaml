    params:
      value: { type: "int", min: 1, max: 6, required: true, label: "Baud rate", description: "RS232 IN baud rate: 1 = 2400, 2 = 9600, 3 = 19200, 4 = 38400, 5 = 57600, 6 = 115200 (the default); service access is required." }
    send: "#BDR+PRTA {value}"
    expect: { reply_contains: "BDR+PRTA {value}", matches: '^\(#?[A-Za-z]' }
