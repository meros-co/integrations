    expect: { reply_contains: "WRP+SLCT!L", matches: '!L(.*)\)$' }
    returns: value
  set_keystone_gain_compensation:
    summary: "Turn keystone gain compensation on or off (WRP+KGAN)"
    params:
      value: { type: "bool", required: true, label: "Gain compensation", description: "True compensates the gain when 2D keystone is applied." }
    send: "#WRP+KGAN {value:bool01}"
    expect: { reply_contains: "WRP+KGAN {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_keystone_gain_compensation:
    summary: "Read keystone gain compensation (WRP+KGAN?)"
    send: "WRP+KGAN?"
    expect: { reply_contains: "WRP+KGAN!", matches: 'WRP\+KGAN!\s*(\d+)' }
    returns: value
  set_warp_optimization_disabled:
    summary: "Disable or enable the warp calculation speed optimization (TWE)"
    params:
      value: { type: "bool", required: true, label: "Optimization off", description: "True disables the speed optimization of the warp calculation (TWE 1), which can remove rare artifacts; false enables it (the default)." }
    send: "#TWE {value:bool01}"
    expect: { reply_contains: "TWE {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_edge_blend:
    summary: "Select the edge blend (EBL+SLCT)"
    params:
      value: { type: "int", min: 0, max: 11, required: true, label: "Edge blend", description: "0 = edge blending off, 1 to 4 = one of the four edge blends loaded with Twist or Mystique, 11 = basic built-in edge blending (TruLife+, Boxer)." }
    send: "#EBL+SLCT {value}"
    expect: { reply_contains: "EBL+SLCT {value}", matches: '^\(#?[A-Za-z]' }
