spec: 1
id: christie-trulife
name: Christie TruLife and TruLife+ projectors (serial commands over TCP)
vendor: Christie
category: display

# Christie's 3DLP laser and lamp projectors built on the TruLife and TruLife+ electronics (Eclipse, M RGB,
# Griffyn, Sapphire 4K40-RGBH, 4K40-RGB, Mirage SST, Boxer) share one ASCII command set: "(" + three-letter
# code [+ four-character subcode] [value | ?] + ")", on the RS232 IN port and on TCP 3002. A set is sent with
# the "#" prefix, which makes the projector echo the message once it has processed it; requests carry no "#"
# and are answered "(CODE!value ...)". Each family's reference is a model with its own supports list; a
# parameter takes the union of the documented ranges, with each family's values in its description.
source:
  - title: "Christie TruLife+ Technical Reference: Serial Commands, 020-103316-13 Rev. 1 (10-2025)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-103316-13-Christie-LIT-TECH-REF-TruLifePlus-API.pdf
    note: "Models (Eclipse, M RGB Series, Griffyn Series, Sapphire 4K40-RGBH), RS232 IN and Ethernet (TCP 3002), message format with the # full acknowledgment, $ and & prefixes, error code table, Xon/Xoff flow control, typical automation commands (pp. 6-18); every command and its 'Only applies to' notes (pp. 19-76); asynchronous messages (p. 77)."
  - title: "Christie TruLife+ Technical Reference: Status System, 020-103327-17 Rev. 1 (11-2025)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-103327-17-Christie-LIT-TECH-REF-TruLifePlus-STATSYS.pdf
    note: "Status states and the items of the CONF, SYST, SIGN, VERS, TEMP, COOL, SERI and LGHT groups per family, read into status.items and the typed status keys."
  - title: "Christie Technical Bulletin: TruLife+ LAS serial command notification, 020-200567-01 Rev. 1 (01-2024)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-200567-01-christie-bul-tech-trulife-las-cmd.pdf
    note: "LAS+EBLU, LAS+EGRN and LAS+ERED are removed and must not be used (damage to the diffuser); PWR 1 turns the laser on."
  - title: "Christie 4K40-RGB Technical Reference: Serial Commands, 020-102972-07 Rev. 1 (09-2020)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-102972-07-Christie-LIT-TECH-4K40-RGB-API.pdf
    note: "Commands of the d4k40-rgb model; TCP 3002; RS232 port on the IMXB faceplate."
  - title: "Christie D4K40-RGB Technical Reference: Status System, 020-102975-02 Rev. 1 (01-2020)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-102975-02-christie-lit-tech-ref-d4k40-rgb-statsys.pdf
    note: "Status groups and items of the d4k40-rgb model (CONF, SYST, SIGN, LGHT, VERS, TEMP, COOL, SERI)."
  - title: "Christie Mirage SST Technical Reference: Serial Commands, 020-103005-04 (the cover reads 020-103005-03 Rev. 1 (01-2021))"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-103005-04-Christie-LIT-TECH-REF-Mirage-SST-API.pdf
    note: "Commands of the mirage-sst model; TCP 3002."
  - title: "Christie Boxer 4K Technical Reference: Serial API Commands, 020-101697-12 Rev. 1 (11-2020)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-101697-12-Christie-LIT-TECH-REF-Boxer-4K-API.pdf
    note: "Commands of the boxer-4k model, lamp commands (LOP, LPL, LPP, HIS) and the Boxer status groups; TCP 3002."
  - title: "Christie Boxer 2K Technical Reference: Serial API Commands, 020-102417-08 Rev. 1 (11-2020)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-102417-08-Christie-LIT-TECH-REF-Boxer-2K-API.pdf
    note: "Commands of the boxer-2k model; TCP 3002."
  - title: "Christie Boxer 30 Technical Reference: Serial API Commands, 020-102096-10 Rev. 1 (11-2020)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-102096-10-Christie-LIT-TECH-REF-Boxer-30-API.pdf
    note: "Commands of the boxer-30 model; TCP 3002."
  - title: "Christie product pages (model names)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/products/projectors/all-projectors/
    note: "M 4K RGB Series: M 4K15 RGB, M 4K+15 RGB, M 4K25 RGB, M 4K+25 RGB; Griffyn Series: 4K35-RGB, 4K50-RGB (4K32-RGB under end of production); Eclipse G3; Sapphire 4K40-RGBH; Boxer 2K30 and Boxer 30 under end of support."

transport:
  type: line-tcp
  port: 3002
  framing: delimited
  open: "("
  close: ")"
  encoding: ascii
  timeout_ms: 30000
  reply: expected
  # Errors are answered as (65535 00000 ERR00005 "ITP: Too Few Parameters"). Code 0 is not an error reply:
  # it is the asynchronous status message (ERR00000 "System Warning: ..."), so it is left out.
  error_match: '^\(\d+ \d+ ERR0*[1-9]\d* '
  probe: "PWR?"
  # The same commands on the RS232 IN port: 115200 by default, BDR+PRTA offering 2400 to 115200, Xon/Xoff
  # flow control in both directions. Data bits, parity and stop bits are not stated in these references:
  # 8N1 is assumed (see the quirks).
  serial:
    baud_rate: { default: 115200, values: [2400, 9600, 19200, 38400, 57600, 115200] }
    data_bits: 8
    parity: none
    stop_bits: 1
    flow_control: xon-xoff

ports:
  - { port: 3002, protocol: tcp, role: control, when: "link tcp" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "RS232 IN, on the Video Input panel (TruLife+) or the IMXB faceplate (4K40-RGB, Mirage SST, Boxer)" }

