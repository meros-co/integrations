      slot: { type: "int", min: 1, max: 3, required: true, label: "Destination", description: "Trap destination 1, 2 or 3." }
      ip: { type: "string", max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: "IP address", description: "IPv4 address to send traps to; 0.0.0.0 sends none (the default)." }
