    summary: "Select the lamp used in limited power mode (LOP)"
    params:
      value: { type: "int", min: 1, max: 6, required: true, label: "Lamp", description: "Lamp for limited power mode: 1 = A1, 2 = A2, 3 = A3, 4 = B1, 5 = B2, 6 = B3; not while the projector is on." }
    send: "#LOP {value}"
