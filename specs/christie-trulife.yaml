  set_actuator_multiplication:
    summary: "Turn actuator multiplication mode on or off (SSP+TMUL)"
    params:
      value: { type: "bool", required: true, label: "Multiplication", description: "True runs the actuator at two or four times the input frame rate (the default), which helps fine detail." }
    send: "#SSP+TMUL {value:bool01}"
    expect: { reply_contains: "SSP+TMUL {value:bool01}", matches: '^\(#?[A-Za-z]' }
