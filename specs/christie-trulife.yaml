      value: { type: "int", min: 0, max: 1, required: true, label: "Unit", description: "0 = Celsius (the default), 1 = Fahrenheit; status temperatures follow it." }
    send: "#LOC+TEMP {value}"
    expect: { reply_contains: "LOC+TEMP {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_temperature_unit:
    summary: "Read the temperature unit (LOC+TEMP?)"
    send: "LOC+TEMP?"
    expect: { reply_contains: "LOC+TEMP!", matches: 'LOC\+TEMP!\s*(-?\d+)' }
    returns: value
  set_menu_position:
    summary: "Set the on-screen menu position (MSP)"
    params:
      value: { type: "int", min: 0, max: 8, required: true, label: "Position", description: "0 = top left (the default), 1 = top center, 2 = top right, 3 = center left, 4 = center, 5 = center right, 6 = bottom left, 7 = bottom center, 8 = bottom right." }
    send: "#MSP {value}"
    expect: { reply_contains: "MSP {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_menu_position:
    summary: "Read the on-screen menu position (MSP?)"
    send: "MSP?"
    expect: { reply_contains: "MSP!", matches: 'MSP!\s*(-?\d+)' }
    returns: value
  set_osd:
    summary: "Show or hide the on-screen display (OSD)"
    params:
      value: { type: "bool", required: true, label: "Shown", description: "True shows the on-screen display, false hides it." }
    send: "#OSD {value:bool01}"
    expect: { reply_contains: "OSD {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_osd:
    summary: "Read whether the on-screen display is shown (OSD?)"
    send: "OSD?"
    expect: { reply_contains: "OSD!", matches: 'OSD!\s*(\d+)' }
    returns: value
  set_splash_color:
    summary: "Set the splash screen background color (SPS+COLR)"
    params:
      value: { type: "enum", values: ["1", "2", "3", "7"], required: true, label: "Color", description: "Splash screen background when no signal is present: 1 = red, 2 = green, 3 = blue, 7 = black (the default)." }
    send: "#SPS+COLR {value}"
    expect: { reply_contains: "SPS+COLR {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_stealth_mode:
    summary: "Turn stealth mode on or off (STH+MODE)"
    params:
      value: { type: "bool", required: true, label: "Stealth", description: "True turns the status and shutter LEDs off and stops the display panel's heartbeat." }
    send: "#STH+MODE {value:bool01}"
    expect: { reply_contains: "STH+MODE {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_stealth_mode:
    summary: "Read whether stealth mode is on (STH+MODE?)"
    send: "STH+MODE?"
    expect: { reply_contains: "STH+MODE!", matches: 'STH\+MODE!\s*(\d+)' }
    returns: value
  set_keypad:
    summary: "Turn a keypad sensor on or off (KEN+FRNT, REAR, WIRE, HDBT)"
    params:
      sensor: { type: "enum", values: ["front_ir", "rear_ir", "wired", "hdbaset_ir"], required: true, label: "Sensor", description: "front_ir, rear_ir, wired keypad jack, or IR over HDBaseT (not on TruLife+)." }
      value: { type: "bool", required: true, label: "Enabled", description: "True enables the sensor (IR sensors and the wired jack are on by default, IR over HDBaseT off)." }
    send: "#KEN+{sensor:map.keypad} {value:bool01}"
    expect: { reply_contains: "KEN+", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_wired_keypad:
    summary: "Read whether the wired keypad jack is enabled (KEN+WIRE?)"
    send: "KEN+WIRE?"
    expect: { reply_contains: "KEN+WIRE!", matches: 'KEN\+WIRE!\s*(\d+)' }
    returns: value
  set_gpio_direction:
    summary: "Set each general purpose pin as input or output (GIO+CNFG)"
    params:
      value: { type: "string", max_length: 7, pattern: "^[IOXiox]{1,7}$", required: true, label: "Directions", description: "One letter per pin, pin 1 first: I = input, O = output, X = no change (seven pins; the 12 V and ground pins cannot be set)." }
    send: "#GIO+CNFG \"{value}\""
    expect: { reply_contains: "GIO+CNFG \"{value}\"", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_gpio_direction:
    summary: "Read the direction of each general purpose pin (GIO+CNFG?)"
    send: "GIO+CNFG?"
    expect: { reply_contains: "GIO+CNFG!", matches: 'GIO\+CNFG!\s*"?([^")]*)' }
    returns: value
  set_gpio_outputs:
    summary: "Set the general purpose outputs (GIO+STAT)"
    params:
      value: { type: "string", max_length: 7, pattern: "^[HLXhlx]{1,7}$", required: true, label: "Outputs", description: "One letter per pin, pin 1 first: H = high, L = low, X = no change; only output pins change." }
    send: "#GIO+STAT \"{value}\""
    expect: { reply_contains: "GIO+STAT \"{value}\"", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_gpio_states:
    summary: "Read the state of the general purpose pins (GIO+STAT?)"
    send: "GIO+STAT?"
    expect: { reply_contains: "GIO+STAT!", matches: 'GIO\+STAT!\s*"?([^")]*)' }
    returns: value
  set_gpio_trigger:
    summary: "Choose the general purpose pins used as camera trigger signals (GIO+TRIG)"
    params:
      value: { type: "string", max_length: 7, pattern: "^[NTXntx]{1,7}$", required: true, label: "Triggers", description: "One letter per pin, pin 1 first: N = normal, T = camera trigger, X = no change." }
    send: "#GIO+TRIG \"{value}\""
    expect: { reply_contains: "GIO+TRIG \"{value}\"", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_date:
    summary: "Set the date of the real-time clock (TMD+DATE)"
    params:
      value: { type: "string", max_length: 10, pattern: "^[0-9]{4}/[0-9]{2}/[0-9]{2}$", required: true, label: "Date", description: "Date for the real-time clock as YYYY/MM/DD." }
    send: "#TMD+DATE \"{value}\""
    expect: { reply_contains: "TMD+DATE \"{value}\"", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_date:
    summary: "Read the date of the real-time clock (TMD+DATE?, general request form)"
    send: "TMD+DATE?"
    expect: { reply_contains: "TMD+DATE!", matches: 'TMD\+DATE!\s*"?([^")]*)' }
    returns: value
  set_time:
    summary: "Set the time of the real-time clock (TMD+TIME)"
    params:
      value: { type: "string", max_length: 8, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: "Time", description: "Time for the real-time clock as hh:mm:ss (24 hours)." }
    send: "#TMD+TIME \"{value}\""
    expect: { reply_contains: "TMD+TIME \"{value}\"", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_time:
    summary: "Read the time of the real-time clock (TMD+TIME?)"
    send: "TMD+TIME?"
    expect: { reply_contains: "TMD+TIME!", matches: 'TMD\+TIME!\s*"?([^")]*)' }
    returns: value
  login:
    summary: "Log in to raise the access level of this connection (UID)"
    params:
      username: { type: "string", max_length: 32, pattern: "^[^\"()\\\\]*$", required: true, label: "Username", description: "User name, such as service." }
      password: { type: "string", max_length: 64, pattern: "^[^\"()\\\\]*$", secret: true, required: true, label: "Password", description: "The user's password, sent in clear text as the protocol does." }
    send: "#UID \"{username}\" \"{password}\""
    expect: { reply_contains: "UID \"{username}\"", matches: '^\(#?[A-Za-z]' }
    returns: ack
  logout:
    summary: "Log the current user out of this connection (UID)"
    send: "#UID"
    expect: { reply_contains: "UID", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_user:
    summary: "Read the user logged in on this connection and its access level (UID?)"
    send: "UID?"
    expect: { reply_contains: "UID!", matches: 'UID!(.*)\)$' }
    returns: value
  factory_defaults:
    summary: "Restore every setting to factory defaults, delete profiles, warps and blends, and turn DHCP on (DEF 111)"
    send: "#DEF 111"
    expect: { reply_contains: "DEF 111", matches: '^\(#?[A-Za-z]' }
    returns: ack
  reboot:
    summary: "Reboot the projector (RBT 111, standby only)"
    send: "#RBT 111"
    expect: { reply_contains: "RBT 111", matches: '^\(#?[A-Za-z]' }
    returns: ack
  ping:
    summary: "Read the projector type and software version (PNG?)"
    send: "PNG?"
    expect: { reply_contains: "PNG!", matches: 'PNG!(.*)\)$' }
    returns: value
  get_status:
    summary: "Read every status item, one message per item (SST?)"
    send: "SST?"
    expect: { reply_contains: "SST+", matches: '^\(SST\+(.*)\)$' }
    returns: value
  get_status_group:
    summary: "Read every status item of one group (SST+<group>?)"
    params:
      group: { type: "enum", values: ["ALRM", "CONF", "SYST", "SIGN", "LAMP", "LGHT", "VERS", "TEMP", "COOL", "SERI"], required: true, label: "Group", description: "ALRM alarms (Boxer), CONF configuration, SYST system, SIGN signal, LAMP lamps (Boxer), LGHT illuminator (laser families), VERS versions, TEMP temperatures, COOL cooling, SERI serial numbers." }
    send: "SST+{group}?"
    expect: { reply_contains: "SST+{group}!", matches: '!(.*)\)$' }
    returns: value
  get_status_item:
    summary: "Read one status item (SST+<group>?<index>)"
    params:
      group: { type: "enum", values: ["ALRM", "CONF", "SYST", "SIGN", "LAMP", "LGHT", "VERS", "TEMP", "COOL", "SERI"], required: true, label: "Group", description: "The status group, as for get_status_group." }
      index: { type: "int", min: 0, max: 9999, required: true, label: "Item", description: "The item's index within its group, as the status system reference numbers it." }
    send: "SST+{group}?{index}"
    expect: { reply_contains: "SST+{group}!", matches: '!(.*)\)$' }
    returns: value
  get_events:
    summary: "Read every logged event since AC power came on, newest first (EVT)"
    send: "EVT"
    expect: { reply_contains: "EVT!", matches: 'EVT!(.*)\)$' }
    returns: value
  get_recent_events:
    summary: "Read the most recent logged events (EVT <max>)"
    params:
      count: { type: "int", min: 1, max: 9999, required: true, label: "Count", description: "How many events to return, newest first." }
    send: "EVT {count}"
    expect: { reply_contains: "EVT!", matches: 'EVT!(.*)\)$' }
    returns: value
  get_events_since:
    summary: "Read the logged events from a time until now (EVT \"<start>\")"
    params:
      start: { type: "string", max_length: 19, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: "From", description: "Start time as yyyy-mm-dd hh:mm:ss." }
    send: "EVT \"{start}\""
    expect: { reply_contains: "EVT!", matches: 'EVT!(.*)\)$' }
    returns: value
  get_events_between:
    summary: "Read the logged events between two times (EVT \"<start>\" \"<end>\")"
    params:
      start: { type: "string", max_length: 19, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: "From", description: "Start time as yyyy-mm-dd hh:mm:ss." }
      end: { type: "string", max_length: 19, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: "To", description: "End time as yyyy-mm-dd hh:mm:ss." }
    send: "EVT \"{start}\" \"{end}\""
    expect: { reply_contains: "EVT!", matches: 'EVT!(.*)\)$' }
    returns: value
  run_self_test_suite:
    summary: "Run a built-in self test suite and read its results (BST)"
    params:
      suite: { type: "int", min: 0, max: 99, required: true, label: "Suite", description: "Suite as BST?L lists it: 0 = all tests, 1 = image processor board, 2 = formatter, 3 = active backplane, 4 = video path, 5 = IMXB (4K40-RGB)." }
    send: "BST {suite}"
    expect: { reply_contains: "BST!", matches: 'BST!(.*)\)$' }
    returns: value
  run_self_test:
    summary: "Run one built-in self test and read its result (BST+TEST)"
    params:
      test: { type: "int", min: 0, max: 99, required: true, label: "Test", description: "Test as BST+TEST?L lists it." }
    send: "BST+TEST {test}"
    expect: { reply_contains: "BST+TEST!", matches: 'BST\+TEST!(.*)\)$' }
    returns: value
  get_self_test_suite_list:
    summary: "Read the list of built-in self test suites (BST?L)"
    send: "BST?L"
    expect: { reply_contains: "BST!L", matches: '!L(.*)\)$' }
    returns: value
  get_self_test_list:
    summary: "Read the list of built-in self tests (BST+TEST?L)"
    send: "BST+TEST?L"
    expect: { reply_contains: "BST+TEST!L", matches: '!L(.*)\)$' }
    returns: value
  request:
    summary: "Send any request in the documented general form (<code>? or <code>+<subcode>?) and return the reply data"
    params:
      code: { type: "string", max_length: 8, pattern: "^[A-Za-z]{3}(\\+[A-Za-z0-9]{4})?$", required: true, label: "Code", description: "Function code with an optional subcode, such as LAS+POWR or SIN+PORT, without the question mark." }
    send: "{code}?"
    expect: { reply_contains: "{code}!", matches: '!(.*)\)$' }
    returns: value

telemetry:
  poll:
    - every_ms: 5000
      send:
        - "PWR?"
        - "SHU?"
        - { models: [eclipse, m-rgb, griffyn, sapphire-4k40-rgbh], message: "CHA?" }
        - "SIN?"
        - "SIN+PORT?"
        - "FRZ?"
        - "ITP?"
    - every_ms: 30000
      send:
        - { models: [eclipse, m-rgb, griffyn, sapphire-4k40-rgbh, d4k40-rgb, mirage-sst], message: "LAS+POWR?" }
        - "OSD?"
        - "MSP?"
        - { models: [eclipse, m-rgb, griffyn, sapphire-4k40-rgbh, d4k40-rgb, boxer-4k, boxer-2k, boxer-30], message: "STH+MODE?" }
        - { models: [eclipse], message: "SHU+INHB?" }
        - { models: [d4k40-rgb], message: "SHU+BLND?" }
        - { models: [d4k40-rgb], message: "VID+BLND?" }
        - { models: [eclipse, m-rgb, griffyn, sapphire-4k40-rgbh], message: "TMC+MODE?" }
        - { models: [eclipse, m-rgb, griffyn, sapphire-4k40-rgbh, mirage-sst], message: "TDD?" }
        - { models: [eclipse, m-rgb, griffyn, sapphire-4k40-rgbh, mirage-sst], message: "TDN?" }
        - { models: [eclipse, m-rgb, griffyn, sapphire-4k40-rgbh, mirage-sst], message: "TDO?" }
        - { models: [sapphire-4k40-rgbh], message: "PHL?" }
        - { models: [m-rgb], message: "SSP+SLCT?" }
        - { models: [d4k40-rgb, mirage-sst, boxer-4k, boxer-2k, boxer-30], message: "UST+ENBL?" }
        - { models: [eclipse, m-rgb, griffyn, sapphire-4k40-rgbh], message: "CAV+MODE?" }
        - "WRP+KGAN?"
        - "KEN+WIRE?"
        - "FRD+STAT?"
        - "FRD+TIME?"
        - "GIO+CNFG?"
        - "GIO+STAT?"
        - { models: [m-rgb, griffyn, d4k40-rgb], message: "LAS+CSRX?" }
        - { models: [m-rgb, griffyn, d4k40-rgb], message: "LAS+CSRY?" }
        - { models: [m-rgb, griffyn, d4k40-rgb], message: "LAS+CSRZ?" }
    - every_ms: 300000
      send:
        - "SST?"
    - every_ms: 3600000
      send:
        - "PNG?"
        - "OTR?"
        - "OTR+HRES?"
        - "OTR+VRES?"
        - "NET+ETH0?"
        - "NET+SUB0?"
        - "NET+GATE?"
        - "NET+MAC0?"
        - "NET+PORT?"
        - "ADR?"
        - "BDR+PRTA?"
        - "LOC+LANG?"
        - "LOC+TEMP?"
        - "TMD+DATE?"
        - "TMD+TIME?"
        - "UID?"
        - { models: [eclipse, m-rgb, griffyn, sapphire-4k40-rgbh], message: "CHA?L" }
        - "SIN?L"
        - "ITP?L"
        - "PRO?L"
        - "WRP+SLCT?L"
        - "EBL+SLCT?L"
        - "EBB+SLCT?L"
        - "FCS?m"
        - "LHO?m"
        - "LVO?m"
        - "ZOM?m"
        - { models: [boxer-4k, boxer-2k, boxer-30], message: "LPP?m" }
        - { models: [boxer-4k, boxer-2k, boxer-30], message: "HIS?" }
        - { models: [d4k40-rgb, mirage-sst, boxer-4k, boxer-2k, boxer-30], message: "BST?L" }
        - { models: [d4k40-rgb, mirage-sst, boxer-4k, boxer-2k, boxer-30], message: "BST+TEST?L" }
  updates:
    - match: '^\(#?PWR\s*[01]\)$'
      then_send: ["PWR?"]
    - match: '^\(PWR!\s*(\d+)[\s)]'
      state: { "power.state": "{1}" }
    - match: '^\(PWR!\s*\d+\s+"([^"]*)"'
      state: { "power.state_text": "{1}" }
    - match: '^\(#?PWR\+ELEC(?:!\s*0*|\s*)([01])[\s)]'
      state: { "power.keep_electronics_on": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?APW(?:!\s*0*|\s*)([01])[\s)]'
      state: { "power.auto_power_on": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?CHA(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "input.channel": "{1}" }
    - match: '^\(#?CHA\s*[-\w"]'
      then_send: ["CHA?"]
    - match: '^\(CHA!\s*\d+\s+"([^"]*)"'
      state: { "input.channel_name": "{1}" }
    - match: '^\(CHA!L0*([01]) \d+ (-?\d+) "([^"]*)'
      state: { "options.channels.{2}.name": "{3}", "options.channels.{2}.available": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?SIN(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "input.selected": "{1}" }
    - match: '^\(#?SIN\s*[-\w"]'
      then_send: ["SIN?"]
    - match: '^\(SIN!\s*\d+\s+"([^"]*)"'
      state: { "input.selected_name": "{1}" }
    - match: '^\(SIN!L0*([01]) \d+ (-?\d+) "([^"]*)'
      state: { "options.inputs.{2}.name": "{3}", "options.inputs.{2}.available": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?SIN\+PORT(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "input.port_configuration": "{1}" }
    - match: '^\(#?SIN\+PORT\s*[-\w"]'
      then_send: ["SIN+PORT?", "SIN?L"]
    - match: '^\(SIN\+PORT!\s*\d+\s+"([^"]*)"'
      state: { "input.port_configuration_name": "{1}" }
    - match: '^\(#?CHL\+INPT(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "input.christie_link_input": "{1}" }
    - match: '^\(#?FIB\+(SLT[AB])(?:!\s*0*|\s*)([01])[\s)]'
      state: { "input.christie_link_video.{1}": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^\(#?CAV\+MODE(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "video.input_fpga_mode": "{1}" }
    - match: '^\(#?CAV\+MODE\s*[-\w"]'
      then_send: ["CAV+MODE?"]
    - match: '^\(#?DDD(?:!\s*0*|\s*)([01])[\s)]'
      state: { "video.dual_link_dvi_disabled": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?LOE(?:!\s*0*|\s*)([01])[\s)]'
      state: { "video.loop_out": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?SDI(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "video.sdi_payload_override": "{1}" }
    - match: '^\(#?SDI\+PAYL(?:!\s*|\s*)"([^"]*)"'
      state: { "video.sdi_custom_payload": "{1}" }
    - match: '^\(#?EDO(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "video.edid_frame_rate": "{1}" }
    - match: '^\(#?EDO\+ADVN(?:!\s*0*|\s*)([01])[\s)]'
      state: { "video.edid_default_mode": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?EDO\+COLM(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "video.edid_window": "{1}" }
    - match: '^\(#?FMD(?:!\s*0*|\s*)([01])[\s)]'
      state: { "video.film_mode_detect": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?FRD(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "video.frame_delay": "{1}" }
    - match: '^\(#?FRD\s*[-\w"]'
      then_send: ["FRD+STAT?", "FRD+TIME?"]
    - match: '^\(FRD\+STAT!\s*(-?\d+)'
      state: { "video.frame_delay_actual": "{1}" }
    - match: '^\(FRD\+TIME!\s*"([^"]*)'
      state: { "video.frame_delay_time": "{1}" }
    - match: '^\(#?PHL(?:!\s*0*|\s*)([01])[\s)]'
      state: { "video.phase_locking_disabled": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?PHL\s*[-\w"]'
      then_send: ["PHL?"]
    - match: '^\(#?THM(?:!\s*0*|\s*)([01])[\s)]'
      state: { "video.thumbnails": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?SHU(?:!\s*0*|\s*)([01])[\s)]'
      state: { "shutter.closed": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?SHU\s*[-\w"]'
      then_send: ["SHU?"]
    - match: '^\(#?SHU\+INHB(?:!\s*0*|\s*)([01])[\s)]'
      state: { "shutter.inhibit": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?SHU\+INHB\s*[-\w"]'
      then_send: ["SHU+INHB?"]
    - match: '^\(#?SHU\+BLND(?:!\s*0*|\s*)([01])[\s)]'
      state: { "shutter.keep_black_level_blend": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?SHU\+BLND\s*[-\w"]'
      then_send: ["SHU+BLND?"]
    - match: '^\(#?SHU\+SERV(?:!\s*0*|\s*)([01])[\s)]'
      state: { "shutter.monitoring_disabled": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?FRZ(?:!\s*0*|\s*)([01])[\s)]'
      state: { "image.frozen": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?FRZ\s*[-\w"]'
      then_send: ["FRZ?"]
    - match: '^\(#?ITP(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "test_pattern.index": "{1}" }
    - match: '^\(#?ITP\s*[-\w"]'
      then_send: ["ITP?"]
    - match: '^\(ITP!L0*([01]) \d+ (-?\d+) "([^"]*)'
      state: { "options.test_patterns.{2}.name": "{3}", "options.test_patterns.{2}.available": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?ITP\+FREQ(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "test_pattern.frequency": "{1}" }
    - match: '^\(#?ITP\+GRDP(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "test_pattern.grid_pitch": "{1}" }
    - match: '^\(#?ITP\+GREY(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "test_pattern.gray": "{1}" }
    - match: '^\(#?ITP\+RMPL(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "test_pattern.ramp_level": "{1}" }
    - match: '^\(#?ITP\+RMPM(?:!\s*|\s*)(-?\d+)[\s)]'
