  set_enhanced_healing:
    summary: "Turn enhanced DMD healing on or off (ENH+SLCT)"
    params:
      value: { type: "bool", required: true, label: "Enhanced healing", description: "True runs 20 minutes of gray pattern with the laser on at the start of cooling down, for sites with long black regions." }
    send: "#ENH+SLCT {value:bool01}"
    expect: { reply_contains: "ENH+SLCT {value:bool01}", matches: '^\(#?[A-Za-z]' }
