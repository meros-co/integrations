      trap: { type: "enum", values: ["light_source_faults", "light_source_life", "power", "signal", "cooling", "temperature"], required: true, label: "Trap", description: "light_source_faults (not on Mirage SST), light_source_life (TruLife+ and Boxer), power state changes, video signal changes, cooling (fan) faults, temperature faults." }
