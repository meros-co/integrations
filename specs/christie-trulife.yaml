      value: { type: "int", min: 0, max: 1, required: true, label: "Output resolution", description: "0 = 4096x2160 (4K), 1 = 2048x1080 (2K); needs the HFR or Mirage license, and a restart afterwards." }
    send: "#OTR {value}"
    expect: { reply_contains: "OTR {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_output_resolution:
    summary: "Read the output resolution (OTR?)"
    send: "OTR?"
    expect: { reply_contains: "OTR!", matches: 'OTR!\s*"?([^")]*)' }
    returns: value
  get_output_columns:
    summary: "Read the number of output columns (OTR+HRES?)"
    send: "OTR+HRES?"
    expect: { reply_contains: "OTR+HRES!", matches: 'OTR\+HRES!\s*(\d+)' }
    returns: value
  get_output_rows:
    summary: "Read the number of output rows (OTR+VRES?)"
    send: "OTR+VRES?"
    expect: { reply_contains: "OTR+VRES!", matches: 'OTR\+VRES!\s*(\d+)' }
    returns: value
  set_color_table:
    summary: "Select the color table (CCA+SLCT)"
    params:
      value: { type: "int", min: 0, max: 7, required: true, label: "Color table", description: "0 = max drives (no color adjustment), 1 = color temperature, 2 = HD video (BT.709), 3 = custom, 4 = auto detect, 5 = DCI P3, 6 = DCI P3 (D65), 7 = ITU-R BT.2020." }
    send: "#CCA+SLCT {value}"
    expect: { reply_contains: "CCA+SLCT {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  copy_color_table:
    summary: "Copy one of the predefined color tables into the custom table (CCA+COPY)"
    params:
      value: { type: "int", min: 0, max: 7, required: true, label: "Source table", description: "0 = max drives, 1 = color temperature, 2 = HD video (BT.709), 5 = DCI P3, 6 = DCI P3 (D65), 7 = ITU-R BT.2020." }
    send: "#CCA+COPY {value}"
    expect: { reply_contains: "CCA+COPY {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_color_temperature:
    summary: "Set the color temperature (CCA+CTMP)"
    params:
      value: { type: "int", min: 3200, max: 9300, required: true, label: "Color temperature", description: "Color temperature in kelvin, 3200 to 9300 (6500 by default); used when the color table is color temperature." }
    send: "#CCA+CTMP {value}"
    expect: { reply_contains: "CCA+CTMP {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_custom_color_coordinate:
    summary: "Set a point of the custom color table as CIE 1931 x,y (CCA+RDCX ... WHCY)"
    params:
      point: { type: "enum", values: ["red", "green", "blue", "white"], required: true, label: "Point", description: "The primary or white point to set." }
      axis: { type: "enum", values: ["x", "y"], required: true, label: "Axis", description: "The CIE 1931 x or y coordinate." }
      value: { type: "int", min: 0, max: 10000, required: true, label: "Coordinate", description: "Coordinate times 10000 (3350 = 0.3350); the valid range depends on the point." }
    send: "#CCA+{point:map.cca_point}C{axis:map.cca_axis} {value}"
    expect: { reply_contains: "CCA+", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_native_primary:
    summary: "Set a native color primary of the projector as CIE 1931 x,y (CCA+RDPX ... WHPY, service access)"
    params:
      point: { type: "enum", values: ["red", "green", "blue", "white"], required: true, label: "Point", description: "The native primary or white point." }
      axis: { type: "enum", values: ["x", "y"], required: true, label: "Axis", description: "The CIE 1931 x or y coordinate." }
      value: { type: "int", min: 0, max: 10000, required: true, label: "Coordinate", description: "Measured coordinate times 10000; the valid range depends on the point." }
    send: "#CCA+{point:map.cca_point}P{axis:map.cca_axis} {value}"
    expect: { reply_contains: "CCA+", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_custom_color_saturation:
    summary: "Set how much of a native component a target color takes in the custom table (CCA+ROFG ... BOFW)"
    params:
      component: { type: "enum", values: ["red", "green", "blue"], required: true, label: "Component", description: "The native red, green or blue component." }
      target: { type: "enum", values: ["red", "green", "blue", "white"], required: true, label: "Of", description: "The target color the component contributes to." }
      value: { type: "int", min: -1000, max: 1000, required: true, label: "Amount", description: "Share in tenths of a percent (1000 = 100 %): -1000 to 1000 for a component of another primary, 0 to 1000 for a primary's own component and for white." }
    send: "#CCA+{component:map.cca_rgb}OF{target:map.cca_of} {value}"
    expect: { reply_contains: "CCA+", matches: '^\(#?[A-Za-z]' }
    returns: ack
  reset_native_primaries:
    summary: "Reset the native color primaries to their saved defaults (CCA+RSET, service access)"
    send: "#CCA+RSET"
    expect: { reply_contains: "CCA+RSET", matches: '^\(#?[A-Za-z]' }
    returns: ack
  save_native_primaries:
    summary: "Save the native color primaries as the new defaults (CCA+SAVE, service access)"
    send: "#CCA+SAVE"
    expect: { reply_contains: "CCA+SAVE", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_color_uniformity:
    summary: "Turn 1D color uniformity on or off (CUC+SLCT)"
    params:
      value: { type: "int", min: 0, max: 2, required: true, label: "Mode", description: "0 = 1D color uniformity off, 1 = on (from the measured points), 2 = custom uniformity from a file (TruLife+)." }
    send: "#CUC+SLCT {value}"
    expect: { reply_contains: "CUC+SLCT {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_color_uniformity_point:
    summary: "Enter a measured luminance or x,y value of one primary at one point for 1D color uniformity (CUC+H<p><c><m>)"
    params:
      point: { type: "int", min: 1, max: 5, required: true, label: "Point", description: "Measurement point 1 to 5 (the screen positions 15, 2, 5, 8 and 16)." }
      color: { type: "enum", values: ["red", "green", "blue"], required: true, label: "Color", description: "The primary measured." }
      measure: { type: "enum", values: ["luminance", "x", "y"], required: true, label: "Measure", description: "Luminance, or the x or y coordinate." }
      value: { type: "string", max_length: 12, pattern: "^[0-9]{1,5}(\\.[0-9]{1,4})?$", required: true, label: "Value", description: "The measured value as digits with an optional decimal part, as the family documents it (TruLife+ examples use whole numbers such as 5322; Mirage SST documents 0 to 99999.99 for luminance and 0 to 0.9999 for x and y)." }
    send: "#CUC+H{point}{color:map.cca_rgb}{measure:map.cuc_measure} {value}"
    expect: { reply_contains: "CUC+H{point}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_laser_power:
    summary: "Set the overall laser power (LAS+POWR)"
    params:
      value: { type: "int", min: 0, max: 1000, required: true, label: "Laser power", description: "Overall laser output in tenths of a percent, 0 to 1000 (750 by default on TruLife+, 500 on Mirage SST), keeping the ratio between colors." }
    send: "#LAS+POWR {value}"
    expect: { reply_contains: "LAS+POWR {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_laser_power:
    summary: "Read the overall laser power (LAS+POWR?)"
    send: "LAS+POWR?"
    expect: { reply_contains: "LAS+POWR!", matches: 'LAS\+POWR!\s*(-?\d+)' }
    returns: value
  set_laser_drive:
    summary: "Set the drive level of the red, green or blue lasers (LAS+REDP, GRNP, BLUP)"
    params:
      color: { type: "enum", values: ["red", "green", "blue"], required: true, label: "Color", description: "The laser color." }
      value: { type: "int", min: 0, max: 1000, required: true, label: "Drive", description: "Drive level in tenths of a percent, 0 to 1000; what reaches the lasers is reduced by the overall laser power. 4K40-RGB: only with LiteLOC off (LAS+MODE 1)." }
    send: "#LAS+{color:map.laser_color} {value}"
    expect: { reply_contains: "LAS+", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_phosphor_drive:
    summary: "Set the phosphor pump drive level (LAS+PHOP)"
    params:
      value: { type: "int", min: 0, max: 1000, required: true, label: "Phosphor drive", description: "Drive level of the phosphor pumps in tenths of a percent, 0 to 1000, used while LiteLOC is off." }
    send: "#LAS+PHOP {value}"
    expect: { reply_contains: "LAS+PHOP {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_liteloc_mode:
    summary: "Turn LiteLOC (constant brightness) on or off (LAS+MODE)"
    params:
      value: { type: "int", min: 0, max: 4, required: true, label: "LiteLOC", description: "TruLife+: 0 = LiteLOC 1 (deprecated), 1 = LiteLOC off, 2 = LiteLOC 2 (deprecated), 3 = LiteLOC on (default), 4 = LiteLOC on (default on the Sapphire 4K40-RGBH); 4K40-RGB: 0 = LiteLOC 1, 1 = off (default), 2 = LiteLOC 2." }
    send: "#LAS+MODE {value}"
    expect: { reply_contains: "LAS+MODE {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_white_target:
    summary: "Set the white point target of the laser system (LAS+WHTX, WHTY)"
    params:
      axis: { type: "enum", values: ["x", "y"], required: true, label: "Axis", description: "The CIE x or y coordinate." }
      value: { type: "int", min: 2500, max: 4500, required: true, label: "Target", description: "Coordinate times 10000, 2500 to 4500 (defaults 3127 and 3290)." }
    send: "#LAS+WHT{axis:map.xy} {value}"
    expect: { reply_contains: "LAS+WHT", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_camera_friendly_color:
    summary: "Turn camera friendly color mode on or off (LAS+CFCM)"
    params:
      value: { type: "bool", required: true, label: "Camera friendly", description: "True targets a bluer white that reduces the red cast phone cameras show on RGB laser projection." }
    send: "#LAS+CFCM {value:bool01}"
    expect: { reply_contains: "LAS+CFCM {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_camera_friendly_white:
    summary: "Set the white target of camera friendly color mode (LAS+CFWX, CFWY)"
    params:
      axis: { type: "enum", values: ["x", "y"], required: true, label: "Axis", description: "The CIE x or y coordinate." }
      value: { type: "int", min: 2500, max: 4500, required: true, label: "Target", description: "Coordinate times 10000, 2500 to 4500 (defaults 2740 and 3250)." }
    send: "#LAS+CFW{axis:map.xy} {value}"
    expect: { reply_contains: "LAS+CFW", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_color_sensor:
    summary: "Read the color sensor X, Y or Z reading (LAS+CSRX?, CSRY?, CSRZ?)"
    params:
      axis: { type: "enum", values: ["x", "y", "z"], required: true, label: "Axis", description: "The sensor reading to read." }
    send: "LAS+CSR{axis:map.xyz}?"
    expect: { reply_contains: "LAS+CSR", matches: '!\s*"?([^")]*)' }
