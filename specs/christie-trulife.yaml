maps:
  link_slot: { A: "SLTA", B: "SLTB" }
  blank_edge: { top: "TOPP", bottom: "BOTP", left: "LFTP", right: "RGTP" }
  blo_color: { red: "REDO", green: "GRNO", blue: "BLUO" }
  cca_point: { red: "RD", green: "GN", blue: "BL", white: "WH" }
  cca_axis: { x: "X", y: "Y" }
  cca_rgb: { red: "R", green: "G", blue: "B" }
  cca_of: { red: "R", green: "G", blue: "B", white: "W" }
  cuc_measure: { luminance: "L", x: "X", y: "Y" }
  laser_color: { red: "REDP", green: "GRNP", blue: "BLUP" }
  xy: { x: "X", y: "Y" }
  xyz: { x: "X", y: "Y", z: "Z" }
  lens_axis: { horizontal: "H", vertical: "V", zoom: "Z", focus: "F" }
  snmp_trap: { light_source_faults: "LAMP", light_source_life: "LIFE", power: "POWR", signal: "SIGN", cooling: "STAL", temperature: "THRM" }
  keypad: { front_ir: "FRNT", rear_ir: "REAR", wired: "WIRE", hdbaset_ir: "HDBT" }

commands:
  set_power:
    summary: "Turn the projector on or off (PWR)"
    params:
      value: { type: "bool", required: true, label: "On", description: "True turns the projector on, false turns it off (it cools down, then goes to standby)." }
    send: "#PWR {value:bool01}"
    expect: { reply_contains: "PWR {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_power:
    summary: "Read the power state (PWR?): 0 standby, 1 on, 10 cooling down, 11 warming up"
    send: "PWR?"
    expect: { reply_contains: "PWR!", matches: 'PWR!\s*(-?\d+)' }
    returns: value
  set_keep_electronics_on:
    summary: "Keep the video electronics on in standby (PWR+ELEC)"
    params:
      value: { type: "bool", required: true, label: "Keep electronics on", description: "True keeps the video electronics on in standby whatever the light source does (electronics override)." }
    send: "#PWR+ELEC {value:bool01}"
    expect: { reply_contains: "PWR+ELEC {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_auto_power_on:
    summary: "Turn auto power on after AC loss on or off (APW)"
    params:
      value: { type: "bool", required: true, label: "Auto power on", description: "True powers the projector up again if it was on when AC power was lost." }
    send: "#APW {value:bool01}"
    expect: { reply_contains: "APW {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_channel:
    summary: "Select the source channel, port configuration and input in one step (CHA)"
    params:
      value: { type: "int", min: 600, max: 699, required: true, label: "Channel", description: "Channel number as listed by CHA?L: 600 HDMI0, 601 HDMI1, 603 DP0, 604 DP1, 606 to 609 SDI0 to SDI3, 611 SDVoE, 612 Christie Link A, 614 VOM-HDMI, 615 VOM-DP0, 616 VOM-DP1, 620 two-port HDMI, 621 two-port DP, 622 four-port SDI, 623 two-port VOM-DP, 630 to 635 dual-input 3D pairs, 636 four-port DP." }
    send: "#CHA {value}"
    expect: { reply_contains: "CHA {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_channel:
    summary: "Read the selected channel (CHA?)"
    send: "CHA?"
    expect: { reply_contains: "CHA!", matches: 'CHA!\s*(-?\d+)' }
    returns: value
  get_channel_list:
    summary: "Read the list of available channels (CHA?L)"
    send: "CHA?L"
    expect: { reply_contains: "CHA!L", matches: '!L(.*)\)$' }
    returns: value
  set_input:
    summary: "Select the active input of the current port configuration (SIN)"
    params:
      value: { type: "int", min: 0, max: 99, required: true, label: "Input", description: "Input number as listed by SIN?L for the selected port configuration (0 = None); the list depends on the configuration and the option cards or VOM fitted." }
    send: "#SIN {value}"
    expect: { reply_contains: "SIN {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_input:
    summary: "Read the selected input (SIN?, general request form)"
    send: "SIN?"
    expect: { reply_contains: "SIN!", matches: 'SIN!\s*(-?\d+)' }
    returns: value
  get_input_list:
    summary: "Read the list of inputs of the current port configuration (SIN?L)"
    send: "SIN?L"
    expect: { reply_contains: "SIN!L", matches: '!L(.*)\)$' }
    returns: value
  set_port_configuration:
    summary: "Select the input port configuration (SIN+PORT)"
    params:
      value: { type: "int", min: 1, max: 10, required: true, label: "Port configuration", description: "1 = one-port, 2 = two-port, 3 = four-port columns (4K40-RGB, Mirage SST, Boxer), 4 = four-port quadrants, 5 = one-port dual-input 3D, 6 = two-port dual-input 3D, 7 = four-port columns dual-input 3D, 8 = four-port quadrants dual-input 3D (Mirage SST), 9 = four-port 4 viewer 2D, 10 = four-port 2 viewer 3D (TruLife+ with the Mirage license; 5 too)." }
    send: "#SIN+PORT {value}"
    expect: { reply_contains: "SIN+PORT {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_port_configuration:
    summary: "Read the input port configuration (SIN+PORT?)"
    send: "SIN+PORT?"
    expect: { reply_contains: "SIN+PORT!", matches: 'SIN\+PORT!\s*(-?\d+)' }
    returns: value
  set_christie_link_input:
    summary: "Choose which Christie Link port feeds the video mux (CHL+INPT)"
    params:
      value: { type: "int", min: 0, max: 2, required: true, label: "Christie Link input", description: "0 = Christie Link input and loop-out (the default behavior), 1 = Christie Link port 1, 2 = Christie Link port 2." }
    send: "#CHL+INPT {value}"
    expect: { reply_contains: "CHL+INPT {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_christie_link_video:
    summary: "Turn Christie Link video on the option card in slot A or B on or off (FIB+SLTA, FIB+SLTB)"
    params:
      slot: { type: "enum", values: ["A", "B"], required: true, label: "Slot", description: "Option card slot: A (FIB+SLTA, the only one on the 4K40-RGB and Boxer 4K) or B (FIB+SLTB)." }
      value: { type: "bool", required: true, label: "Enabled", description: "True takes video from the Christie Link card; the other inputs of the HBMIC are then inactive." }
    send: "#FIB+{slot:map.link_slot} {value:bool01}"
    expect: { reply_contains: "FIB+", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_video_input_configuration:
    summary: "Select the CAVE board scaler FPGA image, DisplayPort or SDVoE (CAV+MODE)"
    params:
      value: { type: "int", min: 0, max: 1, required: true, label: "Input FPGA mode", description: "0 = DisplayPort mode, 1 = SDVoE mode; the scaler FPGA reloads, which takes 15 to 20 seconds." }
    send: "#CAV+MODE {value}"
