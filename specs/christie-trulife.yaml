  set_shifted_superposition:
    summary: "Turn shifted superposition (the resolution actuator) on or off (SSP+SLCT)"
    params:
      value: { type: "bool", required: true, label: "Actuator", description: "True runs the actuator (shifted superposition, twice the DMD resolution each way); service access is required." }
    send: "#SSP+SLCT {value:bool01}"
