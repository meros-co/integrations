  set_lens_vertical:
    summary: "Move the lens vertical shift to an absolute position (LVO)"
    params:
      value: { type: "int", min: -65535, max: 65535, required: true, label: "Position", description: "Absolute vertical shift position, within the range LVO?m reports after the last lens calibration." }
    send: "#LVO {value}"
    expect: { reply_contains: "LVO {value}", matches: '^\(#?[A-Za-z]' }
