    summary: "Choose which lamps are active in full power mode (LOP+MULT)"
    params:
      value: { type: "int", min: 1, max: 63, required: true, label: "Lamps", description: "Sum of the lamps to use: 1 = A1, 2 = A2, 4 = A3, 8 = B1, 16 = B2, 32 = B3 (63 = all, the default); at least one, installed lamps only." }
