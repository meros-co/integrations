      value: { type: "bool", required: true, label: "Messages", description: "True lets the projector send its FYI and ERR messages unasked (the default); this spec reads status changes from them." }
    send: "#EME {value:bool01}"
    expect: { reply_contains: "EME {value:bool01}", matches: '^\(#?[A-Za-z]' }
