  set_snmp_read_community:
    summary: "Set the SNMP read community (SNM+READ)"
    params:
      value: { type: "string", max_length: 32, pattern: "^[^\"()\\\\]*$", required: true, label: "Community", description: "SNMP read community name (password on the older families), up to 32 characters; private by default." }
    send: "#SNM+READ \"{value}\""
    expect: { reply_contains: "SNM+READ \"{value}\"", matches: '^\(#?[A-Za-z]' }
