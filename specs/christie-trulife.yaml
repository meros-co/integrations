  status.items.*.*.state: { type: "int", description: "Status item condition: 0 = OK, 1 = warning, 2 = error; keyed by group and item index" }
  status.items.*.*.value: { type: "string", description: "Status item value as the projector words it, keyed by group and item index" }
  status.items.*.*.name: { type: "string", description: "Status item name, keyed by group and item index" }
  status.items.*.*.number: { type: "float", description: "The number a status item's value starts with (degrees, RPM, hours, volts), keyed by group and item index" }
  device.model: { type: "string", description: "Projector model (status item Projector Model)" }
  device.serial_number: { type: "string", description: "Projector serial number (status item Projector S/N)" }
  device.native_resolution: { type: "string", description: "Native output resolution (status item Output Resolution)" }
  device.build_date: { type: "string", description: "Build date of the projector (status item Projector Build Date)" }
  device.firmware_version: { type: "string", description: "Main control board software version (status item Main Control Board SW Version)" }
  status.projector_hours: { type: "int", description: "Projector hours, warm-up and cool-down included (status item Projector Hours)" }
  status.projector_minutes: { type: "int", description: "Minutes past the projector hours (status item Projector Hours)" }
  status.light_hours.*.*: { type: "int", description: "Light source hours (laser on, laser standby or lamp hours items), keyed by group and item index" }
  status.temperatures.*.value: { type: "float", description: "Temperature in the unit set by LOC+TEMP, keyed by the TEMP item index" }
  status.temperatures.*.name: { type: "string", description: "Name of the temperature sensor, keyed by the TEMP item index" }
  status.temperatures.*.state: { type: "int", description: "Condition of the temperature: 0 = OK, 1 = warning, 2 = error" }
  status.last_message.type: { type: "string", description: "Type of the last asynchronous message: FYI or ERR" }
  status.last_message.code: { type: "int", description: "Code of the last asynchronous message, such as 916 for a date or time change" }
  status.last_message.text: { type: "string", description: "Text of the last asynchronous message (cut at its first closing parenthesis)" }
  status.last_error.code: { type: "int", description: "Code of the last error reply: 3 to 10 and 101 to 118, as the TruLife+ reference lists them" }
  status.last_error.text: { type: "string", description: "Text of the last error reply, such as \"ITP: Too Few Parameters\"" }
  events.*.time: { type: "string", description: "Time of a logged event, keyed by the event number" }
  events.*.severity: { type: "string", description: "Severity of a logged event, such as OK or Error" }
  events.*.text: { type: "string", description: "Text of a logged event (cut at its first closing parenthesis)" }
  options.self_test_suites.*.name: { type: "string", description: "Name of each self test suite, keyed by its number, from BST?L" }
  options.self_test_suites.*.available: { type: "bool", description: "Whether the projector lists the self test suite as available (L001) or not (L000)" }
  options.self_tests.*.name: { type: "string", description: "Name of each self test, keyed by its number, from BST+TEST?L" }
  options.self_tests.*.available: { type: "bool", description: "Whether the projector lists the self test as available (L001) or not (L000)" }
  self_test.results.*.result: { type: "string", description: "Built-in self test result, keyed by the result number BST answers with" }
  self_test.results.*.detail: { type: "string", description: "Detail of a failed built-in self test" }

quirks:
  - models: [all]
    severity: info
    text: >
      Every message is in parentheses. A set is sent with the "#" prefix, which the references document as a
      request for a full acknowledgment: the projector echoes the message once it has finished processing it, and
      the command waits for that echo. Whether the echo keeps the "#" is not documented; the commands and rules
      accept both. Requests carry no "#" and are answered "(CODE!value)", the value zero-padded to a fixed width
      and often followed by a quoted text, as in "(PWR!001 "On")". Several queued replies may arrive in one
      packet; each parenthesized message is read on its own.
  - models: [all]
    severity: warning
    text: >
      The references say that while powering up (20 seconds or more) the projector answers late but keeps every
      request queued, and that the acknowledgment of a set comes only when it has been carried out. The reply
      timeout is therefore 30 s. Power on and off, lens calibration, the CAV+MODE FPGA reload (15 to 20 s), BST
      self tests and the rebooting commands (toggle_high_frame_rate, reboot) can still outlast it, so such a
      command may report a timeout although the projector accepted it. The power state is read with PWR? every 5 s
      and after each power echo.
  - models: [all]
    severity: info
    text: >
      The general message format documents "(Code ?)" and "(Code+Subcode ?)" for any code, but most codes only
      document a set. The documented queries are offered as get_* commands and polled; SIN?, FRZ?, ITP? and
      TMD+DATE? use the general form. Settings without a query are read back from the echo of each set, so state
      shows what was last set through this connection, not changes made on the keypad, web page or another
      connection. request sends any query in the general form; a code that does not answer it gets an error reply.
  - models: [all]
    severity: info
    text: >
      An error is answered as "(65535 00000 ERR00005 "ITP: Too Few Parameters")" and fails the waiting command;
      its code and text are kept in status.last_error. The TruLife+ reference lists the codes: 3 invalid
      parameter, 4 too many parameters, 5 too few parameters, 6 channel not found, 7 command not executed, 8
      checksum error, 9 unknown request, 10 error receiving serial data, 101 control not found, 102 subcontrol not
      found, 103 wrong control type, 104 invalid value, 105 disabled control, 106 invalid language, 107 exceeded
      list size, 110 communication timeout, 111 communications failure, 112 failed to set hardware, 113 bad file,
      114 memory failure, 115 not implemented, 116 invalid security, 117 invalid access group, 118 system busy
      (try again later); the other references give only the example. The spec format's code table needs a leading
      numeric code, which this reply does not have, so the table is kept here. ERR00000 is not an error reply but
      the asynchronous status message below, and is not taken as one.
  - models: [all]
    severity: info
    text: >
      With EME 1 (the default) the projector sends messages unasked: FYI00916 when the date or time is set,
      FYI00919 after factory defaults, FYI00915 with the new IP address, mask and gateway when the network changes
      (read into network.*), FYI01901 when an option card is detected or removed (4K40-RGB), and FYI00000 or
      ERR00000 naming a status item ("(SST+LAMP?001) ...") whenever one changes between OK, warning and error. The
      last of these makes the spec read that item again at once, so status changes are pushed; every status item
      is also polled every 5 minutes. Each message's type, code and text are kept in status.last_message. With EME
      0 nothing is pushed and status follows the polls only.
  - models: [all]
    severity: warning
    text: >
      A message ends at the first ")". The references say text sends parentheses as \( and \), but their
      asynchronous, event log and status examples hold bare ones ("Integrator Rod Temperature (Temp 1)",
      "(SST+TEMP?002) Air Intake ..."); either way such a message is cut there. The rules read what comes before
      the cut: a status item's description ending in a parenthesis is kept whole, while an event or message text
      keeps only its first part, and the rest arrives as fragments no rule matches. Text parameters refuse quotes,
      parentheses and backslashes for the same reason.
  - models: [all]
    severity: info
    text: >
      The "$" simple acknowledgment and the "&" checksum prefix are documented but not used: the "#" echo already
      confirms each set, and TCP carries its own checksum. ADR addresses projectors on an RS-232 daisy chain; over
      TCP each projector is its own connection, so no address prefix is sent.
  - models: [all]
    severity: info
    text: >
      List queries (CHA?L, SIN?L, ITP?L, PRO?L, WRP+SLCT?L, EBL+SLCT?L, EBB+SLCT?L, BST?L, BST+TEST?L) answer one
      message per item, "(ITP!L001 001 00001 "Grid")", ending with "(ITP!L111 "--END--")". Items are kept under
      options.* keyed by their number, with L001 read as available and L000 as not (the references call them
      enabled and disabled); the second number's meaning is not documented. The list command returns the first
      item only. Nothing marks the start of a list, so an item a later list no longer holds stays in state until
      the device is opened again.
  - models: [all]
    severity: critical
    text: >
      These cannot be undone from the API: factory_defaults (DEF 111) deletes every profile, warp, blend and
      custom test pattern and turns DHCP on; reboot (RBT 111) and toggle_high_frame_rate restart the projector;
      clear_profile erases a profile; recall_profile replaces every setting the profile holds;
      save_native_primaries, reset_native_primaries and save_black_level_offset_defaults overwrite calibration;
      set_video_input_configuration reloads the scaler FPGA (no video for 15 to 20 s). set_static_ip,
      set_static_ip_without_gateway, enable_dhcp, set_control_port and set_ethernet_access_level 0 can end this
      connection; the device must then be opened at its new address or port. The lens commands move the image at
      once.
  - models: [all]
    severity: warning
    text: >
      Technical bulletin 020-200567-01 removed LAS+EBLU, LAS+EGRN and LAS+ERED (switching the red, green and blue
      lasers) from the TruLife+ reference because using them damages the diffuser, and says to use PWR 1 to turn
      the laser on. The 4K40-RGB and Mirage SST references still list them, and the Mirage SST reference adds
      LAS+EPOW (all three at once). None of them is offered: set_power and set_shutter turn the light on and off.
  - models: [all]
    severity: info
    text: >
      Serial (link serial): every reference documents the same command set and message format for the RS232 IN
      port and for TCP 3002 ("Christie serial protocol over Ethernet"), so link serial sends the same messages;
      8 data bits, no parity and 1 stop bit are assumed. After set_baud_rate over the serial port, change the
      link's baud_rate to match. Baud rate BDR+PRTA 1 to 6 = 2400, 9600, 19200, 38400,
      57600, 115200, default 115200 ("on each port" on 4K40-RGB, Mirage SST and Boxer), set with service access.
      Flow control is Xon/Xoff in both directions (the projector sends 13h when its buffer fills and 11h when it
      can take more, and accepts up to 10 more bytes after 13h). Data bits, parity, stop bits and the connector
      are not stated in these references (they point to the user manuals; "a standard RS232 serial cable"); the
      port is on the Video Input panel (TruLife+) or the IMXB faceplate (4K40-RGB, Mirage SST, Boxer). RAL+PRTA
      sets the serial port's access level.
  - models: [all]
    severity: info
    text: >
      Ranges that differ between families take the union, each family's values given in the parameter description;
      a value outside a family's range is sent and refused with an error reply. Gamma function numbers differ: 0
      is auto detect on TruLife+ and the 4K40-RGB but sRGB on Mirage SST and Boxer, and 3 is classic or M-Series.
      No upper bound is documented for the custom gamma tables (100 and up), the lens positions (the ?m ranges),
      the 3D sync delay or the lamp power and life; the spec's bounds there are its own.
  - models: [all]
    severity: info
    text: >
      Status items arrive as "(SST+<group>!<index> <state> "<value>" "<description>")", the state 000 OK, 001
      warning, 002 error. Every item is kept under status.items.<group>.<index> with its state, value, name and
      the number its value starts with. Item numbers differ between families, so model, serial number, native
      resolution, build date, main software version, projector hours, light source hours and temperatures are
      recognized by the item's name in the description. Temperatures follow LOC+TEMP (Celsius or Fahrenheit); the
      degree sign is not ASCII and is read as a replacement character.
  - models: [all]
    severity: info
    text: >
      Polling: power, shutter, channel (TruLife+), input, port configuration, freeze and test pattern every 5 s;
      laser power, on-screen display, menu position, stealth mode, shutter options, fan profile, 3D sync settings,
      phase locking, actuator, UST lens area, FPGA mode, keystone gain, wired keypad, frame delay, GPIO and the
      color sensor every 30 s; every status item every 5 minutes; identity, network, address, baud rate, language,
      temperature unit, clock, user, the option lists, lens ranges, lamp power range, lamp history and self test
      lists every hour.
  - models: [all]
    severity: info
    text: >
      No credential is needed while RAL is 2 (free access, the default). With RAL 1 the connection is read-only
      until login (UID "user" "password"); service-level commands (BDR+PRTA, the native primaries and their save
      and reset, BLO+CALI, SSP+SLCT) need a service login. login sends the password in clear text, as the protocol
      does.
  - models: [all]
    severity: warning
    text: >
      Where references disagree with themselves the spec follows the syntax line: GPIO+TRIG (a four-letter code in
      the TruLife+ reference) is sent as GIO+TRIG with its pins in quotes like GIO+CNFG and GIO+STAT; GIO+CNFG
      examples use 0 where the table says O for output, and only I, O and X are accepted; the reply to GIO+CNFG?
      is printed as GIO+CONFG and both are read; BLO+BLUO and BLO+REDO describe each other's DMD and are taken by
      their names; BLO+MAXO has no documented range (0 to 100 is assumed, as for the offsets); LCB+HOME is sent
      with no value as the TruLife+ syntax shows. The 4K40-RGB reference shows the VID+BLND example as VID+BLDN.
  - models: [all]
    severity: info
    text: >
      Lens positions: FCS, LHO, LVO, ZOM and LMV move to absolute positions within the ranges FCS?m, LHO?m, LVO?m
      and ZOM?m report ("(ZOM!M-2400 900)"), and the echo gives the position set. No query for the current
      position is documented, so after run_lens_motor or step_lens_motor the position in state is the last
      absolute one.
  - models: [all]
    severity: info
    text: >
      BST self tests are sent without "#": their results come as replies, "(BST!000 "--Passed--")" or one
      "(BST!001 "Fail" "detail")" per failed test. EVT, HIS and the lists likewise answer with several messages;
      the command returns the first and every message goes to state.
  - models: [eclipse]
    severity: info
    text: >
      COO+HEPA applies to the Eclipse G3 only; SHU+INHB to the Eclipse.
  - models: [m-rgb]
    severity: info
    text: >
      LAS+ELBM (low brightness mode) applies to the M 4K25 RGB and M 4K+25 RGB only; SSP+SLCT needs service access
      and may cause video artifacts when changed.
  - models: [griffyn]
    severity: info
    text: >
      LAS+MAXA, LAS+MAXH and LAS+UDEC apply to the Griffyn 4K32-RGB only; fan profile 2 (performance) to the
      4K35-RGB and 4K50-RGB.
  - models: [m-rgb, griffyn]
    severity: info
    text: >
      RealBlack (RBK) must be enabled and saved in each profile; switching profiles otherwise loses it.
  - models: [eclipse, m-rgb, griffyn, sapphire-4k40-rgbh, mirage-sst]
    severity: info
    text: >
      The 3D commands (TDM, TDD, TDN, TDO, TDT, DRK) need the Mirage license, and HFR+ENBL the Mirage (Pro) or HFR
      license with the projector in standby; without it they get an error reply.
  - models: [mirage-sst]
    severity: warning
    text: >
      The Mirage SST status system reference (020-103007) was not available, so its status groups are not known;
      every status item is read with SST? and kept generically.
  - models: [boxer-4k, boxer-2k, boxer-30]
    severity: info
    text: >
      The Boxer families use lamps: LOP, LOP+MULT, LPL, LPP and HIS replace the LAS laser commands. The LPP?m
      reply is assumed to read like the lens ranges ("(LPP!M<min> <max>)"); the reference gives no example. PWR 0
      fails while a housekeeping board failure keeps the projector on until AC power is removed.
  - models: [boxer-4k, boxer-2k, boxer-30]
    severity: info
    text: >
      HIS documents ten fields per lamp entry (number, install date, serial, type, strikes, failed strikes, failed
      re-strikes, unexpected lamp offs, pre-installation hours, total hours) but its examples hold one number
      fewer, so the counts between the type and the last number are kept as one text
      (light.lamp_history.*.counters) and the last number is read as the total lamp hours.
