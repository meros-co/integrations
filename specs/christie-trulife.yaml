    summary: "Set the expected lamp life (LPL)"
    params:
      value: { type: "int", min: 0, max: 1000000, required: true, label: "Lamp life", description: "Hours of lamp run time before the status system warns that the lamp needs replacing; 0 disables the check." }
    send: "#LPL {value}"
    expect: { reply_contains: "LPL {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_lamp_power:
    summary: "Set the lamp power (LPP)"
    params:
      value: { type: "int", min: 0, max: 100000, required: true, label: "Lamp power", description: "Power to the lamp in watts, within the range LPP?m reports for the lamp fitted." }
    send: "#LPP {value}"
    expect: { reply_contains: "LPP {value}", matches: '^\(#?[A-Za-z]' }
