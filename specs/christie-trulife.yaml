  get_lens_vertical_range:
    summary: "Read the vertical shift range found by the last lens calibration (LVO?m)"
    send: "LVO?m"
    expect: { reply_contains: "LVO!", matches: 'LVO!M?\s*(-?\d+\s+-?\d+)' }
    returns: value
  set_lens_zoom:
    summary: "Move the lens zoom to an absolute position (ZOM)"
    params:
      value: { type: "int", min: -65535, max: 65535, required: true, label: "Position", description: "Absolute zoom position, within the range ZOM?m reports after the last lens calibration." }
    send: "#ZOM {value}"
    expect: { reply_contains: "ZOM {value}", matches: '^\(#?[A-Za-z]' }
