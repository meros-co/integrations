  set_low_brightness_mode:
    summary: "Turn low brightness mode on or off (LAS+ELBM)"
    params:
      value: { type: "bool", required: true, label: "Low brightness", description: "True turns laser strings off so lower brightness targets can be reached (M 4K25 RGB and M 4K+25 RGB)." }
    send: "#LAS+ELBM {value:bool01}"
    expect: { reply_contains: "LAS+ELBM {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_max_ambient_temperature:
    summary: "Set the maximum ambient temperature (LAS+MAXA)"
    params:
      value: { type: "int", min: 0, max: 50, required: true, label: "Maximum ambient", description: "Highest ambient temperature in degrees Celsius the projector is set up for: 0 to 50 (35 by default; Mirage SST 0 to 40, 25 by default)." }
    send: "#LAS+MAXA {value}"
    expect: { reply_contains: "LAS+MAXA {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  set_max_humidity:
    summary: "Set the expected relative humidity (LAS+MAXH)"
    params:
      value: { type: "int", min: 0, max: 100, required: true, label: "Maximum humidity", description: "Expected relative humidity in percent, 0 to 100 (80 by default), used by LiteLOC in user mode." }
    send: "#LAS+MAXH {value}"
    expect: { reply_contains: "LAS+MAXH {value}", matches: '^\(#?[A-Za-z]' }
