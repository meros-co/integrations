  get_baud_rate:
    summary: "Read the baud rate of the RS232 IN port (BDR+PRTA?)"
    send: "BDR+PRTA?"
    expect: { reply_contains: "BDR+PRTA!", matches: 'BDR\+PRTA!\s*(-?\d+)' }
