      value: { type: "int", min: 0, max: 11, required: true, label: "Warp", description: "0 = warping off, 1 to 4 = one of the four warp maps loaded with Twist or Mystique, 11 = 2D keystone (on-board keystone on Boxer)." }
    send: "#WRP+SLCT {value}"
    expect: { reply_contains: "WRP+SLCT {value}", matches: '^\(#?[A-Za-z]' }
