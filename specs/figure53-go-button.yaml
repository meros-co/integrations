spec: 1
id: figure53-go-button
name: Figure 53 Go Button
vendor: Figure 53
category: playback

source:
  - title: Go Button 3 Documentation, Working With Your Show, "OSC Dictionary"
    author: Figure 53
    url: https://gobutton.app/docs/v3/working-with-your-show/osc-dictionary/
    note: >
      Manufacturer-documented. Retrieved 2026-10-23. Sections used: Getting
      Started (UDP and TCP on 53100 since 3.2.0, earlier 53000; SLIP framing
      over TCP; UDP replies to 53101), Getting status updates (/updates and the
      /update/show/... messages), Replies (/reply/... with a JSON string
      argument), OSC Booleans, Application messages, Show messages, Cue and Hit
      messages (addressing by number or unique ID, increment/decrement syntax,
      which only preWait supports).
  - title: Go Button 3 Documentation, Working With Your Show, "Working With Remote Controls"
    author: Figure 53
    url: https://gobutton.app/docs/v3/working-with-your-show/working-with-remote-controls/
    note: >
      Retrieved 2026-10-23. Remote control profiles, MIDI and MSC; none of it is
      reachable over the network beyond the OSC dictionary.
  - title: companion-module-figure53-go-button
    author: Bitfocus Companion contributors
    url: https://github.com/bitfocus/companion-module-figure53-go-button
    note: >
      MIT. Retrieved 2026-10-23. Read as corroboration only, no code used: TCP
      is needed for replies and updates; /update/show/{id}/cue_id/{id} names a
      cue to read again, and the cue lists themselves change as a cue id
      "[root group of cue lists]"; /reply/connect answers ok, badpass or error;
      a reply's data "ignoring_show_methods" means no show is open.

# Go Button answers queries with /reply/<the address sent> carrying a JSON
# string, and pushes /update/show/... to clients that sent /updates 1. Over TCP
# both arrive on the one connection, and large replies (/cueLists) fit, which
# the dictionary says a UDP datagram may not; over UDP replies go to port 53101
# rather than the sending socket, and an idle UDP client is forgotten after 61
# seconds with its passcode and subscriptions. TCP keeps the client connected
# until it closes, so TCP it is, as for QLab.
transport:
  type: osc-tcp
  port: 53100
  framing: slip
  timeout_ms: 1000
  probe: /version

settings:
  passcode: { type: string, secret: true, label: Passcode, description: "The OSC passcode set in Sidebar > OSC Control Settings; leave empty when none is set." }

on_connect:
  - when_set: passcode
    send: { address: /connect, args: [ { value: "{settings.passcode}", type: string } ] }

ports:
  - { port: 53100, protocol: tcp, role: control, note: "Sidebar > OSC Control Settings > Network; installs upgraded from 3.1.5 or earlier keep 53000" }

