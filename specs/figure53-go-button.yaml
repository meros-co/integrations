commands:
  set_always_reply:
    summary: "Have Go Button reply to every message from this client, or only to queries"
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "On makes Go Button answer every message with a status reply; off answers queries only." }
    send:
      - { address: "/alwaysReply", args: [{ value: "{enabled:bool01}", type: int }] }
      - { address: "/alwaysReply" }
    returns: none

  get_always_reply:
    summary: "Whether Go Button replies to every message from this client"
    send: { address: "/alwaysReply" }
    expect: { address: "/reply/alwaysReply", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  connect:
    summary: "Connect with an OSC passcode (sent on connecting when the passcode setting is set)"
    params:
      passcode: { type: string, max_length: 64, secret: true, required: true, label: Passcode, description: "The OSC passcode set in Sidebar > OSC Control Settings." }
    send: { address: "/connect", args: [{ value: "{passcode}", type: string }] }
    expect: { address: "/reply/connect", json_path: "$.data" }
    returns: value

  disconnect:
    summary: "Tell Go Button this client is done; it then ignores the connection's further messages until it connects again"
    send: { address: "/disconnect" }
    returns: none

  set_forget_me_not:
    summary: "Have Go Button remember this client and its settings until it quits"
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "On keeps this client's passcode and settings; off lets Go Button forget them." }
    send:
      - { address: "/forgetMeNot", args: [{ value: "{enabled:bool01}", type: int }] }
      - { address: "/forgetMeNot" }
    returns: none

  get_forget_me_not:
    summary: "Whether Go Button remembers this client"
    send: { address: "/forgetMeNot" }
    expect: { address: "/reply/forgetMeNot", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  set_udp_keep_alive:
    summary: "Have Go Button remember this client (the same as forgetMeNot)"
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "On keeps this client's passcode and settings; off lets Go Button forget them." }
    send:
      - { address: "/udpKeepAlive", args: [{ value: "{enabled:bool01}", type: int }] }
      - { address: "/udpKeepAlive" }
    returns: none

  get_udp_keep_alive:
    summary: "Whether Go Button remembers this client (udpKeepAlive)"
    send: { address: "/udpKeepAlive" }
    expect: { address: "/reply/udpKeepAlive", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  set_reply_format:
    summary: "Set the format of Go Button's replies to this client"
    params:
      format: { type: string, max_length: 256, required: true, label: Format, description: "Reply format with the tokens #show_id#, #address#, #status# and #data#; an empty text restores the default." }
    send:
      - { address: "/replyFormat", args: [{ value: "{format}", type: string }] }
      - { address: "/replyFormat" }
    returns: none

  reset_reply_format:
    summary: "Restore Go Button's default reply format"
    send:
      - { address: "/replyFormat", args: [{ value: "", type: string }] }
      - { address: "/replyFormat" }
    returns: none

  get_reply_format:
    summary: "The reply format Go Button uses for this client"
    send: { address: "/replyFormat" }
    expect: { address: "/reply/replyFormat", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_shows:
    summary: "The available shows: uniqueID, displayName, port, udpReplyPort and version of each"
    send: { address: "/shows" }
    expect: { address: "/reply/shows", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  thump:
    summary: "Heartbeat: Go Button answers thump"
    send: { address: "/thump" }
    expect: { address: "/reply/thump", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_version:
    summary: "Go Button's version number"
    send: { address: "/version" }
    expect: { address: "/reply/version", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  open_show:
    summary: "Open a show, by unique ID or display name"
    params:
      show: { type: string, max_length: 128, pattern: "^[^/\\s#*?,\\[\\]{}]+$", required: true, label: Show, description: "The show's unique ID or display name, without spaces or OSC pattern characters." }
    send: { address: "/show/{show}/open" }
    returns: none

  close_show:
    summary: "Close the open show"
    send: { address: "/close" }
    returns: none

  get_cue_lists:
    summary: "Cue dictionaries of the main cue list and the hits list, with every cue, Group children included"
    send: { address: "/cueLists" }
    expect: { address: "/reply/cueLists", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_cue_lists_shallow:
    summary: "Cue dictionaries of the main cue list and the hits list, with every cue, without Group children"
    send: { address: "/cueLists/shallow" }
    expect: { address: "/reply/cueLists/shallow", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_cue_lists_ids:
    summary: "Unique IDs of the main cue list and the hits list, with every cue, Group children included"
    send: { address: "/cueLists/uniqueIDs" }
    expect: { address: "/reply/cueLists/uniqueIDs", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_cue_lists_ids_shallow:
    summary: "Unique IDs of the main cue list and the hits list, with every cue, without Group children"
    send: { address: "/cueLists/uniqueIDs/shallow" }
    expect: { address: "/reply/cueLists/uniqueIDs/shallow", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_running_cues:
    summary: "Cue dictionaries of the running cues and hits, Group children included"
    send: { address: "/runningCues" }
    expect: { address: "/reply/runningCues", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_running_cues_shallow:
    summary: "Cue dictionaries of the running cues and hits, without Group children"
    send: { address: "/runningCues/shallow" }
    expect: { address: "/reply/runningCues/shallow", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_running_cues_ids:
    summary: "Unique IDs of the running cues and hits, Group children included"
    send: { address: "/runningCues/uniqueIDs" }
    expect: { address: "/reply/runningCues/uniqueIDs", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_running_cues_ids_shallow:
    summary: "Unique IDs of the running cues and hits, without Group children"
    send: { address: "/runningCues/uniqueIDs/shallow" }
    expect: { address: "/reply/runningCues/uniqueIDs/shallow", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_running_or_paused_cues:
    summary: "Cue dictionaries of the running or paused cues and hits, Group children included"
    send: { address: "/runningOrPausedCues" }
    expect: { address: "/reply/runningOrPausedCues", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_running_or_paused_cues_shallow:
    summary: "Cue dictionaries of the running or paused cues and hits, without Group children"
    send: { address: "/runningOrPausedCues/shallow" }
    expect: { address: "/reply/runningOrPausedCues/shallow", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_running_or_paused_cues_ids:
    summary: "Unique IDs of the running or paused cues and hits, Group children included"
    send: { address: "/runningOrPausedCues/uniqueIDs" }
    expect: { address: "/reply/runningOrPausedCues/uniqueIDs", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_running_or_paused_cues_ids_shallow:
    summary: "Unique IDs of the running or paused cues and hits, without Group children"
    send: { address: "/runningOrPausedCues/uniqueIDs/shallow" }
    expect: { address: "/reply/runningOrPausedCues/uniqueIDs/shallow", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  set_dim:
    summary: "Set the main volume's DIM"
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "On engages DIM, fading the main volume over the show's Main Volume Dim Duration; off disengages it." }
    send:
      - { address: "/dim", args: [{ value: "{enabled:bool01}", type: int }] }
      - { address: "/dim" }
    returns: none

  get_dim:
    summary: "Whether the main volume's DIM is on"
    send: { address: "/dim" }
    expect: { address: "/reply/dim", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  toggle_dim:
    summary: "Toggle the main volume's DIM"
    send:
      - { address: "/toggleDim" }
      - { address: "/dim" }
    returns: none

  set_full_screen:
    summary: "Set full screen mode (iPad only)"
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "On enters full screen mode, off leaves it; no effect on iPhone or iPod touch." }
    send:
      - { address: "/fullScreen", args: [{ value: "{enabled:bool01}", type: int }] }
      - { address: "/fullScreen" }
    returns: none

  get_full_screen:
    summary: "Whether full screen mode (iPad only) is on"
    send: { address: "/fullScreen" }
    expect: { address: "/reply/fullScreen", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  toggle_full_screen:
    summary: "Toggle full screen mode (iPad only)"
    send:
      - { address: "/toggleFullScreen" }
      - { address: "/fullScreen" }
    returns: none

  set_main_volume_visible:
    summary: "Set the main volume slider's visibility"
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "On shows the main volume slider, off hides it." }
    send:
      - { address: "/mainVolumeVisible", args: [{ value: "{enabled:bool01}", type: int }] }
      - { address: "/mainVolumeVisible" }
    returns: none

  get_main_volume_visible:
    summary: "Whether the main volume slider's visibility is on"
    send: { address: "/mainVolumeVisible" }
    expect: { address: "/reply/mainVolumeVisible", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  toggle_main_volume_visible:
    summary: "Toggle the main volume slider's visibility"
    send:
      - { address: "/toggleMainVolumeVisible" }
      - { address: "/mainVolumeVisible" }
    returns: none

  set_mute:
    summary: "Set the main volume's mute"
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "On mutes the show's main volume, off unmutes it." }
    send:
      - { address: "/mute", args: [{ value: "{enabled:bool01}", type: int }] }
      - { address: "/mute" }
    returns: none

  get_mute:
    summary: "Whether the main volume's mute is on"
    send: { address: "/mute" }
    expect: { address: "/reply/mute", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  toggle_mute:
    summary: "Toggle the main volume's mute"
    send:
      - { address: "/toggleMute" }
      - { address: "/mute" }
    returns: none

  set_dim_over:
    summary: "Engage or disengage DIM, fading over a given time"
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "On engages DIM, off disengages it." }
      seconds: { type: float, min: 0, required: true, label: Fade time, description: "Seconds the main volume takes to fade to or from the dim level." }
    send:
      - { address: "/dim", args: [{ value: "{enabled:bool01}", type: int }, { value: "{seconds}", type: float }] }
      - { address: "/dim" }
    returns: none

  go:
    summary: "GO: start the cue standing by at the playhead"
    send: { address: "/go" }
    returns: none

  oops:
    summary: "Stop and re-select the most recently played cue; again to undo earlier ones in reverse order"
    send:
      - { address: "/oops" }
      - { address: "/cue/playhead/uniqueID" }
    returns: none

  panic:
    summary: "Panic the show: fade out and stop every cue and hit over the panic duration"
    send: { address: "/panic" }
    returns: none

  panic_in_time:
    summary: "Panic the show over a given time"
    params:
      seconds: { type: float, min: 0, required: true, label: Panic time, description: "Seconds over which every cue and hit fades out before stopping." }
    send: { address: "/panicInTime", args: [{ value: "{seconds}", type: float }] }
    returns: none

  pause:
    summary: "Pause every running cue and hit"
    send: { address: "/pause" }
    returns: none

  resume:
    summary: "Resume the show and every paused cue and hit"
    send: { address: "/resume" }
    returns: none

  stop:
    summary: "Stop every cue and hit at once"
    send: { address: "/stop" }
    returns: none

  hard_stop:
    summary: "Stop every cue and hit at once (hardStop, the same as stop)"
    send: { address: "/hardStop" }
    returns: none

  reset:
    summary: "Reset the show: stop everything, return the playhead to the top and reset the show timer"
    send:
      - { address: "/reset" }
      - { address: "/cue/playhead/uniqueID" }
    returns: none

  set_playhead:
    summary: "Stand a cue by at the playhead"
    params:
      cue: { type: string, max_length: 64, pattern: "^[A-Za-z0-9._-]+$", required: true, label: Cue number, description: "Number of the cue list cue to stand by." }
    send:
      - { address: "/playhead/{cue}" }
      - { address: "/cue/playhead/uniqueID" }
    returns: none

  playhead_next:
    summary: "Move the playhead to the next cue"
    send:
      - { address: "/playhead/next" }
      - { address: "/cue/playhead/uniqueID" }
    returns: none

  playhead_previous:
    summary: "Move the playhead to the previous cue"
    send:
      - { address: "/playhead/previous" }
      - { address: "/cue/playhead/uniqueID" }
    returns: none

  get_playhead_id:
    summary: "Unique ID of the cue standing by at the playhead"
    send: { address: "/cue/playhead/uniqueID" }
    expect: { address: "/reply/cue/playhead/uniqueID", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  set_timer:
    summary: "Set the Elapsed Show Timer's elapsed time (before Go Button 3.3)"
    params:
      seconds: { type: float, required: true, label: Seconds, description: "Elapsed time of the Elapsed Show Timer, in seconds." }
    send:
      - { address: "/timer", args: [{ value: "{seconds}", type: float }] }
      - { address: "/timer" }
    returns: none

  get_timer:
    summary: "The Elapsed Show Timer's elapsed time in seconds (before Go Button 3.3)"
    send: { address: "/timer" }
    expect: { address: "/reply/timer", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  set_timer_elapsed:
    summary: "Set the Elapsed Show Timer's elapsed time"
    params:
      seconds: { type: float, required: true, label: Seconds, description: "Elapsed time of the Elapsed Show Timer, in seconds." }
    send:
      - { address: "/timer/elapsed", args: [{ value: "{seconds}", type: float }] }
      - { address: "/timer/elapsed" }
    returns: none

  get_timer_elapsed:
    summary: "The Elapsed Show Timer's elapsed time in seconds"
    send: { address: "/timer/elapsed" }
    expect: { address: "/reply/timer/elapsed", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  set_timer_duration:
    summary: "Set the Elapsed Show Timer's duration (starting time); 0 counts up"
    params:
      seconds: { type: float, min: 0, required: true, label: Duration, description: "Seconds the timer counts down from when started; 0 makes it count up from 00:00." }
    send:
      - { address: "/timer/duration", args: [{ value: "{seconds}", type: float }] }
      - { address: "/timer/duration" }
    returns: none

  get_timer_duration:
    summary: "The Elapsed Show Timer's duration (starting time) in seconds"
    send: { address: "/timer/duration" }
    expect: { address: "/reply/timer/duration", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  start_timer:
    summary: "Start the Elapsed Show Timer"
    send: { address: "/timer/start" }
    returns: none

  stop_timer:
