      kind: { type: enum, values: [cue, cue_id, hit, hit_id], default: cue, label: Addressed by, description: "cue and hit take a cue number or a hit number (hits count in display order from the top left of the hits panel); cue_id and hit_id take the unique ID Go Button reports." }
      ref: { type: string, max_length: 64, pattern: "^[A-Za-z0-9._*?-]+$", required: true, label: Cue or hit, description: "Cue number, hit number or unique ID; selected, playhead and playbackPosition address the selected cues or the cue at the playhead, and * and ? are wildcards matching many." }
    send: { address: "/{kind}/{ref}/resume" }
    returns: none

  start_cue:
    summary: "Start a cue or hit without moving the playhead"
    params:
      kind: { type: enum, values: [cue, cue_id, hit, hit_id], default: cue, label: Addressed by, description: "cue and hit take a cue number or a hit number (hits count in display order from the top left of the hits panel); cue_id and hit_id take the unique ID Go Button reports." }
      ref: { type: string, max_length: 64, pattern: "^[A-Za-z0-9._*?-]+$", required: true, label: Cue or hit, description: "Cue number, hit number or unique ID; selected, playhead and playbackPosition address the selected cues or the cue at the playhead, and * and ? are wildcards matching many." }
    send: { address: "/{kind}/{ref}/start" }
    returns: none

  stop_cue:
    summary: "Stop a cue or hit at once"
    params:
      kind: { type: enum, values: [cue, cue_id, hit, hit_id], default: cue, label: Addressed by, description: "cue and hit take a cue number or a hit number (hits count in display order from the top left of the hits panel); cue_id and hit_id take the unique ID Go Button reports." }
      ref: { type: string, max_length: 64, pattern: "^[A-Za-z0-9._*?-]+$", required: true, label: Cue or hit, description: "Cue number, hit number or unique ID; selected, playhead and playbackPosition address the selected cues or the cue at the playhead, and * and ? are wildcards matching many." }
    send: { address: "/{kind}/{ref}/stop" }
    returns: none

  hard_stop_cue:
    summary: "Stop a cue or hit at once (hardStop, the same as stop)"
    params:
      kind: { type: enum, values: [cue, cue_id, hit, hit_id], default: cue, label: Addressed by, description: "cue and hit take a cue number or a hit number (hits count in display order from the top left of the hits panel); cue_id and hit_id take the unique ID Go Button reports." }
      ref: { type: string, max_length: 64, pattern: "^[A-Za-z0-9._*?-]+$", required: true, label: Cue or hit, description: "Cue number, hit number or unique ID; selected, playhead and playbackPosition address the selected cues or the cue at the playhead, and * and ? are wildcards matching many." }
    send: { address: "/{kind}/{ref}/hardStop" }
    returns: none

  load_cue_at:
    summary: "Load a cue or hit to a time"
    params:
      kind: { type: enum, values: [cue, cue_id, hit, hit_id], default: cue, label: Addressed by, description: "cue and hit take a cue number or a hit number (hits count in display order from the top left of the hits panel); cue_id and hit_id take the unique ID Go Button reports." }
      ref: { type: string, max_length: 64, pattern: "^[A-Za-z0-9._*?-]+$", required: true, label: Cue or hit, description: "Cue number, hit number or unique ID; selected, playhead and playbackPosition address the selected cues or the cue at the playhead, and * and ? are wildcards matching many." }
      seconds: { type: float, min: 0, required: true, label: Time, description: "Seconds into the cue to load to, its pre-wait counted." }
    send: { address: "/{kind}/{ref}/loadAt", args: [{ value: "{seconds}", type: float }] }
    returns: none

  panic_cue_in_time:
    summary: "Panic a cue or hit over a given time"
    params:
      kind: { type: enum, values: [cue, cue_id, hit, hit_id], default: cue, label: Addressed by, description: "cue and hit take a cue number or a hit number (hits count in display order from the top left of the hits panel); cue_id and hit_id take the unique ID Go Button reports." }
      ref: { type: string, max_length: 64, pattern: "^[A-Za-z0-9._*?-]+$", required: true, label: Cue or hit, description: "Cue number, hit number or unique ID; selected, playhead and playbackPosition address the selected cues or the cue at the playhead, and * and ? are wildcards matching many." }
      seconds: { type: float, min: 0, required: true, label: Panic time, description: "Seconds over which the cue fades out before stopping." }
    send: { address: "/{kind}/{ref}/panicInTime", args: [{ value: "{seconds}", type: float }] }
    returns: none

state:
  app.version: { type: string, description: "Go Button's version number (/version)" }
  app.connect: { type: string, description: "Answer to the last /connect: ok, badpass (wrong passcode) or error" }
  app.always_reply: { type: bool, description: "Whether Go Button answers every message from this client (/alwaysReply)" }
  app.forget_me_not: { type: bool, description: "Whether Go Button remembers this client and its settings (/forgetMeNot or /udpKeepAlive)" }
  app.reply_format: { type: string, description: "The reply format set for this client; empty for the default" }
  shows.*.name: { type: string, description: "Display name of an available show, keyed by its unique ID" }
  shows.*.port: { type: int, description: "OSC listening port of the show" }
  shows.*.udp_reply_port: { type: int, description: "UDP reply port of the show" }
  shows.*.version: { type: string, description: "Go Button version the show reports" }
  show.id: { type: string, description: "Unique ID of the open show, from its update messages" }
  show.playhead_id: { type: string, description: "Unique ID of the cue standing by at the playhead; absent when none is" }
  show.dim: { type: bool, description: "Whether the main volume's DIM is engaged" }
  show.mute: { type: bool, description: "Whether the main volume is muted" }
  show.full_screen: { type: bool, description: "Whether the show is in full screen mode (iPad)" }
  show.main_volume_visible: { type: bool, description: "Whether the main volume slider is shown" }
  show.volume_db: { type: float, unit: dB, description: "Main volume in dB, -96 to 0" }
  show.volume_percent: { type: float, description: "Main volume on a linear scale, 0 to 1" }
  show.timer.elapsed: { type: float, unit: s, description: "Elapsed time of the Elapsed Show Timer, polled once a second" }
  show.timer.duration: { type: float, unit: s, description: "Duration (starting time) of the Elapsed Show Timer; 0 counts up (3.3.0 and later)" }
  cue_lists.*.index: { type: int, description: "Position of the main cue list (0) and the hits list in /cueLists, keyed by unique ID" }
  cues.*.number: { type: string, description: "Cue or hit number, keyed by unique ID; empty when it has none" }
  cues.*.name: { type: string, description: "Name of the cue or hit" }
  cues.*.list_name: { type: string, description: "Name as the list shows it" }
  cues.*.type: { type: string, description: "Cue type" }
  cues.*.color: { type: string, description: "Color name (hits): none, red, orange, green, blue or purple" }
  cues.*.armed: { type: bool, description: "Whether the cue or hit is armed" }
  cues.*.index: { type: int, description: "Position of the cue in its list or Group, from 0" }
  cues.*.parent: { type: string, description: "Unique ID of the list or Group cue the cue is in" }
  cues.*.children.*: { type: string, description: "Unique IDs of a list's or Group's children, in order from 0" }
  cues.*.display_name: { type: string, description: "Display name of the cue or hit" }
  cues.*.default_name: { type: string, description: "Default name of the cue or hit" }
  cues.*.duration: { type: float, unit: s, description: "Duration in seconds" }
  cues.*.pre_wait: { type: float, unit: s, description: "Pre-wait in seconds" }
  cues.*.go_button_text: { type: string, description: "Text on the GO button while the cue is selected (cue list cues)" }
  cues.*.broken: { type: bool, description: "Whether the cue or hit is broken" }
  cues.*.loaded: { type: bool, description: "Whether the cue or hit is loaded" }
  cues.*.paused: { type: bool, description: "Whether the cue or hit is paused" }
  cues.*.running: { type: bool, description: "Whether the cue or hit is running" }
  cues.*.action_elapsed: { type: float, unit: s, description: "Elapsed action in seconds, read once a second while running or paused" }
  cues.*.percent_action_elapsed: { type: float, description: "Elapsed action as a fraction of the whole action (the dictionary calls it a percentage)" }
  cues.*.pre_wait_elapsed: { type: float, unit: s, description: "Elapsed pre-wait in seconds, read once a second while running or paused" }
  cues.*.percent_pre_wait_elapsed: { type: float, description: "Elapsed pre-wait as a fraction of the whole pre-wait" }
  active.*: { type: string, description: "Unique IDs of the running or paused cues and hits, in Go Button's order from 0, polled once a second" }
  running.*: { type: string, description: "Unique IDs of the running cues and hits, from the last get_running_cues" }

telemetry:
  # /updates 1 subscribes this client to /update/show/...; over TCP it lasts as
  # long as the connection.
  subscribe:
    send:
      - { address: /updates, args: [ { value: "1", type: int } ] }
  poll:
    # What moves during a show: the running or paused cues (each one's times
    # are read in turn) and the show timer, once a second.
    - every_ms: 1000
      send:
        - { address: /runningOrPausedCues/shallow, reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?runningOrPausedCues/shallow$", models: [go-button-3] }
        - { address: /runningOrPausedCues, reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?runningOrPausedCues$", models: [go-button-3-early] }
        - { address: /timer/elapsed, reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?timer/elapsed$", models: [go-button-3] }
        - { address: /timer, reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?timer$", models: [go-button-3-early] }
    # Everything else is read on connecting, and again when Go Button says it
    # changed (the update rules below).
    - send:
        - { address: /version, reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?version$" }
        - { address: /shows, reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?shows$" }
        - { address: /alwaysReply, reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?alwaysReply$" }
        - { address: /forgetMeNot, reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?forgetMeNot$" }
        - { address: /replyFormat, reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?replyFormat$" }
        - { address: "/cueLists", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cueLists$" }
        - { address: "/cue/playhead/uniqueID", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue/playhead/uniqueID$" }
        - { address: "/dim", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?dim$" }
        - { address: "/mute", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?mute$" }
        - { address: "/fullScreen", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?fullScreen$" }
        - { address: "/mainVolumeVisible", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?mainVolumeVisible$" }
        - { address: "/volume", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?volume$" }
        - { address: "/volumePercent", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?volumePercent$" }
        - { address: "/timer/duration", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?timer/duration$", models: [go-button-3] }
  updates:
    # The show changed: its cue lists and settings are read again.
    - address: "^/update/show/([^/]+)$"
      state: { show.id: "{1}" }
      then_send:
        - { address: "/cueLists", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cueLists$" }
        - { address: "/cue/playhead/uniqueID", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue/playhead/uniqueID$" }
        - { address: "/dim", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?dim$" }
        - { address: "/mute", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?mute$" }
        - { address: "/fullScreen", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?fullScreen$" }
        - { address: "/mainVolumeVisible", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?mainVolumeVisible$" }
        - { address: "/volume", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?volume$" }
        - { address: "/volumePercent", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?volumePercent$" }
        - { address: "/timer/duration", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?timer/duration$", models: [go-button-3] }
    # The cue lists themselves changed (named as a cue, the root group).
    - address: "^/update/show/([^/]+)/cue_id/(?:\\[root group of cue lists\\]|__root__)$"
      then_send:
        - { address: /cueLists, reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cueLists$" }
    # A cue or hit changed: its properties are read again.
    - address: "^/update/show/([^/]+)/cue_id/([A-Za-z0-9-]+)$"
      then_send:
        - { address: "/cue_id/{2}/name", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/name$" }
        - { address: "/cue_id/{2}/number", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/number$" }
        - { address: "/cue_id/{2}/colorName", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/colorName$" }
        - { address: "/cue_id/{2}/displayName", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/displayName$" }
        - { address: "/cue_id/{2}/defaultName", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/defaultName$" }
        - { address: "/cue_id/{2}/duration", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/duration$" }
        - { address: "/cue_id/{2}/preWait", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/preWait$" }
        - { address: "/cue_id/{2}/goButtonText", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/goButtonText$" }
        - { address: "/cue_id/{2}/isBroken", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/isBroken$" }
        - { address: "/cue_id/{2}/isLoaded", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/isLoaded$" }
        - { address: "/cue_id/{2}/isPaused", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/isPaused$" }
        - { address: "/cue_id/{2}/isRunning", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/isRunning$" }
    - address: "^/update/show/([^/]+)/playbackPosition$"
      arg_types: s
      state: { show.id: "{1}", show.playhead_id: "{arg0}" }
    # No argument: no cue stands by.
    - address: "^/update/show/([^/]+)/playbackPosition$"
      arg_types: ""
      state: { show.playhead_id: { delete: true } }
    - address: "^/update/show/([^/]+)/volume$"
      state: { show.id: "{1}", show.volume_db: "{arg0}" }
    # The show is closing: everything known about it goes.
    - address: "^/update/show/([^/]+)/disconnect$"
      state:
        show: { delete: true }
        cues: { delete: true }
        cue_lists: { delete: true }
        active: { delete: true }
        running: { delete: true }
    # Replies.
    - address: "^/reply/connect$"
      json: { v: "$.data" }
      state: { app.connect: "{v}" }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?version$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { app.version: "{v}" }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?(?:alwaysReply)$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { app.always_reply: { value: "{v}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?(?:forgetMeNot|udpKeepAlive)$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { app.forget_me_not: { value: "{v}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?replyFormat$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { app.reply_format: "{v}" }
    - address: "^/reply/shows$"
      json_match: { "$.status": "^ok$" }
      json_each: "$.data"
      each_match: { "$.uniqueID": "^([A-Za-z0-9-]+)$" }
      json: { name: "$.displayName", port: "$.port", udp: "$.udpReplyPort", version: "$.version" }
      replace: shows
      state:
        "shows.{1}.name": "{name}"
        "shows.{1}.port": "{port}"
        "shows.{1}.udp_reply_port": "{udp}"
        "shows.{1}.version": "{version}"
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?dim$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { show.dim: { value: "{v}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?mute$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { show.mute: { value: "{v}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?fullScreen$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { show.full_screen: { value: "{v}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?mainVolumeVisible$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { show.main_volume_visible: { value: "{v}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?volume$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { show.volume_db: "{v}" }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?volumePercent$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { show.volume_percent: "{v}" }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?(?:timer|timer/elapsed)$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { show.timer.elapsed: "{v}" }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?timer/duration$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { show.timer.duration: "{v}" }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue/playhead/uniqueID$"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { show.playhead_id: "{v}" }
    # The cue lists, Group cues three levels deep; the tree replaces what was known.
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?cueLists(?:/shallow)?$"
      json_match: { "$.status": "^ok$" }
      json_each: "$.data"
      each_match: { "$.uniqueID": "^([A-Za-z0-9-]+)$" }
      json: { id: "$.uniqueID", number: "$.number", name: "$.name", list_name: "$.listName", type: "$.type", color: "$.colorName", armed: "$.armed" }
      replace: [cues, cue_lists]
      state:
        "cues.{1}.number": "{number}"
        "cues.{1}.name": "{name}"
        "cues.{1}.list_name": "{list_name}"
        "cues.{1}.type": "{type}"
        "cues.{1}.color": "{color}"
        "cues.{1}.armed": { value: "{armed}", map: { "true": true, "false": false, "1": true, "0": false } }
        "cues.{1}.index": "{index}"
        "cue_lists.{1}.index": "{index}"
      then_send:
        - { address: "/cue_id/{id}/displayName", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/displayName$" }
        - { address: "/cue_id/{id}/defaultName", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/defaultName$" }
        - { address: "/cue_id/{id}/duration", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/duration$" }
        - { address: "/cue_id/{id}/preWait", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/preWait$" }
        - { address: "/cue_id/{id}/goButtonText", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/goButtonText$" }
        - { address: "/cue_id/{id}/isBroken", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/isBroken$" }
        - { address: "/cue_id/{id}/isLoaded", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/isLoaded$" }
        - { address: "/cue_id/{id}/isPaused", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/isPaused$" }
        - { address: "/cue_id/{id}/isRunning", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/isRunning$" }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?cueLists(?:/shallow)?$"
      json_match: { "$.status": "^ok$" }
      json_each: "$.data[*].cues"
      each_match: { "$.uniqueID": "^([A-Za-z0-9-]+)$" }
      json: { id: "$.uniqueID", number: "$.number", name: "$.name", list_name: "$.listName", type: "$.type", color: "$.colorName", armed: "$.armed", parent: "$^.uniqueID" }
      state:
        "cues.{1}.number": "{number}"
        "cues.{1}.name": "{name}"
        "cues.{1}.list_name": "{list_name}"
        "cues.{1}.type": "{type}"
        "cues.{1}.color": "{color}"
        "cues.{1}.armed": { value: "{armed}", map: { "true": true, "false": false, "1": true, "0": false } }
        "cues.{1}.index": "{index}"
        "cues.{1}.parent": "{parent}"
        "cues.{parent}.children.{index}": "{1}"
      then_send:
        - { address: "/cue_id/{id}/displayName", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/displayName$" }
        - { address: "/cue_id/{id}/defaultName", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/defaultName$" }
        - { address: "/cue_id/{id}/duration", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/duration$" }
        - { address: "/cue_id/{id}/preWait", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/preWait$" }
        - { address: "/cue_id/{id}/goButtonText", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/goButtonText$" }
        - { address: "/cue_id/{id}/isBroken", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/isBroken$" }
        - { address: "/cue_id/{id}/isLoaded", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/isLoaded$" }
        - { address: "/cue_id/{id}/isPaused", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/isPaused$" }
        - { address: "/cue_id/{id}/isRunning", reply_address: "^/reply/(?:show(?:_id)?/[^/]+/)?cue_id/[^/]+/isRunning$" }
    - address: "^/reply/(?:show(?:_id)?/[^/]+/)?cueLists(?:/shallow)?$"
      json_match: { "$.status": "^ok$" }
      json_each: "$.data[*].cues[*].cues"
      each_match: { "$.uniqueID": "^([A-Za-z0-9-]+)$" }
