quirks:
  - models: [all]
    severity: warning
    text: >
      Go Button answers a query with /reply/<the address sent> carrying one
      string argument holding JSON: show_id (when the show answers), address,
      status (ok or error) and data. The dictionary's own example answers
      /show/{id}/volumePercent on /reply/show_id/{id}/volumePercent, so the
      telemetry rules take a reply with or without a show prefix, and every
      command is sent rootless, which addresses the one open show. A query
      command waits for /reply/<the address sent> exactly.

  - models: [all]
    severity: info
    text: >
      Actions (go, start, setting a property) produce no reply unless
      /alwaysReply is on, so they report unverified. Every write is followed by
      the query that reads it back, whose reply updates state; the update
      messages read changed cues and shows again as well.

  - models: [all]
    severity: warning
    text: >
      A passcoded Go Button ignores application and show messages until
      /connect has been sent with the passcode; /version and /shows are always
      answered. The /reply/connect answer (ok, badpass or error) goes to
      app.connect but is not a refusal of the credential (an OSC transport has
      no refusal text), so a wrong passcode shows up as app.connect badpass and
      unanswered queries. Over TCP the connection stays authorised until it
      closes; over UDP Go Button forgets the client after 61 seconds.

  - models: [all]
    severity: info
    text: >
      Go Button sends no update when a cue's elapsed times move or the
      show timer runs. The running or paused cues are polled once a second, each
      one's elapsed and percentage times, running and paused flags read in turn,
      and the timer's elapsed time with them. A percentage reply is taken as the
      dictionary's data, assumed a fraction from 0 to 1.

  - models: [all]
    severity: info
    text: >
      /update/show/{id}/cue_id/{id} names a cue or hit to read again; the
      dictionary has no valuesForKeys, so each property is read with its own
      message. The cue lists themselves changing arrives as an update for the
      root group ([root group of cue lists], or __root__ as in QLab 5.5), which
      reads /cueLists again (third-party corroboration, not in the dictionary).

  - models: [all]
    severity: info
    text: >
      Hits are numbered in display order from the top left of the hits
      panel; /hit/{number} and /hit_id/{id} take every cue message. colorName
      applies to hits only and goButtonText to cue list cues only. Spaces cannot
      be sent in an OSC address, so cue numbers with spaces cannot be reached
      by number (use cue_id); the * and ? wildcards address many cues in an
      action, and are refused in queries, whose single reply could not say
      which cue it answers.

  - models: [all]
    severity: info
    text: >
      Booleans are sent as the integers 0 and 1, which every Go Button
      3 version takes; OSC 1.1 True and False need 3.3.0.

  - models: [all]
    severity: warning
    text: >
      set_reply_format changes the form of every later reply to this
      client. Replies in another form no longer match the reply rules or the
      query commands, so state stops updating and queries time out until
      reset_reply_format restores the default.

  - models: [all]
    severity: info
    text: >
      The update for a change of main volume carries the level in dB as
      its first argument. The dictionary says both of two messages are sent
      when the volume changes but lists only one; the percentage is read again
      with the show's other settings.

  - models: [all]
    severity: info
    text: >
      A reply whose data is ignoring_show_methods means no show is open.
      Go Button then answers show and cue queries with it, so they return that
      text, and the cue lists read empty.

  - models: [all]
    severity: warning
    text: >
      Messages are sent rootless, to the open show; open_show is the one
      that needs the /show/{id} prefix, and takes the show's unique ID or its
      display name. Display names with spaces cannot be sent in an OSC
      address.

  - models: [all]
    severity: critical
    text: >
      stop, hard_stop, panic, panic_in_time and reset stop every cue and
      hit in the show (panic after a fade; a second panic during the fade stops
      at once; reset also returns the playhead to the top and resets the show
      timer). close_show and open_show close the running show. None can be
      undone live.

  - models: [all]
    severity: info
    text: >
      The default port is 53100 for TCP and UDP since Go Button 3.2.0;
      an install upgraded from 3.1.5 or earlier keeps 53000 and 53001 until
      changed. Go Button also reads plain text on UDP 53535 as OSC, which is
      not used here.
