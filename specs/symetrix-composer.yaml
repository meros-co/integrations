spec: 1
id: symetrix-composer
name: Symetrix Composer DSPs (Composer Control Protocol)
vendor: Symetrix
category: mixer

# Written from Symetrix's Composer Control Protocol document. Everything a
# designer can adjust in Composer is reached by the controller number the
# designer assigns to it (1-10000), with a 16-bit position (0-65535), so
# commands take the controller number as a parameter. RS-232, the UDP form of
# the same protocol on 48631, and the Set Baud command (RS-232 only) are not
# used here.
source:
  - title: "Composer v7.0 Control Protocol (document dated 08/09/18, (c) 2016 Symetrix)"
    author: Symetrix, Inc.
    url: "https://www.symetrix.co/wp-content/uploads/2024/04/Composer-Control-Protocol-v7.0-080918.pdf"
    note: >
      Manufacturer document, also at
      https://audiobrains.com/data/symetrix/others/Composer-Control-Protocol-v7.0-080918.pdf
      and linked from https://www.symetrix.co/knowledge/composer-control-protocol/ .
      Ethernet control: TCP or UDP port 48631, commands end in CR, up to six
      TCP sessions (the least recently used closed for a seventh), responses
      end in CR, quiet mode on and echo off by default, push data goes to
      every TCP session p.3-4; site identifier p.4; parameter notes (faders
      linear in dB, -72 to +12 dB for most volume faders, 0 = off; buttons 0
      and 65535; selectors; meters linear in dB with 65535 = +24 dBu; LEDs
      0/65535; diagnostics) p.5-7; CS, CSQ, CC, GS, GS2, GPR, GSB, GSB2,
      GSB3 p.7-10; LP, FU, SSYSS p.11; VoIP dialing, GSYSS and call status
      p.12; push (format #nnnnn=vvvvv, 100 ms interval, up to 64 values per
      interval, state at power-up, PU, PUE, PUD, GPU, PUR, PUC) p.13-17; PUI,
      PUT p.18; SB, SQ, EH p.19; NOP, Q!, RI, V, R! p.20; command prefixes
      $e, $v, $q and the Super Matrix Mixer CMV commands p.21-24.

transport:
  type: line-tcp
  port: 48631
  framing: terminated
  terminator: cr
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # Pushed values (and GSB2 block reads) are "#nnnnn=vvvvv" lines; every
  # answer to a command is something else (ACK, NAK, a value, a string).
  reply_match: "^[^#]"
  # NOP: "will always return an ACK in Quiet mode" (p.20).
  probe: "NOP"

# Answers are parsed in quiet mode with echo off, the documented defaults
# (p.3, p.19). Both are kept per port in non-volatile memory, so a terminal
# session may have changed them; they are put back on every connection.
on_connect:
  - send: "EH 0"
    await_reply: true
  - send: "SQ 1"
    await_reply: true

conversions:
  # "Volume dB = -72 + 84*(CONTROLLER POSITION/65535)" (p.5).
  symetrix_fader:
    points: [[0, -72.0], [65535, 12.0]]

ports:
  - { port: 48631, protocol: tcp, role: control }

models:
  - id: radius-nx
    name: "Symetrix Radius NX 4x4 and 12x8 (Dante, AEC and VoIP variants)"
    supports: &all
      [set_controller, set_controller_quick, increment_controller, decrement_controller,
       get_controller, get_controller_value, read_controller_block, set_fader_db, get_fader_db,
       button_on, button_off, load_preset, get_preset, flash_unit, stop_flashing,
       set_system_string, get_system_string, set_dial_number, set_speed_dial_number,
       set_speed_dial_name, get_speed_dial_number, get_speed_dial_name, get_dialed_number,
       get_caller_id, get_call_status, get_call_elapsed, set_push_global,
       push_enable, push_enable_range, push_disable, push_disable_range, push_refresh,
       push_refresh_range, push_clear, set_push_interval, set_push_threshold, nop, get_ip,
       reboot, matrix_set, matrix_get, matrix_modify, matrix_toggle, matrix_reset,
       get_matrix_change_count]
    verification: none
  - id: prism
    name: "Symetrix Prism (4x4, 8x8, 12x12, 16x16 and larger frames)"
    supports: *all
    verification: none
  - id: edge
    name: "Symetrix Edge"
    supports: *all
    verification: none
  - id: solus-nx
    name: "Symetrix Solus NX (4x4, 8x8, 16x16)"
    supports: *all
    verification: none
  - id: radius-legacy
    name: "Symetrix Radius 12x8 EX / Radius AEC and xControl-era Composer units"
    supports: *all
    verification: none
    notes: >
      The document names Edge, Radius, Radius AEC and xControl. Units without
      a VoIP or telephony card answer NAK to the dialing commands, and units
      whose design has no Super Matrix Mixer answer NAK to CMV.

commands:
  # ── Controllers ─────────────────────────────────────────────────────────
  set_controller:
    summary: "CS: move a controller to an absolute position, 0-65535; ACK, or NAK when the controller number does not exist"
    params:
      controller: &controller { type: int, min: 1, max: 10000, required: true, label: Controller, description: "The controller number the designer assigned to the control in Composer, from 1 to 10000." }
      position: &position { type: int, min: 0, max: 65535, required: true, label: Position, description: "Controller position from 0 to 65535: for a -72 to +12 dB fader 0 is off and 65535 is +12 dB; a button is 0 off and 65535 on." }
    send: "CS {controller} {position}"
    expect: &ack { matches: "^ACK\\s*$" }
    returns: ack
  set_controller_quick:
    summary: "CSQ: as CS but answered within 5-10 ms, without checking that the controller exists (always ACK)"
    params: { controller: *controller, position: *position }
    send: "CSQ {controller} {position}"
    expect: *ack
    returns: ack
  increment_controller:
    summary: "CC <n> 1 <amount>: raise a controller's position by an amount, limited to 65535"
    params: { controller: *controller, amount: &amount { type: int, min: 0, max: 65535, required: true, label: Amount, description: "Amount to move the controller position by, in the same 0-65535 scale; the result stops at 0 or 65535." } }
    send: "CC {controller} 1 {amount}"
    expect: *ack
    returns: ack
  decrement_controller:
    summary: "CC <n> 0 <amount>: lower a controller's position by an amount, limited to 0"
    params: { controller: *controller, amount: *amount }
    send: "CC {controller} 0 {amount}"
    expect: *ack
    returns: ack
  get_controller:
    summary: "GS2: a controller's position, answered with its number (\"368 47114\"), which also updates controllers.<n>.value"
    params: { controller: *controller }
    send: "GS2 {controller}"
    expect: { matches: "^\\s*\\d+\\s+(\\d+)\\s*$" }
    returns: value
  get_controller_value:
    summary: "GS: a controller's position alone (0-65535); two-state buttons read 0 or 65535"
    params: { controller: *controller }
    send: "GS {controller}"
    expect: { matches: "^\\s*(\\d+)\\s*$" }
    returns: value
  read_controller_block:
    summary: "GSB2: read up to 256 consecutive controllers into controllers.<n>.value (answered as #nnnnn=vvvvv lines, -0001 for a controller that does not exist)"
    params:
      controller: *controller
      count: { type: int, min: 1, max: 256, required: true, label: Count, description: "Number of consecutive controllers to read, starting at the controller given, up to 256." }
    send: "GSB2 {controller} {count}"
    returns: none
  set_fader_db:
    summary: "CS with a level in dB for a volume fader whose range is -72 to +12 dB (most are, p.5); -72 is off"
    params:
      controller: *controller
      level_db: { type: float, min: -72, max: 12, required: true, label: Level, description: "Fader level in dB from -72 (off) to +12, for a fader with that range; a fader with another range must be set by position." }
    send: "CS {controller} {level_db:to.symetrix_fader:.0f}"
    expect: *ack
    returns: ack
  get_fader_db:
    summary: "GS: a -72 to +12 dB volume fader's level in dB"
    params: { controller: *controller }
    send: "GS {controller}"
    expect: { matches: "^\\s*(\\d+)\\s*$", convert: symetrix_fader }
    returns: value
  button_on:
    summary: "CS <n> 65535: switch a button (mute, bypass, preset trigger, dial) on"
    params: { controller: *controller }
    send: "CS {controller} 65535"
    expect: *ack
    returns: ack
  button_off:
    summary: "CS <n> 0: switch a button off"
    params: { controller: *controller }
    send: "CS {controller} 0"
    expect: *ack
    returns: ack

  # ── Presets and unit ────────────────────────────────────────────────────
  load_preset:
    summary: "LP: load a preset, 1-1000; NAK when the preset is not defined"
    params:
      preset: { type: int, min: 1, max: 1000, required: true, label: Preset, description: "Preset number from 1 to 1000, as in Composer; the preset must be defined." }
    send: "LP {preset}"
    expect: *ack
    returns: ack
  get_preset:
    summary: "GPR: the last preset loaded, 0 when none has been"
    send: "GPR"
    expect: { matches: "^0*(\\d+)\\s*$" }
    returns: value
  flash_unit:
    summary: "FU: flash the front-panel LEDs for a number of cycles (8 by default)"
    params:
      cycles: { type: int, min: 1, max: 255, default: 8, label: Cycles, description: "Number of times to flash the front-panel LEDs; 8 when not given." }
    send: "FU {cycles}"
    expect: *ack
    returns: ack
  stop_flashing:
    summary: "FU 0: stop flashing the LEDs"
    send: "FU 0"
    expect: *ack
    returns: ack
  nop:
    summary: "NOP: no operation, answered ACK"
    send: "NOP"
    expect: *ack
    returns: ack
  get_ip:
    summary: "RI: the unit's IP address"
    send: "RI"
    expect: { matches: "^\\s*(\\d+\\.\\d+\\.\\d+\\.\\d+)" }
    returns: value
  reboot:
    summary: "R!: reboot the unit"
    send: "R!"
    returns: none

  # ── System strings: speed dials, VoIP dialing, call status ──────────────
  set_system_string:
    summary: "SSYSS <unit>.<resource>.<enum>.<card>.<channel>=<value>: set a system string (1000 speed-dial number, 1001 speed-dial name, 1004 number to dial)"
    params:
      unit: &unit { type: int, min: 1, max: 255, required: true, label: Unit, description: "The unit's number in the Composer site, as the protocol document addresses it, from 1." }
      resource: { type: enum, values: ["1000", "1001", "1004"], required: true, label: String, description: "Which system string to set: 1000 a speed dial's number, 1001 a speed dial's name, 1004 the number to dial next." }
      entry: &entry { type: int, min: 0, max: 19, default: 0, label: Entry, description: "Speed-dial entry from 0 to 19 for speed dials 1 to 20; 0 for strings without entries." }
      card: &card { type: int, min: 0, max: 3, required: true, label: Card, description: "The VoIP or telephony card's slot, numbered from 0 as the protocol addresses it." }
      channel: &tchannel { type: int, min: 0, max: 15, default: 0, label: Channel, description: "Channel or call appearance on the card, numbered from 0; 0 for speed dials and the number to dial." }
      value: { type: string, max_length: 63, required: true, label: Text, description: "The string to store, up to 63 characters." }
    send: "SSYSS {unit}.{resource}.{entry}.{card}.{channel}={value}"
    expect: *ack
    returns: ack
  get_system_string:
    summary: "GSYSS <unit>.<resource>.<enum>.<card>.<channel>: read a system string (1000-1006)"
    params:
      unit: *unit
      resource: { type: enum, values: ["1000", "1001", "1002", "1003", "1004", "1005", "1006"], required: true, label: String, description: "Which system string to read: 1000 speed-dial number, 1001 speed-dial name, 1002 number dialed, 1003 caller ID, 1004 number to dial, 1005 call status, 1006 call time." }
      entry: *entry
      card: *card
      channel: *tchannel
    send: "GSYSS {unit}.{resource}.{entry}.{card}.{channel}"
    expect: &string { matches: "^(.*?)\\s*$", not_contains: "NAK" }
    returns: value
  set_dial_number:
    summary: "SSYSS <unit>.1004.0.<card>.0: the number a VoIP card dials next (then press its connect button); up to 63 of 0-9 # * . and letters"
    params:
      unit: *unit
      card: *card
      number: { type: string, max_length: 63, pattern: "^[0-9#*.A-Za-z@:_-]+$", required: true, label: Number, description: "Number the VoIP card dials when its connect button is pressed, up to 63 of 0-9, #, *, . and letters." }
    send: "SSYSS {unit}.1004.0.{card}.0={number}"
    expect: *ack
    returns: ack
  set_speed_dial_number:
    summary: "SSYSS <unit>.1000.<entry>.<card>.0: a speed dial's number (entries 0-19 for speed dials 1-20)"
    params:
      unit: *unit
      card: *card
      entry: { type: int, min: 0, max: 19, required: true, label: Speed dial, description: "Speed-dial entry from 0 to 19, for speed dials 1 to 20." }
      number: { type: string, max_length: 63, required: true, label: Number, description: "The speed dial's number, up to 63 characters." }
    send: "SSYSS {unit}.1000.{entry}.{card}.0={number}"
    expect: *ack
    returns: ack
  set_speed_dial_name:
    summary: "SSYSS <unit>.1001.<entry>.<card>.0: a speed dial's name"
    params:
      unit: *unit
      card: *card
      entry: { type: int, min: 0, max: 19, required: true, label: Speed dial, description: "Speed-dial entry from 0 to 19, for speed dials 1 to 20." }
      name: { type: string, max_length: 63, required: true, label: Name, description: "The speed dial's name, up to 63 characters." }
    send: "SSYSS {unit}.1001.{entry}.{card}.0={name}"
    expect: *ack
    returns: ack
  get_speed_dial_number:
    summary: "GSYSS <unit>.1000.<entry>.<card>.0: a speed dial's number"
    params: { unit: *unit, card: *card, entry: { type: int, min: 0, max: 19, required: true, label: Speed dial, description: "Speed-dial entry from 0 to 19, for speed dials 1 to 20." } }
    send: "GSYSS {unit}.1000.{entry}.{card}.0"
    expect: *string
    returns: value
  get_speed_dial_name:
    summary: "GSYSS <unit>.1001.<entry>.<card>.0: a speed dial's name"
    params: { unit: *unit, card: *card, entry: { type: int, min: 0, max: 19, required: true, label: Speed dial, description: "Speed-dial entry from 0 to 19, for speed dials 1 to 20." } }
    send: "GSYSS {unit}.1001.{entry}.{card}.0"
    expect: *string
    returns: value
  get_dialed_number:
    summary: "GSYSS <unit>.1002.0.<card>.<channel>: the number dialed"
    params: { unit: *unit, card: *card, channel: *tchannel }
    send: "GSYSS {unit}.1002.0.{card}.{channel}"
    expect: *string
    returns: value
  get_caller_id:
    summary: "GSYSS <unit>.1003.0.<card>.<channel>: the caller ID"
    params: { unit: *unit, card: *card, channel: *tchannel }
    send: "GSYSS {unit}.1003.0.{card}.{channel}"
    expect: *string
    returns: value
  get_call_status:
    summary: "GSYSS <unit>.1005.0.<card>.<channel>: a VoIP call appearance's status (Idle, Dialing, Ringing, In Call: <number>, Hold, Busy, ...)"
    params: { unit: *unit, card: *card, channel: *tchannel }
    send: "GSYSS {unit}.1005.0.{card}.{channel}"
    expect: *string
    returns: value
  get_call_elapsed:
    summary: "GSYSS <unit>.1006.0.<card>.<channel>: the elapsed time of a VoIP call (\"Time 0:00:35\")"
    params: { unit: *unit, card: *card, channel: *tchannel }
    send: "GSYSS {unit}.1006.0.{card}.{channel}"
    expect: *string
    returns: value

  # ── Push ────────────────────────────────────────────────────────────────
  set_push_global:
    summary: "PU 1 / PU 0: turn pushing on or off for the whole unit (and every control system using it)"
    params:
      enabled: { type: bool, default: true, label: Push, description: "On turns pushing of changed values on for the whole unit, off turns it off for every control system using it." }
    send: "PU {enabled:bool01}"
    expect: *ack
    returns: ack
  push_enable:
    summary: "PUE: enable push for every controller (1-10000)"
    send: "PUE"
    expect: *ack
    returns: ack
  push_enable_range:
    summary: "PUE <low> <high>: enable push for a range of controllers (additive)"
    params: { low: { type: int, min: 1, max: 10000, required: true, label: First controller, description: "First controller number of the range, from 1 to 10000." }, high: { type: int, min: 1, max: 10000, required: true, label: Last controller, description: "Last controller number of the range, from 1 to 10000, included." } }
    send: "PUE {low} {high}"
    expect: *ack
    returns: ack
  push_disable:
    summary: "PUD: disable push for every controller"
    send: "PUD"
    expect: *ack
    returns: ack
  push_disable_range:
    summary: "PUD <low> <high>: disable push for a range of controllers"
    params: { low: { type: int, min: 1, max: 10000, required: true, label: First controller, description: "First controller number of the range, from 1 to 10000." }, high: { type: int, min: 1, max: 10000, required: true, label: Last controller, description: "Last controller number of the range, from 1 to 10000, included." } }
    send: "PUD {low} {high}"
    expect: *ack
    returns: ack
  push_refresh:
    summary: "PUR: push every push-enabled controller's value now, changed or not"
    send: "PUR"
    expect: *ack
    returns: ack
  push_refresh_range:
    summary: "PUR <low> <high>: push a range of controllers now"
    params: { low: { type: int, min: 1, max: 10000, required: true, label: First controller, description: "First controller number of the range, from 1 to 10000." }, high: { type: int, min: 1, max: 10000, required: true, label: Last controller, description: "Last controller number of the range, from 1 to 10000, included." } }
    send: "PUR {low} {high}"
    expect: *ack
    returns: ack
  push_clear:
    summary: "PUC: forget changes not yet pushed"
    send: "PUC"
    expect: *ack
    returns: ack
  set_push_interval:
    summary: "PUI: the minimum time between pushes, 20-30000 ms (100 at power-up)"
    params:
      interval_ms: { type: int, min: 20, max: 30000, required: true, label: Push interval, description: "Minimum time between pushes in milliseconds, from 20 to 30000; 100 at power-up." }
    send: "PUI {interval_ms}"
    expect: *ack
    returns: ack
  set_push_threshold:
    summary: "PUT: how far a value must move before it is pushed again, for parameters and for meters (1 at power-up)"
    params:
      parameter_threshold: { type: int, min: 0, max: 65535, required: true, label: Parameter threshold, description: "How far a parameter's position must move, on the 0-65535 scale, before it is pushed again; 1 at power-up." }
      meter_threshold: { type: int, min: 0, max: 65535, required: true, label: Meter threshold, description: "How far a meter's position must move, on the 0-65535 scale, before it is pushed again; 1 at power-up." }
    send: "PUT {parameter_threshold} {meter_threshold}"
    expect: *ack
    returns: ack

  # ── Super Matrix Mixer (CMV) ────────────────────────────────────────────
  matrix_set:
    summary: "CMV Set: set a Super Matrix parameter in its native unit (dB for gains, 0/1 for switches, ms for delay, % for pan); enumerator I3O6, I2, O1, or a {range,set}"
    params:
      unit: &cmvunit { type: int, min: 0, max: 255, default: 0, label: Unit, description: "Unit number of the Super Matrix's unit as the CMV commands address it; 0 when not given." }
      module: &module { type: int, min: 1, max: 255, default: 1, label: Matrix module, description: "The Super Matrix Mixer module's number in the design; 1 when not given." }
      feature: &feature { type: enum, values: [CPGain, CPConnect, CPDelay, IMute, IGain, ISolo, IPan, OMute, OGain, OPre], required: true, label: Parameter, description: "Super Matrix parameter: crosspoint gain, connect or delay; input mute, gain, solo or pan; output mute, gain or pre/post." }
      enumerator: &enumerator { type: string, max_length: 128, pattern: "^(I[0-9]+O[0-9]+|I[0-9]+|O[0-9]+|\\{[IO0-9:, ]+\\})$", required: true, label: Enumerator, description: "Which crosspoint, input or output: I3O6 for input 3 to output 6, I2 for input 2, O1 for output 1, or a set in braces." }
      value: { type: float, min: -1000, max: 10000, required: true, label: Value, description: "New value in the parameter's native unit: dB for gains, 0 or 1 for switches, ms for delay, % for pan." }
    send: "CMV Set {unit}.{module}.{feature}.{enumerator} {value:.2f}"
    expect: *ack
    returns: ack
  matrix_get:
    summary: "CMV Get: a Super Matrix parameter in its native unit"
    params: { unit: *cmvunit, module: *module, feature: *feature, enumerator: *enumerator }
    send: "CMV Get {unit}.{module}.{feature}.{enumerator}"
    expect: { matches: "^(?:[^=]*=)?\\s*(-?[0-9.]+)%?\\s*$" }
    returns: value
  matrix_modify:
    summary: "CMV Modify: change a Super Matrix parameter by an offset (for switches, positive turns on, negative off)"
    params:
      unit: *cmvunit
      module: *module
      feature: *feature
      enumerator: *enumerator
      offset: { type: float, min: -1000, max: 1000, required: true, label: Offset, description: "Amount to change the parameter by in its native unit; for a switch, positive turns it on and negative off." }
    send: "CMV Modify {unit}.{module}.{feature}.{enumerator} {offset:.2f}"
    expect: *ack
    returns: ack
  matrix_toggle:
    summary: "CMV Toggle: toggle a Super Matrix switch (crosspoint connect, mute, solo, pre/post)"
    params: { unit: *cmvunit, module: *module, feature: *feature, enumerator: *enumerator }
    send: "CMV Toggle {unit}.{module}.{feature}.{enumerator} 1"
    expect: *ack
    returns: ack
  matrix_reset:
    summary: "CMV Reset: put a Super Matrix parameter back to its default"
    params: { unit: *cmvunit, module: *module, feature: *feature, enumerator: *enumerator }
    send: "CMV Reset {unit}.{module}.{feature}.{enumerator}"
    expect: *ack
    returns: ack
  get_matrix_change_count:
    summary: "GSYSC <unit>.3060.-1,0: a counter that rises whenever anything in the Super Matrix changes"
    params: { unit: *cmvunit }
    send: "GSYSC {unit}.3060.-1,0"
    expect: { matches: "^\\s*(\\d+)\\s*$" }
    returns: value

state:
  controllers.*.value:
    type: int
    description: "A controller's position, 0-65535, keyed by controller number, from push data, GSB2 block reads and GS and GS2 answers; -1 when a block read names a controller that does not exist. Faders are linear in dB (usually -72 to +12 dB), buttons and LEDs 0 or 65535"
  preset.current:
    type: int
    description: "The last preset loaded, 1-1000, 0 when none has been since power-up (GPR, polled, and read again after load_preset)"
  matrix.*.*.*.*:
    type: float
    description: "A Super Matrix parameter in its native unit (dB for gains, 0 or 1 for switches, ms for delay, % for pan), keyed by unit, module, feature (CPGain, IMute, ...) and enumerator (I3O6, I2, O1), from CMV Get answers and read again after each CMV change to a single enumerator"
  matrix_changes.*:
    type: int
    description: "The Super Matrix change counter of a unit (0 for the one addressed), which rises with every change by any means (GSYSC <unit>.3060)"
  speed_dials.*.*.*.number:
    type: string
    description: "A speed dial's number, keyed by unit, card (0-3 for A-D) and entry (0-19 for speed dials 1-20), from GSYSS answers and read again after it is set"
  speed_dials.*.*.*.name:
    type: string
    description: "A speed dial's name, keyed as speed_dials.*.*.*.number"
  dial_numbers.*.*:
    type: string
    description: "The number a VoIP card dials next, keyed by unit and card (GSYSS resource 1004)"
  calls.*.*.*.status:
    type: string
    description: "A call appearance's status as the card words it (Idle, Dialing, Ringing, In Call: <number>, Hold, Busy, ...; Ready, Outgoing Call, Incoming Call, ... on analog telephony cards), keyed by unit, card and channel (GSYSS resource 1005)"
  calls.*.*.*.caller_id:
    type: string
    description: "Caller ID of a call appearance, keyed as calls.*.*.*.status (GSYSS resource 1003)"
  calls.*.*.*.dialed_number:
    type: string
    description: "The number dialed on a call appearance (GSYSS resource 1002)"
  calls.*.*.*.elapsed:
    type: string
    description: "Elapsed time of a call as the unit words it, such as \"Time 0:00:35\" (GSYSS resource 1006)"

telemetry:
  # Push is on at power-up for every controller (p.15); turn it on again in
  # case another control system turned it off, and ask for every value now.
  # The preset is not pushed: it is polled. Answers that are not push data
  # carry no marker of what they answer, so each is read with its request.
  subscribe:
    send: ["PU 1", "PUR"]
  poll:
    send: ["GPR"]
    every_ms: 10000
  updates:
    - match: '^#(\d+)=(-?\d+)\s*$'
      state: { "controllers.{1}.value": "{2}" }
    - match: '^\s*(\d+)\s+(\d+)\s*$'
      request_match: '^GS2 \d+$'
      state: { "controllers.{1}.value": "{2}" }
    - match: '^\s*(\d+)\s*$'
      request_match: '^GS (\d+)$'
      state: { "controllers.{2}.value": "{1}" }
    # A change set here is read back: only push-enabled controllers are
    # pushed.
    - match: '^ACK\s*$'
      request_match: '^(?:CS|CSQ|CC) (\d+) '
      then_send: ["GS2 {1}"]
    # GPR answers four digits, 0 for none (p.9).
    - match: '^0*(\d+)\s*$'
      request_match: '^GPR$'
      state: { preset.current: "{1}" }
    - match: '^ACK\s*$'
      request_match: '^LP \d+$'
      then_send: ["GPR"]
    # Quiet mode answers a Get with the value alone, verbose mode with the
    # parameter and "=" before it (p.23).
    - match: '^(?:[^=]*=)?\s*(-?[0-9.]+)%?\s*$'
      request_match: '^CMV Get (\d+)\.(\d+)\.(\w+)\.(I\d+O\d+|I\d+|O\d+)$'
      state: { "matrix.{2}.{3}.{4}.{5}": "{1}" }
    - match: '^ACK\s*$'
      request_match: '^CMV (?:Set|Modify|Toggle|Reset) (\d+)\.(\d+)\.(\w+)\.(I\d+O\d+|I\d+|O\d+)(?: |$)'
      then_send: ["CMV Get {1}.{2}.{3}.{4}"]
    - match: '^\s*(\d+)\s*$'
      request_match: '^GSYSC (\d+)\.3060\.-1,0$'
      state: { "matrix_changes.{2}": "{1}" }
    # A string answer has no marker; the bare "NAK" is the failure (p.12).
    - match: '^(|[^N].*|N|N[^A].*|NA|NA[^K].*|NAK.+)$'
      request_match: '^GSYSS (\d+)\.1000\.(\d+)\.(\d+)\.\d+$'
      state: { "speed_dials.{2}.{4}.{3}.number": "{1}" }
    - match: '^(|[^N].*|N|N[^A].*|NA|NA[^K].*|NAK.+)$'
      request_match: '^GSYSS (\d+)\.1001\.(\d+)\.(\d+)\.\d+$'
      state: { "speed_dials.{2}.{4}.{3}.name": "{1}" }
    - match: '^(|[^N].*|N|N[^A].*|NA|NA[^K].*|NAK.+)$'
      request_match: '^GSYSS (\d+)\.1002\.\d+\.(\d+)\.(\d+)$'
      state: { "calls.{2}.{3}.{4}.dialed_number": "{1}" }
    - match: '^(|[^N].*|N|N[^A].*|NA|NA[^K].*|NAK.+)$'
      request_match: '^GSYSS (\d+)\.1003\.\d+\.(\d+)\.(\d+)$'
      state: { "calls.{2}.{3}.{4}.caller_id": "{1}" }
    - match: '^(|[^N].*|N|N[^A].*|NA|NA[^K].*|NAK.+)$'
      request_match: '^GSYSS (\d+)\.1004\.\d+\.(\d+)\.\d+$'
      state: { "dial_numbers.{2}.{3}": "{1}" }
    - match: '^(|[^N].*|N|N[^A].*|NA|NA[^K].*|NAK.+)$'
      request_match: '^GSYSS (\d+)\.1005\.\d+\.(\d+)\.(\d+)$'
      state: { "calls.{2}.{3}.{4}.status": "{1}" }
    - match: '^(|[^N].*|N|N[^A].*|NA|NA[^K].*|NAK.+)$'
      request_match: '^GSYSS (\d+)\.1006\.\d+\.(\d+)\.(\d+)$'
      state: { "calls.{2}.{3}.{4}.elapsed": "{1}" }
    # A string set here is read back.
    - match: '^ACK\s*$'
      request_match: '^SSYSS (\d+)\.(\d+)\.(\d+)\.(\d+)\.(\d+)='
      then_send: ["GSYSS {1}.{2}.{3}.{4}.{5}"]

quirks:
  - models: [all]
    severity: info
    text: >
      Controller numbers are the ones assigned in Composer's Controller
      Manager; only controllers with "Enable Push" ticked in Composer are ever
      pushed, so state covers those (and whatever is read with get_controller
      or read_controller_block). Push settings (PU, PUE, PUD, PUI, PUT) are
      the unit's, shared by every control system and by RS-232.
  - models: [all]
    severity: info
    text: >
      Pushed values arrive as "#nnnnn=vvvvv" lines at most every 100 ms (up
      to 64 per interval); answers to commands never start with "#", which is
      how they are told apart. read_controller_block's answer has the same
      form as push data, so it is sent without waiting for an answer and its
      lines go straight to state; it is reported unverified.
  - models: [all]
    severity: warning
    text: >
      Answers are parsed in quiet mode with echo off. The session sends EH 0
      and SQ 1 on connecting; both are stored per port in the unit's
      non-volatile memory, so this also restores the defaults for other
      Ethernet control systems that changed them.
  - models: [all]
    severity: info
    text: >
      set_fader_db and get_fader_db assume a -72 to +12 dB fader; a fader with
      another range must be set by position (dB = min + (max - min) *
      position / 65535). A meter reads 72 * position / 65535 - 48 dBu.
      Two-state controls read back 0 or 65535 whatever was sent; selectors
      are spread evenly over 0-65535 ((n - 1) * 65535 / (count - 1)).
  - models: [all]
    severity: info
    text: >
      CSQ is answered ACK even for a controller that does not exist; CS checks
      and may take up to 40 ms. In native CMV mode a value outside the
      parameter's range is clipped, not refused.
  - models: [all]
    severity: info
    text: >
      A string answer (GSYSS) is returned as text, with no marker of its own;
      a name that is literally "NAK" is reported as a failure. GSYSS
      call-status values follow the VoIP or analog telephony card (p.12).
  - models: [all]
    severity: info
    text: >
      The current preset is polled every 10 seconds (GPR) and read again
      after load_preset. Speed dials, the number to dial, call status, caller
      ID, dialed number and call time are kept from GSYSS answers (the get_
      commands) and read again after an SSYSS change; Super Matrix values from
      matrix_get answers, read again after a change to a single crosspoint,
      input or output (a range or set is not read back); the matrix change
      counter from get_matrix_change_count. The protocol cannot list a site's
      units, cards or call appearances, so none of these is polled: a control
      system asks for the lines it uses. Composer's "Enable System String
      Pushing" makes the unit push string changes, but the protocol document
      does not give their format, so they are not read; call state that
      Composer exposes as push-enabled controllers (LEDs, buttons) reaches
      controllers.* like any controller.
  - models: [all]
    severity: info
    text: >
      A controller changed with set_controller, set_controller_quick,
      increment_controller or decrement_controller (and the fader and button
      commands) is read back with GS2, since only controllers with push
      enabled in Composer are pushed.
  - models: [all]
    severity: info
    text: >
      Up to six TCP sessions at once; a seventh closes the least recently used
      one, which then reconnects and may in turn close another.
  - models: [all]
    severity: critical
    text: >
      load_preset changes every parameter the preset holds, on a live system,
      and cannot be undone except by loading another preset.
  - models: [all]
    severity: critical
    text: >
      reboot restarts the unit, interrupting its audio; it is sent without
      waiting for an answer.
