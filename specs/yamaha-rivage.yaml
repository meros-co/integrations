    description: 'Stereo channel icon (MIXER:Current/St/Label/Icon): one of the listed strings'
  stereo.*.balance:
    type: int
    description: 'Stereo channel output balance (MIXER:Current/St/Out/Balance): -63 (L63) to 63 (R63),
      0 centre'
  stereo.*.role:
    type: string
    description: 'Stereo channel role (MIXER:Current/St/Role): Mono, StereoL, StereoR, SurrL, SurrR, SurrC,
      SurrLFE, SurrLs or SurrRs (Tables 10-13)'
  stereo.*.matrix_sends.*.level:
    type: int
    description: 'Stereo channel send level to matrix (MIXER:Current/St/ToMtrx/Level): hundredths of a
      dB, -32768 (-inf) to 1000 (+10 dB)'
  stereo.*.matrix_sends.*.on:
    type: bool
    description: 'Stereo channel send to matrix on (MIXER:Current/St/ToMtrx/On): true = 1 (ON), false
      = 0 (OFF)'
  stereo.*.matrix_sends.*.pan:
    type: int
    description: 'Stereo channel send pan/balance to matrix (MIXER:Current/St/ToMtrx/Pan): -63 (L63) to
      63 (R63), 0 centre'
  stereo.*.matrix_sends.*.pre:
    type: bool
    description: 'Stereo channel send to matrix pre/post (1 Pre, 0 Post) (MIXER:Current/St/ToMtrx/PrePost):
      1 Pre, 0 Post'
  surround_mode:
    type: bool
    description: 'Mixer surround mode (MIXER:Current/SurrMode): 0 stereo mode, 1 surround mode'
  oscillator.*.level:
    type: int
    description: 'Oscillator level (MIXER:Setup/Oscillator/Level): hundredths of a dB, -96 to 0 dB'
  oscillator.on:
    type: bool
    description: 'Oscillator on (MIXER:Setup/Oscillator/On): true = 1 (ON), false = 0 (OFF)'
  oscillator.type:
    type: string
    description: 'Oscillator type (Table 17) (MIXER:Setup/Oscillator/Type): one of the listed strings'
  scene.current:
    type: string
    description: Current scene number as text, x.xx
  scene.modified:
    type: bool
    description: A parameter changed since the scene was recalled (status modified/unmodified)
  device.product_name:
    type: string
    description: Product name (devinfo productname)
  device.name:
    type: string
    description: Device name assigned by the user (devinfo devicename)
  device.run_mode:
    type: string
    description: 'Run mode: normal, emergency, booting or update (devstatus runmode)'
  device.error:
    type: string
    description: 'Alert status: none, or flt/err/wrn alert text (devstatus error)'

