        min: -32768
        max: 1000
        required: true
    send: set MIXER:Current/DCA/Fader/Level {dca:-1} 0 {level}
    expect:
      matches: '^OKm? set MIXER:Current/DCA/Fader/Level \d+ \d+ '
    returns: ack
  get_dca_fader_level:
    summary: Read the DCA group fader level (MIXER:Current/DCA/Fader/Level); returns the raw value (hundredths
