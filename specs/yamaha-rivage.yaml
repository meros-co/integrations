        required: true
    send: get MIXER:Current/DCA/Fader/Level {dca:-1} 0
    expect:
      matches: ^OK get MIXER:Current/DCA/Fader/Level \d+ \d+ (-?\d+)
    returns: value
  set_dca_on:
    summary: 'Set the DCA group channel ON key (0 OFF, the channel is muted; 1 ON) (MIXER:Current/DCA/Fader/On;
      dca = DCA group from 1; enabled: true = 1 (ON), false = 0 (OFF))'
    params:
      dca:
        type: int
        min: 1
        max: 24
        required: true
      enabled:
        type: bool
        required: true
    send: set MIXER:Current/DCA/Fader/On {dca:-1} 0 {enabled:bool01}
    expect:
      matches: '^OKm? set MIXER:Current/DCA/Fader/On \d+ \d+ '
    returns: ack
  get_dca_on:
    summary: Read the DCA group channel ON key (0 OFF, the channel is muted; 1 ON) (MIXER:Current/DCA/Fader/On);
      returns the raw value (true = 1 (ON), false = 0 (OFF))
    params:
      dca:
        type: int
        min: 1
        max: 24
        required: true
    send: get MIXER:Current/DCA/Fader/On {dca:-1} 0
    expect:
      matches: ^OK get MIXER:Current/DCA/Fader/On \d+ \d+ (-?\d+)
    returns: value
  set_dca_name:
    summary: 'Set the DCA group name (up to 8 characters) (MIXER:Current/DCA/Label/Name; dca = DCA group
      from 1; name: up to 8 printable ASCII characters)'
    params:
      dca:
        type: int
        min: 1
        max: 24
        required: true
      name:
        type: string
        max_length: 8
        pattern: ^[ -~]*$
        required: true
    send: set MIXER:Current/DCA/Label/Name {dca:-1} 0 {name:json}
    expect:
      matches: '^OKm? set MIXER:Current/DCA/Label/Name \d+ \d+ '
    returns: ack
  get_dca_name:
    summary: Read the DCA group name (up to 8 characters) (MIXER:Current/DCA/Label/Name); returns the
      raw value (up to 8 printable ASCII characters)
    params:
      dca:
        type: int
        min: 1
        max: 24
        required: true
    send: get MIXER:Current/DCA/Label/Name {dca:-1} 0
    expect:
      matches: ^OK get MIXER:Current/DCA/Label/Name \d+ \d+ "((?:[^"\\]|\\.)*)"
    returns: value
  set_dca_color:
