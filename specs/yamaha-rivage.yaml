      listed strings)'
    params:
      value:
        type: enum
        values:
          - MIX
          - LAST
        required: true
    send: set MIXER:Current/Cue/Surr/CueMode 0 0 "{value}"
    expect:
      matches: '^OKm? set MIXER:Current/Cue/Surr/CueMode \d+ \d+ '
    returns: ack
  get_cue_surround_mode:
    summary: Read the cue mode in 5.1 surround mode (MIXER:Current/Cue/Surr/CueMode); returns the raw
      value (one of the listed strings)
    send: get MIXER:Current/Cue/Surr/CueMode 0 0
    expect:
      matches: ^OK get MIXER:Current/Cue/Surr/CueMode \d+ \d+ "((?:[^"\\]|\\.)*)"
    returns: value
  set_dca_fader_level:
