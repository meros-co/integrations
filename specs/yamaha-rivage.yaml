    expect:
      matches: ^OK ssrecallt_ex MIXER:Lib/Scene
    returns: ack
  get_current_scene:
    summary: Read the current scene number (sscurrentt_ex MIXER:Lib/Scene; not in Yamaha's document, see
      quirks)
    send: sscurrentt_ex MIXER:Lib/Scene
    expect:
      matches: ^OK sscurrentt_ex MIXER:Lib/Scene "?([0-9.]+)"?
    returns: value
  set_parameter:
    summary: Set any numeric parameter by its RCP address (raw value, as the console's parameter list
      gives it); x and y are sent as given, numbered from 0, and 0 where the address has no X or Y
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
      x:
        type: int
        min: 0
        required: true
      y:
        type: int
        min: 0
        required: true
      value:
        type: int
        required: true
    send: set {address} {x} {y} {value}
    expect:
      matches: '^OKm? set \S+ \d+ \d+ '
    returns: ack
  set_parameter_text:
    summary: Set any text parameter (name, colour, type) by its RCP address; the value is sent double-quoted
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
      x:
        type: int
        min: 0
        required: true
      y:
        type: int
        min: 0
        required: true
      value:
        type: string
        pattern: ^[ -~]*$
        required: true
    send: set {address} {x} {y} {value:json}
    expect:
      matches: '^OKm? set \S+ \d+ \d+ '
    returns: ack
  get_parameter:
    summary: Read any parameter by its RCP address; returns the value as sent, a text value with its quotes
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
      x:
        type: int
        min: 0
        required: true
      y:
        type: int
        min: 0
        required: true
    send: get {address} {x} {y}
    expect:
      matches: ^OK get \S+ \d+ \d+ (.*?)\s*$
    returns: value
  get_product_name:
    summary: Read the product name (devinfo productname)
    send: devinfo productname
    expect:
      matches: ^OK devinfo productname "?([^"]*?)"?\s*$
    returns: value
  get_device_name:
    summary: Read the device name the user assigned (devinfo devicename)
    send: devinfo devicename
    expect:
      matches: ^OK devinfo devicename "?([^"]*?)"?\s*$
    returns: value
  get_run_mode:
    summary: 'Read the run mode (devstatus runmode): normal, emergency, booting or update'
    send: devstatus runmode
    expect:
      matches: ^OK devstatus runmode "?([a-z]+)"?
    returns: value
  get_error_status:
    summary: 'Read the alert status (devstatus error): none, or the active fault/error/warning alert text'
    send: devstatus error
    expect:
      matches: ^OK devstatus error "?(.*?)"?\s*$
    returns: value
  set_keepalive:
    summary: Ask the console to close the connection if nothing (a command or a lone LF) arrives for interval_ms
      milliseconds (scpmode keepalive; more than 1000)
    params:
      interval_ms:
        type: int
        min: 1001
        required: true
    send: scpmode keepalive {interval_ms}
    expect:
      matches: ^OK scpmode keepalive
    returns: ack

quirks:
  - models:
      - all
    severity: critical
    text: >-
      Yamaha publishes no remote control protocol specification for its mixing consoles. For RIVAGE PM,
      Yamaha documents the parameter addresses, X/Y dimensions, ranges and value tables in its RIVAGE
      PM Series OSC Specifications, where the OSC parameter ID is the RCP address, plus the scene recall
      ssrecallt_ex MIXER:Lib/Scene "x.xx". The rest of the protocol is taken from Yamaha's RCP specifications
      for the DME7 and the RM series, which describe the same text protocol on TCP 49280 for other products:
      get and its "OK get <address> <x> <y> <value>" reply, "OK set ..." and "OKm set ..." (the value
      was clamped into range) acknowledgements, "ERROR <command> <code>" failures, "NOTIFY set" pushes,
      devinfo, devstatus and scpmode keepalive. That the consoles behave this way is corroborated by the
      MIT-licensed Bitfocus Companion module, not by Yamaha; treat those parts as unconfirmed until bench-tested.
  - models:
      - all
    severity: warning
    text: >-
      X and Y are numbered from 0 on the wire (Yamaha's command list: X 0 = input channel 1), while Yamaha's
      OSC documents number them from 1. Typed commands take channel, mix, band and other numbers from
      1 and subtract one; set_parameter, set_parameter_text and get_parameter send x and y exactly as
      given. A parameter without an X or Y dimension still takes both, sent as 0.
  - models:
      - all
    severity: warning
    text: >-
      Every line ends with LF (0x0A); a lone LF is accepted as a heartbeat. Text values travel in double
      quotes with \" and \\ escapes (DME7 spec 3.1 p.8) and must be ASCII. Names and other text telemetry
      are stored as received, inside the quotes, so an escaped quote stays escaped. A set outside the
      parameter's range is clamped by the device and acknowledged "OKm"; typed commands range-check first,
      but set_parameter does not. Failures arrive as "ERROR <command> <code>" with codes UnknownCommand,
      WrongFormat, InvalidArgument, UnknownAddress, TooLongCommand, AccessDenied, Busy, ReadOnly, NoPermission,
      Overload, Overflow, InternalError and others (DME7 spec 3.5.1 p.38).
  - models:
      - all
    severity: info
    text: >-
      Values are raw integers, not dB: fader and send levels are hundredths of a dB from -32768 (-inf)
      to 1000 (+10.00 dB), pans -63 (L63) to 63 (R63), frequencies tenths of a Hz, Q thousandths. Yamaha's
      fader table lists the values the console steps through; the console accepts any value in range.
  - models:
      - all
    severity: info
    text: >-
      Parameter changes made on the console or by another controller are pushed as "NOTIFY set <address>
      <x> <y> <value> ..." lines (DME7 spec 3.2.2 p.10, 4.8 p.49), which the telemetry rules apply. The
      DME7 specification says parameters changed by a snapshot recall are not individually notified (p.10);
      whether a console scene recall pushes every changed parameter is not documented. State read on connecting
      can therefore be stale after a scene recall until the values are read again.
  - models:
      - all
    severity: info
    text: >-
      On connecting, the telemetry poll reads every fader level, ON key and name of the largest model
      in the family, one query at a time. A smaller model answers the queries for channels it lacks with
      ERROR, which leaves no state. Channel limits in typed commands are likewise the family's largest;
      a channel the model lacks is refused by the console with ERROR.
  - models:
      - all
    severity: info
    text: >-
      scpmode keepalive makes the console close the connection itself when it hears nothing for the given
      time (the DME7 document adds one second), freeing the slot after a controller vanishes; without
      it a half-open connection can block new ones (DME7 spec 2-8 p.15). After it is set the controller
      must send something, a command or a lone LF, within the interval, which this spec cannot schedule;
      use it only where the host sends traffic regularly. Meter data (mtrstart and NOTIFY mtr) is not
      covered: Yamaha documents no console meter addresses and the format cannot map a variable-length
      meter list to per-channel state.
  - models:
      - all
    severity: warning
    text: >-
      Requires RIVAGE PM firmware V5.00 or later for the documented parameter set (p.1); V1.0.2 follows
      V5.01 and V5.02. Yamaha's OSC document addresses the system at the DSP ENGINE IP SETTING address
      (p.3) and says up to 10 remote controllers can connect to one system through the Network PC port
      of the console or the DSP engine; it does not say which address answers RCP on TCP 49280.
  - models:
      - all
    severity: warning
    text: >-
      Scene numbers are text, "1.00" to "999.99" (p.3, p.11). get_current_scene (sscurrentt_ex) is not
      in Yamaha's document; it and its reply format come from the Companion module, which also sends scpmode
      sstype "text" first. Yamaha documents no such command and this spec does not send it.
  - models:
      - all
    severity: critical
    text: >-
      A scene recall changes the live mix at once, subject to the console's recall safe and focus settings.
  - models:
      - all
    severity: info
    text: >-
      Taken from the document as written: Dyna1/Dyna2 Attack and Ratio are listed twice with different
      ranges and scaling, once for most dynamics types and once for COMP260, so one command takes the
      union of both ranges and the meaning of the value depends on the dynamics type; Threshold is -600
      to 0 with "Min Val for GATE, DUCKING: -72db", so -720 is allowed; the DeEsser type list ends in
      a trailing comma after "HIGH SHELF"; Mix Dyna1/Type has a bank A/B Y dimension where Matrix and
      Stereo have none; InputChLink and OutputChLink list both MatrixSend and MtrxSend link parameters
      (typed here as *_matrix_send_alt and *_matrix_send); the 5.1 surround monitor channel switches (Monitor/Surr/LOn
      etc.) are 0 ON, 1 MUTE, the opposite of their names, and are typed as *_mute. The channel role tables
      (10-13) do not say which role column lacks the surround roles, so roles are free text.
  - models:
      - all
    severity: info
    text: >-
      The four stereo channels are 1 Stereo A L, 2 Stereo A R, 3 Stereo B L, 4 Stereo B R (p.15). Input
      patches (Table 8) and output port patches (Tables 4, 9) are strings built from a port name and a
      channel number, such as "MIX12" or "CS1 MY1 3"; they are sent as given. set_monitor_mix_pin sets
      the MonitorMix PIN and has no query here, so the PIN is never read back or stored.

