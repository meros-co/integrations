    returns: value
  set_digital_out_patch:
    summary: 'Set the console AES output port patch (MIXER:Current/DigitalOutPort/Patch; console = console
      ID from 1, output = AES out channel from 1; value: NONE, CUE A [L|R], CUE B [L|R], MONI A/B/AB [L|R|C],
      S CUE/S MON/S METER [LFE|Ls|Rs|L|R|C], TB [n], ST A [L|R], ST B [L|R], MIX[n], MTRX[n] or DIR OUT[n]
      (Table 4))'
    params:
      console:
        type: int
        min: 1
        max: 2
        required: true
      output:
        type: int
        min: 1
        max: 8
        required: true
      value:
        type: string
        pattern: ^[ -~]*$
        required: true
        max_length: 32
    send: set MIXER:Current/DigitalOutPort/Patch {console:-1} {output:-1} {value:json}
    expect:
      matches: '^OKm? set MIXER:Current/DigitalOutPort/Patch \d+ \d+ '
    returns: ack
  get_digital_out_patch:
    summary: Read the console AES output port patch (MIXER:Current/DigitalOutPort/Patch); returns the
      raw value (NONE, CUE A [L|R], CUE B [L|R], MONI A/B/AB [L|R|C], S CUE/S MON/S METER [LFE|Ls|Rs|L|R|C],
      TB [n], ST A [L|R], ST B [L|R], MIX[n], MTRX[n] or DIR OUT[n] (Table 4))
    params:
      console:
        type: int
        min: 1
        max: 2
        required: true
      output:
        type: int
        min: 1
        max: 8
        required: true
    send: get MIXER:Current/DigitalOutPort/Patch {console:-1} {output:-1}
    expect:
      matches: ^OK get MIXER:Current/DigitalOutPort/Patch \d+ \d+ "((?:[^"\\]|\\.)*)"
    returns: value
  set_omni_out_patch:
