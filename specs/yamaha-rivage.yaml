    expect:
      matches: '^OKm? set MIXER:Current/Cue/Out/On \d+ \d+ '
    returns: ack
  get_cue_output_on:
    summary: Read the cue output on (MIXER:Current/Cue/Out/On); returns the raw value (true = 1 (ON),
