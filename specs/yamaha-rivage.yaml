    send: get MIXER:Current/Cue/InCh/On {channel:-1} {cue:-1}
    expect:
      matches: ^OK get MIXER:Current/Cue/InCh/On \d+ \d+ (-?\d+)
    returns: value
  set_cue_input_point:
    summary: 'Set the cue point for input channels (MIXER:Current/Cue/InCh/Point; cue = cue A/B from 1;
