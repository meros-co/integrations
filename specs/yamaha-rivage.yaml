commands:
  set_cue_active:
    summary: 'Set the active cue (Table 1) (MIXER:Current/Cue/ActiveCue; cue = cue A/B from 1; value:
      one of the listed strings)'
    params:
      cue:
        type: int
        min: 1
        max: 2
        required: true
      value:
        type: enum
        values:
          - NONE
          - OTHERS
          - INPUT
          - DCA
          - OUTPUT
        required: true
    send: set MIXER:Current/Cue/ActiveCue {cue:-1} 0 "{value}"
    expect:
      matches: '^OKm? set MIXER:Current/Cue/ActiveCue \d+ \d+ '
    returns: ack
  get_cue_active:
    summary: Read the active cue (Table 1) (MIXER:Current/Cue/ActiveCue); returns the raw value (one of
      the listed strings)
    params:
      cue:
        type: int
        min: 1
        max: 2
        required: true
    send: get MIXER:Current/Cue/ActiveCue {cue:-1} 0
    expect:
      matches: ^OK get MIXER:Current/Cue/ActiveCue \d+ \d+ "((?:[^"\\]|\\.)*)"
    returns: value
  set_cue_mode:
    summary: 'Set the cue mode (MIXER:Current/Cue/CueMode; cue = cue A/B from 1; value: one of the listed
      strings)'
    params:
      cue:
        type: int
        min: 1
        max: 2
        required: true
      value:
        type: enum
        values:
          - MIX
          - LAST
        required: true
    send: set MIXER:Current/Cue/CueMode {cue:-1} 0 "{value}"
    expect:
      matches: '^OKm? set MIXER:Current/Cue/CueMode \d+ \d+ '
    returns: ack
  get_cue_mode:
    summary: Read the cue mode (MIXER:Current/Cue/CueMode); returns the raw value (one of the listed strings)
    params:
      cue:
        type: int
        min: 1
        max: 2
        required: true
    send: get MIXER:Current/Cue/CueMode {cue:-1} 0
    expect:
      matches: ^OK get MIXER:Current/Cue/CueMode \d+ \d+ "((?:[^"\\]|\\.)*)"
    returns: value
  set_dca_cue_on:
    summary: 'Set the DCA group cue on (MIXER:Current/Cue/DCA/On; dca = DCA group from 1, cue = cue A/B
      from 1; enabled: true = 1 (ON), false = 0 (OFF))'
    params:
      dca:
        type: int
        min: 1
        max: 24
        required: true
      cue:
        type: int
        min: 1
        max: 2
        required: true
      enabled:
        type: bool
        required: true
    send: set MIXER:Current/Cue/DCA/On {dca:-1} {cue:-1} {enabled:bool01}
    expect:
      matches: '^OKm? set MIXER:Current/Cue/DCA/On \d+ \d+ '
    returns: ack
  get_dca_cue_on:
    summary: Read the DCA group cue on (MIXER:Current/Cue/DCA/On); returns the raw value (true = 1 (ON),
      false = 0 (OFF))
    params:
      dca:
        type: int
        min: 1
        max: 24
        required: true
      cue:
        type: int
        min: 1
        max: 2
        required: true
    send: get MIXER:Current/Cue/DCA/On {dca:-1} {cue:-1}
    expect:
      matches: ^OK get MIXER:Current/Cue/DCA/On \d+ \d+ (-?\d+)
    returns: value
  set_cue_dca_point:
    summary: 'Set the cue point for DCA groups (MIXER:Current/Cue/DCA/Point; cue = cue A/B from 1; value:
      one of the listed strings)'
    params:
      cue:
        type: int
        min: 1
        max: 2
        required: true
      value:
        type: enum
        values:
          - PRE PAN
          - POST PAN
        required: true
    send: set MIXER:Current/Cue/DCA/Point {cue:-1} 0 "{value}"
    expect:
      matches: '^OKm? set MIXER:Current/Cue/DCA/Point \d+ \d+ '
    returns: ack
  get_cue_dca_point:
    summary: Read the cue point for DCA groups (MIXER:Current/Cue/DCA/Point); returns the raw value (one
      of the listed strings)
    params:
      cue:
        type: int
        min: 1
        max: 2
        required: true
    send: get MIXER:Current/Cue/DCA/Point {cue:-1} 0
    expect:
      matches: ^OK get MIXER:Current/Cue/DCA/Point \d+ \d+ "((?:[^"\\]|\\.)*)"
    returns: value
  set_cue_dca_unity:
    summary: 'Set the DCA cue unity gain (MIXER:Current/Cue/DCA/Unity; cue = cue A/B from 1; enabled:
      true = 1 (ON), false = 0 (OFF))'
    params:
      cue:
        type: int
        min: 1
        max: 2
        required: true
      enabled:
        type: bool
        required: true
    send: set MIXER:Current/Cue/DCA/Unity {cue:-1} 0 {enabled:bool01}
    expect:
      matches: '^OKm? set MIXER:Current/Cue/DCA/Unity \d+ \d+ '
    returns: ack
  get_cue_dca_unity:
    summary: Read the DCA cue unity gain (MIXER:Current/Cue/DCA/Unity); returns the raw value (true =
      1 (ON), false = 0 (OFF))
    params:
      cue:
        type: int
        min: 1
        max: 2
        required: true
    send: get MIXER:Current/Cue/DCA/Unity {cue:-1} 0
    expect:
      matches: ^OK get MIXER:Current/Cue/DCA/Unity \d+ \d+ (-?\d+)
    returns: value
  set_input_cue_on:
