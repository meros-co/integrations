          - Orange
          - Yellow
          - Purple
          - SkyBlue
          - Pink
          - Red
          - Green
          - LtGreen
          - White
          - 'OFF'
        required: true
    send: set MIXER:Current/DCA/Label/Color {dca:-1} 0 "{value}"
    expect:
