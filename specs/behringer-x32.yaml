  set_scene_name:
    summary: "Set the name of the scene at a position"
    params:
      index: { type: int, min: 0, max: 99, required: true, label: "Scene position", description: "Scene position 0 to 99 in the show." }
      name: { type: string, max_length: 32, required: true, label: "Name", description: "Name, up to 32 characters." }
    send:
      address: "/-show/showfile/scene/{index:03d}/name"
      args: [ { value: "{name}", type: string } ]
    returns: none

  set_scene_notes:
    summary: "Set the notes of the scene at a position"
    params:
      index: { type: int, min: 0, max: 99, required: true, label: "Scene position", description: "Scene position 0 to 99 in the show." }
      notes: { type: string, max_length: 32, required: true, label: "Notes", description: "Scene notes, up to 32 characters." }
    send:
      address: "/-show/showfile/scene/{index:03d}/notes"
      args: [ { value: "{notes}", type: string } ]
    returns: none

  set_scene_safe_groups:
    summary: "Set the Scene Safes of the scene at a position (bitmap: bit 1 Talkback, 2 Effects, 3 Mix Buses, 4 Chan Process, 5 Configuration, 6 Preamp, 7 Output Patch, 8 Routing I/O)"
    params:
      index: { type: int, min: 0, max: 99, required: true, label: "Scene position", description: "Scene position 0 to 99 in the show." }
      bitmap: { type: int, min: 0, max: 511, required: true, label: "Safes", description: "Bitmap: bit 1 Talkback, 2 Effects, 3 Mix Buses, 4 Chan Process, 5 Configuration, 6 Preamp (HA), 7 Output Patch, 8 Routing I/O." }
    send:
      address: "/-show/showfile/scene/{index:03d}/safes"
      args: [ { value: "{bitmap}", type: int } ]
    returns: none

  set_snippet_name:
    summary: "Set the name of the snippet at a position"
    params:
      index: { type: int, min: 0, max: 99, required: true, label: "Snippet position", description: "Snippet position 0 to 99 in the show." }
      name: { type: string, max_length: 32, required: true, label: "Name", description: "Name, up to 32 characters." }
    send:
      address: "/-show/showfile/snippet/{index:03d}/name"
      args: [ { value: "{name}", type: string } ]
    returns: none

  set_snippet_filters:
    summary: "Set the parameter filters the snippet at a position affects (bitmap)"
    params:
      index: { type: int, min: 0, max: 99, required: true, label: "Snippet position", description: "Snippet position 0 to 99 in the show." }
      bitmap: { type: int, min: 0, max: 33554431, required: true, label: "Parameter filters", description: "Bitmap of the parameter filters and effects the snippet affects, as listed on p.47 (bits 0-24)." }
    send:
      address: "/-show/showfile/snippet/{index:03d}/eventtyp"
      args: [ { value: "{bitmap}", type: int } ]
    returns: none

  set_snippet_channels:
    summary: "Set the channels the snippet at a position affects (bitmap)"
    params:
      index: { type: int, min: 0, max: 99, required: true, label: "Snippet position", description: "Snippet position 0 to 99 in the show." }
      bitmap: { type: int, min: -2147483648, max: 2147483647, required: true, label: "Channels", description: "Bitmap of input channels the snippet affects: bit 0 is channel 1 up to bit 31 for channel 32, as a signed 32-bit integer (bit 31 makes it negative)." }
    send:
      address: "/-show/showfile/snippet/{index:03d}/channels"
      args: [ { value: "{bitmap}", type: int } ]
    returns: none

  set_snippet_aux_buses:
    summary: "Set the returns and buses the snippet at a position affects (bitmap)"
    params:
      index: { type: int, min: 0, max: 99, required: true, label: "Snippet position", description: "Snippet position 0 to 99 in the show." }
      bitmap: { type: int, min: -2147483648, max: 2147483647, required: true, label: "Returns and buses", description: "Bitmap: bits 0-15 aux inputs 1-8 and FX returns 1L-4R, bits 16-31 mix buses 1-16, as a signed 32-bit integer (bit 31 makes it negative)." }
    send:
      address: "/-show/showfile/snippet/{index:03d}/auxbuses"
      args: [ { value: "{bitmap}", type: int } ]
    returns: none

  set_snippet_main_groups:
    summary: "Set the main, matrix and groups the snippet at a position affects (bitmap)"
    params:
      index: { type: int, min: 0, max: 99, required: true, label: "Snippet position", description: "Snippet position 0 to 99 in the show." }
      bitmap: { type: int, min: -2147483648, max: 2147483647, required: true, label: "Main, matrix and groups", description: "Bitmap of the matrices, mains and DCA groups the snippet affects (p.48), as a signed 32-bit integer." }
    send:
      address: "/-show/showfile/snippet/{index:03d}/maingrps"
      args: [ { value: "{bitmap}", type: int } ]
    returns: none

  set_fx_source:
    summary: "Set the left or right input source of effects slot 1-4: 0 INS (inserted), 1-16 MIX1-16, 17 M/C"
    params:
      slot: { type: int, min: 1, max: 4, required: true, label: "FX slot", description: "Effects slot 1-4; slots 5-8 are insert-only." }
      side: { type: enum, values: ["l", "r"], required: true, label: "Side", description: "The slot's left (l) or right (r) input." }
      source: { type: int, min: 0, max: 17, required: true, label: "Source", description: "Source: 0 INS (used as an insert), 1 to 16 mix buses 1 to 16, 17 M/C." }
    send:
      address: "/fx/{slot}/source/{side}"
      args: [ { value: "{source}", type: int } ]
    returns: none

  set_fx_parameter_int:
    summary: "Set an effects slot parameter that is an enumeration or switch (,i), 1-64, by its index"
    params:
      slot: { type: int, min: 1, max: 8, required: true, label: "FX slot", description: "Effects slot 1-8, numbered as on the console." }
      parameter: { type: int, min: 1, max: 64, required: true, label: "Parameter", description: "Parameter number 1-64; its meaning depends on the effect type (p.86-115)." }
      value: { type: int, min: 0, max: 127, required: true, label: "Value", description: "The enumeration's index from 0, or 0/1 for a switch, as listed for the effect type." }
    send:
      address: "/fx/{slot}/par/{parameter:02d}"
      args: [ { value: "{value}", type: int } ]
    returns: none

  set_geq_band:
    summary: "Set a band of a graphic EQ effect (GEQ, TEQ, or side A of GEQ2/TEQ2): parameter 1-31 (0-1 over -15 to +15 dB)"
    params:
      slot: { type: int, min: 1, max: 8, required: true, label: "FX slot", description: "Effects slot 1-8, numbered as on the console." }
      band: { type: int, min: 1, max: 31, required: true, label: "Band", description: "Graphic EQ band 1 to 31, from 20 Hz to 20 kHz in third octaves." }
      gain: { type: float, min: 0.0, max: 1.0, required: true, label: "Gain", description: "Band gain as a fraction 0 to 1 over -15 to +15 dB; 0.5 is 0 dB." }
    send:
      address: "/fx/{slot}/par/{band:02d}"
      args: [ { value: "{gain}", type: float } ]
    returns: none

  set_geq_band_b:
    summary: "Set a band of side B of a dual graphic EQ effect (GEQ2/TEQ2): parameter 33-63 (0-1 over -15 to +15 dB)"
    params:
      slot: { type: int, min: 1, max: 8, required: true, label: "FX slot", description: "Effects slot 1-8, numbered as on the console." }
      band: { type: int, min: 1, max: 31, required: true, label: "Band", description: "Graphic EQ band 1 to 31, from 20 Hz to 20 kHz in third octaves." }
      gain: { type: float, min: 0.0, max: 1.0, required: true, label: "Gain", description: "Band gain as a fraction 0 to 1 over -15 to +15 dB; 0.5 is 0 dB." }
    send:
      address: "/fx/{slot}/par/{band:+32:02d}"
      args: [ { value: "{gain}", type: float } ]
    returns: none

  set_geq_master:
    summary: "Set the master level of a graphic EQ effect (side A of a dual one): parameter 32 (0-1 over -15 to +15 dB)"
    params:
      slot: { type: int, min: 1, max: 8, required: true, label: "FX slot", description: "Effects slot 1-8, numbered as on the console." }
      level: { type: float, min: 0.0, max: 1.0, required: true, label: "Master level", description: "Master level as a fraction 0 to 1 over -15 to +15 dB; 0.5 is 0 dB." }
    send:
      address: "/fx/{slot}/par/32"
      args: [ { value: "{level}", type: float } ]
    returns: none

  set_geq_master_b:
    summary: "Set the master level of side B of a dual graphic EQ effect: parameter 64 (0-1 over -15 to +15 dB)"
    params:
      slot: { type: int, min: 1, max: 8, required: true, label: "FX slot", description: "Effects slot 1-8, numbered as on the console." }
      level: { type: float, min: 0.0, max: 1.0, required: true, label: "Master level", description: "Master level as a fraction 0 to 1 over -15 to +15 dB; 0.5 is 0 dB." }
    send:
      address: "/fx/{slot}/par/64"
      args: [ { value: "{level}", type: float } ]
    returns: none

  set_console_name:
    summary: "Set the console's network name, also reported by /xinfo"
    params:
      name: { type: string, max_length: 32, required: true, label: "Name", description: "Console name, as shown in Setup and reported by /xinfo." }
    send:
      address: "/-prefs/name"
      args: [ { value: "{name}", type: string } ]
    returns: none

  set_preference_switch:
    summary: "Switch one of the console's on/off preferences: confirm_general, confirm_overwrite, confirm_sceneload, viewrtn, selfollowsbank, scene_advance, safe_masterlevels, autosel, hardmute, dcamute, lampon"
    params:
      preference: { type: enum, values: ["confirm_general", "confirm_overwrite", "confirm_sceneload", "viewrtn", "selfollowsbank", "scene_advance", "safe_masterlevels", "autosel", "hardmute", "dcamute", "lampon"], required: true, label: "Preference", description: "confirm_general: General confirmation pop-ups; confirm_overwrite: Overwrite confirmation pop-ups; confirm_sceneload: Scene-load confirmation pop-ups; viewrtn: View returns to the last page; selfollowsbank: Select follows bank; scene_advance: Scenes go to the next one after a recall (Scene Go Next); safe_masterlevels: Main levels safe from scene recalls; autosel: Fader touch selects the channel; hardmute: Hard mutes; dcamute: DCA mutes mute their channels; lampon: Desk lamp power." }
      enabled: { type: bool, default: true, label: "On", description: "On switches the preference on, off switches it off." }
    send:
      address: "/-prefs/{preference}"
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  set_show_control:
    summary: "Set what the Scenes page and GO steps through: 0 CUES, 1 SCENES, 2 SNIPPETS"
    params:
      mode: { type: int, min: 0, max: 2, required: true, label: "Show control", description: "0 cues, 1 scenes, 2 snippets." }
    send:
      address: "/-prefs/show_control"
      args: [ { value: "{mode}", type: int } ]
    returns: none

  set_sample_rate:
    summary: "Set the console's sample rate: 0 48 kHz, 1 44.1 kHz"
    params:
      rate: { type: int, min: 0, max: 1, required: true, label: "Sample rate", description: "0 is 48 kHz, 1 is 44.1 kHz; changing it interrupts the audio." }
    send:
      address: "/-prefs/clockrate"
      args: [ { value: "{rate}", type: int } ]
    returns: none

  set_clock_source:
    summary: "Set the console's clock source: 0 INT, 1 AES50A, 2 AES50B, 3 expansion card"
    params:
      source: { type: int, min: 0, max: 3, required: true, label: "Clock source", description: "0 internal, 1 AES50 A, 2 AES50 B, 3 expansion card." }
    send:
      address: "/-prefs/clocksource"
      args: [ { value: "{source}", type: int } ]
    returns: none

  set_clock_mode:
    summary: "Set the clock display: 0 24 h, 1 12 h"
    params:
      mode: { type: int, min: 0, max: 1, required: true, label: "Clock mode", description: "0 shows 24-hour time, 1 12-hour time." }
    send:
      address: "/-prefs/clockmode"
      args: [ { value: "{mode}", type: int } ]
    returns: none

  set_mute_led_mode:
    summary: "Set the mute LEDs: 0 NORM, 1 INV (inverted)"
    params:
      mode: { type: int, min: 0, max: 1, required: true, label: "Mute LEDs", description: "0 lights the LED when muted, 1 inverts it." }
    send:
      address: "/-prefs/invertmutes"
      args: [ { value: "{mode}", type: int } ]
    returns: none

  set_recorder_type:
    summary: "Set the recorder shown in the status line: 0 USB, 1 X-Live!"
    params:
      type: { type: int, min: 0, max: 1, required: true, label: "Recorder", description: "0 the USB recorder, 1 the X-Live! card." }
    send:
      address: "/-prefs/rec_control"
      args: [ { value: "{type}", type: int } ]
    returns: none

  set_headamp_flags:
    summary: "Set the headamp flags (bitmap: bit 0 lock stagebox, 1 X32 gain split, 2 AES50 A gain split, 3 AES50 B gain split)"
    params:
      flags: { type: int, min: 0, max: 15, required: true, label: "Flags", description: "Bitmap: bit 0 lock stagebox, bit 1 X32 headamp gain split, bit 2 AES50 A gain split, bit 3 AES50 B gain split." }
    send:
      address: "/-prefs/haflags"
      args: [ { value: "{flags}", type: int } ]
    returns: none

  set_screen_brightness:
    summary: "Set the main lcd brightness (0-1 over its range)"
    params:
      value: { type: float, min: 0.0, max: 1.0, required: true, label: "Brightness", description: "As a fraction 0-1 over 10 to 100." }
    send:
      address: "/-prefs/bright"
      args: [ { value: "{value}", type: float } ]
    returns: none

  set_lcd_contrast:
    summary: "Set the channel lcd contrast (0-1 over its range)"
    params:
      value: { type: float, min: 0.0, max: 1.0, required: true, label: "Contrast", description: "As a fraction 0-1 over 0 to 100." }
    send:
      address: "/-prefs/lcdcont"
      args: [ { value: "{value}", type: float } ]
    returns: none

  set_led_brightness:
    summary: "Set the led brightness (0-1 over its range)"
    params:
      value: { type: float, min: 0.0, max: 1.0, required: true, label: "Brightness", description: "As a fraction 0-1 over 10 to 100." }
    send:
      address: "/-prefs/ledbright"
      args: [ { value: "{value}", type: float } ]
    returns: none

  set_lamp_level:
    summary: "Set the desk lamp dim level (0-1 over its range)"
    params:
      value: { type: float, min: 0.0, max: 1.0, required: true, label: "Lamp level", description: "As a fraction 0-1 over 10 to 100." }
    send:
      address: "/-prefs/lamp"
      args: [ { value: "{value}", type: float } ]
    returns: none

  set_remote_enable:
    summary: "Switch the console's DAW remote mode on or off"
    params:
      enabled: { type: bool, default: true, label: "Remote on", description: "On enables the DAW remote (Mackie/HUI/CC), off disables it." }
    send:
      address: "/-prefs/remote/enable"
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  set_remote_protocol:
    summary: "Set the DAW remote protocol: 0 Mackie MC, 1 HUI, 2 generic CC"
    params:
      protocol: { type: int, min: 0, max: 2, required: true, label: "Protocol", description: "0 Mackie Control, 1 Mackie HUI, 2 generic CC." }
    send:
      address: "/-prefs/remote/protocol"
      args: [ { value: "{protocol}", type: int } ]
    returns: none

  set_remote_port:
    summary: "Set the DAW remote MIDI port: 0 MIDI in/out, 1 card MIDI, 2 RTP MIDI"
    params:
      port: { type: int, min: 0, max: 2, required: true, label: "Port", description: "0 the MIDI in/out sockets, 1 card MIDI, 2 RTP MIDI." }
    send:
      address: "/-prefs/remote/port"
      args: [ { value: "{port}", type: int } ]
    returns: none

  set_remote_io:
    summary: "Set the console's MIDI remote features (bitmap of 14 bits, p.56)"
    params:
      features: { type: int, min: 0, max: 16383, required: true, label: "Features", description: "Bitmap: bit 0 MIDI in/out, 1 card MIDI, 2 RTP MIDI, 3 rx program change, 4 tx program change, 5 rx fader CC, 6 tx fader CC, 7 rx mute CC, 8 tx mute CC, 9 rx pan CC, 10 tx pan CC, 11 OSC over MIDI SysEx, 12 X-Touch over MIDI, 13 X-Touch over Ethernet." }
    send:
      address: "/-prefs/remote/ioenable"
      args: [ { value: "{features}", type: int } ]
    returns: none

  select_strip:
    summary: "Select a strip on the console, numbered 1-72: 1-32 channels, 33-40 aux, 41-48 FX returns, 49-64 buses, 65-70 matrices, 71 L/R, 72 M/C"
    params:
      strip: { type: int, min: 1, max: 72, required: true, label: "Strip", description: "Strip 1 to 72: 1-32 channels, 33-40 aux inputs, 41-48 FX returns, 49-64 mix buses, 65-70 matrices, 71 main L/R, 72 mono/centre." }
    send:
      address: "/-stat/selidx"
      args: [ { value: "{strip:-1}", type: int } ]
    returns: none

  set_channel_fader_bank:
    summary: "Show a bank on the main fader section: 0 CH 1-16, 1 CH 17-32, 2 aux/USB/FX returns, 3 bus masters"
    params:
      bank: { type: int, min: 0, max: 3, required: true, label: "Bank", description: "0 channels 1-16, 1 channels 17-32, 2 aux in, USB and FX returns, 3 bus masters." }
    send:
      address: "/-stat/chfaderbank"
      args: [ { value: "{bank}", type: int } ]
    returns: none

  set_group_fader_bank:
    summary: "Show a bank on the group fader section: 0 DCA 1-8, 1 bus 1-8, 2 bus 9-16, 3 matrix 1-6 and M/C, 5 channels 1-16 (Compact, Producer)"
    params:
      bank: { type: int, min: 0, max: 5, required: true, label: "Bank", description: "0 DCAs 1-8, 1 buses 1-8, 2 buses 9-16, 3 matrices 1-6 and M/C, 5 channels 1-16 on Compact and Producer." }
    send:
      address: "/-stat/grpfaderbank"
      args: [ { value: "{bank}", type: int } ]
    returns: none

  set_bus_sends_bank:
    summary: "Choose which buses the rotary send encoders control: 0 bus 1-4, 1 5-8, 2 9-12, 3 13-16"
    params:
      bank: { type: int, min: 0, max: 3, required: true, label: "Bank", description: "0 buses 1-4, 1 buses 5-8, 2 buses 9-12, 3 buses 13-16." }
    send:
      address: "/-stat/bussendbank"
      args: [ { value: "{bank}", type: int } ]
    returns: none

  set_screen:
    summary: "Show a screen on the console: 0 HOME, 1 METERS, 2 ROUTING, 3 SETUP, 4 LIBRARY, 5 EFFECTS, 6 MONITOR, 7 USB, 8 SCENES, 9 ASSIGN"
    params:
      screen: { type: int, min: 0, max: 9, required: true, label: "Screen", description: "0 HOME, 1 METERS, 2 ROUTING, 3 SETUP, 4 LIBRARY, 5 EFFECTS, 6 MONITOR, 7 USB RECORDER, 8 SCENES, 9 ASSIGN; LOCK (10) cannot be set." }
    send:
      address: "/-stat/screen/screen"
      args: [ { value: "{screen}", type: int } ]
    returns: none

  set_eq_band_selection:
    summary: "Select the EQ band shown on the console: 0 Low, 1 Low2, 2 Lo-Mid, 3 Hi-Mid, 4 High2, 5 High"
    params:
      band: { type: int, min: 0, max: 5, required: true, label: "Band", description: "0 Low, 1 Low2, 2 Lo-Mid, 3 Hi-Mid, 4 High2, 5 High; Low2 and High2 exist on 6-band EQs only." }
    send:
      address: "/-stat/eqband"
      args: [ { value: "{band}", type: int } ]
    returns: none

  set_sends_on_fader:
    summary: "Switch Sends on Faders on or off"
    params:
      enabled: { type: bool, default: true, label: "Sends on faders", description: "On puts the selected bus's sends on the faders." }
    send:
      address: "/-stat/sendsonfader"
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  set_screen_page:
    summary: "Show a page of one of the console's screens (pages are listed per screen on p.62-64)"
    params:
      screen: { type: enum, values: ["CHAN", "METER", "ROUTE", "SETUP", "LIB", "FX", "MON", "USB", "SCENE", "ASSIGN"], required: true, label: "Screen", description: "Screen whose page to set: CHAN, METER, ROUTE, SETUP, LIB, FX, MON, USB, SCENE, ASSIGN." }
      page: { type: int, min: 0, max: 8, required: true, label: "Page", description: "Page index from 0, as listed for the screen on p.62-64." }
    send:
      address: "/-stat/screen/{screen}/page"
      args: [ { value: "{page}", type: int } ]
    returns: none

  set_usb_recorder_state:
    summary: "Set the USB recorder: 0 stop, 1 pause, 2 play, 3 pause record, 4 record, 5 fast forward, 6 rewind"
    params:
      state: { type: int, min: 0, max: 6, required: true, label: "State", description: "0 stop, 1 pause, 2 play, 3 pause record, 4 record, 5 fast forward, 6 rewind." }
    send:
      address: "/-stat/tape/state"
      args: [ { value: "{state}", type: int } ]
    returns: none

  set_usb_recorder_gain:
    summary: "Set the USB recorder's left or right recording gain (0-1 over -6 to +24 dB)"
    params:
      side: { type: enum, values: ["L", "R"], required: true, label: "Side", description: "Left (L) or right (R) input of the recorder." }
      gain: { type: float, min: 0.0, max: 1.0, required: true, label: "Gain", description: "Gain as a fraction 0 to 1 over -6 to +24 dB in 0.5 dB steps." }
    send:
      address: "/config/tape/gain{side}"
      args: [ { value: "{gain}", type: float } ]
    returns: none

  set_usb_recorder_autoplay:
    summary: "Set the USB recorder's play mode: off plays one file, on plays the folder"
    params:
      enabled: { type: bool, default: true, label: "Autoplay", description: "On plays the whole folder, off a single file." }
    send:
      address: "/config/tape/autoplay"
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  usb_recorder_track:
    summary: "Play the previous (-1) or next (1) track from the USB recorder, or stop (0)"
    params:
      direction: { type: int, min: -1, max: 1, required: true, label: "Direction", description: "-1 the previous track, 1 the next, 0 not playing." }
    send:
      address: "/-action/playtrack"
      args: [ { value: "{direction}", type: int } ]
    returns: none

  usb_recorder_select:
    summary: "Select and play a record in the USB stick's current directory, numbered from 1"
    params:
      record: { type: int, min: 1, max: 999, required: true, label: "Record", description: "Record number in the current directory, from 1." }
    send:
      address: "/-action/recselect"
      args: [ { value: "{record}", type: int } ]
    returns: none

  set_xlive_state:
    summary: "Set the X-Live! card: 0 stop, 1 pause, 2 play, 3 record"
    params:
      state: { type: int, min: 0, max: 3, required: true, label: "State", description: "0 stop, 1 pause, 2 play, 3 record." }
    send:
      address: "/-stat/urec/state"
      args: [ { value: "{state}", type: int } ]
    returns: none

  select_xlive_session:
    summary: "Select an X-Live! SD-card session"
    params:
      index: { type: int, min: 1, max: 100, required: true, label: "Session", description: "Session number 1 to 100." }
    send:
      address: "/-action/selsession"
      args: [ { value: "{index}", type: int } ]
    returns: none

  delete_xlive_session:
    summary: "Delete an X-Live! SD-card session (cannot be undone)"
    params:
      index: { type: int, min: 1, max: 100, required: true, label: "Session", description: "Session number 1 to 100." }
    send:
      address: "/-action/delsession"
      args: [ { value: "{index}", type: int } ]
    returns: none

  select_xlive_marker:
    summary: "Go to an X-Live! marker"
    params:
      index: { type: int, min: 1, max: 100, required: true, label: "Marker", description: "Marker number 1 to 100." }
    send:
      address: "/-action/selmarker"
      args: [ { value: "{index}", type: int } ]
    returns: none

  delete_xlive_marker:
    summary: "Delete an X-Live! marker"
    params:
      index: { type: int, min: 1, max: 100, required: true, label: "Marker", description: "Marker number 1 to 100." }
    send:
      address: "/-action/delmarker"
      args: [ { value: "{index}", type: int } ]
    returns: none

  save_xlive_marker:
    summary: "Save the X-Live! position at a marker"
    params:
      index: { type: int, min: 1, max: 100, required: true, label: "Marker", description: "Marker number 1 to 100." }
    send:
      address: "/-action/savemarker"
      args: [ { value: "{index}", type: int } ]
    returns: none

  add_xlive_marker:
    summary: "Add an X-Live! marker at the current position"
    send:
      address: "/-action/addmarker"
      args: [ { value: "1", type: int } ]
    returns: none

  set_xlive_position:
    summary: "Set the X-Live! card position in milliseconds"
    params:
      position: { type: int, min: 0, max: 86399999, required: true, label: "Position", description: "Position in milliseconds, 0 to 86399999 (24 hours)." }
    send:
      address: "/-action/setposition"
      args: [ { value: "{position}", type: int } ]
    returns: none

  clear_xlive_alert:
    summary: "Clear the X-Live! alert"
    send:
      address: "/-action/clearalert"
      args: [ { value: "1", type: int } ]
    returns: none

  save_console_state:
    summary: "Save the console's state now (as before switching it off)"
    send:
      address: "/-action/savestate"
      args: [ { value: "1", type: int } ]
    returns: none

telemetry:
  # /xremote asks the console to send every parameter change to this client
  # for 10 seconds (p.9); it is renewed every 9.
  subscribe:
    send: ["/xremote"]
    every_ms: 9000
  # The current values, asked once on connecting, one at a time: /xremote
  # only reports changes. The list is explicit because the format has no loops:
  # mute, fader and name of every strip first, then mute groups, solo,
  # talkback, the Scenes-page position and the 32 local headamps, then every
  # other strip, routing, configuration, show, library and status parameter
  # kept as state (9511 queries in all).
