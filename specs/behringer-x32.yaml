spec: 1
id: behringer-x32
name: Behringer X32 / Midas M32
vendor: Behringer
category: mixer

source:
  - title: Unofficial X32/M32 OSC Remote Protocol
    author: Patrick-Gilles Maillot
    note: >
      Community-documented, not a manufacturer specification. Treat every
      address as unverified until a vector is recorded from real hardware.

transport:
  type: osc-udp
  port: 10023
  timeout_ms: 500
  reply: to-source
  probe: /info

models:
  - id: x32
    name: Behringer X32
    channels: 32
    dcas: 8
    supports: [set_channel_fader, mute_channel, set_dca_fader, mute_dca, set_main_fader, mute_main, get_channel_name, set_channel_name]
    verification: none
  - id: x32-compact
    name: Behringer X32 Compact
    channels: 32
    dcas: 8
    supports: [set_channel_fader, mute_channel, set_dca_fader, mute_dca, set_main_fader, mute_main, get_channel_name, set_channel_name]
    verification: none
  - id: x32-rack
    name: Behringer X32 Rack
    channels: 32
    dcas: 8
    supports: [set_channel_fader, mute_channel, set_dca_fader, mute_dca, set_main_fader, mute_main, get_channel_name, set_channel_name]
    verification: none
  - id: m32
    name: Midas M32
    channels: 32
    dcas: 8
    supports: [set_channel_fader, mute_channel, set_dca_fader, mute_dca, set_main_fader, mute_main, get_channel_name, set_channel_name]
    verification: none

commands:
  set_channel_fader:
    summary: Set an input channel fader position
    params:
      channel: { type: int, min: 1, max: 32, required: true }
      level:   { type: float, min: 0.0, max: 1.0, required: true }
    send:
      address: /ch/{channel:02d}/mix/fader
      args: [ { value: "{level}", type: float } ]
    returns: none

  mute_channel:
    summary: Mute or unmute an input channel
    params:
      channel: { type: int, min: 1, max: 32, required: true }
      muted:   { type: bool, default: true }
    send:
      address: /ch/{channel:02d}/mix/on
      args: [ { value: "{muted:bool10}", type: int } ]
    returns: none

  set_dca_fader:
    summary: Set a DCA fader position
    params:
      dca:   { type: int, min: 1, max: 8, required: true }
      level: { type: float, min: 0.0, max: 1.0, required: true }
    send:
      address: /dca/{dca}/fader
      args: [ { value: "{level}", type: float } ]
    returns: none

  mute_dca:
    summary: Mute or unmute a DCA
    params:
      dca:   { type: int, min: 1, max: 8, required: true }
      muted: { type: bool, default: true }
    send:
      address: /dca/{dca}/on
      args: [ { value: "{muted:bool10}", type: int } ]
    returns: none

  set_main_fader:
    summary: Set the main stereo fader position
    params:
      level: { type: float, min: 0.0, max: 1.0, required: true }
    send:
      address: /main/st/mix/fader
      args: [ { value: "{level}", type: float } ]
    returns: none

  mute_main:
    summary: Mute or unmute the main stereo bus
    params:
      muted: { type: bool, default: true }
    send:
      address: /main/st/mix/on
      args: [ { value: "{muted:bool10}", type: int } ]
    returns: none

  get_channel_name:
    summary: Read an input channel's scribble-strip name
    params:
      channel: { type: int, min: 1, max: 32, required: true }
    send: { address: "/ch/{channel:02d}/config/name" }
    expect: { address: "/ch/{channel:02d}/config/name", arg: 0 }
    returns: value

  set_channel_name:
    summary: Set an input channel's scribble-strip name
    params:
      channel: { type: int, min: 1, max: 32, required: true }
      name:    { type: string, max_length: 12, required: true }
    send:
      address: /ch/{channel:02d}/config/name
      args: [ { value: "{name}", type: string } ]
    returns: none

telemetry:
  # /xremote asks the console to send every parameter change to this client
  # for 10 seconds; it is renewed every 9.
  subscribe:
    send: ["/xremote"]
    every_ms: 9000
  # The current values, asked once on connecting, one at a time: /xremote
  # only reports changes. The list is explicit because the format has no loops.
  poll:
    send:
      - "/ch/01/mix/on"
      - "/ch/01/mix/fader"
      - "/ch/01/config/name"
      - "/ch/02/mix/on"
      - "/ch/02/mix/fader"
      - "/ch/02/config/name"
      - "/ch/03/mix/on"
      - "/ch/03/mix/fader"
      - "/ch/03/config/name"
      - "/ch/04/mix/on"
      - "/ch/04/mix/fader"
      - "/ch/04/config/name"
      - "/ch/05/mix/on"
      - "/ch/05/mix/fader"
      - "/ch/05/config/name"
      - "/ch/06/mix/on"
      - "/ch/06/mix/fader"
      - "/ch/06/config/name"
      - "/ch/07/mix/on"
      - "/ch/07/mix/fader"
      - "/ch/07/config/name"
      - "/ch/08/mix/on"
      - "/ch/08/mix/fader"
      - "/ch/08/config/name"
      - "/ch/09/mix/on"
      - "/ch/09/mix/fader"
      - "/ch/09/config/name"
      - "/ch/10/mix/on"
      - "/ch/10/mix/fader"
      - "/ch/10/config/name"
      - "/ch/11/mix/on"
      - "/ch/11/mix/fader"
      - "/ch/11/config/name"
      - "/ch/12/mix/on"
      - "/ch/12/mix/fader"
      - "/ch/12/config/name"
      - "/ch/13/mix/on"
      - "/ch/13/mix/fader"
      - "/ch/13/config/name"
      - "/ch/14/mix/on"
      - "/ch/14/mix/fader"
      - "/ch/14/config/name"
      - "/ch/15/mix/on"
      - "/ch/15/mix/fader"
      - "/ch/15/config/name"
      - "/ch/16/mix/on"
      - "/ch/16/mix/fader"
      - "/ch/16/config/name"
      - "/ch/17/mix/on"
      - "/ch/17/mix/fader"
      - "/ch/17/config/name"
      - "/ch/18/mix/on"
      - "/ch/18/mix/fader"
      - "/ch/18/config/name"
      - "/ch/19/mix/on"
      - "/ch/19/mix/fader"
      - "/ch/19/config/name"
      - "/ch/20/mix/on"
      - "/ch/20/mix/fader"
      - "/ch/20/config/name"
      - "/ch/21/mix/on"
      - "/ch/21/mix/fader"
      - "/ch/21/config/name"
      - "/ch/22/mix/on"
      - "/ch/22/mix/fader"
      - "/ch/22/config/name"
      - "/ch/23/mix/on"
      - "/ch/23/mix/fader"
      - "/ch/23/config/name"
      - "/ch/24/mix/on"
      - "/ch/24/mix/fader"
      - "/ch/24/config/name"
      - "/ch/25/mix/on"
      - "/ch/25/mix/fader"
      - "/ch/25/config/name"
      - "/ch/26/mix/on"
      - "/ch/26/mix/fader"
      - "/ch/26/config/name"
      - "/ch/27/mix/on"
      - "/ch/27/mix/fader"
      - "/ch/27/config/name"
      - "/ch/28/mix/on"
      - "/ch/28/mix/fader"
      - "/ch/28/config/name"
      - "/ch/29/mix/on"
      - "/ch/29/mix/fader"
      - "/ch/29/config/name"
      - "/ch/30/mix/on"
      - "/ch/30/mix/fader"
      - "/ch/30/config/name"
      - "/ch/31/mix/on"
      - "/ch/31/mix/fader"
      - "/ch/31/config/name"
      - "/ch/32/mix/on"
      - "/ch/32/mix/fader"
      - "/ch/32/config/name"
      - "/dca/1/on"
      - "/dca/1/fader"
      - "/dca/2/on"
      - "/dca/2/fader"
      - "/dca/3/on"
      - "/dca/3/fader"
      - "/dca/4/on"
      - "/dca/4/fader"
      - "/dca/5/on"
      - "/dca/5/fader"
      - "/dca/6/on"
      - "/dca/6/fader"
      - "/dca/7/on"
      - "/dca/7/fader"
      - "/dca/8/on"
      - "/dca/8/fader"
      - "/main/st/mix/on"
      - "/main/st/mix/fader"
  updates:
    - address: "^/ch/(\\d\\d)/mix/on$"
      state: { "channels.{1}.mute": { value: "{arg0}", map: { "0": true, "1": false } } }
    - address: "^/ch/(\\d\\d)/mix/fader$"
      state: { "channels.{1}.fader": "{arg0}" }
    - address: "^/ch/(\\d\\d)/config/name$"
      state: { "channels.{1}.name": "{arg0}" }
    - address: "^/dca/(\\d)/on$"
      state: { "dcas.{1}.mute": { value: "{arg0}", map: { "0": true, "1": false } } }
    - address: "^/dca/(\\d)/fader$"
      state: { "dcas.{1}.fader": "{arg0}" }
    - address: "^/main/st/mix/on$"
      state: { "main.mute": { value: "{arg0}", map: { "0": true, "1": false } } }
    - address: "^/main/st/mix/fader$"
      state: { "main.fader": "{arg0}" }

state:
  channels.*.mute:  { type: bool, description: "Channel muted (mix/on inverted), keyed by channel number" }
  channels.*.fader: { type: float, description: "Channel fader position 0-1, not dB" }
  channels.*.name:  { type: string, description: "Channel scribble-strip name" }
  dcas.*.mute:      { type: bool, description: "DCA muted" }
  dcas.*.fader:     { type: float, description: "DCA fader position 0-1" }
  main.mute:        { type: bool, description: "Main stereo bus muted" }
  main.fader:       { type: float, description: "Main stereo fader position 0-1" }

quirks:
  - models: [all]
    severity: critical
    text: >
      mix/on is inverted: 0 is muted, 1 is passing audio. The address name and
      the mute sense are opposite. Handled here by the bool10 directive.

  - models: [all]
    severity: info
    text: >
      The console replies to the requesting socket, so /info serves as the
      liveness probe. No separate keepalive channel is required.

  - models: [all]
    severity: warning
    text: >
      Scene and snippet recall are omitted. The addresses are
      community-documented but unverified, and an incorrect scene recall on a
      live console is not recoverable in time. Add only with a recorded vector.

  - models: [all]
    severity: info
    text: >
      Fader values are 0.0-1.0 fader position, not dB. The position-to-dB curve
      is non-linear, so the raw value cannot be displayed as a dB figure.

  - models: [all]
    severity: info
    text: >
      Sending an address with no arguments is a query: the console answers on
      the same address with the current value. Channel names are limited to 12
      characters.
