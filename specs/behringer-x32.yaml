      level_db: { type: float, min: -90.0, max: 10.0, required: true, label: Send level, description: "Send level to the matrix in dB, -90 (-inf) to +10." }
    send:
      address: "/main/st/mix/{matrix:02d}/level"
      args: [ { value: "{level_db:to.x32_fader}", type: float } ]
    returns: none

  set_mono_fader_db:
    summary: "Set the main mono/centre (M/C) bus's fader level in dB, -90 (-oo) to +10; sent as the fader position by the x32_fader conversion"
    params:
      level_db: { type: float, min: -90.0, max: 10.0, required: true, label: Level, description: "Fader level in dB, -90 (-inf) to +10." }
    send:
      address: "/main/m/mix/fader"
      args: [ { value: "{level_db:to.x32_fader}", type: float } ]
    returns: none

  get_mono_fader_db:
    summary: "Read the main mono/centre (M/C) bus's fader level in dB (-90 is -oo), converted from the fader position by the x32_fader conversion"
    send: { address: "/main/m/mix/fader" }
    expect: { address: "/main/m/mix/fader", arg: 0, convert: x32_fader }
    returns: value

  set_mono_matrix_send_level_db:
    summary: "Set the main mono/centre (M/C) bus's send level to a matrix in dB, -90 (-oo) to +10; sent as the fader position by the x32_fader conversion"
    params:
      matrix: { type: int, min: 1, max: 6, required: true, label: Matrix, description: "Matrix 1-6 the send goes to, numbered as on the console." }
      level_db: { type: float, min: -90.0, max: 10.0, required: true, label: Send level, description: "Send level to the matrix in dB, -90 (-inf) to +10." }
    send:
      address: "/main/m/mix/{matrix:02d}/level"
      args: [ { value: "{level_db:to.x32_fader}", type: float } ]
    returns: none

  set_dca_fader_db:
    summary: "Set a DCA fader level in dB, -90 (-oo) to +10; sent as the fader position by the x32_fader conversion"
    params:
      dca: { type: int, min: 1, max: 8, required: true, label: DCA, description: "DCA 1-8, numbered as on the console." }
      level_db: { type: float, min: -90.0, max: 10.0, required: true, label: Level, description: "Fader level in dB, -90 (-inf) to +10." }
    send:
      address: "/dca/{dca}/fader"
      args: [ { value: "{level_db:to.x32_fader}", type: float } ]
    returns: none

  get_dca_fader_db:
    summary: "Read a DCA's fader level in dB (-90 is -oo), converted from the fader position by the x32_fader conversion"
    params:
      dca: { type: int, min: 1, max: 8, required: true, label: DCA, description: "DCA 1-8, numbered as on the console." }
    send: { address: "/dca/{dca}/fader" }
    expect: { address: "/dca/{dca}/fader", arg: 0, convert: x32_fader }
    returns: value

