spec: 1
id: behringer-x32
name: Behringer X32 / Midas M32
vendor: Behringer
category: mixer

source:
  - title: "Unofficial X32/M32 OSC Remote Protocol, version 4.02-01 (Jan 12, 2020), for console FW 4.0 and later"
    author: Patrick-Gilles Maillot
    url: https://tostibroeders.nl/wp-content/uploads/2020/02/X32-OSC.pdf
    note: >
      Community document, not a manufacturer specification: Behringer / Music
      Tribe publish no OSC reference for the X32 or M32, and the document says
      Behringer is not associated with it (p.1 of the front matter). It is the
      de facto reference, built on Behringer's own 1.01 OSC notes of Oct 2012.
      Later revisions exist (4.06, 2022); this spec follows 4.02-01, the newest
      copy obtained. Page numbers are the document's printed page numbers.
      UDP 10023, replies to the sender's port (p.6); /info, /xinfo, /status
      (p.8-11); type rules, 0-1 floats and enums as ints (p.10-14); /xremote,
      10 s lifetime, at most four clients (p.9); /config (p.20-24); /ch
      (p.25-27); /auxin (p.28-29); /fxrtn (p.30); /bus (p.31-32); /mtx (p.33);
      /main/st (p.34-35); /main/m (p.36-37); /dca (p.38); /fx (p.39); /headamp
      (p.42); /load and the show data (p.43-52); /-stat (p.60-66); /-action
      (p.67-69); user controls (p.116-119); fader position to dB (p.128).

# Send pan, tap and pan follow live on the odd send of each pair (p.27,
# p.32): only odd numbers are listed, so an even one is refused.
maps:
  x32_odd_bus: { "1": "01", "3": "03", "5": "05", "7": "07", "9": "09", "11": "11", "13": "13", "15": "15" }
  x32_odd_matrix: { "1": "01", "3": "03", "5": "05" }

# Fader and send levels: Maillot's four linear segments (p.128), 0.0-0.0625
# for -oo/-90 to -60 dB, to 0.25 for -30, to 0.5 for -10 and to 1.0 for +10;
# 0.75 is 0 dB. Each point is [wire position, dB].
conversions:
  x32_fader:
    points: [[0.0, -90.0], [0.0625, -60.0], [0.25, -30.0], [0.5, -10.0], [1.0, 10.0]]

transport:
  type: osc-udp
  port: 10023
  timeout_ms: 500
  reply: to-source
  probe: /info

ports:
  - { port: 10023, protocol: udp, role: control }

