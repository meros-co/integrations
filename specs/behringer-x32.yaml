        label: Address,
        description: "The parameter's OSC address without its leading /, such as ch/01/mix/fader." }
    send: { address: "/{path}" }
    expect: { address: "/{path}", arg: 0 }
    returns: value

  get_node:
    summary: "Read every value of an X32node as one line of text, such as \"/headamp/124 +0.0 OFF\" (/node, Maillot p.8, p.78-85)"
