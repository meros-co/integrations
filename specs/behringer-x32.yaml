    summary: Assign a user button (5-12 on X32/M32 Standard; Compact and Producer buttons 1-8 are 5-12 here) with the document's up-to-7-character code
    params:
      set:        { type: enum, values: [A, B, C], required: true, label: User set, description: "User-control set A, B or C." }
      button:     { type: int, min: 5, max: 12, required: true, label: Button, description: "User button 5-12 as on the X32/M32 Standard; Compact and Producer buttons 1-8 are 5-12 here." }
      assignment: { type: string, max_length: 7, required: true, label: Assignment, description: "The assignment code from the X32 OSC document, up to 7 characters." }
    send:
      address: /config/userctrl/{set}/btn/{button}
      args: [ { value: "{assignment}", type: string } ]
    returns: none

  set_user_encoder:
    summary: Assign a user encoder (1-4) with the document's up-to-7-character code
    params:
      set:        { type: enum, values: [A, B, C], required: true, label: User set, description: "User-control set A, B or C." }
      encoder:    { type: int, min: 1, max: 4, required: true, label: Encoder, description: "User encoder 1-4." }
      assignment: { type: string, max_length: 7, required: true, label: Assignment, description: "The assignment code from the X32 OSC document, up to 7 characters." }
    send:
      address: /config/userctrl/{set}/enc/{encoder}
      args: [ { value: "{assignment}", type: string } ]
    returns: none

  set_user_set_color:
    summary: Set a user-control set's colour (0 OFF, 1 RD, 2 GN, 3 YE, 4 BL, 5 MG, 6 CY, 7 WH, 8-15 the same inverted (OFFi...WHi))
    params:
      set:   { type: enum, values: [A, B, C], required: true, label: User set, description: "User-control set A, B or C." }
      color: { type: int, min: 0, max: 15, required: true, label: Colour, description: "Colour of the set: 0 off, 1 red, 2 green, 3 yellow, 4 blue, 5 magenta, 6 cyan, 7 white; 8-15 the same inverted." }
    send:
      address: /config/userctrl/{set}/color
      args: [ { value: "{color}", type: int } ]
    returns: none

  select_user_set:
    summary: Show user-control set A (0), B (1) or C (2) on the console
    params:
      set: { type: int, min: 0, max: 2, required: true, label: User set, description: "0 shows set A, 1 set B, 2 set C on the console." }
    send:
      address: /-stat/userbank
      args: [ { value: "{set}", type: int } ]
    returns: none

  set_user_control_value:
    summary: "Set a MIDI-assigned user control's value: ids 1-24 buttons A5...C12 (0 or 127), 25-36 encoders A1...C4 (0-127)"
    params:
      control: { type: int, min: 1, max: 36, required: true, label: User control, description: "MIDI-assigned user control: 1-24 the buttons A5 to C12, 25-36 the encoders A1 to C4." }
      value:   { type: int, min: 0, max: 127, required: true, label: Value, description: "MIDI value 0-127; buttons take 0 or 127." }
    send:
      address: /-stat/userpar/{control:02d}/value
      args: [ { value: "{value}", type: int } ]
    returns: none

  get_console_model:
    summary: "Read the console model from /info: X32, X32RACK, X32C, X32P, X32CORE, M32, M32C or M32R"
    send: { address: "/info" }
    expect: { address: "/info", arg: 2 }
    returns: value

  get_firmware_version:
    summary: Read the console firmware version from /info
    send: { address: "/info" }
    expect: { address: "/info", arg: 3 }
    returns: value

  # ── Levels in dB ─────────────────────────────────────────────────────────
  # The same addresses as the 0-1 commands above, taking and returning dB
