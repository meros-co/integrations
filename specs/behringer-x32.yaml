      args: [ { value: "{soloed:bool01}", type: int } ]
    returns: none

  solo_dca:
    summary: Switch a DCA's solo on or off
    params:
      dca:    { type: int, min: 1, max: 8, required: true, label: DCA, description: "DCA 1-8, numbered as on the console." }
      soloed: { type: bool, default: true, label: Solo, description: "On solos it, off cancels the solo." }
