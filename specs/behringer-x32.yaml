      index: { type: int, min: 0, max: 99, required: true, label: "Scene position", description: "Scene position 0 to 99 in the console's list." }
      name: { type: string, max_length: 32, required: true, label: "Name", description: "Name, up to 32 characters." }
      note: { type: string, max_length: 32, default: "", label: "Note", description: "Scene note, up to 32 characters." }
    send:
      address: "/save"
      args: [ { value: "scene", type: string }, { value: "{index}", type: int }, { value: "{name}", type: string }, { value: "{note}", type: string } ]
    expect: { address: "/save", arg: 1 }
    returns: value

  save_snippet:
    summary: "Save a snippet at a position, with a name, from its parameter filters; the console answers 1 when it succeeds and 0 when it fails"
    params:
      index: { type: int, min: 0, max: 99, required: true, label: "Snippet position", description: "Snippet position 0 to 99 in the console's list." }
