telemetry:
  # /xremote asks the console to send every parameter change to this client
  # for 10 seconds (p.9); it is renewed every 9.
  subscribe:
    send: ["/xremote"]
    every_ms: 9000
  # The current values, asked once on connecting, one at a time: /xremote
  # only reports changes. The list is explicit because the format has no loops:
  # mute, fader and name of every strip, mute groups, solo, talkback, the
  # Scenes-page position and the 32 local headamps.
  poll:
    send:
      - "/ch/01/mix/on"
      - "/ch/01/mix/fader"
      - "/ch/01/config/name"
