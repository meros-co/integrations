    summary: "Set the test oscillator level (0-1, the fader law; 0.75 = 0 dB)"
    params:
      level: { type: float, min: 0.0, max: 1.0, required: true, label: "Level", description: "Oscillator level as a fader position 0 (-oo) to 1 (+10 dB), 0.75 being 0 dB (161 steps)." }
    send:
