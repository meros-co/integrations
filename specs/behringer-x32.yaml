    # Every parameter the console reports by /xremote or in reply to a
    # query, by its address, as the one argument of its own type. Replies
    # with several arguments (/info, /status), node text and meters (blobs)
    # are not kept.
    - address: "^/([A-Za-z0-9_-][A-Za-z0-9_/-]*)$"
      arg_types: f
      state: { "params.{1}.float": "{arg0}" }
    - address: "^/([A-Za-z0-9_-][A-Za-z0-9_/-]*)$"
      arg_types: i
      state: { "params.{1}.int": "{arg0}" }
    - address: "^/([A-Za-z0-9_-][A-Za-z0-9_/-]*)$"
      arg_types: s
      state: { "params.{1}.string": "{arg0}" }

