    summary: "Set what the DP48 broadcast carries (bitmap: bit 0 group name, 1 group assign, 2 channel level, 3 channel pan)"
    params:
      scope: { type: int, min: 0, max: 15, required: true, label: "Scope", description: "Bitmap: bit 0 group names, bit 1 group assignments, bit 2 channel levels, bit 3 channel pans (bits 2 and 3 imply bit 1)." }
    send:
      address: "/config/dp48/scope"
      args: [ { value: "{scope}", type: int } ]
    returns: none

