commands:
  set_channel_fader:
    summary: Set an input channel fader position
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      level:   { type: float, min: 0.0, max: 1.0, required: true, label: Level, description: "Fader level as a fader position, 0 (-inf) to 1 (+10 dB), 0.75 being 0 dB." }
    send:
      address: /ch/{channel:02d}/mix/fader
      args: [ { value: "{level}", type: float } ]
    returns: none

  mute_channel:
    summary: Mute or unmute an input channel
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      muted:   { type: bool, default: true, label: Mute, description: "On mutes it, off unmutes it." }
    send:
      address: /ch/{channel:02d}/mix/on
      args: [ { value: "{muted:bool10}", type: int } ]
    returns: none

  get_channel_fader:
    summary: Read an input channel's fader position (0-1)
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
    send: { address: "/ch/{channel:02d}/mix/fader" }
    expect: { address: "/ch/{channel:02d}/mix/fader", arg: 0 }
    returns: value

  get_channel_on:
    summary: "Read an input channel's mix/on flag: 1 passes audio, 0 is muted"
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
    send: { address: "/ch/{channel:02d}/mix/on" }
    expect: { address: "/ch/{channel:02d}/mix/on", arg: 0 }
    returns: value

  get_channel_name:
    summary: Read an input channel's scribble-strip name
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
    send: { address: "/ch/{channel:02d}/config/name" }
    expect: { address: "/ch/{channel:02d}/config/name", arg: 0 }
    returns: value

  set_channel_name:
    summary: Set an input channel's scribble-strip name
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      name:    { type: string, max_length: 12, required: true, label: Name, description: "Scribble-strip name as shown on the console, up to 12 characters." }
    send:
      address: /ch/{channel:02d}/config/name
      args: [ { value: "{name}", type: string } ]
    returns: none

  set_channel_color:
    summary: Set an input channel's scribble-strip colour (0 OFF, 1 RD, 2 GN, 3 YE, 4 BL, 5 MG, 6 CY, 7 WH, 8-15 the same inverted (OFFi...WHi))
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      color:   { type: int, min: 0, max: 15, required: true, label: Colour, description: "Scribble-strip colour: 0 off, 1 red, 2 green, 3 yellow, 4 blue, 5 magenta, 6 cyan, 7 white; 8-15 the same inverted." }
    send:
      address: /ch/{channel:02d}/config/color
      args: [ { value: "{color}", type: int } ]
    returns: none

  set_channel_icon:
    summary: Set an input channel's scribble-strip icon (1-74, the console's icon list)
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      icon:    { type: int, min: 1, max: 74, required: true, label: Icon, description: "Scribble-strip icon number, 1-74, from the console's icon list." }
    send:
      address: /ch/{channel:02d}/config/icon
      args: [ { value: "{icon}", type: int } ]
    returns: none

  set_channel_pan:
    summary: "Set an input channel's pan (0-1: 0 full left, 0.5 centre, 1 full right)"
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      pan:     { type: float, min: 0.0, max: 1.0, required: true, label: Pan, description: "0 is full left, 0.5 centre, 1 full right." }
    send:
      address: /ch/{channel:02d}/mix/pan
      args: [ { value: "{pan}", type: float } ]
    returns: none

  set_channel_send_level:
    summary: Set an input channel's send level to a mix bus (0-1, 0.75 = 0 dB)
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      bus:     { type: int, min: 1, max: 16, required: true, label: Mix bus, description: "Mix bus 1-16 the send goes to, numbered as on the console." }
      level:   { type: float, min: 0.0, max: 1.0, required: true, label: Send level, description: "Send level to the mix bus as a fader position, 0 (-inf) to 1 (+10 dB), 0.75 being 0 dB." }
    send:
      address: /ch/{channel:02d}/mix/{bus:02d}/level
      args: [ { value: "{level}", type: float } ]
    returns: none

  set_channel_send_on:
    summary: Switch an input channel's send to a mix bus on or off
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      bus:     { type: int, min: 1, max: 16, required: true, label: Mix bus, description: "Mix bus 1-16 the send goes to, numbered as on the console." }
      enabled: { type: bool, default: true, label: Send on, description: "On switches the send on, off switches it off." }
    send:
      address: /ch/{channel:02d}/mix/{bus:02d}/on
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  get_channel_send_level:
    summary: Read an input channel's send level to a mix bus (0-1)
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      bus:     { type: int, min: 1, max: 16, required: true, label: Mix bus, description: "Mix bus 1-16 the send goes to, numbered as on the console." }
    send: { address: "/ch/{channel:02d}/mix/{bus:02d}/level" }
    expect: { address: "/ch/{channel:02d}/mix/{bus:02d}/level", arg: 0 }
    returns: value

  assign_channel_to_main:
    summary: Assign an input channel to the main stereo bus, or remove it (mix/st)
    params:
      channel:  { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      assigned: { type: bool, default: true, label: Assigned, description: "On assigns it to the main stereo bus, off removes it." }
    send:
      address: /ch/{channel:02d}/mix/st
      args: [ { value: "{assigned:bool01}", type: int } ]
    returns: none

  assign_channel_to_mono:
    summary: Assign an input channel to the mono/centre bus, or remove it (mix/mono)
    params:
      channel:  { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      assigned: { type: bool, default: true, label: Assigned, description: "On assigns it to the mono/centre bus, off removes it." }
    send:
      address: /ch/{channel:02d}/mix/mono
      args: [ { value: "{assigned:bool01}", type: int } ]
    returns: none

  set_channel_mono_level:
    summary: Set an input channel's level to the mono/centre bus (0-1, 0.75 = 0 dB)
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      level:   { type: float, min: 0.0, max: 1.0, required: true, label: Mono level, description: "Level to the mono/centre bus as a fader position, 0 (-inf) to 1 (+10 dB), 0.75 being 0 dB." }
    send:
      address: /ch/{channel:02d}/mix/mlevel
      args: [ { value: "{level}", type: float } ]
    returns: none

  set_channel_dca_groups:
    summary: "Set which DCA groups an input channel belongs to (bitmap: bit 0 DCA 1 ... bit 7 DCA 8)"
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      groups:  { type: int, min: 0, max: 255, required: true, label: DCA groups, description: "Bitmap of DCA membership: bit 0 is DCA 1 up to bit 7 for DCA 8, so 5 is DCAs 1 and 3." }
    send:
      address: /ch/{channel:02d}/grp/dca
      args: [ { value: "{groups}", type: int } ]
    returns: none

  set_channel_mute_groups:
    summary: "Set which mute groups an input channel belongs to (bitmap: bit 0 group 1 ... bit 5 group 6)"
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      groups:  { type: int, min: 0, max: 63, required: true, label: Mute groups, description: "Bitmap of mute group membership: bit 0 is group 1 up to bit 5 for group 6, so 5 is groups 1 and 3." }
    send:
      address: /ch/{channel:02d}/grp/mute
      args: [ { value: "{groups}", type: int } ]
    returns: none

  set_channel_eq_on:
    summary: Switch an input channel's EQ on or off
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      enabled: { type: bool, default: true, label: EQ, description: "On switches the EQ in, off bypasses it." }
    send:
      address: /ch/{channel:02d}/eq/on
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  set_channel_dyn_on:
    summary: Switch an input channel's dynamics (compressor) on or off
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      enabled: { type: bool, default: true, label: Dynamics, description: "On switches the dynamics (compressor) in, off bypasses it." }
    send:
      address: /ch/{channel:02d}/dyn/on
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  set_channel_gate_on:
    summary: Switch an input channel's gate on or off
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      enabled: { type: bool, default: true, label: Gate, description: "On switches the gate in, off bypasses it." }
    send:
      address: /ch/{channel:02d}/gate/on
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  set_channel_insert_on:
    summary: Switch an input channel's insert on or off
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      enabled: { type: bool, default: true, label: Insert, description: "On switches the insert in, off bypasses it." }
    send:
      address: /ch/{channel:02d}/insert/on
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  set_channel_insert_select:
    summary: "Choose what is inserted on an input channel: 0 OFF, 1-16 FX1L, FX1R ... FX8L, FX8R, 17-22 AUX1-AUX6"
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      insert:  { type: int, min: 0, max: 22, required: true, label: Insert, description: "0 off, 1-16 FX1L, FX1R ... FX8L, FX8R, 17-22 AUX1-AUX6." }
    send:
      address: /ch/{channel:02d}/insert/sel
      args: [ { value: "{insert}", type: int } ]
    returns: none

  set_channel_trim:
    summary: Set an input channel's digital trim (0-1 over -18 to +18 dB in 0.25 dB steps; 0.5 = 0 dB). Applies to digital sources only
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      trim:    { type: float, min: 0.0, max: 1.0, required: true, label: Trim, description: "Digital trim as a fraction, 0 (-18 dB) to 1 (+18 dB) in 0.25 dB steps, 0.5 being 0 dB; digital sources only." }
    send:
      address: /ch/{channel:02d}/preamp/trim
      args: [ { value: "{trim}", type: float } ]
    returns: none

  set_channel_invert:
    summary: Switch an input channel's polarity invert on or off
    params:
      channel:  { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      inverted: { type: bool, default: true, label: Invert, description: "On inverts the polarity, off restores it." }
    send:
      address: /ch/{channel:02d}/preamp/invert
      args: [ { value: "{inverted:bool01}", type: int } ]
    returns: none

  set_channel_source:
    summary: "Set an input channel's input source: 0 OFF, 1-32 In01-32, 33-38 Aux 1-6, 39-40 USB L/R, 41-48 Fx 1L-4R, 49-64 Bus 01-16"
    params:
      channel: { type: int, min: 1, max: 32, required: true, label: Channel, description: "Input channel, numbered from 1 as on the console." }
      source:  { type: int, min: 0, max: 64, required: true, label: Source, description: "0 off, 1-32 In01-32, 33-38 Aux 1-6, 39-40 USB L/R, 41-48 Fx 1L-4R, 49-64 Bus 01-16." }
    send:
