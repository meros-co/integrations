  set_parameter_float:
    summary: "Set any parameter by its OSC address to a float (,f), such as a 0-1 fader position (Maillot p.8)"
    params:
      path: { type: string, max_length: 128, pattern: '^[A-Za-z0-9_-][A-Za-z0-9_/-]*$', required: true,
        label: Address,
        description: "The parameter's OSC address without its leading /, such as ch/01/mix/fader." }
      value: { type: float, required: true,
        label: Value,
        description: "The value as the console takes it, usually 0.0 to 1.0 for a level, frequency or other continuous parameter." }
    send:
      address: "/{path}"
      args: [ { value: "{value}", type: float } ]
    returns: none

