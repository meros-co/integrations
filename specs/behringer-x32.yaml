quirks:
  - models: [all]
    severity: critical
    text: >
      mix/on is inverted: 0 is muted, 1 is passing audio (p.27). The address
      name and the mute sense are opposite. The mute_* commands handle this with
      the bool10 directive; the get_*_on queries return the raw flag (1 = not
      muted). DCA on (p.38) works the same way. Mute groups are not inverted:
      /config/mute/N 1 engages the group (p.21).

  - models: [all]
    severity: critical
    text: >
      Scene, snippet and cue recall act at once on the live mix and cannot be
      taken back in time during a show. A scene overwrites every parameter not
      protected by the Scene, Parameter and Channel Safes set at the console
      (p.43-47): faders, mutes, routing, headamp gain and phantom included
      unless safed. The safes are console settings, not part of the command, so
      the same recall does different things on differently configured
      consoles; scene 0 never has safes (p.43). recall_scene, recall_snippet
      and recall_cue (/-action/goscene, /gosnippet, /gocue, p.68) have no
      documented reply and report unverified. load_scene and load_snippet use
      /load, whose reply carries 1 (loaded) or 0 (failed), but the document
      notes the status can arrive before the load has completed (p.51, note 42).
      recall_cue takes the cue's position in the list, 0-99, not its xxx.x.x
      number. The console keeps one undo step (p.69): create_undo_point before a
      recall makes undo return to it. A recall produces a burst of /xremote
      updates for every changed parameter. Recalling an empty slot is not
      described for OSC; over MIDI it is not possible (p.135).

  - models: [all]
    severity: warning
    text: >
      A set is not answered to the client that sent it: the console echoes a
      change only to other clients holding /xremote (p.10). Sets therefore
      report unverified. Read the value back with the matching get command to
      confirm it. The document says a set takes effect when the address exists
      and the value is in range (p.8).

  - models: [all]
    severity: warning
    text: >
      /xremote sends changes to at most four active clients and lapses after 10
      seconds unless renewed (p.9). A fifth client receives no updates. The
      document warns that UDP replies can be lost silently, for example over a
      slow Wi-Fi link (p.6); a lost poll reply leaves that value unset until it
      next changes.

  - models: [all]
    severity: info
    text: >
      The console replies to the requesting socket (p.6), so /info serves as
      the liveness probe. Its reply ,ssss carries the server version, server
      name, console model and console firmware (p.10-11).

  - models: [all]
    severity: info
    text: >
      Every float on the wire is 0.0-1.0, mapped onto the parameter's own
      range and rounded by the console to its nearest known step (p.13-14).
      Fader and send levels are a position, not dB: four linear segments with
      0.75 = 0 dB and 1.0 = +10 dB, converted by the formula on p.128 (above
      0.5, dB = 40 x position - 30). The 0-1 commands and state carry the
      position; the *_db commands and state carry dB through the x32_fader
      conversion, which is the four segments of p.128 as points. 0.0 reads as
      -90 dB, which the console shows as -oo. The document's optional rounding
      to the console's 1024 fader steps (f = int(f x 1023.5) / 1023) is not
      applied: the console rounds to its nearest step itself (p.13-14), so a
      level read back can differ from the one set by a fraction of a dB. State
      in dB is rounded to 0.1 dB. Pan is -100 to +100 in steps
      of 2 (0.5 = centre), trim -18 to +18 dB, headamp gain -12 to +60 dB in 0.5
      dB steps (p.25, p.42).

  - models: [all]
    severity: info
    text: >
      Sending an address with no arguments is a query: the console answers on
      the same address with the current value (p.8). Names are at most 12
      characters (p.25). Enumerated values are sent as ints (p.12).

  - models: [all]
    severity: info
    text: >
      Headamp numbers here are the document's index plus one: 1-32 are the
      local XLR inputs, 33-80 headamps on AES50 port A, 81-128 on AES50 port B
      (p.42). How many local preamps exist depends on the model's hardware; the
      document gives one index range for the family. Phantom power is
      /headamp/N/phantom.

  - models: [all]
    severity: info
    text: >
      Channel trim (preamp/trim) applies to digital sources only (p.25). An
      input's analog gain is its headamp's gain; /-ha/NN/index reports which
      headamp feeds an input (p.42).

  - models: [all]
    severity: warning
    text: >
      Effect slots 1-4 accept types 0-60 and slots 5-8 only types 0-33 (p.39).
      set_fx_type checks 0-60 for every slot, so a type above 33 sent to slot
      5-8 passes validation and is not applied by the console. Effect parameter
      meaning depends on the type (p.86-115).

  - models: [x32-rack]
    severity: info
    text: >
      The X32 Rack has no ASSIGN section (p.116). User-control assignments can
      still be set and are stored with scenes, but there are no physical
      controls to use them.

  - models: [all]
    severity: info
    text: >
      User-control buttons are numbered 5-12 on the wire. On the X32 Compact
      and Producer, buttons 1-8 map to 5-12 (p.116). Encoder assignments are
      documented for the X32/M32 Standard (p.117). There is no OSC command for
      the ASSIGN section's scribble strips (p.116).

  - models: [all]
    severity: info
    text: >
      get_show_position reads the highlighted line on the Scenes page. Whether
      it is a cue, scene or snippet index depends on the console's Show Control
      preference, /-prefs/show_control (p.44-45, p.55). It is not necessarily
      the scene that was last recalled.

  - models: [all]
    severity: info
    text: >
      Talkback destinations are an 18-bit bitmap (p.21); the document does not
      say which bit is which destination.

  - models: [all]
    severity: info
    text: >
      Any parameter in the document's address tree can be set and read by its
      address (p.8): set_parameter_float, set_parameter_int and
      set_parameter_string send one argument of that type, and the parameter's
      own type must be used (levels and other continuous values are 0-1
      floats, switches and enumerations ints, p.10-14); get_parameter returns
      the value as sent. Every single-argument parameter the console reports,
      by /xremote or in reply to a query, is also kept under params, keyed by
      its address without the leading / (params["ch/01/mix/fader"].float), in
      the field of its OSC type. The format cannot turn the address's / into
      nested keys, so the address is one key. Sets are not echoed.

  - models: [all]
    severity: info
    text: >
      get_node and set_node read and write an X32node as one line of text
      (p.78-85): /node is answered on the address "node", without a leading /,
      which the document notes is not OSC compliant, and a / set is echoed
      back. The console keeps the nearest allowed value to one sent as text
      (a fader of -85.4 dB is kept as -85.3). The node text is not parsed into
      state; a value it changes is pushed by /xremote as usual.

  - models: [all]
    severity: info
    text: >
      EQ band frequency, gain and Q, like every float on the wire, are a
      0-1 position over the parameter's range (p.13-14): frequency
      logarithmic over 20 Hz to 20 kHz in 201 steps, gain linear over
      -15 to +15 dB in 0.25 dB steps (0.5 is 0 dB), Q logarithmic from
      10 down to 0.3 in 72 steps (p.26). Commands and state carry the
      wire value; a logarithmic law has no exact form in the spec
      format's linear conversions. Input channels, aux inputs and FX
      returns have four bands of types 0-5 (LCut, LShv, PEQ, VEQ, HShv,
      HCut); buses six of the same types; matrices and both mains six
      bands that also take the crossover types 6-13 (BU6 to LR24), where
      the document notes bands 2 and 5 can be unavailable (p.33-36).

  - models: [all]
    severity: info
    text: >
      Dynamics and gate times, thresholds and levels are 0-1 wire
      positions over the ranges the document gives (p.25-26): compressor
      threshold -60 to 0 dB, knee 0 to 5, makeup gain 0 to 24 dB, attack
      0 to 120 ms and mix 0 to 100 % linear; hold 0.02 to 2000 ms and
      release 5 to 4000 ms logarithmic; gate threshold -80 to 0 dB and
      range 3 to 60 dB linear. Ratio, mode, detector, envelope,
      position, key source and filter type are enumerations sent as
      their index. Aux inputs and FX returns have no dynamics or gate;
      only input channels have a gate.

  - models: [all]
    severity: info
    text: >
      Send pan, tap point (type) and pan follow exist only on the odd
      send of each pair: mix buses 01, 03 ... 15 for inputs, matrices
      01, 03 and 05 for buses and mains (p.26-37). The commands take the
      odd number and refuse an even one. The document lists FX return
      sends from 03, without 01 (p.30); 01 is accepted here like the
      other inputs. Pan is -100 to +100 in steps of 2 as a 0-1 wire
      value. Pan follow (panFollow) is firmware 4.0 and later. Bus, main
      and mono sends to matrices have no GRP tap.

  - models: [all]
    severity: warning
    text: >
      The document labels preamp/hpon "Sets Phantom power off or on"
      (p.25) while its name and position in the preamp node make it the
      low-cut switch beside hpslope and hpf; phantom power is
      /headamp/N/phantom (p.42). set_channel_low_cut uses it as the
      low-cut switch, as the X AIR family names the same parameter.
      Channel delay is 0.3 to 500 ms linear in 0.1 ms steps; automix
      group and weight only take effect on channels 1 to 8 (p.27).

  - models: [all]
    severity: info
    text: >
      On connecting the core reads every strip parameter it keeps as
      state, one query at a time: several thousand queries, paced by the
      console's replies, with commands going ahead of them. Until a
      value's reply arrives, or the value changes and /xremote pushes
      it, that state is unset.
