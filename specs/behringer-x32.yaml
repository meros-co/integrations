  set_oscillator_frequency:
    summary: "Set the test oscillator's frequency F1 or F2 (0-1 over 20 Hz to 20 kHz, logarithmic)"
    params:
      slot: { type: enum, values: ["f1", "f2"], required: true, label: "Frequency slot", description: "Which of the two oscillator frequencies, f1 or f2." }
      frequency: { type: float, min: 0.0, max: 1.0, required: true, label: "Frequency", description: "Frequency as a fraction 0 to 1 over 20 Hz to 20 kHz, logarithmic (121 steps)." }
    send:
      address: "/config/osc/{slot}"
      args: [ { value: "{frequency}", type: float } ]
    returns: none

  set_oscillator_frequency_select:
    summary: "Select which oscillator frequency is generated: 0 F1, 1 F2"
    params:
      selection: { type: int, min: 0, max: 1, required: true, label: "Frequency", description: "0 generates F1, 1 generates F2." }
    send:
      address: "/config/osc/fsel"
      args: [ { value: "{selection}", type: int } ]
    returns: none

  set_oscillator_type:
    summary: "Set the test oscillator type: 0 SINE, 1 PINK, 2 WHITE"
    params:
      type: { type: int, min: 0, max: 2, required: true, label: "Type", description: "Signal: 0 sine, 1 pink noise, 2 white noise." }
    send:
      address: "/config/osc/type"
      args: [ { value: "{type}", type: int } ]
    returns: none

  set_oscillator_destination:
    summary: "Set the test oscillator destination: 0-15 MixBus 1-16, 16 L, 17 R, 18 L+R, 19 M/C, 20-25 Matrix 1-6"
    params:
      destination: { type: int, min: 0, max: 25, required: true, label: "Destination", description: "Destination: 0 to 15 mix buses 1 to 16, 16 L, 17 R, 18 L+R, 19 M/C, 20 to 25 matrices 1 to 6." }
    send:
      address: "/config/osc/dest"
      args: [ { value: "{destination}", type: int } ]
    returns: none

  set_mono_mode:
    summary: "Set the mono/centre bus mode: 0 LR+M, 1 LCR"
    params:
      mode: { type: int, min: 0, max: 1, required: true, label: "Mode", description: "0 LR+M (mono bus beside the stereo bus), 1 LCR (the mono bus as centre)." }
    send:
      address: "/config/mono/mode"
      args: [ { value: "{mode}", type: int } ]
