    returns: value

  mute_group:
    summary: Engage or release a mute group
    params:
      group: { type: int, min: 1, max: 6, required: true, label: Mute group, description: "Mute group 1-6, numbered as on the console." }
      muted: { type: bool, default: true, label: Engaged, description: "On engages the mute group, off releases it." }
    send:
      address: /config/mute/{group}
      args: [ { value: "{muted:bool01}", type: int } ]
    returns: none

  get_mute_group:
    summary: Read whether a mute group is engaged (1) or released (0)
    params:
      group: { type: int, min: 1, max: 6, required: true, label: Mute group, description: "Mute group 1-6, numbered as on the console." }
    send: { address: "/config/mute/{group}" }
    expect: { address: "/config/mute/{group}", arg: 0 }
    returns: value

  set_headamp_gain:
    summary: Set a headamp's gain (0-1 over -12 to +60 dB in 0.5 dB steps). Headamp 1-32 local XLR inputs, 33-80 AES50 A, 81-128 AES50 B
    params:
      headamp: { type: int, min: 1, max: 128, required: true, label: Headamp, description: "Headamp 1-32 for the local XLR inputs, 33-80 for AES50 A, 81-128 for AES50 B." }
      gain:    { type: float, min: 0.0, max: 1.0, required: true, label: Gain, description: "Headamp gain as a fraction, 0 (-12 dB) to 1 (+60 dB) in 0.5 dB steps." }
    send:
      address: /headamp/{headamp:-1:03d}/gain
      args: [ { value: "{gain}", type: float } ]
    returns: none

  set_headamp_phantom:
    summary: Switch a headamp's +48 V phantom power on or off. Headamp 1-32 local XLR inputs, 33-80 AES50 A, 81-128 AES50 B
    params:
      headamp: { type: int, min: 1, max: 128, required: true, label: Headamp, description: "Headamp 1-32 for the local XLR inputs, 33-80 for AES50 A, 81-128 for AES50 B." }
      enabled: { type: bool, default: true, label: Phantom power, description: "On switches +48 V phantom power on, off switches it off." }
    send:
      address: /headamp/{headamp:-1:03d}/phantom
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  get_headamp_gain:
    summary: Read a headamp's gain (0-1 over -12 to +60 dB)
    params:
      headamp: { type: int, min: 1, max: 128, required: true, label: Headamp, description: "Headamp 1-32 for the local XLR inputs, 33-80 for AES50 A, 81-128 for AES50 B." }
    send: { address: "/headamp/{headamp:-1:03d}/gain" }
    expect: { address: "/headamp/{headamp:-1:03d}/gain", arg: 0 }
    returns: value

  get_headamp_phantom:
    summary: "Read a headamp's phantom power: 1 on, 0 off"
    params:
      headamp: { type: int, min: 1, max: 128, required: true, label: Headamp, description: "Headamp 1-32 for the local XLR inputs, 33-80 for AES50 A, 81-128 for AES50 B." }
    send: { address: "/headamp/{headamp:-1:03d}/phantom" }
    expect: { address: "/headamp/{headamp:-1:03d}/phantom", arg: 0 }
    returns: value

  set_talkback:
    summary: Switch talkback A or B on or off
    params:
      talkback: { type: enum, values: [A, B], required: true, label: Talkback, description: "Talkback A or B." }
      enabled:  { type: bool, default: true, label: Talkback on, description: "On switches the talkback on, off switches it off." }
    send:
      address: /-stat/talk/{talkback}
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  get_talkback:
    summary: Read whether talkback A or B is on (1) or off (0)
    params:
      talkback: { type: enum, values: [A, B], required: true, label: Talkback, description: "Talkback A or B." }
    send: { address: "/-stat/talk/{talkback}" }
    expect: { address: "/-stat/talk/{talkback}", arg: 0 }
    returns: value

  set_talkback_level:
    summary: Set talkback A or B's level (0-1 over -90 to +10 dB)
    params:
      talkback: { type: enum, values: [A, B], required: true, label: Talkback, description: "Talkback A or B." }
      level:    { type: float, min: 0.0, max: 1.0, required: true, label: Level, description: "Talkback level as a fraction, 0 (-90 dB) to 1 (+10 dB)." }
    send:
      address: /config/talk/{talkback}/level
      args: [ { value: "{level}", type: float } ]
    returns: none

  set_talkback_latch:
    summary: Make talkback A or B's button latch (on) or momentary (off)
    params:
      talkback: { type: enum, values: [A, B], required: true, label: Talkback, description: "Talkback A or B." }
      latched:  { type: bool, default: true, label: Latch, description: "On makes the talkback button latch, off makes it momentary." }
    send:
      address: /config/talk/{talkback}/latch
      args: [ { value: "{latched:bool01}", type: int } ]
    returns: none

  set_talkback_destinations:
    summary: Set talkback A or B's destinations (18-bit bitmap, 0-262143)
    params:
      talkback:     { type: enum, values: [A, B], required: true, label: Talkback, description: "Talkback A or B." }
      destinations: { type: int, min: 0, max: 262143, required: true, label: Destinations, description: "Bitmap of the talkback destinations, 18 bits as the console's talkback routing lists them." }
    send:
      address: /config/talk/{talkback}/destmap
      args: [ { value: "{destinations}", type: int } ]
    returns: none

  set_talkback_source:
    summary: "Choose the talkback microphone: 0 internal, 1 external"
    params:
      source: { type: int, min: 0, max: 1, required: true, label: Microphone, description: "0 the internal talkback microphone, 1 an external one." }
    send:
      address: /config/talk/source
      args: [ { value: "{source}", type: int } ]
    returns: none

  set_oscillator:
    summary: Switch the test oscillator on or off
    params:
      enabled: { type: bool, default: true, label: Oscillator, description: "On switches the test oscillator on, off switches it off." }
    send:
      address: /-stat/osc/on
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  recall_scene:
    summary: Recall (load) the scene stored at a position, 0-99, through /-action/goscene. See the scene recall quirk
    params:
      scene: { type: int, min: 0, max: 99, required: true, label: Scene, description: "Scene position in the show, 0-99, as numbered on the console." }
    send:
      address: /-action/goscene
      args: [ { value: "{scene}", type: int } ]
    returns: none

  recall_snippet:
    summary: Recall (load) the snippet stored at a position, 0-99, through /-action/gosnippet
    params:
      snippet: { type: int, min: 0, max: 99, required: true, label: Snippet, description: "Snippet position in the show, 0-99, as numbered on the console." }
    send:
      address: /-action/gosnippet
      args: [ { value: "{snippet}", type: int } ]
    returns: none

  recall_cue:
    summary: Recall the cue at a position in the show's cue list, 0-99 (the position, not the xxx.x.x cue number), through /-action/gocue
    params:
      cue: { type: int, min: 0, max: 99, required: true, label: Cue, description: "Position in the show's cue list, 0-99, not the xxx.x.x cue number." }
    send:
      address: /-action/gocue
      args: [ { value: "{cue}", type: int } ]
    returns: none

  load_scene:
    summary: "Load the scene stored at a position, 0-99, through /load. Returns the console's status: 1 loaded, 0 failed"
    params:
      scene: { type: int, min: 0, max: 99, required: true, label: Scene, description: "Scene position in the show, 0-99, as numbered on the console." }
    send:
      address: /load
      args: [ { value: "scene", type: string }, { value: "{scene}", type: int } ]
    expect: { address: "/load", arg: 1 }
    returns: value

  load_snippet:
    summary: "Load the snippet stored at a position, 0-99, through /load. Returns the console's status: 1 loaded, 0 failed"
    params:
      snippet: { type: int, min: 0, max: 99, required: true, label: Snippet, description: "Snippet position in the show, 0-99, as numbered on the console." }
    send:
      address: /load
      args: [ { value: "snippet", type: string }, { value: "{snippet}", type: int } ]
    expect: { address: "/load", arg: 1 }
    returns: value

  get_scene_name:
    summary: Read the name of the scene stored at a position, 0-99
    params:
      scene: { type: int, min: 0, max: 99, required: true, label: Scene, description: "Scene position in the show, 0-99, as numbered on the console." }
    send: { address: "/-show/showfile/scene/{scene:03d}/name" }
    expect: { address: "/-show/showfile/scene/{scene:03d}/name", arg: 0 }
    returns: value

  get_snippet_name:
    summary: Read the name of the snippet stored at a position, 0-99
    params:
      snippet: { type: int, min: 0, max: 99, required: true, label: Snippet, description: "Snippet position in the show, 0-99, as numbered on the console." }
    send: { address: "/-show/showfile/snippet/{snippet:03d}/name" }
    expect: { address: "/-show/showfile/snippet/{snippet:03d}/name", arg: 0 }
    returns: value

  get_cue_name:
    summary: Read the name of the cue at a position, 0-99
    params:
      cue: { type: int, min: 0, max: 99, required: true, label: Cue, description: "Position in the show's cue list, 0-99, not the xxx.x.x cue number." }
    send: { address: "/-show/showfile/cue/{cue:03d}/name" }
    expect: { address: "/-show/showfile/cue/{cue:03d}/name", arg: 0 }
    returns: value

  get_show_position:
    summary: "Read the highlighted line on the Scenes page: a cue, scene or snippet index depending on the console's Show Control preference"
    send: { address: "/-show/prepos/current" }
    expect: { address: "/-show/prepos/current", arg: 0 }
    returns: value

  create_undo_point:
    summary: Store an undo checkpoint (the console keeps one)
    send:
      address: /-action/undopt
      args: [ { value: "1", type: int } ]
    returns: none

  undo:
    summary: Go back to the undo checkpoint
    send:
      address: /-action/doundo
      args: [ { value: "1", type: int } ]
    returns: none

  set_fx_type:
    summary: "Set an effects slot's effect type: slots 1-4 take 0-60, slots 5-8 take 0-33 (the document's type lists)"
    params:
      slot: { type: int, min: 1, max: 8, required: true, label: FX slot, description: "Effects slot 1-8, numbered as on the console." }
      type: { type: int, min: 0, max: 60, required: true, label: Effect type, description: "Effect type from the console's list: slots 1-4 take 0-60, slots 5-8 take 0-33." }
    send:
      address: /fx/{slot}/type
      args: [ { value: "{type}", type: int } ]
    returns: none

  get_fx_type:
    summary: Read an effects slot's effect type
    params:
      slot: { type: int, min: 1, max: 8, required: true, label: FX slot, description: "Effects slot 1-8, numbered as on the console." }
    send: { address: "/fx/{slot}/type" }
    expect: { address: "/fx/{slot}/type", arg: 0 }
    returns: value

  set_fx_parameter:
    summary: Set one of an effects slot's parameters, 1-64, as a 0-1 value; the meaning depends on the effect type
    params:
      slot:      { type: int, min: 1, max: 8, required: true, label: FX slot, description: "Effects slot 1-8, numbered as on the console." }
      parameter: { type: int, min: 1, max: 64, required: true, label: Parameter, description: "Effect parameter 1-64; its meaning depends on the effect type." }
      value:     { type: float, min: 0.0, max: 1.0, required: true, label: Value, description: "Parameter value as a fraction 0-1, scaled to the parameter's own range by the console." }
    send:
      address: /fx/{slot}/par/{parameter:02d}
      args: [ { value: "{value}", type: float } ]
    returns: none

  get_fx_parameter:
    summary: Read one of an effects slot's parameters (0-1)
    params:
      slot:      { type: int, min: 1, max: 8, required: true, label: FX slot, description: "Effects slot 1-8, numbered as on the console." }
      parameter: { type: int, min: 1, max: 64, required: true, label: Parameter, description: "Effect parameter 1-64; its meaning depends on the effect type." }
    send: { address: "/fx/{slot}/par/{parameter:02d}" }
    expect: { address: "/fx/{slot}/par/{parameter:02d}", arg: 0 }
    returns: value

