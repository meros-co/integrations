      scene: { type: int, min: 0, max: 99, required: true, label: Scene, description: "Scene position in the show, 0-99, as numbered on the console." }
    send:
      address: /-action/goscene
      args: [ { value: "{scene}", type: int } ]
    returns: none

  recall_snippet:
    summary: Recall (load) the snippet stored at a position, 0-99, through /-action/gosnippet
    params:
      snippet: { type: int, min: 0, max: 99, required: true, label: Snippet, description: "Snippet position in the show, 0-99, as numbered on the console." }
    send:
      address: /-action/gosnippet
      args: [ { value: "{snippet}", type: int } ]
    returns: none

  recall_cue:
    summary: Recall the cue at a position in the show's cue list, 0-99 (the position, not the xxx.x.x cue number), through /-action/gocue
    params:
      cue: { type: int, min: 0, max: 99, required: true, label: Cue, description: "Position in the show's cue list, 0-99, not the xxx.x.x cue number." }
    send:
      address: /-action/gocue
      args: [ { value: "{cue}", type: int } ]
    returns: none

  load_scene:
    summary: "Load the scene stored at a position, 0-99, through /load. Returns the console's status: 1 loaded, 0 failed"
    params:
      scene: { type: int, min: 0, max: 99, required: true, label: Scene, description: "Scene position in the show, 0-99, as numbered on the console." }
    send:
      address: /load
      args: [ { value: "scene", type: string }, { value: "{scene}", type: int } ]
    expect: { address: "/load", arg: 1 }
    returns: value

  load_snippet:
    summary: "Load the snippet stored at a position, 0-99, through /load. Returns the console's status: 1 loaded, 0 failed"
    params:
      snippet: { type: int, min: 0, max: 99, required: true, label: Snippet, description: "Snippet position in the show, 0-99, as numbered on the console." }
    send:
      address: /load
