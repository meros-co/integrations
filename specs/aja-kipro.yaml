telemetry:
  # Changes arrive over the event connection (the aja-config-events
  # extension): each one is offered to the rules below as two lines,
  # "event <param_id> value=<value>" and "event <param_id> value_name=<name>".
  # Events report changes only, so the displayed timecode is read once on
  # connecting, and the transport, clip and media state are also read every
  # 30 seconds: that fills them in at the start, and keeps them right if the
  # unit has no event connection or changes were missed while it was being
  # reopened.
  subscribe:
    send:
      - { method: GET, path: /config, query: { action: get, paramid: eParamID_DisplayTimecode } }
  poll:
    every_ms: 30000
    send:
      - { method: GET, path: /config, query: { action: get, paramid: eParamID_TransportState } }
      - { method: GET, path: /config, query: { action: get, paramid: eParamID_CurrentClip } }
      - { method: GET, path: /config, query: { action: get, paramid: eParamID_MediaState } }
  updates:
    # Every get or set reply carries {paramid, name, value, value_name}.
    - path: "^/config\\?action=(get|set)&paramid="
      json: { name: "$.name", value: "$.value", value_name: "$.value_name" }
      state:
        "params.{name}.value": "{value}"
        "params.{name}.value_name": "{value_name}"
    - path: "^/config\\?action=get&paramid=eParamID_TransportState$"
      json: { state: "$.value_name", code: "$.value" }
      state:
        transport.state: "{state}"
        transport.state_code: "{code}"
    - path: "^/config\\?action=get&paramid=eParamID_DisplayTimecode$"
      json: { tc: "$.value" }
      state: { timecode.display: "{tc}" }
    - path: "^/config\\?action=get&paramid=eParamID_CurrentClip$"
      json: { clip: "$.value" }
      state: { clip.current: "{clip}" }
    - path: "^/config\\?action=get&paramid=eParamID_MediaState$"
      json: { name: "$.value_name", code: "$.value" }
      state:
        media.state: "{name}"
        media.data_lan: { value: "{code}", map: { "0": false, "1": true } }
    - path: "^/config\\?action=get&paramid=eParamID_StoragePath$"
      json: { path: "$.value" }
      state: { media.storage_path: "{path}" }
    # Events, as the aja-config-events extension offers them, with the value
    # and name a get reply would carry: for a string parameter str_value and
    # an empty name; otherwise int_value and str_value (or the value again).
    - match: "^event (\\w+) value=(.*)$"
      state: { "params.{1}.value": "{2}" }
    - match: "^event (\\w+) value_name=(.*)$"
      state: { "params.{1}.value_name": "{2}" }
    - match: "^event eParamID_TransportState value=(-?\\d+)$"
      state: { transport.state_code: "{1}" }
    - match: "^event eParamID_TransportState value_name=(.+)$"
      state: { transport.state: "{1}" }
    - match: "^event eParamID_DisplayTimecode value=(.+)$"
      state: { timecode.display: "{1}" }
    - match: "^event eParamID_CurrentClip value=(.*)$"
      state: { clip.current: "{1}" }
    - match: "^event eParamID_MediaState value=(\\d+)$"
      state:
        media.data_lan: { value: "{1}", map: { "0": false, "1": true } }
    - match: "^event eParamID_MediaState value_name=(.+)$"
      state: { media.state: "{1}" }
    - match: "^event eParamID_StoragePath value=(.*)$"
      state: { media.storage_path: "{1}" }

state:
  params.*.value: { type: string, description: "A parameter's last value read or set, keyed by its eParamID name: the enum's number, an integer, or a string" }
  params.*.value_name: { type: string, description: "A parameter's value as text: the enum's name, or the integer repeated; empty for strings and protobuf data" }
  transport.state: { type: string, description: "Transport state as the recorder names it, such as Idle, Recording or Playing Forward" }
  transport.state_code: { type: int, description: "eParamID_TransportState's numeric value (AJA's api.txt: 3 is Playing Forward)" }
  timecode.display: { type: string, description: "Displayed timecode, HH:MM:SS:FF" }
  clip.current: { type: string, description: "Current clip's name" }
  media.state: { type: string, description: "Media state as the recorder names it: Record-Play or Data - LAN" }
  media.data_lan: { type: bool, description: "True in Data - LAN (transfer) mode, false in Record-Play mode" }
  media.storage_path: { type: string, description: "Path clips are recorded to and played from, such as /mnt/S1/AJA" }

quirks:
  - models: [all]
    severity: critical
    text: >
      Transport commands are numbers set on eParamID_TransportCommand: 1 play,
      3 record, 4 stop, 5 fast forward, 6 fast reverse, 7 and 8 single step
      forward and reverse, 9 next clip, 10 previous clip, 11 variable speed
      play, 12 preroll, 13 assemble edit, 14 cue, 16 play at system time, 17
      record at system time, 18 go to idle. 2 (play reverse) is not
      implemented; AJA's kipro.py says to use fast reverse, or variable speed
      play at -1, instead. 15 (Shutdown) is deliberately not offered as a
      named command: kipro.py says not to use it, as it stops only the
      transport subsystem.

  - models: [all]
    severity: warning
    text: >
      Stop is two-stage: the first stop pauses, the second stops to idle (AJA
      chapters 4-6). AJA's go_to_clipname.py sends stop twice, a quarter of a
      second apart, before loading a clip.

  - models: [all]
    severity: warning
    text: >
      Every action, including transport commands and media erase, is an HTTP
      GET against /config with action=set. A logged, cached or replayed URL
      repeats the action.

  - models: [all]
    severity: warning
    text: >
      The unit pushes parameter changes over an event connection: GET
      /json?action=connect&configid=0 returns {"connectionid":"20"}, then
      GET /json?action=wait_for_config_events&configid=0&connectionid=20
      blocks until changes arrive and returns
      [{"param_id","param_type","int_value","str_value","last_config_update"}],
      usually including eParamID_DisplayTimecode. The client must wait at
      least once a minute or the server expires the connection id (AJA
      api.txt, events.py). The aja-config-events extension runs this loop
      beside the commands: it waits again as soon as each reply arrives,
      opens a new connection when the id has expired or a request fails
      (after 1 s, doubling to 30 s while failures continue), and gives each
      change to the telemetry rules, so state follows the unit as it
      changes. Events carry changes only: the displayed timecode is read once
      on connecting, and the transport, clip and media state every 30
      seconds, which fills them in at the start and corrects them if the unit
      has no event connection or changes were missed while it was reopened;
      the storage path is read only by get_storage_path. AJA's 2021 guide
      lists connect and wait_for_config_events among the /config actions,
      while every AJA example uses /json; /json is the documented URL, and
      the extension tries /config when /json does not give a connection id.
      AJA does not document how an expired id is answered; the extension
      reconnects on any reply that is not a 2xx JSON array.

  - models: [all]
    severity: info
    text: >
      AJA documents only common parameters. Each unit lists every parameter it
      has, with type, enum values, range and persistence, at /desc.json
      (/descriptors?paramid=* on Ki Pro, Mini and Rack) and per parameter at
      /descriptors?paramid=; ids vary by product and firmware.
      get_parameter and set_parameter reach any of them.

  - models: [all]
    severity: info
    text: >
      eParamID_TransportState, eParamID_DisplayTimecode, eParamID_CurrentClip,
      eParamID_GoToClip, eParamID_CustomClipName and eParamID_UseCustomClipName
      are documented by AJA only in the Ki Pro (Mini, Rack) automation package,
      not in the GO and Ultra chapters, so get_transport_state,
      get_display_timecode, get_current_clip, go_to_clip, set_clip_name and
      set_use_custom_clip_name are offered on the original Ki Pro, Mini and
      Rack only. On a GO or Ultra, a unit whose desc.json lists one of these
      ids reaches it with get_parameter and set_parameter, and the telemetry
      rules still map it when it arrives as an event or a poll reply; a unit
      without eParamID_TransportState, eParamID_CurrentClip or
      eParamID_MediaState answers the 30-second poll with an error, which
      changes nothing.

  - models: [all]
    severity: warning
    text: >
      With User Authentication (menu 50.9) set to Login, REST requests need a
      session cookie from a password POST to the web server; AJA documents
      this for HELO, where unauthenticated requests get an HTML 404. The
      format has no cookie login, so the unit must have User Authentication
      set to Disabled.

  - models: [kipro, kipro-mini, kipro-rack]
    severity: critical
    text: >
      record_named leaves the recorder in an unusual state (AJA
      record_with_clipname.py): take numbers stop incrementing, and recording
      from the front panel or web interface overwrites the current clip. To
      restore normal operation set eParamID_UseCustomClipTake back on
      (set_use_custom_clip_take true), which is otherwise only possible by a
      power cycle or a factory reset.

  - models: [kipro, kipro-mini, kipro-rack]
    severity: info
    text: >
      get_clips, delete_clip and select_next_slot use interfaces AJA's
      api.txt marks deprecated ("will continue to operate in support of
      existing clients"). Its /clips example uses unquoted JSON keys, so the
      listing is returned as the reply text, not parsed. AJA's playlist.py and play_with_clipname.py
      send their sets as form POSTs to /config; this spec uses the current
      GET form, and play_with_clipname.py's eParamID_GotToClip is a typo for
      eParamID_GoToClip (go_to_clipname.py).

  - models: [kipro-ultra, kipro-ultra-plus, kipro-ultra-12g]
    severity: info
    text: >
      Set playback speed needs firmware v3.1.1 or above and sub-clips v2.0 or
      above. eParamID_TransportRequestedSpeed is a string parameter of up to
      20 characters, used only with variable speed play (transport command
      11); AJA gives no range. The speed is sent with three decimals, such as
      -1.500; AJA's own examples send both -1.5 and -1.0.

  - models: [kipro-ultra, kipro-ultra-plus, kipro-ultra-12g]
    severity: warning
    text: >
      Sub-clips: source and destination must be on the same drive or the job
      hangs, the drive must have room, the start and duration must lie within
      one clip, and only MOV files are supported. Paths are /mnt/S1/AJA or
      /mnt/S2/AJA for slots 1 and 2. The arguments are sent unencoded as in
      AJA's example, so file names are limited to letters, digits, _, - and .
      here.

  - models: [kipro-ultra, kipro-ultra-plus, kipro-ultra-12g]
    severity: critical
    text: >
      format_media erases the current media at once, with no confirmation.
      The file system used is the one last set with
      set_file_system_format_hfs or set_file_system_format_exfat.

  - models: [kipro-ultra-plus, kipro-ultra-12g]
    severity: info
    text: >
      set_headphone_encode_channel, set_sdi_monitor_channel and
      set_hdmi_out_channel apply in Multi Channel mode only; their descriptors
      are disabled when eParamID_EncodeChannels is 1. AJA's chapter 6 SDI
      monitor URLs omit "paramid=" (action=set&eParamID_SDIMonitorChannel&value=0),
      a documentation error; this spec sends paramid= as everywhere else.

  - models: [all]
    severity: info
    text: >
      Clip download (GET /media/<file>) and upload (PUT /media with
      X-File-Name and X-File-Size headers, Ultra models) need Data - LAN mode
      and carry whole video files, and the Ultra Plus and 12G confidence
      monitor is a WebSocket stream (ws://<unit>/stream); neither is a command
      this format carries. Protobuf alarm parameters such as
      eParamID_Dropped_Frames_Alarm read through get_parameter as base64 that
      the format cannot decode.
