commands:
  # ── Generic parameter access (chapter 1-2) ──────────────────────────────
  get_parameter:
    summary: >
      Read any parameter by id. Returns the device's JSON reply, {paramid,
      name, value, value_name}; ids and values are listed in the unit's
      desc.json
    params:
      paramid: { type: string, pattern: "^eParamID_[A-Za-z0-9_]+$", required: true, label: Parameter ID, description: "Parameter id as listed in the unit's desc.json, such as eParamID_TransportState." }
    send:
      method: GET
      path: /config
      query: { action: get, paramid: "{paramid}" }
    expect: { json_path: "$" }
    returns: value

  set_parameter:
    summary: >
      Set any parameter by id. Enum parameters take the enum's numeric value,
      strings are sent as they are (chapter 2, Type)
    params:
      paramid: { type: string, pattern: "^eParamID_[A-Za-z0-9_]+$", required: true, label: Parameter ID, description: "Parameter id as listed in the unit's desc.json, such as eParamID_TransportState." }
      value: { type: string, required: true, label: Value, description: "New value as text: an enum's numeric value, or a string as it is." }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: "{paramid}", value: "{value}" }
    expect: { status: 200 }
    returns: ack

  get_descriptor:
    summary: Read one parameter's descriptor (type, enum values, range, persistence) as a JSON array
    params:
      paramid: { type: string, pattern: "^eParamID_[A-Za-z0-9_]+$", required: true, label: Parameter ID, description: "Parameter id as listed in the unit's desc.json, such as eParamID_TransportState." }
    send:
      method: GET
      path: /descriptors
      query: { paramid: "{paramid}" }
    expect: { json_path: "$" }
    returns: value

  get_all_descriptors:
    summary: Read every parameter descriptor on the unit (desc.json)
    send: { method: GET, path: /desc.json }
    expect: { json_path: "$" }
    returns: value

  get_all_descriptors_legacy:
    summary: Read every parameter descriptor on a Ki Pro, Mini or Rack (/descriptors?paramid=*)
    send: { method: GET, path: /descriptors, raw_query: "paramid=*" }
    expect: { json_path: "$" }
    returns: value

  save_preset:
    summary: Save the current configuration into a preset (eParamID_RegisterSave)
    params:
      preset: { type: int, min: 1, max: 20, required: true, label: Preset, description: "Preset to save the current configuration in, 1 to 20; it overwrites what the preset held." }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_RegisterSave, value: "{preset}" }
    expect: { status: 200 }
    returns: ack

  recall_preset:
    summary: Recall a saved preset (eParamID_RegisterRecall)
    params:
      preset: { type: int, min: 1, max: 20, required: true, label: Preset, description: "Preset to recall, 1 to 20." }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_RegisterRecall, value: "{preset}" }
    expect: { status: 200 }
    returns: ack

  # ── Event connection (api.txt, events.py) ───────────────────────────────
  open_event_connection:
    summary: Open an event connection (action=connect); returns the connection id for wait_for_events
    send:
      method: GET
      path: /json
      query: { action: connect, configid: "0" }
    expect: { json_path: "$.connectionid" }
    returns: value

  wait_for_events:
    summary: >
      Wait on an event connection for parameter changes
      (action=wait_for_config_events). The reply, returned whole, is an array
      of {param_id, param_type, int_value, str_value, last_config_update}; it
      is held until a change arrives
    params:
      connection: { type: int, min: 0, required: true, label: Event connection, description: "Connection id returned when the event connection was opened." }
    send:
      method: GET
      path: /json
      query: { action: wait_for_config_events, configid: "0", connectionid: "{connection}" }
    expect: { json_path: "$" }
    returns: value

  # ── Transport (eParamID_TransportCommand) ───────────────────────────────
  transport_command:
    summary: >
      Send any eParamID_TransportCommand value (0 No Command to 18 Go To
      Idle), for values without a named command below
    params:
      command: { type: int, min: 0, max: 18, required: true, label: Transport command, description: "eParamID_TransportCommand value from 0 No Command to 18 Go To Idle, such as 1 play, 3 record, 4 stop, 14 cue." }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "{command}" }
    expect: { status: 200 }
    returns: ack

  play:
    summary: Play (transport command 1)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "1" }
    expect: { status: 200 }
    returns: ack

  record:
    summary: Record (transport command 3)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "3" }
    expect: { status: 200 }
    returns: ack

  stop:
    summary: Stop (transport command 4); the first stop pauses, a second one stops to idle
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "4" }
    expect: { status: 200 }
    returns: ack

  fast_forward:
    summary: Fast forward (transport command 5)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "5" }
    expect: { status: 200 }
    returns: ack

  fast_reverse:
    summary: Fast reverse (transport command 6)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "6" }
    expect: { status: 200 }
    returns: ack

  step_forward:
    summary: Single step forward (transport command 7)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "7" }
    expect: { status: 200 }
    returns: ack

  step_reverse:
    summary: Single step reverse (transport command 8)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "8" }
    expect: { status: 200 }
    returns: ack

  next_clip:
    summary: Next clip (transport command 9)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "9" }
    expect: { status: 200 }
    returns: ack

  previous_clip:
    summary: Previous clip (transport command 10)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "10" }
    expect: { status: 200 }
    returns: ack

  variable_speed_play:
    summary: Variable speed play at eParamID_TransportRequestedSpeed (transport command 11)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "11" }
    expect: { status: 200 }
    returns: ack

  preroll:
    summary: Preroll (transport command 12; AJA lists the value without describing it)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "12" }
    expect: { status: 200 }
    returns: ack

  assemble_edit:
    summary: Assemble edit (transport command 13; AJA lists the value without describing it)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "13" }
    expect: { status: 200 }
    returns: ack

  cue:
    summary: Cue (transport command 14), to the timecode in eParamID_CueToTimecode
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "14" }
    expect: { status: 200 }
    returns: ack

  play_at_system_time:
    summary: Play at system time (transport command 16; the time it uses is not named in AJA's documents)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "16" }
    expect: { status: 200 }
    returns: ack

  record_at_system_time:
    summary: Record at system time (transport command 17; the time it uses is not named in AJA's documents)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "17" }
    expect: { status: 200 }
    returns: ack

  go_to_idle:
    summary: Go to idle (transport command 18)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportCommand, value: "18" }
    expect: { status: 200 }
    returns: ack

  cue_to_timecode:
    summary: Cue to a timecode in the current clip (eParamID_CueToTimecode, then transport command 14)
    params:
      timecode: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}$", required: true, label: Timecode, description: "Timecode in the current clip, hh:mm:ss:ff, with ; before the frames for drop frame." }
    send:
      - method: GET
        path: /config
        query: { action: set, paramid: eParamID_CueToTimecode, value: "{timecode}" }
      - method: GET
        path: /config
        query: { action: set, paramid: eParamID_TransportCommand, value: "14" }
    expect: { status: 200 }
    returns: ack

  set_playback_speed:
    summary: >
      Set eParamID_TransportRequestedSpeed, a multiple of normal speed:
      1 normal, 16 sixteen times, -1.5 reverse, 0 pause, 0.5 half speed. It
      applies to variable speed play (transport command 11)
    params:
      speed: { type: float, required: true, label: Speed, description: "Multiple of normal speed: 1 normal, 0.5 half, 0 pause, negative for reverse, such as -1.5; it applies to variable speed play." }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TransportRequestedSpeed, value: "{speed:.3f}" }
    expect: { status: 200 }
    returns: ack

  play_at_speed:
    summary: Variable speed play (transport command 11) at a requested speed, as AJA's reverse.py does
    params:
      speed: { type: float, required: true, label: Speed, description: "Multiple of normal speed: 1 normal, 0.5 half, 0 pause, negative for reverse, such as -1.5." }
    send:
      - method: GET
        path: /config
        query: { action: set, paramid: eParamID_TransportCommand, value: "11" }
      - method: GET
        path: /config
        query: { action: set, paramid: eParamID_TransportRequestedSpeed, value: "{speed:.3f}" }
    expect: { status: 200 }
    returns: ack

  get_transport_state:
    summary: Read the transport state by name, such as Idle, Recording or Playing Forward (eParamID_TransportState)
    send:
      method: GET
      path: /config
      query: { action: get, paramid: eParamID_TransportState }
    expect: { json_path: "$.value_name" }
    returns: value

  get_display_timecode:
    summary: Read the displayed timecode (eParamID_DisplayTimecode)
    send:
      method: GET
      path: /config
      query: { action: get, paramid: eParamID_DisplayTimecode }
    expect: { json_path: "$.value" }
    returns: value

  # ── Clips ───────────────────────────────────────────────────────────────
  get_current_clip:
    summary: Read the current clip's name (eParamID_CurrentClip)
    send:
