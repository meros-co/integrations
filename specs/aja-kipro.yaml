      path: /config
      query: { action: get, paramid: eParamID_CurrentClip }
    expect: { json_path: "$.value" }
    returns: value

  go_to_clip:
    summary: Load a clip by file name, extension included, such as Clip1ATK2.mov (eParamID_GoToClip)
    params:
