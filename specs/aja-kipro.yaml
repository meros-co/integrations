spec: 1
id: aja-kipro
name: AJA Ki Pro recorders
vendor: AJA Video Systems
category: recorder

source:
  - title: AJA REST API (gitlab.aja.com/pub/rest_api, master at commit 13c25d14, April 2026)
    author: AJA Video Systems
    url: https://gitlab.aja.com/pub/rest_api
    note: >
      Manufacturer-documented, Apache-2.0; www.aja.com/support/rest-api
      redirects here. Chapter 1 (01_Generic_AJA_REST_API_Control_Framework.md):
      /config with action=get|set|connect|wait_for_config_events, paramid and
      value; the JSON reply {paramid, name, value, value_name}; desc.json and
      descriptors.html. Chapter 2 (02_Using_the_REST_Interface_Developer_Page.md):
      /descriptors?paramid=, descriptor types, Events, Presets
      (eParamID_RegisterSave / eParamID_RegisterRecall, 1 to 20). Chapter 4
      (KiPro-GO/04_Ki-Pro-GO_Commands.md): eParamID_TransportCommand 0-18,
      eParamID_HeadphoneMonitorChannel, eParamID_HDMIMonitorChannel,
      eParamID_SDIMonitorChannel, eParamID_VideoInput_1, eParamID_AudioInput_1,
      eParamID_MediaState, eParamID_StoragePath. Chapter 5
      (KiProUltra/05_Ki-Pro-Ultra_Commands.md): transport, set playback speed
      (eParamID_TransportRequestedSpeed, v3.1.1 and above), format media
      (eParamID_FileSystemFormat, eParamID_StorageCommand), sub-clips over
      /mediaedit (v2.0 and above), media state and storage path. Chapter 6
      (KiProUltraPlus_KiProUltra12G/06_KPUP_KPU12G_Commands.md): as chapter 5
      plus eParamID_AudioChannelsFocus, eParamID_AudioEncodeChannelFocus,
      eParamID_SDIMonitorChannel and eParamID_HDMIOutChannel. Chapter 7: the
      WebSocket confidence monitor. Chapter 8: protobuf-encoded alarm
      parameters.
  - title: AJA REST API Control Framework and Examples, Developer Guide v1.0 (January 29, 2021)
    author: AJA Video Systems
    url: https://gitlab.aja.com/pub/rest_api/-/blob/master/00_AJA_REST_API_Developer_Guide_v1.0.pdf
    note: >
      The PDF edition of chapters 1-6 above (also aja.com support item 4184).
      Query parameters p.8-9, JSON reply p.9, presets p.22, HELO authentication
      p.30-32, Ki Pro GO p.35-46, Ki Pro Ultra and Ultra Plus / 12G from p.47.
  - title: Ki Pro AJA REST Automation 4.1.0 (kipro_automation_4.1.0.zip)
    author: AJA Video Systems
    url: https://www.aja.com/support/item-download/400/kipro_automation_4.1.0.zip
    note: >
      Manufacturer package for Ki Pro, Ki Pro Mini and Ki Pro Rack (aja.com
      support item 400; files dated 2012). examples/api.txt marks its own
      /options, /values and form-POST interfaces as deprecated in favour of
      the /config REST API, but is AJA's only document for: the event
      connection (/json?action=connect&configid=0 and
      /json?action=wait_for_config_events), eParamID_CueToTimecode with
      transport command 14, the /clips listing and clip delete, next_slot,
      and the TransportState, DisplayTimecode and VideoInSelect/AudioInSelect
      examples. examples/python: kipro.py (transport command numbers, with
      notes that 2 is not implemented and 15 must not be used), record.py,
      record_with_clipname.py, go_to_clipname.py, cue.py, reverse.py,
      playlist.py, polling_for_clips.py (reads /config?action=get), events.py
      and timecode.py.
  - title: Bitfocus Companion module aja-kipro (MIT)
    url: https://github.com/bitfocus/companion-module-aja-kipro
    note: >
      Read for corroboration only; nothing here is sourced from it. It
      targets "Ki Pro and Ki Pro Ultra series" and uses
      eParamID_TransportState, eParamID_DisplayTimecode, eParamID_CurrentClip,
      eParamID_MediaState, eParamID_GoToClip, eParamID_CustomClipName and
      eParamID_UseCustomClipName, which AJA documents in the 4.1.0 package
      above. It opens the event connection at /json?action=connect&configid=0
      and waits with /json?action=wait_for_config_events, reading str_value
      for string parameters and int_value for numbers.

transport:
  type: http
  port: 80
  scheme: http
  auth: none
  timeout_ms: 4000
  probe:
    method: GET
    path: /config
    query: { action: get, paramid: eParamID_TransportState }

# The event connection (api.txt, events.py): connect, then hold a
# wait_for_config_events request open, again and again, with the returned
# connection id. The extension runs that loop beside the commands, using the
# requests of open_event_connection and wait_for_events below, and offers
# each change to the telemetry rules as "event <param_id> value=<value>" and
# "event <param_id> value_name=<value_name>".
extension: aja-config-events

ports:
  - { port: 80, protocol: http, role: control }
  - { port: 80, protocol: http, role: push, note: "the event connection's long polls" }

