    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_CustomClipName, value: "{name}" }
    expect: { status: 200 }
    returns: ack

  set_use_custom_clip_name:
    summary: Turn custom clip naming on or off (eParamID_UseCustomClipName, menu 19.1)
    params:
      enabled: { type: bool, required: true, label: Custom clip name, description: "On names new clips with the custom clip name, off uses the unit's own naming." }
    send:
