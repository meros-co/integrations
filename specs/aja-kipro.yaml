    params:
      enabled: { type: bool, required: true, label: Take number, description: "On adds a take number to custom clip names; turn it on again after a named recording." }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_UseCustomClipTake, value: "{enabled:bool01}" }
    expect: { status: 200 }
    returns: ack

  record_named:
    summary: >
      Record a clip with exactly this name, overwriting a clip of that name
      (AJA's record_with_clipname.py: take numbering off, custom name on, the
      name, then record)
    params:
      name: { type: string, required: true, label: Clip name, description: "Exact name for the new clip; a clip of the same name is overwritten." }
    send:
      - method: GET
