      role: { type: enum, values: [Sink, Source, Dual Role], required: true, label: Power role, description: "Sink, Source or Dual Role." }
    send: 'SET /V1/MEDIA/USB/U{host}.PortPowerRoleSetting={role}'
    expect: { matches: '^pw /V1/MEDIA/USB/U\d+\.PortPowerRoleSetting=' }
