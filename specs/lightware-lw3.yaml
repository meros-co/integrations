commands:
  # ── Shared by every tree ─────────────────────────────────────────────────
  get_serial:
    summary: 'Get the serial number'
    send: 'GET /.SerialNumber'
    expect: { matches: '^pr /\.SerialNumber=(.*)$' }
    returns: value

  get_product_name:
    summary: 'Get the product name (read-only)'
    send: 'GET /.ProductName'
    expect: { matches: '^pr /\.ProductName=(.*)$' }
    returns: value

  # ── /V1 tree: MMX2, Taurus UCX, DCX, UCX-TPX ─────────────────────────────
  # System (MMX2 7.5, UCX 8.5)
  get_firmware_version:
    summary: 'Get the firmware package version'
    send: 'GET /V1/MANAGEMENT/UID/PACKAGE.Version'
    expect: { matches: '^pr /V1/MANAGEMENT/UID/PACKAGE\.Version=(.*)$' }
    returns: value

  get_device_label:
    summary: 'Get the device label'
    send: 'GET /V1/MANAGEMENT/LABEL.DeviceLabel'
    expect: { matches: '^p[rw] /V1/MANAGEMENT/LABEL\.DeviceLabel=(.*)$' }
    returns: value

  set_device_label:
    summary: 'Set the device label (up to 49 ASCII characters; longer is truncated by the device)'
    params:
      label: { type: string, max_length: 49, pattern: '^[ -~]*$', required: true }
    send: 'SET /V1/MANAGEMENT/LABEL.DeviceLabel={label}'
    expect: { matches: '^pw /V1/MANAGEMENT/LABEL\.DeviceLabel=' }
    returns: ack

  restart:
    summary: 'Restart the device; connections are dropped'
    send: 'CALL /V1/SYS:restart()'
    expect: { matches: '^mO /V1/SYS:restart(?:=|$)' }
    returns: ack

  factory_defaults:
    summary: 'Restore the factory default settings and restart'
    send: 'CALL /V1/SYS:factoryDefaults()'
    expect: { matches: '^mO /V1/SYS:factoryDefaults(?:=|$)' }
    returns: ack

  identify:
    summary: 'Blink the status LEDs for 10 seconds'
    send: 'CALL /V1/MANAGEMENT/UI:identifyMe()'
    expect: { matches: '^mO /V1/MANAGEMENT/UI:identifyMe(?:=|$)' }
    returns: ack

  set_control_lock:
    summary: 'Lock or unlock the front panel buttons'
    params:
      mode: { type: enum, values: [None, Locked, Force locked], required: true }
    send: 'SET /V1/MANAGEMENT/UI.ControlLock={mode}'
    expect: { matches: '^pw /V1/MANAGEMENT/UI\.ControlLock=' }
    returns: ack

  set_dark_mode:
    summary: 'Switch the LEDs off (dark mode) or back on'
    params:
      enabled: { type: bool, required: true }
    send: 'SET /V1/MANAGEMENT/UI/DARKMODE.Enable={enabled}'
    expect: { matches: '^pw /V1/MANAGEMENT/UI/DARKMODE\.Enable=' }
    returns: ack

  set_dark_mode_delay:
    summary: 'Set the delay before dark mode starts, in seconds (0 for none)'
    params:
      seconds: { type: int, min: 0, required: true }
    send: 'SET /V1/MANAGEMENT/UI/DARKMODE.Delay={seconds}'
    expect: { matches: '^pw /V1/MANAGEMENT/UI/DARKMODE\.Delay=' }
    returns: ack

  # Crosspoint (MMX2 7.6/7.8, UCX 8.6/8.10)
  switch:
    summary: 'Route an input to an output on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      input: { type: int, min: 1, required: true }
      output: { type: int, min: 1, required: true }
    send: 'CALL /V1/MEDIA/{layer}/XP:switch(I{input}:O{output})'
    expect: { matches: '^mO /V1/MEDIA/(?:VIDEO|AUDIO)/XP:switch(?:=|$)' }
    returns: ack

  disconnect:
    summary: 'Disconnect an output (route input 0) on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      output: { type: int, min: 1, required: true }
    send: 'CALL /V1/MEDIA/{layer}/XP:switch(0:O{output})'
    expect: { matches: '^mO /V1/MEDIA/(?:VIDEO|AUDIO)/XP:switch(?:=|$)' }
    returns: ack

  switch_video_all:
    summary: 'Route a video input to every video output'
    params:
      input: { type: int, min: 1, required: true }
    send: 'CALL /V1/MEDIA/VIDEO/XP:switchAll(I{input})'
    expect: { matches: '^mO /V1/MEDIA/VIDEO/XP:switchAll(?:=|$)' }
    returns: ack

  set_port_lock:
    summary: 'Lock or unlock a crosspoint port (input I<n> or output O<n>)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
      locked: { type: bool, required: true }
    send: 'SET /V1/MEDIA/{layer}/XP/{port}.Lock={locked}'
    expect: { matches: '^pw /V1/MEDIA/(?:VIDEO|AUDIO)/XP/[IO]\d+\.Lock=' }
    returns: ack

  set_port_mute:
    summary: 'Mute or unmute a crosspoint port (input I<n> or output O<n>); the route is kept'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
      muted: { type: bool, required: true }
    send: 'SET /V1/MEDIA/{layer}/XP/{port}.Mute={muted}'
    expect: { matches: '^pw /V1/MEDIA/(?:VIDEO|AUDIO)/XP/[IO]\d+\.Mute=' }
    returns: ack

  get_connected_source:
    summary: 'Get the input routed to an output (I<n>, or 0 when disconnected)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      output: { type: int, min: 1, required: true }
    send: 'GET /V1/MEDIA/{layer}/XP/O{output}.ConnectedSource'
    expect: { matches: '^p[rw] /V1/MEDIA/(?:VIDEO|AUDIO)/XP/O\d+\.ConnectedSource=(.*)$' }
    returns: value

  get_connected_destinations:
    summary: 'Get the outputs an input is routed to, semicolon-separated'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      input: { type: int, min: 1, required: true }
    send: 'GET /V1/MEDIA/{layer}/XP/I{input}.ConnectedDestinations'
    expect: { matches: '^p[rw] /V1/MEDIA/(?:VIDEO|AUDIO)/XP/I\d+\.ConnectedDestinations=(.*)$' }
    returns: value

  get_port_lock:
    summary: 'Get whether a crosspoint port is locked (true/false)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
    send: 'GET /V1/MEDIA/{layer}/XP/{port}.Lock'
    expect: { matches: '^p[rw] /V1/MEDIA/(?:VIDEO|AUDIO)/XP/[IO]\d+\.Lock=(.*)$' }
    returns: value

  get_port_mute:
    summary: 'Get whether a crosspoint port is muted (true/false)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
    send: 'GET /V1/MEDIA/{layer}/XP/{port}.Mute'
    expect: { matches: '^p[rw] /V1/MEDIA/(?:VIDEO|AUDIO)/XP/[IO]\d+\.Mute=(.*)$' }
    returns: value

  get_switchable:
    summary: 'Get whether an input can be routed to an output now (OK or Busy)'
    params:
      output: { type: int, min: 1, required: true }
      input: { type: int, min: 1, required: true }
    send: 'GET /V1/MEDIA/VIDEO/XP/O{output}/SWITCHABLE.I{input}'
    expect: { matches: '^pr /V1/MEDIA/VIDEO/XP/O\d+/SWITCHABLE\.I\d+=(.*)$' }
    returns: value

  # Port status and names (MMX2 6.3.4, 7.6.11, 7.6.15, 7.8.9)
  get_signal_present:
    summary: 'Get whether a video or audio port has a signal (true/false)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
    send: 'GET /V1/MEDIA/{layer}/{port}.SignalPresent'
    expect: { matches: '^pr /V1/MEDIA/(?:VIDEO|AUDIO)/[IO]\d+\.SignalPresent=(.*)$' }
    returns: value

  get_port_connected:
    summary: 'Get whether a device is connected to a video port (true/false)'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
    send: 'GET /V1/MEDIA/VIDEO/{port}.Connected'
    expect: { matches: '^pr /V1/MEDIA/VIDEO/[IO]\d+\.Connected=(.*)$' }
    returns: value

  get_embedded_audio_present:
    summary: 'Get whether a video port carries embedded audio (true/false)'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
    send: 'GET /V1/MEDIA/VIDEO/{port}.EmbeddedAudioPresent'
    expect: { matches: '^pr /V1/MEDIA/VIDEO/[IO]\d+\.EmbeddedAudioPresent=(.*)$' }
    returns: value

  get_port_name:
    summary: 'Get the name of a video port'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
    send: 'GET /V1/MEDIA/VIDEO/{port}.Name'
    expect: { matches: '^p[rw] /V1/MEDIA/VIDEO/[IO]\d+\.Name=(.*)$' }
    returns: value

  set_port_name:
    summary: 'Set the name of a video port'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
      name: { type: string, pattern: '^[^\\{}#%()]*$', required: true }
    send: 'SET /V1/MEDIA/VIDEO/{port}.Name={name}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/[IO]\d+\.Name=' }
    returns: ack

  # Video port settings (MMX2 7.6.5-7.6.17)
  set_embedded_audio_mute:
    summary: 'Mute or unmute the embedded audio of a video output'
    params:
      output: { type: int, min: 1, required: true }
      muted: { type: bool, required: true }
    send: 'SET /V1/MEDIA/VIDEO/O{output}.EmbeddedAudioMute={muted}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/O\d+\.EmbeddedAudioMute=' }
    returns: ack

  set_input_hdcp:
    summary: 'Set the HDCP capability an input reports to the source'
    params:
      input: { type: int, min: 1, required: true }
      version: { type: enum, values: [HDCP 1.4, HDCP 2.2, 'Off'], required: true }
    send: 'SET /V1/MEDIA/VIDEO/I{input}/HDCP.AllowedHdcpVersion={version}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/I\d+/HDCP\.AllowedHdcpVersion=' }
    returns: ack

  set_output_signal_type:
    summary: 'Set the signal type of a video output (Auto is HDMI)'
    params:
      output: { type: int, min: 1, required: true }
      signal_type: { type: enum, values: [Auto, DVI], required: true }
    send: 'SET /V1/MEDIA/VIDEO/O{output}.OutputSignalType={signal_type}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/O\d+\.OutputSignalType=' }
    returns: ack

  set_autoselect_policy:
    summary: 'Set the video autoselect policy of an output'
    params:
      output: { type: int, min: 1, required: true }
      policy: { type: enum, values: ['Off', Last detect, First detect], required: true }
    send: 'SET /V1/MEDIA/VIDEO/AUTOSELECT/O{output}.Policy={policy}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/AUTOSELECT/O\d+\.Policy=' }
    returns: ack

  set_autoselect_included:
    summary: 'Include or exclude an input from an output''s video autoselect'
    params:
      output: { type: int, min: 1, required: true }
      input: { type: int, min: 1, required: true }
      included: { type: bool, required: true }
    send: 'SET /V1/MEDIA/VIDEO/AUTOSELECT/O{output}/I{input}.Included={included}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/AUTOSELECT/O\d+/I\d+\.Included=' }
    returns: ack

  set_autoselect_priority:
    summary: 'Set an input''s video autoselect priority for an output (1-100, equal values allowed)'
    params:
      output: { type: int, min: 1, required: true }
      input: { type: int, min: 1, required: true }
      priority: { type: int, min: 1, max: 100, required: true }
    send: 'SET /V1/MEDIA/VIDEO/AUTOSELECT/O{output}/I{input}.Priority={priority}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/AUTOSELECT/O\d+/I\d+\.Priority=' }
    returns: ack

  # CEC (MMX2 7.7, UCX 8.9)
  cec_send:
    summary: 'Send a CEC code (hex, e.g. 446D power on) from a video output to the sink'
    params:
      output: { type: int, min: 1, required: true }
      code: { type: string, pattern: '^([0-9A-Fa-f]{2})+$', required: true }
    send: 'CALL /V1/MEDIA/VIDEO/O{output}/CEC:send({code})'
    expect: { matches: '^mO /V1/MEDIA/VIDEO/O\d+/CEC:send(?:=|$)' }
    returns: ack

  cec_send_user_control_click:
    summary: 'Send a CEC remote-control key press and release (hex code) to the sink'
    params:
      output: { type: int, min: 1, required: true }
      code: { type: string, pattern: '^([0-9A-Fa-f]{2})+$', required: true }
    send: 'CALL /V1/MEDIA/VIDEO/O{output}/CEC:sendUserControlClick({code})'
    expect: { matches: '^mO /V1/MEDIA/VIDEO/O\d+/CEC:sendUserControlClick(?:=|$)' }
    returns: ack

  # Audio (MMX2 7.8, UCX 8.10)
  set_audio_output_mute:
    summary: 'Mute or unmute an analog audio output (sets its volume low)'
    params:
      output: { type: int, min: 1, required: true }
      muted: { type: bool, required: true }
    send: 'SET /V1/MEDIA/AUDIO/O{output}.Mute={muted}'
    expect: { matches: '^pw /V1/MEDIA/AUDIO/O\d+\.Mute=' }
    returns: ack

  set_audio_output_volume_db:
    summary: 'Set an analog audio output volume in dB (0.375 dB steps, rounded by the device)'
    params:
      output: { type: int, min: 1, required: true }
      level: { type: float, min: -95.62, max: 0, required: true }
    send: 'SET /V1/MEDIA/AUDIO/O{output}.VolumedB={level:.2f}'
    expect: { matches: '^pw /V1/MEDIA/AUDIO/O\d+\.VolumedB=' }
    returns: ack

  set_audio_output_volume_percent:
    summary: 'Set an analog audio output volume in percent'
    params:
      output: { type: int, min: 1, required: true }
      percent: { type: float, min: 0, max: 100, required: true }
    send: 'SET /V1/MEDIA/AUDIO/O{output}.VolumePercent={percent:.2f}'
    expect: { matches: '^pw /V1/MEDIA/AUDIO/O\d+\.VolumePercent=' }
    returns: ack

  set_audio_output_balance:
    summary: 'Set an analog audio output balance (-100 left, 0 centre, 100 right)'
    params:
      output: { type: int, min: 1, required: true }
      balance: { type: int, min: -100, max: 100, required: true }
    send: 'SET /V1/MEDIA/AUDIO/O{output}.Balance={balance}'
    expect: { matches: '^pw /V1/MEDIA/AUDIO/O\d+\.Balance=' }
    returns: ack

  step_audio_output_volume_db:
    summary: 'Raise or lower an analog audio output volume by a number of dB'
    params:
      output: { type: int, min: 1, required: true }
      step: { type: int, min: -96, max: 96, required: true }
    send: 'CALL /V1/MEDIA/AUDIO/O{output}:stepVolumedB({step})'
    expect: { matches: '^mO /V1/MEDIA/AUDIO/O\d+:stepVolumedB(?:=|$)' }
    returns: ack

  set_audio_autoselect_policy:
    summary: 'Set an analog audio output to follow a video output, or not'
    params:
      output: { type: int, min: 1, required: true }
      policy: { type: enum, values: [Follow video, 'Off'], required: true }
    send: 'SET /V1/MEDIA/AUDIO/AUTOSELECT/O{output}.Policy={policy}'
    expect: { matches: '^pw /V1/MEDIA/AUDIO/AUTOSELECT/O\d+\.Policy=' }
    returns: ack

  set_audio_follow_port:
    summary: 'Set the video output an analog audio output follows'
    params:
      output: { type: int, min: 1, required: true }
      video_output: { type: int, min: 1, required: true }
    send: 'SET /V1/MEDIA/AUDIO/AUTOSELECT/O{output}.VideoFollowPort=O{video_output}'
    expect: { matches: '^pw /V1/MEDIA/AUDIO/AUTOSELECT/O\d+\.VideoFollowPort=' }
    returns: ack

  # USB crosspoint (UCX 8.11)
  switch_usb:
    summary: 'Connect a USB host (U<n>) to the USB hub H1'
    params:
      host: { type: int, min: 1, max: 4, required: true }
    send: 'CALL /V1/MEDIA/USB/XP:switch(U{host}:H1)'
    expect: { matches: '^mO /V1/MEDIA/USB/XP:switch(?:=|$)' }
    returns: ack

  disconnect_usb:
    summary: 'Disconnect the USB hub H1 from every host'
    send: 'CALL /V1/MEDIA/USB/XP:switch(0:H1)'
    expect: { matches: '^mO /V1/MEDIA/USB/XP:switch(?:=|$)' }
    returns: ack

  get_usb_source:
    summary: 'Get the USB host connected to the hub H1 (U<n>)'
    send: 'GET /V1/MEDIA/USB/XP/H1.ConnectedSource'
    expect: { matches: '^p[rw] /V1/MEDIA/USB/XP/H1\.ConnectedSource=(.*)$' }
    returns: value

  set_usb_port_lock:
    summary: 'Lock or unlock a USB port (U<n> host or H1 hub)'
    params:
      port: { type: string, pattern: '^(U[1-4]|H1)$', required: true }
      locked: { type: bool, required: true }
    send: 'SET /V1/MEDIA/USB/XP/{port}.Lock={locked}'
    expect: { matches: '^pw /V1/MEDIA/USB/XP/[UH]\d+\.Lock=' }
    returns: ack

  # EDID (MMX2 7.9, UCX 8.13)
  get_edid_status:
    summary: 'Get the EDID emulated on each input, as <source>:E<n> pairs'
    send: 'GET /V1/EDID.EdidStatus'
    expect: { matches: '^pr /V1/EDID\.EdidStatus=(.*)$' }
    returns: value

  edid_switch:
    summary: 'Emulate an EDID (F<n> factory, U<n> user, D<n> dynamic) on an input'
    params:
      source: { type: string, pattern: '^[FUD][1-9][0-9]{0,2}$', required: true }
      input: { type: int, min: 1, required: true }
    send: 'CALL /V1/EDID:switch({source}:E{input})'
    expect: { matches: '^mO /V1/EDID:switch(?:=|$)' }
    returns: ack

  edid_switch_all:
    summary: 'Emulate an EDID on every input'
    params:
      source: { type: string, pattern: '^[FUD][1-9][0-9]{0,2}$', required: true }
    send: 'CALL /V1/EDID:switchAll({source})'
    expect: { matches: '^mO /V1/EDID:switchAll(?:=|$)' }
    returns: ack

  edid_copy:
    summary: 'Copy an EDID into a user EDID slot (overwritten without warning)'
    params:
      source: { type: string, pattern: '^[FUD][1-9][0-9]{0,2}$', required: true }
      slot: { type: int, min: 1, max: 100, required: true }
    send: 'CALL /V1/EDID:copy({source}:U{slot})'
    expect: { matches: '^mO /V1/EDID:copy(?:=|$)' }
    returns: ack

  edid_delete:
    summary: 'Delete a user EDID'
    params:
      slot: { type: int, min: 1, max: 100, required: true }
    send: 'CALL /V1/EDID:delete(U{slot})'
    expect: { matches: '^mO /V1/EDID:delete(?:=|$)' }
    returns: ack

  edid_reset:
    summary: 'Switch every emulated EDID back to the factory default'
    send: 'CALL /V1/EDID:reset()'
    expect: { matches: '^mO /V1/EDID:reset(?:=|$)' }
    returns: ack

  # ── MX2 tree (/MEDIA/XP/VIDEO) ───────────────────────────────────────────
  # System (MX2 9.4); the label is shared with UMX
  get_device_label_uid:
    summary: 'Get the device label'
    send: 'GET /MANAGEMENT/UID.DeviceLabel'
    expect: { matches: '^p[rw] /MANAGEMENT/UID\.DeviceLabel=(.*)$' }
    returns: value

  set_device_label_uid:
    summary: 'Set the device label (MX2 up to 32, UMX up to 39 ASCII characters; longer is truncated)'
    params:
      label: { type: string, max_length: 39, pattern: '^[ -~]*$', required: true }
    send: 'SET /MANAGEMENT/UID.DeviceLabel={label}'
    expect: { matches: '^pw /MANAGEMENT/UID\.DeviceLabel=' }
    returns: ack

  factory_defaults_legacy:
    summary: 'Restore the factory default settings and restart'
    send: 'CALL /SYS:factoryDefaults()'
    expect: { matches: '^mO /SYS:factoryDefaults(?:=|$)' }
    returns: ack

  mx2_soft_reset:
    summary: 'Restart the matrix; connections are dropped'
    send: 'CALL /SYS:softReset()'
    expect: { matches: '^mO /SYS:softReset(?:=|$)' }
    returns: ack

  mx2_get_power_mode:
    summary: 'Get the operation mode (NORMAL or STANDBY)'
    send: 'GET /MANAGEMENT/POWER.Operation'
    expect: { matches: '^pr /MANAGEMENT/POWER\.Operation=(.*)$' }
    returns: value

  mx2_standby:
    summary: 'Switch to standby: video transmission and LCD off, remote control stays'
    send: 'CALL /MANAGEMENT/POWER:standby()'
    expect: { matches: '^mO /MANAGEMENT/POWER:standby(?:=|$)' }
    returns: ack

  mx2_wake_up:
    summary: 'Return from standby to normal operation'
    send: 'CALL /MANAGEMENT/POWER:wakeUp()'
    expect: { matches: '^mO /MANAGEMENT/POWER:wakeUp(?:=|$)' }
    returns: ack

  # Crosspoint (MX2 9.5, 9.6.2-9.6.6, 9.11.1-9.11.5)
  mx2_switch:
    summary: 'Route an input to an output'
    params:
      input: { type: int, min: 1, max: 48, required: true }
      output: { type: int, min: 1, max: 48, required: true }
    send: 'CALL /MEDIA/XP/VIDEO:switch(I{input}:O{output})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:switch(?:=|$)' }
    returns: ack

  mx2_disconnect:
    summary: 'Disconnect an output (route input 0)'
    params:
      output: { type: int, min: 1, max: 48, required: true }
    send: 'CALL /MEDIA/XP/VIDEO:switch(0:O{output})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:switch(?:=|$)' }
    returns: ack

  mx2_switch_all:
    summary: 'Route an input to every output'
    params:
      input: { type: int, min: 1, max: 48, required: true }
    send: 'CALL /MEDIA/XP/VIDEO:switchAll(I{input})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:switchAll(?:=|$)' }
    returns: ack

  mx2_disconnect_all:
    summary: 'Disconnect every output'
    send: 'CALL /MEDIA/XP/VIDEO:switchAll(0)'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:switchAll(?:=|$)' }
    returns: ack

  mx2_switch_multi:
    summary: 'Set several outputs at once: the source of each output in order, semicolon-separated (I<n>, 0, or empty to leave it)'
    params:
      sources: { type: string, pattern: '^((I[1-9][0-9]?|0)?;){0,47}(I[1-9][0-9]?|0)?$', required: true }
    send: 'CALL /MEDIA/XP/VIDEO:switchMulti({sources})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:switchMulti(?:=|$)' }
    returns: ack

  mx2_mute_input:
    summary: 'Mute an input'
    params:
      input: { type: int, min: 1, max: 48, required: true }
    send: 'CALL /MEDIA/XP/VIDEO:muteSource(I{input})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:muteSource(?:=|$)' }
    returns: ack

  mx2_unmute_input:
    summary: 'Unmute an input'
    params:
      input: { type: int, min: 1, max: 48, required: true }
    send: 'CALL /MEDIA/XP/VIDEO:unmuteSource(I{input})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:unmuteSource(?:=|$)' }
    returns: ack

  mx2_lock_input:
    summary: 'Lock an input'
    params:
      input: { type: int, min: 1, max: 48, required: true }
    send: 'CALL /MEDIA/XP/VIDEO:lockSource(I{input})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:lockSource(?:=|$)' }
    returns: ack

  mx2_unlock_input:
    summary: 'Unlock an input'
    params:
      input: { type: int, min: 1, max: 48, required: true }
    send: 'CALL /MEDIA/XP/VIDEO:unlockSource(I{input})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:unlockSource(?:=|$)' }
    returns: ack

  mx2_mute_output:
    summary: 'Mute an output; the route is kept and restored on unmute'
    params:
      output: { type: int, min: 1, max: 48, required: true }
    send: 'CALL /MEDIA/XP/VIDEO:muteDestination(O{output})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:muteDestination(?:=|$)' }
    returns: ack

  mx2_unmute_output:
    summary: 'Unmute an output'
    params:
      output: { type: int, min: 1, max: 48, required: true }
    send: 'CALL /MEDIA/XP/VIDEO:unmuteDestination(O{output})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:unmuteDestination(?:=|$)' }
    returns: ack

  mx2_lock_output:
    summary: 'Lock an output so its route cannot change'
    params:
      output: { type: int, min: 1, max: 48, required: true }
    send: 'CALL /MEDIA/XP/VIDEO:lockDestination(O{output})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:lockDestination(?:=|$)' }
    returns: ack

  mx2_unlock_output:
    summary: 'Unlock an output'
    params:
      output: { type: int, min: 1, max: 48, required: true }
    send: 'CALL /MEDIA/XP/VIDEO:unlockDestination(O{output})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:unlockDestination(?:=|$)' }
    returns: ack

  mx2_get_connections:
    summary: 'Get every output''s source, semicolon-separated in output order (I<n> or 0)'
    send: 'GET /MEDIA/XP/VIDEO.DestinationConnectionStatus'
    expect: { matches: '^pr /MEDIA/XP/VIDEO\.DestinationConnectionStatus=(.*)$' }
    returns: value

  mx2_get_input_status:
    summary: 'Get every input''s status (lock/mute letter and status byte), semicolon-separated'
    send: 'GET /MEDIA/XP/VIDEO.SourcePortStatus'
    expect: { matches: '^pr /MEDIA/XP/VIDEO\.SourcePortStatus=(.*)$' }
    returns: value

  mx2_get_output_status:
    summary: 'Get every output''s status (lock/mute letter and status byte), semicolon-separated'
    send: 'GET /MEDIA/XP/VIDEO.DestinationPortStatus'
    expect: { matches: '^pr /MEDIA/XP/VIDEO\.DestinationPortStatus=(.*)$' }
    returns: value

  # Presets (MX2 9.16)
  mx2_create_preset:
    summary: 'Store the current crosspoint and mute states as a new named preset'
    params:
      name: { type: string, max_length: 16, pattern: '^[A-Za-z0-9_-]+$', required: true }
    send: 'CALL /MEDIA/PRESET:create({name},VIDEO)'
    expect: { matches: '^mO /MEDIA/PRESET:create(?:=|$)' }
    returns: ack

  mx2_load_preset:
    summary: 'Load a named preset (every port except locked ones)'
    params:
      name: { type: string, max_length: 16, pattern: '^[A-Za-z0-9_-]+$', required: true }
    send: 'CALL /MEDIA/PRESET/{name}:load()'
    expect: { matches: '^mO /MEDIA/PRESET/[A-Za-z0-9_-]+:load(?:=|$)' }
    returns: ack

  mx2_rename_preset:
    summary: 'Rename a preset'
    params:
      name: { type: string, max_length: 16, pattern: '^[A-Za-z0-9_-]+$', required: true }
      new_name: { type: string, max_length: 16, pattern: '^[A-Za-z0-9_-]+$', required: true }
    send: 'CALL /MEDIA/PRESET:rename({name},{new_name})'
    expect: { matches: '^mO /MEDIA/PRESET:rename(?:=|$)' }
    returns: ack

  # Port settings (MX2 9.6-9.15)
  mx2_set_input_hdcp:
    summary: 'Set an input''s HDCP: 0 off, 1 HDCP 1.4, 2 HDCP 2.3, 3 any version converted up to 2.3'
    params:
      input: { type: int, min: 1, max: 48, required: true }
      version: { type: int, min: 0, max: 3, required: true }
    send: 'SET /MEDIA/PORTS/VIDEO/I{input}/SETTINGS.HdcpVersion={version}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/I\d+/SETTINGS\.HdcpVersion=' }
    returns: ack

  mx2_set_output_hdcp_mode:
    summary: 'Set an output''s HDCP mode: AUTO follows the input, ALWAYS encrypts'
    params:
      output: { type: int, min: 1, max: 48, required: true }
      mode: { type: enum, values: [AUTO, ALWAYS], required: true }
    send: 'SET /MEDIA/PORTS/VIDEO/O{output}/SETTINGS.HdcpMode={mode}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/O\d+/SETTINGS\.HdcpMode=' }
    returns: ack

  mx2_set_output_signal_type:
    summary: 'Force an output''s signal type (AUTO: HDMI when audio is present)'
    params:
      output: { type: int, min: 1, max: 48, required: true }
      signal_type: { type: enum, values: [DVI, HDMI, AUTO], required: true }
    send: 'SET /MEDIA/PORTS/VIDEO/O{output}/SETTINGS.ForcedSignalType={signal_type}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/O\d+/SETTINGS\.ForcedSignalType=' }
    returns: ack

  mx2_set_output_conversion:
    summary: 'Set an output''s colour conversion (LEFT/RIGHT split a 4K60 4:4:4 picture across two outputs)'
    params:
      output: { type: int, min: 1, max: 48, required: true }
      conversion: { type: enum, values: ['OFF', '420', '422', LEFT, RIGHT], required: true }
    send: 'SET /MEDIA/PORTS/VIDEO/O{output}/SETTINGS.Conversion={conversion}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/O\d+/SETTINGS\.Conversion=' }
    returns: ack

  mx2_set_embedded_audio_mode:
    summary: 'Set the audio embedded in a video port: OFF, HDMI (original) or ANALOG (-A/-Audio models)'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
      mode: { type: enum, values: ['OFF', HDMI, ANALOG], required: true }
    send: 'SET /MEDIA/PORTS/VIDEO/{port}/EMBEDDEDAUDIO.AudioMode={mode}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/[IO]\d+/EMBEDDEDAUDIO\.AudioMode=' }
    returns: ack

  mx2_set_analog_output_mode:
    summary: 'Set where an output''s audio goes (-A/-Audio models): OFF, HDMI, ANALOG or HDMI+ANALOG'
    params:
      output: { type: int, min: 1, max: 48, required: true }
      mode: { type: enum, values: ['OFF', HDMI, ANALOG, HDMI+ANALOG], required: true }
    send: 'SET /MEDIA/PORTS/VIDEO/O{output}/ANALOGAUDIO.AudioMode={mode}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/O\d+/ANALOGAUDIO\.AudioMode=' }
    returns: ack

  mx2_set_analog_output_volume_db:
    summary: 'Set an analog audio output volume in dB (-A/-Audio models)'
    params:
      output: { type: int, min: 1, max: 48, required: true }
      level: { type: float, min: -95.62, max: 0, required: true }
    send: 'SET /MEDIA/PORTS/VIDEO/O{output}/ANALOGAUDIO.VolumedB={level:.2f}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/O\d+/ANALOGAUDIO\.VolumedB=' }
    returns: ack

  mx2_set_analog_mute:
    summary: 'Mute or unmute the analog audio of a port (-A/-Audio models)'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
      muted: { type: bool, required: true }
    send: 'SET /MEDIA/PORTS/VIDEO/{port}/ANALOGAUDIO.Mute={muted}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/[IO]\d+/ANALOGAUDIO\.Mute=' }
    returns: ack

  mx2_set_analog_balance:
    summary: 'Set the analog audio balance of a port (-100 left, 0 centre, 100 right)'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
      balance: { type: int, min: -100, max: 100, required: true }
    send: 'SET /MEDIA/PORTS/VIDEO/{port}/ANALOGAUDIO.Balance={balance}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/[IO]\d+/ANALOGAUDIO\.Balance=' }
    returns: ack

  mx2_set_analog_input_gain:
    summary: 'Set an analog audio input gain in dB (rounded by the device)'
    params:
      input: { type: int, min: 1, max: 48, required: true }
      gain: { type: int, min: -12, max: 35, required: true }
    send: 'SET /MEDIA/PORTS/VIDEO/I{input}/ANALOGAUDIO.Gain={gain}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/I\d+/ANALOGAUDIO\.Gain=' }
    returns: ack

  mx2_cec_send:
    summary: 'Send a named CEC command from an HDMI port to the connected device'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true }
      command: { type: enum, values: [image_view_on, standby, ok, back, up, down, left, right, root_menu, setup_menu, contents_menu, favorite_menu, media_top_menu, media_context_menu, number_0, number_1, number_2, number_3, number_4, number_5, number_6, number_7, number_8, number_9, dot, enter, clear, channel_up, channel_down, sound_select, input_select, display_info, power_legacy, page_up, page_down, volume_up, volume_down, mute_toggle, mute, unmute, play, stop, pause, record, rewind, fast_forward, eject, skip_forward, skip_backward, 3d_mode, stop_record, pause_record, play_forward, play_reverse, select_next_media, select_media_1, select_media_2, select_media_3, select_media_4, select_media_5, power_toggle, power_on, power_off, stop_function, f1, f2, f3, f4, set_osd], required: true }
    send: 'CALL /MEDIA/PORTS/VIDEO/{port}/CEC:send({command})'
    expect: { matches: '^mO /MEDIA/PORTS/VIDEO/[IO]\d+/CEC:send(?:=|$)' }
    returns: ack

  # EDID (MX2 9.18)
  mx2_get_edid_status:
    summary: 'Get the EDID emulated on each input, semicolon-separated in input order'
    send: 'GET /EDID.EdidStatus'
    expect: { matches: '^pr /EDID\.EdidStatus=(.*)$' }
    returns: value

  mx2_edid_switch:
    summary: 'Emulate an EDID (F<n> factory, U<n> user, D<n> dynamic) on an input'
    params:
      source: { type: string, pattern: '^[FUD][1-9][0-9]{0,2}$', required: true }
      input: { type: int, min: 1, max: 48, required: true }
    send: 'CALL /EDID:switch({source}:E{input})'
    expect: { matches: '^mO /EDID:switch(?:=|$)' }
    returns: ack

  mx2_edid_copy:
    summary: 'Copy an EDID into a user EDID slot (overwritten without warning)'
    params:
      source: { type: string, pattern: '^[FUD][1-9][0-9]{0,2}$', required: true }
      slot: { type: int, min: 1, max: 100, required: true }
    send: 'CALL /EDID:copy({source}:U{slot})'
    expect: { matches: '^mO /EDID:copy(?:=|$)' }
    returns: ack

  # ── UMX tree (/MEDIA/VIDEO/XP, /MEDIA/AUDIO/XP) ──────────────────────────
  umx_get_firmware_version:
    summary: 'Get the CPU firmware version'
    send: 'GET /SYS/MB.FirmwareVersion'
    expect: { matches: '^pr /SYS/MB\.FirmwareVersion=(.*)$' }
    returns: value

  umx_get_package_version:
    summary: 'Get the installed firmware package version (FW package 1.3.0b5 and later)'
    send: 'GET /MANAGEMENT/UID.PackageVersion'
    expect: { matches: '^pr /MANAGEMENT/UID\.PackageVersion=(.*)$' }
    returns: value

  umx_reset:
    summary: 'Restart the device; connections are dropped'
    send: 'CALL /SYS:reset()'
    expect: { matches: '^mO /SYS:reset(?:=|$)' }
    returns: ack

  umx_identify:
    summary: 'Blink the status LEDs for 10 seconds'
    send: 'CALL /MANAGEMENT/UI:identifyMe()'
    expect: { matches: '^mO /MANAGEMENT/UI:identifyMe(?:=|$)' }
    returns: ack

  umx_set_control_lock:
    summary: 'Front panel lock: 0 none, 1 locked (unlockable by buttons), 2 force locked'
    params:
      mode: { type: int, min: 0, max: 2, required: true }
    send: 'SET /MANAGEMENT/UI.ControlLock={mode}'
    expect: { matches: '^pw /MANAGEMENT/UI\.ControlLock=' }
    returns: ack

  umx_run_macro:
    summary: 'Run a macro stored in the device (UMX-HDMI-140-Plus)'
    params:
      name: { type: string, pattern: '^[^\\{}#%()]*$', required: true }
    send: 'CALL /CTRL/MACROS:run({name})'
    expect: { matches: '^mO /CTRL/MACROS:run(?:=|$)' }
    returns: ack

  umx_logout:
    summary: 'Log out (Cleartext login); the tree is protected again'
    send: 'CALL /LOGIN:logout({settings.password})'
    expect: { matches: '^mO /LOGIN:logout(?:=|$)' }
    returns: ack

  umx_switch:
    summary: 'Route an input to the output on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      input: { type: int, min: 1, max: 6, required: true }
      output: { type: int, min: 1, max: 1, default: 1 }
    send: 'CALL /MEDIA/{layer}/XP:switch(I{input}:O{output})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:switch(?:=|$)' }
    returns: ack

  umx_mute_input:
    summary: 'Mute an input on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      input: { type: int, min: 1, max: 6, required: true }
    send: 'CALL /MEDIA/{layer}/XP:muteSource(I{input})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:muteSource(?:=|$)' }
    returns: ack

  umx_unmute_input:
    summary: 'Unmute an input on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      input: { type: int, min: 1, max: 6, required: true }
    send: 'CALL /MEDIA/{layer}/XP:unmuteSource(I{input})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:unmuteSource(?:=|$)' }
    returns: ack

  umx_lock_input:
    summary: 'Lock an input on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      input: { type: int, min: 1, max: 6, required: true }
    send: 'CALL /MEDIA/{layer}/XP:lockSource(I{input})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:lockSource(?:=|$)' }
    returns: ack

  umx_unlock_input:
    summary: 'Unlock an input on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      input: { type: int, min: 1, max: 6, required: true }
    send: 'CALL /MEDIA/{layer}/XP:unlockSource(I{input})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:unlockSource(?:=|$)' }
    returns: ack

  umx_mute_output:
    summary: 'Mute the output; the route is kept on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      output: { type: int, min: 1, max: 1, default: 1 }
    send: 'CALL /MEDIA/{layer}/XP:muteDestination(O{output})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:muteDestination(?:=|$)' }
    returns: ack

  umx_unmute_output:
    summary: 'Unmute the output on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      output: { type: int, min: 1, max: 1, default: 1 }
    send: 'CALL /MEDIA/{layer}/XP:unmuteDestination(O{output})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:unmuteDestination(?:=|$)' }
    returns: ack

  umx_lock_output:
    summary: 'Lock the output so its route cannot change on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      output: { type: int, min: 1, max: 1, default: 1 }
    send: 'CALL /MEDIA/{layer}/XP:lockDestination(O{output})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:lockDestination(?:=|$)' }
    returns: ack

  umx_unlock_output:
    summary: 'Unlock the output on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      output: { type: int, min: 1, max: 1, default: 1 }
    send: 'CALL /MEDIA/{layer}/XP:unlockDestination(O{output})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:unlockDestination(?:=|$)' }
    returns: ack

  umx_get_connection:
    summary: 'Get the input routed to the output on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
    send: 'GET /MEDIA/{layer}/XP.DestinationConnectionList'
    expect: { matches: '^pr /MEDIA/(?:VIDEO|AUDIO)/XP\.DestinationConnectionList=(.*)$' }
    returns: value

  umx_get_input_status:
    summary: 'Get every input''s status (lock/mute letter and two status bytes), semicolon-separated'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
    send: 'GET /MEDIA/{layer}/XP.SourcePortStatus'
    expect: { matches: '^pr /MEDIA/(?:VIDEO|AUDIO)/XP\.SourcePortStatus=(.*)$' }
    returns: value

  umx_get_output_status:
    summary: 'Get the output''s status (lock/mute letter and two status bytes)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
    send: 'GET /MEDIA/{layer}/XP.DestinationPortStatus'
    expect: { matches: '^pr /MEDIA/(?:VIDEO|AUDIO)/XP\.DestinationPortStatus=(.*)$' }
    returns: value

  umx_set_autoselect:
    summary: 'Set the autoselect of the output: E or D (enabled/disabled), optionally followed by F, P or L (first, priority, last detect; S static for audio)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true }
      output: { type: int, min: 1, max: 1, default: 1 }
      setting: { type: string, pattern: '^[ED][FPLS]?$', required: true }
    send: 'CALL /MEDIA/{layer}/XP:setDestinationPortAutoselect(O{output}:{setting})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP[:.]setDestinationPortAutoselect(?:=|$)' }
    returns: ack

  umx_set_input_hdcp:
    summary: 'Enable or disable HDCP on a digital video input (I2-I4)'
    params:
      input: { type: int, min: 2, max: 4, required: true }
      enabled: { type: bool, required: true }
    send: 'SET /MEDIA/VIDEO/I{input}.HdcpEnable={enabled}'
    expect: { matches: '^pw /MEDIA/VIDEO/I\d+\.HdcpEnable=' }
    returns: ack

  umx_set_output_hdcp_mode:
    summary: 'Set the output HDCP mode: 0 auto, 1 always'
    params:
      mode: { type: int, min: 0, max: 1, required: true }
    send: 'SET /MEDIA/VIDEO/O1.HdcpModeSetting={mode}'
    expect: { matches: '^pw /MEDIA/VIDEO/O1\.HdcpModeSetting=' }
    returns: ack

  umx_set_test_pattern_mode:
    summary: 'Set an input''s test pattern: 0 off, 1 on, 2 when the input has no signal'
    params:
      input: { type: int, min: 1, max: 6, required: true }
      mode: { type: int, min: 0, max: 2, required: true }
    send: 'SET /MEDIA/VIDEO/I{input}.FreeRunMode={mode}'
    expect: { matches: '^pw /MEDIA/VIDEO/I\d+\.FreeRunMode=' }
    returns: ack

  umx_set_hdmi_mode:
    summary: 'Set the output HDMI mode: 0 auto, 1 DVI, 2 HDMI 24-bit, 3 HDMI 30-bit, 4 HDMI 36-bit'
    params:
      mode: { type: int, min: 0, max: 4, required: true }
    send: 'SET /MEDIA/VIDEO/O1.HdmiModeSetting={mode}'
    expect: { matches: '^pw /MEDIA/VIDEO/O1\.HdmiModeSetting=' }
    returns: ack

  umx_set_color_space:
    summary: 'Set the output colour space: 0 auto, 1 RGB, 2 YCbCr 4:4:4, 3 YCbCr 4:2:2'
    params:
      mode: { type: int, min: 0, max: 3, required: true }
    send: 'SET /MEDIA/VIDEO/O1.ColorSpaceSetting={mode}'
    expect: { matches: '^pw /MEDIA/VIDEO/O1\.ColorSpaceSetting=' }
    returns: ack

  umx_set_audio_input_volume:
    summary: 'Set an analog audio input volume in dB (0.375 dB steps, rounded by the device)'
    params:
      input: { type: int, min: 1, max: 5, required: true }
      level: { type: float, min: -95.625, max: 0, required: true }
    send: 'SET /MEDIA/AUDIO/I{input}.Volume={level:.3f}'
    expect: { matches: '^pw /MEDIA/AUDIO/I\d+\.Volume=' }
    returns: ack

  umx_set_audio_input_balance:
    summary: 'Set an analog audio input balance (0 left, 50 centre, 100 right)'
    params:
      input: { type: int, min: 1, max: 5, required: true }
      balance: { type: int, min: 0, max: 100, required: true }
    send: 'SET /MEDIA/AUDIO/I{input}.Balance={balance}'
    expect: { matches: '^pw /MEDIA/AUDIO/I\d+\.Balance=' }
    returns: ack

state:
  device.serial:            { type: string, description: "Serial number (/.SerialNumber)" }
  device.product_name:      { type: string, description: "Product name (/.ProductName)" }
  device.label:             { type: string, description: "Device label (DeviceLabel)" }
  device.firmware:          { type: string, description: "Firmware package version (/V1 PACKAGE.Version, UMX UID.PackageVersion)" }
  device.cpu_firmware:      { type: string, description: "UMX CPU firmware version (SYS/MB.FirmwareVersion)" }
  device.power_mode:        { type: string, description: "MX2 operation mode: NORMAL or STANDBY (POWER.Operation)" }
  device.logged_in:         { type: bool, description: "Cleartext login state (LOGIN.LoggedIn)" }
  video.outputs.*.input:    { type: int, description: "Input routed to the video output; 0 is disconnected" }
  video.outputs.*.locked:   { type: bool, description: "The video output is locked" }
  video.outputs.*.muted:    { type: bool, description: "The video output is muted (route kept)" }
  video.outputs.*.signal:   { type: bool, description: "A signal is present on the video output" }
  video.outputs.*.connected: { type: bool, description: "A sink is connected to the video output" }
  video.outputs.*.hdcp:     { type: bool, description: "The output signal is HDCP-encrypted (MX2/UMX status byte)" }
  video.outputs.*.embedded_audio: { type: bool, description: "The output signal carries embedded audio" }
  video.outputs.*.embedded_audio_muted: { type: bool, description: "Embedded audio muted on the output (/V1 EmbeddedAudioMute)" }
  video.outputs.*.name:     { type: string, description: "Output name (/V1 Name)" }
  video.outputs.*.switchable.*: { type: bool, description: "Whether the input (second number) can be routed to the output now (/V1 SWITCHABLE: OK true, Busy false)" }
  video.inputs.*.locked:    { type: bool, description: "The video input is locked" }
  video.inputs.*.muted:     { type: bool, description: "The video input is muted" }
  video.inputs.*.signal:    { type: bool, description: "A signal is present on the video input" }
  video.inputs.*.connected: { type: bool, description: "A source is connected to the video input" }
  video.inputs.*.hdcp:      { type: bool, description: "The input signal is HDCP-encrypted (MX2/UMX status byte)" }
  video.inputs.*.embedded_audio: { type: bool, description: "The input signal carries embedded audio" }
  video.inputs.*.name:      { type: string, description: "Input name (/V1 Name, MX2 /MEDIA/NAMES/VIDEO)" }
  video.outputs.*.name_mx2: { type: string, description: "MX2 output name (/MEDIA/NAMES/VIDEO)" }
  audio.outputs.*.input:    { type: int, description: "Input routed to the audio output; 0 is disconnected" }
  audio.outputs.*.locked:   { type: bool, description: "The audio output is locked" }
  audio.outputs.*.muted:    { type: bool, description: "The audio output is muted on the crosspoint" }
  audio.outputs.*.signal:   { type: bool, description: "An audio signal is present on the output" }
  audio.outputs.*.connected: { type: bool, description: "Something is connected to the audio output (UMX status byte)" }
  audio.outputs.*.volume_muted: { type: bool, description: "Analog output mute (/V1 AUDIO/O<n>.Mute)" }
  audio.outputs.*.volume_db: { type: float, unit: dB, description: "Analog output volume" }
  audio.outputs.*.volume_percent: { type: float, unit: "%", description: "Analog output volume in percent" }
  audio.outputs.*.balance:  { type: int, description: "Analog output balance, -100 left to 100 right" }
  audio.inputs.*.locked:    { type: bool, description: "The audio input is locked" }
  audio.inputs.*.muted:     { type: bool, description: "The audio input is muted" }
  audio.inputs.*.signal:    { type: bool, description: "An audio signal is present on the input" }
  audio.inputs.*.connected: { type: bool, description: "Something is connected to the audio input (UMX status byte)" }
  usb.hubs.*.host:          { type: int, description: "USB host (U<n>) connected to the hub; 0 is disconnected" }
  usb.hubs.*.locked:        { type: bool, description: "The USB hub port is locked" }
  usb.hosts.*.locked:       { type: bool, description: "The USB host port is locked" }
  edid.status:              { type: string, description: "Emulated EDID per input as the device lists it (EdidStatus)" }

telemetry:
  # Subscriptions are per connection and lost when it closes (MX2 9.3.9,
  # MMX2 7.4.9), so they are sent on every connect. A product answers an OPEN of
  # a node it lacks with an error line, which is ignored: the list covers every
  # tree because it cannot be chosen per model.
  subscribe:
    send:
      - 'OPEN /V1/MEDIA/VIDEO/*'
      - 'OPEN /V1/MEDIA/VIDEO/XP/*'
      - 'OPEN /V1/MEDIA/AUDIO/*'
      - 'OPEN /V1/MEDIA/AUDIO/XP/*'
      - 'OPEN /V1/MEDIA/USB/XP/*'
      - 'OPEN /V1/MANAGEMENT/LABEL'
      - 'OPEN /MEDIA/XP/VIDEO'
      - 'OPEN /MEDIA/NAMES/VIDEO'
      - 'OPEN /MANAGEMENT/POWER'
      - 'OPEN /MANAGEMENT/UID'
      - 'OPEN /MEDIA/VIDEO/XP'
      - 'OPEN /MEDIA/AUDIO/XP'
      - 'OPEN /LOGIN'
  # Current values are read once on connecting; afterwards CHG lines keep them
  # current. Only single-property GETs are used: a multi-line answer (GETALL)
  # would be taken line by line as the replies to later commands. /V1 ports are
  # read for the largest documented port set (video I1-I5, O1-O3; audio O1-O4;
  # USB H1); other ports are kept current from CHG lines only.
  poll:
    send:
      - 'GET /.ProductName'
      - 'GET /.SerialNumber'
      - 'GET /V1/MANAGEMENT/UID/PACKAGE.Version'
      - 'GET /V1/MANAGEMENT/LABEL.DeviceLabel'
      - 'GET /V1/MEDIA/VIDEO/XP/I1.Lock'
      - 'GET /V1/MEDIA/VIDEO/XP/I1.Mute'
      - 'GET /V1/MEDIA/VIDEO/I1.SignalPresent'
      - 'GET /V1/MEDIA/VIDEO/XP/I2.Lock'
      - 'GET /V1/MEDIA/VIDEO/XP/I2.Mute'
      - 'GET /V1/MEDIA/VIDEO/I2.SignalPresent'
      - 'GET /V1/MEDIA/VIDEO/XP/I3.Lock'
      - 'GET /V1/MEDIA/VIDEO/XP/I3.Mute'
      - 'GET /V1/MEDIA/VIDEO/I3.SignalPresent'
      - 'GET /V1/MEDIA/VIDEO/XP/I4.Lock'
      - 'GET /V1/MEDIA/VIDEO/XP/I4.Mute'
      - 'GET /V1/MEDIA/VIDEO/I4.SignalPresent'
      - 'GET /V1/MEDIA/VIDEO/XP/I5.Lock'
      - 'GET /V1/MEDIA/VIDEO/XP/I5.Mute'
      - 'GET /V1/MEDIA/VIDEO/I5.SignalPresent'
      - 'GET /V1/MEDIA/VIDEO/XP/O1.ConnectedSource'
      - 'GET /V1/MEDIA/VIDEO/XP/O1.Lock'
      - 'GET /V1/MEDIA/VIDEO/XP/O1.Mute'
      - 'GET /V1/MEDIA/VIDEO/O1.SignalPresent'
      - 'GET /V1/MEDIA/VIDEO/XP/O2.ConnectedSource'
      - 'GET /V1/MEDIA/VIDEO/XP/O2.Lock'
      - 'GET /V1/MEDIA/VIDEO/XP/O2.Mute'
      - 'GET /V1/MEDIA/VIDEO/O2.SignalPresent'
      - 'GET /V1/MEDIA/VIDEO/XP/O3.ConnectedSource'
      - 'GET /V1/MEDIA/VIDEO/XP/O3.Lock'
      - 'GET /V1/MEDIA/VIDEO/XP/O3.Mute'
      - 'GET /V1/MEDIA/VIDEO/O3.SignalPresent'
      - 'GET /V1/MEDIA/AUDIO/XP/O1.ConnectedSource'
      - 'GET /V1/MEDIA/AUDIO/XP/O2.ConnectedSource'
      - 'GET /V1/MEDIA/AUDIO/XP/O3.ConnectedSource'
      - 'GET /V1/MEDIA/AUDIO/XP/O4.ConnectedSource'
      - 'GET /V1/MEDIA/USB/XP/H1.ConnectedSource'
      - 'GET /V1/EDID.EdidStatus'
      - 'GET /MANAGEMENT/UID.DeviceLabel'
      - 'GET /MANAGEMENT/POWER.Operation'
      - 'GET /MEDIA/XP/VIDEO.DestinationConnectionStatus'
      - 'GET /MEDIA/XP/VIDEO.SourcePortStatus'
      - 'GET /MEDIA/XP/VIDEO.DestinationPortStatus'
      - 'GET /EDID.EdidStatus'
      - 'GET /SYS/MB.FirmwareVersion'
      - 'GET /MANAGEMENT/UID.PackageVersion'
      - 'GET /MEDIA/VIDEO/XP.DestinationConnectionList'
      - 'GET /MEDIA/VIDEO/XP.SourcePortStatus'
      - 'GET /MEDIA/VIDEO/XP.DestinationPortStatus'
      - 'GET /MEDIA/AUDIO/XP.DestinationConnectionList'
      - 'GET /MEDIA/AUDIO/XP.SourcePortStatus'
      - 'GET /MEDIA/AUDIO/XP.DestinationPortStatus'
  # A rule matches a GET/SET reply (pr/pw) and a change notification (CHG)
  # alike. Values end the line, so an error answer (pE ... %E...) is never
  # taken as state.
  updates:
    - match: '^(?:CHG|pr) /\.SerialNumber=(\S+)$'
      state: { "device.serial": "{1}" }
    - match: '^(?:CHG|pr) /\.ProductName=(.+)$'
      state: { "device.product_name": "{1}" }
    - match: '^(?:CHG|p[rw]) /(?:V1/MANAGEMENT/LABEL|MANAGEMENT/UID)\.DeviceLabel=(.*)$'
      state: { "device.label": "{1}" }
    - match: '^(?:CHG|pr) /(?:V1/MANAGEMENT/UID/PACKAGE\.Version|MANAGEMENT/UID\.PackageVersion)=(\S+)$'
      state: { "device.firmware": "{1}" }
    - match: '^(?:CHG|pr) /SYS/MB\.FirmwareVersion=(.+)$'
      state: { "device.cpu_firmware": "{1}" }
    - match: '^(?:CHG|p[rw]) /MANAGEMENT/POWER\.Operation=(NORMAL|STANDBY)$'
      state: { "device.power_mode": "{1}" }
