    params:
      hex: { type: string, max_length: 500, pattern: '^([0-9A-Fa-f]{2})+$', required: true, label: Bytes, description: "Bytes to send as hex digits without separators, such as 433030." }
    send: 'CALL /MEDIA/UART/P1:sendBinaryMessage({hex})'
    expect: { matches: '^mO /MEDIA/UART/P1:sendBinaryMessage(?:=|$)' }
    returns: ack

  umx_set_rs232_recognizer:
    summary: 'Enable or disable the RS-232 recognizer, which keeps the last received message (UMX 7.18, -Plus)'
    params:
      enabled: { type: bool, required: true, label: Recognizer, description: "On keeps received data in the recognizer, off stops it." }
    send: 'SET /MEDIA/UART/P1.RecognizerEnable={enabled}'
    expect: { matches: '^pw /MEDIA/UART/P1\.RecognizerEnable=' }
    returns: ack

  umx_set_rs232_recognizer_delimiter:
    summary: 'Set the bytes that end a received RS-232 message, in hex (up to 8 bytes)'
    params:
      hex: { type: string, max_length: 16, pattern: '^([0-9A-Fa-f]{2})+$', required: true, label: Delimiter, description: "Delimiter bytes as hex digits, up to 8 bytes, such as 0d0a." }
    send: 'SET /MEDIA/UART/RECOGNIZER.DelimiterHex={hex}'
    expect: { matches: '^pw /MEDIA/UART/RECOGNIZER\.DelimiterHex=' }
