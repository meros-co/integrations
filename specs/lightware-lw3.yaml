  umx_set_rs232_recognizer_timeout:
    summary: 'Set the silence that ends a received RS-232 message, in ms (0 off, at least 10)'
    params:
      ms: { type: int, min: 0, max: 65535, required: true, label: Timeout, description: "Milliseconds of silence that end a message; 0 turns it off, otherwise 10 or more." }
    send: 'SET /MEDIA/UART/RECOGNIZER.TimeOut={ms}'
    expect: { matches: '^pw /MEDIA/UART/RECOGNIZER\.TimeOut=' }
