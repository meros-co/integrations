      - get_device_label
      - set_device_label
      - restart
      - factory_defaults
      - identify
      - set_control_lock
      - set_dark_mode
      - set_dark_mode_delay
      - switch
      - disconnect
      - switch_video_all
      - set_port_lock
      - set_port_mute
      - get_connected_source
      - get_connected_destinations
      - get_port_lock
      - get_port_mute
      - get_switchable
      - get_signal_present
      - get_port_connected
      - get_embedded_audio_present
      - get_port_name
      - set_port_name
      - set_embedded_audio_mute
      - set_input_hdcp
      - set_output_signal_type
      - set_autoselect_policy
      - set_autoselect_included
      - set_autoselect_priority
      - cec_send
      - cec_send_user_control_click
      - set_audio_output_mute
      - set_audio_output_volume_db
      - set_audio_output_volume_percent
      - set_audio_output_balance
      - step_audio_output_volume_db
      - set_audio_autoselect_policy
      - set_audio_follow_port
      - switch_usb
      - disconnect_usb
      - get_usb_source
      - set_usb_port_lock
      - get_edid_status
      - edid_switch
      - edid_switch_all
      - edid_copy
      - edid_delete
      - edid_reset
      - set_gpio_direction
      - set_gpio_output
      - gpio_interval
      - gpio_toggle
      - set_ocs_sensor_type
      - set_serial_baudrate
      - set_serial_stop_bits
      - set_serial_parity
      - set_network_dhcp
      - set_network_static_address
      - set_network_static_netmask
      - set_network_static_gateway
      - set_hostname
      - apply_network_settings
      - set_ethernet_port_enabled
      - set_web_service_enabled
      - set_web_authentication
      - restart_web_service
      - set_output_5v_mode
      - set_time
      - set_remote_syslog_enabled
      - set_remote_syslog_server
      - set_remote_syslog_protocol
      - set_remote_syslog_port
      - get_edid_preferred_resolution
      - get_edid_validity
      - set_welcome_image_enabled
      - set_welcome_message_enabled
      - set_welcome_message
      - reset_welcome_image
      - set_usb_autoselect_policy
      - set_usb_follow_output
      - set_usb_autoselect_included
      - set_usb_autoselect_priority
      - set_usb_c_power
      - set_usb_c_dp_alt_mode
      - set_usb_c_power_role
    verification: none
    notes: >
      Products whose manual documents the /V1 tree. Each product has a
      subset: a path it lacks is answered with an nE/pE/mE error
      (%E002 Not exist), which fails the command.

commands:
  # ── Shared by every tree ─────────────────────────────────────────────────
  get_serial:
    summary: 'Get the serial number'
    send: 'GET /.SerialNumber'
    expect: { matches: '^pr /\.SerialNumber=(.*)$' }
    returns: value

  get_product_name:
    summary: 'Get the product name (read-only)'
    send: 'GET /.ProductName'
    expect: { matches: '^pr /\.ProductName=(.*)$' }
    returns: value

  # ── /V1 tree: MMX2, Taurus UCX, DCX, UCX-TPX ─────────────────────────────
  # System (MMX2 7.5, UCX 8.5)
  get_firmware_version:
    summary: 'Get the firmware package version'
    send: 'GET /V1/MANAGEMENT/UID/PACKAGE.Version'
    expect: { matches: '^pr /V1/MANAGEMENT/UID/PACKAGE\.Version=(.*)$' }
    returns: value

  get_device_label:
    summary: 'Get the device label'
    send: 'GET /V1/MANAGEMENT/LABEL.DeviceLabel'
    expect: { matches: '^p[rw] /V1/MANAGEMENT/LABEL\.DeviceLabel=(.*)$' }
    returns: value

  set_device_label:
    summary: 'Set the device label (up to 49 ASCII characters; longer is truncated by the device)'
    params:
      label: { type: string, max_length: 49, pattern: '^[ -~]*$', required: true, label: Device label, description: "Device label in printable ASCII; the device truncates anything over 49 characters." }
    send: 'SET /V1/MANAGEMENT/LABEL.DeviceLabel={label}'
    expect: { matches: '^pw /V1/MANAGEMENT/LABEL\.DeviceLabel=' }
    returns: ack

  restart:
    summary: 'Restart the device; connections are dropped'
    send: 'CALL /V1/SYS:restart()'
    expect: { matches: '^mO /V1/SYS:restart(?:=|$)' }
    returns: ack

  factory_defaults:
    summary: 'Restore the factory default settings and restart'
    send: 'CALL /V1/SYS:factoryDefaults()'
    expect: { matches: '^mO /V1/SYS:factoryDefaults(?:=|$)' }
    returns: ack

  identify:
    summary: 'Blink the status LEDs for 10 seconds'
    send: 'CALL /V1/MANAGEMENT/UI:identifyMe()'
    expect: { matches: '^mO /V1/MANAGEMENT/UI:identifyMe(?:=|$)' }
    returns: ack

  set_control_lock:
    summary: 'Lock or unlock the front panel buttons'
    params:
      mode: { type: enum, values: [None, Locked, Force locked], required: true, label: Front panel lock, description: "None unlocks the buttons, Locked locks them but they can be unlocked from the panel, Force locked locks them fully." }
    send: 'SET /V1/MANAGEMENT/UI.ControlLock={mode}'
    expect: { matches: '^pw /V1/MANAGEMENT/UI\.ControlLock=' }
    returns: ack

  set_dark_mode:
    summary: 'Switch the LEDs off (dark mode) or back on'
    params:
      enabled: { type: bool, required: true, label: Dark mode, description: "On switches the LEDs off, off switches them back on." }
    send: 'SET /V1/MANAGEMENT/UI/DARKMODE.Enable={enabled}'
    expect: { matches: '^pw /V1/MANAGEMENT/UI/DARKMODE\.Enable=' }
    returns: ack

  set_dark_mode_delay:
    summary: 'Set the delay before dark mode starts, in seconds (0 for none)'
    params:
      seconds: { type: int, min: 0, required: true, label: Delay, description: "Seconds before dark mode starts; 0 for none." }
    send: 'SET /V1/MANAGEMENT/UI/DARKMODE.Delay={seconds}'
    expect: { matches: '^pw /V1/MANAGEMENT/UI/DARKMODE\.Delay=' }
    returns: ack

  # Crosspoint (MMX2 7.6/7.8, UCX 8.6/8.10)
  switch:
    summary: 'Route an input to an output on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      input: { type: int, min: 1, required: true, label: Input, description: "Input to route, numbered from 1 as on the device." }
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
    send: 'CALL /V1/MEDIA/{layer}/XP:switch(I{input}:O{output})'
    expect: { matches: '^mO /V1/MEDIA/(?:VIDEO|AUDIO)/XP:switch(?:=|$)' }
    returns: ack

  disconnect:
    summary: 'Disconnect an output (route input 0) on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
    send: 'CALL /V1/MEDIA/{layer}/XP:switch(0:O{output})'
    expect: { matches: '^mO /V1/MEDIA/(?:VIDEO|AUDIO)/XP:switch(?:=|$)' }
    returns: ack

  switch_video_all:
    summary: 'Route a video input to every video output'
    params:
      input: { type: int, min: 1, required: true, label: Input, description: "Video input to route to every video output, numbered from 1." }
    send: 'CALL /V1/MEDIA/VIDEO/XP:switchAll(I{input})'
    expect: { matches: '^mO /V1/MEDIA/VIDEO/XP:switchAll(?:=|$)' }
    returns: ack

  set_port_lock:
    summary: 'Lock or unlock a crosspoint port (input I<n> or output O<n>)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
      locked: { type: bool, required: true, label: Lock, description: "On locks it, off unlocks it." }
    send: 'SET /V1/MEDIA/{layer}/XP/{port}.Lock={locked}'
    expect: { matches: '^pw /V1/MEDIA/(?:VIDEO|AUDIO)/XP/[IO]\d+\.Lock=' }
    returns: ack

  set_port_mute:
    summary: 'Mute or unmute a crosspoint port (input I<n> or output O<n>); the route is kept'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
      muted: { type: bool, required: true, label: Mute, description: "On mutes the port and keeps its route, off unmutes it." }
    send: 'SET /V1/MEDIA/{layer}/XP/{port}.Mute={muted}'
    expect: { matches: '^pw /V1/MEDIA/(?:VIDEO|AUDIO)/XP/[IO]\d+\.Mute=' }
    returns: ack

  get_connected_source:
    summary: 'Get the input routed to an output (I<n>, or 0 when disconnected)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
    send: 'GET /V1/MEDIA/{layer}/XP/O{output}.ConnectedSource'
    expect: { matches: '^p[rw] /V1/MEDIA/(?:VIDEO|AUDIO)/XP/O\d+\.ConnectedSource=(.*)$' }
    returns: value

  get_connected_destinations:
    summary: 'Get the outputs an input is routed to, semicolon-separated'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      input: { type: int, min: 1, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'GET /V1/MEDIA/{layer}/XP/I{input}.ConnectedDestinations'
    expect: { matches: '^p[rw] /V1/MEDIA/(?:VIDEO|AUDIO)/XP/I\d+\.ConnectedDestinations=(.*)$' }
    returns: value

  get_port_lock:
    summary: 'Get whether a crosspoint port is locked (true/false)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
    send: 'GET /V1/MEDIA/{layer}/XP/{port}.Lock'
    expect: { matches: '^p[rw] /V1/MEDIA/(?:VIDEO|AUDIO)/XP/[IO]\d+\.Lock=(.*)$' }
    returns: value

  get_port_mute:
    summary: 'Get whether a crosspoint port is muted (true/false)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
    send: 'GET /V1/MEDIA/{layer}/XP/{port}.Mute'
    expect: { matches: '^p[rw] /V1/MEDIA/(?:VIDEO|AUDIO)/XP/[IO]\d+\.Mute=(.*)$' }
    returns: value

  get_switchable:
    summary: 'Get whether an input can be routed to an output now (OK or Busy)'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      input: { type: int, min: 1, required: true, label: Input, description: "Input to check, numbered from 1 as on the device." }
    send: 'GET /V1/MEDIA/VIDEO/XP/O{output}/SWITCHABLE.I{input}'
    expect: { matches: '^pr /V1/MEDIA/VIDEO/XP/O\d+/SWITCHABLE\.I\d+=(.*)$' }
    returns: value

  # Port status and names (MMX2 6.3.4, 7.6.11, 7.6.15, 7.8.9)
  get_signal_present:
    summary: 'Get whether a video or audio port has a signal (true/false)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
    send: 'GET /V1/MEDIA/{layer}/{port}.SignalPresent'
    expect: { matches: '^pr /V1/MEDIA/(?:VIDEO|AUDIO)/[IO]\d+\.SignalPresent=(.*)$' }
    returns: value

  get_port_connected:
    summary: 'Get whether a device is connected to a video port (true/false)'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
    send: 'GET /V1/MEDIA/VIDEO/{port}.Connected'
    expect: { matches: '^pr /V1/MEDIA/VIDEO/[IO]\d+\.Connected=(.*)$' }
    returns: value

  get_embedded_audio_present:
    summary: 'Get whether a video port carries embedded audio (true/false)'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
    send: 'GET /V1/MEDIA/VIDEO/{port}.EmbeddedAudioPresent'
    expect: { matches: '^pr /V1/MEDIA/VIDEO/[IO]\d+\.EmbeddedAudioPresent=(.*)$' }
    returns: value

  get_port_name:
    summary: 'Get the name of a video port'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
    send: 'GET /V1/MEDIA/VIDEO/{port}.Name'
    expect: { matches: '^p[rw] /V1/MEDIA/VIDEO/[IO]\d+\.Name=(.*)$' }
    returns: value

  set_port_name:
    summary: 'Set the name of a video port'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
      name: { type: string, pattern: '^[^\\{}#%()]*$', required: true, label: Name, description: "Port name as shown on the device; it cannot contain \\, {, }, #, %, ( or )." }
    send: 'SET /V1/MEDIA/VIDEO/{port}.Name={name}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/[IO]\d+\.Name=' }
    returns: ack

  # Video port settings (MMX2 7.6.5-7.6.17)
  set_embedded_audio_mute:
    summary: 'Mute or unmute the embedded audio of a video output'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      muted: { type: bool, required: true, label: Mute, description: "On mutes the output's embedded audio, off unmutes it." }
    send: 'SET /V1/MEDIA/VIDEO/O{output}.EmbeddedAudioMute={muted}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/O\d+\.EmbeddedAudioMute=' }
    returns: ack

  set_input_hdcp:
    summary: 'Set the HDCP capability an input reports to the source'
    params:
      input: { type: int, min: 1, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
      version: { type: enum, values: [HDCP 1.4, HDCP 2.2, 'Off'], required: true, label: HDCP, description: "HDCP capability the input reports to the source: HDCP 1.4, HDCP 2.2 or Off." }
    send: 'SET /V1/MEDIA/VIDEO/I{input}/HDCP.AllowedHdcpVersion={version}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/I\d+/HDCP\.AllowedHdcpVersion=' }
    returns: ack

  set_output_signal_type:
    summary: 'Set the signal type of a video output (Auto is HDMI)'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      signal_type: { type: enum, values: [Auto, DVI], required: true, label: Signal type, description: "Auto sends HDMI, DVI sends DVI." }
    send: 'SET /V1/MEDIA/VIDEO/O{output}.OutputSignalType={signal_type}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/O\d+\.OutputSignalType=' }
    returns: ack

  set_autoselect_policy:
    summary: 'Set the video autoselect policy of an output'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      policy: { type: enum, values: ['Off', Last detect, First detect], required: true, label: Autoselect policy, description: "Off, Last detect to switch to the input that last got a signal, or First detect to keep the first." }
    send: 'SET /V1/MEDIA/VIDEO/AUTOSELECT/O{output}.Policy={policy}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/AUTOSELECT/O\d+\.Policy=' }
    returns: ack

  set_autoselect_included:
    summary: 'Include or exclude an input from an output''s video autoselect'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      input: { type: int, min: 1, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
      included: { type: bool, required: true, label: Included, description: "On includes the input in the output's video autoselect, off excludes it." }
    send: 'SET /V1/MEDIA/VIDEO/AUTOSELECT/O{output}/I{input}.Included={included}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/AUTOSELECT/O\d+/I\d+\.Included=' }
    returns: ack

  set_autoselect_priority:
    summary: 'Set an input''s video autoselect priority for an output (1-100, equal values allowed)'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      input: { type: int, min: 1, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
      priority: { type: int, min: 1, max: 100, required: true, label: Priority, description: "Autoselect priority of the input for this output, 1 to 100; equal values are allowed." }
    send: 'SET /V1/MEDIA/VIDEO/AUTOSELECT/O{output}/I{input}.Priority={priority}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/AUTOSELECT/O\d+/I\d+\.Priority=' }
    returns: ack

  # CEC (MMX2 7.7, UCX 8.9)
  cec_send:
    summary: 'Send a CEC code (hex, e.g. 446D power on) from a video output to the sink'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      code: { type: string, pattern: '^([0-9A-Fa-f]{2})+$', required: true, label: CEC code, description: "CEC code in hex, such as 446D for power on." }
    send: 'CALL /V1/MEDIA/VIDEO/O{output}/CEC:send({code})'
    expect: { matches: '^mO /V1/MEDIA/VIDEO/O\d+/CEC:send(?:=|$)' }
    returns: ack

  cec_send_user_control_click:
    summary: 'Send a CEC remote-control key press and release (hex code) to the sink'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      code: { type: string, pattern: '^([0-9A-Fa-f]{2})+$', required: true, label: CEC key code, description: "CEC remote-control key code in hex, sent as a press and release." }
    send: 'CALL /V1/MEDIA/VIDEO/O{output}/CEC:sendUserControlClick({code})'
    expect: { matches: '^mO /V1/MEDIA/VIDEO/O\d+/CEC:sendUserControlClick(?:=|$)' }
    returns: ack

  # Audio (MMX2 7.8, UCX 8.10)
  set_audio_output_mute:
    summary: 'Mute or unmute an analog audio output (sets its volume low)'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      muted: { type: bool, required: true, label: Mute, description: "On mutes the analogue audio output by setting its volume low, off unmutes it." }
    send: 'SET /V1/MEDIA/AUDIO/O{output}.Mute={muted}'
    expect: { matches: '^pw /V1/MEDIA/AUDIO/O\d+\.Mute=' }
    returns: ack

  set_audio_output_volume_db:
    summary: 'Set an analog audio output volume in dB (0.375 dB steps, rounded by the device)'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      level: { type: float, min: -95.62, max: 0, required: true, label: Volume, description: "Volume in dB, -95.62 to 0; the device rounds to its 0.375 dB steps." }
    send: 'SET /V1/MEDIA/AUDIO/O{output}.VolumedB={level:.2f}'
    expect: { matches: '^pw /V1/MEDIA/AUDIO/O\d+\.VolumedB=' }
    returns: ack

  set_audio_output_volume_percent:
    summary: 'Set an analog audio output volume in percent'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      percent: { type: float, min: 0, max: 100, required: true, label: Volume, description: "Volume in percent, 0 to 100." }
    send: 'SET /V1/MEDIA/AUDIO/O{output}.VolumePercent={percent:.2f}'
    expect: { matches: '^pw /V1/MEDIA/AUDIO/O\d+\.VolumePercent=' }
    returns: ack

  set_audio_output_balance:
    summary: 'Set an analog audio output balance (-100 left, 0 centre, 100 right)'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      balance: { type: int, min: -100, max: 100, required: true, label: Balance, description: "Balance from -100 (left) through 0 (centre) to 100 (right)." }
    send: 'SET /V1/MEDIA/AUDIO/O{output}.Balance={balance}'
    expect: { matches: '^pw /V1/MEDIA/AUDIO/O\d+\.Balance=' }
    returns: ack

  step_audio_output_volume_db:
    summary: 'Raise or lower an analog audio output volume by a number of dB'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      step: { type: int, min: -96, max: 96, required: true, label: Step, description: "dB to add to the volume; negative lowers it." }
    send: 'CALL /V1/MEDIA/AUDIO/O{output}:stepVolumedB({step})'
    expect: { matches: '^mO /V1/MEDIA/AUDIO/O\d+:stepVolumedB(?:=|$)' }
    returns: ack

  set_audio_autoselect_policy:
    summary: 'Set an analog audio output to follow a video output, or not'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      policy: { type: enum, values: [Follow video, 'Off'], required: true, label: Autoselect policy, description: "Follow video makes the analogue output follow a video output, Off stops it." }
    send: 'SET /V1/MEDIA/AUDIO/AUTOSELECT/O{output}.Policy={policy}'
    expect: { matches: '^pw /V1/MEDIA/AUDIO/AUTOSELECT/O\d+\.Policy=' }
    returns: ack

  set_audio_follow_port:
    summary: 'Set the video output an analog audio output follows'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      video_output: { type: int, min: 1, required: true, label: Video output, description: "Video output the analogue audio output follows, numbered from 1." }
    send: 'SET /V1/MEDIA/AUDIO/AUTOSELECT/O{output}.VideoFollowPort=O{video_output}'
    expect: { matches: '^pw /V1/MEDIA/AUDIO/AUTOSELECT/O\d+\.VideoFollowPort=' }
    returns: ack

  # USB crosspoint (UCX 8.11)
  switch_usb:
    summary: 'Connect a USB host (U<n>) to the USB hub H1'
    params:
      host: { type: int, min: 1, max: 4, required: true, label: USB host, description: "USB host port U1 to U4 to connect to the hub, numbered from 1." }
    send: 'CALL /V1/MEDIA/USB/XP:switch(U{host}:H1)'
    expect: { matches: '^mO /V1/MEDIA/USB/XP:switch(?:=|$)' }
    returns: ack

  disconnect_usb:
    summary: 'Disconnect the USB hub H1 from every host'
    send: 'CALL /V1/MEDIA/USB/XP:switch(0:H1)'
    expect: { matches: '^mO /V1/MEDIA/USB/XP:switch(?:=|$)' }
    returns: ack

  get_usb_source:
    summary: 'Get the USB host connected to the hub H1 (U<n>)'
    send: 'GET /V1/MEDIA/USB/XP/H1.ConnectedSource'
    expect: { matches: '^p[rw] /V1/MEDIA/USB/XP/H1\.ConnectedSource=(.*)$' }
    returns: value

  set_usb_port_lock:
    summary: 'Lock or unlock a USB port (U<n> host or H1 hub)'
    params:
      port: { type: string, pattern: '^(U[1-4]|H1)$', required: true, label: USB port, description: "U1 to U4 for a host port, or H1 for the hub." }
      locked: { type: bool, required: true, label: Lock, description: "On locks it, off unlocks it." }
    send: 'SET /V1/MEDIA/USB/XP/{port}.Lock={locked}'
    expect: { matches: '^pw /V1/MEDIA/USB/XP/[UH]\d+\.Lock=' }
    returns: ack

  # EDID (MMX2 7.9, UCX 8.13)
  get_edid_status:
    summary: 'Get the EDID emulated on each input, as <source>:E<n> pairs'
    send: 'GET /V1/EDID.EdidStatus'
    expect: { matches: '^pr /V1/EDID\.EdidStatus=(.*)$' }
    returns: value

  edid_switch:
    summary: 'Emulate an EDID (F<n> factory, U<n> user, D<n> dynamic) on an input'
    params:
      source: { type: string, pattern: '^[FUD][1-9][0-9]{0,2}$', required: true, label: EDID, description: "EDID to emulate: F followed by a factory EDID number, U a user slot, D a dynamic EDID, such as F49." }
      input: { type: int, min: 1, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'CALL /V1/EDID:switch({source}:E{input})'
    expect: { matches: '^mO /V1/EDID:switch(?:=|$)' }
    returns: ack

  edid_switch_all:
    summary: 'Emulate an EDID on every input'
    params:
      source: { type: string, pattern: '^[FUD][1-9][0-9]{0,2}$', required: true, label: EDID, description: "EDID to emulate: F followed by a factory EDID number, U a user slot, D a dynamic EDID, such as F49." }
    send: 'CALL /V1/EDID:switchAll({source})'
    expect: { matches: '^mO /V1/EDID:switchAll(?:=|$)' }
    returns: ack

  edid_copy:
    summary: 'Copy an EDID into a user EDID slot (overwritten without warning)'
    params:
      source: { type: string, pattern: '^[FUD][1-9][0-9]{0,2}$', required: true, label: EDID, description: "EDID to emulate: F followed by a factory EDID number, U a user slot, D a dynamic EDID, such as F49." }
      slot: { type: int, min: 1, max: 100, required: true, label: User EDID slot, description: "User EDID slot to copy into, numbered from 1; its EDID is overwritten without warning." }
    send: 'CALL /V1/EDID:copy({source}:U{slot})'
    expect: { matches: '^mO /V1/EDID:copy(?:=|$)' }
    returns: ack

  edid_delete:
    summary: 'Delete a user EDID'
    params:
      slot: { type: int, min: 1, max: 100, required: true, label: User EDID slot, description: "User EDID slot to delete, numbered from 1." }
    send: 'CALL /V1/EDID:delete(U{slot})'
    expect: { matches: '^mO /V1/EDID:delete(?:=|$)' }
    returns: ack

  edid_reset:
    summary: 'Switch every emulated EDID back to the factory default'
    send: 'CALL /V1/EDID:reset()'
    expect: { matches: '^mO /V1/EDID:reset(?:=|$)' }
    returns: ack

  # ── MX2 tree (/MEDIA/XP/VIDEO) ───────────────────────────────────────────
  # System (MX2 9.4); the label is shared with UMX
  get_device_label_uid:
    summary: 'Get the device label'
    send: 'GET /MANAGEMENT/UID.DeviceLabel'
    expect: { matches: '^p[rw] /MANAGEMENT/UID\.DeviceLabel=(.*)$' }
    returns: value

  set_device_label_uid:
    summary: 'Set the device label (MX2 up to 32, UMX up to 39 ASCII characters; longer is truncated)'
    params:
      label: { type: string, max_length: 39, pattern: '^[ -~]*$', required: true, label: Device label, description: "Device label in printable ASCII; an MX2 keeps 32 characters and a UMX 39, truncating the rest." }
    send: 'SET /MANAGEMENT/UID.DeviceLabel={label}'
    expect: { matches: '^pw /MANAGEMENT/UID\.DeviceLabel=' }
    returns: ack

  factory_defaults_legacy:
    summary: 'Restore the factory default settings and restart'
    send: 'CALL /SYS:factoryDefaults()'
    expect: { matches: '^mO /SYS:factoryDefaults(?:=|$)' }
    returns: ack

  mx2_soft_reset:
    summary: 'Restart the matrix; connections are dropped'
    send: 'CALL /SYS:softReset()'
    expect: { matches: '^mO /SYS:softReset(?:=|$)' }
    returns: ack

  mx2_get_power_mode:
    summary: 'Get the operation mode (NORMAL or STANDBY)'
    send: 'GET /MANAGEMENT/POWER.Operation'
    expect: { matches: '^pr /MANAGEMENT/POWER\.Operation=(.*)$' }
    returns: value

  mx2_standby:
    summary: 'Switch to standby: video transmission and LCD off, remote control stays'
    send: 'CALL /MANAGEMENT/POWER:standby()'
    expect: { matches: '^mO /MANAGEMENT/POWER:standby(?:=|$)' }
    returns: ack

  mx2_wake_up:
    summary: 'Return from standby to normal operation'
    send: 'CALL /MANAGEMENT/POWER:wakeUp()'
    expect: { matches: '^mO /MANAGEMENT/POWER:wakeUp(?:=|$)' }
    returns: ack

  # Crosspoint (MX2 9.5, 9.6.2-9.6.6, 9.11.1-9.11.5)
  mx2_switch:
    summary: 'Route an input to an output'
    params:
      input: { type: int, min: 1, max: 48, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
      output: { type: int, min: 1, max: 48, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/XP/VIDEO:switch(I{input}:O{output})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:switch(?:=|$)' }
    returns: ack

  mx2_disconnect:
    summary: 'Disconnect an output (route input 0)'
    params:
      output: { type: int, min: 1, max: 48, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/XP/VIDEO:switch(0:O{output})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:switch(?:=|$)' }
    returns: ack

  mx2_switch_all:
    summary: 'Route an input to every output'
    params:
      input: { type: int, min: 1, max: 48, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/XP/VIDEO:switchAll(I{input})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:switchAll(?:=|$)' }
    returns: ack

  mx2_disconnect_all:
    summary: 'Disconnect every output'
    send: 'CALL /MEDIA/XP/VIDEO:switchAll(0)'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:switchAll(?:=|$)' }
    returns: ack

  mx2_switch_multi:
    summary: 'Set several outputs at once: the source of each output in order, semicolon-separated (I<n>, 0, or empty to leave it)'
    params:
      sources: { type: string, pattern: '^((I[1-9][0-9]?|0)?;){0,47}(I[1-9][0-9]?|0)?$', required: true, label: Sources, description: "Source of each output in order, separated by ;: I followed by an input number, 0 to disconnect, or empty to leave it." }
    send: 'CALL /MEDIA/XP/VIDEO:switchMulti({sources})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:switchMulti(?:=|$)' }
    returns: ack

  mx2_mute_input:
    summary: 'Mute an input'
    params:
      input: { type: int, min: 1, max: 48, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/XP/VIDEO:muteSource(I{input})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:muteSource(?:=|$)' }
    returns: ack

  mx2_unmute_input:
    summary: 'Unmute an input'
    params:
      input: { type: int, min: 1, max: 48, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/XP/VIDEO:unmuteSource(I{input})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:unmuteSource(?:=|$)' }
    returns: ack

  mx2_lock_input:
    summary: 'Lock an input'
    params:
      input: { type: int, min: 1, max: 48, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/XP/VIDEO:lockSource(I{input})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:lockSource(?:=|$)' }
    returns: ack

  mx2_unlock_input:
    summary: 'Unlock an input'
    params:
      input: { type: int, min: 1, max: 48, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/XP/VIDEO:unlockSource(I{input})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:unlockSource(?:=|$)' }
    returns: ack

  mx2_mute_output:
    summary: 'Mute an output; the route is kept and restored on unmute'
    params:
      output: { type: int, min: 1, max: 48, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/XP/VIDEO:muteDestination(O{output})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:muteDestination(?:=|$)' }
    returns: ack

  mx2_unmute_output:
    summary: 'Unmute an output'
    params:
      output: { type: int, min: 1, max: 48, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/XP/VIDEO:unmuteDestination(O{output})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:unmuteDestination(?:=|$)' }
    returns: ack

  mx2_lock_output:
    summary: 'Lock an output so its route cannot change'
    params:
      output: { type: int, min: 1, max: 48, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/XP/VIDEO:lockDestination(O{output})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:lockDestination(?:=|$)' }
    returns: ack

  mx2_unlock_output:
    summary: 'Unlock an output'
    params:
      output: { type: int, min: 1, max: 48, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/XP/VIDEO:unlockDestination(O{output})'
    expect: { matches: '^mO /MEDIA/XP/VIDEO:unlockDestination(?:=|$)' }
    returns: ack

  mx2_get_connections:
    summary: 'Get every output''s source, semicolon-separated in output order (I<n> or 0)'
    send: 'GET /MEDIA/XP/VIDEO.DestinationConnectionStatus'
    expect: { matches: '^pr /MEDIA/XP/VIDEO\.DestinationConnectionStatus=(.*)$' }
    returns: value

  mx2_get_input_status:
    summary: 'Get every input''s status (lock/mute letter and status byte), semicolon-separated'
    send: 'GET /MEDIA/XP/VIDEO.SourcePortStatus'
    expect: { matches: '^pr /MEDIA/XP/VIDEO\.SourcePortStatus=(.*)$' }
    returns: value

  mx2_get_output_status:
    summary: 'Get every output''s status (lock/mute letter and status byte), semicolon-separated'
    send: 'GET /MEDIA/XP/VIDEO.DestinationPortStatus'
    expect: { matches: '^pr /MEDIA/XP/VIDEO\.DestinationPortStatus=(.*)$' }
    returns: value

  # Presets (MX2 9.16)
  mx2_create_preset:
    summary: 'Store the current crosspoint and mute states as a new named preset'
    params:
      name: { type: string, max_length: 16, pattern: '^[A-Za-z0-9_-]+$', required: true, label: Preset, description: "Name for the new preset, up to 16 letters, digits, _ or -." }
    send: 'CALL /MEDIA/PRESET:create({name},VIDEO)'
    expect: { matches: '^mO /MEDIA/PRESET:create(?:=|$)' }
    returns: ack

  mx2_load_preset:
    summary: 'Load a named preset (every port except locked ones)'
    params:
      name: { type: string, max_length: 16, pattern: '^[A-Za-z0-9_-]+$', required: true, label: Preset, description: "Name of the preset to load; locked ports are left as they are." }
    send: 'CALL /MEDIA/PRESET/{name}:load()'
    expect: { matches: '^mO /MEDIA/PRESET/[A-Za-z0-9_-]+:load(?:=|$)' }
    returns: ack

  mx2_rename_preset:
    summary: 'Rename a preset'
    params:
      name: { type: string, max_length: 16, pattern: '^[A-Za-z0-9_-]+$', required: true, label: Preset, description: "Current preset name." }
      new_name: { type: string, max_length: 16, pattern: '^[A-Za-z0-9_-]+$', required: true, label: New name, description: "New preset name, up to 16 letters, digits, _ or -." }
    send: 'CALL /MEDIA/PRESET:rename({name},{new_name})'
    expect: { matches: '^mO /MEDIA/PRESET:rename(?:=|$)' }
    returns: ack

  # Port settings (MX2 9.6-9.15)
  mx2_set_input_hdcp:
    summary: 'Set an input''s HDCP: 0 off, 1 HDCP 1.4, 2 HDCP 2.3, 3 any version converted up to 2.3'
    params:
      input: { type: int, min: 1, max: 48, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
      version: { type: int, min: 0, max: 3, required: true, label: HDCP, description: "0 off, 1 HDCP 1.4, 2 HDCP 2.3, 3 any version converted up to 2.3." }
    send: 'SET /MEDIA/PORTS/VIDEO/I{input}/SETTINGS.HdcpVersion={version}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/I\d+/SETTINGS\.HdcpVersion=' }
    returns: ack

  mx2_set_output_hdcp_mode:
    summary: 'Set an output''s HDCP mode: AUTO follows the input, ALWAYS encrypts'
    params:
      output: { type: int, min: 1, max: 48, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      mode: { type: enum, values: [AUTO, ALWAYS], required: true, label: HDCP mode, description: "AUTO follows the input, ALWAYS always encrypts." }
    send: 'SET /MEDIA/PORTS/VIDEO/O{output}/SETTINGS.HdcpMode={mode}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/O\d+/SETTINGS\.HdcpMode=' }
    returns: ack

  mx2_set_output_signal_type:
    summary: 'Force an output''s signal type (AUTO: HDMI when audio is present)'
    params:
      output: { type: int, min: 1, max: 48, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      signal_type: { type: enum, values: [DVI, HDMI, AUTO], required: true, label: Signal type, description: "DVI, HDMI, or AUTO for HDMI when audio is present." }
    send: 'SET /MEDIA/PORTS/VIDEO/O{output}/SETTINGS.ForcedSignalType={signal_type}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/O\d+/SETTINGS\.ForcedSignalType=' }
    returns: ack

  mx2_set_output_conversion:
    summary: 'Set an output''s colour conversion (LEFT/RIGHT split a 4K60 4:4:4 picture across two outputs)'
    params:
      output: { type: int, min: 1, max: 48, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      conversion: { type: enum, values: ['OFF', '420', '422', LEFT, RIGHT], required: true, label: Colour conversion, description: "OFF, 420 or 422 chroma conversion, or LEFT or RIGHT to split a 4K60 4:4:4 picture across two outputs." }
    send: 'SET /MEDIA/PORTS/VIDEO/O{output}/SETTINGS.Conversion={conversion}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/O\d+/SETTINGS\.Conversion=' }
    returns: ack

  mx2_set_embedded_audio_mode:
    summary: 'Set the audio embedded in a video port: OFF, HDMI (original) or ANALOG (-A/-Audio models)'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
      mode: { type: enum, values: ['OFF', HDMI, ANALOG], required: true, label: Embedded audio, description: "OFF, HDMI for the original audio, or ANALOG for the analogue audio (-A/-Audio models)." }
    send: 'SET /MEDIA/PORTS/VIDEO/{port}/EMBEDDEDAUDIO.AudioMode={mode}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/[IO]\d+/EMBEDDEDAUDIO\.AudioMode=' }
    returns: ack

  mx2_set_analog_output_mode:
    summary: 'Set where an output''s audio goes (-A/-Audio models): OFF, HDMI, ANALOG or HDMI+ANALOG'
    params:
      output: { type: int, min: 1, max: 48, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      mode: { type: enum, values: ['OFF', HDMI, ANALOG, HDMI+ANALOG], required: true, label: Audio routing, description: "Where the output's audio goes: OFF, HDMI, ANALOG or HDMI+ANALOG." }
    send: 'SET /MEDIA/PORTS/VIDEO/O{output}/ANALOGAUDIO.AudioMode={mode}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/O\d+/ANALOGAUDIO\.AudioMode=' }
    returns: ack

  mx2_set_analog_output_volume_db:
    summary: 'Set an analog audio output volume in dB (-A/-Audio models)'
    params:
      output: { type: int, min: 1, max: 48, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      level: { type: float, min: -95.62, max: 0, required: true, label: Volume, description: "Volume in dB, -95.62 to 0; the device rounds to its 0.375 dB steps." }
    send: 'SET /MEDIA/PORTS/VIDEO/O{output}/ANALOGAUDIO.VolumedB={level:.2f}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/O\d+/ANALOGAUDIO\.VolumedB=' }
    returns: ack

  mx2_set_analog_mute:
    summary: 'Mute or unmute the analog audio of a port (-A/-Audio models)'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
      muted: { type: bool, required: true, label: Mute, description: "On mutes the port's analogue audio, off unmutes it." }
    send: 'SET /MEDIA/PORTS/VIDEO/{port}/ANALOGAUDIO.Mute={muted}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/[IO]\d+/ANALOGAUDIO\.Mute=' }
    returns: ack

  mx2_set_analog_balance:
    summary: 'Set the analog audio balance of a port (-100 left, 0 centre, 100 right)'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
      balance: { type: int, min: -100, max: 100, required: true, label: Balance, description: "Balance from -100 (left) through 0 (centre) to 100 (right)." }
    send: 'SET /MEDIA/PORTS/VIDEO/{port}/ANALOGAUDIO.Balance={balance}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/[IO]\d+/ANALOGAUDIO\.Balance=' }
    returns: ack

  mx2_set_analog_input_gain:
    summary: 'Set an analog audio input gain in dB (rounded by the device)'
    params:
      input: { type: int, min: 1, max: 48, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
      gain: { type: int, min: -12, max: 35, required: true, label: Gain, description: "Analogue input gain in dB, -12 to 35; the device rounds it." }
    send: 'SET /MEDIA/PORTS/VIDEO/I{input}/ANALOGAUDIO.Gain={gain}'
    expect: { matches: '^pw /MEDIA/PORTS/VIDEO/I\d+/ANALOGAUDIO\.Gain=' }
    returns: ack

  mx2_cec_send:
    summary: 'Send a named CEC command from an HDMI port to the connected device'
    params:
      port: { type: string, pattern: '^[IO][1-9][0-9]?$', required: true, label: Port, description: "Port as I followed by the input number or O followed by the output number, such as I1 or O2." }
      command: { type: enum, values: [image_view_on, standby, ok, back, up, down, left, right, root_menu, setup_menu, contents_menu, favorite_menu, media_top_menu, media_context_menu, number_0, number_1, number_2, number_3, number_4, number_5, number_6, number_7, number_8, number_9, dot, enter, clear, channel_up, channel_down, sound_select, input_select, display_info, power_legacy, page_up, page_down, volume_up, volume_down, mute_toggle, mute, unmute, play, stop, pause, record, rewind, fast_forward, eject, skip_forward, skip_backward, 3d_mode, stop_record, pause_record, play_forward, play_reverse, select_next_media, select_media_1, select_media_2, select_media_3, select_media_4, select_media_5, power_toggle, power_on, power_off, stop_function, f1, f2, f3, f4, set_osd], required: true, label: CEC command, description: "Named CEC command to send to the connected device, such as power_on, standby or volume_up." }
    send: 'CALL /MEDIA/PORTS/VIDEO/{port}/CEC:send({command})'
    expect: { matches: '^mO /MEDIA/PORTS/VIDEO/[IO]\d+/CEC:send(?:=|$)' }
    returns: ack

  # EDID (MX2 9.18)
  mx2_get_edid_status:
    summary: 'Get the EDID emulated on each input, semicolon-separated in input order'
    send: 'GET /EDID.EdidStatus'
    expect: { matches: '^pr /EDID\.EdidStatus=(.*)$' }
    returns: value

  mx2_edid_switch:
    summary: 'Emulate an EDID (F<n> factory, U<n> user, D<n> dynamic) on an input'
    params:
      source: { type: string, pattern: '^[FUD][1-9][0-9]{0,2}$', required: true, label: EDID, description: "EDID to emulate: F followed by a factory EDID number, U a user slot, D a dynamic EDID, such as F49." }
      input: { type: int, min: 1, max: 48, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'CALL /EDID:switch({source}:E{input})'
    expect: { matches: '^mO /EDID:switch(?:=|$)' }
    returns: ack

  mx2_edid_copy:
    summary: 'Copy an EDID into a user EDID slot (overwritten without warning)'
    params:
      source: { type: string, pattern: '^[FUD][1-9][0-9]{0,2}$', required: true, label: EDID, description: "EDID to emulate: F followed by a factory EDID number, U a user slot, D a dynamic EDID, such as F49." }
      slot: { type: int, min: 1, max: 100, required: true, label: User EDID slot, description: "User EDID slot to copy into, numbered from 1; its EDID is overwritten without warning." }
    send: 'CALL /EDID:copy({source}:U{slot})'
    expect: { matches: '^mO /EDID:copy(?:=|$)' }
    returns: ack

  # ── UMX tree (/MEDIA/VIDEO/XP, /MEDIA/AUDIO/XP) ──────────────────────────
  umx_get_firmware_version:
    summary: 'Get the CPU firmware version'
    send: 'GET /SYS/MB.FirmwareVersion'
    expect: { matches: '^pr /SYS/MB\.FirmwareVersion=(.*)$' }
    returns: value

  umx_get_package_version:
    summary: 'Get the installed firmware package version (FW package 1.3.0b5 and later)'
    send: 'GET /MANAGEMENT/UID.PackageVersion'
    expect: { matches: '^pr /MANAGEMENT/UID\.PackageVersion=(.*)$' }
    returns: value

  umx_reset:
    summary: 'Restart the device; connections are dropped'
    send: 'CALL /SYS:reset()'
    expect: { matches: '^mO /SYS:reset(?:=|$)' }
    returns: ack

  umx_identify:
    summary: 'Blink the status LEDs for 10 seconds'
    send: 'CALL /MANAGEMENT/UI:identifyMe()'
    expect: { matches: '^mO /MANAGEMENT/UI:identifyMe(?:=|$)' }
    returns: ack

  umx_set_control_lock:
    summary: 'Front panel lock: 0 none, 1 locked (unlockable by buttons), 2 force locked'
    params:
      mode: { type: int, min: 0, max: 2, required: true, label: Front panel lock, description: "0 none, 1 locked but unlockable from the buttons, 2 force locked." }
    send: 'SET /MANAGEMENT/UI.ControlLock={mode}'
    expect: { matches: '^pw /MANAGEMENT/UI\.ControlLock=' }
    returns: ack

  umx_run_macro:
    summary: 'Run a macro stored in the device (UMX-HDMI-140-Plus)'
    params:
      name: { type: string, pattern: '^[^\\{}#%()]*$', required: true, label: Macro, description: "Name of the macro stored in the device." }
    send: 'CALL /CTRL/MACROS:run({name})'
    expect: { matches: '^mO /CTRL/MACROS:run(?:=|$)' }
    returns: ack

  umx_logout:
    summary: 'Log out (Cleartext login); the tree is protected again'
    send: 'CALL /LOGIN:logout({settings.password})'
    expect: { matches: '^mO /LOGIN:logout(?:=|$)' }
    returns: ack

  umx_switch:
    summary: 'Route an input to the output on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      input: { type: int, min: 1, max: 6, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
      output: { type: int, min: 1, max: 1, default: 1, label: Output, description: "The output, which is 1 on this model." }
    send: 'CALL /MEDIA/{layer}/XP:switch(I{input}:O{output})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:switch(?:=|$)' }
    returns: ack

  umx_mute_input:
    summary: 'Mute an input on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      input: { type: int, min: 1, max: 6, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/{layer}/XP:muteSource(I{input})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:muteSource(?:=|$)' }
    returns: ack

  umx_unmute_input:
    summary: 'Unmute an input on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      input: { type: int, min: 1, max: 6, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/{layer}/XP:unmuteSource(I{input})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:unmuteSource(?:=|$)' }
    returns: ack

  umx_lock_input:
    summary: 'Lock an input on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      input: { type: int, min: 1, max: 6, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/{layer}/XP:lockSource(I{input})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:lockSource(?:=|$)' }
    returns: ack

  umx_unlock_input:
    summary: 'Unlock an input on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      input: { type: int, min: 1, max: 6, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'CALL /MEDIA/{layer}/XP:unlockSource(I{input})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:unlockSource(?:=|$)' }
    returns: ack

  umx_mute_output:
    summary: 'Mute the output; the route is kept on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      output: { type: int, min: 1, max: 1, default: 1, label: Output, description: "The output, which is 1 on this model." }
    send: 'CALL /MEDIA/{layer}/XP:muteDestination(O{output})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:muteDestination(?:=|$)' }
    returns: ack

  umx_unmute_output:
    summary: 'Unmute the output on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      output: { type: int, min: 1, max: 1, default: 1, label: Output, description: "The output, which is 1 on this model." }
    send: 'CALL /MEDIA/{layer}/XP:unmuteDestination(O{output})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:unmuteDestination(?:=|$)' }
    returns: ack

  umx_lock_output:
    summary: 'Lock the output so its route cannot change on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      output: { type: int, min: 1, max: 1, default: 1, label: Output, description: "The output, which is 1 on this model." }
    send: 'CALL /MEDIA/{layer}/XP:lockDestination(O{output})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:lockDestination(?:=|$)' }
    returns: ack

  umx_unlock_output:
    summary: 'Unlock the output on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      output: { type: int, min: 1, max: 1, default: 1, label: Output, description: "The output, which is 1 on this model." }
    send: 'CALL /MEDIA/{layer}/XP:unlockDestination(O{output})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP:unlockDestination(?:=|$)' }
    returns: ack

  umx_get_connection:
    summary: 'Get the input routed to the output on the video or audio crosspoint'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
    send: 'GET /MEDIA/{layer}/XP.DestinationConnectionList'
    expect: { matches: '^pr /MEDIA/(?:VIDEO|AUDIO)/XP\.DestinationConnectionList=(.*)$' }
    returns: value

  umx_get_input_status:
    summary: 'Get every input''s status (lock/mute letter and two status bytes), semicolon-separated'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
    send: 'GET /MEDIA/{layer}/XP.SourcePortStatus'
    expect: { matches: '^pr /MEDIA/(?:VIDEO|AUDIO)/XP\.SourcePortStatus=(.*)$' }
    returns: value

  umx_get_output_status:
    summary: 'Get the output''s status (lock/mute letter and two status bytes)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
    send: 'GET /MEDIA/{layer}/XP.DestinationPortStatus'
    expect: { matches: '^pr /MEDIA/(?:VIDEO|AUDIO)/XP\.DestinationPortStatus=(.*)$' }
    returns: value

  umx_set_autoselect:
    summary: 'Set the autoselect of the output: E or D (enabled/disabled), optionally followed by F, P or L (first, priority, last detect; S static for audio)'
    params:
      layer: { type: enum, values: [VIDEO, AUDIO], required: true, label: Crosspoint, description: "VIDEO or AUDIO crosspoint." }
      output: { type: int, min: 1, max: 1, default: 1, label: Output, description: "The output, which is 1 on this model." }
      setting: { type: string, pattern: '^[ED][FPLS]?$', required: true, label: Autoselect, description: "E enabled or D disabled, optionally followed by F first detect, P priority, L last detect, or S static for audio." }
    send: 'CALL /MEDIA/{layer}/XP:setDestinationPortAutoselect(O{output}:{setting})'
    expect: { matches: '^mO /MEDIA/(?:VIDEO|AUDIO)/XP[:.]setDestinationPortAutoselect(?:=|$)' }
    returns: ack

  umx_set_input_hdcp:
    summary: 'Enable or disable HDCP on a digital video input (I2-I4)'
    params:
      input: { type: int, min: 2, max: 4, required: true, label: Input, description: "Digital video input I2 to I4, by its number." }
      enabled: { type: bool, required: true, label: HDCP, description: "On enables HDCP on the input, off disables it." }
    send: 'SET /MEDIA/VIDEO/I{input}.HdcpEnable={enabled}'
    expect: { matches: '^pw /MEDIA/VIDEO/I\d+\.HdcpEnable=' }
    returns: ack

  umx_set_output_hdcp_mode:
    summary: 'Set the output HDCP mode: 0 auto, 1 always'
    params:
      mode: { type: int, min: 0, max: 1, required: true, label: HDCP mode, description: "0 auto, 1 always." }
    send: 'SET /MEDIA/VIDEO/O1.HdcpModeSetting={mode}'
    expect: { matches: '^pw /MEDIA/VIDEO/O1\.HdcpModeSetting=' }
    returns: ack

  umx_set_test_pattern_mode:
    summary: 'Set an input''s test pattern: 0 off, 1 on, 2 when the input has no signal'
    params:
      input: { type: int, min: 1, max: 6, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
      mode: { type: int, min: 0, max: 2, required: true, label: Test pattern, description: "0 off, 1 on, 2 only when the input has no signal." }
    send: 'SET /MEDIA/VIDEO/I{input}.FreeRunMode={mode}'
    expect: { matches: '^pw /MEDIA/VIDEO/I\d+\.FreeRunMode=' }
    returns: ack

  umx_set_hdmi_mode:
    summary: 'Set the output HDMI mode: 0 auto, 1 DVI, 2 HDMI 24-bit, 3 HDMI 30-bit, 4 HDMI 36-bit'
    params:
      mode: { type: int, min: 0, max: 4, required: true, label: HDMI mode, description: "0 auto, 1 DVI, 2 HDMI 24-bit, 3 HDMI 30-bit, 4 HDMI 36-bit." }
    send: 'SET /MEDIA/VIDEO/O1.HdmiModeSetting={mode}'
    expect: { matches: '^pw /MEDIA/VIDEO/O1\.HdmiModeSetting=' }
    returns: ack

  umx_set_color_space:
    summary: 'Set the output colour space: 0 auto, 1 RGB, 2 YCbCr 4:4:4, 3 YCbCr 4:2:2'
    params:
      mode: { type: int, min: 0, max: 3, required: true, label: Colour space, description: "0 auto, 1 RGB, 2 YCbCr 4:4:4, 3 YCbCr 4:2:2." }
    send: 'SET /MEDIA/VIDEO/O1.ColorSpaceSetting={mode}'
    expect: { matches: '^pw /MEDIA/VIDEO/O1\.ColorSpaceSetting=' }
    returns: ack

  umx_set_audio_input_volume:
    summary: 'Set an analog audio input volume in dB (0.375 dB steps, rounded by the device)'
    params:
      input: { type: int, min: 1, max: 5, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
      level: { type: float, min: -95.625, max: 0, required: true, label: Volume, description: "Volume in dB, -95.625 to 0; the device rounds to its 0.375 dB steps." }
    send: 'SET /MEDIA/AUDIO/I{input}.Volume={level:.3f}'
    expect: { matches: '^pw /MEDIA/AUDIO/I\d+\.Volume=' }
    returns: ack

  umx_set_audio_input_balance:
    summary: 'Set an analog audio input balance (0 left, 50 centre, 100 right)'
    params:
      input: { type: int, min: 1, max: 5, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
      balance: { type: int, min: 0, max: 100, required: true, label: Balance, description: "Balance from 0 (left) through 50 (centre) to 100 (right)." }
    send: 'SET /MEDIA/AUDIO/I{input}.Balance={balance}'
    expect: { matches: '^pw /MEDIA/AUDIO/I\d+\.Balance=' }
    returns: ack

  # ── Full control: GPIO, serial, network, Event Manager, variables, message
  # sending, EDID and other settings, per tree (see the sources and quirks) ──
  set_gpio_direction:
    summary: 'Set a GPIO pin to input or output (UCX 8.19, MMX2 7.14)'
    params:
      port: { type: int, min: 1, max: 6, required: true, label: GPIO pin, description: "GPIO pin P1 to P6, by its number." }
      direction: { type: enum, values: [Input, Output], required: true, label: Direction, description: "Input or Output." }
    send: 'SET /V1/MEDIA/GPIO/P{port}.Direction={direction}'
    expect: { matches: '^pw /V1/MEDIA/GPIO/P\d+\.Direction=' }
    returns: ack

  set_gpio_output:
    summary: 'Set a GPIO output pin high or low'
    params:
      port: { type: int, min: 1, max: 6, required: true, label: GPIO pin, description: "GPIO pin P1 to P6, by its number." }
      level: { type: enum, values: [High, Low], required: true, label: Level, description: "High or Low." }
    send: 'SET /V1/MEDIA/GPIO/P{port}.Output={level}'
    expect: { matches: '^pw /V1/MEDIA/GPIO/P\d+\.Output=' }
    returns: ack

  gpio_interval:
    summary: 'Hold a GPIO output pin at a level for a number of seconds, then return it'
    params:
      port: { type: int, min: 1, max: 6, required: true, label: GPIO pin, description: "GPIO pin P1 to P6, by its number." }
      level: { type: enum, values: [High, Low], required: true, label: Level, description: "High or Low for the interval." }
      seconds: { type: int, min: 1, max: 120, required: true, label: Seconds, description: "How long to hold the level, 1 to 120 seconds." }
    send: 'CALL /V1/MEDIA/GPIO/P{port}:interval({level};{seconds})'
    expect: { matches: '^mO /V1/MEDIA/GPIO/P\d+:interval(?:=|$)' }
    returns: ack

  gpio_toggle:
    summary: 'Toggle a GPIO output pin'
    params:
      port: { type: int, min: 1, max: 6, required: true, label: GPIO pin, description: "GPIO pin P1 to P6, by its number." }
    send: 'CALL /V1/MEDIA/GPIO/P{port}:toggle()'
    expect: { matches: '^mO /V1/MEDIA/GPIO/P\d+:toggle(?:=|$)' }
    returns: ack

  set_ocs_sensor_type:
    summary: 'Set whether the occupancy sensor input is active low or active high (UCX 8.20, MMX2 7.15)'
    params:
      sensor_type: { type: enum, values: [Active high, Active low], required: true, label: Sensor type, description: "Active high (the default) or Active low." }
    send: 'SET /V1/MEDIA/OCS/P1.SensorType={sensor_type}'
    expect: { matches: '^pw /V1/MEDIA/OCS/P1\.SensorType=' }
    returns: ack

  set_serial_baudrate:
    summary: 'Set a serial port baud rate (UCX 8.17, MMX2 7.12)'
    params:
      port: { type: int, min: 1, max: 2, required: true, label: Serial port, description: "Serial port P1 or P2 by its number; 2x1 models have only P1." }
      baud: { type: enum, values: ['9600', '19200', '38400', '57600', '115200'], required: true, label: Baud rate, description: "Baud rate of the port." }
    send: 'SET /V1/MEDIA/SERIAL/P{port}.Baudrate={baud}'
    expect: { matches: '^pw /V1/MEDIA/SERIAL/P\d+\.Baudrate=' }
    returns: ack

  set_serial_stop_bits:
    summary: 'Set a serial port stop bits'
    params:
      port: { type: int, min: 1, max: 2, required: true, label: Serial port, description: "Serial port P1 or P2 by its number; 2x1 models have only P1." }
      stop_bits: { type: enum, values: ['1', '2'], required: true, label: Stop bits, description: "1 or 2 stop bits." }
    send: 'SET /V1/MEDIA/SERIAL/P{port}.StopBits={stop_bits}'
    expect: { matches: '^pw /V1/MEDIA/SERIAL/P\d+\.StopBits=' }
    returns: ack

  set_serial_parity:
    summary: 'Set a serial port parity'
    params:
      port: { type: int, min: 1, max: 2, required: true, label: Serial port, description: "Serial port P1 or P2 by its number; 2x1 models have only P1." }
      parity: { type: enum, values: [None, Odd, Even], required: true, label: Parity, description: "None, Odd or Even." }
    send: 'SET /V1/MEDIA/SERIAL/P{port}.Parity={parity}'
    expect: { matches: '^pw /V1/MEDIA/SERIAL/P\d+\.Parity=' }
    returns: ack

  set_network_dhcp:
    summary: 'Enable or disable DHCP; applied by apply_network_settings (UCX 8.14, MMX2 7.10)'
    params:
      enabled: { type: bool, required: true, label: DHCP, description: "On takes the address from DHCP, off uses the static address." }
    send: 'SET /V1/MANAGEMENT/NETWORK.DhcpEnabled={enabled}'
    expect: { matches: '^pw /V1/MANAGEMENT/NETWORK\.DhcpEnabled=' }
    returns: ack

  set_network_static_address:
    summary: 'Set the static IP address; applied by apply_network_settings'
    params:
      address: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: IP address, description: "IPv4 address, such as 192.168.0.20." }
    send: 'SET /V1/MANAGEMENT/NETWORK.StaticIpAddress={address}'
    expect: { matches: '^pw /V1/MANAGEMENT/NETWORK\.StaticIpAddress=' }
    returns: ack

  set_network_static_netmask:
    summary: 'Set the static network mask; applied by apply_network_settings'
    params:
      netmask: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: Network mask, description: "IPv4 network mask, such as 255.255.255.0." }
    send: 'SET /V1/MANAGEMENT/NETWORK.StaticNetworkMask={netmask}'
    expect: { matches: '^pw /V1/MANAGEMENT/NETWORK\.StaticNetworkMask=' }
    returns: ack

  set_network_static_gateway:
    summary: 'Set the static gateway; applied by apply_network_settings'
    params:
      gateway: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: Gateway, description: "IPv4 gateway address, such as 192.168.0.1." }
    send: 'SET /V1/MANAGEMENT/NETWORK.StaticGatewayAddress={gateway}'
    expect: { matches: '^pw /V1/MANAGEMENT/NETWORK\.StaticGatewayAddress=' }
    returns: ack

  set_hostname:
    summary: 'Set the host name (1-64 letters, digits and hyphens); HTTP(S) restarts with a new certificate'
    params:
      hostname: { type: string, pattern: '^[A-Za-z0-9]([A-Za-z0-9-]{0,62}[A-Za-z0-9])?$', required: true, label: Host name, description: "Host name of 1 to 64 letters, digits and hyphens, not ending with a hyphen." }
    send: 'SET /V1/MANAGEMENT/NETWORK.HostName={hostname}'
    expect: { matches: '^pw /V1/MANAGEMENT/NETWORK\.HostName=' }
    returns: ack

  apply_network_settings:
    summary: 'Save and apply the network settings; the device reboots and the connection drops'
    send: 'CALL /V1/MANAGEMENT/NETWORK:applySettings()'
    expect: { matches: '^mO /V1/MANAGEMENT/NETWORK:applySettings(?:=|$)' }
    returns: ack

  set_ethernet_port_enabled:
    summary: 'Enable or disable an Ethernet port (P1-P7 by model); disabling the one in use ends the connection'
    params:
      port: { type: int, min: 1, max: 7, required: true, label: Ethernet port, description: "Ethernet port P1 to P7 by its number; UCX has P1-P5, MMX2 and DCX P1-P3." }
      enabled: { type: bool, required: true, label: Enabled, description: "On enables the port, off disables it." }
    send: 'SET /V1/MEDIA/ETHERNET/P{port}.Enabled={enabled}'
    expect: { matches: '^pw /V1/MEDIA/ETHERNET/P\d+\.Enabled=' }
    returns: ack

  set_web_service_enabled:
    summary: 'Enable or disable the HTTP or HTTPS service (the REST API and the web page)'
    params:
      service: { type: enum, values: [HTTP, HTTPS], required: true, label: Service, description: "HTTP or HTTPS." }
      enabled: { type: bool, required: true, label: Enabled, description: "On enables the service, off disables it." }
    send: 'SET /V1/MANAGEMENT/NETWORK/SERVICES/{service}.Enabled={enabled}'
    expect: { matches: '^pw /V1/MANAGEMENT/NETWORK/SERVICES/HTTPS?\.Enabled=' }
    returns: ack

  set_web_authentication:
    summary: 'Enable or disable Basic authentication on the HTTP or HTTPS service; takes effect when the service restarts'
    params:
      service: { type: enum, values: [HTTP, HTTPS], required: true, label: Service, description: "HTTP or HTTPS." }
      enabled: { type: bool, required: true, label: Authentication, description: "On requires the admin password on the service, off does not." }
    send: 'SET /V1/MANAGEMENT/NETWORK/SERVICES/{service}.AuthenticationEnabled={enabled}'
    expect: { matches: '^pw /V1/MANAGEMENT/NETWORK/SERVICES/HTTPS?\.AuthenticationEnabled=' }
    returns: ack

  restart_web_service:
    summary: 'Restart the HTTP or HTTPS service'
    params:
      service: { type: enum, values: [HTTP, HTTPS], required: true, label: Service, description: "HTTP or HTTPS." }
    send: 'CALL /V1/MANAGEMENT/NETWORK/SERVICES/{service}:restart()'
    expect: { matches: '^mO /V1/MANAGEMENT/NETWORK/SERVICES/HTTPS?:restart(?:=|$)' }
    returns: ack

  set_output_5v_mode:
    summary: 'Set an output''s +5 V on the HDMI connector: Auto, On, Off or Follow signal present (MMX2 7.6, UCX 8.6)'
    params:
      output: { type: int, min: 1, required: true, label: Output, description: "Output, numbered from 1 as on the device." }
      mode: { type: enum, values: [Auto, 'On', 'Off', Follow signal present], required: true, label: +5 V, description: "Auto, On, Off, or Follow signal present." }
    send: 'SET /V1/MEDIA/VIDEO/O{output}.Output5VMode={mode}'
    expect: { matches: '^pw /V1/MEDIA/VIDEO/O\d+\.Output5VMode=' }
    returns: ack

  set_time:
    summary: 'Set the device clock, ISO 8601 UTC such as 2020-11-01T04:39:54.000Z (UCX 8.5)'
    params:
      time: { type: string, pattern: '^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d{1,3})?Z$', required: true, label: Time, description: "Date and time in UTC as ISO 8601, such as 2020-11-01T04:39:54.000Z." }
    send: 'CALL /V1/MANAGEMENT/DATETIME:setTime({time})'
    expect: { matches: '^mO /V1/MANAGEMENT/DATETIME:setTime(?:=|$)' }
    returns: ack

  set_remote_syslog_enabled:
    summary: 'Enable or disable sending the log to a remote syslog server (UCX 8.5.10)'
    params:
      enabled: { type: bool, required: true, label: Remote syslog, description: "On sends the log to the server, off stops it." }
    send: 'SET /V1/MANAGEMENT/LOG/REMOTE.Enabled={enabled}'
    expect: { matches: '^pw /V1/MANAGEMENT/LOG/REMOTE\.Enabled=' }
    returns: ack

  set_remote_syslog_server:
    summary: 'Set the remote syslog server, a domain name or IPv4 address'
    params:
      server: { type: string, pattern: '^[A-Za-z0-9.-]{1,253}$', required: true, label: Server, description: "Domain name or IPv4 address of the syslog server." }
    send: 'SET /V1/MANAGEMENT/LOG/REMOTE.ServerAddress={server}'
    expect: { matches: '^pw /V1/MANAGEMENT/LOG/REMOTE\.ServerAddress=' }
    returns: ack

  set_remote_syslog_protocol:
    summary: 'Set the remote syslog transport'
    params:
      protocol: { type: enum, values: [TCP, UDP, TLS], required: true, label: Protocol, description: "TCP, UDP or TLS." }
    send: 'SET /V1/MANAGEMENT/LOG/REMOTE.Protocol={protocol}'
    expect: { matches: '^pw /V1/MANAGEMENT/LOG/REMOTE\.Protocol=' }
    returns: ack

  set_remote_syslog_port:
    summary: 'Set the remote syslog server port'
    params:
