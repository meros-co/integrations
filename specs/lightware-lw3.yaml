quirks:
  - models: [mx2, umx]
    severity: info
    text: >
      With link serial the MX2 or UMX-HDMI-140 is driven on its RS-232 port with the same LW3 commands,
      answers and change notifications as over TCP 6107 (lines end CR LF). The port must take LW3: on the
      MX2 RS-232 control on and protocol LW3 (the factory settings, MX2 4.2.4); on the UMX Control mode
      (umx_set_serial_mode or LDC) with ControlProtocol LW3 (umx_set_serial_protocol), which is not the factory protocol (LW2, UMX
      11.6), so a UMX is first switched over TCP or LDC. Both start at 57600 8N1; the link's line settings
      must match the port's, and 1.5 stop bits and 9 data bits are not offered. The Cleartext login covers
      the serial port too (UMX 7.5), so the login step is sent on either link; when a serial login ends is
      not documented. Flow control is not documented; none is used. The MMX2, Taurus UCX, DCX and UCX-TPX
      take no LW3 on their serial ports, which pass data through (link serial is refused for them), and
      their USB port's LW3 control is announced for later firmware.
  - models: [all]
    severity: critical
    text: >
      Three LW3 node trees exist and their paths are not interchangeable: the
      /V1 tree (MMX2, Taurus UCX, DCX: /V1/MEDIA/VIDEO/XP), the MX2 tree
      (/MEDIA/XP/VIDEO) and the UMX tree (/MEDIA/VIDEO/XP). Commands are split
      by tree (plain names, mx2_*, umx_*) and each model lists only its own.
      A command sent to the wrong tree is answered with an error
      (%E002 Not exist) and does nothing.

  - models: [mx2]
    severity: critical
    text: >
      mx2_load_preset changes every unlocked output at once, and
      mx2_switch_all / mx2_disconnect_all / mx2_switch_multi change every
      output they name in one step; there is no undo. A preset stores the
      crosspoint and mute states (MX2 9.16); locked outputs are left as they
      are.

  - models: [all]
    severity: critical
    text: >
      factory_defaults and factory_defaults_legacy restore every setting and
      restart the device; the connection drops, and on the UMX the Cleartext
      login password is erased. restart, mx2_soft_reset and umx_reset drop
      every connection; subscriptions are lost and are sent again when the
      core reconnects.

  - models: [all]
    severity: warning
    text: >
      Lines end with CR LF and are limited to 800 bytes (MX2 9.3.2). Names and
      values are case-sensitive (on MMX2 up to FW v2.9.0), so enumerated
      values are sent with the documented capitalisation. The characters
      \ { } # % ( ) and CR, LF, TAB are protocol characters that must be
      escaped with a backslash (MX2 9.3.7); free-text parameters here (labels,
      names, macro names) refuse them instead.

  - models: [all]
    severity: warning
    text: >
      Answers carry no request id. Each command waits for the next line that
      starts with an answer prefix (pr, pw, pE, mO, mF, mE, nE, o-...); CHG
      lines are never taken as answers. A failed method answers mE or mF and a
      failed property access pE or nE, with %E<code>:<text>, which fails the
      command (e.g. %E004 Invalid value, %E002 Not exist, %E006 Illegal
      operation). Signatures (XXXX#) and GETALL are not used, because their
      multi-line answers would be read as the answers to later commands.

  - models: [all]
    severity: warning
    text: >
      State is kept current by subscription: OPEN on the crosspoint and port
      nodes after every connect, then CHG lines (MX2 9.3.9-9.3.10). Values are
      read once on connecting. The subscribe and read lists cover all three
      trees, because telemetry cannot be chosen per model; a product answers
      the other trees' paths with error lines, which are ignored. On /V1
      products only the documented port range (video I1-I5, O1-O3, audio
      O1-O4, USB H1) is read on connecting; other ports appear on their first
      change. Whether "OPEN <node>/*" also covers grandchild nodes is not
      documented.

  - models: [taurus-ucx]
    severity: warning
    text: >
      The video crosspoint cannot route I1 and I5 at the same time: routing
      one while the other is on any output is refused with "%E006: Illegal
      operation" (UCX 8.6.1). get_switchable reports Busy for such inputs. A
      CHG for EmbeddedAudioPresent on an HDMI output can be missed when the
      crosspoint switches between sources with and without embedded audio
      (UCX release notes).

  - models: [mx2, umx]
    severity: info
    text: >
      Crosspoint and port status are semicolon lists in port order. The
      crosspoint lists I<n> or 0 per output; a port status is a letter (T
      unlocked and unmuted, L locked, M muted, U locked and muted) and a
      status byte in hex on MX2, two bytes on UMX (the first reserved): bits
      7-6 embedded audio, 5-4 HDCP, 3-2 signal, 1-0 connection, each 10 no
      and 11 yes, 00 unknown (MX2 9.6.6, UMX 7.6.1). The list is decoded per
      position for up to 48 ports.

  - models: [mx2, umx]
    severity: info
    text: >
      Muting a port does not change the crosspoint: the route is kept and
      comes back on unmute; switching a muted output does not unmute it. A
      locked output keeps its route; a preset load skips it.

  - models: [mx2]
    severity: info
    text: >
      Documentation inconsistencies: the device-label syntax is printed as
      /MANAGEMENT/UID/DeviceLabel but the example as /MANAGEMENT/UID.DeviceLabel
      (the property form, used here); muteSource's syntax line drops a slash
      (/MEDIA/XPVIDEO) while its reply and example have /MEDIA/XP/VIDEO; the
      preset save method is printed as save(1) with an example save(My_pres),
      so saving into an existing preset is left out (create stores a new
      one). Port names are not in the manual's LW3 chapter; the
      /MEDIA/NAMES/VIDEO rule follows the Companion module.

  - models: [mmx2, taurus-ucx, v1-generic]
    severity: info
    text: >
      Documentation inconsistencies: the output HdcpMode property is printed
      both on the port and under its HDCP node, and the sink HDCP capability
      path with a slash before the property, so neither is included. The
      autoselect policy values are printed "Last Detect"/"First Detect" in the
      table and "First detect" in the example; the example's spelling is sent.
      The Connected and Name port properties are named in the REST chapter
      (6.3.4) as examples only. The MMX2 manual prints some method replies as
      "m0" (zero); they are taken to be mO.

  - models: [mmx2, taurus-ucx, v1-generic]
    severity: info
    text: >
      The LW3 port 6107 has no authentication. From FW v2.15.0 MMX2 enables
      HTTP(S) authentication by default (password Lightware10g) but that
      covers the REST API and websockets, not 6107; the manual advises
      disabling 6107 where security matters. Up to 18 clients may be
      connected over WS, WSS and LW3 together.

  - models: [umx]
    severity: info
    text: >
      With the Cleartext login enabled (UMX-HDMI-140-Plus, FW 1.3.0b5 and
      later), nothing but ProductName, PartNumber, SerialNumber,
      FirmwareVersion, PackageVersion and MacAddress can be read until
      CALL /LOGIN:login(<password>) succeeds; the login lasts until the TCP
      connection breaks. Set the password setting and the core logs in on
      every connect. The failure answer is not documented, so a wrong password
      is not recognised as a refusal; later commands fail with errors.

  - models: [all]
    severity: info
    text: >
      get_property, set_property and call_method reach any property or method
      in the product's LW3 reference by its path (GET, SET, CALL; MX2 9.3.4),
      and get_manual reads the device's own description of one. open_node and
      close_node subscribe to any node (OPEN, CLOSE; MX2 9.3.9). Every property
      value the device answers or pushes is also kept under nodes, keyed by
      the node's path and the property's name, as the text sent (escapes
      included). A node opened with open_node stays subscribed until the
      connection closes; after a reconnect only the spec's own subscriptions
      are sent again. GET on a node, GETALL and OPEN without a node answer with
      several lines, which the core would take as the answers to later
      commands, so they are not offered.

  - models: [all]
    severity: critical
    text: >
      apply_network_settings, mx2_apply_network_settings and
      umx_apply_network_settings save the network settings set before and
      restart the network (the /V1 and UMX devices reboot); the connection
      drops and the device may come back at another address. Disabling the
      Ethernet port this connection uses (set_ethernet_port_enabled), the
      HTTP(S) service, or the UMX's LW2 service cuts that access until it is
      turned back on locally; changing a serial port's protocol or mode can
      end control over that port. A UMX event's action runs by itself
      whenever its condition is met, and umx_test_event_action and
      umx_trigger_event_condition run it at once.

  - models: [mmx2, taurus-ucx, v1-generic]
    severity: info
    text: >
      API limits of the /V1 tree: it has no Event Manager, custom variables
      or TCP/UDP/HTTP message sending in LW3 (Lightware does these in LARA or
      the REST API), sends serial messages only through the REST API
      (POST /api/V1/MEDIA/SERIAL/P<n>/send, UCX 8.18, MMX2 7.13) and turns
      serial-over-IP on only there, has no readable GPIO input level, no MAC
      address property and no documented LW3 syntax to disable the LW3
      service itself. The admin password is set over REST only from FW v2.2.0.
      EDID upload and download are LDC file operations, not LW3. DataBits is
      read-only (8 or 9). GPIO pins are P1-P6 and the serial ports P1-P2 (one
      on 2x1 models); a port a product lacks answers %E002.

  - models: [mx2]
    severity: info
    text: >
      API limits of the MX2 tree: no GPIO, Event Manager, variables or
      message sending, and only the serial protocol and baud rate are
      settable. Port names cannot be set over LW3: the MX2 manual's LW3
      chapter has no name property or method (names are set in LDC), and the
      read-only /MEDIA/NAMES/VIDEO rule follows the Companion module. Presets
      are named nodes under /MEDIA/PRESET with no number and no list property;
      the full list is only a GET of the node, a multi-line answer the core
      cannot read (format limit), and presets are deleted only in LDC. State
      therefore keeps the presets this connection creates, loads or renames
      to, and the last one loaded.

  - models: [umx]
    severity: warning
    text: >
      UMX settings are numbered on the wire: the UART's ControlProtocol 0 LW2
      / 1 LW3, Rs232Mode 0 Event Manager / 1 control / 2 command injection,
      Baudrate 0-7 (4800 to 115200), StopBits 0-2 (1, 1.5, 2) and Parity 0-2,
      translated here both ways. Event conditions and actions are written as
      the device writes them (UMX 7.8): a condition
      <node>.<property>=<value>, <node>.<property>? for any change, event
      numbers joined by & (FW 1.3.0b5); an action a method written with a dot
      and no brackets (/MEDIA/VIDEO/XP.switch=I4:O1), an event number or a
      macro. Up to 40 events and 30 variables (-Plus); messages accept \xNN
      for a byte. Values with the protocol characters \ { } # % ( ) are
      refused rather than escaped. The manual's ConditionTimeoutPending
      example contradicts its table, so only ConditionTimeout is offered.

  - models: [all]
    severity: info
    text: >
      Readings LW3 gives only as a multi-line answer (GET of a node, GETALL,
      a wildcard GET) cannot be read here (format limit: the core takes one
      line per answer): the MX2 preset list, EDID header details beyond the
      /V1 PreferredResolution and Validity, and node listings. The settings
      above are read one property at a time on connecting (every tree's
      paths, as for the crosspoint) and kept current by OPEN subscriptions.
