      state: { "presets.{1}.exists": { value: "x", map: { x: true } } }
    - match: '^mO /MEDIA/PRESET:rename(?:=|$)'
      request_match: '^CALL /MEDIA/PRESET:rename\(([A-Za-z0-9_-]+),([A-Za-z0-9_-]+)\)$'
      state: { "presets.{1}": { delete: true }, "presets.{2}.exists": { value: "x", map: { x: true } } }
    # MX2 port names (corroborated by the Companion module only): <n>;<label>.
    - match: '^(?:CHG|p[rw]) /MEDIA/NAMES/VIDEO\.I(\d+)=\d+;(.*)$'
      state: { "video.inputs.{1}.name": "{2}" }
    - match: '^(?:CHG|p[rw]) /MEDIA/NAMES/VIDEO\.O(\d+)=\d+;(.*)$'
      state: { "video.outputs.{1}.name_mx2": "{2}" }
    # MX2 and UMX trees: semicolon lists in port order, one rule per position.
    # The crosspoint lists I<n> or 0 per output. A status field is the
    # lock/mute letter (T neither, L locked, M muted, U both) and a status
    # byte as two hex digits (MX2), or two bytes of which the first is
    # reserved (UMX): bits 7-6 embedded audio, 5-4 HDCP, 3-2 signal, 1-0
    # connection, each 10 no and 11 yes (00 unknown and 01 reserved are not
    # assigned).
    # MX2 /MEDIA/XP/VIDEO (48x48 at most) and UMX /MEDIA/VIDEO/XP.
