  umx_set_event_name:
    summary: 'Set an Event Manager event''s name (UMX 7.8)'
    params:
      event: { type: int, min: 1, max: 40, required: true, label: Event, description: "Event E1 to E40, by its number." }
      name: { type: string, max_length: 20, pattern: '^[A-Za-z0-9 _-]*$', required: true, label: Name, description: "Event name of up to 20 letters, digits, spaces, hyphens and underscores." }
    send: 'SET /EVENTS/E{event}.Name={name}'
    expect: { matches: '^pw /EVENTS/E\d+\.Name=' }
    returns: ack

  umx_set_event_condition:
    summary: 'Set an Event Manager event''s condition (UMX 7.8)'
    params:
      event: { type: int, min: 1, max: 40, required: true, label: Event, description: "Event E1 to E40, by its number." }
      condition: { type: string, max_length: 255, pattern: '^[^\\{}#%()]*$', required: true, label: Condition, description: "What triggers the event: a property and value such as /MEDIA/VIDEO/I1.SignalPresent=1, a property followed by ? for any change, or event numbers joined by &." }
    send: 'SET /EVENTS/E{event}.Condition={condition}'
    expect: { matches: '^pw /EVENTS/E\d+\.Condition=' }
    returns: ack

  umx_set_event_action:
    summary: 'Set an Event Manager event''s action (UMX 7.8)'
    params:
      event: { type: int, min: 1, max: 40, required: true, label: Event, description: "Event E1 to E40, by its number." }
      action: { type: string, max_length: 255, pattern: '^[^\\{}#%()]*$', required: true, label: Action, description: "What the event does: a method or property with its value such as /MEDIA/VIDEO/XP.switch=I4:O1, another event's number, or a macro such as Macro1." }
    send: 'SET /EVENTS/E{event}.Action={action}'
    expect: { matches: '^pw /EVENTS/E\d+\.Action=' }
