      emulated E1-E3) syntax as the UCX.
  - title: "Taurus UCX-TPX series User Manual, rev. v8 (2026-09-14)"
    author: Lightware Visual Engineering PLC.
    url: https://assets.prod.pim.lightware.com/assets/File-Downloads/Guides-and-Manuals/User-Manual/HTML/UCX-TPX_series/UM.html
    note: >
      Manufacturer document. Chapter 8, LW3 Programmers' Reference (/V1 tree):
      GPIO (8.19), serial (8.17), network and Ethernet ports P1-P7 (8.14-8.16),
      EDID (8.13).
  - title: "UMX-HDMI-140 / UMX-HDMI-140-Plus User Manual, FW package v1.3.1b2"
    author: Lightware Visual Engineering PLC.
    url: https://assets.prod.pim.lightware.com/assets/File-Downloads/Guides-and-Manuals/User-Manual/HTML/UMX-HDMI-140_Series/UM.html
    note: >
      Manufacturer document. Chapter 7, LW3 Programmers' Reference (UMX
      tree): system (7.4: ProductName, UID.DeviceLabel 39 characters,
      SYS/MB.FirmwareVersion, UID.PackageVersion, SYS:reset, factoryDefaults,
      UI.ControlLock 0/1/2, identifyMe, CTRL/MACROS:run); Cleartext login
      (7.5: LOGIN:login, logout, LoginEnable; valid until the TCP socket
      breaks); video (7.6: SourcePortStatus and DestinationPortStatus with a
      letter and two hex bytes, DestinationConnectionList, XP:switch,
      setDestinationPortAutoselect, mute/lock methods, HdcpEnable,
      HdcpModeSetting, FreeRunMode, HdmiModeSetting, ColorSpaceSetting); audio
      (7.7: the same for /MEDIA/AUDIO/XP, input Volume and Balance).
      Retrieved again 2026-10-14 (rev. v5, 2026-09-14): Event Manager
      E1-E40, conditions, actions, delays, triggerCondition and ActionTest
      (7.8-7.9); variables V1-V30 with add and cycle (7.10); network and
      applySettings(1) (7.11); TCP/UDP message sending and Wake-on-LAN (7.12-7.13);
      HTTP client (7.14); UART settings, sendMessage, sendBinaryMessage and the
      RS-232 recognizer (7.16-7.18); CEC (7.19); IR (7.20-7.21); GPIO P1-P7
      (7.22); EDID (7.23); buttons and dark mode (7.4.9); service filter and
      Cleartext login password (7.5).
  - title: "Security features in Lightware products, Application Notes, rev. v1"
    author: Lightware Visual Engineering PLC.
    url: https://assets.prod.pim.lightware.com/assets/File-Downloads/Guides-and-Manuals/Application-Note/Security_Guide.pdf
    note: >
      Which products have the Cleartext login (UMX-HDMI-140-Plus,
      UMX-TPS-TX140-Plus and others) and that LW2 on port 10001 is not
      covered by it.
  - title: companion-module-lightware-lw3 (Bitfocus Companion module, MIT)
    url: https://github.com/bitfocus/companion-module-lightware-lw3
    note: >
      Corroboration only, read for behaviour, no code copied: chooses the MX2
      tree by ProductName, opens /MEDIA/XP/VIDEO and reads
      DestinationConnectionStatus / DestinationConnectionList as
      semicolon-separated I<n> or 0 per output, and reads MX2 port names from
      /MEDIA/NAMES/VIDEO as <n>;<label>.

transport:
  type: line-tcp
  port: 6107
  framing: terminated
  terminator: crlf
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # Every answer starts with a two-character prefix and a space (pr, pw, pE,
  # mO, mF, mE, nE, n-, o-, c-...). A change notification starts "CHG " and is
  # never the reply to a command.
  reply_match: '^[pmnoc][-rwmEOFs] '
  probe: 'GET /.SerialNumber'
  # The same LW3 on the RS-232 port of the MX2 and the UMX-HDMI-140 only: MX2 manual 4.2.4, 9.19.1-9.19.2
  # and 13.3 (RS-232 control on, protocol LW3, 57600 8N1 by default; Baudrate 200 to 115200; spec sheet:
  # parity none, odd or even, stop bits 1, 1.5 or 2); UMX-HDMI-140 manual 4.6.2, 7.16.1-7.16.6 and 11.6
  # (Control mode with ControlProtocol LW3, the factory protocol being LW2; 57600 8N1; 4800 to 115200). The
  # /V1 products' serial ports pass data through and do not take LW3 (MMX2 4.11.1, Taurus UCX 5.14 and
  # 8.18, DCX 5.12.1, UCX-TPX 5.14.1).
  serial:
    models: [mx2, umx]
    baud_rate: { default: 57600, values: [200, 300, 600, 1200, 1800, 2400, 4800, 7200, 9600, 14400, 19200, 38400, 57600, 115200] }
    data_bits: 8
    parity: { default: none, values: [none, odd, even] }
    stop_bits: { default: 1, values: [1, 2] }
    flow_control: none

# Cleartext login password (UMX-HDMI-140-Plus and other products with the
# Basic IT security pack). Left empty when the login is not enabled.
settings:
  password:
    type: string
    secret: true
    default: ''
    pattern: '^[^\\{}#%()\r\n\t]*$'
    label: Password
    description: "The login password set on the device; empty when login is not enabled."

on_connect:
  - when_set: password
    send: 'CALL /LOGIN:login({settings.password})'
    await_reply: true

maps:
  umx_protocol: { LW2: "0", LW3: "1" }
  umx_rs232_mode: { event_manager: "0", control: "1", command_injection: "2" }
  umx_baud: { "4800": "0", "7200": "1", "9600": "2", "14400": "3", "19200": "4", "38400": "5", "57600": "6", "115200": "7" }
  umx_stop: { "1": "0", "1.5": "1", "2": "2" }
  umx_parity: { None: "0", Odd: "1", Even: "2" }

ports:
  - { port: 6107, protocol: tcp, role: control, when: "link tcp" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "The RS-232 port of an MX2 (3-pole Phoenix, 9-pole D-sub on -R models) or a UMX-HDMI-140 (3-pole Phoenix)" }

