    send: 'SET /MEDIA/UART/P1.Rs232Mode={mode:map.umx_rs232_mode}'
    expect: { matches: '^pw /MEDIA/UART/P1\.Rs232Mode=' }
    returns: ack

  umx_set_serial_baudrate:
    summary: 'Set the RS-232 port baud rate'
    params:
      baud: { type: enum, values: ['4800', '7200', '9600', '14400', '19200', '38400', '57600', '115200'], required: true, label: Baud rate, description: "Baud rate of the port." }
    send: 'SET /MEDIA/UART/P1.Baudrate={baud:map.umx_baud}'
    expect: { matches: '^pw /MEDIA/UART/P1\.Baudrate=' }
