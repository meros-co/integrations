        "audio.inputs.5.connected": { value: "{3}", map: { "2": false, "6": false, "A": false, "E": false, "3": true, "7": true, "B": true, "F": true } }
    - match: '^(?:CHG|p[rw]) /MEDIA/AUDIO/XP\.DestinationPortStatus=(?:[^;]*;){0}([TLMU])(?:[0-9A-F]{2})?([0-9A-F])([0-9A-F])(?:;|$)'
      state:
        "audio.outputs.1.locked": { value: "{1}", map: { "T": false, "L": true, "M": false, "U": true } }
        "audio.outputs.1.muted": { value: "{1}", map: { "T": false, "L": false, "M": true, "U": true } }
        "audio.outputs.1.signal": { value: "{3}", map: { "8": false, "9": false, "A": false, "B": false, "C": true, "D": true, "E": true, "F": true } }
        "audio.outputs.1.connected": { value: "{3}", map: { "2": false, "6": false, "A": false, "E": false, "3": true, "7": true, "B": true, "F": true } }

quirks:
  - models: [all]
    severity: critical
    text: >
      Three LW3 node trees exist and their paths are not interchangeable: the
      /V1 tree (MMX2, Taurus UCX, DCX: /V1/MEDIA/VIDEO/XP), the MX2 tree
      (/MEDIA/XP/VIDEO) and the UMX tree (/MEDIA/VIDEO/XP). Commands are split
      by tree (plain names, mx2_*, umx_*) and each model lists only its own.
      A command sent to the wrong tree is answered with an error
      (%E002 Not exist) and does nothing.

  - models: [mx2]
    severity: critical
    text: >
      mx2_load_preset changes every unlocked output at once, and
      mx2_switch_all / mx2_disconnect_all / mx2_switch_multi change every
      output they name in one step; there is no undo. A preset stores the
      crosspoint and mute states (MX2 9.16); locked outputs are left as they
      are.

  - models: [all]
    severity: critical
    text: >
      factory_defaults and factory_defaults_legacy restore every setting and
      restart the device; the connection drops, and on the UMX the Cleartext
      login password is erased. restart, mx2_soft_reset and umx_reset drop
      every connection; subscriptions are lost and are sent again when the
      core reconnects.

  - models: [all]
    severity: warning
    text: >
      Lines end with CR LF and are limited to 800 bytes (MX2 9.3.2). Names and
      values are case-sensitive (on MMX2 up to FW v2.9.0), so enumerated
      values are sent with the documented capitalisation. The characters
      \ { } # % ( ) and CR, LF, TAB are protocol characters that must be
      escaped with a backslash (MX2 9.3.7); free-text parameters here (labels,
      names, macro names) refuse them instead.

  - models: [all]
    severity: warning
    text: >
      Answers carry no request id. Each command waits for the next line that
      starts with an answer prefix (pr, pw, pE, mO, mF, mE, nE, o-...); CHG
      lines are never taken as answers. A failed method answers mE or mF and a
      failed property access pE or nE, with %E<code>:<text>, which fails the
      command (e.g. %E004 Invalid value, %E002 Not exist, %E006 Illegal
      operation). Signatures (XXXX#) and GETALL are not used, because their
      multi-line answers would be read as the answers to later commands.

  - models: [all]
    severity: warning
    text: >
      State is kept current by subscription: OPEN on the crosspoint and port
      nodes after every connect, then CHG lines (MX2 9.3.9-9.3.10). Values are
      read once on connecting. The subscribe and read lists cover all three
      trees, because telemetry cannot be chosen per model; a product answers
      the other trees' paths with error lines, which are ignored. On /V1
      products only the documented port range (video I1-I5, O1-O3, audio
      O1-O4, USB H1) is read on connecting; other ports appear on their first
      change. Whether "OPEN <node>/*" also covers grandchild nodes is not
      documented.

  - models: [taurus-ucx]
    severity: warning
    text: >
      The video crosspoint cannot route I1 and I5 at the same time: routing
      one while the other is on any output is refused with "%E006: Illegal
      operation" (UCX 8.6.1). get_switchable reports Busy for such inputs. A
      CHG for EmbeddedAudioPresent on an HDMI output can be missed when the
      crosspoint switches between sources with and without embedded audio
      (UCX release notes).

  - models: [mx2, umx]
    severity: info
    text: >
      Crosspoint and port status are semicolon lists in port order. The
      crosspoint lists I<n> or 0 per output; a port status is a letter (T
      unlocked and unmuted, L locked, M muted, U locked and muted) and a
      status byte in hex on MX2, two bytes on UMX (the first reserved): bits
      7-6 embedded audio, 5-4 HDCP, 3-2 signal, 1-0 connection, each 10 no
      and 11 yes, 00 unknown (MX2 9.6.6, UMX 7.6.1). The list is decoded per
      position for up to 48 ports.

  - models: [mx2, umx]
    severity: info
    text: >
      Muting a port does not change the crosspoint: the route is kept and
      comes back on unmute; switching a muted output does not unmute it. A
      locked output keeps its route; a preset load skips it.

  - models: [mx2]
    severity: info
    text: >
      Documentation inconsistencies: the device-label syntax is printed as
      /MANAGEMENT/UID/DeviceLabel but the example as /MANAGEMENT/UID.DeviceLabel
      (the property form, used here); muteSource's syntax line drops a slash
      (/MEDIA/XPVIDEO) while its reply and example have /MEDIA/XP/VIDEO; the
      preset save method is printed as save(1) with an example save(My_pres),
      so saving into an existing preset is left out (create stores a new
      one). Port names are not in the manual's LW3 chapter; the
      /MEDIA/NAMES/VIDEO rule follows the Companion module.

  - models: [mmx2, taurus-ucx, v1-generic]
    severity: info
    text: >
      Documentation inconsistencies: the output HdcpMode property is printed
      both on the port and under its HDCP node, and the sink HDCP capability
      path with a slash before the property, so neither is included. The
      autoselect policy values are printed "Last Detect"/"First Detect" in the
      table and "First detect" in the example; the example's spelling is sent.
      The Connected and Name port properties are named in the REST chapter
      (6.3.4) as examples only. The MMX2 manual prints some method replies as
      "m0" (zero); they are taken to be mO.

  - models: [mmx2, taurus-ucx, v1-generic]
    severity: info
    text: >
      The LW3 port 6107 has no authentication. From FW v2.15.0 MMX2 enables
      HTTP(S) authentication by default (password Lightware10g) but that
      covers the REST API and websockets, not 6107; the manual advises
      disabling 6107 where security matters. Up to 18 clients may be
      connected over WS, WSS and LW3 together.

  - models: [umx]
    severity: info
    text: >
      With the Cleartext login enabled (UMX-HDMI-140-Plus, FW 1.3.0b5 and
      later), nothing but ProductName, PartNumber, SerialNumber,
      FirmwareVersion, PackageVersion and MacAddress can be read until
      CALL /LOGIN:login(<password>) succeeds; the login lasts until the TCP
      connection breaks. Set the password setting and the core logs in on
      every connect. The failure answer is not documented, so a wrong password
      is not recognised as a refusal; later commands fail with errors.
