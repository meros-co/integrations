  umx_set_event_condition_inverted:
    summary: 'Invert an event''s condition (not equal)'
    params:
      event: { type: int, min: 1, max: 40, required: true, label: Event, description: "Event E1 to E40, by its number." }
      inverted: { type: bool, required: true, label: Inverted, description: "On triggers when the value is not the one given, off when it is." }
    send: 'SET /EVENTS/E{event}.ConditionInverted={inverted}'
