  # A rule matches a GET/SET reply (pr/pw) and a change notification (CHG)
  # alike. Values end the line, so an error answer (pE ... %E...) is never
  # taken as state.
  updates:
    # Every property read, set or changed, by its node path and name (the
    # generic subtree): GET and SET answers and CHG lines alike.
    - match: '^(?:CHG|p[rw]) (/[^=.\s]*)\.([A-Za-z0-9_]+)=(.*)$'
      state: { "nodes.{1}.{2}": "{3}" }
    - match: '^(?:CHG|pr) /\.SerialNumber=(\S+)$'
      state: { "device.serial": "{1}" }
    - match: '^(?:CHG|pr) /\.ProductName=(.+)$'
      state: { "device.product_name": "{1}" }
    - match: '^(?:CHG|p[rw]) /(?:V1/MANAGEMENT/LABEL|MANAGEMENT/UID)\.DeviceLabel=(.*)$'
      state: { "device.label": "{1}" }
    - match: '^(?:CHG|pr) /(?:V1/MANAGEMENT/UID/PACKAGE\.Version|MANAGEMENT/UID\.PackageVersion)=(\S+)$'
      state: { "device.firmware": "{1}" }
    - match: '^(?:CHG|pr) /SYS/MB\.FirmwareVersion=(.+)$'
      state: { "device.cpu_firmware": "{1}" }
    - match: '^(?:CHG|p[rw]) /MANAGEMENT/POWER\.Operation=(NORMAL|STANDBY)$'
      state: { "device.power_mode": "{1}" }
    - match: '^(?:CHG|p[rw]) /LOGIN\.LoggedIn=(true|false)$'
      state: { "device.logged_in": { value: "{1}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|pr) /(?:V1/)?EDID\.EdidStatus=(.*)$'
      state: { "edid.status": "{1}" }
    # /V1 tree: one property per port.
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/VIDEO/XP/O(\d+)\.ConnectedSource=I?(\d+)$'
      state: { "video.outputs.{1}.input": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/AUDIO/XP/O(\d+)\.ConnectedSource=I?(\d+)$'
      state: { "audio.outputs.{1}.input": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/USB/XP/H(\d+)\.ConnectedSource=U?(\d+)$'
      state: { "usb.hubs.{1}.host": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/VIDEO/XP/I(\d+)\.Lock=(true|false)$'
      state: { "video.inputs.{1}.locked": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/VIDEO/XP/I(\d+)\.Mute=(true|false)$'
      state: { "video.inputs.{1}.muted": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|pr) /V1/MEDIA/VIDEO/I(\d+)\.SignalPresent=(true|false)$'
      state: { "video.inputs.{1}.signal": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/VIDEO/XP/O(\d+)\.Lock=(true|false)$'
      state: { "video.outputs.{1}.locked": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/VIDEO/XP/O(\d+)\.Mute=(true|false)$'
      state: { "video.outputs.{1}.muted": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|pr) /V1/MEDIA/VIDEO/O(\d+)\.SignalPresent=(true|false)$'
      state: { "video.outputs.{1}.signal": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/AUDIO/XP/I(\d+)\.Lock=(true|false)$'
      state: { "audio.inputs.{1}.locked": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/AUDIO/XP/I(\d+)\.Mute=(true|false)$'
      state: { "audio.inputs.{1}.muted": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|pr) /V1/MEDIA/AUDIO/I(\d+)\.SignalPresent=(true|false)$'
      state: { "audio.inputs.{1}.signal": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/AUDIO/XP/O(\d+)\.Lock=(true|false)$'
      state: { "audio.outputs.{1}.locked": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/AUDIO/XP/O(\d+)\.Mute=(true|false)$'
      state: { "audio.outputs.{1}.muted": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|pr) /V1/MEDIA/AUDIO/O(\d+)\.SignalPresent=(true|false)$'
      state: { "audio.outputs.{1}.signal": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|pr) /V1/MEDIA/VIDEO/I(\d+)\.Connected=(true|false)$'
      state: { "video.inputs.{1}.connected": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|pr) /V1/MEDIA/VIDEO/I(\d+)\.EmbeddedAudioPresent=(true|false)$'
      state: { "video.inputs.{1}.embedded_audio": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/VIDEO/I(\d+)\.Name=(.*)$'
      state: { "video.inputs.{1}.name": "{2}" }
    - match: '^(?:CHG|pr) /V1/MEDIA/VIDEO/O(\d+)\.Connected=(true|false)$'
      state: { "video.outputs.{1}.connected": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|pr) /V1/MEDIA/VIDEO/O(\d+)\.EmbeddedAudioPresent=(true|false)$'
      state: { "video.outputs.{1}.embedded_audio": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/VIDEO/O(\d+)\.Name=(.*)$'
      state: { "video.outputs.{1}.name": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/VIDEO/O(\d+)\.EmbeddedAudioMute=(true|false)$'
      state: { "video.outputs.{1}.embedded_audio_muted": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|pr) /V1/MEDIA/VIDEO/XP/O(\d+)/SWITCHABLE\.I(\d+)=(OK|Busy)$'
      state: { "video.outputs.{1}.switchable.{2}": { value: "{3}", map: { "OK": true, "Busy": false } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/AUDIO/O(\d+)\.Mute=(true|false)$'
      state: { "audio.outputs.{1}.volume_muted": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/AUDIO/O(\d+)\.VolumedB=(-?[0-9.]+)$'
      state: { "audio.outputs.{1}.volume_db": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/AUDIO/O(\d+)\.VolumePercent=([0-9.]+)$'
      state: { "audio.outputs.{1}.volume_percent": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/AUDIO/O(\d+)\.Balance=(-?\d+)$'
      state: { "audio.outputs.{1}.balance": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/USB/XP/H(\d+)\.Lock=(true|false)$'
      state: { "usb.hubs.{1}.locked": { value: "{2}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/USB/XP/U(\d+)\.Lock=(true|false)$'
      state: { "usb.hosts.{1}.locked": { value: "{2}", map: { "true": true, "false": false } } }
    # Full control: GPIO, serial, network, settings, Event Manager, variables.
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/GPIO/P(\d+)\.Direction=(Input|Output)$'
      state: { "gpio.{1}.direction": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/GPIO/P(\d+)\.Output=(High|Low)$'
      state: { "gpio.{1}.output": "{2}" }
    - match: '^(?:CHG|p[rw]) /MEDIA/GPIO/P(\d+)\.Direction=([IO])$'
      state: { "gpio.{1}.direction": { value: "{2}", map: { "I": Input, "O": Output } } }
    - match: '^(?:CHG|p[rw]) /MEDIA/GPIO/P(\d+)\.Output=([HL])$'
      state: { "gpio.{1}.output": { value: "{2}", map: { "H": High, "L": Low } } }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/OCS/P(\d+)\.InputLevel=(High|Low)$'
      state: { "ocs.{1}.input_level": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/OCS/P(\d+)\.State=(Free|Occupied)$'
      state: { "ocs.{1}.state": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/OCS/P(\d+)\.SensorType=(Active (?:high|low))$'
      state: { "ocs.{1}.sensor_type": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/SERIAL/P(\d+)\.Baudrate=(\d+)$'
      state: { "serial.{1}.baudrate": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/SERIAL/P(\d+)\.DataBits=(\d+)$'
      state: { "serial.{1}.data_bits": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/SERIAL/P(\d+)\.StopBits=([12])$'
      state: { "serial.{1}.stop_bits": "{2}" }
    - match: '^(?:CHG|p[rw]) /V1/MEDIA/SERIAL/P(\d+)\.Parity=(None|Odd|Even)$'
      state: { "serial.{1}.parity": "{2}" }
    - match: '^(?:CHG|p[rw]) /MANAGEMENT/SERIAL\.Protocol=(LW2|LW3|P#2)$'
      state: { "serial.1.protocol": "{1}" }
    - match: '^(?:CHG|p[rw]) /MANAGEMENT/SERIAL\.Baudrate=(\d+)$'
      state: { "serial.1.baudrate": "{1}" }
    - match: '^(?:CHG|p[rw]) /MEDIA/UART/P1\.ControlProtocol=([01])$'
      state: { "serial.1.protocol": { value: "{1}", map: { "0": LW2, "1": LW3 } } }
    - match: '^(?:CHG|p[rw]) /MEDIA/UART/P1\.Rs232Mode=([0-2])$'
      state: { "serial.1.mode": { value: "{1}", map: { "0": event_manager, "1": control, "2": command_injection } } }
    - match: '^(?:CHG|p[rw]) /MEDIA/UART/P1\.Baudrate=([0-7])$'
      state: { "serial.1.baudrate": { value: "{1}", map: { "0": 4800, "1": 7200, "2": 9600, "3": 14400, "4": 19200, "5": 38400, "6": 57600, "7": 115200 } } }
    - match: '^(?:CHG|p[rw]) /MEDIA/UART/P1\.DataBits=([89])$'
      state: { "serial.1.data_bits": "{1}" }
    - match: '^(?:CHG|p[rw]) /MEDIA/UART/P1\.StopBits=([0-2])$'
      state: { "serial.1.stop_bits": { value: "{1}", map: { "0": "1", "1": "1.5", "2": "2" } } }
    - match: '^(?:CHG|p[rw]) /MEDIA/UART/P1\.Parity=([0-2])$'
      state: { "serial.1.parity": { value: "{1}", map: { "0": None, "1": Odd, "2": Even } } }
    - match: '^(?:CHG|p[rw]) /MEDIA/UART/P1\.CommandInjectionEnable=(true|false)$'
      state: { "serial.1.command_injection": { value: "{1}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /MEDIA/UART/P1\.RecognizerEnable=(true|false)$'
      state: { "serial.1.recognizer": { value: "{1}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /MEDIA/UART/RECOGNIZER\.Rx=(.*)$'
      state: { "serial.1.received": "{1}" }
    - match: '^(?:CHG|p[rw]) /MEDIA/UART/RECOGNIZER\.RxHex=([0-9A-Fa-f]*)$'
      state: { "serial.1.received_hex": "{1}" }
    - match: '^(?:CHG|p[rw]) /MEDIA/UART/RECOGNIZER\.DelimiterHex=([0-9A-Fa-f]*)$'
      state: { "serial.1.delimiter_hex": "{1}" }
    - match: '^(?:CHG|p[rw]) /MEDIA/UART/RECOGNIZER\.TimeOut=(\d+)$'
      state: { "serial.1.timeout_ms": "{1}" }
    - match: '^(?:CHG|p[rw]) /(?:V1/)?MANAGEMENT/NETWORK\.DhcpEnabled=(true|false)$'
      state: { "network.dhcp": { value: "{1}", map: { "true": true, "false": false } } }
    - match: '^(?:CHG|p[rw]) /(?:V1/)?MANAGEMENT/NETWORK\.StaticIpAddress=(.*)$'
      state: { "network.static_address": "{1}" }
    - match: '^(?:CHG|p[rw]) /(?:V1/)?MANAGEMENT/NETWORK\.StaticNetworkMask=(.*)$'
      state: { "network.static_netmask": "{1}" }
    - match: '^(?:CHG|p[rw]) /(?:V1/)?MANAGEMENT/NETWORK\.StaticGatewayAddress=(.*)$'
      state: { "network.static_gateway": "{1}" }
