  umx_set_serial_data_bits:
    summary: 'Set the RS-232 port data bits'
    params:
      data_bits: { type: enum, values: ['8', '9'], required: true, label: Data bits, description: "8 or 9 data bits." }
    send: 'SET /MEDIA/UART/P1.DataBits={data_bits}'
    expect: { matches: '^pw /MEDIA/UART/P1\.DataBits=' }
