      variable: { type: int, min: 1, max: 30, required: true, label: Variable, description: "Custom variable V1 to V30, by its number." }
      operand: { type: int, min: -2147483648, max: 2147483647, required: true, label: Add, description: "Number to add; negative subtracts." }
      min: { type: int, min: -2147483648, max: 2147483647, required: true, label: Minimum, description: "Past the maximum the variable wraps to this value." }
      max: { type: int, min: -2147483648, max: 2147483647, required: true, label: Maximum, description: "Past the minimum the variable wraps to this value." }
    send: 'CALL /CTRL/VARS/V{variable}:cycle({operand};{min};{max})'
    expect: { matches: '^mO /CTRL/VARS/V\d+:cycle(?:=|$)' }
