  set_usb_c_dp_alt_mode:
    summary: 'Set a USB-C port''s DisplayPort Alternate Mode policy'
    params:
      host: { type: int, min: 1, max: 4, required: true, label: USB-C port, description: "USB-C host port U1 to U4, by its number." }
      policy: { type: enum, values: [Auto, Force C, Force D], required: true, label: DP Alt Mode, description: "Auto, Force C or Force D." }
    send: 'SET /V1/MEDIA/USB/U{host}.DpAltModePolicy={policy}'
    expect: { matches: '^pw /V1/MEDIA/USB/U\d+\.DpAltModePolicy=' }
