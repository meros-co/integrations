    send: 'SET /MEDIA/UART/P1.CommandInjectionEnable={enabled}'
    expect: { matches: '^pw /MEDIA/UART/P1\.CommandInjectionEnable=' }
    returns: ack

  umx_serial_send:
    summary: 'Send a message out of the RS-232 port; \xNN inserts a byte, such as C00\x0D (UMX 7.17)'
    params:
      message: { type: string, max_length: 500, pattern: '^[^{}#%()]*$', required: true, label: Message, description: "Text to send; \\xNN inserts the byte NN, and the protocol characters are refused." }
    send: 'CALL /MEDIA/UART/P1:sendMessage({message})'
    expect: { matches: '^mO /MEDIA/UART/P1:sendMessage(?:=|$)' }
