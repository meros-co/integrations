  umx_set_serial_stop_bits:
    summary: 'Set the RS-232 port stop bits'
    params:
      stop_bits: { type: enum, values: ['1', '1.5', '2'], required: true, label: Stop bits, description: "1, 1.5 or 2 stop bits." }
    send: 'SET /MEDIA/UART/P1.StopBits={stop_bits:map.umx_stop}'
    expect: { matches: '^pw /MEDIA/UART/P1\.StopBits=' }
