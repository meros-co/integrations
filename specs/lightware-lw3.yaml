      seconds: { type: int, min: 0, max: 65535, required: true, label: Delay, description: "Seconds the condition must hold before the action; 0 runs it at once." }
    send: 'SET /EVENTS/E{event}.ConditionTimeout={seconds}'
    expect: { matches: '^pw /EVENTS/E\d+\.ConditionTimeout=' }
