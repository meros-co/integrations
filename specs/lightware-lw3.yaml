      protocol: { type: enum, values: [LW2, LW3, 'P#2'], required: true, label: Protocol, description: "LW2, LW3, or P#2 (another maker's protocol)." }
    send: 'SET /MANAGEMENT/SERIAL.Protocol={protocol}'
    expect: { matches: '^pw /MANAGEMENT/SERIAL\.Protocol=' }
    returns: ack

  mx2_set_serial_baudrate:
    summary: 'Set the serial port baud rate'
    params:
      baud: { type: enum, values: ['200', '300', '600', '1200', '1800', '2400', '4800', '9600', '19200', '38400', '57600', '115200'], required: true, label: Baud rate, description: "Baud rate of the serial port." }
    send: 'SET /MANAGEMENT/SERIAL.Baudrate={baud}'
    expect: { matches: '^pw /MANAGEMENT/SERIAL\.Baudrate=' }
    returns: ack

  mx2_set_network_dhcp:
    summary: 'Enable or disable DHCP; applied by mx2_apply_network_settings (MX2 9.17)'
    params:
      enabled: { type: bool, required: true, label: DHCP, description: "On takes the address from DHCP, off uses the static address." }
    send: 'SET /MANAGEMENT/NETWORK.DhcpEnabled={enabled}'
    expect: { matches: '^pw /MANAGEMENT/NETWORK\.DhcpEnabled=' }
