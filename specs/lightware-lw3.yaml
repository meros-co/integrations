    summary: 'Send a TCP message to an address and port; \xNN inserts a byte (UMX 7.13)'
    params:
      address: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: IP address, description: "IPv4 address, such as 192.168.0.20." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "Remote TCP or UDP port, 1 to 65535." }
      message: { type: string, max_length: 400, pattern: '^[^{}#%()]*$', required: true, label: Message, description: "Text to send; \\xNN inserts the byte NN, and the protocol characters are refused." }
    send: 'CALL /MEDIA/ETHERNET:tcpMessage({address}:{port}={message})'
    expect: { matches: '^mO /MEDIA/ETHERNET:tcpMessage(?:=|$)' }
    returns: ack

  umx_tcp_binary:
    summary: 'Send TCP bytes, as hex digits, to an address and port'
    params:
      address: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: IP address, description: "IPv4 address, such as 192.168.0.20." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "Remote TCP or UDP port, 1 to 65535." }
      hex: { type: string, max_length: 400, pattern: '^([0-9A-Fa-f]{2})+$', required: true, label: Bytes, description: "Bytes to send as hex digits without separators." }
    send: 'CALL /MEDIA/ETHERNET:tcpBinary({address}:{port}={hex})'
    expect: { matches: '^mO /MEDIA/ETHERNET:tcpBinary(?:=|$)' }
    returns: ack

  umx_udp_message:
    summary: 'Send a UDP message to an address and port; \xNN inserts a byte (UMX 7.13)'
    params:
      address: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: IP address, description: "IPv4 address, such as 192.168.0.20." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "Remote TCP or UDP port, 1 to 65535." }
      message: { type: string, max_length: 400, pattern: '^[^{}#%()]*$', required: true, label: Message, description: "Text to send; \\xNN inserts the byte NN, and the protocol characters are refused." }
    send: 'CALL /MEDIA/ETHERNET:udpMessage({address}:{port}={message})'
    expect: { matches: '^mO /MEDIA/ETHERNET:udpMessage(?:=|$)' }
    returns: ack

  umx_udp_binary:
    summary: 'Send UDP bytes, as hex digits, to an address and port'
    params:
      address: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: IP address, description: "IPv4 address, such as 192.168.0.20." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "Remote TCP or UDP port, 1 to 65535." }
      hex: { type: string, max_length: 400, pattern: '^([0-9A-Fa-f]{2})+$', required: true, label: Bytes, description: "Bytes to send as hex digits without separators." }
    send: 'CALL /MEDIA/ETHERNET:udpBinary({address}:{port}={hex})'
    expect: { matches: '^mO /MEDIA/ETHERNET:udpBinary(?:=|$)' }
    returns: ack

  umx_wake_on_lan:
    summary: 'Send a Wake-on-LAN packet to a MAC address'
    params:
      mac: { type: string, pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$', required: true, label: MAC address, description: "MAC address to wake, such as AA:BB:CC:22:14:FF." }
    send: 'CALL /MEDIA/ETHERNET:wakeOnLan({mac})'
    expect: { matches: '^mO /MEDIA/ETHERNET:wakeOnLan(?:=|$)' }
    returns: ack

  umx_set_http_server:
    summary: 'Set the HTTP client''s server address and port (UMX 7.14, -Plus)'
    params:
      address: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: IP address, description: "IPv4 address, such as 192.168.0.20." }
    send: 'SET /CTRL/HTTP/C1.ServerIP={address}'
    expect: { matches: '^pw /CTRL/HTTP/C1\.ServerIP=' }
    returns: ack

  umx_set_http_port:
    summary: 'Set the HTTP client''s server port'
    params:
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "Remote TCP or UDP port, 1 to 65535." }
    send: 'SET /CTRL/HTTP/C1.ServerPort={port}'
    expect: { matches: '^pw /CTRL/HTTP/C1\.ServerPort=' }
    returns: ack

  umx_set_http_file:
    summary: 'Set the path the HTTP client posts to, such as /putxml'
    params:
      path: { type: string, max_length: 255, pattern: '^/[^\\{}#%() ]*$', required: true, label: Path, description: "Request path on the server, such as /putxml." }
    send: 'SET /CTRL/HTTP/C1.File={path}'
    expect: { matches: '^pw /CTRL/HTTP/C1\.File=' }
    returns: ack

  umx_http_post:
    summary: 'Send an HTTP POST with a body from the HTTP client'
    params:
      body: { type: string, max_length: 500, pattern: '^[^\\{}#%()]*$', required: true, label: Body, description: "Request body; the protocol characters are refused." }
    send: 'CALL /CTRL/HTTP/C1:post({body})'
    expect: { matches: '^mO /CTRL/HTTP/C1:post(?:=|$)' }
    returns: ack

  umx_http_put:
    summary: 'Send an HTTP PUT with a body from the HTTP client'
    params:
      body: { type: string, max_length: 500, pattern: '^[^\\{}#%()]*$', required: true, label: Body, description: "Request body; the protocol characters are refused." }
    send: 'CALL /CTRL/HTTP/C1:put({body})'
    expect: { matches: '^mO /CTRL/HTTP/C1:put(?:=|$)' }
    returns: ack

  umx_set_network_dhcp:
    summary: 'Enable or disable DHCP; applied by umx_apply_network_settings (UMX 7.11)'
    params:
      enabled: { type: bool, required: true, label: DHCP, description: "On takes the address from DHCP, off uses the static address." }
    send: 'SET /MANAGEMENT/NETWORK.DhcpEnabled={enabled}'
    expect: { matches: '^pw /MANAGEMENT/NETWORK\.DhcpEnabled=' }
    returns: ack

  umx_set_network_static_address:
    summary: 'Set the static IP address; applied by umx_apply_network_settings'
    params:
      address: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: IP address, description: "IPv4 address, such as 192.168.0.20." }
    send: 'SET /MANAGEMENT/NETWORK.StaticIpAddress={address}'
    expect: { matches: '^pw /MANAGEMENT/NETWORK\.StaticIpAddress=' }
    returns: ack

  umx_set_network_static_netmask:
    summary: 'Set the static network mask; applied by umx_apply_network_settings'
    params:
      netmask: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: Network mask, description: "IPv4 network mask, such as 255.255.255.0." }
    send: 'SET /MANAGEMENT/NETWORK.StaticNetworkMask={netmask}'
    expect: { matches: '^pw /MANAGEMENT/NETWORK\.StaticNetworkMask=' }
    returns: ack

  umx_set_network_static_gateway:
    summary: 'Set the static gateway; applied by umx_apply_network_settings'
    params:
      gateway: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: Gateway, description: "IPv4 gateway address, such as 192.168.0.1." }
    send: 'SET /MANAGEMENT/NETWORK.StaticGatewayAddress={gateway}'
    expect: { matches: '^pw /MANAGEMENT/NETWORK\.StaticGatewayAddress=' }
    returns: ack

  umx_set_hostname:
    summary: 'Set the host name (1-64 letters, digits, hyphens and dots)'
    params:
      hostname: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9.-]{0,63}$', required: true, label: Host name, description: "Host name of 1 to 64 letters, digits, hyphens and dots." }
    send: 'SET /MANAGEMENT/NETWORK.HostName={hostname}'
    expect: { matches: '^pw /MANAGEMENT/NETWORK\.HostName=' }
    returns: ack

  umx_apply_network_settings:
    summary: 'Apply the network settings; the device reboots and the connection drops'
    send: 'CALL /MANAGEMENT/NETWORK:applySettings(1)'
    expect: { matches: '^mO /MANAGEMENT/NETWORK:applySettings(?:=|$)' }
    returns: ack

  umx_set_lw2_service:
    summary: 'Enable or disable the LW2 service on TCP 10001 (-Plus service filter)'
    params:
      enabled: { type: bool, required: true, label: LW2, description: "On allows LW2 on TCP 10001, off blocks it." }
    send: 'SET /MANAGEMENT/SERVICEFILTER.Lw2Enabled={enabled}'
    expect: { matches: '^pw /MANAGEMENT/SERVICEFILTER\.Lw2Enabled=' }
    returns: ack

  umx_set_http_service:
    summary: 'Enable or disable the HTTP service (-Plus service filter)'
    params:
      enabled: { type: bool, required: true, label: HTTP, description: "On allows HTTP, off blocks it." }
    send: 'SET /MANAGEMENT/SERVICEFILTER.HttpEnabled={enabled}'
    expect: { matches: '^pw /MANAGEMENT/SERVICEFILTER\.HttpEnabled=' }
    returns: ack

  umx_set_login_enabled:
    summary: 'Turn the Cleartext login on or off; only while logged in (UMX 7.5)'
    params:
      enabled: { type: bool, required: true, label: Login, description: "On protects the tree with the password, off leaves it open." }
    send: 'SET /LOGIN.LoginEnable={enabled}'
    expect: { matches: '^pw /LOGIN\.LoginEnable=' }
    returns: ack

  umx_set_login_password:
    summary: 'Set the Cleartext login password'
    params:
      password: { type: string, max_length: 64, pattern: '^[^\\{}#%()\s]+$', required: true, label: Password, description: "New login password; the protocol characters are refused." }
    send: 'CALL /LOGIN:setPassword({password})'
    expect: { matches: '^mO /LOGIN:setPassword(?:=|$)' }
    returns: ack

  umx_get_edid_status:
    summary: 'Get the EDID emulated on each input, as <source>:E<n> pairs (UMX 7.23)'
    send: 'GET /EDID.EdidStatus'
    expect: { matches: '^pr /EDID\.EdidStatus=(.*)$' }
    returns: value

  umx_edid_switch:
    summary: 'Emulate an EDID (F factory, U user, D dynamic) on an input'
    params:
      source: { type: string, pattern: '^[FUD][1-9][0-9]{0,2}$', required: true, label: EDID, description: "EDID to emulate: F followed by a factory EDID number, U a user slot, D a dynamic EDID, such as F49." }
      input: { type: int, min: 1, max: 6, required: true, label: Input, description: "Input, numbered from 1 as on the device." }
    send: 'CALL /EDID:switch({source}:E{input})'
    expect: { matches: '^mO /EDID:switch(?:=|$)' }
    returns: ack

  umx_edid_copy:
    summary: 'Copy an EDID (or an emulated one, E<n>) into a user EDID slot (overwritten without warning)'
    params:
      source: { type: string, pattern: '^[FUDE][1-9][0-9]{0,2}$', required: true, label: EDID, description: "EDID to copy: F, U, D or E followed by its number, such as D1." }
      slot: { type: int, min: 1, max: 100, required: true, label: User EDID slot, description: "User EDID slot to copy into, numbered from 1." }
    send: 'CALL /EDID:copy({source}:U{slot})'
    expect: { matches: '^mO /EDID:copy(?:=|$)' }
    returns: ack

  umx_edid_delete:
    summary: 'Delete a user EDID'
    params:
      slot: { type: int, min: 1, max: 100, required: true, label: User EDID slot, description: "User EDID slot to delete, numbered from 1." }
    send: 'CALL /EDID:delete(U{slot})'
    expect: { matches: '^mO /EDID:delete(?:=|$)' }
    returns: ack

  umx_edid_reset:
    summary: 'Switch every emulated EDID back to the factory default'
    send: 'CALL /EDID:reset()'
    expect: { matches: '^mO /EDID:reset(?:=|$)' }
    returns: ack

  umx_cec_send:
    summary: 'Send a named CEC command from a port (UMX 7.19, -Plus)'
    params:
      port: { type: enum, values: [I1, I2, I3, I4, O1], required: true, label: Port, description: "I1 to I4 for an input, O1 for the output." }
      command: { type: enum, values: [image_view_on, standby, text_view_on, active_source, get_cec_version, set_osd, clear_osd, give_power_status], required: true, label: CEC command, description: "Named CEC command to send." }
    send: 'CALL /MEDIA/CEC/{port}:send({command})'
    expect: { matches: '^mO /MEDIA/CEC/[IO]\d:send(?:=|$)' }
    returns: ack

  umx_cec_send_hex:
    summary: 'Send a CEC frame given in hex (up to 15 bytes) from a port'
    params:
      port: { type: enum, values: [I1, I2, I3, I4, O1], required: true, label: Port, description: "I1 to I4 for an input, O1 for the output." }
      hex: { type: string, max_length: 30, pattern: '^([0-9A-Fa-f]{2})+$', required: true, label: CEC frame, description: "CEC frame as up to 30 hex digits." }
    send: 'CALL /MEDIA/CEC/{port}:sendHex({hex})'
    expect: { matches: '^mO /MEDIA/CEC/[IO]\d:sendHex(?:=|$)' }
    returns: ack

  umx_set_cec_osd_text:
    summary: 'Set the text set_osd shows on the display (up to 14 characters)'
    params:
      port: { type: enum, values: [I1, I2, I3, I4, O1], required: true, label: Port, description: "I1 to I4 for an input, O1 for the output." }
      text: { type: string, max_length: 14, pattern: '^[^\\{}#%()]*$', required: true, label: Text, description: "On-screen text of up to 14 characters." }
    send: 'SET /MEDIA/CEC/{port}.OsdString={text}'
    expect: { matches: '^pw /MEDIA/CEC/[IO]\d\.OsdString=' }
    returns: ack

  umx_ir_send_pronto:
    summary: 'Send a Pronto hex IR code from the IR output (UMX 7.21, -Plus)'
    params:
      hex: { type: string, max_length: 765, pattern: '^[0-9A-Fa-f]+$', required: true, label: Pronto code, description: "Pronto hex code without spaces, up to 765 characters." }
    send: 'CALL /MEDIA/IR/D1:sendProntoHex({hex})'
    expect: { matches: '^mO /MEDIA/IR/D1:sendProntoHex(?:=|$)' }
    returns: ack

  umx_set_dark_mode:
    summary: 'Switch the LEDs off (dark mode) or back on (UMX 7.4)'
    params:
      enabled: { type: bool, required: true, label: Dark mode, description: "On switches the LEDs off, off switches them back on." }
    send: 'SET /MANAGEMENT/UI/DARKMODE.DarkModeEnable={enabled}'
    expect: { matches: '^pw /MANAGEMENT/UI/DARKMODE\.DarkModeEnable=' }
    returns: ack

  umx_set_dark_mode_delay:
    summary: 'Set the delay before dark mode starts, in seconds'
    params:
      seconds: { type: int, min: 0, required: true, label: Delay, description: "Seconds before dark mode starts; 0 for none." }
    send: 'SET /MANAGEMENT/UI/DARKMODE.DarkModeDelay={seconds}'
    expect: { matches: '^pw /MANAGEMENT/UI/DARKMODE\.DarkModeDelay=' }
    returns: ack

  umx_set_button_enabled:
    summary: 'Enable or disable a front panel button''s default function (UMX 7.4.9)'
    params:
      button: { type: int, min: 1, max: 3, required: true, label: Button, description: "Front panel button B1 to B3, by its number." }
      enabled: { type: bool, required: true, label: Enabled, description: "On keeps the button's default function, off disables it." }
    send: 'SET /MANAGEMENT/UI/BUTTONS/B{button}.DefaultFunctionEnable={enabled}'
    expect: { matches: '^pw /MANAGEMENT/UI/BUTTONS/B\d\.DefaultFunctionEnable=' }
    returns: ack

  # Any node, property or method by its path (MX2 9.3.4, MMX2 7.4.4): every
  # tree, so every model.
  get_property:
    summary: 'Read any property by its path, the node and the property name joined by a dot (GET, MX2 9.3.4); returns the value as the device sends it, escapes included'
    params:
      path: { type: string, max_length: 255, pattern: '^/[A-Za-z0-9_/@-]*\.[A-Za-z0-9_]+$', required: true, label: Property, description: "The property's path, such as /V1/MEDIA/VIDEO/I1.SignalPresent or /.SerialNumber, from the product's LW3 reference; names are case-sensitive." }
    send: 'GET {path}'
    expect: { matches: '^p[rw] [^=]*=(.*)$' }
    returns: value

  set_property:
    summary: 'Set any read-write property by its path (SET, MX2 9.3.4); answered with the property and its new value (pw), or pE with an error'
    params:
      path: { type: string, max_length: 255, pattern: '^/[A-Za-z0-9_/@-]*\.[A-Za-z0-9_]+$', required: true, label: Property, description: "The property's path, such as /V1/MEDIA/VIDEO/XP/O1.Lock, from the product's LW3 reference; names are case-sensitive." }
      value: { type: string, max_length: 500, pattern: '^[^\\{}#%()]*$', default: '', label: Value, description: "The new value as the reference writes it, such as true or 50.00; the protocol characters \\ { } # % ( ) are refused rather than escaped." }
    send: 'SET {path}={value}'
    expect: { matches: '^pw [^=]*=' }
    returns: ack

  call_method:
    summary: 'Call any method by its path, the node and the method name joined by a colon, with its arguments as the reference writes them (CALL, MX2 9.3.4); returns what follows = in the mO answer, if anything'
    params:
      method: { type: string, max_length: 255, pattern: '^/[A-Za-z0-9_/@-]*:[A-Za-z0-9_]+$', required: true, label: Method, description: "The method's path, such as /V1/MEDIA/VIDEO/XP:switch or /V1/MANAGEMENT/UI:identifyMe, from the product's LW3 reference." }
      arguments: { type: string, max_length: 500, pattern: '^[^\\{}#%()]*$', default: '', label: Arguments, description: "The arguments inside the parentheses, such as I2:O1 or I1:O1;I2:O2, empty for none; the protocol characters \\ { } # % ( ) are refused rather than escaped." }
    send: 'CALL {method}({arguments})'
    expect: { matches: '^mO [^=\s]+(?:=(.*))?$' }
    returns: value

  get_manual:
    summary: "Read the device's own one-line manual for a property or method: its value format and a description (MAN, MX2 9.3.4)"
    params:
      path: { type: string, max_length: 255, pattern: '^/[A-Za-z0-9_/@-]*[.:][A-Za-z0-9_]+$', required: true, label: Property or method, description: "The path of a property (node.Property) or a method (node:method), such as /MEDIA/PORTS/VIDEO/I1/SETTINGS.EnablePower." }
    send: 'MAN {path}'
    expect: { matches: '^[pm]m \S+ ?(.*)$' }
    returns: value

  open_node:
    summary: 'Subscribe to a node, or with /* to it and its children, so its property changes arrive as CHG lines kept in state (OPEN, MX2 9.3.9); lasts until the connection closes'
    params:
      node: { type: string, max_length: 255, pattern: '^/[A-Za-z0-9_/@-]*(/\*)?$', required: true, label: Node, description: "The node's path, such as /V1/MEDIA/AUDIO/O3, or ending in /* for the node and its children." }
    send: 'OPEN {node}'
    expect: { matches: '^o- ' }
    returns: ack

  close_node:
    summary: 'Unsubscribe from a node, or with /* from it and its children (CLOSE, MX2 9.3.9)'
    params:
      node: { type: string, max_length: 255, pattern: '^/[A-Za-z0-9_/@-]*(/\*)?$', required: true, label: Node, description: "The node's path as it was opened, such as /V1/MEDIA/AUDIO/O3 or /V1/MEDIA/VIDEO/*." }
    send: 'CLOSE {node}'
    expect: { matches: '^c- ' }
    returns: ack

state:
  device.serial:            { type: string, description: "Serial number (/.SerialNumber)" }
  device.product_name:      { type: string, description: "Product name (/.ProductName)" }
  device.label:             { type: string, description: "Device label (DeviceLabel)" }
  device.firmware:          { type: string, description: "Firmware package version (/V1 PACKAGE.Version, UMX UID.PackageVersion)" }
  device.cpu_firmware:      { type: string, description: "UMX CPU firmware version (SYS/MB.FirmwareVersion)" }
  device.power_mode:        { type: string, description: "MX2 operation mode: NORMAL or STANDBY (POWER.Operation)" }
  device.logged_in:         { type: bool, description: "Cleartext login state (LOGIN.LoggedIn)" }
  video.outputs.*.input:    { type: int, description: "Input routed to the video output; 0 is disconnected" }
  video.outputs.*.locked:   { type: bool, description: "The video output is locked" }
  video.outputs.*.muted:    { type: bool, description: "The video output is muted (route kept)" }
  video.outputs.*.signal:   { type: bool, description: "A signal is present on the video output" }
  video.outputs.*.connected: { type: bool, description: "A sink is connected to the video output" }
  video.outputs.*.hdcp:     { type: bool, description: "The output signal is HDCP-encrypted (MX2/UMX status byte)" }
  video.outputs.*.embedded_audio: { type: bool, description: "The output signal carries embedded audio" }
  video.outputs.*.embedded_audio_muted: { type: bool, description: "Embedded audio muted on the output (/V1 EmbeddedAudioMute)" }
  video.outputs.*.name:     { type: string, description: "Output name (/V1 Name)" }
  video.outputs.*.switchable.*: { type: bool, description: "Whether the input (second number) can be routed to the output now (/V1 SWITCHABLE: OK true, Busy false)" }
  video.inputs.*.locked:    { type: bool, description: "The video input is locked" }
  video.inputs.*.muted:     { type: bool, description: "The video input is muted" }
  video.inputs.*.signal:    { type: bool, description: "A signal is present on the video input" }
  video.inputs.*.connected: { type: bool, description: "A source is connected to the video input" }
  video.inputs.*.hdcp:      { type: bool, description: "The input signal is HDCP-encrypted (MX2/UMX status byte)" }
  video.inputs.*.embedded_audio: { type: bool, description: "The input signal carries embedded audio" }
  video.inputs.*.name:      { type: string, description: "Input name (/V1 Name, MX2 /MEDIA/NAMES/VIDEO)" }
  video.outputs.*.name_mx2: { type: string, description: "MX2 output name (/MEDIA/NAMES/VIDEO)" }
  audio.outputs.*.input:    { type: int, description: "Input routed to the audio output; 0 is disconnected" }
  audio.outputs.*.locked:   { type: bool, description: "The audio output is locked" }
  audio.outputs.*.muted:    { type: bool, description: "The audio output is muted on the crosspoint" }
  audio.outputs.*.signal:   { type: bool, description: "An audio signal is present on the output" }
  audio.outputs.*.connected: { type: bool, description: "Something is connected to the audio output (UMX status byte)" }
  audio.outputs.*.volume_muted: { type: bool, description: "Analog output mute (/V1 AUDIO/O<n>.Mute)" }
  audio.outputs.*.volume_db: { type: float, unit: dB, description: "Analog output volume" }
  audio.outputs.*.volume_percent: { type: float, unit: "%", description: "Analog output volume in percent" }
  audio.outputs.*.balance:  { type: int, description: "Analog output balance, -100 left to 100 right" }
  audio.inputs.*.locked:    { type: bool, description: "The audio input is locked" }
