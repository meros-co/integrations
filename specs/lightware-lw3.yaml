  umx_set_event_enabled:
    summary: 'Enable or disable an Event Manager event'
    params:
      event: { type: int, min: 1, max: 40, required: true, label: Event, description: "Event E1 to E40, by its number." }
      enabled: { type: bool, required: true, label: Enabled, description: "On enables the event, off disables it; its condition count still rises." }
    send: 'SET /EVENTS/E{event}.Enabled={enabled}'
    expect: { matches: '^pw /EVENTS/E\d+\.Enabled=' }
