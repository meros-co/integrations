  umx_set_serial_parity:
    summary: 'Set the RS-232 port parity'
    params:
      parity: { type: enum, values: [None, Odd, Even], required: true, label: Parity, description: "None, Odd or Even." }
    send: 'SET /MEDIA/UART/P1.Parity={parity:map.umx_parity}'
    expect: { matches: '^pw /MEDIA/UART/P1\.Parity=' }
