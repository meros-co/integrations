  umx_set_gpio_output:
    summary: 'Set a GPIO output pin high (H) or low (L)'
    params:
      port: { type: int, min: 1, max: 7, required: true, label: GPIO pin, description: "GPIO pin P1 to P7, by its number." }
      level: { type: enum, values: [H, L], required: true, label: Level, description: "H high, L low." }
    send: 'SET /MEDIA/GPIO/P{port}.Output={level}'
    expect: { matches: '^pw /MEDIA/GPIO/P\d+\.Output=' }
