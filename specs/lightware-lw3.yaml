      slot: { type: int, min: 1, max: 159, required: true, label: Location, description: "EDID location in the bank: F1-F159, U1-U100, D1-D3." }
    send: 'GET /V1/EDID/{bank}/{bank}{slot}.Validity'
    expect: { matches: '^pr /V1/EDID/[FUD]/[FUD]\d+\.Validity=(.*)$' }
