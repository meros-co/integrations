spec: 1
id: lightware-lw3
name: Lightware LW3 matrices, switchers and extenders
vendor: Lightware
category: router

# Transcribed from the LW3 Programmers' Reference chapters of Lightware's own
# user manuals. Lightware publishes no stand-alone LW3 reference: each product's
# manual carries the chapter for its own node tree. Three trees exist and their
# paths and methods differ, so the commands are split by family:
#
#   - plain names: the /V1 tree of the current products (MMX2, Taurus UCX, DCX,
#     UCX-TPX): /V1/MEDIA/VIDEO/XP:switch, crosspoint port properties
#     XP/<port>.Lock and .Mute, XP/<out>.ConnectedSource, port status as
#     separate properties (/V1/MEDIA/VIDEO/I1.SignalPresent).
#   - mx2_*: the MX2 matrix tree: /MEDIA/XP/VIDEO with lock/mute methods
#     (lockSource, muteDestination...), the crosspoint and port status as
#     semicolon lists, port settings under /MEDIA/PORTS/VIDEO, presets under
#     /MEDIA/PRESET.
#   - umx_*: the UMX-HDMI-140 tree: /MEDIA/VIDEO/XP and /MEDIA/AUDIO/XP with the
#     same lock/mute methods as MX2, status as semicolon lists, port settings
#     on /MEDIA/VIDEO/<port>.
#
# Left out: EDID upload/download, the Event Manager, variables, Ethernet/HTTP
# message sending, serial pass-through, GPIO/OCS, network and security
# configuration (changing them drops the connection or locks it), remote
# syslog, firmware update, and settings documented with conflicting syntax
# (see quirks).
source:
  - title: "MX2 Standalone Series User Manual, rev. v7 (2026-09-07), FW package v1.11.3"
    author: Lightware Visual Engineering PLC.
    url: https://assets.prod.pim.lightware.com/assets/File-Downloads/Guides-and-Manuals/User-Manual/HTML/MX2_Standalone_series/UM.html
    note: >
      Manufacturer document. Chapter 9, LW3 Programmers' Reference: protocol
      rules, CrLf line ending, 800-byte line limit, TCP port 6107 (9.3.2);
      GET/GETALL/SET/CALL/MAN (9.3.4); prefixes (9.3.5); errors %E004 (9.3.6);
      escaping (9.3.7); signature (9.3.8); OPEN/CLOSE subscriptions per
      connection and CHG messages (9.3.9-9.3.10); system commands (9.4:
      ProductName, DeviceLabel, SerialNumber, softReset, factoryDefaults,
      POWER.Operation, standby, wakeUp); crosspoint (9.5:
      DestinationConnectionStatus, switch, switch(0:out), switchAll,
      switchMulti); input settings (9.6: HdcpVersion, muteSource,
      unmuteSource, lockSource, unlockSource, SourcePortStatus letter and hex
      byte layout, EMBEDDEDAUDIO.AudioMode); CEC (9.7, 9.13); DisplayPort
      (9.8, 9.14); analog audio (9.9-9.10, 9.15); output settings (9.11:
      DestinationPortStatus, muteDestination, unmuteDestination,
      lockDestination, unlockDestination, HdcpMode; 9.12 ForcedSignalType,
      ForcedScrambling, Conversion); presets (9.16: create, save, load,
      rename); EDID (9.18: EdidStatus, switch, copy).
  - title: "MMX2 series User Manual, rev. v3 (2026-09-01), FW package v2.16.0b6"
    author: Lightware Visual Engineering PLC.
    url: https://assets.prod.pim.lightware.com/assets/File-Downloads/Guides-and-Manuals/User-Manual/MMX2_series_UserManual.pdf
    note: >
      Manufacturer document. Chapter 7, LW3 Programmers' Reference (/V1
      tree): general rules, names case-sensitive up to FW v2.9.0, 18 clients
      over WS/WSS/LW3 together (7.4.2); prefixes, errors (%E002:Not exist),
      signature, subscription and CHG (7.4.4-7.4.10); system (7.5: DeviceLabel
      49 characters, restart, factoryDefaults, PACKAGE.Version, ControlLock,
      identifyMe, DARKMODE); video (7.6: XP:switch, switch(0:out), switchAll,
      XP/<port>.Lock and .Mute, AUTOSELECT Policy/Included/Priority 1-100,
      XP/<out>.ConnectedSource, SWITCHABLE, ConnectedDestinations,
      SignalPresent, AllowedHdcpVersion, OutputSignalType,
      EmbeddedAudioPresent, EmbeddedAudioMute, Output5VMode); CEC (7.7: send,
      sendUserControlClick, code list); audio (7.8: AUDIO/XP:switch,
      ConnectedSource, AUTOSELECT Policy and VideoFollowPort, XP Lock/Mute,
      port Mute, SignalPresent, VolumedB -95.62..0 in 0.375 dB steps,
      VolumePercent, Balance -100..100, step methods); EDID (7.9); network
      security (7.11: LW3 service on 6107 has no authentication and can be
      disabled). Section 6.3.4 names the Connected and Name port properties.
  - title: "Taurus UCX series User Manual, rev. v4 (2026-09-14), FW package v2.22.9b1 (HC40) / v2.16.1b2 (HC30)"
    author: Lightware Visual Engineering PLC.
    url: https://assets.prod.pim.lightware.com/assets/File-Downloads/Guides-and-Manuals/User-Manual/HTML/UCX_Series/UM.html
    note: >
      Manufacturer document. Chapter 8, LW3 Programmers' Reference: the same
      /V1 tree as MMX2 plus the I1/I5 crosspoint limitation answered
      "%E006: Illegal operation" (8.6.1), welcome screen, USB crosspoint (8.11:
      USB/XP:switch(<host>:H1), H1.ConnectedSource, Lock, autoselect),
      USB-C, and the known issue that CHG EmbeddedAudioPresent on outputs can
      be missed (release notes). Port numbering per model (12.2).
  - title: "UMX-HDMI-140 / UMX-HDMI-140-Plus User Manual, FW package v1.3.1b2"
    author: Lightware Visual Engineering PLC.
    url: https://assets.prod.pim.lightware.com/assets/File-Downloads/Guides-and-Manuals/User-Manual/HTML/UMX-HDMI-140_Series/UM.html
    note: >
      Manufacturer document. Chapter 7, LW3 Programmers' Reference (UMX
      tree): system (7.4: ProductName, UID.DeviceLabel 39 characters,
      SYS/MB.FirmwareVersion, UID.PackageVersion, SYS:reset, factoryDefaults,
      UI.ControlLock 0/1/2, identifyMe, CTRL/MACROS:run); Cleartext login
      (7.5: LOGIN:login, logout, LoginEnable; valid until the TCP socket
      breaks); video (7.6: SourcePortStatus and DestinationPortStatus with a
      letter and two hex bytes, DestinationConnectionList, XP:switch,
      setDestinationPortAutoselect, mute/lock methods, HdcpEnable,
      HdcpModeSetting, FreeRunMode, HdmiModeSetting, ColorSpaceSetting); audio
      (7.7: the same for /MEDIA/AUDIO/XP, input Volume and Balance).
  - title: "Security features in Lightware products, Application Notes, rev. v1"
    author: Lightware Visual Engineering PLC.
    url: https://assets.prod.pim.lightware.com/assets/File-Downloads/Guides-and-Manuals/Application-Note/Security_Guide.pdf
    note: >
      Which products have the Cleartext login (UMX-HDMI-140-Plus,
      UMX-TPS-TX140-Plus and others) and that LW2 on port 10001 is not
      covered by it.
  - title: companion-module-lightware-lw3 (Bitfocus Companion module, MIT)
    url: https://github.com/bitfocus/companion-module-lightware-lw3
    note: >
      Corroboration only, read for behaviour, no code copied: chooses the MX2
      tree by ProductName, opens /MEDIA/XP/VIDEO and reads
      DestinationConnectionStatus / DestinationConnectionList as
      semicolon-separated I<n> or 0 per output, and reads MX2 port names from
      /MEDIA/NAMES/VIDEO as <n>;<label>.

transport:
  type: line-tcp
  port: 6107
  framing: terminated
  terminator: crlf
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # Every answer starts with a two-character prefix and a space (pr, pw, pE,
  # mO, mF, mE, nE, n-, o-, c-...). A change notification starts "CHG " and is
  # never the reply to a command.
  reply_match: '^[pmnoc][-rwmEOFs] '
  probe: 'GET /.SerialNumber'

# Cleartext login password (UMX-HDMI-140-Plus and other products with the
# Basic IT security pack). Left empty when the login is not enabled.
settings:
  password:
    type: string
    secret: true
    default: ''
    pattern: '^[^\\{}#%()\r\n\t]*$'

on_connect:
  - when_set: password
    send: 'CALL /LOGIN:login({settings.password})'
    await_reply: true

