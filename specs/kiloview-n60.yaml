        decoder.resolution: "{resolution}"
        decoder.width: "{width}"
        decoder.height: "{height}"
        decoder.frame_rate: "{frame_rate}"
        decoder.interlaced: { value: "{interlaced}", map: { "0": false, "1": true } }
