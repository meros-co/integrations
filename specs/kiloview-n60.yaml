quirks:
  - models: [all]
    severity: warning
    text: >
      Authentication. Kiloview's login (1.1.1) answers the token in its JSON
      body, and the document's web front end then sends it back in a cookie it
      builds from the user name, alias and token, checked by the session
      endpoint (1.1.2); the Companion module sends the same token as the
      Authorization header, as it is, beside an App header of user, token and
      language. With the password setting set, the core logs in with the
      username and password settings, keeps the token the answer holds
      (data.token), and sends it on every later request as Authorization, in
      a Cookie of language, user and token, and in the App header;
      check_session tells whether it is still valid. With the password empty
      nothing logs in and the three headers are left out (the Companion
      module sends Cookie and App with an empty token instead). Neither
      document says which endpoints need a token, how long it lasts,
      whether a reboot ends it, or how the device refuses a missing or
      stale one (the Companion module logs in again when a reply holds
      result error or code 401); an HTTP 401 or 403 has the core log in
      again and send the request once more. A login answered with result
      error is the terminal refusal of the credential.

  - models: [all]
    severity: info
    text: >
      The login reply's changed field is false while the user still has the
      initial password; the web page then insists on a new one. The API has
      no endpoint to change a password (modify_user changes only the alias
      and the web and API flags), so a password is changed on the web page.
      The document's login example uses admin and Admin123; the Companion
      module's default is admin and admin.

  - models: [all]
    severity: critical
    text: >
      set_mode switches between encoding and decoding by restarting the
      device, which is gone for about a minute (2.6.1); every stream or
      decoded output stops. The reply is the bare JSON value true.

  - models: [all]
    severity: critical
    text: >
      factory_reset clears every setting, network addressing included, and
      reboot restarts the device at once; neither can be undone, and the
      device may come back at another address. restart_codec (the document's
      Reset, 1.3.7) restarts the encoding and decoding service, interrupting
      every stream and the decoded output.

  - models: [all]
    severity: critical
    text: >
      upload_firmware sends a firmware file the device installs; the document
      describes only the upload (a multipart/form-data field named file), not
      whether the device then checks, installs and restarts on its own. A
      wrong or interrupted file can leave the device unusable.

  - models: [all]
    severity: critical
    text: >
      set_interface, set_interface_enabled and set_bonding change the device's
      addressing and can cut the connection the core uses; set_bonding gives
      no reply at all (3.1.6), so it may time out even when it worked, and the
      document gives no way back from link aggregation to two interfaces.
      set_web_protocols can turn off the protocol or move the port the core
      is using (HTTP and HTTPS cannot both be off); the device must then be
      opened again with the new scheme or port.

  - models: [all]
    severity: critical
    text: >
      delete_recorded_file deletes a recording for good. remove_nas unmounts
      a share and remove_user, remove_preset and delete_route delete what they
      name; each can only be added again by hand.

  - models: [all]
    severity: warning
    text: >
      set_serial_number writes the serial number assigned at manufacture,
      through a path holding a fixed key (1.3.11); other software (NDI names,
      the intercom, Kilolink, licensing) may rely on the serial number.

  - models: [all]
    severity: warning
    text: >
      Encoder changes: set_encoder_quality takes effect live, while set_hx_codec
      (and other main stream settings, per 2.5.5) restart the encoder, giving a
      short black output. The quality is set as a level (55 very low, 75 low,
      100 default, 150 high, 200 very high), but the encoder's
      target_bitrate and max_bitrate read back as other numbers (10000 in the
      document's example) with no unit given, so the level written is not the
      value read. Only quality, codec, HX version and color format are
      documented as settable; profile, GOP, rate control, B-frames and the
      other encoder values are read-only through the API.

  - models: [all]
    severity: warning
    text: >
      The document's color-format table for set_hx_color_format labels NV12
      as YUV 4:2:0 8-bit, NV16 as 4:2:0 10-bit, NV12_10LE32 as 4:2:2 8-bit and
      NV16_10LE32 as 4:2:2 10-bit; by the usual meaning of these pixel-format
      names NV16 is 4:2:2 8-bit and NV12_10LE32 4:2:0 10-bit. The values are
      sent as named; which picture each gives is to be checked on a device.

  - models: [all]
    severity: info
    text: >
      Reading the sub encoder (sub, the NDI|HX sub-stream) gives inaccurate
      values in the current firmware, per the document (2.5.3); it has no set
      or stream endpoints. A stream's connections count is reserved and
      always 0 (2.5.11).

  - models: [all]
    severity: info
    text: >
      Earlier firmware (N60 WEB API Version 2.01) has no multi-protocol (SRT)
      stream, no storage or recording (chapter 6), and takes choose_encode
      with main and main_full only, and spells the Kilolink module
      /api/KiloLink/. This spec follows the newer document (firmware
      2.02.0008 and later): on earlier firmware the srt field of
      set_encode_streams, the multi_protocol stream and the record commands are
      not served, and the Kilolink commands may need the older spelling. The
      older document's talk interfaces 5.1.11 and 5.1.12 are device-to-device
      calls not meant for a front end, and are not built.

  - models: [all]
    severity: info
    text: >
      Nothing is pushed to an API client: the web page's live bitrate comes
      from a backend push the document does not describe (2.5.11), so state
      is polled, status every 5 seconds, show settings every 30 and
      configuration every 2 minutes. Both modes' endpoints are polled; in
      encoding mode the decoder's reads, and in decoding mode the encoder's,
      may answer errors or stale values, which the rules ignore or keep.

  - models: [all]
    severity: info
    text: >
      API limits: the API reports no temperature, fan, dropped or lost frames,
      input audio levels or decoder buffer state; the time zone, the clock,
      NTP servers and the blank color can be set but not read; the recording
      state has no endpoint of its own, only the current flag of a file in
      get_recorded_files; the Kilolink authorization code is readable
      (get_kilolink) but kept out of state as a credential; the NDI multicast
      prefix, mask and TTL of a stream are readable but not settable.

  - models: [all]
    severity: info
    text: >
      ChangeLinkinfo (3.1.2) is documented as a backup interface that does
      not configure the device, so it is not built; set_interface
      (SetEthernets) is the one that does. set_interface requires every field,
      the MAC address included, which is passed as get_network reports it.

  - models: [all]
    severity: info
    text: >
      The decoded camera's PTZ (decode_ptz_control) and a camera on the
      encoder (ptz_control) take an action and a speed. The document names up,
      down, left, right, home, stop-move and stop-all, and mentions zoom,
      focus and preset actions (with an id, 1 to 16) without naming them, so
      only the named actions are built. Speed is sent with every action and
      the document says home and the stops do not need it.

  - models: [all]
    severity: info
    text: >
      set_decode_output writes the whole decoder output at once: resolution,
      both channel counts, all eight HDMI and line-out channel mappings, HDCP
      and color space, as the document requires; unchanged values are passed
      as get_decode_info reports them (decoder.* state). output_framerate is
      documented as having no effect and is sent as 0. The document's output
      side is written for the N60's HDMI output; how the N50 applies the HDMI
      channel settings to its SDI output is not described.

  - models: [all]
    severity: info
    text: >
      A preset's online state comes from NDI discovery only (2.3.1): a source
      can be listed online and still not decode. set_blank_color has no read
      endpoint.

  - models: [all]
    severity: info
    text: >
      Several requests are documented with their parameters but not their
      exact form, and are built the usual way: set_hostname, remove_nas,
      get_recorded_files, the two PTZ controls and validate_kilolink_token as
      query parameters of the GET; set_discovery_server as a JSON body of
      enable and address. Requests carry an App header with language en so
      error replies have a message (1.1.1).

  - models: [all]
    severity: info
    text: >
      get_mode is answered as plain text (encode or decode) per the document;
      the Companion module reads a JSON reply holding the mode on newer
      firmware, and the state rule takes either. The Companion module also
      uses endpoints Kiloview's documents do not list (encoders/get_encode
      and choose_encode with an encode_mode such as hb_hx, signal_status,
      get_dynamic_states, net_stream, streams/multi_protocol/get and
      enable_stream for RTMP, HLS, UDP, RTP, SRT and RTSP outputs,
      codec/audio/set, and output resolution 4096x2160); they are not built
      until Kiloview documents them.

  - models: [all]
    severity: info
    text: >
      Recording records the NDI|HX stream only (6.1.4). auto_record is
      reserved and disabled in the current firmware (6.2.1). Sizes in the
      storage replies are in MB, those of getSystemInfo in kB, and the
      percentages there are spelled precent. set_record_settings and
      start_recording are documented with no reply body. The Kiloview FN-50
      and FN-60 cards, which the Companion module names, are not in either
      document and are not listed here.

  - models: [all]
    severity: info
    text: >
      set_talk_language takes cn or zh; the document describes cn as English
      and zh as Chinese, while the login's App header uses en and zh. The
      talk function needs HTTPS turned on (1.3.5).
