              codec: "$.data.codec", bitrate: "$.data.bitrate", deinterlace: "$.data.deInterlace",
              interlaced: "$.data.interlaced", frame_rate: "$.data.frame_rate", audio: "$.data.audio", url: "$.data.url",
              width: "$.data.xRes", height: "$.data.yRes", sampling: "$.data.audio_sampling",
              channels: "$.data.audio_channels", hdcp: "$.data.hdcp", colorspace: "$.data.out_colorspace",
              supported: "$.data.supported", res_choose: "$.data.output_resolution_choose",
              out_res: "$.data.output_resolution", hdmi_channels: "$.data.hdmi_channels",
              hdmi_map: "$.data.hdmi_channels_mapping", line_channels: "$.data.line_out_channels",
