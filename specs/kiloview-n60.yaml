        "encoders.{1}.input.frame_rate": "{rate}"
        "encoders.{1}.input.frame_rate_denominator": "{rate_d}"
        "encoders.{1}.input.interlaced": { value: "{interlaced}", map: { "0": false, "1": true } }
        "encoders.{1}.input.io_mode": "{io_mode}"
        "encoders.{1}.input.device": "{device}"
        "encoders.{1}.input.signal": "{signal}"
        "encoders.{1}.input.resolution": "{resolution}"
        "encoders.{1}.input.source": "{source}"
        "encoders.{1}.enabled": { value: "{enable}", map: { "0": false, "1": true } }
        "encoders.{1}.pipeline_started": "{started}"
    - path: "^/api/codec/streams/(main|main_full|multi_protocol)/[a-z-]+/get$"
      json: { type: "$.type", name: "$.name", enable: "$.enable", group: "$.group", ttl: "$.ttl",
              channel: "$.channel_name", connection: "$.connection", netmask: "$.netmask", netprefix: "$.netprefix",
              ds_enable: "$.discovery_server.enable", ds_address: "$.discovery_server.address",
              started: "$.started", source: "$.source" }
      state:
        "streams.{1}.type": "{type}"
        "streams.{1}.name": "{name}"
        "streams.{1}.enabled": "{enable}"
        "streams.{1}.started": "{started}"
        "streams.{1}.group": "{group}"
        "streams.{1}.channel_name": "{channel}"
        "streams.{1}.connection": "{connection}"
        "streams.{1}.multicast_ttl": "{ttl}"
        "streams.{1}.multicast_netmask": "{netmask}"
        "streams.{1}.multicast_prefix": "{netprefix}"
        "streams.{1}.discovery_server_enabled": "{ds_enable}"
        "streams.{1}.discovery_server_address": "{ds_address}"
        "streams.{1}.source": "{source}"
    - path: "^/api/codec/streams/(main|main_full|multi_protocol)/[a-z-]+/get_dynamic_state$"
      json: { bitrate: "$.bitrate", connections: "$.connections" }
