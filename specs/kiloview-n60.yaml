    # ── Read-backs after a change ──
    - path: "^/api/systemctrl/users/(add|remove|modify)$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/systemctrl/users/list }]
    - path: "^/api/systemctrl/system/setHostname\\?"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/systemctrl/system/getHostname }]
    - path: "^/api/systemctrl/system/setProtocol$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/systemctrl/system/getProtocol }]
    - path: "^/api/codec/decode/(addSpec|add|output_set|setConnection)$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/codec/decode/get }]
    - path: "^/api/codec/discovery/setDiscoveryServer$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/codec/discovery/getDiscoveryServer }]
    - path: "^/api/codec/discovery/addManualIpsGroups$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/codec/discovery/getManualIpsGroups }, { method: GET, path: /api/codec/discovery/scan }]
    # Documented with no reply body: any answer has the names read again.
    - path: "^/api/codec/discovery/setDiscoveryGroupChannel$"
      json: {}
      then_send: [{ method: GET, path: /api/codec/discovery/getDiscoveryGroupChannel }]
    - path: "^/api/codec/preset/(add|remove)$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/codec/preset/get }]
    - path: "^/api/codec/encoders/choose_encode$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send:
        - { method: POST, path: /api/codec/encoder/main/get_capture }
        - { method: POST, path: /api/codec/encoder/main_full/get_capture }
        - { method: POST, path: /api/codec/encoder/multi_protocol/get_capture }
        - { method: GET, path: /api/codec/streams/main/ndi-hx/get }
        - { method: GET, path: /api/codec/streams/main_full/ndi-full/get }
        - { method: GET, path: /api/codec/streams/multi_protocol/srt/get }
    - path: "^/api/codec/encoder/(main|main_full|multi_protocol)/set$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: POST, path: "/api/codec/encoder/{1}/get" }]
    - path: "^/api/codec/streams/(main|main_full|multi_protocol)/([a-z-]+)/set$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: "/api/codec/streams/{1}/{2}/get" }]
    - path: "^/api/codec/streams/(main|main_full|multi_protocol)/reset$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: "/api/codec/streams/{1}/{1:map.stream_key}/get" }]
    - path: "^/api/codec/ptz/modify$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/codec/ptz/getPtzInfo }]
    - path: "^/api/networkmanager/network/(SetSwitch|SetEthernets)$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/networkmanager/network/GetLinkinfo }]
    - path: "^/api/networkmanager/static/routing/(add|modify|del|set)$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/networkmanager/static/routing/get }]
    - path: "^/api/kilolink/set$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/kilolink/get }]
    - path: "^/api/talk/(addDevice|deleteDevice|setLDLinkDEnable|setWLinkDEnable|setLDLinkSEnable)$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/talk/queryDeviceList }, { method: GET, path: /api/talk/queryLDeviceConnectStatus }]
    - path: "^/api/record/storage/(add_nas|remove_nas)(\\?|$)"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/record/storage/disk_list }]
    # Documented with no reply body: any answer has the settings read again.
    - path: "^/api/record/record/settings$"
      json: {}
      then_send: [{ method: GET, path: /api/record/record/get_record_info }, { method: GET, path: /api/record/storage/disk_list }]

