    - path: "^/api/talk/talkVersion$"
      json_match: { "$.result": "^ok$" }
      json: { version: "$.msg.version" }
      state: { talk.version: "{version}" }
    - path: "^/api/talk/queryLocalDeviceSerial$"
      json_match: { "$.result": "^ok$" }
      json: { serial: "$.msg.serial" }
      state: { talk.serial: "{serial}" }

