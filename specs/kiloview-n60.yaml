              n_port: "$.data.network.port", n_ptz: "$.data.network.ptz_protocol", n_ptz_addr: "$.data.network.ptz_addr",
              s_dev: "$.data.serial.device", s_baud: "$.data.serial.baudrate", s_parity: "$.data.serial.parity",
              s_data: "$.data.serial.startBits", s_stop: "$.data.serial.endBits", s_xon: "$.data.serial.xonxoff",
              s_rts: "$.data.serial.rtscts", s_ptz: "$.data.serial.ptz_protocol", s_ptz_addr: "$.data.serial.ptz_addr" }
      state:
        ptz.enabled: { value: "{enable}", map: { "0": false, "1": true, "false": false, "true": true } }
        ptz.link: "{typ}"
        ptz.network.transport: "{n_proto}"
        ptz.network.host: "{n_addr}"
