        "storage.disks.{id:key}.host": "{host}"
        "storage.disks.{id:key}.volume": "{volume}"
        "storage.disks.{id:key}.mount_point": "{mounted}"
        "storage.disks.{id:key}.file_system": "{filesys}"
        "storage.disks.{id:key}.status": "{status}"
        "storage.disks.{id:key}.chosen": "{choose}"
        "storage.disks.{id:key}.disk_type": "{disk_type}"
        "storage.disks.{id:key}.total_mb": "{total}"
