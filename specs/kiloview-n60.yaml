        "network.interfaces.{device:key}.enabled": "{enable}"
        "network.interfaces.{device:key}.dns": "{dns}"
    - path: "^/api/networkmanager/network/GetEthernets\\?"
      json_match: { "$.result": "^ok$" }
      json: { device: "$.data.device", status: "$.data.status", address: "$.data.address", netmask: "$.data.netmask",
              gw: "$.data.gw", mac: "$.data.mac", method: "$.data.method", enable: "$.data.enable", dns: "$.data.dns" }
