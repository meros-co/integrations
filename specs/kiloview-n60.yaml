        network.bonding.netmask: "{netmask}"
        network.bonding.gateway: "{gw}"
        network.bonding.dns: "{dns}"
        network.bonding.mode: { value: "{mode}", map: { "0": round-robin, "1": active-backup } }
        network.bonding.eth0_link: "{eth0}"
        network.bonding.eth1_link: "{eth1}"
    - path: "^/api/networkmanager/static/routing/get$"
      json: { routes: "$" }
      state: { network.static_routes: "{routes}" }

