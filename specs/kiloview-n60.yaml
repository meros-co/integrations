        ptz.serial.data_bits: "{s_data}"
        ptz.serial.stop_bits: "{s_stop}"
        ptz.serial.xonxoff: { value: "{s_xon}", map: { "0": false, "1": true } }
        ptz.serial.rtscts: { value: "{s_rts}", map: { "0": false, "1": true } }
        ptz.serial.protocol: "{s_ptz}"
