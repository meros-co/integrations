    params:
      value: { type: enum, values: ["automatic", "overrun", "request", "push_to_talk"], required: true, label: "Conference mode", description: "Conference mode: automatic, overrun, request or push_to_talk." }
    send: "ConferenceMode {value:map.conference_mode}"
    expect: { reply_contains: "ConferenceMode ", not_contains: "error" }
