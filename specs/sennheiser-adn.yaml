commands:
  get_auto_frequency_selection:
    summary: "Read: antenna modules choose their frequency automatically (AutoFreqSelection, p.9)"
    send: "AutoFreqSelection"
    expect: { reply_contains: "AutoFreqSelection ", matches: "AutoFreqSelection (-?[0-9]+)$" }
    returns: value

  set_auto_frequency_selection:
    summary: "Set: antenna modules choose their frequency automatically (AutoFreqSelection, p.9)"
    params:
      enabled: { type: bool, required: true, label: "Antenna modules choose their frequency automatically", description: "On turns it on, off turns it off: antenna modules choose their frequency automatically." }
    send: "AutoFreqSelection {enabled:bool01}"
    expect: { reply_contains: "AutoFreqSelection ", not_contains: "error" }
    returns: ack

  get_blink_on_request:
    summary: "Read: microphone rings blink for a request to speak (BlinkOnReq, p.9)"
    send: "BlinkOnReq"
    expect: { reply_contains: "BlinkOnReq ", matches: "BlinkOnReq (-?[0-9]+)$" }
    returns: value

  set_blink_on_request:
