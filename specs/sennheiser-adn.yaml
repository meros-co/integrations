      - set_xlr_out_eq_high
      - adjust_xlr_out_eq_high
      - get_xlr_out_eq_mid
      - set_xlr_out_eq_mid
      - adjust_xlr_out_eq_mid
      - get_xlr_out_eq_low
      - set_xlr_out_eq_low
      - adjust_xlr_out_eq_low
      - get_xlr_out_feedback_suppression
      - set_xlr_out_feedback_suppression
      - get_antenna_channel
