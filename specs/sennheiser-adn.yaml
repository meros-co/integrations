spec: 1
id: sennheiser-adn
name: Sennheiser ADN conference system (MediaCtrl protocol)
vendor: Sennheiser
category: other

# The ADN CU1 central unit's media control protocol: plain text over TCP
# 53252, each message a keyword and its parameters ended by ";", no line
# ending. A client is an observer: every change to a setting, wherever it was
# made, is sent to it as "Keyword value;", and a set or a get is answered the
# same way. Conference units are addressed by serial number (with their type
# code) or, wired ones, by bus position. ADN does not speak SSC.
source:
  - title: "Audio Distribution Network: MediaCtrl Protocol, Publ. 03/15, 549157/A02"
    author: Sennheiser
    url: https://assets.sennheiser.com/download/assets/QG_ADNMediaCtrlProtocol_A02_EN.pdf/1f94ac1ce7b811f0bce7beb43c66122a
    note: >
      Manufacturer document; pages are the document's own. TCP server on 53252,
      about 45 s after the central unit starts, messages ended by ";", several
      in one packet, about 100 ms between commands p.3-4; set, get, updates
      pushed to every client, relative changes with # and errors p.4-5; the
      commands p.6-25; error codes 1000-1070 p.26.
  - title: "Media Control Systems: 3rd party control of Sennheiser products (AN 1260 v1.0), p.5 and p.7"
    author: Sennheiser
    url: https://assets.sennheiser.com/download/assets/AN_1260_v1.0_Media_Control_Systems_EN.pdf/d2d66562e7b411f08c892a34179bc91d
    note: >
      Manufacturer document. ADN is controlled with the Media Control
      Protocol, not SSC; its other ports (53248-53251) are the central unit's
      own discovery and monitoring.

transport:
  type: line-tcp
  port: 53252
  framing: delimited
  close: ";"
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # Answers and pushed changes are the same "Keyword value;" messages, told
  # apart by the keyword (expect.reply_contains); errors name nothing.
  error_match: '^\s*error [0-9]+'
  probe: "FloorVolume"
  pacing:
    min_interval_ms: 100

ports:
  - { port: 53252, protocol: tcp, role: control }

maps:
  eq: { "12": "1", "11": "2", "10": "3", "9": "4", "8": "5", "7": "6", "6": "7", "5": "8", "4": "9", "3": "10", "2": "11", "1": "12", "0": "13", "-1": "14", "-2": "15", "-3": "16", "-4": "17", "-5": "18", "-6": "19", "-7": "20", "-8": "21", "-9": "22", "-10": "23", "-11": "24", "-12": "25" }
  sensitivity: { "-18.0": "1", "-16.5": "2", "-15.0": "3", "-13.5": "4", "-12.0": "5", "-10.5": "6", "-9.0": "7", "-7.5": "8", "-6.0": "9", "-4.5": "10", "-3.0": "11", "-1.5": "12", "0.0": "13", "1.5": "14", "3.0": "15", "4.5": "16", "6.0": "17", "7.5": "18", "9.0": "19", "10.5": "20", "12.0": "21", "13.5": "22", "15.0": "23", "16.5": "24", "18.0": "25" }
  floor_mix: { "0.0": "1", "0.5": "2", "1.0": "3", "1.5": "4", "2.0": "5", "2.5": "6", "3.0": "7", "linear": "8" }
  premonition: { "0": "1", "10": "2", "20": "3", "30": "4", "40": "5", "50": "6", "60": "7", "70": "8", "80": "9", "90": "10", "100": "11", "110": "12", "120": "13" }
  rf_power: { "0": "1", "20": "2", "40": "3", "60": "4", "80": "5", "100": "6" }
  conference_mode: { "automatic": "1", "overrun": "2", "request": "3", "push_to_talk": "4" }
  feedback_suppression: { "off": "1", "low": "2", "high": "3" }

models:
  - id: adn-cu1
    name: Sennheiser ADN CU1 central unit (wired ADN C1/D1 and wireless ADN-W C1/D1 units, ADN-W AM antenna modules)
    supports:
