      second: { type: int, min: 0, max: 59, required: true, label: "Second", description: "Second, 0 to 59." }
    send: "SetCUDateTime {year} {month} {day} {hour} {minute} {second}"
    returns: none

quirks:
  - models: [all]
    severity: critical
    text: >
      reinitialize_system restarts the conference system, all_mics_off cuts
      every speaker, and the antenna channel and power change the radio link
      of every wireless unit on that module. None can be undone from here.
  - models: [all]
    severity: info
    text: >
      Every change to a setting is pushed to every connected client, so after
      reading the system settings once on connecting nothing is polled.
      Conference units cannot be listed over this protocol: their serial
      numbers or bus positions come from the central unit or Conference
      Manager, and their status, speaking time, battery and RF are read with
      the get commands, after which changes arrive unasked. Wired units
      always answer with their bus position, even when addressed by serial
      number. Opened for commands only, nothing is read.
  - models: [all]
    severity: info
    text: >
      Sennheiser asks for about 100 ms between commands; the core keeps that.
      Equalizers run from +12 dB (wire 1) to -12 dB (wire 25); a relative
      change (adjust_*) moves the wire value, so a positive step lowers an
      equalizer band. The central unit accepts connections about 45 s after
      it starts.

state:
  auto_frequency_selection: { type: bool, description: "Antenna modules choose their frequency automatically (AutoFreqSelection)" }
  blink_on_request: { type: bool, description: "Microphone rings blink for a request to speak (BlinkOnReq)" }
  clear_cleans_request_list: { type: bool, description: "Clearing also empties the request list (ClearDoesCleanRequestList)" }
  conference_mode: { type: string, description: "Conference mode: automatic, overrun, request or push_to_talk (ConferenceMode)" }
  wireless_unit_shutdown: { type: bool, description: "Participants may switch wireless units off (EnableSUwShutdown)" }
  floor_eq_high: { type: string, description: "Unit loudspeakers' treble in dB, -12 to +12 (FloorEqualizerHigh)" }
  floor_eq_mid: { type: string, description: "Unit loudspeakers' mid in dB, -12 to +12 (FloorEqualizerMid)" }
  floor_eq_low: { type: string, description: "Unit loudspeakers' bass in dB, -12 to +12 (FloorEqualizerLow)" }
  floor_mix: { type: string, description: "Gain reduction per open microphone in dB (0.0 to 3.0 in 0.5 steps), or linear division (FloorMix)" }
  floor_volume: { type: int, description: "Unit loudspeaker volume, 0 to 32 (FloorVolume)" }
  hd_recording: { type: bool, description: "Recording to the central unit's disk (HdRecordIsActive)" }
  talk_time_limit: { type: int, description: "Speaking time limit in minutes, 0 unlimited (LimitOfTalkTime)" }
  max_open_mics: { type: int, description: "Most microphones on at once, 1 to 10 (MaxOpenMic)" }
  max_requests: { type: int, description: "Longest request list, 1 to 10 (MaxSpeakReqListLength)" }
  open_access: { type: bool, description: "Open access mode (OpenAccessMode)" }
  premonition_time: { type: string, description: "Warning before the speaking time ends, in seconds: 0 to 120 in steps of 10 (PremonitionTime)" }
  unit_feedback_suppression: { type: string, description: "Unit loudspeaker feedback suppression: off, low or high (SpeakerFeedbackSuppression)" }
  mic_loudspeaker_mute: { type: bool, description: "A unit's loudspeaker mutes while its microphone is on (SwitchableMicVolumeIsActive)" }
  talk_time_hard_cut_off: { type: bool, description: "The microphone is cut off when the speaking time ends (TalkTimeExpirationHardCutOff)" }
  talk_time_limit_active: { type: bool, description: "Speaking time limit on (TalkTimeLimitIsActive)" }
  xlr_mix_minus: { type: bool, description: "XLR mix-minus on (XLRMixMinusIsActive)" }
  xlr_in: { type: bool, description: "XLR input on (XLRinStatus)" }
  xlr_in_sensitivity: { type: string, description: "XLR input sensitivity in dBu, -18.0 to +18.0 in 1.5 dB steps (XLRinSensitivity)" }
  xlr_in_eq_high: { type: string, description: "XLR input treble in dB, -12 to +12 (XLRinEqHigh)" }
  xlr_in_eq_mid: { type: string, description: "XLR input mid in dB, -12 to +12 (XLRinEqMid)" }
  xlr_in_eq_low: { type: string, description: "XLR input bass in dB, -12 to +12 (XLRinEqLow)" }
  xlr_out: { type: bool, description: "XLR output on (XLRoutStatus)" }
  xlr_out_volume: { type: int, description: "XLR output volume in dB, -20 to +11 (XLRoutVolume)" }
  xlr_out_eq_high: { type: string, description: "XLR output treble in dB, -12 to +12 (XLRoutEqHigh)" }
  xlr_out_eq_mid: { type: string, description: "XLR output mid in dB, -12 to +12 (XLRoutEqMid)" }
  xlr_out_eq_low: { type: string, description: "XLR output bass in dB, -12 to +12 (XLRoutEqLow)" }
  xlr_out_feedback_suppression: { type: string, description: "XLR output feedback suppression: off, low or high (XLROutFeedbackSuppression)" }
  antenna_modules.*.rf_channel: { type: int, description: "RF channel, 1-30, or 31 while searching (AmRfChannel), keyed by serial number" }
  antenna_modules.*.rf_power: { type: string, description: "RF output power in percent: 0, 20, 40, 60, 80 or 100 (AmRfOutputPower)" }
  wired_units.*.status: { type: string, description: "Microphone status: on, on_muted, on_premonition, on_premonition_muted, on_overrun, on_overrun_muted, off, off_request, mapping, service_calibrate or mapping_request (MicStatus), keyed by bus position" }
  units.*.status: { type: string, description: "Microphone status: on, on_muted, on_premonition, on_premonition_muted, on_overrun, on_overrun_muted, off, off_request, mapping, service_calibrate or mapping_request (MicStatusSN), keyed by serial number" }
  wired_units.*.talk_time: { type: int, description: "A wired unit's speaking time so far, in seconds (LapsedTalkTime)" }
  units.*.talk_time: { type: int, description: "A unit's speaking time so far, in seconds (LapsedTalkTimeSN)" }
  units.*.battery: { type: int, description: "A wireless unit's battery charge in percent (MicBatteryStatus)" }
  units.*.external_power: { type: bool, description: "Whether a wireless unit runs on its external power supply (MicExtPowerSupply)" }
  units.*.rf_quality: { type: int, description: "A wireless unit's RF quality in percent (MicRfStatus)" }
  hd_recording_error: { type: bool, description: "Recording to disk with a disk error (HdRecordError)" }
  error.code: { type: int, description: "Last error code: 1000 invalid command, 1010 invalid parameter, 1020 out of range, 1030 relative change not supported, 1040 wrong number of parameters, 1050 get not allowed, 1060 set not allowed, 1070 not possible now" }
  error.message: { type: string, description: "Last error text" }

telemetry:
  poll:
    send: ["AutoFreqSelection", "BlinkOnReq", "ClearDoesCleanRequestList", "ConferenceMode", "EnableSUwShutdown", "FloorEqualizerHigh", "FloorEqualizerMid", "FloorEqualizerLow", "FloorMix", "FloorVolume", "HdRecordIsActive", "LimitOfTalkTime", "MaxOpenMic", "MaxSpeakReqListLength", "OpenAccessMode", "PremonitionTime", "SpeakerFeedbackSuppression", "SwitchableMicVolumeIsActive", "TalkTimeExpirationHardCutOff", "TalkTimeLimitIsActive", "XLRMixMinusIsActive", "XLRinStatus", "XLRinSensitivity", "XLRinEqHigh", "XLRinEqMid", "XLRinEqLow", "XLRoutStatus", "XLRoutVolume", "XLRoutEqHigh", "XLRoutEqMid", "XLRoutEqLow", "XLROutFeedbackSuppression", "HdRecordError"]
  updates:
    - match: "^\\s*AutoFreqSelection ([01])$"
      state: { "auto_frequency_selection": { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^\\s*BlinkOnReq ([01])$"
      state: { "blink_on_request": { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^\\s*ClearDoesCleanRequestList ([01])$"
      state: { "clear_cleans_request_list": { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^\\s*ConferenceMode ([0-9]+)$"
      state: { "conference_mode": { value: "{1}", map: { "1": "automatic", "2": "overrun", "3": "request", "4": "push_to_talk" } } }
    - match: "^\\s*EnableSUwShutdown ([01])$"
      state: { "wireless_unit_shutdown": { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^\\s*FloorEqualizerHigh ([0-9]+)$"
      state: { "floor_eq_high": { value: "{1}", map: { "1": "12", "2": "11", "3": "10", "4": "9", "5": "8", "6": "7", "7": "6", "8": "5", "9": "4", "10": "3", "11": "2", "12": "1", "13": "0", "14": "-1", "15": "-2", "16": "-3", "17": "-4", "18": "-5", "19": "-6", "20": "-7", "21": "-8", "22": "-9", "23": "-10", "24": "-11", "25": "-12" } } }
    - match: "^\\s*FloorEqualizerMid ([0-9]+)$"
      state: { "floor_eq_mid": { value: "{1}", map: { "1": "12", "2": "11", "3": "10", "4": "9", "5": "8", "6": "7", "7": "6", "8": "5", "9": "4", "10": "3", "11": "2", "12": "1", "13": "0", "14": "-1", "15": "-2", "16": "-3", "17": "-4", "18": "-5", "19": "-6", "20": "-7", "21": "-8", "22": "-9", "23": "-10", "24": "-11", "25": "-12" } } }
    - match: "^\\s*FloorEqualizerLow ([0-9]+)$"
      state: { "floor_eq_low": { value: "{1}", map: { "1": "12", "2": "11", "3": "10", "4": "9", "5": "8", "6": "7", "7": "6", "8": "5", "9": "4", "10": "3", "11": "2", "12": "1", "13": "0", "14": "-1", "15": "-2", "16": "-3", "17": "-4", "18": "-5", "19": "-6", "20": "-7", "21": "-8", "22": "-9", "23": "-10", "24": "-11", "25": "-12" } } }
    - match: "^\\s*FloorMix ([0-9]+)$"
      state: { "floor_mix": { value: "{1}", map: { "1": "0.0", "2": "0.5", "3": "1.0", "4": "1.5", "5": "2.0", "6": "2.5", "7": "3.0", "8": "linear" } } }
    - match: "^\\s*FloorVolume (-?[0-9]+)$"
