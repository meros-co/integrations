      - set_floor_eq_high
      - adjust_floor_eq_high
      - get_floor_eq_mid
      - set_floor_eq_mid
      - adjust_floor_eq_mid
      - get_floor_eq_low
      - set_floor_eq_low
      - adjust_floor_eq_low
      - get_floor_mix
      - set_floor_mix
      - adjust_floor_mix
      - get_floor_volume
      - set_floor_volume
      - adjust_floor_volume
      - get_hd_recording
      - set_hd_recording
      - get_talk_time_limit
      - set_talk_time_limit
      - adjust_talk_time_limit
      - get_max_open_mics
      - set_max_open_mics
      - adjust_max_open_mics
      - get_max_requests
      - set_max_requests
      - adjust_max_requests
      - get_open_access
