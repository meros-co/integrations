    params:
      enabled: { type: bool, required: true, label: "Clearing also empties the request list", description: "On turns it on, off turns it off: clearing also empties the request list." }
    send: "ClearDoesCleanRequestList {enabled:bool01}"
    expect: { reply_contains: "ClearDoesCleanRequestList ", not_contains: "error" }
    returns: ack

  get_conference_mode:
