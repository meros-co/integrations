      - adjust_premonition_time
      - get_unit_feedback_suppression
      - set_unit_feedback_suppression
      - get_mic_loudspeaker_mute
      - set_mic_loudspeaker_mute
      - get_talk_time_hard_cut_off
      - set_talk_time_hard_cut_off
      - get_talk_time_limit_active
      - set_talk_time_limit_active
      - get_xlr_mix_minus
      - set_xlr_mix_minus
      - get_xlr_in
      - set_xlr_in
      - get_xlr_in_sensitivity
      - set_xlr_in_sensitivity
      - adjust_xlr_in_sensitivity
      - get_xlr_in_eq_high
      - set_xlr_in_eq_high
      - adjust_xlr_in_eq_high
      - get_xlr_in_eq_mid
      - set_xlr_in_eq_mid
      - adjust_xlr_in_eq_mid
      - get_xlr_in_eq_low
      - set_xlr_in_eq_low
      - adjust_xlr_in_eq_low
      - get_xlr_out
      - set_xlr_out
