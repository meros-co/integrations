  updates:
  - match: ^a [0-9a-fA-F]+ OK(0[01])x$
    request_match: '^ka '
    state:
      power:
        value: '{1}'
        map: {'00': false, '01': true}
  - models: &id005 [webos6, webos3, signage-2015]
    match: ^b [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$
    request_match: '^xb '
    state:
      input:
        value: '{1}'
        map: {'20': av, '40': component, '60': rgb, '70': dvi_d_pc, '80': dvi_d, '90': hdmi1, a0: hdmi1_pc, A0: hdmi1_pc, '91': hdmi2,
          a1: hdmi2_pc, A1: hdmi2_pc, '92': ops_hdmi3_dvi, a2: ops_hdmi3_dvi_pc, A2: ops_hdmi3_dvi_pc, '95': ops_dvi, a5: ops_dvi_pc,
          A5: ops_dvi_pc, '96': hdmi3_dvi, a6: hdmi3_dvi_pc, A6: hdmi3_dvi_pc, '97': hdmi3_hdmi2_dvi, a7: hdmi3_hdmi2_dvi_pc, A7: hdmi3_hdmi2_dvi_pc,
          '98': ops, a8: ops_pc, A8: ops_pc, '99': hdmi2_ops, a9: hdmi2_ops_pc, A9: hdmi2_ops_pc, c0: displayport, C0: displayport,
          d0: displayport_pc, D0: displayport_pc, c1: displayport_usbc, C1: displayport_usbc, d1: displayport_usbc_pc, D1: displayport_usbc_pc,
          c2: hdmi3, C2: hdmi3, d2: hdmi3_pc, D2: hdmi3_pc, c3: hdbaset, C3: hdbaset, d3: hdbaset_pc, D3: hdbaset_pc, e0: webos_player,
          E0: webos_player, e1: others, E1: others, e2: multi_screen, E2: multi_screen, e3: play_via_url, E3: play_via_url}
  - models: [commercial-tv]
    match: ^b [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$
    request_match: '^xb '
    state:
      input:
        value: '{1}'
        map: {'00': dtv, '01': cadtv, '10': atv, '11': catv, '20': av1, '21': av2, '40': component1, '41': component2, '60': rgb, '90': hdmi1,
          '91': hdmi2, '92': hdmi3, '93': hdmi4}
  - models: [webos6, webos3]
    match: ^c [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$
    request_match: '^kc '
    state:
      aspect_ratio:
        value: '{1}'
        map: {'02': full, '06': original}
  - models: [signage-2015, commercial-tv]
    match: ^c [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$
    request_match: '^kc '
    state:
      aspect_ratio:
        value: '{1}'
        map: {'01': '4_3', '02': '16_9', '04': zoom, '05': zoom2, '06': set_by_program, '07': '14_9', 09: just_scan, 0b: full_wide,
          0B: full_wide, 0c: '21_9', 0C: '21_9', '10': cinema_zoom_1, '11': cinema_zoom_2, '12': cinema_zoom_3, '13': cinema_zoom_4,
