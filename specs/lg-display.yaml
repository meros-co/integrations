          1D: cinema_zoom_14, 1e: cinema_zoom_15, 1E: cinema_zoom_15, 1f: cinema_zoom_16, 1F: cinema_zoom_16}
  - match: ^q [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$
    request_match: '^jq '
    state:
      energy_saving:
        value: '{1}'
        map: {'00': 'off', '01': minimum, '02': medium, '03': maximum, '04': auto, '05': screen_off}
  - models: [webos6, webos3]
    match: ^x [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$
    request_match: '^dx '
    state:
      picture_mode:
        value: '{1}'
        map: {'00': mall_qsr, '01': general, '02': gov_corp, '03': transportation, '04': education, '05': expert1, '06': expert2, 08: aps,
          09: photo, '11': calibration, '12': hospital}
  - models: [signage-2015]
    match: ^x [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$
    request_match: '^dx '
    state:
      picture_mode:
        value: '{1}'
        map: {'00': vivid, '01': standard, '02': cinema, '03': sports, '04': game, '05': expert1, '06': expert2, 08: aps, 09: photos,
          '11': calibration}
  - match: ^g [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$
    request_match: '^kg '
    state: {picture.contrast: '{1:hex}'}
  - match: ^h [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$
    request_match: '^kh '
    state: {picture.brightness: '{1:hex}'}
  - match: ^k [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$
    request_match: '^kk '
    state: {picture.sharpness: '{1:hex}'}
  - match: ^i [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$
