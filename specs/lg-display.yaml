spec: 1
id: lg-display
name: LG signage displays and commercial TVs (RS-232C external control protocol over LAN)
vendor: LG Electronics
category: display

# LG documents one ASCII protocol for its signage and commercial TVs: "[Command1][Command2] [Set ID] [Data]"
# ended by CR, acknowledged "[Command2] [Set ID] OK|NG[Data]x". The same messages are carried on TCP 9761 by
# the network models, and on the RS-232C port. A display reached through a serial-to-Ethernet bridge speaks
# the same protocol at the bridge's TCP port (see the quirks).
source:
  - title: "USER GUIDE, LG Digital Signage (MONITOR SIGNAGE), webOS 6.0 (2021-12)"
    author: LG Electronics
    url: "https://gscs-b2c.lge.com/open/downloadFile?fileId=JBmCvLSuL8MPkrXyvtoIaA"
    note: >
      The current generation's command reference: IR codes (pp.82-83), controlling several products and Set
      ID 1-1000 (p.84), communication parameters 9600 bps, 8 data bits, no parity, 1 stop bit, ASCII
      and no flow control (p.85), the command list (pp.86-90) and the transmission / reception protocol with each command's data
      (pp.91-115): power ka (00 off, 01 on, 02 restart), input xb, aspect kc, energy saving jq, picture mode
      dx, contrast kg, brightness kh, sharpness kk, color ki, tint kj, color temperature xu (70-D2 = 3200-13000
      K), balance kt, sound mode dy, mute ke (00 mutes), volume kf, date fa, time fx, no-signal power off fg,
      no-IR power off mn, language fi, reset fk, temperature dn, key mc, elapsed time dl, serial number fy,
      software version fz, white balance jm/jn/jo and sx/sy/sz, backlight mg, screen off kd, tile mode dd and
      dz, tile ID di, natural mode dj, DPM fj, key lock km, power-on delay fh, failover mi and mj, IR and local
      key locks tp and to, status sv (02 signal, 03 screen, 07 sensors, 09 fans, 10 screen check, 16
      humidity, 17 illuminance, 18 tilt), daylight saving sd, the sn family (PM mode 0c, network 80-82, time
      sync 16, LAN daisy chain 84, input rotation 85, beacon 88, wireless WOL 90, HDMI IT content 99,
      holidays 9b, UPnP 9c, locks 9d-a0, backup content a1, digital audio a2, booting logo a3, SoftAP a4,
      natural size a5, password a7, play media a8, no-signal image a9, audio out aa, brightness range ab,
      gamma ad, black level ae, deep color af, sync mode b0, input label b1, LCIN008 b8, PC power 8b, local
      dimming c1 and c6, scan inversion 87, frame control b7, APL be, stereo c2, USB2 to HDBaseT c3, HDR
      picture mode c4, tone mapping c5, quiet mode c7, color calibration d6, Quick Start+ 0e, screen off
      always 0d, DPM wake-up 0b, apply to all inputs 52, multichannel 76), ISM jp, power-on status tr, wired
      WOL fw, OSD rotation th, contents sync tg, brightness schedule sm and ss, multi screen xc/xd/xe, freeze
      kx, OSD lock kl, fan check dw, timers fd and fe, Set ID jx, brightness readings mu, screen fault
      detection tz. Broadcast Set ID 00 sends no acknowledgement; NG with data 00 is an illegal code.
  - title: "USER GUIDE, LG Digital Signage (MONITOR SIGNAGE), webOS 3.2"
    author: LG Electronics
    url: "https://gscs-b2c.lge.com/open/downloadFile?fileId=zHNEymzqGBUEKbFjxomaEA"
    note: >
      The 2017-2018 generation (pp.51-80): the same protocol, plus auto configuration ju, H/V position and
      H size fq/fr/fs, intelligent auto ti, the weekly schedule sn 9a and Clear Panel Noise sn a6; energy
      saving adds 05 screen off and the picture modes add expert2 and photo.
  - title: "USER GUIDE, LG Digital Signage (MONITOR SIGNAGE), L19 platform"
    author: LG Electronics
    url: "https://cdn3.evostore.io/documents/fusion/fus_766937_user_guide.pdf"
    note: >
      LG's guide, read from a reseller's copy (pp.37-62): tile H/V position and size de/df/dg/dh, the
      three-digit Set ID form (001-3e8) for IDs above 255, and its own OSD lock polarity (see the quirks).
  - title: "OWNER'S MANUAL, LG Digital Signage, 32/43/49/55/65SM5B, SM5KB, 43/49/55SM3B (RS-232C section) (2015-09)"
    author: LG Electronics
    url: "https://aca.im/driver_docs/LG/SM_models.pdf"
    note: >
      LG's manual, read from an integrator's copy: the 2015 generation's aspect ratios (01 4:3 ... 10-1F
      cinema zoom), picture modes (vivid, standard ...), speaker dv, reset enable tn, timer enables fb/fc and
      on-timer input fu; while media plays only ka, kf, ke and mc are taken.
  - title: "OWNER'S MANUAL, LG Digital Signage, 32-65SE3B, SE3KB, 43-55SL5B (2015-06)"
    author: LG Electronics
    url: "http://content.etilize.com/User-Manual/1031128130.pdf"
    note: >
      LG's manual, read from a distributor's copy (pp.71-84): RS-232C wiring (crossed cable, D-Sub 9 or a
      3.5 mm jack with LG's adapter), the 2015 command set, and the tile mode byte written row first.
  - title: "INSTALLATION MANUAL, LED TV (commercial), UV340C-U (2017-08-25)"
    author: LG Electronics
    url: "https://www.lg.com/us/business/download/resources/BT00001837/UV340C-U_Install_Manual_170825.pdf"
    note: >
      The commercial TV command set (pp.27-36): Set ID 1-99, inputs xb 00 DTV ... 90-93 HDMI, screen mute
      kd (10 video mute), OSD select kl, treble kr, bass ks, equalizer jv, energy saving jq; during playback
      or recording only ka and mc are taken.
  - title: "INSTALLATION MANUAL, LG Digital Signage, 65/75/86UL3E (2018)"
    author: LG Electronics
    url: "https://media.dustin.eu/media/d200001001731318/86ul3e-t-usermanual.pdf"
    note: "LG's manual, read from a reseller's copy (pp.30-37): the TV-style command set on a signage display, NG defined."
  - title: "RS-232 Protocol Commands (LG Canada help library)"
    author: LG Electronics
    url: "https://www.lg.com/ca_en/support/product-support/troubleshoot/help-library/cs-CT52001643-20153058982994/"
    note: "TV key codes (channel up/down, sleep, Q.Menu, guide, info, the media keys)."
  - title: "Bitfocus Companion module lgtv-prodisplay (MIT)"
    url: "https://github.com/bitfocus/companion-module-lgtv-prodisplay"
    note: >
      Corroboration only, licence checked, no code copied: these displays take the same ASCII messages on
      TCP 9761 with no greeting or login, and answer as over RS-232C. No LG document read names the port.
  - title: "Mira Connect Integration Guide for LG Commercial Displays"
    author: Aveo Systems
    url: "https://aveosystems.com/wp-content/uploads/product_pdfs/LG_Mira_Connect.pdf"
    note: "Corroboration only: TCP port 9761, and PM mode Screen Off Always (or Network Ready) for control over Ethernet in standby."

transport:
  type: line-tcp
  port: 9761
  # Each message is the command, the Set ID and the data, ended by CR (p.91).
  framing: terminated
  terminator: cr
  encoding: ascii
  # An acknowledgement ends with a literal "x" after its data, with no line ending (p.91). Data are hex
  # digits, so a reply ends at the first hex digit, K (of OK) or G (of NG) followed by x; the leading
  # Command2 letter, which can itself be x (jx, dx, fx), is followed by a space, never ends one.
  reply_framing: terminated
  reply_terminators: ["0x", "1x", "2x", "3x", "4x", "5x", "6x", "7x", "8x", "9x", "ax", "bx", "cx", "dx", "ex", "fx", "Ax", "Bx", "Cx", "Dx", "Ex", "Fx", "Kx", "Gx"]
  reply_match: "^[a-z] [0-9a-fA-F]+ (OK|NG)"
  timeout_ms: 3000
  reply: expected
  probe: "ka {settings.set_id:02x} ff"

settings:
  # Set in the menu (General > Set ID). 00 broadcasts and is never acknowledged, so it is not offered.
  set_id: { type: int, min: 1, max: 1000, default: 1, label: Set ID, description: "The display's Set ID from its menu, 1 to 1000 (1 to 99 on a commercial TV); sent in hex, three digits above 255." }

ports:
  - { port: 9761, protocol: tcp, role: control, note: "the network models' control port; an RS-232C display behind a serial-to-Ethernet bridge is reached at the bridge's port, given when the device is opened" }

