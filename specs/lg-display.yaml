commands:
  set_power:
    summary: Turn the display on or off (ka 01 or 00); answered reliably only once the display is fully on
    params:
      'on': {type: bool, required: true, label: Power, description: 'On turns the display on, off puts it in standby.'}
    send: ka {settings.set_id:02x} {on:map.lg_power}
    expect: {matches: '^a [0-9a-fA-F]+ OK'}
    returns: ack
  get_power:
    summary: Read whether the display is on (ka ff); returns 01 on or 00 off
    send: ka {settings.set_id:02x} ff
    expect: {matches: '^a [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$'}
    returns: value
  restart:
    summary: Restart the display (ka 02)
    send: ka {settings.set_id:02x} 02
    expect: {matches: '^a [0-9a-fA-F]+ OK'}
    returns: ack
  set_input:
    summary: Select the input (xb)
    params:
      input:
        type: enum
        values: [av, component, rgb, dvi_d_pc, dvi_d, hdmi1, hdmi1_pc, hdmi2, hdmi2_pc, ops_hdmi3_dvi, ops_hdmi3_dvi_pc, ops_dvi, ops_dvi_pc,
          hdmi3_dvi, hdmi3_dvi_pc, hdmi3_hdmi2_dvi, hdmi3_hdmi2_dvi_pc, ops, ops_pc, hdmi2_ops, hdmi2_ops_pc, displayport, displayport_pc,
          displayport_usbc, displayport_usbc_pc, hdmi3, hdmi3_pc, hdbaset, hdbaset_pc, webos_player, others, multi_screen, play_via_url]
        required: true
        label: Input
        description: 'The input and its label: hdmi1 is HDMI 1 labelled DTV, hdmi1_pc the same port labelled PC; the ports a model has
          vary.'
    send: xb {settings.set_id:02x} {input:map.lg_input}
    expect: {matches: '^b [0-9a-fA-F]+ OK'}
    returns: ack
  get_input:
    summary: Read the input (xb ff); returns LG's data in hex digits
    send: xb {settings.set_id:02x} ff
    expect: {matches: '^b [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$'}
    returns: value
  set_input_tv:
    summary: Select the input of a commercial TV (xb)
    params:
      input:
        type: enum
        values: [dtv, cadtv, atv, catv, av1, av2, component1, component2, rgb, hdmi1, hdmi2, hdmi3, hdmi4]
        required: true
        label: Input
        description: 'The TV''s input: tuner (dtv, cadtv, atv, catv), AV, component, RGB or HDMI 1 to 4.'
    send: xb {settings.set_id:02x} {input:map.lg_input_tv}
    expect: {matches: '^b [0-9a-fA-F]+ OK'}
    returns: ack
  get_input_tv:
    summary: Read the input (xb ff); returns LG's data in hex digits
    send: xb {settings.set_id:02x} ff
