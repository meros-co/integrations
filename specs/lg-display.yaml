    summary: Add a holiday, a period with no power on (sn 9b Y M D length repeat basis)
    params:
      year: {type: int, min: 2010, max: 2099, required: true, label: Year, description: Starting year from 2010.}
      month: {type: int, min: 1, max: 12, required: true, label: Month, description: Starting month from 1 to 12.}
      day: {type: int, min: 1, max: 31, required: true, label: Day, description: Starting day from 1 to 31.}
