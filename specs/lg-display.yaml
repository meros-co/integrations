    summary: Reset the picture settings, the screen (RGB input) or every setting (fk)
    params:
      target:
        type: enum
        values: [picture, screen, initial_settings]
        required: true
        label: Reset
        description: picture resets the picture settings; screen initializes the RGB screen on older generations; initial_settings restores
          every setting.
    send: fk {settings.set_id:02x} {target:map.lg_reset}
    expect: {matches: '^k [0-9a-fA-F]+ OK'}
    returns: ack
  auto_configure:
    summary: Run auto configuration on the RGB (PC) input (ju 01)
    send: ju {settings.set_id:02x} 01
    expect: {matches: '^u [0-9a-fA-F]+ OK'}
    returns: ack
  apply_to_all_inputs:
    summary: Apply the current picture settings to every input (sn 52 01); other commands are refused for a while after
    send: sn {settings.set_id:02x} 52 01
    expect: {matches: '^n [0-9a-fA-F]+ OK'}
    returns: ack
  play_saved_media:
    summary: Play the media saved in internal memory (sn a8 01)
    send: sn {settings.set_id:02x} a8 01
    expect: {matches: '^n [0-9a-fA-F]+ OK'}
    returns: ack
  clear_panel_noise:
    summary: Run Clear Panel Noise (sn a6 01)
    send: sn {settings.set_id:02x} a6 01
    expect: {matches: '^n [0-9a-fA-F]+ OK'}
    returns: ack
  set_h_position:
    summary: Set the RGB input's h position (tile mode off) (fq)
    params:
      value: {type: int, min: 0, max: 100, required: true, label: H position, description: H position from 0 to 100; 50 is centered
          for a position.}
    send: fq {settings.set_id:02x} {value:02x}
    expect: {matches: '^q [0-9a-fA-F]+ OK'}
    returns: ack
  get_h_position:
    summary: Read the h position (fq ff); returns LG's data in hex digits
    send: fq {settings.set_id:02x} ff
    expect: {matches: '^q [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$'}
    returns: value
  set_v_position:
    summary: Set the RGB input's v position (tile mode off) (fr)
    params:
      value: {type: int, min: 0, max: 100, required: true, label: V position, description: V position from 0 to 100; 50 is centered
          for a position.}
    send: fr {settings.set_id:02x} {value:02x}
    expect: {matches: '^r [0-9a-fA-F]+ OK'}
    returns: ack
  get_v_position:
    summary: Read the v position (fr ff); returns LG's data in hex digits
    send: fr {settings.set_id:02x} ff
    expect: {matches: '^r [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$'}
    returns: value
  set_h_size:
    summary: Set the RGB input's h size (tile mode off) (fs)
    params:
      value: {type: int, min: 0, max: 100, required: true, label: H size, description: H size from 0 to 100; 50 is centered for a position.}
    send: fs {settings.set_id:02x} {value:02x}
    expect: {matches: '^s [0-9a-fA-F]+ OK'}
    returns: ack
  get_h_size:
    summary: Read the h size (fs ff); returns LG's data in hex digits
    send: fs {settings.set_id:02x} ff
    expect: {matches: '^s [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$'}
    returns: value
  set_intelligent_auto:
    summary: Turn intelligent auto on or off (ti)
    params:
      enabled: {type: bool, required: true, label: Intelligent auto, description: On adjusts the RGB input automatically.}
    send: ti {settings.set_id:02x} {enabled:map.lg_intelligent_auto}
    expect: {matches: '^i [0-9a-fA-F]+ OK'}
    returns: ack
  get_intelligent_auto:
    summary: Read the intelligent auto (ti ff); returns LG's data in hex digits
    send: ti {settings.set_id:02x} ff
    expect: {matches: '^i [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$'}
    returns: value
  set_reset_enable:
    summary: Allow or prevent reset to initial settings (tn)
    params:
      enabled: {type: bool, required: true, label: Reset enable, description: On allows reset to initial settings.}
    send: tn {settings.set_id:02x} {enabled:map.lg_reset_enable}
    expect: {matches: '^n [0-9a-fA-F]+ OK'}
    returns: ack
  get_reset_enable:
    summary: Read the reset enable (tn ff); returns LG's data in hex digits
    send: tn {settings.set_id:02x} ff
    expect: {matches: '^n [0-9a-fA-F]+ OK([0-9a-fA-F]+)x$'}
    returns: value
  set_accessory_power:
    summary: Turn the LCIN008 accessory on or off (sn b8 00 value)
    params:
      'on': {type: bool, required: true, label: Power, description: On turns the accessory on.}
    send: sn {settings.set_id:02x} b8 00 {on:map.lg_on_off}
    expect: {matches: '^n [0-9a-fA-F]+ OK'}
    returns: ack
  set_accessory_brightness:
    summary: Set the LCIN008 accessory brightness (sn b8 01 level)
    params:
      level: {type: int, min: 0, max: 100, required: true, label: Brightness, description: Brightness from 0 to 100.}
    send: sn {settings.set_id:02x} b8 01 {level:02x}
    expect: {matches: '^n [0-9a-fA-F]+ OK'}
    returns: ack
  get_accessory_brightness:
    summary: Read the LCIN008 accessory brightness (sn b8 01 ff)
    send: sn {settings.set_id:02x} b8 01 ff
    expect: {matches: '^n [0-9a-fA-F]+ OK(?i:b8) ?01([0-9a-fA-F]{2})x$'}
    returns: value
  set_network_dhcp:
    summary: Stage DHCP for the wired network (sn 80 00); apply_network_settings applies it
    send: sn {settings.set_id:02x} 80 00
    expect: {matches: '^n [0-9a-fA-F]+ OK'}
    returns: ack
  set_network_static:
    summary: Stage a fixed wired address (sn 80 01 address mask gateway, each 12 decimal digits); apply_network_settings applies it
    params:
      address: {type: string, pattern: '^[0-9]{12}$', max_length: 12, required: true, label: IP address, description: 'The address as
          12 digits, each octet as three: 192.168.1.20 is 192168001020.'}
      mask: {type: string, pattern: '^[0-9]{12}$', max_length: 12, required: true, label: Subnet mask, description: 'The subnet mask
          as 12 digits: 255.255.255.0 is 255255255000.'}
      gateway: {type: string, pattern: '^[0-9]{12}$', max_length: 12, required: true, label: Gateway, description: 'The gateway as 12
          digits: 192.168.1.1 is 192168001001.'}
    send: sn {settings.set_id:02x} 80 01 {address} {mask} {gateway}
    expect: {matches: '^n [0-9a-fA-F]+ OK'}
    returns: ack
  set_dns:
    summary: Stage the DNS server (sn 81 address as 12 decimal digits); apply_network_settings applies it
    params:
      dns: {type: string, pattern: '^[0-9]{12}$', max_length: 12, required: true, label: DNS server, description: 'The DNS server as
          12 digits: 8.8.8.8 is 008008008008.'}
    send: sn {settings.set_id:02x} 81 {dns}
    expect: {matches: '^n [0-9a-fA-F]+ OK'}
    returns: ack
  apply_network_settings:
    summary: Apply the staged wired address settings or DNS server (sn 82 80 or 81); the connection may drop
    params:
      which:
        type: enum
        values: [address, dns]
        required: true
        label: Settings
        description: address applies the staged address, mask and gateway; dns applies the staged DNS server.
    send: sn {settings.set_id:02x} 82 {which:map.lg_apply_network}
    expect: {matches: '^n [0-9a-fA-F]+ OK'}
    returns: ack
  get_network_settings:
    summary: Read the network settings in use (sn 82 ff); returns LG's data
    send: sn {settings.set_id:02x} 82 ff
    expect: {matches: '^n [0-9a-fA-F]+ OK(?i:82) ?(.+)x$'}
    returns: value
  get_staged_network_settings:
    summary: Read the staged wired address settings (sn 80 ff); returns LG's data
    send: sn {settings.set_id:02x} 80 ff
    expect: {matches: '^n [0-9a-fA-F]+ OK(?i:80) ?(.+)x$'}
    returns: value
  change_password:
    summary: Change the display's menu password (sn a7, the old six digits then the new; older generations use four)
    params:
      old_password: {type: string, pattern: '^[0-9]{4}([0-9]{2})?$', max_length: 6, secret: true, required: true, label: Current password,
        description: 'The current menu password, 6 digits (4 on older generations).'}
      new_password: {type: string, pattern: '^[0-9]{4}([0-9]{2})?$', max_length: 6, secret: true, required: true, label: New password,
        description: 'The new menu password, as many digits as the current one.'}
    send: sn {settings.set_id:02x} a7 {old_password}{new_password}
    expect: {matches: '^n [0-9a-fA-F]+ OK'}
    returns: ack
