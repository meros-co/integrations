quirks:
  - models: [all]
    severity: warning
    text: >
      TCP 9761 comes from integrators' material, not from an LG document: LG's public guides describe the
      protocol over RS-232C only, and say nothing of a login, which none is sent. A display wired by RS-232C
      (9600 bps, 8 data bits, no parity, 1 stop bit, no flow control, crossed cable; webOS 6.0 guide p.85)
      is driven through a serial-to-Ethernet bridge opened at the bridge's TCP port; the messages are the
      same. Displays daisy-chained from
      RS-232C OUT to the next one's IN share one port and are told apart by Set ID (p.84).
  - models: [all]
    severity: warning
    text: >
      LG says an acknowledgement is returned reliably only while the display is fully on. In standby a
      display may answer nothing: a poll then goes unanswered, the connection is opened again, and the
      device shows as disconnected until it answers. Turning it on over the network needs PM mode Network
      Ready or Screen Off Always (set_pm_mode), or Wake on LAN, which this integration does not send.
  - models: [all]
    severity: info
    text: >
      Values are LG's hex data: get_ commands return the data as the display sends it (64 for 100), while
      state holds the numbers and names. Set ID 00, the broadcast to every display on a chain, is never
      acknowledged, so it is not offered; commands go to the display whose Set ID is set.
  - models: [all]
    severity: info
    text: >
      Nothing is pushed: power, input, volume, mute, screen off and signal are read every 5 s, other
      settings every minute, and the timers, holidays and brightness schedule every 5 minutes.
  - models: [webos6, webos3, signage-2015]
    severity: warning
    text: >
      The mute (ke), freeze (kx) and OSD lock (kl) data are inverted: 00 mutes, freezes and locks. The L19
      guide gives the OSD lock the other way round (00 unlocked); set_osd_lock follows the webOS 6.0 and 3.2
      guides.
  - models: [webos6, webos3, signage-2015]
    severity: warning
    text: >
      Changing the tile mode, tile ID, scan inversion or frame control reboots a video wall model, and UPnP
      reboots the display. apply_to_all_inputs, the LCIN008 commands and transfer control make the display
      refuse other commands for a while afterwards.
  - models: [webos6, webos3]
    severity: critical
    text: >
      apply_network_settings changes the display's address and may end this connection; reset with
      initial_settings restores every setting, the Set ID and network included. Neither can be undone from
      here.
  - models: [webos6, webos3, signage-2015]
    severity: info
    text: >
      The tile mode byte is columns then rows in the webOS guides and rows then columns in the SE3B manual;
      set_tile_mode follows the webOS guides. A model takes at most its own number of columns and rows, and a
      tile ID above columns times rows is answered NG.
  - models: [webos6, webos3, signage-2015]
    severity: info
    text: >
      The schedules are read one entry at a time and kept as LG's hex data per entry: power timers 1 to 7
      (models keep 7, 16 or 21; get_on_timer and get_off_timer read any of them), holidays 1 to 7 and
      brightness schedule entries 1 to 6. The date's year is counted from 2010 and the latest year a display
      takes depends on its release year.
  - models: [webos6, webos3, signage-2015]
    severity: info
    text: >
      Each input has two codes, the DTV and the PC label of one port (90 and a0 for HDMI 1); the display
      answers with the label the port is set to (set_input_label), and state names it as set_input does.
      Multi screen, failover, deep color and input label settings use the DTV codes.
  - models: [webos6, webos3]
    severity: info
    text: >
      Transfer control (sn cb), which passes data out of the RS-232C OUT port to a chained device, is not
      offered: LG documents no format for its data. The menu password change (change_password) needs the
      current password.
  - models: [commercial-tv]
    severity: info
    text: >
      The TV tuner commands (tune ma, channel add and delete mb) are not offered: their channel formats are
      region-specific. On a commercial TV the remote and key lock is released when mains power is cycled, and
      during media playback or recording every command but power and keys is answered NG.
