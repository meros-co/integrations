  set_input_eq_band_bypass:
    summary: "Set: input PEQ band bypassed (VXL:Ch/PEQ/Band/Bypass, raw value); answered with the value applied"
    params:
      source: { type: enum, values: [conference, music], required: true, label: "Source", description: "conference (the conference input) or music (the music input)." }
      band: { type: int, min: 1, max: 3, required: true, label: "Band", description: "Input PEQ band, 1 to 3 (A to C)." }
      enabled: { type: bool, required: true, label: "Input PEQ band bypassed", description: "On turns it on, off turns it off (input peq band bypassed)." }
    send: [{ models: [vxl1-16p], message: "set VXL:Ch/PEQ/Band/Bypass {source:map.source} {band:-1} {enabled:bool01}" }, { models: [vxc2p], message: "set VXC:Ch/PEQ/Band/Bypass {source:map.source} {band:-1} {enabled:bool01}" }]
