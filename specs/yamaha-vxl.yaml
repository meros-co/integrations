    params:
      source: { type: enum, values: [conference, music], required: true, label: "Source", description: "conference (the conference input) or music (the music input)." }
    send: [{ models: [vxl1-16p], message: "get VXL:Ch/InputVolume/Level {source:map.source} 0" }, { models: [vxc2p], message: "get VXC:Ch/InputVolume/Level {source:map.source} 0" }]
    expect: { matches: '^OK get (?:VXL|VXC):Ch/InputVolume/Level [0-9]+ [0-9]+ (-?[0-9]+)' }
    returns: value

  set_input_eq:
    summary: "Set: input PEQ on (VXL:Ch/PEQ/On, raw value); answered with the value applied"
    params:
      source: { type: enum, values: [conference, music], required: true, label: "Source", description: "conference (the conference input) or music (the music input)." }
      enabled: { type: bool, required: true, label: "Input PEQ on", description: "On turns it on, off turns it off (input peq on)." }
