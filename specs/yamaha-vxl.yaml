    summary: "Set the UNIT ID used from the next start, with DIP switches 1-4 on RESERVED (VXL:SetNextBootUnitID, 3-21)"
    params:
      unit_id: { type: int, min: 0, max: 127, required: true, label: "UNIT ID", description: "UNIT ID, 0 to 127." }
    send: [{ models: [vxl1-16p], message: "event VXL:SetNextBootUnitID \"{unit_id:03x}\"" }, { models: [vxc2p], message: "event VXC:SetNextBootUnitID \"{unit_id:03x}\"" }]
    expect: { matches: '^OK event (?:VXL|VXC):SetNextBootUnitID "(.*)"' }
    returns: value

  set_hostname_mode:
    summary: "Choose the host name: 0 manual, 1 from the UNIT ID (VXL:SetHostnameMode, 3-22)"
    params:
      mode: { type: enum, values: ["0", "1"], required: true, label: "Mode", description: "0 manual, 1 from the UNIT ID." }
    send: [{ models: [vxl1-16p], message: "event VXL:SetHostnameMode \"{mode}\"" }, { models: [vxc2p], message: "event VXC:SetHostnameMode \"{mode}\"" }]
    expect: { matches: '^OK event (?:VXL|VXC):SetHostnameMode "(.*)"' }
    returns: value

  get_hostname_mode:
    summary: "Read the host name mode (VXL:GetHostnameMode, 3-23)"
    send: [{ models: [vxl1-16p], message: "event VXL:GetHostnameMode \"\"" }, { models: [vxc2p], message: "event VXC:GetHostnameMode \"\"" }]
    expect: { matches: '^OK event (?:VXL|VXC):GetHostnameMode "(.*)"' }
    returns: value

  set_hostname:
    summary: "Set the host name, with the host name mode manual (VXL:SetHostname, 3-24)"
    params:
      hostname: { type: string, max_length: 64, pattern: "^[A-Za-z0-9-]+$", required: true, label: "Host name", description: "Up to 64 characters, letters, digits and hyphens." }
    send: [{ models: [vxl1-16p], message: "event VXL:SetHostname \"{hostname}\"" }, { models: [vxc2p], message: "event VXC:SetHostname \"{hostname}\"" }]
    expect: { matches: '^OK event (?:VXL|VXC):SetHostname "(.*)"' }
    returns: value

  get_hostname:
    summary: "Read the host name (VXL:GetHostname, 3-25)"
    send: [{ models: [vxl1-16p], message: "event VXL:GetHostname \"\"" }, { models: [vxc2p], message: "event VXC:GetHostname \"\"" }]
    expect: { matches: '^OK event (?:VXL|VXC):GetHostname "(.*)"' }
    returns: value

  start_meter:
    summary: "Start a meter's notifications at an interval; they stop after 10 s unless started again (mtrstart, 2-11)"
    params:
      meter: { type: enum, values: [digital_in, compressor_out, compressor_gr, ducker_out, ducker_gr, output_voltage], required: true, label: "Meter", description: "digital_in (digital input level, both channels), compressor_out, compressor_gr, ducker_out, ducker_gr or output_voltage." }
      interval_ms: { type: int, min: 1, max: 10000, required: true, label: "Interval", description: "Least time between notifications in ms." }
    send: [{ models: [vxl1-16p], message: "mtrstart {meter:map.meter} {interval_ms}" }, { models: [vxc2p], message: "mtrstart {meter:map.meter_vxc} {interval_ms}" }]
    expect: { matches: '^OK mtrstart ' }
    returns: ack

  stop_meter:
    summary: "Stop a meter's notifications (mtrstop, 2-12)"
    params:
      meter: { type: enum, values: [digital_in, compressor_out, compressor_gr, ducker_out, ducker_gr, output_voltage], required: true, label: "Meter", description: "digital_in (digital input level, both channels), compressor_out, compressor_gr, ducker_out, ducker_gr or output_voltage." }
    send: [{ models: [vxl1-16p], message: "mtrstop {meter:map.meter}" }, { models: [vxc2p], message: "mtrstop {meter:map.meter_vxc}" }]
    expect: { matches: '^OK mtrstop ' }
    returns: ack

quirks:
  - models: [all]
    severity: critical
    text: >
      Communication start: the controller must send devstatus runmode every
      second or more until the answer is normal, and nothing else before
      that (p.23). The core asks it as the liveness probe; a host should hold
      its commands until device.run_mode is normal. The next-boot address,
      UNIT ID and host name commands take effect at the next start and can
      move the speaker off its network.
  - models: [all]
    severity: info
    text: >
      On connecting the core reads the device information and every parameter
      once (the device asks for a full re-read after a recall); after that the
      speaker pushes every change as NOTIFY set. Opened for commands only,
      nothing is read. Meters (start_meter) stop after 10 s unless started
      again; a consumer that wants them restarts them. Up to four controllers
      connect at once; set_keepalive drops a silent one.
  - models: [all]
    severity: info
    text: >
      Values are raw (levels in hundredths of a dB with -32768 for -inf,
      frequencies in thousandths of a Hz, Q in thousandths, EQ gains in tenths
      of a dB), as the parameter list gives them; values between the device's
      steps are adjusted and answered OKm. The compressor and ducker
      thresholds are listed in dB without a scale, and a ratio of 201 is
      assumed to be infinity:1 (the symbol is lost in the document).

