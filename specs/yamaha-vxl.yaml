commands:
  set_input_gain:
    summary: "Set: input gain (VXL:Ch/InputGain/Sensitivity, raw value); answered with the value applied"
    params:
      source: { type: enum, values: [conference, music], required: true, label: "Source", description: "conference (the conference input) or music (the music input)." }
      value: { type: int, min: -2000, max: 2000, required: true, label: "Input gain", description: "Input gain in hundredths of a dB, -2000 (-20.00 dB) to 2000 (+20.00 dB)." }
    send: [{ models: [vxl1-16p], message: "set VXL:Ch/InputGain/Sensitivity {source:map.source} 0 {value}" }, { models: [vxc2p], message: "set VXC:Ch/InputGain/Sensitivity {source:map.source} 0 {value}" }]
    expect: { matches: '^OKm? set (?:VXL|VXC):Ch/InputGain/Sensitivity ' }
    returns: ack

  get_input_gain:
    summary: "Read: input gain (VXL:Ch/InputGain/Sensitivity, raw value)"
    params:
      source: { type: enum, values: [conference, music], required: true, label: "Source", description: "conference (the conference input) or music (the music input)." }
    send: [{ models: [vxl1-16p], message: "get VXL:Ch/InputGain/Sensitivity {source:map.source} 0" }, { models: [vxc2p], message: "get VXC:Ch/InputGain/Sensitivity {source:map.source} 0" }]
    expect: { matches: '^OK get (?:VXL|VXC):Ch/InputGain/Sensitivity [0-9]+ [0-9]+ (-?[0-9]+)' }
    returns: value

  set_enhancer:
    summary: "Set: enhancer on (VXL:Ch/Enhancer/On, raw value); answered with the value applied"
    params:
      source: { type: enum, values: [conference, music], required: true, label: "Source", description: "conference (the conference input) or music (the music input)." }
      enabled: { type: bool, required: true, label: "Enhancer on", description: "On turns it on, off turns it off (enhancer on)." }
    send: [{ models: [vxl1-16p], message: "set VXL:Ch/Enhancer/On {source:map.source} 0 {enabled:bool01}" }, { models: [vxc2p], message: "set VXC:Ch/Enhancer/On {source:map.source} 0 {enabled:bool01}" }]
    expect: { matches: '^OKm? set (?:VXL|VXC):Ch/Enhancer/On ' }
    returns: ack

  get_enhancer:
    summary: "Read: enhancer on (VXL:Ch/Enhancer/On, raw value)"
