    expect: { matches: '^OK get (?:VXL|VXC):Ch/Enhancer/On [0-9]+ [0-9]+ (-?[0-9]+)' }
    returns: value

  set_input_volume_on:
    summary: "Set: input volume on (VXL:Ch/InputVolume/On, raw value); answered with the value applied"
    params:
      source: { type: enum, values: [conference, music], required: true, label: "Source", description: "conference (the conference input) or music (the music input)." }
      enabled: { type: bool, required: true, label: "Input volume on", description: "On turns it on, off turns it off (input volume on)." }
    send: [{ models: [vxl1-16p], message: "set VXL:Ch/InputVolume/On {source:map.source} 0 {enabled:bool01}" }, { models: [vxc2p], message: "set VXC:Ch/InputVolume/On {source:map.source} 0 {enabled:bool01}" }]
    expect: { matches: '^OKm? set (?:VXL|VXC):Ch/InputVolume/On ' }
    returns: ack

  get_input_volume_on:
    summary: "Read: input volume on (VXL:Ch/InputVolume/On, raw value)"
    params:
      source: { type: enum, values: [conference, music], required: true, label: "Source", description: "conference (the conference input) or music (the music input)." }
    send: [{ models: [vxl1-16p], message: "get VXL:Ch/InputVolume/On {source:map.source} 0" }, { models: [vxc2p], message: "get VXC:Ch/InputVolume/On {source:map.source} 0" }]
    expect: { matches: '^OK get (?:VXL|VXC):Ch/InputVolume/On [0-9]+ [0-9]+ (-?[0-9]+)' }
    returns: value

  set_input_volume:
    summary: "Set: input volume (VXL:Ch/InputVolume/Level, raw value); answered with the value applied"
    params:
      source: { type: enum, values: [conference, music], required: true, label: "Source", description: "conference (the conference input) or music (the music input)." }
      value: { type: int, min: -32768, max: 0, required: true, label: "Input volume", description: "Level in hundredths of a dB, -13800 (-138.00 dB) to 0, or -32768 for -inf; values between are taken from the device's steps." }
    send: [{ models: [vxl1-16p], message: "set VXL:Ch/InputVolume/Level {source:map.source} 0 {value}" }, { models: [vxc2p], message: "set VXC:Ch/InputVolume/Level {source:map.source} 0 {value}" }]
    expect: { matches: '^OKm? set (?:VXL|VXC):Ch/InputVolume/Level ' }
    returns: ack

  get_input_volume:
