spec: 1
id: yamaha-vxl
name: Yamaha VXL1-16P / VXC2P speakers (Remote Control Protocol, TCP 49280)
vendor: Yamaha
category: other

# The Dante/PoE speakers of Yamaha's ADECIA solutions take the Yamaha Remote
# Control Protocol on TCP 49280: one LF-ended text line per command, OK or
# OKm (clamped) answers, and NOTIFY pushes of every change from the device or
# another controller. Parameters are addressed by AccessID and X/Y; the
# VXC2P names its own parameters VXC: where the VXL1-16P has VXL: (AMP:
# stays). Values here are raw, in the units of the parameter list.
source:
  - title: "VXL1-16P / VXC2P Remote Control Protocol Specifications, Version 2.8.0 (Jun. 5, 2024)"
    author: Yamaha Corporation
    url: https://uk.yamaha.com/download/files/2305158
    note: >
      Manufacturer document, for firmware 2.8.0 and later. The VXC prefix for
      the VXC2P p.1, p.6; TCP 49280 and up to four controllers p.5; syntax
      and value encodings p.8; notifications 1-1 to 1-12 p.9-10; commands
      2-1 to 2-12 p.11-16; extended commands 3-1 to 3-25 (device information,
      identify, addressing, UNIT ID, host name) p.16-22; communication start,
      re-reads after a recall, meters stopping after 10 s, notifications
      p.23-28; meter levels p.29; value tables p.29-39; parameter list
      (section 7) p.40-41; meter list (section 8) p.42. The document has no
      error-reply section.

transport:
  type: line-tcp
  port: 49280
  framing: terminated
  terminator: lf
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  # Replies begin OK or OKm (or ERROR, which the document does not
  # describe); NOTIFY pushes are never a reply.
  reply_match: '^(OK|OKm|ERROR) '
  error_match: '^ERROR '
  probe: devstatus runmode

ports:
  - { port: 49280, protocol: tcp, role: control }

maps:
  source: { "conference": "0", "music": "1" }
  mixer: { "conference": "0", "music": "1", "oscillator": "2" }
  eq_type: { "peq": "0", "low_shelf_6": "1", "low_shelf_12": "2", "high_shelf_6": "3", "high_shelf_12": "4", "hpf": "5", "lpf": "6" }
  meter: { "digital_in": "AMP:DigitalIn/Level", "compressor_out": "VXL:Compressor/OutputLevel", "compressor_gr": "VXL:Compressor/GR", "ducker_out": "VXL:Ducker/OutputLevel", "ducker_gr": "VXL:Ducker/GR", "output_voltage": "AMP:Ch/OutputVoltage" }
  meter_vxc: { "digital_in": "AMP:DigitalIn/Level", "compressor_out": "VXC:Compressor/OutputLevel", "compressor_gr": "VXC:Compressor/GR", "ducker_out": "VXC:Ducker/OutputLevel", "ducker_gr": "VXC:Ducker/GR", "output_voltage": "AMP:Ch/OutputVoltage" }

