      band: { type: int, min: 1, max: 3, required: true, label: "Band", description: "Input PEQ band, 1 to 3 (A to C)." }
      value: { type: int, min: 20000, max: 20000000, required: true, label: "Input PEQ band frequency", description: "Frequency in thousandths of a Hz, 20000 (20 Hz) to 20000000 (20 kHz), on the device's steps." }
