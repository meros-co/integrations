quirks:
  - models: [slxd4, slxd4d, slxd4-plus, slxd4d-plus, slxd4q-plus]
    severity: critical
    text: >
      SLX-D has no mute command, so mute is not offered. Setting gain to
      minimum is not an equivalent: it is audible on transients and does not
      survive a power cycle.

  - models: [ulxd4, ulxd4d, ulxd4q]
    severity: critical
    text: >
      set_encryption, regenerate_encryption_key and
      set_frequency_diversity_mode take effect on the receiver at once, but
      the transmitters keep their old key or pairing until they are IR synced
      again, so audio is lost in the meantime. regenerate_encryption_key only
      works with encryption set to manual.

  - models: [ad4d, ad4q, ulxd4, ulxd4d, ulxd4q, slxd4-plus, slxd4d-plus, slxd4q-plus]
    severity: critical
    text: >
      set_network is not answered: on the control interface the receiver moves
      to its new address and the core loses it until the device is opened at
      that address; on a Dante interface the receiver restarts. Network
      settings are never reported on change, so the core reads them on
      connecting only.

  - models: [slxd4, slxd4d, slxd4-plus, slxd4d-plus, slxd4q-plus]
    severity: warning
    text: >
      Command strings are disabled by default on SLX-D. Until network control
      is enabled on the receiver it accepts the TCP connection and answers
      nothing; the core reports it as disconnected with that as the likely
      reason, rather than as connected and silent.

  - models: [all]
    severity: warning
    text: >
      A refused SET is answered < REP ERR >, which names no command. Commands
      are answered in order, so the core fails the oldest command still
      waiting with the refusal. Out-of-range, malformed and not-possible-now
      SETs (a slot without a linked, active transmitter; high power where the
      band forbids it) are refused this way.

  - models: [all]
    severity: warning
    text: >
      Values are converted with each family's documented offset: Axient
      Digital and SLX-D report dBFS and dBm as value - 120, ULX-D and QLX-D
      report RF as value - 128 and audio as value - 50 dBFS. Gain is value - 18
      on the wire, transmitter offset value - 12 and battery temperature value
      - 40. 255 (and 65533-65535 for battery minutes, 65535 for cycles) mean
      unknown and are reported as absent, never as a reading.

  - models: [ad4d, ad4q, slxd4, slxd4d, slxd4-plus, slxd4d-plus, slxd4q-plus]
    severity: info
    text: >
      Names are set with at most 8 characters, though Axient Digital and SLX-D
      report channel names (and Axient Digital the device id) padded to 31.

  - models: [ulxd4d, ulxd4q]
    severity: info
    text: >
      Summing and frequency diversity modes that do not fit the receiver (3+4
      on a dual) are ignored: the receiver reports the mode it kept, and the
      command fails saying so.

  - models: [ad4d, ad4q]
    severity: info
    text: >
      Encryption, transmission (high density) mode, Quadversity and frequency
      diversity are read only over command strings on Axient Digital; they are
      changed from the front panel or Wireless Workbench. A transmitter's
      battery type, model and lock are read only. Transmitter settings can be
      changed only for an ADX transmitter linked and active over ShowLink,
      through its slot (1-8) on the receiver channel; slots are read once on
      connecting and kept current from the receiver's reports.

  - models: [ulxd4, ulxd4d, ulxd4q, qlxd4, slxd4, slxd4d, slxd4-plus, slxd4d-plus, slxd4q-plus]
    severity: info
    text: >
      The transmitter's offset, RF power, locks and battery are reported by the
      receiver but cannot be changed over command strings, and SLX-D's mic/line
      output level is a hardware switch, reported only.

  - models: [slxd4-plus, slxd4d-plus, slxd4q-plus]
    severity: info
    text: >
      SLX-D+ reads its encryption mode, Dante names, network settings and app
      connection on connecting (none can be changed but the network). Remote
      pairing runs on one channel at a time: start_remote_pairing, then a
      transmitter's REQUEST arrives in state with its name, answered with
      accept_remote_pairing or reject_remote_pairing; it ends by itself (OFF)
      after a timeout. reboot_transmitter restarts the linked transmitter,
      interrupting its audio.

  - models: [ad4q]
    severity: info
    text: >
      With Quadversity on, a channel reports four antennas (a to d); the count
      is read from the SAMPLE's antenna status field rather than assumed. With
      frequency diversity combined (FD-C), a second RF section follows; only
      the first is reported.

  - models: [all]
    severity: info
    text: >
      REP messages arrive whenever a value changes, from the front panel or
      Wireless Workbench too, so everything except metering is live without
      polling. The core also asks for everything again every 30 seconds, to
      recover changes made while it was disconnected. Metering is turned off
      on every metered channel before the core disconnects.

  - models: [ulxd4, ulxd4d, ulxd4q, qlxd4]
    severity: info
    text: >
      ULX-D and QLX-D report RF, audio and antenna state only inside SAMPLE,
      and only one RF figure per channel. With metering off (interval 0) those
      values are never reported.

  - models: [qlxd4]
    severity: info
    text: >
      Shure publishes no QLX-D command string document; QLX-D is driven with
      the ULX-D strings, and only the device id and firmware are asked for
      beyond each channel's GET ALL.

  - models: [p10t]
    severity: info
    text: >
      The PSM1000 is a transmitter: no received RF and no transmitter battery.
      It answers REPORT rather than REP, sends string values without braces,
      and has no GET ALL, so its parameters are asked for one at a time.
      Shure's page gives no range for the input level or the RF power; the
      core follows the Bitfocus Companion module (-67 to 0 dB; 10, 50 or 100
      mW).
