spec: 1
id: shure-wireless
name: Shure networked wireless (command strings)
vendor: Shure
category: wireless
implementation: native
reason: >
  Telemetry is a periodic SAMPLE message whose layout differs by family and,
  on Axient Digital, by how many antennas the channel reports (read from the
  antenna status field), with per-family conversion offsets and sentinel
  values that mean "unknown". Metering is a per-channel subscription that has
  to be turned off again before disconnecting, and a refusal (REP ERR) names
  no command, so it is tied to the oldest one waiting.

source:
  - title: Axient Digital Command Strings (current web edition, read 14 October 2026)
    author: Shure
    url: https://www.shure.com/en-US/docs/commandstrings/AD4
    note: >
      Manufacturer document. DEVICE_ID SET of 1-8 characters reported padded to
      31; ENCRYPTION_MODE, QUADVERSITY_MODE and TRANSMISSION_MODE read only;
      FLASH per device and per channel; NET_SETTINGS (SC, D1, D2; no
      asynchronous reports; the device moves address or restarts); CHAN_NAME
      SET of 8 characters; FREQUENCY and FREQUENCY2, GROUP_CHANNEL and
      GROUP_CHANNEL2 (FD-C) and how setting one reports the other; FD_MODE,
      ENCRYPTION_STATUS, INTERFERENCE_STATUS(2), UNREGISTERED_TX_STATUS;
      METER_RATE and SAMPLE; the TX_ side channel (battery type, health, cycle
      count, temperature minus 40, offset minus 12, lock, mute mode, polarity,
      power level, talk switch, input pad); and the eight transmitter slots per
      channel with SLOT_RF_OUTPUT, SLOT_RF_POWER_MODE, SLOT_OFFSET,
      SLOT_INPUT_PAD, SLOT_POLARITY and SLOT_TX_DEVICE_ID settable for a
      LINKED.ACTIVE (ShowLink) transmitter, REP ERR otherwise.
  - title: Axient Digital — Command Strings (preliminary, 2 May 2018)
    author: Shure
    url: https://content-files.shure.com/Pubs/AD4D/Axient_Digital_network_string_commands.pdf
    note: >
      Manufacturer document. TCP 2202; GET / SET / REP / SAMPLE; REP sent
      unprompted on change; GET n ALL; AUDIO_GAIN 000-060 offset by 18 (p.6);
      METER_RATE five characters, 00000 off (p.14); the SAMPLE layouts including
      Quadversity and FD-C (p.15-16); dBFS and dBm = reported - 120; 255
      unknown; TX_BATT_MINS sentinels 65533-65535.
  - title: ULX-D Command Strings (current web edition, read 14 October 2026)
    author: Shure
    url: https://www.shure.com/en-US/docs/commandstrings/ULXD
    note: >
      Manufacturer document. REP ERR for malformed or out-of-range commands;
      AUDIO_SUMMING_MODE and FREQUENCY_DIVERSITY_MODE (a mode that does not
      apply is ignored and the current one reported); DEVICE_ID; ENCRYPTION
      OFF / AUTO / MANUAL and ENCRYPTION_REGENERATE_KEY (MANUAL only; REQUESTED,
      COMPLETED, INACTIVE); HIGH_DENSITY; SCAN_LOCK and SYNC_LOCK; MODEL;
      NA_DEVICE_NAME and NA_CHAN_NAME; NET_SETTINGS (SC only on the ULXD4);
      GROUP_CHAN gg,cc; ENCRYPTION_WARNING; RF_INT_DET; the metered AUDIO_LVL in
      dBFS as reported - 50; BATT_* and the TX_ side channel (TX_TYPE,
      TX_OFFSET minus 12, TX_RF_PWR, TX_MENU_LOCK, TX_PWR_LOCK, TX_MUTE_STATUS,
      TX_MUTE_BUTTON_STATUS, TX_POWER_SOURCE, TX_DEVICE_ID, TX_FW_VER).
  - title: ULX-D Command Strings (Shure Applications Engineering, 12 Jan 2018)
    author: Shure
    url: https://content-files.shure.com/Pubs/ulx/ulx-d-network-string-commands.pdf
    note: >
      Manufacturer document. ULX-D and QLX-D names (BATT_BARS, BATT_CHARGE,
      BATT_RUN_TIME), per-channel ENCRYPTION ON / OFF before firmware 1.4.8,
      and < SAMPLE x ALL nn aaa eee > with RF level minus 128 for dBm.
  - title: SLX-D Command Strings (current web edition, read 14 October 2026; Version 2, 2020-G)
    author: Shure
    url: https://www.shure.com/en-US/docs/commandstrings/SLXD
    note: >
      Manufacturer document. FLASH per device and per channel, DEVICE_ID and
      CHAN_NAME SET of 8 characters, GROUP_CHANNEL braced, AUDIO_GAIN offset by
      18, AUDIO_OUT_LVL_SWITCH (read only: MIC or LINE), LOCK_STATUS (OFF, MENU,
      ALL), TX_MODEL, and < SAMPLE ch ALL audPeak audRms rfRssi > with the 120
      offset. SLX-D+ and the SLXD4Q+ have their own document and are not
      covered here.
  - title: SLXD+ Command Strings, Version 1.0 (2026-A)
    author: Shure
    url: https://www.shure.com/en-US/docs/commandstrings/SLXDplus
    note: >
      Manufacturer document (PDF docId 11433). The SLX-D strings plus
      ENCRYPTION_MODE, NA_DEVICE_NAME, NA_CHAN_NAME, NET_SETTINGS (SC, D1, D2)
      and APP_CONN_ENABLED p.6-9; REM_PAIR (ON, then REQUEST, ACCEPT or REJECT
      with the transmitter's name, OFF on timeout), INTERFERENCE_STATUS and
      ENCRYPTION_STATUS p.11-12; LINK_TX_MODEL and LINK_STATUS with the slot 1,
      LINK_TX_BATT_MINS and LINK_TX_REBOOT p.16-19, in place of SLX-D's
      TX_MODEL.
  - title: PSM1000 Command Strings (current web edition, read 14 October 2026)
    author: Shure
    url: https://www.shure.com/en-US/docs/commandstrings/PSM1000
    note: >
      Manufacturer document. REPORT rather than REP, bare values, CRLF after
      each message; DEVICE_NAME, CHAN_NAME, AUDIO_IN_LVL, GROUP_CHAN, FREQUENCY,
      RF_TX_LVL, RF_MUTE 1 / 0, AUDIO_TX_MODE 1 mono / 2 point to point / 3
      stereo, AUDIO_IN_LINE_LVL 0 aux / 1 line, METER_RATE and the
      AUDIO_IN_LVL_L / _R meters. It gives no ranges for AUDIO_IN_LVL or
      RF_TX_LVL.
  - title: Bitfocus Companion, companion-module-shure-psm1000
    url: https://github.com/bitfocus/companion-module-shure-psm1000
    note: >
      MIT-licensed; cross-check only, no code copied. AUDIO_IN_LVL as dB from
      -67 to 0 and RF_TX_LVL as 10, 50 or 100 mW, which Shure's page leaves out.
  - title: Bitfocus Companion, companion-module-shure-wireless
    url: https://github.com/bitfocus/companion-module-shure-wireless
    note: >
      MIT-licensed; cross-check only, no code copied. QLX-D parsed with the
      ULX-D strings and offered no FLASH.
  - title: Meros internal Shure client and protocol notes (not public)
    note: >
      Meros. Framing on angle brackets, per-family names and offsets. Not yet
      run against hardware.

settings:
  # Metering interval per channel in milliseconds: 100 to 65535, or 0 for no
  # metering. The receiver sends one SAMPLE per channel per interval.
  meter_interval_ms: { type: int, min: 0, max: 65535, default: 1000,
    label: Metering interval,
    description: "How often the receiver sends meter readings for each channel, in milliseconds from 100, or 0 for no metering (ULX-D and QLX-D then report no RF or audio levels)." }

ports:
  - { port: 2202, protocol: tcp, role: control }

