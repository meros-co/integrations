        slots.4.bays.2.time_to_full_min: "{p11}"
    - json_match: { "$.device.warnings": "^(\\[.*\\])$" }
      state: { device.warning_codes: "{1}" }
    - json_match: { "$.device.warnings": "^\\[" }
      json_each: "$.device.warnings"
      json: { v: "$" }
      replace: device.warnings
      state:
        "device.warnings.{index}": { value: "{v}", map: { "0": "slot1_bay1_too_hot", "1": "slot1_bay2_too_hot", "2": "slot2_bay1_too_hot", "3": "slot2_bay2_too_hot", "4": "slot3_bay1_too_hot", "5": "slot3_bay2_too_hot", "6": "slot4_bay1_too_hot", "7": "slot4_bay2_too_hot", "8": "slot1_bay1_regenerating", "9": "slot1_bay2_regenerating", "10": "slot2_bay1_regenerating", "11": "slot2_bay2_regenerating", "12": "slot3_bay1_regenerating", "13": "slot3_bay2_regenerating", "14": "slot4_bay1_regenerating", "15": "slot4_bay2_regenerating", "16": "slot1_bay1_defect", "17": "slot1_bay2_defect", "18": "slot2_bay1_defect", "19": "slot2_bay2_defect", "20": "slot3_bay1_defect", "21": "slot3_bay2_defect", "22": "slot4_bay1_defect", "23": "slot4_bay2_defect", "24": "fan1_defect", "25": "fan2_defect", "26": "fan3_defect", "27": "fan4_defect", "28": "device_too_hot", "29": "slot1_bay1_too_cold", "30": "slot1_bay2_too_cold", "31": "slot2_bay1_too_cold", "32": "slot2_bay2_too_cold", "33": "slot3_bay1_too_cold", "34": "slot3_bay2_too_cold", "35": "slot4_bay1_too_cold", "36": "slot4_bay2_too_cold" } }
    - json_match: { "$.device.name": "^(.*)$" }
      state: { device.name: "{1}" }
    - json_match: { "$.device.storage_mode": "^(true|false)$" }
      state: { device.storage_mode: "{1}" }
    - json_match: { "$.device.language": "^(.*)$" }
      state: { device.language: "{1}" }
    - json_match: { "$.device.identity.product": "^(.*)$" }
      state: { device.product: "{1}" }
    - json_match: { "$.device.identity.version": "^(.*)$" }
      state: { device.version: "{1}" }
    - json_match: { "$.device.identity.vendor": "^(.*)$" }
      state: { device.vendor: "{1}" }
    - json_match: { "$.device.network.ether.macs": '^\["?([^"\]]*)"?' }
      state: { device.network.mac: "{1}" }
    - json_match: { "$.device.network.ether.interfaces": "^(\\[.*\\])$" }
      state: { device.network.interfaces: "{1}" }
    - json_match: { "$.device.network.ipv4.interfaces": "^(\\[.*\\])$" }
      state: { device.network.ipv4_interfaces: "{1}" }
    - json_match: { "$.device.network.ipv4.auto": "^(true|false)$" }
      state: { device.network.auto: "{1}" }
    - json_match: { "$.device.network.ipv4.mdns": "^(true|false)$" }
      state: { device.network.mdns: "{1}" }
    - json_match: { "$.device.network.ipv4.static_ipaddr": "^(.*)$" }
      state: { device.network.manual_ip: "{1}" }
    - json_match: { "$.device.network.ipv4.static_netmask": "^(.*)$" }
