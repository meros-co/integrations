    - json_match: { "$.device.network.ipv4.ipaddr": "^(.*)$" }
      state: { device.network.ip: "{1}" }
    - json_match: { "$.device.network.ipv4.netmask": "^(.*)$" }
      state: { device.network.netmask: "{1}" }
    - json_match: { "$.device.network.ipv4.gateway": "^(.*)$" }
      state: { device.network.gateway: "{1}" }

state:
  slots.*.type:                   { type: string, description: "What is in the slot: none (blank panel), lm6060, lm6061 or unknown_fault; slots are 1-4 in the API's order" }
  slots.*.type_code:              { type: int, description: "The slot type number as the charger sends it: 0 blank panel, 1 LM 6060, 2 LM 6061, 3 unknown or fault" }
  slots.*.bays.*.led:             { type: string, description: "Bay LED: off, green, green_flashing, yellow, yellow_flashing, red, red_flashing, green_red_flashing, yellow_red_flashing, yellow_green_flashing or identify" }
  slots.*.bays.*.battery_detected: { type: bool, description: "Whether a battery is in the bay" }
  slots.*.bays.*.temperature_c:   { type: float, unit: "°C", description: "Battery temperature" }
  slots.*.bays.*.voltage_mv:      { type: int, unit: mV, description: "Battery voltage" }
  slots.*.bays.*.capacity_mah:    { type: int, unit: mAh, description: "Battery capacity" }
  slots.*.bays.*.current_ma:      { type: int, unit: mA, description: "Charging current" }
  slots.*.bays.*.energy_mwh:      { type: int, unit: mWh, description: "Energy held by the battery" }
  slots.*.bays.*.operating_time_h:   { type: int, unit: h, description: "Operating time the battery holds, hours part" }
  slots.*.bays.*.operating_time_min: { type: int, unit: min, description: "Operating time the battery holds, minutes part" }
  slots.*.bays.*.battery_percent: { type: int, unit: "%", description: "State of charge, 0-100" }
  slots.*.bays.*.cycles:          { type: int, description: "Charge cycle count of the battery" }
  slots.*.bays.*.health_pct:      { type: int, unit: "%", description: "State of health of the battery, 0-100" }
  slots.*.bays.*.time_to_full_h:  { type: int, unit: h, description: "Time until the battery is full, hours part" }
  slots.*.bays.*.time_to_full_min: { type: int, unit: min, description: "Time until the battery is full, minutes part" }
  device.warnings.*:              { type: string, description: "Active warnings by name, e.g. slot2_bay1_too_hot, slot1_bay2_regenerating, slot3_bay1_defect, slot4_bay2_too_cold, fan1_defect to fan4_defect or device_too_hot" }
  device.warning_codes:           { type: string, description: "The active warning numbers as the JSON array the charger sends, e.g. [3,5]" }
  device.name:                    { type: string, description: "Device name, with the MAC address the charger appends" }
  device.storage_mode:            { type: bool, description: "Whether storage mode is on" }
  device.language:                { type: string, description: "Language of the charger's description texts, as it sends it, e.g. [\"en_GB\"]" }
  device.product:                 { type: string, description: "Product label, L6000" }
  device.version:                 { type: string, description: "Firmware version" }
  device.vendor:                  { type: string, description: "Vendor string" }
  device.network.mac:             { type: string, description: "Ethernet MAC address" }
  device.network.interfaces:      { type: string, description: "Ethernet interfaces as the JSON array the charger sends, e.g. [\"CONTROL\"]" }
  device.network.ipv4_interfaces: { type: string, description: "IPv4 interface indices as the JSON array the charger sends" }
  device.network.auto:            { type: bool, description: "Whether the address is taken automatically (DHCP and Auto-IP) rather than set manually" }
  device.network.mdns:            { type: bool, description: "Whether mDNS-only addressing is on (manual address announced by mDNS)" }
  device.network.manual_ip:       { type: string, description: "Static IPv4 address, used when auto is off" }
  device.network.manual_netmask:  { type: string, description: "Static IPv4 netmask" }
  device.network.manual_gateway:  { type: string, description: "Static IPv4 gateway" }
  device.network.ip:              { type: string, description: "Current IPv4 address, in every mode" }
  device.network.netmask:         { type: string, description: "Current IPv4 netmask" }
  device.network.gateway:         { type: string, description: "Current IPv4 gateway" }

quirks:
  - models: [all]
    severity: warning
    text: >
      SSC on the L 6000 is unencrypted and has no password: anyone on the
      network can control the charger. Keep it on a separate control network.

  - models: [all]
    severity: info
    text: >
      The slot and bay values and the warnings come from three subscriptions
      with a 60 s lifetime, renewed every 20 s; the name, storage mode,
      identity and network settings are not subscribable and are read every
      30 s and after each change. The charger accepts subscriptions from at
      most sixteen clients at a time.

  - models: [all]
    severity: warning
    text: >
      TI 1109 lists slot types 0-3 only (blank panel, LM 6060, LM 6061,
      unknown or fault). What an LM 6062 or LM 6070 reports is not documented:
      type_code keeps the number the charger sends, and type is left unset for
      a number the guide does not list.

  - models: [all]
    severity: info
    text: >
      accu_parameter is valid only while a battery is in the bay
      (battery_detected); with the bay empty its values are kept but mean
      nothing. The guide's example gives a time to full of 340 h 30 min for a
      battery at 69 % drawing no current, so the time to full is meaningful
      only while the battery is charging.

  - models: [all]
    severity: warning
    text: >
      The guide marks /device/storage_mode read-only while describing it as
      set and returned; set_storage_mode follows the description and the
      architect's specification, which offer storage mode through network
      control. A charger that refuses it answers with an /osc/error entry and
      the command fails.

  - models: [all]
    severity: info
    text: >
      Identification is a query: reading /device/identify or a bay's identify
      starts it and is answered true. The guide documents no way to stop it
      or how long it lasts.

  - models: [all]
    severity: critical
    text: >
      set_network_manual, set_network_dhcp and set_mdns can move the charger
      to an address the core is not using; that cannot be undone from here.

  - models: [all]
    severity: info
    text: >
      API limits: the guide gives the L 6000 no restart, factory reset,
      location or firmware update method (firmware updates go through
      Wireless Systems Manager), and ipaddr, netmask and gateway are marked
      "Read/Write*" without saying what the asterisk means, so they are read
      only and the static_* methods are written instead.
