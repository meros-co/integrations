  get:
    summary: "Read any setting by its protocol keyword (*keyword ?); the reply also updates state"
    params:
      setting: { type: "string", max_length: 40, pattern: "^[a-z0-9][a-z0-9._]*$", required: true, label: "Setting", description: "The protocol keyword of the setting, as the protocol guide names it (brightness, lens.lock, 3d.format)." }
    send: "*{setting} ?"
    expect: { matches: "^(?i:ack) +\\S+ *= *(.*?) *$" }
    returns: value
  step:
    summary: "Step a setting one unit up or down (*keyword + or *keyword -)"
    params:
      setting: { type: "string", max_length: 40, pattern: "^[a-z0-9][a-z0-9._]*$", required: true, label: "Setting", description: "The protocol keyword of the setting, as the protocol guide names it (brightness, lens.lock, 3d.format)." }
      direction: { type: "enum", values: ["up", "down"], required: true, label: "Direction", description: "Up adds one to the value, down subtracts one." }
    send: "*{setting} {direction:map.step}"
    expect: { matches: "^(?i:ack)(?:\\s|$)" }
    returns: ack
  step_by:
    summary: "Step a setting up or down by an amount (*keyword +x or *keyword -x)"
    params:
      setting: { type: "string", max_length: 40, pattern: "^[a-z0-9][a-z0-9._]*$", required: true, label: "Setting", description: "The protocol keyword of the setting, as the protocol guide names it (brightness, lens.lock, 3d.format)." }
      direction: { type: "enum", values: ["up", "down"], required: true, label: "Direction", description: "Up adds the amount to the value, down subtracts it." }
      amount: { type: "int", min: 1, max: 9999, required: true, label: "Amount", description: "How much to add or subtract, in the setting's own units." }
    send: "*{setting} {direction:map.step}{amount}"
    expect: { matches: "^(?i:ack)(?:\\s|$)" }
    returns: ack
  reset_setting:
    summary: "Set a setting back to its default value (*keyword with no operator; *keyword # on INSIGHT)"
    params:
      setting: { type: "string", max_length: 40, pattern: "^[a-z0-9][a-z0-9._]*$", required: true, label: "Setting", description: "The protocol keyword of the setting, as the protocol guide names it (brightness, lens.lock, 3d.format)." }
    send:
      - { models: [titan-laser, m-vision-laser-18k, m-vision-laser-21000, m-vision-23000, e-vision-laser-15000, e-vision-laser-13000, e-vision-laser-11000-4k, e-vision-laser-10k, e-vision-laser-8500, e-vision-laser-4k, e-vision-10000i, e-vision-16000i, highlite-laser-ii-3d, highlite-laser-4k, e-vision-6900, mercury-quad, highlite-660-740, highlite-laser-3d, m-vision-930, titan-930-quad-led], message: "*{setting}" }
      - { models: [insight-4k], message: "*{setting} #" }
    expect: { matches: "^(?i:ack)(?:\\s|$)" }
    returns: ack

