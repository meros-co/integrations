spec: 1
id: digitalprojection-projector
name: Digital Projection projectors (ASCII control protocol)
vendor: Digital Projection
category: display

# Digital Projection's ASCII protocol on TCP 7000 (and RS-232): "*" + keyword +
# " = value" | " ?" | " +" | " -" | nothing (execute), ended by CR; every reply is
# one CR-terminated line beginning "ack" (or "ACK") or "nack" (or "NAK"). The
# keywords are shared across the series but each series documents its own set and
# value lists, so each series is a model with its own supports list; a command is
# named after its keyword (set_<keyword>, dots as underscores) and its parameter
# takes the union of the documented ranges, the per-series meanings listed in its
# description. INSIGHT 4K Laser (binary, TCP 43728), the older External Control
# Protocol (TCP 30000, HIGHlite 660 / Titan Quad / Titan 800 / Titan Pro / Lightning),
# the dVision 35 protocol and the Telnet ("op ..." and "VXX...") protocols of the
# E-Vision 4000/5000/5100/5900/6110/6500/7010/9000/9100 lines are different protocols
# and are not part of this spec.
