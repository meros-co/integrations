    note: "Manufacturer document. Command format, operators, ack/ACK and nack/NAK replies, default by keyword alone (p.3-4); per-model tables of HIGHlite Laser II 3D and HIGHlite Laser 4K (p.33-60), E-Vision 6900 and Mercury Quad (p.63-88), INSIGHT Dual Laser, Quad and Dual LED 4K with +x, -x and # operators (p.91-102). Its E-Vision Laser 7500/8500/10K/4K and M-Vision Laser 18K tables agree with the spreadsheets above, which this spec follows for those models."
  - title: "Protocol Guides, 115-482F, Rev F, October 2016"
    author: Digital Projection Ltd
    url: https://www.digitalprojection.co.uk/dpdownloads/Protocol/Protocol%20Guide%20Rev%20F.pdf
    note: "Manufacturer document. M-Vision 930 (p.93-105), HIGHlite 660 3D & 740 (p.109-125, serial 38400), HIGHlite Laser 3D Gen I (p.131-144), Titan 930 / Quad / LED (p.147-166, serial 38400); INSIGHT 4K Laser binary protocol on TCP 43728 (p.61-90), not used here."
  - title: "INSIGHT 4K Series Protocol Guide (INSIGHT 4K Quad, INSIGHT 4K Dual LED), 117-930A, Rev A, June 2016"
    author: Digital Projection Ltd
    url: https://www.digitalprojection.co.uk/dpdownloads/Protocol/Protocol%20Guide%20INSIGHT%204K.pdf
    note: "Manufacturer document. Earlier INSIGHT command list: power standby value, option slot inputs, lamp status values; serial 38400."
  - title: "Bitfocus companion-module-digitalprojection-projectors (MIT)"
    author: Bitfocus
    url: https://github.com/bitfocus/companion-module-digitalprojection-projectors
    note: "Open code read for corroboration only: \"*\" + command + CR per command, one reply per command awaited before the next, replies parsed as \"ack <keyword> = <value>\"."

transport:
  type: line-tcp
  port: 7000
  # "*" is part of every template; CR ends each command, and CR ends each reply.
  framing: terminated
  terminator: cr
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  # Only ack/ACK and nack/NAK lines answer a command; anything else (the keycode
  # messages of remote.test and keypad.test) goes to the telemetry rules only.
  reply_match: '(?i)^(ack|nak|nack)(\s|$)'
  # Any reply shows the projector is there; the E-Vision 8000i/10000i and 16000i,
  # which have no power keyword, answer it with nack.
  probe: "*power ?"

ports:
  - { port: 7000, protocol: tcp, role: control }

