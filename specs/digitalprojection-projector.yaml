  w_close_open: { "true": "close", "false": "open" }

commands:
  set_threed_darktime:
    summary: "Set 3D dark time (3d.darktime)"
    params:
      value: { type: "int", min: 0, max: 8000, required: true, label: "3D dark time", description: "Dark time between the left and right eye images: TITAN Laser, M-Vision Laser 18K, M-Vision Laser 21000, M-Vision 23000, E-Vision Laser 15000, E-Vision Laser 13000, E-Vision Laser 11000 4K, E-Vision Laser 10K, E-Vision Laser 7500/8500, E-Vision Laser 4K-UHD, E-Vision 8000i/10000i, E-Vision 16000i: 0 = 0.65 ms, 1 = 1.3 ms, 2 = 1.95 ms; HIGHlite Laser II 3D, Mercury Quad, HIGHlite Laser 3D, M-Vision 930: 0 = 0.65 ms, 1 = 1.3 ms, 2 = 1.95 ms, 3 = 2.5 ms; INSIGHT 4K: 0 to 8000; HIGHlite 660/740, TITAN 930/Quad/LED: 0 = 0 us, 1 = 650 us, 2 = 1300 us, 3 = 7500 us." }
    send:
      - { models: [titan-laser, m-vision-laser-18k, m-vision-laser-21000, m-vision-23000, e-vision-laser-15000, e-vision-laser-13000, e-vision-laser-11000-4k, e-vision-laser-10k, e-vision-laser-8500, e-vision-laser-4k, e-vision-10000i, e-vision-16000i, highlite-laser-ii-3d, mercury-quad, insight-4k, highlite-660-740, highlite-laser-3d, m-vision-930, titan-930-quad-led], message: "*3d.darktime = {value}" }
    expect: { matches: "^(?i:ack)(?:\\s|$)" }
    returns: ack
  set_threed_dlplink:
    summary: "Set DLP Link (3d.dlplink)"
    params:
      enabled: { type: "bool", required: true, label: "DLP Link", description: "On or off (0 = Off, 1 = On on the wire)." }
    send:
      - { models: [m-vision-laser-18k, m-vision-laser-21000, m-vision-23000, e-vision-laser-15000, e-vision-laser-13000, e-vision-laser-11000-4k, e-vision-laser-10k, e-vision-laser-8500, e-vision-laser-4k, e-vision-10000i, e-vision-16000i, e-vision-6900, m-vision-930], message: "*3d.dlplink = {enabled:bool01}" }
    expect: { matches: "^(?i:ack)(?:\\s|$)" }
    returns: ack
  set_threed_dominance:
    summary: "Set 3D eye dominance (3d.dominance)"
    params:
      value: { type: "int", min: 0, max: 1, required: true, label: "3D eye dominance", description: "Which eye the first frame of a 3D pair goes to: 0 = Normal, 1 = Reverse." }
    send:
      - { models: [titan-laser, m-vision-laser-18k, m-vision-laser-21000, m-vision-23000, e-vision-laser-15000, e-vision-laser-13000, e-vision-laser-11000-4k, e-vision-laser-10k, e-vision-laser-8500, e-vision-laser-4k, e-vision-10000i, e-vision-16000i, highlite-laser-ii-3d, e-vision-6900, mercury-quad, highlite-laser-3d, m-vision-930], message: "*3d.dominance = {value}" }
    expect: { matches: "^(?i:ack)(?:\\s|$)" }
    returns: ack
  set_threed_dominance_by_name:
    summary: "Set 3D eye dominance (3d.dominance)"
    params:
      value: { type: "enum", values: ["left", "right"], required: true, label: "3D eye dominance", description: "Which eye the first frame of a 3D pair goes to: left, right." }
    send:
      - { models: [insight-4k, highlite-660-740, titan-930-quad-led], message: "*3d.dominance = {value}" }
    expect: { matches: "^(?i:ack)(?:\\s|$)" }
    returns: ack
  set_threed_enable:
    summary: "Set 3D (3d.enable)"
    params:
      enabled: { type: "bool", required: true, label: "3D", description: "On or off (on, off on the wire)." }
    send:
      - { models: [insight-4k, highlite-660-740, titan-930-quad-led], message: "*3d.enable = {enabled:map.w_on_off}" }
    expect: { matches: "^(?i:ack)(?:\\s|$)" }
    returns: ack
  set_threed_format:
    summary: "Set 3D format (3d.format)"
    params:
      value: { type: "int", min: 0, max: 6, required: true, label: "3D format", description: "3D input format: TITAN Laser, E-Vision Laser 11000 4K, E-Vision Laser 4K-UHD: 0 = Off, 1 = Dual-Pipe, 2 = Frame Sequential; M-Vision Laser 18K, M-Vision Laser 21000, M-Vision 23000, E-Vision Laser 13000, E-Vision Laser 10K, E-Vision Laser 7500/8500, HIGHlite Laser II 3D, Mercury Quad: 0 = Off, 1 = Auto, 2 = Side-By-Side (Half), 3 = Top-And-Bottom, 4 = Dual-Pipe, 5 = Frame Sequential; E-Vision Laser 15000: 0 = Off, 1 = Auto, 2 = Side by Side (Half), 3 = Top and Bottom, 4 = Dual Pipe, 5 = Frame Sequential; E-Vision 8000i/10000i, E-Vision 16000i: 0 = Off, 1 = Auto, 2 = Side by Side, 3 = Top and Bottom, 4 = Dual Pipe, 5 = Frame Sequential, 6 = Frame Packing; E-Vision 6900: 0 = Off, 1 = Auto, 2 = Side-By-Side (Half), 3 = Top-And-Bottom, 4 = Frame Sequential; HIGHlite Laser 3D, M-Vision 930: 0 = Off, 1 = Auto, 2 = Side-By-Side (Half), 3 = Top-And-Bottom, 4 = Dual-Pipe." }
