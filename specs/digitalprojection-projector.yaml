  threed.syncref_status: { type: int, description: "Whether an external 3D reference signal of at least 10 Hz is detected: TITAN Laser: 0 = No detect the external reference signal (< 10Hz), 1 = External reference signal existing ( >= 10Hz); E-Vision Laser 11000 4K, E-Vision Laser 4K-UHD: 0 = no sync, 1 = sync detected; E-Vision 8000i/10000i: 0 = No detection of the external reference signal (< 10Hz), 1 = External reference signal exists ( >= 10Hz); E-Vision 16000i: 0 = Not detected the external reference signal (< 10Hz), 1 = External reference signal exists ( >= 10Hz)." }

quirks:
  - models: [all]
    severity: info
    text: >
      Every command is "*", the keyword, a space, the operator, a space and the value,
      ended by CR: "*brightness = 10", "*brightness ?", "*zoom.in". The spaces are
      required; "*orientation=3" is refused. Each reply is one line ending in CR: "ack" (or
      "ACK", depending on the model) followed by the keyword and value on success, "nack"
      (or "NAK") followed by a short reason on failure. Wait for the reply before sending
      the next command (the queue does). A keyword sent with no operator sets that setting
      to its default (reset_setting); INSIGHT uses "#" for that.
  - models: [all]
    severity: info
    text: >
      Each series documents its own values for a keyword. A command takes the union of the
      documented ranges and its description lists what each value means per series; a value
      outside the range of the series opened is refused by the projector with nack. State
      keeps the number the projector reports, so its meaning is the one listed for the
      model.
  - models: [all]
    severity: warning
    text: >
      Most picture settings are only accepted while the projector is imaging, many only
      with a source locked, and the lens commands only with lens.lock off; the protocol
      guides list these conditions per keyword. Outside them the projector answers nack,
      and polls of those settings in standby are answered nack and leave state as it was.
  - models: [insight-4k, highlite-660-740, titan-930-quad-led]
    severity: info
    text: >
      The older series (TITAN 930/Quad/LED, HIGHlite 660/740, INSIGHT) take words for some
      values ("On, Off", "open or close", "pos, neg", "auto, seq, fpack"); the guides write
      them in either case and their own example is lowercase ("*freeze = off"), so they are
      sent lowercase. Commands whose other series take numbers have a second "_by_name"
      command for the word form.
  - models: [all]
    severity: info
    text: >
      Commands are named after their keyword: set_<keyword>, and the keyword itself for an
      action, with dots as underscores, "3d." as "threed_" and "4corner" as "four_corner".
      get, step, step_by and reset_setting take any keyword. A few series name a setting
      differently (amx.control for lan.amx, auto.src, osd.rotate, picture.mode, lamp.pow,
      standby.power, eb.blu.btm); the command and state are the common name and each model
      is sent its own keyword.
  - models: [m-vision-laser-18k, e-vision-laser-15000, e-vision-laser-13000, e-vision-laser-10k, e-vision-laser-8500, e-vision-laser-11000-4k, e-vision-10000i, e-vision-16000i, highlite-laser-4k]
    severity: warning
    text: >
      Spellings and values are sent as the documents print them, including likely errors:
      "altiutude.info" (M-Vision Laser 18K, E-Vision Laser 15000/13000/10K/7500/8500),
      "user2.target2.cx" and "user2.target2.cy" (E-Vision Laser 11000 4K), test.pattern
      numbers 8 and 9 listed twice (E-Vision Laser 15000), blank.screen "0 = Logo / 0 =
      Black" (E-Vision Laser 11000 4K and 4K-UHD), auto.poweroff listed as "Off / 5Min. /
      10Min. / 15Min. / 20Min." without numbers (E-Vision 8000i/10000i, 16000i, taken as 0
      to 4), lens.type "1 to 10" and osd.lang with Spanish twice (HIGHlite Laser 4K).
  - models: [all]
    severity: critical
    text: >
      These cannot be undone from the protocol and change the picture, the lens or the
      connection at once: factory_reset (every setting), recall_picture_memory,
      load_lens_memory and recall_lens_position (the picture settings or the lens move
      live), set_lan_ip, set_lan_subnet, set_lan_gateway, set_lan_dhcp and the control port
      equivalents and set_network_mode (the connection to this port is lost), laser_reset
      (the laser hour counters), the geometry and color resets (warp_reset, eb_reset,
      blanking_reset, keystone_reset, rotation_reset, pin_barrel_reset, four_corner_reset,
      arc_reset, hsg_reset, gainlift_reset, user_std_reset, user_target_reset,
      user2_target_reset, user_p7_rst, mcgd_factory, pri_reset, digi_zoom_rst) and
      calibrate_zoom and calibrate_focus (the lens drives to its end stops). Each model has
      those its document lists.
  - models: [all]
    severity: warning
    text: >
      save_picture_memory, save_lens_memory, store_lens_position, cust_wp_write and
      cust_wp_clear overwrite stored data without asking; set_power off (and power_off)
      puts the projector into cool-down, and a laser or lamp projector may not accept power
      on again until it has finished.
  - models: [m-vision-laser-21000, m-vision-23000, e-vision-laser-11000-4k, e-vision-laser-4k]
    severity: warning
    text: >
      set_remote_test and set_keypad_test make the projector report each remote or keypad
      keycode on the connection; those lines are not command replies (reply_match) and
      change no state. led_test and ir_test take over the status LEDs and IR receivers
      until set back (255 or 4 "back to normal" for the LEDs, 3 "all on" for the
      receivers).
  - models: [e-vision-10000i, e-vision-16000i]
    severity: info
    text: >
      E-Vision 8000i/10000i and 16000i have no power keyword: power_on and power_off switch
      them, and status reports the state (0 standby, 1 warming up, 2 imaging, 3 cooling, 4
      error).
  - models: [e-vision-6900, mercury-quad]
    severity: info
    text: >
      E-Vision 6900 reports status 0 for power off and 1 for power on only. E-Vision 6900
      and Mercury Quad document lan.dhcp and lan.power as 0 for on and 1 for off, and the
      Mercury Quad lan.amx and pip.mode too, the reverse of the other series; set_lan_dhcp,
      set_lan_power and set_lan_amx send them so and state reads them so, while
      set_pip_mode takes the number as documented (0 on, 1 off on the Mercury Quad).
  - models: [insight-4k]
    severity: info
    text: >
      One model covers INSIGHT Dual Laser 4K, INSIGHT 4K Quad (lamps) and INSIGHT 4K Dual
      LED, which share a document: the lamp keywords apply to the Quad, the laser keywords
      to the Dual Laser. The 2016 guide adds a power value "standby" and inputs 4 and 5
      (option slots); the 2017 guide, which this spec follows for power, lists on and off.
      formatter.pattern can be set but its value cannot be read; gamut, csc.preset and
      ir.key are set only. The TCP port is 7000 and the projector takes its address from
      DHCP unless one is set on the OSD. INSIGHT 4K Laser uses a binary protocol on TCP
      43728 and is not covered.
  - models: [highlite-660-740, titan-930-quad-led]
    severity: info
    text: >
      lens.up, lens.down, lens.left and lens.right take a speed and move until stop_lens or
      the limit (lens_up_at_speed and so on); nudge_* move briefly. formatter.pattern shows
      a formatter pattern on any input until it is set to 21 (off); test.pattern needs
      input 8 (Test Pattern). lamp.power below 80 (TITAN) or 85 (HIGHlite) is taken as that
      minimum. inlet.temp and dmd.temp are in degrees Celsius; lamp hours are HH:MM.
  - models: [highlite-laser-ii-3d, highlite-laser-4k]
    severity: warning
    text: >
      The Rev H table for the HIGHlite Laser II 3D and 4K gives no value for some rows in
      one model's column; a keyword is listed for a model only where the table gives it a
      value or operator for that model. HIGHlite Laser II 3D therefore has no h.keystone,
      v.keystone, ir.enable, osd.lang, blank.screen or lens memory commands, although the
      projector may have them.
  - models: [all]
    severity: info
    text: >
      API limits: the protocol has no notifications, so state is only as fresh as the poll
      (2 s for power, status, input, shutter, freeze and errors; 60 s for settings). The
      lens position itself cannot be read (only lens memories, and on some series which
      memories are used). cust_wp_send only switches a custom warp transfer mode; the warp
      file itself is not sent over this protocol. The UDP discovery (port 30718, answers
      broadcast to 30717) and the UDP form of the commands (with "!" for every projector)
      are not used. errcode is only meaningful while status is 4 (error); its codes are
      listed in each series' manual.
  - models: [all]
    severity: info
    text: >
      No request lists the projector's inputs. Each series' command list documents only the
      "input" keyword (set and read the selected input), with the series' inputs in its
      values column (row 23 of the 122-710A TITAN Laser list, row 25 of the 122-713A
      M-Vision Laser 18K list, and the same row in the others; the "Inputs" table of each
      model in the Protocol Guide Rev F); those meanings are in set_input's description. Only
      INSIGHT 4K documents "input.max ?", the number of the highest available input
      (Protocol Guide INSIGHT 4K, Inputs, p. 4), read on connecting into input.max.
      "model.name ?" is read on connecting into device.model.
