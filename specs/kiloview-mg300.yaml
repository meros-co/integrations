            body: '{"name":{name:json},"protocol":"rtsp","is_enable":{enabled},"session":{session:json},"port":{port},"http_tunnel_port":{http_tunnel_port},"auth":{auth},"user":{user:json},"pwd":{password:json},"multicast_enable":{multicast},"multicast_addr":{multicast_address:json},"multicast_ttl":{multicast_ttl},"multicast_port_min":{multicast_port_min},"multicast_port_max":{multicast_port_max}}' }
    expect: *ok
    returns: ack
