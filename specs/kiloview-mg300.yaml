      multicast_ttl: &gw_mc_ttl { type: int, min: 1, max: 255, default: 127, label: Multicast TTL, description: "The multicast time to live." }
      multicast_port_min: &gw_mc_min { type: int, min: 1, max: 65535, default: 31000, label: Lowest multicast port, description: "The lowest port of the multicast range." }
      multicast_port_max: &gw_mc_max { type: int, min: 1, max: 65535, default: 31004, label: Highest multicast port, description: "The highest port of the multicast range." }
