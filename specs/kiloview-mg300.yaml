# Every reply is {"result":"ok"} with data, or {"result":"error","msg":code}
# (section 1). Writes are read back by the telemetry rules' then_send on
# their "ok" reply.
commands:
  # --- Users and authentication (sections 1.1, 3) ---
  login:
    summary: "Log in and return the token for the token setting (POST /api/users/login)"
    params:
      username: { type: string, default: admin, max_length: 64, label: User name, description: "The account to log in as; admin by default." }
      password: { type: string, secret: true, required: true, max_length: 64, label: Password, description: "That account's password; admin until it is changed." }
    send: { method: POST, path: /api/users/login, content_type: application/json,
            body: '{"username":{username:json},"password":{password:json}}' }
    expect: { status: 200, json_equals: { "$.result": "ok" }, json_path: "$.data.token" }
    returns: value
  logout:
    summary: "End the token setting's session; the token stops working at once (POST /api/users/logout)"
    send: { method: POST, path: /api/users/logout }
    expect: &ok { status: 200, json_equals: { "$.result": "ok" } }
    returns: ack
  list_users:
    summary: "Accounts with id, user name, alias, role, phone, description and status, and the roles (GET /api/users/list)"
    send: { method: GET, path: /api/users/list }
    expect: &val { status: 200, json_equals: { "$.result": "ok" }, json_path: "$.data" }
    returns: value
  search_users:
    summary: "Accounts whose user name, alias or role name matches a search (GET /api/users/list?search=)"
    params:
      search: { type: string, required: true, max_length: 64, label: Search, description: "Text matched against user names, aliases and role names." }
    send: { method: GET, path: /api/users/list, query: { search: "{search}" } }
    expect: *val
    returns: value
  get_user:
    summary: "One account's full record, its password included, by user name (GET /api/users/info with a JSON body)"
    params:
      username: { type: string, required: true, max_length: 64, label: User name, description: "The account's login name." }
    send: { method: GET, path: /api/users/info, content_type: application/json, body: '{"username":{username:json}}' }
    expect: *val
    returns: value
  add_user:
    summary: "Create an account with a role (POST /api/users/add); at most 32 accounts"
    params:
      username: { type: string, required: true, max_length: 64, label: User name, description: "The new account's login name." }
      password: { type: string, secret: true, required: true, max_length: 64, label: Password, description: "The new account's password." }
      alias: { type: string, required: true, max_length: 64, label: Alias, description: "A display name for the account." }
      role: &role_id { type: int, min: 1, max: 5, required: true, label: Role, description: "The role id: 1 administrator, 2 regular administrator, 3 to 5 general roles 1 to 3." }
      phone: { type: string, default: "", max_length: 32, label: Phone, description: "A contact number, or empty." }
      description: { type: string, default: "", max_length: 256, label: Description, description: "A free-text description, or empty." }
    send: { method: POST, path: /api/users/add, content_type: application/json,
            body: '{"username":{username:json},"password":{password:json},"alias":{alias:json},"role_id":{role},"phone":{phone:json},"descript":{description:json}}' }
    expect: *ok
    returns: ack
  remove_user:
    summary: "Delete an account; its token stops working (POST /api/users/remove)"
    params:
      id: &user_id { type: int, min: 1, required: true, label: User id, description: "The account's id, as list_users gives it." }
    send: { method: POST, path: /api/users/remove, content_type: application/json, body: '{"id":{id}}' }
    expect: *ok
    returns: ack
  modify_user:
    summary: "Change an account's user name, alias, role, phone and description (POST /api/users/modify)"
    params:
      id: *user_id
      username: { type: string, required: true, max_length: 64, label: User name, description: "The account's login name, the current one to keep it." }
      alias: { type: string, required: true, max_length: 64, label: Alias, description: "The account's display name." }
      role: *role_id
      phone: { type: string, default: "", max_length: 32, label: Phone, description: "A contact number, or empty." }
      description: { type: string, default: "", max_length: 256, label: Description, description: "A free-text description, or empty." }
    send: { method: POST, path: /api/users/modify, content_type: application/json,
            body: '{"id":{id},"username":{username:json},"alias":{alias:json},"role_id":{role},"phone":{phone:json},"descript":{description:json}}' }
    expect: *ok
    returns: ack
  set_user_password:
    summary: "Change an account's password (POST /api/users/modify with the password alone)"
    params:
      id: *user_id
      password: { type: string, secret: true, required: true, max_length: 64, label: New password, description: "The account's new password." }
    send: { method: POST, path: /api/users/modify, content_type: application/json, body: '{"id":{id},"password":{password:json}}' }
    expect: *ok
    returns: ack
  list_roles:
    summary: "Roles with their permission trees, each permission checked or not (GET /api/roles/permissions)"
    send: { method: GET, path: /api/roles/permissions }
    expect: *val
    returns: value
  set_role_permissions:
    summary: "Set the permissions of a general role (POST /api/roles/permupdate with permission_ids)"
    params:
      role: &general_role { type: int, min: 3, max: 5, required: true, label: Role, description: "The general role's id, 3 to 5; the two administrator roles cannot be changed." }
      permissions: { type: json, required: true, label: Permissions, description: "The array of permission ids the role has, such as [2, 3, 4], as list_roles numbers them." }
    send: { method: POST, path: /api/roles/permupdate, content_type: application/json, body: '{"role_id":{role},"permission_ids":{permissions}}' }
    expect: *ok
    returns: ack
  set_role_info:
    summary: "Set the name and description of a general role (POST /api/roles/permupdate with name and description)"
    params:
      role: *general_role
      name: { type: string, required: true, max_length: 64, label: Role name, description: "The role's name, such as gen_role_1." }
      description: { type: string, default: "", max_length: 256, label: Description, description: "The role's description." }
    send: { method: POST, path: /api/roles/permupdate, content_type: application/json, body: '{"role_id":{role},"name":{name:json},"description":{description:json}}' }
    expect: *ok
    returns: ack
  get_auth_settings:
    summary: "Whether token authentication is on and whether this account may change it (POST /api/users/auth_info_get)"
    send: { method: POST, path: /api/users/auth_info_get }
    expect: *val
    returns: value
  set_auth_enabled:
    summary: "Turn token authentication on or off for every request (POST /api/users/auth_info_set)"
    params:
      enabled: { type: bool, required: true, label: Authentication, description: "On makes every request but login and info/get carry a valid token; off accepts any request." }
    send: { method: POST, path: /api/users/auth_info_set, content_type: application/json, body: '{"enable":{enabled}}' }
    expect: *ok
    returns: ack
  check_session:
    summary: "Whether the token setting is still valid, with its account's user name and alias (POST /api/users/session/check)"
    send: { method: POST, path: /api/users/session/check }
    expect: *val
    returns: value

  # --- Info (section 2) ---
  get_info:
    summary: "Device name, firmware, hardware and software versions, serial number (GET /api/info/get)"
    send: { method: GET, path: /api/info/get }
    expect: *val
    returns: value

  # --- Overlays (section 4) ---
  list_overlays:
    summary: "Overlay templates: name, background, whether selected, being edited or modified (GET /api/overlay/list)"
    send: { method: GET, path: /api/overlay/list }
    expect: *val
    returns: value
  add_overlay:
    summary: "Add an empty overlay template named new_template (POST /api/overlay/add)"
    send: { method: POST, path: /api/overlay/add }
    expect: *ok
    returns: ack
  remove_overlay:
    summary: "Delete an overlay template that no output uses (POST /api/overlay/remove)"
    params:
      overlay: &overlay { type: int, min: 1, required: true, label: Overlay, description: "The overlay template's id, as list_overlays gives it." }
    send: { method: POST, path: /api/overlay/remove, content_type: application/json, body: '{"overlay_id":{overlay}}' }
    expect: *ok
    returns: ack
  copy_overlay:
    summary: "Copy an overlay template with its items; the copy's name ends in _copy (POST /api/overlay/copy)"
    params:
      overlay: *overlay
    send: { method: POST, path: /api/overlay/copy, content_type: application/json, body: '{"overlay_id":{overlay}}' }
    expect: *ok
    returns: ack
  rename_overlay:
    summary: "Rename an overlay template (POST /api/overlay/rename)"
    params:
      overlay: *overlay
      name: { type: string, required: true, max_length: 64, label: Name, description: "The template's new name." }
    send: { method: POST, path: /api/overlay/rename, content_type: application/json, body: '{"id":{overlay},"name":{name:json}}' }
    expect: *ok
    returns: ack
  save_overlay:
    summary: "Save an overlay template's edits so they reach the outputs (POST /api/overlay/save)"
    params:
      overlay: *overlay
    send: { method: POST, path: /api/overlay/save, content_type: application/json, body: '{"overlay_id":{overlay}}' }
    expect: *ok
    returns: ack
  cancel_overlay_changes:
    summary: "Discard an overlay template's unsaved edits (POST /api/overlay/cancel)"
    params:
      overlay: *overlay
    send: { method: POST, path: /api/overlay/cancel, content_type: application/json, body: '{"overlay_id":{overlay}}' }
    expect: *ok
    returns: ack
  select_overlay:
    summary: "Show an overlay template on an output (POST /api/overlay/select)"
    params:
      overlay: *overlay
      output: { type: int, min: 0, max: 2, required: true, label: Output, description: "The output, 1 or 2; the document's example sends 0, whose meaning it does not give." }
    send: { method: POST, path: /api/overlay/select, content_type: application/json, body: '{"overlay_id":{overlay},"output_id":{output}}' }
    expect: *ok
    returns: ack
  get_overlay_items:
    summary: "An overlay template's image and text items with their position, size, layer and style (GET /api/overlay/items/get)"
    params:
      overlay: *overlay
    send: { method: GET, path: /api/overlay/items/get, query: { overlay_id: "{overlay}" } }
    expect: *val
    returns: value
  set_overlay_items:
    summary: "Replace every item of the overlay template being edited with the list of section 4.9 (POST /api/overlay/items/set)"
    params:
      overlay: *overlay
      mode: { type: string, required: true, max_length: 32, label: Mode, description: "The edit mode; the document's one value, z_index, changes only the stacking order." }
      items: { type: json, required: true, label: Items, description: "The whole list of items: objects with id, type (image or text), x, y, width and height (per mille), z_index, opacity, img_id for images, and text_type, content, format, font_color, stroke_enable, stroke_color and stroke_size for text." }
    send: { method: POST, path: /api/overlay/items/set, content_type: application/json, body: '{"overlay_id":{overlay},"mode":{mode:json},"list":{items}}' }
    expect: *ok
    returns: ack
  add_overlay_item:
    summary: "Add an image or text item to an overlay template (POST /api/overlay/items/add)"
    params:
      overlay: *overlay
      type: { type: enum, values: [image, text], required: true, label: Item type, description: "An image item or a text item." }
    send: { method: POST, path: /api/overlay/items/add, content_type: application/json, body: '{"overlay_id":{overlay},"type":"{type}"}' }
    expect: *ok
    returns: ack
  remove_overlay_item:
    summary: "Remove an item from an overlay template (POST /api/overlay/items/remove)"
    params:
      overlay: *overlay
      item: { type: int, min: 1, required: true, label: Item, description: "The item's id, as get_overlay_items gives it." }
    send: { method: POST, path: /api/overlay/items/remove, content_type: application/json, body: '{"overlay_id":{overlay},"item_id":{item}}' }
    expect: *ok
    returns: ack
  list_overlay_images:
    summary: "Images uploaded for overlays, with their path and size (GET /api/overlay/images/list)"
    send: { method: GET, path: /api/overlay/images/list }
    expect: *val
    returns: value
  remove_overlay_image:
    summary: "Delete an uploaded overlay image (POST /api/overlay/images/remove)"
    params:
      image: { type: int, min: 1, required: true, label: Image, description: "The image's id, as list_overlay_images gives it." }
    send: { method: POST, path: /api/overlay/images/remove, content_type: application/json, body: '{"img_id":{image}}' }
    expect: *ok
    returns: ack
  upload_overlay_image:
    summary: "Upload an image for overlays, multipart form data in the field img_url (POST /api/overlay/images/add)"
    params:
      file: { type: binary, required: true, label: Image file, description: "The image file, such as a PNG logo." }
      filename: { type: string, default: image.png, max_length: 255, label: File name, description: "The file name sent with the upload." }
    send:
      method: POST
      path: /api/overlay/images/add
      multipart:
        - { name: img_url, binary: file, filename: "{filename}", content_type: application/octet-stream }
    expect: *ok
    returns: ack
  get_overlay_editing:
    summary: "The overlay template being edited and its editing preview image path (GET /api/overlay/editing/get with a JSON body)"
    params:
      overlay: *overlay
    send: { method: GET, path: /api/overlay/editing/get, content_type: application/json, body: '{"overlay_id":{overlay}}' }
    expect: *val
    returns: value
  select_overlay_editing:
    summary: "Make an overlay template the one being edited; one at a time (POST /api/overlay/editing/select)"
    params:
      overlay: *overlay
    send: { method: POST, path: /api/overlay/editing/select, content_type: application/json, body: '{"overlay_id":{overlay}}' }
    expect: *ok
    returns: ack
  get_overlay_preview:
    summary: "The overlay template shown on an output and its preview image path (GET /api/overlay/preview/get with a JSON body)"
    params:
      output: &output { type: int, min: 1, max: 2, required: true, label: Output, description: "The gateway's output, 1 or 2." }
    send: { method: GET, path: /api/overlay/preview/get, content_type: application/json, body: '{"output_id":{output}}' }
    expect: *val
    returns: value
  list_overlay_datetime_formats:
    summary: "Date and time formats a text item can show, each with an example (GET /api/overlay/datetime/format/list)"
    send: { method: GET, path: /api/overlay/datetime/format/list }
    expect: *val
    returns: value
  list_overlay_fonts:
    summary: "Fonts for overlay text (GET /api/overlay/font/list)"
    send: { method: GET, path: /api/overlay/font/list }
    expect: *val
    returns: value

  # --- Sources (section 5) ---
  list_source_groups:
    summary: "Source groups with their streams and each stream's status (GET /api/source/groups/list with a JSON body)"
    send: { method: GET, path: /api/source/groups/list, content_type: application/json, body: '{"is_need_stream":true}' }
