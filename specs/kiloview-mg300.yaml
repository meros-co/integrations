      port: &gw_rtsp_port { type: int, min: 1, max: 65535, required: true, label: RTSP port, description: "The RTSP server port." }
      http_tunnel_port: &gw_tunnel { type: int, min: 1, max: 65535, default: 8554, label: HTTP tunnel port, description: "The port for RTSP over HTTP; 8554 in the document's example." }
