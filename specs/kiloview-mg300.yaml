spec: 1
id: kiloview-mg300
name: Kiloview MG300 V2 video media gateway and decoder
vendor: Kiloview
category: router

source:
  - title: "MG300V2 Gateway Decoder API document V1.0.0 (MG300V2_API文档_Cn_1.0.0_20260907), for firmware 2.20.0132"
    author: Kiloview
    url: "https://enstatic.kiloview.com/wp-content/uploads/2026/09/MG300V2_API%E6%96%87%E6%A1%A3_Cn_1.0.0_20260907.pdf"
    note: >
      Manufacturer-documented, public, in Chinese; linked as the API of the
      MG300 V2 from https://www.kiloview.com/en/docs/rmg300-v2-video-media-gateway/api/
      (checked 2026-10-27). Read in the Chinese original; field tables, whose columns
      are misaligned in the PDF, are read together with the examples. Used:
      section 1 (paths under /api, the result/data/msg reply, methods not
      enforced), 1.1-1.2 (the token from the login reply, sent in the app
      header as the JSON object {"token": ...}; login and info/get need
      none), 1.3 (error codes), 2 INFO (info/get), 3 USER (login, list,
      add, remove, modify, role permissions and their update, logout, the
      authentication switch, user info, session check, the permission
      codes from 2000), 4 OVERLAY (templates: list, add, remove, copy,
      rename, save, cancel, select; items get, set, add, remove; images
      list, remove, upload; editing get and select; preview get; date and
      time formats; fonts), 5 SOURCE (groups list, add, rename, remove,
      reorder; streams add and modify for RTSP, RTMP, RTMPS, SRT, RTMP
      server, RTP, UDP, Zixi, HTTP, HTTPS and NDI, remove, copy, move), 6
      LAYOUT (template list, list, add, remove, select, modify, save,
      resave, reload, rename), 7 OUTPUT (interfaces get and set, list, get,
      source set and remove, resolutions, audio mix, PTZ, audio levels,
      border, background, audio check, MPEG-TS programs, encoding, VU
      meters, mute), 8 GATE (gateway stream list, add for RTMP, RTSP, RTP,
      TS, SRT, HLS and NDI HX, delete, update, source binding, batch
      enable, the encoded preview output), 9 NETWORK, 10 SYSTIME, 11 SYSTEM
      (reboot, reset, restore, device name, URL parsing, configuration
      import), 12 MAINTENANCE (CPU, memory, temperature; the no-signal
      picture), 13 FIRMWARE, 14 PREVIEW, 15 NDI discovery.
  - title: "Kiloview D-series decoder spec in this repository (kiloview-decoder)"
    author: Kiloview (Dxx Decoder API Documentation v2.2)
    url: "https://enstatic.kiloview.com/wp-content/uploads/2026/05/%E2%80%8CDxx-Decoder-API-Documentation-v2.2-20250623-1.pdf"
    note: >
      The same vendor's decoder API, from which this one grew; read for
      layout and naming only. Where the two differ (type in lower case,
      the app header holding the token alone, the NDI discovery list keyed
      by id, the interfaces read by query), this spec follows the MG300 V2
      document.

settings:
  scheme:
    type: enum
    values: [http, https]
    default: http
    label: Scheme
    description: "http, or https where the gateway's HTTPS port is enabled; its certificate is not checked."
  token:
    type: string
    secret: true
    default: ""
    max_length: 256
    label: Token
    description: "The token the login command returns; every request carries it in the app header (an empty token until it is set, which only login and info/get accept)."

ports:
  - { port: 80, protocol: http, role: control, when: "scheme http" }
  - { port: 443, protocol: https, role: control, setting: scheme, when: "scheme https" }

transport:
  type: http
  port: 80
  https_port: 443
  scheme: { setting: scheme }
  accept_invalid_certs: true
  auth: none
  timeout_ms: 5000
  # Section 1.1: every request but the login and info/get carries the
  # header app, a JSON object holding the login's token.
  headers:
    app: '{"token":{settings.token:json}}'
  probe: { method: GET, path: /api/info/get }

maps:
  dhcp: { "true": "y", "false": "n" }
  rtmp_security: { none: "none", token: "token" }
  ndi_discovery_method: { public: "1", manual: "2", group: "3", server: "4" }
  white_balance: { auto: ptz_white_balance_auto, indoor: ptz_white_balance_indoor, outdoor: ptz_white_balance_outdoor, oneshot: ptz_white_balance_oneshot }
  no_signal: { no_signal_image: "0", black: "1", none: "2" }
  encode_profile: { high: "0", main: "1", baseline: "2" }

