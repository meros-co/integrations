  network.interfaces.*.enabled:       { type: bool, description: "The network port (keyed by name, eth0 or eth1) is enabled" }
  network.interfaces.*.link:          { type: string, description: "Link state: up or down" }
  network.interfaces.*.dhcp:          { type: bool, description: "The address comes from DHCP" }
  network.interfaces.*.ip:            { type: string, description: "IP address" }
  network.interfaces.*.mask:          { type: string, description: "Subnet mask" }
  network.interfaces.*.gateway:       { type: string, description: "Gateway" }
  network.interfaces.*.dns:           { type: string, description: "DNS server" }
  network.interfaces.*.mac:           { type: string, description: "MAC address" }
  network.interfaces.*.maintenance.enabled: { type: bool, description: "The maintenance (second) address is on" }
  network.interfaces.*.maintenance.ip:      { type: string, description: "Maintenance address" }
  network.interfaces.*.maintenance.mask:    { type: string, description: "Maintenance subnet mask" }
  network.interfaces.*.maintenance.gateway: { type: string, description: "Maintenance gateway" }
  network.http.enabled:   { type: bool, description: "The web server answers HTTP" }
  network.http.port:      { type: int, description: "HTTP port" }
  network.https.enabled:  { type: bool, description: "The web server answers HTTPS" }
  network.https.port:     { type: int, description: "HTTPS port" }
  network.http_auth:      { type: bool, description: "The authEnable flag the HTTP port read gives (the document calls it constant)" }
  network.routes.*.interface: { type: string, description: "Network port of a static route, keyed by route id" }
  network.routes.*.ip:        { type: string, description: "Route destination" }
  network.routes.*.netmask:   { type: string, description: "Route subnet mask" }
  network.routes.*.gateway:   { type: string, description: "Route gateway" }
  network.routes.*.mtu:       { type: int, description: "Route MTU, bytes" }
  network.routes.*.metric:    { type: int, description: "Route metric" }
  network.routes.*.enabled:   { type: bool, description: "The route is used" }

  time.current:     { type: string, description: "Gateway time, YYYY-MM-DD HH:MM:SS, as of the last read" }
  time.source:      { type: string, description: "Time source: ntp, pc or manual" }
  time.timezone:    { type: string, description: "Time zone name, such as Asia/Shanghai" }
  time.offset:      { type: int, description: "Time zone offset from UTC, hours" }
  time.ntp_servers: { type: string, description: "NTP servers, separated by spaces" }

  users.*.username:    { type: string, description: "Account name, keyed by user id" }
  users.*.alias:       { type: string, description: "Account display name" }
  users.*.role:        { type: int, description: "Account role id (see roles)" }
  users.*.role_name:   { type: string, description: "Account role name, such as admin_regular" }
  users.*.phone:       { type: string, description: "Contact number" }
  users.*.description: { type: string, description: "Account description" }
  users.*.created:     { type: string, description: "Creation time as the gateway gives it (a Unix time string)" }
  users.*.created_by:  { type: int, description: "Id of the account that created it" }
  users.*.updated:     { type: string, description: "Last change time, such as 1970-01-03T07:08:53" }
  users.*.password_changed: { type: bool, description: "The default password has been changed" }
  users.*.is_self:     { type: bool, description: "The account is the token's own" }
  users.*.is_system:   { type: bool, description: "The account has an administrator role" }
  users.*.status:      { type: int, description: "Account status; 1 is enabled" }
  users_count:         { type: int, description: "Number of accounts" }

  roles.*.name:        { type: string, description: "Role name, keyed by role id, such as gen_role_1" }
  roles.*.label:       { type: string, description: "Role display name" }
  roles.*.description: { type: string, description: "Role description" }
  roles.*.is_system:   { type: bool, description: "A fixed system role that cannot be deleted" }
  roles.*.is_self:     { type: bool, description: "The token's account has this role" }
  roles.*.status:      { type: int, description: "Role status; 1 is enabled" }
  roles.*.created_by:  { type: int, description: "Id of the account that created it" }
  roles.*.permissions.*.label:    { type: string, description: "Permission name, keyed by permission id" }
  roles.*.permissions.*.checked:  { type: bool, description: "The role has the permission" }
  roles.*.permissions.*.group:    { type: bool, description: "The permission is a group of others" }
  roles.*.permissions.*.partial:  { type: bool, description: "Some, not all, of the group's permissions are checked" }
  roles.*.permissions.*.name:     { type: string, description: "Permission identifier in English" }
  roles.*.permissions.*.parent:   { type: int, description: "Id of the group the permission is in; 0 at the top" }

  ndi_discovery.*.method:  { type: int, description: "Discovery method of an entry, keyed by entry id: 1 public, 2 manual, 3 group, 4 server" }
  ndi_discovery.*.group:   { type: string, description: "NDI group of the entry" }
  ndi_discovery.*.address: { type: string, description: "Address searched by a manual entry" }
  ndi_discovery.*.server:  { type: string, description: "Discovery server of a server entry" }

  ndi.sources.*.name:    { type: string, description: "Device name of an NDI source found by public discovery, keyed by full NDI name" }
  ndi.sources.*.url:     { type: string, description: "Address and port of the source" }
  ndi.sources.*.ip:      { type: string, description: "IP address of the source" }
  ndi.sources.*.port:    { type: int, description: "NDI port of the source" }
  ndi.sources.*.channel: { type: string, description: "Channel, such as FULL, HB or HX" }
  ndi.sources.*.group:   { type: string, description: "NDI group the source is in" }

telemetry:
  poll:
    # What moves while decoding: window status, bitrate, format, levels.
    - every_ms: 2000
      send:
        - { method: GET, path: /api/output/get, query: { output_id: "1" } }
        - { method: GET, path: /api/output/get, query: { output_id: "2" } }
        - { method: GET, path: /api/output/audio/sound, query: { output_id: "1" } }
        - { method: GET, path: /api/output/audio/sound, query: { output_id: "2" } }
    # Source and gateway output status, the preview, CPU and temperature.
    - every_ms: 5000
      send:
        - { method: GET, path: /api/source/groups/list, content_type: application/json, body: '{"is_need_stream":true}' }
        - { method: GET, path: /api/gate/stream/list }
        - { method: GET, path: /api/preview/get }
        - { method: GET, path: /api/maintenance/usage_get }
    # Configuration.
    - every_ms: 30000
      send:
        - { method: GET, path: /api/info/get }
        - { method: POST, path: /api/users/session/check }
        - { method: POST, path: /api/users/auth_info_get }
        - { method: GET, path: /api/output/list }
        - { method: GET, path: /api/layout/list }
        - { method: GET, path: /api/layout/template/list }
        - { method: GET, path: /api/output/resolution/list }
        - { method: GET, path: /api/output/interfaces/get, query: { output_id: "1", type: video } }
        - { method: GET, path: /api/output/interfaces/get, query: { output_id: "1", type: audio } }
        - { method: GET, path: /api/output/interfaces/get, query: { output_id: "2", type: video } }
        - { method: GET, path: /api/output/interfaces/get, query: { output_id: "2", type: audio } }
        - { method: GET, path: /api/output/audiomix/get, query: { output_id: "1" } }
        - { method: GET, path: /api/output/audiomix/get, query: { output_id: "2" } }
        - { method: GET, path: /api/output/encode/get, query: { output_id: "1" } }
        - { method: GET, path: /api/output/encode/get, query: { output_id: "2" } }
        - { method: GET, path: /api/overlay/list }
        - { method: GET, path: /api/overlay/preview/get, content_type: application/json, body: '{"output_id":1}' }
        - { method: GET, path: /api/overlay/preview/get, content_type: application/json, body: '{"output_id":2}' }
        - { method: GET, path: /api/overlay/images/list }
        - { method: GET, path: /api/overlay/datetime/format/list }
        - { method: GET, path: /api/overlay/font/list }
        - { method: GET, path: /api/gate/stream/multi_out_query }
        - { method: GET, path: /api/sys/preset/get }
        - { method: GET, path: /api/network/get }
        - { method: GET, path: /api/network/http/get }
        - { method: GET, path: /api/network/routing/get }
        - { method: GET, path: /api/timeregion/settings }
        - { method: GET, path: /api/users/list }
        - { method: GET, path: /api/roles/permissions }
        - { method: GET, path: /api/ndi/discovery/all }
        - { method: GET, path: /api/ndi/discovery/sources, query: { dis_method: "1", dis_g_name: "", dis_s_ip: "" } }
  updates:
    # --- Reads (sections 2-15) ---
    - path: "^/api/info/get$"
      json_match: { "$.result": "^ok$" }
      json: { name: "$.data.device_name", fw: "$.data.firmware_version", hw: "$.data.hardware_version",
              sw: "$.data.software_version", serial: "$.data.serial_number" }
      state:
        device.name: "{name}"
        device.firmware_version: "{fw}"
        device.hardware_version: "{hw}"
        device.software_version: "{sw}"
        device.serial_number: "{serial}"
    - path: "^/api/sys/device/get$"
      json_match: { "$.result": "^ok$" }
      json: { name: "$.data.device_name" }
      state: { device.name: "{name}" }
    - path: "^/api/maintenance/usage_get$"
      json_match: { "$.result": "^ok$" }
      json: { cpu: "$.data.cpu_precent", mem: "$.data.mem_precent", temp: "$.data.temperature" }
      state:
        system.cpu_percent: "{cpu}"
        system.memory_percent: "{mem}"
        system.temperature: "{temp}"
    - path: "^/api/sys/preset/get$"
      json_match: { "$.result": "^ok$" }
      json: { mode: "$.data" }
      state: { system.no_signal_mode: { value: "{mode}", map: { "0": no_signal_image, "1": black, "2": none } } }
    - path: "^/api/users/auth_info_(?:get|set)$"
      json_match: { "$.result": "^ok$" }
      json: { en: "$.data.enable", mod: "$.data.canModify" }
      state:
        auth.enabled: "{en}"
        auth.can_modify: "{mod}"
    - path: "^/api/users/session/check$"
      json_match: { "$.result": "^ok$" }
      json: { user: "$.data.username", alias: "$.data.alias" }
      state:
        session.valid: "true"
        session.username: "{user}"
        session.alias: "{alias}"
    - path: "^/api/users/session/check$"
      json_match: { "$.result": "^error$" }
      json: {}
      state: { session.valid: "false" }

    - path: "^/api/output/list$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", name: "$.name", layout: "$.layout_id", modified: "$.modified", res_id: "$.res_id",
              res: "$.res_name", vu: "$.vumeter", bg: "$.background", bg_on: "$.bg_enable",
              b_on: "$.border.enable", b_color: "$.border.color", b_top: "$.border.top_width",
              b_bottom: "$.border.bottom_width", b_left: "$.border.left_width", b_right: "$.border.right_width" }
      state:
        "outputs.{id}.name": "{name}"
        "outputs.{id}.layout": "{layout}"
        "outputs.{id}.layout_modified": "{modified}"
        "outputs.{id}.resolution_id": "{res_id}"
        "outputs.{id}.resolution": "{res}"
        "outputs.{id}.vu_meter": "{vu}"
        "outputs.{id}.background": "{bg}"
        "outputs.{id}.background_enabled": "{bg_on}"
        "outputs.{id}.border.enabled": "{b_on}"
        "outputs.{id}.border.color": "{b_color}"
        "outputs.{id}.border.top_width": "{b_top}"
        "outputs.{id}.border.bottom_width": "{b_bottom}"
        "outputs.{id}.border.left_width": "{b_left}"
        "outputs.{id}.border.right_width": "{b_right}"
    - path: "^/api/output/get\\?output_id=([12])$"
      json_match: { "$.result": "^ok$" }
      json: { name: "$.data.name", layout: "$.data.layout_id", vu: "$.data.vumeter" }
      state:
        "outputs.{1}.name": "{name}"
        "outputs.{1}.layout": "{layout}"
        "outputs.{1}.vu_meter": "{vu}"
    - path: "^/api/output/get\\?output_id=([12])$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data.position"
      json: { id: "$.id", stream: "$.stream_id", sname: "$.stream_name", sip: "$.stream_ip", type: "$.type",
              status: "$.status", en: "$.enable", mute: "$.mute", vol: "$.volume", vu: "$.vu_meter",
              res: "$.resolution", fmt: "$.video_format", kbps: "$.video_bitrate", number: "$.number",
              x: "$.x", y: "$.y", w: "$.width", h: "$.height", z: "$.z_index" }
      replace: "outputs.{1}.windows"
      state:
        "outputs.{1}.windows.{id}.stream_id": "{stream}"
        "outputs.{1}.windows.{id}.stream_name": "{sname}"
        "outputs.{1}.windows.{id}.stream_address": "{sip}"
        "outputs.{1}.windows.{id}.type": "{type}"
        "outputs.{1}.windows.{id}.status": { value: "{status}", map: &stream_status { "0": disconnected, "1": connecting, "2": connected, "3": failed, "4": performance_limited } }
        "outputs.{1}.windows.{id}.enabled": "{en}"
        "outputs.{1}.windows.{id}.muted": "{mute}"
        "outputs.{1}.windows.{id}.volume": "{vol}"
        "outputs.{1}.windows.{id}.vu_meter": "{vu}"
        "outputs.{1}.windows.{id}.resolution": "{res}"
        "outputs.{1}.windows.{id}.video_format": "{fmt}"
        "outputs.{1}.windows.{id}.video_bitrate": "{kbps}"
        "outputs.{1}.windows.{id}.number": "{number}"
        "outputs.{1}.windows.{id}.x": "{x}"
        "outputs.{1}.windows.{id}.y": "{y}"
        "outputs.{1}.windows.{id}.width": "{w}"
        "outputs.{1}.windows.{id}.height": "{h}"
        "outputs.{1}.windows.{id}.z_index": "{z}"
    - path: "^/api/output/interfaces/get\\?output_id=([12])&type=video$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", label: "$.label", mode: "$.mode", cs: "$.colorspace", en: "$.enable", sup: "$.support", vis: "$.visible" }
      replace: "outputs.{1}.video_interfaces"
      state:
        "outputs.{1}.video_interfaces.{id}.label": "{label}"
        "outputs.{1}.video_interfaces.{id}.mode": "{mode}"
        "outputs.{1}.video_interfaces.{id}.colorspace": "{cs}"
        "outputs.{1}.video_interfaces.{id}.enabled": "{en}"
        "outputs.{1}.video_interfaces.{id}.supported": "{sup}"
        "outputs.{1}.video_interfaces.{id}.visible": "{vis}"
    - path: "^/api/output/interfaces/get\\?output_id=([12])&type=audio$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", label: "$.label", en: "$.enable", mute: "$.mute", vol: "$.volume", rate: "$.samplerate", ch: "$.channels", vis: "$.visible" }
      replace: "outputs.{1}.audio_interfaces"
      state:
        "outputs.{1}.audio_interfaces.{id}.label": "{label}"
        "outputs.{1}.audio_interfaces.{id}.enabled": "{en}"
        "outputs.{1}.audio_interfaces.{id}.muted": "{mute}"
        "outputs.{1}.audio_interfaces.{id}.volume": "{vol}"
        "outputs.{1}.audio_interfaces.{id}.sample_rate": "{rate}"
        "outputs.{1}.audio_interfaces.{id}.channels": "{ch}"
        "outputs.{1}.audio_interfaces.{id}.visible": "{vis}"
    - path: "^/api/output/audiomix/get\\?output_id=([12])$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data.output"
      json: { stream: "$.stream_id", name: "$.name", en: "$.enable", mute: "$.mute", vol: "$.volume", pos: "$.pos_id" }
      replace: "outputs.{1}.audio_mix.output"
      state:
        "outputs.{1}.audio_mix.output.{stream:key}.name": "{name}"
        "outputs.{1}.audio_mix.output.{stream:key}.enabled": "{en}"
        "outputs.{1}.audio_mix.output.{stream:key}.muted": "{mute}"
        "outputs.{1}.audio_mix.output.{stream:key}.volume": "{vol}"
        "outputs.{1}.audio_mix.output.{stream:key}.window": "{pos}"
    - path: "^/api/output/audiomix/get\\?output_id=([12])$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data.preview"
      json: { stream: "$.stream_id", name: "$.name", en: "$.enable", mute: "$.mute", vol: "$.volume" }
      replace: "outputs.{1}.audio_mix.preview"
      state:
        "outputs.{1}.audio_mix.preview.{stream:key}.name": "{name}"
        "outputs.{1}.audio_mix.preview.{stream:key}.enabled": "{en}"
        "outputs.{1}.audio_mix.preview.{stream:key}.muted": "{mute}"
        "outputs.{1}.audio_mix.preview.{stream:key}.volume": "{vol}"
    - path: "^/api/output/audio/sound\\?output_id=([12])$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { stream: "$.stream_id" }
      replace: "outputs.{1}.audio_levels"
      state: { "outputs.{1}.audio_levels.{index}.stream_id": "{stream}" }
    - path: "^/api/output/audio/sound\\?output_id=([12])$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data[*].dB"
      json: { db: "$" }
      state: { "outputs.{1}.audio_levels.{^index}.channels.{index:+1}": "{db}" }
    - path: "^/api/output/border/get\\?output_id=([12])$"
      json_match: { "$.result": "^ok$" }
      json: { en: "$.data.enable", color: "$.data.color", top: "$.data.top_width", bottom: "$.data.bottom_width",
              left: "$.data.left_width", right: "$.data.right_width" }
      state:
        "outputs.{1}.border.enabled": "{en}"
        "outputs.{1}.border.color": "{color}"
        "outputs.{1}.border.top_width": "{top}"
        "outputs.{1}.border.bottom_width": "{bottom}"
        "outputs.{1}.border.left_width": "{left}"
        "outputs.{1}.border.right_width": "{right}"
    - path: "^/api/output/background/get\\?output_id=([12])$"
      json_match: { "$.result": "^ok$" }
      json: { bg: "$.data.background", en: "$.data.enable" }
      state:
        "outputs.{1}.background": "{bg}"
        "outputs.{1}.background_enabled": "{en}"
    - path: "^/api/output/encode/get\\?output_id=([12])$"
      json_match: { "$.result": "^ok$" }
      json: { en: "$.data.enable", codec: "$.data.main.codec", profile: "$.data.main.profile", w: "$.data.main.pic_width",
              h: "$.data.main.pic_height", def: "$.data.main.set_resolution_default", grey: "$.data.main.grey",
              fps: "$.data.main.fps", mode: "$.data.main.mode", rate: "$.data.main.bitrate", max: "$.data.main.max_bitrate",
              gop: "$.data.main.gop", dei: "$.data.main.deinterlace_mode", ref: "$.data.main.code_frame",
              mix: "$.data.main.out_mixer_fps", sw: "$.data.sub.pic_width", sh: "$.data.sub.pic_height",
              sfps: "$.data.sub.fps", srate: "$.data.sub.bitrate" }
      state:
        "outputs.{1}.encoder.enabled": "{en}"
        "outputs.{1}.encoder.codec": "{codec}"
        "outputs.{1}.encoder.profile": { value: "{profile}", map: { "0": high, "1": main, "2": baseline } }
        "outputs.{1}.encoder.width": "{w}"
        "outputs.{1}.encoder.height": "{h}"
        "outputs.{1}.encoder.follows_resolution": "{def}"
        "outputs.{1}.encoder.grayscale": "{grey}"
        "outputs.{1}.encoder.fps": "{fps}"
        "outputs.{1}.encoder.mode": "{mode}"
        "outputs.{1}.encoder.bitrate": "{rate}"
        "outputs.{1}.encoder.max_bitrate": "{max}"
        "outputs.{1}.encoder.gop": "{gop}"
        "outputs.{1}.encoder.deinterlace": "{dei}"
        "outputs.{1}.encoder.reference_frames": "{ref}"
        "outputs.{1}.encoder.mixer_fps": "{mix}"
        "outputs.{1}.encoder.sub.width": "{sw}"
        "outputs.{1}.encoder.sub.height": "{sh}"
        "outputs.{1}.encoder.sub.fps": "{sfps}"
        "outputs.{1}.encoder.sub.bitrate": "{srate}"
    - path: "^/api/output/ts/program/get\\?stream_id=([0-9A-Za-z_-]+)$"
      json_match: { "$.result": "^ok$" }
      json: { sel: "$.data.selected_id", name: "$.data.selection[0]", sup: "$.data.supported" }
      replace: "ts_programs.{1:key}.programs"
      state:
        "ts_programs.{1:key}.selected": "{sel}"
        "ts_programs.{1:key}.selected_name": "{name}"
        "ts_programs.{1:key}.supported": "{sup}"
    - path: "^/api/output/ts/program/get\\?stream_id=([0-9A-Za-z_-]+)$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data.tree"
      json: { prog: "$.id", name: "$.name" }
      state: { "ts_programs.{1:key}.programs.{prog:key}.name": "{name}" }
    - path: "^/api/output/ts/program/get\\?stream_id=([0-9A-Za-z_-]+)$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data.tree[*].children"
      json: { prog: "$^.id", id: "$.id", name: "$.name", pid: "$.pid" }
