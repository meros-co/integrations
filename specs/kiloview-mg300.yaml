    summary: "Configure an output's audio interface: on or off, mute, gain, sample rate, channels (POST /api/output/interfaces/set, type audio)"
    params:
      output: *output
      interface: { type: int, min: 1, max: 4, required: true, label: Interface, description: "The audio interface id: 1 HDMI, 2 HDMI1, 3 SDI, 4 line out, as get_output_interfaces gives them." }
