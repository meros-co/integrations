      start_pid: *gw_ts_pid
      pmt_start_pid: *gw_ts_pmt
      tables_version: *gw_ts_ver
    send: { method: POST, path: /api/gate/stream/update, content_type: application/json,
            body: '{"id":{id:json},"protocol":"srt","connection_mode":"{mode}","address":{address:json},"listener_port":{port},"latency":{latency},"encryption":{encryption:json},"passphrase":{passphrase:json},"ts_service_name":{service_name:json},"ts_service_provider":{service_provider:json},"ts_pcr_period":{pcr_period},"ts_start_pid":{start_pid},"ts_pmt_start_pid":{pmt_start_pid},"ts_tables_version":{tables_version}}' }
    expect: *ok
    returns: ack
  update_gateway_hls_stream:
    summary: "Change an HLS output's mode, session and segments (POST /api/gate/stream/update)"
    params:
      id: *gw_id
      mode: *gw_hls_mode
      session: *gw_hls_session
      segment_time: *gw_hls_seg
      max_segments: *gw_hls_max
    send: { method: POST, path: /api/gate/stream/update, content_type: application/json,
            body: '{"id":{id:json},"protocol":"hls","mode":{mode:json},"session":{session:json},"segment_time":{segment_time},"max_segments":{max_segments}}' }
    expect: *ok
    returns: ack
  update_gateway_ndi_hx_stream:
    summary: "Change an NDI HX output's channel name, TTL and multicast settings (POST /api/gate/stream/update)"
    params:
      id: *gw_id
      channel_name: *gw_ndi_ch
      ttl: *gw_ttl
      connection: *gw_ndi_conn
      netmask: *gw_ndi_mask
      netprefix: *gw_ndi_prefix
    send: { method: POST, path: /api/gate/stream/update, content_type: application/json,
            body: '{"id":{id:json},"protocol":"ndi_hx","channel_name":{channel_name:json},"ttl":{ttl},"connection":{connection:json},"netmask":{netmask:json},"netprefix":{netprefix:json}}' }
    expect: *ok
    returns: ack
  rename_gateway_stream:
    summary: "Rename a gateway output (POST /api/gate/stream/update with id and name)"
    params:
      id: *gw_id
      name: *gw_name
    send: { method: POST, path: /api/gate/stream/update, content_type: application/json, body: '{"id":{id:json},"name":{name:json}}' }
    expect: *ok
    returns: ack
  delete_gateway_stream:
    summary: "Delete a gateway output (POST /api/gate/stream/delete)"
    params:
      id: *gw_id
    send: { method: POST, path: /api/gate/stream/delete, content_type: application/json, body: '{"ids":[{"id":{id:json}}]}' }
    expect: *ok
    returns: ack
  delete_gateway_streams:
    summary: "Delete several gateway outputs (POST /api/gate/stream/delete)"
    params:
      ids: { type: json, required: true, label: Outputs, description: "The array of outputs to delete as objects with id: [{\"id\": \"...\"}, ...]." }
    send: { method: POST, path: /api/gate/stream/delete, content_type: application/json, body: '{"ids":{ids}}' }
    expect: *ok
    returns: ack
  bind_gateway_source:
    summary: "Choose the source stream a gateway output sends (POST /api/gate/stream/bind_src)"
    params:
      id: *gw_id
      stream: *stream
    send: { method: POST, path: /api/gate/stream/bind_src, content_type: application/json, body: '{"id":{id:json},"stream_id":{stream:json}}' }
    expect: *ok
    returns: ack
  set_gateway_stream_enabled:
    summary: "Start or stop a gateway output (POST /api/gate/stream/batch_enable)"
    params:
      id: *gw_id
      enabled: { type: bool, required: true, label: Enabled, description: "Whether the output streams." }
    send: { method: POST, path: /api/gate/stream/batch_enable, content_type: application/json, body: '{"ids":[{"id":{id:json}}],"enable":{enabled}}' }
    expect: *ok
    returns: ack
  set_gateway_streams_enabled:
    summary: "Start or stop several gateway outputs (POST /api/gate/stream/batch_enable)"
    params:
      ids: { type: json, required: true, label: Outputs, description: "The array of outputs as objects with id: [{\"id\": \"...\"}, ...]." }
      enabled: { type: bool, required: true, label: Enabled, description: "Whether the outputs stream." }
    send: { method: POST, path: /api/gate/stream/batch_enable, content_type: application/json, body: '{"ids":{ids},"enable":{enabled}}' }
    expect: *ok
    returns: ack
  get_encoded_preview_output:
    summary: "Which output's encoding the encoded preview shows, and whether the switch skips its confirmation (GET /api/gate/stream/multi_out_query)"
    send: { method: GET, path: /api/gate/stream/multi_out_query }
    expect: *val
    returns: value
  set_encoded_preview_output:
    summary: "Switch the encoded preview to output 1 or 2 (POST /api/gate/stream/multi_out_enable)"
    params:
      output: *output
      skip_confirm: { type: bool, default: false, label: Skip confirmation, description: "Whether the web interface skips its confirmation when switching." }
    send: { method: POST, path: /api/gate/stream/multi_out_enable, content_type: application/json, body: '{"enable":{output},"skip_switch_confirm":{skip_confirm}}' }
    expect: *ok
    returns: ack

  # --- Network (section 9) ---
  get_network:
    summary: "Network ports with address, DHCP, gateway, DNS, MAC, link and the maintenance address (GET /api/network/get)"
    send: { method: GET, path: /api/network/get }
    expect: *val
    returns: value
  set_network:
    summary: "Set a network port's address, DHCP, gateway and DNS (POST /api/network/set)"
    params:
      interface: &interface { type: string, required: true, pattern: "^[A-Za-z0-9_.-]{1,16}$", label: Network port, description: "The port's name, as get_network gives it: eth0 or eth1." }
      dhcp: { type: bool, required: true, label: DHCP, description: "On takes the address from DHCP; off uses the address given." }
      ip: &ipv4 { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: IP address, description: "An IPv4 address, such as 192.168.36.6." }
      mask: &mask { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Subnet mask, description: "The subnet mask, such as 255.255.255.0." }
      gateway: { type: string, default: "", pattern: "^([0-9]{1,3}(\\.[0-9]{1,3}){3})?$", label: Gateway, description: "The gateway address, or empty for none." }
      dns: { type: string, default: "", max_length: 255, label: DNS, description: "The DNS server address, or empty." }
      mac: { type: string, required: true, pattern: "^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$", label: MAC address, description: "The port's MAC address, as get_network gives it." }
    send: { method: POST, path: /api/network/set, content_type: application/json,
            body: '{"device":"{interface}","dynamic":"{dhcp:map.dhcp}","ip":"{ip}","mask":"{mask}","gw":"{gateway}","dns":{dns:json},"mac":"{mac}"}' }
    expect: *ok
    returns: ack
  set_maintenance_address:
    summary: "Turn a network port's second (maintenance) address on or off and set it (POST /api/network/modify)"
    params:
      interface: *interface
      enabled: { type: bool, required: true, label: Maintenance address, description: "Whether the port also answers on the maintenance address." }
      ip: *ipv4
      mask: *mask
      gateway: { type: string, default: "", pattern: "^([0-9]{1,3}(\\.[0-9]{1,3}){3})?$", label: Gateway, description: "The maintenance address's gateway, or empty for none." }
    send: { method: POST, path: /api/network/modify, content_type: application/json,
            body: '{"device":"{interface}","enable2":{enabled},"ip2":"{ip}","mask2":"{mask}","gw2":"{gateway}"}' }
    expect: *ok
    returns: ack
  get_http_ports:
    summary: "Whether HTTP and HTTPS are on, and their ports (GET /api/network/http/get)"
    send: { method: GET, path: /api/network/http/get }
    expect: *val
    returns: value
  set_http_ports:
    summary: "Turn HTTP and HTTPS on or off and set their ports (POST /api/network/http/set)"
    params:
      http: { type: bool, required: true, label: HTTP, description: "Whether the web server answers HTTP." }
      http_port: { type: int, min: 1, max: 65535, default: 80, label: HTTP port, description: "The HTTP port, 80 by default; a port the gateway reserves is refused (405)." }
      https: { type: bool, required: true, label: HTTPS, description: "Whether the web server answers HTTPS." }
      https_port: { type: int, min: 1, max: 65535, default: 443, label: HTTPS port, description: "The HTTPS port, 443 by default; a port the gateway reserves is refused (405)." }
    send: { method: POST, path: /api/network/http/set, content_type: application/json,
            body: '{"http":{http},"httpPort":{http_port},"https":{https},"httpsPort":{https_port}}' }
    expect: *ok
    returns: ack
  ping:
    summary: "Ping an address from the gateway; returns its loss rate, and fails with 400 when it does not answer (POST /api/network/ping)"
    params:
      address: { type: string, required: true, max_length: 255, label: Address, description: "The address to ping." }
    send: { method: POST, path: /api/network/ping, content_type: application/json, body: '{"ip":{address:json}}' }
    expect: *val
    returns: value
  list_routes:
    summary: "Static routes (GET /api/network/routing/get)"
    send: { method: GET, path: /api/network/routing/get }
    expect: *val
    returns: value
  add_route:
    summary: "Add a static route (POST /api/network/routing/add)"
    params:
      interface: *interface
      ip: &route_dest { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Destination, description: "The route's destination address." }
      netmask: *mask
      gateway: &route_gw { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Gateway, description: "The gateway the route goes through." }
      mtu: &route_mtu { type: int, min: 1, default: 1500, label: MTU, description: "The route's MTU in bytes." }
      metric: &route_metric { type: int, min: 0, default: 0, label: Metric, description: "The route's metric; lower is preferred." }
    send: { method: POST, path: /api/network/routing/add, content_type: application/json,
            body: '{"device":"{interface}","ip":"{ip}","netmask":"{netmask}","gw":"{gateway}","mtu":{mtu},"metric":{metric}}' }
    expect: *ok
    returns: ack
  modify_route:
    summary: "Change a static route (POST /api/network/routing/modify)"
    params:
      id: &route_id { type: string, required: true, max_length: 64, label: Route, description: "The route's id, as list_routes gives it." }
      interface: *interface
      ip: *route_dest
      netmask: *mask
      gateway: *route_gw
      mtu: *route_mtu
      metric: *route_metric
    send: { method: POST, path: /api/network/routing/modify, content_type: application/json,
            body: '{"id":{id:json},"device":"{interface}","ip":"{ip}","netmask":"{netmask}","gw":"{gateway}","mtu":{mtu},"metric":{metric}}' }
    expect: *ok
    returns: ack
  set_route_enabled:
    summary: "Turn a static route on or off (POST /api/network/routing/set)"
    params:
      id: *route_id
      enabled: { type: bool, required: true, label: Enabled, description: "Whether the route is used." }
    send: { method: POST, path: /api/network/routing/set, content_type: application/json, body: '{"id":{id:json},"status":{enabled:bool01}}' }
    expect: *ok
    returns: ack
  delete_route:
    summary: "Delete a static route (POST /api/network/routing/del)"
    params:
      id: *route_id
    send: { method: POST, path: /api/network/routing/del, content_type: application/json, body: '{"ids":{id:json}}' }
    expect: *ok
    returns: ack

  # --- Time (section 10) ---
  get_time_settings:
    summary: "Time, time zone, offset, time source and NTP servers (GET /api/timeregion/settings)"
    send: { method: GET, path: /api/timeregion/settings }
    expect: *val
    returns: value
  set_time:
    summary: "Set the time source and time: NTP servers, the controlling computer's time, or a manual time (POST /api/timeregion/time/set)"
    params:
      mode: { type: enum, values: [ntp, pc, manual], required: true, label: Time source, description: "ntp follows the NTP servers; pc and manual take the time given." }
      time: { type: string, required: true, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$", label: Time, description: "The time as YYYY-MM-DD HH:MM:SS." }
      offset: &tz_offset { type: int, min: -12, max: 14, required: true, label: UTC offset, description: "The time zone's offset from UTC in hours, such as 8." }
      ntp_servers: { type: string, default: "", max_length: 512, label: NTP servers, description: "NTP server names separated by spaces; empty unless the source is ntp." }
    send: { method: POST, path: /api/timeregion/time/set, content_type: application/json,
            body: '{"time":"{time}","timetype":"{mode}","offset":{offset},"ntp_servers":{ntp_servers:json}}' }
    expect: *ok
    returns: ack
  set_timezone:
    summary: "Set the time zone (POST /api/timeregion/timezone/set)"
    params:
      timezone: { type: string, required: true, max_length: 64, label: Time zone, description: "The time zone name, such as Europe/London." }
      offset: *tz_offset
    send: { method: POST, path: /api/timeregion/timezone/set, content_type: application/json, body: '{"timezone":{timezone:json},"offset":{offset}}' }
    expect: *ok
    returns: ack

  # --- System (sections 11-13) ---
  reboot:
    summary: "Restart the gateway; outputs and gateway streams stop until it is back (GET /api/sys/reboot)"
    send: { method: GET, path: /api/sys/reboot }
    expect: *ok
    returns: ack
  reset:
    summary: "System reset (GET /api/sys/reset)"
    send: { method: GET, path: /api/sys/reset }
    expect: *ok
    returns: ack
  restore_factory:
    summary: "Restore factory settings (GET /api/sys/restore)"
    send: { method: GET, path: /api/sys/restore }
    expect: *ok
    returns: ack
  get_device_name:
    summary: "The device name (GET /api/sys/device/get)"
    send: { method: GET, path: /api/sys/device/get }
    expect: { status: 200, json_equals: { "$.result": "ok" }, json_path: "$.data.device_name" }
    returns: value
  set_device_name:
    summary: "Set the device name (POST /api/sys/device/set)"
    params:
      name: { type: string, required: true, max_length: 64, label: Device name, description: "The name the gateway shows and announces." }
    send: { method: POST, path: /api/sys/device/set, content_type: application/json, body: '{"device_name":{name:json}}' }
    expect: *ok
    returns: ack
  parse_url:
    summary: "The address, port and path of a stream URL, as the gateway reads it (GET /api/sys/ip/get)"
    params:
      url: { type: string, required: true, max_length: 1024, label: URL, description: "A stream URL such as ndi://10.20.30.21:5961." }
    send: { method: GET, path: /api/sys/ip/get, query: { url: "{url}" } }
    expect: *val
    returns: value
  replace_url_address:
    summary: "A stream URL with its address and port replaced (POST /api/sys/ip/replace)"
    params:
      url: { type: string, required: true, max_length: 1024, label: URL, description: "The stream URL to rewrite, such as srt://192.168.1.1:13?streamid=a." }
      address: { type: string, required: true, max_length: 255, label: Address, description: "The address to put in the URL." }
      port: { type: string, required: true, pattern: "^[0-9]{1,5}$", label: Port, description: "The port to put in the URL, as digits." }
    send: { method: POST, path: /api/sys/ip/replace, content_type: application/json,
            body: '{"url":{url:json},"target_ip":{address:json},"target_port":{port:json}}' }
    expect: { status: 200, json_equals: { "$.result": "ok" }, json_path: "$.data.url" }
    returns: value
  import_config:
    summary: "Upload a source configuration zip (kv_source.json inside) and replace the source groups and streams with it (POST /api/sys/config/import, multipart field upload)"
    params:
      file: { type: binary, required: true, label: Configuration file, description: "A zip file the gateway's configuration export made." }
      filename: { type: string, default: config.zip, max_length: 255, label: File name, description: "The file name sent with the upload." }
    send:
      method: POST
      path: /api/sys/config/import
      multipart:
        - { name: upload, binary: file, filename: "{filename}", content_type: application/octet-stream }
    expect: *ok
    returns: ack
  export_config:
    summary: "Save the source configuration (source groups and streams), a zip holding kv_source.json, to a host file (GET /api/sys/config/export, modules source)"
    params:
      name: { type: string, default: source_config, max_length: 128, label: Name, description: "The zip's name." }
      to: { type: save, required: true, label: Save to, description: "The host file the download is written to; replaced once the whole file has arrived." }
    send: { method: GET, path: /api/sys/config/export, content_type: application/json,
            body: '{"modules":["source"],"name":{name:json}}', save: to }
    expect: { status: 200 }
    returns: file
  import_config_from_path:
    summary: "Import a source configuration zip already on the gateway, under /tmp or /var/tmp (POST /api/sys/config/import with path)"
    params:
      path: { type: string, required: true, pattern: "^/(var/)?tmp/.+\\.zip$", label: Path, description: "The zip file's absolute path on the gateway, under /tmp or /var/tmp." }
    send: { method: POST, path: /api/sys/config/import, content_type: application/json, body: '{"path":{path:json}}' }
    expect: *ok
    returns: ack
  get_usage:
    summary: "CPU and memory use in percent and the CPU temperature (GET /api/maintenance/usage_get)"
    send: { method: GET, path: /api/maintenance/usage_get }
    expect: *val
    returns: value
  get_no_signal_mode:
    summary: "What the outputs show for a source with no signal: 0 the no-signal picture, 1 black, 2 nothing done (GET /api/sys/preset/get)"
    send: { method: GET, path: /api/sys/preset/get }
    expect: *val
    returns: value
  set_no_signal_mode:
    summary: "Set what the outputs show for any source with no signal (POST /api/sys/preset/set)"
    params:
      mode: { type: enum, values: [no_signal_image, black, none], required: true, label: No-signal picture, description: "no_signal_image shows the preset placeholder picture, black a black frame, none does nothing." }
    send: { method: POST, path: /api/sys/preset/set, content_type: application/json, body: '{"preset":{mode:map.no_signal}}' }
    expect: *ok
    returns: ack
  upgrade_firmware:
    summary: "Upload a firmware file and upgrade; the gateway restarts (POST /api/firmware/upgrade, multipart field upload)"
    params:
      file: { type: binary, required: true, label: Firmware file, description: "The firmware image for the MG300 V2." }
      filename: { type: string, default: firmware.bin, max_length: 255, label: File name, description: "The file name sent with the upload." }
    send:
      method: POST
      path: /api/firmware/upgrade
      multipart:
        - { name: upload, binary: file, filename: "{filename}", content_type: application/octet-stream }
    expect: *ok
    returns: ack

  # --- Preview (section 14) ---
  get_preview:
    summary: "Sources in the preview, each with its status and resolution (GET /api/preview/get)"
    send: { method: GET, path: /api/preview/get }
    expect: *val
    returns: value
  add_preview_source:
    summary: "Add a source stream to the preview (POST /api/preview/source/modify)"
    params:
      output: *output
      stream: *stream
      stream_name: { type: string, required: true, max_length: 256, label: Stream name, description: "The stream's name, as list_source_groups gives it." }
      stream_url: { type: string, required: true, max_length: 1024, label: Stream URL, description: "The stream's URL, as list_source_groups gives it." }
    send: { method: POST, path: /api/preview/source/modify, content_type: application/json,
            body: '{"from":{"type":"source","stream_id":{stream:json},"stream_name":{stream_name:json},"stream_url":{stream_url:json},"pos_id":"","output_id":"{output}","layout_id":""},"to":{"type":"preview","stream_id":{stream:json},"stream_name":{stream_name:json},"stream_url":{stream_url:json},"output_id":"{output}","layout_id":""}}' }
    expect: *ok
    returns: ack
  remove_preview_source:
    summary: "Remove a source from the preview (POST /api/preview/source/remove)"
    params:
      position: { type: int, min: 1, required: true, label: Preview position, description: "The preview position id, as get_preview gives it." }
    send: { method: POST, path: /api/preview/source/remove, content_type: application/json, body: '{"pos_id":{position}}' }
    expect: *ok
    returns: ack

  # --- NDI discovery (section 15) ---
  get_ndi_discovery:
    summary: "NDI discovery entries: manual addresses, and automatic, group and server discovery, each with its id (GET /api/ndi/discovery/all)"
    send: { method: GET, path: /api/ndi/discovery/all }
    expect: *val
    returns: value
  list_ndi_sources:
    summary: "NDI sources found by one discovery method (GET /api/ndi/discovery/sources)"
    params:
      method: &ndi_method { type: enum, values: [public, manual, group, server], default: public, label: Discovery, description: "public automatic discovery, manual addresses, automatic discovery in a group, or a discovery server." }
      group: &ndi_group_name { type: string, default: "", max_length: 128, label: NDI group, description: "The group name; needed for group and server." }
      server: &ndi_server_ip { type: string, default: "", max_length: 255, label: Discovery server, description: "The discovery server's address; needed for server." }
    send: { method: GET, path: /api/ndi/discovery/sources,
            query: { dis_method: "{method:map.ndi_discovery_method}", dis_g_name: "{group}", dis_s_ip: "{server}" } }
    expect: *val
    returns: value
  list_ndi_sources_in_group:
    summary: "NDI sources found by one discovery method, narrowed to a group id (GET /api/ndi/discovery/sources with group_id)"
    params:
      method: *ndi_method
      group: *ndi_group_name
      server: *ndi_server_ip
      group_id: { type: string, required: true, max_length: 64, label: Group id, description: "The group id the list is narrowed to." }
    send: { method: GET, path: /api/ndi/discovery/sources,
            query: { dis_method: "{method:map.ndi_discovery_method}", dis_g_name: "{group}", dis_s_ip: "{server}", group_id: "{group_id}" } }
    expect: *val
    returns: value
  set_ndi_manual_discovery:
    summary: "Replace the manual NDI discovery list (POST /api/ndi/discovery/manual/add): the entries given are all that remain"
    params:
      entries: { type: json, required: true, label: Entries, description: "The manuals array: objects with dis_d_ip (an address to search) and dis_g_name (its NDI group)." }
    send: { method: POST, path: /api/ndi/discovery/manual/add, content_type: application/json, body: '{"manuals":{entries}}' }
    expect: *ok
    returns: ack
  add_ndi_group_discovery:
    summary: "Add automatic NDI discovery in a group (POST /api/ndi/discovery/auto/add)"
    params:
      group: { type: string, required: true, max_length: 128, label: NDI group, description: "The NDI group to discover in." }
    send: { method: POST, path: /api/ndi/discovery/auto/add, content_type: application/json, body: '{"dis_g_name":{group:json}}' }
    expect: *ok
    returns: ack
  remove_ndi_auto_discovery:
    summary: "Remove an automatic discovery entry by id (POST /api/ndi/discovery/auto/del)"
    params:
      id: &ndi_entry { type: string, required: true, max_length: 64, label: Entry, description: "The entry's id, as get_ndi_discovery gives it." }
    send: { method: POST, path: /api/ndi/discovery/auto/del, content_type: application/json, body: '{"id":{id:json}}' }
    expect: *ok
    returns: ack
  add_ndi_discovery_server:
    summary: "Add an NDI discovery server for a group (POST /api/ndi/discovery/server/add)"
    params:
      group: { type: string, default: public, max_length: 128, label: NDI group, description: "The NDI group." }
      server: { type: string, required: true, max_length: 255, label: Discovery server, description: "The discovery server's address." }
    send: { method: POST, path: /api/ndi/discovery/server/add, content_type: application/json, body: '{"dis_g_name":{group:json},"dis_s_ip":{server:json}}' }
    expect: *ok
    returns: ack
  remove_ndi_discovery_server:
    summary: "Remove an NDI discovery server entry by id (POST /api/ndi/discovery/server/del)"
    params:
      id: *ndi_entry
    send: { method: POST, path: /api/ndi/discovery/server/del, content_type: application/json, body: '{"id":{id:json}}' }
    expect: *ok
    returns: ack

