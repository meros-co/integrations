            body: '{"name":{name:json},"protocol":"rtmp","is_enable":{enabled},"address":{address:json},"user":{user:json},"password":{password:json},"conn_intv":{reconnect_interval},"conn_timeout":{connect_timeout},"old_rtmp":{old_rtmp}}' }
    expect: *ok
    returns: ack
