              status: "$.status", by: "$.created_by" }
      replace: roles
      state:
        "roles.{id}.name": "{name}"
        "roles.{id}.label": "{label}"
        "roles.{id}.description": "{desc}"
        "roles.{id}.is_system": "{sys}"
        "roles.{id}.is_self": "{self}"
        "roles.{id}.status": "{status}"
        "roles.{id}.created_by": "{by}"
    # The permission tree, four levels deep in the document's example; each
    # node is keyed by its id under its role, with its parent's id.
    - path: "^/api/roles/permissions$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data[*].permissions"
      json: { role: "$^.id", id: "$.id", label: "$.label", ck: "$.checked", grp: "$.is_group", part: "$.multiple_selected", tn: "$.translate_name" }
      state:
        "roles.{role}.permissions.{id}.label": "{label}"
        "roles.{role}.permissions.{id}.checked": "{ck}"
        "roles.{role}.permissions.{id}.group": "{grp}"
        "roles.{role}.permissions.{id}.partial": "{part}"
        "roles.{role}.permissions.{id}.name": "{tn}"
        "roles.{role}.permissions.{id}.parent": "0"
    - path: "^/api/roles/permissions$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data[*].permissions[*].children"
      json: { role: "$^^.id", parent: "$^.id", id: "$.id", label: "$.label", ck: "$.checked", grp: "$.is_group", part: "$.multiple_selected", tn: "$.translate_name" }
      state: &perm_state
        "roles.{role}.permissions.{id}.label": "{label}"
        "roles.{role}.permissions.{id}.checked": "{ck}"
        "roles.{role}.permissions.{id}.group": "{grp}"
        "roles.{role}.permissions.{id}.partial": "{part}"
        "roles.{role}.permissions.{id}.name": "{tn}"
        "roles.{role}.permissions.{id}.parent": "{parent}"
    - path: "^/api/roles/permissions$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data[*].permissions[*].children[*].children"
      json: { role: "$^^^.id", parent: "$^.id", id: "$.id", label: "$.label", ck: "$.checked", grp: "$.is_group", part: "$.multiple_selected", tn: "$.translate_name" }
      state: *perm_state
    - path: "^/api/roles/permissions$"
      json_match: { "$.result": "^ok$" }
