      user: &gw_user { type: string, default: "", max_length: 128, label: User, description: "The account the server asks for, or empty." }
      password: &gw_password { type: string, secret: true, default: "", max_length: 128, label: Password, description: "That account's password, or empty." }
      reconnect_interval: &gw_conn_intv { type: int, min: 1, default: 3, label: Reconnect interval, description: "Seconds between reconnection attempts." }
      connect_timeout: &gw_conn_timeout { type: int, min: 1, default: 10, label: Connection timeout, description: "The connection timeout in seconds." }
      old_rtmp: &gw_old_rtmp { type: bool, default: false, label: Legacy RTMP, description: "Whether to use the older RTMP version for servers that need it." }
