    expect: *val
    returns: value
  set_encoder:
    summary: "Set an output's main-stream encoding; every field is sent, so one not given takes its default here, not its current value (POST /api/output/encode/set)"
    params:
      output: *output
      codec: { type: enum, values: [H264, H265], default: H264, label: Codec, description: "H.264 or H.265." }
      grayscale: { type: bool, default: false, label: Grayscale, description: "On encodes in grayscale, off in color." }
      profile: { type: enum, values: [high, main, baseline], default: high, label: Profile, description: "The encoding profile." }
      width: { type: int, min: 1, default: 1, label: Width, description: "The encoded width in pixels, or 1 to follow the output resolution." }
      height: { type: int, min: 1, default: 1, label: Height, description: "The encoded height in pixels, or 1 to follow the output resolution." }
      mode: { type: enum, values: [CBR, VBR], default: VBR, label: Bitrate mode, description: "Constant or variable bitrate." }
      gop: { type: int, min: 1, default: 60, label: GOP, description: "Frames between key frames; the document lists 1, 30, 60, 90, 120, 150 and 180." }
      fps: { type: string, default: auto, pattern: "^(auto|half|[0-9]+(\\.[0-9]+)?)$", label: Frame rate, description: "auto, half, or a fixed frame rate such as 30." }
      bitrate: { type: int, min: 32, max: 50000, default: 6000, label: Bitrate, description: "The bitrate in kbit/s, 32 to 50000." }
      max_bitrate: { type: int, min: 32, default: 20000, label: Maximum bitrate, description: "The highest bitrate in kbit/s, used in VBR." }
      reference_frames: { type: int, min: 0, default: 0, label: Reference frames, description: "0 for a single reference frame, more for several." }
      deinterlace: { type: enum, values: [default, line_doubling], default: default, label: Deinterlacing, description: "default weaves the fields, line_doubling doubles lines per field." }
