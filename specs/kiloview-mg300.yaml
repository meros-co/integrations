      start_pid: &gw_ts_pid { type: int, min: 32, max: 3840, required: true, label: Start PID, description: "The first elementary stream PID, 32 to 3840." }
      pmt_start_pid: &gw_ts_pmt { type: int, min: 16, max: 7936, required: true, label: PMT start PID, description: "The first PMT PID, 16 to 7936." }
      tables_version: &gw_ts_ver { type: int, min: 0, max: 31, required: true, label: Tables version, description: "The MPEG-TS tables version, 0 to 31." }
    send: { method: POST, path: /api/gate/stream/add, content_type: application/json,
            body: '{"name":{name:json},"protocol":"rtp","is_enable":{enabled},"address":{address:json},"port":{port},"load_type":{load_type},"ttl":{ttl},"ts_service_name":{service_name:json},"ts_service_provider":{service_provider:json},"ts_pcr_period":{pcr_period},"ts_transport_stream_id":{transport_stream_id},"ts_start_pid":{start_pid},"ts_pmt_start_pid":{pmt_start_pid},"ts_tables_version":{tables_version}}' }
