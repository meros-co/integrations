quirks:
  - models: [all]
    severity: warning
    text: >
      Authentication (section 1.1): the login (POST /api/users/login with
      username and password, admin / admin until changed) answers a session
      token in its JSON body (data.token), and every other request but
      info/get must carry the header app holding the JSON object
      {"token": "..."}. The format's session can send a captured token back
      only as a header's whole value, not inside a JSON object, so the token
      is a setting: the consumer runs login, puts the token it returns into
      the token setting with update_settings, and the core then sends the
      header on every request. The token ends at logout, and may expire
      after a restart or a long idle time (the document gives no lifetime);
      a refused token is answered with HTTP 200 and {"result": "error",
      "msg": "2"}, which the format cannot take for a refusal of the
      credential, so commands fail with the device's error and the consumer
      logs in again then. session.valid, read every 30 s by
      /users/session/check, says whether the token still works.
      set_auth_enabled off makes the gateway accept requests without a
      token.
  - models: [all]
    severity: info
    text: >
      Every reply is {"result": "ok"} with its data, or {"result": "error",
      "msg": "<code>"} with HTTP 200 (section 1). Codes (section 1.3): 0
      success, 1 parameter error, 2 invalid token, 100 output not found, 101
      video source not found, 102 audio source not found, 103 output
      interface not found, 104 layout template not found, 105 layout not
      found, 106 preview position error, 107 layout out of range, 200 group
      not found, 201 stream not found, 202 stream does not exist, 203
      duplicate NDI server, 204 duplicate stream, 205 unsupported protocol,
      206 group name exists, 207 NDI buffer over the limit, 300 user not
      found, 301 password mismatch, 302 wrong user name or password, 400
      address unreachable, 401 network change failed, 402 duplicate route,
      403 route not found, 404 route does not exist, 405 port in use, 500
      duplicate name, 501 in use, 502 configuration save failed, 503 time or
      time zone setting failed, 504 invalid video output, 505 the mixer
      takes four audio sources at most, 506 target exists, 507 file does
      not exist, 508 PTZ failed (or not supported), 509 device performance
      insufficient, 510 performance back to normal, 511 too many previews,
      608 gateway port in use, 609 gateway stream not found, 610 gateway
      output has no source, 611 at most 4 outputs per source, 612 at most 36
      outputs, 613 at most 9 sources, 614 duplicate NDI HX channel name, 615
      duplicate HLS session, 616 multiview preview binding failed, 617
      invalid multiview encoding, 800 pull connection failed, 801 pull
      authentication failed, 802 stream information failed, 803 no audio or
      video track, 804 resolution not supported, 805 too many connection
      attempts, 1000 video decoding failed, -1000 10-bit H.264, H.265 or HX
      not supported; 2000 to 2051 are missing permissions of the token's
      role (2002 permission denied, 2003 cannot delete oneself, 2004 preset
      roles cannot change, 2005 at most 32 users). A failed command reports
      the device's error; the code is in the reply only.
  - models: [all]
    severity: critical
    text: >
      restore_factory (GET /api/sys/restore) returns the gateway to factory
      settings, removing sources, layouts, gateway outputs, users and network
      settings, and cannot be undone. reset (GET /api/sys/reset, "system
      reset") is not described further by the document and should be
      treated the same way. upgrade_firmware flashes the uploaded image and
      restarts the gateway; outputs and gateway streams stop meanwhile, and a
      wrong image may not be recoverable live. import_config and
      import_config_from_path replace the source groups and streams with
      the file's. remove_source_group deletes every stream in the group;
      remove_user, remove_overlay, delete_gateway_stream(s) and remove_layout
      cannot be undone either.
  - models: [all]
    severity: warning
    text: >
      reboot stops both outputs and every gateway output until the gateway
      is back. set_network, set_maintenance_address and set_http_ports can
      move the gateway off the address and port the core reaches it on; the
      core then loses it until it is opened at the new address. A port the
      gateway reserves (99, 100, 102, 6665, 6666, RTMP, websocket) is
      refused with 405.
  - models: [all]
    severity: info
    text: >
      API limits: the document warns that calling the API beyond what the
      hardware can take may delay its answers or crash it, so state is
      polled sparingly (the gateway pushes nothing): window status, bitrate,
      format and audio levels every 2 s; source and gateway output status,
      the preview and CPU, memory and temperature every 5 s; configuration
      every 30 s, which also reads each overlay template's items. A write's
      ok reply re-reads what it changed at once. The server does not check
      the HTTP method (GET and POST both reach every request); requests use
      the method the document gives.
  - models: [all]
    severity: info
    text: >
      Two outputs, 1 and 2, each on any of the HDMI1, HDMI2 and SDI video
      interfaces (get_output_interfaces). The document types output_id as a
      string in some requests and a number in others; each request sends it
      as that request's example does. Some reads take their parameter in a
      JSON body of a GET request (source/groups/list, users/info,
      overlay/editing/get, overlay/preview/get), as the document says;
      export of the configuration (GET /api/sys/config/export, export_config)
      answers a zip file, saved to a host file.
  - models: [all]
    severity: info
    text: >
      Speed-type PTZ commands (ptz_zoom_speed, ptz_pan_tilt_speed,
      ptz_focus_speed) keep the camera moving: send the same command again
      with speed 0 to stop it. Position commands need no reset. PTZ works
      only for an NDI source in the window (section 7.13); ptz_is_supported
      succeeds when it does and fails with 508 when it does not.
  - models: [all]
    severity: info
    text: >
      Readings the document leaves open, sent as its examples do:
      select_overlay's example sends output_id 0 although outputs are 1 and
      2, and set_window_mute's sends pos_id 0 although windows number from 1
      elsewhere; both commands accept 0. set_overlay_items's mode is the
      example's z_index, which the table describes as changing only the
      stacking order; another value for a full replacement is not
      documented. add_preview_source sends no to.pos_id, as the example,
      though the table names it among the fields the gateway uses.
      set_video_interface sends enable, output_id, type video and intf_id
      only, the fields the table marks required for video (no example).
      The gateway output adds send no stream_id: bind_gateway_source sets
      the source afterwards, as the document's RTMP example implies.
      set_encoder's deinterlace takes default or line_doubling, as the
      write table says, while the read gives weave for the default.
  - models: [all]
    severity: info
    text: >
      Not readable or not writable through the API: an output's encoding
      on/off (encoder.enabled) is read only; the NDI HX discovery server
      and group of a gateway output are read only (update_gateway_stream
      may try them in its body); the Zixi transport fields (UDP output
      port, latency, provider, backup URL, FEC) are written only when the
      stream is added and are not read back, and modify_zixi_stream cannot
      change the Zixi stream id, whose field name is the stream_id that
      names the stream to change. Passwords, passphrases and stream tokens
      are written but not kept in state, nor are the tokens users/list
      gives for other accounts or the password get_user returns. The fonts
      list is read, but no item field to choose a font is documented. The
      overlay editor's own permission check (POST /api/auth/check) is
      internal to its process, its body undocumented, and is not offered.
  - models: [all]
    severity: info
    text: >
      State kept apart from the lists that would remove it: an overlay
      template's items (overlay_items) are replaced by each items read and
      removed with remove_overlay; an MPEG-TS stream's programs
      (ts_programs) are read by get_ts_programs and after set_ts_program
      only, and removed with remove_stream (a stream removed with its group
      keeps its entry until the core is opened again). The role permission
      tree's ids are the document's example ids, which repeat 31 to 33
      under two groups; a later node of the same id overwrites an earlier
      one in roles.*.permissions.
  - models: [all]
    severity: info
    text: >
      Uploads (overlay image, configuration, firmware) are multipart form
      data with the file in the field the document names (img_url, upload,
      upload); the file names sent are not documented. The firmware upload
      sends no size field, which the document marks optional. A whole file
      must arrive within the transport's 5-second request timeout.
