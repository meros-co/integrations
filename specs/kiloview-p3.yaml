telemetry:
  poll:
    - every_ms: 2000
      send:
        - { method: GET, path: /api/networkmanager/network/getNetworkSpeed }
        - { method: GET, path: /api/record/v1/get_recording_status }
        - { method: GET, path: /api/streamer/v1/stream/list }
        - { method: GET, path: /api/kilolink/bonding/stream_state }
        - { method: GET, path: /api/kilolink/bonding/state }
        - { method: GET, path: /api/kilolink/bonding/server_stream_state }
    - every_ms: 5000
      send:
        - *sysinfo
        - { method: GET, path: /api/networkmanager/modem/get }
        - { method: GET, path: /api/codec/v1/vin/detail }
        - { method: GET, path: /api/codec/v1/venc/settings }
        - { method: GET, path: /api/networkmanager/wifi/getCurrentWifi }
        - { method: GET, path: /api/networkmanager/network/traffic_data }
        - { method: GET, path: /api/networkmanager/hotspot/get }
    - every_ms: 15000
      send:
        - { method: GET, path: /api/record/record/disk_list }
        - { method: GET, path: /api/networkmanager/network/GetLinkinfo }
        - { method: GET, path: /api/networkmanager/network/GetLinkList }
        - { method: GET, path: /api/networkmanager/network/current_networks }
        - { method: GET, path: /api/networkmanager/network/list_network }
        - { method: GET, path: /api/networkmanager/modem/imei_info }
        - { method: GET, path: /api/systemctrl/system/getNetworkSpeed }
        - { method: GET, path: /api/streamer/ptz/info }
        - { method: GET, path: /api/kilolink/bonding/server }
        - { method: GET, path: /api/codec/v1/audio/input }
    - every_ms: 30000
      send:
        - { method: GET, path: /api/systemctrl/system/getHostname }
        - { method: GET, path: /api/systemctrl/user/auth_info }
        - { method: GET, path: /api/systemctrl/user/list }
        - { method: GET, path: /api/systemctrl/systime/get }
        - { method: GET, path: /api/systemctrl/systime/ntpstatus }
        - { method: GET, path: /api/systemctrl/system/getProtocol }
        - { method: GET, path: /api/systemctrl/system/ssl }
        - { method: GET, path: /api/ststemctrl/system/production_stat }
        - { method: GET, path: /api/record/record/get_record_info }
        - { method: GET, path: /api/streamer/v1/stream/media_user }
        - { method: GET, path: /api/streamer/ptz/protocol }
        - { method: GET, path: /api/streamer/ptz/serial_device }
        - { method: GET, path: /api/networkmanager/static/routing/get }
        - { method: GET, path: /api/networkmanager/wifi/get }
        - { method: GET, path: /api/networkmanager/hotspot/getWIFIParameter }
        - { method: GET, path: /api/kilolink/bonding/server_conf }
        - { method: GET, path: /api/codec/vin/edid }
        - { method: GET, path: /api/codec/v1/vin/list_source }
        - { method: GET, path: /api/codec/v1/audio/encode/list }
        - { method: GET, path: /api/codec/vpss/image }
        - { method: GET, path: /api/codec/vpss/static_frame }
        - { method: GET, path: /api/codec/v1/vpss/input/rmf }
        - { method: GET, path: /api/codec/v1/vpss/osd }
        - { method: GET, path: /api/codec/panel/settings }

  updates:
    # ── system ──
    - path: "^/api/systemctrl/system/getHostname$"
      json_match: { "$.result": "^ok$" }
      json: { name: "$.data.hostname" }
      state: { device.hostname: "{name}" }
    - path: "^/api/systemctrl/system/getSystemInfo\\?"
      json_match: { "$.result": "^ok$" }
      json: { product: "$.data.version.product", oem: "$.data.version.oem", serial: "$.data.version.serialNumber",
              fw: "$.data.version.softwareVersion", hw: "$.data.version.hardwareVersion", ndi: "$.data.version.ndiVersion",
              mem_total: "$.data.mem.total", mem_used: "$.data.mem.used", disk_total: "$.data.disk.total",
