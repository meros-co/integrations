spec: 1
id: luminex-gigacore
name: Luminex GigaCore Gen2 switches (web API)
vendor: Luminex
category: other
source:
  - title: "GigaCore Gen2 API documentation (GigaCore WebApi 1.5.0, doc_v192.html for firmware v1.9.2, and the websocket API 1.5.0, doc_ws_v192.html)"
    author: Luminex Network Intelligence
    url: "https://support.luminex.be/portal/en/kb/articles/gigacore-api-documentation"
    note: >
      The OpenAPI 3.0.2 reference of the second-generation GigaCore's HTTP API (also served by each switch at
      /api/doc), with HTTP Basic authentication: GET /api returns every value the switch has, each object and value
      of the tree has its own GET and, where it can be changed, PUT, lists add items with POST and remove them with
      DELETE, and write-only actions (reboot, reset, identify, profile save and recall, counter resets...) take a
      PUT. Sections: device, LED, features, status message, config and profiles, system, IP settings, duplicate IP,
      SNMP, LLDP, MAC tables, SFP, tunnels, layer 3, MAAP, ports (breakout, speed groups, LAGs, counters), security
      and HTTPS, PoE, IGMP and MLD snooping, spanning tree, VLANs, AVDECC, AVB, port mirroring, gPTP, PTP, RLinkX,
      groups, trunks, interface, EULA, extension board, power, temperatures, fans, display, e-ink, Milan and DHCP
      server. The websocket API (/api/ws): subscribe to a path with {"subscription": {path, action: add, method:
      full}} and receive {"api_notification": {path, notification_type, new_value}} when it changes. The article
      names the Gen2 models (GigaCore 26i, 16Xt, 16RFO, 14R, 12, 10) and says the API does not work for the first
      generation.
  - title: "Default credentials of GigaCore switches"
    author: Luminex Network Intelligence
    url: "https://support.luminex.be/portal/en/kb/articles/gigacore-api-documentation"
    note: "Login admin with no password, on both generations, until changed."

transport:
  type: http
  port: 80
  scheme: { setting: scheme }
  https_port: 443
  # The switch serves a self-signed certificate unless one is uploaded.
  accept_invalid_certs: true
  auth: basic
  timeout_ms: 5000
  probe: { method: GET, path: /api/device/api_version }

settings:
  username: { type: string, default: admin, max_length: 64, label: User name,
              description: "The switch's web login, admin by default." }
  password: { type: string, secret: true, default: "", max_length: 64, label: Password,
              description: "That login's password, empty by default." }
  scheme: { type: enum, values: [http, https], default: http, label: Connection,
            description: "http, or https where the switch's web server is set to it." }

ports:
  - { port: 80, protocol: http, role: control, when: "scheme http", note: "the switch's web server" }
  - { port: 443, protocol: https, role: control, when: "scheme https", note: "the switch's web server over TLS" }
  - { port: 80, protocol: ws, role: push, when: "scheme http", note: "the websocket API, /api/ws" }
  - { port: 443, protocol: wss, role: push, when: "scheme https", note: "the websocket API over TLS, /api/ws" }

