commands:
  get_all:
    summary: Read api (GET /api)
    send: { method: GET, path: /api }
    expect: { status: [200], json_path: $ }
    returns: value
  set_all:
    summary: Set api (PUT /api)
    params:
      body: { type: json, required: true, label: Body, description: "The settings to change, an object with any of device, led, features, status_message, config, system, ip_settings, duplicate_ip, snmp, lldp, mac, sfp, tunnels, layer3, maap, ports, security, poe, snooping, spanning_tree, vlans, avdecc, avb, port_mirror, gptp, ptp, rlinkx, groups, trunks, interface, eula, extension_board, power, temperatures, fans, display, milan, dhcp_server, eink as the GigaCore API reference defines them." }
    send: { method: PUT, path: /api, body: "{body}", content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack
  reboot:
    summary: Trigger a reboot (PUT /api/reboot)
    params:
      wait: { type: int, min: -2147483648, max: 2147483647, label: Wait, description: Wait before reboot., required: true }
    send: { method: PUT, path: /api/reboot, body: "{\"wait\":{wait}}", content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack
  reset:
    summary: Trigger reset to defaults (PUT /api/reset)
    params:
      keep_ip: { type: bool, default: true, label: Keep ip, description: Prevent IP config reset. }
      keep_profiles: { type: bool, default: true, label: Keep profiles, description: Prevent resetting of profiles to factory defaults. }
      keep_tracing: { type: bool, default: false, label: Keep tracing, description: Keep tracing settings or not. }
      keep_config: { type: json, label: Keep config, description: "Keep certain subsections of the configuration, such as \"groups\", \"device\", \"ports\", .", required: true }
      auto_reboot: { type: bool, default: true, label: Auto reboot, description: Automatically reboot the switch. }
      wait: { type: int, min: -2147483648, max: 2147483647, default: 0, label: Wait, description: Wait before rebooting the switch. }
    send: { method: PUT, path: /api/reset, body: "{\"keep_ip\":{keep_ip},\"keep_profiles\":{keep_profiles},\"keep_tracing\":{keep_tracing},\"keep_config\":{keep_config},\"auto_reboot\":{auto_reboot},\"wait\":{wait}}", content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack
  upload_firmware:
    summary: Upload new firmware; the switch then restarts into it unless auto_reboot is false (PUT /api/firmware)
    params:
      file: { type: binary, required: true, label: Firmware file, description: The firmware image file Luminex publishes for the switch. }
      auto_reboot: { type: bool, default: true, label: Reboot after upload, description: True restarts into the new firmware once it is uploaded; false keeps the running one until a reboot. }
    send: { method: PUT, path: /api/firmware, body: { binary: file }, content_type: application/octet-stream, query: { auto_reboot: "{auto_reboot}" } }
    expect: { status: [200, 204] }
    returns: ack
  get_device:
    summary: Read The device information (GET /api/device)
    send: { method: GET, path: /api/device }
    expect: { status: [200], json_path: $ }
    returns: value
  set_device:
    summary: Set The device information (PUT /api/device)
    params:
      body: { type: json, required: true, label: Body, description: "The settings to change, an object with any of name, hostname, description, system_id, model, mac_address, serial, firmware, api_version, actual_ip as the GigaCore API reference defines them." }
    send: { method: PUT, path: /api/device, body: "{body}", content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack
  set_device_name:
    summary: Set System name (PUT /api/device/name)
    params:
      value: { type: string, max_length: 64, pattern: "^[a-zA-Z0-9\\-_ ]*$", label: Value, description: System name., required: true }
    send: { method: PUT, path: /api/device/name, body: "{value:json}", content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack
  set_device_hostname:
    summary: Set Hostname of the device (PUT /api/device/hostname)
    params:
      value: { type: string, max_length: 255, required: true, label: Value, description: Hostname of the device. }
    send: { method: PUT, path: /api/device/hostname, body: "{value:json}", content_type: application/json }
    expect: { status: [200, 204] }
