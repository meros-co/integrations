quirks:
  - models: [all]
    severity: critical
    text: >
      reboot, reset (back to factory settings, keeping what its flags say), config_profiles_recall (load a profile
      as the running configuration), device_firmware_activate_alternate, upload_firmware and set_all restart the
      switch or replace its configuration, cutting every link through it; changing a port's group, VLANs, enabled
      state or speed, a group or trunk, PoE or the IP settings changes traffic at once, and a wrong IP setting can
      make the switch unreachable.
  - models: [all]
    severity: info
    text: >
      Commands are the reference's operations, named after their paths: set_* writes one value or object with PUT,
      add_* creates a list item with POST, delete_* removes one, get_* reads a section, the whole tree (get_all) or
      one item, and the write-only actions (reboot, identify, port_identify, groups_move, profile save and recall,
      counter resets) are named after their paths too. Values and bodies are the reference's JSON; the switch checks
      them and answers an error otherwise.
  - models: [all]
    severity: info
    text: >
      State is the tree GET /api returns, section by section, with each list keyed by its item's number or id
      (ports by port_number, groups by group_id, VLANs by vid...) and lists of plain values (a port's allowed VLANs)
      as JSON text. The websocket API pushes each section (but the MAC tables) whole whenever it changes, applied
      as a read of that section; every section is also read every minute, the MAC tables only then. A profile's
      stored content is kept as JSON text.
