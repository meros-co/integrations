telemetry:
  # The mixer pushes its parameters by itself; the lists are read.
  poll:
    send: ["3:::SHOWLIST", "3:::MEDIA_GET_PLISTS"]
    every_ms: 60000
  updates:
    # Every parameter by path, from each line of each message.
    - match: "^3:::"
      match_each: '(?m)^SETD\^([^\^\r\n]+)\^([^\r\n]*)'
      state: { "values.{1:key}": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETS\^([^\^\r\n]+)\^([^\r\n]*)'
      state: { "texts.{1:key}": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETS\^(model|firmware)\^([^\r\n]*)'
      state: { "device.{1}": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETS\^i\.(\d+)\.name\^([^\r\n]*)'
      state: { "inputs.{1:+1}.name": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^i\.(\d+)\.mix\^([^\r\n]*)'
      state: { "inputs.{1:+1}.fader": "{2}", "inputs.{1:+1}.fader_db": "{2:from.ui_fader}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^i\.(\d+)\.(mute|solo)\^([^\r\n]*)'
      state: { "inputs.{1:+1}.{2}": { value: "{3}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^i\.(\d+)\.pan\^([^\r\n]*)'
      state: { "inputs.{1:+1}.pan": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETS\^l\.(\d+)\.name\^([^\r\n]*)'
      state: { "lines.{1:+1}.name": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^l\.(\d+)\.mix\^([^\r\n]*)'
      state: { "lines.{1:+1}.fader": "{2}", "lines.{1:+1}.fader_db": "{2:from.ui_fader}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^l\.(\d+)\.(mute|solo)\^([^\r\n]*)'
      state: { "lines.{1:+1}.{2}": { value: "{3}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^l\.(\d+)\.pan\^([^\r\n]*)'
      state: { "lines.{1:+1}.pan": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETS\^p\.(\d+)\.name\^([^\r\n]*)'
      state: { "players.{1:+1}.name": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^p\.(\d+)\.mix\^([^\r\n]*)'
      state: { "players.{1:+1}.fader": "{2}", "players.{1:+1}.fader_db": "{2:from.ui_fader}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^p\.(\d+)\.(mute|solo)\^([^\r\n]*)'
      state: { "players.{1:+1}.{2}": { value: "{3}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^p\.(\d+)\.pan\^([^\r\n]*)'
      state: { "players.{1:+1}.pan": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETS\^f\.(\d+)\.name\^([^\r\n]*)'
      state: { "fx_returns.{1:+1}.name": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^f\.(\d+)\.mix\^([^\r\n]*)'
      state: { "fx_returns.{1:+1}.fader": "{2}", "fx_returns.{1:+1}.fader_db": "{2:from.ui_fader}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^f\.(\d+)\.(mute|solo)\^([^\r\n]*)'
      state: { "fx_returns.{1:+1}.{2}": { value: "{3}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^f\.(\d+)\.pan\^([^\r\n]*)'
      state: { "fx_returns.{1:+1}.pan": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETS\^s\.(\d+)\.name\^([^\r\n]*)'
      state: { "subgroups.{1:+1}.name": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^s\.(\d+)\.mix\^([^\r\n]*)'
      state: { "subgroups.{1:+1}.fader": "{2}", "subgroups.{1:+1}.fader_db": "{2:from.ui_fader}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^s\.(\d+)\.(mute|solo)\^([^\r\n]*)'
      state: { "subgroups.{1:+1}.{2}": { value: "{3}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^s\.(\d+)\.pan\^([^\r\n]*)'
      state: { "subgroups.{1:+1}.pan": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETS\^a\.(\d+)\.name\^([^\r\n]*)'
      state: { "auxes.{1:+1}.name": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^a\.(\d+)\.mix\^([^\r\n]*)'
      state: { "auxes.{1:+1}.fader": "{2}", "auxes.{1:+1}.fader_db": "{2:from.ui_fader}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^a\.(\d+)\.(mute|solo)\^([^\r\n]*)'
      state: { "auxes.{1:+1}.{2}": { value: "{3}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^a\.(\d+)\.pan\^([^\r\n]*)'
      state: { "auxes.{1:+1}.pan": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETS\^v\.(\d+)\.name\^([^\r\n]*)'
      state: { "vcas.{1:+1}.name": "{2}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^v\.(\d+)\.mix\^([^\r\n]*)'
      state: { "vcas.{1:+1}.fader": "{2}", "vcas.{1:+1}.fader_db": "{2:from.ui_fader}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^v\.(\d+)\.(mute|solo)\^([^\r\n]*)'
      state: { "vcas.{1:+1}.{2}": { value: "{3}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^m\.mix\^([^\r\n]*)'
      state: { master.fader: "{1}", master.fader_db: "{1:from.ui_fader}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^m\.pan\^([^\r\n]*)'
      state: { master.pan: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^m\.dim\^([^\r\n]*)'
      state: { master.dim: { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^m\.delayL\^([^\r\n]*)'
      state: { master.delay_left_ms: "{1:from.delay_ms}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^m\.delayR\^([^\r\n]*)'
      state: { master.delay_right_ms: "{1:from.delay_ms}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^mgmask\^(\d+)\r?$'
      state:
        mute_groups.mask: "{1}"
        mute_groups.1.muted: "{1:bit.0}"
        mute_groups.2.muted: "{1:bit.1}"
        mute_groups.3.muted: "{1:bit.2}"
        mute_groups.4.muted: "{1:bit.3}"
        mute_groups.5.muted: "{1:bit.4}"
        mute_groups.6.muted: "{1:bit.5}"
        mute_groups.fx: "{1:bit.22}"
        mute_groups.all: "{1:bit.23}"
    - match: "^3:::"
      match_each: '(?m)^SETD\^automix\.(a|b)\.on\^([^\r\n]*)'
      state: { "automix.{1}.enabled": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^automix\.time\^([^\r\n]*)'
      state: { automix.response_time: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^var\.currentState\^([^\r\n]*)'
      state: { player.state: { value: "{1}", map: { "0": stopped, "2": playing, "3": paused } } }
    - match: "^3:::"
      match_each: '(?m)^SETS\^var\.currentPlaylist\^([^\r\n]*)'
      state: { player.playlist: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^SETS\^var\.currentTrack\^([^\r\n]*)'
      state: { player.track: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^var\.currentLength\^([^\r\n]*)'
      state: { player.length_s: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^var\.currentTrackPos\^([^\r\n]*)'
      state: { player.position: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^settings\.shuffle\^([^\r\n]*)'
      state: { player.shuffle: { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^settings\.playMode\^([^\r\n]*)'
      state: { player.mode: { value: "{1}", map: { "0": manual, "3": auto } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^var\.isRecording\^([^\r\n]*)'
      state: { recorder.recording: { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^var\.recBusy\^([^\r\n]*)'
      state: { recorder.busy: { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^var\.mtk\.currentState\^([^\r\n]*)'
      state: { multitrack.state: { value: "{1}", map: { "0": stopped, "1": paused, "2": playing } } }
    - match: "^3:::"
      match_each: '(?m)^SETS\^var\.mtk\.session\^([^\r\n]*)'
      state: { multitrack.session: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^var\.mtk\.currentLength\^([^\r\n]*)'
      state: { multitrack.length_s: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^var\.mtk\.currentTrackPos\^([^\r\n]*)'
      state: { multitrack.position: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^var\.mtk\.rec\.currentState\^([^\r\n]*)'
      state: { multitrack.recording: { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^var\.mtk\.rec\.busy\^([^\r\n]*)'
      state: { multitrack.busy: { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETD\^var\.mtk\.rec\.time\^([^\r\n]*)'
      state: { multitrack.record_time_s: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^SETD\^var\.mtk\.soundcheck\^([^\r\n]*)'
      state: { multitrack.soundcheck: { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^3:::"
      match_each: '(?m)^SETS\^var\.currentShow\^([^\r\n]*)'
      state: { shows.current: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^SETS\^var\.currentSnapshot\^([^\r\n]*)'
      state: { shows.current_snapshot: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^SETS\^var\.currentCue\^([^\r\n]*)'
      state: { shows.current_cue: "{1}" }
    - match: "^3:::"
      match_each: '(?m)^BMSG\^SYNC\^([^\^\r\n]+)\^(\d+)'
      state: { "sync.{1:key}.selected_channel": "{2}" }
    # The lists, each replacing what was there, and what each item holds.
    - match: "^3:::SHOWLIST(?:\\^|\\r?$)"
      match_each: '([^\^\r\n]+)'
      replace: shows.names
      state: { "shows.names.{index}": "{1}" }
      then_send: ["3:::SNAPSHOTLIST^{1}", "3:::CUELIST^{1}"]
    - match: "^3:::SNAPSHOTLIST\\^([^\\^\\r\\n]+)"
      match_each: '\^([^\^\r\n]+)'
      replace: "shows.snapshots.{1:key}"
      state: { "shows.snapshots.{1:key}.{index}": "{2}" }
    - match: "^3:::CUELIST\\^([^\\^\\r\\n]+)"
      match_each: '\^([^\^\r\n]+)'
      replace: "shows.cues.{1:key}"
      state: { "shows.cues.{1:key}.{index}": "{2}" }
    - match: "^3:::PLISTS(?:\\^|\\r?$)"
      match_each: '([^\^\r\n]+)'
      replace: playlists.names
      state: { "playlists.names.{index}": "{1}" }
      then_send: ["3:::MEDIA_GET_PLIST_TRACKS^{1}"]
    - match: "^3:::PLIST_TRACKS\\^([^\\^\\r\\n]+)"
      match_each: '\^([^\^\r\n]+)'
      replace: "playlists.tracks.{1:key}"
      state: { "playlists.tracks.{1:key}.{index}": "{2}" }
