commands:
  pb_level:
    summary: "Set the fader level of playback 1-10, in percent (/pb/<playback>, int 0-100)"
    params:
      playback: { type: int, min: 1, max: 10, required: true }
      level:    { type: int, min: 0, max: 100, required: true }
    send: { address: "/pb/{playback}", args: [ { value: "{level}", type: int } ] }
    returns: none

  pb_go:
    summary: "Go on playback 1-10 (/pb/<playback>/go, sent without the optional argument)"
    params:
      playback: { type: int, min: 1, max: 10, required: true }
    send: { address: "/pb/{playback}/go" }
    returns: none

  pb_flash:
    summary: "Flash playback 1-10: enabled true sets its level to 100%, false to 0% (/pb/<playback>/flash, int 1 or 0)"
    params:
      playback: { type: int, min: 1, max: 10, required: true }
      enabled:  { type: bool, default: true }
    send: { address: "/pb/{playback}/flash", args: [ { value: "{enabled:bool01}", type: int } ] }
    returns: none

  pb_pause:
    summary: "Pause playback 1-10 (/pb/<playback>/pause, sent without the optional argument)"
    params:
      playback: { type: int, min: 1, max: 10, required: true }
    send: { address: "/pb/{playback}/pause" }
    returns: none

  pb_release:
    summary: "Release playback 1-10 (/pb/<playback>/release, sent without the optional argument)"
    params:
      playback: { type: int, min: 1, max: 10, required: true }
    send: { address: "/pb/{playback}/release" }
    returns: none

  pb_jump_cue:
    summary: "Jump to a cue on playback 1-10 (/pb/<playback>/<cue>; the cue is a number with an optional decimal, e.g. 2.5)"
    params:
      playback: { type: int, min: 1, max: 10, required: true }
      cue:      { type: string, pattern: '^[0-9]{1,5}(\.[0-9]{1,2})?$', required: true }
    send: { address: "/pb/{playback}/{cue}" }
    returns: none

  set_blackout:
    summary: "Desk blackout (/dbo). The manual's table reads \"0 turns on, non-zero turns off\": blackout true sends int 0, false sends int 1 (see quirks)"
    params:
      blackout: { type: bool, required: true }
    send: { address: "/dbo", args: [ { value: "{blackout:bool10}", type: int } ] }
    returns: none

  set_swap_mode:
    summary: "Set the playback flash button mode: swap true sends int 1 (swap), false sends int 0 (add) (/swap)"
    params:
      swap: { type: bool, required: true }
    send: { address: "/swap", args: [ { value: "{swap:bool01}", type: int } ] }
    returns: none

  exec_activate_page:
    summary: "Activate a button or fader in an Execute Window grid (/exec/<page>/<item>, no argument). page: grid number 1-10 or grid name; item: box number, grid reference such as 4x3, or item name"
    params:
      page: { type: string, pattern: '^[A-Za-z0-9_+.-]{1,32}$', required: true }
      item: { type: string, pattern: '^[A-Za-z0-9_+.-]{1,32}$', required: true }
    send: { address: "/exec/{page}/{item}" }
    returns: none

  exec_set_page:
    summary: "Activate (true, int 1) or release (false, int 0) an Execute Window button or fader; on an encoder 1 raises and 0 lowers (/exec/<page>/<item>)"
    params:
      page:   { type: string, pattern: '^[A-Za-z0-9_+.-]{1,32}$', required: true }
      item:   { type: string, pattern: '^[A-Za-z0-9_+.-]{1,32}$', required: true }
      active: { type: bool, required: true }
    send: { address: "/exec/{page}/{item}", args: [ { value: "{active:bool01}", type: int } ] }
    returns: none

  exec_level_page:
    summary: "Set an Execute Window fader level as a fraction 0.0-1.0 (/exec/<page>/<item>, float)"
    params:
      page:  { type: string, pattern: '^[A-Za-z0-9_+.-]{1,32}$', required: true }
      item:  { type: string, pattern: '^[A-Za-z0-9_+.-]{1,32}$', required: true }
      level: { type: float, min: 0, max: 1, required: true }
    send: { address: "/exec/{page}/{item}", args: [ { value: "{level}", type: float } ] }
    returns: none

  exec_activate:
    summary: "Activate a button or fader in the current Execute Window grid (/exec/<item>, no argument). item: box number, grid reference such as 4x3, or item name"
    params:
      item: { type: string, pattern: '^[A-Za-z0-9_+.-]{1,32}$', required: true }
    send: { address: "/exec/{item}" }
    returns: none

  exec_set:
    summary: "Activate (true, int 1) or release (false, int 0) a button or fader in the current Execute Window grid; on an encoder 1 raises and 0 lowers (/exec/<item>)"
    params:
      item:   { type: string, pattern: '^[A-Za-z0-9_+.-]{1,32}$', required: true }
      active: { type: bool, required: true }
    send: { address: "/exec/{item}", args: [ { value: "{active:bool01}", type: int } ] }
    returns: none

  exec_level:
    summary: "Set a fader level in the current Execute Window grid as a fraction 0.0-1.0 (/exec/<item>, float)"
    params:
      item:  { type: string, pattern: '^[A-Za-z0-9_+.-]{1,32}$', required: true }
      level: { type: float, min: 0, max: 1, required: true }
    send: { address: "/exec/{item}", args: [ { value: "{level}", type: float } ] }
    returns: none

  tenscene_activate_zone:
    summary: "Activate 10Scene button 1-10 in a zone (/10Scene/<item>/<zone>, no argument)"
    params:
      item: { type: int, min: 1, max: 10, required: true }
      zone: { type: int, min: 1, max: 100, required: true }
    send: { address: "/10Scene/{item}/{zone}" }
    returns: none

  tenscene_set_zone:
    summary: "Activate (true, int 1) or release (false, int 0) 10Scene button 1-10 in a zone (/10Scene/<item>/<zone>)"
    params:
      item:   { type: int, min: 1, max: 10, required: true }
      zone:   { type: int, min: 1, max: 100, required: true }
      active: { type: bool, required: true }
    send: { address: "/10Scene/{item}/{zone}", args: [ { value: "{active:bool01}", type: int } ] }
    returns: none

  tenscene_toggle_zone:
    summary: "Toggle 10Scene button 1-10 in a zone (/10Scene/<item>/<zone>/toggle)"
    params:
      item: { type: int, min: 1, max: 10, required: true }
      zone: { type: int, min: 1, max: 100, required: true }
    send: { address: "/10Scene/{item}/{zone}/toggle" }
    returns: none

  tenscene_activate:
    summary: "Activate 10Scene button 1-10 without a zone (/10Scene/<item>, no argument)"
    params:
      item: { type: int, min: 1, max: 10, required: true }
    send: { address: "/10Scene/{item}" }
    returns: none

  tenscene_set:
    summary: "Activate (true, int 1) or release (false, int 0) 10Scene button 1-10 without a zone (/10Scene/<item>)"
    params:
      item:   { type: int, min: 1, max: 10, required: true }
      active: { type: bool, required: true }
    send: { address: "/10Scene/{item}", args: [ { value: "{active:bool01}", type: int } ] }
    returns: none

  tenscene_toggle:
    summary: "Toggle 10Scene button 1-10 without a zone (/10Scene/<item>/toggle)"
    params:
      item: { type: int, min: 1, max: 10, required: true }
    send: { address: "/10Scene/{item}/toggle" }
    returns: none

  quickq_tenscene_activate_zone:
    summary: "QuickQ: activate 10Scene button 1-10 in zone 1-10 (/10scene/<item>/<zone>, no argument)"
    params:
      item: { type: int, min: 1, max: 10, required: true }
      zone: { type: int, min: 1, max: 10, required: true }
    send: { address: "/10scene/{item}/{zone}" }
    returns: none

  quickq_tenscene_set_zone:
    summary: "QuickQ: activate (true, int 1) or release (false, int 0) 10Scene button 1-10 in zone 1-10 (/10scene/<item>/<zone>)"
    params:
      item:   { type: int, min: 1, max: 10, required: true }
      zone:   { type: int, min: 1, max: 10, required: true }
      active: { type: bool, required: true }
    send: { address: "/10scene/{item}/{zone}", args: [ { value: "{active:bool01}", type: int } ] }
    returns: none

  quickq_tenscene_activate:
    summary: "QuickQ: activate 10Scene button 1-10 (/10scene/<item>, no argument)"
    params:
      item: { type: int, min: 1, max: 10, required: true }
    send: { address: "/10scene/{item}" }
    returns: none

  quickq_tenscene_set:
    summary: "QuickQ: activate (true, int 1) or release (false, int 0) 10Scene button 1-10 (/10scene/<item>)"
    params:
      item:   { type: int, min: 1, max: 10, required: true }
      active: { type: bool, required: true }
    send: { address: "/10scene/{item}", args: [ { value: "{active:bool01}", type: int } ] }
    returns: none

  feedback_off:
    summary: "Turn OSC feedback off (/feedback/off)"
    send: { address: "/feedback/off" }
    returns: none

  feedback_playbacks:
    summary: "Turn playback feedback on and transmit the state of the playbacks (/feedback/pb)"
    send: { address: "/feedback/pb" }
    returns: none

  feedback_executes:
    summary: "Turn execute feedback on and transmit the state of the Execute Window items (/feedback/exec)"
    send: { address: "/feedback/exec" }
    returns: none

  feedback_all:
    summary: "Turn playback and execute feedback on and transmit the state of both (/feedback/pb+exec)"
    send: { address: "/feedback/pb+exec" }
    returns: none

  rpc:
    summary: "Send ChamSys Remote Protocol commands as text (/rpc, string), e.g. \"1A2A1S2G3,4I\": comma-separated values each ended by a letter A-Z"
    params:
      commands: { type: string, pattern: '^[0-9A-Za-z, ]{1,256}$', required: true }
    send: { address: "/rpc", args: [ { value: "{commands}", type: string } ] }
    returns: none

  rpc_activate:
    summary: "Remote protocol: Activate playback (/rpc \"<playback>A\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: { address: "/rpc", args: [ { value: "{playback}A", type: string } ] }
    returns: none

  rpc_release:
    summary: "Remote protocol: Release playback (/rpc \"<playback>R\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: { address: "/rpc", args: [ { value: "{playback}R", type: string } ] }
    returns: none

  rpc_test:
    summary: "Remote protocol: Test playback (activate with level 100%) (/rpc \"<playback>T\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: { address: "/rpc", args: [ { value: "{playback}T", type: string } ] }
    returns: none

  rpc_untest:
    summary: "Remote protocol: Un-test playback (release with level 0%) (/rpc \"<playback>U\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: { address: "/rpc", args: [ { value: "{playback}U", type: string } ] }
    returns: none

  rpc_go:
    summary: "Remote protocol: Go on playback (/rpc \"<playback>G\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: { address: "/rpc", args: [ { value: "{playback}G", type: string } ] }
    returns: none

  rpc_stop:
    summary: "Remote protocol: Stop (go back) on playback (/rpc \"<playback>S\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: { address: "/rpc", args: [ { value: "{playback}S", type: string } ] }
    returns: none

  rpc_fast_back:
    summary: "Remote protocol: Fast back on playback (no fade) (/rpc \"<playback>B\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: { address: "/rpc", args: [ { value: "{playback}B", type: string } ] }
    returns: none

  rpc_fast_forward:
    summary: "Remote protocol: Fast forward on playback (no fade) (/rpc \"<playback>F\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: { address: "/rpc", args: [ { value: "{playback}F", type: string } ] }
    returns: none

  rpc_level:
    summary: "Remote protocol: set playback fader level in percent (/rpc \"<playback>,<level>L\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
      level:    { type: int, min: 0, max: 100, required: true }
    send: { address: "/rpc", args: [ { value: "{playback},{level}L", type: string } ] }
    returns: none

  rpc_jump_cue:
    summary: "Remote protocol: jump to cue id <cue>.<cue_dec> on a playback (cue 2.5 is cue 2, cue_dec 50) (/rpc \"<playback>,<cue>,<cue_dec>J\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
      cue:      { type: int, min: 1, max: 65536, required: true }
      cue_dec:  { type: int, min: 0, max: 99, default: 0 }
    send: { address: "/rpc", args: [ { value: "{playback},{cue},{cue_dec}J", type: string } ] }
    returns: none

  rpc_page:
    summary: "Remote protocol: change playback page (/rpc \"<page>P\")"
    params:
      page: { type: int, min: 0, max: 100, required: true }
    send: { address: "/rpc", args: [ { value: "{page}P", type: string } ] }
    returns: none

  rpc_channel_intensity:
    summary: "Remote protocol: set a DMX intensity channel to a level in percent (/rpc \"<channel>,<level>I\")"
    params:
      channel: { type: int, min: 1, max: 32769, required: true }
      level:   { type: int, min: 0, max: 100, required: true }
    send: { address: "/rpc", args: [ { value: "{channel},{level}I", type: string } ] }
    returns: none

  rpc_tenscene_button:
    summary: "Remote protocol: 10Scene zone 1 button 1-10 (/rpc \"<button>X\")"
    params:
      button: { type: int, min: 1, max: 10, required: true }
    send: { address: "/rpc", args: [ { value: "{button}X", type: string } ] }
    returns: none

  rpc_tenscene_button_state:
    summary: "Remote protocol: 10Scene zone 1 button press or release; state 1 pressed, 2 activate, 3 release, 4 toggle, 7 cycle, 9 increase, 10 decrease (/rpc \"<button>,<state>X\")"
    params:
      button: { type: int, min: 1, max: 10, required: true }
      state:  { type: enum, values: ["1", "2", "3", "4", "7", "9", "10"], required: true }
    send: { address: "/rpc", args: [ { value: "{button},{state}X", type: string } ] }
    returns: none

  rpc_tenscene_zone_button_state:
    summary: "Remote protocol: 10Scene button press or release in zone 1-20; state 1 pressed, 2 activate, 3 release, 4 toggle, 7 cycle, 9 increase, 10 decrease (/rpc \"<zone>,<button>,<state>X\")"
    params:
      zone:   { type: int, min: 1, max: 20, required: true }
      button: { type: int, min: 1, max: 10, required: true }
      state:  { type: enum, values: ["1", "2", "3", "4", "7", "9", "10"], required: true }
    send: { address: "/rpc", args: [ { value: "{zone},{button},{state}X", type: string } ] }
    returns: none

  rpc_select_head:
    summary: "Remote programming 01: select a head (/rpc \"01,<head>H\")"
    params:
      head: { type: int, min: 1, max: 6145, required: true }
    send: { address: "/rpc", args: [ { value: "01,{head}H", type: string } ] }
    returns: none

  rpc_select_head_range:
    summary: "Remote programming 01: select a range of heads (/rpc \"01,<start>,<end>H\")"
    params:
      start: { type: int, min: 1, max: 6145, required: true }
