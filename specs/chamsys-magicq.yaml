spec: 1
id: chamsys-magicq
name: ChamSys MagicQ / QuickQ
vendor: ChamSys
category: lighting

source:
  - title: MagicQ Manual 1.9.9.x, Open Sound Control (OSC)
    author: ChamSys Ltd
    url: https://docs.chamsys.co.uk/magicq/1.9.9.x/manual/OSC.html
    note: >
      MagicQ Manual 1.9.9.x, "Latest Update, 2026-09-23" (PDF
      https://docs.chamsys.co.uk/magicq/1.9.9.x/_exports/magicq-1.9.9.x.pdf, pp. 533-538; the
      newest manual on docs.chamsys.co.uk, retrieved 2026-10-01). OSC "is supported on MagicQ
      consoles (except MQ40 and MQ40N) and PCs when fully unlocked"; Setup, View Settings, Network
      sets the mode and transmit/receive ports ("A good default is 9000 transmit and 8000
      receive"), port 0 disables, transmit IP 0.0.0.0 broadcasts. Table 1, OSC Addresses:
      /pb/<playback> (float 0.0-1.0 or int 0-100, set fader level), /pb/<playback>/go, /flash (0
      sets 0%, non-zero 100%), /pause, /release (each with an optional non-zero value),
      /pb/<playback>/<cue> (jump to cue), /dbo ("0 turns on, non-zero turns off"), /swap (0 add,
      non-zero swap), /exec/<page>/<item> and /exec/<item> (no argument activate, 0 release or
      lower encoder, 1 activate or raise encoder, float 0.0-1.0 or int 0-100 fader level),
      /10Scene/<item>/<zone> and /10Scene/<item> (none or 1 activate, 0 release) and their
      /toggle forms, /rpc (string with remote Ethernet commands) and /rpc/<commands>, /midi (MIDI
      bytes), /feedback/off, /feedback/pb, /feedback/exec, /feedback/pb+exec ("Turns feedback on
      and transmits state of playbacks and executes"). <playback> 1-10; <cue> a number with
      optional decimal; <page> 1-10 or a grid name; <item> a box number, grid reference (4x3) or
      item name. Examples "testosc /pb/1/go" and "testosc /pb/1,100". Notes: "MagicQ only supports
      OSC over UDP"; bundles are received but not sent; the address shown for an Execute item with
      "//" "is also the address that gets sent when feedback is enabled". TouchOSC: the demo's
      Load vals button sends /feedback/pb+exec, which also "enables automatic sending of any
      changes to playbacks and executes", and is used again "after network loss".
  - title: MagicQ Manual 1.9.9.x, ChamSys Remote Protocol Commands
    author: ChamSys Ltd
    url: https://docs.chamsys.co.uk/magicq/1.9.9.x/manual/remote_control_commands.html
    note: >
      PDF pp. 471-474. Commands are comma-separated values ending in a letter A-Z (or a-z);
      spaces, tabs and carriage returns are ignored; commands can be sent back to back
      ("1A2A1S2G3,4I"). Remote playback commands A, R, T, U, G, S, B, F, L, J, P, I, H, X with
      their parameter ranges (<playback number> "1 and 10 (202 on MagicQ consoles)", <level>
      0-100, <page number> 0-100, <channel number> 1-32769, <cue id> 1-65536, <cue id dec> 0-99
      "for Cue ID 1.5 use 50", <button id> 1-10, <zone id> 1-20, <state> 1 pressed, 2 activate, 3
      release, 4 toggle, 7 cycle, 9 increase, 10 decrease); examples "4,50I" and "8,2,50J". Remote
      programming commands 01-13, 19-23, 30-32, 40-43, 71, 80-83, 90-94, 112, 911 and 999 ending
      in H, with <palette id> 1-1024, <Q id> 1-10000, <16 bit> 0/1, <time> seconds, <group
      number> 1-200, heads 1-6145, <show file id> 0000-9999, <state> 0/1 or 2 toggle, and the
      attribute number list. Sent here as the /rpc string argument.
  - title: MagicQ Manual 1.9.9.x, Controlling MagicQ Using UDP/IP
    author: ChamSys Ltd
    url: https://docs.chamsys.co.uk/magicq/1.9.9.x/manual/remote_control_network.html
    note: >
      PDF pp. 475-480. ChamSys Remote Ethernet Protocol (CREP): UDP port 6553 (changeable), the
      optional CREP header (CREP, version, seq_fwd, seq_bkwd, length), the "no header" modes, rx
      setting "ChamSys Rem rx"; "not supported when net session mode is in use"; on MagicQ PC/Mac
      "only enabled when it is connected to a MagicQ Wing or Interface (not MagicDMX)". Q-Sys
      plugins: QuickQ supports 10 playbacks and 10Scene zone 1..10. Not used as a transport here
      (see quirks); its command set is reached through /rpc.
  - title: MagicQ Manual 1.9.9.x, Settings > Network Settings
    author: ChamSys Ltd
    url: https://docs.chamsys.co.uk/magicq/1.9.9.x/manual/settings.html
    note: >
      PDF pp. 633-635. Ethernet Remote Protocol (tx, rx, both, no-header and rx echo variants;
      default None), Ethernet Remote Port (default 6553), Web Server (default Disabled) and Web
      Server Port (default 8080), OSC Mode (Disabled, Tx, Rx, Tx and Rx; default Disabled), OSC Tx
      Port (default 9000), OSC Rx Port (default 8000), OSC Tx IP (0 = broadcast, default 0).
  - title: MagicQ Manual 1.9.9.x, MIDI; MagicQ Software and Consoles; Remote Control
    author: ChamSys Ltd
    url: https://docs.chamsys.co.uk/magicq/1.9.9.x/manual/MIDI.html
    note: >
      MIDI, PDF p. 496: "for security reasons MagicQ limits the number of playbacks that can be
      controlled using MIDI and the remote protocols. On MagicQ consoles PB1 to PB34 can be
      controlled. On MagicQ PC, playbacks PB1 to PB10". MagicQ Software and Consoles, pp. 4-8
      (introduction.html): MQ500M+ Stadium (and predecessors MQ500M, MQ500), the Compact series
      MQ50, MQ70, MQ80 (previous MQ40N, MQ60, original MQ70), MagicQ Rack and MagicQ DIN ("supports
      all MagicQ features including scheduled events, OSC, UDP, and MIDI control"), MagicQ PC/Mac
      with Wings; MQ250M is named under Power Supply Protection (p. 10). Remote Control via Web
      Server and Custom Web Server Pages, pp. 466-470 (remote_control_console.html).
  - title: QuickQ Manual 12.0, Open Sound Control (OSC) and Ethernet Remote Control
    author: ChamSys Ltd
    url: https://docs.chamsys.co.uk/quickq/12.0/manual/touchosc.html
    note: >
      QuickQ Manual 12.0, "Latest Update, 2026-09-23" (PDF
      https://docs.chamsys.co.uk/quickq/12.0/_exports/quickq-12.0.pdf), OSC p. 73: software 6.0
      onwards; "QuickQ is hard coded to TX on port 9000 and RX on port 8000. Port number is fixed";
      Table 1 lists /pb/<playback> (level), /pb/<playback>/go, /flash, /pause, /release,
      /10scene/<item>/<zone> and /10scene/<item> (none or 1 activate, 0 release), /feedback/off,
      /feedback/pb, /feedback/exec, /feedback/pb+exec; on a QuickQ 10 the CUE STACK playback is
      Playback 1 and the two chase playbacks, left to right, are Playbacks 3 and 2; Open Sound
      Control must be enabled in Settings > Network > Protocols. Ethernet Remote Control p. 74
      (ethernetremote.html): UDP port 6553, fixed, no header, commands A, R, T, U, G, S, J, L, X.
      QuickQ Range (introduction.html): QuickQ 10, 20 and 30 consoles, QuickQ Rack, QuickQ DIN,
      QuickQ Designer ("can not be used to control lights or test remote control"); the QuickQ 10
      has one playback, the QuickQ 20 and 30 have 10 (p. 40).
  - title: Bitfocus Companion modules companion-module-chamsys-magicq-osc and companion-module-chamsys-quickq (community, MIT)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-chamsys-magicq-osc
    note: >
      Community code, read for corroboration only (both repositories MIT at the top level). ChamSys
      does not document the format of the feedback messages; these modules parse /pb/<n> with a
      level 0.0-1.0, /pb/<n>/flash, and /exec/<page>/<item> with a level 0.0-1.0, after sending
      /feedback/pb+exec, listening on port 9000. The telemetry rules below follow that and are
      labelled as community-sourced.

# OSC 1.0 over UDP to the console's OSC Rx Port (MagicQ default 8000; QuickQ fixed at 8000). The
# console never acknowledges, so every command reports unverified. Feedback goes to the
# console's OSC Tx IP (0 = broadcast) and Tx Port (MagicQ default 9000; QuickQ fixed at 9000),
# not back to the sender, so it is received on a fixed local port.
transport:
  type: osc-udp
  port: 8000
  reply: none
  listen_port: { setting: feedback_port }

settings:
  feedback_port: { type: int, min: 1, max: 65535, default: 9000 }

ports:
  - { port: 8000, protocol: udp, role: control }
  - { port: 9000, protocol: udp, role: feedback, listener: core, setting: feedback_port, note: "where the device sends its feedback" }

