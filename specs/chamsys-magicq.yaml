quirks:
  - models: [all]
    severity: critical
    text: >
      OSC is off by default. On MagicQ set Setup, View Settings, Network, OSC Mode to "Rx" (or "Tx
      and Rx" for feedback) and OSC Rx Port to the port the device is registered with (default
      8000; 0 disables). On QuickQ enable Open Sound Control in Settings > Network > Protocols;
      its ports are fixed at RX 8000 and TX 9000. Without this the console drops every message
      and, with no acknowledgement, commands still report unverified.

  - models: [all]
    severity: warning
    text: >
      The console acknowledges nothing over OSC, so every command reports unverified. Use the
      feedback telemetry to confirm playback and execute changes.

  - models: [all]
    severity: warning
    text: >
      Feedback is sent to the console's OSC Tx IP and Tx Port, not back to the sender. Set OSC Mode
      to "Tx and Rx", OSC Tx Port to this device's feedback_port (default 9000, the MagicQ default
      and the QuickQ fixed port), and OSC Tx IP to the host's address or 0 (broadcast). On QuickQ
      the transmit port is fixed at 9000, so feedback_port must stay 9000. The listen port is
      shared by every device using it; each datagram is credited to the console it came from.

  - models: [all]
    severity: warning
    text: >
      ChamSys does not document the feedback messages beyond "transmits state of playbacks and
      executes" and that an Execute item's feedback uses its own OSC address. The address and
      argument shapes in the telemetry rules (/pb/<n> and /exec/<page>/<item> with a level 0.0-1.0,
      /pb/<n>/flash) come from the community Bitfocus Companion modules, not from ChamSys. The
      state is therefore stored as sent: levels as fractions 0.0-1.0, flash as the raw number.

  - models: [all]
    severity: info
    text: >
      /feedback/pb+exec is sent on connecting and every 30 s. The console keeps no session for an
      OSC sender, and ChamSys's own TouchOSC example re-sends it "if the app gets closed or after
      network loss"; the repeat is this spec's choice for recovering after a console restart. Each
      send makes the console transmit the full state of its playbacks and executes.

  - models: [all]
    severity: info
    text: >
      Only playbacks 1-10 and Execute grids 1-10 can be addressed with the built-in OSC addresses
      ("Only the first 10 playbacks and first 10 execute grids can be controlled"). User-defined OSC
      triggers in the Macro, View Autom window (address up to 15 characters, OSC Command up to 39)
      can reach other parts of the show; they are installation-specific and not specced here, but
      can be sent with any address by a host that knows them.

  - models: [all]
    severity: info
    text: >
      Arguments: MagicQ accepts a float or an int wherever the table does not say. pb_level sends
      an int 0-100; exec_*_level sends a float 0.0-1.0, because an int 0 or 1 on /exec means
      release/activate rather than a level. go, pause, release and the no-argument exec and 10Scene
      commands send no argument (the argument is optional).

  - models: [magicq-mq500m-plus, magicq-mq500m, magicq-mq500, magicq-mq250m, magicq-mq80, magicq-mq70, magicq-mq60, magicq-mq50, magicq-rack, magicq-din, magicq-pc]
    severity: warning
    text: >
      set_blackout follows the manual's table literally: "/dbo: 0 turns on, non-zero turns off",
      so blackout true sends 0 and false sends 1. The community Companion module sends 1 for
      "Black Out On" and 0 for off, the opposite reading. ChamSys does not say which is right;
      verify on the console before relying on it.

  - models: [magicq-mq500m-plus, magicq-mq500m, magicq-mq500, magicq-mq250m, magicq-mq80, magicq-mq70, magicq-mq60, magicq-mq50, magicq-rack, magicq-din, magicq-pc]
    severity: warning
    text: >
      rpc and rpc_* carry ChamSys Remote Protocol commands inside /rpc ("Send remote Ethernet
      command"). The OSC page does not say whether Setup, Network, Ethernet Remote Protocol must
      also be set to an rx mode for /rpc; the Remote Ethernet Protocol is "not supported when net
      session mode is in use", which may apply to /rpc as well. Remote programming commands (H)
      act on the console's programmer and include record, save, load, shutdown (94) and emergency
      hot takeover (112); intent cannot be validated.

  - models: [magicq-mq500m-plus, magicq-mq500m, magicq-mq500, magicq-mq250m, magicq-mq80, magicq-mq70, magicq-mq60, magicq-mq50, magicq-rack, magicq-din, magicq-pc]
    severity: warning
    text: >
      Remote-protocol playback numbers are taken as 1-202 ("<playback number> a number between 1
      and 10 (202 on MagicQ consoles)"). The MIDI chapter says MagicQ limits playbacks controlled
      by "MIDI and the remote protocols" to PB1-PB34 on consoles and PB1-PB10 on MagicQ PC. The two
      pages disagree; numbers above 34 may be ignored on consoles, and above 10 on PC.

  - models: [magicq-mq500m-plus, magicq-mq500m, magicq-mq500, magicq-mq250m, magicq-mq80, magicq-mq70, magicq-mq60, magicq-mq50, magicq-rack, magicq-din, magicq-pc]
    severity: info
    text: >
      Ranges the manual leaves open are bounded here, not documented: attribute values 0-65535
      (8-bit or 16-bit), times 0-3600 s, cue stack ids 1-10000, and the cue id of remote
      programming 13, 23 and 82 as the playback table's 1-65536. 10Scene zones for /10Scene are
      taken as 1-100 (the Q-Sys plugin section's "10Scene zone (1..100)"); the remote protocol's X
      command documents zones 1-20. Remote programming numbers are sent as the table writes them
      ("01" to "09"); leading zeros are part of a decimal value either way. Attribute numbers are
      the table's 0-51 (Intensity 0, Pan 4, Tilt 5, Cyan 16, ...).

  - models: [magicq-mq500m-plus, magicq-mq500m, magicq-mq500, magicq-mq250m, magicq-mq80, magicq-mq70, magicq-mq60, magicq-mq50, magicq-rack, magicq-din, magicq-pc]
    severity: info
    text: >
      Execute page and item names are limited here to letters, digits and "_+.-" (up to 32
      characters), so that a name is a valid single OSC address segment; grid references such as
      4x3 and box numbers fit. Names containing spaces or OSC-reserved characters cannot be
      addressed and need a number or grid reference instead. Address letter case is as printed:
      /10Scene on MagicQ, /10scene on QuickQ.

  - models: [magicq-pc]
    severity: critical
    text: >
      MagicQ PC/Mac receives OSC only "when fully unlocked (Unlocked Mode)" ("supported ... on
      MagicQ PC systems unlocked with a MagicQ Wing or Interface"), and the Remote Ethernet
      Protocol only with a MagicQ Wing or Interface connected (not MagicDMX). Remote-protocol
      playbacks are limited to PB1-PB10 on PC.

  - models: [magicq-mq500m-plus, magicq-mq500m, magicq-mq500, magicq-mq250m, magicq-mq80, magicq-mq70, magicq-mq60, magicq-mq50, magicq-rack, magicq-din]
    severity: info
    text: >
      MQ40 and MQ40N consoles do not support OSC ("except MQ40 and MQ40N") and are not listed;
      they can be reached only by the UDP Remote Ethernet Protocol on port 6553, which this
      transport cannot carry.

  - models: [quickq-10, quickq-20, quickq-30, quickq-rack, quickq-din]
    severity: warning
    text: >
      QuickQ accepts only /pb/<n> (level, go, flash, pause, release), /10scene and /feedback over
      OSC (software 6.0 onwards); there is no /rpc, /exec, /dbo, /swap or jump-to-cue address.
      Its other commands (activate, release, test, untest, stop, jump to cue, 10Scene state X)
      exist only on its UDP Ethernet Remote Control (port 6553, fixed, no header), which this
      transport cannot carry. QuickQ Designer "can not be used to control lights or test remote
      control" and is not listed.

  - models: [quickq-10]
    severity: info
    text: >
      The QuickQ 10 has one cue stack playback and two chase playbacks: the CUE STACK playback is
      Playback 1, and the chase playbacks, from left to right as seen at the console, are Playbacks
      3 and 2. Playbacks 4-10 do not exist on it.

  - models: [quickq-rack, quickq-din]
    severity: info
    text: >
      The QuickQ manual's external control list names "The QuickQ Rack and Consoles"; the QuickQ
      DIN runs the same software but is not named there. Rack and DIN have no physical playback
      faders; their 10 playbacks are driven by the front buttons, wall plates and remote control.

state:
  playbacks.*.level: { type: float, description: "Playback fader level as a fraction 0.0-1.0, from /pb/<n> feedback (community-documented format)" }
  playbacks.*.flash: { type: float, description: "Playback flash state as the console sends it, 0 off, non-zero on, from /pb/<n>/flash feedback (community-documented format)" }
  executes.*.*.level: { type: float, description: "Execute Window item level as a fraction 0.0-1.0, by page and item, from /exec/<page>/<item> feedback (community-documented format)" }

telemetry:
  subscribe:
    send:
      - { address: /feedback/pb+exec }
    every_ms: 30000
  updates:
    - address: '^/pb/(\d+)$'
      state: { "playbacks.{1}.level": "{arg0}" }
    - address: '^/pb/(\d+)/flash$'
      state: { "playbacks.{1}.flash": "{arg0}" }
    - address: '^/exec/([A-Za-z0-9_+-]+)/([A-Za-z0-9_+-]+)$'
      state: { "executes.{1}.{2}.level": "{arg0}" }
