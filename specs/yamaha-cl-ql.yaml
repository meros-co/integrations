  set_parameter:
    summary: Set any numeric parameter by its RCP address (raw value, as the console's parameter list
      gives it); x and y are sent as given, numbered from 0, and 0 where the address has no X or Y
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
        label: RCP address
        description: "The parameter's RCP address, such as MIXER:Current/InCh/Fader/Level, as Yamaha's parameter list gives it."
      x:
        type: int
        min: 0
        required: true
        label: X
        description: "First index of the address (usually the channel or mix), numbered from 0, so 0 is channel 1; 0 when the address has no X."
      y:
        type: int
        min: 0
        required: true
        label: "Y"
        description: "Second index of the address, numbered from 0; 0 when the address has no Y."
      value:
        type: int
        required: true
        label: Value
        description: "Raw numeric value as the console's parameter list gives it; the console clamps a value out of range."
    send: set {address} {x} {y} {value}
    expect:
      matches: '^OKm? set \S+ \d+ \d+ '
    returns: ack
  set_parameter_text:
    summary: Set any text parameter (name, colour, type) by its RCP address; the value is sent double-quoted
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
        label: RCP address
        description: "The parameter's RCP address, such as MIXER:Current/InCh/Fader/Level, as Yamaha's parameter list gives it."
      x:
        type: int
        min: 0
        required: true
        label: X
        description: "First index of the address (usually the channel or mix), numbered from 0, so 0 is channel 1; 0 when the address has no X."
      y:
        type: int
        min: 0
        required: true
        label: "Y"
        description: "Second index of the address, numbered from 0; 0 when the address has no Y."
      value:
        type: string
        pattern: ^[ -~]*$
        required: true
        label: Text
        description: "Text value such as a name or colour, printable ASCII only."
    send: set {address} {x} {y} {value:json}
    expect:
      matches: '^OKm? set \S+ \d+ \d+ '
    returns: ack
  get_parameter:
    summary: Read any parameter by its RCP address; returns the value as sent, a text value with its quotes
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
        label: RCP address
        description: "The parameter's RCP address, such as MIXER:Current/InCh/Fader/Level, as Yamaha's parameter list gives it."
      x:
        type: int
        min: 0
        required: true
        label: X
        description: "First index of the address (usually the channel or mix), numbered from 0, so 0 is channel 1; 0 when the address has no X."
      y:
        type: int
        min: 0
        required: true
        label: "Y"
        description: "Second index of the address, numbered from 0; 0 when the address has no Y."
    send: get {address} {x} {y}
    expect:
      matches: ^OK get \S+ \d+ \d+ (.*?)\s*$
    returns: value
  get_product_name:
    summary: Read the product name (devinfo productname)
    send: devinfo productname
