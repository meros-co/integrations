  updates:
    - match: ^OK devinfo productname "?([^"]*?)"?\s*$
      state:
        device.product_name: '{1}'
    - match: ^OK devinfo devicename "?([^"]*?)"?\s*$
      state:
        device.name: '{1}'
    - match: ^(?:OK|NOTIFY) devstatus runmode "?([a-z]+)"?\s*$
      state:
        device.run_mode: '{1}'
    - match: ^(?:OK|NOTIFY) devstatus error "?(.*?)"?\s*$
      state:
        device.error: '{1}'
    - match: '^(?:OK|NOTIFY) sscurrent_ex MIXER:Lib/Scene (\d+)(?: .*)?$'
      state:
        scene.current: '{1}'
    - match: ^(?:OK|NOTIFY) sscurrent_ex MIXER:Lib/Scene \d+ (modified|unmodified)\s*$
      state:
        scene.modified:
          value: '{1}'
          map:
            modified: true
            unmodified: false
    - match: ^(?:OK|NOTIFY) ssrecall_ex MIXER:Lib/Scene (\d+)\s*$
      state:
        scene.current: '{1}'
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) MIXER:Current/InCh/Fader/Level (\d+) (\d+) "?(-?\d+)"?(?: .*)?$'
      state:
        inputs.{1:+1}.fader_level: '{3}'
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) MIXER:Current/InCh/Fader/On (\d+) (\d+) "?(-?\d+)"?(?: .*)?$'
      state:
        inputs.{1:+1}.on:
          value: '{3}'
          map:
            '0': false
            '1': true
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) MIXER:Current/InCh/ToSt/Pan (\d+) (\d+) "?(-?\d+)"?(?: .*)?$'
      state:
        inputs.{1:+1}.stereo_pan: '{3}'
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) MIXER:Current/StInCh/Fader/Level (\d+) (\d+) "?(-?\d+)"?(?: .*)?$'
      state:
        stereo_inputs.{1:+1}.fader_level: '{3}'
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) MIXER:Current/StInCh/Fader/On (\d+) (\d+) "?(-?\d+)"?(?: .*)?$'
      state:
        stereo_inputs.{1:+1}.on:
          value: '{3}'
          map:
            '0': false
            '1': true
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) MIXER:Current/StInCh/ToSt/Pan (\d+) (\d+) "?(-?\d+)"?(?: .*)?$'
      state:
        stereo_inputs.{1:+1}.stereo_pan: '{3}'
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) MIXER:Current/StInCh/Out/Balance (\d+) (\d+) "?(-?\d+)"?(?: .*)?$'
      state:
        stereo_inputs.{1:+1}.balance: '{3}'
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) MIXER:Current/Mix/Fader/Level (\d+) (\d+) "?(-?\d+)"?(?: .*)?$'
