  updates:
    - match: ^OK devinfo productname "?([^"]*?)"?\s*$
      state:
        device.product_name: '{1}'
    - match: ^OK devinfo devicename "?([^"]*?)"?\s*$
      state:
        device.name: '{1}'
    - match: ^(?:OK|NOTIFY) devstatus runmode "?([a-z]+)"?\s*$
      state:
        device.run_mode: '{1}'
    - match: ^(?:OK|NOTIFY) devstatus error "?(.*?)"?\s*$
      state:
        device.error: '{1}'
    - match: '^(?:OK|NOTIFY) sscurrent_ex MIXER:Lib/Scene (\d+)(?: .*)?$'
