commands:
  set_input_fader_level:
    summary: 'Set the input channel fader level (MIXER:Current/InCh/Fader/Level; channel = input channel from 1; level: hundredths of a dB, -32768 (-inf) to 1000 (+10 dB))'
    params:
      channel:
        type: int
        min: 1
        max: 72
        required: true
        label: "Input channel"
        description: "Input channel number from 1 as on the console, up to the model's channel count (72 on CL5, 64 on CL3 and QL5, 48 on CL1, 32 on QL1)."
      level:
        type: int
        min: -32768
        max: 1000
        required: true
        label: "Fader level"
        description: "Fader level in hundredths of a dB, from -32768 (-inf) to 1000 (+10.00 dB); 0 is 0 dB."
    send: set MIXER:Current/InCh/Fader/Level {channel:-1} 0 {level}
    expect:
      matches: '^OKm? set MIXER:Current/InCh/Fader/Level \d+ \d+ '
    returns: ack
  get_input_fader_level:
    summary: 'Read the input channel fader level (MIXER:Current/InCh/Fader/Level); returns the raw value (hundredths of a dB, -32768 (-inf) to 1000 (+10 dB))'
    params:
      channel:
        type: int
        min: 1
        max: 72
        required: true
        label: "Input channel"
        description: "Input channel number from 1 as on the console, up to the model's channel count (72 on CL5, 64 on CL3 and QL5, 48 on CL1, 32 on QL1)."
    send: get MIXER:Current/InCh/Fader/Level {channel:-1} 0
    expect:
      matches: '^OK get MIXER:Current/InCh/Fader/Level \d+ \d+ (-?\d+)'
    returns: value
  set_input_on:
    summary: 'Set the input channel ON key (MIXER:Current/InCh/Fader/On; channel = input channel from 1; enabled: true = 1 (ON), false = 0 (OFF))'
    params:
      channel:
        type: int
        min: 1
        max: 72
        required: true
        label: "Input channel"
        description: "Input channel number from 1 as on the console, up to the model's channel count (72 on CL5, 64 on CL3 and QL5, 48 on CL1, 32 on QL1)."
      enabled:
        type: bool
        required: true
        label: "On"
        description: "The channel's ON key: true is on, false is off (muted)."
    send: set MIXER:Current/InCh/Fader/On {channel:-1} 0 {enabled:bool01}
    expect:
      matches: '^OKm? set MIXER:Current/InCh/Fader/On \d+ \d+ '
    returns: ack
  get_input_on:
    summary: 'Read the input channel ON key (MIXER:Current/InCh/Fader/On); returns the raw value (true = 1 (ON), false = 0 (OFF))'
    params:
      channel:
        type: int
        min: 1
        max: 72
        required: true
        label: "Input channel"
        description: "Input channel number from 1 as on the console, up to the model's channel count (72 on CL5, 64 on CL3 and QL5, 48 on CL1, 32 on QL1)."
    send: get MIXER:Current/InCh/Fader/On {channel:-1} 0
    expect:
      matches: '^OK get MIXER:Current/InCh/Fader/On \d+ \d+ (-?\d+)'
    returns: value
  set_input_stereo_pan:
    summary: 'Set the input channel pan to stereo (MIXER:Current/InCh/ToSt/Pan; channel = input channel from 1; pan: -63 (L63) to 63 (R63), 0 centre)'
    params:
      channel:
        type: int
        min: 1
        max: 72
        required: true
        label: "Input channel"
        description: "Input channel number from 1 as on the console, up to the model's channel count (72 on CL5, 64 on CL3 and QL5, 48 on CL1, 32 on QL1)."
      pan:
        type: int
        min: -63
        max: 63
        required: true
        label: "Pan"
        description: "Pan to the stereo bus from -63 (L63) through 0 (centre) to 63 (R63)."
    send: set MIXER:Current/InCh/ToSt/Pan {channel:-1} 0 {pan}
    expect:
      matches: '^OKm? set MIXER:Current/InCh/ToSt/Pan \d+ \d+ '
    returns: ack
  get_input_stereo_pan:
    summary: 'Read the input channel pan to stereo (MIXER:Current/InCh/ToSt/Pan); returns the raw value (-63 (L63) to 63 (R63), 0 centre)'
    params:
      channel:
        type: int
        min: 1
        max: 72
        required: true
        label: "Input channel"
        description: "Input channel number from 1 as on the console, up to the model's channel count (72 on CL5, 64 on CL3 and QL5, 48 on CL1, 32 on QL1)."
    send: get MIXER:Current/InCh/ToSt/Pan {channel:-1} 0
    expect:
      matches: '^OK get MIXER:Current/InCh/ToSt/Pan \d+ \d+ (-?\d+)'
    returns: value
  set_stereo_input_fader_level:
    summary: 'Set the stereo input channel fader level (MIXER:Current/StInCh/Fader/Level; stereo_input = stereo input channel from 1; level: hundredths of a dB, -32768 (-inf) to 1000 (+10 dB))'
    params:
      stereo_input:
        type: int
        min: 1
        max: 16
        required: true
        label: "Stereo input channel"
        description: "Stereo input channel from 1 to 16, two per stereo input: 1 is ST IN 1L, 2 is ST IN 1R, up to 16 for ST IN 8R."
      level:
        type: int
        min: -32768
        max: 1000
        required: true
        label: "Fader level"
        description: "Fader level in hundredths of a dB, from -32768 (-inf) to 1000 (+10.00 dB); 0 is 0 dB."
    send: set MIXER:Current/StInCh/Fader/Level {stereo_input:-1} 0 {level}
    expect:
      matches: '^OKm? set MIXER:Current/StInCh/Fader/Level \d+ \d+ '
    returns: ack
  get_stereo_input_fader_level:
    summary: 'Read the stereo input channel fader level (MIXER:Current/StInCh/Fader/Level); returns the raw value (hundredths of a dB, -32768 (-inf) to 1000 (+10 dB))'
    params:
      stereo_input:
        type: int
        min: 1
        max: 16
        required: true
        label: "Stereo input channel"
        description: "Stereo input channel from 1 to 16, two per stereo input: 1 is ST IN 1L, 2 is ST IN 1R, up to 16 for ST IN 8R."
    send: get MIXER:Current/StInCh/Fader/Level {stereo_input:-1} 0
    expect:
      matches: '^OK get MIXER:Current/StInCh/Fader/Level \d+ \d+ (-?\d+)'
    returns: value
  set_stereo_input_on:
    summary: 'Set the stereo input channel ON key (MIXER:Current/StInCh/Fader/On; stereo_input = stereo input channel from 1; enabled: true = 1 (ON), false = 0 (OFF))'
    params:
      stereo_input:
        type: int
        min: 1
        max: 16
        required: true
        label: "Stereo input channel"
        description: "Stereo input channel from 1 to 16, two per stereo input: 1 is ST IN 1L, 2 is ST IN 1R, up to 16 for ST IN 8R."
      enabled:
        type: bool
        required: true
        label: "On"
        description: "The channel's ON key: true is on, false is off (muted)."
    send: set MIXER:Current/StInCh/Fader/On {stereo_input:-1} 0 {enabled:bool01}
    expect:
      matches: '^OKm? set MIXER:Current/StInCh/Fader/On \d+ \d+ '
    returns: ack
  get_stereo_input_on:
    summary: 'Read the stereo input channel ON key (MIXER:Current/StInCh/Fader/On); returns the raw value (true = 1 (ON), false = 0 (OFF))'
    params:
      stereo_input:
        type: int
        min: 1
        max: 16
        required: true
        label: "Stereo input channel"
        description: "Stereo input channel from 1 to 16, two per stereo input: 1 is ST IN 1L, 2 is ST IN 1R, up to 16 for ST IN 8R."
    send: get MIXER:Current/StInCh/Fader/On {stereo_input:-1} 0
    expect:
      matches: '^OK get MIXER:Current/StInCh/Fader/On \d+ \d+ (-?\d+)'
    returns: value
  set_stereo_input_stereo_pan:
    summary: 'Set the stereo input channel pan to stereo (MIXER:Current/StInCh/ToSt/Pan; stereo_input = stereo input channel from 1; pan: -63 (L63) to 63 (R63), 0 centre)'
    params:
      stereo_input:
        type: int
        min: 1
        max: 16
        required: true
        label: "Stereo input channel"
        description: "Stereo input channel from 1 to 16, two per stereo input: 1 is ST IN 1L, 2 is ST IN 1R, up to 16 for ST IN 8R."
      pan:
        type: int
        min: -63
        max: 63
        required: true
        label: "Pan"
        description: "Pan to the stereo bus from -63 (L63) through 0 (centre) to 63 (R63)."
    send: set MIXER:Current/StInCh/ToSt/Pan {stereo_input:-1} 0 {pan}
    expect:
      matches: '^OKm? set MIXER:Current/StInCh/ToSt/Pan \d+ \d+ '
    returns: ack
  get_stereo_input_stereo_pan:
    summary: 'Read the stereo input channel pan to stereo (MIXER:Current/StInCh/ToSt/Pan); returns the raw value (-63 (L63) to 63 (R63), 0 centre)'
    params:
      stereo_input:
        type: int
        min: 1
        max: 16
        required: true
        label: "Stereo input channel"
        description: "Stereo input channel from 1 to 16, two per stereo input: 1 is ST IN 1L, 2 is ST IN 1R, up to 16 for ST IN 8R."
    send: get MIXER:Current/StInCh/ToSt/Pan {stereo_input:-1} 0
    expect:
      matches: '^OK get MIXER:Current/StInCh/ToSt/Pan \d+ \d+ (-?\d+)'
    returns: value
  set_stereo_input_balance:
    summary: 'Set the stereo input channel output balance (MIXER:Current/StInCh/Out/Balance; stereo_input = stereo input channel from 1; balance: -63 (L63) to 63 (R63), 0 centre)'
    params:
      stereo_input:
        type: int
        min: 1
        max: 16
        required: true
        label: "Stereo input channel"
        description: "Stereo input channel from 1 to 16, two per stereo input: 1 is ST IN 1L, 2 is ST IN 1R, up to 16 for ST IN 8R."
      balance:
        type: int
        min: -63
