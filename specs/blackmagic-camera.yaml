commands:
  # ── Transport (Transport Control API, p.27-30) ────────────────────────────────
  get_transport_mode:
    summary: "Transport mode: InputPreview, InputRecord or Output (GET /transports/0, p.27)"
    send: { method: GET, path: "/control/api/v1/transports/0" }
    expect: { status: 200, json_path: "$.mode" }
    returns: value
  set_transport_mode:
    summary: "Set the transport mode: InputPreview (live) or Output (playback) (PUT /transports/0, p.27)"
    params:
      mode: { type: enum, values: [InputPreview, Output], required: true, label: Transport mode, description: "InputPreview shows the live input, Output plays back." }
    send: { method: PUT, path: "/control/api/v1/transports/0", body: '{"mode":"{mode}"}', content_type: application/json }
    expect: { status: 204 }
    returns: ack
  get_transport_stopped:
    summary: "True when the transport is in InputPreview, or in Output with speed 0 (GET /transports/0/stop, p.27)"
    send: { method: GET, path: "/control/api/v1/transports/0/stop" }
    expect: { status: 200, json_path: "$" }
    returns: value
  stop:
    summary: "Stop the transport: ends a recording or stops playback (POST /transports/0/stop, p.28)"
    send: { method: POST, path: "/control/api/v1/transports/0/stop" }
    expect: { status: 204 }
    returns: ack
  get_transport_playing:
    summary: "True when the transport is in Output mode with a non-zero speed (GET /transports/0/play, p.28)"
    send: { method: GET, path: "/control/api/v1/transports/0/play" }
    expect: { status: 200, json_path: "$" }
    returns: value
  play:
    summary: "Start playback (POST /transports/0/play, p.28)"
    send: { method: POST, path: "/control/api/v1/transports/0/play" }
    expect: { status: 204 }
    returns: ack
  get_playback:
    summary: "Playback state: type, loop, singleClip, speed and position (GET /transports/0/playback, p.28)"
    send: { method: GET, path: "/control/api/v1/transports/0/playback" }
    expect: { status: 200, json_path: "$" }
    returns: value
  set_playback:
    summary: "Set the playback state. The body is JSON in the document's playback shape: any of type (Play, Jog, Shuttle, Var), loop, singleClip, speed, position (PUT /transports/0/playback, p.29)"
    params:
      body: { type: json, required: true, label: Playback, description: "JSON with any of type (Play, Jog, Shuttle, Var), loop, singleClip, speed and position; fields left out are unchanged." }
    send: { method: PUT, path: "/control/api/v1/transports/0/playback", body: '{body}', content_type: application/json }
    expect: { status: 204 }
    returns: ack
  set_playback_type:
    summary: "Set the playback type (PUT /transports/0/playback, p.29)"
    params:
      type: { type: enum, values: [Play, Jog, Shuttle, Var], required: true, label: Playback type, description: "Play, Jog, Shuttle or Var." }
    send: { method: PUT, path: "/control/api/v1/transports/0/playback", body: '{"type":"{type}"}', content_type: application/json }
    expect: { status: 204 }
    returns: ack
  set_playback_loop:
    summary: "Loop playback from the end of the timeline to its beginning (PUT /transports/0/playback, p.29)"
    params:
      loop: { type: bool, default: true, label: Loop, description: "On loops from the end of the timeline back to its beginning, off stops at the end." }
    send: { method: PUT, path: "/control/api/v1/transports/0/playback", body: '{"loop":{loop}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack
  set_playback_single_clip:
    summary: "Loop playback within the current clip (PUT /transports/0/playback, p.29)"
    params:
      single_clip: { type: bool, default: true, label: Single clip, description: "On loops within the current clip, off plays through the timeline." }
    send: { method: PUT, path: "/control/api/v1/transports/0/playback", body: '{"singleClip":{single_clip}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack
  set_playback_speed:
    summary: "Set the playback speed, 1.0 for normal forward playback (PUT /transports/0/playback, p.29)"
    params:
      speed: { type: float, required: true, label: Speed, description: "Playback speed, 1.0 for normal forward playback; negative plays in reverse. The document gives no fixed range; the camera refuses a value outside its own." }
