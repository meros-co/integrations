telemetry:
  # The camera pushes property changes only over its websocket (p.71-94),
  # whose URL the document does not give, so the properties an operator watches are
  # polled every ten seconds. Replies to the matching get commands, and to
  # set_next_clip_slate (which answers with the slate), update the same state.
  poll:
    every_ms: 10000
    send:
      - { method: GET, path: /control/api/v1/transports/0 }
      - { method: GET, path: /control/api/v1/transports/0/record }
      - { method: GET, path: /control/api/v1/transports/0/playback }
      - { method: GET, path: /control/api/v1/transports/0/timecode }
      - { method: GET, path: /control/api/v1/transports/0/clipIndex }
      - { method: GET, path: /control/api/v1/camera/tallyStatus }
      - { method: GET, path: /control/api/v1/camera/power }
      - { method: GET, path: /control/api/v1/camera/colorBars }
      - { method: GET, path: /control/api/v1/camera/programFeedDisplay }
      - { method: GET, path: /control/api/v1/camera/timingReferenceLock }
      - { method: GET, path: /control/api/v1/lens/iris }
      - { method: GET, path: /control/api/v1/lens/zoom }
      - { method: GET, path: /control/api/v1/lens/focus }
      - { method: GET, path: /control/api/v1/video/iso }
      - { method: GET, path: /control/api/v1/video/gain }
      - { method: GET, path: /control/api/v1/video/whiteBalance }
      - { method: GET, path: /control/api/v1/video/whiteBalanceTint }
      - { method: GET, path: /control/api/v1/video/ndFilter }
      - { method: GET, path: /control/api/v1/video/shutter }
      - { method: GET, path: /control/api/v1/video/autoExposure }
      - { method: GET, path: /control/api/v1/colorCorrection/lift }
      - { method: GET, path: /control/api/v1/colorCorrection/gamma }
      - { method: GET, path: /control/api/v1/colorCorrection/gain }
      - { method: GET, path: /control/api/v1/colorCorrection/offset }
      - { method: GET, path: /control/api/v1/colorCorrection/contrast }
      - { method: GET, path: /control/api/v1/colorCorrection/color }
      - { method: GET, path: /control/api/v1/colorCorrection/lumaContribution }
      - { method: GET, path: /control/api/v1/presets/active }
      - { method: GET, path: /control/api/v1/media/active }
      - { method: GET, path: /control/api/v1/media/workingset }
      - { method: GET, path: /control/api/v1/system/codecFormat }
      - { method: GET, path: /control/api/v1/system/videoFormat }
      - { method: GET, path: /control/api/v1/livestreams/0 }
      - { method: GET, path: /control/api/v1/slates/nextClip }
      - { method: GET, path: /control/api/v1/audio/channel/0/level }
      - { method: GET, path: /control/api/v1/audio/channel/0/input }
      - { method: GET, path: /control/api/v1/audio/channel/1/level }
      - { method: GET, path: /control/api/v1/audio/channel/1/input }
  updates:
    # Transport (p.27-30)
    - path: "^/control/api/v1/transports/0$"
      json: { mode: "$.mode" }
      state: { transport.mode: "{mode}" }
    - path: "^/control/api/v1/transports/0/record$"
      json: { recording: "$.recording" }
      state: { transport.recording: "{recording}" }
    - path: "^/control/api/v1/transports/0/play$"
      json: { playing: "$" }
      state: { transport.playing: "{playing}" }
    - path: "^/control/api/v1/transports/0/stop$"
      json: { stopped: "$" }
      state: { transport.stopped: "{stopped}" }
    - path: "^/control/api/v1/transports/0/playback$"
      json: { type: "$.type", loop: "$.loop", single_clip: "$.singleClip", speed: "$.speed", position: "$.position" }
      state:
        playback.type: "{type}"
        playback.loop: "{loop}"
        playback.single_clip: "{single_clip}"
        playback.speed: "{speed}"
        playback.position: "{position}"
    - path: "^/control/api/v1/transports/0/timecode$"
      json: { display: "$.display", timeline: "$.timeline" }
      state:
        timecode.display: "{display}"
        timecode.timeline: "{timeline}"
    - path: "^/control/api/v1/transports/0/timecode/source$"
      json: { source: "$.timecode" }
      state: { timecode.source: "{source}" }
    - path: "^/control/api/v1/transports/0/clipIndex$"
      json: { index: "$.clipIndex" }
      state: { transport.clip_index: "{index}" }
    # Camera (p.62-65)
    - path: "^/control/api/v1/camera/tallyStatus$"
      json: { status: "$.status" }
      state: { camera.tally: "{status}" }
    - path: "^/control/api/v1/camera/power$"
      json: { source: "$.source", millivolt: "$.milliVolt" }
      state:
        camera.power.source: "{source}"
        camera.power.millivolt: "{millivolt}"
    - path: "^/control/api/v1/camera/power/displayMode$"
      json: { mode: "$.mode" }
      state: { camera.power.display_mode: "{mode}" }
    - path: "^/control/api/v1/camera/colorBars$"
      json: { enabled: "$.enabled" }
      state: { camera.color_bars: "{enabled}" }
    - path: "^/control/api/v1/camera/programFeedDisplay$"
      json: { enabled: "$.enabled" }
      state: { camera.program_feed_display: "{enabled}" }
    - path: "^/control/api/v1/camera/timingReferenceLock$"
      json: { locked: "$.locked" }
      state: { camera.timing_reference_locked: "{locked}" }
    # Lens (p.50-54)
    - path: "^/control/api/v1/lens/iris$"
      json: { stop: "$.apertureStop", normalised: "$.normalised", number: "$.apertureNumber", auto: "$.continuousApertureAutoExposure" }
      state:
        lens.iris.stop: "{stop}"
        lens.iris.normalised: "{normalised}"
        lens.iris.number: "{number}"
        lens.iris.auto_exposure: "{auto}"
    - path: "^/control/api/v1/lens/zoom$"
      json: { focal_length: "$.focalLength", normalised: "$.normalised" }
      state:
        lens.zoom.focal_length: "{focal_length}"
        lens.zoom.normalised: "{normalised}"
    - path: "^/control/api/v1/lens/focus$"
      json: { normalised: "$.normalised" }
      state: { lens.focus.normalised: "{normalised}" }
    - path: "^/control/api/v1/lens/opticalImageStabilization$"
      json: { enabled: "$.enabled" }
      state: { lens.optical_image_stabilization: "{enabled}" }
    # Video (p.54-62)
    - path: "^/control/api/v1/video/iso$"
      json: { iso: "$.iso" }
      state: { video.iso: "{iso}" }
    - path: "^/control/api/v1/video/gain$"
      json: { gain: "$.gain" }
      state: { video.gain: "{gain}" }
    - path: "^/control/api/v1/video/whiteBalance$"
      json: { kelvin: "$.whiteBalance" }
      state: { video.white_balance: "{kelvin}" }
    - path: "^/control/api/v1/video/whiteBalanceTint$"
      json: { tint: "$.whiteBalanceTint" }
      state: { video.white_balance_tint: "{tint}" }
    - path: "^/control/api/v1/video/ndFilter$"
      json: { stop: "$.stop" }
      state: { video.nd_filter: "{stop}" }
    - path: "^/control/api/v1/video/ndFilter/displayMode$"
      json: { mode: "$.displayMode" }
      state: { video.nd_display_mode: "{mode}" }
    - path: "^/control/api/v1/video/shutter$"
      json: { speed: "$.shutterSpeed", angle: "$.shutterAngle", auto: "$.continuousShutterAutoExposure" }
      state:
        video.shutter.speed: "{speed}"
        video.shutter.angle: "{angle}"
        video.shutter.auto_exposure: "{auto}"
    - path: "^/control/api/v1/video/shutter/measurement$"
      json: { measurement: "$.measurement" }
      state: { video.shutter.measurement: "{measurement}" }
    - path: "^/control/api/v1/video/autoExposure$"
      json: { mode: "$.mode", type: "$.type" }
      state:
        video.auto_exposure.mode: "{mode}"
        video.auto_exposure.type: "{type}"
    - path: "^/control/api/v1/video/detailSharpening$"
      json: { enabled: "$.enabled" }
      state: { video.detail_sharpening: "{enabled}" }
    - path: "^/control/api/v1/video/detailSharpeningLevel$"
      json: { level: "$.level" }
      state: { video.detail_sharpening_level: "{level}" }
    # Colour correction (p.66-70)
    - path: "^/control/api/v1/colorCorrection/(lift|gamma|gain|offset)$"
      json: { red: "$.red", green: "$.green", blue: "$.blue", luma: "$.luma" }
      state:
        "color.{1}.red": "{red}"
        "color.{1}.green": "{green}"
        "color.{1}.blue": "{blue}"
        "color.{1}.luma": "{luma}"
    - path: "^/control/api/v1/colorCorrection/contrast$"
      json: { pivot: "$.pivot", adjust: "$.adjust" }
      state:
        color.contrast.pivot: "{pivot}"
        color.contrast.adjust: "{adjust}"
    - path: "^/control/api/v1/colorCorrection/color$"
      json: { hue: "$.hue", saturation: "$.saturation" }
      state:
        color.hue: "{hue}"
        color.saturation: "{saturation}"
    - path: "^/control/api/v1/colorCorrection/lumaContribution$"
      json: { value: "$.lumaContribution" }
      state: { color.luma_contribution: "{value}" }
    # Presets, media and system (p.21-26, p.34-37, p.43-45)
    - path: "^/control/api/v1/presets/active$"
      json: { preset: "$.preset" }
      state: { presets.active: "{preset}" }
    - path: "^/control/api/v1/media/active$"
      json: { index: "$.workingsetIndex", device: "$.deviceName" }
      state:
        media.active.index: "{index}"
        media.active.device: "{device}"
    - path: "^/control/api/v1/media/workingset$"
      json_each: "$.workingset"
      json: { device: "$.deviceName", volume: "$.volume", record_time: "$.remainingRecordTime", total: "$.totalSpace", remaining: "$.remainingSpace", clips: "$.clipCount" }
      state:
        "media.devices.{device}.volume": "{volume}"
        "media.devices.{device}.remaining_record_time": "{record_time}"
        "media.devices.{device}.total_space": "{total}"
        "media.devices.{device}.remaining_space": "{remaining}"
        "media.devices.{device}.clip_count": "{clips}"
    - path: "^/control/api/v1/system/product$"
      json: { device: "$.deviceName", product: "$.productName", version: "$.softwareVersion" }
      state:
        system.device_name: "{device}"
        system.product_name: "{product}"
        system.software_version: "{version}"
    - path: "^/control/api/v1/system/codecFormat$"
      json: { codec: "$.codec", container: "$.container" }
      state:
        system.codec: "{codec}"
        system.container: "{container}"
    - path: "^/control/api/v1/system/videoFormat$"
      json: { name: "$.name", frame_rate: "$.frameRate", width: "$.width", height: "$.height", interlaced: "$.interlaced" }
      state:
        system.video_format.name: "{name}"
        system.video_format.frame_rate: "{frame_rate}"
        system.video_format.width: "{width}"
        system.video_format.height: "{height}"
        system.video_format.interlaced: "{interlaced}"
    - path: "^/control/api/v1/system/format$"
      json: { codec: "$.codec", frame_rate: "$.frameRate", off_speed: "$.offSpeedEnabled", off_speed_rate: "$.offSpeedFrameRate", width: "$.recordResolution.width", height: "$.recordResolution.height" }
      state:
        system.format.codec: "{codec}"
        system.format.frame_rate: "{frame_rate}"
        system.format.off_speed_enabled: "{off_speed}"
        system.format.off_speed_frame_rate: "{off_speed_rate}"
        system.format.record_width: "{width}"
        system.format.record_height: "{height}"
    # Livestream (p.4)
    - path: "^/control/api/v1/livestreams/0$"
      json: { status: "$.status", bitrate: "$.bitrate", format: "$.effectiveVideoFormat", duration: "$.duration", cache: "$.cache" }
      state:
        livestream.status: "{status}"
        livestream.bitrate: "{bitrate}"
        livestream.video_format: "{format}"
        livestream.duration: "{duration}"
        livestream.cache: "{cache}"
    # Slate (p.37-39): the GET reply and the PUT reply carry the same shape
    - path: "^/control/api/v1/slates/nextClip$"
      json: { clip_name: "$.clip.clipName", reel: "$.clip.reel", scene: "$.clip.scene", take: "$.clip.take", good_take: "$.clip.goodTake", shot_type: "$.clip.shotType", take_type: "$.clip.takeType", location: "$.clip.sceneLocation", time: "$.clip.sceneTime", project: "$.project.projectName", director: "$.project.director", camera: "$.project.camera", operator: "$.project.cameraOperator" }
      state:
        slate.clip_name: "{clip_name}"
        slate.reel: "{reel}"
        slate.scene: "{scene}"
        slate.take: "{take}"
        slate.good_take: "{good_take}"
        slate.shot_type: "{shot_type}"
        slate.take_type: "{take_type}"
        slate.scene_location: "{location}"
        slate.scene_time: "{time}"
        slate.project_name: "{project}"
        slate.director: "{director}"
        slate.camera: "{camera}"
        slate.camera_operator: "{operator}"
    # Audio (p.45-50): the wire's 0-based channel index becomes 1-based
    - path: "^/control/api/v1/audio/channels$"
      json: { count: "$.channels" }
      state: { audio.channel_count: "{count}" }
    - path: "^/control/api/v1/audio/channel/(\\d+)/level$"
      json: { gain: "$.gain", normalised: "$.normalised" }
      state:
        "audio.channels.{1:+1}.gain": "{gain}"
        "audio.channels.{1:+1}.level": "{normalised}"
    - path: "^/control/api/v1/audio/channel/(\\d+)/input$"
      json: { input: "$.input" }
      state: { "audio.channels.{1:+1}.input": "{input}" }
    - path: "^/control/api/v1/audio/channel/(\\d+)/phantomPower$"
      json: { enabled: "$.enabled" }
      state: { "audio.channels.{1:+1}.phantom_power": "{enabled}" }
    - path: "^/control/api/v1/audio/channel/(\\d+)/padding$"
      json: { enabled: "$.enabled" }
      state: { "audio.channels.{1:+1}.padding": "{enabled}" }
    - path: "^/control/api/v1/audio/channel/(\\d+)/lowCutFilter$"
      json: { enabled: "$.enabled" }
      state: { "audio.channels.{1:+1}.low_cut": "{enabled}" }
    - path: "^/control/api/v1/audio/channel/(\\d+)/available$"
      json: { available: "$.available" }
      state: { "audio.channels.{1:+1}.available": "{available}" }
    # Monitoring (p.12-20): per-display flags, keyed by the display name as
    # it appears in the request path
    - path: "^/control/api/v1/monitoring/([^/]+)/(cleanFeed|displayLUT|zebra|focusAssist|frameGuide|frameGrids|safeArea|falseColor)$"
      json: { enabled: "$.enabled" }
      state: { "monitoring.displays.{1}.{2}": "{enabled}" }
    - path: "^/control/api/v1/monitoring/focusAssist$"
      json: { mode: "$.mode", color: "$.color", intensity: "$.intensity" }
      state:
        monitoring.focus_assist.mode: "{mode}"
        monitoring.focus_assist.color: "{color}"
        monitoring.focus_assist.intensity: "{intensity}"
    - path: "^/control/api/v1/monitoring/frameGuideRatio$"
      json: { ratio: "$.ratio" }
      state: { monitoring.frame_guide_ratio: "{ratio}" }
    - path: "^/control/api/v1/monitoring/safeAreaPercent$"
      json: { percent: "$.percent" }
      state: { monitoring.safe_area_percent: "{percent}" }
    # Immersive (p.65)
    - path: "^/control/api/v1/immersive/display/([^/]+)/eye$"
      json: { eye: "$.eye" }
      state: { "immersive.displays.{1}.eye": "{eye}" }

