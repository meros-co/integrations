spec: 1
id: blackmagic-camera
name: Blackmagic cameras (Camera Control REST API)
vendor: Blackmagic Design
category: camera

# Every command is an endpoint of Blackmagic's REST API for Blackmagic
# Cameras, under the base path /control/api/v1. Summaries end with the method,
# the path below the base path and the document's page. The document's
# websocket notification service is not used: the document does not give its
# URL, so it cannot be opened (telemetry.websocket needs a path); state is
# polled instead. See quirks.

source:
  - title: REST API for Blackmagic Cameras (Developer Information, August 2025)
    author: Blackmagic Design
    url: https://documents.blackmagicdesign.com/DeveloperManuals/RESTAPIforBlackmagicCameras.pdf
    note: >
      Manufacturer document, 94 pages, released 7 August 2025 (PDF dated
      2025-08-07), retrieved 2026-10-01; the current version on Blackmagic's
      developer page (https://www.blackmagicdesign.com/developer/products/camera/sdk-and-software).
      Compatible cameras and the base path /control/api/v1 on p.2; the YAML
      documentation each camera serves at /control/documentation.html on p.3.
      API groups: Livestream p.4-8, Clips p.8-9, Media Pool p.9-12,
      Monitoring p.12-20, Event p.21, System p.21-26, Transport p.27-30,
      Timeline p.31-34, Media p.34-37, Slate p.37-43, Preset p.43-45, Audio
      p.45-50, Lens p.50-54, Video p.54-62, Camera p.62-65, Immersive p.65,
      Color Correction p.66-70, Notification websocket 1.0.0 p.71-75, and the
      value each websocket property carries p.76-94. Blackmagic does not
      publish the YAML/OpenAPI files themselves; they are served only by a
      camera.
  - title: Blackmagic Cinema Camera 6K Installation and Operation Manual, Network Access settings
    author: Blackmagic Design
    url: https://documents.blackmagicdesign.com/UserManuals/BlackmagicCinemaCamera6KManual.pdf
    note: >
      Manufacturer manual, read through the copy at
      https://www.manualslib.com/manual/3197949/Blackmagicdesign-Cinema-Camera-6k.html
      pages 131-135. Used only for the Web Media Manager access setting in
      Blackmagic Camera Setup: enabled over HTTP, or "enabled with security"
      over HTTPS with a username and password; and that the REST API uses the
      web media manager's HTTP access, so enabling one enables the other.

transport:
  type: http
  port: 80
  # "Enabled with security" serves HTTPS with the camera's own certificate
  # (or an imported one) and asks for a login.
  scheme: { setting: scheme }
  accept_invalid_certs: true
  auth: basic
  # 403 means a setting cannot be changed in the current state (p.50-62).
  refusal_status: [401]
  timeout_ms: 4000
  probe: { method: GET, path: /control/api/v1/system/product }

settings:
  scheme: { type: enum, values: [http, https], default: http, label: Scheme, description: "http for the web media manager enabled without security, https when it is enabled with security." }
  username: { type: string, default: "", label: Username, description: "The username set in Blackmagic Camera Setup when the web media manager is enabled with security; empty otherwise." }
  password: { type: string, secret: true, default: "", label: Password, description: "The password set in Blackmagic Camera Setup when the web media manager is enabled with security; empty otherwise." }

ports:
  - { port: 80, protocol: http, role: control }
  - { port: 80, protocol: https, role: control, when: "scheme https" }

