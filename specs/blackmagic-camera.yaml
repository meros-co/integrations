quirks:
  - models: [all]
    severity: critical
    text: >
      The REST API is served by the camera's web media manager, which is off
      until it is enabled in Blackmagic Camera Setup, Network Access (REST API
      document p.2; camera manual, Network Access settings). Enabling the web
      media manager also enables the REST API. Plain "enabled" serves HTTP on
      port 80 with no login. "Enabled with security" serves HTTPS with the
      camera's own or an imported certificate and asks for the username and
      password set there, as in the document's examples
      (https://<camera-name>.local/control/api/v1/): set the scheme setting to
      https, the username and password settings, and open the device on port
      443. The certificate is accepted without verifying who presents it. The
      login scheme is not documented; the core sends Basic and answers a
      Digest challenge if the camera sends one instead.

  - models: [all]
    severity: warning
    text: >
      The document lists compatible cameras (p.2) but not which API groups each
      implements. Endpoints a camera lacks answer 501 (System, ND filter, detail
      sharpening, optical image stabilisation, timeline) or 404, and every
      command is listed for every model except the immersive eye-view commands.
      Livestream, Blackmagic Cloud media pool, timeline playback and immersive
      features depend on the camera's hardware. No firmware minimum is given;
      changing the camera's name in Setup changes its web media manager URL.

  - models: [all]
    severity: warning
    text: >
      Ranges are the camera's own and mostly live: ISO, gain, ND stops and
      shutter values must be one of the get_supported_* lists; iris, zoom and
      focus ranges come from the lens descriptions; white balance and tint
      ranges from their description endpoints; audio gain from the input
      description. The document gives no fixed range for colour correction
      values, playback speed, focus distance or aperture number, so those are
      not limited here and an out-of-range value is refused by the camera
      (400). Normalised values are taken as 0.0 to 1.0 as the audio level
      states. Values are sent as JSON numbers: stops and shutter angles to one
      decimal place, normalised and colour values to three.

  - models: [all]
    severity: warning
    text: >
      The camera pushes changes only through its websocket notification service
      (Notification websocket 1.0.0, p.71-94: subscribe, unsubscribe,
      listSubscriptions and listProperties requests, propertyValueChanged
      events). The document does not give the websocket's URL, so it is not
      opened (the format's telemetry.websocket could carry the subscribe
      requests, but not a guessed path). Without it,
      state is polled every ten seconds, including the first two audio
      channels; per-display monitoring flags, further audio channels, the
      immersive eye view and the off-speed format update only when the
      matching get command is sent. Each battery's level (camera/power
      batteries array) is not in the state.

  - models: [all]
    severity: info
    text: >
      Several PUT bodies document every field as optional: a field left out
      keeps its value ("If omitted, value remains unchanged" for colour
      correction). The single-field commands send only that field. The
      document marks PUT transports/0/stop, PUT transports/0/play, PUT
      transports/0/record, DELETE timelines/0 and POST timelines/0/add
      deprecated; only PUT record (set_recording) is kept, because it is the
      one documented call taking recording false.

  - models: [all]
    severity: warning
    text: >
      Formatting is two calls by design: prepare_format returns a one-time key
      that format_media must send back, with a filesystem from
      get_format_filesystems. The document spells that path both
      doformatSupportedFilesystems (p.35) and doFormatSupportedFilesystems
      (p.37); the endpoint heading's spelling is used. get_active_media answers
      204 with no body when no media is active, which this spec reports as an
      unexpected status.

  - models: [all]
    severity: warning
    text: >
      The document is inconsistent for per-display focus assist: GET returns
      {enabled} and the websocket event carries {enabled}, but PUT
      /monitoring/{displayName}/focusAssist lists mode, color and intensity
      (p.15). set_display_focus_assist therefore takes its body as JSON, such
      as {"enabled": true}. Display names come from get_displays; device names
      from get_working_set; audio channels are numbered from 1 here and sent
      0-based.

  - models: [all]
    severity: info
    text: >
      Clip paths, display names, preset names and custom platform file names
      are percent-encoded as one path segment, so a "/" in a clip path is sent
      as %2F. The document does not say whether the camera expects that for a
      clip in a folder. Preset names for save_preset and delete_preset are not
      said to include the .cset extension; the active preset is reported with
      it. Uploading (POST /presets, multipart with a Content-Disposition
      filename) and downloading (GET /presets/{presetName}, binary) preset
      files are not included.

  - models: [all]
    severity: info
    text: >
      set_custom_platform sends Blackmagic streaming XML. The document gives no
      content type (application/xml is sent), and the format refuses line
      breaks in a string, so the XML must be on one line, as Blackmagic's
      Streaming Encoder REST API document also asks ("Remove any blank lines").
      get_custom_platform returns the XML as text.
