# Analog Way Midra 4K (AWJ): native module crates/core/src/modules/analogway.rs.
# Commands are AWJ get/replace messages on TCP 10606; see the module and the
# guides cited below for the paths each one writes.
spec: 1
id: analogway-midra4k
name: Analog Way Midra 4K (AWJ)
vendor: Analog Way
category: switcher
implementation: native
reason: >-
  AWJ is JSON over TCP with 0x04-terminated messages: answers are matched to reads by path, errors carry no path,
  changes are pushed only after a Subscriptions write repeated on every connection, and writes to a screen's program
  or preview go to the DOWN or UP bank depending on the T-bar position, which has to be read from the device first
  (guide 3.8). The spec format has no session state or reply-dependent sequencing to express this.
source:
- title: Midra 4K AWJ Protocol Programmer's Guide, for firmware version v2.0.20 or higher (version 3.2, September
    2023)
  author: Analog Way
  url: https://dwn01.analogway.com/Site+Internet/Series/Midra+4k/Common/AWJ+Protocol/midra_4k_awj_programmers_guide_v3.2.pdf
  note: >-
    Manufacturer document, 49 pages. 1.1-1.4 (pp.4-6): TCP 10606, five clients, 0x04 terminator, get/replace, errors
    E09-E13, Subscriptions; 2.1-2.7 (pp.7-8): device types EIKOS, PULSE, QMX, QVU, serial, firmware, reboot, standby,
    switch off, wake up; 3.1-3.20 (pp.9-20): screens, xTake, preset/aux preset/master preset recall, labels, layer
    status and source, the DOWN/UP bank and T-bar table, xUpdate, background, foreground, auxiliary source, last
    loaded presets, Quick Preset, screen and layer freeze; 4 (pp.21-23): multiviewer; 5 (pp.24-41): audio routing,
    mutes, Dante, line out; 6 (pp.42-46): inputs, images, background sets, input freeze; 7 (p.47): thumbnails.
- title: Midra 4K REST API Programmer's Guide, for version v2.00.20 or higher (version 2.0, December 2022; file
    v3_0_13)
  author: Analog Way
  url: https://dwn01.analogway.com/Site+Internet/Series/Midra+4k/Common/Rest+API+Programmer's+Guide/midra4k_rest_api_programmers_guide_v3_0_13.pdf
  note: >-
    Manufacturer document, 60 pages (PDF created 2025-06-20). Used for ranges: screens 1-2, auxiliary screen 1,
    layers 1-4, screen presets 1-200, master presets 1-50, multiviewer presets 1-20, inputs 1-10, background sets
    1-8, images 1-4, Dante groups 1-4, line outs 1-2. The REST API is not used: no push, no freeze, and a cookie
    login (section 9).
settings:
  extra_subscriptions:
    type: string
    max_length: 4096
    default: ''
  read_on_connect:
    type: bool
    default: true
ports:
  - { port: 10606, protocol: tcp, role: control }

