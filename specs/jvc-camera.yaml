commands:
  # ── Streaming settings (3.1) ───────────────────────────────────────────
  get_streaming_settings:
    summary: "Read a stream's resolution, frame rate, bitrate, quality, encoding and key frame interval"
    params:
      stream: { type: int, min: 0, max: 1, default: 0, label: Stream, description: "Stream on a KY-PZ400 or KY-PZ200: 0 for the first, 1 for the second; other models have one stream." }
    send:
      - { models: [gy-hm650, gy-hm660, gy-hm8x0, gy-hm200, gy-hm25x, gy-hm280, gy-ls300, ky-pz100, gy-hc900, gy-hc5x0], method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"GetStreamingSettings\",\"SessionID\":{session.id:json}}}" }
      - { models: [ky-pz400, ky-pz200], method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"GetStreamingSettings\",\"SessionID\":{session.id:json},\"Params\":{\"Stream\":{stream}}}}" }
    expect: { status: 200, json_equals: { "$.Response.Result": "Success" }, json_path: "$.Response.Data" }
    returns: value
  set_streaming_resolution:
    summary: "Set the streaming resolution (HM650, HM660 and HM8x0 restart to apply it)"
    params:
      stream: { type: int, min: 0, max: 1, default: 0, label: Stream, description: "Stream on a KY-PZ400 or KY-PZ200: 0 for the first, 1 for the second; other models have one stream." }
      resolution: { type: enum, values: ["3840x2160", "1920x1080", "1440x1080", "1280x720", "1024x576", "720x480", "720x576", "720x408", "640x480", "640x360", "480x320", "480x270", "320x240", "1080x1080", "606x1080", "720x720", "404x720"], required: true, label: Resolution, description: "Streaming resolution; which are available depends on the model and the recording format." }
    send:
      - { models: [gy-hm650, gy-hm660, gy-hm8x0, gy-hm200, gy-hm25x, gy-hm280, gy-ls300, ky-pz100, gy-hc900, gy-hc5x0], method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"SetStreamingResolution\",\"SessionID\":{session.id:json},\"Params\":{\"Resolution\":\"{resolution}\"}}}" }
      - { models: [ky-pz400, ky-pz200], method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"SetStreamingResolution\",\"SessionID\":{session.id:json},\"Params\":{\"Stream\":{stream},\"Resolution\":\"{resolution}\"}}}" }
    expect: { status: 200, json_equals: { "$.Response.Result": "Success" } }
    returns: ack
  set_streaming_frame_rate:
    summary: "Set the streaming frame rate"
    params:
      stream: { type: int, min: 0, max: 1, default: 0, label: Stream, description: "Stream on a KY-PZ400 or KY-PZ200: 0 for the first, 1 for the second; other models have one stream." }
      frame_rate: { type: string, pattern: "^(60p|50p|60i|50i|30p|25p|422_10bit_60p|422_10bit_50p|[1-9]|[1-5][0-9]|60)$", required: true, label: Frame rate, description: "60p, 50p, 60i, 50i, 30p, 25p, 422_10bit_60p or 422_10bit_50p, or a number 1 to 60 on a KY-PZ400 or KY-PZ200." }
    send:
      - { models: [gy-hm660, gy-hm8x0, gy-hm200, gy-hm25x, gy-hm280, gy-ls300, ky-pz100, gy-hc900, gy-hc5x0], method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"SetStreamingFramerate\",\"SessionID\":{session.id:json},\"Params\":{\"Framerate\":\"{frame_rate}\"}}}" }
      - { models: [ky-pz400, ky-pz200], method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"SetStreamingFramerate\",\"SessionID\":{session.id:json},\"Params\":{\"Stream\":{stream},\"Framerate\":\"{frame_rate}\"}}}" }
    expect: { status: 200, json_equals: { "$.Response.Result": "Success" } }
    returns: ack
  set_streaming_bitrate:
    summary: "Set the streaming bitrate (camcorders and KY-PZ100)"
    params:
      bitrate: { type: enum, values: ["0.2M", "0.3M", "0.8M", "1.5M", "2.5M", "3.0M", "5.0M", "8.0M", "10M", "12M", "16M", "20M", "24M"], required: true, label: Bitrate, description: "Streaming bitrate in Mbit/s; which are available depends on the format." }
    send: { method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"SetStreamingBitrate\",\"SessionID\":{session.id:json},\"Params\":{\"Bitrate\":\"{bitrate}\"}}}" }
    expect: { status: 200, json_equals: { "$.Response.Result": "Success" } }
    returns: ack
  set_streaming_bitrate_and_quality:
    summary: "Set a stream's bitrate, MJPEG quality and rate control (KY-PZ400, KY-PZ200; applied after a restart)"
    params:
      stream: { type: int, min: 0, max: 1, default: 0, label: Stream, description: "Stream on a KY-PZ400 or KY-PZ200: 0 for the first, 1 for the second; other models have one stream." }
      kbps: { type: int, min: 32, max: 61440, required: true, label: Bitrate, description: "Bitrate in kbit/s for H.264 and H.265, 32 to 61440." }
      quality: { type: int, min: 1, max: 99, required: true, label: Quality, description: "MJPEG quality factor, 1 to 99." }
      control: { type: enum, values: ["CBR", "VBR"], required: true, label: Rate control, description: "Constant or variable bitrate." }
    send: { method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"SetStreamingBitrate\",\"SessionID\":{session.id:json},\"Params\":{\"Stream\":{stream},\"Bitrate\":\"{kbps}K\",\"Qfactor\":\"{quality}\",\"BitRateControl\":\"{control}\"}}}" }
    expect: { status: 200, json_equals: { "$.Response.Result": "Success" } }
    returns: ack
  get_available_resolutions:
    summary: "List which streaming resolutions can be chosen now"
    params:
      stream: { type: int, min: 0, max: 1, default: 0, label: Stream, description: "Stream on a KY-PZ400 or KY-PZ200: 0 for the first, 1 for the second; other models have one stream." }
    send:
      - { models: [gy-hm650, gy-hm660, gy-hm8x0, gy-hm200, gy-hm25x, gy-hm280, gy-ls300, ky-pz100, gy-hc900, gy-hc5x0], method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"AvailableStreamingResolutionSettings\",\"SessionID\":{session.id:json}}}" }
