    returns: value
  get_return_frame_rates:
    summary: "List which return frame rates go with a recording frame rate"
    params:
      recording: { type: enum, values: ["60p", "50p", "60i", "50i", "30p", "25p"], required: true, label: Recording frame rate, description: "The camera's recording frame rate." }
    send: { method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"AvailableFrameRateOfReturnOverIP\",\"SessionID\":{session.id:json},\"Params\":{\"RecordingFrameRate\":\"{recording}\"}}}" }
    expect: { status: 200, json_equals: { "$.Response.Result": "Success" }, json_path: "$.Response.Data" }
    returns: value
  set_return_rtsp:
    summary: "Set a return-over-IP server setting to RTSP/RTP"
    params:
      server: { type: int, min: 1, max: 4, required: true, label: Server, description: "Streaming server setting, 1 to 4." }
      alias: { type: string, max_length: 64, pattern: "^[^\"\\\\]*$", required: true, label: Alias, description: "Name of the server setting." }
      protocol: { type: enum, values: ["UDP", "TCP"], required: true, label: Protocol, description: "RTP over UDP or TCP." }
      address: { type: string, max_length: 64, pattern: "^[0-9A-Za-z.:-]*$", required: true, label: Address, description: "IP address." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "Port number." }
      stream_id: { type: string, max_length: 64, pattern: "^[^\"\\\\]*$", required: true, label: Stream ID, description: "Stream ID." }
      username: { type: string, max_length: 64, pattern: "^[^\"\\\\]*$", required: true, label: User, description: "RTSP user name." }
      password: { type: string, max_length: 64, pattern: "^[^\"\\\\]*$", required: true, secret: true, label: Password, description: "RTSP password." }
      frame_rate: { type: enum, values: ["60p", "30p", "50p", "25p"], required: true, label: Frame rate, description: "Return video frame rate." }
    send: { method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"SetReturnOverIpServerSettingsRTSP\",\"SessionID\":{session.id:json},\"Params\":{\"ID\":{server:-1},\"Alias\":\"{alias}\",\"Protocol\":\"{protocol}\",\"SrcAddress\":\"{address}\",\"SrcPort\":{port},\"StreamId\":\"{stream_id}\",\"Username\":\"{username}\",\"Password\":\"{password}\",\"FrameRate\":{frame_rate:map.return_frame_rate}}}}" }
    expect: { status: 200, json_equals: { "$.Response.Result": "Success" } }
    returns: ack
  set_return_zixi:
    summary: "Set a return-over-IP server setting to Zixi"
    params:
      server: { type: int, min: 1, max: 4, required: true, label: Server, description: "Streaming server setting, 1 to 4." }
      alias: { type: string, max_length: 64, pattern: "^[^\"\\\\]*$", required: true, label: Alias, description: "Name of the server setting." }
      address: { type: string, max_length: 64, pattern: "^[0-9A-Za-z.:-]*$", required: true, label: Address, description: "IP address." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "Port number." }
      stream_id: { type: string, max_length: 64, pattern: "^[^\"\\\\]*$", required: true, label: Stream ID, description: "Zixi stream ID." }
      password: { type: string, max_length: 64, pattern: "^[^\"\\\\]*$", required: true, secret: true, label: Password, description: "Zixi password." }
      name: { type: string, max_length: 64, pattern: "^[^\"\\\\]*$", required: true, label: Name, description: "Zixi name." }
      latency: { type: enum, values: ["low", "medium", "minimum", "high"], required: true, label: Latency, description: "Zixi latency: low, medium, minimum (Zixi off) or high." }
      frame_rate: { type: enum, values: ["60p", "30p", "50p", "25p"], required: true, label: Frame rate, description: "Return video frame rate." }
    send: { method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"SetReturnOverIpServerSettingsZIXI\",\"SessionID\":{session.id:json},\"Params\":{\"ID\":{server:-1},\"Alias\":\"{alias}\",\"SrcAddress\":\"{address}\",\"SrcPort\":{port},\"StreamId\":\"{stream_id}\",\"Password\":\"{password}\",\"Name\":\"{name}\",\"Latency\":{latency:map.zixi_latency},\"FrameRate\":{frame_rate:map.return_frame_rate}}}}" }
    expect: { status: 200, json_equals: { "$.Response.Result": "Success" } }
    returns: ack
  set_return_icecast:
    summary: "Set a return-over-IP server setting to Icecast"
    params:
      server: { type: int, min: 1, max: 4, required: true, label: Server, description: "Streaming server setting, 1 to 4." }
      alias: { type: string, max_length: 64, pattern: "^[^\"\\\\]*$", required: true, label: Alias, description: "Name of the server setting." }
      address: { type: string, max_length: 64, pattern: "^[0-9A-Za-z.:-]*$", required: true, label: Address, description: "IP address." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "Port number." }
      mountpoint: { type: string, max_length: 64, pattern: "^[^\"\\\\]*$", required: true, label: Mountpoint, description: "Icecast mountpoint." }
    send: { method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"SetReturnOverIpServerSettingsIcecast\",\"SessionID\":{session.id:json},\"Params\":{\"ID\":{server:-1},\"Alias\":\"{alias}\",\"SrcAddress\":\"{address}\",\"SrcPort\":{port},\"Mountpoint\":\"{mountpoint}\"}}}" }
    expect: { status: 200, json_equals: { "$.Response.Result": "Success" } }
    returns: ack
  set_return_srt:
    summary: "Set a return-over-IP server setting to SRT"
    params:
      server: { type: int, min: 1, max: 4, required: true, label: Server, description: "Streaming server setting, 1 to 4." }
      alias: { type: string, max_length: 64, pattern: "^[^\"\\\\]*$", required: true, label: Alias, description: "Name of the server setting." }
      address: { type: string, max_length: 64, pattern: "^[0-9A-Za-z.:-]*$", required: true, label: Address, description: "IP address." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "Port number." }
      mode: { type: enum, values: ["caller", "listener", "rendezvous"], required: true, label: Connection mode, description: "SRT caller, listener or rendezvous." }
      latency: { type: int, min: 20, max: 8000, required: true, label: Latency, description: "SRT latency in milliseconds, 20 to 8000." }
      encryption: { type: bool, required: true, label: Encryption, description: "On encrypts with the passphrase." }
      passphrase: { type: string, max_length: 79, pattern: "^[^\"\\\\]*$", required: true, secret: true, label: Passphrase, description: "SRT passphrase." }
      frame_rate: { type: enum, values: ["60p", "30p", "50p", "25p"], required: true, label: Frame rate, description: "Return video frame rate." }
    send: { method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"SetReturnOverIpServerSettingsSRT\",\"SessionID\":{session.id:json},\"Params\":{\"ID\":{server:-1},\"Alias\":\"{alias}\",\"SrcAddress\":\"{address}\",\"Port\":{port},\"ConnectionMode\":{mode:map.srt_mode},\"Latency\":{latency},\"Encryption\":{encryption:bool01},\"Passphrase\":\"{passphrase}\",\"FrameRate\":{frame_rate:map.return_frame_rate}}}}" }
    expect: { status: 200, json_equals: { "$.Response.Result": "Success" } }
    returns: ack
  start_return:
    summary: "Start return over IP"
    send: { method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"SetReturnOverIpCtrl\",\"SessionID\":{session.id:json},\"Params\":{\"Operate\":\"Start\"}}}" }
    expect: { status: 200, json_equals: { "$.Response.Result": "Success" } }
    returns: ack
  stop_return:
    summary: "Stop return over IP"
    send: { method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"SetReturnOverIpCtrl\",\"SessionID\":{session.id:json},\"Params\":{\"Operate\":\"Stop\"}}}" }
    expect: { status: 200, json_equals: { "$.Response.Result": "Success" } }
    returns: ack

maps:
  on_off: { "true": "On", "false": "Off" }
  enable_disable: { "true": "Enable", "false": "Disable" }
  pcr_mode: { standard: "0", fast: "1" }
  pcr_jitter: { normal: "0", low: "1" }
  zixi_latency: { low: "0", medium: "1", minimum: "2", high: "3" }
  srt_mode: { caller: "0", listener: "1", rendezvous: "2" }
  srt_encryption: { "off": "0", aes128: "1", aes192: "2", aes256: "3" }
  srt_fec: { "off": "0", "10x10": "1", "8x8": "2", "6x6": "3" }
  return_frame_rate: { "60p": "1", "30p": "2", "50p": "4", "25p": "5" }

telemetry:
  # The camera pushes nothing: its status is read every second (the document
  # asks for no more than every 500 ms), the pan/tilt position of a PTZ
  # camera every second, and the settings every 30 s.
  poll:
    - every_ms: 1000
      send:
        - { method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"GetCamStatus\",\"SessionID\":{session.id:json}}}" }
        - { models: [ky-pz100, ky-pz400, ky-pz200], method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"GetPTPosition\",\"SessionID\":{session.id:json}}}" }
    - every_ms: 30000
      send:
        - { method: POST, path: /cgi-bin/api.cgi, content_type: "application/x-www-form-urlencoded; charset=UTF-8", body: "{\"Request\":{\"Command\":\"GetSystemInfo\",\"SessionID\":{session.id:json}}}" }
