quirks:
  - models: [all]
    severity: warning
    text: >
      The client logs in at /api.php with HTTP Digest and the camera answers with a SessionID
      cookie (the document shows a 302); every request then carries it in its JSON body and its
      cookie. A request answered SessionError logs in again and is sent once more. The document
      also says another client cannot connect while one is using the API, so a second controller
      (or the camera's web page) can lock this one out.
  - models: [all]
    severity: info
    text: >
      Many settings are changed by pressing the camera's web buttons (SetWebButtonEvent): the
      result is read back from GetCamStatus every second. Which buttons a model has is the
      document's table; which can be pressed now is buttons.<kind>.<button> in state. Values such
      as iris, gain, shutter and white balance are the camera's display text, not numbers.
  - models: [all]
    severity: info
    text: >
      The document asks that requests hold no spaces or line breaks; the requests here have none of
      their own, but text a command is given (an alias, a URL, a name) is sent as it is. Text holding
      a double quote or a backslash is refused, since the body is not escaped.
  - models: [ky-pz100, ky-pz400, ky-pz200]
    severity: info
    text: >
      On a KY-PZ100 the zoom Tele/Wide and focus Far/Near button events keep moving until a Stop
      event (zoom_button and focus_button with Stop); the KY-PZ400 and KY-PZ200 need it for zoom.
  - models: [all]
    severity: info
    text: >
      save_jpeg_still saves the JPEG still (/cgi-bin/get_jpg.cgi) to a host file, once
      start_jpeg_encoding has started the encoder; stop_jpeg_encoding stops it. Several streaming,
      video, multicast and NDI settings take effect after a restart, and set_streaming_resolution
      restarts a GY-HM650, GY-HM660 or GY-HM8x0.
  - models: [all]
    severity: critical
    text: >
      stop_recording and record_button Stop end a take; stop_streaming ends a live stream; store_preset
      and delete_preset overwrite or remove a stored position; reboot drops the video.
