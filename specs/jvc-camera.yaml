spec: 1
id: jvc-camera
name: JVC camcorders and PTZ cameras (Camcorder Web API)
vendor: JVC
category: camera

# JVC's Camcorder Web API: the client logs in at /api.php with HTTP Digest,
# the camera answers with a SessionID cookie, and every command is a JSON
# request POSTed to /cgi-bin/api.cgi carrying that SessionID. Answers are
# JSON with a Result of Success or an error name. The same API serves the
# GY-HM and GY-HC camcorders and the KY-PZ PTZ cameras; which commands each
# model takes is the document's per-model table.

source:
  - title: JVC Camcorder Web API Reference, Version 1.18
    author: JVC KENWOOD Corporation
    url: https://github.com/bitfocus/companion-module-jvc-ptz/blob/main/docs/JvcCamcorderApiReferenceV118_public.pdf
    note: >
      Manufacturer document marked public, read 2026-10-27 from the copy an integrator's repository
      redistributes. 2 Interface (HTTP on port 80, or the camera's web port; Digest authentication at
      /api.php returning a SessionID cookie; requests POSTed to /cgi-bin/api.cgi as
      {"Request":{"Command","SessionID","Params"}} with no spaces or line breaks; answers
      {"Response":{"Requested","Result","Data"}}, Result Success, DisableError, RequestedError,
      FormatError, CommandError, SessionError, DualExeError or Failed); the per-model support table
      of every command; 3.1 streaming settings, servers and video settings; 3.2 system information,
      preset zoom positions, NTP and SystemRequest; 3.3 GetCamStatus (recommended no more often than
      every 500 ms), SetCamCtrl, SetZoomCtrl, SetStreamingCtrl, SetTallyLampCtrl, SetWebButtonEvent
      (kinds and buttons per model), SetWebSliderEvent, SetWebXYFieldEvent, GetGPSInfo,
      SeesawSwitchOperation; 3.4 SetPTCtrl, JoyStickOperation, ZoomSwitchOperation, SetPTZPreset,
      GetCamStatusMinimum, GetPTPosition; 3.5 JpegEncode and SetJpegEncodeSize; 3.6 IFB; 3.7 studio
      tally (SetStudioTally, SetTallyLampPriority); 3.8 Return over IP.
  - title: companion-module-jvc-ptz (MIT licence)
    author: Bitfocus contributors
    url: https://github.com/bitfocus/companion-module-jvc-ptz
    note: >
      Read for corroboration only (index.js), retrieved 2026-10-27: it logs in with Digest at
      /api.php, takes the SessionID cookie, sends each command with the SessionID in its body, and
      logs in again when a command answers SessionError. No code taken.

transport:
  type: http
  port: 80
  auth: digest
  timeout_ms: 5000
  probe:
    method: POST
    path: /cgi-bin/api.cgi
    content_type: "application/x-www-form-urlencoded; charset=UTF-8"
    body: '{"Request":{"Command":"GetSystemInfo"}}'
  session:
    login: { method: GET, path: /api.php }
    capture: { cookie: SessionID }
    login_status: [302]
    relogin: { json: { "$.Response.Result": "^SessionError$" } }

settings:
  username: { type: string, required: true, max_length: 64, label: Username, description: "The camera's web user name, as set in its network menu." }
  password: { type: string, required: true, secret: true, max_length: 64, label: Password, description: "The camera's web password." }

ports:
  - { port: 80, protocol: http, role: control, note: "the camera's web port, 80 unless changed in its menu" }

