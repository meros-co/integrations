        slots.b.low: { value: "{v58}", map: { "0": false, "1": true } }
        slots.ext.status: "{v59}"
        slots.ext.protect: "{v60}"
        slots.ext.remaining_minutes: "{v61}"
        slots.ext.clips: "{v62}"
        slots.ext.low: { value: "{v63}", map: { "0": false, "1": true } }
        battery.info: "{v64}"
        battery.level: "{v65}"
        battery.value: "{v66}"
        luminance: "{v67}"
        saturation: "{v68}"
        contrast: "{v69}"
        sharpness: "{v70}"
        hue: "{v71}"
        flip: "{v72}"
        mirror: "{v73}"
    - path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetCamStatus\\s*$", "$.Response.Result": "^Success$" }
      json_each: "$.Response.Data.Enable.*.*"
      json: { enabled: "$" }
      state: { "buttons.{^key}.{key}": { value: "{enabled}", map: { "0": false, "1": true } } }
    - path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetCamStatus\\s*$", "$.Response.Result": "^Success$" }
      json_each: "$.Response.Data.ButtonString.*.*"
      json: { name: "$" }
      state: { "button_names.{^key}.{key}": "{name}" }
    - path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetPTPosition\\s*$", "$.Response.Result": "^Success$" }
      json: { pan: "$.Response.Data.Pan", tilt: "$.Response.Data.Tilt" }
      state:
        position.pan: "{pan}"
        position.tilt: "{tilt}"
    - path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetSystemInfo\\s*$", "$.Response.Result": "^Success$" }
      json: { m: "$.Response.Data.Model", d: "$.Response.Data.Destination", a: "$.Response.Data.ApiVersion", s: "$.Response.Data.Serial", r: "$.Response.Data.Resolution", o: "$.Response.Data.Overlay", t: "$.Response.Data.Tagging", z: "$.Response.Data.Zixi", srt: "$.Response.Data.Srt", ka: "$.Response.Data.KA_EN200" }
      state:
        system.model: "{m}"
        system.destination: "{d}"
        system.api_version: "{a}"
        system.serial: "{s}"
        system.recording_resolution: "{r}"
        system.overlay: "{o}"
        system.tagging: "{t}"
        system.zixi: "{z}"
        system.srt: "{srt}"
        system.ka_en200: "{ka}"
    - models: [gy-hm650, gy-hm660, gy-hm8x0, gy-hm200, gy-hm25x, gy-hm280, gy-ls300, ky-pz100, gy-hc900, gy-hc5x0]
      path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetStreamingSettings\\s*$", "$.Response.Result": "^Success$" }
      json: { r: "$.Response.Data.Resolution", f: "$.Response.Data.Framerate", b: "$.Response.Data.Bitrate" }
      state:
        "streams.1.resolution": "{r}"
        "streams.1.frame_rate": "{f}"
        "streams.1.bitrate": "{b}"
    - models: [ky-pz400, ky-pz200]
      path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetStreamingSettings\\s*$", "$.Response.Result": "^Success$" }
      json: { r: "$.Response.Data.Resolution", f: "$.Response.Data.Framerate", b: "$.Response.Data.Bitrate", q: "$.Response.Data.Qfactor", e: "$.Response.Data.EncodeProtocol", i: "$.Response.Data.IKeyFrameInterval", c: "$.Response.Data.BitRateControl", n: "$.Response.Data.Stream" }
      state:
        "streams.{n:+1}.resolution": "{r}"
        "streams.{n:+1}.frame_rate": "{f}"
        "streams.{n:+1}.bitrate": "{b}"
        "streams.{n:+1}.quality": "{q}"
        "streams.{n:+1}.encoding": "{e}"
        "streams.{n:+1}.key_frame_interval": "{i}"
        "streams.{n:+1}.rate_control": "{c}"
    - path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetCurrentStreamingServerID\\s*$", "$.Response.Result": "^Success$" }
      json: { id: "$.Response.Data.ID" }
      state:
        streaming.server: "{id:+1}"
    - path: '^/cgi-bin/api\.cgi$'
      request_match: { "$.Request.Params.ID": "^([0-3])$" }
      json_match: { "$.Response.Requested": "^GetStreamingServerSettings\\s*$", "$.Response.Result": "^Success$" }
      json: { alias: "$.Response.Data.Alias", type: "$.Response.Data.Type", all: "$.Response.Data" }
      state:
        "servers.{1:+1}.alias": "{alias}"
        "servers.{1:+1}.type": "{type}"
        "servers.{1:+1}.settings": "{all}"
    - path: '^/cgi-bin/api\.cgi$'
      request_match: { "$.Request.Params.Type": "^([A-Za-z0-9]+)$" }
      json_match: { "$.Response.Requested": "^GetStreamingServerSettings\\s*$", "$.Response.Result": "^Success$" }
      json: { all: "$.Response.Data" }
      state: { "server_types.{1}": "{all}" }
    - path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetVideoSettings\\s*$", "$.Response.Result": "^Success$" }
      json: { o: "$.Response.Data.Output", f: "$.Response.Data.VideoFormat", e: "$.Response.Data.EncodeLevel" }
      state:
        video.output: "{o}"
        video.format: "{f}"
        video.encode_level: "{e}"
    - path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetPresetZoomPosition\\s*$", "$.Response.Result": "^Success$" }
      json: { a: "$.Response.Data.A", b: "$.Response.Data.B", c: "$.Response.Data.C" }
      state:
        zoom_presets.a: "{a}"
        zoom_presets.b: "{b}"
        zoom_presets.c: "{c}"
    - path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetNTPStatus\\s*$", "$.Response.Result": "^Success$" }
      json: { a: "$.Response.Data.Address", t: "$.Response.Data.TcSync", s: "$.Response.Data.Status" }
      state:
        ntp.server: "{a}"
        ntp.timecode_sync: "{t}"
        ntp.status: "{s}"
    - path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetNTPSettings\\s*$", "$.Response.Result": "^Success$" }
      json: { ts: "$.Response.Data.TimeSync", tz: "$.Response.Data.TimeZone", sa: "$.Response.Data.ServerAddress", ti: "$.Response.Data.TimeInterval", ms: "$.Response.Data.MainTimeShow.Status", ss: "$.Response.Data.SubTimeShow.Status" }
      state:
        ntp.time_sync: { value: "{ts}", map: { "0": false, "1": true } }
        ntp.time_zone: "{tz}"
        ntp.server: "{sa}"
        ntp.interval_minutes: "{ti}"
        ntp.main_time_shown: { value: "{ms}", map: { "0": false, "1": true } }
        ntp.sub_time_shown: { value: "{ss}", map: { "0": false, "1": true } }
    - path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetIFBSettings\\s*$", "$.Response.Result": "^Success$" }
      json: { f: "$.Response.Data.Function", a: "$.Response.Data.Address", p: "$.Response.Data.Port", m: "$.Response.Data.Mountpoint" }
      state:
        ifb.function: "{f}"
        ifb.address: "{a}"
        ifb.port: "{p}"
        ifb.mountpoint: "{m}"
    - path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetCurrentReturnOverIpServerID\\s*$", "$.Response.Result": "^Success$" }
      json: { id: "$.Response.Data.ID" }
      state:
        return_over_ip.server: "{id:+1}"
    - path: '^/cgi-bin/api\.cgi$'
      json_match: { "$.Response.Requested": "^GetGPSInfo\\s*$", "$.Response.Result": "^Success$" }
      json: { a: "$.Response.Data.AntennaLevel", l: "$.Response.Data.Location" }
      state:
        gps.antenna: "{a}"
        gps.location: "{l}"

