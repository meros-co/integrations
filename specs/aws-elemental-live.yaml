spec: 1
id: aws-elemental-live
name: AWS Elemental Live (REST API)
vendor: AWS Elemental
category: other

# An Elemental Live encoder appliance (or a node running its software) on
# the venue network: its REST interface on the web server, under /api. Every
# documented endpoint is a command; documents are XML, as the encoder takes
# and answers them. State follows the live events and their status, the
# input devices and the system's load.

source:
  - title: Elemental Live API and User Guide, applicable to 2.26 and higher releases (Feb 2024)
    author: AWS Elemental
    url: https://docs.aws.amazon.com/elemental-onprem/latest/pdf/live_api.pdf
    note: >
      Manufacturer document (linked from the AWS Elemental Live
      documentation page), retrieved 2026-10-28. Web Services REST
      Interface: requests over HTTPS to https://<server>/api/<endpoint>
      (an /api/v<version> prefix pins the API version), with Accept
      application/xml and, for POST and PUT, Content-Type application/xml;
      validation errors answer <errors><error>...</error></errors>; GET
      with ?clean=true answers XML fit to POST again. Live events: GET,
      POST /live_events (page, per_page up to 100; filter pending, pre,
      post, cancelled, archived, active, complete, running, error); GET,
      PUT (?unlocked=1 restarts a running event; active_input_id or
      active_input_label), DELETE /live_events/<id>; GET /status;
      GET and POST /priority; POST /start (active_input_id or label), /stop,
      /cancel, /archive, /reset, /mute_audio, /unmute_audio,
      /adjust_audio_gain (gain), /rollover_output, /pause_output,
      /unpause_output, /stop_output, /start_output (output_id),
      /pause_output_group, /unpause_output_group, /stop_output_group,
      /start_output_group (group_id or group_name), /stream_metadata,
      /amf_metadata, /update_timing, /cue_point (event_id, splice_time or
      splice_offset, duration; return_offset; cancel_event_id;
      get_current_time), /time_signal (time or offset, descriptors),
      /image_inserter, /motion_image_inserter, /activate_input (input_id or
      input_label, optional utc_time YYYYMMDDThhmmss.fff), /prepare_input
      (utc_time, perpetual, preparation_index 0 or 1, 0xffffffff cancels),
      /playlist; GET, POST /inputs, PUT, DELETE /inputs/<id> and
      /inputs/by_label/<label> (inactive inputs, up to 30); GET /outputs;
      POST /reset_video_buffer_stats, /timed_metadata, /private_metadata,
      /bulk_metadata, /avail_image (uri, username, password),
      /blackout_image (uri); GET /cut_lists[/<output_id>]. Live event
      profiles, schedules, presets and preset categories: GET, POST, GET,
      PUT, DELETE. MPTS: GET, POST /mpts, GET, PUT, DELETE /mpts/<id>, POST
      and DELETE /mpts/<id>/mux (start, stop), GET /mpts/statuses,
      /mpts/<id>/status, /mpts/<id>/stats, and the members. Settings: GET
      /settings (?cluster=true), /network, /mount_points, /firewall, /snmp,
      /authentication, /advanced; POST /settings/advanced, /settings/stop,
      /settings/start. GET /alerts (filter=all), /messages (filter Error,
      Warning, Audit). Devices: GET /devices[/<id>], PUT /devices/<id>
      (name), POST /devices/<id>/preview. GET /system_status.json (cpu
      pct, mem pct, gpu list, status, date, devices, psu_status,
      raid_status). Routers (blackmagic_videohub, miranda_nvision,
      harris_panacea, snell_aurora) with their inputs and outputs. With
      user authentication turned on (configure --config-auth), every
      request carries X-Auth-User, X-Auth-Expires (a Unix time about 30
      seconds ahead) and X-Auth-Key, md5(api_key + md5(path + user +
      api_key + expires)).

transport:
  type: http
  port: 80
  https_port: 443
  scheme: { setting: scheme }
  accept_invalid_certs: true
  auth: none
  headers:
    Accept: application/xml
  timeout_ms: 10000
  # The system status: small, and served while the service runs.
  probe: { method: GET, path: /api/system_status.json }
  # User authentication (configure --config-auth): each request carries
  # X-Auth-User, X-Auth-Expires (30 seconds ahead) and X-Auth-Key,
  # md5(api_key + md5(url + user + api_key + expires)), the url being the
  # request's path without the /api prefix (and any version after it) and
  # without the query.
  sign:
    when_set: api_key
    values:
      expires: { unix_time: 30 }
      url: { text: "{request.path}", remove: "^/api(?:/v[0-9][^/]*)?" }
      inner: { md5: "{url}{settings.username}{settings.api_key}{expires}" }
      key: { md5: "{settings.api_key}{inner}" }
    headers:
      X-Auth-User: "{settings.username}"
      X-Auth-Expires: "{expires}"
      X-Auth-Key: "{key}"

settings:
  scheme: { type: enum, values: [https, http], default: https,
            label: Connection,
            description: "https, as the API guide documents the REST interface, or http where the encoder's web server serves it unencrypted." }
  username: { type: string, default: "", max_length: 128,
              label: User name,
              description: "The encoder user whose API key is set, sent as X-Auth-User when user authentication is on." }
  api_key: { type: string, secret: true, default: "", max_length: 256,
             label: API key,
             description: "That user's API key (Settings > User Profile, Reset API Key); leave it empty while user authentication is off, and no X-Auth headers are sent." }

ports:
  - { port: 443, protocol: https, role: control, when: "scheme https", note: "the encoder's web server, REST interface under /api" }
  - { port: 80, protocol: http, role: control, when: "scheme http" }

models:
  - id: live
    name: AWS Elemental Live (2.26 and later)
    supports: [list_live_events, list_live_events_filtered, get_live_event, get_live_event_clean, get_live_event_status, create_live_event, create_live_event_from_profile, update_live_event, update_live_event_restart, update_live_event_restart_at_input, update_live_event_restart_at_input_label, delete_live_event, get_live_event_priority, set_live_event_priority, start_live_event, stop_live_event, cancel_live_event, archive_live_event, reset_live_event, mute_audio, unmute_audio, reset_video_buffer_stats, start_live_event_at_input, start_live_event_at_input_label, set_audio_gain, rollover_output, pause_output, unpause_output, stop_output, start_output, pause_output_group, pause_output_group_by_name, unpause_output_group, unpause_output_group_by_name, stop_output_group, stop_output_group_by_name, start_output_group, start_output_group_by_name, send_stream_metadata, send_amf_metadata, update_timing, insert_avail, insert_avail_at, return_from_avail, cancel_avail, get_stream_time, insert_time_signal, insert_time_signal_at, image_inserter, motion_image_inserter, activate_input, activate_input_by_label, activate_input_at, prepare_input, prepare_input_custom, set_playlist, list_live_event_inputs, get_live_event_input, add_live_event_input, update_live_event_input, delete_live_event_input, update_live_event_input_by_label, delete_live_event_input_by_label, list_live_event_outputs, insert_timed_metadata, insert_private_metadata, insert_bulk_metadata, set_avail_image, set_avail_image_custom, set_blackout_image, list_cut_lists, get_cut_list, list_live_event_profiles, get_live_event_profile, create_live_event_profile, update_live_event_profile, delete_live_event_profile, list_schedules, get_schedule, create_schedule, update_schedule, delete_schedule, list_presets, get_preset, create_preset, update_preset, delete_preset, list_preset_categories, get_preset_category, create_preset_category, update_preset_category, delete_preset_category, list_mpts, get_mpts, create_mpts, update_mpts, delete_mpts, start_mpts, stop_mpts, get_mpts_statuses, get_mpts_status, get_mpts_stats, list_mpts_members, get_mpts_member, add_mpts_member, update_mpts_member, remove_mpts_member, get_settings, get_settings_cluster, get_network_settings, get_mount_points_settings, get_firewall_settings, get_snmp_settings, get_authentication_settings, get_advanced_settings, update_advanced_settings, stop_service, start_service, list_alerts, list_all_alerts, list_messages, list_messages_filtered, list_devices, get_device, rename_device, preview_device, get_system_status, list_routers, get_router, create_router, update_router, delete_router, list_router_inputs, get_router_input, create_router_input, update_router_input, delete_router_input, list_router_outputs, get_router_output, create_router_output, update_router_output, delete_router_output]
    verification: none
    notes: >
      An encoder with user authentication turned on is reached with the
      username and api_key settings (see quirks).

commands:
  list_live_events:
    summary: "A page of the live events, archived ones left out (GET /live_events)"
    params:
      page: {"type": "int", "min": 1, "default": 1, "label": "Page", "description": "Which page of the list, from 1."}
      per_page: {"type": "int", "min": 1, "max": 100, "default": 100, "label": "Per page", "description": "How many items each page holds, at most 100."}
    send: {"method": "GET", "path": "/api/live_events", "query": {"page": "{page}", "per_page": "{per_page}"}}
    expect: { status: [200, 201] }
    returns: text

  list_live_events_filtered:
    summary: "A page of the live events in one state (GET /live_events?filter)"
    params:
      filter: {"type": "enum", "values": ["pending", "pre", "post", "cancelled", "archived", "active", "complete", "running", "error"], "required": true, "label": "State", "description": "pending, pre (preprocessing), post (postprocessing), cancelled, archived, active (pre, running or post), complete, running or error."}
      page: {"type": "int", "min": 1, "default": 1, "label": "Page", "description": "Which page of the list, from 1."}
      per_page: {"type": "int", "min": 1, "max": 100, "default": 100, "label": "Per page", "description": "How many items each page holds, at most 100."}
    send: {"method": "GET", "path": "/api/live_events", "query": {"filter": "{filter}", "page": "{page}", "per_page": "{per_page}"}}
    expect: { status: [200, 201] }
    returns: text

  get_live_event:
    summary: "One live event with every setting (GET /live_events/<id>)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "GET", "path": "/api/live_events/{event}"}
    expect: { status: [200, 201] }
    returns: text

  get_live_event_clean:
    summary: "One live event as clean XML, fit to POST again as a new event (GET /live_events/<id>?clean=true)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "GET", "path": "/api/live_events/{event}", "query": {"clean": "true"}}
    expect: { status: [200, 201] }
    returns: text

  get_live_event_status:
    summary: "A live event's status without its encoding settings: state, progress, average fps, times, errors and warnings (GET /live_events/<id>/status)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "GET", "path": "/api/live_events/{event}/status"}
    expect: { status: [200, 201] }
    returns: text

  create_live_event:
    summary: "Create a live event from a full live_event document (POST /live_events)"
    params:
      xml: {"type": "string", "pattern": "^\\s*<", "max_length": 10000000, "required": true, "label": "XML", "description": "The live_event as an XML document in the API guide's shape, on one line (line breaks and tabs are refused)."}
    send: {"method": "POST", "path": "/api/live_events", "body": "{xml}", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  create_live_event_from_profile:
    summary: "Create a live event from a live event profile that holds its input (POST /live_events with name and profile)"
    params:
      name: {"type": "string", "pattern": "^[^<>&]+$", "max_length": 256, "required": true, "label": "Name", "description": "The new event's name."}
      profile: {"type": "string", "pattern": "^[A-Za-z0-9_.-]+$", "max_length": 256, "required": true, "label": "Live event profile", "description": "The live event profile's id or permalink."}
    send: {"method": "POST", "path": "/api/live_events", "body": "<live_event><name>{name}</name><profile>{profile}</profile></live_event>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  update_live_event:
    summary: "Change a live event's settings with a live_event document; a running event keeps running on its old settings until restarted (PUT /live_events/<id>)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
      xml: {"type": "string", "pattern": "^\\s*<", "max_length": 10000000, "required": true, "label": "XML", "description": "The live_event as an XML document in the API guide's shape, on one line (line breaks and tabs are refused)."}
    send: {"method": "PUT", "path": "/api/live_events/{event}", "body": "{xml}", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  update_live_event_restart:
    summary: "Change a running live event's settings, stopping and restarting it on them (PUT /live_events/<id>?unlocked=1)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
      xml: {"type": "string", "pattern": "^\\s*<", "max_length": 10000000, "required": true, "label": "XML", "description": "The live_event as an XML document in the API guide's shape, on one line (line breaks and tabs are refused)."}
    send: {"method": "PUT", "path": "/api/live_events/{event}", "query": {"unlocked": "1"}, "body": "{xml}", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  update_live_event_restart_at_input:
    summary: "Change a running live event's settings and restart it at one of its original inputs, by id (PUT ?unlocked=1&active_input_id)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
      xml: {"type": "string", "pattern": "^\\s*<", "max_length": 10000000, "required": true, "label": "XML", "description": "The live_event as an XML document in the API guide's shape, on one line (line breaks and tabs are refused)."}
      input: {"type": "int", "min": 1, "required": true, "label": "Input", "description": "The input's id, from list_live_event_inputs or the event's XML."}
    send: {"method": "PUT", "path": "/api/live_events/{event}", "query": {"unlocked": "1", "active_input_id": "{input}"}, "body": "{xml}", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  update_live_event_restart_at_input_label:
    summary: "Change a running live event's settings and restart it at one of its original inputs, by label (PUT ?unlocked=1&active_input_label)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
      xml: {"type": "string", "pattern": "^\\s*<", "max_length": 10000000, "required": true, "label": "XML", "description": "The live_event as an XML document in the API guide's shape, on one line (line breaks and tabs are refused)."}
      label: {"type": "string", "pattern": "^[^<>&/]+$", "max_length": 256, "required": true, "label": "Input label", "description": "The input's unique label."}
    send: {"method": "PUT", "path": "/api/live_events/{event}", "query": {"unlocked": "1", "active_input_label": "{label}"}, "body": "{xml}", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  delete_live_event:
    summary: "Delete a live event permanently (DELETE /live_events/<id>)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "DELETE", "path": "/api/live_events/{event}"}
    expect: { status: [200, 201, 204] }
    returns: ack

  get_live_event_priority:
    summary: "A live event's priority (GET /live_events/<id>/priority)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "GET", "path": "/api/live_events/{event}/priority"}
    expect: { status: [200, 201] }
    returns: text

  set_live_event_priority:
    summary: "Set a live event's priority (POST /live_events/<id>/priority)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
      priority: {"type": "int", "min": 0, "max": 100, "required": true, "label": "Priority", "description": "The event's priority; a higher one is given resources first."}
    send: {"method": "POST", "path": "/api/live_events/{event}/priority", "body": "<priority>{priority}</priority>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  start_live_event:
    summary: "Start encoding a live event (POST /live_events/<id>/start)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "POST", "path": "/api/live_events/{event}/start", "body": "<start></start>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  stop_live_event:
    summary: "Stop encoding a live event (POST /live_events/<id>/stop)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "POST", "path": "/api/live_events/{event}/stop", "body": "<stop></stop>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  cancel_live_event:
    summary: "Cancel a pending live event (POST /live_events/<id>/cancel)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "POST", "path": "/api/live_events/{event}/cancel", "body": "<cancel></cancel>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  archive_live_event:
    summary: "Archive a live event, which leaves the main list (POST /live_events/<id>/archive)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "POST", "path": "/api/live_events/{event}/archive", "body": "<archive></archive>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  reset_live_event:
    summary: "Reset a live event to pending; use $d$ in archive destinations to keep earlier files (POST /live_events/<id>/reset)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "POST", "path": "/api/live_events/{event}/reset", "body": "<reset></reset>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  mute_audio:
    summary: "Mute a live event's audio (gain -60) (POST /live_events/<id>/mute_audio)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "POST", "path": "/api/live_events/{event}/mute_audio", "body": "<mute_audio></mute_audio>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  unmute_audio:
    summary: "Unmute a live event's audio (gain 0) (POST /live_events/<id>/unmute_audio)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "POST", "path": "/api/live_events/{event}/unmute_audio", "body": "<unmute_audio></unmute_audio>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  reset_video_buffer_stats:
    summary: "Reset a running event's input video buffer statistics (POST /live_events/<id>/reset_video_buffer_stats)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
    send: {"method": "POST", "path": "/api/live_events/{event}/reset_video_buffer_stats", "body": "<reset_video_buffer_stats></reset_video_buffer_stats>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  start_live_event_at_input:
    summary: "Start a live event at one of its original inputs, by id (POST /start?active_input_id)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
      input: {"type": "int", "min": 1, "required": true, "label": "Input", "description": "The input's id, from list_live_event_inputs or the event's XML."}
    send: {"method": "POST", "path": "/api/live_events/{event}/start", "query": {"active_input_id": "{input}"}, "body": "<start></start>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  start_live_event_at_input_label:
    summary: "Start a live event at one of its original inputs, by label (POST /start?active_input_label)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
      label: {"type": "string", "pattern": "^[^<>&/]+$", "max_length": 256, "required": true, "label": "Input label", "description": "The input's unique label."}
    send: {"method": "POST", "path": "/api/live_events/{event}/start", "query": {"active_input_label": "{label}"}, "body": "<start></start>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  set_audio_gain:
    summary: "Set a live event's audio gain (POST /live_events/<id>/adjust_audio_gain)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
      gain: {"type": "int", "min": -60, "max": 60, "required": true, "label": "Gain", "description": "Audio gain in dB, -60 to 60."}
    send: {"method": "POST", "path": "/api/live_events/{event}/adjust_audio_gain", "body": "<gain>{gain}</gain>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  rollover_output:
    summary: "Make a running archive output start a new file (POST /live_events/<id>/rollover_output)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
      output: {"type": "int", "min": 1, "required": true, "label": "Output", "description": "The output's id, from list_live_event_outputs or the event's XML."}
    send: {"method": "POST", "path": "/api/live_events/{event}/rollover_output", "body": "<output_id>{output}</output_id>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  pause_output:
    summary: "Pause a running output (POST /live_events/<id>/pause_output)"
    params:
      event: {"type": "int", "min": 1, "required": true, "label": "Live event", "description": "The live event's id, as the event list and the web interface number it."}
      output: {"type": "int", "min": 1, "required": true, "label": "Output", "description": "The output's id, from list_live_event_outputs or the event's XML."}
    send: {"method": "POST", "path": "/api/live_events/{event}/pause_output", "body": "<output_id>{output}</output_id>", "content_type": "application/xml"}
    expect: { status: [200, 201] }
    returns: text

  unpause_output:
    summary: "Resume a paused output (POST /live_events/<id>/unpause_output)"
    params:
