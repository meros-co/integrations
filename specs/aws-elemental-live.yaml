quirks:
  - models: [all]
    severity: warning
    text: >
      User authentication (off unless turned on with configure
      --config-auth): with the api_key setting set, each request carries
      X-Auth-User (the username setting), X-Auth-Expires (the Unix time 30
      seconds ahead, as AWS recommends) and X-Auth-Key, md5(api_key +
      md5(url + user + api_key + expires)), worked out as the request goes.
      The url is the request's path without its query and without /api (and
      an API version after it, which this spec's paths do not use); AWS's
      hashing page says "minus any query parameters and without any API
      version prefix", and reading /api as that prefix is inferred. The
      encoder's clock must be within the 30 seconds of the host's (both on
      NTP), or every request is answered 401. With the api_key empty no X-Auth
      header is sent, as an encoder with authentication off expects.

  - models: [all]
    severity: info
    text: >
      Documents are XML, given as one-line strings (line breaks and tabs are
      refused) in the API guide's shapes; get_live_event_clean and the
      other gets answer XML to start from. Commands that read or change
      something answer the encoder's XML as text, including the response
      element of cue points, time signals and images, whose errors element
      reports a refusal with HTTP 200; a validation error answers an errors
      document and fails the command. Values put into the small XML bodies
      (names, labels, URIs) may not hold <, > or &.

  - models: [all]
    severity: info
    text: >
      The encoder pushes nothing (its notifications go to e-mail, a web
      callback URL or SNMP traps the consumer receives itself). Every 10
      seconds the core reads every live event (100 a page, each page in
      turn until one is short), the active ones and each active event's
      status, and the system status; every 60 seconds the input devices.
      live_events is replaced whole by each read, so a deleted or archived
      event leaves it; event_status keeps an event's last status until it
      runs again.

  - models: [all]
    severity: critical
    text: >
      stop_live_event, cancel_live_event and stop_output or
      stop_output_group end live output at once; reset_live_event can
      overwrite archive files unless their destination holds $d$;
      update_live_event_restart restarts a running event;
      delete_live_event, delete_live_event_profile, delete_preset and the
      other deletes cannot be undone; stop_service stops the encoder taking
      new events. activate_input switches the program input live.

state:
  live_events.*.name:          { type: string, description: "A live event, keyed by id: its name" }
  live_events.*.status:        { type: string, description: "pending, preprocessing, running, postprocessing, complete, cancelled, error or archived" }
  live_events.*.node_id:       { type: int, description: "The node it runs on (1 unless clustered)" }
  live_events.*.submitted:     { type: string, description: "When it was created, as the encoder writes it" }
  live_events.*.priority:      { type: int, description: "Its priority, when the answer gives it" }
  event_status.*.status:       { type: string, description: "A live event's status as last read, keyed by id" }
  event_status.*.pct_complete: { type: int, unit: "%", description: "Its progress" }
  event_status.*.average_fps:  { type: float, unit: fps, description: "Its average encoding frame rate" }
  event_status.*.start_time:   { type: string, description: "When it started" }
  event_status.*.complete_time: { type: string, description: "When it completed, empty while running" }
  event_status.*.elapsed:      { type: int, unit: s, description: "Time it has run" }
  event_status.*.error_code:   { type: int, description: "Its latest error's code, as the guide's error codes list them" }
  event_status.*.error_message: { type: string, description: "Its latest error's message" }
  event_status.*.error_time:   { type: string, description: "When its latest error was raised" }
  event_status.*.warning_code: { type: int, description: "Its latest warning's code" }
  event_status.*.warning_message: { type: string, description: "Its latest warning's message" }
  system.status:               { type: string, description: "The system's overall status, such as green_status or orange_status" }
  system.cpu_pct:              { type: float, unit: "%", description: "CPU load" }
  system.mem_pct:              { type: float, unit: "%", description: "Memory in use" }
  system.date:                 { type: string, description: "The system's time, as it writes it" }
  system.psu_status:           { type: string, description: "The power supplies' status text" }
  system.raid_status:          { type: string, description: "The RAID's status text" }
  system.gpus.*.pct:           { type: float, unit: "%", description: "A GPU's load, keyed by its number" }
  devices.*.name:              { type: string, description: "An input device (SDI port), keyed by id: the name given to it" }
  devices.*.device_type:       { type: string, description: "The card's type, such as AJA" }
  devices.*.device_number:     { type: int, description: "The port's number on its card" }
  devices.*.node_id:           { type: int, description: "The node it is on" }

telemetry:
  poll:
    - every_ms: 10000
      send:
        - { method: GET, path: /api/live_events, query: { page: "1", per_page: "100" },
            pages: &pages { items: { xml: live_event }, page: page, size: per_page } }
        - { method: GET, path: /api/live_events, query: { filter: active, page: "1", per_page: "100" }, pages: *pages }
        - { method: GET, path: /api/system_status.json }
    - every_ms: 60000
      send:
        - { method: GET, path: /api/devices }
  updates:
    # Every live event, every page joined, whole.
    - path: "^/api/live_events\\?page=1&per_page=100$"
      xml_each: live_event
      replace: live_events
      state:
        "live_events.{id}.name": "{name}"
        "live_events.{id}.status": "{status}"
        "live_events.{id}.node_id": "{node_id}"
        "live_events.{id}.submitted": "{submitted}"
        "live_events.{id}.priority": "{priority}"
    # The active ones have their status read.
    - path: "^/api/live_events\\?filter=active&"
      xml_each: live_event
      then_send:
        - { method: GET, path: "/api/live_events/{id}/status" }
    - path: "^/api/live_events/([0-9]+)(\\?.*)?$"
      xml_each: live_event
      state:
        "live_events.{1}.name": "{name}"
        "live_events.{1}.status": "{status}"
        "live_events.{1}.priority": "{priority}"
    - path: "^/api/live_events/([0-9]+)/status$"
      xml_each: live_event
      state:
        "event_status.{1}.status": "{status}"
        "event_status.{1}.pct_complete": "{pct_complete}"
        "event_status.{1}.average_fps": "{average_fps}"
        "event_status.{1}.start_time": "{start_time}"
        "event_status.{1}.complete_time": "{complete_time}"
        "event_status.{1}.elapsed": "{elapsed}"
    - path: "^/api/live_events/([0-9]+)/status$"
      xml_each: errors/error
      state:
        "event_status.{1}.error_code": "{code}"
        "event_status.{1}.error_message": "{message}"
        "event_status.{1}.error_time": "{created_at}"
    - path: "^/api/live_events/([0-9]+)/status$"
      xml_each: warnings/warning
      state:
        "event_status.{1}.warning_code": "{code}"
        "event_status.{1}.warning_message": "{message}"
    - path: "^/api/live_events/([0-9]+)/priority$"
      xml_each: priority
      state: { "live_events.{1}.priority": "{text}" }

    - path: "^/api/system_status\\.json$"
      json: { status: "$.status", cpu: "$.cpu.pct", mem: "$.mem.pct", date: "$.date", psu: "$.psu_status", raid: "$.raid_status" }
      state:
        system.status: "{status}"
        system.cpu_pct: "{cpu}"
        system.mem_pct: "{mem}"
        system.date: "{date}"
        system.psu_status: "{psu}"
        system.raid_status: "{raid}"
    - path: "^/api/system_status\\.json$"
      json_each: "$.gpu"
      replace: system.gpus
      json: { num: "$.num", pct: "$.pct" }
      state: { "system.gpus.{num}.pct": "{pct}" }

    - path: "^/api/devices$"
      xml_each: device
      replace: devices
      state:
        "devices.{id}.name": "{name}"
        "devices.{id}.device_type": "{device_type}"
        "devices.{id}.device_number": "{device_number}"
        "devices.{id}.node_id": "{node_id}"
    - path: "^/api/devices/([0-9]+)$"
      xml_each: device
      state:
        "devices.{1}.name": "{name}"
        "devices.{1}.device_type": "{device_type}"
        "devices.{1}.device_number": "{device_number}"
        "devices.{1}.node_id": "{node_id}"
