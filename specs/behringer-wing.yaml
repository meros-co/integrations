commands:
  set_channel_fader:
    summary: "Set an input channel's fader level in dB"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
      level_db: { type: float, min: -144.0, max: 10.0, required: true,
        label: Fader level,
        description: "Fader level in dB, from -144 (shown as -oo, off) to +10." }
    send:
      address: "/ch/{channel}/fdr"
      args: [ { value: "{level_db}", type: float } ]
    returns: none

  get_channel_fader:
    summary: "Read an input channel's fader level in dB (-144 is -oo)"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
    send: { address: "/ch/{channel}/fdr" }
    expect: { address: "/ch/{channel}/fdr", arg: 2 }
    returns: value

  mute_channel:
    summary: "Mute or unmute an input channel"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
      muted: { type: bool, default: true,
        label: Mute,
        description: "On mutes, off unmutes." }
    send:
      address: "/ch/{channel}/mute"
      args: [ { value: "{muted:bool01}", type: int } ]
    returns: none

  get_channel_mute:
    summary: "Read an input channel's mute, 1 muted and 0 not"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
    send: { address: "/ch/{channel}/mute" }
    expect: { address: "/ch/{channel}/mute", arg: 2 }
    returns: value

  toggle_channel_mute:
    summary: "Toggle an input channel's mute (the console's -1 toggle)"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
    send:
      address: "/ch/{channel}/mute"
      args: [ { value: "-1", type: int } ]
    returns: none

  set_channel_name:
    summary: "Name an input channel"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
      name: { type: string, max_length: 16, required: true,
        label: Name,
        description: "The input channel's name, up to 16 characters." }
    send:
      address: "/ch/{channel}/name"
      args: [ { value: "{name}", type: string } ]
    returns: none

  get_channel_name:
    summary: "Read an input channel's name. Empty when the strip has not been named."
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
    send: { address: "/ch/{channel}/name" }
    expect: { address: "/ch/{channel}/name", arg: 0 }
    returns: value

  set_channel_color:
    summary: "Set an input channel's colour, 1 to 12"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
      color: { type: int, min: 1, max: 12, required: true,
        label: Colour,
        description: "The console's colour number for the strip, 1 to 12." }
    send:
      address: "/ch/{channel}/col"
      args: [ { value: "{color}", type: int } ]
    returns: none

  get_channel_color:
    summary: "Read an input channel's colour, 1 to 12"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
    send: { address: "/ch/{channel}/col" }
    expect: { address: "/ch/{channel}/col", arg: 2 }
    returns: value

  solo_channel:
    summary: "Solo or unsolo an input channel"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
      soloed: { type: bool, default: true,
        label: Solo,
        description: "On solos, off unsolos." }
    send:
      address: "/ch/{channel}/$solo"
      args: [ { value: "{soloed:bool01}", type: int } ]
    returns: none

  get_channel_solo:
    summary: "Read an input channel's solo switch, 1 soloed and 0 not"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
    send: { address: "/ch/{channel}/$solo" }
    expect: { address: "/ch/{channel}/$solo", arg: 2 }
    returns: value

  set_channel_pan:
    summary: "Set an input channel's pan, -100 to 100"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
      pan: { type: float, min: -100.0, max: 100.0, required: true,
        label: Pan,
        description: "Pan from -100 (fully left) to 100 (fully right), 0 centre." }
    send:
      address: "/ch/{channel}/pan"
      args: [ { value: "{pan}", type: float } ]
    returns: none

  get_channel_pan:
    summary: "Read an input channel's pan, -100 to 100"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
    send: { address: "/ch/{channel}/pan" }
    expect: { address: "/ch/{channel}/pan", arg: 2 }
    returns: value

  set_channel_eq:
    summary: "Switch an input channel's EQ on or off"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
      enabled: { type: bool, default: true,
        label: EQ on,
        description: "On switches the EQ in, off bypasses it." }
    send:
      address: "/ch/{channel}/eq/on"
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  get_channel_eq:
    summary: "Read an input channel's EQ switch, 1 on and 0 off"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
    send: { address: "/ch/{channel}/eq/on" }
    expect: { address: "/ch/{channel}/eq/on", arg: 2 }
    returns: value

  set_channel_eq_low_gain:
    summary: "Set an input channel's EQ low band gain in dB (STD EQ model)"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
      gain_db: { type: float, min: -15.0, max: 15.0, required: true,
        label: Gain,
        description: "Gain of the EQ low band in dB, -15 to +15 (STD EQ model)." }
    send:
      address: "/ch/{channel}/eq/lg"
      args: [ { value: "{gain_db}", type: float } ]
    returns: none

  get_channel_eq_low_gain:
    summary: "Read an input channel's EQ low band gain in dB (STD EQ model)"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
    send: { address: "/ch/{channel}/eq/lg" }
    expect: { address: "/ch/{channel}/eq/lg", arg: 2 }
    returns: value

  set_channel_eq_band_gain:
    summary: "Set the gain in dB of one of an input channel's parametric EQ bands 1-4 (STD EQ model)"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
      band: { type: int, min: 1, max: 4, required: true,
        label: Band,
        description: "Parametric EQ band, 1 to 4, between the low and high bands." }
      gain_db: { type: float, min: -15.0, max: 15.0, required: true,
        label: Gain,
        description: "Gain of the EQ parametric band in dB, -15 to +15 (STD EQ model)." }
    send:
      address: "/ch/{channel}/eq/{band}g"
      args: [ { value: "{gain_db}", type: float } ]
    returns: none

  get_channel_eq_band_gain:
    summary: "Read the gain in dB of one of an input channel's parametric EQ bands 1-4 (STD EQ model)"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
      band: { type: int, min: 1, max: 4, required: true,
        label: Band,
        description: "Parametric EQ band, 1 to 4, between the low and high bands." }
    send: { address: "/ch/{channel}/eq/{band}g" }
    expect: { address: "/ch/{channel}/eq/{band}g", arg: 2 }
    returns: value

  set_channel_eq_high_gain:
    summary: "Set an input channel's EQ high band gain in dB (STD EQ model)"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
      gain_db: { type: float, min: -15.0, max: 15.0, required: true,
