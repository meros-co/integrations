telemetry:
  # /*s makes the console push every parameter change to this client as the
  # same ,s / ,sff / ,sfi triplets a query returns, so one rule per address
  # serves pushes and query replies alike (Remote Protocols p.30). It dies
  # after 10 s unless renewed; renewed every 9.
  subscribe:
    send: ["/*s"]
    every_ms: 9000
  # Current values, asked once on connecting, one at a time (5344 queries):
  # mutes, faders and names of every strip first, then everything else.
  # /*s reports changes only. Explicit, because the format has no loops.
  poll:
    send:
      - "/ch/1/fdr"
      - "/ch/2/fdr"
      - "/ch/3/fdr"
      - "/ch/4/fdr"
      - "/ch/5/fdr"
      - "/ch/6/fdr"
      - "/ch/7/fdr"
      - "/ch/8/fdr"
      - "/ch/9/fdr"
      - "/ch/10/fdr"
      - "/ch/11/fdr"
      - "/ch/12/fdr"
      - "/ch/13/fdr"
      - "/ch/14/fdr"
      - "/ch/15/fdr"
      - "/ch/16/fdr"
      - "/ch/17/fdr"
      - "/ch/18/fdr"
      - "/ch/19/fdr"
      - "/ch/20/fdr"
      - "/ch/21/fdr"
      - "/ch/22/fdr"
      - "/ch/23/fdr"
      - "/ch/24/fdr"
      - "/ch/25/fdr"
      - "/ch/26/fdr"
      - "/ch/27/fdr"
      - "/ch/28/fdr"
      - "/ch/29/fdr"
      - "/ch/30/fdr"
      - "/ch/31/fdr"
