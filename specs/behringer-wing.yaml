  set_channel_gain:
    summary: "Set the preamp gain in dB of the input source an input channel is connected to"
    params:
      channel: { type: int, min: 1, max: 40, required: true,
        label: Channel,
        description: "Input channel, numbered from 1 as on the console (1 to 40)." }
      gain_db: { type: float, min: -3.0, max: 45.5, required: true,
