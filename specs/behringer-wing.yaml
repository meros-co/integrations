spec: 1
id: behringer-wing
name: Behringer WING
vendor: Behringer
category: mixer

source:
  - title: WING Remote Protocols, V3.0.6-27 (firmware 3.0.6-27 and later)
    author: Patrick-Gilles Maillot, published by Music Tribe
    url: https://cdn-media.empowertribe.com/f255e02a7d164692b3ac2aff862cfcad/WING%20Remote%20Protocols%20FW%203.0.6.pdf
    note: >
      Manufacturer-hosted document; page numbers are the printed footers. OSC on
      UDP 2223 with replies to the sender's port (p.16, p.19); the /?
      identification query (p.20); queries without arguments and their ,s /
      ,sff / ,sfi replies (p.19-21); sets, the -1 toggle and the absence of any
      echo (p.22); the /*s subscription, its 10-second life and single
      subscriber (p.16, p.30). Address tree: status (p.32-33), monitor, solo and
      talkback configuration (p.34-38), system settings (p.39), input channels
      (p.47-51), aux inputs (p.52-54), buses (p.55-57), mains (p.59-61),
      matrices (p.62-64), DCAs and mute groups (p.65), the OSC read-only switch
      and scene control through /$ctl/lib (p.88). Tag scopes (p.237).
  - title: Bitfocus Companion, companion-module-behringer-wing
    url: https://github.com/bitfocus/companion-module-behringer-wing
    note: >
      MIT-licensed; cross-check only. Same strip counts on all three models,
      /? for discovery, scene recall as $actionidx then $action GO, a re-query
      after every set because the console does not echo, and sets of the
      $-prefixed solo, talkback, gain and phantom parameters.
  - title: Basin OSC client (backend/app/services/osc/client.py)
    note: >
      Meros. Reads /ch/N/name on UDP 2223. Not yet run against hardware.

transport:
  type: osc-udp
  port: 2223
  timeout_ms: 500
  reply: to-source
  probe: /?

