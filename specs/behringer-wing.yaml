commands:
  set_channel_fader:
    summary: "Set an input channel's fader level in dB"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
      level_db: { type: float, min: -144.0, max: 10.0, required: true }
    send:
      address: "/ch/{channel}/fdr"
      args: [ { value: "{level_db}", type: float } ]
    returns: none

  get_channel_fader:
    summary: "Read an input channel's fader level in dB (-144 is -oo)"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
    send: { address: "/ch/{channel}/fdr" }
    expect: { address: "/ch/{channel}/fdr", arg: 2 }
    returns: value

  mute_channel:
    summary: "Mute or unmute an input channel"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
      muted: { type: bool, default: true }
    send:
      address: "/ch/{channel}/mute"
      args: [ { value: "{muted:bool01}", type: int } ]
    returns: none

  get_channel_mute:
    summary: "Read an input channel's mute, 1 muted and 0 not"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
    send: { address: "/ch/{channel}/mute" }
    expect: { address: "/ch/{channel}/mute", arg: 2 }
    returns: value

  toggle_channel_mute:
    summary: "Toggle an input channel's mute (the console's -1 toggle)"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
    send:
      address: "/ch/{channel}/mute"
      args: [ { value: "-1", type: int } ]
    returns: none

  set_channel_name:
    summary: "Name an input channel"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
      name: { type: string, max_length: 16, required: true }
    send:
      address: "/ch/{channel}/name"
      args: [ { value: "{name}", type: string } ]
    returns: none

  get_channel_name:
    summary: "Read an input channel's name. Empty when the strip has not been named."
    params:
      channel: { type: int, min: 1, max: 40, required: true }
    send: { address: "/ch/{channel}/name" }
    expect: { address: "/ch/{channel}/name", arg: 0 }
    returns: value

  set_channel_color:
    summary: "Set an input channel's colour, 1 to 12"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
      color: { type: int, min: 1, max: 12, required: true }
    send:
      address: "/ch/{channel}/col"
      args: [ { value: "{color}", type: int } ]
    returns: none

  get_channel_color:
    summary: "Read an input channel's colour, 1 to 12"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
    send: { address: "/ch/{channel}/col" }
    expect: { address: "/ch/{channel}/col", arg: 2 }
    returns: value

  solo_channel:
    summary: "Solo or unsolo an input channel"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
      soloed: { type: bool, default: true }
    send:
      address: "/ch/{channel}/$solo"
      args: [ { value: "{soloed:bool01}", type: int } ]
    returns: none

  get_channel_solo:
    summary: "Read an input channel's solo switch, 1 soloed and 0 not"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
    send: { address: "/ch/{channel}/$solo" }
    expect: { address: "/ch/{channel}/$solo", arg: 2 }
    returns: value

  set_channel_pan:
    summary: "Set an input channel's pan, -100 to 100"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
      pan: { type: float, min: -100.0, max: 100.0, required: true }
    send:
      address: "/ch/{channel}/pan"
      args: [ { value: "{pan}", type: float } ]
    returns: none

  get_channel_pan:
    summary: "Read an input channel's pan, -100 to 100"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
    send: { address: "/ch/{channel}/pan" }
    expect: { address: "/ch/{channel}/pan", arg: 2 }
    returns: value

  set_channel_eq:
    summary: "Switch an input channel's EQ on or off"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
      enabled: { type: bool, default: true }
    send:
      address: "/ch/{channel}/eq/on"
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  get_channel_eq:
    summary: "Read an input channel's EQ switch, 1 on and 0 off"
    params:
      channel: { type: int, min: 1, max: 40, required: true }
    send: { address: "/ch/{channel}/eq/on" }
    expect: { address: "/ch/{channel}/eq/on", arg: 2 }
    returns: value

  set_channel_eq_low_gain:
