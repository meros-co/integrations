  recall_scene:
    summary: "Load a scene of the open show by its number in the show's scene list. A show must be open on the console."
    params:
      scene: { type: int, min: 1, max: 16384, required: true }
    send:
      - { address: "/$ctl/lib/$actionidx", args: [ { value: "{scene}", type: int } ] }
      - { address: "/$ctl/lib/$action", args: [ { value: "GO", type: string } ] }
    returns: none

  recall_scene_by_tag:
    summary: "Load the scene of the open show that carries this tag number (GOTAG). A show must be open."
    params:
      tag: { type: int, min: 1, max: 16384, required: true }
    send:
      - { address: "/$ctl/lib/$actionidx", args: [ { value: "{tag}", type: int } ] }
      - { address: "/$ctl/lib/$action", args: [ { value: "GOTAG", type: string } ] }
    returns: none

  select_next_scene:
    summary: "Move the show's scene selection to the next scene without loading it ($actionidx 0, then NEXT)"
    send:
      - { address: "/$ctl/lib/$actionidx", args: [ { value: "0", type: int } ] }
      - { address: "/$ctl/lib/$action", args: [ { value: "NEXT", type: string } ] }
    returns: none

  select_previous_scene:
    summary: "Move the show's scene selection to the previous scene without loading it ($actionidx 0, then PREV)"
    send:
      - { address: "/$ctl/lib/$actionidx", args: [ { value: "0", type: int } ] }
      - { address: "/$ctl/lib/$action", args: [ { value: "PREV", type: string } ] }
    returns: none

  go_scene:
    summary: "Load the scene the show's selection points to (GO)"
    send:
      address: "/$ctl/lib/$action"
      args: [ { value: "GO", type: string } ]
    returns: none

  go_next_scene:
    summary: "Send the show control action GONEXT"
    send:
      address: "/$ctl/lib/$action"
      args: [ { value: "GONEXT", type: string } ]
    returns: none

  go_previous_scene:
    summary: "Send the show control action GOPREV"
    send:
      address: "/$ctl/lib/$action"
      args: [ { value: "GOPREV", type: string } ]
    returns: none

  get_active_scene:
    summary: "Read the number of the scene loaded from the open show, 0 for none"
