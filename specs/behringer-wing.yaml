quirks:
  - models: [all]
    severity: warning
    text: >
      The console does not echo a set (Remote Protocols p.22), so sets report
      unverified. Read the value back with the matching get command, or watch
      the state, to confirm it.

  - models: [all]
    severity: critical
    text: >
      Only one OSC subscription exists on a console, and it goes to whichever
      client asked last (Remote Protocols p.16, p.30). The core subscribes with
      /*s on connecting and renews every 9 seconds, because a subscription dies
      after 10. Companion or any other client that also subscribes takes the
      pushed changes away from the core, and the core takes them back at its
      next renewal; while another client holds it, state changes made at the
      console are not seen. Queries and sets are unaffected.

  - models: [all]
    severity: info
    text: >
      The core subscribes with /*s rather than /*S. Both are documented (p.30);
      /*s pushes each change as the same ,s / ,sff / ,sfi triplet a query
      returns, so one telemetry rule reads a pushed change and a query reply
      alike. /*S would push a single native-typed argument instead.

  - models: [all]
    severity: info
    text: >
      On connecting the core asks for the current value of every parameter it
      tracks, one query at a time, mutes, faders and names of every strip first:
      several thousand queries, paced by the console's replies. Commands go
      ahead of these queries.

  - models: [all]
    severity: info
    text: >
      Fader and send levels are dB, from -144 (shown as -oo) to +10, in 1024
      steps. A query answers with the display text, the raw 0-1 position and the
      dB value; the get commands and the state hold the dB value. The raw
      position is not linear in dB.

  - models: [all]
    severity: info
    text: >
      A strip's name is empty until someone names it. The console may still
      display a name taken from the linked input source; that is the read-only
      /ch/N/$name, which these commands do not read.

  - models: [all]
    severity: info
    text: >
      The toggle commands send -1 to a 0/1 switch, which the console flips
      (p.22). The core does not know the result until the change is pushed or
      queried.

  - models: [all]
    severity: info
    text: >
      Solo, talkback on, the monitor level, solo dim and mono, and input gain
      and phantom are $-prefixed parameters. The document marks most $
      parameters read-only but does not mark these; Companion sets them.

  - models: [all]
    severity: warning
    text: >
      A channel's or aux's gain and phantom power belong to the input source it
      is connected to, so they change that source for every strip using it. The
      gain range depends on the source type: the document gives -2.5 to 45 and
      -3 to 45.5 dB for channels, -3 to 45 for auxes (p.47, p.52). What a source
      without a preamp does with these sets is not documented.

  - models: [all]
    severity: info
    text: >
      EQ band gains are the STD EQ model's parameters (lg, 1g..4g or 1g..6g,
      hg). Other EQ models use other parameters (p.49 footnote 23); with one of
      those selected, these addresses do not apply. Channels and auxes have four
      parametric bands, buses, mains and matrices six.

  - models: [all]
    severity: warning
    text: >
      DCA assignment is carried in a strip's tag string: tags #D1 to #D16 are
      reserved for DCAs 1-16 (p.51 footnote 27 and the matching footnotes for
      aux, bus, main and matrix). Setting tags replaces the whole string, so
      read it first and keep the other tags. The document does not give the
      separator between tags. Mute group assignment is also held as tags (p.237,
      "DCA, Mute, Talk Tags") but its tag names are not documented, so no mute
      group assignment command is offered.

  - models: [all]
    severity: info
    text: >
      A bus cannot send to itself; enabling /bus/N/send/N is ignored (p.57
      footnote 33).

  - models: [wing-rack]
    severity: info
    text: >
      The document gives a channel's main sends as 1..4, with a footnote that
      it is 1..8 on WING Rack, used for the four stereo headphone outputs on its
      back (p.50 footnote 26). The main send commands here accept 1-4 only.

  - models: [wing]
    severity: info
    text: >
      The monitor level (/cfg/mon/N/$lvl) is read-only on the full-size WING,
      which has a physical control for it, and settable on models without that
      control (p.34 footnote 13). The document does not name those models;
      set_monitor_level is listed for WING Compact and WING Rack.

  - models: [all]
    severity: warning
    text: >
      Scene commands need a show open on the console. recall_scene loads the
      scene at that position in the show's scene list by setting
      /$ctl/lib/$actionidx and sending GO; recall_scene_by_tag sends GOTAG.
      NEXT and PREV only move the selection, and need $actionidx 0, which
      select_next_scene and select_previous_scene send first (p.88 footnote
      74). GONEXT and GOPREV are listed without further description. With no
      show open nothing happens, and the console gives no reply either way.
      $scenes returns only the first scene name over plain OSC (footnote 72),
      so the scene list is not offered.

  - models: [all]
    severity: info
    text: >
      /$ctl/OSC/ronly on the console makes OSC read-only (p.88). Sets are then
      ignored; the document does not say whether an error is returned.
      get_osc_read_only reads the switch.

  - models: [all]
    severity: info
    text: >
      Port 2222 carries the console's native binary protocol and discovery
      (send the five bytes WING? for an ASCII reply). The /? query here returns
      the same identification string over OSC. The X32's /xinfo and /xremote do
      not exist on the WING. Open connections time out after 10 seconds without
      traffic (p.16), which the 9-second subscription renewal prevents.

  - models: [all]
    severity: info
    text: >
      Addresses are from the document for firmware 3.0.6-27 and later. OSC
      bundles are not supported, ? and * in addresses are not wildcards, and a
      UDP packet is at most 32 KB (p.19, p.23).

  - models: [all]
    severity: info
    text: >
      Any parameter in the document's command lists can be set and read by its
      address: set_parameter_float, set_parameter_int and set_parameter_string
      send one argument of that type, which the console converts to the
      parameter's own (p.22); get_parameter reads the display text, and
      get_parameter_value and get_parameter_raw the value and the 0-1 position
      of a float or int. Every parameter the console reports, by the /*s
      subscription or in reply to a query, is also kept under params, keyed by
      its address without the leading / (params["ch/1/fdr"]): text always, raw and float
      for a ,sff reply, raw and int for a ,sfi reply. The format cannot turn
      the address's / into nested keys, so the address is one key. These sets
      are not echoed either, and [RO] parameters ignore them.

  - models: [all]
    severity: warning
    text: >
      set_node sets several parameters in one message (p.23-24). The console
      answers on the node's address followed by * (/ch/1*, or /* for the root)
      with OK, or with NODE NOT FOUND, VALUE ERROR, BUFFER OVERFLOW, NODE IS
      NOT PAR, INCOMPLETE DATA or STACK EMPTY, which fail the command. A node
      too large for one 32 KB UDP packet is answered with an error instead of
      its contents (p.23); get_node lists only the children's names.

  - models: [all]
    severity: info
    text: >
      EQ band frequency, Q and type, the low and high band types, mix
      and tilt are the STD model's parameters, in their own units (Hz,
      dB, %), as the console takes and reports them (p.49). With another
      EQ model selected (eq_model), the console's EQ node holds that
      model's parameters instead and these addresses do not apply; the
      generic params state still keeps whatever the console reports.
      Channels' and auxes' low and high bands are PEQ or shelving (auxes
      also CUT); buses, mains and matrices also take crossover filters
      (BW, BS, LR families) and have a tilt. The channels' 3-band
      pre-send EQ (peq) shapes only the sends.

  - models: [all]
    severity: info
    text: >
      Dynamics and gate parameters other than the model are those of the
      console's own COMP compressor and GATE models (p.48-50); another
      model has its own parameters (Appendix), which these addresses do
      not reach and which the generic params state keeps. The document
      gives an input channel's compressor ratio as a list of texts (1.1
      to 100) and a bus's, main's or matrix's as a float 1.1 to 100
      (p.50, p.56); the commands follow it, and state keeps the
      channel's ratio as its text (dynamics.ratio) and the others' as a
      number (dynamics.ratio_value). Aux inputs carry a PSE/LA combo
      instead of a compressor, with threshold, depth, fast, peak, input
      gain, peak reduction and mode (p.53). The side-chain EQ is not
      available with the combo model (CMB) in the dynamics slot. The
      document lists the gate side-chain source as SHELF or CH.1-CH.40
      (p.49), while its own node dump of a channel shows src=SELF
      (p.25); SELF is used.

