  set_parameter_float:
    summary: "Set any parameter by its OSC address to a float (,f); the console converts it to the parameter's own type (p.22)"
    params:
      path: { type: string, max_length: 128, pattern: '^[A-Za-z0-9$#_-][A-Za-z0-9$#_/-]*$', required: true,
        label: Address,
        description: "The parameter's OSC address from the Remote Protocols command lists without its leading /, such as ch/1/fdr, or its native hash as #f50f69f8." }
      value: { type: float, required: true,
        label: Value,
        description: "The value in the parameter's own unit as the command lists give it, such as dB for a fader." }
    send:
      address: "/{path}"
      args: [ { value: "{value}", type: float } ]
    returns: none

  set_parameter_int:
    summary: "Set any parameter by its OSC address to an int (,i): a switch, an integer or an enumeration's index; -1 toggles a 0/1 switch (p.22)"
    params:
      path: { type: string, max_length: 128, pattern: '^[A-Za-z0-9$#_-][A-Za-z0-9$#_/-]*$', required: true,
        label: Address,
        description: "The parameter's OSC address from the Remote Protocols command lists without its leading /, such as ch/1/fdr, or its native hash as #f50f69f8." }
      value: { type: int, required: true,
        label: Value,
        description: "The integer value, an enumeration's index in its list counted from 0, or -1 to toggle a 0/1 switch." }
    send:
      address: "/{path}"
      args: [ { value: "{value}", type: int } ]
    returns: none

  set_parameter_string:
    summary: "Set any parameter by its OSC address to a string (,s): a name, an enumeration's value, or a number as text (p.22)"
    params:
      path: { type: string, max_length: 128, pattern: '^[A-Za-z0-9$#_-][A-Za-z0-9$#_/-]*$', required: true,
        label: Address,
        description: "The parameter's OSC address from the Remote Protocols command lists without its leading /, such as ch/1/fdr, or its native hash as #f50f69f8." }
      value: { type: string, max_length: 128, required: true,
        label: Value,
        description: "The value as text, such as a name, an enumeration's value like FX, or a number like -2." }
    send:
      address: "/{path}"
      args: [ { value: "{value}", type: string } ]
    returns: none

  get_parameter:
    summary: "Read any parameter by its OSC address as the console's display text, which every parameter type has (p.21)"
    params:
      path: { type: string, max_length: 128, pattern: '^[A-Za-z0-9$#_-][A-Za-z0-9$#_/-]*$', required: true,
        label: Address,
        description: "The parameter's OSC address from the Remote Protocols command lists without its leading /, such as ch/1/fdr, or its native hash as #f50f69f8." }
    send: { address: "/{path}" }
    expect: { address: "/{path}", arg: 0 }
    returns: value

  get_parameter_value:
    summary: "Read a float or int parameter's value by its OSC address, the third value of its ,sff or ,sfi reply (p.21); empty for a string"
    params:
      path: { type: string, max_length: 128, pattern: '^[A-Za-z0-9$#_-][A-Za-z0-9$#_/-]*$', required: true,
        label: Address,
        description: "The parameter's OSC address from the Remote Protocols command lists without its leading /, such as ch/1/fdr, or its native hash as #f50f69f8." }
    send: { address: "/{path}" }
    expect: { address: "/{path}", arg: 2 }
    returns: value

  get_parameter_raw:
    summary: "Read a float or int parameter's raw 0-1 position by its OSC address, the second value of its ,sff or ,sfi reply (p.21); empty for a string"
    params:
      path: { type: string, max_length: 128, pattern: '^[A-Za-z0-9$#_-][A-Za-z0-9$#_/-]*$', required: true,
        label: Address,
        description: "The parameter's OSC address from the Remote Protocols command lists without its leading /, such as ch/1/fdr, or its native hash as #f50f69f8." }
    send: { address: "/{path}" }
    expect: { address: "/{path}", arg: 1 }
    returns: value

  get_node:
    summary: "List a node's children by its OSC address (empty for the root): the reply's strings as a JSON array, such as [\"mode\",\"name\",\"$fname\"] (p.20, p.22)"
    params:
      node: { type: string, max_length: 128, pattern: '^[A-Za-z0-9$_/-]*$', default: "",
        label: Node,
        description: "The node's OSC address without its leading /, such as ch/1 or $ctl/user/1/1/enc; empty for the root." }
    send: { address: "/{node}" }
    expect: { address: "/{node}" }
    returns: text

  set_node:
    summary: "Set several parameters under a node in one message, as name=value pairs separated by commas (ch/1 with \"fdr=4,mute=1\"); answered OK or an error such as NODE NOT FOUND (p.23-24)"
    params:
      node: { type: string, max_length: 128, pattern: '^[A-Za-z0-9$_/-]*$', default: "",
        label: Node,
        description: "The node the names are relative to, without its leading /, such as ch/1; empty for the root of the parameter tree." }
      assignments: { type: string, max_length: 1024, required: true,
        label: Assignments,
        description: "name=value pairs separated by commas, where a . moves down the tree and a leading / returns to the root, such as fdr=4,mute=1 or /ch.1.fdr=-1,mute=0,.2.fdr=0." }
    send:
      address: "/{node}"
      args: [ { value: "{assignments}", type: string } ]
    expect: { address: "/{node}*", matches: '^\["OK"\]$' }
    returns: ack

