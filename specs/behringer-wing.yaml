    returns: none

  mute_dca:
    summary: Mute or unmute a DCA
    params:
      dca: { type: int, min: 1, max: 16, required: true }
      muted: { type: bool, default: true }
    send:
      address: /dca/{dca}/mute
      args: [ { value: "{muted:bool01}", type: int } ]
    returns: none

  get_dca_name:
    summary: Read a DCA's name. Empty when the strip has not been named.
    params:
      dca: { type: int, min: 1, max: 16, required: true }
    send: { address: "/dca/{dca}/name" }
    expect: { address: "/dca/{dca}/name", arg: 0 }
    returns: value

  set_dca_name:
    summary: Name a DCA
    params:
      dca: { type: int, min: 1, max: 16, required: true }
      name: { type: string, max_length: 8, required: true }
    send:
      address: /dca/{dca}/name
      args: [ { value: "{name}", type: string } ]
    returns: none

  get_channel_fader:
    summary: Read an input channel's fader level in dB (-144 is -oo)
    params:
      channel: { type: int, min: 1, max: 40, required: true }
    send: { address: "/ch/{channel}/fdr" }
    expect: { address: "/ch/{channel}/fdr", arg: 2 }
    returns: value

  get_channel_mute:
    summary: Read an input channel's mute, 1 muted and 0 not
    params:
      channel: { type: int, min: 1, max: 40, required: true }
    send: { address: "/ch/{channel}/mute" }
    expect: { address: "/ch/{channel}/mute", arg: 2 }
    returns: value

  mute_group:
    summary: Mute or unmute a mute group
    params:
      group: { type: int, min: 1, max: 8, required: true }
      muted: { type: bool, default: true }
    send:
      address: /mgrp/{group}/mute
      args: [ { value: "{muted:bool01}", type: int } ]
    returns: none

  recall_scene:
    summary: >
      Load a scene of the open show by its number in the show's scene list.
      A show must be open on the console.
    params:
      scene: { type: int, min: 1, max: 16384, required: true }
    send:
      - { address: "/$ctl/lib/$actionidx", args: [ { value: "{scene}", type: int } ] }
      - { address: "/$ctl/lib/$action", args: [ { value: "GO", type: string } ] }
    returns: none

  get_console_info:
    summary: >
      The console's identification string: WING,<ip>,<name>,<model>,<serial>,<firmware>
    send: { address: "/?" }
    expect: { address: "/?", arg: 0 }
    returns: value

quirks:
  - models: [all]
    severity: warning
    text: >
      The console does not echo a set (Remote Protocols p.22), so sets report
      unverified. Read the value back with the matching get command to confirm
      it.

  - models: [all]
    severity: info
    text: >
      Fader values are dB, from -144 (shown as -oo) to +10, in 1024 steps. A
      query answers with the display text, the raw 0-1 position and the dB
      value; the get commands return the dB value. The raw position is not
      linear in dB.

  - models: [all]
    severity: info
    text: >
      A strip's name is empty until someone names it. The console may still
      display a name taken from the linked input source; that is the read-only
      /ch/N/$name, which these commands do not read.

  - models: [all]
    severity: warning
    text: >
      Only one OSC subscription exists on a console, and it goes to whichever
      client asked last (Remote Protocols p.16, p.30). The core does not
      subscribe, so it does not take the subscription from Companion or any
      other client. Queries and sets are unaffected.

  - models: [all]
    severity: warning
    text: >
      recall_scene loads the scene at that position in the open show's scene
      list, by setting /$ctl/lib/$actionidx and then sending GO. With no show
      open nothing is recalled, and the console gives no reply either way.

  - models: [all]
    severity: info
    text: >
      /$ctl/OSC/ronly on the console makes OSC read-only. Sets are then ignored;
      the document does not say whether an error is returned.

  - models: [all]
    severity: info
    text: >
      Port 2222 carries the console's native binary protocol and discovery
      (send the five bytes WING? for an ASCII reply). The /? query here returns
      the same identification string over OSC. The X32's /xinfo and /xremote do
      not exist on the WING.
