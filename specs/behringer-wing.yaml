    params:
      aux: { type: int, min: 1, max: 8, required: true }
    send: { address: "/aux/{aux}/name" }
    expect: { address: "/aux/{aux}/name", arg: 0 }
    returns: value

  set_aux_name:
    summary: Name an aux input
    params:
      aux: { type: int, min: 1, max: 8, required: true }
      name: { type: string, max_length: 16, required: true }
