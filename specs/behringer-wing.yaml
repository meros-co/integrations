spec: 1
id: behringer-wing
name: Behringer WING
vendor: Behringer
category: mixer

source:
  - title: WING Remote Protocols, V3.0.6-27 (firmware 3.0.6-27 and later)
    author: Patrick-Gilles Maillot, published by Music Tribe
    url: https://cdn-media.empowertribe.com/f255e02a7d164692b3ac2aff862cfcad/WING%20Remote%20Protocols%20FW%203.0.6.pdf
    note: >
      Manufacturer-hosted document. OSC on UDP 2223 with replies to the sender's
      port (p.16, p.19); queries without arguments and their ,s / ,sff / ,sfi
      replies (p.19-21); sets and the absence of any echo (p.22); the address
      tree and its ranges (p.47-66); scene recall through /$ctl/lib (p.88); the
      /? identification query (p.20).
  - title: Bitfocus Companion, companion-module-behringer-wing
    url: https://github.com/bitfocus/companion-module-behringer-wing
    note: >
      MIT-licensed; cross-check only. Same strip counts on all three models,
      /? for discovery, scene recall as $actionidx then $action GO, and a
      re-query after every set because the console does not echo.
  - title: Basin OSC client (backend/app/services/osc/client.py)
    note: >
      Meros. Reads /ch/N/name on UDP 2223. Not yet run against hardware.

transport:
  type: osc-udp
  port: 2223
  timeout_ms: 500
  reply: to-source
  probe: /?

models:
  - id: wing
    name: Behringer WING
    channels: 40
    supports: [set_channel_fader, mute_channel, get_channel_name, set_channel_name,
               set_aux_fader, mute_aux, get_aux_name, set_aux_name, set_bus_fader,
               mute_bus, get_bus_name, set_bus_name, set_main_fader, mute_main,
               get_main_name, set_main_name, set_matrix_fader, mute_matrix,
               get_matrix_name, set_matrix_name, set_dca_fader, mute_dca, get_dca_name,
               set_dca_name, get_channel_fader, get_channel_mute, mute_group,
               recall_scene, get_console_info]
    verification: none
  - id: wing-compact
    name: Behringer WING Compact
    channels: 40
    supports: [set_channel_fader, mute_channel, get_channel_name, set_channel_name,
               set_aux_fader, mute_aux, get_aux_name, set_aux_name, set_bus_fader,
               mute_bus, get_bus_name, set_bus_name, set_main_fader, mute_main,
               get_main_name, set_main_name, set_matrix_fader, mute_matrix,
               get_matrix_name, set_matrix_name, set_dca_fader, mute_dca, get_dca_name,
               set_dca_name, get_channel_fader, get_channel_mute, mute_group,
               recall_scene, get_console_info]
    verification: none
  - id: wing-rack
    name: Behringer WING Rack
    channels: 40
    supports: [set_channel_fader, mute_channel, get_channel_name, set_channel_name,
               set_aux_fader, mute_aux, get_aux_name, set_aux_name, set_bus_fader,
               mute_bus, get_bus_name, set_bus_name, set_main_fader, mute_main,
               get_main_name, set_main_name, set_matrix_fader, mute_matrix,
               get_matrix_name, set_matrix_name, set_dca_fader, mute_dca, get_dca_name,
               set_dca_name, get_channel_fader, get_channel_mute, mute_group,
               recall_scene, get_console_info]
    verification: none

commands:
  set_channel_fader:
    summary: Set an input channel's fader level in dB
    params:
      channel: { type: int, min: 1, max: 40, required: true }
      level_db: { type: float, min: -144.0, max: 10.0, required: true }
    send:
      address: /ch/{channel}/fdr
      args: [ { value: "{level_db}", type: float } ]
    returns: none

  mute_channel:
    summary: Mute or unmute an input channel
    params:
      channel: { type: int, min: 1, max: 40, required: true }
      muted: { type: bool, default: true }
    send:
      address: /ch/{channel}/mute
      args: [ { value: "{muted:bool01}", type: int } ]
    returns: none

  get_channel_name:
    summary: Read an input channel's name. Empty when the strip has not been named.
    params:
      channel: { type: int, min: 1, max: 40, required: true }
    send: { address: "/ch/{channel}/name" }
    expect: { address: "/ch/{channel}/name", arg: 0 }
    returns: value

  set_channel_name:
    summary: Name an input channel
    params:
      channel: { type: int, min: 1, max: 40, required: true }
      name: { type: string, max_length: 16, required: true }
    send:
      address: /ch/{channel}/name
      args: [ { value: "{name}", type: string } ]
    returns: none

  set_aux_fader:
    summary: Set an aux input's fader level in dB
    params:
      aux: { type: int, min: 1, max: 8, required: true }
      level_db: { type: float, min: -144.0, max: 10.0, required: true }
    send:
      address: /aux/{aux}/fdr
      args: [ { value: "{level_db}", type: float } ]
    returns: none

  mute_aux:
    summary: Mute or unmute an aux input
    params:
      aux: { type: int, min: 1, max: 8, required: true }
      muted: { type: bool, default: true }
    send:
