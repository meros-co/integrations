quirks:
  - models: [all]
    severity: warning
    text: >
      Spectera does not yet implement SSCv2's third-party user "api" (Sennheiser's Spectera API introduction):
      requests authenticate as "controlSennheiser" with the device password set in LinkDesk or the WebUI, which
      can change anything the WebUI can. Set username to api once a firmware implements it. The API is
      unavailable until a password has been set. A 401 or 403 on any request is terminal: the core sends
      nothing more until the device is opened again with a corrected password, since repeated bad credentials
      block the client's address for a while.
  - models: [all]
    severity: warning
    text: >
      The Base Station presents a self-signed certificate, so it is accepted without verification. The
      connection is encrypted but the device is not authenticated.
  - models: [all]
    severity: info
    text: >
      Ids are the API's own, numbered from 0: RF channels 0 and 1, inputs and outputs 0 to 31, audio links by
      their id, mobile devices by mtUid, antenna ports a to d. State is keyed by the same ids, with the API's
      field names in snake_case.
  - models: [all]
    severity: critical
    text: >
      set_rf_active with active off, set_rf_frequency, set_rf_bandwidth and set_antenna_binding take an RF
      channel off the air or move it: every mobile device on it drops its audio until it reconnects. rfState is
      not kept over a restart (rfStateOnStartup decides), and an RF channel stays off even when active while its
      settings break the restrictions, or no initialized antenna is bound to it without a mismatch.
  - models: [all]
    severity: critical
    text: >
      set_audio_link_mode interrupts the link's audio; delete_audio_link, unpair_device, assign_mic_link and
      assign_iem_link with -1, and route_input or route_output to another link cut audio on that path at once.
      Creating and deleting many links on one RF channel can briefly interrupt other links' audio on current
      firmware (Companion module notes).
  - models: [all]
    severity: critical
    text: >
      update_mobile_device_firmware pauses all audio transmission of the Base Station, including for mobile
      devices that are not being updated, until the update ends.
  - models: [all]
    severity: warning
    text: >
      Audio links are validated as a set and a write that breaks a rule is refused with 409: one source per
      link, a link and its mobile device on the same RF channel, at most 128 timeslots per RF channel, some
      modes microphone-only or IEM-only, stereo links on an even input with the next odd input taken, no link on
      both an input and an output, and no move between RF channels while a mobile device has a link. An open
      Spectera WebUI deletes any link no mobile device uses, so assign a created link within 5 s.
  - models: [all]
    severity: warning
    text: >
      There is no audio mute per mobile device, input or output. An output is silenced with
      set_output_interface (Off), an IEM by its headphone volume at -100 dB, a microphone link by assigning -1.
  - models: [all]
    severity: info
    text: >
      Collections (RF channels, antennas, audio links, inputs, outputs, pairable and paired mobile devices) are
      subscribed as collections, not item by item, so each change arrives once. The first notification is the
      whole list; later ones are one created ({}), changed or deleted (null) item, on the item's path or, for the
      fixed lists, as the changed item on the collection's path. Items of a list read again that are no longer
      in it are removed from state.
  - models: [all]
    severity: info
    text: >
      Meters are not subscribed, since the Base Station would send them up to 60 times a second; with
      metering_poll_ms set they are read at that interval while monitored, the next read waiting for the last
      answer. get_metering reads them once.
  - models: [all]
    severity: info
    text: >
      A write to a mobile device has to name its type (SEK or SKM), which the module takes from the paired list
      in state, or from device_type before the device has been seen (opened for commands only). Commands an SKM
      lacks (IEM link, headphones, mic or line, cable emulation, low cut below 60 Hz, gain below -6 dB on an SEK)
      are refused before sending.
  - models: [all]
    severity: info
    text: >
      Telemetry arrives only when a value changes, and SSCv2 defines no keep-alive on the stream. A quiet stream
      is checked by requesting /api/ssc/version (which needs no authentication) after 3 s of silence; two failed
      checks in a row are a lost connection. The Base Station allows few concurrent connections and answers a
      new stream with 503 when full.
  - models: [all]
    severity: info
    text: >
      Written for API 18.1 (Base Station firmware 1.4.1 and later). On API 17.0 (firmware 1.3.x) the
      aoip interface status and the metering resource do not exist, mobile devices carry a connected flag
      instead of the Disabled command behaviour, and outputs have commandMode fields; the deprecated fields
      (source, clockSource, danteVersion, ledBrightness) are kept in state as the device sends them. A
      subscription batch refused because it names a resource the firmware lacks is logged, and the batches
      after it are still added.
  - models: [all]
    severity: info
    text: >
      Not in the API, so not offered: the device name and site (read only), presets, network settings, Base
      Station firmware upload, reboot, factory reset, licence activation, passwords and electronic key import.
      Level Recording (its own preliminary event streams of FlatBuffers frames) is not implemented.
