      scene_name: { type: string, label: Scene name, description: "Name of the scene to be renamed." }
      scene_uuid: { type: string, label: Scene UUID, description: "UUID of the scene to be renamed." }
      new_scene_name: { type: string, required: true, label: New scene name, description: "New name for the scene." }
    returns: ack

  get_scene_scene_transition_override:
    summary: "Gets the scene transition overridden for a scene. Note: A transition UUID response field is not currently able to be implemented as of 2024-1-18."
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the scene is in, if using the scene_name field." }
      scene_name: { type: string, label: Scene name, description: "Name of the scene." }
      scene_uuid: { type: string, label: Scene UUID, description: "UUID of the scene." }
    returns: value

  set_scene_scene_transition_override:
    summary: "Sets the scene transition overridden for a scene."
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the scene is in, if using the scene_name field." }
      scene_name: { type: string, label: Scene name, description: "Name of the scene." }
      scene_uuid: { type: string, label: Scene UUID, description: "UUID of the scene." }
      transition_name: { type: string, label: Transition name, description: "Name of the scene transition to use as the override." }
      transition_duration: { type: float, min: 50, max: 20000, label: Transition duration, description: "Duration in milliseconds for the overriding transition." }
    returns: ack

  get_source_active:
    summary: "Gets the active and show state of a source. **Compatible with inputs and scenes.**"
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the source is in, if using source_name field." }
      source_name: { type: string, label: Source name, description: "Name of the source to get the active state of." }
      source_uuid: { type: string, label: Source UUID, description: "UUID of the source to get the active state of." }
    returns: value

  get_source_screenshot:
    summary: "Gets a Base64-encoded screenshot of a source. The `imageWidth` and `imageHeight` parameters are treated as \"scale to inner\", meaning the smallest ratio will be used and the aspect ratio of the original resolution is kept. If `imageWidth` and `imageHeight` are not specified, the compressed image will use the full resolution of the source. **Compatible with inputs and scenes.**"
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the source is in, if using source_name field." }
      source_name: { type: string, label: Source name, description: "Name of the source to take a screenshot of." }
      source_uuid: { type: string, label: Source UUID, description: "UUID of the source to take a screenshot of." }
      image_format: { type: string, required: true, label: Image format, description: "Image format, one of those get_version lists as supported, such as png." }
      image_width: { type: float, min: 8, max: 4096, label: Image width, description: "Width to scale the screenshot to." }
      image_height: { type: float, min: 8, max: 4096, label: Image height, description: "Height to scale the screenshot to." }
      image_compression_quality: { type: float, min: -1, max: 100, label: Image compression quality, description: "Compression quality from 0 (high compression) to 100 (uncompressed), or -1 for the default." }
    returns: value

  save_source_screenshot:
    summary: "Saves a screenshot of a source to the filesystem. The `imageWidth` and `imageHeight` parameters are treated as \"scale to inner\", meaning the smallest ratio will be used and the aspect ratio of the original resolution is kept. If `imageWidth` and `imageHeight` are not specified, the compressed image will use the full resolution of the source. **Compatible with inputs and scenes.**"
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the source is in, if using source_name field." }
      source_name: { type: string, label: Source name, description: "Name of the source to take a screenshot of." }
      source_uuid: { type: string, label: Source UUID, description: "UUID of the source to take a screenshot of." }
      image_format: { type: string, required: true, label: Image format, description: "Image format, one of those get_version lists as supported, such as png." }
      image_file_path: { type: string, required: true, label: Image file path, description: "Path on the OBS computer to save the screenshot to, such as C:\\Users\\user\\Desktop\\screenshot.png." }
      image_width: { type: float, min: 8, max: 4096, label: Image width, description: "Width to scale the screenshot to." }
      image_height: { type: float, min: 8, max: 4096, label: Image height, description: "Height to scale the screenshot to." }
      image_compression_quality: { type: float, min: -1, max: 100, label: Image compression quality, description: "Compression quality from 0 (high compression) to 100 (uncompressed), or -1 for the default." }
    returns: ack

  get_stream_status:
    summary: "Gets the status of the stream output."
    returns: value

  toggle_stream:
    summary: "Toggles the status of the stream output."
    returns: value

  start_stream:
    summary: "Starts the stream output."
    returns: ack

  stop_stream:
    summary: "Stops the stream output."
    returns: ack

  send_stream_caption:
    summary: "Sends CEA-608 caption text over the stream output."
    params:
      caption_text: { type: string, required: true, label: Caption text, description: "Caption text." }
    returns: ack

  get_transition_kind_list:
    summary: "Gets an array of all available transition kinds. Similar to `GetInputKindList`"
    returns: value

  get_scene_transition_list:
    summary: "Gets an array of all scene transitions in OBS."
    returns: value

  get_current_scene_transition:
    summary: "Gets information about the current scene transition."
    returns: value

  set_current_scene_transition:
    summary: "Sets the current scene transition. Small note: While the namespace of scene transitions is generally unique, that uniqueness is not a guarantee as it is with other resources like inputs."
    params:
      transition_name: { type: string, required: true, label: Transition name, description: "Name of the transition to make active." }
    returns: ack

  set_current_scene_transition_duration:
    summary: "Sets the duration of the current scene transition, if it is not fixed."
    params:
      transition_duration: { type: float, min: 50, max: 20000, required: true, label: Transition duration, description: "Transition duration in milliseconds." }
    returns: ack

  set_current_scene_transition_settings:
    summary: "Sets the settings of the current scene transition."
    params:
      transition_settings: { type: json, required: true, label: Transition settings, description: "Settings object to apply to the transition; it can be {}." }
      overlay: { type: bool, label: Overlay, description: "On applies the settings on top of the existing ones, off resets to the defaults first and then applies them." }
    returns: ack

  get_current_scene_transition_cursor:
    summary: "Gets the cursor position of the current scene transition. Note: `transitionCursor` will return 1.0 when the transition is inactive."
    returns: value

  trigger_studio_mode_transition:
    summary: "Triggers the current scene transition. Same functionality as the `Transition` button in studio mode."
    returns: ack

  set_t_bar_position:
    summary: "Sets the position of the TBar. **Very important note**: This will be deprecated and replaced in a future version of obs-websocket."
    params:
      position: { type: float, min: 0.0, max: 1.0, required: true, label: T-bar position, description: "New T-bar position from 0.0 to 1.0." }
      release: { type: bool, label: Release, description: "Whether to release the T-bar; set it off only when another position update follows." }
    returns: ack

  get_studio_mode_enabled:
    summary: "Gets whether studio is enabled."
    returns: value

  set_studio_mode_enabled:
    summary: "Enables or disables studio mode"
    params:
      studio_mode_enabled: { type: bool, required: true, label: Studio mode, description: "On enables studio mode, off disables it." }
    returns: ack

  open_input_properties_dialog:
    summary: "Opens the properties dialog of an input."
    params:
      input_name: { type: string, label: Input name, description: "Name of the input to open the dialog of." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of the input to open the dialog of." }
    returns: ack

  open_input_filters_dialog:
    summary: "Opens the filters dialog of an input."
    params:
      input_name: { type: string, label: Input name, description: "Name of the input to open the dialog of." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of the input to open the dialog of." }
    returns: ack

  open_input_interact_dialog:
    summary: "Opens the interact dialog of an input."
    params:
      input_name: { type: string, label: Input name, description: "Name of the input to open the dialog of." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of the input to open the dialog of." }
    returns: ack

  get_monitor_list:
    summary: "Gets a list of connected monitors and information about them."
    returns: value

  open_video_mix_projector:
    summary: "Opens a projector for a specific output video mix. Mix types: - `OBS_WEBSOCKET_VIDEO_MIX_TYPE_PREVIEW` - `OBS_WEBSOCKET_VIDEO_MIX_TYPE_PROGRAM` - `OBS_WEBSOCKET_VIDEO_MIX_TYPE_MULTIVIEW` Note: This request serves to provide feature parity with 4.x. It is very likely to be changed/deprecated in a future release."
    params:
      video_mix_type: { type: string, required: true, label: Video mix type, description: "Type of mix to open, such as OBS_WEBSOCKET_VIDEO_MIX_TYPE_PREVIEW, _PROGRAM or _MULTIVIEW." }
      monitor_index: { type: float, label: Monitor index, description: "Monitor index as get_monitor_list gives it." }
      projector_geometry: { type: string, label: Projector geometry, description: "Size and position of a windowed projector in Qt Base64 format; not used with a monitor index." }
    returns: ack

  open_source_projector:
    summary: "Opens a projector for a source. Note: This request serves to provide feature parity with 4.x. It is very likely to be changed/deprecated in a future release."
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the source is in, if using the source_name field." }
      source_name: { type: string, label: Source name, description: "Name of the source to open a projector for." }
      source_uuid: { type: string, label: Source UUID, description: "UUID of the source to open a projector for." }
      monitor_index: { type: float, label: Monitor index, description: "Monitor index as get_monitor_list gives it." }
      projector_geometry: { type: string, label: Projector geometry, description: "Size and position of a windowed projector in Qt Base64 format; not used with a monitor index." }
    returns: ack

