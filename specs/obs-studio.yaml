spec: 1
id: obs-studio
name: OBS Studio (obs-websocket 5)
vendor: OBS Project
category: switcher
implementation: native
reason: >
  JSON messages over a WebSocket, opened with a handshake whose reply depends
  on what the server sends: a salted SHA-256 challenge when a password is set.
  Replies are matched to requests by an id the client chooses.

source:
  - title: obs-websocket 5.x protocol documentation (docs/generated/protocol.md)
    author: OBS Project
    url: https://github.com/obsproject/obs-websocket/blob/master/docs/generated/protocol.md
    note: >
      Manufacturer document, read as documentation only. Port 4455, the
      obswebsocket.json subprotocol, the Hello / Identify / Identified
      handshake and its authentication string, event subscription flags,
      request and response messages, request status codes, close code 4009
      for failed authentication, and every request and event used here.
  - title: obs-websocket protocol description (docs/generated/protocol.json)
    author: OBS Project
    url: https://github.com/obsproject/obs-websocket/blob/master/docs/generated/protocol.json
    note: >
      The machine-readable form of the same document. Every command here is
      one of its requests, generated by tools/generate_obs.py: the request
      type and its fields in snake_case, with their types, restrictions and
      the version that introduced them.
  - title: Tally OBS client (tally/OBS.cpp)
    note: Meros. Scene-based tally from program and preview scene changes.

settings:
  # The server password from OBS's WebSocket Server Settings; empty when
  # authentication is turned off there.
  password: { type: string, secret: true, label: Password, description: "The server password from OBS's WebSocket Server Settings; empty when authentication is turned off there." }

ports:
  - { port: 4455, protocol: ws, role: control }

models:
  - id: obs-studio-28
    name: OBS Studio 28 or later (built-in obs-websocket 5)
    supports: [get_canvas_list, get_persistent_data, set_persistent_data,
               get_scene_collection_list, set_current_scene_collection,
               create_scene_collection, get_profile_list, set_current_profile,
               create_profile, remove_profile, get_profile_parameter,
               set_profile_parameter, get_video_settings, set_video_settings,
               get_stream_service_settings, set_stream_service_settings,
               get_record_directory, set_record_directory, get_source_filter_kind_list,
               get_source_filter_list, get_source_filter_default_settings,
               create_source_filter, remove_source_filter, set_source_filter_name,
               get_source_filter, set_source_filter_index, set_source_filter_settings,
               set_source_filter_enabled, get_version, get_stats,
               broadcast_custom_event, call_vendor_request, get_hotkey_list,
               trigger_hotkey_by_name, trigger_hotkey_by_key_sequence, sleep,
               get_input_list, get_input_kind_list, get_special_inputs, create_input,
               remove_input, set_input_name, get_input_default_settings,
               get_input_settings, set_input_settings, get_input_mute, set_input_mute,
               toggle_input_mute, get_input_volume, set_input_volume,
               get_input_audio_balance, set_input_audio_balance,
               get_input_audio_sync_offset, set_input_audio_sync_offset,
               get_input_audio_monitor_type, set_input_audio_monitor_type,
               get_input_audio_tracks, set_input_audio_tracks,
               get_input_deinterlace_mode, set_input_deinterlace_mode,
               get_input_deinterlace_field_order, set_input_deinterlace_field_order,
               get_input_properties_list_property_items, press_input_properties_button,
               get_media_input_status, set_media_input_cursor,
               offset_media_input_cursor, trigger_media_input_action,
               get_virtual_cam_status, toggle_virtual_cam, start_virtual_cam,
               stop_virtual_cam, get_replay_buffer_status, toggle_replay_buffer,
               start_replay_buffer, stop_replay_buffer, save_replay_buffer,
               get_last_replay_buffer_replay, get_output_list, get_output_status,
               toggle_output, start_output, stop_output, get_output_settings,
               set_output_settings, get_record_status, toggle_record, start_record,
               stop_record, toggle_record_pause, pause_record, resume_record,
               split_record_file, create_record_chapter, get_scene_item_list,
               get_group_scene_item_list, get_scene_item_id, get_scene_item_source,
               create_scene_item, remove_scene_item, duplicate_scene_item,
               get_scene_item_transform, set_scene_item_transform,
               get_scene_item_enabled, set_scene_item_enabled, get_scene_item_locked,
               set_scene_item_locked, get_scene_item_index, set_scene_item_index,
               get_scene_item_blend_mode, set_scene_item_blend_mode, get_scene_list,
               get_group_list, get_current_program_scene, set_current_program_scene,
               get_current_preview_scene, set_current_preview_scene, create_scene,
               remove_scene, set_scene_name, get_scene_scene_transition_override,
               set_scene_scene_transition_override, get_source_active,
               get_source_screenshot, save_source_screenshot, get_stream_status,
               toggle_stream, start_stream, stop_stream, send_stream_caption,
               get_transition_kind_list, get_scene_transition_list,
               get_current_scene_transition, set_current_scene_transition,
               set_current_scene_transition_duration,
               set_current_scene_transition_settings,
               get_current_scene_transition_cursor, trigger_studio_mode_transition,
               set_t_bar_position, get_studio_mode_enabled, set_studio_mode_enabled,
               open_input_properties_dialog, open_input_filters_dialog,
               open_input_interact_dialog, get_monitor_list, open_video_mix_projector,
               open_source_projector]
    verification: none

commands:
  get_canvas_list:
    summary: "Gets an array of canvases in OBS. (obs-websocket 5.7.0 and later.)"
    returns: value

  get_persistent_data:
    summary: "Gets the value of a \"slot\" from the selected persistent data realm."
    params:
      realm: { type: string, required: true, label: Realm, description: "Data realm: OBS_WEBSOCKET_DATA_REALM_GLOBAL or OBS_WEBSOCKET_DATA_REALM_PROFILE." }
      slot_name: { type: string, required: true, label: Slot name, description: "The name of the slot to retrieve data from." }
    returns: value

  set_persistent_data:
    summary: "Sets the value of a \"slot\" from the selected persistent data realm."
    params:
      realm: { type: string, required: true, label: Realm, description: "Data realm: OBS_WEBSOCKET_DATA_REALM_GLOBAL or OBS_WEBSOCKET_DATA_REALM_PROFILE." }
      slot_name: { type: string, required: true, label: Slot name, description: "The name of the slot to retrieve data from." }
      slot_value: { type: json, required: true, label: Slot value, description: "The value to apply to the slot." }
    returns: ack

  get_scene_collection_list:
    summary: "Gets an array of all scene collections"
    returns: value

  set_current_scene_collection:
    summary: "Switches to a scene collection. Note: This will block until the collection has finished changing."
    params:
      scene_collection_name: { type: string, required: true, label: Scene collection name, description: "Name of the scene collection to switch to." }
    returns: ack

  create_scene_collection:
    summary: "Creates a new scene collection, switching to it in the process. Note: This will block until the collection has finished changing."
    params:
      scene_collection_name: { type: string, required: true, label: Scene collection name, description: "Name for the new scene collection." }
    returns: ack

  get_profile_list:
    summary: "Gets an array of all profiles"
    returns: value

  set_current_profile:
    summary: "Switches to a profile."
    params:
      profile_name: { type: string, required: true, label: Profile name, description: "Name of the profile to switch to." }
    returns: ack

  create_profile:
    summary: "Creates a new profile, switching to it in the process"
    params:
      profile_name: { type: string, required: true, label: Profile name, description: "Name for the new profile." }
    returns: ack

  remove_profile:
    summary: "Removes a profile. If the current profile is chosen, it will change to a different profile first."
    params:
      profile_name: { type: string, required: true, label: Profile name, description: "Name of the profile to remove." }
    returns: ack

  get_profile_parameter:
    summary: "Gets a parameter from the current profile's configuration."
    params:
      parameter_category: { type: string, required: true, label: Parameter category, description: "Category of the parameter to get." }
      parameter_name: { type: string, required: true, label: Parameter name, description: "Name of the parameter to get." }
    returns: value

  set_profile_parameter:
    summary: "Sets the value of a parameter in the current profile's configuration."
    params:
      parameter_category: { type: string, required: true, label: Parameter category, description: "Category of the parameter to set." }
      parameter_name: { type: string, required: true, label: Parameter name, description: "Name of the parameter to set." }
      parameter_value: { type: string, required: true, label: Parameter value, description: "Value of the parameter to set." }
    returns: ack

  get_video_settings:
    summary: "Gets the current video settings. Note: To get the true FPS value, divide the FPS numerator by the FPS denominator. Example: `60000/1001`"
    returns: value

  set_video_settings:
    summary: "Sets the current video settings. Note: Fields must be specified in pairs. For example, you cannot set only `baseWidth` without needing to specify `baseHeight`."
    params:
      fps_numerator: { type: float, min: 1, label: FPS numerator, description: "Numerator of the fractional FPS value." }
      fps_denominator: { type: float, min: 1, label: FPS denominator, description: "Denominator of the fractional FPS value." }
      base_width: { type: float, min: 1, max: 4096, label: Base width, description: "Width of the base (canvas) resolution in pixels." }
      base_height: { type: float, min: 1, max: 4096, label: Base height, description: "Height of the base (canvas) resolution in pixels." }
      output_width: { type: float, min: 1, max: 4096, label: Output width, description: "Width of the output resolution in pixels." }
      output_height: { type: float, min: 1, max: 4096, label: Output height, description: "Height of the output resolution in pixels." }
    returns: ack

  get_stream_service_settings:
    summary: "Gets the current stream service settings (stream destination)."
    returns: value

  set_stream_service_settings:
    summary: "Sets the current stream service settings (stream destination). Note: Simple RTMP settings can be set with type `rtmp_custom` and the settings fields `server` and `key`."
    params:
      stream_service_type: { type: string, required: true, label: Stream service type, description: "Type of stream service, such as rtmp_common or rtmp_custom." }
      stream_service_settings: { type: json, required: true, label: Stream service settings, description: "Settings to apply to the service." }
    returns: ack

  get_record_directory:
    summary: "Gets the current directory that the record output is set to."
    returns: value

  set_record_directory:
    summary: "Sets the current directory that the record output writes files to. (obs-websocket 5.3.0 and later.)"
    params:
      record_directory: { type: string, required: true, label: Record directory, description: "Directory on the OBS computer that recordings are saved to." }
    returns: ack

  get_source_filter_kind_list:
    summary: "Gets an array of all available source filter kinds. Similar to `GetInputKindList` (obs-websocket 5.4.0 and later.)"
    returns: value

  get_source_filter_list:
    summary: "Gets an array of all of a source's filters."
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the source is in, if using the source_name field." }
      source_name: { type: string, label: Source name, description: "Name of the source." }
      source_uuid: { type: string, label: Source UUID, description: "UUID of the source." }
    returns: value

  get_source_filter_default_settings:
    summary: "Gets the default settings for a filter kind."
    params:
      filter_kind: { type: string, required: true, label: Filter kind, description: "Filter kind to get the default settings for." }
    returns: value

  create_source_filter:
    summary: "Creates a new filter, adding it to the specified source."
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the source is in, if using the source_name field." }
      source_name: { type: string, label: Source name, description: "Name of the source to add the filter to." }
      source_uuid: { type: string, label: Source UUID, description: "UUID of the source to add the filter to." }
      filter_name: { type: string, required: true, label: Filter name, description: "Name of the new filter to be created." }
      filter_kind: { type: string, required: true, label: Filter kind, description: "The kind of filter to be created." }
      filter_settings: { type: json, label: Filter settings, description: "Settings object to initialize the filter with." }
    returns: ack

  remove_source_filter:
    summary: "Removes a filter from a source."
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the source is in, if using the source_name field." }
      source_name: { type: string, label: Source name, description: "Name of the source the filter is on." }
      source_uuid: { type: string, label: Source UUID, description: "UUID of the source the filter is on." }
      filter_name: { type: string, required: true, label: Filter name, description: "Name of the filter to remove." }
    returns: ack

  set_source_filter_name:
    summary: "Sets the name of a source filter (rename)."
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the source is in, if using the source_name field." }
      source_name: { type: string, label: Source name, description: "Name of the source the filter is on." }
      source_uuid: { type: string, label: Source UUID, description: "UUID of the source the filter is on." }
      filter_name: { type: string, required: true, label: Filter name, description: "Current name of the filter." }
      new_filter_name: { type: string, required: true, label: New filter name, description: "New name for the filter." }
    returns: ack

  get_source_filter:
    summary: "Gets the info for a specific source filter."
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the source is in, if using the source_name field." }
      source_name: { type: string, label: Source name, description: "Name of the source." }
      source_uuid: { type: string, label: Source UUID, description: "UUID of the source." }
      filter_name: { type: string, required: true, label: Filter name, description: "Name of the filter." }
    returns: value

  set_source_filter_index:
    summary: "Sets the index position of a filter on a source."
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the source is in, if using the source_name field." }
      source_name: { type: string, label: Source name, description: "Name of the source the filter is on." }
      source_uuid: { type: string, label: Source UUID, description: "UUID of the source the filter is on." }
      filter_name: { type: string, required: true, label: Filter name, description: "Name of the filter." }
      filter_index: { type: float, min: 0, required: true, label: Filter index, description: "New index position of the filter." }
    returns: ack

  set_source_filter_settings:
    summary: "Sets the settings of a source filter."
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the source is in, if using the source_name field." }
      source_name: { type: string, label: Source name, description: "Name of the source the filter is on." }
      source_uuid: { type: string, label: Source UUID, description: "UUID of the source the filter is on." }
      filter_name: { type: string, required: true, label: Filter name, description: "Name of the filter to set the settings of." }
      filter_settings: { type: json, required: true, label: Filter settings, description: "Object of settings to apply." }
      overlay: { type: bool, label: Overlay, description: "On applies the settings on top of the existing ones, off resets to the defaults first and then applies them." }
    returns: ack

  set_source_filter_enabled:
    summary: "Sets the enable state of a source filter."
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the source is in, if using the source_name field." }
      source_name: { type: string, label: Source name, description: "Name of the source the filter is on." }
      source_uuid: { type: string, label: Source UUID, description: "UUID of the source the filter is on." }
      filter_name: { type: string, required: true, label: Filter name, description: "Name of the filter." }
      filter_enabled: { type: bool, required: true, label: Enabled, description: "On enables the filter, off disables it." }
    returns: ack

  get_version:
    summary: "Gets data about the current plugin and RPC version."
    returns: value

  get_stats:
    summary: "Gets statistics about OBS, obs-websocket, and the current session."
    returns: value

  broadcast_custom_event:
    summary: "Broadcasts a `CustomEvent` to all WebSocket clients. Receivers are clients which are identified and subscribed."
    params:
      event_data: { type: json, required: true, label: Event data, description: "Data payload to emit to all receivers." }
    returns: ack

  call_vendor_request:
    summary: "Call a request registered to a vendor. A vendor is a unique name registered by a third-party plugin or script, which allows for custom requests and events to be added to obs-websocket. If a plugin or script implements vendor requests or events, documentation is expected to be provided with them."
    params:
      vendor_name: { type: string, required: true, label: Vendor name, description: "Name of the vendor to use." }
      request_type: { type: string, required: true, label: Request type, description: "The request type to call." }
      request_data: { type: json, label: Request data, description: "Request data object for the vendor's request." }
    returns: value

  get_hotkey_list:
    summary: "Gets an array of all hotkey names in OBS. Note: Hotkey functionality in obs-websocket comes as-is, and we do not guarantee support if things are broken. In 9/10 usages of hotkey requests, there exists a better, more reliable method via other requests."
    returns: value

  trigger_hotkey_by_name:
    summary: "Triggers a hotkey using its name. See `GetHotkeyList`. Note: Hotkey functionality in obs-websocket comes as-is, and we do not guarantee support if things are broken. In 9/10 usages of hotkey requests, there exists a better, more reliable method via other requests."
    params:
      hotkey_name: { type: string, required: true, label: Hotkey name, description: "Name of the hotkey to trigger." }
      context_name: { type: string, label: Context name, description: "Name of context of the hotkey to trigger." }
    returns: ack

  trigger_hotkey_by_key_sequence:
    summary: "Triggers a hotkey using a sequence of keys. Note: Hotkey functionality in obs-websocket comes as-is, and we do not guarantee support if things are broken. In 9/10 usages of hotkey requests, there exists a better, more reliable method via other requests. key_modifiers is an object with shift, control, alt, command."
    params:
      key_id: { type: string, label: Key ID, description: "OBS key ID, such as OBS_KEY_A, as listed in libobs/obs-hotkeys.h." }
      key_modifiers: { type: json, label: Key modifiers, description: "Object containing key modifiers to apply." }
    returns: ack

  sleep:
    summary: "Sleeps for a time duration or number of frames. Only available in request batches with types `SERIAL_REALTIME` or `SERIAL_FRAME`."
    params:
      sleep_millis: { type: float, min: 0, max: 50000, label: Sleep time (ms), description: "Number of milliseconds to sleep for (if SERIAL_REALTIME mode)." }
      sleep_frames: { type: float, min: 0, max: 10000, label: Sleep frames, description: "Number of frames to sleep for (if SERIAL_FRAME mode)." }
    returns: ack

  get_input_list:
    summary: "Gets an array of all inputs in OBS."
    params:
      input_kind: { type: string, label: Input kind, description: "Restrict the array to only inputs of the specified kind." }
    returns: value

  get_input_kind_list:
    summary: "Gets an array of all available input kinds in OBS."
    params:
      unversioned: { type: bool, label: Unversioned, description: "On returns every kind without its version suffix, off returns them with version suffixes where there are any." }
    returns: value

  get_special_inputs:
    summary: "Gets the names of all special inputs."
    returns: value

  create_input:
    summary: "Creates a new input, adding it as a scene item to the specified scene."
    params:
      canvas_uuid: { type: string, label: Canvas UUID, description: "UUID of the canvas the scene is in, if using the scene_name field." }
      scene_name: { type: string, label: Scene name, description: "Name of the scene to add the input to as a scene item." }
      scene_uuid: { type: string, label: Scene UUID, description: "UUID of the scene to add the input to as a scene item." }
      input_name: { type: string, required: true, label: Input name, description: "Name of the new input to be created." }
      input_kind: { type: string, required: true, label: Input kind, description: "The kind of input to be created." }
      input_settings: { type: json, label: Input settings, description: "Settings object to initialize the input with." }
      scene_item_enabled: { type: bool, label: Enabled, description: "Whether to set the created scene item to enabled or disabled." }
    returns: value

  remove_input:
    summary: "Removes an existing input. Note: Will immediately remove all associated scene items."
    params:
      input_name: { type: string, label: Input name, description: "Name of the input to remove." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of the input to remove." }
    returns: ack

  set_input_name:
    summary: "Sets the name of an input (rename)."
    params:
      input_name: { type: string, label: Input name, description: "Current input name." }
      input_uuid: { type: string, label: Input UUID, description: "Current input UUID." }
      new_input_name: { type: string, required: true, label: New input name, description: "New name for the input." }
    returns: ack

  get_input_default_settings:
    summary: "Gets the default settings for an input kind."
    params:
      input_kind: { type: string, required: true, label: Input kind, description: "Input kind to get the default settings for." }
    returns: value

  get_input_settings:
    summary: "Gets the settings of an input. Note: Does not include defaults. To create the entire settings object, overlay `inputSettings` over the `defaultInputSettings` provided by `GetInputDefaultSettings`."
    params:
      input_name: { type: string, label: Input name, description: "Name of the input to get the settings of." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of the input to get the settings of." }
    returns: value

  set_input_settings:
    summary: "Sets the settings of an input."
    params:
      input_name: { type: string, label: Input name, description: "Name of the input to set the settings of." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of the input to set the settings of." }
      input_settings: { type: json, required: true, label: Input settings, description: "Object of settings to apply." }
      overlay: { type: bool, label: Overlay, description: "On applies the settings on top of the existing ones, off resets to the defaults first and then applies them." }
    returns: ack

  get_input_mute:
    summary: "Gets the audio mute state of an input."
    params:
      input_name: { type: string, label: Input name, description: "Name of input to get the mute state of." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of input to get the mute state of." }
    returns: value

  set_input_mute:
    summary: "Sets the audio mute state of an input."
    params:
      input_name: { type: string, label: Input name, description: "Name of the input to set the mute state of." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of the input to set the mute state of." }
      input_muted: { type: bool, required: true, label: Mute, description: "On mutes the input, off unmutes it." }
    returns: ack

  toggle_input_mute:
    summary: "Toggles the audio mute state of an input."
    params:
      input_name: { type: string, label: Input name, description: "Name of the input to toggle the mute state of." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of the input to toggle the mute state of." }
    returns: value

  get_input_volume:
    summary: "Gets the current volume setting of an input."
    params:
      input_name: { type: string, label: Input name, description: "Name of the input to get the volume of." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of the input to get the volume of." }
    returns: value

  set_input_volume:
    summary: "Sets the volume setting of an input."
    params:
      input_name: { type: string, label: Input name, description: "Name of the input to set the volume of." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of the input to set the volume of." }
      input_volume_mul: { type: float, min: 0, max: 20, label: Volume (multiplier), description: "Volume as a linear multiplier, 1.0 for unchanged; give this or the volume in dB." }
      input_volume_db: { type: float, min: -100, max: 26, label: Volume (dB), description: "Volume in dB, 0 for unchanged; give this or the volume as a multiplier." }
    returns: ack

  get_input_audio_balance:
    summary: "Gets the audio balance of an input."
    params:
      input_name: { type: string, label: Input name, description: "Name of the input to get the audio balance of." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of the input to get the audio balance of." }
    returns: value

  set_input_audio_balance:
    summary: "Sets the audio balance of an input."
    params:
      input_name: { type: string, label: Input name, description: "Name of the input to set the audio balance of." }
      input_uuid: { type: string, label: Input UUID, description: "UUID of the input to set the audio balance of." }
      input_audio_balance: { type: float, min: 0.0, max: 1.0, required: true, label: Audio balance, description: "Audio balance from 0.0 (left) to 1.0 (right), 0.5 centred." }
    returns: ack

  get_input_audio_sync_offset:
    summary: "Gets the audio sync offset of an input. Note: The audio sync offset can be negative too!"
    params:
