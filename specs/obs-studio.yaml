quirks:
  - models: [all]
    severity: warning
    text: >
      A wrong password is not retried. OBS closes the connection with code
      4009; the core reports unauthorized and sends nothing further until the
      device is opened again with a corrected password.

  - models: [all]
    severity: info
    text: >
      set_current_preview_scene and trigger_studio_mode_transition need studio
      mode. Without it, OBS refuses them with request status 506 (studio mode
      not active), reported as a device error. Every refusal carries OBS's own
      status code and comment.

  - models: [all]
    severity: info
    text: >
      Scenes, inputs, filters and outputs are keyed by name, and OBS lets a
      user rename them. A rename is reported as the old name removed and the
      new name added. Collections are replaced, not merged: whatever OBS no
      longer lists is deleted from the state, and a change of scene collection
      (or a new connection) clears scene items, filters, inputs, scene
      transition overrides, groups and outputs and reads them again.

  - models: [all]
    severity: info
    text: >
      Monitored, the core subscribes to every event category but canvases, and
      to the high-volume volume meters, input active and show states, and
      scene item transforms. Volume meters (every 50 ms from OBS) and
      transforms are published at most every 200 ms. OBS sends no event for a
      media input's position, output statistics, other outputs, scene item
      blend modes, deinterlacing, scene transition overrides, video settings,
      the record directory or the stream service: media position is read every
      second while it plays, status and statistics every 5 s, and the rest
      after the command that sets them.

  - models: [all]
    severity: info
    text: >
      Not kept in state, as the API only reads them on request: persistent
      data, profile parameters, hotkeys, the monitor list, output settings,
      input kinds, filter kinds, the transition cursor and the T-bar position
      (set_t_bar_position has no read-back). The stream service's settings
      hold the stream key, so only its type and server are published.
      Canvases (obs-websocket 5.7) other than the main one are not mirrored;
      their commands work.

  - models: [all]
    severity: info
    text: >
      OBS 27 and earlier shipped obs-websocket 4, a different protocol on port
      4444, unless the version 5 plugin was installed. Only version 5 is
      supported.
