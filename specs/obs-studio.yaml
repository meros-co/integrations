spec: 1
id: obs-studio
name: OBS Studio (obs-websocket 5)
vendor: OBS Project
category: switcher
implementation: native
reason: >
  JSON messages over a WebSocket, opened with a handshake whose reply depends
  on what the server sends: a salted SHA-256 challenge when a password is set.
  Replies are matched to requests by an id the client chooses.

source:
  - title: obs-websocket 5.x protocol documentation (docs/generated/protocol.md)
    author: OBS Project
    url: https://github.com/obsproject/obs-websocket/blob/master/docs/generated/protocol.md
    note: >
      Manufacturer document, read as documentation only. Port 4455, the
      obswebsocket.json subprotocol, the Hello / Identify / Identified
      handshake and its authentication string, event subscription flags,
      request and response messages, request status codes, close code 4009
      for failed authentication, and every request and event used here.
  - title: obs-websocket protocol description (docs/generated/protocol.json)
    author: OBS Project
    url: https://github.com/obsproject/obs-websocket/blob/master/docs/generated/protocol.json
    note: >
      The machine-readable form of the same document. Every command here is
      one of its requests, generated by tools/generate_obs.py: the request
      type and its fields in snake_case, with their types, restrictions and
      the version that introduced them.
  - title: Tally OBS client (tally/OBS.cpp)
    note: Meros. Scene-based tally from program and preview scene changes.

settings:
  # The server password from OBS's WebSocket Server Settings; empty when
  # authentication is turned off there.
  password: { type: string, secret: true }

models:
  - id: obs-studio-28
    name: OBS Studio 28 or later (built-in obs-websocket 5)
    supports: [get_canvas_list, get_persistent_data, set_persistent_data,
               get_scene_collection_list, set_current_scene_collection,
               create_scene_collection, get_profile_list, set_current_profile,
               create_profile, remove_profile, get_profile_parameter,
               set_profile_parameter, get_video_settings, set_video_settings,
               get_stream_service_settings, set_stream_service_settings,
               get_record_directory, set_record_directory, get_source_filter_kind_list,
               get_source_filter_list, get_source_filter_default_settings,
               create_source_filter, remove_source_filter, set_source_filter_name,
               get_source_filter, set_source_filter_index, set_source_filter_settings,
               set_source_filter_enabled, get_version, get_stats,
               broadcast_custom_event, call_vendor_request, get_hotkey_list,
               trigger_hotkey_by_name, trigger_hotkey_by_key_sequence, sleep,
               get_input_list, get_input_kind_list, get_special_inputs, create_input,
               remove_input, set_input_name, get_input_default_settings,
               get_input_settings, set_input_settings, get_input_mute, set_input_mute,
               toggle_input_mute, get_input_volume, set_input_volume,
               get_input_audio_balance, set_input_audio_balance,
               get_input_audio_sync_offset, set_input_audio_sync_offset,
               get_input_audio_monitor_type, set_input_audio_monitor_type,
               get_input_audio_tracks, set_input_audio_tracks,
               get_input_deinterlace_mode, set_input_deinterlace_mode,
               get_input_deinterlace_field_order, set_input_deinterlace_field_order,
               get_input_properties_list_property_items, press_input_properties_button,
               get_media_input_status, set_media_input_cursor,
               offset_media_input_cursor, trigger_media_input_action,
               get_virtual_cam_status, toggle_virtual_cam, start_virtual_cam,
               stop_virtual_cam, get_replay_buffer_status, toggle_replay_buffer,
               start_replay_buffer, stop_replay_buffer, save_replay_buffer,
               get_last_replay_buffer_replay, get_output_list, get_output_status,
               toggle_output, start_output, stop_output, get_output_settings,
               set_output_settings, get_record_status, toggle_record, start_record,
               stop_record, toggle_record_pause, pause_record, resume_record,
               split_record_file, create_record_chapter, get_scene_item_list,
               get_group_scene_item_list, get_scene_item_id, get_scene_item_source,
               create_scene_item, remove_scene_item, duplicate_scene_item,
               get_scene_item_transform, set_scene_item_transform,
               get_scene_item_enabled, set_scene_item_enabled, get_scene_item_locked,
               set_scene_item_locked, get_scene_item_index, set_scene_item_index,
               get_scene_item_blend_mode, set_scene_item_blend_mode, get_scene_list,
               get_group_list, get_current_program_scene, set_current_program_scene,
               get_current_preview_scene, set_current_preview_scene, create_scene,
               remove_scene, set_scene_name, get_scene_scene_transition_override,
               set_scene_scene_transition_override, get_source_active,
               get_source_screenshot, save_source_screenshot, get_stream_status,
               toggle_stream, start_stream, stop_stream, send_stream_caption,
               get_transition_kind_list, get_scene_transition_list,
               get_current_scene_transition, set_current_scene_transition,
               set_current_scene_transition_duration,
               set_current_scene_transition_settings,
               get_current_scene_transition_cursor, trigger_studio_mode_transition,
               set_t_bar_position, get_studio_mode_enabled, set_studio_mode_enabled,
               open_input_properties_dialog, open_input_filters_dialog,
               open_input_interact_dialog, get_monitor_list, open_video_mix_projector,
               open_source_projector]
    verification: none

commands:
  get_canvas_list:
    summary: "Gets an array of canvases in OBS. (obs-websocket 5.7.0 and later.)"
    returns: value

  get_persistent_data:
    summary: "Gets the value of a \"slot\" from the selected persistent data realm."
    params:
      realm: { type: string, required: true }
      slot_name: { type: string, required: true }
    returns: value

  set_persistent_data:
    summary: "Sets the value of a \"slot\" from the selected persistent data realm."
    params:
      realm: { type: string, required: true }
      slot_name: { type: string, required: true }
      slot_value: { type: json, required: true }
    returns: ack

  get_scene_collection_list:
    summary: "Gets an array of all scene collections"
    returns: value

  set_current_scene_collection:
    summary: "Switches to a scene collection. Note: This will block until the collection has finished changing."
    params:
      scene_collection_name: { type: string, required: true }
    returns: ack

  create_scene_collection:
    summary: "Creates a new scene collection, switching to it in the process. Note: This will block until the collection has finished changing."
    params:
      scene_collection_name: { type: string, required: true }
    returns: ack

  get_profile_list:
    summary: "Gets an array of all profiles"
    returns: value

  set_current_profile:
    summary: "Switches to a profile."
    params:
      profile_name: { type: string, required: true }
    returns: ack

  create_profile:
    summary: "Creates a new profile, switching to it in the process"
    params:
      profile_name: { type: string, required: true }
    returns: ack

  remove_profile:
    summary: "Removes a profile. If the current profile is chosen, it will change to a different profile first."
    params:
      profile_name: { type: string, required: true }
    returns: ack

  get_profile_parameter:
    summary: "Gets a parameter from the current profile's configuration."
    params:
      parameter_category: { type: string, required: true }
      parameter_name: { type: string, required: true }
    returns: value

  set_profile_parameter:
    summary: "Sets the value of a parameter in the current profile's configuration."
    params:
      parameter_category: { type: string, required: true }
      parameter_name: { type: string, required: true }
      parameter_value: { type: string, required: true }
    returns: ack

  get_video_settings:
    summary: "Gets the current video settings. Note: To get the true FPS value, divide the FPS numerator by the FPS denominator. Example: `60000/1001`"
    returns: value

  set_video_settings:
    summary: "Sets the current video settings. Note: Fields must be specified in pairs. For example, you cannot set only `baseWidth` without needing to specify `baseHeight`."
    params:
      fps_numerator: { type: float, min: 1 }
      fps_denominator: { type: float, min: 1 }
      base_width: { type: float, min: 1, max: 4096 }
      base_height: { type: float, min: 1, max: 4096 }
      output_width: { type: float, min: 1, max: 4096 }
      output_height: { type: float, min: 1, max: 4096 }
    returns: ack

  get_stream_service_settings:
    summary: "Gets the current stream service settings (stream destination)."
    returns: value

  set_stream_service_settings:
    summary: "Sets the current stream service settings (stream destination). Note: Simple RTMP settings can be set with type `rtmp_custom` and the settings fields `server` and `key`."
    params:
      stream_service_type: { type: string, required: true }
      stream_service_settings: { type: json, required: true }
    returns: ack

  get_record_directory:
    summary: "Gets the current directory that the record output is set to."
    returns: value

  set_record_directory:
    summary: "Sets the current directory that the record output writes files to. (obs-websocket 5.3.0 and later.)"
    params:
      record_directory: { type: string, required: true }
    returns: ack

  get_source_filter_kind_list:
    summary: "Gets an array of all available source filter kinds. Similar to `GetInputKindList` (obs-websocket 5.4.0 and later.)"
    returns: value

  get_source_filter_list:
    summary: "Gets an array of all of a source's filters."
    params:
      canvas_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
    returns: value

  get_source_filter_default_settings:
    summary: "Gets the default settings for a filter kind."
    params:
      filter_kind: { type: string, required: true }
    returns: value

  create_source_filter:
    summary: "Creates a new filter, adding it to the specified source."
    params:
      canvas_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
      filter_name: { type: string, required: true }
      filter_kind: { type: string, required: true }
      filter_settings: { type: json }
    returns: ack

  remove_source_filter:
    summary: "Removes a filter from a source."
    params:
      canvas_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
      filter_name: { type: string, required: true }
    returns: ack

  set_source_filter_name:
    summary: "Sets the name of a source filter (rename)."
    params:
      canvas_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
      filter_name: { type: string, required: true }
      new_filter_name: { type: string, required: true }
    returns: ack

  get_source_filter:
    summary: "Gets the info for a specific source filter."
    params:
      canvas_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
      filter_name: { type: string, required: true }
    returns: value

  set_source_filter_index:
    summary: "Sets the index position of a filter on a source."
    params:
      canvas_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
      filter_name: { type: string, required: true }
      filter_index: { type: float, min: 0, required: true }
    returns: ack

  set_source_filter_settings:
    summary: "Sets the settings of a source filter."
    params:
      canvas_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
      filter_name: { type: string, required: true }
      filter_settings: { type: json, required: true }
      overlay: { type: bool }
    returns: ack

  set_source_filter_enabled:
    summary: "Sets the enable state of a source filter."
    params:
      canvas_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
      filter_name: { type: string, required: true }
      filter_enabled: { type: bool, required: true }
    returns: ack

  get_version:
    summary: "Gets data about the current plugin and RPC version."
    returns: value

  get_stats:
    summary: "Gets statistics about OBS, obs-websocket, and the current session."
    returns: value

  broadcast_custom_event:
    summary: "Broadcasts a `CustomEvent` to all WebSocket clients. Receivers are clients which are identified and subscribed."
    params:
      event_data: { type: json, required: true }
    returns: ack

  call_vendor_request:
    summary: "Call a request registered to a vendor. A vendor is a unique name registered by a third-party plugin or script, which allows for custom requests and events to be added to obs-websocket. If a plugin or script implements vendor requests or events, documentation is expected to be provided with them."
    params:
      vendor_name: { type: string, required: true }
      request_type: { type: string, required: true }
      request_data: { type: json }
    returns: value

  get_hotkey_list:
    summary: "Gets an array of all hotkey names in OBS. Note: Hotkey functionality in obs-websocket comes as-is, and we do not guarantee support if things are broken. In 9/10 usages of hotkey requests, there exists a better, more reliable method via other requests."
    returns: value

  trigger_hotkey_by_name:
    summary: "Triggers a hotkey using its name. See `GetHotkeyList`. Note: Hotkey functionality in obs-websocket comes as-is, and we do not guarantee support if things are broken. In 9/10 usages of hotkey requests, there exists a better, more reliable method via other requests."
    params:
      hotkey_name: { type: string, required: true }
      context_name: { type: string }
    returns: ack

  trigger_hotkey_by_key_sequence:
    summary: "Triggers a hotkey using a sequence of keys. Note: Hotkey functionality in obs-websocket comes as-is, and we do not guarantee support if things are broken. In 9/10 usages of hotkey requests, there exists a better, more reliable method via other requests. key_modifiers is an object with shift, control, alt, command."
    params:
      key_id: { type: string }
      key_modifiers: { type: json }
    returns: ack

  sleep:
    summary: "Sleeps for a time duration or number of frames. Only available in request batches with types `SERIAL_REALTIME` or `SERIAL_FRAME`."
    params:
      sleep_millis: { type: float, min: 0, max: 50000 }
      sleep_frames: { type: float, min: 0, max: 10000 }
    returns: ack

  get_input_list:
    summary: "Gets an array of all inputs in OBS."
    params:
      input_kind: { type: string }
    returns: value

  get_input_kind_list:
    summary: "Gets an array of all available input kinds in OBS."
    params:
      unversioned: { type: bool }
    returns: value

  get_special_inputs:
    summary: "Gets the names of all special inputs."
    returns: value

  create_input:
    summary: "Creates a new input, adding it as a scene item to the specified scene."
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      input_name: { type: string, required: true }
      input_kind: { type: string, required: true }
      input_settings: { type: json }
      scene_item_enabled: { type: bool }
    returns: value

  remove_input:
    summary: "Removes an existing input. Note: Will immediately remove all associated scene items."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: ack

  set_input_name:
    summary: "Sets the name of an input (rename)."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      new_input_name: { type: string, required: true }
    returns: ack

  get_input_default_settings:
    summary: "Gets the default settings for an input kind."
    params:
      input_kind: { type: string, required: true }
    returns: value

  get_input_settings:
    summary: "Gets the settings of an input. Note: Does not include defaults. To create the entire settings object, overlay `inputSettings` over the `defaultInputSettings` provided by `GetInputDefaultSettings`."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: value

  set_input_settings:
    summary: "Sets the settings of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      input_settings: { type: json, required: true }
      overlay: { type: bool }
    returns: ack

  get_input_mute:
    summary: "Gets the audio mute state of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: value

  set_input_mute:
    summary: "Sets the audio mute state of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      input_muted: { type: bool, required: true }
    returns: ack

  toggle_input_mute:
    summary: "Toggles the audio mute state of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: value

  get_input_volume:
    summary: "Gets the current volume setting of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: value

  set_input_volume:
    summary: "Sets the volume setting of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      input_volume_mul: { type: float, min: 0, max: 20 }
      input_volume_db: { type: float, min: -100, max: 26 }
    returns: ack

  get_input_audio_balance:
    summary: "Gets the audio balance of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: value

  set_input_audio_balance:
    summary: "Sets the audio balance of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      input_audio_balance: { type: float, min: 0.0, max: 1.0, required: true }
    returns: ack

  get_input_audio_sync_offset:
    summary: "Gets the audio sync offset of an input. Note: The audio sync offset can be negative too!"
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: value

  set_input_audio_sync_offset:
    summary: "Sets the audio sync offset of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      input_audio_sync_offset: { type: float, min: -950, max: 20000, required: true }
    returns: ack

  get_input_audio_monitor_type:
    summary: "Gets the audio monitor type of an input. The available audio monitor types are: - `OBS_MONITORING_TYPE_NONE` - `OBS_MONITORING_TYPE_MONITOR_ONLY` - `OBS_MONITORING_TYPE_MONITOR_AND_OUTPUT`"
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: value

  set_input_audio_monitor_type:
    summary: "Sets the audio monitor type of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      monitor_type: { type: string, required: true }
    returns: ack

  get_input_audio_tracks:
    summary: "Gets the enable state of all audio tracks of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: value

  set_input_audio_tracks:
    summary: "Sets the enable state of audio tracks of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      input_audio_tracks: { type: json, required: true }
    returns: ack

  get_input_deinterlace_mode:
    summary: "Gets the deinterlace mode of an input. Deinterlace Modes: - `OBS_DEINTERLACE_MODE_DISABLE` - `OBS_DEINTERLACE_MODE_DISCARD` - `OBS_DEINTERLACE_MODE_RETRO` - `OBS_DEINTERLACE_MODE_BLEND` - `OBS_DEINTERLACE_MODE_BLEND_2X` - `OBS_DEINTERLACE_MODE_LINEAR` - `OBS_DEINTERLACE_MODE_LINEAR_2X` - `OBS_DEINTERLACE_MODE_YADIF` - `OBS_DEINTERLACE_MODE_YADIF_2X` Note: Deinterlacing functionality is restricted to async inputs only. (obs-websocket 5.6.0 and later.)"
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: value

  set_input_deinterlace_mode:
    summary: "Sets the deinterlace mode of an input. Note: Deinterlacing functionality is restricted to async inputs only. (obs-websocket 5.6.0 and later.)"
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      input_deinterlace_mode: { type: string, required: true }
    returns: ack

  get_input_deinterlace_field_order:
    summary: "Gets the deinterlace field order of an input. Deinterlace Field Orders: - `OBS_DEINTERLACE_FIELD_ORDER_TOP` - `OBS_DEINTERLACE_FIELD_ORDER_BOTTOM` Note: Deinterlacing functionality is restricted to async inputs only. (obs-websocket 5.6.0 and later.)"
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: value

  set_input_deinterlace_field_order:
    summary: "Sets the deinterlace field order of an input. Note: Deinterlacing functionality is restricted to async inputs only. (obs-websocket 5.6.0 and later.)"
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      input_deinterlace_field_order: { type: string, required: true }
    returns: ack

  get_input_properties_list_property_items:
    summary: "Gets the items of a list property from an input's properties. Note: Use this in cases where an input provides a dynamic, selectable list of items. For example, display capture, where it provides a list of available displays."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      property_name: { type: string, required: true }
    returns: value

  press_input_properties_button:
    summary: "Presses a button in the properties of an input. Some known `propertyName` values are: - `refreshnocache` - Browser source reload button Note: Use this in cases where there is a button in the properties of an input that cannot be accessed in any other way. For example, browser sources, where there is a refresh button."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      property_name: { type: string, required: true }
    returns: ack

  get_media_input_status:
    summary: "Gets the status of a media input. Media States: - `OBS_MEDIA_STATE_NONE` - `OBS_MEDIA_STATE_PLAYING` - `OBS_MEDIA_STATE_OPENING` - `OBS_MEDIA_STATE_BUFFERING` - `OBS_MEDIA_STATE_PAUSED` - `OBS_MEDIA_STATE_STOPPED` - `OBS_MEDIA_STATE_ENDED` - `OBS_MEDIA_STATE_ERROR`"
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: value

  set_media_input_cursor:
    summary: "Sets the cursor position of a media input. This request does not perform bounds checking of the cursor position."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      media_cursor: { type: float, min: 0, required: true }
    returns: ack

  offset_media_input_cursor:
    summary: "Offsets the current cursor position of a media input by the specified value. This request does not perform bounds checking of the cursor position."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      media_cursor_offset: { type: float, required: true }
    returns: ack

  trigger_media_input_action:
    summary: "Triggers an action on a media input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
      media_action: { type: string, required: true }
    returns: ack

  get_virtual_cam_status:
    summary: "Gets the status of the virtualcam output."
    returns: value

  toggle_virtual_cam:
    summary: "Toggles the state of the virtualcam output."
    returns: value

  start_virtual_cam:
    summary: "Starts the virtualcam output."
    returns: ack

  stop_virtual_cam:
    summary: "Stops the virtualcam output."
    returns: ack

  get_replay_buffer_status:
    summary: "Gets the status of the replay buffer output."
    returns: value

  toggle_replay_buffer:
    summary: "Toggles the state of the replay buffer output."
    returns: value

  start_replay_buffer:
    summary: "Starts the replay buffer output."
    returns: ack

  stop_replay_buffer:
    summary: "Stops the replay buffer output."
    returns: ack

  save_replay_buffer:
    summary: "Saves the contents of the replay buffer output."
    returns: ack

  get_last_replay_buffer_replay:
    summary: "Gets the filename of the last replay buffer save file."
    returns: value

  get_output_list:
    summary: "Gets the list of available outputs."
    returns: value

  get_output_status:
    summary: "Gets the status of an output."
    params:
      output_name: { type: string, required: true }
    returns: value

  toggle_output:
    summary: "Toggles the status of an output."
    params:
      output_name: { type: string, required: true }
    returns: value

  start_output:
    summary: "Starts an output."
    params:
      output_name: { type: string, required: true }
    returns: ack

  stop_output:
    summary: "Stops an output."
    params:
      output_name: { type: string, required: true }
    returns: ack

  get_output_settings:
    summary: "Gets the settings of an output."
    params:
      output_name: { type: string, required: true }
    returns: value

  set_output_settings:
    summary: "Sets the settings of an output."
    params:
      output_name: { type: string, required: true }
      output_settings: { type: json, required: true }
    returns: ack

  get_record_status:
    summary: "Gets the status of the record output."
    returns: value

  toggle_record:
    summary: "Toggles the status of the record output."
    returns: value

  start_record:
    summary: "Starts the record output."
    returns: ack

  stop_record:
    summary: "Stops the record output."
    returns: value

  toggle_record_pause:
    summary: "Toggles pause on the record output."
    returns: ack

  pause_record:
    summary: "Pauses the record output."
    returns: ack

  resume_record:
    summary: "Resumes the record output."
    returns: ack

  split_record_file:
    summary: "Splits the current file being recorded into a new file. (obs-websocket 5.5.0 and later.)"
    returns: ack

  create_record_chapter:
    summary: "Adds a new chapter marker to the file currently being recorded. Note: As of OBS 30.2.0, the only file format supporting this feature is Hybrid MP4. (obs-websocket 5.5.0 and later.)"
    params:
      chapter_name: { type: string }
    returns: ack

  get_scene_item_list:
    summary: "Gets a list of all scene items in a scene. Scenes only"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
    returns: value

  get_group_scene_item_list:
    summary: "Basically GetSceneItemList, but for groups. Using groups at all in OBS is discouraged, as they are very broken under the hood. Please use nested scenes instead. Groups only"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
    returns: value

  get_scene_item_id:
    summary: "Searches a scene for a source, and returns its id. Scenes and Groups"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      source_name: { type: string, required: true }
      search_offset: { type: float, min: -1 }
    returns: value

  get_scene_item_source:
    summary: "Gets the source associated with a scene item. (obs-websocket 5.4.0 and later.)"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
    returns: value

  create_scene_item:
    summary: "Creates a new scene item using a source. Scenes only"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
      scene_item_enabled: { type: bool }
    returns: value

  remove_scene_item:
    summary: "Removes a scene item from a scene. Scenes only"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
    returns: ack

  duplicate_scene_item:
    summary: "Duplicates a scene item, copying all transform and crop info. Scenes only"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
      destination_scene_name: { type: string }
      destination_scene_uuid: { type: string }
    returns: value

  get_scene_item_transform:
    summary: "Gets the transform and crop info of a scene item. Scenes and Groups"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
    returns: value

  set_scene_item_transform:
    summary: "Sets the transform and crop info of a scene item."
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
      scene_item_transform: { type: json, required: true }
    returns: ack

  get_scene_item_enabled:
    summary: "Gets the enable state of a scene item. Scenes and Groups"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
    returns: value

  set_scene_item_enabled:
    summary: "Sets the enable state of a scene item. Scenes and Groups"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
      scene_item_enabled: { type: bool, required: true }
    returns: ack

  get_scene_item_locked:
    summary: "Gets the lock state of a scene item. Scenes and Groups"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
    returns: value

  set_scene_item_locked:
    summary: "Sets the lock state of a scene item. Scenes and Group"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
      scene_item_locked: { type: bool, required: true }
    returns: ack

  get_scene_item_index:
    summary: "Gets the index position of a scene item in a scene. An index of 0 is at the bottom of the source list in the UI. Scenes and Groups"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
    returns: value

  set_scene_item_index:
    summary: "Sets the index position of a scene item in a scene. Scenes and Groups"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
      scene_item_index: { type: float, min: 0, required: true }
    returns: ack

  get_scene_item_blend_mode:
    summary: "Gets the blend mode of a scene item. Blend modes: - `OBS_BLEND_NORMAL` - `OBS_BLEND_ADDITIVE` - `OBS_BLEND_SUBTRACT` - `OBS_BLEND_SCREEN` - `OBS_BLEND_MULTIPLY` - `OBS_BLEND_LIGHTEN` - `OBS_BLEND_DARKEN` Scenes and Groups"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
    returns: value

  set_scene_item_blend_mode:
    summary: "Sets the blend mode of a scene item. Scenes and Groups"
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      scene_item_id: { type: float, min: 0, required: true }
      scene_item_blend_mode: { type: string, required: true }
    returns: ack

  get_scene_list:
    summary: "Gets an array of scenes in OBS."
    params:
      canvas_uuid: { type: string }
    returns: value

  get_group_list:
    summary: "Gets an array of all groups in OBS. Groups in OBS are actually scenes, but renamed and modified. In obs-websocket, we treat them as scenes where we can."
    returns: value

  get_current_program_scene:
    summary: "Gets the current program scene. Note 1: This request is slated to have the `currentProgram`-prefixed fields removed from in an upcoming RPC version. Note 2: Canvases do not have any concept of a program or preview scene, so this request does not support canvases."
    returns: value

  set_current_program_scene:
    summary: "Sets the current program scene."
    params:
      scene_name: { type: string }
      scene_uuid: { type: string }
    returns: ack

  get_current_preview_scene:
    summary: "Gets the current preview scene. Only available when studio mode is enabled. Note: This request is slated to have the `currentPreview`-prefixed fields removed from in an upcoming RPC version."
    returns: value

  set_current_preview_scene:
    summary: "Sets the current preview scene. Only available when studio mode is enabled."
    params:
      scene_name: { type: string }
      scene_uuid: { type: string }
    returns: ack

  create_scene:
    summary: "Creates a new scene in OBS."
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string, required: true }
    returns: value

  remove_scene:
    summary: "Removes a scene from OBS."
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
    returns: ack

  set_scene_name:
    summary: "Sets the name of a scene (rename)."
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      new_scene_name: { type: string, required: true }
    returns: ack

  get_scene_scene_transition_override:
    summary: "Gets the scene transition overridden for a scene. Note: A transition UUID response field is not currently able to be implemented as of 2024-1-18."
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
    returns: value

  set_scene_scene_transition_override:
    summary: "Sets the scene transition overridden for a scene."
    params:
      canvas_uuid: { type: string }
      scene_name: { type: string }
      scene_uuid: { type: string }
      transition_name: { type: string }
      transition_duration: { type: float, min: 50, max: 20000 }
    returns: ack

  get_source_active:
    summary: "Gets the active and show state of a source. **Compatible with inputs and scenes.**"
    params:
      canvas_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
    returns: value

  get_source_screenshot:
    summary: "Gets a Base64-encoded screenshot of a source. The `imageWidth` and `imageHeight` parameters are treated as \"scale to inner\", meaning the smallest ratio will be used and the aspect ratio of the original resolution is kept. If `imageWidth` and `imageHeight` are not specified, the compressed image will use the full resolution of the source. **Compatible with inputs and scenes.**"
    params:
      canvas_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
      image_format: { type: string, required: true }
      image_width: { type: float, min: 8, max: 4096 }
      image_height: { type: float, min: 8, max: 4096 }
      image_compression_quality: { type: float, min: -1, max: 100 }
    returns: value

  save_source_screenshot:
    summary: "Saves a screenshot of a source to the filesystem. The `imageWidth` and `imageHeight` parameters are treated as \"scale to inner\", meaning the smallest ratio will be used and the aspect ratio of the original resolution is kept. If `imageWidth` and `imageHeight` are not specified, the compressed image will use the full resolution of the source. **Compatible with inputs and scenes.**"
    params:
      canvas_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
      image_format: { type: string, required: true }
      image_file_path: { type: string, required: true }
      image_width: { type: float, min: 8, max: 4096 }
      image_height: { type: float, min: 8, max: 4096 }
      image_compression_quality: { type: float, min: -1, max: 100 }
    returns: ack

  get_stream_status:
    summary: "Gets the status of the stream output."
    returns: value

  toggle_stream:
    summary: "Toggles the status of the stream output."
    returns: value

  start_stream:
    summary: "Starts the stream output."
    returns: ack

  stop_stream:
    summary: "Stops the stream output."
    returns: ack

  send_stream_caption:
    summary: "Sends CEA-608 caption text over the stream output."
    params:
      caption_text: { type: string, required: true }
    returns: ack

  get_transition_kind_list:
    summary: "Gets an array of all available transition kinds. Similar to `GetInputKindList`"
    returns: value

  get_scene_transition_list:
    summary: "Gets an array of all scene transitions in OBS."
    returns: value

  get_current_scene_transition:
    summary: "Gets information about the current scene transition."
    returns: value

  set_current_scene_transition:
    summary: "Sets the current scene transition. Small note: While the namespace of scene transitions is generally unique, that uniqueness is not a guarantee as it is with other resources like inputs."
    params:
      transition_name: { type: string, required: true }
    returns: ack

  set_current_scene_transition_duration:
    summary: "Sets the duration of the current scene transition, if it is not fixed."
    params:
      transition_duration: { type: float, min: 50, max: 20000, required: true }
    returns: ack

  set_current_scene_transition_settings:
    summary: "Sets the settings of the current scene transition."
    params:
      transition_settings: { type: json, required: true }
      overlay: { type: bool }
    returns: ack

  get_current_scene_transition_cursor:
    summary: "Gets the cursor position of the current scene transition. Note: `transitionCursor` will return 1.0 when the transition is inactive."
    returns: value

  trigger_studio_mode_transition:
    summary: "Triggers the current scene transition. Same functionality as the `Transition` button in studio mode."
    returns: ack

  set_t_bar_position:
    summary: "Sets the position of the TBar. **Very important note**: This will be deprecated and replaced in a future version of obs-websocket."
    params:
      position: { type: float, min: 0.0, max: 1.0, required: true }
      release: { type: bool }
    returns: ack

  get_studio_mode_enabled:
    summary: "Gets whether studio is enabled."
    returns: value

  set_studio_mode_enabled:
    summary: "Enables or disables studio mode"
    params:
      studio_mode_enabled: { type: bool, required: true }
    returns: ack

  open_input_properties_dialog:
    summary: "Opens the properties dialog of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: ack

  open_input_filters_dialog:
    summary: "Opens the filters dialog of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: ack

  open_input_interact_dialog:
    summary: "Opens the interact dialog of an input."
    params:
      input_name: { type: string }
      input_uuid: { type: string }
    returns: ack

  get_monitor_list:
    summary: "Gets a list of connected monitors and information about them."
    returns: value

  open_video_mix_projector:
    summary: "Opens a projector for a specific output video mix. Mix types: - `OBS_WEBSOCKET_VIDEO_MIX_TYPE_PREVIEW` - `OBS_WEBSOCKET_VIDEO_MIX_TYPE_PROGRAM` - `OBS_WEBSOCKET_VIDEO_MIX_TYPE_MULTIVIEW` Note: This request serves to provide feature parity with 4.x. It is very likely to be changed/deprecated in a future release."
    params:
      video_mix_type: { type: string, required: true }
      monitor_index: { type: float }
      projector_geometry: { type: string }
    returns: ack

  open_source_projector:
    summary: "Opens a projector for a source. Note: This request serves to provide feature parity with 4.x. It is very likely to be changed/deprecated in a future release."
    params:
      canvas_uuid: { type: string }
      source_name: { type: string }
      source_uuid: { type: string }
      monitor_index: { type: float }
      projector_geometry: { type: string }
    returns: ack

state:
  device.obs_version:          { type: string, description: "OBS Studio version" }
  device.websocket_version:    { type: string, description: "obs-websocket version" }
  device.platform:             { type: string, description: "Operating system OBS runs on" }
  program_scene:               { type: string, description: "Scene on program" }
  preview_scene:               { type: string, description: "Scene on preview; absent when studio mode is off" }
  studio_mode:                 { type: bool, description: "Studio mode" }
  scenes:                      { type: array, description: "Scene names, top of the list first" }
  transition.name:             { type: string, description: "Current scene transition" }
  transition.duration_ms:      { type: int, unit: ms, description: "Current transition duration, when the transition has one" }
  streaming.active:            { type: bool, description: "Streaming output running" }
  streaming.reconnecting:      { type: bool, description: "Streaming output reconnecting" }
  streaming.duration_ms:       { type: int, unit: ms, description: "Time streaming, polled every 5 s" }
  streaming.congestion:        { type: float, description: "Output congestion, 0-1, polled" }
  streaming.bytes:             { type: int, unit: bytes, description: "Bytes sent, polled" }
  streaming.skipped_frames:    { type: int, description: "Frames skipped by the output, polled" }
  streaming.total_frames:      { type: int, description: "Frames delivered by the output, polled" }
  recording.active:            { type: bool, description: "Recording output running" }
  recording.paused:            { type: bool, description: "Recording paused" }
  recording.duration_ms:       { type: int, unit: ms, description: "Time recording, polled" }
  recording.bytes:             { type: int, unit: bytes, description: "Bytes written, polled" }
  virtualcam.active:           { type: bool, description: "Virtual camera running" }
  inputs.*.muted:              { type: bool, description: "Input muted, keyed by input name; audio inputs only" }
  inputs.*.volume_db:          { type: float, unit: dB, description: "Input volume, keyed by input name; audio inputs only" }

quirks:
  - models: [all]
    severity: warning
    text: >
      A wrong password is not retried. OBS closes the connection with code
      4009; the core reports unauthorized and sends nothing further until the
      device is opened again with a corrected password.

  - models: [all]
    severity: info
    text: >
      set_current_preview_scene and trigger_studio_mode_transition need studio
      mode. Without it, OBS refuses them with request status 506 (studio mode
      not active), reported as a device error. Every refusal carries OBS's own
      status code and comment.

  - models: [all]
    severity: info
    text: >
      Inputs are keyed by name, and OBS lets a user rename them. A rename is
      reported as the old name removed and the new name added.

  - models: [all]
    severity: info
    text: >
      OBS 27 and earlier shipped obs-websocket 4, a different protocol on port
      4444, unless the version 5 plugin was installed. Only version 5 is
      supported.
