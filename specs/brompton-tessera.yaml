quirks:
  - models: [all]
    severity: warning
    text: >
      IP control must be enabled in the Live Control tile of the processor's
      user interface, and it is saved in the project; until then the API does
      not answer. With no project loaded, requests fail with "No project
      loaded" (API 3.5.2 sections 1 and 2).

  - models: [all]
    severity: info
    text: >
      A failed request answers {"response-code": "<error>"}, where the error is
      one of: Path not found, Bad operation, Not supported, Missing input
      parameter, Bad input parameter type, Bad input parameter value, Access
      denied, No project loaded, Object not found, Operation failed (API 3.5.2
      sections 2 and 4). The reference does not give the HTTP status of a
      failure, so every command requires status 200 and a body without
      "response-code".

  - models: [all]
    severity: info
    text: >
      Paths, tags and commands are case-insensitive. Writes go as PUT with the
      body {"data": value} and Content-Type application/json (API 3.5.2
      section 4); the older GET <path>?set=<value> form is used only by
      set_input_source, which sets port type and number in one request.

  - models: [all]
    severity: warning
    text: >
      Endpoints a processor's hardware lacks answer "Not supported": genlock
      sources, ShutterSync, frame remapping, hidden markers, failover and cable
      redundancy depend on the model and its licences, and the reference does
      not say which model has which, except for the input ports (by the
      comparison table), the temperature sensors and the FPGA fan (by the
      reference's own notes), which each model's supports list follows.

  - models: [all]
    severity: info
    text: >
      State is read by polling, because the processor does not push. Brompton
      advises against polling large amounts of data several times a second
      (API 3.5.2 section 1, "Polling"); the whole tree is read every 5 seconds,
      against the Companion module's once a second. On a wall with thousands
      of panels the devices subtree makes that reply large.

  - models: [all]
    severity: info
    text: >
      Groups, presets, input ports, cable loops, frame remapping frames and
      frame store frames are keyed by number in the tree. Telemetry can only
      read fixed JSON paths, so the poll keeps groups 1 to 8, input ports 1
      and 2, cable loops 1 and 2 and frame remapping frames 1 to 4 current;
      other numbers are updated from the replies to the session's own reads
      and writes of single endpoints. Preset names and status, device types
      and firmware, frame store frames and DynaCal panel-type settings are not
      polled; read them with get_presets, get_devices and the get_ commands.

  - models: [all]
    severity: critical
    text: >
      recall_preset applies a stored preset to the live wall at once
      (brightness, colour, test pattern and the other settings the preset
      holds). There is no undo; recall the previous preset to go back.

  - models: [all]
    severity: critical
    text: >
      set_blackout_enabled, set_freeze_enabled and set_test_pattern_enabled
      act on the live output immediately. Blackout fades over the blackout
      fade time (0 to 10 s, set_blackout_fade_time).

  - models: [all]
    severity: critical
    text: >
      reboot and shutdown take the wall dark: shutdown cannot be undone over
      the network, and reboot leaves the wall without video until the
      processor has started again. When a processor password is set it must
      be in the processor_password setting; the reference does not say what a
      wrong one answers.

  - models: [all]
    severity: critical
    text: >
      request_failover hands output to the failover partner processor. It
      needs failover enabled and a partner present (get_failover_is_partner_present).

  - models: [all]
    severity: critical
    text: >
      frame_store_capture overwrites a frame already stored under that user
      number, and frame_store_delete removes one; neither can be undone (API
      3.5.2, capture-frame).

  - models: [all]
    severity: warning
    text: >
      Output brightness -1 resets it to the common maximum the connected
      fixtures can reach. When a brightness limit is on (read-only
      brightness-limit endpoints), brightness cannot exceed the limit value;
      the reference does not say whether a higher value is refused or held at
      the limit.

  - models: [all]
    severity: info
    text: >
      The test pattern type takes either a pattern name (set_test_pattern_type)
      or a frame store user number, 1 to 50 (set_test_pattern_frame_store);
      the state override.test_pattern.type holds whichever was set.

  - models: [all]
    severity: info
    text: >
      The deprecated output/network/startracker endpoints (moved under
      hidden-markers/startracker in 3.5 and marked for removal) are kept as
      commands for processors on 3.3 and 3.4; once Brompton removes them they
      will answer Path not found. The input/active refresh rate and resolution endpoints were
      removed in 3.4 and are not included; each port's meta-data endpoints
      replace them.

  - models: [all]
    severity: info
    text: >
      The 3D LUT (.cube) and custom hidden marker (PNG) uploads take a binary
      request body (Content-Type application/cube or application/png); the spec
      format sends text bodies only, so they are not included.

  - models: [all]
    severity: info
    text: >
      TrueLight endpoints are from the 3.6.0 Beta 1 reference only; the
      current stable release (3.5.2) answers Path not found to them.

  - models: [all]
    severity: info
    text: >
      Integer endpoints are signed 16-bit (-32768 to 32767) and strings up to
      128 UTF-8 characters (API 3.5.2 section 2). Brightness, colour
      temperature and the other integer endpoints were floats in 3.1; values
      are sent as integers.
