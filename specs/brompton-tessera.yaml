commands:
  get_device_firmware:
    summary: "Read device N firmware"
    params:
      serial: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$", required: true }
    send: { method: GET, path: "/api/devices/items/{serial}/firmware" }
    expect: { status: 200, json_path: "$.firmware" }
    returns: value

  get_device_type:
    summary: "Read device N type"
    params:
      serial: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$", required: true }
    send: { method: GET, path: "/api/devices/items/{serial}/type" }
    expect: { status: 200, json_path: "$.type" }
    returns: value

  get_devices_associated_count:
    summary: "Read devices associated count (0 to 2200)"
