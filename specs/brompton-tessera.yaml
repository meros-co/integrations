telemetry:
  # The processor does not push. GET /api/ returns the whole API tree under
  # an "api" key (Brompton's own Companion module reads it this way once a
  # second); it is read every 5 seconds. Group, port, cable loop and frame
  # remapping keys are named by number in that tree, and a rule cannot iterate
  # an object's keys, so groups 1-8, ports 1-2, cable loops 1-2 and frames 1-4
  # are read from it; any other group, port or frame is kept current by the
  # replies to the session's own commands and reads, which every endpoint rule
  # below also takes.
  poll:
    send:
      - { method: GET, path: /api/ }
    every_ms: 5000
  updates:
    # GET /api/: devices
    - path: "^/api/?$"
      json:
        v0: "$.api.devices.statistics.associated-count"
        v1: "$.api.devices.statistics.error-count"
        v2: "$.api.devices.statistics.online-count"
      state:
        devices.statistics.associated_count: "{v0}"
        devices.statistics.error_count: "{v1}"
        devices.statistics.online_count: "{v2}"
    # GET /api/: groups
    - path: "^/api/?$"
      json:
        v0: "$.api.groups.items.1.brightness"
        v1: "$.api.groups.items.2.brightness"
        v2: "$.api.groups.items.3.brightness"
        v3: "$.api.groups.items.4.brightness"
        v4: "$.api.groups.items.5.brightness"
        v5: "$.api.groups.items.6.brightness"
        v6: "$.api.groups.items.7.brightness"
        v7: "$.api.groups.items.8.brightness"
        v8: "$.api.groups.items.1.brightness-limit.enabled"
        v9: "$.api.groups.items.2.brightness-limit.enabled"
        v10: "$.api.groups.items.3.brightness-limit.enabled"
        v11: "$.api.groups.items.4.brightness-limit.enabled"
        v12: "$.api.groups.items.5.brightness-limit.enabled"
        v13: "$.api.groups.items.6.brightness-limit.enabled"
        v14: "$.api.groups.items.7.brightness-limit.enabled"
        v15: "$.api.groups.items.8.brightness-limit.enabled"
        v16: "$.api.groups.items.1.brightness-limit.value"
        v17: "$.api.groups.items.2.brightness-limit.value"
        v18: "$.api.groups.items.3.brightness-limit.value"
        v19: "$.api.groups.items.4.brightness-limit.value"
        v20: "$.api.groups.items.5.brightness-limit.value"
        v21: "$.api.groups.items.6.brightness-limit.value"
        v22: "$.api.groups.items.7.brightness-limit.value"
        v23: "$.api.groups.items.8.brightness-limit.value"
        v24: "$.api.groups.items.1.colour-temperature"
        v25: "$.api.groups.items.2.colour-temperature"
        v26: "$.api.groups.items.3.colour-temperature"
        v27: "$.api.groups.items.4.colour-temperature"
