commands:
  get_device_firmware:
    summary: "Read device N firmware"
    params:
      serial: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$", required: true, label: Device serial, description: "Serial number of the device (panel or receiver) as it appears in the processor's devices list, which get_devices reads." }
    send: { method: GET, path: "/api/devices/items/{serial}/firmware" }
    expect: { status: 200, json_path: "$.firmware" }
    returns: value

  get_device_type:
    summary: "Read device N type"
    params:
      serial: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$", required: true, label: Device serial, description: "Serial number of the device (panel or receiver) as it appears in the processor's devices list, which get_devices reads." }
    send: { method: GET, path: "/api/devices/items/{serial}/type" }
