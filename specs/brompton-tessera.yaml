spec: 1
id: brompton-tessera
name: Brompton Tessera LED processors (IP Control API)
vendor: Brompton Technology
category: display

# Tessera's IP Control API is a tree of endpoints under /api on port 80. A
# value is read with GET /api/<path>, which answers {"<last segment>": value},
# and written with PUT /api/<path> and the body {"data": value}, which answers
# with the new value in the same shape. A failure answers
# {"response-code": "<error>"}. Every endpoint the 3.5.2 reference lists is a
# command here: set_<path> for each writable endpoint, get_<path> for each
# read-only one, and get_<section> for a whole section (a directory read).
# Writable endpoints are read from the whole-tree poll and from the replies
# to the session's own requests. Endpoint ranges are the reference's.

source:
  - title: Tessera Processing IP Control API, software version 3.5.2 (TesseraIPControlAPI3_5_2_r2.pdf)
    author: Brompton Technology
    url: https://dl.bromptontech.com/tessera/docs/TesseraIPControlAPI3_5_2_r2.pdf
    note: >
      Manufacturer document, published 2025-06-20 (page 1), linked from the
      Tessera 3.5.2 release page (https://www.bromptontech.com/release/tessera-3-5-2/),
      the current stable release on Brompton's downloads page. Used for every
      endpoint path, data type, range, unit, decimal places, enumeration and
      access specifier (section 3, "Full endpoint reference", pages 8-68); the
      error list (section 2); HTTP usage (section 4: the /api root, GET to read,
      PUT with {"data": value} to write, the GET ?set= alternative, the
      response-code error body, setting several endpoints at once, JSON arrays
      for frames-enabled-on, byte array uploads); and the polling advice
      (section 1). Cited as API 3.5.2.
  - title: Tessera Processing IP Control API, software version 3.6.0 Beta 1 (TesseraIPControlAPI3_6_0_Beta1.pdf)
    author: Brompton Technology
    url: https://dl.bromptontech.com/tessera/docs/TesseraIPControlAPI3_6_0_Beta1.pdf
    note: >
      Manufacturer document for the 3.6.0 Beta 1 release (2025-04-04, page
      https://www.bromptontech.com/release/tessera-v3-6-beta/). Compared
      endpoint by endpoint with 3.5.2: it adds the TrueLight endpoints (global
      and per group), which are marked "(3.6.0 Beta 1)" here. Cited as API 3.6.0b1.
  - title: Tessera Processing IP Control API, software versions 3.1.0 Beta 4 and 3.3.1
    author: Brompton Technology
    url: https://dl.bromptontech.com/tessera/docs/TesseraIPControlAPI3_3_1.pdf
    note: >
      Earlier manufacturer documents, read for history: 3.1.0 Beta 4 (in the
      Companion module repository, docs/TesseraIPControlAPI3_1_0_Beta4.pdf)
      shows the reply to a directory write, and the telnet interface on TCP
      23; 3.3.1 shows the devices subtree (formerly panels). The changelog in
      API 3.5.2 (page 2) gives when each subtree was added, moved or removed.
  - title: Tessera User Manual, "IP Control"
    author: Brompton Technology
    url: https://www.bromptontech.com/online-help/Content/Tessera%20User%20Manual/03.%20Feature%20Topics/13.2.7%20-%20IP%20Control.htm
    note: >
      Manufacturer online help: IP control over HTTP on port 80 and telnet on
      port 23, enabled in the processor's Live Control tile.
  - title: Tessera LED Processors, 2020 comparison table
    author: Brompton Technology
    url: https://www.bromptontech.com/wp-content/uploads/2020/10/Processor-Comparison-Table-2020.pdf
    note: >
      Manufacturer document. Used for each model's video inputs (SX40 and S8:
      HDMI 2.0 and 12G-SDI; S4 and T1: DVI; M2: DVI and two 3G-SDI), which
      decide which input port commands each model supports.
  - title: companion-module-brompton-tessera (Bitfocus Companion module, MIT)
    author: Brompton Technology and Bitfocus contributors
    url: https://github.com/bitfocus/companion-module-brompton-tessera
    note: >
      MIT licence (top-level LICENSE). Read, not copied, as corroboration:
      index.js reads the whole tree with GET http://<ip>:80/api/ once a second
      and finds values under the "api" key, with groups keyed by number under
      api.groups.items (updateGroupDefinitions); it writes with GET <path>?set=.
      apiKeys.js lists the same paths as API 3.5.2, plus a misspelt
      "hightlight-out-of-gamut-pixels-enabled" for 3.4.

transport:
  type: http
  port: 80
  scheme: http
  auth: none
  timeout_ms: 4000
  probe: { method: GET, path: /api/system/software-version }

settings:
  processor_password: { type: string, secret: true, default: "" }

ports:
  - { port: 80, protocol: http, role: control }

