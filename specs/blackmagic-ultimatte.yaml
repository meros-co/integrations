spec: 1
id: blackmagic-ultimatte
name: Blackmagic Ultimatte 12
vendor: Blackmagic Design
category: switcher

source:
  - title: Ultimatte 12 Operations Manual (February 2026), Developer Information, Blackmagic Ultimatte 12 Ethernet Protocol version 2.3
    author: Blackmagic Design
    url: https://documents.blackmagicdesign.com/UserManuals/Ultimatte12Manual.pdf
    note: >
      Manufacturer-documented, and the source of every block and command here. TCP 9998
      and the netcat examples (backing color, factory defaults, matte density) (p.85);
      blocks ended by a blank line, unknown blocks and lines to be ignored, the preamble,
      IDENTITY, NETWORK and NETWORK INTERFACE blocks (p.86); VERSION and DEVICE with the
      inputs each model has (p.87); IP VIDEO, VIDEO FORMATS, the status dump of CONTROL,
      CONTROL DEFAULT, CURRENT FILE, FILE LIST, GPI LIST, IMAGE LIST, FRAME BUFFER and
      CAMERA CONTROL blocks, END PRELUDE (p.88-89); status updates holding only changed
      items, requesting changes, ACK and NAK, relative Offset changes (p.89-90); status
      requests, FILE load, save, delete and rename (p.90); GPI event lists (p.90-91);
      Frame Buffer and Camera Control (p.91); the Controls table with ranges, values and
      model footnotes (p.92-100). The Controls table's ranges are printed two rows below
      the control they belong to; they are read here with that offset, which agrees with
      the footnotes (for example Tally Active is the read-only On/Off control, and 3G SDI
      level takes A/B).
  - title: companion-module-bmd-ultimatte (Bitfocus Companion module)
    author: Bitfocus
    url: https://github.com/bitfocus/companion-module-bmd-ultimatte
    note: >
      Community source (MIT licence), read as corroboration only. It sends every control
      in a CONTROL block, including Backing Color, Monitor Out and Video Format, sends
      functions such as Sample Wall as Yes, uses the same 0-10000 ranges, lists a PING
      header, and names the quick memories Quick Load and Quick Save where the document
      writes Quickload and Quicksave.

transport:
  type: line-tcp
  port: 9998
  framing: block
  encoding: utf-8
  timeout_ms: 2000
  reply: expected
  reply_match: ^(ACK|NAK)

ports:
  - {port: 9998, protocol: tcp, role: control}

models:
  - id: ultimatte-12-4k
    name: Blackmagic Ultimatte 12 4K
    supports:
      [set_level, offset_level, set_window_position, set_correct_size, set_matte_process,
       set_gpi_delay, set_transition_rate, set_fg_input_frame_delay, set_output_offset,
       set_switch, quickload, quicksave, set_backing_color, set_monitor_out,
       set_layer_order, set_video_format, set_ly_in_mix_mode, set_filter_mode,
       set_filter_median, set_filter_average, set_3g_sdi_level, set_color_space,
       set_gp_out_level, set_output_range, run_function, factory_defaults, user_defaults,
       set_input_source, set_ip_output_enable, load_file, save_file, delete_file,
       rename_file, gpi_insert_event, gpi_remove_event, gpi_set_index, set_frame_buffer,
       set_frame_buffer_enable, request_status, ping]
    verification: none
    notes: >
      12G-SDI keyer with bidirectional 2110 IP video on its 10G Ethernet port (p.10,
      p.19).
  - id: ultimatte-12-8k
    name: Blackmagic Ultimatte 12 8K
    supports:
      [set_level, offset_level, set_window_position, set_correct_size, set_matte_process,
       set_gpi_delay, set_transition_rate, set_fg_input_frame_delay, set_output_offset,
       set_switch, quickload, quicksave, set_backing_color, set_monitor_out,
       set_layer_order, set_video_format, set_ly_in_mix_mode, set_filter_mode,
       set_filter_median, set_filter_average, set_3g_sdi_level, set_color_space,
       set_gp_out_level, set_output_range, run_function, factory_defaults, user_defaults,
       load_file, save_file, delete_file, rename_file, gpi_insert_event, gpi_remove_event,
       gpi_set_index, set_frame_buffer, set_frame_buffer_enable, request_status, ping]
    verification: none
    notes: >
      8K keyer; 4320p formats and the 0-6 correction size range (p.100 footnotes 1 and 4).
  - id: ultimatte-12-hd
    name: Blackmagic Ultimatte 12 HD
    supports:
      [set_level, offset_level, set_window_position, set_correct_size, set_matte_process,
       set_gpi_delay, set_transition_rate, set_fg_input_frame_delay, set_output_offset,
       set_switch, quickload, quicksave, set_backing_color, set_monitor_out,
       set_layer_order, set_video_format, set_ly_in_mix_mode, set_filter_mode,
       set_filter_median, set_filter_average, set_3g_sdi_level, set_color_space,
       set_gp_out_level, set_output_range, run_function, factory_defaults, user_defaults,
       load_file, save_file, delete_file, rename_file, gpi_insert_event, gpi_remove_event,
       gpi_set_index, set_frame_buffer, set_frame_buffer_enable, request_status, ping]
    verification: none
    notes: >
      HD keyer with FG, BG, garbage and holdout matte, monitor and reference inputs
      (p.87). Controls marked ** in the document are not available.
  - id: ultimatte-12-hd-mini
    name: Blackmagic Ultimatte 12 HD Mini
    supports:
      [set_level, offset_level, set_window_position, set_correct_size, set_matte_process,
       set_transition_rate, set_fg_input_frame_delay, set_output_offset, set_switch,
       quickload, quicksave, set_backing_color, set_monitor_out, set_layer_order,
       set_video_format, set_ly_in_mix_mode, set_filter_mode, set_filter_median,
       set_filter_average, set_3g_sdi_level, set_output_range, run_function,
       factory_defaults, user_defaults, load_file, save_file, delete_file, rename_file,
       set_frame_buffer, set_frame_buffer_enable, set_ccu_camera_id, request_status, ping]
    verification: none
    notes: >
      Compact HD keyer with FG and BG inputs only, no GPI and no PsF formats, and SDI/HDMI
      camera control (p.87-88, p.91, p.100). Controls marked * or ** in the document are
      not available.
  - id: ultimatte-12
    name: Blackmagic Ultimatte 12
    supports:
      [set_level, offset_level, set_window_position, set_correct_size, set_matte_process,
       set_gpi_delay, set_transition_rate, set_fg_input_frame_delay, set_output_offset,
       set_switch, quickload, quicksave, set_backing_color, set_monitor_out,
       set_layer_order, set_video_format, set_ly_in_mix_mode, set_filter_mode,
       set_filter_median, set_filter_average, set_3g_sdi_level, set_color_space,
       set_gp_out_level, set_output_range, run_function, factory_defaults, user_defaults,
       load_file, save_file, delete_file, rename_file, gpi_insert_event, gpi_remove_event,
       gpi_set_index, set_frame_buffer, set_frame_buffer_enable, request_status, ping]
    verification: none
    notes: >
      The original Ultimatte 12 (4K, with loop outputs for the garbage and holdout matte
      inputs, p.100 footnote 3); protocol 1.2 units take 0-3 correction sizes (footnote
      1).

commands:
  set_level:
    summary: Set a numeric control (matte, cleanup, colour, ambiance, lighting, window and matte processing levels), 0-10000
    params:
      control: {type: enum, values: [Matte Density, Black Gloss, Blue Density, Green Density, Red Density, Shadow Level, Shadow Threshold, Cursor X, Cursor Y, Cursor 2 X, Cursor 2 Y, Veil Master, Veil Red, Veil Green, Veil Blue, Wall Color Red, Wall Color Green, Wall Color Blue, Floor Color Red, Floor Color Green, Floor Color Blue, Cleanup Level, Cleanup Dark Recover, Cleanup Light Recover, Cleanup Strength, GM Cleanup Level, GM Cleanup Dark Recover, GM Cleanup Light Recover, GM Cleanup Strength, Correction Level, Noise Level, Black Balance, Gray Balance, White Balance, Flare Level, Cool, Skin Tone, Light Warm, Dark Warm, Ambiance Master, Ambiance Red, Ambiance Green, Ambiance Blue, Ambiance Strength, Direct Light Red, Direct Light Green, Direct Light Blue, Direct Light Mix, Vertical Blur, FG Saturation Red, FG Saturation Green, FG Saturation Blue, FG Saturation Master, FG Contrast Red, FG Contrast Green, FG Contrast Blue, FG Contrast Master, FG Black Red, FG Black Green, FG Black Blue, FG Black Master, FG White Red, FG White Green, FG White Blue, FG White Master, FG Contrast Crossover, Fade Mix, BG Saturation Red, BG Saturation Green, BG Saturation Blue, BG Saturation Master, BG Contrast Red, BG Contrast Green, BG Contrast Blue, BG Contrast Master, BG Black Red, BG Black Green, BG Black Blue, BG Black Master, BG White Red, BG White Green, BG White Blue, BG White Master, BG Contrast Crossover, BG Filter, Test Signal Master, Test Signal Red, Test Signal Green, Test Signal Blue, LY Saturation Red, LY Saturation Green, LY Saturation Blue, LY Saturation Master, LY Contrast Red, LY Contrast Green, LY Contrast Blue, LY Contrast Master, LY Black Red, LY Black Green, LY Black Blue, LY Black Master, LY White Red, LY White Green, LY White Blue, LY White Master, LY Contrast Crossover, LY Filter, LY Test Signal Master, LY Test Signal Red, LY Test Signal Green, LY Test Signal Blue, LY Fade Mix, Lighting Level Red, Lighting Level Green, Lighting Level Blue, Lighting Level Master, Lighting Minimum Level, Window Softness Top, Window Softness Bottom, Window Softness Left, Window Softness Right, Window Skew Top, Window Skew Bottom, Window Skew Left, Window Skew Right, Window Skew Offset Top, Window Skew Offset Bottom, Window Skew Offset Left, Window Skew Offset Right, BM Filter, BM Input Level, BM Input Offset, GM Filter, GM Input Level, GM Input Offset, HM Filter, HM Input Level, HM Input Offset, LM Filter, LM Input Level, LM Input Offset, Noise Cursor X, Noise Cursor Y, FG Input U Position, FG Input V Position, FG Input UV Position, Talent Highlight Level, Monitor Highlight Level, Matte Out Level], required: true, label: Control, description: 'The control to set, by its protocol name; some are not on every model (see quirks).'}
      value: {type: int, min: 0, max: 10000, required: true, label: Value, description: Control value from 0 to 10000 on the control's own scale.}
    send: |
      CONTROL:
      {control}: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.89 Requesting Changes;
    # p.92-97 Controls, 0-10000

  offset_level:
    summary: Change a numeric control by a relative amount
    params:
      control: {type: enum, values: [Matte Density, Black Gloss, Blue Density, Green Density, Red Density, Shadow Level, Shadow Threshold, Cursor X, Cursor Y, Cursor 2 X, Cursor 2 Y, Veil Master, Veil Red, Veil Green, Veil Blue, Wall Color Red, Wall Color Green, Wall Color Blue, Floor Color Red, Floor Color Green, Floor Color Blue, Cleanup Level, Cleanup Dark Recover, Cleanup Light Recover, Cleanup Strength, GM Cleanup Level, GM Cleanup Dark Recover, GM Cleanup Light Recover, GM Cleanup Strength, Correction Level, Noise Level, Black Balance, Gray Balance, White Balance, Flare Level, Cool, Skin Tone, Light Warm, Dark Warm, Ambiance Master, Ambiance Red, Ambiance Green, Ambiance Blue, Ambiance Strength, Direct Light Red, Direct Light Green, Direct Light Blue, Direct Light Mix, Vertical Blur, FG Saturation Red, FG Saturation Green, FG Saturation Blue, FG Saturation Master, FG Contrast Red, FG Contrast Green, FG Contrast Blue, FG Contrast Master, FG Black Red, FG Black Green, FG Black Blue, FG Black Master, FG White Red, FG White Green, FG White Blue, FG White Master, FG Contrast Crossover, Fade Mix, BG Saturation Red, BG Saturation Green, BG Saturation Blue, BG Saturation Master, BG Contrast Red, BG Contrast Green, BG Contrast Blue, BG Contrast Master, BG Black Red, BG Black Green, BG Black Blue, BG Black Master, BG White Red, BG White Green, BG White Blue, BG White Master, BG Contrast Crossover, BG Filter, Test Signal Master, Test Signal Red, Test Signal Green, Test Signal Blue, LY Saturation Red, LY Saturation Green, LY Saturation Blue, LY Saturation Master, LY Contrast Red, LY Contrast Green, LY Contrast Blue, LY Contrast Master, LY Black Red, LY Black Green, LY Black Blue, LY Black Master, LY White Red, LY White Green, LY White Blue, LY White Master, LY Contrast Crossover, LY Filter, LY Test Signal Master, LY Test Signal Red, LY Test Signal Green, LY Test Signal Blue, LY Fade Mix, Lighting Level Red, Lighting Level Green, Lighting Level Blue, Lighting Level Master, Lighting Minimum Level, Window Softness Top, Window Softness Bottom, Window Softness Left, Window Softness Right, Window Skew Top, Window Skew Bottom, Window Skew Left, Window Skew Right, Window Skew Offset Top, Window Skew Offset Bottom, Window Skew Offset Left, Window Skew Offset Right, BM Filter, BM Input Level, BM Input Offset, GM Filter, GM Input Level, GM Input Offset, HM Filter, HM Input Level, HM Input Offset, LM Filter, LM Input Level, LM Input Offset, Noise Cursor X, Noise Cursor Y, FG Input U Position, FG Input V Position, FG Input UV Position, Talent Highlight Level, Monitor Highlight Level, Matte Out Level], required: true, label: Control, description: 'The control to change, by its protocol name.'}
      delta: {type: int, min: -10000, max: 10000, required: true, label: Change, description: 'Amount to add (or, negative, subtract) on the control''s 0-10000 scale.'}
    send: |
      CONTROL:
      Offset {control}: {delta}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.89, relative mode (Offset
    # Matte Density: 10)

  set_window_position:
    summary: Set a window edge position; the range depends on the video format
    params:
      control: {type: enum, values: [Window Position Top, Window Position Bottom, Window Position Left, Window Position Right], required: true, label: Window edge, description: Which window edge to place.}
      value: {type: int, min: 0, max: 7680, required: true, label: Position, description: 'Edge position from 0; the maximum depends on the video format, and the unit refuses a value beyond it.'}
    send: |
      CONTROL:
      {control}: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.95, Window Position,
    # 0-{Based on Video Format}

  set_correct_size:
    summary: Set a matte, veil or flare correction size
    params:
      control: {type: enum, values: [Matte Correct Horizontal Size, Matte Correct Vertical Size, Veil Correct Horizontal Size, Veil Correct Vertical Size, Flare Correct Horizontal Size, Flare Correct Vertical Size], required: true, label: Correction size, description: 'Horizontal or vertical size of the matte, veil or flare correction.'}
      value: {type: int, min: 0, max: 6, required: true, label: Size, description: 'Correction size step, 0 to 6 on Ultimatte 12 8K with protocol 2.0 and later; Matte Correct Vertical Size and Ultimatte 12 units with protocol 1.2 accept 0 to 3.'}
    send: |
      CONTROL:
      {control}: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.92-93, Controls, footnote
    # 1

  set_matte_process:
    summary: Set a matte input's horizontal or vertical processing size, 0-3
    params:
      control: {type: enum, values: [BM Process Horizontal, BM Process Vertical, GM Process Horizontal, GM Process Vertical, HM Process Horizontal, HM Process Vertical, LM Process Horizontal, LM Process Vertical], required: true, label: Matte processing, description: 'Horizontal or vertical processing of the background (BM), garbage (GM), holdout (HM) or layer (LM) matte input.'}
      value: {type: int, min: 0, max: 3, required: true, label: Processing, description: 'Processing size, 0 to 3.'}
    send: |
      CONTROL:
      {control}: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.95-96, Controls

  set_gpi_delay:
    summary: Set a GPI input or output delay
    params:
      control: {type: enum, values: [GP Out Delay, GP 1 Input Delay, GP 2 Input Delay, GP 3 Input Delay, GP 4 Input Delay, GP 5 Input Delay], required: true, label: GPI delay, description: The GPI output delay or one GPI input's delay.}
      value: {type: int, min: 1, max: 120, required: true, label: Delay, description: Delay from 1 to 120 (frames is assumed; the document gives no unit).}
    send: |
      CONTROL:
      {control}: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.96, Controls

  set_transition_rate:
    summary: Set the transition rate, 1-120
    params:
      value: {type: int, min: 1, max: 120, required: true, label: Transition rate, description: Transition rate from 1 to 120 (frames is assumed; the document gives no unit).}
    send: |
      CONTROL:
      Transition Rate: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.95, Controls

  set_fg_input_frame_delay:
    summary: Delay the foreground input by up to 14 frames
    params:
      value: {type: int, min: 0, max: 14, required: true, label: Frame delay, description: 'Foreground input delay in frames, 0 to 14.'}
    send: |
      CONTROL:
      FG Input Frame Delay: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.96, Controls

  set_output_offset:
    summary: Set the output offset, -1500 to +1500
    params:
      value: {type: int, min: -1500, max: 1500, required: true, label: Output offset, description: 'Output offset from -1500 to +1500, 0 unchanged.'}
    send: |
      CONTROL:
      Output Offset: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.96, Controls, -1500-+1500

  set_switch:
    summary: Turn an on/off control on or off (matte, freeze, window, input and output switches)
    params:
      control: {type: enum, values: [Matte Enable, Screen Correct, GM Cleanup Enable, Noise Enable, Noise Cursor Enable, FG Freeze, FG Advanced Contrast Enable, Advanced Flare Enable, HM Flare Enable, Ambiance Enable, BG Gradient Enable, BG Freeze, BG Advanced Contrast Enable, BG Test Signal Enable, LY Input Enable, LY Advanced Contrast Enable, LY Freeze, LY Test Signal Enable, Lighting Enable, Window Enable, Window BM Enable, Window GM Enable, Window HM Enable, Window LM Enable, Window Invert, Wall Cursor Position Enable, Floor Cursor Position Enable, Dual Cursor, Manual Color Enable, BM Enable, BM Invert, BM Process Invert, BM Freeze, GM Enable, GM Invert, GM Process Invert, GM Freeze, HM Enable, HM Invert, HM Process Invert, HM Freeze, LM Invert, LM Process Invert, Monitor To Program, Monitor To Talent, Fill Linear Mix Correction, Talent Mirror, Monitor Cascade, Matte Out Invert, On Air Enable, On Air Lockout, Matte View Range, Matte View Invert, Monitor Out RGB, Monitor Out Red Only, Monitor Out Green Only, Monitor Out Blue Only, GP Out Save, GP 1 Input Enable, GP 2 Input Enable, GP 3 Input Enable, GP 4 Input Enable, GP 5 Input Enable, GP 1 High Enable, GP 2 High Enable, GP 3 High Enable, GP 4 High Enable, GP 5 High Enable], required: true, label: Control, description: 'The on/off control, by its protocol name; some are not on every model (see quirks).'}
      state: {type: enum, values: ['On', 'Off'], required: true, label: State, description: On or Off.}
    send: |
      CONTROL:
      {control}: {state}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.96-98, Controls, On/Off

  quickload:
    summary: 'Load a quick-save memory: the whole key setup changes at once'
    params:
      slot: {type: int, min: 1, max: 5, required: true, label: Memory, description: 'Quick-save memory to load, 1 to 5.'}
    send: |
      CONTROL:
      Quickload {slot}: On
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.98, Controls, Quickload
    # 1-5 On/Off

  quicksave:
    summary: Save the current setup to a quick-save memory, overwriting it
    params:
      slot: {type: int, min: 1, max: 5, required: true, label: Memory, description: 'Quick-save memory to overwrite, 1 to 5.'}
    send: |
      CONTROL:
      Quicksave {slot}: On
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.98, Controls, Quicksave
    # 1-5 On/Off

  set_backing_color:
    summary: Set the backing (screen) colour
    params:
      value: {type: enum, values: [Red, Green, Blue], required: true, label: Backing colour, description: The colour of the backing screen being keyed.}
    send: |
      CONTROL:
      Backing Color: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.85 example, p.99 Controls

  set_monitor_out:
    summary: Choose what the monitor output shows
    params:
      value: {type: enum, values: [Program, FG, BG, Combined Matte, Internal Matte, Fill, Layer In, Background Matte In, Garbage Matte In, Holdout Matte In, Layer Matte In, Processed LM, Processed HM, Processed GM, Processed BM, Screen Correction], required: true, label: Monitor output, description: 'The picture, matte or input shown on the monitor output.'}
    send: |
      CONTROL:
      Monitor Out: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.99, Controls

  set_layer_order:
    summary: Set the compositing order of foreground, layer and backgrounds
    params:
      value: {type: enum, values: [FG/Layer/BG Layer/BG, Layer/FG/BG Layer/BG, Layer/BG Layer/FG/BG, BG Layer/Layer/FG/BG, BG Layer/FG/Layer/BG, FG/BG Layer/Layer/BG, FG/BG Layer/BG, BG Layer/FG/BG, FG/Layer/BG, Layer/FG/BG], required: true, label: Layer order, description: 'Stacking order from top to bottom of the foreground (FG), layer, background layer and background (BG).'}
    send: |
      CONTROL:
      Layer Order: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.99, Controls

  set_video_format:
    summary: Set the video format, or auto detect; the outputs change format at once
    params:
      value: {type: enum, values: [Auto Detect, '525i59.94 NTSC 4:3', '625i50 PAL 4:3', 720p60, 720p59.94, 720p50, 1080i60, 1080i59.94, 1080i50, 1080p60, 1080p59.94, 1080p50, 1080p30, 1080p29.97, 1080p25, 1080p24, 1080p23.98, 1080PsF30, 1080PsF29.97, 1080PsF25, 1080PsF24, 1080PsF23.98, 2160p60, 2160p59.94, 2160p50, 2160p30, 2160p29.97, 2160p25, 2160p24, 2160p23.98, 4320p60, 4320p59.94, 4320p50, 4320p30, 4320p29.97, 4320p25, 4320p24, 4320p23.98], required: true, label: Video format, description: 'Video format, or Auto Detect; 4320p formats are Ultimatte 12 8K only and the HD Mini has no PsF formats.'}
    send: |
      CONTROL:
      Video Format: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.99, Controls, footnote 4

  set_ly_in_mix_mode:
    summary: Set how the layer input mixes
    params:
      value: {type: enum, values: [Realistic, Linear, Additive], required: true, label: Layer mix mode, description: 'How the layer input is combined: realistic, linear or additive.'}
    send: |
      CONTROL:
      LY In Mix Mode: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.99, Controls

  set_filter_mode:
    summary: Set the matte filter mode
    params:
      value: {type: enum, values: [Median, Average], required: true, label: Filter mode, description: Median or average filtering.}
    send: |
      CONTROL:
      Filter Mode: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.98, Controls

  set_filter_median:
    summary: Set the median filter amount, 0-4
    params:
      value: {type: int, min: 0, max: 4, required: true, label: Median filter, description: 'Median filter amount, 0 to 4.'}
    send: |
      CONTROL:
      Filter Median: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.99, Controls

  set_filter_average:
    summary: Set the average filter amount, 0-4
    params:
      value: {type: int, min: 0, max: 4, required: true, label: Average filter, description: 'Average filter amount, 0 to 4.'}
    send: |
      CONTROL:
      Filter Average: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.99, Controls

  set_3g_sdi_level:
    summary: Set the 3G-SDI output level
    params:
      value: {type: enum, values: [A, B], required: true, label: 3G-SDI level, description: '3G-SDI mapping, level A or B.'}
    send: |
      CONTROL:
      3G SDI level: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.98, Controls

  set_color_space:
    summary: Set the colour space
    params:
      value: {type: enum, values: [Rec.709, Rec.2020], required: true, label: Colour space, description: Rec.709 or Rec.2020.}
    send: |
      CONTROL:
      Color Space: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.98, Controls

  set_gp_out_level:
    summary: Set the GPI output's active level
    params:
      value: {type: enum, values: [High, Low], required: true, label: GPI output level, description: Whether the GPI output is active high or low.}
    send: |
      CONTROL:
      GP Out Level: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.99, Controls

  set_output_range:
    summary: Set the output range
    params:
      value: {type: enum, values: [Normal, Full], required: true, label: Output range, description: Normal (legal) or full range output.}
    send: |
      CONTROL:
      Output Range: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.99, Controls

  run_function:
    summary: 'Run a one-shot function: screen sampling, screen capture, noise select or a reset; the key changes at once'
    params:
      function: {type: enum, values: [Auto Screen Sample, Screen Capture, Noise Select, Sample Wall, Sample Floor, Matte Reset, Cleanup Reset, GM Cleanup Reset, FG Color Reset, BG Color Reset, Flare Reset, Ambiance Reset, BG Test Signal Color Reset, LY Color Reset, LY Test Signal Color Reset, Window Reset, Window Skew Reset, GP Out], required: true, label: Function, description: The function to run; the unit answers Yes when it is complete.}
    send: |
      CONTROL:
      {function}: Yes
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.99-100, Controls,
    # footnote 5 (send Yes to execute)

  factory_defaults:
    summary: Restore factory default settings and run an automatic composite
    send: |
      CONTROL:
      Factory Defaults: Yes
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.85 example 3, p.99
    # Controls

  user_defaults:
    summary: Restore the user default settings
    send: |
      CONTROL:
      User Defaults: Yes
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.99, Controls

  set_input_source:
    summary: Take the foreground from SDI or 2110 IP video (Ultimatte 12 4K)
    params:
      value: {type: enum, values: [SDI, IP2110], required: true, label: Foreground source, description: Foreground from the SDI input or from 2110 IP video on the Ethernet port.}
    send: |
      IP VIDEO:
      Input Source: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.87 IP Video block, p.99
    # Controls (SDI/IP2110)

  set_ip_output_enable:
    summary: Turn the 2110 IP video output on or off (Ultimatte 12 4K)
    params:
      value: {type: enum, values: ['On', 'Off'], required: true, label: 2110 output, description: On sends the output as 2110 IP video.}
    send: |
      IP VIDEO:
      Output Enable: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.87 IP Video block, p.99
    # Controls

  load_file:
    summary: 'Load a saved setup file: the whole key setup changes at once'
    params:
      name: {type: string, max_length: 64, pattern: '^[^:]+$', required: true, label: File, description: The file's name as listed in the file list.}
    send: |
      FILE:
      Load: {name}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.90, File System

  save_file:
    summary: Save the current setup to a file, overwriting one of that name
    params:
      name: {type: string, max_length: 64, pattern: '^[^:]+$', required: true, label: File, description: The file's name as listed in the file list.}
    send: |
      FILE:
      Save: {name}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.90, File System

  delete_file:
    summary: Delete a setup file
    params:
      name: {type: string, max_length: 64, pattern: '^[^:]+$', required: true, label: File, description: The file's name as listed in the file list.}
    send: |
      FILE:
      Delete: {name}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.90, File System

  rename_file:
    summary: Rename a setup file
    params:
      name: {type: string, max_length: 64, pattern: '^[^:]+$', required: true, label: File, description: The file's name as listed in the file list.}
      new_name: {type: string, max_length: 64, pattern: '^[^:]+$', required: true, label: New name, description: The file's new name.}
    send: |
      FILE:
      Rename: {name}
      To: {new_name}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.90, File System

  gpi_insert_event:
    summary: Insert a file into a GPI event list
    params:
      id: {type: int, min: 1, max: 5, required: true, label: GPI list, description: 'GPI event list ID, as in the GPI LIST block (1 in the document''s example).'}
      name: {type: string, max_length: 64, pattern: '^[^:]+$', required: true, label: File, description: The file's name as listed in the file list.}
      at: {type: int, min: -1, max: 255, default: -1, label: Position, description: 'Insertion index, or -1 for the end of the list.'}
    send: |
      GPI:
      ID: {id}
      Insert: {name}
      At: {at}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.90, GPI Event List

  gpi_remove_event:
    summary: Remove an event from a GPI event list, or all events
    params:
      id: {type: int, min: 1, max: 5, required: true, label: GPI list, description: 'GPI event list ID, as in the GPI LIST block (1 in the document''s example).'}
      index: {type: int, min: 0, max: 255, required: true, label: Event, description: Index of the event to remove; 0 removes every event.}
    send: |
      GPI:
      ID: {id}
      Remove: {index}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.90, GPI Event List

  gpi_set_index:
    summary: Set a GPI event list's current event
    params:
      id: {type: int, min: 1, max: 5, required: true, label: GPI list, description: 'GPI event list ID, as in the GPI LIST block (1 in the document''s example).'}
      index: {type: int, min: 0, max: 255, required: true, label: Event, description: Index of the event to make current.}
    send: |
      GPI:
      ID: {id}
      Index: {index}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.91, GPI Event List

  set_frame_buffer:
    summary: Assign a Media Pool image to a background frame buffer and enable it
    params:
      buffer: {type: enum, values: [BG 1, BG 2], required: true, label: Frame buffer, description: Background frame buffer 1 or 2.}
      image: {type: int, min: 1, max: 255, required: true, label: Image, description: 'Index of the image in the Media Pool (IMAGE LIST), from 1.'}
    send: |
      FRAME BUFFER:
      {buffer} Frame Buffer Index: {image}
      {buffer} Frame Buffer Enable: on
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.91, Frame Buffer

  set_frame_buffer_enable:
    summary: Enable or disable a background frame buffer
    params:
      buffer: {type: enum, values: [BG 1, BG 2], required: true, label: Frame buffer, description: Background frame buffer 1 or 2.}
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: 'on shows the assigned image, off disables the frame buffer.'}
    send: |
      FRAME BUFFER:
      {buffer} Frame Buffer Enable: {state}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.91, Frame Buffer

  set_ccu_camera_id:
    summary: Set the camera ID the Ultimatte 12 HD Mini uses for SDI camera control
    params:
      value: {type: int, min: 1, max: 99, required: true, label: Camera ID, description: 'SDI camera control ID, as on the camera (5 in the document''s example).'}
    send: |
      CAMERA CONTROL:
      CCU Camera Id: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.91, Camera Control

  request_status:
    summary: Ask the unit to resend one status block in full; it follows the ACK and updates state
    params:
      block: {type: enum, values: [IDENTITY, NETWORK, VERSION, DEVICE, IP VIDEO, VIDEO FORMATS, CONTROL, CONTROL DEFAULT, CURRENT FILE, FILE LIST, GPI LIST, IMAGE LIST, FRAME BUFFER, CAMERA CONTROL], required: true, label: Block, description: 'The status block to resend, by its header.'}
    send: '{block}:'
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), p.90, Requesting a Status
    # Dump

  ping:
    summary: Check that the unit is still responding
    send: 'PING:'
    expect: {matches: ^ACK}
    returns: ack
    # Ultimatte 12 Ethernet Protocol 2.3 (Ultimatte 12 manual, February 2026), not in the document; the
    # Videohub-style no-operation, see quirks

