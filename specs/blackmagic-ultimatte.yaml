      fields:
        CCU Camera Id: camera_control.ccu_camera_id
        CEC Camera Id: camera_control.cec_camera_id
        Camera Control Mode: camera_control.mode
    - header: ^GPI LIST:$
      fields:
        ID: gpi.list_id
        Index: gpi.index
    - header: ^MESSAGE:$
      fields:
        Warning: message.warning

