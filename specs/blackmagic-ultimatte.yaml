quirks:
  - models: [all]
    severity: critical
    text: >
      factory_defaults restores factory settings and runs an automatic composite (p.85);
      user_defaults, quickload, load_file and set_video_format change the whole key or
      output format at once on air, and run_function's screen samples and resets recompute
      the key at once. quicksave, save_file and delete_file overwrite or remove stored
      setups. None of them asks for confirmation.

  - models: [all]
    severity: warning
    text: >
      Replies are asynchronous: ACK means the request was understood, not that it
      happened. The unit then sends the changed block, or more blocks if other clients
      changed things at the same time, and only those update state (p.89). Updates hold
      only the items that changed. A file or GPI request is answered by ACK and then a
      list block or a MESSAGE block, for example Warning: Event limit exceeded (p.90-91).

  - models: [all]
    severity: warning
    text: >
      The Controls table prints each range two rows below the control it belongs to; this
      spec reads it with that offset, which matches the footnotes and the read-only Tally
      Active (see sources). Matte Correct Vertical Size reads 0-3 where the veil and flare
      vertical sizes read 0-6 with footnote 1. Window Position ranges depend on the video
      format; the parameter allows up to 7680 and the unit refuses more than the format
      allows. The unit's answer to a value out of its range is not documented.

  - models: [all]
    severity: warning
    text: >
      Model differences are per control, not per command: these are not available on the
      Ultimatte 12 HD Mini: GP Out Delay, GP 1 Input Delay, GP 2 Input Delay, GP 3 Input
      Delay, GP 4 Input Delay, GP 5 Input Delay, GM Freeze, HM Freeze, Fill Linear Mix
      Correction, Matte Out Invert, GP Out Save, GP 1 Input Enable, GP 2 Input Enable, GP
      3 Input Enable, GP 4 Input Enable, GP 5 Input Enable, GP 1 High Enable, GP 2 High
      Enable, GP 3 High Enable, GP 4 High Enable, GP 5 High Enable, Color Space, GP Out
      Level, GP Out. These are not available on the Ultimatte 12 HD or HD Mini: Talent
      Highlight Level, LY Freeze, BM Freeze, Monitor To Talent, Talent Mirror. The unit
      answers NAK or ignores a control it does not have; the document does not say which.

  - models: [all]
    severity: info
    text: >
      Functions are sent as Yes and the unit answers Yes when the function is complete
      (p.100 footnote 5); that answer arrives in a CONTROL block, not as the command's
      reply. Quickload and Quicksave are listed as On/Off controls (p.98); the commands
      send On. The community Companion module writes Quick Load and Quick Save; the
      document's spelling is used.

  - models: [all]
    severity: warning
    text: >
      The document does not describe PING for this protocol; ping sends the Videohub
      no-operation form, and no liveness probe is set. It shows only the BG 1 frame buffer
      commands (p.91); BG 2 follows the FRAME BUFFER block's numbering, and the layer and
      matte frame buffers' command names are not documented, so they are left out. The
      FRAME BUFFER example's enable command reads on for both enabling and disabling; off
      is sent to disable.

  - models: [ultimatte-12-4k]
    severity: warning
    text: >
      Input Source and Output Enable appear in the IP VIDEO block (p.87) and in the
      Controls table as SDI/IP2110 and On/Off (p.99), while the IP VIDEO example reports
      ip2110 and on in lower case. The commands send them in an IP VIDEO block in the
      table's form; a NAK means the unit wants them in a CONTROL block or in lower case.

  - models: [all]
    severity: info
    text: >
      The status dump on connecting ends with an END PRELUDE block (p.89). VIDEO FORMATS,
      FILE LIST, GPI LIST and IMAGE LIST carry plain lines (names) after their header; the
      spec format keys state by fixed field names, so those lists are not kept in state
      (request_status asks for them, and the raw block reaches the consumer's log only).
      CONTROL DEFAULT holds each control's default value and is not kept in state either.

  - models: [ultimatte-12-hd-mini]
    severity: info
    text: >
      The HD Mini has no GPI inputs and no GPI LIST block (p.88), and only it has the
      CAMERA CONTROL block for controlling a camera over SDI or HDMI (p.91).
