commands:
  get:
    summary: "Read any node or value of the tree once (method get); returns its payload: an object for a node, a value for a leaf. State is kept by subscription, not by this"
    params:
      path: { type: string, pattern: "^/[A-Za-z0-9_./-]*$", max_length: 512, required: true, label: Path, description: "Path in the Control API tree, such as /audio/mixers/0/faders/1/fader or /audio/routing/outputs." }
    send: '{"msgID":"get {path}","method":"get","path":"{path}"}'
    expect:
      reply_json: { "$.msgID": "get {path}" }
      json_equals: { "$.success": true }
      json_path: "$.payload"
    returns: value
  subscribe:
    summary: "Subscribe to a node or value (method subscribe); the device sends its current value, then every change, into state. The whole tree except /range is subscribed when monitoring"
    params:
      path: { type: string, pattern: "^/[A-Za-z0-9_./-]*$", max_length: 512, required: true, label: Path, description: "Path in the Control API tree, such as /audio/levels." }
    send: '{"msgID":"subscribe {path}","method":"subscribe","path":"{path}"}'
    expect:
      reply_json: { "$.msgID": "subscribe {path}" }
      json_equals: { "$.success": true }
    returns: ack
  unsubscribe:
    summary: "Stop the updates of a node or value on this connection (method unsubscribe), for example the meters under /audio/levels, until it reconnects"
    params:
      path: { type: string, pattern: "^/[A-Za-z0-9_./-]*$", max_length: 512, required: true, label: Path, description: "Path that was subscribed, such as /audio/levels." }
    send: '{"msgID":"unsubscribe {path}","method":"unsubscribe","path":"{path}"}'
    expect:
      reply_json: { "$.msgID": "unsubscribe {path}" }
      json_equals: { "$.success": true }
    returns: ack
  get_channel_snapshots:
    summary: "List the channel snapshots (RPC getsnapshotlist, type 1) into state; returns the list of {id, name, factory, readgroups, writegroups}"
    send: '{"msgID":"snapshots 1","method":"rpc","payload":{"method":"getsnapshotlist","params":{"type":1}}}'
    expect:
      reply_json: { "$.msgID": "snapshots 1" }
      json_equals: { "$.success": true }
      json_path: "$.payload.result"
    returns: value
  get_mixer_snapshots:
    summary: "List a virtual mixer's mixer snapshots (RPC getsnapshotlist, type 2) into state; returns the list of {id, name, factory, readgroups, writegroups}"
    params:
      mixer: { type: int, min: 0, default: 0, label: Virtual mixer, description: "Virtual mixer ID, from 0." }
    send: '{"msgID":"snapshots 2 {mixer}","method":"rpc","payload":{"method":"getsnapshotlist","params":{"type":2,"mixer":{mixer}}}}'
    expect:
      reply_json: { "$.msgID": "snapshots 2 {mixer}" }
      json_equals: { "$.success": true }
      json_path: "$.payload.result"
    returns: value
  get_processing_snapshots:
    summary: "List the flex processing snapshots (RPC getsnapshotlist, type 3) into state; returns the list of {id, name, factory, readgroups, writegroups}"
    send: '{"msgID":"snapshots 3","method":"rpc","payload":{"method":"getsnapshotlist","params":{"type":3}}}'
    expect:
      reply_json: { "$.msgID": "snapshots 3" }
      json_equals: { "$.success": true }
      json_path: "$.payload.result"
    returns: value
  load_channel_snapshot:
    summary: "Load a channel snapshot onto a fader (RPC loadsnapshot with fader)"
    params:
      mixer: { type: int, min: 0, default: 0, label: Virtual mixer, description: "Virtual mixer ID of the fader, from 0." }
      fader: { type: int, min: 0, required: true, label: Fader, description: "Fader ID the snapshot is loaded to." }
      id: { type: string, pattern: "^[A-Za-z0-9-]{1,64}$", required: true, label: Snapshot, description: "Snapshot ID (a UUID) from the channel snapshot list." }
    send: '{"msgID":"rpc loadsnapshot","method":"rpc","payload":{"method":"loadsnapshot","params":{"mixer":{mixer},"fader":{fader},"id":"{id}"}}}'
    expect:
      reply_json: { "$.msgID": "rpc loadsnapshot" }
      json_equals: { "$.success": true }
    returns: ack
  load_mixer_snapshot:
    summary: "Load a mixer snapshot into a virtual mixer (RPC loadsnapshot, type 2); id default loads the mixer's default snapshot (snapshot 0)"
    params:
      mixer: { type: int, min: 0, default: 0, label: Virtual mixer, description: "Virtual mixer ID, from 0." }
      id: { type: string, pattern: "^[A-Za-z0-9-]{1,64}$", required: true, label: Snapshot, description: "Snapshot ID (a UUID) from the mixer snapshot list, or default for snapshot 0." }
    send: '{"msgID":"rpc loadsnapshot","method":"rpc","payload":{"method":"loadsnapshot","params":{"type":2,"mixer":{mixer},"id":"{id}"}}}'
    expect:
      reply_json: { "$.msgID": "rpc loadsnapshot" }
      json_equals: { "$.success": true }
    returns: ack
  load_processing_snapshot:
    summary: "Load a flex processing snapshot onto a flex processing (RPC loadsnapshot with fp)"
    params:
      flexprocessing: { type: int, min: 0, required: true, label: Flex processing, description: "Flex processing ID the snapshot is loaded to." }
      id: { type: string, pattern: "^[A-Za-z0-9-]{1,64}$", required: true, label: Snapshot, description: "Snapshot ID (a UUID) from the processing snapshot list." }
    send: '{"msgID":"rpc loadsnapshot","method":"rpc","payload":{"method":"loadsnapshot","params":{"fp":{flexprocessing},"id":"{id}"}}}'
    expect:
      reply_json: { "$.msgID": "rpc loadsnapshot" }
      json_equals: { "$.success": true }
    returns: ack
  save_channel_snapshot:
    summary: "Save a fader's processing and routing as a channel snapshot (RPC savesnapshot, type 1): a new one when id is empty, else overwriting that snapshot. The snapshot lists are read again"
    params:
      mixer: { type: int, min: 0, default: 0, label: Virtual mixer, description: "Virtual mixer ID of the fader, from 0." }
      fader: { type: int, min: 0, required: true, label: Fader, description: "Fader ID the snapshot is made from." }
      id: { type: string, pattern: "^[A-Za-z0-9-]{0,64}$", default: "", label: Snapshot, description: "Snapshot ID (a UUID) to overwrite; empty creates a new snapshot." }
      name: { type: string, pattern: "^[^\"\\\\]{2,64}$", required: true, label: Name, description: "Name shown on the console, at least two characters." }
      writegroups: { type: int, min: 1, max: 255, required: true, label: Write groups, description: "Bitmask of the user groups 1-8 allowed to load and modify the snapshot (group 1 is 1, group 8 is 128)." }
      readgroups: { type: int, min: 0, max: 255, default: 0, label: Read groups, description: "Bitmask of the user groups allowed to load it; 0 lets every user, logged in or not." }
    send: '{"msgID":"rpc savesnapshot","method":"rpc","payload":{"method":"savesnapshot","params":{"type":1,"mixer":{mixer},"fader":{fader},"id":"{id}","name":{name:json},"writegroups":{writegroups},"readgroups":{readgroups}}}}'
    expect:
      reply_json: { "$.msgID": "rpc savesnapshot" }
      json_equals: { "$.success": true }
    returns: ack
  save_mixer_snapshot:
    summary: "Save a virtual mixer's whole state as a mixer snapshot (RPC savesnapshot, type 2): a new one when id is empty, else overwriting that snapshot (default overwrites snapshot 0). The snapshot lists are read again"
    params:
      mixer: { type: int, min: 0, default: 0, label: Virtual mixer, description: "Virtual mixer ID, from 0." }
      id: { type: string, pattern: "^[A-Za-z0-9-]{0,64}$", default: "", label: Snapshot, description: "Snapshot ID (a UUID) to overwrite, or default for snapshot 0; empty creates a new snapshot." }
      name: { type: string, pattern: "^[^\"\\\\]{2,64}$", required: true, label: Name, description: "Name shown on the console, at least two characters." }
      writegroups: { type: int, min: 1, max: 255, required: true, label: Write groups, description: "Bitmask of the user groups 1-8 allowed to load and modify the snapshot (group 1 is 1, group 8 is 128)." }
      readgroups: { type: int, min: 0, max: 255, default: 0, label: Read groups, description: "Bitmask of the user groups allowed to load it; 0 lets every user, logged in or not." }
    send: '{"msgID":"rpc savesnapshot","method":"rpc","payload":{"method":"savesnapshot","params":{"type":2,"mixer":{mixer},"id":"{id}","name":{name:json},"writegroups":{writegroups},"readgroups":{readgroups}}}}'
    expect:
      reply_json: { "$.msgID": "rpc savesnapshot" }
      json_equals: { "$.success": true }
    returns: ack
  save_processing_snapshot:
    summary: "Save a flex processing's parameters as a processing snapshot (RPC savesnapshot, type 3): a new one when id is empty, else overwriting that snapshot. The snapshot lists are read again"
    params:
      flexprocessing: { type: int, min: 0, required: true, label: Flex processing, description: "Flex processing ID the snapshot is made from." }
      id: { type: string, pattern: "^[A-Za-z0-9-]{0,64}$", default: "", label: Snapshot, description: "Snapshot ID (a UUID) to overwrite; empty creates a new snapshot." }
      name: { type: string, pattern: "^[^\"\\\\]{2,64}$", required: true, label: Name, description: "Name shown on the console, at least two characters." }
      writegroups: { type: int, min: 1, max: 255, required: true, label: Write groups, description: "Bitmask of the user groups 1-8 allowed to load and modify the snapshot (group 1 is 1, group 8 is 128)." }
      readgroups: { type: int, min: 0, max: 255, default: 0, label: Read groups, description: "Bitmask of the user groups allowed to load it; 0 lets every user, logged in or not." }
    send: '{"msgID":"rpc savesnapshot","method":"rpc","payload":{"method":"savesnapshot","params":{"type":3,"fp":{flexprocessing},"id":"{id}","name":{name:json},"writegroups":{writegroups},"readgroups":{readgroups}}}}'
    expect:
      reply_json: { "$.msgID": "rpc savesnapshot" }
      json_equals: { "$.success": true }
    returns: ack
  modify_snapshot:
    summary: "Rename a snapshot and set its user groups (RPC modifysnapshot); its content is unchanged and the default snapshot cannot be modified. The snapshot lists are read again"
    params:
      id: { type: string, pattern: "^[A-Za-z0-9-]{1,64}$", required: true, label: Snapshot, description: "Snapshot ID (a UUID) from a snapshot list." }
      name: { type: string, pattern: "^[^\"\\\\]{2,64}$", required: true, label: Name, description: "Name shown on the console, at least two characters." }
      writegroups: { type: int, min: 1, max: 255, required: true, label: Write groups, description: "Bitmask of the user groups 1-8 allowed to load and modify the snapshot (group 1 is 1, group 8 is 128)." }
      readgroups: { type: int, min: 0, max: 255, required: true, label: Read groups, description: "Bitmask of the user groups allowed to load it; 0 lets every user, logged in or not." }
    send: '{"msgID":"rpc modifysnapshot","method":"rpc","payload":{"method":"modifysnapshot","params":{"id":"{id}","name":{name:json},"readgroups":{readgroups},"writegroups":{writegroups}}}}'
    expect:
      reply_json: { "$.msgID": "rpc modifysnapshot" }
      json_equals: { "$.success": true }
    returns: ack
  remove_snapshot:
    summary: "Delete a snapshot (RPC removesnapshot); the default snapshot cannot be deleted. The snapshot lists are read again"
    params:
      id: { type: string, pattern: "^[A-Za-z0-9-]{1,64}$", required: true, label: Snapshot, description: "Snapshot ID (a UUID) from a snapshot list." }
    send: '{"msgID":"rpc removesnapshot","method":"rpc","payload":{"method":"removesnapshot","params":{"id":"{id}"}}}'
    expect:
      reply_json: { "$.msgID": "rpc removesnapshot" }
      json_equals: { "$.success": true }
    returns: ack
  get_snapshot:
    summary: "Fetch a snapshot's content to store or copy it (RPC getsnapshot); returns the snapshotdata object, which set_snapshot uploads unchanged"
    params:
      id: { type: string, pattern: "^[A-Za-z0-9-]{1,64}$", required: true, label: Snapshot, description: "Snapshot ID (a UUID) from a snapshot list, or default for a mixer's snapshot 0." }
      mixer: { type: int, min: 0, default: 0, label: Virtual mixer, description: "Virtual mixer whose default snapshot is fetched when id is default." }
    send: '{"msgID":"rpc getsnapshot","method":"rpc","payload":{"method":"getsnapshot","params":{"id":"{id}","mixer":{mixer}}}}'
    expect:
      reply_json: { "$.msgID": "rpc getsnapshot" }
      json_equals: { "$.success": true }
      json_path: "$.payload.result.snapshotdata"
    returns: value
  set_snapshot:
    summary: "Upload a snapshot's content as get_snapshot returned it, to this or another console (RPC setsnapshot, snapshotdata as DHD's RPC document describes it); it adds the snapshot or replaces the one with the same ID. The device refuses content that was changed. The snapshot lists are read again"
    params:
      snapshotdata: { type: json, required: true, label: Snapshot data, description: "The snapshotdata object exactly as get_snapshot returned it." }
    send: '{"msgID":"rpc setsnapshot","method":"rpc","payload":{"method":"setsnapshot","params":{"snapshotdata":{snapshotdata}}}}'
    expect:
      reply_json: { "$.msgID": "rpc setsnapshot" }
      json_equals: { "$.success": true }
    returns: ack
  fade_to_value:
    summary: "Fade a fader to a level over a time, fader-linear (RPC fadetovalue); the fader's level in state follows as it moves"
    params:
      mixer: { type: int, min: 0, default: 0, label: Virtual mixer, description: "Virtual mixer ID of the fader, from 0." }
      fader: { type: int, min: 0, required: true, label: Fader, description: "Fader ID to fade." }
      time: { type: float, min: 0, max: 30, required: true, label: Fade time, description: "Seconds the fade takes, in steps of 0.02 s." }
      value: { type: float, min: -160, max: 10, required: true, label: Level, description: "Target level in dB." }
    send: '{"msgID":"rpc fadetovalue","method":"rpc","payload":{"method":"fadetovalue","params":{"mixer":{mixer},"fader":{fader},"time":{time:.2f},"value":{value:.2f}}}}'
    expect:
      reply_json: { "$.msgID": "rpc fadetovalue" }
      json_equals: { "$.success": true }
    returns: ack
  set_channel_label:
    summary: "Set the label of a fader channel (source), wherever it is on a fader (RPC setchannellabel); empty restores the default label. Returns {sourceid, label, mixer} as the device reports it"
    params:
      sourceid: { type: int, min: 0, required: true, label: Source ID, description: "Fader channel source ID, unique in the device (a fader's sourceid)." }
      label: { type: string, max_length: 256, default: "", label: Label, description: "The label to show; empty restores the default." }
    send: '{"msgID":"rpc setchannellabel","method":"rpc","payload":{"method":"setchannellabel","params":{"sourceid":{sourceid},"label":{label:json}}}}'
    expect:
      reply_json: { "$.msgID": "rpc setchannellabel" }
      json_equals: { "$.success": true }
      json_path: "$.payload.result"
    returns: value
  register_ext_list:
    summary: "Create an external button list for a Remote Routing button list element in the console's views, or join it, and receive its button events (RPC registerextlist; licence 52-8583)"
    params:
      list: { type: int, min: 0, required: true, label: List, description: "Remote Routing button list ID as defined in Toolbox." }
    send: '{"msgID":"rpc registerextlist {list}","method":"rpc","payload":{"method":"registerextlist","params":{"list":{list}}}}'
    expect:
      reply_json: { "$.msgID": "rpc registerextlist {list}" }
      json_equals: { "$.success": true }
    returns: ack
  unregister_ext_list:
    summary: "Leave an external button list (RPC unregisterextlist); the device deletes it when no client is left on it"
    params:
      list: { type: int, min: 0, required: true, label: List, description: "Remote Routing button list ID as defined in Toolbox." }
    send: '{"msgID":"rpc unregisterextlist {list}","method":"rpc","payload":{"method":"unregisterextlist","params":{"list":{list}}}}'
    expect:
      reply_json: { "$.msgID": "rpc unregisterextlist {list}" }
      json_equals: { "$.success": true }
    returns: ack
  set_ext_list:
    summary: "Set the buttons of an external list (RPC setextlist); entries is the array DHD's RPC document describes: {label, background, color, pagination} per button"
    params:
      list: { type: int, min: 0, required: true, label: List, description: "Remote Routing button list ID as defined in Toolbox." }
      entries: { type: json, required: true, label: Buttons, description: "Array of buttons, each {label, background (true colors the background, false the text), color (RRGGBB hex), pagination (true starts a new page after it)}." }
    send: '{"msgID":"rpc setextlist {list}","method":"rpc","payload":{"method":"setextlist","params":{"list":{list},"entries":{entries}}}}'
    expect:
      reply_json: { "$.msgID": "rpc setextlist {list}" }
      json_equals: { "$.success": true }
    returns: ack
  set_ext_list_page:
    summary: "Set the buttons of an external list and jump to the page holding one of them (RPC setextlist with select)"
    params:
      list: { type: int, min: 0, required: true, label: List, description: "Remote Routing button list ID as defined in Toolbox." }
      select: { type: int, min: 0, required: true, label: Selected button, description: "Index of the button whose page the list shows, from 0." }
      entries: { type: json, required: true, label: Buttons, description: "Array of buttons, each {label, background (true colors the background, false the text), color (RRGGBB hex), pagination (true starts a new page after it)}." }
    send: '{"msgID":"rpc setextlist {list}","method":"rpc","payload":{"method":"setextlist","params":{"list":{list},"select":{select},"entries":{entries}}}}'
    expect:
      reply_json: { "$.msgID": "rpc setextlist {list}" }
      json_equals: { "$.success": true }
    returns: ack
  set_flex_agc_freeze:
