spec: 1
id: dhd-control-api
name: DHD audio XC3 / XD3 / XS3 / RM1 cores (Control API)
vendor: DHD audio
category: mixer

source:
  - title: "DHD Developer Documentation, version 10.4: Control API (overview)"
    author: DHD audio
    url: "https://developer.dhd.audio/docs/API/control-api/"
    note: >
      Read 2026-10-21. Firmware 10.3 and later on XC3, XD3, XS3 and RM1 cores; the tree of four nodes (audio,
      control, general, range), values beginning with _ read only, DHD tokens managed in the WebApps user
      management, TLS with the device's certificate, the REST rate limit of one request a second (so the
      websocket is used here), JSON-RPC-shaped messages.
  - title: "DHD Developer Documentation, version 10.4: Control API WebSocket Usage"
    author: DHD audio
    url: "https://developer.dhd.audio/docs/API/control-api/socket-usage"
    note: >
      ws://[device]/api/ws and wss://; msgID returned with the answer; methods auth (required first, and again on
      reconnecting), get, set (one value or several in one object), subscribe (current value sent at once,
      then update messages rooted at the tree's root, concurrent changes merged into one update) and
      unsubscribe; the failed authentication answer with error code 1281; a 60 s inactivity timeout and the
      advice to send something at least every 30 s.
  - title: "DHD Developer Documentation, version 10.4: Control API REST API Usage"
    author: DHD audio
    url: "https://developer.dhd.audio/docs/API/control-api/rest-usage"
    note: >
      The answer shapes for get and set ({method, path, payload, success}), out-of-range values set to the
      nearest possible value, the error object and the error codes (1100, 1200-1205, 1280 Unauthorized, 1281
      Invalid Token, 1290 Max Connections Exceeded, 1300).
  - title: "DHD Developer Documentation, version 10.4: Control API RPC Method"
    author: DHD audio
    url: "https://developer.dhd.audio/docs/API/control-api/rpc"
    note: >
      The rpc message shape and its answer; snapshot types 1-3 and user group bitmasks; getsnapshotlist,
      loadsnapshot (and the default snapshot), savesnapshot, modifysnapshot, removesnapshot, getsnapshot,
      setsnapshot; fadetovalue; setchannellabel; the external lists (registerextlist, unregisterextlist,
      setextlist, extlistnotified events; websocket only; license 52-8583).
  - title: "DHD control api - Core Devices, OpenAPI 3.0.3 document, version 1.2.0 (firmware 10.4)"
    author: DHD audio
    url: "https://developer.dhd.audio/redocusaurus/controlapi-cores.yaml"
    note: >
      Fetched 2026-10-21; the "OpenAPI documentation" page links it
      (https://developer.dhd.audio/docs/API/control-api/oapi). Every path of the tree, its type and
      description: the commands below are one per writable leaf (a name not beginning with _), and the state one
      key per leaf, both generated from this document.
  - title: "companion-module-dhdaudio-control-api"
    author: "Bitfocus and contributors (MIT licence)"
    url: "https://github.com/bitfocus/companion-module-dhdaudio-control-api"
    note: >
      Licence checked 2026-10-21 (MIT); not needed beyond DHD's own documents, which are complete for this
      spec, and no code was used.

transport:
  type: ws
  port: 80
  path: /api/ws
  scheme: { setting: scheme }
  timeout_ms: 3000
  reply: expected
  # Answered by the device; also keeps the socket inside its 60 s inactivity
  # timeout when nothing else moves.
  probe: '{"msgID":"probe","method":"get","path":"/general/_uptime"}'

settings:
  token: { type: string, secret: true, required: true, label: API token, description: "A DHD token created in the device's WebApps user management, sent with the auth message on every connection." }
  scheme: { type: enum, values: [ws, wss], default: ws, label: Scheme, description: "ws for an unencrypted connection, wss for TLS, which needs a certificate on the device that this computer trusts; give port 443 with wss." }

on_connect:
  - send: '{"msgID":"auth","method":"auth","token":{settings.token:json}}'
    await_reply: true
    refused: '"code":\s*128[01]\b'
    accepted: '"success":\s*"?true'

ports:
  - { port: 80, protocol: ws, role: control, when: "scheme ws" }
  - { port: 443, protocol: wss, role: control, when: "scheme wss", note: "give the port when opening the device" }

