quirks:
  - models: [all]
    severity: info
    text: >
      Everything goes over the websocket at /api/ws: the REST API is limited to one request a second and answers
      503 beyond it, and only the websocket pushes changes. After opening, the core sends the auth message with
      the token before anything else; an answer with error code 1280 (no token) or 1281 (invalid token) is a
      terminal refusal until the settings are corrected. A device already serving its maximum number of
      websockets (general._maxwebsockets) answers with error 1290.
  - models: [all]
    severity: info
    text: >
      When monitoring, the core subscribes to /audio, /control and /general; the device sends each node's
      current value at once and then every change as an update rooted at the tree's root, several changes merged
      into one message. That includes every meter (/audio/levels, /audio/loudness and each fader's meter), which
      change continuously: unsubscribe /audio/levels or /audio/loudness to stop them on this connection. /range
      (units and ranges of every value) is not subscribed: read it with get. Opened for commands only, nothing
      is subscribed or polled; the liveness probe (a get of /general/_uptime after 10 s of quiet) keeps the
      socket inside the device's 60 s inactivity timeout.
  - models: [all]
    severity: warning
    text: >
      A value outside its range is not refused: the device sets the nearest value it allows and answers with
      it, which each set command returns. The ranges are not in DHD's documents; the device's /range node gives
      them. A wrong type is refused with error 1204. State keys and command parameters use the device's own IDs
      (virtual mixers from 0, faders, buses, logics and so on as the device lists them), and the device's own
      names, the read-only ones beginning with _.
  - models: [all]
    severity: critical
    text: >
      load_channel_snapshot, load_mixer_snapshot and load_processing_snapshot replace a fader's, a whole virtual
      mixer's or a flex processing's settings at once, on air. save_*_snapshot with an id, remove_snapshot and
      set_snapshot overwrite or delete a stored snapshot without asking. set_fader_gain_again_inc changes the
      preamp gain by steps relative to its current value, so sending it twice doubles the change.
  - models: [all]
    severity: info
    text: >
      Snapshot lists have no change notification: they are read on connecting, every 60 s, and after a
      snapshot is saved, modified, removed or uploaded from this connection. Mixer snapshots are read for
      virtual mixer 0; get_mixer_snapshots reads another mixer's into state. A fader's and a mixer's last loaded
      snapshot are in the subscribed tree (_lastloadedsnap).
  - models: [all]
    severity: info
    text: >
      External lists exist only while a client is registered: they are deleted when every registered connection
      has closed, and are not registered again by the core after a reconnection. Button events reach only
      connections registered to the list. They need licence 52-8583 (XC/XS Core Control Networking).
  - models: [all]
    severity: info
    text: >
      Arrays in the tree (meters, plugin lists, source lists, channel categories, decay values) are kept in state
      as JSON text. Plugin parameters are keyed by the plugin's name as the device sends it (compressor, eq1,
      varfilter2 ...), so one state key covers that parameter of every plugin that has it; a fader's _paramlist
      gives its plugins in signal order.
