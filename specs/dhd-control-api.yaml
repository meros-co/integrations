telemetry:
  # The whole tree but /range (static units and ranges): the device sends
  # each node's current value at once, then every change.
  subscribe:
    send:
      - '{"msgID":"subscribe /audio","method":"subscribe","path":"/audio"}'
      - '{"msgID":"subscribe /control","method":"subscribe","path":"/control"}'
      - '{"msgID":"subscribe /general","method":"subscribe","path":"/general"}'
  # Snapshot lists change when anyone saves one; there is no update for them.
  poll:
    every_ms: 60000
    send:
      - '{"msgID":"snapshots 1","method":"rpc","payload":{"method":"getsnapshotlist","params":{"type":1}}}'
      - '{"msgID":"snapshots 2 0","method":"rpc","payload":{"method":"getsnapshotlist","params":{"type":2,"mixer":0}}}'
      - '{"msgID":"snapshots 3","method":"rpc","payload":{"method":"getsnapshotlist","params":{"type":3}}}'
  updates:
    - json_match: { "$.msgID": "^snapshots 1$", "$.success": "^true$" }
      json_each: "$.payload.result"
      json: { id: "$.id", name: "$.name", factory: "$.factory", readgroups: "$.readgroups", writegroups: "$.writegroups" }
      replace: snapshots.channel
      state:
        "snapshots.channel.{id:key}.name": "{name}"
        "snapshots.channel.{id:key}.factory": "{factory}"
        "snapshots.channel.{id:key}.readgroups": "{readgroups}"
        "snapshots.channel.{id:key}.writegroups": "{writegroups}"
    - json_match: { "$.msgID": "^snapshots 2 (\\d+)$", "$.success": "^true$" }
      json_each: "$.payload.result"
      json: { id: "$.id", name: "$.name", factory: "$.factory", readgroups: "$.readgroups", writegroups: "$.writegroups" }
      replace: "snapshots.mixers.{1}"
      state:
        "snapshots.mixers.{1}.{id:key}.name": "{name}"
        "snapshots.mixers.{1}.{id:key}.factory": "{factory}"
        "snapshots.mixers.{1}.{id:key}.readgroups": "{readgroups}"
        "snapshots.mixers.{1}.{id:key}.writegroups": "{writegroups}"
    - json_match: { "$.msgID": "^snapshots 3$", "$.success": "^true$" }
      json_each: "$.payload.result"
      json: { id: "$.id", name: "$.name", factory: "$.factory", readgroups: "$.readgroups", writegroups: "$.writegroups" }
      replace: snapshots.processing
      state:
        "snapshots.processing.{id:key}.name": "{name}"
        "snapshots.processing.{id:key}.factory": "{factory}"
        "snapshots.processing.{id:key}.readgroups": "{readgroups}"
        "snapshots.processing.{id:key}.writegroups": "{writegroups}"
    # A snapshot saved, changed or removed from here: read the lists again.
    - json_match: { "$.msgID": "^rpc (savesnapshot|modifysnapshot|removesnapshot|setsnapshot)$", "$.success": "^true$" }
      json: {}
      then_send:
        - '{"msgID":"snapshots 1","method":"rpc","payload":{"method":"getsnapshotlist","params":{"type":1}}}'
        - '{"msgID":"snapshots 2 0","method":"rpc","payload":{"method":"getsnapshotlist","params":{"type":2,"mixer":0}}}'
        - '{"msgID":"snapshots 3","method":"rpc","payload":{"method":"getsnapshotlist","params":{"type":3}}}'
    - json_match: { "$.method": "^event$", "$.payload.type": "^extlistnotified$" }
      json: { list: "$.payload.params.list", entry: "$.payload.params.entry", pressed: "$.payload.params.on" }
      state:
        "extlists.{list}.entries.{entry}.pressed": { value: "{pressed}", map: { "1": true, "0": false } }
    - json_match: { "$.method": "^update$" }
      json:
        "audio__channelcategories": "$.payload.audio._channelcategories"
        "general__activewebsockets": "$.payload.general._activewebsockets"
        "general__api_version": "$.payload.general._api_version"
        "general__firmware_version": "$.payload.general._firmware_version"
        "general__hardwareserial": "$.payload.general._hardwareserial"
        "general__hourmeter": "$.payload.general._hourmeter"
        "general__maxwebsockets": "$.payload.general._maxwebsockets"
        "general__sync2ok": "$.payload.general._sync2ok"
        "general__syncsource": "$.payload.general._syncsource"
        "general__systemfrequency": "$.payload.general._systemfrequency"
        "general__systemtime": "$.payload.general._systemtime"
        "general__uptime": "$.payload.general._uptime"
      state:
        "audio._channelcategories": "{audio__channelcategories}"
        "general._activewebsockets": "{general__activewebsockets}"
        "general._api_version": "{general__api_version}"
        "general._firmware_version": "{general__firmware_version}"
