  recall_scene:
    summary: Recall a scene from scene list A or B (ssrecallt_ex scene_a|scene_b); scene number as text
      "x.xx", 1.00-499.99 (scene_b in split mode only)
    params:
      bank:
        type: enum
        values:
          - a
          - b
        required: true
      scene:
        type: string
        pattern: ^[0-9]{1,3}\.[0-9]{2}$
        required: true
    send: ssrecallt_ex scene_{bank} "{scene}"
    expect:
      matches: ^OK ssrecallt_ex scene_[ab]
    returns: ack
  get_current_scene:
    summary: Read the current scene number of scene list A or B (sscurrentt_ex scene_a|scene_b)
    params:
      bank:
        type: enum
        values:
          - a
          - b
        required: true
    send: sscurrentt_ex scene_{bank}
    expect:
      matches: ^OK sscurrentt_ex scene_[ab] "?([0-9.]+)"?
    returns: value
  recall_next_scene:
    summary: Recall the next scene of scene list A or B (event MIXER:Lib/Scene/RecallInc; scene_b in split
      mode only)
    params:
      bank:
        type: enum
        values:
          - a
          - b
        required: true
    send: event MIXER:Lib/Scene/RecallInc scene_{bank}
    expect:
      matches: ^OK event MIXER:Lib/Scene/RecallInc
    returns: ack
  recall_previous_scene:
    summary: Recall the previous scene of scene list A or B (event MIXER:Lib/Scene/RecallDec; scene_b
      in split mode only)
    params:
      bank:
        type: enum
        values:
          - a
          - b
        required: true
    send: event MIXER:Lib/Scene/RecallDec scene_{bank}
    expect:
      matches: ^OK event MIXER:Lib/Scene/RecallDec
    returns: ack
  set_parameter:
    summary: Set any numeric parameter by its RCP address (raw value, as the console's parameter list
      gives it); x and y are sent as given, numbered from 0, and 0 where the address has no X or Y
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
      x:
        type: int
        min: 0
        required: true
      y:
        type: int
        min: 0
        required: true
      value:
        type: int
        required: true
    send: set {address} {x} {y} {value}
    expect:
      matches: '^OKm? set \S+ \d+ \d+ '
    returns: ack
  set_parameter_text:
    summary: Set any text parameter (name, colour, type) by its RCP address; the value is sent double-quoted
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
      x:
        type: int
        min: 0
        required: true
      y:
        type: int
        min: 0
        required: true
      value:
        type: string
        pattern: ^[ -~]*$
        required: true
    send: set {address} {x} {y} {value:json}
    expect:
      matches: '^OKm? set \S+ \d+ \d+ '
    returns: ack
  get_parameter:
    summary: Read any parameter by its RCP address; returns the value as sent, a text value with its quotes
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
      x:
        type: int
        min: 0
        required: true
      y:
        type: int
        min: 0
        required: true
    send: get {address} {x} {y}
    expect:
      matches: ^OK get \S+ \d+ \d+ (.*?)\s*$
    returns: value
  get_product_name:
    summary: Read the product name (devinfo productname)
    send: devinfo productname
    expect:
      matches: ^OK devinfo productname "?([^"]*?)"?\s*$
    returns: value
  get_device_name:
