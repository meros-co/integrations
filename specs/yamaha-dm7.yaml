commands:
  set_input_fader_level:
    summary: 'Set the input channel fader level (MIXER:Current/InCh/Fader/Level; channel = input channel
      from 1; level: hundredths of a dB, -32768 (-inf) to 1000 (+10 dB))'
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
      level:
        type: int
        min: -32768
        max: 1000
        required: true
    send: set MIXER:Current/InCh/Fader/Level {channel:-1} 0 {level}
    expect:
      matches: '^OKm? set MIXER:Current/InCh/Fader/Level \d+ \d+ '
    returns: ack
  get_input_fader_level:
    summary: Read the input channel fader level (MIXER:Current/InCh/Fader/Level); returns the raw value
      (hundredths of a dB, -32768 (-inf) to 1000 (+10 dB))
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
    send: get MIXER:Current/InCh/Fader/Level {channel:-1} 0
    expect:
      matches: ^OK get MIXER:Current/InCh/Fader/Level \d+ \d+ (-?\d+)
    returns: value
  set_input_on:
    summary: 'Set the input channel channel ON key (0 OFF, the channel is muted; 1 ON) (MIXER:Current/InCh/Fader/On;
      channel = input channel from 1; enabled: true = 1 (ON), false = 0 (OFF))'
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
      enabled:
        type: bool
        required: true
    send: set MIXER:Current/InCh/Fader/On {channel:-1} 0 {enabled:bool01}
    expect:
      matches: '^OKm? set MIXER:Current/InCh/Fader/On \d+ \d+ '
    returns: ack
  get_input_on:
    summary: Read the input channel channel ON key (0 OFF, the channel is muted; 1 ON) (MIXER:Current/InCh/Fader/On);
      returns the raw value (true = 1 (ON), false = 0 (OFF))
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
    send: get MIXER:Current/InCh/Fader/On {channel:-1} 0
    expect:
      matches: ^OK get MIXER:Current/InCh/Fader/On \d+ \d+ (-?\d+)
    returns: value
  set_input_stereo_pan:
    summary: 'Set the input channel pan to stereo (MIXER:Current/InCh/ToSt/Pan; channel = input channel
      from 1; pan: -63 (L63) to 63 (R63), 0 centre)'
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
      pan:
        type: int
        min: -63
        max: 63
        required: true
    send: set MIXER:Current/InCh/ToSt/Pan {channel:-1} 0 {pan}
    expect:
      matches: '^OKm? set MIXER:Current/InCh/ToSt/Pan \d+ \d+ '
    returns: ack
  get_input_stereo_pan:
    summary: Read the input channel pan to stereo (MIXER:Current/InCh/ToSt/Pan); returns the raw value
      (-63 (L63) to 63 (R63), 0 centre)
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
    send: get MIXER:Current/InCh/ToSt/Pan {channel:-1} 0
    expect:
      matches: ^OK get MIXER:Current/InCh/ToSt/Pan \d+ \d+ (-?\d+)
    returns: value
  set_input_stereo_on:
    summary: 'Set the input channel to stereo bus on (MIXER:Current/InCh/ToSt/On; channel = input channel
      from 1, stereo_bus = stereo bus from 1; enabled: true = 1 (ON), false = 0 (OFF))'
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
      stereo_bus:
        type: int
        min: 1
        max: 2
        required: true
      enabled:
        type: bool
        required: true
    send: set MIXER:Current/InCh/ToSt/On {channel:-1} {stereo_bus:-1} {enabled:bool01}
    expect:
      matches: '^OKm? set MIXER:Current/InCh/ToSt/On \d+ \d+ '
    returns: ack
  get_input_stereo_on:
    summary: Read the input channel to stereo bus on (MIXER:Current/InCh/ToSt/On); returns the raw value
      (true = 1 (ON), false = 0 (OFF))
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
      stereo_bus:
        type: int
        min: 1
        max: 2
        required: true
    send: get MIXER:Current/InCh/ToSt/On {channel:-1} {stereo_bus:-1}
    expect:
      matches: ^OK get MIXER:Current/InCh/ToSt/On \d+ \d+ (-?\d+)
    returns: value
  set_input_ha_gain:
    summary: 'Set the input channel head-amp gain of the patched port (MIXER:Current/InCh/Port/HA/Gain;
      channel = input channel from 1; gain: hundredths of a dB, -6 to +66 dB in 1 dB steps (Table 5))'
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
      gain:
        type: int
        min: -600
        max: 6600
        required: true
    send: set MIXER:Current/InCh/Port/HA/Gain {channel:-1} 0 {gain}
    expect:
      matches: '^OKm? set MIXER:Current/InCh/Port/HA/Gain \d+ \d+ '
    returns: ack
  get_input_ha_gain:
    summary: Read the input channel head-amp gain of the patched port (MIXER:Current/InCh/Port/HA/Gain);
      returns the raw value (hundredths of a dB, -6 to +66 dB in 1 dB steps (Table 5))
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
    send: get MIXER:Current/InCh/Port/HA/Gain {channel:-1} 0
    expect:
      matches: ^OK get MIXER:Current/InCh/Port/HA/Gain \d+ \d+ (-?\d+)
    returns: value
  set_input_name:
    summary: 'Set the input channel name (up to 8 characters) (MIXER:Current/InCh/Label/Name; channel
      = input channel from 1; name: up to 8 printable ASCII characters)'
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
      name:
        type: string
        max_length: 8
        pattern: ^[ -~]*$
        required: true
    send: set MIXER:Current/InCh/Label/Name {channel:-1} 0 {name:json}
    expect:
      matches: '^OKm? set MIXER:Current/InCh/Label/Name \d+ \d+ '
    returns: ack
  get_input_name:
    summary: Read the input channel name (up to 8 characters) (MIXER:Current/InCh/Label/Name); returns
      the raw value (up to 8 printable ASCII characters)
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
    send: get MIXER:Current/InCh/Label/Name {channel:-1} 0
    expect:
      matches: ^OK get MIXER:Current/InCh/Label/Name \d+ \d+ "((?:[^"\\]|\\.)*)"
    returns: value
  set_input_color:
    summary: 'Set the input channel colour (MIXER:Current/InCh/Label/Color; channel = input channel from
      1; value: one of the listed strings)'
    params:
      channel:
        type: int
        min: 1
        max: 120
        required: true
      value:
        type: enum
        values:
          - Blue
          - Green
          - Orange
          - Pink
          - Purple
          - Red
          - SkyBlue
          - Yellow
          - Cyan
          - Magenta
          - 'Off'
        required: true
    send: set MIXER:Current/InCh/Label/Color {channel:-1} 0 "{value}"
    expect:
      matches: '^OKm? set MIXER:Current/InCh/Label/Color \d+ \d+ '
    returns: ack
  get_input_color:
