    send: ["PSEFF {value:02d}", "PSEFF ?"]
    returns: none
  get_effect:
    summary: "Read effect level (PSEFF ?): 00-99"
    send: "PSEFF ?"
    expect: { reply_contains: "PSEFF ", matches: '^PSEFF ([0-9]{2})$' }
    returns: value
  delay_step:
