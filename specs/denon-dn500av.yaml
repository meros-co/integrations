  auto_lip_sync_disabled: { "true": "ON", "false": "OFF" }
  screen_saver_disabled: { "true": "ON", "false": "OFF" }

commands:
  power_on:
    summary: "Power on (PWON); the next command waits a second"
    send: "PWON"
    returns: none
  standby:
    summary: "Put the unit in standby (PWSTANDBY)"
    send: "PWSTANDBY"
    returns: none
  get_power:
    summary: "Read the power (PW?): ON or STANDBY"
    send: "PW?"
    expect: { reply_contains: "PW", matches: '^PW(ON|STANDBY)$' }
    returns: value
  volume_up:
    summary: "Raise the master volume a step (MVUP)"
    send: "MVUP"
    returns: none
  volume_down:
    summary: "Lower the master volume a step (MVDOWN)"
    send: "MVDOWN"
    returns: none
  set_volume:
    summary: "Set the master volume in dB (MV), then read it back"
    params:
      db: { type: int, min: -80, max: 18, required: true, label: "Master volume", description: "The master volume in
        dB, -80 to +18 (0 dB is the reference)." }
    send: ["MV{db:+80:02d}", "MV?"]
    returns: none
  set_volume_minimum:
    summary: "Set the master volume to its minimum, --- (MV99), then read it back"
    send: ["MV99", "MV?"]
    returns: none
  get_volume:
    summary: "Read the master volume (MV?): 00-98, 80 being 0 dB, or 99 the minimum (---)"
    send: "MV?"
    expect: { reply_contains: "MV", matches: '^MV([0-9]{2})$' }
    returns: value
  channel_volume_step:
    summary: "Step one channel's level up or down (CV UP/DOWN), then read the levels back"
    params:
      channel: { type: enum, values: [FL, FR, C, SW, SL, SR, SBL, SBR, SB, FHL, FHR], required: true, label:
        "Channel", description: "FL, FR, C, SW, SL, SR, SBL, SBR, SB (one surround back), FHL or FHR." }
      direction: { type: enum, values: [up, down], required: true, label: "Direction", description: "up or down by one
        step." }
    send: ["CV{channel:map.channel} {direction:map.up_down}", "CV?"]
    returns: none
  set_channel_volume:
    summary: "Set one channel's level in dB (CV), then read the levels back"
    params:
      channel: { type: enum, values: [FL, FR, C, SW, SL, SR, SBL, SBR, SB, FHL, FHR], required: true, label:
        "Channel", description: "FL, FR, C, SW, SL, SR, SBL, SBR, SB (one surround back), FHL or FHR." }
      db: { type: int, min: -12, max: 12, required: true, label: "Level", description: "The channel's level in dB, -12
        to +12." }
    send: ["CV{channel:map.channel} {db:+50:02d}", "CV?"]
    returns: none
  request_channel_volumes:
    summary: "Ask for every channel's level (CV?); the answers, one per channel, update state"
    send: "CV?"
    returns: none
  set_mute:
    summary: "Turn mute on or off (MU), then read it back"
    params:
      enabled: { type: bool, required: true, label: "Mute", description: "On mutes the main zone's outputs, off
        unmutes them." }
    send: ["MU{enabled:map.mute}", "MU?"]
    returns: none
  get_mute:
    summary: "Read mute (MU?): ON or OFF"
    send: "MU?"
    expect: { reply_contains: "MU", matches: '^MU(ON|OFF)$' }
    returns: value
  select_input:
    summary: "Select the input source (SI), then read it back"
    params:
      source: { type: enum, values: [CD, DVD, BD, TV, SAT/CBL, GAME, GAME2, DOCK, V.AUX, IPOD, NET/USB, SERVER,
        FAVORITES, USB/IPOD, USB, IPD], required: true, label: "Input", description: "The input source, as the unit
        names it." }
    send: ["SI{source:map.source}", "SI?"]
    returns: none
  get_input:
    summary: "Read the input source (SI?)"
    send: "SI?"
    expect: { reply_contains: "SI", matches: '^SI(.+)$' }
    returns: value
  set_main_zone:
    summary: "Turn main zone on or off (ZM), then read it back"
    params:
      enabled: { type: bool, required: true, label: "Main zone", description: "On turns the main zone on, off turns it
        off." }
    send: ["ZM{enabled:map.main_zone}", "ZM?"]
    returns: none
  get_main_zone:
    summary: "Read main zone (ZM?): ON or OFF"
    send: "ZM?"
    expect: { reply_contains: "ZM", matches: '^ZM(ON|OFF)$' }
    returns: value
  set_input_mode:
    summary: "Set input mode (SD), then read it back"
    params:
      value: { type: enum, values: [auto, hdmi, digital, analog], required: true, label: "Input mode", description:
        "auto (HDMI, then digital, then analog), or hdmi, digital or analog forced." }
    send: ["SD{value:map.input_mode}", "SD?"]
    returns: none
  get_input_mode:
    summary: "Read input mode (SD?): AUTO, HDMI, DIGITAL, ANALOG"
    send: "SD?"
    expect: { reply_contains: "SD", matches: '^SD(DIGITAL|ANALOG|AUTO|HDMI)$' }
    returns: value
  set_digital_mode:
    summary: "Set digital input mode (DC), then read it back"
    params:
      value: { type: enum, values: [auto, pcm, dts], required: true, label: "Digital input mode", description: "auto,
        or pcm or dts forced." }
    send: ["DC{value:map.digital_mode}", "DC?"]
    returns: none
  get_digital_mode:
    summary: "Read digital input mode (DC?): AUTO, PCM, DTS"
    send: "DC?"
    expect: { reply_contains: "DC", matches: '^DC(AUTO|PCM|DTS)$' }
    returns: value
  set_video_select:
    summary: "Set video select (SV), then read it back"
    params:
      value: { type: enum, values: [dvd, bd, tv, sat_cbl, game, game2, dock, v_aux, source], required: true, label:
        "Video select", description: "The video source shown with the audio of another input, or source to cancel." }
    send: ["SV{value:map.video_select}", "SV?"]
    returns: none
  get_video_select:
    summary: "Read video select (SV?): DVD, BD, TV, SAT/CBL, GAME, GAME2, DOCK, V.AUX, SOURCE"
    send: "SV?"
    expect: { reply_contains: "SV", matches: '^SV(SAT/CBL|SOURCE|GAME2|V\.AUX|GAME|DOCK|DVD|BD|TV)$' }
    returns: value
  set_sleep:
    summary: "Set the main zone's sleep timer (SLP), then read it back"
    params:
      minutes: { type: int, min: 1, max: 120, required: true, label: "Sleep timer", description: "Minutes until the
        main zone goes to standby, 1-120." }
    send: ["SLP{minutes:03d}", "SLP?"]
    returns: none
  sleep_off:
    summary: "Turn the main zone's sleep timer off (SLPOFF), then read it back"
    send: ["SLPOFF", "SLP?"]
    returns: none
  get_sleep:
    summary: "Read the main zone's sleep timer (SLP?): OFF or the minutes"
    send: "SLP?"
    expect: { reply_contains: "SLP", matches: '^SLP(OFF|[0-9]{3})$' }
    returns: value
  set_surround_mode:
    summary: "Select the surround mode (MS), then read it back"
    params:
      mode: { type: enum, values: [MOVIE, MUSIC, GAME, DIRECT, PURE DIRECT, STEREO, STANDARD, DOLBY DIGITAL, DTS
        SURROUND, MCH STEREO, ROCK ARENA, JAZZ CLUB, CLASSIC CONCERT, MONO MOVIE, MATRIX, VIDEO GAME, VIRTUAL],
        required: true, label: "Surround mode", description: "The surround mode, as the unit names it." }
    send: ["MS{mode:map.surround}", "MS?"]
    returns: none
  get_surround_mode:
    summary: "Read the surround mode (MS?)"
    send: "MS?"
    expect: { reply_contains: "MS", matches: '^MS(.+)$' }
    returns: value
  quick_select:
    summary: "Recall a quick select (MSQUICK), then read it back"
    params:
      number: { type: int, min: 1, max: 4, required: true, label: "Quick select", description: "The quick select,
        1-4." }
    send: ["MSQUICK{number}", "MSQUICK ?"]
    returns: none
  quick_select_memory:
    summary: "Store the current settings in a quick select (MSQUICK MEMORY), then read it back"
    params:
      number: { type: int, min: 1, max: 4, required: true, label: "Quick select", description: "The quick select,
        1-4." }
    send: ["MSQUICK{number} MEMORY", "MSQUICK ?"]
    returns: none
  get_quick_select:
    summary: "Read the quick select (MSQUICK ?): 0 none, or 1-4"
    send: "MSQUICK ?"
    expect: { reply_contains: "MSQUICK", matches: '^MSQUICK([0-4])$' }
    returns: value
  set_hdmi_audio_out:
    summary: "Set HDMI audio output (VSAUDIO), then read it back"
    params:
      value: { type: enum, values: [amp, tv], required: true, label: "HDMI audio output", description: "amp plays HDMI
        audio on the unit; tv passes it to the TV." }
    send: ["VSAUDIO {value:map.hdmi_audio_out}", "VSAUDIO ?"]
    returns: none
  get_hdmi_audio_out:
    summary: "Read HDMI audio output (VSAUDIO ?): AMP, TV"
    send: "VSAUDIO ?"
    expect: { reply_contains: "VSAUDIO ", matches: '^VSAUDIO (AMP|TV)$' }
    returns: value
  set_video_processing:
    summary: "Set video processing mode (VSVPM), then read it back"
    params:
      value: { type: enum, values: [auto, game, movie], required: true, label: "Video processing mode", description:
        "auto, game or movie." }
    send: ["VSVPM{value:map.video_processing}", "VSVPM ?"]
    returns: none
  get_video_processing:
    summary: "Read video processing mode (VSVPM ?): AUTO, GAME, MOVI"
    send: "VSVPM ?"
    expect: { reply_contains: "VSVPM", matches: '^VSVPM(AUTO|GAME|MOVI)$' }
    returns: value
  set_tone_control:
    summary: "Turn tone control on or off (PSTONE CTRL), then read it back"
    params:
      enabled: { type: bool, required: true, label: "Tone control", description: "On applies the bass and treble
        settings." }
    send: ["PSTONE CTRL {enabled:map.tone_control}", "PSTONE CTRL ?"]
    returns: none
  get_tone_control:
    summary: "Read tone control (PSTONE CTRL ?): ON or OFF"
    send: "PSTONE CTRL ?"
    expect: { reply_contains: "PSTONE CTRL ", matches: '^PSTONE CTRL (ON|OFF)$' }
    returns: value
  set_surround_back:
    summary: "Set surround back mode (PSSB:), then read it back"
    params:
      value: { type: enum, values: [matrix, plgx_cinema, plgx_music, "on", "off"], required: true, label: "Surround
        back mode", description: "The surround back speakers' mode." }
    send: ["PSSB:{value:map.surround_back}", "PSSB: ?"]
    returns: none
  get_surround_back:
    summary: "Read surround back mode (PSSB: ?): MTRX ON, PLgX CINEMA, PLgX MUSIC, ON, OFF, ESDSCRT, ESMTRX, DSCRT ON"
    send: "PSSB: ?"
    expect: { reply_contains: "PSSB:", matches: '^PSSB:(PLgX CINEMA|PLgX MUSIC|DSCRT ON|MTRX ON|ESDSCRT|ESMTRX|OFF|ON)$' }
    returns: value
  set_cinema_eq:
    summary: "Turn cinema EQ on or off (PSHTEQ), then read it back"
    params:
      enabled: { type: bool, required: true, label: "Cinema EQ", description: "On softens harsh treble in film
        soundtracks." }
    send: ["PSHTEQ {enabled:map.cinema_eq}", "PSCINEMA EQ. ?"]
    returns: none
  get_cinema_eq:
    summary: "Read cinema EQ (PSCINEMA EQ. ?): ON or OFF"
    send: "PSCINEMA EQ. ?"
    expect: { reply_contains: "PSHTEQ ", matches: '^PSHTEQ (ON|OFF)$' }
    returns: value
  set_pl_mode:
    summary: "Set decoding mode (PSMODE:), then read it back"
    params:
      value: { type: enum, values: [music, cinema, game, pro_logic], required: true, label: "Decoding mode",
        description: "The Dolby Pro Logic and DTS NEO:6 decoding mode: music, cinema, game or pro_logic." }
    send: ["PSMODE:{value:map.pl_mode}", "PSMODE: ?"]
    returns: none
  get_pl_mode:
    summary: "Read decoding mode (PSMODE: ?): MUSIC, CINEMA, GAME, PRO LOGIC"
    send: "PSMODE: ?"
    expect: { reply_contains: "PSMODE:", matches: '^PSMODE:(PRO LOGIC|CINEMA|MUSIC|GAME)$' }
    returns: value
  set_front_height:
    summary: "Turn front height output on or off (PSFH:), then read it back"
    params:
      enabled: { type: bool, required: true, label: "Front height output", description: "On outputs the front height
        (PLIIz height) channels." }
    send: ["PSFH:{enabled:map.front_height}", "PSFH: ?"]
    returns: none
  get_front_height:
    summary: "Read front height output (PSFH: ?): ON or OFF"
    send: "PSFH: ?"
    expect: { reply_contains: "PSFH:", matches: '^PSFH:(ON|OFF)$' }
    returns: value
  set_height_gain:
    summary: "Set height gain (PSPHG), then read it back"
    params:
      value: { type: enum, values: [low, mid, high], required: true, label: "Height gain", description: "The PLIIz
        height gain: low, mid or high." }
    send: ["PSPHG {value:map.height_gain}", "PSPHG ?"]
    returns: none
  get_height_gain:
    summary: "Read height gain (PSPHG ?): LOW, MID, HI"
    send: "PSPHG ?"
    expect: { reply_contains: "PSPHG ", matches: '^PSPHG (LOW|MID|HI)$' }
    returns: value
  bass_step:
    summary: "Step bass up or down (PSBAS UP/DOWN), then read it back"
    params:
      direction: { type: enum, values: [up, down], required: true, label: "Direction", description: "up or down by one
        step." }
    send: ["PSBAS {direction:map.up_down}", "PSBAS ?"]
    returns: none
  set_bass:
    summary: "Set bass (PSBAS), then read it back"
    params:
      value: { type: int, min: -6, max: 6, required: true, label: "Bass", description: "The bass in dB, -6 to +6." }
    send: ["PSBAS {value:+50:02d}", "PSBAS ?"]
    returns: none
  get_bass:
    summary: "Read bass (PSBAS ?): 44-56, 50 being 0 dB"
    send: "PSBAS ?"
    expect: { reply_contains: "PSBAS ", matches: '^PSBAS ([0-9]{2})$' }
    returns: value
  treble_step:
    summary: "Step treble up or down (PSTRE UP/DOWN), then read it back"
    params:
      direction: { type: enum, values: [up, down], required: true, label: "Direction", description: "up or down by one
        step." }
    send: ["PSTRE {direction:map.up_down}", "PSTRE ?"]
    returns: none
  set_treble:
    summary: "Set treble (PSTRE), then read it back"
    params:
      value: { type: int, min: -6, max: 6, required: true, label: "Treble", description: "The treble in dB, -6 to +6."
        }
    send: ["PSTRE {value:+50:02d}", "PSTRE ?"]
    returns: none
  get_treble:
    summary: "Read treble (PSTRE ?): 44-56, 50 being 0 dB"
    send: "PSTRE ?"
    expect: { reply_contains: "PSTRE ", matches: '^PSTRE ([0-9]{2})$' }
    returns: value
  set_drc:
    summary: "Set dynamic range compression (PSDRC), then read it back"
    params:
      value: { type: enum, values: [auto, low, mid, high, "off"], required: true, label: "Dynamic range compression",
        description: "auto, low, mid, high or off." }
    send: ["PSDRC {value:map.drc}", "PSDRC ?"]
    returns: none
  get_drc:
    summary: "Read dynamic range compression (PSDRC ?): AUTO, LOW, MID, HI, OFF"
    send: "PSDRC ?"
    expect: { reply_contains: "PSDRC ", matches: '^PSDRC (AUTO|LOW|MID|OFF|HI)$' }
    returns: value
  set_dynamic_compression:
    summary: "Set D.COMP (PSDCO), then read it back"
    params:
      value: { type: enum, values: ["off", low, mid, high], required: true, label: "D.COMP", description: "Dynamic
        compression: off, low, mid or high." }
    send: ["PSDCO {value:map.dynamic_compression}", "PSDCO ?"]
    returns: none
  get_dynamic_compression:
    summary: "Read D.COMP (PSDCO ?): OFF, LOW, MID, HIGH"
    send: "PSDCO ?"
    expect: { reply_contains: "PSDCO ", matches: '^PSDCO (HIGH|OFF|LOW|MID)$' }
    returns: value
