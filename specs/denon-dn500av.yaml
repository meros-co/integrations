  video_select: { dvd: "DVD", bd: "BD", tv: "TV", sat_cbl: "SAT/CBL", game: "GAME", game2: "GAME2", dock: "DOCK",
    v_aux: "V.AUX", source: "SOURCE" }
  surround: { MOVIE: "MOVIE", MUSIC: "MUSIC", GAME: "GAME", DIRECT: "DIRECT", PURE DIRECT: "PURE DIRECT", STEREO:
    "STEREO", STANDARD: "STANDARD", DOLBY DIGITAL: "DOLBY DIGITAL", DTS SURROUND: "DTS SURROUND", MCH STEREO: "MCH
    STEREO", ROCK ARENA: "ROCK ARENA", JAZZ CLUB: "JAZZ CLUB", CLASSIC CONCERT: "CLASSIC CONCERT", MONO MOVIE: "MONO
    MOVIE", MATRIX: "MATRIX", VIDEO GAME: "VIDEO GAME", VIRTUAL: "VIRTUAL" }
  hdmi_audio_out: { amp: "AMP", tv: "TV" }
  video_processing: { auto: "AUTO", game: "GAME", movie: "MOVI" }
  tone_control: { "true": "ON", "false": "OFF" }
  surround_back: { matrix: "MTRX ON", plgx_cinema: "PLgX CINEMA", plgx_music: "PLgX MUSIC", "on": "ON", "off": "OFF" }
  cinema_eq: { "true": "ON", "false": "OFF" }
  pl_mode: { music: "MUSIC", cinema: "CINEMA", game: "GAME", pro_logic: "PRO LOGIC" }
