        step." }
    send: ["PSEFF {direction:map.up_down}", "PSEFF ?"]
    returns: none
  set_effect:
    summary: "Set effect level (PSEFF), then read it back"
    params:
      value: { type: int, min: 0, max: 99, required: true, label: "Effect level", description: "The effect level, 0-99
