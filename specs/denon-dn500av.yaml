    expect: { reply_contains: "PSDEL ", matches: '^PSDEL ([0-9]{3})$' }
    returns: value
  set_afdm:
    summary: "Turn AFDM on or off (PSAFD), then read it back"
    params:
      enabled: { type: bool, required: true, label: "AFDM", description: "On detects the surround back channel of a
