  channel: { FL: "FL", FR: "FR", C: "C", SW: "SW", SL: "SL", SR: "SR", SBL: "SBL", SBR: "SBR", SB: "SB", FHL: "FHL",
    FHR: "FHR" }
  mute: { "true": "ON", "false": "OFF" }
  source: { CD: "CD", DVD: "DVD", BD: "BD", TV: "TV", SAT/CBL: "SAT/CBL", GAME: "GAME", GAME2: "GAME2", DOCK: "DOCK",
    V.AUX: "V.AUX", IPOD: "IPOD", NET/USB: "NET/USB", SERVER: "SERVER", FAVORITES: "FAVORITES", USB/IPOD: "USB/IPOD",
    USB: "USB", IPD: "IPD" }
