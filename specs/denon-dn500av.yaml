  height_gain: { low: "LOW", mid: "MID", high: "HI" }
  drc: { auto: "AUTO", low: "LOW", mid: "MID", high: "HI", "off": "OFF" }
  dynamic_compression: { "off": "OFF", low: "LOW", mid: "MID", high: "HIGH" }
  afdm: { "true": "ON", "false": "OFF" }
  panorama: { "true": "ON", "false": "OFF" }
  subwoofer: { "true": "ON", "false": "OFF" }
  room_size: { s: "S", ms: "MS", m: "M", ml: "ML", l: "L" }
  restorer: { "off": "OFF", mode1: "MODE1", mode2: "MODE2", mode3: "MODE3" }
  z2_source: { CD: "CD", DVD: "DVD", BD: "BD", SAT/CBL: "SAT/CBL", DOCK: "DOCK", V.AUX: "V.AUX", IPOD: "IPOD",
    NET/USB: "NET/USB", SERVER: "SERVER", FAVORITES: "FAVORITES", USB/IPOD: "USB/IPOD", SOURCE: "SOURCE", USB: "USB",
    IPD: "IPD" }
  z2_power: { "true": "ON", "false": "OFF" }
  z2_mute: { "true": "ON", "false": "OFF" }
  z2_channel: { FL: "FL", FR: "FR" }
  net_key: { up: "90", down: "91", left: "92", right: "93", enter: "94", play: "9A", pause: "9B", stop: "9C",
