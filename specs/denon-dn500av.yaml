spec: 1
id: denon-dn500av
name: Denon Professional DN-500AV surround pre-amplifier (RS-232C / IP control)
vendor: Denon Professional
category: other

# The DN-500AV's serial remote control protocol, the same on its RS-232C port and on TCP port 23 (telnet): a
# message is a two-character command and its parameter, then CR. A status request is the command and "?"; the
# answer has the same form as the command that sets it (MV? is answered MV80). The unit also sends that form by
# itself whenever its state changes, from the panel, the remote or another controller. Control commands are not
# acknowledged.
source:
  - title: "Denon Professional DN-500AV Owner's Manual (DN-500AVEM, CD-ROM edition v00)"
    author: D&M Holdings Inc.
    url: https://cdn.inmusicbrands.com/DenonPro/cdn/1121/documents/DN500AVEM_ENG_CD-ROM_IM_v00.zip
    note: >
      Manufacturer document (retrieved 2026-10-27; the owner's manual PDF in the zip). Serial remote control
      (pp.89-109): RS-232C at 9600 bit/s, 8 data bits, no parity, 1 stop bit, no flow control (p.89); IP control on
      TCP port 23 (telnet), at most 135 bytes a message (p.90); COMMAND, RESPONSE (to COMMAND + ? + CR, within 200 ms)
      and EVENT (sent when the state changes) of the same form, at least 200 ms between commands, one request at a
      time, one second after PWON (p.91); the control command table (pp.93-101) and the status request and status
      information table (pp.102-109).

transport:
  type: line-tcp
  port: 23
  framing: terminated
  terminator: cr
  encoding: utf-8
  timeout_ms: 1000
  reply: expected
  probe: "PW?"
  # At least 200 ms between commands, one second after power on (p.91).
  pacing:
    min_interval_ms: 200
    groups:
      power_on:
        match: "^PWON$"
        after_ms: 1000

ports:
  - { port: 23, protocol: tcp, role: control, note: "IP control (telnet), p.90" }

models:
  - id: dn-500av
    name: Denon Professional DN-500AV
    supports: [power_on, standby, get_power, volume_up, volume_down, set_volume, set_volume_minimum, get_volume,
        channel_volume_step, set_channel_volume, request_channel_volumes, set_mute, get_mute, select_input, get_input,
        set_main_zone, get_main_zone, set_input_mode, get_input_mode, set_digital_mode, get_digital_mode,
        set_video_select, get_video_select, set_sleep, sleep_off, get_sleep, set_surround_mode, get_surround_mode,
        quick_select, quick_select_memory, get_quick_select, set_hdmi_audio_out, get_hdmi_audio_out,
        set_video_processing, get_video_processing, set_tone_control, get_tone_control, set_surround_back,
        get_surround_back, set_cinema_eq, get_cinema_eq, set_pl_mode, get_pl_mode, set_front_height, get_front_height,
        set_height_gain, get_height_gain, bass_step, set_bass, get_bass, treble_step, set_treble, get_treble, set_drc,
        get_drc, set_dynamic_compression, get_dynamic_compression, lfe_step, set_lfe, get_lfe, effect_step,
        set_effect, get_effect, delay_step, set_delay, get_delay, set_afdm, get_afdm, set_panorama, get_panorama,
        dimension_step, set_dimension, get_dimension, center_width_step, set_center_width, get_center_width,
        center_image_step, set_center_image, get_center_image, set_subwoofer, get_subwoofer, set_room_size,
        get_room_size, audio_delay_step, set_audio_delay, get_audio_delay, set_restorer, get_restorer,
        z2_select_input, z2_power, z2_volume_up, z2_volume_down, z2_set_volume, request_zone2, z2_quick_select,
        z2_quick_select_memory, z2_get_quick_select, set_z2_mute, get_z2_mute, z2_channel_volume_step,
        z2_set_channel_volume, request_zone2_channel_volumes, z2_set_sleep, z2_sleep_off, z2_get_sleep, net_key,
        net_favorites_folder, net_favorite_memory, request_net_presets, request_net_display,
        request_net_display_ascii, dock_key, menu_key, gui_menu, source_menu, remote_lock, panel_lock, get_upgrade_id,
        remote_maintenance, get_remote_maintenance, set_auto_lip_sync_disabled, get_auto_lip_sync_disabled,
        set_screen_saver_disabled, get_screen_saver_disabled]
    verification: none

