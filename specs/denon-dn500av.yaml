    returns: none
  get_screen_saver_disabled:
    summary: "Read screen saver disabling (SSOSD ?): ON or OFF"
    send: "SSOSD ?"
    expect: { reply_contains: "SSOSDSCR ", matches: '^SSOSDSCR (ON|OFF)$' }
    returns: value

quirks:
  - models: [all]
    severity: warning
    text: >
      Control commands are not acknowledged (they report unverified): each set is followed by its request, and the
      unit also reports every change by itself. Requests are answered within 200 ms; commands closer than 200 ms are
      ignored (the core paces them).
  - models: [all]
    severity: info
    text: >
      The guide marks power on (PWON) as available with IP control only. Some codes of the guide are taken as its
      tables' code column gives them: Cinema EQ is set with PSHTEQ and asked with "PSCINEMA EQ. ?"; the video
      processing mode is asked with "VSVPM ?" (the guide prints "VSVPN ?"), the HDMI setup and GUI requests with
      "SSHOS ?" and "SSOSD ?" (printed "HOS ?" and "OSD ?"). Auto lip sync is disabled by SSHOSALS ON and the screen
      saver by SSOSDSCR ON, as the guide gives them.
  - models: [all]
    severity: info
    text: >
      Master and zone 2 volumes are whole dB here (two digits, 80 for 0 dB, 99 for the minimum ---); the guide shows
      no half steps. The on-screen list lines 1-7 of NSA and NSE start with a flag byte (playable, directory, cursor,
      picture) that is kept as part of the line's text, not decoded. The effect level is taken as two digits, 00-99,
      as the guide gives its form; the unit limits it further.

state:
  power: { type: string, description: "on or standby (PW)" }
  volume.db: { type: int, unit: dB, description: "The master volume in dB, -80 to +18 (MV); absent meaning at the
    minimum is volume.minimum" }
  volume.minimum: { type: bool, description: "True at the minimum, --- (MV99)" }
  "channels.*.db": { type: int, unit: dB, description: "A channel's level in dB, -12 to +12 (CV), keyed FL, FR, C, SW,
    SL, SR, SBL, SBR, SB, FHL or FHR" }
  mute: { type: bool, description: "Mute (MU)" }
  input: { type: string, description: "The input source: CD, DVD, BD, TV, SAT/CBL, GAME, GAME2, DOCK, V.AUX, IPOD,
    NET/USB, SERVER, FAVORITES, USB/IPOD, USB or IPD (SI)" }
  main_zone: { type: bool, description: "Main zone (ZM)" }
  input_mode: { type: string, description: "Input mode: auto, hdmi, digital, analog (SD)" }
  digital_mode: { type: string, description: "Digital input mode: auto, pcm, dts (DC)" }
  video_select: { type: string, description: "Video select: dvd, bd, tv, sat_cbl, game, game2, dock, v_aux, source
    (SV)" }
  sleep_minutes: { type: int, unit: min, description: "The main zone's sleep timer in minutes; 0 when off (SLP)" }
  surround_mode: { type: string, description: "The surround mode as the unit names it, such as STEREO or DOLBY DIGITAL
    (MS)" }
  quick_select: { type: int, description: "The quick select in use, 1-4; 0 for none (MSQUICK)" }
  hdmi_audio_out: { type: string, description: "HDMI audio output: amp, tv (VSAUDIO)" }
  video_processing: { type: string, description: "Video processing mode: auto, game, movie (VSVPM)" }
  tone_control: { type: bool, description: "Tone control (PSTONE CTRL)" }
  surround_back: { type: string, description: "Surround back mode: matrix, plgx_cinema, plgx_music, on, off,
    es_discrete, es_matrix, discrete (PSSB:)" }
  cinema_eq: { type: bool, description: "Cinema EQ (PSHTEQ)" }
  pl_mode: { type: string, description: "Decoding mode: music, cinema, game, pro_logic (PSMODE:)" }
  front_height: { type: bool, description: "Front height output (PSFH:)" }
  height_gain: { type: string, description: "Height gain: low, mid, high (PSPHG)" }
  tone.bass_db: { type: int, unit: dB, description: "Bass (PSBAS; 44-56, 50 being 0 dB)" }
  tone.treble_db: { type: int, unit: dB, description: "Treble (PSTRE; 44-56, 50 being 0 dB)" }
  drc: { type: string, description: "Dynamic range compression: auto, low, mid, high, off (PSDRC)" }
  dynamic_compression: { type: string, description: "D.COMP: off, low, mid, high (PSDCO)" }
  lfe_db: { type: int, unit: dB, description: "The LFE level in dB, 0 to -10 (PSLFE)" }
  effect_level: { type: int, description: "Effect level (PSEFF; 00-99)" }
  delay_ms: { type: int, unit: ms, description: "Delay (PSDEL; 000-300 ms)" }
  afdm: { type: bool, description: "AFDM (PSAFD)" }
  panorama: { type: bool, description: "Panorama (PSPAN)" }
  dimension: { type: int, description: "Dimension (PSDIM; 00-06)" }
  center_width: { type: int, description: "Center width (PSCEN; 00-07)" }
  center_image_tenths: { type: int, description: "Center image (PSCEI; 00-10, tenths)" }
  subwoofer: { type: bool, description: "Subwoofer (PSSWR)" }
  room_size: { type: string, description: "Room size: s, ms, m, ml, l (PSRSZ)" }
  audio_delay_ms: { type: int, unit: ms, description: "Audio delay (PSDELAY; 000-200 ms)" }
  restorer: { type: string, description: "Audio restorer: off, mode1, mode2, mode3 (PSRSTR)" }
  zone2.power: { type: bool, description: "Zone 2 on (Z2ON, Z2OFF)" }
  zone2.input: { type: string, description: "Zone 2's source, or SOURCE following the main zone (Z2)" }
  zone2.volume_db: { type: int, unit: dB, description: "Zone 2's volume in dB (Z2; 00 is -80 dB, 80 0 dB)" }
  zone2.volume_minimum: { type: bool, description: "True at zone 2's minimum, --- (Z299)" }
  zone2.quick_select: { type: int, description: "Zone 2's quick select, 1-4; 0 for none (Z2QUICK)" }
  zone2.mute: { type: bool, description: "Zone 2 mute (Z2MU)" }
  "zone2.channels.*.db": { type: int, unit: dB, description: "A zone 2 channel's level in dB, -12 to +12 (Z2CV), keyed
    FL or FR" }
  zone2.sleep_minutes: { type: int, unit: min, description: "Zone 2's sleep timer in minutes; 0 when off (Z2SLP)" }
  "net.presets.*.name": { type: string, description: "A net audio preset's name, keyed 0-55 (A1 to G8) (NSH)" }
  "net.display.*": { type: string, description: "A line of the NET/USB on-screen list, keyed 0-8, up to its Null (NSE,
    NSA); lines 1-7 lead with a flag byte" }
  upgrade_id: { type: string, description: "The 12-digit upgrade ID, or NG (UGIDN)" }
  remote_maintenance: { type: bool, description: "Remote maintenance mode on (RM)" }
  auto_lip_sync_disabled: { type: bool, description: "Auto lip sync disabling (SSHOSALS)" }
  screen_saver_disabled: { type: bool, description: "Screen saver disabling (SSOSDSCR)" }

telemetry:
  poll:
    - every_ms: 5000
      send: ["PW?", "MV?", "SI?", "MS?", "Z2?"]
    - every_ms: 30000
      send: ["CV?", "MU?", "ZM?", "SD?", "DC?", "SV?", "SLP?", "MSQUICK ?", "VSAUDIO ?", "VSVPM ?", "PSTONE CTRL ?", "PSSB:
          ?", "PSCINEMA EQ. ?", "PSMODE: ?", "PSFH: ?", "PSPHG ?", "PSBAS ?", "PSTRE ?", "PSDRC ?", "PSDCO ?", "PSLFE
          ?", "PSEFF ?", "PSDEL ?", "PSAFD ?", "PSPAN ?", "PSDIM ?", "PSCEN ?", "PSCEI ?", "PSSWR ?", "PSRSZ ?",
          "PSDELAY ?", "PSRSTR ?", "Z2QUICK ?", "Z2MU?", "Z2CV?", "Z2SLP?", "RM?", "SSHOS ?", "SSOSD ?"]
  updates:
    - match: '^PW(ON|STANDBY)$'
      state: { power: { value: "{1}", map: { "ON": "on", STANDBY: standby } } }
    - match: '^MV(9[0-8]|[0-8][0-9])$'
      state: { volume.db: "{1:-80}", volume.minimum: "false" }
    - match: '^MV99$'
      state: { volume.minimum: "true" }
    - match: '^CV(FL|FR|C|SW|SL|SR|SBL|SBR|SB|FHL|FHR) ([0-9]{2})$'
      state: { "channels.{1}.db": "{2:-50}" }
    - match: '^MU(ON|OFF)$'
      state: { mute: { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^SI(.+)$'
      state: { input: "{1}" }
    - match: '^ZM(ON|OFF)$'
      state: { main_zone: { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^SD(DIGITAL|ANALOG|AUTO|HDMI)$'
      state: { input_mode: { value: "{1}", map: { AUTO: auto, HDMI: hdmi, DIGITAL: digital, ANALOG: analog } } }
    - match: '^DC(AUTO|PCM|DTS)$'
      state: { digital_mode: { value: "{1}", map: { AUTO: auto, PCM: pcm, DTS: dts } } }
    - match: '^SV(SAT/CBL|SOURCE|GAME2|V\.AUX|GAME|DOCK|DVD|BD|TV)$'
      state: { video_select: { value: "{1}", map: { DVD: dvd, BD: bd, TV: tv, SAT/CBL: sat_cbl, GAME: game, GAME2:
        game2, DOCK: dock, V.AUX: v_aux, SOURCE: source } } }
    - match: '^SLP([0-9]{3})$'
      state: { sleep_minutes: "{1}" }
    - match: '^SLPOFF$'
      state: { sleep_minutes: "0" }
    # The surround mode; MSQUICK answers are the quick select.
    - match: '^MS((?:[^Q]|Q[^U]|QU[^I]).*)$'
      state: { surround_mode: "{1}" }
    - match: '^MSQUICK([0-4])$'
      state: { quick_select: "{1}" }
    - match: '^VSAUDIO (AMP|TV)$'
      state: { hdmi_audio_out: { value: "{1}", map: { AMP: amp, TV: tv } } }
    - match: '^VSVPM(AUTO|GAME|MOVI)$'
      state: { video_processing: { value: "{1}", map: { AUTO: auto, GAME: game, MOVI: movie } } }
    - match: '^PSTONE CTRL (ON|OFF)$'
      state: { tone_control: { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^PSSB:(PLgX CINEMA|PLgX MUSIC|DSCRT ON|MTRX ON|ESDSCRT|ESMTRX|OFF|ON)$'
      state: { surround_back: { value: "{1}", map: { MTRX ON: matrix, PLgX CINEMA: plgx_cinema, PLgX MUSIC:
        plgx_music, "ON": "on", "OFF": "off", ESDSCRT: es_discrete, ESMTRX: es_matrix, DSCRT ON: discrete } } }
    - match: '^PSHTEQ (ON|OFF)$'
      state: { cinema_eq: { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^PSMODE:(PRO LOGIC|CINEMA|MUSIC|GAME)$'
      state: { pl_mode: { value: "{1}", map: { MUSIC: music, CINEMA: cinema, GAME: game, PRO LOGIC: pro_logic } } }
    - match: '^PSFH:(ON|OFF)$'
      state: { front_height: { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^PSPHG (LOW|MID|HI)$'
      state: { height_gain: { value: "{1}", map: { LOW: low, MID: mid, HI: high } } }
    - match: '^PSBAS ([0-9]{2})$'
      state: { tone.bass_db: "{1:-50}" }
    - match: '^PSTRE ([0-9]{2})$'
      state: { tone.treble_db: "{1:-50}" }
    - match: '^PSDRC (AUTO|LOW|MID|OFF|HI)$'
      state: { drc: { value: "{1}", map: { AUTO: auto, LOW: low, MID: mid, HI: high, "OFF": "off" } } }
    - match: '^PSDCO (HIGH|OFF|LOW|MID)$'
      state: { dynamic_compression: { value: "{1}", map: { "OFF": "off", LOW: low, MID: mid, HIGH: high } } }
    - match: '^PSLFE ([0-9]{2})$'
      state: { lfe_db: "-{1}" }
    - match: '^PSEFF ([0-9]{2})$'
      state: { effect_level: "{1}" }
    - match: '^PSDEL ([0-9]{3})$'
      state: { delay_ms: "{1}" }
    - match: '^PSAFD (ON|OFF)$'
      state: { afdm: { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^PSPAN (ON|OFF)$'
      state: { panorama: { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^PSDIM ([0-9]{2})$'
      state: { dimension: "{1}" }
    - match: '^PSCEN ([0-9]{2})$'
      state: { center_width: "{1}" }
    - match: '^PSCEI ([0-9]{2})$'
      state: { center_image_tenths: "{1}" }
    - match: '^PSSWR (ON|OFF)$'
      state: { subwoofer: { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^PSRSZ (MS|ML|S|M|L)$'
      state: { room_size: { value: "{1}", map: { S: s, MS: ms, M: m, ML: ml, L: l } } }
    - match: '^PSDELAY ([0-9]{3})$'
      state: { audio_delay_ms: "{1}" }
    - match: '^PSRSTR (MODE1|MODE2|MODE3|OFF)$'
      state: { restorer: { value: "{1}", map: { "OFF": "off", MODE1: mode1, MODE2: mode2, MODE3: mode3 } } }
    - match: '^Z2(ON|OFF)$'
      state: { zone2.power: { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^Z2(9[0-8]|[0-8][0-9])$'
      state: { zone2.volume_db: "{1:-80}", zone2.volume_minimum: "false" }
    - match: '^Z299$'
      state: { zone2.volume_minimum: "true" }
    - match: '^Z2(CD|DVD|BD|SAT/CBL|DOCK|V\.AUX|IPOD|NET/USB|SERVER|FAVORITES|USB/IPOD|SOURCE|USB|IPD)$'
      state: { zone2.input: "{1}" }
    - match: '^Z2QUICK([0-4])$'
      state: { zone2.quick_select: "{1}" }
    - match: '^Z2MU(ON|OFF)$'
      state: { zone2.mute: { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^Z2CV(FL|FR) ([0-9]{2})$'
      state: { "zone2.channels.{1}.db": "{2:-50}" }
    - match: '^Z2SLP([0-9]{3})$'
      state: { zone2.sleep_minutes: "{1}" }
    - match: '^Z2SLPOFF$'
      state: { zone2.sleep_minutes: "0" }
    - match: '^NSH([0-5][0-9])(.*)$'
      state: { "net.presets.{1}.name": "{2}" }
    - match: '^NS[EA]([0-8])([^\x00]*)'
      state: { "net.display.{1}": "{2}" }
    - match: '^UGIDN ?([0-9]{12}|NG)$'
      state: { upgrade_id: "{1}" }
    - match: '^RM (ON|OFF)$'
      state: { remote_maintenance: { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^SSHOSALS (ON|OFF)$'
      state: { auto_lip_sync_disabled: { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^SSOSDSCR (ON|OFF)$'
      state: { screen_saver_disabled: { value: "{1}", map: { "ON": true, "OFF": false } } }
