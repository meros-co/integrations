# Analog Way LivePremier / Aquilon (AWJ): native module crates/core/src/modules/analogway.rs.
# Commands are AWJ get/replace messages on TCP 10606; see the module and the
# guides cited below for the paths each one writes.
spec: 1
id: analogway-livepremier
name: Analog Way LivePremier / Aquilon (AWJ)
vendor: Analog Way
category: switcher
implementation: native
reason: >-
  AWJ is JSON over TCP with 0x04-terminated messages and nothing in the spec format can express its session: answers
  are matched to reads by path, errors carry no path, changes are pushed only after a Subscriptions write that must
  be repeated on every connection, and writes to a screen's program or preview go to bank A or B depending on the
  T-bar position, which has to be read from the device before the write (guide 3.8).
source:
- title: Aquilon AWJ Protocol Programmer's Guide, for firmware version v6.2 or higher (document version 6.2, June
    2026)
  author: Analog Way
  url: https://dwn01.analogway.com/Site+Internet/Series/Aquilon/Common/AWJ+Protocol/AW_Aquilon_AWJ_ProgrammersGuide_V6.2.pdf
  note: >-
    Manufacturer document, 34 pages (PDF created 2026-09-21). 1.1-1.4 (pp.3-5): TCP 10606, five clients, JSON objects
    ended by 0x04, get/replace, the error object and codes E09-E13, Subscriptions; 2.1-2.5 (pp.6-7): device type
    values NLC_RSALPHA..NLC_CMAX, serial, firmware, reboot and shutdown on DeviceObject/system/shutdown/cmd; 3.1-3.13
    (pp.8-17): screen and auxiliary labels, xTake, preset and master preset recall, layer capability, layer freeze
    lists (firmware 4.4+), layer sources, the A/B bank and T-bar table, xUpdate, backgrounds, last loaded presets,
    keying; 4.1-4.6 (pp.18-20): multiviewer; 5 (pp.21-23): audio; 6.1-6.11 (pp.24-30): inputs, stills, backgrounds
    and backups; 7 (p.31): thumbnails; 8 (pp.32-33): Wake-on-LAN.
- title: LivePremier AWJ Protocol Programmer's Guide, for firmware version v4.0 or higher (document version 4.0,
    January 2024)
  author: Analog Way
  url: https://s3.eu-west-3.amazonaws.com/aw.store01/Site+Internet/Series/LivePremier/Common/AWJ+Protocol/LivePremier_awj_programmers_guide_v4.0.pdf
  note: >-
    Manufacturer document, 31 pages, the edition before the Aquilon rename. Same protocol; differs from v6.2 in
    the reboot/shutdown path (DeviceObject/system/$device/@items/1/shutdown/cmd, 2.4-2.5), the screen preconfig
    path (@items/1 rather than @items/S1, 3.1 and 3.5) and in lacking keying, layer freeze, VU meter and backup
    sections. Section 1.4 lists the 4.0 changes: the device selection added for Link, screens and auxiliaries split
    into two lists.
- title: Aquilon REST API Programmer's Guide, for version v4.0 or higher (PDF dated 2026-09-21, file v6.0)
  author: Analog Way
  url: https://dwn01.analogway.com/Site+Internet/Series/Aquilon/Common/Rest+API+Programmer's+Guide/AW_Aquilon_AWJ_REST_API_programmers_guide_v6.0.pdf
  note: >-
    Manufacturer document, 76 pages. Used only for the ranges the AWJ guide leaves out: screens 1-24, auxiliary
    screens 1-96, screen layers 1-128, auxiliary layers 1-8, preset memories 1-1000, master presets 1-500, multiviewers
    1-8 with widgets 1-64 and presets 1-50, inputs 1-256, background sets 1-8 (sections 3-7, pp.11-69). The REST
    API itself is not used: it has no push, and its cookie login (section 10) is a handshake the spec format cannot
    express.
settings:
  extra_subscriptions:
    type: string
    max_length: 4096
    default: ''
  read_on_connect:
    type: bool
    default: true
ports:
  - { port: 10606, protocol: tcp, role: control }

