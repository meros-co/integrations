    expect: { status: 200 }
    returns: ack
  send_auxiliary_command:
    summary: "Send an auxiliary command the PTZ node lists (wiper, washer, IR lamp...)"
    params:
      command: { type: string, max_length: 128, pattern: "^[^<>&\"\\x27]*$", required: true, label: Command, description: "Auxiliary command as the PTZ node lists it, such as tt:Wiper|On." }
    send: { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:SendAuxiliaryCommand><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken><tptz:AuxiliaryData>{command}</tptz:AuxiliaryData></tptz:SendAuxiliaryCommand></s:Body></s:Envelope>" }
