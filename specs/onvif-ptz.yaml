      - { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:SetPreset><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken><tptz:PresetName>{name}</tptz:PresetName></tptz:SetPreset></s:Body></s:Envelope>" }
      - { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:GetPresets><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken></tptz:GetPresets></s:Body></s:Envelope>" }
    expect: { status: 200 }
