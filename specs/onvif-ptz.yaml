      - { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:GetStatus><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken></tptz:GetStatus></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  get_status:
    summary: "Read the position, move status and error of the PTZ unit"
    send: { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:GetStatus><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken></tptz:GetStatus></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text
  goto_preset:
    summary: "Move to a preset"
    params:
      preset: { type: string, max_length: 64, pattern: "^[^<>&\"\\x27]*$", required: true, label: Preset, description: "Preset token, from presets in state." }
    send: { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:GotoPreset><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken><tptz:PresetToken>{preset}</tptz:PresetToken></tptz:GotoPreset></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  goto_preset_at_speed:
    summary: "Move to a preset at given speeds"
    params:
      preset: { type: string, max_length: 64, pattern: "^[^<>&\"\\x27]*$", required: true, label: Preset, description: "Preset token, from presets in state." }
      pan_tilt_speed: { type: float, min: 0, max: 1, required: true, label: Pan/tilt speed, description: "Pan/tilt speed as a fraction of the maximum, 0 to 1." }
      zoom_speed: { type: float, min: 0, max: 1, required: true, label: Zoom speed, description: "Zoom speed as a fraction of the maximum, 0 to 1." }
