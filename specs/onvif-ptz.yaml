    params:
      position: { type: float, min: -1000000, max: 1000000, required: true, label: Focus position, description: "Focus position in the device's range (imaging options in state give its minimum and maximum)." }
    send: { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:Move><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken><timg:Focus><tt:Absolute><tt:Position>{position:.4f}</tt:Position></tt:Absolute></timg:Focus></timg:Move></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  focus_move_relative:
    summary: "Move the focus by a distance (manual focus)"
    params:
      distance: { type: float, min: -1000000, max: 1000000, required: true, label: Focus distance, description: "Focus distance in the device's range (imaging options in state give its minimum and maximum)." }
    send: { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:Move><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken><timg:Focus><tt:Relative><tt:Distance>{distance:.4f}</tt:Distance></tt:Relative></timg:Focus></timg:Move></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  focus_move_continuous:
    summary: "Move the focus at a speed until focus_stop (manual focus)"
    params:
      speed: { type: float, min: -1000000, max: 1000000, required: true, label: Focus speed, description: "Focus speed in the device's range (imaging options in state give its minimum and maximum)." }
    send: { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:Move><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken><timg:Focus><tt:Continuous><tt:Speed>{speed:.4f}</tt:Speed></tt:Continuous></timg:Focus></timg:Move></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  focus_stop:
    summary: "Stop a focus move"
    send: { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:Stop><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken></timg:Stop></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  get_focus_status:
    summary: "Read the focus position and move status"
    send: { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:GetStatus><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken></timg:GetStatus></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text
  get_imaging_presets:
    summary: "List the video source's imaging presets"
    send: { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:GetPresets><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken></timg:GetPresets></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text
  set_imaging_preset:
    summary: "Apply an imaging preset, then read the current one back"
    params:
      preset: { type: string, max_length: 64, pattern: "^[^<>&\"\\x27]*$", required: true, label: Imaging preset, description: "Token of the imaging preset, from imaging_presets in state." }
    send:
      - { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:SetCurrentPreset><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken><timg:PresetToken>{preset}</timg:PresetToken></timg:SetCurrentPreset></s:Body></s:Envelope>" }
      - { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:GetCurrentPreset><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken></timg:GetCurrentPreset></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  get_current_imaging_preset:
    summary: "Read the imaging preset in use"
    send: { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:GetCurrentPreset><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken></timg:GetCurrentPreset></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text

telemetry:
  # ONVIF over HTTP pushes nothing without an event subscription: the PTZ
  # status is read every second, focus every 2 s, imaging settings every 5 s,
  # and the lists every 30 s.
  poll:
    - every_ms: 1000
      send:
        - { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:GetStatus><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken></tptz:GetStatus></s:Body></s:Envelope>" }
    - every_ms: 2000
      send:
        - { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:GetStatus><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken></timg:GetStatus></s:Body></s:Envelope>" }
    - every_ms: 5000
      send:
        - { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:GetImagingSettings><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken></timg:GetImagingSettings></s:Body></s:Envelope>" }
    - every_ms: 30000
      send:
        - { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:GetDeviceInformation/></s:Body></s:Envelope>" }
        - { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:GetHostname/></s:Body></s:Envelope>" }
        - { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:GetServices><tds:IncludeCapability>false</tds:IncludeCapability></tds:GetServices></s:Body></s:Envelope>" }
        - { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:GetRelayOutputs/></s:Body></s:Envelope>" }
        - { method: POST, path: "/onvif/{settings.media_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:trt=\"http://www.onvif.org/ver10/media/wsdl\"><s:Body><trt:GetProfiles/></s:Body></s:Envelope>" }
        - { method: POST, path: "/onvif/{settings.media_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:trt=\"http://www.onvif.org/ver10/media/wsdl\"><s:Body><trt:GetVideoSources/></s:Body></s:Envelope>" }
        - { method: POST, path: "/onvif/{settings.media_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:trt=\"http://www.onvif.org/ver10/media/wsdl\"><s:Body><trt:GetStreamUri><trt:StreamSetup><tt:Stream>RTP-Unicast</tt:Stream><tt:Transport><tt:Protocol>RTSP</tt:Protocol></tt:Transport></trt:StreamSetup><trt:ProfileToken>{settings.profile_token}</trt:ProfileToken></trt:GetStreamUri></s:Body></s:Envelope>" }
        - { method: POST, path: "/onvif/{settings.media_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:trt=\"http://www.onvif.org/ver10/media/wsdl\"><s:Body><trt:GetSnapshotUri><trt:ProfileToken>{settings.profile_token}</trt:ProfileToken></trt:GetSnapshotUri></s:Body></s:Envelope>" }
        - { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:GetPresets><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken></tptz:GetPresets></s:Body></s:Envelope>" }
        - { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:GetNodes/></s:Body></s:Envelope>" }
        - { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:GetPresetTours><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken></tptz:GetPresetTours></s:Body></s:Envelope>" }
        - { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:GetOptions><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken></timg:GetOptions></s:Body></s:Envelope>" }
        - { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:GetPresets><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken></timg:GetPresets></s:Body></s:Envelope>" }
        - { method: POST, path: "/onvif/{settings.imaging_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:timg=\"http://www.onvif.org/ver20/imaging/wsdl\"><s:Body><timg:GetCurrentPreset><timg:VideoSourceToken>{settings.video_source_token}</timg:VideoSourceToken></timg:GetCurrentPreset></s:Body></s:Envelope>" }
  updates:
    # Device management
    - path: '^/onvif/'
      xml_each: GetDeviceInformationResponse
      state:
        device.manufacturer: "{Manufacturer}"
        device.model: "{Model}"
        device.firmware: "{FirmwareVersion}"
        device.serial: "{SerialNumber}"
        device.hardware_id: "{HardwareId}"
    - path: '^/onvif/'
      xml_each: GetHostnameResponse/HostnameInformation
      state:
        hostname.name: "{Name}"
        hostname.from_dhcp: "{FromDHCP}"
    - path: '^/onvif/'
      xml_each: GetServicesResponse
      replace: services
    - path: '^/onvif/'
      xml_each: GetServicesResponse/Service
      state: { "services.{Namespace:key}.address": "{XAddr}" }
    - path: '^/onvif/'
      xml_each: GetRelayOutputsResponse
      replace: relays
    - path: '^/onvif/'
      xml_each: GetRelayOutputsResponse/RelayOutputs/Properties
      state:
        "relays.{^token:key}.mode": "{Mode}"
        "relays.{^token:key}.delay_time": "{DelayTime}"
        "relays.{^token:key}.idle_state": "{IdleState}"
    # Media
    - path: '^/onvif/'
      xml_each: GetProfilesResponse
      replace: profiles
    - path: '^/onvif/'
      xml_each: GetProfilesResponse/Profiles
      state: { "profiles.{token:key}.name": "{Name}" }
    - path: '^/onvif/'
      xml_each: Profiles/VideoSourceConfiguration
      state: { "profiles.{^token:key}.video_source": "{SourceToken}" }
    - path: '^/onvif/'
      xml_each: Profiles/VideoEncoderConfiguration
      state: { "profiles.{^token:key}.encoding": "{Encoding}" }
    - path: '^/onvif/'
      xml_each: Profiles/VideoEncoderConfiguration/Resolution
      state:
        "profiles.{^^token:key}.width": "{Width}"
        "profiles.{^^token:key}.height": "{Height}"
    - path: '^/onvif/'
      xml_each: Profiles/PTZConfiguration
      state: { "profiles.{^token:key}.ptz_configuration": "{token}" }
    - path: '^/onvif/'
      xml_each: GetVideoSourcesResponse
      replace: video_sources
    - path: '^/onvif/'
      xml_each: GetVideoSourcesResponse/VideoSources
      state: { "video_sources.{token:key}.frame_rate": "{Framerate}" }
    - path: '^/onvif/'
      xml_each: GetVideoSourcesResponse/VideoSources/Resolution
      state:
        "video_sources.{^token:key}.width": "{Width}"
        "video_sources.{^token:key}.height": "{Height}"
    - path: '^/onvif/'
      xml_each: GetStreamUriResponse/MediaUri
      state: { stream_uri: "{Uri}" }
    - path: '^/onvif/'
      xml_each: GetSnapshotUriResponse/MediaUri
      state: { snapshot_uri: "{Uri}" }
    # PTZ status
    - path: '^/onvif/'
      xml_each: PTZStatus/Position/PanTilt
      state: { position.pan: "{x}", position.tilt: "{y}" }
    - path: '^/onvif/'
      xml_each: PTZStatus/Position/Zoom
      state: { position.zoom: "{x}" }
    - path: '^/onvif/'
      xml_each: PTZStatus/MoveStatus
      state: { move_status.pan_tilt: "{PanTilt}", move_status.zoom: "{Zoom}" }
    - path: '^/onvif/'
      xml_each: GetStatusResponse/PTZStatus
      state: { ptz_error: "{Error}", ptz_time: "{UtcTime}" }
    # PTZ presets, nodes and tours
    - path: '^/onvif/'
      xml_each: "{http://www.onvif.org/ver20/ptz/wsdl}GetPresetsResponse"
      replace: presets
    - path: '^/onvif/'
      xml_each: "{http://www.onvif.org/ver20/ptz/wsdl}GetPresetsResponse/Preset"
      state: { "presets.{token:key}.name": "{Name}" }
    - path: '^/onvif/'
      xml_each: Preset/PTZPosition/PanTilt
      state: { "presets.{^^token:key}.pan": "{x}", "presets.{^^token:key}.tilt": "{y}" }
    - path: '^/onvif/'
      xml_each: Preset/PTZPosition/Zoom
      state: { "presets.{^^token:key}.zoom": "{x}" }
    - path: '^/onvif/'
      xml_each: GetNodesResponse/PTZNode
      state:
        "nodes.{token:key}.name": "{Name}"
        "nodes.{token:key}.maximum_presets": "{MaximumNumberOfPresets}"
        "nodes.{token:key}.home_supported": "{HomeSupported}"
    - path: '^/onvif/'
      xml_each: GetPresetToursResponse
      replace: preset_tours
    - path: '^/onvif/'
      xml_each: GetPresetToursResponse/PresetTour
      state: { "preset_tours.{token:key}.name": "{Name}", "preset_tours.{token:key}.auto_start": "{AutoStart}" }
    - path: '^/onvif/'
      xml_each: PresetTour/Status
      state: { "preset_tours.{^token:key}.state": "{State}" }
    # Imaging settings
    - path: '^/onvif/'
      xml_each: GetImagingSettingsResponse/ImagingSettings
      state:
        imaging.brightness: "{Brightness}"
        imaging.color_saturation: "{ColorSaturation}"
        imaging.contrast: "{Contrast}"
        imaging.sharpness: "{Sharpness}"
        imaging.ir_cut_filter: "{IrCutFilter}"
    - path: '^/onvif/'
      xml_each: GetImagingSettingsResponse/ImagingSettings/BacklightCompensation
      state: { imaging.backlight_compensation.mode: "{Mode}", imaging.backlight_compensation.level: "{Level}" }
    - path: '^/onvif/'
      xml_each: GetImagingSettingsResponse/ImagingSettings/WideDynamicRange
      state: { imaging.wide_dynamic_range.mode: "{Mode}", imaging.wide_dynamic_range.level: "{Level}" }
    - path: '^/onvif/'
      xml_each: GetImagingSettingsResponse/ImagingSettings/Exposure
      state:
        imaging.exposure.mode: "{Mode}"
        imaging.exposure.time: "{ExposureTime}"
        imaging.exposure.gain: "{Gain}"
        imaging.exposure.iris: "{Iris}"
    - path: '^/onvif/'
      xml_each: GetImagingSettingsResponse/ImagingSettings/Focus
      state: { imaging.focus_mode: "{AutoFocusMode}" }
    - path: '^/onvif/'
      xml_each: GetImagingSettingsResponse/ImagingSettings/WhiteBalance
      state: { imaging.white_balance.mode: "{Mode}", imaging.white_balance.cr_gain: "{CrGain}", imaging.white_balance.cb_gain: "{CbGain}" }
    # Imaging options: the ranges
    - path: '^/onvif/'
      xml_each: GetOptionsResponse/ImagingOptions/Brightness
      state: { imaging_options.brightness.min: "{Min}", imaging_options.brightness.max: "{Max}" }
    - path: '^/onvif/'
      xml_each: GetOptionsResponse/ImagingOptions/ColorSaturation
      state: { imaging_options.color_saturation.min: "{Min}", imaging_options.color_saturation.max: "{Max}" }
    - path: '^/onvif/'
      xml_each: GetOptionsResponse/ImagingOptions/Contrast
      state: { imaging_options.contrast.min: "{Min}", imaging_options.contrast.max: "{Max}" }
    - path: '^/onvif/'
      xml_each: GetOptionsResponse/ImagingOptions/Sharpness
      state: { imaging_options.sharpness.min: "{Min}", imaging_options.sharpness.max: "{Max}" }
    - path: '^/onvif/'
      xml_each: ImagingOptions/Exposure/ExposureTime
      state: { imaging_options.exposure_time.min: "{Min}", imaging_options.exposure_time.max: "{Max}" }
    - path: '^/onvif/'
      xml_each: ImagingOptions/Exposure/Gain
      state: { imaging_options.gain.min: "{Min}", imaging_options.gain.max: "{Max}" }
    - path: '^/onvif/'
      xml_each: ImagingOptions/Exposure/Iris
      state: { imaging_options.iris.min: "{Min}", imaging_options.iris.max: "{Max}" }
    - path: '^/onvif/'
      xml_each: ImagingOptions/WhiteBalance/YrGain
      state: { imaging_options.cr_gain.min: "{Min}", imaging_options.cr_gain.max: "{Max}" }
    - path: '^/onvif/'
      xml_each: ImagingOptions/WhiteBalance/YbGain
      state: { imaging_options.cb_gain.min: "{Min}", imaging_options.cb_gain.max: "{Max}" }
    # Focus status
    - path: '^/onvif/'
      xml_each: Status/FocusStatus20
      state: { focus.position: "{Position}", focus.move_status: "{MoveStatus}", focus.error: "{Error}" }
    # Imaging presets
    - path: '^/onvif/'
      xml_each: "{http://www.onvif.org/ver20/imaging/wsdl}GetPresetsResponse"
      replace: imaging_presets
    - path: '^/onvif/'
      xml_each: "{http://www.onvif.org/ver20/imaging/wsdl}GetPresetsResponse/Preset"
      state: { "imaging_presets.{token:key}.type": "{type}", "imaging_presets.{token:key}.name": "{Name}" }
    - path: '^/onvif/'
      xml_each: GetCurrentPresetResponse/Preset
      state: { imaging_preset: "{token}" }

state:
  device.manufacturer: { type: string, description: "Manufacturer" }
  device.model: { type: string, description: "Model" }
  device.firmware: { type: string, description: "Firmware version" }
  device.serial: { type: string, description: "Serial number" }
