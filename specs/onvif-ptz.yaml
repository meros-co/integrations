    send:
      - { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:RemovePresetTour><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken><tptz:PresetTourToken>{tour}</tptz:PresetTourToken></tptz:RemovePresetTour></s:Body></s:Envelope>" }
