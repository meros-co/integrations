spec: 1
id: onvif-ptz
name: ONVIF PTZ cameras (PTZ, imaging, media and device services)
vendor: ONVIF
category: camera

# ONVIF's web services over SOAP 1.2 and HTTP: the device management service
# at the fixed /onvif/device_service, and the media, PTZ and imaging services
# at the addresses the device lists (GetServices; the device's paths under
# /onvif/ are settings here). Commands act on one media profile (the
# profile_token setting) and one video source (video_source_token), both
# listed in state from GetProfiles and GetVideoSources. Authentication is HTTP
# Digest, as the Core Specification requires of conformant devices.

source:
  - title: ONVIF Core Specification, version 26.06
    author: ONVIF
    url: https://www.onvif.org/specs/core/ONVIF-Core-Specification.pdf
    note: >
      Read 2026-10-27. 5.1.1 (the device management service's entry point is fixed to
      /onvif/device_service), 5.9.1 (services over HTTP shall be protected by HTTP digest
      authentication, legacy WS-UsernameToken devices excepted; without credentials a request that
      needs them is answered 401), the device management operations GetServices, GetDeviceInformation,
      GetHostname, SetHostname, SystemReboot, SetSystemFactoryDefault, GetRelayOutputs and
      SetRelayOutputState, and SOAP 1.2 with application/soap+xml.
  - title: ONVIF PTZ Service Specification, version 26.06
    author: ONVIF
    url: https://www.onvif.org/specs/srv/ptz/ONVIF-PTZ-Service-Spec.pdf
    note: >
      Read 2026-10-27. 5.1 GetNodes (name, maximum number of presets, home supported); 5.3
      AbsoluteMove, RelativeMove, ContinuousMove (with an optional timeout), Stop (PanTilt and Zoom
      flags), GetStatus (position, move status, error, UTC time); 5.4 SetPreset, GetPresets,
      GotoPreset, RemovePreset; 5.5 GotoHomePosition, SetHomePosition; 5.6 SendAuxiliaryCommand;
      5.7 the generic spaces (pan/tilt position -1 to 1, zoom position 0 to 1, translations and
      velocities -1 to 1, speeds 0 to 1) used when a request names no space; 5.8 GetPresetTours and
      OperatePresetTour (Start, Stop, Pause, Extended), RemovePresetTour.
  - title: ONVIF Imaging Service Specification, version 22.06
    author: ONVIF
    url: https://www.onvif.org/specs/srv/img/ONVIF-Imaging-Service-Spec.pdf
    note: >
      Read 2026-10-27. 5.1 the ImagingSettings20 parameters (BacklightCompensation, Brightness,
      ColorSaturation, Contrast, Exposure with Mode, ExposureTime, Gain and Iris, Focus with
      AutoFocusMode, IrCutFilter ON/OFF/AUTO, Sharpness, WideDynamicRange, WhiteBalance with Mode,
      CrGain and CbGain), GetImagingSettings, SetImagingSettings, GetOptions; 5.2 GetPresets,
      GetCurrentPreset, SetCurrentPreset; 5.3 focus Move (absolute, relative, continuous), Stop,
      GetStatus.
  - title: ONVIF Media Service Specification, version 24.12
    author: ONVIF
    url: https://www.onvif.org/specs/srv/media/ONVIF-Media-Service-Spec.pdf
    note: >
      Read 2026-10-27. GetProfiles (profile tokens, names, video source, encoder and PTZ
      configurations), GetVideoSources, GetStreamUri (RTP-Unicast over RTSP) and GetSnapshotUri.

transport:
  type: http
  port: 80
  https_port: 443
  scheme: { setting: scheme }
  accept_invalid_certs: true
  # HTTP Digest (Core 5.9.1), or a WS-Security UsernameToken in each SOAP
  # header for legacy devices that take only that.
  auth: { setting: auth }
  timeout_ms: 8000
  probe:
    method: POST
    path: /onvif/device_service
    content_type: "application/soap+xml; charset=utf-8"
    body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:GetSystemDateAndTime/></s:Body></s:Envelope>"

settings:
  auth: { type: enum, values: [digest, wsse], default: digest, label: Authentication,
          description: "digest, HTTP Digest as conformant devices take it, or wsse, a WS-Security UsernameToken with a password digest in each message, for legacy devices that take only that." }
  username: { type: string, default: admin, label: Username, description: "An ONVIF user of the device with operator rights (administrator for settings and reboot)." }
  password: { type: string, secret: true, label: Password, description: "The ONVIF user's password." }
  scheme: { type: enum, values: [http, https], default: http, label: Connection, description: "http on port 80, or https on port 443 with the device's certificate accepted unchecked." }
  profile_token: { type: string, default: "", max_length: 64, pattern: '^[^<>&"\x27]*$', label: Media profile,
                   description: "Token of the media profile the PTZ commands act on, from profiles in state (GetProfiles)." }
  video_source_token: { type: string, default: "", max_length: 64, pattern: '^[^<>&"\x27]*$', label: Video source,
                        description: "Token of the video source the imaging commands act on, from video_sources in state." }
  ptz_path: { type: string, default: ptz_service, max_length: 64, pattern: '^[A-Za-z0-9_.-]+$', label: PTZ service path,
              description: "Path of the PTZ service under /onvif/, as the device's GetServices lists it (ptz_service, PTZ, services...)." }
  media_path: { type: string, default: media_service, max_length: 64, pattern: '^[A-Za-z0-9_.-]+$', label: Media service path,
                description: "Path of the media service under /onvif/, as the device's GetServices lists it." }
  imaging_path: { type: string, default: imaging_service, max_length: 64, pattern: '^[A-Za-z0-9_.-]+$', label: Imaging service path,
                  description: "Path of the imaging service under /onvif/, as the device's GetServices lists it." }

ports:
  - { port: 80, protocol: http, role: control, when: "scheme http" }
  - { port: 443, protocol: https, role: control, when: "scheme https" }

models:
  - id: onvif-ptz
    name: ONVIF Profile S or T camera with PTZ
    supports: &all
      [get_device_information, get_services, get_system_date_and_time, get_hostname, set_hostname, reboot, factory_default, get_relay_outputs, set_relay_output, get_profiles, get_video_sources, get_stream_uri, get_snapshot_uri, absolute_move, absolute_move_at_speed, absolute_pan_tilt, absolute_zoom, relative_move, continuous_move, continuous_move_for, stop, stop_pan_tilt, stop_zoom, get_status, goto_preset, goto_preset_at_speed, save_preset, update_preset, remove_preset, get_presets, goto_home, set_home, send_auxiliary_command, get_nodes, get_configurations, get_preset_tours, operate_preset_tour, remove_preset_tour, get_imaging_settings, get_imaging_options, set_brightness, set_color_saturation, set_contrast, set_sharpness, set_ir_cut_filter, set_backlight_compensation, set_backlight_compensation_level, set_wide_dynamic_range, set_wide_dynamic_range_level, set_exposure_mode, set_exposure_time, set_gain, set_iris, set_focus_mode, set_white_balance_mode, set_white_balance_gains, focus_move_absolute, focus_move_relative, focus_move_continuous, focus_stop, get_focus_status, get_imaging_presets, set_imaging_preset, get_current_imaging_preset]
    verification: none
  - id: onvif-fixed
    name: ONVIF Profile S or T camera without PTZ (imaging, media and device only)
    supports:
      [get_device_information, get_services, get_system_date_and_time, get_hostname, set_hostname, reboot, factory_default, get_relay_outputs, set_relay_output, get_profiles, get_video_sources, get_stream_uri, get_snapshot_uri, get_imaging_settings, get_imaging_options, set_brightness, set_color_saturation, set_contrast, set_sharpness, set_ir_cut_filter, set_backlight_compensation, set_backlight_compensation_level, set_wide_dynamic_range, set_wide_dynamic_range_level, set_exposure_mode, set_exposure_time, set_gain, set_iris, set_focus_mode, set_white_balance_mode, set_white_balance_gains, focus_move_absolute, focus_move_relative, focus_move_continuous, focus_stop, get_focus_status, get_imaging_presets, set_imaging_preset, get_current_imaging_preset]
    verification: none

commands:

  # ── Device management (/onvif/device_service) ─────────────────────────
  get_device_information:
    summary: "Read the manufacturer, model, firmware, serial number and hardware ID"
    send: { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:GetDeviceInformation/></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text
  get_services:
    summary: "List the device's services and their addresses"
    send: { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:GetServices><tds:IncludeCapability>false</tds:IncludeCapability></tds:GetServices></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text
  get_system_date_and_time:
    summary: "Read the device's date, time and time zone"
    send: { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:GetSystemDateAndTime/></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text
  get_hostname:
    summary: "Read the device's host name"
    send: { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:GetHostname/></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text
  set_hostname:
    summary: "Set the device's host name, then read it back"
    params:
      name: { type: string, max_length: 63, pattern: "^[A-Za-z0-9-]+$", required: true, label: Host name, description: "New host name: letters, digits and hyphens." }
    send:
      - { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:SetHostname><tds:Name>{name}</tds:Name></tds:SetHostname></s:Body></s:Envelope>" }
      - { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:GetHostname/></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  reboot:
    summary: "Restart the device"
    send: { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:SystemReboot/></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  factory_default:
    summary: "Reset the device to factory defaults (soft keeps the network settings, hard resets everything)"
    params:
      kind: { type: enum, values: ["Soft", "Hard"], required: true, label: Reset, description: "Soft keeps network settings that would cut the device off; Hard resets everything." }
    send: { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:SetSystemFactoryDefault><tds:FactoryDefault>{kind}</tds:FactoryDefault></tds:SetSystemFactoryDefault></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  get_relay_outputs:
    summary: "List the relay outputs and their settings"
    send: { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:GetRelayOutputs/></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text
  set_relay_output:
    summary: "Switch a relay output active or inactive"
    params:
      relay: { type: string, max_length: 64, pattern: "^[^<>&\"\\x27]*$", required: true, label: Relay, description: "Token of the relay output, from relays in state." }
      state: { type: enum, values: ["active", "inactive"], required: true, label: State, description: "active energizes the relay as configured, inactive releases it." }
    send: { method: POST, path: /onvif/device_service, content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tds=\"http://www.onvif.org/ver10/device/wsdl\"><s:Body><tds:SetRelayOutputState><tds:RelayOutputToken>{relay}</tds:RelayOutputToken><tds:LogicalState>{state}</tds:LogicalState></tds:SetRelayOutputState></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack

  # ── Media (profiles, sources, stream addresses) ──────────────────────
  get_profiles:
    summary: "List the media profiles with their video source, encoder and PTZ configuration"
    send: { method: POST, path: "/onvif/{settings.media_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:trt=\"http://www.onvif.org/ver10/media/wsdl\"><s:Body><trt:GetProfiles/></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text
  get_video_sources:
    summary: "List the video sources with their resolution and frame rate"
    send: { method: POST, path: "/onvif/{settings.media_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:trt=\"http://www.onvif.org/ver10/media/wsdl\"><s:Body><trt:GetVideoSources/></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text
  get_stream_uri:
    summary: "Read the RTSP address of the media profile's stream"
    send: { method: POST, path: "/onvif/{settings.media_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:trt=\"http://www.onvif.org/ver10/media/wsdl\"><s:Body><trt:GetStreamUri><trt:StreamSetup><tt:Stream>RTP-Unicast</tt:Stream><tt:Transport><tt:Protocol>RTSP</tt:Protocol></tt:Transport></trt:StreamSetup><trt:ProfileToken>{settings.profile_token}</trt:ProfileToken></trt:GetStreamUri></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text
  get_snapshot_uri:
    summary: "Read the JPEG snapshot address of the media profile"
    send: { method: POST, path: "/onvif/{settings.media_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:trt=\"http://www.onvif.org/ver10/media/wsdl\"><s:Body><trt:GetSnapshotUri><trt:ProfileToken>{settings.profile_token}</trt:ProfileToken></trt:GetSnapshotUri></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: text

  # ── PTZ ────────────────────────────────────────────────────────────────
  absolute_move:
    summary: "Move pan, tilt and zoom to absolute positions (generic spaces)"
    params:
      pan: { type: float, min: -1, max: 1, required: true, label: Pan, description: "Pan position in the generic space: -1 at one end of travel, 1 at the other." }
      tilt: { type: float, min: -1, max: 1, required: true, label: Tilt, description: "Tilt position in the generic space: -1 at one end of travel, 1 at the other." }
      zoom: { type: float, min: 0, max: 1, required: true, label: Zoom, description: "Zoom position in the generic space: 0 at full wide, 1 at full tele." }
    send: { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:AbsoluteMove><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken><tptz:Position><tt:PanTilt x=\"{pan:.4f}\" y=\"{tilt:.4f}\"/><tt:Zoom x=\"{zoom:.4f}\"/></tptz:Position></tptz:AbsoluteMove></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  absolute_move_at_speed:
    summary: "Move pan, tilt and zoom to absolute positions at given speeds"
    params:
      pan: { type: float, min: -1, max: 1, required: true, label: Pan, description: "Pan position in the generic space: -1 at one end of travel, 1 at the other." }
      tilt: { type: float, min: -1, max: 1, required: true, label: Tilt, description: "Tilt position in the generic space: -1 at one end of travel, 1 at the other." }
      zoom: { type: float, min: 0, max: 1, required: true, label: Zoom, description: "Zoom position in the generic space: 0 at full wide, 1 at full tele." }
      pan_tilt_speed: { type: float, min: 0, max: 1, required: true, label: Pan/tilt speed, description: "Pan/tilt speed as a fraction of the maximum, 0 to 1." }
      zoom_speed: { type: float, min: 0, max: 1, required: true, label: Zoom speed, description: "Zoom speed as a fraction of the maximum, 0 to 1." }
    send: { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:AbsoluteMove><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken><tptz:Position><tt:PanTilt x=\"{pan:.4f}\" y=\"{tilt:.4f}\"/><tt:Zoom x=\"{zoom:.4f}\"/></tptz:Position><tptz:Speed><tt:PanTilt x=\"{pan_tilt_speed:.4f}\" y=\"{pan_tilt_speed:.4f}\"/><tt:Zoom x=\"{zoom_speed:.4f}\"/></tptz:Speed></tptz:AbsoluteMove></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  absolute_pan_tilt:
    summary: "Move pan and tilt to absolute positions, leaving the zoom"
    params:
      pan: { type: float, min: -1, max: 1, required: true, label: Pan, description: "Pan position in the generic space: -1 at one end of travel, 1 at the other." }
      tilt: { type: float, min: -1, max: 1, required: true, label: Tilt, description: "Tilt position in the generic space: -1 at one end of travel, 1 at the other." }
    send: { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:AbsoluteMove><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken><tptz:Position><tt:PanTilt x=\"{pan:.4f}\" y=\"{tilt:.4f}\"/></tptz:Position></tptz:AbsoluteMove></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  absolute_zoom:
    summary: "Move the zoom to an absolute position, leaving pan and tilt"
    params:
      zoom: { type: float, min: 0, max: 1, required: true, label: Zoom, description: "Zoom position in the generic space: 0 at full wide, 1 at full tele." }
    send: { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:AbsoluteMove><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken><tptz:Position><tt:Zoom x=\"{zoom:.4f}\"/></tptz:Position></tptz:AbsoluteMove></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  relative_move:
    summary: "Move pan, tilt and zoom by a translation from the current position (generic spaces)"
    params:
      pan: { type: float, min: -1, max: 1, required: true, label: Pan, description: "Pan translation, -1 to 1 of the generic space." }
      tilt: { type: float, min: -1, max: 1, required: true, label: Tilt, description: "Tilt translation, -1 to 1 of the generic space." }
      zoom: { type: float, min: -1, max: 1, required: true, label: Zoom, description: "Zoom translation, -1 to 1 of the generic space." }
    send: { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:RelativeMove><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken><tptz:Translation><tt:PanTilt x=\"{pan:.4f}\" y=\"{tilt:.4f}\"/><tt:Zoom x=\"{zoom:.4f}\"/></tptz:Translation></tptz:RelativeMove></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  continuous_move:
    summary: "Move pan, tilt and zoom at velocities until stop"
    params:
      pan: { type: float, min: -1, max: 1, required: true, label: Pan velocity, description: "Pan velocity, -1 to 1: positive pans right, 0 holds." }
      tilt: { type: float, min: -1, max: 1, required: true, label: Tilt velocity, description: "Tilt velocity, -1 to 1: positive tilts up, 0 holds." }
      zoom: { type: float, min: -1, max: 1, required: true, label: Zoom velocity, description: "Zoom velocity, -1 to 1: positive zooms in, 0 holds." }
    send: { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:ContinuousMove><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken><tptz:Velocity><tt:PanTilt x=\"{pan:.4f}\" y=\"{tilt:.4f}\"/><tt:Zoom x=\"{zoom:.4f}\"/></tptz:Velocity></tptz:ContinuousMove></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  continuous_move_for:
    summary: "Move pan, tilt and zoom at velocities for a time, or until stop"
    params:
      pan: { type: float, min: -1, max: 1, required: true, label: Pan velocity, description: "Pan velocity, -1 to 1: positive pans right, 0 holds." }
      tilt: { type: float, min: -1, max: 1, required: true, label: Tilt velocity, description: "Tilt velocity, -1 to 1: positive tilts up, 0 holds." }
      zoom: { type: float, min: -1, max: 1, required: true, label: Zoom velocity, description: "Zoom velocity, -1 to 1: positive zooms in, 0 holds." }
      seconds: { type: int, min: 1, max: 86400, required: true, label: Duration, description: "Seconds the move lasts unless stopped first." }
    send: { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:ContinuousMove><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken><tptz:Velocity><tt:PanTilt x=\"{pan:.4f}\" y=\"{tilt:.4f}\"/><tt:Zoom x=\"{zoom:.4f}\"/></tptz:Velocity><tptz:Timeout>PT{seconds}S</tptz:Timeout></tptz:ContinuousMove></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  stop:
