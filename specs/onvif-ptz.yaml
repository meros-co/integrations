      - { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:GetPresets><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken></tptz:GetPresets></s:Body></s:Envelope>" }
    expect: { status: 200 }
    returns: ack
  remove_preset:
    summary: "Remove a preset, then read the presets back"
    params:
      preset: { type: string, max_length: 64, pattern: "^[^<>&\"\\x27]*$", required: true, label: Preset, description: "Preset token, from presets in state." }
    send:
      - { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:RemovePreset><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken><tptz:PresetToken>{preset}</tptz:PresetToken></tptz:RemovePreset></s:Body></s:Envelope>" }
      - { method: POST, path: "/onvif/{settings.ptz_path}", content_type: "application/soap+xml; charset=utf-8", body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\" xmlns:tt=\"http://www.onvif.org/ver10/schema\" xmlns:tptz=\"http://www.onvif.org/ver20/ptz/wsdl\"><s:Body><tptz:GetPresets><tptz:ProfileToken>{settings.profile_token}</tptz:ProfileToken></tptz:GetPresets></s:Body></s:Envelope>" }
    expect: { status: 200 }
