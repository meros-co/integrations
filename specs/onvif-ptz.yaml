    expect: { status: 200 }
    returns: ack
  save_preset:
    summary: "Save the current position as a new preset with a name, then read the presets back"
    params:
      name: { type: string, max_length: 64, pattern: "^[^<>&\"\\x27]*$", required: true, label: Name, description: "Preset name." }
