quirks:
  - models: [all]
    severity: warning
    text: >
      Authentication is HTTP Digest by default, which the Core Specification requires of
      conformant devices. Legacy devices that accept only WS-Security UsernameToken take auth
      wsse: each message then carries a UsernameToken in its SOAP header, with a fresh nonce, the
      time (Created) and the password digest Base64(SHA-1(nonce + created + password)), the
      password itself never sent. Such a device compares Created with its own clock and refuses a
      message outside its tolerance (often a few seconds), so the host and the device must keep
      the same time (NTP; get_system_date_and_time, which needs no credential, shows the
      device's). A refused UsernameToken is answered with a SOAP fault (ter:NotAuthorized) under
      HTTP 400 or 401; a 401 stops the device until its settings change, a 400 fails that
      command.
  - models: [all]
    severity: info
    text: >
      Only the device management service has a fixed address (/onvif/device_service). The media,
      PTZ and imaging services are at the addresses GetServices lists (in state under services);
      set ptz_path, media_path and imaging_path to the last part of each when they are not the
      defaults. Every command acts on the profile_token and video_source_token settings, which
      come from profiles and video_sources in state; until they are set, the PTZ and imaging
      requests are answered with a SOAP fault.
  - models: [all]
    severity: info
    text: >
      Moves use the generic spaces (pan/tilt -1 to 1, zoom 0 to 1, speeds 0 to 1) by naming no
      space, which a PTZ configuration's defaults then set; their mapping to degrees and
      magnification is the device's. The imaging levels (brightness, contrast, saturation,
      sharpness, gains) are in each device's own range, read into imaging_options.
  - models: [all]
    severity: info
    text: >
      Nothing is pushed: ONVIF's events need a subscription (WS-BaseNotification or a pull point),
      which this spec does not open. The PTZ status is read every second, the focus status every
      2 s, the imaging settings every 5 s and the lists every 30 s. Relay outputs report their
      configuration but not their present state (an API limit).
  - models: [all]
    severity: info
    text: >
      Values placed in the SOAP body (tokens, names, the auxiliary command) are refused when they
      hold <, >, &, a double quote or an apostrophe, since the body is not escaped. The PTZ
      configuration (SetConfiguration), preset tour creation and editing, network, user and
      time settings, and media configuration editing are not covered by this spec.
  - models: [all]
    severity: critical
    text: >
      factory_default resets the device (Hard also its network settings, which can cut it off);
      reboot drops the video; update_preset and remove_preset overwrite or delete a stored
      position.
