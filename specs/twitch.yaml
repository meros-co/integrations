spec: 1
id: twitch
name: Twitch (Helix API)
vendor: Twitch
category: other

# A cloud service, not a device on the venue network: the integration is
# opened with host api.twitch.tv on port 443 and acts for one channel, the
# broadcaster_id setting, as the user who signed in. The consumer owns the
# credential: it registers its own Twitch application, runs the sign-in (the
# Device Code Grant for a public client, or the authorization code grant for
# a confidential one), and passes the tokens as settings; the core keeps the
# access token fresh with the refresh token, validates it hourly at
# id.twitch.tv as Twitch requires, and reports every new token, a rotated
# refresh token included, as a credentials event. The core never runs a
# sign-in and persists nothing.

source:
  - title: Twitch API reference (Helix)
    author: Twitch
    url: https://dev.twitch.tv/docs/api/reference
    note: >
      Manufacturer document, retrieved 2026-10-04. Get Users (GET /users; with
      a user access token and no id or login, the token's user). Get Channel
      Information (GET /channels, broadcaster_id; broadcaster_language,
      game_id, game_name, title, delay, tags, content_classification_labels,
      is_branded_content). Modify Channel Information (PATCH /channels,
      channel:manage:broadcast; game_id "" or "0" unsets; title not empty, at
      most 140 characters; delay Partner only, at most 900 s; tags at most 10
      of at most 25 characters, [] clears; 204). Get Stream Key (GET
      /streams/key, channel:read:stream_key). Get Streams (GET /streams,
      user_id, type all or live; only broadcasting users are returned; type
      "live", viewer_count, started_at RFC 3339). Search Categories (GET
      /search/categories, query, first 1 to 100). Create Stream Marker (POST
      /streams/markers, user_id, description at most 140 characters; 404 when
      not live or VODs are off) and Get Stream Markers. Start Commercial (POST
      /channels/commercial, channel:edit:commercial; length at most 180;
      Partners and Affiliates, live, broadcaster only; length, message,
      retry_after). Get Ad Schedule and Snooze Next Ad (channel:read:ads,
      channel:manage:ads). Start a raid (POST /raids, from_broadcaster_id,
      to_broadcaster_id, channel:manage:raids, 200; 10 requests per 10
      minutes) and Cancel a raid (DELETE /raids, 204). Get Chat Settings and
      Update Chat Settings (PATCH /chat/settings, broadcaster_id and
      moderator_id, moderator:manage:chat_settings; follower_mode_duration 0
      to 129600 minutes, slow_mode_wait_time 3 to 120 s,
      non_moderator_chat_delay_duration 2, 4 or 6; a duration only with its
      mode on; answers 200 with the settings). Send Chat Announcement (POST
      /chat/announcements, moderator:manage:announcements; message at most 500
      characters; color blue, green, orange, purple or primary; 204; one per
      2 s). Send Chat Message (POST /chat/messages, user:write:chat).
      Get Channel Followers (GET /channels/followers; total is returned with
      any valid token). Create Clip (POST /clips, clips:edit, 202). Every
      endpoint's 401 includes a Client-Id that does not match the token's
      client. Retrieved again 2026-10-14 for: Create Poll, End Poll and Get
      Polls (/polls; title 60, 2 to 5 choices of 25, duration 15 to 1800,
      channel_points_per_vote 1 to 1000000; newest first); Create
      Prediction, End Prediction (LOCKED, RESOLVED with winning_outcome_id,
      CANCELED) and Get Predictions (title 45, 2 to 10 outcomes,
      prediction_window 30 to 1800); Ban User and Unban User
      (/moderation/bans, data.user_id, duration 1 to 1209600, reason 500),
      Get Banned Users, Warn Chat User, Delete Chat Messages (message_id
      optional: all messages), Get and Update Shield Mode Status (PUT,
      is_active), Get, Add and Remove Channel Moderator and VIP (204; 10
      per 10 s), Get, Add and Remove Blocked Terms, Send a Shoutout (204;
      once per 2 minutes, once per hour per channel); Create, Get, Update
      and Delete Custom Reward and Get and Update Redemption Status (only
      the creating client id may change a reward or its redemptions); Get
      Channel Stream Schedule (any token; 404 with no schedule; vacation
      null when off), Update Channel Stream Schedule (vacation fields as
      query parameters, 204), Create, Update and Delete Channel Stream
      Schedule Segment (duration a string, 30 to 1380); Get Clips, Get
      Videos and Delete Videos. A missing scope is listed under 401 for
      every one of them.
  - title: Twitch EventSub subscription types
    author: Twitch
    url: https://dev.twitch.tv/docs/eventsub/eventsub-subscription-types
    note: >
      Manufacturer document, retrieved 2026-10-14. channel.poll.begin,
      progress and end (v1, channel:read:polls; end status completed,
      terminated or archived), channel.prediction.begin, progress, lock and
      end (v1, channel:read:predictions; outcome colors blue and pink, end
      status resolved or canceled), channel.shield_mode.begin and end (v1,
      condition with moderator_user_id, moderator:read:shield_mode),
      channel.channel_points_custom_reward_redemption.add and update (v1,
      channel:read:redemptions), channel.moderator.add and remove (v1,
      moderation:read) and channel.vip.add and remove (v1,
      channel:read:vips). Create EventSub Subscription answers a missing
      scope with 403.
  - title: Twitch API guide (Twitch API rate limits)
    author: Twitch
    url: https://dev.twitch.tv/docs/api/guide
    note: >
      Manufacturer document, retrieved 2026-10-04. Requests carry
      Authorization Bearer and Client-Id. A token bucket per client id and
      user for user tokens, normally 1 point per request; Ratelimit-Limit,
      Ratelimit-Remaining and Ratelimit-Reset on every answer; 429 when
      empty.
  - title: Twitch authentication, Refresh tokens
    author: Twitch
    url: https://dev.twitch.tv/docs/authentication/refresh-tokens
    note: >
      Manufacturer document, retrieved 2026-10-04. POST
      https://id.twitch.tv/oauth2/token, form-encoded grant_type
      refresh_token, refresh_token, client_id and client_secret (not for a
      public client); the answer carries access_token, refresh_token (which
      may change), expires_in, scope and token_type. An invalid refresh
      token answers 400 with message "Invalid refresh token" (no
      invalid_grant), and one no longer valid may answer 401. A public
      client's refresh token expires 30 days after it is issued.
  - title: Twitch authentication, Getting OAuth access tokens (Device code grant flow)
    author: Twitch
    url: https://dev.twitch.tv/docs/authentication/getting-tokens-oauth
    note: >
      Manufacturer document, retrieved 2026-10-04. Public and confidential
      clients may use the device code flow; a public client needs no secret,
      also when refreshing. A public client's refresh token is single use: a
      refresh replaces it, and the old one answers 400 "Invalid refresh
      token"; it lapses after 30 days unused. A confidential client's
      refresh token does not expire; both end when the user changes their
      password or disconnects the application. Access tokens last about 4
      hours.
  - title: Twitch authentication, Validating tokens
    author: Twitch
    url: https://dev.twitch.tv/docs/authentication/validate-tokens
    note: >
      Manufacturer document, retrieved 2026-10-04. An application that keeps
      an OAuth session validates its token at GET
      https://id.twitch.tv/oauth2/validate on start and every hour, with the
      header Authorization OAuth (Bearer is accepted too); the answer
      carries client_id, login, scopes, user_id and expires_in, and an
      invalid token answers 401 "invalid access token". Twitch audits
      applications and may revoke or throttle those that don't validate.
  - title: RFC 6749, The OAuth 2.0 Authorization Framework, section 6 (Refreshing an Access Token)
    author: IETF
    url: https://www.rfc-editor.org/rfc/rfc6749
    note: >
      The refresh request, and a new refresh token in the answer replacing
      the old one.

transport:
  type: http
  port: 443
  scheme: https
  # The access_token setting as Bearer, refreshed with refresh_token at
  # Twitch's token endpoint (or the token_url setting's proxy). A public
  # client leaves client_secret empty and refreshes with client_id alone.
  auth: oauth2
  oauth:
    token_url: https://id.twitch.tv/oauth2/token
    refresh_ahead_s: 300
    client_auth: body
    # Twitch requires the token validated on start and every hour; the core
    # does it, monitored or not, and a 401 there is handled as for the API.
    validate: { url: https://id.twitch.tv/oauth2/validate, every_s: 3600, scheme: OAuth }
  # Helix wants the application's client id beside every bearer token.
  headers:
    Client-Id: "{settings.client_id}"
  # Twitch answers 403 for a missing role or an unfinished account and 400
  # for most rule breaches; only 401 means the token was refused.
  refusal_status: [401]
  timeout_ms: 10000
  # Get Users with no parameters: the token's own user (1 rate-limit point),
  # so an idle probe also checks the token.
  probe: { method: GET, path: /helix/users }

settings:
  client_id: { type: string, max_length: 512, default: "",
               label: Client ID,
               description: "The consumer's own Twitch application's client ID, sent as Client-Id on every request and with each token refresh; it must be the client the tokens were issued to." }
  client_secret: { type: string, secret: true, max_length: 512, default: "",
                   label: Client secret,
                   description: "The application's secret for a confidential client; leave empty for a public client (Device Code Grant), which refreshes with its client ID alone, or when token_url names a proxy that adds it." }
  refresh_token: { type: string, secret: true, max_length: 4096, default: "",
                   label: Refresh token,
                   description: "The refresh token from the consumer's sign-in; a public client's is single use and replaced at every refresh, so persist each one the credentials event reports." }
  access_token: { type: string, secret: true, max_length: 4096, default: "",
                  label: Access token,
                  description: "The current user access token, about 4 hours long; may be left empty when a refresh token is given, and the core reports each new one in a credentials event." }
  expires_at: { type: int, min: 0,
                label: Access token expiry,
                description: "When the access token expires, in Unix seconds; the core refreshes 5 minutes before, and reports each new expiry in a credentials event." }
  token_url: { type: string, max_length: 2048, default: "",
               pattern: "^(https://[^\\s]+|http://(localhost|127\\.0\\.0\\.1|\\[::1\\])(:[0-9]+)?(/[^\\s]*)?)?$",
               label: Token endpoint override,
               description: "A token endpoint to refresh at instead of Twitch's, such as the consumer's own token proxy that holds the client secret; https, or http to this machine only. Empty uses Twitch's." }
  broadcaster_id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
                    label: Broadcaster ID,
                    description: "The numeric user ID of the channel acted on, which must be the signed-in user's own: user_id in the token validation answer, or id from get_user." }

ports:
  - { port: 443, protocol: https, role: control, note: "the cloud API at api.twitch.tv, opened by that host name; token refreshes and the hourly token validation go to id.twitch.tv:443" }
  - { port: 443, protocol: wss, role: push, note: "EventSub's websocket at eventsub.wss.twitch.tv" }

models:
  - id: helix
    name: Twitch Helix API
    supports: [get_user, get_users_by_login, get_channel_information, set_title, set_category,
               set_language, set_tags, set_branded_content, set_stream_delay, modify_channel_information,
               get_stream_key, get_stream, get_follower_count, search_categories, create_stream_marker,
               get_stream_markers, create_clip, start_commercial, get_ad_schedule, snooze_next_ad,
               start_raid, cancel_raid, get_chat_settings, update_chat_settings, slow_mode_on,
               slow_mode_off, follower_mode_on, follower_mode_off, subscriber_mode, emote_mode,
               unique_chat_mode, chat_delay_on, chat_delay_off, send_announcement, send_chat_message,
               create_poll, create_poll_with_channel_points, end_poll, get_polls,
               create_prediction, lock_prediction, resolve_prediction, cancel_prediction, get_predictions,
               ban_user, timeout_user, unban_user, get_banned_users, warn_user, delete_chat_message, clear_chat,
               get_shield_mode, set_shield_mode, get_moderators, add_moderator, remove_moderator,
               get_vips, add_vip, remove_vip, get_blocked_terms, add_blocked_term, remove_blocked_term,
               send_shoutout, get_custom_rewards, create_custom_reward, update_custom_reward,
               set_reward_enabled, set_reward_paused, delete_custom_reward, get_redemptions,
               update_redemption_status, get_schedule, create_schedule_segment, update_schedule_segment,
               cancel_schedule_segment, delete_schedule_segment, set_vacation, end_vacation,
               get_clips, get_clips_between, get_clip, get_videos, get_video, delete_video]
    verification: none
    notes: >
      Acts for the channel named by broadcaster_id, as the signed-in user,
      who must be that channel's broadcaster. Each command needs its scope
      granted at sign-in (listed in its summary).

commands:
  # ── Users ────────────────────────────────────────────────────────────────
  get_user:
    summary: The signed-in user, whose id is the broadcaster_id (Get Users without parameters)
    send: { method: GET, path: /helix/users }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_users_by_login:
    summary: A user by login name, for the id a raid or a lookup needs (Get Users with login)
    params:
      login: { type: string, pattern: "^[A-Za-z0-9_]{1,25}$", required: true,
               label: Login,
               description: "The user's login name, as in their channel URL twitch.tv/<login>." }
    send: { method: GET, path: /helix/users, query: { login: "{login}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  # ── Channel ──────────────────────────────────────────────────────────────
  get_channel_information:
    summary: A channel's title, category, language, tags, delay, labels and branded-content flag (Get Channel Information)
    params:
      broadcaster_id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
                        label: Broadcaster ID,
                        description: "The numeric user ID of the channel, this one or any other." }
    send: { method: GET, path: /helix/channels, query: { broadcaster_id: "{broadcaster_id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  set_title:
    summary: Change the channel's stream title (Modify Channel Information; channel:manage:broadcast)
    params:
      title: { type: string, pattern: "\\S", max_length: 140, required: true,
               label: Title,
               description: "The new stream title, up to 140 characters; Twitch refuses an empty one." }
    send: { method: PATCH, path: /helix/channels, query: { broadcaster_id: "{settings.broadcaster_id}" },
            body: '{"title":{title:json}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  set_category:
    summary: Change the channel's category, the game or other category it streams under (Modify Channel Information; channel:manage:broadcast)
    params:
      game_id: { type: string, pattern: "^[0-9]*$", max_length: 32, required: true,
                 label: Category ID,
                 description: "The category's id from search_categories; empty or 0 removes the category." }
    send: { method: PATCH, path: /helix/channels, query: { broadcaster_id: "{settings.broadcaster_id}" },
            body: '{"game_id":{game_id:json}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  set_language:
    summary: Change the channel's broadcast language (Modify Channel Information; channel:manage:broadcast)
    params:
      language: { type: string, pattern: "^([a-z]{2}|other)$", required: true,
                  label: Language,
                  description: "A two-letter ISO 639-1 code such as en or de, or other." }
    send: { method: PATCH, path: /helix/channels, query: { broadcaster_id: "{settings.broadcaster_id}" },
            body: '{"broadcaster_language":{language:json}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  set_tags:
    summary: Replace the channel's tags with a JSON array of strings (Modify Channel Information; channel:manage:broadcast)
    params:
      tags: { type: json, required: true,
              label: Tags,
              description: "A JSON array of up to 10 tags, each up to 25 letters and digits with no spaces; [] removes them all." }
    send: { method: PATCH, path: /helix/channels, query: { broadcaster_id: "{settings.broadcaster_id}" },
            body: '{"tags":{tags}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  set_branded_content:
    summary: Mark the stream as branded content, or not (Modify Channel Information; channel:manage:broadcast)
    params:
      enabled: { type: bool, required: true,
                 label: Branded content,
                 description: "On when the stream carries paid promotion that must be disclosed to viewers." }
    send: { method: PATCH, path: /helix/channels, query: { broadcaster_id: "{settings.broadcaster_id}" },
            body: '{"is_branded_content":{enabled}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  set_stream_delay:
    summary: Set the stream delay viewers see, Partners only (Modify Channel Information; channel:manage:broadcast)
    params:
      delay: { type: int, min: 0, max: 900, required: true,
               label: Delay,
               description: "Seconds the stream is held back before viewers see it, 0 to 900." }
    send: { method: PATCH, path: /helix/channels, query: { broadcaster_id: "{settings.broadcaster_id}" },
            body: '{"delay":{delay}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  modify_channel_information:
    summary: Change several channel properties at once with a Modify Channel Information body (game_id, broadcaster_language, title, delay, tags, content_classification_labels, is_branded_content; channel:manage:broadcast)
    params:
      changes: { type: json, required: true,
                 label: Changes,
                 description: "A JSON object with at least one of the fields Twitch documents for Modify Channel Information; fields left out are unchanged." }
    send: { method: PATCH, path: /helix/channels, query: { broadcaster_id: "{settings.broadcaster_id}" },
            body: '{changes}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  # ── Stream ───────────────────────────────────────────────────────────────
  get_stream_key:
    summary: The channel's stream key for the encoder; a secret, returned here only and never kept in state (Get Stream Key; channel:read:stream_key)
    send: { method: GET, path: /helix/streams/key, query: { broadcaster_id: "{settings.broadcaster_id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_stream:
    summary: The channel's live stream, with viewer count and start time; an empty list while offline (Get Streams)
    send: { method: GET, path: /helix/streams, query: { user_id: "{settings.broadcaster_id}", type: all } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_follower_count:
    summary: How many users follow the channel (Get Channel Followers, total)
    send: { method: GET, path: /helix/channels/followers,
            query: { broadcaster_id: "{settings.broadcaster_id}", first: "1" } }
    expect: { status: 200, json_path: "$.total" }
    returns: value

  search_categories:
    summary: Categories (games and others) whose name matches, for set_category (Search Categories)
    params:
      query: { type: string, pattern: "\\S", max_length: 100, required: true,
               label: Search,
               description: "Text the category's name contains, such as Just Chatting." }
      first: { type: int, min: 1, max: 100, default: 20,
               label: Results,
               description: "How many categories to return, 1 to 100." }
    send: { method: GET, path: /helix/search/categories, query: { query: "{query}", first: "{first}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  create_stream_marker:
    summary: Mark the current moment of the live stream for the VOD, with a description (Create Stream Marker; channel:manage:broadcast)
    params:
      description: { type: string, max_length: 140, default: "",
                     label: Description,
                     description: "What happened at the marker, up to 140 characters." }
    send: { method: POST, path: /helix/streams/markers,
            body: '{"user_id":{settings.broadcaster_id:json},"description":{description:json}}',
            content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_stream_markers:
    summary: The markers of the channel's most recent VOD (Get Stream Markers; user:read:broadcast or channel:manage:broadcast)
    params:
      first: { type: int, min: 1, max: 100, default: 20,
               label: Results,
               description: "How many markers to return, 1 to 100." }
    send: { method: GET, path: /helix/streams/markers,
            query: { user_id: "{settings.broadcaster_id}", first: "{first}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  create_clip:
    summary: Clip the live stream now; Twitch makes the clip in the background (Create Clip; clips:edit)
    send: { method: POST, path: /helix/clips, query: { broadcaster_id: "{settings.broadcaster_id}" } }
    expect: { status: 202, json_path: "$.data" }
    returns: value

  # ── Ads ──────────────────────────────────────────────────────────────────
  start_commercial:
    summary: Run a commercial break now, live Partners and Affiliates only (Start Commercial; channel:edit:commercial)
    params:
      length: { type: int, min: 1, max: 180, default: 30,
                label: Length,
                description: "Length of the break in seconds, up to 180; Twitch may run a shorter one." }
    send: { method: POST, path: /helix/channels/commercial,
            body: '{"broadcaster_id":{settings.broadcaster_id:json},"length":{length}}',
            content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_ad_schedule:
    summary: The next scheduled ad, the last one, the preroll-free time and the snoozes left (Get Ad Schedule; channel:read:ads)
    send: { method: GET, path: /helix/channels/ads, query: { broadcaster_id: "{settings.broadcaster_id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  snooze_next_ad:
    summary: Push the next scheduled ad back 5 minutes, using one snooze (Snooze Next Ad; channel:manage:ads)
    send: { method: POST, path: /helix/channels/ads/schedule/snooze,
            query: { broadcaster_id: "{settings.broadcaster_id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  # ── Raids ────────────────────────────────────────────────────────────────
  start_raid:
    summary: Start a raid on another channel; it happens when the broadcaster confirms in Twitch or after 90 seconds (Start a raid; channel:manage:raids)
    params:
      to_broadcaster_id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
                           label: Target channel ID,
                           description: "The numeric user ID of the channel to raid, from get_users_by_login." }
    send: { method: POST, path: /helix/raids,
            query: { from_broadcaster_id: "{settings.broadcaster_id}", to_broadcaster_id: "{to_broadcaster_id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  cancel_raid:
    summary: Cancel the pending raid (Cancel a raid; channel:manage:raids)
    send: { method: DELETE, path: /helix/raids, query: { broadcaster_id: "{settings.broadcaster_id}" } }
    expect: { status: 204 }
    returns: ack

  # ── Chat ─────────────────────────────────────────────────────────────────
  get_chat_settings:
    summary: The channel's chat modes, the moderator-only delay included (Get Chat Settings with moderator_id; moderator:read:chat_settings for the delay)
    send: { method: GET, path: /helix/chat/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  update_chat_settings:
    summary: Change several chat modes at once with an Update Chat Settings body (emote_mode, follower_mode, follower_mode_duration, non_moderator_chat_delay, non_moderator_chat_delay_duration, slow_mode, slow_mode_wait_time, subscriber_mode, unique_chat_mode; moderator:manage:chat_settings)
    params:
      changes: { type: json, required: true,
                 label: Changes,
                 description: "A JSON object of the chat settings to change, as Twitch documents them; a duration is accepted only with its mode on." }
    send: { method: PATCH, path: /helix/chat/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{changes}', content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  slow_mode_on:
    summary: Make chatters wait between messages (Update Chat Settings slow_mode; moderator:manage:chat_settings)
    params:
      wait_time: { type: int, min: 3, max: 120, default: 30,
                   label: Wait,
                   description: "Seconds a chatter waits between messages, 3 to 120." }
    send: { method: PATCH, path: /helix/chat/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"slow_mode":true,"slow_mode_wait_time":{wait_time}}', content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  slow_mode_off:
    summary: End slow mode (Update Chat Settings slow_mode; moderator:manage:chat_settings)
    send: { method: PATCH, path: /helix/chat/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"slow_mode":false}', content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  follower_mode_on:
    summary: Let only followers chat, optionally only those following for a while (Update Chat Settings follower_mode; moderator:manage:chat_settings)
    params:
      duration: { type: int, min: 0, max: 129600, default: 0,
                  label: Following for,
                  description: "Minutes a user must have followed before chatting, 0 to 129600 (90 days); 0 lets any follower chat." }
    send: { method: PATCH, path: /helix/chat/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"follower_mode":true,"follower_mode_duration":{duration}}', content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  follower_mode_off:
    summary: Let everyone chat, followers or not (Update Chat Settings follower_mode; moderator:manage:chat_settings)
    send: { method: PATCH, path: /helix/chat/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"follower_mode":false}', content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  subscriber_mode:
    summary: Let only subscribers and moderators chat, or everyone again (Update Chat Settings subscriber_mode; moderator:manage:chat_settings)
    params:
      enabled: { type: bool, required: true,
                 label: Subscribers only,
                 description: "On to let only subscribers and moderators chat, off for everyone." }
    send: { method: PATCH, path: /helix/chat/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"subscriber_mode":{enabled}}', content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  emote_mode:
    summary: Allow only emotes in chat, or any message again (Update Chat Settings emote_mode; moderator:manage:chat_settings)
    params:
      enabled: { type: bool, required: true,
                 label: Emotes only,
                 description: "On to allow messages made only of emotes." }
    send: { method: PATCH, path: /helix/chat/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"emote_mode":{enabled}}', content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  unique_chat_mode:
    summary: Refuse messages that repeat one already sent, or allow them again (Update Chat Settings unique_chat_mode; moderator:manage:chat_settings)
    params:
      enabled: { type: bool, required: true,
                 label: Unique messages only,
                 description: "On to refuse a message identical to one already in chat." }
    send: { method: PATCH, path: /helix/chat/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"unique_chat_mode":{enabled}}', content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  chat_delay_on:
    summary: Hold chatters' messages back so moderators can remove them first (Update Chat Settings non_moderator_chat_delay; moderator:manage:chat_settings)
    params:
      duration: { type: enum, values: ["2", "4", "6"], default: "4",
                  label: Delay,
                  description: "Seconds a non-moderator's message is held before others see it: 2, 4 or 6." }
    send: { method: PATCH, path: /helix/chat/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"non_moderator_chat_delay":true,"non_moderator_chat_delay_duration":{duration}}',
            content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  chat_delay_off:
    summary: Show chatters' messages at once (Update Chat Settings non_moderator_chat_delay; moderator:manage:chat_settings)
    send: { method: PATCH, path: /helix/chat/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"non_moderator_chat_delay":false}', content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  send_announcement:
    summary: Post a highlighted announcement in chat (Send Chat Announcement; moderator:manage:announcements)
    params:
      message: { type: string, pattern: "\\S", max_length: 500, required: true,
                 label: Message,
                 description: "The announcement text, up to 500 characters." }
      color: { type: enum, values: [primary, blue, green, orange, purple], default: primary,
               label: Colour,
               description: "The announcement's highlight colour; primary uses the channel's accent colour." }
    send: { method: POST, path: /helix/chat/announcements,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"message":{message:json},"color":{color:json}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  send_chat_message:
    summary: Post a message in the channel's chat as the signed-in user (Send Chat Message; user:write:chat)
    params:
      message: { type: string, pattern: "\\S", max_length: 500, required: true,
                 label: Message,
                 description: "The message text, up to 500 characters." }
    send: { method: POST, path: /helix/chat/messages,
            body: '{"broadcaster_id":{settings.broadcaster_id:json},"sender_id":{settings.broadcaster_id:json},"message":{message:json}}',
            content_type: application/json }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  # ── Polls ────────────────────────────────────────────────────────────────
  create_poll:
    summary: Start a poll viewers vote on, one vote each; it runs at once and only one runs at a time (Create Poll; channel:manage:polls)
    params:
      title: { type: string, pattern: "\\S", max_length: 60, required: true,
               label: Question,
               description: "The question viewers vote on, up to 60 characters." }
      choices: { type: json, required: true,
                 label: Choices,
                 description: "A JSON array of 2 to 5 objects as Twitch documents them, each {\"title\": \"...\"} of up to 25 characters." }
      duration: { type: int, min: 15, max: 1800, default: 60,
                  label: Duration,
                  description: "Seconds the poll runs, 15 to 1800 (30 minutes)." }
    send: { method: POST, path: /helix/polls, content_type: application/json,
            body: '{"broadcaster_id":{settings.broadcaster_id:json},"title":{title:json},"choices":{choices},"duration":{duration}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  create_poll_with_channel_points:
    summary: Start a poll in which viewers may buy extra votes with Channel Points (Create Poll with channel_points_voting_enabled; channel:manage:polls)
    params:
      title: { type: string, pattern: "\\S", max_length: 60, required: true,
               label: Question,
               description: "The question viewers vote on, up to 60 characters." }
      choices: { type: json, required: true,
                 label: Choices,
                 description: "A JSON array of 2 to 5 objects as Twitch documents them, each {\"title\": \"...\"} of up to 25 characters." }
      duration: { type: int, min: 15, max: 1800, default: 60,
                  label: Duration,
                  description: "Seconds the poll runs, 15 to 1800 (30 minutes)." }
      points_per_vote: { type: int, min: 1, max: 1000000, default: 100,
                         label: Points per extra vote,
                         description: "Channel Points a viewer spends for each vote beyond the first, 1 to 1,000,000." }
    send: { method: POST, path: /helix/polls, content_type: application/json,
            body: '{"broadcaster_id":{settings.broadcaster_id:json},"title":{title:json},"choices":{choices},"duration":{duration},"channel_points_voting_enabled":true,"channel_points_per_vote":{points_per_vote}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  end_poll:
    summary: End the running poll now, leaving its result on show or archiving it (End Poll; channel:manage:polls)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
            label: Poll ID,
            description: "The running poll's id, poll.id in state." }
      status: { type: enum, values: [TERMINATED, ARCHIVED], default: TERMINATED,
                label: End as,
                description: "TERMINATED keeps the result visible to viewers; ARCHIVED hides it from the channel." }
    send: { method: PATCH, path: /helix/polls, content_type: application/json,
            body: '{"broadcaster_id":{settings.broadcaster_id:json},"id":{id:json},"status":{status:json}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_polls:
    summary: The channel's polls of the last 90 days, newest first; the newest is kept in state (Get Polls; channel:read:polls)
    params:
      first: { type: int, min: 1, max: 20, default: 1,
               label: Results,
               description: "How many polls to return, newest first, 1 to 20." }
    send: { method: GET, path: /helix/polls, query: { broadcaster_id: "{settings.broadcaster_id}", first: "{first}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  # ── Predictions ──────────────────────────────────────────────────────────
  create_prediction:
    summary: Start a Channel Points prediction; it runs at once and only one runs at a time (Create Prediction; channel:manage:predictions)
    params:
      title: { type: string, pattern: "\\S", max_length: 45, required: true,
               label: Question,
               description: "The question viewers predict the answer to, up to 45 characters." }
      outcomes: { type: json, required: true,
                  label: Outcomes,
                  description: "A JSON array of 2 to 10 objects as Twitch documents them, each {\"title\": \"...\"} of up to 25 characters." }
      prediction_window: { type: int, min: 30, max: 1800, default: 120,
                           label: Window,
                           description: "Seconds viewers may predict before it locks, 30 to 1800." }
    send: { method: POST, path: /helix/predictions, content_type: application/json,
            body: '{"broadcaster_id":{settings.broadcaster_id:json},"title":{title:json},"outcomes":{outcomes},"prediction_window":{prediction_window}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  lock_prediction:
    summary: Stop viewers predicting before the window ends (End Prediction, status LOCKED; channel:manage:predictions)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
            label: Prediction ID,
            description: "The running prediction's id, prediction.id in state." }
    send: { method: PATCH, path: /helix/predictions, content_type: application/json,
            body: '{"broadcaster_id":{settings.broadcaster_id:json},"id":{id:json},"status":"LOCKED"}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  resolve_prediction:
    summary: Name the winning outcome and pay out the Channel Points (End Prediction, status RESOLVED; channel:manage:predictions)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
            label: Prediction ID,
            description: "The active or locked prediction's id, prediction.id in state." }
      winning_outcome_id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
                            label: Winning outcome ID,
                            description: "The id of the outcome that happened, from prediction.outcomes in state." }
    send: { method: PATCH, path: /helix/predictions, content_type: application/json,
            body: '{"broadcaster_id":{settings.broadcaster_id:json},"id":{id:json},"status":"RESOLVED","winning_outcome_id":{winning_outcome_id:json}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  cancel_prediction:
    summary: Cancel the prediction and refund every viewer's Channel Points (End Prediction, status CANCELED; channel:manage:predictions)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
            label: Prediction ID,
            description: "The active or locked prediction's id, prediction.id in state." }
    send: { method: PATCH, path: /helix/predictions, content_type: application/json,
            body: '{"broadcaster_id":{settings.broadcaster_id:json},"id":{id:json},"status":"CANCELED"}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_predictions:
    summary: The channel's predictions, newest first; the newest is kept in state (Get Predictions; channel:read:predictions)
    params:
      first: { type: int, min: 1, max: 25, default: 1,
               label: Results,
               description: "How many predictions to return, newest first, 1 to 25." }
    send: { method: GET, path: /helix/predictions, query: { broadcaster_id: "{settings.broadcaster_id}", first: "{first}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  # ── Moderation ───────────────────────────────────────────────────────────
  ban_user:
    summary: Ban a user from the channel's chat until unbanned (Ban User without duration; moderator:manage:banned_users)
    params:
      user_id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
                 label: User ID,
                 description: "The numeric user ID of the chatter to ban, from get_users_by_login." }
      reason: { type: string, max_length: 500, default: "",
                label: Reason,
                description: "Why the user is banned, up to 500 characters; shown to moderators." }
    send: { method: POST, path: /helix/moderation/bans, content_type: application/json,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"data":{"user_id":{user_id:json},"reason":{reason:json}}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  timeout_user:
    summary: Keep a user out of chat for a while, or change the length of their timeout (Ban User with duration; moderator:manage:banned_users)
    params:
      user_id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
                 label: User ID,
                 description: "The numeric user ID of the chatter to time out." }
      duration: { type: int, min: 1, max: 1209600, default: 600,
                  label: Duration,
                  description: "Seconds the timeout lasts, 1 to 1,209,600 (two weeks); 1 ends a timeout early." }
      reason: { type: string, max_length: 500, default: "",
                label: Reason,
                description: "Why the user is timed out, up to 500 characters." }
    send: { method: POST, path: /helix/moderation/bans, content_type: application/json,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"data":{"user_id":{user_id:json},"duration":{duration},"reason":{reason:json}}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  unban_user:
    summary: Lift a user's ban or timeout (Unban User; moderator:manage:banned_users)
    params:
      user_id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
                 label: User ID,
                 description: "The numeric user ID of the banned or timed-out chatter." }
    send: { method: DELETE, path: /helix/moderation/bans,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}", user_id: "{user_id}" } }
    expect: { status: 204 }
    returns: ack

  get_banned_users:
    summary: The users banned or timed out in the channel, up to 100, kept in state (Get Banned Users; moderation:read or moderator:manage:banned_users)
    send: { method: GET, path: /helix/moderation/banned, query: { broadcaster_id: "{settings.broadcaster_id}", first: "100" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  warn_user:
    summary: Warn a chatter, who can't chat until they acknowledge it (Warn Chat User; moderator:manage:warnings)
    params:
      user_id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
                 label: User ID,
                 description: "The numeric user ID of the chatter to warn." }
      reason: { type: string, pattern: "\\S", max_length: 500, required: true,
                label: Reason,
                description: "The warning the chatter sees, up to 500 characters." }
    send: { method: POST, path: /helix/moderation/warnings, content_type: application/json,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"data":{"user_id":{user_id:json},"reason":{reason:json}}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  delete_chat_message:
    summary: Remove one chat message, less than 6 hours old and not the broadcaster's or a moderator's (Delete Chat Messages with message_id; moderator:manage:chat_messages)
    params:
      message_id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
                    label: Message ID,
                    description: "The chat message's id, as the chat message event or IRC id tag gives it." }
    send: { method: DELETE, path: /helix/moderation/chat,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}", message_id: "{message_id}" } }
    expect: { status: 204 }
    returns: ack

  clear_chat:
    summary: Remove every message in the channel's chat (Delete Chat Messages without message_id; moderator:manage:chat_messages)
    send: { method: DELETE, path: /helix/moderation/chat,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" } }
    expect: { status: 204 }
    returns: ack

  get_shield_mode:
    summary: Whether Shield Mode is on, and when it was last turned on (Get Shield Mode Status; moderator:read:shield_mode)
    send: { method: GET, path: /helix/moderation/shield_mode,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  set_shield_mode:
    summary: Turn Shield Mode on, applying the channel's configured protections against chat abuse, or off (Update Shield Mode Status; moderator:manage:shield_mode)
    params:
      active: { type: bool, required: true,
                label: Shield Mode,
                description: "On applies the Shield Mode settings configured on Twitch; off returns chat to normal." }
    send: { method: PUT, path: /helix/moderation/shield_mode, content_type: application/json,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"is_active":{active}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_moderators:
    summary: The channel's moderators, up to 100, kept in state (Get Moderators; moderation:read or channel:manage:moderators)
    send: { method: GET, path: /helix/moderation/moderators, query: { broadcaster_id: "{settings.broadcaster_id}", first: "100" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  add_moderator:
    summary: Make a user a moderator of the channel (Add Channel Moderator; channel:manage:moderators)
    params:
      user_id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
                 label: User ID,
                 description: "The numeric user ID of the user to make a moderator." }
    send: { method: POST, path: /helix/moderation/moderators,
            query: { broadcaster_id: "{settings.broadcaster_id}", user_id: "{user_id}" } }
    expect: { status: 204 }
    returns: ack

  remove_moderator:
    summary: Take a user's moderator role away (Remove Channel Moderator; channel:manage:moderators)
    params:
      user_id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
                 label: User ID,
                 description: "The numeric user ID of the moderator to remove." }
    send: { method: DELETE, path: /helix/moderation/moderators,
            query: { broadcaster_id: "{settings.broadcaster_id}", user_id: "{user_id}" } }
    expect: { status: 204 }
    returns: ack

  get_vips:
    summary: The channel's VIPs, up to 100, kept in state (Get VIPs; channel:read:vips or channel:manage:vips)
    send: { method: GET, path: /helix/channels/vips, query: { broadcaster_id: "{settings.broadcaster_id}", first: "100" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  add_vip:
    summary: Make a user a VIP of the channel (Add Channel VIP; channel:manage:vips)
    params:
      user_id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
                 label: User ID,
                 description: "The numeric user ID of the user to make a VIP." }
    send: { method: POST, path: /helix/channels/vips,
            query: { broadcaster_id: "{settings.broadcaster_id}", user_id: "{user_id}" } }
    expect: { status: 204 }
    returns: ack

  remove_vip:
    summary: Take a user's VIP status away (Remove Channel VIP; channel:manage:vips)
    params:
      user_id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
                 label: User ID,
                 description: "The numeric user ID of the VIP to remove." }
    send: { method: DELETE, path: /helix/channels/vips,
            query: { broadcaster_id: "{settings.broadcaster_id}", user_id: "{user_id}" } }
    expect: { status: 204 }
    returns: ack

  get_blocked_terms:
    summary: The words and phrases blocked in chat, up to 100, kept in state (Get Blocked Terms; moderator:read:blocked_terms)
    send: { method: GET, path: /helix/moderation/blocked_terms,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}", first: "100" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  add_blocked_term:
    summary: Block a word or phrase in chat (Add Blocked Term; moderator:manage:blocked_terms)
    params:
      text: { type: string, pattern: "\\S", max_length: 500, required: true,
              label: Term,
              description: "The word or phrase to block, 2 to 500 characters; a * at the start or end of a word is a wildcard." }
    send: { method: POST, path: /helix/moderation/blocked_terms, content_type: application/json,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" },
            body: '{"text":{text:json}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  remove_blocked_term:
    summary: Allow a blocked word or phrase again (Remove Blocked Term; moderator:manage:blocked_terms)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
            label: Term ID,
            description: "The blocked term's id, from moderation.blocked_terms in state." }
    send: { method: DELETE, path: /helix/moderation/blocked_terms,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}", id: "{id}" } }
    expect: { status: 204 }
    returns: ack

  send_shoutout:
    summary: Give another channel a Shoutout in chat, while live with viewers; once every 2 minutes, and once an hour per channel (Send a Shoutout; moderator:manage:shoutouts)
    params:
      to_broadcaster_id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
                           label: Channel ID,
                           description: "The numeric user ID of the channel to give the Shoutout to." }
    send: { method: POST, path: /helix/chat/shoutouts,
            query: { from_broadcaster_id: "{settings.broadcaster_id}", to_broadcaster_id: "{to_broadcaster_id}",
                     moderator_id: "{settings.broadcaster_id}" } }
    expect: { status: 204 }
    returns: ack

  # ── Channel Points ───────────────────────────────────────────────────────
  get_custom_rewards:
    summary: The channel's custom Channel Points rewards, kept in state (Get Custom Reward; channel:read:redemptions)
    params:
      only_manageable: { type: bool, default: false,
                         label: Only this application's,
                         description: "On to list only the rewards this application created, the only ones it may change." }
    send: { method: GET, path: /helix/channel_points/custom_rewards,
            query: { broadcaster_id: "{settings.broadcaster_id}", only_manageable_rewards: "{only_manageable}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  create_custom_reward:
    summary: Create a custom Channel Points reward, Partners and Affiliates only, at most 50 a channel, with a Create Custom Rewards body (title, cost, prompt, is_enabled, background_color, is_user_input_required, the per-stream, per-user and cooldown limits, should_redemptions_skip_request_queue; channel:manage:redemptions)
    params:
      reward: { type: json, required: true,
                label: Reward,
                description: "A JSON object with at least title (up to 45 characters, unique) and cost (Channel Points, at least 1), and any other field Twitch documents." }
    send: { method: POST, path: /helix/channel_points/custom_rewards, content_type: application/json,
            query: { broadcaster_id: "{settings.broadcaster_id}" }, body: '{reward}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  update_custom_reward:
    summary: Change a reward this application created with an Update Custom Reward body (the create fields and is_paused; channel:manage:redemptions)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
            label: Reward ID,
            description: "The reward's id, from channel_points.rewards in state." }
      changes: { type: json, required: true,
                 label: Changes,
                 description: "A JSON object of only the fields to change, as Twitch documents them." }
    send: { method: PATCH, path: /helix/channel_points/custom_rewards, content_type: application/json,
            query: { broadcaster_id: "{settings.broadcaster_id}", id: "{id}" }, body: '{changes}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  set_reward_enabled:
    summary: Show a reward to viewers or hide it (Update Custom Reward is_enabled; channel:manage:redemptions)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
            label: Reward ID,
            description: "The reward's id, from channel_points.rewards in state." }
      enabled: { type: bool, required: true,
                 label: Enabled,
                 description: "On shows the reward to viewers; off hides it." }
    send: { method: PATCH, path: /helix/channel_points/custom_rewards, content_type: application/json,
            query: { broadcaster_id: "{settings.broadcaster_id}", id: "{id}" }, body: '{"is_enabled":{enabled}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  set_reward_paused:
    summary: Pause a reward so viewers see it but can't redeem it, or resume it (Update Custom Reward is_paused; channel:manage:redemptions)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
            label: Reward ID,
            description: "The reward's id, from channel_points.rewards in state." }
      paused: { type: bool, required: true,
                label: Paused,
                description: "On stops redemptions while the reward stays visible; off allows them again." }
    send: { method: PATCH, path: /helix/channel_points/custom_rewards, content_type: application/json,
            query: { broadcaster_id: "{settings.broadcaster_id}", id: "{id}" }, body: '{"is_paused":{paused}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  delete_custom_reward:
    summary: Delete a reward this application created; its unfulfilled redemptions are marked fulfilled (Delete Custom Reward; channel:manage:redemptions)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
            label: Reward ID,
            description: "The reward's id, from channel_points.rewards in state." }
    send: { method: DELETE, path: /helix/channel_points/custom_rewards,
            query: { broadcaster_id: "{settings.broadcaster_id}", id: "{id}" } }
    expect: { status: 204 }
    returns: ack

  get_redemptions:
    summary: Redemptions of a reward this application created, oldest first; unfulfilled ones are kept in state (Get Custom Reward Redemption; channel:read:redemptions)
    params:
      reward_id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
                   label: Reward ID,
                   description: "The reward whose redemptions to list." }
      status: { type: enum, values: [UNFULFILLED, FULFILLED, CANCELED], default: UNFULFILLED,
                label: Status,
                description: "Which redemptions to list: those waiting in the queue, or those fulfilled or canceled in the last few days." }
      first: { type: int, min: 1, max: 50, default: 50,
               label: Results,
               description: "How many redemptions to return, 1 to 50." }
    send: { method: GET, path: /helix/channel_points/custom_rewards/redemptions,
            query: { broadcaster_id: "{settings.broadcaster_id}", reward_id: "{reward_id}", status: "{status}", first: "{first}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  update_redemption_status:
    summary: Mark a waiting redemption fulfilled, or cancel it and refund the viewer's points (Update Redemption Status; channel:manage:redemptions)
    params:
      reward_id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
                   label: Reward ID,
                   description: "The reward that was redeemed." }
      id: { type: string, pattern: "^[A-Za-z0-9-]+$", max_length: 64, required: true,
            label: Redemption ID,
            description: "The redemption's id, from channel_points.redemptions in state." }
      status: { type: enum, values: [FULFILLED, CANCELED], required: true,
                label: Status,
                description: "FULFILLED completes the redemption; CANCELED refunds the viewer's Channel Points." }
    send: { method: PATCH, path: /helix/channel_points/custom_rewards/redemptions, content_type: application/json,
            query: { id: "{id}", broadcaster_id: "{settings.broadcaster_id}", reward_id: "{reward_id}" },
            body: '{"status":{status:json}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  # ── Schedule ─────────────────────────────────────────────────────────────
  get_schedule:
    summary: The next 25 broadcasts of the channel's stream schedule and its vacation, kept in state (Get Channel Stream Schedule)
    send: { method: GET, path: /helix/schedule, query: { broadcaster_id: "{settings.broadcaster_id}", first: "25" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  create_schedule_segment:
    summary: Add a one-off or weekly broadcast to the schedule with a Create Channel Stream Schedule Segment body (start_time, timezone, duration, is_recurring, category_id, title; channel:manage:schedule)
    params:
      segment: { type: json, required: true,
                 label: Broadcast,
                 description: "A JSON object with start_time (RFC 3339), timezone (IANA, such as Europe/London) and duration (minutes as a string, 30 to 1380), and optionally is_recurring, category_id and title." }
    send: { method: POST, path: /helix/schedule/segment, content_type: application/json,
            query: { broadcaster_id: "{settings.broadcaster_id}" }, body: '{segment}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  update_schedule_segment:
    summary: Change a scheduled broadcast with an Update Channel Stream Schedule Segment body (start_time, duration, category_id, title, is_canceled, timezone); for a weekly one, every week changes (channel:manage:schedule)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9+/=_-]+$", max_length: 512, required: true,
            label: Broadcast ID,
            description: "The scheduled broadcast's id, from schedule.segments in state." }
      changes: { type: json, required: true,
                 label: Changes,
                 description: "A JSON object of only the fields to change, as Twitch documents them." }
    send: { method: PATCH, path: /helix/schedule/segment, content_type: application/json,
            query: { broadcaster_id: "{settings.broadcaster_id}", id: "{id}" }, body: '{changes}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  cancel_schedule_segment:
    summary: Cancel a scheduled broadcast, or restore it; for a weekly one Twitch cancels the next occurrence (Update Channel Stream Schedule Segment is_canceled; channel:manage:schedule)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9+/=_-]+$", max_length: 512, required: true,
            label: Broadcast ID,
            description: "The scheduled broadcast's id, from schedule.segments in state." }
      canceled: { type: bool, default: true,
                  label: Canceled,
                  description: "On cancels the broadcast; off restores it." }
    send: { method: PATCH, path: /helix/schedule/segment, content_type: application/json,
            query: { broadcaster_id: "{settings.broadcaster_id}", id: "{id}" }, body: '{"is_canceled":{canceled}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  delete_schedule_segment:
    summary: Remove a broadcast from the schedule; for a weekly one, every week is removed (Delete Channel Stream Schedule Segment; channel:manage:schedule)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9+/=_-]+$", max_length: 512, required: true,
            label: Broadcast ID,
            description: "The scheduled broadcast's id, from schedule.segments in state." }
    send: { method: DELETE, path: /helix/schedule/segment, query: { broadcaster_id: "{settings.broadcaster_id}", id: "{id}" } }
    expect: { status: 204 }
    returns: ack

  set_vacation:
    summary: Schedule a vacation, during which the schedule shows no broadcasts (Update Channel Stream Schedule; channel:manage:schedule)
    params:
      start_time: { type: string, pattern: "^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d(\\.\\d+)?Z$", required: true,
                    label: Starts,
                    description: "When the vacation starts, RFC 3339 UTC, such as 2026-12-20T00:00:00Z." }
      end_time: { type: string, pattern: "^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d(\\.\\d+)?Z$", required: true,
                  label: Ends,
                  description: "When the vacation ends, RFC 3339 UTC, later than the start." }
      timezone: { type: string, pattern: "^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$", max_length: 64, required: true,
                  label: Time zone,
                  description: "The IANA time zone the channel broadcasts from, such as America/New_York." }
    send: { method: PATCH, path: /helix/schedule/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", is_vacation_enabled: "true",
                     vacation_start_time: "{start_time}", vacation_end_time: "{end_time}", timezone: "{timezone}" } }
    expect: { status: 204 }
    returns: ack

  end_vacation:
    summary: Cancel the scheduled vacation (Update Channel Stream Schedule is_vacation_enabled false; channel:manage:schedule)
    send: { method: PATCH, path: /helix/schedule/settings,
            query: { broadcaster_id: "{settings.broadcaster_id}", is_vacation_enabled: "false" } }
    expect: { status: 204 }
    returns: ack

  # ── Clips and videos ─────────────────────────────────────────────────────
  get_clips:
    summary: The channel's clips, most viewed first (Get Clips by broadcaster_id)
    params:
      first: { type: int, min: 1, max: 100, default: 20,
               label: Results,
               description: "How many clips to return, 1 to 100." }
    send: { method: GET, path: /helix/clips, query: { broadcaster_id: "{settings.broadcaster_id}", first: "{first}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_clips_between:
    summary: The channel's clips made between two times, most viewed first (Get Clips with started_at and ended_at)
    params:
      started_at: { type: string, pattern: "^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d(\\.\\d+)?Z$", required: true,
                    label: From,
                    description: "The earliest clip time, RFC 3339 UTC." }
      ended_at: { type: string, pattern: "^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d(\\.\\d+)?Z$", required: true,
                  label: To,
                  description: "The latest clip time, RFC 3339 UTC." }
      first: { type: int, min: 1, max: 100, default: 20,
               label: Results,
               description: "How many clips to return, 1 to 100." }
    send: { method: GET, path: /helix/clips,
            query: { broadcaster_id: "{settings.broadcaster_id}", started_at: "{started_at}", ended_at: "{ended_at}", first: "{first}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_clip:
    summary: One clip by its id, such as the one create_clip made, with its URL once Twitch has made it (Get Clips by id)
    params:
      id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 128, required: true,
            label: Clip ID,
            description: "The clip's id, as create_clip returns it." }
    send: { method: GET, path: /helix/clips, query: { id: "{id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_videos:
    summary: The channel's videos (past broadcasts, highlights, uploads), newest first (Get Videos by user_id)
    params:
      type: { type: enum, values: [all, archive, highlight, upload], default: all,
              label: Type,
              description: "Which videos: all, archive (past broadcasts, the VODs), highlight or upload." }
      first: { type: int, min: 1, max: 100, default: 20,
               label: Results,
               description: "How many videos to return, 1 to 100." }
    send: { method: GET, path: /helix/videos,
            query: { user_id: "{settings.broadcaster_id}", type: "{type}", sort: time, first: "{first}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_video:
    summary: One video by its id (Get Videos by id)
    params:
      id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
            label: Video ID,
            description: "The video's numeric id, from get_videos." }
    send: { method: GET, path: /helix/videos, query: { id: "{id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  delete_video:
    summary: Delete one of the channel's videos for good (Delete Videos; channel:manage:videos)
    params:
      id: { type: string, pattern: "^[0-9]+$", max_length: 32, required: true,
            label: Video ID,
            description: "The video's numeric id, from get_videos." }
    send: { method: DELETE, path: /helix/videos, query: { id: "{id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

quirks:
  - models: [all]
    severity: info
    text: >
      A cloud service. Open the integration with host api.twitch.tv and port
      443; it is reached over HTTPS and the certificate is checked against
      that name. It acts for the channel named by broadcaster_id, which must
      be the signed-in user's own: Twitch refuses channel, stream-key, ad,
      raid and chat-setting changes for another channel.

  - models: [all]
    severity: warning
    text: >
      The consumer owns the credential. It registers its own Twitch
      application, runs the sign-in itself (the Device Code Grant for a
      public client, which has no secret, or the authorization code grant
      for a confidential one), asks for the scopes of the commands it uses,
      and passes client_id, client_secret (empty for a public client),
      refresh_token, access_token and expires_at as settings. Every request
      carries the access token as Bearer and the client ID as Client-Id;
      Twitch refuses a token issued to another client. The access token
      (about 4 hours) is refreshed at id.twitch.tv 5 minutes before it
      expires, or at once when there is none; a public client refreshes
      with client_id alone. A 401 refreshes the token and sends the request
      once more; a second 401, or a refresh Twitch refuses (400 "Invalid
      refresh token", or 401), is terminal: the integration reports
      unauthorized, commands fail with auth, and nothing more is sent until
      the consumer signs the user in again and passes the new tokens with
      update_settings. A token endpoint that cannot be reached is retried
      with backoff. A 403 (a missing role, a stream key the account may not
      have yet) is an ordinary command failure.

  - models: [all]
    severity: critical
    text: >
      A public client's refresh token is single use and rotates on every
      refresh: the answer carries a new refresh token and the old one stops
      working. The core reports each new refresh token in a credentials
      event, and the consumer must persist it at once, before anything else
      can fail; if it keeps the old one, the next open refreshes with a dead
      token and the user must sign in again. For the same reason, one sign-in
      must feed one open integration only: two integrations (or two
      products) refreshing with the same refresh token invalidate each
      other, and the second refresh fails as unauthorized. A public client's
      refresh token also expires 30 days after it was issued (Twitch's
      documents also say after 30 days unused), so an integration not opened
      for a month needs a new sign-in. A confidential client's refresh token
      does not expire. Both end when the user changes their password or
      disconnects the application.

  - models: [all]
    severity: warning
    text: >
      Twitch requires an application that keeps a user's session to
      validate the token at https://id.twitch.tv/oauth2/validate when it
      starts and every hour after, and may revoke or throttle applications
      that don't. The core does it for the consumer, which never calls that
      endpoint itself: once the integration opens (after the first refresh
      when there is no access token yet), after every refresh, and every
      hour while it is open, monitored or not, with the header
      "Authorization: OAuth <token>" and nothing else. Only the status is
      read; the answer (client, login, user id, scopes) is neither kept in
      state nor logged. A 401 there means the token was revoked or the user
      disconnected the application: with a refresh token, the core refreshes
      once and validates the new token, and a second 401, or a refresh
      Twitch refuses, is the terminal unauthorized; without a refresh token
      the first 401 is terminal. A network failure or any other status is
      logged and tried again with backoff (1 s doubling to 60 s), and does
      not change the connection.

  - models: [all]
    severity: info
    text: >
      Rate limits are a bucket per client ID and user, normally 1 point per
      request, with the remaining points in each answer's Ratelimit headers;
      an empty bucket answers 429 until Ratelimit-Reset. State is polled
      every 30 seconds with four requests (the channel, the stream, the chat
      settings and the follower count), plus Get Users when idle for 10
      seconds: well within the bucket. Raids are limited to 10 requests per
      10 minutes, announcements to one per 2 seconds, and commercials,
      snoozes and raids answer 429 for their own cooldowns too.

  - models: [all]
    severity: info
    text: >
      Twitch publishes no ingest-health API: the encoder's bitrate, frame
      rate and dropped frames as Twitch receives them are not available, and
      stream health is not reported. stream.live says only that the channel
      is live. Twitch pushes changes through EventSub: the core keeps its
      websocket open (wss://eventsub.wss.twitch.tv/ws, keepalives every 30
      seconds, reopened after 45 silent ones), and on each welcome subscribes
      that session to stream.online, stream.offline, channel.update and
      channel.follow for the broadcaster, and to the poll, prediction,
      Shield Mode, redemption, moderator and VIP events, within the 10
      seconds Twitch allows (19 requests).
      Going live or offline and title, category and language changes then
      show at once; a new follower has the follower count read again. Twitch
      drops a session's subscriptions when its websocket closes; a reopened
      websocket is a new session and subscribes again. A session_reconnect
      message is not followed: the core reconnects when Twitch closes the old
      websocket 30 seconds later, and subscribes again, so a few events can be
      missed then. Each subscription costs nothing for the broadcaster's own
      token; channel.follow needs the moderator:read:followers scope and is
      refused without it, which leaves the follower count to the poll.
      Everything is also polled every 30 seconds (viewer_count, chat
      settings and tags have no event here). viewer_count is Twitch's own
      figure and lags. Content classification labels and tags are kept as
      JSON text.

  - models: [all]
    severity: warning
    text: >
      get_stream_key returns the channel's stream key, a secret anyone could
      stream to the channel with: it is returned as the command's value only,
      never kept in state or logged. Show it to the operator only on demand.

  - models: [all]
    severity: critical
    text: >
      start_commercial runs an ad at once for every viewer and can't be
      stopped; Twitch then refuses another until its cooldown ends
      (retry_after). It needs a live Partner or Affiliate channel and the
      broadcaster's own token. start_raid sends the channel's viewers to the
      target channel when the broadcaster confirms on Twitch or after 90
      seconds, which can't be undone; cancel_raid stops it only until then. create_clip clips the last seconds of the live stream and is
      made in the background: the reply gives its id and edit URL only.

  - models: [all]
    severity: info
    text: >
      Chat settings are changed as the signed-in user acting as moderator of
      their own channel (moderator_id is the broadcaster). A mode's duration
      is accepted only with the mode on, so each mode with a duration has an
      on and an off command. The non-moderator chat delay is returned only
      to a moderator's token with moderator:read:chat_settings, and is kept
      in state only when Twitch returns it. Update Chat Settings answers
      with the new settings, which update state at once.

  - models: [all]
    severity: critical
    text: >
      Twitch answers a token that lacks a command's scope with 401, as it
      answers a revoked token, and the core takes every 401 as a refused
      token: it refreshes once and, when the new token is refused too,
      reports unauthorized and sends nothing more until new tokens arrive.
      A consumer must therefore ask at sign-in for the scope of every
      command it offers (each command's summary names it), and never offer a
      command whose scope the user did not grant. The polls, predictions,
      Shield Mode, rewards, moderators, VIPs, bans and blocked terms are
      for that reason never polled: they need scopes a consumer may not ask
      for. EventSub subscriptions are different: one whose scope is missing
      is answered 403 and only logged.

  - models: [all]
    severity: info
    text: >
      The running or most recent poll and prediction are kept in state
      (poll.*, prediction.*). They are filled from the replies of
      create_poll, end_poll, get_polls and the prediction commands, and kept
      current by EventSub when the token has channel:read:polls and
      channel:read:predictions (or the manage scopes): a poll's begin,
      progress and end, a prediction's begin, progress, lock and end. Votes
      and Channel Points per choice and outcome follow the progress events.
      Twitch runs one poll and one prediction at a time; a new one replaces
      the old in state. Without those scopes, a poll or prediction started
      elsewhere (on Twitch itself) shows only after get_polls or
      get_predictions. EventSub's poll events give ends_at, which Helix
      replies do not; Helix replies give duration instead.

  - models: [all]
    severity: critical
    text: >
      resolve_prediction pays out the Channel Points to the viewers who
      chose the winning outcome, and cancel_prediction refunds everyone;
      neither can be undone. Twitch cancels a prediction left unresolved 24
      hours after it locks. clear_chat removes every message in chat for
      everyone, and delete_video deletes a video (a VOD, highlight or upload)
      for good. ban_user lasts until unban_user, while a timeout ends by
      itself; a banned user cannot be timed out instead without an unban.

  - models: [all]
    severity: warning
    text: >
      Custom Channel Points rewards are for Partners and Affiliates. Only
      the application (client id) that created a reward may change or
      delete it, or read and update its redemptions: rewards made on Twitch
      itself, or by another application, are listed by get_custom_rewards
      but are refused with 403 by every change. A channel has at most 50
      rewards. channel_points.redemptions holds the redemptions waiting in
      the queue (unfulfilled): EventSub adds each new one (for every reward,
      with channel:read:redemptions) and removes it when it is fulfilled or
      canceled, and update_redemption_status and get_redemptions keep it
      current for this application's rewards. A reward set to skip the
      queue is fulfilled at once and never listed.

  - models: [all]
    severity: info
    text: >
      Moderators, VIPs, banned users and blocked terms are kept in state
      once read (get_moderators, get_vips, get_banned_users,
      get_blocked_terms), up to the first 100 of each: a longer list shows
      its first page only. Each change the integration makes reads its list
      again, and EventSub's moderator and VIP events (moderation:read,
      channel:read:vips) read those lists again after a change made
      elsewhere. Bans and blocked terms changed elsewhere show at the next
      read. Twitch limits adding and removing moderators and VIPs to 10
      each in 10 seconds.

  - models: [all]
    severity: info
    text: >
      Shield Mode (moderation.shield_mode) is read by get_shield_mode,
      changed by set_shield_mode, whose reply updates state, and kept
      current by EventSub's shield mode begin and end events with
      moderator:read:shield_mode. Which protections Shield Mode applies is
      configured on Twitch only: the API can only turn it on and off.

  - models: [all]
    severity: info
    text: >
      The stream schedule's next 25 broadcasts and its vacation are polled
      every 30 seconds with the others (Get Channel Stream Schedule needs no
      scope) and read again after each change the integration makes. A
      channel with no schedule answers that poll with 404, which is logged.
      For a weekly broadcast, changing its title, category, duration or time
      zone, or deleting it, applies to every week; canceling cancels the
      next occurrence only. Only Partners and Affiliates may add one-off
      broadcasts or move one's start time. Twitch's segment ids are opaque
      base64 text. A vacation is set and cleared as a whole.

  - models: [all]
    severity: info
    text: >
      Clips and videos are read on demand (get_clips, get_clips_between,
      get_clip, get_videos, get_video) and not kept in state. Get Clips
      without a time range returns the most viewed clips of all time, and
      paging over clips stops at about 1,000. A clip made with create_clip
      takes a few seconds to appear in get_clip. The API cannot edit a
      video's title or description, or download one.

state:
  user.login:                  { type: string, description: "The signed-in user's login name (Get Users)" }
  user.display_name:           { type: string, description: "The signed-in user's display name (Get Users)" }
  user.broadcaster_type:       { type: string, description: "partner, affiliate, or empty for neither (Get Users broadcaster_type)" }
  channel.title:               { type: string, description: "The channel's stream title (Get Channel Information title)" }
  channel.category_id:         { type: string, description: "The category's id, empty when none is set (game_id)" }
  channel.category_name:       { type: string, description: "The category's name, such as Just Chatting (game_name)" }
  channel.language:            { type: string, description: "ISO 639-1 language code, or other (broadcaster_language)" }
  channel.tags:                { type: string, description: "The channel's tags as a JSON array (tags)" }
  channel.content_labels:      { type: string, description: "The content classification labels set, as a JSON array (content_classification_labels)" }
  channel.branded_content:     { type: bool, description: "The stream is marked as branded content (is_branded_content)" }
  channel.delay:               { type: int, unit: s, description: "Stream delay in seconds, Partners only (delay)" }
  channel.followers:           { type: int, description: "How many users follow the channel (Get Channel Followers total)" }
  stream.live:                 { type: bool, description: "The channel is live now (Get Streams returns it, type live)" }
  stream.id:                   { type: string, description: "The live stream's id, empty while offline" }
  stream.viewer_count:         { type: int, description: "People watching now, 0 while offline (viewer_count)" }
  stream.started_at:           { type: string, description: "When the stream went live, RFC 3339 UTC, empty while offline (started_at)" }
  stream.title:                { type: string, description: "The live stream's title (Get Streams title)" }
  stream.category_name:        { type: string, description: "The live stream's category name (Get Streams game_name)" }
  chat.slow_mode:              { type: bool, description: "Chatters wait between messages (slow_mode)" }
  chat.slow_mode_wait_time:    { type: int, unit: s, description: "Seconds between a chatter's messages in slow mode (slow_mode_wait_time)" }
  chat.follower_mode:          { type: bool, description: "Only followers may chat (follower_mode)" }
  chat.follower_mode_duration: { type: int, unit: min, description: "Minutes a user must have followed to chat (follower_mode_duration)" }
  chat.subscriber_mode:        { type: bool, description: "Only subscribers and moderators may chat (subscriber_mode)" }
  chat.emote_mode:             { type: bool, description: "Only emotes are allowed (emote_mode)" }
  chat.unique_chat_mode:       { type: bool, description: "A message repeating one already sent is refused (unique_chat_mode)" }
  chat.non_moderator_chat_delay: { type: bool, description: "Non-moderators' messages are held back (non_moderator_chat_delay; returned to moderators only)" }
  chat.non_moderator_chat_delay_duration: { type: int, unit: s, description: "Seconds non-moderators' messages are held (non_moderator_chat_delay_duration)" }
  poll.id:                     { type: string, description: "The running or most recent poll's id" }
  poll.title:                  { type: string, description: "The poll's question" }
  poll.status:                 { type: string, description: "ACTIVE, COMPLETED, TERMINATED, ARCHIVED, MODERATED or INVALID" }
  poll.duration:               { type: int, unit: s, description: "How long the poll runs (Helix replies only)" }
  poll.started_at:             { type: string, description: "When the poll began, RFC 3339 UTC" }
  poll.ends_at:                { type: string, description: "When the poll is due to end, RFC 3339 UTC (EventSub only)" }
  poll.ended_at:               { type: string, description: "When the poll ended, RFC 3339 UTC; absent while it runs" }
  poll.channel_points_voting:  { type: bool, description: "Viewers may buy extra votes with Channel Points" }
  poll.channel_points_per_vote: { type: int, description: "Channel Points per extra vote" }
  poll.choices.*.id:           { type: string, description: "The choice's id; choices are numbered from 0 in the poll's order" }
  poll.choices.*.title:        { type: string, description: "The choice's text" }
  poll.choices.*.votes:        { type: int, description: "Votes for the choice, Channel Points votes included" }
  poll.choices.*.channel_points_votes: { type: int, description: "Votes for the choice bought with Channel Points" }
  prediction.id:               { type: string, description: "The running or most recent prediction's id" }
  prediction.title:            { type: string, description: "The prediction's question" }
  prediction.status:           { type: string, description: "ACTIVE, LOCKED, RESOLVED or CANCELED" }
  prediction.winning_outcome_id: { type: string, description: "The winning outcome's id once RESOLVED" }
  prediction.prediction_window: { type: int, unit: s, description: "Seconds viewers may predict (Helix replies only)" }
  prediction.created_at:       { type: string, description: "When the prediction began, RFC 3339 UTC" }
  prediction.locks_at:         { type: string, description: "When predicting is due to close, RFC 3339 UTC (EventSub only)" }
  prediction.locked_at:        { type: string, description: "When predicting closed, RFC 3339 UTC" }
  prediction.ended_at:         { type: string, description: "When the prediction was resolved or canceled, RFC 3339 UTC" }
  prediction.outcomes.*.id:    { type: string, description: "The outcome's id; outcomes are numbered from 0 in the prediction's order" }
  prediction.outcomes.*.title: { type: string, description: "The outcome's text" }
  prediction.outcomes.*.color: { type: string, description: "BLUE or PINK, as Twitch shows the outcome" }
  prediction.outcomes.*.users: { type: int, description: "Viewers who chose the outcome" }
  prediction.outcomes.*.channel_points: { type: int, description: "Channel Points spent on the outcome" }
  moderation.shield_mode:      { type: bool, description: "Shield Mode is on (is_active)" }
  moderation.shield_mode_last_activated_at: { type: string, description: "When Shield Mode was last turned on, RFC 3339 UTC" }
  moderation.moderators.*.login: { type: string, description: "A moderator's login name, keyed by user id" }
  moderation.moderators.*.name: { type: string, description: "A moderator's display name" }
  moderation.vips.*.login:     { type: string, description: "A VIP's login name, keyed by user id" }
  moderation.vips.*.name:      { type: string, description: "A VIP's display name" }
  moderation.banned.*.login:   { type: string, description: "A banned or timed-out user's login name, keyed by user id" }
  moderation.banned.*.name:    { type: string, description: "The user's display name" }
  moderation.banned.*.expires_at: { type: string, description: "When a timeout ends, RFC 3339 UTC; empty for a ban" }
  moderation.banned.*.reason:  { type: string, description: "The reason given" }
  moderation.banned.*.moderator_name: { type: string, description: "The moderator who banned the user" }
  moderation.blocked_terms.*.text: { type: string, description: "A blocked word or phrase, keyed by its id" }
  moderation.blocked_terms.*.expires_at: { type: string, description: "When the block lapses, RFC 3339 UTC; empty for never" }
  channel_points.rewards.*.title: { type: string, description: "A custom reward's title, keyed by reward id" }
  channel_points.rewards.*.cost: { type: int, description: "The reward's cost in Channel Points" }
  channel_points.rewards.*.prompt: { type: string, description: "The prompt shown when redeeming" }
  channel_points.rewards.*.enabled: { type: bool, description: "Viewers see the reward (is_enabled)" }
  channel_points.rewards.*.paused: { type: bool, description: "Redemptions are paused (is_paused)" }
  channel_points.rewards.*.in_stock: { type: bool, description: "The reward can be redeemed now: not over a limit nor cooling down (is_in_stock)" }
  channel_points.rewards.*.background_color: { type: string, description: "The reward's colour, #RRGGBB" }
  channel_points.rewards.*.user_input_required: { type: bool, description: "The viewer must type text to redeem" }
  channel_points.rewards.*.skip_queue: { type: bool, description: "Redemptions are fulfilled at once (should_redemptions_skip_request_queue)" }
  channel_points.rewards.*.max_per_stream_enabled: { type: bool, description: "Redemptions per stream are limited" }
  channel_points.rewards.*.max_per_stream: { type: int, description: "Redemptions allowed per stream" }
  channel_points.rewards.*.max_per_user_per_stream_enabled: { type: bool, description: "Redemptions per viewer per stream are limited" }
  channel_points.rewards.*.max_per_user_per_stream: { type: int, description: "Redemptions allowed per viewer per stream" }
  channel_points.rewards.*.global_cooldown_enabled: { type: bool, description: "A cooldown follows each redemption" }
  channel_points.rewards.*.global_cooldown_seconds: { type: int, unit: s, description: "The cooldown after each redemption" }
  channel_points.rewards.*.redemptions_this_stream: { type: int, description: "Redemptions in the current stream, when live (redemptions_redeemed_current_stream)" }
  channel_points.rewards.*.cooldown_expires_at: { type: string, description: "When the cooldown ends, RFC 3339 UTC, while cooling down" }
  channel_points.redemptions.*.reward_id: { type: string, description: "The reward redeemed, for a redemption waiting in the queue, keyed by redemption id" }
  channel_points.redemptions.*.reward_title: { type: string, description: "The reward's title" }
  channel_points.redemptions.*.user_id: { type: string, description: "The viewer's user id" }
  channel_points.redemptions.*.user_name: { type: string, description: "The viewer's display name" }
  channel_points.redemptions.*.user_input: { type: string, description: "The text the viewer typed, when the reward asks for it" }
  channel_points.redemptions.*.redeemed_at: { type: string, description: "When it was redeemed, RFC 3339 UTC" }
  schedule.vacation:           { type: bool, description: "A vacation is scheduled" }
  schedule.vacation_start_time: { type: string, description: "When the vacation starts, RFC 3339 UTC; empty when none" }
  schedule.vacation_end_time:  { type: string, description: "When the vacation ends, RFC 3339 UTC; empty when none" }
  schedule.segments.*.start_time: { type: string, description: "When a scheduled broadcast starts, RFC 3339 UTC, keyed by segment id" }
  schedule.segments.*.end_time: { type: string, description: "When it ends, RFC 3339 UTC" }
  schedule.segments.*.title:   { type: string, description: "The broadcast's title" }
  schedule.segments.*.category_id: { type: string, description: "The broadcast's category id" }
  schedule.segments.*.category_name: { type: string, description: "The broadcast's category name" }
  schedule.segments.*.recurring: { type: bool, description: "The broadcast repeats weekly (is_recurring)" }
  schedule.segments.*.canceled_until: { type: string, description: "Set to the end time when this occurrence is canceled" }

telemetry:
  # EventSub over WebSocket (Handling WebSocket Events): Twitch sends a
  # welcome with the session id, then keepalives every 30 seconds.
  websocket:
    url: "wss://eventsub.wss.twitch.tv/ws?keepalive_timeout_seconds=30"
    idle_ms: 45000
  # Also polled every 30 seconds (4 points): what EventSub does not carry
  # (viewers, chat settings, tags), and a safety net for the rest.
  poll:
    every_ms: 30000
    send:
      - { method: GET, path: /helix/channels, query: { broadcaster_id: "{settings.broadcaster_id}" } }
      - { method: GET, path: /helix/streams, query: { user_id: "{settings.broadcaster_id}", type: all } }
      - { method: GET, path: /helix/chat/settings,
          query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}" } }
      - { method: GET, path: /helix/channels/followers, query: { broadcaster_id: "{settings.broadcaster_id}", first: "1" } }
      - { method: GET, path: /helix/schedule, query: { broadcaster_id: "{settings.broadcaster_id}", first: "25" } }
  updates:
    # The probe and get_user: the signed-in user.
    - path: '^/helix/users$'
      json_each: "$.data"
      json: { login: "$.login", name: "$.display_name", type: "$.broadcaster_type" }
      state:
        user.login: "{login}"
        user.display_name: "{name}"
        user.broadcaster_type: "{type}"
    - path: '^/helix/channels\?broadcaster_id='
      json_each: "$.data"
      json:
        title: "$.title"
        game_id: "$.game_id"
        game: "$.game_name"
        language: "$.broadcaster_language"
        tags: "$.tags"
        labels: "$.content_classification_labels"
        branded: "$.is_branded_content"
        delay: "$.delay"
      state:
        channel.title: "{title}"
        channel.category_id: "{game_id}"
        channel.category_name: "{game}"
        channel.language: "{language}"
        channel.tags: "{tags}"
        channel.content_labels: "{labels}"
        channel.branded_content: "{branded}"
        channel.delay: "{delay}"
    - path: '^/helix/channels/followers\?'
      json: { total: "$.total" }
      state: { channel.followers: "{total}" }
    # Live: Get Streams returns the stream.
    - path: '^/helix/streams\?user_id='
      json_each: "$.data"
      json: { id: "$.id", type: "$.type", viewers: "$.viewer_count", started: "$.started_at",
              title: "$.title", game: "$.game_name" }
      state:
        stream.live: { value: "{type}", map: { "live": true, "": false } }
        stream.id: "{id}"
        stream.viewer_count: "{viewers}"
        stream.started_at: "{started}"
        stream.title: "{title}"
        stream.category_name: "{game}"
    # Offline: Get Streams returns no stream at all.
    - path: '^/helix/streams\?user_id='
      json_match: { "$.data": '^\[\]$' }
      json: {}
      state:
        stream.live: "false"
        stream.id: ""
        stream.viewer_count: "0"
        stream.started_at: ""
    # Polls, get_chat_settings and every chat-settings change.
    - path: '^/helix/chat/settings\?'
      json_each: "$.data"
      json:
        slow: "$.slow_mode"
        slow_wait: "$.slow_mode_wait_time"
        follower: "$.follower_mode"
        follower_for: "$.follower_mode_duration"
        subscriber: "$.subscriber_mode"
        emote: "$.emote_mode"
        unique: "$.unique_chat_mode"
        delay: "$.non_moderator_chat_delay"
        delay_for: "$.non_moderator_chat_delay_duration"
      state:
        chat.slow_mode: "{slow}"
        chat.slow_mode_wait_time: "{slow_wait}"
        chat.follower_mode: "{follower}"
        chat.follower_mode_duration: "{follower_for}"
        chat.subscriber_mode: "{subscriber}"
        chat.emote_mode: "{emote}"
        chat.unique_chat_mode: "{unique}"
        chat.non_moderator_chat_delay: "{delay}"
        chat.non_moderator_chat_delay_duration: "{delay_for}"

    # EventSub: the welcome names the session; subscriptions made with it
    # within 10 seconds (Create EventSub Subscription, transport websocket).
    - json_match: { "$.metadata.message_type": "^session_welcome$", "$.payload.session.id": "^(.+)$" }
      json: {}
      then_send:
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"stream.online","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"stream.offline","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.update","version":"2","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.follow","version":"2","condition":{"broadcaster_user_id":"{settings.broadcaster_id}","moderator_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        # Each of these needs its own scope; without it Twitch answers 403,
        # which is logged and leaves that state to the commands' replies.
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.poll.begin","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.poll.progress","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.poll.end","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.prediction.begin","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.prediction.progress","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.prediction.lock","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.prediction.end","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.shield_mode.begin","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}","moderator_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.shield_mode.end","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}","moderator_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.channel_points_custom_reward_redemption.add","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.channel_points_custom_reward_redemption.update","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.moderator.add","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.moderator.remove","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.vip.add","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
        - { method: POST, path: /helix/eventsub/subscriptions, content_type: application/json,
            body: '{"type":"channel.vip.remove","version":"1","condition":{"broadcaster_user_id":"{settings.broadcaster_id}"},"transport":{"method":"websocket","session_id":{1:json}}}' }
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^stream\\.online$" }
      json: { id: "$.payload.event.id", started: "$.payload.event.started_at", type: "$.payload.event.type" }
      state:
        stream.live: { value: "{type}", map: { "live": true } }
        stream.id: "{id}"
        stream.started_at: "{started}"
      # The title, category and viewers come with Get Streams.
      then_send:
        - { method: GET, path: /helix/streams, query: { user_id: "{settings.broadcaster_id}", type: all } }
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^stream\\.offline$" }
      json: {}
      state:
        stream.live: "false"
        stream.id: ""
        stream.viewer_count: "0"
        stream.started_at: ""
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.update$" }
      json:
        title: "$.payload.event.title"
        language: "$.payload.event.language"
        category_id: "$.payload.event.category_id"
        category: "$.payload.event.category_name"
        labels: "$.payload.event.content_classification_labels"
      state:
        channel.title: "{title}"
        channel.language: "{language}"
        channel.category_id: "{category_id}"
        channel.category_name: "{category}"
        channel.content_labels: "{labels}"
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.follow$" }
      json: {}
      then_send:
        - { method: GET, path: /helix/channels/followers, query: { broadcaster_id: "{settings.broadcaster_id}", first: "1" } }

    # ── Polls: Helix replies (create, end, get; the newest first) ──────────
    - path: '^/helix/polls(\?.*)?$'
      json_match: { "$.data[0].id": "^." }
      json:
        id: "$.data[0].id"
        title: "$.data[0].title"
        status: "$.data[0].status"
        duration: "$.data[0].duration"
        started: "$.data[0].started_at"
        ended: "$.data[0].ended_at"
        cp: "$.data[0].channel_points_voting_enabled"
        cp_per: "$.data[0].channel_points_per_vote"
      replace: poll
      state:
        poll.id: "{id}"
        poll.title: "{title}"
        poll.status: "{status}"
        poll.duration: "{duration}"
        poll.started_at: "{started}"
        poll.ended_at: "{ended}"
        poll.channel_points_voting: "{cp}"
        poll.channel_points_per_vote: "{cp_per}"
    - path: '^/helix/polls(\?.*)?$'
      json_each: "$.data[0].choices"
      json: { id: "$.id", title: "$.title", votes: "$.votes", cp: "$.channel_points_votes" }
      state:
        poll.choices.{index}.id: "{id}"
        poll.choices.{index}.title: "{title}"
        poll.choices.{index}.votes: "{votes}"
        poll.choices.{index}.channel_points_votes: "{cp}"
    # EventSub: a poll begins (a new poll replaces the last), progresses, ends.
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.poll\\.begin$" }
      json:
        id: "$.payload.event.id"
        title: "$.payload.event.title"
        started: "$.payload.event.started_at"
        ends: "$.payload.event.ends_at"
        cp: "$.payload.event.channel_points_voting.is_enabled"
        cp_per: "$.payload.event.channel_points_voting.amount_per_vote"
      replace: poll
      state:
        poll.id: "{id}"
        poll.title: "{title}"
        poll.status: "ACTIVE"
        poll.started_at: "{started}"
        poll.ends_at: "{ends}"
        poll.channel_points_voting: "{cp}"
        poll.channel_points_per_vote: "{cp_per}"
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.poll\\.(begin|progress|end)$" }
      json_each: "$.payload.event.choices"
      json: { id: "$.id", title: "$.title", votes: "$.votes", cp: "$.channel_points_votes" }
      state:
        poll.choices.{index}.id: "{id}"
        poll.choices.{index}.title: "{title}"
        poll.choices.{index}.votes: "{votes}"
        poll.choices.{index}.channel_points_votes: "{cp}"
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.poll\\.end$" }
      json: { status: "$.payload.event.status", ended: "$.payload.event.ended_at" }
      state:
        poll.status: { value: "{status}", map: { completed: COMPLETED, terminated: TERMINATED, archived: ARCHIVED } }
        poll.ended_at: "{ended}"

    # ── Predictions: Helix replies, then EventSub ───────────────────────────
    - path: '^/helix/predictions(\?.*)?$'
      json_match: { "$.data[0].id": "^." }
      json:
        id: "$.data[0].id"
        title: "$.data[0].title"
        status: "$.data[0].status"
        winner: "$.data[0].winning_outcome_id"
        window: "$.data[0].prediction_window"
        created: "$.data[0].created_at"
        locked: "$.data[0].locked_at"
        ended: "$.data[0].ended_at"
      replace: prediction
      state:
        prediction.id: "{id}"
        prediction.title: "{title}"
        prediction.status: "{status}"
        prediction.winning_outcome_id: "{winner}"
        prediction.prediction_window: "{window}"
        prediction.created_at: "{created}"
        prediction.locked_at: "{locked}"
        prediction.ended_at: "{ended}"
    - path: '^/helix/predictions(\?.*)?$'
      json_each: "$.data[0].outcomes"
      json: { id: "$.id", title: "$.title", color: "$.color", users: "$.users", points: "$.channel_points" }
      state:
        prediction.outcomes.{index}.id: "{id}"
        prediction.outcomes.{index}.title: "{title}"
        prediction.outcomes.{index}.color: "{color}"
        prediction.outcomes.{index}.users: "{users}"
        prediction.outcomes.{index}.channel_points: "{points}"
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.prediction\\.begin$" }
      json: { id: "$.payload.event.id", title: "$.payload.event.title", started: "$.payload.event.started_at",
              locks: "$.payload.event.locks_at" }
      replace: prediction
      state:
        prediction.id: "{id}"
        prediction.title: "{title}"
        prediction.status: "ACTIVE"
        prediction.created_at: "{started}"
        prediction.locks_at: "{locks}"
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.prediction\\.(begin|progress|lock|end)$" }
      json_each: "$.payload.event.outcomes"
      json: { id: "$.id", title: "$.title", color: "$.color", users: "$.users", points: "$.channel_points" }
      state:
        prediction.outcomes.{index}.id: "{id}"
        prediction.outcomes.{index}.title: "{title}"
        prediction.outcomes.{index}.color: { value: "{color}", map: { blue: BLUE, pink: PINK } }
        prediction.outcomes.{index}.users: "{users}"
        prediction.outcomes.{index}.channel_points: "{points}"
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.prediction\\.lock$" }
      json: { locked: "$.payload.event.locked_at" }
      state:
        prediction.status: "LOCKED"
        prediction.locked_at: "{locked}"
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.prediction\\.end$" }
      json: { status: "$.payload.event.status", winner: "$.payload.event.winning_outcome_id", ended: "$.payload.event.ended_at" }
      state:
        prediction.status: { value: "{status}", map: { resolved: RESOLVED, canceled: CANCELED } }
        prediction.winning_outcome_id: "{winner}"
        prediction.ended_at: "{ended}"

    # ── Shield Mode ─────────────────────────────────────────────────────────
    - path: '^/helix/moderation/shield_mode\?'
      json_each: "$.data"
      json: { active: "$.is_active", last: "$.last_activated_at" }
      state:
        moderation.shield_mode: "{active}"
        moderation.shield_mode_last_activated_at: "{last}"
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.shield_mode\\.begin$" }
      json: { started: "$.payload.event.started_at" }
      state:
        moderation.shield_mode: "true"
        moderation.shield_mode_last_activated_at: "{started}"
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.shield_mode\\.end$" }
      json: {}
      state: { moderation.shield_mode: "false" }

    # ── Moderators and VIPs: the whole first page, read again on changes ───
    - path: '^/helix/moderation/moderators\?broadcaster_id=[0-9]+&first=100$'
      json_each: "$.data"
      json: { id: "$.user_id", login: "$.user_login", name: "$.user_name" }
      replace: moderation.moderators
      state:
        moderation.moderators.{id}.login: "{login}"
        moderation.moderators.{id}.name: "{name}"
    - path: '^/helix/moderation/moderators\?broadcaster_id=[0-9]+&user_id='
      json: {}
      then_send:
        - { method: GET, path: /helix/moderation/moderators, query: { broadcaster_id: "{settings.broadcaster_id}", first: "100" } }
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.moderator\\.(add|remove)$" }
      json: {}
      then_send:
        - { method: GET, path: /helix/moderation/moderators, query: { broadcaster_id: "{settings.broadcaster_id}", first: "100" } }
    - path: '^/helix/channels/vips\?broadcaster_id=[0-9]+&first=100$'
      json_each: "$.data"
      json: { id: "$.user_id", login: "$.user_login", name: "$.user_name" }
      replace: moderation.vips
      state:
        moderation.vips.{id}.login: "{login}"
        moderation.vips.{id}.name: "{name}"
    - path: '^/helix/channels/vips\?broadcaster_id=[0-9]+&user_id='
      json: {}
      then_send:
        - { method: GET, path: /helix/channels/vips, query: { broadcaster_id: "{settings.broadcaster_id}", first: "100" } }
    - json_match: { "$.metadata.message_type": "^notification$", "$.metadata.subscription_type": "^channel\\.vip\\.(add|remove)$" }
      json: {}
      then_send:
        - { method: GET, path: /helix/channels/vips, query: { broadcaster_id: "{settings.broadcaster_id}", first: "100" } }

    # ── Bans and blocked terms ──────────────────────────────────────────────
    - path: '^/helix/moderation/banned\?broadcaster_id=[0-9]+&first=100$'
      json_each: "$.data"
      json: { id: "$.user_id", login: "$.user_login", name: "$.user_name", expires: "$.expires_at",
              reason: "$.reason", moderator: "$.moderator_name" }
      replace: moderation.banned
      state:
        moderation.banned.{id}.login: "{login}"
        moderation.banned.{id}.name: "{name}"
        moderation.banned.{id}.expires_at: "{expires}"
        moderation.banned.{id}.reason: "{reason}"
        moderation.banned.{id}.moderator_name: "{moderator}"
    - path: '^/helix/moderation/bans\?'
      json: {}
      then_send:
        - { method: GET, path: /helix/moderation/banned, query: { broadcaster_id: "{settings.broadcaster_id}", first: "100" } }
    - path: '^/helix/moderation/blocked_terms\?'
      json_each: "$.data"
      json: { id: "$.id", text: "$.text", expires: "$.expires_at" }
      state:
        moderation.blocked_terms.{id}.text: "{text}"
        moderation.blocked_terms.{id}.expires_at: "{expires}"
    - path: '^/helix/moderation/blocked_terms\?broadcaster_id=[0-9]+&moderator_id=[0-9]+&first=100$'
      json: {}
      replace: moderation.blocked_terms
    - path: '^/helix/moderation/blocked_terms\?broadcaster_id=[0-9]+&moderator_id=[0-9]+&id='
      json: {}
      then_send:
        - { method: GET, path: /helix/moderation/blocked_terms,
            query: { broadcaster_id: "{settings.broadcaster_id}", moderator_id: "{settings.broadcaster_id}", first: "100" } }

    # ── Channel Points rewards and the redemption queue ─────────────────────
    - path: '^/helix/channel_points/custom_rewards\?'
      json_each: "$.data"
      json:
        id: "$.id"
        title: "$.title"
        cost: "$.cost"
        prompt: "$.prompt"
        enabled: "$.is_enabled"
        paused: "$.is_paused"
        stock: "$.is_in_stock"
        color: "$.background_color"
        input: "$.is_user_input_required"
        skip: "$.should_redemptions_skip_request_queue"
        mps_on: "$.max_per_stream_setting.is_enabled"
        mps: "$.max_per_stream_setting.max_per_stream"
        mpu_on: "$.max_per_user_per_stream_setting.is_enabled"
        mpu: "$.max_per_user_per_stream_setting.max_per_user_per_stream"
        cd_on: "$.global_cooldown_setting.is_enabled"
        cd: "$.global_cooldown_setting.global_cooldown_seconds"
        count: "$.redemptions_redeemed_current_stream"
        cd_until: "$.cooldown_expires_at"
      state:
        channel_points.rewards.{id}.title: "{title}"
        channel_points.rewards.{id}.cost: "{cost}"
        channel_points.rewards.{id}.prompt: "{prompt}"
        channel_points.rewards.{id}.enabled: "{enabled}"
        channel_points.rewards.{id}.paused: "{paused}"
        channel_points.rewards.{id}.in_stock: "{stock}"
        channel_points.rewards.{id}.background_color: "{color}"
        channel_points.rewards.{id}.user_input_required: "{input}"
        channel_points.rewards.{id}.skip_queue: "{skip}"
        channel_points.rewards.{id}.max_per_stream_enabled: "{mps_on}"
        channel_points.rewards.{id}.max_per_stream: "{mps}"
        channel_points.rewards.{id}.max_per_user_per_stream_enabled: "{mpu_on}"
        channel_points.rewards.{id}.max_per_user_per_stream: "{mpu}"
        channel_points.rewards.{id}.global_cooldown_enabled: "{cd_on}"
        channel_points.rewards.{id}.global_cooldown_seconds: "{cd}"
        channel_points.rewards.{id}.redemptions_this_stream: "{count}"
        channel_points.rewards.{id}.cooldown_expires_at: "{cd_until}"
    # The whole list only when every reward was asked for.
    - path: '^/helix/channel_points/custom_rewards\?broadcaster_id=[0-9]+&only_manageable_rewards=false$'
      json: {}
      replace: channel_points.rewards
    - path: '^/helix/channel_points/custom_rewards\?broadcaster_id=[0-9]+&id='
      json: {}
      then_send:
        - { method: GET, path: /helix/channel_points/custom_rewards,
            query: { broadcaster_id: "{settings.broadcaster_id}", only_manageable_rewards: "false" } }
    - path: '^/helix/channel_points/custom_rewards/redemptions\?'
      json_each: "$.data"
      each_match: { "$.status": "^UNFULFILLED$" }
      json: { id: "$.id", reward: "$.reward.id", reward_title: "$.reward.title", user: "$.user_id",
              name: "$.user_name", input: "$.user_input", at: "$.redeemed_at" }
      state:
        channel_points.redemptions.{id}.reward_id: "{reward}"
        channel_points.redemptions.{id}.reward_title: "{reward_title}"
        channel_points.redemptions.{id}.user_id: "{user}"
        channel_points.redemptions.{id}.user_name: "{name}"
        channel_points.redemptions.{id}.user_input: "{input}"
        channel_points.redemptions.{id}.redeemed_at: "{at}"
    - path: '^/helix/channel_points/custom_rewards/redemptions\?'
      json_each: "$.data"
      each_match: { "$.status": "^(FULFILLED|CANCELED)$" }
      json: { id: "$.id" }
      state: { "channel_points.redemptions.{id}": { delete: true } }
    - json_match: { "$.metadata.message_type": "^notification$",
                    "$.metadata.subscription_type": "^channel\\.channel_points_custom_reward_redemption\\.add$",
                    "$.payload.event.status": "^unfulfilled$" }
      json: { id: "$.payload.event.id", reward: "$.payload.event.reward.id", reward_title: "$.payload.event.reward.title",
              user: "$.payload.event.user_id", name: "$.payload.event.user_name", input: "$.payload.event.user_input",
              at: "$.payload.event.redeemed_at" }
      state:
        channel_points.redemptions.{id}.reward_id: "{reward}"
        channel_points.redemptions.{id}.reward_title: "{reward_title}"
        channel_points.redemptions.{id}.user_id: "{user}"
        channel_points.redemptions.{id}.user_name: "{name}"
        channel_points.redemptions.{id}.user_input: "{input}"
        channel_points.redemptions.{id}.redeemed_at: "{at}"
    - json_match: { "$.metadata.message_type": "^notification$",
                    "$.metadata.subscription_type": "^channel\\.channel_points_custom_reward_redemption\\.update$" }
      json: { id: "$.payload.event.id" }
      state: { "channel_points.redemptions.{id}": { delete: true } }

    # ── Stream schedule: the poll's next 25 broadcasts, read again on changes
    - path: '^/helix/schedule\?broadcaster_id=[0-9]+&first=25$'
      json_each: "$.data.segments"
      json: { id: "$.id", start: "$.start_time", end: "$.end_time", title: "$.title", category_id: "$.category.id",
              category: "$.category.name", recurring: "$.is_recurring", canceled: "$.canceled_until" }
      replace: schedule.segments
      state:
        schedule.segments.{id}.start_time: "{start}"
        schedule.segments.{id}.end_time: "{end}"
        schedule.segments.{id}.title: "{title}"
        schedule.segments.{id}.category_id: "{category_id}"
        schedule.segments.{id}.category_name: "{category}"
        schedule.segments.{id}.recurring: "{recurring}"
        schedule.segments.{id}.canceled_until: "{canceled}"
    - path: '^/helix/schedule\?broadcaster_id=[0-9]+&first=25$'
      json_match: { "$.data.vacation": "^null$" }
      json: {}
      state:
        schedule.vacation: "false"
        schedule.vacation_start_time: ""
        schedule.vacation_end_time: ""
    - path: '^/helix/schedule\?broadcaster_id=[0-9]+&first=25$'
      json_match: { "$.data.vacation": "^\\{" }
      json: { start: "$.data.vacation.start_time", end: "$.data.vacation.end_time" }
      state:
        schedule.vacation: "true"
        schedule.vacation_start_time: "{start}"
        schedule.vacation_end_time: "{end}"
    - path: '^/helix/schedule/(segment|settings)\?'
      json: {}
      then_send:
        - { method: GET, path: /helix/schedule, query: { broadcaster_id: "{settings.broadcaster_id}", first: "25" } }
