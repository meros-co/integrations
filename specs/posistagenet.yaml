spec: 1
id: posistagenet
name: PosiStageNet (PSN) tracker positions, received and sent
vendor: VYV and MA Lighting (PosiStageNet; any PSN tracking server, media server or console)
category: lighting
implementation: native
reason: >
  PosiStageNet is binary little-endian chunks multicast on a fixed group and port by tracking servers, not a
  device's conversation: the core joins the group, decodes nested chunks (frames split over several packets),
  keeps every server's trackers and drops those its PSN_INFO no longer lists, and as a server itself encodes
  its trackers at a steady rate in packets of at most 1500 bytes.

source:
  - title: "PosiStageNet Protocol description v2.03 (Sept 09, 2019)"
    author: VYV Corporation and MA Lighting Technology GmbH
    url: https://github.com/vyv/psn-cpp/blob/master/doc/PosiStageNetprotocol_v2.03_2019_09_09.pdf
    note: >
      Manufacturer document, released into the public domain, linked from posistage.net. Multicast to
      236.10.10.10 on UDP 56565 by default, both changeable on the server; packets of at most 1500 bytes, a frame
      split across packets by frame_id and frame_packet_count; little-endian chunks with an id, a data length
      and a has_subchunks bit; PSN_INFO_PACKET 0x6756 (header, system name 0x0001, tracker list 0x0002 with each
      tracker's name 0x0000) at 1 Hz by default; PSN_DATA_PACKET 0x6755 (header, tracker list 0x0001; per
      tracker POS 0, SPEED 1, ORI 2, STATUS 3, ACCEL 4, TRGTPOS 5, TIMESTAMP 6) at 60 Hz by default; the
      packet header's microsecond timestamp, version, frame id and packet count; units (meters, m/s, m/s²,
      orientation as an axis whose length is the angle in radians).
  - title: "psn-cpp, PosiStageNet C++ library (include/psn_defs.hpp)"
    author: VYV Corporation (MIT licence)
    url: https://github.com/vyv/psn-cpp
    note: >
      The vendor's own reference implementation, read for the chunk header's bit widths the protocol document
      gives only as a figure: id in the low 16 bits, data_len in the next 15, has_subchunks in the top bit.

settings:
  bind_address: { type: string, pattern: '^[0-9A-Fa-f.:]*$', max_length: 45, label: Bind address, description: "The local IPv4 address of the network interface on the PSN network, where the group is joined; empty binds where the core binds and joins on every IPv4 interface." }
  multicast_group: { type: string, pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$', max_length: 15, default: "236.10.10.10", label: Multicast group, description: "The PSN multicast address, received and sent to; the protocol's default is 236.10.10.10." }
  receive_interval_ms: { type: int, min: 0, max: 60000, default: 50, label: Receive interval, description: "The shortest time in milliseconds between two state updates of one server's trackers; the latest values are reported when it ends." }
  multicast: { type: bool, default: true, label: Multicast, description: "Send the core's trackers to the multicast group; false sends them to the unicast addresses and the host only." }
  unicast_addresses: { type: string, max_length: 1024, default: "", label: Unicast addresses, description: "Comma-separated receivers the core's trackers are also sent to, as IP addresses (the PSN port) or ip:port; the host, when given, is one too." }
  system_name: { type: string, max_length: 256, default: Meros Integrations, label: System name, description: "The system name the core's own PSN_INFO gives, when it sends trackers." }
  send_rate_hz: { type: int, min: 1, max: 1000, default: 60, label: Send rate, description: "PSN_DATA packets a second the core sends while it has trackers; the protocol's default is 60." }

ports:
  - { port: 56565, protocol: udp, role: control, listener: core, note: "PSN's default port, with multicast group 236.10.10.10: the core listens on it (shared with other programs on the host) and sends its own trackers to the group and port, the unicast addresses and the host. The port given when opening changes it" }

models:
  - id: posistagenet
    name: PosiStageNet network (any PSN server; the core receives, and sends trackers it is given)
    supports: [set_tracker, remove_tracker, clear_trackers]
    verification: none

commands:
  set_tracker:
    summary: >
      Send a tracker as a PSN server: add it, or change the fields given (a vector's three components together),
      the others kept. While the core has trackers it sends PSN_DATA at send_rate_hz and PSN_INFO once a second.
      Returns unverified, PSN having no acknowledgement
    params:
      tracker: { type: int, min: 0, max: 65535, required: true, label: Tracker, description: "The tracker's id, unique within the core's PSN system." }
      name: { type: string, max_length: 256, default: "", label: Name, description: "The tracker's name; empty keeps it (Tracker <id> at first)." }
      position_x: { type: float, label: Position X, description: "Position in meters; positive x is right." }
      position_y: { type: float, label: Position Y, description: "Position in meters; positive y is up." }
      position_z: { type: float, label: Position Z, description: "Position in meters; positive z is depth." }
      speed_x: { type: float, label: Speed X, description: "Velocity in meters per second along x." }
      speed_y: { type: float, label: Speed Y, description: "Velocity in meters per second along y." }
      speed_z: { type: float, label: Speed Z, description: "Velocity in meters per second along z." }
      orientation_x: { type: float, label: Orientation X, description: "X of the rotation axis, whose length is the rotation in radians, absolute." }
      orientation_y: { type: float, label: Orientation Y, description: "Y of the rotation axis." }
      orientation_z: { type: float, label: Orientation Z, description: "Z of the rotation axis." }
      acceleration_x: { type: float, label: Acceleration X, description: "Acceleration in meters per second squared along x." }
      acceleration_y: { type: float, label: Acceleration Y, description: "Acceleration in meters per second squared along y." }
      acceleration_z: { type: float, label: Acceleration Z, description: "Acceleration in meters per second squared along z." }
      target_x: { type: float, label: Target X, description: "X of the position the tracker is moving to, in meters." }
      target_y: { type: float, label: Target Y, description: "Y of the target position, in meters." }
      target_z: { type: float, label: Target Z, description: "Z of the target position, in meters." }
      validity: { type: float, label: Validity, description: "The tracker's validity (PSN_DATA_TRACKER_STATUS), as the receiving system reads it." }
    returns: none
  remove_tracker:
    summary: Stop sending a tracker; the next PSN_INFO no longer lists it
    params:
      tracker: { type: int, min: 0, max: 65535, required: true, label: Tracker, description: "The tracker's id." }
    returns: none
  clear_trackers:
    summary: Stop sending every tracker (PSN_INFO is sent once more with none)
    returns: none

state:
  port: { type: int, description: "The PSN port listened on and sent to" }
  group: { type: string, description: "The PSN multicast group" }
  system_name: { type: string, description: "The core's own system name" }
  servers.*.online: { type: bool, description: "Whether the server (keyed by IP address) was heard in the last 5 s" }
  servers.*.system_name: { type: string, description: "The server's system name, from PSN_INFO" }
  servers.*.version: { type: string, description: "The protocol version its packets give, such as 2.03" }
  servers.*.timestamp_us: { type: int, unit: us, description: "Microseconds since the server started, from its last PSN_DATA" }
  servers.*.trackers.*.name: { type: string, description: "A tracker's name, keyed by tracker id, from PSN_INFO" }
  servers.*.trackers.*.position.x: { type: float, unit: m, description: "Position x (right), meters" }
  servers.*.trackers.*.position.y: { type: float, unit: m, description: "Position y (up), meters" }
  servers.*.trackers.*.position.z: { type: float, unit: m, description: "Position z (depth), meters" }
  servers.*.trackers.*.speed.x: { type: float, unit: m/s, description: "Velocity x" }
  servers.*.trackers.*.speed.y: { type: float, unit: m/s, description: "Velocity y" }
  servers.*.trackers.*.speed.z: { type: float, unit: m/s, description: "Velocity z" }
  servers.*.trackers.*.orientation.x: { type: float, unit: rad, description: "Rotation axis x; the axis's length is the rotation in radians" }
  servers.*.trackers.*.orientation.y: { type: float, unit: rad, description: "Rotation axis y" }
  servers.*.trackers.*.orientation.z: { type: float, unit: rad, description: "Rotation axis z" }
  servers.*.trackers.*.acceleration.x: { type: float, unit: m/s², description: "Acceleration x" }
  servers.*.trackers.*.acceleration.y: { type: float, unit: m/s², description: "Acceleration y" }
  servers.*.trackers.*.acceleration.z: { type: float, unit: m/s², description: "Acceleration z" }
  servers.*.trackers.*.target.x: { type: float, unit: m, description: "Target position x" }
  servers.*.trackers.*.target.y: { type: float, unit: m, description: "Target position y" }
  servers.*.trackers.*.target.z: { type: float, unit: m, description: "Target position z" }
  servers.*.trackers.*.validity: { type: float, description: "PSN_DATA_TRACKER_STATUS validity" }
  servers.*.trackers.*.timestamp_us: { type: int, unit: us, description: "When the server computed the tracker, microseconds since it started" }
  sending.*.name: { type: string, description: "A tracker the core sends, keyed by id: its name" }
  sending.*.position.x: { type: float, unit: m, description: "Position x of a tracker the core sends" }
  sending.*.position.y: { type: float, unit: m, description: "Position y of a tracker the core sends" }
  sending.*.position.z: { type: float, unit: m, description: "Position z of a tracker the core sends" }
  sending.*.speed.x: { type: float, unit: m/s, description: "Velocity x of a tracker the core sends, when set" }
  sending.*.speed.y: { type: float, unit: m/s, description: "Velocity y of a tracker the core sends, when set" }
  sending.*.speed.z: { type: float, unit: m/s, description: "Velocity z of a tracker the core sends, when set" }
  sending.*.orientation.x: { type: float, unit: rad, description: "Rotation axis x of a tracker the core sends, when set" }
  sending.*.orientation.y: { type: float, unit: rad, description: "Rotation axis y of a tracker the core sends, when set" }
  sending.*.orientation.z: { type: float, unit: rad, description: "Rotation axis z of a tracker the core sends, when set" }
  sending.*.acceleration.x: { type: float, unit: m/s², description: "Acceleration x of a tracker the core sends, when set" }
  sending.*.acceleration.y: { type: float, unit: m/s², description: "Acceleration y of a tracker the core sends, when set" }
  sending.*.acceleration.z: { type: float, unit: m/s², description: "Acceleration z of a tracker the core sends, when set" }
  sending.*.target.x: { type: float, unit: m, description: "Target position x of a tracker the core sends, when set" }
  sending.*.target.y: { type: float, unit: m, description: "Target position y of a tracker the core sends, when set" }
  sending.*.target.z: { type: float, unit: m, description: "Target position z of a tracker the core sends, when set" }
  sending.*.validity: { type: float, description: "Its validity, when set" }

quirks:
  - models: [all]
    severity: info
    text: >
      Opened with no host: the core listens on UDP 56565 (another program can listen there too) and joins
      236.10.10.10 on every interface, or on bind_address's. Each server is kept under servers.<its IP address>,
      its trackers keyed by id; a tracker the server's whole PSN_INFO frame no longer lists is removed, and a
      server silent 5 s is marked offline. Positions change many times a second, so a server's trackers are
      reported at most every receive_interval_ms (the latest values). Connected means listening.
  - models: [all]
    severity: info
    text: >
      As a server, the core sends PSN_DATA at send_rate_hz with every field set for each tracker (position always,
      0,0,0 until set) and its timestamp, and PSN_INFO once a second, to the group (unless multicast is off), the
      unicast addresses and the host, starting when the first tracker is set. A tracker's fields are sent as last set; nothing
      moves them between commands. The version sent is 2.03 (high 2, low 3), read from the document's version.
  - models: [all]
    severity: info
    text: >
      Opening for commands only (monitor false) joins no group and keeps nothing received; sending trackers works
      as usual. Multicast goes out with the operating system's TTL (1) and interface choice. A server's own
      trackers looped back to it are read like any server's, under its own address.
