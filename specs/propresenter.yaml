spec: 1
id: propresenter
name: ProPresenter 7 (ProPresenter API)
vendor: Renewed Vision
category: playback

# Generated from Renewed Vision's OpenAPI document; regenerate rather than
# editing commands by hand.

source:
  - title: ProPresenter API (OpenAPI 3.0.2, version 1.0)
    author: Renewed Vision
    url: https://openapi.propresenter.com/
    note: >
      Manufacturer document. Every command here is an operation in it, named by
      its operationId, with its path and query parameters, request body and
      success status. Image endpoints and chunked streams are not included.

transport:
  type: http
  port: 50001
  scheme: http
  auth: none
  timeout_ms: 4000
  probe: { method: GET, path: /version }

ports:
  - { port: 50001, protocol: http, role: control }

models:
  - id: propresenter-7
    name: ProPresenter 7.9 and later
    supports: [announcement_active_get, announcement_active_focus,
               announcement_active_next_trigger, announcement_active_previous_trigger,
               announcement_active_timeline_status,
               annoucement_active_timeline_operation, announcement_active_trigger,
               announcement_active_cue_trigger, get_announcement_slide_index,
               audio_playlist_active_get, audio_playlist_active_focus,
               audio_playlist_active_next_trigger,
               audio_playlist_active_previous_trigger, audio_playlist_active_trigger,
               audio_playlist_active_item_trigger, audio_playlist_focused_get,
               audio_playlist_focused_next_trigger,
               audio_playlist_focused_previous_trigger, audio_playlist_focused_trigger,
               audio_playlist_focused_item_trigger, audio_playlist_next_focus,
               audio_playlist_previous_focus, audio_playlist_get, audio_playlist_focus,
               audio_playlist_next_trigger, audio_playlist_previous_trigger,
               audio_playlist_trigger, audio_playlist_item_trigger,
               audio_playlists_get, capture_modes_get, capture_settings_get,
               capture_status_get, capture_operation, clear_group_get, clear_group_set,
               clear_group_delete, clear_group_trigger, clear_groups_get,
               clear_group_create, clear_layer, find_my_mouse, global_groups_get,
               library_list_get, library_get, library_trigger, library_trigger_cue,
               look_get_current, look_set_current, look_get, look_put, look_delete,
               look_trigger, look_get_all, look_create, macro_get, macro_set,
               macro_delete, macro_trigger, macro_collection_get, macro_collection_set,
               macro_collection_delete, macro_collection_get_all,
               macro_collection_create, macro_get_all, mask_get, mask_get_all,
               media_playlist_active, media_playlist_active_focus,
               media_playlist_active_next_trigger,
               media_playlist_active_previous_trigger, media_playlist_active_trigger,
               media_playlist_active_item_trigger, media_playlist_focused,
               media_playlist_focused_next_trigger,
               media_playlist_focused_previous_trigger, media_playlist_focused_trigger,
               media_playlist_focused_item_trigger, media_playlist_next_focus,
               media_playlist_previous_focus, media_playlist_get, media_playlist_focus,
               media_playlist_next_trigger, media_playlist_previous_trigger,
               media_playlist_trigger, media_playlist_item_trigger,
               media_playlists_get, message_get, message_set, messaage_delete,
               message_clear, message_trigger, message_trigger_with_body,
               message_get_all, message_create, playlist_active_get,
               playlist_active_announcement_focus,
               playlist_active_announcement_trigger,
               playlist_active_announcement_item_trigger,
               playlist_active_presentation_focus,
               playlist_active_presentation_trigger,
               playlist_active_presentation_item_trigger, playlist_focused_get,
               playlist_focused_next, playlist_focused_next_trigger,
               playlist_focused_previous, playlist_focused_previous_trigger,
               playlist_focused_trigger, playlist_focused_item_trigger,
               playlist_next_focus, playlist_previous_focus, playlist_get,
               playlist_put, playlist_create, playlist_focus, playlist_next_trigger,
               playlist_previous_trigger, playlist_trigger, playlist_item_trigger,
               playlist_get_all, playlist_create_top_level, presentation_get_active,
               presentation_active_focus, presentation_active_group_trigger,
               presentation_active_next_trigger, presentation_active_previous_trigger,
               presentation_active_timeline_status,
               presentation_active_timeline_operation, presentation_active_trigger,
               presentation_active_cue_trigger, presentation_focused,
               presentation_focused_group_trigger, presentation_focused_next_trigger,
               presentation_focused_previous_trigger,
               presentation_focused_timeline_status,
               presentation_focused_timeline_operation, presentation_focused_trigger,
               presentation_focused_cue_trigger, presentation_next_focus,
               presentation_previous_focus, presentation_get_slide_index,
               presentation_get, presentation_focus, presentation_group_trigger,
               presentation_next_trigger, presentation_previous_trigger,
               presentation_timeline_operation, presentation_trigger,
               presentation_cue_trigger, prop_get, prop_put, prop_delete, prop_pause,
               prop_resume, prop_clear, prop_trigger, prop_collection_get,
               prop_collection_set, prop_collection_delete, prop_collection_get_all,
               prop_collection_create, prop_get_all, stage_layout_delete,
               stage_layout_map_get, stage_layout_map_set, stage_layouts_get,
               stage_message_get, stage_message_show, stage_message_hide,
               stage_screen_layout_get, stage_screen_layout_set, stage_screens_get,
               audience_screens_status_get, audience_screens_status_set,
               layer_status_get, status_screens_get, slide_status_get,
               stage_screens_status_get, stage_screens_status_set, theme_get,
               theme_slide_get, theme_slide_set, theme_get_all, timer_get_system_time,
               timer_get_video_countdown, timer_get, timer_set, timer_delete,
               timer_increment, timer_operation, timer_set_and_operation,
               timer_get_all, timer_create, timer_get_current_times,
               timer_operation_all, transport_auto_advance_get,
               transport_auto_advance_cancel, transport_current_media_get,
               transport_go_to_end, transport_pause, transport_play,
               transport_skip_backward, transport_skip_forward, transport_time_get,
               transport_time_set, trigger_audio_next, trigger_audio_previous,
               trigger_media_next, trigger_media_previous, trigger_next,
               trigger_previous, video_inputs_get, video_inputs_trigger, version_get]
    verification: none

commands:
  announcement_active_get:
    summary: "Requests the currently active announcement presentation."
    send: { method: GET, path: "/v1/announcement/active" }
    expect: { status: 200, json_path: "$" }
    returns: value
  announcement_active_focus:
    summary: "Focuses the currently active announcement presentation."
    send: { method: GET, path: "/v1/announcement/active/focus" }
    expect: { status: 204 }
    returns: ack
  announcement_active_next_trigger:
    summary: "Triggers the next cue in the active announcement presentation (if there is one)."
    send: { method: GET, path: "/v1/announcement/active/next/trigger" }
    expect: { status: 204 }
    returns: ack
  announcement_active_previous_trigger:
    summary: "Triggers the previous cue in the currently active announcement presentation (if there is one)."
    send: { method: GET, path: "/v1/announcement/active/previous/trigger" }
    expect: { status: 204 }
    returns: ack
  announcement_active_timeline_status:
    summary: "Requests the current state of the active announcement timeline."
    send: { method: GET, path: "/v1/announcement/active/timeline" }
    expect: { status: 200, json_path: "$" }
    returns: value
  annoucement_active_timeline_operation:
    summary: "Performs the requested timeline operation for the active announcment presentation."
    params:
      operation: { type: enum, values: ["play", "pause", "rewind"], required: true,
                   label: Operation,
                   description: "Play, pause or rewind the timeline." }
    send: { method: GET, path: "/v1/announcement/active/timeline/{operation}" }
    expect: { status: 204 }
    returns: ack
  announcement_active_trigger:
    summary: "Retriggers the currently active announcement presentation (starts from the beginning)."
    send: { method: GET, path: "/v1/announcement/active/trigger" }
    expect: { status: 204 }
    returns: ack
  announcement_active_cue_trigger:
    summary: "Triggers the specified cue in the currently active announcement presentation."
    params:
      index: { type: int, min: 0, required: true,
               label: Cue index,
               description: "Position of the cue (slide) in the presentation, counted from 0, following its selected arrangement." }
    send: { method: GET, path: "/v1/announcement/active/{index}/trigger" }
    expect: { status: 204 }
    returns: ack
  get_announcement_slide_index:
    summary: "Requests the index of the current slide/cue within the currently active announcement."
    send: { method: GET, path: "/v1/announcement/slide_index" }
    expect: { status: 200, json_path: "$" }
    returns: value
  audio_playlist_active_get:
    summary: "Requests the currently active audio playlist"
    send: { method: GET, path: "/v1/audio/playlist/active" }
    expect: { status: 200, json_path: "$" }
    returns: value
  audio_playlist_active_focus:
    summary: "Focuses the active audio playlist."
    send: { method: GET, path: "/v1/audio/playlist/active/focus" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_active_next_trigger:
    summary: "Triggers the next item in the active audio playlist."
    send: { method: GET, path: "/v1/audio/playlist/active/next/trigger" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_active_previous_trigger:
    summary: "Triggers the previous item in the active audio playlist."
    send: { method: GET, path: "/v1/audio/playlist/active/previous/trigger" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_active_trigger:
    summary: "Triggers the active audio playlist (restarts from the beginning)."
    send: { method: GET, path: "/v1/audio/playlist/active/trigger" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_active_item_trigger:
    summary: "Triggers the specified item in the active audio playlist."
    params:
      id: { type: string, max_length: 256, required: true,
            label: Audio item,
            description: "The audio item, by name, index or UUID." }
    send: { method: GET, path: "/v1/audio/playlist/active/{id}/trigger" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_focused_get:
    summary: "Requests the currently focused audio playlist"
    send: { method: GET, path: "/v1/audio/playlist/focused" }
    expect: { status: 200, json_path: "$" }
    returns: value
  audio_playlist_focused_next_trigger:
    summary: "Triggers the next item in the focused audio playlist."
    send: { method: GET, path: "/v1/audio/playlist/focused/next/trigger" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_focused_previous_trigger:
    summary: "Triggers the previous item in the focused audio playlist."
    send: { method: GET, path: "/v1/audio/playlist/focused/previous/trigger" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_focused_trigger:
    summary: "Triggers the focused audio playlist."
    send: { method: GET, path: "/v1/audio/playlist/focused/trigger" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_focused_item_trigger:
    summary: "Triggers the specified item in the focused audio playlist."
    params:
      id: { type: string, max_length: 256, required: true,
            label: Audio item,
            description: "The audio item, by name, index or UUID." }
    send: { method: GET, path: "/v1/audio/playlist/focused/{id}/trigger" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_next_focus:
    summary: "Focuses the next audio playlist."
    send: { method: GET, path: "/v1/audio/playlist/next/focus" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_previous_focus:
    summary: "Focuses the previous audio playlist."
    send: { method: GET, path: "/v1/audio/playlist/previous/focus" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_get:
    summary: "Requests a list of all the audio items in the specified audio playlist."
    params:
      playlist_id: { type: string, max_length: 256, required: true,
                     label: Audio playlist,
                     description: "The audio playlist, by UUID, name or index, or a path of them for a playlist within folders." }
    send: { method: GET, path: "/v1/audio/playlist/{playlist_id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
  audio_playlist_focus:
    summary: "Focuses the specified audio playlist."
    params:
      playlist_id: { type: string, max_length: 256, required: true,
                     label: Audio playlist,
                     description: "The audio playlist, by UUID, name or index, or a path of them for a playlist within folders." }
    send: { method: GET, path: "/v1/audio/playlist/{playlist_id}/focus" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_next_trigger:
    summary: "Triggers the next item in the specified audio playlist."
    params:
      playlist_id: { type: string, max_length: 256, required: true,
                     label: Audio playlist,
                     description: "The audio playlist, by UUID, name or index, or a path of them for a playlist within folders." }
    send: { method: GET, path: "/v1/audio/playlist/{playlist_id}/next/trigger" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_previous_trigger:
    summary: "Triggers the previous item in the specified audio playlist."
    params:
      playlist_id: { type: string, max_length: 256, required: true,
                     label: Audio playlist,
                     description: "The audio playlist, by UUID, name or index, or a path of them for a playlist within folders." }
    send: { method: GET, path: "/v1/audio/playlist/{playlist_id}/previous/trigger" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_trigger:
    summary: "Triggers the specified audio playlist."
    params:
      playlist_id: { type: string, max_length: 256, required: true,
                     label: Audio playlist,
                     description: "The audio playlist, by UUID, name or index, or a path of them for a playlist within folders." }
    send: { method: GET, path: "/v1/audio/playlist/{playlist_id}/trigger" }
    expect: { status: 204 }
    returns: ack
  audio_playlist_item_trigger:
    summary: "Triggers the specified item in the specified audio playlist."
    params:
      playlist_id: { type: string, max_length: 256, required: true,
                     label: Audio playlist,
                     description: "The audio playlist, by UUID, name or index, or a path of them for a playlist within folders." }
      id: { type: string, max_length: 256, required: true,
            label: Audio item,
            description: "The audio item, by name, index or UUID." }
    send: { method: GET, path: "/v1/audio/playlist/{playlist_id}/{id}/trigger" }
    expect: { status: 204 }
    returns: ack
  audio_playlists_get:
    summary: "Requests a list with all the configured audio playlists."
    send: { method: GET, path: "/v1/audio/playlists" }
    expect: { status: 200, json_path: "$" }
    returns: value
  capture_modes_get:
    summary: "Requests a list of all available capture modes for the capture type (disk, rtmp, resi)."
    params:
      type: { type: enum, values: ["disk", "rtmp", "resi"], required: true,
              label: Capture type,
              description: "Capture destination: disk, rtmp (streaming) or resi (Resi streaming)." }
    send: { method: GET, path: "/v1/capture/encodings/{type}" }
    expect: { status: 200, json_path: "$" }
    returns: value
  capture_settings_get:
    summary: "Requests the current capture settings."
    send: { method: GET, path: "/v1/capture/settings" }
    expect: { status: 200, json_path: "$" }
    returns: value
  capture_status_get:
    summary: "Requests the current capture status and capture time."
    send: { method: GET, path: "/v1/capture/status" }
    expect: { status: 200, json_path: "$" }
    returns: value
  capture_operation:
    summary: "Performs the requested capture operation (start, stop)."
    params:
      operation: { type: enum, values: ["start", "stop"], required: true,
                   label: Operation,
                   description: "Start or stop capturing." }
    send: { method: GET, path: "/v1/capture/{operation}" }
    expect: { status: 204 }
    returns: ack
  clear_group_get:
    summary: "Requests the details of the specified clear group."
    params:
      id: { type: string, max_length: 256, required: true,
            label: Clear group,
            description: "The clear group, by name, index or UUID." }
    send: { method: GET, path: "/v1/clear/group/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
  clear_group_set:
    summary: "Sets the details of the specified clear group. The body is JSON in the shape the API document gives for this operation."
    params:
      id: { type: string, max_length: 256, required: true,
            label: Clear group,
            description: "The clear group, by name, index or UUID." }
      body: { type: json, required: true,
              label: Body,
              description: "JSON in the shape the API document gives for this operation; ProPresenter validates it." }
    send: { method: PUT, path: "/v1/clear/group/{id}", body: "{body}", content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value
  clear_group_delete:
    summary: "Deletes the specified clear group."
    params:
      id: { type: string, max_length: 256, required: true,
            label: Clear group,
            description: "The clear group, by name, index or UUID." }
    send: { method: DELETE, path: "/v1/clear/group/{id}" }
    expect: { status: 204 }
    returns: ack
  clear_group_trigger:
    summary: "Triggers the specified clear group."
    params:
      id: { type: string, max_length: 256, required: true,
            label: Clear group,
            description: "The clear group, by name, index or UUID." }
    send: { method: GET, path: "/v1/clear/group/{id}/trigger" }
    expect: { status: 204 }
    returns: ack
  clear_groups_get:
    summary: "Requests a list of all the configured clear groups."
    send: { method: GET, path: "/v1/clear/groups" }
    expect: { status: 200, json_path: "$" }
    returns: value
  clear_group_create:
    summary: "Create a clear group with the details specified. The body is JSON in the shape the API document gives for this operation."
    params:
      body: { type: json, required: true,
              label: Body,
              description: "JSON in the shape the API document gives for this operation; ProPresenter validates it." }
    send: { method: POST, path: "/v1/clear/groups", body: "{body}", content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value
  clear_layer:
    summary: "Clears the specified layer (audio, props, messages, announcements, slide, media, video_input)."
    params:
      layer: { type: enum, values: ["audio", "props", "messages", "announcements", "slide", "media", "video_input"], required: true,
               label: Layer,
               description: "The layer to clear: audio, props, messages, announcements, slide, media or video input." }
    send: { method: GET, path: "/v1/clear/layer/{layer}" }
    expect: { status: 204 }
    returns: ack
  find_my_mouse:
    summary: "Executes the \"Find My Mouse\" operation."
    send: { method: GET, path: "/v1/find_my_mouse" }
    expect: { status: 204 }
    returns: ack
  global_groups_get:
    summary: "Requests a list of all the configured global groups."
    send: { method: GET, path: "/v1/groups" }
    expect: { status: 200, json_path: "$" }
    returns: value
  library_list_get:
    summary: "Requests a list of all the configured libraries."
    send: { method: GET, path: "/v1/libraries" }
    expect: { status: 200, json_path: "$" }
    returns: value
  library_get:
    summary: "Requests an array of all items in the specified library."
    params:
      library_id: { type: string, max_length: 256, required: true,
                    label: Library,
                    description: "The library, by name or index (matching by UUID is deprecated)." }
    send: { method: GET, path: "/v1/library/{library_id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
  library_trigger:
    summary: "Triggers the first cue of the specified presentation in the specified library."
    params:
      library_id: { type: string, max_length: 256, required: true,
                    label: Library,
                    description: "The library, by name or index (matching by UUID is deprecated)." }
      presentation_id: { type: string, max_length: 256, required: true,
                         label: Presentation,
                         description: "The presentation in the library, by UUID, name or index." }
    send: { method: GET, path: "/v1/library/{library_id}/{presentation_id}/trigger" }
    expect: { status: 204 }
    returns: ack
  library_trigger_cue:
    summary: "Triggers the specified cue of the specified presentation in the specified library."
    params:
      library_id: { type: string, max_length: 256, required: true,
                    label: Library,
                    description: "The library, by name or index (matching by UUID is deprecated)." }
      presentation_id: { type: string, max_length: 256, required: true,
                         label: Presentation,
                         description: "The presentation in the library, by UUID, name or index." }
      index: { type: int, min: 0, required: true,
               label: Cue index,
               description: "Position of the cue (slide) in the presentation, counted from 0, following its selected arrangement." }
    send: { method: GET, path: "/v1/library/{library_id}/{presentation_id}/{index}/trigger" }
    expect: { status: 204 }
    returns: ack
  look_get_current:
    summary: "Requests the details of the currently live audience look."
    send: { method: GET, path: "/v1/look/current" }
    expect: { status: 200, json_path: "$" }
    returns: value
  look_set_current:
    summary: "Sets the details of the currently live audience look. The body is JSON in the shape the API document gives for this operation."
    params:
      body: { type: json, required: true,
              label: Body,
              description: "JSON in the shape the API document gives for this operation; ProPresenter validates it." }
    send: { method: PUT, path: "/v1/look/current", body: "{body}", content_type: application/json }
    expect: { status: 204 }
    returns: ack
  look_get:
    summary: "Requests the details of the specified audience look."
    params:
      id: { type: string, max_length: 256, required: true,
            label: Audience look,
            description: "The audience look, by UUID, name or index." }
    send: { method: GET, path: "/v1/look/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
  look_put:
    summary: "Sets the details of the specified audience look. The body is JSON in the shape the API document gives for this operation."
    params:
      id: { type: string, max_length: 256, required: true,
            label: Audience look,
            description: "The audience look, by UUID, name or index." }
      body: { type: json, required: true,
              label: Body,
              description: "JSON in the shape the API document gives for this operation; ProPresenter validates it." }
    send: { method: PUT, path: "/v1/look/{id}", body: "{body}", content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value
  look_delete:
    summary: "Deletes the specified audience look from the saved looks."
    params:
      id: { type: string, max_length: 256, required: true,
            label: Audience look,
            description: "The audience look, by UUID, name or index." }
    send: { method: DELETE, path: "/v1/look/{id}" }
    expect: { status: 204 }
    returns: ack
  look_trigger:
    summary: "Triggers the specified audience look to make it the live/current look."
    params:
      id: { type: string, max_length: 256, required: true,
            label: Audience look,
            description: "The audience look, by UUID, name or index." }
    send: { method: GET, path: "/v1/look/{id}/trigger" }
    expect: { status: 204 }
    returns: ack
  look_get_all:
    summary: "Requests a list of all configured audience looks, except the live look."
    send: { method: GET, path: "/v1/looks" }
    expect: { status: 200, json_path: "$" }
    returns: value
  look_create:
    summary: "Creates a new audience look with the specified details. The body is JSON in the shape the API document gives for this operation."
    params:
      body: { type: json, required: true,
              label: Body,
              description: "JSON in the shape the API document gives for this operation; ProPresenter validates it." }
    send: { method: POST, path: "/v1/looks", body: "{body}", content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value
  macro_get:
    summary: "Requests the details of the specified macro."
    params:
      id: { type: string, max_length: 256, required: true,
            label: Macro,
            description: "The macro, by UUID, name or index." }
    send: { method: GET, path: "/v1/macro/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
  macro_set:
    summary: "Sets the details of the specified macro. The body is JSON in the shape the API document gives for this operation."
    params:
      id: { type: string, max_length: 256, required: true,
            label: Macro,
            description: "The macro, by UUID, name or index." }
