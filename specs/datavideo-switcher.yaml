commands:
  set_control:
    summary: "Set any writable control by its state path, such as keyers.1.opacity, then read it back (SET_CONTROL 1)"
    params:
      control: { type: string, max_length: 64, pattern: "^[a-z0-9_]+(\\.[a-z0-9_]+)*$", required: true, label: Control,
        description: "The control's state path, as the state lists it for this model, such as program, wipe.level, keyers.2.chroma.hue or inputs.3.freeze." }
      value: { type: string, max_length: 32, required: true, label: Value,
        description: "The value as text: a number within the control's range, true or false for an on/off control, or one of an enumerated control's names (or its number)." }
    returns: ack
  get_control:
    summary: "Read one control by its state path (GET_CONTROL 0)"
    params:
      control: { type: string, max_length: 64, pattern: "^[a-z0-9_]+(\\.[a-z0-9_]+)*$", required: true, label: Control,
        description: "The control's state path, such as status.software_version or memory.state." }
    returns: value
  set_program:
    summary: "Set the program (background) bus source and read it back"
    params:
      source: { type: int, min: 0, max: 30, required: true, label: Source,
        description: "The source code of the model's document: processor units 0 black, 1-12 inputs (1-4 on the SE-1200, 1-8 on the SE-4000), 17 matte, 18 pattern, 19 and 20 stills, 21 flex source (SE-3200); SE-2200 1-6 channels, 7 black, 8 background." }
    returns: ack
  set_preview:
    summary: "Set the preset (preview) bus source and read it back"
    params:
      source: { type: int, min: 0, max: 30, required: true, label: Source,
        description: "The source code, as for set_program." }
    returns: ack
  cut:
    summary: "Cut the preset source to program (M/E transition command 'goto end'; the SE-2200's CUT button)"
    returns: ack
  auto:
    summary: "Run the M/E transition at its duration (M/E transition command 'run'; the SE-2200's AUTO button)"
    returns: ack
  set_transition:
    summary: "Set the transition type and read it back"
    params:
      type: { type: enum, values: [mix, wipe, clip, dve], required: true, label: Type,
        description: "mix or wipe on every model; clip on the SE-3200 and SE-4000; dve (the transition DVE) on the SE-3200 only." }
    returns: ack
  set_transition_duration:
    summary: "Set a transition engine's duration in frames and read it back"
    params:
      engine: { type: enum, values: [me, dsk, ftb], default: me, label: Engine,
        description: "The M/E transition (auto), the DSK transition or fade to black." }
      frames: { type: int, min: 0, max: 9999, required: true, label: Frames, description: "The duration in frames." }
    returns: ack
  set_wipe_pattern:
    summary: "Select the wipe pattern and read it back (the SE-2200's wipe buttons)"
    params:
      pattern: { type: int, min: 1, max: 32, required: true, label: Pattern,
        description: "Wipe 1-32 on processor units, 1-17 on the SE-2200." }
    returns: ack
  set_transition_position:
    summary: "Move the transition like the T-bar: the wipe level 0-100, the transition completing at 100"
    params:
      position: { type: float, min: 0.0, max: 100.0, required: true, label: Position,
        description: "The transition's position in percent; at 100 the switcher completes it and sets the level back to 0." }
    returns: ack
  set_next_transition:
    summary: "Choose what the next transition takes: the background and each keyer"
    params:
      background: { type: bool, label: Background, description: "Whether the background is in the next transition." }
      key1: { type: bool, label: Key 1, description: "Whether keyer 1 is in the next transition." }
      key2: { type: bool, label: Key 2, description: "Whether keyer 2 is in the next transition." }
      key3: { type: bool, label: Key 3, description: "Whether keyer 3 is in the next transition (SE-3200, SE-4000)." }
      key4: { type: bool, label: Key 4, description: "Whether keyer 4 is in the next transition (SE-3200, SE-4000)." }
    returns: ack
  set_keyer:
    summary: "Put a keyer on program or take it off"
    params:
      keyer: { type: int, min: 1, max: 4, required: true, label: Keyer, description: "The keyer, 1-2 on the SE-1200, 1-4 otherwise." }
      'on': { type: bool, required: true, label: On air, description: "On keys it onto program." }
    returns: ack
  set_keyer_sources:
    summary: "Set a keyer's key source and split (fill) source"
    params:
      keyer: { type: int, min: 1, max: 4, required: true, label: Keyer, description: "The keyer, 1-2 on the SE-1200, 1-4 otherwise." }
      key_source: { type: int, min: 0, max: 30, label: Key source, description: "The key source (and video in luma mode), a source code as for set_program." }
      split_source: { type: int, min: 0, max: 30, label: Split source, description: "The video source in split mode, a source code as for set_program." }
    returns: ack
  set_dsk:
    summary: "Put a downstream keyer on program or take it off, at once"
    params:
      dsk: { type: int, min: 1, max: 2, required: true, label: DSK, description: "DSK 1 or 2." }
      'on': { type: bool, required: true, label: On air, description: "On keys it onto program." }
    returns: ack
  dsk_auto:
    summary: "Run the DSK transition for the DSKs it takes (dsks.N.in_transition)"
    returns: ack
  fade_to_black:
    summary: "Run fade to black, or back from black (FTB enabled, then the FTB transition 'run'; the SE-2200's FTB button)"
    returns: ack
  set_aux:
    summary: "Route a source to an SDI aux output and read it back"
    params:
      aux: { type: int, min: 1, max: 4, required: true, label: Aux, description: "The aux output, 1-4." }
      source: { type: int, min: 0, max: 30, required: true, label: Source,
        description: "0 black, 1-12 inputs, 17 matte, then the model's table: SE-3200 18 flex source, 19-20 stills, 21 program, 22 preview, 23-24 program and preview with DSK 1; SE-4000 18 pattern, 21 flex source to 30 (multiviews, clean feeds)." }
    returns: ack
  set_input_freeze:
    summary: "Freeze an input, or switch it to a still or clip, and read it back"
    params:
      input: { type: int, min: 1, max: 12, required: true, label: Input, description: "The physical input, from 1." }
      mode: { type: enum, values: [live, freeze, still, clip, capture], required: true, label: Mode,
        description: "live, freeze, still or clip (capture as the documents list it)." }
    returns: ack
  load_memory:
    summary: "Load a user memory (memory select, then the load command)"
    params:
      memory: { type: int, min: 0, max: 1000, required: true, label: Memory,
        description: "User memory 0-999 (0 also loads at power-up); 1000 is the system memory." }
    returns: ack
  store_memory:
    summary: "Store the current state to a user memory"
    params:
      memory: { type: int, min: 0, max: 1000, required: true, label: Memory, description: "User memory 0-999." }
    returns: ack
  delete_memory:
    summary: "Delete a user memory"
    params:
      memory: { type: int, min: 0, max: 1000, required: true, label: Memory, description: "User memory 0-999." }
    returns: ack
  load_still:
    summary: "Load a still from the flash disk into a still buffer"
    params:
      still: { type: int, min: 0, max: 999, required: true, label: Still, description: "The still on the flash disk (0-100 on the SE-1200)." }
      buffer: { type: int, min: 0, max: 7, required: true, label: Buffer, description: "The still buffer, 0-7." }
    returns: ack
  store_still:
    summary: "Store a still buffer to the flash disk"
    params:
      still: { type: int, min: 0, max: 999, required: true, label: Still, description: "The still number to store as." }
      buffer: { type: int, min: 0, max: 7, required: true, label: Buffer, description: "The still buffer, 0-7." }
    returns: ack
  grab_still:
    summary: "Grab the program output into a still buffer"
    params:
      buffer: { type: int, min: 0, max: 7, required: true, label: Buffer, description: "The still buffer, 0-7." }
    returns: ack
  delete_still:
    summary: "Delete a still from the flash disk"
    params:
      still: { type: int, min: 0, max: 999, required: true, label: Still, description: "The still number." }
    returns: ack
  chroma_key_auto:
    summary: "Run a keyer's automatic chroma key setup (CHROMA_KEYER_AUTO 20), then read its chroma controls"
    params:
      keyer: { type: int, min: 1, max: 4, required: true, label: Keyer, description: "The keyer, 1-4." }
    returns: ack
  get_input_name:
    summary: "Read an input's multiviewer name (GET_INPUT_NAME 9) into inputs.N.name"
    params:
      input: { type: int, min: 1, max: 12, required: true, label: Input, description: "The input, from 1." }
    returns: value
  get_file_name:
    summary: "Read the name of a stored user memory, still, clip, logo or animated logo (GET_FILE_NAME 11)"
    params:
      type: { type: enum, values: [memory, still, clip, logo, animated_logo], required: true, label: Type,
        description: "The kind of file (the SE-1200 has memories and stills)." }
      number: { type: int, min: 0, max: 1000, required: true, label: Number, description: "The file's number." }
    returns: value
  set_file_name:
    summary: "Name a stored user memory, still, clip, logo or animated logo (SET_FILE_NAME 12) and read it back"
    params:
      type: { type: enum, values: [memory, still, clip, logo, animated_logo], required: true, label: Type,
        description: "The kind of file (the SE-1200 has memories and stills)." }
      number: { type: int, min: 0, max: 1000, required: true, label: Number, description: "The file's number." }
      name: { type: string, max_length: 15, required: true, label: Name, description: "The new name, up to 15 characters." }
    returns: ack
  get_mini_pic:
    summary: "Read a mini picture (thumbnail) of a stored file (GET_MINI_PIC 8): 96 x 54 pixels, 32 bits each"
    params:
      number: { type: int, min: 0, max: 1000, required: true, label: Number, description: "The mini picture's number." }
    returns: value
  export_file:
    summary: "Copy a stored user memory, still, clip frame, logo or animated logo frame from the switcher to a host file"
    params:
      type: { type: enum, values: [memory, still, clip, logo, animated_logo], required: true, label: Type,
        description: "The kind of file." }
      number: { type: int, min: 0, max: 16777215, required: true, label: Number,
        description: "The file's number; for clips and animated logos, bits 9-0 the clip or logo and bits 23-16 the frame." }
      path: { type: string, max_length: 1024, required: true, label: Host file, description: "The file to write on the host running the core." }
    returns: value
  import_file:
    summary: "Copy a host file to a user memory, still, clip frame, logo or animated logo frame on the switcher"
    params:
      type: { type: enum, values: [memory, still, clip, logo, animated_logo], required: true, label: Type,
        description: "The kind of file." }
      number: { type: int, min: 0, max: 16777215, required: true, label: Number,
        description: "The file's number; for clips and animated logos, bits 9-0 the clip or logo and bits 23-16 the frame." }
      path: { type: string, max_length: 1024, required: true, label: Host file, description: "A file on the host, as export_file writes it." }
    returns: value
  get_status:
    summary: "Read the SE-2200's status (22H): buses, wipe, speed, toggles and T-bar"
    returns: value
  press:
    summary: "Press one of the SE-2200's panel buttons (20H)"
    params:
      button:
        type: enum
        values: [wipe_1, wipe_2, wipe_3, wipe_4, wipe_5, wipe_6, wipe_7, wipe_8, wipe_9, wipe_10, wipe_11, wipe_12, wipe_13,
          wipe_14, wipe_15, wipe_16, wipe_17, f1, f2, f3, f4, pip_1_program, pip_2_program, dsk_program, pip_1_preview,
          pip_2_preview, dsk_preview, multiscreen, program_black, program_1, program_2, program_3, program_4, program_5,
          program_6, program_background, preset_black, preset_1, preset_2, preset_3, preset_4, preset_5, preset_6,
          preset_background, freeze, mix, wipe, cut, ftb, auto, timer, audio_fixed, audio_follow_video, border, logo_1,
          logo_2, clock, speed_1, speed_2, speed_3]
        required: true
        label: Button
        description: "The button, as Table 6 names it; toggles (logos, clock, timer, functions, PinPs, DSK, freeze, multiscreen) change state on each press."
    returns: ack
  set_transition_speed:
    summary: "Select the SE-2200's transition speed 1-3 (5EH-60H)"
    params:
      speed: { type: int, min: 1, max: 3, required: true, label: Speed, description: "Speed 1, 2 or 3, the AUTO transition's rate." }
    returns: ack
  set_t_bar:
    summary: "Set the SE-2200's T-bar position (21H)"
    params:
      position: { type: int, min: 0, max: 65535, required: true, label: Position,
        description: "The T-bar position as the status reports it (a 16-bit value; Datavideo gives no range)." }
    returns: ack
  set_feature:
    summary: "Turn an SE-2200 toggle on or off: read the status, press its button only if it differs, read again"
    params:
      feature:
        type: enum
        values: [logo_1, logo_2, border, f1, f2, f3, f4, pip_1_program, pip_2_program, dsk_program, pip_1_preview, pip_2_preview,
          dsk_preview, clock, timer, audio_fixed, audio_follow_video]
        required: true
        label: Feature
        description: "A toggle the status reports."
      'on': { type: bool, required: true, label: 'On', description: "Whether the feature should be on." }
    returns: ack
  get_network:
    summary: "Read the DVIP network settings (UDP ETH_REQ 00H) into dvip.network"
    returns: value
  get_identity:
    summary: "Read the DVIP firmware revision, vendor and product IDs, model name and versions (UDP 01H, 40H-42H)"
    returns: value
  get_presets:
    summary: "Read the DVIP preset count and every preset's name (UDP 43H, 44H)"
    returns: value
  recall_preset:
    summary: "Recall a DVIP preset (UDP RECALL_PRESET 45H)"
    params:
      preset: { type: int, min: 1, max: 255, required: true, label: Preset, description: "The preset, from 1 to the count get_presets reads." }
    returns: ack
  set_dhcp:
    summary: "Turn DHCP on or off (UDP SET_DHCPMODE 02H)"
    params:
      enabled: { type: bool, required: true, label: DHCP, description: "On takes an address from DHCP; off keeps the fixed address." }
    returns: ack
  set_ip_address:
    summary: "Set the fixed address and gateway (UDP SET_IPADR 03H)"
    params:
      address: { type: string, max_length: 15, pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$", required: true, label: Address, description: "The new IPv4 address." }
      gateway: { type: string, max_length: 15, pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$", required: true, label: Gateway, description: "The gateway's IPv4 address." }
    returns: ack
  set_netmask:
    summary: "Set the network mask (UDP SET_NETMASK 0BH)"
    params:
      netmask: { type: string, max_length: 15, pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$", required: true, label: Netmask, description: "The mask, such as 255.255.255.0." }
    returns: ack
  set_gateway:
    summary: "Set the gateway (UDP SET_GATEWAY 0CH)"
    params:
      gateway: { type: string, max_length: 15, pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$", required: true, label: Gateway, description: "The gateway's IPv4 address." }
    returns: ack
  set_dns:
    summary: "Set the primary and/or secondary DNS server (UDP SET_PRIDNS 0DH, SET_SECDNS 0EH)"
    params:
      primary: { type: string, max_length: 15, pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$", label: Primary DNS, description: "The primary DNS server's IPv4 address." }
      secondary: { type: string, max_length: 15, pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$", label: Secondary DNS, description: "The secondary DNS server's IPv4 address." }
    returns: ack
  set_host_name:
    summary: "Set the DHCP host name (UDP SET_DHCPNAME 09H)"
    params:
      name: { type: string, max_length: 15, pattern: "^[!-~]{1,15}$", required: true, label: Host name, description: "Up to 15 printable ASCII characters." }
    returns: ack
  reboot:
    summary: "Restart the DVIP device (UDP RESET 04H)"
    returns: ack

