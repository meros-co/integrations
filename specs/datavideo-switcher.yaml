spec: 1
id: datavideo-switcher
name: Datavideo switchers (DVIP)
vendor: Datavideo
category: switcher
implementation: native
reason: >
  Datavideo's processor-unit switchers speak binary: every packet is its size, a command and 32-bit little-endian
  ints or floats, control IDs packing a section, sub-section, input and control number, read and written with
  GET_CONTROL and SET_CONTROL on a command port, while a second, real-time port sends the whole state in its
  first packet and every change after it, one packet a video field, each of which the controller must answer. A
  free pair of the four controller port pairs is asked for on a third port first. The SE-2200 takes
  checksummed blocks of panel buttons and returns a status bit field, and every DVIP device answers binary UDP
  management packets of a length, a type and a command.

source:
  - title: "Datavideo DVIP Control Operation Guide, Version 1.92 (2024-01-24)"
    author: "Datavideo"
    url: "https://datavideo.com/us/protocol/192/datavideo-se-650-dvip-control-protocol"
    note: >
      Datavideo's own document, the 'DVIP Ethernet Control Operation Guide V1.92_20240124' download of the
      SE-650, SE-1200MU, SE-3200, HS-3200 and HS-1300 DVIP protocol pages. Nothing here is quoted from it.
      TCP and UDP port 5002, DHCP by default (§2); the TCP packet, a 2-byte big-endian length counting the whole
      packet and up to 512 bytes of product-specific command data (§3.1, §3.2); broadcast (type 80H) and UDP
      (type 81H) packets of a length, type, command and parameters (§3.3, §3.5); the UDP commands: network
      information ETH_REQ 00H (DHCP, host name, MAC, address, mask, gateway, DNS, connections), firmware
      revision FWVER_REQ 01H, DHCP mode SET_DHCPMODE 02H, address and gateway SET_IPADR 03H, reboot RESET 04H,
      host name SET_DHCPNAME 09H, mask SET_NETMASK 0BH, gateway SET_GATEWAY 0CH, DNS SET_PRIDNS 0DH and
      SET_SECDNS 0EH, vendor and product ID GET_MODEL 40H, model name GET_MODEL_NAME 41H, versions GET_VERSION
      42H, preset count GET_PRESET_COUNT 43H, preset names GET_PRESET_NAME 44H and RECALL_PRESET 45H, each
      answered ACK 06H or NACK 15H (§3.6, Appendix B); the revision history's product IDs (HS-1300, SE-500MU-4K,
      SE-4000 and HS-4000).
  - title: "Datavideo DVIP Protocol Short Overview, Version E1 (2026-08-17)"
    author: "Datavideo"
    url: "https://datavideo.com/us/protocol/195/datavideo-hs-1300-dvip-control-protocol"
    note: >
      The packet length counts the 2 header bytes; some SE switchers also take control on 5004, 5006 and 5008
      and a real-time port, described per product; keep the TCP connection open and reconnect when it drops.
  - title: "Datavideo SE-3200 & HS-3200 Ethernet Control Protocol, E2 (2023-07-04)"
    author: "Datavideo"
    url: "https://datavideo.com/us/protocol/47/datavideo-hs-3200-ethernet-control-protocol"
    note: >
      The command and real-time channels, ports 5001-5008 and the request channel 5009 (§1.4, §1.5, §2.1.1);
      packets of 32-bit words, size first (§2.1.2.1); OK and ERROR replies (§2.1.2.2); the commands GET_CONTROL
      0 to CHROMA_KEYER_AUTO 20 (§2.2, §2.3); the real-time protocol: null packets, parameter/value packets, the
      first packet holding the whole state, every packet answered (§3); the control sections and every control
      with its type and range (§4.1.1-§4.1.16); worked byte examples, little-endian (§5.2, §5.3).
  - title: "Datavideo SE-1200 Ethernet Control Protocol, E1 (2019-07-10)"
    author: "Datavideo"
    url: "https://datavideo.com/us/protocol/57/datavideo-se-1200-ethernet-control-protocol"
    note: >
      The SE-1200MU's document, the same protocol with its own control numbers: two keyers, a single DVE tile on
      the flex source's DVE 1 controls, HD standards, DVI and analog outputs, a streamer size (§4.1). Port pair 1
      is the RMC-260 control panel's (§1.4). Datavideo's support article 'SE-1200MU Ethernet Control Protocol
      Document' (https://datavideo.com/us/faq/360058611993) files it under 'SE-1200MU & HS-1300'.
  - title: "Datavideo SE-4000 Ethernet Control Protocol, E1 (2023-05-23)"
    author: "Datavideo"
    url: "https://datavideo.com/us/protocol/18/datavideo-se-4000-ethernet-control-protocol"
    note: >
      The SE-3200 document's protocol and numbering with 4K and HD standards (§4.1.2.1), inputs 1-8 on the
      buses, no flex source and no DVE transition, PinP borders off or normal only, more aux sources (§4.1.9.1).
  - title: "Datavideo SE-1200 RS-232 Control Protocol, E1 (2019-07-10)"
    author: "Datavideo"
    url: "https://datavideo.com/us/protocol/58/datavideo-se-1200-rs-232-control-protocol"
    note: >
      RS-232, 19200 bit/s, 8 data bits, odd parity, 1 stop bit, no break character needed; GVG100-style
      messages of a byte count, an effects address and a command; writes answered 01 80 (accepted) or 01 40
      (error); Get & Set Control Commands 70/F0 wrapping the Ethernet protocol's control IDs, the get answered
      by an F0 message of the values only; pushbutton/lamp C6/C7 and select FB, menu select DE, all stop F2.
  - title: "Datavideo SE-4000 RS-232 Control Protocol, E1 (2023-05-02)"
    author: "Datavideo"
    url: "https://datavideo.com/us/protocol/19/datavideo-se-4000-rs-232-control-protocol"
    note: >
      The same serial protocol for the SE-4000 at 19200 8O1, the status byte's accepted, protocol error and
      ignored bits (§3.3), messages of at most 127 bytes; its test script (in the download) confirms 19200 and
      odd parity.
  - title: "Datavideo SE-3200 RS-232 Control Protocol, E1 (2019-07-09)"
    author: "Datavideo"
    url: "https://datavideo.com/us/protocol/51/datavideo-se-3200-rs-232-control-protocol"
    note: >
      States that the SE-3200's RS-232 port is taken by its keyboard and the HS-3200 has none, so both are
      controlled over Ethernet only; its supplement numbers the input controls as the SE-1200 does.
  - title: "SE-2200 DVIP Serial (RS-232/422) Control Protocol, Rev. 1.0 (2015-03-01)"
    author: "Datavideo"
    url: "https://datavideo.com/us/faq/360056727974"
    note: >
      Linked from Datavideo's support article 'SE-2200 DVIP RS-232/RS-422 Document' (a Dropbox file Datavideo
      shares). 115200 bit/s 8N1, RS-232 or RS-422 on a 9-pin D-sub (§1.1, §1.3); blocks of AAH, a byte count,
      effect address FFH, command 20H with a parameter, and a checksum, answered by a count and a status
      (20H ignored, 40H protocol error, 80H OK) (§1.4); the button table (Table 6); T-bar 21H (§1.4.3); status
      22H answered by seven status bytes (§1.4.4, §1.4.5); the menu settings and PC CTRL remote mode (§2).
  - title: "SE-1200 MU RS-232 Commands Protocol Guide for the RMC-260 (2017-12-04)"
    author: "Datavideo"
    url: "https://datavideo.com/us/faq/360058612373"
    note: "An earlier SE-1200MU serial document giving 57600 bit/s, where the 2019 document gives 19200."

settings:
  controller: { type: enum, values: [auto, "1", "2", "3", "4"], default: auto, label: Controller ports,
    description: "Which of the four controller port pairs to use (1: real-time 5001 and command 5002, up to 4: 5007 and 5008); auto asks port 5009 for a free pair. On the SE-1200MU pair 1 is the RMC-260 panel's." }
  poll_ms: { type: int, min: 100, max: 3600000, default: 1000, label: Read interval,
    description: "Milliseconds between status reads where nothing is pushed: on the SE-2200, and DVIP network reads on the SE-650." }
  dvip_port: { type: int, min: 1, max: 65535, default: 5002, label: DVIP UDP port,
    description: "The UDP port of DVIP's management commands (network settings, identity, presets), 5002." }

ports:
  - { port: 5009, protocol: tcp, role: control, when: "processor-unit models, controller auto", note: "connection request channel: answers with a free real-time port" }
  - { port: 5002, protocol: tcp, role: control, when: "processor-unit models, controller 1; the SE-2200's DVIP board", note: "command port 1 (and the real-time port 5001); on the SE-2200 the DVIP serial protocol with DVIP's length header" }
  - { port: 5001, protocol: tcp, role: control, when: "processor-unit models, controller 1", note: "real-time port 1: the state pushed every field" }
  - { port: 5004, protocol: tcp, role: control, when: "processor-unit models, controller 2", note: "command port 2 (real-time 5003)" }
  - { port: 5003, protocol: tcp, role: control, when: "processor-unit models, controller 2", note: "real-time port 2" }
  - { port: 5006, protocol: tcp, role: control, when: "processor-unit models, controller 3", note: "command port 3 (real-time 5005)" }
  - { port: 5005, protocol: tcp, role: control, when: "processor-unit models, controller 3", note: "real-time port 3" }
  - { port: 5008, protocol: tcp, role: control, when: "processor-unit models, controller 4", note: "command port 4 (real-time 5007)" }
  - { port: 5007, protocol: tcp, role: control, when: "processor-unit models, controller 4", note: "real-time port 4" }
  - { port: 5002, protocol: udp, role: control, setting: dvip_port, when: "DVIP management commands, every model", note: "DVIP UDP packets (type 81H) to the switcher" }

