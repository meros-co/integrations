quirks:
  - models: [se-1200mu, hs-1300, se-3200, hs-3200, se-4000, hs-4000, se-2200]
    severity: critical
    text: >
      load_memory replaces the switcher's whole state (user memory 1000 is the system memory, standard included),
      recall_preset recalls a DVIP preset, store_memory, store_still and import_file overwrite what is stored, and
      delete_memory and delete_still remove it; none can be undone live.
  - models: [all]
    severity: critical
    text: >
      set_ip_address, set_netmask, set_gateway, set_dhcp and reboot change or drop the switcher's network
      connection; the device must then be opened at its new address.
  - models: [se-1200mu, hs-1300, se-3200, hs-3200, se-4000, hs-4000]
    severity: warning
    text: >
      The switcher takes four controllers, each on a pair of ports (real-time 5001/5003/5005/5007, command one
      higher). With controller auto, port 5009 is asked for a free pair; when none is free the device is
      reported disconnected and tried again. On the SE-1200MU pair 1 is normally the RMC-260 panel's. Using a
      real-time port for commands works at first and then falls out of step, so commands always go to the even
      port.
  - models: [se-1200mu, hs-1300, se-3200, hs-3200, se-4000, hs-4000]
    severity: info
    text: >
      Over Ethernet the real-time port pushes the state: its first packet is the whole state against all zeros
      (a control not in it is zero) and later packets carry changes, one packet a field, each answered with a
      null packet as the protocol requires. Every control is in state under the path set_control and get_control
      take; controls the documents mark unused or without function, and the SE-3200's undescribed streamer, clip,
      logo and animated logo sections (12-18), are left out. Over RS-232 nothing is pushed: program, preview,
      keyers, DSKs, FTB, transition states and tallies are read every poll_ms, and the other controls 30 at a
      time in turn. Opened for commands only, the real-time port is not opened and nothing is polled.
  - models: [se-1200mu, hs-1300, se-3200, hs-3200, se-4000, hs-4000]
    severity: info
    text: >
      Sources are the documents' codes, which differ by model and by bus (program, keyers, aux, multiviewer),
      and the documents' own tables disagree in places (the SE-4000's keyer table lists inputs 1-8 and no
      stills; its aux table adds pattern, clean feeds and multiviews from 18), so they are passed through as
      numbers rather than named.
  - models: [se-3200, hs-3200, se-4000, hs-4000]
    severity: info
    text: >
      The documents number the bus tallies 30-36 and then 23-30 again; they are taken as running on from 30 to 44
      (free space). The SE-3200 RS-232 document's input numbering (freeze mode 5) is the SE-1200's; the Ethernet
      document's (freeze mode 6, input standard 4), which its own worked example confirms, is used.
  - models: [se-1200mu, hs-1300, se-3200, hs-3200, se-4000, hs-4000]
    severity: info
    text: >
      Not offered: software upgrade (OPEN_SOFTWARE_FILE, INSTALL_SOFTWARE), which Datavideo's tools do;
      SET_INPUT_NAME, whose documented packet carries no input number; STREAMER_CONTROL and RECORDER_CONTROL,
      which the documents give no commands for; the menu command 21, undescribed. The documents give no types or
      ranges for most audio section, GPI, output mode and system preference controls, so those are plain numbers
      (gains in dB and delays in ms as for the input section's). Key invert is typed float in the documents and
      written as 1.0 or 0.0. memory.flags is passed as one number, though the documents also describe ten flags
      'one bit per word'.
  - models: [se-1200mu, hs-1300, se-3200, hs-3200, se-4000, hs-4000]
    severity: info
    text: >
      Names are read and written as UTF-16 little-endian, which the documents call Unicode; input names are
      asked for by input number from 0. export_file reads the file in 1024-byte chunks until a shorter one
      arrives and import_file writes 1024-byte chunks numbered from 0, sizing each STORE_FILE_DATA packet by its
      true length (the document's size formula is 4 bytes short), then signals FILE_EVENT; the documents do not
      describe the files' contents. These, get_mini_pic, chroma_key_auto and the file names are Ethernet only.
  - models: [hs-1300, hs-4000]
    severity: warning
    text: >
      Inferred: Datavideo files the SE-1200MU Ethernet document under the HS-1300, and the HS-4000 is assumed to
      take the SE-4000's protocol as the HS-3200 takes the SE-3200's; neither document names them.
  - models: [se-2200]
    severity: warning
    text: >
      The SE-2200 obeys only in remote mode: enable the DVIP board under MENU > REMOTE CONTROL and press PC CTRL;
      otherwise commands are answered 'ignored' (20H). Over TCP 5002 each block is sent with DVIP's 2-byte length
      header and replies are read the same way, which Datavideo's serial document does not describe. Its status
      lists PinP 1 preview twice; the second (byte 4 bit 4) is taken as PinP 2 preview. The T-bar position's
      range is not given. Wipe and speed buttons select at once, the toggles change on each press; set_feature
      reads the status and presses only when needed.
  - models: [all]
    severity: info
    text: >
      DVIP management packets are sent with a length counting the whole packet, as the guide's replies do (its
      formula can be read as leaving out the type byte); vendor and product IDs are read big-endian. With the
      device opened for state, its network settings, identity and presets are read on starting; replies come to
      the sender's port.
  - models: [se-650]
    severity: info
    text: >
      Only DVIP's management commands are documented for the SE-650 (and the HS-1300's DVIP page gives the same
      guide): network settings, identity and presets. Its switching commands over DVIP TCP are not public, so
      they are not offered; liveness is the network read every poll_ms.
