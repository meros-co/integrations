spec: 1
id: vaddio-roboshot
name: Vaddio RoboSHOT PTZ cameras (Telnet API)
vendor: Vaddio
category: camera

# Vaddio's RoboSHOT cameras take a text command line over Telnet on TCP 23:
# the administrator logs in at the login: and Password: prompts, each command
# is a line, and the camera answers with any data lines, OK, and its ">"
# prompt. Each answer is read up to that prompt. Telnet is off by default on
# firmware from mid-December 2019 on and is turned on on the Security page of
# the camera's web interface.

source:
  - title: Complete Manual for RoboSHOT 12E NDI and RoboSHOT 30E NDI High-Performance PTZ Cameras (411-0038-30 Rev. B)
    author: Legrand AV (Vaddio)
    url: https://inquirecontent2.ingrammicro.com/User-Manual/1064158385.pdf
    note: >
      Manufacturer manual, November 2020 (a distributor's copy of the document Vaddio publishes at
      legrandav.com), read 2026-10-27. Telnet Command Reference p.49-63: port 23, administrator
      login, Telnet off by default after mid-December 2019, ">" prompt; camera home, pan and tilt
      (left/right/up/down with speed 1-24 and 1-20, stop, get, set in degrees, with a speed), zoom
      (in/out speed 1-7, stop, get, set as a float with a speed), ptz-position with no_wait, focus
      (near/far speed 1-8, stop, mode get/auto/manual), preset recall/store 1-16 with tri-sync 1-24
      and save-ccu, ccu scene, ccu get (iris 0-13, gain 1-11) and ccu set, led, standby, network
      settings get, network ping, system reboot, system factory-reset, version, history, help, exit.
  - title: Complete Manual for RoboSHOT 20 UHD and RoboSHOT 40 UHD Professional PTZ Cameras (411-0028-30 Rev. C)
    author: Legrand AV (Vaddio)
    url: https://zoro.com/static/cms/enhanced_pdf/AB%20Distributing%20Inc_247e51a69d544e9d6c99ee32ed6639e7xxc73b5e.pdf
    note: >
      Manufacturer manual, January 2019 (a distributor's copy), read 2026-10-27. Telnet Command
      Reference p.56-71: as above without ptz-position and with zoom set as an integer, iris and gain
      0-11, wide_dynamic_range not on the 20 UHD; video mute get/on/off/toggle (answer "mute: off");
      streaming settings get (IP Custom_Frame_Rate, Custom_Resolution, Enabled, MTU, Port,
      Preset_Quality, Preset_Resolution, Protocol, URL, Video_Mode); streaming ip enable
      get/on/off/toggle on the 40 UHD only (answer "enabled: true", the prompt shown before OK).
  - title: Complete Manual for RoboSHOT HD-SDI and RoboSHOT SDI cameras (411-0027-30 Rev. C)
    author: Legrand AV (Vaddio)
    url: https://zoro.com/static/cms/enhanced_pdf/AB%20Distributing%20Inc_fb676dc8721454e1b060f336dd04ccfbxx569bdf.pdf
    note: >
      Manufacturer manual, May 2019 (a distributor's copy), read 2026-10-27, covering the RoboSHOT 12
      and 30 HD-SDI and 12E and 30E SDI. Telnet Command Reference p.61-75: the base commands with zoom
      set as a float, iris and gain 0-11, gamma -64 to 64, streaming ip enable and streaming settings
      get.
  - title: Complete Manual for RoboSHOT CAT-5 Professional PTZ Camera Systems (411-0025-30 Rev. D)
    author: Legrand AV (Vaddio)
    url: https://inquirecontent2.ingrammicro.com/User-Manual/1062675940.pdf
    note: >
      Manufacturer manual, May 2019 (a distributor's copy), read 2026-10-27, covering the RoboSHOT
      QCCU, QUSB, QMini, QDVI, QSR and AVBMP systems. Telnet Command Reference p.89-101: the base
      commands with zoom set as a float, iris and gain 0-11, no gamma; with an AV Bridge MATRIX PRO
      the session is with the bridge, whose commands name camera 1-3.
  - title: Complete Manual for the RoboSHOT IW Architectural PTZ Conferencing Camera (411-0016-30 Rev. B)
    author: Legrand AV (Vaddio)
    url: https://inquirecontent2.ingrammicro.com/User-Manual/1062713017.pdf
    note: >
      Manufacturer manual, September 2018 (a distributor's copy), read 2026-10-27. Telnet Command
      Reference p.39-55: the base commands with zoom set as an integer, preset store without tri-sync,
      no gamma; camera glass mode get/set/toggle and glass state get/set/toggle (answer "frosted"),
      camera resolution get/set (answer "720p/59.94" in quotes) with the eleven listed formats,
      camera recalibrate, streaming settings get.
  - title: companion-module-vaddio-ptz (MIT licence)
    author: Bitfocus contributors
    url: https://github.com/bitfocus/companion-module-vaddio-ptz
    note: >
      Read for corroboration only (src/index.js), retrieved 2026-10-27: the login answers a
      "login:" prompt (either case) with the user name and a "Password:" prompt with the password,
      the camera then greets "Welcome <user>" and shows ">", and the default account is admin.
      No code taken.

transport:
  type: line-tcp
  port: 23
  framing: terminated
  terminator: crlf
  encoding: ascii
  # An answer is everything up to the ">" prompt: the echoed command, any
  # data lines and OK.
  reply_framing: terminated
  reply_terminators: [">"]
  reply_match: '>$'
  timeout_ms: 15000
  probe: "version"

on_connect:
  - { after_prompt: "ogin:", send: "{settings.username}" }
  - { after_prompt: "assword:", send: "{settings.password}", await_reply: true }

settings:
  username: { type: string, default: admin, label: Username,
              description: "The camera's administrator account, which Telnet sessions need." }
  password: { type: string, secret: true, default: password, label: Password,
              description: "The administrator password set on the camera's web interface." }

ports:
  - { port: 23, protocol: tcp, role: control, note: "Telnet; turned on on the camera's Security page" }

