spec: 1
id: etc-paradigm
name: ETC Paradigm architectural control (PSAP)
vendor: ETC
category: lighting

source:
  - title: ETC Configuration Guide, Paradigm Serial Access Protocol (PSAP)
    author: Electronic Theatre Controls
    url: https://www.etcconnect.com/workarea/DownloadAsset.aspx?id=10737460789
    note: >
      7180M1250-4.0.0 Rev B, released 2019-07 (retrieved 2026-10-02), 7 pages; PSAP software
      version 4.0 and later. LightDesigner's RS232 Serial Config, UDP Serial Config and ACN Serial
      Config on the processor; UDP Input UDP Port defaults to 0 with Input Handler [None], ETC
      recommends 4703-4727, "The P-ACP will automatically send any response to the sending
      device's output UDP port"; no more than 512 bytes per packet; Input Handler PSAP 4.0 with
      End of Message Char CR (default), CR+LF or LF, also ending everything the P-ACP sends;
      UString 1-20. Conventions: names case sensitive and matching LightDesigner, avoiding commas
      and colons; levels 0-255 or 0-100 with %; priorities 1-200; [ ] optional clauses; fade times
      in x.y seconds and needing a space name; ? or help lists the commands. Command tables:
      chan int/ras/low/tog/min/max, grp int/ras/low/tog, pst act[:priority]/dact/tog[:priority]/
      acth[:priority]/dacth/togh[:priority]/rec, seq start[:priority]/stop/pause/resume/ras/low/
      rate, spc off/ras/low/master, wall open/close/tog, macro on/off/tog/cancel, ovr
      enab/disab/tog; status commands chan/pst/grp/macro/wall/seq/ovr get with their returned
      strings (space name always included, levels always 0-255); PSAP triggers sending the same
      strings as objects change (LightDesigner user access Advanced).
  - title: Bitfocus Companion module companion-module-etc-paradigm (community, MIT)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-etc-paradigm
    note: >
      Read for corroboration only (MIT at the top level). It drives the processor's web interface
      instead and notes that "Support using the UDP Serial connection could not be implemented in
      testing"; nothing in this spec comes from it.

# PSAP text over UDP to the processor's Input UDP Port (LightDesigner, UDP Serial Config; 0 =
# disabled by default, ETC recommends 4703-4727), each command ended by CR (the default End of
# Message Char). Responses go back to the sending port. Changes reported by PSAP triggers go
# where LightDesigner's trigger sends them; set feedback_port to receive them on a fixed local
# port (shared, routed by source address). Action commands have no documented reply.
transport:
  type: line-udp
  port: 4703
  terminator: cr
  reply: to-source
  timeout_ms: 1000
  listen_port: { setting: feedback_port }

settings:
  feedback_port: { type: int, min: 1, max: 65535 }

ports:
  - { port: 4703, protocol: udp, role: control }
  - { port: null, protocol: udp, role: feedback, listener: core, setting: feedback_port, note: "where the device sends its feedback" }

models:
  - id: p-acp
    name: Paradigm Architectural Control Processor (P-ACP)
    supports: [
      channel_set, channel_set_in_space, channel_set_in_space_fade, channel_set_percent,
      channel_set_percent_in_space, channel_set_percent_in_space_fade, channel_raise,
      channel_raise_in_space, channel_raise_in_space_fade, channel_lower, channel_lower_in_space,
      channel_lower_in_space_fade, channel_toggle, channel_toggle_in_space,
      channel_toggle_in_space_fade, channel_set_minimum, channel_set_minimum_in_space,
      channel_set_maximum, channel_set_maximum_in_space, group_set, group_set_in_space,
      group_set_in_space_fade, group_set_percent, group_set_percent_in_space,
      group_set_percent_in_space_fade, group_raise, group_raise_in_space,
      group_raise_in_space_fade, group_lower, group_lower_in_space, group_lower_in_space_fade,
      group_toggle, group_toggle_in_space, group_toggle_in_space_fade, preset_activate,
      preset_activate_in_space, preset_activate_in_space_fade, preset_activate_priority,
      preset_activate_priority_in_space, preset_activate_priority_in_space_fade, preset_toggle,
      preset_toggle_in_space, preset_toggle_in_space_fade, preset_toggle_priority,
      preset_toggle_priority_in_space, preset_toggle_priority_in_space_fade, preset_activate_htp,
      preset_activate_htp_in_space, preset_activate_htp_in_space_fade,
      preset_activate_htp_priority, preset_activate_htp_priority_in_space,
      preset_activate_htp_priority_in_space_fade, preset_toggle_htp, preset_toggle_htp_in_space,
      preset_toggle_htp_in_space_fade, preset_toggle_htp_priority,
      preset_toggle_htp_priority_in_space, preset_toggle_htp_priority_in_space_fade,
      preset_deactivate, preset_deactivate_in_space, preset_deactivate_in_space_fade,
      preset_deactivate_htp, preset_deactivate_htp_in_space, preset_deactivate_htp_in_space_fade,
      preset_record, preset_record_in_space, sequence_start, sequence_start_in_space,
      sequence_start_priority, sequence_start_priority_in_space, sequence_stop,
      sequence_stop_in_space, sequence_pause, sequence_resume, sequence_raise, sequence_lower,
      sequence_rate, space_off, space_off_fade, space_raise, space_raise_fade, space_lower,
      space_lower_fade, space_master, space_master_fade, wall_open, wall_open_in_space, wall_close,
      wall_close_in_space, wall_toggle, wall_toggle_in_space, macro_on, macro_off, macro_toggle,
      macro_cancel, override_enable, override_disable, override_toggle, channel_get,
      channel_get_in_space, group_get, group_get_in_space, preset_get, preset_get_in_space,
      wall_get, wall_get_in_space, sequence_get, sequence_get_in_space, macro_get, override_get,
      help
    ]
    verification: none

commands:
  channel_set:
    summary: "Set a channel's intensity to 0-255 (chan int:level)"
    params:
      channel: { type: string, pattern: '^[^,:]{1,64}$', required: true }
      level: { type: int, min: 0, max: 255, required: true }
    send: "chan int:{level} {channel}"
    returns: none

  channel_set_in_space:
    summary: "Set a channel's intensity to 0-255 (chan int:level), in a named space"
    params:
      channel: { type: string, pattern: '^[^,:]{1,64}$', required: true }
      level: { type: int, min: 0, max: 255, required: true }
      space: { type: string, pattern: '^[^,:]{1,64}$', required: true }
    send: "chan int:{level} {channel}, {space}"
    returns: none

  channel_set_in_space_fade:
    summary: "Set a channel's intensity to 0-255 (chan int:level), in a named space, over a fade time in seconds (tenths)"
    params:
      channel: { type: string, pattern: '^[^,:]{1,64}$', required: true }
      level: { type: int, min: 0, max: 255, required: true }
      space: { type: string, pattern: '^[^,:]{1,64}$', required: true }
      fade: { type: float, min: 0, max: 3600, required: true }
    send: "chan int:{level} {channel}, {space}, {fade:.1f}"
    returns: none

  channel_set_percent:
