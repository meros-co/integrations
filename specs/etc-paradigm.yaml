quirks:
  - models: [all]
    severity: warning
    text: >
      UDP serial is off until LightDesigner sets an Input UDP Port (default 0) and the PSAP 4.0
      Input Handler on the processor; the transport's 4703 is ETC's first recommended port, and the
      host's port overrides it. The End of Message Char must stay CR, which this spec sends.

  - models: [all]
    severity: warning
    text: >
      ETC documents no reply to action commands, so they report unverified; only the get commands
      are answered. Changes arrive only for objects with a PSAP trigger configured in LightDesigner
      (one trigger per object), and the triggers send to the destination LightDesigner names:
      point them at this host and feedback_port, or poll with the get commands.

  - models: [all]
    severity: warning
    text: >
      A get reply has the same form as a trigger update, so an update for another object that
      arrives while a get is outstanding can be taken as its reply. Every message, reply or not,
      also updates the state, so the state stays right either way.

  - models: [all]
    severity: info
    text: >
      The documented optional clauses are separate commands: *_in_space adds the space name and
      *_in_space_fade a fade time in seconds with tenths (ETC: a fade time needs a space name);
      *_priority adds a control priority 1-200, which makes the preset or sequence persist beneath
      higher priority actions. Levels are 0-255 except the *_percent commands (0-100 %). Names must
      match LightDesigner exactly (case sensitive) and cannot contain commas or colons.

  - models: [all]
    severity: info
    text: >
      State is keyed by the names in the replies (spaces.<space>.channels.<channel>.level and
      so on). A name containing a full stop splits the state path at it. The status strings for HTP
      presets are the same as for LTP ones, so the preset state does not say which playback it is.

  - models: [all]
    severity: critical
    text: >
      preset_record and preset_record_in_space record a preset over the existing one from the live
      levels, and space_off turns a space off; neither can be undone from here.

  - models: [all]
    severity: info
    text: >
      Only the UDP serial input is supported. PSAP is also available on the processor's RS232 port
      and over ACN Serial Config, which this transport does not carry. ETC Echo uses a different
      string protocol and is not covered.

state:
  "spaces.*.channels.*.level": { type: int, description: "Channel level 0-255, by space and channel name, from chan get replies and triggers" }
  "spaces.*.groups.*.level": { type: int, description: "Group level 0-255, by space and group name" }
  "spaces.*.presets.*.state": { type: string, description: "Preset state, by space and preset name: active, inactive or altered (pst act, dact, alt)" }
  "spaces.*.sequences.*.state": { type: string, description: "Sequence state, by space and sequence name: running, stopped or paused (seq start, stop, pause)" }
  "spaces.*.walls.*.state": { type: string, description: "Wall state, by parent space and wall name: open or closed" }
  "macros.*.state": { type: string, description: "Macro state by name: on, off or running" }
  "overrides.*.enabled": { type: bool, description: "Override enabled, by override name" }

telemetry:
  updates:
    - match: '^chan int:([0-9]+) ([^,]+), ([^,]+)$'
      state: { "spaces.{3}.channels.{2}.level": "{1}" }
    - match: '^grp int:([0-9]+) ([^,]+), ([^,]+)$'
      state: { "spaces.{3}.groups.{2}.level": "{1}" }
    - match: '^pst (act|dact|alt) ([^,]+), ([^,]+)$'
      state: { "spaces.{3}.presets.{2}.state": { value: "{1}", map: { act: active, dact: inactive, alt: altered } } }
    - match: '^seq (start|stop|pause) ([^,]+), ([^,]+)$'
      state: { "spaces.{3}.sequences.{2}.state": { value: "{1}", map: { start: running, stop: stopped, pause: paused } } }
    - match: '^wall (open|close) ([^,]+), ([^,]+)$'
      state: { "spaces.{3}.walls.{2}.state": { value: "{1}", map: { open: open, close: closed } } }
    - match: '^macro (on|off|running) (.+)$'
      state: { "macros.{2}.state": "{1}" }
    - match: '^ovr (enab|disab) (.+)$'
      state: { "overrides.{2}.enabled": { value: "{1}", map: { enab: true, disab: false } } }
