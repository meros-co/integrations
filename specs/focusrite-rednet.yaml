spec: 1
id: focusrite-rednet
name: Focusrite RedNet (AES70)
vendor: Focusrite
category: other
implementation: native
reason: >
  AES70 over OCP.1: a binary object protocol whose objects are found by walking the device's blocks, addressed by
  object numbers and classes the controller must know, and followed through subscriptions (see aes70). This
  integration is the AES70 module with Focusrite's controls named as commands.

source:
  - title: "AES70 Implementation Chart: Focusrite RedNet8, 2017.06.09, revision 6"
    author: Focusrite / OCA Alliance
    url: "https://ocaalliance.github.io/downloads.html"
    note: >
      The MP8R's AES70 objects as Focusrite documented them: every control in the root block (100), per channel
      1-8 the OcaSwitch roles 48V-n, HPF-n, Phase-n, Impedance-n, Pad-n and GComp-n, the OcaGain Gain-n and the
      OcaLevelSensor roles IpLvl-n and GCompLvl-n, numbered 0x01nn00pp; and the unit's OcaSwitch roles Fan, FP
      Lock, Identify, GComp Hroom, SCP ID and Preferred Master and OcaInt8Sensor roles Dante Device Lock, PSU A,
      PSU B, NetPri, NetSec and Network Clock Master (0x030000pp), with the OcaMediaClock DanteMediaClock and a
      proprietary stream network agent. Distributed under the OCA Alliance EULA; facts only are used.
  - title: "Focusrite RedNet virtual OCA device (OCALiteRednetVirtual) and its object lists RedNet1.xlsx, RedNet2.xlsx, RedNet4.xlsx, RedNet8.xlsx and Rednet MP8R OCA Device (virtual).xlsx"
    author: Focusrite Audio Engineering / OCA Alliance
    url: "https://ocaalliance.github.io/downloads.html"
    note: >
      The object lists of RedNet 1 (8 channels of InputLvl-n and OutputLvl-n level sensors), RedNet 2 (16), RedNet
      4 (48V-n, Source-n with positions Mic, Line and DI, Gain-n 0-63 dB, HPF-n, Lvl-n, and the Link1-2 to Link7-8
      switches) and RedNet 8 / MP8R (48V-n, Gain-n 10-65 dB, HPF-n, Lvl-n, MonLvl-n, Phase-n, Impedance-n with
      positions 10k and 2k4, Pad-n with positions 0 dB and -20 dB, TrimEnable-n), each with a Fan switch (0 off,
      1 on) and a DanteMediaClock (44.1 to 192 kHz); objects numbered 4352 + 256 x (channel - 1) + offset. Its
      readme: the device advertises _oca._tcp over DNS-SD (seen on port 65000) with TXT modelGUID
      0000130e000000xx, 0x00130E being Focusrite's code. Distributed under the OCA Alliance EULA (no reverse
      engineering of the executable; none was done); facts only are used.
  - title: "RedNet Control 2.4 release notes, and the RedNet A16R MkII and D16R MkII user guides"
    author: Focusrite Audio Engineering
    url: "https://focusritepro.com/rednet-control/"
    note: >
      AES70 compatibility arrived for RedNet Brooklyn 2 devices and the X2P with RedNet Control 2.4, and each
      device has an AES70 on/off setting in RedNet Control (A16R MkII and D16R MkII guides, device settings).
  - title: "Focusrite Pro MIDI Controller User Guide 1.01 (MIDI control for RedNet 4, MP8R, X2P, Red 4Pre, 8Pre, 8Line, 16Line)"
    author: Focusrite Audio Engineering
    url: "https://fael-downloads-prod.focusrite.com/customer/prod/downloads/Focusrite%20Pro%20MIDI%20Controller%20User%20Guide%201.01%20English%20-%20EN.pdf"
    note: >
      Corroborates the controls and their ranges per model (MP8R gain 10-65 dB, RedNet 4 0-63 dB, gain
      compensation headroom 0, 3 or 6 dB). The MIDI bridge itself runs inside RedNet Control on a computer and is
      not a protocol the devices speak, so it is not implemented.
  - title: "aes70 integration (this repository)"
    url: "specs/aes70.yaml"
    note: The OCP.1 session, walk, subscriptions, meters and generic commands, with their own sources.

settings:
  # The heartbeat time sent to the device in the keep-alive on connecting: the
  # device sends a keep-alive when it has sent nothing for this long, and
  # nothing heard for three of them drops the connection. Whole seconds are
  # sent in seconds; anything else in milliseconds (AES70-2018's second form).
  keepalive_interval_ms: { type: int, min: 100, max: 600000, default: 1000,
                           label: Keep-alive interval,
                           description: "Heartbeat time in milliseconds asked of the device; three intervals with nothing heard drop the connection." }
  # How long a request waits for its response.
  request_timeout_ms: { type: int, min: 100, max: 600000, default: 5000,
                        label: Request timeout,
                        description: "Milliseconds a request waits for its response before it fails." }
  # Walk the root block on connecting (when the device is monitored).
  walk: { type: bool, default: true,
          label: Walk object tree,
          description: "Whether to walk the root block on connecting to learn the device's objects, when the device is monitored." }
  # Block levels walked: 1 is the root block's members only, 2 also their
  # members, and so on. Every level when not given.
  walk_depth: { type: int, min: 1, max: 255,
                label: Walk depth,
                description: "Block levels walked: 1 is the root block's members only, 2 also their members, and so on; every level when not given." }
  # Subscribe to the property changes of every known object found.
  subscribe: { type: bool, default: true,
               label: Subscribe,
               description: "Whether to subscribe to property changes of every known object found." }
  # Level sensors (meters): off (not read), read (once, on connecting), poll
  # (read every level_poll_ms), or subscribe (follow their changes, which may
  # be many per second).
  level_sensors: { type: enum, values: ["off", read, poll, subscribe], default: poll,
                   label: Level sensors,
                   description: "How meters are read: off, read once on connecting, poll every level poll interval, or subscribe to their changes (may be many per second)." }
  level_poll_ms: { type: int, min: 50, max: 600000, default: 1000,
                   label: Level poll interval,
                   description: "Milliseconds between level sensor reads when level sensors are polled." }
  # Requests waiting for a response at once; more are queued.
  max_in_flight: { type: int, min: 1, max: 1024, default: 32,
                   label: Requests in flight,
                   description: "Requests waiting for a response at once; more are queued." }

ports:
  - { port: null, protocol: tcp, role: control, note: "No fixed OCP.1 port: the device advertises it as _oca._tcp over DNS-SD, and it is given when the device is opened" }

models:
  - id: rednet-mp8r
    name: Focusrite RedNet MP8R (RedNet 8)
    channels: 8
    supports: [set_phantom_power, set_preamp_gain, set_high_pass_filter, set_phase_invert, set_impedance, set_pad,
      set_gain_compensation, set_fan, identify, set_front_panel_lock, set_preferred_leader, set_gain,
      set_mute, set_switch, set_polarity, set_delay, set_bool, set_int, set_float, set_string, get_property,
      set_property, call_method, refresh_objects, get_device_info]
    verification: none
    notes: >
      Eight remote-controlled mic preamps. Objects as in Focusrite's RedNet8 implementation chart; the virtual
      device numbers them differently and calls gain compensation TrimEnable-n.
  - id: rednet-4
    name: Focusrite RedNet 4
    channels: 8
    supports: [set_phantom_power, set_preamp_gain, set_high_pass_filter, set_input_source, set_channel_link, set_fan,
      set_gain, set_mute, set_switch, set_polarity, set_delay, set_bool, set_int, set_float, set_string, get_property,
      set_property, call_method, refresh_objects, get_device_info]
    verification: none
    notes: Eight mic/line/DI preamps with stereo linking, as in the virtual device's RedNet4 list.
  - id: rednet-1
    name: Focusrite RedNet 1
    channels: 8
    supports: [set_fan, set_gain, set_mute, set_switch, set_polarity, set_delay, set_bool, set_int, set_float, set_string,
      get_property, set_property, call_method, refresh_objects, get_device_info]
    verification: none
    notes: Eight-channel AD/DA; its AES70 objects are input and output meters and the fan (virtual device's RedNet1 list).
  - id: rednet-2
    name: Focusrite RedNet 2
    channels: 16
    supports: [set_fan, set_gain, set_mute, set_switch, set_polarity, set_delay, set_bool, set_int, set_float, set_string,
      get_property, set_property, call_method, refresh_objects, get_device_info]
    verification: none
    notes: Sixteen-channel AD/DA; its AES70 objects are input and output meters and the fan (virtual device's RedNet2 list).
  - id: rednet-other
    name: "Other RedNet devices with AES70 enabled (Brooklyn 2 interfaces such as A16R MkII and D16R MkII, X2P)"
    supports: [set_gain, set_mute, set_switch, set_polarity, set_delay, set_bool, set_int, set_float, set_string,
      get_property, set_property, call_method, refresh_objects, get_device_info]
    verification: none
    notes: >
      Focusrite publishes no object list for these; what they offer is found by walking their object tree and is
      reached with the generic AES70 commands, by role path or object number.

commands:
  set_gain:
    summary: "OcaGain SetGain (4.2): the gain in dB, on an object addressed by role path (object) or object number (ono)"
    params:
      object: &object { type: string, max_length: 4096,
                        label: Object,
                        description: "Object by role path, the roles from the root block down joined by '/', e.g. Input 1/Gain; give this or an object number." }
      ono: &ono { type: int, min: 1, max: 4294967295,
                  label: Object number,
                  description: "Object number (ono), stable for a device's configuration; give this or a role path." }
      gain_db: { type: float, required: true,
                 label: Gain,
                 description: "Gain in dB; the object's own minimum and maximum apply." }
    returns: ack
  set_mute:
    summary: "OcaMute SetState (4.2): muted (state 1) or unmuted (2)"
    params:
      object: *object
      ono: *ono
      muted: { type: bool, default: true,
               label: Mute,
               description: "True mutes the object, false unmutes it." }
    returns: ack
  set_switch:
    summary: >
      OcaSwitch SetPosition (4.2): a position number from 0, or a position by its name (position_name, from the
      switch's position names read on connecting)
    params:
      object: *object
      ono: *ono
      position: { type: int, min: 0, max: 65535,
                  label: Position,
                  description: "Switch position, numbered from 0; give this or a position name." }
      position_name: { type: string, max_length: 1024,
                       label: Position name,
                       description: "Switch position by its name, as the switch reported on connecting; give this or a position number." }
    returns: ack
  set_polarity:
    summary: "OcaPolarity SetState (4.2): inverted (state 2) or non-inverted (1)"
    params:
      object: *object
      ono: *ono
      inverted: { type: bool, default: true,
                  label: Invert,
                  description: "True inverts the polarity, false sets it back to normal." }
    returns: ack
  set_delay:
    summary: "OcaDelay SetDelayTime (4.2): the delay in seconds"
    params:
      object: *object
      ono: *ono
      delay_s: { type: float, min: 0, required: true,
                 label: Delay,
                 description: "Delay time in seconds, e.g. 0.005 for 5 ms." }
    returns: ack
  set_bool:
    summary: "OcaBooleanActuator SetSetting (5.2)"
    params:
      object: *object
      ono: *ono
      value: { type: bool, required: true,
               label: Value,
               description: "New setting of the boolean actuator." }
    returns: ack
  set_int:
    summary: "OcaInt8/16/32/64Actuator or OcaUint8/16/32/64Actuator SetSetting (5.2); the value must fit the actuator's type"
    params:
      object: *object
      ono: *ono
      value: { type: int, required: true,
               label: Value,
               description: "New setting of the integer actuator; it must fit the actuator's type, e.g. 0 to 255 for an 8-bit unsigned one." }
    returns: ack
  set_float:
    summary: "OcaFloat32Actuator or OcaFloat64Actuator SetSetting (5.2)"
    params:
      object: *object
      ono: *ono
      value: { type: float, required: true,
               label: Value,
               description: "New setting of the floating-point actuator, in the actuator's own unit." }
    returns: ack
  set_string:
    summary: "OcaStringActuator SetSetting (5.2)"
    params:
      object: *object
      ono: *ono
      value: { type: string, required: true, max_length: 65535,
               label: Value,
               description: "New text for the string actuator." }
    returns: ack
  get_property:
    summary: >
      Read one property ("level.index", e.g. "4.1") of an object, with the getter of its class. Returns the
      decoded value, or {value, min, max} for a bounded property, or {hex} when the reply cannot be decoded. Only
      the properties listed under state are known; call_method reaches any other
    params:
      object: *object
      ono: *ono
      property: &property { type: string, required: true, pattern: "^[0-9]{1,5}\\.[0-9]{1,5}$",
                            label: Property,
                            description: "Property ID as level.index, e.g. 4.1 for the fourth class level's first property." }
    returns: value
  set_property:
    summary: >
      Write one property ("level.index") of an object with the setter of its class; value is JSON of the
      property's type (a number, boolean, string, or list of strings or booleans; muted and inverted states as
      booleans, delays in seconds)
    params:
      object: *object
      ono: *ono
      property: *property
      value: { type: json, required: true,
               label: Value,
               description: "New value as JSON of the property's type: a number, boolean, string or list; mute and polarity states as booleans, delays in seconds." }
    returns: ack
  call_method:
    summary: >
      Escape hatch: call any method ("level.index") on an object with parameters already marshalled as OCP.1
      bytes (params_hex) and their count (param_count; 1 when params_hex is not empty, else 0). Returns the
      response as {status, status_name, param_count, params_hex}, whatever the status
    params:
      object: *object
      ono: *ono
      method: { type: string, required: true, pattern: "^[0-9]{1,5}\\.[0-9]{1,5}$",
                label: Method,
                description: "Method ID as level.index, e.g. 4.2." }
      params_hex: { type: string, default: "", max_length: 131070, pattern: "^[0-9A-Fa-f ]*$",
                    label: Parameters,
                    description: "Method parameters already marshalled as OCP.1 bytes, in hex; empty for none." }
      param_count: { type: int, min: 0, max: 255,
                     label: Parameter count,
                     description: "Number of parameters in the hex; when not given, 1 if parameters are given and 0 if not." }
    returns: value
  refresh_objects:
    summary: >
      Forget the object tree and walk the root block again; acknowledged when the walk is done. When monitored,
      known objects are then read again and any new ones subscribed to
    returns: ack
  get_device_info:
    summary: >
      Read the device manager (object 1): model GUID, serial number, model description, name, AES70 version,
      role, user inventory code, enabled, state, message and revision id. A property the device does not
      implement is null
    returns: value
  set_phantom_power:
    summary: "Switch a preamp's +48 V phantom power (OcaSwitch 48V-n: 0 off, 1 on)"
    params:
      channel: &channel { type: int, min: 1, max: 8, required: true, label: Channel,
                          description: "Preamp channel, numbered from 1 as on the front panel." }
      enabled: { type: bool, default: true, label: Phantom power, description: "On applies +48 V to the input, off removes it." }
    returns: ack
  set_preamp_gain:
    summary: "Set a preamp's gain (OcaGain Gain-n), in dB"
    params:
      channel: *channel
      gain_db: { type: float, min: 0, max: 65, required: true, label: Gain,
                 description: "Preamp gain in dB: 10 to 65 on an MP8R, 0 to 63 on a RedNet 4; the object's own range applies." }
    returns: ack
  set_high_pass_filter:
    summary: "Switch a preamp's high-pass filter (OcaSwitch HPF-n: 0 off, 1 on)"
    params:
      channel: *channel
      enabled: { type: bool, default: true, label: High-pass filter, description: "On engages the high-pass filter, off bypasses it." }
    returns: ack
  set_phase_invert:
    summary: "Invert a preamp's polarity (OcaSwitch Phase-n: 0 off, 1 on)"
    params:
      channel: *channel
      inverted: { type: bool, default: true, label: Invert, description: "On inverts the channel's polarity, off leaves it normal." }
    returns: ack
  set_impedance:
    summary: "Set a preamp's input impedance (OcaSwitch Impedance-n: 0 10 kOhm, 1 2.4 kOhm)"
    params:
      channel: *channel
      impedance: { type: enum, values: ["10k", "2k4"], required: true, label: Impedance,
                   description: "Input impedance: 10k is 10 kOhm, 2k4 is 2.4 kOhm." }
    returns: ack
  set_pad:
    summary: "Switch a preamp's pad (OcaSwitch Pad-n: 0 0 dB, 1 -20 dB)"
    params:
      channel: *channel
      enabled: { type: bool, default: true, label: Pad, description: "On engages the -20 dB pad, off removes it." }
    returns: ack
  set_gain_compensation:
    summary: "Switch a preamp's gain compensation for shared preamps (OcaSwitch GComp-n: 0 off, 1 on)"
    params:
      channel: *channel
      enabled: { type: bool, default: true, label: Gain compensation,
                 description: "On holds the channel's level on the network when another controller changes the preamp gain, off follows it." }
    returns: ack
  set_input_source:
    summary: "Choose a RedNet 4 channel's input (OcaSwitch Source-n: 0 mic, 1 line, 2 DI)"
    params:
      channel: *channel
      source: { type: enum, values: [mic, line, di], required: true, label: Input,
                description: "Microphone, line or instrument (DI) input." }
    returns: ack
  set_channel_link:
    summary: "Link a RedNet 4 channel pair for stereo (OcaSwitch Link1-2 to Link7-8: 0 off, 1 on)"
    params:
      pair: { type: enum, values: ["1-2", "3-4", "5-6", "7-8"], required: true, label: Channel pair,
              description: "The odd and even channels to link." }
      enabled: { type: bool, default: true, label: Link, description: "On links the pair's controls, off unlinks them." }
    returns: ack
  set_fan:
    summary: "Switch the unit's fan (OcaSwitch Fan: 0 off, 1 on)"
    params:
      enabled: { type: bool, default: true, label: Fan, description: "On runs the fan, off stops it." }
    returns: ack
  identify:
    summary: "Make the unit identify itself (OcaSwitch Identify: 0 off, 1 on)"
    params:
      enabled: { type: bool, default: true, label: Identify, description: "On starts the unit's identification, off stops it." }
    returns: ack
  set_front_panel_lock:
    summary: "Lock or unlock the unit's front panel controls (OcaSwitch FP Lock: 0 off, 1 on)"
    params:
      enabled: { type: bool, default: true, label: Panel lock, description: "On locks the front panel, off unlocks it." }
    returns: ack
  set_preferred_leader:
    summary: "Make the unit the preferred Dante clock leader (OcaSwitch Preferred Master: 0 off, 1 on)"
    params:
      enabled: { type: bool, default: true, label: Preferred leader,
                 description: "On asks Dante to elect this unit clock leader, off leaves it to the election." }
    returns: ack

state:
  discovery.complete:              { type: bool, description: "The walk of the root block has been answered or has timed out throughout" }
  discovery.objects:               { type: int, description: "Objects found under the root block, at every level walked" }
  objects.*.ono:                   { type: int, description: "Object number. Objects are keyed by role path: the roles from the root block down, joined by '/' (e.g. \"Input 1/Gain\"); a second object with the same path gets \"#<ono>\" appended" }
  objects.*.class:                 { type: string, description: "Class name (OcaGain, OcaBlock, ...) when the class is one the module knows by name, else the class id" }
  objects.*.class_id:              { type: string, description: "Class id, its fields joined by '.' (\"1.1.1.5\"); proprietary classes include 65535 and the vendor's fields" }
  objects.*.class_version:         { type: int, description: "Class version the device reports" }
  objects.*.kind:                  { type: string, description: "The nearest standard class the object is or derives from, e.g. OcaGain for a vendor's subclass of it" }
  objects.*.gain_db:               { type: float, unit: dB, description: "OcaGain 4.1 Gain; with gain_db_min and gain_db_max" }
  objects.*.gain_db_min:           { type: float, unit: dB, description: "OcaGain minimum gain" }
  objects.*.gain_db_max:           { type: float, unit: dB, description: "OcaGain maximum gain" }
  objects.*.muted:                 { type: bool, description: "OcaMute 4.1 State: true for Muted (1), false for Unmuted (2)" }
  objects.*.inverted:              { type: bool, description: "OcaPolarity 4.1 State: true for Inverted (2)" }
  objects.*.position:              { type: int, description: "OcaSwitch 4.1 Position, from 0; with position_min and position_max" }
  objects.*.position_min:          { type: int, description: "OcaSwitch lowest position" }
  objects.*.position_max:          { type: int, description: "OcaSwitch highest position" }
  objects.*.position_names:        { type: array, description: "OcaSwitch 4.2 PositionNames, indexed by position" }
  objects.*.position_enabled:      { type: array, description: "OcaSwitch 4.3 PositionEnableds, when a change is reported" }
  objects.*.delay_s:               { type: float, unit: s, description: "OcaDelay 4.1 DelayTime in seconds; with delay_s_min and delay_s_max" }
  objects.*.delay_s_min:           { type: float, unit: s, description: "OcaDelay minimum delay" }
  objects.*.delay_s_max:           { type: float, unit: s, description: "OcaDelay maximum delay" }
  objects.*.active:                { type: bool, description: "OcaIdentificationActuator 4.1 Active: the device is identifying itself" }
  objects.*.setting:               { type: float, description: "Basic actuator 5.1 Setting: a boolean, integer, float or string by the actuator's class; numeric ones with setting_min and setting_max" }
  objects.*.setting_min:           { type: float, description: "Numeric basic actuator minimum" }
  objects.*.setting_max:           { type: float, description: "Numeric basic actuator maximum" }
  objects.*.reading:               { type: float, description: "Basic sensor 5.1 Reading (OcaBooleanSensor to OcaStringSensor): a boolean, integer, float or string by the sensor's class; numeric ones with reading_min and reading_max" }
  objects.*.reading_min:           { type: float, description: "Numeric basic sensor lowest reading" }
  objects.*.reading_max:           { type: float, description: "Numeric basic sensor highest reading" }
  objects.*.reading_db:            { type: float, unit: dB, description: "OcaLevelSensor 4.1 Reading, as the level_sensors setting asks; with reading_db_min and reading_db_max. Infinite or NaN readings are \"inf\", \"-inf\" or \"nan\"" }
  objects.*.reading_db_min:        { type: float, unit: dB, description: "OcaLevelSensor lowest reading" }
  objects.*.reading_db_max:        { type: float, unit: dB, description: "OcaLevelSensor highest reading" }
  objects.*.reading_state:         { type: string, description: "OcaSensor 3.1 ReadingState when a change is reported: unknown, valid, underrange, overrange or error" }
  objects.*.enabled:               { type: bool, description: "OcaWorker 2.1 Enabled, when a change is reported or set" }
  objects.*.label:                 { type: string, description: "OcaWorker 2.3 Label, when a change is reported or set" }
  objects.*.raw.*:                 { type: string, description: "A reported change of a property the module does not know, keyed by property id (\"4.9\"): its new value as OCP.1 bytes in hex" }
  device.model_guid:               { type: string, description: "OcaDeviceManager ModelGUID as 16 hex digits: a reserved byte, the manufacturer's IEEE OUI (3 bytes) and the model code (4)" }
  device.serial_number:            { type: string, description: "OcaDeviceManager SerialNumber" }
  device.model.manufacturer:       { type: string, description: "OcaDeviceManager ModelDescription manufacturer" }
  device.model.name:               { type: string, description: "OcaDeviceManager ModelDescription name" }
  device.model.version:            { type: string, description: "OcaDeviceManager ModelDescription version" }
  device.name:                     { type: string, description: "OcaDeviceManager DeviceName" }
  device.oca_version:              { type: int, description: "OcaDeviceManager OcaVersion: the AES70 version the device implements" }
  device.role:                     { type: string, description: "OcaDeviceManager Role, from get_device_info" }
  device.user_inventory_code:      { type: string, description: "OcaDeviceManager UserInventoryCode, from get_device_info" }
  device.enabled:                  { type: bool, description: "OcaDeviceManager Enabled" }
  device.state:                    { type: array, description: "OcaDeviceManager State: the names of the bits set, of operational, disabled, error, initializing and updating" }
  device.message:                  { type: string, description: "OcaDeviceManager Message, from get_device_info" }
  device.revision_id:              { type: string, description: "OcaDeviceManager DeviceRevisionID, where implemented" }

quirks:
  - models: [all]
    severity: warning
    text: >
      AES70 is off on a RedNet unit until it is enabled for that unit in RedNet Control (2.4 or later, Brooklyn 2
      units and the X2P); a Dante Domain Manager operator cannot change the setting. The OCP.1 port is not fixed:
      the unit advertises it as _oca._tcp over DNS-SD (the virtual device used 65000), and it must be given when
      the device is opened. Only OCP.1 over plain TCP is implemented.
  - models: [all]
    severity: warning
    text: >
      Focusrite's RedNet8 implementation chart (2017) and the RedNet virtual device (2016) number the same objects
      differently (0x01nn00pp per channel against 4352 + 256 per channel), so the named commands address objects
      by role ("48V-1", "Gain-1"), which both agree on, and the AES70 module finds the number. Where they disagree
      on a role (the chart's GComp-n and IpLvl-n against the virtual device's TrimEnable-n and Lvl-n), the chart's
      is used; on a unit that uses the other name, reach it with set_switch by role. A role the unit lacks fails
      the command as not found.
  - models: [all]
    severity: info
    text: >
      Switch positions follow the virtual device's lists (0 off and 1 on; Impedance 0 = 10 kOhm and 1 = 2.4 kOhm;
      Pad 0 = 0 dB and 1 = -20 dB; Source 0 mic, 1 line, 2 DI). The chart gives no positions, so those of its
      unit-wide switches (Identify, FP Lock, Preferred Master, GComp Hroom, SCP ID) are assumed 0 off and 1 on;
      the position names the unit reports are in state under objects.<role>.position_names.
  - models: [rednet-mp8r]
    severity: warning
    text: >
      MP8R preamps can be shared with a Yamaha console (Yamaha ID set in RedNet Control) and RedNet Control at the
      same time; a gain change from any of them moves the preamp for all. With gain compensation on, the level
      sent to the network is held when another controller changes the gain.
  - models: [all]
    severity: info
    text: >
      Meters (the IpLvl-n or Lvl-n, MonLvl-n, GCompLvl-n, InputLvl-n and OutputLvl-n level sensors, -128 to +1 dB)
      are read as the level_sensors setting says, every second by default. The unit-wide status sensors (PSU A and
      B, network ports, clock leader, Dante device lock) are OcaInt8Sensor objects, read on connecting and followed
      by subscription into objects.<role>.reading; what each value means is not documented.
  - models: [all]
    severity: info
    text: >
      Everything else (connection, keep-alives, the walk, subscriptions, status codes and commands-only opening)
      is the aes70 integration's; see its quirks.
