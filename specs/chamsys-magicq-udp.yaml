spec: 1
id: chamsys-magicq-udp
name: ChamSys MagicQ / QuickQ Remote Ethernet Protocol
vendor: ChamSys
category: lighting

source:
  - title: MagicQ Manual 1.9.9.x, ChamSys Remote Protocol Commands
    author: ChamSys Ltd
    url: https://docs.chamsys.co.uk/magicq/1.9.9.x/manual/remote_control_commands.html
    note: >
      MagicQ Manual 1.9.9.x, "Latest Update, 2026-09-23" (PDF
      https://docs.chamsys.co.uk/magicq/1.9.9.x/_exports/magicq-1.9.9.x.pdf, pp. 471-474;
      retrieved 2026-10-01). Commands are comma-separated values ending in a letter A-Z (or a-z);
      spaces, tabs and carriage returns are ignored; commands can be sent back to back
      ("1A2A1S2G3,4I"). Remote playback commands A, R, T, U, G, S, B, F, L, J, P, I, H, X with
      their parameter ranges (<playback number> "1 and 10 (202 on MagicQ consoles)", <level>
      0-100, <page number> 0-100, <channel number> 1-32769, <cue id> 1-65536, <cue id dec> 0-99
      "for Cue ID 1.5 use 50", <button id> 1-10, <zone id> 1-20, <state> 1 pressed, 2 activate, 3
      release, 4 toggle, 7 cycle, 9 increase, 10 decrease); examples "4,50I" and "8,2,50J". Remote
      programming commands 01-13, 19-23, 30-32, 40-43, 71, 80-83, 90-94, 112, 911 and 999 ending
      in H, with <palette id> 1-1024, <Q id> 1-10000, <16 bit> 0/1, <time> seconds, <group number>
      1-200, heads 1-6145, <show file id> 0000-9999, <state> 0/1 or 2 toggle, and the attribute
      number list.
  - title: MagicQ Manual 1.9.9.x, Controlling MagicQ Using UDP/IP
    author: ChamSys Ltd
    url: https://docs.chamsys.co.uk/magicq/1.9.9.x/manual/remote_control_network.html
    note: >
      PDF pp. 475-480. ChamSys Remote Ethernet Protocol (CREP): "a UDP/IP based protocol using port
      6553 in broadcast mode", port changeable in Setup, View Settings, Network; the optional CREP
      header (long32 "CREP", little-endian so "PERC" on the wire, word16 version 0, byte seq_fwd,
      byte seq_bkwd, word16 length); "ChamSys Remote Ethernet Protocol Messages are also supported
      without the ChamSys CREP header"; receiving needs Ethernet Remote Protocol set to "ChamSys
      Rem rx" (or a no-header rx variant); "not supported when net session mode is in use"; on
      MagicQ PC/Mac "only enabled when it is connected to a MagicQ Wing or Interface (not
      MagicDMX)". Q-Sys plugins use "ChamSys Rem (tx + rx no header)" on port 6553.
  - title: MagicQ Manual 1.9.9.x, Settings > Network Settings; MIDI; MagicQ Software and Consoles
    author: ChamSys Ltd
    url: https://docs.chamsys.co.uk/magicq/1.9.9.x/manual/settings.html
    note: >
      Network Settings, PDF pp. 633-634: Ethernet Remote Protocol "options to enable tx, rx and both
      tx and rx" and no-header variants; "on receive (rx) MagicQ auto detects whether a header is
      present"; "When set to rx echo then any received data is processed and then transmitted back
      out (echoed)"; default None. Ethernet Remote Port default 6553. MIDI, p. 496: "MagicQ limits
      the number of playbacks that can be controlled using MIDI and the remote protocols. On
      MagicQ consoles PB1 to PB34 ... On MagicQ PC, playbacks PB1 to PB10". MagicQ Software and
      Consoles, pp. 4-10: MQ500M+, MQ500M, MQ500, MQ250M, Compact MQ50/MQ70/MQ80 (previous MQ40N,
      MQ60, original MQ70), MagicQ Rack and DIN ("OSC, UDP, and MIDI control"), PC/Mac with Wings.
  - title: QuickQ Manual 12.0, Ethernet Remote Control
    author: ChamSys Ltd
    url: https://docs.chamsys.co.uk/quickq/12.0/manual/ethernetremote.html
    note: >
      QuickQ Manual 12.0, "Latest Update, 2026-09-23" (PDF
      https://docs.chamsys.co.uk/quickq/12.0/_exports/quickq-12.0.pdf, p. 74): with Ethernet Remote
      Control on, "the console will listen for UDP messages on port 6553. The port number is fixed
      and cannot be changed. The Ethernet Remote Control messages do not require any heading."
      Commands A, R, T, U, G, S, J ("<playback number>,<cue number>J"), L ("4,50L"), X
      ("<button ID>,<state>" and "<zone>,<button ID>,<state>", state 2 activate, 3 release, 4
      toggle, zone 0 all zones); "sending 10A will activate Playback 10"; on a QuickQ 10 the CUE
      STACK playback is Playback 1 and the chase playbacks, left to right, are 3 and 2; enable in
      Settings > Network > Protocols. QuickQ Range (introduction.html): QuickQ 10, 20, 30, Rack,
      DIN; the QuickQ 20 and 30 have 10 playbacks (p. 40).

# Headerless remote commands, one per UDP datagram, to port 6553 (MagicQ default, QuickQ fixed).
# MagicQ auto-detects the absence of the CREP header on receive; QuickQ takes no header. Commands
# end in their letter, so nothing is appended. The console does not acknowledge.
transport:
  type: line-udp
  port: 6553
  terminator: none
  encoding: ascii
  reply: none

ports:
  - { port: 6553, protocol: udp, role: control }

