quirks:
  - models: [all]
    severity: critical
    text: >
      Received commands are ignored by default. On MagicQ set Setup, View Settings, Network,
      Ethernet Remote Protocol to "ChamSys Rem rx", "ChamSys Rem (rx no header)" or a tx + rx
      variant (default None), and Ethernet Remote Port to the device's port (default 6553). On
      QuickQ switch on Ethernet Remote Control in Settings > Network > Protocols; the port is fixed
      at 6553.

  - models: [all]
    severity: warning
    text: >
      Nothing is acknowledged, so every command reports unverified. With Ethernet Remote Protocol
      set to "rx echo", MagicQ processes received data and then transmits it back out (echoed);
      the manual does not say to which address or port, or whether a header is added, so the echo
      is not used as a reply here. Commands are sent without the optional CREP header, which
      MagicQ detects automatically ("MagicQ auto detects whether a header is present").

  - models: [all]
    severity: info
    text: >
      Commands are text, values separated by commas and ended by a letter; spaces, tabs and
      carriage returns are ignored, and several commands can share one datagram ("1A2A1S2G3,4I",
      sent with `command`). The manual describes CREP as using port 6553 "in broadcast mode"; it
      is sent here to the console's address, which MagicQ's own sample code receives on any
      address (INADDR_ANY).

  - models: [magicq-mq500m-plus, magicq-mq500m, magicq-mq500, magicq-mq250m, magicq-mq80, magicq-mq70, magicq-mq60, magicq-mq50, magicq-mq40n, magicq-mq40, magicq-rack, magicq-din, magicq-pc]
    severity: warning
    text: >
      "ChamSys Remote Ethernet Protocol is not supported when net session mode is in use." Remote
      programming commands (H) act on the console's programmer and include record, save, load,
      shutdown (94) and emergency hot takeover (112, aliases 911 and 999); intent cannot be
      validated.

  - models: [magicq-mq500m-plus, magicq-mq500m, magicq-mq500, magicq-mq250m, magicq-mq80, magicq-mq70, magicq-mq60, magicq-mq50, magicq-mq40n, magicq-mq40, magicq-rack, magicq-din, magicq-pc]
    severity: warning
    text: >
      Playback numbers are taken as 1-202 ("a number between 1 and 10 (202 on MagicQ consoles)").
      The MIDI chapter says MagicQ limits playbacks controlled by "MIDI and the remote protocols"
      to PB1-PB34 on consoles and PB1-PB10 on MagicQ PC. The two pages disagree; numbers above 34
      may be ignored on consoles, and above 10 on PC.

  - models: [magicq-mq500m-plus, magicq-mq500m, magicq-mq500, magicq-mq250m, magicq-mq80, magicq-mq70, magicq-mq60, magicq-mq50, magicq-mq40n, magicq-mq40, magicq-rack, magicq-din, magicq-pc]
    severity: info
    text: >
      Ranges the manual leaves open are bounded here, not documented: attribute values 0-65535
      (8-bit or 16-bit), times 0-3600 s, cue stack ids 1-10000, and the cue id of programming
      commands 13, 23 and 82 as the playback table's 1-65536. Programming numbers are sent as the
      table writes them ("01" to "09"). Attribute numbers are the table's 0-51 (Intensity 0, Pan
      4, Tilt 5, Cyan 16, ...). Command names match the chamsys-magicq spec's /rpc commands
      without the rpc_ prefix.

  - models: [magicq-pc]
    severity: critical
    text: >
      On MagicQ PC/Mac the Remote Ethernet Protocol is "only enabled when it is connected to a
      MagicQ Wing or Interface (not MagicDMX)", and only playbacks PB1-PB10 can be controlled.

  - models: [magicq-mq40n, magicq-mq40]
    severity: info
    text: >
      MQ40 and MQ40N do not support OSC, so this protocol is their network control route. The
      manual lists them only as previous Compact models and names no CREP restriction for them.

  - models: [quickq-10, quickq-20, quickq-30, quickq-rack, quickq-din]
    severity: warning
    text: >
      QuickQ accepts only A, R, T, U, G, S, J, L and X. Its jump is "<playback number>,<cue
      number>J" (quickq_jump_cue; the manual gives no cue range or decimal form, so whole numbers
      are taken) and its 10Scene states are 2 activate, 3 release and 4 toggle, with zone 0 for
      all zones (quickq_tenscene_*). The shared playback commands accept 1-202 for MagicQ; QuickQ
      has at most 10 playbacks. The manual names no zone limit for X; zones 0-10 follow the Q-Sys
      section's "10Scene Zone (1..10)" for QuickQ.

  - models: [quickq-10]
    severity: info
    text: >
      On the QuickQ 10 the CUE STACK playback is Playback 1 and the two chase playbacks, from left
      to right as seen at the console, are Playbacks 3 and 2.

  - models: [quickq-din]
    severity: info
    text: >
      The QuickQ manual's external control list names "The QuickQ Rack and Consoles"; the QuickQ
      DIN runs the same software but is not named there.
