commands:
  command:
    summary: "Send ChamSys Remote Protocol commands as text, e.g. \"1A2A1S2G3,4I\": comma-separated values each ended by a letter A-Z (QuickQ accepts only A R T U G S J L X)"
    params:
      commands: { type: string, pattern: '^[0-9A-Za-z, ]{1,256}$', required: true }
    send: "{commands}"
    returns: none

  activate:
    summary: "Activate playback (\"<playback>A\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: "{playback}A"
    returns: none

  release:
    summary: "Release playback (\"<playback>R\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: "{playback}R"
    returns: none

  test:
    summary: "Test playback (activate with level 100%) (\"<playback>T\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: "{playback}T"
    returns: none

  untest:
    summary: "Un-test playback (release with level 0%) (\"<playback>U\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: "{playback}U"
    returns: none

  go:
    summary: "Go on playback (\"<playback>G\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: "{playback}G"
    returns: none

  stop:
    summary: "Stop (go back) on playback (\"<playback>S\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: "{playback}S"
    returns: none

  fast_back:
    summary: "Fast back on playback (no fade) (\"<playback>B\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: "{playback}B"
    returns: none

  fast_forward:
    summary: "Fast forward on playback (no fade) (\"<playback>F\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
    send: "{playback}F"
    returns: none

  level:
    summary: "set playback fader level in percent (\"<playback>,<level>L\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
      level:    { type: int, min: 0, max: 100, required: true }
    send: "{playback},{level}L"
    returns: none

  jump_cue:
    summary: "jump to cue id <cue>.<cue_dec> on a playback (cue 2.5 is cue 2, cue_dec 50) (\"<playback>,<cue>,<cue_dec>J\")"
    params:
      playback: { type: int, min: 1, max: 202, required: true }
      cue:      { type: int, min: 1, max: 65536, required: true }
      cue_dec:  { type: int, min: 0, max: 99, default: 0 }
    send: "{playback},{cue},{cue_dec}J"
    returns: none

  page:
    summary: "change playback page (\"<page>P\")"
    params:
      page: { type: int, min: 0, max: 100, required: true }
    send: "{page}P"
    returns: none

  channel_intensity:
    summary: "set a DMX intensity channel to a level in percent (\"<channel>,<level>I\")"
    params:
      channel: { type: int, min: 1, max: 32769, required: true }
      level:   { type: int, min: 0, max: 100, required: true }
    send: "{channel},{level}I"
    returns: none

  tenscene_button:
    summary: "10Scene zone 1 button 1-10 (\"<button>X\")"
    params:
      button: { type: int, min: 1, max: 10, required: true }
    send: "{button}X"
    returns: none

  tenscene_button_state:
    summary: "10Scene zone 1 button press or release; state 1 pressed, 2 activate, 3 release, 4 toggle, 7 cycle, 9 increase, 10 decrease (\"<button>,<state>X\")"
    params:
      button: { type: int, min: 1, max: 10, required: true }
      state:  { type: enum, values: ["1", "2", "3", "4", "7", "9", "10"], required: true }
    send: "{button},{state}X"
    returns: none

  tenscene_zone_button_state:
    summary: "10Scene button press or release in zone 1-20; state 1 pressed, 2 activate, 3 release, 4 toggle, 7 cycle, 9 increase, 10 decrease (\"<zone>,<button>,<state>X\")"
