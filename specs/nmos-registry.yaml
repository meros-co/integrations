quirks:
  - models: [all]
    severity: info
    text: >
      A registry has no standard port: open it with the Query API's port from its
      _nmos-query._tcp advertisement or its configuration: discovery finds it by
      mDNS (mdns) and, on a network that advertises it in unicast DNS, by
      DNS-SD over the site's DNS servers (dns-sd). State comes from six
      non-persistent websocket subscriptions, one per resource type; each starts
      with the whole list, so a reconnection leaves nothing stale. The Query API
      is read only: the IS-05 commands (connect_receiver and the rest) find each
      Node's Connection API through the registry, from the resource's Device's
      controls, and make the connection there, so routing needs no device per
      Node; a Node can also be opened with nmos-node for its full IS-05, IS-07
      and IS-08 control.

  - models: [all]
    severity: info
    text: >
      A registry pages its answers, newest first (the default page size is
      its own, docs/APIs - Query Parameters.md): the list commands follow
      each answer's Link rel="prev" to older resources until a page is
      empty, and return every resource; query_resources answers the one
      page its paging.since, paging.until and paging.limit name. The
      subscriptions are not paged.
