spec: 1
id: nmos-registry
name: AMWA NMOS registry (IS-04 Query API with websocket subscriptions, IS-05 connections through it)
vendor: AMWA (NMOS specifications; any NMOS registry)
category: router

source:
  - title: AMWA IS-05 NMOS Device Connection Management Specification v1.1.2
    author: Advanced Media Workflow Association (AMWA)
    url: https://specs.amwa.tv/is-05/v1.1.2/
    note: >
      Apache 2.0 specification, for the IS-05 commands the extension answers:
      APIs/ConnectionAPI.raml (single/receivers and single/senders, their
      staged PATCH and active GET), receiver-stage-schema.json and
      sender-stage-schema.json, activation-schema.json (activate_immediate),
      and docs "Interoperability - IS-04" (the Device's
      urn:x-nmos:control:sr-ctrl/<version> control naming the Connection API,
      and the Sender's manifest_href as its transport file).
  - title: AMWA IS-04 NMOS Discovery and Registration Specification v1.3.3
    author: Advanced Media Workflow Association (AMWA)
    url: https://specs.amwa.tv/is-04/v1.3.3/
    note: >
      Apache 2.0 specification, the source of every request and resource field
      here: APIs/QueryAPI.raml (/nodes, /devices, /sources, /flows, /senders,
      /receivers and their single resources, /subscriptions with its POST, GET
      and DELETE), the subscription request, response and websocket grain
      schemas, the resource schemas (resource_core, node, device, source, flow,
      sender, receiver), docs/APIs - Query Parameters.md (basic queries and
      paging), docs/Behaviour - Querying.md (subscriptions, the sync grain on
      connecting, non-persistent subscriptions removed with their last client),
      docs/Discovery - Registered Operation.md (the _nmos-query._tcp
      advertisement with api_proto, api_ver, api_auth and pri). Repository
      https://github.com/AMWA-TV/is-04 at tag v1.3.3.

transport:
  type: http
  port: null
  scheme: { setting: scheme }
  accept_invalid_certs: true
  # IS-10 authorization, where a registry uses it.
  auth: bearer
  # IS-10: 401 is a token refused; 403 a scope missing or a request refused
  # (deleting a non-persistent subscription), which fails that request only.
  refusal_status: [401]
  timeout_ms: 5000
  probe: { method: GET, path: /x-nmos/query }

# The websocket of each subscription is named by the answer that creates it,
# which the format cannot follow.
extension: nmos-query-websocket

settings:
  scheme:
    type: enum
    values: [http, https]
    default: http
    label: Protocol
    description: "http, or https for a registry served over TLS (BCP-003-01); its api_proto TXT record says which."
  token:
    type: string
    secret: true
    default: ""
    label: Access token
    description: "An IS-10 bearer token for a registry that requires authorization (TXT api_auth true), sent with every request and websocket; empty sends none."
  query_version:
    type: enum
    values: [v1.3, v1.2, v1.1, v1.0]
    default: v1.3
    label: Query API version
    description: "The Query API version to use, one the registry lists in its api_ver TXT record or at /x-nmos/query; resources are answered in that version."
  max_update_rate_ms:
    type: int
    min: 0
    max: 60000
    default: 100
    label: Update interval
    description: "The shortest time between two updates the registry sends on a subscription, in milliseconds; 0 sends each change as it happens."

ports:
  - { port: null, protocol: http, role: control, note: "the Query API port has no standard number: it is given when the registry is opened, from its _nmos-query._tcp SRV record or its configuration" }
  - { port: null, protocol: http, role: control, note: "each Node's Connection API (IS-05), at the address its Device's sr-ctrl control names, for the IS-05 commands; and a Sender's manifest_href for its transport file" }
  - { port: null, protocol: ws, role: push, note: "each subscription's websocket, at the ws_href the registry names (usually the Query API's port)" }
  - { port: 5353, protocol: udp, role: discovery, note: "mDNS / DNS-SD: _nmos-query._tcp" }
  - { port: 53, protocol: udp, role: discovery, note: "unicast DNS-SD: _nmos-query._tcp in the site's DNS domain, asked of its DNS servers" }
models:
  - id: registry
    name: Any AMWA NMOS registry (IS-04 Query API v1.0 to v1.3)
    supports:
      - get_nodes
      - get_node
      - get_devices
      - get_device
      - get_sources
      - get_source
      - get_flows
      - get_flow
      - get_senders
      - get_sender
      - get_receivers
      - get_receiver
      - query_resources
      - list_subscriptions
      - get_subscription
      - create_subscription
      - delete_subscription
      - connect_receiver
      - disconnect_receiver
      - stage_receiver
      - stage_sender
      - get_receiver_active
      - get_sender_active
    verification: none
    notes: >
      A registry of any vendor, such as nmos-cpp's, Sony's NMOS registry or
      an orchestration system's. It reports every Node registered with it; the
      Nodes themselves are controlled with nmos-node.
commands:
  get_nodes:
    summary: "List the registry's nodes (GET /nodes), every page"
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/nodes", pages: &pages { items: "$", next: { header: Link, rel: prev } } }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /nodes

  get_node:
    summary: "Read one Node (GET /nodes/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Node id, description: "The Node's id, a UUID." }
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/nodes/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /nodes/{id}

  get_devices:
    summary: "List the registry's devices (GET /devices), every page"
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/devices", pages: *pages }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /devices

  get_device:
    summary: "Read one Device (GET /devices/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Device id, description: "The Device's id, a UUID." }
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/devices/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /devices/{id}

  get_sources:
    summary: "List the registry's sources (GET /sources), every page"
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/sources", pages: *pages }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /sources

  get_source:
    summary: "Read one Source (GET /sources/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Source id, description: "The Source's id, a UUID." }
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/sources/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /sources/{id}

  get_flows:
    summary: "List the registry's flows (GET /flows), every page"
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/flows", pages: *pages }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /flows

  get_flow:
    summary: "Read one Flow (GET /flows/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Flow id, description: "The Flow's id, a UUID." }
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/flows/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /flows/{id}

  get_senders:
    summary: "List the registry's senders (GET /senders), every page"
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/senders", pages: *pages }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /senders

  get_sender:
    summary: "Read one Sender (GET /senders/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id, description: "The Sender's id, a UUID." }
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/senders/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /senders/{id}

  get_receivers:
    summary: "List the registry's receivers (GET /receivers), every page"
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/receivers", pages: *pages }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /receivers

  get_receiver:
    summary: "Read one Receiver (GET /receivers/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id, description: "The Receiver's id, a UUID." }
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/receivers/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /receivers/{id}

  query_resources:
    summary: "Query resources of one type with the Query API's query parameters (basic queries such as label=Camera%201, paging.since, paging.limit)"
    params:
      type: { type: enum, values: [nodes, devices, sources, flows, senders, receivers], required: true,
        label: Resource type, description: "The resources to query." }
      query: { type: string, required: true, max_length: 2048, pattern: "^[A-Za-z0-9._~%:=&,()!*'+-]+$",
        label: Query, description: "The query string, percent-encoded, without the question mark, such as label=Camera%201 or paging.limit=100&paging.since=0:0." }
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/{type}", raw_query: "{query}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # docs/APIs - Query Parameters.md

  list_subscriptions:
    summary: "List the registry's subscriptions (GET /subscriptions)"
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/subscriptions" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /subscriptions

  get_subscription:
    summary: "Read one subscription (GET /subscriptions/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Subscription id, description: "The subscription's id, a UUID." }
    send: { method: GET, path: "/x-nmos/query/{settings.query_version}/subscriptions/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # QueryAPI.raml /subscriptions/{subscriptionId}

  create_subscription:
    summary: "Create a subscription for another client (POST /subscriptions) and return it, with its ws_href"
    params:
      resource_path: { type: enum, values: ["/nodes", "/devices", "/sources", "/flows", "/senders", "/receivers"], required: true,
        label: Resources, description: "The resource type the subscription reports." }
      persist: { type: bool, default: false,
        label: Persistent, description: "On keeps the subscription when no client is connected, until it is deleted." }
      max_update_rate_ms: { type: int, min: 0, max: 60000, default: 100,
        label: Update interval, description: "The shortest time between two updates, in milliseconds." }
      secure: { type: bool, default: false,
        label: Secure, description: "On asks for a wss websocket, for a registry served over https." }
      params: { type: json, default: {},
        label: Filter, description: "Basic query parameters filtering the resources, an object of strings, as the IS-04 subscription request schema gives it." }
    send: { method: POST, path: "/x-nmos/query/{settings.query_version}/subscriptions", content_type: application/json,
            body: '{"max_update_rate_ms":{max_update_rate_ms},"resource_path":"{resource_path}","params":{params},"persist":{persist},"secure":{secure}}' }
    expect: { status: [200, 201], json_path: "$" }
    returns: value
    # queryapi-subscriptions-post-request.json, queryapi-subscription-response.json

  delete_subscription:
    summary: "Delete a persistent subscription (DELETE /subscriptions/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Subscription id, description: "The subscription's id, a UUID." }
    send: { method: DELETE, path: "/x-nmos/query/{settings.query_version}/subscriptions/{id}" }
    expect: { status: [200, 204] }
    returns: ack
    # QueryAPI.raml: 204, or 403 for a non-persistent subscription

  # IS-05 on each Node, answered by the nmos-query-websocket extension: it
  # finds the Node's Connection API through the registry (the resource's
  # Device and its urn:x-nmos:control:sr-ctrl control) and makes the request
  # there. The registry's receivers state follows through its subscription.
  connect_receiver:
    summary: "Connect a Receiver to a Sender at once: finds the Receiver's Connection API and the Sender's transport file (manifest_href) through the registry, then PATCH staged with activate_immediate (IS-05); returns the staged parameters the Node answers"
    params:
      receiver_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id, description: "The Receiver to connect, a UUID as receivers.<id> in state lists it." }
      sender_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id, description: "The Sender to receive, a UUID as senders.<id> in state lists it." }
    returns: value
  disconnect_receiver:
    summary: "Disconnect a Receiver at once (no Sender, master enable off) on its Node's Connection API, found through the registry; returns the staged parameters the Node answers"
    params:
      receiver_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id, description: "The Receiver to disconnect, a UUID as receivers.<id> in state lists it." }
    returns: value
  stage_receiver:
    summary: "Stage a Receiver's parameters and activation as the IS-05 receiver-stage-schema gives them (scheduled activations, transport parameters, cancelling one) on its Node, found through the registry"
    params:
      receiver_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id, description: "The Receiver to change, a UUID as receivers.<id> in state lists it." }
      staged: { type: json, required: true, label: Staged parameters,
        description: "The PATCH body in the shape of the IS-05 receiver-stage-schema: sender_id, master_enable, activation, transport_file and transport_params." }
    returns: value
  stage_sender:
    summary: "Stage a Sender's parameters and activation as the IS-05 sender-stage-schema gives them (master enable, receiver_id, transport parameters) on its Node, found through the registry"
    params:
      sender_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id, description: "The Sender to change, a UUID as senders.<id> in state lists it." }
      staged: { type: json, required: true, label: Staged parameters,
        description: "The PATCH body in the shape of the IS-05 sender-stage-schema: receiver_id, master_enable, activation and transport_params." }
    returns: value
  get_receiver_active:
    summary: "Read a Receiver's active IS-05 parameters (GET single/receivers/{id}/active) on its Node, found through the registry"
    params:
      receiver_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id, description: "The Receiver to read, a UUID as receivers.<id> in state lists it." }
    returns: value
  get_sender_active:
    summary: "Read a Sender's active IS-05 parameters (GET single/senders/{id}/active) on its Node, found through the registry"
    params:
      sender_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id, description: "The Sender to read, a UUID as senders.<id> in state lists it." }
    returns: value
telemetry:
  # The nmos-query-websocket extension subscribes to each resource type and
  # offers every update as {"nmos": <type>, "op": sync, set or delete, ...}:
  # sync with every resource on (re)connecting, set with those changed,
  # delete with the ids gone.
  updates:
    - json_match: { "$.nmos": "^nodes$", "$.op": "^sync$" }
      replace: nodes
    - json_match: { "$.nmos": "^nodes$", "$.op": "^(sync|set)$" }
      json_each: "$.items"
      json: { rid: "$.id", label: "$.label", description: "$.description", version: "$.version", tags: "$.tags", resource: "$", hostname: "$.hostname", href: "$.href", api_versions: "$.api.versions", api_endpoints: "$.api.endpoints", caps: "$.caps", services: "$.services", clocks: "$.clocks", interfaces: "$.interfaces" }
      state:
        "nodes.{rid:key}.label": "{label}"
        "nodes.{rid:key}.description": "{description}"
        "nodes.{rid:key}.version": "{version}"
        "nodes.{rid:key}.tags": "{tags}"
        "nodes.{rid:key}.resource": "{resource}"
        "nodes.{rid:key}.hostname": "{hostname}"
        "nodes.{rid:key}.href": "{href}"
        "nodes.{rid:key}.api_versions": "{api_versions}"
        "nodes.{rid:key}.api_endpoints": "{api_endpoints}"
        "nodes.{rid:key}.caps": "{caps}"
        "nodes.{rid:key}.services": "{services}"
        "nodes.{rid:key}.clocks": "{clocks}"
        "nodes.{rid:key}.interfaces": "{interfaces}"
    - json_match: { "$.nmos": "^nodes$", "$.op": "^delete$" }
      json_each: "$.ids"
      each_match: { "$": "^(.+)$" }
      json: {}
      state: { "nodes.{1:key}": { delete: true } }
    - json_match: { "$.nmos": "^devices$", "$.op": "^sync$" }
      replace: devices
    - json_match: { "$.nmos": "^devices$", "$.op": "^(sync|set)$" }
      json_each: "$.items"
      json: { rid: "$.id", label: "$.label", description: "$.description", version: "$.version", tags: "$.tags", resource: "$", type: "$.type", node_id: "$.node_id", controls: "$.controls" }
      state:
        "devices.{rid:key}.label": "{label}"
        "devices.{rid:key}.description": "{description}"
        "devices.{rid:key}.version": "{version}"
        "devices.{rid:key}.tags": "{tags}"
        "devices.{rid:key}.resource": "{resource}"
        "devices.{rid:key}.type": "{type}"
        "devices.{rid:key}.node_id": "{node_id}"
        "devices.{rid:key}.controls": "{controls}"
    - json_match: { "$.nmos": "^devices$", "$.op": "^delete$" }
      json_each: "$.ids"
      each_match: { "$": "^(.+)$" }
      json: {}
      state: { "devices.{1:key}": { delete: true } }
    - json_match: { "$.nmos": "^sources$", "$.op": "^sync$" }
      replace: sources
    - json_match: { "$.nmos": "^sources$", "$.op": "^(sync|set)$" }
      json_each: "$.items"
      json: { rid: "$.id", label: "$.label", description: "$.description", version: "$.version", tags: "$.tags", resource: "$", format: "$.format", device_id: "$.device_id", clock_name: "$.clock_name", grain_rate: "$.grain_rate", caps: "$.caps", parents: "$.parents", channels: "$.channels" }
      state:
        "sources.{rid:key}.label": "{label}"
        "sources.{rid:key}.description": "{description}"
        "sources.{rid:key}.version": "{version}"
        "sources.{rid:key}.tags": "{tags}"
        "sources.{rid:key}.resource": "{resource}"
        "sources.{rid:key}.format": "{format}"
        "sources.{rid:key}.device_id": "{device_id}"
        "sources.{rid:key}.clock_name": "{clock_name}"
        "sources.{rid:key}.grain_rate": "{grain_rate}"
        "sources.{rid:key}.caps": "{caps}"
        "sources.{rid:key}.parents": "{parents}"
        "sources.{rid:key}.channels": "{channels}"
    - json_match: { "$.nmos": "^sources$", "$.op": "^(sync|set)$" }
      json_each: "$.items"
      each_match: { "$.clock_name": "^null$" }
      json: { rid: "$.id" }
      state: { "sources.{rid:key}.clock_name": "" }
    - json_match: { "$.nmos": "^sources$", "$.op": "^delete$" }
      json_each: "$.ids"
      each_match: { "$": "^(.+)$" }
      json: {}
      state: { "sources.{1:key}": { delete: true } }
    - json_match: { "$.nmos": "^flows$", "$.op": "^sync$" }
      replace: flows
    - json_match: { "$.nmos": "^flows$", "$.op": "^(sync|set)$" }
      json_each: "$.items"
      json: { rid: "$.id", label: "$.label", description: "$.description", version: "$.version", tags: "$.tags", resource: "$", format: "$.format", source_id: "$.source_id", device_id: "$.device_id", media_type: "$.media_type", grain_rate: "$.grain_rate", frame_width: "$.frame_width", frame_height: "$.frame_height", interlace_mode: "$.interlace_mode", colorspace: "$.colorspace", transfer_characteristic: "$.transfer_characteristic", sample_rate: "$.sample_rate", bit_depth: "$.bit_depth", parents: "$.parents" }
      state:
        "flows.{rid:key}.label": "{label}"
        "flows.{rid:key}.description": "{description}"
        "flows.{rid:key}.version": "{version}"
        "flows.{rid:key}.tags": "{tags}"
        "flows.{rid:key}.resource": "{resource}"
        "flows.{rid:key}.format": "{format}"
        "flows.{rid:key}.source_id": "{source_id}"
        "flows.{rid:key}.device_id": "{device_id}"
        "flows.{rid:key}.media_type": "{media_type}"
        "flows.{rid:key}.grain_rate": "{grain_rate}"
        "flows.{rid:key}.frame_width": "{frame_width}"
        "flows.{rid:key}.frame_height": "{frame_height}"
        "flows.{rid:key}.interlace_mode": "{interlace_mode}"
        "flows.{rid:key}.colorspace": "{colorspace}"
        "flows.{rid:key}.transfer_characteristic": "{transfer_characteristic}"
        "flows.{rid:key}.sample_rate": "{sample_rate}"
        "flows.{rid:key}.bit_depth": "{bit_depth}"
        "flows.{rid:key}.parents": "{parents}"
    - json_match: { "$.nmos": "^flows$", "$.op": "^delete$" }
      json_each: "$.ids"
      each_match: { "$": "^(.+)$" }
      json: {}
      state: { "flows.{1:key}": { delete: true } }
    - json_match: { "$.nmos": "^senders$", "$.op": "^sync$" }
      replace: senders
    - json_match: { "$.nmos": "^senders$", "$.op": "^(sync|set)$" }
      json_each: "$.items"
