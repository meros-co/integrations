spec: 1
id: motu-avb
name: MOTU AVB interfaces (Datastore API)
vendor: MOTU
category: mixer

# MOTU's AVB interfaces keep every setting in a datastore served over HTTP:
# GET /datastore returns every path and its value, GET /datastore/<path> one
# value or subtree, and PATCH (or POST) /datastore/<path> with a form field
# json={"value": ...} changes it. Paths are slash-separated and every index
# counts from 0; the commands here count from 1. Which paths exist depends on
# the model, its firmware and its mixer: GET /datastore shows them all, and
# state keeps every one.
source:
  - title: "MOTU AVB Datastore API (PDF, 2015-06-10; API 0.0.0, router 0.2.0, mixer 1.0)"
    author: MOTU
    url: https://cdn-data.motu.com/downloads/audio/AVB/docs/MOTU%20AVB%20Web%20API.pdf
    note: >
      Manufacturer document. JSON over HTTP: /apiversion, GET of the whole
      datastore, a subtree or a path; PATCH or POST with a form-encoded json
      field; ETags and long polling with If-None-Match and a 15 s hold;
      client ids; types (string, real, int, semver with list, pair, opt, bool
      and enum modifiers) and permissions; per-section versions under
      ext/caps; placeholders that differ by model; and the path table (avb,
      ext router, mix mixer) with ranges and units.
  - title: "Open Sound Control Quick Reference for MOTU AVB Interfaces (PDF, 2015-06-10)"
    author: MOTU
    url: https://cdn-data.motu.com/downloads/audio/AVB/docs/OSC%20Quick%20Reference.pdf
    note: >
      Manufacturer document. The same writable paths over OSC on a UDP port
      the device assigns; set only, with no replies. Not used here: HTTP does
      everything OSC does and reads too.

transport:
  type: http
  port: 80
  scheme: http
  auth: none
  timeout_ms: 4000
  probe: { method: GET, path: /apiversion }

ports:
  - { port: 80, protocol: http, role: control }

maps:
  shelf_mode: { shelf: "0", parametric: "1" }
  detection: { rms: "0", peak: "1" }

models:
  - id: motu-avb
    name: MOTU AVB interface (1248, 8M, 16A, 24Ai, 24Ao, 112D, 624, 8A, Monitor 8, UltraLite AVB, Stage-B16 and others)
    supports:
