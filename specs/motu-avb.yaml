    notes: >
      One model: every MOTU AVB interface serves the same API, and what it
      has (banks, channels, mixer, vLimit, MADI, optical) shows in its
      datastore.

commands:
  set_channel_fader:
    summary: "Set the fader of a mixer input channel (mix/chan/<n>/matrix/fader)"
    params:
      index: { type: int, min: 1, max: 128, required: true, label: "Channel", description: "Mixer input channel, from 1." }
      level: { type: float, min: 0.0, max: 4.0, required: true, label: "Level", description: "Level as a linear gain, 0 (-inf) to 4 (+12 dB); 1 is unity." }
    send: { method: PATCH, path: "/datastore/mix/chan/{index:-1}/matrix/fader", body: "json=%7B%22value%22%3A{level:.4f}%7D", content_type: application/x-www-form-urlencoded }
    expect: { status: [200, 204] }
    returns: ack

  set_channel_mute:
    summary: "Mute or unmute a mixer input channel (mix/chan/<n>/matrix/mute)"
    params:
      index: { type: int, min: 1, max: 128, required: true, label: "Channel", description: "Mixer input channel, from 1." }
      muted: { type: bool, required: true, label: "Muted", description: "On mutes, off unmutes." }
    send: { method: PATCH, path: "/datastore/mix/chan/{index:-1}/matrix/mute", body: "json=%7B%22value%22%3A{muted:bool01}%7D", content_type: application/x-www-form-urlencoded }
    expect: { status: [200, 204] }
    returns: ack

  set_channel_enabled:
    summary: "Turn a mixer input channel on or off in the mixer (mix/chan/<n>/matrix/enable)"
    params:
      index: { type: int, min: 1, max: 128, required: true, label: "Channel", description: "Mixer input channel, from 1." }
      enabled: { type: bool, required: true, label: "Enabled", description: "On enables it, off disables it." }
    send: { method: PATCH, path: "/datastore/mix/chan/{index:-1}/matrix/enable", body: "json=%7B%22value%22%3A{enabled:bool01}%7D", content_type: application/x-www-form-urlencoded }
    expect: { status: [200, 204] }
    returns: ack

  set_main_fader:
