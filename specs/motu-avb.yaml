    summary: "Set any writable datastore path to a JSON value (PATCH /datastore/<path>), in the path's type"
    params:
      path: { type: string, max_length: 256, pattern: "^[A-Za-z0-9_.]+(/[A-Za-z0-9_.]+)*$", required: true, label: "Path", description: "The datastore path without a leading slash, such as mix/chan/0/matrix/fader (indexes from 0)." }
      value: { type: string, max_length: 1024, pattern: "^[^\\x00-\\x1f]+$", required: true, label: "Value", description: "The value as JSON text in the path's type: a number such as 0.5, or a quoted string such as 'ADAT A' or '0:3' written with double quotes." }
    send: { method: PATCH, path: "/datastore/{path:path}", body: "json=%7B%22value%22%3A{value:url}%7D", content_type: application/x-www-form-urlencoded }
    expect: { status: [200, 204] }
    returns: ack

  get_value:
    summary: "Read a datastore path or subtree (GET /datastore/<path>); a path returns {value}, a subtree its keys"
    params:
      path: { type: string, max_length: 256, pattern: "^[A-Za-z0-9_.]+(/[A-Za-z0-9_.]+)*$", required: true, label: "Path", description: "The datastore path or subtree without a leading slash, such as mix/chan/16/gate." }
    send: { method: GET, path: "/datastore/{path:path}" }
    expect: { status: 200, json_path: "$" }
    returns: value

quirks:
  - models: [all]
    severity: info
    text: >
      The datastore is read whole on connecting and every 5 seconds; state
      keeps every path as the device writes it (datastore, keyed by the path
      with its slashes), so a change made elsewhere shows within 5 s. MOTU's
      long poll (If-None-Match, held up to 15 s) is not used, since HTTP
      requests go one at a time and a held request would hold commands back.
      Opened for commands only, nothing is read.
  - models: [all]
    severity: warning
    text: >
      Paths, their ranges and their presence vary by model, firmware and
      mixer version (the document covers mixer 1.0); a path the device lacks
      is refused. Indexes in the commands count from 1 and are sent from 0.
      Faders and sends are linear gains from 0 to 4 (1 is unity). The values
      of monitor assign and override and of maxUSBToHost are not described by
      MOTU. A device acquired by another AVB controller (acquired_id) should
      not be changed. No authentication is documented. Error answers are not
      documented.

state:
  api_version: { type: string, description: "Datastore API version (/apiversion)" }
  datastore.*: { type: string, description: "Every datastore path and its value as text, keyed by the path (a key holding slashes), such as mix/chan/0/matrix/fader" }

telemetry:
  poll:
    - every_ms: 5000
      send:
        - { method: GET, path: /datastore }
    - send:
        - { method: GET, path: /apiversion }
  updates:
    - path: "^/apiversion$"
      match: "^\\s*(\\S+)\\s*$"
      state: { api_version: "{1}" }
    - path: "^/datastore$"
      json_each: "$.*"
      json: { value: "$" }
      state: { "datastore.{key:key}": "{value}" }
