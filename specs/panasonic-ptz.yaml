  lens_distortion_correction:
    summary: "Set lens distortion correction (LDC)"
    params:
      enabled: { type: bool, required: true, label: LDC, description: "On turns lens distortion correction (LDC) on, off turns it off." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:84:{enabled:bool01}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:84:[01]$" }
