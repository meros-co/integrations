  get_mirror:
    summary: "Query mirror (horizontal flip)"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:81", res: "1" } }
    expect: { status: 200, matches: "^OSJ:81:([01])$" }
