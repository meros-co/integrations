  get_preset_fall_ramp_time:
    summary: "Query the preset fall ramp time as sent, hex 01-64"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:AE", res: "1" } }
    expect: { status: 200, matches: "^OSJ:AE:([0-9A-F]{2})$" }
