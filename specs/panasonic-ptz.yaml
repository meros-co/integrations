      speed: { type: int, min: 1, max: 99, required: true, label: Zoom speed, description: "01 wide at full speed, 49 wide at the slowest, 50 stop, 51 tele at the slowest, 99 tele at full speed." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:9C:{speed:02d}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:9C:[0-9]{2}$" }
    returns: ack

  crop_zoom_speed_yl:
    summary: "Zoom the YL crop at a speed (50 stops)"
    params:
      speed: { type: int, min: 1, max: 99, required: true, label: Zoom speed, description: "01 wide at full speed, 49 wide at the slowest, 50 stop, 51 tele at the slowest, 99 tele at full speed." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:9D:{speed:02d}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:9D:[0-9]{2}$" }
    returns: ack

  crop_zoom_speed_g:
    summary: "Zoom the G crop at a speed (50 stops)"
    params:
      speed: { type: int, min: 1, max: 99, required: true, label: Zoom speed, description: "01 wide at full speed, 49 wide at the slowest, 50 stop, 51 tele at the slowest, 99 tele at full speed." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:9E:{speed:02d}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:9E:[0-9]{2}$" }
    returns: ack

  crop_zoom_speed_mg:
    summary: "Zoom the MG crop at a speed (50 stops)"
    params:
      speed: { type: int, min: 1, max: 99, required: true, label: Zoom speed, description: "01 wide at full speed, 49 wide at the slowest, 50 stop, 51 tele at the slowest, 99 tele at full speed." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:9F:{speed:02d}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:9F:[0-9]{2}$" }
    returns: ack

  crop_zoom_speed_all:
    summary: "Zoom the YL, G and MG crops at once, each at its own speed (50 stops)"
    params:
      yl: { type: int, min: 1, max: 99, required: true, label: YL zoom speed, description: "01 wide at full speed, 49 wide at the slowest, 50 stop, 51 tele at the slowest, 99 tele at full speed." }
      g: { type: int, min: 1, max: 99, required: true, label: G zoom speed, description: "01 wide at full speed, 49 wide at the slowest, 50 stop, 51 tele at the slowest, 99 tele at full speed." }
      mg: { type: int, min: 1, max: 99, required: true, label: MG zoom speed, description: "01 wide at full speed, 49 wide at the slowest, 50 stop, 51 tele at the slowest, 99 tele at full speed." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:A1:{yl:02d}:{g:02d}:{mg:02d}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:A1(?::[0-9]{2}){3}$" }
    returns: ack

  crop_zoom_ratios:
    summary: "Set the zoom ratios of the YL, G and MG crops at once"
    params:
      yl: { type: string, pattern: "^(?:02E[E-F][0-9A-F]|02F[0-9A-F]{2}|0[3-9A-B][0-9A-F]{3}|0C[0-2][0-9A-F]{2}|0C3[0-4][0-9A-F]|0C350)$", required: true, label: YL zoom ratio, description: "Crop zoom ratio in hundredths of a percent as 5-digit hex, 02EE0 (120.00%) to 0C350 (500.00%)." }
      g: { type: string, pattern: "^(?:02E[E-F][0-9A-F]|02F[0-9A-F]{2}|0[3-9A-B][0-9A-F]{3}|0C[0-2][0-9A-F]{2}|0C3[0-4][0-9A-F]|0C350)$", required: true, label: G zoom ratio, description: "Crop zoom ratio in hundredths of a percent as 5-digit hex, 02EE0 (120.00%) to 0C350 (500.00%)." }
      mg: { type: string, pattern: "^(?:02E[E-F][0-9A-F]|02F[0-9A-F]{2}|0[3-9A-B][0-9A-F]{3}|0C[0-2][0-9A-F]{2}|0C3[0-4][0-9A-F]|0C350)$", required: true, label: MG zoom ratio, description: "Crop zoom ratio in hundredths of a percent as 5-digit hex, 02EE0 (120.00%) to 0C350 (500.00%)." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:9B:{yl}:{g}:{mg}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:9B(?::[0-9A-F]{5}){3}$" }
    returns: ack

  get_crop_zoom_ratios:
    summary: "Query the zoom ratios of the YL, G and MG crops"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:9B", res: "1" } }
    expect: { status: 200, matches: "^OSJ:9B:([0-9A-F]{5}:[0-9A-F]{5}:[0-9A-F]{5})$" }
    returns: value

  crop_position_zoom_speed:
    summary: "Move and zoom the YL, G and MG crops at once, each axis at its own speed (50 stops)"
    params:
      yl_h: { type: int, min: 1, max: 99, required: true, label: YL horizontal speed, description: "01 left at full speed, 50 stop, 99 right at full speed." }
      yl_v: { type: int, min: 1, max: 99, required: true, label: YL vertical speed, description: "01 down at full speed, 50 stop, 99 up at full speed." }
      g_h: { type: int, min: 1, max: 99, required: true, label: G horizontal speed, description: "01 left at full speed, 50 stop, 99 right at full speed." }
      g_v: { type: int, min: 1, max: 99, required: true, label: G vertical speed, description: "01 down at full speed, 50 stop, 99 up at full speed." }
      mg_h: { type: int, min: 1, max: 99, required: true, label: MG horizontal speed, description: "01 left at full speed, 50 stop, 99 right at full speed." }
      mg_v: { type: int, min: 1, max: 99, required: true, label: MG vertical speed, description: "01 down at full speed, 50 stop, 99 up at full speed." }
      yl_zoom: { type: int, min: 1, max: 99, required: true, label: YL zoom speed, description: "01 wide at full speed, 49 wide at the slowest, 50 stop, 51 tele at the slowest, 99 tele at full speed." }
      g_zoom: { type: int, min: 1, max: 99, required: true, label: G zoom speed, description: "01 wide at full speed, 49 wide at the slowest, 50 stop, 51 tele at the slowest, 99 tele at full speed." }
      mg_zoom: { type: int, min: 1, max: 99, required: true, label: MG zoom speed, description: "01 wide at full speed, 49 wide at the slowest, 50 stop, 51 tele at the slowest, 99 tele at full speed." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:C2:{yl_h:02d}:{yl_v:02d}:{g_h:02d}:{g_v:02d}:{mg_h:02d}:{mg_v:02d}:{yl_zoom:02d}:{g_zoom:02d}:{mg_zoom:02d}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:C2(?::[0-9]{2}){9}$" }
    returns: ack

  get_crop_positions_and_zoom:
    summary: "Query the positions and zoom ratios of the YL, G and MG crops in one reply"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:C3", res: "1" } }
    expect: { status: 200, matches: "^OSJ:C3:((?:[0-9A-F]{3}:){6}[0-9A-F]{5}:[0-9A-F]{5}:[0-9A-F]{5})$" }
    returns: value

  preset_crop:
    summary: "Set whether presets store the crop"
    params:
      enabled: { type: bool, required: true, label: Preset crop, description: "On turns whether presets store the crop on, off turns it off." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:2A:{enabled:bool01}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:2A:[01]$" }
    returns: ack

  get_preset_crop:
    summary: "Query whether presets store the crop"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:2A", res: "1" } }
    expect: { status: 200, matches: "^OSJ:2A:([01])$" }
    returns: value

  smart_picture_flip:
    summary: "Set smart picture flip"
    params:
      mode: { type: int, min: 0, max: 1, required: true, label: Smart picture flip, description: "0 off, 1 auto." }
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#SPF{mode}", res: "1" } }
    expect: { status: 200, matches: "^sPF[0-1]$" }
    returns: ack

  get_smart_picture_flip:
    summary: "Query smart picture flip"
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#SPF", res: "1" } }
    expect: { status: 200, matches: "^sPF([0-1])$" }
    returns: value

  flip_detect_angle:
    summary: "Set the tilt angle at which smart picture flip turns the picture"
    params:
      angle: { type: string, pattern: "^(?:3[C-F]|[4-6][0-9A-F]|7[0-8])$", required: true, label: Flip detect angle, description: "Angle in degrees, 3C (60) to 78 (120), as 2-digit hex 3C-78." }
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#FDA{angle}", res: "1" } }
    expect: { status: 200, matches: "^fDA[0-9A-F]{2}$" }
    returns: ack

  get_flip_detect_angle:
    summary: "Query the tilt angle at which smart picture flip turns the picture"
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#FDA", res: "1" } }
    expect: { status: 200, matches: "^fDA([0-9A-F]{2})$" }
    returns: value

  get_flip_status:
    summary: "Query whether the picture is flipped"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QFS", res: "1" } }
    expect: { status: 200, matches: "^OFS:([0-1])$" }
    returns: value

