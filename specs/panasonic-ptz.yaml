    params:
      enabled: { type: bool, required: true, label: Store digital extender, description: "On turns storing the digital extender in presets on, off turns it off." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSE:7C:{enabled:bool01}", res: "1" } }
    expect: { status: 200, matches: "^OSE:7C:[01]$" }
    returns: ack
  get_preset_digital_extender:
