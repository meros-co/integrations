    returns: value
  preset_rise_s_curve:
    summary: "Set the preset rise s curve, hex 00-1E for 0-30. Manual acceleration only"
    params:
      value: { type: string, pattern: "^(?:0[0-9A-F]|1[0-9A-E])$", required: true, label: Rise S-curve, description: "Two-digit hex 00-1E for 0 to 30; manual acceleration only." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:A9:{value}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:A9:[0-9A-F]{2}$" }
    returns: ack
  get_preset_rise_s_curve:
    summary: "Query the preset rise s curve as sent, hex 00-1E"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:A9", res: "1" } }
    expect: { status: 200, matches: "^OSJ:A9:([0-9A-F]{2})$" }
    returns: value
