    - match: "^OSD:95:([0-9A-F]{2})$"
      state:
        "color_correction.cy_b.phase": "{1}"
    - match: "^OSD:96:([0-9A-F]{2})$"
      state:
        "color_correction.b.saturation": "{1}"
    - match: "^OSD:97:([0-9A-F]{2})$"
      state:
