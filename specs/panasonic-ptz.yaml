      enabled: { type: bool, required: true, label: Store iris, description: "On turns storing the iris in presets on, off turns it off." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:5B:{enabled:bool01}", res: "1" } }
