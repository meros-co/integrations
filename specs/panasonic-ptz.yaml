    - match: "^OSD:9C:([0-9A-F]{2})$"
      state:
        "color_correction.r_r_yl.saturation": "{1}"
    - match: "^OSD:9D:([0-9A-F]{2})$"
      state:
        "color_correction.r_r_yl.phase": "{1}"
    - match: "^OSD:88:([0-9A-F]{2})$"
      state:
        "color_correction.r_yl.saturation": "{1}"
    - match: "^OSD:89:([0-9A-F]{2})$"
      state:
        "color_correction.r_yl.phase": "{1}"
    - match: "^OSD:9E:([0-9A-F]{2})$"
      state:
        "color_correction.r_yl_yl.saturation": "{1}"
    - match: "^OSD:9F:([0-9A-F]{2})$"
