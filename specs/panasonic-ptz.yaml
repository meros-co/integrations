  preset_name_mode:
    summary: "Set whether a preset's name is reset or held when it is saved: 0 reset, 1 hold"
    params:
      mode: { type: int, min: 0, max: 1, required: true, label: Name mode, description: "0 resets a preset's name when it is saved, 1 holds it." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:2C:{mode}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:2C:[0-1]$" }
