    expect: { status: 200, matches: "^OSJ:D5:([01])$" }
    returns: value
  preset_zoom_mode:
    summary: "Set the preset zoom mode: 0 mode_a, 1 mode_b"
    params:
      mode: { type: int, min: 0, max: 1, required: true, label: Zoom mode, description: "0 mode A, 1 mode B, as the camera's menu defines them." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSE:7D:{mode}", res: "1" } }
