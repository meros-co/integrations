  get_lens_distortion_correction:
    summary: "Query lens distortion correction (LDC)"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:84", res: "1" } }
    expect: { status: 200, matches: "^OSJ:84:([01])$" }
    returns: value

  serial_protocol:
    summary: "Set the serial protocol"
    params:
      protocol: { type: int, min: 0, max: 1, required: true, label: Protocol, description: "0 Panasonic, 1 standard." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OVP:02:{protocol}", res: "1" } }
    expect: { status: 200, matches: "^OVP:02:[0-1]$" }
