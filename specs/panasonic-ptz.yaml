spec: 1
id: panasonic-ptz
name: Panasonic AW-series PTZ cameras
vendor: Panasonic
category: camera

# Transcribed from Panasonic's interface specifications. Every command is an
# HTTP GET of /cgi-bin/aw_ptz (pan-tilt head commands, '#'-prefixed, replies
# such as "p1") or /cgi-bin/aw_cam (camera commands, replies such as "DCB:1")
# with cmd=<command>&res=1; the reply body is the response text.
source:
  - title: "AW-UE80/UE50/UE40/UE30 HD/4K Integrated Camera Interface Specifications (2025-03-01)"
    author: Panasonic Entertainment & Communication Co., Ltd.
    url: https://eww.pass.panasonic.co.jp/pro-av/support/content/guide/DEF/UE80/AW-UE80UE50UE40_InterfaceSpecification_E.pdf
    note: >
      Manufacturer document. Command syntax and value ranges from chapter 9 (p.25-60), checked against each
      command's usage-example URL; per-model availability from chapter 8 (p.21-24) and chapter 9 remarks;
      transport and restrictions from chapter 4 (p.6-8); update notifications chapter 5 (p.9-12); special
      notification sequences chapter 6 (p.13-18); error returns chapter 7 (p.19-20).
  - title: "HD Integrated Camera Interface Specifications, version 1.07 (2017-01-10)"
    author: Panasonic Corporation
    url: https://eu.connect.panasonic.com/sites/default/files/media/document/2019-02/HDIntegratedCamera_InterfaceSpecifications-V1.07E.pdf
    note: >
      Manufacturer document for AW-HE40/HE50/HE60/HE65/HE70/HE120/HE130/UE70. Pan-tilt head commands from
      section 3.1 (p.6-27); camera commands from section 3.2 (p.28-150); per-model remarks in each table.

  - title: "HD/4K Integrated Camera Interface Specifications AW-UE150/AW-HE145 (2022-04-01)"
    author: Panasonic Connect Co., Ltd.
    url: https://eww.pass.panasonic.co.jp/pro-av/support/content/guide/DEF/UE150/AW-UE150HE145_InterfaceSpecification_E.pdf
    note: >
      Manufacturer document. Commands, value ranges and update notifications from chapter 9 (p.25-61);
      per-model availability (AW-UE150 or AW-HE145) from chapter 8 (p.21-24) and the "Only supported by
      AW-UE150" remarks. AW-UE155 is treated as an AW-UE150: Panasonic ships them one firmware with "no
      change of the functions or specifications" (AW-UE150 firmware notes).
  - title: "HD/4K Integrated Camera Interface Specifications AW-UE100 (2022)"
    author: Panasonic Connect Co., Ltd.
    url: https://eww.pass.panasonic.co.jp/pro-av/support/content/guide/DEF/UE100/AW-UE100_InterfaceSpecification_E.pdf
    note: >
      Manufacturer document. Commands and value ranges from chapter 9; menu table chapter 8.

transport:
  type: http
  port: 80
  scheme: http
  auth: none
  timeout_ms: 4000
  probe:
    method: GET
    path: /cgi-bin/aw_ptz
    query: { cmd: "#O", res: "1" }

# Update notifications (chapter 5): the camera pushes each changed setting,
# as the same response text a query returns, to a TCP port the client
# registers. The telemetry rules below handle replies and notifications alike.
extension: panasonic-update-notification

settings:
  notify_port: { type: int, min: 1, max: 65535, default: 31004, label: Notification port, description: "TCP port on this host that the camera connects to, once registered, to push each changed setting." }

ports:
  - { port: 80, protocol: http, role: control }
  - { port: 31004, protocol: tcp, role: notification, listener: core, note: "the camera connects to the core to push changes" }

