      value: { type: string, pattern: "^(?:0[1-9A-F]|[1-9A-F][0-9A-F])$", required: true, label: Rise acceleration, description: "Two-digit hex 01-FF for 1 to 255; manual acceleration only." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:AB:{value}", res: "1" } }
