      focus: { type: int, min: 0, max: 99, required: true }
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#HV1{pan:02d}{tilt:02d}{zoom:02d}{focus:02d}", res: "1" } }
    expect: { status: 200, matches: "^hV1[0-9]{8}$" }
    returns: ack
  ptzf_speed_fine:
    summary: "Pan, tilt and zoom at fine speeds (4-digit hex: 0000 no change, 7F00-8000 (stop)-8100) and focus at a speed (00 no change, 01-99, 50 stop)"
    params:
      pan: { type: string, pattern: "^(?:0000|(?:7F[0-9A-F][0-9A-F]|80[0-9A-F]{2}|8100))$", required: true }
      tilt: { type: string, pattern: "^(?:0000|(?:7F[0-9A-F][0-9A-F]|80[0-9A-F]{2}|8100))$", required: true }
      zoom: { type: string, pattern: "^(?:0000|(?:7F[0-9A-F][0-9A-F]|80[0-9A-F]{2}|8100))$", required: true }
      focus: { type: int, min: 0, max: 99, required: true }
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#HV2{pan}{tilt}{zoom}{focus:02d}", res: "1" } }
    expect: { status: 200, matches: "^hV2[0-9A-F]{14}$" }
    returns: ack
  ptzf_position:
    summary: "Move pan, tilt, zoom and focus to absolute positions: pan and tilt 4-digit hex, preset speed hex 00-1D, speed table 0-2, zoom 3-digit hex 555-FFF, zoom speed hex 01-64, focus 3-digit hex 555-FFF"
    params:
      pan: { type: string, pattern: "^[0-9A-F][0-9A-F]{3}$", required: true }
      tilt: { type: string, pattern: "^[0-9A-F][0-9A-F]{3}$", required: true }
      speed: { type: string, pattern: "^(?:0[0-9A-F]|1[0-9A-D])$", required: true }
      table: { type: int, min: 0, max: 2, required: true }
      zoom: { type: string, pattern: "^(?:55[5-9A-F]|5[6-9A-F][0-9A-F]|[6-9A-F][0-9A-F]{2})$", required: true }
      zoom_speed: { type: string, pattern: "^(?:0[1-9A-F]|[1-5][0-9A-F]|6[0-4])$", required: true }
      focus: { type: string, pattern: "^(?:55[5-9A-F]|5[6-9A-F][0-9A-F]|[6-9A-F][0-9A-F]{2})$", required: true }
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#HA1{pan}{tilt}{speed}{table}{zoom}{zoom_speed}{focus}", res: "1" } }
    expect: { status: 200, matches: "^hA1[0-9A-F]{19}$" }
    returns: ack
  menu:
    summary: "Open or close the camera menu"
    params:
      open: { type: bool, required: true }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "DUS:{open:bool01}", res: "1" } }
    expect: { status: 200, matches: "^DUS:[01]$" }
    returns: ack
  get_menu:
    summary: "Query whether the camera menu is open"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QUS", res: "1" } }
    expect: { status: 200, matches: "^OUS:([01])$" }
    returns: value
  menu_cancel:
    summary: "Cancel the unconfirmed menu setting. Menu open only"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "DPG:1", res: "1" } }
    expect: { status: 200, matches: "^DPG:1$" }
    returns: ack
  menu_enter:
    summary: "Enter the selected menu item. Menu open only"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "DIT:1", res: "1" } }
    expect: { status: 200, matches: "^DIT:1$" }
    returns: ack
  menu_up:
    summary: "Move the menu cursor up. Menu open only"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "DUP:1", res: "1" } }
    expect: { status: 200, matches: "^DUP:1$" }
    returns: ack
  menu_down:
    summary: "Move the menu cursor down. Menu open only"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "DDW:1", res: "1" } }
    expect: { status: 200, matches: "^DDW:1$" }
    returns: ack
  menu_right:
    summary: "Move the menu cursor right. Menu open only"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "DRT:1", res: "1" } }
    expect: { status: 200, matches: "^DRT:1$" }
    returns: ack
  menu_left:
    summary: "Move the menu cursor left. Menu open only"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "DLT:1", res: "1" } }
    expect: { status: 200, matches: "^DLT:1$" }
    returns: ack
  operation_lock:
    summary: "Lock operation from other controllers, with up to 40 characters of information"
    params:
      info: { type: string, max_length: 40, pattern: "^[ -~]{1,40}$", required: true }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:3E:{info}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:3E:.*$" }
    returns: ack
  release_operation_lock:
    summary: "Release the operation lock"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:3F", res: "1" } }
    expect: { status: 200, matches: "^OSJ:3F$" }
    returns: ack
  get_operation_lock:
    summary: "Query the operation lock: OSJ:40:<0 unlocked, 1 locked>:<information>"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:40", res: "1" } }
    expect: { status: 200, matches: "^OSJ:40:([01]:.*)$" }
    returns: value
  get_error:
    summary: "Query the error state: 0 normal, 1 fan error (AW-UE80), 2 other error"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QER", res: "1" } }
    expect: { status: 200, matches: "^OER:([0-2])$" }
    returns: value
  get_error_flags:
    summary: "Query the error bits, 8-digit hex: bit0 fan, bit1 high temperature, bit2 lens, bit3 pan/tilt, bit4 sensor"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSI:46", res: "1" } }
    expect: { status: 200, matches: "^OSI:46:([0-9A-F]{8})$" }
    returns: value
  get_latest_error:
    summary: "Query the latest error code, rER<2-digit hex> (00 no error)"
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#RER", res: "1" } }
    expect: { status: 200, matches: "^rER([0-9A-F]{2})$" }
    returns: value
  get_model:
    summary: "Query the model number, OID:<model> such as OID:AW-UE80"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QID", res: "1" } }
    expect: { status: 200, matches: "^OID:(.+)$" }
    returns: value
  get_software_version:
    summary: "Query the system software version, OSV:<version> such as OSV:V01.00"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSV", res: "1" } }
    expect: { status: 200, matches: "^OSV:(.+)$" }
    returns: value
  get_component_version:
    summary: "Query one component's software version: 0 servo CPU, 1 camera CPU, ... (the numbering differs by model); the reply is qSV<component>V<version>"
    params:
      component: { type: int, min: 0, max: 9, required: true }
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#QSV{component}", res: "1" } }
    expect: { status: 200, matches: "^qSV[0-9](V.*)$" }
    returns: value
  power:
    summary: "Power on, or go to standby"
    params:
      power_on: { type: bool, required: true }
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#O{power_on:bool01}", res: "1" } }
    expect: { status: 200, matches: "^p[01]$" }
    returns: ack
  get_power:
    summary: "Query power: p0 standby, p1 on, p3 turning on (AW-HE120/HE130/HE40/HE65/HE70/UE70)"
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#O", res: "1" } }
    expect: { status: 200, matches: "^p([0-3])$" }
    returns: value
  stream_resolution:
    summary: "Set the streaming resolution: 0 640x360, 1 320x180, 2 1280x720, 3 1920x1080"
    params:
      resolution: { type: int, min: 0, max: 3, required: true }
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#RZL{resolution}", res: "1" } }
    expect: { status: 200, matches: "^rZL[0-3]$" }
    returns: ack
  get_stream_resolution:
    summary: "Query the streaming resolution"
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#RZL", res: "1" } }
    expect: { status: 200, matches: "^rZL([0-3])$" }
    returns: value
  camera_title:
    summary: "Set the camera title, up to 40 ASCII characters"
    params:
      title: { type: string, max_length: 40, pattern: "^[ -~]{1,40}$", required: true }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:5C:{title}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:5C:.*$" }
    returns: ack
  get_camera_title:
    summary: "Query the camera title"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:5C", res: "1" } }
    expect: { status: 200, matches: "^OSJ:5C:(.*)$" }
    returns: value

