    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSL:AE:{number:02d}", res: "1" } }
    expect: { status: 200, matches: "^OSL:AE:[0-9]{2}$" }
    returns: ack

  get_camera_number:
    summary: "Query the camera number"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSL:AE", res: "1" } }
    expect: { status: 200, matches: "^OSL:AE:([0-9]{2})$" }
    returns: value

  camera_title_hex:
    summary: "Set the camera title as hex-coded ASCII"
    params:
      title: { type: string, pattern: "^[0-9A-F]{40}$", required: true, label: Camera title, description: "The 20-character title as 40 hex digits of ASCII, padded with 00." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:5C:{title}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:5C:.*$" }
    returns: ack

  get_camera_title_hex:
    summary: "Query the camera title as hex-coded ASCII"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:5C", res: "1" } }
    expect: { status: 200, matches: "^OSJ:5C:(.*)$" }
    returns: value

  detail_level:
    summary: "Set the detail level (0-3)"
    params:
      level: { type: int, min: 0, max: 3, required: true, label: Detail, description: "Detail level 0 to 3." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "ODT:{level}", res: "1" } }
    expect: { status: 200, matches: "^ODT:[0-3]$" }
    returns: ack

  get_detail_level:
    summary: "Query the detail level (0-3)"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QDT", res: "1" } }
    expect: { status: 200, matches: "^ODT:([0-3])$" }
    returns: value

  contrast:
    summary: "Set the contrast"
    params:
      level: { type: int, min: 0, max: 4, required: true, label: Contrast, description: "Contrast 0 to 4." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSD:50:{level}", res: "1" } }
    expect: { status: 200, matches: "^OSD:50:[0-4]$" }
    returns: ack

  get_contrast:
    summary: "Query the contrast"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSD:50", res: "1" } }
    expect: { status: 200, matches: "^OSD:50:([0-4])$" }
    returns: value

  chroma_step:
    summary: "Set the chroma level (0-10)"
    params:
      level: { type: string, pattern: "^0[3-9A-D]$", required: true, label: Chroma level, description: "Chroma level, 03 (0) to 0D (10), as 2-digit hex 03-0D." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OCG:{level}", res: "1" } }
    expect: { status: 200, matches: "^OCG:[0-9A-F]{2}$" }
    returns: ack

  get_chroma_step:
    summary: "Query the chroma level (0-10)"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QCG", res: "1" } }
    expect: { status: 200, matches: "^OCG:([0-9A-F]{2})$" }
    returns: value

  slow_shutter:
    summary: "Set slow shutter (longer exposures in Full Auto)"
    params:
      enabled: { type: bool, required: true, label: Slow shutter, description: "On turns slow shutter (longer exposures in Full Auto) on, off turns it off." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:80:{enabled:bool01}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:80:[01]$" }
    returns: ack

  get_slow_shutter:
    summary: "Query slow shutter (longer exposures in Full Auto)"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:80", res: "1" } }
    expect: { status: 200, matches: "^OSJ:80:([01])$" }
    returns: value

  language:
    summary: "Set the menu language"
    params:
      language: { type: int, min: 0, max: 2, required: true, label: Language, description: "0 English, 1 Japanese, 2 Chinese." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:82:{language}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:82:[0-2]$" }
    returns: ack

  get_language:
    summary: "Query the menu language"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:82", res: "1" } }
    expect: { status: 200, matches: "^OSJ:82:([0-2])$" }
    returns: value

  mirror:
    summary: "Set mirror (horizontal flip)"
    params:
      enabled: { type: bool, required: true, label: Mirror, description: "On turns mirror (horizontal flip) on, off turns it off." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:81:{enabled:bool01}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:81:[01]$" }
