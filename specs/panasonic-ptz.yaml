    verification: none
    notes: >
      From the AW-UE100 interface specification.
commands:
  scene:
    summary: "Select the scene file: 1-3 Scene1-3, 4 Full Auto"
    params:
      scene: { type: int, min: 1, max: 4, required: true, label: Scene file, description: "1-3 Scene1 to Scene3, 4 Full Auto." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "XSF:{scene}", res: "1" } }
    expect: { status: 200, matches: "^XSF:[1-4]$" }
    returns: ack
  get_scene:
    summary: "Query the scene file. The reply numbers from 0 (OSF:0 is Scene1, OSF:3 Full Auto)"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSF", res: "1" } }
    expect: { status: 200, matches: "^OSF:([0-3])$" }
    returns: value
  scene_copy:
    summary: "Copy one scene file's settings to another (1-3 Scene1-3, 4 Full Auto)"
    params:
      from_scene: { type: int, min: 1, max: 4, required: true, label: From scene, description: "Scene file to copy from: 1-3 Scene1 to Scene3, 4 Full Auto." }
      to_scene: { type: int, min: 1, max: 4, required: true, label: To scene, description: "Scene file to copy to: 1-3 Scene1 to Scene3, 4 Full Auto." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:D6:{from_scene}:{to_scene}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:D6:[1-4]:[1-4]$" }
    returns: ack
  picture_level:
    summary: "Set the picture level (auto exposure target)"
    params:
      level: { type: string, pattern: "^(?:[0-5][0-9A-F]|6[0-4])$", required: true, label: Picture level, description: "Auto exposure target as two-digit hex 00-64 for 0 to 100." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSD:48:{level}", res: "1" } }
    expect: { status: 200, matches: "^OSD:48:[0-9A-F]{2}$" }
    returns: ack
  get_picture_level:
    summary: "Query the picture level as the camera sends it, hex 00-64 for -50 to +50"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSD:48", res: "1" } }
    expect: { status: 200, matches: "^OSD:48:([0-9A-F]{2})$" }
    returns: value
  iris_mode:
    summary: "Set the iris to auto or manual"
    params:
      auto: { type: bool, required: true, label: Auto iris, description: "On sets the iris to auto, off to manual." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "ORS:{auto:bool01}", res: "1" } }
    expect: { status: 200, matches: "^ORS:[01]$" }
    returns: ack
  get_iris_mode:
    summary: "Query whether auto iris is on"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QRS", res: "1" } }
    expect: { status: 200, matches: "^ORS:([01])$" }
    returns: value
  auto_iris:
    summary: "Set the iris to auto or manual (pan-tilt head command)"
    params:
      auto: { type: bool, required: true, label: Auto iris, description: "On sets the iris to auto, off to manual." }
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#D3{auto:bool01}", res: "1" } }
    expect: { status: 200, matches: "^d3[01]$" }
    returns: ack
  get_auto_iris:
    summary: "Query whether auto iris is on"
    send: { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#D3", res: "1" } }
    expect: { status: 200, matches: "^d3([01])$" }
    returns: value
  auto_iris_speed:
    summary: "Set the auto iris speed: 0 slow, 1 normal, 2 fast"
    params:
      speed: { type: int, min: 0, max: 2, required: true, label: Auto iris speed, description: "0 slow, 1 normal, 2 fast." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:01:{speed}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:01:[0-2]$" }
    returns: ack
  get_auto_iris_speed:
    summary: "Query the auto iris speed"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:01", res: "1" } }
    expect: { status: 200, matches: "^OSJ:01:([0-2])$" }
    returns: value
  auto_iris_window:
    summary: "Set the auto iris metering window: 0 normal1, 1 normal2, 2 center, 4 full"
    params:
      window: { type: enum, values: ["0", "1", "2", "4"], required: true, label: Metering window, description: "0 normal1, 1 normal2, 2 center, 4 full." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:02:{window}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:02:(?:0|1|2|4)$" }
    returns: ack
  get_auto_iris_window:
    summary: "Query the auto iris window"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:02", res: "1" } }
    expect: { status: 200, matches: "^OSJ:02:((?:0|1|2|4))$" }
    returns: value
  iris_limit:
    summary: "Set the iris limit on or off"
    params:
      enabled: { type: bool, required: true, label: Iris limit, description: "On turns the iris limit on, off turns it off." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:90:{enabled:bool01}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:90:[01]$" }
    returns: ack
  get_iris_limit:
    summary: "Query whether iris limit is on"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:90", res: "1" } }
    expect: { status: 200, matches: "^OSJ:90:([01])$" }
    returns: value
  shutter_mode:
    summary: "Set the shutter mode: 0 off, 1 step, 2 synchro, 3 elc"
    params:
      mode: { type: int, min: 0, max: 3, required: true, label: Shutter mode, description: "0 off, 1 step, 2 synchro, 3 ELC." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:03:{mode}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:03:[0-3]$" }
    returns: ack
  get_shutter_mode:
    summary: "Query the shutter mode"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:03", res: "1" } }
    expect: { status: 200, matches: "^OSJ:03:([0-3])$" }
    returns: value
  shutter_step_up:
    summary: "Move the step shutter up by a number of selectable steps (hex 01-64 for 1-100)"
    params:
      steps: { type: string, pattern: "^(?:0[1-9A-F]|[1-5][0-9A-F]|6[0-4])$", required: true, label: Steps, description: "Number of selectable steps as two-digit hex, 01-64 for 1 to 100." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:04:{steps}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:04:[0-9A-F]{2}$" }
    returns: ack
  shutter_step_down:
    summary: "Move the step shutter down by a number of selectable steps (hex 01-64 for 1-100)"
    params:
      steps: { type: string, pattern: "^(?:0[1-9A-F]|[1-5][0-9A-F]|6[0-4])$", required: true, label: Steps, description: "Number of selectable steps as two-digit hex, 01-64 for 1 to 100." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:05:{steps}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:05:[0-9A-F]{2}$" }
    returns: ack
  shutter_step:
    summary: "Set the step shutter speed by its denominator in 4-digit hex (003C is 1/60)"
    params:
      denominator: { type: string, pattern: "^(?:000[1-9A-F]|00[1-9A-F][0-9A-F]|0[1-9A-F][0-9A-F]{2}|1[0-9A-F]{3}|2[0-6][0-9A-F]{2}|270[0-9A-F]|2710)$", required: true, label: Shutter speed, description: "Denominator of the shutter speed as four-digit hex, such as 003C for 1/60." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:06:{denominator}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:06:[0-9A-F]{4}$" }
    returns: ack
  get_shutter_step:
    summary: "Query the step shutter denominator as the camera sends it, 4-digit hex (003C is 1/60)"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:06", res: "1" } }
    expect: { status: 200, matches: "^OSJ:06:([0-9A-F]{4})$" }
    returns: value
  synchro_scan_up:
    summary: "Move synchro scan up by a number of selectable steps (hex 01-64 for 1-100)"
    params:
      steps: { type: string, pattern: "^(?:0[1-9A-F]|[1-5][0-9A-F]|6[0-4])$", required: true, label: Steps, description: "Number of selectable steps as two-digit hex, 01-64 for 1 to 100." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:07:{steps}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:07:[0-9A-F]{2}$" }
    returns: ack
  synchro_scan_down:
    summary: "Move synchro scan down by a number of selectable steps (hex 01-64 for 1-100)"
    params:
      steps: { type: string, pattern: "^(?:0[1-9A-F]|[1-5][0-9A-F]|6[0-4])$", required: true, label: Steps, description: "Number of selectable steps as two-digit hex, 01-64 for 1 to 100." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:08:{steps}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:08:[0-9A-F]{2}$" }
    returns: ack
  synchro_scan:
    summary: "Set synchro scan in tenths of a hertz, 5-digit hex (00258 is 60.0 Hz)"
    params:
      tenths_hz: { type: string, pattern: "^(?:0[0-9A-F]{4}|1[0-7][0-9A-F]{3}|18[0-5][0-9A-F]{2}|186[0-9][0-9A-F]|186A0)$", required: true, label: Synchro scan, description: "Frequency in tenths of a hertz as five-digit hex, such as 00258 for 60.0 Hz." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSJ:09:{tenths_hz}", res: "1" } }
    expect: { status: 200, matches: "^OSJ:09:[0-9A-F]{5}$" }
    returns: ack
  get_synchro_scan:
    summary: "Query the synchro scan frequency times ten, as the camera sends it in 5-digit hex"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:09", res: "1" } }
    expect: { status: 200, matches: "^OSJ:09:([0-9A-F]{5})$" }
    returns: value
  elc_limit:
    summary: "Set the ELC (auto shutter) limit: 2 1/100, 3 1/120, 4 1/250, 5 1/500, 6 1/1000, 7 1/2000"
    params:
      limit: { type: int, min: 2, max: 7, required: true, label: ELC limit, description: "Slowest auto shutter: 2 1/100, 3 1/120, 4 1/250, 5 1/500, 6 1/1000, 7 1/2000." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSD:BF:{limit}", res: "1" } }
    expect: { status: 200, matches: "^OSD:BF:[2-7]$" }
    returns: ack
  get_elc_limit:
    summary: "Query the ELC limit"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSD:BF", res: "1" } }
    expect: { status: 200, matches: "^OSD:BF:([2-7])$" }
    returns: value
  gain:
    summary: "Set the gain: hex 08-32 for 0-42 dB in 1 dB steps (05 -3 dB on AW-UE150/HE145; above 36 dB needs super gain), 80 AGC"
    params:
      gain: { type: string, pattern: "^(?:(?:0[5-9A-F]|[12][0-9A-F]|3[0-2])|80)$", required: true, label: Gain, description: "Two-digit hex for the gain in 1 dB steps, 08 being 0 dB: 08-32 (0 to 42 dB; above 36 dB needs super gain), 05-32 (-3 to 42 dB) on AW-UE150/HE145; or 80 for AGC." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OGU:{gain}", res: "1" } }
    expect: { status: 200, matches: "^OGU:[0-9A-F]{2}$" }
    returns: ack
  get_gain:
    summary: "Query the gain as the camera sends it: hex 08-32 for 0-42 dB, 80 AGC on"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QGU", res: "1" } }
    expect: { status: 200, matches: "^OGU:([0-9A-F]{2})$" }
    returns: value
  super_gain:
    summary: "Set super gain on or off"
    params:
      enabled: { type: bool, required: true, label: Super gain, description: "On turns super gain, needed above 36 dB on, off turns it off." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSI:28:{enabled:bool01}", res: "1" } }
    expect: { status: 200, matches: "^OSI:28:[01]$" }
    returns: ack
  get_super_gain:
    summary: "Query whether super gain is on"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSI:28", res: "1" } }
    expect: { status: 200, matches: "^OSI:28:([01])$" }
    returns: value
  agc_max_gain:
    summary: "Set the AGC maximum gain: 01 6dB, 02 12dB, 03 18dB, 04 24dB, 05 30dB, 06 36dB"
    params:
      max_gain: { type: int, min: 1, max: 6, required: true, label: AGC maximum gain, description: "1 6 dB, 2 12 dB, 3 18 dB, 4 24 dB, 5 30 dB, 6 36 dB." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSD:69:{max_gain:02d}", res: "1" } }
    expect: { status: 200, matches: "^OSD:69:(?:01|02|03|04|05|06)$" }
    returns: ack
  get_agc_max_gain:
    summary: "Query the AGC maximum gain"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSD:69", res: "1" } }
    expect: { status: 200, matches: "^OSD:69:((?:01|02|03|04|05|06))$" }
    returns: value
  frame_mix:
    summary: "Set frame mix: 00 off, 06 +6dB, 0C +12dB, 12 +18dB, 18 +24dB, 80 auto"
    params:
      frame_mix: { type: enum, values: ["00", "06", "0C", "12", "18", "80"], required: true, label: Frame mix, description: "00 off, 06 +6 dB, 0C +12 dB, 12 +18 dB, 18 +24 dB, 80 auto." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSA:65:{frame_mix}", res: "1" } }
    expect: { status: 200, matches: "^OSA:65:(?:00|06|0C|12|18|80)$" }
    returns: ack
  get_frame_mix:
    summary: "Query the frame mix"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSA:65", res: "1" } }
    expect: { status: 200, matches: "^OSA:65:((?:00|06|0C|12|18|80))$" }
    returns: value
  auto_frame_mix_max_gain:
    summary: "Set the auto frame mix maximum gain: 00 off, 01 6dB, 02 12dB, 03 18dB"
    params:
      max_gain: { type: int, min: 0, max: 3, required: true, label: Maximum gain, description: "0 off, 1 6 dB, 2 12 dB, 3 18 dB." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSE:74:{max_gain:02d}", res: "1" } }
    expect: { status: 200, matches: "^OSE:74:(?:00|01|02|03)$" }
    returns: ack
  get_auto_frame_mix_max_gain:
    summary: "Query the auto frame mix maximum gain"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSE:74", res: "1" } }
    expect: { status: 200, matches: "^OSE:74:((?:00|01|02|03))$" }
    returns: value
  backlight_compensation:
    summary: "Set backlight compensation on or off"
    params:
      enabled: { type: bool, required: true, label: Backlight compensation, description: "On turns backlight compensation on, off turns it off." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSE:73:{enabled:bool01}", res: "1" } }
    expect: { status: 200, matches: "^OSE:73:[01]$" }
    returns: ack
  get_backlight_compensation:
    summary: "Query whether backlight compensation is on"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSE:73", res: "1" } }
    expect: { status: 200, matches: "^OSE:73:([01])$" }
    returns: value
  backlight_compensation_level:
    summary: "Set the backlight compensation level: 0 low, 1 mid, 2 high"
    params:
      level: { type: int, min: 0, max: 2, required: true, label: Level, description: "0 low, 1 mid, 2 high." }
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "OSM:40:{level}", res: "1" } }
    expect: { status: 200, matches: "^OSM:40:[0-2]$" }
    returns: ack
  get_backlight_compensation_level:
    summary: "Query the backlight compensation level"
    send: { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSM:40", res: "1" } }
    expect: { status: 200, matches: "^OSM:40:([0-2])$" }
    returns: value
  spotlight_compensation:
