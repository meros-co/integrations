telemetry:
  # Asked once on connecting; the camera pushes later changes as update
  # notifications (do not poll settings at regular intervals, chapter 4).
  poll:
    send:
      - { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#O", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QID", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#S", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#PTV", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#APC", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#GZ", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#GF", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#GI", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_ptz, query: { cmd: "#DA", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QBR", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSF", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QRS", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QAF", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QGU", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QAW", res: "1" } }
      - { method: GET, path: /cgi-bin/aw_cam, query: { cmd: "QSJ:03", res: "1" } }
  updates:
    - match: "^XSF:([1-4])$"
      state:
        "scene": "{1}"
    - match: "^OSF:([0-3])$"
      state:
        "scene": "{1:+1}"
    - match: "^OSD:48:([0-9A-F]{2})$"
      state:
        "exposure.picture_level": "{1}"
    - match: "^ORS:([01])$"
      state:
        "iris.auto": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^d3([01])$"
      state:
        "iris.auto": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^OSJ:01:([0-2])$"
      state:
        "iris.auto_speed": { value: "{1}", map: { "0": "slow", "1": "normal", "2": "fast" } }
    - match: "^OSJ:02:((?:0|1|2|4))$"
      state:
        "iris.auto_window": { value: "{1}", map: { "0": "normal1", "1": "normal2", "2": "center", "4": "full" } }
    - match: "^OSJ:90:([01])$"
      state:
        "iris.limit": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^OSJ:03:([0-3])$"
      state:
        "shutter.mode": { value: "{1}", map: { "0": "off", "1": "step", "2": "synchro", "3": "elc" } }
    - match: "^OSJ:06:([0-9A-F]{4})$"
      state:
        "shutter.step": "{1}"
    - match: "^OSJ:09:([0-9A-F]{5})$"
      state:
        "shutter.synchro": "{1}"
    - match: "^OSD:BF:([2-7])$"
      state:
        "shutter.elc_limit": { value: "{1}", map: { "2": "1/100", "3": "1/120", "4": "1/250", "5": "1/500", "6": "1/1000", "7": "1/2000" } }
    - match: "^OGU:([0-9A-F]{2})$"
      state:
        "gain": "{1}"
    - match: "^OSI:28:([01])$"
      state:
        "gain_super": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^OSD:69:((?:01|02|03|04|05|06))$"
      state:
        "gain_agc_max": { value: "{1}", map: { "1": "6dB", "2": "12dB", "3": "18dB", "4": "24dB", "5": "30dB", "6": "36dB" } }
    - match: "^OSA:65:((?:00|06|0C|12|18|80))$"
      state:
        "frame_mix": { value: "{1}", map: { "0": "off", "6": "+6dB", "0C": "+12dB", "12": "+18dB", "18": "+24dB", "80": "auto" } }
    - match: "^OSE:74:((?:00|01|02|03))$"
      state:
        "frame_mix_auto_max_gain": { value: "{1}", map: { "0": "off", "1": "6dB", "2": "12dB", "3": "18dB" } }
    - match: "^OSE:73:([01])$"
      state:
        "backlight_compensation": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^OSM:40:([0-2])$"
      state:
        "backlight_compensation_level": { value: "{1}", map: { "0": "low", "1": "mid", "2": "high" } }
    - match: "^OSJ:D0:([01])$"
      state:
        "spotlight_compensation": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^OSJ:D1:([01])$"
      state:
        "flicker_suppression": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^OFT:((?:0|1|2|3|8))$"
      state:
        "nd_filter": { value: "{1}", map: { "0": "through", "1": "1/4", "2": "1/16", "3": "1/64", "8": "auto" } }
    - match: "^OSJ:D2:([0-3])$"
      state:
        "nd_filter_status": { value: "{1}", map: { "0": "through", "1": "1/4", "2": "1/16", "3": "1/64" } }
    - match: "^d6([01])$"
      state:
        "night_mode": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^OAW:([0459])$"
      state:
        "white_balance.mode": { value: "{1}", map: { "0": "atw", "4": "preset_3200k", "5": "preset_5600k", "9": "var" } }
    - match: "^(OWS)$"
      state:
        "white_balance.awb_result": { value: "{1}", map: { "OWS": "ok" } }
    - match: "^(OAS)$"
      state:
        "white_balance.abb_result": { value: "{1}", map: { "OAS": "ok" } }
    - match: "^OSI:20:([0-9A-F]{5}):([0-2])$"
      state:
        "white_balance.color_temperature": "{1}"
        "white_balance.color_temperature_range": { value: "{2}", map: { "0": "valid", "1": "under", "2": "over" } }
    - match: "^OSG:39:([0-9A-F]{3})$"
      state:
        "white_balance.r_gain": "{1}"
    - match: "^OSG:3A:([0-9A-F]{3})$"
      state:
        "white_balance.b_gain": "{1}"
    - match: "^OSJ:4A:([0-9A-F]{5}):([0-2])$"
      state:
        "white_balance.awb_color_temperature": "{1}"
    - match: "^OSJ:0C:([01])$"
      state:
        "white_balance.awb_gain_offset": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^OSI:25:([0-2])$"
      state:
        "white_balance.atw_speed": { value: "{1}", map: { "0": "normal", "1": "slow", "2": "fast" } }
    - match: "^OSJ:0D:([0-9A-F]{2})$"
      state:
        "white_balance.atw_target_r": "{1}"
    - match: "^OSJ:0E:([0-9A-F]{2})$"
      state:
        "white_balance.atw_target_b": "{1}"
    - match: "^OSD:B0:([0-9A-F]{2})$"
      state:
        "chroma_level": "{1}"
    - match: "^OSJ:0B:([0-9A-F]{2})$"
      state:
        "chroma_phase": "{1}"
    - match: "^OSJ:0F:([0-9A-F]{3})$"
      state:
        "master_pedestal": "{1}"
    - match: "^ODT:([0-2])$"
      state:
        "detail": { value: "{1}", map: { "0": false, "1": true, "2": true } }
    - match: "^OSA:30:([0-9A-F]{2})$"
      state:
        "detail_master": "{1}"
    - match: "^OSJ:12:([0-9A-F]{2})$"
      state:
        "detail_coring": "{1}"
    - match: "^OSD:A1:([0-9A-F]{2})$"
      state:
        "detail_vertical": "{1}"
    - match: "^OSA:40:([01])$"
      state:
        "skin_detail": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^OSD:A3:([0-9A-F]{2})$"
      state:
        "skin_detail_effect": "{1}"
    - match: "^OSJ:D7:((?:00|01|02|03|04))$"
      state:
        "gamma_mode": { value: "{1}", map: { "0": "hd", "1": "normal", "2": "cinema1", "3": "cinema2", "4": "still_like" } }
    - match: "^OSA:6A:([0-9A-F]{2})$"
      state:
        "gamma": "{1}"
    - match: "^OSE:33:([0-3])$"
      state:
        "drs": { value: "{1}", map: { "0": "off", "1": "low", "2": "mid", "3": "high" } }
    - match: "^OSA:2D:((?:0|2|3|4|5))$"
      state:
        "knee_mode": { value: "{1}", map: { "0": "off", "2": "auto", "3": "low", "4": "mid", "5": "high" } }
    - match: "^OSA:2E:([01])$"
      state:
        "white_clip": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^OSA:2A:([0-9A-F]{2})$"
      state:
        "white_clip_level": "{1}"
    - match: "^OSD:3A:((?:00|01|02))$"
      state:
        "dnr": { value: "{1}", map: { "0": "off", "1": "low", "2": "high" } }
    - match: "^OSE:31:((?:0|3|4))$"
      state:
        "matrix.type": { value: "{1}", map: { "0": "normal", "3": "user", "4": "professional" } }
    - match: "^OSJ:4F:([01])$"
      state:
        "matrix.adaptive": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^OSD:A4:([0-9A-F]{2})$"
      state:
        "matrix.r_g": "{1}"
    - match: "^OSD:A5:([0-9A-F]{2})$"
      state:
        "matrix.r_b": "{1}"
    - match: "^OSD:A6:([0-9A-F]{2})$"
      state:
        "matrix.g_r": "{1}"
    - match: "^OSD:A7:([0-9A-F]{2})$"
      state:
        "matrix.g_b": "{1}"
    - match: "^OSD:A8:([0-9A-F]{2})$"
      state:
        "matrix.b_r": "{1}"
    - match: "^OSD:A9:([0-9A-F]{2})$"
      state:
        "matrix.b_g": "{1}"
    - match: "^OSD:80:([0-9A-F]{2})$"
      state:
        "color_correction.b_mg.saturation": "{1}"
    - match: "^OSD:81:([0-9A-F]{2})$"
      state:
        "color_correction.b_mg.phase": "{1}"
    - match: "^OSD:82:([0-9A-F]{2})$"
      state:
        "color_correction.mg.saturation": "{1}"
    - match: "^OSD:83:([0-9A-F]{2})$"
      state:
        "color_correction.mg.phase": "{1}"
    - match: "^OSD:84:([0-9A-F]{2})$"
