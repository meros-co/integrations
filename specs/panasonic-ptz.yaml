        "crop.h_position_yl": "{1}"
    - match: "^OSJ:31:([0-9A-F]{3})$"
      state:
        "crop.h_position_g": "{1}"
    - match: "^OSJ:33:([0-9A-F]{3})$"
      state:
        "crop.h_position_mg": "{1}"
    - match: "^OSJ:B0:([0-9A-F]{3})$"
      state:
        "crop.v_position": "{1}"
    - match: "^OSJ:30:([0-9A-F]{3})$"
      state:
        "crop.v_position_yl": "{1}"
    - match: "^OSJ:32:([0-9A-F]{3})$"
      state:
        "crop.v_position_g": "{1}"
    - match: "^OSJ:34:([0-9A-F]{3})$"
      state:
        "crop.v_position_mg": "{1}"
    - match: "^OSJ:B1:([0-9A-F]{5})$"
      state:
        "crop.zoom_ratio": "{1}"
    - match: "^OSJ:98:([0-9A-F]{5})$"
      state:
        "crop.zoom_ratio_yl": "{1}"
    - match: "^OSJ:99:([0-9A-F]{5})$"
      state:
        "crop.zoom_ratio_g": "{1}"
    - match: "^OSJ:9A:([0-9A-F]{5})$"
      state:
        "crop.zoom_ratio_mg": "{1}"
    - match: "^OSJ:60:([0-9A-F]{3}):([0-9A-F]{3}):([0-9A-F]{3}):([0-9A-F]{3}):([0-9A-F]{3}):([0-9A-F]{3})$"
      state:
        "crop.h_position_yl": "{1}"
        "crop.v_position_yl": "{2}"
        "crop.h_position_g": "{3}"
        "crop.v_position_g": "{4}"
        "crop.h_position_mg": "{5}"
        "crop.v_position_mg": "{6}"
    - match: "^OSJ:9B:([0-9A-F]{5}):([0-9A-F]{5}):([0-9A-F]{5})$"
      state:
        "crop.zoom_ratio_yl": "{1}"
        "crop.zoom_ratio_g": "{2}"
        "crop.zoom_ratio_mg": "{3}"
    - match: "^OSJ:C3:([0-9A-F]{3}):([0-9A-F]{3}):([0-9A-F]{3}):([0-9A-F]{3}):([0-9A-F]{3}):([0-9A-F]{3}):([0-9A-F]{5}):([0-9A-F]{5}):([0-9A-F]{5})$"
      state:
        "crop.h_position_yl": "{1}"
        "crop.v_position_yl": "{2}"
        "crop.h_position_g": "{3}"
        "crop.v_position_g": "{4}"
        "crop.h_position_mg": "{5}"
        "crop.v_position_mg": "{6}"
        "crop.zoom_ratio_yl": "{7}"
        "crop.zoom_ratio_g": "{8}"
        "crop.zoom_ratio_mg": "{9}"
    - match: "^OSJ:2A:([01])$"
      state:
        "preset.crop": { value: "{1}", map: { "0": false, "1": true } }
    - match: "^sPF([0-1])$"
      state:
        "picture_flip.mode": { value: "{1}", map: { "0": "off", "1": "auto" } }
    - match: "^fDA([0-9A-F]{2})$"
      state:
        "picture_flip.detect_angle": "{1}"
    - match: "^OFS:([0-1])$"
      state:
        "picture_flip.status": { value: "{1}", map: { "0": "normal", "1": "flip" } }

quirks:
  - models: [all]
    severity: critical
    text: >
      Leave at least 40 ms between pan-tilt head commands (aw_ptz) on the AW-UE models (chapter 4,
      restriction 1); the HE document asks for 130 ms between commands of either kind. The format has no
      inter-command delay, so a caller streaming pan_tilt_speed updates must pace them itself. Every HTTP
      request opens and closes its own connection; Keep-Alive is not supported.

  - models: [all]
    severity: critical
    text: >
      Send a setting command only when the setting must change, never at regular intervals (chapter 4,
      restriction 4). The settings are stored in EEPROM with a limited number of writes, and the HE document
      warns that frequent writes will eventually stop the camera working. Queries are not affected.

  - models: [all]
    severity: critical
    text: >
      Presets are 0-based on the wire (preset 1 is #R00, the reply s00 and the completion notification
      q00). recall_preset, save_preset, delete_preset, preset_name and power_on_preset take 1-100 and apply
      the -1 offset; the state rules add 1 back.

  - models: [all]
    severity: warning
    text: >
      Speeds (pan_speed, tilt_speed, pan_tilt_speed, zoom_speed, focus_speed) are two digits where 50 is
      stop, 01 is full speed one way and 99 full speed the other. Motion continues until a 50 is sent; there
      is no separate stop command.

  - models: [all]
    severity: warning
    text: >
      Errors come back as the reply text, with HTTP 200: ER1:<command> (camera commands) or eR1:<command>
      (pan-tilt head commands) for an unsupported command, ER2 when busy or in standby, ER3 when a value is
      out of range or not allowed in the current state (chapter 7). They do not match a command's expected
      reply, so the command fails with the error text. They are not numeric codes, so `codes` does not apply.

  - models: [all]
    severity: warning
    text: >
      Some settings are only accepted in certain states (chapter 8): many exposure and picture settings are
      refused with ER3 in the Full Auto scene, manual focus and iris commands need manual mode, linear
      matrix and colour correction need matrix type User, and so on. Changing one setting can switch
      another off (backlight and spotlight compensation exclude each other; selecting i.Zoom or D.Zoom turns
      the digital extender off). Changing scene sends an update notification for every setting in the scene.

  - models: [all]
    severity: warning
    text: >
      At most five clients, a remote camera controller counting as one, can receive update notifications
      from a camera at the same time (chapter 5-3). The camera also pushes its version (qSV...) every 60
      seconds, error codes (rER..) every 30 seconds while an error lasts, lens positions (lPI...) every
      300 ms while lens_position_notification is on, and q<preset-1> when a preset recall completes.

  - models: [all]
    severity: warning
    text: >
      Many values are hexadecimal on the wire and the format has no hex directive, so those parameters take
      the hex text itself (uppercase, at the documented width), held to the documented range by a pattern:
      gain 08-32 or 80, positions 555-FFF, pan/tilt 0000-FFFF, R/B gain 738-8C8 and so on. State paths keep
      the hex text as the camera sends it.

  - models: [all]
    severity: warning
    text: >
      white_balance_mode and get_white_balance_mode number AWB A and AWB B differently: the control takes 1
      and 2, the query answers 2 and 3 (p.30; the HE document notes the same). The state rule therefore
      assigns only ATW, 3200K, 5600K and VAR. get_scene answers 0-3 for scene 1-4 (OSF), while scene takes
      1-4 (XSF).

  - models: [all]
    severity: info
    text: >
      awb and abb answer at once; the result follows as an update notification (OWS or OAS on success,
      ER3:OWS or ER3:OAS on failure). AWB is refused with ER3 in night mode. recall_preset answers s<preset-1>
      at once and q<preset-1> when the move completes.

  - models: [aw-ue80, aw-ue50, aw-ue40, aw-ue30, aw-ue150, aw-ue155, aw-he145, aw-ue100]
    severity: info
    text: >
      The AW-UE document's usage examples for the menu keys omit the data (cmd=DUP); its command column and
      the HE document give DUP:1, which is what menu_up and the other menu keys send.

  - models: [aw-ue80, aw-ue50, aw-ue40, aw-ue30, aw-ue150, aw-ue155, aw-he145]
    severity: info
    text: >
      Colour correction Yl_Yl_G (codes 1C/1D) is listed as OSJ:1C/OSJ:1D in the command column of p.35 but
      as OSD:1C/OSD:1D in the menu table (p.22) and the usage examples, and every other colour correction
      code is OSD. The spec sends OSD:1C/OSD:1D.

  - models: [all]
    severity: info
    text: >
      Frequency changes restart the camera. Formats depend on the frequency and the model: 2160/59.94p and
      2160/50p are AW-UE80 only, and the PsF and 1080/23.98p (over 59.94i) formats AW-UE80 and AW-UE50 only.

  - models: [aw-ue150, aw-ue155, aw-he145, aw-ue100]
    severity: info
    text: >
      The AW-UE150/HE145 and AW-UE100 documents give several codes the AW-UE80 family uses with other
      meanings or ranges; each is one command whose description names the models: knee_mode adds 1 manual,
      matrix_type numbers 1 EBU and 2 NTSC, ois numbers the AW-UE100 hybrid modes 2 and 3, gain goes down
      to 05 (-3 dB) on AW-UE150/HE145, and pan_tilt_speed_mode is named normal, fast and quick. State
      follows each model's own meanings.

  - models: [aw-ue150, aw-ue155, aw-he145, aw-ue100]
    severity: info
    text: >
      The AW-UE150/HE145 and AW-UE100 documents usage example for awb_color_temperature is "OSJ:4A:0"; its
      command column takes the colour temperature (5-digit hex), which is what the command sends.

  - models: [aw-ue150, aw-ue155, aw-he145, aw-ue100]
    severity: info
    text: >
      The UHD crop commands apply only in 2160 formats (crop 720 only at 2160/59.94p or 50p), and the crop
      positions only while UHD crop is on; elsewhere the camera answers ER3. Crop positions are pixels in
      hex and must be even.

  - models: [aw-ue150, aw-ue155, aw-he145, aw-ue100]
    severity: info
    text: >
      The AW-UE150/HE145 document's usage example for flip_detect_angle is "#SPF5A"; the command column
      and the AW-UE160 example give #FDA, which is what the command sends.
