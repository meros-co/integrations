telemetry:
  # Viz Trio pushes nothing to a macro client but errors; what an operator
  # watches is read in turn. Each reply is the bare result, tied to the
  # command it answers.
  poll:
    - every_ms: 2000
      send: ["trio:check_channels_status"]
    - every_ms: 15000
      send:
        - "show:get_show_name"
        - "channelcontrol:get_active_profile"
        - "channelcontrol:list_viz_channels"
        - { when_set: read_show_lists, message: "show:get_pages" }
        - { when_set: read_show_lists, message: "show:get_templates" }
    - every_ms: 60000
      send: ["main:get_version"]
  updates:
    - match: '^(true|false)$'
      request_match: '^trio:check_channels_status$'
      state: { channels.connected: "{1}" }
    - match: &result '^((?:[^E]|E[^R]|ER[^R]|ERR[^O]|ERRO[^R]|ERROR[^:]).*|E|ER|ERR|ERRO|ERROR)$'
      request_match: '^show:get_show_name$'
      state: { show.name: "{1}" }
    - match: *result
      request_match: '^channelcontrol:get_active_profile$'
      state: { channels.profile: "{1}" }
    - match: *result
      request_match: '^main:get_version$'
      state: { system.version: "{1}" }
    - match: *result
      request_match: '^show:get_pages$'
      match_each: '([^\s,]+)'
      match_each_in: 1
      replace: show.pages
      state: { "show.pages.{index}": "{2}" }
    - match: *result
      request_match: '^show:get_templates$'
      match_each: '([^\s,]+)'
      match_each_in: 1
      replace: show.templates
      state: { "show.templates.{index}": "{2}" }
    - match: *result
      request_match: '^channelcontrol:list_viz_channels$'
      match_each: '\s*([^,]+?)\s*(?:,|$)'
      match_each_in: 1
      replace: channels.viz
      state: { "channels.viz.{index}": "{2}" }

state:
  channels.connected: { type: bool, description: "Whether every program and preview channel of the profile, Viz and video, is connected" }
  show.name: { type: string, description: "Name of the current show" }
  channels.profile: { type: string, description: "Active channel profile" }
  system.version: { type: string, description: "Viz Trio's version string" }
  show.pages.*: { type: string, description: "A page of the current show, by its name (usually its number), in the order show:get_pages lists them, from 0" }
  show.templates.*: { type: string, description: "A template of the current show, in the order show:get_templates lists them, from 0" }
  channels.viz.*: { type: string, description: "A Viz channel of the active profile, in the order list_viz_channels gives them, from 0" }

quirks:
  - models: [all]
    severity: warning
    text: >
      The documents do not say what Viz Trio sends back for a command with no
      result. This spec reads only the commands that return something (the
      get commands, check_channels_status, page_exists) and sends the others
      without waiting, reported unverified; a failed command answers
      ERROR: <message>, which then comes before the next reply. Errors other
      clients cause reach this client only after enable_error_messages true,
      so the spec leaves that off.
  - models: [all]
    severity: info
    text: >
      Arguments are separated by spaces, so names (pages, channels, tab
      fields, variables) are single words here; the last argument of a
      command takes the rest of the line and may hold spaces. Backslash is the
      socket's escape character and line breaks end a command, so values hold
      neither. Command names and parameters are case sensitive. The socket
      must be set to UTF-8 (Viz Trio's default and preference).
  - models: [all]
    severity: info
    text: >
      State is polled: the channels' status every 2 s, the show and the
      channel profile every 15 s, the version every minute. Reads that may
      answer an empty string (the current page, playlist, program and preview
      channels) are commands only, not polled: an empty answer is no line,
      and an unanswered read would reset the connection. Sent as
      commands, such reads time out when the answer is empty. Viz Trio pushes nothing on the macro socket but errors. A get of
      the concept, variant or a context variable returns a value only after a
      set command set it (Viz Trio's own rule).
  - models: [all]
    severity: warning
    text: >
      The current show's pages and templates are polled every 15 s while
      read_show_lists is on. The guide says only that show:get_pages and
      show:get_templates return "a list"; they are read as one line of names
      separated by spaces or commas, as get_playlists (spaces) and
      list_viz_channels (commas) are documented. An empty list answers no
      line, which times the poll out and resets the connection, so a show
      without pages or templates wants read_show_lists off; groups and
      playlists, which a show often has none of, are commands only. Which
      page is on air, armed or last taken cannot be read: the guide's
      command overview has no command returning it, and Viz Trio pushes
      nothing but errors on the socket.
  - models: [all]
    severity: critical
    text: >
      show_set_dir changes the show; the cleanup commands clear the Viz layers
      of channels on air; set_active_profile and the channel setters change
      where pages play out; page_delete_range deletes pages.
