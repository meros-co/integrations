spec: 1
id: vizrt-trio
name: Vizrt Viz Trio (macro commands over a socket)
vendor: Vizrt
category: other

# Viz Trio runs a macro command server on TCP 6200: one macro command per
# line (group:command arguments, such as page:read 1000), UTF-8 by default.
# Commands that return something (get_* and the like) answer with the result
# on a line; an error is answered ERROR: <message>. Arguments are separated
# by spaces; the last one of a "restString" command takes the rest of the
# line. Backslash is the socket's escape character.

source:
  - title: Viz Trio User Guide 4.6, Working with Macro Commands over a Socket Connection
    author: Vizrt
    url: https://docs.vizrt.com/viz-trio-guide/4.6/Working_with_Macro_Commands_over_a_Socket_Connection.html
    note: >
      Manufacturer document, read 2026-10-27. TCP port 6200 (overridable with
      -macro-port); UTF-8 (default, preferred) or Latin-1, switched with the
      socket-only command socket_encoding; a command ends at a new line;
      backslash escapes \n, \r, \xHH and \; commandserver:enable_error_messages
      true|false sends every Viz Trio error to the client as ERROR: <message>,
      and errors from commands not found or failing are sent either way. The
      same page in the 3.2 guide and its Port Numbers page agree (6200 for
      trio.exe).
  - title: Viz Trio User Guide 4.6, Overview of Commands and Working with Macro Commands
    author: Vizrt
    url: https://docs.vizrt.com/viz-trio-guide/4.6/Overview_of_Commands.html
    note: >
      Manufacturer document, read 2026-10-27. Every command used here with its
      arguments and description, in the groups channelcontrol, page, playlist,
      show, main, tabfield, table, trio and scroll2; results shown as RESULT:
      in the commands window (show:get_variable returning the value,
      main:help, main:apropos); "A get command cannot retrieve a variable's
      value if a set command has not been issued first"; parameters are case
      sensitive.
  - title: Viz Trio User Guide 4.6, Command Line Parameters
    author: Vizrt
    url: https://docs.vizrt.com/viz-trio-guide/4.6/Command_Line_Parameters.html
    note: Manufacturer document. -macro-port overrides the macro command server's port, 6200 by default.
  - title: companion-module-vizrt-tcp-engine-trio (Bitfocus Companion module, MIT licence)
    author: Bitfocus AS and Andreas H. Thomsen
    url: https://github.com/bitfocus/companion-module-vizrt-tcp-engine-trio
    note: >
      Read for corroboration only (index.js, companion/HELP.md): Trio commands
      sent as plain lines on the socket, page:read 1000 and page:take 1000. No
      code taken.

transport:
  type: line-tcp
  port: 6200
  framing: terminated
  terminator: lf
  encoding: utf-8
  timeout_ms: 5000
  probe: "main:get_version"

settings:
  read_show_lists: { type: bool, default: true, label: Read show lists, description: "Poll the current show's page and template lists into state; turn off for a show with no pages or templates, whose empty answers Viz Trio sends as no line at all." }

ports:
  - { port: 6200, protocol: tcp, role: control, note: "Viz Trio's macro command server; -macro-port moves it" }

models:
  - id: viz-trio
    name: Viz Trio 3.x and 4.x
    supports: [
               page_take, page_take_on_channel, page_continue, page_continue_on_channel, page_takeout, 
               page_takeout_on_channel, page_cue, page_cue_on_channel, page_cut, page_cut_on_channel, 
               page_prepare, page_prepare_on_channel, page_pause, page_pause_on_channel, current_take, 
               current_continue, current_takeout, page_read, page_read_next, page_read_previous, page_take_next, 
               page_take_exchange, page_update, page_save, page_save_as, page_arm, page_arm_current, page_unarm, 
               page_unarm_current, page_unarm_all, page_fire, page_fire_all, page_set_property, page_get_property, 
               page_get_name, page_get_description, page_get_template, page_get_tabfield_names, 
               page_get_property_keys, page_get_tabfield_count, page_set_description, page_set_program_channel, 
               page_get_program_channel, page_set_effect, page_refresh_linked_data, page_set_status, 
               page_delete_range, tabfield_set_value, tabfield_tab_to, tabfield_tab_to_name, 
               tabfield_get_property, table_get_cell, table_set_cell, table_get_row_count, table_insert_rows, 
               table_delete_rows, show_get_name, show_get_description, show_get_pages, show_get_groups, 
               show_get_templates, show_page_exists, show_set_dir, show_load, show_reload, show_load_armed, 
               show_set_variable, show_get_variable, show_set_concept, show_get_concept, show_set_variant, 
               show_get_variant, show_set_context_variable, show_get_context_variable, get_version, get_shows, 
               call_macro, get_global_macros, get_local_macros, playlist_get_all, playlist_get_current, 
               playlist_set_current, playlist_select_first, playlist_select_next, playlist_select_previous, 
               playlist_read_selected, playlist_read_next, playlist_read_previous, playlist_take_selected, 
               playlist_take_out_selected, playlist_next_story, playlist_previous_story, playlist_initialize, 
               playlist_start_carousel, playlist_stop_carousel, playlist_pause_carousel, playlist_set_looping, 
               playlist_set_manual_mode, playlist_clear, playlist_close, playlist_add_page, get_active_profile, 
               list_profiles, set_active_profile, get_program_channel, set_program_channel, 
               get_video_program_channel, set_video_program_channel, get_preview_channel, set_preview_channel, 
               get_video_preview_channel, set_video_preview_channel, list_viz_channels, list_video_channels, 
               set_channel_hosts, trio_on_air, trio_off_air, trio_initialize, trio_cleanup, 
               trio_cleanup_all_channels, trio_cleanup_channel, trio_clear_preview, trio_clear_program, 
               trio_check_channels, trio_continue_last_taken, trio_takeout_last_taken, trio_swap_channels, 
               trio_exchange, trio_synchronize_clocks, trio_freeze_clock, trio_unfreeze_clock, trio_send_vizcmd, 
               trio_send_preview_vizcmd, trio_send_vizcmd_to_channel, trio_set_global_variable, 
               trio_get_global_variable, scroll_program_start, scroll_program_continue, scroll_program_stop, 
               enable_error_messages
               ]
    verification: none

commands:
  page_take:
    summary: "Take a page on air on its own channel (page:take)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
    send: "page:take {page}"
    returns: none
  page_take_on_channel:
    summary: "Take a page on air on its own channel, on a named channel (page:take)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
      channel: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Channel", description: "Output channel name, as the channel profile names it (one word)." }
    send: "page:take {page} {channel}"
    returns: none
  page_continue:
    summary: "Continue a page (the next animation step) (page:continue)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
    send: "page:continue {page}"
    returns: none
  page_continue_on_channel:
    summary: "Continue a page (the next animation step), on a named channel (page:continue)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
      channel: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Channel", description: "Output channel name, as the channel profile names it (one word)." }
    send: "page:continue {page} {channel}"
    returns: none
  page_takeout:
    summary: "Take a page off air (page:takeout)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
    send: "page:takeout {page}"
    returns: none
  page_takeout_on_channel:
    summary: "Take a page off air, on a named channel (page:takeout)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
      channel: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Channel", description: "Output channel name, as the channel profile names it (one word)." }
    send: "page:takeout {page} {channel}"
    returns: none
  page_cue:
    summary: "Cue a video page (page:cue)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
    send: "page:cue {page}"
    returns: none
  page_cue_on_channel:
    summary: "Cue a video page, on a named channel (page:cue)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
      channel: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Channel", description: "Output channel name, as the channel profile names it (one word)." }
    send: "page:cue {page} {channel}"
    returns: none
  page_cut:
    summary: "Cut a page on air (page:cut)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
    send: "page:cut {page}"
    returns: none
  page_cut_on_channel:
    summary: "Cut a page on air, on a named channel (page:cut)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
      channel: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Channel", description: "Output channel name, as the channel profile names it (one word)." }
    send: "page:cut {page} {channel}"
    returns: none
  page_prepare:
    summary: "Prepare (load) a page (page:prepare)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
    send: "page:prepare {page}"
    returns: none
  page_prepare_on_channel:
    summary: "Prepare (load) a page, on a named channel (page:prepare)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
      channel: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Channel", description: "Output channel name, as the channel profile names it (one word)." }
    send: "page:prepare {page} {channel}"
    returns: none
  page_pause:
    summary: "Pause a video page (page:pause)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
    send: "page:pause {page}"
    returns: none
  page_pause_on_channel:
    summary: "Pause a video page, on a named channel (page:pause)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
      channel: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Channel", description: "Output channel name, as the channel profile names it (one word)." }
    send: "page:pause {page} {channel}"
    returns: none
  current_take:
    summary: "Take the current page on air (page:take without a page)"
    send: "page:take"
    returns: none
  current_continue:
    summary: "Continue the current page (page:continue without a page)"
    send: "page:continue"
    returns: none
  current_takeout:
    summary: "Take the current page off air (page:takeout without a page)"
    send: "page:takeout"
    returns: none
  page_read:
    summary: "Read (open) a page in the editor and preview (page:read)"
    params:
      page: { type: "int", min: 0, max: 99999999, required: true, label: "Page", description: "Page number." }
    send: "page:read {page}"
    returns: none
  page_read_next:
    summary: "Read the next element in the active view (page:readnext)"
    send: "page:readnext"
    returns: none
  page_read_previous:
    summary: "Read the previous element in the active view (page:readprevious)"
    send: "page:readprevious"
    returns: none
  page_take_next:
    summary: "Take the current page and read the next one (page:takenext)"
    send: "page:takenext"
    returns: none
  page_take_exchange:
    summary: "Take the current page and read the page last taken (page:take_exchange)"
    send: "page:take_exchange"
    returns: none
  page_update:
    summary: "Update the program renderer without animating in (page:update)"
    send: "page:update"
    returns: none
  page_save:
    summary: "Save the current page (page:save)"
    send: "page:save"
    returns: none
  page_save_as:
    summary: "Save the current page under a page number (page:saveas)"
    params:
      page: { type: "int", min: 0, max: 99999999, required: true, label: "Page", description: "Page number to save as." }
    send: "page:saveas {page}"
    returns: none
  page_arm:
    summary: "Arm a page on a channel (page:arm)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
      channel: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Channel", description: "Output channel name, as the channel profile names it (one word)." }
    send: "page:arm {page} {channel}"
    returns: none
  page_arm_current:
    summary: "Arm the current page on a channel (page:arm_current)"
    params:
      channel: { type: "string", max_length: 128, pattern: "^[^\\\\]+$", required: true, label: "Channel", description: "Output channel name, as the channel profile names it." }
    send: "page:arm_current {channel}"
    returns: none
  page_unarm:
    summary: "Unarm a channel (page:unarm)"
    params:
      channel: { type: "string", max_length: 128, pattern: "^[^\\\\]+$", required: true, label: "Channel", description: "Output channel name, as the channel profile names it." }
    send: "page:unarm {channel}"
    returns: none
  page_unarm_current:
    summary: "Unarm the current page (page:unarm_current)"
    send: "page:unarm_current"
    returns: none
  page_unarm_all:
    summary: "Unarm every armed page (page:unarm_all)"
    send: "page:unarm_all"
    returns: none
  page_fire:
    summary: "Fire an armed channel with an action (page:fire)"
    params:
      channel: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Channel", description: "Output channel name, as the channel profile names it (one word)." }
      action: { type: "enum", values: ["take", "continue", "out", "cue", "prepare"], required: true, label: "Action", description: "What firing does to the armed element: take, continue, out (take out), cue or prepare." }
      clear: { type: "bool", default: true, label: "Unarm after", description: "Whether the armed element is unarmed after firing." }
    send: "page:fire {channel} {action} {clear}"
    returns: none
  page_fire_all:
    summary: "Fire every armed channel with an action (page:fire_all)"
    params:
      action: { type: "enum", values: ["take", "continue", "out", "cue", "prepare"], required: true, label: "Action", description: "What firing does to the armed element: take, continue, out (take out), cue or prepare." }
      clear: { type: "bool", default: true, label: "Unarm after", description: "Whether the armed element is unarmed after firing." }
    send: "page:fire_all {action} {clear}"
    returns: none
  page_set_property:
    summary: "Set a tab-field property of the current page (page:set_property)"
    params:
      name: { type: "string", max_length: 256, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Property", description: "Tab-field property key, such as 01 or 1.image." }
      value: { type: "string", max_length: 65536, pattern: "^[^\\\\]*$", label: "Value", description: "New value of the property.", required: true }
    send: "page:set_property {name} {value}"
    returns: none
  page_get_property:
    summary: "Read a tab-field property of the current page (page:get_property)"
    params:
      name: { type: "string", max_length: 256, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Property", description: "Tab-field property key, such as 01." }
    send: "page:get_property {name}"
    expect: &value { not_contains: "ERROR: ", matches: '^(.*)$' }
    returns: value
  page_get_name:
    summary: "Read the current page's name (page:getpagename)"
    send: "page:getpagename"
    expect: *value
    returns: value
  page_get_description:
    summary: "Read the current page's description (page:getpagedescription)"
    send: "page:getpagedescription"
    expect: *value
    returns: value
  page_get_template:
    summary: "Read the current page's template (page:getpagetemplate)"
    send: "page:getpagetemplate"
    expect: *value
    returns: value
  page_get_tabfield_names:
    summary: "List a page's tab-field names (page:get_tabfield_names)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
    send: "page:get_tabfield_names {page}"
    expect: *value
    returns: value
  page_get_property_keys:
    summary: "List a page's property keys (page:get_property_keys)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
    send: "page:get_property_keys {page}"
    expect: *value
    returns: value
  page_get_tabfield_count:
    summary: "Read the number of tab fields on the current page (page:get_tabfield_count)"
    send: "page:get_tabfield_count"
    expect: *value
    returns: value
  page_set_description:
    summary: "Set a page's description (page:change_description)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
      description: { type: "string", max_length: 65536, pattern: "^[^\\\\]*$", label: "Description", description: "New description of the page.", required: true }
    send: "page:change_description {page} {description}"
    returns: none
  page_set_program_channel:
    summary: "Set a page's program channel (page:set_program_pagechannel)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
      channel: { type: "string", max_length: 128, pattern: "^[^\\\\]+$", required: true, label: "Channel", description: "Output channel name, as the channel profile names it." }
    send: "page:set_program_pagechannel {page} {channel}"
    returns: none
  page_get_program_channel:
    summary: "Read a page's program channel (page:get_program_pagechannel)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
    send: "page:get_program_pagechannel {page}"
    expect: *value
    returns: value
  page_set_effect:
    summary: "Set the transition effect between scene-based pages; empty for cuts (page:set_effect)"
    params:
      effect: { type: "string", max_length: 65536, pattern: "^[^\\\\]*$", label: "Effect", description: "Transition effect name; empty for hard cuts.", default: "" }
    send: "page:set_effect {effect}"
    returns: none
  page_refresh_linked_data:
    summary: "Refresh a page's linked data from its external source (page:refresh_linked_data)"
    params:
      page: { type: "string", max_length: 128, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Page", description: "Page name (usually its number, such as 1000) in the current show." }
    send: "page:refresh_linked_data {page}"
    returns: none
  page_set_status:
    summary: "Set a page's status (page:set_pagestatus_one)"
    params:
      page: { type: "int", min: 0, max: 99999999, required: true, label: "Page", description: "Page number." }
      status: { type: "enum", values: ["FINISHED", "UNFINISHED", "NONE"], required: true, label: "Status", description: "Page status." }
    send: "page:set_pagestatus_one {page} {status}"
    returns: none
  page_delete_range:
    summary: "Delete the pages from one number to another, inclusive (page:delete_pagerange)"
    params:
      start: { type: "int", min: 0, max: 99999999, required: true, label: "From", description: "First page number deleted." }
      end: { type: "int", min: 0, max: 99999999, required: true, label: "To", description: "Last page number deleted." }
    send: "page:delete_pagerange {start} {end}"
    returns: none
  tabfield_set_value:
    summary: "Set the value of the current tab-field property (tabfield:set_value)"
    params:
      value: { type: "string", max_length: 65536, pattern: "^[^\\\\]*$", label: "Value", description: "New value.", required: true }
    send: "tabfield:set_value {value}"
    returns: none
  tabfield_tab_to:
    summary: "Go to a tab field by number (page:tabto)"
    params:
      number: { type: "int", min: 0, max: 9999, required: true, label: "Tab field", description: "Tab-field number." }
    send: "page:tabto {number}"
    returns: none
  tabfield_tab_to_name:
    summary: "Go to a tab field by name (page:tabtotabfield)"
    params:
      name: { type: "string", max_length: 256, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Tab field", description: "Tab-field name." }
    send: "page:tabtotabfield {name}"
    returns: none
  tabfield_get_property:
    summary: "Read a property of a tab field (tabfield:get_tabfield_property)"
    params:
      number: { type: "int", min: 0, max: 9999, required: true, label: "Tab field", description: "Tab-field number." }
      property: { type: "string", max_length: 256, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Property", description: "Property name." }
    send: "tabfield:get_tabfield_property {number} {property}"
    expect: *value
    returns: value
  table_get_cell:
    summary: "Read a cell of a table property (table:get_cell_value)"
    params:
      table: { type: "string", max_length: 256, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Table", description: "Table property key." }
      column: { type: "string", max_length: 256, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Column", description: "Column key." }
      row: { type: "int", min: 0, required: true, label: "Row", description: "Row number." }
    send: "table:get_cell_value {table} {column} {row}"
    expect: *value
    returns: value
  table_set_cell:
    summary: "Set a cell of a table property (table:set_cell_value)"
    params:
      table: { type: "string", max_length: 256, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Table", description: "Table property key." }
      column: { type: "string", max_length: 256, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Column", description: "Column key." }
      row: { type: "int", min: 0, required: true, label: "Row", description: "Row number." }
      value: { type: "string", max_length: 65536, pattern: "^[^\\\\]*$", label: "Value", description: "New cell value.", required: true }
    send: "table:set_cell_value {table} {column} {row} {value}"
    returns: none
  table_get_row_count:
    summary: "Read the number of rows of a table property (table:get_row_num)"
    params:
      table: { type: "string", max_length: 256, pattern: "^[^\\s\\\\\"]+$", required: true, label: "Table", description: "Table property key." }
    send: "table:get_row_num {table}"
    expect: *value
