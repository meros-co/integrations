  # program/list, get_param
  programs.*.name: { type: string, description: "A program, keyed by id: its name" }
  programs.*.on: { type: bool, description: "Whether its windows are rendering" }
  programs.*.width: { type: int, description: "Its PVW and PGM windows' resolution width" }
