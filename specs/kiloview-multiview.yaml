    - path: "^/api/v2/window/get_single_layout\\.json\\?pro_id=([^&]+)&win_id=([^&]+)&pos_id=(\\d+)$"
      json_match: { "$.result": "^ok$" }
      json: { n: "$.data.pattern_name", s: "$.data.safe_area", v: "$.data.vu_meter", c: "$.data.center_cross", e: "$.data.name_enable" }
      state:
        "panes.{1:url_decode:key}.{2:url_decode:key}.{3}.name": "{n}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{3}.safe_area": "{s}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{3}.vu_meter": "{v}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{3}.center_cross": "{c}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{3}.name_shown": "{e}"

    # ── Layouts ─────────────────────────────────────────────────────────
    - path: "^/api/v2/layout/list\\.json\\?pro_id=([^&]+)$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.layout_id", name: "$.name", count: "$.layout_count", used: "$.used", pos: "$.position" }
      replace: "layouts.{1:url_decode:key}"
      state:
        "layouts.{1:url_decode:key}.{id:key}.name": "{name}"
        "layouts.{1:url_decode:key}.{id:key}.pane_count": "{count}"
        "layouts.{1:url_decode:key}.{id:key}.used": "{used}"
        "layouts.{1:url_decode:key}.{id:key}.panes": "{pos}"
    - path: "^/api/v2/layout/template\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.template_id", name: "$.name", count: "$.template_count", pos: "$.position" }
      replace: layout_templates
      state:
        "layout_templates.{id:key}.name": "{name}"
        "layout_templates.{id:key}.pane_count": "{count}"
        "layout_templates.{id:key}.panes": "{pos}"

    # ── Source discovery ────────────────────────────────────────────────
    - path: "^/api/v2/source/list\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.disc_id", name: "$.disc_name" }
      replace: discovery
      state: { "discovery.{id:key}.name": "{name}" }
      then_send: [{ method: GET, path: /api/v2/source/get_param.json, query: { disc_id: "{id}" } }]
    - path: "^/api/v2/source/list\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data[*].sources"
      json: { disc: "$^.disc_id", id: "$.id", name: "$.name", ip: "$.ip", url: "$.url", web: "$.web_url" }
      state:
        "discovery.{disc:key}.sources.{id:key}.name": "{name}"
        "discovery.{disc:key}.sources.{id:key}.ip": "{ip}"
        "discovery.{disc:key}.sources.{id:key}.url": "{url}"
        "discovery.{disc:key}.sources.{id:key}.web_url": "{web}"
    - path: "^/api/v2/source/get_param\\.json\\?disc_id=([^&]+)$"
      json_match: { "$.result": "^ok$" }
      json: { t: "$.data.disc_type", e: "$.data.discovery_enable", s: "$.data.discovery_ip", g: "$.data.group", i: "$.data.ip" }
      state:
        "discovery.{1:url_decode:key}.type": "{t}"
        "discovery.{1:url_decode:key}.server_enabled": "{e}"
        "discovery.{1:url_decode:key}.server_ip": "{s}"
        "discovery.{1:url_decode:key}.groups": "{g}"
        "discovery.{1:url_decode:key}.ips": "{i}"
    - path: "^/api/discovery/scan/groupChecked\\.json$"
      json_match: { "$.result": "^ok$" }
      json: { g: "$.data" }
      state: { ndi_discovery.groups: "{g}" }
    - path: "^/api/discovery/scan/getManualIps\\.json$"
      json_match: { "$.result": "^ok$" }
      json: { i: "$.data" }
      state: { ndi_discovery.manual_ips: "{i}" }

    # ── Read-backs ──────────────────────────────────────────────────────
    - path: "^/api/v2/program/(add|rername|remove|set_status|switch|set_param)\\.json$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/v2/program/list.json }]
    - path: "^/api/v2/source/(add|modify|remove|refresh)\\.json$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/v2/source/list.json }]
    - path: "^/api/discovery/scan/addManualIp\\.json$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send:
        - { method: GET, path: /api/discovery/scan/groupChecked.json }
        - { method: GET, path: /api/discovery/scan/getManualIps.json }
    # Window writes: the program's windows are read again (and with them
    # each window's panes, screen, output, NDI settings and toolbar).
    - path: "^/api/v2/window/(add|set_param|remove|set_position|set_output_type|ndi/set_param|delete_sources|set_state_control|set_layout|reload_layout|remove_source|set_audio_type)\\.json$"
      request_match: { "$.pro_id": "^(.+)$" }
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send:
        - { method: GET, path: /api/v2/window/list.json, query: { pro_id: "{2}" } }
        - { method: GET, path: /api/v2/layout/list.json, query: { pro_id: "{2}" } }
    - path: "^/api/v2/window/set_source\\.json$"
      request_match: { "$.to.pro_id": "^(.+)$" }
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/v2/window/list.json, query: { pro_id: "{1}" } }]
    - path: "^/api/v2/window/set_single_layout\\.json$"
      request_match: { "$.pro_id": "^(.+)$", "$.win_id": "^(.+)$", "$.pos_id": "^(\\d+)$" }
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send:
        - { method: POST, path: /api/v2/window/get_single_layout.json, query: { pro_id: "{1}", win_id: "{2}", pos_id: "{3}" } }
        - { method: GET, path: /api/v2/window/get.json, query: { pro_id: "{1}", win_id: "{2}" } }
    - path: "^/api/v2/layout/(add|rename|modify|remove|resave)\\.json$"
      request_match: { "$.pro_id": "^(.+)$" }
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send:
        - { method: GET, path: /api/v2/layout/list.json, query: { pro_id: "{2}" } }
        - { method: GET, path: /api/v2/window/list.json, query: { pro_id: "{2}" } }
    - path: "^/api/v2/take/(set|set_params)\\.json$"
      request_match: { "$.pro_id": "^(.+)$" }
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send:
        - { method: POST, path: /api/v2/take/get.json, query: { pro_id: "{2}" } }
        - { method: GET, path: /api/v2/window/list.json, query: { pro_id: "{2}" } }
    - path: "^/api/v2/lang/modify\\.json$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/v2/config/general.json }]
