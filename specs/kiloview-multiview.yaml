  windows.*.*.modified: { type: bool, description: "Whether its layout has unsaved changes" }
  windows.*.*.width: { type: int, description: "Its resolution width" }
  windows.*.*.height: { type: int, description: "Its resolution height" }
  windows.*.*.resolution: { type: int, description: "Its resolution's id" }
  windows.*.*.aspect: { type: float, description: "Its resolution's aspect ratio" }
  windows.*.*.frame_rate: { type: float, description: "Its frame rate" }
  windows.*.*.layout_name: { type: string, description: "Its layout's name" }
  windows.*.*.pane_count: { type: int, description: "Number of panes in its layout" }
