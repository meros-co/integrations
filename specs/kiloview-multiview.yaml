      program: *program
    send: { method: POST, path: /api/v2/take/get.json, query: { pro_id: "{program}" } }
    expect: *data
    returns: value
  set_take:
    summary: Set a program's Take duration and transition without taking (POST /api/v2/take/set_params.json)
    params:
      program: *program
      time: *take_time
      transition: *transition
    send: { method: POST, path: /api/v2/take/set_params.json, content_type: application/json, body: '{"pro_id":{program:json},"time":{time},"select":{transition}}' }
    expect: *ok
    returns: ack

maps:
  ndi_output: { "true": '"NDI"', "false": '""' }

quirks:
  - models: [all]
    severity: warning
    text: >
      Authentication: every request carries the header app, a JSON object
      with the user name and the token (2.1). The login answers its token
      in the JSON body (data.token), which the core cannot capture into a
      session, so it is a setting: run login and store the token with
      update_settings. A request with a missing or wrong token is answered
      with {"result": "error"}, which fails the command; the document does
      not say whether the token expires.
  - models: [all]
    severity: warning
    text: >
      The document's own spelling is followed where it gives only one:
      program/rername.json for the program rename. Where it gives two, the
      regular one is used: program/list.json (the document's heading reads
      prrogram) and program/get_param.json (its example reads prgram). Its
      URL rule names port 65532 while its text gives 81 as the default; 81
      is used, and the port given when opening the device wins.
  - models: [all]
    severity: critical
    text: >
      take and tbar change PGM at once; set_pane_source, remove_pane_source,
      clear_window_sources, set_window_layout and reload_window_layout
      change what a window shows (and sends as NDI); set_program_on off
      stops a program's rendering; remove_program deletes every window of
      the program; remove_window, remove_layout and remove_discovery cannot
      be undone; set_window_output off stops the window's NDI output. None
      asks for confirmation.
  - models: [all]
    severity: info
    text: >
      State is polled every 3 seconds: the programs, then each program's
      windows, layouts, parameters and Take settings, then each window's
      panes, screen, encoder output, NDI settings and toolbar. The discovery
      groups and their sources, the NDI discovery groups and addresses, the
      templates, resolutions, frame rates, transitions, screens and the
      general configuration are read every 30 seconds. A pane's own
      overlays (get_pane) are read when a command changes them or asks
      for them, not polled, since every pane of every window would be a
      request. Every accepted change has what it changed read again.
  - models: [all]
    severity: info
    text: >
      API limits and gaps: the WebRTC preview (get_window_sdp,
      switch_window) needs a browser-side peer the core does not provide;
      the document gives no request for a source's preloading, users, or
      the host's network; set_pane_source takes the source from another
      pane (from) as the document's example does, and its stream_id is the
      NDI source's name. The PTZ data fields follow 9.2's list (one value
      per type); ptz_is_supported answers ok or error.

