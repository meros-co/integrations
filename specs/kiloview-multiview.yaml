  panes.*.*.*.safe_area: { type: bool, description: "Whether its safe area is shown (pane setting)" }
  panes.*.*.*.vu_meter: { type: bool, description: "Whether its audio meter is shown" }
  panes.*.*.*.center_cross: { type: bool, description: "Whether its center cross is shown" }
  panes.*.*.*.name_shown: { type: bool, description: "Whether its name is shown" }
  # layout/list, layout/template
  layouts.*.*.name: { type: string, description: "A layout, keyed by program then layout id: its name" }
  layouts.*.*.pane_count: { type: int, description: "Its number of panes" }
  layouts.*.*.used: { type: bool, description: "Whether it is in use" }
  layouts.*.*.panes: { type: string, description: "Its panes, as JSON text of {x, y, width, height, type, number, id, z_index}" }
  layout_templates.*.name: { type: string, description: "A layout template, keyed by id: its name" }
  layout_templates.*.pane_count: { type: int, description: "Its number of panes" }
  layout_templates.*.panes: { type: string, description: "Its panes, as JSON text" }
  # source/list, source/get_param
  discovery.*.name: { type: string, description: "A discovery group, keyed by id: its name" }
  discovery.*.sources.*.name: { type: string, description: "An NDI source it finds, keyed by source id: its name" }
  discovery.*.sources.*.ip: { type: string, description: "Its address" }
  discovery.*.sources.*.url: { type: string, description: "Its address and port" }
  discovery.*.sources.*.web_url: { type: string, description: "Its web page address" }
  discovery.*.type: { type: string, description: "Auto or Manual" }
  discovery.*.server_enabled: { type: bool, description: "Whether it searches through an NDI Discovery Server" }
  discovery.*.server_ip: { type: string, description: "That server's address" }
  discovery.*.groups: { type: string, description: "The NDI groups searched, as JSON text" }
  discovery.*.ips: { type: string, description: "The addresses searched (manual), as JSON text" }
  # discovery/scan
  ndi_discovery.groups: { type: string, description: "The NDI groups searched, as JSON text" }
  ndi_discovery.manual_ips: { type: string, description: "The addresses searched outside the subnet, as JSON text" }

telemetry:
  poll:
    - every_ms: 3000
      send:
        - { method: GET, path: /api/v2/program/list.json }
    - every_ms: 30000
      send:
        - { method: GET, path: /api/v2/config/general.json }
        - { method: GET, path: /api/v2/config/nav/nav }
        - { method: GET, path: /api/v2/resolution/list.json }
        - { method: GET, path: /api/v2/frameRate/list.json }
        - { method: GET, path: /api/v2/take/transition/list.json }
        - { method: GET, path: /api/v2/window/get_output_list.json }
        - { method: GET, path: /api/v2/window/get_screen_list.json }
        - { method: GET, path: /api/v2/layout/template.json }
        - { method: GET, path: /api/v2/source/list.json }
        - { method: GET, path: /api/discovery/scan/groupChecked.json }
        - { method: GET, path: /api/discovery/scan/getManualIps.json }
  updates:
    - path: "^/api/v2/config/general\\.json$"
      json_match: { "$.result": "^ok$" }
      json: { name: "$.data.deviceName", version: "$.data.version", ws: "$.data.websocketPort", qr: "$.data.qrcode", lang: "$.data.languageShow", logo: "$.data.logoImgShow", langs: "$.data.languageOptions" }
      state:
        general.device_name: "{name}"
        general.version: "{version}"
        general.websocket_port: "{ws}"
        general.qrcode: "{qr}"
        general.language_switch: "{lang}"
        general.logo_shown: "{logo}"
        general.languages: "{langs}"
    - path: "^/api/v2/config/nav/nav$"
      json_match: { "$.result": "^ok$" }
      json: { home: "$.data.main_nav.home" }
      state: { general.nav_shown: "{home}" }
    # 4.3 lists value/label, 5.1 id/label; both are read.
    - path: "^/api/v2/resolution/list\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      each_match: { "$.id": "^\\d+$" }
      json: { id: "$.id", label: "$.label", width: "$.width", height: "$.height" }
      replace: resolutions
      state: &res_state
        "resolutions.{id}.label": "{label}"
        "resolutions.{id}.width": "{width}"
        "resolutions.{id}.height": "{height}"
    - path: "^/api/v2/resolution/list\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      each_match: { "$.value": "^\\d+$" }
      json: { id: "$.value", label: "$.label", width: "$.width", height: "$.height" }
      replace: resolutions
      state: *res_state
    - path: "^/api/v2/frameRate/list\\.json$"
      json_match: { "$.result": "^ok$" }
      json: { rates: "$.data" }
      state: { frame_rates: "{rates}" }
    - path: "^/api/v2/take/transition/list\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", label: "$.label" }
      replace: transitions
      state: { "transitions.{id}": "{label}" }
    - path: "^/api/v2/window/get_output_list\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", label: "$.label" }
      replace: output_types
      state: { "output_types.{id}": "{label}" }
    - path: "^/api/v2/window/get_screen_list\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", label: "$.label" }
      replace: screens
      state: { "screens.{id}": "{label}" }

    # ── Programs, then each program's windows, layouts, parameters, Take
    - path: "^/api/v2/program/list\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.pro_id", name: "$.name", status: "$.status" }
      replace: programs
      state:
        "programs.{id:key}.name": "{name}"
        "programs.{id:key}.on": "{status}"
      then_send:
        - { method: GET, path: /api/v2/window/list.json, query: { pro_id: "{id}" } }
        - { method: GET, path: /api/v2/layout/list.json, query: { pro_id: "{id}" } }
        - { method: GET, path: /api/v2/program/get_param.json, query: { pro_id: "{id}" } }
        - { method: POST, path: /api/v2/take/get.json, query: { pro_id: "{id}" } }
    - path: "^/api/v2/program/get_param\\.json\\?pro_id=([^&]+)$"
      json_match: { "$.result": "^ok$" }
      json: { w: "$.data.resolution.width", h: "$.data.resolution.height", i: "$.data.resolution.index", a: "$.data.resolution.aspect", f: "$.data.frameRate" }
      state:
        "programs.{1:url_decode:key}.width": "{w}"
        "programs.{1:url_decode:key}.height": "{h}"
        "programs.{1:url_decode:key}.resolution": "{i}"
        "programs.{1:url_decode:key}.aspect": "{a}"
        "programs.{1:url_decode:key}.frame_rate": "{f}"
    - path: "^/api/v2/take/get\\.json\\?pro_id=([^&]+)$"
      json_match: { "$.result": "^ok$" }
      json: { t: "$.data.time", s: "$.data.select" }
      state:
        "programs.{1:url_decode:key}.take_time": "{t}"
        "programs.{1:url_decode:key}.take_transition": "{s}"
    - path: "^/api/v2/window/list\\.json\\?pro_id=([^&]+)$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", name: "$.name", layout: "$.layout_id", modified: "$.modified", w: "$.resolution.width", h: "$.resolution.height", i: "$.resolution.index", a: "$.resolution.aspect", f: "$.frameRate" }
      replace: "windows.{1:url_decode:key}"
      state:
        "windows.{1:url_decode:key}.{id:key}.name": "{name}"
        "windows.{1:url_decode:key}.{id:key}.layout": "{layout}"
        "windows.{1:url_decode:key}.{id:key}.modified": "{modified}"
        "windows.{1:url_decode:key}.{id:key}.width": "{w}"
        "windows.{1:url_decode:key}.{id:key}.height": "{h}"
        "windows.{1:url_decode:key}.{id:key}.resolution": "{i}"
        "windows.{1:url_decode:key}.{id:key}.aspect": "{a}"
        "windows.{1:url_decode:key}.{id:key}.frame_rate": "{f}"
      then_send:
        - { method: GET, path: /api/v2/window/get.json, query: { pro_id: "{1:url_decode}", win_id: "{id}" } }
        - { method: GET, path: /api/v2/window/get_position.json, query: { pro_id: "{1:url_decode}", win_id: "{id}" } }
        - { method: GET, path: /api/v2/window/get_output_type.json, query: { pro_id: "{1:url_decode}", win_id: "{id}" } }
        - { method: GET, path: /api/v2/window/ndi/get_param.json, query: { pro_id: "{1:url_decode}", win_id: "{id}" } }
        - { method: GET, path: /api/v2/window/get_state_control.json, query: { pro_id: "{1:url_decode}", win_id: "{id}" } }
    - path: "^/api/v2/window/get\\.json\\?pro_id=([^&]+)&win_id=([^&]+)$"
      json_match: { "$.result": "^ok$" }
      json: { name: "$.data.layout_name", count: "$.data.layout_count" }
      state:
        "windows.{1:url_decode:key}.{2:url_decode:key}.layout_name": "{name}"
        "windows.{1:url_decode:key}.{2:url_decode:key}.pane_count": "{count}"
    - path: "^/api/v2/window/get\\.json\\?pro_id=([^&]+)&win_id=([^&]+)$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data.layout"
      json: { id: "$.id", number: "$.number", x: "$.x", y: "$.y", z: "$.z_index", w: "$.width", h: "$.height", type: "$.type", ar: "$.aspectRatio", fr: "$.frameRate", sid: "$.stream_id", sname: "$.stream_name", pname: "$.pattern_name", mix: "$.audio_mix.mix_type", pgm: "$.audio_mix.pgm_enable", pvw: "$.audio_mix.pvw_enable" }
      replace: "panes.{1:url_decode:key}.{2:url_decode:key}"
      state:
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.number": "{number}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.x": "{x}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.y": "{y}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.z": "{z}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.width": "{w}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.height": "{h}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.type": "{type}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.source_resolution": "{ar}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.source_frame_rate": "{fr}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.source": "{sid}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.source_name": "{sname}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.name": "{pname}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.audio_mix": "{mix}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.on_pgm": "{pgm}"
        "panes.{1:url_decode:key}.{2:url_decode:key}.{id}.on_pvw": "{pvw}"
    - path: "^/api/v2/window/get_position\\.json\\?pro_id=([^&]+)&win_id=([^&]+)$"
      json_match: { "$.result": "^ok$" }
      json: { s: "$.data.select" }
