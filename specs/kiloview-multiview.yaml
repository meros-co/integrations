      data: { type: json, required: true, label: Data, description: "The request's values, as 9.2 names them: zoom_value, zoom_speed, pan_value, tilt_value, pan_speed, tilt_speed, preset_no, speed, focus_value, focus_speed, red, blue, exposure_level." }
