spec: 1
id: kiloview-multiview
name: Kiloview Multiview Pro NDI multiviewer software
vendor: Kiloview
category: switcher

source:
  - title: Mulitiview Pro API 文档 (Multiview Pro API, Chinese), software and API version V_1.10, first issued 2023-02-10
    author: Kiloview
    url: https://cnstatic.kiloview.com/wp-content/uploads/2026/02/Mulitiview-Pro-API-cn-1.pdf
    note: >
      Manufacturer document on Kiloview's Chinese site (uploaded February
      2026, the newest Multiview Pro API there, checked 2026-10-27); the
      English API page https://www.kiloview.com/en/docs/multiview/api/
      links only the older Multiview Server HTTP API 1.0 (spec
      kiloview-multiview-server). Read in machine translation. The source
      of every request, field and reply here: 2.1 URL rules (the /api/v2
      paths, port 81, the app request header carrying the user name and
      token); 2.2 replies; 3 login; 4 global configuration (general,
      navigation, resolutions, frame rates); 5 programs (list, rename, add,
      remove, on/off, switch, parameters, language); 6 source discovery
      (discovery groups and their sources, add, modify, parameters, remove,
      source web page, refresh); 6 windows (list, switch, add, parameters,
      remove, encoder output types, screens, contents, screen output, NDI
      output and its parameters, sources, toolbar, layout, pane sources,
      pane settings, audio mix); 7 layouts (templates, list, add, rename,
      edit, remove, save as); 8 NDI discovery (groups, manual addresses);
      9 others (WebRTC SDP, PTZ, transitions, Take). Its section numbers
      repeat (two 5.4 to 5.7 and two 6s); this spec cites them by title.
  - title: Multiview Pro product and download pages
    author: Kiloview
    url: https://www.kiloview.com/en/support/download/multiview-pro/
    note: >
      Manufacturer page: Multiview Pro is software for Windows and macOS
      that shows NDI sources in multiview windows on the host's screens and
      sends windows out as NDI.

transport:
  type: http
  port: 81
  scheme: { setting: scheme }
  # The general configuration's QR code example is https on port 81; no
  # certificate is documented, so it is not checked.
  accept_invalid_certs: true
  timeout_ms: 5000
  # 2.1: every request carries the header app, a JSON object with the
  # user name and the token the login returns.
  headers:
    app: '{"username":{settings.username:json},"token":{settings.token:json}}'
  probe: { method: GET, path: /api/v2/config/general.json }

settings:
  username:
    type: string
    max_length: 64
    default: admin
    label: User name
    description: "The user the token belongs to, sent with it in the app header; the default user is admin."
  token:
    type: string
    secret: true
    max_length: 256
    default: ""
    label: Login token
    description: "The token the login command returns, sent in the app header with every request; run login and store it here with update_settings."
  scheme:
    type: enum
    values: [http, https]
    default: http
    label: Scheme
    description: "http, or https where the web server is set to it; the certificate is not checked."

ports:
  - { port: 81, protocol: http, role: control, when: "scheme http", note: "the HTTP service's default port (2.1)" }
  - { port: 81, protocol: https, role: control, when: "scheme https", note: "the same port over TLS, as the general configuration's QR code shows it" }

models:
  - id: multiview-pro
    name: Kiloview Multiview Pro
    supports:
      - login
      - get_general
      - get_nav
      - get_resolutions
      - get_frame_rates
      - set_language
      - get_programs
      - add_program
      - rename_program
      - remove_program
      - set_program_on
      - switch_program
      - get_program
      - set_program
      - get_discovery_groups
      - add_auto_discovery
      - add_manual_discovery
      - modify_auto_discovery
      - modify_manual_discovery
      - get_discovery
      - remove_discovery
      - open_source_webpage
      - refresh_sources
      - get_windows
      - switch_window
      - add_window
      - set_window
      - remove_window
      - get_output_types
      - get_screens
      - get_window
      - get_window_screen
      - set_window_screen
      - get_window_output
      - set_window_output
      - get_window_ndi
      - set_window_ndi
      - clear_window_sources
      - get_toolbar
      - set_toolbar
      - set_toolbar_font
      - set_toolbar_border
      - set_toolbar_audio_gain
      - set_window_layout
      - reload_window_layout
      - set_pane_source
      - remove_pane_source
      - get_pane
      - set_pane
      - set_pane_name
      - set_pane_audio
      - get_layout_templates
      - get_layouts
      - add_layout
      - rename_layout
      - modify_layout
      - remove_layout
      - save_layout_as
      - get_ndi_groups
      - get_manual_ips
      - set_ndi_discovery
      - get_window_sdp
      - ptz
      - ptz_zoom
      - ptz_zoom_speed
      - ptz_pan_tilt
      - ptz_pan_tilt_speed
      - ptz_store_preset
      - ptz_recall_preset
      - ptz_focus
      - ptz_focus_speed
      - ptz_auto_focus
      - ptz_white_balance
      - ptz_white_balance_manual
      - ptz_exposure_auto
      - ptz_exposure_manual
      - ptz_is_supported
      - get_transitions
      - take
      - tbar
      - get_take
      - set_take
    verification: none
    notes: >
      Multiview software (Windows, macOS) organized in programs, each with
      its own windows, one PVW and one PGM window among them; windows show
      NDI sources in panes laid out by layouts, go to the host's screens
      and can be sent out as NDI; a program takes PVW to PGM with a
      transition.

commands:
  # ── 3 Login ──────────────────────────────────────────────────────────
  login:
    summary: Log in and return the token for the token setting (POST /api/v2/users/login.json); the token is data.token
    params:
      username: { type: string, required: true, max_length: 64, label: User name, description: "The user to log in as; admin by default." }
      password: { type: string, required: true, secret: true, max_length: 128, label: Password, description: "That user's password." }
    send: { method: POST, path: /api/v2/users/login.json, content_type: application/json, body: '{"username":{username:json},"password":{password:json}}' }
    expect: { status: 200, json_equals: { "$.result": "ok" }, json_path: "$.data.token" }
    returns: value

  # ── 4 Global configuration ───────────────────────────────────────────
  get_general:
    summary: Return the device name, version, websocket port, languages and QR code address (GET /api/v2/config/general.json)
    send: { method: GET, path: /api/v2/config/general.json }
    expect: &data { status: 200, json_equals: { "$.result": "ok" }, json_path: "$.data" }
    returns: value
  get_nav:
    summary: Return whether the navigation bar is shown (GET /api/v2/config/nav/nav)
    send: { method: GET, path: /api/v2/config/nav/nav }
    expect: *data
    returns: value
  get_resolutions:
    summary: Return the resolutions a program or window can take (GET /api/v2/resolution/list.json)
    send: { method: GET, path: /api/v2/resolution/list.json }
    expect: *data
    returns: value
  get_frame_rates:
    summary: Return the frame rates offered (GET /api/v2/frameRate/list.json)
    send: { method: GET, path: /api/v2/frameRate/list.json }
    expect: *data
    returns: value
  set_language:
    summary: Switch the interface language (POST /api/v2/lang/modify.json)
    params:
      language: { type: enum, values: [zh, en], required: true, label: Language, description: "zh for Chinese, en for English." }
    send: { method: POST, path: /api/v2/lang/modify.json, content_type: application/json, body: '{"lang":{language:json}}' }
    expect: &ok { status: 200, json_equals: { "$.result": "ok" } }
    returns: ack

  # ── 5 Programs ───────────────────────────────────────────────────────
  get_programs:
    summary: Return every program with its name and whether it is on (GET /api/v2/program/list.json)
    send: { method: GET, path: /api/v2/program/list.json }
    expect: *data
    returns: value
  add_program:
    summary: Add a program with the resolution and frame rate of its PVW and PGM windows (POST /api/v2/program/add.json)
    params:
      name: &program_name { type: string, required: true, max_length: 64, label: Name, description: "The program's name, unique among programs; it is part of its windows' NDI channel names." }
      width: &width { type: int, min: 1, required: true, label: Width, description: "The resolution's width in pixels, such as 1920." }
      height: &height { type: int, min: 1, required: true, label: Height, description: "The resolution's height in pixels, such as 1080." }
      resolution: &res_index { type: int, min: 0, required: true, label: Resolution, description: "The resolution's id in get_resolutions' list, such as 2 for 1920x1080." }
      aspect: &aspect { type: float, min: 0, required: true, label: Aspect ratio, description: "The resolution's width divided by its height, such as 1.777." }
      frame_rate: &frame_rate { type: int, min: 1, required: true, label: Frame rate, description: "Frames per second, from get_frame_rates' list such as 60." }
    send: { method: POST, path: /api/v2/program/add.json, content_type: application/json, body: '{"name":{name:json},"resolution":{"width":{width},"height":{height},"index":{resolution},"aspect":{aspect:.3f}},"frameRate":{frame_rate}}' }
    expect: *ok
    returns: ack
  rename_program:
    summary: Rename a program (POST /api/v2/program/rername.json)
    params:
      program: &program { type: string, required: true, max_length: 32, label: Program, description: "The program's id (pro_id), as programs.<id> in state lists it." }
      name: *program_name
    send: { method: POST, path: /api/v2/program/rername.json, content_type: application/json, body: '{"pro_id":{program:json},"name":{name:json}}' }
    expect: *ok
    returns: ack
  remove_program:
    summary: Delete a program and every window in it (POST /api/v2/program/remove.json)
    params:
      program: *program
    send: { method: POST, path: /api/v2/program/remove.json, content_type: application/json, body: '{"pro_id":{program:json}}' }
    expect: *ok
    returns: ack
  set_program_on:
    summary: Turn a program on or off, starting or stopping the rendering of all its windows (POST /api/v2/program/set_status.json)
    params:
      program: *program
      enabled: { type: bool, required: true, label: "On", description: "On to render the program's windows; off to stop them." }
    send: { method: POST, path: /api/v2/program/set_status.json, content_type: application/json, body: '{"pro_id":{program:json},"status":{enabled}}' }
    expect: *ok
    returns: ack
  switch_program:
    summary: Switch to another program (POST /api/v2/program/switch.json)
    params:
      program: *program
    send: { method: POST, path: /api/v2/program/switch.json, content_type: application/json, body: '{"pro_id":{program:json}}' }
    expect: *ok
    returns: ack
  get_program:
    summary: Return a program's name, resolution and frame rate (GET /api/v2/program/get_param.json)
    params:
      program: *program
    send: { method: GET, path: /api/v2/program/get_param.json, query: { pro_id: "{program}" } }
    expect: *data
    returns: value
  set_program:
    summary: Set a program's name, and the resolution and frame rate of its PVW and PGM windows (POST /api/v2/program/set_param.json)
    params:
      program: *program
      name: *program_name
      width: *width
      height: *height
      resolution: *res_index
      aspect: *aspect
      frame_rate: *frame_rate
    send: { method: POST, path: /api/v2/program/set_param.json, content_type: application/json, body: '{"pro_id":{program:json},"name":{name:json},"resolution":{"width":{width},"height":{height},"index":{resolution},"aspect":{aspect:.3f}},"frameRate":{frame_rate}}' }
    expect: *ok
    returns: ack

  # ── 6 Source discovery ───────────────────────────────────────────────
  get_discovery_groups:
    summary: Return every discovery group with the NDI sources it finds (GET /api/v2/source/list.json)
    send: { method: GET, path: /api/v2/source/list.json }
    expect: *data
    returns: value
  add_auto_discovery:
    summary: "Add an automatic discovery group; groups is the API's list of NDI group names (POST /api/v2/source/add.json)"
    params:
      name: &disc_name { type: string, required: true, max_length: 64, label: Name, description: "The discovery group's name, unique among them." }
      server_enabled: &server_enabled { type: bool, default: false, label: Discovery Server, description: "Whether sources are found through an NDI Discovery Server." }
      server_ip: &server_ip { type: string, default: "", max_length: 64, label: Discovery Server address, description: "The NDI Discovery Server's address; empty when it is not used." }
      groups: &ndi_groups { type: json, required: true, label: NDI groups, description: "The NDI group names searched, as a list such as [\"public\"]." }
    send: { method: POST, path: /api/v2/source/add.json, content_type: application/json, body: '{"disc_name":{name:json},"disc_type":"Auto","discovery_enable":{server_enabled},"discovery_ip":{server_ip:json},"group":{groups}}' }
    expect: *ok
    returns: ack
  add_manual_discovery:
    summary: "Add a manual discovery group of addresses; groups and ips are the API's lists (POST /api/v2/source/add.json)"
    params:
      name: *disc_name
      groups: *ndi_groups
      ips: &ips { type: json, required: true, label: Addresses, description: "The IP addresses searched, outside the subnet too, as a list of strings." }
    send: { method: POST, path: /api/v2/source/add.json, content_type: application/json, body: '{"disc_name":{name:json},"disc_type":"Manual","group":{groups},"ip":{ips}}' }
    expect: *ok
    returns: ack
  modify_auto_discovery:
    summary: "Change a discovery group into, or keep it as, an automatic one with these settings (POST /api/v2/source/modify.json)"
    params:
      discovery: &disc { type: string, required: true, max_length: 32, label: Discovery group, description: "The discovery group's id (disc_id), as discovery.<id> in state lists it." }
      name: *disc_name
      server_enabled: *server_enabled
      server_ip: *server_ip
      groups: *ndi_groups
    send: { method: POST, path: /api/v2/source/modify.json, content_type: application/json, body: '{"disc_id":{discovery:json},"disc_name":{name:json},"disc_type":"Auto","discovery_enable":{server_enabled},"discovery_ip":{server_ip:json},"group":{groups}}' }
    expect: *ok
    returns: ack
  modify_manual_discovery:
    summary: "Change a discovery group into, or keep it as, a manual one with these addresses (POST /api/v2/source/modify.json)"
    params:
      discovery: *disc
      name: *disc_name
      groups: *ndi_groups
      ips: *ips
    send: { method: POST, path: /api/v2/source/modify.json, content_type: application/json, body: '{"disc_id":{discovery:json},"disc_name":{name:json},"disc_type":"Manual","group":{groups},"ip":{ips}}' }
    expect: *ok
    returns: ack
  get_discovery:
    summary: Return a discovery group's settings (GET /api/v2/source/get_param.json)
    params:
      discovery: *disc
    send: { method: GET, path: /api/v2/source/get_param.json, query: { disc_id: "{discovery}" } }
    expect: *data
    returns: value
  remove_discovery:
    summary: Delete a discovery group (POST /api/v2/source/remove.json)
    params:
      discovery: *disc
    send: { method: POST, path: /api/v2/source/remove.json, content_type: application/json, body: '{"disc_id":{discovery:json}}' }
    expect: *ok
    returns: ack
  open_source_webpage:
    summary: Have the host open an NDI source's web page in its default browser (POST /api/v2/webSite/set.json)
    params:
      url: { type: string, required: true, max_length: 512, label: URL, description: "The page's address, such as a source's web_url." }
    send: { method: POST, path: /api/v2/webSite/set.json, content_type: application/json, body: '{"url":{url:json}}' }
    expect: *ok
    returns: ack
  refresh_sources:
    summary: Search for NDI sources again (POST /api/v2/source/refresh.json)
    send: { method: POST, path: /api/v2/source/refresh.json, content_type: application/json, body: '{"refresh":true}' }
    expect: *ok
    returns: ack

  # ── 6 Windows ────────────────────────────────────────────────────────
  get_windows:
    summary: Return a program's windows with their layout, resolution and frame rate (GET /api/v2/window/list.json)
    params:
      program: *program
    send: { method: GET, path: /api/v2/window/list.json, query: { pro_id: "{program}" } }
    expect: *data
    returns: value
  switch_window:
    summary: Switch the WebRTC preview session to another window of the program (POST /api/v2/window/switch.json)
    params:
      program: *program
      window: &window { type: string, required: true, max_length: 32, label: Window, description: "The window's id (win_id): a number, or pvw or pgm, as windows.<program>.<id> in state lists it." }
      session: { type: string, required: true, max_length: 64, label: WebRTC session, description: "The WebRTC session id that get_window_sdp returned." }
    send: { method: POST, path: /api/v2/window/switch.json, content_type: application/json, body: '{"pro_id":{program:json},"win_id":{window:json},"session_id":{session:json}}' }
    expect: *ok
    returns: ack
  add_window:
    summary: Add a window to a program (POST /api/v2/window/add.json)
    params:
      program: *program
      window: *window
      name: &win_name { type: string, required: true, max_length: 64, label: Name, description: "The window's name." }
      width: *width
      height: *height
      resolution: *res_index
      aspect: *aspect
      frame_rate: *frame_rate
      numbered: &numbered { type: bool, default: false, label: Numbering, description: "Whether the window's panes are numbered." }
      number_min: &number_min { type: int, min: 0, default: 1, label: First number, description: "The lowest pane number." }
      number_max: &number_max { type: int, min: 0, default: 16, label: Last number, description: "The highest pane number." }
    send: { method: POST, path: /api/v2/window/add.json, content_type: application/json, body: '{"pro_id":{program:json},"win_id":{window:json},"name":{name:json},"resolution":{"width":{width},"height":{height},"index":{resolution},"aspect":{aspect:.3f}},"frameRate":{frame_rate},"number_used":{numbered},"number_range":{"min":{number_min},"max":{number_max}}}' }
    expect: *ok
    returns: ack
  set_window:
    summary: Set a window's name, resolution, frame rate and pane numbering (POST /api/v2/window/set_param.json)
    params:
      program: *program
      window: *window
      name: *win_name
      width: *width
      height: *height
      resolution: *res_index
      aspect: *aspect
      frame_rate: *frame_rate
      numbered: *numbered
      number_min: *number_min
      number_max: *number_max
    send: { method: POST, path: /api/v2/window/set_param.json, content_type: application/json, body: '{"pro_id":{program:json},"win_id":{window:json},"name":{name:json},"resolution":{"width":{width},"height":{height},"index":{resolution},"aspect":{aspect:.3f}},"frameRate":{frame_rate},"number_used":{numbered},"number_range":{"min":{number_min},"max":{number_max}}}' }
    expect: *ok
    returns: ack
  remove_window:
    summary: Delete a window of a program (POST /api/v2/window/remove.json)
    params:
      program: *program
      window: *window
    send: { method: POST, path: /api/v2/window/remove.json, content_type: application/json, body: '{"pro_id":{program:json},"win_id":{window:json}}' }
    expect: *ok
    returns: ack
  get_output_types:
    summary: Return the encoder outputs a window can use, such as NDI (GET /api/v2/window/get_output_list.json)
    send: { method: GET, path: /api/v2/window/get_output_list.json }
    expect: *data
    returns: value
  get_screens:
    summary: Return the screens connected to the host (GET /api/v2/window/get_screen_list.json)
    send: { method: GET, path: /api/v2/window/get_screen_list.json }
    expect: *data
    returns: value
  get_window:
    summary: Return a window's layout and every pane's source, name, size, type and audio mix (GET /api/v2/window/get.json)
    params:
      program: *program
      window: *window
    send: { method: GET, path: /api/v2/window/get.json, query: { pro_id: "{program}", win_id: "{window}" } }
    expect: *data
    returns: value
  get_window_screen:
    summary: Return which screen a window is shown on, 0 or less for none (GET /api/v2/window/get_position.json)
    params:
      program: *program
      window: *window
    send: { method: GET, path: /api/v2/window/get_position.json, query: { pro_id: "{program}", win_id: "{window}" } }
    expect: *data
    returns: value
  set_window_screen:
    summary: Show a window on a screen of the host, or take it off the screens (POST /api/v2/window/set_position.json)
    params:
      program: *program
      window: *window
      screen: { type: int, required: true, label: Screen, description: "The screen's number in get_screens' list, from 1; 0 takes the window off the screens." }
    send: { method: POST, path: /api/v2/window/set_position.json, content_type: application/json, body: '{"pro_id":{program:json},"win_id":{window:json},"select":{screen}}' }
    expect: *ok
    returns: ack
  get_window_output:
    summary: Return a window's encoder output, NDI or none (GET /api/v2/window/get_output_type.json)
    params:
      program: *program
      window: *window
    send: { method: GET, path: /api/v2/window/get_output_type.json, query: { pro_id: "{program}", win_id: "{window}" } }
    expect: *data
    returns: value
  set_window_output:
    summary: Send a window out as NDI, or stop its encoder output (POST /api/v2/window/set_output_type.json)
    params:
      program: *program
      window: *window
      ndi: { type: bool, required: true, label: NDI output, description: "On to send the window out as NDI; off to stop the encoder output." }
    send: { method: POST, path: /api/v2/window/set_output_type.json, content_type: application/json, body: '{"pro_id":{program:json},"win_id":{window:json},"select":{ndi:map.ndi_output}}' }
    expect: *ok
    returns: ack
  get_window_ndi:
    summary: Return a window's NDI output settings (GET /api/v2/window/ndi/get_param.json)
    params:
      program: *program
      window: *window
    send: { method: GET, path: /api/v2/window/ndi/get_param.json, query: { pro_id: "{program}", win_id: "{window}" } }
    expect: *data
    returns: value
  set_window_ndi:
    summary: "Set a window's NDI output: transport, multicast, groups and Discovery Server (POST /api/v2/window/ndi/set_param.json)"
    params:
      program: *program
      window: *window
      connection: { type: enum, values: [Default, no_multi_tcp, multicast], default: Default, label: Transport, description: "Default, no_multi_tcp to turn multi-TCP off, or multicast." }
      netprefix: { type: string, default: "", max_length: 64, label: Multicast address, description: "The multicast address prefix, for multicast; empty otherwise." }
      netmask: { type: string, default: "", max_length: 64, label: Multicast mask, description: "The multicast subnet mask, for multicast; empty otherwise." }
      ttl: { type: int, min: 0, max: 255, default: 1, label: TTL, description: "The multicast time to live." }
      groups: *ndi_groups
      server_enabled: *server_enabled
      server_ip: *server_ip
    send: { method: POST, path: /api/v2/window/ndi/set_param.json, content_type: application/json, body: '{"pro_id":{program:json},"win_id":{window:json},"connection_type":{connection:json},"netprefix":{netprefix:json},"netmask":{netmask:json},"ttl":{ttl},"group":{groups},"discovery_enable":{server_enabled},"discovery_ip":{server_ip:json}}' }
    expect: *ok
    returns: ack
  clear_window_sources:
    summary: Remove the sources of every pane of a window (POST /api/v2/window/delete_sources.json)
    params:
      program: *program
      window: *window
    send: { method: POST, path: /api/v2/window/delete_sources.json, content_type: application/json, body: '{"pro_id":{program:json},"win_id":{window:json}}' }
    expect: *ok
    returns: ack
  get_toolbar:
    summary: Return a window's overlays, font, border and audio gain (GET /api/v2/window/get_state_control.json)
    params:
      program: *program
      window: *window
