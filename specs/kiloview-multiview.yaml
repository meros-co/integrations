  panes.*.*.*.y: { type: float, unit: "%", description: "Its top edge" }
  panes.*.*.*.z: { type: float, description: "Its stacking order, from 0" }
  panes.*.*.*.width: { type: float, unit: "%", description: "Its width" }
  panes.*.*.*.height: { type: float, unit: "%", description: "Its height" }
