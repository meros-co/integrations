  set_aux_out_tap:
    summary: "Set an aux output's tap: 0 AIN, 1 AIN+M, 2 IN, 3 IN+M, 4 PREEQ, 5 PREEQ+M, 6 POSTEQ, 7 POSTEQ+M, 8 PRE, 9 PRE+M, 10 POST"
    params:
      output: { type: int, min: 1, max: 6, required: true }
      tap:    { type: int, min: 0, max: 10, required: true }
    send:
      address: /routing/aux/{output:02d}/pos
      args: [ { value: "{tap}", type: int } ]
    returns: none

  set_main_out_source:
