quirks:
  - models: [all]
    severity: critical
    text: >
      mix/on is inverted: 0 is muted, 1 is passing audio. The community list
      labels it "OFF, ON" and "mute" without saying which way round; the sense
      here is the X32 family's (Maillot p.27), which the X AIR shares and the
      Companion module corroborates. The mute_* commands use the bool10
      directive; the get_*_on queries return the raw flag (1 = not muted). DCA
      on works the same way. Mute groups are not inverted: /config/mute/N 1
      engages the group.

  - models: [all]
    severity: critical
    text: >
      load_snapshot acts at once on the live mix: every parameter in the slot's
      recall scope is overwritten (product manual p.23, p.29), including
      headamp gain and phantom when the scope includes them. The scope is a
      per-slot setting, so the same load does different things on differently
      configured mixers. /-snap/load has no documented reply and reports
      unverified; read get_snapshot_index afterwards. The manufacturer document
      (p.4) writes the snapshot node as "/snap/"; the community list and the
      Companion module use "/-snap/", which this spec follows. save_snapshot
      overwrites the slot and delete_snapshot empties it without confirmation.

  - models: [all]
    severity: warning
    text: >
      The manufacturer document says the mixer echoes a parameter "in response
      to a get, set or fulfilment of single parameter subscription" (p.2). On
      the X32 a set is not echoed to the client that sent it (Maillot p.10).
      Which holds for the X AIR is not confirmed, so sets report unverified
      rather than wait for an echo that may never come. Any echo that does
      arrive still updates state through the telemetry rules. Read a value back
      with its get command to confirm it.

  - models: [all]
    severity: warning
    text: >
      /xremote sends changes to at most eight active clients and lapses after
      10 seconds unless renewed (protocol document p.1). In Access Point mode
      the mixer accepts at most four Wi-Fi clients (product manual p.13,
      p.33). UDP replies can be lost silently over Wi-Fi; a lost poll reply
      leaves that value unset until it next changes.

  - models: [all]
    severity: info
    text: >
      Address differences from the X32 (specs/behringer-x32.yaml): UDP 10024,
      not 10023. The main bus is /lr, not /main/st; there is no mono/centre bus
      and no matrix. The stereo aux (or USB) return is a single strip /rtn/aux,
      not /auxin/01-08. FX returns are /rtn/1-4, not /fxrtn/01-08. FX sends
      /fxsend/1-4 are strips of their own with no X32 equivalent, and a strip's
      sends 07-10 feed them. Buses are /bus/1-6 without zero padding. Main
      assignment is mix/lr, not mix/st. The insert selector is insert/fxslot
      (0-8), not insert/sel. Trim is preamp/rtntrim and applies to the USB
      return. Headamps are /headamp/01-16, two digits and numbered from 1 on
      the wire, not /headamp/000-127. DCAs and mute groups are 1-4, and their
      membership bitmaps 0-15. Strips have no icon. Scenes, snippets and cues
      are replaced by 64 snapshots under /-snap. There is no talkback,
      oscillator, user-control or undo section; there are send pan, tap and
      group flags, automix, a headphone/monitor section under /config/solo,
      output routing under /routing, and a USB recorder on some models.

  - models: [all]
    severity: info
    text: >
      Every float on the wire is 0.0-1.0 (protocol document p.2), mapped by the
      mixer onto the parameter's range. Faders and send levels use the X32
      family's four-segment taper, 0.75 = 0 dB and 1.0 = +10 dB (Maillot
      p.128). The 0-1 commands and state carry the position; the *_db commands
      and state carry dB through the x32_fader conversion (the same four
      segments as points, 0.0 read as -90 dB for -oo; state rounded to 0.1 dB).
      The X AIR document itself does not state the taper; it is taken from the
      X32 document, as for the other shared conventions. Ranges quoted in summaries are the community list's.
      Integers are signed 32-bit and booleans are ints (p.2).

  - models: [all]
    severity: info
    text: >
      Headamp numbering is the community list's "Preamps 1-16". The XR18,
      X18 and MR18 have 16 mic preamps, the XR16 8 (channels 1-8) and the
      XR12 and MR12 4 (channels 1-4) (product manual p.13, p.32-34). How the
      line inputs and the stereo aux input are addressed is not documented, so
      they are not covered, and a headamp number above the model's preamp
      count addresses nothing documented. The community list gives the gain
      range as -12 to +20 dB; the manuals' block diagrams give the mic preamp
      as -12 to +60 dB in 0.5 dB steps (p.43), which the summaries follow.

  - models: [xr16, xr12, mr12]
    severity: info
    text: >
      All models process 16 input channels and 6 aux buses (product manual
      p.32-34). The XR12 and MR12 have 12 inputs: processing channels 13-16
      take their signal from any input 1-12 (p.13). The XR16 has 4 aux outputs
      and the XR12/MR12 2, so buses 5-6 (XR16) or 3-6 (XR12) are pre-defined
      as subgroups (p.13), and set_aux_out_source/tap for an output the model
      lacks addresses nothing physical. The USB return strip /rtn/aux carries
      the recorder's stereo playback on these models (MIDI chart, p.31).

  - models: [xr18, x18, mr18]
    severity: info
    text: >
      The XR18, X18 and MR18 have the 18x18 USB audio interface and ULTRANET
      but no USB stick recorder (product manual p.32-33), so the recorder
      commands are not offered; /-action/setclock is ignored on them per the
      community list. /rtn/aux is the stereo aux line input 17-18.

  - models: [all]
    severity: warning
    text: >
      The channel input source /ch/NN/config/insrc is listed as an int 0-15
      with the labels "OFF, IN01-16", which is seventeen values. set_channel_source
      accepts the stated range 0-15; which value is OFF, if any, is not
      established.

  - models: [all]
    severity: warning
    text: >
      Gate mode is 0-4. The community list names the values GATE, EXP2, EXP3,
      EXP4, DUCK; the X32 document orders the same set EXP2, EXP3, EXP4, GATE,
      DUCK. The order on the X AIR is not established, so the command takes the
      number only.

  - models: [all]
    severity: info
    text: >
      Copy errors in the community list, resolved here as follows. The bus pan
      range reads "-oo - +10" and bus insert/on "-15.0 - +15.0" (treated as
      pan and a switch). The bus compressor filter type is listed twice, 0-8
      and 0-5 (0-8 is used, as for channels and main). Bus DCA and mute-group
      membership is printed as /bus/grp/dca without the bus number (the
      numbered form /bus/N/grp is used). The bus EQ Q reads "10.0 - 9.3". USB
      routing reads [1..36]; the XR18 has 18 USB sends (manual p.33), so 1-18
      is used. Automix weight reads -24 to +24 dB.

  - models: [all]
    severity: info
    text: >
      Not covered because the sources disagree or are silent: the main LR
      insert (the community list prints it as /lr/dyn/insert/..., under the
      compressor), FX return EQ on/off (listed for the aux return only), the
      31-band GEQ (the community list indexes it /geq/0, other references by
      frequency), and setting FX parameters (the community list types
      /fx/N/par/NN as int, the X32 family uses floats; get_fx_parameter reads
      whatever the mixer holds, and the 64-parameter range is the X32's).
      Names other than snapshot names (31 characters, p.4) have no documented
      length limit.

  - models: [all]
    severity: info
    text: >
      DCA mute mutes its channels only when "DCA Groups in the Mute System" is
      enabled in the mixer's preferences (/-prefs/dcamute; product manual p.24,
      p.28). Otherwise a DCA controls level only.

  - models: [all]
    severity: info
    text: >
      /info answers with four strings: server version, device name, device
      model and device version (protocol document p.2), so it serves as the
      liveness probe and as the source of get_console_model and
      get_firmware_version. /xinfo answers with the IP address in place of the
      server version; the document's wording leaves the order unclear, so it
      is not used.
