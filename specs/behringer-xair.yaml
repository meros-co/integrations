    params:
      channel: { type: int, min: 1, max: 16, required: true }
      bus: { type: int, min: 1, max: 10, required: true }
      level_db: { type: float, min: -90.0, max: 10.0, required: true }
    send:
      address: "/ch/{channel:02d}/mix/{bus:02d}/level"
      args: [ { value: "{level_db:to.x32_fader}", type: float } ]
    returns: none

  get_channel_send_level_db:
    summary: "Read an input channel's send level (bus 1-6 is mix bus 1-6, 7-10 is FX send 1-4) in dB (-90 is -oo), converted from the fader position by the x32_fader conversion"
    params:
      channel: { type: int, min: 1, max: 16, required: true }
      bus: { type: int, min: 1, max: 10, required: true }
    send: { address: "/ch/{channel:02d}/mix/{bus:02d}/level" }
    expect: { address: "/ch/{channel:02d}/mix/{bus:02d}/level", arg: 0, convert: x32_fader }
    returns: value

  set_aux_send_level_db:
    summary: "Set the aux (USB) return's send level (bus 1-6 is mix bus 1-6, 7-10 is FX send 1-4; dB, -90 to +10); sent as the fader position by the x32_fader conversion"
    params:
      bus: { type: int, min: 1, max: 10, required: true }
      level_db: { type: float, min: -90.0, max: 10.0, required: true }
    send:
      address: "/rtn/aux/mix/{bus:02d}/level"
      args: [ { value: "{level_db:to.x32_fader}", type: float } ]
    returns: none

  get_aux_send_level_db:
    summary: "Read the aux (USB) return's send level (bus 1-6 is mix bus 1-6, 7-10 is FX send 1-4) in dB (-90 is -oo), converted from the fader position by the x32_fader conversion"
    params:
      bus: { type: int, min: 1, max: 10, required: true }
    send: { address: "/rtn/aux/mix/{bus:02d}/level" }
    expect: { address: "/rtn/aux/mix/{bus:02d}/level", arg: 0, convert: x32_fader }
    returns: value

  set_fx_return_send_level_db:
    summary: "Set an FX return's send level (bus 1-6 is mix bus 1-6, 7-10 is FX send 1-4; dB, -90 to +10); sent as the fader position by the x32_fader conversion"
    params:
      fx_return: { type: int, min: 1, max: 4, required: true }
      bus: { type: int, min: 1, max: 10, required: true }
      level_db: { type: float, min: -90.0, max: 10.0, required: true }
    send:
      address: "/rtn/{fx_return}/mix/{bus:02d}/level"
      args: [ { value: "{level_db:to.x32_fader}", type: float } ]
    returns: none

  get_fx_return_send_level_db:
    summary: "Read an FX return's send level (bus 1-6 is mix bus 1-6, 7-10 is FX send 1-4) in dB (-90 is -oo), converted from the fader position by the x32_fader conversion"
    params:
      fx_return: { type: int, min: 1, max: 4, required: true }
      bus: { type: int, min: 1, max: 10, required: true }
    send: { address: "/rtn/{fx_return}/mix/{bus:02d}/level" }
    expect: { address: "/rtn/{fx_return}/mix/{bus:02d}/level", arg: 0, convert: x32_fader }
    returns: value

  set_dca_fader_db:
    summary: "Set a DCA fader level in dB, -90 (-oo) to +10; sent as the fader position by the x32_fader conversion"
    params:
      dca: { type: int, min: 1, max: 4, required: true }
      level_db: { type: float, min: -90.0, max: 10.0, required: true }
    send:
      address: "/dca/{dca}/fader"
      args: [ { value: "{level_db:to.x32_fader}", type: float } ]
    returns: none

  get_dca_fader_db:
    summary: "Read a DCA's fader level in dB (-90 is -oo), converted from the fader position by the x32_fader conversion"
    params:
      dca: { type: int, min: 1, max: 4, required: true }
    send: { address: "/dca/{dca}/fader" }
    expect: { address: "/dca/{dca}/fader", arg: 0, convert: x32_fader }
    returns: value

telemetry:
  # /xremote asks the mixer to send every parameter change to this client for
  # 10 seconds, to at most eight clients (protocol document p.1); renewed every 9.
  subscribe:
    send: ["/xremote"]
    every_ms: 9000
  # The current values, asked once on connecting, one at a time: /xremote only
  # reports changes. The list is explicit because the format has no loops:
  # mute, fader and name of every strip, DCAs, mute groups, solo, the 16
  # headamps, the current snapshot and the headphone/monitor level and source.
  poll:
    send:
      - "/ch/01/mix/on"
