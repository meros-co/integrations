    expect: { address: "/-prefs/name", arg: 0 }
    returns: value

  get_console_model:
    summary: "Read the mixer model from /info (the device_model string)"
    send: { address: "/info" }
    expect: { address: "/info", arg: 2 }
    returns: value

  get_firmware_version:
    summary: "Read the mixer firmware from /info (the device_version string)"
    send: { address: "/info" }
    expect: { address: "/info", arg: 3 }
    returns: value

  get_console_name:
    summary: "Read the mixer name from /info (the device_name string)"
    send: { address: "/info" }
    expect: { address: "/info", arg: 1 }
    returns: value

  get_status:
    summary: "Read /status: 'active' or 'standby', whether the mixer can currently fulfil subscriptions"
    send: { address: "/status" }
    expect: { address: "/status", arg: 0 }
