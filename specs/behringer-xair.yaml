spec: 1
id: behringer-xair
name: Behringer X AIR / Midas M AIR
vendor: Behringer
category: mixer

source:
  - title: "X AIR Mixer Series Remote Control Protocol (firmware 1.11 or higher), 'X AIR Mixer OSC Document (fw 1.11)', 4 pages, 29 Aug 2016"
    author: MUSIC Group (Music Tribe)
    url: https://cdn.mediavalet.com/aunsw/musictribe/hmivS7F05kKSJlWDYPGLpA/agTKkSIWS0y1bJl97YZEjg/Original/X%20AIR%20Remote%20Control%20Protocol.pdf
    note: >
      Manufacturer document, the only one Behringer publishes for X AIR OSC.
      UDP 10024 with replies to the requester's IP and port, /info, /xinfo,
      /status, /xremote (at most eight clients, 10 s timeout), get by sending an
      address without arguments, set with one argument (p.1); the /info and
      /status replies, echo of a parameter on get, set or subscription, type
      rules: big-endian, 4-byte padded, floats 0.0-1.0, booleans as ints (p.2);
      meter banks /meters/0-9 (p.3-4); snapshot operations and the 59-character
      recall scope (p.4). It names a companion Parameters.txt holding every OSC
      path and range; that file is not published by Behringer and no copy was
      obtained, so the address tree comes from the community list below.
  - title: "X-Air / M-Air OSC Commands (Behringer World Wiki, page x-air_osc, last modified 2024-02-29)"
    author: Paul Vannatto (community)
    url: https://behringer.world/wiki/doku.php?id=x-air_osc
    note: >
      Community document, not a manufacturer specification: it says the X-Air
      OSC commands "were not officially documented, other than a brief text
      file", and its table is derived from the Sysex OSC Generator X-Air command
      list. It is the source of every parameter address and range in this spec
      (sections Action, Snapshots, Status, Buses 1-6, Channels 01-16,
      Configuration, DCA 1-4, FX 1-4, FX Sends 1-4, Preamps 1-16, Main LR,
      Routing, FX Returns 1-4), including its note that FX1-4 are mix buses 7-10
      for channel sends. It has evident copy errors, listed in the quirks.
  - title: "Product Manual X AIR XR18/X18/XR16/XR12 (M_BE_0605-AAA)"
    author: Behringer (Music Tribe)
    url: https://mediadl.musictribe.com/media/PLM/data/docs/X-AIR/M_BE_0605-AAA_X-AIR_EN.pdf
    note: >
      Model facts only. System overview and XR12 channels 13-16 fed from any
      input (p.13); 4-band input EQ (p.18, p.21); 6-band bus and main EQ with
      PEQ/GEQ/TEQ (p.19, p.22); 4 mute groups (p.20, p.25); DCA 1-4 (p.25);
      snapshots (p.23, p.29); automix X/Y (p.22, p.30); link preferences and
      DCA mute preference (p.24, p.28); MIDI implementation, snapshots 1-64 by
      program change, OSC over SysEx (p.31); specifications: every model 16
      input channels plus a stereo aux/USB return, 4 FX returns, 6 aux buses
      and main LR; XR18/X18 18x18 USB interface and ULTRANET, XR16/XR12 USB
      stick stereo recorder (p.32-34); headamp gain -12 to +60 dB in 0.5 dB
      steps (block diagram, p.43).
  - title: "User Manual M AIR MR18/MR12 (M_MI_0605-AAF)"
    author: Midas (Music Tribe)
    url: https://cdn.mediavalet.com/aunsw/musictribe/prxekByihEKC5A73jgAr7Q/8SxI9diW9kqQ21hjVM_hmw/Original/M_MI_0605-AAF_MR18-MR12_EN.pdf
    note: >
      MR18 specifications (p.32) match the XR18, MR12 (p.33) the XR12: 16
      processing channels plus a stereo USB return, 4 FX returns, 6 aux buses;
      the same MIDI chart (p.31) and HA gain -12 to +60 dB (p.43).
  - title: "Unofficial X32/M32 OSC Remote Protocol, version 4.02-01 (Jan 12, 2020)"
    author: Patrick-Gilles Maillot (community)
    url: https://tostibroeders.nl/wp-content/uploads/2020/02/X32-OSC.pdf
    note: >
      Cross-reference only, for conventions the X AIR documents leave implicit
      and that the X32 family shares: mix/on 1 = passing audio, 0 = muted
      (p.27), the four-segment fader taper (p.128), sets not echoed to the
      sender (p.10). See specs/behringer-x32.yaml.
  - title: Bitfocus Companion, companion-module-behringer-xair
    url: https://github.com/bitfocus/companion-module-behringer-xair
    note: >
      MIT-licensed; cross-check only. Corroborates UDP 10024, /xinfo, /xremote,
      /-snap/NN/name and /-snap/index, /headamp/NN with two digits from 01,
      /rtn/aux, /rtn/N, /fxsend/N, /lr, mute on mix/on and the /config/solo
      parameters.

# Fader and send levels: Maillot's four linear segments (p.128), 0.0-0.0625
# for -oo/-90 to -60 dB, to 0.25 for -30, to 0.5 for -10 and to 1.0 for +10;
# 0.75 is 0 dB. Each point is [wire position, dB].
conversions:
  x32_fader:
    points: [[0.0, -90.0], [0.0625, -60.0], [0.25, -30.0], [0.5, -10.0], [1.0, 10.0]]

transport:
  type: osc-udp
  port: 10024
  timeout_ms: 500
  reply: to-source
  probe: /info

