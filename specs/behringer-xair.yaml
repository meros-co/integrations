    send:
      address: /routing/p16/{output:02d}/src
      args: [ { value: "{source}", type: int } ]
    returns: none

  set_ultranet_tap:
    summary: "Set an ULTRANET (P16) output's tap: 0 AIN, 1 AIN+M, 2 IN, 3 IN+M, 4 PREEQ, 5 PREEQ+M, 6 POSTEQ, 7 POSTEQ+M, 8 PRE, 9 PRE+M, 10 POST"
    params:
      output: { type: int, min: 1, max: 16, required: true }
      tap:    { type: int, min: 0, max: 10, required: true }
    send:
      address: /routing/p16/{output:02d}/pos
      args: [ { value: "{tap}", type: int } ]
    returns: none

  set_usb_out_source:
    summary: "Set a USB send's source: 0-15 Ch01-16, 16-17 AuxL-R, 18-25 Fx1L-Fx4R, 26-31 Bus1-6, 32-35 Send1-4, 36-37 L/R"
    params:
      output: { type: int, min: 1, max: 18, required: true }
      source: { type: int, min: 0, max: 37, required: true }
    send:
      address: /routing/usb/{output:02d}/src
      args: [ { value: "{source}", type: int } ]
    returns: none

  set_usb_out_tap:
    summary: "Set a USB send's tap: 0 AIN, 1 AIN+M, 2 IN, 3 IN+M, 4 PREEQ, 5 PREEQ+M, 6 POSTEQ, 7 POSTEQ+M, 8 PRE, 9 PRE+M, 10 POST"
    params:
      output: { type: int, min: 1, max: 18, required: true }
      tap:    { type: int, min: 0, max: 10, required: true }
    send:
      address: /routing/usb/{output:02d}/pos
      args: [ { value: "{tap}", type: int } ]
    returns: none

  load_snapshot:
    summary: "Load (recall) the snapshot stored in slot 1-64 (/-snap/load). See the snapshot quirk"
    params:
      snapshot: { type: int, min: 1, max: 64, required: true }
    send:
      address: /-snap/load
      args: [ { value: "{snapshot}", type: int } ]
    returns: none

  save_snapshot:
    summary: "Save the current mix to snapshot slot 1-64 (/-snap/save), using the name set with set_snapshot_save_name"
    params:
      snapshot: { type: int, min: 1, max: 64, required: true }
    send:
      address: /-snap/save
      args: [ { value: "{snapshot}", type: int } ]
    returns: none

  delete_snapshot:
    summary: "Delete the snapshot in slot 1-64 (/-snap/delete)"
    params:
      snapshot: { type: int, min: 1, max: 64, required: true }
    send:
      address: /-snap/delete
      args: [ { value: "{snapshot}", type: int } ]
    returns: none

  set_snapshot_save_name:
    summary: "Set the name the next save_snapshot stores (/-snap/name, 31 characters at most)"
    params:
      name: { type: string, max_length: 31, required: true }
    send:
      address: /-snap/name
      args: [ { value: "{name}", type: string } ]
    returns: none

  get_snapshot_index:
    summary: "Read the number of the snapshot most recently loaded or saved (1-64)"
    send: { address: "/-snap/index" }
    expect: { address: "/-snap/index", arg: 0 }
    returns: value

  get_snapshot_name:
    summary: "Read the name of the snapshot most recently loaded"
    send: { address: "/-snap/name" }
    expect: { address: "/-snap/name", arg: 0 }
    returns: value

  get_snapshot_slot_name:
    summary: "Read the name stored in snapshot slot 1-64"
    params:
      snapshot: { type: int, min: 1, max: 64, required: true }
    send: { address: "/-snap/{snapshot:02d}/name" }
    expect: { address: "/-snap/{snapshot:02d}/name", arg: 0 }
    returns: value

  set_snapshot_slot_name:
    summary: "Rename the snapshot in slot 1-64 at once, without a save (31 characters at most)"
    params:
      snapshot: { type: int, min: 1, max: 64, required: true }
      name:     { type: string, max_length: 31, required: true }
    send:
      address: /-snap/{snapshot:02d}/name
      args: [ { value: "{name}", type: string } ]
    returns: none

  get_snapshot_scope:
    summary: "Read the recall scope of snapshot slot 1-64: 59 characters, '+' recalled, '-' not"
    params:
      snapshot: { type: int, min: 1, max: 64, required: true }
    send: { address: "/-snap/{snapshot:02d}/scope" }
    expect: { address: "/-snap/{snapshot:02d}/scope", arg: 0 }
    returns: value

  set_snapshot_scope:
    summary: "Set the recall scope of snapshot slot 1-64: 59 characters in the document's order, '+' recalled, '-' not"
    params:
      snapshot: { type: int, min: 1, max: 64, required: true }
      scope:    { type: string, pattern: "^[+-]{59}$", required: true }
    send:
      address: /-snap/{snapshot:02d}/scope
      args: [ { value: "{scope}", type: string } ]
    returns: none

