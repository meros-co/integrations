    params:
      source: { type: int, min: 0, max: 10, required: true }
    send:
      address: /routing/main/01/src
      args: [ { value: "{source}", type: int } ]
    returns: none

  set_phones_source:
    summary: "Set the phones output's source: 0 LR, 1 MON, 2-10 U0102-U1718"
    params:
      source: { type: int, min: 0, max: 10, required: true }
    send:
      address: /routing/main/02/src
      args: [ { value: "{source}", type: int } ]
    returns: none

  set_ultranet_source:
    summary: "Set an ULTRANET (P16) output's source: 0-15 Ch01-16, 16-17 AuxL-R, 18-25 Fx1L-Fx4R, 26-31 Bus1-6, 32-35 Send1-4, 36-37 L/R, 38-55 U1-18"
    params:
      output: { type: int, min: 1, max: 16, required: true }
