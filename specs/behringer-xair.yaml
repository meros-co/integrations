  # ── Levels in dB ─────────────────────────────────────────────────────────
  # The same addresses as the 0-1 commands above, taking and returning dB
  # through the x32_fader conversion.
  set_channel_fader_db:
    summary: "Set an input channel's fader level in dB, -90 (-oo) to +10; sent as the fader position by the x32_fader conversion"
    params:
      channel: { type: int, min: 1, max: 16, required: true }
      level_db: { type: float, min: -90.0, max: 10.0, required: true }
    send:
      address: "/ch/{channel:02d}/mix/fader"
      args: [ { value: "{level_db:to.x32_fader}", type: float } ]
    returns: none

  get_channel_fader_db:
    summary: "Read an input channel's fader level in dB (-90 is -oo), converted from the fader position by the x32_fader conversion"
    params:
      channel: { type: int, min: 1, max: 16, required: true }
    send: { address: "/ch/{channel:02d}/mix/fader" }
    expect: { address: "/ch/{channel:02d}/mix/fader", arg: 0, convert: x32_fader }
    returns: value

  set_aux_fader_db:
