    params:
      headamp: { type: int, min: 1, max: 16, required: true }
      enabled: { type: bool, default: true }
    send:
      address: /headamp/{headamp:02d}/phantom
      args: [ { value: "{enabled:bool01}", type: int } ]
    returns: none

  get_headamp_gain:
