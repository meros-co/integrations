  lens.moving.focus: { type: bool, description: "Focus moving" }
  lens.moving.shift_horizontal: { type: bool, description: "Horizontal lens shift moving" }
  lens.moving.shift_vertical: { type: bool, description: "Vertical lens shift moving" }
  lens_memory.load_by_signal: { type: bool, description: "Lens memory load by signal on (053-5)" }
  lens_memory.forced_mute: { type: bool, description: "Lens memory forced mute on (053-5)" }
  lens_profile: { type: int, description: "Reference lens memory profile, 1 or 2 (053-11)" }
  eco_mode: { type: string, description: "Eco, lamp or light mode by the model's names, or the code as 'NNh' when the model's table lacks it (097-8)" }
  name: { type: string, description: "Projector name on the LAN (097-45)" }
  info.projector_name: { type: string, description: "Projector name from 037 INFORMATION REQUEST" }
  info.model_name: { type: string, description: "Model name (078-5)" }
  info.serial_number: { type: string, description: "Serial number (305-2)" }
  info.mac_address: { type: string, description: "MAC address, colon-separated lowercase hex (097-155)" }
  info.base_model_type: { type: string, description: "Base model type bytes as hex (078-1 DATA01-03, or 305-1 DATA01-02 and DATA12-13)" }
  info.sound: { type: bool, description: "The projector has a sound function (078-1 DATA04)" }
  info.timer_functions: { type: string, description: "'none', 'clock', 'sleep_timer' or 'clock_and_sleep_timer' (078-1 DATA05)" }
  pip.mode: { type: string, description: "'picture_in_picture' or 'picture_by_picture' (097-198)" }
  pip.start_position: { type: string, description: "'top_left', 'top_right', 'bottom_left' or 'bottom_right'" }
  pip.sub_input: { type: string, description: "Sub input 1 by the model's names" }
  pip.sub_input_2: { type: string, description: "Sub input 2 by the model's names" }
  pip.sub_input_3: { type: string, description: "Sub input 3 by the model's names" }
  edge_blending: { type: bool, description: "Edge blending on (097-243-1)" }
  cover_closed: { type: bool, description: "Mirror or lens cover closed (078-6)" }
  signal.horizontal_frequency: { type: string, description: "Horizontal synchronous frequency as the projector displays it (084)" }
  signal.vertical_frequency: { type: string, description: "Vertical synchronous frequency as the projector displays it (084)" }
  carbon_savings.total_kg: { type: float, unit: kg, description: "Total carbon savings (037-6)" }
  carbon_savings.operation_kg: { type: float, unit: kg, description: "Carbon savings during this operation (037-6)" }

quirks:
  - models: [all]
    severity: info
    text: >
      Opened for commands only (monitor false), nothing is polled and no set is followed by a read; one 305-3
      BASIC INFORMATION REQUEST (078-2 RUNNING STATUS REQUEST on models without it) every 5 s shows the projector
      is there, since it sends nothing unasked. The refresh command still reads everything once.
  - models: [all]
    severity: info
    text: >
      A failed command is a device error carrying the ERR1/ERR2 pair as its code (such as "0101") and the
      meaning of §2.4: 0000 not recognized, 0001 not supported by the model, 0100 invalid value, 0101 invalid
      input terminal, 0203 value cannot be set, 0204 forced onscreen mute on, 0207 no signal, 0208 test
      pattern or filer displayed, 020D power is off, 020E execution failed, 020F no authority, and so on. A set
      whose reply carries an execution result of FFh or 01h (018, 050, 053, 053-3 to 053-10, 079, 098-x,
      319-10), or a 030-x result other than 0000h, fails too. A polled query answered "not supported" is not
      asked again until the device is opened again.
  - models: [all]
    severity: warning
    text: >
      The aspect, the shutter and the audio select are write-only: the protocol has no query for them, so the
      state does not show them. The picture mute, the sound mute and the onscreen mute turn themselves off
      when the input or signal changes (and the sound mute when the volume changes), as §3.5-§3.9 say; the
      next poll shows it.
  - models: [all]
    severity: info
    text: >
      The appendix's aspect table gives some models two names for one code (02h is both WIDE SCREEN and 16:9
      on the NP-PA, NP-PH, NP-PX and XP-A/V models, CINEMA and 16:9 on the NP-ME, NP-P554U, NP-P603X and
      NP-UM models; 06h both ZOOM and FULL on several), and the NP-PX651X family two codes for one name (16:10
      at 06h and 0Ch, AUTO at 05h and 0Fh). set_aspect sends the code the table puts the name under (the first
      of two); set_aspect_code sends any code. XP-X171Q/X141Q put NORMAL at 0Fh and 2.35/1.88 at 11h/12h where
      the NP-PX2000UL has AUTO, 1.88 and 2.35.
  - models: [all]
    severity: info
    text: >
      The input in state is the selected signal type (078-3 and 305-3 DATA03-04), not the terminal name:
      type 'hdmi' number 2 is HDMI2, and the appendix's "Selection signal type" tables map each model's
      terminals onto these. Some models answer 305-3 with FFh as type 2 when there is no signal, and the
      NP-U300X family always 00h (appendix page 30).
  - models: [all]
    severity: info
    text: >
      Models accept POWER ON in standby only in the standby modes the appendix lists for them (page 11 of the
      2020 appendix, page 4 of the 2024 one), and some only over serial in a power-saving standby; in another
      standby mode the projector does not answer on the LAN, and the device shows as disconnected until it is
      powered from elsewhere.
  - models: [all]
    severity: info
    text: >
      With link serial the module opens the host's serial port and speaks the same frames as over TCP; the
      port open is the connection, and a port that fails (a USB adapter unplugged) is reopened like a dropped
      connection. The speed must match the projector's; each model's notes list the speeds it offers.
  - models: [np-pa1004ul, np-pa803ul, np-pa803u, np-pa622u, np-pa621u, np-ph3501ql, np-ph1202hl, np-px1005ql, np-px1004ul, np-px602ul, np-p605ul]
    severity: info
    text: >
      The appendix's sub input table marks HDBaseT and SLOT on the NP-PH3501QL and NP-PX1005QL families as not
      available for sub inputs 2 and 3, and the 098-198 reply lists the sub inputs 2 and 3 as targets 03h and
      04h where the request uses 09h and 0Ah; the reply's result byte is read either way.
