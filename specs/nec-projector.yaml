spec: 1
id: nec-projector
name: NEC and Sharp NEC projectors (NEC Projector Control Command, binary)
vendor: Sharp NEC Display Solutions (NEC Display Solutions)
category: display
implementation: native
reason: >
  Binary framing: every command and reply is a class byte, a command byte, two ID bytes, a length, data and a
  checksum (the low byte of the sum of the preceding bytes), and a reply is matched to its command by class and
  command byte, its class byte telling success (20h-23h) from failure (A0h-A3h, followed by an error code
  pair). Values are 16- and 32-bit little-endian integers inside the data. The codes for inputs, aspects, eco
  or light modes and picture-in-picture sources differ by model family and come from the manual's appendix
  tables, and the projector pushes nothing, so state is a paced poll of only what the family supports.

source:
  - title: "Projector Control Command Reference Manual, BDT140013 Revision 7.1 (2020-04-16), with its Appendixes BDT140014 Revision 20.0 (2020-04-16)"
    author: "NEC Display Solutions, Ltd."
    url: "https://www.nec.com.au/download_file/3153/1322"
    note: >
      Manufacturer document; the same file is served by Sharp NEC Europe at
      https://www.sharpdisplays.eu/p/download/cp/Products/Projectors/Shared/CommandLists/NEC-ExternalControlManual-english.pdf.
      Serial cable pinout (PC CONTROL, D-SUB 9P, with RTS and CTS wired) and TCP 7142 (§1.1, §1.2: 115200, 38400,
      19200, 9600 or 4800 bit/s by model, 8 data bits, no parity, 1 stop bit, full duplex); command and reply
      notation, ID1, ID2, checksum with the example 20h 81h 01h 60h 01h 00h giving 03h, LEN (§2.1, §2.2);
      success and failure replies (§2.3); the ERR1/ERR2 table (§2.4); every command with its bytes, data and
      reply (§3.1-§3.53): 009, 015, 016, 018 with the example 02h 03h 00h 00h 02h 01h 06h 0Eh, 020-025, 030-1
      with the examples for brightness 10 and -10, 030-2, 030-12, 030-15, 037, 037-3, 037-4 with the 18000 s
      example, 037-6, 050 with the key code list, 051, 052, 053, 053-1 to 053-7, 053-10, 053-11, 060-1, 078-1 to
      078-6, 079, 084, 097-8, 097-45, 097-155, 097-198, 097-243-1, 098-8, 098-45, 098-198, 098-243-1, 305-1 to
      305-3, 319-10. The appendixes (pages 9-38 of the appendix part): models and their serial speeds and LAN
      (page 10), the standby mode that accepts POWER ON (page 11), the supported command list per model
      (pages 12-17), and the per-model values of the input terminals (pages 18-22), aspects (23-24), eco modes
      (25), base model types (26-29), selection signal types (30-35), sub inputs (36-37) and audio select (38).
  - title: "Projector Control Command Reference Manual, VDT24004 Revision 1.0 (2024-08-27)"
    author: "Sharp NEC Display Solutions, Ltd."
    url: "https://business.sharpusa.com/Portals/0/downloads/Manuals/sharp-pj-control-command-codes.pdf"
    note: >
      Manufacturer document for the XP models. Same framing and commands as BDT140013, with 037-3 and 078-6
      removed, 037-4 renamed LIGHT INFORMATION REQUEST 3 (light usage time only), 097-8 and 098-8 renamed LIGHT
      MODE, the error status bits redefined (cover, fan, light off or LD driver communication, phosphor wheel,
      driver version, CPU communication, temperature sensor, TEC driver, color sensor, lens not installed), the
      lens target 06h periphery focus added to 053, 053-1 and 053-2, selection signal types 21h HDMI, 27h
      HDBaseT and 28h SDI, and keys added to 050 (TEST, digits, SHUTTER OPEN and CLOSE, HDBaseT, LIGHT MODE,
      ID SET, HDMI, GEOMETRIC, AUX, HDMI2, OSD MUTE OFF and ON, USER1-3, SDI, DEFAULT).
  - title: "Projector Control Command Reference Manual Appendixes, VDT24005 Revision 4.0 (2025)"
    author: "Sharp NEC Display Solutions, Ltd."
    url: "https://business.sharpusa.com/Portals/0/downloads/Manuals/sharp-pj-control-command-appendix.pdf"
    note: >
      The XP-A201U, XP-A175U/A155U, XP-A104U/A824U, XP-E501U-W, XP-M421W/M401H, XP-P701U-W/P621U-W/P601U-W,
      XP-P721Q/P601Q, XP-V801U/V731U/V711U and XP-X171Q/X141Q: serial speeds and LAN (page 3), standby modes
      (page 4), supported commands (page 5), input terminals (page 6), aspects (pages 7-8), light modes (page
      9), base model types (page 10), selection signal types (pages 11-12) and sub inputs (page 13).

settings:
  # tcp: TCP 7142 (§1.2). serial: the PC CONTROL port, RS-232C (§1.1).
  link: { type: enum, values: [tcp, serial], default: tcp, label: Link, description: "tcp reaches the projector over its LAN port (TCP 7142); serial uses an RS-232 port of the host wired to the projector's PC CONTROL port." }
  serial_port: { type: string, max_length: 256, label: Serial port, description: "With link serial, the host's serial port wired to the projector's PC CONTROL port: COM3 on Windows, /dev/ttyUSB0 on Linux, /dev/cu.usbserial-1420 on macOS." }
  # §1.2: 115200, 38400, 19200, 9600 or 4800 bit/s, by model (appendix page 10). The manual names no default.
  baud_rate: { type: enum, values: ["4800", "9600", "19200", "38400", "115200"], default: "38400", label: Baud rate, description: "With link serial, bits per second as set on the projector; each model's notes list the speeds it offers." }
  data_bits: { type: int, min: 8, max: 8, default: 8, label: Data bits, description: "With link serial, bits per character; the manual gives 8." }
  parity: { type: enum, values: [none], default: none, label: Parity, description: "With link serial, no parity, as the manual gives." }
  stop_bits: { type: int, min: 1, max: 1, default: 1, label: Stop bits, description: "With link serial, one stop bit, as the manual gives." }
  # The pinout wires RTS and CTS (§1.1) but the conditions name no flow control (§1.2).
  flow_control: { type: enum, values: [none, rts-cts], default: none, label: Flow control, description: "With link serial, none unless the projector's port needs RTS/CTS, which its pinout wires but the manual does not require." }

ports:
  - { port: 7142, protocol: tcp, role: control, when: "link tcp" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "RS-232C PC CONTROL port (D-SUB 9P), cross cable" }

