spec: 1
id: rosstalk
name: Ross Video production switchers (RossTalk)
vendor: Ross Video
category: switcher

# Transcribed from Ross Video's RossTalk command tables for its production
# switchers. Ross publishes two switcher dialects under the RossTalk name:
#
#   - Carbonite family (Carbonite, Carbonite eXtreme, Carbonite Black, Solo,
#     Mosaic, UltraChromeHR, Carbonite Ultra, Ultra 60, HyperMax, Code,
#     Graphite): MEs are addressed as ME-source:ME-number ("MECUT ME:1",
#     "KEYAUTO MME:2:1").
#   - Acuity family (Acuity, Ultrix Acuity, Vision): MEs are a bare number
#     ("MECUT 1", "KEYAUTO 1:4"). Commands whose wire form differs from the
#     Carbonite form are the acuity_* commands below.
#
# Commands that are byte-identical in both tables (CC, FTB, GPI, MNEM and the
# XPT forms with an ME:n destination) are shared.
#
# Not included, because the transport never reads a reply (reply: none) and
# Ross documents no reply format: HELP, VERSION, KEYSTATE, ACTIVEID,
# "USERVAR ALLVAR:?", "MEM ?" and the "?" query form of XPT, MS, MNEM,
# TRANSRATE, TRANSTYPE, TRANSINCL, MVBOX, USERVAR and KEYSHAPED.
#
# XPression, Ultrix, openGear, the Ross video servers, AudioEdge and the
# OverDrive/Caprica "SW ..." RossTalk-IN set are separate command sets on
# separate products and are not in this spec.
source:
  - title: "Carbonite Device DashBoard Setup (online help), RossTalk > Carbonite/Graphite Commands (help build 2026-01-30)"
    author: Ross Video Ltd.
    url: https://help.rossvideo.com/carbonite-device-db/Topics/Protocol/External/CNT/RT-CNT-Comm.html
    note: >
      Manufacturer document; the current edition of the RossTalk Commands
      guide (4802DR-403). Port 7788, CR/LF termination, case sensitivity, the
      ME-source tokens (ME, MME, MSC; Canvas = MSC, Tile = MME), Carbonite
      Ultra ME numbering (2, 1, P/P) and Table 1 "RossTalk Commands" (CC,
      CKINIT, CLIP*, *CCVARIABLE, DOWN, FOCUS, FTB, GPI, GPI xx:HIGH/LOW,
      KEYAUTO*, KEYCUT*, KEYMODE, LOADSET, MEAUTO, MECUT, MEM, MEMSAVE, MNEM,
      MS, MTLoad/MTTakeIn/MTTakeOut/MTText, MVBOX, MVBOXSHIFT, NEXT, NOOP,
      NTP, REBOOTALL, SAVESET, SEQI, SEQO, SETCCVARIABLE, TRANSINCL,
      TRANSRATE, TRANSTYPE, UP, XPT) with the XPT destination and source
      lists, HyperMax configurable outputs and split-ME sources following it.
  - title: "Carbonite Device DashBoard Setup (online help), RossTalk > Acuity/Vision Commands (help build 2026-01-30)"
    author: Ross Video Ltd.
    url: https://help.rossvideo.com/carbonite-device-db/Topics/Protocol/External/VIS/RT-VIS-Comm.html
    note: >
      Manufacturer document. RTalk-IN setup (Network TCP, Server(1) or
      Server(Many), local port 7788, Cmd Response OFF by default), the MLE
      note for Vision, case sensitivity, and Table 1 "RossTalk Commands"
      (ACTIVEID, CAPTURE, CC, CUECLIP, EJECT, FTB, GPI, GPI xx:On/Off,
      KEYAUTO*, KEYCUT*, KEYSHAPED, KEYSTATE, LOADSET, MEAUTO, MECUT, MEM,
      MEMSAVE, MNEM, MS, MSPLAY, MVBOX, PAUSE, PLAY, RESETALL, SAVESET,
      SETVIDMODE, TRANSINCL, TRANSRATE, TRANSTYPE, USERVAR, VERSION, XPT) with
      the XPT destination and source lists.
  - title: "Carbonite Device Setup (Legacy) (online help), RossTalk > Carbonite/Graphite Commands and Acuity/Vision Commands"
    author: Ross Video Ltd.
    url: https://help.rossvideo.com/carbonite-device/Topics/Protocol/RossTalk/CNT/RT-CNT-Comm.html
    note: >
      Manufacturer document, earlier edition. Used only to note where the
      current edition changed a command: MVBOX processor token OP (now IO),
      CLIP* commands without a channel, the Acuity TRANSTYPE list (MEDIA, now
      SEQ) and the Acuity MS example "MS ME:4:2:52" (now "MS 4:2:52").

transport:
  type: line-tcp
  port: 7788
  framing: terminated
  terminator: crlf
  encoding: ascii
  timeout_ms: 2000
  reply: none

ports:
  - { port: 7788, protocol: tcp, role: control }

