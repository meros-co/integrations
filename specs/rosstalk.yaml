commands:
  # ── Shared by both dialects (identical wire form) ─────────────────────────
  custom_control:
    summary: Run custom control cc in bank b (CC b:cc)
    params:
      bank: { type: int, min: 1, max: 99, required: true,
        label: Bank,
        description: "Custom control bank, from 1 as on the switcher." }
      cc:   { type: int, min: 1, max: 99, required: true,
        label: Custom control,
        description: "Custom control number within the bank, from 1; what it does is defined on the switcher." }
    send: "CC {bank}:{cc:02d}"
    returns: none

  fade_to_black:
    summary: Perform a fade-to-black transition (FTB)
    send: "FTB"
    returns: none

  gpi:
    summary: Perform the action assigned to GPI input xx (GPI xx); no action if the GPI is an output
    params:
      number: { type: int, min: 1, max: 99, required: true,
        label: GPI,
        description: "GPI number, from 1 as on the switcher; what it does is set up on the switcher." }
    send: "GPI {number:02d}"
    returns: none

  set_mnemonic:
    summary: Set the mnemonic name of a video source, such as IN:6 (MNEM source:new-name)
    params:
      source: { type: string, pattern: '^[A-Z]+(:[A-Z0-9/]+)*$', required: true,
        label: Source,
        description: "Video source whose mnemonic to set, such as IN:6." }
      name:   { type: string, required: true,
        label: Mnemonic,
        description: "The source's new mnemonic name, as shown on the switcher." }
    send: "MNEM {source}:{name}"
    returns: none

  select_program:
    summary: Select input n on the program bus of an ME (XPT ME:me:PGM:IN:n)
    params:
      source: { type: int, min: 1, max: 999, required: true,
        label: Input,
        description: "Input number in the switcher's input mapping, which may differ from the connector number." }
      me:     { type: string, pattern: '^([1-9][0-9]?|P/P|PP)(A|B|AB)?$', default: "1",
        label: ME,
        description: "ME number as the switcher numbers it, the highest being the program ME; P/P for Carbonite Ultra's program ME, and an A, B or AB suffix for a HyperMax split ME (1B)." }
    send: "XPT ME:{me}:PGM:IN:{source}"
    returns: none

  select_preset:
    summary: Select input n on the preset bus of an ME (XPT ME:me:PST:IN:n)
    params:
      source: { type: int, min: 1, max: 999, required: true,
        label: Input,
        description: "Input number in the switcher's input mapping, which may differ from the connector number." }
      me:     { type: string, pattern: '^([1-9][0-9]?|P/P|PP)(A|B|AB)?$', default: "1",
        label: ME,
        description: "ME number as the switcher numbers it, the highest being the program ME; P/P for Carbonite Ultra's program ME, and an A, B or AB suffix for a HyperMax split ME (1B)." }
    send: "XPT ME:{me}:PST:IN:{source}"
    returns: none

  select_key:
    summary: Select input n on a key bus of an ME (XPT ME:me:KEY:k:IN:n)
    params:
      source: { type: int, min: 1, max: 999, required: true,
        label: Input,
        description: "Input number in the switcher's input mapping, which may differ from the connector number." }
      key:    { type: int, min: 1, max: 99, required: true,
        label: Key,
        description: "Keyer number on the ME, from 1." }
      me:     { type: string, pattern: '^([1-9][0-9]?|P/P|PP)(A|B|AB)?$', default: "1",
        label: ME,
        description: "ME number as the switcher numbers it, the highest being the program ME; P/P for Carbonite Ultra's program ME, and an A, B or AB suffix for a HyperMax split ME (1B)." }
    send: "XPT ME:{me}:KEY:{key}:IN:{source}"
    returns: none

  select_key_second:
    summary: Select input n on a key's second channel, the alpha, backside or second DVE channel (XPT ME:me:KEY:k:KEYBUS:2:IN:n)
    params:
      source: { type: int, min: 1, max: 999, required: true,
        label: Input,
        description: "Input number in the switcher's input mapping, which may differ from the connector number." }
      key:    { type: int, min: 1, max: 99, required: true,
        label: Key,
        description: "Keyer number on the ME, from 1." }
      me:     { type: string, pattern: '^([1-9][0-9]?|P/P|PP)(A|B|AB)?$', default: "1",
        label: ME,
        description: "ME number as the switcher numbers it, the highest being the program ME; P/P for Carbonite Ultra's program ME, and an A, B or AB suffix for a HyperMax split ME (1B)." }
    send: "XPT ME:{me}:KEY:{key}:KEYBUS:2:IN:{source}"
    returns: none

  crosspoint:
    summary: >
      Select any documented source on any documented destination (XPT
      vid-dest:vid-source). Destinations such as AUX:2, ME:1:PGM, ME:1:PST,
      ME:3:KEY:2, MME:1 (Acuity AUX:bank:aux, Vision MLE:n:PGM); sources such
      as IN:6, BK, BG, CLN, CLIP, PGM, PV, AUX:1, ME:1:CLN, ME:1:KEY:2:A, MS:1,
      CK:1, CKA:1, CAN:1, SCN:1, XP:1:V (Acuity GS:1, MS:me:ch, MVA:1, BG:n)
    params:
      destination: { type: string, pattern: '^[A-Z]+(:[A-Z0-9/]+)+$', required: true,
        label: Destination,
        description: "Video destination as RossTalk names it, such as AUX:2, ME:1:PGM, ME:3:KEY:2 or MME:1 (AUX:bank:aux on Acuity, MLE:n:PGM on Vision)." }
      source:      { type: string, pattern: '^[A-Z]+(:[A-Z0-9/]+)*$', required: true,
        label: Source,
        description: "Video source as RossTalk names it, such as IN:6, BK, BG, CLN, PGM, AUX:1, ME:1:KEY:2:A or MS:1 (GS:1 or MS:me:ch on Acuity)." }
    send: "XPT {destination}:{source}"
    returns: none

  # ── Carbonite family ──────────────────────────────────────────────────────
  chroma_key_init:
    summary: Initialize chroma key engine n (CKINIT n); not HyperMax
    params:
      chroma_key: { type: int, min: 1, max: 99, required: true,
        label: Chroma key,
        description: "Chroma key engine number, from 1." }
