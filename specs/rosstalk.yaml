        label: MultiViewer,
        description: "MultiViewer number, from 1." }
      box:         { type: int, min: 1, max: 99, required: true,
        label: Box,
        description: "Box number in the MultiViewer layout, from 1." }
      source:      { type: string, pattern: '^[A-Z]+(:[A-Z0-9/]+)*$', required: true,
        label: Source,
        description: "Video source to show, such as IN:6 or AUX:2." }
    send: "MVBOX {processor}:{multiviewer}:{box}:{source}"
    returns: none

  multiviewer_box_shift:
    summary: Select a source in a shifted box of the VP or IO MultiViewer (MVBOXSHIFT VP|IO:MultiViewer:box:source)
    params:
      processor:   { type: enum, values: [VP, IO], required: true,
        label: MultiViewer type,
        description: "VP for the Video Processor MultiViewer, IO for the I/O MultiViewer." }
      multiviewer: { type: int, min: 1, max: 99, required: true,
        label: MultiViewer,
        description: "MultiViewer number, from 1." }
      box:         { type: int, min: 1, max: 99, required: true,
        label: Box,
        description: "Box number in the MultiViewer layout, from 1." }
      source:      { type: string, pattern: '^[A-Z]+(:[A-Z0-9/]+)*$', required: true,
        label: Source,
        description: "Video source to show, such as IN:6 or AUX:2." }
    send: "MVBOXSHIFT {processor}:{multiviewer}:{box}:{source}"
    returns: none

  noop:
    summary: No operation, to keep the connection open (NOOP)
    send: "NOOP"
    returns: none

  ntp_off:
    summary: Turn off the NTP server (NTP OFF)
    send: "NTP OFF"
    returns: none

  ntp_set:
    summary: Add an NTP server address (NTP SET:address)
    params:
      address: { type: string, pattern: '^[A-Za-z0-9.-]+$', required: true,
        label: Server address,
        description: "The NTP server's address or host name." }
    send: "NTP SET:{address}"
    returns: none

  reboot_all:
    summary: Reboot all SDPE blades in the frame (REBOOTALL); HyperMax only
    send: "REBOOTALL"
    returns: none

  transition_include:
    summary: Replace the next-transition selection with background (B) and/or keys, such as B:2:3 (TRANSINCL ME-source:ME-number:incl:...)
    params:
      include: { type: string, pattern: '^(B|[0-9]{1,2})(:(B|[0-9]{1,2}))*$', required: true,
        label: Include,
        description: "The new next-transition selection, joined by colons: B for background and key numbers, such as B:2:3; it replaces the current one." }
      me_type: { type: enum, values: [ME, MME, MSC], default: ME,
        label: ME type,
        description: "The kind of output: ME, MME (MiniME and Tile) or MSC (MultiScreen and Canvas)." }
      me:      { type: string, pattern: '^([1-9][0-9]?|P/P|PP)(A|B|AB)?$', default: "1",
        label: ME,
        description: "ME number as the switcher numbers it, the highest being the program ME; P/P for Carbonite Ultra's program ME, and an A, B or AB suffix for a HyperMax split ME (1B)." }
    send: "TRANSINCL {me_type}:{me}:{include}"
    returns: none

  transition_rate:
    summary: Set the transition rate in frames (TRANSRATE ME-source:ME-number:rate)
    params:
      rate:    { type: int, min: 0, max: 999, required: true,
        label: Rate,
        description: "Transition duration in frames." }
      me_type: { type: enum, values: [ME, MME, MSC], default: ME,
        label: ME type,
        description: "The kind of output: ME, MME (MiniME and Tile) or MSC (MultiScreen and Canvas)." }
      me:      { type: string, pattern: '^([1-9][0-9]?|P/P|PP)(A|B|AB)?$', default: "1",
        label: ME,
        description: "ME number as the switcher numbers it, the highest being the program ME; P/P for Carbonite Ultra's program ME, and an A, B or AB suffix for a HyperMax split ME (1B)." }
    send: "TRANSRATE {me_type}:{me}:{rate}"
    returns: none

  transition_type:
    summary: Set the transition type to dissolve, DVE, media wipe or wipe (TRANSTYPE ME-source:ME-number:type)
    params:
      type:    { type: enum, values: [DISS, DVE, MEDIA, WIPE], required: true,
        label: Transition type,
        description: "DISS dissolve, DVE, MEDIA media wipe or WIPE." }
      me_type: { type: enum, values: [ME, MME, MSC], default: ME,
        label: ME type,
        description: "The kind of output: ME, MME (MiniME and Tile) or MSC (MultiScreen and Canvas)." }
      me:      { type: string, pattern: '^([1-9][0-9]?|P/P|PP)(A|B|AB)?$', default: "1",
        label: ME,
        description: "ME number as the switcher numbers it, the highest being the program ME; P/P for Carbonite Ultra's program ME, and an A, B or AB suffix for a HyperMax split ME (1B)." }
    send: "TRANSTYPE {me_type}:{me}:{type}"
    returns: none

  select_aux:
    summary: Select input n on aux bus a (XPT AUX:a:IN:n)
    params:
      aux:    { type: int, min: 1, max: 99, required: true,
        label: Aux,
        description: "Aux bus number, from 1." }
      source: { type: int, min: 1, max: 999, required: true,
        label: Input,
        description: "Input number in the switcher's input mapping, which may differ from the connector number." }
    send: "XPT AUX:{aux}:IN:{source}"
    returns: none

  select_minime:
    summary: Select input n on MiniME output m (XPT MME:m:IN:n)
    params:
      minime: { type: int, min: 1, max: 99, required: true,
        label: MiniME,
        description: "MiniME output number, from 1." }
      source: { type: int, min: 1, max: 999, required: true,
        label: Input,
        description: "Input number in the switcher's input mapping, which may differ from the connector number." }
    send: "XPT MME:{minime}:IN:{source}"
    returns: none

  # ── Acuity family (Acuity, Ultrix Acuity, Vision) ─────────────────────────
  acuity_capture:
    summary: Capture a source, PVW or AUX:bank:aux, to RAM or disk on a Media-Store channel for n frames (CAPTURE DISK/RAM:channel:source:frames); Acuity only
    params:
      target:  { type: enum, values: [DISK, RAM], required: true,
        label: Capture to,
        description: "DISK or RAM." }
      channel: { type: int, min: 1, max: 99, required: true,
        label: Channel,
        description: "Media-Store channel to capture into, from 1." }
      source:  { type: string, pattern: '^(PVW|AUX:[0-9]+:[0-9]+)$', required: true,
        label: Source,
        description: "What to capture: PVW for preview, or an aux as AUX:bank:aux." }
      frames:  { type: int, min: 1, max: 99999, required: true,
        label: Frames,
        description: "Number of frames to capture." }
    send: "CAPTURE {target}:{channel}:{source}:{frames}"
    returns: none

  ultrix_acuity_capture:
    summary: Capture an ME's preview or program output on a Media-Store channel (CAPTURE ME:source:channel); Ultrix Acuity only
    params:
      me:      { type: int, min: 1, max: 8, required: true,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
      source:  { type: enum, values: [PV, PGM, PGMB, PGMC, PGMD, PGME, PGMF], required: true,
        label: Output,
        description: "PV for the ME's preview, or PGM to PGMF for one of its program outputs." }
      channel: { type: int, min: 1, max: 99, required: true,
        label: Channel,
        description: "Media-Store channel to capture into, from 1." }
    send: "CAPTURE {me}:{source}:{channel}"
    returns: none

  vtr_cue_clip:
    summary: Send the VTR/VDCP cue-clip command to the server channel assigned to a source, such as IN:7 (CUECLIP vid-source:clip-name)
    params:
      source: { type: string, pattern: '^[A-Z]+(:[A-Z0-9/]+)*$', required: true,
        label: Source,
        description: "Video source the server channel is assigned to, such as IN:7." }
      clip:   { type: string, required: true,
        label: Clip,
        description: "Name of the clip to cue on the server." }
    send: "CUECLIP {source}:{clip}"
    returns: none

  vtr_eject:
    summary: Send the VTR/VDCP eject command to the server channel assigned to a source (EJECT vid-source)
    params:
      source: { type: string, pattern: '^[A-Z]+(:[A-Z0-9/]+)*$', required: true,
        label: Source,
        description: "Video source the server channel is assigned to, such as IN:7." }
    send: "EJECT {source}"
    returns: none

  vtr_play:
    summary: Send the VTR/VDCP play command to the server channel assigned to a source (PLAY vid-source)
    params:
      source: { type: string, pattern: '^[A-Z]+(:[A-Z0-9/]+)*$', required: true,
        label: Source,
        description: "Video source the server channel is assigned to, such as IN:7." }
    send: "PLAY {source}"
    returns: none

  vtr_pause:
    summary: Send the VTR/VDCP pause command to the server channel assigned to a source (PAUSE vid-source)
    params:
      source: { type: string, pattern: '^[A-Z]+(:[A-Z0-9/]+)*$', required: true,
        label: Source,
        description: "Video source the server channel is assigned to, such as IN:7." }
    send: "PAUSE {source}"
    returns: none

  gpi_set:
    summary: Set GPI xx on or off (GPI xx:1 / GPI xx:0)
    params:
      number: { type: int, min: 1, max: 99, required: true,
        label: GPI,
        description: "GPI number, from 1 as on the switcher; what it does is set up on the switcher." }
      state:  { type: bool, required: true,
        label: "On",
        description: "On sets the GPI on, off sets it off." }
    send: "GPI {number:02d}:{state:bool01}"
    returns: none

  acuity_key_auto:
    summary: Auto-transition key k on ME n, toggling it (KEYAUTO ME:keyer)
    params:
      me:  { type: int, min: 1, max: 8, required: true,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
      key: { type: int, min: 1, max: 99, required: true,
        label: Key,
        description: "Keyer number on the ME, from 1." }
    send: "KEYAUTO {me}:{key}"
    returns: none

  acuity_key_auto_on:
    summary: Auto-transition key k on ME n on air if it is not already (KEYAUTOON ME:keyer)
    params:
      me:  { type: int, min: 1, max: 8, required: true,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
      key: { type: int, min: 1, max: 99, required: true,
        label: Key,
        description: "Keyer number on the ME, from 1." }
    send: "KEYAUTOON {me}:{key}"
    returns: none

  acuity_key_auto_off:
    summary: Auto-transition key k on ME n off air if it is on air (KEYAUTOOFF ME:keyer)
    params:
      me:  { type: int, min: 1, max: 8, required: true,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
      key: { type: int, min: 1, max: 99, required: true,
        label: Key,
        description: "Keyer number on the ME, from 1." }
    send: "KEYAUTOOFF {me}:{key}"
    returns: none

  acuity_key_cut:
    summary: Cut key k on ME n, toggling it (KEYCUT ME:keyer)
    params:
      me:  { type: int, min: 1, max: 8, required: true,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
      key: { type: int, min: 1, max: 99, required: true,
        label: Key,
        description: "Keyer number on the ME, from 1." }
    send: "KEYCUT {me}:{key}"
    returns: none

  acuity_key_cut_on:
    summary: Cut key k on ME n on air if it is not already (KEYCUTON ME:keyer)
    params:
      me:  { type: int, min: 1, max: 8, required: true,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
      key: { type: int, min: 1, max: 99, required: true,
        label: Key,
        description: "Keyer number on the ME, from 1." }
    send: "KEYCUTON {me}:{key}"
    returns: none

  acuity_key_cut_off:
    summary: Cut key k on ME n off air if it is on air (KEYCUTOFF ME:keyer)
    params:
      me:  { type: int, min: 1, max: 8, required: true,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
      key: { type: int, min: 1, max: 99, required: true,
        label: Key,
        description: "Keyer number on the ME, from 1." }
    send: "KEYCUTOFF {me}:{key}"
    returns: none

  acuity_key_shaped:
    summary: Turn shaped keying on or off for key k on ME n (KEYSHAPED ME:keyer:ON/OFF)
    params:
      me:     { type: int, min: 1, max: 8, required: true,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
      key:    { type: int, min: 1, max: 99, required: true,
        label: Key,
        description: "Keyer number on the ME, from 1." }
      shaped: { type: bool, required: true,
        label: Shaped,
        description: "On turns shaped keying on, off turns it off." }
    send: "KEYSHAPED {me}:{key}:{shaped:on_off}"
    returns: none

  acuity_load_set:
    summary: Load a setup by name from the USB drive or hard drive (LOADSET USB/HD:setname)
    params:
      drive: { type: enum, values: [USB, HD], required: true,
        label: Drive,
        description: "USB for the USB drive, HD for the hard drive." }
      name:  { type: string, pattern: '^[^:]+$', required: true,
        label: Setup name,
        description: "Name of the setup to load, without a colon." }
    send: "LOADSET {drive}:{name}"
    returns: none

  acuity_save_set:
    summary: Save the switcher settings to setup number n with a name on the USB drive or hard drive (SAVESET USB/HD:setup:setname)
    params:
      drive: { type: enum, values: [USB, HD], required: true,
        label: Drive,
        description: "USB for the USB drive, HD for the hard drive." }
      setup: { type: int, min: 0, max: 999, required: true,
        label: Setup,
        description: "Setup number to save to." }
      name:  { type: string, pattern: '^[^:]+$', required: true,
        label: Setup name,
        description: "Name to save the setup under, without a colon." }
    send: "SAVESET {drive}:{setup}:{name}"
    returns: none

  acuity_save_set_by_name:
    summary: Save the switcher settings over the setup with a matching name (SAVESET USB/HD:setname)
    params:
      drive: { type: enum, values: [USB, HD], required: true,
        label: Drive,
        description: "USB for the USB drive, HD for the hard drive." }
      name:  { type: string, pattern: '^[^:]+$', required: true,
        label: Setup name,
        description: "Name of the existing setup to save over, without a colon." }
    send: "SAVESET {drive}:{name}"
    returns: none

  acuity_auto_transition:
    summary: Perform an auto transition of the next-transition elements on ME n (MEAUTO ME)
    params:
      me: { type: int, min: 1, max: 8, default: 1,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
    send: "MEAUTO {me}"
    returns: none

  acuity_cut:
    summary: Perform a cut of the next-transition elements on ME n (MECUT ME)
    params:
      me: { type: int, min: 1, max: 8, default: 1,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
    send: "MECUT {me}"
    returns: none

  acuity_recall_memory:
    summary: Recall memory m of bank b on ME n (MEM bm:ME)
    params:
      bank:   { type: int, min: 0, max: 99, required: true,
        label: Bank,
        description: "Memory bank, sent before the memory digit (bank 1, memory 9 is MEM 19)." }
      memory: { type: int, min: 0, max: 9, required: true,
        label: Memory,
        description: "Memory number within the bank, 0 to 9." }
      me:     { type: int, min: 1, max: 8, default: 1,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
    send: "MEM {bank}{memory}:{me}"
    returns: none

  acuity_recall_memory_multi:
    summary: Recall memory m of bank b on several MEs, such as 2:1 (MEM bm:ME:ME...)
    params:
      bank:   { type: int, min: 0, max: 99, required: true,
        label: Bank,
        description: "Memory bank, sent before the memory digit (bank 1, memory 9 is MEM 19)." }
      memory: { type: int, min: 0, max: 9, required: true,
        label: Memory,
        description: "Memory number within the bank, 0 to 9." }
      mes:    { type: string, pattern: '^[1-8](:[1-8])*$', required: true,
        label: MEs,
        description: "ME numbers joined by colons, such as 1:2:4." }
    send: "MEM {bank}{memory}:{mes}"
    returns: none

  acuity_save_memory:
    summary: Store memory m of bank b from ME n (MEMSAVE bm:ME)
    params:
      bank:   { type: int, min: 0, max: 99, required: true,
        label: Bank,
        description: "Memory bank, sent before the memory digit (bank 1, memory 9 is MEM 19)." }
      memory: { type: int, min: 0, max: 9, required: true,
        label: Memory,
        description: "Memory number within the bank, 0 to 9." }
      me:     { type: int, min: 1, max: 8, default: 1,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
    send: "MEMSAVE {bank}{memory}:{me}"
    returns: none

  acuity_save_memory_multi:
    summary: Store memory m of bank b from several MEs, such as 1:2:4 (MEMSAVE bm:ME:ME...)
    params:
      bank:   { type: int, min: 0, max: 99, required: true,
        label: Bank,
        description: "Memory bank, sent before the memory digit (bank 1, memory 9 is MEM 19)." }
      memory: { type: int, min: 0, max: 9, required: true,
        label: Memory,
        description: "Memory number within the bank, 0 to 9." }
      mes:    { type: string, pattern: '^[1-8](:[1-8])*$', required: true,
        label: MEs,
        description: "ME numbers joined by colons, such as 1:2:4." }
    send: "MEMSAVE {bank}{memory}:{mes}"
    returns: none

  acuity_media_store_load:
    summary: Load media item n into a channel of the Global-Store (GS), Global-Store Audio (GSA) or an ME-Store (ME number) (MS media-store:channel:media-ID)
    params:
      store:   { type: string, pattern: '^(GS|GSA|[1-8])$', required: true,
        label: Store,
        description: "GS Global-Store, GSA Global-Store Audio, or an ME number for that ME-Store." }
      channel: { type: int, min: 1, max: 99, required: true,
        label: Channel,
        description: "Channel of the store, from 1." }
      media:   { type: int, min: 0, max: 9999, required: true,
        label: Media ID,
        description: "Number of the still or animation in the Media-Store." }
    send: "MS {store}:{channel}:{media}"
    returns: none

  acuity_media_store_play:
    summary: Play the media item loaded in a Global-Store, Global-Store Audio or ME-Store channel (MSPLAY media-store:channel)
    params:
      store:   { type: string, pattern: '^(GS|GSA|[1-8])$', required: true,
        label: Store,
        description: "GS Global-Store, GSA Global-Store Audio, or an ME number for that ME-Store." }
      channel: { type: int, min: 1, max: 99, required: true,
        label: Channel,
        description: "Channel of the store, from 1." }
    send: "MSPLAY {store}:{channel}"
    returns: none

  acuity_multiviewer_box:
    summary: Select a source, such as IN:6, in a box of MultiViewer n (MVBOX MultiViewer:box:source)
    params:
      multiviewer: { type: int, min: 1, max: 99, required: true,
        label: MultiViewer,
        description: "MultiViewer number, from 1." }
      box:         { type: int, min: 1, max: 99, required: true,
        label: Box,
        description: "Box number in the MultiViewer layout, from 1." }
      source:      { type: string, pattern: '^[A-Z]+(:[A-Z0-9/]+)*$', required: true,
        label: Source,
        description: "Video source to show, such as IN:6." }
    send: "MVBOX {multiviewer}:{box}:{source}"
    returns: none

  reset_all:
    summary: Perform an ALL+ALL soft reset of the switcher (RESETALL)
    send: "RESETALL"
    returns: none

  set_video_mode:
    summary: Set the switcher's operating video format and frequency, such as "1080i 59.94" or "480i 16x9" (SETVIDMODE VID:format)
    params:
      format: { type: string, pattern: '^[0-9]+[ip]( ?[0-9x.]+)?$', required: true,
        label: Video format,
        description: "Format and frequency, such as 1080i 59.94 or 480i 16x9; the switcher does not check that it is supported." }
    send: "SETVIDMODE VID:{format}"
    returns: none

  set_reference_mode:
    summary: Set the expected input reference format and frequency, such as "1080i 50" (SETVIDMODE REF:format)
    params:
      format: { type: string, pattern: '^[0-9]+[ip]( ?[0-9x.]+)?$', required: true,
        label: Reference format,
        description: "Reference format and frequency, such as 1080i 50." }
    send: "SETVIDMODE REF:{format}"
    returns: none

  acuity_transition_include:
    summary: Replace the next-transition selection on ME n with background (B) and/or keys, such as B:2:3 (TRANSINCL ME:incl:...)
    params:
      me:      { type: int, min: 1, max: 8, required: true,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
      include: { type: string, pattern: '^(B|[0-9]{1,2})(:(B|[0-9]{1,2}))*$', required: true,
        label: Include,
        description: "The new next-transition selection, joined by colons: B for background and key numbers, such as B:2:3; it replaces the current one." }
    send: "TRANSINCL {me}:{include}"
    returns: none

  acuity_transition_rate:
    summary: Set the transition rate of ME n in frames (TRANSRATE ME:rate)
    params:
      me:   { type: int, min: 1, max: 8, required: true,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
      rate: { type: int, min: 0, max: 999, required: true,
        label: Rate,
        description: "Transition duration in frames." }
    send: "TRANSRATE {me}:{rate}"
    returns: none

  acuity_transition_type:
    summary: Set the transition type of ME n to dissolve, wipe, DVE or sequence (TRANSTYPE ME:type)
    params:
      me:   { type: int, min: 1, max: 8, required: true,
        label: ME,
        description: "ME number, from 1 as on the switcher." }
      type: { type: enum, values: [DISS, WIPE, DVE, SEQ], required: true,
        label: Transition type,
        description: "DISS dissolve, WIPE, DVE or SEQ sequence." }
    send: "TRANSTYPE {me}:{type}"
    returns: none

  user_variable_set:
    summary: Assign a number to a user variable, creating it if needed (USERVAR name:value)
    params:
      name:  { type: string, pattern: '^[^:]+$', required: true,
        label: Variable,
        description: "Name of the user variable, without a colon." }
      value: { type: int, required: true,
        label: Value,
        description: "The number to assign to the variable." }
    send: "USERVAR {name}:{value}"
    returns: none

  user_variable_operate:
    summary: Apply + - * / or = with a value to a user variable (USERVAR name:operation:value)
    params:
      name:      { type: string, pattern: '^[^:]+$', required: true,
        label: Variable,
        description: "Name of the user variable, without a colon." }
      operation: { type: enum, values: ["+", "-", "*", "/", "="], required: true,
        label: Operation,
        description: "Add (+), subtract (-), multiply (*), divide (/) or assign (=) the value." }
      value:     { type: int, required: true,
        label: Value,
        description: "The number the operation uses." }
    send: "USERVAR {name}:{operation}:{value}"
    returns: none

  acuity_select_aux:
    summary: Select input n on aux a of aux bank b (XPT AUX:bank:aux:IN:n)
    params:
      bank:   { type: int, min: 1, max: 99, required: true,
        label: Aux bank,
        description: "Aux bank number, from 1." }
      aux:    { type: int, min: 1, max: 99, required: true,
        label: Aux,
        description: "Aux number within the bank, from 1." }
      source: { type: int, min: 1, max: 999, required: true,
        label: Input,
        description: "Input number in the switcher's input mapping, which may differ from the connector number." }
    send: "XPT AUX:{bank}:{aux}:IN:{source}"
    returns: none

quirks:
  - models: [all]
    severity: warning
    text: >
      RossTalk sends no acknowledgements. Every command is unverified: a
      malformed command, a non-existent source and a successful take are
      indistinguishable to the sender. Ross documents replies only for the
      query and CAPTURE commands, and gives no reply format for any of them.

  - models: [all]
    severity: info
    text: >
      RossTalk reports no state. For tally, bus selections and source names,
      have the switcher send TSL UMD to the core and open a
      tsl-umd-listener device beside this one (model tsl-umd-3-tcp or
      tsl-umd for UDP; the Carbonite setup is in that spec). Ross's
      DashBoard (openGear) protocol, which carries full switcher state, is
      documented only for registered openGear partners and is not
      implemented.

  - models: [all]
    severity: critical
    text: >
      Commands act on a live switcher immediately. select_program and
      crosspoint change what is on air with no transition and no confirmation.

  - models: [all]
    severity: warning
    text: >
      All commands are case sensitive (Ross: "Note: All commands are case
      sensitive"). MTLoad, MTTakeIn, MTTakeOut and MTText are mixed case.

  - models: [all]
    severity: info
    text: >
      Custom controls (CC bank:cc) and GPI actions are defined on the switcher,
      not by this protocol; the same number fires different actions on
      different installations. Ross's syntax line is "CC bcc" but both its
      examples are "CC 1:05", and GPI is "GPI xx" with the example "GPI 04":
      both are sent with a colon and a two-digit number as in the examples.

  - models: [all]
    severity: info
    text: >
      Source numbering follows the switcher's configured input mapping, which
      may not match physical connector numbering. The documentation does not
      state per-model limits (MEs, keys, aux buses, GPIs, banks, sequencers,
      Media-Store channels); the ranges here are wire-format bounds, and a
      command for hardware the frame lacks is silently ignored.

  - models: [all]
    severity: warning
    text: >
      Memory numbers are "bm", bank digits followed by the memory digit with
      no separator (MEM 19 = bank 1, memory 9). Ross gives only single-digit
      bank examples; this spec sends the memory as the final digit, which is
      unambiguous but unconfirmed for banks of two digits.

  - models: [carbonite, carbonite-black, carbonite-solo, carbonite-mosaic, ultrachromehr, carbonite-hypermax, carbonite-code, graphite]
    severity: info
    text: >
      MEs are numbered 1, 2, 3, with the highest number being the program ME.
      me_type selects the output kind: ME, MME (MiniME and Tile) or MSC
      (MultiScreen and Canvas).

  - models: [carbonite-ultra, carbonite-ultra-60]
    severity: warning
    text: >
      Carbonite Ultra numbers its MEs 2, 1 and P/P, with P/P the program ME:
      KEYAUTO ME:3:4 on Carbonite Black is KEYAUTO ME:P/P:4 on Ultra. Pass
      me "P/P" for the program ME.

  - models: [carbonite-hypermax]
    severity: info
    text: >
      Split MEs are addressed by suffixing the ME number: A side (1A), B side
      (1B, PPB) and both (PPAB), as in MECUT ME:1B. Configurable program and
      preview outputs are the sources ME:n:PGM:1-4 and ME:n:PV:1-4.

  - models: [carbonite-ultra-60, carbonite-hypermax]
    severity: warning
    text: >
      Set locations differ: Ultra 60 uses 0 for the internal drive and 1, 2, 3
      for USB drives numbered in the order the OS detected them; HyperMax uses
      0 for NFS and 1 for USB. A USB number can therefore change between
      boots on Ultra 60.

  - models: [all]
    severity: info
    text: >
      Sets loaded or saved over RossTalk exclude panel personality settings
      such as colour schemes and user button assignments.

  - models: [all]
    severity: info
    text: >
      TRANSINCL replaces the whole next-transition selection; any existing
      selections are lost. KEYAUTOON/KEYCUTON and KEYAUTOOFF/KEYCUTOFF do
      nothing when the key is already in the requested state; KEYAUTO and
      KEYCUT toggle.

  - models: [all]
    severity: info
    text: >
      Media-Store IDs are sent zero-padded to three digits on the Carbonite
      family, as in Ross's examples "MS 1:0:002" and "MS 3:035"; Acuity's
      examples ("MS 4:2:52", "MS GS:1:12") are unpadded and are sent as given.
      Mosaic numbers Media-Store channels 101-136.

  - models: [carbonite, carbonite-black, carbonite-solo, carbonite-mosaic, ultrachromehr, carbonite-ultra, carbonite-ultra-60, carbonite-hypermax, carbonite-code, graphite]
    severity: info
    text: >
      Clip player commands without a channel are for systems with a single
      clip player; the earlier edition of the guide documented only those.
      MVBOX's I/O MultiViewer token is IO in the current guide and OP in the
      earlier edition. The NTP example in the guide is written "NET SET:",
      contradicting its own syntax line "NTP SET:address"; NTP SET is sent.

  - models: [carbonite-code]
    severity: info
    text: >
      MTText cannot carry a colon in the text; the spec rejects one.

  - models: [graphite]
    severity: warning
    text: >
      RossTalk must be enabled on Graphite (Configuration > System > Access >
      RossTalk = On) before it accepts commands on port 7788.

  - models: [acuity, ultrix-acuity, vision]
    severity: warning
    text: >
      The switcher accepts RossTalk only after an RTalk-IN device is assigned
      to a com port as Network TCP server on local port 7788. Server(1)
      accepts a single client connection at a time; Server(Many) accepts
      several. Its "Cmd Response" option (default OFF) is not described
      further.

  - models: [acuity, ultrix-acuity, vision]
    severity: critical
    text: >
      SETVIDMODE is not validated by the switcher: an unsupported format and
      frequency combination is accepted. RESETALL performs an ALL+ALL soft
      reset. Both disrupt output.

  - models: [carbonite-hypermax]
    severity: critical
    text: >
      REBOOTALL reboots every SDPE blade in the frame.

  - models: [vision]
    severity: warning
    text: >
      Ross: "When you are entering commands for Vision, you must use MLE
      instead of ME. Acuity supports both ME and MLE." This is unambiguous for
      XPT destinations and sources (use crosspoint with MLE:n:...), but the
      guide does not say whether it also changes command words such as MECUT
      or MEAUTO; they are listed as documented.

  - models: [acuity, ultrix-acuity, vision]
    severity: info
    text: >
      Acuity aux buses are addressed by bank and aux (AUX:bank:aux). The
      Acuity TRANSTYPE list is DISS, WIPE, DVE and SEQ in the current guide;
      the earlier edition listed MEDIA instead of SEQ. The ME-Store in MS and
      MSPLAY is the bare ME number in the current examples ("MS 4:2:52"); the
      earlier edition wrote ME:4. The guide's KEYAUTOOFF and KEYCUTOFF
      examples are misprinted as KEYAUTOON and KEYCUTON.

  - models: [acuity]
    severity: info
    text: >
      CAPTURE's syntax line is DISK/RAM:channel:source:frames; the earlier
      edition also showed "CAPTURE 3:PVW:5" without the target, which this
      spec does not send. The switcher replies when the capture completes, in
      a format Ross does not document.
