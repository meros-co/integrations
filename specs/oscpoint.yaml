quirks:
  - models: [all]
    severity: warning
    text: >
      OSCPoint sends its feedback only to the one host and port set on its ribbon tab in
      PowerPoint (127.0.0.1 and 35550 by default), not to the sender of actions, and
      neither can be set over OSC. Set the feedback host to this host and the feedback
      port to the feedback_port setting, and enable actions and feedbacks on the tab.
      The action port (35551 by default) is also set only there. Feedback can go to a
      broadcast address for several receivers. Several PowerPoint machines may send to
      the same feedback_port here, since each datagram is routed by its source address.
  - models: [all]
    severity: info
    text: >
      OSCPoint answers no action, so every command reports unverified; state changes
      arrive as feedback, which OSCPoint queues and sends in bundles about every 200 ms
      (notes and events at once). Feedback is UDP: on connecting and every 30 s the core
      sends /oscpoint/feedbacks/refresh, which resends the most recent values, and
      /oscpoint/files/list. Slide show feedback may not update while a slide show
      auto-advances (a known OSCPoint issue).
  - models: [all]
    severity: info
    text: >
      API limits: OSCPoint reports no state for the black and white screens, the laser
      pointer, whether a slide is hidden, whether actions or feedbacks are enabled, or
      its own ports, so those commands have no state to read back; its documentation
      lists no slide titles or thumbnails. Presenter View (its clock, layout and notes)
      cannot be controlled through PowerPoint's object model, which OSCPoint uses. File
      system access is switched only on the ribbon tab (files.access_enabled reports it),
      and set_active_folder, list_files, open_file and the close commands need it.
  - models: [all]
    severity: info
    text: >
      Commands act on the focused presentation window, and the presentation feedback
      follows focus when several presentations are open. Media commands and media
      feedback work only in slide show mode with a single media element on the current
      slide; media feedback is sent every 500 ms while it plays. Media, transitions and
      feedback may not work correctly while PowerPoint is not the focused window.
  - models: [all]
    severity: info
    text: >
      Names (sections, folders and files) are sent as UTF-8 blobs, which OSCPoint takes
      from 2.1. Feedback carries names and the presentation JSON as an ASCII string and,
      from 2.1, also as a UTF-8 blob; the blob is read when present. Notes come as ASCII
      on /oscpoint/slideshow/notes (slideshow.notes_ascii, which OSCPoint may deprecate)
      and as UTF-8 on /oscpoint/slideshow/notes-utf8 (slideshow.notes), truncated past
      32,000 characters, with CR line breaks. Section names are case sensitive.
  - models: [all]
    severity: info
    text: >
      Lists are keyed by their place from 1 in OSCPoint's own order (presentations,
      sections, files) and replaced whole each time they arrive. Presentation and slide
      show values are those OSCPoint last sent: it documents no reset of the slide show
      and media values when a slide show ends. last_event holds only the latest event.
  - models: [all]
    severity: info
    text: >
      go_to_first_slide and go_to_last_slide go to the first or last slide even when it
      is hidden. A slide hidden during a slide show may still show when going back.
      Starting a slide show other than from slide 1 may flash slide 1 first, and
      starting a slide show marks the presentation as having unsaved changes.
  - models: [all]
    severity: warning
    text: >
      set_actions_enabled false makes OSCPoint ignore every action except the one
      enabling them again; set_feedbacks_enabled false stops all state updates.
  - models: [all]
    severity: critical
    text: >
      close_presentation and close_active_presentation with mode force discard unsaved
      changes without warning, and with mode save overwrite the file; neither can be
      undone. set_wallpaper replaces the desktop wallpaper of every monitor on the
      PowerPoint machine. set_active_folder creates the folder when it does not exist.
