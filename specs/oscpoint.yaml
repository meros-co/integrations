      state: { presentation.visible_slide_count: "{arg0}" }
    - address: "^/oscpoint/slideshow/state$"
      state: { slideshow.state: "{arg0}" }
    # ── Valid only during a slide show ──
    - address: "^/oscpoint/slideshow/currentslide$"
      state: { slideshow.current_slide: "{arg0}" }
    - address: "^/oscpoint/slideshow/builds/position$"
      state: { slideshow.build_position: "{arg0}" }
    - address: "^/oscpoint/slideshow/builds/count$"
      state: { slideshow.build_count: "{arg0}" }
    - address: "^/oscpoint/slideshow/builds/remaining$"
      state: { slideshow.builds_remaining: "{arg0}" }
    - address: "^/oscpoint/slideshow/slidesremaining$"
      state: { slideshow.slides_remaining: "{arg0}" }
    - address: "^/oscpoint/slideshow/notes$"
      state: { slideshow.notes_ascii: "{arg0}" }
    - address: "^/oscpoint/slideshow/notes-utf-?8$"
      state: { slideshow.notes: "{arg0}" }
    - address: "^/oscpoint/slideshow/section/index$"
      state: { slideshow.section.index: "{arg0}" }
    - address: "^/oscpoint/slideshow/section/name$"
      state: { slideshow.section.name: "{arg0}" }
    - address: "^/oscpoint/slideshow/section/name$"
      arg_types: sb
      state: { slideshow.section.name: "{arg1}" }
    - address: "^/oscpoint/slideshow/section/slidesremaining$"
      state: { slideshow.section.slides_remaining: "{arg0}" }
    # ── Valid during a slide show with media on the current slide ──
    - address: "^/oscpoint/slideshow/media/state$"
      state: { slideshow.media.state: "{arg0}" }
    - address: "^/oscpoint/slideshow/media/duration$"
      state: { slideshow.media.duration_ms: "{arg0}" }
    - address: "^/oscpoint/slideshow/media/durationtrimmed$"
