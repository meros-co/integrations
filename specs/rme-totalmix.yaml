spec: 1
id: rme-totalmix
name: RME TotalMix FX (OSC)
vendor: RME
category: mixer

# TotalMix FX, the mixer software of RME's interfaces, takes OSC over UDP on
# a port set for each of up to four remotes (Options, Settings, OSC; typically
# 7001) and sends its feedback to the remote's address and outgoing port
# (typically 9001). The addresses follow a control surface: page 1 is a bank
# of faders on the selected row (inputs, playbacks or outputs) sending to the
# selected submix, page 2 one channel's settings, page 3 the effects,
# snapshots, groups and the DURec recorder, page 4 an output's Room EQ.
# Addressing a page selects it, and TotalMix then sends that page's every
# value. The host is the computer running TotalMix FX.
source:
  - title: "OSC implementation chart, TotalMix FX 1.96 (OscTableTotalMix_240722, 22.07.2024)"
    author: RME
    url: https://www.rme-audio.de/downloads/osc_table_totalmix_new.zip
    note: >
      Manufacturer document. The scale types (linear 0-1, the fader curve,
      the 20 Hz-20 kHz frequency scale, on/off, toggle, direct values, and the
      display strings sent at <address>Val), the 1.96 changes and the 1.90
      compatibility mode (Comments); the unpaged parameters; pages 1-4 and
      their parameters.
  - title: "User's Guide Fireface UFX III, Version 1.6 (02/2026), TotalMix FX chapters"
    author: RME
    url: https://www.rme-audio.de/downloads/fface_ufx3_e.pdf
    note: >
      Manufacturer document; the TotalMix FX chapters are common to RME's
      manuals. OSC page: four remotes, ports incoming (typically 7001 or
      8000) and outgoing (typically 9001 or 9000), the remote's address, Send
      Peak Level Data, Lock Remote to submix, faders per bank (8 to 48),
      compatibility mode (25.8.3, p.79); Enable MIDI/OSC Control (25.10, p.81);
      channels hidden from OSC remotes (25.5.3, p.69); OSC (28.8, p.93).

transport:
  type: osc-udp
  port: 7001
  reply: none
  listen_port: { setting: feedback_port }

settings:
  feedback_port: { type: int, min: 1, max: 65535, default: 9001,
                   label: Feedback port,
                   description: "Local UDP port this host listens on for TotalMix's feedback; set the remote's outgoing port in TotalMix to this value and its address to this host, or leave it empty to read nothing back." }

ports:
  - { port: 7001, protocol: udp, role: control, note: "TotalMix FX's incoming port for this remote (typically 7001 or 8000)" }
  - { port: 9001, protocol: udp, role: feedback, listener: core, setting: feedback_port, note: "where TotalMix sends its feedback (typically 9001 or 9000)" }

maps:
  snapshot_row: { "1": "8", "2": "7", "3": "6", "4": "5", "5": "4", "6": "3", "7": "2", "8": "1" }
  group_row: { "1": "4", "2": "3", "3": "2", "4": "1" }
  page_prefix: { "0": "", "1": "1/", "2": "2/", "3": "3/", "4": "4/" }

