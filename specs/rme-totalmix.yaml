commands:
  set_submix:
    summary: "Select the submix (output) the bank's faders send to (/setSubmix), counted from 1"
    params:
      submix: { type: int, min: 1, max: 256, required: true, label: "Submix", description: "Submix (output) from 1, as TotalMix numbers single channels." }
    send: { address: "/setSubmix", args: [ { value: "{submix:-1}", type: float } ] }
    returns: none

  set_bank_start:
    summary: "Make a channel the first of the bank on page 1, or the channel of page 2 (/setBankStart), counted from 1"
    params:
      channel: { type: int, min: 1, max: 256, required: true, label: "Channel", description: "Channel from 1 (a stereo channel by its left channel)." }
    send: { address: "/setBankStart", args: [ { value: "{channel:-1}", type: float } ] }
    returns: none

  set_offset_in_bank:
    summary: "Choose page 2's channel by its fader in the bank (/setOffsetInBank)"
    params:
      fader: { type: int, min: 1, max: 48, required: true, label: "Fader", description: "Fader position in the bank, 1 to the faders per bank (8 by default, up to 48)." }
    send: { address: "/setOffsetInBank", args: [ { value: "{fader:-1}", type: float } ] }
    returns: none

  load_quick_workspace:
    summary: "Load a Quick Workspace (/loadQuickWorkspace)"
    params:
      workspace: { type: int, min: 1, max: 30, required: true, label: "Workspace", description: "Quick Workspace, 1 to 30, if configured." }
    send: { address: "/loadQuickWorkspace", args: [ { value: "{workspace}", type: float } ] }
    returns: none

  select_input_bus:
    summary: "Show the input row on page 1 (/1/busInput)"
    send: { address: "/1/busInput", args: [ { value: "1.0", type: float } ] }
    returns: none

  select_playback_bus:
    summary: "Show the playback row on page 1 (/1/busPlayback)"
    send: { address: "/1/busPlayback", args: [ { value: "1.0", type: float } ] }
    returns: none

  select_output_bus:
    summary: "Show the output row on page 1 (/1/busOutput)"
    send: { address: "/1/busOutput", args: [ { value: "1.0", type: float } ] }
    returns: none

  select_input_bus_page2:
    summary: "Show the input row on page 2 (/2/busInput)"
    send: { address: "/2/busInput", args: [ { value: "1.0", type: float } ] }
    returns: none

  select_playback_bus_page2:
    summary: "Show the playback row on page 2 (/2/busPlayback)"
    send: { address: "/2/busPlayback", args: [ { value: "1.0", type: float } ] }
    returns: none

  select_output_bus_page2:
    summary: "Show the output row on page 2 (/2/busOutput)"
    send: { address: "/2/busOutput", args: [ { value: "1.0", type: float } ] }
    returns: none

  bank_next:
    summary: "Move the bank on by its size (/1/bank+)"
    send: { address: "/1/bank+", args: [ { value: "1.0", type: float } ] }
    returns: none

  bank_previous:
    summary: "Move the bank back by its size (/1/bank-)"
    send: { address: "/1/bank-", args: [ { value: "1.0", type: float } ] }
    returns: none

  track_next:
    summary: "Move the bank start on by one channel (/1/track+)"
    send: { address: "/1/track+", args: [ { value: "1.0", type: float } ] }
    returns: none

  track_previous:
    summary: "Move the bank start back by one channel (/1/track-)"
    send: { address: "/1/track-", args: [ { value: "1.0", type: float } ] }
    returns: none

  channel_next:
    summary: "Show the next channel on page 2 (/2/track+)"
    send: { address: "/2/track+", args: [ { value: "1.0", type: float } ] }
    returns: none

  channel_previous:
    summary: "Show the previous channel on page 2 (/2/track-)"
    send: { address: "/2/track-", args: [ { value: "1.0", type: float } ] }
    returns: none

  room_eq_channel_next:
    summary: "Show the next output's Room EQ on page 4 (/4/track+)"
    send: { address: "/4/track+", args: [ { value: "1.0", type: float } ] }
    returns: none

  room_eq_channel_previous:
    summary: "Show the previous output's Room EQ on page 4 (/4/track-)"
    send: { address: "/4/track-", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_global_mute:
    summary: "Toggle global mute (/1/globalMute)"
    send: { address: "/1/globalMute", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_global_solo:
    summary: "Toggle global solo (/1/globalSolo)"
    send: { address: "/1/globalSolo", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_trim:
    summary: "Toggle trim mode for every channel (/1/trim)"
    send: { address: "/1/trim", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_dim:
    summary: "Toggle the main output's dim (/1/mainDim)"
    send: { address: "/1/mainDim", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_speaker_b:
    summary: "Toggle speaker B (/1/mainSpeakerB)"
    send: { address: "/1/mainSpeakerB", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_speaker_b_linked:
    summary: "Toggle speaker B's volume link to the main (/1/speakerBLinked)"
    send: { address: "/1/speakerBLinked", args: [ { value: "1.0", type: float } ] }
    returns: none

  main_recall:
    summary: "Toggle the main output's recall volume (/1/mainRecall)"
    send: { address: "/1/mainRecall", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_main_mute_fx:
    summary: "Toggle the FX return mute on the main output (/1/mainMuteFx)"
    send: { address: "/1/mainMuteFx", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_main_mono:
    summary: "Toggle mono on the main output (/1/mainMono)"
    send: { address: "/1/mainMono", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_main_ext_in:
    summary: "Toggle the external input path (/1/mainExtIn)"
    send: { address: "/1/mainExtIn", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_talkback:
    summary: "Toggle talkback (/1/mainTalkback)"
    send: { address: "/1/mainTalkback", args: [ { value: "1.0", type: float } ] }
    returns: none

  set_main_volume:
    summary: "Set the main output volume as a fader position (/1/mastervolume)"
    params:
      position: { type: float, min: 0.0, max: 1.0, required: true, label: "Position", description: "Fader position 0 to 1 on TotalMix's fader curve: 1 is +6 dB, about 0.634 is -6 dB, 0 is -inf." }
    send: { address: "/1/mastervolume", args: [ { value: "{position}", type: float } ] }
    returns: none

  set_fader:
    summary: "Set a bank fader's level as a fader position (/1/volume<n>)"
    params:
      fader: { type: int, min: 1, max: 48, required: true, label: "Fader", description: "Fader position in the bank, 1 to the faders per bank (8 by default, up to 48)." }
      position: { type: float, min: 0.0, max: 1.0, required: true, label: "Position", description: "Fader position 0 to 1 on TotalMix's fader curve: 1 is +6 dB, about 0.634 is -6 dB, 0 is -inf." }
    send: { address: "/1/volume{fader}", args: [ { value: "{position}", type: float } ] }
    returns: none

  set_fader_pan:
    summary: "Set a bank fader's pan or balance (/1/pan<n>)"
    params:
      fader: { type: int, min: 1, max: 48, required: true, label: "Fader", description: "Fader position in the bank, 1 to the faders per bank (8 by default, up to 48)." }
      pan: { type: float, min: 0.0, max: 1.0, required: true, label: "Pan", description: "Pan from 0 (left) through 0.5 (centre) to 1 (right)." }
    send: { address: "/1/pan{fader}", args: [ { value: "{pan}", type: float } ] }
    returns: none

  set_fader_gain:
    summary: "Set a bank fader's mic or digital input gain on TotalMix's 0-1 scale (/1/micgain<n>), where the input has one"
    params:
      fader: { type: int, min: 1, max: 48, required: true, label: "Fader", description: "Fader position in the bank, 1 to the faders per bank (8 by default, up to 48)." }
      gain: { type: float, min: 0.0, max: 1.0, required: true, label: "Gain", description: "Gain on a 0 to 1 scale that TotalMix maps per device and channel." }
    send: { address: "/1/micgain{fader}", args: [ { value: "{gain}", type: float } ] }
    returns: none

  set_fader_mute:
    summary: "Turn a bank fader's mute on or off (/1/mute/1/<n>)"
    params:
      fader: { type: int, min: 1, max: 48, required: true, label: "Fader", description: "Fader position in the bank, 1 to the faders per bank (8 by default, up to 48)." }
      enabled: { type: bool, required: true, label: "Mute", description: "On turns it on, off turns it off (mute)." }
    send: { address: "/1/mute/1/{fader}", args: [ { value: "{enabled:bool01}", type: float } ] }
    returns: none

  set_fader_phantom:
    summary: "Turn a bank fader's phantom power on or off (/1/phantom/1/<n>)"
    params:
      fader: { type: int, min: 1, max: 48, required: true, label: "Fader", description: "Fader position in the bank, 1 to the faders per bank (8 by default, up to 48)." }
      enabled: { type: bool, required: true, label: "Phantom power", description: "On turns it on, off turns it off (phantom power)." }
    send: { address: "/1/phantom/1/{fader}", args: [ { value: "{enabled:bool01}", type: float } ] }
    returns: none

  set_fader_solo:
    summary: "Turn a bank fader's solo on or off (/1/solo/1/<n>)"
    params:
      fader: { type: int, min: 1, max: 48, required: true, label: "Fader", description: "Fader position in the bank, 1 to the faders per bank (8 by default, up to 48)." }
      enabled: { type: bool, required: true, label: "Solo", description: "On turns it on, off turns it off (solo (pfl in pfl mode))." }
    send: { address: "/1/solo/1/{fader}", args: [ { value: "{enabled:bool01}", type: float } ] }
    returns: none

  set_fader_select:
    summary: "Turn a bank fader's selection for the ad-hoc fader group on or off (/1/select/1/<n>)"
    params:
      fader: { type: int, min: 1, max: 48, required: true, label: "Fader", description: "Fader position in the bank, 1 to the faders per bank (8 by default, up to 48)." }
      enabled: { type: bool, required: true, label: "Selection for the ad-hoc fader group", description: "On turns it on, off turns it off (selection for the ad-hoc fader group)." }
    send: { address: "/1/select/1/{fader}", args: [ { value: "{enabled:bool01}", type: float } ] }
    returns: none

  set_fader_cue:
    summary: "Turn a bank fader's cue on or off (/1/cue/1/<n>)"
    params:
      fader: { type: int, min: 1, max: 48, required: true, label: "Fader", description: "Fader position in the bank, 1 to the faders per bank (8 by default, up to 48)." }
      enabled: { type: bool, required: true, label: "Cue", description: "On turns it on, off turns it off (cue (outputs))." }
    send: { address: "/1/cue/1/{fader}", args: [ { value: "{enabled:bool01}", type: float } ] }
    returns: none

  toggle_channel_mute:
    summary: "Toggle the selected channel's mute (/2/mute)"
    send: { address: "/2/mute", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_solo:
    summary: "Toggle the selected channel's solo or PFL (/2/solo)"
    send: { address: "/2/solo", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_phase:
    summary: "Toggle the selected channel's phase invert (left or mono) (/2/phase)"
    send: { address: "/2/phase", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_phase_right:
    summary: "Toggle the selected channel's phase invert of the right side (/2/phaseRight)"
    send: { address: "/2/phaseRight", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_phantom:
    summary: "Toggle the selected channel's phantom power (/2/phantom)"
    send: { address: "/2/phantom", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_instrument:
    summary: "Toggle the selected channel's the instrument option (/2/instrument)"
    send: { address: "/2/instrument", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_pad:
    summary: "Toggle the selected channel's the pad (/2/pad)"
    send: { address: "/2/pad", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_ms_proc:
    summary: "Toggle the selected channel's M/S processing (/2/msProc)"
    send: { address: "/2/msProc", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_autoset:
    summary: "Toggle the selected channel's AutoSet gain (/2/autoset)"
    send: { address: "/2/autoset", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_loopback:
    summary: "Toggle the selected channel's loopback (outputs) (/2/loopback)"
    send: { address: "/2/loopback", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_stereo:
    summary: "Toggle the selected channel's stereo (/2/stereo)"
    send: { address: "/2/stereo", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_cue:
    summary: "Toggle the selected channel's cue (outputs) (/2/cue)"
    send: { address: "/2/cue", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_talkback_sel:
    summary: "Toggle the selected channel's talkback inclusion (outputs) (/2/talkbackSel)"
    send: { address: "/2/talkbackSel", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_no_trim:
    summary: "Toggle the selected channel's trim exclusion (outputs) (/2/noTrim)"
    send: { address: "/2/noTrim", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_record_enable:
    summary: "Toggle the selected channel's record enable (/2/recordEnable)"
    send: { address: "/2/recordEnable", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_lowcut_enable:
    summary: "Toggle the selected channel's the low cut (/2/lowcutEnable)"
    send: { address: "/2/lowcutEnable", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_eq_enable:
    summary: "Toggle the selected channel's the parametric EQ (/2/eqEnable)"
    send: { address: "/2/eqEnable", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_compexp_enable:
    summary: "Toggle the selected channel's the compressor/expander (/2/compexpEnable)"
    send: { address: "/2/compexpEnable", args: [ { value: "1.0", type: float } ] }
    returns: none

  toggle_channel_alev_enable:
    summary: "Toggle the selected channel's auto level (/2/alevEnable)"
    send: { address: "/2/alevEnable", args: [ { value: "1.0", type: float } ] }
    returns: none

  set_channel_volume:
    summary: "Set the selected channel's level as a fader position (TotalMix's fader curve) (/2/volume)"
    params:
      value: { type: float, min: 0.0, max: 1.0, required: true, label: "Value", description: "The level as a fader position, 0 to 1 on TotalMix's scale for it." }
    send: { address: "/2/volume", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_channel_pan:
    summary: "Set the selected channel's pan or balance, 0 left to 1 right (/2/pan)"
    params:
      value: { type: float, min: 0.0, max: 1.0, required: true, label: "Value", description: "The pan or balance, 0 left to 1 right, 0 to 1 on TotalMix's scale for it." }
    send: { address: "/2/pan", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_channel_gain:
    summary: "Set the selected channel's input gain on TotalMix's 0-1 scale (/2/gain)"
    params:
      value: { type: float, min: 0.0, max: 1.0, required: true, label: "Value", description: "The input gain on TotalMix's 0-1 scale, 0 to 1 on TotalMix's scale for it." }
    send: { address: "/2/gain", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_channel_gain_right:
    summary: "Set the selected channel's right-side input gain of a stereo channel (/2/gainRight)"
    params:
      value: { type: float, min: 0.0, max: 1.0, required: true, label: "Value", description: "The right-side input gain of a stereo channel, 0 to 1 on TotalMix's scale for it." }
    send: { address: "/2/gainRight", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_channel_width:
    summary: "Set the selected channel's stereo width (/2/width)"
    params:
      value: { type: float, min: 0.0, max: 1.0, required: true, label: "Value", description: "The stereo width, 0 to 1 on TotalMix's scale for it." }
    send: { address: "/2/width", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_channel_reverb_send:
