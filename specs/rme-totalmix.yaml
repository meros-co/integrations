      page: { type: int, min: 0, max: 4, required: true, label: "Page", description: "Page 1 to 4, or 0 for the unpaged parameters (setSubmix, setBankStart, setOffsetInBank, loadQuickWorkspace)." }
      name: { type: string, max_length: 64, pattern: "^[A-Za-z0-9+/-]+$", required: true, label: "Parameter", description: "The parameter name as the chart writes it, such as volume3 or mute/1/3." }
      value: { type: float, required: true, label: "Value", description: "The value, 0 to 1 for most parameters (1 toggles a toggle)." }
    send: { address: "/{page:map.page_prefix}{name}", args: [ { value: "{value}", type: float } ] }
    returns: none

quirks:
  - models: [all]
    severity: critical
    text: >
      load_snapshot and load_quick_workspace replace the mix at once, and
      undo, redo and the group toggles change many channels; none can be
      undone from here.
  - models: [all]
    severity: warning
    text: >
      TotalMix's OSC is bank-oriented, not channel-oriented: page 1's faders
      are positions in the bank on the selected row, and page 2 shows the
      channel at the bank start plus the offset. Navigate first (select a
      row, set_bank_start, set_submix), then set. State follows the same
      model: pages.<page>.<parameter> holds what TotalMix last sent for that
      control, and display.<page>.<parameter> its display text. Hidden
      channels are skipped in the bank. Enable MIDI/OSC Control must be on,
      and with Lock Remote to submix the remote can change only that submix.
  - models: [all]
    severity: info
    text: >
      TotalMix sends its feedback to the address and outgoing port set for the
      remote, and sends a page's every value when the page is selected (by
      any message to it); nothing documented asks for state, so state fills
      as TotalMix sends it. Meters arrive only with Send Peak Level Data on.
      Toggle parameters change on 1.0 and TotalMix answers with the state;
      levels and most settings are 0 to 1 on TotalMix's scale for each, with
      the readable value in the matching display text. In 1.90 compatibility
      mode gains, EQ types and some ranges are scaled the old way.

state:
  pages.*.*:   { type: float, description: "The value TotalMix last sent for a control, keyed by page (1-4) then the chart's parameter name (volume1, mute/1/3, eqGain1, snapshots/8/1, ...), 0 to 1 on the control's scale" }
  display.*.*: { type: string, description: "Text TotalMix sent for a control, keyed by page then name: display values (volume1Val, as dB or a choice), channel names (trackname1), the submix name, recorder time and state" }

telemetry:
  updates:
    - address: '^/([1-4])/(.+)$'
      arg_types: f
      state: { "pages.{1}.{2:key}": "{arg0}" }
    - address: '^/([1-4])/(.+)$'
      arg_types: s
      state: { "display.{1}.{2:key}": "{arg0}" }
