      ratio: {"type": "string", "pattern": "^([0-9]+(\\.[0-9]+)?|[0-9]+:[0-9]+)$", "max_length": 16, "required": true, "label": "Aspect ratio", "description": "A decimal such as 1.7778 or a ratio such as 16:9."}
      max: {"type": "int", "min": 16, "max": 8192, "required": true, "label": "Largest dimension", "description": "The largest width or height in pixels."}
    send: '{"action":"requestAspectRatio","target":{target:json},"value":{ratio:json},"value2":{max}}'
    expect: { reply_json: { "$.callback.action": "requestAspectRatio" }, json_path: "$.callback.result" }
    returns: value

  set_guest_width:
    summary: "Ask a guest's camera for a capture width (setWidth)"
    params:
      target: {"type": "string", "pattern": "^[A-Za-z0-9_.-]+$", "max_length": 128, "required": true, "label": "Guest", "description": "The guest's slot (1 to 99), stream ID or peer UUID."}
      pixels: {"type": "int", "min": 16, "max": 8192, "required": true, "label": "Width", "description": "Capture width in pixels."}
    send: '{"action":"setWidth","target":{target:json},"value":{pixels}}'
    expect: { reply_json: { "$.callback.action": "setWidth" }, json_path: "$.callback.result" }
    returns: value

  set_guest_height:
    summary: "Ask a guest's camera for a capture height (setHeight)"
    params:
      target: {"type": "string", "pattern": "^[A-Za-z0-9_.-]+$", "max_length": 128, "required": true, "label": "Guest", "description": "The guest's slot (1 to 99), stream ID or peer UUID."}
      pixels: {"type": "int", "min": 16, "max": 8192, "required": true, "label": "Height", "description": "Capture height in pixels."}
    send: '{"action":"setHeight","target":{target:json},"value":{pixels}}'
    expect: { reply_json: { "$.callback.action": "setHeight" }, json_path: "$.callback.result" }
    returns: value

  set_guest_aspect_ratio:
    summary: "Ask a guest's camera for a capture aspect ratio (setAspectRatio)"
    params:
      target: {"type": "string", "pattern": "^[A-Za-z0-9_.-]+$", "max_length": 128, "required": true, "label": "Guest", "description": "The guest's slot (1 to 99), stream ID or peer UUID."}
      ratio: {"type": "float", "min": 0.1, "max": 10, "required": true, "label": "Aspect ratio", "description": "Width divided by height, such as 1.7778."}
    send: '{"action":"setAspectRatio","target":{target:json},"value":{ratio:.4f}}'
    expect: { reply_json: { "$.callback.action": "setAspectRatio" }, json_path: "$.callback.result" }
    returns: value

  refresh_guest_video:
    summary: "Ask a guest to refresh their camera and video tracks (refreshVideo)"
    params:
      target: {"type": "string", "pattern": "^[A-Za-z0-9_.-]+$", "max_length": 128, "required": true, "label": "Guest", "description": "The guest's slot (1 to 99), stream ID or peer UUID."}
    send: '{"action":"refreshVideo","target":{target:json},"value":"null"}'
    expect: { reply_json: { "$.callback.action": "refreshVideo" }, json_path: "$.callback.result" }
    returns: value

  restart_guest_connection:
    summary: "Ask a guest to restart their connection (refreshConnection)"
    params:
      target: {"type": "string", "pattern": "^[A-Za-z0-9_.-]+$", "max_length": 128, "required": true, "label": "Guest", "description": "The guest's slot (1 to 99), stream ID or peer UUID."}
    send: '{"action":"refreshConnection","target":{target:json},"value":"null"}'
    expect: { reply_json: { "$.callback.action": "refreshConnection" }, json_path: "$.callback.result" }
    returns: value

  recover_guest_stream:
    summary: "Ask a guest to recover both media and connection (recoverStream)"
    params:
      target: {"type": "string", "pattern": "^[A-Za-z0-9_.-]+$", "max_length": 128, "required": true, "label": "Guest", "description": "The guest's slot (1 to 99), stream ID or peer UUID."}
    send: '{"action":"recoverStream","target":{target:json},"value":"null"}'
    expect: { reply_json: { "$.callback.action": "recoverStream" }, json_path: "$.callback.result" }
    returns: value

  move_guest_mix_order:
    summary: "Move a guest earlier or later in the director's mixer order (mixorder)"
    params:
      target: {"type": "string", "pattern": "^[A-Za-z0-9_.-]+$", "max_length": 128, "required": true, "label": "Guest", "description": "The guest's slot (1 to 99), stream ID or peer UUID."}
      direction: {"type": "enum", "values": ["earlier", "later"], "required": true, "label": "Direction", "description": "earlier (-1) or later (1)."}
    send: '{"action":"mixorder","target":{target:json},"value":{direction:map.mix_order}}'
    expect: { reply_json: { "$.callback.action": "mixorder" }, json_path: "$.callback.result" }
    returns: value

quirks:
  - models: [all]
    severity: info
    text: >
      Commands go over the relay's websocket as {"action", "target",
      "value"} with "null" for what is unused, and are answered by the page
      with its callback, whose result is the command's value: true or false
      for a toggle's new state, an object for getDetails, getGuestList and
      the statistics, or fail. Each answer is matched by its action; two
      commands of the same action in flight at once may take each other's
      answers. Nothing answers while no page with the key is open, so a
      command then times out.

  - models: [all]
    severity: info
    text: >
      State comes from getDetails, asked for on connecting and every 30
      seconds (which also keeps the relay's socket, dropped after about a
      minute of silence), and after every command and every update the page
      pushes that says the guests changed (a new or ended connection, a
      position change, a details hint). Microphone and camera mutes,
      director mutes and hides, and hang-ups the page pushes apply at once.
      The streams list is replaced whole by each getDetails answer.

  - models: [all]
    severity: info
    text: >
      The documents describe getDetails' and getGuestList's answers in
      words only; the field names kept in state (streamID, label, director,
      position, localStream, muted, videoMuted, speakerMuted, scenes,
      others) follow the Companion module that reads them, and getGuestList
      is kept as slots with streamID and label. Values are sent as the
      README shows them: states as the strings "true", "false" and
      "toggle", numbers as numbers.

  - models: [all]
    severity: warning
    text: >
      Recording (set_recording) writes to the disk of the computer running
      the page and may open a save dialog there; screen sharing still asks
      the browser for a screen. PTZ actions need the camera's page loaded
      with &ptz and the browser's camera permission granted; setslot needs
      &slotmode=1 or the mixer.

  - models: [all]
    severity: critical
    text: >
      hangup ends the page's connection, and hangup_guest, forward_guest and
      reload drop a guest or the page from the show; they cannot be undone
      from the API (the guest must rejoin).

state:
  streams.*.label:          { type: string, description: "A stream the page knows, keyed by stream ID: its label, empty when none" }
  streams.*.director:       { type: bool, description: "It is the room's director" }
  streams.*.position:       { type: int, description: "Its guest slot, from 1" }
  streams.*.local:          { type: bool, description: "It is the controlled page's own stream" }
  streams.*.muted:          { type: bool, description: "Its microphone is muted" }
  streams.*.video_muted:    { type: bool, description: "Its camera is off" }
  streams.*.speaker_muted:  { type: bool, description: "Its speaker is muted" }
  streams.*.director_muted: { type: bool, description: "The director has muted it" }
  streams.*.director_hidden: { type: bool, description: "The director has hidden its video" }
  streams.*.scenes:         { type: string, description: "The scenes it is in, as a JSON object of scene to true or false" }
  guests.*.stream_id:       { type: string, description: "A guest slot, keyed by its number: the guest's stream ID" }
  guests.*.label:           { type: string, description: "The guest's label" }

telemetry:
  subscribe:
    send: ['{"action":"getDetails","target":"null","value":"null"}']
  updates:
    # getDetails: every stream, whole, as a list.
    - json_match: { "$.callback.action": "^getDetails$", "$.callback.result": '^\[' }
      json_each: "$.callback.result"
      replace: streams
      json: &stream
        id: "$.streamID"
        label: "$.label"
        director: "$.director"
        position: "$.position"
        local: "$.localStream"
        muted: "$.muted"
        video: "$.videoMuted"
        speaker: "$.speakerMuted"
        scenes: "$.scenes"
        dmute: "$.others.mute-guest"
        dhide: "$.others.hide-guest"
      state: &stream_state
        "streams.{id:key}.label": "{label}"
        "streams.{id:key}.director": "{director}"
        "streams.{id:key}.position": "{position}"
        "streams.{id:key}.local": "{local}"
        "streams.{id:key}.muted": "{muted}"
        "streams.{id:key}.video_muted": "{video}"
        "streams.{id:key}.speaker_muted": "{speaker}"
        "streams.{id:key}.scenes": "{scenes}"
        "streams.{id:key}.director_muted": { value: "{dmute}", map: { "1": true, "0": false, "true": true, "false": false } }
        "streams.{id:key}.director_hidden": { value: "{dhide}", map: { "1": true, "0": false, "true": true, "false": false } }
    # The same as an object of streams.
    - json_match: { "$.callback.action": "^getDetails$", "$.callback.result": '^\{' }
      json_each: "$.callback.result.*"
      replace: streams
      json: *stream
      state: *stream_state
    # getGuestList: the slots.
    - json_match: { "$.callback.action": "^getGuestList$", "$.callback.result": '^\{' }
      json_each: "$.callback.result.*"
      replace: guests
      json: { id: "$.streamID", label: "$.label" }
      state:
        "guests.{key:key}.stream_id": "{id}"
        "guests.{key:key}.label": "{label}"
    # A command that changes the page or a guest reads everything again.
    - json_match: { "$.callback.action": "^(speaker|mic|camera|volume|hangup|group|joinGroup|leaveGroup|forward|addScene|setScene|muteScene|activateQueuedGuest|setslot|display|soloVideo|muteAllGuests|mirror|rotate|channel)$" }
      json: {}
      then_send: ['{"action":"getDetails","target":"null","value":"null"}']
    # Pushes.
    - json_match: { "$.update.action": "^(mic|remoteMuted)$", "$.update.streamID": "." }
      json: { id: "$.update.streamID", value: "$.update.value" }
      state: { "streams.{id:key}.muted": "{value}" }
    - json_match: { "$.update.action": "^(camera|remoteVideoMuted)$", "$.update.streamID": "." }
      json: { id: "$.update.streamID", value: "$.update.value" }
      state: { "streams.{id:key}.video_muted": "{value}" }
    - json_match: { "$.update.action": "^directorMuted$", "$.update.streamID": "." }
      json: { id: "$.update.streamID", value: "$.update.value" }
      state: { "streams.{id:key}.director_muted": "{value}" }
    - json_match: { "$.update.action": "^directorVideoHide$", "$.update.streamID": "." }
      json: { id: "$.update.streamID", value: "$.update.value" }
      state: { "streams.{id:key}.director_hidden": "{value}" }
    - json_match: { "$.update.action": "^hangup$", "$.update.streamID": "." }
      json: { id: "$.update.streamID" }
      state: { "streams.{id:key}": { delete: true } }
    - json_match: { "$.update.action": "^endViewConnection$", "$.update.value": "." }
      json: { id: "$.update.value" }
      state: { "streams.{id:key}": { delete: true } }
    - json_match: { "$.update.action": "^(details|newViewConnection|positionChange|seeding|tracksAdded|director)$" }
      json: {}
      then_send: ['{"action":"getDetails","target":"null","value":"null"}']
