spec: 1
id: digitalprojection-evision-op
name: Digital Projection E-Vision projectors (op command set)
vendor: Digital Projection
category: display

# The "op" command set of the E-Vision 4000, 5000 UST, 5100, 5900, 6110, 7010,
# Laser 9000 and 9100 lines, on RS-232 and as "RS232 by Telnet" on TCP 23: "op",
# a space, the operation keyword, then " = value", " ?", " +", " -" or nothing,
# ended by CR. The projector answers "OP <KEYWORD> = <value>", "OP <KEYWORD> = NA"
# for a value out of range or a setting it lacks, and "*Illegal format#" for a
# command it does not know. These models do not use the "*" protocol of
# digitalprojection-projector.
source:
  - title: "Protocol Commands E-Vision Laser 9000, 122-723A, 2021-06-16"
    author: Digital Projection Ltd
    url: https://www.digitalprojection.co.uk/dpdownloads/Protocol/122-723A%20Protocol%20Commands%20E-Vision%20Laser%209000%2020210616.xlsx
    note: "Manufacturer document (spreadsheet). TCP 23 \"RS232 by Telnet\", op syntax and replies, serial 9600 8N1; commands of the e-vision-laser-9000 model."
  - title: "Protocol Commands E-Vision 9100, 122-722A, 2020-11-04"
    author: Digital Projection Ltd
    url: https://www.digitalprojection.co.uk/dpdownloads/Protocol/122-722A%20Protocol%20Commands%20E-Vision%209100%2020201104.xlsx
    note: "Manufacturer document. Commands of the e-vision-9100 model."
  - title: "Protocol Commands E-Vision Laser 5900, 122-725A, 2021-06-10"
    author: Digital Projection Ltd
    url: https://www.digitalprojection.co.uk/dpdownloads/Protocol/122-725A%20Protocol%20Commands%20E-Vision%20Laser%205900%2020210610.xlsx
    note: "Manufacturer document. Commands of the e-vision-laser-5900 model, and the values of the e-vision-7010 model."
  - title: "Protocol Commands E-Vision Laser 5100, 122-726A, 2021-06-10"
    author: Digital Projection Ltd
    url: https://www.digitalprojection.co.uk/dpdownloads/Protocol/122-726A%20Protocol%20Commands%20E-Vision%20Laser%205100%20%2020210610.xlsx
    note: "Manufacturer document. Commands of the e-vision-laser-5100 model, and the values of the e-vision-6110 model."
  - title: "Protocol Commands E-Vision 4000 4K-UHD, 122-980A, 2022-02-08"
    author: Digital Projection Ltd
    url: https://www.digitalprojection.co.uk/dpdownloads/Protocol/122-980A%20Protocol%20Commands%20E-Vision%204000%204K-UHD%2020220208.xlsx
    note: "Manufacturer document. Commands of the e-vision-4000-4k model; TCP 23."
  - title: "E-Vision 5000 UST User Manual, 124-369A, Rev A, September 2024"
    author: Digital Projection Ltd
    url: https://digitalprojection.co.uk/dpdownloads/User%20Guides/E-Vision-5000-UST/E-Vision%205000%20UST%20User%20Manual%20124-369A%20EN.pdf
    note: "Manufacturer document. RS-232 Communication p.49-53 (op syntax, replies, command table): the e-vision-5000-ust model; RS232 by Telnet on TCP 23 in the LAN section."
  - title: "E-Vision 7010 Series User Manual, 123-882A"
    author: Digital Projection Ltd
    url: https://digitalprojection.co.uk/dpdownloads/User%20Guides/E-Vision-7110/E-Vision%207010%20Series%20User%20Manual%20123-882A%20EN.pdf
    note: "Manufacturer document. RS-232 Communication p.71-77 lists the commands of the e-vision-7010 model (a subset of the 122-725A list); \"RS232 by Telnet\" p.51-53: TCP 23, commands under 26 bytes, at least 200 ms between commands."
  - title: "E-Vision 6110 Series User Manual, 123-862A"
    author: Digital Projection Ltd
    url: https://digitalprojection.co.uk/dpdownloads/User%20Guides/E-Vision-6110/E-Vision%206110%20Series%20User%20Manual%20123-862A%20EN.pdf
    note: "Manufacturer document. RS-232 Communication lists the commands of the e-vision-6110 model (a subset of the 122-726A list); RS232 by Telnet on TCP 23."

transport:
  type: line-tcp
  port: 23
  framing: terminated
  terminator: cr
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  probe: "op status ?"
  # "RS232 by Telnet": at least 200 ms between commands, counted here from each answer. The
  # manuals give no gap for the RS-232 port itself.
  pacing: { min_interval_ms: 200, from: reply }

ports:
  - { port: 23, protocol: tcp, role: control, note: "RS232 by Telnet" }

