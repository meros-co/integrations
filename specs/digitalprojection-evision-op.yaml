  get:
    summary: "Read any setting by its operation keyword (op keyword ?); the reply also updates state"
    params:
      setting: { type: "string", max_length: 20, pattern: "^[A-Za-z0-9][A-Za-z0-9.]*$", required: true, label: "Setting", description: "The operation keyword of the setting, as the command list names it (bright, input.sel)." }
    send: "op {setting} ?"
    expect: { matches: "(?i)^op +\\S+ *= *(.*?) *$" }
    returns: value
  step:
    summary: "Step a setting one unit up or down (op keyword + or op keyword -)"
    params:
      setting: { type: "string", max_length: 20, pattern: "^[A-Za-z0-9][A-Za-z0-9.]*$", required: true, label: "Setting", description: "The operation keyword of the setting, as the command list names it (bright, input.sel)." }
      direction: { type: "enum", values: ["up", "down"], required: true, label: "Direction", description: "Up adds one step to the value, down subtracts one." }
    send: "op {setting} {direction:map.step}"
    expect: { matches: "(?i)^op ", not_contains: "= NA" }
    returns: ack

telemetry:
  # Nothing is pushed: status, input, mute, freeze and blank every 2 s, readings
  # every 30 s, settings every 60 s, identity once. A set is answered with the
  # new value, which updates state at once.
  poll:
    - every_ms: 2000
      send:
        - "op blank ?"
        - "op freeze ?"
        - "op input.sel ?"
        - "op mute ?"
        - "op status ?"
    - every_ms: 30000
      send:
        - { models: [e-vision-laser-9000, e-vision-9100, e-vision-laser-5900, e-vision-7010, e-vision-laser-5100, e-vision-6110], message: "op airfilter.hours ?" }
        - { models: [e-vision-laser-9000, e-vision-9100, e-vision-laser-5900, e-vision-7010, e-vision-laser-5100, e-vision-6110, e-vision-5000-ust], message: "op h.refresh ?" }
        - { models: [e-vision-laser-5900, e-vision-7010, e-vision-laser-5100, e-vision-6110], message: "op hdbaset.connect ?" }
        - "op light1.hours ?"
        - "op light1.stat ?"
        - "op net.status ?"
        - { models: [e-vision-laser-9000, e-vision-9100, e-vision-laser-5900, e-vision-7010, e-vision-laser-5100, e-vision-6110, e-vision-5000-ust], message: "op pixel.clock ?" }
        - "op source.info ?"
        - { models: [e-vision-laser-9000, e-vision-9100], message: "op threed.syncinput ?" }
        - { models: [e-vision-laser-9000, e-vision-9100, e-vision-laser-5900, e-vision-7010, e-vision-laser-5100, e-vision-6110, e-vision-5000-ust], message: "op v.refresh ?" }
    - every_ms: 60000
