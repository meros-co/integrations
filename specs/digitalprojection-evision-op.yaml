maps:
  step: { "up": "+", "down": "-" }

commands:
  set_four_corner_blx:
    summary: "Set 4 corner bottom left X (op 4corner.blx)"
    params:
      value: { type: "int", min: 0, max: 60, required: true, label: "4 corner bottom left X", description: "4 corner bottom left X: 0 to 60." }
    send:
      - { models: [e-vision-laser-9000, e-vision-9100], message: "op 4corner.blx = {value}" }
    expect: { matches: "(?i)^op ", not_contains: "= NA" }
    returns: ack
  set_four_corner_bly:
    summary: "Set 4 corner bottom left Y (op 4corner.bly)"
    params:
      value: { type: "int", min: 0, max: 60, required: true, label: "4 corner bottom left Y", description: "4 corner bottom left Y: 0 to 60." }
    send:
      - { models: [e-vision-laser-9000, e-vision-9100], message: "op 4corner.bly = {value}" }
    expect: { matches: "(?i)^op ", not_contains: "= NA" }
    returns: ack
  set_four_corner_brx:
    summary: "Set 4 corner bottom right X (op 4corner.brx)"
    params:
      value: { type: "int", min: 0, max: 60, required: true, label: "4 corner bottom right X", description: "4 corner bottom right X: 0 to 60." }
    send:
      - { models: [e-vision-laser-9000, e-vision-9100], message: "op 4corner.brx = {value}" }
    expect: { matches: "(?i)^op ", not_contains: "= NA" }
    returns: ack
  set_four_corner_bry:
    summary: "Set 4 corner bottom right y (op 4corner.bry)"
    params:
      value: { type: "int", min: 0, max: 60, required: true, label: "4 corner bottom right y", description: "4 corner bottom right y: 0 to 60." }
    send:
      - { models: [e-vision-laser-9000, e-vision-9100], message: "op 4corner.bry = {value}" }
    expect: { matches: "(?i)^op ", not_contains: "= NA" }
    returns: ack
  four_corner_reset:
    summary: "4 corner reset (op 4corner.reset)"
    send:
      - { models: [e-vision-laser-9000, e-vision-9100], message: "op 4corner.reset" }
    expect: { matches: "(?i)^op " }
    returns: ack
  set_four_corner_tlx:
