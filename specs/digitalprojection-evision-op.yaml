quirks:
  - models: [all]
    severity: info
    text: >
      Every command is "op", a space, the keyword, then " = value", " ?", " +", " -" or
      nothing (execute), ended by CR; upper and lower case are both accepted. The projector
      answers "OP BRIGHT = 50" (a get, a set or a step, with the value now in effect), "OP
      BRIGHT = NA" when the value is out of range or the setting is not available, and
      "*Illegal format#" for an unknown command; the last two fail the command. Wait for
      the answer before sending the next command (the queue does).
  - models: [all]
    severity: warning
    text: >
      The network port is "RS232 by Telnet" on TCP 23: the manuals limit a command to under
      26 bytes, the bytes sent in one go to under 50, and ask for at least 200 ms between
      commands. The queue sends one command at a time after each answer and keeps the 200 ms
      gap (transport.pacing), counted from the answer; an IP address command ("op
      net.ipaddr = 192.168.100.100", 31 bytes) is longer than the limit.
  - models: [all]
    severity: info
    text: >
      Each line documents its own values for a keyword: a command takes the union of the
      documented ranges and its description lists the meanings per model; the projector
      answers NA to a value its model lacks. The 122-725A and 122-726A lists cover the
      whole platform (every input it can have, for one), so for the E-Vision Laser 5900,
      5100, 7010 and 6110 an input or mode the projector has no hardware for is answered
      NA.
  - models: [e-vision-7010, e-vision-6110]
    severity: info
    text: >
      The E-Vision 7010 and 6110 manuals list a subset of the E-Vision Laser 5900 and 5100
      command lists; these models support that subset, with the values of the 5900 and 5100
      lists.
  - models: [all]
    severity: critical
    text: >
      These cannot be undone from the protocol: reset_all (every setting to its factory
      value), light1_reset and airfilter_reset (the light source and filter hour counters),
      apply_network_settings after the set_net_* commands (the network settings take effect
      and this connection is lost), four_corner_reset and pic_mode_reset, and
      set_security_lock and set_keypad_lock (the projector then needs the unlock sequence
      or the keypad unlock to be operated locally).
  - models: [all]
    severity: info
    text: >
      power_on and power_off switch the projector; status reports 0 reset, 1 standby, 2
      active, 3 cooling (and on some models 4 warming, 5 power up). The E-Vision Laser 6500
      II uses a different command set and is not part of this spec.
  - models: [e-vision-laser-9000, e-vision-9100]
    severity: info
    text: >
      The lens commands move one step: zoom_in, zoom_in_2 and zoom_in_3 (and the others
      alike) are three step sizes. Lens memories 1 to 8 need set_lens_lock off.
  - models: [all]
    severity: info
    text: >
      API limits: nothing is pushed, so state is as fresh as the poll; the lens position,
      the light source power in use and the temperatures cannot be read. The Telnet port
      may send Telnet option negotiation when a client connects; the manuals do not say.
  - models: [all]
    severity: info
    text: >
      No request lists the projector's inputs. Each command list documents only "input.sel"
      (Input Select, set and read) with the line's inputs in its values column (122-723A,
      122-722A, 122-725A, 122-726A, 122-980A, and the RS-232 Communication tables of the
      E-Vision 5000 UST, 7010 and 6110 manuals); their meanings per model are in the input
      state description. "model ?" (Model) is read on connecting into device.model.
