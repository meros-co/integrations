commands:
  power_on:
    summary: "Power on from standby (23PW); the next command waits a second"
    send: "@023PW"
    expect: &ack { reply_contains: "\u0006", contains: "\u0006" }
    returns: ack
  standby:
    summary: "Put the recorder in standby (2312)"
    send: "@02312"
    expect: *ack
    returns: ack
  record:
    summary: "Record (2355): with one touch recording off the first press enters record standby and the next starts recording; with it on, recording starts at once"
    send: "@02355"
    expect: *ack
    returns: ack
  record_pause:
    summary: "Pause the recording (23Rp)"
    send: "@023Rp"
    expect: *ack
    returns: ack
  split_recording:
    summary: "Split the recording into a new file at this point (23MT)"
    send: "@023MT"
    expect: *ack
    returns: ack
  add_mark:
    summary: "Add a mark at the current recording position (23121)"
    send: "@023121"
    expect: *ack
    returns: ack
  record_timers_off:
    summary: "Turn the record timers off (23TO)"
    send: "@023TO"
    expect: *ack
    returns: ack
  delete_all_record_timers:
    summary: "Delete all 30 record timers (ShAD)"
    send: "@0ShAD"
    expect: *ack
    returns: ack
  play:
    summary: "Play the current track (2353)"
    send: "@02353"
    expect: *ack
    returns: ack
  pause:
    summary: "Pause the current track (2348)"
    send: "@02348"
    expect: *ack
    returns: ack
  stop:
    summary: "Stop the track list (2354)"
    send: "@02354"
    expect: *ack
    returns: ack
  delete_all_play_timers:
    summary: "Delete all 30 playback timers (TPAD)"
    send: "@0TPAD"
    expect: *ack
    returns: ack
  previous_track:
    summary: "Restart the current track, or skip to the previous one (2333)"
    send: "@02333"
    expect: *ack
    returns: ack
  next_track:
    summary: "Skip to the next track (2332)"
    send: "@02332"
    expect: *ack
    returns: ack
  rewind:
    summary: "Rewind, each press stepping through 2x, 10x, 50x, 100x and 200x (2350)"
    send: "@02350"
    expect: *ack
    returns: ack
  fast_forward:
    summary: "Fast forward, each press stepping through 2x, 10x, 50x, 100x and 200x (2352)"
    send: "@02352"
    expect: *ack
    returns: ack
  skip_back:
    summary: "Skip back by the skip back time (23SB)"
    send: "@023SB"
    expect: *ack
    returns: ack
  frame_mode:
    summary: "Enter frame search mode: the track pauses and frames can be stepped (frON)"
    send: "@0frON"
    expect: *ack
    returns: ack
  frame_forward:
    summary: "Step one frame forward in frame search mode (fr00)"
    send: "@0fr00"
    expect: *ack
    returns: ack
  frame_reverse:
    summary: "Step one frame back in frame search mode (fr01)"
    send: "@0fr01"
    expect: *ack
    returns: ack
  previous_mark:
    summary: "Skip back to the previous mark (23M-)"
    send: "@023M-"
    expect: *ack
    returns: ack
  next_mark:
    summary: "Skip ahead to the next mark (23M+)"
    send: "@023M+"
    expect: *ack
    returns: ack
  cue:
    summary: "Go back to where playback last started, and pause (23CU)"
    send: "@023CU"
    expect: *ack
    returns: ack
  save_hotlists:
    summary: "Save all hotlists to the current media (HSSR)"
    send: "@0HSSR"
    expect: *ack
    returns: ack
  divide:
    summary: "Split the current track or recording into two files here (23Dd)"
    send: "@023Dd"
    expect: *ack
    returns: ack
  delete_marks:
    summary: "Delete all marks of the current track (23Me)"
    send: "@023Me"
    expect: *ack
    returns: ack
  pitch_up:
    summary: "Raise the pitch/speed by 0.1% (2338)"
    send: "@02338"
    expect: *ack
    returns: ack
  pitch_down:
    summary: "Lower the pitch/speed by 0.1% (2339)"
    send: "@02339"
    expect: *ack
    returns: ack
  undo:
    summary: "Undo the last edit (23UD)"
    send: "@023UD"
    expect: *ack
    returns: ack
  cancel_copy:
    summary: "Cancel a move or copy in progress (CNAL)"
    send: "@0CNAL"
    expect: *ack
    returns: ack
  format_media:
    summary: "Format the current media (23FOMAT)"
    send: "@023FOMAT"
    expect: *ack
    returns: ack
  key_lock:
    summary: "Lock the front panel keys (23KL)"
    send: "@023KL"
    expect: *ack
    returns: ack
  key_unlock:
    summary: "Unlock the front panel keys (23KU)"
    send: "@023KU"
    expect: *ack
    returns: ack
  transport_lock:
    summary: "Lock only the transport keys: stop, play, pause, record (23KS)"
    send: "@023KS"
    expect: *ack
    returns: ack
  load_settings_file:
    summary: "Load the settings preset file from the current media's root folder (PVLD)"
    send: "@0PVLD"
    expect: *ack
    returns: ack
  save_settings_file:
    summary: "Save the settings as a preset file on the current media's root folder (PVSA)"
    send: "@0PVSA"
    expect: *ack
    returns: ack
  reset_system:
    summary: "Reset the system settings to their factory defaults (DESY)"
    send: "@0DESY"
    expect: *ack
    returns: ack
  reset_presets:
    summary: "Reset the preset settings to their defaults (DEFL)"
    send: "@0DEFL"
    expect: *ack
    returns: ack
  pre_record_off:
    summary: "Turn the pre-record off (PR without a time), then read it back"
    send: ["@0PR", "@0?PR"]
    expect: *ack
    returns: ack
  record_folder_current:
    summary: "Save new recordings to the current folder (RfCU), then read it back"
    send: ["@0RfCU", "@0?Rf"]
    expect: *ack
    returns: ack
  volume_step:
    summary: Turn the recording volume up or down by 1 dB (23V), then read it back
    params:
      direction: &updown { type: enum, values: [up, down], required: true, label: Direction, description: "up or down, by 1 dB." }
    send: ["@023V{direction:map.up_down}", "@0?RV"]
    expect: *ack
    returns: ack
  left_level_step:
    summary: Turn the left recording channel up or down by 1 dB (23L), then read the volume back
    params: { direction: *updown }
    send: ["@023L{direction:map.up_down}", "@0?RV"]
    expect: *ack
    returns: ack
  right_level_step:
    summary: Turn the right recording channel up or down by 1 dB (23R), then read the volume back
    params: { direction: *updown }
    send: ["@023R{direction:map.up_down}", "@0?RV"]
    expect: *ack
    returns: ack
  balance_step:
    summary: Shift the recording balance by 1 dB toward the left or right channel (23B), then read the volume back
    params:
      toward: { type: enum, values: [left, right], required: true, label: Toward, description: "left raises the left channel and lowers the right by 1 dB; right the reverse." }
    send: ["@023B{toward:map.left_right}", "@0?RV"]
    expect: *ack
    returns: ack
  set_pre_record:
    summary: Turn the pre-record on with its time (PR), then read it back
    params:
      seconds: { type: int, min: 1, max: 5, required: true, label: Pre-record, description: "Seconds of audio kept before recording starts, 1-5." }
    send: ["@0PR{seconds}S", "@0?PR"]
    expect: *ack
    returns: ack
  set_format_wav:
    summary: Record WAV (PCM) files of a bit depth (AFPM), then read it back
    params:
      bits: { type: enum, values: ["16", "24"], required: true, label: Bit depth, description: "16 or 24 bits." }
    send: ["@0AFPM{bits:map.bits}", "@0?AF"]
    expect: *ack
    returns: ack
  set_format_mp3:
    summary: Record MP3 files of a bit rate (AFM3), then read it back
    params:
      kbps: { type: enum, values: ["64", "128", "192", "256", "320"], required: true, label: Bit rate, description: "64, 128, 192, 256 or 320 kbit/s." }
    send: ["@0AFM3{kbps:map.mp3}", "@0?AF"]
    expect: *ack
    returns: ack
  set_record_folder:
    summary: Save new recordings to a named folder (RfFX), then read it back
    params:
      folder: { type: string, max_length: 252, pattern: "^[^\\x00-\\x1F]+$", required: true, label: Folder, description: "The folder's name, without its path." }
    send: ["@0RfFX{folder}", "@0?Rf"]
    expect: *ack
    returns: ack
  set_silent_level:
    summary: Set the level below which silent skip and automark act (SL); the recorder has no request to read it back
    params:
      level: { type: enum, values: ["-20", "-38", "-54", "-60"], required: true, label: Silent level, description: "The threshold in dB: -20, -38, -54 or -60." }
    send: "@0SL{level:map.silent_level}"
    expect: *ack
    returns: ack
  set_silent_time:
    summary: Set how long the input must stay below the silent level (SC); the recorder has no request to read it back
    params:
      seconds: { type: int, min: 1, max: 5, required: true, label: Silent time, description: "Seconds, 1-5." }
    send: "@0SC{seconds:02d}"
    expect: *ack
    returns: ack
  set_machine_name:
    summary: Rename the recorder, the name file names can use (MN), then read it back
    params:
      name: { type: string, pattern: "^[A-Za-z0-9_-]{1,12}$", required: true, label: Machine name, description: "Up to 12 letters, digits, - and _." }
    send: ["@0MN{name}", "@0?MN"]
    expect: *ack
    returns: ack
  set_user_area:
    summary: Set the user area text file names can include (Ua), then read it back
    params:
      text: &user_area { type: string, max_length: 32, pattern: "^[^\\x00-\\x1F]*$", required: true, label: User area, description: "Up to 32 characters." }
    send: ["@0Ua{text}", "@0?UA"]
    expect: *ack
    returns: ack
  set_record_timer_weekly:
    summary: Set a record timer on days of the week (ShDW), then read it back
    params:
      timer: &timer { type: int, min: 1, max: 30, required: true, label: Timer, description: "The timer's number, 1-30." }
      days: &days { type: string, pattern: "^[S_][M_][T_][W_][T_][F_][S_]$", required: true, label: Days,
        description: "Seven characters from Sunday to Saturday, the day's letter to include it or _ to skip it: _M_W_F_ for Monday, Wednesday and Friday." }
      hour: &hour { type: string, pattern: "^([01][0-9]|2[0-3]|\\*\\*)$", required: true, label: Hour, description: "The start hour, 00-23, or ** for every hour." }
      minute: &minute { type: int, min: 0, max: 59, required: true, label: Minute, description: "The start minute, 0-59." }
      duration_hours: &dh { type: int, min: 0, max: 23, required: true, label: Duration hours, description: "The recording's length, hours 0-23." }
      duration_minutes: &dm { type: int, min: 0, max: 59, required: true, label: Duration minutes, description: "The recording's length, minutes 0-59." }
      user_area: { type: string, max_length: 32, pattern: "^[^\\x00-\\x1F]*$", default: "", label: User area, description: "The user area for the files recorded, up to 32 characters." }
    send: ["@0ShDW{timer:02d}{days}{hour}{minute:02d}{duration_hours:02d}{duration_minutes:02d}{user_area}", "@0?Sh{timer:02d}"]
    expect: *ack
    returns: ack
  set_record_timer_date:
    summary: Set a record timer on a date (ShDT), then read it back
    params:
      timer: *timer
      year: &year { type: string, pattern: "^(1[3-9]|2[0-9]|3[0-5]|\\*\\*)$", required: true, label: Year, description: "The year's last two digits, 13-35, or ** for every year." }
      month: &month { type: string, pattern: "^(0[1-9]|1[0-2]|\\*\\*)$", required: true, label: Month, description: "The month, 01-12, or ** for every month." }
      day: &day { type: int, min: 1, max: 31, required: true, label: Day, description: "The day of the month, 1-31." }
      hour: { type: int, min: 0, max: 23, required: true, label: Hour, description: "The start hour, 0-23." }
      minute: *minute
      duration_hours: *dh
      duration_minutes: *dm
      user_area: { type: string, max_length: 32, pattern: "^[^\\x00-\\x1F]*$", default: "", label: User area, description: "The user area for the files recorded, up to 32 characters." }
    send: ["@0ShDT{timer:02d}{year}{month}{day:02d}{hour:02d}{minute:02d}{duration_hours:02d}{duration_minutes:02d}{user_area}", "@0?Sh{timer:02d}"]
    expect: *ack
    returns: ack
  delete_record_timer:
    summary: Delete a record timer (ShDL)
    params: { timer: *timer }
    send: "@0ShDL{timer:02d}"
    expect: *ack
    returns: ack
  get_record_timer:
    summary: "Read a record timer (?Sh): DW and the days, start and duration, or DT and the date, start and duration, then the user area"
    params: { timer: *timer }
    send: "@0?Sh{timer:02d}"
    expect: { reply_contains: "@0Sh", matches: '^@0Sh(D[WT][^\r]*)\r?$' }
    returns: value
  set_input_trim:
    summary: Trim the analog input of one channel (It), then read it back
    params:
      channel: &channel { type: enum, values: [left, right], required: true, label: Channel, description: "left or right." }
      tenths: &trim { type: int, min: -20, max: 20, required: true, label: Trim, description: "The trim in tenths of a dB, -20 to +20 (-2.0 to +2.0 dB)." }
    send: ["@0It{channel:map.left_right}{tenths:map.trim}", "@0?It{channel:map.left_right}"]
    expect: *ack
    returns: ack
  get_input_trim:
    summary: "Read one channel's input trim (?It): a sign and two digits, tenths of a dB"
    params: { channel: *channel }
    send: "@0?It{channel:map.left_right}"
    expect: { reply_contains: "@0It{channel:map.left_right}", matches: '^@0It[LR]([-+]?[0-9]{2})\r?$' }
    returns: value
  set_output_trim:
    summary: Trim the analog output of one channel (Ot), then read it back
    params: { channel: *channel, tenths: *trim }
    send: ["@0Ot{channel:map.left_right}{tenths:map.trim}", "@0?Ot{channel:map.left_right}"]
    expect: *ack
    returns: ack
  get_output_trim:
    summary: "Read one channel's output trim (?Ot): a sign and two digits, tenths of a dB"
    params: { channel: *channel }
    send: "@0?Ot{channel:map.left_right}"
    expect: { reply_contains: "@0Ot{channel:map.left_right}", matches: '^@0Ot[LR]([-+]?[0-9]{2})\r?$' }
    returns: value
  hot_start_play:
    summary: Play the track assigned to a hot start number (HP)
    params:
      number: &hot { type: int, min: 1, max: 20, required: true, label: Hot start, description: "The hot start number, 1-20." }
    send: "@0HP{number:02d}"
    expect: *ack
    returns: ack
  hot_start_cue:
    summary: Cue the track assigned to a hot start number (HC)
    params: { number: *hot }
    send: "@0HC{number:02d}"
    expect: *ack
    returns: ack
  get_hot_start_number:
    summary: "Read the current track's hot start number (?HP)"
    send: "@0?HP"
    expect: { reply_contains: "@0HP", matches: '^@0HP([0-9]{2})\r?$' }
    returns: value
  set_play_timer_weekly:
    summary: Set a playback timer on days of the week (TPDW), then read it back
    params:
      timer: *timer
      days: *days
      hour: *hour
      minute: *minute
      file: &file { type: string, max_length: 252, pattern: "^/[^\\x00-\\x1F]*$", required: true, label: File, description: "The track file's absolute path, from / at the media's root: /Music/Song1.wav." }
    send: ["@0TPDW{timer:02d}{days}{hour}{minute:02d}{file}", "@0?TP{timer:02d}"]
    expect: *ack
    returns: ack
  set_play_timer_date:
    summary: Set a playback timer on a date (TPDT), then read it back
    params:
      timer: *timer
      year: *year
      month: *month
      day: *day
      hour: { type: int, min: 0, max: 23, required: true, label: Hour, description: "The start hour, 0-23." }
      minute: *minute
      file: *file
    send: ["@0TPDT{timer:02d}{year}{month}{day:02d}{hour:02d}{minute:02d}{file}", "@0?TP{timer:02d}"]
    expect: *ack
    returns: ack
  delete_play_timer:
    summary: Delete a playback timer (TPDL)
    params: { timer: *timer }
    send: "@0TPDL{timer:02d}"
    expect: *ack
    returns: ack
  get_play_timer:
    summary: "Read a playback timer (?TP): DW and the days and start, or DT and the date and start, then the file"
    params: { timer: *timer }
    send: "@0?TP{timer:02d}"
    expect: { reply_contains: "@0TP", matches: '^@0TP(D[WT][^\r]*)\r?$' }
    returns: value
  locate_track:
    summary: Select a track by its file number (Tr)
    params:
      track: &track { type: int, min: 1, max: 2000, required: true, label: Track, description: "The track's file number, 1-2000." }
    send: "@0Tr{track:04d}"
    expect: *ack
    returns: ack
  locate_folder:
    summary: Select a folder by number (Sf)
    params:
      folder: { type: int, min: 1, max: 2000, required: true, label: Folder, description: "The folder's number, 1-2000." }
    send: "@0Sf{folder:04d}"
    expect: *ack
    returns: ack
  load_program_list:
    summary: Load a program list file (Pl)
    params: { path: &path { type: string, max_length: 252, pattern: "^/[^\\x00-\\x1F]*$", required: true, label: File, description: "The file's absolute path, from / at the media's root." } }
    send: "@0Pl{path}"
    expect: *ack
    returns: ack
  add_to_program:
    summary: Put a track at a position of the loaded program list (Pi)
    params:
      position: &position { type: int, min: 1, max: 99, required: true, label: Position, description: "The position in the program list, 1-99." }
      track: *track
    send: "@0Pi{position:02d}{track:04d}"
    expect: *ack
    returns: ack
  remove_from_program:
    summary: Remove the track at a position of the loaded program list (Pm)
    params: { position: *position }
    send: "@0Pm{position:02d}"
    expect: *ack
    returns: ack
  save_program_list:
    summary: Save the loaded program list as a file (Ps)
    params: { path: *path }
    send: "@0Ps{path}"
    expect: *ack
    returns: ack
  rewind_speed:
    summary: Rewind at a given speed (2350 with a speed)
    params:
      speed: &speed { type: enum, values: [2x, 10x, 50x, 100x, 200x], required: true, label: Speed, description: "2x, 10x, 50x, 100x or 200x." }
    send: "@02350{speed:map.speed}"
    expect: *ack
    returns: ack
  fast_forward_speed:
    summary: Fast forward at a given speed (2352 with a speed)
    params: { speed: *speed }
    send: "@02352{speed:map.speed}"
    expect: *ack
    returns: ack
  set_skip_back_time:
    summary: Set how far skip back goes (SB), then read it back
    params:
      tenths: { type: int, min: 5, max: 600, required: true, label: Skip back, description: "Tenths of a second, 5-600 (0.5 to 60 seconds)." }
    send: ["@0SB{tenths:03d}", "@0?SB"]
    expect: *ack
    returns: ack
  get_skip_back_time:
    summary: "Read the skip back time (?SB): three digits, tenths of a second"
    send: "@0?SB"
    expect: { reply_contains: "@0SB", matches: '^@0SB([0-9]{3})\r?$' }
    returns: value
  load_hotlist:
    summary: Load a hotlist file (HL)
    params: { name: { type: string, max_length: 252, pattern: "^[^\\x00-\\x1F]+$", required: true, label: Hotlist, description: "The hotlist file's name." } }
    send: "@0HL{name}"
    expect: *ack
    returns: ack
  assign_hot_start:
    summary: Assign a track to a hot start number of the loaded hotlist, or with track 0 clear it (HS), then read it back
    params:
      number: *hot
      track: { type: int, min: 0, max: 999, required: true, label: Track, description: "The track's file number, 1-999, or 0 to clear the assignment." }
    send: ["@0HS{number:02d}{track:03d}", "@0?Hs{number:02d}"]
    expect: *ack
    returns: ack
  assign_hot_start_file:
    summary: Assign a track file to a hot start number of the loaded hotlist (Hs), then read it back
    params: { number: *hot, file: *file }
    send: ["@0Hs{number:02d}{file}", "@0?Hs{number:02d}"]
    expect: *ack
    returns: ack
  get_hot_start:
    summary: "Read a hot start number's track (?Hs): the number, the file name (its first digit the media, 1 SD, 2 USB), then its start time"
    params: { number: *hot }
    send: "@0?Hs{number:02d}"
    expect: { reply_contains: "@0Hs{number:02d}", matches: '^@0Hs[0-9]{2}([^\r]*)\r?$' }
    returns: value
  combine:
    summary: Join another track to the current one (23CB)
    params: { track: *track }
    send: "@023CB{track:04d}"
    expect: *ack
    returns: ack
  set_pitch_control:
    summary: Turn pitch/speed control on or off (2337), then read the pitch back
    params:
      enabled: &enabled { type: bool, required: true, label: Enabled, description: "On turns the function on, off turns it off." }
    send: ["@02337{enabled:map.onof}", "@0?PT"]
    expect: *ack
    returns: ack
  set_pitch:
    summary: Set pitch/speed control and its value (PT), then read it back
    params:
      enabled: *enabled
      tenths: { type: int, min: -160, max: 160, required: true, label: Pitch, description: "The pitch/speed change in tenths of a percent, -160 to +160 (-16.0% to +16.0%)." }
    send: ["@0PT{enabled:map.onof}{tenths:map.pitch}", "@0?PT"]
    expect: *ack
    returns: ack
  get_pitch:
    summary: "Read pitch/speed (?PT): ON or OF, then 0 (up) or 1 (down) and three digits in tenths of a percent"
    send: "@0?PT"
    expect: { reply_contains: "@0PT", matches: '^@0PT((?:ON|OF)[01][0-9]{3})\r?$' }
    returns: value
  create_folder:
    summary: Create a folder on the current media (MF)
    params: { name: &folder_name { type: string, max_length: 252, pattern: "^[^\\x00-\\x1F/]+$", required: true, label: Folder, description: "The folder's name, without its path." } }
    send: "@0MF{name}"
    expect: *ack
    returns: ack
  delete_folder:
    summary: Delete a folder of the current media (DR)
    params: { name: *folder_name }
    send: "@0DR{name}"
    expect: *ack
    returns: ack
  rename_folder:
    summary: Rename a folder of the current media (RF)
    params:
      path: { type: string, max_length: 252, pattern: "^/[^\\x00-\\x1F:]*$", required: true, label: Folder, description: "The folder's absolute path, from / at the media's root." }
      name: *folder_name
    send: "@0RF{path}:{name}"
    expect: *ack
    returns: ack
  move_file:
    summary: Move a file to a folder (Mv)
    params:
      file: &file_number { type: int, min: 1, max: 2000, required: true, label: File, description: "The file's number, 1-2000." }
      folder: &dest { type: string, max_length: 252, pattern: "^/[^\\x00-\\x1F]*$", required: true, label: Folder, description: "The destination folder's absolute path, from / at the media's root." }
    send: "@0Mv{file:04d}{folder}"
    expect: *ack
    returns: ack
  copy_file:
    summary: Copy a file to a folder (CY)
    params: { file: *file_number, folder: *dest }
    send: "@0CY{file:04d}{folder}"
    expect: *ack
    returns: ack
  delete_file:
    summary: Delete a file (23Te)
    params: { file: *file_number }
    send: "@023Te{file:04d}"
    expect: *ack
    returns: ack
  rename_file:
    summary: Rename a file (RN)
    params:
      file: *file_number
      name: { type: string, max_length: 251, pattern: "^[^\\x00-\\x1F/]+$", required: true, label: Name, description: "The new file name, up to 251 characters, without a path." }
    send: "@0RN{file:04d}{name}"
    expect: *ack
    returns: ack
  set_clock:
    summary: Set the date and time (Dt), then read it back
    params:
      year: { type: int, min: 2013, max: 2035, required: true, label: Year, description: "The year, 2013-2035." }
      month: { type: int, min: 1, max: 12, required: true, label: Month, description: "The month, 1-12." }
      day: *day
      hour: { type: int, min: 0, max: 23, required: true, label: Hour, description: "The hour, 0-23." }
      minute: *minute
    send: ["@0Dt{year:-2000:02d}{month:02d}{day:02d}{hour:02d}{minute:02d}", "@0?Dt"]
    expect: *ack
    returns: ack
  get_clock:
    summary: "Read the date and time (?Dt): YYMMDDhhmm"
    send: "@0?Dt"
    expect: { reply_contains: "@0Dt", matches: '^@0Dt([0-9]{10})\r?$' }
    returns: value
  set_dst_offset:
    summary: Set the daylight saving offset (do), then read it back
    params:
      hours: { type: int, min: 0, max: 6, required: true, label: Hours, description: "Hours, 0-6." }
      minutes: { type: enum, values: ["0", "15", "30", "45"], required: true, label: Minutes, description: "Minutes, in steps of 15." }
    send: ["@0do{hours:02d}{minutes:map.dst_minutes}", "@0?do"]
    expect: *ack
    returns: ack
  get_dst_offset:
    summary: "Read the daylight saving offset (?do): hhmm"
    send: "@0?do"
    expect: { reply_contains: "@0do", matches: '^@0do([0-9]{4})\r?$' }
    returns: value
  set_dst_start:
    summary: Set when daylight saving starts (ds), then read it back
    params:
      month: &dst_month { type: int, min: 1, max: 12, required: true, label: Month, description: "The month, 1-12." }
      day: *day
      hour: &dst_hour { type: int, min: 0, max: 23, required: true, label: Hour, description: "The hour, 0-23." }
      minute: *minute
    send: ["@0ds{month:02d}{day:02d}{hour:02d}{minute:02d}", "@0?ds"]
    expect: *ack
    returns: ack
  get_dst_start:
    summary: "Read when daylight saving starts (?ds): MMDDhhmm"
    send: "@0?ds"
