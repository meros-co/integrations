quirks:
  - models: [all]
    severity: critical
    text: >
      record starts a recording (with one touch recording off, the first press only readies it), split_recording,
      record_pause and stop change it at once. format_media erases the media; delete_file, delete_folder, divide,
      combine, delete_marks, the timer deletions, reset_system and reset_presets cannot be undone; set_language
      reboots the recorder.
  - models: [all]
    severity: warning
    text: >
      The recorder expects the host to answer each status it sends by itself with ACK within 300 ms; the spec format
      cannot answer a push without awaiting a reply, so the recorder sends each such status twice and then stops
      repeating it. State is unaffected. NACK, or BUSY when commands come too fast, fails the command.
  - models: [all]
    severity: warning
    text: >
      The guide gives random and program list playback as 00 on and 01 off to set, but answers RN01 and PG01 for
      on; each is taken as documented. Random's code RN is also the start of rename_file (RN with a file number and
      a name). Its media size request is the same ?SF as the current folder's name, so only the folder name and the
      free space (?FE) are read. It shows the track change it sends as "@Tr NNNN", read with or without the 0, and
      the 4-digit hot start assignment without "@0", which the spec does not send (assign_hot_start takes tracks to
      999, assign_hot_start_file any file).
  - models: [all]
    severity: info
    text: >
      The guide prints spaces inside some codes ("@0PO XX", "@0IN XX"); the spec sends none, as in its own
      examples, and reads answers with or without one. The silent level and silent time, the admin password and
      the fade in answer's code (FL in the guide) are as documented; the first two cannot be read back. Track and
      file numbers use the four-digit forms (1-2000) of the commands that have three- and four-digit forms.
  - models: [all]
    severity: info
    text: >
      The RS-232C speed's factory setting is not documented; 9600 is assumed (the RC-F400S remote needs 38400 set).
      The recorder has no network control.

state:
  power: { type: string, description: "on or standby (PW)" }
  media.status: { type: string, description: "card_in, no_card, card_error, unformatted, write_protected or door_open (CD)" }
  media.sd.free: { type: string, description: "Free space on the SD card as the recorder gives it (FE)" }
  media.usb.free: { type: string, description: "Free space on the USB drive as the recorder gives it (FE)" }
  transport.status: { type: string, description: "play, ab_repeat, pause, pause_repeat, stop, cued, autocue, rewind, fast_forward, loading, busy, file_list, menu, timer_standby, error, record, record_pause or dir_unlocked (ST)" }
  search.direction: { type: string, description: "rewind or fast_forward (SP)" }
  search.speed: { type: int, description: "The search speed: 2, 10, 50, 100 or 200 times (SP)" }
  recording.pre_record_seconds: { type: int, unit: s, description: "Pre-record time, 1-5; 0 when off (PR)" }
  recording.format: { type: string, description: "wav or mp3 (AF)" }
  recording.bits: { type: int, description: "The WAV bit depth, 16 or 24 (AF)" }
  recording.mp3_kbps: { type: int, unit: kbit/s, description: "The MP3 bit rate (AF)" }
  recording.folder_mode: { type: string, description: "current (the current folder) or fixed (a named folder) (Rf)" }
  recording.folder: { type: string, description: "The named folder new recordings go to (Rf)" }
  recording.remaining: { type: string, description: "Recording time left on the media, H:MM:SS (RT)" }
  recording.volume.left: { type: int, unit: dB, description: "The left recording channel's volume, rounded (RV)" }
  recording.volume.right: { type: int, unit: dB, description: "The right recording channel's volume, rounded (RV)" }
  recording.trim.left: { type: int, unit: 0.1 dB, description: "The left analog input's trim in tenths of a dB (ItL)" }
  recording.trim.right: { type: int, unit: 0.1 dB, description: "The right analog input's trim in tenths of a dB (ItR)" }
  output.trim.left: { type: int, unit: 0.1 dB, description: "The left analog output's trim in tenths of a dB (OtL)" }
  output.trim.right: { type: int, unit: 0.1 dB, description: "The right analog output's trim in tenths of a dB (OtR)" }
  machine_name: { type: string, description: "The machine name (MN)" }
  user_area: { type: string, description: "The user area text (Ua)" }
  record_timers.*.kind: { type: string, description: "weekly or date, keyed by the timer's number 1-30 (Sh)" }
  record_timers.*.days: { type: string, description: "The days, Sunday to Saturday, a letter or _ each (Sh DW)" }
  record_timers.*.date: { type: string, description: "The date as YYMMDD, ** for every year or month (Sh DT)" }
  record_timers.*.start: { type: string, description: "The start, HH:MM, ** for every hour (Sh)" }
  record_timers.*.duration: { type: string, description: "The recording's length, HH:MM (Sh)" }
  record_timers.*.user_area: { type: string, description: "The user area for the files recorded (Sh)" }
  play_timers.*.kind: { type: string, description: "weekly or date, keyed by the timer's number 1-30 (TP)" }
  play_timers.*.days: { type: string, description: "The days, Sunday to Saturday, a letter or _ each (TP DW)" }
  play_timers.*.date: { type: string, description: "The date as YYMMDD, ** for every year or month (TP DT)" }
  play_timers.*.start: { type: string, description: "The start, HH:MM, ** for every hour (TP)" }
  play_timers.*.file: { type: string, description: "The file to play (TP)" }
  timers.current.kind: { type: string, description: "The timer running now: record or play (Ct)" }
  timers.current.number: { type: int, description: "Its number (Ct)" }
  timers.reserved.kind: { type: string, description: "The next timer due: record or play (Rt)" }
  timers.reserved.number: { type: int, description: "Its number (Rt)" }
  track.number: { type: int, description: "The current track's file number; 0 with none (Tr)" }
  tracks.total: { type: int, description: "Tracks in the current folder (Tt)" }
  track.title: { type: string, description: "The current track's title (ti, or T1 for up to 255 characters)" }
  track.artist: { type: string, description: "The current track's artist (at, T2)" }
  track.album: { type: string, description: "The current track's album (al, T3)" }
  track.format: { type: string, description: "pcm, wav, aiff, mp3 or aac (af)" }
  track.bits: { type: int, description: "The track's bit depth, for PCM, WAV and AIFF (af)" }
  track.kbps: { type: int, unit: kbit/s, description: "The track's bit rate, for MP3 and AAC (af)" }
  track.sample_rate: { type: int, unit: kHz, description: "The track's sample rate, 44 (44.1), 48 or 96 (fs)" }
  track.channels: { type: string, description: "stereo or mono (ch)" }
  track.length: { type: string, description: "The track's length, MMM:SS:FF (tl)" }
  tracks.*.title: { type: string, description: "A track's title, keyed by its file number (tn)" }
  tracks.*.size_kb: { type: int, unit: KB, description: "A track's file size, keyed by its file number (ts)" }
  time.elapsed: { type: string, description: "Time elapsed in the track, H:MM:SS (ET)" }
  time.remaining: { type: string, description: "Time remaining in the track, H:MM:SS (RM)" }
  folders.total: { type: int, description: "Folders in the current folder (Tf)" }
  folder.name: { type: string, description: "The current folder's name, a 1 (SD) or 2 (USB) before it as the recorder gives it (SF)" }
  folders.*.name: { type: string, description: "A folder's name, keyed by its number (Fn)" }
  file_list_changed: { type: bool, description: "Whether the current folder's file list changed since last asked (UL)" }
  hot_start.current: { type: int, description: "The current track's hot start number (HP)" }
  hot_starts.*.file: { type: string, description: "A hot start number's file, its first digit the media (1 SD, 2 USB) (Hs)" }
  hot_starts.*.time: { type: string, description: "A hot start number's start time, H:MM:SS.mmm (Hs)" }
  program_lists.total: { type: int, description: "Saved program lists (tP)" }
  program_lists.*.name: { type: string, description: "A program list's file name, keyed by its number (pl)" }
  pitch.enabled: { type: bool, description: "Pitch/speed control on (PT)" }
  pitch.percent: { type: float, unit: "%", description: "The pitch/speed change, -16.0 to +16.0 (PT)" }
  marks.total: { type: int, description: "Marks in the current track (Tm)" }
  marks.*.time: { type: string, description: "A mark's time position, HH:MM:SS:FF, keyed by its number (Mt)" }
  lock: { type: string, description: "locked, unlocked or semi_locked (LS)" }
  skip_back_tenths: { type: int, unit: 0.1 s, description: "Skip back time in tenths of a second, 5-600 (SB)" }
  clock.now: { type: string, description: "The recorder's date and time, YYYY-MM-DDThh:mm (Dt)" }
  clock.dst_offset: { type: string, description: "The daylight saving offset, HH:MM (do)" }
  clock.dst_start: { type: string, description: "When daylight saving starts, MM-DD hh:mm (ds)" }
  clock.dst_end: { type: string, description: "When daylight saving ends, MM-DD hh:mm (de)" }
  presets.*.title: { type: string, description: "A settings preset's title, keyed 1-3 (PN)" }
  remote_update.file: { type: string, description: "The RC-F400S remote's update file: ok or ng (UF)" }
  remote_update.data: { type: string, description: "The RC-F400S remote's update file information (UD)" }
  version: { type: string, description: "The version digits and model name (VN)" }
  error.code: { type: string, description: "The last device error's code (ER)" }
  error.display_seconds: { type: int, unit: s, description: "How long the error shows on the display; 0 until it is resolved (ER)" }
  power_on_mode: { type: string, description: "Power on mode: resume, play_first, stop or record (PO)" }
  media.current: { type: string, description: "Media: sd or usb (MM)" }
  recording.input: { type: string, description: "Recording input: unbalanced, balanced, coaxial or aes (IN)" }
  recording.channels: { type: string, description: "Recording channels: stereo, mono_left or mono_mix (CH)" }
  recording.one_touch: { type: bool, description: "One touch recording on (OR)" }
  recording.monitor: { type: bool, description: "Record monitor on (Rm)" }
  recording.input_volume: { type: string, description: "Input volume: variable or fixed (VI)" }
  recording.dual: { type: string, description: "Dual recording: off, sd or usb (dR)" }
  recording.relay: { type: string, description: "Relay recording: off, sd or usb (rR)" }
  recording.auto_track: { type: string, description: "Auto track: off, 1m, 5m, 10m, 15m, 30m, 1h, 2h, 6h, 8h, 12h or 24h (AT)" }
  recording.silent_skip: { type: bool, description: "Silent skip on (SS)" }
  recording.automark: { type: bool, description: "Automark on (AM)" }
  recording.sample_rate: { type: string, description: "Sample rate: 44.1, 48, 96 or external (FS)" }
  recording.file_name_format: { type: string, description: "File name format: machine_date_user, machine_user_date, date_machine_user, date_user_machine, user_machine_date or user_date_machine (Ff)" }
  recording.user_area_in_name: { type: bool, description: "User area in names on (US)" }
  recording.input_to_outputs: { type: bool, description: "Input to outputs on (Sp)" }
  recording.level_knob: { type: string, description: "Record level knob: master or left_right (Rl)" }
  recording.alc: { type: string, description: "Auto level control: off, separate or mixed (RL)" }
  playback.range: { type: string, description: "Playback range: all or folder (pR)" }
  playback.mode: { type: string, description: "Playback mode: single or continuous (PM)" }
  playback.repeat: { type: bool, description: "Repeat on (RE)" }
  playback.random: { type: bool, description: "Random on (RN)" }
  playback.program: { type: bool, description: "Program list playback on (PG)" }
  playback.finish_mode: { type: string, description: "Finish mode: stop, next or recue (FM)" }
  playback.fade_in: { type: string, description: "Fade in: off, 0.5s, 1s or 3s (FI)" }
  playback.fade_out: { type: string, description: "Fade out: off, 0.5s, 1s or 3s (FO)" }
  playback.delay: { type: string, description: "Playback delay: off, 100ms, 200ms or 300ms (sD)" }
  playback.eom: { type: string, description: "End of message: off, 0s, 5s, 10s, 15s, 20s, 30s or 60s (ED)" }
  playback.autocue: { type: string, description: "Autocue: off, -36, -42 or -48 (AC)" }
  timers.priority: { type: string, description: "Timer priority: unless_recording or when_idle (tp)" }
  playback.file_order: { type: string, description: "File order: alphabetical or date (FR)" }
  playback.search_audio: { type: string, description: "Search audio: audible or silent (sM)" }
  pitch.master_key: { type: bool, description: "Master key on (KY)" }
  output.rate: { type: string, description: "Digital output rate: auto, 44.1, 48 or external (dF)" }
  output.mono: { type: bool, description: "Mono output on (MO)" }
  output.reference_level: { type: string, description: "Reference level: +24, +20 or +18 (Fr)" }
  clock.daylight_saving: { type: bool, description: "Daylight saving on (dS)" }
  display.time_format: { type: string, description: "Time display: hms or msf (TD)" }
  display.time_notation: { type: string, description: "Clock: 12h or 24h (TF)" }
  display.date_format: { type: string, description: "Date format: mdy, dmy or ymd (DF)" }
  display.screen_saver: { type: bool, description: "Screen saver on (Ss)" }
  display.dimmer: { type: bool, description: "Dimmer on (DM)" }
  display.brightness: { type: string, description: "Display brightness: 100, 75, 50, 25 or 0 (DD)" }
  display.led_brightness: { type: string, description: "LED brightness: 100, 75, 50 or 25 (LD)" }
  display.contrast: { type: string, description: "Display contrast: 1, 2, 3, 4 or 5 (BN)" }
  display.language: { type: string, description: "Language: english or japanese (LN)" }
  parallel.hot_start: { type: string, description: "Parallel hot start: play or cue (PA)" }
  parallel.fader_start: { type: string, description: "Fader start: play, play_pause, play_next, play_lock, play_lock_pause, play_lock_next, start_pause, start_pause_track or manual_track (FD)" }
  shift: { type: string, description: "Shift: momentary or lock (Sm)" }
  auto_reboot: { type: bool, description: "Auto reboot on (Ar)" }
  keyboard: { type: string, description: "Keyboard: us, uk, french, german, italian, spanish, dutch, swedish or japanese (KB)" }
  preset: { type: string, description: "Settings preset: 1, 2 or 3 (PS)" }

telemetry:
  poll:
    - every_ms: 1000
      send: ["@0?ST", "@0?ET", "@0?RM"]
    - every_ms: 5000
      send: ["@0?CD", "@0?MM", "@0?Tr", "@0?Tt", "@0?Tf", "@0?SF", "@0?RT", "@0?RV", "@0?SP", "@0?FE", "@0?HP", "@0?Tm",
        "@0?LS", "@0?UL", "@0?Ct", "@0?Rt", "@0?PT"]
    - every_ms: 30000
      send: ["@0?PW", "@0?PR", "@0?Rf", "@0?AF", "@0?MN", "@0?UA", "@0?ItL", "@0?ItR", "@0?OtL", "@0?OtR", "@0?SB", "@0?Dt",
        "@0?do", "@0?ds", "@0?de", "@0?tP", "@0?PN1", "@0?PN2", "@0?PN3", "@0?UF", "@0?UD", "@0?VN",
        "@0?PO", "@0?MM", "@0?IN", "@0?CH", "@0?OR", "@0?Rm", "@0?VI", "@0?dR", "@0?rR", "@0?AT", "@0?SS", "@0?AM",
        "@0?FS", "@0?Ff", "@0?US", "@0?Sp", "@0?Rl", "@0?RL", "@0?pR", "@0?PM", "@0?RE", "@0?RN", "@0?PG", "@0?FM",
        "@0?FI", "@0?FO", "@0?sD", "@0?ED", "@0?AC", "@0?tp", "@0?FR", "@0?sM", "@0?KY", "@0?dF", "@0?MO", "@0?Fr",
        "@0?dS", "@0?TD", "@0?TF", "@0?DF", "@0?Ss", "@0?DM", "@0?DD", "@0?LD", "@0?BN", "@0?LN", "@0?PA", "@0?FD",
        "@0?Sm", "@0?Ar", "@0?KB", "@0?PS"]
  updates:
    - match: '^@0PW([0-9]{2})\r?$'
      state: { power: { value: "{1}", map: { "00": "on", "01": standby } } }
    - match: '^@0CD([A-Z]{2})\r?$'
      state: { media.status: { value: "{1}", map: { CI: card_in, NC: no_card, CE: card_error, UF: unformatted, WP: write_protected, DO: door_open } } }
    - match: '^@0ME(US|S1)\r?$'
      state: { media.current: { value: "{1}", map: { US: usb, S1: sd } } }
    - match: '^@0FES1 ?([^\r]+)\r?$'
      state: { media.sd.free: "{1}" }
    - match: '^@0FEUS ?([^\r]+)\r?$'
      state: { media.usb.free: "{1}" }
    - match: '^@0ST([A-Z]{2})\r?$'
      state: { transport.status: { value: "{1}", map: { PL: play, AB: ab_repeat, PP: pause, PR: pause_repeat, ST: stop, CU: cued, AC: autocue,
        RW: rewind, FF: fast_forward, LD: loading, BY: busy, FL: file_list, ED: menu, SH: timer_standby, ER: error, RE: record,
        RP: record_pause, RU: dir_unlocked } } }
    - match: '^@0SP([RF])([0-9]{3})\r?$'
      state:
        search.direction: { value: "{1}", map: { R: rewind, F: fast_forward } }
        search.speed: "{2}"
    - match: '^@0PR\r?$'
      state: { recording.pre_record_seconds: "0" }
    - match: '^@0PR ?([1-5])S\r?$'
      state: { recording.pre_record_seconds: "{1}" }
    - match: '^@0AFPM ?([0-9]{2})\r?$'
      state: { recording.format: wav, recording.bits: "{1}" }
    - match: '^@0AFM3 ?([0-9]{3})\r?$'
      state: { recording.format: mp3, recording.mp3_kbps: "{1}" }
    - match: '^@0RfCU\r?$'
      state: { recording.folder_mode: current }
    - match: '^@0RfFX ?([^\r]*)\r?$'
      state: { recording.folder_mode: fixed, recording.folder: "{1}" }
    - match: '^@0RT([0-9]{3})([0-9]{2})([0-9]{2})\r?$'
      state: { recording.remaining: "{1}:{2:02d}:{3:02d}" }
    - match: '^@0RV([-+ 0-9]{2})([-+ 0-9]{2})\r?$'
      state: { recording.volume.left: "{1}", recording.volume.right: "{2}" }
    - match: '^@0ItL([-+]?[0-9]{2})\r?$'
      state: { recording.trim.left: "{1}" }
    - match: '^@0ItR([-+]?[0-9]{2})\r?$'
      state: { recording.trim.right: "{1}" }
    - match: '^@0OtL([-+]?[0-9]{2})\r?$'
      state: { output.trim.left: "{1}" }
    - match: '^@0OtR([-+]?[0-9]{2})\r?$'
      state: { output.trim.right: "{1}" }
    - match: '^@0MN([^\r]*)\r?$'
      state: { machine_name: "{1}" }
    - match: '^@0Ua([^\r]*)\r?$'
      state: { user_area: "{1}" }
    # Timers: the reply names no number, so it is read from the request it answers.
    - match: '^@0ShDW([SMTWF_]{7})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})([^\r]*)\r?$'
      request_match: '^@0\?Sh([0-9]{2})$'
      state: { "record_timers.{7}.kind": weekly, "record_timers.{7}.days": "{1}", "record_timers.{7}.start": "{2:02d}:{3:02d}",
        "record_timers.{7}.duration": "{4:02d}:{5:02d}", "record_timers.{7}.user_area": "{6}" }
    - match: '^@0ShDW([SMTWF_]{7})\*\*([0-9]{2})([0-9]{2})([0-9]{2})([^\r]*)\r?$'
      request_match: '^@0\?Sh([0-9]{2})$'
      state: { "record_timers.{6}.kind": weekly, "record_timers.{6}.days": "{1}", "record_timers.{6}.start": "**:{2:02d}",
        "record_timers.{6}.duration": "{3:02d}:{4:02d}", "record_timers.{6}.user_area": "{5}" }
    - match: '^@0ShDT([0-9*]{6})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})([^\r]*)\r?$'
      request_match: '^@0\?Sh([0-9]{2})$'
      state: { "record_timers.{7}.kind": date, "record_timers.{7}.date": "{1}", "record_timers.{7}.start": "{2:02d}:{3:02d}",
        "record_timers.{7}.duration": "{4:02d}:{5:02d}", "record_timers.{7}.user_area": "{6}" }
    - match: '^@0TPDW([SMTWF_]{7})([0-9]{2})([0-9]{2})([^\r]*)\r?$'
      request_match: '^@0\?TP([0-9]{2})$'
      state: { "play_timers.{5}.kind": weekly, "play_timers.{5}.days": "{1}", "play_timers.{5}.start": "{2:02d}:{3:02d}",
        "play_timers.{5}.file": "{4}" }
    - match: '^@0TPDW([SMTWF_]{7})\*\*([0-9]{2})([^\r]*)\r?$'
      request_match: '^@0\?TP([0-9]{2})$'
      state: { "play_timers.{4}.kind": weekly, "play_timers.{4}.days": "{1}", "play_timers.{4}.start": "**:{2:02d}",
        "play_timers.{4}.file": "{3}" }
    - match: '^@0TPDT([0-9*]{6})([0-9]{2})([0-9]{2})([^\r]*)\r?$'
      request_match: '^@0\?TP([0-9]{2})$'
      state: { "play_timers.{5}.kind": date, "play_timers.{5}.date": "{1}", "play_timers.{5}.start": "{2:02d}:{3:02d}",
        "play_timers.{5}.file": "{4}" }
    - match: '^@0Ct(RE|PL) ?([0-9]{2})\r?$'
      state: { timers.current.kind: { value: "{1}", map: &timer_kind { RE: record, PL: play } }, timers.current.number: "{2}" }
    - match: '^@0Rt(RE|PL) ?([0-9]{2})\r?$'
      state: { timers.reserved.kind: { value: "{1}", map: *timer_kind }, timers.reserved.number: "{2}" }
    # A new track (the push is shown as "@Tr NNNN"): its titles, format and marks are read.
    - match: '^@0?Tr ?([0-9]{4})\r?$'
      state: { track.number: "{1}" }
      then_send: ["@0?T1", "@0?T2", "@0?T3", "@0?af", "@0?fs", "@0?ch", "@0?tl", "@0?Tm"]
    - match: '^@0Tt ?([0-9]{4})\r?$'
      state: { tracks.total: "{1}" }
    - match: '^@0Tf ?([0-9]{4})\r?$'
      state: { folders.total: "{1}" }
    - match: '^@0(?:ti|T1)([^\r]*)\r?$'
      state: { track.title: "{1}" }
    - match: '^@0(?:at|T2)([^\r]*)\r?$'
      state: { track.artist: "{1}" }
    - match: '^@0(?:al|T3)([^\r]*)\r?$'
      state: { track.album: "{1}" }
    - match: '^@0tn([^\r]*)\r?$'
      request_match: '^@0\?tn([0-9]{4})$'
      state: { "tracks.{2}.title": "{1}" }
    - match: '^@0ts([0-9]{6})\r?$'
      request_match: '^@0\?ts([0-9]{4})$'
      state: { "tracks.{2}.size_kb": "{1}" }
    - match: '^@0af(PM|WV|AL) ?([0-9]{2})\r?$'
      state: { track.format: { value: "{1}", map: { PM: pcm, WV: wav, AL: aiff } }, track.bits: "{2}" }
    - match: '^@0af(M3|AC) ?([0-9]{3})\r?$'
      state: { track.format: { value: "{1}", map: { M3: mp3, AC: aac } }, track.kbps: "{2}" }
    - match: '^@0fs([0-9]{2})\r?$'
      state: { track.sample_rate: "{1}" }
    - match: '^@0ch(ST|MO)\r?$'
      state: { track.channels: { value: "{1}", map: { ST: stereo, MO: mono } } }
    - match: '^@0tl([0-9]{3})([0-9]{2})([0-9]{2})\r?$'
      state: { track.length: "{1:03d}:{2:02d}:{3:02d}" }
    - match: '^@0ET([0-9]{3})([0-9]{2})([0-9]{2})\r?$'
      state: { time.elapsed: "{1}:{2:02d}:{3:02d}" }
    - match: '^@0RM([0-9]{3})([0-9]{2})([0-9]{2})\r?$'
      state: { time.remaining: "{1}:{2:02d}:{3:02d}" }
    - match: '^@0SF([^\r]*)\r?$'
      state: { folder.name: "{1}" }
    - match: '^@0Fn([^\r]*)\r?$'
      request_match: '^@0\?Fn([0-9]{4})$'
      state: { "folders.{2}.name": "{1}" }
    - match: '^@0UL(0[01])\r?$'
      state: { file_list_changed: { value: "{1}", map: { "00": false, "01": true } } }
    - match: '^@0HP([0-9]{2})\r?$'
      state: { hot_start.current: "{1}" }
    - match: '^@0Hs([0-9]{2})([^\r]*):([0-9]{3})([0-9]{2})([0-9]{2})([0-9]{3})\r?$'
      state: { "hot_starts.{1}.file": "{2}", "hot_starts.{1}.time": "{3}:{4:02d}:{5:02d}.{6:03d}" }
    - match: '^@0tP([0-9]{2})\r?$'
      state: { program_lists.total: "{1}" }
    - match: '^@0pl([^\r]*)\r?$'
      request_match: '^@0\?pl([0-9]{2})$'
      state: { "program_lists.{2}.name": "{1}" }
    # Pitch: ON or OF, then 0 (up) or 1 (down), then tens, ones and tenths of a percent.
    - match: '^@0PT(ON|OF)0([0-9]{2})([0-9])\r?$'
      state: { pitch.enabled: { value: "{1}", map: &onof { "ON": true, OF: false } }, pitch.percent: "{2}.{3}" }
    - match: '^@0PT(ON|OF)1([0-9]{2})([0-9])\r?$'
      state: { pitch.enabled: { value: "{1}", map: *onof }, pitch.percent: "-{2}.{3}" }
    - match: '^@0Tm([0-9]{2})\r?$'
      state: { marks.total: "{1}" }
    - match: '^@0Mt([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})\r?$'
      request_match: '^@0\?Mt([0-9]{2})$'
      state: { "marks.{5}.time": "{1:02d}:{2:02d}:{3:02d}:{4:02d}" }
    - match: '^@0LS([A-Z]{2})\r?$'
      state: { lock: { value: "{1}", map: { LK: locked, UL: unlocked, SL: semi_locked } } }
    - match: '^@0SB([0-9]{3})\r?$'
      state: { skip_back_tenths: "{1}" }
    - match: '^@0Dt([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})\r?$'
      state: { clock.now: "20{1:02d}-{2:02d}-{3:02d}T{4:02d}:{5:02d}" }
