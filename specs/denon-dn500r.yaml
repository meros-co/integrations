spec: 1
id: denon-dn500r
name: Denon Professional DN-500R SD/USB recorder (RS-232C)
vendor: Denon Professional
category: recorder

# The DN-500R's serial command protocol (D&M RC format) on its RS-232C port: every message is "@0" (the start
# character and ID), a command, then CR. The recorder answers each command with the ACK byte (06H), or NACK (15H)
# when it cannot take it; a status request is answered ACK and then the status ("@0?ST" is answered "@0STPL"). It
# sends status information by itself when its status, the track, the folder or the media change, and expects the
# host to answer it with ACK. The recorder has no network control.
source:
  - title: "Denon Professional DN-500R Serial Command Protocol Guide, Manual Version 1.1"
    author: inMusic Brands, Inc.
    url: "https://cdn.inmusicbrands.com/DenonPro/cdn/1110/documents/DN-500R%20-%20Serial%20Command%20Protocol%20Guide%20-%20v1.1.pdf"
    note: >
      Manufacturer document (retrieved 2026-10-27). Code structure "@0", command, CR (p.5); the transmission rules:
      an answer within 300 ms, ACK (06H) on success and with the status for a request, NACK (15H) otherwise, the next
      command only after ACK or NACK (BUSY "@0BDERBUSY" otherwise), at most 5 ms between characters, one second
      after power on, automatic statuses answered ACK by the host and sent once more without it (p.5); the control
      commands (pp.6-20), status requests and answers (pp.21-35), automatic status information (pp.36-37), the
      acceptable characters and absolute paths (p.38), RS-232C at 9600 or 38400 bit/s, 8N1, no flow control (p.39).
  - title: "Denon Professional DN-500R Owner's Manual"
    author: D&M Holdings Inc.
    url: https://cdn.inmusicbrands.com/DenonPro/cdn/1110/documents/DN-500REM_ENG_manual.pdf
    note: >
      Manufacturer document. Serial Bit Rate 9600 or 38400 in the System Setting menu (38400 for the RC-F400S
      remote); the D&M RC communication format, a response timeout of 100 ms and the next command allowed after
      it (pp.56-58); the machine name of up to 12 characters.
  - title: "bitfocus/companion-module-denon-recorder (MIT)"
    author: John A Knight Jr and contributors
    url: https://github.com/bitfocus/companion-module-denon-recorder
    note: "Corroboration only, not copied: the DN-500R is an RS-232-only model among the Denon recorders it controls."

transport:
  type: line-serial
  framing: terminated
  terminator: cr
  encoding: utf-8
  timeout_ms: 1000
  reply: expected
  # The recorder's messages: the ACK or NACK byte alone, and statuses from "@" to CR.
  reply_framing: terminated
  reply_terminators: ["\r", "\u0006", "\u0015"]
  reply_match: '^(\x06|\x15|@0)'
  error_match: '^(\x15|@0BDERBUSY)'
  probe: "@0?PW"
  # One second after power on before the next command (p.5).
  pacing:
    groups:
      power_on:
        match: "^@023PW$"
        after_ms: 1000

settings:
  serial_port: { type: string, required: true, max_length: 256, label: Serial port,
    description: "The host's serial port wired to the RS-232C connector: COM3 on Windows, /dev/ttyUSB0 on Linux, /dev/cu.usbserial-1420 on macOS." }
  baud_rate: { type: enum, values: ["9600", "38400"], default: "9600", label: Baud rate,
    description: "The RS-232C speed in bits per second, as set by Serial Bit Rate in the System Setting menu: 9600 or 38400." }
  data_bits: { type: int, min: 8, max: 8, default: 8, label: Data bits, description: "Bits per character; the recorder uses 8." }
  parity: { type: enum, values: [none], default: none, label: Parity, description: "The recorder uses no parity." }
  stop_bits: { type: int, min: 1, max: 1, default: 1, label: Stop bits, description: "The recorder uses 1 stop bit." }
  flow_control: { type: enum, values: [none], default: none, label: Flow control, description: "The recorder uses no flow control." }

ports:
  - { port: null, protocol: serial, role: control, setting: serial_port, note: "RS-232C, D-sub 9-pin male; pin 7 can supply 4 V, 500 mA" }

