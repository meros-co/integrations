    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/cuenext" }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  play_next_block:
    summary: "Play the next block (<playnextblock|CHANNEL>)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/playnextblock" }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  cue_next_block:
    summary: "Cue the next block (<cuenextblock|CHANNEL>)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/cuenextblock" }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  mute_channel:
    summary: "Mute a channel's audio (<mutechannel|CHANNEL>)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/mute" }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  unmute_channel:
    summary: "Unmute a channel's audio (<unmutechannel|CHANNEL>)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/unmute" }
    expect: { status: 200, json_equals: { "$.ok": true } }
