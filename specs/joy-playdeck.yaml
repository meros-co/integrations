    returns: ack
  fade_in_uid:
    summary: "Fade in a block or clip by its unique ID (POST .../fadein, uid)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      uid: {"type": "int", "required": true, "label": "Unique ID", "description": "The block's or clip's unique ID (UID), as the project lists it."}
    send: { method: POST, path: "/api/v1/channels/{channel}/fadein", content_type: application/json, body: '{"uid":{uid}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  fade_in_flex:
    summary: "Fade in what a flex pattern names (POST .../fadein, pattern)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      pattern: {"type": "string", "required": true, "max_length": 1024, "label": "Pattern", "description": "A flex pattern from PLAYDECK's command list, such as c:intro or b#5 c:name p:0:05:00."}
    send: { method: POST, path: "/api/v1/channels/{channel}/fadein", content_type: application/json, body: '{"pattern":{pattern:json}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  fade_in_list:
    summary: "Fade in a clip from the left or right playlist (POST .../fadein, list, block and clip)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      list: {"type": "enum", "values": ["1", "2"], "required": true, "label": "Playlist side", "description": "1 the left playlist, 2 the right one."}
      block: {"type": "int", "min": 1, "required": true, "label": "Block", "description": "Block number as the playlist shows it, from 1."}
      clip: {"type": "int", "min": 1, "required": true, "label": "Clip", "description": "Clip number within the block, from 1."}
    send: { method: POST, path: "/api/v1/channels/{channel}/fadein", content_type: application/json, body: '{"list":{list},"block":{block},"clip":{clip}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  toggle_pause:
    summary: "Pause playout, or resume it when paused (<pause|CHANNEL>)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/pause" }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  hold:
    summary: "Hold: pause playout, without toggling (<hold|CHANNEL>)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/hold" }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  resume:
