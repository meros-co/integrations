quirks:
  - models: [all]
    severity: info
    text: >
      The REST API is served on 11411 while PLAYDECK runs, beside the Web
      Remote; it asks for no key or token on the LAN in the current version.
      Indices (channel, block, clip, overlay, action, stream, recording,
      input) count from 1, as in PLAYDECK's command language.
  - models: [all]
    severity: warning
    text: >
      State is read by polling GET /api/v1/status every second. PLAYDECK also
      pushes the same JSON about every 250 ms on a WebSocket on the same
      port, as text frames status|<json>, and its playout events as event|;
      that prefixed framing is not JSON, which the spec format's rules read,
      so the push is not used and events are not reported.
  - models: [all]
    severity: info
    text: >
      The project (blocks, clips, overlay and action buttons) is read once on
      connecting: PLAYDECK's API asks clients not to poll it on a timer.
      project.hash changes whenever the playlist does; get_project then reads
      it again into state. Blocks and clips are keyed by their place in the
      playlist from 1, which the cue, play and select commands take.
  - models: [all]
    severity: warning
    text: >
      GET /api/v1/project/file (the project as PDZ1 plus zlib, or plain XML on
      older builds) is binary and is not offered: the spec format reads JSON
      and text replies only.
  - models: [all]
    severity: info
    text: >
      Overlay and action button states appear in the status only while the
      button is active (OverlayActiveN, ActionActiveN); the contract does not
      give their value, which is kept as it arrives. pause toggles; hold
      pauses without toggling.
  - models: [all]
    severity: info
    text: >
      The whole pipe-command language (wait, variables, chains, flex patterns,
      playlist editing, loadproject and the rest) is reachable through
      run_commands and run_named_command. Its list ships with PLAYDECK (Main
      Menu > Documentation) and is not published, so those commands are not
      broken out here. The legacy TCP Commands In (11375) and the AMP Video
      Server (3811) are other ways in, not offered here.
  - models: [all]
    severity: critical
    text: >
      play, play_next, play_next_block, stop, fade_out and the stream and
      recording commands change program output or a recording at once;
      run_commands can load another project.
