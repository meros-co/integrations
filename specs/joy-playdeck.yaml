spec: 1
id: joy-playdeck
name: PLAYDECK (REST API)
vendor: JOY event & media
category: playback

# PLAYDECK's HTTP REST API v1 on port 11411 (the Web Remote's port): GET
# /api/v1/status for the live playout snapshot, GET /api/v1/project for the
# playlist tree, and POST routes per channel and asset for control, plus the
# escape hatch POST /api/v1/commands for the whole pipe-command language
# (<play|1|1|1>). Indices are 1-based throughout, as in the command language.
# No authentication on the LAN in the current version.

source:
  - title: PLAYDECK Control API, OpenAPI 3 document (openapi-v1.yaml), version 1.0.0
    author: JOY event & media GmbH & Co. KG
    url: https://downloads.playdeck.tv/assets/openapi-v1.yaml
    note: >
      Manufacturer contract, licence "Proprietary" (facts only, nothing
      quoted), retrieved 2026-10-23. Every path and schema used here:
      /api/v1/health, status, project, project/file, channels,
      channels/{id}; cue, play and fadein with a PlayoutTarget body (block,
      clip, uid, pattern, list; omitted fields use the current selection);
      pause (toggle), hold, resume, stop, fadeout, playnext, cuenext,
      playnextblock, cuenextblock; position (timestamp HH:MM:SS:FF, SS:FF or
      SS, negative from the end, or marker); select (block, clip, uid); mute
      and unmute; desktop start/stop; overlays and actions start, stop,
      toggle and stopall; streams 1-15, recordings 1-4, inputs 1-12; POST
      /api/v1/commands with raw or name + args; ActionResponse {ok, command};
      StatusRoot (Project, Channel[], DirectorView[], ObjectState), the
      dynamic OverlayActiveN and ActionActiveN keys; ProjectRoot (Channel[]
      with Block[], Clip[], Overlays[], Actions[]); the design notes (status
      every ~250 ms on the WebSocket, project re-sent when ProjectHash
      changes, do not poll the project on a timer).
  - title: PLAYDECK API (manual article)
    author: JOY event & media GmbH & Co. KG
    url: https://playdeck.tv/playdeck-api/
    note: >
      Manufacturer article dated 2025-10-26, retrieved 2026-10-23: REST API on
      11411 (Settings > Network > Developer API), the WebSocket channel on the
      same port, the legacy TCP Commands In on 11375 with the same pipe
      syntax, no API key or token on the LAN in the current version, and the
      full command list shipped with the application (Main Menu >
      Documentation).
  - title: Using Commands for Playout Control (manual article)
    author: JOY event & media GmbH & Co. KG
    url: https://playdeck.tv/using-commands-for-playout-control/
    note: >
      Manufacturer article dated 2025-05-16: commands chained in one line run
      in order, <wait|ms> between them (example <cue|1|1><cue|2|1><wait|1000>
      <play|1|1><play|2|1>).

transport:
  type: http
  port: 11411
  scheme: http
  auth: none
  timeout_ms: 4000
  probe: { method: GET, path: /api/v1/health }

ports:
  - { port: 11411, protocol: http, role: control, note: "PLAYDECK's REST API and Web Remote (Settings > Network > Developer API)" }

models:
  - id: playdeck
    name: PLAYDECK (REST API v1)
    supports:
      [get_health, get_status, get_project, get_channels, get_channel, cue, cue_block, cue_clip,
       cue_uid, cue_flex, cue_list, play, play_block, play_clip, play_uid, play_flex, play_list,
       fade_in, fade_in_block, fade_in_clip, fade_in_uid, fade_in_flex, fade_in_list, toggle_pause,
       hold, resume, stop, fade_out, play_next, cue_next, play_next_block, cue_next_block,
       mute_channel, unmute_channel, start_desktop, stop_desktop, stop_all_overlays,
       stop_all_actions, seek, seek_marker, select_block, select_clip, select_uid, start_overlay,
       stop_overlay, toggle_overlay, start_action, stop_action, start_stream, stop_stream,
       start_recording, stop_recording, mute_input, unmute_input, run_commands, run_named_command]
    verification: none

commands:
  get_health:
    summary: "Check the API is reachable and read its and PLAYDECK's versions (GET /api/v1/health)"
    send: { method: GET, path: /api/v1/health }
    expect: { status: 200, json_path: "$" }
    returns: value
  get_status:
    summary: "Read the live playout snapshot, as state is kept (GET /api/v1/status)"
    send: { method: GET, path: /api/v1/status }
    expect: { status: 200, json_path: "$" }
    returns: value
  get_project:
    summary: "Read the project and playlist tree, and refresh it in state (GET /api/v1/project)"
    send: { method: GET, path: /api/v1/project }
    expect: { status: 200, json_path: "$" }
    returns: value
  get_channels:
    summary: "Read every channel's status, with its 1-based id (GET /api/v1/channels)"
    send: { method: GET, path: /api/v1/channels }
    expect: { status: 200, json_path: "$" }
    returns: value
  get_channel:
    summary: "Read one channel's status (GET /api/v1/channels/{id})"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: GET, path: "/api/v1/channels/{channel}" }
    expect: { status: 200, json_path: "$" }
    returns: value
  cue:
    summary: "Cue the selected or cued clip on a channel (POST .../cue, empty target)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/cue", content_type: application/json, body: '{}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  cue_block:
    summary: "Cue a block on a channel (POST .../cue, block)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      block: {"type": "int", "min": 1, "required": true, "label": "Block", "description": "Block number as the playlist shows it, from 1."}
    send: { method: POST, path: "/api/v1/channels/{channel}/cue", content_type: application/json, body: '{"block":{block}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  cue_clip:
    summary: "Cue a clip of a block on a channel (POST .../cue, block and clip)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      block: {"type": "int", "min": 1, "required": true, "label": "Block", "description": "Block number as the playlist shows it, from 1."}
      clip: {"type": "int", "min": 1, "required": true, "label": "Clip", "description": "Clip number within the block, from 1."}
    send: { method: POST, path: "/api/v1/channels/{channel}/cue", content_type: application/json, body: '{"block":{block},"clip":{clip}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  cue_uid:
    summary: "Cue a block or clip by its unique ID (POST .../cue, uid)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      uid: {"type": "int", "required": true, "label": "Unique ID", "description": "The block's or clip's unique ID (UID), as the project lists it."}
    send: { method: POST, path: "/api/v1/channels/{channel}/cue", content_type: application/json, body: '{"uid":{uid}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  cue_flex:
    summary: "Cue what a flex pattern names (POST .../cue, pattern)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      pattern: {"type": "string", "required": true, "max_length": 1024, "label": "Pattern", "description": "A flex pattern from PLAYDECK's command list, such as c:intro or b#5 c:name p:0:05:00."}
    send: { method: POST, path: "/api/v1/channels/{channel}/cue", content_type: application/json, body: '{"pattern":{pattern:json}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  cue_list:
    summary: "Cue a clip from the left or right playlist (POST .../cue, list, block and clip)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      list: {"type": "enum", "values": ["1", "2"], "required": true, "label": "Playlist side", "description": "1 the left playlist, 2 the right one."}
      block: {"type": "int", "min": 1, "required": true, "label": "Block", "description": "Block number as the playlist shows it, from 1."}
      clip: {"type": "int", "min": 1, "required": true, "label": "Clip", "description": "Clip number within the block, from 1."}
    send: { method: POST, path: "/api/v1/channels/{channel}/cue", content_type: application/json, body: '{"list":{list},"block":{block},"clip":{clip}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  play:
    summary: "Play the selected or cued clip on a channel (POST .../play, empty target)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/play", content_type: application/json, body: '{}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  play_block:
    summary: "Play a block on a channel (POST .../play, block)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      block: {"type": "int", "min": 1, "required": true, "label": "Block", "description": "Block number as the playlist shows it, from 1."}
    send: { method: POST, path: "/api/v1/channels/{channel}/play", content_type: application/json, body: '{"block":{block}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  play_clip:
    summary: "Play a clip of a block on a channel (POST .../play, block and clip)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      block: {"type": "int", "min": 1, "required": true, "label": "Block", "description": "Block number as the playlist shows it, from 1."}
      clip: {"type": "int", "min": 1, "required": true, "label": "Clip", "description": "Clip number within the block, from 1."}
    send: { method: POST, path: "/api/v1/channels/{channel}/play", content_type: application/json, body: '{"block":{block},"clip":{clip}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  play_uid:
    summary: "Play a block or clip by its unique ID (POST .../play, uid)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      uid: {"type": "int", "required": true, "label": "Unique ID", "description": "The block's or clip's unique ID (UID), as the project lists it."}
    send: { method: POST, path: "/api/v1/channels/{channel}/play", content_type: application/json, body: '{"uid":{uid}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  play_flex:
    summary: "Play what a flex pattern names (POST .../play, pattern)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      pattern: {"type": "string", "required": true, "max_length": 1024, "label": "Pattern", "description": "A flex pattern from PLAYDECK's command list, such as c:intro or b#5 c:name p:0:05:00."}
    send: { method: POST, path: "/api/v1/channels/{channel}/play", content_type: application/json, body: '{"pattern":{pattern:json}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  play_list:
    summary: "Play a clip from the left or right playlist (POST .../play, list, block and clip)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      list: {"type": "enum", "values": ["1", "2"], "required": true, "label": "Playlist side", "description": "1 the left playlist, 2 the right one."}
      block: {"type": "int", "min": 1, "required": true, "label": "Block", "description": "Block number as the playlist shows it, from 1."}
      clip: {"type": "int", "min": 1, "required": true, "label": "Clip", "description": "Clip number within the block, from 1."}
    send: { method: POST, path: "/api/v1/channels/{channel}/play", content_type: application/json, body: '{"list":{list},"block":{block},"clip":{clip}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  fade_in:
    summary: "Fade in the selected or cued clip on a channel (POST .../fadein, empty target)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/fadein", content_type: application/json, body: '{}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  fade_in_block:
    summary: "Fade in a block on a channel (POST .../fadein, block)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      block: {"type": "int", "min": 1, "required": true, "label": "Block", "description": "Block number as the playlist shows it, from 1."}
    send: { method: POST, path: "/api/v1/channels/{channel}/fadein", content_type: application/json, body: '{"block":{block}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  fade_in_clip:
    summary: "Fade in a clip of a block on a channel (POST .../fadein, block and clip)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      block: {"type": "int", "min": 1, "required": true, "label": "Block", "description": "Block number as the playlist shows it, from 1."}
      clip: {"type": "int", "min": 1, "required": true, "label": "Clip", "description": "Clip number within the block, from 1."}
    send: { method: POST, path: "/api/v1/channels/{channel}/fadein", content_type: application/json, body: '{"block":{block},"clip":{clip}}' }
