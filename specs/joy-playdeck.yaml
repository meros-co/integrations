  channels.*.blocks.*.clips.*.loop_clock: { type: int, description: "Project: the clip's LoopClock as PLAYDECK gives it, keyed by the clip's place in its block from 1" }
  channels.*.blocks.*.clips.*.loop_partial: { type: bool, description: "Project: the clip's LoopPartial as PLAYDECK gives it, keyed by the clip's place in its block from 1" }
  channels.*.blocks.*.clips.*.video_track: { type: int, description: "Project: the clip's VideoTrack as PLAYDECK gives it, keyed by the clip's place in its block from 1" }
  channels.*.blocks.*.clips.*.audio_track: { type: int, description: "Project: the clip's AudioTrack as PLAYDECK gives it, keyed by the clip's place in its block from 1" }
  channels.*.blocks.*.clips.*.subtitle_track: { type: int, description: "Project: the clip's SubtitleTrack as PLAYDECK gives it, keyed by the clip's place in its block from 1" }
  channels.*.blocks.*.clips.*.subtitle_offset: { type: float, description: "Project: the clip's SubtitleOffset as PLAYDECK gives it, keyed by the clip's place in its block from 1" }
  channels.*.overlays.*.name: { type: string, description: "Project: an overlay button's button name, keyed from 1" }
  channels.*.overlays.*.has_content: { type: bool, description: "Project: an overlay button's whether the button has content, keyed from 1" }
  channels.*.overlays.*.is_group: { type: bool, description: "Project: an overlay button's whether it is a group, keyed from 1" }
  channels.*.overlays.*.type: { type: int, description: "Project: an overlay button's overlay type, as PLAYDECK numbers it, keyed from 1" }
  channels.*.actions.*.name: { type: string, description: "Project: an action button's button name, keyed from 1" }
  channels.*.actions.*.has_content: { type: bool, description: "Project: an action button's whether the button has content, keyed from 1" }

telemetry:
  # The status every second (PLAYDECK pushes it every ~250 ms on its
  # WebSocket as status|<json>, a framing the rules cannot read); the project
  # once on connecting: the vendor asks not to poll it on a timer, so
  # get_project reads it again when project.hash changes.
  poll:
    - every_ms: 1000
      send: [{ method: GET, path: /api/v1/status }]
    - send: [{ method: GET, path: /api/v1/project }]
  updates:
    - path: "^/api/v1/status$"
      json:
        name: "$.Project.ProjectName"
        filename: "$.Project.ProjectFilename"
        clock: "$.Project.ClockTime"
        ts: "$.Project.Timestamp"
        unix: "$.Project.TimestampUnix"
        hash: "$.Project.ProjectHash"
        edition: "$.Project.LicenseEdition"
        customer: "$.Project.LicenseCustomer"
        lease: "$.Project.LicenseLease"
      state:
        project.name: "{name}"
        project.filename: "{filename}"
        project.clock_time: "{clock}"
        project.timestamp: "{ts}"
        project.timestamp_unix: "{unix}"
        project.hash: "{hash}"
        project.license_edition: "{edition}"
        project.license_customer: "{customer}"
        project.license_lease: "{lease}"
