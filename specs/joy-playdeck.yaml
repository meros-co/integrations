  stop_all_overlays:
    summary: "Stop every overlay on a channel (<stopalloverlays|CHANNEL>)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/overlays/stopall" }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  stop_all_actions:
    summary: "Stop every action on a channel (<stopallactions|CHANNEL>)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/actions/stopall" }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  seek:
    summary: "Move the playhead to a time (<position|CHANNEL|TIMESTAMP>)"
    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
      timestamp: {"type": "string", "required": true, "max_length": 32, "pattern": "^-?[0-9]+(:[0-9]+){0,3}$", "label": "Position", "description": "HH:MM:SS:FF, or shortened SS:FF or SS; a negative value counts back from the end."}
    send: { method: POST, path: "/api/v1/channels/{channel}/position", content_type: application/json, body: '{"timestamp":{timestamp:json}}' }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  seek_marker:
    summary: "Move the playhead to a marker (<positionmarker|CHANNEL|MARKER>)"
