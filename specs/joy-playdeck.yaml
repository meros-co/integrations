    params:
      channel: {"type": "int", "min": 1, "max": 8, "required": true, "label": "Channel", "description": "Playout channel, from 1 (up to 8 depending on the licence)."}
    send: { method: POST, path: "/api/v1/channels/{channel}/resume" }
    expect: { status: 200, json_equals: { "$.ok": true } }
    returns: ack
  stop:
