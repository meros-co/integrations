        "amps.{76:upper}.channels.B.temperature_warning": { value: "{21}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.C.attenuation": "{22}"
        "amps.{76:upper}.channels.C.vpl": { value: "{23}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.C.cpl": { value: "{24}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.C.vhf_fault": { value: "{25}", map: { "0": false, "1": true } }
