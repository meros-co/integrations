spec: 1
id: labgruppen-nlb60e
name: Lab.gruppen NomadLink amplifiers through the NLB 60E bridge (C Series, FP+, IPD)
vendor: Lab.gruppen
category: other

source:
  - title: "Lab.gruppen NLB 60E Third Party Integration, Protocol Description, Revision 2B, 2009-07-02"
    author: Lab.gruppen AB
    url: "https://www.eviaudio.fr/wp-content/uploads/2020/04/NLB-60E-Communication-and-Third-Party-Control-Protocol-Ver-2B.pdf"
    note: >
      Mirrored by a distributor. Connection management (2: TCP 65010, one third-party client at a time, a new
      connection drops the old one, refused while DeviceControl is connected; messages handled in order),
      addressing (3: amplifiers by virtual device name, up to 60, 1-10 characters A-Z, 0-9, @ and -), the message
      layout (4: Context.Parameter followed by = value or ?, case insensitive, CR+LF, a set answered as a get,
      several values separated by spaces), error replies (5.1), subnet messages (5.2: Power, Mute, StatusOk,
      Status, SerialAtPos1-60), device messages (5.3: Power, MuteA-H, MuteStatus, Status) and VDN management
      (5.4: Subnet.VDN1-60).

transport:
  type: line-tcp
  port: 65010
  framing: terminated
  terminator: crlf
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  error_match: "^ERROR!"
  probe: "Subnet.StatusOk ?"

ports:
  - { port: 65010, protocol: tcp, role: control }

models:
  - id: nlb-60e
    name: Lab.gruppen NLB 60E NomadLink bridge, with its C Series, FP+ and IPD amplifiers
    supports:
      [set_subnet_power, get_subnet_power, set_subnet_mute, get_subnet_mute, get_subnet_status_ok, get_subnet_status,
      get_serial_at_position, set_power, get_power, set_mute, get_mute, get_mute_status, get_status, set_vdn,
      clear_vdn, get_vdn]
    verification: none
    notes: >
      Requires NLB 60E firmware 2.1.0 or later. One bridge serves one NomadLink subnet of up to 60 amplifiers,
      each addressed by the virtual device name given it in the VDN table.

commands:
  set_subnet_power:
    summary: "Switch every amplifier in the subnet on or off, in sequence (Subnet.Power =); answers the subnet power state"
    params:
      powered: { type: bool, required: true, label: Power, description: "On switches every amplifier on, off switches them all off." }
    send: "Subnet.Power = {powered:bool01}"
    expect:
      matches: "^([0-3])$"
    returns: value
  get_subnet_power:
    summary: "Read the subnet's power state (Subnet.Power ?): 0 all off, 1 all on, 2 mixed, 3 in transition"
    send: "Subnet.Power ?"
    expect:
      matches: "^([0-3])$"
    returns: value
  set_subnet_mute:
    summary: "Mute or unmute every amplifier in the subnet (Subnet.Mute =)"
    params:
      muted: { type: bool, required: true, label: Mute, description: "On mutes the whole subnet, off unmutes it." }
    send: "Subnet.Mute = {muted:bool01}"
    expect:
      matches: "^([01])$"
    returns: value
  get_subnet_mute:
    summary: "Read the subnet mute (Subnet.Mute ?): 1 muted, 0 unmuted"
    send: "Subnet.Mute ?"
    expect:
      matches: "^([01])$"
    returns: value
  get_subnet_status_ok:
    summary: "Read whether the subnet is free of faults (Subnet.StatusOk ?): 1 no faults, 0 faults"
    send: "Subnet.StatusOk ?"
    expect:
      matches: "^([01])$"
    returns: value
  get_subnet_status:
    summary: >
      Read the subnet's full status (Subnet.Status ?): subnet number, amplifiers connected, mute, closed loop, GPI 1-3,
      power state, faults present, then the names of the amplifiers with faults
    send: "Subnet.Status ?"
    expect:
      matches: "^(\\d+ \\d+ [01] [01] [01] [01] [01] [0-3] [01].*)$"
    returns: value
  get_serial_at_position:
    summary: "Read the serial number of the amplifier at a position of the subnet (Subnet.SerialAtPos<n> ?); 0 when none"
    params:
      position: { type: int, min: 1, max: 60, required: true, label: Position,
                  description: "Position in the NomadLink subnet topology, 1 to 60." }
    send: "Subnet.SerialAtPos{position} ?"
    expect:
      matches: "^(\\d+)$"
    returns: value
  set_power:
    summary: "Set an amplifier's desired power state (<VDN>.Power =)"
    params:
      vdn: &vdn { type: string, required: true, max_length: 10, pattern: "^[A-Za-z0-9@.-]{1,10}$", label: Amplifier,
                  description: "The amplifier's virtual device name in the bridge's VDN table, up to 10 of A-Z, 0-9, @ and -." }
      powered: { type: bool, required: true, label: Power, description: "On switches the amplifier on, off switches it off." }
    send: "{vdn}.Power = {powered:bool01}"
    expect:
      matches: "^([01])$"
    returns: value
  get_power:
    summary: "Read an amplifier's desired power state (<VDN>.Power ?): 1 on, 0 off"
    params:
      vdn: *vdn
    send: "{vdn}.Power ?"
    expect:
      matches: "^([01])$"
    returns: value
  set_mute:
    summary: "Mute or unmute an amplifier output channel (<VDN>.Mute<A-H> =)"
    params:
      vdn: *vdn
      channel: &channel { type: enum, values: [A, B, C, D, E, F, G, H], required: true, label: Channel,
                          description: "Amplifier output channel, A to H as the amplifier has them." }
      muted: { type: bool, required: true, label: Mute, description: "On mutes the channel, off unmutes it." }
    send: "{vdn}.Mute{channel} = {muted:bool01}"
    expect:
      matches: "^([01])$"
    returns: value
  get_mute:
    summary: "Read an amplifier output channel's mute (<VDN>.Mute<A-H> ?): 1 muted, 0 unmuted"
    params:
      vdn: *vdn
      channel: *channel
    send: "{vdn}.Mute{channel} ?"
    expect:
      matches: "^([01])$"
    returns: value
  get_mute_status:
    summary: "Read every output channel's mute of an amplifier (<VDN>.MuteStatus ?): one digit per channel from A, 1 muted"
    params:
      vdn: *vdn
    send: "{vdn}.MuteStatus ?"
    expect:
      matches: "^([01]+)$"
    returns: value
  get_status:
    summary: >
      Read an amplifier's status and meters (<VDN>.Status ?): fault present, power state (0 as desired, 1 on but
      should be off, 2 off but should be on), PAL, then per channel from A its attenuation (-100 silent, -44, -29 to 0
      at VPL clip), VPL, CPL, VHF fault, DC fault, load shorted, temperature fault, high impedance warning and
      temperature warning
    params:
      vdn: *vdn
    send: "{vdn}.Status ?"
    expect:
      matches: "^([01] [0-2] [01](?: -?\\d+(?: [01]){8})+)$"
    returns: value
  set_vdn:
    summary: "Assign a virtual device name to an amplifier's serial number in a VDN table slot (Subnet.VDN<n> = <VDN> <SN>)"
    params:
      position: &vdn_position { type: int, min: 1, max: 60, required: true, label: Slot,
                                description: "VDN table slot, 1 to 60." }
      vdn: *vdn
      serial: { type: string, required: true, max_length: 16, pattern: "^[0-9]{1,16}$", label: Serial number,
                description: "The amplifier's serial number, as Subnet.SerialAtPos reports it." }
    send: "Subnet.VDN{position} = {vdn} {serial}"
    expect:
      not_contains: "ERROR!"
    returns: text
  clear_vdn:
    summary: "Clear a VDN table slot (Subnet.VDN<n> = with nothing); answers ** for an empty slot"
    params:
      position: *vdn_position
    send: "Subnet.VDN{position} ="
    expect:
      not_contains: "ERROR!"
    returns: text
  get_vdn:
    summary: "Read a VDN table slot (Subnet.VDN<n> ?): the name and serial number, * for unassigned"
    params:
      position: *vdn_position
    send: "Subnet.VDN{position} ?"
    expect:
      not_contains: "ERROR!"
    returns: text

state:
  subnet.number:          { type: int, description: "Subnet number" }
  subnet.devices:         { type: int, description: "Amplifiers connected to the subnet" }
  subnet.mute:            { type: bool, description: "The subnet is muted" }
  subnet.closed_loop:     { type: bool, description: "The NomadLink subnet is a closed loop" }
  subnet.gpi1:            { type: bool, description: "GPI 1 is high" }
  subnet.gpi2:            { type: bool, description: "GPI 2 is high" }
  subnet.gpi3:            { type: bool, description: "GPI 3 is high" }
  subnet.power:           { type: int, description: "Subnet power: 0 all off, 1 all on, 2 mixed, 3 in transition" }
  subnet.faults:          { type: bool, description: "One or more amplifiers have faults" }
  subnet.faulty_devices:  { type: string, description: "Names of the amplifiers with faults, separated by spaces; empty when none" }
  subnet.status_ok:       { type: bool, description: "No amplifier has a fault (Subnet.StatusOk)" }
  vdn.*.name:             { type: string, description: "The virtual device name in VDN table slot 1-60; the slot is absent while empty" }
  vdn.*.serial:           { type: string, description: "The serial number of the amplifier the slot names" }
  amps.*.power:           { type: bool, description: "The amplifier's desired power state, keyed by its virtual device name in capitals (<VDN>.Power)" }
  amps.*.fault:           { type: bool, description: "The amplifier reports a fault (<VDN>.Status)" }
  amps.*.power_state:     { type: int, description: "Power as desired (0), on but should be off (1), or off but should be on (2)" }
  amps.*.pal:             { type: bool, description: "The power average limiter is active" }
  amps.*.channels.*.mute: { type: bool, description: "The output channel, A to H, is muted (<VDN>.Mute<X>, <VDN>.MuteStatus)" }
  amps.*.channels.*.attenuation: { type: int, unit: dB, description: "Output level below clip: -100 silent, -44, then -29 to 0 at VPL clip" }
  amps.*.channels.*.vpl:  { type: bool, description: "The voltage peak limiter is active" }
  amps.*.channels.*.cpl:  { type: bool, description: "The current peak limiter is active" }
  amps.*.channels.*.vhf_fault: { type: bool, description: "Very high frequency protection fault" }
  amps.*.channels.*.dc_fault: { type: bool, description: "DC protection fault" }
  amps.*.channels.*.load_shorted: { type: bool, description: "The load is shorted" }
  amps.*.channels.*.temperature_fault: { type: bool, description: "Temperature fault" }
  amps.*.channels.*.high_impedance: { type: bool, description: "High impedance warning (open load)" }
  amps.*.channels.*.temperature_warning: { type: bool, description: "Temperature warning" }

telemetry:
  # The subnet's status, and the VDN table, whose names have each amplifier
  # read in turn (then_send below): about 60 + 3 per amplifier queries.
  poll:
    send: ["Subnet.Status ?", "Subnet.VDN1 ?", "Subnet.VDN2 ?", "Subnet.VDN3 ?", "Subnet.VDN4 ?", "Subnet.VDN5 ?", "Subnet.VDN6 ?", "Subnet.VDN7 ?", "Subnet.VDN8 ?", "Subnet.VDN9 ?", "Subnet.VDN10 ?", "Subnet.VDN11 ?", "Subnet.VDN12 ?", "Subnet.VDN13 ?", "Subnet.VDN14 ?", "Subnet.VDN15 ?", "Subnet.VDN16 ?", "Subnet.VDN17 ?", "Subnet.VDN18 ?", "Subnet.VDN19 ?", "Subnet.VDN20 ?", "Subnet.VDN21 ?", "Subnet.VDN22 ?", "Subnet.VDN23 ?", "Subnet.VDN24 ?", "Subnet.VDN25 ?", "Subnet.VDN26 ?", "Subnet.VDN27 ?", "Subnet.VDN28 ?", "Subnet.VDN29 ?", "Subnet.VDN30 ?", "Subnet.VDN31 ?", "Subnet.VDN32 ?", "Subnet.VDN33 ?", "Subnet.VDN34 ?", "Subnet.VDN35 ?", "Subnet.VDN36 ?", "Subnet.VDN37 ?", "Subnet.VDN38 ?", "Subnet.VDN39 ?", "Subnet.VDN40 ?", "Subnet.VDN41 ?", "Subnet.VDN42 ?", "Subnet.VDN43 ?", "Subnet.VDN44 ?", "Subnet.VDN45 ?", "Subnet.VDN46 ?", "Subnet.VDN47 ?", "Subnet.VDN48 ?", "Subnet.VDN49 ?", "Subnet.VDN50 ?", "Subnet.VDN51 ?", "Subnet.VDN52 ?", "Subnet.VDN53 ?", "Subnet.VDN54 ?", "Subnet.VDN55 ?", "Subnet.VDN56 ?", "Subnet.VDN57 ?", "Subnet.VDN58 ?", "Subnet.VDN59 ?", "Subnet.VDN60 ?"]
    every_ms: 5000
  updates:
    - match: "^(\\d+) (\\d+) ([01]) ([01]) ([01]) ([01]) ([01]) ([0-3]) ([01]) ?(.*)$"
      request_match: '^(?i:Subnet\.Status) \?$'
      state:
        subnet.number: "{1}"
        subnet.devices: "{2}"
        subnet.mute: { value: "{3}", map: { "0": false, "1": true } }
        subnet.closed_loop: { value: "{4}", map: { "0": false, "1": true } }
        subnet.gpi1: { value: "{5}", map: { "0": false, "1": true } }
        subnet.gpi2: { value: "{6}", map: { "0": false, "1": true } }
        subnet.gpi3: { value: "{7}", map: { "0": false, "1": true } }
        subnet.power: "{8}"
        subnet.faults: { value: "{9}", map: { "0": false, "1": true } }
        subnet.faulty_devices: "{10}"
    # Replies tied to the message they answer (request_match): the bridge
    # answers with the value only, in the order asked (section 4).
    - match: "^([0-3])$"
      request_match: '^(?i:Subnet\.Power) (?:= [01]|\?)$'
      state: { subnet.power: "{1}" }
    - match: "^([01])$"
      request_match: '^(?i:Subnet\.Mute) (?:= [01]|\?)$'
      state: { subnet.mute: { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^([01])$"
      request_match: '^(?i:Subnet\.StatusOk) \?$'
      state: { subnet.status_ok: { value: "{1}", map: { "0": false, "1": true } } }
    # The VDN table (section 5.4): a name and serial number, or * for an
    # empty slot. Each amplifier named there is read in turn.
    - match: "^(\\S+) (\\d+)$"
      request_match: '^(?i:Subnet\.VDN)(\d+) (?:\?|=.*)$'
      state:
        vdn.{3}.name: "{1}"
        vdn.{3}.serial: "{2}"
      then_send: ["{1}.Status ?", "{1}.Power ?", "{1}.MuteStatus ?"]
    - match: "^\\*+$"
      request_match: '^(?i:Subnet\.VDN)(\d+) (?:\?|=.*)$'
      state: { "vdn.{1}": { delete: true } }
    # An amplifier, by the name asked (stored in capitals, as the bridge does).
    - match: "^([01])$"
      request_match: '^((?i:[a-z0-9@-]{1,5}|[a-z0-9@-]{7,10}|[a-rt-z0-9@-][a-z0-9@-]{5}|s[a-tv-z0-9@-][a-z0-9@-]{4}|su[ac-z0-9@-][a-z0-9@-]{3}|sub[a-mo-z0-9@-][a-z0-9@-]{2}|subn[a-df-z0-9@-][a-z0-9@-]|subne[a-su-z0-9@-]))\.(?i:Power) (?:= [01]|\?)$'
      state: { "amps.{2:upper}.power": { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^([01])$"
      request_match: '^((?i:[a-z0-9@-]{1,5}|[a-z0-9@-]{7,10}|[a-rt-z0-9@-][a-z0-9@-]{5}|s[a-tv-z0-9@-][a-z0-9@-]{4}|su[ac-z0-9@-][a-z0-9@-]{3}|sub[a-mo-z0-9@-][a-z0-9@-]{2}|subn[a-df-z0-9@-][a-z0-9@-]|subne[a-su-z0-9@-]))\.(?i:Mute)([A-Ha-h]) (?:= [01]|\?)$'
      state: { "amps.{2:upper}.channels.{3:upper}.mute": { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^([01])([01])?([01])?([01])?([01])?([01])?([01])?([01])?$"
      request_match: '^((?i:[a-z0-9@-]{1,5}|[a-z0-9@-]{7,10}|[a-rt-z0-9@-][a-z0-9@-]{5}|s[a-tv-z0-9@-][a-z0-9@-]{4}|su[ac-z0-9@-][a-z0-9@-]{3}|sub[a-mo-z0-9@-][a-z0-9@-]{2}|subn[a-df-z0-9@-][a-z0-9@-]|subne[a-su-z0-9@-]))\.(?i:MuteStatus) \?$'
      state:
        "amps.{9:upper}.channels.A.mute": { value: "{1}", map: { "0": false, "1": true } }
        "amps.{9:upper}.channels.B.mute": { value: "{2}", map: { "0": false, "1": true } }
        "amps.{9:upper}.channels.C.mute": { value: "{3}", map: { "0": false, "1": true } }
        "amps.{9:upper}.channels.D.mute": { value: "{4}", map: { "0": false, "1": true } }
        "amps.{9:upper}.channels.E.mute": { value: "{5}", map: { "0": false, "1": true } }
        "amps.{9:upper}.channels.F.mute": { value: "{6}", map: { "0": false, "1": true } }
        "amps.{9:upper}.channels.G.mute": { value: "{7}", map: { "0": false, "1": true } }
        "amps.{9:upper}.channels.H.mute": { value: "{8}", map: { "0": false, "1": true } }
    - match: '^([01]) ([0-2]) ([01])(?: (-?\d+) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]))?(?: (-?\d+) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]))?(?: (-?\d+) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]))?(?: (-?\d+) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]))?(?: (-?\d+) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]))?(?: (-?\d+) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]))?(?: (-?\d+) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]))?(?: (-?\d+) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]) ([01]))?$'
      request_match: '^((?i:[a-z0-9@-]{1,5}|[a-z0-9@-]{7,10}|[a-rt-z0-9@-][a-z0-9@-]{5}|s[a-tv-z0-9@-][a-z0-9@-]{4}|su[ac-z0-9@-][a-z0-9@-]{3}|sub[a-mo-z0-9@-][a-z0-9@-]{2}|subn[a-df-z0-9@-][a-z0-9@-]|subne[a-su-z0-9@-]))\.(?i:Status) \?$'
      state:
        "amps.{76:upper}.fault": { value: "{1}", map: { "0": false, "1": true } }
        "amps.{76:upper}.power_state": "{2}"
        "amps.{76:upper}.pal": { value: "{3}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.A.attenuation": "{4}"
        "amps.{76:upper}.channels.A.vpl": { value: "{5}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.A.cpl": { value: "{6}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.A.vhf_fault": { value: "{7}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.A.dc_fault": { value: "{8}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.A.load_shorted": { value: "{9}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.A.temperature_fault": { value: "{10}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.A.high_impedance": { value: "{11}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.A.temperature_warning": { value: "{12}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.B.attenuation": "{13}"
        "amps.{76:upper}.channels.B.vpl": { value: "{14}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.B.cpl": { value: "{15}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.B.vhf_fault": { value: "{16}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.B.dc_fault": { value: "{17}", map: { "0": false, "1": true } }
        "amps.{76:upper}.channels.B.load_shorted": { value: "{18}", map: { "0": false, "1": true } }
