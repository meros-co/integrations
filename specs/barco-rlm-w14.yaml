quirks:
  - models: [all]
    severity: critical
    text: >
      factory_reset returns every setting to factory defaults, reset_warp, reset_blanking, reset_scenergix and
      reset_plgc clear those adjustments, recall_lens_memory moves the lens and clear_lens_memory erases a memory,
      and reset_lamp_hours zeroes a lamp's run time; none can be undone from here. Setting control_port to network
      (obsolete) or turning on eco_network_power can stop the projector answering on this port or the network.
  - models: [all]
    severity: warning
    text: >
      Many commands answer NA in standby (note 1), without a locked signal (note 2), with picture mute on, with the
      PIP off, or for a source they do not apply to (notes 3-10, 13, 14, 19); a set or step answered NA fails, a
      read answered NA fails and leaves state as it was. The status, error code, sources, PIP, picture mute and
      lamps are read every 5 s, everything else every minute, identity and network once on connecting.
  - models: [all]
    severity: info
    text: >
      The projector echoes every character it receives; the echo is in lower case and the answer in capitals, so
      each command waits for the line naming it in capitals and state is read from those lines only; the probe takes
      any line, the echo included, as a sign of the projector. The catalog's table writes some commands with capitals
      (Bright, Tint, Lens.center, Osdlite, CS_cust_Rx, DarkTm.sel) while its example sends "op bright"; every
      command is sent in lower case here.
  - models: [all]
    severity: info
    text: >
      Motor commands (lens_shift, lens_zoom, lens_focus) move one step each; the catalog documents no lens position
      read. The keystone values add up to 350 at most in absolute value; ScenergiX blend widths of 1-199 are not
      allowed, and black level widths go in steps of 8 (top, bottom) or 4 (left, right) and need a blend on that
      side; the PIP source must suit the main input (appendix 1). The run times, signal timing and pixel clock are
      text as the projector gives them.
  - models: [all]
    severity: info
    text: >
      API limits: the catalog has no write of the model, serial number, software version, active source, status,
      error code, lamp status or run times, and no network (TCP) form of these commands; the projector's network
      control is not described in this document.
