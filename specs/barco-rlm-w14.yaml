spec: 1
id: barco-rlm-w14
name: Barco RLM-W14 (RS-232 operation commands)
vendor: Barco
category: display

# The RLM-W14's RS-232 port takes ASCII "op <command> <operation>" lines ended
# by CR: "= <value>" sets, "?" reads, "+" and "-" step by one, nothing
# executes. The projector answers "OP <COMMAND> = <value>" (or "OP <COMMAND>"
# for an execute function) in capitals, "NA" where the value is not available,
# and echoes every character it receives, so the echo (lower case) is told
# apart from the answer (capitals) by the text each command waits for.
# Nothing is pushed.
source:
  - title: "RLM W14 Serial Commands, Rev. 1.0 (TDE6643 v00, 2014-08-28)"
    author: "Barco NV"
    url: "https://www.barco.com/en/support/docs/TDE6643"
    note: >
      Manufacturer document (public; retrieved 2026-10-22). Interface: 115200 bit/s, 8 data bits, no parity, 1
      stop bit, no flow control, every character echoed (p.1); syntax "op[SP]<command>[SP]<value>[CR]", set "=",
      get "?", increment "+", decrement "-", execute with no operation, answers in capitals "OP <COMMAND> = <value>"
      or "NA" (p.1-2); motor commands for zoom, focus and lens shift (p.2); the operation command table, items 1-1
      to 8-14 and 0.1 to 0.16 (p.3-17), notes 1-22 (p.17-18), appendices on PIP sources, input formats and warp,
      blanking and ScenergiX combinations (p.19-20).

transport:
  type: line-serial
  framing: terminated
  terminator: cr
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  # The echo of each command (lower case) comes before its answer (capitals):
  # each command names the answer it waits for (reply_contains), so the echo
  # is never taken as one, and the telemetry rules read capitals only. A
  # query's echo is enough for the probe: it comes from the projector.
  probe: "op status ?"

settings:
  serial_port: { type: string, required: true, max_length: 256, label: Serial port,
    description: "The host's serial port wired to the projector's RS-232 port: COM3 on Windows, /dev/ttyUSB0 on Linux, /dev/cu.usbserial-1420 on macOS." }
  baud_rate: { type: int, min: 115200, max: 115200, default: 115200, label: Baud rate, description: "The RS-232 port runs at 115200 bit/s." }
  data_bits: { type: int, min: 8, max: 8, default: 8, label: Data bits, description: "8 data bits." }
  parity: { type: enum, values: [none], default: none, label: Parity, description: "No parity." }
  stop_bits: { type: int, min: 1, max: 1, default: 1, label: Stop bits, description: "1 stop bit." }
  flow_control: { type: enum, values: [none], default: none, label: Flow control, description: "No flow control." }

ports:
  - { port: null, protocol: serial, role: control, setting: serial_port, note: "The projector's RS-232 port, wired to a serial port of the host" }

