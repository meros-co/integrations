      state: { "triggers.1": { value: "{1}", map: { "0": "5:4", "1": "4:3", "2": "16:10", "3": "16:9", "4": "1.88", "5": "2.35", "6": "letterbox", "7": "native", "8": "unscaled", "9": "auto" } } }
    - match: "^OP TRIG\\.2 = ([0-9]+)\\s*$"
      state: { "triggers.2": { value: "{1}", map: { "0": "5:4", "1": "4:3", "2": "16:10", "3": "16:9", "4": "1.88", "5": "2.35", "6": "letterbox", "7": "native", "8": "unscaled", "9": "auto" } } }

