commands:
  auto_image:
    summary: "Run the automatic image adjustment once (op auto.img)"
    send: "op auto.img"
    expect: { reply_contains: "OP AUTO.IMG" }
    returns: ack
  calibrate_lens:
    summary: "Calibrate the lens (op lens.cal)"
    send: "op lens.cal"
    expect: { reply_contains: "OP LENS.CAL" }
    returns: ack
  clear_lens_memory:
    summary: "Clear a lens memory (op lens.clear = 1-3)"
    params:
      memory: { type: int, min: 1, max: 3, required: true, label: "Memory", description: "Lens memory 1 to 3." }
    send: "op lens.clear = {memory}"
    expect: { reply_contains: "OP LENS.CLEAR", not_contains: "= NA" }
    returns: ack
  factory_reset:
    summary: "Reset every setting to factory defaults (op fact.reset)"
    send: "op fact.reset"
    expect: { reply_contains: "OP FACT.RESET" }
    returns: ack
  get_3d_sync_delay:
    summary: "Read the 3D sync delay (op 3dsync.dly ?)"
    send: "op 3dsync.dly ?"
    expect: { reply_contains: "OP 3DSYNC.DLY =", matches: "^OP 3DSYNC\\.DLY = (-?[0-9]+)\\s*$" }
    returns: value
  get_3d_sync_invert:
    summary: "Read the 3D sync invert (op 3dsync.inv ?)"
    send: "op 3dsync.inv ?"
    expect: { reply_contains: "OP 3DSYNC.INV =", matches: "^OP 3DSYNC\\.INV = ([0-9]+)\\s*$" }
    returns: value
  get_3d_sync_reference:
    summary: "Read the 3D sync reference (op 3dsync.ref ?)"
    send: "op 3dsync.ref ?"
    expect: { reply_contains: "OP 3DSYNC.REF =", matches: "^OP 3DSYNC\\.REF = ([0-9]+)\\s*$" }
    returns: value
  get_active_source:
    summary: "Read the active source (op act.src ?)"
    send: "op act.src ?"
    expect: { reply_contains: "OP ACT.SRC =", matches: "^OP ACT\\.SRC = ([0-9]+)\\s*$" }
    returns: value
  get_aspect_ratio:
    summary: "Read the aspect ratio (op aspect ?)"
    send: "op aspect ?"
    expect: { reply_contains: "OP ASPECT =", matches: "^OP ASPECT = ([0-9]+)\\s*$" }
    returns: value
  get_auto_image_adjust:
    summary: "Read the auto image adjust (op auto.imgadj ?)"
    send: "op auto.imgadj ?"
    expect: { reply_contains: "OP AUTO.IMGADJ =", matches: "^OP AUTO\\.IMGADJ = ([0-9]+)\\s*$" }
    returns: value
  get_auto_power_off:
    summary: "Read the auto power off (op auto.powoff ?)"
    send: "op auto.powoff ?"
    expect: { reply_contains: "OP AUTO.POWOFF =", matches: "^OP AUTO\\.POWOFF = ([0-9]+)\\s*$" }
    returns: value
  get_auto_power_on:
    summary: "Read the auto power on (op auto.powon ?)"
    send: "op auto.powon ?"
    expect: { reply_contains: "OP AUTO.POWON =", matches: "^OP AUTO\\.POWON = ([0-9]+)\\s*$" }
    returns: value
  get_auto_source:
    summary: "Read the auto source (op auto.src ?)"
    send: "op auto.src ?"
    expect: { reply_contains: "OP AUTO.SRC =", matches: "^OP AUTO\\.SRC = ([0-9]+)\\s*$" }
    returns: value
  get_black_level_all:
