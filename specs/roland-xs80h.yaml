spec: 1
id: roland-xs80h
name: Roland XS-82H / XS-83H / XS-84H (LAN control)
vendor: Roland
category: router

# The XS-82H/83H/84H matrix switchers' command set: three upper-case letters,
# optional ":" and comma-separated numbers, then ";" (Reference Manual p.21).
# Over LAN a CR follows the ";". Replies are "ACK;", "ERR:n;" or a status
# frame, ended by ";" with no line ending documented.
source:
  - title: "XS-82H / XS-83H / XS-84H Reference Manual, Version 3.00 and later, edition 03 (PDF dated 2021-08-19)"
    author: Roland Corporation
    url: https://static.roland.com/assets/media/zip/XS-82H_83H_84H_reference_v30_eng03_W.pdf
    note: >
      Manufacturer document (the PDF itself states "Version 3.15 and later").
      Command overview, ";" CR terminator, RS-232C settings and LAN control
      (TCP 8023) p.21; received commands p.22-23; sent commands (ACK, ERR,
      ITS, OTS, CTS, KLS, VER) p.24.

transport:
  type: line-tcp
  port: 8023
  # Commands carry their ";"; a CR follows over LAN (p.21: "When using
  # RS-232C, no CR is required").
  framing: terminated
  terminator: cr
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  reply_framing: terminated
  reply_terminators: [";"]
  # Every frame the unit sends answers a command (p.24): ACK, ERR, or the
  # status frame of ITS, OTS, CTS, KLS or VER.
  reply_match: '^[\x02\x11\x13]*(ACK;|ERR:[0-9]+;|ITS:|OTS:|CTS:|KLS:|VER:)'
  probe: "ACS;"

ports:
  - { port: 8023, protocol: tcp, role: control }

