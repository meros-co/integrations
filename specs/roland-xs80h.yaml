commands:
  set_input_type:
    summary: "Select the type of input channel 1-8: 0 HDMI, 1 RGB/COMPONENT, 2 COMPOSITE, 3 YC, 4-7 STILL1-4, 8 SHARE (VIS)"
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input channel, 1 to 8 as on the panel." }
      type: { type: int, min: 0, max: 8, required: true, label: Input type, description: "0 HDMI, 1 RGB/COMPONENT, 2 COMPOSITE, 3 YC, 4-7 STILL1-4, 8 SHARE." }
    send: "VIS:{input:-1},{type};"
    expect: { contains: "ACK;" }
    returns: ack

  set_input_color_space:
    summary: "Select the color space of input channel 1-8: 0 Auto, 1 RGB (0-255), 2 RGB (16-235), 3 YCC (SD), 4 YCC (HD) (VIC)"
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input channel, 1 to 8 as on the panel." }
      space: { type: int, min: 0, max: 4, required: true, label: Color space, description: "0 Auto, 1 RGB (0-255), 2 RGB (16-235), 3 YCC (SD), 4 YCC (HD)." }
    send: "VIC:{input:-1},{space};"
    expect: { contains: "ACK;" }
    returns: ack

  set_input_hdcp:
    summary: "Enable or disable HDCP on input channel 1-8 (VIH)"
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input channel, 1 to 8 as on the panel." }
      enabled: { type: bool, required: true, label: HDCP, description: "On enables HDCP on the input, off disables it." }
    send: "VIH:{input:-1},{enabled:bool01};"
    expect: { contains: "ACK;" }
    returns: ack

  set_input_aspect:
    summary: "Set the aspect of input channel 1-8: 0 Full, 1 Letterbox, 2 Crop, 3 Dot by Dot, 4 Manual (VIA)"
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input channel, 1 to 8 as on the panel." }
      aspect: { type: int, min: 0, max: 4, required: true, label: Aspect, description: "0 Full, 1 Letterbox, 2 Crop, 3 Dot by Dot, 4 Manual." }
    send: "VIA:{input:-1},{aspect};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output_select:
    summary: "OUTPUT SELECT of output channel 1-4: 0 Auto, 1 HDMI, 2 HDBaseT (VOS)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
      select: { type: int, min: 0, max: 2, required: true, label: Output select, description: "0 Auto, 1 HDMI, 2 HDBaseT." }
    send: "VOS:{output:-1},{select};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output_resolution:
    summary: "Output resolution of output channel 1-4: 0 480i 4:3/576i 4:3, 1 480i 16:9/576i 16:9, 2 480p 4:3/576p 4:3, 3 480p 16:9/576p 16:9, 4 720/59.94P, 5 1080/59.94i, 6 1080/59.94P, 7 640x480, 8 800x600, 9 1024x768, 10 1280x768, 11 1280x800, 12 1366x768, 13 1280x1024, 15 1600x1200, 16 1920x1200 (VOR)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
      resolution: { type: int, min: 0, max: 16, required: true, label: Resolution, description: "0 480i 4:3/576i 4:3, 1 480i 16:9/576i 16:9, 2 480p 4:3/576p 4:3, 3 480p 16:9/576p 16:9, 4 720/59.94P, 5 1080/59.94i, 6 1080/59.94P, 7 640x480, 8 800x600, 9 1024x768, 10 1280x768, 11 1280x800, 12 1366x768, 13 1280x1024, 15 1600x1200, 16 1920x1200. 14 is not listed in the manual." }
    send: "VOR:{output:-1},{resolution};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output_hdcp:
    summary: "Enable or disable HDCP on output channel 1-4 (VOH)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
      enabled: { type: bool, required: true, label: HDCP, description: "On enables HDCP on the output, off disables it." }
    send: "VOH:{output:-1},{enabled:bool01};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output_color_space:
    summary: "Color space of output channel 1-4: 0 Auto, 1 RGB (0-255), 2 RGB (16-235), 3 YCC (444), 4 YCC (422) (VOC)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
      space: { type: int, min: 0, max: 4, required: true, label: Color space, description: "0 Auto, 1 RGB (0-255), 2 RGB (16-235), 3 YCC (444), 4 YCC (422)." }
    send: "VOC:{output:-1},{space};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output_signal:
    summary: "Signal type of output channel 1-4: false DVI-D, true HDMI (VOD)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
      hdmi: { type: bool, required: true, label: HDMI signal, description: "On sends an HDMI signal, off sends DVI-D." }
    send: "VOD:{output:-1},{hdmi:bool01};"
    expect: { contains: "ACK;" }
    returns: ack

  route_av:
    summary: "Route video and audio of input 1-8 to output 1-4 (OAV)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input whose video and audio go to the output, 1 to 8." }
    send: "OAV:{output:-1},{input:-1};"
    expect: { contains: "ACK;" }
    returns: ack

  route_video:
    summary: "Route the video of input 1-8 to output 1-4 (OVS)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input whose video goes to the output, 1 to 8." }
    send: "OVS:{output:-1},{input:-1};"
    expect: { contains: "ACK;" }
    returns: ack

  route_audio:
    summary: "Route the audio of input 1-8 to output 1-4 (OAS)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input whose audio goes to the output, 1 to 8." }
    send: "OAS:{output:-1},{input:-1};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output_off:
    summary: "Set the [OFF] button of output 1-4 (OFS)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
      pressed: { type: bool, required: true, label: "Off", description: "On presses the output's [OFF] button so it shows nothing, off releases it." }
    send: "OFS:{output:-1},{pressed:bool01};"
    expect: { contains: "ACK;" }
    returns: ack

  set_hdmi_input_level:
    summary: "Level of HDMI INPUT audio of input 1-8, 0-127 (IDL)"
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input channel, 1 to 8 as on the panel." }
      level: { type: int, min: 0, max: 127, required: true, label: Level, description: "HDMI INPUT audio level, 0 to 127 as on the unit." }
    send: "IDL:{input:-1},{level};"
    expect: { contains: "ACK;" }
    returns: ack

  set_analog_input_level:
    summary: "Level of AUDIO INPUT audio of input 1-8, 0-127 (IAL)"
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input channel, 1 to 8 as on the panel." }
      level: { type: int, min: 0, max: 127, required: true, label: Level, description: "AUDIO INPUT (analogue) audio level, 0 to 127 as on the unit." }
    send: "IAL:{input:-1},{level};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output_level:
    summary: "Audio output level of output 1-4, 0-127 (OAL)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
      level: { type: int, min: 0, max: 127, required: true, label: Level, description: "Audio output level, 0 to 127 as on the unit." }
    send: "OAL:{output:-1},{level};"
    expect: { contains: "ACK;" }
    returns: ack

  set_hdmi_input_mute:
    summary: "Mute HDMI INPUT audio of input 1-8 (IDM)"
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input channel, 1 to 8 as on the panel." }
      enabled: { type: bool, required: true, label: Mute, description: "On mutes the input's HDMI audio, off unmutes it." }
    send: "IDM:{input:-1},{enabled:bool01};"
    expect: { contains: "ACK;" }
    returns: ack

  set_analog_input_mute:
    summary: "Mute AUDIO INPUT audio of input 1-8 (IAM)"
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input channel, 1 to 8 as on the panel." }
      enabled: { type: bool, required: true, label: Mute, description: "On mutes the input's analogue audio, off unmutes it." }
    send: "IAM:{input:-1},{enabled:bool01};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output_mute:
    summary: "Mute the audio of output 1-4 (OAM)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
      enabled: { type: bool, required: true, label: Mute, description: "On mutes the output's audio, off unmutes it." }
    send: "OAM:{output:-1},{enabled:bool01};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output_delay:
    summary: "Audio delay of output 1-4, 0-170 ms (ADT)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
      delay: { type: int, min: 0, max: 170, required: true, label: Delay, description: "Audio delay in milliseconds, 0 to 170." }
    send: "ADT:{output:-1},{delay};"
    expect: { contains: "ACK;" }
    returns: ack

  set_mode:
    summary: "Video output mode: 0 MATRIX, 1-3 MULTI-2..4, 4-6 SPAN-2..4, 7-10 ROTATION-L1..L4, 11-14 ROTATION-R1..R4, 15 4K-1, 16 4K-2, 17 DISSOLVE-1, 18 PGM-PST, 19 2 x PGM-PST, 20 3 x PGM-PST, 21 DUAL DISSOLVE, 22 DUAL PGM-PST (MOD)"
    params:
      mode: { type: int, min: 0, max: 22, required: true, label: Output mode, description: "0 MATRIX, 1-3 MULTI-2 to 4, 4-6 SPAN-2 to 4, 7-10 ROTATION-L1 to L4, 11-14 ROTATION-R1 to R4, 15 4K-1, 16 4K-2, 17 DISSOLVE-1, 18 PGM-PST, 19 2 x PGM-PST, 20 3 x PGM-PST, 21 DUAL DISSOLVE, 22 DUAL PGM-PST." }
    send: "MOD:{mode};"
    expect: { contains: "ACK;" }
    returns: ack

  recall_preset:
    summary: "Call up preset 1-32 (PSE)"
    params:
      preset: { type: int, min: 1, max: 32, required: true, label: Preset, description: "Preset to call up, 1 to 32 as on the unit." }
    send: "PSE:{preset:-1};"
    expect: { contains: "ACK;" }
    returns: ack

  get_input_status:
    summary: "State of input 1-8: channel, type, color space, HDCP, aspect, as the reply's comma list (ITS)"
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input channel, 1 to 8 as on the panel." }
    send: "ITS:{input:-1};"
    expect: { matches: '^[\x02\x11\x13]*ITS:([^;]*);' }
    returns: value

  get_output_status:
    summary: "State of output 1-4: channel, OUTPUT SELECT, resolution, HDCP, color space, signal, as the reply's comma list (OTS)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
    send: "OTS:{output:-1};"
    expect: { matches: '^[\x02\x11\x13]*OTS:([^;]*);' }
    returns: value

  get_crosspoint:
    summary: "Cross-point of output 1-4: channel, video input, audio input, [OFF] status, as the reply's comma list (CTS)"
    params:
      output: { type: int, min: 1, max: 4, required: true, label: Output, description: "Output channel, 1 to 4 as on the panel." }
    send: "CTS:{output:-1};"
    expect: { matches: '^[\x02\x11\x13]*CTS:([^;]*);' }
    returns: value

  auto_take:
    summary: "Auto take on output 1-3 in the PGM-PST modes (ATO:a,1)"
    params:
      output: { type: int, min: 1, max: 3, required: true, label: Output, description: "Output to take, 1 to 3; only in the PGM-PST modes." }
    send: "ATO:{output:-1},1;"
    expect: { contains: "ACK;" }
    returns: ack

  set_output1_send:
    summary: "Send level to OUTPUT1 of audio input 1-16 (HDMI-IN1-8, ANALOG-IN1-8), 0-100 % (ASA)"
    params:
      input: { type: int, min: 1, max: 16, required: true, label: Audio input, description: "1-8 HDMI-IN1 to 8, 9-16 ANALOG-IN1 to 8." }
      rate: { type: int, min: 0, max: 100, required: true, label: Send level, description: "Send level to OUTPUT1 in percent, 0 to 100." }
    send: "ASA:{input:-1},{rate};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output2_send:
    summary: "Send level to OUTPUT2 of audio input 1-16 (HDMI-IN1-8, ANALOG-IN1-8), 0-100 % (ASB)"
    params:
      input: { type: int, min: 1, max: 16, required: true, label: Audio input, description: "1-8 HDMI-IN1 to 8, 9-16 ANALOG-IN1 to 8." }
      rate: { type: int, min: 0, max: 100, required: true, label: Send level, description: "Send level to OUTPUT2 in percent, 0 to 100." }
    send: "ASB:{input:-1},{rate};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output3_send:
    summary: "Send level to OUTPUT3 of audio input 1-16 (HDMI-IN1-8, ANALOG-IN1-8), 0-100 % (ASC)"
    params:
      input: { type: int, min: 1, max: 16, required: true, label: Audio input, description: "1-8 HDMI-IN1 to 8, 9-16 ANALOG-IN1 to 8." }
      rate: { type: int, min: 0, max: 100, required: true, label: Send level, description: "Send level to OUTPUT3 in percent, 0 to 100." }
    send: "ASC:{input:-1},{rate};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output4_send:
    summary: "Send level to OUTPUT4 of audio input 1-16 (HDMI-IN1-8, ANALOG-IN1-8), 0-100 % (ASD)"
    params:
      input: { type: int, min: 1, max: 16, required: true, label: Audio input, description: "1-8 HDMI-IN1 to 8, 9-16 ANALOG-IN1 to 8." }
      rate: { type: int, min: 0, max: 100, required: true, label: Send level, description: "Send level to OUTPUT4 in percent, 0 to 100." }
    send: "ASD:{input:-1},{rate};"
    expect: { contains: "ACK;" }
    returns: ack

  set_rgb_edid:
    summary: "EDID of RGB input 1-8: 0 INTERNAL, 1 640x480, 2 800x600, 3 1024x768, 4 1280x768, 5 1280x800, 6 1366x768, 7 1280x1024, 8 1400x1050, 9 1600x1200, 10 1920x1200 (AED)"
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input channel, 1 to 8 as on the panel." }
      edid: { type: int, min: 0, max: 10, required: true, label: EDID, description: "0 INTERNAL, 1 640x480, 2 800x600, 3 1024x768, 4 1280x768, 5 1280x800, 6 1366x768, 7 1280x1024, 8 1400x1050, 9 1600x1200, 10 1920x1200." }
    send: "AED:{input:-1},{edid};"
    expect: { contains: "ACK;" }
    returns: ack

  set_hdmi_edid:
    summary: "EDID of HDMI input 1-8: 0 INTERNAL, 1 640x480, 2 800x600, 3 1024x768, 4 1280x768, 5 1280x800, 6 1366x768, 7 1280x1024, 8 1400x1050, 9 1600x1200, 10 1920x1200, 11-18 DATA1-8, 19 480i 4:3/576i 4:3, 20 480i 16:9/576i 16:9, 21 480p 4:3/576p 4:3, 22 480p 16:9/576p 16:9, 23 720p, 24 1080i, 25 1080p (DED)"
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "Input channel, 1 to 8 as on the panel." }
      edid: { type: int, min: 0, max: 25, required: true, label: EDID, description: "0 INTERNAL, 1 640x480, 2 800x600, 3 1024x768, 4 1280x768, 5 1280x800, 6 1366x768, 7 1280x1024, 8 1400x1050, 9 1600x1200, 10 1920x1200, 11-18 DATA1 to 8, 19 480i 4:3/576i 4:3, 20 480i 16:9/576i 16:9, 21 480p 4:3/576p 4:3, 22 480p 16:9/576p 16:9, 23 720p, 24 1080i, 25 1080p." }
    send: "DED:{input:-1},{edid};"
    expect: { contains: "ACK;" }
    returns: ack

  set_panel_lock:
    summary: "Set panel lock on or off (PLS)"
    params:
      enabled: { type: bool, required: true, label: Panel lock, description: "On locks the front panel, off unlocks it." }
    send: "PLS:{enabled:bool01};"
    expect: { contains: "ACK;" }
    returns: ack

  set_key_lock_mode:
    summary: "Set a key lock mode on or off: 0 CROSSPOINT, 1 SWITCHING MODE, 2 MENU+EXIT, 3 CURSOR+VALUE, 4 CROSS-NOINPUT, 5 CROSS-OFF, 6-9 CROSS-OUTPUT1-4 (KLM)"
    params:
      mode: { type: int, min: 0, max: 9, required: true, label: Key lock mode, description: "0 CROSSPOINT, 1 SWITCHING MODE, 2 MENU+EXIT, 3 CURSOR+VALUE, 4 CROSS-NOINPUT, 5 CROSS-OFF, 6-9 CROSS-OUTPUT1 to 4." }
      enabled: { type: bool, required: true, label: "On", description: "On turns this key lock on, off turns it off." }
    send: "KLM:{mode},{enabled:bool01};"
    expect: { contains: "ACK;" }
    returns: ack

  get_key_lock:
    summary: "Key lock state: lock status then the ten modes, as the reply's comma list (KLS)"
    send: "KLS;"
    expect: { matches: '^[\x02\x11\x13]*KLS:([^;]*);' }
    returns: value

  get_version:
    summary: "Model and version, as the reply's comma list (VER)"
    send: "VER;"
    expect: { matches: '^[\x02\x11\x13]*VER:([^;]*);' }
    returns: value

  active_sense:
    summary: "Check the unit is operating (ACS)"
    send: "ACS;"
    expect: { contains: "ACK;" }
    returns: ack
telemetry:
  # Nothing is pushed. The cross-points of outputs 1-4 are asked every second
  # (the XS-82H and XS-83H answer the outputs they lack with an error). The
  # settings the other status queries read (every input's type, color space,
  # HDCP and aspect, every output's select, resolution, HDCP, color space and
  # signal, and the key lock) are asked on connecting and every ten seconds.
  # Nothing else the commands set can be read (see the quirks).
  subscribe:
    send: ["VER;", "ITS:0;", "ITS:1;", "ITS:2;", "ITS:3;", "ITS:4;", "ITS:5;", "ITS:6;", "ITS:7;",
           "OTS:0;", "OTS:1;", "OTS:2;", "OTS:3;", "KLS;"]
    every_ms: 10000
  poll:
    send: ["CTS:0;", "CTS:1;", "CTS:2;", "CTS:3;"]
    every_ms: 1000
  updates:
    - match: '^[\x02\x11\x13]*CTS:(\d+),(\d+),(\d+),([01]);'
      state:
        "outputs.{1:+1}.video": "{2:+1}"
        "outputs.{1:+1}.audio": "{3:+1}"
        "outputs.{1:+1}.off": { value: "{4}", map: { "1": true, "0": false } }
    - match: '^[\x02\x11\x13]*ITS:(\d+),(\d+),(\d+),([01]),(\d+);'
      state:
        "inputs.{1:+1}.type": "{2}"
        "inputs.{1:+1}.color_space": "{3}"
        "inputs.{1:+1}.hdcp": { value: "{4}", map: { "1": true, "0": false } }
        "inputs.{1:+1}.aspect": "{5}"
    - match: '^[\x02\x11\x13]*OTS:(\d+),(\d+),(\d+),([01]),(\d+),([01]);'
      state:
        "outputs.{1:+1}.select": "{2}"
        "outputs.{1:+1}.resolution": "{3}"
        "outputs.{1:+1}.hdcp": { value: "{4}", map: { "1": true, "0": false } }
        "outputs.{1:+1}.color_space": "{5}"
        "outputs.{1:+1}.hdmi": { value: "{6}", map: { "1": true, "0": false } }
    - match: '^[\x02\x11\x13]*KLS:([01]),([01,]+);'
      state:
        "panel_lock": { value: "{1}", map: { "1": true, "0": false } }
        "key_lock_modes": "{2}"
    - match: '^[\x02\x11\x13]*VER:([^,;]+),([^;]+);'
      state: { "device.model": "{1}", "device.version": "{2}" }

state:
  outputs.*.video:       { type: int, description: "Input 1-8 whose video is on the output" }
  outputs.*.audio:       { type: int, description: "Input 1-8 whose audio is on the output" }
  outputs.*.off:         { type: bool, description: "Output [OFF] button on" }
  outputs.*.select:      { type: int, description: "OUTPUT SELECT: 0 Auto, 1 HDMI, 2 HDBaseT" }
  outputs.*.resolution:  { type: int, description: "Output resolution code, as set_output_resolution" }
  outputs.*.hdcp:        { type: bool, description: "Output HDCP enabled" }
  outputs.*.color_space: { type: int, description: "0 Auto, 1 RGB (0-255), 2 RGB (16-235), 3 YCC (444), 4 YCC (422)" }
  outputs.*.hdmi:        { type: bool, description: "Signal type HDMI (false: DVI-D)" }
  inputs.*.type:         { type: int, description: "0 HDMI, 1 RGB/COMPONENT, 2 COMPOSITE, 3 YC, 4-7 STILL1-4, 8 SHARE" }
  inputs.*.color_space:  { type: int, description: "0 Auto, 1 RGB (0-255), 2 RGB (16-235), 3 YCC (SD), 4 YCC (HD)" }
  inputs.*.hdcp:         { type: bool, description: "Input HDCP enabled" }
  inputs.*.aspect:       { type: int, description: "0 Full, 1 Letterbox, 2 Crop, 3 Dot by Dot, 4 Manual" }
  panel_lock:            { type: bool, description: "Panel lock on" }
  key_lock_modes:        { type: string, description: "Ten 0/1 flags: Cross Point, Switch Mode, Menu+Exit, Cursor+Value, Cross-Noinput, Cross-Off, Cross-Output1-4" }
  device.model:          { type: string, description: "Model from VER, XS-82H, XS-83H or XS-84H" }
  device.version:        { type: string, description: "Version from VER" }

quirks:
  - models: [all]
    severity: warning
    text: >
      Wait for "ACK;" after each command before sending the next (p.21); the
      queue does this. A reply ends at ";" and the manual documents no line
      ending after it. ITS, OTS, CTS, KLS and VER are documented as answered
      by their status frame (p.24) with no ACK; if a unit also sends ACK; after
      one, that ACK; would be taken as the next command's reply. ERR:0 syntax
      error, ERR:4 invalid value, ERR:5 out of range.

  - models: [all]
    severity: info
    text: >
      Wire numbers are 0-based; inputs, outputs and presets here are 1-based
      and converted. ATO applies only in the PGM-PST modes: output 1 in
      PGM-PST, 1-2 in 2 x PGM-PST, 1-3 in 3 x PGM-PST, 1 and 3 in DUAL
      PGM-PST (p.23). Resolution code 14 is not listed (p.22). PLS:1 does
      nothing when every KEY LOCK MODE is off (p.23). Status queries return
      the reply's comma list as one value; the parts are in state. Over
      RS-232C the menu RS-232C FUNCTION must be RECEIVER; no setting is
      documented for LAN control, and no password.

  - models: [all]
    severity: info
    text: >
      API limits: the only status queries are ITS, OTS, CTS, KLS and VER
      (p.22-24), and state keeps every value they give. Nothing reads back
      the audio levels and mutes (IDL, IAL, OAL, IDM, IAM, OAM), the audio
      delays, the OUTPUT1-4 send levels, the EDIDs, the video output mode or
      the preset last recalled; state does not keep them.
