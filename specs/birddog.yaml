telemetry:
  # The API has no push or subscription. The status and the settings an
  # operator changes most (about, encoder, exposure, picture, white balance,
  # PTZ setup, and on the cameras that have them tally, PTZ position and the
  # decoder's status) are polled every 5 seconds; every other endpoint the
  # camera serves is read on connecting and every 30 seconds. Each item names
  # the cameras that serve it. Replies to get_ and set_ commands go to the
  # same rules (POST replies carry the whole endpoint object), and a POST
  # with a JSON body has its endpoint read again at once (see quirks).
  poll:
    every_ms: 5000
    send:
      - { method: GET, path: /about }
      - { method: GET, path: /encodesetup }
      - { method: GET, path: /birddogexpsetup }
      - { method: GET, path: /birddogpicsetup }
      - { method: GET, path: /birddogwbsetup }
      - { method: GET, path: /birddogptzsetup }
      - { models: &v21 [x1, x1-ultra, max, x4-ultra, x5-ultra, maki-ultra], method: GET, path: /tally }
