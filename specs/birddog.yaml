commands:
  # Device information (2.0: API Methods - BasicDeviceInfo; 2.1: Device Information)
  get_about:
    summary: "Basic device information: firmware, hostname, IP settings, serial number (MAC on 2.1) and status (GET /about)"
    send: { method: GET, path: /about }
    expect: { status: 200, json_path: "$" }
    returns: value
  get_version:
    summary: "Hardware identifier as plain text, such as 'BirdDog X1' (GET /version)"
    send: { method: GET, path: /version }
    expect: { status: 200 }
    returns: text
  get_hostname:
    summary: "Device (mDNS) name as plain text (GET /hostname)"
    send: { method: GET, path: /hostname }
    expect: { status: 200 }
    returns: text
  get_operation_mode:
    summary: "Operation mode as plain text: encode, decode, or dual on X5 Ultra (GET /operationmode)"
    send: { method: GET, path: /operationmode }
    expect: { status: 200 }
    returns: text
  set_operation_mode:
    summary: "Switch the camera's baseband outputs between camera video (encode) and the NDI decoder (decode); plain-text body (POST /operationmode)"
    params:
      mode: { type: enum, values: ["encode", "decode"], required: true,
              label: Operation mode,
              description: "What the baseband outputs carry: encode (the camera's video) or decode (the NDI decoder)." }
    send: { method: POST, path: /operationmode, body: '{mode}', content_type: text/plain }
    expect: { status: 200 }
    returns: ack
  reboot:
    summary: "Reboot the device immediately (POST /reboot)"
    send: { method: POST, path: /reboot }
    expect: { status: 200 }
    returns: ack
  restart_video:
    summary: "Restart the video subsystem (POST /restart)"
    send: { method: POST, path: /restart }
    expect: { status: 200 }
    returns: ack
  factory_reset:
    summary: "Factory reset the device (POST /ResetSystemDefault)"
    send: { method: POST, path: /ResetSystemDefault }
    expect: { status: 200 }
    returns: ack
  reset_image:
    summary: "Reset all image settings, as the web UI's Image Settings Reset (POST /RestImage, the collection's spelling)"
    send: { method: POST, path: /RestImage }
    expect: { status: 200 }
    returns: ack
  # Video output interface (2.0: DEVICESETTINGS; 2.1: Miscellaneous Camera Settings / Video Output Interface)
  get_video_output:
    summary: "Baseband output settings: JSON on 2.1 cameras; plain text LowLatency or NormalMode on P400/P4K (GET /videooutputinterface)"
    send: { method: GET, path: /videooutputinterface }
    expect: { status: 200 }
    returns: text
  set_video_output_mode_p400:
    summary: "P400/P4K output latency mode; plain-text body (POST /videooutputinterface)"
    params:
      mode: { type: enum, values: ["LowLatency", "NormalMode"], required: true,
              label: Output mode,
              description: "Output latency mode: LowLatency or NormalMode." }
    send: { method: POST, path: /videooutputinterface, body: '{mode}', content_type: text/plain }
    expect: { status: 200 }
    returns: ack
  set_output_format:
    summary: "Baseband output format, such as 1080p30 (MAKI Ultra: 720p29.97 to 2160p60, reboot required) (POST /videooutputinterface)"
    params:
      format: { type: string, pattern: '^(?:[0-9]{3,4}x)?[0-9]{3,4}[pi][0-9]{2}(?:\.[0-9]{1,2})?$', required: true,
                label: Output format,
                description: "Baseband output format such as 1080p30 or 1080p59.94; on MAKI Ultra 720p29.97 to 2160p60, and the camera needs a reboot." }
    send: { method: POST, path: /videooutputinterface, body: '{"OutputFormat":{format:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_output_format_x5u:
    summary: "X5 Ultra baseband output format in the WIDTHxHEIGHT form, such as 1920x1080p50 (POST /videooutputinterface)"
    params:
      format: { type: string, pattern: '^(?:[0-9]{3,4}x)?[0-9]{3,4}[pi][0-9]{2}(?:\.[0-9]{1,2})?$', required: true,
                label: Output format,
                description: "Baseband output format as WIDTHxHEIGHT and rate, e.g. 1920x1080p50." }
    send: { method: POST, path: /videooutputinterface, body: '{"OutputFormat":{format:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_privacy_mode:
    summary: "Privacy mode (POST /videooutputinterface)"
    params:
      state: { type: enum, values: ["On", "Off"], required: true,
               label: Privacy mode,
               description: "On hides the camera's picture (privacy mode), Off shows it." }
    send: { method: POST, path: /videooutputinterface, body: '{"PrivacyMode":"{state}"}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_video_output:
    summary: "X4 Ultra baseband output interface (POST /videooutputinterface)"
    params:
      output: { type: enum, values: ["hdmi", "sdi"], required: true,
                label: Output,
                description: "Baseband output interface: hdmi or sdi." }
    send: { method: POST, path: /videooutputinterface, body: '{"videoformat":"{output}"}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_output_frequency:
    summary: "X5 Ultra output frequency in Hz (POST /videooutputinterface)"
    params:
      hz: { type: enum, values: ["60", "59.94", "50"], required: true,
            label: Frequency,
            description: "Output frame frequency in Hz: 60, 59.94 or 50." }
    send: { method: POST, path: /videooutputinterface, body: '{"Frequency":"{hz}"}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_hdmi1_output_decoder:
    summary: "X5 Ultra: HDMI 1 shows the decoder (POST /videooutputinterface)"
    params:
      state: { type: enum, values: ["On", "Off"], required: true,
               label: HDMI 1 shows decoder,
               description: "On makes HDMI 1 show the NDI decoder, Off the camera." }
    send: { method: POST, path: /videooutputinterface, body: '{"HDMI-1OutputDecoder":"{state}"}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  # Network (2.1: Network Settings)
  get_ethernet:
    summary: "Ethernet settings: IpMode, IpAddr, NetMask, GateWayIp, DNS, DHCP timeout and fallback address (GET /EthSetup)"
    send: { method: GET, path: /EthSetup }
    expect: { status: 200, json_path: "$" }
    returns: value
  set_ethernet:
    summary: "Set any Ethernet keys; the body is JSON in the document's EthSetup shape (POST /EthSetup)"
    params:
      body: { type: json, required: true,
              label: Settings,
              description: "JSON object of the keys to set, in the shape BirdDog's API document gives for this endpoint." }
    send: { method: POST, path: /EthSetup, body: '{body}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_ip_mode:
    summary: "IP addressing: dhcp or static (POST /EthSetup)"
    params:
      mode: { type: enum, values: ["dhcp", "static"], required: true,
              label: IP mode,
              description: "dhcp gets an address from a DHCP server; static uses the address set here." }
    send: { method: POST, path: /EthSetup, body: '{"IpMode":"{mode}"}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_ip_address:
    summary: "Static IP address (POST /EthSetup)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: IP address,
                 description: "Static IPv4 address, e.g. 192.168.1.50." }
    send: { method: POST, path: /EthSetup, body: '{"IpAddr":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_netmask:
    summary: "Static subnet mask (POST /EthSetup)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: Subnet mask,
                 description: "Static subnet mask, e.g. 255.255.255.0." }
    send: { method: POST, path: /EthSetup, body: '{"NetMask":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_gateway:
    summary: "Static gateway (POST /EthSetup)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: Gateway,
                 description: "Static default gateway address." }
    send: { method: POST, path: /EthSetup, body: '{"GateWayIp":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_dns_primary:
    summary: "First DNS server (POST /EthSetup)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: Primary DNS,
                 description: "First DNS server address." }
    send: { method: POST, path: /EthSetup, body: '{"DnsSvrIpFirst":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_dns_secondary:
    summary: "Second DNS server (POST /EthSetup)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: Secondary DNS,
                 description: "Second DNS server address." }
    send: { method: POST, path: /EthSetup, body: '{"DnsSvrIpSecond":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_fallback_ip:
    summary: "DHCP fallback IP address (POST /EthSetup)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: Fallback IP address,
                 description: "Address used when DHCP gets no answer." }
    send: { method: POST, path: /EthSetup, body: '{"DhcpFallbackIPAddr":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_fallback_netmask:
    summary: "DHCP fallback subnet mask (POST /EthSetup)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: Fallback subnet mask,
                 description: "Subnet mask used when DHCP gets no answer." }
    send: { method: POST, path: /EthSetup, body: '{"DhcpFallbackNetMask":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_fallback_gateway:
    summary: "DHCP fallback gateway (POST /EthSetup)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: Fallback gateway,
                 description: "Gateway used when DHCP gets no answer." }
    send: { method: POST, path: /EthSetup, body: '{"DhcpFallbackGateWayIp":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_dhcp_timeout:
    summary: "DHCP timeout in seconds, 0-255 (POST /EthSetup)"
    params:
      seconds: { type: int, min: 0, max: 255, required: true,
                 label: DHCP timeout,
                 description: "Seconds to wait for a DHCP server before using the fallback address, 0 to 255." }
    send: { method: POST, path: /EthSetup, body: '{"DhcpTimeout":"{seconds}"}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  get_wifi:
    summary: "Wi-Fi settings: Enable, DhcpEnable, EncryptMode, Ssid, IpAddr, NetMask, GateWayIp, Dns (GET /WifiSetup)"
    send: { method: GET, path: /WifiSetup }
    expect: { status: 200, json_path: "$" }
    returns: value
  set_wifi_enabled:
    summary: "Wi-Fi on or off (POST /WifiSetup; see quirks: the example reply shows 1)"
    params:
      state: { type: enum, values: ["On", "Off"], required: true,
               label: Wi-Fi,
               description: "On switches Wi-Fi on, Off switches it off." }
    send: { method: POST, path: /WifiSetup, body: '{"Enable":"{state}"}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_wifi_dhcp:
    summary: "Wi-Fi addressing (POST /WifiSetup; see quirks)"
    params:
      mode: { type: enum, values: ["dhcp", "static"], required: true,
              label: Wi-Fi IP mode,
              description: "dhcp gets the Wi-Fi address from a DHCP server; static uses the address set here." }
    send: { method: POST, path: /WifiSetup, body: '{"DhcpEnable":"{mode}"}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_wifi_ip_address:
    summary: "Wi-Fi IP address (POST /WifiSetup)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: Wi-Fi IP address,
                 description: "Static Wi-Fi IPv4 address." }
    send: { method: POST, path: /WifiSetup, body: '{"IpAddr":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_wifi_netmask:
    summary: "Wi-Fi subnet mask (POST /WifiSetup)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: Wi-Fi subnet mask,
                 description: "Static Wi-Fi subnet mask." }
    send: { method: POST, path: /WifiSetup, body: '{"NetMask":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_wifi_gateway:
    summary: "Wi-Fi gateway (POST /WifiSetup)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: Wi-Fi gateway,
                 description: "Static Wi-Fi gateway address." }
    send: { method: POST, path: /WifiSetup, body: '{"GateWayIp":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_wifi_dns:
    summary: "Wi-Fi DNS server (POST /WifiSetup)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: Wi-Fi DNS,
                 description: "Wi-Fi DNS server address." }
    send: { method: POST, path: /WifiSetup, body: '{"Dns":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  get_ndi_discovery_server:
    summary: "NDI discovery server: NDIDisServ (NDIDisServEn/NDIDisServDis) and NDIDisServIP (GET /NDIDisServer)"
    send: { method: GET, path: /NDIDisServer }
    expect: { status: 200, json_path: "$" }
    returns: value
  set_ndi_discovery_server:
    summary: "Use an NDI discovery server (POST /NDIDisServer)"
    params:
      state: { type: enum, values: ["NDIDisServEn", "NDIDisServDis"], required: true,
               label: Discovery server,
               description: "NDIDisServEn uses an NDI discovery server, NDIDisServDis does not." }
    send: { method: POST, path: /NDIDisServer, body: '{"NDIDisServ":"{state}"}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_ndi_discovery_server_ip:
    summary: "NDI discovery server address (POST /NDIDisServer)"
    params:
      address: { type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true,
                 label: Discovery server address,
                 description: "IPv4 address of the NDI discovery server." }
    send: { method: POST, path: /NDIDisServer, body: '{"NDIDisServIP":{address:json}}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  get_network_setup:
    summary: "Preferred NIC and Dante (GET /NetworkSetup)"
    send: { method: GET, path: /NetworkSetup }
    expect: { status: 200, json_path: "$" }
    returns: value
  set_preferred_nic:
    summary: "Preferred network interface (POST /NetworkSetup)"
    params:
      nic: { type: enum, values: ["Ethernet", "WiFi"], required: true,
             label: Preferred interface,
             description: "Network interface the camera prefers: Ethernet or WiFi." }
    send: { method: POST, path: /NetworkSetup, body: '{"PreferredNIC":"{nic}"}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  set_dante:
    summary: "X4 Ultra Dante audio (POST /NetworkSetup)"
    params:
      state: { type: enum, values: ["On", "Off"], required: true,
               label: Dante,
               description: "On switches Dante audio on, Off switches it off." }
    send: { method: POST, path: /NetworkSetup, body: '{"Dante":"{state}"}', content_type: application/json }
    expect: { status: 200, not_contains: "Invalid" }
    returns: ack
  # Encoder (2.0: API Methods - NDIENCODE; 2.1: Encoder Settings)
  get_encode_setup:
