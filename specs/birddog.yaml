quirks:
  - models: [all]
    severity: info
    text: >
      The API listens on TCP port 8080 over plain HTTP. Neither document
      describes authentication for it or gives credentials, and every
      example request is sent without any.

  - models: [all]
    severity: warning
    text: >
      Pan, tilt, zoom, focus and presets overlap with VISCA over IP, which the
      native visca module covers (specs/visca.yaml, model birddog). This spec
      covers what the REST API documents. The REST pan/tilt and zoom moves
      carry no speed (they use the birddogptzsetup speeds), presets are
      limited to 1-9 (API 2.0, recallPost: "Preset-1 (Range from 1 to 9)";
      API 2.1 gives no range), and the 2.0 cameras have no REST movement or
      position endpoint at all. Use VISCA for variable-speed moves, presets
      above 9 and P-series movement.

  - models: [all]
    severity: warning
    text: >
      Every POST answers 200 with the whole endpoint object, and the
      documents' example replies often still show the old value (the reply
      to {"Flip":"On"} shows "Flip":"On", but the reply to a GainLimit change
      does not), so a POST's acknowledgement does not prove the setting took;
      the core reads the endpoint again after every POST with a JSON body,
      and that reply, like the next poll, reports the camera's value. A refused
      request answers 500 with {"error": "..."} (connectTo in encode mode),
      {"status": "Invalid Command"} (X-Axis without Y-Axis) or plain text
      "Invalid API command" (MAKI Ultra NDIGrpName POST); commands fail on a
      non-200 status or on the word Invalid. All values, numbers included,
      are sent as JSON strings, as in every example.

  - models: [p200-a2a3, p200-a4a5, a200-gen1, a200-gen2, a300-gen1, a300-gen2, p100, pf120, p110, p120, p400, p4k, p240]
    severity: warning
    text: >
      API 2.0 examples always POST the whole object (every exposure key, every
      picture key). The 2.1 collections show single-key POSTs merged into the
      current settings, but the 2.0 document does not say whether a partial
      body is accepted. The single-key commands send one key; if a camera
      needs the full object, read it with the get_ command and send it whole
      with the set_<endpoint> JSON command (set_exposure, set_picture,
      set_white_balance, ...). The 2.0 encodesetup and decodesetup examples
      also carry ChNum "1" (Range 1 to 4), which the single-key commands do not
      send; set_encode_setup can include it.

  - models: [all]
    severity: info
    text: >
      Ranges and value lists differ per camera, even within one generation,
      and each documented range has its own command (model suffixes) so an
      out-of-range value is refused before sending. Some ranges depend on
      other settings and are not limited further: GainLevel up to the gain
      limit, ShutterMinSpeed up to ShutterMaxSpeed, X1 pan and tilt speed
      1-24 unless SpeedControl is superfine (1-255). Several keys only take
      effect in one exposure, white balance or focus mode (noted in the
      summaries), and focus moves need FocusMode MANUAL.

  - models: [maki-ultra, x5-ultra]
    severity: warning
    text: >
      MAKI Ultra: a change to VideoFormat (encodesetup) or OutputFormat
      (videooutputinterface) needs a reboot to take effect ("must be followed
      by a /reboot command"; "A manual reboot is required"). X5 Ultra: turning
      the stabiliser (Stablizer) on or off reboots the camera.

  - models: [x1, x1-ultra, max, x4-ultra, x5-ultra]
    severity: warning
    text: >
      PTZ movement: PanTilt, Zoom and Focus moves continue until a separate
      stop request ("stop"). X-Axis and Y-Axis must be sent together, which
      set_pan_tilt_position does. MAKI Ultra has only Zoom, Focus and Menu;
      its Z-Axis is "yet to be implemented". The GET range for X1 pan is
      -12992 to 12208 but the POST range -12996 to 12208; the POST range is
      used.

  - models: [x5-ultra, maki-ultra, x1, x1-ultra, max]
    severity: info
    text: >
      Parts of API 2.1 are marked unfinished: connectTo "NOT YET COMPLETE ON
      ANY CAMERAS"; Genlock & Failover Sources "API Not yet implemented" on
      MAKI Ultra (not listed for it); decodeTransport "NOT UPDATED FOR X5
      YET"; Sil2 HX3 modes "not yet implemented for X5"; MAKI Ultra
      tally_rest_state "NOT YET IMPLEMENTED" (set_tally_rest_state not listed
      for it). The deprecated POST /capture?location=... is not included.

  - models: [all]
    severity: info
    text: >
      Document inconsistencies, resolved as follows. X1 picture: the
      description and GET use TWODNR but the POST example sends TwoDNR;
      set_2dnr sends TWODNR (MAKI Ultra documents TwoDNR). MAKI Ultra Sil2:
      ModeSel is listed as hx3_264_2160p60 and so on but the example body
      sends "NDI|HX3_H264_2160p60"; the listed values are used. Sil2 codec
      path: the 2.0 tables and 2.1 use /sil2codec and /sil2enc, the 2.0 curl
      examples /birddogsil2codec and /birddogsil2enc; the table path is used.
      Image reset: the request URL is /RestImage, the description says
      /ResetImage; the URL is used. NDIGrpName and NDIOffSnSrc 2.0 curl
      examples post to /NdiGrpName and /NdiOffSnSrc; the endpoint heading's
      spelling is used. Wi-Fi Enable and DhcpEnable are documented as On/Off
      and dhcp/static but the example reply shows "1"; the documented values
      are sent. The X1 and MAKI preset mode is documented as '"PTZonly" &
      "Birddog" or "Camera"'; all three are accepted. MAKI Ultra tuning is
      listed as -10 to 245 and WBSensitivity 0-2 while the example shows
      "Middle". The P200 A2/A3 IRCutFilter cell reads "NoiseReduction", so
      set_ir_cut_filter is not listed for it. 2.0 ExpCompLvl is 0-14 in the
      tables, but the P200 A2/A3 cell adds "change to Range(-128, 127)" and
      the example sends "-123"; 0-14 is used. AnalogAudiooutputselect is
      listed for every 2.0 camera in the table, but the section text says it
      is not present on P200/A200/A300, P100/PF120 and P4K/P400; it is listed
      only for P110, P120 and P240. Likewise the 2.0 videooutputinterface
      text says the mode is not present on P4K/P400 while its table lists
      LowLatency and NormalMode for them; the table is followed.

  - models: [all]
    severity: info
    text: >
      The camera pushes nothing. About, encoder, exposure, picture, white
      balance and PTZ setup are polled every 5 seconds on every camera, and
      tally, PTZ position and decoder status every 5 seconds on the cameras
      that serve them; every other endpoint a camera serves (transport,
      discovery server, audio, video output, operation mode, Sil2, secondary
      protocol, colour matrix, advanced, external, detail, gamma, network,
      Wi-Fi, genlock and failover, decoder setup, the decoder's connection) is
      read on connecting and every 30 seconds, each request naming the cameras
      that serve it. A POST with a JSON body has its endpoint read again at
      once; a preset recall and an image reset read exposure, picture, white
      balance, colour matrix, advanced and PTZ position again. The operation
      mode and the P400/P4K output mode are plain text, read by their words.
      The other plain-text replies (version, hostname, NDI group names,
      off-subnet list) and the NDI source list (an object keyed by source
      name) are not in the state: the format cannot read a plain-text HTTP
      reply by its path, nor the members of a JSON object, so they stay
      available through their get_ commands. Keys some cameras report but
      neither document defines (FreeD, SmartExposure, DRC, NearLimit,
      Portrait, GTuning and others) are not settable here except through the
      set_<endpoint> JSON commands.

  - models: [all]
    severity: info
    text: >
      Passwords, SRT passphrases and RTMP stream keys are readable through
      the Sil2 encode and secondary protocol endpoints, and settable, but are
      not kept in the state, which every consumer of a device can see; read
      them with get_sil2_encode or get_secondary_protocol. The camera does
      not report which preset was recalled last, and presets cannot be read
      back (API limit); recall_preset and save_preset therefore have no state.

  - models: [x5-ultra, x4-ultra]
    severity: info
    text: >
      BirdDog states that API 2.1 is fully supported on X5 Ultra from firmware
      6.1.034 and on X4 Ultra from firmware 6.1.31. Earlier firmware may lack
      endpoints.
