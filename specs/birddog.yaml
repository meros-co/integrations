              rtsp_auth: "$.RTSP.AuthEnable", rtsp_port: "$.RTSP.Port", rtsp_name: "$.RTSP.StreamName", rtsp_user: "$.RTSP.UserName",
              rtsp_url: "$.RTSP.ConnectionURL",
              srt_mode: "$.SRT.mode", srt_ip: "$.SRT.IPAddress", srt_port: "$.SRT.Port", srt_latency: "$.SRT.latency",
              srt_enc: "$.SRT.Encryption", srt_key: "$.SRT.pbkeylen", srt_id: "$.SRT.streamid", srt_url: "$.SRT.ConnectionURL",
              rtmp_sel: "$.RTMP.ServerSelection", rtmp_server: "$.RTMP.Server", rtmp_auth: "$.RTMP.AuthEnable",
              rtmp_user: "$.RTMP.UserName", rtmp_url: "$.RTMP.ConnectionURL" }
      state:
        encoder.sil2_stream.protocol: "{protocol}"
        encoder.sil2_stream.haivision_player: { value: "{haivision}", map: { "true": true, "false": false } }
        encoder.sil2_stream.rtsp.authentication: { value: "{rtsp_auth}", map: { "1": true, "0": false } }
        encoder.sil2_stream.rtsp.port: "{rtsp_port}"
        encoder.sil2_stream.rtsp.stream_name: "{rtsp_name}"
        encoder.sil2_stream.rtsp.user_name: "{rtsp_user}"
        encoder.sil2_stream.rtsp.connection_url: "{rtsp_url}"
        encoder.sil2_stream.srt.mode: "{srt_mode}"
        encoder.sil2_stream.srt.ip_address: "{srt_ip}"
        encoder.sil2_stream.srt.port: "{srt_port}"
        encoder.sil2_stream.srt.latency: "{srt_latency}"
        encoder.sil2_stream.srt.encryption: { value: "{srt_enc}", map: { "true": true, "false": false, "1": true, "0": false } }
        encoder.sil2_stream.srt.key_length: "{srt_key}"
        encoder.sil2_stream.srt.stream_id: "{srt_id}"
        encoder.sil2_stream.srt.connection_url: "{srt_url}"
        encoder.sil2_stream.rtmp.server_selection: "{rtmp_sel}"
        encoder.sil2_stream.rtmp.server: "{rtmp_server}"
        encoder.sil2_stream.rtmp.authentication: { value: "{rtmp_auth}", map: { "1": true, "0": false } }
        encoder.sil2_stream.rtmp.user_name: "{rtmp_user}"
        encoder.sil2_stream.rtmp.connection_url: "{rtmp_url}"
    # 2.1 /secondary_protocol: each protocol's settings; passwords,
    # passphrases and stream keys are left out of the state.
    - path: "^/secondary_protocol$"
      json: { srt_mode: "$.SRT.connection_type", srt_port: "$.SRT.port", srt_latency: "$.SRT.latency_ms", srt_enc: "$.SRT.encryption",
              srt_len: "$.SRT.encryption_length", srt_url: "$.SRT.connection_url",
              rtsp_name: "$.RTSP.stream_name", rtsp_port: "$.RTSP.port", rtsp_auth: "$.RTSP.authentication", rtsp_user: "$.RTSP.user_name",
              rtsp_url: "$.RTSP.connection_url",
              rtmp_sel: "$.RTMP.server_selection", rtmp_server: "$.RTMP.server_url", rtmp_auth: "$.RTMP.authentication",
              rtmp_url: "$.RTMP.connection_url" }
      state:
        encoder.secondary.srt.mode: "{srt_mode}"
        encoder.secondary.srt.port: "{srt_port}"
        encoder.secondary.srt.latency: "{srt_latency}"
        encoder.secondary.srt.encryption: { value: "{srt_enc}", map: { "enable": true, "disable": false } }
        encoder.secondary.srt.encryption_length: "{srt_len}"
        encoder.secondary.srt.connection_url: "{srt_url}"
        encoder.secondary.rtsp.stream_name: "{rtsp_name}"
        encoder.secondary.rtsp.port: "{rtsp_port}"
        encoder.secondary.rtsp.authentication: { value: "{rtsp_auth}", map: { "enable": true, "disable": false } }
        encoder.secondary.rtsp.user_name: "{rtsp_user}"
        encoder.secondary.rtsp.connection_url: "{rtsp_url}"
        encoder.secondary.rtmp.server_selection: "{rtmp_sel}"
        encoder.secondary.rtmp.server_url: "{rtmp_server}"
        encoder.secondary.rtmp.authentication: { value: "{rtmp_auth}", map: { "enable": true, "disable": false } }
        encoder.secondary.rtmp.connection_url: "{rtmp_url}"
    # 2.1 Network Settings.
    - path: "^/EthSetup$"
      json: { mode: "$.IpMode", ip: "$.IpAddr", mask: "$.NetMask", gw: "$.GateWayIp", dns1: "$.DnsSvrIpFirst", dns2: "$.DnsSvrIpSecond",
              timeout: "$.DhcpTimeout", fb_ip: "$.DhcpFallbackIPAddr", fb_mask: "$.DhcpFallbackNetMask", fb_gw: "$.DhcpFallbackGateWayIp" }
      state:
        network.ethernet.ip_mode: "{mode}"
        network.ethernet.ip_address: "{ip}"
        network.ethernet.netmask: "{mask}"
        network.ethernet.gateway: "{gw}"
        network.ethernet.dns_primary: "{dns1}"
        network.ethernet.dns_secondary: "{dns2}"
        network.ethernet.dhcp_timeout: "{timeout}"
        network.ethernet.fallback_ip: "{fb_ip}"
        network.ethernet.fallback_netmask: "{fb_mask}"
        network.ethernet.fallback_gateway: "{fb_gw}"
    - path: "^/WifiSetup$"
      json: { enabled: "$.Enable", dhcp: "$.DhcpEnable", enc: "$.EncryptMode", ssid: "$.Ssid", ip: "$.IpAddr", mask: "$.NetMask",
              gw: "$.GateWayIp", dns: "$.Dns" }
      state:
        network.wifi.enabled: { value: "{enabled}", map: { "On": true, "Off": false, "1": true, "0": false } }
        network.wifi.dhcp: { value: "{dhcp}", map: { "dhcp": true, "static": false, "1": true, "0": false } }
        network.wifi.encryption: "{enc}"
        network.wifi.ssid: "{ssid}"
        network.wifi.ip_address: "{ip}"
        network.wifi.netmask: "{mask}"
        network.wifi.gateway: "{gw}"
        network.wifi.dns: "{dns}"
    - path: "^/NetworkSetup$"
      json: { nic: "$.PreferredNIC", dante: "$.Dante" }
      state:
        network.preferred_nic: "{nic}"
        network.dante: { value: "{dante}", map: { "On": true, "Off": false } }
    - path: "^/Genlock_Failover_Source$"
      json: { genlock: "$.GenlockSource", failover: "$.FailoverSource" }
      state:
        ndi.genlock_source: "{genlock}"
        ndi.failover_source: "{failover}"
    # Decoder Settings.
    - path: "^/decodesetup\\?ChNum=1$"
      json: { audio: "$.NDIAudio", screensaver: "$.ScreenSaverMode", colour: "$.ColorSpace", tally: "$.TallyMode" }
      state:
        decoder.ndi_audio: "{audio}"
        decoder.screensaver: "{screensaver}"
        decoder.color_space: "{colour}"
        decoder.tally_mode: "{tally}"
    - path: "^/connectTo\\?location=([A-Za-z]+)$"
      json: { host: "$.sourceHostname", stream: "$.sourceStreamName", ip: "$.sourceIP", port: "$.sourcePort" }
      state:
        connections.{1}.hostname: "{host}"
        connections.{1}.stream_name: "{stream}"
        connections.{1}.ip_address: "{ip}"
        connections.{1}.port: "{port}"
    # Plain-text replies told apart by their words: the operation mode, and
    # the P400 and P4K output mode.
    - match: "^(encode|decode|dual)$"
      state: { device.operation_mode: "{1}" }
    - match: "^(LowLatency|NormalMode)$"
      state: { video_output.mode: "{1}" }

    # Re-reads: a POST with a JSON body has its endpoint read again, since
    # the reply can still show the old value (see quirks). A GET carries no
    # body, so its reply never asks again.
    - path: "^/(encodesetup|birddogexpsetup|birddogpicsetup|birddogwbsetup|birddogptzsetup|birddogcmsetup|birddogadvancesetup|birddogexternalsetup|birddogdetsetup|birddoggammasetup|encodeTransport|decodeTransport|NDIDisServer|analogaudiosetup|videooutputinterface|sil2codec|sil2enc|secondary_protocol|EthSetup|WifiSetup|NetworkSetup|Genlock_Failover_Source|tally|birddogptzcontrol)$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: "/{1}" }]
    - path: "^/decodesetup\\?ChNum=1$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: /decodesetup, query: { ChNum: "1" } }]
    - path: "^/connectTo\\?location=([A-Za-z]+)$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: /connectTo, query: { location: "{1}" } }]
    # A preset recall moves the camera and, in Camera or Birddog preset mode,
    # restores its picture settings; an image reset changes every image
    # setting.
    - path: "^/(recall|RestImage)$"
      json: {}
      then_send:
        - { method: GET, path: /birddogexpsetup }
        - { method: GET, path: /birddogpicsetup }
        - { method: GET, path: /birddogwbsetup }
        - { models: *v21, method: GET, path: /birddogptzcontrol }
        - { models: *colour_matrix, method: GET, path: /birddogcmsetup }
        - { models: *advanced, method: GET, path: /birddogadvancesetup }

