spec: 1
id: birddog
name: BirdDog cameras (RESTful API)
vendor: BirdDog
category: camera

# BirdDog's RESTful API: GET and POST on port 8080, JSON bodies whose values
# are all strings, and plain text for a few endpoints. BirdDog publishes it in
# two generations, linked from https://birddog.tv/api/: API 2.0 for the
# P-series and A-series PTZ cameras (and converters), and API 2.1 for the
# X-series and MAKI Ultra. Endpoint names are shared, but each generation, and
# each camera, documents different keys and ranges, so commands carry a model
# suffix where the ranges differ (_x4u, _x5u, _maki; _p for every 2.0 camera;
# _p200 for P200/A200/A300, _p100 for P100/PF120/P110/P120, _p400 for
# P400/P4K/P240). Summaries end with the method and endpoint.
#
# Pan, tilt, zoom, focus and presets are also reachable over VISCA, which the
# native `visca` module covers (specs/visca.yaml, model birddog); see quirks.
source:
  - title: "BirdDog RESTful API 2.0, API and SDK Documentation (Version 2.0.0)"
    author: BirdDog
    url: https://birddog.tv/AV/API/index.html
    note: >
      Manufacturer document, the "P-Series & Converters" link on
      https://birddog.tv/api/, retrieved 2026-10-01; an HTML page without page
      numbers, so references are to its sections. Endpoints, example requests
      (curl) and example replies by section: API Methods - BasicDeviceInfo
      (about, hostname, reboot, restart, version), DEVICESETTINGS
      (analogaudiosetup, operationmode, videooutputinterface), NDIENCODE
      (encodeTransport, encodesetup), NDIDECODE (capture, connectTo,
      decodeTransport, decodesetup, decodestatus), NDIFINDER (List,
      NDIDisServer, NDIGrpName, NDIOffSnSrc, refresh, reset), PTZ
      (birddogptzsetup, recall, save), EXPOSURE, WHITEBALANCE,
      PICTURESETTINGS, COLOURMATRIX, ADVANCEDSETTINGS, EXTERNALSETTINGS,
      DETAIL, GAMMA and SILICON2. Each section's DEVICE SUPPORT table gives
      the keys and ranges per camera (columns P200 A2_A3, P200 A4_A5, A200
      Gen1/Gen2, A300 Gen1/Gen2, P100, PF120, P110, P120, P400, P4K, P240);
      models and ranges here follow those tables.
  - title: "X1, X1 Ultra, MAX & X4 Ultra & X5 Ultra Cameras (BirdDog API 2.1, Postman documentation, published 2025-01-16)"
    author: BirdDog
    url: https://documenter.getpostman.com/view/29602224/2sAYHxn45i
    note: >
      Manufacturer document, the "X-Series & MAX" link on
      https://birddog.tv/api/, retrieved 2026-10-01 (collection data from
      documenter.gw.postman.com). Folders: Device Information, Network
      Settings, Encoder Settings, Decoder Settings, Camera PTZ and Colour
      Settings, NDI Finder Settings, Miscellaneous Camera Settings. Each
      folder's description lists the keys and ranges per camera; each request
      has an example body and reply. States that all calls use port 8080 and
      that API 2.1 is fully supported on X5 Ultra from firmware 6.1.034 and
      X4 Ultra from 6.1.31.
  - title: "Maki Ultra 12 & 20x (BirdDog API 2.1, Postman documentation, published 2025-08-21)"
    author: BirdDog
    url: https://documenter.getpostman.com/view/29602224/2sB3BLiSnk
    note: >
      Manufacturer document, the "MAKI Ultra" link on https://birddog.tv/api/,
      retrieved 2026-10-01, in the same folder structure as the X-series
      collection, with MAKI Ultra keys and ranges. BirdDog's earlier "RESTful
      API v1.0" PDF (bird-dog.tv/extra/BirdDog_RESTful_API_1.0.pdf) is
      superseded by these and no longer served; it was not used.

transport:
  type: http
  port: 8080
  scheme: http
  auth: none
  timeout_ms: 4000
  probe: { method: GET, path: /version }

ports:
  - { port: 8080, protocol: http, role: control }

