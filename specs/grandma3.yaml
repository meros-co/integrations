    summary: "Press and release the key of an executor on a page in a data pool"
    params:
      datapool: { type: int, min: 1, max: 9999, required: true }
      page:     { type: int, min: 1, max: 9999, required: true }
      executor: { type: int, min: 101, max: 490, required: true }
    send:
      - { address: "/DataPool{datapool}/Page{page}/Key{executor}", args: [ { value: "1", type: int } ] }
      - { address: "/DataPool{datapool}/Page{page}/Key{executor}", args: [ { value: "0", type: int } ] }
    returns: none

  object_key_down:
    summary: "Press the key function of a pool object by its enumerated address, e.g. 13.13.1.6.1 (si <function>,1)"
    params:
      object:   { type: string, max_length: 32, pattern: "^[0-9]+(\\.[0-9]+)+$", required: true }
      function: { type: enum, values: ["Go+", "Go-", "<<<", ">>>", "Flash", "Black", "Temp", "Swap", "On", "Off", "Toggle", "Top", "Kill", "Pause", "Select", "SelectFixtures", "Rate1", "Speed1", "DoubleSpeed", "HalfSpeed", "Learn", "LearnSpeed", "ReSync", "FastSync", "Time"], required: true }
    send: { address: "/{object}", args: [ { value: "{function}", type: string }, { value: "1", type: int } ] }
    returns: none

  object_key_up:
    summary: "Release the key function of a pool object by its enumerated address (si <function>,0)"
    params:
      object:   { type: string, max_length: 32, pattern: "^[0-9]+(\\.[0-9]+)+$", required: true }
      function: { type: enum, values: ["Go+", "Go-", "<<<", ">>>", "Flash", "Black", "Temp", "Swap", "On", "Off", "Toggle", "Top", "Kill", "Pause", "Select", "SelectFixtures", "Rate1", "Speed1", "DoubleSpeed", "HalfSpeed", "Learn", "LearnSpeed", "ReSync", "FastSync", "Time"], required: true }
    send: { address: "/{object}", args: [ { value: "{function}", type: string }, { value: "0", type: int } ] }
    returns: none

  object_press_key:
    summary: "Press and release the key function of a pool object by its enumerated address"
    params:
      object:   { type: string, max_length: 32, pattern: "^[0-9]+(\\.[0-9]+)+$", required: true }
      function: { type: enum, values: ["Go+", "Go-", "<<<", ">>>", "Flash", "Black", "Temp", "Swap", "On", "Off", "Toggle", "Top", "Kill", "Pause", "Select", "SelectFixtures", "Rate1", "Speed1", "DoubleSpeed", "HalfSpeed", "Learn", "LearnSpeed", "ReSync", "FastSync", "Time"], required: true }
    send:
      - { address: "/{object}", args: [ { value: "{function}", type: string }, { value: "1", type: int } ] }
      - { address: "/{object}", args: [ { value: "{function}", type: string }, { value: "0", type: int } ] }
    returns: none

  object_fader:
    summary: "Set a fader function of a pool object by its enumerated address, in percent (sif <function>,3,value)"
    params:
      object:   { type: string, max_length: 32, pattern: "^[0-9]+(\\.[0-9]+)+$", required: true }
      function: { type: enum, values: ["FaderMaster", "FaderCrossFade", "FaderCrossFadeA", "FaderCrossFadeB", "FaderTemp", "FaderRate", "FaderSpeed", "FaderTime"], default: FaderMaster }
      level:    { type: float, min: 0, max: 100, required: true }
    send: { address: "/{object}", args: [ { value: "{function}", type: string }, { value: "3", type: int }, { value: "{level}", type: float } ] }
    returns: none

  object_fader_relative:
    summary: "Move a fader function of a pool object by a percentage (sii <function>,handle,delta)"
    params:
      object:   { type: string, max_length: 32, pattern: "^[0-9]+(\\.[0-9]+)+$", required: true }
      function: { type: enum, values: ["FaderMaster", "FaderCrossFade", "FaderCrossFadeA", "FaderCrossFadeB", "FaderTemp", "FaderRate", "FaderSpeed", "FaderTime"], default: FaderMaster }
      handle:   { type: int, min: 0, max: 3, default: 1 }
      delta:    { type: int, min: -100, max: 100, required: true }
    send: { address: "/{object}", args: [ { value: "{function}", type: string }, { value: "{handle}", type: int }, { value: "{delta}", type: int } ] }
    returns: none

  command:
    summary: "Raw grandMA3 command-line input, executed as typed (/cmd,s)"
    params:
      line: { type: string, max_length: 1024, required: true }
    send: { address: "/cmd", args: [ { value: "{line}", type: string } ] }
    returns: none

  go_executor:
    summary: "Go+: next cue, using its fade and delay times (an executor on the selected page)"
    params:
      executor: { type: int, min: 101, max: 490, required: true }
    send: { address: "/cmd", args: [ { value: "Go+ Executor {executor}", type: string } ] }
    returns: none

  go_back_executor:
    summary: "Go-: previous cue, using its normal fade time (an executor on the selected page)"
    params:
      executor: { type: int, min: 101, max: 490, required: true }
    send: { address: "/cmd", args: [ { value: "Go- Executor {executor}", type: string } ] }
    returns: none

  top_executor:
    summary: "Top: fade to the first cue (an executor on the selected page)"
    params:
      executor: { type: int, min: 101, max: 490, required: true }
    send: { address: "/cmd", args: [ { value: "Top Executor {executor}", type: string } ] }
    returns: none

  on_executor:
    summary: "On: start or restart (an executor on the selected page)"
    params:
      executor: { type: int, min: 101, max: 490, required: true }
    send: { address: "/cmd", args: [ { value: "On Executor {executor}", type: string } ] }
    returns: none

  off_executor:
    summary: "Off: switch off (an executor on the selected page)"
