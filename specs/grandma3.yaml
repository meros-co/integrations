telemetry:
  # Object Playback Feedback (OSC page and Advanced Examples): key feedback as
  # <Key function>,0|1[,text] and fader feedback as <Fader function>,<handle>,<percent>.
  updates:
    - address: '^/13\.13\.1\.6\.(\d+)$'
      arg_types: sis
      state:
        "sequences.{1}.keys.{arg0}": { value: "{arg1}", map: { "0": false, "1": true } }
        "sequences.{1}.text": "{arg2}"
    - address: '^/13\.13\.1\.6\.(\d+)$'
      arg_types: sif
      state:
        "sequences.{1}.faders.{arg0}": "{arg2}"
    - address: '^/13\.12\.(\d+)\.(\d+)$'
      arg_types: si
      state:
        "masters.{1}.{2}.keys.{arg0}": { value: "{arg1}", map: { "0": false, "1": true } }
    - address: '^/13\.12\.(\d+)\.(\d+)$'
      arg_types: sif
      state:
        "masters.{1}.{2}.faders.{arg0}": "{arg2}"

state:
  sequences.*.keys.*:   { type: bool, description: "Key feedback for sequence N (/13.13.1.6.N), by key function name (Go+, Flash, Temp, ...): true while MA reports 1" }
  sequences.*.text:     { type: string, description: "Sequence feedback text as MA sends it: sequence name, cue number and cue name" }
  sequences.*.faders.*: { type: float, unit: "%", description: "Fader feedback for sequence N, by fader function name (Master, CrossFade, ...), 0.0-100.0" }
  masters.*.*.keys.*:   { type: bool, description: "Key feedback for master X.Y (/13.12.X.Y; 2.1 is the grand master), by key function name" }
  masters.*.*.faders.*: { type: float, unit: "%", description: "Fader feedback for master X.Y, by fader function name, 0.0-100.0" }

quirks:
  - models: [all]
    severity: critical
    text: >
      OSC input is off until configured: Menu - In & Out - OSC, Enable Input on (the same switch
      as OSC Input in Station Control, a session-wide setting), and on the configuration line
      whose Port and Mode the device is registered with: Mode UDP, Receive Yes for the executor
      and object messages, and Receive Command Yes for every /cmd command ("This setting is
      independent of the general receive setting"). Without them the console drops the messages
      and, with no acknowledgement, every command still reports unverified.

  - models: [all]
    severity: critical
    text: >
      The port is a per-line setting with no default stated on the OSC page ("Port: Specifies the
      network port of the incoming and/or outgoing OSC packets"); MA's QLab and Open Stage Control
      use-case pages call 8000 the default, which is the fallback here. Register the device with
      the port of its configuration line.

  - models: [all]
    severity: critical
    text: >
      The configuration line's Prefix must be empty. With a prefix set, "only OSC messages
      beginning with the specified prefix are processed", and this spec's addresses carry none;
      the format has no optional address segment for an installation-specific prefix.

  - models: [all]
    severity: warning
    text: >
      The console acknowledges nothing, so every command reports unverified. It does send
      feedback (Object Playback Feedback, with Send Yes): for a sequence, /13.13.1.6.X,sis,
      <Key function>,1|0,"<SequenceName CueNumber CueName>" and /13.13.1.6.X,sif,<Fader
      function>,<handle>,<percent>; for a master, /13.12.X.Y,si and sif; also for groups, presets,
      sounds, worlds, plugin components, screen configurations and timers (formats not given).
      That feedback goes to the line's Destination IP and Port, not back to the sending socket.
      With the feedback_port setting, the core listens on that local port; the console's line
      then needs Send Yes, Destination IP this host and Port feedback_port, and the line's
      Mode, Port and prefix rules above still apply (an outgoing prefix would change the
      addresses, so it must stay empty). Only the two documented shapes are read: a sequence
      (/13.13.1.6.X) and a master (/13.12.X.Y), each as sis/si key feedback and sif fader
      feedback, told apart by their OSC type tags; sii (relative encoder) feedback and the
      other object kinds, whose formats MA does not give, are not read. The sequence address
      is the one the OSC page prints; if 2.5 moved sequences (see the next quirk), their
      feedback is not matched. Key state is the 0/1 MA sends for that key function, and the
      sequence text is MA's "<SequenceName> <CueNumber> <CueName>" (";" between name and cue
      number since 2.5), kept as sent. Mode TCP is not used: MA does not document its framing
      or which side connects.

  - models: [all]
    severity: warning
    text: >
      Object-tree addresses (object_* commands) are enumerated positions in the show's directory,
      and MA warns that "the address in the grandMA3 directory structure may change between
      software versions". The OSC page still gives sequences as /13.13.1.6.X, but in 2.5 Shapes
      moved to destination 4 of each data pool and the Data Pools page numbers sequence 1 as
      1.7.1, which suggests sequences are now at 13.13.<pool>.7.X; the manual does not say. Look
      the address up on the console with Lua "Printf( ObjectList( 'Sequence 1' )[ 1 ]:Addr() )"
      and pass it as `object` without the leading slash.

  - models: [all]
    severity: warning
    text: >
      /cmd runs any command-line input, including Delete, Store, NewShow and Patch ("/cmd,s,Store
      Cue 1" and "Patch Fixture 1 3.42" are MA's own examples); intent cannot be validated. MA
      does not say which user's rights apply to OSC commands.

  - models: [all]
    severity: info
    text: >
      Key, fader and encoder messages act on the executor's assigned functions: a Key press runs
      whatever key function the executor has (Go+, Flash, Toggle and so on), and the Encoder runs
      EncoderLeft (-1) or EncoderRight (1) when those are assigned, otherwise it moves the fader
      by the given percentage. The table lists both meanings for the same values. OSC controls
      every handle even where the executor has no physical one. Executors are 101-190, 201-290,
      301-390 and 401-490, with Xkeys at 191-198 and 291-298; which exist depends on the page.

  - models: [all]
    severity: info
    text: >
      Addresses without a page or data pool act on the selected page and data pool, which the
      operator can change; the _page and _datapool_page forms fix the target. The SendOSC page
      says "When addressing an executor, a page must be specified as well", while the Advanced
      Examples table documents /FaderX and /KeyX without one; the unpaged forms follow the table.

  - models: [all]
    severity: info
    text: >
      Address names (DataPool, Page, Fader, Encoder/ExecutorKnob, Key) are editable per line and
      case-sensitive; this spec uses the defaults "DataPool", "Page", "Fader", "Encoder" and
      "Key" as shown in MA's examples. The OSC menu calls the encoder address "ExecutorKnob" but
      every example uses /EncoderX. Fader values assume the default FaderRange 0-100; a line
      with FaderRange 255 maps 0-255 to 100%.

  - models: [all]
    severity: info
    text: >
      Fader values are sent as OSC float (/DataPool2/Page10/Fader302,f,75.5); fader_fade sends
      two integers, value and fade seconds, after the SendOSC example /Page1/Fader201,ii,100,5,
      the only place MA documents the fade argument. No upper bound for the fade is documented;
      3600 s is the bound used here, also for the command-line Fade forms.

  - models: [all]
    severity: info
    text: >
      Object key and fader function names are the assign-menu and keyword names. MA shows only
      Flash, Black and FaderMaster on the wire; the other spellings (for example Go+, Swap,
      FaderCrossFade) are not confirmed for OSC. Goto, Load, At, Call and LogIn are left out:
      Goto and Load open a pop-up, and the others need other object types. In object_fader the
      second argument is sent as 3, as the OSC page's control table shows; in
      object_fader_relative it is the handle type (feedback names 0 physical rotary knob and 1
      on-screen knob or command), default 1.

  - models: [all]
    severity: info
    text: >
      Command-line forms follow each keyword's documented syntax. Some combinations are composed
      from that syntax rather than copied from an example: the Page X.Y form for Goto, Load and
      the On/Off keywords, "FaderMaster Master 2.1 At" for the grand master, "Group N At",
      Go+/Off/Pause on timecode shows and timers, and Executor, Page and Sequence targets for
      Rate1, Speed1, DoubleSpeed, HalfSpeed and LearnSpeed. Levels are whole percent. Cue numbers
      are taken as up to four digits with up to three decimals, and pool numbers (sequences,
      macros, groups, presets, views, worlds, timecodes, timers, data pools) up to 9999 and
      fixtures up to 99999; MA documents no upper bounds for these on the pages used.

  - models: [all]
    severity: info
    text: >
      OSC bundles are not supported; each message is sent on its own. The OSC buffer is 2 048
      bytes (Release Notes 2.0), so /cmd strings are limited to 1024 characters here.

  - models: [grandma3-onpc]
    severity: info
    text: >
      grandMA3 onPC runs the same software as the consoles ("All grandMA3 components, regardless
      of hardware, use the same software"); the network interface used for OSC is chosen with
      Interface in the OSC menu.
