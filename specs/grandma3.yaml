    returns: none

  key_up_page:
    summary: "Release the key of an executor on a page in the selected data pool (i 0)"
    params:
      page:     { type: int, min: 1, max: 9999, required: true }
      executor: { type: int, min: 101, max: 490, required: true }
    send: { address: "/Page{page}/Key{executor}", args: [ { value: "0", type: int } ] }
    returns: none

  press_key_page:
