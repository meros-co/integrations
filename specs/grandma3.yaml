spec: 1
id: grandma3
name: MA Lighting grandMA3
vendor: MA Lighting
category: lighting

source:
  - title: grandMA3 User Manual, Remote In and Out > OSC (Open Sound Control)
    author: MA Lighting Technology GmbH
    url: https://help.malighting.com/grandMA3/2.5/HTML/remote_inputs_osc.html
    note: >
      Version 2.5 (latest published manual; retrieved 2026-10-01; text unchanged in substance
      from 2.3 and 2.4). OSC structure "(/prefix)/[OSC Address],[OSC Type],[Value]"; the prefix
      (no slashes) filters incoming and is prepended to outgoing messages; OSC bundles are not
      supported; the OSC menu (Menu - In & Out - OSC: Enable Input, Enable Output, and per
      configuration line Destination IP, Mode UDP or TCP, Port "of the incoming and/or outgoing
      OSC packets", Prefix, Page/Fader/ExecutorKnob/Key address names, FaderRange, Receive, Send,
      Receive Command, Send Command); Command Line Control (/cmd with a string, "Receive Command
      to Yes"; examples "FaderMaster Page 1.201 At 50 Fade 5", "Fixture 1 At 75", "Go+ Exec 402");
      Object Playback Control table (Sequence X at /13.13.1.6.X: si <Key function>,1 press and
      ,0 release; sif <Fader function>,3,0...100; sii <Fader function>,0...3,-100...100) and its
      warning that object-tree addresses may change between versions; Object Playback Feedback
      (Send must be Yes; feedback for sequences, masters, groups, presets, sounds, worlds, plugin
      components, screen configurations and timers).
  - title: grandMA3 User Manual, Remote In and Out > OSC > Advanced Examples
    url: https://help.malighting.com/grandMA3/2.5/HTML/osc_advanced_examples.html
    note: >
      Version 2.5. Executor Control table: /FaderX, /PageY/FaderX, /DataPoolZ/FaderX,
      /DataPoolZ/PageY/FaderX with i or f 0...100 (T as 1, F as 0), examples /Fader201,i,100 and
      /DataPool2/Page10/Fader302,f,75.5; /EncoderX (and page/data pool forms) with i or f
      -100...100, -1 EncoderLeft, 1 EncoderRight; /KeyX (and forms) with i or f 1 press, 0
      release, T press, F release. Hints: OSC controls every handle function whether or not a
      physical handle exists; DataPool, Page, Fader, Encoder and Key address names and the fader
      range can be edited. Object Playback Feedback table: Sequence X /13.13.1.6.X sis
      <Key function>,0|1,<SequenceName CueNumber CueName> (example
      /13.13.1.6.1,sis,Flash,1,Strobe 1 Cue 1), sif <Fader function>,0...3,0.0...100.0, sii
      <Fader function>,0...3,-100...100; Master X.Y /13.12.X.Y si, sif, sii.
  - title: grandMA3 User Manual, SendOSC Keyword and OSC Keyword
    url: https://help.malighting.com/grandMA3/2.5/HTML/keyword_sendosc.html
    note: >
      Version 2.5. Example "/Page1/Fader201,ii,100,5" (value 100 with a fade time of 5 s); key
      value 0 is not pressed, greater than 0 is pressed; faders, executor knobs and buttons accept
      Integer32, Float32, True, False and Nil; the Page, Fader, ExecutorKnob and Key address names
      are case-sensitive; "/cmd,s,Store Cue 1". The OSC keyword page (keyword_osc.html) covers
      listing, importing and exporting the OSC configuration only.
  - title: grandMA3 User Manual, Use Cases (QLab, Open Stage Control, TouchOSC, zactrack)
    url: https://help.malighting.com/grandMA3/2.5/HTML/osc_examples.html
    note: >
      Pages osc_qlab.html, osc_open_stage_control.html, osc_touchosc.html and osc_zactrack.html
      (still marked version 2.4). Port 8000 "is the default" in the QLab and Open Stage Control
      pages; the Page, Fader and Key address names default to "Page", "Fader" and "Key"; the
      fader range default is 0 to 100; /cmd needs Receive Command on the line.
  - title: grandMA3 User Manual, What are Executors; Assign Object to an Executor; Grand Masters; Data Pools
    url: https://help.malighting.com/grandMA3/2.5/HTML/executor.html
    note: >
      Version 2.5. Executors 101-190, 201-290, 301-390 and 401-490, Xkeys 191-198 and 291-298, up
      to 9 999 pages per data pool (executor.html). Key functions (Go+, Go-, <<<, >>>, Black,
      Flash, Temp, Swap, On, Off, Toggle, Top, Kill, Pause, Select, SelectFixtures, Rate1, Speed1,
      DoubleSpeed, HalfSpeed, Learn, LearnSpeed, ReSync, FastSync, Time) and fader functions
      (Master, CrossFade, CrossFadeA, CrossFadeB, Temp, Rate, Speed, Time) from
      executor_assign.html. Master 2.1 is the grand master (masters_grand.html). In 2.5 Shapes
      moved to destination 4 of each data pool and sequence 1 is data pool object 1.7.1
      (datapool.html).
  - title: grandMA3 User Manual, keyword pages (version 2.5)
    url: https://help.malighting.com/grandMA3/2.5/HTML/command_syntax_keywords.html
    note: >
      Every /cmd string below follows its keyword page, keyword_<name>.html: Go+ ("Go+ Executor
      101", "Go+ Macro 2"), Go-, Goto ("Goto Cue 105 Executor 104", "... Fade 2", "Goto Sequence
      42 Cue Previous"), Load ("Load Executor 114 Cue 5"), Top ("Top Executor 105 Fade 3", "Top
      Timecode 1"), On (2.4 page; the 2.5 page is empty), Off ("Off Sequence 1"), Toggle, Kill,
      Flash/Temp/Black/Swap/Pause (On/Off), >>> and <<< (">>> Page 5.211"), Select ("Select
      Executor 105", "Select DataPool 3"), Fix, Rate1, Speed1, DoubleSpeed, HalfSpeed,
      LearnSpeed, FaderMaster ("FaderMaster 205 At 50 Fade 5", "FaderMaster Sequence 1 At 30"),
      FaderTemp, FaderCrossFade, FaderCrossFadeA, FaderCrossFadeB, FaderRate, FaderTime, Page
      ("Page 2", "Next Page"), Macro, Blind, Freeze, Highlight, Solo, Clear, ClearAll,
      ClearSelection, ClearActive, Fixture, Group, Preset ("At Preset 21.45"), At, Zero, Release,
      View, World, Timecode, Timer, SaveShow.
  - title: grandMA3 Release Notes 2.0, 2.1, 2.3, 2.4, 2.5
    url: https://help.malighting.com/grandMA3/2.5/HTML/key_releasenotes.html
    note: >
      OSC buffer 2 048 bytes (2.0); feedback of the previous cue fixed (2.1); one space between
      sequence name and cue number in OSC messages (2.3); OSC output stopped after reload, and
      on-screen and hardware faders both report handle 3 (2.4, rn_bugfixes-2-4.html); delimiter
      between sequence name and cue number changed from space to ";" (2.5, rn_changes-2-5.html);
      Swap/Temp/Black feedback restored and TCP feedback-loop freeze fixed (2.5,
      rn_bugfixes-2-5.html).

# OSC over UDP to the port of an OSC configuration line with Receive (and, for /cmd, Receive
# Command) set to Yes and no Prefix. MA documents no default port on the OSC page; 8000 is the
# value the use-case pages call the default, and the host's configured port overrides it. The
# console never acknowledges a message. Its feedback (Object Playback Feedback, with Send Yes)
# goes to the line's Destination IP and Port, not to the sender's socket: set Destination IP to
# this host and Port to the feedback_port setting, and the core receives on that fixed local
# port (shared by every console sending there, each datagram routed by its source address).
# With feedback_port empty nothing is read back.
transport:
  type: osc-udp
  port: 8000
  reply: none
  listen_port: { setting: feedback_port }

settings:
  feedback_port: { type: int, min: 1, max: 65535 }

