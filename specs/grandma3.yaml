commands:
  fader:
    summary: "Set the fader of an executor on the selected page in the selected data pool, in percent (/[DataPoolZ/][PageY/]FaderX, f)"
    params:
      executor: { type: int, min: 101, max: 490, required: true }
      level:    { type: float, min: 0, max: 100, required: true }
    send: { address: "/Fader{executor}", args: [ { value: "{level}", type: float } ] }
    returns: none

  fader_fade:
    summary: "Set the fader of an executor on the selected page in the selected data pool, in whole percent, with a fade time in seconds (ii)"
    params:
      executor: { type: int, min: 101, max: 490, required: true }
      level:    { type: int, min: 0, max: 100, required: true }
      fade:     { type: int, min: 0, max: 3600, required: true }
    send: { address: "/Fader{executor}", args: [ { value: "{level}", type: int }, { value: "{fade}", type: int } ] }
    returns: none

  encoder:
    summary: "Turn the encoder of an executor on the selected page in the selected data pool: move its fader by a percentage, or -1/1 to run an assigned EncoderLeft/EncoderRight function (i)"
    params:
      executor: { type: int, min: 101, max: 490, required: true }
      delta:    { type: int, min: -100, max: 100, required: true }
    send: { address: "/Encoder{executor}", args: [ { value: "{delta}", type: int } ] }
    returns: none

  key_down:
    summary: "Press (and hold) the key of an executor on the selected page in the selected data pool (i 1)"
    params:
      executor: { type: int, min: 101, max: 490, required: true }
    send: { address: "/Key{executor}", args: [ { value: "1", type: int } ] }
    returns: none

  key_up:
    summary: "Release the key of an executor on the selected page in the selected data pool (i 0)"
    params:
      executor: { type: int, min: 101, max: 490, required: true }
    send: { address: "/Key{executor}", args: [ { value: "0", type: int } ] }
    returns: none

  press_key:
    summary: "Press and release the key of an executor on the selected page in the selected data pool"
    params:
      executor: { type: int, min: 101, max: 490, required: true }
    send:
      - { address: "/Key{executor}", args: [ { value: "1", type: int } ] }
      - { address: "/Key{executor}", args: [ { value: "0", type: int } ] }
    returns: none

  fader_page:
    summary: "Set the fader of an executor on a page in the selected data pool, in percent (/[DataPoolZ/][PageY/]FaderX, f)"
    params:
      page:     { type: int, min: 1, max: 9999, required: true }
      executor: { type: int, min: 101, max: 490, required: true }
      level:    { type: float, min: 0, max: 100, required: true }
