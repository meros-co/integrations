      level:    { type: int, min: 0, max: 100, required: true }
      fade:     { type: int, min: 0, max: 3600, required: true }
    send: { address: "/Page{page}/Fader{executor}", args: [ { value: "{level}", type: int }, { value: "{fade}", type: int } ] }
    returns: none

  encoder_page:
    summary: "Turn the encoder of an executor on a page in the selected data pool: move its fader by a percentage, or -1/1 to run an assigned EncoderLeft/EncoderRight function (i)"
    params:
      page:     { type: int, min: 1, max: 9999, required: true }
