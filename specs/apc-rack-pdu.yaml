spec: 1
id: apc-rack-pdu
name: APC Rack PDU (SNMP)
vendor: APC (Schneider Electric)
category: other
implementation: native
reason: >
  SNMP: BER-encoded requests over UDP, matched to their responses, retransmitted, walked with GETBULK, and on v3
  authenticated and encrypted with keys derived from passwords (see generic-snmp). The PDU's outlets, banks,
  phases and sensors are table rows the agent lists only when walked, and its traps arrive on a port of the
  core's. The integration is the SNMP manager with PowerNet-MIB's Rack PDU objects named.

source:
  - title: "APC PowerNet MIB v4.6.0 (powernet460.mib, document APC_POWERNETMIB_EN), 09 Jul 2026"
    author: APC by Schneider Electric
    url: "https://www.se.com/ww/en/download/document/APC_POWERNETMIB_EN/"
    note: >
      The rPDU2 group (enterprises 318.1.1.26: ident, device, phase, bank, switched and metered outlets,
      temperature, humidity, discrete and analog sensors, group totals, phase-to-phase voltages, the advanced
      bank and phase tables) and the rPDU group (318.1.1.12: ident, load, outlets, power supply, status), every
      object's OID, syntax, access, units and enumeration, and the TRAP-TYPEs of the apc enterprise. Facts only
      (names, numbers, enumerations) are used; the MIB's text is not reproduced.
  - title: "Scripting with APC by Schneider Electric Switched Rack Power Distribution Units (PDUs), FAQ FA156163"
    author: Schneider Electric
    url: "https://www.se.com/ww/en/faqs/FA156163/"
    note: >
      AP86XX and AP89XX switched Rack PDUs are controlled through rPDU2's switched outlet table
      (rPDU2.rPDU2Outlet.rPDU2OutletSwitched) over SNMP v1 or v3; AP79XX switched Rack PDUs support outlet control
      through PowerNet-MIB too.
  - title: "RFC 3416, RFC 3418 and the SNMP RFCs generic-snmp cites"
    author: IETF
    url: "https://www.rfc-editor.org/rfc/rfc3416"
    note: "The protocol (GETBULK walks, SET, traps); the system group (sysDescr, sysUpTime...)."

models:
  - id: rack-pdu-2g
    name: "APC Rack PDU 2G and later (metered, switched, metered-by-outlet: AP84xx, AP86xx, AP88xx, AP89xx and others implementing rPDU2)"
    supports: [get, walk, set, refresh, set_adv_bank_config_bank_peak_current_reset, set_adv_bank_config_low_load_current_threshold, set_adv_bank_config_near_overload_current_threshold, set_adv_bank_config_overload_current_threshold, set_adv_bank_config_overload_restriction, set_adv_phase_config_low_load_current_threshold, set_adv_phase_config_near_overload_current_threshold, set_adv_phase_config_overload_current_threshold, set_adv_phase_config_overload_restriction, set_adv_phase_config_phase_peak_current_reset, set_bank_config_bank_peak_current_reset, set_bank_config_low_load_current_threshold, set_bank_config_near_overload_current_threshold, set_bank_config_overload_current_threshold, set_bank_config_overload_restriction, set_device_config_coldstart_delay, set_device_config_contact, set_device_config_device_energy_reset, set_device_config_device_peak_power_reset, set_device_config_display_orientation, set_device_config_location, set_device_config_low_load_power_threshold, set_device_config_module, set_device_config_name, set_device_config_near_overload_power_threshold, set_device_config_outlets_energy_reset, set_device_config_outlets_peak_load_reset, set_device_config_overload_power_threshold, set_device_control_command, set_group_energy_reset, set_outlet_metered_config_external_link, set_outlet_metered_config_low_load_current_threshold, set_outlet_metered_config_name, set_outlet_metered_config_near_overload_current_threshold, set_outlet_metered_config_overload_current_threshold, set_outlet_switched_config_external_link, set_outlet_switched_config_name, set_outlet_switched_config_power_off_time, set_outlet_switched_config_power_on_time, set_outlet_switched_config_reboot_duration, set_outlet_switched_control_command, set_phase_config_low_load_current_threshold, set_phase_config_near_overload_current_threshold, set_phase_config_overload_current_threshold, set_phase_config_overload_restriction, set_phase_config_phase_peak_current_reset, set_sensor_analog_voltage_config_alarm_enable, set_sensor_analog_voltage_config_hysteresis, set_sensor_analog_voltage_config_name, set_sensor_analog_voltage_config_thresh_max, set_sensor_analog_voltage_config_thresh_min, set_sensor_discrete_config_abnormal_severity, set_sensor_discrete_config_name, set_sensor_discrete_config_normal_state, set_sensor_temp_humidity_config_humidity_alarm_enable, set_sensor_temp_humidity_config_humidity_high_thresh, set_sensor_temp_humidity_config_humidity_hysteresis, set_sensor_temp_humidity_config_humidity_low_thresh, set_sensor_temp_humidity_config_humidity_max_thresh, set_sensor_temp_humidity_config_humidity_min_thresh, set_sensor_temp_humidity_config_name, set_sensor_temp_humidity_config_temp_high_thresh_c, set_sensor_temp_humidity_config_temp_high_thresh_f, set_sensor_temp_humidity_config_temp_hysteresis_c, set_sensor_temp_humidity_config_temp_hysteresis_f, set_sensor_temp_humidity_config_temp_low_thresh_c, set_sensor_temp_humidity_config_temp_low_thresh_f, set_sensor_temp_humidity_config_temp_max_thresh_c, set_sensor_temp_humidity_config_temp_max_thresh_f, set_sensor_temp_humidity_config_temp_min_thresh_c, set_sensor_temp_humidity_config_temp_min_thresh_f, set_sensor_temp_humidity_config_temp_peak_reset, set_sensor_temp_humidity_config_temperature_alarm_enable]
    verification: none
    notes: >
      Walks PowerNet-MIB's rPDU2 group. Which tables a unit fills depends on what it has: a metered PDU lists no
      switched outlets, and a unit in a network port sharing group lists each device's rows with its module number.
  - id: rack-pdu
    name: "APC Rack PDU, first generation (switched and metered: AP78xx, AP79xx)"
    supports: [get, walk, set, refresh, set_ident_device_display_orientation, set_ident_device_lineto_line_voltage, set_ident_device_lineto_neutral_voltage, set_ident_device_power_factor, set_ident_name, set_load_bank_config_low_load_threshold, set_load_bank_config_near_overload_threshold, set_load_bank_config_overload_threshold, set_load_phase_config_low_load_threshold, set_load_phase_config_near_overload_threshold, set_load_phase_config_overload_threshold, set_outlet_bank_overload_restriction, set_outlet_config_monitored_low_load_threshold, set_outlet_config_monitored_name, set_outlet_config_monitored_near_overload_threshold, set_outlet_config_monitored_overload_threshold, set_outlet_config_outlet_name, set_outlet_config_power_off_time, set_outlet_config_power_on_time, set_outlet_config_reboot_duration, set_outlet_control_outlet_command, set_outlet_device_dev_coldstart_delay, set_outlet_device_dev_command, set_outlet_phase_overload_restriction]
    verification: none
    notes: Walks PowerNet-MIB's rPDU group.

settings:
  version: { type: enum, values: [v1, v2c, v3], default: v2c, label: SNMP version,
             description: "The SNMP version the agent is asked with: v1 and v2c use a community string, v3 a user with authentication and privacy." }
  community: { type: string, secret: true, max_length: 255, default: public, label: Community,
               description: "v1 and v2c: the community string for reads, and for SETs when no write community is set." }
  write_community: { type: string, secret: true, max_length: 255, default: "", label: Write community,
                     description: "v1 and v2c: the community string SETs are sent with, often private; empty uses the community." }
  user: { type: string, max_length: 32, default: "", label: User,
          description: "v3: the user name (securityName) the agent knows." }
  security_level: { type: enum, values: [no_auth_no_priv, auth_no_priv, auth_priv], default: auth_priv, label: Security level,
                    description: "v3: no_auth_no_priv sends messages unauthenticated, auth_no_priv authenticates them, auth_priv also encrypts them." }
  auth_protocol: { type: enum, values: [md5, sha, sha224, sha256, sha384, sha512], default: sha, label: Authentication protocol,
                   description: "v3: HMAC-MD5-96, HMAC-SHA-96 (sha) or HMAC-SHA-2 (RFC 7860), as the user is set up on the agent." }
  auth_password: { type: string, secret: true, max_length: 256, default: "", label: Authentication password,
                   description: "v3: the user's authentication password, at least 8 characters." }
  priv_protocol: { type: enum, values: [des, aes, aes192, aes256], default: aes, label: Privacy protocol,
                   description: "v3 at auth_priv: CBC-DES, AES-128 (aes, RFC 3826), or AES-192 or AES-256 as draft-blumenthal-aes-usm-04 defines them." }
  priv_password: { type: string, secret: true, max_length: 256, default: "", label: Privacy password,
                   description: "v3 at auth_priv: the user's privacy password, at least 8 characters." }
  context_name: { type: string, max_length: 32, default: "", label: Context name,
                  description: "v3: the context requests are made in, empty for the agent's default context." }
  context_engine_id: { type: string, pattern: '^[0-9A-Fa-fxX :.-]*$', max_length: 100, default: "", label: Context engine ID,
                       description: "v3: the contextEngineID in hex, for an agent proxying another engine; empty uses the agent's own snmpEngineID." }
  timeout_ms: { type: int, min: 1, max: 60000, default: 1500, label: Timeout,
                description: "Milliseconds to wait for each response before sending the request again." }
  retries: { type: int, min: 0, max: 10, default: 2, label: Retries,
             description: "How many times an unanswered request is sent again before it fails with timeout." }
  max_repetitions: { type: int, min: 1, max: 1000, default: 20, label: GETBULK repetitions,
                     description: "Objects asked for per GETBULK request while walking." }
  poll_interval_ms: { type: int, min: 100, max: 86400000, default: 10000, label: Poll interval,
                      description: "Milliseconds between walks of the device's objects, and reads of sysUpTime.0, the liveness check." }
  trap_port: { type: int, min: 1, max: 65535, label: Notification port,
               description: "The UDP port traps and informs are received on, 162 as standard; unset receives none." }
  trap_bind_address: { type: string, pattern: '^[0-9A-Fa-f.:]*$', max_length: 45, default: "", label: Notification bind address,
                       description: "The local address to receive notifications on with a port of this device's own; empty shares the port with every SNMP device of the core, each hearing its own agent." }
  trap_community: { type: string, secret: true, max_length: 255, default: "", label: Notification community,
                    description: "v1 and v2c notifications: accept only this community; empty accepts any." }
  local_engine_id: { type: string, pattern: '^[0-9A-Fa-fxX :.-]*$', max_length: 100, default: "", label: Local engine ID,
                     description: "v3 informs: this receiver's snmpEngineID in hex, 5 to 32 bytes, as configured on the agent; empty uses a random one for each opening." }

ports:
  - { port: 161, protocol: udp, role: control, note: "the agent; requests go from an ephemeral port of the core's" }
  - { port: null, protocol: udp, role: notification, listener: core, setting: trap_port, note: "traps and informs, when trap_port is set (162 as standard)" }

commands:
  get:
    summary: >
      GET objects by OID and return {varbinds: [{oid, type, value, hex}]}, for objects the named commands and state
      do not cover; an object state holds is updated from the answer too
    params:
      oids: { type: string, pattern: '^[0-9., ;]+$', max_length: 65536, required: true, label: OIDs,
              description: "One or more OIDs in dotted decimal, separated by commas or spaces, such as 1.3.6.1.2.1.1.3.0." }
    returns: value
  walk:
    summary: Every object under an OID, in order, as {varbinds}
    params:
      oid: { type: string, pattern: '^\.?[0-9]+(\.[0-9]+)+$', max_length: 1024, required: true, label: OID,
             description: "The subtree's root in dotted decimal." }
      limit: { type: int, min: 1, max: 100000000, label: Object limit,
               description: "Stop after this many objects; unset walks the whole subtree." }
    returns: value
  set:
    summary: >
      SET one object by OID to a typed value and return the agent's response as {varbinds}; fails with the agent's
      error-status (notWritable, wrongValue...) as the code
    params:
      oid: { type: string, pattern: '^\.?[0-9]+(\.[0-9]+)+$', max_length: 1024, required: true, label: OID,
             description: "The object instance to set, in dotted decimal." }
      type: { type: enum, values: [integer, string, hex, oid, ip_address, counter32, gauge32, timeticks, counter64, opaque], required: true, label: Type,
              description: "The value's SNMP type: string is UTF-8 text and hex is bytes for an OCTET STRING; gauge32 is also Unsigned32." }
      value: { type: string, max_length: 65536, required: true, label: Value,
               description: "The value as text: a decimal number, text, hex bytes, a dotted OID or an IPv4 address, as the type asks." }
    returns: value
  refresh:
    summary: Read the system group and walk every object now; answered when they have been read
    returns: ack
  set_device_config_module:
    summary: "Set rPDU2DeviceConfigModule of one rPDU2DeviceConfigEntry row, then read its table back"
    params:
      index: { type: int, min: 0, max: 2147483647, required: true, label: Device config index, description: "The row of rPDU2DeviceConfigEntry to write, by its rPDU2DeviceConfigIndex." }
      value: { type: int, min: -2147483648, max: 2147483647, required: true, label: Value, description: "The new device config module, as the MIB counts it." }
    returns: ack
  set_device_config_name:
    summary: "Set rPDU2DeviceConfigName of one rPDU2DeviceConfigEntry row, then read its table back"
    params:
      index: { type: int, min: 0, max: 2147483647, required: true, label: Device config index, description: "The row of rPDU2DeviceConfigEntry to write, by its rPDU2DeviceConfigIndex." }
      value: { type: string, max_length: 255, required: true, label: Value, description: The new device config name. }
    returns: ack
  set_device_config_location:
    summary: "Set rPDU2DeviceConfigLocation of one rPDU2DeviceConfigEntry row, then read its table back"
    params:
      index: { type: int, min: 0, max: 2147483647, required: true, label: Device config index, description: "The row of rPDU2DeviceConfigEntry to write, by its rPDU2DeviceConfigIndex." }
      value: { type: string, max_length: 255, required: true, label: Value, description: The new device config location. }
    returns: ack
  set_device_config_display_orientation:
