quirks:
  - models: [all]
    severity: critical
    text: >
      set_outlet_switched_control_command, set_device_control_command (rPDU2), set_outlet_control_outlet_command and
      set_outlet_device_dev_command (rPDU) switch outlets at once: immediate_off and the reboots cut the power of whatever is
      plugged in, and there is no undo. The delayed actions use each outlet's configured power-on and power-off
      times, and cancel_pending_command (or cancel_all_pending_commands) stops one that has not run yet.
  - models: [all]
    severity: info
    text: >
      State and commands are named after PowerNet-MIB: each table is keyed by the row index the agent gives (an
      outlet's own number is its number field), enumerations are the MIB's labels in snake case, and numbers are
      as the MIB counts them (tenths of amps, hundredths of kilowatts...), with the unit in each key's description
      where the MIB states it. Many objects read -1 on models without the feature.
  - models: [all]
    severity: info
    text: >
      A control object reads back as the state it caused rather than the action written (an outlet's control
      command reads immediate_on or immediate_off), so each command reads its whole table again after the SET.
      A walk sees the result of a delayed action only at a later poll.
  - models: [all]
    severity: info
    text: >
      Each notification received is a message event, {event: message, address, args, source}: address is its
      snmpTrapOID (a v1 trap's as RFC 3584 §3.1 derives it, enterprises.318.0.n for PowerNet-MIB's traps), args is
      the same object as traps.last with the MIB's trap name, and a notification starts a poll half a second later.
      Point the PDU's trap receiver at the core's address and trap_port.
  - models: [all]
    severity: info
    text: >
      v1 and v2c agents drop requests with a wrong community without answering, so a wrong community looks like an
      agent that is not there (disconnected, commands time out). SETs need the write community the PDU is
      configured with (write_community), or a v3 user with write access.
  - models: [all]
    severity: info
    text: >
      Opening for commands only walks nothing; a GET of sysUpTime.0 each interval stays as the liveness check, and
      notifications are still received.
