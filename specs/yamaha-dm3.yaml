# Yamaha DM3 / DM3 Standard over Yamaha's Remote Control Protocol (RCP): text lines on TCP 49280.
#
# One of five console specs sharing command and state naming: yamaha-cl-ql, yamaha-tf,
# yamaha-rivage, yamaha-dm7, yamaha-dm3.
#
# Typed commands cover every parameter in Yamaha's DM3 Series OSC Specifications V1.0.0, whose OSC
# parameter IDs are the RCP addresses, and the further parameters a DM3 reports in its own RCP
# parameter list (see the sources); set_parameter, set_parameter_text and get_parameter
# reach any other address. The DM3 also has an OSC interface on UDP 49900, not covered here.

spec: 1
id: yamaha-dm3
name: Yamaha DM3 series digital mixing consoles (Remote Control Protocol, TCP 49280)
vendor: Yamaha
category: mixer

source:
  - title: DM3 Series OSC Specifications, Version 1.0.0 (May 9, 2023)
    author: Yamaha Corporation
    url: https://usa.yamaha.com/files/download/other_assets/2/2063222/DM3_osc_specs_v100_en.pdf
    note: >-
      Manufacturer document for the DM3's OSC interface (UDP 49900); the OSC parameter ID is the RCP address.
      Used for the parameter addresses, dimensions, ranges and tables: examples p.3; 2.1 parameter list
      p.4-8; snapshot commands ssrecall_ex / sscurrent_ex scene_a|scene_b 0-99 p.8; tables 1-8 and maximum
      channel numbers p.9-11 (DM3 and DM3 Standard: 16 inputs).
  - title: DME7 Remote Control Protocol Specifications, Version 1.1.0 rev2 (V1.1.0 of Jan. 25, 2024; applies
      to DME7 V1.1.0 and later)
    author: Yamaha Corporation
    url: https://usa.yamaha.com/files/download/other_assets/4/2230684/DME7-remote-V110_en.pdf
    note: >-
      Manufacturer document for the RCP grammar, written for the DME7 processor, not for the consoles.
      Used here for what Yamaha's console documents leave out: 3.1 basic syntax p.8 (each command ends
      with LF; a lone LF is a heartbeat; options separated by at least one space; text options in double
      quotes with \\ and \" escapes; ASCII only); 3.2.1 NOTIFY devstatus p.9; 3.2.2 NOTIFY set p.10; 3.3.1
      devstatus runmode/error p.13; 3.3.3 scpmode keepalive p.15; 3.3.4 get / OK get p.16; 3.3.5 set /
      OK set / OKm (value clamped) p.18; 3.4.1 devinfo productname/devicename p.25-26; 3.5.1 ERROR <command>
      <code> and the error codes p.38.
  - title: RM Series (RM-CR/RM-CG/RM-TT/RM-WAP) Remote Control Protocol Specifications, Version 3.0.0
      (Oct. 1, 2025)
    author: Yamaha Corporation
    url: https://download.yamaha.com/files/tcm:39-1525882
    note: >-
      Manufacturer document; the same RCP grammar as the DME7 document (3.1 p.7, NOTIFY set p.8), cited
      as a second Yamaha statement of it. It describes the RM series, not the consoles.
  - title: companion-module-yamaha-rcp, v3.6.0 (Bitfocus Companion module; MIT licence)
    author: Andrew Broughton (community, not Yamaha)
    url: https://github.com/bitfocus/companion-module-yamaha-rcp
    note: >-
      Community code, read for corroboration only (top-level LICENSE is MIT). It confirms that the consoles
      answer RCP on TCP 49280 with LF-terminated lines, accept get and set with X and Y numbered from
      0 (paramFuncs.js parseOptions subtracts 1), reply OK/OKm and push NOTIFY set, answer devinfo productname/devicename
      and devstatus runmode (variables.js), and push NOTIFY sscurrent_ex (index.js). Nothing in this spec
      rests on it alone except where a quirk says so.
  - title: companion-module-yamaha-rcp, schemas/DM3 Parameters-2.txt (master branch; MIT licence)
    author: Andrew Broughton (community, not Yamaha)
    url: https://github.com/bitfocus/companion-module-yamaha-rcp/blob/master/schemas/DM3%20Parameters-2.txt
    note: >-
      A DM3's own answers to the RCP parameter-list query ("OK prminfo <n> <address> <X> <Y> <min> <max>
      <default> <unit> <type> <access>", prminfo 0-173 and mtrinfo 2000-2102), recorded by the module's
      author; data, not code. Used, where Yamaha's DM3 document is silent, for the addresses, X/Y counts,
      ranges, defaults and read-only flags of the mix and matrix HPF/LPF/PEQ, the mix pan mode and bus
      type, the cue and monitor sections, the stereo input and FX return sends' Y dimension, the input
      pan modes and the IO:Current/Dev status values. The console firmware it was recorded from is not
      stated.

transport:
  type: line-tcp
  port: 49280
  framing: terminated
  terminator: lf
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  reply_match: '^(OK|OKm|ERROR) '
  probe: devstatus runmode

ports:
  - { port: 49280, protocol: tcp, role: control }

