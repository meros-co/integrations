      matches: '^OKm? set MIXER:Current/Cue/Fx/On \d+ \d+ '
    returns: ack
  get_fx_cue_on:
    summary: Read the FX bus cue on (MIXER:Current/Cue/Fx/On); returns the raw value (true = 1, false = 0)
    params:
      fx:
        type: int
        min: 1
        max: 2
        required: true
        label: FX
        description: FX bus number from 1, as on the console (1 or 2).
    send: get MIXER:Current/Cue/Fx/On {fx:-1} 0
    expect:
      matches: ^OK get MIXER:Current/Cue/Fx/On \d+ \d+ (-?\d+)
    returns: value
  set_cue_mode:
    summary: Set the cue mode (MIXER:Current/Cue/CueMode; the console's mode name, such as MIX)
    params:
      value:
        type: string
        max_length: 16
        pattern: ^[A-Za-z0-9 ._+-]{1,16}$
        required: true
        label: Cue mode
        description: The cue mode by the console's own name for it, such as MIX (the default); the parameter list
          gives six modes without naming the others.
    send: set MIXER:Current/Cue/CueMode 0 0 {value:json}
    expect:
      matches: '^OKm? set MIXER:Current/Cue/CueMode \d+ \d+ '
    returns: ack
  get_cue_mode:
    summary: Read the cue mode (MIXER:Current/Cue/CueMode); returns the raw value (the console's mode name, such as
      MIX)
    send: get MIXER:Current/Cue/CueMode 0 0
    expect:
      matches: ^OK get MIXER:Current/Cue/CueMode \d+ \d+ "((?:[^"\\]|\\.)*)"
    returns: value
  set_cue_input_point:
    summary: Set the input channel cue point (MIXER:Current/Cue/InCh/Point; the console's point name, such as PFL)
    params:
      value:
        type: string
        max_length: 16
        pattern: ^[A-Za-z0-9 ._+-]{1,16}$
        required: true
        label: Input cue point
        description: Where input channels are cued from, by the console's own name for it, such as PFL (the default).
    send: set MIXER:Current/Cue/InCh/Point 0 0 {value:json}
    expect:
      matches: '^OKm? set MIXER:Current/Cue/InCh/Point \d+ \d+ '
    returns: ack
