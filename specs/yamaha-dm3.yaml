    description: 'Mix channel cue on (MIXER:Current/Cue/Mix/On): true = 1, false = 0'
  matrices.*.cue_on:
    type: bool
    description: 'Matrix channel cue on (MIXER:Current/Cue/Mtrx/On): true = 1, false = 0'
  stereo.*.cue_on:
    type: bool
    description: 'Stereo bus channel cue on (MIXER:Current/Cue/St/On): true = 1, false = 0'
  fx.*.cue_on:
    type: bool
    description: 'FX bus cue on (MIXER:Current/Cue/Fx/On): true = 1, false = 0'
  cue.mode:
    type: string
    description: 'Cue mode (MIXER:Current/Cue/CueMode): the console''s mode name, such as MIX'
  cue.input_point:
    type: string
    description: 'Input channel cue point (MIXER:Current/Cue/InCh/Point): the console''s point name, such as PFL'
  cue.output_point:
    type: string
    description: 'Output channel cue point (MIXER:Current/Cue/OutCh/Point): the console''s point name, such as AFL'
  cue.active:
    type: string
    description: 'Active cue (read only) (MIXER:Current/Cue/ActiveCue): the console''s name for the active cue, NONE
      when none'
  monitor.on:
    type: bool
    description: 'Monitor on (MIXER:Current/Monitor/On): true = 1, false = 0'
  monitor.fader_level:
    type: int
    description: 'Monitor fader level (MIXER:Current/Monitor/Fader/Level): hundredths of a dB, -32768 (-inf) to 1000
      (+10 dB)'
  monitor.cue_interruption:
    type: bool
    description: 'Monitor cue interruption (MIXER:Current/Monitor/CueInterruption): true = 1, false = 0'
  monitor.mono:
    type: bool
    description: 'Monitor mono (MIXER:Current/Monitor/St/MonoMonitor): true = 1, false = 0'
  monitor.source.mix.*:
    type: bool
    description: 'Monitor source a mix bus (MIXER:Current/Monitor/St/SourceCh/Mix): true = 1, false = 0'
  monitor.source.matrix.*:
    type: bool
    description: 'Monitor source a matrix bus (MIXER:Current/Monitor/St/SourceCh/Mtrx): true = 1, false = 0'
  monitor.source.stereo.*:
    type: bool
    description: 'Monitor source a stereo bus channel (MIXER:Current/Monitor/St/SourceCh/St): true = 1, false = 0'
  monitor.source.recorder:
    type: bool
    description: 'Monitor source the recorder (MIXER:Current/Monitor/St/SourceCh/Rec): true = 1, false = 0'
  monitor.source.usb:
    type: bool
    description: 'Monitor source the USB input (MIXER:Current/Monitor/St/SourceCh/USB): true = 1, false = 0'
  inputs.*.pan_mode:
    type: int
    description: 'Input channel pan mode (read only) (MIXER:Current/InCh/PanMode): 0 or 1, unnamed'
  stereo_inputs.*.pan_mode:
    type: int
    description: 'Stereo input channel pan mode (read only) (MIXER:Current/StInCh/PanMode): 0 or 1, unnamed'
  fx_returns.*.pan_mode:
    type: int
    description: 'FX return channel pan mode (read only) (MIXER:Current/FxRtnCh/PanMode): 0 or 1, unnamed'
  stereo.*.pan_mode:
    type: int
    description: 'Stereo bus channel pan mode (read only) (MIXER:Current/St/PanMode): 0 or 1, unnamed'
  device.phantom_active:
    type: bool
    description: '+48 V master active (read only) (IO:Current/Dev/48VActiveOn): true = 1, false = 0'
  device.system_status:
    type: int
    description: 'System status code (read only) (IO:Current/Dev/SystemStatus): 0 to 11, the console''s status code,
      not named'
  device.sync_status:
    type: int
    description: 'Sync status code (read only) (IO:Current/Dev/SyncStatus): 0 to 12, the console''s word clock status
      code, not named'

