  recall_scene:
    summary: Recall a scene from scene list A or B (ssrecall_ex scene_a|scene_b); scene 0-99
    params:
      bank:
        type: enum
        values:
          - a
          - b
        required: true
        label: Scene list
        description: "Which of the console's two scene lists to recall from: a is scene list A, b is scene list B."
      scene:
        type: int
        min: 0
        max: 99
        required: true
        label: Scene
        description: "Scene number from 0 to 99, as the console numbers scenes; the recall changes the live mix at once."
    send: ssrecall_ex scene_{bank} {scene}
    expect:
      matches: ^OK ssrecall_ex scene_[ab]
    returns: ack
  get_current_scene:
    summary: Read the current scene number of scene list A or B (sscurrent_ex scene_a|scene_b)
    params:
      bank:
        type: enum
        values:
          - a
          - b
        required: true
        label: Scene list
        description: "Which scene list to read, a or b; the console may answer the inactive list with an error."
    send: sscurrent_ex scene_{bank}
    expect:
      matches: ^OK sscurrent_ex scene_[ab] "?([0-9.]+)"?
    returns: value
  set_parameter:
    summary: Set any numeric parameter by its RCP address (raw value, as the console's parameter list
      gives it); x and y are sent as given, numbered from 0, and 0 where the address has no X or Y
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
        label: Address
        description: "The RCP parameter address from Yamaha's parameter list, such as MIXER:Current/InCh/Fader/Level."
      x:
        type: int
        min: 0
        required: true
        label: X
        description: "The address's X index, sent as given and numbered from 0 (0 is channel 1 on the console); 0 where the address has no X."
      y:
        type: int
        min: 0
        required: true
        label: "Y"
        description: "The address's Y index, sent as given and numbered from 0 (0 is the first mix, band or other item); 0 where the address has no Y."
      value:
        type: int
        required: true
        label: Value
        description: "The raw integer value from Yamaha's parameter list, such as hundredths of a dB for levels; it is not range-checked and the console clamps it."
    send: set {address} {x} {y} {value}
    expect:
      matches: '^OKm? set \S+ \d+ \d+ '
    returns: ack
  set_parameter_text:
    summary: Set any text parameter (name, colour, type) by its RCP address; the value is sent double-quoted
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
        label: Address
        description: "The RCP address of a text parameter from Yamaha's parameter list, such as MIXER:Current/InCh/Label/Name."
      x:
        type: int
        min: 0
        required: true
        label: X
        description: "The address's X index, sent as given and numbered from 0 (0 is channel 1 on the console); 0 where the address has no X."
      y:
        type: int
        min: 0
        required: true
        label: "Y"
        description: "The address's Y index, sent as given and numbered from 0 (0 is the first mix, band or other item); 0 where the address has no Y."
      value:
        type: string
        pattern: ^[ -~]*$
        required: true
        label: Value
        description: "The text to set, in printable ASCII, such as a name or colour; it is sent in double quotes."
    send: set {address} {x} {y} {value:json}
    expect:
      matches: '^OKm? set \S+ \d+ \d+ '
    returns: ack
  get_parameter:
    summary: Read any parameter by its RCP address; returns the value as sent, a text value with its quotes
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
        label: Address
        description: "The RCP parameter address from Yamaha's parameter list, such as MIXER:Current/InCh/Fader/Level."
      x:
        type: int
        min: 0
        required: true
        label: X
        description: "The address's X index, sent as given and numbered from 0 (0 is channel 1 on the console); 0 where the address has no X."
      y:
        type: int
        min: 0
        required: true
        label: "Y"
        description: "The address's Y index, sent as given and numbered from 0 (0 is the first mix, band or other item); 0 where the address has no Y."
    send: get {address} {x} {y}
    expect:
      matches: ^OK get \S+ \d+ \d+ (.*?)\s*$
    returns: value
  get_product_name:
    summary: Read the product name (devinfo productname)
    send: devinfo productname
    expect:
      matches: ^OK devinfo productname "?([^"]*?)"?\s*$
    returns: value
