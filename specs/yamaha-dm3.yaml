quirks:
  - models:
      - all
    severity: critical
    text: >-
      Yamaha publishes no remote control protocol specification for its mixing consoles. For the DM3,
      Yamaha documents the parameter addresses, X/Y dimensions, ranges and value tables in its DM3 Series
      OSC Specifications, where the OSC parameter ID is the RCP address, plus the scene commands ssrecall_ex
      and sscurrent_ex with scene_a / scene_b. The rest of the protocol is taken from Yamaha's RCP specifications
      for the DME7 and the RM series, which describe the same text protocol on TCP 49280 for other products:
      get and its "OK get <address> <x> <y> <value>" reply, "OK set ..." and "OKm set ..." (the value
      was clamped into range) acknowledgements, "ERROR <command> <code>" failures, "NOTIFY set" pushes,
      devinfo, devstatus and scpmode keepalive. That the consoles behave this way is corroborated by the
      MIT-licensed Bitfocus Companion module, not by Yamaha; treat those parts as unconfirmed until bench-tested.
  - models:
      - all
    severity: warning
    text: >-
      X and Y are numbered from 0 on the wire (Yamaha's command list: X 0 = input channel 1), while Yamaha's
      OSC documents number them from 1. Typed commands take channel, mix, band and other numbers from
      1 and subtract one; set_parameter, set_parameter_text and get_parameter send x and y exactly as
      given. A parameter without an X or Y dimension still takes both, sent as 0.
  - models:
      - all
    severity: warning
    text: >-
      Every line ends with LF (0x0A); a lone LF is accepted as a heartbeat. Text values travel in double
      quotes with \" and \\ escapes (DME7 spec 3.1 p.8) and must be ASCII. Names and other text telemetry
      are stored as received, inside the quotes, so an escaped quote stays escaped. A set outside the
      parameter's range is clamped by the device and acknowledged "OKm"; typed commands range-check first,
      but set_parameter does not. Failures arrive as "ERROR <command> <code>" with codes UnknownCommand,
      WrongFormat, InvalidArgument, UnknownAddress, TooLongCommand, AccessDenied, Busy, ReadOnly, NoPermission,
      Overload, Overflow, InternalError and others (DME7 spec 3.5.1 p.38).
  - models:
      - all
    severity: info
    text: >-
      Values are raw integers, not dB: fader and send levels are hundredths of a dB from -32768 (-inf)
      to 1000 (+10.00 dB), pans -63 (L63) to 63 (R63), frequencies tenths of a Hz, Q thousandths. Yamaha's
      fader table lists the values the console steps through; the console accepts any value in range.
  - models:
      - all
    severity: info
    text: >-
      Parameter changes made on the console or by another controller are pushed as "NOTIFY set <address>
      <x> <y> <value> ..." lines (DME7 spec 3.2.2 p.10, 4.8 p.49), which the telemetry rules apply. The
      DME7 specification says parameters changed by a snapshot recall are not individually notified (p.10);
      whether a console scene recall pushes every changed parameter is not documented. State read on connecting
      can therefore be stale after a scene recall until the values are read again.
  - models:
      - all
    severity: info
    text: >-
      On connecting, the telemetry poll reads every fader level, ON key and name of the largest model
      in the family, one query at a time. A smaller model answers the queries for channels it lacks with
      ERROR, which leaves no state. Channel limits in typed commands are likewise the family's largest;
      a channel the model lacks is refused by the console with ERROR.
  - models:
      - all
    severity: info
    text: >-
      scpmode keepalive makes the console close the connection itself when it hears nothing for the given
      time (the DME7 document adds one second), freeing the slot after a controller vanishes; without
      it a half-open connection can block new ones (DME7 spec 2-8 p.15). After it is set the controller
      must send something, a command or a lone LF, within the interval, which this spec cannot schedule;
      use it only where the host sends traffic regularly. Meter data (mtrstart and NOTIFY mtr) is not
      covered: Yamaha documents no console meter addresses and the format cannot map a variable-length
      meter list to per-channel state.
  - models:
      - all
    severity: warning
    text: >-
      The controller connects to the IP address set under SETUP > NETWORK > For Mixer Control (the address
      StageMix and MonitorMix use; OSC spec 1.2 p.3).
  - models:
      - all
    severity: warning
    text: >-
      DM3 has two scene lists, A and B, numbered 0-99 (p.8). The replies to sscurrent_ex are not documented
      and are matched leniently. The Companion module notes that the query for the inactive list is answered
      with an error. devstatus error is not used on DM3 by that module, so it is left out here.
  - models:
      - all
    severity: critical
    text: >-
      A scene recall changes the live mix at once, subject to the console's recall safe and focus settings.
  - models:
      - all
    severity: info
    text: >-
      Gaps in the document: the stereo input and FX return channel sends to mix, FX and matrix
      (StInCh/ToMix, ToFx, ToMtrx and FxRtnCh/ToMix, ToFx, ToMtrx, p.5-6) are listed without a Y
      dimension. The console's own parameter list (below) gives them one, the destination bus (6 mixes,
      2 FX, 2 matrices), which the typed send commands for those channels follow. Send pre/post is
      described only as "0: OFF, 1: ON". The local input head-amp gain (IO:Current/InCh/HAGain) is in
      whole dB, 0 to 64, unlike the hundredths used elsewhere (Table 7).
  - models:
      - all
    severity: warning
    text: >-
      Yamaha's DM3 OSC document (V1.0.0, the only one Yamaha publishes for the DM3) lists no EQ, filter,
      dynamics, DCA, cue or monitor parameters. The mix and matrix HPF/LPF/PEQ switches and PEQ bands (4
      bands, frequency in tenths of a Hz, gain in hundredths of a dB, Q in thousandths, a type named by
      text), the mix pan mode and bus type, the cue switches, cue mode and points, the monitor section,
      the stereo input and FX return sends' destinations, and the read-only pan modes, +48 V master, system
      and sync status come instead from the console's own answer to the RCP parameter-list query
      (prminfo), as recorded in the MIT-licensed Companion module's schemas/DM3 Parameters-2.txt. No DM7
      address is borrowed: Yamaha's documents do not say the DM3 and DM7 address sets match, and they
      differ (the DM3 reports a band Type as text where the DM7 has a channel PEQ Type and per-band
      Bypass, and no HPF frequency). The names behind the text values (band types beyond Bell, bus types
      beyond VARI, cue modes and points) and the meaning of the pan modes and status codes are not
      given, so those commands take the console's own text or number.
  - models:
      - all
    severity: info
    text: >-
      API limit, as far as either source shows: the DM3's parameter list has no input channel EQ, HPF,
      dynamics (Dyna1/Dyna2), insert or delay parameters, no DCA assignment or DCA masters, and no effect
      type or effect parameters, although the console has them on its surface. They appear only as
      input-link switches (InputChLink/LinkParams). They cannot be read or set over RCP until Yamaha
      documents them or a console shows them in its parameter list; set_parameter / get_parameter reach
      any address a later firmware adds.

state:
  inputs.*.fader_level:
    type: int
    description: 'Input channel fader level (MIXER:Current/InCh/Fader/Level): hundredths of a dB, -32768
      (-inf) to 1000 (+10 dB)'
  inputs.*.on:
    type: bool
    description: 'Input channel channel ON key (0 OFF, the channel is muted; 1 ON) (MIXER:Current/InCh/Fader/On):
      true = 1 (ON), false = 0 (OFF)'
  inputs.*.stereo_pan:
    type: int
    description: 'Input channel pan to stereo (MIXER:Current/InCh/ToSt/Pan): -63 (L63) to 63 (R63), 0
      centre'
  inputs.*.stereo_sends.*.on:
    type: bool
    description: 'Input channel to stereo bus on (MIXER:Current/InCh/ToSt/On): true = 1 (ON), false =
      0 (OFF)'
  inputs.*.name:
    type: string
    description: 'Input channel name (up to 8 characters) (MIXER:Current/InCh/Label/Name): up to 8 printable
      ASCII characters'
  inputs.*.color:
    type: string
    description: 'Input channel colour (MIXER:Current/InCh/Label/Color): one of the listed strings'
  inputs.*.icon:
    type: string
    description: 'Input channel icon (MIXER:Current/InCh/Label/Icon): one of the listed strings'
  inputs.*.category:
    type: string
    description: 'Input channel category (MIXER:Current/InCh/Label/Category): one of the listed strings'
  inputs.*.mix_sends.*.level:
    type: int
    description: 'Input channel send level to mix (MIXER:Current/InCh/ToMix/Level): hundredths of a dB,
      -32768 (-inf) to 1000 (+10 dB)'
  inputs.*.mix_sends.*.on:
    type: bool
    description: 'Input channel send to mix on (MIXER:Current/InCh/ToMix/On): true = 1 (ON), false = 0
      (OFF)'
  inputs.*.mix_sends.*.pan:
    type: int
