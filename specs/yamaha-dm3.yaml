        inputs.{1:+1}.fader_level: '{3}'
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) MIXER:Current/InCh/Fader/On (\d+) (\d+) "?(-?\d+)"?(?: .*)?$'
