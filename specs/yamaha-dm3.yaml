        device.product_name: '{1}'
    - match: ^OK devinfo devicename "?([^"]*?)"?\s*$
      state:
        device.name: '{1}'
    - match: ^(?:OK|NOTIFY) devstatus runmode "?([a-z]+)"?\s*$
      state:
        device.run_mode: '{1}'
    - match: '^(?:OK|NOTIFY) sscurrent_ex scene_([ab]) "?([0-9.]+)"?(?: .*)?$'
      state:
        scenes.{1}.current: '{2}'
    - match: ^(?:OK|NOTIFY) sscurrent_ex scene_([ab]) "?[0-9.]+"? (modified|unmodified)\s*$
      state:
        scenes.{1}.modified:
          value: '{2}'
          map:
            modified: true
            unmodified: false
    - match: ^(?:OK|NOTIFY) ssrecall_ex scene_([ab]) "?([0-9.]+)"?\s*$
      state:
        scenes.{1}.current: '{2}'
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) MIXER:Current/InCh/Fader/Level (\d+) (\d+) "?(-?\d+)"?(?:
        .*)?$'
