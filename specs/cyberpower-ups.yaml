quirks:
  - models: [all]
    severity: critical
    text: >
      The control commands act on the UPS's output at once and cannot be undone live: set_advance_control_ups_off,
      set_advance_control_reboot_ups, set_advance_control_ups_sleep, set_advance_control_sleep_after_delay,
      set_advance_control_simulate_power_fail, set_base_control_conserve_battery,
      set_bank_outlet_control_control_outlet_command and set_individual_outlet_control_command turn off, reboot or
      put the load to sleep; set_advance_test_runtime_estimation discharges the battery; and
      set_advance_config_set_eeprom_defaults puts the UPS's settings back to the factory's.
  - models: [all]
    severity: info
    text: >
      State and commands are named after CPS-MIB's ups group, the "ups" prefix left off: each table is keyed by the
      row index the agent gives, enumerations are the MIB's labels in snake case, and numbers are as the MIB counts
      them, with the unit in each key's description where the MIB states it. EnviroSensor readings are under
      environment and environment2, as the agent fills them.
  - models: [all]
    severity: info
    text: >
      A control object reads back as the state it caused rather than the action written, so each command reads its
      group or table again after the SET; the result of a delayed action shows at a later poll.
  - models: [all]
    severity: info
    text: >
      Each notification received is a message event, {event: message, address, args, source}: address is its
      snmpTrapOID (a v1 trap's as RFC 3584 §3.1 derives it, enterprises.3808.0.n for CPS-MIB's traps), args is the
      same object as traps.last with the MIB's trap name, and a notification starts a poll half a second later.
  - models: [all]
    severity: info
    text: >
      v1 and v2c agents drop requests with a wrong community without answering, so a wrong community looks like an
      agent that is not there (disconnected, commands time out). SETs need the write community the card is
      configured with (write_community), or a v3 user with write access.
  - models: [all]
    severity: info
    text: >
      Opening for commands only walks nothing; a GET of sysUpTime.0 each interval stays as the liveness check, and
      notifications are still received.
