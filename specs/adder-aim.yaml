quirks:
  - models: [all]
    severity: critical
    text: >
      disconnect_everything ends every KVM connection in the AIM network, and reboot_devices, replace_device and promote
      interrupt the users of the devices concerned; none can be undone while users are working.
  - models: [all]
    severity: info
    text: >
      The API pushes nothing: the lists are polled (5 s by default, as Adder recommends 5 to 10 s), and read again after
      each command. Channels and presets are those the user may use; receivers are all of them (show_all). A receiver's
      connection is taken from its last connection record: connected while that has no end time.
  - models: [all]
    severity: info
    text: >
      The integration logs in once and keeps its token, which the AIM holds as a session until its admin timeout, and
      logs out on closing. Tokens are bound to the client's address. The API documents no error code for an ended
      token; an error whose message names the login, the token or the session logs in again once and repeats the
      request. Error 2 at login (a wrong user name or password) makes the device unauthorized.
  - models: [all]
    severity: info
    text: >
      Methods that change the AIM need an admin user; others answer with the AIM's error. The API works on the primary
      AIM only (promote excepted). Opening for commands only logs in and reads nothing; a get_servers after 30 s of
      silence stays as the liveness check.
