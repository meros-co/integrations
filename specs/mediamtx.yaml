    summary: The live paths, a page at a time, with online state, source, readers, tracks and byte counters ({itemCount, pageCount, items})
    params: { page: *page, items_per_page: *items_per_page }
    send: { method: GET, path: /v3/paths/list, query: { page: "{page}", itemsPerPage: "{items_per_page}" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_path:
    summary: One live path with online state, source, readers, tracks and byte counters
    params:
      name: &path_name { type: string, pattern: "^\\S+$", max_length: 256, required: true,
                         label: Path,
                         description: "The live path's name, such as cam1 or live/stage." }
    send: { method: GET, path: "/v3/paths/get/{name}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  list_forward_dests:
    summary: A path's forward destinations with state (idle, forwarding, error), last error and bytes sent, a page at a time (1.20 and later)
    params: { path: *path_name, page: *page, items_per_page: *items_per_page }
    send:
      - { models: [mediamtx-1-21], method: GET, path: /v3/paths/forward-dests/list,
          query: { path: "{path}", page: "{page}", itemsPerPage: "{items_per_page}" } }
      - { models: [mediamtx-1-2], method: GET, path: /v3/paths/forward/list,
          query: { path: "{path}", page: "{page}", itemsPerPage: "{items_per_page}" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_forward_dest:
    summary: One forward destination of a path (1.20 and later)
    params:
      path: *path_name
      id: &forward_id { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$", required: true,
                        label: Destination ID,
                        description: "The forward destination's id, a UUID from list_forward_dests." }
    send:
      - { models: [mediamtx-1-21], method: GET, path: /v3/paths/forward-dests/get, query: { id: "{id}", path: "{path}" } }
      - { models: [mediamtx-1-2], method: GET, path: /v3/paths/forward/get, query: { id: "{id}", path: "{path}" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_static_source:
    summary: A path's pulled source with its state (idle, running, error), last error and protocol details; 404 for a path without one
    params: { name: *path_name }
    send: { method: GET, path: "/v3/paths/static-sources/get/{name}" }
