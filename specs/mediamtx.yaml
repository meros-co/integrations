spec: 1
id: mediamtx
name: MediaMTX (Control API v3)
vendor: bluenviron
category: other

# MediaMTX's Control API: HTTP and JSON on port 9997, enabled with `api: yes`
# in mediamtx.yml (or MTX_API=yes). The media server routes streams between
# SRT, WebRTC, RTSP, RTMP, LL-HLS, MPEG-TS, RTP and MoQ; the API reads and
# changes its configuration (global, path defaults, path configurations),
# lists live paths with their source, readers, tracks and byte counters, lists
# and kicks each protocol's clients, and lists and deletes recordings.
# MediaMTX pushes nothing to an API client: live paths are polled every
# 3 seconds, and every protocol's sessions, the configuration and the
# server's version every 10 seconds. Lists are read whole (1000 items a page)
# and replace what state held, so removed paths and closed sessions leave it.
# Recorded time spans are listed from the playback server, a second HTTP
# server on port 9996 (playback: yes).
#
# Two models: MediaMTX 1.21 and later serve the endpoints grouped by
# protocol (/v3/rtsp/sessions/list); 1.2 to 1.20 serve the same API under
# the earlier names (/v3/rtspsessions/list), which 1.21 still answers.

source:
  - title: MediaMTX OpenAPI definition of the Control API (api/openapi.yaml, MediaMTX v1.21.1)
    author: bluenviron (MediaMTX, MIT licence)
    url: https://github.com/bluenviron/mediamtx/blob/v1.21.1/api/openapi.yaml
    note: >
      The project's own API definition, retrieved 2026-10-06 (v1.21.1 is the
      latest release, 2026-09-20). /v3/info; /v3/auth/jwks/refresh (POST);
      /v3/config/global/get and patch (PATCH, all fields optional);
      /v3/config/path-defaults/get and patch; /v3/config/paths/list (page,
      itemsPerPage: default 0 and 100), get/{name}, add/{name} (POST),
      patch/{name} (PATCH), replace/{name} (POST, replaces all values),
      delete/{name} (DELETE); /v3/paths/list and get/{name};
      /v3/paths/forward-dests/list (path, page, itemsPerPage) and get (id,
      path); /v3/paths/static-sources/get/{name}; list, get and (where
      present) kick for /v3/hls/muxers (no kick), /v3/hls/sessions,
      /v3/rtsp/conns (no kick), /v3/rtsp/sessions, /v3/rtsps/conns,
      /v3/rtsps/sessions, /v3/rtmp/conns, /v3/rtmps/conns, /v3/srt/conns,
      /v3/webrtc/sessions, /v3/moq/sessions (kick is POST); /v3/recordings/list,
      get/{name}, and segments/delete (DELETE, path and start in the query).
      Lists answer {itemCount, pageCount, items}; success answers
      {"status": "ok"} and errors {"status": "error", "error": "..."} with
      400, 404 or 500. Schemas Path (available, online, ready (deprecated),
      confName, source {type, id}, readers [{type, id}], inboundBytes,
      outboundBytes, inboundFramesInError, tracks (deprecated codec names),
      tracks2 [{codec, codecProps}]), PathConf, GlobalConf, RTSPSession,
      RTMPConn, SRTConn (libsrt statistics), WebRTCSession, HLSMuxer,
      HLSSession, MoQSession, Recording {name, segments [{start}]},
      ForwardDest, StaticSource, AuthInternalUser {user, pass, ips,
      permissions [{action, path}]}, and their enums.
  - title: MediaMTX OpenAPI definitions at v1.2.0, v1.5.0, v1.16.0, v1.19.0 and v1.20.0 (apidocs/openapi.yaml, later api/openapi.yaml)
    author: bluenviron (MediaMTX, MIT licence)
    url: https://github.com/bluenviron/mediamtx/blob/v1.20.0/api/openapi.yaml
    note: >
      The project's own API definitions at earlier tags, read to find which
      releases serve which endpoint names. v1.0.0 and v1.1.0 serve /v2/;
      v1.2.0 to v1.20.0 serve /v3/ with /v3/config/pathdefaults,
      /v3/hlsmuxers, /v3/rtspconns, /v3/rtspsessions, /v3/rtspsconns,
      /v3/rtspssessions, /v3/rtmpconns, /v3/rtmpsconns, /v3/srtconns,
      /v3/webrtcsessions, /v3/recordings/deletesegment; /v3/recordings from
      1.5.1, /v3/auth/jwks/refresh from 1.12.3, /v3/info from 1.15.2,
      /v3/hlssessions from 1.18.0, /v3/moqsessions from 1.19.0,
      /v3/paths/forward/list and get from 1.20.0. Byte counters are
      bytesReceived and bytesSent until 1.16 and inboundBytes and
      outboundBytes (beside the deprecated names) from 1.17; available and
      online from 1.16; tracks2 from 1.17.
  - title: MediaMTX documentation, Control API, Authentication, Configuration, Metrics, Playback recorded streams, Record streams to disk (docs/, v1.21.1)
    author: bluenviron (MediaMTX)
    url: https://mediamtx.org/docs/features/control-api
    note: >
      The project's documentation, retrieved 2026-10-06 from the repository's
      docs folder at v1.21.1. The API is enabled with api: yes and answers on
      127.0.0.1:9997 by default; by default it is accessible from localhost
      only. Authentication: internal users in the configuration
      (authInternalUsers, each with ips and permissions whose actions are
      publish, read, playback, api, metrics and pprof; user any means anyone),
      an external HTTP server, or JWTs from an identity server's JWKS. HTTP
      servers take Basic credentials, or a Bearer token (a JWT, or user:pass).
      The default configuration grants api, metrics and pprof to anyone from
      127.0.0.1 and ::1. The configuration can be changed by editing the file
      (hot reloading), environment variables or the Control API. Metrics are
      served on :9998 in Prometheus format, pprof on :9999, the playback
      server on :9996 (/list and /get of recorded time spans).
  - title: MediaMTX Playback API OpenAPI definition (api/playback.openapi.yaml, v1.21.1) and "Playback recorded streams" (docs/2-features/10-playback.md)
    author: bluenviron (MediaMTX, MIT licence)
    url: https://github.com/bluenviron/mediamtx/blob/v1.21.1/api/playback.openapi.yaml
    note: >
      The project's own definition of the playback server, retrieved
      2026-10-06, with its documentation page. Enabled with playback: yes,
      playbackAddress :9996, playbackEncryption for HTTPS; no security of its
      own beyond MediaMTX's authentication (the playback action, per path;
      the default configuration grants it to anyone). GET /list with path
      (required), start and end (RFC 3339, optional) answers an array of
      {start, duration (seconds), url}, 404 when no time span matches, 400 or
      500 with {status: error, error}. GET /get with path, start, duration
      and format (fmp4 or mp4) answers the recording itself as MP4, without
      byte ranges. Release notes: playback server 1.5.0, /list 1.5.1, the
      url field 1.9.0, start and end filters 1.11.0, 404 for an empty list
      1.11.1, JSON errors 1.18.0, the OpenAPI definition 1.20.0.
  - title: MediaMTX mediamtx.yml (v1.21.1) and release notes v0.17.0 to v1.21.1
    author: bluenviron (MediaMTX)
    url: https://github.com/bluenviron/mediamtx/releases
    note: >
      The default configuration file (api false, apiAddress :9997,
      apiEncryption false, the default users, every server's address, the
      path defaults with source publisher, record false, recordFormat fmp4,
      recordDeleteAfter 1d) and the release notes: pagination of every list
      from 0.23.0; JWT in the Authorization header for the API from 1.9.2;
      HTTPS for the API from 1.8.0; the new authentication system covering the
      API from 1.6.0; replace made idempotent in 1.8.2; JSON answers with
      status ok or error on every request from 1.15.5; passwords no longer
      returned by the API from 1.20.1; the endpoint renaming in 1.21.0, with
      the old names still served.

transport:
  type: http
  port: 9997
  # apiEncryption: yes serves HTTPS on the same port, usually with a
  # certificate the operator generated.
  scheme: { setting: scheme }
  accept_invalid_certs: true
  # None while the API is reached from the server itself (the default
  # configuration grants it to 127.0.0.1); Basic for an internal user with
  # the api permission; Bearer for a JWT.
  auth: { setting: auth }
  refusal_status: [401]
  timeout_ms: 5000
  # The playback server: a second HTTP server of the same process, with its
  # own address, encryption and permission (SPEC.md §2, Endpoints).
  endpoints:
    playback:
      port: { setting: playback_port }
      scheme: { setting: playback_scheme }
      auth: { setting: playback_auth }
  # Every release from 1.2 serves it; one item keeps it small.
  probe: { method: GET, path: /v3/paths/list, query: { itemsPerPage: "1" } }

settings:
  scheme: { type: enum, values: [http, https], default: http,
            label: Scheme,
            description: "https when the server sets apiEncryption: yes, otherwise http; MediaMTX's own certificate is accepted without being checked." }
  auth: { type: enum, values: [none, basic, bearer], default: none,
          label: Credential type,
          description: "none when the server lets this address use the API without credentials, basic for a user and password, bearer for a JWT." }
  username: { type: string, max_length: 256, default: "",
              label: User,
              description: "An internal user with the api permission, sent as the HTTP Basic user when the credential type is basic." }
  password: { type: string, secret: true, max_length: 256, default: "",
              label: Password,
              description: "That user's password, sent as the HTTP Basic password when the credential type is basic." }
  token: { type: string, secret: true, max_length: 8192, default: "",
           label: Token,
           description: "A JWT from the identity server MediaMTX trusts, with the api action in its permissions claim, sent as a Bearer token when the credential type is bearer." }
  playback_port: { type: int, min: 1, max: 65535, default: 9996,
                   label: Playback port,
                   description: "The port of the playback server's playbackAddress, which lists recorded time spans; 9996 by default." }
  playback_scheme: { type: enum, values: [http, https], default: http,
                     label: Playback scheme,
                     description: "https when the server sets playbackEncryption: yes, otherwise http; its certificate is accepted without being checked." }
  playback_auth: { type: enum, values: [none, inherit], default: none,
                   label: Playback credential,
                   description: "none to ask the playback server without credentials, as the default configuration allows anyone; inherit to send the API credential, whose user then needs the playback permission too." }

ports:
  - { port: 9997, protocol: http, role: control, when: "scheme http" }
  - { port: 9997, protocol: https, role: control, setting: scheme, when: "scheme https" }
  - { port: 9996, protocol: http, role: control, setting: playback_port, when: "playback_scheme http", note: "MediaMTX's playback server (playback: yes), for the recorded time span lists" }
  - { port: 9996, protocol: https, role: control, setting: playback_port, when: "playback_scheme https", note: "MediaMTX's playback server with playbackEncryption: yes" }
  - { port: 9998, protocol: http, role: control, note: "not used by this integration: MediaMTX's Prometheus metrics server (metrics: yes)" }
  - { port: 9999, protocol: http, role: control, note: "not used by this integration: MediaMTX's pprof profiling server (pprof: yes)" }

models:
  - id: mediamtx-1-21
    name: MediaMTX 1.21 and later
    supports:
      [get_info, refresh_jwks,
       get_global_config, patch_global_config, set_log_level, set_server_enabled, set_auth_internal_users,
       get_path_defaults, patch_path_defaults, set_default_record,
       list_path_configs, get_path_config, add_path, add_path_config, patch_path_config, replace_path_config,
       delete_path_config, set_path_source, set_source_on_demand, set_path_record, set_path_record_format,
       set_path_record_delete_after, set_path_max_readers, set_path_override_publisher, set_path_forward_dests,
       list_paths, get_path, list_forward_dests, get_forward_dest, get_static_source,
       list_rtsp_conns, get_rtsp_conn, list_rtsp_sessions, get_rtsp_session, kick_rtsp_session,
       list_rtsps_conns, get_rtsps_conn, list_rtsps_sessions, get_rtsps_session, kick_rtsps_session,
       list_rtmp_conns, get_rtmp_conn, kick_rtmp_conn, list_rtmps_conns, get_rtmps_conn, kick_rtmps_conn,
       list_srt_conns, get_srt_conn, kick_srt_conn,
       list_webrtc_sessions, get_webrtc_session, kick_webrtc_session,
       list_hls_muxers, get_hls_muxer, list_hls_sessions, get_hls_session, kick_hls_session,
       list_moq_sessions, get_moq_session, kick_moq_session,
       list_recordings, get_recordings, delete_recording_segment,
       list_playback_spans, list_playback_spans_between]
    verification: none
    notes: >
      The endpoint names grouped by protocol, introduced in 1.21.0.
  - id: mediamtx-1-2
    name: MediaMTX 1.2 to 1.20
    supports:
      [get_info, refresh_jwks,
       get_global_config, patch_global_config, set_log_level, set_server_enabled, set_auth_internal_users,
       get_path_defaults, patch_path_defaults, set_default_record,
       list_path_configs, get_path_config, add_path, add_path_config, patch_path_config, replace_path_config,
       delete_path_config, set_path_source, set_source_on_demand, set_path_record, set_path_record_format,
       set_path_record_delete_after, set_path_max_readers, set_path_override_publisher, set_path_forward_dests,
       list_paths, get_path, list_forward_dests, get_forward_dest,
       list_rtsp_conns, get_rtsp_conn, list_rtsp_sessions, get_rtsp_session, kick_rtsp_session,
       list_rtsps_conns, get_rtsps_conn, list_rtsps_sessions, get_rtsps_session, kick_rtsps_session,
       list_rtmp_conns, get_rtmp_conn, kick_rtmp_conn, list_rtmps_conns, get_rtmps_conn, kick_rtmps_conn,
       list_srt_conns, get_srt_conn, kick_srt_conn,
       list_webrtc_sessions, get_webrtc_session, kick_webrtc_session,
       list_hls_muxers, get_hls_muxer, list_hls_sessions, get_hls_session, kick_hls_session,
       list_moq_sessions, get_moq_session, kick_moq_session,
       list_recordings, get_recordings, delete_recording_segment,
       list_playback_spans, list_playback_spans_between]
    verification: none
    notes: >
      The Control API v3 under its earlier endpoint names. Some endpoints
      arrived within the range: recordings from 1.5.1, refresh_jwks from
      1.12.3, get_info from 1.15.2, HLS sessions from 1.18.0, MoQ sessions
      from 1.19.0, forward destinations from 1.20.0; an older release answers
      them 404. Releases before 1.2 (Control API v2 and v1) are not covered.

commands:
  # ── General ───────────────────────────────────────────────────────────────
  get_info:
    summary: The server's version and when it started (/v3/info, 1.15.2 and later)
    send: { method: GET, path: /v3/info }
    expect: { status: 200, json_path: "$" }
    returns: value

  refresh_jwks:
    summary: Fetch the JWT key set again from authJWTJWKS, after the identity server rotated its keys (/v3/auth/jwks/refresh)
    send: { method: POST, path: /v3/auth/jwks/refresh }
    expect: { status: 200 }
    returns: ack

  # ── Global configuration ──────────────────────────────────────────────────
  get_global_config:
    summary: The global configuration, every GlobalConf field; passwords are left out from 1.20.1 (/v3/config/global/get)
    send: { method: GET, path: /v3/config/global/get }
    expect: { status: 200, json_path: "$" }
    returns: value

  patch_global_config:
    summary: Change global settings with a GlobalConf object holding only the fields to change (/v3/config/global/patch)
    params:
      changes: { type: json, required: true,
                 label: Changes,
                 description: "A JSON object of GlobalConf fields as MediaMTX's OpenAPI definition gives them, such as {\"logLevel\": \"debug\"}." }
    send: { method: PATCH, path: /v3/config/global/patch, body: '{changes}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_log_level:
    summary: Set the server's log verbosity (global logLevel)
    params:
      level: { type: enum, values: [error, warn, info, debug], required: true,
               label: Log level,
               description: "error logs least, debug most." }
    send: { method: PATCH, path: /v3/config/global/patch, body: '{"logLevel":"{level}"}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_server_enabled:
    summary: Turn one of MediaMTX's servers on or off (global rtsp, rtmp, hls, webrtc, srt, moq, playback, metrics or pprof); off disconnects every client of that server
    params:
      server: { type: enum, values: [rtsp, rtmp, hls, webrtc, srt, moq, playback, metrics, pprof], required: true,
                label: Server,
                description: "The server to change: a streaming protocol (moq from 1.19), the playback server, the metrics server or the pprof server." }
      enabled: { type: bool, required: true,
                 label: Enabled,
                 description: "On to run the server, off to stop it." }
    send: { method: PATCH, path: /v3/config/global/patch, body: '{"{server}":{enabled}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_auth_internal_users:
    summary: Replace the whole list of internal users and their permissions (global authInternalUsers)
    params:
      users: { type: json, required: true,
               label: Users,
               description: "A JSON array of users as MediaMTX documents them, each {\"user\", \"pass\", \"ips\", \"permissions\": [{\"action\", \"path\"}]}; it replaces every user." }
    send: { method: PATCH, path: /v3/config/global/patch, body: '{"authInternalUsers":{users}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  # ── Path defaults ─────────────────────────────────────────────────────────
  get_path_defaults:
    summary: The settings every path takes unless its own configuration overrides them (pathDefaults)
    send:
      - { models: [mediamtx-1-21], method: GET, path: /v3/config/path-defaults/get }
      - { models: [mediamtx-1-2], method: GET, path: /v3/config/pathdefaults/get }
    expect: { status: 200, json_path: "$" }
    returns: value

  patch_path_defaults:
    summary: Change the path defaults with a PathConf object holding only the fields to change
    params:
      changes: { type: json, required: true,
                 label: Changes,
                 description: "A JSON object of PathConf fields as MediaMTX's OpenAPI definition gives them, such as {\"recordDeleteAfter\": \"7d\"}." }
    send:
      - { models: [mediamtx-1-21], method: PATCH, path: /v3/config/path-defaults/patch, body: '{changes}', content_type: application/json }
      - { models: [mediamtx-1-2], method: PATCH, path: /v3/config/pathdefaults/patch, body: '{changes}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_default_record:
    summary: Turn recording to disk on or off for every path that does not set it itself (pathDefaults record)
    params:
      enabled: { type: bool, required: true,
                 label: Record,
                 description: "On to record every such path's stream to disk, off to stop." }
    send:
      - { models: [mediamtx-1-21], method: PATCH, path: /v3/config/path-defaults/patch, body: '{"record":{enabled}}', content_type: application/json }
      - { models: [mediamtx-1-2], method: PATCH, path: /v3/config/pathdefaults/patch, body: '{"record":{enabled}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  # ── Path configurations ───────────────────────────────────────────────────
  list_path_configs:
    summary: The configured paths, a page at a time, each with every PathConf field ({itemCount, pageCount, items})
    params:
      page: &page { type: int, min: 0, default: 0,
                    label: Page,
                    description: "Which page of the list, from 0." }
      items_per_page: &items_per_page { type: int, min: 1, default: 100,
                                        label: Items per page,
                                        description: "How many items each page holds; pageCount in the answer says how many pages there are." }
    send: { method: GET, path: /v3/config/paths/list, query: { page: "{page}", itemsPerPage: "{items_per_page}" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_path_config:
    summary: One path's configuration, every PathConf field
    params:
      name: &conf_name { type: string, pattern: "^\\S+$", max_length: 256, required: true,
                         label: Path,
                         description: "The configured path's name as in mediamtx.yml, such as cam1 or live/stage; a name starting with ~ is a regular expression." }
    send: { method: GET, path: "/v3/config/paths/get/{name}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  add_path:
    summary: Add a path with a source, publisher (clients publish to it) or a URL to pull from, such as rtsp://camera/stream or srt://host:port?streamid=...
    params:
      name: *conf_name
      source: &source { type: string, pattern: "^\\S+$", max_length: 2048, required: true,
                        label: Source,
                        description: "publisher, redirect, rpiCamera, or the URL to pull from (rtsp, rtsps, rtmp, rtmps, http(s) HLS, srt, udp+mpegts, udp+rtp, whep, wheps, moqt), credentials included in the URL." }
      source_on_demand: { type: bool, default: false,
                          label: On demand,
                          description: "On to pull a URL source only while someone reads the path." }
      record: { type: bool, default: false,
                label: Record,
                description: "On to record the path's stream to disk." }
    send: { method: POST, path: "/v3/config/paths/add/{name}",
            body: '{"source":{source:json},"sourceOnDemand":{source_on_demand},"record":{record}}',
            content_type: application/json }
    expect: { status: 200 }
    returns: ack

  add_path_config:
    summary: Add a path with a full PathConf object; fields left out take the path defaults
    params:
      name: *conf_name
      config: { type: json, required: true,
                label: Configuration,
                description: "A JSON object of PathConf fields as MediaMTX's OpenAPI definition gives them, such as {\"source\": \"rtsp://10.0.0.20/main\", \"record\": true}." }
    send: { method: POST, path: "/v3/config/paths/add/{name}", body: '{config}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  patch_path_config:
    summary: Change a path's configuration with a PathConf object holding only the fields to change
    params:
      name: *conf_name
      changes: { type: json, required: true,
                 label: Changes,
                 description: "A JSON object of PathConf fields to change, such as {\"maxReaders\": 10}." }
    send: { method: PATCH, path: "/v3/config/paths/patch/{name}", body: '{changes}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  replace_path_config:
    summary: Replace all of a path's configuration; fields left out go back to the path defaults, and a missing path is added (1.8.2 and later)
    params:
      name: *conf_name
      config: { type: json, required: true,
                label: Configuration,
                description: "A JSON object of PathConf fields, the path's whole new configuration." }
    send: { method: POST, path: "/v3/config/paths/replace/{name}", body: '{config}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  delete_path_config:
    summary: Remove a path's configuration; its source closes and its readers are disconnected
    params:
      name: *conf_name
    send: { method: DELETE, path: "/v3/config/paths/delete/{name}" }
    expect: { status: 200 }
    returns: ack

  set_path_source:
    summary: Change where a path's stream comes from (PathConf source)
    params:
      name: *conf_name
      source: *source
    send: { method: PATCH, path: "/v3/config/paths/patch/{name}", body: '{"source":{source:json}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_source_on_demand:
    summary: Pull a path's URL source only while it has readers, or all the time (PathConf sourceOnDemand)
    params:
      name: *conf_name
      enabled: { type: bool, required: true,
                 label: On demand,
                 description: "On to pull the source only while someone reads the path, off to pull it all the time." }
    send: { method: PATCH, path: "/v3/config/paths/patch/{name}", body: '{"sourceOnDemand":{enabled}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_path_record:
    summary: Start or stop recording a path's stream to disk (PathConf record)
    params:
      name: *conf_name
      enabled: { type: bool, required: true,
                 label: Record,
                 description: "On to record the path to recordPath, off to stop and close the segment." }
    send: { method: PATCH, path: "/v3/config/paths/patch/{name}", body: '{"record":{enabled}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_path_record_format:
    summary: Choose the container of a path's recordings (PathConf recordFormat)
    params:
      name: *conf_name
      format: { type: enum, values: [fmp4, mpegts], required: true,
                label: Format,
                description: "fmp4 for fragmented MP4, mpegts for MPEG-TS." }
    send: { method: PATCH, path: "/v3/config/paths/patch/{name}", body: '{"recordFormat":"{format}"}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_path_record_delete_after:
    summary: How long a path's recording segments are kept before MediaMTX deletes them (PathConf recordDeleteAfter)
    params:
      name: *conf_name
      duration: { type: string, pattern: "^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h|d))+$", max_length: 32, required: true,
                  label: Keep for,
                  description: "A duration such as 1d, 12h or 30m; 0s keeps segments forever." }
    send: { method: PATCH, path: "/v3/config/paths/patch/{name}", body: '{"recordDeleteAfter":{duration:json}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_path_max_readers:
    summary: Limit how many clients may read a path at once (PathConf maxReaders)
    params:
      name: *conf_name
      max_readers: { type: int, min: 0, required: true,
                     label: Readers,
                     description: "The most readers the path accepts; 0 means no limit." }
    send: { method: PATCH, path: "/v3/config/paths/patch/{name}", body: '{"maxReaders":{max_readers}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_path_override_publisher:
    summary: Let a new publisher take over a path from the one publishing, or refuse it (PathConf overridePublisher)
    params:
      name: *conf_name
      enabled: { type: bool, required: true,
                 label: Allow takeover,
                 description: "On to let another client disconnect the current publisher and publish in its place, off to refuse it." }
    send: { method: PATCH, path: "/v3/config/paths/patch/{name}", body: '{"overridePublisher":{enabled}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_path_forward_dests:
    summary: Replace the list of destinations a path's stream is forwarded to, such as rtmp, rtsp or srt URLs (PathConf forward, 1.20 and later)
    params:
      name: *conf_name
      dests: { type: json, required: true,
               label: Destinations,
               description: "A JSON array of forward destinations, each {\"dest\": \"srt://host:port?streamid=...\"} with destFingerprint, whipBearerToken or moqTransport where needed; [] stops forwarding." }
    send: { method: PATCH, path: "/v3/config/paths/patch/{name}", body: '{"forward":{dests}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  # ── Paths (live) ──────────────────────────────────────────────────────────
