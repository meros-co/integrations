spec: 1
id: aes70
name: AES70 / OCA devices (OCP.1)
vendor: AES70 (Open Control Architecture)
category: other
implementation: native
reason: >
  AES70 is an object protocol: the controller discovers the device's objects by walking its blocks, addresses
  each by a session-independent object number and a class it must know to marshal parameters, and keeps state
  current through subscriptions whose notifications arrive asynchronously. OCP.1 is binary, with a sync byte,
  PDU headers, several messages per PDU matched to requests by handle, and a negotiated keep-alive. None of
  this is expressible as data.

source:
  - title: "tschiemer/ocac: AES70/OCA device framework in C99 (master, LICENSE: MIT)"
    author: Philip Tschiemer
    url: "https://github.com/tschiemer/ocac"
    note: >
      Top-level LICENSE is MIT (checked 2026-10-02). Read: src/include/ocac/ocp/ocp1.h (sync value 0x3B, the
      9-byte header of protocol version, PDU size, PDU type and message count, message types 0-4, command,
      response and notification layouts, keep-alive heartbeat in u16 seconds or u32 milliseconds told apart by
      size, and the keep-alive timeout of three heartbeat times, "as defined in standard (AES70-3-2018 5.3)"),
      src/include/ocac/occ/datatypes (base, framework, eventsubscription, time: OcaClassID is a field count and
      u16 fields, OcaTimeInterval is OcaFloat32 in seconds), docs/occ_classes.md (a human-readable extract of
      AES70-2-2018 Annex A: class ids and versions, OcaRoot 1.1 GetClassIdentification and 1.5 GetRole,
      OcaWorker, OcaBlock 3.5 GetMembers and 3.6 GetMembersRecursive, OcaDeviceManager methods 3.1-3.20 and
      properties, OcaSubscriptionManager 3.1 AddSubscription and 3.5 AddPropertyChangeSubscription, well-known
      object numbers 1-13 and root block 100) and docs/subscriptions.md (reliable delivery on the control
      connection, lightweight subscriptions with zero subscriber method and empty context). No code was copied.
  - title: "PADL/SwiftOCA: AES70 controller and device library in Swift (main, LICENSE.md: Apache-2.0)"
    author: PADL Software Pty Ltd
    url: "https://github.com/PADL/SwiftOCA"
    note: >
      Top-level LICENSE.md is Apache-2.0 (checked 2026-10-02). Read: OCF/Messages (Header, MessageType with
      type 5 notification 2 of AES70-2023, Command, Response, KeepAlive1/2, Notification1/2),
      OCA/OcaConnection+Codable.swift (PDU size counts every byte after the sync byte; each message starts with
      its own size; a keep-alive PDU's body is its heartbeat), OCP.1/Ocp1Encoder.swift (an OcaString's length
      counts Unicode scalar values, lists and maps are u16-counted, blobs u16-length), OCA/OcaConnectionMonitor
      (no message for three heartbeat times means the connection is lost; a keep-alive is sent when nothing
      else has been for a heartbeat time), OCA/OcaConnection+Subscribe.swift (OCP.1 uses AddSubscription for the
      PropertyChanged event 1.1, normal delivery mode 1, empty context and destination),
      OCC/ControlDataTypes (OcaStatus 0-17 with their meanings, OcaPropertyChangedEventData as property id,
      value and change type 1-6, OcaModelGUID, OcaModelDescription, OcaDeviceState bits, well-known object
      numbers) and OCC/ControlClasses (class ids of the workers, sensors, agents and managers; property and
      method ids of OcaRoot, OcaWorker, OcaBlock, OcaGain, OcaMute, OcaPolarity, OcaSwitch, OcaDelay,
      OcaIdentificationActuator, the basic actuators, OcaSensor, OcaLevelSensor, OcaDeviceManager and
      OcaSubscriptionManager). No code was copied.
  - title: "OCAAlliance/OcaToolsAndDemos: OCAMicro reference device (main, OCA Alliance EULA)"
    author: OCA Alliance
    url: "https://github.com/OCAAlliance/OcaToolsAndDemos"
    note: >
      Licensed under the OCA Alliance EULA, a permissive Apache-style licence (checked 2026-10-02). Read:
      OCAMicro/Src/common/OCALite/OCP.1/Ocp1LiteSocketConnection.cpp (the device takes its heartbeat time from
      the controller's first keep-alive, in seconds or milliseconds, sends a keep-alive when it has sent nothing
      for that long, and drops a connection silent for three heartbeat times),
      OCC/ControlDataTypes/OcaLiteFrameworkDataTypes.h (OcaStatus 0-15), OcaLiteBaseDataTypes.h, and the class
      headers OcaLiteDelay.h, OcaLiteLevelSensor.h, OcaLiteSwitch.h, OcaLiteStringActuator.h, OcaLiteWorker.h,
      OcaLiteRoot.h and OcaLiteDeviceManager.h. No code was copied.
  - title: "PADL/SwiftOCA: OCP.1 transports (main, LICENSE.md: Apache-2.0)"
    author: PADL Software Pty Ltd
    url: "https://github.com/PADL/SwiftOCA"
    note: >
      Read for the transports beyond TCP (checked 2026-10-22): Sources/SwiftOCA/OCA/OcaConnection.swift and
      OcaConnection+Connect.swift (a UDP controller sends its keep-alive first, which opens the connection, and
      counts the device connected when its first datagram arrives; a datagram PDU is at most 1500 bytes),
      OcaConnectionMonitor.swift (one PDU per datagram; three heartbeat times without a message lose the
      device), Sources/SwiftOCADevice/OCA/OcaControllerInternal.swift (a UDP device ignores every message before
      the controller's keep-alive, AES70-3 has a datagram peer keep sending keep-alives, and UDP sends stay within
      1452 bytes so a PDU fits one Ethernet frame), OCA/Backend/OcaFlyingFoxConnection.swift and the device side
      OcaFlyingFoxController.swift and OcaFlyingFoxDeviceEndpoint.swift (OCP.1 over a WebSocket travels in binary
      messages with the AES70-OCP.1 subprotocol offered by the controller, AES70-3 8.4.3.4.2; consecutive binary
      messages are one byte stream that may hold several PDUs or part of one, 8.4.3.4.4; a text message is an
      error the device closes with 1011), OCP.1/Ocp1WireFormat.swift, and Documentation/TLS.md with
      Sources/SwiftOCASecure/OCP.1/Ocp1TLSTypes.swift (secure OCP.1 is TLS 1.2 with the pre-shared-key suite
      TLS_DHE_PSK_WITH_AES_128_CBC_SHA and the identity hint OCA-PSK, AES70-2024 11.2.4, advertised as
      _ocasec._tcp, and DTLS over UDP as _ocasec._udp), and OCC/ControlDataTypes/NetworkApplicationDataTypes.swift
      (the DNS-SD service types _oca._tcp, _oca._udp, _ocaws._tcp, _ocasec._tcp and _ocasec._udp). No code was
      copied.
  - title: "IETF RFCs for secure OCP.1: RFC 5246 (TLS 1.2), RFC 4279 (PSK cipher suites, DHE_PSK), RFC 6347 (DTLS 1.2), RFC 5746 (renegotiation indication), RFC 7366 (encrypt-then-MAC), RFC 7627 (extended master secret), RFC 7919 (FFDHE groups, used in tests)"
    author: IETF
    url: "https://www.rfc-editor.org/rfc/rfc5246"
    note: >
      The TLS 1.2 and DTLS 1.2 client for secure OCP.1 follows these: the record layer, handshake and PRF
      (RFC 5246), the DHE_PSK key exchange and pre-master secret (RFC 4279 section 3), DTLS records, epochs,
      the cookie exchange, retransmission and replay window (RFC 6347), renegotiation_info (RFC 5746),
      encrypt-then-MAC (RFC 7366) and the extended master secret (RFC 7627). Checked against OpenSSL's
      s_server on loopback (TLS and DTLS, OpenSSL 1.1.1 and 3.6).
  - title: "OCA Alliance: AES70 Control Model"
    author: OCA Alliance
    url: "https://ocaalliance.com/aes70-control-model/"
    note: >
      Manufacturer-neutral overview: control classes as templates, objects as instances with object numbers,
      blocks containing objects, roles. Used for the concepts only.
  - title: "OCA Alliance technical site: Downloads"
    author: OCA Alliance
    url: "https://ocaalliance.github.io/downloads.html"
    note: >
      Lists the AES70 Implementation Chart (a spreadsheet template documenting a device's OCA objects; vendors
      such as d&b publish theirs) and the Focusrite RedNet Virtual OCA Device, a freeware simulator useful for
      checking this integration. The full AES70-1/2/3 standards are sold by the AES and were not used.

settings:
  # How OCP.1 reaches the device (AES70-3): a TCP stream, UDP datagrams, or
  # WebSocket binary messages, plain (ws) or over TLS (wss). The port given on
  # opening is that transport's.
  transport: { type: enum, values: [tcp, udp, ws, wss, tls, dtls], default: tcp,
               label: Transport,
               description: "How OCP.1 reaches the device: TCP, UDP, a WebSocket (ws or wss), or secure OCP.1 with a pre-shared key over TLS (tls) or DTLS (dtls), on the port given when opening." }
  # Secure OCP.1 (tls, dtls): the pre-shared key, in hex (spaces and colons
  # between bytes allowed), and the identity sent with it. AES70 has devices
  # send the identity hint OCA-PSK; SwiftOCA uses that as the identity too.
  psk: { type: string, secret: true, default: "", max_length: 131070, pattern: "^[0-9A-Fa-f :]*$",
         label: Pre-shared key,
         description: "The device's pre-shared key in hex, for the tls and dtls transports; never logged." }
  psk_identity: { type: string, default: "OCA-PSK", max_length: 65535,
                  label: PSK identity,
                  description: "The identity sent with the pre-shared key, for the tls and dtls transports; it travels unencrypted." }
  handshake_timeout_ms: { type: int, min: 1000, max: 600000, default: 10000,
                          label: Handshake timeout,
                          description: "Milliseconds the TLS or DTLS handshake may take before the connection is dropped and tried again." }
  # The WebSocket's path, for ws and wss.
  ws_path: { type: string, default: "/", max_length: 1024,
             label: WebSocket path,
             description: "Path of the device's OCP.1 WebSocket, for the ws and wss transports." }
  # Offer the AES70-OCP.1 subprotocol when opening the WebSocket, as AES70-3
  # has controllers do; off for a device that predates it.
  ws_subprotocol: { type: bool, default: true,
                    label: Offer OCP.1 subprotocol,
                    description: "Whether to offer the AES70-OCP.1 WebSocket subprotocol; turn off for a device that answers without one." }
  # Over wss, accept a certificate that is not trusted, such as a device's
  # self-signed one: still encrypted, but the device is not authenticated.
  accept_invalid_certs: { type: bool, default: false,
                          label: Accept untrusted certificate,
                          description: "Over wss, accept a certificate that does not chain to a trusted root or name the device, such as a self-signed one." }
  # The heartbeat time sent to the device in the keep-alive on connecting: the
  # device sends a keep-alive when it has sent nothing for this long, and
  # nothing heard for three of them drops the connection. Whole seconds are
  # sent in seconds; anything else in milliseconds (AES70-2018's second form).
  keepalive_interval_ms: { type: int, min: 100, max: 600000, default: 1000,
                           label: Keep-alive interval,
                           description: "Heartbeat time in milliseconds asked of the device; three intervals with nothing heard drop the connection." }
  # How long a request waits for its response.
  request_timeout_ms: { type: int, min: 100, max: 600000, default: 5000,
                        label: Request timeout,
                        description: "Milliseconds a request waits for its response before it fails." }
  # Walk the root block on connecting (when the device is monitored).
  walk: { type: bool, default: true,
          label: Walk object tree,
          description: "Whether to walk the root block on connecting to learn the device's objects, when the device is monitored." }
  # Block levels walked: 1 is the root block's members only, 2 also their
  # members, and so on. Every level when not given.
  walk_depth: { type: int, min: 1, max: 255,
                label: Walk depth,
                description: "Block levels walked: 1 is the root block's members only, 2 also their members, and so on; every level when not given." }
  # Subscribe to the property changes of every known object found.
  subscribe: { type: bool, default: true,
               label: Subscribe,
               description: "Whether to subscribe to property changes of every known object found." }
  # Level sensors (meters): off (not read), read (once, on connecting), poll
  # (read every level_poll_ms), or subscribe (follow their changes, which may
  # be many per second).
  level_sensors: { type: enum, values: ["off", read, poll, subscribe], default: poll,
                   label: Level sensors,
                   description: "How meters are read: off, read once on connecting, poll every level poll interval, or subscribe to their changes (may be many per second)." }
  level_poll_ms: { type: int, min: 50, max: 600000, default: 1000,
                   label: Level poll interval,
                   description: "Milliseconds between level sensor reads when level sensors are polled." }
  # Requests waiting for a response at once; more are queued.
  max_in_flight: { type: int, min: 1, max: 1024, default: 32,
                   label: Requests in flight,
                   description: "Requests waiting for a response at once; more are queued." }

ports:
  - { port: null, protocol: tcp, role: control, when: "transport tcp", note: "AES70 (OCP.1) has no standard port: the port is given when the device is opened" }
  - { port: null, protocol: udp, role: control, when: "transport udp", note: "OCP.1 over UDP: the device's port, given when the device is opened" }
  - { port: null, protocol: ws, role: control, when: "transport ws", note: "OCP.1 over a WebSocket: the device's port, given when the device is opened" }
  - { port: null, protocol: wss, role: control, when: "transport wss", note: "OCP.1 over a WebSocket over TLS: the device's port, given when the device is opened" }
  - { port: null, protocol: tls, role: control, when: "transport tls", note: "Secure OCP.1, TLS 1.2 with a pre-shared key over TCP (_ocasec._tcp): the device's port, given when the device is opened" }
  - { port: null, protocol: udp, role: control, when: "transport dtls", note: "Secure OCP.1, DTLS 1.2 with a pre-shared key over UDP (_ocasec._udp): the device's port, given when the device is opened" }

models:
  - id: aes70-device
    name: "Any AES70 device over OCP.1 (TCP, UDP, WebSocket, or secure over TLS or DTLS; give the device's OCP.1 port)"
    supports: &all
      [set_gain, set_mute, set_switch, set_polarity, set_delay, set_bool, set_int, set_float, set_string, identify,
      get_property, set_property, call_method, refresh_objects, get_device_info]
    verification: none
    notes: >
      One model for every device: what a device offers is discovered from its object tree, not declared here.
      AES70 assigns no port; the device's documentation, or its DNS-SD record (_oca._tcp, _oca._udp, _ocaws._tcp,
      _ocasec._tcp, _ocasec._udp), gives it. Remote preamps on AES67 and ST 2110 stageboxes, amplifiers and processors, and other devices that
      speak OCP.1. d&b audiotechnik amplifiers have their own integration (dbaudio) with their controls named.

commands:
  set_gain:
    summary: "OcaGain SetGain (4.2): the gain in dB, on an object addressed by role path (object) or object number (ono)"
    params:
      object: &object { type: string, max_length: 4096,
                        label: Object,
                        description: "Object by role path, the roles from the root block down joined by '/', e.g. Input 1/Gain; give this or an object number." }
      ono: &ono { type: int, min: 1, max: 4294967295,
                  label: Object number,
                  description: "Object number (ono), stable for a device's configuration; give this or a role path." }
      gain_db: { type: float, required: true,
                 label: Gain,
                 description: "Gain in dB; the object's own minimum and maximum apply." }
    returns: ack
  set_mute:
    summary: "OcaMute SetState (4.2): muted (state 1) or unmuted (2)"
    params:
      object: *object
      ono: *ono
      muted: { type: bool, default: true,
               label: Mute,
               description: "True mutes the object, false unmutes it." }
    returns: ack
  set_switch:
    summary: >
      OcaSwitch SetPosition (4.2): a position number from 0, or a position by its name (position_name, from the
      switch's position names read on connecting)
    params:
      object: *object
      ono: *ono
      position: { type: int, min: 0, max: 65535,
                  label: Position,
                  description: "Switch position, numbered from 0; give this or a position name." }
      position_name: { type: string, max_length: 1024,
                       label: Position name,
                       description: "Switch position by its name, as the switch reported on connecting; give this or a position number." }
    returns: ack
  set_polarity:
    summary: "OcaPolarity SetState (4.2): inverted (state 2) or non-inverted (1)"
    params:
      object: *object
      ono: *ono
      inverted: { type: bool, default: true,
                  label: Invert,
                  description: "True inverts the polarity, false sets it back to normal." }
    returns: ack
  set_delay:
    summary: "OcaDelay SetDelayTime (4.2): the delay in seconds"
    params:
      object: *object
      ono: *ono
      delay_s: { type: float, min: 0, required: true,
                 label: Delay,
                 description: "Delay time in seconds, e.g. 0.005 for 5 ms." }
    returns: ack
  set_bool:
    summary: "OcaBooleanActuator SetSetting (5.2)"
    params:
      object: *object
      ono: *ono
      value: { type: bool, required: true,
               label: Value,
               description: "New setting of the boolean actuator." }
    returns: ack
  set_int:
    summary: "OcaInt8/16/32/64Actuator or OcaUint8/16/32/64Actuator SetSetting (5.2); the value must fit the actuator's type"
    params:
      object: *object
      ono: *ono
      value: { type: int, required: true,
               label: Value,
               description: "New setting of the integer actuator; it must fit the actuator's type, e.g. 0 to 255 for an 8-bit unsigned one." }
    returns: ack
  set_float:
    summary: "OcaFloat32Actuator or OcaFloat64Actuator SetSetting (5.2)"
    params:
      object: *object
      ono: *ono
      value: { type: float, required: true,
               label: Value,
               description: "New setting of the floating-point actuator, in the actuator's own unit." }
    returns: ack
  set_string:
    summary: "OcaStringActuator SetSetting (5.2)"
    params:
      object: *object
      ono: *ono
      value: { type: string, required: true, max_length: 65535,
               label: Value,
               description: "New text for the string actuator." }
    returns: ack
  identify:
    summary: >
      OcaIdentificationActuator SetActive (4.2): start or stop the device's identification (a flashing LED or
      display). Without object or ono, the first identification actuator found in the tree
    params:
      object: *object
      ono: *ono
      enabled: { type: bool, default: true,
                 label: Identify,
                 description: "True starts the device's identification (a flashing LED or display), false stops it." }
    returns: ack
  get_property:
    summary: >
      Read one property ("level.index", e.g. "4.1") of an object, with the getter of its class. Returns the
      decoded value, or {value, min, max} for a bounded property, or {hex} when the reply cannot be decoded. Only
      the properties listed under state are known; call_method reaches any other
    params:
      object: *object
      ono: *ono
      property: &property { type: string, required: true, pattern: "^[0-9]{1,5}\\.[0-9]{1,5}$",
                            label: Property,
                            description: "Property ID as level.index, e.g. 4.1 for the fourth class level's first property." }
    returns: value
  set_property:
    summary: >
      Write one property ("level.index") of an object with the setter of its class; value is JSON of the
      property's type (a number, boolean, string, or list of strings or booleans; muted and inverted states as
      booleans, delays in seconds)
    params:
      object: *object
      ono: *ono
      property: *property
      value: { type: json, required: true,
               label: Value,
               description: "New value as JSON of the property's type: a number, boolean, string or list; mute and polarity states as booleans, delays in seconds." }
    returns: ack
  call_method:
    summary: >
      Escape hatch: call any method ("level.index") on an object with parameters already marshalled as OCP.1
      bytes (params_hex) and their count (param_count; 1 when params_hex is not empty, else 0). Returns the
      response as {status, status_name, param_count, params_hex}, whatever the status
    params:
      object: *object
      ono: *ono
      method: { type: string, required: true, pattern: "^[0-9]{1,5}\\.[0-9]{1,5}$",
                label: Method,
                description: "Method ID as level.index, e.g. 4.2." }
      params_hex: { type: string, default: "", max_length: 131070, pattern: "^[0-9A-Fa-f ]*$",
                    label: Parameters,
                    description: "Method parameters already marshalled as OCP.1 bytes, in hex; empty for none." }
      param_count: { type: int, min: 0, max: 255,
                     label: Parameter count,
                     description: "Number of parameters in the hex; when not given, 1 if parameters are given and 0 if not." }
    returns: value
  refresh_objects:
    summary: >
      Forget the object tree and walk the root block again; acknowledged when the walk is done. When monitored,
      known objects are then read again and any new ones subscribed to
    returns: ack
  get_device_info:
    summary: >
      Read the device manager (object 1): model GUID, serial number, model description, name, AES70 version,
      role, user inventory code, enabled, state, message and revision id. A property the device does not
      implement is null
    returns: value

state:
  discovery.complete:              { type: bool, description: "The walk of the root block has been answered or has timed out throughout" }
  discovery.objects:               { type: int, description: "Objects found under the root block, at every level walked" }
  objects.*.ono:                   { type: int, description: "Object number. Objects are keyed by role path: the roles from the root block down, joined by '/' (e.g. \"Input 1/Gain\"); a second object with the same path gets \"#<ono>\" appended" }
  objects.*.class:                 { type: string, description: "Class name (OcaGain, OcaBlock, ...) when the class is one the module knows by name, else the class id" }
  objects.*.class_id:              { type: string, description: "Class id, its fields joined by '.' (\"1.1.1.5\"); proprietary classes include 65535 and the vendor's fields" }
  objects.*.class_version:         { type: int, description: "Class version the device reports" }
  objects.*.kind:                  { type: string, description: "The nearest standard class the object is or derives from, e.g. OcaGain for a vendor's subclass of it" }
  objects.*.gain_db:               { type: float, unit: dB, description: "OcaGain 4.1 Gain; with gain_db_min and gain_db_max" }
  objects.*.gain_db_min:           { type: float, unit: dB, description: "OcaGain minimum gain" }
  objects.*.gain_db_max:           { type: float, unit: dB, description: "OcaGain maximum gain" }
  objects.*.muted:                 { type: bool, description: "OcaMute 4.1 State: true for Muted (1), false for Unmuted (2)" }
  objects.*.inverted:              { type: bool, description: "OcaPolarity 4.1 State: true for Inverted (2)" }
  objects.*.position:              { type: int, description: "OcaSwitch 4.1 Position, from 0; with position_min and position_max" }
  objects.*.position_min:          { type: int, description: "OcaSwitch lowest position" }
  objects.*.position_max:          { type: int, description: "OcaSwitch highest position" }
  objects.*.position_names:        { type: array, description: "OcaSwitch 4.2 PositionNames, indexed by position" }
  objects.*.position_enabled:      { type: array, description: "OcaSwitch 4.3 PositionEnableds, when a change is reported" }
  objects.*.delay_s:               { type: float, unit: s, description: "OcaDelay 4.1 DelayTime in seconds; with delay_s_min and delay_s_max" }
  objects.*.delay_s_min:           { type: float, unit: s, description: "OcaDelay minimum delay" }
  objects.*.delay_s_max:           { type: float, unit: s, description: "OcaDelay maximum delay" }
  objects.*.active:                { type: bool, description: "OcaIdentificationActuator 4.1 Active: the device is identifying itself" }
  objects.*.setting:               { type: float, description: "Basic actuator 5.1 Setting: a boolean, integer, float or string by the actuator's class; numeric ones with setting_min and setting_max" }
  objects.*.setting_min:           { type: float, description: "Numeric basic actuator minimum" }
  objects.*.setting_max:           { type: float, description: "Numeric basic actuator maximum" }
  objects.*.reading:               { type: float, description: "Basic sensor 5.1 Reading (OcaBooleanSensor to OcaStringSensor): a boolean, integer, float or string by the sensor's class; numeric ones with reading_min and reading_max" }
  objects.*.reading_min:           { type: float, description: "Numeric basic sensor lowest reading" }
  objects.*.reading_max:           { type: float, description: "Numeric basic sensor highest reading" }
  objects.*.reading_db:            { type: float, unit: dB, description: "OcaLevelSensor 4.1 Reading, as the level_sensors setting asks; with reading_db_min and reading_db_max. Infinite or NaN readings are \"inf\", \"-inf\" or \"nan\"" }
  objects.*.reading_db_min:        { type: float, unit: dB, description: "OcaLevelSensor lowest reading" }
  objects.*.reading_db_max:        { type: float, unit: dB, description: "OcaLevelSensor highest reading" }
  objects.*.reading_state:         { type: string, description: "OcaSensor 3.1 ReadingState when a change is reported: unknown, valid, underrange, overrange or error" }
  objects.*.enabled:               { type: bool, description: "OcaWorker 2.1 Enabled, when a change is reported or set" }
  objects.*.label:                 { type: string, description: "OcaWorker 2.3 Label, when a change is reported or set" }
  objects.*.raw.*:                 { type: string, description: "A reported change of a property the module does not know, keyed by property id (\"4.9\"): its new value as OCP.1 bytes in hex" }
  device.model_guid:               { type: string, description: "OcaDeviceManager ModelGUID as 16 hex digits: a reserved byte, the manufacturer's IEEE OUI (3 bytes) and the model code (4)" }
  device.serial_number:            { type: string, description: "OcaDeviceManager SerialNumber" }
  device.model.manufacturer:       { type: string, description: "OcaDeviceManager ModelDescription manufacturer" }
  device.model.name:               { type: string, description: "OcaDeviceManager ModelDescription name" }
  device.model.version:            { type: string, description: "OcaDeviceManager ModelDescription version" }
  device.name:                     { type: string, description: "OcaDeviceManager DeviceName" }
  device.oca_version:              { type: int, description: "OcaDeviceManager OcaVersion: the AES70 version the device implements" }
  device.role:                     { type: string, description: "OcaDeviceManager Role, from get_device_info" }
  device.user_inventory_code:      { type: string, description: "OcaDeviceManager UserInventoryCode, from get_device_info" }
  device.enabled:                  { type: bool, description: "OcaDeviceManager Enabled" }
  device.state:                    { type: array, description: "OcaDeviceManager State: the names of the bits set, of operational, disabled, error, initializing and updating" }
  device.message:                  { type: string, description: "OcaDeviceManager Message, from get_device_info" }
  device.revision_id:              { type: string, description: "OcaDeviceManager DeviceRevisionID, where implemented" }

quirks:
  - models: [all]
    severity: warning
    text: >
      AES70 assigns no port to OCP.1, so the device's port must be given when it is opened (the open fails
      without it), on the transport the transport setting names: TCP (the default), UDP, a WebSocket, plain or
      over TLS, or secure OCP.1 over TLS or DTLS. Devices advertise them over DNS-SD (_oca._tcp, _oca._udp,
      _ocaws._tcp, _ocasec._tcp, _ocasec._udp).
  - models: [all]
    severity: info
    text: >
      Over UDP each datagram carries one whole PDU. The module sends its keep-alive first, since a device
      ignores a controller's messages until it has one, keeps sending keep-alives while idle, and counts the
      device connected when its first datagram arrives. It packs requests into PDUs of at most 1452 bytes, so
      that a datagram fits one Ethernet frame; a single message larger than that goes alone. Only datagrams
      from the device's own address and port are heard, and a datagram holding part of a PDU is discarded.
      UDP does not resend: a request whose datagram or answer is lost fails after request_timeout_ms, and a
      lost notification leaves the value stale until the next change.
  - models: [all]
    severity: info
    text: >
      Over a WebSocket (ws or wss) the module offers the AES70-OCP.1 subprotocol, as AES70-3 has controllers do,
      and sends each PDU as a binary message; what the device sends in binary messages is read as one byte
      stream, so a PDU may span messages. A device that answers without the subprotocol is refused by the
      WebSocket handshake; turn ws_subprotocol off for it. Text messages are ignored. Keep-alives are sent as
      on TCP, and a ping or pong from the device also counts as hearing from it. Over wss a self-signed
      certificate is refused unless accept_invalid_certs is on.
  - models: [all]
    severity: warning
    text: >
      Secure OCP.1 (transport tls, _ocasec._tcp, or dtls, _ocasec._udp) is TLS 1.2 or DTLS 1.2 with a pre-shared
      key and the one cipher suite AES70 names, TLS_DHE_PSK_WITH_AES_128_CBC_SHA; the device sends the identity
      hint OCA-PSK. Those facts come from SwiftOCA's documentation, which cites AES70-2024 11.2.4; the standard
      itself was not available. The open fails without a psk (hex). The identity sent is psk_identity, OCA-PSK
      unless set, as SwiftOCA sends; a device that sends another hint, or none, is still tried and the hint is
      logged. The module's own TLS client offers nothing else: no other suite or version, no certificates,
      no resumption or tickets, no compression, no renegotiation (a HelloRequest after the handshake is
      answered with no_renegotiation). It offers the extended master secret and encrypt-then-MAC and uses each
      when the device agrees. It refuses a Diffie-Hellman group under 2048 bits or over 8192 (OpenSSL 1.1.1
      offers 1024 bits for this suite unless configured otherwise), an even modulus, a generator or public
      value outside 2 to p-2, and a degenerate shared secret. A wrong key or identity fails the handshake
      (the device's alert, or its Finished not verifying), reported as the disconnect reason; the module tries
      again with the usual backoff. The handshake must finish within handshake_timeout_ms. The keep-alive is
      the first PDU once the handshake is done.
  - models: [all]
    severity: info
    text: >
      Over DTLS each OCP.1 PDU is one record in one datagram, kept within 1452 bytes with the record around it,
      as over plain UDP; a single PDU larger than a record (16 KiB) cannot be sent. The handshake follows RFC
      6347: the cookie exchange if the device asks, flights sent again on a timer from 1 s doubling to 60 s,
      fragments reassembled. A record that does not authenticate, or is replayed (a 64-record window), is
      discarded without ending the session, as DTLS asks; nothing unprotected is read after the handshake.
      Alerts and close_notify end the session as over TLS. Datagrams from any address other than the device's
      are not heard.
  - models: [all]
    severity: info
    text: >
      The AES70 standards were not available; the wire format, ids and status codes come from open
      implementations (ocac, SwiftOCA, OCAMicro), which agree with one another where they overlap. Any detail
      only one of them states is listed here.
  - models: [all]
    severity: warning
    text: >
      OcaTimeInterval (OcaDelay's delay time) is a 32-bit float in ocac (AES70-2018) and OCAMicro, and a 64-bit
      float in SwiftOCA (later revisions). The module reads it at whichever width the device sends (by the
      reply's length) and writes it at the width last read from that object, 32-bit until one has been read.
  - models: [all]
    severity: info
    text: >
      The device is reported connected when the first PDU arrives from it, not when TCP connects: OCP.1 has no
      handshake. Opened for commands only, that is the device's first keep-alive, up to one heartbeat time
      after connecting. The module sends its keep-alive first, in seconds when the interval is whole seconds and
      in milliseconds otherwise; a device that knows only the seconds form (before AES70-2018) needs a whole
      number of seconds.
  - models: [all]
    severity: info
    text: >
      Loss is judged as three heartbeat times without any PDU from the device (keep-alive, response or
      notification), as ocac cites AES70-3-2018 5.3 and as SwiftOCA and OCAMicro do. A device that does not send
      keep-alives when idle is dropped and reconnected after three intervals; raise keepalive_interval_ms for
      it.
  - models: [all]
    severity: info
    text: >
      Changes are followed with AddSubscription (subscription manager 3.1) to each known object's
      PropertyChanged event (1.1), delivery mode 1 on this connection, naming subscriber method 1.1 of object
      4096 and an empty context, as SwiftOCA does on OCP.1. A lightweight device returns the subscriber and
      context zeroed, which the module ignores. AddPropertyChangeSubscription (3.5) and the AES70-2023
      subscription methods are not used. Subscriptions end with the connection and are made again after a
      reconnection. A refused subscription is logged once; the values read on connecting then go stale.
  - models: [all]
    severity: info
    text: >
      The walk asks each block for its members with GetMembers (3.5), not GetMembersRecursive (3.6), and each
      object for its role with GetRole (1.5): one request per object, sent several to a PDU and at most
      max_in_flight at a time. A device with thousands of objects takes a moment to walk; walk_depth and walk
      limit it. Objects outside the root block (the managers) are not walked; the device manager is read
      directly.
  - models: [all]
    severity: info
    text: >
      Roles are meant to be unique within their block; a role containing '/' makes its role path ambiguous, and
      a second object with the same path is keyed with "#<ono>" appended. Object numbers are stable for a
      device's configuration, so ono addressing is the robust choice for automation; role paths are readable.
  - models: [all]
    severity: info
    text: >
      Opened for commands only, a command naming an object by role path asks the blocks on the way for their
      members and the members' roles, one level per round trip, and remembers them for the session. A
      command naming an object by number asks for its class (GetClassIdentification, 1.1) first when the
      command must check the class or marshal by it; call_method needs nothing. When monitored and walked, a
      number not found in the tree is refused at once.
  - models: [all]
    severity: info
    text: >
      Setters are acknowledged by the device's OK response and the new value is put in state then; a device
      that clamps rather than refusing reports the clamped value by notification when subscribed. Non-OK
      statuses fail the command as device_error with the status number and its name (1 ProtocolVersionError, 2
      DeviceError, 3 Locked, 4 BadFormat, 5 BadONo, 6 ParameterError, 7 ParameterOutOfRange, 8 NotImplemented,
      9 InvalidRequest, 10 ProcessingFailed, 11 BadMethod, 12 PartiallySucceeded, 13 Timeout, 14
      BufferOverflow, 15 PermissionDenied, 16 OutOfMemory, 17 Busy; 16 and 17 from SwiftOCA only).
  - models: [all]
    severity: info
    text: >
      Level sensors are polled once a second by default (one GetReading per sensor, no new one while the last
      is unanswered), not subscribed, since a meter's changes can arrive many times a second. Set level_sensors
      to subscribe to follow them by notification instead, or off.
  - models: [all]
    severity: info
    text: >
      An OCP.1 notification of type 2 (AES70-2023) is read like a type 1 notification; an exception
      notification is logged. Commands the device sends are ignored. A property change of a list item (change
      types 4-6) makes the module read the whole property again.
