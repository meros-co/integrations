  outputs.*.hdcp_mode:     { type: int, description: "DXP HD 4K PLUS: 0 encrypt when the input does, 1 always" }
  outputs.*.format:        { type: int, description: "DXP HD 4K PLUS: colour format, 0 pass-through, 1 RGB, 2 YUV 4:4:4, 3 YUV 4:2:2" }
  outputs.*.frozen:        { type: bool, description: "XTP II: the output board's picture is frozen" }
  outputs.*.endpoint_power_enabled: { type: bool, description: "XTP II: remote power to the receiver on the output is enabled" }
  outputs.*.endpoint_power_request: { type: int, description: "XTP II: power the receiver asks for, as for inputs" }
  outputs.*.endpoint_power_status: { type: int, description: "XTP II: the receiver's remote power status, as for inputs" }
  outputs.*.relays.*.closed: { type: bool, description: "XTP II: a relay (1 or 2) on the receiver is closed" }
  outputs.*.receiver_video_input: { type: int, description: "XTP II: the multi-input receiver's input selected for video" }
  outputs.*.receiver_audio_input: { type: int, description: "XTP II: the multi-input receiver's input selected for audio" }
  outputs.*.receiver_video_mute: { type: bool, description: "XTP II: the receiver's video is muted" }
  outputs.*.receiver_audio_mute_mode: { type: int, description: "XTP II: the receiver's audio mute, 0 none, 1 HDMI/S/PDIF, 2 analog, 3 all" }
  outputs.*.receiver_volume: { type: int, description: "XTP II: the receiver's volume step, 0-64" }
  outputs.*.receiver_frozen: { type: bool, description: "XTP II: the receiver's picture is frozen" }
  outputs.*.receiver_front_panel_lock: { type: int, description: "XTP II: the receiver's front panel lockout mode" }
  outputs.*.endpoints.*.hdcp_authorized: { type: bool, description: "XTP II: a receiver input accepts HDCP" }
  rooms.*.outputs:         { type: string, description: "The outputs in the room, comma-separated" }
  rooms.*.presets.*.name:  { type: string, description: "Room preset name" }
  network.dhcp:            { type: bool, description: "DHCP is on" }
  network.address:         { type: string, description: "IP address" }
  network.netmask:         { type: string, description: "Subnet mask" }
  network.gateway:         { type: string, description: "Gateway address" }
  network.mac:             { type: string, description: "MAC address" }
  network.unit_name:       { type: string, description: "Unit (host) name" }
  network.connections:     { type: int, description: "Open IP connections" }
  clock.date_time:         { type: string, description: "Date and time as the unit last gave it" }
  clock.gmt_offset:        { type: string, description: "Offset from GMT" }
  clock.daylight_saving:   { type: int, description: "Daylight saving, 0 off, 1 northern hemisphere, 2 Europe, 3 Brazil" }
  serial.*.settings:       { type: string, description: "A serial port's <baud>,<parity>,<data>,<stop>" }
  serial.*.type:           { type: int, description: "A serial port's type, 0 RS-232, 1 RS-422" }
  port_timeout.connection: { type: int, description: "This connection's IP timeout, in 10-second steps" }
  port_timeout.global:     { type: int, description: "The global IP timeout, in 10-second steps" }
  slots.*.plane:           { type: string, description: "SMX: the plane a slot's board is on, -- for an empty slot" }
  slots.*.inputs.*.edid:   { type: int, description: "SMX: EDID number assigned to an input of a slot's board" }
  slots.*.inputs.*.hdcp_authorized: { type: bool, description: "SMX: an input of a slot's board accepts HDCP" }
  planes.*.virtual_members: { type: string, description: "SMX: the planes a virtual plane (90-99) switches, comma-separated" }
  planes.*.inputs.*.name:  { type: string, description: "SMX: an input's name on the plane" }
  planes.*.outputs.*.name: { type: string, description: "SMX: an output's name on the plane" }
  planes.*.presets.*.name: { type: string, description: "SMX: a plane preset's name" }
  planes.*.inputs.*.audio_level: { type: int, unit: dB, description: "SMX: an input's audio gain (positive) or attenuation (negative) on the plane" }
  planes.*.outputs.*.volume: { type: int, description: "SMX: an output's volume step on the plane, 0-64" }
  planes.*.outputs.*.rgb_delay: { type: int, description: "SMX: an output's RGB switching delay, in 0.5-second steps" }
telemetry:
  # Verbose mode 3 is set on connecting (on_connect), so changes from any
  # source are reported and query replies are tagged. The poll reads what no
  # report gives on connecting; see the quirks.
  poll:
    send:
      - "N"
      - "I"
      - "\x1b0*1*1VC"
      - "\x1b0*1*2VC"
      - "\x1bVM"
      - "0LS"
      - "X"
      - "\x1bEXEC"
      - "\x1bDH"
      - "\x1bCI"
      - "\x1bCS"
      - "\x1bCG"
      - "\x1bCH"
      - "\x1bCN"
      - "\x1bCZ"
      - "\x1b1CP"
      - "\x1b0TC"
      - "\x1b1TC"
      - "\x1bETIE"
      - "\x1bSTAT"
      - "\x1bA1EDID"
      - "\x1bA2EDID"
      - "\x1bA3EDID"
      - "\x1bA4EDID"
      - "\x1bA5EDID"
      - "\x1bA6EDID"
      - "\x1bA7EDID"
      - "\x1bA8EDID"
      - "\x1bA9EDID"
      - "\x1bA10EDID"
      - "\x1bA11EDID"
      - "\x1bA12EDID"
      - "\x1bA13EDID"
      - "\x1bA14EDID"
      - "\x1bA15EDID"
      - "\x1bA16EDID"
      - "\x1bE1HDCP"
      - "\x1bE2HDCP"
      - "\x1bE3HDCP"
      - "\x1bE4HDCP"
      - "\x1bE5HDCP"
      - "\x1bE6HDCP"
      - "\x1bE7HDCP"
      - "\x1bE8HDCP"
      - "\x1bE9HDCP"
      - "\x1bE10HDCP"
      - "\x1bE11HDCP"
      - "\x1bE12HDCP"
      - "\x1bE13HDCP"
      - "\x1bE14HDCP"
      - "\x1bE15HDCP"
      - "\x1bE16HDCP"
      - "\x1bS1HDCP"
      - "\x1bS2HDCP"
      - "\x1bS3HDCP"
      - "\x1bS4HDCP"
      - "\x1bS5HDCP"
      - "\x1bS6HDCP"
      - "\x1bS7HDCP"
      - "\x1bS8HDCP"
      - "\x1b1VTPO"
      - "\x1b2VTPO"
      - "\x1b3VTPO"
      - "\x1b4VTPO"
      - "\x1b5VTPO"
      - "\x1b6VTPO"
      - "\x1b7VTPO"
      - "\x1b8VTPO"
      - "\x1b90MP"
      - "\x1b91MP"
      - "\x1b92MP"
      - "\x1b93MP"
      - "\x1b94MP"
      - "\x1b95MP"
      - "\x1b96MP"
      - "\x1b97MP"
      - "\x1b98MP"
      - "\x1b99MP"
    every_ms: 120000
  updates:
    # Copyright banner on connecting: model, firmware and part number (DXP HD
    # 4K PLUS p.35, XTP II p.47). Not anchored: Telnet option bytes may come
    # first.
    - match: '\(c\) Copyright \d{4}, Extron Electronics,?\s*([^,]+?),\s*V(\d+\.\d+),\s*((?:60|43)-[0-9-]+)'
      state: { device.model: "{1}", device.firmware: "{2}", device.part_number: "{3}" }
    - match: '^Login (Administrator|User)$'
      state: { device.login: "{1}" }
    - match: '^Vrb\s*([0-3])$'
      state: { device.verbose_mode: "{1}" }
    - match: '^Ver0?1\*\s*(\d+\.\d+)$'
      state: { device.firmware: "{1}" }
    - match: '^(?:Pno\s*)?((?:60|43)-\d+-\d+)$'
      state: { device.part_number: "{1}" }
    - match: '^(?:Info?\d*\*\s*)?V(\d+)X(\d+)\s+A(\d+)X(\d+)\s*$'
      state: { device.video_inputs: "{1}", device.video_outputs: "{2}", device.audio_inputs: "{3}", device.audio_outputs: "{4}" }
    # Ties: replies and reports alike (DXP HD 4K PLUS p.43, XTP II p.51).
    - match: '^Out\s*(\d+)\s+In\s*(\d+)\s+All$'
      state: { "outputs.{1}.video_input": "{2}", "outputs.{1}.audio_input": "{2}" }
    - match: '^Out\s*(\d+)\s+In\s*(\d+)\s+(?:Vid|RGB)$'
      state: { "outputs.{1}.video_input": "{2}" }
    - match: '^Out\s*(\d+)\s+In\s*(\d+)\s+Aud$'
      state: { "outputs.{1}.audio_input": "{2}" }
    # Mutes (DXP HD 4K PLUS p.46-47, XTP II p.52).
    - match: '^Vmt\s*(\d+)\*([0-2])$'
      state:
        "outputs.{1}.video_mute_mode": "{2}"
        "outputs.{1}.video_mute": { value: "{2}", map: { "0": false, "1": true, "2": true } }
    - match: '^Amt\s*(\d+)\*([0-7])$'
      state:
        "outputs.{1}.audio_mute_mode": "{2}"
        "outputs.{1}.audio_mute": { value: "{2}", map: { "0": false, "1": true, "2": true, "3": true, "4": true, "5": true, "6": true, "7": true } }
    # Levels (DXP HD 4K PLUS p.47, XTP II p.53).
    - match: '^In\s*(\d+)\s+Aud\s*([+-]?\d+)$'
      state: { "inputs.{1}.audio_level": "{2}" }
    - match: '^Out\s*(\d+)\s+Vol\s*(\d+)$'
      state: { "outputs.{1}.volume": "{2}" }
    # Presets and rooms (DXP HD 4K PLUS p.36 and p.48-50, XTP II p.48 and p.52).
    - match: '^Rpr\s*(\d+)$'
      state: { presets.last_recalled: "{1}" }
    - match: '^Spr\s*(\d+)$'
      state: { presets.last_saved: "{1}" }
    - match: '^PrstR\s*(\d+)$'
      state: { presets.last_recalled: "{1}" }
    - match: '^PrstS\s*(\d+)$'
      state: { presets.last_saved: "{1}" }
    - match: '^Rmm?\s*(\d+)\s*Rpr\s*(\d+)$'
      state: { "rooms.{1}.last_recalled": "{2}" }
    - match: '^Rmm?\s*(\d+)\s*Spr\s*(\d+)$'
      state: { "rooms.{1}.last_saved": "{2}" }
    # Names (DXP HD 4K PLUS p.44-49, DXP DVI p.62).
    - match: '^Nmi\s*(\d+),(.*)$'
      state: { "inputs.{1}.name": "{2}" }
    - match: '^Nmo\s*(\d+),(.*)$'
      state: { "outputs.{1}.name": "{2}" }
    - match: '^Nmg\s*(\d+),(.*)$'
      state: { "presets.{1}.name": "{2}" }
    - match: '^Nmr\s*(\d+),(.*)$'
      state: { "rooms.{1}.name": "{2}" }
    # Front panel, HDCP, power save.
    - match: '^Exec?\s*([0-2])$'
      state: { front_panel_lock: "{1}" }
    - match: '^HdcpI\s*(\d+)\*([0-2])$'
      state: { "inputs.{1}.hdcp_status": "{2}" }
    - match: '^HdcpO\s*(\d+)\*([0-3])$'
      state: { "outputs.{1}.hdcp_status": "{2}" }
    - match: '^Psav\s*([0-2])$'
      state: { power_save: "{1}" }
    # Full control: EDID, HDCP, rooms, XTP II endpoints, network, serial, SMX
    # planes (tagged verbose mode 3 forms).
    - match: '^EdidA\s*0*([1-9]\d*)\*0*(\d+)$'
      state: { "inputs.{1}.edid": "{2}" }
    - match: '^(\d+)\s*EdidA\s*0*([1-9]\d*)\*0*(\d+)$'
      state: { "slots.{1}.inputs.{2}.edid": "{3}" }
    - match: '^HdcpE\s*0*(\d+)\*([01])$'
      state: { "inputs.{1}.hdcp_authorized": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^(\d+)\s*HdcpE\s*0*(\d+)\*([01])$'
      state: { "slots.{1}.inputs.{2}.hdcp_authorized": { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^HdcpS\s*0*(\d+)\*([01])$'
      state: { "outputs.{1}.hdcp_mode": "{2}" }
    - match: '^Vtpo\s*0*(\d+)\*([0-3])$'
      state: { "outputs.{1}.format": "{2}" }
    - match: '^Mpr\s*0*(\d+),([\d,]+)$'
      state: { "rooms.{1}.outputs": "{2}" }
    - match: '^Nmp\s*0*(\d+)\*0*(\d+),(.*)$'
      state: { "rooms.{1}.presets.{2}.name": "{3}" }
    - match: '^PoecI\s*0*([1-9]\d*)\*([01])\*([0-2])\*([0-4])$'
      state: { "inputs.{1}.endpoint_power_enabled": { value: "{2}", map: { "0": false, "1": true } }, "inputs.{1}.endpoint_power_request": "{3}", "inputs.{1}.endpoint_power_status": "{4}" }
    - match: '^PoecO\s*0*([1-9]\d*)\*([01])\*([0-2])\*([0-4])$'
      state: { "outputs.{1}.endpoint_power_enabled": { value: "{2}", map: { "0": false, "1": true } }, "outputs.{1}.endpoint_power_request": "{3}", "outputs.{1}.endpoint_power_status": "{4}" }
    - match: '^Rely\s*0*(\d+)\*([12])\*([01])$'
      state: { "outputs.{1}.relays.{2}.closed": { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^Etie\s*0*([1-9]\d*)\*(\d)\*(\d)$'
      state: { "inputs.{1}.endpoint_video_input": "{2}", "inputs.{1}.endpoint_audio_input": "{3}" }
    - match: '^Etie00\*'
      match_each: '(\d)\*(\d)'
      state: { "inputs.{index:+1}.endpoint_video_input": "{1}", "inputs.{index:+1}.endpoint_audio_input": "{2}" }
    - match: '^EtieR\s*0*([1-9]\d*)\*(\d)\*(\d)$'
      state: { "outputs.{1}.receiver_video_input": "{2}", "outputs.{1}.receiver_audio_input": "{3}" }
    - match: '^VmtR\s*0*(\d+)\*1\*([01])$'
      state: { "outputs.{1}.receiver_video_mute": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^AmtR\s*0*(\d+)\*1\*([0-3])$'
      state: { "outputs.{1}.receiver_audio_mute_mode": "{2}" }
    - match: '^AfmtT\s*0*(\d+)\*(\d)\*([0-2])$'
      state: { "inputs.{1}.endpoints.{2}.audio_source": "{3}" }
    - match: '^AfmtI\s*0*([1-9]\d*)\*([0-2])$'
      state: { "inputs.{1}.audio_source": "{2}" }
    - match: '^AudT\s*0*(\d+)\*(\d)\*([+-]?\d+)$'
      state: { "inputs.{1}.endpoints.{2}.audio_level": "{3}" }
    - match: '^VolR\s*0*(\d+)\*1\*(\d+)$'
      state: { "outputs.{1}.receiver_volume": "{2}" }
    - match: '^HdcpRE\s*0*(\d+)\*(\d)\*([01])$'
      state: { "outputs.{1}.endpoints.{2}.hdcp_authorized": { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^HdcpTE\s*0*(\d+)\*(\d)\*([01])$'
      state: { "inputs.{1}.endpoints.{2}.hdcp_authorized": { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^HdcpT\s*0*(\d+)\*(\d)\*([0-2])$'
      state: { "inputs.{1}.endpoints.{2}.hdcp_status": "{3}" }
    - match: '^LsT\s*0*(\d+)\*(\d)\*([01])$'
      state: { "inputs.{1}.endpoints.{2}.signal": { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^FrzR\s*0*(\d+)\*1\*([01])$'
      state: { "outputs.{1}.receiver_frozen": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^FrzO\s*0*(\d+)\*([01])$'
      state: { "outputs.{1}.frozen": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^ExeT\s*0*([1-9]\d*)\*([0-2])$'
      state: { "inputs.{1}.endpoint_front_panel_lock": "{2}" }
    - match: '^ExeR\s*0*([1-9]\d*)\*([0-2])$'
      state: { "outputs.{1}.receiver_front_panel_lock": "{2}" }
    - match: '^Idh([01])$'
      state: { "network.dhcp": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^Ipi\s*(\d{1,3}(?:\.\d{1,3}){3})$'
      state: { "network.address": "{1}" }
    - match: '^Ips\s*(\d{1,3}(?:\.\d{1,3}){3})$'
      state: { "network.netmask": "{1}" }
    - match: '^Ipg\s*(\d{1,3}(?:\.\d{1,3}){3})$'
      state: { "network.gateway": "{1}" }
    - match: '^Iph\s*([0-9A-Fa-f]{2}(?:-[0-9A-Fa-f]{2}){5})$'
      state: { "network.mac": "{1}" }
    - match: '^Ipn\s*(\S+)$'
      state: { "network.unit_name": "{1}" }
    - match: '^Icc\s*0*(\d+)$'
      state: { "network.connections": "{1}" }
    - match: '^Ipt\s*(.+)$'
      state: { "clock.date_time": "{1}" }
    - match: '^Ipz\s*([+-]\d\d:\d\d)$'
      state: { "clock.gmt_offset": "{1}" }
    - match: '^Ipx([0-3])$'
      state: { "clock.daylight_saving": "{1}" }
    - match: '^Cpn\s*0*(\d+)\s*Ccp(\d+,[NOEMS],[78],[12])$'
      state: { "serial.{1}.settings": "{2}" }
    - match: '^Cpn\s*0*(\d+)\s*Cty([01])$'
      state: { "serial.{1}.type": "{2}" }
    - match: '^Pti0\*0*(\d+)$'
      state: { "port_timeout.connection": "{1}" }
    - match: '^Pti1\*0*(\d+)$'
      state: { "port_timeout.global": "{1}" }
    - match: '^Mpv\s*(\d+),([\d,]+)$'
      state: { "planes.{1}.virtual_members": "{2}" }
    - match: '^Stat\s*'
      match_each: '(\d\d|--)'
      state: { "slots.{index:+1}.plane": "{1}" }
    - match: '^(\d+)\s*Nmi\s*0*(\d+),(.*)$'
      state: { "planes.{1}.inputs.{2}.name": "{3}" }
    - match: '^(\d+)\s*Nmo\s*0*(\d+),(.*)$'
      state: { "planes.{1}.outputs.{2}.name": "{3}" }
    - match: '^(\d+)\s*Nmg\s*0*(\d+),(.*)$'
      state: { "planes.{1}.presets.{2}.name": "{3}" }
    - match: '^(\d+)\s*In\s*0*(\d+)\s+Aud\s*([+-]?\d+)$'
      state: { "planes.{1}.inputs.{2}.audio_level": "{3}" }
    - match: '^(\d+)\s*Out\s*0*(\d+)\s+Vol\s*(\d+)$'
      state: { "planes.{1}.outputs.{2}.volume": "{3}" }
    - match: '^(\d+)\s*Out\s*0*(\d+)\s+Dly\s*(\d+)$'
      state: { "planes.{1}.outputs.{2}.rgb_delay": "{3}" }
    # SMX: plane number first (p.36 and p.42-44).
    - match: '^(\d+)\s+Out\s*(\d+)\s+In\s*(\d+)\s+All$'
      state: { "planes.{1}.outputs.{2}.video_input": "{3}", "planes.{1}.outputs.{2}.audio_input": "{3}" }
    - match: '^(\d+)\s+Out\s*(\d+)\s+In\s*(\d+)\s+(?:Vid|RGB)$'
      state: { "planes.{1}.outputs.{2}.video_input": "{3}" }
    - match: '^(\d+)\s+Out\s*(\d+)\s+In\s*(\d+)\s+Aud$'
      state: { "planes.{1}.outputs.{2}.audio_input": "{3}" }
    - match: '^(\d+)\s+Vmt\s*(0*[1-9]\d*)\*([01])$'
      state: { "planes.{1}.outputs.{2}.video_mute": { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^(\d+)\s+Amt\s*(0*[1-9]\d*)\*([01])$'
      state: { "planes.{1}.outputs.{2}.audio_mute": { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^(\d+)\s+Rpr\s*(\d+)$'
      state: { "planes.{1}.last_recalled": "{2}" }
    - match: '^(\d+)\s+Spr\s*(\d+)$'
      state: { "planes.{1}.last_saved": "{2}" }
    # Positional replies, one rule per position: the current ties of outputs
    # 1-16 (Esc 0*1*1VC / Esc 0*1*2VC, "--" past the last output, DXP DVI
    # p.60, DXP HD 4K PLUS p.48), every output's mute status (Esc VM, one
    # digit per output: odd = video muted, 2 and above = an audio mute, DXP
    # DVI p.58, XTP II p.52) and every input's signal (0LS, Frq00, XTP II
    # p.57, DXP HD 4K PLUS p.50). A position past the unit's last one has no
    # digit and no rule matches it.
    - match: '^Vgp0+\*\s*Out0*1\s+(\d+)\s+(?:\S+\s+)*Vid$'
      state: { "outputs.1.video_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){1}(\d+)\s+(?:\S+\s+)*Vid$'
      state: { "outputs.2.video_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){2}(\d+)\s+(?:\S+\s+)*Vid$'
