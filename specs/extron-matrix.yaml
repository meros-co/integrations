spec: 1
id: extron-matrix
name: Extron SIS matrix switchers (DXP, XTP II CrossPoint, SMX)
vendor: Extron
category: router

# Extron's Simple Instruction Set (SIS) as its matrix switchers speak it over
# Telnet (TCP 23). Every matrix family shares the core grammar (input*output
# followed by ! for audio and video, % or & for video, $ for audio; "n," saves
# and "n." recalls a preset; Esc commands for configuration), but each family's
# user guide documents its own subset and variants. Each model below supports
# only what its own guide documents. Commands are written from the guides'
# command and response tables; page numbers are the guides' printed numbers.
#
# Not here: e-mail alerts, the file system, firmware, matrix factory resets
# (Z commands, which differ between families: Esc ZXXX resets the settings on
# the DXP and XTP II, and ties and presets on the SMX), binary EDID import and
# export, XTP II WindoWall and VGA input presets, and the XTP II serial
# insertion mode (its two values are not named in the guide).
source:
  - title: "DXP HD 4K PLUS Series Matrix Switchers User Guide, 68-2939-01 Rev. A"
    author: Extron Electronics
    url: https://media.extron.com/public/download/files/userman/68-2939-01_A_DXPHD4KPLUS_user_guide.pdf
    note: >
      Manufacturer document. SIS chapter p.35-56: connection methods and
      host communication (no start or end characters, CR LF after every
      response) and copyright message p.35; device-initiated messages
      (Password prompt, Login Administrator/User, Qik, Rpr, Spr, Vmt, Amt, Exe,
      HplgO) p.36; error codes, 5-minute connection timeout with periodic
      queries recommended, 200 connections p.37; verbose mode 1 or 3 for
      change notices p.38; symbol definitions p.39-42; ties, quick multiple tie
      and tie views p.43; input names and HDCP p.44; output names and format
      p.45; output HDCP status and video mutes p.46; input attenuation, output
      volume and audio mutes p.47; global presets, VC views and preset names
      p.48; rooms and room presets p.49-50; front panel lockout and signal
      presence p.50; verbose mode, resets and power save p.51; information
      requests p.52-53; port timeout p.54; EDID view, import and export
      p.44-45; input HDCP authorization p.44, output HDCP mode and format
      p.45; network, name, time and passwords p.53-55; serial port and
      network restart p.53-56. The guide covers the DXP 44, 84 and 88 only.
  - title: "DXP DVI, DXP DVI Pro, and DXP HDMI Series User Guide, 68-2192-01 Rev. B"
    author: Extron Electronics
    url: https://media.extron.com/public/download/files/userman/68-2192-01_B_DXP_DVI-DVI_Pro-HDMI_UG.pdf
    note: >
      Manufacturer document. 5-minute timeout and Q keep-alive, verbose mode 1
      or 3 for change notices, switcher-initiated messages (Qik, Rpr, Spr, Vmt,
      Amt, Exe) p.50-52; ties, quick multiple tie p.57; mutes and global
      presets p.58; room presets p.59; VC views of current ties (16 positions,
      dashes past the last output) p.60; signal presence (0LS) p.61; names
      (NI, NO, NG, NR) p.62; verbose mode p.70; EDID table p.56 and
      commands p.66; room outputs and room preset names p.59-63; input HDCP
      authorization p.64; status and part numbers p.65; name, time, network,
      passwords and serial ports p.70-71; sessions dropped by address and
      password changes p.79.
  - title: "XTP II CrossPoint Series User Guide, 68-1736-02 Rev. P, and Rev. Q (2026)"
    author: Extron Electronics
    url: https://media.extron.com/public/download/files/userman/68-1736-02_Q_xtp_ii_crosspoint.pdf
    note: >
      Manufacturer document covering XTP II CrossPoint 1600, 3200 and 6400.
      Telnet TCP 23, 5-minute timeout with Q keep-alive, 200 connections,
      password prompt and Login replies (6400: factory administrator password
      is the serial number) p.46-47; unsolicited messages and verbose mode 1
      or 3 for changes from other connections p.48; symbols (| may replace CR)
      p.49; error codes p.50; ties p.51; global preset recall (Esc R..PRST) and
      mutes p.52; audio gain, attenuation and volume p.53-54; input HDCP p.56;
      signal status (0LS, Frq00) p.57; information requests p.60-61; test
      patterns p.61; executive mode (Esc ..EXEC) p.62; verbose mode and port
      timeout p.66. Rev. Q (same pages except global preset recall, p.54):
      endpoint ties (ETIE, receiver input Rev. Q only) p.51; endpoint mutes
      p.52; transmitter audio source, gain, attenuation and receiver volume
      p.53-54; endpoint and input HDCP authorization, image reset, freeze
      p.55-56; endpoint signal and HDCP status p.56-57; remote power (POEC)
      p.58; receiver relays p.59; board inventory p.60; endpoint front panel
      lockout and resets p.62; IP, time, passwords and serial ports p.63-66.
  - title: "SMX System MultiMatrix Switcher User Guide, 68-1451-01 Rev. E"
    author: Extron Electronics
    url: https://media.extron.com/public/download/files/userman/SMX_Sys_68-1451-01_E.pdf
    note: >
      Manufacturer document. Ethernet connection, password prompt, 5-minute
      timeout p.34-35; switcher-initiated messages (plane-prefixed Vmt, Amt,
      Aud, Vol; Qik, Rpr, Spr, Exe, Reconfig) and error codes p.36-37;
      plane-addressed ties and quick multiple tie p.42; tie views, plane mutes
      and VM p.43; global and plane presets, VC views and virtual planes (MP)
      p.44; front panel lockout and information requests, slot planes (STAT)
      p.45-47; EDID by slot p.41 and p.48; slot signal p.49; audio and names
      per plane p.50-51; slot HDCP p.50-52; name, time, network, passwords
      and serial ports p.53-58.
  - title: Bitfocus Companion modules extron-dxp and extron-mmx-tcp (MIT)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-extron-dxp
    note: >
      Community code, read for corroboration only (top-level LICENSE is MIT;
      no code copied). It sends a line ending after each tie and query and
      answers the "Password:" prompt with the password and CR (extron-dxp);
      it parses tie replies as "Out01 In02 All" and input levels as "In01
      Aud+07" (extron-mmx-tcp, https://github.com/bitfocus/companion-module-extron-mmx-tcp).

transport:
  type: line-tcp
  port: 23
  framing: terminated
  # Simple commands need no terminator; Esc and W commands end with CR or |
  # (DXP HD 4K PLUS p.39, XTP II p.49). Every command here is sent with a CR:
  # it ends Esc commands as documented, and follows simple ones as Telnet
  # clients and Companion's modules do (see the quirks).
  terminator: cr
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  # Responses end with CR LF. The allow-list below names every response shape
  # the commands here can get (tagged verbose-mode replies, untagged numbers,
  # E-codes); the copyright banner, its date line, "Password:", "Login ...",
  # "Reconfig" and "HplgO" never match, so they are never taken as a reply.
  # Change reports from other controllers have the same text as replies and
  # cannot be told apart (see the quirks).
  reply_match: '^(E\d\d$|Out|In|Vmt|Amt|Mut|Rpr|Spr|Rmm?\s*\d|Prst|Nm[gimopr]|Exec?\s*\d|Exe[TR]|Vrb|Ver|Pno|Inf|Vgp|Frq|Hdcp|Sts|Qik|Psav|Tst|Mpr|Edid|Idh|Ip[aghimnpstuxz]|Icc|Cpn|Pti|Boot|Poec|Rely|Etie|Afmt|Aud|Vol|Aadj|Frz|Zpx|Mpv|Stat|Vtpo|V\d|\d|-|\*{4})'
  # Q (firmware version) is Extron's documented keep-alive query.
  probe: "Q"

settings:
  # Administrator or user password. Left empty for a unit without passwords;
  # nothing is then sent and no prompt is awaited.
  password: { type: string, secret: true, default: "", max_length: 128, pattern: '^[^|]*$',
              label: Password,
              description: "The switcher's administrator or user password; leave it empty for a unit without passwords, and a user-level login gets E24 for administrator commands." }

on_connect:
  # A password-protected unit sends "Password:" after the copyright banner;
  # a good password is answered "Login Administrator" or "Login User", a
  # wrong one by the prompt again (DXP HD 4K PLUS p.36, XTP II p.47, SMX
  # p.35-36). The repeated prompt becomes a whole line once the next text
  # arrives, which is the verbose-mode step below.
  - when_set: password
    after_prompt: "Password:"
    send: "{settings.password}"
    refused: '^Password:?$'
    accepted: '^Login (Administrator|User)$'
  # Verbose mode 3: tagged query replies and change reports from the front
  # panel and other connections (DXP HD 4K PLUS p.38 and p.51, XTP II p.48 and
  # p.66). Telnet connections start in mode 0. Answered "Vrb3".
  - send: "\x1b3CV"
    await_reply: true

maps:
  relay_state: { open: "0", closed: "1", toggle: "2" }
  etie_type: { video: "1", all: "3" }
  timeout_scope: { this: "0", global: "1" }

ports:
  - { port: 23, protocol: tcp, role: control }

