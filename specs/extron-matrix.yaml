    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){6}(\d+)\s+(?:\S+\s+)*Vid$'
      state: { "outputs.7.video_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){7}(\d+)\s+(?:\S+\s+)*Vid$'
      state: { "outputs.8.video_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){8}(\d+)\s+(?:\S+\s+)*Vid$'
      state: { "outputs.9.video_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){9}(\d+)\s+(?:\S+\s+)*Vid$'
      state: { "outputs.10.video_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){10}(\d+)\s+(?:\S+\s+)*Vid$'
      state: { "outputs.11.video_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){11}(\d+)\s+(?:\S+\s+)*Vid$'
      state: { "outputs.12.video_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){12}(\d+)\s+(?:\S+\s+)*Vid$'
      state: { "outputs.13.video_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){13}(\d+)\s+(?:\S+\s+)*Vid$'
      state: { "outputs.14.video_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){14}(\d+)\s+(?:\S+\s+)*Vid$'
