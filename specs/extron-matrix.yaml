    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){9}(\d+)\s+(?:\S+\s+)*Aud$'
      state: { "outputs.10.audio_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){10}(\d+)\s+(?:\S+\s+)*Aud$'
      state: { "outputs.11.audio_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){11}(\d+)\s+(?:\S+\s+)*Aud$'
      state: { "outputs.12.audio_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){12}(\d+)\s+(?:\S+\s+)*Aud$'
      state: { "outputs.13.audio_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){13}(\d+)\s+(?:\S+\s+)*Aud$'
      state: { "outputs.14.audio_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){14}(\d+)\s+(?:\S+\s+)*Aud$'
      state: { "outputs.15.audio_input": "{1}" }
    - match: '^Vgp0+\*\s*Out0*1\s+(?:\S+\s+){15}(\d+)\s+(?:\S+\s+)*Aud$'
      state: { "outputs.16.audio_input": "{1}" }
    - match: '^Mut00[\s*]+([0-7])[0-7\s]*$'
      state: { "outputs.1.video_mute": { value: "{1}", map: { "0": false, "1": true, "2": false, "3": true, "4": false, "5": true, "6": false, "7": true } }, "outputs.1.audio_mute": { value: "{1}", map: { "0": false, "1": false, "2": true, "3": true, "4": true, "5": true, "6": true, "7": true } } }
    - match: '^Mut([0-7])[0-7]*$'
      state: { "outputs.1.video_mute": { value: "{1}", map: { "0": false, "1": true, "2": false, "3": true, "4": false, "5": true, "6": false, "7": true } }, "outputs.1.audio_mute": { value: "{1}", map: { "0": false, "1": false, "2": true, "3": true, "4": true, "5": true, "6": true, "7": true } } }
    - match: '^Mut00[\s*]+(?:[0-7]\s?){1}([0-7])[0-7\s]*$'
      state: { "outputs.2.video_mute": { value: "{1}", map: { "0": false, "1": true, "2": false, "3": true, "4": false, "5": true, "6": false, "7": true } }, "outputs.2.audio_mute": { value: "{1}", map: { "0": false, "1": false, "2": true, "3": true, "4": true, "5": true, "6": true, "7": true } } }
