commands:
  # ── Ties (DXP HD 4K PLUS p.43, DXP DVI p.57, XTP II p.51) ───────────────
  tie:
    summary: Tie an input's video and audio to an output; input 0 unties the output
    params:
      input:  { type: int, min: 0, max: 128, required: true,
                label: Input,
                description: "The input number, from 1 as on the switcher; 0 unties the output." }
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "{input}*{output}!"
    expect: { matches: '^Out\s*\d+\s+In\s*\d+\s+All$' }
    returns: ack

  tie_video:
    summary: Tie an input's video only to an output (breakaway); input 0 unties it
    params:
      input:  { type: int, min: 0, max: 128, required: true,
                label: Input,
                description: "The input number, from 1 as on the switcher; 0 unties the output's video." }
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "{input}*{output}%"
    expect: { matches: '^Out\s*\d+\s+In\s*\d+\s+(Vid|RGB)$' }
    returns: ack

  tie_audio:
    summary: Tie an input's audio only to an output (breakaway); input 0 unties it
    params:
      input:  { type: int, min: 0, max: 128, required: true,
                label: Input,
                description: "The input number, from 1 as on the switcher; 0 unties the output's audio." }
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "{input}*{output}$"
    expect: { matches: '^Out\s*\d+\s+In\s*\d+\s+Aud$' }
    returns: ack

  tie_input_to_all:
    summary: Tie an input's video and audio to every output
    params:
      input: { type: int, min: 0, max: 128, required: true,
               label: Input,
               description: "The input number, from 1 as on the switcher; 0 is accepted, which by the SIS tie grammar unties every output, though the guides do not say so for this command." }
    send: "{input}*!"
    expect: { matches: '^In\s*\d+\s+All$' }
    returns: ack

  tie_video_to_all:
    summary: Tie an input's video to every output
    params:
      input: { type: int, min: 0, max: 128, required: true,
               label: Input,
               description: "The input number, from 1 as on the switcher; 0 is accepted, which by the SIS tie grammar unties every output's video, though the guides do not say so for this command." }
    send: "{input}*%"
    expect: { matches: '^In\s*\d+\s+(Vid|RGB)$' }
    returns: ack

  tie_audio_to_all:
    summary: Tie an input's audio to every output
    params:
      input: { type: int, min: 0, max: 128, required: true,
               label: Input,
               description: "The input number, from 1 as on the switcher; 0 is accepted, which by the SIS tie grammar unties every output's audio, though the guides do not say so for this command." }
    send: "{input}*$"
    expect: { matches: '^In\s*\d+\s+Aud$' }
    returns: ack

  quick_tie:
    summary: >
      Make several ties at once, switched together (Esc +Q); ties is a run of
      input*output followed by ! (video and audio), % (video) or $ (audio),
      such as 3*4%6*1$3*2!
    params:
      ties: { type: string, max_length: 240, pattern: '^(\d{1,3}\*\d{1,3}[!%&$])+$', required: true,
              label: Ties,
              description: "A run of input*output pairs, each followed by ! for video and audio, % or & for video or $ for audio, such as 3*4%6*1$3*2!, all switched together." }
    send: "\x1b+Q{ties}"
    expect: { matches: '^Qik$' }
    returns: ack

  get_tie:
    summary: Input tied to an output for video and audio (E13/E14 when the output is broken away)
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "{output}!"
    expect: { matches: '^(?:Out\s*\d+\s+In\s*)?(\d+)(?:\s+All)?$' }
    returns: value

  get_video_tie:
    summary: Input tied to an output's video
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "{output}%"
    expect: { matches: '^(?:Out\s*\d+\s+In\s*)?(\d+)(?:\s+(?:Vid|RGB))?$' }
    returns: value

  get_audio_tie:
    summary: Input tied to an output's audio
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "{output}$"
    expect: { matches: '^(?:Out\s*\d+\s+In\s*)?(\d+)(?:\s+Aud)?$' }
    returns: value

  # ── Mutes (DXP HD 4K PLUS p.46-47, DXP DVI p.58, XTP II p.52) ───────────
  set_video_mute:
    summary: Mute or unmute an output's video
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
      muted:  { type: bool, default: true, label: Muted, description: "True mutes, false unmutes." }
    send: "{output}*{muted:bool01}B"
    expect: { matches: '^Vmt\s*\d+\*[01]$' }
    returns: ack

  set_video_sync_mute:
    summary: Mute an output's video and sync (mute mode 2); unmute with set_video_mute
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "{output}*2B"
    expect: { matches: '^Vmt\s*\d+\*2$' }
    returns: ack

  get_video_mute:
    summary: An output's video mute (0 off, 1 video muted, 2 video and sync muted)
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "{output}B"
    expect: { matches: '^(?:Vmt\s*\d+\*)?([0-2])$' }
    returns: value

  set_video_mute_all:
    summary: Mute or unmute every output's video
    params:
      muted: { type: bool, default: true, label: Muted, description: "True mutes, false unmutes." }
    send: "{muted:bool01}*B"
    expect: { matches: '^Vmt\s*[01]$' }
    returns: ack

  set_audio_mute:
    summary: >
      Mute or unmute an output's audio (on DXP HD 4K PLUS, mute 1 is the HDMI
      audio only; on XTP II, the HDMI/S/PDIF audio only; see set_audio_mute_mode)
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
      muted:  { type: bool, default: true, label: Muted, description: "True mutes, false unmutes." }
    send: "{output}*{muted:bool01}Z"
    expect: { matches: '^Amt\s*\d+\*[0-7]$' }
    returns: ack

  set_audio_mute_mode:
    summary: >
      Set an output's audio mute by output type. DXP HD 4K PLUS: 0 unmute, 1
      HDMI, 2 analog, 3 HDMI and analog, 4 S/PDIF, 5 HDMI and S/PDIF, 6 analog
      and S/PDIF, 7 all (outputs 3-8 take 0-1). XTP II: 0 off, 1 HDMI/S/PDIF,
      2 analog, 3 all
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
      mode:   { type: int, min: 0, max: 7, required: true,
                label: Audio mute mode,
                description: "Which audio is muted: on DXP HD 4K PLUS 0 unmuted, 1 HDMI, 2 analog, 3 HDMI and analog, 4 S/PDIF, 5 HDMI and S/PDIF, 6 analog and S/PDIF, 7 all (outputs 3-8 take 0-1 only); on XTP II 0 off, 1 HDMI/S/PDIF, 2 analog, 3 all." }
    send: "{output}*{mode}Z"
    expect: { matches: '^Amt\s*\d+\*[0-7]$' }
    returns: ack

  get_audio_mute:
    summary: An output's audio mute mode (0 unmuted; see set_audio_mute_mode)
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "{output}Z"
    expect: { matches: '^(?:Amt\s*\d+\*)?([0-7])$' }
    returns: value

  set_audio_mute_all:
    summary: Mute or unmute every output's audio
    params:
      muted: { type: bool, default: true, label: Muted, description: "True mutes, false unmutes." }
    send: "{muted:bool01}*Z"
    expect: { matches: '^Amt\s*[01]$' }
    returns: ack

  get_mutes:
    summary: >
      Every output's mute status, one digit per output from output 1 (0 none, 1
      video; 2 and above an audio mute)
    send: "\x1bVM"
    expect: { matches: '^(?:Mut(?:00[\s*]+|\s*))?([0-7][0-7\s]*)$' }
    returns: value

  # ── Presets (DXP HD 4K PLUS p.48-50, DXP DVI p.58-60, XTP II p.52, SMX p.44)
  save_global_preset:
    summary: Save the current ties as a global preset
    params:
      preset: { type: int, min: 1, max: 32, required: true,
                label: Preset,
                description: "The global preset number, from 1 to 32 as on the switcher, to save the current ties to, replacing what it held." }
    send: "{preset},"
    expect: { matches: '^Spr\s*\d+$' }
    returns: ack

  recall_global_preset:
    summary: Recall a global preset, replacing the current ties (E11 if never saved)
    params:
      preset: { type: int, min: 1, max: 32, required: true,
                label: Preset,
                description: "The global preset number, from 1 to 32 as on the switcher; a preset never saved answers E11 and changes nothing." }
    send: "{preset}."
    expect: { matches: '^Rpr\s*\d+$' }
    returns: ack

  recall_global_preset_prst:
    summary: Recall a global preset, replacing the current ties (XTP II, Esc R..PRST)
    params:
      preset: { type: int, min: 1, max: 32, required: true,
                label: Preset,
                description: "The global preset number, from 1 to 32 as on the switcher, saved from the front panel; a preset never saved answers E11 and changes nothing." }
    send: "\x1bR{preset}PRST"
    expect: { matches: '^PrstR\s*\d+$' }
    returns: ack

  get_global_preset_video_ties:
    summary: >
      Inputs tied to outputs 1-16 for video in a global preset, preset 0 for the
      current ties ("--" past the last output)
    params:
      preset: { type: int, min: 0, max: 32, required: true,
                label: Preset,
                description: "The global preset number, from 1 to 32 as on the switcher, or 0 for the current ties." }
    send: "\x1b{preset}*1*1VC"
    expect: { matches: '^(?:Vgp\d+\*\s*Out\d+\s+)?(.*\S)\s+Vid$' }
    returns: value

  get_global_preset_audio_ties:
    summary: Inputs tied to outputs 1-16 for audio in a global preset, preset 0 for the current ties
    params:
      preset: { type: int, min: 0, max: 32, required: true,
                label: Preset,
                description: "The global preset number, from 1 to 32 as on the switcher, or 0 for the current ties." }
    send: "\x1b{preset}*1*2VC"
    expect: { matches: '^(?:Vgp\d+\*\s*Out\d+\s+)?(.*\S)\s+Aud$' }
    returns: value

  set_global_preset_name:
    summary: Name a global preset (up to 16 characters, no |)
    params:
      preset: { type: int, min: 1, max: 32, required: true,
                label: Preset,
                description: "The global preset number, from 1 to 32 as on the switcher." }
      name:   { type: string, max_length: 16, pattern: '^[^|]+$', required: true,
                label: Name,
                description: "The preset's name, up to 16 characters, without |." }
    send: "\x1b{preset},{name}NG"
    expect: { matches: '^Nmg\s*\d+,' }
    returns: ack

  get_global_preset_name:
    summary: A global preset's name ([unassigned] when never saved)
    params:
      preset: { type: int, min: 1, max: 32, required: true,
                label: Preset,
                description: "The global preset number, from 1 to 32 as on the switcher." }
    send: "\x1b{preset}NG"
    expect: { matches: '^Nmg\s*\d+,(.*)$' }
    returns: value

  save_room_preset:
    summary: Save the current ties of a room's outputs as one of its presets
    params:
      room:   { type: int, min: 1, max: 10, required: true,
                label: Room,
                description: "The room number, from 1 to 10 as on the switcher, a room being a group of outputs set up on the unit." }
      preset: { type: int, min: 1, max: 10, required: true,
                label: Room preset,
                description: "The room's preset number, from 1 to 10, to save the room's current ties to, replacing what it held." }
    send: "{room}*{preset},"
    expect: { matches: '^Rmm?\s*\d+\s*Spr\s*\d+$' }
    returns: ack

  recall_room_preset:
    summary: Recall a room preset, replacing the ties of that room's outputs
    params:
      room:   { type: int, min: 1, max: 10, required: true,
                label: Room,
                description: "The room number, from 1 to 10 as on the switcher, a room being a group of outputs set up on the unit." }
      preset: { type: int, min: 1, max: 10, required: true,
                label: Room preset,
                description: "The room's preset number, from 1 to 10; a preset never saved answers E11 and changes nothing." }
    send: "{room}*{preset}."
    expect: { matches: '^Rmm?\s*\d+\s*Rpr\s*\d+$' }
    returns: ack

  set_room_name:
    summary: Name a room (up to 12 characters, no |)
    params:
      room: { type: int, min: 1, max: 10, required: true,
              label: Room,
              description: "The room number, from 1 to 10 as on the switcher, a room being a group of outputs set up on the unit." }
      name: { type: string, max_length: 12, pattern: '^[^|]+$', required: true,
              label: Name,
              description: "The room's name, up to 12 characters, without |." }
    send: "\x1b{room},{name}NR"
    expect: { matches: '^Nmr\s*\d+,' }
    returns: ack

  get_room_name:
    summary: A room's name
    params:
      room: { type: int, min: 1, max: 10, required: true,
              label: Room,
              description: "The room number, from 1 to 10 as on the switcher, a room being a group of outputs set up on the unit." }
    send: "\x1b{room}NR"
    expect: { matches: '^Nmr\s*\d+,(.*)$' }
    returns: value

  # ── Names (DXP HD 4K PLUS p.44-45, DXP DVI p.62) ────────────────────────
  set_input_name:
    summary: Name an input (up to 16 characters, no |)
    params:
      input: { type: int, min: 1, max: 128, required: true,
               label: Input,
               description: "The input number, from 1 as on the switcher." }
      name:  { type: string, max_length: 16, pattern: '^[^|]+$', required: true,
               label: Name,
               description: "The input's name, up to 16 characters, without |." }
    send: "\x1b{input},{name}NI"
    expect: { matches: '^Nmi\s*\d+,' }
    returns: ack

  get_input_name:
    summary: An input's name
    params:
      input: { type: int, min: 1, max: 128, required: true,
               label: Input,
               description: "The input number, from 1 as on the switcher." }
    send: "\x1b{input}NI"
    expect: { matches: '^Nmi\s*\d+,(.*)$' }
    returns: value

  set_output_name:
    summary: Name an output (up to 16 characters, no |)
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
      name:   { type: string, max_length: 16, pattern: '^[^|]+$', required: true,
                label: Name,
                description: "The output's name, up to 16 characters, without |." }
    send: "\x1b{output},{name}NO"
    expect: { matches: '^Nmo\s*\d+,' }
    returns: ack

  get_output_name:
    summary: An output's name
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "\x1b{output}NO"
    expect: { matches: '^Nmo\s*\d+,(.*)$' }
    returns: value

  # ── Audio levels (DXP HD 4K PLUS p.47, XTP II p.53-54) ──────────────────
  set_input_attenuation_db:
    summary: Set an input's attenuation, -20 to 0 dB (DXP HD 4K PLUS)
    params:
      input: { type: int, min: 1, max: 128, required: true,
               label: Input,
               description: "The input number, from 1 as on the switcher." }
      level: { type: int, min: -20, max: 0, required: true,
               label: Attenuation,
               description: "The input's level in dB, from -20 to 0, where 0 is no attenuation." }
    send: "{input}*{level}G"
    expect: { matches: '^In\s*\d+\s+Aud\s*[+-]?\d+$' }
    returns: ack

  set_input_gain:
    summary: Set an analog input's gain, 0 to +24 dB (XTP II)
    params:
      input: { type: int, min: 1, max: 128, required: true,
               label: Input,
               description: "The input number, from 1 as on the switcher." }
      gain:  { type: int, min: 0, max: 24, required: true,
               label: Gain,
               description: "The analog input's gain in dB, from 0 to 24." }
    send: "{input}*{gain}G"
    expect: { matches: '^In\s*\d+\s+Aud\s*[+-]?\d+$' }
    returns: ack

  set_input_attenuation:
    summary: Set an analog input's attenuation, 1 to 18 dB (XTP II; lowercase g is significant)
    params:
      input:       { type: int, min: 1, max: 128, required: true,
                     label: Input,
                     description: "The input number, from 1 as on the switcher." }
      attenuation: { type: int, min: 1, max: 18, required: true,
                     label: Attenuation,
                     description: "How far to cut the analog input, in dB from 1 to 18." }
    send: "{input}*{attenuation}g"
    expect: { matches: '^In\s*\d+\s+Aud\s*[+-]?\d+$' }
    returns: ack

  increase_input_level:
    summary: Raise an input's level by 1 dB
    params:
      input: { type: int, min: 1, max: 128, required: true,
               label: Input,
               description: "The input number, from 1 as on the switcher." }
    send: "{input}+G"
    expect: { matches: '^In\s*\d+\s+Aud\s*[+-]?\d+$' }
    returns: ack

  decrease_input_level:
    summary: Lower an input's level by 1 dB
    params:
      input: { type: int, min: 1, max: 128, required: true,
               label: Input,
               description: "The input number, from 1 as on the switcher." }
    send: "{input}-G"
    expect: { matches: '^In\s*\d+\s+Aud\s*[+-]?\d+$' }
    returns: ack

  get_input_level:
    summary: An input's gain (positive) or attenuation (negative) in dB
    params:
      input: { type: int, min: 1, max: 128, required: true,
               label: Input,
               description: "The input number, from 1 as on the switcher." }
    send: "{input}G"
    expect: { matches: '^(?:In\s*\d+\s+Aud\s*)?([+-]?\d+)$' }
    returns: value

  set_output_volume:
    summary: >
      Set an output's volume: 0-100 percent on DXP HD 4K PLUS (0-64 in MKP
      mode), 0-64 dB steps on XTP II
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
      level:  { type: int, min: 0, max: 100, required: true,
                label: Volume,
                description: "On DXP HD 4K PLUS a percentage from 0 to 100 (0 to 64 in MKP mode); on XTP II a step from 0 to 64 in 1 dB steps; 0 is the lowest." }
    send: "{output}*{level}V"
    expect: { matches: '^Out\s*\d+\s+Vol\s*\d+$' }
    returns: ack

  increase_output_volume:
    summary: Raise an output's volume by one step (about 1 dB)
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "{output}+V"
    expect: { matches: '^Out\s*\d+\s+Vol\s*\d+$' }
    returns: ack

  decrease_output_volume:
    summary: Lower an output's volume by one step (about 1 dB)
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "{output}-V"
    expect: { matches: '^Out\s*\d+\s+Vol\s*\d+$' }
    returns: ack

  get_output_volume:
    summary: An output's volume
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "{output}V"
    expect: { matches: '^(?:Out\s*\d+\s+Vol\s*)?(\d+)$' }
    returns: value

  # ── Front panel (DXP HD 4K PLUS p.50, DXP DVI p.39, SMX p.45, XTP II p.62)
  set_front_panel_lock:
    summary: Front panel lockout (executive mode) 0 unlocked, 1 fully locked, 2 basic functions only
    params:
      mode: { type: int, min: 0, max: 2, required: true,
              label: Lockout mode,
              description: "The front panel lockout (executive mode): 0 unlocked, 1 fully locked, 2 only basic functions available." }
    send: "{mode}X"
    expect: { matches: '^Exe\s*[0-2]$' }
    returns: ack

  get_front_panel_lock:
    summary: Front panel lockout mode
    send: "X"
    expect: { matches: '^(?:Exe\s*)?([0-2])$' }
    returns: value

  set_executive_mode:
    summary: >
      XTP II front panel executive mode: 0 unlocked, 1 locked (view only), 2
      locked except basic features (default)
    params:
      mode: { type: int, min: 0, max: 2, required: true,
              label: Executive mode,
              description: "The front panel executive mode: 0 unlocked, 1 locked (view only), 2 locked except basic features, the default." }
    send: "\x1b{mode}EXEC"
    expect: { matches: '^Exec\s*[0-2]$' }
    returns: ack

  get_executive_mode:
    summary: XTP II front panel executive mode
    send: "\x1bEXEC"
    expect: { matches: '^(?:Exec\s*)?([0-2])$' }
    returns: value

  # ── Status and information ──────────────────────────────────────────────
  get_signal_status:
    summary: Signal presence on every input, one digit per input from input 1 (1 = signal; 3 on DXP DVI)
    send: "0LS"
    expect: { matches: '^(?:Frq00[\s*]*)?([0-3][0-3\s]*)$' }
    returns: value

  get_input_hdcp_status:
    summary: An input's HDCP status (0 no source, 1 HDCP source, 2 source without HDCP)
    params:
      input: { type: int, min: 1, max: 128, required: true,
               label: Input,
               description: "The input number, from 1 as on the switcher." }
    send: "\x1bI{input}HDCP"
    expect: { matches: '^(?:HdcpI\s*\d+\*)?([0-2])$' }
    returns: value

  get_output_hdcp_status:
    summary: >
      An output's HDCP status (0 no sink, 1 sink without HDCP, 2 HDCP sink not
      encrypted, 3 HDCP sink encrypted)
    params:
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher." }
    send: "\x1bO{output}HDCP"
    expect: { matches: '^(?:HdcpO\s*\d+\*)?([0-3])$' }
    returns: value

  set_power_save:
    summary: Power save mode 0 normal, 1 limited (any front panel or SIS action wakes it), 2 limited until Esc 0PSAV
    params:
      mode: { type: int, min: 0, max: 2, required: true,
              label: Power save mode,
              description: "The power state: 0 normal; 1 limited, woken by any front panel or SIS action; 2 limited until Esc 0PSAV is sent." }
    send: "\x1b{mode}PSAV"
    expect: { matches: '^Psav\s*[0-2]$' }
    returns: ack

  get_power_save:
    summary: Power save mode
    send: "\x1bPSAV"
    expect: { matches: '^(?:Psav\s*)?([0-2])$' }
    returns: value

  set_test_pattern:
    summary: >
      XTP II test pattern on all outputs: 0 off, 1/2 colour bars/black at
      720p50, 3/4 at 720p60, 5/6 at 1080p60
    params:
      pattern: { type: int, min: 0, max: 6, required: true,
                 label: Test pattern,
                 description: "The pattern on all outputs: 0 off, 1 colour bars and 2 black at 720p50, 3 and 4 the same at 720p60, 5 and 6 at 1080p60." }
    send: "\x1b{pattern:02d}TEST"
    expect: { matches: '^Tst\s*\d+$' }
    returns: ack

  get_test_pattern:
    summary: XTP II test pattern in use
    send: "\x1bTEST"
    expect: { matches: '^(?:Tst\s*)?(\d+)$' }
    returns: value

  set_verbose_mode:
    summary: >
      Verbose mode of this connection: 0 none, 1 change reports, 2 tagged
      replies, 3 both (set on connecting; lower modes stop the state updates)
    params:
      mode: { type: int, min: 0, max: 3, required: true,
              label: Verbose mode,
              description: "This connection's verbose mode: 0 none, 1 change reports, 2 tagged replies, 3 both, set on connecting; a lower mode stops the state updates." }
    send: "\x1b{mode}CV"
    expect: { matches: '^Vrb\s*[0-3]$' }
    returns: ack

  get_verbose_mode:
    summary: Verbose mode of this connection
    send: "\x1bCV"
    expect: { matches: '^(?:Vrb\s*)?([0-3])$' }
    returns: value

  get_firmware:
    summary: Firmware version (n.nn)
    send: "Q"
    expect: { matches: '^(?:Ver\d*\*\s*)?(\d+\.\d+)' }
    returns: value

  get_firmware_full:
    summary: Firmware version with build number
    send: "*Q"
    expect: { matches: '^(?:(?:Ver|Bld)\d*\*?\s*)?(\d[\d.]*)' }
    returns: value

  get_part_number:
    summary: Extron part number (60-nnnn-nn), which identifies the model
    send: "N"
    expect: { matches: '^(?:Pno\s*)?((?:60|43)-[0-9-]+)' }
    returns: value

  get_info:
    summary: Video and audio matrix sizes (and, on SMX, each plane's)
    send: "I"
    expect: { matches: '^(?:Info?\d*\*\s*)?(V.*)$' }
    returns: value

  get_status:
    summary: Power supply, temperature and fan status, as the model reports it
    send: "S"
    expect: { matches: '^(?:Sts\d*\*\s*)?(.+)$' }
    returns: value

  # ── SMX: plane-addressed commands (SMX p.42-44) ─────────────────────────
  smx_tie:
    summary: Tie an input's video and audio to an output on one plane; input 0 unties
    params:
      plane:  { type: int, min: 0, max: 99, required: true,
                label: Plane,
                description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      input:  { type: int, min: 0, max: 128, required: true,
                label: Input,
                description: "The input number, from 1 as on the switcher on that plane; 0 unties the output." }
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher on that plane." }
    send: "{plane:02d}*{input}*{output}!"
    expect: { matches: '^\d+\s+Out\s*\d+\s+In\s*\d+\s+All$' }
    returns: ack

  smx_tie_video:
    summary: Tie an input's video to an output on one plane
    params:
      plane:  { type: int, min: 0, max: 99, required: true,
                label: Plane,
                description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      input:  { type: int, min: 0, max: 128, required: true,
                label: Input,
                description: "The input number, from 1 as on the switcher on that plane; 0 is accepted and by the SIS tie grammar unties the output's video, which the guide does not state for this command." }
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher on that plane." }
    send: "{plane:02d}*{input}*{output}%"
    expect: { matches: '^\d+\s+Out\s*\d+\s+In\s*\d+\s+(Vid|RGB)$' }
    returns: ack

  smx_tie_audio:
    summary: Tie an input's audio to an output on one plane
    params:
      plane:  { type: int, min: 0, max: 99, required: true,
                label: Plane,
                description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      input:  { type: int, min: 0, max: 128, required: true,
                label: Input,
                description: "The input number, from 1 as on the switcher on that plane; 0 is accepted and by the SIS tie grammar unties the output's audio, which the guide does not state for this command." }
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher on that plane." }
    send: "{plane:02d}*{input}*{output}$"
    expect: { matches: '^\d+\s+Out\s*\d+\s+In\s*\d+\s+Aud$' }
    returns: ack

  smx_tie_input_to_all:
    summary: Tie an input's video and audio to every output of one plane
    params:
      plane: { type: int, min: 0, max: 99, required: true,
               label: Plane,
               description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      input: { type: int, min: 0, max: 128, required: true,
               label: Input,
               description: "The input number, from 1 as on the switcher on that plane; 0 is accepted, which by the SIS tie grammar unties every output of the plane, though the guide does not say so." }
    send: "{plane:02d}*{input}*!"
    expect: { matches: '^\d+\s+In\s*\d+\s+All$' }
    returns: ack

  smx_quick_tie:
    summary: >
      Make several plane ties at once (Esc +Q); ties is a run of
      plane*input*output followed by !, % or $, such as 01*3*4!01*3*5%
    params:
      ties: { type: string, max_length: 240, pattern: '^(\d{1,2}\*\d{1,3}\*\d{1,3}[!%&$])+$', required: true,
              label: Ties,
              description: "A run of plane*input*output ties, plane as two digits, each followed by ! for video and audio, % or & for video or $ for audio, such as 01*3*4!01*3*5%, all switched together." }
    send: "\x1b+Q{ties}"
    expect: { matches: '^Qik$' }
    returns: ack

  smx_get_video_tie:
    summary: Input tied to an output's video on one plane
    params:
      plane:  { type: int, min: 0, max: 99, required: true,
                label: Plane,
                description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher on that plane." }
    send: "{plane:02d}*{output}%"
    expect: { matches: '^(?:\d+\s+Out\s*\d+\s+In\s*)?(\d+)(?:\s+(?:Vid|RGB))?$' }
    returns: value

  smx_get_audio_tie:
    summary: Input tied to an output's audio on one plane
    params:
      plane:  { type: int, min: 0, max: 99, required: true,
                label: Plane,
                description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher on that plane." }
    send: "{plane:02d}*{output}$"
    expect: { matches: '^(?:\d+\s+Out\s*\d+\s+In\s*)?(\d+)(?:\s+Aud)?$' }
    returns: value

  smx_set_video_mute:
    summary: Mute or unmute an output's video on one plane
    params:
      plane:  { type: int, min: 0, max: 99, required: true,
                label: Plane,
                description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher on that plane." }
      muted:  { type: bool, default: true, label: Muted, description: "True mutes, false unmutes." }
    send: "{plane:02d}*{output}*{muted:bool01}B"
    expect: { matches: '^\d+\s+Vmt\s*\d+\*[01]$' }
    returns: ack

  smx_get_video_mute:
    summary: An output's video mute on one plane (0 off, 1 on)
    params:
      plane:  { type: int, min: 0, max: 99, required: true,
                label: Plane,
                description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher on that plane." }
    send: "{plane:02d}*{output}B"
    expect: { matches: '^(?:\d+\s+Vmt\s*\d+\*)?([01])$' }
    returns: value

  smx_set_plane_video_mute:
    summary: Mute or unmute the video of every output on one plane
    params:
      plane: { type: int, min: 0, max: 99, required: true,
               label: Plane,
               description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      muted: { type: bool, default: true, label: Muted, description: "True mutes, false unmutes." }
    send: "{plane:02d}*{muted:bool01}*B"
    expect: { matches: '^\d+\s+Vmt\s*00\*[01]$' }
    returns: ack

  smx_set_audio_mute:
    summary: Mute or unmute an output's audio on one plane
    params:
      plane:  { type: int, min: 0, max: 99, required: true,
                label: Plane,
                description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher on that plane." }
      muted:  { type: bool, default: true, label: Muted, description: "True mutes, false unmutes." }
    send: "{plane:02d}*{output}*{muted:bool01}Z"
    expect: { matches: '^\d+\s+Amt\s*\d+\*[01]$' }
    returns: ack

  smx_get_audio_mute:
    summary: An output's audio mute on one plane (0 off, 1 on)
    params:
      plane:  { type: int, min: 0, max: 99, required: true,
                label: Plane,
                description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      output: { type: int, min: 1, max: 128, required: true,
                label: Output,
                description: "The output number, from 1 as on the switcher on that plane." }
    send: "{plane:02d}*{output}Z"
    expect: { matches: '^(?:\d+\s+Amt\s*\d+\*)?([01])$' }
    returns: value

  smx_set_plane_audio_mute:
    summary: Mute or unmute the audio of every output on one plane
    params:
      plane: { type: int, min: 0, max: 99, required: true,
               label: Plane,
               description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      muted: { type: bool, default: true, label: Muted, description: "True mutes, false unmutes." }
    send: "{plane:02d}*{muted:bool01}*Z"
    expect: { matches: '^\d+\s+Amt\s*00\*[01]$' }
    returns: ack

  smx_get_mutes:
    summary: Every output's mute status on one plane, one digit per output (0 none, 1 video, 2 audio, 3 both)
    params:
      plane: { type: int, min: 0, max: 99, required: true,
               label: Plane,
               description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
    send: "\x1b{plane:02d}VM"
    expect: { matches: '^(?:Mut\s*\d+\*)?([0-3][0-3\s]*)$' }
    returns: value

  smx_save_plane_preset:
    summary: Save one plane's current ties as a plane preset
    params:
      plane:  { type: int, min: 0, max: 99, required: true,
                label: Plane,
                description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      preset: { type: int, min: 1, max: 10, required: true,
                label: Plane preset,
                description: "The plane preset number, from 1 to 10, to save the plane's current ties to, replacing what it held." }
    send: "{plane:02d}*{preset}*0,"
    expect: { matches: '^\d+\s+Spr\s*\d+$' }
    returns: ack

  smx_recall_plane_preset:
    summary: Recall a plane preset, replacing that plane's ties
    params:
      plane:  { type: int, min: 0, max: 99, required: true,
                label: Plane,
                description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes defined on the unit." }
      preset: { type: int, min: 1, max: 10, required: true,
                label: Plane preset,
                description: "The plane preset number, from 1 to 10; a preset never saved answers E11 and changes nothing." }
    send: "{plane:02d}*{preset}*0."
    expect: { matches: '^\d+\s+Rpr\s*\d+$' }
    returns: ack

  # ── Full control: EDID, HDCP, rooms, XTP II endpoints, network, time,
  # serial ports, passwords, SMX planes ─────────────────────────────────
  edid_assign:
    summary: "Assign an EDID (1-8 an output's sink, 9-36 factory, 37-40 user) to an input"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      edid: { type: int, min: 1, max: 40, required: true, label: EDID, description: "EDID number from the guide's table: 1-8 the sink on that output, 9-36 factory resolutions and rates, 37-40 user slots." }
    send: "\x1bA{input}*{edid}EDID"
    expect: { matches: '^EdidA\s*\d+\*\d+$' }
    returns: ack

  edid_assign_all:
    summary: "Assign an EDID to every input"
    params:
      edid: { type: int, min: 1, max: 40, required: true, label: EDID, description: "EDID number from the guide's table, 1 to 40." }
    send: "\x1bA{edid}*EDID"
    expect: { matches: '^EdidA0*\*\d+$' }
    returns: ack

  get_edid_assignment:
    summary: "The EDID number assigned to an input"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
    send: "\x1bA{input}EDID"
    expect: { matches: '^(?:EdidA\s*\d+\*)?(\d+)$' }
    returns: value

  edid_save_output:
    summary: "Save the sink EDID on output 1 into a user EDID slot (37-40), overwriting it"
    params:
      edid: { type: int, min: 37, max: 40, required: true, label: User EDID, description: "User EDID slot 37 to 40 to save output 1's sink EDID into." }
    send: "\x1bS{edid}EDID"
    expect: { matches: '^EdidS\s*\d+$' }
    returns: ack

  smx_edid_assign:
    summary: "Assign an EDID (0 automatic, 1-8 sink, 9-36 factory, 37-40 user) to an input of a slot's board"
    params:
      slot: { type: int, min: 1, max: 10, required: true, label: Slot, description: "The SMX frame slot, 1 to 10 by frame size." }
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      edid: { type: int, min: 0, max: 40, required: true, label: EDID, description: "EDID number: 0 automatic, 1-8 a stored sink EDID, 9-36 factory, 37-40 user." }
    send: "\x1bA{slot}*{input}*{edid}EDID"
    expect: { matches: '^\d+\s*EdidA\s*\d+\*\d+$' }
    returns: ack

  smx_edid_assign_all:
    summary: "Assign an EDID to every input of a slot's board"
    params:
      slot: { type: int, min: 1, max: 10, required: true, label: Slot, description: "The SMX frame slot, 1 to 10 by frame size." }
      edid: { type: int, min: 0, max: 40, required: true, label: EDID, description: "EDID number: 0 automatic, 1-8 a stored sink EDID, 9-36 factory, 37-40 user." }
    send: "\x1bA{slot}*{edid}*EDID"
    expect: { matches: '^\d+\s*EdidA0*\*\d+$' }
    returns: ack

  smx_get_edid_assignment:
    summary: "The EDID number assigned to an input of a slot's board"
    params:
      slot: { type: int, min: 1, max: 10, required: true, label: Slot, description: "The SMX frame slot, 1 to 10 by frame size." }
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
    send: "\x1bA{slot}*{input}EDID"
    expect: { matches: '^(?:\d+\s*EdidA\s*\d+\*)?(\d+)$' }
    returns: value

  smx_edid_save_output:
    summary: "Save the sink EDID on a slot's output 1 into a user EDID slot (37-40)"
    params:
      slot: { type: int, min: 1, max: 10, required: true, label: Slot, description: "The SMX frame slot, 1 to 10 by frame size." }
      edid: { type: int, min: 37, max: 40, required: true, label: User EDID, description: "User EDID slot 37 to 40." }
    send: "\x1bS{slot}*{edid}EDID"
    expect: { matches: '^\d+\s*EdidS\s*\d+$' }
    returns: ack

  get_edid_hex:
    summary: "An EDID slot's data as hex (slots 1-8 inputs, then the outputs' sink EDIDs by model)"
    params:
      slot: { type: int, min: 1, max: 16, required: true, label: EDID slot, description: "EDID slot: DXP 44 1-4 inputs and 5-8 outputs, DXP 84 1-8 and 9-12, DXP 88 1-8 and 9-16." }
    send: "\x1bR{slot}EDID"
    expect: { matches: '^(?:EdidR\s*)?([0-9A-Fa-f]{256,512})$' }
    returns: value

  get_edid_native_resolution:
    summary: "An EDID slot's native resolution and rate"
    params:
      slot: { type: int, min: 1, max: 16, required: true, label: EDID slot, description: "EDID slot: DXP 44 1-4 inputs and 5-8 outputs, DXP 84 1-8 and 9-12, DXP 88 1-8 and 9-16." }
    send: "\x1bN{slot}EDID"
    expect: { matches: '^EdidN\s*(.+)$' }
    returns: value

  edid_import_file:
    summary: "Load an input's EDID slot from a .bin file (128 or 256 bytes) on the switcher's file system"
    params:
      slot: { type: int, min: 1, max: 8, required: true, label: EDID slot, description: "Input EDID slot, 1-4 on the DXP 44 and 1-8 on the DXP 84 and 88." }
      file: { type: string, max_length: 64, pattern: '^[A-Za-z0-9_/.-]+\.bin$', required: true, label: File, description: "File name on the switcher, with an optional path, ending .bin." }
    send: "\x1bI{slot},{file}EDID"
    expect: { matches: '^EdidI\s*\d+$' }
    returns: ack

  edid_export_file:
    summary: "Save an EDID slot to a .bin file on the switcher's file system"
    params:
      slot: { type: int, min: 1, max: 16, required: true, label: EDID slot, description: "EDID slot, as for get_edid_hex." }
      file: { type: string, max_length: 64, pattern: '^[A-Za-z0-9_/.-]+\.bin$', required: true, label: File, description: "File name on the switcher, with an optional path, ending .bin." }
    send: "\x1bE{slot},{file}EDID"
    expect: { matches: '^EdidE\s*\d+$' }
    returns: ack

  set_input_hdcp_authorization:
    summary: "Allow or refuse HDCP on an input (refused: the source sees a sink without HDCP)"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      enabled: { type: bool, required: true, label: Enabled, description: "On lets the input accept HDCP, off does not." }
    send: "\x1bE{input}*{enabled:bool01}HDCP"
    expect: { matches: '^HdcpE\s*\d+\*[01]$' }
    returns: ack

  get_input_hdcp_authorization:
    summary: "Whether an input accepts HDCP (1) or not (0)"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
    send: "\x1bE{input}HDCP"
    expect: { matches: '^(?:HdcpE\s*\d+\*)?([01])$' }
    returns: value

  set_output_hdcp_mode:
    summary: "Set an output's HDCP: 0 follows the input, 1 always encrypts"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      mode: { type: int, min: 0, max: 1, required: true, label: HDCP mode, description: "0 encrypts only when the input is encrypted, 1 always encrypts." }
    send: "\x1bS{output}*{mode}HDCP"
    expect: { matches: '^HdcpS\s*\d+\*[01]$' }
    returns: ack

  set_output_format:
    summary: "Set an output's colour format: 0 pass-through, 1 RGB, 2 YUV 4:4:4, 3 YUV 4:2:2"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      format: { type: int, min: 0, max: 3, required: true, label: Format, description: "0 pass-through, 1 RGB, 2 YUV 4:4:4, 3 YUV 4:2:2." }
    send: "\x1b{output}*{format}VTPO"
    expect: { matches: '^Vtpo\s*\d+\*[0-3]$' }
    returns: ack

  get_output_format:
    summary: "An output's colour format (0-3)"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
    send: "\x1b{output}VTPO"
    expect: { matches: '^(?:Vtpo\s*\d+\*)?([0-3])$' }
    returns: value

  set_room_outputs:
    summary: "Set the outputs in a room (up to 16, each in one room only)"
    params:
      room: { type: int, min: 1, max: 10, required: true, label: Room, description: "Room number, 1 to 10." }
      outputs: { type: string, pattern: '^\d{1,3}(,\d{1,3}){0,15}$', required: true, label: Outputs, description: "Comma-separated output numbers, such as 1,2,5." }
    send: "\x1b{room},{outputs}MR"
    expect: { matches: '^Mpr\s*\d+,' }
    returns: ack

  get_room_outputs:
    summary: "The outputs in a room, comma-separated"
    params:
      room: { type: int, min: 1, max: 10, required: true, label: Room, description: "Room number, 1 to 10." }
    send: "\x1b{room}MR"
    expect: { matches: '^(?:Mpr\s*\d+,)?([\d,]+)$' }
    returns: value

  set_room_preset_name:
    summary: "Name a room preset (up to 12 characters; a space restores the default)"
    params:
      room: { type: int, min: 1, max: 10, required: true, label: Room, description: "Room number, 1 to 10." }
      preset: { type: int, min: 1, max: 10, required: true, label: Room preset, description: "Room preset number, 1 to 10." }
      name: { type: string, max_length: 12, pattern: '^[^|]+$', required: true, label: Name, description: "Name of up to 12 characters without |; a single space restores the default." }
    send: "\x1b{room}*{preset},{name}NP"
    expect: { matches: '^Nmp\s*\d+\*\d+,' }
    returns: ack

  set_input_endpoint_power:
    summary: "Enable or disable remote power to the transmitter on an input"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      enabled: { type: bool, required: true, label: Enabled, description: "On powers the endpoint, off does not." }
    send: "\x1bI{input}*{enabled:bool01}POEC"
    expect: { matches: '^PoecI\s*\d+\*' }
    returns: ack

  set_output_endpoint_power:
    summary: "Enable or disable remote power to the receiver on an output"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      enabled: { type: bool, required: true, label: Enabled, description: "On powers the endpoint, off does not." }
    send: "\x1bO{output}*{enabled:bool01}POEC"
    expect: { matches: '^PoecO\s*\d+\*' }
    returns: ack

  get_input_endpoint_power:
    summary: "Remote power on an input as <enabled>*<request>*<status> (request 0 none, 1 13 W, 2 26 W; status 0 unpowerable, 1 powered, 2 disabled, 3 no power available, 4 fault)"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
    send: "\x1bI{input}POEC"
    expect: { matches: '^(?:PoecI\s*\d+\*)?([01]\*[0-2]\*[0-4])$' }
    returns: value

  get_output_endpoint_power:
    summary: "Remote power on an output as <enabled>*<request>*<status>"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
    send: "\x1bO{output}POEC"
    expect: { matches: '^(?:PoecO\s*\d+\*)?([01]\*[0-2]\*[0-4])$' }
    returns: value

  get_endpoint_power_budget:
    summary: "The matrix's remote power as <status>*<error> (error 1 power supply fault)"
    send: "\x1bTPOEC"
    expect: { matches: '^(?:PoecT\s*)?(\d+\*[01])$' }
    returns: value

  set_receiver_relay:
    summary: "Open, close or toggle a relay on the receiver on an output"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      relay: { type: int, min: 1, max: 2, required: true, label: Relay, description: "Relay 1 or 2 on the receiver." }
      state: { type: enum, values: [open, closed, toggle], required: true, label: State, description: "open, closed, or toggle." }
    send: "\x1b{output}*{relay}*{state:map.relay_state}RELY"
    expect: { matches: '^Rely\s*\d+\*[12]\*[0-2]$' }
    returns: ack

  pulse_receiver_relay:
    summary: "Close a receiver relay for a time, in 16 ms steps, then open it"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      relay: { type: int, min: 1, max: 2, required: true, label: Relay, description: "Relay 1 or 2 on the receiver." }
      ticks: { type: int, min: 1, max: 65535, required: true, label: Duration, description: "Pulse length in 16 ms steps, 1 to 65535." }
    send: "\x1b{output}*{relay}*3*{ticks}RELY"
    expect: { matches: '^Rely\s*\d+\*[12]\*' }
    returns: ack

  get_receiver_relay:
    summary: "A receiver relay's state (0 open, 1 closed)"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      relay: { type: int, min: 1, max: 2, required: true, label: Relay, description: "Relay 1 or 2 on the receiver." }
    send: "\x1b{output}*{relay}RELY"
    expect: { matches: '^(?:Rely\s*\d+\*[12]\*)?([01])$' }
    returns: value

  set_transmitter_input:
    summary: "Select a multi-input transmitter's input for video, or for video and audio"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      sub_input: { type: int, min: 1, max: 4, required: true, label: Endpoint input, description: "The input on the endpoint, from 1 as on the transmitter or receiver." }
      what: { type: enum, values: [video, all], required: true, label: Switch, description: "video switches the video only, all video and audio." }
    send: "\x1b{input}*{sub_input}*{what:map.etie_type}ETIE"
    expect: { matches: '^Etie\s*\d+\*\d\*\d$' }
    returns: ack

  set_receiver_input:
    summary: "Select a multi-input receiver's input for video, or for video and audio (Rev. Q)"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      sub_input: { type: int, min: 1, max: 4, required: true, label: Endpoint input, description: "The input on the endpoint, from 1 as on the transmitter or receiver." }
      what: { type: enum, values: [video, all], required: true, label: Switch, description: "video switches the video only, all video and audio." }
    send: "\x1bR{output}*{sub_input}*{what:map.etie_type}ETIE"
    expect: { matches: '^EtieR\s*\d+\*\d\*\d$' }
    returns: ack

  get_transmitter_inputs:
    summary: "Every multi-input transmitter's selected inputs, as <video>*<audio> per matrix input"
    send: "\x1bETIE"
    expect: { matches: '^(?:Etie00\*)?(.+)$' }
    returns: value

  set_receiver_video_mute:
    summary: "Mute or unmute the video on the receiver on an output"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      muted: { type: bool, required: true, label: Mute, description: "On mutes the receiver's video, off unmutes it." }
    send: "\x1bR{output}*1*{muted:bool01}B"
    expect: { matches: '^VmtR\s*\d+\*1\*[01]$' }
    returns: ack

  set_receiver_audio_mute:
    summary: "Mute the receiver's audio: 0 none, 1 HDMI/S/PDIF, 2 analog, 3 all"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      mode: { type: int, min: 0, max: 3, required: true, label: Audio mute, description: "0 unmuted, 1 HDMI and S/PDIF, 2 analog, 3 all audio." }
    send: "\x1bR{output}*1*{mode}Z"
    expect: { matches: '^AmtR\s*\d+\*1\*[0-3]$' }
    returns: ack

  set_transmitter_audio_source:
    summary: "Set a transmitter input's audio: 0 auto, 1 digital 2-channel, 2 local 2-channel"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      sub_input: { type: int, min: 1, max: 4, required: true, label: Endpoint input, description: "The input on the endpoint, from 1 as on the transmitter or receiver." }
      source: { type: int, min: 0, max: 2, required: true, label: Audio source, description: "0 auto, 1 the digital input's 2 channels, 2 the local analog 2 channels." }
    send: "\x1bT{input}*{sub_input}*{source}AFMT"
    expect: { matches: '^AfmtT\s*\d+\*\d\*[0-2]$' }
    returns: ack

  set_transmitter_gain:
    summary: "Set a transmitter input's analog audio gain, 0 to 24 dB"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      sub_input: { type: int, min: 1, max: 4, required: true, label: Endpoint input, description: "The input on the endpoint, from 1 as on the transmitter or receiver." }
      gain: { type: int, min: 0, max: 24, required: true, label: Gain, description: "Gain in dB, 0 to 24." }
    send: "\x1bT{input}*{sub_input}*{gain}G"
    expect: { matches: '^AudT\s*\d+\*\d\*[+-]?\d+$' }
    returns: ack

  set_transmitter_attenuation:
    summary: "Set a transmitter input's analog audio attenuation, 1 to 18 dB"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      sub_input: { type: int, min: 1, max: 4, required: true, label: Endpoint input, description: "The input on the endpoint, from 1 as on the transmitter or receiver." }
      attenuation: { type: int, min: 1, max: 18, required: true, label: Attenuation, description: "Attenuation in dB, 1 to 18." }
    send: "\x1bT{input}*{sub_input}*{attenuation}g"
    expect: { matches: '^AudT\s*\d+\*\d\*[+-]?\d+$' }
    returns: ack

  set_receiver_volume:
    summary: "Set the receiver's audio volume on an output, 0 to 64 in 1 dB steps"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      volume: { type: int, min: 0, max: 64, required: true, label: Volume, description: "Volume step, 0 to 64, 64 being 0 dB." }
    send: "\x1bR{output}*1*{volume}V"
    expect: { matches: '^VolR\s*\d+\*1\*\d+$' }
    returns: ack

  set_receiver_hdcp_authorization:
    summary: "Allow or refuse HDCP on a receiver's input"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      sub_input: { type: int, min: 1, max: 4, required: true, label: Endpoint input, description: "The input on the endpoint, from 1 as on the transmitter or receiver." }
      enabled: { type: bool, required: true, label: Enabled, description: "On lets the input accept HDCP, off does not." }
    send: "\x1bRE{output}*{sub_input}*{enabled:bool01}HDCP"
    expect: { matches: '^HdcpRE\s*\d+\*\d\*[01]$' }
    returns: ack

  set_transmitter_hdcp_authorization:
    summary: "Allow or refuse HDCP on a transmitter's input"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      sub_input: { type: int, min: 1, max: 4, required: true, label: Endpoint input, description: "The input on the endpoint, from 1 as on the transmitter or receiver." }
      enabled: { type: bool, required: true, label: Enabled, description: "On lets the input accept HDCP, off does not." }
    send: "\x1bTE{input}*{sub_input}*{enabled:bool01}HDCP"
    expect: { matches: '^HdcpTE\s*\d+\*\d\*[01]$' }
    returns: ack

  set_receiver_freeze:
    summary: "Freeze or unfreeze the receiver's picture on an output"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      frozen: { type: bool, required: true, label: Freeze, description: "On freezes the picture, off releases it." }
    send: "\x1bR{output}*1*{frozen:bool01}F"
    expect: { matches: '^FrzR\s*\d+\*1\*[01]$' }
    returns: ack

  set_output_freeze:
    summary: "Freeze or unfreeze an output board's picture"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      frozen: { type: bool, required: true, label: Freeze, description: "On freezes the picture, off releases it." }
    send: "\x1bO{output}*{frozen:bool01}F"
    expect: { matches: '^FrzO\s*\d+\*[01]$' }
    returns: ack

  transmitter_image_reset:
    summary: "Run the image reset (auto-adjust) on a transmitter's input once"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      sub_input: { type: int, min: 1, max: 4, required: true, label: Endpoint input, description: "The input on the endpoint, from 1 as on the transmitter or receiver." }
    send: "\x1bT{input}*{sub_input}*2AADJ"
    expect: { matches: '^AadjT\s*\d+\*\d\*' }
    returns: ack

  receiver_image_reset:
    summary: "Run the image reset (auto-adjust) on the receiver on an output once"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
    send: "\x1bR{output}*1*2AADJ"
    expect: { matches: '^AadjR\s*\d+\*' }
    returns: ack

  set_transmitter_front_panel_lock:
    summary: "Front panel lockout on the transmitter on an input (0 off; 1 and 2 as the endpoint defines)"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      mode: { type: int, min: 0, max: 2, required: true, label: Lockout, description: "0 unlocked, 1 or 2 locked modes as the endpoint defines them." }
    send: "\x1bT{input}*{mode}X"
    expect: { matches: '^ExeT\s*\d+\*[0-2]$' }
    returns: ack

  set_receiver_front_panel_lock:
    summary: "Front panel lockout on the receiver on an output"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      mode: { type: int, min: 0, max: 2, required: true, label: Lockout, description: "0 unlocked, 1 or 2 locked modes as the endpoint defines them." }
    send: "\x1bR{output}*{mode}X"
    expect: { matches: '^ExeR\s*\d+\*[0-2]$' }
    returns: ack

  reset_transmitter:
    summary: "Reset the transmitter on an input to its factory settings"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
    send: "\x1bT{input}ZXXX"
    expect: { matches: '^ZpxT\s*\d+$' }
    returns: ack

  reset_receiver:
    summary: "Reset the receiver on an output to its factory settings"
    params:
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
    send: "\x1bR{output}ZXXX"
    expect: { matches: '^ZpxR\s*\d+$' }
    returns: ack

  set_input_audio_source:
    summary: "Set an input board's audio: 0 auto, 1 digital, 2 local analog"
    params:
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      source: { type: int, min: 0, max: 2, required: true, label: Audio source, description: "0 auto, 1 the digital input's audio, 2 the local analog audio." }
    send: "\x1bI{input}*{source}AFMT"
    expect: { matches: '^AfmtI\s*\d+\*[0-2]$' }
    returns: ack

  set_dhcp:
    summary: "Turn DHCP on or off; the session may drop (SMX: off resets the address to 192.168.254.254)"
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "On takes the address from DHCP, off does not." }
    send: "\x1b{enabled:bool01}DH"
    expect: { matches: '^Idh[01]$' }
    returns: ack

  get_dhcp:
    summary: "Whether DHCP is on (1) or off (0)"
    send: "\x1bDH"
    expect: { matches: '^(?:Idh)?([01])$' }
    returns: value

  set_ip_address:
    summary: "Set the IP address; the session may drop"
    params:
      address: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: IP address, description: "IPv4 address, such as 192.168.254.254." }
    send: "\x1b{address}CI"
    expect: { matches: '^Ipi\s*' }
    returns: ack

  get_ip_address:
    summary: "The IP address"
    send: "\x1bCI"
    expect: { matches: '^(?:Ipi\s*)?(\d{1,3}(?:\.\d{1,3}){3})$' }
    returns: value

  set_subnet_mask:
    summary: "Set the subnet mask; the session may drop"
    params:
      netmask: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: Subnet mask, description: "IPv4 subnet mask, such as 255.255.0.0." }
    send: "\x1b{netmask}CS"
    expect: { matches: '^Ips\s*' }
    returns: ack

  get_subnet_mask:
    summary: "The subnet mask"
    send: "\x1bCS"
    expect: { matches: '^(?:Ips\s*)?(\d{1,3}(?:\.\d{1,3}){3})$' }
    returns: value

  set_gateway:
    summary: "Set the gateway address; the session may drop"
    params:
      gateway: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true, label: Gateway, description: "IPv4 gateway address, such as 0.0.0.0." }
    send: "\x1b{gateway}CG"
    expect: { matches: '^Ipg\s*' }
    returns: ack

  get_gateway:
    summary: "The gateway address"
    send: "\x1bCG"
    expect: { matches: '^(?:Ipg\s*)?(\d{1,3}(?:\.\d{1,3}){3})$' }
    returns: value

  get_mac_address:
    summary: "The MAC address (00-05-A6-xx-xx-xx)"
    send: "\x1bCH"
    expect: { matches: '^(?:Iph\s*)?([0-9A-Fa-f]{2}(?:-[0-9A-Fa-f]{2}){5})$' }
    returns: value

  get_connection_count:
    summary: "The number of open IP connections"
    send: "\x1bCC"
    expect: { matches: '^(?:Icc\s*)?(\d+)$' }
    returns: value

  set_unit_name:
    summary: "Set the unit (host) name; a single space restores the default"
    params:
      name: { type: string, max_length: 63, pattern: '^([A-Za-z]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?| )$', required: true, label: Name, description: "Letters, digits and hyphens, starting with a letter and not ending with a hyphen; up to 24 characters (63 on the DXP HD 4K PLUS); a single space restores the default." }
    send: "\x1b{name}CN"
    expect: { matches: '^Ipn\s*' }
    returns: ack

  get_unit_name:
    summary: "The unit (host) name"
    send: "\x1bCN"
    expect: { matches: '^(?:Ipn\s*)?(\S+)$' }
    returns: value

  set_date_time:
    summary: "Set the date and time, MM/DD/YY HH:MM:SS"
    params:
      date_time: { type: string, pattern: '^\d\d/\d\d/\d\d \d\d:\d\d:\d\d$', required: true, label: Date and time, description: "Date and 24-hour time as MM/DD/YY HH:MM:SS, such as 10/14/26 09:30:00." }
    send: "\x1b{date_time}CT"
    expect: { matches: '^Ipt' }
    returns: ack

  get_date_time:
    summary: "The date and time as the unit gives it"
    send: "\x1bCT"
    expect: { matches: '^Ipt\s*(.+)$' }
    returns: value

  set_gmt_offset:
    summary: "Set the offset from GMT, as hours.minutes with a sign, such as -5.00 or 8.30"
    params:
      offset: { type: string, pattern: '^[+-]?(1[0-4]|0?[0-9])\.[0-5]?[0-9]$', required: true, label: GMT offset, description: "Hours and minutes from GMT as [+|-]h.mm, from -12.00 to +14.00." }
    send: "\x1b{offset}CZ"
    expect: { matches: '^Ipz' }
    returns: ack

  get_gmt_offset:
    summary: "The offset from GMT, -12:00 to +14:00"
    send: "\x1bCZ"
    expect: { matches: '^(?:Ipz\s*)?([+-]\d\d:\d\d)$' }
    returns: value

  set_daylight_saving:
    summary: "Set daylight saving: 0 off, 1 northern hemisphere, 2 Europe, 3 Brazil"
    params:
      mode: { type: int, min: 0, max: 3, required: true, label: Daylight saving, description: "0 off, 1 northern hemisphere (USA), 2 Europe, 3 Brazil." }
    send: "\x1b{mode}CX"
    expect: { matches: '^Ipx[0-3]$' }
    returns: ack

  set_serial_port:
    summary: "Set a serial port's baud rate, parity, data bits and stop bits"
    params:
      port: { type: int, min: 1, max: 130, required: true, label: Port, description: "Serial port: 1 the rear Remote port; on XTP II 3 to 130 the XTP boards' ports (endpoint serial)." }
      baud: { type: enum, values: ['9600', '19200', '38400', '115200'], required: true, label: Baud rate, description: "Baud rate." }
      parity: { type: enum, values: [N, O, E, M, S], required: true, label: Parity, description: "O odd, E even, N none, M mark, S space." }
      data_bits: { type: enum, values: ['8', '7'], required: true, label: Data bits, description: "7 or 8 data bits." }
      stop_bits: { type: enum, values: ['1', '2'], required: true, label: Stop bits, description: "1 or 2 stop bits." }
    send: "\x1b{port}*{baud},{parity},{data_bits},{stop_bits}CP"
    expect: { matches: '^Cpn\s*\d+\s*Ccp' }
    returns: ack

  get_serial_port:
    summary: "A serial port's settings as <baud>,<parity>,<data>,<stop>"
    params:
      port: { type: int, min: 1, max: 130, required: true, label: Port, description: "Serial port number, as for set_serial_port." }
    send: "\x1b{port}CP"
    expect: { matches: '^(?:Cpn\s*\d+\s*Ccp)?(\d+,[NOEMS],[78],[12])$' }
    returns: value

  set_serial_port_type:
    summary: "Set a serial port to RS-232 (0) or RS-422 (1)"
    params:
      port: { type: int, min: 1, max: 130, required: true, label: Port, description: "Serial port number." }
      type: { type: int, min: 0, max: 1, required: true, label: Type, description: "0 RS-232, 1 RS-422." }
    send: "\x1b{port}*{type}CY"
    expect: { matches: '^Cpn\s*\d+\s*Cty' }
    returns: ack

  set_port_timeout:
    summary: "Set the IP connection timeout, in 10-second steps (default 30), for this connection or globally"
    params:
      scope: { type: enum, values: [this, global], required: true, label: Scope, description: "this sets it for this connection, global for every new connection." }
      steps: { type: int, min: 1, max: 65000, required: true, label: Timeout, description: "Timeout in 10-second steps, 1 to 65000." }
    send: "\x1b{scope:map.timeout_scope}*{steps}TC"
    expect: { matches: '^Pti[01]\*\d+$' }
    returns: ack

  restart_network:
    summary: "Restart the network interface, as needed after IP or DHCP changes; the session drops"
    send: "\x1b2BOOT"
    expect: { matches: '^Boot2$' }
    returns: ack

  set_admin_password:
    summary: "Set the administrator password; a single space clears it (and on SMX the user password too)"
    params:
      password: { type: string, max_length: 128, pattern: '^[^|]+$', required: true, label: Password, description: "Up to 12 characters (128 on the DXP HD 4K PLUS), without |; a single space clears it." }
    send: "\x1b{password}CA"
    expect: { matches: '^Ipa' }
    returns: ack

  set_user_password:
    summary: "Set the user password; a single space clears it"
    params:
      password: { type: string, max_length: 128, pattern: '^[^|]+$', required: true, label: Password, description: "Up to 12 characters (128 on the DXP HD 4K PLUS), without |; a single space clears it." }
    send: "\x1b{password}CU"
    expect: { matches: '^Ipu' }
    returns: ack

  smx_define_virtual_plane:
    summary: "Define a virtual plane (90-99) as a list of planes switched together"
    params:
      plane: { type: int, min: 90, max: 99, required: true, label: Virtual plane, description: "Virtual plane number, 90 to 99." }
      planes: { type: string, pattern: '^(0?[0-9]|1[0-5])(\*(0?[0-9]|1[0-5])){0,15}$', required: true, label: Planes, description: "Planes 00 to 15 joined by *, such as 01*02*05." }
    send: "\x1b{plane},{planes}MP"
    expect: { matches: '^Mpv\s*\d+,' }
    returns: ack

  smx_get_virtual_plane:
    summary: "The planes in a virtual plane, comma-separated"
    params:
      plane: { type: int, min: 90, max: 99, required: true, label: Virtual plane, description: "Virtual plane number, 90 to 99." }
    send: "\x1b{plane}MP"
    expect: { matches: '^(?:Mpv\s*\d+,)?([\d,]+)$' }
    returns: value

  smx_get_slot_planes:
    summary: "The plane each slot's board is on, space-separated, -- for an empty slot"
    send: "\x1bSTAT"
    expect: { matches: '^(?:Stat\s*)?((?:\d\d|--)(?:\s+(?:\d\d|--))*)$' }
    returns: value

  smx_set_input_name:
    summary: "Name an input on a plane (up to 12 characters; a space restores the default)"
    params:
      plane: { type: int, min: 0, max: 99, required: true, label: Plane, description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes." }
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      name: { type: string, max_length: 12, pattern: '^[^|]+$', required: true, label: Name, description: "Up to 12 characters without |; a single space restores the default." }
    send: "\x1b{plane}*{input},{name}NI"
    expect: { matches: '^\d+\s*Nmi\s*\d+,' }
    returns: ack

  smx_set_output_name:
    summary: "Name an output on a plane (up to 12 characters; a space restores the default)"
    params:
      plane: { type: int, min: 0, max: 99, required: true, label: Plane, description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes." }
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      name: { type: string, max_length: 12, pattern: '^[^|]+$', required: true, label: Name, description: "Up to 12 characters without |; a single space restores the default." }
    send: "\x1b{plane}*{output},{name}NO"
    expect: { matches: '^\d+\s*Nmo\s*\d+,' }
    returns: ack

  smx_set_plane_preset_name:
    summary: "Name a plane preset (up to 12 characters)"
    params:
      plane: { type: int, min: 0, max: 99, required: true, label: Plane, description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes." }
      preset: { type: int, min: 1, max: 10, required: true, label: Plane preset, description: "Plane preset number, 1 to 10." }
      name: { type: string, max_length: 12, pattern: '^[^|]+$', required: true, label: Name, description: "Up to 12 characters without |; a single space restores the default." }
    send: "\x1b{plane}*{preset},{name}NG"
    expect: { matches: '^\d+\s*Nmg\s*\d+,' }
    returns: ack

  smx_set_input_gain:
    summary: "Set an input's audio gain on a plane, 0 to 24 dB"
    params:
      plane: { type: int, min: 0, max: 99, required: true, label: Plane, description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes." }
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      gain: { type: int, min: 0, max: 24, required: true, label: Gain, description: "Gain in dB, 0 to 24." }
    send: "{plane:02d}*{input}*{gain}G"
    expect: { matches: '^\d+\s*In\s*\d+\s+Aud' }
    returns: ack

  smx_set_input_attenuation:
    summary: "Set an input's audio attenuation on a plane, 1 to 18 dB"
    params:
      plane: { type: int, min: 0, max: 99, required: true, label: Plane, description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes." }
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      attenuation: { type: int, min: 1, max: 18, required: true, label: Attenuation, description: "Attenuation in dB, 1 to 18." }
    send: "{plane:02d}*{input}*{attenuation}g"
    expect: { matches: '^\d+\s*In\s*\d+\s+Aud' }
    returns: ack

  smx_set_output_volume:
    summary: "Set an output's volume on a plane, 0 to 64 (64 is 0 dB)"
    params:
      plane: { type: int, min: 0, max: 99, required: true, label: Plane, description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes." }
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      volume: { type: int, min: 0, max: 64, required: true, label: Volume, description: "Volume step, 0 to 64, 64 being 0 dB." }
    send: "{plane:02d}*{output}*{volume}V"
    expect: { matches: '^\d+\s*Out\s*\d+\s+Vol' }
    returns: ack

  smx_set_rgb_delay:
    summary: "Set an output's RGB switching delay on a plane, in 0.5 s steps (VGA and RGBHV boards)"
    params:
      plane: { type: int, min: 0, max: 99, required: true, label: Plane, description: "The SMX plane as numbered on the frame: 0 to 15 for the switching boards and 90 to 99 for virtual planes." }
      output: { type: int, min: 1, max: 128, required: true, label: Output, description: "The output number, from 1 as on the switcher." }
      steps: { type: int, min: 0, max: 10, required: true, label: Delay, description: "Delay in 0.5-second steps, 0 to 10." }
    send: "\x1b{plane:02d}*{output}*{steps}D"
    expect: { matches: '^\d+\s*Out\s*\d+\s+Dly' }
    returns: ack

  smx_set_input_hdcp_authorization:
    summary: "Allow or refuse HDCP on an input of a slot's board"
    params:
      slot: { type: int, min: 1, max: 10, required: true, label: Slot, description: "The SMX frame slot, 1 to 10 by frame size." }
      input: { type: int, min: 1, max: 128, required: true, label: Input, description: "The input number, from 1 as on the switcher." }
      enabled: { type: bool, required: true, label: Enabled, description: "On lets the input accept HDCP, off does not." }
    send: "\x1bE{slot}*{input}*{enabled:bool01}HDCP"
    expect: { matches: '^\d+\s*HdcpE\s*\d+\*[01]$' }
    returns: ack

  smx_get_slot_signal:
    summary: "Signal presence on every input of a slot's board (0 none, 1 H, 2 V, 3 H and V)"
    params:
      slot: { type: int, min: 1, max: 10, required: true, label: Slot, description: "The SMX frame slot, 1 to 10 by frame size." }
    send: "{slot}*0LS"
    expect: { matches: '^(?:\d+\s*FRQ00\*)?([0-3](?:\s+[0-3])*)$' }
    returns: value

quirks:
  - models: [all]
    severity: critical
    text: >
      recall_global_preset, recall_global_preset_prst, recall_room_preset,
      smx_recall_plane_preset, tie_input_to_all, tie_video_to_all,
      tie_audio_to_all and quick_tie change many outputs at once and cannot be
      undone except by recalling or re-making the previous ties. Recalling a
      preset that was never saved answers E11 and changes nothing.

  - models: [all]
    severity: warning
    text: >
      Extron SIS errors are E-codes on their own line: E01 invalid input, E10
      invalid command, E11 invalid preset, E12 invalid output, E13 invalid
      value, E14 not valid for this configuration, E17 invalid for the signal
      type (DXP) or timeout (XTP II, SMX), E18 timeout, E21 invalid room, E22
      busy, E24 privilege violation (a user-level login), E25 device not
      present, E26 too many connections, E27 invalid event, E28 bad file name
      (DXP HD 4K PLUS p.37, XTP II p.50, SMX p.37). Every command's reply is
      matched against its documented success text, so an E-code fails it as
      a device error carrying the E-code line; the format's numeric `codes`
      table reads three-digit codes only, so the meanings are listed here.

  - models: [all]
    severity: warning
    text: >
      A Telnet connection is closed after 5 minutes without traffic (port
      timeout 30 x 10 s, DXP HD 4K PLUS p.37 and p.54, XTP II p.46, SMX p.35),
      and Extron recommends periodic queries to keep it open. The engine's
      liveness probe sends Q (firmware version) after 10 seconds of silence,
      whether or not telemetry runs, which keeps the session open; the state
      poll repeats every 2 minutes.

  - models: [all]
    severity: warning
    text: >
      In verbose mode 3 (set on connecting) a change made from the front panel,
      another Telnet session or the serial port is reported with the same text
      as the reply to the command that would make it ("Out04 In03 All", "Vmt2*1",
      "Rpr05"). Those reports keep state current, but they cannot be told apart
      from replies: one arriving while a command waits is taken as that
      command's reply, failing it if it does not match and leaving the real
      reply for the next command or the probe. Each command's reply pattern is
      as specific as the documented text allows, and the stream recovers at
      the next timeout. Qik (front panel tie) is also a quick tie's reply.
      The banner, Password:, Login ..., Reconfig and HplgO lines are never
      taken as replies.

  - models: [all]
    severity: warning
    text: >
      Simple SIS commands need no terminator and Esc commands end with CR or
      | (DXP HD 4K PLUS p.35 and p.39). Every command is sent followed by CR,
      which terminates Esc commands as documented; that a CR after a simple
      command (1*2!) is ignored is assumed from Telnet use, which the guides
      describe, and from Companion's modules, which send a line ending after
      every command.

  - models: [all]
    severity: warning
    text: >
      Password login: the password is sent after "Password:" arrives (none is
      awaited while the setting is empty). A wrong password is answered by the
      prompt again; the next step's text completes that line, which marks the
      device unauthorized and stops sending. A unit with a password whose
      setting is empty takes every command as a password attempt and answers
      only "Password:"; a unit without a password but with the setting filled
      in never prompts, and the connection is dropped and retried after the
      timeout. A user-level login gets E24 for administrator commands. Port 23
      is a Telnet server; the engine does not negotiate Telnet options, and
      any option bytes the unit sends before the banner are ignored.

  - models: [all]
    severity: info
    text: >
      State: ties, mutes, volumes, levels, names, presets recalled or saved,
      HDCP and front panel lockout come from the verbose-mode reports and from
      the replies to every command and poll. The poll (on connecting and every
      2 minutes) reads the part number, matrix size, the current ties of
      outputs 1-16 (Esc 0*1*1VC and Esc 0*1*2VC, DXP), every output's mute
      status (Esc VM), every input's signal (0LS) and the front panel lockout;
      a model answers the queries it lacks with E10, which is ignored. Input
      and output names are learnt from get_*_name replies and change reports,
      not polled. tie_input_to_all and its variants report "In3 All", which
      names no output, so their effect reaches state at the next poll (DXP) or
      per-output query. XTP II documents no query of all ties, so its ties
      reach state only from reports and get_*_tie replies.

  - models: [dxp-hd-4k-plus]
    severity: info
    text: >
      Input attenuation is written "X!*-X1%G" with X1% given as -20 to 00
      (p.47); set_input_attenuation_db sends the level with its sign
      (1*-10G), which reads the same either way except at 0 dB (1*0G).

  - models: [xtp-ii-crosspoint]
    severity: info
    text: >
      Global presets are saved from the front panel only (PrstS report); SIS
      recalls them with Esc R..PRST. XTP II also reports executive mode as
      Exec (Esc ..EXEC) where the DXP and SMX use n X / Exe.

  - models: [smx]
    severity: info
    text: >
      Planes are sent as two digits (01*3*4!), as in the guide's quick-tie
      example; replies and reports start with the plane number ("01 Out04
      In03 All", "01 Vmt4*1"). State for SMX is kept per plane under planes.
      Virtual planes 90-99 are defined on the unit, not here.

  - models: [all]
    severity: critical
    text: >
      set_ip_address, set_subnet_mask, set_gateway, set_dhcp and
      set_admin_password can end the Telnet session at once (DXP DVI p.79),
      and restart_network always does; the unit may come back at another
      address. A new administrator or user password must be given to the
      core (update_settings) before it reconnects, or the login is refused.
      reset_transmitter and reset_receiver return an XTP endpoint to its
      factory settings, and disabling an endpoint's remote power turns it off.
      EDID changes make the source re-read the EDID, which can blank its
      output briefly.

  - models: [all]
    severity: info
    text: >
      API limits: XTP II documents no EDID command over SIS (the XTP System
      Configuration Software manages it), and the DXP HD 4K PLUS none to
      assign an EDID to an input (PCS only); EDID names exist on no family.
      DXP DVI/HDMI and SMX import and export EDIDs as 256 raw bytes after the
      command, which a text template cannot carry (format limit), so only the
      DXP HD 4K PLUS's file form is offered. No family documents a pass-through
      of arbitrary SIS to an XTP endpoint, nor its part number or firmware, nor
      output scaling or resolution. The DXP HD 4K PLUS lists the GMT offset
      as read-only. The XTP II serial insertion mode (LRPT) has two values the
      guide does not name. The SMX guide prints the serial port command as
      Esc *port,...CP, which looks like a misprint of the other families'
      form, so set_serial_port is not offered for SMX.

  - models: [all]
    severity: info
    text: >
      Documentation limits taken as written: the DXP HD 4K PLUS has 16 global
      presets (p.40, p.48) where the commands allow 32, and its guide covers
      the DXP 44, 84 and 88 only; DXP DVI names are 12 characters (room names
      11), SMX names 12, where the name commands allow 16; a longer name is
      refused or cut by the unit. DXP DVI answers 0LS with 0 or 3 per input
      (p.62), taken as no signal and signal. Status temperatures are in
      Celsius on the DXP HD 4K PLUS and Fahrenheit on the others. The SMX
      reads signal per slot (slot*0LS); the plain 0LS in the poll is answered
      E10 there. The poll (every 2 minutes) also reads the network settings,
      EDID assignments (inputs 1-16), input HDCP authorization, the DXP HD 4K
      PLUS output HDCP mode and format (outputs 1-8), XTP II transmitter
      inputs, SMX slot planes and virtual planes 90-99; a model answers the
      queries it lacks with E10 or E14, which are ignored. XTP II endpoint
      signal and HDCP status (LsT, HdcpT) and remote power changes (Poec) are
      pushed by the matrix.

state:
  device.model:            { type: string, description: "Model name from the copyright banner sent on connecting" }
  device.firmware:         { type: string, description: "Firmware version from the banner or the Q reply" }
  device.part_number:      { type: string, description: "Extron part number (60-nnnn-nn)" }
  device.login:            { type: string, description: "Administrator or User, from the Login reply to the password" }
  device.verbose_mode:     { type: int, description: "Verbose mode of this connection (3 after connecting)" }
  device.video_inputs:     { type: int, description: "Video matrix inputs, from I" }
  device.video_outputs:    { type: int, description: "Video matrix outputs, from I" }
  device.audio_inputs:     { type: int, description: "Audio matrix inputs, from I" }
  device.audio_outputs:    { type: int, description: "Audio matrix outputs, from I" }
  outputs.*.video_input:   { type: int, description: "Input tied to the output's video, 0 when untied" }
  outputs.*.audio_input:   { type: int, description: "Input tied to the output's audio, 0 when untied" }
  outputs.*.video_mute:    { type: bool, description: "The output's video is muted" }
  outputs.*.video_mute_mode: { type: int, description: "0 unmuted, 1 video muted, 2 video and sync muted (DXP HD 4K PLUS)" }
  outputs.*.audio_mute:    { type: bool, description: "Some or all of the output's audio is muted" }
  outputs.*.audio_mute_mode: { type: int, description: "Audio mute by output type; see set_audio_mute_mode" }
  outputs.*.volume:        { type: int, description: "Output volume: percent on DXP HD 4K PLUS, 0-64 dB steps on XTP II" }
  outputs.*.name:          { type: string, description: "Output name" }
  outputs.*.hdcp_status:   { type: int, description: "0 no sink, 1 sink without HDCP, 2 HDCP sink not encrypted, 3 encrypted" }
  inputs.*.name:           { type: string, description: "Input name" }
  inputs.*.signal:         { type: bool, description: "A signal is present on the input" }
  inputs.*.audio_level:    { type: int, unit: dB, description: "Input gain (positive) or attenuation (negative)" }
  inputs.*.hdcp_status:    { type: int, description: "0 no source, 1 HDCP source, 2 source without HDCP" }
  presets.last_recalled:   { type: int, description: "Global preset last recalled" }
  presets.last_saved:      { type: int, description: "Global preset last saved" }
  presets.*.name:          { type: string, description: "Global preset name" }
  rooms.*.name:            { type: string, description: "Room name" }
  rooms.*.last_recalled:   { type: int, description: "Room preset last recalled in the room" }
  rooms.*.last_saved:      { type: int, description: "Room preset last saved in the room" }
  front_panel_lock:        { type: int, description: "Front panel lockout (executive) mode: 0 unlocked; 1 and 2 as the model defines" }
  power_save:              { type: int, description: "Power save mode, 0 normal" }
  planes.*.outputs.*.video_input: { type: int, description: "SMX: input tied to the output's video on the plane" }
  planes.*.outputs.*.audio_input: { type: int, description: "SMX: input tied to the output's audio on the plane" }
  planes.*.outputs.*.video_mute:  { type: bool, description: "SMX: the output's video is muted" }
  planes.*.outputs.*.audio_mute:  { type: bool, description: "SMX: the output's audio is muted" }
  planes.*.last_recalled:  { type: int, description: "SMX: plane preset last recalled on the plane" }
  planes.*.last_saved:     { type: int, description: "SMX: plane preset last saved on the plane" }

  inputs.*.edid:           { type: int, description: "DXP DVI: EDID number assigned to the input (1-8 sink, 9-36 factory, 37-40 user)" }
  inputs.*.hdcp_authorized: { type: bool, description: "The input accepts HDCP (Esc E..HDCP)" }
  inputs.*.audio_source:   { type: int, description: "XTP II input board audio: 0 auto, 1 digital, 2 local analog" }
  inputs.*.endpoint_power_enabled: { type: bool, description: "XTP II: remote power to the transmitter on the input is enabled" }
