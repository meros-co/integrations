state:
  device.revision: { type: int, description: "Pandoras Box's revision number (GetHostRevisionNumber)" }
  device.selected_devices: { type: int, description: "How many devices are selected" }
  sites.*.connected: { type: bool, description: "The site's node is connected, keyed by site ID" }
  sequences.*.transport: { type: string, description: "play, stop or pause, keyed by sequence ID" }
  sequences.*.timecode: { type: string, description: "The sequence's time as hh:mm:ss:ff" }
  sequences.*.previous_cue.id: { type: int, description: "The cue before the playhead, its ID" }
  sequences.*.previous_cue.name: { type: string, description: "The cue before the playhead, its name" }
  sequences.*.previous_cue.timecode: { type: string, description: "The cue before the playhead, its time as hh:mm:ss:ff" }
  sequences.*.previous_cue.mode: { type: int, description: "The cue before the playhead, its mode as Pandoras Box numbers it" }
  sequences.*.next_cue.id: { type: int, description: "The next cue, its ID" }
  sequences.*.next_cue.name: { type: string, description: "The next cue, its name" }
  sequences.*.next_cue.timecode: { type: string, description: "The next cue, its time as hh:mm:ss:ff" }
  sequences.*.next_cue.mode: { type: int, description: "The next cue, its mode as Pandoras Box numbers it" }

quirks:
  - models: [all]
    severity: info
    text: >
      Functions that return values are answered, and fail on a negative code with Pandoras Box's error
      number. The others are not answered, as the vendor's SDKs treat them: they are reported unverified,
      and their effect is read back where state covers it (a sequence's transport and time after a command
      on that sequence).
  - models: [all]
    severity: warning
    text: >
      Doubles (parameter values, angles, the ASIO volume) are sent and read little-endian, as every vendor
      SDK does, although the protocol page says all values are in network byte order. Narrow strings must be
      ASCII; wide strings are sent as UCS-2.
  - models: [all]
    severity: info
    text: >
      Only the Pandoras Box master answers on TCP 6211, for the domain it is set to. Pandoras Box pushes
      nothing: the sequences named in the sequences setting are read every poll_ms (transport, time and,
      where supported, the cues around the playhead), and the sites every 10 seconds. Opened for commands
      only, the revision number is read every 10 seconds as the liveness check.
  - models: [all]
    severity: critical
    text: >
      load_project, close_project, reset_all, remove_* and the set_sequence_transport_mode,
      move_sequence_to_* and set_param_* commands change the show at once and cannot be undone remotely.
