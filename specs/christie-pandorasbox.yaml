spec: 1
id: christie-pandorasbox
name: Christie Pandoras Box (Pandoras Box Automation, TCP)
vendor: Christie
category: playback
implementation: native
reason: >
  Pandoras Box Automation is binary: each message is a 17-byte header (PBAU, version, domain, the message's
  length, a connection ID, the protocol and a checksum of the header) followed by a 16-bit function code and its
  arguments in typed binary form (integers, doubles, length-prefixed ASCII and UCS-2 strings, buffers). Functions
  that return values are answered with their code and the values, or a negative code and an error number; the
  others are not answered.

source:
  - title: "Pandoras Box Automation protocol (pbauto-generator, source/docs/protocol.md)"
    author: coolux GmbH, a Christie company
    url: "https://github.com/PandorasBoxSDK/pbauto-generator/blob/master/source/docs/protocol.md"
    note: >
      Manufacturer documentation (MIT), read 2026-10-27. Data types (bool 8-bit 1/0, byte, short, int and
      int64 big-endian, IEEE 754 double, narrow string with a short count and ASCII, wide string with a short
      count and UCS-2, byte and int buffers with an int length); the 17-byte header: PBAU, version 1, domain
      (int, 0 by default), message length (short, without the header), connection ID (int, 0 over TCP),
      protocol (byte, 0 for TCP), checksum (the sum of the header bytes after PBAU, modulo 255); then the
      command code (short), answered with the same code, a negative code meaning failure; TCP port 6211 on
      the Pandoras Box master; the UDP handshake on 6212 and HTTP's PBAUTO method, not used here.
  - title: "Pandoras Box Automation command database (pbauto-generator, db.json, revision 12086)"
    author: coolux GmbH, a Christie company
    url: "https://github.com/PandorasBoxSDK/pbauto-generator/blob/master/db.json"
    note: >
      Manufacturer data (MIT), read 2026-10-27: every function's code, the types of the arguments it sends
      and of the values it receives, and the enumerations (parameter kinds, transport modes play 1 / stop 2
      / pause 3, SMPTE modes, stop actions, selection modes, watch folder properties, CLX hardware,
      consistency). The commands below are generated from it by tools/generate_pandorasbox.py; their labels
      and descriptions are written here.
  - title: "Pandoras Box SDK generator templates (pbauto-generator, source/python, source/csharp, source/_common)"
    author: coolux GmbH, a Christie company
    url: "https://github.com/PandorasBoxSDK/pbauto-generator"
    note: >
      Read 2026-10-27 as corroboration (MIT, no code copied): the SDKs wait for an answer only for functions
      that receive values, read a negative code's error number as an int, and write doubles in the host's
      byte order (little-endian), not network order as the protocol page says.
  - title: "pbauto-python and companion-module-twoloox-pandorasbox (MIT)"
    url: "https://github.com/PandorasBoxSDK/companion-module-twoloox-pandorasbox"
    note: "Read 2026-10-27 as corroboration: the same header, port 6211 and functions."

settings:
  domain: { type: int, min: 0, max: 2147483647, default: 0, label: Domain,
            description: "The Pandoras Box domain the master and its clients are set to; 0 unless changed." }
  sequences: { type: string, pattern: '^[0-9]+(,[0-9]+)*$', max_length: 256, default: "1", label: Sequences,
               description: "The sequence IDs whose transport, time and cues are kept current, separated by commas." }
  poll_ms: { type: int, min: 100, max: 60000, default: 500, label: Read interval,
             description: "Milliseconds between reads of the sequences' transport and time; sites are read every 10 seconds." }

ports:
  - { port: 6211, protocol: tcp, role: control, note: "Pandoras Box Automation over TCP, on the master" }

