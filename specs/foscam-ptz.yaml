    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=ptzStartCruise&mapName={name}&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  stop_cruise:
    summary: "Stop the cruise"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=ptzStopCruise&usr={settings.username:url}&pwd={settings.password:url}" }
