    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getPTZPrePointForSelfTest&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_self_test_preset:
    summary: "Set the preset the head goes to after its power-up self-test"
    params:
      name: { type: string, max_length: 32, pattern: "^[A-Za-z0-9_-]+$", required: true, label: Preset, description: "Preset point name." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setPTZPrePointForSelfTest&name={name}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getPTZPrePointForSelfTest&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_rs485:
    summary: "Read the RS-485 port settings"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=get485Info&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_rs485:
    summary: "Set the RS-485 port's protocol, address and line settings"
    params:
      protocol: { type: int, min: 0, max: 255, required: true, label: Protocol, description: "Protocol number as the camera lists its RS-485 protocols." }
      address: { type: int, min: 0, max: 255, required: true, label: Address, description: "Address of the device on the RS-485 bus." }
      baud: { type: enum, values: ["1200", "2400", "4800", "9600", "19200", "38400", "57600", "115200"], required: true, label: Baud rate, description: "Line speed in bits per second." }
      data_bits: { type: int, min: 5, max: 8, required: true, label: Data bits, description: "Data bits, 5 to 8." }
      stop_bits: { type: int, min: 1, max: 2, required: true, label: Stop bits, description: "Stop bits, 1 or 2." }
      parity: { type: int, min: 0, max: 4, required: true, label: Parity, description: "Parity number as the camera lists it (0 none)." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=set485Info&rs485Protocol={protocol}&rs485Addr={address}&rs485Baud={baud}&rs485DataBit={data_bits}&rs485StopBit={stop_bits}&rs485Check={parity}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=get485Info&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack

  # ── Device ─────────────────────────────────────────────────────────────
  get_device_state:
    summary: "Read alarms, recording, SD card, NTP, DDNS, UPnP, Wi-Fi and IR LED state"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getDevState&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  get_device_info:
    summary: "Read the model, serial number, name, MAC, firmware and hardware version"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getDevInfo&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  get_device_name:
    summary: "Read the camera name"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getDevName&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_device_name:
    summary: "Set the camera name"
    params:
      name: { type: string, max_length: 20, required: true, label: Camera name, description: "Name the camera shows." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setDevName&devName={name:url}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getDevName&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  ir_led_on:
    summary: "Turn the infrared LEDs on (manual IR mode)"
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=openInfraLed&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getDevState&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  ir_led_off:
    summary: "Turn the infrared LEDs off (manual IR mode)"
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=closeInfraLed&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getDevState&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_ir_led_mode:
    summary: "Read whether the infrared LEDs switch automatically"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getInfraLedConfig&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_ir_led_mode:
    summary: "Switch the infrared LEDs automatically or by command"
    params:
      mode: { type: enum, values: ["auto", "manual"], required: true, label: IR LED mode, description: "auto switches with the light; manual leaves them to ir_led_on and ir_led_off." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setInfraLedConfig&mode={mode:map.ir_mode}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getInfraLedConfig&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_system_time:
    summary: "Read the date, time, time zone and NTP settings"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getSystemTime&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_time_from_ntp:
    summary: "Take the time from an NTP server"
    params:
      server: { type: enum, values: ["time.nist.gov", "time.kriss.re.kr", "time.windows.com", "time.nuri.net"], required: true, label: NTP server, description: "One of the NTP servers the camera supports." }
      date_format: { type: enum, values: ["YYYY-MM-DD", "DD/MM/YYYY", "MM/DD/YYYY"], required: true, label: Date format, description: "Date shown as YYYY-MM-DD, DD/MM/YYYY or MM/DD/YYYY." }
      time_format: { type: enum, values: ["12", "24"], required: true, label: Time format, description: "12-hour or 24-hour clock." }
      time_zone: { type: int, min: -50400, max: 50400, required: true, label: Time zone, description: "Seconds between local time and GMT, as the camera counts them: 3600 is GMT-01:00, -3600 is GMT+01:00." }
      dst: { type: bool, required: true, label: Daylight saving, description: "On applies daylight saving time." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setSystemTime&timeSource=0&ntpServer={server}&dateFormat={date_format:map.date_format}&timeFormat={time_format:map.time_format}&timeZone={time_zone}&isDst={dst:bool01}&dst=0&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getSystemTime&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  set_time_manually:
    summary: "Set the date and time by hand"
    params:
      date_format: { type: enum, values: ["YYYY-MM-DD", "DD/MM/YYYY", "MM/DD/YYYY"], required: true, label: Date format, description: "Date shown as YYYY-MM-DD, DD/MM/YYYY or MM/DD/YYYY." }
      time_format: { type: enum, values: ["12", "24"], required: true, label: Time format, description: "12-hour or 24-hour clock." }
      time_zone: { type: int, min: -50400, max: 50400, required: true, label: Time zone, description: "Seconds between local time and GMT, as the camera counts them: 3600 is GMT-01:00, -3600 is GMT+01:00." }
      dst: { type: bool, required: true, label: Daylight saving, description: "On applies daylight saving time." }
      year: { type: int, min: 2000, max: 2099, required: true, label: Year, description: "Year, four digits." }
      month: { type: int, min: 1, max: 12, required: true, label: Month, description: "Month, 1 to 12." }
      day: { type: int, min: 1, max: 31, required: true, label: Day, description: "Day of the month, 1 to 31." }
      hour: { type: int, min: 0, max: 23, required: true, label: Hour, description: "Hour, 0 to 23." }
      minute: { type: int, min: 0, max: 59, required: true, label: Minute, description: "Minute, 0 to 59." }
      second: { type: int, min: 0, max: 59, required: true, label: Second, description: "Second, 0 to 59." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setSystemTime&timeSource=1&ntpServer=&dateFormat={date_format:map.date_format}&timeFormat={time_format:map.time_format}&timeZone={time_zone}&isDst={dst:bool01}&dst=0&year={year}&mon={month}&day={day}&hour={hour}&minute={minute}&sec={second}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getSystemTime&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  reboot:
    summary: "Restart the camera"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=rebootSystem&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  factory_reset:
    summary: "Restore the factory settings"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=restoreToFactorySetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack

maps:
  power_frequency: { "60": "0", "50": "1" }
  sub_format: { h264: "0", mjpeg: "1" }
  ptz_move: { up: ptzMoveUp, down: ptzMoveDown, left: ptzMoveLeft, right: ptzMoveRight, top_left: ptzMoveTopLeft,
              top_right: ptzMoveTopRight, bottom_left: ptzMoveBottomLeft, bottom_right: ptzMoveBottomRight }
  ptz_speed: { very_slow: "0", slow: "1", normal: "2", fast: "3", very_fast: "4" }
  zoom_speed: { slow: "0", normal: "1", fast: "2" }
  self_test: { none: "0", normal: "1", normal_then_preset: "2" }
  ir_mode: { auto: "0", manual: "1" }
  date_format: { "YYYY-MM-DD": "0", "DD/MM/YYYY": "1", "MM/DD/YYYY": "2" }
  time_format: { "12": "0", "24": "1" }

telemetry:
  # The CGI pushes nothing: the device state every 2 s, the rest every 30 s.
  poll:
    - every_ms: 2000
      send:
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getDevState&usr={settings.username:url}&pwd={settings.password:url}" }
    - every_ms: 30000
      send:
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getDevInfo&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getDevName&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getImageSetting&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getMirrorAndFlipSetting&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getVideoStreamParam&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getMainVideoStreamType&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getSubVideoStreamType&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getOSDSetting&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getOsdMaskArea&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getOSDMask&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getPTZSpeed&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getPTZPresetPointList&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=ptzGetCruiseMapList&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getZoomSpeed&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getPTZSelfTestMode&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getPTZPrePointForSelfTest&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=get485Info&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getInfraLedConfig&usr={settings.username:url}&pwd={settings.password:url}" }
        - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getSystemTime&usr={settings.username:url}&pwd={settings.password:url}" }
  updates:
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getDevState&'
      xml_each: CGI_Result
      state:
        alarms.io: { value: "{IOAlarm}", map: { "0": disabled, "1": none, "2": alarm } }
        alarms.motion: { value: "{motionDetectAlarm}", map: { "0": disabled, "1": none, "2": alarm } }
        alarms.sound: { value: "{soundAlarm}", map: { "0": disabled, "1": none, "2": alarm } }
        recording: { value: "{record}", map: { "0": false, "1": true } }
        sd.state: { value: "{sdState}", map: { "0": none, "1": ok, "2": read_only } }
        sd.free_kb: "{sdFreeSpace}"
        sd.total_kb: "{sdTotalSpace}"
        ntp_state: { value: "{ntpState}", map: { "0": disabled, "1": updated, "2": failed } }
        ddns.state: { value: "{ddnspState}", map: { "0": disabled, "1": updated, "2": failed } }
        ddns.url: "{url}"
        upnp_state: { value: "{upnpState}", map: { "0": disabled, "1": updated, "2": failed } }
        wifi.connected: { value: "{isWifiConnected}", map: { "0": false, "1": true } }
        wifi.ssid: "{wifiConnectedAP}"
        ir_led: { value: "{infraLedState}", map: { "0": false, "1": true } }
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getDevInfo&'
      xml_each: CGI_Result
      state:
        device.model: "{productName}"
        device.serial: "{serialNo}"
        device.name: "{devName}"
        device.mac: "{mac}"
        device.firmware: "{firmwareVer}"
        device.hardware: "{hardwareVer}"
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getDevName&'
      xml_each: CGI_Result
      state:
        device.name: "{devName}"
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getImageSetting&'
      xml_each: CGI_Result
      state:
        image.brightness: "{brightness}"
        image.contrast: "{contrast}"
        image.hue: "{hue}"
        image.saturation: "{saturation}"
        image.sharpness: "{sharpness}"
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getMirrorAndFlipSetting&'
      xml_each: CGI_Result
      state:
        image.mirrored: { value: "{isMirror}", map: { "0": false, "1": true } }
        image.flipped: { value: "{isFlip}", map: { "0": false, "1": true } }
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getVideoStreamParam&'
      xml_each: CGI_Result
      state:
        "streams.0.resolution": "{resolution0}"
        "streams.0.bitrate": "{bitRate0}"
        "streams.0.frame_rate": "{frameRate0}"
        "streams.0.gop": "{GOP0}"
        "streams.1.resolution": "{resolution1}"
        "streams.1.bitrate": "{bitRate1}"
        "streams.1.frame_rate": "{frameRate1}"
        "streams.1.gop": "{GOP1}"
        "streams.2.resolution": "{resolution2}"
        "streams.2.bitrate": "{bitRate2}"
        "streams.2.frame_rate": "{frameRate2}"
        "streams.2.gop": "{GOP2}"
        "streams.3.resolution": "{resolution3}"
        "streams.3.bitrate": "{bitRate3}"
        "streams.3.frame_rate": "{frameRate3}"
        "streams.3.gop": "{GOP3}"
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getMainVideoStreamType&'
      xml_each: CGI_Result
      state:
        main_stream_type: "{streamType}"
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getSubVideoStreamType&'
      xml_each: CGI_Result
      state:
        sub_stream_type: "{streamType}"
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getOSDSetting&'
      xml_each: CGI_Result
      state:
        osd.time_stamp: { value: "{isEnableTimeStamp}", map: { "0": false, "1": true } }
        osd.name: { value: "{isEnableDevName}", map: { "0": false, "1": true } }
        osd.masks: { value: "{isEnableOSDMask}", map: { "0": false, "1": true } }
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getOsdMaskArea&'
      xml_each: CGI_Result
      state:
        "masks.1.x1": "{x1_0}"
        "masks.1.y1": "{y1_0}"
        "masks.1.x2": "{x2_0}"
        "masks.1.y2": "{y2_0}"
        "masks.2.x1": "{x1_1}"
        "masks.2.y1": "{y1_1}"
        "masks.2.x2": "{x2_1}"
        "masks.2.y2": "{y2_1}"
        "masks.3.x1": "{x1_2}"
        "masks.3.y1": "{y1_2}"
        "masks.3.x2": "{x2_2}"
        "masks.3.y2": "{y2_2}"
        "masks.4.x1": "{x1_3}"
        "masks.4.y1": "{y1_3}"
        "masks.4.x2": "{x2_3}"
        "masks.4.y2": "{y2_3}"
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getOSDMask&'
      xml_each: CGI_Result
      state:
        osd.masks: { value: "{isEnableOSDMask}", map: { "0": false, "1": true } }
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getPTZSpeed&'
      xml_each: CGI_Result
      state:
        ptz_speed: { value: "{speed}", map: { "0": very_slow, "1": slow, "2": normal, "3": fast, "4": very_fast } }
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getZoomSpeed&'
      xml_each: CGI_Result
      state:
        zoom_speed: { value: "{speed}", map: { "0": slow, "1": normal, "2": fast } }
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getPTZSelfTestMode&'
      xml_each: CGI_Result
      state:
        self_test.mode: { value: "{mode}", map: { "0": none, "1": normal, "2": normal_then_preset } }
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getPTZPrePointForSelfTest&'
      xml_each: CGI_Result
      state:
        self_test.preset: "{name}"
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=get485Info&'
      xml_each: CGI_Result
      state:
        rs485.protocol: "{rs485Protocol}"
        rs485.address: "{rs485Addr}"
        rs485.baud: "{rs485Baud}"
        rs485.data_bits: "{rs485DataBit}"
        rs485.stop_bits: "{rs485StopBit}"
        rs485.parity: "{rs485Check}"
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getInfraLedConfig&'
      xml_each: CGI_Result
      state:
        ir_led_mode: { value: "{mode}", map: { "0": auto, "1": manual } }
    - path: '^/cgi-bin/CGIProxy\.fcgi\?cmd=getSystemTime&'
      xml_each: CGI_Result
      state:
        time.source: { value: "{timeSource}", map: { "0": ntp, "1": manual } }
        time.ntp_server: "{ntpServer}"
        time.zone: "{timeZone}"
        time.dst: { value: "{isDst}", map: { "0": false, "1": true } }
        time.year: "{year}"
        time.month: "{mon}"
        time.day: "{day}"
        time.hour: "{hour}"
        time.minute: "{minute}"
        time.second: "{sec}"
    # Preset points: cnt, then point0, point1... (the cruise map info's
    # points come with getResult, not cnt).
    - match: '(?s)<CGI_Result>\s*<result>0</result>\s*<cnt>\d+</cnt>((?:\s*<point\d+>[^<]*</point\d+>)*)'
      match_each_in: 1
      match_each: '<point(\d+)>([^<]*)</point\d+>'
      replace: presets
      state: { "presets.{index:+1}.name": "{3}" }
    - match: '(?s)<CGI_Result>\s*<result>0</result>\s*<cnt>\d+</cnt>((?:\s*<map\d+>[^<]*</map\d+>)*)'
      match_each_in: 1
      match_each: '<map(\d+)>([^<]*)</map\d+>'
      replace: cruise_maps
      state: { "cruise_maps.{index:+1}.name": "{3}" }

