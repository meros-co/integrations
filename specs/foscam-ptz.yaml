quirks:
  - models: [all]
    severity: warning
    text: >
      The CGI takes the user name and password only as the usr and pwd query arguments of each
      request, so they travel in clear over http and appear in the camera's request logs; use
      https where the camera offers it. A wrong password answers result -2 with HTTP 200, which
      fails the command (and is not treated as a refusal of the credential).
  - models: [all]
    severity: info
    text: >
      Every answer is HTTP 200 with an XML CGI_Result; a command succeeds only on result 0. The
      CGI pushes nothing, so the device state is read every 2 s and the settings every 30 s.
      Preset points and cruise maps are named, not numbered; their numbers in state follow the
      camera's order.
  - models: [all]
    severity: info
    text: >
      The guide's example for setContrast spells the argument "constrast" while its parameter
      table says contrast; the table is followed. Zoom commands are only for cameras with a zoom
      lens, the self-test commands for cameras that offer it, and RS-485 for cameras with the
      port. The pan/tilt head's position cannot be read (an API limit).
  - models: [all]
    severity: info
    text: >
      Not covered: network, Wi-Fi, port, UPnP, DDNS, FTP, SMTP and P2P settings, user accounts,
      motion detection and alarm configuration, snapshots and the MJPEG stream, multi-device
      lists, the firewall, the log, configuration export and import and firmware upgrade (the last
      three move files the spec format cannot fetch or post as the camera expects).
  - models: [all]
    severity: critical
    text: >
      factory_reset restores every setting; delete_preset, set_cruise_map and delete_cruise_map
      overwrite or delete stored positions; reboot drops the video.
