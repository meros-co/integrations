    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=ptzGotoPresetPoint&name={name}&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_cruise_maps:
