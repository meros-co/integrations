    returns: ack
  zoom_out:
    summary: "Zoom out until zoom_stop"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=zoomOut&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
