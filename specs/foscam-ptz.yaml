      mode: { type: enum, values: ["none", "normal", "normal_then_preset"], required: true, label: Power-up, description: "none skips the self-test, normal runs it, normal_then_preset runs it then goes to the power-up preset." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setPTZSelfTestMode&mode={mode:map.self_test}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getPTZSelfTestMode&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_self_test_preset:
