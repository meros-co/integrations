    returns: ack
  get_zoom_speed:
    summary: "Read the zoom speed"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getZoomSpeed&usr={settings.username:url}&pwd={settings.password:url}" }
