spec: 1
id: foscam-ptz
name: Foscam HD IP cameras (CGI)
vendor: Foscam
category: camera

# Foscam's HD cameras answer CGI requests at /cgi-bin/CGIProxy.fcgi?cmd=...,
# the user name and password passed as the usr and pwd query arguments (the
# only authentication the CGI takes), on the camera's HTTP port, 88 by
# default. Every answer is an XML CGI_Result whose result element is 0 on
# success.

source:
  - title: Foscam IPCamera CGI User Guide, V1.0.4
    author: Shenzhen Foscam Intelligent Technology Limited
    url: https://community.jeedom.com/uploads/short-url/kBTc3QYALDiATROJMuBjAj04yNo.pdf
    note: >
      Manufacturer document (a community copy of the guide Foscam distributes with its SDK; the
      revision history ends at V1.0.4), read 2026-10-27. General description (usr and pwd in the
      request; GET; XML CGI_Result with result 0 success, -1 format error, -2 user name or password
      error, -3 access denied, -4 execute fail, -5 timeout, -7 unknown); AV Function
      (getImageSetting, setBrightness, setContrast, setHue, setSaturation, setSharpness,
      resetImageSetting, getMirrorAndFlipSetting, mirrorVideo, flipVideo, setPwrFreq,
      getVideoStreamParam, setVideoStreamParam, getMainVideoStreamType, getSubVideoStreamType,
      setMainVideoStreamType, setSubStreamFormat, getOSDSetting, setOSDSetting, getOsdMaskArea,
      setOsdMaskArea, getOSDMask, setOSDMask); PTZ Control (the eight moves, ptzStopRun, ptzReset,
      PTZ speed 0-4, preset points (16 at most, names), cruise maps (8 at most, 8 points each),
      zoom with speed 0-2, self-test mode and preset, RS-485 settings); Device manage
      (setSystemTime, getSystemTime, openInfraLed, closeInfraLed, getInfraLedConfig,
      setInfraLedConfig, getDevState, getDevName, setDevName, getDevInfo); System (rebootSystem,
      restoreToFactorySetting).
  - title: companion-module-foscam-ptz (MIT licence)
    author: Bitfocus contributors
    url: https://github.com/bitfocus/companion-module-foscam-ptz
    note: >
      Read for corroboration only (index.js), retrieved 2026-10-27: requests to
      /cgi-bin/CGIProxy.fcgi with cmd, usr and pwd, port 88 by default. No code taken.

transport:
  type: http
  port: 88
  https_port: 443
  scheme: { setting: scheme }
  accept_invalid_certs: true
  auth: none
  timeout_ms: 5000
  probe: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getDevName&usr={settings.username:url}&pwd={settings.password:url}" }

settings:
  username: { type: string, default: admin, max_length: 64, label: Username, description: "A camera account: visitor reads, operator moves the camera, admin changes settings." }
  password: { type: string, default: "", secret: true, max_length: 64, label: Password, description: "The account's password, sent in each request as the CGI requires." }
  scheme: { type: enum, values: [http, https], default: http, label: Connection, description: "http on the camera's HTTP port (88 by default), or https on its HTTPS port (443)." }

ports:
  - { port: 88, protocol: http, role: control, when: "scheme http", note: "the camera's HTTP port, 88 by default" }
  - { port: 443, protocol: https, role: control, when: "scheme https" }

models:
  - id: foscam-ptz
    name: Foscam HD PTZ camera
    supports: &all
      [get_image_settings, set_brightness, set_contrast, set_hue, set_saturation, set_sharpness, reset_image_settings, get_mirror_flip, set_mirror, set_flip, set_power_frequency, get_video_streams, set_video_stream, get_main_stream_type, get_sub_stream_type, set_main_stream_type, set_sub_stream_format, get_osd, set_osd, get_mask_areas, set_mask_areas, get_mask_enabled, set_mask_enabled, move, stop, reset_position, get_ptz_speed, set_ptz_speed, get_presets, add_preset, delete_preset, goto_preset, get_cruise_maps, get_cruise_map, set_cruise_map, delete_cruise_map, start_cruise, stop_cruise, zoom_in, zoom_out, zoom_stop, get_zoom_speed, set_zoom_speed, get_self_test_mode, set_self_test_mode, get_self_test_preset, set_self_test_preset, get_rs485, set_rs485, get_device_state, get_device_info, get_device_name, set_device_name, ir_led_on, ir_led_off, get_ir_led_mode, set_ir_led_mode, get_system_time, set_time_from_ntp, set_time_manually, reboot, factory_reset]
    verification: none
  - id: foscam-fixed
    name: Foscam HD camera without pan/tilt
    supports:
      [get_image_settings, set_brightness, set_contrast, set_hue, set_saturation, set_sharpness, reset_image_settings, get_mirror_flip, set_mirror, set_flip, set_power_frequency, get_video_streams, set_video_stream, get_main_stream_type, get_sub_stream_type, set_main_stream_type, set_sub_stream_format, get_osd, set_osd, get_mask_areas, set_mask_areas, get_mask_enabled, set_mask_enabled, get_device_state, get_device_info, get_device_name, set_device_name, ir_led_on, ir_led_off, get_ir_led_mode, set_ir_led_mode, get_system_time, set_time_from_ntp, set_time_manually, reboot, factory_reset]
    verification: none

commands:
  # ── Image ──────────────────────────────────────────────────────────────
  get_image_settings:
    summary: "Read brightness, contrast, hue, saturation and sharpness"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getImageSetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_brightness:
    summary: "Set the brightness, 0 to 100, then read the image settings back"
    params:
      level: { type: int, min: 0, max: 100, required: true, label: Brightness, description: "Brightness, 0 to 100." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setBrightness&brightness={level}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getImageSetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  set_contrast:
    summary: "Set the contrast, 0 to 100, then read the image settings back"
    params:
      level: { type: int, min: 0, max: 100, required: true, label: Contrast, description: "Contrast, 0 to 100." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setContrast&contrast={level}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getImageSetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  set_hue:
    summary: "Set the hue, 0 to 100, then read the image settings back"
    params:
      level: { type: int, min: 0, max: 100, required: true, label: Hue, description: "Hue, 0 to 100." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setHue&hue={level}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getImageSetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  set_saturation:
    summary: "Set the saturation, 0 to 100, then read the image settings back"
    params:
      level: { type: int, min: 0, max: 100, required: true, label: Saturation, description: "Saturation, 0 to 100." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setSaturation&saturation={level}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getImageSetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  set_sharpness:
    summary: "Set the sharpness, 0 to 100, then read the image settings back"
    params:
      level: { type: int, min: 0, max: 100, required: true, label: Sharpness, description: "Sharpness, 0 to 100." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setSharpness&sharpness={level}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getImageSetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  reset_image_settings:
    summary: "Reset the image settings to their defaults"
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=resetImageSetting&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getImageSetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_mirror_flip:
    summary: "Read whether the picture is mirrored and flipped"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getMirrorAndFlipSetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_mirror:
    summary: "Mirror the picture or not"
    params:
      mirrored: { type: bool, required: true, label: Mirror, description: "On mirrors the picture left to right." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=mirrorVideo&isMirror={mirrored:bool01}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getMirrorAndFlipSetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  set_flip:
    summary: "Flip the picture or not"
    params:
      flipped: { type: bool, required: true, label: Flip, description: "On flips the picture upside down." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=flipVideo&isFlip={flipped:bool01}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getMirrorAndFlipSetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  set_power_frequency:
    summary: "Set the sensor's mains frequency against flicker"
    params:
      frequency: { type: enum, values: ["60", "50"], required: true, label: Mains frequency, description: "Mains frequency of the lighting: 60 or 50 Hz." }
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setPwrFreq&freq={frequency:map.power_frequency}&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_video_streams:
    summary: "Read the four stream types' resolution, bitrate, frame rate and GOP"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getVideoStreamParam&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_video_stream:
    summary: "Set a stream type's resolution, bitrate, frame rate and GOP"
    params:
      stream: { type: int, min: 0, max: 3, required: true, label: Stream type, description: "Stream type to set, 0 to 3." }
      resolution: { type: int, min: 0, max: 31, required: true, label: Resolution, description: "Resolution number as the camera lists its resolutions." }
      bitrate: { type: int, min: 20480, max: 2097152, required: true, label: Bitrate, description: "Bitrate in bits per second, 20480 to 2097152." }
      frame_rate: { type: int, min: 1, max: 60, required: true, label: Frame rate, description: "Frames per second." }
      gop: { type: int, min: 1, max: 300, required: true, label: GOP, description: "P frames between I frames; the guide suggests a multiple of the frame rate." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setVideoStreamParam&streamType={stream}&resolution={resolution}&bitRate={bitrate}&frameRate={frame_rate}&GOP={gop}&isVBR=0&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getVideoStreamParam&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_main_stream_type:
    summary: "Read which stream type the main stream uses"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getMainVideoStreamType&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  get_sub_stream_type:
    summary: "Read which stream type the sub stream uses"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getSubVideoStreamType&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_main_stream_type:
    summary: "Choose the stream type the main stream uses"
    params:
      stream: { type: int, min: 0, max: 3, required: true, label: Stream type, description: "Stream type 0 to 3." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setMainVideoStreamType&streamType={stream}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getMainVideoStreamType&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  set_sub_stream_format:
    summary: "Encode the sub stream as H.264 or Motion JPEG"
    params:
      format: { type: enum, values: ["h264", "mjpeg"], required: true, label: Format, description: "h264, or mjpeg for a Motion JPEG stream a web page can show." }
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setSubStreamFormat&format={format:map.sub_format}&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_osd:
    summary: "Read the on-screen display settings"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getOSDSetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_osd:
    summary: "Show the time stamp and camera name on the picture or not, and use the masks or not"
    params:
      time_stamp: { type: bool, required: true, label: Time stamp, description: "On shows the date and time on the picture." }
      name: { type: bool, required: true, label: Camera name, description: "On shows the camera name on the picture." }
      masks: { type: bool, required: true, label: Masks, description: "On blanks the mask areas." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setOSDSetting&isEnableTimeStamp={time_stamp:bool01}&isEnableDevName={name:bool01}&dispPos=0&isEnableOSDMask={masks:bool01}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getOSDSetting&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_mask_areas:
    summary: "Read the four mask areas"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getOsdMaskArea&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_mask_areas:
    summary: "Set the four mask areas (top-left and bottom-right corners)"
    params:
      x1_0: { type: int, min: 0, max: 10000, required: true, label: Mask 1 left, description: "Mask area 1's left edge in pixels; all four 0 for no mask." }
      y1_0: { type: int, min: 0, max: 10000, required: true, label: Mask 1 top, description: "Mask area 1's top edge in pixels; all four 0 for no mask." }
      x2_0: { type: int, min: 0, max: 10000, required: true, label: Mask 1 right, description: "Mask area 1's right edge in pixels; all four 0 for no mask." }
      y2_0: { type: int, min: 0, max: 10000, required: true, label: Mask 1 bottom, description: "Mask area 1's bottom edge in pixels; all four 0 for no mask." }
      x1_1: { type: int, min: 0, max: 10000, required: true, label: Mask 2 left, description: "Mask area 2's left edge in pixels; all four 0 for no mask." }
      y1_1: { type: int, min: 0, max: 10000, required: true, label: Mask 2 top, description: "Mask area 2's top edge in pixels; all four 0 for no mask." }
      x2_1: { type: int, min: 0, max: 10000, required: true, label: Mask 2 right, description: "Mask area 2's right edge in pixels; all four 0 for no mask." }
      y2_1: { type: int, min: 0, max: 10000, required: true, label: Mask 2 bottom, description: "Mask area 2's bottom edge in pixels; all four 0 for no mask." }
      x1_2: { type: int, min: 0, max: 10000, required: true, label: Mask 3 left, description: "Mask area 3's left edge in pixels; all four 0 for no mask." }
      y1_2: { type: int, min: 0, max: 10000, required: true, label: Mask 3 top, description: "Mask area 3's top edge in pixels; all four 0 for no mask." }
      x2_2: { type: int, min: 0, max: 10000, required: true, label: Mask 3 right, description: "Mask area 3's right edge in pixels; all four 0 for no mask." }
      y2_2: { type: int, min: 0, max: 10000, required: true, label: Mask 3 bottom, description: "Mask area 3's bottom edge in pixels; all four 0 for no mask." }
      x1_3: { type: int, min: 0, max: 10000, required: true, label: Mask 4 left, description: "Mask area 4's left edge in pixels; all four 0 for no mask." }
      y1_3: { type: int, min: 0, max: 10000, required: true, label: Mask 4 top, description: "Mask area 4's top edge in pixels; all four 0 for no mask." }
      x2_3: { type: int, min: 0, max: 10000, required: true, label: Mask 4 right, description: "Mask area 4's right edge in pixels; all four 0 for no mask." }
      y2_3: { type: int, min: 0, max: 10000, required: true, label: Mask 4 bottom, description: "Mask area 4's bottom edge in pixels; all four 0 for no mask." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setOsdMaskArea&x1_0={x1_0}&y1_0={y1_0}&x2_0={x2_0}&y2_0={y2_0}&x1_1={x1_1}&y1_1={y1_1}&x2_1={x2_1}&y2_1={y2_1}&x1_2={x1_2}&y1_2={y1_2}&x2_2={x2_2}&y2_2={y2_2}&x1_3={x1_3}&y1_3={y1_3}&x2_3={x2_3}&y2_3={y2_3}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getOsdMaskArea&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_mask_enabled:
    summary: "Read whether the masks are used"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getOSDMask&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_mask_enabled:
    summary: "Use the mask areas or not"
    params:
      enabled: { type: bool, required: true, label: Masks, description: "On blanks the mask areas." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setOSDMask&isEnableOSDMask={enabled:bool01}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getOSDMask&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack

  # ── Pan/tilt and zoom ──────────────────────────────────────────────────
  move:
    summary: "Move the pan/tilt head in a direction until stop"
    params:
      direction: { type: enum, values: ["up", "down", "left", "right", "top_left", "top_right", "bottom_left", "bottom_right"], required: true, label: Direction, description: "Direction of the move, including the four diagonals." }
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd={direction:map.ptz_move}&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  stop:
    summary: "Stop the pan/tilt move"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=ptzStopRun&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  reset_position:
    summary: "Move the pan/tilt head to its default position"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=ptzReset&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_ptz_speed:
    summary: "Read the pan/tilt speed"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getPTZSpeed&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  set_ptz_speed:
    summary: "Set the pan/tilt speed"
    params:
      speed: { type: enum, values: ["very_slow", "slow", "normal", "fast", "very_fast"], required: true, label: Speed, description: "Pan/tilt speed from very_slow to very_fast." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=setPTZSpeed&speed={speed:map.ptz_speed}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getPTZSpeed&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  get_presets:
    summary: "List the preset points"
    send: { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getPTZPresetPointList&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: text
  add_preset:
    summary: "Save the current position as a named preset point"
    params:
      name: { type: string, max_length: 32, pattern: "^[A-Za-z0-9_-]+$", required: true, label: Preset, description: "Preset point name." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=ptzAddPresetPoint&name={name}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getPTZPresetPointList&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  delete_preset:
    summary: "Delete a preset point by name"
    params:
      name: { type: string, max_length: 32, pattern: "^[A-Za-z0-9_-]+$", required: true, label: Preset, description: "Preset point name." }
    send:
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=ptzDeletePresetPoint&name={name}&usr={settings.username:url}&pwd={settings.password:url}" }
      - { method: GET, path: /cgi-bin/CGIProxy.fcgi, raw_query: "cmd=getPTZPresetPointList&usr={settings.username:url}&pwd={settings.password:url}" }
    expect: { status: 200, matches: '<result>0</result>' }
    returns: ack
  goto_preset:
