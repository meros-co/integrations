telemetry:
  # MADRIX sends its feedback to the sender's address, on its Destination
  # Network Port, once a client has sent to it; FeedbackAll asks for every
  # value again. What OSC does not report is read over the HTTP Remote.
  subscribe:
    send: [ { address: /Main/FeedbackAll } ]
    every_ms: 60000
  poll:
    - every_ms: 2000
      send:
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetStorageDeckA }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetStoragePlaceDeckA }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetStorageDeckB }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetStoragePlaceDeckB }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetLayerDeckA }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetLayerDeckB }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetLayerCountDeckA }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetLayerCountDeckB }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetLayerNameDeckA }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetLayerNameDeckB }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetLayerEffectNameDeckA }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetLayerEffectNameDeckB }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetLayerTickerTextDeckA }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetLayerTickerTextDeckB }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetCuelistCueCurrent }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetTimelinesDuration }
    - every_ms: 60000
      send:
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetProduct }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetVersion }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetVersionNumber }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetHostName }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetHostLabel }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetMatrixSizeX }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetMatrixSizeY }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetMatrixSizeZ }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetCuelistCount }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetTimelinesCount }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetGroupCount }
        - { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: GetSetupRegisterCurrentId }
  updates:
    - address: "^/Audio/Input/Level$"
      state: { "audio.input.level": "{arg0}" }
    - address: "^/Audio/Input/Mute$"
      state:
        "audio.input.muted": { value: "{arg0}", map: { "0": false, "1": true } }
    - address: "^/Audio/Output/Level$"
      state: { "audio.output.level": "{arg0}" }
    - address: "^/Audio/Output/Mute$"
      state:
        "audio.output.muted": { value: "{arg0}", map: { "0": false, "1": true } }
    - address: "^/Audio/Input/Agc$"
      state:
        "audio.input.agc": { value: "{arg0}", map: { "0": false, "1": true } }
    - address: "^/(DeckA|DeckB)/Pause$"
      state:
        "decks.{1}.paused": { value: "{arg0}", map: { "0": false, "1": true } }
    - address: "^/(DeckA|DeckB)/SpeedMaster$"
      state: { "decks.{1}.speed_master": "{arg0}" }
    - address: "^/(DeckA|DeckB)/Submaster$"
      state: { "decks.{1}.submaster": "{arg0}" }
    - address: "^/(DeckA|DeckB)/Filter$"
      state: { "decks.{1}.filter": "{arg0}" }
    - address: "^/(DeckA|DeckB)/FilterColor/Mode$"
      state: { "decks.{1}.filter_color.mode": "{arg0}" }
    - address: "^/(DeckA|DeckB)/FilterColor/GlobalId$"
      state: { "decks.{1}.filter_color.global_id": "{arg0}" }
    - address: "^/(DeckA|DeckB)/FilterColor/Red$"
      state: { "decks.{1}.filter_color.red": "{arg0}" }
    - address: "^/(DeckA|DeckB)/FilterColor/Green$"
      state: { "decks.{1}.filter_color.green": "{arg0}" }
    - address: "^/(DeckA|DeckB)/FilterColor/Blue$"
