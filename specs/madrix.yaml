spec: 1
id: madrix
name: MADRIX 5 (OSC and HTTP Remote)
vendor: inoage
category: lighting

# Written from the MADRIX 5 help: its fixed OSC address space (UDP 9001, with
# feedback to the sender on 9002) for control and state, and its HTTP Remote
# (the integrated web server, /RemoteCommands/?<Function>) for what OSC does
# not reach: storage places by number, ticker text, cue list editing, names
# and descriptions, and the values OSC does not report.
source:
  - title: MADRIX 5 Help, Input, Interoperability, And Remote Control > OSC
    author: inoage GmbH
    url: https://help.madrix.com/m5/html/madrix/hidd_osc.html
    note: >
      MADRIX 5.8 help, retrieved 2026-10-27. Enable Server, Network Port "The default value is
      9001"; Enable Feedback, Destination Network Port "The default value is 9002", feedback
      "sends states and data ... back to the remote controller"; integer and float arguments
      only; case-sensitive addresses; "N-1 means that the function works with an index, and this
      index starts with 0". The address space table: /Audio/Input|Output, /DeckA or /DeckB
      (Pause, SpeedMaster, Submaster, Filter, FilterColor, Storages/Index, Places/Index,
      StoragePlace with SpeedPitch, Submaster, Filter, Chaser and Layers/[0 ... N-1]), /Output
      (Freeze, Master, Blackout, Filter, FilterColor, StrobeColor, Strobe), /Fade (Time, Type,
      Value, Automatic, ToLeft, ToRight, ToCenter), /ColorKit/GlobalColors/[1 ... N],
      /GroupControl (Defaults, Groups/[0 ... N-1], Chaser, FadeTime, Presets/Index "No Feedback
      Wanted"), /DmxFaderTool/Faders/[0 ... 23], /CueLists, /Timelines (Index, PlaybackState,
      AudioSegments, CueSegments, Markers/Id), /SetupRegisters/Id, /Trigger/Ports/[0 ... 63]/
      PositionAndValue, /Main/View, /Main/FeedbackAll ("a single command to initially sync all
      available functions with the client"), /ArtNet/Input/TimeCode/StreamId, with Up, Down and
      Offset methods; the Logfile line "The OSC sender has subscribed to this session and will
      get feedback".
  - title: MADRIX 5 Help, Input, Interoperability, And Remote Control > Remote HTTP
    author: inoage GmbH
    url: https://help.madrix.com/m5/html/madrix/hidd_remote_http.html
    note: >
      MADRIX 5.8 help. Preferences > Remote Control > HTTP: Enable, Network Port (recommended 80,
      alternatives 3128, 8080, 8081); "commands are case-sensitive ... That does not apply to any
      parameters you want to pass"; the full list of remote commands at the address below.
  - title: MADRIX 5.8a - HTTP Remote Control - Documentation
    author: inoage GmbH
    url: https://help.madrix.com/m5/httpremote/HttpRemoteControl.html
    note: >
      Retrieved 2026-10-27. The remote directory /RemoteCommands; each function is called as
      /RemoteCommands/?<Function> or /RemoteCommands/?<Function>=<value> (the page's own links);
      Get functions answer the value ("current fadetime is 1"). Set functions used here:
      SetStorage, SetStorageWithoutFade, SetStorageDeckA|B, SetStorageWithoutFadeDeckA|B
      (S<storage>P<place>, 1-256), SetLayerDeckA|B, SetTextTicker, SetTextTickerLayerDeckA|B
      (<layer>_<text>, 0 for all), SetBpm, SetGroupPresetWithFade, SetCuelistGo, Back, GoTo,
      AddCue, AddOccupiedStoragePlaces, DeleteCue, DeleteAll, FollowCue, Storage, StoragePlace,
      FadeType, FadeTime, Duration, TimeCode, Date, GroupPreset (<item>_<value>), SetGlobalColor
      (<id>_R150G0A200W50). Get functions used here: GetProduct, GetVersion, GetVersionNumber,
      GetHostName, GetHostLabel, GetMatrixSizeX|Y|Z, GetCuelistCount, GetTimelinesCount,
      GetGroupCount, GetSetupRegisterCurrentId, GetStorageDeckA|B, GetStoragePlaceDeckA|B,
      GetLayerDeckA|B, GetLayerCountDeckA|B, GetLayerNameDeckA|B, GetLayerEffectNameDeckA|B,
      GetLayerTickerTextDeckA|B, GetCuelistCueCurrent, GetTimelinesDuration, GetCuelistName,
      GetTimelinesName, GetCuelistDescription, GetStoragePlaceDescription,
      GetStoragePlaceFullState, GetGroupDisplayName, GetGroupPresetDescription,
      GetGlobalColorDescription, GetSetupRegisterDescription.

transport:
  type: osc-udp
  port: 9001
  reply: none
  listen_port: { setting: feedback_port }
  endpoints:
    http:
      port: { setting: http_port }

settings:
  feedback_port:
    type: int
    min: 1
    max: 65535
    default: 9002
    label: Feedback port
    description: "Local UDP port this host listens on for MADRIX's OSC feedback: MADRIX's Destination Network Port under Preferences > Remote Control > OSC, 9002 by default; empty reads nothing back."
  http_port:
    type: int
    min: 1
    max: 65535
    default: 80
    label: HTTP Remote port
    description: "The Network Port of MADRIX's web server under Preferences > Remote Control > HTTP; 80 is recommended, 3128, 8080 and 8081 the alternatives."

ports:
  - { port: 9001, protocol: udp, role: control, note: "MADRIX's OSC server port (Preferences > Remote Control > OSC)" }
  - { port: 9002, protocol: udp, role: feedback, listener: core, setting: feedback_port, note: "MADRIX's OSC Destination Network Port" }
  - { port: 80, protocol: http, role: control, setting: http_port, note: "MADRIX's HTTP Remote web server" }

maps:
  deck: { a: "DeckA", b: "DeckB" }
  channel: { red: "Red", green: "Green", blue: "Blue", white: "White" }
  global_channel: { red: "Red", green: "Green", blue: "Blue", white: "White", alpha: "Alpha" }
  playback_state: { stopped: "0", paused: "1", playing: "2" }
  strobe_mode: { output_and_color: "0", output_and_black: "1", black_and_color: "2" }
  fade_type: { crossfade: "0", white_fade: "1", black_fade: "2", wipe_x: "3", wipe_y: "4", wipe_x_cross: "5", wipe_y_cross: "6", slide_x: "7", slide_y: "8", slide_x_cross: "9", slide_y_cross: "10", wipe_z: "11", wipe_z_cross: "12", slide_z: "13", slide_z_cross: "14" }
  fade_to: { auto: "Automatic", deck_a: "ToLeft", deck_b: "ToRight", center: "ToCenter" }
  cue_list_mode: { loop: "0", shuffle: "1" }
  timecode_source: { none: "0", system_time: "1", midi: "2", artnet: "3", smpte: "4" }
  direction: { up: "Up", down: "Down" }
  step_target: { output_filter: "Output/Filter", output_filter_color_mode: "Output/FilterColor/Mode", output_filter_color_global: "Output/FilterColor/GlobalId", strobe_color_mode: "Output/StrobeColor/Mode", strobe_color_global: "Output/StrobeColor/GlobalId", fade_type: "Fade/Type", group_chaser_step: "GroupControl/Chaser/Steps/Index", group_preset: "GroupControl/Presets/Index", cue_list: "CueLists/Index", cue_list_timecode_source: "CueLists/TimeCodeSource", cue: "CueLists/Cues/Index", timeline: "Timelines/Index", audio_segment: "Timelines/AudioSegments/Index", cue_segment: "Timelines/CueSegments/Index", marker: "Timelines/Markers/Id", setup_register: "SetupRegisters/Id", view: "Main/View", artnet_timecode_stream: "ArtNet/Input/TimeCode/StreamId" }
  deck_step_target: { filter: "Filter", filter_color_mode: "FilterColor/Mode", filter_color_global: "FilterColor/GlobalId", storage: "Storages/Index", place: "Places/Index", place_filter: "StoragePlace/Filter", place_chaser_step: "StoragePlace/Chaser/Steps/Index" }
  layer_step_target: { filter: "Filter", mix_mode: "MixMode", chaser_step: "Chaser/Steps/Index" }
  offset_target: { audio_input_level: "Audio/Input/Level", audio_output_level: "Audio/Output/Level", master: "Output/Master", output_filter_red: "Output/FilterColor/Red", output_filter_green: "Output/FilterColor/Green", output_filter_blue: "Output/FilterColor/Blue", output_filter_white: "Output/FilterColor/White", strobe_red: "Output/StrobeColor/Red", strobe_green: "Output/StrobeColor/Green", strobe_blue: "Output/StrobeColor/Blue", strobe_white: "Output/StrobeColor/White", strobe: "Output/Strobe", fade_time: "Fade/Time", crossfader: "Fade/Value", group_chaser_speed_pitch: "GroupControl/Chaser/SpeedPitch", group_fade_time: "GroupControl/FadeTime" }
  deck_offset_target: { speed_master: "SpeedMaster", submaster: "Submaster", filter_red: "FilterColor/Red", filter_green: "FilterColor/Green", filter_blue: "FilterColor/Blue", filter_white: "FilterColor/White", place_speed_pitch: "StoragePlace/SpeedPitch", place_submaster: "StoragePlace/Submaster", place_chaser_speed_pitch: "StoragePlace/Chaser/SpeedPitch" }
  layer_offset_target: { submaster: "Submaster", opacity: "Opacity", chaser_speed_pitch: "Chaser/SpeedPitch" }

models:
  - id: madrix5
    name: MADRIX 5
    supports: [
      set_audio_input_level, set_audio_input_mute, set_audio_output_level, set_audio_output_mute, set_audio_input_agc,
      set_deck_pause, set_deck_speed_master, set_deck_submaster, set_deck_filter, set_deck_filter_color_mode,
      set_deck_filter_color_global, set_deck_filter_color_channel, set_deck_filter_color_rgb, select_deck_storage, select_deck_place,
      set_place_speed_pitch, set_place_submaster, set_place_filter, set_place_chaser_state, set_place_chaser_speed_pitch,
      select_place_chaser_step, set_layer_submaster, set_layer_opacity, set_layer_blind, set_layer_solo,
      set_layer_filter, set_layer_mix_mode, set_layer_chaser_state, set_layer_chaser_speed_pitch, select_layer_chaser_step,
      set_freeze, set_master, set_blackout, set_output_filter, set_output_filter_color_mode,
      set_output_filter_color_global, set_output_filter_color_channel, set_output_filter_color_rgb, set_strobe_color_mode, set_strobe_color_global,
      set_strobe_color_channel, set_strobe_color_rgb, set_strobe, set_fade_time, set_fade_type,
      set_crossfader, crossfade, set_global_color_channel, set_global_color_rgb, set_group_defaults,
      set_group_value, set_group_flash, set_group_chaser_state, set_group_chaser_speed_pitch, select_group_chaser_step,
      set_group_fade_time, recall_group_preset, set_dmx_fader_state, set_dmx_fader_value, select_cue_list,
      set_cue_list_state, set_cue_list_mode, set_cue_list_timecode_source, select_cue, select_timeline,
      set_timeline_state, select_audio_segment, select_cue_segment, select_marker, load_setup_register,
      set_trigger_port, set_view, feedback_all, set_artnet_timecode_stream, step,
      deck_step, layer_step, offset, deck_offset, layer_offset,
      global_color_offset, group_value_offset, dmx_fader_offset, set_storage_place, set_storage_place_without_fade,
      set_deck_storage_place, set_deck_storage_place_without_fade, set_current_layer, set_ticker_text, set_deck_ticker_text,
      set_bpm, recall_group_preset_with_fade, cue_list_go, cue_list_back, cue_list_go_to,
      cue_list_add_cue, cue_list_add_occupied_places, cue_list_delete_cue, cue_list_delete_all, set_cue_follow,
      set_cue_storage, set_cue_place, set_cue_fade_type, set_cue_fade_time, set_cue_duration,
      set_cue_timecode, set_cue_date, set_cue_group_preset, set_global_color, get_cue_list_name,
      get_timeline_name, get_cue_description, get_storage_place_description, get_storage_place_filled, get_group_name,
      get_group_preset_description, get_global_color_description, get_setup_register_description, get_value
    ]
    verification: none

commands:
  set_audio_input_level:
    summary: "Set the audio input level, 0-100 (\"/Audio/Input/Level\")"
    params:
      level: { type: "int", min: 0, max: 100, required: true, label: "Level", description: "Audio input level in percent, 0 to 100." }
    send: { address: "/Audio/Input/Level", args: [ { value: "{level}", type: "int" } ] }
    returns: none

  set_audio_input_mute:
    summary: "Mute or unmute the audio input (\"/Audio/Input/Mute\")"
    params:
      muted: { type: "bool", required: true, label: "Muted", description: "On mutes the audio input, off unmutes it." }
    send: { address: "/Audio/Input/Mute", args: [ { value: "{muted:bool01}", type: "int" } ] }
    returns: none

  set_audio_output_level:
    summary: "Set the audio output level, 0-100 (\"/Audio/Output/Level\")"
    params:
      level: { type: "int", min: 0, max: 100, required: true, label: "Level", description: "Audio output level in percent, 0 to 100." }
    send: { address: "/Audio/Output/Level", args: [ { value: "{level}", type: "int" } ] }
    returns: none

  set_audio_output_mute:
    summary: "Mute or unmute the audio output (\"/Audio/Output/Mute\")"
    params:
      muted: { type: "bool", required: true, label: "Muted", description: "On mutes the audio output, off unmutes it." }
    send: { address: "/Audio/Output/Mute", args: [ { value: "{muted:bool01}", type: "int" } ] }
    returns: none

  set_audio_input_agc:
    summary: "Turn the audio input's automatic gain control on or off (\"/Audio/Input/Agc\")"
    params:
      enabled: { type: "bool", required: true, label: "Auto gain", description: "On turns automatic gain control on, off turns it off." }
    send: { address: "/Audio/Input/Agc", args: [ { value: "{enabled:bool01}", type: "int" } ] }
    returns: none

  set_deck_pause:
    summary: "Pause or play a deck's storage speed (\"/DeckA|DeckB/Pause\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      paused: { type: "bool", required: true, label: "Paused", description: "On pauses the deck's effects, off plays them." }
    send: { address: "/{deck:map.deck}/Pause", args: [ { value: "{paused:bool01}", type: "int" } ] }
    returns: none

  set_deck_speed_master:
    summary: "Set a deck's speed master, -20.0 to 20.0 (\"/DeckA|DeckB/SpeedMaster\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      speed: { type: "float", min: -20.0, max: 20.0, required: true, label: "Speed master", description: "Speed master from -20.0 to 20.0." }
    send: { address: "/{deck:map.deck}/SpeedMaster", args: [ { value: "{speed}", type: "float" } ] }
    returns: none

  set_deck_submaster:
    summary: "Set a deck's submaster, 0-255 (\"/DeckA|DeckB/Submaster\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      level: { type: "int", min: 0, max: 255, required: true, label: "Submaster", description: "Submaster level, 0 to 255." }
    send: { address: "/{deck:map.deck}/Submaster", args: [ { value: "{level}", type: "int" } ] }
    returns: none

  set_deck_filter:
    summary: "Set a deck's filter, 0-102 (\"/DeckA|DeckB/Filter\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      filter: { type: "int", min: 0, max: 102, required: true, label: "Filter", description: "Filter number from 0 (None) to 102 (SwapHVD5), as listed in MADRIX's filter menu." }
    send: { address: "/{deck:map.deck}/Filter", args: [ { value: "{filter}", type: "int" } ] }
    returns: none

  set_deck_filter_color_mode:
    summary: "Set a deck's filter color mode, 0-3 (\"/DeckA|DeckB/FilterColor/Mode\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      mode: { type: "int", min: 0, max: 3, required: true, label: "Filter color mode", description: "Filter color mode from 0 (Thru) to 3 (Ignore), as listed in MADRIX." }
    send: { address: "/{deck:map.deck}/FilterColor/Mode", args: [ { value: "{mode}", type: "int" } ] }
    returns: none

  set_deck_filter_color_global:
    summary: "Set a deck's filter color to a global color (\"/DeckA|DeckB/FilterColor/GlobalId\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      id: { type: "int", min: 1, max: 65535, required: true, label: "Global color", description: "Global color ID from the Color Kit, from 1." }
    send: { address: "/{deck:map.deck}/FilterColor/GlobalId", args: [ { value: "{id}", type: "int" } ] }
    returns: none

  set_deck_filter_color_channel:
    summary: "Set one channel of a deck's filter color, 0-255 (\"/DeckA|DeckB/FilterColor/Red|Green|Blue|White\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      channel: { type: "enum", values: ["red", "green", "blue", "white"], required: true, label: "Channel", description: "Color channel: red, green, blue or white." }
      value: { type: "int", min: 0, max: 255, required: true, label: "Value", description: "Channel value, 0 to 255." }
    send: { address: "/{deck:map.deck}/FilterColor/{channel:map.channel}", args: [ { value: "{value}", type: "int" } ] }
    returns: none

  set_deck_filter_color_rgb:
    summary: "Set a deck's filter color as red, green and blue (\"/DeckA|DeckB/FilterColor/Rgb\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      red: { type: "int", min: 0, max: 255, required: true, label: "Red", description: "Red, 0 to 255." }
      green: { type: "int", min: 0, max: 255, required: true, label: "Green", description: "Green, 0 to 255." }
      blue: { type: "int", min: 0, max: 255, required: true, label: "Blue", description: "Blue, 0 to 255." }
    send: { address: "/{deck:map.deck}/FilterColor/Rgb", args: [ { value: "{red}", type: "int" }, { value: "{green}", type: "int" }, { value: "{blue}", type: "int" } ] }
    returns: none

  select_deck_storage:
    summary: "Select a storage on a deck by index (\"/DeckA|DeckB/Storages/Index\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      index: { type: "int", min: 0, max: 255, required: true, label: "Storage", description: "Storage index, counted from 0 for storage 1." }
    send: { address: "/{deck:map.deck}/Storages/Index", args: [ { value: "{index}", type: "int" } ] }
    returns: none

  select_deck_place:
    summary: "Select a storage place on a deck by index (\"/DeckA|DeckB/Places/Index\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      index: { type: "int", min: 0, max: 255, required: true, label: "Storage place", description: "Storage place index, counted from 0 for place 1." }
    send: { address: "/{deck:map.deck}/Places/Index", args: [ { value: "{index}", type: "int" } ] }
    returns: none

  set_place_speed_pitch:
    summary: "Set the speed pitch of a deck's current storage place (\"/DeckA|DeckB/StoragePlace/SpeedPitch\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      pitch: { type: "float", min: -10.0, max: 10.0, required: true, label: "Speed pitch", description: "Speed pitch from -10.0 to 10.0." }
    send: { address: "/{deck:map.deck}/StoragePlace/SpeedPitch", args: [ { value: "{pitch}", type: "float" } ] }
    returns: none

  set_place_submaster:
    summary: "Set the submaster of a deck's current storage place, 0-255 (\"/DeckA|DeckB/StoragePlace/Submaster\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      level: { type: "int", min: 0, max: 255, required: true, label: "Submaster", description: "Submaster level, 0 to 255." }
    send: { address: "/{deck:map.deck}/StoragePlace/Submaster", args: [ { value: "{level}", type: "int" } ] }
    returns: none

  set_place_filter:
    summary: "Set the filter of a deck's current storage place, 0-102 (\"/DeckA|DeckB/StoragePlace/Filter\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      filter: { type: "int", min: 0, max: 102, required: true, label: "Filter", description: "Filter number from 0 (None) to 102 (SwapHVD5), as listed in MADRIX's filter menu." }
    send: { address: "/{deck:map.deck}/StoragePlace/Filter", args: [ { value: "{filter}", type: "int" } ] }
    returns: none

  set_place_chaser_state:
    summary: "Stop, pause or play the chaser of a deck's current storage place (\"/DeckA|DeckB/StoragePlace/Chaser/PlaybackState\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      state: { type: "enum", values: ["stopped", "paused", "playing"], required: true, label: "Playback state", description: "stopped, paused or playing." }
    send: { address: "/{deck:map.deck}/StoragePlace/Chaser/PlaybackState", args: [ { value: "{state:map.playback_state}", type: "int" } ] }
    returns: none

  set_place_chaser_speed_pitch:
    summary: "Set the chaser speed pitch of a deck's current storage place (\"/DeckA|DeckB/StoragePlace/Chaser/SpeedPitch\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      pitch: { type: "float", min: -10.0, max: 10.0, required: true, label: "Speed pitch", description: "Speed pitch from -10.0 to 10.0." }
    send: { address: "/{deck:map.deck}/StoragePlace/Chaser/SpeedPitch", args: [ { value: "{pitch}", type: "float" } ] }
    returns: none

  select_place_chaser_step:
    summary: "Go to a chaser step of a deck's current storage place (\"/DeckA|DeckB/StoragePlace/Chaser/Steps/Index\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      step: { type: "int", min: 0, max: 65535, required: true, label: "Step", description: "Chaser step index, counted from 0." }
    send: { address: "/{deck:map.deck}/StoragePlace/Chaser/Steps/Index", args: [ { value: "{step}", type: "int" } ] }
    returns: none

  set_layer_submaster:
    summary: "Set a layer's submaster, 0-255 (\"/DeckA|DeckB/StoragePlace/Layers/<n>/Submaster\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      layer: { type: "int", min: 0, max: 254, required: true, label: "Layer", description: "Layer index on the deck's current storage place, counted from 0 for the first layer." }
      level: { type: "int", min: 0, max: 255, required: true, label: "Submaster", description: "Submaster level, 0 to 255." }
    send: { address: "/{deck:map.deck}/StoragePlace/Layers/{layer}/Submaster", args: [ { value: "{level}", type: "int" } ] }
    returns: none

  set_layer_opacity:
    summary: "Set a layer's opacity, 0-255 (\"/DeckA|DeckB/StoragePlace/Layers/<n>/Opacity\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      layer: { type: "int", min: 0, max: 254, required: true, label: "Layer", description: "Layer index on the deck's current storage place, counted from 0 for the first layer." }
      level: { type: "int", min: 0, max: 255, required: true, label: "Opacity", description: "Opacity, 0 to 255." }
    send: { address: "/{deck:map.deck}/StoragePlace/Layers/{layer}/Opacity", args: [ { value: "{level}", type: "int" } ] }
    returns: none

  set_layer_blind:
    summary: "Blind or show a layer (\"/DeckA|DeckB/StoragePlace/Layers/<n>/Blind\")"
    params:
      deck: { type: "enum", values: ["a", "b"], required: true, label: "Deck", description: "Storage deck A or B." }
      layer: { type: "int", min: 0, max: 254, required: true, label: "Layer", description: "Layer index on the deck's current storage place, counted from 0 for the first layer." }
      blind: { type: "bool", required: true, label: "Blind", description: "On blinds the layer, off makes it visible." }
    send: { address: "/{deck:map.deck}/StoragePlace/Layers/{layer}/Blind", args: [ { value: "{blind:bool01}", type: "int" } ] }
    returns: none

  set_layer_solo:
