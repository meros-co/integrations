    summary: "Read a registered setup's description (HTTP GetSetupRegisterDescription=<id>)"
    params:
      id: { type: "int", min: 1, max: 65535, required: true, label: "Setup", description: "Registered setup ID, from 1." }
    send: { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: "GetSetupRegisterDescription={id}" }
    expect: { status: 200, matches: "(?s)^\\s*(.*?)\\s*$" }
    returns: value

  get_value:
    summary: "Read any value the HTTP Remote lists by its Get function, such as GetSoundLevel=0 (HTTP <function>)"
    params:
      function: { type: "string", max_length: 128, required: true, label: "Function", description: "A Get function from MADRIX's HTTP Remote Control list, with its argument after = where it takes one, such as GetFadeTime or GetCuelistDuration=1.", pattern: "^Get[A-Za-z0-9]+(=[A-Za-z0-9_]+)?$" }
    send: { endpoint: http, method: GET, path: /RemoteCommands/, raw_query: "{function}" }
    expect: { status: 200, matches: "(?s)^\\s*(.*?)\\s*$" }
    returns: value

