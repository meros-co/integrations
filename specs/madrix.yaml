quirks:
  - models: [all]
    severity: warning
    text: >
      OSC needs Enable Server, and state needs Enable Feedback, under Preferences > Remote Control
      > OSC; the HTTP commands and reads need the web server enabled under Preferences > Remote
      Control > HTTP. MADRIX sends feedback to the address that sends to it, on its Destination
      Network Port (the feedback_port setting, 9002 by default). Feedback is sent when a value
      changes and for /Main/FeedbackAll, which the session sends on connecting and every 60 s.
      OSC commands are not acknowledged and report unverified.
  - models: [all]
    severity: warning
    text: >
      The help lists the address space but not the feedback messages: the rules read each
      address's first argument, as the address takes it. Methods with no listed argument (Up,
      Down, Automatic, ToLeft, ToRight, ToCenter, Defaults, FeedbackAll) are sent without one.
      Layer, group, fader and trigger port numbers are placed in the address as plain decimals
      (/DeckA/StoragePlace/Layers/0/Opacity), the help writing them as [0 ... N-1]. State keys
      for decks are DeckA and DeckB, as the addresses name them.
  - models: [all]
    severity: info
    text: >
      Indexes over OSC start at 0 (cue lists, cues, timelines, segments, layers, groups,
      storages and places), IDs at 1 (global colors, markers, setup registers), and HTTP Remote
      numbers at 1 (storages, places, cue list items, layers). Group presets over OSC have "No
      Feedback Wanted". Ranges the help leaves open (indexes, offsets, BPM) are bounded here.
  - models: [all]
    severity: info
    text: >
      HTTP Remote Get functions answer the value as text; that the body is the value alone is
      inferred from the documentation's examples. The HTTP reads are polled every 2 s (current
      storages, places, layers, effect names, ticker texts, current cue, timeline duration) and
      every 60 s (version, host, matrix size, counts); names and descriptions are read on demand
      with the get_ commands. Sound levels, previews and thumbnails are left to get_value or are
      images this spec does not read. The JavaScript array functions are not parsed.
  - models: [all]
    severity: critical
    text: >
      load_setup_register loads another setup, and cue_list_delete_cue, cue_list_delete_all and
      the set_cue_ commands change the show's cue list; neither can be undone remotely.
      set_blackout and set_freeze act on the whole output at once.
