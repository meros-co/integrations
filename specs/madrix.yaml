    - address: "^/(DeckA|DeckB)/FilterColor/White$"
      state: { "decks.{1}.filter_color.white": "{arg0}" }
    - address: "^/(DeckA|DeckB)/Storages/Index$"
      state: { "decks.{1}.storage_index": "{arg0}" }
    - address: "^/(DeckA|DeckB)/Places/Index$"
