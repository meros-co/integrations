        required: true
        label: "Stereo input channel"
        description: "Stereo input channel from 1 to 4, two per stereo input: 1 is ST IN 1L, 2 ST IN 1R, 3 ST IN 2L, 4 ST IN 2R."
    send: get MIXER:Current/StInCh/ToSt/Pan {stereo_input:-1} 0
    expect:
      matches: '^OK get MIXER:Current/StInCh/ToSt/Pan \d+ \d+ (-?\d+)'
    returns: value
  set_fx_return_fader_level:
    summary: 'Set the FX return channel fader level (MIXER:Current/FxRtnCh/Fader/Level; fx_return = FX return channel from 1; level: hundredths of a dB, -32768 (-inf) to 1000 (+10 dB))'
    params:
      fx_return:
        type: int
        min: 1
        max: 4
        required: true
        label: "FX return channel"
        description: "FX return channel from 1 to 4, two per effect: 1 is FX1 L, 2 FX1 R, 3 FX2 L, 4 FX2 R."
      level:
        type: int
        min: -32768
        max: 1000
        required: true
        label: "Fader level"
        description: "Fader level in hundredths of a dB, from -32768 (-inf) to 1000 (+10.00 dB); 0 is 0 dB."
    send: set MIXER:Current/FxRtnCh/Fader/Level {fx_return:-1} 0 {level}
    expect:
      matches: '^OKm? set MIXER:Current/FxRtnCh/Fader/Level \d+ \d+ '
    returns: ack
  get_fx_return_fader_level:
    summary: 'Read the FX return channel fader level (MIXER:Current/FxRtnCh/Fader/Level); returns the raw value (hundredths of a dB, -32768 (-inf) to 1000 (+10 dB))'
    params:
      fx_return:
        type: int
        min: 1
        max: 4
