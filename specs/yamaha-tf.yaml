telemetry:
  # With the meters setting on, the meters of the console's meter list
  # (its mtrinfo answers) are asked for; notifications stop after 10
  # seconds unless asked again (DME7 document 2-16 p.22), so they are
  # asked again every 9.
  subscribe:
    send:
      - { when_set: meters, message: "mtrstart MIXER:Current/InCh/{settings.meter_point} {settings.meter_interval_ms}" }
      - { when_set: meters, message: "mtrstart MIXER:Current/StInCh/{settings.meter_point} {settings.meter_interval_ms}" }
      - { when_set: meters, message: "mtrstart MIXER:Current/FxRtnCh/{settings.meter_point} {settings.meter_interval_ms}" }
      - { when_set: meters, message: "mtrstart MIXER:Current/Mix/{settings.meter_point} {settings.meter_interval_ms}" }
      - { when_set: meters, message: "mtrstart MIXER:Current/Mtrx/{settings.meter_point} {settings.meter_interval_ms}" }
      - { when_set: meters, message: "mtrstart MIXER:Current/St/{settings.meter_point} {settings.meter_interval_ms}" }
      - { when_set: meters, message: "mtrstart MIXER:Current/Mono/{settings.meter_point} {settings.meter_interval_ms}" }
    every_ms: 9000
  poll:
    send:
      - devinfo productname
      - devinfo devicename
      - devstatus runmode
      - sscurrent_ex scene_a
      - sscurrent_ex scene_b
      - get MIXER:Current/InCh/Fader/Level 0 0
      - get MIXER:Current/InCh/Fader/Level 1 0
      - get MIXER:Current/InCh/Fader/Level 2 0
      - get MIXER:Current/InCh/Fader/Level 3 0
