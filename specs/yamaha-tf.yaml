  updates:
    # Meters (NOTIFY mtr): two hexadecimal digits a meter, in the order
    # of the console's channels (DME7 document 3.2.3 p.10, 5.1 p.50).
    - match: '^NOTIFY mtr MIXER:Current/(?:Meter/)?InCh(?:/[A-Za-z]+)? [a-z][a-z0-9+]*((?: [0-9A-Fa-f]{2})+)\s*$'
      match_each: '([0-9A-Fa-f]{2})'
      match_each_in: 1
      state:
        inputs.{index:+1}.meter: '{2:hex}'
        inputs.{index:+1}.meter_db: '{2:hex:from.yamaha_meter}'
    - match: '^NOTIFY mtr MIXER:Current/(?:Meter/)?StInCh(?:/[A-Za-z]+)? [a-z][a-z0-9+]*((?: [0-9A-Fa-f]{2})+)\s*$'
      match_each: '([0-9A-Fa-f]{2})'
      match_each_in: 1
      state:
        stereo_inputs.{index:+1}.meter: '{2:hex}'
        stereo_inputs.{index:+1}.meter_db: '{2:hex:from.yamaha_meter}'
    - match: '^NOTIFY mtr MIXER:Current/(?:Meter/)?FxRtnCh(?:/[A-Za-z]+)? [a-z][a-z0-9+]*((?: [0-9A-Fa-f]{2})+)\s*$'
      match_each: '([0-9A-Fa-f]{2})'
      match_each_in: 1
      state:
        fx_returns.{index:+1}.meter: '{2:hex}'
        fx_returns.{index:+1}.meter_db: '{2:hex:from.yamaha_meter}'
    - match: '^NOTIFY mtr MIXER:Current/(?:Meter/)?Mix(?:/[A-Za-z]+)? [a-z][a-z0-9+]*((?: [0-9A-Fa-f]{2})+)\s*$'
      match_each: '([0-9A-Fa-f]{2})'
      match_each_in: 1
      state:
        mixes.{index:+1}.meter: '{2:hex}'
        mixes.{index:+1}.meter_db: '{2:hex:from.yamaha_meter}'
    - match: '^NOTIFY mtr MIXER:Current/(?:Meter/)?Mtrx(?:/[A-Za-z]+)? [a-z][a-z0-9+]*((?: [0-9A-Fa-f]{2})+)\s*$'
      match_each: '([0-9A-Fa-f]{2})'
      match_each_in: 1
      state:
        matrices.{index:+1}.meter: '{2:hex}'
        matrices.{index:+1}.meter_db: '{2:hex:from.yamaha_meter}'
    - match: '^NOTIFY mtr MIXER:Current/(?:Meter/)?St(?:/[A-Za-z]+)? [a-z][a-z0-9+]*((?: [0-9A-Fa-f]{2})+)\s*$'
      match_each: '([0-9A-Fa-f]{2})'
      match_each_in: 1
      state:
        stereo.{index:+1}.meter: '{2:hex}'
        stereo.{index:+1}.meter_db: '{2:hex:from.yamaha_meter}'
    - match: '^NOTIFY mtr MIXER:Current/(?:Meter/)?Mono(?:/[A-Za-z]+)? [a-z][a-z0-9+]*((?: [0-9A-Fa-f]{2})+)\s*$'
      match_each: '([0-9A-Fa-f]{2})'
      match_each_in: 1
      state:
        mono.meter: '{2:hex}'
        mono.meter_db: '{2:hex:from.yamaha_meter}'
    # Scene titles (ssinfo_ex, DME7 document 3-19 p.31), read on connecting
    # and again for a scene stored or made current.
    - match: '^OK ssinfo(?:_ex)? scene_([ab]) (\d+) "((?:[^"\\]|\\.)*)" "((?:[^"\\]|\\.)*)" "((?:[^"\\]|\\.)*)" (\w+)\s*$'
      state:
        scenes.{1}.list.{2}.number_text: '{3}'
        scenes.{1}.list.{2}.title: '{4}'
        scenes.{1}.list.{2}.comment: '{5}'
        scenes.{1}.list.{2}.attribute: '{6}'
    - match: '^(?:OK|NOTIFY) (?:sscurrent_ex|ssrecall_ex|ssupdate_ex) scene_([ab]) "?(\d+)"?(?: .*)?$'
      then_send: ['ssinfo_ex scene_{1} {2}']
    - match: ^OK devinfo productname "?([^"]*?)"?\s*$
      state:
        device.product_name: '{1}'
    - match: ^OK devinfo devicename "?([^"]*?)"?\s*$
      state:
        device.name: '{1}'
    - match: ^(?:OK|NOTIFY) devstatus runmode "?([a-z]+)"?\s*$
      state:
        device.run_mode: '{1}'
    - match: '^OK sscurrent_ex scene_([ab]) "?([0-9.]+)"?(?: .*)?$'
      state:
        scenes.{1}.current: '{2}'
    - match: '^NOTIFY sscurrent_ex scene_([ab]) "?([0-9.]+)"?(?: .*)?$'
      state:
        scenes.{1}.current: '{2}'
      then_send:
