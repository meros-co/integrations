    returns: value
  store_scene:
    summary: Store the console's current settings as a scene of scene list A or B, 1-99, overwriting it
      (ssupdate_ex scene_a|scene_b)
    params:
      bank:
        type: enum
        values:
          - a
          - b
        required: true
        label: Scene list
        description: "Scene list to store into: A or B."
      scene:
        type: int
        min: 1
        max: 99
        required: true
        label: Scene
        description: "Scene number in the list, 1 to 99 as shown on the console; whatever the scene held is replaced."
    send: ssupdate_ex scene_{bank} {scene}
    expect:
      matches: ^OK ssupdate_ex scene_[ab]
    returns: ack
  recall_next_scene:
    summary: Recall the scene after the current one in the active scene list (event MIXER:Lib/Scene/RecallInc)
    send: event MIXER:Lib/Scene/RecallInc
    expect:
      matches: ^OK event MIXER:Lib/Scene/RecallInc
    returns: ack
  recall_previous_scene:
    summary: Recall the scene before the current one in the active scene list (event MIXER:Lib/Scene/RecallDec)
    send: event MIXER:Lib/Scene/RecallDec
    expect:
      matches: ^OK event MIXER:Lib/Scene/RecallDec
    returns: ack
  set_parameter:
    summary: Set any numeric parameter by its RCP address (raw value, as the console's parameter list
      gives it); x and y are sent as given, numbered from 0, and 0 where the address has no X or Y
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
        label: Address
        description: "RCP parameter address as in the console's parameter list, e.g. MIXER:Current/InCh/Fader/Level."
      x:
        type: int
        min: 0
        required: true
        label: X index
        description: "First index of the address (usually the channel), numbered from 0; 0 where the address has no X."
      y:
        type: int
        min: 0
        required: true
        label: Y index
        description: "Second index of the address (e.g. a mix or band), numbered from 0; 0 where the address has no Y."
      value:
        type: int
        required: true
        label: Value
        description: "Raw integer value as the console's parameter list gives it, e.g. hundredths of a dB for levels."
    send: set {address} {x} {y} {value}
    expect:
      matches: '^OKm? set \S+ \d+ \d+ '
    returns: ack
  set_parameter_text:
    summary: Set any text parameter (name, colour, type) by its RCP address; the value is sent double-quoted
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
        label: Address
        description: "RCP parameter address as in the console's parameter list, e.g. MIXER:Current/InCh/Fader/Level."
      x:
        type: int
        min: 0
        required: true
        label: X index
        description: "First index of the address (usually the channel), numbered from 0; 0 where the address has no X."
      y:
        type: int
        min: 0
        required: true
        label: Y index
        description: "Second index of the address (e.g. a mix or band), numbered from 0; 0 where the address has no Y."
      value:
        type: string
        pattern: ^[ -~]*$
        required: true
        label: Value
        description: "Text value to set, such as a name or a colour or type keyword, printable ASCII."
    send: set {address} {x} {y} {value:json}
    expect:
      matches: '^OKm? set \S+ \d+ \d+ '
    returns: ack
  get_parameter:
    summary: Read any parameter by its RCP address; returns the value as sent, a text value with its quotes
    params:
      address:
        type: string
        max_length: 128
        pattern: ^[A-Za-z]+:[A-Za-z0-9/]+$
        required: true
        label: Address
        description: "RCP parameter address as in the console's parameter list, e.g. MIXER:Current/InCh/Fader/Level."
      x:
        type: int
        min: 0
        required: true
        label: X index
        description: "First index of the address (usually the channel), numbered from 0; 0 where the address has no X."
      y:
        type: int
        min: 0
        required: true
        label: Y index
        description: "Second index of the address (e.g. a mix or band), numbered from 0; 0 where the address has no Y."
    send: get {address} {x} {y}
    expect:
      matches: ^OK get \S+ \d+ \d+ (.*?)\s*$
    returns: value
  get_product_name:
    summary: Read the product name (devinfo productname)
    send: devinfo productname
    expect:
      matches: ^OK devinfo productname "?([^"]*?)"?\s*$
    returns: value
  get_device_name:
    summary: Read the device name the user assigned (devinfo devicename)
    send: devinfo devicename
    expect:
      matches: ^OK devinfo devicename "?([^"]*?)"?\s*$
    returns: value
  get_run_mode:
    summary: 'Read the run mode (devstatus runmode): normal, emergency, booting or update'
    send: devstatus runmode
    expect:
      matches: ^OK devstatus runmode "?([a-z]+)"?
    returns: value
  set_keepalive:
    summary: Ask the console to close the connection if nothing (a command or a lone LF) arrives for interval_ms
      milliseconds (scpmode keepalive; more than 1000)
    params:
      interval_ms:
        type: int
        min: 1001
        required: true
        label: Interval
        description: "Milliseconds of silence after which the console closes the connection; more than 1000."
    send: scpmode keepalive {interval_ms}
    expect:
      matches: ^OK scpmode keepalive
    returns: ack

quirks:
  - models:
      - all
    severity: critical
    text: >-
      Yamaha publishes no remote control protocol specification for its mixing consoles. For TF, Yamaha's
      QLab Setup Guide and Python Script Template document TCP port 49280, LF-terminated commands, scene
      recall (ssrecall_ex scene_a / scene_b) and set of the input channel fader level, ON key and pan
      to stereo. The rest of the protocol is taken from Yamaha's RCP specifications for the DME7 and the
      RM series, which describe the same text protocol on TCP 49280 for other products: get and its "OK
      get <address> <x> <y> <value>" reply, "OK set ..." and "OKm set ..." (the value was clamped into
      range) acknowledgements, "ERROR <command> <code>" failures, "NOTIFY set" pushes, devinfo, devstatus
      and scpmode keepalive. That the consoles behave this way is corroborated by the MIT-licensed Bitfocus
      Companion module, not by Yamaha; treat those parts as unconfirmed until bench-tested.
  - models:
      - all
    severity: warning
    text: >-
      Every typed address other than the input channel fader level, ON key and pan to stereo comes from
      a TF console's own parameter list (its prminfo answers), recorded in the MIT-licensed Bitfocus Companion
      module's schemas/TF Parameters-1.txt, not from a Yamaha document. The list proves the address, its
      X and Y counts and its range existed on the console it was read from (firmware not stated); what
      each X, Y and value means is inferred from the console's screens and the RIVAGE PM and DM7 conventions,
      so each family is listed for a console check. Channel counts are the family's largest (40 inputs,
      4 stereo input channels, 4 FX return channels, 20 mixes, 4 matrices, 8 DCAs, 6 mute groups).
  - models:
      - all
    severity: info
    text: >-
      Numbering taken from the parameter list's counts: StInCh has 4 channels, taken as ST IN 1L, 1R, 2L
      and 2R; FxRtnCh has 4, taken as FX1 L, FX1 R, FX2 L and FX2 R; St has 2 (ST L, ST R) and Mono 1.
      MuteMaster 1-6 are the mute groups. The list also holds ToStereo/Pan beside ToSt/Pan on input and
      FX return channels, both read-write; ToSt/Pan is typed, as in Yamaha's command list, and ToStereo/Pan
      is taken as an alias. Pan modes, channel roles and bus types are read-only and not typed.
  - models:
      - all
    severity: warning
    text: >-
      X and Y are numbered from 0 on the wire (Yamaha's command list: X 0 = input channel 1), while Yamaha's
      OSC documents number them from 1. Typed commands take channel, mix, band and other numbers from
      1 and subtract one; set_parameter, set_parameter_text and get_parameter send x and y exactly as
      given. A parameter without an X or Y dimension still takes both, sent as 0.
  - models:
      - all
    severity: warning
    text: >-
      Every line ends with LF (0x0A); a lone LF is accepted as a heartbeat. Text values travel in double
      quotes with \" and \\ escapes (DME7 spec 3.1 p.8) and must be ASCII. Names and other text telemetry
      are stored as received, inside the quotes, so an escaped quote stays escaped. A set outside the
      parameter's range is clamped by the device and acknowledged "OKm"; typed commands range-check first,
      but set_parameter does not. Failures arrive as "ERROR <command> <code>" with codes UnknownCommand,
      WrongFormat, InvalidArgument, UnknownAddress, TooLongCommand, AccessDenied, Busy, ReadOnly, NoPermission,
      Overload, Overflow, InternalError and others (DME7 spec 3.5.1 p.38).
  - models:
      - all
    severity: info
    text: >-
      Values are raw integers, not dB: fader and send levels are hundredths of a dB from -32768 (-inf)
      to 1000 (+10.00 dB), pans -63 (L63) to 63 (R63), frequencies tenths of a Hz, Q thousandths. Yamaha's
      fader table lists the values the console steps through; the console accepts any value in range.
  - models:
      - all
    severity: info
    text: >-
      Parameter changes made on the console or by another controller are pushed as "NOTIFY set <address>
      <x> <y> <value> ..." lines (DME7 spec 3.2.2 p.10, 4.8 p.49), which the telemetry rules apply. The
      DME7 specification says parameters changed by a snapshot recall are not individually notified (p.10);
      whether a console scene recall pushes every changed parameter is not documented. State read on connecting
      can therefore be stale after a scene recall until the values are read again.
  - models:
      - all
    severity: info
    text: >-
      On connecting, the telemetry poll reads the main settings of every channel of the largest model
      in the family (fader levels, ON keys, pans to stereo, mute groups, and names and colours where those
      are typed), one query at a time; sends, icons, categories, balances and pan links are kept current
      by NOTIFY set pushes and by their get commands, not read on connecting. A smaller model answers the queries for channels it lacks with
      ERROR, which leaves no state. Channel limits in typed commands are likewise the family's largest;
      a channel the model lacks is refused by the console with ERROR.
  - models:
      - all
    severity: info
    text: >-
      scpmode keepalive makes the console close the connection itself when it hears nothing for the given
      time (the DME7 document adds one second), freeing the slot after a controller vanishes; without
      it a half-open connection can block new ones (DME7 spec 2-8 p.15). After it is set the controller
      must send something, a command or a lone LF, within the interval, which this spec cannot schedule;
      use it only where the host sends traffic regularly.
  - models:
      - all
    severity: warning
    text: >-
      Requires TF firmware V2.00 or later (Readme_EN.pdf). The controller connects to the console's static
      IP address set under NETWORK (QLab guide p.7).
  - models:
      - all
    severity: warning
    text: >-
      TF has two scene lists, A and B, each numbered 0-99 (command_list.pdf). Yamaha's documents give
      no query for the current scene; get_current_scene (sscurrent_ex scene_a|scene_b) and its replies
      rest on the RCP grammar and the Companion module, whose author notes that only one list is active
      and the query for the other list is answered with an error. devstatus error is not used on TF by
      that module either, so it is left out here.
  - models:
      - all
    severity: critical
    text: >-
      A scene recall changes the live mix at once, subject to the console's recall safe and focus settings.
  - models:
      - all
    severity: info
    text: >-
      Yamaha's command list gives TF5 and TF3 input channels 0-39 and TF1 and TF-RACK 0-31; these are
      taken as written. The QLab guide prints the address as "Inch" (p.19); the command list and scripts
      use "InCh", sent here.
  - models:
      - all
    severity: info
    text: >-
      Colour and icon names are Companion's (rcpNames.json chColorsTF and chIcons), not a Yamaha
      list; the module's list spells one icon "Wedge " with a trailing space, sent here as Wedge.
      The list types Label/Icon and Label/Category as binary but the Companion module sends and
      reads them as quoted text, as here; category names are not listed, so category is free text.
      The list allows names of up to 64 characters (mute group names 8).
  - models:
      - all
    severity: info
    text: >-
      PrePost is taken as 1 PRE and 0 POST, as Yamaha documents for RIVAGE PM; the TF list gives
      only the range 0-1. ToMono has a single destination, so it has no Y. Send pan applies when the
      destination mix is stereo.
  - models:
      - all
    severity: warning
    text: >-
      The console's parameter list has no head-amp gain, phantom power, HPF, EQ, dynamics, delay,
      insert, DCA assignment or mute group assignment address: only levels, ON keys, pans, sends,
      labels and mute masters. These cannot be read or changed over RCP on the firmware the list was
      taken from, an API limit rather than a gap; they remain operable on the console and in TF
      Editor.
  - models:
      - all
    severity: critical
    text: >-
      recall_next_scene and recall_previous_scene (event MIXER:Lib/Scene/RecallInc and RecallDec)
      recall a scene of the active list at once, like recall_scene. The console's own scninfo list
      names both; the event form is Yamaha's for the DM7 (and is how the Companion module sends
      them).
  - models:
      - all
    severity: info
    text: >-
      A NOTIFY sscurrent_ex (the current scene changed, from the console or another controller) has
      the console's connect-time settings read again, since Yamaha's DME7 document says parameters
      changed by a recall are not notified one by one; the Companion module re-reads the console on
      the same push. Settings not read on connecting are not re-read and can be stale after a recall
      until read with their get commands.
  - models:
      - all
    severity: info
    text: >-
      prmnum and prminfo <index> (the DME7 document's 3-14 and 3-15, also implemented by the RM
      series) appear to be answered by the consoles: the Companion module's parameter list is a
      console's prminfo answers. They are not typed here and no runtime catalogue is built from
      them; get_parameter cannot send them because they take no address. Meters are kept in state with the meters setting on: Yamaha documents no console meter
      addresses, so they are the console's own meter list (its mtrinfo answers, as recorded in the
      Companion module's dump), asked for with mtrstart without the Meter segment as the Companion
      module sends it; the notification's layout (a type word, then one two-digit hexadecimal value per
      channel) and the dB table are the DME7 document's (3.2.3 p.10, 5.1 p.50), not a console document's. Scene titles are read with ssinfo_ex, as the Companion
      module reads them for the current scene; the reply's layout is the DME7 document's ssinfo_ex (3-19
      p.31).
  - models:
      - all
    severity: critical
    text: >-
      store_scene (ssupdate_ex scene_a|scene_b <number>) overwrites the scene at once with the console's
      current settings, and the scene's previous contents cannot be recovered over RCP. The console's own
      scninfo list names MIXER:Lib/Bank/Scene/Store (two lists, 0-100); the command form is the Companion
      module's, not a Yamaha document's, and its reply is taken to repeat the command after OK. Scene 0 is
      the console's read-only initial scene, so the range here starts at 1 and ends at 99, as for recall.

