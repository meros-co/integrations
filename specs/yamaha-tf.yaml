# Yamaha TF1/TF3/TF5/TF-RACK over Yamaha's Remote Control Protocol (RCP): text lines on TCP 49280.
#
# One of five console specs sharing command and state naming: yamaha-cl-ql, yamaha-tf,
# yamaha-rivage, yamaha-dm7, yamaha-dm3. TF differs from CL/QL in its two scene lists
# (scene_a, scene_b).
#
# Yamaha documents only scene recall and the input channel fader level, ON key and pan over this
# protocol for TF (QLab Setup Guide and its Python Script Template). The other typed commands take
# their addresses, dimensions and ranges from the console's own parameter list (its answers to
# prminfo) as recorded in the MIT-licensed Bitfocus Companion module, and each is listed for a
# console check in VERIFICATION.md. Every other parameter is reachable through set_parameter,
# set_parameter_text and get_parameter.

spec: 1
id: yamaha-tf
name: Yamaha TF series digital mixing consoles (Remote Control Protocol, TCP 49280)
vendor: Yamaha
category: mixer

source:
  - title: QLab Setup Guide for CL/QL/TF Series, v1.0 (August 2019)
    author: Yamaha Corporation
    url: https://download.yamaha.com/files/tcm:39-1286035
    note: >-
      Manufacturer document. Console IP set in NETWORK > FOR MIXER CONTROL on CL/QL, static IP on TF,
      LAN port not Dante port (p.6-7); scene recall and input channel ON, pan and fader commands (p.12-15,
      p.17-19); fader value table (p.15). Its p.19 prints the address as "Inch"; the command list and
      the scripts spell it "InCh".
  - title: Python Script Template V1.00 for CL/QL/TF (command_list.pdf, Readme_EN.pdf, command.py, recall.py,
      recall_a.py, TFxQLab/MultiCh.py)
    author: Yamaha Corporation
    url: https://usa.yamaha.com/files/download/other_assets/0/1266290/Python_Script_Template_V100.zip
    note: >-
      Manufacturer files linked from the QLab guide (p.5). command_list.pdf: "List of available commands"
      (ssrecall_ex MIXER:Lib/Scene 0-300 for CL/QL, ssrecall_ex scene_a / scene_b 0-99 for TF, set MIXER:Current/InCh/Fader/Level,
      Fader/On and ToSt/Pan with X 0 = input channel 1 and the per-model channel ranges). command.py:
      TCP port 49280, each command followed by LF. Readme_EN.pdf: CL/QL V3.11 or later, TF V2.00 or later.
  - title: DME7 Remote Control Protocol Specifications, Version 1.1.0 rev2 (V1.1.0 of Jan. 25, 2024; applies
      to DME7 V1.1.0 and later)
    author: Yamaha Corporation
    url: https://usa.yamaha.com/files/download/other_assets/4/2230684/DME7-remote-V110_en.pdf
    note: >-
      Manufacturer document for the RCP grammar, written for the DME7 processor, not for the consoles.
      Used here for what Yamaha's console documents leave out: 3.1 basic syntax p.8 (each command ends
      with LF; a lone LF is a heartbeat; options separated by at least one space; text options in double
      quotes with \\ and \" escapes; ASCII only); 3.2.1 NOTIFY devstatus p.9; 3.2.2 NOTIFY set p.10; 3.3.1
      devstatus runmode/error p.13; 3.3.3 scpmode keepalive p.15; 3.3.4 get / OK get p.16; 3.3.5 set /
      OK set / OKm (value clamped) p.18; 3.4.1 devinfo productname/devicename p.25-26; 3.5.1 ERROR <command>
      <code> and the error codes p.38.
  - title: RM Series (RM-CR/RM-CG/RM-TT/RM-WAP) Remote Control Protocol Specifications, Version 3.0.0
      (Oct. 1, 2025)
    author: Yamaha Corporation
    url: https://download.yamaha.com/files/tcm:39-1525882
    note: >-
      Manufacturer document; the same RCP grammar as the DME7 document (3.1 p.7, NOTIFY set p.8), cited
      as a second Yamaha statement of it. It describes the RM series, not the consoles.
  - title: companion-module-yamaha-rcp, v3.6.0 (Bitfocus Companion module; MIT licence)
    author: Andrew Broughton (community, not Yamaha)
    url: https://github.com/bitfocus/companion-module-yamaha-rcp
    note: >-
      Community code, read for corroboration only (top-level LICENSE is MIT). It confirms that the consoles
      answer RCP on TCP 49280 with LF-terminated lines, accept get and set with X and Y numbered from
      0 (paramFuncs.js parseOptions subtracts 1), reply OK/OKm and push NOTIFY set, answer devinfo productname/devicename
      and devstatus runmode (variables.js), and push NOTIFY sscurrent_ex (index.js). Nothing in this spec
      rests on it alone except where a quirk says so.
  - title: companion-module-yamaha-rcp, v4.0.1, schemas/TF Parameters-1.txt and rcpNames.json (Bitfocus
      Companion module; MIT licence)
    author: Andrew Broughton (community, not Yamaha)
    url: https://github.com/bitfocus/companion-module-yamaha-rcp/tree/v4.0.1/schemas
    note: >-
      Read as data, not code (top-level LICENSE is MIT). "TF Parameters-1.txt" is a TF console's answers
      to prminfo, scninfo and mtrinfo: for each parameter its index, address, X and Y counts, minimum, maximum,
      default, unit, type, access (rw, r, w) and scale (prminfo 0-107, scninfo 1000-1011, mtrinfo 2000-2103).
      It is the source of every typed address here beyond the input fader, ON and pan, with their dimensions
      and ranges. rcpNames.json gives the colour and icon names (chColorsTF, chIcons). src/paramFuncs.ts
      shows scene store sent as ssupdate_ex and RecallInc/RecallDec sent as event; src/index.ts re-reads
      the console after NOTIFY sscurrent_ex. The firmware version of the dump is not stated.

transport:
  type: line-tcp
  port: 49280
  framing: terminated
  terminator: lf
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  reply_match: '^(OK|OKm|ERROR) '
  probe: devstatus runmode

ports:
  - { port: 49280, protocol: tcp, role: control }

