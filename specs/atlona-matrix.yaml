       set_comma_wait, get_comma_wait, set_display_button, get_display_button, set_front_panel_lock,
       set_8021x, get_8021x, set_dhcp, get_dhcp, set_static_ip, get_network,
       set_analog_audio, get_analog_audio, set_hdmi_5v_keep, get_hdmi_5v_keep,
       set_repeat, get_repeat, set_repeat_count, get_repeat_count, send_display_serial,
       set_host_name, get_host_name, factory_reset, get_model, get_firmware]
    verification: none
    notes: >
      Inputs 1 USB-C, 2 HDMI 1, 3 HDMI 2 to output 1; the HDMI and HDBaseT
