spec: 1
id: atlona-matrix
name: Atlona matrix switchers and switchers (AT-UHD-PRO3, AT-HDR-H2H, Omega)
vendor: Atlona
category: router

# Atlona's Telnet/RS-232 command API as its HDMI/HDBaseT matrices and Omega
# switchers speak it: one grammar (case-sensitive words, a CR after each
# command, CR LF after each answer, "Command FAILED" for anything refused, an
# echo of the command as its answer, "sta" in place of a value to read it,
# x<in>AVx<out> to route and Status to read the routing), with each model's
# document listing its own subset and number ranges. Every model below
# supports only the commands its own API document lists. Commands are
# transcribed from those documents' tables; page numbers are their printed
# numbers.
#
# Not here: the multi-output route form (x3AVx2,x4,x7: route repeats it one
# output at a time, and its echo names the input once), help, IPQuit (it ends
# the session this spec keeps), the AT-OME-MH21's SetCmd and IRSetCmd (their
# syntax and examples disagree in Atlona's document, see the quirks), the
# TCP proxy ports 9001-9004 (raw pass-through to the RS-232 ports of the unit
# and its HDBaseT endpoints, not control of the switcher), and the
# AT-OME-MS52W, whose API is a different, JSON-answering command set.
source:
  - title: "AT-UHD-PRO3-44M Application Programming Interface, firmware 16.1.19 (version 1, November 2018), 40246-R2"
    author: Atlona Inc.
    url: https://atlona.com/pdf/AT-UHD-PRO3-44M_API.pdf
    note: >
      Manufacturer document (retrieved from the Internet Archive's copy of
      Atlona's URL, web.archive.org/web/20230927023138, since Atlona's PDF
      host refuses non-browser clients). Command list and the CR / CR LF
      note p.2-3; All#, Blink, Broadcast (changes made in the web GUI are
      sent to the control system when on), Clear, CSpara, EDIDMSet (inputs
      1-4), EDIDOut (outputs 1-4), HTTPPort, IPAddUser, IPCFG, IPChangePass,
      IPDelUser, IPDHCP, IPLogin (on by default, prompts for user name and
      password), IPPort, IPStatic, IPTimeout (300 s default), IROFF, IRON,
      Lock, MirrorHdmi (HDMI output 5, HDBaseT Out1-Out4), Mreset, PWOFF,
      PWON, PWSTA, Recall and Save (presets 1-50), RS232para, RS232zone
      (zones 1-4), sddp_announce, set_host_name, show_host_name, Status,
      Statusx (outputs 1-5), syslock (SSH only), Type, Unlock, UnMirror,
      Version, VOUT (-79 to 15 dB, + and -), VOUTMute (zones 1-4), x?$
      (channels 1-4), x?All, x?AVx? (inputs 1-4, outputs 1-5) p.4-21.
  - title: "AT-UHD-PRO3-66M Application Programming Interface, firmware 16.1.0 (version 1, 11/18), 40247-R2"
    author: Atlona Inc.
    url: https://atlona.com/pdf/AT-UHD-PRO3-66M_API.pdf
    note: >
      Manufacturer document (Internet Archive copy, 20231128233328). The
      44M's command set with inputs 1-6, HDBaseT outputs 1-5 and 7, HDMI
      outputs 6 and 8, EDIDOut outputs 1-8, x?$ channels 1-8.
  - title: "AT-UHD-PRO3-88M Application Programming Interface, firmware 16.1.0 (version 1, 11/18), 40248-R2"
    author: Atlona Inc.
    url: https://atlona.com/pdf/AT-UHD-PRO3-88M_API.pdf
    note: >
      Manufacturer document (a reseller's copy of Atlona's PDF,
      images.webfronts.com/cache/frfkymufprsw.pdf). The same set with
      inputs 1-8, HDBaseT outputs 1-7 and 9, HDMI outputs 8 and 10 mirroring
      an HDBaseT output, Status example x1AVx1,...,x8AVx9,x8AVx10 p.18,
      Statusx outputs 1-10, x?$ channels 1-10.
  - title: "AT-UHD-PRO3-1616M Application Programming Interface, firmware 16.1.0 (version 1, 11/18), 40245-R2"
    author: Atlona Inc.
    url: https://atlona.com/pdf/AT-UHD-PRO3-1616M_API.pdf
    note: >
      Manufacturer document (Internet Archive copy, 20241214195932). Inputs
      1-16, HDBaseT outputs 1-16, HDMI outputs 17-20; CSpara takes the baud
      rate alone (CSpara[19200]) and RS232para a zone and baud rate
      (RS232para3[115200]) p.6 and p.16.
  - title: "AT-HDR-H2H-88MA Application Programming Interface (version 2, March 2023), 40164-R2"
    author: Atlona Inc.
    url: https://atlona.com/pdf/AT-HDR-H2H-88MA_API.pdf
    note: >
      Manufacturer document (Internet Archive copy, 20251128184640). RS-232,
      TCP/IP, Telnet 23 and SSH 22; "Command FAILED:" followed by the
      command p.4; All# (answered with the routes), Blink, Broadcast, Clear
      and Recall and Save (presets 1-8), CSpara, EDIDMSet (default, save1-8,
      int1-14, with the internal EDID table), EDIDOut memN, HDCPSet,
      IPAddUser, IPCFG, IPDelUser, IPDHCP, IPLogin, IPPort, IPStatic,
      IPTimeout (1-3600 s), IROFF, IRON, IRSTA, Lock, Mreset, PWOFF, PWON,
      PWSTA, Status (x1AVx2, x2AVx3, ...), System sta, Telnet, TrigCEC,
      Type, Unlock, VersionMCU, VOUTMute (1-8), x?All, x?$, x?AVx& p.4-15.
  - title: "AT-OME-MS42 Application Programming Interface, firmware 1.1.4 (version 5, June 2025), 40137-R4"
    author: Atlona Inc.
    url: https://atlona.com/pdf/AT-OME-MS42_API.pdf
    note: >
      Manufacturer document (Internet Archive copy, 20251126205323). RS-232,
      Telnet, SSH or TCP; 500 ms between commands; Telnet 23; TCP 9000 (MCU,
      like Telnet), 9001 (HDBaseT RS-232), 9002 (local RS-232); RS-232
      115200 8N1 p.2-3; Blink, DispBtn, InputStatus (InputStatus 0100),
      IP802.1x, IPCFG, IPDHCP, IPStatic, Lock, LRAUD, Mreset,
      OutHdmi5vKeep, PWOFF, PWON, PWSTA, Reboot, RepCmdTime, RepeatCmd,
      RS232zone, Status (x2AVx1,x2AVx2), Type, Unlock, USBHostLogic,
      USBHostRoute, UsbVbusControl, Version, VOUTMute (1 HDMI, 2 HDBaseT),
      xY$, xYAVxZ (inputs 1 USB-C, 2 DisplayPort, 3-4 HDMI; feedback
      x3AVx1, x3AVx2) p.5-15.
  - title: "AT-OME-PS62 Application Programming Interface (version 4, October 2021, firmware 1.2.1), 40116-R4"
    author: Atlona Inc.
    url: https://atlona.com/pdf/AT-OME-PS62_API.pdf
    note: >
      Manufacturer document (Internet Archive copy, 20220626211530). RS-232,
      Telnet, SSH or TCP; 500 ms between commands; TCP 9000-9004; RS-232
      115200 8N1 p.2-3; All#, AUD, Blink, CommaWait (on by default),
      InputStatus, IPCFG, IPDHCP, IPStatic, Lock, Mreset (no feedback, the
      unit restarts), RepeatCmd, RepCmdTime, RS232para, RS232zone (1-3),
      SetMono, Status, Type, Unlock, UsbMode (0-2), UsbRoute (1-6), Version,
      VOUT (zones 1-4, -90 to 10, +, -, sta), VOUTMute (1-4), x?All (inputs
      1-6), x?AVx& (outputs 1-2) p.4-12.
  - title: "AT-OME-SW32 Application Programming Interface (version 4, January 2021)"
    author: Atlona Inc.
    url: https://atlona.com/pdf/AT-OME-SW32_API.pdf
    note: >
      Manufacturer document (Internet Archive copy, 20240511174100). RS-232,
      SSH or Telnet, 500 ms between commands, RS-232 115200 8N1 p.2; Blink,
      CommaWait, DispBtn (on, off, tog, mute, vol+, vol-), InputStatus,
      IP802.1x, IPCFG, IPDHCP, IPStatic, Lock, LRAUD, Mreset, PWOFF, PWON,
      PWSTA, RepCmdTime, RepeatCmd, RS232zone, Status (x3Vx1, x1Vx2), Type,
      Unlock, Version, VOUTMute (1-2), x?$, x?AVx& (inputs 1-3, outputs
      1-2) p.3-10. Its introduction names the AT-OME-RX21, a copy error.
  - title: "AT-OME-ST31A Application Programming Interface, firmware 1.0.05 (version 3, March 2023), 40123-R3"
    author: Atlona Inc.
    url: https://atlona.com/pdf/AT-OME-ST31A_API.pdf
    note: >
      Manufacturer document (Internet Archive copy, 20230605000835). RS-232
      9600 8N1 p.2; RS-232 or Telnet, 500 ms between commands p.3; Blink,
      CommaWait, DispBtn, InputStatus (InputStatus 010), IP802.1x, IPCFG,
      IPDHCP, IPStatic, Lock, LRAUD, Mreset, OutHdmi5vKeep, PWOFF, PWON,
      PWSTA, RepCmdTime, RepeatCmd, RHostName, RS232zone, SHostName, Status,
      Type, Unlock, Version, VOUTMute (1 HDMI, 2 HDBaseT), xY$, xYAVxZ
      (inputs 1 USB-C, 2-3 HDMI, output always 1, both outputs follow) p.4-14.
  - title: "AT-OME-MH21 Application Programming Interface, version 1.0 (September 2020)"
    author: Atlona Inc.
    url: https://atlona.com/pdf/AT-OME-MH21_API.pdf
    note: >
      Manufacturer document (Internet Archive copy, 20220702204633). RS-232,
      Telnet, SSH or TCP (9000 MCU, 9002 local RS-232), 500 ms between
      commands p.2; RS-232 9600 8N1 p.3; All#, APwrOffTime (5-3600 s),
      AutoPwr, AutoSW, Blink, CliIPAddr, CliMode, CliPass, CliPort, CliUser
      (the display the MH21 controls over IP), CommaWait, CSpara, CtlType,
      EDIDMSet (default, int1-int7, save1), EDIDOut mem1, HDCPSet (on, off,
      auto), InputBroadcast, InputFormat, InputStatus, IPCFG, IPDHCP,
      IPLogin, IPPort, IPStatic, IPTimeout, List EDID, Lock, Mreset,
      ProjSWMode, ProjWarmUpT (0-300 s), PWSTA, RepCmdTime, RepeatCmd,
      RHostName, RS232zone, ScalerMode, SHostName (15 characters), Statusx1,
      System sta, TrigCEC1, TrigIP1-2, TrigIR, TrigRS1, Type, Unlock, UsbCSS,
      UsbMode, UsbHostRoute, Version, VOUTMute, x1$, x1All, xXAVx1 p.5-29.
      The command summary's descriptions are shifted a row against the
      names; the per-command pages are used.
  - title: Bitfocus Companion module companion-module-atlona-omega (MIT), src/main.ts
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-atlona-omega
    note: >
      Community code, read for corroboration only (top-level LICENSE is MIT;
      no code copied). It answers a "Username:" prompt with the user name
      and a "Password:" prompt with the password, each with CR, takes
      "Welcome to TELNET." as the sign the login succeeded, and sends
      every command with a CR.

transport:
  type: line-tcp
  port: 23
  framing: terminated
  terminator: cr
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  # Every answer echoes its command, so each command names the words its
  # answer starts with (expect.reply_contains): a line the switcher sends on
  # its own (a Broadcast change, the rest of a multi-line IPCFG or System
  # answer) is never taken as another command's answer.
  error_match: '^Command FAILED'
  probe: "PWSTA"
  # "There should be a 500 millisecond delay between each command sent to
  # the unit" (Omega API documents, p.2-3). The PRO3 and H2H documents state
  # no delay.
  pacing:
    min_interval_ms: 0
    by_model:
      - { models: [at-ome-ms42, at-ome-ps62, at-ome-sw32, at-ome-st31a, at-ome-mh21], min_interval_ms: 500 }
  # The same API on each unit's RS-232 control port (every document: "Commands
  # can be sent using RS-232, Telnet ..."). Line defaults: MS42, PS62 and SW32
  # 115200 8N1, ST31A and MH21 9600 8N1 (their p.2-3). The PRO3 and H2H
  # documents give the CSpara example 115200,8,0,1 but no factory default.
  serial:
    baud_rate:
      default: 115200
      values: [2400, 4800, 9600, 19200, 38400, 57600, 115200]
      by_model: [{ models: [at-ome-st31a, at-ome-mh21], default: 9600 }]
    data_bits: { default: 8, values: [7, 8] }
    parity: { default: none, values: [none, odd, even] }
    stop_bits: { default: 1, values: [1, 2] }
    flow_control: none

settings:
  username: { type: string, default: "", max_length: 20, pattern: '^[^ ]*$', label: User name,
              description: "The web GUI user name the unit asks for when Telnet login (IPLogin) is on, as it is by default; leave it empty when login is off." }
  password: { type: string, secret: true, default: "", max_length: 20, label: Password,
              description: "The password for that user; sent only after the unit's Password: prompt." }

on_connect:
  # With IPLogin on (the default) a Telnet session is asked "Username:" and
  # then "Password:" (PRO3, H2H, MH21: IPLogin; the prompts as the Companion
  # module reads them). Login applies to Telnet only, never the serial port.
  - when_set: username
    link: tcp
    after_prompt: "Username:"
    send: "{settings.username}"
  - when_set: username
    link: tcp
    after_prompt: "Password:"
    send: "{settings.password}"

maps:
  onoff: { "true": "on", "false": "off" }
  lock_word: { "true": "Lock", "false": "Unlock" }
  ir_word: { "true": "IRON", "false": "IROFF" }
  parity_digit: { none: "0", odd: "1", even: "2" }

ports:
  - { port: 23, protocol: tcp, role: control, when: "link tcp", note: "Telnet, changeable with IPPort; the Omega MS42, PS62 and MH21 also answer the same API, without a login, on TCP 9000" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "The unit's RS-232 control port, a 3- or 4-pole captive screw connector (PRO3: the master RS-232 port)" }

models:
  - id: at-uhd-pro3-44m
    name: Atlona AT-UHD-PRO3-44M (4x4 HDMI to HDBaseT matrix)
    supports: &pro3
      [route, route_all, reset_routing, get_routing, get_output_route,
       save_preset, recall_preset, clear_preset,
       set_output_video, get_output_video, set_output_mute, get_output_mute,
       set_output_volume, increase_output_volume, decrease_output_volume,
       set_mirror, clear_mirror, set_input_edid, get_input_edid, save_output_edid,
       power_on, power_off, get_power, set_blink, get_blink, set_broadcast, get_broadcast,
       set_front_panel_lock, set_ir, set_ssh_only, get_ssh_only,
       set_dhcp, get_dhcp, set_static_ip, get_network, set_telnet_login, get_telnet_login,
       set_telnet_port, get_telnet_port, set_http_port, set_telnet_timeout,
       add_user, delete_user, change_password,
       set_serial, get_serial, set_zone_serial, get_zone_serial, send_zone_serial,
       factory_reset, sddp_announce, set_host_name, get_host_name, get_model, get_model_full, get_firmware]
    verification: none
    notes: >
      Inputs 1-4; HDBaseT outputs 1-4 and HDMI output 5, which mirrors one
      of them (MirrorHdmi5). Routes and Statusx take outputs 1-5, x?$ 1-4,
      VOUT 1-5 and 7, VOUTMute and RS-232 zones 1-4 (p.17-21). EDIDMSet
      takes default, save1-save10 or int1-int23. Presets 1-50.
  - id: at-uhd-pro3-66m
    name: Atlona AT-UHD-PRO3-66M (6x6 HDMI to HDBaseT matrix)
    supports: *pro3
    verification: none
    notes: >
      Inputs 1-6; HDBaseT outputs 1-5 and 7, HDMI outputs 6 and 8 mirroring
      HDBaseT outputs. x?$ and Statusx take 1-8, VOUT, VOUTMute and RS-232
      zones 1-5 and 7. Presets 1-50.
  - id: at-uhd-pro3-88m
    name: Atlona AT-UHD-PRO3-88M (8x8 HDMI to HDBaseT matrix)
    supports: *pro3
    verification: none
    notes: >
      Inputs 1-8; HDBaseT outputs 1-7 and 9, HDMI outputs 8 and 10 mirroring
      HDBaseT outputs (Status shows x8AVx9,x8AVx10). x?$ and Statusx take
      1-10, VOUT, VOUTMute and RS-232 zones 1-7 and 9. Presets 1-50.
  - id: at-uhd-pro3-1616m
    name: Atlona AT-UHD-PRO3-1616M (16x16 HDMI to HDBaseT matrix)
    supports:
      [route, route_all, reset_routing, get_routing, get_output_route,
       save_preset, recall_preset, clear_preset,
       set_output_video, get_output_video, set_output_mute, get_output_mute,
       set_output_volume, increase_output_volume, decrease_output_volume,
       set_mirror, clear_mirror, set_input_edid, get_input_edid, save_output_edid,
       power_on, power_off, get_power, set_blink, get_blink, set_broadcast, get_broadcast,
       set_front_panel_lock, set_ir, set_ssh_only, get_ssh_only,
       set_dhcp, get_dhcp, set_static_ip, get_network, set_telnet_login, get_telnet_login,
       set_telnet_port, get_telnet_port, set_http_port, set_telnet_timeout,
       add_user, delete_user, change_password,
       set_serial_baud, set_zone_serial_baud, send_zone_serial,
       factory_reset, sddp_announce, set_host_name, get_host_name, get_model, get_model_full, get_firmware]
    verification: none
    notes: >
      Inputs 1-16; HDBaseT outputs 1-16 and HDMI outputs 17-20 mirroring
      HDBaseT outputs. x?$ and Statusx take 1-20, VOUT, VOUTMute and RS-232
      zones 1-16. Its CSpara and RS232para set the baud rate only, and the
      document gives no way to read them back (p.6, p.16). Presets 1-50.
  - id: at-hdr-h2h-88ma
    name: Atlona AT-HDR-H2H-88MA (4K HDR 8x8 HDMI matrix)
    supports:
      [route, route_all, reset_routing, get_routing,
       save_preset, recall_preset, clear_preset,
       set_output_video, get_output_video, set_output_mute, get_output_mute,
       set_input_edid, get_input_edid, save_output_edid, set_input_hdcp, get_input_hdcp,
       power_on, power_off, get_power, set_blink, get_blink, set_broadcast, get_broadcast,
       set_front_panel_lock, set_ir, get_ir, set_telnet, get_telnet,
