       set_display_password, get_display_password, set_display_port, get_display_port,
       set_display_username, get_display_username, set_display_control, get_display_control,
       set_display_on_delay, get_display_on_delay, set_display_warm_up, get_display_warm_up,
       set_scaler, get_scaler, set_repeat, get_repeat, set_repeat_count, get_repeat_count,
       send_display_serial, trigger_cec_mh21, trigger_ip, trigger_ir, trigger_serial,
       set_usb_superspeed, get_usb_superspeed, set_usb_mode_mh21, get_usb_mode_mh21,
       set_usb_host_route, get_usb_host_route,
       set_host_name, get_host_name, factory_reset, get_model, get_firmware]
    verification: none
    notes: >
      Inputs 1 USB-C and 2 HDMI to one HDMI output, with display control
      over RS-232, IP, IR or CEC. Status reads one output only (Statusx1).
      No power on or off commands; PWSTA only. EDIDMSet takes default,
      int1-int7 or save1; one EDID memory (mem1). USB host routes 1 (USB-C)
      and 2 (USB host).

commands:
  # ── Routing ──────────────────────────────────────────────────────────────
  route:
    summary: Route an input's audio and video to an output (xINAVxOUT)
    params:
      input:  { type: int, min: 1, max: 16, required: true, label: Input,
                description: "The input number as the model's document numbers it, from 1 (see the model notes)." }
      output: { type: int, min: 1, max: 20, required: true, label: Output,
                description: "The output number as the model's document numbers it, from 1; HDMI outputs that mirror an HDBaseT output have their own numbers on PRO3 matrices." }
    send: "x{input}AVx{output}"
    expect: { reply_contains: "x{input}AVx", not_contains: "Command FAILED" }
    returns: ack

  route_all:
    summary: Route an input to every output (xINAll)
    params:
      input: { type: int, min: 1, max: 16, required: true, label: Input,
               description: "The input to send to every output, from 1." }
    send: "x{input}All"
    expect: { reply_contains: "x{input}A", not_contains: "Command FAILED" }
    returns: ack

  reset_routing:
    summary: Route each input to the output of the same number, changing nothing else (All#)
    send: "All#"
    # PRO3 answers "All#" (p.5), the H2H and PS62 the new routes from
    # x1AVx1, see the quirks.
    expect: { matches: '^(All#|x1AVx1)' }
    returns: ack

  get_routing:
    summary: Read the input routed to every output (Status); answered as xINAVxOUT pairs separated by commas
    send: "Status"
    expect: { reply_contains: "x", matches: '^(x\d+A?Vx\d+(?:, ?x\d+A?Vx\d+)*)$' }
    returns: value

  get_output_route:
    summary: Read the input routed to one output (StatusxOUT)
    params:
      output: { type: int, min: 1, max: 20, required: true, label: Output,
                description: "The output to read, from 1; the AT-OME-MH21 has output 1 only." }
    send: "Statusx{output}"
    expect: { reply_contains: "AVx{output}", matches: '^x(\d+)AVx\d+$' }
    returns: value

  save_preset:
    summary: Save the current routing as a preset (SaveN)
    params: &preset
      preset: { type: int, min: 1, max: 50, required: true, label: Preset,
                description: "Preset number from 1: 1-50 on PRO3 matrices, 1-8 on the AT-HDR-H2H-88MA." }
    send: "Save{preset}"
    expect: { reply_contains: "Save{preset}", not_contains: "Command FAILED" }
    returns: ack

  recall_preset:
    summary: Recall a saved routing preset (RecallN)
    params: *preset
    send: "Recall{preset}"
    expect: { reply_contains: "Recall{preset}", not_contains: "Command FAILED" }
    returns: ack

  clear_preset:
    summary: Erase a saved routing preset (ClearN)
    params: *preset
    send: "Clear{preset}"
    expect: { reply_contains: "Clear{preset}", not_contains: "Command FAILED" }
    returns: ack

  # ── Outputs ──────────────────────────────────────────────────────────────
  set_output_video:
    summary: Turn an output's signal on or off (xOUT$ on|off)
    params:
      output:  &any_output { type: int, min: 1, max: 20, required: true, label: Output,
                             description: "The output number from 1, as the model's document numbers it (Omega: 1 HDMI, 2 HDBaseT)." }
      enabled: { type: bool, required: true, label: Enabled,
                 description: "On sends the output's signal; off disables it." }
    send: "x{output}$ {enabled:map.onoff}"
    expect: { reply_contains: "x{output}$ ", not_contains: "Command FAILED" }
    returns: ack

  get_output_video:
    summary: Read whether an output's signal is on (xOUT$ sta)
    params: { output: *any_output }
    send: "x{output}$ sta"
    expect: { reply_contains: "x{output}$ ", matches: '\$ (on|off)$' }
    returns: value

  set_output_mute:
    summary: Mute or unmute an output's or zone's audio (VOUTMuteN on|off)
    params:
      output: &zone { type: int, min: 1, max: 16, required: true, label: Zone,
                      description: "The audio output (zone) from 1, as the model's document numbers it (PS62: 1 HDBaseT, 2 HDMI, 3-4 analog)." }
      muted:  { type: bool, required: true, label: Muted, description: "On mutes the output's audio; off unmutes it." }
    send: "VOUTMute{output} {muted:map.onoff}"
    expect: { reply_contains: "VOUTMute{output} ", not_contains: "Command FAILED" }
    returns: ack

  get_output_mute:
    summary: Read whether an output's or zone's audio is muted (VOUTMuteN sta)
    params: { output: *zone }
    send: "VOUTMute{output} sta"
    expect: { reply_contains: "VOUTMute{output} ", matches: ' (on|off)$' }
    returns: value

  set_audio_mute:
    summary: Mute or unmute the output audio (VOUTMute on|off), the AT-OME-MH21's single output
    params:
      muted: { type: bool, required: true, label: Muted, description: "On mutes the output's audio; off unmutes it." }
    send: "VOUTMute {muted:map.onoff}"
    expect: { reply_contains: "VOUTMute ", not_contains: "Command FAILED" }
    returns: ack

  get_audio_mute:
    summary: Read whether the output audio is muted (VOUTMute sta), the AT-OME-MH21's single output
    send: "VOUTMute sta"
    expect: { reply_contains: "VOUTMute ", matches: ' (on|off)$' }
    returns: value

  set_output_volume:
    summary: Set an output's or zone's volume in dB (VOUTN level)
    params:
      output: *zone
      level: { type: int, min: -90, max: 15, required: true, label: Level,
               description: "Volume in dB: -79 to 15 on PRO3 matrices, -90 to 10 on the AT-OME-PS62." }
    send: "VOUT{output} {level}"
    expect: { reply_contains: "VOUT{output} ", not_contains: "Command FAILED" }
    returns: ack

  increase_output_volume:
    summary: Raise an output's or zone's volume one step (VOUTN +)
    params: { output: *zone }
    send: "VOUT{output} +"
    expect: { reply_contains: "VOUT{output} ", not_contains: "Command FAILED" }
    returns: ack

  decrease_output_volume:
    summary: Lower an output's or zone's volume one step (VOUTN -)
    params: { output: *zone }
    send: "VOUT{output} -"
    expect: { reply_contains: "VOUT{output} ", not_contains: "Command FAILED" }
    returns: ack

  get_output_volume:
    summary: Read an output's or zone's volume in dB (VOUTN sta)
    params: { output: *zone }
    send: "VOUT{output} sta"
    expect: { reply_contains: "VOUT{output} ", matches: ' (-?\d+)$' }
    returns: value

  set_mirror:
    summary: Mirror an HDBaseT output on an HDMI output (MirrorHdmiN OutM)
    params:
      hdmi_output: { type: int, min: 5, max: 20, required: true, label: HDMI output,
                     description: "The HDMI output: 5 on the 44M, 6 or 8 on the 66M, 8 or 10 on the 88M, 17-20 on the 1616M." }
      output: { type: int, min: 1, max: 16, required: true, label: HDBaseT output,
                description: "The HDBaseT output whose signal the HDMI output carries." }
    send: "MirrorHdmi{hdmi_output} Out{output}"
    expect: { reply_contains: "MirrorHdmi{hdmi_output} ", not_contains: "Command FAILED" }
    returns: ack

  clear_mirror:
    summary: Stop an HDMI output mirroring an HDBaseT output (UnMirrorN)
    params:
      hdmi_output: { type: int, min: 5, max: 20, required: true, label: HDMI output,
                     description: "The HDMI output, as for set_mirror." }
    send: "UnMirror{hdmi_output}"
    expect: { reply_contains: "UnMirror{hdmi_output}", not_contains: "Command FAILED" }
    returns: ack

  set_analog_audio_source:
    summary: Choose the audio an analog output carries (AUDN source)
    params:
      output: { type: int, min: 1, max: 2, required: true, label: Analog output, description: "Analog audio output 1 or 2." }
      source: { type: enum, values: [HDBaseT, HDMI, AUX1, AUX2, AUX3], required: true, label: Source,
                description: "The audio of the HDBaseT or HDMI output, or an AUX input." }
    send: "AUD{output} {source}"
    expect: { reply_contains: "AUD{output} ", not_contains: "Command FAILED" }
    returns: ack

  set_mono:
    summary: Set an analog output to mono or stereo (SetMonoN on|off)
    params:
      output: { type: int, min: 1, max: 2, required: true, label: Analog output, description: "Analog audio output 1 or 2." }
      mono: { type: bool, required: true, label: Mono, description: "On sums the output to mono; off is stereo." }
    send: "SetMono{output} {mono:map.onoff}"
    expect: { reply_contains: "SetMono{output} ", not_contains: "Command FAILED" }
    returns: ack

  get_mono:
    summary: Read whether an analog output is mono (SetMonoN sta)
    params:
      output: { type: int, min: 1, max: 2, required: true, label: Analog output, description: "Analog audio output 1 or 2." }
    send: "SetMono{output} sta"
    expect: { reply_contains: "SetMono{output} ", matches: ' (on|off)$' }
    returns: value

  set_analog_audio:
    summary: Turn the analog audio output on or off (LRAUD on|off)
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "On enables the analog audio output; off disables it." }
    send: "LRAUD {enabled:map.onoff}"
    expect: { reply_contains: "LRAUD ", not_contains: "Command FAILED" }
    returns: ack

  get_analog_audio:
    summary: Read whether the analog audio output is on (LRAUD sta)
    send: "LRAUD sta"
    expect: { reply_contains: "LRAUD ", matches: ' (on|off)$' }
    returns: value

  set_hdmi_5v_keep:
    summary: Hold the HDMI output's +5V high, or let it follow the video (OutHdmi5vKeep on|off)
    params:
      enabled: { type: bool, required: true, label: Hold +5V,
                 description: "On holds +5V high all the time (faster switching); off lets it follow the presence of video so a display can sleep." }
    send: "OutHdmi5vKeep {enabled:map.onoff}"
    expect: { reply_contains: "OutHdmi5vKeep ", not_contains: "Command FAILED" }
    returns: ack

  get_hdmi_5v_keep:
    summary: Read the HDMI +5V setting (OutHdmi5vKeep sta)
    send: "OutHdmi5vKeep sta"
    expect: { reply_contains: "OutHdmi5vKeep ", matches: ' (on|off)$' }
    returns: value

  # ── Inputs and EDID ──────────────────────────────────────────────────────
  get_input_signals:
    summary: Read which inputs have a source, one digit per input from input 1 (InputStatus)
    send: "InputStatus"
    expect: { reply_contains: "InputStatus ", matches: '^InputStatus ([01]+)$' }
    returns: value

  get_input_signal:
    summary: Read whether one input has a source, 1 or 0 (InputStatusN)
    params:
      input: { type: int, min: 1, max: 6, required: true, label: Input, description: "The input to read, from 1." }
    send: "InputStatus{input}"
    expect: { reply_contains: "InputStatus{input} ", matches: ' ([01])$' }
    returns: value

  get_input_format:
    summary: Read the video format on an input, such as 3840x2160P29:8Bits RGB (InputFormatN)
    params:
      input: { type: int, min: 1, max: 2, required: true, label: Input, description: "Input 1 (USB-C) or 2 (HDMI)." }
    send: "InputFormat{input}"
    expect: { reply_contains: "x", matches: '^(?:InputFormat\d )?(\S.*)$' }
    returns: value

  set_input_edid:
    summary: Assign an EDID to an input (EDIDMSetN edid)
    params:
      input: &edid_input { type: int, min: 1, max: 16, required: true, label: Input, description: "The input from 1." }
      edid: { type: string, pattern: '^(default|save([1-9]|10)|int([1-9]|1[0-9]|2[0-3]))$', required: true, label: EDID,
              description: "default (the downstream display's), saveN (an EDID memory) or intN (a built-in EDID), as the model's document lists: PRO3 save1-10 and int1-23, H2H save1-8 and int1-14, MH21 save1 and int1-7." }
    send: "EDIDMSet{input} {edid}"
    expect: { reply_contains: "EDIDMSet{input} ", not_contains: "Command FAILED" }
    returns: ack

  get_input_edid:
    summary: Read the EDID assigned to an input (EDIDMSetN sta)
    params: { input: *edid_input }
    send: "EDIDMSet{input} sta"
    expect: { reply_contains: "EDIDMSet{input} ", matches: ' (\S+)$' }
    returns: value

  save_output_edid:
    summary: Save the EDID of the display on an output to an EDID memory (EDIDOutN saveM, or memM on the H2H)
    params:
      output: { type: int, min: 1, max: 20, required: true, label: Output, description: "The output whose display's EDID is read, from 1." }
      memory: { type: int, min: 1, max: 10, required: true, label: Memory, description: "The EDID memory: 1-10 on PRO3 matrices, 1-8 on the AT-HDR-H2H-88MA." }
    send:
      - { models: [at-uhd-pro3-44m, at-uhd-pro3-66m, at-uhd-pro3-88m, at-uhd-pro3-1616m], message: "EDIDOut{output} save{memory}" }
      - { models: [at-hdr-h2h-88ma], message: "EDIDOut{output} mem{memory}" }
    expect: { reply_contains: "EDIDOut{output} ", not_contains: "Command FAILED" }
    returns: ack

  save_edid_memory:
    summary: Copy the downstream display's EDID to the EDID memory (EDIDOut mem1)
    send: "EDIDOut mem1"
    expect: { reply_contains: "EDIDOut mem1", not_contains: "Command FAILED" }
    returns: ack

  list_edids:
    summary: List the built-in EDIDs with their numbers (List EDID); the lines go to state
    send: "List EDID"
    expect: { reply_contains: "IntEDID_1:", not_contains: "Command FAILED" }
    returns: text

  set_input_hdcp:
    summary: Set the HDCP an input reports to its source (HDCPSetN mode; "HDCPSet N mode" on the MH21)
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "The input from 1." }
      mode: { type: enum, values: ["on", "off", auto], required: true, label: HDCP,
              description: "on reports an HDCP-compliant sink, off a non-compliant one so no HDCP content is sent, auto follows the display (MH21 only)." }
    send:
      - { models: [at-hdr-h2h-88ma], message: "HDCPSet{input} {mode}" }
      - { models: [at-ome-mh21], message: "HDCPSet {input} {mode}" }
    expect: { reply_contains: "HDCPSet", not_contains: "Command FAILED" }
    returns: ack

  get_input_hdcp:
    summary: Read the HDCP an input reports (HDCPSetN sta)
    params:
      input: { type: int, min: 1, max: 8, required: true, label: Input, description: "The input from 1." }
    send:
      - { models: [at-hdr-h2h-88ma], message: "HDCPSet{input} sta" }
      - { models: [at-ome-mh21], message: "HDCPSet {input} sta" }
    expect: { reply_contains: "HDCPSet", matches: ' (on|off|auto)$' }
    returns: value

  # ── Power and front panel ────────────────────────────────────────────────
  power_on:
    summary: Power the unit on from standby (PWON)
    send: "PWON"
    expect: { reply_contains: "PWON", not_contains: "Command FAILED" }
    returns: ack

  power_off:
    summary: Put the unit in standby (PWOFF)
    send: "PWOFF"
    expect: { reply_contains: "PWOFF", not_contains: "Command FAILED" }
    returns: ack

  get_power:
    summary: Read the power state, PWON or PWOFF (PWSTA)
    send: "PWSTA"
    expect: { reply_contains: "PWO", matches: '^(PWON|PWOFF)$' }
    returns: value

  reboot:
    summary: Restart the unit, keeping its settings (Reboot)
    send: "Reboot"
    expect: { reply_contains: "Reboot", not_contains: "Command FAILED" }
    returns: ack

  factory_reset:
    summary: Reset the unit to factory defaults (Mreset)
    send: "Mreset"
    expect: { reply_contains: "Mreset", not_contains: "Command FAILED" }
    returns: ack

  set_blink:
    summary: Flash the power LED to find the unit, or stop (Blink on|off)
    params:
      enabled: { type: bool, required: true, label: Blink, description: "On flashes the power LED until turned off; off stops it." }
    send: "Blink {enabled:map.onoff}"
    expect: { reply_contains: "Blink ", not_contains: "Command FAILED" }
    returns: ack

  get_blink:
    summary: Read whether the power LED is flashing (Blink sta)
    send: "Blink sta"
    expect: { reply_contains: "Blink ", matches: ' (on|off)$' }
    returns: value

  set_front_panel_lock:
    summary: Lock or unlock the front-panel buttons (Lock, Unlock)
    params:
      locked: { type: bool, required: true, label: Locked, description: "On locks the buttons; off unlocks them." }
    send: "{locked:map.lock_word}"
    expect: { reply_contains: "ock", not_contains: "Command FAILED" }
    returns: ack

  set_ir:
    summary: Enable or disable the front-panel IR receiver (IRON, IROFF)
    params:
      enabled: { type: bool, required: true, label: IR enabled, description: "On enables the IR window; off disables it." }
    send: "{enabled:map.ir_word}"
    expect: { reply_contains: "IRO", not_contains: "Command FAILED" }
    returns: ack

  get_ir:
    summary: Read whether the IR receiver is enabled, IRON or IROFF (IRSTA)
    send: "IRSTA"
    expect: { reply_contains: "IRO", matches: '^(IRON|IROFF)$' }
    returns: value

  set_display_button:
    summary: Press the DISPLAY button's function, or set it (DispBtn on|off|tog)
    params:
      action: { type: enum, values: ["on", "off", tog], required: true, label: Action,
                description: "on and off send the display on and off commands configured in the web GUI; tog toggles between them." }
    send: "DispBtn {action}"
    expect: { reply_contains: "DispBtn ", not_contains: "Command FAILED" }
    returns: ack

  set_display_button_sw32:
    summary: Send a display command as the DISPLAY button would (DispBtn on|off|tog|mute|vol+|vol-)
    params:
      action: { type: enum, values: ["on", "off", tog, mute, vol+, vol-], required: true, label: Action,
                description: "The display-control command configured in the web GUI to send: power on, off or toggle, mute, or volume up or down." }
    send: "DispBtn {action}"
    expect: { reply_contains: "DispBtn ", not_contains: "Command FAILED" }
    returns: ack

  get_display_button:
    summary: Read the DISPLAY button state (DispBtn sta)
    send: "DispBtn sta"
    expect: { reply_contains: "DispBtn ", matches: ' (\S+)$' }
    returns: value

  # ── Display control (AT-OME-MH21, H2H) ───────────────────────────────────
  trigger_cec:
    summary: Send the stored CEC command to the display on an output (TrigCECN action)
    params:
      output: { type: int, min: 1, max: 8, required: true, label: Output, description: "The output whose display gets the command, 1-8." }
      action: &display_action { type: enum, values: ["on", "off", vol+, vol-, mute], required: true, label: Action,
                                description: "Display power on or off, volume up or down, or mute." }
    send: "TrigCEC{output} {action}"
    expect: { reply_contains: "TrigCEC", not_contains: "Command FAILED" }
    returns: ack

  trigger_cec_mh21:
    summary: Send the stored CEC command to the display (TrigCEC1 action)
    params: { action: *display_action }
    send: "TrigCEC1 {action}"
    expect: { reply_contains: "TrigCEC", not_contains: "Command FAILED" }
    returns: ack

  trigger_ip:
    summary: Send the stored IP command to the display (TrigIPN action)
    params:
      connection: { type: int, min: 1, max: 2, required: true, label: TCP connection, description: "The stored IP connection, 1 or 2." }
      action: *display_action
    send: "TrigIP{connection} {action}"
    expect: { reply_contains: "TrigIP{connection} ", not_contains: "Command FAILED" }
    returns: ack

  trigger_ir:
    summary: Send the stored IR command to the display (TrigIR action)
    params: { action: *display_action }
    send: "TrigIR {action}"
    expect: { reply_contains: "TrigIR ", not_contains: "Command FAILED" }
    returns: ack

  trigger_serial:
    summary: Send the stored RS-232 command to the display (TrigRS1 action)
    params: { action: *display_action }
    send: "TrigRS1 {action}"
    expect: { reply_contains: "TrigRS1 ", not_contains: "Command FAILED" }
    returns: ack

  set_display_control:
    summary: Choose how the unit controls the display (CtlType rs-232|ip|cec)
    params:
      type: { type: enum, values: [rs-232, ip, cec], required: true, label: Control type,
              description: "RS-232, IP or CEC control of the display." }
    send: "CtlType {type}"
    expect: { reply_contains: "CtlType ", not_contains: "Command FAILED" }
    returns: ack

  get_display_control:
    summary: Read how the unit controls the display (CtlType sta)
    send: "CtlType sta"
    expect: { reply_contains: "CtlType ", matches: ' (\S+)$' }
    returns: value

  set_display_ip:
    summary: Set the IP address of the display the unit controls (CliIPAddr address)
    params:
      address: &ipv4 { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true,
                       label: IP address, description: "An IPv4 address in dot-decimal notation, such as 192.168.1.61." }
    send: "CliIPAddr {address}"
    expect: { reply_contains: "CliIPAddr ", not_contains: "Command FAILED" }
    returns: ack

  get_display_ip:
    summary: Read the IP address of the display the unit controls (CliIPAddr sta)
    send: "CliIPAddr sta"
    expect: { reply_contains: "CliIPAddr ", matches: ' (\S+)$' }
    returns: value

  set_display_login_mode:
    summary: Set whether the controlled display asks for a login (CliMode login|non-login)
    params:
      mode: { type: enum, values: [login, non-login], required: true, label: Login mode,
              description: "login sends the display user name and password; non-login sends none." }
    send: "CliMode {mode}"
    expect: { reply_contains: "CliMode ", not_contains: "Command FAILED" }
    returns: ack

  get_display_login_mode:
    summary: Read the controlled display's login mode (CliMode sta)
    send: "CliMode sta"
    expect: { reply_contains: "CliMode ", matches: ' (\S+)$' }
    returns: value

  set_display_password:
    summary: Set the password the unit logs in to the controlled display with (CliPass password)
    params:
      password: { type: string, secret: true, pattern: '^\S{1,20}$', required: true, label: Display password,
                  description: "The display's control password, up to 20 characters without spaces." }
    send: "CliPass {password}"
    expect: { reply_contains: "CliPass ", not_contains: "Command FAILED" }
    returns: ack

  get_display_password:
    summary: Read the password the unit logs in to the controlled display with (CliPass)
    send: "CliPass"
    expect: { reply_contains: "CliPass", matches: '^CliPass ?(.*)$' }
    returns: value

  set_display_port:
    summary: Set the TCP port of the controlled display (CliPort port)
    params:
      port: { type: int, min: 0, max: 65535, required: true, label: Port, description: "The display's control port; 23 by default." }
    send: "CliPort {port}"
    expect: { reply_contains: "CliPort ", not_contains: "Command FAILED" }
    returns: ack

  get_display_port:
    summary: Read the TCP port of the controlled display (CliPort sta)
    send: "CliPort sta"
    expect: { reply_contains: "CliPort ", matches: ' (\d+)$' }
    returns: value

  set_display_username:
    summary: Set the user name the unit logs in to the controlled display with (CliUser name)
    params:
      username: { type: string, pattern: '^\S{1,20}$', required: true, label: Display user name,
                  description: "The display's control user name, up to 20 characters without spaces." }
    send: "CliUser {username}"
    expect: { reply_contains: "CliUser ", not_contains: "Command FAILED" }
    returns: ack

  get_display_username:
    summary: Read the user name the unit logs in to the controlled display with (CliUser)
    send: "CliUser"
    expect: { reply_contains: "CliUser", matches: '^CliUser ?(.*)$' }
    returns: value

  set_display_on_delay:
    summary: Set the delay before the display-on command is sent, to match a projector (ProjSWMode seconds)
    params:
      seconds: { type: int, min: 0, max: 300, required: true, label: Delay, description: "Seconds before the display-on command, 0-300." }
    send: "ProjSWMode {seconds}"
    expect: { reply_contains: "ProjSWMode ", not_contains: "Command FAILED" }
    returns: ack

  get_display_on_delay:
    summary: Read the delay before the display-on command (ProjSWMode sta)
    send: "ProjSWMode sta"
    expect: { reply_contains: "ProjSWMode ", matches: ' (\d+)$' }
    returns: value

  set_display_warm_up:
    summary: Set the display warm-up time, during which no other display command is sent (ProjWarmUpT seconds)
    params:
      seconds: { type: int, min: 0, max: 300, required: true, label: Warm-up, description: "Seconds the display needs after power on, 0-300." }
    send: "ProjWarmUpT {seconds}"
    expect: { reply_contains: "Proj", not_contains: "Command FAILED" }
    returns: ack

  get_display_warm_up:
    summary: Read the display warm-up time (ProjWarmUpT sta)
    send: "ProjWarmUpT sta"
    expect: { reply_contains: "Proj", matches: ' (\d+)$' }
    returns: value

  set_auto_power:
    summary: Turn automatic display power-off on or off (AutoPwr on|off)
    params:
      enabled: { type: bool, required: true, label: Auto power, description: "On powers the display off after the no-signal interval; off never does." }
    send: "AutoPwr {enabled:map.onoff}"
    expect: { reply_contains: "AutoPwr ", not_contains: "Command FAILED" }
    returns: ack

  get_auto_power:
    summary: Read the automatic power-off setting (AutoPwr sta)
    send: "AutoPwr sta"
    expect: { reply_contains: "AutoPwr ", matches: ' (on|off)$' }
    returns: value

  set_auto_power_off_time:
    summary: Set how long without a signal before the display is powered off (APwrOffTime seconds)
    params:
      seconds: { type: int, min: 5, max: 3600, required: true, label: Interval, description: "Seconds without an A/V signal, 5-3600." }
    send: "APwrOffTime {seconds}"
    expect: { reply_contains: "APwrOffTime ", not_contains: "Command FAILED" }
    returns: ack

  get_auto_power_off_time:
    summary: Read the no-signal power-off interval (APwrOffTime sta)
    send: "APwrOffTime sta"
    expect: { reply_contains: "APwrOffTime ", matches: ' (\d+)$' }
    returns: value

  set_auto_switch:
    summary: Turn auto-switching to a newly active input on or off (AutoSW on|off)
    params:
      enabled: { type: bool, required: true, label: Auto-switch, description: "On switches to an input when its source appears; off leaves routing manual." }
    send: "AutoSW {enabled:map.onoff}"
    expect: { reply_contains: "AutoSW ", not_contains: "Command FAILED" }
    returns: ack

  get_auto_switch:
    summary: Read the auto-switching setting (AutoSW sta)
    send: "AutoSW sta"
    expect: { reply_contains: "AutoSW ", matches: ' (on|off)$' }
    returns: value

  set_scaler:
    summary: Turn the output scaler on, or bypass it (ScalerMode on|off)
    params:
      enabled: { type: bool, required: true, label: Scaler, description: "On scales the output; off (the default) passes the input signal through." }
    send: "ScalerMode {enabled:map.onoff}"
    expect: { reply_contains: "ScalerMode ", not_contains: "Command FAILED" }
    returns: ack

  get_scaler:
    summary: Read the scaler setting (ScalerMode sta)
    send: "ScalerMode sta"
    expect: { reply_contains: "ScalerMode ", matches: ' (on|off)$' }
    returns: value

  # ── Feedback and repeats ─────────────────────────────────────────────────
  set_broadcast:
    summary: Turn broadcast mode on or off, which sends changes made in the web GUI to this connection (Broadcast on|off)
    params:
      enabled: { type: bool, required: true, label: Broadcast, description: "On sends web GUI changes to connected control systems; off (the default) keeps them apart." }
    send: "Broadcast {enabled:map.onoff}"
    expect: { reply_contains: "Broadcast ", not_contains: "Command FAILED" }
    returns: ack

  get_broadcast:
    summary: Read the broadcast mode setting (Broadcast sta)
    send: "Broadcast sta"
    expect: { reply_contains: "Broadcast ", matches: ' (on|off)$' }
    returns: value

  set_input_broadcast:
    summary: Turn input-status broadcast on or off (InputBroadcast on|off)
    params:
      enabled: { type: bool, required: true, label: Input broadcast, description: "On sends input status changes to connected control systems; off (the default) does not." }
    send: "InputBroadcast {enabled:map.onoff}"
    expect: { reply_contains: "InputBroadcast ", not_contains: "Command FAILED" }
    returns: ack

  get_input_broadcast:
    summary: Read the input-status broadcast setting (InputBroadcast sta)
    send: "InputBroadcast sta"
    expect: { reply_contains: "InputBroadcast ", matches: ' (on|off)$' }
    returns: value

  set_comma_wait:
    summary: Make a comma in stored display commands add a 5-second delay, or not (CommaWait on|off)
    params:
      enabled: { type: bool, required: true, label: Comma wait, description: "On makes each comma in a stored command string wait 5 seconds." }
    send: "CommaWait {enabled:map.onoff}"
    expect: { reply_contains: "CommaWait ", not_contains: "Command FAILED" }
    returns: ack

  get_comma_wait:
    summary: Read the comma-wait setting (CommaWait sta)
    send: "CommaWait sta"
    expect: { reply_contains: "CommaWait ", matches: ' (on|off)$' }
    returns: value

  set_repeat:
    summary: Turn repeating of display commands on or off (RepeatCmd on|off)
    params:
      enabled: { type: bool, required: true, label: Repeat, description: "On sends each display command the repeat count of times." }
    send: "RepeatCmd {enabled:map.onoff}"
    expect: { reply_contains: "RepeatCmd ", not_contains: "Command FAILED" }
    returns: ack

  get_repeat:
    summary: Read whether display commands are repeated (RepeatCmd sta)
    send: "RepeatCmd sta"
    expect: { reply_contains: "RepeatCmd ", matches: ' (on|off)$' }
    returns: value

  set_repeat_count:
    summary: Set how many times a display command is sent when repeating is on (RepCmdTime n)
    params:
      count: &repeat_count { type: int, min: 2, max: 4, required: true, label: Times, description: "How many times each display command is sent, 2-4." }
    send: "RepCmdTime {count}"
    expect: { reply_contains: "RepCmdTime ", not_contains: "Command FAILED" }
    returns: ack

  set_repeat_count_ps62:
    summary: Set how many times a display command is sent when repeating is on (RepeatCmd n, as the AT-OME-PS62 document writes it)
    params: { count: *repeat_count }
    send: "RepeatCmd {count}"
    expect: { reply_contains: "RepeatCmd ", not_contains: "Command FAILED" }
    returns: ack

  get_repeat_count:
    summary: Read how many times display commands are sent (RepCmdTime sta)
    send: "RepCmdTime sta"
    expect: { reply_contains: "RepCmdTime ", matches: ' (\d)$' }
    returns: value

  # ── Network and access ───────────────────────────────────────────────────
  set_dhcp:
    summary: Turn DHCP on, or off for the static address (IPDHCP on|off)
    params:
      enabled: { type: bool, required: true, label: DHCP, description: "On takes an address from DHCP; off uses the static address set with set_static_ip." }
    send: "IPDHCP {enabled:map.onoff}"
    expect: { reply_contains: "IPDHCP ", not_contains: "Command FAILED" }
    returns: ack

  get_dhcp:
    summary: Read whether DHCP is on (IPDHCP sta)
    send: "IPDHCP sta"
    expect: { reply_contains: "IPDHCP ", matches: ' (on|off)$' }
    returns: value

  set_static_ip:
    summary: Set the static IP address, subnet mask and gateway (IPStatic ip mask gateway)
    params:
      address: *ipv4
      netmask: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true,
                 label: Subnet mask, description: "The subnet mask in dot-decimal notation, such as 255.255.255.0." }
      gateway: { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true,
                 label: Gateway, description: "The gateway (router) address in dot-decimal notation." }
    send: "IPStatic {address} {netmask} {gateway}"
    expect: { reply_contains: "IPStatic ", not_contains: "Command FAILED" }
    returns: ack

  get_network:
    summary: Read the network settings (IPCFG); the lines that follow go to state
    send: "IPCFG"
    expect: { reply_contains: "ddr", not_contains: "Command FAILED" }
    returns: text

  get_system:
    summary: Read the system summary (System sta); its lines go to state
    send: "System sta"
    expect: { reply_contains: "Model:", not_contains: "Command FAILED" }
    returns: text

  set_8021x:
    summary: Set 802.1X network authentication (IP802.1x mode)
    params:
      mode: { type: enum, values: [disable, PEAP, TTLS, TLS], required: true, label: 802.1X,
              description: "disable, or the RADIUS authentication method PEAP, TTLS or TLS." }
    send: "IP802.1x {mode}"
    expect: { reply_contains: "IP802.1x ", not_contains: "Command FAILED" }
    returns: ack

  get_8021x:
    summary: Read the 802.1X setting (IP802.1x sta)
    send: "IP802.1x sta"
    expect: { reply_contains: "IP802.1x ", matches: ' (\S+)$' }
    returns: value

  set_telnet_login:
    summary: Require a login for Telnet sessions, or not (IPLogin on|off)
    params:
      enabled: { type: bool, required: true, label: Telnet login, description: "On (the default) asks each Telnet session for the web GUI user name and password; off asks for none." }
    send: "IPLogin {enabled:map.onoff}"
    expect: { reply_contains: "IPLogin ", not_contains: "Command FAILED" }
    returns: ack

  get_telnet_login:
    summary: Read whether Telnet sessions need a login (IPLogin sta)
    send: "IPLogin sta"
    expect: { reply_contains: "IPLogin ", matches: ' (on|off)$' }
    returns: value

  set_telnet_port:
    summary: Set the Telnet listening port (IPPort port)
    params:
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "The Telnet port; 23 by default." }
    send: "IPPort {port}"
    expect: { reply_contains: "IPPort ", not_contains: "Command FAILED" }
    returns: ack

  get_telnet_port:
    summary: Read the Telnet listening port (IPPort sta)
    send: "IPPort sta"
    expect: { reply_contains: "IPPort ", matches: ' (\d+)$' }
    returns: value

  set_http_port:
    summary: Set the web server's port (HTTPPort port)
    params:
      port: { type: int, min: 0, max: 65535, required: true, label: Port, description: "The web GUI's HTTP port; 80 by default." }
    send: "HTTPPort {port}"
    expect: { reply_contains: "HTTPPort ", not_contains: "Command FAILED" }
    returns: ack

  set_telnet_timeout:
    summary: Set how long an idle Telnet session stays open (IPTimeout seconds)
    params:
      seconds: { type: int, min: 1, max: 60000, required: true, label: Timeout,
                 description: "Seconds of inactivity before the session is closed: 1-60000 (1-3600 on the H2H); 300 by default." }
    send: "IPTimeout {seconds}"
    expect: { reply_contains: "IPTimeout ", not_contains: "Command FAILED" }
    returns: ack

  set_telnet:
    summary: Turn the Telnet server on or off (Telnet on|off)
    params:
      enabled: { type: bool, required: true, label: Telnet, description: "On runs the Telnet server; off stops it, ending Telnet control." }
    send: "Telnet {enabled:map.onoff}"
    expect: { reply_contains: "Telnet ", not_contains: "Command FAILED" }
    returns: ack

  get_telnet:
    summary: Read whether the Telnet server is on (Telnet sta)
    send: "Telnet sta"
    expect: { reply_contains: "Telnet ", matches: ' (on|off)$' }
    returns: value

  set_ssh_only:
    summary: Close every port but SSH, the web server included, or open them again (syslock on|off)
    params:
      enabled: { type: bool, required: true, label: SSH only, description: "On shuts the web server and every port except SSH (TCP 22); the RS-232 port stays available." }
    send: "syslock {enabled:map.onoff}"
    expect: { reply_contains: "syslock ", not_contains: "Command FAILED" }
    returns: ack

  get_ssh_only:
    summary: Read whether only SSH is open (syslock sta)
    send: "syslock sta"
    expect: { reply_contains: "syslock ", matches: ' (on|off)$' }
    returns: value

  add_user:
    summary: Add a web GUI and Telnet user (IPAddUser name password)
    params:
      username: { type: string, pattern: '^\S{1,20}$', required: true, label: User name, description: "Up to 20 characters without spaces." }
      password: { type: string, secret: true, pattern: '^\S{1,20}$', required: true, label: Password, description: "Up to 20 characters without spaces." }
    send: "IPAddUser {username} {password}"
    expect: { reply_contains: "IPAddUser ", not_contains: "Command FAILED" }
    returns: ack

  delete_user:
    summary: Delete a web GUI and Telnet user (IPDelUser name)
    params:
      username: { type: string, pattern: '^\S{1,20}$', required: true, label: User name, description: "The user to delete." }
    send: "IPDelUser {username}"
    expect: { reply_contains: "IPDelUser ", not_contains: "Command FAILED" }
    returns: ack

  change_password:
    summary: Change a user's password (IPChangePass user old new)
    params:
      username: { type: string, pattern: '^\S{1,20}$', required: true, label: User name, description: "The user whose password changes, such as root." }
      old_password: { type: string, secret: true, pattern: '^\S{1,20}$', required: true, label: Old password, description: "The current password." }
      new_password: { type: string, secret: true, pattern: '^\S{1,20}$', required: true, label: New password, description: "The new password, up to 20 characters without spaces." }
    send: "IPChangePass {username} {old_password} {new_password}"
    expect: { reply_contains: "IPChangePass ", not_contains: "Command FAILED" }
    returns: ack

  sddp_announce:
    summary: Send an SDDP announcement for Control4 discovery (sddp_announce)
    send: "sddp_announce"
    expect: { reply_contains: "SDDP", not_contains: "Command FAILED" }
    returns: ack

  set_host_name:
    summary: Set the unit's host name (set_host_name name; SHostName name on Omega)
    params:
      name: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$', required: true, label: Host name,
              description: "Letters, digits, - and _ without spaces: up to 40 characters on PRO3 matrices, 15 on the AT-OME-MH21." }
    send:
      - { models: [at-uhd-pro3-44m, at-uhd-pro3-66m, at-uhd-pro3-88m, at-uhd-pro3-1616m], message: "set_host_name {name}" }
      - { models: [at-ome-st31a, at-ome-mh21], message: "SHostName {name}" }
    expect: { reply_contains: "ost", not_contains: "Command FAILED" }
    returns: ack

  get_host_name:
    summary: Read the unit's host name (show_host_name; RHostName on Omega)
    send:
      - { models: [at-uhd-pro3-44m, at-uhd-pro3-66m, at-uhd-pro3-88m, at-uhd-pro3-1616m], message: "show_host_name" }
      - { models: [at-ome-st31a, at-ome-mh21], message: "RHostName" }
    expect: { matches: '^(?:RHostName )?(\S+)$' }
    returns: value

  get_model:
    summary: Read the model, such as AT-UHD-PRO3-88M (Type)
    send: "Type"
    expect: { reply_contains: "AT-", matches: '^(AT-\S+)' }
    returns: value

  get_model_full:
    summary: Read the model with its host name and firmware (Type full)
    send: "Type full"
    expect: { reply_contains: "AT-", not_contains: "Command FAILED" }
    returns: text

  get_firmware:
    summary: Read the firmware version (Version; VersionMCU on the H2H)
    send:
      - { models: [at-uhd-pro3-44m, at-uhd-pro3-66m, at-uhd-pro3-88m, at-uhd-pro3-1616m, at-ome-ms42, at-ome-ps62, at-ome-sw32, at-ome-st31a, at-ome-mh21], message: "Version" }
      - { models: [at-hdr-h2h-88ma], message: "VersionMCU" }
    expect: { matches: '^(?:Firmware )?(\d[\w.]*)$' }
    returns: value

  # ── Serial ports ─────────────────────────────────────────────────────────
  set_serial:
    summary: Set the unit's own RS-232 port (CSpara[baud,data,parity,stop])
    params: &serial_params
      baud: { type: enum, values: ["2400", "4800", "9600", "19200", "38400", "57600", "115200"], required: true, label: Baud rate, description: "Bits per second." }
      data_bits: { type: int, min: 7, max: 8, default: 8, label: Data bits, description: "7 or 8 data bits." }
      parity: { type: enum, values: [none, odd, even], default: none, label: Parity, description: "Parity, sent as 0, 1 or 2." }
      stop_bits: { type: int, min: 1, max: 2, default: 1, label: Stop bits, description: "1 or 2 stop bits." }
    send: "CSpara[{baud},{data_bits},{parity:map.parity_digit},{stop_bits}]"
    expect: { reply_contains: "CSpara", not_contains: "Command FAILED" }
    returns: ack

  get_serial:
    summary: Read the unit's own RS-232 settings, as baud,data,parity,stop (CSpara[sta])
    send: "CSpara[sta]"
    expect: { reply_contains: "CSpara", matches: '\[(\d+,[78],[012],[12])\]' }
    returns: value

  set_serial_baud:
    summary: Set the unit's own RS-232 baud rate (CSpara[baud])
    params:
      baud: { type: enum, values: ["2400", "4800", "9600", "19200", "38400", "57600", "115200"], required: true, label: Baud rate, description: "Bits per second." }
    send: "CSpara[{baud}]"
    expect: { reply_contains: "CSpara", not_contains: "Command FAILED" }
    returns: ack

  set_zone_serial:
    summary: Set the RS-232 line of the HDBaseT ports (RS232para[baud,data,parity,stop])
    params:
      baud: { type: enum, values: ["2400", "9600", "19200", "38400", "56000", "57600", "115200"], required: true, label: Baud rate, description: "Bits per second." }
      data_bits: { type: int, min: 7, max: 8, default: 8, label: Data bits, description: "7 or 8 data bits." }
      parity: { type: enum, values: [none, odd, even], default: none, label: Parity, description: "Parity, sent as 0, 1 or 2." }
      stop_bits: { type: int, min: 1, max: 2, default: 1, label: Stop bits, description: "1 or 2 stop bits." }
    send: "RS232para[{baud},{data_bits},{parity:map.parity_digit},{stop_bits}]"
    expect: { reply_contains: "RS232para", not_contains: "Command FAILED" }
    returns: ack

  get_zone_serial:
    summary: Read the HDBaseT ports' RS-232 settings, as baud,data,parity,stop (RS232para sta)
    send: "RS232para sta"
    expect: { reply_contains: "RS232para", matches: '\[(\d+,[78],[012],[12])\]' }
    returns: value

  set_zone_serial_baud:
    summary: Set one HDBaseT zone's RS-232 baud rate (RS232paraN[baud])
    params:
      zone: { type: int, min: 1, max: 16, required: true, label: Zone, description: "The HDBaseT output (zone), 1-16." }
      baud: { type: enum, values: ["2400", "9600", "19200", "38400", "56000", "57600", "115200"], required: true, label: Baud rate, description: "Bits per second." }
    send: "RS232para{zone}[{baud}]"
    expect: { reply_contains: "RS232para{zone}", not_contains: "Command FAILED" }
    returns: ack

  send_zone_serial:
    summary: Send a command out of an HDBaseT port's RS-232, to the display there (RS232zoneN[command])
    params:
      zone: { type: int, min: 1, max: 16, required: true, label: Zone, description: "The HDBaseT output (zone) from 1; on the AT-OME-PS62 1 and 2 are the HDBaseT inputs and 3 the output." }
      command: &serial_text { type: string, pattern: '^[^\s\[\]]{1,200}$', required: true, label: Command,
                              description: "The display's command text, without spaces or brackets." }
    send: "RS232zone{zone}[{command}]"
    expect: { reply_contains: "RS232zone{zone}[", not_contains: "Command FAILED" }
    returns: ack

  send_display_serial:
    summary: Send a command out of the RS-232 port to the display (RS232zone[command])
    params: { command: *serial_text }
    send: "RS232zone[{command}]"
    expect: { reply_contains: "RS232zone[", not_contains: "Command FAILED" }
    returns: ack

  # ── USB (Omega) ──────────────────────────────────────────────────────────
  set_usb_host_logic:
    summary: Set how the USB host is chosen (USBHostLogic mode)
    params:
      mode: { type: enum, values: [follow usb, follow video, manual], required: true, label: USB mode,
              description: "Follow the USB connection, follow the video route, or choose the host by hand." }
    send: "USBHostLogic {mode}"
    expect: { reply_contains: "USBHostLogic ", not_contains: "Command FAILED" }
    returns: ack

  get_usb_host_logic:
    summary: Read how the USB host is chosen (USBHostLogic sta)
    send: "USBHostLogic sta"
    expect: { reply_contains: "USBHostLogic ", matches: 'USBHostLogic (.+)$' }
    returns: value

  set_usb_host_route:
    summary: Choose the USB host (USBHostRoute port; UsbHostRoute on the MH21)
    params:
      host: { type: enum, values: [C, "1", "2", "3"], required: true, label: USB host,
              description: "MS42: C (USB-C), 1 or 2 (USB host ports), 3 (the remote host over HDBaseT); MH21: 1 (USB-C) or 2 (USB host)." }
    send:
      - { models: [at-ome-ms42], message: "USBHostRoute {host}" }
      - { models: [at-ome-mh21], message: "UsbHostRoute {host}" }
    expect: { reply_contains: "HostRoute ", not_contains: "Command FAILED" }
    returns: ack

  get_usb_host_route:
    summary: Read the USB host (USBHostRoute sta)
    send:
      - { models: [at-ome-ms42], message: "USBHostRoute sta" }
      - { models: [at-ome-mh21], message: "UsbHostRoute sta" }
    expect: { reply_contains: "HostRoute ", matches: 'HostRoute (\S+)$' }
    returns: value

  set_usb_vbus:
    summary: Keep USB hub power on always, or follow the host (UsbVbusControl on|off)
    params:
      enabled: { type: bool, required: true, label: Vbus always on, description: "On keeps the hub ports powered; off follows the presence of the USB host." }
    send: "UsbVbusControl {enabled:map.onoff}"
    expect: { reply_contains: "UsbVbusControl ", not_contains: "Command FAILED" }
    returns: ack

  get_usb_vbus:
    summary: Read the USB Vbus setting (UsbVbusControl sta)
    send: "UsbVbusControl sta"
    expect: { reply_contains: "UsbVbusControl ", matches: ' (on|off)$' }
    returns: value

  set_usb_mode_ps62:
    summary: Set USB switching to follow USB, manual or follow video (UsbMode 0|1|2)
    params:
      mode: { type: int, min: 0, max: 2, required: true, label: USB mode, description: "0 follow USB, 1 manual, 2 follow video." }
    send: "UsbMode {mode}"
    expect: { reply_contains: "UsbMode ", not_contains: "Command FAILED" }
    returns: ack

  set_usb_route:
    summary: Choose the USB source device (UsbRoute 1-6)
    params:
      source: { type: int, min: 1, max: 6, required: true, label: USB source,
                description: "1 and 2 the local USB ports, 3 the HDBaseT output, 4 USB-C, 5 and 6 HDBaseT inputs 1 and 2." }
    send: "UsbRoute {source}"
    expect: { reply_contains: "UsbRoute ", not_contains: "Command FAILED" }
    returns: ack

  set_usb_mode_mh21:
    summary: Set USB switching to follow USB or manual (UsbMode follow usb|manual)
    params:
      mode: { type: enum, values: [follow usb, manual], required: true, label: USB mode, description: "Follow the USB connection, or choose the host by hand." }
    send: "UsbMode {mode}"
    expect: { reply_contains: "UsbMode ", not_contains: "Command FAILED" }
    returns: ack

  get_usb_mode_mh21:
    summary: Read the USB switching mode (UsbMode sta)
    send: "UsbMode sta"
    expect: { reply_contains: "UsbMode ", matches: 'UsbMode (.+)$' }
    returns: value

  set_usb_superspeed:
    summary: Turn USB-C SuperSpeed on or off (UsbCSS on|off)
    params:
      enabled: { type: bool, required: true, label: SuperSpeed, description: "On (the default) enables USB-C SuperSpeed; off limits the port to USB 2.0 speeds." }
    send: "UsbCSS {enabled:map.onoff}"
    expect: { reply_contains: "UsbCSS ", not_contains: "Command FAILED" }
    returns: ack

  get_usb_superspeed:
    summary: Read the USB-C SuperSpeed setting (UsbCSS sta)
    send: "UsbCSS sta"
    expect: { reply_contains: "UsbCSS ", matches: ' (on|off)$' }
    returns: value

state:
  power:                     { type: bool, description: "True when the unit is on, false in standby (PWON, PWOFF, PWSTA)" }
  outputs.*.input:           { type: int, description: "Input routed to the output, from 1; keyed by output as the model numbers them (Status, Statusx, route echoes)" }
  outputs.*.video_enabled:   { type: bool, description: "Whether the output sends a signal (x?$)" }
  outputs.*.audio_muted:     { type: bool, description: "Whether the output's or zone's audio is muted (VOUTMute); keyed by zone" }
  outputs.*.volume:          { type: int, unit: dB, description: "Output or zone volume (VOUT); kept from set and sta answers only" }
  outputs.*.mirror_of:       { type: int, description: "HDBaseT output an HDMI output mirrors, or 0 when not mirroring (MirrorHdmi, UnMirror); keyed by HDMI output" }
  analog_outputs.*.source:   { type: string, description: "Audio an analog output carries: HDBaseT, HDMI, AUX1-3 (AUD)" }
  analog_outputs.*.mono:     { type: bool, description: "Whether the analog output is mono (SetMono)" }
  inputs.*.signal:           { type: bool, description: "Whether a source is detected on the input (InputStatus)" }
  inputs.*.edid:             { type: string, description: "EDID assigned to the input: default, saveN or intN (EDIDMSet)" }
  inputs.*.hdcp:             { type: string, description: "HDCP the input reports: on, off or auto (HDCPSet)" }
  inputs.*.format:           { type: string, description: "Video format on the input, such as 3840x2160P29:8Bits RGB (InputFormat)" }
  edids.*:                   { type: string, description: "Built-in EDID by number, such as ATL 1920x1080P 2CH (List EDID)" }
  blink:                     { type: bool, description: "Whether the power LED is flashing (Blink)" }
  broadcast:                 { type: bool, description: "Whether web GUI changes are sent to control connections (Broadcast)" }
  input_broadcast:           { type: bool, description: "Whether input status changes are sent (InputBroadcast)" }
  front_panel_locked:        { type: bool, description: "Whether the front-panel buttons are locked; known from Lock and Unlock answers only" }
  ir_enabled:                { type: bool, description: "Whether the front-panel IR receiver is enabled (IRON, IROFF, IRSTA)" }
  display_button:            { type: string, description: "DISPLAY button state: on, off, tog, mute, vol+ or vol- (DispBtn)" }
  analog_audio:              { type: bool, description: "Whether the analog audio output is enabled (LRAUD)" }
  hdmi_5v_keep:              { type: bool, description: "Whether the HDMI output holds +5V high always (OutHdmi5vKeep)" }
  comma_wait:                { type: bool, description: "Whether a comma in stored display commands waits 5 s (CommaWait)" }
  repeat:                    { type: bool, description: "Whether display commands are repeated (RepeatCmd)" }
  repeat_count:              { type: int, description: "Times each display command is sent when repeating (RepCmdTime)" }
  auto_power:                { type: bool, description: "Whether the display is powered off after no signal (AutoPwr)" }
  auto_power_off_time:       { type: int, unit: s, description: "No-signal interval before the display is powered off (APwrOffTime)" }
  auto_switch:               { type: bool, description: "Whether the unit switches to a newly active input (AutoSW)" }
  scaler:                    { type: bool, description: "Whether the output scaler is on (ScalerMode)" }
  display.control:           { type: string, description: "How the display is controlled: rs-232, ip or cec (CtlType)" }
  display.ip_address:        { type: string, description: "Controlled display's IP address (CliIPAddr)" }
  display.login_mode:        { type: string, description: "Controlled display's login mode: login or non-login (CliMode)" }
  display.port:              { type: int, description: "Controlled display's TCP port (CliPort)" }
  display.username:          { type: string, description: "User name sent to the controlled display (CliUser)" }
  display.on_delay:          { type: int, unit: s, description: "Delay before the display-on command (ProjSWMode)" }
  display.warm_up:           { type: int, unit: s, description: "Display warm-up time (ProjWarmUpT)" }
  network.dhcp:              { type: bool, description: "Whether DHCP is on (IPDHCP)" }
  network.ip_address:        { type: string, description: "IP address (IPCFG, System)" }
  network.netmask:           { type: string, description: "Subnet mask (IPCFG, System)" }
  network.gateway:           { type: string, description: "Gateway (IPCFG, System)" }
  network.mac_address:       { type: string, description: "MAC address (IPCFG, System)" }
  network.address_type:      { type: string, description: "DHCP or static, as System reports it" }
  network.telnet_port:       { type: int, description: "Telnet port (IPPort, IPCFG)" }
  network.http_port:         { type: int, description: "Web GUI port (HTTPPort, IPCFG, System)" }
  network.ssh_port:          { type: int, description: "SSH port (IPCFG, System)" }
  network.telnet_login:      { type: bool, description: "Whether Telnet sessions need a login (IPLogin)" }
  network.telnet_timeout:    { type: int, unit: s, description: "Idle time before a Telnet session closes (IPTimeout)" }
  network.telnet_enabled:    { type: bool, description: "Whether the Telnet server runs (Telnet)" }
  network.ssh_only:          { type: bool, description: "Whether only SSH is open (syslock)" }
  network.ieee8021x:         { type: string, description: "802.1X authentication: disable, PEAP, TTLS or TLS (IP802.1x)" }
  serial.settings:           { type: string, description: "Unit's own RS-232 line as baud,data,parity,stop with parity 0 none, 1 odd, 2 even (CSpara)" }
  zone_serial.settings:      { type: string, description: "HDBaseT RS-232 line as baud,data,parity,stop (RS232para)" }
  usb.host_logic:            { type: string, description: "How the USB host is chosen: follow usb, follow video or manual (USBHostLogic)" }
  usb.host_route:            { type: string, description: "Selected USB host (USBHostRoute)" }
  usb.vbus:                  { type: bool, description: "Whether the hub keeps Vbus on always (UsbVbusControl)" }
  usb.mode:                  { type: string, description: "USB switching mode: 0, 1 or 2 on the PS62, follow usb or manual on the MH21 (UsbMode)" }
  usb.route:                 { type: int, description: "USB source device, 1-6 (UsbRoute)" }
  usb.superspeed:            { type: bool, description: "Whether USB-C SuperSpeed is enabled (UsbCSS)" }
  host_name:                 { type: string, description: "Host name (show_host_name, RHostName)" }
  model:                     { type: string, description: "Model, such as AT-UHD-PRO3-88M (Type, System)" }
  firmware:                  { type: string, description: "Firmware version (Version, System)" }
  uptime:                    { type: string, description: "Time since power on as dd HH:mm:ss (System)" }

