  updates:
    # Routing: Status, Statusx, route echoes and the H2H's and PS62's
    # answers to All# and x?All are xINAVxOUT pairs, separated by commas
    # (and a space on the H2H and Omega). The PS62 and SW32 documents write
    # Status's pairs as x3Vx1, without the A.
    - match: '^(x\d+A?Vx\d+(?:, ?x\d+A?Vx\d+)*)$'
      match_each: 'x(\d+)A?Vx(\d+)'
      match_each_in: 1
      state: { "outputs.{3}.input": "{2}" }
    # Answers that change routing without naming it: read it again.
    - match: '^(?:x\d+All|All#|Recall\d+)$'
      then_send:
        - { models: [at-uhd-pro3-44m, at-uhd-pro3-66m, at-uhd-pro3-88m, at-uhd-pro3-1616m, at-hdr-h2h-88ma, at-ome-ps62], message: "Status" }
        - { models: [at-ome-mh21], message: "Statusx1" }
    - match: '^PWO(N|FF)$'
      state: { power: { value: "{1}", map: { "N": true, "FF": false } } }
    - match: '^x(\d+)\$ (on|off)$'
      state: { "outputs.{1}.video_enabled": { value: "{2}", map: { "on": true, "off": false } } }
    - match: '^VOUTMute(\d+) (on|off)$'
      state: { "outputs.{1}.audio_muted": { value: "{2}", map: { "on": true, "off": false } } }
    - models: [at-ome-mh21]
      match: '^VOUTMute (on|off)$'
      state: { "outputs.1.audio_muted": { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^VOUT(\d+) (-?\d+)$'
      state: { "outputs.{1}.volume": "{2}" }
    - match: '^MirrorHdmi(\d+) Out(\d+)$'
      state: { "outputs.{1}.mirror_of": "{2}" }
    - match: '^UnMirror(\d+)$'
      state: { "outputs.{1}.mirror_of": "0" }
    - match: '^AUD(\d) (HDBaseT|HDMI|AUX[123])$'
      state: { "analog_outputs.{1}.source": "{2}" }
    - match: '^SetMono(\d) (on|off)$'
      state: { "analog_outputs.{1}.mono": { value: "{2}", map: { "on": true, "off": false } } }
    - match: '^InputStatus ([01]+)$'
      match_each: '([01])'
      match_each_in: 1
      state: { "inputs.{index:+1}.signal": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^InputStatus(\d) ([01])$'
      state: { "inputs.{1}.signal": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^EDIDMSet(\d+) (default|save\d+|int\d+)$'
      state: { "inputs.{1}.edid": "{2}" }
    - match: '^HDCPSet ?(\d) (on|off|auto)$'
      state: { "inputs.{1}.hdcp": "{2}" }
    - match: '^(?:InputFormat\d )?(\d{3,4}x\d{3,4}[PpIi].*)$'
      request_match: '^InputFormat(\d)$'
      state: { "inputs.{2}.format": "{1}" }
    - match: '^IntEDID_(\d+):(.+)$'
      state: { "edids.{1}": "{2}" }
    - match: '^Blink (on|off)$'
      state: { blink: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^Broadcast (on|off)$'
      state: { broadcast: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^InputBroadcast (on|off)$'
      state: { input_broadcast: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^(Lock|Unlock)$'
      state: { front_panel_locked: { value: "{1}", map: { "Lock": true, "Unlock": false } } }
    - match: '^IRO(N|FF)$'
      state: { ir_enabled: { value: "{1}", map: { "N": true, "FF": false } } }
    - match: '^DispBtn (on|off|tog|mute|vol\+|vol-)$'
      state: { display_button: "{1}" }
    - match: '^LRAUD (on|off)$'
      state: { analog_audio: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^OutHdmi5vKeep (on|off)$'
      state: { hdmi_5v_keep: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^CommaWait (on|off)$'
      state: { comma_wait: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^RepeatCmd (on|off)$'
      state: { repeat: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^(?:RepCmdTime|RepeatCmd) ([2-4])$'
      state: { repeat_count: "{1}" }
    - match: '^AutoPwr (on|off)$'
      state: { auto_power: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^APwrOffTime (\d+)$'
      state: { auto_power_off_time: "{1}" }
    - match: '^AutoSW (on|off)$'
      state: { auto_switch: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^ScalerMode (on|off)$'
      state: { scaler: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^CtlType (rs-232|ip|cec)$'
      state: { display.control: "{1}" }
    - match: '^CliIPAddr (\S+)$'
      state: { display.ip_address: "{1}" }
    - match: '^CliMode (login|non-login)$'
      state: { display.login_mode: "{1}" }
    - match: '^CliPort (\d+)$'
      state: { display.port: "{1}" }
    - match: '^CliUser (\S+)$'
      state: { display.username: "{1}" }
    - match: '^ProjSWMode (\d+)$'
      request_match: '^ProjSWMode'
      state: { display.on_delay: "{1}" }
    # The document's ProjWarmUpT example is answered "ProjSWMode 120"; the
    # request it answers says which value it is.
    - match: '^Proj(?:SWMode|WarmUpT) (\d+)$'
      request_match: '^ProjWarmUpT'
      state: { display.warm_up: "{1}" }
    - match: '^IPDHCP (on|off)$'
      state: { network.dhcp: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^IPLogin (on|off)$'
      state: { network.telnet_login: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^IPPort (\d+)$'
      state: { network.telnet_port: "{1}" }
    - match: '^HTTPPort (\d+)$'
      state: { network.http_port: "{1}" }
    - match: '^IPTimeout (\d+)$'
      state: { network.telnet_timeout: "{1}" }
    - match: '^Telnet (on|off)$'
      state: { network.telnet_enabled: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^syslock (on|off)$'
      state: { network.ssh_only: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^IP802\.1x (disable|PEAP|TTLS|TLS)$'
      state: { network.ieee8021x: "{1}" }
    # IPCFG and System lines (colons and spacing differ between models).
    - match: '^IP [Aa]ddr:?\s+(\S+)$'
      state: { network.ip_address: "{1}" }
    - match: '^Netmask:?\s+(\S+)$'
      state: { network.netmask: "{1}" }
    - match: '^Gateway:?\s+(\S+)$'
      state: { network.gateway: "{1}" }
    - match: '^MAC [Aa]ddr:?\s+(\S+)$'
      state: { network.mac_address: "{1}" }
    - match: '^Address Type:\s+(\S+)$'
      state: { network.address_type: "{1}" }
    - match: '^(?:IP|[Tt]elnet) Port:?\s+(\d+)$'
      state: { network.telnet_port: "{1}" }
    - match: '^(?:Web|HTTP) Port:?\s+(\d+)$'
      state: { network.http_port: "{1}" }
    - match: '^[Ss][Ss][Hh] Port:?\s+(\d+)$'
      state: { network.ssh_port: "{1}" }
    - match: '^Model:\s+(\S+)$'
      state: { model: "{1}" }
    - match: '^Firmware:?\s+(\S+)$'
      state: { firmware: "{1}" }
    - match: '^On/Up Time <dd HH:mm:ss>:\s+(.+)$'
      state: { uptime: "{1}" }
    - match: '^(AT-[A-Z0-9-]+)$'
      request_match: '^Type$'
      state: { model: "{1}" }
    - match: '^(\d[\w.]*)$'
      request_match: '^Version'
      state: { firmware: "{1}" }
    - match: '^CSpara ?\[(\d+,[78],[012],[12])\]$'
      state: { serial.settings: "{1}" }
    - match: '^RS232para ?\[(\d+,[78],[012],[12])\]$'
      state: { zone_serial.settings: "{1}" }
    - match: '^(?:set_host_name|SHostName|RHostName) (\S+)$'
      state: { host_name: "{1}" }
    - match: '^(\S+)$'
      request_match: '^show_host_name$'
      state: { host_name: "{1}" }
    - match: '^USBHostLogic (follow usb|follow video|manual)$'
      state: { usb.host_logic: "{1}" }
    - match: '^(?:USB|Usb)HostRoute (C|[1-3])$'
      state: { usb.host_route: "{1}" }
    - match: '^UsbVbusControl (on|off)$'
      state: { usb.vbus: { value: "{1}", map: { "on": true, "off": false } } }
    - match: '^UsbMode ([0-2]|follow usb|manual)$'
      state: { usb.mode: "{1}" }
    - match: '^UsbRoute ([1-6])$'
      state: { usb.route: "{1}" }
    - match: '^UsbCSS (on|off)$'
      state: { usb.superspeed: { value: "{1}", map: { "on": true, "off": false } } }

quirks:
  - models: [all]
    severity: critical
    text: >
      recall_preset, reset_routing (All#) and route_all change every output
      at once, on air, and cannot be undone from here; factory_reset (Mreset)
      erases the unit's settings, its network settings included, and may
      leave it unreachable at its old address.
  - models: [at-uhd-pro3-44m, at-uhd-pro3-66m, at-uhd-pro3-88m, at-uhd-pro3-1616m, at-hdr-h2h-88ma, at-ome-mh21]
    severity: warning
    text: >
      Telnet asks for a user name and password while IPLogin is on, as it is
      by default. Give the web GUI's user name and password as settings, or
      turn IPLogin off. Atlona documents neither the prompts nor the answer
      to a wrong login: the prompts here ("Username:", "Password:") and the
      greeting after a good login ("Welcome to TELNET.") are those the
      Companion module reads, and a wrong password is not recognized.
  - models: [all]
    severity: info
    text: >
      State is kept current by polling: routing, power and input signals
      every 5 s, settings once a minute. Atlona's switchers send nothing
      on their own except, with Broadcast on (PRO3, H2H) or InputBroadcast on
      (MH21), changes made in the web GUI or input changes; those answers
      look like the echoes and update state too. Changes made on the front
      panel are seen at the next poll.
  - models: [all]
    severity: info
    text: >
      API limits: front-panel lock and the IR receiver (except IRSTA on the
      H2H) have no query, so their state is known only from this
      connection's own Lock/Unlock and IRON/IROFF answers. VOUT has no query
      on PRO3 matrices, so their volume is known from set answers only, and
      not after a + or - whose answer does not name the level. The PS62's
      AUD, UsbMode and UsbRoute and the PRO3's HTTPPort, IPTimeout and the
      1616M's CSpara and RS232para have no read command. Clear, Save and
      preset contents cannot be read back.
  - models: [all]
    severity: info
    text: >
      Atlona's documents differ in small ways: All# is answered "All#" (PRO3)
      or with the new routes (H2H, PS62); routes are answered xINAVxOUT,
      or xINVxOUT in the PS62 and SW32 Status examples; pairs are separated
      by "," or ", "; the PS62's RepCmdTime is documented as "RepeatCmd n".
      The rules here accept each form. Parity is written 0, 1 or 2 in CSpara
      and RS232para: the documents show 0 for none and list None, Odd, Even
      without their digits, so 1 odd and 2 even are inferred.
  - models: [at-ome-mh21]
    severity: info
    text: >
      Not covered: SetCmd and IRSetCmd, which store the display commands the
      MH21 sends. Atlona's document gives SetCmd's syntax as "SetCmd X[Y]"
      with Y an end-of-line choice and its example as "SetCmd on CRLF"
      answered "SetCmd on CRLF [PWON]", and IRSetCmd's syntax as "IRSetCmd
      X[Y]" with the example "IRSetCmd off poweroff"; neither says where
      the command text goes. Set them in the web GUI.
  - models: [at-ome-ms42, at-ome-ps62, at-ome-sw32, at-ome-st31a, at-ome-mh21]
    severity: info
    text: >
      Atlona asks for 500 ms between commands on Omega switchers, which the
      core keeps (transport pacing), so a full settings poll takes a while.
      The MS42, PS62 and MH21 also take this API without a login on TCP
      9000 ("MCU, similar to Telnet"); open the device with that port to use
      it. Ports 9001-9004 pass data straight to the RS-232 ports of the unit
      and its HDBaseT endpoints and are not this API.
