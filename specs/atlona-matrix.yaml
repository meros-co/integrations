       set_serial, get_serial, trigger_cec, factory_reset, get_model, get_firmware]
    verification: none
    notes: >
      Inputs and outputs 1-8, all HDMI; presets 1-8. EDIDMSet takes
      default, save1-save8 or int1-int14; EDIDOut saves an output's EDID to
      mem1-mem8. A refused command is answered "Command FAILED:" and the
      command (p.4).
  - id: at-ome-ms42
    name: Atlona AT-OME-MS42 (Omega 4x2 matrix switcher with USB)
    supports:
      [route, get_routing, set_output_video, get_output_video, set_output_mute, get_output_mute,
       get_input_signals, power_on, power_off, get_power, reboot, set_blink, get_blink,
       set_display_button, get_display_button, set_front_panel_lock, set_8021x, get_8021x,
       set_dhcp, get_dhcp, set_static_ip, get_network, set_analog_audio, get_analog_audio,
       set_hdmi_5v_keep, get_hdmi_5v_keep, set_repeat, get_repeat, set_repeat_count, get_repeat_count,
       send_display_serial, set_usb_host_logic, get_usb_host_logic, set_usb_host_route, get_usb_host_route,
       set_usb_vbus, get_usb_vbus, factory_reset, get_model, get_firmware]
    verification: none
    notes: >
      Inputs 1 USB-C, 2 DisplayPort, 3 HDMI 1, 4 HDMI 2; outputs 1 HDMI and
      2 HDBaseT. USB host routes C, 1, 2 or 3 (the remote host over
      HDBaseT).
  - id: at-ome-ps62
    name: Atlona AT-OME-PS62 (Omega 6x2 matrix presentation switcher with USB)
    supports:
      [route, route_all, reset_routing, get_routing, set_output_mute, get_output_mute,
       set_output_volume, increase_output_volume, decrease_output_volume, get_output_volume,
       set_analog_audio_source, set_mono, get_mono, get_input_signals, get_input_signal,
       set_blink, get_blink, set_comma_wait, get_comma_wait, set_front_panel_lock,
       set_dhcp, get_dhcp, set_static_ip, get_network, set_repeat, get_repeat, set_repeat_count_ps62,
       set_zone_serial, get_zone_serial, send_zone_serial, set_usb_mode_ps62, set_usb_route,
       factory_reset, get_model, get_firmware]
    verification: none
    notes: >
      Six inputs (HDMI, USB-C and two HDBaseT, numbered 1-6 as on the rear
      panel) to outputs 1 and 2, with two analog audio outputs. VOUT and
      VOUTMute zones: 1 HDBaseT out, 2 HDMI out, 3 analog out 1, 4 analog out
      2; VOUT -90 to 10. RS-232 zones 1 (HDBaseT input 1), 2 (HDBaseT input
      2), 3 (HDBaseT output). It has no power commands.
  - id: at-ome-sw32
    name: Atlona AT-OME-SW32 (Omega 3x2 matrix switcher for HDMI and USB-C)
    supports:
      [route, get_routing, set_output_video, get_output_video, set_output_mute, get_output_mute,
