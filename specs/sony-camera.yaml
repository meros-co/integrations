    returns: ack
  cancel_media_format:
    summary: "Cancel a format in progress"
    returns: ack
  power_off:
    summary: "Put the camera into standby; it is woken with its power button"
    returns: ack
  camera_standby:
    summary: "Put the camera into standby"
    returns: ack
  power_on:
    summary: "Wake the camera from standby"
    returns: ack
  stream:
    summary: "Start or stop streaming to the selected destination"
    params:
      streaming: { type: bool, required: true }
    returns: ack
  timecode_preset_reset:
    summary: "Reset the timecode preset"
    returns: ack
  user_bits_preset_reset:
    summary: "Reset the user bits preset"
    returns: ack
  remote_key:
    summary: "A menu navigation key. Without pressed, press and release"
    params:
      key: { type: enum, values: [up, down, left, right, up_right, down_right, up_left, down_left, set, menu, back, display], required: true }
      pressed: { type: bool }
    returns: ack
  pan_tilt_absolute:
    summary: "Move pan and/or tilt to absolute angles in degrees (pan positive anticlockwise seen from above, tilt positive upward), at speeds up to the model maximum; the result arrives as pan_tilt.last_result"
    params:
      pan: { type: float, min: -360, max: 360 }
      tilt: { type: float, min: -360, max: 360 }
      pan_speed: { type: int, min: 0, max: 127, default: 12 }
      tilt_speed: { type: int, min: 0, max: 127, default: 12 }
    returns: ack
  pan_tilt_relative:
    summary: "Move pan and/or tilt by angles in degrees from where they are; a move past the pan range is ignored by the camera"
    params:
      pan: { type: float, min: -360, max: 360 }
      tilt: { type: float, min: -360, max: 360 }
      pan_speed: { type: int, min: 0, max: 127, default: 12 }
      tilt_speed: { type: int, min: 0, max: 127, default: 12 }
    returns: ack
  pan_tilt_drive:
    summary: "Pan and tilt continuously at signed speeds until stopped or at the end of travel; both 0 stops"
    params:
      pan_speed: { type: int, min: -127, max: 127, default: 0 }
      tilt_speed: { type: int, min: -127, max: 127, default: 0 }
    returns: ack
  pan_tilt_stop:
    summary: "Stop any pan/tilt move or preset recall"
    returns: ack
  pan_tilt_home:
    summary: "Move pan and tilt to their home position (0, 0)"
    returns: ack
  pan_tilt_reset:
    summary: "Reinitialise pan and tilt, for when their status reads unknown"
    returns: ack
  preset_recall:
    summary: "Recall a pan/tilt/zoom/focus preset; completion arrives as pan_tilt.preset_result"
    params:
      preset: { type: int, min: 0, max: 65535, required: true }
    returns: ack
  preset_set:
    summary: "Store the current pan, tilt, zoom and focus as a preset"
    params:
      preset: { type: int, min: 0, max: 65535, required: true }
      thumbnail: { type: bool, default: true }
    returns: ack
  preset_clear:
    summary: "Delete a preset"
    params:
      preset: { type: int, min: 0, max: 65535, required: true }
    returns: ack

