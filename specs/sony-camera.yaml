spec: 1
id: sony-camera
name: Sony cameras over Camera Control PTP 3 and PTP 2 (Alpha, FX, ZV, cinema line, pan/tilt)
vendor: Sony
category: camera
implementation: native
reason: >
  PTP-IP on two TCP connections (command and event), each opened with its own
  Init handshake that carries the initiator's GUID, friendly name and the
  connection number the camera assigns; one PTP transaction at a time, with
  data phases split across Start Data and End Data packets. Sony's
  authentication follows (SDIO_Connect in three phases around
  SDIO_GetExtDeviceInfo, which is repeated until it returns data), the session
  is opened in one of three function modes that decide what else the camera
  allows, and the camera's state is a binary property-description array whose
  values, forms and enumerations are typed per property and read again on
  events and on a poll. Camera Control PTP 2 bodies change some values only by
  steps, computed from the camera's own value list. Live view, content lists and
  downloads are binary datasets on the same transaction queue, downloads are
  streamed to a file, and pan/tilt and video-only bodies serve live view and
  clips over HTTP on their own localhost, reached through the SSH tunnel.
  Pairing waits on an operator's approval at the camera, and secured cameras
  take PTP-IP only through an SSH tunnel.

source:
  - title: "Camera Control PTP 3 Reference (Camera Remote Command 2.02.00, document dated June 2026)"
    author: "Sony Corporation"
    note: >
      Licensed to Meros by Sony under the Camera Remote Command licence; the document is not
      redistributed and nothing from it is copied here. Used: Overview; For Connections Using
      PTP-IP (TCP 15740, camera settings, Device Discovery with dd.xml and DigitalImagingDesc.xml,
      Connection by SSH, Connection by Pairing); Connect; Get Property; Set Property; Send Control
      Command; About Events; Get Image File; Live View; Live View for Pan/Tilt Type Cameras;
      Content Transfer Mode; Acquiring Content from Video Only Models; Disconnect; Command List
      (operations, device properties, controls, events, vendor response codes); Compatibility
      (per-model operations, properties, controls and events, from which each model's supports
      list is derived); Operations (GetStorageIDs, GetObjectHandles, GetObjectInfo, GetObject,
      SDIO_Connect, SDIO_GetExtDeviceInfo, SDIO_SetExtDevicePropValue, SDIO_ControlDevice,
      SDIO_GetAllExtDevicePropInfo, SDIO_OpenSession, SDIO_GetPartialLargeObject,
      SDIO_SetContentsTransferMode, SDIO_GetFTPJobList, SDIO_ControlFTPJobList,
      SDIO_GetFTPSettingList, SDIO_SetFTPSettingList, SDIO_GetDisplayFTPResult,
      SDIO_GetContentInfoList, SDIO_GetContentData, SDIO_GetContentCompressedData,
      SDIO_ControlPTZF, SDIO_SetPresetPTZF, SDIO_GetExtDeviceProp); Device Properties and Controls
      (codes, datatypes and value meanings of the properties and controls this module names);
      Events; Data Format (FTPSettingList, FTPJobList, ControlPTZF, SetPresetPTZF,
      ContentInfoList, FTPResultDataset); Tips (PTZF Operation, Detailed SDIO_ControlPTZF Usage,
      Preset PTZF Operation, Remote Control with Transfer Mode).
  - title: "Camera Control PTP 2 Reference (Camera Remote Command 2.02.00, document dated June 2026)"
    author: "Sony Corporation"
    note: >
      Licensed with the reference above and not redistributed. Used: Overview; Connect (the
      2.00 handshake); Get Property; Set Property; Send Control Command (step controls); Get
      Image File; Live View; Command List; Compatibility (per-model operations, properties,
      controls and events, merged into each model's supports list); Operations (GetObject and
      the live view dataset, SDIO_GetExtDeviceInfo, SDIO_GetAllExtDevicePropInfo,
      SDIO_SetExtDevicePropValue, SDIO_ControlDevice); Controls (the step controls and the PTP 2
      buttons).
  - title: "Camera Remote Command 2.02.00 README"
    author: "Sony Corporation"
    note: >
      Licensed with the references above and not redistributed. Protocol Compatibility (which
      models speak Camera Control PTP 3 and which PTP 2) and the USB/IP table; the models listed
      here are those marked for IP and for either protocol. PXW-Z380 is called PXW-Z300 in
      Sony's documents.
  - title: "ISO 15740:2013 Photography - Electronic still picture imaging - Picture transfer protocol (PTP) for digital still photography devices"
    author: "ISO"
    note: >
      The PTP-IP transport the Sony references build on: packet header (length and type), Init
      Command and Init Event request/ack/fail, operation request and response, event, Start
      Data / Data / End Data, probe; PTP datatypes, strings and arrays; DeviceInfo, ObjectInfo,
      OpenSession and CloseSession; standard response codes.
  - title: "RFC 9112 HTTP/1.1"
    author: "IETF"
    note: >
      The request and response framing (Content-Length, chunked transfer coding) the module
      speaks over the SSH tunnel for pan/tilt live view and video-only clips.

settings:
  # plain: PTP-IP straight to TCP 15740 (the port can be overridden).
  # pairing: the camera's pairing menu is showing; it asks the operator to
  #   approve friendly_name, and the module waits without a timeout.
  # ssh: Access Authentication is on; PTP-IP goes through an SSH tunnel to the
  #   camera's localhost:15740 (the port override then applies to SSH, 22).
  connection: { type: enum, values: [plain, pairing, ssh], default: plain }
  # Shown on the camera's pairing prompt and stored with the approval.
  friendly_name: { type: string, max_length: 39, default: Meros }
  # The initiator GUID the camera remembers after pairing (up to 20 per
  # camera). Unset: derived from friendly_name, so it is stable as long as the
  # name is. Set it to keep one approval across renamed installations.
  guid: { type: string, pattern: "^([0-9A-Fa-f]{32}|[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})$" }
  # The camera's SSH user and password (set on the camera under its access
  # authentication settings), for connection: ssh.
  ssh_username: { type: string }
  ssh_password: { type: string, secret: true }
  # The camera's SSH host key fingerprint as OpenSSH prints it
  # (SHA256:...), checked on every connection. Unset: not verified.
  ssh_fingerprint: { type: string, pattern: "^SHA256:[A-Za-z0-9+/=]+$" }
  # How often the camera's changed properties are read, in addition to the
  # reads its change events trigger.
  poll_ms: { type: int, min: 250, max: 60000, default: 1000 }
  # Which Camera Control protocol to speak. auto: PTP 2 for bodies that have
  # only PTP 2 (ILCE-7M3), PTP 3 for the rest; a body that answers PTP 3 with
  # a 2.xx version is driven with PTP 2.
  protocol: { type: enum, values: [auto, ptp3, ptp2], default: auto }
  # The session's function mode. auto: remote_with_transfer on bodies whose
  # compatibility tables list its content operations, remote otherwise. A
  # mode the camera refuses falls back to remote. switch_session_mode changes
  # it while connected.
  session_mode: { type: enum, values: [auto, remote, remote_with_transfer, content_transfer], default: auto }
  # In content_transfer mode, who chooses the content: remote (this side
  # reaches the whole card) or camera (the operator picks on the camera and
  # only that reaches this side).
  content_selection: { type: enum, values: [remote, camera], default: remote }
  # The shortest time between the starts of two live view image requests
  # while the live stream is watched (PTP bodies). 33 ms is the 30 frames a
  # second a camera serves at most; raise it to spare the network.
  live_interval_ms: { type: int, min: 0, max: 10000, default: 33 }


