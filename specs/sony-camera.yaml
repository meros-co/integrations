    params:
      value: { type: enum, values: [s_gamut3_slog3, s_gamut3_cine_slog3], required: true }
    returns: ack
  set_user_base_look_output:
    summary: "Set base look output (Sony: UserBaseLook Output, 0xD2B1)"
    params:
      value: { type: enum, values: [bt709, bt709_legal, hlg, hlg_legal], required: true }
    returns: ack
  set_user_base_look_ae_offset:
    summary: "Set base look ae level offset (Sony: UserBaseLook AE Level Offset, 0xD0CA)"
    params:
      value: { type: int, required: true }
    returns: ack
  set_property:
    summary: "Write any property by code, with a raw value in the property's own type (a number, 0x-hex text, or text for string properties). Checked against what the camera reports as writable and accepted"
    params:
      code: { type: string, pattern: "^(0[xX])?[0-9A-Fa-f]{1,4}$", required: true }
      value: { type: json, required: true }
    returns: ack
  get_property:
    summary: "The property as last read from the camera: value, type, writable, enabled, and its accepted values or range"
    params:
      code: { type: string, pattern: "^(0[xX])?[0-9A-Fa-f]{1,4}$", required: true }
    returns: value
  control:
    summary: "Send any SDIO control code with a raw value. The value's type is the documented one for known codes, else uint16 unless 'type' says otherwise"
    params:
      code: { type: string, pattern: "^(0[xX])?[0-9A-Fa-f]{1,4}$", required: true }
      value: { type: json, required: true }
      type: { type: enum, values: [int8, uint8, int16, uint16, int32, uint32, int64, uint64, string] }
    returns: ack
  refresh:
    summary: "Read every property again now rather than waiting for the next changes-only read"
    returns: ack
  set_shutter_speed:
    summary: "Set the shutter speed: 1/50, 1.5\" (seconds), or bulb. Uses the stills shutter speed where the camera has it, otherwise the cinema shutter speed value"
    params:
      value: { type: string, pattern: "^(1/[0-9]{1,5}|[0-9]{1,4}(\\.[0-9])?\"?|bulb)$", required: true }
    returns: ack
  set_tally:
    summary: "Turn one tally lamp on the camera on or off"
    params:
      lamp: { type: enum, values: [red, green, yellow], required: true }
      lit: { type: bool, required: true }
    returns: ack
  set_audio_level:
    summary: "Set the recording level of an audio input channel, in the range the camera reports"
    params:
      channel: { type: int, min: 1, max: 4, required: true }
      level: { type: int, min: 0, max: 65535, required: true }
    returns: ack
  set_audio_level_control:
    summary: "Set automatic or manual level control for an audio input channel"
    params:
      channel: { type: int, min: 1, max: 4, required: true }
      mode: { type: enum, values: [auto, manual], required: true }
    returns: ack
  set_audio_input:
    summary: "Select the source of an audio input channel"
    params:
      channel: { type: int, min: 1, max: 4, required: true }
      input: { type: enum, values: ["off", input1, input2, internal_mic, shoe_ch1, shoe_ch2, mic_jack_left, mic_jack_right], required: true }
    returns: ack
  set_zoom_position:
    summary: "Drive the zoom to an absolute position, in the range the camera reports; the result arrives as zoom.last_position_result"
    params:
      position: { type: int, min: 0, max: 65535, required: true }
    returns: ack
  set_focus_position:
    summary: "Drive the focus to an absolute position, in the range the camera reports; the result arrives as focus.last_position_result"
    params:
      position: { type: int, min: 0, max: 65535, required: true }
    returns: ack
  cancel_zoom_position:
    summary: "Stop a zoom position drive"
    returns: ack
  cancel_focus_position:
    summary: "Stop a focus position drive"
    returns: ack
  zoom:
    summary: "Zoom continuously: positive toward tele, negative toward wide, 0 stops. Sent at full resolution where the camera has the 16-bit zoom control, otherwise scaled to its coarse zoom speed range"
    params:
      speed: { type: int, min: -32767, max: 32767, required: true }
    returns: ack
  focus:
    summary: "Focus continuously: positive toward far, negative toward near, 0 stops. Scaled as for zoom"
    params:
      speed: { type: int, min: -32767, max: 32767, required: true }
    returns: ack
  focus_near_far:
    summary: "Step the focus toward near (negative) or far (positive)"
    params:
      step: { type: int, min: -7, max: 7, required: true }
    returns: ack
  save_zoom_focus_position:
    summary: "Store the current zoom and focus positions in a slot"
    params:
      slot: { type: int, min: 0, max: 255, required: true }
    returns: ack
  load_zoom_focus_position:
    summary: "Recall zoom and focus positions stored in a slot"
    params:
      slot: { type: int, min: 0, max: 255, required: true }
    returns: ack
  shutter_half_press:
    summary: "Half-press the shutter button (focus and meter). Without pressed, press and release; with it, hold or release"
    params:
      pressed: { type: bool }
    returns: ack
  shutter_full_press:
    summary: "Fully press the shutter button. Press it only while half-pressed, and release in the reverse order"
    params:
      pressed: { type: bool }
    returns: ack
  take_photo:
    summary: "Half and full press together, then release: one still (on Camera Control PTP 2 bodies without that button, the one-shot release)"
    returns: ack
  record:
    summary: "Start or stop movie recording (the hold-type record button: pressed starts, released stops)"
    params:
      recording: { type: bool, required: true }
    returns: ack
  record_toggle:
    summary: "Press and release the movie record button, toggling recording"
    returns: ack
  ae_lock:
    summary: "The AE lock button. Without pressed, press and release"
    params:
      pressed: { type: bool }
    returns: ack
  awb_lock:
    summary: "The AWB lock button. Without pressed, press and release"
    params:
      pressed: { type: bool }
    returns: ack
  fe_lock:
    summary: "The flash exposure lock button. Without pressed, press and release"
    params:
      pressed: { type: bool }
    returns: ack
  tracking_af_on:
    summary: "The tracking on + AF on button. Without pressed, press and release"
    params:
      pressed: { type: bool }
    returns: ack
  push_auto_focus:
    summary: "Push auto focus (one-shot AF in manual focus, manual while held in AF). Without pressed, press and release"
    params:
      pressed: { type: bool }
    returns: ack
  push_auto_iris:
    summary: "Push auto iris. Without pressed, press and release"
    params:
      pressed: { type: bool }
    returns: ack
  push_agc:
    summary: "Push automatic gain control. Without pressed, press and release"
    params:
      pressed: { type: bool }
    returns: ack
  push_auto_nd:
    summary: "Push auto ND filter. Without pressed, press and release"
    params:
      pressed: { type: bool }
    returns: ack
  one_push_awb:
    summary: "One-push auto white balance. Without pressed, press and release"
    params:
      pressed: { type: bool }
    returns: ack
  af_area_position:
    summary: "Move the AF area to a point on a 640 x 480 grid"
    params:
      x: { type: int, min: 0, max: 639, required: true }
      y: { type: int, min: 0, max: 479, required: true }
    returns: ack
  color_temperature_step:
    summary: "Step the colour temperature"
    params:
      step: { type: int, min: -30, max: 30, required: true }
    returns: ack
  tint_step:
    summary: "Step the white balance tint"
    params:
      step: { type: int, min: -198, max: 198, required: true }
    returns: ack
  custom_wb_capture_standby:
    summary: "Enter custom white balance capture standby"
    returns: ack
  custom_wb_capture_cancel:
    summary: "Leave custom white balance capture standby"
    returns: ack
  custom_wb_capture:
    summary: "Capture custom white balance at a point inside the area the camera reports; the result arrives as white_balance.custom_capture_result"
    params:
      x: { type: int, min: 0, max: 65535, required: true }
      y: { type: int, min: 0, max: 65535, required: true }
    returns: ack
  flicker_scan:
    summary: "Scan for light flicker"
    returns: ack
  format_media:
    summary: "Format the card in a slot. Erases everything on it; the result arrives as media.last_format_result. Camera Control PTP 2 bodies format their one card and ignore slot and quick"
    params:
      slot: { type: int, min: 1, max: 2, required: true }
      quick: { type: bool, default: false }
    returns: ack
  cancel_media_format:
    summary: "Cancel a format in progress"
    returns: ack
  power_off:
    summary: "Put the camera into standby; it is woken with its power button"
    returns: ack
  camera_standby:
    summary: "Put the camera into standby"
    returns: ack
  power_on:
    summary: "Wake the camera from standby"
    returns: ack
  stream:
    summary: "Start or stop streaming to the selected destination"
    params:
      streaming: { type: bool, required: true }
    returns: ack
  timecode_preset_reset:
    summary: "Reset the timecode preset"
    returns: ack
  user_bits_preset_reset:
    summary: "Reset the user bits preset"
    returns: ack
  remote_key:
    summary: "A menu navigation key. Without pressed, press and release"
    params:
      key: { type: enum, values: [up, down, left, right, up_right, down_right, up_left, down_left, set, menu, back, display], required: true }
      pressed: { type: bool }
    returns: ack
  pan_tilt_absolute:
    summary: "Move pan and/or tilt to absolute angles in degrees (pan positive anticlockwise seen from above, tilt positive upward), at speeds up to the model maximum; the result arrives as pan_tilt.last_result"
    params:
      pan: { type: float, min: -360, max: 360 }
      tilt: { type: float, min: -360, max: 360 }
      pan_speed: { type: int, min: 0, max: 127, default: 12 }
      tilt_speed: { type: int, min: 0, max: 127, default: 12 }
    returns: ack
  pan_tilt_relative:
    summary: "Move pan and/or tilt by angles in degrees from where they are; a move past the pan range is ignored by the camera"
    params:
      pan: { type: float, min: -360, max: 360 }
      tilt: { type: float, min: -360, max: 360 }
      pan_speed: { type: int, min: 0, max: 127, default: 12 }
      tilt_speed: { type: int, min: 0, max: 127, default: 12 }
    returns: ack
  pan_tilt_drive:
    summary: "Pan and tilt continuously at signed speeds until stopped or at the end of travel; both 0 stops"
    params:
      pan_speed: { type: int, min: -127, max: 127, default: 0 }
      tilt_speed: { type: int, min: -127, max: 127, default: 0 }
    returns: ack
  pan_tilt_stop:
    summary: "Stop any pan/tilt move or preset recall"
    returns: ack
  pan_tilt_home:
    summary: "Move pan and tilt to their home position (0, 0)"
    returns: ack
  pan_tilt_reset:
    summary: "Reinitialise pan and tilt, for when their status reads unknown"
    returns: ack
  preset_recall:
    summary: "Recall a pan/tilt/zoom/focus preset; completion arrives as pan_tilt.preset_result"
    params:
      preset: { type: int, min: 0, max: 65535, required: true }
    returns: ack
  preset_set:
    summary: "Store the current pan, tilt, zoom and focus as a preset"
    params:
      preset: { type: int, min: 0, max: 65535, required: true }
      thumbnail: { type: bool, default: true }
    returns: ack
  preset_clear:
    summary: "Delete a preset"
    params:
      preset: { type: int, min: 0, max: 65535, required: true }
    returns: ack
  exposure_step:
    summary: "Step a value a Camera Control PTP 2 body only reports (iris, shutter speed, ISO, exposure or flash compensation) up or down by notches; the typed setters convert a target value into such steps"
    params:
      target: { type: enum, values: [iris, exposure_compensation, flash_compensation, shutter_speed, iso], required: true }
      steps: { type: int, min: -127, max: 127, required: true }
    returns: ack
  af_lock:
    summary: "The AF lock button (Camera Control PTP 2). Without pressed, press and release"
    params:
      pressed: { type: bool }
    returns: ack
  release_lock:
    summary: "Lock or unlock the shutter release (Camera Control PTP 2)"
    params:
      locked: { type: bool, required: true }
    returns: ack
  af_mf_hold:
    summary: "The AF/MF hold button (Camera Control PTP 2). Without pressed, press and release"
    params:
      pressed: { type: bool }
    returns: ack
  focus_magnifier:
    summary: "Press the focus magnifier button (Camera Control PTP 2)"
    returns: ack
  focus_magnifier_cancel:
    summary: "Leave the focus magnifier (Camera Control PTP 2)"
    returns: ack
  focus_step:
    summary: "One focus step toward near or far (Camera Control PTP 2)"
    params:
      direction: { type: enum, values: [near, far], required: true }
    returns: ack
  hfr_standby:
    summary: "Enter high frame rate recording standby (Camera Control PTP 2)"
    returns: ack
  hfr_recording_cancel:
    summary: "Cancel a high frame rate recording (Camera Control PTP 2)"
    returns: ack
  get_live_view_image:
    summary: "One live view frame as a base64 JPEG with its width and height (and, from PTP 3 bodies, the focus frame data). Poll it for a preview: the camera serves up to 30 frames a second. Pan/tilt bodies serve it over HTTP through the SSH tunnel"
    returns: value
  list_content:
    summary: "List the contents of a card slot: the content list in remote_with_transfer mode, the PTP objects in content_transfer mode, or the MediaProfile clips of a video-only body (over SSH). Each file has the id download_content takes"
    params:
      slot: { type: int, min: 1, max: 3, default: 1 }
      limit: { type: int, min: 1, max: 10000, default: 100 }
      since: { type: int, min: 0 }
    returns: value
  download_content:
    summary: "Download a listed file into a file on the host, streamed as it arrives; the result is the path and the byte count. Name the file by id, or by umid (remote_with_transfer lists), which stays valid when the camera renumbers its contents. resume continues a partial file already at path instead of starting again"
    params:
      id: { type: string, max_length: 1024 }
      umid: { type: string, pattern: "^[0-9A-Fa-f]{64}$" }
      path: { type: string, max_length: 4096, required: true }
      resume: { type: bool, default: false }
    returns: value
  download_captured_image:
    summary: "Download the image just shot from the camera transfer buffer (while still.pending_files is not zero) into a file on the host"
    params:
      path: { type: string, max_length: 4096, required: true }
    returns: value
  get_thumbnail:
    summary: "The thumbnail of a listed still (remote_with_transfer mode) as a base64 JPEG"
    params:
      id: { type: string, max_length: 1024, required: true }
    returns: value
  switch_session_mode:
    summary: "Close the session and open it again in another mode: remote (control only), remote_with_transfer (control and content list), content_transfer (card access, no control)"
    params:
      mode: { type: enum, values: [remote, remote_with_transfer, content_transfer], required: true }
    returns: ack
  get_ftp_settings:
    summary: "The camera's FTP server list (no passwords); also kept in ftp.servers"
    returns: value
  set_ftp_server:
    summary: "Write one FTP server entry. The password goes to the camera only and is never put in the state; leave it out to keep the one the camera has"
    params:
      server_id: { type: int, min: 1, max: 65535, required: true }
      name: { type: string, max_length: 64 }
      host: { type: string, max_length: 255, required: true }
      port: { type: int, min: 1, max: 65535, default: 21 }
      username: { type: string, max_length: 64 }
      password: { type: string, max_length: 64 }
      passive: { type: bool, default: true }
      directory: { type: string, max_length: 255 }
      secure: { type: enum, values: ["off", ftps, sftp], default: "off" }
      directory_hierarchy: { type: enum, values: [standard, same_as_camera], default: standard }
      overwrite: { type: bool, default: false }
      certificate_error: { type: enum, values: [connect, do_not_connect], default: do_not_connect }
    returns: ack
  get_ftp_jobs:
    summary: "The camera's FTP transfer jobs (video bodies); also kept in ftp.jobs"
    returns: value
  add_ftp_job:
    summary: "Queue a clip for FTP upload by the camera, by its path relative to the MediaProfile (for example /Clip/C0001.MXF)"
    params:
      server_id: { type: int, min: 0, max: 4294967295, required: true }
      slot: { type: int, min: 1, max: 3, required: true }
      clip_path: { type: string, max_length: 254, required: true }
      directory: { type: string, max_length: 255 }
      name: { type: string, max_length: 127 }
    returns: ack
  ftp_job:
    summary: "Suspend, resume or delete a transfer job, or delete all or all finished jobs"
    params:
      action: { type: enum, values: [suspend, resume, delete, delete_all, delete_finished], required: true }
      job_id: { type: int, min: 0, max: 4294967295 }
    returns: ack
  get_ftp_result:
    summary: "How many images the camera has transferred and failed to transfer by FTP from a slot"
    params:
      slot: { type: int, min: 1, max: 2, required: true }
    returns: value
  import_lut:
    summary: "Import a cube LUT (.cube with a LUT_3D_SIZE or LUT_1D_SIZE line) from a host file into a user base look; the result is the camera's import result. Refused while files.lut.import_available is false"
    params:
      path: { type: string, max_length: 4096, required: true }
      user_base_look: { type: int, min: 1, max: 16, required: true }
      name: { type: string, max_length: 255 }
    returns: value
  import_scene_file:
    summary: "Import a scene file from a host file into a scene slot; the result is the camera's import result"
    params:
      path: { type: string, max_length: 4096, required: true }
      scene: { type: int, min: 1, max: 16, required: true }
      name: { type: string, max_length: 255 }
    returns: value
  export_scene_file:
    summary: "Save a scene slot to a host file (files.scene.exportable lists what the camera offers)"
    params:
      scene: { type: int, min: 1, max: 16, required: true }
      path: { type: string, max_length: 4096, required: true }
    returns: value
  import_grid_line_file:
    summary: "Import a custom grid line image (at most 1 MB) from a host file into Custom 1 to 4, sent in parts no larger than the camera takes; needs the camera's grid line licence"
    params:
      path: { type: string, max_length: 4096, required: true }
      custom: { type: int, min: 1, max: 4, required: true }
      name: { type: string, max_length: 255 }
    returns: value
  export_camera_settings:
    summary: "Save the camera-setting file to a host file"
    params:
      path: { type: string, max_length: 4096, required: true }
    returns: value
  import_camera_settings:
    summary: "Load a camera-setting file from a host file into the camera; the result is the camera's read result"
    params:
      path: { type: string, max_length: 4096, required: true }
    returns: value
  export_ftp_settings_file:
    summary: "Save the camera's FTP-setting file to a host file, protected with the password given (empty for none)"
    params:
      path: { type: string, max_length: 4096, required: true }
      password: { type: string, pattern: "^[A-Za-z0-9]{0,32}$" }
    returns: value
  import_ftp_settings_file:
    summary: "Load an FTP-setting file from a host file into the camera, with the password it was saved with"
    params:
      path: { type: string, max_length: 4096, required: true }
      password: { type: string, pattern: "^[A-Za-z0-9]{0,32}$" }
    returns: value
  apply_settings_file:
    summary: "Send a general setting XML file to the camera to check it (check_only) or apply it; the value holds the result and the camera's result XML"
    params:
      path: { type: string, max_length: 4096, required: true }
      check_only: { type: bool, default: false }
    returns: value
  delete_content:
    summary: "Delete one content (all of its files) from a card, by the id list_content gave (c:slot:content); needs remote_with_transfer mode. The camera's result decides success; protected content is not deleted"
    params:
      id: { type: string, max_length: 64, pattern: "^c:[12]:[0-9]{1,10}(:[0-9]{1,5})?$", required: true }
    returns: ack
  get_display_lists:
    summary: "The camera's own display names for values (base looks, scene files, buttons, stream destinations and more), one list type or all (0); also kept in display_lists and used to name the base look, scene file and stream destination in the state"
    params:
      list_type: { type: int, min: 0, max: 27, default: 0 }
    returns: value
  get_lens_information:
    summary: "The attached lens's focus conversion tables (normalised focus position to distance, in metres or feet); the metre tables are also kept in lens.focus_tables. Needs lens.information_available"
    params:
      unit: { type: enum, values: [meters, feet], default: meters }
    returns: value
  get_zoom_focus_presets:
    summary: "The zoom and focus presets the camera holds (the slots save_zoom_focus_position uses, numbered from 0): whether set, the lens, zoom and focus distance, and the zoom-only setting; also kept in zoom_focus_presets"
    returns: value
  set_preset_zoom_only:
    summary: "Make a zoom and focus preset recall only the zoom, or zoom and focus"
    params:
      slot: { type: int, min: 0, max: 255, required: true }
      zoom_only: { type: bool, required: true }
    returns: ack
  get_osd_image:
    summary: "The camera's on-screen display overlay as a base64 PNG with its size and where it sits on the picture. Needs set_osd_image_mode true first"
    returns: value
  get_restriction_info:
    summary: "Which operations, properties and controls the camera blocks while remote control is restricted (status.remote_restricted); also kept in restrictions"
    returns: value
  get_licenses:
    summary: "The licences installed on the camera with their remaining hours; also kept in licenses"
    returns: value
  get_operation_results_supported:
    summary: "Which operation and target pairs the camera reports results for in operation.last; also kept in operation.results_supported"
    returns: value
  get_clock:
    summary: "The camera's date and time, UTC offset and daylight saving; also kept in clock"
    returns: value
  set_clock:
    summary: "Set the camera's date and time (local, YYYYMMDDThhmmss.s), UTC offset (+hhmm or -hhmm) and daylight saving, any of them; the result arrives as clock.last_result"
    params:
      date_time: { type: string, pattern: "^[0-9]{8}T[0-9]{6}(\\.[0-9])?$" }
      utc_offset: { type: string, pattern: "^[+-][0-9]{4}$" }
      daylight_saving: { type: bool }
    returns: ack
  set_date_time:
    summary: "Set the camera's date and time from an ISO 8601 text; the result arrives as clock.last_result"
    params:
      value: { type: string, max_length: 64, required: true }
    returns: ack
  get_stream_settings:
    summary: "The camera's stream destinations (protocol, URL, port, latency and so on; keys only as set or not); also kept in streaming.settings"
    returns: value
  set_stream_settings:
    summary: "Write one stream destination. Keys go to the camera only and are never put in the state; the camera's check of the URL, port and key decides success"
    params:
      stream: { type: int, min: 1, max: 65535, required: true }
      protocol: { type: enum, values: [rtmp, srt], required: true }
      url: { type: string, max_length: 1024, required: true }
      port: { type: int, min: 1, max: 65535 }
      key: { type: string, max_length: 1024 }
      latency_ms: { type: int, min: 20, max: 8000 }
      ttl: { type: int, min: 1, max: 255 }
      cipher_type: { type: int, min: 0, max: 255 }
      cipher_key: { type: string, max_length: 79 }
      mode: { type: int, min: 0, max: 255 }
    returns: ack
  execute_eframing:
    summary: "Run an eframing command: none, auto, single or ptz (single and ptz frame the rectangle given as fractions of the picture, from the top left, absolute or relative to the current crop), hold, or zoom_out"
    params:
      type: { type: enum, values: [none, auto, single, ptz, hold, zoom_out], required: true }
      x: { type: float, min: 0, max: 1 }
      y: { type: float, min: 0, max: 1 }
      width: { type: float, min: 0, max: 1 }
      height: { type: float, min: 0, max: 1 }
      relative: { type: bool, default: false }
    returns: ack
  camera_button:
    summary: "Press one of the camera's own buttons (camera_controls.buttons lists them), by name or hex code. Without pressed, press and release; simultaneous uses the function that may hold several at once"
    params:
      button: { type: string, pattern: "^([a-z0-9_]{1,20}|0x[0-9A-Fa-f]{1,4})$", required: true }
      pressed: { type: bool }
      simultaneous: { type: bool, default: false }
    returns: ack
  camera_dial:
    summary: "Turn one of the camera's dials (camera_controls.dials) by a number of clicks, negative anticlockwise"
    params:
      dial: { type: enum, values: [control_wheel, front_dial, rear_dial_left, rear_dial_right], required: true }
      steps: { type: int, min: -32767, max: 32767, required: true }
    returns: ack
  camera_lever:
    summary: "Move the camera's zoom lever to a position in camera_controls.lever_range (0 releases it)"
    params:
      lever: { type: enum, values: [tele_wide], default: tele_wide }
      value: { type: int, min: -128, max: 127, required: true }
    returns: ack
  pixel_shift_mode:
    summary: "Turn pixel shift multi shooting on or off (Camera Control PTP 2)"
    params:
      enabled: { type: bool, required: true }
    returns: ack
  pixel_shift_cancel:
    summary: "Cancel pixel shift shooting in progress (Camera Control PTP 2)"
    returns: ack
  delete_user_base_look:
    summary: "Delete a user base look (1 to 16), or all of them. There is no undo"
    params:
      user: { type: int, min: 1, max: 16 }
      all: { type: bool, default: false }
    returns: ack
  select_user_base_look:
    summary: "Choose the user base look (1 to 16) that set_user_base_look_input, _output and _ae_offset change"
    params:
      user: { type: int, min: 1, max: 16, required: true }
    returns: ack
  set_pplut_base_look:
    summary: "Choose the user base look (1 to 16) applied in the camera PPLUT"
    params:
      user: { type: int, min: 1, max: 16, required: true }
    returns: ack

streams:
  live:
    format: jpeg
    summary: "The camera's live view, one JPEG per frame, while watched: requested back to back from PTP bodies (at most one request in flight, no faster than live_interval_ms) and read from the HTTP live view stream of pan/tilt bodies through the SSH tunnel"
    models: [ilce-1m2, ilce-1, ilce-9m3, ilce-9m2, ilce-7rm6, ilce-7rm5, ilce-7rm4a, ilce-7rm4, ilce-7m5, ilce-7m4,
             ilce-7m3, ilce-7sm3, ilce-7cm2, ilce-7cr, ilce-7c, ilce-6700, ilx-lr1, ilme-fr7, ilme-fx3, ilme-fx2,
             ilme-fx30, zv-e1, zv-e10m2, zv-e10, dsc-rx1rm3, brc-am7]

