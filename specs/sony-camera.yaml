commands:
  set_exposure_mode:
    summary: "Set exposure mode (Sony: Exposure Program Mode, 0x500E)"
    params:
      value: { type: enum, values: [manual, program, aperture_priority, shutter_priority, program_creative, program_action, portrait, auto, auto_plus, program_aperture, program_shutter, scene_sports, scene_sunset, scene_night, scene_landscape, scene_macro, scene_handheld_twilight, scene_night_portrait, scene_anti_motion_blur, scene_pet, scene_food, scene_fireworks, scene_high_sensitivity, memory_recall, continuous_priority_ae, tele_zoom_continuous_8, tele_zoom_continuous_10, continuous_priority_ae_12, sweep_panorama_3d, sweep_panorama, movie_program, movie_aperture_priority, movie_shutter_priority, movie_manual, movie_auto, movie_sq_program, movie_sq_aperture_priority, movie_sq_shutter_priority, movie_sq_manual, movie_sq_auto, flash_off, picture_effect, hfr_program, hfr_aperture_priority, hfr_shutter_priority, hfr_manual, sq_program, sq_aperture_priority, sq_shutter_priority, sq_manual, movie, still, flexible_movie_or_sq, movie_flexible, sq_flexible, interval_movie_flexible, interval_movie_program, interval_movie_aperture_priority, interval_movie_shutter_priority, interval_movie_manual, interval_movie_auto], required: true }
    returns: ack
  set_exposure_control_type:
    summary: "Set exposure control type (Sony: Exposure Ctrl Type, 0xD099)"
    params:
      value: { type: enum, values: [pasm, flexible], required: true }
    returns: ack
  set_iris:
    summary: "Set exposure iris (Sony: F-Number, 0x5007)"
    params:
      value: { type: float, required: true }
    returns: ack
  set_iris_control:
    summary: "Set exposure iris control (Sony: Iris Mode Setting, 0xD001)"
    params:
      value: { type: enum, values: [auto, manual], required: true }
