quirks:
  - models: [all]
    severity: critical
    text: >
      Warranty notice, required by Sony's Camera Remote Command licence: every product that
      controls these cameras through this module must tell its end users that once a DEVICE is
      used or controlled through the APPLICATION SOFTWARE, the DEVICE will be out of such
      manufacturer-warranty. Show it before the first connection to a Sony camera, and keep it
      in the product's documentation.

  - models: [all]
    severity: critical
    text: >
      SSH. A camera with SSH enabled (its DigitalImagingDesc.xml says X_SSH_Support Enable;
      the pan/tilt cameras need it on) refuses PTP-IP on TCP 15740 and accepts it only
      through an SSH tunnel to its own localhost:15740. Set it up on the camera: turn SSH on
      (on BRC-AM7 and ILME-FR7, Network > SSH > SSH Setting: On), turn Access Authentication on
      with a user name and password, and note the host key fingerprint the camera shows. Then
      open the device with connection: ssh, ssh_username and ssh_password from the camera, and
      ssh_fingerprint (SHA256:..., as OpenSSH prints it) so the camera is verified; without a
      fingerprint the connection is encrypted but the camera is not authenticated. The tunnel
      uses SSH port 22 (the device's port override applies to it in this mode) and the
      aes128-ctr cipher Sony requires, runs no remote command, and both PTP-IP connections share
      one SSH login. A refused login or a fingerprint mismatch is final: the device reports
      unauthorized and is not retried until it is opened again, so a wrong password cannot lock
      the camera out.

  - models: [all]
    severity: critical
    text: >
      Pairing. A camera without SSH (or with Access Authentication off) may require pairing
      (DigitalImagingDesc.xml X_PTP_PairingNecessity). Show the pairing menu on the camera, then
      open the device with connection: pairing: the camera displays friendly_name and asks the
      operator to allow it, and session.pairing reads waiting_for_approval until they do. The
      module waits without a timeout and never retries; if the operator declines, or the camera
      closes the connection before approving, the device reports unauthorized until it is
      opened again. The camera stores the approved GUID (up to 20), so later connections need
      no approval as long as the GUID stays the same: it is derived from friendly_name unless
      the guid setting fixes it. In plain mode a camera that rejects the initiator is also
      reported unauthorized, not retried.

  - models: [all]
    severity: warning
    text: >
      The camera must have remote control over the network enabled. On ILCE-1 that is
      Network > Cnct./Remote Sht. > Remote Shoot Function > Remote Shooting: On; on other models
      it is the PC Remote function described in the model's Help Guide, set to a network
      connection (Wi-Fi access point, Wi-Fi station or wired LAN, depending on the model).
      A camera that answers busy (another controller holds it) is retried with backoff.

  - models: [all]
    severity: warning
    text: >
      The reference warns that property-change events are not guaranteed, so the module reads
      the camera's changed properties every poll_ms (default 1 s) as well as on each change
      event, and reads them all on connecting and on refresh. State therefore lags a change made
      on the camera body by up to poll_ms.

  - models: [all]
    severity: warning
    text: >
      A command's ack means the camera accepted the request, not that it acted: the reference
      states that SDIO_ControlDevice answers OK even when, for example, the shutter could not be
      released. Read the outcome in the state (the module reads changed properties after every
      command) and in operation.last, recording.last_result, zoom/focus last_position_result and
      pan_tilt.last_result, which come from the camera's result events.

  - models: [all]
    severity: warning
    text: >
      After changing the exposure mode, wait about 500 ms before changing shutter speed, iris
      or ISO: the reference notes that on some models a value set immediately after may be
      indeterminate.

  - models: [all]
    severity: info
    text: >
      What a camera accepts depends on its model, firmware, mode and settings. The supports
      lists follow the reference's per-model compatibility tables; at run time the camera's own
      property and control lists are authoritative. A typed command for a property the camera
      does not report fails with device_error not_reported; a read-only one with read_only; one
      greyed out in the current mode with not_available; and a value outside the options or
      range the camera currently lists is refused as invalid_params before anything is sent.
      A property the camera reports as disabled has a null value in the named state (its value
      is not meaningful), while properties.<code> keeps the raw value and enabled flag.

  - models: [all]
    severity: info
    text: >
      Every property the camera reports appears under properties.<code> with its raw value,
      type, writability and accepted values, and set_property, get_property and control reach
      any property or control by code, including those without a named path or typed command.
      Raw values are as the reference defines them for each code. On cameras with vendor code
      version 3.10 or later the module enables the extended codes (0xE000 properties and 0xF000
      controls) for the session.

  - models: [all]
    severity: info
    text: >
      record uses the hold-type movie record button: pressed starts recording and released
      stops it. A recording started on the camera body is stopped with record recording: false;
      record_toggle uses the separate toggle button where the camera has it.
      shutter_half_press and shutter_full_press must be used in the order a person would press
      them (half, full, release full, release half); take_photo does both in one command.

  - models: [ilme-fr7, brc-am7]
    severity: info
    text: >
      Pan and tilt are in degrees (the camera works in millionths of a degree): pan is positive
      anticlockwise seen from above and tilt positive upward, whether the camera is on a desk or
      ceiling-mounted. Speeds run to 24 in the camera's Normal speed step and further in
      Extended (to 127 on BRC-AM7 and 50 on ILME-FR7), set in the camera's web app; a speed above
      the Normal maximum in Normal step moves at the Normal maximum. Send pan/tilt commands at
      least 100 ms apart. Presets are numbered within pan_tilt.preset_slots. These cameras also
      drive the red, green and yellow tally lamps through set_tally.

  - models: [ilce-7cm2, ilce-7cr, ilx-lr1]
    severity: info
    text: >
      The reference marks the focal distance property as unsupported and unreliable on firmware
      1.00 of these models, and the focus indication property as not updating on ILX-LR1 1.00
      unless HDMI has been output; the module also takes focus.indication from the camera's AF
      status events, which do work there.

  - models: [all]
    severity: info
    text: >
      Out of scope: firmware update (a 200 MB to 1.5 GB upload that reflashes and restarts the
      camera), and the shot image with its ObjectInfo in one object.
      Bodies that are USB-only for remote control (ILCE-7RM3A, ILCE-7M2, ILCE-6600, ILCE-6400,
      ILCE-6100, the ZV-1 series and the RX models other than RX1R III) are not listed.

  - models: [all]
    severity: info
    text: >
      Cameras announce themselves over SSDP with the service type
      urn:schemas-sony-com:service:DigitalImaging:1, pointing at a dd.xml whose
      DigitalImagingDesc.xml says which protocol versions it speaks and whether pairing or SSH is
      required. The core's SSDP discovery reads both and suggests the connection setting (SSH
      where the camera supports it, as the reference recommends, otherwise pairing where it is
      required, otherwise plain).

  - models: [ilce-7m3]
    severity: warning
    text: >
      ILCE-7M3 speaks only Camera Control PTP 2 and is driven with it (protocol auto). PTP 2 has
      no changes-only read, so every poll reads the whole property set; it has no function
      modes, so content listing and transfer are not available, only download_captured_image
      for the shot just taken; and its property set is the smaller PTP 2 one. The other listed
      bodies speak both protocols and are driven with PTP 3 unless protocol is ptp2, which Sony
      deprecates for removal by 2027.

  - models: [all]
    severity: warning
    text: >
      Camera Control PTP 2 reports iris, shutter speed, ISO and exposure and flash compensation
      as read-only properties and changes them by steps (exposure_step). The typed setters
      convert a target value into steps between the current value and the target in the
      camera's own value list, taking a positive step as one entry further along that list;
      the reference does not say which way a positive step moves, so check the state after the
      first use on a body. Where a PTP 2 body offers no step control, these values cannot be
      changed remotely and the setter reports read_only.

  - models: [all]
    severity: info
    text: >
      get_live_view_image returns one frame as a base64 JPEG with its size. Poll it no faster
      than 30 times a second; a frame asked for too soon comes back empty and is asked for again
      after 40 ms. The frame size follows live_view.quality (set_live_view_quality low for
      previews). In remote_with_transfer mode the module turns live view on first. Pan/tilt
      bodies (ILME-FR7, BRC-AM7) serve live view over HTTP at live_view.url on their own
      localhost, one live view dataset per HTTP chunk; the module reads one frame through the
      SSH tunnel, so those bodies need connection: ssh. At most five live view clients may be
      connected to a pan/tilt body at once.

  - models: [all]
    severity: info
    text: >
      The live stream runs only while watched. PTP bodies are asked for one image at a time, the
      next as soon as the last arrives but no sooner than live_interval_ms after the previous
      request, backing off from 40 to 320 ms while the camera has no new image. Image requests
      are background work: commands go first, and while a PTP download is in progress its parts
      go first too, so the picture pauses during a download from the card and resumes after it.
      In remote_with_transfer mode the stream turns the camera's live view on and off again when
      the last watcher leaves. Pan/tilt bodies stream over their own tunnelled HTTP connection,
      unaffected by commands and downloads, opened again after 1 s (doubling to 30 s) if it
      ends while watched; their stream needs connection ssh. get_live_view_image keeps working
      beside the stream.

  - models: [all]
    severity: warning
    text: >
      Content access depends on the session mode. remote_with_transfer (the default where the
      compatibility tables list it) lists a slot's contents with their files and streams a
      file to the host while remote control keeps working. content_transfer reaches the card as
      PTP objects but the camera then takes no remote control at all; remote control only
      cannot reach the card. switch_session_mode closes the session and opens it again in the
      other mode, which drops any command in progress. Video-only bodies (FX6, BURANO, FR7,
      PXW-Z380, PXW-Z200, HXR-NX800, BRC-AM7) have no content transfer mode: their clips are
      listed from the MediaProfile at media.slotN.profile_url and downloaded over HTTP through
      the SSH tunnel, so they need connection: ssh. Downloads go to a file on the host the
      consumer names; one download and one HTTP transfer run at a time.

  - models: [all]
    severity: info
    text: >
      FTP: the camera uploads by itself to servers configured on it. Stills bodies keep a server
      list (get_ftp_settings, set_ftp_server, select_ftp_server, FTP function, auto transfer and
      its targets, power save) and report transfer counts (get_ftp_result) and the connection
      status and error in ftp.connection_status and ftp.connection_error. Video bodies keep a
      job list (get_ftp_jobs, add_ftp_job, ftp_job) that the module reads into ftp.jobs whenever
      ftp.job_sync_id changes. Server passwords are written to the camera and never read back
      or reported; ftp.servers shows only whether one is set. A set_ftp_server is refused while
      the camera reports it cannot take FTP settings (ftp.settings_editable false).

  - models: [all]
    severity: warning
    text: >
      Uploads read the host file whole (path as the consumer gives it), check it, send it, ask
      the camera to apply it and complete with the result the camera reports afterwards, up to
      two minutes later. A LUT is a .cube file with a LUT_3D_SIZE or LUT_1D_SIZE line, imported
      into user base look 1 to 16; the camera takes it only while BaseLookImport Operation
      Enable Status is on and BaseLookImport Command Version is display-only, as the reference
      specifies. Scene files go to scene 1 to 16 (video bodies). Custom grid line images (at
      most 1 MB, a licensed feature on the camera) are sent in parts no larger than the
      camera's Maximum number of bytes. Each import is refused before the file is read when the
      camera's enable-status property says it cannot take one now, and the camera's own
      refusal (wrong file, busy, media error) fails the command with its reason. Only one
      upload runs at a time, and an import replaces what is in the target slot.

  - models: [all]
    severity: info
    text: >
      Setting files: export_camera_settings and import_camera_settings move the camera-setting
      file between the camera and a host file while the camera allows saving or reading it;
      export_ftp_settings_file and import_ftp_settings_file do the same for the FTP-setting
      file, protected by a password of up to 32 letters and digits (empty for none) that is
      sent to the camera only. Video bodies take a general setting XML (apply_settings_file,
      check_only to validate without applying) and return the camera's result XML. Scene files
      export to a host file on video bodies.

  - models: [all]
    severity: info
    text: >
      Once connected the module reads what the camera reports about itself where it offers it:
      the display string lists (display_lists, also naming the base look, scene file, creative
      look and stream destination in the state), operation results supported, licences, zoom and
      focus presets, the clock and, while lens.information_available is true, the lens focus
      tables. Each is read again when the camera signals a change. restrictions is read only
      while status.remote_restricted is true, because the camera answers with an error
      otherwise. Zoom and focus presets are numbered from 0 like save_zoom_focus_position; the
      reference does not state the numbering of its preset list, so check one preset on a body
      before relying on set_preset_zoom_only.

  - models: [all]
    severity: warning
    text: >
      delete_user_base_look, select_user_base_look and set_pplut_base_look take a user base look
      1 to 16. The reference gives the property value only as the camera's UserBaseLook number;
      the module sends the number itself or, where the camera lists the user-LUT form (0x0100
      plus the number) instead, that, so check the camera's values in properties.D0C7 on a new
      body. camera_button presses only while camera_controls.status is idle unless
      simultaneous is set. get_osd_image needs live_view.osd_image_mode on.

  - models: [all]
    severity: info
    text: >
      download_content with resume continues a file already at path: the module reads the part
      on the host (up to 1 GiB), writes it back and asks the camera for the rest, because the
      host file API has no append. Only remote_with_transfer content list files resume. A file
      named by umid is looked up in the last list_content of its slot; when the camera has
      regenerated that list since (after an edit or deletion), list again first.

  - models: [all]
    severity: warning
    text: >
      delete_content removes one content, all its files, from a card. It takes only an id that
      list_content returned (c:slot:content), works only in remote_with_transfer mode and only
      while the camera reports deletion available for that slot, and succeeds only when the
      camera's result event says so (protected content is refused by the camera). Deletions are
      spaced at least 600 ms apart, as the reference asks. There is no undo.
