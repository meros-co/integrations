spec: 1
id: obsidian-onyx-osc
name: Obsidian Control Systems ONYX (OSC)
vendor: Obsidian Control Systems
category: lighting

source:
  - title: ONYX OSC MAPPING V1.20, Revision 5
    author: Obsidian Control Systems
    url: https://files.obsidiancontrol.com/s/yndNn7FsaB9Fyay
    note: >
      PDF linked from the ONYX manual's OSC page as "All supported OSC commands" (retrieved
      2026-10-02), 22 pages. Update (feedback) and Execute addresses with type, name and example
      for: Commandline (/Mx/commandLine/0001 and 0002 color, text, text/color); Playback, "For
      playback execute messages a license is required", main playbacks 1-10 at /Mx/button/42n1
      (PFA), 42n2 (PFB), /Mx/fader/42n3 (LEVEL PLAYBACK, float 0 to 255), 42n4 (PFC, with the
      cuelist name as text), 42n5 (PFD) for n = playback-1, and playbacks 11-20 at 46n1-46n5; LED
      updates /led (int 0 or 1), /led/color (blue or red), /led/blink (int); execute up/down 0 or
      1; FADE 4321, DELAY 4322, SNAPSHOT 4331, BANK 4332, Bank Page Up/Down 4412/4413, PLAYBACK
      BANK 1-5 4421-4425 (text), Fader Swap 4600, /Mx/label/4401 playback bank number,
      /Mx/scroll/4110 and 4411 up/down; Playback Pages, "/Mx/playback/page<pageIndex>/<buttonIndex>/<action>"
      with page 1-100 (one based), button 0-99 (zero based), action PLAY or GO, PAUSE, RELEASE,
      SELECT, SNAPGO, TOGGLE, BACK, not case sensitive, examples "/Mx/playback/page1/0/go 1" and
      "/Mx/playback/page5/9/release 1", "No update messages exist for the playback pages"; Master
      Faders (GRAND MASTER 2202, FLASH MASTER 2212, GROUP MASTER A 2222 and B 2232, float 0 to
      255, flash LEDs 2201-2231); Screens (VIEW 1-8 1101-1108, VIEW 9-16 3101-3108); Keypad (MACRO
      2001, PREVIEW 2002, MENU 2003, EDIT 5101, UNDO 5102, CLEAR 5103, COPY 5104, MOVE 5106,
      DELETE 5107, RECORD 5401, UPDATE 5402, LOAD 5411, GROUP 5412, CUE 5413, 0-9 5200-5209, -
      5210, + 5211, . 5212, Enter 5213, / 5214, Backspace 5215, @ 5216, Full 5301, Through 5302);
      Programmable Function-Keys (F1-F12 5601, 56A1, 5602, 56A2, 5603, 56A3, 2101, 21A1, 2102,
      21A2, 2103, 21A3; PF GROUP 1-5 5701-5705 with text, the table printing 5701 for groups 1 and
      2; scroll 5706); Programmer (Last 6401, Next 6402, Swap Programmer 6411, HIGHLIGHT 6001, CV
      6003, Link 6108, base and effect channel groups 6101-6105 and 6201-6205, base and effect
      channels 6111-6141 and 6211-6241, belts /Mx/belt/6112-6142 and 6212-6242 channelName and
      channelValue strings, SELECT 5502, RELEASE 5503, BEAT 5504, SNAP 5511, ||/Back 5512, GO 5513,
      View 4121, TRACKFUNC P/T 7001, MODE 7004, NAVIGATE UP/LEFT/DOWN/RIGHT 7301-7304);
      Configuration (/Mx/configuration/deviceSpace string, and its up and down).
  - title: ONYX Manual 4.32, Networking > OSC; ONYX PC Modes; Network Settings
    author: Obsidian Control Systems
    url: https://support.obsidiancontrol.com/Content/Onyx_Manual/Networking/OSC.htm
    note: >
      Retrieved 2026-10-02. OSC "offers full control of ONYX's main playbacks, playback buttons,
      F-Keys, command keys, and more"; restrictions in FREE and NOVA mode ("OSC is locked", with
      a trial); setup: enable OSC on the network interface under Network Settings, Interfaces;
      on the OSC page activate an OSC device with a name, its IP address and "the Incoming Port
      used by the OSC device", then Update and Apply. Network_Settings.htm lists OSC among the
      per-interface protocols.
  - title: Bitfocus Companion module companion-module-obsidiancontrol-onyx-osc (community, MIT)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-obsidiancontrol-onyx-osc
    note: >
      Community code, read for corroboration only (MIT at the top level). Tested with ONYX 4.8;
      sends buttons as int 1 (press) and 0 (release), playback levels as float 0-255, playback
      page actions with int 1 only; uses 5702 for PF GROUP 2; listens for updates on the port
      configured as the OSC device's incoming port; its target port must match "Port number for
      outgoing data" in ONYX's global OSC settings.

# OSC 1.0 over UDP to the port ONYX listens on (its global OSC settings). Obsidian documents no
# default port; 8000 is a placeholder the host overrides. ONYX acknowledges nothing, so every
# command reports unverified. Updates go to the IP address and incoming port configured for an
# OSC device in ONYX, not to the sender: configure this host as an OSC device with feedback_port
# as its incoming port, and the core receives there (shared by every console sending to it,
# routed by source address). With feedback_port empty nothing is read back.
transport:
  type: osc-udp
  port: 8000
  reply: none
  listen_port: { setting: feedback_port }

settings:
  feedback_port: { type: int, min: 1, max: 65535,
                   label: Feedback port,
                   description: "The port ONYX sends updates to, entered as the incoming port of this host's OSC device in ONYX; leave empty to read nothing back." }

ports:
  - { port: 8000, protocol: udp, role: control }
  - { port: null, protocol: udp, role: feedback, listener: core, setting: feedback_port, note: "where the device sends its feedback" }

