quirks:
  - models: [all]
    severity: warning
    text: >
      ONYX acknowledges nothing over OSC, so every command reports unverified. Use the update
      telemetry (LEDs, levels, names) to confirm playback changes. Playback pages have no update
      messages at all.

  - models: [all]
    severity: warning
    text: >
      Updates go to the IP address and incoming port of an OSC device configured in ONYX, not to
      the sender. Add this host as an OSC device in ONYX's OSC settings with feedback_port as its
      incoming port, and send commands to the port in ONYX's global OSC settings. Obsidian
      documents no default for either port; this spec's 8000 is a placeholder.

  - models: [all]
    severity: warning
    text: >
      "For playback execute messages a license is required", as for playback pages. ONYX PC in
      FREE or NOVA mode has OSC locked (a trial can be started). Commands sent without the licence
      are ignored, and with no acknowledgement nothing reports it.

  - models: [all]
    severity: info
    text: >
      Main playbacks map to button ids by position: playback n (1-10) uses 42(n-1)1 PFA, 42(n-1)2
      PFB, fader 42(n-1)3, 42(n-1)4 PFC and 42(n-1)5 PFD; playbacks 11-20 use 46(n-11)1-5. They are
      the playbacks of the current bank, so what they control changes with the bank; use
      playback_page_action to address a page and button directly. Playback state is kept by
      position (playbacks.<n>) as ONYX reports it for the current bank.

  - models: [all]
    severity: info
    text: >
      Named key commands press and release (int 1 then 0, two datagrams); button sends a single
      press or release for keys that must be held (flash, shift-style use). playback_page_action
      sends only the key down (int 1) the mapping's examples show; whether ONYX expects a release
      is not documented.

  - models: [all]
    severity: info
    text: >
      The mapping prints /Mx/button/5701 for both PF GROUP 1 and PF GROUP 2; 5702 is used for PF
      GROUP 2 here, following the numbering of groups 3-5 and the community Companion module.
      F-key ids are not sequential (F1 5601, F2 56A1, F3 5602, ...) and are separate commands.
      Belt encoders (/Mx/belt/<id>/) are read but not driven: their execute address ends in "/"
      and its meaning is not documented.

  - models: [all]
    severity: info
    text: >
      Update arguments are stored as sent: LEDs and blink as int 0 or 1, levels as float 0-255,
      colours ("color" in the mapping, examples blue, red, green, gray, white) and texts as
      strings. The mapping's colour type is not an OSC type tag; a colour sent as anything but a
      string is stored as its text form.

  - models: [m-series]
    severity: info
    text: >
      Martin M-Series consoles run ONYX (the successor of M-PC); the mapping does not list models,
      and smaller surfaces (M-Play, M2GO) have fewer physical playbacks than the 20 addressable
      ones.

state:
  "playbacks.*.a.led": { type: int, description: "PFA button LED of main playback 1-20, 0 off or 1 on, from /Mx/button/<id>/led" }
  "playbacks.*.a.blink": { type: int, description: "PFA button LED blinking of main playback 1-20, 0 or 1, from /Mx/button/<id>/led/blink" }
  "playbacks.*.a.color": { type: string, description: "PFA button LED colour of main playback 1-20 as sent (the mapping's examples: blue, red, green), from /Mx/button/<id>/led/color" }
  "playbacks.*.b.led": { type: int, description: "PFB button LED of main playback 1-20, 0 off or 1 on, from /Mx/button/<id>/led" }
  "playbacks.*.b.blink": { type: int, description: "PFB button LED blinking of main playback 1-20, 0 or 1, from /Mx/button/<id>/led/blink" }
  "playbacks.*.b.color": { type: string, description: "PFB button LED colour of main playback 1-20 as sent (the mapping's examples: blue, red, green), from /Mx/button/<id>/led/color" }
  "playbacks.*.c.led": { type: int, description: "PFC button LED of main playback 1-20, 0 off or 1 on, from /Mx/button/<id>/led" }
  "playbacks.*.c.blink": { type: int, description: "PFC button LED blinking of main playback 1-20, 0 or 1, from /Mx/button/<id>/led/blink" }
  "playbacks.*.c.color": { type: string, description: "PFC button LED colour of main playback 1-20 as sent (the mapping's examples: blue, red, green), from /Mx/button/<id>/led/color" }
  "playbacks.*.d.led": { type: int, description: "PFD button LED of main playback 1-20, 0 off or 1 on, from /Mx/button/<id>/led" }
  "playbacks.*.d.blink": { type: int, description: "PFD button LED blinking of main playback 1-20, 0 or 1, from /Mx/button/<id>/led/blink" }
  "playbacks.*.d.color": { type: string, description: "PFD button LED colour of main playback 1-20 as sent (the mapping's examples: blue, red, green), from /Mx/button/<id>/led/color" }
  "playbacks.*.name": { type: string, description: "Main playback 1-20 cuelist name, from the PFC button text /Mx/button/<id>/text" }
  "playbacks.*.level": { type: float, description: "Main playback 1-20 fader level, 0-255, from /Mx/fader/<id>" }
  "buttons.*.led": { type: int, description: "Button LED by OSC id (e.g. 5513 GO), 0 off or 1 on, from /Mx/button/<id>/led" }
  "buttons.*.blink": { type: int, description: "Button LED blinking by OSC id, 0 or 1, from /Mx/button/<id>/led/blink" }
  "buttons.*.led_color": { type: string, description: "Button LED colour by OSC id as sent, from /Mx/button/<id>/led/color" }
  "buttons.*.text": { type: string, description: "Button text by OSC id (playback, bank, PF group and channel group names), from /Mx/button/<id>/text" }
  command_line.status: { type: string, description: "Command line status text (example FREE), from /Mx/commandLine/0001/text" }
  command_line.command: { type: string, description: "Command line command text, from /Mx/commandLine/0002/text" }
  playback_bank: { type: string, description: "Playback bank number label, from /Mx/label/4401/text" }
  device_space: { type: string, description: "Device Space ID number, from /Mx/configuration/deviceSpace" }
  "belts.*.name": { type: string, description: "Encoder belt attribute name by OSC id (6112-6142 base, 6212-6242 effect), from /Mx/belt/<id>/channelName" }
  "belts.*.value": { type: string, description: "Encoder belt attribute value as displayed, from /Mx/belt/<id>/channelValue" }

telemetry:
  updates:
    - address: '^/Mx/button/42([0-9])1/led$'
