commands:
  playback_a:
    summary: "Press (true, 1) or release (false, 0) the PFA button of main playback 1-10 (/Mx/button/42<n-1>1)"
    params:
      playback: { type: int, min: 1, max: 10, required: true,
                  label: Playback,
                  description: "Main playback number, 1 to 10, as numbered on the console." }
      pressed: { type: bool, required: true,
                 label: Pressed,
                 description: "On presses the playback's PFA button and off releases it; send both for a full press." }
    send: { address: "/Mx/button/42{playback:-1}1", args: [ { value: "{pressed:bool01}", type: int } ] }
    returns: none

  playback_a_press:
    summary: "Press and release the PFA button of main playback 1-10 (1 then 0)"
    params:
      playback: { type: int, min: 1, max: 10, required: true,
                  label: Playback,
                  description: "Main playback number, 1 to 10, as numbered on the console." }
    send:
      - { address: "/Mx/button/42{playback:-1}1", args: [ { value: "1", type: int } ] }
      - { address: "/Mx/button/42{playback:-1}1", args: [ { value: "0", type: int } ] }
    returns: none

  playback_b:
