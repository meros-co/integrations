    returns: none

  playback_level:
    summary: "Set the level of main playback 1-10, 0-255 (/Mx/fader/42<n-1>3, float)"
    params:
      playback: { type: int, min: 1, max: 10, required: true,
                  label: Playback,
                  description: "Main playback number, 1 to 10, as numbered on the console." }
      level: { type: float, min: 0, max: 255, required: true,
               label: Level,
               description: "The playback fader level, from 0 (out) to 255 (full)." }
    send: { address: "/Mx/fader/42{playback:-1}3", args: [ { value: "{level}", type: float } ] }
    returns: none

