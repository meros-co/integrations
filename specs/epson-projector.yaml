commands:
  set_power:
    summary: "Power on (PWR ON) or off (PWR OFF), then read the power status. Power on answers once the lamp is lit, up to 100 s"
    params:
      "on": { type: bool, required: true, label: Power, description: "On lights the projector; off puts it in standby after cooling down." }
    returns: ack
  get_power:
    summary: "Read the power status (PWR?): 00 standby (network off), 01 lamp on, 02 warm-up, 03 cool-down, 04 standby (network on), 05 abnormal standby, 09 A/V standby. Returns the code"
    returns: value
  get_errors:
    summary: "Read the error status (ERR?): 00 none, 01 fan, 03 lamp failure at power on, 04 high internal temperature, 06 lamp, 07 lamp cover open, 08 cinema filter, 09 capacitor, 0A auto iris, 0B subsystem, 0C low air flow, 0D air filter flow sensor, 0E power supply, 0F shutter, 10-11 cooling system, 12 static iris, 13 power supply mismatch, 14 exhaust shutter, 15 obstacle detected, 16 IF board, 17 stack projection communication, 18 I2C. Returns the code"
    returns: value
  refresh:
    summary: "Read every setting the model reads, once, whatever the power status"
    returns: ack
  set_key:
    summary: "Set remote key (KEY xx)"
    params:
      value: { type: string, max_length: 4, pattern: "^([0-9A-Fa-f]{2}|INIT)$", required: true, label: Value, description: "The two-digit hexadecimal code of the setting, as the model's command list gives it, or INIT for its default." }
    returns: ack
  set_vertical_keystone:
    summary: "Set vertical keystone (VKEYSTONE xxx). Values: 0-255 INIT/INC/DEC (set only)"
    params:
      value: { type: string, max_length: 6, pattern: "^(-?[0-9]{1,5}|INC|DEC|INIT)$", required: true, label: Value, description: "A number in the model's range (0-255 on most), or INC or DEC to step it, or INIT for its default." }
    returns: ack
  get_vertical_keystone:
    summary: "Read vertical keystone (VKEYSTONE?). Values: 0-255 INIT/INC/DEC (set only). Returns the reply text and keeps it in state"
    returns: value
  set_horizontal_keystone:
    summary: "Set horizontal keystone (HKEYSTONE xxx). Values: 0-255 INIT/INC/DEC (set only)"
    params:
      value: { type: string, max_length: 6, pattern: "^(-?[0-9]{1,5}|INC|DEC|INIT)$", required: true, label: Value, description: "A number in the model's range (0-255 on most), or INC or DEC to step it, or INIT for its default." }
    returns: ack
  get_horizontal_keystone:
    summary: "Read horizontal keystone (HKEYSTONE?). Values: 0-255 INIT/INC/DEC (set only). Returns the reply text and keeps it in state"
    returns: value
  set_auto_keystone:
    summary: "Auto keystone on or off (AUTOKEYSTONE ON / OFF / INIT). Values: ON/OFF INIT (set only)"
    params:
      value: { type: enum, values: ["on", "off", init], required: true, label: Value, description: "on turns it on, off turns it off, init returns it to its default." }
    returns: ack
  get_auto_keystone:
    summary: "Read auto keystone (AUTOKEYSTONE?). Values: ON/OFF INIT (set only). Returns the reply text and keeps it in state"
    returns: value
  set_vertical_balance:
    summary: "Set vertical balance (VBALANCE x1). Values: 0-255 INIT/INC/DEC (set only)"
    params:
      value: { type: string, max_length: 6, pattern: "^(-?[0-9]{1,5}|INC|DEC|INIT)$", required: true, label: Value, description: "A number in the model's range (0-255 on most), or INC or DEC to step it, or INIT for its default." }
    returns: ack
  get_vertical_balance:
    summary: "Read vertical balance (VBALANCE?). Values: 0-255 INIT/INC/DEC (set only). Returns the reply text and keeps it in state"
    returns: value
  set_horizontal_balance:
    summary: "Set horizontal balance (HBALANCE x1). Values: 0-255 INIT/INC/DEC (set only)"
    params:
      value: { type: string, max_length: 6, pattern: "^(-?[0-9]{1,5}|INC|DEC|INIT)$", required: true, label: Value, description: "A number in the model's range (0-255 on most), or INC or DEC to step it, or INIT for its default." }
    returns: ack
  get_horizontal_balance:
    summary: "Read horizontal balance (HBALANCE?). Values: 0-255 INIT/INC/DEC (set only). Returns the reply text and keeps it in state"
    returns: value
  set_quick_corner:
    summary: "Set quick corner (QC x1 x2 x3 x4 x5 x6 x7 x8). Values: x1-x8:0-9999 This command can be set in the following turns. Left-top (x, y) => Right-top (x, y) => Right-bottom (x, y) => Left-bottom (x, y)"
    params:
      args: { type: string, max_length: 128, pattern: "^[!-~]+( [!-~]+)*$", required: true, label: Parameters, description: "The command's parameters separated by single spaces, as the model's command list gives them (the summary shows the form)." }
    returns: ack
  get_quick_corner:
    summary: "Read quick corner (QC?). Values: x1-x8:0-9999 This command can be set in the following turns. Left-top (x, y) => Right-top (x, y) => Right-bottom (x, y) => Left-bottom (x, y). Returns the reply text and keeps it in state"
    returns: value
  set_quick_corner_projection_area:
    summary: "Set quick corner by projection area (QCS x1 x2 x3 x4 x5 x6 x7 x8). Values: x1-x8:0-99 This command can be set in the following turns. Left-top (x, y) => Right-top (x, y) => Right-bottom (x, y) => Left-bottom (x, y)"
