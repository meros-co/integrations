spec: 1
id: epson-projector
name: Epson projectors (ESC/VP21 over ESC/VP.net)
vendor: Epson
category: display
implementation: native
reason: >
  Over the network the connection opens with ESC/VP.net's binary 16-byte connect header and its binary answer
  before any ESC/VP21 text, and a reply ends at a colon prompt that carries no line ending, after zero or more
  "NAME=value" lines or "ERR"; the next command may go only once that colon has come, and power or source
  changes hold it for up to 100 s. State comes from a poll whose content depends on the power status (most
  commands answer ERR in standby).

source:
  - title: "ESC/VP21 Command User's Guide for Business Projectors (Rev. A, 2013-10-31)"
    author: "Seiko Epson Corporation"
    url: "https://www.epson.co.nz/d/pub/epson/techtips/escvp21%20command%20guide.pdf"
    note: >
      Manufacturer document, linked from Epson's product support pages (also at
      https://www.epson.com.au/d/pub/epson/techtips/escvp21%20command%20guide.pdf). Set and get command forms,
      INC/DEC/INIT, the colon after each command, the null command (CR) answered with a colon, ERR for an
      invalid command (§2); the commands accepted in standby by model and network setting (§3); one command
      after the previous colon, and execution times: power on 40 s (40, 70 or 100 s with lamp retries), source
      change up to 25 s, other times by model (§4); ERR? error codes 00-18 (§5); serial 9600 bit/s, 8 data
      bits, no parity, 1 stop bit, no flow control, D-Sub 9-pin (appendix); network via ESC/VP.net (§1).
  - title: "ESC/VP21 Command List for Business Projectors (Rev. T, 2020-09-22)"
    author: "Seiko Epson Corporation"
    url: "https://www.epson.com.au/d/pub/epson/techtips/escvp21%20command%20guide%20for%20business%20projector%20revt.xlsx"
    note: >
      Manufacturer workbook, one sheet per model family from the EB-Gxxx(old) to the L200 Series (2020), each
      with every command, whether each model column supports it ("OK", or "N/A" where the projector answers ERR),
      its parameters and return codes, the key codes and the source codes; plus "How to send command" with the
      PWR ON, PWR?, SOURCE 11, LAMP? and PWR OFF exchanges. The workbook spells three keywords as typing
      slips (TRACKIOK for TRACKING, GAIOK for GAING, "Extron" for XTP) and two sheets PLUG-IN for PLUGIN; they
      are read as the keyword the other sheets give.
  - title: "How to Send ESC/VP.net Commands to a Projector (KA-01646)"
    author: "Epson Europe"
    url: "https://www.epson.eu/en_EU/faq/KA-01646/contents"
    note: >
      Manufacturer support article: TCP 3629, the connect header 45 53 43 2F 56 50 2E 6E 65 74 10 03 00 00 00 00,
      the projector's answer beginning "ESC/VP.net", then ESC/VP21 commands such as PWR? and LAMP? ended by 0D.
  - title: "ESC/VP.net Commands (EB-PU2220B and others, User's Guide)"
    author: "Epson America"
    url: "https://files.support.epson.com/docid/cpd6/cpd64112/source/network/concepts/esc_vpnet.html"
    note: >
      Manufacturer guide page: with Command Communication set to Protected, ESC/VP.net version 2.0 connects with
      the Web Control Password; with Compatible, version 2.0 or 1.0, version 1.0 with the Monitor Password. The
      password exchange itself is described only in Epson's ESC/VP.net Software Development Manual, which is
      marked confidential, so it is not built (see the quirks).

ports:
  - { port: 3629, protocol: tcp, role: control }

