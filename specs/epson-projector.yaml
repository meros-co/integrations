quirks:
  - models: [all]
    severity: warning
    text: >
      A projector whose Command Communication is set to Protected, or that has a Monitor Password set, needs
      ESC/VP.net's password exchange (version 2.0 with the Web Control Password, or 1.0 with the Monitor
      Password). Epson documents that exchange only in its confidential ESC/VP.net Software Development Manual,
      so it is not built: set Command Communication to Compatible with no Monitor Password. Such a projector refuses or ignores the connect header, and the device is reported disconnected
      with that reason.
  - models: [all]
    severity: info
    text: >
      Opened for commands only (monitor false), nothing is polled and no set is followed by a read; the null
      command (CR alone) every 5 s shows the projector is there. The refresh command still reads every setting
      once.
  - models: [all]
    severity: info
    text: >
      In standby most commands answer ERR (guide §3.1): only PWR ON, PWR?, LAMP? and the null command on the
      oldest models, those and SOURCE? on others, and everything on models in standby with the network on.
      The poll therefore reads the settings only while the projector is on, and the error status, lamp hours
      and power always; a set sent in standby fails with ERR.
  - models: [all]
    severity: info
    text: >
      ERR answers any command the model does not support, a value outside its range, a command sent before the
      projector is ready, and a source change during signal recognition (guide §3, §4.2 note 3); it is reported
      as a device error with code ERR, without telling which. Values and codes differ by model family (ASPECT,
      CMODE, SOURCE and others): the summaries give the most common list, and each family's sheet of the
      command list gives its own.
  - models: [all]
    severity: info
    text: >
      Settings are kept in state as the projector sends them (settings.<name>), decoded only for power, the
      error status, lamp and operating hours, the serial number, the source, A/V mute, freeze and the signal.
      A query with arguments (SHARP? 01) is kept under its arguments, and is not polled: it is read when asked.
  - models: [all]
    severity: info
    text: >
      Power on answers once the lamp is lit, which takes up to 40 s, or 100 s when the lamp needs three tries
      (guide §4.2 note 1); the module waits 110 s for it. Every command waits for the previous colon (§4.1,
      §4.2). The 10 s the guide asks for after PWR OFF with the network off in standby applies only to
      EMP-7800/7850/8300/9300 (§4.2), which the command list does not cover and the module does not open, so
      no model here needs it; the guide asks nothing more of a controller that waits for each colon. A
      projector in an abnormal state (lamp failure, high temperature) answers nothing, and shows as
      disconnected until it recovers (§4.3).
