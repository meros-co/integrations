       lock_serial_port, unlock_serial_port, force_unlock_serial_port,
       set_serial_port_direction, get_device_info, get_input_labels, get_output_labels,
       get_serial_port_labels, get_video_output_routing, get_serial_port_routing,
       get_video_output_locks, get_serial_port_locks, get_serial_port_directions,
       get_video_input_status, get_video_output_status, get_serial_port_status,
       get_alarm_status, ping]
    verification: none
    notes: >
      Up to 72 SDI inputs, 72 SDI outputs and 72 bidirectional RS-422 deck control ports
      when fully populated (Videohub manual, February 2020, p.33). Pluggable interface
      cards: sends the hardware status blocks (protocol p.5-6).
  - id: universal-videohub-288
    name: Universal Videohub 288
    supports:
      [set_route, set_serial_route, set_input_label, set_output_label,
       set_serial_port_label, lock_output, unlock_output, force_unlock_output,
       lock_serial_port, unlock_serial_port, force_unlock_serial_port,
       set_serial_port_direction, get_device_info, get_input_labels, get_output_labels,
       get_serial_port_labels, get_video_output_routing, get_serial_port_routing,
       get_video_output_locks, get_serial_port_locks, get_serial_port_directions,
       get_video_input_status, get_video_output_status, get_serial_port_status,
       get_alarm_status, ping]
    verification: none
    notes: >
      Up to 288 SDI inputs, 288 SDI outputs and 288 bidirectional RS-422 deck control
      ports when fully populated (Videohub manual, February 2020, p.26). Pluggable
      interface cards: sends the hardware status blocks (protocol p.5-6).
  - id: workgroup-videohub
    name: Workgroup Videohub
    supports:
      [set_route, set_monitoring_route, set_serial_route, set_processing_unit_route,
       set_frame_buffer_route, set_input_label, set_output_label,
       set_monitoring_output_label, set_serial_port_label, set_frame_label, lock_output,
       unlock_output, force_unlock_output, lock_monitoring_output,
       unlock_monitoring_output, force_unlock_monitoring_output, lock_serial_port,
       unlock_serial_port, force_unlock_serial_port, lock_processing_unit,
       unlock_processing_unit, force_unlock_processing_unit, lock_frame_buffer,
       unlock_frame_buffer, force_unlock_frame_buffer, set_serial_port_direction,
       get_device_info, get_input_labels, get_output_labels, get_monitoring_output_labels,
       get_serial_port_labels, get_frame_labels, get_video_output_routing,
       get_monitoring_output_routing, get_serial_port_routing, get_processing_unit_routing,
       get_frame_buffer_routing, get_video_output_locks, get_monitoring_output_locks,
       get_serial_port_locks, get_processing_unit_locks, get_frame_buffer_locks,
       get_serial_port_directions, ping]
    verification: none
    notes: >
      The only Videohub with processing units and frame buffers (protocol p.4-5). Port
      counts are not given in the current documents; the VIDEOHUB DEVICE block reports
      them. Monitoring and serial blocks are listed because the router reports whether
      it has them.

commands:
  set_route:
    summary: Route a video input to a video output
    params:
      input:  { type: int, min: 1, max: 288, required: true,
        label: Input,
        description: "Video input, numbered from 1 as on the router's labels." }
      output: { type: int, min: 1, max: 288, required: true,
        label: Output,
        description: "Video output, numbered from 1 as on the router's labels." }
    send: |
      VIDEO OUTPUT ROUTING:
      {output:-1} {input:-1}
    expect: { contains: "ACK" }
    returns: ack
    # Videohub Ethernet Protocol v2.3 (November 2023), p.4 and p.6

  set_monitoring_route:
    summary: Route a video input to a monitoring output
    params:
      input:             { type: int, min: 1, max: 288, required: true,
        label: Input,
        description: "Video input, numbered from 1 as on the router's labels." }
      monitoring_output: { type: int, min: 1, max: 288, required: true,
        label: Monitoring output,
        description: "Monitoring output, numbered from 1." }
    send: |
      VIDEO MONITORING OUTPUT ROUTING:
      {monitoring_output:-1} {input:-1}
    expect: { contains: "ACK" }
    returns: ack
    # Videohub Ethernet Protocol v2.3 (November 2023), p.4 and p.6

  set_serial_route:
    summary: Connect a serial (RS-422 deck control) port to another serial port
    params:
      port:        { type: int, min: 1, max: 288, required: true,
        label: Serial port,
        description: "Serial (RS-422 deck control) port, numbered from 1." }
      source_port: { type: int, min: 1, max: 288, required: true,
        label: Source port,
        description: "Serial port to connect to this one, numbered from 1." }
    send: |
      SERIAL PORT ROUTING:
      {port:-1} {source_port:-1}
    expect: { contains: "ACK" }
    returns: ack
    # Videohub Ethernet Protocol v2.3 (November 2023), p.4 and p.6

  set_processing_unit_route:
    summary: Route a source to a processing unit (Workgroup Videohub only)
    params:
      unit:   { type: int, min: 1, max: 288, required: true,
        label: Processing unit,
        description: "Processing unit, numbered from 1 (Workgroup Videohub)." }
      source: { type: int, min: 1, max: 288, required: true,
        label: Source,
        description: "Source to route to the processing unit, numbered from 1." }
    send: |
      PROCESSING UNIT ROUTING:
      {unit:-1} {source:-1}
    expect: { contains: "ACK" }
    returns: ack
    # Videohub Ethernet Protocol v2.3 (November 2023), p.4 and p.6

  set_frame_buffer_route:
    summary: Route a source to a frame buffer (Workgroup Videohub only)
    params:
      frame:  { type: int, min: 1, max: 288, required: true,
        label: Frame buffer,
        description: "Frame buffer, numbered from 1 (Workgroup Videohub)." }
      source: { type: int, min: 1, max: 288, required: true,
        label: Source,
        description: "Source to route to the frame buffer, numbered from 1." }
    send: |
      FRAME BUFFER ROUTING:
      {frame:-1} {source:-1}
    expect: { contains: "ACK" }
    returns: ack
    # Videohub Ethernet Protocol v2.3 (November 2023), p.4 and p.6

  set_input_label:
    summary: Set the label of a video input
    params:
      input: { type: int, min: 1, max: 288, required: true,
        label: Input,
        description: "Video input, numbered from 1 as on the router's labels." }
      label: { type: string, required: true,
        label: Label,
        description: "The input's new name, as shown on the router and in Videohub software." }
    send: |
      INPUT LABELS:
      {input:-1} {label}
    expect: { contains: "ACK" }
    returns: ack
    # Videohub Ethernet Protocol v2.3 (November 2023), p.3-4 and p.6

  set_output_label:
    summary: Set the label of a video output
    params:
      output: { type: int, min: 1, max: 288, required: true,
        label: Output,
        description: "Video output, numbered from 1 as on the router's labels." }
      label:  { type: string, required: true,
        label: Label,
        description: "The output's new name, as shown on the router and in Videohub software." }
    send: |
      OUTPUT LABELS:
      {output:-1} {label}
    expect: { contains: "ACK" }
    returns: ack
    # Videohub Ethernet Protocol v2.3 (November 2023), p.3-4 and p.6

  set_monitoring_output_label:
    summary: Set the label of a monitoring output
    params:
      monitoring_output: { type: int, min: 1, max: 288, required: true,
        label: Monitoring output,
        description: "Monitoring output, numbered from 1." }
      label:             { type: string, required: true,
        label: Label,
        description: "The monitoring output's new name." }
    send: |
      MONITORING OUTPUT LABELS:
      {monitoring_output:-1} {label}
    expect: { contains: "ACK" }
    returns: ack
    # Videohub Ethernet Protocol v2.3 (November 2023), p.3-4 and p.6

  set_serial_port_label:
    summary: Set the label of a serial port
    params:
      port:  { type: int, min: 1, max: 288, required: true,
        label: Serial port,
        description: "Serial (RS-422 deck control) port, numbered from 1." }
      label: { type: string, required: true,
        label: Label,
        description: "The serial port's new name." }
    send: |
      SERIAL PORT LABELS:
      {port:-1} {label}
    expect: { contains: "ACK" }
    returns: ack
    # Videohub Ethernet Protocol v2.3 (November 2023), p.3-4 and p.6

  set_frame_label:
    summary: Set the label of a frame buffer (Workgroup Videohub only)
    params:
      frame: { type: int, min: 1, max: 288, required: true,
        label: Frame buffer,
        description: "Frame buffer, numbered from 1 (Workgroup Videohub)." }
      label: { type: string, required: true,
        label: Label,
        description: "The frame buffer's new name." }
    send: |
      FRAME LABELS:
      {frame:-1} {label}
    expect: { contains: "ACK" }
    returns: ack
    # Videohub Ethernet Protocol v2.3 (November 2023), p.3-4 and p.6

  lock_output:
    summary: Lock a video output as owned by this client
    params:
      output: { type: int, min: 1, max: 288, required: true,
        label: Output,
