  - id: smart-videohub-cleanswitch-12x12
    name: Smart Videohub CleanSwitch 12x12
    supports:
      [set_route, set_input_label, set_output_label, lock_output, unlock_output,
       force_unlock_output, set_take_mode, get_device_info, get_input_labels,
       get_output_labels, get_video_output_routing, get_video_output_locks,
       get_configuration, get_network, get_network_interface, ping]
    verification: none
    notes: >
      12 inputs and 12 outputs, 6G-SDI, with resynchronisation on every input
      (Blackmagic tech specs). Covered by the May 2025 manual (protocol v2.8); front-
      panel 'use take' setting (Videohub manual, February 2020, p.11-12). Its RS-422
      port is a router-control input (Leitch protocol), not a routable serial port.
  - id: smart-videohub-12x12
    name: Smart Videohub 12x12 (6G-SDI)
    supports:
      [set_route, set_input_label, set_output_label, lock_output, unlock_output,
       force_unlock_output, get_device_info, get_input_labels, get_output_labels,
       get_video_output_routing, get_video_output_locks, ping]
    verification: none
    notes: >
      12 inputs and 12 outputs (Videohub manual, February 2020, p.10). It has a front-
      panel 'use take' setting (p.11-12), but its manual documents protocol v2.3, which
      has no take mode block.
