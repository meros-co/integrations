spec: 1
id: blackmagic-videohub
name: Blackmagic Smart Videohub
vendor: Blackmagic Design
category: router

source:
  - title: Videohub Ethernet Protocol
    note: Manufacturer-documented, published in the Videohub manual

transport:
  type: line-tcp
  port: 9990
  framing: block
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  reply_match: "^(ACK|NAK)"

models:
  - id: smart-videohub
    name: Blackmagic Smart Videohub (all sizes)
    supports:
      - set_route
      - set_input_label
      - set_output_label
      - lock_output
      - unlock_output
      - force_unlock_output
      - set_take_mode
    verification: none

commands:
  set_route:
    summary: Route an input to an output
    params:
      input:  { type: int, min: 1, max: 288, required: true }
      output: { type: int, min: 1, max: 288, required: true }
    send: |
      VIDEO OUTPUT ROUTING:
      {output:-1} {input:-1}
    expect: { contains: "ACK" }
    returns: ack

  set_input_label:
    params:
      input: { type: int, min: 1, max: 288, required: true }
      label: { type: string, max_length: 60, required: true }
    send: |
      INPUT LABELS:
      {input:-1} {label}
    expect: { contains: "ACK" }
    returns: ack

  set_output_label:
    params:
      output: { type: int, min: 1, max: 288, required: true }
      label:  { type: string, max_length: 60, required: true }
    send: |
      OUTPUT LABELS:
      {output:-1} {label}
    expect: { contains: "ACK" }
    returns: ack

  lock_output:
    summary: Lock an output as owned by this client
    params:
      output: { type: int, min: 1, max: 288, required: true }
    send: |
      VIDEO OUTPUT LOCKS:
      {output:-1} O
    expect: { contains: "ACK" }
    returns: ack

  unlock_output:
    summary: Release a lock held by this client
    params:
      output: { type: int, min: 1, max: 288, required: true }
    send: |
      VIDEO OUTPUT LOCKS:
      {output:-1} U
    expect: { contains: "ACK" }
    returns: ack

  force_unlock_output:
    summary: Release a lock held by another client
    params:
      output: { type: int, min: 1, max: 288, required: true }
    send: |
      VIDEO OUTPUT LOCKS:
      {output:-1} F
    expect: { contains: "ACK" }
    returns: ack

  set_take_mode:
    summary: Enable or disable take mode on the router
    params:
      enabled: { type: bool, required: true }
    send: |
      CONFIGURATION:
      Take Mode: {enabled}
    expect: { contains: "ACK" }
    returns: ack

telemetry:
  # The router sends its whole state as status blocks when a client connects,
  # and the changed block after every change, from any client or the panel.
  # Numbers are 0-based on the wire and 1-based in the state.
  updates:
    - header: "^PROTOCOL PREAMBLE:$"
      fields:
        Version: device.protocol_version
    - header: "^VIDEOHUB DEVICE:$"
      fields:
        Model name: device.model
        Video inputs: device.inputs
        Video outputs: device.outputs
    - header: "^INPUT LABELS:$"
      each_line: "^(\\d+) (.*)$"
      state: { "inputs.{1:+1}.label": "{2}" }
    - header: "^OUTPUT LABELS:$"
      each_line: "^(\\d+) (.*)$"
      state: { "outputs.{1:+1}.label": "{2}" }
    - header: "^VIDEO OUTPUT ROUTING:$"
      each_line: "^(\\d+) (\\d+)$"
      state: { "outputs.{1:+1}.input": "{2:+1}" }
    - header: "^VIDEO OUTPUT LOCKS:$"
      each_line: "^(\\d+) ([OLU])$"
      state:
        "outputs.{1:+1}.lock": { value: "{2}", map: { O: ours, L: other, U: unlocked } }
    - header: "^CONFIGURATION:$"
      fields:
        Take Mode: { path: take_mode, map: { "true": true, "false": false } }

state:
  device.protocol_version: { type: string, description: "Videohub protocol version" }
  device.model:            { type: string, description: "Model name the router reports" }
  device.inputs:           { type: int, description: "Number of video inputs" }
  device.outputs:          { type: int, description: "Number of video outputs" }
  inputs.*.label:          { type: string, description: "Input label, keyed by input number from 1" }
  outputs.*.label:         { type: string, description: "Output label, keyed by output number from 1" }
  outputs.*.input:         { type: int, description: "Input routed to the output, numbered from 1" }
  outputs.*.lock:          { type: string, description: "ours (locked by this client), other (locked by another client) or unlocked" }
  take_mode:               { type: bool, description: "Take mode" }

quirks:
  - models: [all]
    severity: critical
    text: >
      Inputs and outputs are 0-based on the wire. Operator-facing numbering is
      1-based, matching the front panel and the labels. Handled by the -1 offset
      in each command; an implementation that omits it routes to the wrong output.

  - models: [all]
    severity: info
    text: >
      The router answers each command block with ACK or NAK, and separately
      pushes status blocks (the protocol preamble on connect, and the new state
      after every change). Only ACK and NAK are taken as command replies.

  - models: [all]
    severity: warning
    text: >
      Commands are multi-line blocks terminated by a blank line. A partial block
      leaves the parser waiting rather than erroring.

  - models: [all]
    severity: warning
    text: >
      Locks are per-client. An output locked by another client reports "L" and
      cannot be released with unlock_output; force_unlock_output overrides it
      and will take routing control away from whoever holds it.

  - models: [all]
    severity: info
    text: >
      Label text is free-form. Newlines injected into a label would terminate
      the block early, so labels containing CR or LF are rejected.
