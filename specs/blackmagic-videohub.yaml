    notes: >
      8 12G-SDI inputs and 4 12G-SDI outputs (Blackmagic tech specs). Supports the
      Ethernet Videohub Control Protocol per its tech specs. Its outputs have a clean
      switch setting instead of take mode (Videohub manual, May 2025, p.27), which the
      protocol does not document.
  - id: videohub-mini-6x2-12g
    name: Blackmagic Videohub Mini 6x2 12G
    supports:
      [set_route, set_input_label, set_output_label, lock_output, unlock_output,
       force_unlock_output, get_device_info, get_input_labels, get_output_labels,
