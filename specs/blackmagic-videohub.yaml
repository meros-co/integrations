spec: 1
id: blackmagic-videohub
name: Blackmagic Videohub
vendor: Blackmagic Design
category: router

source:
  - title: Blackmagic Videohub Ethernet Protocol v2.3, Developer Information (November 2023)
    author: Blackmagic Design
    url: https://documents.blackmagicdesign.com/DeveloperManuals/VideohubEthernetProtocol.pdf
    note: >
      Manufacturer-documented, and the source of every block and command here unless
      the command says otherwise. Covers Blackmagic Videohub 12G, Universal Videohub and
      Smart Videohub CleanSwitch 12x12. Block framing, preamble and device block
      (p.2-3), label blocks (p.3), routing, processing unit and frame buffer blocks
      (p.4), lock blocks (p.4-5), serial port directions and hardware status (p.5-6),
      status updates, change requests and ACK/NAK (p.6-7), lock, unlock and forced
      unlock (p.7), status dump requests and PING (p.8). The protocol text is the same
      as in the May 2018 Videohub Developer Information
      (https://documents.blackmagicdesign.com/DeveloperManuals/VideohubDeveloperInformation.pdf).
  - title: Blackmagic Videohub Installation and Operation Manual (May 2025), Developer Information, Videohub Ethernet Protocol v2.8
    author: Blackmagic Design
    url: https://documents.blackmagicdesign.com/UserManuals/Videohub12GInstallation.pdf
    note: >
      Manufacturer-documented; covers Blackmagic Videohub 12G, Videohub Mini 12G and Smart
      Videohub CleanSwitch 12x12. Protocol v2.8 adds to v2.3 the device block's Friendly
      name and Unique ID fields (p.45-46), the NETWORK and NETWORK INTERFACE blocks
      (p.46), and the CONFIGURATION (Take Mode), TAKE MODE and END PRELUDE blocks (p.50).
      The rest of its protocol text matches v2.3 (p.45-49). Per-output take or cut bus
      mode on Videohub 12G, and clean switch on Videohub Mini 12G (p.27).
  - title: Videohub Installation and Operation Manual (February 2020)
    author: Blackmagic Design
    url: https://documents.blackmagicdesign.com/UserManuals/VideohubInstallation.pdf
    note: >
      Manufacturer-documented; page numbers are from the February 2020 edition. Model
      line-up and port counts: Universal Videohub 288 (p.26) and 72 (p.33); Broadcast,
      Studio, Compact, Micro and Smart Videohub (p.40-42); Smart Videohub 12x12, 20x20,
      40x40 and CleanSwitch 12x12 and their front-panel 'use take' setting (p.10-12).
      Its Developer Information section repeats protocol v2.3.
  - title: Blackmagic Videohub tech specs
    author: Blackmagic Design
    url: https://www.blackmagicdesign.com/products/blackmagicvideohub/techspecs
    note: >
      Manufacturer-documented. Current models and SDI input/output counts: Videohub
      10x10, 20x20, 40x40, 80x80 and 120x120 12G, Videohub Mini 4x2, 6x2 and 8x4 12G,
      and Smart Videohub CleanSwitch 12x12; each lists the Ethernet Videohub Control
      Protocol.
  - title: videohub crate 1.0.1 (omnimatrix), parser
    author: vifino
    url: https://github.com/vifino/omnimatrix/tree/main/crates/videohub
    note: >
      Community source (MIT licence), used only for the ALARM STATUS block, which
      Blackmagic does not document; its parser reads that block as "name: status"
      lines. Its captured CleanSwitch 12x12 dump (protocol 2.8) also corroborates the
      documented CONFIGURATION and END PRELUDE blocks.

transport:
  type: line-tcp
  port: 9990
  framing: block
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  reply_match: "^(ACK|NAK)"
  probe: "PING:"

ports:
  - { port: 9990, protocol: tcp, role: control }

models:
  - id: videohub-120x120-12g
    name: Blackmagic Videohub 120x120 12G
    supports:
      [set_route, set_input_label, set_output_label, lock_output, unlock_output,
       force_unlock_output, set_take_mode, set_output_take_mode, get_device_info,
       get_input_labels, get_output_labels, get_video_output_routing,
       get_video_output_locks, get_configuration, get_take_mode, get_network,
       get_network_interface, ping]
    verification: none
    notes: >
      120 12G-SDI inputs and 120 12G-SDI outputs; no monitoring or serial ports
      (Blackmagic tech specs). Take or cut bus mode per output (Videohub manual, May
      2025, p.27).
  - id: videohub-80x80-12g
    name: Blackmagic Videohub 80x80 12G
    supports:
      [set_route, set_input_label, set_output_label, lock_output, unlock_output,
       force_unlock_output, set_take_mode, set_output_take_mode, get_device_info,
       get_input_labels, get_output_labels, get_video_output_routing,
       get_video_output_locks, get_configuration, get_take_mode, get_network,
       get_network_interface, ping]
    verification: none
    notes: >
      80 12G-SDI inputs and 80 12G-SDI outputs; no monitoring or serial ports
      (Blackmagic tech specs). Take or cut bus mode per output (Videohub manual, May
      2025, p.27).
  - id: videohub-40x40-12g
    name: Blackmagic Videohub 40x40 12G
    supports:
