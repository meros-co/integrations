telemetry:
  # The Videohub Server sends its whole state as status blocks when a client
  # connects, then the changed lines of a block after every change made by any
  # client or panel (p.2-6). A status request (get_*) is answered with ACK and
  # then the full block, which these same rules read. Nothing needs polling.
  # Numbers are 0-based on the wire and 1-based in the state.
  updates:
    - header: "^PROTOCOL PREAMBLE:$"
      fields:
        Version: device.protocol_version
    - header: "^VIDEOHUB DEVICE:$"
      fields:
        Device present: device.present
        Model name: device.model
        Friendly name: device.friendly_name
        Unique ID: device.unique_id
        Video inputs: device.inputs
        Video processing units: device.processing_units
        Video outputs: device.outputs
        Video monitoring outputs: device.monitoring_outputs
        Serial ports: device.serial_ports
    - header: "^INPUT LABELS:$"
      each_line: "^(\\d+) (.*)$"
      state: { "inputs.{1:+1}.label": "{2}" }
    - header: "^OUTPUT LABELS:$"
      each_line: "^(\\d+) (.*)$"
      state: { "outputs.{1:+1}.label": "{2}" }
    - header: "^MONITORING OUTPUT LABELS:$"
      each_line: "^(\\d+) (.*)$"
      state: { "monitoring_outputs.{1:+1}.label": "{2}" }
    - header: "^SERIAL PORT LABELS:$"
      each_line: "^(\\d+) (.*)$"
      state: { "serial_ports.{1:+1}.label": "{2}" }
    - header: "^FRAME LABELS:$"
      each_line: "^(\\d+) (.*)$"
      state: { "frame_buffers.{1:+1}.label": "{2}" }
    - header: "^VIDEO OUTPUT ROUTING:$"
      each_line: "^(\\d+) (\\d+)$"
      state: { "outputs.{1:+1}.input": "{2:+1}" }
    - header: "^VIDEO MONITORING OUTPUT ROUTING:$"
      each_line: "^(\\d+) (\\d+)$"
      state: { "monitoring_outputs.{1:+1}.input": "{2:+1}" }
    - header: "^SERIAL PORT ROUTING:$"
      each_line: "^(\\d+) (\\d+)$"
      state: { "serial_ports.{1:+1}.source_port": "{2:+1}" }
    - header: "^PROCESSING UNIT ROUTING:$"
      each_line: "^(\\d+) (\\d+)$"
      state: { "processing_units.{1:+1}.source": "{2:+1}" }
    - header: "^FRAME BUFFER ROUTING:$"
      each_line: "^(\\d+) (\\d+)$"
      state: { "frame_buffers.{1:+1}.source": "{2:+1}" }
    - header: "^VIDEO OUTPUT LOCKS:$"
      each_line: "^(\\d+) ([OLU])$"
      state:
        "outputs.{1:+1}.lock": { value: "{2}", map: { O: ours, L: other, U: unlocked } }
    - header: "^MONITORING OUTPUT LOCKS:$"
      each_line: "^(\\d+) ([OLU])$"
      state:
        "monitoring_outputs.{1:+1}.lock": { value: "{2}", map: { O: ours, L: other, U: unlocked } }
    - header: "^SERIAL PORT LOCKS:$"
      each_line: "^(\\d+) ([OLU])$"
      state:
        "serial_ports.{1:+1}.lock": { value: "{2}", map: { O: ours, L: other, U: unlocked } }
    - header: "^PROCESSING UNIT LOCKS:$"
      each_line: "^(\\d+) ([OLU])$"
      state:
        "processing_units.{1:+1}.lock": { value: "{2}", map: { O: ours, L: other, U: unlocked } }
    - header: "^FRAME BUFFER LOCKS:$"
      each_line: "^(\\d+) ([OLU])$"
      state:
        "frame_buffers.{1:+1}.lock": { value: "{2}", map: { O: ours, L: other, U: unlocked } }
    - header: "^SERIAL PORT DIRECTIONS:$"
      each_line: "^(\\d+) (control|slave|auto)$"
      state: { "serial_ports.{1:+1}.direction": "{2}" }
    - header: "^VIDEO INPUT STATUS:$"
      each_line: "^(\\d+) (None|BNC|Optical)$"
      state: { "inputs.{1:+1}.hardware": "{2}" }
    - header: "^VIDEO OUTPUT STATUS:$"
      each_line: "^(\\d+) (None|BNC|Optical)$"
      state: { "outputs.{1:+1}.hardware": "{2}" }
    - header: "^SERIAL PORT STATUS:$"
      each_line: "^(\\d+) (None|RS422)$"
      state: { "serial_ports.{1:+1}.hardware": "{2}" }
    # Protocol v2.8 (May 2025 manual, p.46 and p.50).
    - header: "^NETWORK:$"
      fields:
        Interface Count: network.interface_count
        Default Interface: network.default_interface
    - header: "^NETWORK INTERFACE:$"
      fields:
        Name: network.interface.name
        Priority: network.interface.priority
        MAC Address: network.interface.mac_address
        Dynamic IP: { path: network.interface.dynamic_ip, map: { "true": true, "false": false } }
        Current Addresses: network.interface.current_addresses
        Current Gateway: network.interface.current_gateway
        Static Addresses: network.interface.static_addresses
        Static Gateway: network.interface.static_gateway
    - header: "^CONFIGURATION:$"
      fields:
        Take Mode: { path: take_mode, map: { "true": true, "false": false } }
    - header: "^TAKE MODE:$"
      each_line: "^(\\d+) (true|false)$"
      state:
        "outputs.{1:+1}.take_mode": { value: "{2}", map: { "true": true, "false": false } }
    - match: "^END PRELUDE:$"
      state: { device.prelude_complete: "true" }
    # Not in Blackmagic's documents; community-observed (see sources and quirks).
    - header: "^ALARM STATUS:$"
      each_line: "^([^:]+): (.+)$"
      state: { "alarms.{1}": "{2}" }

state:
  device.protocol_version:     { type: string, description: "Protocol version from the preamble, e.g. 2.3" }
  device.present:              { type: string, description: "Device present: true, false (no router attached to the Videohub Server) or the needs-update value (incompatible router firmware). Nothing further is sent unless it is true" }
  device.model:                { type: string, description: "Model name the router reports" }
  device.friendly_name:        { type: string, description: "Friendly name (protocol 2.8)" }
  device.unique_id:            { type: string, description: "Unique device ID (protocol 2.8)" }
  device.inputs:               { type: int, description: "Number of video inputs" }
  device.processing_units:     { type: int, description: "Number of video processing units" }
  device.outputs:              { type: int, description: "Number of video outputs" }
  device.monitoring_outputs:   { type: int, description: "Number of video monitoring outputs" }
  device.serial_ports:         { type: int, description: "Number of serial ports" }
  device.prelude_complete:     { type: bool, description: "True once END PRELUDE arrives, marking the end of the initial status dump (protocol 2.8)" }
  inputs.*.label:              { type: string, description: "Input label, keyed by input number from 1" }
  inputs.*.hardware:           { type: string, description: "Input hardware: None, BNC or Optical (Universal Videohub)" }
  outputs.*.label:             { type: string, description: "Output label, keyed by output number from 1" }
  outputs.*.input:             { type: int, description: "Input routed to the output, numbered from 1" }
  outputs.*.lock:              { type: string, description: "ours (locked from this client's IP address), other (locked by another client) or unlocked" }
  outputs.*.take_mode:         { type: bool, description: "Output uses the take button (true) or cut bus mode (false) (protocol 2.8)" }
  outputs.*.hardware:         { type: string, description: "Output hardware: None, BNC or Optical (Universal Videohub)" }
  monitoring_outputs.*.label:  { type: string, description: "Monitoring output label, numbered from 1" }
  monitoring_outputs.*.input:  { type: int, description: "Input routed to the monitoring output, numbered from 1" }
  monitoring_outputs.*.lock:   { type: string, description: "ours, other or unlocked" }
  serial_ports.*.label:        { type: string, description: "Serial port label, numbered from 1" }
  serial_ports.*.source_port:  { type: int, description: "Serial port routed to this serial port, numbered from 1" }
  serial_ports.*.lock:         { type: string, description: "ours, other or unlocked" }
  serial_ports.*.direction:    { type: string, description: "control (In, Workstation), slave (Out, Deck) or auto (Automatic)" }
  serial_ports.*.hardware:     { type: string, description: "Serial port hardware: None or RS422 (Universal Videohub)" }
  processing_units.*.source:   { type: int, description: "Source routed to the processing unit, numbered from 1 (Workgroup Videohub)" }
  processing_units.*.lock:     { type: string, description: "ours, other or unlocked" }
  frame_buffers.*.label:       { type: string, description: "Frame buffer label, numbered from 1 (Workgroup Videohub)" }
  frame_buffers.*.source:      { type: int, description: "Source routed to the frame buffer, numbered from 1 (Workgroup Videohub)" }
  frame_buffers.*.lock:        { type: string, description: "ours, other or unlocked" }
  take_mode:                   { type: bool, description: "Take mode from the CONFIGURATION block (protocol 2.8)" }
  network.interface_count:     { type: int, description: "Number of network interfaces (protocol 2.8)" }
  network.default_interface:   { type: int, description: "Default network interface, numbered as the router sends it (protocol 2.8)" }
  network.interface.name:      { type: string, description: "Interface name, e.g. 1 GbE" }
  network.interface.priority:  { type: int, description: "Interface priority" }
  network.interface.mac_address: { type: string, description: "MAC address" }
  network.interface.dynamic_ip: { type: bool, description: "DHCP in use" }
  network.interface.current_addresses: { type: string, description: "Current IP address/subnet mask" }
  network.interface.current_gateway: { type: string, description: "Current gateway" }
  network.interface.static_addresses: { type: string, description: "Configured static IP addresses" }
  network.interface.static_gateway: { type: string, description: "Configured static gateway" }
  alarms.*:                    { type: string, description: "Alarm status keyed by the name the router gives it, such as a fan or power supply (undocumented ALARM STATUS block)" }

quirks:
  - models: [all]
    severity: critical
    text: >
      Ports are numbered from zero on the wire, zero being port one on the chassis
      (p.3). Operator-facing numbering here is 1-based, as on the front panel and in
      Videohub Control. The -1 offset in each command and +1 in telemetry handle it;
      an implementation that omits it routes to the wrong port.

  - models: [all]
    severity: warning
    text: >
      ACK means the request was understood, not that it was carried out (p.6-7).
      Only the status block that follows confirms a change, and it can differ from
      the request when other clients change the same port at the same time or the
      request could not be performed. Take state only from status blocks, never from
      a request. NAK means the block was not understood.

  - models: [all]
    severity: info
    text: >
      The server pushes status blocks at any time: the full dump on connecting and
      the changed lines after every change (p.2, p.6). Only ACK and NAK are taken as
      command replies. A status request (get_*) is answered with ACK and then the full
      block (p.8); the block updates state through telemetry, so the command itself
      returns only the acknowledgement.

  - models: [all]
    severity: warning
    text: >
      Each block ends with a blank line, and the server acts on it only then (p.6).
      A partial block leaves the server waiting rather than erroring.

  - models: [all]
    severity: warning
    text: >
      Locks belong to the client's IP address: O is owned by this client (locked
      from the same IP address), L by another client, U unlocked (p.4). A lock held
      by another client cannot be released with an unlock command; the force_unlock
      commands send F, which overrides it and takes control from whoever holds it
      (p.7). Two clients on one IP address share ownership.

  - models: [smart-videohub]
    severity: warning
    text: >
      The Smart Videohub front-panel buttons override any existing route, including
      destinations locked with Videohub software (Videohub manual, February 2020, p.42).

  - models: [all]
    severity: info
    text: >
      Blocks for ports a router lacks are not sent: no monitoring or serial blocks
      without those ports (p.3-5), processing unit and frame buffer blocks only on the
      Workgroup Videohub (p.4-5), hardware status blocks only on Universal Videohubs
      (p.5). The VIDEOHUB DEVICE block reports the counts. Parameter ranges allow 288,
      the largest documented router; the document does not say how the server answers
      a port beyond the router's count, so check device.inputs, device.outputs and the
      other counts before sending.

  - models: [all]
    severity: warning
    text: >
      When no router is attached to the Videohub Server, or the router needs a
      firmware update, the device block reports Device present false or the
      needs-update value and nothing further is sent (p.3). Both editions typeset that
      value as "needs _ update", so its exact spelling is uncertain; it is kept as sent.
      When a new router is attached, the server resends every block except the
      preamble (p.3). Broadcast, Studio and Workgroup Videohubs are shared over USB by
      a Videohub Server computer, which is the TCP endpoint.

  - models: [all]
    severity: info
    text: >
      Clients must ignore blocks and lines they do not recognise (p.2); compatible
      protocol changes raise only the minor version. Routers covered by the May 2025
      manual speak v2.8, whose documented device block omits the processing unit,
      monitoring and serial counts; routers documented only for v2.3 are not documented
      to send the v2.8 blocks.

  - models: [universal-videohub-72, universal-videohub-288]
    severity: info
    text: >
      Hardware status blocks (VIDEO INPUT STATUS, VIDEO OUTPUT STATUS, SERIAL PORT
      STATUS) come only from the server, and again for a card's ports when a card is
      plugged in or removed; blocks a client sends are ignored (p.6-7).

  - models: [all]
    severity: info
    text: >
      Labels are free text with no documented length limit. A label holding CR or LF
      would end the block early and is rejected before sending. One block may carry
      several routes, labels or locks (p.6); these commands send one line per block.

  - models: [studio-videohub, broadcast-videohub, universal-videohub-72, universal-videohub-288, workgroup-videohub]
    severity: warning
    text: >
      The document says clients change labels, locks and routes by sending a block
      (p.6) but does not say whether SERIAL PORT DIRECTIONS can be set the same way;
      it describes that block only as status (p.5). set_serial_port_direction sends it
      in the documented block form; ACK/NAK and the following status block show
      whether the router accepted it.

  - models: [workgroup-videohub]
    severity: warning
    text: >
      The document gives PROCESSING UNIT ROUTING and FRAME BUFFER ROUTING only by
      example ("0 5", "0 7", p.4) and does not say what the second number indexes.
      Here the first number is the processing unit or frame buffer and the second its
      source, by analogy with the other routing blocks, and the source is offset by
      one like every other port.

  - models: [videohub-120x120-12g, videohub-80x80-12g, videohub-40x40-12g, videohub-20x20-12g, videohub-10x10-12g, smart-videohub-cleanswitch-12x12]
    severity: warning
    text: >
      The May 2025 manual gives CONFIGURATION (Take Mode) and TAKE MODE only as status
      the router reports (p.50). It does not say whether a client may set them, nor how
      the single Take Mode value relates to the per-output TAKE MODE lines.
      set_take_mode and set_output_take_mode send the blocks in the documented form;
      ACK/NAK and the following status block show whether the router accepted them.
      The p.50 examples also omit the blank line before END PRELUDE; every block is
      taken to end with a blank line, as p.45 states.

  - models: [videohub-120x120-12g, videohub-80x80-12g, videohub-40x40-12g, videohub-20x20-12g, videohub-10x10-12g, videohub-mini-8x4-12g, videohub-mini-6x2-12g, videohub-mini-4x2-12g, smart-videohub-cleanswitch-12x12]
    severity: info
    text: >
      The NETWORK INTERFACE block is documented with a single header and no interface
      number (p.46), so state holds one interface; a router reporting an Interface
      Count above 1 would overwrite it. Network settings are reported only: the manual
      documents no way to change them over this protocol.

  - models: [universal-videohub-72, universal-videohub-288]
    severity: warning
    text: >
      ALARM STATUS is not in Blackmagic's documents. It comes from a community parser
      (see sources); its names (fans, power supplies) are model-specific and are kept
      as the router sends them. Whether a router sends it depends on model and firmware.
