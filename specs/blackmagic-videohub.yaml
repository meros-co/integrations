    verification: none
    notes: >
      40 12G-SDI inputs and 40 12G-SDI outputs; no monitoring or serial ports
      (Blackmagic tech specs). Take or cut bus mode per output (Videohub manual, May
      2025, p.27).
  - id: videohub-20x20-12g
    name: Blackmagic Videohub 20x20 12G
    supports:
      [set_route, set_input_label, set_output_label, lock_output, unlock_output,
