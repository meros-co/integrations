  - id: micro-videohub
    name: Micro Videohub (3G-SDI, 16x16)
    supports:
      [set_route, set_input_label, set_output_label, lock_output, unlock_output,
       force_unlock_output, get_device_info, get_input_labels, get_output_labels,
       get_video_output_routing, get_video_output_locks, ping]
    verification: none
    notes: >
      16 SDI inputs and 16 SDI outputs (Videohub manual, February 2020, p.40).
  - id: compact-videohub
    name: Compact Videohub (3G-SDI, 40x40)
    supports:
      [set_route, set_input_label, set_output_label, lock_output, unlock_output,
       force_unlock_output, get_device_info, get_input_labels, get_output_labels,
       get_video_output_routing, get_video_output_locks, ping]
    verification: none
    notes: >
      40 SDI inputs and 40 SDI outputs (Videohub manual, February 2020, p.40).
  - id: studio-videohub
    name: Studio Videohub (3G-SDI)
    supports:
      [set_route, set_monitoring_route, set_serial_route, set_input_label,
       set_output_label, set_monitoring_output_label, set_serial_port_label, lock_output,
