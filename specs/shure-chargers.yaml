spec: 1
id: shure-chargers
name: "Shure networked battery chargers (SBC220, SBC240, SBC840, SBC840M, SBRC, MXCWNCS, SBC250, SBC450, SBC850)"
vendor: Shure
category: other

# Shure's networked chargers answer the command strings on TCP 2202:
# GET, SET and REP in angle brackets, a REP pushed whenever a value changes
# (a charging battery's charge and time to full tick on their own). Bays and
# modules are numbered from 1, 0 meaning all. SBC250, SBC450 and SBC850, the
# ULX-D conference docking stations, have an older, smaller set.
source:
  - title: "SBC220 SBC240 Command Strings, Version 2.1 (2024-H)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/SBC220-240/en-US"
    note: >
      Manufacturer document (PDF docId 7301). TCP 2202, device the server, GET/SET/REP and REP on
      change p.3; ALL, DEVICE_ID (1-8 characters set, 31 reported), FW_VER, FLASH, MODEL,
      NET_SETTINGS (SC, AUTO or MANUAL, zero-padded addresses, no asynchronous report), REBOOT,
      STORAGE_MODE; BATT_MODULE_TYPE (000, 129, 133, 255); bay commands BATT_BARS,
      BATT_CAPACITY_MAX, BATT_CHARGE, BATT_CURRENT_CAPACITY, BATT_CURRENT_CAPACITY_MAX, BATT_CYCLE,
      BATT_DETECTED, BATT_ERROR (000-007, 255), BATT_HEALTH, BATT_STATE, BATT_TEMP_C and BATT_TEMP_F
      (offset 40), BATT_TIME_TO_FULL (65529 full, 65533-65535).
  - title: "SBC840 SBC840M Command Strings, Version 1.2 (2024-H)"
    author: Shure Incorporated
    url: "https://www.shure.com/en-US/docs/commandstrings/SBC840_SBC840M"
    note: >
      Manufacturer document (PDF docId 7978). The same set for an 8-bay single-module charger;
      BATT_MODULE_TYPE 128 (SBC840) and 130 (SBC840M); REP FLASH OFF when identifying ends.
  - title: "Shure Battery Rack Mount Charger (SBRC) Command Strings, Version 1 (2020-G)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/SBRC/en-US"
    note: >
      Manufacturer document (PDF docId 7725). The same set without NET_SETTINGS and REBOOT;
      BATT_MODULE_TYPE 001 AXT902, 002 AXT901, 003 SBC-AX, 004 SBM920, 005 SBM910, 006 SBM910M, 255
      invalid.
  - title: "MXCWNCS Command Strings, Version 4 (2020-B)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/MXCWNCS/en-US"
    note: >
      Manufacturer document (PDF docId 6943). Bays 1-10; GET and SET FLASH; DEVICE_ID of 1-31
      characters; STORAGE_MODE; the bay commands with BATT_TIME_TO_FULL 65530 hot, 65531 warm, 65532
      cold; BATT_MODULE_TYPE 001 MXCWNCS.
  - title: "Command Strings for ULX-D Receivers, Shure Applications Engineering Technical Bulletin (RW 1/12/2018), Battery Charger Commands p.8-9"
    author: Shure Incorporated
    url: "https://content-files.shure.com/Pubs/ulx/ulx-d-network-string-commands.pdf"
    note: >
      Manufacturer document. SBC250, SBC450 and SBC850: ALL, DEVICE_ID (read only, 8 characters),
      MODEL, FW_VER, FLASH (GET and SET, off after 60 s), TX_AVAILABLE, TX_TYPE (ULXD6, ULXD8,
      UNAVAILABLE, OTHER), FREQUENCY (six digits, kHz), BATT_BARS, BATT_TIME_TO_FULL, BATT_CHARGE,
      BATT_CYCLE, BATT_HEALTH; bays 0-4 (SBC450) and 0-8 (SBC850); 252-255 and 65532-65535
      unavailable.

transport:
  type: line-tcp
  port: 2202
  framing: delimited
  open: "< "
  close: " >"
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # Answers and change reports are both REP: commands name the parameter
  # their REP carries (expect.reply_contains).
  reply_match: "^< REP "
  error_match: "^< REP ERR"
  probe: "GET MODEL"

ports:
  - { port: 2202, protocol: tcp, role: control }

