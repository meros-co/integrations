spec: 1
id: dtvideolabs-playbackpro-plus
name: PlaybackPro Plus
vendor: DT Videolabs
category: playback

source:
  - title: PlaybackPro Plus X User Guide (4.0 and later), "Controller Options" > "UDP and TCP/IP Remote Control"
    url: https://www.dtvideolabs.com/user-guide-playbackproplus-x/
    note: >
      Manufacturer document (the online user guide the DT Videolabs User
      Guides page links for PlaybackPro Plus X 4.0+), retrieved 2026-10-23.
      Remote control options (No Control, UDP Listen, TCP/IP Listen, DT18,
      SimpleSync); UDP on port 7000; TCP listening for a connection on port
      4647, the Network Status then showing TCP/IP Connected; the four
      command tables (Preview Functions, Program Functions, Show Controls,
      Show Inquiries with their return values, commas in returned values
      replaced by periods); the Goto 10/20/30 buttons going to that many
      seconds before the Out Point; End All and its fade-out
  - title: PlaybackPro Plus User Guide (3.8.0 and later)
    url: https://www.dtvideolabs.com/user-guide-playbackproplus/
    note: >
      Manufacturer document for the earlier version: the same remote control
      options, giving port 7000 for TCP as well as UDP; the online page shows
      no command tables
  - title: companion-module-dtvideolabs-playbackproplus (MIT)
    url: https://github.com/bitfocus/companion-module-dtvideolabs-playbackproplus
    note: >
      MIT licence (top-level LICENSE). Read, not copied, as corroboration:
      each command sent over TCP to 4647 (or UDP to 7000) as its two
      characters alone, with no line ending, and the clip number written
      after GO and GT without padding (GO7); it reads no answers (main.js,
      actions.js)

transport:
  type: line-tcp
  port: 4647
  # Each command is sent as it is, with nothing added (the guide gives no
  # terminator; the Companion module sends none). Answers to the inquiries
  # are read as lines.
  framing: delimited
  open: ""
  close: ""
  reply_framing: line
  encoding: utf-8
  timeout_ms: 2000
  reply: expected

ports:
  - { port: 4647, protocol: tcp, role: control, note: "Network Setup > TCP/IP Listen in PlaybackPro Plus X; the 3.8 guide gives 7000" }

models:
  - id: playbackpro-plus-x
    name: PlaybackPro Plus X (4.0 and later)
    supports:
      [preview_fast_forward, preview_fast_reverse, preview_go_to_in, preview_go_to_out, preview_mark_in,
       preview_mark_out, preview_play_pause, preview_step_back, preview_step_forward, take,
       end_all, program_fast_forward, program_fast_reverse, go_to_10_seconds, go_to_20_seconds,
       go_to_30_seconds, program_go_to_in, program_go_to_out, enable_loop_temp, disable_loop_temp,
       pause, play, program_play_pause, program_step_back, program_step_forward,
       clear_preview, decrease_end_all_fade, increase_end_all_fade, toggle_freeze_temp, decrease_link_temp,
       increase_link_temp, toggle_link_temp, decrease_loop_temp, increase_loop_temp, toggle_loop_temp,
       next_clip, previous_clip, save_show, decrease_fade_on_take, increase_fade_on_take,
       decrease_take_duration, increase_take_duration, load_preview, load_and_take, select_preview_by_id,
       take_by_id, get_clip_durations, get_clip_names, get_clip_numbers, get_clip_ids,
       get_loop_status, get_playback_status, get_preview_duration, get_preview_name, get_preview_number,
       get_program_duration, get_program_name, get_program_number, get_time_elapsed, get_time_remaining,
       get_show_file, send_command]
    verification: none
  - id: playbackpro-plus-3
    name: PlaybackPro Plus 3.8
    supports:
      [preview_fast_forward, preview_fast_reverse, preview_go_to_in, preview_go_to_out, preview_mark_in,
       preview_mark_out, preview_play_pause, preview_step_back, preview_step_forward, take,
       end_all, program_fast_forward, program_fast_reverse, go_to_10_seconds, go_to_20_seconds,
       go_to_30_seconds, program_go_to_in, program_go_to_out, enable_loop_temp, disable_loop_temp,
       pause, play, program_play_pause, program_step_back, program_step_forward,
       clear_preview, decrease_end_all_fade, increase_end_all_fade, toggle_freeze_temp, decrease_link_temp,
       increase_link_temp, toggle_link_temp, decrease_loop_temp, increase_loop_temp, toggle_loop_temp,
       next_clip, previous_clip, save_show, decrease_fade_on_take, increase_fade_on_take,
       decrease_take_duration, increase_take_duration, load_preview, load_and_take, select_preview_by_id,
       take_by_id, get_clip_durations, get_clip_names, get_clip_numbers, get_clip_ids,
       get_loop_status, get_playback_status, get_preview_duration, get_preview_name, get_preview_number,
       get_program_duration, get_program_name, get_program_number, get_time_elapsed, get_time_remaining,
       get_show_file, send_command]
    verification: none
    notes: >
      Its guide gives TCP control on port 7000 rather than 4647: open it on
      the port its Network Setup shows. The command tables are those of the
      Plus X guide.

commands:
  preview_fast_forward:
    summary: "Fast-forward the Preview clip (EF, Set Fast Forward Speed)"
    send: "EF"
    returns: none
  preview_fast_reverse:
    summary: "Fast-reverse the Preview clip (ER, Set Fast Reverse Speed)"
    send: "ER"
    returns: none
  preview_go_to_in:
    summary: "Go to the Preview clip's In Point (EI)"
    send: "EI"
    returns: none
  preview_go_to_out:
    summary: "Go to the Preview clip's Out Point (EO)"
    send: "EO"
    returns: none
  preview_mark_in:
    summary: "Mark the In Point of the Preview clip at its position (ES)"
    send: "ES"
    returns: none
  preview_mark_out:
    summary: "Mark the Out Point of the Preview clip at its position (EE)"
    send: "EE"
    returns: none
  preview_play_pause:
    summary: "Play or pause the Preview clip (EP, Toggle Play/Pause)"
    send: "EP"
    returns: none
  preview_step_back:
    summary: "Step the Preview clip back one frame (E-)"
    send: "E-"
    returns: none
  preview_step_forward:
    summary: "Step the Preview clip forward one frame (E+)"
    send: "E+"
    returns: none
  take:
    summary: "Take the Preview clip to Program (TA)"
    send: "TA"
    returns: none
  end_all:
    summary: "End all Program playback (KL, End All)"
    send: "KL"
    returns: none
  program_fast_forward:
    summary: "Fast-forward the Program clip (OF, Set Fast Forward Speed)"
    send: "OF"
    returns: none
  program_fast_reverse:
    summary: "Fast-reverse the Program clip (OR, Set Fast Reverse Speed)"
    send: "OR"
    returns: none
  go_to_10_seconds:
    summary: "Jump the Program clip to 10 seconds before its Out Point (10, Goto 10)"
    send: "10"
    returns: none
  go_to_20_seconds:
    summary: "Jump the Program clip to 20 seconds before its Out Point (20, Goto 20)"
    send: "20"
    returns: none
  go_to_30_seconds:
    summary: "Jump the Program clip to 30 seconds before its Out Point (30, Goto 30)"
    send: "30"
    returns: none
  program_go_to_in:
    summary: "Go to the Program clip's In Point (OI)"
    send: "OI"
    returns: none
  program_go_to_out:
    summary: "Go to the Program clip's Out Point (OO)"
    send: "OO"
    returns: none
  enable_loop_temp:
    summary: "Turn Loop Temp on (SL, Enable Loop Temp)"
    send: "SL"
    returns: none
  disable_loop_temp:
    summary: "Turn Loop Temp off (EL, Disable Loop Temp)"
    send: "EL"
    returns: none
  pause:
    summary: "Pause Program playback (PA)"
    send: "PA"
    returns: none
  play:
    summary: "Play the Program clip from where it is (PL)"
    send: "PL"
    returns: none
  program_play_pause:
    summary: "Play or pause the Program clip (OP, Toggle Play/Pause)"
    send: "OP"
    returns: none
  program_step_back:
    summary: "Step the Program clip back one frame (O-)"
    send: "O-"
    returns: none
  program_step_forward:
    summary: "Step the Program clip forward one frame (O+)"
    send: "O+"
    returns: none
  clear_preview:
    summary: "Clear the Preview clip (CL)"
    send: "CL"
    returns: none
  decrease_end_all_fade:
    summary: "Shorten the End All fade-out (K-)"
    send: "K-"
    returns: none
  increase_end_all_fade:
    summary: "Lengthen the End All fade-out (K+)"
    send: "K+"
    returns: none
  toggle_freeze_temp:
    summary: "Turn Freeze Temp on or off (FT)"
    send: "FT"
    returns: none
  decrease_link_temp:
    summary: "Shorten the Link Temp duration (I-)"
    send: "I-"
    returns: none
  increase_link_temp:
    summary: "Lengthen the Link Temp duration (I+)"
    send: "I+"
    returns: none
  toggle_link_temp:
    summary: "Turn Link Temp on or off (IT)"
    send: "IT"
    returns: none
  decrease_loop_temp:
    summary: "Shorten the Loop Temp duration (L-)"
    send: "L-"
    returns: none
  increase_loop_temp:
    summary: "Lengthen the Loop Temp duration (L+)"
    send: "L+"
    returns: none
  toggle_loop_temp:
    summary: "Turn Loop Temp on or off (LT)"
    send: "LT"
    returns: none
  next_clip:
    summary: "Select the next clip for Preview (NX)"
    send: "NX"
    returns: none
  previous_clip:
    summary: "Select the previous clip for Preview (PR)"
    send: "PR"
    returns: none
  save_show:
    summary: "Save the show file (SA)"
    send: "SA"
    returns: none
  decrease_fade_on_take:
    summary: "Shorten the Fade On Take duration (F-)"
    send: "F-"
    returns: none
  increase_fade_on_take:
    summary: "Lengthen the Fade On Take duration (F+)"
    send: "F+"
    returns: none
  decrease_take_duration:
    summary: "Shorten the Take duration (T-)"
    send: "T-"
    returns: none
  increase_take_duration:
    summary: "Lengthen the Take duration (T+)"
    send: "T+"
    returns: none
  load_preview:
    summary: "Load a clip into Preview by its number (GOxxx)"
    params:
      clip: { type: "int", min: 0, max: 999, required: true, label: "Clip number", description: "The number in the clip's # field (the guide's xxx: up to three digits)." }
    send: "GO{clip}"
    returns: none
  load_and_take:
    summary: "Load a clip by its number and take it to Program (GTxxx)"
    params:
      clip: { type: "int", min: 0, max: 999, required: true, label: "Clip number", description: "The number in the clip's # field (the guide's xxx: up to three digits)." }
    send: "GT{clip}"
    returns: none
  select_preview_by_id:
    summary: "Select a clip for Preview by its ID (SIxxx)"
    params:
      id: { type: "int", min: 0, max: 999, required: true, label: "Clip ID", description: "The clip's ID, as the ID inquiry lists it (the guide's xxx: up to three digits)." }
    send: "SI{id}"
    returns: none
  take_by_id:
    summary: "Take a clip to Program by its ID (TIxxx)"
    params:
      id: { type: "int", min: 0, max: 999, required: true, label: "Clip ID", description: "The clip's ID, as the ID inquiry lists it (the guide's xxx: up to three digits)." }
    send: "TI{id}"
    returns: none
  get_clip_durations:
    summary: "Read every clip's duration, comma-delimited (AD)"
    send: "AD"
    expect: { matches: "^(.*)$" }
    returns: value
  get_clip_names:
    summary: "Read every clip's name, comma-delimited (AN)"
    send: "AN"
    expect: { matches: "^(.*)$" }
    returns: value
  get_clip_numbers:
    summary: "Read every clip's number, comma-delimited (AU)"
    send: "AU"
    expect: { matches: "^(.*)$" }
    returns: value
  get_clip_ids:
    summary: "Read every clip's ID and file name, comma-delimited (ID)"
    send: "ID"
    expect: { matches: "^(.*)$" }
    returns: value
  get_loop_status:
    summary: "Read whether the Program clip loops: Yes or No (LS)"
    send: "LS"
    expect: { matches: "^(.*)$" }
    returns: value
  get_playback_status:
    summary: "Read Program playback: 0 paused, 1 playing, N/A no clip (PS)"
    send: "PS"
    expect: { matches: "^(.*)$" }
    returns: value
  get_preview_duration:
    summary: "Read the Preview clip's duration, 00:00:00:00 (VD)"
    send: "VD"
    expect: { matches: "^(.*)$" }
    returns: value
  get_preview_name:
    summary: "Read the Preview clip's name (VN)"
    send: "VN"
    expect: { matches: "^(.*)$" }
    returns: value
  get_preview_number:
    summary: "Read the Preview clip's number, N/A when it has none (VU)"
    send: "VU"
    expect: { matches: "^(.*)$" }
    returns: value
  get_program_duration:
    summary: "Read the Program clip's duration, 00:00:00:00 (GD)"
    send: "GD"
    expect: { matches: "^(.*)$" }
    returns: value
  get_program_name:
    summary: "Read the Program clip's name (GN)"
    send: "GN"
    expect: { matches: "^(.*)$" }
    returns: value
  get_program_number:
    summary: "Read the Program clip's number, N/A when it has none (GU)"
    send: "GU"
    expect: { matches: "^(.*)$" }
    returns: value
  get_time_elapsed:
    summary: "Read the Program time elapsed from the In Point, 00:00:00:00 (TE)"
    send: "TE"
    expect: { matches: "^(.*)$" }
    returns: value
  get_time_remaining:
    summary: "Read the Program time remaining, 00:00:00:00 (TR)"
    send: "TR"
    expect: { matches: "^(.*)$" }
    returns: value
  get_show_file:
    summary: "Read the show file's name, nothing when unnamed (SF)"
    send: "SF"
    expect: { matches: "^(.*)$" }
    returns: value
  send_command:
    summary: Send a command as the guide writes it, such as GO12 or LT
    params:
      command: { type: string, required: true, max_length: 16, pattern: "^[A-Z0-9+-]+$", label: Command, description: "The command's characters as the guide's tables give them, with a clip number or ID after GO, GT, SI or TI." }
    send: "{command}"
    returns: none

state:
  program.status: { type: string, description: "Program playback as PS answers it: playing, paused, or none when no clip is in Program" }
  program.playing: { type: bool, description: "Whether the Program clip plays (PS 1) rather than being paused (PS 0)" }
  program.loop: { type: bool, description: "Whether the Program clip loops (LS Yes or No)" }
  program.name: { type: string, description: "Name of the clip in Program (GN)" }
  program.number: { type: string, description: "Number in the Program clip's # field, N/A when it has none (GU)" }
  program.duration: { type: string, description: "Program clip duration, 00:00:00:00 (GD)" }
  program.elapsed: { type: string, description: "Program time elapsed from the In Point, 00:00:00:00 (TE)" }
  program.remaining: { type: string, description: "Program time remaining, 00:00:00:00 (TR)" }
  preview.name: { type: string, description: "Name of the clip in Preview (VN)" }
  preview.number: { type: string, description: "Number in the Preview clip's # field, N/A when it has none (VU)" }
  preview.duration: { type: string, description: "Preview clip duration, 00:00:00:00 (VD)" }
  show_file: { type: string, description: "Name of the show file, empty when it has none (SF)" }
  clips.names.*: { type: string, description: "Each clip's name in playlist order from 1, commas in it shown as periods (AN)" }
  clips.durations.*: { type: string, description: "Each clip's duration in playlist order from 1 (AD)" }
  clips.numbers.*: { type: string, description: "Each clip's # field in playlist order from 1 (AU)" }
  clips.ids.*: { type: string, description: "Each clip's ID and file name as ID lists them, in playlist order from 1" }

telemetry:
  # Nothing is pushed: the inquiries are asked, the clock and status every
  # second, the clip lists and names every five.
  poll:
    - every_ms: 1000
      send: ["PS", "TE", "TR"]
    - every_ms: 5000
      send: ["LS", "GN", "GU", "GD", "VN", "VU", "VD", "SF", "AN", "AD", "AU", "ID"]
  updates:
    - { match: "^\\s*1\\s*$", request_match: "^PS$", state: { program.status: "playing", program.playing: "true" } }
    - { match: "^\\s*0\\s*$", request_match: "^PS$", state: { program.status: "paused", program.playing: "false" } }
    - { match: "^\\s*N/A\\s*$", request_match: "^PS$", state: { program.status: "none", program.playing: "false" } }
    - { match: "^\\s*(Yes|No)\\s*$", request_match: "^LS$", state: { program.loop: { value: "{1}", map: { "Yes": true, "No": false } } } }
    - { match: "^(.*)$", request_match: "^GN$", state: { program.name: "{1}" } }
    - { match: "^(.*)$", request_match: "^GU$", state: { program.number: "{1}" } }
    - { match: "^(.*)$", request_match: "^GD$", state: { program.duration: "{1}" } }
    - { match: "^(.*)$", request_match: "^TE$", state: { program.elapsed: "{1}" } }
    - { match: "^(.*)$", request_match: "^TR$", state: { program.remaining: "{1}" } }
    - { match: "^(.*)$", request_match: "^VN$", state: { preview.name: "{1}" } }
    - { match: "^(.*)$", request_match: "^VU$", state: { preview.number: "{1}" } }
    - { match: "^(.*)$", request_match: "^VD$", state: { preview.duration: "{1}" } }
    - { match: "^(.*)$", request_match: "^SF$", state: { show_file: "{1}" } }
    - { match: "^(.*)$", request_match: "^AN$", match_each: "([^,]+)", match_each_in: 1, replace: clips.names, state: { "clips.names.{index:+1}": "{2}" } }
    - { match: "^(.*)$", request_match: "^AD$", match_each: "([^,]+)", match_each_in: 1, replace: clips.durations, state: { "clips.durations.{index:+1}": "{2}" } }
    - { match: "^(.*)$", request_match: "^AU$", match_each: "([^,]+)", match_each_in: 1, replace: clips.numbers, state: { "clips.numbers.{index:+1}": "{2}" } }
    - { match: "^(.*)$", request_match: "^ID$", match_each: "([^,]+)", match_each_in: 1, replace: clips.ids, state: { "clips.ids.{index:+1}": "{2}" } }

quirks:
  - models: [all]
    severity: warning
    text: >
      PlaybackPro Plus takes remote commands only while Network Setup is set
      to TCP/IP Listen (this transport) or UDP Listen (port 7000, the same
      commands, not offered here: one transport per spec); No Control, DT18
      and SimpleSync turn it off. The Plus X guide gives TCP port 4647, the
      3.8 guide port 7000 for TCP too; give the port the computer shows if
      4647 does not answer.
  - models: [all]
    severity: warning
    text: >
      The guide gives no line ending for commands and none for the
      inquiries' answers. Commands are sent as their characters alone, as
      the Bitfocus Companion module sends them; the commands that change
      something are not answered (the guide lists answers only for the
      inquiries) and report unverified; an inquiry's answer is read as a
      line, which assumes PlaybackPro Plus ends it with CR or LF. Were it to
      send none, every inquiry, and the polls, would time out. An empty
      answer (SF for an unnamed show) is no line, so that inquiry times out
      and the connection is opened again.
  - models: [all]
    severity: info
    text: >
      The guide writes the clip number and ID after GO, GT, SI and TI as xxx;
      they are sent without padding (GO7), as the Companion module does, and
      limited to three digits.
  - models: [all]
    severity: info
    text: >
      Commands step and nudge rather than set: the fade, take, link and loop
      durations go up or down by a step the guide does not give, and the
      speeds by the guide's "Set Fast Forward/Reverse Speed". None of these
      can be read back; only what the Show Inquiries table lists is kept in
      state, polled (every second for the playback status and times, every
      five for the rest), as nothing is pushed.
  - models: [all]
    severity: info
    text: >
      The clip lists (AN, AD, AU, ID) are comma-delimited, a comma in a
      clip's name arriving as a period. ID lists clip numbers and file
      names; how a number and its file name are joined is not given, so each
      item is kept as it arrives.
  - models: [all]
    severity: critical
    text: >
      end_all ends Program playback, and take, load_and_take and take_by_id
      replace what is on Program at once.
