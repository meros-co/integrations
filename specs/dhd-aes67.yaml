state:
  audio.routing.inputs.*._channels: { type: int, description: "Number of channels the input contains." }
  audio.routing.inputs.*._device: { type: string, description: "The device/module where the input is located." }
  audio.routing.inputs.*._hasagain: { type: bool, description: "If the input has an analog gain / preamp." }
  audio.routing.inputs.*._hasp48: { type: bool, description: "If the input has P48V phantom power." }
  audio.routing.inputs.*._inputerror: { type: bool, description: "If the input channel has an error." }
  audio.routing.inputs.*._name: { type: string, description: "Input label." }
  audio.routing.outputs.*._channels: { type: int, description: "Number of channels the output contains." }
  audio.routing.outputs.*._device: { type: string, description: "The device/module where the output is located." }
  audio.routing.outputs.*._name: { type: string, description: "Output label." }
  audio.routing.routes.*: { type: string, description: "A defined route. The ID of the route is the ID of the output. Use \"off\" to disable a route." }
  general.capabilities._extendedfeature: { type: bool, description: "Extended feature license available." }
  general.capabilities._limited16x16: { type: bool, description: "Limited 16x16 channel mode (on XC3 core 52-7010 modules)." }
  general.capabilities._maxrxstreams: { type: int, description: "Maximum number of receive streams." }
  general.capabilities._maxtxstreams: { type: int, description: "Maximum number of transmit streams." }
  general.capabilities._rxload: { type: int, description: "Current RX load." }
  general.capabilities._txload: { type: int, description: "Current TX load." }
  general.ptp.announce: { type: int, description: "Current PTP announce interval." }
  general.ptp.delaymechanism: { type: string, description: "Current delay mechanism (E2E or P2P)." }
  general.ptp.domain: { type: int, description: "Current PTP domain." }
  general.ptp.fs: { type: int, description: "Current sample rate (Hz)." }
  general.ptp.ip_dscp: { type: int, description: "Current IP DSCP value." }
  general.ptp.prio1: { type: int, description: "Current PTP priority 1 value." }
  general.ptp.prio2: { type: int, description: "Current PTP priority 2 value." }
  general.ptp.slaveonly: { type: bool, description: "Forces the module to be only PTP slave / follower." }
  general.ptp.state._clockoffset: { type: string, description: "PTP clock offset / jitter (40 data points at 1/sec).; kept as JSON text" }
  general.ptp.state._clockstate: { type: string, description: "PTP clock state (FREERUN / LOCKED)." }
  general.ptp.state._clockstateid: { type: int, description: "PTP clock state ID." }
  general.ptp.state._grandmasterid: { type: string, description: "PTP grandmaster ID." }
  general.ptp.state._state: { type: string, description: "PTP state (Leader/Follower)." }
  general.ptp.state._state1: { type: int, description: "PTP state1." }
  general.ptp.state._state2: { type: int, description: "PTP state2." }
  general.ptp.state._syncmaster: { type: string, description: "Current PTP clock leader." }
  general.ptp.syncinterval: { type: int, description: "Current PTP sync interval." }
  general._activewebsockets: { type: int, description: "Number of active WebSocket connections." }
  general._api_version: { type: string, description: "API version." }
  general._firmware_version: { type: string, description: "Firmware version." }
  general._hardwareserial: { type: string, description: "Hardware serial." }
  general._hourmeter: { type: int, description: "Device hour meter." }
  general._maxwebsockets: { type: int, description: "Maximum number of active WebSocket connections." }
  general._systemtime: { type: int, description: "Current system time." }
  general._uptime: { type: int, description: "System uptime." }
  general._temperature: { type: int, description: "Current module temperature." }
  streams._available: { type: string, description: "A list of discovered streams. Contains JSON objects with address information, channels, codec, name, samples-per-packet and info.; kept as JSON text" }
  streams._rx-errors: { type: int, description: "RX packet error counter over all RX streams." }
  streams.rx-streams.*._id: { type: string, description: "UUID of the stream as used in NMOS." }
  streams.rx-streams.*._running: { type: bool, description: "Information if the stream is running." }
  streams.rx-streams.*._rxerrors: { type: int, description: "Information if the stream has rx errors." }
  streams.rx-streams.*._status: { type: int, description: "Stream status information. 1=ok (green), 2=warning (yellow), 3=error (red)." }
  streams.rx-streams.*._statustext: { type: string, description: "Stream status description." }
  streams.rx-streams.*.channels: { type: int, description: "Number of channels contained within the stream." }
  streams.rx-streams.*.codec: { type: string, description: "Codec used for the stream (L16/L24/AM824)." }
  streams.rx-streams.*.delay: { type: int, description: "Stream delay in milliseconds." }
  streams.rx-streams.*.enabled: { type: bool, description: "Enable the stream to actually receive data." }
  streams.rx-streams.*.name: { type: string, description: "Name of the stream." }
  streams.rx-streams.*.sdp: { type: string, description: "Session Description Protocol (SDP) for the stream, can be placed here. Will be cleared after application." }
  streams.rx-streams.*.source: { type: string, description: "Source of the stream (name)." }
  streams.rx-streams.*.source2: { type: string, description: "Source2 of the stream (name) for redundancy." }
  streams.rx-streams.*.syntonized: { type: bool, description: "Run stream in syntonized mode." }
  streams.rx-streams.*.usesecondary: { type: bool, description: "Use secondary source of the stream." }
  streams.tx-streams.*._id: { type: string, description: "UUID of the stream as used in NMOS." }
  streams.tx-streams.*._rtsp-uri: { type: string, description: "RTSP URI of the stream." }
  streams.tx-streams.*._running: { type: bool, description: "Information if the stream is running." }
  streams.tx-streams.*._sdp: { type: string, description: "Session Description Protocol (SDP) of the stream, based on configured parameters." }
  streams.tx-streams.*._status: { type: int, description: "Stream status information. 1=ok (green), 2=warning (yellow), 3=error (red)." }
  streams.tx-streams.*._statustext: { type: string, description: "Stream status description." }
  streams.tx-streams.*.address: { type: string, description: "Primary stream address." }
  streams.tx-streams.*.address2: { type: string, description: "Secondary stream address for redundancy." }
  streams.tx-streams.*.address2enable: { type: bool, description: "Enable or disable the secondary stream address." }
  streams.tx-streams.*.addressenable: { type: bool, description: "Enable or disable the primary stream address." }
  streams.tx-streams.*.channels: { type: int, description: "Number of channels contained within the stream." }
  streams.tx-streams.*.codec: { type: string, description: "Codec used for the stream (L16/L24)." }
  streams.tx-streams.*.dscp: { type: int, description: "Differentiated Services Code Point (DSCP) for the stream." }
  streams.tx-streams.*.enabled: { type: bool, description: "Enable the stream to actually receive data." }
  streams.tx-streams.*.info: { type: string, description: "Optional information about the stream, will be announced as well." }
  streams.tx-streams.*.name: { type: string, description: "Name of the stream." }
  streams.tx-streams.*.payload: { type: int, description: "Payload of the stream." }
  streams.tx-streams.*.port: { type: int, description: "Outbound port of the stream." }
  streams.tx-streams.*.samples-per-packet: { type: int, description: "Samples per packet of the stream." }
  streams.tx-streams.*.sap: { type: bool, description: "Enable / disable SAP announcement of the stream." }
  streams.tx-streams.*.ttl: { type: int, description: "Time to live (TTL) for the stream." }

telemetry:
  # The whole tree but /range: the module sends each node's current value at
  # once, then every change.
  subscribe:
    send:
      - '{"msgID":"subscribe /audio","method":"subscribe","path":"/audio"}'
      - '{"msgID":"subscribe /general","method":"subscribe","path":"/general"}'
      - '{"msgID":"subscribe /streams","method":"subscribe","path":"/streams"}'
  updates:
    - json_match: { "$.method": "^update$" }
      json_each: "$.payload.audio.routing.inputs.*"
      json:
        "_channels": "$._channels"
        "_device": "$._device"
        "_hasagain": "$._hasagain"
        "_hasp48": "$._hasp48"
        "_inputerror": "$._inputerror"
        "_name": "$._name"
      state:
        "audio.routing.inputs.{key}._channels": "{_channels}"
        "audio.routing.inputs.{key}._device": "{_device}"
        "audio.routing.inputs.{key}._hasagain": "{_hasagain}"
        "audio.routing.inputs.{key}._hasp48": "{_hasp48}"
        "audio.routing.inputs.{key}._inputerror": "{_inputerror}"
        "audio.routing.inputs.{key}._name": "{_name}"
    - json_match: { "$.method": "^update$" }
      json_each: "$.payload.audio.routing.outputs.*"
      json:
        "_channels": "$._channels"
        "_device": "$._device"
        "_name": "$._name"
      state:
        "audio.routing.outputs.{key}._channels": "{_channels}"
        "audio.routing.outputs.{key}._device": "{_device}"
        "audio.routing.outputs.{key}._name": "{_name}"
    - json_match: { "$.method": "^update$" }
      json_each: "$.payload.audio.routing.routes.*"
      json:
        "value": "$"
      state:
        "audio.routing.routes.{key}": "{value}"
    - json_match: { "$.method": "^update$" }
      json:
        "general_capabilities__extendedfeature": "$.payload.general.capabilities._extendedfeature"
