  set_rx_stream_channels:
    summary: "Set /streams/rx-streams/{stream}/channels (integer): Number of channels contained within the stream. Returns the value the device reports, which it moves to its nearest allowed value"
    params:
      stream: { type: int, min: 0, required: true, label: "Stream", description: "Stream ID as the device lists it under /streams." }
      value: { type: int, required: true, label: Value, description: "Whole number in the parameter's own unit; the device's /range node gives its range." }
    send: "{\"msgID\":\"set /streams/rx-streams/{stream}/channels\",\"method\":\"set\",\"path\":\"/streams/rx-streams/{stream}/channels\",\"payload\":{value}}"
    expect:
      reply_json: { "$.msgID": "set /streams/rx-streams/{stream}/channels" }
