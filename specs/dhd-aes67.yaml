spec: 1
id: dhd-aes67
name: DHD audio AES67 / RAVENNA interfaces (Control API)
vendor: DHD audio
category: other

source:
  - title: "DHD Developer Documentation, version 10.4: Control API (overview, AES67 Ravenna Interfaces)"
    author: DHD audio
    url: "https://developer.dhd.audio/docs/API/control-api/"
    note: >
      Read 2026-10-21. From DeviceOS 10.4 the AES67 RAVENNA interfaces support Control API as an alternative to
      NMOS and Ember+: RX and TX streams (passing and reading SDP), multicast GPIOs, PTP, and routing between
      streams and the mixer's TDM bus. RPCs are for core devices only.
  - title: "DHD Developer Documentation, version 10.4: Control API WebSocket Usage and REST API Usage"
    author: DHD audio
    url: "https://developer.dhd.audio/docs/API/control-api/socket-usage"
    note: >
      The endpoint ws://[device]/modules/[ID]/api/ws (and wss://), the module ID (1 for in-band control on the
      AES67 device itself; assigned by Toolbox for out-of-band control and on XC3 52-7010 controllers with the
      16x16 AES67 licence, usually 2), the auth, get, set, subscribe and unsubscribe messages, msgID, the
      error codes (rest-usage page), nearest-value clamping and the 60 s inactivity timeout.
  - title: "DHD control api - AES67 Modules, OpenAPI 3.0.3 document, version 0.9.1 (firmware 10.4)"
    author: DHD audio
    url: "https://developer.dhd.audio/redocusaurus/controlapi-aes67.yaml"
    note: >
      Fetched 2026-10-21; the "OpenAPI documentation (AES67)" page links it
      (https://developer.dhd.audio/docs/API/control-api/oapi-aes67). Every path of the module's tree, its type
      and description: the set commands below are one per writable leaf (a name not beginning with _), and the
      state one key per leaf, both generated from this document.
  - title: "DHD Developer Documentation, version 10.4: Ember+ (connection limits)"
    author: DHD audio
    url: "https://developer.dhd.audio/docs/API/Ember/"
    note: >
      Names the AES67 interfaces 52-7067A and 52-7567A.

transport:
  type: ws
  port: 80
  path: /modules/{settings.module}/api/ws
  scheme: { setting: scheme }
  timeout_ms: 3000
  reply: expected
  # Answered by the module; keeps the socket inside its 60 s inactivity timeout.
  probe: '{"msgID":"probe","method":"get","path":"/general/_uptime"}'

settings:
  token: { type: string, secret: true, required: true, label: API token, description: "A DHD token created in the device's WebApps user management, sent with the auth message on every connection." }
  scheme: { type: enum, values: [ws, wss], default: ws, label: Scheme, description: "ws for an unencrypted connection, wss for TLS, which needs a certificate on the device that this computer trusts; give port 443 with wss." }
  module: { type: int, min: 1, max: 255, default: 1, label: Module ID, description: "The AES67 module's ID in the path /modules/<ID>/api/ws: 1 for in-band control of the AES67 device itself, otherwise the ID Toolbox assigned (shown in the System App; usually 2 on an XC3 52-7010 controller)." }

on_connect:
  - send: '{"msgID":"auth","method":"auth","token":{settings.token:json}}'
    await_reply: true
    refused: '"code":\s*128[01]\b'
    accepted: '"success":\s*"?true'

ports:
  - { port: 80, protocol: ws, role: control, when: "scheme ws" }
  - { port: 443, protocol: wss, role: control, when: "scheme wss", note: "give the port when opening the device" }

models:
  - id: aes67
    name: "DHD AES67 RAVENNA interface (52-7067A, 52-7567A) or AES67 module of an XC3 controller, firmware 10.4 and later"
    supports:
      [get, subscribe, unsubscribe, set_route, set_ptp_announce, set_ptp_delaymechanism, set_ptp_domain,
      set_ptp_fs, set_ptp_ip_dscp, set_ptp_prio1, set_ptp_prio2, set_ptp_slaveonly, set_ptp_syncinterval,
      set_rx_stream_channels, set_rx_stream_codec, set_rx_stream_delay, set_rx_stream_enabled, set_rx_stream_name,
      set_rx_stream_sdp, set_rx_stream_source, set_rx_stream_source2, set_rx_stream_syntonized,
      set_rx_stream_usesecondary, set_tx_stream_address, set_tx_stream_address2, set_tx_stream_address2enable,
      set_tx_stream_addressenable, set_tx_stream_channels, set_tx_stream_codec, set_tx_stream_dscp,
      set_tx_stream_enabled, set_tx_stream_info, set_tx_stream_name, set_tx_stream_payload, set_tx_stream_port,
      set_tx_stream_samples_per_packet, set_tx_stream_sap, set_tx_stream_ttl]
    verification: none
    notes: >
      One model for every AES67 module with Control API; the module ID setting chooses which module of a device is addressed.

commands:
  get:
    summary: "Read any node or value of the tree once (method get); returns its payload: an object for a node, a value for a leaf. State is kept by subscription, not by this"
    params:
      path: { type: string, pattern: "^/[A-Za-z0-9_./-]*$", max_length: 512, required: true, label: Path, description: "Path in the Control API tree, such as /streams/rx-streams/0/name or /general/ptp." }
    send: '{"msgID":"get {path}","method":"get","path":"{path}"}'
    expect:
      reply_json: { "$.msgID": "get {path}" }
      json_equals: { "$.success": true }
      json_path: "$.payload"
    returns: value
  subscribe:
    summary: "Subscribe to a node or value (method subscribe); the device sends its current value, then every change, into state. The whole tree except /range is subscribed when monitoring"
    params:
      path: { type: string, pattern: "^/[A-Za-z0-9_./-]*$", max_length: 512, required: true, label: Path, description: "Path in the Control API tree, such as /general/ptp/state." }
    send: '{"msgID":"subscribe {path}","method":"subscribe","path":"{path}"}'
    expect:
      reply_json: { "$.msgID": "subscribe {path}" }
      json_equals: { "$.success": true }
    returns: ack
  unsubscribe:
    summary: "Stop the updates of a node or value on this connection (method unsubscribe), for example /general/ptp/state, until it reconnects"
    params:
      path: { type: string, pattern: "^/[A-Za-z0-9_./-]*$", max_length: 512, required: true, label: Path, description: "Path that was subscribed, such as /general/ptp/state." }
    send: '{"msgID":"unsubscribe {path}","method":"unsubscribe","path":"{path}"}'
    expect:
      reply_json: { "$.msgID": "unsubscribe {path}" }
      json_equals: { "$.success": true }
    returns: ack
  set_route:
    summary: "Set /audio/routing/routes/{output} (string): A defined route. The ID of the route is the ID of the output. Use \"off\" to disable a route. Returns the value the device reports, which it moves to its nearest allowed value"
    params:
      output: { type: int, min: 0, required: true, label: "Output", description: "Output ID the route goes to, as /audio/routing/outputs lists it." }
      value: { type: string, max_length: 1024, required: true, label: Value, description: "Input (source) ID as /audio/routing/inputs lists it, or off to remove the route." }
    send: "{\"msgID\":\"set /audio/routing/routes/{output}\",\"method\":\"set\",\"path\":\"/audio/routing/routes/{output}\",\"payload\":{value:json}}"
    expect:
      reply_json: { "$.msgID": "set /audio/routing/routes/{output}" }
      json_equals: { "$.success": true }
      json_path: "$.payload"
    returns: value
  set_ptp_announce:
    summary: "Set /general/ptp/announce (integer): Current PTP announce interval. Returns the value the device reports, which it moves to its nearest allowed value"
    params:
      value: { type: int, required: true, label: Value, description: "Whole number in the parameter's own unit; the device's /range node gives its range." }
    send: "{\"msgID\":\"set /general/ptp/announce\",\"method\":\"set\",\"path\":\"/general/ptp/announce\",\"payload\":{value}}"
    expect:
      reply_json: { "$.msgID": "set /general/ptp/announce" }
      json_equals: { "$.success": true }
      json_path: "$.payload"
    returns: value
  set_ptp_delaymechanism:
    summary: "Set /general/ptp/delaymechanism (string): Current delay mechanism (E2E or P2P). Returns the value the device reports, which it moves to its nearest allowed value"
    params:
      value: { type: string, max_length: 1024, required: true, label: Value, description: "Text value." }
    send: "{\"msgID\":\"set /general/ptp/delaymechanism\",\"method\":\"set\",\"path\":\"/general/ptp/delaymechanism\",\"payload\":{value:json}}"
    expect:
      reply_json: { "$.msgID": "set /general/ptp/delaymechanism" }
      json_equals: { "$.success": true }
      json_path: "$.payload"
    returns: value
  set_ptp_domain:
    summary: "Set /general/ptp/domain (integer): Current PTP domain. Returns the value the device reports, which it moves to its nearest allowed value"
    params:
      value: { type: int, required: true, label: Value, description: "Whole number in the parameter's own unit; the device's /range node gives its range." }
    send: "{\"msgID\":\"set /general/ptp/domain\",\"method\":\"set\",\"path\":\"/general/ptp/domain\",\"payload\":{value}}"
    expect:
