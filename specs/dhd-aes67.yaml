    returns: value
  set_ptp_fs:
    summary: "Set /general/ptp/fs (integer): Current sample rate (Hz). Returns the value the device reports, which it moves to its nearest allowed value"
    params:
      value: { type: int, required: true, label: Value, description: "Whole number in the parameter's own unit; the device's /range node gives its range." }
    send: "{\"msgID\":\"set /general/ptp/fs\",\"method\":\"set\",\"path\":\"/general/ptp/fs\",\"payload\":{value}}"
