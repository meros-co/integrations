quirks:
  - models: [all]
    severity: info
    text: >
      The module's API is at /modules/<module>/api/ws on the device's address: module 1 for in-band control of
      an AES67 interface, or the ID Toolbox assigned. After opening, the core sends the auth message with the
      token before anything else; error code 1280 or 1281 is a terminal refusal until the settings are corrected.
      The REST API is limited to one request a second, so the websocket is used.
  - models: [all]
    severity: info
    text: >
      When monitoring, the core subscribes to /audio, /general and /streams; the module sends each node's current
      value at once and then every change as an update rooted at the tree's root. Opened for commands only,
      nothing is subscribed; the liveness probe (a get of /general/_uptime after 10 s of quiet) keeps the socket
      inside the 60 s inactivity timeout. /range is read with get.
  - models: [all]
    severity: warning
    text: >
      A value outside its range is not refused: the module sets the nearest value it allows and answers with
      it, which each set command returns. Ranges are not in DHD's documents; the module's /range node gives them.
      Changing PTP settings, a stream's addresses or its enabled state interrupts the audio it carries.
  - models: [all]
    severity: info
    text: >
      An RX stream's sdp takes a session description to apply and is cleared once applied; a TX stream's _sdp is
      the description the module builds. Arrays (_available, _clockoffset) are kept in state as JSON text. RPCs
      (snapshots and the rest) exist only on core devices.
