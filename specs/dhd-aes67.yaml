  set_rx_stream_codec:
    summary: "Set /streams/rx-streams/{stream}/codec (string): Codec used for the stream (L16/L24/AM824). Returns the value the device reports, which it moves to its nearest allowed value"
    params:
      stream: { type: int, min: 0, required: true, label: "Stream", description: "Stream ID as the device lists it under /streams." }
      value: { type: string, max_length: 1024, required: true, label: Value, description: "Text value." }
    send: "{\"msgID\":\"set /streams/rx-streams/{stream}/codec\",\"method\":\"set\",\"path\":\"/streams/rx-streams/{stream}/codec\",\"payload\":{value:json}}"
