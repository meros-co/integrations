spec: 1
id: stagetimer
name: Stagetimer (API v1)
vendor: Stagetimer
category: other

# Stagetimer is a remote-controlled show timer: rooms of timers and messages
# shown on browser outputs. Its API v1 is RPC-style over HTTPS on
# api.stagetimer.io (every endpoint a GET with query parameters), with a
# Socket.IO endpoint pushing every change in the room. The desktop app
# serves the same API on the local network. One device is one room.

source:
  - title: Stagetimer API Documentation, API Version 1
    author: Stagetimer (Lukas Hermann)
    url: https://stagetimer.io/docs/api-v1/
    note: >
      Vendor document, retrieved 2026-10-23 (site version 3.6.3). RPC-style
      API over HTTP, every endpoint a GET, available with a paid licence and
      in the desktop app. Room API keys and team API keys, sent as api_key
      or as a bearer token; 100 requests a minute per room key (a team key
      shares one budget), reported in RateLimit-* headers. Every endpoint
      with its query parameters and example response: test_auth,
      get_status, get_room, get_logs (limit 1-200, offset 0-200), start,
      stop, start_or_stop, reset (autostart), start_fresh, next and previous
      (autostart, from_memory), add_time and subtract_time (amount or
      milliseconds), jump (milliseconds), start_flashing (count 1-999,
      default 3), stop_flashing, enable/disable/toggle blackout, focus
      (deprecated) and on-air, start_timer, stop_timer,
      start_or_stop_timer, select_timer, reset_timer, get_all_timers,
      get_timer, create_timer, update_timer (partial), delete_timer (each
      by timer_id or 1-based index), show_message (focus),
      hide_message, show_or_hide_message, get_all_messages, get_message,
      create_message, update_message, delete_message, get_output_links.
      The timer fields (appearance COUNTDOWN, COUNTUP, TOD, COUNTDOWN_TOD,
      COUNTUP_TOD, HIDDEN; type DURATION, FINISH_TIME; trigger MANUAL,
      LINKED, SCHEDULED; hours, minutes, seconds; wrap_up_yellow and
      wrap_up_red in seconds; start_time, start_time_uses_date,
      finish_time; labels in indexed query notation) and message fields
      (text, color white|green|red, bold, uppercase). The Socket.IO
      endpoint at /v1/socket.io with auth {room_id, api_key}, receive-only,
      sending room, playback_status, current_timer, next_timer and the
      active message on connecting, then playback_status, room, message,
      current_timer, next_timer, flash, timers_changed and messages_changed.
      Error responses {ok: false, message} with 400, 401, 404 and 429.
  - title: Stagetimer docs, Desktop App; Controlling Stagetimer via Companion for Stream Deck
    author: Stagetimer
    url: https://stagetimer.io/docs/desktop-app/
    note: >
      Vendor documents. The desktop app runs on the local network, shows its
      IP address and port, and gives the room ID, API key and API URL under
      Menu > API; its key works for every room in the app.
  - title: companion-module-stagetimerio-api (MIT licence)
    author: Stagetimer / Bitfocus contributors
    url: https://github.com/bitfocus/companion-module-stagetimerio-api
    note: >
      Read for corroboration only (src/config.js, src/api.js, src/socket.js),
      retrieved 2026-10-23: the API URL ends in /v1/ (default
      https://api.stagetimer.io/v1/) and the Socket.IO path is that URL's
      path plus socket.io, with auth {room_id, api_key}. No code taken.

transport:
  type: http
  port: 443
  scheme: { setting: scheme }
  auth: bearer
  refusal_status: [401]
  timeout_ms: 8000
  # 100 requests a minute per room key: one request every 600 ms keeps
  # the core inside it.
  pacing:
    min_interval_ms: 600
  probe: { method: GET, path: /v1/test_auth, query: { room_id: "{settings.room_id}" } }

settings:
  room_id: { type: string, required: true, max_length: 64,
    label: Room ID,
    description: "ID of the Stagetimer room to control, as the controller page or the desktop app's Menu > API shows it." }
  token: { type: string, secret: true, required: true, max_length: 256,
    label: API key,
    description: "The room's API key, or a team API key; sent as a bearer token." }
  scheme: { type: enum, values: [http, https], default: https,
    label: Connection,
    description: "https for the cloud service at api.stagetimer.io; http for the desktop app on the local network, opened at its address and port." }

ports:
  - { port: 443, protocol: https, role: control, when: "scheme https" }
  - { port: 443, protocol: wss, role: push, when: "scheme https", note: "Socket.IO at /v1/socket.io on the same host" }
  - { port: null, protocol: http, role: control, when: "scheme http", note: "the desktop app's port, shown in its sidebar: given when the device is opened" }
  - { port: null, protocol: ws, role: push, when: "scheme http", note: "Socket.IO at /v1/socket.io on the desktop app's port" }

models:
  - id: stagetimer
    name: Stagetimer room (cloud or desktop app, paid licence)
    supports: [test_auth, get_status, get_room, get_logs,
               start, stop, start_or_stop, reset, start_fresh, next, previous,
               add_time, add_time_amount, subtract_time, subtract_time_amount, jump,
               start_flashing, stop_flashing, enable_blackout, disable_blackout, toggle_blackout,
               enable_focus, disable_focus, toggle_focus, enable_on_air, disable_on_air, toggle_on_air,
               start_timer, start_timer_index, stop_timer, stop_timer_index,
               start_or_stop_timer, start_or_stop_timer_index, select_timer, select_timer_index,
               reset_timer, reset_timer_index, get_all_timers, get_timer, get_timer_index,
               create_timer, set_timer_name, set_timer_speaker, set_timer_notes, set_timer_appearance,
               set_timer_type, set_timer_duration, set_timer_wrap_up, set_timer_trigger,
               set_timer_start_time, set_timer_finish_time, set_timer_label, delete_timer, delete_timer_index,
               show_message, show_message_index, hide_message, hide_message_index,
               show_or_hide_message, show_or_hide_message_index, get_all_messages, get_message,
               get_message_index, create_message, set_message_text, set_message_color, set_message_bold,
               set_message_uppercase, delete_message, delete_message_index, get_output_links]
    verification: none

commands:
  # ── General and room ─────────────────────────────────────────────────────
  test_auth:
    summary: Check that the API key is authorized for the room (GET /v1/test_auth)
    send: { method: GET, path: /v1/test_auth, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200, json_path: "$.message" }
    returns: value
  get_status:
    summary: Read the playback status of the selected timer (GET /v1/get_status); kept in state
    send: { method: GET, path: /v1/get_status, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value
  get_room:
    summary: Read the room (GET /v1/get_room); kept in state
    send: { method: GET, path: /v1/get_room, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value
  get_logs:
    summary: Read the room's log of past events (GET /v1/get_logs); the page read is kept in state
    params:
      limit: { type: int, min: 1, max: 200, default: 20,
               label: Limit, description: "Number of log lines to read." }
      offset: { type: int, min: 0, max: 200, default: 0,
                label: Offset, description: "Number of the most recent lines to skip, to page through the log." }
    send: { method: GET, path: /v1/get_logs,
            query: { room_id: "{settings.room_id}", limit: "{limit}", offset: "{offset}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  # ── Transport (the selected timer) ───────────────────────────────────────
  start:
    summary: Start or resume the selected timer (GET /v1/start)
    send: { method: GET, path: /v1/start, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  stop:
    summary: Stop the selected timer (GET /v1/stop)
    send: { method: GET, path: /v1/stop, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  start_or_stop:
    summary: Start the selected timer if stopped, or stop it if running (GET /v1/start_or_stop)
    send: { method: GET, path: /v1/start_or_stop, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  reset:
    summary: Move the selected timer's playhead back to its start, keeping the run's record (GET /v1/reset)
    params:
      autostart: &autostart { type: bool, default: false,
                              label: Start, description: "True starts the timer once the action is done." }
    send: { method: GET, path: /v1/reset, query: { room_id: "{settings.room_id}", autostart: "{autostart}" } }
    expect: { status: 200 }
    returns: ack
  start_fresh:
    summary: Reset every timer, select the first and clear the record of the run; the rundown stays (GET /v1/start_fresh)
    send: { method: GET, path: /v1/start_fresh, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  next:
    summary: Select the next timer; does nothing on the last (GET /v1/next)
    params:
      autostart: *autostart
      from_memory: &from_memory { type: bool, default: false,
                                  label: Resume,
                                  description: "True resumes a timer that already ran this show from where it stopped; false starts it from the beginning." }
    send: { method: GET, path: /v1/next,
            query: { room_id: "{settings.room_id}", autostart: "{autostart}", from_memory: "{from_memory}" } }
    expect: { status: 200 }
    returns: ack
  previous:
    summary: Reset the selected timer if running, or select the previous timer (GET /v1/previous)
    params: { autostart: *autostart, from_memory: *from_memory }
    send: { method: GET, path: /v1/previous,
            query: { room_id: "{settings.room_id}", autostart: "{autostart}", from_memory: "{from_memory}" } }
    expect: { status: 200 }
    returns: ack
  add_time:
    summary: Add time to the selected timer, in milliseconds (GET /v1/add_time)
    params:
      milliseconds: &pos_ms { type: int, min: 0, required: true,
                              label: Time, description: "Time in milliseconds." }
    send: { method: GET, path: /v1/add_time,
            query: { room_id: "{settings.room_id}", milliseconds: "{milliseconds}" } }
    expect: { status: 200 }
    returns: ack
  add_time_amount:
    summary: Add time to the selected timer, given in Stagetimer's shorthand such as 30s or 10m (GET /v1/add_time)
    params:
      amount: &amount { type: string, max_length: 32, required: true, pattern: "^[0-9]+(\\.[0-9]+)?[a-z]+$",
                        label: Amount,
                        description: "A number followed by a unit of time, such as 5s for 5 seconds or 10m for 10 minutes." }
    send: { method: GET, path: /v1/add_time, query: { room_id: "{settings.room_id}", amount: "{amount}" } }
    expect: { status: 200 }
    returns: ack
  subtract_time:
    summary: Subtract time from the selected timer, in milliseconds (GET /v1/subtract_time)
    params: { milliseconds: *pos_ms }
    send: { method: GET, path: /v1/subtract_time,
            query: { room_id: "{settings.room_id}", milliseconds: "{milliseconds}" } }
    expect: { status: 200 }
    returns: ack
  subtract_time_amount:
    summary: Subtract time from the selected timer, given in Stagetimer's shorthand (GET /v1/subtract_time)
    params: { amount: *amount }
    send: { method: GET, path: /v1/subtract_time, query: { room_id: "{settings.room_id}", amount: "{amount}" } }
    expect: { status: 200 }
    returns: ack
  jump:
    summary: Jump the playhead forward or back; it cannot go before the timer's start (GET /v1/jump)
    params:
      milliseconds: { type: int, required: true,
                      label: Jump, description: "Milliseconds to jump; positive goes forward, negative back." }
    send: { method: GET, path: /v1/jump, query: { room_id: "{settings.room_id}", milliseconds: "{milliseconds}" } }
    expect: { status: 200 }
    returns: ack

  # ── Viewer ───────────────────────────────────────────────────────────────
  start_flashing:
    summary: Flash the room's screens to catch the speaker's attention (GET /v1/start_flashing)
    params:
      count: { type: int, min: 1, max: 999, default: 3,
               label: Flashes, description: "Number of times to flash." }
    send: { method: GET, path: /v1/start_flashing, query: { room_id: "{settings.room_id}", count: "{count}" } }
    expect: { status: 200 }
    returns: ack
  stop_flashing:
    summary: Stop any flashing timer and message (GET /v1/stop_flashing)
    send: { method: GET, path: /v1/stop_flashing, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  enable_blackout:
    summary: Enable blackout mode (GET /v1/enable_blackout)
    send: { method: GET, path: /v1/enable_blackout, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  disable_blackout:
    summary: Disable blackout mode (GET /v1/disable_blackout)
    send: { method: GET, path: /v1/disable_blackout, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  toggle_blackout:
    summary: Toggle blackout mode (GET /v1/toggle_blackout)
    send: { method: GET, path: /v1/toggle_blackout, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  enable_focus:
    summary: Enable focus mode (GET /v1/enable_focus; deprecated, show_message with focus replaces it)
    send: { method: GET, path: /v1/enable_focus, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  disable_focus:
    summary: Disable focus mode (GET /v1/disable_focus; deprecated, hide_message replaces it)
    send: { method: GET, path: /v1/disable_focus, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  toggle_focus:
    summary: Toggle focus mode (GET /v1/toggle_focus; deprecated)
    send: { method: GET, path: /v1/toggle_focus, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  enable_on_air:
    summary: Enable on-air mode (GET /v1/enable_on_air)
    send: { method: GET, path: /v1/enable_on_air, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  disable_on_air:
    summary: Disable on-air mode (GET /v1/disable_on_air)
    send: { method: GET, path: /v1/disable_on_air, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack
  toggle_on_air:
    summary: Toggle on-air mode (GET /v1/toggle_on_air)
    send: { method: GET, path: /v1/toggle_on_air, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200 }
    returns: ack

  # ── Timers ───────────────────────────────────────────────────────────────
  start_timer:
    summary: Start a timer from its beginning, or resume it (GET /v1/start_timer by timer_id)
    params:
      timer_id: &timer_id { type: string, max_length: 64, required: true,
                            label: Timer, description: "ID of the timer, as the timers in state list it." }
      from_memory: *from_memory
    send: { method: GET, path: /v1/start_timer,
            query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", from_memory: "{from_memory}" } }
    expect: { status: 200 }
    returns: ack
  start_timer_index:
    summary: Start a timer by its place in the list (GET /v1/start_timer by index)
    params:
      index: &index { type: int, min: 1, required: true,
                      label: Position, description: "Place in the list on the controller page, from 1 at the top." }
      from_memory: *from_memory
    send: { method: GET, path: /v1/start_timer,
            query: { room_id: "{settings.room_id}", index: "{index}", from_memory: "{from_memory}" } }
    expect: { status: 200 }
    returns: ack
  stop_timer:
    summary: Stop a timer (GET /v1/stop_timer by timer_id)
    params: { timer_id: *timer_id }
    send: { method: GET, path: /v1/stop_timer, query: { room_id: "{settings.room_id}", timer_id: "{timer_id}" } }
    expect: { status: 200 }
    returns: ack
  stop_timer_index:
    summary: Stop a timer by its place in the list (GET /v1/stop_timer by index)
    params: { index: *index }
    send: { method: GET, path: /v1/stop_timer, query: { room_id: "{settings.room_id}", index: "{index}" } }
    expect: { status: 200 }
    returns: ack
  start_or_stop_timer:
    summary: Start a timer if stopped, or stop it if running (GET /v1/start_or_stop_timer by timer_id)
    params: { timer_id: *timer_id, from_memory: *from_memory }
    send: { method: GET, path: /v1/start_or_stop_timer,
            query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", from_memory: "{from_memory}" } }
    expect: { status: 200 }
    returns: ack
  start_or_stop_timer_index:
    summary: Start or stop a timer by its place in the list (GET /v1/start_or_stop_timer by index)
    params: { index: *index, from_memory: *from_memory }
    send: { method: GET, path: /v1/start_or_stop_timer,
            query: { room_id: "{settings.room_id}", index: "{index}", from_memory: "{from_memory}" } }
    expect: { status: 200 }
    returns: ack
  select_timer:
    summary: Select (cue up) a timer without starting it, its playhead at the start (GET /v1/select_timer by timer_id)
    params: { timer_id: *timer_id }
    send: { method: GET, path: /v1/select_timer, query: { room_id: "{settings.room_id}", timer_id: "{timer_id}" } }
    expect: { status: 200 }
    returns: ack
  select_timer_index:
    summary: Select a timer by its place in the list (GET /v1/select_timer by index)
    params: { index: *index }
    send: { method: GET, path: /v1/select_timer, query: { room_id: "{settings.room_id}", index: "{index}" } }
    expect: { status: 200 }
    returns: ack
  reset_timer:
    summary: Reset a timer to its duration, selecting it (GET /v1/reset_timer by timer_id)
    params: { timer_id: *timer_id }
    send: { method: GET, path: /v1/reset_timer, query: { room_id: "{settings.room_id}", timer_id: "{timer_id}" } }
    expect: { status: 200 }
    returns: ack
  reset_timer_index:
    summary: Reset a timer by its place in the list (GET /v1/reset_timer by index)
    params: { index: *index }
    send: { method: GET, path: /v1/reset_timer, query: { room_id: "{settings.room_id}", index: "{index}" } }
    expect: { status: 200 }
    returns: ack
  get_all_timers:
    summary: Read every timer of the room (GET /v1/get_all_timers); kept in state
    send: { method: GET, path: /v1/get_all_timers, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value
  get_timer:
    summary: Read one timer (GET /v1/get_timer by timer_id)
    params: { timer_id: *timer_id }
    send: { method: GET, path: /v1/get_timer, query: { room_id: "{settings.room_id}", timer_id: "{timer_id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value
  get_timer_index:
    summary: Read one timer by its place in the list (GET /v1/get_timer by index)
    params: { index: *index }
    send: { method: GET, path: /v1/get_timer, query: { room_id: "{settings.room_id}", index: "{index}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value
  create_timer:
    summary: Add a timer at the end of the list (GET /v1/create_timer); returns its ID
    params:
      name: &timer_name { type: string, max_length: 1024, required: true,
                          label: Name, description: "Name of the timer; empty clears it." }
      speaker: &speaker { type: string, max_length: 1024, default: "",
                          label: Speaker, description: "Speaker, to identify who the timer is for; empty for none." }
      notes: &notes { type: string, max_length: 4096, default: "",
                      label: Notes, description: "Notes about the timer or the speaker; empty for none." }
      appearance: &appearance { type: enum, values: [COUNTDOWN, COUNTUP, TOD, COUNTDOWN_TOD, COUNTUP_TOD, HIDDEN],
                                default: COUNTDOWN,
                                label: Appearance,
                                description: "How the timer is shown: counting down, up, the time of day, either with the time of day, or hidden." }
      type: &timer_type { type: enum, values: [DURATION, FINISH_TIME], default: DURATION,
                          label: Type,
                          description: "DURATION runs for the duration; FINISH_TIME runs until the finish time." }
      hours: &hours { type: int, min: 0, default: 0, label: Hours, description: "Hours of the duration." }
      minutes: &minutes { type: int, min: 0, default: 10, label: Minutes, description: "Minutes of the duration." }
      seconds: &seconds { type: int, min: 0, default: 0, label: Seconds, description: "Seconds of the duration." }
      wrap_up_yellow: &wrap_up_yellow { type: int, min: 0, default: 60,
                                        label: Yellow wrap-up,
                                        description: "When the timer turns yellow, in seconds before its end." }
      wrap_up_red: &wrap_up_red { type: int, min: 0, default: 15,
                                  label: Red wrap-up,
                                  description: "When the timer turns red, in seconds before its end." }
      trigger: &trigger { type: enum, values: [MANUAL, LINKED, SCHEDULED], default: MANUAL,
                          label: Trigger,
                          description: "How the timer starts: by hand, after the previous timer, or at its start time." }
    send:
      method: GET
      path: /v1/create_timer
      query: { room_id: "{settings.room_id}", name: "{name}", speaker: "{speaker}", notes: "{notes}",
               appearance: "{appearance}", type: "{type}", hours: "{hours}", minutes: "{minutes}",
               seconds: "{seconds}", wrap_up_yellow: "{wrap_up_yellow}", wrap_up_red: "{wrap_up_red}",
               trigger: "{trigger}" }
    expect: { status: 200, json_path: "$.data._id" }
    returns: value
  set_timer_name:
    summary: Rename a timer (GET /v1/update_timer?name=)
    params: { timer_id: *timer_id, name: *timer_name }
    send: { method: GET, path: /v1/update_timer, query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", name: "{name}" } }
    expect: { status: 200 }
    returns: ack
  set_timer_speaker:
    summary: Change a timer's speaker (GET /v1/update_timer?speaker=)
    params:
      timer_id: *timer_id
      speaker: { type: string, max_length: 1024, required: true,
                 label: Speaker, description: "Speaker, to identify who the timer is for; empty clears it." }
    send: { method: GET, path: /v1/update_timer, query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", speaker: "{speaker}" } }
    expect: { status: 200 }
    returns: ack
  set_timer_notes:
    summary: Change a timer's notes (GET /v1/update_timer?notes=)
    params:
      timer_id: *timer_id
      notes: { type: string, max_length: 4096, required: true,
               label: Notes, description: "Notes about the timer or the speaker; empty clears them." }
    send: { method: GET, path: /v1/update_timer, query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", notes: "{notes}" } }
    expect: { status: 200 }
    returns: ack
  set_timer_appearance:
    summary: Change how a timer is shown (GET /v1/update_timer?appearance=)
    params:
      timer_id: *timer_id
      appearance: { type: enum, values: [COUNTDOWN, COUNTUP, TOD, COUNTDOWN_TOD, COUNTUP_TOD, HIDDEN], required: true,
                    label: Appearance,
                    description: "How the timer is shown: counting down, up, the time of day, either with the time of day, or hidden." }
    send: { method: GET, path: /v1/update_timer, query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", appearance: "{appearance}" } }
    expect: { status: 200 }
    returns: ack
  set_timer_type:
    summary: Change a timer's type (GET /v1/update_timer?type=)
    params:
      timer_id: *timer_id
      type: { type: enum, values: [DURATION, FINISH_TIME], required: true,
              label: Type,
              description: "DURATION runs for the duration; FINISH_TIME runs until the finish time." }
    send: { method: GET, path: /v1/update_timer, query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", type: "{type}" } }
    expect: { status: 200 }
    returns: ack
  set_timer_duration:
    summary: Change a timer's duration (GET /v1/update_timer?hours=&minutes=&seconds=)
    params:
      timer_id: *timer_id
      hours: { type: int, min: 0, required: true, label: Hours, description: "Hours of the duration." }
      minutes: { type: int, min: 0, required: true, label: Minutes, description: "Minutes of the duration." }
      seconds: { type: int, min: 0, required: true, label: Seconds, description: "Seconds of the duration." }
    send: { method: GET, path: /v1/update_timer,
            query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", hours: "{hours}", minutes: "{minutes}", seconds: "{seconds}" } }
    expect: { status: 200 }
    returns: ack
  set_timer_wrap_up:
    summary: Change when a timer turns yellow and red (GET /v1/update_timer?wrap_up_yellow=&wrap_up_red=)
    params:
      timer_id: *timer_id
      wrap_up_yellow: { type: int, min: 0, required: true,
                        label: Yellow wrap-up, description: "When the timer turns yellow, in seconds before its end." }
      wrap_up_red: { type: int, min: 0, required: true,
                     label: Red wrap-up, description: "When the timer turns red, in seconds before its end." }
    send: { method: GET, path: /v1/update_timer,
            query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", wrap_up_yellow: "{wrap_up_yellow}", wrap_up_red: "{wrap_up_red}" } }
    expect: { status: 200 }
    returns: ack
  set_timer_trigger:
    summary: Change how a timer starts (GET /v1/update_timer?trigger=)
    params:
      timer_id: *timer_id
      trigger: { type: enum, values: [MANUAL, LINKED, SCHEDULED], required: true,
                 label: Trigger,
                 description: "How the timer starts: by hand, after the previous timer, or at its start time (which SCHEDULED needs)." }
    send: { method: GET, path: /v1/update_timer, query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", trigger: "{trigger}" } }
    expect: { status: 200 }
    returns: ack
  set_timer_start_time:
    summary: Set a timer's hard start time (GET /v1/update_timer?start_time=&start_time_uses_date=)
    params:
      timer_id: *timer_id
      start_time: { type: string, max_length: 64, required: true,
                    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\\.[0-9]+)?)?(Z|[+-][0-9]{2}:[0-9]{2})$",
                    label: Start time,
                    description: "ISO 8601 date and time, such as 2026-05-01T08:40:00.000Z; only its time of day is read unless the date is used." }
      uses_date: { type: bool, default: false,
                   label: Use the date,
                   description: "True starts a SCHEDULED timer at start_time with its date; false places it by the rundown's order and End of Day markers." }
    send: { method: GET, path: /v1/update_timer,
            query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", start_time: "{start_time}", start_time_uses_date: "{uses_date}" } }
    expect: { status: 200 }
    returns: ack
  set_timer_finish_time:
    summary: Set the finish time of a FINISH_TIME timer (GET /v1/update_timer?finish_time=)
    params:
      timer_id: *timer_id
      finish_time: { type: string, max_length: 64, required: true,
                     pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\\.[0-9]+)?)?(Z|[+-][0-9]{2}:[0-9]{2})$",
                     label: Finish time,
                     description: "ISO 8601 date and time; only its time of day is meaningful." }
    send: { method: GET, path: /v1/update_timer,
            query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", finish_time: "{finish_time}" } }
    expect: { status: 200 }
    returns: ack
  set_timer_label:
    summary: Give a timer one colored label, replacing its labels (GET /v1/update_timer?labels[0][name]=&labels[0][color]=)
    params:
      timer_id: *timer_id
      name: { type: string, max_length: 256, required: true,
              label: Label, description: "Text of the label shown on the controller page." }
      color: { type: string, required: true, pattern: "^#[0-9A-Fa-f]{6}$",
               label: Color, description: "Label color as #RRGGBB." }
    send: { method: GET, path: /v1/update_timer,
            query: { room_id: "{settings.room_id}", timer_id: "{timer_id}", "labels[0][name]": "{name}", "labels[0][color]": "{color}" } }
    expect: { status: 200 }
    returns: ack
  delete_timer:
    summary: Delete a timer (GET /v1/delete_timer by timer_id)
    params: { timer_id: *timer_id }
    send: { method: GET, path: /v1/delete_timer, query: { room_id: "{settings.room_id}", timer_id: "{timer_id}" } }
    expect: { status: 200 }
    returns: ack
  delete_timer_index:
    summary: Delete a timer by its place in the list (GET /v1/delete_timer by index)
    params: { index: *index }
    send: { method: GET, path: /v1/delete_timer, query: { room_id: "{settings.room_id}", index: "{index}" } }
    expect: { status: 200 }
    returns: ack

  # ── Messages ─────────────────────────────────────────────────────────────
  show_message:
    summary: Show a message (GET /v1/show_message by message_id)
    params:
      message_id: &message_id { type: string, max_length: 64, required: true,
                                label: Message, description: "ID of the message, as the messages in state list it." }
      focus: &focus { type: bool, default: false,
                      label: Fullscreen, description: "True shows the message fullscreen, covering every other output element." }
    send: { method: GET, path: /v1/show_message,
            query: { room_id: "{settings.room_id}", message_id: "{message_id}", focus: "{focus}" } }
    expect: { status: 200 }
    returns: ack
  show_message_index:
    summary: Show a message by its place in the list (GET /v1/show_message by index)
    params: { index: *index, focus: *focus }
    send: { method: GET, path: /v1/show_message, query: { room_id: "{settings.room_id}", index: "{index}", focus: "{focus}" } }
    expect: { status: 200 }
    returns: ack
  hide_message:
    summary: Hide a message (GET /v1/hide_message by message_id)
    params: { message_id: *message_id }
    send: { method: GET, path: /v1/hide_message, query: { room_id: "{settings.room_id}", message_id: "{message_id}" } }
    expect: { status: 200 }
    returns: ack
  hide_message_index:
    summary: Hide a message by its place in the list (GET /v1/hide_message by index)
    params: { index: *index }
    send: { method: GET, path: /v1/hide_message, query: { room_id: "{settings.room_id}", index: "{index}" } }
    expect: { status: 200 }
    returns: ack
  show_or_hide_message:
    summary: Show a message if hidden, or hide it if shown (GET /v1/show_or_hide_message by message_id)
    params: { message_id: *message_id, focus: *focus }
    send: { method: GET, path: /v1/show_or_hide_message,
            query: { room_id: "{settings.room_id}", message_id: "{message_id}", focus: "{focus}" } }
    expect: { status: 200 }
    returns: ack
  show_or_hide_message_index:
    summary: Show or hide a message by its place in the list (GET /v1/show_or_hide_message by index)
    params: { index: *index, focus: *focus }
    send: { method: GET, path: /v1/show_or_hide_message, query: { room_id: "{settings.room_id}", index: "{index}", focus: "{focus}" } }
    expect: { status: 200 }
    returns: ack
  get_all_messages:
    summary: Read every message of the room (GET /v1/get_all_messages); kept in state
    send: { method: GET, path: /v1/get_all_messages, query: { room_id: "{settings.room_id}" } }
    expect: { status: 200, json_path: "$.data.messages" }
    returns: value
  get_message:
    summary: Read one message (GET /v1/get_message by message_id)
    params: { message_id: *message_id }
    send: { method: GET, path: /v1/get_message, query: { room_id: "{settings.room_id}", message_id: "{message_id}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value
  get_message_index:
    summary: Read one message by its place in the list (GET /v1/get_message by index)
    params: { index: *index }
    send: { method: GET, path: /v1/get_message, query: { room_id: "{settings.room_id}", index: "{index}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value
  create_message:
    summary: Add a message (GET /v1/create_message); returns its ID
    params:
      text: &message_text { type: string, max_length: 4096, required: true,
                            label: Text, description: "Contents of the message; empty clears them." }
      color: &message_color { type: enum, values: [white, green, red], default: white,
                              label: Color, description: "Color of the message text." }
      bold: &bold { type: bool, default: false, label: Bold, description: "True shows the text bold." }
      uppercase: &uppercase { type: bool, default: false, label: Uppercase, description: "True shows the text in capitals." }
    send: { method: GET, path: /v1/create_message,
            query: { room_id: "{settings.room_id}", text: "{text}", color: "{color}", bold: "{bold}", uppercase: "{uppercase}" } }
    expect: { status: 200, json_path: "$.data._id" }
    returns: value
  set_message_text:
    summary: Change a message's text (GET /v1/update_message?text=)
    params: { message_id: *message_id, text: *message_text }
    send: { method: GET, path: /v1/update_message, query: { room_id: "{settings.room_id}", message_id: "{message_id}", text: "{text}" } }
    expect: { status: 200 }
    returns: ack
  set_message_color:
    summary: Change a message's color (GET /v1/update_message?color=)
    params:
      message_id: *message_id
      color: { type: enum, values: [white, green, red], required: true,
               label: Color, description: "Color of the message text." }
    send: { method: GET, path: /v1/update_message, query: { room_id: "{settings.room_id}", message_id: "{message_id}", color: "{color}" } }
    expect: { status: 200 }
    returns: ack
  set_message_bold:
    summary: Make a message bold or not (GET /v1/update_message?bold=)
    params:
      message_id: *message_id
      bold: { type: bool, required: true, label: Bold, description: "True shows the text bold." }
    send: { method: GET, path: /v1/update_message, query: { room_id: "{settings.room_id}", message_id: "{message_id}", bold: "{bold}" } }
    expect: { status: 200 }
    returns: ack
  set_message_uppercase:
    summary: Show a message in capitals or not (GET /v1/update_message?uppercase=)
    params:
      message_id: *message_id
      uppercase: { type: bool, required: true, label: Uppercase, description: "True shows the text in capitals." }
    send: { method: GET, path: /v1/update_message, query: { room_id: "{settings.room_id}", message_id: "{message_id}", uppercase: "{uppercase}" } }
    expect: { status: 200 }
    returns: ack
  delete_message:
    summary: Delete a message (GET /v1/delete_message by message_id)
    params: { message_id: *message_id }
    send: { method: GET, path: /v1/delete_message, query: { room_id: "{settings.room_id}", message_id: "{message_id}" } }
    expect: { status: 200 }
    returns: ack
  delete_message_index:
    summary: Delete a message by its place in the list (GET /v1/delete_message by index)
    params: { index: *index }
    send: { method: GET, path: /v1/delete_message, query: { room_id: "{settings.room_id}", index: "{index}" } }
    expect: { status: 200 }
    returns: ack

  # ── Outputs ──────────────────────────────────────────────────────────────
  get_output_links:
    summary: Read signed links to the room's outputs, controller and operator (GET /v1/get_output_links); kept in state
    params:
      short_url: { type: bool, default: false,
                   label: Short links, description: "True returns short links, which expire after 30 days." }
      hide_controls: { type: bool, default: false,
                       label: Hide controls, description: "True hides the outputs' overlay on mouse move." }
      delay: { type: int, min: 0, max: 3600, default: 0,
               label: Delay, description: "Broadcast delay of the outputs, in seconds." }
    send: { method: GET, path: /v1/get_output_links,
            query: { room_id: "{settings.room_id}", short_url: "{short_url}", hide_controls: "{hide_controls}", delay: "{delay}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

telemetry:
  # Socket.IO at /v1/socket.io on the API's host, the room and key in the
  # handshake's auth. Stagetimer sends the room, playback status, current
  # and next timer and the active message on connecting and on every
  # change; the timer and message lists are read once and again after each
  # change the socket reports.
  websocket:
    path: /v1/socket.io/
    scheme: { setting: scheme }
    socketio: { auth: '{"room_id":{settings.room_id:json},"api_key":{settings.token:json}}' }
  poll:
    send:
      - { method: GET, path: /v1/get_status, query: { room_id: "{settings.room_id}" } }
      - { method: GET, path: /v1/get_room, query: { room_id: "{settings.room_id}" } }
      - { method: GET, path: /v1/get_all_timers, query: { room_id: "{settings.room_id}" } }
      - { method: GET, path: /v1/get_all_messages, query: { room_id: "{settings.room_id}" } }
  updates:
    # ── Socket.IO events ───────────────────────────────────────────────────
    - json_match: { "$.event": "^playback_status$", "$.data": "^\\{" }
      json: &status_fields
        timer_id: "$.data.timer_id"
        running: "$.data.running"
        start: "$.data.start"
        finish: "$.data.finish"
        pause: "$.data.pause"
        server_time: "$.data.server_time"
        updated_at: "$.data._updated_at"
      state: &status_state
        playback.timer_id: "{timer_id}"
        playback.running: "{running}"
        playback.start: "{start}"
        playback.finish: "{finish}"
        playback.pause: "{pause}"
        playback.server_time: "{server_time}"
        playback.updated_at: "{updated_at}"
    - json_match: { "$.event": "^room$", "$.data": "^\\{" }
      json: &room_fields
        name: "$.data.name"
        date: "$.data.date"
        blackout: "$.data.blackout"
        focus_message: "$.data.focus_message"
        on_air: "$.data.on_air"
        logo: "$.data.logo"
        timezone: "$.data.timezone"
      state: &room_state
        room.name: "{name}"
        room.date: "{date}"
        room.blackout: "{blackout}"
        room.focus_message: "{focus_message}"
        room.on_air: "{on_air}"
        room.logo: "{logo}"
        room.timezone: "{timezone}"
    # The room's date is null for a room that always runs today.
    - json_match: { "$.event": "^room$", "$.data.date": "^null$" }
      json: {}
      state: { room.date: { delete: true } }
    - json_match: { "$.event": "^message$", "$.data": "^\\{" }
      json: &message_fields
        id: "$.data._id"
        showing: "$.data.showing"
        text: "$.data.text"
        color: "$.data.color"
        bold: "$.data.bold"
        uppercase: "$.data.uppercase"
      state: &message_state
        "messages.{id}.showing": "{showing}"
        "messages.{id}.text": "{text}"
        "messages.{id}.color": "{color}"
        "messages.{id}.bold": "{bold}"
        "messages.{id}.uppercase": "{uppercase}"
    - json_match: { "$.event": "^message$", "$.data": "^\\{" }
      json: { id: "$.data._id", showing: "$.data.showing" }
      state: { active_message.id: "{id}", active_message.showing: "{showing}" }
    # current_timer and next_timer: the full timer, or null for none.
    - json_match: { "$.event": "^(current|next)_timer$", "$.data": "^(null|\\{)" }
      json: { id: "$.data._id" }
      replace: "{1}_timer"
      state: { "{1}_timer.id": "{id}" }
    - json_match: { "$.event": "^(current|next)_timer$", "$.data": "^\\{" }
      json: &timer_fields
        id: "$.data._id"
        name: "$.data.name"
        speaker: "$.data.speaker"
        notes: "$.data.notes"
        appearance: "$.data.appearance"
        type: "$.data.type"
        duration: "$.data.duration"
        hours: "$.data.hours"
        minutes: "$.data.minutes"
        seconds: "$.data.seconds"
        wrap_up_yellow: "$.data.wrap_up_yellow"
        wrap_up_red: "$.data.wrap_up_red"
        trigger: "$.data.trigger"
        start_time: "$.data.start_time"
        finish_time: "$.data.finish_time"
      state: &timer_state
        "timers.{id}.name": "{name}"
        "timers.{id}.speaker": "{speaker}"
        "timers.{id}.notes": "{notes}"
        "timers.{id}.appearance": "{appearance}"
        "timers.{id}.type": "{type}"
        "timers.{id}.duration": "{duration}"
        "timers.{id}.hours": "{hours}"
        "timers.{id}.minutes": "{minutes}"
        "timers.{id}.seconds": "{seconds}"
        "timers.{id}.wrap_up_yellow": "{wrap_up_yellow}"
        "timers.{id}.wrap_up_red": "{wrap_up_red}"
        "timers.{id}.trigger": "{trigger}"
        "timers.{id}.start_time": "{start_time}"
        "timers.{id}.finish_time": "{finish_time}"
    - json_match: { "$.event": "^flash$" }
      json: { count: "$.data.count" }
      state: { flash.count: "{count}" }
    - json_match: { "$.event": "^timers_changed$" }
      json: {}
      then_send:
        - { method: GET, path: /v1/get_all_timers, query: { room_id: "{settings.room_id}" } }
    - json_match: { "$.event": "^messages_changed$" }
      json: {}
      then_send:
        - { method: GET, path: /v1/get_all_messages, query: { room_id: "{settings.room_id}" } }

    # ── HTTP replies, by the model of their data ───────────────────────────
    - path: "^/v1/"
      json_match: { "$.data._model": "^playback_status$" }
      json: *status_fields
      state: *status_state
    - path: "^/v1/"
      json_match: { "$.data._model": "^room$" }
      json: *room_fields
      state: *room_state
    - path: "^/v1/"
      json_match: { "$.data._model": "^message$" }
      json: *message_fields
      state: *message_state
    - path: "^/v1/"
      json_match: { "$.data._model": "^timer$" }
      json: *timer_fields
      state: *timer_state
    - path: "^/v1/get_all_timers\\?"
      json_each: "$.data"
      each_match: { "$._model": "^timer$" }
      json:
        id: "$._id"
        name: "$.name"
        speaker: "$.speaker"
        notes: "$.notes"
        appearance: "$.appearance"
        type: "$.type"
        duration: "$.duration"
        hours: "$.hours"
        minutes: "$.minutes"
        seconds: "$.seconds"
        wrap_up_yellow: "$.wrap_up_yellow"
        wrap_up_red: "$.wrap_up_red"
        trigger: "$.trigger"
        start_time: "$.start_time"
        finish_time: "$.finish_time"
      replace: timers
      state:
        "timers.{id}.index": "{index:+1}"
        "timers.{id}.name": "{name}"
        "timers.{id}.speaker": "{speaker}"
        "timers.{id}.notes": "{notes}"
        "timers.{id}.appearance": "{appearance}"
        "timers.{id}.type": "{type}"
        "timers.{id}.duration": "{duration}"
        "timers.{id}.hours": "{hours}"
        "timers.{id}.minutes": "{minutes}"
        "timers.{id}.seconds": "{seconds}"
        "timers.{id}.wrap_up_yellow": "{wrap_up_yellow}"
        "timers.{id}.wrap_up_red": "{wrap_up_red}"
        "timers.{id}.trigger": "{trigger}"
        "timers.{id}.start_time": "{start_time}"
        "timers.{id}.finish_time": "{finish_time}"
    # Each timer's labels, wherever a timer arrives whole.
    - path: "^/v1/get_all_timers\\?"
      json_each: "$.data[*].labels"
      json: { id: "$^._id", name: "$.name", color: "$.color" }
      state:
        "timers.{id}.labels.{index:+1}.name": "{name}"
        "timers.{id}.labels.{index:+1}.color": "{color}"
    - path: "^/v1/"
      json_match: { "$.data._model": "^timer$" }
      json_each: "$.data.labels"
      json: { id: "$^.data._id", name: "$.name", color: "$.color" }
      replace: "timers.{id}.labels"
      state:
        "timers.{id}.labels.{index:+1}.name": "{name}"
        "timers.{id}.labels.{index:+1}.color": "{color}"
    - json_match: { "$.event": "^(current|next)_timer$", "$.data": "^\\{" }
      json_each: "$.data.labels"
      json: { id: "$^.data._id", name: "$.name", color: "$.color" }
      replace: "timers.{id}.labels"
      state:
        "timers.{id}.labels.{index:+1}.name": "{name}"
        "timers.{id}.labels.{index:+1}.color": "{color}"
    - path: "^/v1/get_all_messages\\?"
      json_each: "$.data.messages"
      each_match: { "$._model": "^message$" }
      json:
        id: "$._id"
        showing: "$.showing"
        text: "$.text"
        color: "$.color"
        bold: "$.bold"
        uppercase: "$.uppercase"
      replace: messages
      state:
        "messages.{id}.index": "{index:+1}"
        "messages.{id}.showing": "{showing}"
        "messages.{id}.text": "{text}"
        "messages.{id}.color": "{color}"
        "messages.{id}.bold": "{bold}"
        "messages.{id}.uppercase": "{uppercase}"
    - path: "^/v1/get_output_links\\?"
      json_each: "$.data"
      json: { id: "$.id", name: "$.name", index: "$.index", url: "$.url" }
      replace: outputs
      state:
        "outputs.{id}.name": "{name}"
        "outputs.{id}.index": "{index}"
        "outputs.{id}.url": "{url}"
    - path: "^/v1/get_logs\\?"
      json_each: "$.data"
      json: { line: "$" }
      replace: logs
      state: { "logs.{index:+1}": "{line}" }
    # A deletion answers without the item: the list is read again.
    - path: "^/v1/delete_timer\\?"
      json_match: { "$.ok": "^true$" }
      json: {}
      then_send:
        - { method: GET, path: /v1/get_all_timers, query: { room_id: "{settings.room_id}" } }
    - path: "^/v1/delete_message\\?"
      json_match: { "$.ok": "^true$" }
      json: {}
      then_send:
        - { method: GET, path: /v1/get_all_messages, query: { room_id: "{settings.room_id}" } }

state:
  playback.timer_id: { type: string, description: "ID of the selected timer" }
  playback.running: { type: bool, description: "Whether the selected timer is running" }
  playback.start: { type: int, unit: ms, description: "When the selected timer's run started, in milliseconds since 1970-01-01 UTC" }
  playback.finish: { type: int, unit: ms, description: "When the selected timer reaches zero, in milliseconds since 1970-01-01 UTC; remaining time is finish minus now while running, finish minus pause while paused" }
  playback.pause: { type: int, unit: ms, description: "When the selected timer was paused, in milliseconds since 1970-01-01 UTC" }
  playback.server_time: { type: int, unit: ms, description: "Stagetimer's clock when the status was sent, in milliseconds since 1970-01-01 UTC" }
  playback.updated_at: { type: string, description: "When the playback status last changed, ISO 8601" }
  room.name: { type: string, description: "Room name" }
  room.date: { type: string, description: "Day the show starts (YYYY-MM-DD); absent for a room that always runs today" }
  room.blackout: { type: bool, description: "Whether blackout mode is on" }
  room.focus_message: { type: bool, description: "Whether focus mode is on (deprecated; no longer pushed on the socket)" }
  room.on_air: { type: bool, description: "Whether on-air mode is on" }
  room.logo: { type: string, description: "URL of the room's logo" }
  room.timezone: { type: string, description: "Room's time zone, an IANA name such as Europe/Berlin" }
  current_timer.id: { type: string, description: "ID of the selected timer; absent when none is selected" }
  next_timer.id: { type: string, description: "ID of the timer after the selected one; absent when there is none" }
  timers.*.index: { type: int, description: "Timer's place in the list, from 1 at the top, as the index commands take it; keyed by timer ID" }
  timers.*.name: { type: string, description: "Timer name" }
  timers.*.speaker: { type: string, description: "Timer's speaker" }
  timers.*.notes: { type: string, description: "Timer's notes" }
  timers.*.appearance: { type: string, description: "How the timer is shown: COUNTDOWN, COUNTUP, TOD, COUNTDOWN_TOD, COUNTUP_TOD or HIDDEN" }
  timers.*.type: { type: string, description: "Timer type: DURATION or FINISH_TIME" }
  timers.*.duration: { type: string, description: "Timer's duration as Stagetimer writes it, such as 0:06:00" }
  timers.*.hours: { type: int, unit: h, description: "Hours of the duration" }
  timers.*.minutes: { type: int, unit: min, description: "Minutes of the duration" }
  timers.*.seconds: { type: int, unit: s, description: "Seconds of the duration" }
  timers.*.wrap_up_yellow: { type: float, unit: s, description: "When the timer turns yellow, in seconds before its end" }
  timers.*.wrap_up_red: { type: float, unit: s, description: "When the timer turns red, in seconds before its end" }
  timers.*.trigger: { type: string, description: "How the timer starts: MANUAL, LINKED or SCHEDULED" }
  timers.*.start_time: { type: string, description: "Hard start time, ISO 8601 on today's date in the room's time zone" }
  timers.*.finish_time: { type: string, description: "Finish time of a FINISH_TIME timer, ISO 8601; only its time of day is meaningful" }
  timers.*.labels.*.name: { type: string, description: "Text of the timer's label, by label from 1" }
  timers.*.labels.*.color: { type: string, description: "Color of the timer's label, #RRGGBB" }
  messages.*.index: { type: int, description: "Message's place in the list, from 1 at the top; keyed by message ID" }
  messages.*.showing: { type: bool, description: "Whether the message is shown" }
  messages.*.text: { type: string, description: "Message text" }
  messages.*.color: { type: string, description: "Message color: white, green or red" }
  messages.*.bold: { type: bool, description: "Whether the message is bold" }
  messages.*.uppercase: { type: bool, description: "Whether the message is shown in capitals" }
  active_message.id: { type: string, description: "ID of the message the socket last reported shown or hidden" }
  active_message.showing: { type: bool, description: "Whether that message is shown" }
  flash.count: { type: int, description: "Number of flashes of the last manual flash" }
  outputs.*.name: { type: string, description: "Output name, keyed by output ID, as get_output_links last read them" }
  outputs.*.index: { type: int, description: "Output's place in the list" }
  outputs.*.url: { type: string, description: "Signed link to the output" }
  logs.*: { type: string, description: "Room log line, newest first from 1, as get_logs last read them" }

quirks:
  - models: [all]
    severity: info
    text: >
      room_id has to be given when the integration is opened: the API v1
      reference (stagetimer.io/docs/api-v1) has no call that lists rooms,
      every call but the root and test_auth naming one room, so the core
      cannot offer the rooms to choose from even with a team API key. The
      room's ID is on its controller page and under the desktop app's Menu >
      API.

  - models: [all]
    severity: warning
    text: >
      Stagetimer is a cloud service (api.stagetimer.io on 443, scheme https,
      opened by host name) or the desktop app on the local network (scheme
      http, opened at the address and port its sidebar shows). The API
      needs a paid licence; the desktop app's API URL is shown under Menu >
      API. The spec sends every request under /v1/, the path the cloud's API
      URL has; that the desktop app's URL has the same path is not
      documented.

  - models: [all]
    severity: warning
    text: >
      The API allows 100 requests a minute for a room key (a team key shares
      one budget across the team's rooms) and answers 429 beyond it. The
      core sends one request every 600 ms at most; with a team key shared
      by several devices or other tools, the budget can still run out.
      Changes arrive on the Socket.IO connection, so the lists are read once
      and again only when the socket reports a change.

  - models: [all]
    severity: info
    text: >
      get_status and the playback_status event give timestamps, not a
      ticking countdown: remaining time is finish minus now while running,
      and finish minus pause while paused (the API page's Computing a
      Countdown). A timer's start_time and finish_time carry a time of day;
      the date read back is today's in the room's time zone.

  - models: [all]
    severity: info
    text: >
      update_timer and update_message are partial updates; the spec gives
      one command per field or group of fields, each sending only those.
      Labels are written in indexed query notation and replace the timer's
      labels: set_timer_label gives a timer one label. More than one label
      in a single call has no command (the format cannot repeat a query
      parameter a variable number of times). get_output_links takes further
      options (identifier, mirror, tz) not offered here; the links read are
      signed and give access to the room's outputs.

  - models: [all]
    severity: critical
    text: >
      start_fresh resets every timer and clears the run's record (elapsed
      times, actual start and finish times, the undo history) at once, and
      delete_timer and delete_message cannot be undone through the API.
      next does nothing on the last timer, previous on the first. The
      focus commands are deprecated in favor of show_message with focus.

  - models: [all]
    severity: info
    text: >
      Timers and messages addressed by index count from 1 at the top of the
      controller page's list, which changes as items are added, removed or
      reordered; addressing by ID is stable. current_timer and next_timer
      are null when there is none, which empties them in state; the room's
      date is null for a room that always runs today.
