spec: 1
id: sennheiser-ew-dx
name: Sennheiser Evolution Wireless Digital EW-DX receivers (SSCv2)
vendor: Sennheiser
category: wireless
implementation: native
reason: >
  Telemetry is a server-sent event stream whose subscriptions are added using a
  session id the device issues when the stream opens, and a quiet stream has to
  be told apart from a dead one by probing. Both depend on what the device
  sends.

source:
  - title: EW-DX 3rd-party API, OpenAPI 1.7 (EW-DX_openapi_3rdparty_release_1.7.yaml)
    author: Sennheiser
    url: https://docs.cloud.sennheiser.com/en-us/api-docs/api-docs/open-api-ew-dx.html
    note: >
      Manufacturer OpenAPI document for EW-DX firmware 4.x, served by the
      Sennheiser 3rd Party API portal (v6.2, 08/2026). Every resource the core
      reads, subscribes and writes: /api/channel/{id} (name, mute, gain,
      outputLevel, mates, audio, eventCounter) and its identify, restore,
      channelSorting, warnings, signalStrengthIndicator,
      signalQualityIndicator, diversityIndicator and level;
      /api/rf, /api/rf/transmission, /api/rf/encryption, /api/rf/channels/{id}
      and its frequency and preset; the user and factory preset banks;
      /api/syncSettings/{id} and its ignore; /api/transmitters/{id}, its
      battery and warnings; /api/device/site, state, identification and
      identity; /api/ssc/legacyMode; /api/firmware/update/state. Ranges and
      enumerations are the document's.
  - title: Sennheiser Sound Control Protocol v2 (SSCv2), 06/2023
    author: Sennheiser
    url: https://www.sennheiser.com/globalassets/digizuite/40447-en-06_2023_sennheiser_sound_control_protocol_v2_tccm_en.pdf
    note: >
      HTTPS on port 443, HTTP Basic authentication as user "api", and the
      subscription lifecycle: GET /api/ssc/state/subscriptions opens the stream,
      and PUT .../{sessionUUID}/add subscribes resources.
  - title: Sennheiser Control Cockpit, Sennheiser Sound Control Protocols (SSCv1 and SSCv2), v9.2 04/2026
    url: https://docs.cloud.sennheiser.com/en-us/control-cockpit/control-cockpit/ssc-protocols.html
    note: SSCv2 uses HTTPS (TLS 1.3) and is enabled per device under 3rd Party Access.
  - title: Sennheiser Sound Control Protocol (SSC) — Developer's guide for EW-DX, 03/2023
    author: Sennheiser
    url: https://www.sennheiser.com/globalassets/digizuite/40838-en-ew-dx_sound_control_protocol_03_2023_en.pdf
    note: Units for the same quantities under SSCv1 (frequency in kHz, battery gauge in percent).
  - title: Sennheiser Sound Control Protocol (SSC) — Developer's guide for EW-DX, firmware 3.0.x, 03/2024
    author: Sennheiser
    url: https://docs.cloud.sennheiser.com/en-us/api-docs/api-docs/resources/ew-dx-sound-control-protocol-3-0-x.pdf
    note: >
      Manufacturer document for SSCv1 (legacy mode): JSON over UDP port 45
      (§6), /osc/xid, subscriptions and their lifetime (§5), and the methods
      used for what SSCv2 lacks (§8): /device/name, location, brightness,
      lock, booster (EM 4 Dante), restart, restore, network/ipv4/*,
      network/mdns, network/ether/macs and network/dante/* (Dante models).
  - title: Sennheiser Control Cockpit, Access for EW-DX devices
    url: https://docs.cloud.sennheiser.com/en-us/control-cockpit/control-cockpit/ew-dx-access.html
    note: >
      Third-party access is off by default and is set to Secure (SSCv2) or
      Legacy (SSCv1) under the receiver's Access page.
  - title: Bitfocus Companion, companion-module-sennheiser-ewdx
    url: https://github.com/bitfocus/companion-module-sennheiser-ewdx
    note: >
      MIT-licensed; read as corroboration only. Its help says firmware 4
      receivers need Legacy Mode enabled (it names Wireless Systems Manager)
      for SSCv1; it writes the control network fields as plain strings and
      the Dante ones as [primary, secondary] pairs with null for the side
      left alone.
  - title: RFDeck EW-DX client (SSCClient.ts)
    note: >
      Meros. Tested against real EW-DX receivers on OpenAPI 1.7 firmware: the
      /api/channel/{id} resources, the SSE subscription, and mute. Reviewed
      with the RFDeck agent on 2026-09-29 (RFDeck docs/INTEGRATIONS_CORE_REVIEW.md).

settings:
  password: { type: string, secret: true, required: true, label: Password, description: "The third-party access password set for the receiver in Sennheiser Control Cockpit." }
  legacy_mode: { type: bool, default: false, label: Legacy mode, description: "On when the receiver also has Legacy (SSCv1) third-party access enabled, which the device name, location, brightness, auto lock, booster, restart, factory reset and network commands need." }
  legacy_port: { type: int, min: 1, max: 65535, default: 45, label: Legacy port, description: "UDP port of the receiver's SSCv1 server, 45 unless it advertises another by DNS-SD." }

ports:
  - { port: 443, protocol: https, role: control }
  - { port: 45, protocol: udp, role: control, setting: legacy_port, when: "legacy_mode", note: "SSCv1 legacy mode, unencrypted and without a password" }

models:
  - id: em-2
    name: Sennheiser EW-DX EM 2 receiver
    channels: 2
    supports: &all
      [mute, set_channel_name, set_gain, set_af_out, identify, identify_device,
       restore_channel_audio_defaults, acknowledge_channel_sorting, set_frequency,
       select_preset, set_user_presets, get_factory_presets, set_link_density,
       set_encryption, set_transmitter_sync, set_transmitter_sync_ignore,
       set_device_name, set_location, set_brightness, set_auto_lock, restart,
       restore_factory_defaults, set_network, set_mdns]
    verification: none
  - id: em-2-dante
    name: Sennheiser EW-DX EM 2 Dante receiver
    channels: 2
    supports: &dante
      [mute, set_channel_name, set_gain, set_af_out, identify, identify_device,
       restore_channel_audio_defaults, acknowledge_channel_sorting, set_frequency,
       select_preset, set_user_presets, get_factory_presets, set_link_density,
       set_encryption, set_transmitter_sync, set_transmitter_sync_ignore,
       set_device_name, set_location, set_brightness, set_auto_lock, restart,
       restore_factory_defaults, set_network, set_mdns, set_dante_network,
       set_dante_interface_mapping]
    verification: none
  - id: em-4-dante
    name: Sennheiser EW-DX EM 4 Dante receiver
    channels: 4
    supports:
      [mute, set_channel_name, set_gain, set_af_out, identify, identify_device,
       restore_channel_audio_defaults, acknowledge_channel_sorting, set_frequency,
       select_preset, set_user_presets, get_factory_presets, set_link_density,
       set_encryption, set_transmitter_sync, set_transmitter_sync_ignore,
       set_device_name, set_location, set_brightness, set_auto_lock, restart,
       restore_factory_defaults, set_network, set_mdns, set_dante_network,
       set_dante_interface_mapping, set_booster]
    verification: none

commands:
  mute:
    summary: Mute or unmute a receiver channel (PUT /api/channel/{id} mute)
    params:
      channel: &channel { type: int, min: 1, max: 4, required: true, label: Channel, description: "Receiver channel, numbered from 1 as on the receiver; an EM 2 has channels 1 and 2." }
      muted:   { type: bool, default: true, label: Mute, description: "On mutes the receiver channel, off unmutes it." }
    returns: ack

  set_channel_name:
    summary: Name a receiver channel (PUT /api/channel/{id} name)
    params:
      channel: *channel
      name: { type: string, max_length: 8, pattern: "^[ #*+,;/<=|>0-9A-Z-]*$", required: true, label: Name, description: "Channel name of up to 8 characters: capitals, digits, space and # * + , ; - / < = | >." }
    returns: ack

  set_gain:
    summary: Set a receiver channel's gain (PUT /api/channel/{id} gain)
    params:
      channel: *channel
      gain_db: { type: int, min: -3, max: 42, required: true, label: Gain, description: "Receiver channel gain in dB, from -3 to +42 in steps of 3." }
    returns: ack

  set_af_out:
    summary: Set a receiver channel's AF output level (PUT /api/channel/{id} outputLevel)
    params:
      channel: *channel
      level_db: { type: int, min: -24, max: 18, required: true, label: Output level, description: "Audio output level in dB, from -24 to +18 in steps of 6." }
    returns: ack

  identify:
    summary: Start or stop a receiver channel's identification (PUT /api/channel/{id}/identify)
    params:
      channel: *channel
      enabled: &identify_enabled { type: bool, default: true, label: Identify, description: "On starts the visual identification, off stops it." }
    returns: ack

  identify_device:
    summary: Start or stop the receiver's own identification (PUT /api/device/identification visual)
    params:
      enabled: *identify_enabled
    returns: ack

  restore_channel_audio_defaults:
    summary: Restore a receiver channel's audio default settings (PUT /api/channel/{id}/restore, AudioDefault)
    params:
      channel: *channel
    returns: ack

  acknowledge_channel_sorting:
    summary: Acknowledge a receiver channel's channel sorting (PUT /api/channel/{id}/channelSorting sorted)
    params:
      channel: *channel
    returns: ack

  set_frequency:
    summary: Tune a receiver channel (PUT /api/rf/channels/{id}/frequency)
    params:
      channel: *channel
      frequency_khz: { type: int, min: 470200, max: 1999000, required: true, label: Frequency, description: "Carrier frequency in kHz, a multiple of 25 kHz within the receiver's frequency ranges (device.rf.ranges)." }
    returns: ack

  select_preset:
    summary: Tune a receiver channel to a preset of a factory or user bank (PUT /api/rf/channels/{id}/preset)
    params:
      channel: *channel
      bank_type: { type: enum, values: [factory, user], required: true, label: Bank type, description: "Factory picks from the factory frequency bank, user from the channel's user bank." }
      bank: { type: int, min: 0, max: 0, default: 0, label: Bank, description: "Preset bank, numbered from 0 as in the API; the API documents bank 0 only." }
      preset: { type: int, min: 0, max: 99, required: true, label: Preset, description: "Preset in the bank, as the API numbers it (see channels.<n>.preset.channel)." }
    returns: ack

  set_user_presets:
    summary: Replace a receiver channel's user preset bank (PUT /api/rf/presets/user/channels/{id}/banks/0, an array of 1 to 100 frequencies in kHz)
    params:
      channel: *channel
      frequencies_khz: { type: json, required: true, label: Frequencies, description: "The whole user bank as a JSON array of 1 to 100 carrier frequencies in kHz, each a multiple of 25." }
    returns: ack

  get_factory_presets:
    summary: Read a factory preset bank (GET /api/rf/presets/factory/banks/{bank}), an array of frequencies in kHz
    params:
      bank: { type: int, min: 0, max: 0, default: 0, label: Bank, description: "Factory bank, numbered from 0 as in the API; the API documents bank 0 only." }
    returns: value

  set_link_density:
    summary: Switch the RF transmission mode between Link Density and Standard (PUT /api/rf/transmission mode)
    params:
      enabled: { type: bool, required: true, label: Link Density, description: "On selects Link Density mode, which doubles the possible channels at a closer preset spacing; off selects Standard." }
    returns: ack

  set_encryption:
    summary: Turn RF (AES 256) encryption on or off (PUT /api/rf/encryption enabled)
    params:
      enabled: { type: bool, required: true, label: Encryption, description: "On encrypts the RF link; transmitters must be synced again to follow." }
    returns: ack

  set_transmitter_sync:
    summary: >
      Change the settings a receiver channel gives its transmitter when it is
      synced (PUT /api/syncSettings/{id} with only the fields given; at least
      one is needed)
    params:
      channel: *channel
      mute_config: { type: enum, values: ["off", rf_mute, af_mute], label: Mute mode, description: "What the transmitter's mute switch does: nothing, mute the RF, or mute the audio." }
      cable_emulation: { type: enum, values: ["off", type1, type2, type3], label: Cable emulation, description: "Guitar cable emulation of a bodypack's instrument input, off or one of three cable types." }
      lowcut: { type: enum, values: ["off", 30hz, 60hz, 80hz, 100hz, 120hz], label: Low cut, description: "Transmitter low-cut filter frequency, or off; handhelds and table stands offer 60 to 120 Hz only." }
      lock: { type: bool, label: Auto lock, description: "On locks the transmitter's controls automatically, off leaves them unlocked." }
      trim_db: { type: int, min: -12, max: 6, label: Trim, description: "Transmitter input trim in dB, from -12 to +6 in steps of 1." }
      led: { type: bool, label: LED, description: "On lets the transmitter's status LED light, off keeps it dark." }
      mute_config_table_stand: { type: enum, values: [af_mute, "off", push_to_talk, push_to_mute], label: Table stand mute mode, description: "What a table stand's button does: mute the audio, nothing, push to talk or push to mute." }
    returns: ack

  set_transmitter_sync_ignore:
    summary: >
      Choose which sync settings a receiver channel leaves out when syncing its
      transmitter (PUT /api/syncSettings/{id}/ignore with only the fields
      given; at least one is needed)
    params:
      channel: *channel
      mute_config: &ignore { type: bool, label: Ignore, description: "On leaves this setting out of a sync, so the transmitter keeps its own; off includes it." }
      cable_emulation: *ignore
      lowcut: *ignore
      lock: *ignore
      trim: *ignore
      led: *ignore
      name: *ignore
      frequency: *ignore
    returns: ack

  set_device_name:
    summary: Name the receiver (SSCv1 /device/name; needs legacy mode)
    params:
      name: { type: string, max_length: 18, pattern: "^[A-Za-z0-9]+$", required: true, label: Name, description: "Device name of up to 18 letters and digits; it is also the receiver's DNS-SD name." }
    returns: ack

  set_location:
    summary: Set the receiver's location text (SSCv1 /device/location; needs legacy mode)
    params:
      location: { type: string, max_length: 255, pattern: "^[ !#-&(-.0-\\[\\]-~]*$", required: true, label: Location, description: "Free text of up to 255 printable ASCII characters other than quotes, slash and backslash, naming where the receiver is." }
    returns: ack

  set_brightness:
    summary: Set the display brightness (SSCv1 /device/brightness; needs legacy mode)
    params:
      level: { type: int, min: 1, max: 5, required: true, label: Brightness, description: "Display brightness from 1 (20%) to 5 (100%) in steps of 20%." }
    returns: ack

  set_auto_lock:
    summary: Lock or unlock the receiver's keys (SSCv1 /device/lock; needs legacy mode)
    params:
      locked: { type: bool, required: true, label: Auto lock, description: "On locks the receiver's front-panel keys, off unlocks them." }
    returns: ack

  set_booster:
    summary: Turn the power supply for an external antenna booster on or off (SSCv1 /device/booster; EM 4 Dante; needs legacy mode)
    params:
      enabled: { type: bool, required: true, label: Booster supply, description: "On powers an external antenna booster through the antenna input, off stops it." }
    returns: ack

  restart:
    summary: Restart the receiver (SSCv1 /device/restart; needs legacy mode)
    returns: ack

  restore_factory_defaults:
    summary: Restore every factory default (SSCv1 /device/restore FACTORY_DEFAULTS; needs legacy mode)
    returns: ack

  set_network:
    summary: >
      Set the control interface's addressing (SSCv1 /device/network/ipv4;
      needs legacy mode): automatic, or a static address with ip, netmask and
      gateway all given
    params:
      auto: { type: bool, required: true, label: Automatic, description: "On takes the address by DHCP or Auto-IP; off uses the static address given." }
      ip: { type: string, pattern: "^(\\d{1,3}\\.){3}\\d{1,3}$", label: IP address, description: "Static IPv4 address in dotted form, needed when automatic is off." }
      netmask: { type: string, pattern: "^(\\d{1,3}\\.){3}\\d{1,3}$", label: Netmask, description: "IPv4 netmask in dotted form, needed when automatic is off." }
      gateway: { type: string, pattern: "^(\\d{1,3}\\.){3}\\d{1,3}$", label: Gateway, description: "IPv4 gateway in dotted form, needed when automatic is off." }
    returns: ack

  set_mdns:
    summary: Turn mDNS (DNS-SD announcement) on or off (SSCv1 /device/network/mdns; needs legacy mode)
    params:
      enabled: { type: bool, required: true, label: mDNS, description: "On announces the receiver by DNS-SD, off stops it." }
    returns: ack

  set_dante_network:
    summary: >
      Set one Dante interface's addressing (SSCv1 /device/network/dante/ipv4;
      Dante models; needs legacy mode): automatic, or a static address with
      ip, netmask and gateway all given
    params:
      interface: { type: enum, values: [primary, secondary], required: true, label: Dante interface, description: "The primary or secondary Dante interface; the other is left as it is." }
      auto: { type: bool, required: true, label: Automatic, description: "On takes the address by DHCP or Auto-IP; off uses the static address given." }
      ip: { type: string, pattern: "^(\\d{1,3}\\.){3}\\d{1,3}$", label: IP address, description: "Static IPv4 address in dotted form, needed when automatic is off." }
      netmask: { type: string, pattern: "^(\\d{1,3}\\.){3}\\d{1,3}$", label: Netmask, description: "IPv4 netmask in dotted form, needed when automatic is off." }
      gateway: { type: string, pattern: "^(\\d{1,3}\\.){3}\\d{1,3}$", label: Gateway, description: "IPv4 gateway in dotted form, needed when automatic is off." }
    returns: ack

  set_dante_interface_mapping:
    summary: Choose how the receiver's network ports are shared between control and Dante (SSCv1 /device/network/dante/interface_mapping; Dante models; needs legacy mode)
    params:
      mapping: { type: enum, values: [single_cable, split1, split2, split, audio_redundancy], required: true, label: Port mapping, description: "Single cable carries control and Dante on every port; the split mappings separate control from Dante; audio redundancy adds a secondary Dante network." }
    returns: ack

state:
  device.identity:                   { type: object, description: "The /api/device/identity resource as the device returns it: product (EWDX2CHS, EWDX2CHDS, EWDX4CHDS), hardwareRevision, serial, vendor" }
  device.name:                       { type: string, description: "Device name, from /api/device/site" }
  device.location:                   { type: string, description: "Device location, from /api/device/site" }
  device.state:                      { type: string, description: "Overall state: normal, identifying, firmware_update or busy (starting, applying a long operation such as a Link Density change, or powering off)" }
  device.warnings:                   { type: array, description: "Device warnings, as the device names them" }
  device.identifying:                { type: bool, description: "Whether the receiver's own visual identification is running" }
  device.rf.code:                    { type: string, description: "Country-specific frequency range code, e.g. Q1-9" }
  device.rf.ranges:                  { type: array, description: "The receiver's frequency ranges, each {start_khz, end_khz, step_khz}" }
  device.link_density:               { type: bool, description: "Whether the RF transmission mode is Link Density (true) or Standard (false)" }
  device.preset_spacing_khz:         { type: int, unit: kHz, description: "Preset spacing, which depends on the transmission mode" }
  device.encryption:                 { type: bool, description: "Whether RF encryption is on" }
  device.legacy_mode:                { type: bool, description: "Whether the unencrypted SSCv1 legacy third-party access is enabled on the receiver" }
  device.firmware.version:           { type: string, description: "Running firmware version" }
  device.firmware.dante_version:     { type: string, description: "Running Dante firmware version (Dante models)" }
  device.firmware.update_state:      { type: string, description: "idle or updating" }
  device.firmware.update_progress_pct: { type: int, unit: "%", description: "Firmware update progress, 0-100" }
  device.firmware.last_status:       { type: string, description: "Result of the last firmware update since boot: None, or an error such as Invalid firmware package" }
  device.brightness:                 { type: int, description: "Display brightness, 1 (20%) to 5 (100%); legacy mode" }
  device.auto_lock:                  { type: bool, description: "Whether the receiver's keys are locked; legacy mode" }
  device.booster:                    { type: bool, description: "Whether the external antenna booster supply is on (EM 4 Dante); legacy mode" }
  device.network.auto:               { type: bool, description: "Whether the control interface takes its address automatically; legacy mode" }
  device.network.ip:                 { type: string, description: "Current IPv4 address; legacy mode" }
  device.network.netmask:            { type: string, description: "Current IPv4 netmask; legacy mode" }
  device.network.gateway:            { type: string, description: "Current IPv4 gateway; legacy mode" }
  device.network.manual_ip:          { type: string, description: "Static IPv4 address, used when auto is off; legacy mode" }
  device.network.manual_netmask:     { type: string, description: "Static IPv4 netmask; legacy mode" }
  device.network.manual_gateway:     { type: string, description: "Static IPv4 gateway; legacy mode" }
  device.network.mdns:               { type: bool, description: "Whether mDNS announcement is on; legacy mode" }
  device.network.macs:               { type: array, description: "Control interface MAC addresses; legacy mode" }
  device.dante.version:              { type: string, description: "Dante software version (Dante models); legacy mode" }
  device.dante.auto:                 { type: array, description: "[primary, secondary]: whether each Dante interface takes its address automatically; legacy mode" }
  device.dante.ip:                   { type: array, description: "[primary, secondary] current Dante IPv4 addresses; legacy mode" }
  device.dante.netmask:              { type: array, description: "[primary, secondary] current Dante netmasks; legacy mode" }
  device.dante.gateway:              { type: array, description: "[primary, secondary] current Dante gateways; legacy mode" }
  device.dante.manual_ip:            { type: array, description: "[primary, secondary] static Dante IPv4 addresses; legacy mode" }
  device.dante.manual_netmask:       { type: array, description: "[primary, secondary] static Dante netmasks; legacy mode" }
  device.dante.manual_gateway:       { type: array, description: "[primary, secondary] static Dante gateways; legacy mode" }
  device.dante.macs:                 { type: array, description: "Dante interface MAC addresses; legacy mode" }
  device.dante.interface_mapping:    { type: string, description: "Network port mapping: single_cable, split1, split2, split or audio_redundancy; legacy mode" }
  channels.*.name:                   { type: string, description: "Channel name" }
  channels.*.mute:                   { type: bool, description: "Receiver mute" }
  channels.*.gain_db:                { type: int, unit: dB, description: "Receiver channel gain, -3 to +42 in steps of 3" }
  channels.*.af_out_db:              { type: int, unit: dB, description: "AF output level, -24 to +18 in steps of 6" }
  channels.*.mate:                   { type: string, description: "The transmitter slot linked to the channel, e.g. TX1" }
  channels.*.output:                 { type: string, description: "The audio output of the channel, e.g. Out1" }
  channels.*.sorting_event_counter:  { type: int, description: "Channel sorting event counter" }
  channels.*.identifying:            { type: bool, description: "Whether the channel's visual identification is running" }
  channels.*.frequency_khz:          { type: int, unit: kHz, description: "Carrier frequency, from /api/rf/channels/{id}" }
  channels.*.preset.type:            { type: string, description: "Active preset bank type: factory, user or none" }
  channels.*.preset.bank:            { type: int, description: "Active preset bank as the API numbers it; null when the type is none" }
  channels.*.preset.channel:         { type: int, description: "Active preset in the bank as the API numbers it; null when the type is none" }
  channels.*.user_presets_khz:       { type: array, unit: kHz, description: "The channel's user preset bank 0, as frequencies in kHz" }
  channels.*.rf.quality_pct:         { type: int, unit: "%", description: "Signal quality indicator (RSQI), 0-100" }
  channels.*.rf.strength_dbm:        { type: float, unit: dBm, description: "Signal strength indicator (RSSI), -107 to 0" }
  channels.*.rf.antenna:             { type: string, description: "Active diversity antenna: none, a or b" }
  channels.*.af.level_dbfs:          { type: float, unit: dBFS, description: "Audio level" }
  channels.*.warnings:               { type: array, description: "Active channel warnings: Aes256Error, LowSignal, NoLink, RfPeak, AfPeak" }
  channels.*.sync.mute_config:       { type: string, description: "Sync setting: transmitter mute mode, off, rf_mute or af_mute" }
  channels.*.sync.cable_emulation:   { type: string, description: "Sync setting: cable emulation, off or type1-type3" }
  channels.*.sync.lowcut:            { type: string, description: "Sync setting: low cut, off, 30hz, 60hz, 80hz, 100hz or 120hz" }
  channels.*.sync.lock:              { type: bool, description: "Sync setting: transmitter auto lock" }
  channels.*.sync.trim_db:           { type: int, unit: dB, description: "Sync setting: transmitter trim, -12 to +6" }
  channels.*.sync.led:               { type: bool, description: "Sync setting: transmitter LED on" }
  channels.*.sync.mute_config_table_stand: { type: string, description: "Sync setting: table stand mute mode, af_mute, off, push_to_talk or push_to_mute" }
  channels.*.sync.ignore.*:          { type: bool, description: "Whether a sync leaves this setting out: mute_config, cable_emulation, lowcut, lock, trim, led, name or frequency" }
  channels.*.transmitter:            { type: object, description: "Absent until known; null when no transmitter is linked (its resources answer 422)" }
  channels.*.transmitter.type:       { type: string, description: "Transmitter type as the API names it, e.g. EW_DX_SKM, EW_DX_SK, EW_DX_TS_5_PIN, EW_D_SKP" }
  channels.*.transmitter.capsule:    { type: string, description: "Mounted capsule as the API names it, e.g. MMD_935, KK_205, Unknown, None" }
  channels.*.transmitter.version:    { type: string, description: "Transmitter firmware version" }
  channels.*.transmitter.name:       { type: string, description: "Transmitter name" }
  channels.*.transmitter.mute:       { type: bool, description: "Transmitter mute switch state" }
  channels.*.transmitter.identifying: { type: bool, description: "Whether the transmitter is identifying" }
  channels.*.transmitter.lowcut:     { type: string, description: "Transmitter low cut: off, 30hz, 60hz, 80hz, 100hz or 120hz" }
  channels.*.transmitter.trim_db:    { type: int, unit: dB, description: "Transmitter trim, -12 to +6" }
  channels.*.transmitter.cable_emulation: { type: string, description: "Transmitter cable emulation: off or type1-type3 (bodypacks)" }
  channels.*.transmitter.led:        { type: bool, description: "Transmitter LED on" }
  channels.*.transmitter.lock:       { type: bool, description: "Transmitter auto lock on" }
  channels.*.transmitter.mute_config: { type: string, description: "Transmitter mute mode: off, rf_mute or af_mute" }
  channels.*.transmitter.mute_config_table_stand: { type: string, description: "Table stand mute mode: af_mute, off, push_to_talk or push_to_mute" }
  channels.*.transmitter.battery_percent: { type: int, unit: "%", description: "Battery gauge, 0-100" }
  channels.*.transmitter.battery_type: { type: string, description: "battery (rechargeable pack), primary_cell or no_battery" }
  channels.*.transmitter.battery_lifetime_min: { type: int, unit: min, description: "Remaining battery lifetime" }
  channels.*.transmitter.warnings:   { type: array, description: "Transmitter warnings: LowBattery, AfPeak" }

quirks:
  - models: [all]
    severity: warning
    text: >
      The API is unavailable until third-party access is enabled on the device in
      Sennheiser Control Cockpit, with a password set. Requests are then
      authenticated as user "api" with that password. A wrong or missing password
      is reported as unauthorized, not as an unreachable device, and is never
      retried: after a 401 or 403 on any request the core sends nothing more
      until the device is opened again with a corrected password. Repeated
      failed logins have locked a device's third-party access until it was
      re-adopted in Control Cockpit.

  - models: [all]
    severity: warning
    text: >
      The device presents a self-signed certificate, so it is accepted without
      verification. The connection is encrypted but the device is not
      authenticated; on an untrusted network another host could impersonate it.

  - models: [all]
    severity: critical
    text: >
      set_link_density changes the RF transmission mode. The receiver reports
      itself busy while it applies it (under SSCv1 the same change reboots the
      receiver), audio stops meanwhile, and the transmitters must be synced
      again. set_encryption likewise needs every transmitter synced again
      before its link comes back. Neither can be undone live.

  - models: [all]
    severity: critical
    text: >
      restore_channel_audio_defaults puts a channel's audio settings back to
      their defaults at once; the earlier values are not kept.

  - models: [all]
    severity: warning
    text: >
      Over SSCv2 the device name and location are read-only
      (/api/device/site has no write), and restart, factory reset, display
      brightness, auto lock, the booster supply, network and Dante settings
      have no SSCv2 resource at all. Those commands go over SSCv1 (JSON over
      UDP port 45) and need Legacy third-party access enabled for the
      receiver (Control Cockpit: the receiver's Access page, 3rd party access,
      Edit, Legacy; Wireless Systems Manager calls it Legacy Mode) and the
      legacy_mode setting on. SSCv1 is unencrypted and has no password. With
      legacy_mode off they fail at once; with it on and the receiver not
      answering on UDP, they time out after 2 s.

  - models: [all]
    severity: critical
    text: >
      restore_factory_defaults resets every setting, including third-party
      access and the network, and restart, set_network and
      set_dante_interface_mapping take the receiver off the network for a
      while or move it to an address the core is not using. None can be
      undone from here.

  - models: [all]
    severity: info
    text: >
      Transmitter settings cannot be written directly: set_transmitter_sync
      sets what the receiver gives a transmitter at its next sync, and the
      transmitter's own values arrive in channels.<n>.transmitter.

  - models: [all]
    severity: info
    text: >
      Battery health and charge cycles are not reported by the receiver; they
      are read from a network charger such as the CHG 70N.

  - models: [all]
    severity: info
    text: >
      Telemetry arrives only when a value changes. A quiet stream is checked by
      requesting /api/ssc/version after 3 s of silence; two failed checks in a
      row are treated as a lost connection.

  - models: [all]
    severity: info
    text: >
      Resources from older OpenAPI versions come first in the subscription, and
      a batch the device refuses does not stop the later ones, so firmware
      lacking a resource (sync settings arrived with OpenAPI 1.6, transmitters
      with 1.5) still keeps the rest current.

  - models: [all]
    severity: info
    text: >
      A receiver with both a control and a Dante interface answers on both with
      the same identity. Open it by its control interface address.

  - models: [all]
    severity: info
    text: >
      Out-of-step values are refused before sending: gain in steps of 3 dB, AF
      output in steps of 6 dB, frequencies in steps of 25 kHz, as the API
      declares them.

  - models: [em-4-dante]
    severity: info
    text: >
      Channels are 1-based here and 0-based in the API (/api/channel/0 is
      channel 1). Subscriptions cover every channel of the model; RFDeck's
      original client subscribed channels 1 and 2 only.
