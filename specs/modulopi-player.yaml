spec: 1
id: modulopi-player
name: Modulo Pi Modulo Player (WebSocket external control)
vendor: Modulo Pi
category: playback

# Modulo Player accepts websocket connections on port 8080 once a show is
# loaded and takes JSON-RPC 2.0 requests, one per message, answered with the
# same id (replies may come out of order). The commands here cover the show,
# playlists, cues, layers and effects, tasks, media, outputs, monitoring,
# DigiMaps and the Live Mixer; call, get_object and set_properties reach every
# other method and property the API offers. Player pushes event.show.loaded
# when a show is ready (the lists are then read again) and mixer.state to a
# client that has used the Live Mixer; the player status, playlists, tasks,
# media, outputs and the mixer's lists are polled.
source:
  - title: "Modulo Player manual, WebSocket external control protocol"
    author: Modulo Pi
    url: "https://support.modulo-pi.com/modulo-player-manual/1/en/topic/websocket-external-control-protocol"
    note: >
      Manufacturer documentation, read 2026-10-27 (marked as under maintenance). ws://<ip>:8080 once a show
      is loaded, Spydog methods on 8081; no password; several clients; requests {jsonrpc, method (not
      case-sensitive), params (case-sensitive), id}, one per message, replies matched by id; errors -32600,
      -32601, -32602 (invalid parameter, no object, no show), -32603, -32000 (action not possible), -32001
      (Live Mixer not ready), -32003; notifications event.show.loaded {name} and mixer.state.
  - title: "Modulo Player manual, WebSocket method pages"
    author: Modulo Pi
    url: "https://support.modulo-pi.com/modulo-player-manual/1/en/topic/websocket-playlists"
    note: >
      Manufacturer documentation, read 2026-10-27: websocket-generic-methods (get.list.methods, get.object
      with depth 0-8, get.tree, set.property with a properties object, all validated before any write),
      websocket-show (doaction.show save, backup, rescanmedia, removemissingmedia, rescanmediaforce, ping,
      sendshowtoremote, load with name; get.status.player version, apiVersion, showName, documentState 0-2,
      frameCounter, displayFrequency, maxOutputs, playlistCount, master, mediaToCache, mediaCaching,
      clientConnected; get.list.shows, new.show, saveas.show, saveincrement.show, backup.show,
      get.list.backups, restore.show, get.list.import, import.show, get.object.computer,
      set.property.computer), websocket-playlists (get.list.playlists level playlist / cue / layer;
      doaction.playlist prev, next, goto and preload with a cue from 1, play, pause, grandMasterFader and
      audioMaster with value 0-100 % and duration in ms; get.playlist.settings, set.playlist.settings,
      new.playlist, delete.playlist, set.property.playlist name / uiColor; playlist fields activeLayers,
      audioMaster, cueCount, currentCueUuid, currentcuename, grandMasterFader 0-1, index, name, play,
      playState, preloadCueUuid, timecode, timecodeLocked, uiColor, uuid), websocket-cues-layers
      (get.list.cues with offset and limit, add.cues, delete.cues, duplicate.cue, set.cue.settings with
      trigger go / follow / wait / timecode and triggerTime, set.cue.index, get.property.cue,
      set.property.cue), websocket-layers-fx (get.object.layer, set.layer.media with slot media / audio /
      stereo / mask, clear.layer.media, set.layer.settings, get.list.fx.types, add.fx, set.fx.settings,
      delete.fx), websocket-tasks (get.list.tasks, run.task, set.task, create.task, duplicate.task,
      remove.task), websocket-media (get.list.media with mediaState 0, 2, 3, 4; get.object.media,
      get.tree.media, add.media, set.media.settings, delete.media, delete.media.missing, rescan.media),
      websocket-outputs (get.list.outputs, get.object.output, set.property.output, add.output,
      delete.output), websocket-monitoring (get.list.monitoring, set.property.monitoring active,
      set.monitoring.zone), websocket-digimap (get.list.digimaps, doaction.digimap), and the Live Mixer
      pages (get.state and mixer.state fields, mixer.set.option, mixer.take, mixer.cut,
      mixer.transition.begin / position / commit / cancel / type, mixer.pgmtopvw, mixer.clear,
      mixer.source.set, mixer.source.freeze, get.list.sources, get.list.destinations, get.list.renders,
      mixer.destination.active, mixer.destination.all, mixer.set.property, get.list.presets,
      mixer.preset.recall / save / add / delete, mixer.show.save).
  - title: "Modulo Player manual, TCP/IP external control protocol"
    author: Modulo Pi
    url: "https://support.modulo-pi.com/modulo-player-manual/1/en/topic/tcp-ip-external-control-protocol"
    note: >
      Read 2026-10-27: the older text protocol on TCP 28686 (show) and 28670 (computer); the websocket API
      covers everything it does, so it is not used here.

transport:
  type: ws
  port: 8080
  path: /
  scheme: ws
  timeout_ms: 10000
  reply: expected
  probe: '{"jsonrpc":"2.0","method":"get.status.player","id":"probe"}'

ports:
  - { port: 8080, protocol: ws, role: control, note: "Modulo Player's websocket API, open once a show is loaded" }

models:
  - id: player
    name: Modulo Pi Modulo Player
    supports: [call, get_methods, get_object, get_tree, set_properties, get_player_status, show_action, load_show,
               list_shows, new_show, save_show_as, save_show_increment, backup_show, list_backups, restore_show,
               list_import, import_show_all, get_computer, set_computer_properties, list_playlists, get_playlist,
               playlist_next, playlist_previous, playlist_goto, playlist_preload, playlist_play, playlist_pause,
               playlist_grand_master, playlist_audio_master, get_playlist_settings, set_playlist_settings,
               rename_playlist, new_playlist, delete_playlist, list_cues, get_cue_property, set_cue_settings,
               set_cue_trigger, rename_cue, add_cues, delete_cue, duplicate_cue, move_cue, get_layer,
               set_layer_media, clear_layer_media, set_layer_settings, list_fx_types, add_fx, set_fx_settings,
               delete_fx, list_tasks, run_task, set_task_enabled, create_task, duplicate_task, remove_task,
               list_media, get_media, get_media_tree, add_media, set_media_settings, delete_media,
               delete_missing_media, rescan_media, list_outputs, get_output, set_output_properties, add_output,
               delete_output, list_monitoring, activate_monitoring, set_monitoring_zone, list_digimaps,
               digimap_action, get_mixer_state, mixer_set_options, mixer_take, mixer_cut, mixer_transition_begin,
               mixer_transition_position, mixer_transition_commit, mixer_transition_cancel, mixer_transition_type,
               mixer_pgm_to_pvw, mixer_clear, mixer_source_set, mixer_source_freeze, list_mixer_sources,
               list_mixer_destinations, list_mixer_renders, mixer_destination_active, mixer_destination_all,
               mixer_set_property, list_mixer_presets, mixer_preset_recall, mixer_preset_save, mixer_preset_add,
               mixer_preset_delete, mixer_show_save]
    verification: none

commands:
  # ── Any method ──────────────────────────────────────────────────────────
  call:
    summary: "Call any method of the API with its params object and return its result (get.list.methods lists them)"
    params:
      method: { type: string, pattern: '^[a-z]+(\.[a-z]+)+$', max_length: 128, required: true, label: Method, description: "The JSON-RPC method, such as set.playlist.fader." }
      params: { type: json, required: true, label: Params, description: "The method's params object as the manual documents it; {} for none." }
    send: '{"jsonrpc":"2.0","method":{method:json},"params":{params},"id":"call"}'
    expect: { reply_json: { "$.id": "call" }, json_path: "$.result" }
    returns: value
  get_methods:
    summary: "List the API's methods with their parameters, optionally those starting with a prefix (get.list.methods)"
    params:
      prefix: { type: string, pattern: '^[a-z.]*$', max_length: 64, default: "", label: Prefix, description: "Only methods starting with this, such as mixer.; empty for all." }
    send: '{"jsonrpc":"2.0","method":"get.list.methods","params":{"prefix":"{prefix}"},"id":"methods"}'
    expect: { reply_json: { "$.id": "methods" }, json_path: "$.result" }
    returns: value
  get_object:
    summary: "Read any object by uuid with its properties and children to a depth (get.object)"
    params:
      uuid: &uuid { type: string, pattern: '^\{[0-9A-Fa-f-]{36}\}$', max_length: 38, required: true, label: UUID, description: "The object's uuid, braces included." }
      depth: { type: int, min: 0, max: 8, default: 0, label: Depth, description: "How many levels of children to give in full." }
    send: '{"jsonrpc":"2.0","method":"get.object","params":{"uuid":"{uuid}","depth":{depth}},"id":"object {uuid}"}'
    expect: { reply_json: { "$.id": "object {uuid}" }, json_path: "$.result" }
    returns: value
  get_tree:
    summary: "Read the show's object tree to a depth (get.tree)"
    params:
      depth: { type: int, min: 0, max: 64, default: 1, label: Depth, description: "How many levels to give." }
    send: '{"jsonrpc":"2.0","method":"get.tree","params":{"depth":{depth}},"id":"tree"}'
    expect: { reply_json: { "$.id": "tree" }, json_path: "$.result" }
    returns: value
  set_properties:
    summary: "Set any object's settable properties, all validated before any is written; answers those that changed (set.property)"
    params:
      uuid: *uuid
      properties: { type: json, required: true, label: Properties, description: "An object of property names (as get.object gives them) and values, such as {\"name\":\"Intro\"}." }
    send: '{"jsonrpc":"2.0","method":"set.property","params":{"uuid":"{uuid}","properties":{properties}},"id":"set {uuid}"}'
    expect: { reply_json: { "$.id": "set {uuid}" }, json_path: "$.result" }
    returns: value

  # ── Show and computer ───────────────────────────────────────────────────
  get_player_status:
    summary: "Read the player's version, show, document state, outputs and clients (get.status.player)"
    send: '{"jsonrpc":"2.0","method":"get.status.player","id":"status"}'
    expect: { reply_json: { "$.id": "status" }, json_path: "$.result" }
    returns: value
  show_action:
    summary: "Save, back up, rescan media, remove missing media, ping, or send the show to the Remotes (doaction.show)"
    params:
      action: { type: enum, values: [save, backup, rescanmedia, rescanmediaforce, removemissingmedia, ping, sendshowtoremote], required: true,
                label: Action, description: "save, backup, rescanmedia, rescanmediaforce, removemissingmedia, ping or sendshowtoremote." }
    send: '{"jsonrpc":"2.0","method":"doaction.show","params":{"action":"{action}"},"id":"show {action}"}'
    expect: { reply_json: { "$.id": "show {action}" }, json_equals: { "$.result": true } }
    returns: ack
  load_show:
    summary: "Load a show file (doaction.show load)"
    params:
      name: &show_name { type: string, pattern: '^[^/\\]+$', max_length: 255, required: true, label: Show, description: "The show's file name, .xml included, such as MyShow.xml." }
    send: '{"jsonrpc":"2.0","method":"doaction.show","params":{"action":"load","name":{name:json}},"id":"load show"}'
    expect: { reply_json: { "$.id": "load show" }, json_equals: { "$.result": true } }
    returns: ack
  list_shows:
    summary: "List the show files, optionally filtered (get.list.shows)"
    params:
      filter: &filter { type: string, max_length: 256, default: "", label: Filter, description: "Only names containing this, any case; empty for all." }
    send: '{"jsonrpc":"2.0","method":"get.list.shows","params":{"filter":{filter:json}},"id":"shows"}'
    expect: { reply_json: { "$.id": "shows" }, json_path: "$.result" }
    returns: value
  new_show:
    summary: "Create a new show and load it (new.show)"
    params:
      name: *show_name
      overwrite: &overwrite { type: bool, default: false, label: Overwrite, description: "Replace a file of that name." }
    send: '{"jsonrpc":"2.0","method":"new.show","params":{"name":{name:json},"overwrite":{overwrite}},"id":"new show"}'
    expect: { reply_json: { "$.id": "new show" }, json_path: "$.result" }
    returns: value
  save_show_as:
    summary: "Save the show under another name (saveas.show)"
    params: { name: *show_name, overwrite: *overwrite }
    send: '{"jsonrpc":"2.0","method":"saveas.show","params":{"name":{name:json},"overwrite":{overwrite}},"id":"save as"}'
    expect: { reply_json: { "$.id": "save as" }, json_path: "$.result" }
    returns: value
  save_show_increment:
    summary: "Save the show under its name with the next number (saveincrement.show)"
    params: { overwrite: *overwrite }
    send: '{"jsonrpc":"2.0","method":"saveincrement.show","params":{"overwrite":{overwrite}},"id":"save increment"}'
    expect: { reply_json: { "$.id": "save increment" }, json_path: "$.result" }
    returns: value
  backup_show:
    summary: "Make a backup archive of the show; answers its name (backup.show)"
    send: '{"jsonrpc":"2.0","method":"backup.show","id":"backup"}'
    expect: { reply_json: { "$.id": "backup" }, json_path: "$.result" }
    returns: value
  list_backups:
    summary: "List the backups, newest first (get.list.backups)"
    params: { filter: *filter }
    send: '{"jsonrpc":"2.0","method":"get.list.backups","params":{"filter":{filter:json}},"id":"backups"}'
    expect: { reply_json: { "$.id": "backups" }, json_path: "$.result" }
    returns: value
  restore_show:
    summary: "Restore a backup and load it (restore.show)"
    params:
      backup: { type: string, max_length: 255, required: true, label: Backup, description: "The backup's name, as backup_show or list_backups gives it." }
      force: { type: bool, default: false, label: Force, description: "Restore a backup of another or an unknown show too." }
    send: '{"jsonrpc":"2.0","method":"restore.show","params":{"backup":{backup:json},"force":{force}},"id":"restore"}'
    expect: { reply_json: { "$.id": "restore" }, json_path: "$.result" }
    returns: value
  list_import:
    summary: "List what another show file holds to import: outputs, playlists, devices, tasks, DigiMaps, UI panels (get.list.import)"
    params: { name: *show_name }
    send: '{"jsonrpc":"2.0","method":"get.list.import","params":{"name":{name:json}},"id":"import list"}'
    expect: { reply_json: { "$.id": "import list" }, json_path: "$.result" }
    returns: value
  import_show_all:
    summary: "Import everything from another show file (import.show with all of each kind)"
    params: { name: *show_name }
    send: '{"jsonrpc":"2.0","method":"import.show","params":{"name":{name:json},"outputs":"all","playlists":"all","devices":"all","tasks":"all","digimaps":"all","uipanels":"all"},"id":"import"}'
    expect: { reply_json: { "$.id": "import" }, json_path: "$.result" }
    returns: value
  get_computer:
    summary: "Read the computer's settings (desktop, master, cluster, faders, HDR, autosave) and information (get.object.computer)"
    send: '{"jsonrpc":"2.0","method":"get.object.computer","id":"computer"}'
    expect: { reply_json: { "$.id": "computer" }, json_path: "$.result" }
    returns: value
  set_computer_properties:
    summary: "Change computer settings such as audioMaster, gammaFader, gainFader, master, clusterId, autoSave or autoBackup (set.property.computer)"
    params:
      properties: { type: json, required: true, label: Settings, description: "An object of setting names and values as get.object.computer gives them, such as {\"audioMaster\":0.8}." }
    send: '{"jsonrpc":"2.0","method":"set.property.computer","params":{"properties":{properties}},"id":"set computer"}'
    expect: { reply_json: { "$.id": "set computer" }, json_path: "$.result" }
    returns: value

  # ── Playlists ───────────────────────────────────────────────────────────
  list_playlists:
    summary: "List the playlists, with their cues or their cues' layers if asked (get.list.playlists)"
    params:
      level: { type: enum, values: [playlist, cue, layer], default: playlist, label: Detail, description: "playlist alone, with each playlist's cues, or with the cues' layers too." }
    send: '{"jsonrpc":"2.0","method":"get.list.playlists","params":{"level":"{level}"},"id":"playlists {level}"}'
    expect: { reply_json: { "$.id": "playlists {level}" }, json_path: "$.result" }
    returns: value
  get_playlist:
    summary: "Read one playlist by name (get.object.playlist)"
    params:
      playlist: &playlist { type: string, max_length: 256, required: true, label: Playlist, description: "The playlist's name." }
    send: '{"jsonrpc":"2.0","method":"get.object.playlist","params":{"name":{playlist:json}},"id":"playlist"}'
    expect: { reply_json: { "$.id": "playlist" }, json_path: "$.result" }
    returns: value
  playlist_next:
    summary: "Go to a playlist's next cue (doaction.playlist next)"
    params: { playlist: *playlist }
    send: '{"jsonrpc":"2.0","method":"doaction.playlist","params":{"name":{playlist:json},"action":"next"},"id":"next"}'
    expect: { reply_json: { "$.id": "next" }, json_equals: { "$.result": true } }
    returns: ack
  playlist_previous:
    summary: "Go to a playlist's previous cue (doaction.playlist prev)"
    params: { playlist: *playlist }
    send: '{"jsonrpc":"2.0","method":"doaction.playlist","params":{"name":{playlist:json},"action":"prev"},"id":"prev"}'
    expect: { reply_json: { "$.id": "prev" }, json_equals: { "$.result": true } }
    returns: ack
  playlist_goto:
    summary: "Go to a cue of a playlist, by its number (doaction.playlist goto)"
    params:
      playlist: *playlist
      cue: &cue_number { type: int, min: 1, required: true, label: Cue, description: "The cue's number in the playlist, from 1." }
    send: '{"jsonrpc":"2.0","method":"doaction.playlist","params":{"name":{playlist:json},"action":"goto","cue":{cue}},"id":"goto"}'
    expect: { reply_json: { "$.id": "goto" }, json_equals: { "$.result": true } }
    returns: ack
  playlist_preload:
    summary: "Preload a cue of a playlist, by its number (doaction.playlist preload)"
    params: { playlist: *playlist, cue: *cue_number }
    send: '{"jsonrpc":"2.0","method":"doaction.playlist","params":{"name":{playlist:json},"action":"preload","cue":{cue}},"id":"preload"}'
    expect: { reply_json: { "$.id": "preload" }, json_equals: { "$.result": true } }
    returns: ack
  playlist_play:
    summary: "Play a playlist (doaction.playlist play)"
    params: { playlist: *playlist }
    send: '{"jsonrpc":"2.0","method":"doaction.playlist","params":{"name":{playlist:json},"action":"play"},"id":"play"}'
    expect: { reply_json: { "$.id": "play" }, json_equals: { "$.result": true } }
    returns: ack
  playlist_pause:
    summary: "Pause a playlist (doaction.playlist pause)"
    params: { playlist: *playlist }
    send: '{"jsonrpc":"2.0","method":"doaction.playlist","params":{"name":{playlist:json},"action":"pause"},"id":"pause"}'
    expect: { reply_json: { "$.id": "pause" }, json_equals: { "$.result": true } }
    returns: ack
  playlist_grand_master:
    summary: "Fade a playlist's grand master to a level (doaction.playlist grandMasterFader)"
    params:
      playlist: *playlist
      percent: &percent { type: int, min: 0, max: 100, required: true, label: Level, description: "The level in percent; 0 is black or mute." }
      duration_ms: &duration { type: int, min: 0, max: 600000, default: 0, label: Fade time, description: "The fade in milliseconds; 0 for at once." }
    send: '{"jsonrpc":"2.0","method":"doaction.playlist","params":{"name":{playlist:json},"action":"grandMasterFader","value":{percent},"duration":{duration_ms}},"id":"grand master"}'
    expect: { reply_json: { "$.id": "grand master" }, json_equals: { "$.result": true } }
    returns: ack
  playlist_audio_master:
    summary: "Fade a playlist's audio master to a level (doaction.playlist audioMaster)"
    params: { playlist: *playlist, percent: *percent, duration_ms: *duration }
    send: '{"jsonrpc":"2.0","method":"doaction.playlist","params":{"name":{playlist:json},"action":"audioMaster","value":{percent},"duration":{duration_ms}},"id":"audio master"}'
    expect: { reply_json: { "$.id": "audio master" }, json_equals: { "$.result": true } }
    returns: ack
  get_playlist_settings:
    summary: "Read a playlist's settings: autostart, step by step, timecode sync and source, faders (get.playlist.settings)"
    params: { playlist: *playlist }
    send: '{"jsonrpc":"2.0","method":"get.playlist.settings","params":{"playlistname":{playlist:json}},"id":"playlist settings"}'
    expect: { reply_json: { "$.id": "playlist settings" }, json_path: "$.result" }
    returns: value
  set_playlist_settings:
    summary: "Change a playlist's settings such as autoStart, stepByStepEnable, synchroToTimecode, freerunMode or the timecode ones (set.playlist.settings)"
    params:
      playlist: *playlist
      settings: { type: json, required: true, label: Settings, description: "An object of setting names and values as get.playlist.settings gives them, such as {\"autoStart\":true}." }
    send: '{"jsonrpc":"2.0","method":"set.playlist.settings","params":{"playlistname":{playlist:json},"settings":{settings}},"id":"set playlist settings"}'
    expect: { reply_json: { "$.id": "set playlist settings" }, json_path: "$.result" }
    returns: value
  rename_playlist:
    summary: "Rename a playlist (set.property.playlist name)"
    params:
      playlist: *playlist
      name: &new_name { type: string, max_length: 256, required: true, label: New name, description: "The new name, on one line." }
    send: '{"jsonrpc":"2.0","method":"set.property.playlist","params":{"name":{playlist:json},"property":"name","value":{name:json}},"id":"rename playlist"}'
    expect: { reply_json: { "$.id": "rename playlist" }, json_equals: { "$.result": true } }
    returns: ack
  new_playlist:
    summary: "Create a playlist at the end of the list (new.playlist)"
    params: { name: *new_name }
    send: '{"jsonrpc":"2.0","method":"new.playlist","params":{"name":{name:json}},"id":"new playlist"}'
    expect: { reply_json: { "$.id": "new playlist" }, json_path: "$.result" }
    returns: value
  delete_playlist:
    summary: "Delete a playlist (delete.playlist)"
    params: { playlist: *playlist }
    send: '{"jsonrpc":"2.0","method":"delete.playlist","params":{"name":{playlist:json}},"id":"delete playlist"}'
    expect: { reply_json: { "$.id": "delete playlist" }, json_equals: { "$.result": true } }
    returns: ack

  # ── Cues ────────────────────────────────────────────────────────────────
  list_cues:
    summary: "List a playlist's cues with their used layers, a page at a time (get.list.cues)"
    params:
      playlist: *playlist
      offset: { type: int, min: 0, default: 0, label: From, description: "The first cue to give, counted from 0." }
      limit: { type: int, min: 1, max: 1000, default: 200, label: Count, description: "At most this many cues." }
    send: '{"jsonrpc":"2.0","method":"get.list.cues","params":{"playlistname":{playlist:json},"offset":{offset},"limit":{limit}},"id":"cues"}'
    expect: { reply_json: { "$.id": "cues" }, json_path: "$.result" }
    returns: value
  get_cue_property:
    summary: "Read one property of a cue, by the cue's name (get.property.cue)"
    params:
      playlist: *playlist
      cue: &cue_name { type: string, max_length: 256, required: true, label: Cue, description: "The cue's name." }
      property: { type: enum, values: [enableLoop, loopItemUuid, name, tag, taskUuid, triggerMode, triggerParam, uiColor, uuid, objectType],
                  required: true, label: Property, description: "The property to read." }
    send: '{"jsonrpc":"2.0","method":"get.property.cue","params":{"playlistname":{playlist:json},"name":{cue:json},"property":"{property}"},"id":"cue property"}'
    expect: { reply_json: { "$.id": "cue property" }, json_path: "$.result" }
    returns: value
  set_cue_settings:
    summary: "Change a cue's settings: name, color, trigger, followLayer, triggerTime, tag, task, loopTo, enableLoop (set.cue.settings)"
    params:
      playlist: *playlist
      cue: &cue_index { type: int, min: 1, required: true, label: Cue, description: "The cue's number in the playlist, from 1." }
      settings: { type: json, required: true, label: Settings, description: "An object of settings as the manual lists them, such as {\"trigger\":\"wait\",\"triggerTime\":1500}." }
    send: '{"jsonrpc":"2.0","method":"set.cue.settings","params":{"playlistname":{playlist:json},"cueindex":{cue},"settings":{settings}},"id":"cue settings"}'
    expect: { reply_json: { "$.id": "cue settings" }, json_path: "$.result" }
    returns: value
  set_cue_trigger:
    summary: "Set how a cue starts: on go, following the cue before, after a wait, or at a timecode (set.cue.settings)"
    params:
      playlist: *playlist
      cue: *cue_index
