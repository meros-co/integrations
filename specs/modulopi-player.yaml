    summary: "List the renders (get.list.renders)"
    send: '{"jsonrpc":"2.0","method":"get.list.renders","id":"renders"}'
    expect: { reply_json: { "$.id": "renders" }, json_path: "$.result" }
    returns: value
  mixer_destination_active:
    summary: "Make a destination active or not (mixer.destination.active)"
    params:
      destination: { type: string, max_length: 256, required: true, label: Destination, description: "The destination's name, any case." }
      active: { type: bool, required: true, label: Active, description: "Active, or not." }
    send: '{"jsonrpc":"2.0","method":"mixer.destination.active","params":{"name":{destination:json},"active":{active}},"id":"destination active"}'
    expect: { reply_json: { "$.id": "destination active" }, json_equals: { "$.result.ok": true } }
    returns: ack
  mixer_destination_all:
    summary: "Make every destination active or not (mixer.destination.all)"
    params:
      active: { type: bool, required: true, label: Active, description: "Active, or not." }
    send: '{"jsonrpc":"2.0","method":"mixer.destination.all","params":{"active":{active}},"id":"destinations all"}'
    expect: { reply_json: { "$.id": "destinations all" }, json_equals: { "$.result.ok": true } }
    returns: ack
  mixer_set_property:
    summary: "Set a property of a destination, mix engine, layer, source, render, preset or quickset (mixer.set.property)"
    params:
      kind: { type: enum, values: [destination, mixEngine, layer, source, render, preset, quickset], required: true, label: Kind, description: "The kind of object." }
      uuid: *uuid
      property: { type: string, pattern: '^[A-Za-z]+$', max_length: 64, required: true, label: Property, description: "The property, as the Destinations & Layers page names it, such as opacity or programLocked." }
      value: { type: json, required: true, label: Value, description: "The value in the property's type: a number, true or false, text, a color or an [x, y] array." }
    send: '{"jsonrpc":"2.0","method":"mixer.set.property","params":{"kind":"{kind}","uuid":"{uuid}","property":"{property}","value":{value}},"id":"mixer property"}'
    expect: { reply_json: { "$.id": "mixer property" }, json_equals: { "$.result.ok": true } }
    returns: ack
  list_mixer_presets:
    summary: "List the Live Mixer's presets (get.list.presets)"
    send: '{"jsonrpc":"2.0","method":"get.list.presets","id":"presets"}'
    expect: { reply_json: { "$.id": "presets" }, json_path: "$.result" }
    returns: value
  mixer_preset_recall:
    summary: "Recall a preset to the preview or the program (mixer.preset.recall)"
    params:
      preset: &preset { type: string, max_length: 256, required: true, label: Preset, description: "The preset's name, any case." }
      target: { type: enum, values: [preview, program], default: preview, label: Target, description: "preview or program." }
    send: '{"jsonrpc":"2.0","method":"mixer.preset.recall","params":{"name":{preset:json},"target":"{target}"},"id":"preset recall"}'
    expect: { reply_json: { "$.id": "preset recall" }, json_equals: { "$.result.ok": true } }
    returns: ack
  mixer_preset_save:
    summary: "Save the program or the preview into a preset (mixer.preset.save)"
    params:
      preset: *preset
      from: &from { type: enum, values: [program, preview], required: true, label: From, description: "Save the program or the preview." }
    send: '{"jsonrpc":"2.0","method":"mixer.preset.save","params":{"name":{preset:json},"from":"{from}"},"id":"preset save"}'
    expect: { reply_json: { "$.id": "preset save" }, json_equals: { "$.result.ok": true } }
    returns: ack
  mixer_preset_add:
    summary: "Add a preset from the program or the preview; answers its uuid (mixer.preset.add)"
    params: { from: *from }
    send: '{"jsonrpc":"2.0","method":"mixer.preset.add","params":{"from":"{from}"},"id":"preset add"}'
    expect: { reply_json: { "$.id": "preset add" }, json_path: "$.result" }
    returns: value
  mixer_preset_delete:
    summary: "Delete a preset (mixer.preset.delete)"
    params: { preset: *preset }
    send: '{"jsonrpc":"2.0","method":"mixer.preset.delete","params":{"name":{preset:json}},"id":"preset delete"}'
    expect: { reply_json: { "$.id": "preset delete" }, json_equals: { "$.result.ok": true } }
    returns: ack
  mixer_show_save:
    summary: "Save the show from the Live Mixer (mixer.show.save)"
    send: '{"jsonrpc":"2.0","method":"mixer.show.save","id":"mixer save"}'
    expect: { reply_json: { "$.id": "mixer save" }, json_equals: { "$.result.ok": true } }
    returns: ack

quirks:
  - models: [all]
    severity: warning
    text: >
      Player accepts websocket connections only once a show is loaded. After event.show.loaded (a show
      loaded, created or restored) every earlier uuid is void: the lists are read again at once.
  - models: [all]
    severity: info
    text: >
      Playlists, cues and other objects are addressed here by name or number, as the manual's examples do;
      call, get_object and set_properties take uuids for everything else. A reply with an error object
      (-32602 for a bad parameter or no show, -32000 for an action refused, -32001 while the Live Mixer is
      not ready) fails the command. The manual marks these pages as under maintenance.
  - models: [all]
    severity: info
    text: >
      Player sends mixer.state only to a client that has used a Live Mixer method; get.state is polled
      every 10 s, which starts it, and the pushes keep the mixer's state current between polls. The
      playlists are polled every 500 ms, the status every 2 s, the tasks, presets and sources every 10 s,
      and the media and outputs every 30 s.
  - models: [all]
    severity: critical
    text: >
      load_show, new_show, restore_show, playlist_goto, playlist_play, mixer_take, mixer_cut, the faders and
      the delete commands change what is on air at once; delete_output asks for no confirmation.

state:
  player.version: { type: string, description: "Modulo Player's version" }
  player.api_version: { type: int, description: "The API's version" }
  player.show: { type: string, description: "The loaded show's file name; empty when none" }
  player.document_state: { type: int, description: "0 no show, 1 preparing, 2 ready" }
  player.display_frequency: { type: float, unit: Hz, description: "The display frequency" }
  player.max_outputs: { type: int, description: "The outputs the licence allows" }
  player.playlist_count: { type: int, description: "The number of playlists" }
  player.master: { type: bool, description: "This server is the master" }
  player.media_to_cache: { type: int, description: "Media waiting to be cached" }
  player.media_caching: { type: int, description: "Media being cached" }
  player.clients: { type: int, description: "Connected clients" }
  playlists.*.name: { type: string, description: "Each playlist's name, keyed by uuid" }
  playlists.*.index: { type: int, description: "The cue on air, numbered as in the cue list; 0 before the first" }
  playlists.*.playing: { type: bool, description: "The playlist is playing (play)" }
  playlists.*.current_cue: { type: string, description: "The uuid of the cue on air" }
  playlists.*.current_cue_name: { type: string, description: "The name of the cue on air" }
  playlists.*.preload_cue: { type: string, description: "The uuid of the preloaded cue" }
  playlists.*.timecode: { type: int, unit: ms, description: "The playlist's timecode" }
  playlists.*.grand_master: { type: float, description: "The grand master, 0 to 1" }
  playlists.*.audio_master: { type: float, description: "The audio master, 0 to 1" }
  playlists.*.cue_count: { type: int, description: "The number of cues" }
  playlists.*.step_by_step: { type: bool, description: "Step by step is on" }
  playlists.*.synchro_to_timecode: { type: bool, description: "The playlist follows timecode" }
  playlists.*.timecode_locked: { type: bool, description: "The timecode is locked" }
  playlists.*.color: { type: string, description: "The playlist's interface color" }
  tasks.*.name: { type: string, description: "Each task's name, keyed by uuid" }
  tasks.*.index: { type: int, description: "The task's number, from 1" }
  tasks.*.keyword: { type: string, description: "The task's keyword" }
  tasks.*.enabled: { type: bool, description: "The task is enabled" }
  tasks.*.trigger_enabled: { type: bool, description: "The task's trigger is enabled" }
  tasks.*.triggered: { type: bool, description: "The task is triggered" }
  media.*.name: { type: string, description: "Each media's name, keyed by uuid" }
  media.*.type: { type: string, description: "The media's type" }
  media.*.state: { type: int, description: "0 not analysed, 2 ready, 3 missing, 4 error" }
  media.*.duration: { type: float, description: "The media's duration, as Player gives it" }
  media.*.width: { type: int, unit: px, description: "The media's width" }
  media.*.height: { type: int, unit: px, description: "The media's height" }
  outputs.*.name: { type: string, description: "Each output's name, keyed by uuid" }
  outputs.*.index: { type: int, description: "The output's number, from 1" }
  outputs.*.type: { type: string, description: "standard or ledMapping" }
  mixer.ready: { type: bool, description: "The Live Mixer is ready" }
  mixer.work_on_preview: { type: bool, description: "Sources and presets go to the preview" }
  mixer.relative_mode: { type: bool, description: "Relative mode is on" }
  mixer.take_duration: { type: int, unit: ms, description: "The take duration" }
  mixer.current_layout: { type: int, description: "The layout in use, from 1" }
  mixer.transition_active: { type: bool, description: "A manual transition is running" }
  mixer.transition_position: { type: float, description: "The manual transition's position, 0 to 1" }
  mixer.last_preset: { type: string, description: "The uuid of the last preset recalled, or empty" }
  mixer.destinations.*.active: { type: bool, description: "The destination is active, keyed by uuid" }
  mixer.destinations.*.program_locked: { type: bool, description: "The destination's program is locked" }
  mixer.destinations.*.take_in_progress: { type: bool, description: "A take is in progress" }
  mixer.destinations.*.freeze: { type: bool, description: "The destination is frozen" }
  mixer.tally.*.program: { type: bool, description: "The source is on the program, keyed by source uuid" }
  mixer.tally.*.preview: { type: bool, description: "The source is on the preview" }
  mixer.tally.*.freeze: { type: bool, description: "The source is frozen" }
  mixer.presets.*.name: { type: string, description: "Each preset's name, keyed by uuid" }
  mixer.presets.*.index: { type: int, description: "The preset's number, from 1" }
  mixer.presets.*.locked: { type: bool, description: "The preset is locked" }
  mixer.sources.*.name: { type: string, description: "Each source's name, keyed by uuid" }
  mixer.sources.*.index: { type: int, description: "The source's number, from 1" }

telemetry:
  poll:
    - every_ms: 500
      send: ['{"jsonrpc":"2.0","method":"get.list.playlists","params":{"level":"playlist"},"id":"poll playlists"}']
    - every_ms: 2000
      send: ['{"jsonrpc":"2.0","method":"get.status.player","id":"poll status"}']
    - every_ms: 10000
      send:
        - '{"jsonrpc":"2.0","method":"get.list.tasks","id":"poll tasks"}'
        - '{"jsonrpc":"2.0","method":"get.state","id":"poll mixer"}'
        - '{"jsonrpc":"2.0","method":"get.list.presets","id":"poll presets"}'
        - '{"jsonrpc":"2.0","method":"get.list.sources","id":"poll sources"}'
    - every_ms: 30000
      send:
        - '{"jsonrpc":"2.0","method":"get.list.media","id":"poll media"}'
        - '{"jsonrpc":"2.0","method":"get.list.outputs","id":"poll outputs"}'
  updates:
    - json_match: { "$.method": "^event\\.show\\.loaded$" }
      json: { name: "$.params.name" }
      state: { player.show: "{name}" }
      then_send:
        - '{"jsonrpc":"2.0","method":"get.list.playlists","params":{"level":"playlist"},"id":"poll playlists"}'
        - '{"jsonrpc":"2.0","method":"get.list.tasks","id":"poll tasks"}'
        - '{"jsonrpc":"2.0","method":"get.list.media","id":"poll media"}'
        - '{"jsonrpc":"2.0","method":"get.list.outputs","id":"poll outputs"}'
        - '{"jsonrpc":"2.0","method":"get.state","id":"poll mixer"}'
    - json_match: { "$.id": "^(poll )?status$" }
      json: { version: "$.result.version", api: "$.result.apiVersion", show: "$.result.showName", doc: "$.result.documentState",
              freq: "$.result.displayFrequency", outputs: "$.result.maxOutputs", playlists: "$.result.playlistCount",
              master: "$.result.master", to_cache: "$.result.mediaToCache", caching: "$.result.mediaCaching",
              clients: "$.result.clientConnected" }
      state:
        player.version: "{version}"
        player.api_version: "{api}"
        player.show: "{show}"
        player.document_state: "{doc}"
        player.display_frequency: "{freq}"
        player.max_outputs: "{outputs}"
        player.playlist_count: "{playlists}"
        player.master: "{master}"
        player.media_to_cache: "{to_cache}"
        player.media_caching: "{caching}"
        player.clients: "{clients}"
    - json_match: { "$.id": "^(poll playlists|playlists playlist)$" }
      json_each: "$.result"
      json: { uuid: "$.uuid", name: "$.name", index: "$.index", play: "$.play", cue: "$.currentCueUuid", cue_name: "$.currentcuename",
              preload: "$.preloadCueUuid", tc: "$.timecode", gm: "$.grandMasterFader", am: "$.audioMaster", count: "$.cueCount",
              step: "$.stepByStepEnable", sync: "$.synchroToTimecode", locked: "$.timecodeLocked", color: "$.uiColor" }
      replace: playlists
      state:
        "playlists.{uuid:key}.name": "{name}"
        "playlists.{uuid:key}.index": "{index}"
        "playlists.{uuid:key}.playing": "{play}"
        "playlists.{uuid:key}.current_cue": "{cue}"
        "playlists.{uuid:key}.current_cue_name": "{cue_name}"
        "playlists.{uuid:key}.preload_cue": "{preload}"
        "playlists.{uuid:key}.timecode": "{tc}"
        "playlists.{uuid:key}.grand_master": "{gm}"
        "playlists.{uuid:key}.audio_master": "{am}"
        "playlists.{uuid:key}.cue_count": "{count}"
        "playlists.{uuid:key}.step_by_step": "{step}"
        "playlists.{uuid:key}.synchro_to_timecode": "{sync}"
        "playlists.{uuid:key}.timecode_locked": "{locked}"
        "playlists.{uuid:key}.color": "{color}"
    - json_match: { "$.id": "^(poll )?tasks$" }
      json_each: "$.result"
      json: { uuid: "$.uuid", name: "$.name", index: "$.index", keyword: "$.keyword", enabled: "$.taskEnable",
              trigger: "$.triggerEnable", triggered: "$.triggered" }
      replace: tasks
      state:
        "tasks.{uuid:key}.name": "{name}"
        "tasks.{uuid:key}.index": "{index}"
        "tasks.{uuid:key}.keyword": "{keyword}"
        "tasks.{uuid:key}.enabled": "{enabled}"
        "tasks.{uuid:key}.trigger_enabled": "{trigger}"
        "tasks.{uuid:key}.triggered": "{triggered}"
    - json_match: { "$.id": "^(poll )?media$" }
      json_each: "$.result"
      json: { uuid: "$.uuid", name: "$.name", type: "$.type", state: "$.mediaState", duration: "$.duration", width: "$.width",
              height: "$.height" }
      replace: media
      state:
        "media.{uuid:key}.name": "{name}"
        "media.{uuid:key}.type": "{type}"
        "media.{uuid:key}.state": "{state}"
        "media.{uuid:key}.duration": "{duration}"
        "media.{uuid:key}.width": "{width}"
        "media.{uuid:key}.height": "{height}"
    - json_match: { "$.id": "^(poll )?outputs$" }
      json_each: "$.result.outputs"
      json: { uuid: "$.uuid", name: "$.name", index: "$.index", type: "$.type" }
      replace: outputs
      state:
        "outputs.{uuid:key}.name": "{name}"
        "outputs.{uuid:key}.index": "{index}"
        "outputs.{uuid:key}.type": "{type}"
    # The mixer's state: a get.state reply's result, or a mixer.state push's params.
    - json_match: { "$.id": "^(poll mixer|mixer state)$" }
      json: { ready: "$.result.ready", wop: "$.result.workOnPreview", rel: "$.result.relativeMode",
                          take: "$.result.takeDuration", layout: "$.result.currentLayout", ta: "$.result.transition.active",
                          tp: "$.result.transition.position", preset: "$.result.lastPreset" }
      state: &mixer_state
        mixer.ready: "{ready}"
        mixer.work_on_preview: "{wop}"
        mixer.relative_mode: "{rel}"
        mixer.take_duration: "{take}"
        mixer.current_layout: "{layout}"
        mixer.transition_active: "{ta}"
        mixer.transition_position: "{tp}"
        mixer.last_preset: "{preset}"
    - json_match: { "$.method": "^mixer\\.state$" }
      json: { ready: "$.params.ready", wop: "$.params.workOnPreview", rel: "$.params.relativeMode",
              take: "$.params.takeDuration", layout: "$.params.currentLayout", ta: "$.params.transition.active",
              tp: "$.params.transition.position", preset: "$.params.lastPreset" }
      state: *mixer_state
    - json_match: { "$.id": "^(poll mixer|mixer state)$" }
      json_each: "$.result.destinations"
      json: &dest_json { uuid: "$.uuid", active: "$.active", locked: "$.programLocked", take: "$.takeInProgress", freeze: "$.freeze" }
      replace: mixer.destinations
      state: &dest_state
        "mixer.destinations.{uuid:key}.active": "{active}"
        "mixer.destinations.{uuid:key}.program_locked": "{locked}"
        "mixer.destinations.{uuid:key}.take_in_progress": "{take}"
        "mixer.destinations.{uuid:key}.freeze": "{freeze}"
    - json_match: { "$.method": "^mixer\\.state$" }
      json_each: "$.params.destinations"
      json: *dest_json
      replace: mixer.destinations
      state: *dest_state
    - json_match: { "$.id": "^(poll mixer|mixer state)$" }
      json_each: "$.result.tally"
      json: &tally_json { uuid: "$.uuid", program: "$.program", preview: "$.preview", freeze: "$.freeze" }
      replace: mixer.tally
      state: &tally_state
        "mixer.tally.{uuid:key}.program": "{program}"
        "mixer.tally.{uuid:key}.preview": "{preview}"
        "mixer.tally.{uuid:key}.freeze": "{freeze}"
    - json_match: { "$.method": "^mixer\\.state$" }
      json_each: "$.params.tally"
      json: *tally_json
      replace: mixer.tally
      state: *tally_state
    - json_match: { "$.id": "^(poll )?presets$" }
      json_each: "$.result"
      json: { uuid: "$.uuid", name: "$.name", index: "$.index", locked: "$.locked" }
      replace: mixer.presets
      state:
        "mixer.presets.{uuid:key}.name": "{name}"
        "mixer.presets.{uuid:key}.index": "{index}"
        "mixer.presets.{uuid:key}.locked": "{locked}"
    - json_match: { "$.id": "^(poll )?sources$" }
      json_each: "$.result"
      json: { uuid: "$.uuid", name: "$.name", index: "$.index" }
      replace: mixer.sources
      state:
        "mixer.sources.{uuid:key}.name": "{name}"
        "mixer.sources.{uuid:key}.index": "{index}"
