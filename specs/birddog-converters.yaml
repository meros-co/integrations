  device.serial:               {type: string, description: Serial number}
  device.status:               {type: string, description: 'Unit status, e.g. ONLINE, OFFLINE, NO VIDEO'}
  decoder.source:              {type: string, description: NDI source being decoded on channel 1; None when none}
  decoder.resolution:          {type: string, description: 'Decoded video resolution, e.g. 1920x1080'}
  decoder.frame_rate:          {type: string, description: 'Decoded frame rate, e.g. 59.94p'}
  decoder.sampling:            {type: string, description: 'Decoded chroma sampling, e.g. 4:2:2'}
  decoder.audio_channels:      {type: int, description: Decoded audio channels}
  decoder.audio_sample_rate:   {type: int, description: 'Decoded audio sample rate, Hz'}
  decoder.bitrate:             {type: string, description: 'Average decoded bitrate, as the unit reports it'}
  decoder.audio:               {type: string, description: 'Decoder audio: NDIAudioEn or NDIAudioDis'}
  decoder.screensaver:         {type: string, description: 'Decoder screensaver: BirdDogSS, BlackSS or CaptureSS'}
  decoder.tally_mode:          {type: string, description: Decoder tally mode}
  decoder.color_space:         {type: string, description: 'Decoder output colour space: RGB or YUV'}
  decoder.receive_method:      {type: string, description: NDI receive method}
  encoder.video_format:        {type: string, description: Encoder input video format}
  encoder.stream_name:         {type: string, description: NDI stream name}
  encoder.ndi_audio:           {type: string, description: Audio in the NDI stream}
  encoder.screensaver:         {type: string, description: Encoder screensaver}
  encoder.bandwidth_mode:      {type: string, description: NDIManaged or Manual}
  encoder.bandwidth:           {type: int, description: 'Manual NDI bandwidth, Mbps'}
  encoder.tally_mode:          {type: string, description: Encoder tally mode}
  encoder.loop_tally:          {type: bool, description: Tally shown on the loop output}
  encoder.video_csc:           {type: string, description: Encoder colour space conversion}
  encoder.sample_rate:         {type: string, description: 'Encoder chroma sampling: 420 or 422'}
  encoder.bit_depth:           {type: string, description: 'Encoder bit depth, e.g. 8Bit'}
  encoder.ndi_group:           {type: bool, description: Published in a named NDI group}
  encoder.ndi_group_name:      {type: string, description: NDI group name}
  encoder.transmit_method:     {type: string, description: NDI transmit method}
  encoder.multicast_prefix:    {type: string, description: Multicast address prefix}
  encoder.multicast_netmask:   {type: string, description: Multicast netmask}
  encoder.multicast_ttl:       {type: int, description: Multicast time-to-live}
  audio.in_gain:               {type: int, description: 'Analog audio input gain, 0-100'}
  audio.out_gain:              {type: int, description: 'Analog audio output gain, 0-100'}
