commands:
  get_about:
    summary: Firmware, stream name (Format), host name, address, serial and status (GET /about)
    send: {method: GET, path: /about}
    expect: {status: 200, json_path: $}
    returns: value
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, Basic Device Information, /about
    # (all converter columns)

  get_hostname:
    summary: Host name, plain text (GET /hostname)
    send: {method: GET, path: /hostname}
    expect: {status: 200, matches: ^(.+)$}
    returns: value
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, Basic Device Information, /hostname

  get_version:
    summary: Model and hardware version, plain text, e.g. BirdDog P200A4_A5 (GET /version)
    send: {method: GET, path: /version}
    expect: {status: 200, matches: ^(.+)$}
    returns: value
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, Basic Device Information, /version

  reboot:
    summary: Reboot the unit; its NDI output or decoded picture stops until it is back (POST /reboot)
    send: {method: POST, path: /reboot}
    expect: {status: 200}
    returns: ack
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, Basic Device Information, /reboot

  restart_video:
    summary: Restart the video subsystem; the picture drops briefly (POST /restart)
    send: {method: POST, path: /restart}
    expect: {status: 200}
    returns: ack
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, Basic Device Information, /restart

  get_operation_mode:
    summary: Operation mode, encode or decode, plain text (GET /operationmode)
    send: {method: GET, path: /operationmode}
    expect: {status: 200, matches: ^(encode|decode)}
    returns: value
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, DEVICE SETTINGS, /operationmode

  set_operation_mode:
    summary: Switch the unit between NDI encoding and decoding; plain-text body (POST /operationmode)
    params:
      mode: {type: enum, values: [encode, decode], required: true, label: Operation mode, description: encode turns the baseband input into an NDI source; decode outputs an NDI source on the baseband outputs.}
    send: {method: POST, path: /operationmode, body: '{mode}', content_type: text/plain}
    expect: {status: 200, not_contains: Invalid}
    returns: ack
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, DEVICE SETTINGS, /operationmode
    # (Studio, Mini, 4KHDMI/SDI, QUAD: encode, decode)

  get_video_output:
    summary: Baseband output interface, sdi or hdmi, plain text (GET /videooutputinterface)
    send: {method: GET, path: /videooutputinterface}
    expect: {status: 200, matches: ^(\S+)}
    returns: value
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, DEVICE SETTINGS,
    # /videooutputinterface (4KHDMI/SDI: sdi, hdmi)

  set_video_output:
    summary: Choose the SDI or HDMI baseband output; plain-text body (POST /videooutputinterface)
    params:
      output: {type: enum, values: [sdi, hdmi], required: true, label: Output, description: Which baseband connector carries the output.}
    send: {method: POST, path: /videooutputinterface, body: '{output}', content_type: text/plain}
    expect: {status: 200, not_contains: Invalid}
    returns: ack
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, DEVICE SETTINGS,
    # /videooutputinterface (4KHDMI/SDI: sdi, hdmi)

  get_analog_audio:
    summary: Analog audio gains and output source (GET /analogaudiosetup)
    send: {method: GET, path: /analogaudiosetup}
    expect: {status: 200, json_path: $}
    returns: value
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, DEVICE SETTINGS, /analogaudiosetup

  set_audio_in_gain:
    summary: Analog audio input gain, 0-100 (POST /analogaudiosetup)
    params:
      gain: {type: int, min: 0, max: 100, required: true, label: Input gain, description: 'Analog (3.5 mm) audio input gain, 0 to 100.'}
    send:
      method: POST
      path: /analogaudiosetup
      body: '{"AnalogAudioInGain":"{gain}"}'
      content_type: application/json
    expect: {status: 200, not_contains: Invalid}
    returns: ack
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, DEVICE SETTINGS, /analogaudiosetup,
    # AnalogAudioInGain Range 0 to 100

  set_audio_out_gain:
    summary: Analog audio output gain, 0-100 (POST /analogaudiosetup)
    params:
      gain: {type: int, min: 0, max: 100, required: true, label: Output gain, description: 'Analog (3.5 mm) audio output gain, 0 to 100.'}
    send:
      method: POST
      path: /analogaudiosetup
      body: '{"AnalogAudioOutGain":"{gain}"}'
      content_type: application/json
    expect: {status: 200, not_contains: Invalid}
    returns: ack
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, DEVICE SETTINGS, /analogaudiosetup,
    # AnalogAudioOutGain Range 0 to 100

  set_audio_output_select:
    summary: 'What the analog audio output carries: the decoded NDI audio or Comms (POST /analogaudiosetup)'
    params:
      source: {type: enum, values: [DecodeMain, DecodeComms], required: true, label: Audio output, description: DecodeMain plays the decoded NDI audio; DecodeComms plays the Comms audio.}
    send:
      method: POST
      path: /analogaudiosetup
      body: '{"AnalogAudiooutputselect":"{source}"}'
      content_type: application/json
    expect: {status: 200, not_contains: Invalid}
    returns: ack
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, DEVICE SETTINGS, /analogaudiosetup,
    # AnalogAudiooutputselect DecodeMain, DecodeComms

  get_encode_setup:
    summary: Encoder settings of a channel (GET /encodesetup?ChNum=)
    params:
      channel: {type: int, min: 1, max: 4, default: 1, label: Channel, description: 'Channel on a multi-channel unit (4K QUAD, dual-channel 4K HDMI/SDI), 1 to 4; 1 on single-channel units.'}
    send: {method: GET, path: /encodesetup, raw_query: 'ChNum={channel}'}
    expect: {status: 200, json_path: $}
    returns: value
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, NDI ENCODE, /encodesetup

  set_stream_name:
    summary: NDI stream name (POST /encodesetup)
    params:
      channel: {type: int, min: 1, max: 4, default: 1, label: Channel, description: 'Channel on a multi-channel unit (4K QUAD, dual-channel 4K HDMI/SDI), 1 to 4; 1 on single-channel units.'}
      name: {type: string, max_length: 64, required: true, label: Stream name, description: 'The stream part of the NDI source name, as in BIRDDOG-12345 (CAM).'}
    send:
      method: POST
      path: /encodesetup
      body: '{"ChNum":"{channel}","StreamName":{name:json}}'
      content_type: application/json
    expect: {status: 200, not_contains: Invalid}
    returns: ack
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, NDI ENCODE, /encodesetup, StreamName
    # (WP Encode N/A)

  set_video_format:
    summary: Encoder input video format, as the unit names it (POST /encodesetup)
    params:
      channel: {type: int, min: 1, max: 4, default: 1, label: Channel, description: 'Channel on a multi-channel unit (4K QUAD, dual-channel 4K HDMI/SDI), 1 to 4; 1 on single-channel units.'}
      format: {type: string, max_length: 32, required: true, label: Video format, description: Input video format in the unit's own words (the document does not list them); read it back with get_encode_setup.}
    send:
      method: POST
      path: /encodesetup
      body: '{"ChNum":"{channel}","VideoFormat":{format:json}}'
      content_type: application/json
    expect: {status: 200, not_contains: Invalid}
    returns: ack
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, NDI ENCODE, /encodesetup,
    # VideoFormat (values not listed)

  set_ndi_audio:
    summary: Audio carried in the NDI stream (POST /encodesetup)
    params:
      channel: {type: int, min: 1, max: 4, default: 1, label: Channel, description: 'Channel on a multi-channel unit (4K QUAD, dual-channel 4K HDMI/SDI), 1 to 4; 1 on single-channel units.'}
      source: {type: enum, values: [NDIAudioMain, NDIAudioAnalog, NDIAudioMute], required: true, label: NDI audio, description: 'Embedded audio (NDIAudioMain), the analog input (NDIAudioAnalog), or none (NDIAudioMute, Flex and Wallplate).'}
    send:
      method: POST
      path: /encodesetup
      body: '{"ChNum":"{channel}","NDIAudio":"{source}"}'
      content_type: application/json
