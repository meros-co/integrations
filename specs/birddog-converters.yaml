    summary: NDI groups the finder subscribes to, comma separated; plain-text body (POST /NDIGrpName)
    params:
      groups: {type: string, max_length: 256, required: true, label: NDI groups, description: 'NDI groups the finder subscribes to, separated by commas.'}
    send: {method: POST, path: /NDIGrpName, body: '{groups}', content_type: text/plain}
    expect: {status: 200, not_contains: Invalid}
    returns: ack
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, NDI FINDER, /NDIGrpName

  get_ndi_off_subnet:
    summary: Off-subnet NDI source address the finder also looks at, plain text (GET /NDIOffSnSrc)
    send: {method: GET, path: /NDIOffSnSrc}
    expect: {status: 200, matches: ^(.*)$}
    returns: value
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, NDI FINDER, /NDIOffSnSrc

  set_ndi_off_subnet:
    summary: Off-subnet NDI source address; plain-text body (POST /NDIOffSnSrc)
    params:
      address: {type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$', required: true, label: Off-subnet address, description: IPv4 address of an NDI source on another subnet.}
    send: {method: POST, path: /NDIOffSnSrc, body: '{address}', content_type: text/plain}
    expect: {status: 200, not_contains: Invalid}
    returns: ack
    # BirdDog RESTful API 2.0 (P-Series & Converters), version 2.0.0, NDI FINDER, /NDIOffSnSrc

telemetry:
  poll:
    every_ms: 5000
    send:
    - method: GET
      path: /about
    - method: GET
      path: /connectTo
      raw_query: ChNum=1
  updates:
    - path: ^/about$
      json:
        fw: $.FirmwareVersion
        format: $.Format
        host: $.HostName
        ip: $.IPAddress
        mask: $.NetworkMask
        method: $.NetworkConfigMethod
        serial: $.SerialNumber
        status: $.Status
      state:
        device.firmware: '{fw}'
        device.format: '{format}'
        device.hostname: '{host}'
        device.ip_address: '{ip}'
        device.netmask: '{mask}'
        device.network_method: '{method}'
        device.serial: '{serial}'
        device.status: '{status}'
    - path: ^/connectTo\?ChNum=1$
      json:
        source: $.sourceName
      state:
        decoder.source: '{source}'
    - path: ^/decodestatus\?ChNum=1$
      json:
        res: $.Videoresolution
        fr: $.VideoFramerate
        sr: $.VideoSamplerate
        ach: $.Audiochannels
        asr: $.AudioSamplerate
        br: $.AverageBitrate
      state:
        decoder.resolution: '{res}'
        decoder.frame_rate: '{fr}'
        decoder.sampling: '{sr}'
        decoder.audio_channels: '{ach}'
        decoder.audio_sample_rate: '{asr}'
        decoder.bitrate: '{br}'
    - path: ^/decodesetup\?ChNum=1$
      json:
        audio: $.NDIAudio
        ss: $.ScreenSaverMode
        tally: $.TallyMode
        cs: $.ColorSpace
      state:
        decoder.audio: '{audio}'
        decoder.screensaver: '{ss}'
        decoder.tally_mode: '{tally}'
        decoder.color_space: '{cs}'
    - path: ^/decodeTransport$
      json:
        rx: $.rxpm
      state:
        decoder.receive_method: '{rx}'
    - path: ^/encodesetup\?ChNum=1$
      json:
        vf: $.VideoFormat
        name: $.StreamName
        audio: $.NDIAudio
        ss: $.ScreenSaverMode
        bwm: $.BandwidthMode
        bw: $.BandwidthSelect
        tally: $.TallyMode
        loop: $.LoopTally
        csc: $.VideoCSC
        sr: $.VideoSampleRate
        depth: $.ColorBitDepth
        grp: $.NDIGroup
        grpname: $.NDIGroupName
      state:
        encoder.video_format: '{vf}'
        encoder.stream_name: '{name}'
        encoder.ndi_audio: '{audio}'
        encoder.screensaver: '{ss}'
        encoder.bandwidth_mode: '{bwm}'
        encoder.bandwidth: '{bw}'
        encoder.tally_mode: '{tally}'
        encoder.loop_tally: {value: '{loop}', map: {LoopTallyEn: true, LoopTallyDis: false}}
        encoder.video_csc: '{csc}'
        encoder.sample_rate: '{sr}'
        encoder.bit_depth: '{depth}'
        encoder.ndi_group: {value: '{grp}', map: {NDIGroupEn: true, NDIGroupDis: false}}
        encoder.ndi_group_name: '{grpname}'
    - path: ^/encodeTransport$
      json:
        pm: $.Txpm
        prefix: $.Txnetprefix
        mask: $.Txnetmask
        ttl: $.Txmcttl
      state:
        encoder.transmit_method: '{pm}'
        encoder.multicast_prefix: '{prefix}'
        encoder.multicast_netmask: '{mask}'
        encoder.multicast_ttl: '{ttl}'
    - path: ^/analogaudiosetup$
      json:
        in: $.AnalogAudioInGain
        out: $.AnalogAudioOutGain
        sel: $.AnalogAudiooutputselect
      state:
        audio.in_gain: '{in}'
        audio.out_gain: '{out}'
        audio.output_select: '{sel}'
    - path: ^/NDIDisServer$
      json:
        en: $.NDIDisServ
        ip: $.NDIDisServIP
      state:
        finder.discovery_server: {value: '{en}', map: {NDIDisServEn: true, NDIDisServDis: false}}
        finder.discovery_server_ip: '{ip}'

state:
  device.firmware:             {type: string, description: Firmware version}
  device.format:               {type: string, description: 'Format field of /about; the Companion module reads the converter model from it (Studio, Mini, Flex Encode, 4KHDMI/SDI, QUAD, PLAY ...)'}
