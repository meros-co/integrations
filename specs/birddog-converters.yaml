spec: 1
id: birddog-converters
name: BirdDog converters and decoders
vendor: BirdDog
category: other

source:
  - title: BirdDog RESTful API 2.0, API and SDK Documentation (P-Series & Converters), version 2.0.0
    author: BirdDog
    url: https://birddog.tv/AV/API/index.html
    note: >
      Manufacturer-documented, and the source of every endpoint here. One HTML page with a
      DEVICE SUPPORT table per method whose converter columns are Studio, Mini, Flex
      Encode, Flex Decode, WP Encode, WP Decode, 4KHDMI/SDI, QUAD and PLAY; each model's
      supports list follows those cells. Sections Basic Device Information (/about,
      /hostname, /version, /reboot, /restart), DEVICE SETTINGS (/operationmode,
      /videooutputinterface, /analogaudiosetup), NDI ENCODE (/encodesetup with per-column
      values, /encodeTransport, /capture), NDI DECODE (/connectTo, /decodestatus,
      /decodesetup, /decodeTransport, /capture) and NDI FINDER (/List, /refresh, /reset,
      /NDIDisServer, /NDIGrpName, /NDIOffSnSrc). The PTZ and image tables have no
      converter cells, so no PTZ or picture commands are offered. Port 8080, no
      authentication.
  - title: BirdDog Pod User Guide 2026
    author: BirdDog
    url: https://birddog.tv/wp-content/uploads/2026/09/POD-User-Guide-Manual.pdf
    note: >
      p.9 Controlling Sources via API: POST :8080/connectTo with
      {"sourceName":"BIRDDOG-0B710 (CAM)"}, the body connect_source sends.
  - title: BirdDog API landing page and API 2.0 knowledge base article
    author: BirdDog
    url: https://birddog.tv/api/
    note: >
      The P-Series & Converters RESTful API is the one for converters; the KB article
      (https://desk.birddog.tv/portal/en/kb/articles/api-2-0) says devices need LTS
      firmware for API 2.0. Older Studio and Mini firmware uses API 1.0 (BirdDog RESTful
      API v1.0, /enc-settings, /dec-settings, /av-settings), which this spec does not
      cover.
  - title: companion-module-birddog-converters (Bitfocus Companion module)
    author: Bitfocus
    url: https://github.com/bitfocus/companion-module-birddog-converters
    note: >
      Community source (MIT licence), read as corroboration only. It reads the model from
      /about's Format field (Studio, Mini, Flex Encode, Flex Decode, WP Encode, WP Decode,
      4KHDMI/SDI, QUAD, PLAY), offers operation mode only on Studio, Mini, 4KHDMI/SDI and
      QUAD, and connects sources with POST /connectTo {"sourceName": ...}. It also opens
      an undocumented websocket on port 6790 for decode status, not used here.

transport:
  type: http
  port: 8080
  scheme: http
  auth: none
  timeout_ms: 4000
  probe:
    method: GET
    path: /version

ports:
  - {port: 8080, protocol: http, role: control}

