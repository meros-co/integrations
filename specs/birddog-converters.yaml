quirks:
  - models: [all]
    severity: critical
    text: >
      connect_source switches the decoded picture at once (a FastSwitch unit without a
      pause, others after a reconnect), and set_operation_mode turns an encoder into a
      decoder or back, replacing what the baseband outputs carry. reboot and restart_video
      drop the stream until the unit is back. None asks for confirmation.

  - models: [all]
    severity: warning
    text: >
      The API has no push: state comes from polling /about and the decoder's source every
      5 seconds, and from the reply to each get_ and set_ command (POST replies carry the
      endpoint's object). The poll asks every model for /connectTo, which every column
      supports. Encoder, decoder and audio state updates when its get_ command is sent.
      Telemetry keeps channel 1; other channels' replies are returned by their get_
      commands only.

  - models: [all]
    severity: warning
    text: >
      Several DEVICE SUPPORT cells look wrong but are followed as printed:
      /encodeTransport is YES on Flex Decode and N/A on QUAD; decode NDIAudio is N/A on
      Wallplate Output and 4K HDMI/SDI but present on QUAD; StreamName and NDIGroup are
      N/A on Wallplate Input. /decodestatus's example reply keys (Videoresolution,
      VideoFramerate ...) differ from its parameter table (ConnectionStatus, SourceName,
      VideoResolution ...); the state rule reads the example's keys.

  - models: [all]
    severity: info
    text: >
      Every value in the JSON bodies is a string, as the document's examples show.
      Single-key bodies (plus ChNum for encode and decode settings) are sent; whether a
      unit needs the whole object is not documented. ChNum selects the channel of a 4K
      QUAD or a dual-channel 4K HDMI/SDI; single-channel units are sent ChNum=1. The API
      2.1 connectTo form the camera spec uses (location, sourceHostname, sourceStreamName)
      is not the converters'.

  - models: [studio, mini]
    severity: warning
    text: >
      Studio and Mini units on firmware older than the LTS release answer with BirdDog API
      1.0 (/about returns {"Version":"1.0", ...}) and need a firmware update for these
      commands.

  - models: [flex-4k-backpack, pod]
    severity: info
    text: >
      Neither has a column in the API 2.0 tables. The Flex 4K BACKPACK is taken as the
      Flex Encode column. The Pod guide documents only connect_source. PLAY PRO, OG4 and
      SDM claim a RESTful API but have no column or endpoint list, so they are not
      modelled.

  - models: [4k-quad]
    severity: info
    text: >
      The product page describes three operation modes (4x encode, 4x decode, 2x2), while
      /operationmode lists only encode and decode; the 2x2 mode's value is not documented.
