    # The AIO and Plus models give each input's signal under hdmi and sdi.
    - path: "^/usapi\\?method=get-status$"
      json_match: { "$.result": "^0$" }
      json_each: "$.input-signal.*"
      json: { status: "$.status", w: "$.cx", h: "$.cy", i: "$.interlaced", scale: "$.interlaced-scale", fr: "$.frame-rate", ch: "$.channel-valid",
              lpcm: "$.is-lpcm", bits: "$.bits-per-sample", sr: "$.sample-rate" }
      state:
        "inputs.{key}.signal.status": "{status}"
        "inputs.{key}.signal.width": "{w}"
        "inputs.{key}.signal.height": "{h}"
        "inputs.{key}.signal.interlaced": "{i:bit.0}"
