  # ── Recording (AIO and Plus) ──────────────────────────────────────────
  get_rec_channels:
    summary: "Every recording channel's settings (get-rec-channels)"
    send: { method: GET, path: /usapi, query: { method: get-rec-channels } }
    expect: *value
    returns: value
  add_rec_channel:
    summary: "Add a recording channel to the USB drive, SD card or NAS: stream, mode, folder, file names, segment length and audio (add-rec-channel)"
    params:
      storage: &p_rec_storage { type: enum, values: [usb, sd, nas], required: true, label: Storage, description: "USB flash drive, SD card, or the NAS; one channel each." }
      stream: *p_stream
      mode: &p_rec_mode { type: enum, values: [normal, loop], default: normal, label: Mode, description: "Normal recording, or loop recording that overwrites the oldest files." }
      folder: &p_rec_folder { type: string, default: REC_Folder, max_length: 65, pattern: "^[A-Za-z0-9._+'()\\[\\]-]([A-Za-z0-9 ._+'()\\[\\]/-]{0,63}[A-Za-z0-9._+'()\\[\\]-])?$",
        label: Folder, description: "The folder recorded into, up to two levels separated by a slash (a/b); REC_Folder by default." }
      prefix_mode: &p_prefix_mode { type: enum, values: [custom, time], default: custom, label: File name prefix, description: "Start file names with the custom prefix, or with the creation date and time." }
      prefix: &p_prefix { type: string, default: VID, max_length: 32, pattern: "^[A-Za-z0-9._+'()\\[\\]-]([A-Za-z0-9 ._+'()\\[\\]-]{0,30}[A-Za-z0-9._+'()\\[\\]-])?$",
        label: Prefix, description: "The custom file name prefix; VID by default." }
      format: &p_rec_format { type: enum, values: [mp4, mov], default: mp4, label: File format, description: "MP4 or MOV files." }
      segment_minutes: &p_segment { type: enum, values: ["5", "10", "30", "40", "50", "60", "90", "120"], default: "60", label: Segment length,
        description: "Minutes per file; on a FAT drive a file must stay under 4 GB at the recording bitrate." }
      audio: *p_audio_sel
    send: { method: GET, path: /usapi, query: { method: add-rec-channel, type: "{storage:map.disk}", stream-index: "{stream:map.stream_index}", mode: "{mode:map.rec_mode}",
            dir-name: "{folder}", file-prefix: "{prefix_mode:map.file_prefix}", prefix-name: "{prefix}", file-suffix: "{format:map.file_suffix}",
            time-unit: "{segment_minutes}", audio: "{audio:-1}" } }
    expect: *ok
    returns: ack
  set_rec_channel:
    summary: "Change a recording channel (set-rec-channel)"
    params:
      id: &p_rec_id { type: int, min: 0, max: 255, required: true, label: Channel, description: "The recording channel's id as get_rec_channels lists it." }
      storage: *p_rec_storage
      stream: *p_stream
      mode: *p_rec_mode
      folder: *p_rec_folder
      prefix_mode: *p_prefix_mode
      prefix: *p_prefix
      format: *p_rec_format
      segment_minutes: *p_segment
      audio: *p_audio_sel
    send: { method: GET, path: /usapi, query: { method: set-rec-channel, id: "{id}", type: "{storage:map.disk}", stream-index: "{stream:map.stream_index}", mode: "{mode:map.rec_mode}",
            dir-name: "{folder}", file-prefix: "{prefix_mode:map.file_prefix}", prefix-name: "{prefix}", file-suffix: "{format:map.file_suffix}",
            time-unit: "{segment_minutes}", audio: "{audio:-1}" } }
    expect: *ok
    returns: ack
  delete_rec_channel:
    summary: "Delete a recording channel (del-rec-channel)"
    params: { id: *p_rec_id }
    send: { method: GET, path: /usapi, query: { method: del-rec-channel, id: "{id}" } }
    expect: *ok
    returns: ack
  enable_rec_channel:
    summary: "Turn a recording channel on or off; on starts its recording task (enable-rec-channel)"
    params:
      id: *p_rec_id
      enabled: { type: bool, required: true, label: Enabled, description: "On records to this channel." }
    send: { method: GET, path: /usapi, query: { method: enable-rec-channel, id: "{id}", is-use: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  clear_rec_channel_status:
    summary: "Put a recording channel's status back to its initial state (clear-rec-status)"
    params: { id: *p_rec_id }
    send: { method: GET, path: /usapi, query: { method: clear-rec-status, id: "{id}" } }
    expect: *ok
    returns: ack
  set_auto_record:
    summary: "Start recording automatically when the signal locks or a USB drive is found, or not (set-auto-rec)"
    params:
      enabled: { type: bool, required: true, label: Auto record, description: "On starts recording on the trigger." }
      trigger: { type: enum, values: [signal, usb], default: signal, label: Trigger, description: "Signal locked, or USB drive detected." }
    send: { method: GET, path: /usapi, query: { method: set-auto-rec, is-auto: "{enabled:bool01}", trigger-mode: "{trigger:map.trigger_mode}" } }
    expect: *ok
    returns: ack
  add_nas:
    summary: "Add a NAS to record to, NFS or CIFS; up to 4 (add-nas)"
    params:
      protocol: &p_nas_proto { type: enum, values: [nfs, cifs], required: true, label: Protocol, description: "NFS or CIFS (SMB)." }
      address: &p_nas_addr { type: string, required: true, max_length: 255, label: Address, description: "The NAS's host name or IP address." }
      mount: &p_nas_mount { type: string, required: true, max_length: 255, label: Mount point, description: "The exported path or share, e.g. /home/magewell/nfs." }
      user: { type: string, default: "", max_length: 128, label: User, description: "CIFS: the user name." }
      password: { type: string, default: "", secret: true, max_length: 128, label: Password, description: "CIFS: the password." }
    send: { method: GET, path: /usapi, query: { method: add-nas, proto: "{protocol:map.nas_proto}", addr: "{address}", mount: "{mount}", user: "{user}", passwd: "{password}" } }
    expect: *ok
    returns: ack
  set_nas:
    summary: "Change a NAS (set-nas)"
    params:
      id: &p_nas_id { type: int, min: 0, max: 255, required: true, label: NAS, description: "The NAS's id as get_settings lists it in nas." }
      protocol: *p_nas_proto
      address: *p_nas_addr
      mount: *p_nas_mount
      user: { type: string, default: "", max_length: 128, label: User, description: "CIFS: the user name." }
      password: { type: string, default: "", secret: true, max_length: 128, label: Password, description: "CIFS: the password." }
    send: { method: GET, path: /usapi, query: { method: set-nas, id: "{id}", proto: "{protocol:map.nas_proto}", addr: "{address}", mount: "{mount}", user: "{user}", passwd: "{password}" } }
    expect: *ok
    returns: ack
  delete_nas:
    summary: "Delete a NAS (del-nas)"
    params: { id: *p_nas_id }
    send: { method: GET, path: /usapi, query: { method: del-nas, id: "{id}" } }
    expect: *ok
    returns: ack
  enable_nas:
    summary: "Use a NAS for the NAS recording channel, or not; one at a time (enable-nas)"
    params:
      id: *p_nas_id
      enabled: { type: bool, required: true, label: Enabled, description: "On mounts this NAS and binds the NAS recording channel to it." }
    send: { method: GET, path: /usapi, query: { method: enable-nas, id: "{id}", is-use: "{enabled:bool01}" } }
    expect: *ok
    returns: ack

  # ── Storage (AIO and Plus) ────────────────────────────────────────────
  get_media_files:
    summary: "Recorded files on the USB drive, SD card or NAS: name, status, time, size, duration, format and codec (get-media-files)"
    params:
      storage: *p_rec_storage
      start: { type: int, min: 0, default: 0, label: Start, description: "Index of the first file returned, from 0." }
      count: { type: int, min: 1, max: 10000, default: 100, label: Count, description: "How many files to return." }
    send: { method: GET, path: /usapi, query: { method: get-media-files, disk-type: "{storage:map.disk}", start: "{start}", count: "{count}" } }
    expect: *value
    returns: value
  delete_media_files:
    summary: "Delete recorded files from the USB drive, SD card or NAS (del-media-files; the files array of its JSON payload)"
    params:
      storage: *p_rec_storage
      files: { type: json, required: true, label: Files, description: "The media-files array of the del-media-files payload: a JSON array of file names as get_media_files lists them, e.g. [\"VID_6_14.mp4\"]." }
    send: { method: POST, path: /usapi, query: { method: del-media-files }, content_type: "application/json;charset=UTF-8",
            body: '{"disk-type":{storage:map.disk},"media-files":{files}}' }
    expect: *ok
    returns: ack
  start_disk_format:
    summary: "Format the USB drive or SD card; nothing on it can be recovered and it cannot be canceled (start-disk-format)"
    params:
      storage: &p_disk { type: enum, values: [usb, sd], required: true, label: Storage, description: "The USB flash drive or the SD card." }
    send: { method: GET, path: /usapi, query: { method: start-disk-format, disk-type: "{storage:map.disk}" } }
    expect: *ok
    returns: ack
  clear_disk_format:
    summary: "Put the format status back to its initial state after formatting (clear-disk-format)"
    send: { method: GET, path: /usapi, query: { method: clear-disk-format } }
    expect: *ok
    returns: ack
  start_disk_test:
    summary: "Test whether the USB drive or SD card writes fast enough to record (start-disk-test)"
    params: { storage: *p_disk }
    send: { method: GET, path: /usapi, query: { method: start-disk-test, disk-type: "{storage:map.disk}" } }
    expect: *ok
    returns: ack
  stop_disk_test:
    summary: "Cancel the disk speed test (stop-disk-test)"
    send: { method: GET, path: /usapi, query: { method: stop-disk-test } }
    expect: *ok
    returns: ack
  clear_disk_test:
    summary: "Put the disk test status back to its initial state after a test (clear-disk-test)"
    send: { method: GET, path: /usapi, query: { method: clear-disk-test } }
    expect: *ok
    returns: ack
  format_usb_legacy:
    summary: "Format the USB drive on firmware before V2.2; nothing on it can be recovered (start-format-usb, deprecated at V2.2)"
    send: { method: GET, path: /usapi, query: { method: start-format-usb } }
    expect: *ok
    returns: ack
  format_sd_legacy:
    summary: "Format the SD card on firmware before V2.2; nothing on it can be recovered (start-format-sd, deprecated at V2.2)"
    send: { method: GET, path: /usapi, query: { method: start-format-sd } }
    expect: *ok
    returns: ack
  clear_format_usb_legacy:
    summary: "Put the USB format status back to its initial state (clear-format-usb, deprecated at V2.2)"
    send: { method: GET, path: /usapi, query: { method: clear-format-usb } }
    expect: *ok
    returns: ack
  clear_format_sd_legacy:
    summary: "Put the SD format status back to its initial state (clear-format-sd, deprecated at V2.2)"
    send: { method: GET, path: /usapi, query: { method: clear-format-sd } }
    expect: *ok
    returns: ack
  test_usb_legacy:
    summary: "Test the USB drive's write speed on firmware before V2.2 (start-test-usb, deprecated at V2.2)"
    send: { method: GET, path: /usapi, query: { method: start-test-usb } }
    expect: *ok
    returns: ack
  stop_test_usb_legacy:
    summary: "Cancel the USB speed test (stop-test-usb, deprecated at V2.2)"
    send: { method: GET, path: /usapi, query: { method: stop-test-usb } }
    expect: *ok
    returns: ack
  clear_test_usb_legacy:
    summary: "Put the USB test status back to its initial state (clear-test-usb, deprecated at V2.2)"
    send: { method: GET, path: /usapi, query: { method: clear-test-usb } }
    expect: *ok
    returns: ack

  # ── Uploading files (AIO and Plus) ────────────────────────────────────
  add_ftp_upload_server:
    summary: "Add an FTP or SFTP server recorded files are uploaded to; up to 8 servers (send-file-add-server type 0)"
    params:
      net_mode: *p_net_mode
      protocol: &p_ftp_proto { type: enum, values: [ftp, sftp], default: ftp, label: Protocol, description: "FTP or SFTP." }
      url: &p_ftp_url { type: string, required: true, max_length: 255, label: Server, description: "The server's host name or address." }
      port: &p_ftp_port { type: int, min: 1, max: 65535, default: 21, label: Port, description: "The server's port." }
      folder: &p_upload_dir { type: string, default: "", max_length: 255, label: Folder, description: "The folder uploaded into." }
      encryption: &p_ftp_enc { type: enum, values: [none, explicit-tls, implicit-tls], default: none, label: Encryption, description: "Plain FTP, explicit FTP over TLS, or implicit FTP over TLS." }
      anonymous: &p_ftp_anon { type: bool, default: false, label: Anonymous, description: "On logs in anonymously; off with the user name and password." }
      user: *p_user
      password: *p_password
      passive: &p_ftp_passive { type: bool, default: true, label: Passive mode, description: "On transfers in passive mode, off in active mode." }
    send: { method: GET, path: /usapi, query: { method: send-file-add-server, type: "0", net-mode: "{net_mode:map.net_mode}", proto: "{protocol:map.ftp_proto}", url: "{url}",
            port: "{port}", dir-name: "{folder}", encryption: "{encryption:map.ftp_encryption}", login-type: "{anonymous:bool10}", user-name: "{user}", passwd: "{password}",
            mode: "{passive:bool01}" } }
    expect: *ok
    returns: ack
  set_ftp_upload_server:
    summary: "Change an FTP or SFTP upload server (send-file-set-server type 0)"
    params:
      id: &p_upload_id { type: int, min: 0, max: 255, required: true, label: Server, description: "The upload server's id as get_settings lists it in send-file-cloud." }
      net_mode: *p_net_mode
      protocol: *p_ftp_proto
      url: *p_ftp_url
      port: *p_ftp_port
      folder: *p_upload_dir
      encryption: *p_ftp_enc
      anonymous: *p_ftp_anon
      user: *p_user
      password: *p_password
      passive: *p_ftp_passive
    send: { method: GET, path: /usapi, query: { method: send-file-set-server, id: "{id}", type: "0", net-mode: "{net_mode:map.net_mode}", proto: "{protocol:map.ftp_proto}",
            url: "{url}", port: "{port}", dir-name: "{folder}", encryption: "{encryption:map.ftp_encryption}", login-type: "{anonymous:bool10}", user-name: "{user}",
            passwd: "{password}", mode: "{passive:bool01}" } }
    expect: *ok
    returns: ack
  add_cloud_upload_server:
    summary: "Add a Google Drive, Dropbox or YouTube account recorded files are uploaded to, with tokens the consumer obtained (send-file-add-server type 1-3)"
    params:
      type: &p_upload_type { type: enum, values: [google-drive, dropbox, youtube], required: true, label: Service, description: "Google Drive, Dropbox or YouTube." }
      net_mode: *p_net_mode
      account_id: &p_account { type: string, required: true, max_length: 255, label: Account ID, description: "The account's id at the service." }
      photo: &p_photo { type: string, default: "", max_length: 1024, label: Avatar, description: "The address of the account's picture, shown in the web interface." }
      user: &p_account_user { type: string, default: "", max_length: 255, label: User name, description: "The account's user name." }
      access_token: &p_access { type: string, required: true, secret: true, max_length: 4096, label: Access token, description: "The OAuth access token for the account." }
      refresh_token: &p_refresh { type: string, required: true, secret: true, max_length: 4096, label: Refresh token, description: "The OAuth refresh token for the account." }
      folder: *p_upload_dir
      parents: &p_parents { type: string, default: "", max_length: 255, label: Parent folder, description: "Google Drive: the parent folder's id." }
      privacy: &p_privacy { type: string, default: "", max_length: 32, label: Privacy, description: "YouTube: the uploaded videos' privacy." }
    send:
      - { method: GET, path: /usapi, query: { method: send-file-add-server, type: "{type:map.upload_type}", net-mode: "{net_mode:map.net_mode}", account-id: "{account_id}",
          photo-path: "{photo}", user-name: "{user}", access-token: "{access_token}", refresh-token: "{refresh_token}", dir-name: "{folder}", parents: "{parents}",
          privacy: "{privacy}" } }
    expect: *ok
    returns: ack
  set_cloud_upload_server:
    summary: "Change a Google Drive, Dropbox or YouTube upload account (send-file-set-server type 1-3)"
    params:
      id: *p_upload_id
      type: *p_upload_type
      net_mode: *p_net_mode
      account_id: *p_account
      photo: *p_photo
      user: *p_account_user
      access_token: *p_access
      refresh_token: *p_refresh
      folder: *p_upload_dir
      parents: *p_parents
      privacy: *p_privacy
    send: { method: GET, path: /usapi, query: { method: send-file-set-server, id: "{id}", type: "{type:map.upload_type}", net-mode: "{net_mode:map.net_mode}",
            account-id: "{account_id}", photo-path: "{photo}", user-name: "{user}", access-token: "{access_token}", refresh-token: "{refresh_token}", dir-name: "{folder}",
            parents: "{parents}", privacy: "{privacy}" } }
    expect: *ok
    returns: ack
  delete_upload_server:
    summary: "Delete an upload server (send-file-del-server)"
    params: { id: *p_upload_id }
    send: { method: GET, path: /usapi, query: { method: send-file-del-server, id: "{id}" } }
    expect: *ok
    returns: ack
  enable_upload_server:
    summary: "Choose the upload server; one at a time (send-file-enable-server)"
    params:
      id: *p_upload_id
      enabled: { type: bool, required: true, label: Enabled, description: "On uploads to this server." }
    send: { method: GET, path: /usapi, query: { method: send-file-enable-server, id: "{id}", is-use: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  test_ftp_upload_server:
    summary: "Test an FTP or SFTP upload server (send-file-start-test-server type 0)"
    params:
      net_mode: *p_net_mode
      protocol: *p_ftp_proto
      url: *p_ftp_url
      port: *p_ftp_port
      folder: *p_upload_dir
      encryption: *p_ftp_enc
      anonymous: *p_ftp_anon
      user: *p_user
      password: *p_password
      passive: *p_ftp_passive
    send: { method: GET, path: /usapi, query: { method: send-file-start-test-server, type: "0", net-mode: "{net_mode:map.net_mode}", proto: "{protocol:map.ftp_proto}",
            url: "{url}", port: "{port}", dir-name: "{folder}", encryption: "{encryption:map.ftp_encryption}", login-type: "{anonymous:bool10}", user-name: "{user}",
            passwd: "{password}", mode: "{passive:bool01}" } }
    expect: *ok
    returns: ack
  stop_upload_server_test:
    summary: "Stop the upload server test (send-file-stop-test-server)"
    send: { method: GET, path: /usapi, query: { method: send-file-stop-test-server } }
    expect: *ok
    returns: ack
  clear_upload_server_test:
    summary: "Put the upload test status back to its initial state (clear-test-send-file)"
    send: { method: GET, path: /usapi, query: { method: clear-test-send-file } }
    expect: *ok
    returns: ack
  add_upload_files:
    summary: "Add recorded files to the upload list (send-file-add; the files array of its JSON payload)"
    params:
      storage: *p_disk
      files: &p_files { type: json, required: true, label: Files, description: "The media-files array of the payload: a JSON array of file names as get_media_files lists them." }
    send: { method: POST, path: /usapi, query: { method: send-file-add }, content_type: "application/json;charset=UTF-8",
            body: '{"disk-type":{storage:map.disk},"media-files":{files}}' }
    expect: *ok
    returns: ack
  delete_upload_files:
    summary: "Remove files from the upload list (send-file-del; the files array of its JSON payload)"
    params:
      storage: *p_disk
      files: *p_files
    send: { method: POST, path: /usapi, query: { method: send-file-del }, content_type: "application/json;charset=UTF-8",
            body: '{"disk-type":{storage:map.disk},"media-files":{files}}' }
    expect: *ok
    returns: ack
  clear_upload_files:
    summary: "Empty the upload list (send-file-clear)"
    send: { method: GET, path: /usapi, query: { method: send-file-clear } }
    expect: *ok
    returns: ack
  get_upload_status:
    summary: "Upload progress and list: files waiting and done, the status and a page of the list (send-file-get-status)"
    params:
      storage: *p_disk
      start: { type: int, min: 0, default: 0, label: Start, description: "Index of the first listed upload, from 0." }
      count: { type: int, min: 0, max: 10000, default: 100, label: Count, description: "How many uploads to list." }
    send: { method: GET, path: /usapi, query: { method: send-file-get-status, disk-type: "{storage:map.disk}", start: "{start}", count: "{count}" } }
    expect: *value
    returns: value
  set_auto_upload:
    summary: "Upload files recorded to the SD card automatically, or not (send-file-set-is-auto)"
    params:
      enabled: { type: bool, required: true, label: Auto upload, description: "On uploads new recordings automatically." }
    send: { method: GET, path: /usapi, query: { method: send-file-set-is-auto, is-auto: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  start_upload:
    summary: "Start uploading the list (send-file-start)"
    send: { method: GET, path: /usapi, query: { method: send-file-start } }
    expect: *ok
    returns: ack
  stop_upload:
    summary: "Stop uploading, the file in progress included (send-file-stop)"
    send: { method: GET, path: /usapi, query: { method: send-file-stop } }
    expect: *ok
    returns: ack

  # ── Overlays (AIO and Plus) ───────────────────────────────────────────
  get_overlays:
    summary: "Every overlay, and whether overlays are on for each stream (get-surfaces)"
    send: { method: GET, path: /usapi, query: { method: get-surfaces } }
    expect: *value
    returns: value
  get_overlay_images:
    summary: "The uploaded overlay images (get-images)"
    send: { method: GET, path: /usapi, query: { method: get-images } }
    expect: *value
    returns: value
  add_overlay_image:
    summary: "Upload a JPEG or PNG for image overlays, up to 8, under 1920x1080 and 512 KB (add-image, multipart file upload)"
    params:
      image: { type: binary, required: true, label: Image, description: "The JPEG or PNG's contents, given as base64 or as a host file." }
      file_name: { type: string, default: overlay.png, max_length: 255, label: File name, description: "The file name sent with the upload." }
    send:
      method: POST
      path: /usapi
      query: { method: add-image }
      multipart: [{ name: file, binary: image, filename: "{file_name}", content_type: application/octet-stream }]
    expect: *ok
    returns: ack
  delete_overlay_image:
    summary: "Delete an overlay image (del-image)"
    params:
      id: { type: int, min: 0, max: 255, required: true, label: Image, description: "The image's id as get_overlay_images lists it." }
    send: { method: GET, path: /usapi, query: { method: del-image, id: "{id}" } }
    expect: *ok
    returns: ack
  add_text_overlay:
    summary: "Add a text overlay to the main or sub stream; 8 per stream (add-surface type 0)"
    params:
      stream: *p_stream
      position: &p_ov_pos { type: enum, values: [custom, top-left, top-right, bottom-left, bottom-right, top-center, bottom-center, center], default: top-left, label: Position,
        description: "A corner, an edge's center, the center, or custom at the offsets." }
      x: &p_ov_x { type: int, min: 0, max: 4096, default: 0, label: X offset, description: "Left edge in pixels, for a custom position." }
      y: &p_ov_y { type: int, min: 0, max: 2160, default: 0, label: Y offset, description: "Top edge in lines, for a custom position." }
      margin: &p_ov_margin { type: int, min: 0, max: 1024, default: 0, label: Margin, description: "Distance from the picture's edge in pixels; 0 by default." }
      font: &p_font { type: enum, values: [source-han-sans, lato], default: source-han-sans, label: Font, description: "Source Han Sans or Lato." }
      font_size: &p_font_size { type: int, min: 1, max: 1000, required: true, label: Font size, description: "Font size in pixels." }
      font_style: &p_font_style { type: enum, values: [normal, italic, oblique], default: normal, label: Font style, description: "Normal, italic or oblique." }
      font_weight: &p_font_weight { type: enum, values: [normal, bold], default: normal, label: Font weight, description: "Normal or bold." }
      color: &p_font_color { type: string, required: true, max_length: 32, label: Color, description: "The text color, as the web interface writes it." }
      outline_width: &p_line_width { type: int, min: 0, max: 100, default: 0, label: Outline width, description: "Width of the text outline in pixels, 0 for none." }
      outline_color: &p_line_color { type: string, default: "", max_length: 32, label: Outline color, description: "The outline color, as the web interface writes it." }
      width: &p_box_w { type: int, min: 0, max: 4096, required: true, label: Box width, description: "Width of the text box in pixels." }
      height: &p_box_h { type: int, min: 0, max: 2160, required: true, label: Box height, description: "Height of the text box in lines." }
      text: { type: string, required: true, max_length: 1024, label: Text, description: "The text shown." }
    send: { method: GET, path: /usapi, query: { method: add-surface, type: "0", stream-index: "{stream:map.stream_index}", position: "{position:map.overlay_position}", x-offset: "{x}",
            y-offset: "{y}", margin: "{margin}", font-family: "{font:map.font_family}", font-size: "{font_size}", font-style: "{font_style:map.font_style}",
            font-weight: "{font_weight:map.font_weight}", font-color: "{color}", line-width: "{outline_width}", line-color: "{outline_color}", width: "{width}", height: "{height}",
            text: "{text}" } }
    expect: *ok
    returns: ack
  set_text_overlay:
    summary: "Change a text overlay (set-surface type 0)"
    params:
      id: &p_overlay_id { type: int, min: 0, max: 255, required: true, label: Overlay, description: "The overlay's id as get_overlays lists it." }
      stream: *p_stream
      position: *p_ov_pos
      x: *p_ov_x
      y: *p_ov_y
      margin: *p_ov_margin
      font: *p_font
      font_size: *p_font_size
      font_style: *p_font_style
      font_weight: *p_font_weight
      color: *p_font_color
      outline_width: *p_line_width
      outline_color: *p_line_color
      width: *p_box_w
      height: *p_box_h
      text: { type: string, required: true, max_length: 1024, label: Text, description: "The text shown." }
    send: { method: GET, path: /usapi, query: { method: set-surface, id: "{id}", type: "0", stream-index: "{stream:map.stream_index}", position: "{position:map.overlay_position}",
            x-offset: "{x}", y-offset: "{y}", margin: "{margin}", font-family: "{font:map.font_family}", font-size: "{font_size}", font-style: "{font_style:map.font_style}",
            font-weight: "{font_weight:map.font_weight}", font-color: "{color}", line-width: "{outline_width}", line-color: "{outline_color}", width: "{width}", height: "{height}",
            text: "{text}" } }
    expect: *ok
    returns: ack
  add_clock_overlay:
    summary: "Add a system time overlay to the main or sub stream (add-surface type 1)"
    params:
      stream: *p_stream
      position: *p_ov_pos
      x: *p_ov_x
      y: *p_ov_y
      margin: *p_ov_margin
      font: *p_font
      font_size: *p_font_size
      font_style: *p_font_style
      font_weight: *p_font_weight
      color: *p_font_color
      outline_width: *p_line_width
      outline_color: *p_line_color
      width: *p_box_w
      height: *p_box_h
      format: &p_time_format { type: enum, values: [ymd-hms, mdy-hms, dmy-hms, ymd, mdy, dmy, hms, hm], default: ymd-hms, label: Time format,
        description: "YYYY-MM-DD hh:mm:ss, MM/DD/YYYY hh:mm:ss, DD/MM/YYYY hh:mm:ss, the dates alone, hh:mm:ss or hh:mm." }
    send: { method: GET, path: /usapi, query: { method: add-surface, type: "1", stream-index: "{stream:map.stream_index}", position: "{position:map.overlay_position}", x-offset: "{x}",
            y-offset: "{y}", margin: "{margin}", font-family: "{font:map.font_family}", font-size: "{font_size}", font-style: "{font_style:map.font_style}",
            font-weight: "{font_weight:map.font_weight}", font-color: "{color}", line-width: "{outline_width}", line-color: "{outline_color}", width: "{width}", height: "{height}",
            text: "{format:map.time_format}" } }
    expect: *ok
    returns: ack
  set_clock_overlay:
    summary: "Change a system time overlay (set-surface type 1)"
    params:
      id: *p_overlay_id
      stream: *p_stream
      position: *p_ov_pos
      x: *p_ov_x
      y: *p_ov_y
      margin: *p_ov_margin
      font: *p_font
      font_size: *p_font_size
      font_style: *p_font_style
      font_weight: *p_font_weight
      color: *p_font_color
      outline_width: *p_line_width
      outline_color: *p_line_color
      width: *p_box_w
      height: *p_box_h
      format: *p_time_format
    send: { method: GET, path: /usapi, query: { method: set-surface, id: "{id}", type: "1", stream-index: "{stream:map.stream_index}", position: "{position:map.overlay_position}",
            x-offset: "{x}", y-offset: "{y}", margin: "{margin}", font-family: "{font:map.font_family}", font-size: "{font_size}", font-style: "{font_style:map.font_style}",
            font-weight: "{font_weight:map.font_weight}", font-color: "{color}", line-width: "{outline_width}", line-color: "{outline_color}", width: "{width}", height: "{height}",
            text: "{format:map.time_format}" } }
    expect: *ok
    returns: ack
  add_image_overlay:
    summary: "Add an image overlay to the main or sub stream: image, opacity and scale (add-surface type 2)"
    params:
      stream: *p_stream
      position: *p_ov_pos
      x: *p_ov_x
      y: *p_ov_y
      margin: *p_ov_margin
      image: &p_ov_image { type: int, min: 0, max: 255, required: true, label: Image, description: "The image's id as get_overlay_images lists it." }
      alpha: &p_alpha { type: int, min: 0, max: 255, default: 255, label: Opacity, description: "Alpha from 0 (transparent) to 255 (opaque)." }
      scale: &p_scale { type: int, min: 1, max: 400, default: 100, label: Scale, description: "Size in percent of the image, 1 to 400." }
    send: { method: GET, path: /usapi, query: { method: add-surface, type: "2", stream-index: "{stream:map.stream_index}", position: "{position:map.overlay_position}", x-offset: "{x}",
            y-offset: "{y}", margin: "{margin}", index: "{image}", alpha: "{alpha}", scale: "{scale}" } }
    expect: *ok
    returns: ack
  set_image_overlay:
    summary: "Change an image overlay (set-surface type 2)"
    params:
      id: *p_overlay_id
      stream: *p_stream
      position: *p_ov_pos
      x: *p_ov_x
      y: *p_ov_y
      margin: *p_ov_margin
      image: *p_ov_image
      alpha: *p_alpha
      scale: *p_scale
    send: { method: GET, path: /usapi, query: { method: set-surface, id: "{id}", type: "2", stream-index: "{stream:map.stream_index}", position: "{position:map.overlay_position}",
            x-offset: "{x}", y-offset: "{y}", margin: "{margin}", index: "{image}", alpha: "{alpha}", scale: "{scale}" } }
    expect: *ok
    returns: ack
  delete_overlay:
    summary: "Delete an overlay (del-surface)"
    params: { id: *p_overlay_id }
    send: { method: GET, path: /usapi, query: { method: del-surface, id: "{id}" } }
    expect: *ok
    returns: ack
  enable_overlay:
    summary: "Turn one overlay on or off; it shows while its stream's overlays are on (enable-surface)"
    params:
      id: *p_overlay_id
      enabled: { type: bool, required: true, label: Enabled, description: "On makes this overlay ready to show." }
    send: { method: GET, path: /usapi, query: { method: enable-surface, id: "{id}", is-use: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  set_overlays_enabled:
    summary: "Show the overlays of the main or sub stream, or not (set-enable-surface)"
    params:
      stream: *p_stream
      enabled: { type: bool, required: true, label: Overlays, description: "On shows the stream's enabled overlays." }
    send: { method: GET, path: /usapi, query: { method: set-enable-surface, stream-index: "{stream:map.stream_index}", enable: "{enabled:bool01}" } }
    expect: *ok
    returns: ack

  # ── Scheduler (AIO and Plus) ──────────────────────────────────────────
  get_schedules:
    summary: "The schedules of live streaming, recording or automatic reboot (get-schedulers)"
    params:
      channel: &p_sched_channel { type: enum, values: [live, record, reboot], required: true, label: Schedule type, description: "Live streaming, recording or automatic reboot." }
      id: { type: int, min: -1, max: 255, default: -1, label: Schedule, description: "One schedule's id, or -1 for all of the type." }
    send: { method: GET, path: /usapi, query: { method: get-schedulers, id: "{id}", chn-type: "{channel:map.schedule_channel}", chn-id: "-1" } }
    expect: *value
    returns: value
  add_schedule:
    summary: "Add a schedule for a live streaming server, a recording channel or a reboot: times, repeat pattern and end; 8 per channel (add-scheduler)"
    params:
      channel: *p_sched_channel
      channel_id: &p_sched_chn { type: int, min: -1, max: 255, default: -1, label: Channel, description: "The streaming server's or recording channel's id; -1 for a reboot." }
      title: &p_sched_title { type: string, required: true, max_length: 32, pattern: "^[A-Za-z0-9._+'()\\[\\]-]([A-Za-z0-9 ._+'()\\[\\]-]{0,30}[A-Za-z0-9._+'()\\[\\]-])?$",
        label: Title, description: "1 to 32 letters, digits, spaces and ._-+'[](), not starting or ending with a space." }
      description: &p_sched_desc { type: string, required: true, max_length: 32, pattern: "^[A-Za-z0-9._+'()\\[\\]-]([A-Za-z0-9 ._+'()\\[\\]-]{0,30}[A-Za-z0-9._+'()\\[\\]-])?$",
        label: Description, description: "1 to 32 letters, digits, spaces and ._-+'[](), not starting or ending with a space." }
      full_day: &p_full_day { type: bool, default: false, label: All day, description: "On makes it a full-day schedule." }
      begin: &p_begin { type: string, required: true, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$", label: Start, description: "Start as YYYY-MM-DD hh:mm:ss." }
      end: &p_end { type: string, required: true, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$", label: End, description: "End as YYYY-MM-DD hh:mm:ss." }
      repeat: &p_repeat { type: bool, default: false, label: Repeat, description: "On repeats it on the pattern given." }
      pattern: &p_repeat_event { type: enum, values: [daily, weekly, monthly, yearly], default: daily, label: Repeat pattern, description: "Daily, weekly, monthly or yearly." }
      interval: &p_interval { type: int, min: 1, max: 1000, default: 1, label: Every, description: "Days, weeks or months between occurrences." }
      weekdays_only: &p_workday { type: bool, default: false, label: Weekdays only, description: "Daily: every weekday rather than every interval." }
      weekdays: &p_wdays { type: int, min: 0, max: 127, default: 0, label: Days of the week, description: "Weekly: sum of Monday 1, Tuesday 2, Wednesday 4, Thursday 8, Friday 16, Saturday 32, Sunday 64." }
      month_day: &p_mday { type: int, min: 0, max: 31, default: 0, label: Day of the month, description: "Monthly or yearly: the day of the month, or 0 to use the week and weekday." }
      week: &p_wdy { type: int, min: 0, max: 5, default: 0, label: Week of the month, description: "Monthly or yearly: which week of the month." }
      weekday: &p_idx { type: enum, values: [monday, tuesday, wednesday, thursday, friday, saturday, sunday], default: monday, label: Weekday,
        description: "Monthly or yearly: the weekday in that week." }
      month: &p_month { type: int, min: 0, max: 12, default: 0, label: Month, description: "Yearly: the month, 1 to 12." }
      ends: &p_end_event { type: enum, values: [never, count, date], default: never, label: Ends, description: "Never, after a number of occurrences, or on a date." }
      count: &p_end_count { type: int, min: 0, max: 10000, default: 0, label: Occurrences, description: "How many times, when it ends after a count." }
      end_date: &p_end_date { type: string, default: "", max_length: 19, pattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2}( [0-9]{2}:[0-9]{2}:[0-9]{2})?)?$", label: End date,
        description: "The last date, when it ends on a date." }
    send: { method: GET, path: /usapi, query: { method: add-scheduler, chn-type: "{channel:map.schedule_channel}", chn-id: "{channel_id}", title: "{title}", desc: "{description}",
            is-full-day: "{full_day:bool01}", time-begin: "{begin}", time-end: "{end}", is-repeat: "{repeat:bool01}", repeat-event: "{pattern:map.repeat_add}",
            repeat-interval: "{interval}", repeat-is-workday: "{weekdays_only:bool01}", repeat-wdays: "{weekdays}", repeat-mday: "{month_day}", repeat-wdy: "{week}",
            repeat-idx: "{weekday:map.weekday}", repeat-month: "{month}", end-event: "{ends:map.end_event}", end-interval: "{count}", end-dateline: "{end_date}" } }
    expect: *ok
    returns: ack
  set_schedule:
    summary: "Change a schedule (set-scheduler)"
    params:
      id: &p_sched_id { type: int, min: 0, max: 255, required: true, label: Schedule, description: "The schedule's id as get_schedules lists it." }
      channel: *p_sched_channel
      channel_id: *p_sched_chn
      title: *p_sched_title
      description: *p_sched_desc
      full_day: *p_full_day
      begin: *p_begin
      end: *p_end
      repeat: *p_repeat
      pattern: *p_repeat_event
      interval: *p_interval
      weekdays_only: *p_workday
      weekdays: *p_wdays
      month_day: *p_mday
      week: *p_wdy
      weekday: *p_idx
      month: *p_month
      ends: *p_end_event
      count: *p_end_count
      end_date: *p_end_date
    send: { method: GET, path: /usapi, query: { method: set-scheduler, id: "{id}", chn-type: "{channel:map.schedule_channel}", chn-id: "{channel_id}", title: "{title}",
            desc: "{description}", is-full-day: "{full_day:bool01}", time-begin: "{begin}", time-end: "{end}", is-repeat: "{repeat:bool01}", repeat-event: "{pattern:map.repeat_set}",
            repeat-interval: "{interval}", repeat-is-workday: "{weekdays_only:bool01}", repeat-wdays: "{weekdays}", repeat-mday: "{month_day}", repeat-wdy: "{week}",
            repeat-idx: "{weekday:map.weekday}", repeat-month: "{month}", end-event: "{ends:map.end_event}", end-interval: "{count}", end-dateline: "{end_date}" } }
    expect: *ok
    returns: ack
  delete_schedule:
    summary: "Delete a schedule (del-scheduler)"
    params:
      id: *p_sched_id
      channel: *p_sched_channel
    send: { method: GET, path: /usapi, query: { method: del-scheduler, id: "{id}", chn-type: "{channel:map.schedule_channel}", chn-id: "-1" } }
    expect: *ok
    returns: ack
  enable_schedule:
    summary: "Turn a schedule on or off (enable-scheduler)"
    params:
      id: *p_sched_id
      channel: *p_sched_channel
      enabled: { type: bool, required: true, label: Enabled, description: "On runs the schedule." }
    send: { method: GET, path: /usapi, query: { method: enable-scheduler, id: "{id}", chn-type: "{channel:map.schedule_channel}", chn-id: "-1", is-use: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  upload_calendar:
    summary: "Upload an iCalendar (.ics) file of schedules (upload-icalendar-file, multipart file upload)"
    params:
      file: *p_file
      file_name: { type: string, default: schedule.ics, max_length: 255, label: File name, description: "The file name sent with the upload, then named by import_calendar_file." }
    send:
      method: POST
      path: /usapi
      query: { method: upload-icalendar-file }
      multipart: [{ name: file, binary: file, filename: "{file_name}", content_type: application/octet-stream }]
    expect: *ok
    returns: ack
  import_calendar_file:
    summary: "Take live or recording schedules from an uploaded calendar file (import-scheduler import-type 1)"
    params:
      channel: &p_cal_channel { type: enum, values: [live, record], required: true, label: Schedule type, description: "Live streaming or recording schedules." }
      file_name: { type: string, required: true, max_length: 255, label: File name, description: "The uploaded calendar file's name." }
    send: { method: GET, path: /usapi, query: { method: import-scheduler, chn-type: "{channel:map.calendar_channel}", chn-id: "-1", import-type: "1", file-name: "{file_name}" } }
    expect: *ok
    returns: ack
  import_calendar_url:
    summary: "Take live or recording schedules from a remote calendar link (import-scheduler import-type 2)"
    params:
      channel: *p_cal_channel
      url: { type: string, required: true, max_length: 2048, label: Calendar link, description: "The remote iCalendar address." }
    send: { method: GET, path: /usapi, query: { method: import-scheduler, chn-type: "{channel:map.calendar_channel}", chn-id: "-1", import-type: "2", url: "{url}" } }
    expect: *ok
    returns: ack
  clear_calendar_source:
    summary: "Stop taking live or recording schedules from a calendar (import-scheduler import-type 0)"
    params: { channel: *p_cal_channel }
    send: { method: GET, path: /usapi, query: { method: import-scheduler, chn-type: "{channel:map.calendar_channel}", chn-id: "-1", import-type: "0" } }
    expect: *ok
    returns: ack
  sync_calendar:
    summary: "Read the remote calendar of live or recording schedules again (sync-scheduler)"
    params: { channel: *p_cal_channel }
    send: { method: GET, path: /usapi, query: { method: sync-scheduler, chn-type: "{channel:map.calendar_channel}", chn-id: "-1" } }
    expect: *ok
    returns: ack

  # ── Users ─────────────────────────────────────────────────────────────
  logout:
    summary: "End the session (logout); the core logs in again before its next request"
    send: { method: GET, path: /usapi, query: { method: logout } }
    expect: *ok
    returns: ack
  get_users:
    summary: "Users, each an administrator or a general user (get-users)"
    send: { method: GET, path: /usapi, query: { method: get-users } }
    expect: *value
    returns: value
  add_user:
    summary: "Add a user; on the AIO and Plus models an administrator or a general user (add-user)"
    params:
      user: &p_user_id { type: string, required: true, max_length: 64, label: User, description: "The user name." }
      password: &p_user_pass { type: string, required: true, secret: true, max_length: 64, label: Password, description: "The password; the core sends only its MD5 hash." }
      admin: { type: bool, default: false, label: Administrator, description: "AIO and Plus models: on adds an administrator." }
    send:
      - { models: *v1, method: GET, path: /usapi, query: { method: add-user, id: "{user}", pass: "{password:md5}" } }
      - { models: *v2, method: GET, path: /usapi, query: { method: add-user, id: "{user}", pass: "{password:md5}", is-admin: "{admin:bool01}" } }
    expect: *ok
    returns: ack
  delete_user:
    summary: "Delete a user (del-user)"
    params: { user: *p_user_id }
    send: { method: GET, path: /usapi, query: { method: del-user, id: "{user}" } }
    expect: *ok
    returns: ack
  change_password:
    summary: "Change the logged-in user's password (ch-password, ch-passwd on the AIO and Plus models)"
    params:
      old_password: { type: string, required: true, secret: true, max_length: 64, label: Current password, description: "The current password; sent as its MD5 hash." }
      new_password: { type: string, required: true, secret: true, max_length: 64, label: New password, description: "The new password; sent as its MD5 hash." }
    send:
      - { models: *v1, method: GET, path: /usapi, query: { method: ch-password, pass: "{old_password:md5}", new-pass: "{new_password:md5}" } }
      - { models: *v2, method: GET, path: /usapi, query: { method: ch-passwd, pass: "{old_password:md5}", new-pass: "{new_password:md5}" } }
    expect: *ok
    returns: ack
  set_user_password:
    summary: "Set a user's password without the old one; administrators only (set-password, set-passwd on the AIO and Plus models)"
    params:
      user: *p_user_id
      password: *p_user_pass
    send:
      - { models: *v1, method: GET, path: /usapi, query: { method: set-password, id: "{user}", pass: "{password:md5}" } }
      - { models: *v2, method: GET, path: /usapi, query: { method: set-passwd, id: "{user}", pass: "{password:md5}" } }
    expect: *ok
    returns: ack

  # ── Network ───────────────────────────────────────────────────────────
  set_network_dhcp:
    summary: "Take the Ethernet or Wi-Fi address from DHCP (set-net is-dhcp=1); the device may move to another address"
    params:
      interface: &p_iface { type: enum, values: [ethernet, wifi], default: ethernet, label: Interface, description: "Ethernet or Wi-Fi." }
    send: { method: GET, path: /usapi, query: { method: set-net, type: "{interface:map.net_type}", is-dhcp: "1" } }
    expect: *ok
    returns: ack
  set_network_static:
    summary: "A fixed Ethernet or Wi-Fi address (set-net is-dhcp=0); the device moves to it"
    params:
      interface: *p_iface
      address: &p_ip { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: IP address, description: "IPv4 address, e.g. 10.10.107.212." }
      netmask: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Netmask, description: "Subnet mask, e.g. 255.255.0.0." }
      gateway: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Gateway, description: "Default gateway." }
      dns: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: DNS, description: "DNS server." }
    send: { method: GET, path: /usapi, query: { method: set-net, type: "{interface:map.net_type}", is-dhcp: "0", ip: "{address}", mask: "{netmask}", router: "{gateway}", dns: "{dns}" } }
    expect: *ok
    returns: ack
  set_usb_network:
    summary: "The USB network (RNDIS) address (set-rndis-config)"
    params:
      address: *p_ip
    send: { method: GET, path: /usapi, query: { method: set-rndis-config, addr: "{address}" } }
    expect: *ok
    returns: ack
  set_network_priority:
    summary: "The network used first when several are connected (set-net-prior)"
    params:
      network: { type: enum, values: [mobile, ethernet, wifi], required: true, label: Network, description: "Mobile broadband, Ethernet or Wi-Fi first." }
    send: { method: GET, path: /usapi, query: { method: set-net-prior, net-prior: "{network:map.net_mode}" } }
    expect: *ok
    returns: ack
  set_wifi_enabled:
    summary: "Turn the Wi-Fi client on or off (enable-station)"
    params:
      enabled: { type: bool, required: true, label: Wi-Fi, description: "On turns Wi-Fi on." }
    send: { method: GET, path: /usapi, query: { method: enable-station, enable-station: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  scan_wifi:
    summary: "Wi-Fi networks: the saved ones and those found, with frequency and level (scan-wifi-results)"
    send: { method: GET, path: /usapi, query: { method: scan-wifi-results } }
    expect: *value
    returns: value
  connect_wifi_first:
    summary: "Join a Wi-Fi network for the first time (connect-wifi-first)"
    params:
      ssid: &p_ssid { type: string, required: true, max_length: 64, label: Network, description: "The Wi-Fi network's name." }
      password: { type: string, default: "", secret: true, max_length: 128, label: Password, description: "The network's password." }
      security: { type: enum, values: [open, wep, wpa, wpa2, wpa2-eap], required: true, label: Security, description: "Unencrypted, WEP, WPA/PSK, WPA2/PSK or (AIO and Plus) WPA2/EAP." }
      auto: &p_wifi_auto { type: bool, default: true, label: Connect automatically, description: "On joins this network again automatically." }
      hidden: { type: bool, default: false, label: Hidden network, description: "AIO and Plus models: on joins a network that does not broadcast its name." }
      identity: { type: string, default: "", max_length: 128, label: Identity, description: "AIO and Plus models: the identity, for WPA2/EAP." }
    send:
      - { models: *v1, method: GET, path: /usapi, query: { method: connect-wifi-first, name: "{ssid}", passwd: "{password}", secu: "{security:map.wifi_security}", is-auto: "{auto:bool01}" } }
      - { models: *v2, method: GET, path: /usapi, query: { method: connect-wifi-first, name: "{ssid}", passwd: "{password}", secu: "{security:map.wifi_security}", is-auto: "{auto:bool01}",
          is-hide: "{hidden:bool01}", identity: "{identity}" } }
    expect: *ok
    returns: ack
  connect_wifi:
    summary: "Join a saved Wi-Fi network (connect-wifi)"
    params:
      ssid: *p_ssid
      auto: *p_wifi_auto
    send: { method: GET, path: /usapi, query: { method: connect-wifi, name: "{ssid}", is-auto: "{auto:bool01}" } }
    expect: *ok
    returns: ack
  cancel_connect_wifi:
    summary: "Cancel joining a Wi-Fi network (cancel-connect-wifi)"
    params: { ssid: *p_ssid }
    send: { method: GET, path: /usapi, query: { method: cancel-connect-wifi, name: "{ssid}" } }
    expect: *ok
    returns: ack
  disconnect_wifi:
    summary: "Leave the Wi-Fi network (disconnect-wifi)"
    send: { method: GET, path: /usapi, query: { method: disconnect-wifi } }
    expect: *ok
    returns: ack
  forget_wifi:
    summary: "Forget a saved Wi-Fi network (forget-wifi)"
    params: { ssid: *p_ssid }
    send: { method: GET, path: /usapi, query: { method: forget-wifi, name: "{ssid}" } }
    expect: *ok
    returns: ack
  set_wifi_auto_connect:
    summary: "Join a saved Wi-Fi network automatically, or not (set-connect-wifi-auto)"
    params:
      ssid: *p_ssid
      auto: { type: bool, required: true, label: Connect automatically, description: "On joins this network automatically." }
    send: { method: GET, path: /usapi, query: { method: set-connect-wifi-auto, name: "{ssid}", is-auto: "{auto:bool01}" } }
    expect: *ok
    returns: ack
  clear_connect_wifi:
    summary: "Put the Wi-Fi connection status back to its initial state after a first connection failed (clear-connect-wifi)"
    send: { method: GET, path: /usapi, query: { method: clear-connect-wifi } }
    expect: *ok
    returns: ack

  # ── Firmware ──────────────────────────────────────────────────────────
  upload_firmware:
    summary: "Upload a .mwf firmware file; answers its version and whether the running firmware is the latest (upload-update-file, multipart file upload)"
    params:
      file: { type: binary, required: true, label: Firmware, description: "The .mwf file's contents, given as base64 or as a host file." }
      file_name: { type: string, default: firmware.mwf, max_length: 255, label: File name, description: "The file name sent with the upload." }
    send:
      method: POST
      path: /usapi
      query: { method: upload-update-file }
      multipart: [{ name: file, binary: file, filename: "{file_name}", content_type: application/octet-stream }]
    # This one answers status, not result.
    expect: { status: 200, code_path: "$.status", code_range: [0, 0], json_path: "$" }
    returns: value
  update_firmware:
    summary: "Install the uploaded firmware, or download and install the latest; the device restarts (update)"
    params:
      mode: { type: enum, values: [upload, online], required: true, label: Source, description: "The file uploaded with upload_firmware, or the latest found online." }
    send: { method: GET, path: /usapi, query: { method: update, mode: "{mode}" } }
    expect: *ok
    returns: ack
  cancel_firmware_download:
    summary: "Cancel downloading firmware during an online update (cancel-download)"
    send: { method: GET, path: /usapi, query: { method: cancel-download } }
    expect: *ok
    returns: ack
  check_firmware_online:
    summary: "Look for newer firmware online; the result appears in the status (online-update-check)"
    send: { method: GET, path: /usapi, query: { method: online-update-check } }
    expect: *ok
    returns: ack
  clear_firmware_check:
    summary: "Put the firmware check status back to its initial state (clear-check-update)"
    send: { method: GET, path: /usapi, query: { method: clear-check-update } }
    expect: *ok
    returns: ack
  clear_firmware_update:
    summary: "Put the firmware update status back to its initial state after a failed update (clear-upgrade)"
    send: { method: GET, path: /usapi, query: { method: clear-upgrade } }
    expect: *ok
    returns: ack
  set_auto_check_update:
    summary: "Look for new firmware regularly, or not (set-enable-check-update)"
    params:
      enabled: { type: bool, required: true, label: Check for updates, description: "On checks for new firmware automatically." }
    send: { method: GET, path: /usapi, query: { method: set-enable-check-update, is-check-update: "{enabled:bool01}" } }
    expect: *ok
    returns: ack

  # ── EDID (models with HDMI) ───────────────────────────────────────────
  get_edid_config:
    summary: "The HDMI input's EDID options and EDID as base64 (get-edid-config)"
    send: { method: GET, path: /usapi, query: { method: get-edid-config } }
    expect: *value
    returns: value
  set_edid_config:
    summary: "HDMI input EDID options: smart EDID, keep the last loop-through EDID, force audio, limit the pixel clock (set-edid-config)"
    params:
      smart: { type: bool, required: true, label: Smart EDID, description: "On builds the EDID from the loop-through display's." }
      keep_last: { type: bool, required: true, label: Keep last, description: "On keeps using the last loop-through EDID when no display is attached." }
      add_audio: { type: bool, required: true, label: Force audio, description: "On always advertises audio." }
      limit_pixel_clock: { type: bool, required: true, label: Limit pixel clock, description: "On limits the advertised pixel clock." }
    send: { method: GET, path: /usapi, query: { method: set-edid-config, smart-edid: "{smart:bool01}", keep-last: "{keep_last:bool01}", add-audio: "{add_audio:bool01}",
            limit-pixel-clock: "{limit_pixel_clock:bool01}" } }
    expect: *ok
    returns: ack
  import_edid:
    summary: "Load an EDID file into the HDMI input (import-edid, multipart file upload)"
    params:
      file: { type: binary, required: true, label: EDID, description: "The EDID's bytes, given as base64 or as a host file." }
      file_name: { type: string, default: edid.bin, max_length: 255, label: File name, description: "The file name sent with the upload." }
    send:
      method: POST
      path: /usapi
      query: { method: import-edid }
      multipart: [{ name: file, binary: file, filename: "{file_name}", content_type: application/octet-stream }]
    expect: *ok
    returns: ack
  reset_edid:
    summary: "Put the HDMI input's EDID back to the default; answers the default EDID (set-default-edid)"
    send: { method: GET, path: /usapi, query: { method: set-default-edid } }
    expect: *value
    returns: value
  get_loop_through_edid:
    summary: "The EDID of the display on the HDMI loop-through, as base64 (get-loop-through-edid)"
    send: { method: GET, path: /usapi, query: { method: get-loop-through-edid } }
    expect: *value
    returns: value

  # ── Control Hub (cloud) ───────────────────────────────────────────────
  get_cloud_status:
    summary: "The two Control Hub (cloud) slots: address, ports, registration and online status (cloud-status)"
    send:
      - { models: *v1, method: GET, path: /usapi, query: { method: cloud-status, version: "1" } }
      - { models: *v2, endpoint: cloud, method: GET, path: /cloud-api, query: { method: cloud-status, version: "1" } }
    expect: *value
    returns: value
  register_cloud:
    summary: "Register with a Control Hub (cloud) in slot 0 or 1 with its invitation code (cloud-reg-ex, Control Hub API port)"
    params:
      slot: &p_cloud_slot { type: int, min: 0, max: 1, required: true, label: Slot, description: "Control Hub slot 0 or 1; a device registers with two at most." }
      code: { type: string, required: true, secret: true, pattern: "^[0-9A-Za-z]{4}$", label: Invitation code, description: "The 4-character invitation code the Control Hub gives." }
      address: { type: string, required: true, max_length: 255, label: Control Hub address, description: "The Control Hub's IP address or domain." }
      http_port: { type: int, min: 1, max: 65535, default: 80, label: HTTP port, description: "The Control Hub's HTTP port." }
      https: { type: bool, default: false, label: HTTPS, description: "On connects to the Control Hub over HTTPS." }
      https_port: { type: int, min: 1, max: 65535, default: 443, label: HTTPS port, description: "The Control Hub's HTTPS port." }
    send: { endpoint: cloud, method: GET, path: /cloud-api, query: { method: cloud-reg-ex, id: "{slot}", cloud-code: "{code}", cloud-ip-addr: "{address}",
            cloud-http-port: "{http_port}", cloud-enable-https: "{https:bool01}", cloud-https-port: "{https_port}" } }
    expect: *ok
    returns: ack
  unregister_cloud:
    summary: "Leave the Control Hub in slot 0 or 1 (cloud-unreg-ex, Control Hub API port)"
    params: { slot: *p_cloud_slot }
    send: { endpoint: cloud, method: GET, path: /cloud-api, query: { method: cloud-unreg-ex, id: "{slot}" } }
    expect: *ok
    returns: ack

