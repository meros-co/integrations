spec: 1
id: magewell-ultra-encode
name: Magewell Ultra Encode
vendor: Magewell
category: recorder

source:
  - title: "Magewell Ultra Encode API (unversioned; pages dated 2022-05-10, rebuilt 2025-05-29; examples from firmware 1.3.328 to 1.3.540)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/ultra-encode-api/"
    note: >
      Manufacturer-documented, public (PDF at
      /api-docs/ultra-encode-api/ultra-encode-api-en_US.pdf). Applies to the
      Ultra Encode HDMI and SDI. Retrieved 2026-10-23. API Agreement (GET
      http://IP/usapi?method=<name>&..., POST for file uploads, JSON with an
      integer result, the sid cookie), API Status Codes, Cloud API Status
      Codes, Device Status Mask, Device Discovery Protocol; Universal
      Interfaces (get-info, get-status, get-settings, ping, get-signal-info,
      get-report, export-report); General Settings (set-name,
      set-first-over, set-softap, set-ssdp, set-volume, set-video-color,
      set-video-input-format, set-video-output-format, set-sync-offset, the
      no-signal image methods, set-time-zone, set-date-time, set-udp-mtu);
      Streaming Server (add-server, enable-server, set-server, del-server,
      the stream test, get-ndi-sources); Encoding Parameters (set-video,
      set-audio, enable-deinterlace); reboot, reset-all-settings; login,
      logout; User Management; Network Settings; Firmware Update; EDID;
      Cloud (cloud-reg-ex and cloud-unreg-ex on port 8070 under /cloud-api,
      cloud-status under /usapi).
  - title: "Magewell Ultra Encode AIO API (unversioned; pages dated 2026-04-09; methods marked up to V2.4; examples from firmware 2.0.312)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/ultra-encode-aio-api/"
    note: >
      Manufacturer-documented, public (PDF at
      /api-docs/ultra-encode-aio-api/ultra-encode-aio-api-en_US.pdf).
      Retrieved 2026-10-23. The same agreement, login and status codes
      (with -55 to -58 added), the Device Status Mask with the recording,
      disk and upload bits; Universal Interfaces adding get-logs,
      export-logs, clear-logs, start-live, stop-live, clear-live, start-rec,
      stop-rec, clear-rec (V2.1); General Settings adding
      set-analog-mic-bias, set-web, the certificate methods, set-theme,
      set-hls-push-segment, set-lcd-control, set-live-keep-last,
      set-ndi-bridge-config, the token methods and the Zixi ZEN Master
      methods; Input (set-video-mixer-config, select-input-source,
      get-signal-info with input-device, set-video-color,
      set-video-input-format and set-video-output-format with input-device,
      set-audio-mixer-config, enable-4k60-input); Encode (set-video with
      rotation, set-audio per audio stream, select-audio-channels,
      set-enable-stream1, set-in-cropping, set-crop, set-3d-output-config,
      set-audio-stream-count); Live (add-server and set-server with Wowza,
      TVU, YouTube HLS, Zixi and RIST, set-ndi-find-config,
      enable-ndi-hx3); Record (channels, NAS, set-auto-rec); Storage Device
      (media files, disk format and test, and the methods deprecated at
      V2.2); Uploading Files; Overlay; Scheduler; import-settings,
      export-settings; ch-passwd and set-passwd; set-net-prior,
      enable-station, set-rndis-config; Control Hub (every Control Hub
      method on port 8070 under /cloud-api).
  - title: "Magewell Ultra Encode Plus API (unversioned; pages dated 2026-04-09)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/ultra-encode-plus-api/"
    note: >
      Manufacturer-documented, public. Applies to the Ultra Encode HDMI
      Plus, SDI Plus and their Modules. Retrieved 2026-10-23: every page is
      word for word the Ultra Encode AIO API's, except that
      enable-4k60-input is absent; the pages still mark
      select-input-source, set-video-mixer-config and set-lcd-control as
      Ultra Encode AIO only, and set-3d-output-config as Ultra Encode Plus
      only.
  - title: "Ultra Encode API demos (ultra-encode-api-demo-c.zip, ultra-encode-api-demo-nodejs.zip)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/demo/ultra-encode-api-demo-nodejs.zip"
    note: >
      Linked from the API documents' DEMO pages; read as corroboration only.
      They log in with GET login and the MD5 of Admin, send the Set-Cookie
      value back as Cookie, and upload a .mwf firmware file to
      upload-update-file as multipart/form-data in a part named file with
      its file name and application/octet-stream.
  - title: "companion-module-magewell-ultrastream (Bitfocus Companion module, Ultra Stream)"
    author: Bitfocus
    url: "https://github.com/bitfocus/companion-module-magewell-ultrastream"
    note: >
      Community source (MIT license) for the sibling Ultra Stream, which
      shares the /usapi agreement; read as corroboration only: it sends the
      session cookie on every request and logs in again when a request
      answers result -17 (errNeedAuth) or -1 (errPasswd).

settings:
  username:
    type: string
    default: Admin
    max_length: 64
    label: User name
    description: "The user the core logs in as; Admin by default."
  password:
    type: string
    secret: true
    default: Admin
    max_length: 64
    label: Password
    description: "That user's password; the core sends only its MD5 hash."
  scheme:
    type: enum
    values: [http, https]
    default: http
    label: Scheme
    description: "http, or https on the AIO and Plus models once HTTPS is turned on (set_web); the certificate is not checked."
  cloud_port:
    type: int
    min: 1
    max: 65535
    default: 8070
    label: Control Hub API port
    description: "Port of the device's Control Hub (cloud) API, which takes the registration methods; 8070 as the documents give it."

ports:
  - { port: 80, protocol: http, role: control, when: "scheme http", note: "the web server's port, changeable on the AIO and Plus models (set_web)" }
  - { port: 443, protocol: https, role: control, setting: scheme, when: "scheme https", note: "AIO and Plus models with HTTPS turned on" }
  - { port: 8070, protocol: http, role: control, setting: cloud_port, note: "the Control Hub (cloud) API: registration, and the status on the AIO and Plus models" }
  - { port: 8080, protocol: http, role: control, note: "not used by this integration: the download server for recorded files (http://ip:8080/download/<path>)" }
  - { port: 2538, protocol: udp, role: discovery, note: "not used by this integration: the multicast discovery protocol on 239.255.255.250:2538" }

# One API for every model: GET /usapi?method=<name>&<args>, a JSON reply
# with an integer result, 0 for success, and the session in the sid cookie.
# The HDMI and SDI models answer the Ultra Encode API, the AIO and Plus
# models the AIO and Plus APIs (the same methods, more of them, and a few
# with other parameters); each message names the models it is for where the
# two differ.
transport:
  type: http
  port: 80
  https_port: 443
  scheme: { setting: scheme }
  accept_invalid_certs: true
  # Uploads (firmware, about 12 MB) are answered after the device has
  # checked the file.
  timeout_ms: 10000
  # ping answers without a login (Universal Interfaces, ping).
  probe: { method: GET, path: /usapi, query: { method: ping } }
  endpoints:
    # Control Hub API: GET http://ip:8070/cloud-api?method=... (Cloud).
    cloud:
      port: { setting: cloud_port }
      scheme: http
      auth: none
  # login: id and the MD5 of the password; the session ID comes back in the
  # sid cookie and goes back as a cookie on every later request (every
  # cookie the login sets, sid among them).
  session:
    login: { method: GET, path: /usapi, query: { method: login, id: "{settings.username}", pass: "{settings.password:md5}" } }
    capture: { cookie: "*" }
    # -17 errNeedAuth "unauthorized log-in": the session has ended.
    relogin: { status: [401], json: { "$.result": "^-17$" } }
    # 36 "the username or password is incorrect" (login page), -1 errPasswd,
    # -25 errNoUser.
    refused: { status: [401, 403], json: { "$.result": "^(36|-1|-25)$" } }

# API Status Codes 1-31 (both documents), and the Control Hub API's own
# codes 35, 36 and 101-104. The error codes are negative, which `codes`
# cannot hold: a quirk lists them, and a failure carries the code.
codes:
  "31": "send waiting"
  "30": "live stream authentication error"
  "29": "live stream address not set"
  "28": "live stream resolving DNS"
  "27": "initial state"
  "25": "live stream authorizing"
  "24": "live stream waiting for connection"
  "23": "live stream connecting"
  "22": "live stream connected"
  "21": "reboot pushed"
  "20": "audio signal changed"
  "16": "disk on"
  "15": "disk off"
  "14": "disk changed"
  "13": "snapshot over"
  "12": "reset pushed"
  "11": "live pushed"
  "10": "record pushed"
  "9": "signal changed"
  "8": "route changed"
  "7": "IP changed"
  "6": "network changed"
  "5": "request canceled"
  "4": "low space"
  "3": "low speed"
  "2": "request is being processed"
  "1": "repeated request"
  "35": "Control Hub online"
  "36": "Control Hub offline (login: wrong user name or password)"
  "101": "Control Hub registration accepted"
  "102": "Control Hub registration refused"
  "103": "Control Hub registration waiting"
  "104": "Control Hub registration deleted"

