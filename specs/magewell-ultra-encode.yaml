            mtu: "{mtu}", net-mode: "{net_mode:map.net_mode}", audio-streams: "{audio_streams}", is-custom-pid: "{custom_pid:bool01}", pmt-pid: "{pmt_pid}", pcr-pid: "{pcr_pid}",
