            max-connection: "{max_connections}", latency: "{latency}", bandwidth: "{bandwidth}", aes: "{encryption:map.rist_aes}", ase-word: "{passphrase}", mtu: "{mtu}",
            audio-streams: "{audio_streams}", is-custom-pid: "{custom_pid:bool01}", pmt-pid: "{pmt_pid}", pcr-pid: "{pcr_pid}", video-pid: "{video_pid}", audio-pid: "{audio_pid}" } }
