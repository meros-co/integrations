          port: "{port}", latency: "{latency}", bandwidth: "{bandwidth}", aes: "{encryption:map.srt_aes}", ase-word: "{passphrase}", stream-id: "{stream_id}",
          net-mode: "{net_mode:map.net_mode}" } }
      - { models: *v2, method: GET, path: /usapi, query: { method: start-test-server, type: "120", name: "{name}", stream-index: "{stream:map.stream_index}", url: "{address}",
          port: "{port}", latency: "{latency}", bandwidth: "{bandwidth}", aes: "{encryption:map.srt_aes}", ase-word: "{passphrase}", stream-id: "{stream_id}",
