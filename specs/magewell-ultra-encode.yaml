quirks:
  - models: [all]
    severity: critical
    text: >
      reboot stops streaming and recording until the device is back;
      reset_all_settings erases every setting and restarts; update_firmware
      installs firmware and restarts; import_settings replaces the
      configuration; start_disk_format, format_usb_legacy and
      format_sd_legacy erase the drive with no way back or to cancel;
      delete_media_files, delete_server, delete_rec_channel, delete_nas,
      delete_upload_server, delete_overlay, delete_overlay_image,
      delete_schedule, delete_nosignal_image, delete_user, delete_token and
      clear_logs cannot be undone; set_network_static, set_network_dhcp,
      set_web and set_usb_network move the device to another address or
      port, where the core no longer reaches it until it is opened there. None
      asks for confirmation.

  - models: [all]
    severity: warning
    text: >
      The API has no push. The core polls get-status every 2 seconds;
      get-signal-info (and the upload progress on the AIO and Plus models)
      every 10 seconds; get-settings, the users, NDI sources, EDID, Control
      Hub status and (AIO and Plus) the recording channels, overlays,
      images, schedules and tokens every 30 seconds; and get-info every 5
      minutes. What a command changes is read again as soon as the device
      answers it with result 0. Opened for commands only, the core polls
      nothing and checks the device with ping, which needs no login. The core
      logs in (GET login with the MD5 of the password, the sid cookie) before
      the first request that needs a session and again whenever a request
      answers result -17 (not logged in) or HTTP 401, repeating that request
      once; a refused login (result 36, -1 or -25, or HTTP 401 or 403) is
      final until the settings are corrected. The device lets two apps lock
      it at once (status mask 0x20000).

  - models: [all]
    severity: warning
    text: >
      Secrets the device reports are not kept in state: get-settings returns
      the access point password, the streaming servers' keys, passwords,
      tokens and passphrases, and the upload servers' credentials, and
      get-tokens the tokens themselves. get_settings and get_tokens return
      them to the caller; state keeps everything else, the token's user and
      expiry included.

  - models: [hdmi, sdi]
    severity: warning
    text: >
      get-status lists the live sessions without an id, so live.sessions is
      kept by position in that list; that the positions follow get-settings'
      stream-server order is not documented. The HDMI and SDI models have no
      start-live: enable_server is how streaming to a server is turned on.
      The gains of set_volume are sent in dB with two decimals, as get-info's
      ranges are written (6.00, -100.00).

  - models: [hdmi-plus, sdi-plus, aio]
    severity: warning
    text: >
      The audio gains are sent and read in hundredths of a dB (get-info's
      audio-range gives +6 dB as 600), where set-volume's page says dB.
      get-settings shows nothing for set-ndi-bridge-config,
      set-zen-master-config, set-live-keep-last, set-ndi-find-config,
      set-audio-mixer-config, enable-4k60-input, set-audio-stream-count,
      set-crop, select-audio-channels, set-net-prior, enable-station and
      send-file-set-is-auto, and the documents name no other read for them,
      so their values are not in state; get_settings returns the whole reply
      should the firmware report them. set-video-color takes no input-device
      though get-settings reports the color per input; which input it
      changes is not documented. set-image takes only reserved fields and is
      not offered.

  - models: [all]
    severity: info
    text: >
      One API serves every model (GET /usapi?method=<name>, a JSON result,
      the sid cookie); where the AIO and Plus APIs differ from the Ultra
      Encode API (get-signal-info, set-volume, set-video-input-format and
      set-video-output-format take input-device; set-video takes rotation;
      add-server and set-server take audio, PIDs and more types; add-user
      takes is-admin; ch-passwd and set-passwd are renamed; connect-wifi-first
      takes is-hide and identity; cloud-status is on the Control Hub port)
      each command sends what the model's document gives. The Plus API's
      pages are the AIO API's word for word without enable-4k60-input; the
      commands those pages mark AIO only (select_input_source,
      set_video_mixer, set_lcd_control) are offered on the AIO, and
      set_3d_output (Plus only) on the Plus models. The EDID commands are
      offered on the models with an HDMI input. The Control Hub API (port
      8070, /cloud-api) is sent without the session.

  - models: [all]
    severity: info
    text: >
      Several states end in a result the device keeps until it is cleared:
      after a stream test (clear_server_test, the test also stops itself
      after 20 s), a firmware check or update (clear_firmware_check,
      clear_firmware_update), a disk format or test (clear_disk_format,
      clear_disk_test), a first Wi-Fi connection (clear_connect_wifi),
      live streaming and recording (clear_live, clear_recording,
      clear_rec_channel_status) and an upload test
      (clear_upload_server_test); each puts its status back to 27 (initial).
      Status codes of 1 and above that are not 0 fail a command with their
      text (1 repeated request, 2 in progress).

  - models: [all]
    severity: info
    text: >
      Not offered, as the format cannot express them: downloading recorded
      files from the device's download server
      (http://ip:8080/download/<path>), and reading the snapshot and
      thumbnail images get-info and get-media-files name (their device
      paths are in state). export-report, export-logs, export-edid and
      export-loop-through-edid save a file through the browser; get_report,
      get_logs, get_edid_config and get_loop_through_edid return the same
      content. export_settings returns the exported configuration as text.
      The multicast discovery protocol (239.255.255.250:2538) and SSDP are
      not used. Uploads are multipart/form-data with the file in a part named
      file, as the vendor's demos send firmware; a large upload is answered
      within the 10 second timeout only if the device checks it that fast.

  - models: [all]
    severity: info
    text: >
      Where the documents disagree, the spec follows the method's own page:
      add-surface and set-surface take the overlay kind as type (the
      example URL and get-info) where their tables say class; add-scheduler
      numbers its repeat patterns from 0 (daily) and set-scheduler from 1;
      the weekly interval is sent as repeat-interval where the tables write
      repeat-is-interval; set-video takes rotation as 0, 90, 180 or 270
      though get-info lists 0 to 3; set-lcd-control's no-touch and no-flip
      are sent with 1 for enabled as the page gives it. The login page
      gives 36 for a wrong password and the status table -1; both, and -25
      (no such user), are taken as a refusal. The status mask's 0x02
      (recording), 0x04 (streaming) and 0x10 (disk ready) are marked
      reserved in the documents and kept as the device sends them.

  - models: [all]
    severity: info
    text: >
      The API's error codes are negative, which the spec's code table
      cannot hold, so a command failing with one reports the code with the
      device's reply rather than its text. The codes, from API Status
      Codes and Control Hub API Status Codes: -1 wrong password (Control
      Hub: invitation code error); -2 device occupied; -3 disconnected; -4
      device error (Control Hub: unsupported device); -5 disk error; -6
      not connected; -7 key error; -8 version error; -9 system busy; -10
      incorrect request parameters; -11 usage error; -12 timeout; -13 IP
      error; -14 data not found; -15 file error; -16 not enough space; -17
      not logged in; -18 system error; -19 disk too slow; -20 empty; -21
      network error; -22 event error; -23 codec error; -24 Bluetooth
      error; -25 user does not exist; -26 no permission; -27 name already
      in use; -28 invalid input characters; -29 at most 6 streaming
      sessions at a time; -30 8M limited; -31 Facebook limited; -32 codec
      limited; -33 4G limited; -34 update package does not match this
      model or hardware version; -35 no signal; -36 SD card error; -37
      server error; -38 storage service error; -39 SD card full; -40 SD
      card not writable; -41 only one RTSP session at a time; -42 RTSP 8M
      limited; -43 bandwidth limited; -44 stream port occupied; -45 only
      one NDI|HX session at a time; -46 only one SRT Listener session at a
      time; -47 the sub stream can be up to 640x480@60 for an NDI|HX
      session; -48 the sub stream can be up to 1280x720@30 for a
      non-NDI|HX session; -49 only one HLS session at a time; -50 too many
      sessions over the same streaming protocol; -51 failed to initialize
      channels for live streaming; -52 deinterlace settings error; -53
      only one TVU ISSP session at a time; -54 only one session of this
      protocol at a time; -55 the main stream is limited to 30 fps above
      2048x1080; -56 the main stream is limited to 30 fps for an input
      above 2048x1080; -57 scheduler error; -58 NAS mount point error;
      -109 invalid serial number; -200 the device is not logged in to the
      Control Hub.
