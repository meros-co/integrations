  quant_range: { full: "1", limited: "2" }
  sat_range: { full: "1", limited: "2", extended: "3" }
  input_device: { sdi: "1", hdmi: "2" }
  input_source: { sdi: "1", hdmi: "2", auto: "3", mixer: "4" }
  mixer_type: { pip: "0", side-by-side: "1" }
