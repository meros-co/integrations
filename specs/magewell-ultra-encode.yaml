      latency: { type: int, min: 0, max: 100000, required: true, label: Latency, description: "Latency in ms, within get-info's range." }
      fec_overhead: { type: int, min: 0, max: 100, required: true, label: FEC overhead, description: "FEC overhead in percent, within get-info's range." }
      encryption: *p_srt_aes
      passphrase: *p_passphrase
      ignore_tls_errors: { type: bool, default: false, label: Ignore TLS errors, description: "On accepts a TLS certificate that does not check." }
      audio_streams: *p_audio_mask
    send: { method: GET, path: /usapi, query: { method: add-server, type: "144", name: "{name}", stream-index: "{stream:map.stream_index}", links: "{links}", bond-links: "{bond:bool01}",
            stream-id: "{stream_id}", passwd: "{password}", latency: "{latency}", fec-overhead: "{fec_overhead}", aes: "{encryption:map.srt_aes}", ase-word: "{passphrase}",
            ignore-tls-cert-error: "{ignore_tls_errors:bool01}", audio-streams: "{audio_streams}" } }
    expect: *ok
    returns: ack
  set_zixi_server:
    summary: "Change a Zixi destination (set-server type 144)"
    params:
      id: *p_server_id
      name: *p_name
      stream: *p_stream
      links: *p_zixi_links
      bond: { type: bool, default: false, label: Bond links, description: "On bonds the links." }
      stream_id: { type: string, required: true, max_length: 512, label: Stream ID, description: "The Zixi stream ID." }
      password: *p_password
      latency: { type: int, min: 0, max: 100000, required: true, label: Latency, description: "Latency in ms, within get-info's range." }
