        "inputs.{key}.signal.frame_rate": "{fr}"
        "inputs.{key}.signal.audio_channels": "{ch}"
        "inputs.{key}.signal.audio_lpcm": "{lpcm:bit.0}"
        "inputs.{key}.signal.audio_bits": "{bits}"
        "inputs.{key}.signal.audio_sample_rate": "{sr}"
    # Live sessions: by position on the HDMI and SDI models, whose entries
    # carry no id; by server id on the AIO and Plus.
    - models: *v1
      path: "^/usapi\\?method=get-status$"
      json_match: { "$.result": "^0$" }
      json_each: "$.live-status.live"
      json: { result: "$.result", run: "$.run-ms", bps: "$.cur-bps", avg: "$.avg-bps", net: "$.net", result2: "$.result2", bps2: "$.cur-bps2", net2: "$.net2" }
      replace: live.sessions
      state:
        "live.sessions.{index}.result": "{result}"
        "live.sessions.{index}.run_ms": "{run}"
        "live.sessions.{index}.bps": "{bps}"
        "live.sessions.{index}.avg_bps": "{avg}"
        "live.sessions.{index}.net": "{net}"
        "live.sessions.{index}.result2": "{result2}"
        "live.sessions.{index}.bps2": "{bps2}"
        "live.sessions.{index}.net2": "{net2}"
    - models: *v2
      path: "^/usapi\\?method=get-status$"
      json_match: { "$.result": "^0$" }
      json_each: "$.live-status.live"
      json: { id: "$.id", type: "$.type", name: "$.name", use: "$.is-use", skd: "$.is-skd-runnung", run: "$.run-ms", result: "$.result",
              main: "$.main-inst-bps", sub: "$.sub-inst-bps" }
      replace: live.status
      state:
        "live.status.{id}.type": "{type}"
        "live.status.{id}.name": "{name}"
        "live.status.{id}.enabled": "{use:bit.0}"
        "live.status.{id}.scheduled": "{skd:bit.0}"
        "live.status.{id}.run_ms": "{run}"
        "live.status.{id}.result": "{result}"
        "live.status.{id}.main_bps": "{main}"
        "live.status.{id}.sub_bps": "{sub}"
    - path: "^/usapi\\?method=get-status$"
      json_match: { "$.result": "^0$", "$.rec-status.rec": "^\\[" }
      json_each: "$.rec-status.rec"
      json: { id: "$.id", type: "$.type", use: "$.is-use", skd: "$.is-skd-runnung", result: "$.result", run: "$.run-ms", parts: "$.parted-num",
              vf: "$.video-frame-count", af: "$.audio-frame-count" }
      replace: record.status
      state:
        "record.status.{id}.type": "{type}"
        "record.status.{id}.enabled": "{use:bit.0}"
        "record.status.{id}.scheduled": "{skd:bit.0}"
        "record.status.{id}.result": "{result}"
        "record.status.{id}.run_ms": "{run}"
        "record.status.{id}.parts": "{parts}"
        "record.status.{id}.video_frames": "{vf}"
        "record.status.{id}.audio_frames": "{af}"
    - path: "^/usapi\\?method=get-status$"
      json_match: { "$.result": "^0$", "$.disk-info": "^\\[" }
      json_each: "$.disk-info"
      json: { type: "$.disk-type", mask: "$.disk-status", total: "$.total-size", used: "$.used-size" }
      replace: storage.disks
      state:
        "storage.disks.{type}.status_mask": "{mask}"
        "storage.disks.{type}.total_bytes": "{total}"
        "storage.disks.{type}.used_bytes": "{used}"
    - path: "^/usapi\\?method=get-status$"
      json_match: { "$.result": "^0$", "$.nas": "^\\[" }
      json_each: "$.nas"
      json: { id: "$.id", type: "$.type", result: "$.result" }
      replace: storage.nas_status
