  time_format: { ymd-hms: "0", mdy-hms: "1", dmy-hms: "2", ymd: "3", mdy: "4", dmy: "5", hms: "6", hm: "7" }
  schedule_channel: { live: "0", record: "1", reboot: "2" }
  calendar_channel: { live: "0", record: "1" }
  # add-scheduler numbers the repeat patterns from 0, set-scheduler from 1
  # (0 being no repeat there).
  repeat_add: { daily: "0", weekly: "1", monthly: "2", yearly: "3" }
  repeat_set: { daily: "1", weekly: "2", monthly: "3", yearly: "4" }
  end_event: { never: "0", count: "1", date: "2" }
  weekday: { monday: "0", tuesday: "1", wednesday: "2", thursday: "3", friday: "4", saturday: "5", sunday: "6" }

conversions:
  # The AIO and Plus models give audio gains in hundredths of a dB
  # (get-info audio-range: 600 for +6.00 dB).
  db_x100:
    points: [[-20000, -200.0], [0, 0.0], [20000, 200.0]]
  # get-status cpu-temperature: thousandths of a degree Celsius (61100).
  milli:
    points: [[-100000, -100.0], [0, 0.0], [300000, 300.0]]

