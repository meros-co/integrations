    params:
      name: *p_name
      stream: *p_stream
      links: &p_zixi_links { type: string, required: true, max_length: 1024, pattern: "^[^;,]+,[0-9]+,[0-9]+,[0-9]+,[01](;[^;,]+,[0-9]+,[0-9]+,[0-9]+,[01])*$", label: Links,
        description: "Each link as host,port,network,maximum kbit/s,backup (0 or 1), links separated by semicolons, e.g. 10.10.35.34,2088,0,8192,0." }
      bond: { type: bool, default: false, label: Bond links, description: "On bonds the links." }
