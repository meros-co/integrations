commands:
  # ── Universal Interfaces ──────────────────────────────────────────────
  ping:
    summary: "Check the device is ready; needs no login (ping)"
    send: { method: GET, path: /usapi, query: { method: ping }, session: false }
    # Every reply: HTTP 200 and result 0; any other result fails with its code.
    expect: &ok { status: 200, code_path: "$.result", code_range: [0, 0] }
    returns: ack
  get_info:
    summary: "Product, firmware, MAC addresses, snapshot paths and every parameter range the settings take (get-info)"
    send: { method: GET, path: /usapi, query: { method: get-info } }
    expect: &value { status: 200, code_path: "$.result", code_range: [0, 0], json_path: "$" }
    returns: value
  get_status:
    summary: "Running status: status mask, input signal, live and recording sessions, firmware update, tests, storage, networks, audio meters (get-status)"
    send: { method: GET, path: /usapi, query: { method: get-status } }
    expect: *value
    returns: value
  get_settings:
    summary: "Every setting: name, video and audio encoding, streaming servers, networks, no-signal images, and on the AIO and Plus models recording, NAS, upload servers, web, time and LCD (get-settings)"
    send: { method: GET, path: /usapi, query: { method: get-settings } }
    expect: *value
    returns: value
  get_signal_info:
    summary: "The input signal's video, audio and HDMI timing (get-signal-info; input-device on the AIO and Plus models)"
    params:
      input: &p_input_device { type: enum, values: [hdmi, sdi], default: hdmi, label: Input,
        description: "AIO and Plus models: the input to read or change; the HDMI and SDI models have one input and take no choice." }
    send:
      - { models: &v1 [hdmi, sdi], method: GET, path: /usapi, query: { method: get-signal-info } }
      - { models: &v2 [hdmi-plus, sdi-plus, aio], method: GET, path: /usapi, query: { method: get-signal-info, input-device: "{input:map.input_device}" } }
    expect: *value
    returns: value
  get_report:
    summary: "The device report as HTML: device, status and settings sections (get-report)"
    send: { method: GET, path: /usapi, query: { method: get-report } }
    expect: { status: 200 }
    returns: text
  export_settings:
    summary: "The configuration file the device exports, JSON for import_settings (export-settings)"
    params:
      file_name: { type: string, default: settings.json, max_length: 255, label: File name,
        description: "The file name the device is asked to export as; the configuration comes back as the command's text." }
    send: { method: GET, path: /usapi, query: { method: export-settings, file-name: "{file_name}" } }
    expect: { status: 200 }
    returns: text
  import_settings:
    summary: "Load a configuration file exported from this or another unit, replacing the settings (import-settings, multipart file upload)"
    params:
      file: &p_file { type: binary, required: true, label: File, description: "The file's contents, given as base64 or as a host file." }
      file_name: { type: string, default: settings.json, max_length: 255, label: File name,
        description: "The file name sent with the upload." }
    send:
      method: POST
      path: /usapi
      query: { method: import-settings }
      multipart: [{ name: file, binary: file, filename: "{file_name}", content_type: application/octet-stream }]
    expect: *ok
    returns: ack
  reboot:
    summary: "Restart the device; streaming and recording stop until it is back (reboot)"
    send: { method: GET, path: /usapi, query: { method: reboot } }
    expect: *ok
    returns: ack
  reset_all_settings:
    summary: "Put every setting back to its default and restart (reset-all-settings)"
    send: { method: GET, path: /usapi, query: { method: reset-all-settings } }
    expect: *ok
    returns: ack
  get_logs:
    summary: "System logs, up to 1000 records, each with type, time and message; administrators only (get-logs)"
    params:
      types: { type: string, default: all, max_length: 64, pattern: "^(all|info|warn|error)(,(all|info|warn|error))*$", label: Log types,
        description: "all, or info, warn and error separated by commas." }
    send: { method: GET, path: /usapi, query: { method: get-logs, types: "{types}" } }
    expect: *value
    returns: value
  clear_logs:
    summary: "Delete every system log record; administrators only (clear-logs)"
    send: { method: GET, path: /usapi, query: { method: clear-logs } }
    expect: *ok
    returns: ack
  start_live:
    summary: "Start live streaming on every enabled streaming server (start-live)"
    send: { method: GET, path: /usapi, query: { method: start-live } }
    expect: *ok
    returns: ack
  stop_live:
    summary: "Stop live streaming (stop-live)"
    send: { method: GET, path: /usapi, query: { method: stop-live } }
    expect: *ok
    returns: ack
  clear_live:
    summary: "Put the live status back to its initial state after streaming ended or failed (clear-live)"
    send: { method: GET, path: /usapi, query: { method: clear-live } }
    expect: *ok
    returns: ack
  start_recording:
    summary: "Start recording on every enabled recording channel (start-rec)"
    send: { method: GET, path: /usapi, query: { method: start-rec } }
    expect: *ok
    returns: ack
  stop_recording:
    summary: "Stop recording (stop-rec)"
    send: { method: GET, path: /usapi, query: { method: stop-rec } }
    expect: *ok
    returns: ack
  clear_recording:
    summary: "Put the recording status back to its initial state after recording ended or failed (clear-rec)"
    send: { method: GET, path: /usapi, query: { method: clear-rec } }
    expect: *ok
    returns: ack

  # ── General settings ──────────────────────────────────────────────────
  set_name:
    summary: "Device name (set-name)"
    params:
      name: &p_name { type: string, required: true, max_length: 32, pattern: "^[A-Za-z0-9._+'()\\[\\]-]([A-Za-z0-9 ._+'()\\[\\]-]{0,30}[A-Za-z0-9._+'()\\[\\]-])?$",
        label: Name, description: "1 to 32 characters: letters, digits, spaces and ._-+'[](), not starting or ending with a space." }
    send: { method: GET, path: /usapi, query: { method: set-name, name: "{name}" } }
    expect: *ok
    returns: ack
  set_first_over:
    summary: "Finish the first-run setup with the device name (set-first-over; the status mask's first-boot bit is set until then)"
    params: { name: *p_name }
    send: { method: GET, path: /usapi, query: { method: set-first-over, name: "{name}" } }
    expect: *ok
    returns: ack
  set_softap:
    summary: "Wi-Fi access point settings: on, visible, SSID and password (set-softap)"
    params:
      enabled: { type: bool, default: true, label: Access point, description: "is-softap, documented as reserved with 1 as its value." }
      visible: { type: bool, default: true, label: Visible, description: "is-visible, documented as reserved with 1 as its value: the SSID is broadcast." }
      ssid: { type: string, required: true, max_length: 32, label: SSID, description: "The access point's network name; the serial number by default." }
      password: { type: string, required: true, secret: true, max_length: 32, pattern: "^[A-Za-z0-9._+'()\\[\\]-]([A-Za-z0-9 ._+'()\\[\\]-]{0,30}[A-Za-z0-9._+'()\\[\\]-])?$",
        label: Password, description: "The access point's password in plain text, 1 to 32 letters, digits, spaces and ._-+'[](), not starting or ending with a space." }
    send: { method: GET, path: /usapi, query: { method: set-softap, is-softap: "{enabled:bool01}", is-visible: "{visible:bool01}", softap-ssid: "{ssid}", softap-passwd: "{password}" } }
    expect: *ok
    returns: ack
  open_softap:
    summary: "Turn the Wi-Fi access point on (open-softap)"
    send: { method: GET, path: /usapi, query: { method: open-softap } }
    expect: *ok
    returns: ack
  close_softap:
    summary: "Turn the Wi-Fi access point off (close-softap)"
    send: { method: GET, path: /usapi, query: { method: close-softap } }
    expect: *ok
    returns: ack
  set_ssdp:
    summary: "Answer UPnP (SSDP) discovery, or not (set-ssdp)"
    params:
      enabled: { type: bool, required: true, label: UPnP, description: "On answers SSDP discovery." }
    send: { method: GET, path: /usapi, query: { method: set-ssdp, is-ssdp: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  set_volume:
    summary: "Gains and mutes: the embedded input audio, the microphone or line in, and the headphone or line out (set-volume)"
    params:
      input_on: { type: bool, required: true, label: Input audio, description: "Off mutes the HDMI or SDI embedded audio (is-spi)." }
      input_gain: { type: float, min: -100.0, max: 6.0, required: true, label: Input gain, description: "Embedded audio gain in dB, -100 to +6 (get-info audio-range)." }
      line_in_on: { type: bool, required: true, label: Line in, description: "Off mutes the microphone (HDMI and SDI models, is-mic) or line in (AIO and Plus, is-linein)." }
      line_in_gain: { type: float, min: -139.0, max: 55.25, required: true, label: Line in gain, description: "Microphone or line in gain in dB, within get-info's mic or linein range." }
      line_out_on: { type: bool, required: true, label: Line out, description: "Off mutes the headphones (HDMI and SDI models, is-phone) or line out (AIO and Plus, is-lineout)." }
      line_out_gain: { type: float, min: -57.0, max: 6.0, required: true, label: Line out gain, description: "Headphone or line out gain in dB, -57 to +6." }
    send:
      - { models: *v1, method: GET, path: /usapi, query: { method: set-volume, is-mic: "{line_in_on:bool01}", mic-gain: "{line_in_gain:.2f}",
          is-spi: "{input_on:bool01}", spi-gain: "{input_gain:.2f}", is-phone: "{line_out_on:bool01}", phone-gain: "{line_out_gain:.2f}" } }
      - { models: *v2, method: GET, path: /usapi, query: { method: set-volume, is-linein: "{line_in_on:bool01}", linein-gain: "{line_in_gain:to.db_x100:.0f}",
          is-spi: "{input_on:bool01}", spi-gain: "{input_gain:to.db_x100:.0f}", is-lineout: "{line_out_on:bool01}", lineout-gain: "{line_out_gain:to.db_x100:.0f}" } }
    expect: *ok
    returns: ack
  set_mic_bias:
    summary: "Microphone bias power on the line in connector (set-analog-mic-bias)"
    params:
      enabled: { type: bool, required: true, label: Mic bias, description: "On powers a microphone on line in." }
    send: { method: GET, path: /usapi, query: { method: set-analog-mic-bias, enable-mic-bias: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  set_audio_mixer:
    summary: "Which audio goes into the encoded audio: the HDMI or SDI audio and the line in (set-audio-mixer-config)"
    params:
      input_audio: { type: bool, required: true, label: Input audio, description: "On mixes the HDMI or SDI audio in (enable-spi-mix)." }
      line_audio: { type: bool, required: true, label: Line audio, description: "On mixes the line audio in (enable-lineout-mix)." }
    send: { method: GET, path: /usapi, query: { method: set-audio-mixer-config, enable-spi-mix: "{input_audio:bool01}", enable-lineout-mix: "{line_audio:bool01}" } }
    expect: *ok
    returns: ack
  set_video_color:
    summary: "Picture adjustment: contrast, brightness, saturation and hue (set-video-color)"
    params:
      contrast: { type: int, min: 50, max: 200, required: true, label: Contrast, description: "Contrast from 50 to 200, 100 unchanged." }
      brightness: { type: int, min: -100, max: 100, required: true, label: Brightness, description: "Brightness from -100 to 100, 0 unchanged." }
      saturation: { type: int, min: 0, max: 200, required: true, label: Saturation, description: "Saturation from 0 (black and white) to 200, 100 unchanged." }
      hue: { type: int, min: -90, max: 90, required: true, label: Hue, description: "Hue rotation from -90 to 90, 0 unchanged." }
    send: { method: GET, path: /usapi, query: { method: set-video-color, contrast: "{contrast}", brightness: "{brightness}", saturation: "{saturation}", hue: "{hue}" } }
    expect: *ok
    returns: ack
  set_video_input_format:
    summary: "Input color space and quantization range: detected, or set (set-video-input-format)"
    params:
      input: *p_input_device
      color_auto: { type: bool, required: true, label: Automatic color space, description: "On detects the input's color space; off uses the one set." }
      color_format: { type: enum, values: [rgb, bt.601, bt.709, bt.2020], default: bt.709, label: Color space, description: "The color space used when not detected: RGB, or YUV BT.601, BT.709 or BT.2020." }
      quant_auto: { type: bool, required: true, label: Automatic quantization, description: "On detects the quantization range; off uses the one set." }
      quant_range: &p_quant { type: enum, values: [full, limited], default: limited, label: Quantization range, description: "Full (0-255) or limited (16-235)." }
    send:
      - { models: *v1, method: GET, path: /usapi, query: { method: set-video-input-format, is-color-fmt: "{color_auto:bool10}", color-fmt: "{color_format:map.input_color}",
          is-quant-range: "{quant_auto:bool10}", quant-range: "{quant_range:map.quant_range}" } }
      - { models: *v2, method: GET, path: /usapi, query: { method: set-video-input-format, input-device: "{input:map.input_device}", is-color-fmt: "{color_auto:bool10}",
          color-fmt: "{color_format:map.input_color}", is-quant-range: "{quant_auto:bool10}", quant-range: "{quant_range:map.quant_range}" } }
    expect: *ok
    returns: ack
  set_video_output_format:
    summary: "Encoded color space, quantization and saturation range: automatic, or set (set-video-output-format)"
    params:
      input: *p_input_device
      color_auto: { type: bool, required: true, label: Automatic color space, description: "On chooses the color space automatically; off uses the one set." }
      color_format: { type: enum, values: [bt.601, bt.709], default: bt.709, label: Color space, description: "YUV BT.601 or BT.709, used when not automatic." }
      quant_auto: { type: bool, required: true, label: Automatic quantization, description: "On chooses the quantization range automatically." }
      quant_range: *p_quant
      sat_auto: { type: bool, required: true, label: Automatic saturation, description: "On chooses the saturation range automatically." }
      sat_range: { type: enum, values: [full, limited, extended], default: limited, label: Saturation range, description: "Full (0-255), limited (16-235) or extended gamut (1-254)." }
    send:
      - { models: *v1, method: GET, path: /usapi, query: { method: set-video-output-format, is-color-fmt: "{color_auto:bool10}", color-fmt: "{color_format:map.output_color}",
          is-quant-range: "{quant_auto:bool10}", quant-range: "{quant_range:map.quant_range}", is-sat-range: "{sat_auto:bool10}", sat-range: "{sat_range:map.sat_range}" } }
      - { models: *v2, method: GET, path: /usapi, query: { method: set-video-output-format, input-device: "{input:map.input_device}", is-color-fmt: "{color_auto:bool10}",
          color-fmt: "{color_format:map.output_color}", is-quant-range: "{quant_auto:bool10}", quant-range: "{quant_range:map.quant_range}",
          is-sat-range: "{sat_auto:bool10}", sat-range: "{sat_range:map.sat_range}" } }
    expect: *ok
    returns: ack
  set_audio_sync_offset:
    summary: "Audio delay against the video, -200 to 200 ms (set-sync-offset)"
    params:
      ms: { type: int, min: -200, max: 200, required: true, label: Audio offset, description: "Milliseconds: positive delays the audio, negative brings it earlier." }
    send: { method: GET, path: /usapi, query: { method: set-sync-offset, audio-sync-offset: "{ms}" } }
    expect: *ok
    returns: ack
  add_nosignal_image:
    summary: "Add a JPEG shown while there is no input signal, under 1920x1080 and 1 MB (add-nosignal-file, multipart file upload)"
    params:
      image: { type: binary, required: true, label: Image, description: "The JPEG's contents, given as base64 or as a host file." }
      file_name: { type: string, default: nosignal.jpg, max_length: 255, label: File name, description: "The file name sent with the upload." }
    send:
      method: POST
      path: /usapi
      query: { method: add-nosignal-file }
      multipart: [{ name: file, binary: image, filename: "{file_name}", content_type: application/octet-stream }]
    expect: *ok
    returns: ack
  delete_nosignal_image:
    summary: "Delete a custom no-signal image; the defaults cannot be deleted (del-nosignal-file)"
    params:
      id: &p_image_id { type: int, min: 0, max: 255, required: true, label: Image, description: "The image's id as get_settings lists it in nosignal-files." }
    send: { method: GET, path: /usapi, query: { method: del-nosignal-file, id: "{id}" } }
    expect: *ok
    returns: ack
  select_nosignal_image:
    summary: "Choose the image shown while there is no input signal (set-nosignal-file)"
    params: { id: *p_image_id }
    send: { method: GET, path: /usapi, query: { method: set-nosignal-file, id: "{id}" } }
    expect: *ok
    returns: ack
  set_nosignal_image_enabled:
    summary: "Show the chosen image while there is no input signal, or not (use-nosignal-file)"
    params:
      enabled: { type: bool, required: true, label: No-signal image, description: "On shows the chosen image when the input has no signal." }
    send: { method: GET, path: /usapi, query: { method: use-nosignal-file, use-nosignal-file: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  set_time_zone:
    summary: "Time zone, as a tz database name such as Asia/Shanghai (set-time-zone)"
    params:
      timezone: { type: string, required: true, max_length: 64, pattern: "^[A-Za-z0-9_+/-]+$", label: Time zone,
        description: "A name from the document's list, e.g. America/New_York or UTC." }
    send: { method: GET, path: /usapi, query: { method: set-time-zone, timezone: "{timezone}" } }
    expect: *ok
    returns: ack
  set_time_auto:
    summary: "Take the time from NTP servers (set-date-time is-auto=1)"
    params:
      ntp_server: { type: string, required: true, max_length: 255, label: NTP server, description: "The NTP server's name or address, e.g. 0.pool.ntp.org." }
      ntp_backup: { type: string, default: "", max_length: 255, label: Backup NTP server, description: "A second NTP server, or empty for none." }
    send: { method: GET, path: /usapi, query: { method: set-date-time, is-auto: "1", time: "", ntp-server: "{ntp_server}", ntp-server-backup: "{ntp_backup}" } }
    expect: *ok
    returns: ack
  set_time_manual:
    summary: "Set the clock by hand (set-date-time is-auto=0)"
    params:
      time: { type: string, required: true, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$", label: Date and time,
        description: "Local date and time as YYYY-MM-DD hh:mm:ss, e.g. 2026-10-23 15:10:00." }
    send: { method: GET, path: /usapi, query: { method: set-date-time, is-auto: "0", time: "{time}" } }
    expect: *ok
    returns: ack
  set_udp_mtu:
    summary: "MTU of TS over UDP and TS over RTP sessions, 228 to 1500 (set-udp-mtu)"
    params:
      mtu: { type: int, min: 228, max: 1500, required: true, label: UDP MTU, description: "Largest packet in bytes; 1496 by default." }
    send: { method: GET, path: /usapi, query: { method: set-udp-mtu, udp-mtu: "{mtu}" } }
    expect: *ok
    returns: ack
  set_web:
    summary: "Web server ports and HTTPS (set-web); the device then answers on the new port"
    params:
      http_port: { type: int, min: 1, max: 65535, required: true, label: HTTP port, description: "The HTTP port, 80 by default." }
      https: { type: bool, required: true, label: HTTPS, description: "On serves HTTPS too, with the uploaded or generated certificate." }
      https_port: { type: int, min: 1, max: 65535, default: 443, label: HTTPS port, description: "The HTTPS port, 443 by default." }
    send: { method: GET, path: /usapi, query: { method: set-web, http-port: "{http_port}", is-https: "{https:bool01}", https-port: "{https_port}" } }
    expect: *ok
    returns: ack
  upload_certificate:
    summary: "Upload the SSL certificate for HTTPS (upload-cert, multipart file upload)"
    params:
      file: *p_file
      file_name: { type: string, default: server.crt, max_length: 255, label: File name, description: "The file name sent with the upload." }
    send:
      method: POST
      path: /usapi
      query: { method: upload-cert }
      multipart: [{ name: file, binary: file, filename: "{file_name}", content_type: application/octet-stream }]
    expect: *ok
    returns: ack
  upload_certificate_key:
    summary: "Upload the SSL private key for HTTPS (upload-cert-key, multipart file upload)"
    params:
      file: *p_file
      file_name: { type: string, default: server.key, max_length: 255, label: File name, description: "The file name sent with the upload." }
    send:
      method: POST
      path: /usapi
      query: { method: upload-cert-key }
      multipart: [{ name: file, binary: file, filename: "{file_name}", content_type: application/octet-stream }]
    expect: *ok
    returns: ack
  generate_certificate:
    summary: "Generate a self-signed SSL certificate and private key (generate-cert-key)"
    send: { method: GET, path: /usapi, query: { method: generate-cert-key } }
    expect: *ok
    returns: ack
  set_theme:
    summary: "Web interface theme, light or dark (set-theme)"
    params:
      theme: { type: enum, values: [light, dark], required: true, label: Theme, description: "The web interface's light or dark mode." }
    send: { method: GET, path: /usapi, query: { method: set-theme, theme: "{theme:map.theme}" } }
    expect: *ok
    returns: ack
  set_hls_push_segments:
    summary: "Segment count and duration of pushed HLS (set-hls-push-segment)"
    params:
      count: { type: int, min: 1, max: 5, required: true, label: Segments, description: "Segments in the playlist, 1 to 5; 3 by default." }
      duration: { type: int, min: 1, max: 4, required: true, label: Segment duration, description: "Seconds per segment, 1 to 4; 3 by default." }
    send: { method: GET, path: /usapi, query: { method: set-hls-push-segment, seg-count: "{count}", seg-duration: "{duration}" } }
    expect: *ok
    returns: ack
  set_lcd_control:
    summary: "The front touch screen: touch, page flipping and the page shown (set-lcd-control)"
    params:
      touch: { type: bool, required: true, label: Touch, description: "no-touch: the document gives 0 as touch disabled and 1 as enabled, sent as is." }
      flip: { type: bool, required: true, label: Page flip, description: "no-flip: the document gives 0 as page flipping disabled and 1 as enabled, sent as is." }
      page: { type: enum, values: [preview, live, record, qr-code], required: true, label: Page, description: "The page shown: preview, live, record, or the web interface's QR code." }
    send: { method: GET, path: /usapi, query: { method: set-lcd-control, no-touch: "{touch:bool01}", no-flip: "{flip:bool01}", page-idx: "{page:map.lcd_page}" } }
    expect: *ok
    returns: ack
  set_live_keep_last:
    summary: "Restart the live sessions that were streaming when the device restarts, or not (set-live-keep-last)"
    params:
      enabled: { type: bool, required: true, label: Resume streaming, description: "On restarts the last live sessions after a reboot." }
    send: { method: GET, path: /usapi, query: { method: set-live-keep-last, live-keep-last: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  set_ndi_bridge:
    summary: "NDI Bridge service: on, groups, name, server and key (set-ndi-bridge-config)"
    params:
      enabled: { type: bool, required: true, label: NDI Bridge, description: "On joins the NDI Bridge server." }
      groups: &p_ndi_groups { type: string, default: public, max_length: 255, label: Groups, description: "NDI group names separated by commas; public by default." }
      name: { type: string, default: "", max_length: 64, label: Bridge name, description: "The bridge service's name." }
      address: { type: string, default: "", max_length: 255, label: Server address, description: "The NDI Bridge server's IP address." }
      port: { type: int, min: 0, max: 65535, default: 0, label: Server port, description: "The NDI Bridge server's port." }
      key: { type: string, default: "", secret: true, max_length: 255, label: Encryption key, description: "The NDI Bridge server's encryption key." }
    send: { method: GET, path: /usapi, query: { method: set-ndi-bridge-config, enable-ndi-bridge: "{enabled:bool01}", groups: "{groups}", bridge-name: "{name}",
            ip-addr: "{address}", port: "{port}", encryp-key: "{key}" } }
    expect: *ok
    returns: ack
  add_token:
    summary: "Add an API token for a user (add-token)"
    params:
      token: &p_token { type: string, required: true, secret: true, max_length: 255, label: Token, description: "The token text." }
      expire: { type: int, min: -1, required: true, label: Expiry, description: "When the token expires, in seconds since 1970-01-01 UTC, or -1 for never." }
      user: { type: string, required: true, max_length: 64, label: User, description: "The user the token acts as." }
    send: { method: GET, path: /usapi, query: { method: add-token, token: "{token}", expire: "{expire}", user: "{user}" } }
    expect: *ok
    returns: ack
  delete_token:
    summary: "Delete an API token (del-token)"
    params: { token: *p_token }
    send: { method: GET, path: /usapi, query: { method: del-token, token: "{token}" } }
    expect: *ok
    returns: ack
  get_tokens:
    summary: "API tokens, each with its user and expiry (get-tokens)"
    send: { method: GET, path: /usapi, query: { method: get-tokens } }
    expect: *value
    returns: value
  upload_zen_master_key:
    summary: "Upload the SSH private key for Zixi ZEN Master (upload-zen-master-key, multipart file upload)"
    params:
      file: *p_file
      file_name: { type: string, default: zen-master.key, max_length: 255, label: File name, description: "The file name sent with the upload." }
    send:
      method: POST
      path: /usapi
      query: { method: upload-zen-master-key }
      multipart: [{ name: file, binary: file, filename: "{file_name}", content_type: application/octet-stream }]
    expect: *ok
    returns: ack
  set_zen_master:
    summary: "Zixi ZEN Master connection: on, user, host and tunnel port (set-zen-master-config)"
    params:
      enabled: { type: bool, required: true, label: ZEN Master, description: "On connects to ZEN Master." }
      user: { type: string, default: "", max_length: 64, label: User, description: "The user name configured on ZEN Master." }
      host: { type: string, default: "", max_length: 255, label: Host, description: "The ZEN Master address." }
      tunnel_port: { type: int, min: 0, max: 65535, default: 0, label: Tunnel port, description: "The remote source port configured on ZEN Master." }
    send: { method: GET, path: /usapi, query: { method: set-zen-master-config, enable-zen-master: "{enabled:bool01}", user-name: "{user}", host: "{host}", tunnel-port: "{tunnel_port}" } }
    expect: *ok
    returns: ack

  # ── Input (AIO and Plus) ──────────────────────────────────────────────
  select_input_source:
    summary: "The input encoded: SDI, HDMI, whichever has a signal, or both mixed (select-input-source)"
    params:
      source: { type: enum, values: [sdi, hdmi, auto, mixer], required: true, label: Input source,
        description: "SDI only, HDMI only, SDI or HDMI (auto scan), or the video mixer of both." }
    send: { method: GET, path: /usapi, query: { method: select-input-source, input-source: "{source:map.input_source}" } }
    expect: *ok
    returns: ack
  set_video_mixer:
    summary: "Mix SDI and HDMI: picture in picture or side by side, layering and place (set-video-mixer-config)"
    params:
      format: { type: enum, values: [sdi, hdmi], required: true, label: Mixer format, description: "The mixed output takes the format of the SDI or the HDMI input." }
      hdmi_on_top: { type: bool, required: true, label: HDMI on top, description: "On puts HDMI above SDI; off puts SDI on top." }
      type: { type: enum, values: [pip, side-by-side], required: true, label: Layout, description: "Picture in picture or side by side." }
      location: { type: enum, values: [top-left, top-right, bottom-left, bottom-right, half, one-third, two-thirds, one-fourth, three-fourths], required: true,
        label: Location, description: "A corner for picture in picture, or the split for side by side." }
    send: { method: GET, path: /usapi, query: { method: set-video-mixer-config, input-device: "{format:map.input_device}", is-hdmi-top: "{hdmi_on_top:bool01}",
            type: "{type:map.mixer_type}", location: "{location:map.mixer_location}" } }
    expect: *ok
    returns: ack
  set_4k60_input:
    summary: "Accept 4K 50/60 fps HDMI input; the capture rate then halves and mixing is off (enable-4k60-input)"
    params:
      enabled: { type: bool, required: true, label: 4K60 input, description: "On accepts 4K at 50 or 60 fps." }
    send: { method: GET, path: /usapi, query: { method: enable-4k60-input, enable-4k60-input: "{enabled:bool01}" } }
    expect: *ok
    returns: ack

  # ── Encoding ──────────────────────────────────────────────────────────
  set_video:
    summary: "Main or sub stream encoding: resolution, frame rate, codec, profile, bitrate, keyframes, rate control, SEI, aspect and (AIO and Plus) rotation (set-video)"
    params:
      stream: &p_stream { type: enum, values: [main, sub], default: main, label: Stream, description: "The main stream or the sub stream." }
      follow_input: { type: bool, required: true, label: Follow input, description: "On encodes at the input's format (main stream only; the sub stream must be off)." }
      width: { type: int, min: 64, max: 4096, required: true, label: Width, description: "Width in pixels, one of get-info's resolutions." }
      height: { type: int, min: 64, max: 2160, required: true, label: Height, description: "Height in lines, one of get-info's resolutions." }
      frame_rate: { type: enum, values: [follow, "5", "10", "15", "24", "25", "29.97", "30", "50", "59.94", "60"], required: true, label: Frame rate,
        description: "Frames per second, or follow the input." }
      codec: { type: enum, values: [h264, hevc], default: h264, label: Codec, description: "H.264 or H.265 (HEVC); the sub stream on the HDMI and SDI models is H.264 only." }
      profile: { type: int, min: 0, max: 2, required: true, label: Profile, description: "H.264 0 Baseline, 1 Main, 2 High; HEVC 0 Main." }
      kbps: { type: int, min: 64, max: 65536, required: true, label: Bitrate, description: "Video bitrate in kbit/s, one of get-info's video-kbps values." }
      gop: { type: int, min: 1, max: 300, required: true, label: Keyframe interval, description: "Keyframe interval as the device takes it: seconds from get-info's gop-sec list (128 for half a second)." }
      stat_seconds: { type: int, min: 1, max: 60, default: 60, label: Bitrate window, description: "Seconds over which the bitrate is measured: 1, 5, 10, 30 or 60." }
      full_range: { type: bool, default: false, label: Full range, description: "On encodes full range (0-255), off limited (16-235)." }
      vbr: { type: bool, default: false, label: VBR, description: "On encodes variable bitrate between the quantizer limits; off constant bitrate." }
      min_qp: { type: int, min: 0, max: 51, default: 0, label: Minimum QP, description: "VBR's lowest quantizer, 0 to 51." }
      max_qp: { type: int, min: 0, max: 51, default: 51, label: Maximum QP, description: "VBR's highest quantizer, from the minimum to 51." }
      timecode_sei: { type: enum, values: ["off", system, source], default: "off", label: Timecode SEI,
        description: "Write time code SEI messages: off, the system time, or (AIO and Plus) the input's time code." }
      caption_sei: { type: bool, default: false, label: Caption SEI, description: "On writes closed caption SEI messages." }
      aspect: { type: enum, values: [ignore, crop, pad], default: pad, label: Aspect conversion, description: "Fit a picture of another aspect ratio by ignoring, cropping or padding." }
      rotation: { type: enum, values: ["0", "90", "180", "270"], default: "0", label: Rotation, description: "AIO and Plus models: rotate the picture by 90, 180 or 270 degrees." }
    send:
      - { models: *v1, method: GET, path: /usapi, query: { method: set-video, stream: "{stream:map.stream_index}", is-auto: "{follow_input:bool01}", cx: "{width}", cy: "{height}",
          duration: "{frame_rate:map.frame_rate}", kbps: "{kbps}", gop: "{gop}", fourcc: "0", profile: "{profile}", cbrstat: "{stat_seconds}", fullrange: "{full_range:bool01}",
          codec: "{codec:map.codec}", is-vbr: "{vbr:bool01}", min-vbr-qp: "{min_qp}", max-vbr-qp: "{max_qp}", is-time-code-sei: "{timecode_sei:map.timecode_sei}",
          is-closed-caption-sei: "{caption_sei:bool01}", ar-convert-mode: "{aspect:map.aspect_mode}" } }
      - { models: *v2, method: GET, path: /usapi, query: { method: set-video, stream: "{stream:map.stream_index}", is-auto: "{follow_input:bool01}", cx: "{width}", cy: "{height}",
          duration: "{frame_rate:map.frame_rate}", kbps: "{kbps}", gop: "{gop}", fourcc: "0", profile: "{profile}", cbrstat: "{stat_seconds}", fullrange: "{full_range:bool01}",
          codec: "{codec:map.codec}", is-vbr: "{vbr:bool01}", min-vbr-qp: "{min_qp}", max-vbr-qp: "{max_qp}", is-time-code-sei: "{timecode_sei:map.timecode_sei}",
          is-closed-caption-sei: "{caption_sei:bool01}", ar-convert-mode: "{aspect:map.aspect_mode}", rotation: "{rotation}" } }
    expect: *ok
    returns: ack
  set_audio_bitrate:
    summary: "AAC audio bitrate (set-audio kbps)"
    params:
      kbps: &p_audio_kbps { type: enum, values: ["16", "32", "48", "64", "96", "128", "192", "256"], required: true, label: Audio bitrate, description: "Audio bitrate in kbit/s." }
    send: { method: GET, path: /usapi, query: { method: set-audio, kbps: "{kbps}" } }
    expect: *ok
    returns: ack
  set_audio_stream:
    summary: "One audio stream's encoding: channel count, bitrate, source channel mapping and LFE (set-audio)"
    params:
      stream: &p_audio_stream { type: int, min: 1, max: 4, required: true, label: Audio stream, description: "The audio stream, 1 to 4." }
      channels: { type: enum, values: [follow, "2", "4", "6", "8"], required: true, label: Channels, description: "Encoded channels, or follow the input." }
      kbps: *p_audio_kbps
      ch1: &p_chmap { type: int, min: 0, max: 15, default: 0, label: Channel source, description: "The source channel this encoded channel takes, as get-info's audio-chmap numbers it (0 for source channels 1/2)." }
      ch2: *p_chmap
      ch3: *p_chmap
      ch4: *p_chmap
      ch5: *p_chmap
      ch6: *p_chmap
      ch7: *p_chmap
      ch8: *p_chmap
      lfe: { type: bool, default: false, label: LFE, description: "On marks a low-frequency channel, for more than two channels." }
    send: { method: GET, path: /usapi, query: { method: set-audio, stream: "{stream:-1}", channels: "{channels:map.audio_channels}", kbps: "{kbps}",
            ch0: "{ch1}", ch1: "{ch2}", ch2: "{ch3}", ch3: "{ch4}", ch4: "{ch5}", ch5: "{ch6}", ch6: "{ch7}", ch7: "{ch8}", use-lfe: "{lfe:bool01}" } }
    expect: *ok
    returns: ack
  set_audio_stream_count:
    summary: "How many audio streams are encoded, up to 8 (set-audio-stream-count)"
    params:
      count: { type: int, min: 1, max: 8, required: true, label: Audio streams, description: "Number of encoded audio streams." }
    send: { method: GET, path: /usapi, query: { method: set-audio-stream-count, audio-stream-count: "{count}" } }
    expect: *ok
    returns: ack
  select_audio_channels:
    summary: "Up to 8 of an SDI input's 16 audio channels to encode (select-audio-channels, deprecated at V2.4)"
    params:
      mask: { type: int, min: 1, max: 65535, required: true, label: Channel mask, description: "Sum of 2 to the power of each channel chosen, channels numbered from 0." }
    send: { method: GET, path: /usapi, query: { method: select-audio-channels, channel-mask: "{mask}" } }
    expect: *ok
    returns: ack
  set_deinterlace:
    summary: "Deinterlace an interlaced input, or not (enable-deinterlace)"
    params:
      enabled: { type: bool, required: true, label: Deinterlace, description: "On deinterlaces." }
    send: { method: GET, path: /usapi, query: { method: enable-deinterlace, enable-deinterlace: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  set_sub_stream_enabled:
    summary: "Encode the sub stream, or not (set-enable-stream1)"
    params:
      enabled: { type: bool, required: true, label: Sub stream, description: "On encodes the sub stream." }
    send: { method: GET, path: /usapi, query: { method: set-enable-stream1, enable: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  make_crop_thumbnail:
    summary: "Make the thumbnail used to choose a crop (set-in-cropping); get-info names its path"
    params: { stream: *p_stream }
    send: { method: GET, path: /usapi, query: { method: set-in-cropping, stream-idx: "{stream:map.stream_index}" } }
    expect: *ok
    returns: ack
  set_crop:
    summary: "Crop the main or sub stream to a rectangle of the input (set-crop)"
    params:
      stream: *p_stream
      enabled: { type: bool, required: true, label: Crop, description: "On crops; off encodes the whole picture." }
      x: { type: int, min: 0, max: 4096, default: 0, label: X offset, description: "Left edge of the crop in pixels." }
      y: { type: int, min: 0, max: 2160, default: 0, label: Y offset, description: "Top edge of the crop in lines." }
      width: { type: int, min: 0, max: 4096, default: 0, label: Width, description: "Crop width in pixels." }
      height: { type: int, min: 0, max: 2160, default: 0, label: Height, description: "Crop height in lines." }
    send: { method: GET, path: /usapi, query: { method: set-crop, stream-idx: "{stream:map.stream_index}", is-use: "{enabled:bool01}", x-offset: "{x}", y-offset: "{y}",
            act-w: "{width}", act-h: "{height}" } }
    expect: *ok
    returns: ack
  set_3d_output:
    summary: "3D output, on or off (set-3d-output-config)"
    params:
      enabled: { type: bool, required: true, label: 3D output, description: "On turns 3D output on." }
    send: { method: GET, path: /usapi, query: { method: set-3d-output-config, enable: "{enabled:bool01}", mode: "0" } }
    expect: *ok
    returns: ack

  # ── Streaming servers (Streaming Server, Live) ────────────────────────
  # add-server and set-server take one parameter list per server type; each
  # type is a command here. set-server is add-server's list with the id.
  add_rtmp_server:
    summary: "Add an RTMP destination: custom RTMP, Twitch, YouTube, Facebook, and on the AIO and Plus models Wowza and YouTube HLS (add-server type 0-4, 143)"
    params:
      type: { type: enum, values: [rtmp, twitch, youtube, facebook, wowza, youtube-hls], required: true, label: Service,
        description: "Custom RTMP, Twitch, YouTube, Facebook, Wowza over RTMP or YouTube HLS; Wowza and YouTube HLS on the AIO and Plus models only." }
      name: *p_name
      stream: *p_stream
      url: &p_url { type: string, required: true, max_length: 1024, label: URL, description: "The destination's address, e.g. rtmp://a.rtmp.youtube.com/live2." }
      key: { type: string, default: "", secret: true, max_length: 1024, label: Stream key, description: "The stream key." }
      auth: &p_auth { type: bool, default: false, label: Authentication, description: "On sends the user name and password, both then required." }
      user: &p_user { type: string, default: "", max_length: 128, label: User, description: "The user name, when authentication is on." }
      password: &p_password { type: string, default: "", secret: true, max_length: 128, label: Password, description: "The password, when authentication is on." }
      token: &p_stream_token { type: string, default: "", secret: true, max_length: 1024, label: Token, description: "The service's token, where it takes one." }
      event_data: &p_event { type: string, default: "", max_length: 1024, label: Event, description: "The service's live event, where it takes one." }
      net_mode: &p_net_mode { type: enum, values: [mobile, ethernet, wifi], default: ethernet, label: Network, description: "The network tried first: mobile broadband, Ethernet or Wi-Fi." }
      audio: &p_audio_sel { type: int, min: 1, max: 4, default: 1, label: Audio stream, description: "AIO and Plus models: the audio stream sent, 1 to 4." }
    send:
      - { models: *v1, method: GET, path: /usapi, query: { method: add-server, type: "{type:map.rtmp_type}", name: "{name}", stream-index: "{stream:map.stream_index}",
          url: "{url}", key: "{key}", is-auth: "{auth:bool01}", user: "{user}", passwd: "{password}", token: "{token}", event-data: "{event_data}", net-mode: "{net_mode:map.net_mode}" } }
      - { models: *v2, method: GET, path: /usapi, query: { method: add-server, type: "{type:map.rtmp_type}", name: "{name}", stream-index: "{stream:map.stream_index}",
          url: "{url}", key: "{key}", is-auth: "{auth:bool01}", user: "{user}", passwd: "{password}", token: "{token}", event-data: "{event_data}", net-mode: "{net_mode:map.net_mode}",
          audio: "{audio:-1}" } }
    expect: *ok
    returns: ack
  set_rtmp_server:
    summary: "Change an RTMP, Twitch, YouTube, Facebook, Wowza or YouTube HLS destination (set-server)"
    params:
      id: &p_server_id { type: int, min: 0, max: 255, required: true, label: Server, description: "The streaming server's id as get_settings lists it in stream-server." }
      type: { type: enum, values: [rtmp, twitch, youtube, facebook, wowza, youtube-hls], required: true, label: Service,
        description: "Custom RTMP, Twitch, YouTube, Facebook, Wowza over RTMP or YouTube HLS; Wowza and YouTube HLS on the AIO and Plus models only." }
      name: *p_name
      stream: *p_stream
      url: *p_url
      key: { type: string, default: "", secret: true, max_length: 1024, label: Stream key, description: "The stream key." }
      auth: *p_auth
      user: *p_user
      password: *p_password
      token: *p_stream_token
      event_data: *p_event
      net_mode: *p_net_mode
      audio: *p_audio_sel
    send:
      - { models: *v1, method: GET, path: /usapi, query: { method: set-server, id: "{id}", type: "{type:map.rtmp_type}", name: "{name}", stream-index: "{stream:map.stream_index}",
          url: "{url}", key: "{key}", is-auth: "{auth:bool01}", user: "{user}", passwd: "{password}", token: "{token}", event-data: "{event_data}", net-mode: "{net_mode:map.net_mode}" } }
