# Nothing is pushed. The running status is polled every 2 seconds, the
# signal details and upload progress every 10, every setting and list every
# 30, and the product information and ranges every 5 minutes; whatever a
# command changes is read again as soon as the device accepts it (then_send).
telemetry:
  poll:
    - every_ms: 2000
      send:
        - { method: GET, path: /usapi, query: { method: get-status } }
    - every_ms: 10000
      send:
        - { models: *v1, method: GET, path: /usapi, query: { method: get-signal-info } }
        - { models: [sdi-plus, aio], method: GET, path: /usapi, query: { method: get-signal-info, input-device: "1" } }
        - { models: [hdmi-plus, aio], method: GET, path: /usapi, query: { method: get-signal-info, input-device: "2" } }
        - { models: *v2, method: GET, path: /usapi, query: { method: send-file-get-status, disk-type: "1", start: "0", count: "0" } }
    - every_ms: 30000
      send:
        - { method: GET, path: /usapi, query: { method: get-settings } }
        - { method: GET, path: /usapi, query: { method: get-users } }
        - { method: GET, path: /usapi, query: { method: get-ndi-sources } }
        - { models: &hdmi [hdmi, hdmi-plus, aio], method: GET, path: /usapi, query: { method: get-edid-config } }
        - { models: *hdmi, method: GET, path: /usapi, query: { method: get-loop-through-edid } }
        - { models: *v1, method: GET, path: /usapi, query: { method: cloud-status, version: "1" } }
        - { models: *v2, endpoint: cloud, method: GET, path: /cloud-api, query: { method: cloud-status, version: "1" } }
        - { models: *v2, method: GET, path: /usapi, query: { method: get-rec-channels } }
        - { models: *v2, method: GET, path: /usapi, query: { method: get-surfaces } }
        - { models: *v2, method: GET, path: /usapi, query: { method: get-images } }
        - { models: *v2, method: GET, path: /usapi, query: { method: get-schedulers, id: "-1", chn-type: "0", chn-id: "-1" } }
        - { models: *v2, method: GET, path: /usapi, query: { method: get-schedulers, id: "-1", chn-type: "1", chn-id: "-1" } }
        - { models: *v2, method: GET, path: /usapi, query: { method: get-schedulers, id: "-1", chn-type: "2", chn-id: "-1" } }
        - { models: *v2, method: GET, path: /usapi, query: { method: get-tokens } }
    - every_ms: 300000
      send:
        - { method: GET, path: /usapi, query: { method: get-info } }
  updates:
    # ── get-info (Universal Interfaces) ──
    - path: "^/usapi\\?method=get-info$"
      json_match: { "$.result": "^0$" }
      json:
        serial: "$.product.sn"
        product: "$.product.product-name"
        model: "$.product.module-name"
        manufacturer: "$.product.manu-name"
        product_id: "$.product.product-id"
        hw: "$.product.hardware-ver"
        fw: "$.product.firmware-ver-s"
        factory_fw: "$.product.factory-firmware-ver-s"
        features: "$.product.features"
        locks: "$.product.max-lock-count"
        live: "$.product.live-support"
        cloud: "$.product.cloud-support"
        rec: "$.product.record-support"
        sched: "$.product.scheduler-support"
        nas: "$.product.nas-support"
        multi_audio: "$.product.multi-audio-support"
        mac_eth: "$.mac-addr.eth"
        mac_wifi: "$.mac-addr.wifi"
        mac_ap: "$.mac-addr.softap"
        mac_bt: "$.mac-addr.blue"
        snap: "$.snapshot"
        snap_main: "$.main-snapshot"
        snap_sub: "$.sub-snapshot"
        snap_main_crop: "$.main-crop-snapshot"
        snap_sub_crop: "$.sub-crop-snapshot"
        ns_count: "$.nosignal.max-count"
        ns_w: "$.nosignal.max-width"
        ns_h: "$.nosignal.max-height"
        ns_kb: "$.nosignal.max-size-kb"
        codec: "$.codec-cap"
        audio_range: "$.audio-range"
        color_range: "$.color-range"
        video_format: "$.video-format"
        living: "$.living"
        input_source: "$.input-source"
        rec_caps: "$.rec"
        rec_control: "$.rec-control"
        nas_caps: "$.nas"
        surface: "$.surface"
        send_file: "$.send-file"
        lcd: "$.lcd"
        web: "$.web"
      state:
        device.serial: "{serial}"
        device.product: "{product}"
        device.model: "{model}"
        device.manufacturer: "{manufacturer}"
        device.product_id: "{product_id}"
        device.hardware_version: "{hw}"
        device.firmware: "{fw}"
        device.factory_firmware: "{factory_fw}"
        device.features: "{features}"
        device.max_lock_count: "{locks}"
        device.live_support: "{live}"
        device.cloud_support: "{cloud:bit.0}"
        device.record_support: "{rec:bit.0}"
        device.scheduler_support: "{sched:bit.0}"
        device.nas_support: "{nas:bit.0}"
        device.multi_audio_support: "{multi_audio:bit.0}"
        network.ethernet.mac: "{mac_eth}"
        network.wifi.mac: "{mac_wifi}"
        network.softap.mac: "{mac_ap}"
        network.bluetooth.mac: "{mac_bt}"
