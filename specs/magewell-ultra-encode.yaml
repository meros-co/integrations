  wifi_security: { open: "0", wep: "1", wpa: "2", wpa2: "3", wpa2-eap: "4" }
  net_type: { wifi: "0", ethernet: "1" }
  disk: { usb: "0", sd: "1", nas: "2" }
  rec_mode: { normal: "1", loop: "2" }
  file_prefix: { custom: "0", time: "1" }
  file_suffix: { mp4: "0", mov: "1" }
  nas_proto: { nfs: "0", cifs: "1" }
  trigger_mode: { signal: "0", usb: "1" }
  lcd_page: { preview: "0", live: "1", record: "2", qr-code: "3" }
  theme: { light: "0", dark: "1" }
  upload_type: { google-drive: "1", dropbox: "2", youtube: "3" }
  ftp_proto: { ftp: "0", sftp: "1" }
  ftp_encryption: { none: "0", explicit-tls: "1", implicit-tls: "2" }
