  ptz.serial.xonxoff: { type: bool, description: "Whether XON/XOFF is on" }
  ptz.serial.rtscts: { type: bool, description: "Whether RTS/CTS is on" }
  ptz.serial.ptz_protocol: { type: string, description: "The serial camera's protocol" }
  ptz.serial.camera_address: { type: string, description: "The serial camera's protocol address" }
  ptz.protocols: { type: string, description: "The protocols the device speaks, as a JSON array" }
  ptz.serial_devices: { type: string, description: "The serial adapters plugged in, as a JSON array of device and driver" }
  # Front panel
  panel.quick_streaming: { type: bool, description: "Whether quick streaming is on" }
  panel.quick_recording: { type: bool, description: "Whether quick recording is on" }
  panel.quick_enabled: { type: bool, description: "The stored quick-stream switch" }
  panel.quick_record_list: { type: string, description: "The sources quick recording records, as a JSON array" }
  panel.panel_streaming: { type: bool, description: "Whether front-panel streaming is enabled" }
  panel.quick_record_sources: { type: string, description: "The quick recording sources in the quick configuration, as a JSON array" }
  panel.tally_source: { type: string, description: "The channel whose NDI|HX tally is shown: hdmi, sdi, pip or off" }
  # Intercom
  talk.version: { type: string, description: "The intercom service's version" }
  talk.serial: { type: string, description: "The serial number it reports" }
  talk.name: { type: string, description: "This device's intercom name" }
  talk.ip: { type: string, description: "This device's intercom address" }
  talk.usb_headset: { type: bool, description: "Whether a USB headset is connected" }
  talk.talking: { type: bool, description: "Whether this device is talking" }
  talk.connect_status: { type: string, description: "noconnect, connecting or connected" }
  talk.connect_ip: { type: string, description: "The address it is connected to" }
  talk.connect_type: { type: string, description: "The kind of peer it is connected to" }
  talk.devices: { type: string, description: "The other intercom devices added, as the JSON array the device gives" }
  # ONVIF and NDI bridge
  onvif.enabled: { type: bool, description: "Whether the ONVIF service runs" }
  onvif.discoverable: { type: bool, description: "Whether ONVIF clients can discover the device" }
  onvif.discover_port: { type: int, description: "The WS-Discovery port" }
  onvif.port: { type: int, description: "The ONVIF service port" }
  onvif.auth_required: { type: bool, description: "Whether ONVIF clients must log in" }
  onvif.admin_name: { type: string, description: "The ONVIF login name" }
  onvif.location: { type: string, description: "The location reported" }
  onvif.device_name: { type: string, description: "The device name reported" }
  onvif.device_type: { type: string, description: "The device type reported" }
  ndi_bridge.enabled: { type: bool, description: "Whether the NDI bridge is on" }
  ndi_bridge.group: { type: string, description: "The group it shares into" }
  ndi_bridge.address: { type: string, description: "The NDI host's address" }
  ndi_bridge.port: { type: int, description: "The NDI host's port" }
  ndi_bridge.source_name: { type: string, description: "The name the source is published under" }

telemetry:
  # No push in the API: four poll groups, and every successful write's
  # reply has what it changed read again (then_send below).
  poll:
    # What moves during a show: encoding on, recording, stream status, traffic.
    - every_ms: 2000
      send:
        - { method: GET, path: /api/codec/vin/active_interface }
        - { method: GET, path: /api/record/hdmi/recording }
        - { method: GET, path: /api/record/sdi/recording }
        - { method: GET, path: /api/record/pip/recording }
        - { method: GET, path: /api/record/uvc/recording }
        - { method: GET, path: /api/streamer/hdmi/stream/list }
        - { method: GET, path: /api/streamer/sdi/stream/list }
        - { method: GET, path: /api/streamer/pip/stream/list }
        - { method: GET, path: /api/streamer/uvc/stream/list }
        - { method: GET, path: /api/systemctrl/system/getNetworkSpeed }
    # Health, inputs, storage, links.
    - every_ms: 5000
      send:
        - { method: GET, path: /api/systemctrl/system/getSystemInfo,
            query: { version: "true", cpu: "true", memory: "true", disk: "true", persisTime: "true" } }
        - { method: GET, path: /api/codec/hdmi/vin/detail }
        - { method: GET, path: /api/codec/sdi/vin/detail }
        - { method: GET, path: /api/codec/pip/vin/detail }
        - { method: GET, path: /api/codec/uvc/vin/detail }
        - { method: GET, path: /api/record/record/disk_list }
        - { method: GET, path: /api/networkmanager/network/GetLinkinfo }
        - { method: GET, path: /api/streamer/panel_stream/shortcuts_stream }
        - { method: GET, path: /api/talk/queryLDeviceConnectStatus }
    # Encoding and picture configuration.
    - every_ms: 30000
      send:
        - { method: GET, path: /api/codec/hdmi/venc/settings, query: { venc_type: main } }
        - { method: GET, path: /api/codec/hdmi/venc/settings, query: { venc_type: sub } }
        - { method: GET, path: /api/codec/sdi/venc/settings, query: { venc_type: main } }
        - { method: GET, path: /api/codec/sdi/venc/settings, query: { venc_type: sub } }
        - { method: GET, path: /api/codec/pip/venc/settings, query: { venc_type: main } }
        - { method: GET, path: /api/codec/pip/venc/settings, query: { venc_type: sub } }
        - { method: GET, path: /api/codec/uvc/venc/settings, query: { venc_type: main } }
        - { method: GET, path: /api/codec/uvc/venc/settings, query: { venc_type: sub } }
        - { method: GET, path: /api/codec/hdmi/audio/input }
        - { method: GET, path: /api/codec/sdi/audio/input }
        - { method: GET, path: /api/codec/pip/audio/input }
        - { method: GET, path: /api/codec/uvc/audio/input }
        - { method: POST, path: /api/codec/hdmi/audio/encode/list }
        - { method: POST, path: /api/codec/sdi/audio/encode/list }
        - { method: POST, path: /api/codec/pip/audio/encode/list }
        - { method: POST, path: /api/codec/uvc/audio/encode/list }
        - { method: GET, path: /api/codec/hdmi/venc/complie_NDIstandard }
        - { method: GET, path: /api/codec/sdi/venc/complie_NDIstandard }
        - { method: GET, path: /api/codec/pip/venc/complie_NDIstandard }
        - { method: GET, path: /api/codec/uvc/venc/complie_NDIstandard }
        - { method: GET, path: /api/codec/hdmi/vpss/input/crop }
        - { method: GET, path: /api/codec/sdi/vpss/input/crop }
        - { method: GET, path: /api/codec/hdmi/vpss/input/rmf }
        - { method: GET, path: /api/codec/sdi/vpss/input/rmf }
        - { method: GET, path: /api/codec/pip/vpss/input/rmf }
        - { method: GET, path: /api/codec/uvc/vpss/input/rmf }
        - { method: GET, path: /api/codec/hdmi/vpss/osd }
        - { method: GET, path: /api/codec/sdi/vpss/osd }
        - { method: GET, path: /api/codec/pip/vpss/osd }
        - { method: GET, path: /api/codec/uvc/vpss/osd }
        - { method: GET, path: /api/codec/pip/venc/pip_layout_setting }
        - { method: GET, path: /api/codec/pip/venc/pip_fps_setting }
        - { method: GET, path: /api/codec/vin/edid }
        - { method: GET, path: /api/record/record/get_record_info }
        - { method: GET, path: /api/streamer/ptz/info }
        - { method: GET, path: /api/streamer/shortcuts/list }
        - { method: GET, path: /api/streamer/panel_stream/get_tally_setting }
    # System and administration.
    - every_ms: 120000
      send:
        - { method: GET, path: /api/systemctrl/system/getHostname }
        - { method: GET, path: /api/systemctrl/users/list }
        - { method: GET, path: /api/systemctrl/users/auth_info }
        - { method: GET, path: /api/systemctrl/systime/get }
        - { method: GET, path: /api/systemctrl/systime/ntpstatus }
        - { method: GET, path: /api/systemctrl/system/getProtocol }
        - { method: GET, path: /api/systemctrl/system/ssl }
        - { method: GET, path: /api/systemctrl/system/production_stat }
        - { method: GET, path: /api/systemctrl/system_preset/modules }
        - { method: GET, path: /api/systemctrl/system_preset/get }
        - { method: GET, path: /api/systemctrl/system_maintenance/get }
        - { method: GET, path: /api/networkmanager/static/routing/get }
        - { method: GET, path: /api/kilolink/networks }
        - { method: GET, path: /api/kilolink/get }
        - { method: GET, path: /api/codec/hdmi/audio/input/list_source }
        - { method: GET, path: /api/codec/sdi/audio/input/list_source }
        - { method: GET, path: /api/codec/pip/audio/input/list_source }
        - { method: GET, path: /api/codec/uvc/audio/input/list_source }
        - { method: GET, path: /api/codec/uvc/vin/list_format }
        - { method: GET, path: /api/streamer/hdmi/stream/media_user }
        - { method: GET, path: /api/streamer/sdi/stream/media_user }
        - { method: GET, path: /api/streamer/pip/stream/media_user }
        - { method: GET, path: /api/streamer/uvc/stream/media_user }
        - { method: GET, path: /api/streamer/ptz/protocol }
        - { method: GET, path: /api/streamer/ptz/serial_device }
        - { method: GET, path: /api/codec/vpss/image }
        - { method: GET, path: /api/codec/vpss/static_frame }
        - { method: GET, path: /api/talk/talkVersion }
        - { method: GET, path: /api/talk/queryLocalDeviceSerial }
        - { method: GET, path: /api/talk/queryDeviceList }
        - { method: GET, path: /api/onvifmanage/onvif/get }
        - { method: GET, path: /api/bridge/get }
  updates:
    # ── Reads ──────────────────────────────────────────────────────────────
    - path: '^/api/systemctrl/system/getHostname$'
      json: { name: "$.data.hostname" }
      state: { device.name: "{name}" }
    - path: '^/api/systemctrl/system/getSystemInfo(\?|$)'
      json: { product: "$.data.version.product", oem: "$.data.version.oem", serial: "$.data.version.serialNumber",
              firmware: "$.data.version.softwareVersion", hardware: "$.data.version.hardwareVersion",
              ndi: "$.data.version.ndiVersion", cpu: "$.data.cpu.precent", mem: "$.data.mem.precent",
              mem_total: "$.data.mem.total", mem_used: "$.data.mem.used", disk: "$.data.disk.precent",
              disk_total: "$.data.disk.total", disk_used: "$.data.disk.used", disk_free: "$.data.disk.free",
              uptime: "$.data.persisTime.uptime", temp: "$.data.temp.temp" }
      state:
        device.product: "{product}"
        device.oem: "{oem}"
        device.serial: "{serial}"
        device.firmware: "{firmware}"
        device.hardware: "{hardware}"
        device.ndi_version: "{ndi}"
        system.cpu_percent: "{cpu}"
        system.memory_percent: "{mem}"
        system.memory_total: "{mem_total}"
        system.memory_used: "{mem_used}"
        system.disk_percent: "{disk}"
        system.disk_total: "{disk_total}"
        system.disk_used: "{disk_used}"
        system.disk_free: "{disk_free}"
        system.uptime: "{uptime}"
        system.temperature: "{temp}"
    - path: '^/api/systemctrl/system/getNetworkSpeed(\?|$)'
      json_each: "$.data.*"
      json: { rx: "$.receive", tx: "$.transmit", speed: "$.speed" }
      state:
        "network.ports.{key:key}.receive": "{rx}"
        "network.ports.{key:key}.transmit": "{tx}"
        "network.ports.{key:key}.link_speed": "{speed}"
    - path: '^/api/systemctrl/users/auth_info$'
      json_match: { "$.result": "^ok$" }
      json: { enabled: "$.data.enable" }
      state: { system.api_auth: "{enabled}" }
    - path: '^/api/systemctrl/system/production_stat$'
      json: { sw: "$.data.value" }
      state: { system.production_service: "{sw}" }
    - path: '^/api/systemctrl/system/getProtocol$'
      json: { http: "$.data.http", https: "$.data.https", http_port: "$.data.httpPort", https_port: "$.data.httpsPort" }
      state: { web.http: "{http}", web.https: "{https}", web.http_port: "{http_port}", web.https_port: "{https_port}" }
    - path: '^/api/systemctrl/system/ssl$'
      json_match: { "$.result": "^ok$" }
      json: { crt: "$.data.ssl_crt", key: "$.data.ssl_key", reset: "$.data.enable_reset" }
      state: { web.ssl_certificate: "{crt}", web.ssl_key: "{key}", web.ssl_reset_available: "{reset}" }
    - path: '^/api/systemctrl/users/list$'
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", alias: "$.alias", web: "$.web", api: "$.api", created: "$.create_time" }
      replace: users
      state:
        "users.{id:key}.alias": "{alias}"
        "users.{id:key}.web": "{web}"
        "users.{id:key}.api": "{api}"
        "users.{id:key}.created": "{created}"
    - path: '^/api/systemctrl/systime/get$'
      json: { time: "$.data.time", mode: "$.data.timetype", zone: "$.data.Timezone", offset: "$.data.offset", ntp: "$.data.ntp" }
      state: { time.current: "{time}", time.mode: "{mode}", time.timezone: "{zone}", time.offset: "{offset}", time.ntp_servers: "{ntp}" }
    - path: '^/api/systemctrl/systime/ntpstatus$'
      json: { status: "$" }
      state: { time.ntp_status: "{status}" }
    - path: '^/api/systemctrl/system_preset/modules$'
      json: { modules: "$.data" }
      state: { presets.modules: "{modules}" }
    - path: '^/api/systemctrl/system_preset/get$'
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { pid: "$.pid", name: "$.name" }
      replace: presets.list
      state: { "presets.list.{pid:key}.name": "{name}" }
    - path: '^/api/systemctrl/system_maintenance/get$'
      json: { sw: "$.data.enable", policy: "$.data.policy", start: "$.data.start_date", months: "$.data.months",
              weeks: "$.data.weeks", days: "$.data.days", day: "$.data.day" }
      state:
        maintenance.enabled: "{sw}"
        maintenance.policy: "{policy}"
        maintenance.start_date: "{start}"
        maintenance.months: "{months}"
        maintenance.weeks: "{weeks}"
        maintenance.days: "{days}"
        maintenance.day: "{day}"
    - path: '^/api/networkmanager/network/(GetLinkinfo|GetEthernets)(\?|$)'
      json_each: "$.data"
      json: { dev: "$.device", status: "$.status", address: "$.address", netmask: "$.netmask", gw: "$.gw", mac: "$.mac",
              method: "$.method", sw: "$.enable", dns: "$.dns" }
      state:
        "network.ports.{dev:key}.status": "{status}"
        "network.ports.{dev:key}.address": "{address}"
        "network.ports.{dev:key}.netmask": "{netmask}"
        "network.ports.{dev:key}.gateway": "{gw}"
        "network.ports.{dev:key}.mac": "{mac}"
        "network.ports.{dev:key}.method": "{method}"
        "network.ports.{dev:key}.enabled": "{sw}"
        "network.ports.{dev:key}.dns": "{dns}"
    - path: '^/api/networkmanager/static/routing/get$'
      json: { routes: "$" }
      state: { network.static_routes: "{routes}" }
    - path: '^/api/kilolink/networks$'
      json: { list: "$.list" }
      state: { kilolink.interfaces: "{list}" }
    - path: '^/api/kilolink/get$'
      json: { sw: "$.cfg.enable", ip: "$.cfg.ip", port: "$.cfg.port", ifname: "$.cfg.ifname", crypto: "$.cfg.crypto", status: "$.status" }
      state:
        kilolink.enabled: "{sw}"
        kilolink.server: "{ip}"
        kilolink.port: "{port}"
        kilolink.ports: "{ifname}"
        kilolink.encrypted: "{crypto}"
        kilolink.status: "{status}"
    - path: '^/api/codec/vin/edid$'
      json: { priority: "$.edid_priority", edid: "$.edid", reset: "$.reset" }
      state: { edid.priority: "{priority}", edid.data: "{edid}", edid.reset_available: "{reset}" }
    - path: '^/api/codec/vin/active_interface$'
      json: { hdmi: "$.hdmi", sdi: "$.sdi", pip: "$.pip", uvc: "$.uvc" }
      state: { channels.hdmi.active: "{hdmi}", channels.sdi.active: "{sdi}", channels.pip.active: "{pip}", channels.uvc.active: "{uvc}" }
    - path: '^/api/codec/(hdmi|sdi|pip|uvc)/vin/detail$'
      json: { signal: "$.signal", format: "$.format", width: "$.width", height: "$.height", interlaced: "$.interlaced",
              fps: "$.fps", type: "$.type", max_width: "$.max_width", max_height: "$.max_height", max_fps: "$.max_fps",
              vertical: "$.vertical", encoding: "$.input_encode", resolution: "$.input_resolution" }
      state:
        "channels.{1}.input.signal": "{signal}"
        "channels.{1}.input.format": "{format}"
        "channels.{1}.input.width": "{width}"
        "channels.{1}.input.height": "{height}"
        "channels.{1}.input.interlaced": "{interlaced}"
        "channels.{1}.input.fps": "{fps}"
        "channels.{1}.input.type": "{type}"
        "channels.{1}.input.max_width": "{max_width}"
        "channels.{1}.input.max_height": "{max_height}"
        "channels.{1}.input.max_fps": "{max_fps}"
        "channels.{1}.input.vertical": "{vertical}"
        "channels.{1}.input.encoding": "{encoding}"
        "channels.{1}.input.resolution": "{resolution}"
    - path: '^/api/codec/(uvc)/vin/list_format$'
      json: { formats: "$" }
      state: { "channels.{1}.input.formats": "{formats}" }
    - path: '^/api/record/(hdmi|sdi|pip|uvc)/recording$'
      json_match: { "$.result": "^ok$" }
      json: { sw: "$.data.status" }
      state: { "channels.{1}.recording": "{sw}" }
    - path: '^/api/streamer/(hdmi|sdi|pip|uvc)/stream/list$'
      json_match: { "$": '^\[' }
      json_each: "$"
      json: { id: "$.id", type: "$.type", name: "$.name", enable: "$.enable", status: "$.status", audio: "$.bindAudio",
              video: "$.bindVideo", url: "$.addressUrl", address: "$.address", port: "$.port", ttl: "$.ttl",
              channel: "$.channel_name", group: "$.group", connection: "$.connection", prefix: "$.netprefix",
              netmask: "$.netmask", discovery: "$.discovery_server", session: "$.session", tunnel: "$.httpTunnelPort",
              auth: "$.auth", mc: "$.multicast_enable", mc_addr: "$.multicast_addr", mc_ttl: "$.multicast_ttl",
              mc_min: "$.multicast_port_min", mc_max: "$.multicast_port_max", reconnect: "$.connIntv",
              timeout: "$.connTimeout", user: "$.user", old: "$.oldRtmp", mode: "$.mode", latency: "$.latency",
              sid: "$.streamid", maxbw: "$.maxbw", keylen: "$.pbkeylen", segment: "$.segmentTime",
              nullmul: "$.ts_null_multiple", bind_port: "$.bindPort", load: "$.load_type", svc: "$.ts_service_name",
              provider: "$.ts_service_provider", tsid: "$.ts_transport_stream_id", tables: "$.ts_tables_version",
              pcr: "$.ts_pcr_period", pid: "$.ts_start_pid", pmt: "$.ts_pmt_start_pid" }
      replace: "channels.{1}.streams"
      state:
        "channels.{1}.streams.{id:key}.type": "{type}"
        "channels.{1}.streams.{id:key}.name": "{name}"
        "channels.{1}.streams.{id:key}.enabled": "{enable}"
        "channels.{1}.streams.{id:key}.status": "{status}"
        "channels.{1}.streams.{id:key}.bind_audio": "{audio}"
        "channels.{1}.streams.{id:key}.bind_video": "{video}"
        "channels.{1}.streams.{id:key}.address_url": "{url}"
        "channels.{1}.streams.{id:key}.address": "{address}"
        "channels.{1}.streams.{id:key}.port": "{port}"
        "channels.{1}.streams.{id:key}.ttl": "{ttl}"
        "channels.{1}.streams.{id:key}.ndi_channel": "{channel}"
        "channels.{1}.streams.{id:key}.ndi_group": "{group}"
        "channels.{1}.streams.{id:key}.ndi_connection": "{connection}"
        "channels.{1}.streams.{id:key}.ndi_multicast_prefix": "{prefix}"
        "channels.{1}.streams.{id:key}.ndi_multicast_netmask": "{netmask}"
        "channels.{1}.streams.{id:key}.ndi_discovery_server": "{discovery}"
        "channels.{1}.streams.{id:key}.session": "{session}"
        "channels.{1}.streams.{id:key}.http_tunnel_port": "{tunnel}"
        "channels.{1}.streams.{id:key}.auth": "{auth}"
        "channels.{1}.streams.{id:key}.multicast": "{mc}"
        "channels.{1}.streams.{id:key}.multicast_address": "{mc_addr}"
        "channels.{1}.streams.{id:key}.multicast_ttl": "{mc_ttl}"
        "channels.{1}.streams.{id:key}.multicast_port_min": "{mc_min}"
        "channels.{1}.streams.{id:key}.multicast_port_max": "{mc_max}"
        "channels.{1}.streams.{id:key}.reconnect_interval": "{reconnect}"
        "channels.{1}.streams.{id:key}.connect_timeout": "{timeout}"
        "channels.{1}.streams.{id:key}.user": "{user}"
        "channels.{1}.streams.{id:key}.old_rtmp": "{old}"
        "channels.{1}.streams.{id:key}.srt_mode": "{mode}"
        "channels.{1}.streams.{id:key}.latency": "{latency}"
        "channels.{1}.streams.{id:key}.stream_id": "{sid}"
        "channels.{1}.streams.{id:key}.max_bandwidth": "{maxbw}"
        "channels.{1}.streams.{id:key}.key_length": "{keylen}"
        "channels.{1}.streams.{id:key}.segment_time": "{segment}"
        "channels.{1}.streams.{id:key}.null_packets": "{nullmul}"
        "channels.{1}.streams.{id:key}.bind_port": "{bind_port}"
        "channels.{1}.streams.{id:key}.load_type": "{load}"
        "channels.{1}.streams.{id:key}.ts_service_name": "{svc}"
        "channels.{1}.streams.{id:key}.ts_service_provider": "{provider}"
        "channels.{1}.streams.{id:key}.ts_transport_stream_id": "{tsid}"
        "channels.{1}.streams.{id:key}.ts_tables_version": "{tables}"
        "channels.{1}.streams.{id:key}.ts_pcr_period": "{pcr}"
        "channels.{1}.streams.{id:key}.ts_start_pid": "{pid}"
        "channels.{1}.streams.{id:key}.ts_pmt_start_pid": "{pmt}"
    - path: '^/api/streamer/shortcuts/list$'
      json: { panel: "$.panel_enable", record: "$.shortcuts_record" }
      state: { panel.panel_streaming: "{panel}", panel.quick_record_sources: "{record}" }
    - path: '^/api/streamer/shortcuts/list$'
      json_each: "$.hdmi"
      json: { id: "$.id", quick: "$.auto_enable" }
      state: { "channels.hdmi.streams.{id:key}.quick_stream": "{quick}" }
    - path: '^/api/streamer/shortcuts/list$'
      json_each: "$.sdi"
      json: { id: "$.id", quick: "$.auto_enable" }
      state: { "channels.sdi.streams.{id:key}.quick_stream": "{quick}" }
