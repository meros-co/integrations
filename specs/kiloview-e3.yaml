quirks:
  - models: [all]
    severity: info
    text: >
      Replies: writes answer {"result":"ok","msg":null}, or result "error"
      with a message in msg, and a command fails unless result is ok. Some
      reads answer inside {"result":"ok","data":...}, the talk service's
      inside msg, and many answer their object or array bare (the stream
      and audio encoder lists, video encoding, input detail, audio input,
      crop, orientation, overlays, EDID, PIP, ONVIF, NDI bridge); get_
      commands return the whole body. Interface names in paths are hdmi,
      sdi, pip (the HDMI+SDI mix) and uvc (a USB camera).
  - models: [all]
    severity: info
    text: >
      Nothing is pushed: every 2 s the channels' encoding switches,
      recording, stream lists (on/off and status) and network traffic are
      read; every 5 s system health (CPU, memory, disk, temperature,
      uptime), inputs, storage, network links, quick-stream state and the
      intercom link; every 30 s encoding, audio, picture, PIP, EDID,
      recording, PTZ and panel configuration; every 120 s system,
      users, time, presets, network administration, KiloLink, intercom,
      ONVIF and NDI bridge. Each write that succeeds has what it changed
      read again at once. Channels a model or mode does not use answer
      errors, which change nothing.
  - models: [all]
    severity: warning
    text: >
      API authentication (firmware 1.21 and later) is off by default.
      Once on, every request must carry a login token in the Authorization
      header, as it is (no "Bearer"), or the device answers Unauthorized.
      With the password setting set, the core logs in with the username and
      password settings, keeps the token the answer holds (data.token) and
      sends it on every later request; a request answered 401 has it log
      in again and send the request once more. Set the password before
      turning authentication on with set_api_auth. The document gives no
      token lifetime and no refresh; the sibling P3's example token is a
      JSON Web Token with an expiry. The document's session check
      (/users/session, with a cookie the web page assembles from the
      login) is the web interface's and is not used here.
  - models: [all]
    severity: critical
    text: >
      set_api_auth with enabled true while the token setting is empty or
      holds no valid token locks this integration out (every request is
      refused) until a token is set. set_web_ports can turn off the
      protocol or move the port this device is opened on, and set_network,
      set_ethernet and set_interface_enabled can change or remove the
      address it is reached at; the connection is then lost until the
      device is opened again at its new address or port.
  - models: [all]
    severity: critical
    text: >
      factory_reset clears every setting made on the device (users,
      network, streams, encoding, recording) and cannot be undone; reboot
      restarts the device at once, stopping every stream and recording;
      restart_codec restarts the encoding service, interrupting streams and
      recordings. load_preset replaces the configuration of the modules the
      preset holds. upload_firmware and merge_firmware install firmware
      and the device restarts. delete_recording_file deletes the file
      from the storage. remove_user, delete_preset, delete_stream,
      delete_audio_encoder, delete_osd_item, delete_image, remove_nas and
      delete_static_route cannot be undone.
  - models: [all]
    severity: warning
    text: >
      set_encoding_enabled false stops a channel's video and audio
      encoding, and with it its streams and recording. restore_ndi_compliance
      overwrites the channel's sub stream encoding. set_quick_stream starts
      or stops every stream and recording in the quick lists at once;
      set_quick_stream_flag only changes the stored switch.
  - models: [all]
    severity: info
    text: >
      Documented as written though unusual: set_hostname and set_webrtc are
      GET requests with their values in the query; list_audio_encoders is a
      POST; delete_audio_encoder is a POST to the encoder's path, not a
      DELETE; the network speed and Ethernet reads name their port query
      parameter iframe, while the network writes send ifname as their
      examples do; the NDI bridge write's table names its switch enabled
      while its example and the read use enable, which is sent here;
      set_orientation sends rotate as a number as the example does, though
      the table says string; static routes and merge_firmware's number
      follow their examples. The NDI-standard check's example shows Python
      True and False, which is not JSON; get_ndi_compliance therefore
      returns the reply's text.
  - models: [all]
    severity: info
    text: >
      PTZ actions: the document names up, down, left and right, home,
      stop-move and stop-all, and preset actions whose names end in preset
      with a preset number, and says zoom and focus are controlled too,
      without listing those names. ptz_move adds the four diagonals named
      in the P3 document of the same API family; ptz_preset and ptz_custom
      take the device's action name as text for what the document does not
      list. Movement continues until a stop action.
  - models: [all]
    severity: info
    text: >
      API limits: the API reports no live encoder bitrate, dropped frames
      or stream statistics, only each stream's status and the network
      port's traffic (whose unit the document does not give); the
      temperature has no documented unit. Passwords, the KiloLink
      authorization code, the NDI bridge key, SRT passphrases, RTMP
      passwords and NAS mount options are written by commands but not kept
      in state.
  - models: [all]
    severity: info
    text: >
      The encoding snapshot JPEG (/api/codec/{interface}/venc/snap,
      save_snapshot), the preset download and export (/system_preset/download,
      /system_preset/{pid}/export) and the log export (/system_log/export/{time})
      are saved to host files. Two intercom requests the
      document marks as not for the front end (dLinkLDEnable,
      notifyDevDelTalk) are exchanged between devices and are not offered.
  - models: [all]
    severity: info
    text: >
      Uploads (certificate, firmware, preset, EDID, images, standby frame)
      are multipart form data with the file in a part named file, as the
      document's Binary file parameter implies; the part names other than
      file and the file names sent are not documented. A whole firmware
      package must arrive within the 5-second request timeout; on a slow
      link use upload_firmware_chunk for each part, numbered from 0, then
      merge_firmware.
  - models: [re-3]
    severity: info
    text: >
      The RE-3 card has no front-panel screen or buttons of its own; the
      quick-stream and tally display settings are the API's and may have
      no visible effect on the card.
