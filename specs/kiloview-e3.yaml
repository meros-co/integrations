      file_id: *osd_file
      position: *osd_position
      x: *osd_x
      y: *osd_y
      font_size: *osd_size
      style: *osd_style
      font_color: *osd_color
      outline: *osd_outline
      outline_color: *osd_outline_color
      enabled: *osd_enabled
    send: { method: PUT, path: "/api/codec/{interface}/vpss/osd/{osd_id}", content_type: application/json,
            body: '{"id":{osd_id:json},"type":"{type}","file_id":{file_id:json},"text":{text:json},"x":{x},"y":{y},"position":"{position}","font_size":{font_size},"style":"{style}","outline":{outline:map.osd_outline},"font_color":{font_color:map.osd_color},"outline_color":{outline_color:map.osd_color},"enable":{enabled}}' }
    expect: *ok
    returns: ack

  delete_osd_item:
    summary: "Delete an overlay item (DELETE /api/codec/{interface}/vpss/osd/{osd_id})"
    params:
      interface: *iface
      osd_id: *osd_id
    send: { method: DELETE, path: "/api/codec/{interface}/vpss/osd/{osd_id}" }
    expect: *ok
    returns: ack

