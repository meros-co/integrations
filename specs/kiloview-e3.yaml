                    description: "The HDMI window's layer; the higher number is in front." }
      hdmi_shown: { type: bool, default: true, label: HDMI shown,
                    description: "Whether the HDMI window is shown." }
      sdi_x: { type: float, min: 0, max: 100, required: true, label: SDI left,
               description: "The SDI window's left edge, in percent of the picture's width." }
      sdi_y: { type: float, min: 0, max: 100, required: true, label: SDI top,
               description: "The SDI window's top edge, in percent of the picture's height." }
      sdi_width: { type: float, min: 0, max: 100, required: true, label: SDI width,
                   description: "The SDI window's width, in percent of the picture's width." }
      sdi_height: { type: float, min: 0, max: 100, required: true, label: SDI height,
                    description: "The SDI window's height, in percent of the picture's height." }
      sdi_layer: { type: int, min: 0, max: 10, required: true, label: SDI layer,
                   description: "The SDI window's layer; the higher number is in front." }
      sdi_shown: { type: bool, default: true, label: SDI shown,
                   description: "Whether the SDI window is shown." }
