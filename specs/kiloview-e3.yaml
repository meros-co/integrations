  get_webrtc:
    summary: "The WebRTC preview's port and SDP mode, as the device answers (GET /api/streamer/{interface}/stream/get_webrtc)"
    params:
      interface: *iface
    send: { method: GET, path: "/api/streamer/{interface}/stream/get_webrtc" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_webrtc:
    summary: "Set a stream's WebRTC mode, video or image (GET /api/streamer/{interface}/stream/set_webrtc, a GET as documented)"
    params:
      interface: *iface
      stream_id: *stream_id
      mode: { type: enum, values: [video, image], required: true, label: WebRTC mode,
              description: "video sends the moving picture, image still images." }
    send: { method: GET, path: "/api/streamer/{interface}/stream/set_webrtc",
            query: { stream_id: "{stream_id}", mode: "{mode:map.webrtc_mode}" } }
