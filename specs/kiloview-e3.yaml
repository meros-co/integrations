      enabled: { type: bool, required: true, label: ONVIF,
                 description: "Whether the ONVIF service runs." }
      discoverable: { type: bool, default: true, label: Discoverable,
                      description: "Whether ONVIF clients can discover the device." }
      discover_port: { type: int, min: 1, max: 65535, default: 3702, label: Discovery port,
                       description: "The WS-Discovery port, 3702 (not changeable yet, as documented)." }
