  # ── Network (4) ─────────────────────────────────────────────────────────
  get_network:
    summary: "Every network port's link, address, mask, gateway, MAC, DHCP or static, and DNS (GET /api/networkmanager/network/GetLinkinfo)"
    send: { method: GET, path: /api/networkmanager/network/GetLinkinfo }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_ethernet:
    summary: "One network port's settings, as the front panel reads them (GET /api/networkmanager/network/GetEthernets?iframe=...)"
    params:
      ifname: &ifname { type: string, default: eth0, max_length: 16, pattern: '^[a-z0-9]+$', label: Network port,
                        description: "The network port's name, eth0 for the Ethernet port." }
    send: { method: GET, path: /api/networkmanager/network/GetEthernets, query: { iframe: "{ifname}" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_network:
    summary: "Set a network port's address, mask, gateway, MAC, DHCP or static and DNS (POST /api/networkmanager/network/ChangeLinkinfo)"
    params:
      ifname: *ifname
      method: &net_method { type: enum, values: [dhcp, static], required: true, label: Addressing,
                            description: "dhcp takes an address from DHCP, static uses the address given." }
      address: &net_address { type: string, required: true, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', label: IP address,
                              description: "The static IP address (sent with DHCP too, as the form does)." }
      netmask: &net_mask { type: string, required: true, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', label: Subnet mask,
                           description: "The subnet mask, such as 255.255.255.0." }
      gateway: &net_gateway { type: string, default: "", pattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3})?$', label: Gateway,
                              description: "The default gateway, empty for none." }
      mac: &net_mac { type: string, required: true, pattern: '^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$', label: MAC address,
                      description: "The port's MAC address, as get_network gives it." }
      enabled: { type: bool, default: true, label: Port enabled,
                 description: "Whether the port is in use." }
      dns: &net_dns { type: string, default: "", max_length: 256, pattern: '^([0-9.]+(;[0-9.]+)*)?$', label: DNS servers,
                      description: "DNS server addresses separated by semicolons, empty for none." }
    send: { method: POST, path: /api/networkmanager/network/ChangeLinkinfo, content_type: application/json,
            body: '{"ifname":{ifname:json},"cfg":{"address":{address:json},"netmask":{netmask:json},"gw":{gateway:json},"mac":{mac:json},"method":"{method}","enable":{enabled},"dns":{dns:json}}}' }
    expect: *ok
    returns: ack

  set_ethernet:
    summary: "Set a network port as the front panel does (POST /api/networkmanager/network/SetEthernets)"
    params:
      ifname: *ifname
      method: *net_method
      address: *net_address
      netmask: *net_mask
      gateway: *net_gateway
      mac: *net_mac
      dns: *net_dns
    send: { method: POST, path: /api/networkmanager/network/SetEthernets, content_type: application/json,
            body: '{"ifname":{ifname:json},"address":{address:json},"netmask":{netmask:json},"gw":{gateway:json},"mac":{mac:json},"method":"{method}","dns":{dns:json}}' }
    expect: *ok
    returns: ack

  set_interface_enabled:
    summary: "Turn a network port on or off (POST /api/networkmanager/network/SetSwitch)"
    params:
      ifname: *ifname
      enabled: { type: bool, required: true, label: Port enabled,
                 description: "Whether the network port is active." }
    send: { method: POST, path: /api/networkmanager/network/SetSwitch, content_type: application/json,
            body: '{"ifname":{ifname:json},"enable":{enabled}}' }
    expect: *ok
    returns: ack

  reset_mdns:
    summary: "Restart mDNS at once (GET /api/networkmanager/network/ResetMDNS)"
    send: { method: GET, path: /api/networkmanager/network/ResetMDNS }
    expect: *ok
    returns: ack

  add_static_route:
    summary: "Add a static route (POST /api/networkmanager/static/routing/add)"
    params:
      interface: &route_iface { type: string, default: eth0, max_length: 16, pattern: '^[a-z0-9]+$', label: Network port,
                                description: "The network port the route uses, eth0 for the Ethernet port." }
      target: &route_target { type: string, required: true, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', label: Destination,
                              description: "The destination network or host address." }
      netmask: &route_mask { type: string, required: true, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', label: Destination mask,
                             description: "The destination's mask." }
      gateway: &route_gateway { type: string, required: true, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', label: Gateway,
                                description: "The gateway the route sends through." }
      mtu: &route_mtu { type: int, min: 0, max: 65535, default: 1500, label: MTU,
                        description: "The route's maximum transmission unit in bytes." }
      metric: &route_metric { type: int, min: 0, default: 0, label: Metric,
                              description: "The route's cost; the lower is preferred." }
    send: { method: POST, path: /api/networkmanager/static/routing/add, content_type: application/json,
            body: '{"interface":{interface:json},"target":{target:json},"netmask":{netmask:json},"gateway":{gateway:json},"mtu":{mtu},"metric":{metric}}' }
    expect: *ok
    returns: ack

  get_static_routes:
    summary: "The saved static routes (GET /api/networkmanager/static/routing/get)"
    send: { method: GET, path: /api/networkmanager/static/routing/get }
    expect: { status: 200, json_path: "$" }
    returns: value

  modify_static_route:
    summary: "Change a static route (POST /api/networkmanager/static/routing/modify)"
    params:
      id: &route_id { type: int, min: 0, required: true, label: Route ID,
                      description: "The route's id, as get_static_routes gives it." }
      interface: *route_iface
      target: *route_target
      netmask: *route_mask
      gateway: *route_gateway
      mtu: *route_mtu
      metric: *route_metric
    send: { method: POST, path: /api/networkmanager/static/routing/modify, content_type: application/json,
            body: '{"id":{id},"interface":{interface:json},"target":{target:json},"netmask":{netmask:json},"gateway":{gateway:json},"mtu":{mtu},"metric":{metric}}' }
    expect: *ok
    returns: ack

  delete_static_route:
    summary: "Delete a static route (POST /api/networkmanager/static/routing/del)"
    params:
      id: *route_id
    send: { method: POST, path: /api/networkmanager/static/routing/del, content_type: application/json,
            body: '{"ids":{id}}' }
    expect: *ok
    returns: ack

  set_static_route_enabled:
    summary: "Turn a static route on or off (POST /api/networkmanager/static/routing/set)"
    params:
      id: *route_id
      enabled: { type: bool, required: true, label: Route enabled,
                 description: "Whether the route is in use." }
    send: { method: POST, path: /api/networkmanager/static/routing/set, content_type: application/json,
            body: '{"id":{id},"status":{enabled:bool01}}' }
    expect: *ok
    returns: ack

  # ── KiloLink client (5) ─────────────────────────────────────────────────
  get_kilolink_interfaces:
    summary: "The network ports the KiloLink client can use (GET /api/kilolink/networks)"
    send: { method: GET, path: /api/kilolink/networks }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_kilolink:
    summary: "The KiloLink client: server, port, network port, encryption, on or off and connection status (GET /api/kilolink/get)"
    send: { method: GET, path: /api/kilolink/get }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_kilolink:
    summary: "Set the KiloLink client that registers the device with a KiloLink server (POST /api/kilolink/set)"
    params:
      enabled: { type: bool, required: true, label: KiloLink,
                 description: "Whether the device connects to the KiloLink server." }
      server: { type: string, required: true, max_length: 253, label: Server,
                description: "The KiloLink server's address." }
      port: { type: int, min: 1, max: 65535, default: 50000, label: Server port,
              description: "The KiloLink server's port, 50000 by default." }
      auth_code: { type: string, required: true, secret: true, max_length: 128, label: Authorization code,
                   description: "The authorization code the KiloLink server gives." }
      encrypted: { type: bool, default: false, label: Encrypted,
                   description: "Whether the connection to the server is encrypted." }
      ifname: *ifname
    send: { method: POST, path: /api/kilolink/set, content_type: application/json,
            body: '{"cfg":{"enable":{enabled},"key":{auth_code:json},"ip":{server:json},"port":{port},"crypto":{encrypted},"ifname":[{ifname:json}]}}' }
    expect: *ok
    returns: ack

  # ── Video input and EDID (6.1) ──────────────────────────────────────────
  get_edid:
    summary: "The HDMI EDID as base64, its priority (1080p, 4K or none) and whether it can be reset (GET /api/codec/vin/edid)"
    send: { method: GET, path: /api/codec/vin/edid }
    expect: { status: 200, json_path: "$" }
    returns: value

  upload_edid:
    summary: "Upload an EDID file for the HDMI input, multipart form data (POST /api/codec/vin/edid/upload)"
    params:
      file: { type: binary, required: true, label: EDID file,
              description: "The EDID binary file." }
    send:
      method: POST
      path: /api/codec/vin/edid/upload
      multipart:
        - { name: file, binary: file, filename: edid.bin, content_type: application/octet-stream }
    expect: *ok
    returns: ack

  set_edid_priority:
    summary: "Set the HDMI EDID's preferred format: 1080p, 4K or none (POST /api/codec/vin/edid/priority)"
    params:
      priority: { type: enum, values: [1080p, 4k, none], required: true, label: EDID priority,
                  description: "The format the HDMI input asks sources for first: 1080p, 4k, or none." }
    send: { method: POST, path: /api/codec/vin/edid/priority, content_type: application/json,
            body: '{"edid_priority":{priority:map.edid_priority}}' }
    expect: *ok
    returns: ack

  reset_edid:
    summary: "Restore the factory EDID (GET /api/codec/vin/edid/reset)"
    send: { method: GET, path: /api/codec/vin/edid/reset }
    expect: *ok
    returns: ack

  get_active_channels:
    summary: "Which encoder channels are on: hdmi, sdi, pip, uvc (GET /api/codec/vin/active_interface)"
    send: { method: GET, path: /api/codec/vin/active_interface }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_input:
    summary: "A channel's input: signal, format, size, rate, interlace and the source's limits (GET /api/codec/{interface}/vin/detail)"
    params:
      interface: *iface
    send: { method: GET, path: "/api/codec/{interface}/vin/detail" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_uvc_formats:
    summary: "The USB camera's formats, resolutions and frame rates (GET /api/codec/uvc/vin/list_format)"
    send: { method: GET, path: /api/codec/uvc/vin/list_format }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_uvc_input:
    summary: "Choose the USB camera's format, resolution and frame rate (POST /api/codec/uvc/vin/source)"
    params:
      encoding: { type: enum, values: [mjpeg, h264, h265], required: true, label: Camera format,
                  description: "The format the camera sends, one get_uvc_formats lists." }
      resolution: { type: string, required: true, pattern: '^[0-9]{3,4}x[0-9]{3,4}$', label: Resolution,
                    description: "The resolution as WIDTHxHEIGHT, one get_uvc_formats lists, such as 1920x1080." }
      fps: { type: int, min: 1, max: 120, required: true, label: Frame rate,
             description: "The frame rate, one get_uvc_formats lists for that resolution." }
    send: { method: POST, path: /api/codec/uvc/vin/source, content_type: application/json,
            body: '{"input_encode":"{encoding}","input_resolution":{resolution:json},"input_fps":{fps}}' }
    expect: *ok
    returns: ack

  set_pip_input:
    summary: "Set the mix channel's picture size and frame rate (POST /api/codec/pip/vin/source)"
    params:
      width: &pip_w { type: int, min: 1, max: 4096, required: true, label: Width,
                      description: "The mixed picture's width in pixels." }
      height: &pip_h { type: int, min: 1, max: 4096, required: true, label: Height,
                       description: "The mixed picture's height in pixels." }
      fps: &pip_fps { type: enum, values: ["24", "25", "30", "50", "60"], required: true, label: Frame rate,
                      description: "The mixed picture's frame rate: 24, 25, 30, 50 or 60." }
    send: { method: POST, path: /api/codec/pip/vin/source, content_type: application/json,
            body: '{"width":{width},"height":{height},"input_fps":{fps}}' }
    expect: *ok
    returns: ack

  # ── Audio (6.2) ─────────────────────────────────────────────────────────
  get_audio_input:
    summary: "A channel's audio source, sample rate, channel count, channel pair and gain (GET /api/codec/{interface}/audio/input)"
    params:
      interface: *iface
    send: { method: GET, path: "/api/codec/{interface}/audio/input" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_audio_input:
    summary: "Choose a channel's audio source, gain and mute (POST /api/codec/{interface}/audio/input/source)"
    params:
      interface: *iface
      source: { type: enum, values: [hdmi, sdi, linein, uvc], required: true, label: Audio source,
                description: "Where the channel's audio comes from: HDMI or SDI embedded, the line input, or the USB camera." }
      gain: { type: int, min: -40, max: 20, default: 0, label: Gain,
              description: "The audio gain in dB, -40 to 20." }
      mute: { type: bool, default: false, label: Mute,
              description: "Whether the channel's audio is muted." }
    send: { method: POST, path: "/api/codec/{interface}/audio/input/source", content_type: application/json,
            body: '{"source":"{source}","gain":{gain},"mute":{mute}}' }
    expect: *ok
    returns: ack

  list_audio_encoders:
    summary: "A channel's audio encoders: id, name, codec, rate, channels, bitrate (POST /api/codec/{interface}/audio/encode/list, a POST as documented)"
    params:
      interface: *iface
    send: { method: POST, path: "/api/codec/{interface}/audio/encode/list" }
    expect: { status: 200, json_path: "$" }
    returns: value

  add_audio_encoder:
    summary: "Add an audio encoder to a channel (POST /api/codec/{interface}/audio/encode)"
    params:
      interface: *iface
      name: &aenc_name { type: string, required: true, max_length: 64, label: Name,
                         description: "The audio encoder's name." }
      codec: &aenc_codec { type: enum, values: [AAC, G711, MP2, MP3], required: true, label: Codec,
                           description: "The audio codec: AAC, G.711, MP2 or MP3." }
      sampling: &aenc_rate { type: int, min: 8000, max: 96000, default: 48000, label: Sample rate,
                             description: "The sample rate in Hz, such as 48000 (G.711 uses 8000)." }
      bitrate: &aenc_bitrate { type: int, min: 1, default: 64000, label: Bitrate,
                               description: "The audio bitrate, as the device's examples give it (64000)." }
      channels: &aenc_channels { type: int, min: 1, max: 8, default: 2, label: Channels,
                                 description: "The number of audio channels; G.711 is always 1." }
      resample: &aenc_resample { type: enum, values: [common, fastest], default: fastest, label: Resampling,
                                 description: "The G.711 resampling: common for higher quality, fastest for less load." }
      g711_law: &aenc_law { type: enum, values: [PCMU, PCMA], default: PCMU, label: G.711 law,
                            description: "The G.711 variant: PCMU (u-law) or PCMA (A-law)." }
      tracks: &aenc_tracks { type: int, min: 1, max: 4, default: 1, label: Tracks,
                             description: "The number of audio tracks." }
    send: { method: POST, path: "/api/codec/{interface}/audio/encode", content_type: application/json,
            body: '{"name":{name:json},"codec":"{codec}","sampling":{sampling},"bitrate":{bitrate},"channels":{channels},"resample":"{resample}","g711Law":"{g711_law}","track_num":{tracks}}' }
    expect: *ok
    returns: ack

  update_audio_encoder:
    summary: "Change an audio encoder (PUT /api/codec/{interface}/audio/encode/{audio_id})"
    params:
      interface: *iface
      audio_id: &audio_id { type: int, min: 0, required: true, label: Audio encoder ID,
                            description: "The audio encoder's id, as list_audio_encoders gives it." }
      name: *aenc_name
      codec: *aenc_codec
      sampling: *aenc_rate
      bitrate: *aenc_bitrate
      channels: *aenc_channels
      resample: *aenc_resample
      g711_law: *aenc_law
      tracks: *aenc_tracks
    send: { method: PUT, path: "/api/codec/{interface}/audio/encode/{audio_id}", content_type: application/json,
            body: '{"id":{audio_id},"name":{name:json},"codec":"{codec}","resample":"{resample}","sampling":{sampling},"channels":{channels},"bitrate":{bitrate},"g711Law":"{g711_law}","track_num":{tracks}}' }
    expect: *ok
    returns: ack

  delete_audio_encoder:
    summary: "Delete an audio encoder (POST /api/codec/{interface}/audio/encode/{audio_id}, a POST as documented)"
    params:
      interface: *iface
      audio_id: *audio_id
    send: { method: POST, path: "/api/codec/{interface}/audio/encode/{audio_id}" }
    expect: *ok
    returns: ack

  list_audio_sources:
    summary: "The audio sources a channel can use (GET /api/codec/{interface}/audio/input/list_source)"
    params:
      interface: *iface
    send: { method: GET, path: "/api/codec/{interface}/audio/input/list_source" }
    expect: { status: 200, json_path: "$" }
    returns: value

  # ── Video encoding and picture-in-picture (6.3) ─────────────────────────
  save_snapshot:
    summary: "Save a channel's encoding snapshot, a JPEG, to a host file (GET /api/codec/{interface}/venc/snap); a channel not encoding answers a black picture with a white prompt"
    params:
      interface: *iface
      to: { type: save, required: true, label: Save to, description: "The host file the download is written to; replaced once the whole file has arrived." }
    send: { method: GET, path: "/api/codec/{interface}/venc/snap", save: to }
    expect: { status: 200 }
    returns: file

  get_video_encoding:
    summary: "A channel's main or sub video encoding: codec, size, rate control, bitrate, GOP, frame rate, QP and timecode (GET /api/codec/{interface}/venc/settings)"
    params:
      interface: *iface
      venc_type: &venc_type { type: enum, values: [main, sub], default: main, label: Video stream,
                              description: "main for the main encoding, sub for the sub stream (NDI|HX's low-resolution one)." }
    send: { method: GET, path: "/api/codec/{interface}/venc/settings", query: { venc_type: "{venc_type}" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_video_encoding:
    summary: "Set a channel's main or sub video encoding with a fixed frame rate (POST /api/codec/{interface}/venc/settings)"
    params:
      interface: *iface
      venc_type: *venc_type
      codec: &venc_codec { type: enum, values: [H264, H265, MJPEG], required: true, label: Codec,
                           description: "H264, H265, or MJPEG (sub stream only, for the snapshot)." }
      grey: &venc_grey { type: bool, default: false, label: Greyscale,
                         description: "Whether the picture is encoded in greyscale." }
      profile: &venc_profile { type: int, min: 0, max: 2, default: 2, label: Profile,
                               description: "The H.264 profile: 0 Baseline, 1 Main, 2 High; other codecs take only 0." }
      width: &venc_w { type: int, min: 1, max: 4096, default: 1, label: Width,
                       description: "The encoded width in pixels; width and height both 1 follow the input." }
      height: &venc_h { type: int, min: 1, max: 4096, default: 1, label: Height,
                        description: "The encoded height in pixels; width and height both 1 follow the input." }
      mode: &venc_mode { type: enum, values: [CBR, VBR], default: CBR, label: Rate control,
                         description: "CBR keeps the bitrate constant, VBR varies it up to the maximum." }
      gop: &venc_gop { type: int, min: 1, max: 1000, default: 60, label: GOP,
                       description: "The GOP length in frames." }
      fps: { type: int, min: 1, max: 60, required: true, label: Frame rate,
             description: "The encoded frame rate in frames per second." }
      bitrate: &venc_bitrate { type: int, min: 1, required: true, label: Bitrate,
                               description: "The CBR bitrate in kb/s." }
      max_bitrate: &venc_max { type: int, min: 1, default: 6000, label: Maximum bitrate,
                               description: "The VBR maximum bitrate in kb/s." }
      min_qp: &venc_minqp { type: int, min: 0, max: 51, default: 24, label: Minimum QP,
                            description: "VBR's lowest quantizer." }
      max_qp: &venc_maxqp { type: int, min: 0, max: 51, default: 51, label: Maximum QP,
                            description: "VBR's highest quantizer." }
      min_iqp: &venc_miniqp { type: int, min: 0, max: 51, default: 24, label: Minimum I-frame QP,
                              description: "VBR's lowest quantizer for I frames." }
      min_ip: &venc_minip { type: int, min: 0, default: 1, label: Minimum I/P ratio,
                            description: "CBR's lowest I-to-P frame size ratio." }
      max_ip: &venc_maxip { type: int, min: 0, default: 20, label: Maximum I/P ratio,
                            description: "CBR's highest I-to-P frame size ratio." }
      min_qfactor: &venc_minq { type: int, min: 1, max: 99, default: 80, label: Minimum MJPEG quality,
                                description: "MJPEG's lowest picture quality." }
      max_qfactor: &venc_maxq { type: int, min: 1, max: 99, default: 85, label: Maximum MJPEG quality,
                                description: "MJPEG's highest picture quality." }
      deinterlace: &venc_deint { type: enum, values: [weave, line_doubling], default: weave, label: Deinterlacing,
                                 description: "How an interlaced input is made progressive: weave or line doubling." }
      timecode: &venc_tc { type: enum, values: ["0", "1", "2"], default: "0", label: Timecode,
                           description: "The timecode written: 0 none, 1 the system time, 2 the input's (not supported yet)." }
    send: { method: POST, path: "/api/codec/{interface}/venc/settings", content_type: application/json,
            body: '{"venc_type":"{venc_type}","codec":"{codec}","grey":{grey},"profile":{profile},"picWidth":{width},"picHeight":{height},"mode":"{mode}","gop":{gop},"fps":{fps},"bitrate":{bitrate},"maxBitrate":{max_bitrate},"minQp":{min_qp},"maxQp":{max_qp},"minIQp":{min_iqp},"minIp":{min_ip},"maxIp":{max_ip},"minQfactor":{min_qfactor},"maxQfactor":{max_qfactor},"deinterlaceMode":"{deinterlace}","timecode_type":{timecode}}' }
    expect: *ok
    returns: ack

  set_video_encoding_auto_fps:
    summary: "Set a channel's video encoding with the input's frame rate, or half of it at 50 fps and above (POST /api/codec/{interface}/venc/settings, fps auto or half)"
    params:
      interface: *iface
      venc_type: *venc_type
      codec: *venc_codec
      grey: *venc_grey
      profile: *venc_profile
      width: *venc_w
      height: *venc_h
      mode: *venc_mode
      gop: *venc_gop
      fps_mode: { type: enum, values: [auto, half], required: true, label: Frame rate,
                  description: "auto encodes at the input's full frame rate, half halves it when the input runs at 50 fps or more." }
      bitrate: *venc_bitrate
      max_bitrate: *venc_max
      min_qp: *venc_minqp
      max_qp: *venc_maxqp
      min_iqp: *venc_miniqp
      min_ip: *venc_minip
      max_ip: *venc_maxip
      min_qfactor: *venc_minq
      max_qfactor: *venc_maxq
      deinterlace: *venc_deint
      timecode: *venc_tc
    send: { method: POST, path: "/api/codec/{interface}/venc/settings", content_type: application/json,
            body: '{"venc_type":"{venc_type}","codec":"{codec}","grey":{grey},"profile":{profile},"picWidth":{width},"picHeight":{height},"mode":"{mode}","gop":{gop},"fps":{fps_mode:map.fps_mode},"bitrate":{bitrate},"maxBitrate":{max_bitrate},"minQp":{min_qp},"maxQp":{max_qp},"minIQp":{min_iqp},"minIp":{min_ip},"maxIp":{max_ip},"minQfactor":{min_qfactor},"maxQfactor":{max_qfactor},"deinterlaceMode":"{deinterlace}","timecode_type":{timecode}}' }
    expect: *ok
    returns: ack

  set_video_bitrate:
    summary: "Change only a channel's CBR bitrate, live (POST /api/codec/{interface}/venc/bitrate)"
    params:
      interface: *iface
      venc_type: *venc_type
      bitrate: *venc_bitrate
    send: { method: POST, path: "/api/codec/{interface}/venc/bitrate", content_type: application/json,
            body: '{"venc_type":"{venc_type}","bitrate":{bitrate}}' }
    expect: *ok
    returns: ack

  set_encoding_enabled:
    summary: "Turn a channel's video and audio encoding on or off entirely (POST /api/codec/{interface}/venc/enable)"
    params:
      interface: *iface
      enabled: { type: bool, required: true, label: Encoding,
                 description: "Whether the channel encodes; off stops its video and audio encoding and so its streams and recording." }
    send: { method: POST, path: "/api/codec/{interface}/venc/enable", content_type: application/json,
            body: '{"enable":{enabled}}' }
    expect: *ok
    returns: ack

  swap_pip:
    summary: "Swap which input is the main picture in picture-in-picture (POST /api/codec/pip/venc/pip_back_update)"
    send: { method: POST, path: /api/codec/pip/venc/pip_back_update }
    expect: *ok
    returns: ack

  get_pip_layout:
    summary: "The picture-in-picture windows: each input's position, size and layer in percent, and whether shown (GET /api/codec/pip/venc/pip_layout_setting)"
    send: { method: GET, path: /api/codec/pip/venc/pip_layout_setting }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_pip_layout:
    summary: "Set both picture-in-picture windows, HDMI and SDI (POST /api/codec/pip/venc/pip_layout_setting)"
    params:
      hdmi_x: { type: float, min: 0, max: 100, required: true, label: HDMI left,
                description: "The HDMI window's left edge, in percent of the picture's width." }
      hdmi_y: { type: float, min: 0, max: 100, required: true, label: HDMI top,
                description: "The HDMI window's top edge, in percent of the picture's height." }
      hdmi_width: { type: float, min: 0, max: 100, required: true, label: HDMI width,
                    description: "The HDMI window's width, in percent of the picture's width." }
      hdmi_height: { type: float, min: 0, max: 100, required: true, label: HDMI height,
                     description: "The HDMI window's height, in percent of the picture's height." }
