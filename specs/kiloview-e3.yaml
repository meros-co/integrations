    summary: "Set a channel's input rotation, mirror and flip (POST /api/codec/{interface}/vpss/input/rmf)"
    params:
      interface: *iface
      rotate: { type: enum, values: ["0", "90", "180", "270"], default: "0", label: Rotation,
                description: "The rotation in degrees: 0, 90, 180 or 270." }
      mirror: { type: bool, default: false, label: Mirror,
                description: "Whether the picture is mirrored left to right." }
      flip: { type: bool, default: false, label: Flip,
              description: "Whether the picture is flipped top to bottom." }
    send: { method: POST, path: "/api/codec/{interface}/vpss/input/rmf", content_type: application/json,
            body: '{"rotate":{rotate},"mirror_en":{mirror},"flip_en":{flip}}' }
