    send: { method: GET, path: "/api/codec/{interface}/vpss/osd" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_osd_enabled:
    summary: "Turn a channel's overlays on or off all at once (PUT /api/codec/{interface}/vpss/osd)"
    params:
      interface: *iface
      enabled: { type: bool, required: true, label: Overlays,
                 description: "Whether the channel's overlay items are shown." }
    send: { method: PUT, path: "/api/codec/{interface}/vpss/osd", content_type: application/json,
            body: '{"enable":{enabled}}' }
    expect: *ok
    returns: ack

  add_osd_item:
    summary: "Add an overlay item: text, date and time, date, time or image (POST /api/codec/{interface}/vpss/osd)"
    params:
      interface: *iface
      type: &osd_type { type: enum, values: [text, time, date, clock, image], required: true, label: Overlay type,
                        description: "text shows the text below, time the date and time, date the date, clock the time, image the image below." }
      text: &osd_text { type: string, default: "", max_length: 256, label: Text,
                        description: "For a text item, the text shown." }
      file_id: &osd_file { type: string, default: "", max_length: 64, pattern: '^[A-Za-z0-9_-]*$', label: Image ID,
                           description: "For an image item, the image's id as list_images gives it." }
      position: &osd_position { type: enum, values: [LeftTop, CenterTop, RightTop, LeftBottom, CenterBottom, RightBottom, Center, Manual],
                                default: LeftTop, label: Position,
                                description: "Where the item is shown; Manual places it at x and y." }
      x: &osd_x { type: int, min: 0, default: 0, label: X offset,
                  description: "With Manual, the item's horizontal offset." }
      y: &osd_y { type: int, min: 0, default: 0, label: Y offset,
                  description: "With Manual, the item's vertical offset." }
      font_size: &osd_size { type: int, min: 0, default: 1, label: Font size,
                             description: "0 large, 1 medium and 2 small, scaled to the picture; any other value is a size in pixels." }
      style: &osd_style { type: enum, values: [normal, bold], default: normal, label: Font style,
                          description: "normal or bold text." }
      font_color: &osd_color { type: enum, values: [black, white, red, blue, green, yellow, purple, cyan], default: white, label: Font color,
                               description: "The text color." }
      outline: &osd_outline { type: enum, values: [none, thin, thick], default: none, label: Outline,
                              description: "The text's outline: none, thin or thick." }
      outline_color: &osd_outline_color { type: enum, values: [black, white, red, blue, green, yellow, purple, cyan], default: black,
                                          label: Outline color, description: "The outline's color." }
      enabled: &osd_enabled { type: bool, default: true, label: Shown,
                              description: "Whether the item is shown." }
    send: { method: POST, path: "/api/codec/{interface}/vpss/osd", content_type: application/json,
            body: '{"type":"{type}","file_id":{file_id:json},"text":{text:json},"x":{x},"y":{y},"position":"{position}","font_size":{font_size},"style":"{style}","outline":{outline:map.osd_outline},"font_color":{font_color:map.osd_color},"outline_color":{outline_color:map.osd_color},"enable":{enabled}}' }
    expect: *ok
    returns: ack

  get_osd_item:
    summary: "One overlay item (GET /api/codec/{interface}/vpss/osd/{osd_id})"
    params:
      interface: *iface
      osd_id: &osd_id { type: string, required: true, max_length: 64, pattern: '^[A-Za-z0-9_-]+$', label: Overlay ID,
                        description: "The overlay item's id, as get_osd gives it." }
