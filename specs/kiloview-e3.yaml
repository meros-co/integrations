      bind_audio: *bind_audio
      bind_video: *bind_video
      stream_id_srt: *srt_streamid
      max_bandwidth: *srt_maxbw
      key_length: *srt_keylen
      passphrase: *srt_passphrase
    send: { method: PUT, path: "/api/streamer/{interface}/stream/{stream_id}", content_type: application/json,
            body: '{"id":{stream_id:json},"type":"srt","name":{name:json},"mode":"{mode}","address":{address:json},"port":{port},"latency":{latency},"bindAudio":{bind_audio},"bindVideo":"{bind_video}","streamid":{stream_id_srt:json},"maxbw":{max_bandwidth},"pbkeylen":{key_length},"passphrase":{passphrase:json}}' }
    expect: *ok
    returns: ack

  update_stream:
    summary: "Change a stream of any type with every field of API 3.1.2-3.1.3 (PUT /api/streamer/{interface}/stream/{stream_id}); stream is that JSON object with id and type"
    params:
      interface: *iface
      stream_id: *stream_id
