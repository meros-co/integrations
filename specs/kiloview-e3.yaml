    expect: *ok
    returns: ack

  # ── PTZ (3.2) ───────────────────────────────────────────────────────────
  ptz_move:
    summary: "Move the PTZ camera in a direction at a speed until stopped (GET /api/streamer/ptz/control?action=...&speed=...)"
    params:
      direction: { type: enum, values: [up, down, left, right, left-up, left-down, right-up, right-down], required: true, label: Direction,
                   description: "The direction to move; the diagonals are named in the P3 document of the same API (see quirks)." }
      speed: &ptz_speed { type: int, min: 0, max: 100, default: 50, label: Speed,
                          description: "The speed from 0 to 100, 50 by default." }
    send: { method: GET, path: /api/streamer/ptz/control, query: { action: "{direction}", speed: "{speed}" } }
    expect: *ok
    returns: ack

  ptz_action:
    summary: "Send the PTZ camera home, or stop its movement or everything (GET /api/streamer/ptz/control?action=...)"
    params:
      action: { type: enum, values: [home, stop-move, stop-all], required: true, label: Action,
                description: "home recalls the home position, stop-move stops pan and tilt, stop-all stops every movement." }
    send: { method: GET, path: /api/streamer/ptz/control, query: { action: "{action}" } }
    expect: *ok
    returns: ack

  ptz_preset:
    summary: "Send a preset action, whose name ends in preset, with the preset number (GET /api/streamer/ptz/control?action=...&id=...)"
    params:
      action: { type: string, required: true, max_length: 32, pattern: '^[a-z][a-z-]*preset$', label: Preset action,
                description: "The device's preset action name, ending in preset (the document does not list them; see quirks)." }
      preset: { type: int, min: 0, max: 255, required: true, label: Preset,
                description: "The preset number; the document recommends 1 to 16." }
    send: { method: GET, path: /api/streamer/ptz/control, query: { action: "{action}", id: "{preset}" } }
    expect: *ok
    returns: ack

  ptz_custom:
    summary: "Send any other PTZ action the device knows, such as zoom or focus, with a speed (GET /api/streamer/ptz/control)"
    params:
      action: { type: string, required: true, max_length: 32, pattern: '^[a-z][a-z-]*$', label: Action,
                description: "The device's action name, as its web PTZ panel sends it (the document names only the moves, home and stops)." }
      speed: *ptz_speed
    send: { method: GET, path: /api/streamer/ptz/control, query: { action: "{action}", speed: "{speed}" } }
    expect: *ok
    returns: ack

  get_ptz:
    summary: "The PTZ connection: on or off, network or serial, and each one's settings (GET /api/streamer/ptz/info)"
    send: { method: GET, path: /api/streamer/ptz/info }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_ptz_protocols:
    summary: "The PTZ protocols the device speaks: Sony Visca, Pelco-d, Pelco-p (GET /api/streamer/ptz/protocol)"
    send: { method: GET, path: /api/streamer/ptz/protocol }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_ptz_serial_devices:
    summary: "The serial adapters plugged into the device's USB ports, name and driver (GET /api/streamer/ptz/serial_device)"
    send: { method: GET, path: /api/streamer/ptz/serial_device }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_ptz:
    summary: "Set the PTZ connection and protocol (POST /api/streamer/ptz/modify); the network and serial fields are all sent"
    params:
      enabled: { type: bool, required: true, label: PTZ control,
                 description: "Whether the device controls a PTZ camera." }
      connection: { type: enum, values: [network, serial, usb], required: true, label: Connection,
                    description: "How the camera is reached: over the network, or a serial adapter." }
      protocol: { type: enum, values: [Sony Visca, Pelco-d, Pelco-p], default: Sony Visca, label: PTZ protocol,
                  description: "The camera control protocol." }
      camera_address: { type: int, min: 0, max: 255, default: 1, label: Camera address,
                        description: "The camera's address within the protocol, usually 1." }
      network_protocol: { type: enum, values: [UDP, TCP], default: UDP, label: Network protocol,
                          description: "For a network camera, UDP or TCP." }
      address: { type: string, default: "", max_length: 253, label: Camera address (IP),
                 description: "For a network camera, its IP address." }
      port: { type: int, min: 1, max: 65535, default: 52381, label: Camera port,
              description: "For a network camera, its control port, such as 52381 for VISCA over IP." }
      device: { type: string, default: none, max_length: 64, label: Serial device,
                description: "For a serial camera, the adapter's device name as get_ptz_serial_devices gives it, such as ttyUSB0." }
      baud_rate: { type: int, min: 1200, max: 115200, default: 9600, label: Baud rate,
                   description: "For a serial camera, the line speed in bits per second." }
      parity: { type: string, default: none, max_length: 8, pattern: '^[a-z]+$', label: Parity,
                description: "For a serial camera, the parity, none by default." }
      data_bits: { type: int, min: 5, max: 8, default: 8, label: Data bits,
                   description: "For a serial camera, the data bits, 8 by default." }
      stop_bits: { type: int, min: 1, max: 2, default: 1, label: Stop bits,
                   description: "For a serial camera, the stop bits, 1 by default." }
      xonxoff: { type: bool, default: false, label: XON/XOFF,
                 description: "For a serial camera, whether XON/XOFF flow control is on." }
      rtscts: { type: bool, default: false, label: RTS/CTS,
                description: "For a serial camera, whether RTS/CTS flow control is on." }
    send: { method: POST, path: /api/streamer/ptz/modify, content_type: application/json,
            body: '{"enable":{enabled:map.ptz_on},"typ":"{connection}","device":{device:json},"baudrate":{baud_rate},"parity":{parity:json},"startBits":{data_bits},"endBits":{stop_bits},"xonxoff":{xonxoff:bool01},"rtscts":{rtscts:bool01},"ptz_protocol":"{protocol}","ptz_addr":{camera_address},"protocol":"{network_protocol}","addr":{address:json},"port":{port}}' }
    expect: *ok
    returns: ack

  # ── Front panel: quick stream and tally (3.3, 3.4) ──────────────────────
