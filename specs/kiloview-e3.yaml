            body: '[{"name":"hdmi","x":{hdmi_x:.2f},"y":{hdmi_y:.2f},"width":{hdmi_width:.2f},"height":{hdmi_height:.2f},"zIndex":{hdmi_layer},"enable":{hdmi_shown}},{"name":"sdi","x":{sdi_x:.2f},"y":{sdi_y:.2f},"width":{sdi_width:.2f},"height":{sdi_height:.2f},"zIndex":{sdi_layer},"enable":{sdi_shown}}]' }
    expect: *ok
