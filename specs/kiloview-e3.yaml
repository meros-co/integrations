      admin_password: { type: string, default: "", secret: true, max_length: 128, label: ONVIF password,
                        description: "The ONVIF password; empty means Admin123, as documented." }
      location: { type: string, default: default, max_length: 128, label: Location,
                  description: "The location the device reports to ONVIF clients." }
      device_name: { type: string, default: "", max_length: 64, label: ONVIF device name,
                     description: "The device name it reports to ONVIF clients." }
      device_type: { type: string, default: "", max_length: 64, label: ONVIF device type,
                     description: "The device type it reports to ONVIF clients." }
    send: { method: POST, path: /api/onvifmanage/onvif/set, content_type: application/json,
            body: '{"control":{"enabled":{enabled},"discover_port":{discover_port},"port":{port}},"discoverable":{discoverable},"auth_req":{auth_required},"admin_name":{admin_name:json},"admin_password":{admin_password:json},"location":{location:json},"device_name":{device_name:json},"device_type":{device_type:json}}' }
    expect: *ok
    returns: ack

  get_ndi_bridge:
    summary: "The NDI bridge to a remote NDI host: on or off, group, address, port and source name (GET /api/bridge/get)"
    send: { method: GET, path: /api/bridge/get }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_ndi_bridge:
    summary: "Set the NDI bridge that publishes the device's NDI source on a remote NDI host (POST /api/bridge/set)"
    params:
      enabled: { type: bool, required: true, label: NDI bridge,
                 description: "Whether the device joins the remote NDI host." }
      group: { type: string, default: Public, max_length: 64, label: Group,
               description: "The group it shares into on the host, Public by default." }
      address: { type: string, required: true, max_length: 253, label: Host address,
                 description: "The NDI host's public IP address." }
      port: { type: int, min: 1, max: 65535, default: 5990, label: Host port,
              description: "The NDI host's port, 5990 by default." }
      key: { type: string, default: "", secret: true, max_length: 128, label: Encryption key,
             description: "The key the host requires, empty for none." }
      source_name: { type: string, required: true, max_length: 64, label: Source name,
                     description: "The name the source is published under on the host." }
    send: { method: POST, path: /api/bridge/set, content_type: application/json,
            body: '{"enable":{enabled},"recv":{group:json},"address":{address:json},"port":"{port}","secure":{key:json},"id":{source_name:json}}' }
    expect: *ok
    returns: ack

