  reset_ndi:
    summary: "Reset a channel's NDI|HX stream (POST /api/streamer/{interface}/stream/ndi/reset)"
    params:
      interface: *iface
    send: { method: POST, path: "/api/streamer/{interface}/stream/ndi/reset" }
    expect: *ok
