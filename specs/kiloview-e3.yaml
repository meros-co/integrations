spec: 1
id: kiloview-e3
name: Kiloview E3 / RE-3 4K HDMI/SDI H.265/H.264 encoder
vendor: Kiloview
category: other

# Kiloview's E3 web API (firmware 1.21): JSON over HTTP under /api, one
# service per path prefix (systemctrl, record, streamer, networkmanager,
# kilolink, codec, talk, onvifmanage, bridge). Most writes answer
# {"result":"ok","msg":null}, or "error" with a message; several reads answer
# their object or array bare, others inside {"result":"ok","data":...}. The
# encoder channels are named in the path: hdmi, sdi, pip (the HDMI+SDI mix)
# and uvc (a USB camera). Nothing is pushed: state is polled in four groups,
# and every write that succeeds has what it changed read again (then_send).

source:
  - title: "E3 API Documentation, Version 1.21.0008"
    author: Kiloview Electronics
    url: "https://enstatic.kiloview.com/wp-content/uploads/2026/04/E3_API_enVersion-1.21.0008.pdf"
    note: >
      Manufacturer-documented, public; linked as the API of the RE-3 from
      https://www.kiloview.com/en/docs/re-3/api/ (retrieved 2026-10-23; the
      E3's own API page, /en/docs/e3/api/, links the P3 document instead).
      The source of every command and state rule here. Examples and the
      Authorization header (front matter); systemctrl: users login,
      session, list, add, remove, modify, auth_info get and set (1.1);
      systime setLocation, setTime, get, ntpstatus (1.2); system components,
      getHostname, setHostname, getProtocol, setProtocol, ssl get, upload,
      apply, resetSsl, reFactory, restore, reboot, ping, getNetworkSpeed,
      getSystemInfo, upload, uploadfile, mergefile, production_off,
      production_stat (1.3); system_preset modules, get, import, save,
      download, load, delete, export (1.4); system_log get and export (1.5);
      system_maintenance get and set (1.6); record remove_file,
      get_disk_files, choose_usb, choose_nas, disk_list, get_record_info,
      settings, {interface}/recording, nas add and remove (2); streamer
      stream list, add (RTSP, RTMP/RTMPS, SRT, HLS, TS over UDP, RTP),
      modify (NDI|HX), delete, enable, ndi/reset, get_webrtc, set_webrtc,
      media_user (3.1); ptz control, info, protocol, serial_device, modify
      (3.2); panel_stream shortcuts_stream, set_shortcuts_enable, tally
      settings (3.3); shortcuts list and set (3.4); networkmanager
      GetLinkinfo, ChangeLinkinfo, SetSwitch, GetEthernets, SetEthernets,
      ResetMDNS, static routing add, get, modify, del, set (4); kilolink
      networks, get, set (5); codec vin edid, upload, priority, reset,
      active_interface, detail, list_format, source (6.1); audio input,
      source, encode list, add, modify, delete, list_source (6.2); venc
      settings, bitrate, enable, PIP primary swap, layout, frame rate,
      NDI-standard sub stream, snap (6.3); vpss images, crop, rotation,
      mirror and flip, OSD, crop_apply, static frame (6.4); talk (7); ONVIF
      (8); NDI bridge (9).
  - title: "RE-3 4K Multi-interface NDI Encoding Card Data Sheet, V1.2 (RE-3-1.2V1.21.0008-250627)"
    author: Kiloview Electronics
    url: "https://enstatic.kiloview.com/wp-content/uploads/2025/12/RE3_Datasheet_EN_V1.2_20250618.pdf"
    note: >
      Manufacturer-documented. The RE-3 is the card form of the E3 for the
      RU01, RU03 and RU03S chassis, with the same firmware line (1.21.0008):
      HDMI 1.4b up to 2160p30, 3G-SDI up to 1080p60, USB (UVC) up to 1080p60,
      a 3.5 mm line input, mixed HDMI+SDI encoding, up to 8 streams plus 2
      sub streams, USB and NAS recording, tally, PTZ over USB serial
      adapters or IP, intercom with Kiloview Intercom Server, KiloLink, and
      the HTTP API (sections 1, 2, 4, 6).
  - title: "E3 4K HDMI/3G-SDI H.265 Video Encoder User Manual (2025-08 upload)"
    author: Kiloview Electronics
    url: "https://enstatic.kiloview.com/wp-content/uploads/2025/08/User-Manual_E3.pdf"
    note: >
      Manufacturer-documented. Default user admin, password admin; web
      service on port 80, HTTPS on 443, both changeable; the front-panel LCD
      shows NDI tally; factory reset and reboot (sections 7, 11).
  - title: "companion-module-kiloview-encoder, src/e3-handler.js (Bitfocus Companion module, v3.0.0)"
    author: Bitfocus
    url: "https://github.com/bitfocus/companion-module-kiloview-encoder"
    note: >
      Community source (MIT license), read as corroboration only: it logs in
      with POST /api/systemctrl/users/login, sends the token from the
      reply's data.token as the Authorization header as it is, treats 401
      as an authentication failure, and accepts replies with and without
      the result envelope.
  - title: "P3 / P3 Mini WEB API en v1.03 (firmware 1.22.0010)"
    author: Kiloview Electronics
    url: "https://enstatic.kiloview.com/wp-content/uploads/2026/04/P3_P3-Mini-WEB-API_en-v1.03Version-1.22.0010-1.pdf"
    note: >
      Manufacturer-documented API of the sibling P3, read as corroboration
      only: its PTZ control section names the diagonal moves left-up,
      left-down, right-up and right-down beside up, down, left and right,
      and its login example shows the token as a JSON Web Token.

settings:
  username: { type: string, default: admin, max_length: 64, label: User name,
              description: "The user the core logs in as once API authentication is on; admin by default." }
  password: { type: string, secret: true, default: "", max_length: 128, label: Password,
              description: "That user's password; leave it empty while API authentication is off, and nothing logs in." }
  scheme:
    type: enum
    values: [http, https]
    default: http
    label: Scheme
    description: "http, or https on the device's HTTPS port (443 unless changed); the device's certificate is not checked."

ports:
  - { port: 80, protocol: http, role: control, setting: scheme, when: "scheme http", note: "the web service port, changeable on the device (set_web_ports); the port given when opening wins" }
  - { port: 443, protocol: https, role: control, setting: scheme, when: "scheme https" }

transport:
  type: http
  port: 80
  https_port: 443
  scheme: { setting: scheme }
  # The default certificate is the device's own (reset_ssl restores it).
  accept_invalid_certs: true
  timeout_ms: 5000
  probe: { method: GET, path: /api/systemctrl/system/getHostname }
  # Version 1.21 API authentication: the session logs in with the username
  # and password settings and sends the login's token in Authorization, as
  # it is, logging in again when a request is answered 401.
  session:
    when_set: password
    login: { method: POST, path: /api/systemctrl/users/login, content_type: application/json,
             headers: { App: '{"language":"en"}' },
             body: '{"username":{settings.username:json},"password":{settings.password:json}}' }
    capture: { json: $.data.token, header: Authorization }
    relogin: { status: [401] }

maps:
  ptz_on: { "true": "1", "false": "0" }
  osd_color: { black: "0", white: "1", red: "2", blue: "3", green: "4", yellow: "5", purple: "6", cyan: "7" }
  osd_outline: { none: "0", thin: "1", thick: "2" }
  edid_priority: { 1080p: '"1"', 4k: '"2"', none: '""' }
  webrtc_mode: { video: "0", image: "1" }
  fps_mode: { auto: '"auto"', half: '"half"' }

models:
  - id: e3
    name: Kiloview E3 4K HDMI/3G-SDI H.265/H.264 encoder
    supports: &all
      [login, list_users, add_user, remove_user, modify_user, set_user_password, get_api_auth, set_api_auth,
       get_time, get_ntp_status, set_timezone, set_timezone_offset, set_time, set_time_ntp,
       get_components, get_hostname, set_hostname, get_web_ports, set_web_ports, get_ssl, upload_ssl_file, apply_ssl,
       reset_ssl, factory_reset, restart_codec, reboot, ping_host, get_network_speed, get_system_info,
       upload_firmware, upload_firmware_chunk, merge_firmware, get_production_service, set_production_service,
       get_preset_modules, list_presets, import_preset, save_preset, load_preset, delete_preset, download_preset_modules, export_preset,
       get_log, export_logs, get_maintenance, set_maintenance,
       delete_recording_file, list_recording_files, list_recording_files_of, select_usb_storage, select_nas_storage,
       get_storage, get_record_settings, set_record_settings, start_recording, stop_recording, get_recording_status,
       add_nas, remove_nas,
       list_streams, add_rtsp_stream, add_rtmp_stream, add_srt_stream, add_hls_stream, add_ts_udp_stream,
       add_rtp_stream, add_stream, update_ndi_stream, update_rtmp_stream, update_srt_stream, update_stream,
       delete_stream, start_stream, stop_stream, reset_ndi, get_webrtc, set_webrtc, list_media_users,
       add_media_user, delete_media_user,
       ptz_move, ptz_action, ptz_preset, ptz_custom, get_ptz, get_ptz_protocols, get_ptz_serial_devices, set_ptz,
       get_quick_stream, set_quick_stream, set_quick_stream_flag, get_tally_source, set_tally_source,
       get_quick_stream_config, set_quick_stream_config,
       get_network, get_ethernet, set_network, set_ethernet, set_interface_enabled, reset_mdns,
       add_static_route, get_static_routes, modify_static_route, delete_static_route, set_static_route_enabled,
       get_kilolink_interfaces, get_kilolink, set_kilolink,
       get_edid, upload_edid, set_edid_priority, reset_edid, get_active_channels, get_input, get_uvc_formats,
       set_uvc_input, set_pip_input,
       get_audio_input, set_audio_input, list_audio_encoders, add_audio_encoder, update_audio_encoder,
       delete_audio_encoder, list_audio_sources,
       get_video_encoding, save_snapshot, set_video_encoding, set_video_encoding_auto_fps, set_video_bitrate,
       set_encoding_enabled, swap_pip, get_pip_layout, set_pip_layout, get_pip_input, set_pip_input_format,
       get_ndi_compliance, restore_ndi_compliance,
       list_images, upload_image, delete_image, get_crop, set_crop, apply_crop_to_layout, get_orientation,
       set_orientation, get_osd, set_osd_enabled, add_osd_item, get_osd_item, update_osd_item, delete_osd_item,
       list_static_frames, upload_static_frame, reset_static_frame,
       get_talk_version, set_talk_language, get_talk_serial, list_talk_devices, add_talk_device,
       delete_talk_device, set_talk_device_link, set_talk_web_link, set_talk_server_link, get_talk_connection,
       get_onvif, set_onvif, get_ndi_bridge, set_ndi_bridge]
    verification: none
    notes: >
      Desktop encoder with front-panel LCD and touch buttons: HDMI 1.4b up to
      2160p30, 3G-SDI up to 1080p60, USB camera input, line in, Ethernet.
      Firmware 1.21.0008 is the documented version; API authentication
      appeared in 1.21.
  - id: re-3
    name: Kiloview RE-3 4K multi-interface encoding card
    supports: *all
    verification: none
    notes: >
      The E3 as a card for the RU01, RU03 and RU03S chassis (data sheet
      V1.2, firmware 1.21.0008), powered by the chassis; its API page links
      the E3 API document. It has no front-panel screen of its own, so the
      panel's quick-stream and tally display settings are those the API
      shares with the E3 (see quirks).

commands:
  # ── Users and API authentication (1.1) ─────────────────────────────────
  login:
    summary: "Log in as a user and return its token, beside the session the core keeps (POST /api/systemctrl/users/login); the token is data.token"
    params:
      username: { type: string, required: true, max_length: 64, label: User name,
                  description: "A user allowed to use the API; admin by default." }
      password: { type: string, required: true, secret: true, max_length: 128, label: Password,
                  description: "That user's password; admin by default (the manual), changed on first web login." }
    send: { method: POST, path: /api/systemctrl/users/login, content_type: application/json, session: false,
            headers: { App: '{"language":"en"}' },
            body: '{"username":{username:json},"password":{password:json}}' }
    expect: { status: 200, json_equals: { "$.result": "ok" }, json_path: "$.data.token" }
    returns: value

  list_users:
    summary: "Every user that can log in, with alias, web and API permission and creation time (GET /api/systemctrl/users/list)"
    send: { method: GET, path: /api/systemctrl/users/list }
    expect: { status: 200, json_path: "$" }
    returns: value

  add_user:
    summary: "Add a user (POST /api/systemctrl/users/add); the password is sent twice, as the web form confirms it"
    params:
      username: &user_id { type: string, required: true, max_length: 64, label: User name,
                           description: "The user's login name, unique on the device." }
      password: &user_password { type: string, required: true, secret: true, max_length: 128, label: Password,
                                 description: "The user's password." }
      alias: &user_alias { type: string, required: true, max_length: 64, label: Alias,
                           description: "The name shown for the user." }
      web: &user_web { type: bool, required: true, label: Web access,
                       description: "Whether the user may sign in to the web interface." }
      api: &user_api { type: bool, required: true, label: API access,
                       description: "Whether the user may use the API." }
    send: { method: POST, path: /api/systemctrl/users/add, content_type: application/json,
            body: '{"id":{username:json},"password":{password:json},"confirmNewPassword":{password:json},"alias":{alias:json},"enable_web":{web},"enable_api":{api}}' }
    expect: &ok { status: 200, json_equals: { "$.result": "ok" } }
    returns: ack

  remove_user:
    summary: "Delete a user (POST /api/systemctrl/users/remove)"
    params:
      username: *user_id
    send: { method: POST, path: /api/systemctrl/users/remove, content_type: application/json,
            body: '{"ids":{username:json}}' }
    expect: *ok
    returns: ack

  modify_user:
    summary: "Change a user's alias and web and API permission (POST /api/systemctrl/users/modify)"
    params:
      username: *user_id
      alias: *user_alias
      web: *user_web
      api: *user_api
    send: { method: POST, path: /api/systemctrl/users/modify, content_type: application/json,
            body: '{"id":{username:json},"alias":{alias:json},"enable_web":{web},"enable_api":{api}}' }
    expect: *ok
    returns: ack

  set_user_password:
    summary: "Change a user's password (POST /api/systemctrl/users/modify with the password only)"
    params:
      username: *user_id
      password: *user_password
    send: { method: POST, path: /api/systemctrl/users/modify, content_type: application/json,
            body: '{"id":{username:json},"password":{password:json}}' }
    expect: *ok
    returns: ack

  get_api_auth:
    summary: "Whether API authentication is on (GET /api/systemctrl/users/auth_info); off by default"
    send: { method: GET, path: /api/systemctrl/users/auth_info }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_api_auth:
    summary: "Turn API authentication on or off (POST /api/systemctrl/users/auth_info); put a login token in the token setting first (see quirks)"
    params:
      enabled: { type: bool, required: true, label: API authentication,
                 description: "On makes every request carry a login token in the Authorization header; off takes requests without one." }
    send: { method: POST, path: /api/systemctrl/users/auth_info, content_type: application/json,
            body: '{"enable":{enabled}}' }
    expect: *ok
    returns: ack

  # ── Time (1.2) ──────────────────────────────────────────────────────────
  get_time:
    summary: "System time, how it is set (pc, manual or ntp), time zone, its offset and NTP servers (GET /api/systemctrl/systime/get)"
    send: { method: GET, path: /api/systemctrl/systime/get }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_ntp_status:
    summary: "The NTP status lines, a list given only when NTP is set (GET /api/systemctrl/systime/ntpstatus)"
    send: { method: GET, path: /api/systemctrl/systime/ntpstatus }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_timezone:
    summary: "Set the time zone by its region name (POST /api/systemctrl/systime/setLocation)"
    params:
      timezone: &timezone { type: string, required: true, max_length: 64, pattern: '^[A-Za-z0-9_+/-]+$', label: Time zone,
                            description: "The region's time zone name, such as Europe/London or Asia/Shanghai." }
    send: { method: POST, path: /api/systemctrl/systime/setLocation, content_type: application/json,
            body: '{"timezone":{timezone:json}}' }
    expect: *ok
    returns: ack

  set_timezone_offset:
    summary: "Set the time zone with a fallback offset from GMT, used when the name is not found (POST /api/systemctrl/systime/setLocation)"
    params:
      timezone: *timezone
      offset: { type: int, min: -14, max: 12, required: true, label: GMT offset,
                description: "Hours added to or taken from GMT (GMT+8 is 8), used when the time zone name is not found." }
    send: { method: POST, path: /api/systemctrl/systime/setLocation, content_type: application/json,
            body: '{"timezone":{timezone:json},"offset":{offset}}' }
    expect: *ok
    returns: ack

  set_time:
    summary: "Set the system time, as the controlling computer's time (pc) or by hand (manual) (POST /api/systemctrl/systime/setTime)"
    params:
      mode: { type: enum, values: [pc, manual], default: manual, label: Time source,
              description: "pc records the time as taken from the controlling computer, manual as typed in; either way the time given is set." }
      time: { type: string, required: true, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$', label: Time,
              description: "The date and time as YYYY-MM-DD HH:MM:SS, in the device's time zone." }
    send: { method: POST, path: /api/systemctrl/systime/setTime, content_type: application/json,
            body: '{"timetype":"{mode}","time":{time:json}}' }
    expect: *ok
    returns: ack

  set_time_ntp:
    summary: "Synchronize the system time from NTP servers (POST /api/systemctrl/systime/setTime, timetype ntp)"
    params:
      servers: { type: string, required: true, max_length: 512, pattern: '^[A-Za-z0-9.:-]+( [A-Za-z0-9.:-]+)*$', label: NTP servers,
                 description: "One or more NTP server names or addresses, separated by spaces." }
    send: { method: POST, path: /api/systemctrl/systime/setTime, content_type: application/json,
            body: '{"timetype":"ntp","ntp":{servers:json}}' }
    expect: *ok
    returns: ack

  # ── System (1.3) ────────────────────────────────────────────────────────
  get_components:
    summary: "The open-source components and their licenses, a fixed list (GET /api/systemctrl/system/components)"
    send: { method: GET, path: /api/systemctrl/system/components }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_hostname:
    summary: "The device name, model and serial number unless set (GET /api/systemctrl/system/getHostname)"
    send: { method: GET, path: /api/systemctrl/system/getHostname }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_hostname:
    summary: "Set the device name (GET /api/systemctrl/system/setHostname?name=..., a GET as documented)"
    params:
      name: { type: string, required: true, max_length: 63, label: Device name,
              description: "The device name shown on the network and in the web interface." }
    send: { method: GET, path: /api/systemctrl/system/setHostname, query: { name: "{name}" } }
    expect: *ok
    returns: ack

  get_web_ports:
    summary: "Whether HTTP and HTTPS are on, and their ports (GET /api/systemctrl/system/getProtocol)"
    send: { method: GET, path: /api/systemctrl/system/getProtocol }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_web_ports:
    summary: "Turn HTTP and HTTPS on or off and set their ports (POST /api/systemctrl/system/setProtocol); both cannot be off"
    params:
      http: { type: bool, required: true, label: HTTP,
              description: "Whether the web service and API answer over plain HTTP." }
      https: { type: bool, required: true, label: HTTPS,
               description: "Whether they answer over HTTPS, which the intercom needs." }
      http_port: { type: int, min: 1, max: 65535, default: 80, label: HTTP port,
                   description: "The HTTP port, 80 by default." }
      https_port: { type: int, min: 1, max: 65535, default: 443, label: HTTPS port,
                    description: "The HTTPS port, 443 by default." }
    send: { method: POST, path: /api/systemctrl/system/setProtocol, content_type: application/json,
            body: '{"http":{http},"https":{https},"httpPort":{http_port},"httpsPort":{https_port}}' }
    expect: *ok
    returns: ack

  get_ssl:
    summary: "Where an uploaded certificate and key are kept, and whether the certificate can be reset (GET /api/systemctrl/system/ssl)"
    send: { method: GET, path: /api/systemctrl/system/ssl }
    expect: { status: 200, json_path: "$" }
    returns: value

  upload_ssl_file:
    summary: "Upload a certificate (.crt or .pem) or key (.key) as multipart form data (POST /api/systemctrl/system/ssl/{file_type}); apply_ssl applies it"
    params:
      file_type: { type: enum, values: [crt, key], required: true, label: File type,
                   description: "crt for the certificate, key for its private key." }
      file: { type: binary, required: true, label: File,
              description: "The certificate (.crt or .pem) or key (.key) file." }
      filename: { type: string, required: true, max_length: 128, pattern: '^[^/\\]+\.(crt|pem|key)$', label: File name,
                  description: "The file's name with its extension, .crt or .pem for a certificate and .key for a key." }
    send:
      method: POST
      path: "/api/systemctrl/system/ssl/{file_type}"
      multipart:
        - { name: file, binary: file, filename: "{filename}", content_type: application/octet-stream }
    expect: *ok
    returns: ack

  apply_ssl:
    summary: "Check and apply the uploaded certificate and key (POST /api/systemctrl/system/ssl)"
    send: { method: POST, path: /api/systemctrl/system/ssl }
    expect: *ok
    returns: ack

  reset_ssl:
    summary: "Restore the factory certificate and key (POST /api/systemctrl/system/resetSsl)"
    send: { method: POST, path: /api/systemctrl/system/resetSsl }
    expect: *ok
    returns: ack

  factory_reset:
    summary: "Restore factory settings: every setting made on the device is cleared (GET /api/systemctrl/system/reFactory)"
    send: { method: GET, path: /api/systemctrl/system/reFactory }
    expect: *ok
    returns: ack

  restart_codec:
    summary: "Restart the encoding service; streams and recordings stop while it restarts (GET /api/systemctrl/system/restore)"
    send: { method: GET, path: /api/systemctrl/system/restore }
    expect: *ok
    returns: ack

  reboot:
    summary: "Reboot the device at once (GET /api/systemctrl/system/reboot)"
    send: { method: GET, path: /api/systemctrl/system/reboot }
    expect: *ok
    returns: ack

  ping_host:
    summary: "Ping an address from the device; returns the loss rate and whether it is reachable (POST /api/systemctrl/system/ping)"
    params:
      target: { type: string, required: true, max_length: 253, pattern: '^[A-Za-z0-9.:-]+$', label: Target,
                description: "The IP address (or host name) the device pings." }
    send: { method: POST, path: /api/systemctrl/system/ping, content_type: application/json,
            body: '{"target_addr":{target:json}}' }
    expect: { status: 200, json_equals: { "$.result": "ok" }, json_path: "$.data" }
    returns: value

  get_network_speed:
    summary: "Each network port's receive and transmit amounts since the last call and its link speed (GET /api/systemctrl/system/getNetworkSpeed)"
    send: { method: GET, path: /api/systemctrl/system/getNetworkSpeed }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_system_info:
    summary: "Versions, serial number, CPU, memory and disk use, uptime and temperature (GET /api/systemctrl/system/getSystemInfo)"
    send: { method: GET, path: /api/systemctrl/system/getSystemInfo,
            query: { version: "true", cpu: "true", memory: "true", disk: "true", persisTime: "true" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  upload_firmware:
    summary: "Upload a firmware package in one request, multipart form data (POST /api/systemctrl/system/upload); the device asks to restart afterwards"
    params:
      file: { type: binary, required: true, label: Firmware file,
              description: "The firmware package (.bin) for this model, from Kiloview's download center." }
    send:
      method: POST
      path: /api/systemctrl/system/upload
      multipart:
        - { name: file, binary: file, filename: firmware.bin, content_type: application/octet-stream }
    expect: *ok
    returns: ack

  upload_firmware_chunk:
    summary: "Upload one chunk of a firmware package, multipart form data (POST /api/systemctrl/system/uploadfile); merge_firmware joins them"
    params:
      identifier: &fw_identifier { type: string, required: true, max_length: 128, pattern: '^[A-Za-z0-9_.-]+$', label: Upload identifier,
                                   description: "A name the caller chooses for this upload, the same for every chunk and for the merge." }
      number: { type: int, min: 0, required: true, label: Chunk number,
                description: "The chunk's sequence number, from 0." }
      file_type: &fw_type { type: string, default: bin, max_length: 16, pattern: '^[A-Za-z0-9]+$', label: File type,
                            description: "The package's extension, bin for a firmware package." }
      file: { type: binary, required: true, label: Chunk,
              description: "This chunk's bytes, a consecutive part of the firmware package." }
    send:
      method: POST
      path: /api/systemctrl/system/uploadfile
      multipart:
        - { name: identifier, value: "{identifier}" }
        - { name: number, value: "{number}" }
        - { name: file_type, value: "{file_type}" }
        - { name: file, binary: file, filename: "{identifier}.{number}", content_type: application/octet-stream }
    expect: *ok
    returns: ack

  merge_firmware:
    summary: "Join the uploaded chunks into the firmware package and install it (POST /api/systemctrl/system/mergefile)"
    params:
      identifier: *fw_identifier
      count: { type: int, min: 1, required: true, label: Chunk count,
               description: "The number of chunks uploaded, as the document's merge example gives it (see quirks)." }
      file_type: *fw_type
    send: { method: POST, path: /api/systemctrl/system/mergefile, content_type: application/json,
            body: '{"identifier":{identifier:json},"number":"{count}","file_type":{file_type:json}}' }
    expect: *ok
    returns: ack

  get_production_service:
    summary: "Whether the factory product-test service is running (GET /api/systemctrl/system/production_stat)"
    send: { method: GET, path: /api/systemctrl/system/production_stat }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_production_service:
    summary: "Turn the factory product-test service on or off (POST /api/systemctrl/system/production_off)"
    params:
      enabled: { type: bool, required: true, label: Product-test service,
                 description: "Whether the factory product-test service runs; off in normal use." }
    send: { method: POST, path: /api/systemctrl/system/production_off, content_type: application/json,
            body: '{"value":{enabled}}' }
    expect: *ok
    returns: ack

  # ── Configuration presets (1.4) ─────────────────────────────────────────
  get_preset_modules:
    summary: "The configuration modules a preset can hold: time, user, ptz, edid, maintenance, codec_stream, record, talk, osd, panel (GET /api/systemctrl/system_preset/modules)"
    send: { method: GET, path: /api/systemctrl/system_preset/modules }
    expect: { status: 200, json_path: "$" }
    returns: value

  list_presets:
    summary: "The saved configuration presets, id and name (GET /api/systemctrl/system_preset/get)"
    send: { method: GET, path: /api/systemctrl/system_preset/get }
    expect: { status: 200, json_path: "$" }
    returns: value

  import_preset:
    summary: "Import a preset file exported from another device, multipart form data (POST /api/systemctrl/system_preset/import)"
    params:
      file: { type: binary, required: true, label: Preset file,
              description: "A preset file exported from this or another E3 or RE-3." }
    send:
      method: POST
      path: /api/systemctrl/system_preset/import
      multipart:
        - { name: file, binary: file, filename: preset.zip, content_type: application/octet-stream }
    expect: *ok
    returns: ack

  save_preset:
    summary: "Save the current configuration of the chosen modules as a preset (POST /api/systemctrl/system_preset/save); modules is the JSON array of module names that get_preset_modules lists (API 1.4.4)"
    params:
      name: { type: string, required: true, max_length: 64, label: Preset name,
              description: "The preset's name, unique on the device." }
      modules: { type: json, required: true, label: Modules,
                 description: "JSON array of module names to save, from get_preset_modules, such as [\"codec_stream\", \"osd\"]." }
    send: { method: POST, path: /api/systemctrl/system_preset/save, content_type: application/json,
            body: '{"name":{name:json},"modules":{modules}}' }
    expect: *ok
    returns: ack

  load_preset:
    summary: "Load a preset onto the device, replacing the configuration of its modules (POST /api/systemctrl/system_preset/{pid}/load)"
    params:
      pid: &pid { type: string, required: true, max_length: 64, label: Preset ID,
                  description: "The preset's id, as list_presets gives it." }
    send: { method: POST, path: "/api/systemctrl/system_preset/{pid}/load" }
    expect: *ok
    returns: ack

  delete_preset:
    summary: "Delete a preset (DELETE /api/systemctrl/system_preset/{pid})"
    params:
      pid: *pid
    send: { method: DELETE, path: "/api/systemctrl/system_preset/{pid}" }
    expect: *ok
    returns: ack

  download_preset_modules:
    summary: "Save the current configuration of the chosen modules to a host file as a preset zip, without keeping it on the device (GET /api/systemctrl/system_preset/download)"
    params:
      name: { type: string, required: true, max_length: 64, label: Preset name,
              description: "The preset's name, which names the zip." }
      modules: { type: json, required: true, label: Modules,
                 description: "JSON array of module names to save, from get_preset_modules, such as [\"codec_stream\", \"osd\"]." }
      to: { type: save, required: true, label: Save to, description: "The host file the download is written to; replaced once the whole file has arrived." }
    send: { method: GET, path: /api/systemctrl/system_preset/download, query: { name: "{name}", modules: "{modules}" }, save: to }
    expect: { status: 200 }
    returns: file

  export_preset:
    summary: "Save a stored preset to a host file (GET /api/systemctrl/system_preset/{pid}/export), for import_preset on this or another device"
    params:
      pid: *pid
      to: { type: save, required: true, label: Save to, description: "The host file the download is written to; replaced once the whole file has arrived." }
    send: { method: GET, path: "/api/systemctrl/system_preset/{pid}/export", save: to }
    expect: { status: 200 }
    returns: file

  # ── Logs and scheduled maintenance (1.5, 1.6) ───────────────────────────
  export_logs:
    summary: "Save the system logs, a zip, to a host file (GET /api/systemctrl/system_log/export/{time})"
    params:
      time: { type: enum, values: [new, old], required: true, label: Logs,
              description: "new for the current system logs, old for the historical ones." }
      to: { type: save, required: true, label: Save to, description: "The host file the download is written to; replaced once the whole file has arrived." }
    send: { method: GET, path: "/api/systemctrl/system_log/export/{time}", save: to }
    expect: { status: 200 }
    returns: file

  get_log:
    summary: "One service's log as text (GET /api/systemctrl/system_log/get/{logname})"
    params:
      log: { type: enum, values: [codec, streamer, record, network, system], required: true, label: Log,
             description: "The service whose log is returned: encoding, streaming, recording, network status or system." }
    send: { method: GET, path: "/api/systemctrl/system_log/get/{log}" }
    expect: { status: 200, json_equals: { "$.result": "ok" }, json_path: "$.data" }
    returns: value

  get_maintenance:
    summary: "The scheduled restart: on or off, daily, weekly or monthly, start date and days (GET /api/systemctrl/system_maintenance/get)"
    send: { method: GET, path: /api/systemctrl/system_maintenance/get }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_maintenance:
    summary: "Set the scheduled restart (POST /api/systemctrl/system_maintenance/set); months, weeks and days are JSON arrays of numbers as API 1.6.2 documents them"
    params:
      enabled: { type: bool, required: true, label: Scheduled restart,
                 description: "Whether the device restarts on the schedule." }
      policy: { type: enum, values: [day, week, month], required: true, label: Schedule,
                description: "day restarts every given number of days, week on the given weekdays, month on the given days of the given months." }
      start_date: { type: string, required: true, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$', label: Start,
                    description: "When the schedule starts, YYYY-MM-DD HH:MM:SS, which may be in the future." }
      months: { type: json, default: [], label: Months,
                description: "JSON array of months, 1 to 12, for the monthly schedule." }
      weeks: { type: json, default: [], label: Weekdays,
               description: "JSON array of weekdays, 0 (Sunday) to 6 (Saturday), for the weekly schedule." }
      days: { type: json, default: [], label: Days of the month,
              description: "JSON array of days of the month, 1 to 31, for the monthly schedule." }
      day: { type: int, min: 1, max: 31, default: 1, label: Every N days,
             description: "For the daily schedule, the number of days between restarts." }
    send: { method: POST, path: /api/systemctrl/system_maintenance/set, content_type: application/json,
            body: '{"enable":{enabled},"policy":"{policy}","start_date":{start_date:json},"months":{months},"weeks":{weeks},"days":{days},"day":{day}}' }
    expect: *ok
    returns: ack

  # ── Recording and storage (2) ───────────────────────────────────────────
  delete_recording_file:
    summary: "Delete a recording file (POST /api/record/record/remove_file)"
    params:
      path: { type: string, required: true, max_length: 1024, label: File path,
              description: "The recording's full path on the device, as list_recording_files gives it." }
    send: { method: POST, path: /api/record/record/remove_file, content_type: application/json,
            body: '{"path":{path:json}}' }
    expect: *ok
    returns: ack

  list_recording_files:
    summary: "The recordings on a storage device, with size in MB, source, times and whether one is still being written (GET /api/record/record/get_disk_files)"
    params:
      device: &rec_device { type: string, required: true, max_length: 512, label: Storage path,
                            description: "The storage's mount path, as get_storage gives it, such as /run/media/sda1." }
    send: { method: GET, path: /api/record/record/get_disk_files, query: { device: "{device}" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  list_recording_files_of:
    summary: "The recordings of one source on a storage device (GET /api/record/record/get_disk_files with stream)"
    params:
      device: *rec_device
      stream: { type: enum, values: [hdmi, sdi, pip, uvc], required: true, label: Source,
                description: "The source whose recordings are listed: hdmi, sdi, pip (the mix) or uvc (USB camera)." }
    send: { method: GET, path: /api/record/record/get_disk_files, query: { device: "{device}", stream: "{stream}" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  select_usb_storage:
    summary: "Choose whether a USB disk is recorded to (POST /api/record/record/choose_usb)"
    params:
      id: { type: string, required: true, max_length: 64, label: Disk,
            description: "The USB disk's id, its device name such as sda1, as get_storage gives it." }
      selected: &rec_selected { type: bool, required: true, label: Record to it,
                                description: "Whether recordings are written to this storage." }
    send: { method: POST, path: /api/record/record/choose_usb, content_type: application/json,
            body: '{"id":{id:json},"choose":{selected}}' }
    expect: *ok
    returns: ack

  select_nas_storage:
    summary: "Choose whether a network storage is recorded to (POST /api/record/record/choose_nas)"
    params:
      id: &nas_id { type: string, required: true, max_length: 64, label: NAS ID,
                    description: "The network storage's id, as given when it was added." }
      selected: *rec_selected
    send: { method: POST, path: /api/record/record/choose_nas, content_type: application/json,
            body: '{"id":{id:json},"choose":{selected}}' }
    expect: *ok
    returns: ack

  get_storage:
    summary: "Every network and USB storage with mount status, selection and size in MB (GET /api/record/record/disk_list)"
    send: { method: GET, path: /api/record/record/disk_list }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_record_settings:
    summary: "Recording format, file prefix, file split, disk policy and SDI timecode start (GET /api/record/record/get_record_info)"
    send: { method: GET, path: /api/record/record/get_record_info }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_record_settings:
    summary: "Set the recording format, file prefix, file split and disk policy (POST /api/record/record/settings)"
    params:
      format: { type: enum, values: [mp4, mov, ts], required: true, label: Format,
                description: "The recording container: mp4, mov or ts." }
      file_prefix: { type: string, required: true, max_length: 10, label: File prefix,
                     description: "Text at the start of every recording's name, up to 10 characters." }
      limit_type: { type: enum, values: [none, time-loop, size-loop], required: true, label: File split,
                    description: "none keeps one file, time-loop starts a new file after limit_time, size-loop after limit_size." }
      limit_size: { type: int, min: 512, max: 51200, default: 512, label: Split size,
                    description: "With size-loop, the file size in MB at which a new file starts." }
      limit_time: { type: int, min: 60, max: 14400, default: 3600, label: Split time,
                    description: "With time-loop, the length in seconds after which a new file starts." }
      disk_policy: { type: enum, values: [overwrite, noSpace], required: true, label: When the disk is full,
                     description: "overwrite replaces the oldest recordings, noSpace stops recording." }
      follow_timecode: { type: bool, default: false, label: Follow SDI timecode,
                         description: "Whether recording starts and stops with the SDI camera's running timecode." }
    send: { method: POST, path: /api/record/record/settings, content_type: application/json,
            body: '{"format":"{format}","file_prefix":{file_prefix:json},"limit_type":"{limit_type}","limit_size":{limit_size},"limit_time":{limit_time},"disk_policy":"{disk_policy}","follow_timecode_start":{follow_timecode}}' }
    expect: *ok
    returns: ack

  start_recording:
    summary: "Start recording a channel (POST /api/record/{interface}/recording, start true)"
    params:
      interface: &iface { type: enum, values: [hdmi, sdi, pip, uvc], required: true, label: Channel,
                          description: "The encoder channel: hdmi, sdi, pip (the HDMI and SDI mix) or uvc (a USB camera)." }
    send: { method: POST, path: "/api/record/{interface}/recording", content_type: application/json,
            body: '{"start":true}' }
    expect: *ok
    returns: ack

  stop_recording:
    summary: "Stop recording a channel (POST /api/record/{interface}/recording, start false)"
    params:
      interface: *iface
    send: { method: POST, path: "/api/record/{interface}/recording", content_type: application/json,
            body: '{"start":false}' }
    expect: *ok
    returns: ack

  get_recording_status:
    summary: "Whether a channel is recording (GET /api/record/{interface}/recording)"
    params:
      interface: *iface
    send: { method: GET, path: "/api/record/{interface}/recording" }
    expect: { status: 200, json_path: "$" }
    returns: value

  add_nas:
    summary: "Add a network storage, CIFS or NFS (POST /api/record/nas/add)"
    params:
      id: *nas_id
      name: { type: string, required: true, max_length: 64, label: Name,
              description: "The storage's name as shown." }
      type: { type: enum, values: [cifs, nfs], required: true, label: Protocol,
              description: "cifs for an SMB share, nfs for an NFS export." }
      host: { type: string, required: true, max_length: 253, pattern: '^[A-Za-z0-9.:-]+$', label: Host,
              description: "The file server's address or name." }
      volume: { type: string, required: true, max_length: 512, label: Share,
                description: "The share or export to mount." }
      options: { type: string, default: "user=,password=", secret: true, max_length: 512, label: Mount options,
                 description: "Mount options, such as user=NAME,password=SECRET for a CIFS share." }
    send: { method: POST, path: /api/record/nas/add, content_type: application/json,
            body: '{"id":{id:json},"name":{name:json},"type":"{type}","host":{host:json},"volume":{volume:json},"options":{options:json}}' }
    expect: *ok
    returns: ack

  remove_nas:
    summary: "Remove a network storage (POST /api/record/nas/remove)"
    params:
      id: *nas_id
    send: { method: POST, path: /api/record/nas/remove, content_type: application/json,
            body: '{"id":{id:json}}' }
    expect: *ok
    returns: ack

  # ── Streams (3.1) ───────────────────────────────────────────────────────
  list_streams:
    summary: "A channel's streams with their settings, whether each is on and its status (GET /api/streamer/{interface}/stream/list)"
    params:
      interface: *iface
    send: { method: GET, path: "/api/streamer/{interface}/stream/list" }
    expect: { status: 200, json_path: "$" }
    returns: value

  add_rtsp_stream:
    summary: "Add an RTSP server stream (POST /api/streamer/{interface}/stream, type rtsp); it plays at rtsp://<device>:<port>/<session>"
    params:
      interface: *iface
      name: &stream_name { type: string, required: true, max_length: 64, label: Stream name,
                           description: "The stream's name as shown in the stream list." }
      port: { type: int, min: 1, max: 65535, default: 554, label: RTSP port,
              description: "The RTSP server port, 554 by default." }
      http_tunnel_port: { type: int, min: 1, max: 65535, default: 8554, label: HTTP tunnel port,
                          description: "The port for RTSP tunneled over HTTP, 8554 by default." }
      session: &stream_session { type: string, required: true, max_length: 64, pattern: '^[A-Za-z0-9_.-]+$', label: Session,
                                 description: "The path part of the stream's address, such as ch01." }
      auth: { type: bool, default: false, label: Require login,
              description: "Whether players must log in with a media user (add_media_user)." }
      multicast: { type: bool, default: false, label: Multicast,
                   description: "Whether the RTSP stream is sent by multicast." }
      multicast_address: { type: string, default: 224.0.0.1, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', label: Multicast address,
                           description: "The multicast group address." }
      multicast_ttl: { type: int, min: 0, max: 255, default: 127, label: Multicast TTL,
                       description: "The multicast packets' time to live." }
      multicast_port_min: { type: int, min: 1, max: 65535, default: 31000, label: Lowest multicast port,
                            description: "The first port of the multicast port range." }
      multicast_port_max: { type: int, min: 1, max: 65535, default: 31004, label: Highest multicast port,
                            description: "The last port of the multicast port range." }
      bind_audio: &bind_audio { type: int, min: 0, required: true, label: Audio encoder,
                                description: "The id of the channel's audio encoder this stream carries, as list_audio_encoders gives it." }
      bind_video: &bind_video { type: enum, values: [main, sub], default: main, label: Video stream,
                                description: "Whether the stream carries the main or the sub video encoding." }
    send: { method: POST, path: "/api/streamer/{interface}/stream", content_type: application/json,
            body: '{"type":"rtsp","name":{name:json},"port":{port},"httpTunnelPort":{http_tunnel_port},"session":{session:json},"auth":{auth},"multicast_enable":{multicast},"multicast_addr":{multicast_address:json},"multicast_ttl":{multicast_ttl},"multicast_port_min":{multicast_port_min},"multicast_port_max":{multicast_port_max},"bindAudio":{bind_audio},"bindVideo":"{bind_video}"}' }
    expect: *ok
    returns: ack

  add_rtmp_stream:
    summary: "Add an RTMP or RTMPS push stream (POST /api/streamer/{interface}/stream, type rtmp)"
    params:
      interface: *iface
      name: *stream_name
      address: &rtmp_address { type: string, required: true, max_length: 1024, pattern: '^rtmps?://', label: Server URL,
                               description: "The rtmp:// or rtmps:// address to push to, with the stream key, as the platform gives it." }
      bind_audio: *bind_audio
      bind_video: *bind_video
      reconnect_interval: &rtmp_reconnect { type: int, min: 1, default: 3, label: Reconnect interval,
                                            description: "Seconds between reconnection attempts; the device tries at most ten times." }
      connect_timeout: &rtmp_timeout { type: int, min: 1, default: 15, label: Connection timeout,
                                       description: "The connection's socket timeout in seconds." }
      user: &rtmp_user { type: string, default: "", max_length: 128, label: Server user,
                         description: "The RTMP server's login name, empty when it needs none." }
      password: &rtmp_password { type: string, default: "", secret: true, max_length: 128, label: Server password,
                                 description: "The RTMP server's password, empty when it needs none." }
      old_rtmp: &rtmp_old { type: bool, default: false, label: Older RTMP,
                            description: "Whether to use the older RTMP implementation, for servers that need it." }
    send: { method: POST, path: "/api/streamer/{interface}/stream", content_type: application/json,
            body: '{"type":"rtmp","name":{name:json},"address":{address:json},"bindAudio":{bind_audio},"bindVideo":"{bind_video}","connIntv":{reconnect_interval},"connTimeout":{connect_timeout},"user":{user:json},"password":{password:json},"oldRtmp":{old_rtmp}}' }
    expect: *ok
    returns: ack

  add_srt_stream:
    summary: "Add an SRT stream as caller, listener or rendezvous (POST /api/streamer/{interface}/stream, type srt)"
    params:
      interface: *iface
      name: *stream_name
      mode: &srt_mode { type: enum, values: [caller, listener, rendezvous], required: true, label: SRT mode,
                        description: "caller connects to the receiver, listener waits on the port for it, rendezvous both." }
      address: &srt_address { type: string, default: "", max_length: 1024, label: Address,
                              description: "The receiver's srt:// address or IP address, needed for caller and rendezvous; empty for listener." }
      port: &srt_port { type: int, min: 1, max: 65535, required: true, label: Port,
                        description: "The receiver's port (caller, rendezvous) or the port to listen on (listener)." }
      latency: &srt_latency { type: int, min: 0, required: true, label: Latency,
                              description: "The SRT latency in milliseconds." }
      bind_audio: *bind_audio
      bind_video: *bind_video
      stream_id: &srt_streamid { type: string, default: "", max_length: 512, label: Stream ID,
                                 description: "The SRT stream ID the receiver expects, empty for none." }
      max_bandwidth: &srt_maxbw { type: int, min: -1, default: -1, label: Maximum bandwidth,
                                  description: "SRT's maximum bandwidth setting; -1 leaves it unlimited relative to the input rate, as SRT defines it." }
      key_length: &srt_keylen { type: enum, values: ["0", "16", "24", "32"], default: "0", label: Key length,
                                description: "The encryption key length in bytes; 0 sends unencrypted." }
      passphrase: &srt_passphrase { type: string, default: "", secret: true, max_length: 79, label: Passphrase,
                                    description: "The encryption passphrase (10 to 79 characters in SRT), empty for none." }
    send: { method: POST, path: "/api/streamer/{interface}/stream", content_type: application/json,
            body: '{"type":"srt","name":{name:json},"mode":"{mode}","address":{address:json},"port":{port},"latency":{latency},"bindAudio":{bind_audio},"bindVideo":"{bind_video}","streamid":{stream_id:json},"maxbw":{max_bandwidth},"pbkeylen":{key_length},"passphrase":{passphrase:json}}' }
    expect: *ok
    returns: ack

  add_hls_stream:
    summary: "Add an HLS stream served by the device (POST /api/streamer/{interface}/stream, type hls)"
    params:
      interface: *iface
      name: *stream_name
      session: *stream_session
      segment_time: { type: int, min: 1, default: 5, label: Segment length,
                      description: "Each TS segment's length in seconds." }
      bind_audio: *bind_audio
      bind_video: *bind_video
    send: { method: POST, path: "/api/streamer/{interface}/stream", content_type: application/json,
            body: '{"type":"hls","name":{name:json},"session":{session:json},"segmentTime":{segment_time},"bindAudio":{bind_audio},"bindVideo":"{bind_video}"}' }
    expect: *ok
    returns: ack

  add_ts_udp_stream:
    summary: "Add an MPEG-TS over UDP stream, unicast or multicast (POST /api/streamer/{interface}/stream, type ts)"
    params:
      interface: *iface
      name: *stream_name
      address: &ts_address { type: string, required: true, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', label: Destination,
                             description: "The receiver's IP address, or a multicast group." }
      port: &ts_port { type: int, min: 1, max: 65535, required: true, label: Destination port,
                       description: "The receiver's UDP port." }
      ttl: { type: int, min: 0, max: 255, default: 127, label: TTL,
             description: "The packets' time to live, for multicast." }
      null_packets: { type: enum, values: ["0", "1.2", "1.5", "2.0", "3.0", "4.0", "5.0"], default: "0", label: Null packet multiple,
                      description: "Pads the stream with null packets to this multiple of the bitrate; 0 adds none." }
      bind_port: { type: int, min: 0, max: 65535, default: 0, label: Local port,
                   description: "The local UDP port to send from; 0 lets the device choose." }
      bind_audio: *bind_audio
      bind_video: *bind_video
      service_name: &ts_service_name { type: string, default: Encoder, max_length: 64, label: Service name,
                                       description: "The MPEG-TS service name." }
      service_provider: &ts_service_provider { type: string, default: Encoder device, max_length: 64, label: Service provider,
                                               description: "The MPEG-TS service provider name." }
      transport_stream_id: { type: int, min: 0, max: 65535, default: 101, label: Transport stream ID,
                             description: "The MPEG-TS transport stream id." }
      tables_version: { type: int, min: 0, max: 31, default: 6, label: Table version,
                        description: "The version number of the MPEG-TS tables." }
      pcr_period: { type: int, min: 1, default: 20, label: PCR period,
                    description: "The interval at which the PCR is written, in milliseconds." }
      start_pid: { type: int, min: 16, max: 8190, default: 480, label: First stream PID,
                   description: "The PID of the first elementary stream." }
      pmt_start_pid: { type: int, min: 16, max: 8190, default: 481, label: PMT PID,
                       description: "The PID of the first PMT." }
    send: { method: POST, path: "/api/streamer/{interface}/stream", content_type: application/json,
            body: '{"type":"ts","name":{name:json},"address":{address:json},"port":{port},"ttl":{ttl},"ts_null_multiple":{null_packets},"bindPort":{bind_port},"bindAudio":{bind_audio},"bindVideo":"{bind_video}","ts_service_name":{service_name:json},"ts_service_provider":{service_provider:json},"ts_transport_stream_id":{transport_stream_id},"ts_tables_version":{tables_version},"ts_pcr_period":{pcr_period},"ts_start_pid":{start_pid},"ts_pmt_start_pid":{pmt_start_pid}}' }
    expect: *ok
    returns: ack

  add_rtp_stream:
    summary: "Add an RTP stream carrying MPEG-TS (POST /api/streamer/{interface}/stream, type rtp)"
    params:
      interface: *iface
      name: *stream_name
      address: *ts_address
      port: *ts_port
      bind_audio: *bind_audio
      bind_video: *bind_video
      service_name: *ts_service_name
      service_provider: *ts_service_provider
    send: { method: POST, path: "/api/streamer/{interface}/stream", content_type: application/json,
            body: '{"type":"rtp","name":{name:json},"address":{address:json},"port":{port},"load_type":"ts","bindAudio":{bind_audio},"bindVideo":"{bind_video}","ts_service_name":{service_name:json},"ts_service_provider":{service_provider:json}}' }
    expect: *ok
    returns: ack

  add_stream:
    summary: "Add a stream of any type with every field of API 3.1.2 (POST /api/streamer/{interface}/stream); stream is that JSON object, type included"
    params:
      interface: *iface
      stream: { type: json, required: true, label: Stream,
                description: "The stream as a JSON object with the fields API 3.1.2 lists for its type (rtsp, rtmp, srt, hls, ts or rtp)." }
    send: { method: POST, path: "/api/streamer/{interface}/stream", content_type: application/json, body: '{stream}' }
    expect: *ok
    returns: ack

  update_ndi_stream:
    summary: "Change a channel's NDI|HX stream: name, group, channel name, transport, multicast and discovery server (PUT /api/streamer/{interface}/stream/{stream_id})"
    params:
      interface: *iface
      stream_id: &stream_id { type: string, required: true, max_length: 64, pattern: '^[A-Za-z0-9_-]+$', label: Stream ID,
                              description: "The stream's id, as list_streams gives it." }
      name: *stream_name
      channel_name: { type: string, required: true, max_length: 64, label: NDI channel name,
                      description: "The channel part of the NDI source name." }
      group: { type: string, default: "", max_length: 128, label: NDI groups,
               description: "The NDI groups the source is in; empty means public." }
      connection: { type: enum, values: [disable_rudp, rudp, udp, multicast], default: disable_rudp, label: NDI transport,
                    description: "disable_rudp sends multi-TCP, rudp reliable UDP, udp plain UDP, multicast by multicast." }
      multicast_prefix: { type: string, default: 239.255.0.0, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', label: Multicast prefix,
                          description: "The multicast address range, used only with the multicast transport." }
      multicast_netmask: { type: string, default: 255.255.0.0, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', label: Multicast netmask,
                           description: "The multicast range's mask, used only with the multicast transport." }
      ttl: { type: int, min: 0, max: 255, default: 1, label: Multicast TTL,
             description: "The multicast time to live, used only with the multicast transport." }
      discovery_server: { type: string, default: "", max_length: 253, label: Discovery server,
                          description: "The NDI discovery server's address, empty for none." }
      bind_audio: *bind_audio
      bind_video: *bind_video
    send: { method: PUT, path: "/api/streamer/{interface}/stream/{stream_id}", content_type: application/json,
            body: '{"id":{stream_id:json},"type":"ndi_hx","name":{name:json},"channel_name":{channel_name:json},"group":{group:json},"connection":"{connection}","netprefix":{multicast_prefix:json},"netmask":{multicast_netmask:json},"ttl":{ttl},"discovery_server":{discovery_server:json},"bindAudio":{bind_audio},"bindVideo":"{bind_video}"}' }
    expect: *ok
    returns: ack

  update_rtmp_stream:
    summary: "Change an RTMP or RTMPS stream (PUT /api/streamer/{interface}/stream/{stream_id}, type rtmp)"
    params:
      interface: *iface
      stream_id: *stream_id
      name: *stream_name
      address: *rtmp_address
      bind_audio: *bind_audio
      bind_video: *bind_video
      reconnect_interval: *rtmp_reconnect
      connect_timeout: *rtmp_timeout
      user: *rtmp_user
      password: *rtmp_password
      old_rtmp: *rtmp_old
    send: { method: PUT, path: "/api/streamer/{interface}/stream/{stream_id}", content_type: application/json,
            body: '{"id":{stream_id:json},"type":"rtmp","name":{name:json},"address":{address:json},"bindAudio":{bind_audio},"bindVideo":"{bind_video}","connIntv":{reconnect_interval},"connTimeout":{connect_timeout},"user":{user:json},"password":{password:json},"oldRtmp":{old_rtmp}}' }
    expect: *ok
