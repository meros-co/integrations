commands:
  # ── Transitions ───────────────────────────────────────────────────────────
  take:
    summary: "TAKE on one screen: preview to program with its transition (guide 3.6, SPCtk). The device answers 1 at once and 0 when the transition ends"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
    send: "{screen:-1},1SPCtk"
    expect: { matches: "^SPCtk" }
    returns: ack
  take_all:
    summary: "Global TAKE on the screens in the take list (guide 3.7, SPtsl)"
    send: "1SPtsl"
    expect: { matches: "^SPtsl" }
    returns: ack
  set_take_list:
    summary: "Include a screen in, or exclude it from, the global TAKE list (guide 3.7, SPscl)"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      included: { type: bool, default: true,
        label: In TAKE list,
        description: "On includes the screen in the global TAKE list, off leaves it out." }
    send: "{screen:-1},{included:bool01}SPscl"
    expect: { matches: "^SPscl" }
    returns: ack
  set_take_list_on_master_load:
    summary: "Fill the global TAKE list from each master preset recall (guide 3.7.4, SPslu)"
    params:
      enabled: { type: bool, default: true,
        label: Fill from master preset,
        description: "On makes each master preset recall fill the global TAKE list with its screens." }
    send: "{enabled:bool01}SPslu"
    expect: { matches: "^SPslu" }
    returns: ack
  set_tbar:
    summary: "T-bar position of a screen, 0-65535 (variables, SP_TBAR SPCtb)"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      position: { type: int, min: 0, max: 65535, required: true,
        label: T-bar position,
        description: "T-bar position from 0 (start) to 65535 (end of the transition)." }
    send: "{screen:-1},{position}SPCtb"
    expect: { matches: "^SPCtb" }
    returns: ack

  # ── Presets ───────────────────────────────────────────────────────────────
  recall_preset:
    summary: "Recall a preset memory to a screen's preview (or program): filter, scale, memory, screen and destination, then the load (guide 3.2). filter adds the elements recalled: 1 sources, 2 positions and sizes, 4 transparencies, 8 cropping, 16 borders, 32 transitions, 64 effects, 128 timings, 256 speed, 512 flying curve, 1024 native background, 2048 cut and fill; 4095 is all"
    params:
      memory: { type: int, min: 1, max: 144, required: true,
        label: Memory,
        description: "Preset memory number, 1 to 144." }
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      preview: { type: bool, default: true,
        label: To preview,
        description: "On acts on the screen's preview, off on its program." }
      filter: { type: int, min: 0, max: 4095, default: 4095,
        label: Recall filter,
        description: "Sum of the elements to recall: 1 sources, 2 positions and sizes, 4 transparencies, 8 cropping, 16 borders, 32 transitions, 64 effects, 128 timings, 256 speed, 512 flying curve, 1024 native background, 2048 cut and fill; 4095 recalls all." }
      scale: { type: bool, default: false,
        label: Scale,
        description: "On sets the recall's scale option; that it scales the recalled layers to the screen is inferred from its name." }
    send:
      - "{filter}PMcat"
      - "{scale:bool01}PMlse"
      - "{memory:-1}PMmet"
      - "{screen:-1}PMscf"
      - "{preview:bool01}PMprf"
      - "1PMloa"
    expect: { matches: "^([^E]|E[^1])" }
    returns: ack
  recall_preset_and_take:
    summary: "As recall_preset, then TAKE the screen once loaded (guide 3.2.5, PMlot)"
    params:
      memory: { type: int, min: 1, max: 144, required: true,
        label: Memory,
        description: "Preset memory number, 1 to 144." }
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      preview: { type: bool, default: true,
        label: To preview,
        description: "On acts on the screen's preview, off on its program." }
      filter: { type: int, min: 0, max: 4095, default: 4095,
        label: Recall filter,
        description: "Sum of the elements to recall: 1 sources, 2 positions and sizes, 4 transparencies, 8 cropping, 16 borders, 32 transitions, 64 effects, 128 timings, 256 speed, 512 flying curve, 1024 native background, 2048 cut and fill; 4095 recalls all." }
      scale: { type: bool, default: false,
        label: Scale,
        description: "On sets the recall's scale option; that it scales the recalled layers to the screen is inferred from its name." }
    send:
      - "{filter}PMcat"
      - "{scale:bool01}PMlse"
      - "{memory:-1}PMmet"
      - "{screen:-1}PMscf"
      - "{preview:bool01}PMprf"
      - "1PMlot"
    expect: { matches: "^([^E]|E[^1])" }
    returns: ack
  recall_master_preset:
    summary: "Recall a master preset memory to the screens it holds, preview (or program): filter, scale, memory and destination, then the load (guide 3.3)"
    params:
      memory: { type: int, min: 1, max: 144, required: true,
        label: Master memory,
        description: "Master preset memory number, 1 to 144." }
      preview: { type: bool, default: true,
        label: To preview,
        description: "On acts on the screen's preview, off on its program." }
      filter: { type: int, min: 0, max: 4095, default: 4095,
        label: Recall filter,
        description: "Sum of the elements to recall: 1 sources, 2 positions and sizes, 4 transparencies, 8 cropping, 16 borders, 32 transitions, 64 effects, 128 timings, 256 speed, 512 flying curve, 1024 native background, 2048 cut and fill; 4095 recalls all." }
      scale: { type: bool, default: false,
        label: Scale,
        description: "On sets the recall's scale option; that it scales the recalled layers to the screen is inferred from its name." }
    send:
      - "{filter}PMcat"
      - "{scale:bool01}PMlse"
      - "{memory:-1}PSmet"
      - "{preview:bool01}PSprf"
      - "1PSloa"
    expect: { matches: "^([^E]|E[^1])" }
    returns: ack
  recall_master_preset_and_take:
    summary: "As recall_master_preset, then a global TAKE of the loaded screens (guide 3.3.1.5, PSlot)"
    params:
      memory: { type: int, min: 1, max: 144, required: true,
        label: Master memory,
        description: "Master preset memory number, 1 to 144." }
      preview: { type: bool, default: true,
        label: To preview,
        description: "On acts on the screen's preview, off on its program." }
      filter: { type: int, min: 0, max: 4095, default: 4095,
        label: Recall filter,
        description: "Sum of the elements to recall: 1 sources, 2 positions and sizes, 4 transparencies, 8 cropping, 16 borders, 32 transitions, 64 effects, 128 timings, 256 speed, 512 flying curve, 1024 native background, 2048 cut and fill; 4095 recalls all." }
      scale: { type: bool, default: false,
        label: Scale,
        description: "On sets the recall's scale option; that it scales the recalled layers to the screen is inferred from its name." }
    send:
      - "{filter}PMcat"
      - "{scale:bool01}PMlse"
      - "{memory:-1}PSmet"
      - "{preview:bool01}PSprf"
      - "1PSlot"
    expect: { matches: "^([^E]|E[^1])" }
    returns: ack
  set_master_preset_screen:
    summary: "Include or exclude a screen from master preset recalls (variables, PESMEM_OP_SCREEN_ENABLE PSose)"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      enabled: { type: bool, default: true,
        label: Included,
        description: "On includes the screen in master preset recalls, off leaves it out." }
    send: "{screen:-1},{enabled:bool01}PSose"
    expect: { matches: "^PSose" }
    returns: ack

  # ── Layers ────────────────────────────────────────────────────────────────
  set_layer_source:
    summary: "Source of a layer on a screen's preview (or program) (guide 3.4, SPPEi). source: 0 none, 1-12 live inputs of the master and 13-24 of the slave, 25-28 and 29-32 frames, 33-36 and 37-40 logos, 41 color"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      layer: { type: int, min: 1, max: 24, required: true,
        label: Layer,
        description: "Layer number on the screen, 1 to 24; how many a screen has depends on the model and configuration." }
      source: { type: int, min: 0, max: 41, required: true,
        label: Source,
        description: "0 none, 1-12 live inputs of the master and 13-24 of the slave, 25-32 frames, 33-40 logos, 41 colour." }
      preview: { type: bool, default: true,
        label: To preview,
        description: "On acts on the screen's preview, off on its program." }
    send: "{screen:-1},{preview:bool01},{layer:-1},{source}SPPEi"
    expect: { matches: "^SPPEi" }
    returns: ack
  set_background:
    summary: "Native background set of a screen's preview (or program), 0 for none (guide 3.5, SPPNi)"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      set: { type: int, min: 0, max: 8, required: true,
        label: Background set,
        description: "Native background set number, 1 to 8, or 0 for none." }
      preview: { type: bool, default: true,
        label: To preview,
        description: "On acts on the screen's preview, off on its program." }
    send: "{screen:-1},{preview:bool01},{set}SPPNi"
    expect: { matches: "^SPPNi" }
    returns: ack

  # ── Inputs ────────────────────────────────────────────────────────────────
  freeze_input:
    summary: "Freeze or unfreeze a live input (variables, IN_FREEZE INfrz)"
    params:
      input: { type: int, min: 1, max: 24, required: true,
        label: Input,
        description: "Live input number from 1; 13-24 are the slave's in an additive configuration." }
      frozen: { type: bool, default: true,
        label: Frozen,
        description: "On freezes the input, off unfreezes it." }
    send: "{input:-1},{frozen:bool01}INfrz"
    expect: { matches: "^INfrz" }
    returns: ack
  black_input:
    summary: "Black out a live input, or restore it (variables, IN_BLACK INbla)"
    params:
      input: { type: int, min: 1, max: 24, required: true,
        label: Input,
        description: "Live input number from 1; 13-24 are the slave's in an additive configuration." }
      black: { type: bool, default: true,
        label: Black,
        description: "On blacks out the input, off restores it." }
    send: "{input:-1},{black:bool01}INbla"
    expect: { matches: "^INbla" }
    returns: ack

  # ── Monitoring ────────────────────────────────────────────────────────────
  monitoring_fullscreen:
    summary: "Show one source full screen on a device's monitoring output (guide 3.8). source: 0-23 inputs, 24-31 frames, 32-39 logos, 40-47 screens 1-8 program, 48-55 preview"
    params:
      device: { type: int, min: 1, max: 2, default: 1,
        label: Device,
        description: "1 is the master and 2 the slave in an additive configuration; a single device is 1." }
      source: { type: int, min: 0, max: 55, required: true,
        label: Source,
        description: "0-23 inputs, 24-31 frames, 32-39 logos, 40-47 screens 1-8 program, 48-55 screens 1-8 preview." }
    send:
      - "{device:-1},0MLupd"
      - "{device:-1},1MLfen"
      - "{device:-1},{source}MLfes"
      - "{device:-1},1MLupd"
    expect: { matches: "^([^E]|E[^1])" }
    returns: ack
  monitoring_window_source:
    summary: "Mosaic mode with a source in one monitoring window (guide 3.9); sources as monitoring_fullscreen"
    params:
      device: { type: int, min: 1, max: 2, default: 1,
        label: Device,
        description: "1 is the master and 2 the slave in an additive configuration; a single device is 1." }
      window: { type: int, min: 1, max: 12, required: true,
        label: Window,
        description: "Monitoring window number in the mosaic, from 1." }
      source: { type: int, min: 0, max: 55, required: true,
        label: Source,
        description: "0-23 inputs, 24-31 frames, 32-39 logos, 40-47 screens 1-8 program, 48-55 screens 1-8 preview." }
    send:
      - "{device:-1},0MLupd"
      - "{device:-1},0MLfen"
      - "{device:-1},{window:-1},{source}MLces"
      - "{device:-1},1MLupd"
    expect: { matches: "^([^E]|E[^1])" }
    returns: ack
  recall_monitoring_preset:
    summary: "Recall a monitoring preset, 1-8 (guide 3.10)"
    params:
      device: { type: int, min: 1, max: 2, default: 1,
        label: Device,
        description: "1 is the master and 2 the slave in an additive configuration; a single device is 1." }
      memory: { type: int, min: 1, max: 8, required: true,
        label: Monitoring preset,
        description: "Monitoring preset number, 1 to 8." }
    send:
      - "{device:-1},0MLupd"
      - "{memory:-1},{device:-1},1MMloa"
      - "{device:-1},1MLupd"
    expect: { matches: "^([^E]|E[^1])" }
    returns: ack
  recall_confidence_preset:
    summary: "Load a confidence monitor preset, 1-16, on a screen (guide 3.11, CMloa)"
    params:
      memory: { type: int, min: 1, max: 16, required: true,
        label: Confidence preset,
        description: "Confidence monitor preset number, 1 to 16." }
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
    send: "{memory:-1},{screen:-1},1CMloa"
    expect: { matches: "^CMloa" }
    returns: ack

  # ── GPIO ──────────────────────────────────────────────────────────────────
  set_gpi_mode:
    summary: "GPI mode: false normal, true TAKE on the screens chosen with set_gpi_take_screen (guide 3.16, GPimo)"
    params:
      gpi: { type: int, min: 1, max: 2, required: true,
        label: GPI,
        description: "General-purpose input number, 1 or 2." }
      take: { type: bool, required: true,
        label: TAKE mode,
        description: "On makes the GPI trigger a TAKE on its chosen screens, off sets it to normal mode." }
    send: "{gpi:-1},{take:bool01}GPimo"
    expect: { matches: "^GPimo" }
    returns: ack
  set_gpi_take_screen:
    summary: "Whether a GPI in TAKE mode takes a screen (variables, GPIO_IN_TAKE_SCREEN GPits)"
    params:
      gpi: { type: int, min: 1, max: 2, required: true,
        label: GPI,
        description: "General-purpose input number, 1 or 2." }
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      enabled: { type: bool, default: true,
        label: Takes screen,
        description: "On makes the GPI's TAKE include this screen, off leaves it out." }
    send: "{gpi:-1},{screen:-1},{enabled:bool01}GPits"
    expect: { matches: "^GPits" }
    returns: ack
  set_gpo_mode:
    summary: "GPO mode: 0 free, 1 tally before transition, 2 tally after transition (guide 3.17, GPomo)"
    params:
      gpo: { type: int, min: 1, max: 10, required: true,
        label: GPO,
        description: "General-purpose output number, 1 to 10." }
      mode: { type: int, min: 0, max: 2, required: true,
        label: GPO mode,
        description: "0 free (set by set_gpo), 1 tally before the transition, 2 tally after the transition." }
    send: "{gpo:-1},{mode}GPomo"
    expect: { matches: "^GPomo" }
    returns: ack
  set_gpo:
    summary: "Activate or release a GPO in free mode (guide 3.17, GPofa)"
    params:
      gpo: { type: int, min: 1, max: 10, required: true,
        label: GPO,
        description: "General-purpose output number, 1 to 10." }
      active: { type: bool, default: true,
        label: Active,
        description: "On activates the GPO, off releases it; the GPO must be in free mode." }
    send: "{gpo:-1},{active:bool01}GPofa"
    expect: { matches: "^GPofa" }
    returns: ack

  # ── System ────────────────────────────────────────────────────────────────
  reboot:
    summary: "Reboot the master (1) or slave (2) device (guide 3.14, PCreb)"
    params:
      device: { type: int, min: 1, max: 2, default: 1,
        label: Device,
        description: "1 is the master and 2 the slave in an additive configuration; a single device is 1." }
    send: "{device:-1},1PCreb"
    expect: { matches: "^PCreb" }
    returns: ack
  shutdown:
    summary: "Shut the device down; it must be restarted by hand (guide 3.14, 1PCsht)"
    params:
      device: { type: int, min: 1, max: 2, default: 1,
        label: Device,
        description: "1 is the master and 2 the slave in an additive configuration; a single device is 1." }
    send: "{device:-1},1PCsht"
    expect: { matches: "^PCsht" }
    returns: ack
  shutdown_wake_on_lan:
    summary: "Shut the device down with Wake-on-LAN enabled (guide 3.14, 2PCsht)"
    params:
      device: { type: int, min: 1, max: 2, default: 1,
        label: Device,
        description: "1 is the master and 2 the slave in an additive configuration; a single device is 1." }
    send: "{device:-1},2PCsht"
    expect: { matches: "^PCsht" }
    returns: ack

  # ── Input plugs (variables: IN_PLUG, IN_AUTOSET_INPUT, IN_AUTOCENTER_INPUT) ─
  set_input_plug:
    summary: "Choose a live input's active plug (variables, IN_PLUG INplg): 0 analog HD15, 1 analog DVI, 2 DVI, 3 SDI, 4 HDMI, 5 DisplayPort"
    params:
      input: { type: int, min: 1, max: 24, required: true,
        label: Input,
        description: "Live input number from 1; 13-24 are the slave's in an additive configuration." }
      plug: { type: int, min: 0, max: 5, required: true,
        label: Plug,
        description: "0 analog HD15, 1 analog DVI (DVI-A), 2 DVI, 3 SDI, 4 HDMI, 5 DisplayPort; the input card decides which it has." }
    send: "{input:-1},{plug}INplg"
    expect: { matches: "^INplg" }
    returns: ack
  autoset_input:
    summary: "Run an autoset of every plug of a live input (variables, IN_AUTOSET_INPUT INasi)"
    params:
      input: { type: int, min: 1, max: 24, required: true,
        label: Input,
        description: "Live input number from 1; 13-24 are the slave's in an additive configuration." }
    send: "{input:-1},1INasi"
    expect: { matches: "^INasi" }
    returns: ack
  autocenter_input:
    summary: "Autocenter the active plug of an analog input: 1 quick (phase and blankings), 2 advanced (pixel frequency too) (variables, INain)"
    params:
      input: { type: int, min: 1, max: 24, required: true,
        label: Input,
        description: "Live input number from 1; 13-24 are the slave's in an additive configuration." }
      mode: { type: int, min: 1, max: 2, required: true,
        label: Autocenter,
        description: "1 quick, adjusting phase and blankings; 2 advanced, adjusting pixel frequency, phase and blankings." }
    send: "{input:-1},{mode}INain"
    expect: { matches: "^INain" }
    returns: ack

  # ── Confidence monitoring (variables: SCico, COlay, COsca-d, COupd) ────────
  set_confidence_mode:
    summary: "Turn a screen's confidence (confidential) mode on or off (variables, OSCREEN_IS_CONFIDENCIAL SCico)"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      enabled: { type: bool, required: true,
        label: Confidence mode,
        description: "On makes the screen a confidence monitor, off a normal screen." }
    send: "{screen:-1},{enabled:bool01}SCico"
    expect: { matches: "^SCico" }
    returns: ack
  set_confidence_layout:
    summary: "A confidence screen's layout (variables, COlay): 0 disabled, 1 full screen, 2-3 two windows, 4-9 three, 10-14 four"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      layout: { type: int, min: 0, max: 14, required: true,
        label: Layout,
        description: "0 disabled, 1 one window full screen, 2 two split horizontally, 3 two split vertically, 4-9 three windows (split horizontally, vertically, then merged top, bottom, left, right), 10 quad, 11-14 four windows merged top, bottom, left, right." }
    send: "{screen:-1},{layout}COlay"
    expect: { matches: "^COlay" }
    returns: ack
  set_confidence_source:
    summary: "The source of one window of a confidence screen (variables, COsca to COscd): 0 none, 1-24 inputs, 25-32 stills, 33-40 logos, 41-48 screens' program, 49-56 preview"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      window: { type: int, min: 1, max: 4, required: true,
        label: Window,
        description: "The confidence window, 1 to 4 (registers COsca to COscd)." }
      source: { type: int, min: 0, max: 56, required: true,
        label: Source,
        description: "0 none, 1-12 master inputs and 13-24 slave inputs, 25-28 master and 29-32 slave stills, 33-36 master and 37-40 slave logos, 41-48 screens 1-8 program, 49-56 screens 1-8 preview." }
    send: "{screen:-1},{source}COsc{window:map.confidence_slot}"
    expect: { matches: "^COsc[a-d]" }
    returns: ack
  update_confidence:
    summary: "Apply the confidence layout and source changes (variables, CONFIDENTIAL_UPDATE COupd)"
    send: "1COupd"
    expect: { matches: "^COupd" }
    returns: ack

  # ── Saving monitoring and confidence presets (variables: MMsav, CMsav) ────
  save_monitoring_preset:
    summary: "Save the monitoring output's layout as a monitoring preset, 1-8 (variables, MON_MEM_SAVE MMsav)"
    params:
      device: { type: int, min: 1, max: 2, default: 1,
        label: Device,
        description: "1 is the master and 2 the slave in an additive configuration; a single device is 1." }
      memory: { type: int, min: 1, max: 8, required: true,
        label: Monitoring preset,
        description: "Monitoring preset number to overwrite, 1 to 8." }
    send: "{device:-1},{memory:-1},1MMsav"
    expect: { matches: "^MMsav" }
    returns: ack
  reset_monitoring_preset:
    summary: "Clear a monitoring preset, 1-8 (variables, MON_MEM_RESET MMres)"
    params:
      memory: { type: int, min: 1, max: 8, required: true,
        label: Monitoring preset,
        description: "Monitoring preset number to clear, 1 to 8." }
    send: "{memory:-1},1MMres"
    expect: { matches: "^MMres" }
    returns: ack
  save_confidence_preset:
    summary: "Save a screen's confidence layout and sources as a confidence preset, 1-16 (variables, CONFIDENCE_MEM_SAVE CMsav)"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      memory: { type: int, min: 1, max: 16, required: true,
        label: Confidence preset,
        description: "Confidence preset number to overwrite, 1 to 16." }
    send: "{screen:-1},{memory:-1},1CMsav"
    expect: { matches: "^CMsav" }
    returns: ack
  reset_confidence_preset:
    summary: "Clear a confidence preset, 1-16 (variables, CONFIDENCE_MEM_RESET CMres)"
    params:
      memory: { type: int, min: 1, max: 16, required: true,
        label: Confidence preset,
        description: "Confidence preset number to clear, 1 to 16." }
    send: "{memory:-1},1CMres"
    expect: { matches: "^CMres" }
    returns: ack
  set_gpo_tally_input:
    summary: "In tally mode, whether a source on a screen drives a GPO (variables, GPIO_OUT_TALLY_INPUT GPoti); source in layer numbering, 0-41"
    params:
      gpo: { type: int, min: 1, max: 10, required: true,
        label: GPO,
        description: "General-purpose output number, 1 to 10." }
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      source: { type: int, min: 0, max: 41, required: true,
        label: Source,
        description: "Source in layer source numbering: 0 none, 1-24 inputs, 25-32 frames, 33-40 logos, 41 colour." }
      enabled: { type: bool, required: true,
        label: Drives the GPO,
        description: "On makes this source on this screen light the GPO's tally, off leaves it out." }
    send: "{gpo:-1},{screen:-1},{source},{enabled:bool01}GPoti"
    expect: { matches: "^GPoti" }
    returns: ack

  # ── Reads ─────────────────────────────────────────────────────────────────
  get_device_type:
    summary: "Device type number, 97-119 (guide 3.1, ?)"
    send: "?"
    expect: { matches: "^DEV(\\d+)$" }
    returns: value
  get_device_state:
    summary: "Device state: 0 unknown, 1 initializing, 2 recall, 3 coupling, 4 factory reset, 5 updating, 255 ready (variables, PCdgs)"
    send: "PCdgs"
    expect: { matches: "^PCdgs(\\d+)$" }
    returns: value
  get_firmware:
    summary: "Firmware version word: bit 31 beta, bits 24-30 major, 16-23 minor, 0-15 build (variables, VEupd)"
    send: "0,VEupd"
    expect: { matches: "^VEupd0,(\\d+)$" }
    returns: value
  get_command_set_version:
    summary: "TPP command set version (guide 3.1, TPver)"
    send: "0,TPver"
    expect: { matches: "^TPver0,(\\d+)$" }
    returns: value
  get_take_available:
    summary: "1 when TAKE and the T-bar are available on a screen (guide 3.6, GCava)"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
    send: "{screen:-1},GCava"
    expect: { matches: "^GCava\\d+,(\\d+)$" }
    returns: value
  get_layer_source:
    summary: "Source of a layer on a screen's preview (or program), as for set_layer_source"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      layer: { type: int, min: 1, max: 24, required: true,
        label: Layer,
        description: "Layer number on the screen, 1 to 24; how many a screen has depends on the model and configuration." }
      preview: { type: bool, default: true,
        label: To preview,
        description: "On acts on the screen's preview, off on its program." }
    send: "{screen:-1},{preview:bool01},{layer:-1},SPPEi"
    expect: { matches: "^SPPEi\\d+,\\d+,\\d+,(\\d+)$" }
    returns: value
  get_background:
    summary: "Native background set of a screen's preview (or program)"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
      preview: { type: bool, default: true,
        label: To preview,
        description: "On acts on the screen's preview, off on its program." }
    send: "{screen:-1},{preview:bool01},SPPNi"
    expect: { matches: "^SPPNi\\d+,\\d+,(\\d+)$" }
    returns: value
  get_tbar:
    summary: "T-bar position of a screen, 0-65535"
    params:
      screen: { type: int, min: 1, max: 8, required: true,
        label: Screen,
        description: "Screen number from 1, as on the device." }
    send: "{screen:-1},SPCtb"
    expect: { matches: "^SPCtb\\d+,(\\d+)$" }
    returns: value
  get_input_frozen:
    summary: "1 when a live input is frozen"
    params:
      input: { type: int, min: 1, max: 24, required: true,
        label: Input,
        description: "Live input number from 1; 13-24 are the slave's in an additive configuration." }
    send: "{input:-1},INfrz"
    expect: { matches: "^INfrz\\d+,(\\d+)$" }
    returns: value
  get_tally_program:
    summary: "1 when a source (layer source numbering, 1-41) is on a program screen (guide 3.18, TAopr)"
    params:
      source: { type: int, min: 1, max: 41, required: true,
        label: Source,
        description: "Source in layer source numbering: 1-12 master inputs, 13-24 slave inputs, 25-32 frames, 33-40 logos, 41 colour." }
    send: "{source},TAopr"
    expect: { matches: "^TAopr\\d+,(\\d+)$" }
    returns: value
  get_tally_preview:
    summary: "1 when a source is on a preview screen (guide 3.18, TAopw)"
    params:
      source: { type: int, min: 1, max: 41, required: true,
        label: Source,
        description: "Source in layer source numbering: 1-12 master inputs, 13-24 slave inputs, 25-32 frames, 33-40 logos, 41 colour." }
    send: "{source},TAopw"
    expect: { matches: "^TAopw\\d+,(\\d+)$" }
    returns: value
  get_gpi:
    summary: "1 when a GPI is active (guide 3.16, GPist)"
    params:
      gpi: { type: int, min: 1, max: 2, required: true,
        label: GPI,
        description: "General-purpose input number, 1 or 2." }
    send: "{gpi:-1},GPist"
    expect: { matches: "^GPist\\d+,(\\d+)$" }
    returns: value
  read_back:
    summary: "Ask the device to send every register (1) or those away from their defaults (3) (guide 3.1, TPdie); the values arrive as telemetry"
    params:
      mode: { type: int, min: 1, max: 3, default: 3,
        label: Read-back mode,
        description: "1 sends every register, 3 only those away from their defaults." }
    send: "{mode}TPdie"
    expect: { matches: "^TPdie" }
    returns: ack
  send_raw:
    summary: "Any TPP command from the variables document, as written (indexes, value, register name); returns the device's answer line"
    params:
      command: { type: string, max_length: 64, pattern: "^[!-~]+$", required: true,
        label: Command,
        description: "A TPP command as written in the variables document: indexes, value and register name, e.g. 0,GCava." }
    send: "{command}"
    expect: { matches: "^(([^E]|E[^1]).*)$" }
    returns: value

telemetry:
  # Identity is asked once; then every register away from its default is read
  # back (guide 3.1). The device answers each change with the register's
  # value in the same form, and pushes TPcon on connecting.
  poll:
    send: ["?", "PCdgs", "0,VEupd", "0,TPver"]
  subscribe:
    send: ["3TPdie"]
  updates:
    - match: "^DEV(\\d+)$"
      state: { "device.type": "{1}" }
    - match: "^PCdgs(\\d+)$"
      state: { "device.state": "{1}" }
    - match: "^VEupd0,(\\d+)$"
      state: { "device.firmware": "{1}" }
    - match: "^TPver0,(\\d+)$"
      state: { "device.command_set_version": "{1}" }
    - match: "^TPcon0,(\\d+)$"
      state: { "device.tpp_controllers": "{1}" }
    - match: "^TEdal0,(\\d+)$"
      state: { "device.temperature_alarm": "{1}" }
    - match: "^FAalm0,(\\d+)$"
      state: { "device.fan_alarm": { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^SPise(\\d+),(\\d+)$"
      state: { "screens.{1:+1}.enabled": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^SPCtk(\\d+),(\\d+)$"
      state: { "screens.{1:+1}.taking": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^GCava(\\d+),(\\d+)$"
      state: { "screens.{1:+1}.take_available": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^SPscl(\\d+),(\\d+)$"
      state: { "screens.{1:+1}.in_take_list": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^SPCtb(\\d+),(\\d+)$"
      state: { "screens.{1:+1}.tbar": "{2}" }
    - match: "^SPPEi(\\d+),0,(\\d+),(\\d+)$"
      state: { "screens.{1:+1}.program.layers.{2:+1}.source": "{3}" }
    - match: "^SPPEi(\\d+),1,(\\d+),(\\d+)$"
      state: { "screens.{1:+1}.preview.layers.{2:+1}.source": "{3}" }
    - match: "^SPPNi(\\d+),0,(\\d+)$"
      state: { "screens.{1:+1}.program.background": "{2}" }
    - match: "^SPPNi(\\d+),1,(\\d+)$"
      state: { "screens.{1:+1}.preview.background": "{2}" }
    - match: "^INava(\\d+),(\\d+)$"
      state: { "inputs.{1:+1}.available": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^INfrz(\\d+),(\\d+)$"
      state: { "inputs.{1:+1}.frozen": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^INbla(\\d+),(\\d+)$"
      state: { "inputs.{1:+1}.black": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^ISsva(\\d+),(\\d+),(\\d+)$"
      state: { "inputs.{1:+1}.plugs.{2}.signal": { value: "{3}", map: { "0": false, "1": true } } }
    - match: "^TAopr(\\d+),(\\d+)$"
      state: { "tally.{1}.program": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^TAopw(\\d+),(\\d+)$"
      state: { "tally.{1}.preview": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^GPist(\\d+),(\\d+)$"
      state: { "gpi.{1:+1}.active": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^GPofa(\\d+),(\\d+)$"
      state: { "gpo.{1:+1}.active": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^MLfen(\\d+),(\\d+)$"
      state: { "monitoring.{1:+1}.fullscreen": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^MLfes(\\d+),(\\d+)$"
      state: { "monitoring.{1:+1}.fullscreen_source": "{2}" }
    - match: "^MLces(\\d+),(\\d+),(\\d+)$"
      state: { "monitoring.{1:+1}.windows.{2:+1}.source": "{3}" }
    - match: "^PMloa(\\d+)$"
      state: { "presets.loading": { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^PSloa(\\d+)$"
      state: { "master_presets.loading": { value: "{1}", map: { "0": false, "1": true } } }
    - match: "^TPdie(\\d+)$"
      state: { "device.reading_back": { value: "{1}", map: { "0": false, "1": true, "2": true, "3": true } } }
    - match: "^INplg(\\d+),(\\d+)$"
      state: { "inputs.{1:+1}.plug": "{2}" }
    - match: "^INpav(\\d+),(\\d+),(\\d+)$"
      state: { "inputs.{1:+1}.plugs.{2}.available": { value: "{3}", map: { "0": false, "1": true } } }
    - match: "^IShdc(\\d+),(\\d+),(\\d+)$"
      state: { "inputs.{1:+1}.plugs.{2}.hdcp": { value: "{3}", map: { "0": false, "1": true } } }
    - match: "^ISiwi(\\d+),(\\d+),(\\d+)$"
      state: { "inputs.{1:+1}.plugs.{2}.width": "{3}" }
    - match: "^ISihe(\\d+),(\\d+),(\\d+)$"
      state: { "inputs.{1:+1}.plugs.{2}.height": "{3}" }
    - match: "^INaip(\\d+),(\\d+)$"
      state: { "inputs.{1:+1}.autocenter_progress": "{2}" }
    - match: "^OUihc(\\d+),(\\d+)$"
      state: { "outputs.{1:+1}.hdcp": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^SCssh(\\d+),(\\d+)$"
      state: { "screens.{1:+1}.width": "{2}" }
    - match: "^SCssv(\\d+),(\\d+)$"
      state: { "screens.{1:+1}.height": "{2}" }
    - match: "^SCico(\\d+),(\\d+)$"
      state: { "screens.{1:+1}.confidence": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^COlay(\\d+),(\\d+)$"
      state: { "screens.{1:+1}.confidence_layout": "{2}" }
    - match: "^COsc([a-d])(\\d+),(\\d+)$"
      state: { "screens.{2:+1}.confidence_sources.{1}": "{3}" }
    - match: "^COsva(\\d+),(\\d+)$"
      state: { "screens.{1:+1}.confidence_valid": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^PSval(\\d+),(\\d+)$"
      state: { "master_presets.{1:+1}.valid": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^CMval(\\d+),(\\d+)$"
      state: { "confidence_presets.{1:+1}.valid": { value: "{2}", map: { "0": false, "1": true } } }
    - match: "^GPoti(\\d+),(\\d+),(\\d+),(\\d+)$"
      state: { "gpo.{1:+1}.tally.{2:+1}.{3}": { value: "{4}", map: { "0": false, "1": true } } }

state:
  device.type: { type: int, description: "Device type: 97 NeXtage 16, 98 SmartMatriX Ultra, 99 Ascender 32, 100 Ascender 48, 105-108 their 4K versions, 112/113 Ascender 16 (4K), 114 Ascender 48 4K PL, 116/117 NeXtage 08 (4K), 118 Ascender 32 4K PL; 102-104, 109-111, 115, 119 output expanders" }
  device.state: { type: int, description: "Global state: 0 unknown, 1 initializing, 2 recall, 3 coupling, 4 factory reset, 5 updating, 255 ready" }
  device.firmware: { type: int, description: "Firmware version word: bit 31 beta, bits 24-30 major, 16-23 minor, 0-15 build" }
  device.command_set_version: { type: int, description: "TPP command set version" }
  device.tpp_controllers: { type: int, description: "TPP controllers connected (pushed on connecting)" }
  device.temperature_alarm: { type: int, description: "0 none, 1 preventive, 2 standby forced" }
  device.fan_alarm: { type: bool, description: "A fan alarm is raised" }
  device.reading_back: { type: bool, description: "A read-back (TPdie) is in progress" }
  screens.*.enabled: { type: bool, description: "Screen enabled and able to manage presets" }
  screens.*.taking: { type: bool, description: "A TAKE is in progress on the screen" }
  screens.*.take_available: { type: bool, description: "TAKE and T-bar available" }
  screens.*.in_take_list: { type: bool, description: "Screen included in the global TAKE" }
  screens.*.tbar: { type: int, description: "T-bar position, 0-65535" }
  screens.*.program.layers.*.source: { type: int, description: "Layer source on program: 0 none, 1-24 inputs, 25-32 frames, 33-40 logos, 41 color" }
  screens.*.preview.layers.*.source: { type: int, description: "Layer source on preview" }
  screens.*.program.background: { type: int, description: "Native background set on program, 0 none" }
  screens.*.preview.background: { type: int, description: "Native background set on preview, 0 none" }
  inputs.*.available: { type: bool, description: "Input present on the device" }
  inputs.*.frozen: { type: bool, description: "Input frozen" }
  inputs.*.black: { type: bool, description: "Input blacked out" }
  inputs.*.plugs.*.signal: { type: bool, description: "Valid signal detected on a plug (0 HD15, 1 DVI-A, 2 DVI, 3 SDI, 4 HDMI, 5 DisplayPort)" }
  tally.*.program: { type: bool, description: "Source (layer source numbering) on a program screen" }
  tally.*.preview: { type: bool, description: "Source on a preview screen" }
  gpi.*.active: { type: bool, description: "GPI active" }
