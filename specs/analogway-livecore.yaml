spec: 1
id: analogway-livecore
name: Analog Way LiveCore series (TPP)
vendor: Analog Way
category: switcher

# Analog Way's Third Party Protocol (TPP) for the LiveCore series (Ascender,
# SmartMatriX Ultra, NeXtage and their 4K and PL versions). Every command is
# ASCII ending in LF: index values, the value to write, and a register name of
# up to five letters ("0,1SPCtk"); a read leaves the value out but keeps the
# comma after each index ("0,GCava"). The device answers every valid command
# with the register's current value, the register name first and CR LF last
# ("SPCtk0,1"), and an invalid one with E10 to E13. Indexes are 0-based on the
# wire; commands take screens, layers, inputs, memories and devices from 1 and
# subtract one. Sources and monitoring sources are the documented enumeration
# values, as on the wire.
#
# Every command checks that the answer starts with its own register name, or,
# for the multi-register sequences (preset and monitoring recalls), that no
# answer is an error (E1x).
source:
  - title: "LiveCore TPP Programmer's Guide for v04.02.23 (V1.00, March 3 2017)"
    author: Analog Way
    url: "https://dwn01.analogway.com/Site+Internet/Series/LiveCore/Common/Programmer's+guide/livecore_tpp_commands_for_v04_02_23.zip"
    note: >
      Manufacturer document, LiveCore_TPP_Programmers-guide_for-v04-02-23.pdf in the zip (46 pages), the
      programmer's guide Analog Way lists for the LiveCore series. 2.3 (p.7): TCP, port 10600, five
      connections; 2.4 (pp.8-10): command, read and answer structure, LF after a command, CR LF after an
      answer, errors E10-E13; 2.6 (p.12): indexes and values; 2.8 (p.12): index 0 (master) in additive
      configurations; 3.1 (pp.14-15): TPcon pushed on connecting, "?" answered DEV<value> with the device
      table, 0,TPver, TPdie and 1TPdie/3TPdie read-back; 3.2 (pp.17-19): PMcat filter table, PMlse, PMmet
      (memory - 1, 0-143), PMscf (screen - 1, 0-7), PMprf (0 program, 1 preview), 1PMloa and the PMloa0
      answer, PMlot; 3.3 (pp.20-23): PSsse, PSmet, PSprf, PSloa, PSlot; 3.4 (p.23): <scrn>,<ProgPrev>,
      <layr>,<src>SPPEi; 3.5 (p.24): SPPNi; 3.6 (pp.25-26): <scrn>,1SPCtk, SPCtk<scrn>,0 and GCava; 3.7
      (pp.27-29): SPscl, SPtsl, SPslu; 3.8-3.10 (pp.30-34): MLupd, MLfen, MLfes and the monitoring source
      table, MLces, MMloa; 3.11 (p.35): CMloa; 3.14 (p.36): PCreb, PCsht 1 and 2; 3.16-3.18 (pp.39-43):
      GPiav, GPimo, GPits, GPist, GPoav, GPomo, GPofa, TAopr, TAopw.
  - title: "LiveCore TPP variables for v04.02.23 (Analog Way TPP commands documentation, 2017-03-03)"
    author: Analog Way
    url: "https://dwn01.analogway.com/Site+Internet/Series/LiveCore/Common/Programmer's+guide/livecore_tpp_commands_for_v04_02_23.zip"
    note: >
      Manufacturer document, LiveCore_TPP_variables_for_v04-02-23.xls (and .pdf, 17 pages) in the same zip:
      every register with its indexes, value range and default. Sheet 1 (registers): DEV, PCdgs, TPdie,
      TPver, VEupd, TPcon, PCsht, PCreb, TEdal, FAalm, SPise, SPCtk, GCava, SPtsl, SPscl, SPslu, SPCtb
      (0-65535), SPPNi, PMloa, PMlot, PMcat, PMlse, PMmet, PMscf, PMprf, PSose, PSloa, PSlot, PSmet, PSprf,
      SPPEi, ISsva, INava, INfrz, INbla, MLfen, MLfes, MLces, MLupd, MMloa, CMloa, GPiav, GPist, GPimo,
      GPits, GPoav, GPofa, GPomo, TAopr, TAopw. Sheet 2 (dimensions): DIM_SCREEN S1-S8, DIM_LAYER L1-L24,
      DIM_INPUT IN_1-IN_24, DIM_GPI 1-2, DIM_GPO 1-10, DIM_MONITORING_ELEMENT 0-11, DIM_MON_MEM_SET 0-7,
      DIM_CONFIDENCE_MEM_SET 0-15. Sheet 3 (enumerations): ENUM_DEV 97-119, ENUM_INPUTLAYER (0 none, 1-24
      live inputs, 25-32 frames, 33-40 logos, 41 color), ENUM_MONITORING_ELEMENT_SOURCES (0-55),
      ENUM_DEVICE_OPERATION_STATE, ENUM_TEMP_ALARM_LVL, ENUM_GPO_MODE.

transport:
  type: line-tcp
  port: 10600
  framing: terminated
  terminator: lf
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  probe: "?"

models:
