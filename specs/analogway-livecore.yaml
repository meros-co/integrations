                    set_master_preset_screen, set_layer_source, set_background, freeze_input, black_input,
                    monitoring_fullscreen, monitoring_window_source, recall_monitoring_preset,
                    recall_confidence_preset, set_gpi_mode, set_gpi_take_screen, set_gpo_mode, set_gpo,
                    reboot, shutdown, shutdown_wake_on_lan, get_device_type, get_device_state, get_firmware,
                    get_command_set_version, get_take_available, get_layer_source, get_background,
