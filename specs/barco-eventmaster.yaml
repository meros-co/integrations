spec: 1
id: barco-eventmaster
name: Barco Event Master (JSON-RPC API)
vendor: Barco
category: switcher

# Every command is one JSON-RPC 2.0 method, sent as an HTTP POST to port 9999
# with a body {"params":{...},"method":"...","id":"1234","jsonrpc":"2.0"}.
# The processor answers 200 with {"jsonrpc":"2.0","id":"1234","result":
# {"success":0,"response":...}}; success other than 0 is an error, so every
# command checks $.result.success. Methods whose params are optional are split
# into one command per documented form (activate_preset, _by_serial, _by_name,
# _as_operator, _as_super_operator), and the methods whose params are nested
# structures also have a _custom (or plain-named) form taking the documented
# params object as JSON.

source:
  - title: Event Master series Remote control protocol, Reference guide (R5919184/00)
    author: Barco
    url: https://www.barco.com/en/support/docs/R5919184
    note: >
      Manufacturer document, revision 00, dated 2025-05-08 on its last page.
      Chapter 1 is the ASCII (telnet 9878) interface, chapter 2 the JSON RPC
      interface: section 2.1 (port 9999, master unit, case-sensitive requests)
      and section 2.2, pages 10-22, every method from allTrans to unsubscribe
      with its params and the reply's response and success fields. Barco's
      support site lists revision 02 (2026-02-12) as current; it sits behind a
      bot challenge and could not be retrieved, so revision 00 was read from
      the copy attached to bitfocus/companion-module-requests issue 1912
      (https://github.com/user-attachments/files/21056211/R5919184_00_ReferenceGuide.pdf).
      Cited as R5919184/00.
  - title: Event Master Devices User's Guide (R5905948/12), appendix B.2 "Event Master series processor JSON RPC remote control"
    author: Barco
    url: https://www.manualslib.com/manual/1822386/Barco-Event-Master-E2-Series.html?page=555
    note: >
      Manufacturer document, revision 12, read on ManualsLib pages 553-568;
      revision 10 (software 6.0) read as PDF for comparison. Same method set and
      wording as R5919184/00, which superseded it. Cited as R5905948/12 B.2. The
      current revision (15, 2026-06-23 per Barco's listing) could not be
      retrieved for the same reason as above.
  - title: JSON RPC with Event Master processors (Word document, "Doc 8.2")
    author: Barco
    url: https://github.com/bitfocus/companion-module-barco-eventmaster/blob/master/docs/JSON_RPC_with_EM_processors_Doc_8_2.docx
    note: >
      Manufacturer document (Barco author metadata, last modified 2021-02-17),
      distributed in the MIT-licensed Bitfocus Companion module repository; not
      published on Barco's site in this form. Adds to R5919184/00 for E2, S3-4K
      and EX: allTrans transTime, the multi-operator operatorId and password
      params, savePreset serialNo and saveFromProgram, listSuperDestContent,
      listSuperAuxContent, changeSuperDestContent, changeSuperAuxContent,
      3dControlOutput, armUnarmDestination, fillHV, clearLayers, recallUserKey,
      listUserKeys, listSourceMainBackup, activateSourceMainBackup,
      resetSourceMainBackup, listInputs, listOutputs, mvrLayoutChange,
      listOperators and configureOperator, and the full reply envelope in its
      listContent example. Cited as Doc 8.2.
  - title: JSON RPC for Encore3 Processors v10.0
    author: Barco
    url: https://github.com/bitfocus/companion-module-barco-eventmaster/blob/master/docs/Barco%20JSON%20RPC%20with%20Encore3%20processors%20v10.0-Final.pdf
    note: >
      Manufacturer document (PDF created 2025-08-05, Barco metadata; its title
      metadata reads "WORK IN PROGRESS: PRELIMINARY AND EXPECTED TO CHANGE UNTIL
      FINAL RELEASE"), distributed in the same Companion repository. Pages 1-2:
      HTTP POST with Content-Type application/json to port 9999, a secure port
      9997 announced for a future release, and the result/error/id reply
      members. Pages 3-20: the Encore3 method set, including the reply envelope
      {"jsonrpc","id","result":{"success","response"}} in getFrameSettings,
      FrameType 8 for Encore3, the 0-3 reset codes with saveOptions, DestOutMap
      on listContent, changeContent, fillHV, clearLayers and recallUserKey, and
      listMvrPreset, activateMvrPreset and the three-argument mvrLayoutChange.
      Cited as Encore3 v10.0.
  - title: Encore3 User guide (R5917615/01), section 6.5.1 "Use JSON"
    author: Barco
    url: https://www.manualslib.com/manual/4552519/Barco-Encore3.html?page=93
    note: >
      Manufacturer document (software Event Master Toolset 10.1). Used for the
      statement that API calls can be blocked by the Encore3's security
      settings, and that the Encore3's commands are those of the Event Master
      remote control protocol reference guide.

transport:
  type: http
  port: 9999
  scheme: http
  auth: none
  timeout_ms: 5000
  probe: { method: POST, path: /, body: '{"params":{},"method":"powerStatus","id":"1234","jsonrpc":"2.0"}', content_type: application/json }

settings:
  super_operator_password: { type: string, secret: true, default: "" }

ports:
  - { port: 9999, protocol: http, role: control }

