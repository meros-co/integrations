telemetry:
  # The processor pushes changes only as HTTP POSTs to a listener the client
  # runs (subscribe), which the core does not provide, so the system, the
  # destination list and the source list are asked for every 10 seconds.
  # Every method shares the one URL, so a rule can only recognise a reply by
  # its shape: each rule below reads fields that only one method's reply holds.
  poll:
    send:
      - { method: POST, path: /, body: '{"params":{},"method":"getFrameSettings","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
      - { method: POST, path: /, body: '{"params":{},"method":"listDestinations","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
      - { method: POST, path: /, body: '{"params":{},"method":"listSources","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    every_ms: 10000
  updates:
    # getFrameSettings: the frame (System.FrameCollection.Frame).
    - path: "^/$"
      json:
        name: "$.result.response.System.FrameCollection.Frame.Name"
        version: "$.result.response.System.FrameCollection.Frame.Version"
        os_version: "$.result.response.System.FrameCollection.Frame.OSVersion"
        frame_type: "$.result.response.System.FrameCollection.Frame.FrameType"
        frame_type_name: "$.result.response.System.FrameCollection.Frame.FrameTypeName"
        ip: "$.result.response.System.FrameCollection.Frame.Enet.IP"
        mac: "$.result.response.System.FrameCollection.Frame.Enet.MacAddress"
        over_temp: "$.result.response.System.FrameCollection.Frame.SysCard.OverTemp"
        fan_warn: "$.result.response.System.FrameCollection.Frame.SysCard.FanWarn"
      state:
        frame.name: "{name}"
        frame.version: "{version}"
        frame.os_version: "{os_version}"
        frame.type: "{frame_type}"
        frame.type_name: "{frame_type_name}"
        frame.ip: "{ip}"
        frame.mac: "{mac}"
        frame.over_temp: { value: "{over_temp}", map: { "0": false, "1": true } }
        frame.fan_warning: { value: "{fan_warn}", map: { "0": false, "1": true } }

    # getFrameSettings: the cards in the frame's slots, keyed by CardID.
    - path: "^/$"
      json_each: "$.result.response.System.FrameCollection.Frame.Slot"
      json: { card: "$.Card.CardID", status: "$.Card.CardStatusLabel", type: "$.Card.CardTypeLabel" }
      state:
        "cards.{card}.status": "{status}"
        "cards.{card}.type": "{type}"

    # listDestinations: screen destinations.
    - path: "^/$"
      json_each: "$.result.response.ScreenDestination"
      json: { id: "$.id", name: "$.Name", width: "$.HSize", height: "$.VSize" }
      state:
        "screens.{id}.name": "{name}"
        "screens.{id}.width": "{width}"
        "screens.{id}.height": "{height}"

    # listDestinations: aux destinations.
    - path: "^/$"
      json_each: "$.result.response.AuxDestination"
      json: { id: "$.id", name: "$.Name", mode: "$.AuxStreamMode" }
      state:
        "aux.{id}.name": "{name}"
        "aux.{id}.stream_mode": "{mode}"

    # listAuxContent: the only reply with PvwLastSrcIndex and PgmLastSrcIndex.
    - path: "^/$"
      json: { id: "$.result.response.id", pvw: "$.result.response.PvwLastSrcIndex", pgm: "$.result.response.PgmLastSrcIndex" }
      state:
        "aux.{id}.preview_source": "{pvw}"
        "aux.{id}.program_source": "{pgm}"

    # listContent: whether the screen destination is active (Doc 8.2, Encore3).
    - path: "^/$"
      json: { id: "$.result.response.id", active: "$.result.response.IsActive" }
      state:
        "screens.{id}.active": { value: "{active}", map: { "0": false, "1": true } }

    # listSources: the only list whose elements hold InputCfgVideoStatus.
    - path: "^/$"
      json_each: "$.result.response"
      json: { id: "$.id", status: "$.InputCfgVideoStatus", freeze: "$.Freeze", src_type: "$.SrcType" }
      state:
        "sources.{id}.video_status":
          value: "{status}"
          map: { "0": invalid, "1": valid, "2": format_mismatch, "3": out_of_range, "4": no_sync }
        "sources.{id}.frozen": { value: "{freeze}", map: { "0": false, "1": true } }
        "sources.{id}.type": { value: "{src_type}", map: { "0": input, "1": still } }

    # listInputs (Doc 8.2, Encore3): the only list whose elements hold SyncStatus.
    - path: "^/$"
      json_each: "$.result.response"
      json: { id: "$.id", sync: "$.SyncStatus" }
      state:
        "inputs.{id}.sync_status": "{sync}"

    # listStill: the only list whose elements hold StillState and FileSize.
    - path: "^/$"
      json_each: "$.result.response"
      json: { id: "$.id", state: "$.StillState.$t", size: "$.FileSize.$t", width: "$.HSize.$t", height: "$.VSize.$t" }
      state:
        "stills.{id}.state": "{state}"
        "stills.{id}.file_size_kb": "{size}"
        "stills.{id}.width": "{width}"
        "stills.{id}.height": "{height}"

    # listOperators: the only list whose elements hold Enable, StartRange, EndRange.
    - path: "^/$"
      json_each: "$.result.response"
      json: { id: "$.id", enable: "$.Enable", start: "$.StartRange", end: "$.EndRange" }
      state:
        "operators.{id}.enabled": { value: "{enable}", map: { "0": false, "1": true } }
        "operators.{id}.preset_start": "{start}"
        "operators.{id}.preset_end": "{end}"

state:
  frame.name: { type: string, description: "Frame name (getFrameSettings Frame.Name)" }
  frame.version: { type: string, description: "Event Master software version on the frame" }
  frame.os_version: { type: string, description: "Operating system version on the frame" }
  frame.type: { type: int, description: "Frame type: 0 E2, 1 S3, 2 EX, 3 IP-4K, 5 E2-Gen2, 6 PDS-4K, 8 Encore3" }
  frame.type_name: { type: string, description: "Frame type name, such as E2, S3, Ex or Encore3" }
  frame.ip: { type: string, description: "Frame IP address" }
  frame.mac: { type: string, description: "Frame MAC address" }
  frame.over_temp: { type: bool, description: "System card over-temperature flag (Encore3 document)" }
  frame.fan_warning: { type: bool, description: "System card fan warning flag (Encore3 document)" }
  cards.*.status: { type: string, description: "Card status label (Ready, Not Installed, ...), keyed by the card's CardID" }
  cards.*.type: { type: string, description: "Card type label (HDMI 2.0 Input, VPU Scaler, ...), keyed by the card's CardID" }
  screens.*.name: { type: string, description: "Screen destination name, keyed by its 0-based id" }
  screens.*.width: { type: int, unit: px, description: "Screen destination width" }
  screens.*.height: { type: int, unit: px, description: "Screen destination height" }
  screens.*.active: { type: bool, description: "Screen destination is active (listContent IsActive)" }
  aux.*.name: { type: string, description: "Aux destination name, keyed by its 0-based id" }
  aux.*.stream_mode: { type: int, description: "Aux destination AuxStreamMode, as the processor reports it" }
  aux.*.preview_source: { type: int, description: "Source id in the aux destination's preview (listAuxContent)" }
  aux.*.program_source: { type: int, description: "Source id in the aux destination's program (listAuxContent)" }
  sources.*.video_status: { type: string, description: "Input video status: valid, invalid, format_mismatch, out_of_range or no_sync" }
  sources.*.frozen: { type: bool, description: "Source is frozen" }
  sources.*.type: { type: string, description: "Source type: input or still" }
  inputs.*.sync_status: { type: string, description: "Input sync status as the processor words it (listInputs SyncStatus)" }
  stills.*.state: { type: int, description: "Still state (StillState), 0 to 4: capturing, ready or deleting; the document does not name each value" }
  stills.*.file_size_kb: { type: float, unit: kB, description: "Still file size" }
  stills.*.width: { type: int, unit: px, description: "Still width" }
  stills.*.height: { type: int, unit: px, description: "Still height" }
  operators.*.enabled: { type: bool, description: "Multi-operator profile enabled" }
  operators.*.preset_start: { type: int, description: "First preset serial number in the operator's range" }
  operators.*.preset_end: { type: int, description: "Last preset serial number in the operator's range" }

quirks:
  - models: [all]
    severity: info
    text: >
      Requests go to the fixed port 9999 as HTTP POST with Content-Type
      application/json (Encore3 v10.0 p.1; R5919184/00 2.1). The documents give
      no request path ("HTTP:// followed by the request URL with port 9999");
      the root path / is used. The Encore3 document announces a secure port
      9997 for a future release; it is not used here.

  - models: [all]
    severity: warning
    text: >
      In a linked system (master/slave, or host and clients on Encore3), JSON
      must be sent to the master (host) unit. Requests, method names and
      parameter names are case sensitive.

  - models: [all]
    severity: warning
    text: >
      Failures arrive in a 200 reply: result.success other than 0 is an
      error, and a JSON-RPC error member comes with a null result (Doc 8.2 and
      Encore3 v10.0 p.2). Every command therefore requires
      $.result.success = 0. The documents list no error codes or messages.

  - models: [all]
    severity: info
    text: >
      Destination, layer, source, still, cue, user key and preset ids are the
      processor's 0-based indexes, as the list commands return them. A preset
      id is not its serial number: "Preset3.00" can have id 0 and presetSno 3.00.
      Serial numbers are sent with two decimals; the documents say 1.1 and 1.10
      are the same and recommend no more than two decimal places. A still file
      id N creates StillStore N+1.

  - models: [all]
    severity: info
    text: >
      activatePreset recalls to preview unless type is 1 (program). The
      by-name form is documented without type, so activate_preset_by_name
      always recalls to preview. recall_next_preset fails when no preset has
      been recalled yet or the last one recalled is the last in the list.

  - models: [all]
    severity: warning
    text: >
      With one or more operators enabled (multi-operator mode), cut, allTrans,
      savePreset, activatePreset and deletePreset need operatorId 0 to 2 (the
      _as_operator commands) or the super operator password (the
      _as_super_operator commands, which send the super_operator_password
      setting). cut and allTrans then act only on that operator's
      destinations. The plain commands are for systems with no operator enabled.

  - models: [all]
    severity: warning
    text: >
      activateDestGroup by name is documented with the key destGrName in its
      parameter list and destGrpName in its example. The example's destGrpName
      is sent; which key the processor accepts is not settled by the documents.

  - models: [all]
    severity: info
    text: >
      The user key list method is headed listUserKey in both documents but its
      example calls listUserKeys, which is what is sent; both documents also
      give its response as null, an apparent copy error. recallUserKey's name
      key is userkeyName in the examples and userKeyName in the Encore3
      parameter list; the examples' spelling is sent.

  - models: [all]
    severity: info
    text: >
      Shapes the documents leave open: powerStatus's response is written as
      {FrameId1:{PwrStatus1, PwrStatus2}, ...}, which is not JSON, so
      get_power_status returns the response unchanged; listCues returns an
      "Array of cue objects" with no fields given. Test pattern numbers are
      not listed: the examples name 3 (100% colour bars) and 5 (32x32 grid),
      and 0 is off.

  - models: [all]
    severity: info
    text: >
      Partial changeContent: the Encore3 document says Mask must be sent
      separately from Window and LastSrcIdx, hence set_layer_mask and
      change_layer_source are separate. PvwMode 1 puts the change in preview
      (the default) and PgmMode 1 in program. change_content takes the
      documented params object for backgrounds (BGLyr), Source cropping and
      several layers at once.

  - models: [all]
    severity: warning
    text: >
      State is limited to replies the core can tell apart. Every method shares
      one URL, and telemetry rules are matched by URL, so a reply is
      recognised only by fields no other reply holds. Source, preset, cue,
      still, operator and user key names and the layers in a screen are not
      tracked as state, because those replies share their field names (id,
      Name) with others; read them with the list commands, whose value is the
      whole list.

  - models: [e2, s3-4k, ex]
    severity: warning
    text: >
      subscribe makes the processor POST notifications such as {result:
      {method: "notification", notificationType: "ScreenDestChanged", change:
      {add: [2], remove: [], update: [0, 1, 2]}}} to http://hostname:port/.
      The core runs no HTTP server for them, so it polls instead; the commands
      are here for installations that run their own receiver. Subscriptions
      are lost when the processor restarts. The document's example sends the
      port as a string ("3000"), which is how it is sent.

  - models: [e2, s3-4k, ex]
    severity: critical
    text: >
      reset_frame codes 1 to 4 are factory resets and 5 powers the processor
      down; nothing asks for confirmation.

  - models: [encore3]
    severity: critical
    text: >
      reset_frame_encore3 codes 1 and 2 are factory resets, 3 powers the
      processor down, and factory_reset_keep is a factory reset that keeps
      only the chosen setting. Encore3 numbers its resets differently from E2,
      S3-4K and EX (0 soft, 1 factory, 2 factory and keep with saveOptions, 3
      power down), hence the separate commands.

  - models: [encore3]
    severity: warning
    text: >
      API calls can be blocked by the Encore3's security settings (Encore3
      User guide 6.5.1, front panel and web page Security). getFrameSettings
      reports an ApiExtControl flag in its example; the document does not say
      what it means.

  - models: [encore3]
    severity: warning
    text: >
      The Encore3 JSON document (v10.0) is marked preliminary in its metadata.
      It omits methods the E2/S3/EX documents have (3dControl, 3dControlOutput,
      super destination methods, subscribe and unsubscribe, cue and
      destination group recall by name or serial number, background sources in
      listSources, takeStill and freezeDestSource), so those are not listed for
      Encore3. It adds DestOutMap (a screen destination's output index) to
      listContent, changeContent, fillHV, clearLayers and recallUserKey, MVR
      presets, and a multiviewer number on mvrLayoutChange.

  - models: [all]
    severity: info
    text: >
      listSourceMainBackup's inputType differs: on E2, S3-4K and EX it is -1
      all, 0 inputs, 1 backgrounds (Doc 8.2); on Encore3 it is -1 all or an
      input id 0-99 (Encore3 v10.0). mvrLayoutChange takes layouts 0-3 on E2,
      S3-4K and EX, and a multiviewer 0-1 with layouts 0-9 on Encore3.
      clearLayers is documented for Custom mode only (Doc 8.2).

  - models: [all]
    severity: info
    text: >
      takeStill fails if the source id given is a destination's. Pause and
      stop are documented both with a cue id (activate_cue) and with type
      alone (cue_transport); what type alone applies to is not explained.
