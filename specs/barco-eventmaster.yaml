               configure_operator, change_mvr_layout_encore3, list_mvr_presets, activate_mvr_preset]
    verification: none
    notes: >
      Third-generation Event Master processor, sold as Encore3 and often called E3. getFrameSettings reports FrameType 8. Commands are those of Barco's Encore3 JSON document (v10.0), which differs from the E2/S3/EX documents in several places; see the quirks.

commands:
  # ── System ────────────────────────────────────────────────────────────────
  get_frame_settings:
    summary: "System and frame information: name, software version, frame type, network settings, cards (R5919184/00 getFrameSettings)"
    send: { method: POST, path: /, body: '{"params":{},"method":"getFrameSettings","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 }, json_path: "$.result.response" }
    returns: value

  get_power_status:
    summary: "Power supply status of each frame, 0 not present to 3 OK (R5919184/00 powerStatus)"
    send: { method: POST, path: /, body: '{"params":{},"method":"powerStatus","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 }, json_path: "$.result.response" }
    returns: value

  reset_frame:
    summary: "Reset: 0 soft reset, 1 factory reset, 2 factory reset keeping IP, 3 keeping IP and EDID, 4 keeping VPID, 5 power down (R5919184/00 resetFrameSettings)"
    params:
      reset: { type: int, min: 0, max: 5, required: true }
    send: { method: POST, path: /, body: '{"params":{"reset":{reset}},"method":"resetFrameSettings","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  reset_frame_encore3:
    summary: "Reset: 0 soft reset, 1 factory reset, 2 factory reset and keep all, 3 power down (Encore3 v10.0 resetFrameSettings)"
    params:
      reset: { type: int, min: 0, max: 3, required: true }
    send: { method: POST, path: /, body: '{"params":{"reset":{reset}},"method":"resetFrameSettings","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  factory_reset_keep:
    summary: "Factory reset and keep: 0 all, 1 IP settings, 2 input EDIDs, 3 unit ID, 4 system native rate (Encore3 v10.0 resetFrameSettings reset 2 with saveOptions)"
    params:
      keep: { type: int, min: 0, max: 4, required: true }
    send: { method: POST, path: /, body: '{"params":{"reset":2,"saveOptions":{keep}},"method":"resetFrameSettings","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  # ── Transitions ───────────────────────────────────────────────────────────
  all_trans:
    summary: "Transition every armed destination from preview to program at its own rate (R5919184/00 allTrans)"
    send: { method: POST, path: /, body: '{"params":{},"method":"allTrans","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  all_trans_time:
    summary: "Transition every armed destination with this transition time in frames (Doc 8.2, Encore3 v10.0 allTrans transTime)"
    params:
      frames: { type: int, min: 0, required: true }
    send: { method: POST, path: /, body: '{"params":{"transTime":{frames}},"method":"allTrans","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  all_trans_as_operator:
    summary: "allTrans on the destinations of one operator, 0 to 2, in multi-operator mode (Doc 8.2, Encore3 v10.0 allTrans operatorId)"
    params:
      operator: { type: int, min: 0, max: 2, required: true }
    send: { method: POST, path: /, body: '{"params":{"operatorId":{operator}},"method":"allTrans","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  all_trans_as_super_operator:
    summary: "allTrans as the super operator, with the super operator password setting (Doc 8.2, Encore3 v10.0 allTrans password)"
    send: { method: POST, path: /, body: '{"params":{"password":{settings.super_operator_password:json}},"method":"allTrans","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  cut:
    summary: "Cut every armed destination from preview to program (R5919184/00 cut)"
    send: { method: POST, path: /, body: '{"params":{},"method":"cut","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  cut_as_operator:
    summary: "Cut on the destinations of one operator, 0 to 2, in multi-operator mode (Doc 8.2, Encore3 v10.0 cut operatorId)"
    params:
      operator: { type: int, min: 0, max: 2, required: true }
    send: { method: POST, path: /, body: '{"params":{"operatorId":{operator}},"method":"cut","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  cut_as_super_operator:
    summary: "Cut as the super operator, with the super operator password setting (Doc 8.2, Encore3 v10.0 cut password)"
    send: { method: POST, path: /, body: '{"params":{"password":{settings.super_operator_password:json}},"method":"cut","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  # ── Presets ───────────────────────────────────────────────────────────────
  list_presets:
    summary: "Presets, all or those containing a destination: -2 excludes that destination type, -1 any, 0-999 that destination (R5919184/00 listPresets)"
    params:
      screen: { type: int, min: -2, max: 999, default: -1 }
      aux: { type: int, min: -2, max: 999, default: -1 }
    send: { method: POST, path: /, body: '{"params":{"ScreenDest":{screen},"AuxDest":{aux}},"method":"listPresets","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 }, json_path: "$.result.response" }
    returns: value

  list_destinations_for_preset:
    summary: "The destinations a preset holds, -1 for every preset (R5919184/00 listDestinationsForPreset)"
    params:
      preset: { type: int, min: -1, max: 999, default: -1 }
    send: { method: POST, path: /, body: '{"params":{"id":{preset}},"method":"listDestinationsForPreset","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 }, json_path: "$.result.response" }
    returns: value

  save_preset:
    summary: "Save the selected destinations' previews as a new preset with this name (R5919184/00 savePreset)"
    params:
      name: { type: string, required: true }
    send: { method: POST, path: /, body: '{"params":{"presetName":{name:json}},"method":"savePreset","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  save_preset_numbered:
    summary: "Save a preset at this serial number (overwriting it), from preview or program (Doc 8.2, Encore3 v10.0 savePreset serialNo, saveFromProgram)"
    params:
      name: { type: string, required: true }
      serial: { type: float, min: 0, required: true }
      from_program: { type: bool, default: false }
    send: { method: POST, path: /, body: '{"params":{"presetName":{name:json},"serialNo":{serial:.2f},"saveFromProgram":{from_program:bool01}},"method":"savePreset","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  save_preset_as_operator:
    summary: "Save a preset as operator 0 to 2 in multi-operator mode (Doc 8.2, Encore3 v10.0 savePreset operatorId)"
    params:
      name: { type: string, required: true }
      operator: { type: int, min: 0, max: 2, required: true }
    send: { method: POST, path: /, body: '{"params":{"presetName":{name:json},"operatorId":{operator}},"method":"savePreset","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  save_preset_as_super_operator:
    summary: "Save a preset as the super operator (Doc 8.2, Encore3 v10.0 savePreset password)"
    params:
      name: { type: string, required: true }
    send: { method: POST, path: /, body: '{"params":{"presetName":{name:json},"password":{settings.super_operator_password:json}},"method":"savePreset","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  save_preset_custom:
    summary: "savePreset with a params object of the documented savePreset schema: presetName, ScreenDestination and AuxDestination arrays of {\"id\": n}, serialNo, saveFromProgram, operatorId or password (R5919184/00 savePreset)"
    params:
      params: { type: json, required: true }
    send: { method: POST, path: /, body: '{"params":{params},"method":"savePreset","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  rename_preset:
    summary: "Rename the preset with this id (R5919184/00 renamePreset id)"
    params:
      preset: { type: int, min: 0, max: 999, required: true }
      new_name: { type: string, required: true }
    send: { method: POST, path: /, body: '{"params":{"id":{preset},"newPresetName":{new_name:json}},"method":"renamePreset","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  rename_preset_by_serial:
    summary: "Rename the preset with this serial number (R5919184/00 renamePreset presetSno)"
    params:
      serial: { type: float, min: 0, required: true }
      new_name: { type: string, required: true }
    send: { method: POST, path: /, body: '{"params":{"presetSno":{serial:.2f},"newPresetName":{new_name:json}},"method":"renamePreset","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  rename_preset_by_name:
    summary: "Rename the preset with this name (R5919184/00 renamePreset presetName)"
    params:
      name: { type: string, required: true }
      new_name: { type: string, required: true }
    send: { method: POST, path: /, body: '{"params":{"presetName":{name:json},"newPresetName":{new_name:json}},"method":"renamePreset","id":"1234","jsonrpc":"2.0"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.result.success": 0 } }
    returns: ack

  delete_preset:
