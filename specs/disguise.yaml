  # ── Service API: media ───────────────────────────────────────────────────
  list_media:
    summary: Every file under a directory, recursively, with size and dates (media/list); the directory may use the path symbols {projects}, {rs-assets}, {rs-engines} and {project:<name>}
    params:
      directory: { type: string, max_length: 1024, required: true,
                   label: Directory,
                   description: "Absolute path of the directory, or a path symbol such as {projects} or {project:my-show}/objects/VideoFile, inside the d3 directories." }
    send: { method: GET, path: /api/service/media/list, query: { directory: "{directory}" } }
    expect: { status: 200, json_equals: { "$.status.code": 0 }, json_path: "$.files" }
    returns: value

  provision_media:
    summary: Copy or download a file to a path on this machine, such as into a project's objects folder (media/provision); returns the task started
    params:
      media_path: { type: string, max_length: 2048, required: true,
                    label: Source,
                    description: "The file to copy or download: a network share path or an HTTP URL reachable from the machine." }
      local_path: { type: string, max_length: 1024, required: true,
                    label: Destination,
                    description: "Where to put it, inside the d3 directories, with a path symbol such as {project:my-show}/objects/VideoFile/clip.mov." }
    send: { method: POST, path: /api/service/media/provision, body: '{"mediaPath":{media_path:json},"localPath":[{local_path:json}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 }, json_path: "$.result" }
    returns: value

  provision_media_transfers:
