        - { method: GET, path: /api/session/mixedreality/cameras }
    - path: "^/api/session/mixedreality/(captureobservation|enableobservations|deleteobservations|deleteallobservations)$"
      json_match: { "$.status.code": "^0$" }
      json: {}
      then_send:
        - { method: GET, path: /api/session/mixedreality/captureprogress }
        - { method: GET, path: /api/session/mixedreality/spatialcalibrations }
    # QuickCal reference points, keyed by uid.
    - path: "^/api/session/quickcal/referencepoints$"
      json_match: { "$.result": "^\\[" }
      replace: quickcal.reference_points
      json_each: "$.result"
      json: { uid: "$.uid", name: "$.name" }
      state:
        quickcal.reference_points.{uid}: "{name}"
    # OmniCal: camera discovery, plans, and the RigCheck and its Results.
    - path: "^/api/session/omnical/cameradiscovery$"
      json_match: { "$.status.code": "^0$" }
      json: { enabled: "$.enabled", discovery: "$.discovery" }
      state:
        omnical.camera_discovery: "{enabled}"
        omnical.camera_discovery_state: "{discovery}"
    - path: "^/api/session/omnical/currentplan$"
      json_match: { "$.status.code": "^0$" }
      json: { name: "$.plan.name", uid: "$.plan.uid" }
      state:
        omnical.current_plan: "{name}"
        omnical.current_plan_uid: "{uid}"
    - path: "^/api/session/omnical/plans$"
      json_match: { "$.plans": "^\\[" }
      replace: omnical.plans
      json_each: "$.plans"
      json: { uid: "$.uid", name: "$.name" }
      state:
        omnical.plans.{uid}: "{name}"
    - path: "^/api/session/omnical/rigcheck/checkresult$"
      json_match: { "$.result.status": "^(.+)$" }
      json:
        feedback: "$.result.feedback"
        score: "$.result.omniCalScore"
        camera: "$.result.cameraRmsError"
        projector: "$.result.projectorRmsError"
        message: "$.status.message"
      state:
        omnical.rigcheck.status: "{1}"
        omnical.rigcheck.feedback: "{feedback}"
        omnical.rigcheck.score: "{score}"
        omnical.rigcheck.camera_rms_error: "{camera}"
        omnical.rigcheck.projector_rms_error: "{projector}"
        omnical.rigcheck.progress: "{message}"
    - path: "^/api/session/omnical/rigcheck/currentresult$"
      json_match: { "$.status.code": "^0$" }
      json: { name: "$.result.name", uid: "$.result.uid" }
      state:
        omnical.current_result: "{name}"
        omnical.current_result_uid: "{uid}"
    - path: "^/api/session/omnical/rigcheck/currentfallbackresult$"
      json_match: { "$.status.code": "^0$" }
      json: { name: "$.result.name", uid: "$.result.uid" }
      state:
        omnical.fallback_result: "{name}"
        omnical.fallback_result_uid: "{uid}"
    - path: "^/api/session/omnical/rigcheck/results$"
      json_match: { "$.results": "^\\[" }
      replace: omnical.results
      json_each: "$.results"
      json: { uid: "$.uid", name: "$.name" }
      state:
        omnical.results.{uid}: "{name}"
    # A RigCheck command is read back (set_omnical_camera_discovery's own
    # answer carries the new discovery state).
    - path: "^/api/session/omnical/rigcheck/(executeplan|acceptresult|revertresult|deleteoldresults)$"
      json_match: { "$.status.code": "^0$" }
      json: {}
      then_send:
        - { method: GET, path: /api/session/omnical/rigcheck/checkresult }
        - { method: GET, path: /api/session/omnical/rigcheck/currentresult }
        - { method: GET, path: /api/session/omnical/rigcheck/currentfallbackresult }
        - { method: GET, path: /api/session/omnical/rigcheck/results }
    # Service API: the machines on the network, keyed by host name.
    - path: "^/api/service/system/detectsystems$"
      json_match: { "$.result": "^\\[" }
      replace: service.systems
      json_each: "$.result"
      json:
        host: "$.hostname"
        type: "$.type"
        major: "$.version.major"
        minor: "$.version.minor"
        hotfix: "$.version.hotfix"
        revision: "$.version.revision"
        project: "$.runningProject"
        ip: "$.ipAddress"
        designer: "$.isDesignerRunning"
        service: "$.isServiceRunning"
        manager: "$.isManagerRunning"
        notch: "$.isNotchHostRunning"
      state:
        service.systems.{host}.type: "{type}"
        service.systems.{host}.version: "{major}.{minor}.{hotfix}.{revision}"
        service.systems.{host}.running_project: "{project}"
        service.systems.{host}.ip_address: "{ip}"
        service.systems.{host}.designer_running: "{designer}"
        service.systems.{host}.service_running: "{service}"
        service.systems.{host}.manager_running: "{manager}"
        service.systems.{host}.notch_host_running: "{notch}"
    - path: "^/api/service/system/osinfo$"
      json_match: { "$.result": "^\\[" }
      replace: service.os
      json_each: "$.result"
      json: { host: "$.hostname", windows: "$.windowsVersion", image: "$.imageVersion" }
      state:
        service.os.{host}.windows_version: "{windows}"
        service.os.{host}.image_version: "{image}"
    - path: "^/api/service/system/networkadapters$"
      json_match: { "$.result": "^\\[" }
      replace: service.adapters
      json_each: "$.result[*].netAdapters"
      json:
        host: "$^.hostname"
        name: "$.name"
        mac: "$.mac"
        enabled: "$.enabled"
        dhcp: "$.dhcp"
        status: "$.status"
        addresses: "$.addresses"
      state:
        service.adapters.{host}.{index}.name: "{name}"
        service.adapters.{host}.{index}.mac: "{mac}"
        service.adapters.{host}.{index}.enabled: "{enabled}"
        service.adapters.{host}.{index}.dhcp: "{dhcp}"
        service.adapters.{host}.{index}.status: "{status}"
        service.adapters.{host}.{index}.addresses: "{addresses}"
    - path: "^/api/service/system/gpuoutputs$"
      json_match: { "$.result": "^\\[" }
      replace: service.gpu
      json_each: "$.result"
      json: { host: "$.hostname", frequency: "$.genlock.frequency" }
      state:
        service.gpu.{host}.genlock_frequency: "{frequency}"
    - path: "^/api/service/system/gpuoutputs$"
      json_each: "$.result[*].gpuOutputs"
      json:
        host: "$^.hostname"
        port: "$.gpuPort"
        genlock: "$.genlockState"
        emulated: "$.emulated"
        width: "$.resolution.width"
        height: "$.resolution.height"
        rate: "$.refreshRate"
        depth: "$.bitDepth"
        colour: "$.colourFormat"
      state:
        service.gpu.{host}.outputs.{index}.gpu_port: "{port}"
        service.gpu.{host}.outputs.{index}.genlock_state: "{genlock}"
        service.gpu.{host}.outputs.{index}.emulated: "{emulated}"
        service.gpu.{host}.outputs.{index}.width: "{width}"
        service.gpu.{host}.outputs.{index}.height: "{height}"
        service.gpu.{host}.outputs.{index}.refresh_rate: "{rate}"
        service.gpu.{host}.outputs.{index}.bit_depth: "{depth}"
        service.gpu.{host}.outputs.{index}.colour_format: "{colour}"
    - path: "^/api/service/system/projects$"
      json_match: { "$.result": "^\\[" }
      replace: service.projects
      json_each: "$.result"
      json: { host: "$.hostname", last: "$.lastProject" }
      state:
        service.projects.{host}.last_project: "{last}"
    - path: "^/api/service/system/projects$"
      json_each: "$.result[*].projects"
      json:
        host: "$^.hostname"
        path: "$.path"
        modified: "$.lastModified"
        major: "$.version.major"
        minor: "$.version.minor"
        hotfix: "$.version.hotfix"
        revision: "$.version.revision"
      state:
        service.projects.{host}.projects.{index}.path: "{path}"
        service.projects.{host}.projects.{index}.last_modified: "{modified}"
        service.projects.{host}.projects.{index}.version: "{major}.{minor}.{hotfix}.{revision}"
    - path: "^/api/service/system/vfcs$"
      json_match: { "$.result": "^\\[" }
      replace: service.vfcs
      json_each: "$.result"
      json: { host: "$.hostname", backplane: "$.backplaneVersion" }
      state:
        service.vfcs.{host}.backplane: "{backplane}"
    - path: "^/api/service/system/vfcs$"
      json_each: "$.result[*].cards"
      json:
        host: "$^.hostname"
        slot: "$.slot"
        type: "$.type"
        firmware: "$.firmwareVersion"
        fpga: "$.fpgaVersion"
        split: "$.splitMode"
        generation: "$.generation"
        ports: "$.ports"
      state:
        service.vfcs.{host}.cards.{index}.slot: "{slot}"
        service.vfcs.{host}.cards.{index}.type: "{type}"
        service.vfcs.{host}.cards.{index}.firmware_version: "{firmware}"
        service.vfcs.{host}.cards.{index}.fpga_version: "{fpga}"
        service.vfcs.{host}.cards.{index}.split_mode: "{split}"
        service.vfcs.{host}.cards.{index}.generation: "{generation}"
        service.vfcs.{host}.cards.{index}.ports: "{ports}"
    # The media listing: the setting's directory every minute, or the
    # directory list_media last asked for.
    - path: "^/api/service/media/list\\?"
      json_match: { "$.files": "^\\[" }
      replace: media.files
      json_each: "$.files"
      json: { path: "$.path", size: "$.size", created: "$.creationDate", modified: "$.lastWriteDate" }
      state:
        media.files.{index}.path: "{path}"
        media.files.{index}.size: "{size}"
        media.files.{index}.created: "{created}"
        media.files.{index}.last_written: "{modified}"
    - path: "^/api/service/media/(provision|remove)$"
      json_match: { "$.status.code": "^0$" }
      json: {}
      then_send:
        - { method: GET, path: /api/service/media/list, query: { directory: "{settings.media_directory}" } }
    # Starting, quitting or restarting a project is read back from the
    # machine list.
    - path: "^/api/service/project/(startlocalproject|quitlocalproject|restartlocalproject|forcequitlocalproject)$"
      json_match: { "$.status.code": "^0$" }
      json: {}
      then_send:
        - { method: GET, path: /api/service/system/detectsystems }
        - { method: GET, path: /api/service/system/projects }
    # Live Update: proof of play, one dictionary of the clips playing now
    # and the last completed ones; each list replaces the last. The
    # dictionary names its own lists ('a', 'r'), so the subtree to replace is
    # rendered from the element and a transport's update, which has neither,
    # replaces nothing.
    - json_match: { "$.valuesChanged": "^\\[" }
      json_each: "$.valuesChanged"
      each_match: { "$.value.active": "^\\[" }
      json: { a: "$.value.a" }
      replace: proof_of_play.{a}
    - json_match: { "$.valuesChanged": "^\\[" }
      json_each: "$.valuesChanged[*].value.active"
      json:
        a: "$^.value.a"
        layer: "$.layerName"
        video: "$.videoName"
        played: "$.framesPlayed"
        total: "$.totalFrames"
        loops: "$.loopCount"
        complete: "$.completedFullPlayback"
        start: "$.startTime"
        end: "$.endTime"
      state:
        proof_of_play.{a}.{index}.layer: "{layer}"
        proof_of_play.{a}.{index}.video: "{video}"
        proof_of_play.{a}.{index}.frames_played: "{played}"
        proof_of_play.{a}.{index}.total_frames: "{total}"
        proof_of_play.{a}.{index}.loop_count: "{loops}"
        proof_of_play.{a}.{index}.complete: "{complete}"
        proof_of_play.{a}.{index}.start_time: "{start}"
        proof_of_play.{a}.{index}.end_time: "{end}"
    - json_match: { "$.valuesChanged": "^\\[" }
      json_each: "$.valuesChanged"
      each_match: { "$.value.recent": "^\\[" }
      json: { r: "$.value.r" }
      replace: proof_of_play.{r}
    - json_match: { "$.valuesChanged": "^\\[" }
      json_each: "$.valuesChanged[*].value.recent"
      json:
        r: "$^.value.r"
        layer: "$.layerName"
        video: "$.videoName"
        played: "$.framesPlayed"
        total: "$.totalFrames"
        loops: "$.loopCount"
        complete: "$.completedFullPlayback"
        start: "$.startTime"
        end: "$.endTime"
      state:
        proof_of_play.{r}.{index}.layer: "{layer}"
        proof_of_play.{r}.{index}.video: "{video}"
        proof_of_play.{r}.{index}.frames_played: "{played}"
        proof_of_play.{r}.{index}.total_frames: "{total}"
        proof_of_play.{r}.{index}.loop_count: "{loops}"
        proof_of_play.{r}.{index}.complete: "{complete}"
        proof_of_play.{r}.{index}.start_time: "{start}"
        proof_of_play.{r}.{index}.end_time: "{end}"
    # Live Update: the one subscribed property is a dictionary of the
    # transport's playback values.
    - json_match: { "$.valuesChanged": "^\\[" }
      json_each: "$.valuesChanged"
      each_match: { "$.value.playing": "^(true|false)$" }
      json:
        playing: "$.value.playing"
        time: "$.value.time"
        mode: "$.value.mode"
        track: "$.value.track"
        engaged: "$.value.engaged"
        volume: "$.value.volume"
        brightness: "$.value.brightness"
      state:
        live.playing: "{playing}"
        live.time: "{time}"
        live.play_mode: "{mode}"
        live.track: "{track}"
        live.engaged: "{engaged}"
        live.volume: "{volume}"
        live.brightness: "{brightness}"
    - json_match: { "$.error": "^(.+)$" }
      state: { live.error: "{1}" }

state:
  transports.*.name:               { type: string, description: "Transport name, keyed by the transport's uid" }
  transports.*.engaged:            { type: bool, description: "The transport is engaged (responds to control)" }
  transports.*.volume:             { type: float, description: "Transport volume, 0.0 to 1.0" }
  transports.*.brightness:         { type: float, description: "Transport brightness, 0.0 to 1.0" }
  transports.*.playmode:           { type: string, description: "Play mode: Play, PlaySection, Loop, Stop or NotSet" }
  transports.*.current_track:      { type: string, description: "Name of the transport's current track" }
  transports.*.receiving_timecode: { type: bool, description: "The transport is receiving timecode" }
  transports.*.setlist:            { type: string, description: "Name of the transport's set list" }
  multitransports.*.name:          { type: string, description: "Multitransport name, keyed by its uid" }
  multitransports.*.engaged:       { type: bool, description: "The multitransport is engaged" }
  multitransports.*.transports:    { type: string, description: "The uids of the multitransport's transports, as a JSON array" }
  active_transport.*.name:         { type: string, description: "A transport selected in Designer's state bar (every member when a multitransport is selected), keyed by uid" }
  tracks.*.name:                   { type: string, description: "Track name, keyed by the track's uid" }
  tracks.*.length:                 { type: float, unit: s, description: "Track length, as Designer reports it (seconds, which Designer also calls beats)" }
  tracks.*.crossfade:              { type: string, description: "Track crossfade mode: Off, Fade, TrackSection or Unknown" }
  setlists.*.name:                 { type: string, description: "Set list name, keyed by the set list's uid" }
  setlists.*.tracks.*.uid:         { type: string, description: "uid of the set list's track at this position, from 0" }
  setlists.*.tracks.*.name:        { type: string, description: "Name of the set list's track at this position, from 0" }
  annotations.*.notes:             { type: string, description: "A track's notes, keyed by the track's uid: a JSON array of {time, text}. Read for each transport's current track, and for any track get_annotations asks for" }
  annotations.*.tags:              { type: string, description: "A track's tags: a JSON array of {time, type (TC, MIDI or CUE), value}" }
  annotations.*.sections:          { type: string, description: "A track's sections: a JSON array of {time, index}" }
  machines.*.hostname:             { type: string, description: "Machine host name, keyed by machine name" }
  machines.*.running_as:           { type: string, description: "Name of the machine this one is running as: another's after it has taken over in a failover" }
  machines.*.average_fps:          { type: float, unit: fps, description: "Machine's average frame rate" }
  machines.*.video_dropped_frames: { type: float, description: "Dropped video frames reported by the machine" }
  machines.*.video_missed_frames:  { type: float, description: "Missed video frames reported by the machine" }
  machines.*.states.*.name:        { type: string, description: "A health indicator state of the machine, numbered from 0: its name" }
  machines.*.states.*.detail:      { type: string, description: "The health state's detail" }
  machines.*.states.*.category:    { type: string, description: "The health indicator it belongs to: connection, output, genlock or devices" }
  machines.*.states.*.severity:    { type: string, description: "Its severity: ready (or ok), warning, error, busy or offline" }
  notifications.*.*.summary:       { type: string, description: "A notification of a machine, keyed by machine name and numbered from 0: its summary" }
  notifications.*.*.detail:        { type: string, description: "The notification's detail" }
  project.path:                    { type: string, description: "Path of the running project" }
  project.version:                 { type: string, description: "Designer version, major.minor.hotfix.revision" }
  project.release_type:            { type: string, description: "Designer release type: Pro or Starter" }
  session.solo:                    { type: bool, description: "The project runs solo, on this machine alone rather than in a session" }
  session.director_dedicated:      { type: bool, description: "The Director only controls the actors and does not output to the stage" }
  session.director:                { type: string, description: "Name of the session's Director" }
  session.machines.*.role:         { type: string, description: "The machine's role in the session, keyed by machine name: director, actor or understudy" }
  session.machines.*.uid:          { type: string, description: "The machine's uid" }
  session.machines.*.hostname:     { type: string, description: "The machine's host name" }
