quirks:
  - models: [all]
    severity: warning
    text: >
      Send every request to the Director of a multi-machine session. The Session
      API (transports, status, failover) answers only while Designer runs a
      project; the Service API (systems, projects) answers whenever d3service
      runs. The API port is set in d3Manager, and 0 turns the API off. There is no
      authentication and no HTTPS: anyone who reaches the port has full control.
  - models: [all]
    severity: warning
    text: >
      A request that fails, in whole or in part, can still answer HTTP 200 with a
      non-zero status.code and its reasons in status.details, which every command
      here checks. The status codes are not listed by disguise; 4000 has been seen
      for a play mode a jump does not take (such as LoopSection).
  - models: [all]
    severity: info
    text: >
      Transports, tracks and machines are named here by name. Designer resolves a
      name to the first resource with it, and which comes first is not defined, so
      give every transport, track and machine a unique name. get_transports and the
      transports state give each transport's uid.
  - models: [all]
    severity: info
    text: >
      Some disguise examples write playMode with lower-case values (playsection)
      and an /api/v2 path; this spec follows the Swagger document: playmode, the
      values NotSet, Play, PlaySection, Loop and Stop, and /api/session. gototime
      takes seconds and gototimecode HH:MM:SS:FF, as Designer r34 has been seen to
      take them; the document gives no units. Volume and brightness outside 0 to 1
      are ignored by the Director.
  - models: [all]
    severity: warning
    text: >
      set_engaged false disengages a transport: it then ignores every control
      source, including timecode, OSC and this API's other commands, until engaged
      again.
  - models: [all]
    severity: critical
    text: >
      failover_machine and restore_machine change which machine outputs, at once.
      After a failover the understudy has to be restarted before it can act as
      understudy again.
  - models: [all]
    severity: critical
    text: >
      quit_project and restart_project stop the show output; force_quit_project
      ends the Designer process and loses unsaved changes. start_project with
      allow_upgrade upgrades a project saved by an older Designer, after which that
      version can no longer open it.
  - models: [all]
    severity: info
    text: >
      Live Update sends values by subscription id only. The subscription here asks
      for one property, a Python dictionary of the transport's playback values
      (player.playing, player.tRender, player.playMode, player.track, engaged,
      volume, brightness), so each update names its own fields. Those properties
      come from a third-party module tested on r34, not from disguise's pages, and
      a multitransport has no transport manager to subscribe to. Designer can
      accept the connection during start-up and not answer the websocket upgrade.
  - models: [all]
    severity: info
    text: >
      REST has no push and disguise discourages frequent polling. Transports,
      the active transport, machine health and notifications are read every 10
      seconds, with the notes, tags and sections of each transport's current
      track; the project, the session, the failover settings and understudy
      targets, tracks and set lists every minute. A command that succeeds has
      what it changed read back at once. The playhead of the transport named by
      live_transport comes over Live Update. Another track's annotations are
      read only when get_annotations asks for them.
  - models: [all]
    severity: info
    text: >
      API limits: the Session API cannot create, rename or edit transports,
      tracks, set lists or annotations, choose a transport's set list or the
      active transport, or change the failover timeout and presets; it reads
      them only. Those are edited in Designer. The understudy targets come keyed
      as Designer keys them, which disguise does not document, so they are kept
      whole as JSON text.
  - models: [all]
    severity: warning
    text: >
      change_indirection and change_indirections switch what every layer using
      the indirection shows, at once and on every machine. Indirections, and
      the resources each can point to, are read every 10 seconds; the API
      cannot create indirections or change which resources they offer.
  - models: [all]
    severity: critical
    text: >
      stop_renderstream_layer and restart_renderstream_layer take the layer's
      render nodes off the stage until the workload runs again;
      renderstream_failover_machine and renderstream_failover_pool move a
      workload to other machines and restart it. Every RenderStream layer, with
      its status and configuration, is read every 10 seconds, and cluster pools
      and assigners every minute. The API cannot create layers, change a layer's
      asset, pool, mappings or assigners, or edit pools and assigners: those are
      edited in Designer.
  - models: [all]
    severity: warning
    text: >
      The set_live_ commands change what a Sockpuppet patch outputs at once,
      over every source that drives it (an HTTP Sockpuppet patch is driven only
      through this API). Patches and their fields' latest values are read every
      10 seconds and after each live change; a timed float change keeps moving
      after it is read, so current_value lags it. The API cannot create patches
      or fields: they are set up in Designer. A patch is kept by its uid; a
      patch whose uid comes back empty is not kept.
  - models: [all]
    severity: warning
    text: >
      set_cdl replaces every value of the CDL at once, so a grade change sends
      all ten; read the others from the cdls state first. Slope, offset and power
      are sent as the x, y and z of a vector, taken here as red, green and blue,
      which disguise's document does not state. CDLs are read every minute and
      after each set_cdl; the API cannot create or delete them.
  - models: [all]
    severity: info
    text: >
      Notes here are Designer's note resources (the notes endpoints), not the
      notes on a track's timeline, which get_annotations reads and which the API
      cannot edit. set_note creates a note when none has the name; the API
      cannot delete one. Every note is read every minute, and a note read or
      written is kept at once. set_note takes the text as a JSON string, since a
      text parameter here cannot hold a line break.
  - models: [all]
    severity: info
    text: >
      record_shot always sends the slate and take with engage, since the request
      carries all four; send the recorder's current slate and take (from the
      shot_recorders state) to stop it without changing them. Shot recorders are
      read every 10 seconds and after each record_shot. take is sent as a
      decimal string, as the document's int64 is written in JSON.
  - models: [all]
    severity: critical
    text: >
      execute_python runs arbitrary Python in Designer, on its main thread, with
      full access to the project: it can change or delete anything, and a long
      script stalls Designer's output until it ends or Designer's
      pythonApiExecutionTimeout interrupts it. disguise does not support calling
      it often or during a show. Scripts are Python 2.7, wrapped in a function, so they cannot
      create globals or use "from x import *". Anyone who reaches the API port
      can run it: there is no authentication. register_python_module replaces a
      module of the same name. Nothing here reads state from Python: every
      state key comes from the documented endpoints. The script and module source
      are JSON strings, since a text parameter here cannot hold a line break.
  - models: [all]
    severity: critical
    text: >
      delete_observation and delete_all_observations cannot be undone through
      the API, and change a spatial calibration in use; select_mr_camera and
      select_spatial_calibration change what an MR set shows at once. Cameras,
      MR sets, spatial calibrations and capture progress are read every minute,
      and again after each of these commands. The API has no way to clear a
      camera override or to create cameras, sets or calibrations, and no
      calibration solve: those are done in Designer.
  - models: [all]
    severity: critical
    text: >
      line_up_current_pose, reset_lineup and overwrite_manual_calibration change a
      projector's calibration, and so the picture on the stage, at once;
      overwrite_manual_calibration replaces the manual values it copies over.
      The API lists no projectors, so a projector's calibration is not kept in
      state: get_projector_calibration reads it for a projector named by the
      caller. Reference points are read every minute. The units of a lineup
      position are not documented.
  - models: [all]
    severity: critical
    text: >
      execute_rigcheck recalibrates and realigns the projectors from the current
      OmniCal Plan, and revert_rigcheck_result switches the calibration in use:
      both change the picture on the stage. execute_rigcheck turns camera
      discovery on when it is off; discovery uses the Director's CPU and network
      and must be off during a show. A RigCheck takes a while: omnical.rigcheck
      shows Amber while it runs. The OmniCal state is read every minute, and the
      RigCheck at once after each RigCheck command. Compare Results by their OmniCal score
      only; the RMS errors vary between runs. QuickAlign adjustments are not
      available through the API.
  - models: [all]
    severity: info
    text: >
      The OmniCal endpoints are documented on disguise's OmniCal API page but are
      not in the Session Swagger document. Their plans, results and
      resultsforplan endpoints take a filter whose values the page does not
      list, so these commands send none.
  - models: [all]
    severity: critical
    text: >
      remove_media deletes files and folders on the machine at once, unlocking a
      file of the running project first, and cannot be undone. Both it and
      provision_media work inside the d3
      directories only ({projects}, {rs-assets}, {rs-engines}, {project:<name>});
      any other path, or one leaving them with "..", is refused as restricted.
      Path symbols are resolved only by the media endpoints.
  - models: [all]
    severity: info
    text: >
      Provisioning runs as a d3service task, whose progress d3service pushes on
      its Task Status websocket (/api/service/task/status); this spec keeps one
      push websocket, Live Update, so a task's progress is not followed: list
      media again once it should be done. The media listing of the directory in
      the media_directory setting is read every minute and after each provision
      or remove, and list_media's own answer replaces it too, so media.files is
      the last listing read. A large directory lists every file under it.
  - models: [all]
    severity: info
    text: >
      The Service API's machine lists (systems, OS, adapters, GPU outputs,
      projects and VFCs) are read every minute, keyed by host name: a host name
      holding a dot cannot be a state key and is left out. They are read-only:
      network, GPU and VFC settings are changed in d3Manager or the OS.
  - models: [all]
    severity: info
    text: >
      Proof of play comes over Live Update as one dictionary property of
      subsystem:ProofOfPlaySubsystem: the clips playing now (getRecords, called
      when it is a method, since disguise's page names it without brackets) and
      the last proof_of_play_recent completed playbacks (getRecentRecords), at
      most once a second. Each list is replaced whole. Live Update's set command,
      which writes any subscribed property, is not offered: the push websocket
      here carries no commands, and the Sockpuppet, sequencing and colour
      endpoints cover documented live control.
