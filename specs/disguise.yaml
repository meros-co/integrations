spec: 1
id: disguise
name: disguise Designer (Session and Service APIs)
vendor: disguise
category: playback

# Written over disguise's HTTP APIs, which disguise documents with complete
# Swagger documents: the Session API (/api/session, served by Designer while a
# project runs, sent to the Director) for transports and status, and the
# Service API (/api/service, served by d3service with or without a project)
# for systems and projects. Every reply is {"status": {"code", "message",
# "details"}, "result"}, and a request that fails in part still answers HTTP
# 200 with a non-zero status.code, so every command checks status.code.
# Transports and tracks are named by a Locator; this spec sends the name, which
# Designer resolves to the first resource of that name.
#
# The playhead and proof of play are pushed over the Live Update websocket on
# the same port, which carries values only by subscription id. Each
# subscription here asks for one property, a dictionary, so each update
# carries its own field names. Transport settings and machine health are read
# over REST every 10 seconds, sparingly, as disguise asks.
#
# OSC and MSC are not used: both need an event transport and a device created
# inside the project, with operator-chosen addresses, and drive one transport
# each; the REST API covers the same controls without that setup.

source:
  - title: d3 API, Session API (Swagger 2.0 document session.swagger.json, info.version 2.0.0, basePath /api/session)
    author: disguise
    url: https://developer.disguise.one/specs/session.swagger.json
    note: >
      Manufacturer document, retrieved 2026-10-02 and again 2026-10-07 (the
      current version), linked from https://developer.disguise.one/api/openapi/
      and rendered per area at https://developer.disguise.one/api/session/.
      Every path is used: colour cdl and cdls; failover applydefaultrouting,
      failovermachine, restoremachine, settings and understudytargets;
      mixedreality cameras, captureobservation, captureprogress,
      deleteallobservations, deleteobservations, enableobservations, mrsets,
      selectcamera, selectspatialcalibration and spatialcalibrations; note
      (GET, POST) and notes {start, count}; python execute and registermodule;
      quickcal lineupcurrentpose, overwritemanualcalibration,
      projectorcalibration, referencepoints and resetlineup; renderstream
      assigners, failover, failoverpool, layerconfig, layers, layerstatus,
      pools, restartlayers, startlayers, stoplayers and synclayers; sequencing
      changeindirections, indirectionresources and indirections; shotrecorder
      record and recorders; sockpuppet easingfunctions, live and patches. Transport paths
      play, playsection, playloopsection, stop, returntostart,
      gotonextsection, gotoprevsection, gotonexttrack, gotoprevtrack,
      gotosection, gototrack, gotonote, gototag, gototime, gotoframe,
      gototimecode, engaged, volume and brightness with their request bodies
      (the transports array, TransportLocator {uid, name}, playmode NotSet,
      Play, PlaySection, Loop, Stop; TagType TC, MIDI, CUE); GET
      activetransport, transports (transports and multitransports at the top
      level), tracks, setlists and annotations; status health, notifications,
      project, session and setguimode; failover settings, failovermachine and
      restoremachine. No securityDefinitions.
  - title: d3 API, Service API (Swagger 2.0 document service.swagger.json, info.version 2.0.0, basePath /api/service)
    author: disguise
    url: https://developer.disguise.one/specs/service.swagger.json
    note: >
      Manufacturer document, retrieved 2026-10-02 and again 2026-10-07 (the
      current version). Every path is used: system detectsystems, osinfo,
      networkadapters, gpuoutputs, projects and vfcs; media list, provision and
      remove (path an array of strings); project startlocalproject
      {projectPath, soloMode, allowUpgrade}, quitlocalproject,
      forcequitlocalproject and restartlocalproject.
  - title: disguise Developer Portal, "Error Handling", "Locator", "Working with Sessions", "Monitoring Machine Health"
    author: disguise
    url: https://developer.disguise.one/api/error-handling/
    note: >
      Manufacturer documents, retrieved 2026-10-02. The response envelope, status.code
      0 on success, HTTP 200 on partial failure; a Locator needs uid or name, uid
      wins when both are given and a name finds the first match; commands go to
      the Director; frequent REST polling is discouraged in favour of Live
      Update.
  - title: disguise Developer Portal, "Live Update API"
    author: disguise
    url: https://developer.disguise.one/api/session/liveupdate/
    note: >
      Manufacturer document, retrieved 2026-10-02. ws://<director>:<port>/api/session/liveupdate;
      {"subscribe": {"object", "properties", "configuration": {"updateFrequencyMs"}}};
      properties are Python expressions evaluated with object bound;
      {"valuesChanged": [{"id", "value", ...}]} on subscribing and on each
      change; dictionaries serialise as JSON objects.
  - title: disguise User Guide, "APIs Overview" (last updated 2026-08-11)
    author: disguise
    url: https://help.disguise.one/designer/apis/api-overview
    note: >
      Manufacturer document. TCP port 80 by default, set in d3Manager > Machine
      Settings > Advanced Network Configuration > API http port, 0 disabling the
      API; Session and Service APIs from r23.2; uid as a decimal or hex string.
  - title: companion-module-disguise-session (Light Art Studios GmbH, MIT licence)
    author: Light Art Studios GmbH
    url: https://github.com/Light-Art-Studios-GmbH/companion-module-disguise-session
    note: >
      Corroboration only, licence checked; its notes say it was verified against
      Designer r34.0.3. Used for the Live Update transport object
      transportmanager:<name> (spaces as underscores) and its properties
      player.playing, player.tRender, player.playMode, player.track, engaged,
      volume and brightness, which disguise's pages do not list; for gototime
      taking seconds and gototimecode HH:MM:SS:FF; and for status.code 4000 on a
      rejected play mode. No code taken.
  - title: disguise Developer Portal, "Python Execution API"
    author: disguise
    url: https://developer.disguise.one/python-api/execution-api
    note: >
      Manufacturer document, retrieved 2026-10-07. execute {moduleName, script}
      and registermodule {moduleName, contents}; Python 2.7 run as a function
      body on Designer's main thread with d3 imported; d3Log, pythonLog and
      returnValue; undo supported; pythonApiExecutionTimeout; not to be called
      often or during a show.
  - title: disguise Developer Portal, "OmniCal API"
    author: disguise
    url: https://developer.disguise.one/api/session/omnical/
    note: >
      Manufacturer document, retrieved 2026-10-07; not in the Session Swagger
      document. cameradiscovery (GET, and POST {enabled}), currentplan, plans,
      rigcheck/executeplan, checkresult, acceptresult, revertresult,
      currentresult, currentfallbackresult, results, resultsforplan and
      deleteoldresults; the RigCheck workflow, the Green, Amber and Red
      statuses, scores of 10000 while running, comparing by omniCalScore, and
      that discovery must be off during a show. The RequestPlansFilter values
      are not listed.
  - title: disguise Developer Portal, "Media" guide, "Media API" reference, "Paths" and "Task Status API"
    author: disguise
    url: https://developer.disguise.one/api/guides/media/
    note: >
      Manufacturer documents, retrieved 2026-10-07 (with
      https://developer.disguise.one/api/service/media-reference/,
      https://developer.disguise.one/api/paths/ and
      https://developer.disguise.one/api/service/tasks/). media/list
      ?directory, provision {mediaPath, localPath [..], transfers}, remove
      {path}; the path symbols {projects}, {rs-assets}, {rs-engines} and
      {project:<name>}, resolved by the media endpoints only; restricted paths
      refused; provisioning tasks followed on ws://<host>/api/service/task/status
      with policies.
  - title: disguise Developer Portal, "Proof of Play" and "Monitoring Machine Health"
    author: disguise
    url: https://developer.disguise.one/api/guides/proof-of-play/
    note: >
      Manufacturer documents, retrieved 2026-10-07 (with
      https://developer.disguise.one/api/guides/monitoring/). The Live Update
      object subsystem:ProofOfPlaySubsystem with object.getRecords (every clip
      playing) and object.getRecentRecords(n) (the last n completed, at most
      300, oldest first); the record fields layerName, videoName, framesPlayed,
      totalFrames, loopCount, completedFullPlayback, startTime, endTime and
      active. Frequent REST polling is discouraged; Live Update is advised for
      monitoring.

transport:
  type: http
  port: 80
  scheme: http
  auth: none
  timeout_ms: 5000
  probe: { method: GET, path: /api/service/system/osinfo }

settings:
  # The transport manager whose playhead Live Update reports, as Designer names
  # it with spaces written as underscores.
  live_transport: { type: string, pattern: "^[A-Za-z0-9_]+$", default: default,
                    label: Live transport,
                    description: "Transport manager whose playhead Live Update reports, as named in Designer with spaces written as underscores." }
  # How often, at most, Live Update sends a changed value, in milliseconds.
  live_update_ms: { type: int, min: 40, max: 10000, default: 250,
                    label: Live update interval,
                    description: "Shortest time in milliseconds between Live Update values for a changing property." }
  # The directory whose media listing is kept in state.
  media_directory: { type: string, max_length: 1024, default: "{projects}",
                     label: Media directory,
                     description: "Directory whose files are listed every minute into media.files, absolute or a path symbol such as {projects} or {project:my-show}/objects/VideoFile." }
  # How many completed proof of play records to keep.
  proof_of_play_recent: { type: int, min: 1, max: 300, default: 50,
                          label: Proof of play history,
                          description: "Number of most recently completed clip playbacks Live Update reports into proof_of_play.recent, at most 300." }

ports:
  - { port: 80, protocol: http, role: control }
  - { port: 80, protocol: ws, role: push }

models:
  - id: designer
    name: disguise Designer r23.2 and later (Director, Actor or solo; vx, gx, rx and EX servers and Designer software)
    supports: [play, play_section, loop_section, stop, return_to_start, next_section, previous_section,
               next_track, previous_track, go_to_section, go_to_track, go_to_note, go_to_tag, go_to_time,
               go_to_frame, go_to_timecode, set_engaged, set_volume, set_brightness,
               get_active_transport, get_transports, get_tracks, get_setlists, get_annotations,
               get_health, get_notifications, get_project, get_session, set_gui_mode,
               get_failover_settings, failover_machine, restore_machine, apply_default_routing,
               get_understudy_targets,
               detect_systems, get_os_info, get_network_adapters, get_gpu_outputs, get_projects,
               start_project, quit_project, restart_project, force_quit_project,
               get_indirections, get_indirection_resources, change_indirection, change_indirections,
               get_renderstream_layers, get_renderstream_layer_status, get_renderstream_layer_config,
               get_renderstream_pools, get_renderstream_assigners, start_renderstream_layer,
               stop_renderstream_layer, restart_renderstream_layer, sync_renderstream_layer,
               renderstream_failover_machine, renderstream_failover_pool,
               get_sockpuppet_patches, get_easing_functions, set_live_float, set_live_string,
               set_live_resource, send_live_changes,
               get_cdls, set_cdl,
               get_notes, get_note, set_note,
               get_shot_recorders, record_shot,
               execute_python, register_python_module,
               get_mr_cameras, get_mr_sets, get_spatial_calibrations, get_capture_progress, select_mr_camera,
               select_spatial_calibration, capture_observation, enable_observation, delete_observation,
               delete_all_observations,
               get_reference_points, get_projector_calibration, line_up_current_pose, reset_lineup,
               overwrite_manual_calibration,
               get_omnical_camera_discovery, set_omnical_camera_discovery, get_omnical_current_plan,
               get_omnical_plans, execute_rigcheck, get_rigcheck_result, accept_rigcheck_result,
               revert_rigcheck_result, get_rigcheck_current_result, get_rigcheck_fallback_result,
               get_rigcheck_results, get_rigcheck_results_for_plan, delete_old_rigcheck_results,
               get_vfcs, list_media, provision_media, provision_media_transfers, remove_media]
    verification: none

commands:
  # ── Transport: play modes ────────────────────────────────────────────────
  play:
    summary: Play a transport (POST /api/session/transport/play)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
    send: { method: POST, path: /api/session/transport/play, body: '{"transports":[{"name":{transport:json}}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  play_section:
    summary: Play a transport to the end of the current section (playsection)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
    send: { method: POST, path: /api/session/transport/playsection, body: '{"transports":[{"name":{transport:json}}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  loop_section:
    summary: Loop the current section of a transport (playloopsection)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
    send: { method: POST, path: /api/session/transport/playloopsection, body: '{"transports":[{"name":{transport:json}}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  stop:
    summary: Stop a transport (stop)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
    send: { method: POST, path: /api/session/transport/stop, body: '{"transports":[{"name":{transport:json}}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  return_to_start:
    summary: Return a transport to its start (returntostart)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
    send: { method: POST, path: /api/session/transport/returntostart, body: '{"transports":[{"name":{transport:json}}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  # ── Transport: jumps ─────────────────────────────────────────────────────
  # playmode NotSet leaves the play mode as it is after the jump.
  next_section:
    summary: Jump a transport to the next section (gotonextsection)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
      playmode:  { type: enum, values: [NotSet, Play, PlaySection, Loop, Stop], default: NotSet,
                   label: Play mode,
                   description: "Play mode after the jump: NotSet leaves it as it is, or Play, PlaySection (to the section's end), Loop (the section) or Stop." }
    send: { method: POST, path: /api/session/transport/gotonextsection, body: '{"transports":[{"transport":{"name":{transport:json}},"playmode":"{playmode}"}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  previous_section:
    summary: Jump a transport to the previous section (gotoprevsection)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
      playmode:  { type: enum, values: [NotSet, Play, PlaySection, Loop, Stop], default: NotSet,
                   label: Play mode,
                   description: "Play mode after the jump: NotSet leaves it as it is, or Play, PlaySection (to the section's end), Loop (the section) or Stop." }
    send: { method: POST, path: /api/session/transport/gotoprevsection, body: '{"transports":[{"transport":{"name":{transport:json}},"playmode":"{playmode}"}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  next_track:
    summary: Jump a transport to the start of the next track in its set list (gotonexttrack)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
      playmode:  { type: enum, values: [NotSet, Play, PlaySection, Loop, Stop], default: NotSet,
                   label: Play mode,
                   description: "Play mode after the jump: NotSet leaves it as it is, or Play, PlaySection (to the section's end), Loop (the section) or Stop." }
    send: { method: POST, path: /api/session/transport/gotonexttrack, body: '{"transports":[{"transport":{"name":{transport:json}},"playmode":"{playmode}"}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  previous_track:
    summary: Jump a transport to the start of the previous track in its set list (gotoprevtrack)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
      playmode:  { type: enum, values: [NotSet, Play, PlaySection, Loop, Stop], default: NotSet,
                   label: Play mode,
                   description: "Play mode after the jump: NotSet leaves it as it is, or Play, PlaySection (to the section's end), Loop (the section) or Stop." }
    send: { method: POST, path: /api/session/transport/gotoprevtrack, body: '{"transports":[{"transport":{"name":{transport:json}},"playmode":"{playmode}"}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  go_to_section:
    summary: Jump a transport to a section of the current track by its index, from 0 (gotosection)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
      section:   { type: int, min: 0, required: true,
                   label: Section,
                   description: "Section of the current track, numbered from 0." }
      playmode:  { type: enum, values: [NotSet, Play, PlaySection, Loop, Stop], default: NotSet,
                   label: Play mode,
                   description: "Play mode after the jump: NotSet leaves it as it is, or Play, PlaySection (to the section's end), Loop (the section) or Stop." }
    send: { method: POST, path: /api/session/transport/gotosection, body: '{"transports":[{"transport":{"name":{transport:json}},"section":"{section}","playmode":"{playmode}"}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  go_to_track:
    summary: Jump a transport to a track, by the track's name (gototrack)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
      track:     { type: string, max_length: 256, required: true,
                   label: Track,
                   description: "Track name as shown in Designer." }
      playmode:  { type: enum, values: [NotSet, Play, PlaySection, Loop, Stop], default: NotSet,
                   label: Play mode,
                   description: "Play mode after the jump: NotSet leaves it as it is, or Play, PlaySection (to the section's end), Loop (the section) or Stop." }
    send: { method: POST, path: /api/session/transport/gototrack, body: '{"transports":[{"transport":{"name":{transport:json}},"track":{"name":{track:json}},"playmode":"{playmode}"}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  go_to_note:
    summary: Jump a transport to the note with this text on the current track (gotonote)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
      note:      { type: string, max_length: 1024, required: true,
                   label: Note,
                   description: "Text of the note to jump to on the current track." }
      playmode:  { type: enum, values: [NotSet, Play, PlaySection, Loop, Stop], default: NotSet,
                   label: Play mode,
                   description: "Play mode after the jump: NotSet leaves it as it is, or Play, PlaySection (to the section's end), Loop (the section) or Stop." }
    send: { method: POST, path: /api/session/transport/gotonote, body: '{"transports":[{"transport":{"name":{transport:json}},"note":{note:json},"playmode":"{playmode}"}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  go_to_tag:
    summary: >
      Jump a transport to a tag: a CUE tag such as 1.2.5, a MIDI tag or a TC
      tag (gototag). allow_global also searches the other tracks of the set list.
    params:
      transport:    { type: string, max_length: 256, default: default,
                      label: Transport,
                      description: "Transport manager name as in Designer; default is the default transport." }
      type:         { type: enum, values: [CUE, MIDI, TC], default: CUE,
                      label: Tag type,
                      description: "Kind of tag: CUE, MIDI or TC (timecode)." }
      value:        { type: string, max_length: 64, required: true,
                      label: Tag,
                      description: "Tag value, e.g. 1.2.5 for a CUE tag." }
      allow_global: { type: bool, default: false,
                      label: Search all tracks,
                      description: "Whether to also search the other tracks of the set list." }
      playmode:     { type: enum, values: [NotSet, Play, PlaySection, Loop, Stop], default: NotSet,
                      label: Play mode,
                      description: "Play mode after the jump: NotSet leaves it as it is, or Play, PlaySection (to the section's end), Loop (the section) or Stop." }
    send: { method: POST, path: /api/session/transport/gototag, body: '{"transports":[{"transport":{"name":{transport:json}},"type":"{type}","value":{value:json},"allowGlobalJump":{allow_global},"playmode":"{playmode}"}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  go_to_time:
    summary: Jump a transport to a time on the current track, in seconds (gototime)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
      time:      { type: float, min: 0.0, required: true,
                   label: Time,
                   description: "Time on the current track in seconds." }
      playmode:  { type: enum, values: [NotSet, Play, PlaySection, Loop, Stop], default: NotSet,
                   label: Play mode,
                   description: "Play mode after the jump: NotSet leaves it as it is, or Play, PlaySection (to the section's end), Loop (the section) or Stop." }
    send: { method: POST, path: /api/session/transport/gototime, body: '{"transports":[{"transport":{"name":{transport:json}},"time":{time:.3f},"playmode":"{playmode}"}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  go_to_frame:
    summary: Jump a transport to a frame on the current track (gotoframe)
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
      frame:     { type: int, min: 0, required: true,
                   label: Frame,
                   description: "Frame on the current track, from 0." }
      playmode:  { type: enum, values: [NotSet, Play, PlaySection, Loop, Stop], default: NotSet,
                   label: Play mode,
                   description: "Play mode after the jump: NotSet leaves it as it is, or Play, PlaySection (to the section's end), Loop (the section) or Stop." }
    send: { method: POST, path: /api/session/transport/gotoframe, body: '{"transports":[{"transport":{"name":{transport:json}},"frame":"{frame}","playmode":"{playmode}"}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  go_to_timecode:
    summary: Jump a transport to a timecode, HH:MM:SS:FF (gototimecode); ignore_tags jumps without looking for a TC tag
    params:
      transport:   { type: string, max_length: 256, default: default,
                     label: Transport,
                     description: "Transport manager name as in Designer; default is the default transport." }
      timecode:    { type: string, pattern: "^[0-9]{2}:[0-5][0-9]:[0-5][0-9]:[0-9]{2}$", required: true,
                     label: Timecode,
                     description: "Timecode to jump to, HH:MM:SS:FF." }
      ignore_tags: { type: bool, default: false,
                     label: Ignore TC tags,
                     description: "Whether to jump straight to the time without looking for a TC tag." }
      playmode:    { type: enum, values: [NotSet, Play, PlaySection, Loop, Stop], default: NotSet,
                     label: Play mode,
                     description: "Play mode after the jump: NotSet leaves it as it is, or Play, PlaySection (to the section's end), Loop (the section) or Stop." }
    send: { method: POST, path: /api/session/transport/gototimecode, body: '{"transports":[{"transport":{"name":{transport:json}},"timecode":"{timecode}","ignoreTags":{ignore_tags},"playmode":"{playmode}"}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  # ── Transport: settings ──────────────────────────────────────────────────
  set_engaged:
    summary: Engage or disengage a transport (engaged); a disengaged transport ignores every control source
    params:
      transport: { type: string, max_length: 256, default: default,
                   label: Transport,
                   description: "Transport manager name as in Designer; default is the default transport." }
      engaged:   { type: bool, default: true,
                   label: Engaged,
                   description: "True engages the transport; a disengaged transport ignores every control source." }
