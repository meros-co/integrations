  # ── Sockpuppet: live parameter control ───────────────────────────────────
  get_sockpuppet_patches:
    summary: Every HTTP Sockpuppet patch with its fields, their kinds, ranges and options, and the latest value of each (sockpuppet/patches)
    send: { method: GET, path: /api/session/sockpuppet/patches }
    expect: { status: 200, json_equals: { "$.status.code": 0 }, json_path: "$.result" }
    returns: value

  get_easing_functions:
    summary: The easing functions a timed float change can use (sockpuppet/easingfunctions)
    send: { method: GET, path: /api/session/sockpuppet/easingfunctions }
    expect: { status: 200, json_path: "$.easingFunctions" }
    returns: value

  set_live_float:
    summary: Set a float field of a Sockpuppet patch live, at once or eased over a duration (sockpuppet/live)
    params:
      patch:    { type: string, max_length: 1024, required: true,
                  label: Patch address,
                  description: "Address of the HTTP Sockpuppet patch, as get_sockpuppet_patches lists it." }
      field:    { type: string, max_length: 256, required: true,
                  label: Field,
                  description: "Name of the field to set (not its display name)." }
      value:    { type: float, required: true,
                  label: Value,
                  description: "New value, within the field's min and max." }
      duration: { type: float, min: 0.0, default: 0.0,
                  label: Duration,
                  description: "Time in seconds to ease from the current value to the new one; 0 sets it at once." }
      easing:   { type: string, max_length: 64, default: "",
                  label: Easing,
                  description: "Easing function for a timed change, one of get_easing_functions; empty for Designer's default." }
    send: { method: POST, path: /api/session/sockpuppet/live, body: '{"patches":[{"address":{patch:json},"changes":[{"field":{field:json},"floatValue":{"value":{value:.6f},"duration":{duration:.3f},"easingFunction":{easing:json}}}]}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  set_live_string:
    summary: Set a text or option field of a Sockpuppet patch live (sockpuppet/live)
    params:
      patch: { type: string, max_length: 1024, required: true,
               label: Patch address,
               description: "Address of the HTTP Sockpuppet patch, as get_sockpuppet_patches lists it." }
      field: { type: string, max_length: 256, required: true,
               label: Field,
               description: "Name of the field to set (not its display name)." }
      value: { type: string, max_length: 4096, required: true,
               label: Value,
               description: "New text; for a field with options, one of them." }
    send: { method: POST, path: /api/session/sockpuppet/live, body: '{"patches":[{"address":{patch:json},"changes":[{"field":{field:json},"stringValue":{value:json}}]}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  set_live_resource:
    summary: Point a resource field of a Sockpuppet patch (a video clip, a mesh) at another resource, by its name (sockpuppet/live)
    params:
      patch:    { type: string, max_length: 1024, required: true,
                  label: Patch address,
                  description: "Address of the HTTP Sockpuppet patch, as get_sockpuppet_patches lists it." }
      field:    { type: string, max_length: 256, required: true,
                  label: Field,
                  description: "Name of the field to set (not its display name)." }
      resource: { type: string, max_length: 1024, required: true,
