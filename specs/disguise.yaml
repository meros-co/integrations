  renderstream.assigners.*.padding_pixels: { type: int, unit: px, description: "Padding around the assigner's tiles" }
  renderstream.assigners.*.network_ip:     { type: string, description: "Address of the assigner's preferred network" }
  renderstream.assigners.*.network:        { type: string, description: "Name of the assigner's preferred network" }
  sockpuppet.patches.*.address:     { type: string, description: "An HTTP Sockpuppet patch, keyed by its uid: the address the set_live_ commands name" }
