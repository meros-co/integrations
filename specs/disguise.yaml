  renderstream.status.*.t_now:     { type: float, unit: s, description: "The layer's reference time when the status was read" }
  renderstream.status.*.asset_errors: { type: string, description: "The layer's asset errors, as a JSON array of strings" }
  renderstream.status.*.instances.*.machine:        { type: string, description: "A workload instance, numbered from 0: the render node it runs on" }
