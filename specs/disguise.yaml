    summary: Set every value of a colour decision list, by its name (colour/cdl); the grade changes live at once
    params:
      cdl:        { type: string, max_length: 256, required: true,
                    label: CDL,
                    description: "Name of the CDL resource as shown in Designer." }
      slope_r:    { type: float, min: 0.0, default: 1.0, label: Slope red, description: "Red slope (gain), 1.0 for none." }
      slope_g:    { type: float, min: 0.0, default: 1.0, label: Slope green, description: "Green slope (gain), 1.0 for none." }
      slope_b:    { type: float, min: 0.0, default: 1.0, label: Slope blue, description: "Blue slope (gain), 1.0 for none." }
      offset_r:   { type: float, default: 0.0, label: Offset red, description: "Red offset (lift), 0.0 for none." }
      offset_g:   { type: float, default: 0.0, label: Offset green, description: "Green offset (lift), 0.0 for none." }
      offset_b:   { type: float, default: 0.0, label: Offset blue, description: "Blue offset (lift), 0.0 for none." }
      power_r:    { type: float, min: 0.0, default: 1.0, label: Power red, description: "Red power (gamma), 1.0 for none." }
      power_g:    { type: float, min: 0.0, default: 1.0, label: Power green, description: "Green power (gamma), 1.0 for none." }
      power_b:    { type: float, min: 0.0, default: 1.0, label: Power blue, description: "Blue power (gamma), 1.0 for none." }
      saturation: { type: float, min: 0.0, default: 1.0, label: Saturation, description: "Saturation, 1.0 for none and 0.0 for monochrome." }
    send: { method: POST, path: /api/session/colour/cdl, body: '{"cdl":{"name":{cdl:json},"slope":{"x":{slope_r:.6f},"y":{slope_g:.6f},"z":{slope_b:.6f}},"offset":{"x":{offset_r:.6f},"y":{offset_g:.6f},"z":{offset_b:.6f}},"power":{"x":{power_r:.6f},"y":{power_g:.6f},"z":{power_b:.6f}},"saturation":{saturation:.6f}}}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

