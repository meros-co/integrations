               label: Count,
               description: "Number of notes to return; 0 returns all of them." }
    send: { method: GET, path: /api/session/notes, query: { start: "{start}", count: "{count}" } }
    expect: { status: 200, json_equals: { "$.status.code": 0 }, json_path: "$.result" }
    returns: value

  get_note:
    summary: One note and its text, by the note's name (note)
    params:
      note: { type: string, max_length: 256, required: true,
              label: Note,
              description: "Name of the note resource as shown in Designer." }
    send: { method: GET, path: /api/session/note, query: { name: "{note}" } }
    expect: { status: 200, json_equals: { "$.status.code": 0 }, json_path: "$.result" }
    returns: value

  set_note:
    summary: Set a note's text, by the note's name, creating the note when there is none of that name (note)
    params:
      note: { type: string, max_length: 256, required: true,
              label: Note,
              description: "Name of the note resource as shown in Designer." }
      text: { type: json, required: true,
              label: Text,
              description: "The note's new text as a JSON string (line breaks as \\n), which replaces the old." }
    send: { method: POST, path: /api/session/note, body: '{"note":{"name":{note:json}},"text":{text}}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 }, json_path: "$.result" }
    returns: value

  # ── Shot recorder ────────────────────────────────────────────────────────
  get_shot_recorders:
    summary: Every shot recorder, whether it is recording, and its slate and take (shotrecorder/recorders)
    send: { method: GET, path: /api/session/shotrecorder/recorders }
    expect: { status: 200, json_equals: { "$.status.code": 0 }, json_path: "$.recorders" }
    returns: value

  record_shot:
    summary: Start (engage true) or stop (engage false) a shot recorder, by its name, with the slate and take to record under (shotrecorder/record)
    params:
      recorder: { type: string, max_length: 256, required: true,
                  label: Shot recorder,
                  description: "Name of the shot recorder as shown in Designer." }
      engage:   { type: bool, default: true,
                  label: Record,
                  description: "True starts recording; false stops it." }
      slate:    { type: string, max_length: 256, required: true,
                  label: Slate,
                  description: "Slate name the shot is recorded under; send the recorder's current slate to keep it." }
      take:     { type: int, min: 0, required: true,
                  label: Take,
                  description: "Take number the shot is recorded under; send the recorder's current take to keep it." }
    send: { method: POST, path: /api/session/shotrecorder/record, body: '{"engage":{engage},"name":{recorder:json},"slate":{slate:json},"take":"{take}"}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

  # ── Python ───────────────────────────────────────────────────────────────
  execute_python:
    summary: >
      Run a Python 2.7 script in Designer on the Director (python/execute);
      returns {d3Log, pythonLog, returnValue}. See the critical quirk first
    params:
      script: { type: json, required: true,
                label: Script,
                description: "Python 2.7 code as a JSON string (lines joined with \\n), run as the body of a function with d3 imported; its return value comes back as returnValue." }
      module: { type: string, max_length: 256, default: "",
                label: Module,
                description: "Registered module to run the script in; empty for a one-off script." }
    send: { method: POST, path: /api/session/python/execute, body: '{"moduleName":{module:json},"script":{script}}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 }, json_path: "$" }
    returns: value

  register_python_module:
    summary: Register a Python 2.7 module in Designer for later execute_python calls to run in (python/registermodule)
    params:
      module:   { type: string, max_length: 256, required: true,
                  label: Module,
                  description: "Name to register the module under." }
      contents: { type: json, required: true,
                  label: Contents,
                  description: "The module's Python 2.7 source as a JSON string (lines joined with \\n), which imports d3 itself." }
    send: { method: POST, path: /api/session/python/registermodule, body: '{"moduleName":{module:json},"contents":{contents}}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.status.code": 0 } }
    returns: ack

