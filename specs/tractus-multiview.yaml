state:
  viewers.*.name: { type: string, description: "Multiviewer, keyed by its index from 0: the multiviewer's name" }
  viewers.*.ndi_output: { type: bool, description: "Multiviewer, keyed by its index from 0: its NDI output is on (NdiStatus)" }
  viewers.*.layout: { type: string, description: "Multiviewer, keyed by its index from 0: its layout's code (LayoutModeCode), such as 2L8S" }
  viewers.*.layout_data: { type: string, description: "Multiviewer, keyed by its index from 0: its layout data, as JSON text" }
  viewers.*.audio_channels: { type: int, description: "Multiviewer, keyed by its index from 0: channels of the audio it monitors" }
  viewers.*.audio_sample_rate: { type: int, description: "Multiviewer, keyed by its index from 0: sample rate of the audio it monitors, in Hz" }
  viewers.*.audio_peak_dbfs: { type: string, description: "Multiviewer, keyed by its index from 0: peak level of the monitored audio in dBFS, as JSON text (a number or one per channel)" }
  viewers.*.audio_monitor_source: { type: string, description: "Multiviewer, keyed by its index from 0: the NDI source whose audio it monitors, empty when none" }
  viewers.*.projector_source: { type: string, description: "Multiviewer, keyed by its index from 0: the NDI source it projects full screen, empty when none" }
  viewers.*.projector_hdr: { type: bool, description: "Multiviewer, keyed by its index from 0: the projected source is HDR" }
  viewers.*.focused_viewport: { type: int, description: "Multiviewer, keyed by its index from 0: the focused viewport, from 0" }
  viewers.*.outputs.*.source: { type: string, description: "Viewport, keyed by multiviewer and viewport from 0: the NDI source shown in the viewport, empty when none" }
  viewers.*.outputs.*.name: { type: string, description: "Viewport, keyed by multiviewer and viewport from 0: the viewport's name" }
  viewers.*.outputs.*.low_bandwidth: { type: bool, description: "Viewport, keyed by multiviewer and viewport from 0: the viewport receives the low-bandwidth stream" }
  viewers.*.outputs.*.hdr: { type: bool, description: "Viewport, keyed by multiviewer and viewport from 0: the source is HDR" }
  viewers.*.outputs.*.video_watchdog_tripped: { type: bool, description: "Viewport, keyed by multiviewer and viewport from 0: no video has arrived within the watchdog time" }
  receivers.*.subscribed_renderers: { type: int, description: "NDI receiver, keyed by source name: how many viewports show the source" }
  receivers.*.preview_tally: { type: bool, description: "NDI receiver, keyed by source name: the source is on preview (NDI tally)" }
  receivers.*.program_tally: { type: bool, description: "NDI receiver, keyed by source name: the source is on program (NDI tally)" }
  receivers.*.hdr: { type: bool, description: "NDI receiver, keyed by source name: the source is HDR" }
  receivers.*.low_bandwidth: { type: bool, description: "NDI receiver, keyed by source name: the low-bandwidth stream is received" }
  receivers.*.watchdog_timeout: { type: string, description: "NDI receiver, keyed by source name: the receiver's watchdog timeout, as JSON text" }
  receivers.*.supports_ptz: { type: bool, description: "NDI receiver, keyed by source name: the source takes PTZ control" }
  receivers.*.supports_kvm: { type: bool, description: "NDI receiver, keyed by source name: the source takes KVM control" }
  app.version: { type: string, description: "The application's version" }
  app.instance_name: { type: string, description: "The instance's name" }
  app.build_type: { type: string, description: "production, beta or dangerous" }
  app.default_instances: { type: string, description: "The default multiview instances, as JSON text" }
  app.ndi_sender_type: { type: string, description: "The NDI sender type requested, as JSON text" }
  sources: { type: string, description: "The NDI sources the multiview sees, as JSON text, as /sources gives them" }
  layouts: { type: string, description: "The layouts the multiview offers, as JSON text, as /layouts gives them" }

quirks:
  - models: [all]
    severity: warning
    text: >
      The documentation names the response fields in PascalCase (ViewerIndex,
      NdiSource) but shows no response; state reads them in PascalCase and in
      camelCase, the form such a server often writes. The shapes of /sources,
      /layouts and the caption and layout bodies are only in the Swagger reference
      on the host (/swagger/index.html), so they are kept and sent whole as JSON.

  - models: [all]
    severity: info
    text: >
      Viewers (multiviewers) and viewports are numbered from 0, in the API and in
      state. Commands that change a multiviewer read /viewers again after it, so
      state follows at once; captions are not in /viewers and are not read back.

  - models: [all]
    severity: critical
    text: >
      shutdown ends the whole Multiview application and shutdown_viewer closes a
      multiviewer: neither asks for confirmation, and nothing over the API starts
      the application again.

  - models: [all]
    severity: info
    text: >
      The API takes no credential: anyone on the network who reaches port 8901
      can control the multiview. The documentation says the Multiview listens on
      every interface.
