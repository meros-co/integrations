spec: 1
id: aja-kumo
name: AJA KUMO SDI routers and control panels
vendor: AJA Video Systems
category: router

source:
  - title: AJA KUMO REST Automation 4.7.1 (kumo_automation_4.7.1.zip, released March 14, 2024; archive built 2023-12-19)
    author: AJA Video Systems
    url: https://www.aja.com/support/item-download/9616/kumo_automation_4.7.1.zip
    note: >
      Manufacturer package for KUMO 1616, 1616-12G, 3232, 3232-12G, 6464,
      6464-12G, CP and CP2 (aja.com support item 9616), and the source of the
      KUMO parameters here unless a command says otherwise.
      kumo_control/kumo_control.h: crosspoints as eParamID_XPT_Destination{n}_Status
      set to the source number (SetCrosspoint, GetCrosspoint), the whole
      router as eParamID_XPT_DestinationAll_Status read with alt=text-plain
      ([1,2,4,...], "{}" on firmware without it), salvos 1-8 as
      eParamID_Salvo{n} holding {"index","name","valid","salvodata":[64
      sources]} (SetSalvo, GetSalvo, written as a form POST to /options with
      paramName and newValue), and TakeSalvo (eParamID_TakeSalvo).
      kumo_control/main.cpp: destination button text
      eParamID_XPT_Destination{n}_Line_1 and _Line_2, eParamID_SuppressPSAlarm.
      config_control/config_control.h and main.cpp: the generic GET
      /config?action=set|get, values as base-10 strings or enum numbers, and
      eParamID_LED_Identify. python_examples: action=connect returning
      {"connectionid"}, source button text eParamID_XPT_Source{n}_Line_1 and
      _Line_2 (0-20 characters), button colors eParamID_Button_Settings_{n}
      with {'classes': 'color_1'..'color_9'} and the button numbering
      (ConfigureSources.py, GroupChangeColorSources_CL.py,
      GroupChangeColorDests_CL.py), eParamID_KumoProductID (1 16x16, 2 16x04,
      3 32x32, 5 64x64; OneToOneDiagonal_CL.py), HTTP 403 on an invalid or
      locked switch, a 0.1 s pause between requests, and the
      /authenticator/login cookie (KumoRtrWithAuth.py).
  - title: KUMO Series Manual, Installation and Operation Guide, version 4.9 (November 1, 2024)
    author: AJA Video Systems
    url: https://www.aja.com/support/item-download/9966/AJA_KUMO_Series_Manual_v4.9.pdf
    note: >
      Manufacturer-documented. Models and I/O counts (p.6-7), firmware
      features: dual and quad modes from v3.0, salvos from v4.3, 6464-12G
      serial 1RT901000 needs v4.9 (p.7, p.51); twenty presets (p.7, p.39-41);
      takes, locked destinations and eight salvos (p.26-27, p.57); switching
      modes, button names, colors, hide and lock (p.27-30); salvo editing and
      take rules (p.30-39); user authentication and the default password
      "password" (p.50); alarms (p.54-55); identify (p.55); control panels
      (p.10, p.56-57); GVG Native Protocol over RS-422 and TCP (p.91-92).
  - title: AJA REST API (gitlab.aja.com/pub/rest_api, master, April 2026) and Developer Guide v1.0 (January 29, 2021)
    author: AJA Video Systems
    url: https://gitlab.aja.com/pub/rest_api
    note: >
      Manufacturer-documented generic framework that "applies to most AJA
      products that have a web user interface" (README). Chapter 1: /config
      with action=get|set|connect|wait_for_config_events, paramid and value;
      the JSON reply {paramid, name, value, value_name}; desc.json. Chapter 2:
      /descriptors?paramid=, Events, and presets through eParamID_RegisterSave
      and eParamID_RegisterRecall.
  - title: Bitfocus Companion module aja-kumo (MIT), index.js and choices.js
    url: https://github.com/bitfocus/companion-module-aja-kumo
    note: >
      Community source, MIT licence, used only where AJA publishes nothing:
      eParamID_XPT_Destination{n}_Locked (1 lock, 0 unlock),
      eParamID_NumberOfSources, eParamID_NumberOfDestinations, the
      eParamID_KumoProductID values for the 12G routers and panels (6-12),
      eParamID_TakeSalvo taking the salvo number as its value, the salvo JSON
      reply's value being an object, and
      /config?action=wait_for_config_events&configid=0&connectionid=N
      returning [{param_id, int_value, str_value}]. Also corroborates the
      AJA-documented crosspoint, name and salvo parameters.

transport:
  type: http
  port: 80
  scheme: http
  auth: none
  timeout_ms: 4000
  probe:
    method: GET
    path: /config
    query: { action: get, paramid: eParamID_KumoProductID }

# The event connection (AJA REST API chapter 1; python_examples): connect,
# then hold a wait_for_config_events request open, again and again, with the
# returned connection id. The extension runs that loop beside the commands,
# using the requests of open_event_connection and wait_for_events below, and
# offers each change to the telemetry rules as "event <param_id>
# value=<value>" and "event <param_id> value_name=<value_name>".
extension: aja-config-events

