  poll:
    every_ms: 30000
    send:
      - { method: GET, path: /options, query: { action: get, configid: "0", paramid: eParamID_XPT_DestinationAll_Status, alt: text-plain } }
  updates:
    # Every /config get or set reply is {paramid, name, value, value_name}.
    - path: "^/config\\?action=(get|set)&paramid="
      json: { name: "$.name", value: "$.value", value_name: "$.value_name" }
      state:
        "params.{name}.value": "{value}"
        "params.{name}.value_name": "{value_name}"
    - path: "^/config\\?action=(?:get|set)&paramid=eParamID_XPT_Destination(\\d+)_Status(?:&|$)"
      json: { source: "$.value" }
      state: { "outputs.{1}.input": "{source}" }
    - path: "^/config\\?action=(?:get|set)&paramid=eParamID_XPT_Destination(\\d+)_Line_1(?:&|$)"
      json: { text: "$.value" }
      state: { "outputs.{1}.label_line_1": "{text}" }
    - path: "^/config\\?action=(?:get|set)&paramid=eParamID_XPT_Destination(\\d+)_Line_2(?:&|$)"
      json: { text: "$.value" }
      state: { "outputs.{1}.label_line_2": "{text}" }
    - path: "^/config\\?action=(?:get|set)&paramid=eParamID_XPT_Source(\\d+)_Line_1(?:&|$)"
      json: { text: "$.value" }
      state: { "inputs.{1}.label_line_1": "{text}" }
    - path: "^/config\\?action=(?:get|set)&paramid=eParamID_XPT_Source(\\d+)_Line_2(?:&|$)"
      json: { text: "$.value" }
      state: { "inputs.{1}.label_line_2": "{text}" }
    - path: "^/config\\?action=(?:get|set)&paramid=eParamID_XPT_Destination(\\d+)_Locked(?:&|$)"
      json: { locked: "$.value" }
      state:
        "outputs.{1}.locked": { value: "{locked}", map: { "0": false, "1": true } }
    - path: "^/config\\?action=get&paramid=eParamID_Salvo(\\d+)$"
      json: { name: "$.value.name", valid: "$.value.valid" }
      state:
        "salvos.{1}.name": "{name}"
        "salvos.{1}.valid": { value: "{valid}", map: { "true": true, "false": false } }
    - path: "^/config\\?action=get&paramid=eParamID_KumoProductID$"
      json: { code: "$.value", name: "$.value_name" }
      state:
        device.product_id: "{code}"
        device.product: "{name}"
    - path: "^/config\\?action=get&paramid=eParamID_NumberOfSources$"
      json: { n: "$.value" }
      state: { device.sources: "{n}" }
    - path: "^/config\\?action=get&paramid=eParamID_NumberOfDestinations$"
      json: { n: "$.value" }
      state: { device.destinations: "{n}" }
    # Events, as the aja-config-events extension offers them, with the value
    # and name a get reply would carry: for a string parameter str_value and
    # an empty name; otherwise int_value and str_value (or the value again).
    - match: "^event (\\w+) value=(.*)$"
      state: { "params.{1}.value": "{2}" }
    - match: "^event (\\w+) value_name=(.*)$"
      state: { "params.{1}.value_name": "{2}" }
    - match: "^event eParamID_XPT_Destination(\\d+)_Status value=(\\d+)$"
      state: { "outputs.{1}.input": "{2}" }
    - match: "^event eParamID_XPT_Destination(\\d+)_Line_1 value=(.*)$"
      state: { "outputs.{1}.label_line_1": "{2}" }
    - match: "^event eParamID_XPT_Destination(\\d+)_Line_2 value=(.*)$"
      state: { "outputs.{1}.label_line_2": "{2}" }
    - match: "^event eParamID_XPT_Source(\\d+)_Line_1 value=(.*)$"
      state: { "inputs.{1}.label_line_1": "{2}" }
    - match: "^event eParamID_XPT_Source(\\d+)_Line_2 value=(.*)$"
      state: { "inputs.{1}.label_line_2": "{2}" }
    - match: "^event eParamID_XPT_Destination(\\d+)_Locked value=(\\d+)$"
      state:
        "outputs.{1}.locked": { value: "{2}", map: { "0": false, "1": true } }
    - match: "^event eParamID_KumoProductID value=(\\d+)$"
      state: { device.product_id: "{1}" }
