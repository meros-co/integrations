commands:
  # ── Generic parameter access (AJA REST API chapters 1-2) ────────────────
  get_parameter:
    summary: >
      Read any parameter by id. Returns the JSON reply {paramid, name, value,
      value_name}; ids are listed in the unit's desc.json
    params:
      paramid: { type: string, pattern: "^eParamID_[A-Za-z0-9_]+$", required: true }
    send:
      method: GET
      path: /config
      query: { action: get, paramid: "{paramid}" }
    expect: { json_path: "$" }
    returns: value

  set_parameter:
    summary: >
      Set any parameter by id. Enum parameters take the enum's number,
      integers are base-10, strings are sent as they are (config_control.h)
    params:
      paramid: { type: string, pattern: "^eParamID_[A-Za-z0-9_]+$", required: true }
      value: { type: string, required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: "{paramid}", value: "{value}" }
    expect: { status: 200 }
    returns: ack

  get_descriptor:
    summary: Read one parameter's descriptor (type, enum values, range, persistence) as JSON
    params:
      paramid: { type: string, pattern: "^eParamID_[A-Za-z0-9_]+$", required: true }
    send:
      method: GET
      path: /descriptors
      query: { paramid: "{paramid}" }
    expect: { json_path: "$" }
    returns: value

  get_all_descriptors:
    summary: Read every parameter descriptor on the unit (desc.json)
    send: { method: GET, path: /desc.json }
    expect: { json_path: "$" }
    returns: value

  save_preset:
    summary: >
      Store the active configuration (switching mode, crosspoints, button
      settings, salvos) into one of the twenty presets (eParamID_RegisterSave)
    params:
      preset: { type: int, min: 1, max: 20, required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_RegisterSave, value: "{preset}" }
    expect: { status: 200 }
    returns: ack

  recall_preset:
    summary: Recall one of the twenty presets into the active configuration (eParamID_RegisterRecall)
    params:
      preset: { type: int, min: 1, max: 20, required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_RegisterRecall, value: "{preset}" }
    expect: { status: 200 }
    returns: ack

  identify_on:
    summary: Flash the unit's Identify LED (eParamID_LED_Identify 1)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_LED_Identify, value: "1" }
    expect: { status: 200 }
    returns: ack

  identify_off:
    summary: Stop flashing the Identify LED (eParamID_LED_Identify 0)
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_LED_Identify, value: "0" }
    expect: { status: 200 }
    returns: ack

  get_product_id:
    summary: >
      Read the product by name, such as KUMO 16x16 Matrix
      (eParamID_KumoProductID; numbers 1 16x16, 2 16x04, 3 32x32, 5 64x64)
    send:
      method: GET
      path: /config
      query: { action: get, paramid: eParamID_KumoProductID }
    expect: { json_path: "$.value_name" }
    returns: value

  open_event_connection:
    summary: Open an event connection (action=connect); returns the connection id for wait_for_events
    send:
      method: GET
      path: /config
      query: { action: connect }
    expect: { json_path: "$.connectionid" }
    returns: value

  wait_for_events:
    summary: >
      Wait on an event connection for parameter changes
      (action=wait_for_config_events). The reply, returned whole, is an array
      of {param_id, int_value, str_value}; it is held until a change arrives
    params:
      connection: { type: int, min: 0, required: true }
    send:
      method: GET
      path: /config
      query: { action: wait_for_config_events, configid: "0", connectionid: "{connection}" }
    expect: { json_path: "$" }
    returns: value

  # ── Crosspoints ─────────────────────────────────────────────────────────
  set_route:
    summary: >
      Route a source to a destination (eParamID_XPT_Destination{n}_Status).
      Refused with HTTP 403 when the destination is locked or out of range
    params:
      destination: { type: int, min: 1, max: 64, required: true }
      source: { type: int, min: 1, max: 64, required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: "eParamID_XPT_Destination{destination}_Status", value: "{source}" }
    expect: { status: 200 }
    returns: ack

  get_route:
    summary: Read the source routed to a destination (eParamID_XPT_Destination{n}_Status)
    params:
      destination: { type: int, min: 1, max: 64, required: true }
    send:
      method: GET
      path: /config
      query: { action: get, paramid: "eParamID_XPT_Destination{destination}_Status" }
    expect: { json_path: "$.value" }
    returns: value

  get_all_routes:
    summary: >
      Read every destination's source in one request
      (eParamID_XPT_DestinationAll_Status), as text such as
      [1,2,4,4,5,6,7,8,10,10,11,12,13,15,15,16] for destinations 1 upwards.
      Fails on firmware without it, which answers {}
    send:
      method: GET
      path: /options
      query: { action: get, configid: "0", paramid: eParamID_XPT_DestinationAll_Status, alt: text-plain }
    expect: { status: 200, matches: "^\\s*(\\[[0-9,]*\\])\\s*$" }
    returns: value

  # ── Button names (two lines of up to 20 characters) ────────────────────
  set_source_label:
    summary: Set line 1 or 2 of a source button's name (eParamID_XPT_Source{n}_Line_1/_2); empty clears it
    params:
      source: { type: int, min: 1, max: 64, required: true }
      line: { type: int, min: 1, max: 2, required: true }
      text: { type: string, max_length: 20, required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: "eParamID_XPT_Source{source}_Line_{line}", value: "{text}" }
    expect: { status: 200 }
    returns: ack

  get_source_label:
    summary: Read line 1 or 2 of a source button's name
    params:
      source: { type: int, min: 1, max: 64, required: true }
      line: { type: int, min: 1, max: 2, required: true }
    send:
      method: GET
      path: /config
      query: { action: get, paramid: "eParamID_XPT_Source{source}_Line_{line}" }
    expect: { json_path: "$.value" }
    returns: value

  set_destination_label:
    summary: Set line 1 or 2 of a destination button's name (eParamID_XPT_Destination{n}_Line_1/_2); empty clears it
    params:
      destination: { type: int, min: 1, max: 64, required: true }
      line: { type: int, min: 1, max: 2, required: true }
      text: { type: string, max_length: 20, required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: "eParamID_XPT_Destination{destination}_Line_{line}", value: "{text}" }
    expect: { status: 200 }
    returns: ack

  get_destination_label:
    summary: Read line 1 or 2 of a destination button's name
    params:
      destination: { type: int, min: 1, max: 64, required: true }
      line: { type: int, min: 1, max: 2, required: true }
    send:
      method: GET
      path: /config
      query: { action: get, paramid: "eParamID_XPT_Destination{destination}_Line_{line}" }
    expect: { json_path: "$.value" }
    returns: value

  # ── Destination locks (community-documented parameter) ─────────────────
  lock_destination:
    summary: Lock a destination against source changes from every controller (eParamID_XPT_Destination{n}_Locked 1)
    params:
      destination: { type: int, min: 1, max: 64, required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: "eParamID_XPT_Destination{destination}_Locked", value: "1" }
    expect: { status: 200 }
    returns: ack

  unlock_destination:
    summary: Unlock a destination (eParamID_XPT_Destination{n}_Locked 0); any controller may release a lock
    params:
      destination: { type: int, min: 1, max: 64, required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: "eParamID_XPT_Destination{destination}_Locked", value: "0" }
    expect: { status: 200 }
    returns: ack

  get_destination_lock:
    summary: Read a destination's lock, 1 locked or 0 unlocked (eParamID_XPT_Destination{n}_Locked)
    params:
      destination: { type: int, min: 1, max: 64, required: true }
    send:
      method: GET
      path: /config
      query: { action: get, paramid: "eParamID_XPT_Destination{destination}_Locked" }
    expect: { json_path: "$.value" }
    returns: value

  # ── Salvos (firmware v4.3 and above) ────────────────────────────────────
  set_salvo:
    summary: >
      Write salvo 1-8 (eParamID_Salvo{n}) as AJA's SetSalvo does: a form
      POST to /options with the name, valid (true highlights the salvo's
      button) and 64 comma-separated source numbers, one per destination
      1-64, 0 for destinations the salvo leaves alone or the router lacks
    params:
      salvo: { type: int, min: 1, max: 8, required: true }
      name: { type: string, pattern: "^[^&%+=]{1,32}$", required: true }
      valid: { type: bool, default: true }
      sources:
        type: string
        pattern: "^(0|[1-9]|[1-5][0-9]|6[0-4])(,(0|[1-9]|[1-5][0-9]|6[0-4])){63}$"
        required: true
    send:
      method: POST
      path: /options
      content_type: application/x-www-form-urlencoded
      body: "paramName=eParamID_Salvo{salvo}&newValue={\"index\":\"{salvo}\",\"name\":{name:json},\"valid\":\"{valid}\",\"salvodata\":[{sources}]}"
    expect: { status: 200 }
    returns: ack

  get_salvo:
    summary: Read salvo 1-8 (eParamID_Salvo{n}); returns {index, name, valid, salvodata[64]}
    params:
      salvo: { type: int, min: 1, max: 8, required: true }
    send:
      method: GET
      path: /config
      query: { action: get, paramid: "eParamID_Salvo{salvo}" }
    expect: { json_path: "$.value" }
    returns: value

  take_salvo:
    summary: >
      Take salvo 1-8 (eParamID_TakeSalvo), whether or not it is marked
      valid. Locked destinations are left unchanged
    params:
      salvo: { type: int, min: 1, max: 8, required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: eParamID_TakeSalvo, value: "{salvo}" }
    expect: { status: 200 }
    returns: ack

  # ── Button colors (color_1 red, color_2 orange, color_3 gold, color_4
  #    default, color_5 green, color_6 mint, color_7 blue, color_8 purple,
  #    color_9 pink). eParamID_Button_Settings_{n} numbers sources 1-16 as
  #    1-16, 17-32 as 33-48, 33-64 as 65-96, and destinations 1-16 as 17-32,
  #    17-32 as 49-64, 33-64 as 97-128, so each bank is its own command.
  set_source_color_1_16:
    summary: Color source button 1-16 (eParamID_Button_Settings_1 to _16)
    params:
      source: { type: int, min: 1, max: 16, required: true }
      color: { type: enum, values: [color_1, color_2, color_3, color_4, color_5, color_6, color_7, color_8, color_9], required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: "eParamID_Button_Settings_{source}", value: "{'classes': '{color}'}" }
    expect: { status: 200 }
    returns: ack

  set_source_color_17_32:
    summary: Color source button 17-32 (eParamID_Button_Settings_33 to _48)
    params:
      source: { type: int, min: 17, max: 32, required: true }
      color: { type: enum, values: [color_1, color_2, color_3, color_4, color_5, color_6, color_7, color_8, color_9], required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: "eParamID_Button_Settings_{source:+16}", value: "{'classes': '{color}'}" }
    expect: { status: 200 }
    returns: ack

  set_source_color_33_64:
    summary: Color source button 33-64 (eParamID_Button_Settings_65 to _96)
    params:
      source: { type: int, min: 33, max: 64, required: true }
      color: { type: enum, values: [color_1, color_2, color_3, color_4, color_5, color_6, color_7, color_8, color_9], required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: "eParamID_Button_Settings_{source:+32}", value: "{'classes': '{color}'}" }
    expect: { status: 200 }
    returns: ack

  set_destination_color_1_16:
    summary: Color destination button 1-16 (eParamID_Button_Settings_17 to _32)
    params:
      destination: { type: int, min: 1, max: 16, required: true }
      color: { type: enum, values: [color_1, color_2, color_3, color_4, color_5, color_6, color_7, color_8, color_9], required: true }
    send:
      method: GET
      path: /config
      query: { action: set, paramid: "eParamID_Button_Settings_{destination:+16}", value: "{'classes': '{color}'}" }
    expect: { status: 200 }
    returns: ack

  set_destination_color_17_32:
