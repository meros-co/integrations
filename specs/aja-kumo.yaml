state:
  params.*.value: { type: string, description: "A parameter's last value read or set, keyed by its eParamID name: the enum's number, an integer, or a string" }
  params.*.value_name: { type: string, description: "A parameter's value as text: the enum's name, or the integer repeated" }
  device.product_id: { type: int, description: "eParamID_KumoProductID: 1 16x16, 2 16x04, 3 32x32, 5 64x64 (AJA); 4 32x4, 6-9 control panels, 10-12 12G routers (community)" }
  device.product: { type: string, description: "The product as the unit names it, such as KUMO 16x16 Matrix" }
  device.sources: { type: int, description: "Number of sources in the current switching mode" }
  device.destinations: { type: int, description: "Number of destinations in the current switching mode" }
  outputs.*.input: { type: int, description: "Source routed to the destination, both numbered from 1 as on the WebUI" }
  outputs.*.label_line_1: { type: string, description: "Destination button name, line 1" }
  outputs.*.label_line_2: { type: string, description: "Destination button name, line 2" }
  outputs.*.locked: { type: bool, description: "True when the destination is locked against source changes" }
  inputs.*.label_line_1: { type: string, description: "Source button name, line 1" }
  inputs.*.label_line_2: { type: string, description: "Source button name, line 2" }
  salvos.*.name: { type: string, description: "Salvo name, salvos 1-8" }
  salvos.*.valid: { type: bool, description: "True when the salvo is configured (its WebUI button is highlighted green)" }

quirks:
  - models: [all]
    severity: critical
    text: >
      Sources and destinations are numbered from 1 on the wire, as on the
      WebUI (kumo_control.h: "1-based source number"). In Dual and Quad
      switching modes (firmware v3.0 and above) the router has a half or a
      quarter as many sources and destinations, each a group of BNCs (manual
      p.27-29), and the numbers address those groups. Changing the mode
      resets button names and colors to the mode's defaults (p.27).

  - models: [all]
    severity: warning
    text: >
      The format declares one range per command, so destination and source
      numbers accept 1-64 on every router. A number above the router's
      count in its current mode (device.sources, device.destinations) is
      refused by the router; AJA's OneToOneDiagonal_CL.py reports such
      failures, and switches to a locked destination, as HTTP 403.

  - models: [all]
    severity: warning
    text: >
      Locked destinations cannot be switched, and salvos skip them (manual
      p.26-27). A lock is universal: it is tallied across the network and
      any controller can release it (p.30). The lock parameter
      eParamID_XPT_Destination{n}_Locked is not in AJA's documents; it is
      taken from the MIT Bitfocus Companion module, which also notes that
      the router does not reliably report lock changes as events.

  - models: [all]
    severity: warning
    text: >
      The router pushes changes over an event connection: GET
      /config?action=connect returns {"connectionid": N}, then GET
      /config?action=wait_for_config_events&configid=0&connectionid=N is
      held until changes arrive and returns [{param_id, int_value,
      str_value}]. The aja-config-events extension runs this loop beside the
      commands: it waits again as soon as each reply arrives, holding each
      wait up to 30 seconds, opens a new connection when the id has expired
      or a request fails (after 1 s, doubling to 30 s while failures
      continue), and gives each change to the telemetry rules: crosspoints,
      button names, locks, the product and the source and destination
      counts. Events carry changes only, so names, locks and salvos are read
      once on connecting and the routing map every 30 seconds, which also
      corrects routing missed while the connection was down. Salvo changes
      are kept only as params.eParamID_Salvo{n}, since AJA does not document
      their event form; salvos.* come from the read on connecting and from
      get_salvo. AJA does not document how an expired id is answered; the
      extension reconnects on any reply that is not a 2xx JSON array, and
      tries /json when /config does not give a connection id.
      open_event_connection and wait_for_events remain for a host that
      drives a loop itself; such a wait may outlast the 4-second request
      timeout when nothing changes.

  - models: [all]
    severity: warning
    text: >
      eParamID_XPT_DestinationAll_Status needs firmware that has it; older
      firmware answers {} (kumo_control main.cpp), and the poll then updates
      nothing, so routing comes only from get_route and set_route replies.
      AJA reads it through /options?action=get&configid=0&...&alt=text-plain,
      which this spec sends as documented; it is the only /options read.

  - models: [all]
    severity: info
    text: >
      AJA's examples pause between requests "to not overload queue" (0.1 s in
      the python examples, 0.25 s in OneToAll.py). The core sends one request
      at a time, waiting for each reply, but does not add a pause.

  - models: [all]
    severity: warning
    text: >
      With User Authentication set to Login (default Disabled; default
      password "password", manual p.50) every request needs the session
      cookie from a form POST of password_provided to /authenticator/login
      (KumoRtrWithAuth.py). The format has no cookie login, so the unit must
      have User Authentication set to Disabled.

  - models: [all]
    severity: warning
    text: >
      Every action is an HTTP GET with action=set; a logged, cached or
      replayed URL repeats it.

  - models: [kumo-1604, kumo-1616, kumo-1616-12g, kumo-3232, kumo-3232-12g, kumo-6464, kumo-6464-12g]
    severity: warning
    text: >
      Salvos need firmware v4.3 or above (manual p.7). set_salvo writes the
      whole salvo: always 64 sources, one per destination 1-64. AJA's
      kumo_control.h says a source of 0 "causes the router output to be
      turned off", while its demo uses 0 for destinations "either not present
      ... or whose inputs don't matter", and the manual says unassigned
      crosspoints in a salvo leave the destination unchanged (p.32-33); the
      effect of 0 is therefore unclear. The salvo is sent, as in AJA's
      SetSalvo, as a form body without percent-encoding, so its name may not
      contain &, %, + or =. Salvo names should be unique (p.32).

  - models: [kumo-1604, kumo-1616, kumo-1616-12g, kumo-3232, kumo-3232-12g, kumo-6464, kumo-6464-12g]
    severity: warning
    text: >
      take_salvo sends the salvo number as the value of eParamID_TakeSalvo,
      as the Companion module does. AJA's own TakeSalvo(salvoNum) documents
      taking "the indicated salvo" but sends the constant 1 whatever the
      number, so AJA's documents do not settle the value for salvos 2-8.

  - models: [kumo-1616, kumo-1616-12g, kumo-3232, kumo-3232-12g, kumo-6464, kumo-6464-12g]
    severity: info
    text: >
      Button colors are written as AJA's python scripts send them, the value
      {'classes': 'color_N'} (a Python dictionary printed with single
      quotes), percent-encoded. The color applies to both the button's static
      and active (high tally) states (manual p.29). AJA's color scripts note
      that they do not support the legacy KUMO 1604.

  - models: [all]
    severity: info
    text: >
      eParamID_LED_Identify comes from AJA's generic config_control example
      in the KUMO package; the manual describes Identify only from the WebUI
      (p.55). Identify stays on until it is turned off.

  - models: [all]
    severity: info
    text: >
      AJA documents only these KUMO parameters. Others, such as alarm
      suppression for reference and temperature, switching mode, hidden
      destinations and the 6464-12G long-cable setting, are listed with
      their ids in the unit's desc.json and reached through get_parameter
      and set_parameter. eParamID_SuppressPSAlarm is read by AJA's demo
      without its values being described.

  - models: [kumo-cp, kumo-cp2]
    severity: info
    text: >
      AJA lists the CP and CP2 as compatible with the KUMO REST package but
      documents no panel parameter (router delegation, display intensity,
      enabled buttons); use desc.json and get_parameter or set_parameter.
      The 32-button CP controls only the first 32 sources and destinations of
      a KUMO 6464 in Normal mode (manual p.10).

  - models: [kumo-1604, kumo-1616, kumo-1616-12g, kumo-3232, kumo-3232-12g, kumo-6464, kumo-6464-12g]
    severity: info
    text: >
      The routers also take GVG Native Protocol (Series 7000) over RS-422 at
      38400 8N1 or over TCP, up to 32 connections (manual p.91-92), with
      takes by index or name, salvo takes by name, protect and unprotect, and
      name queries. This spec covers the HTTP interface only.
