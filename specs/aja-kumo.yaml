    expect: { status: 200 }
    returns: ack

  # ── Router information and alarms ───────────────────────────────────────
  get_source_count:
    summary: Read the number of sources in the current switching mode (eParamID_NumberOfSources)
    send:
      method: GET
      path: /config
      query: { action: get, paramid: eParamID_NumberOfSources }
    expect: { json_path: "$.value" }
    returns: value

  get_destination_count:
    summary: Read the number of destinations in the current switching mode (eParamID_NumberOfDestinations)
    send:
      method: GET
      path: /config
      query: { action: get, paramid: eParamID_NumberOfDestinations }
    expect: { json_path: "$.value" }
    returns: value

  get_ps_alarm_suppression:
    summary: Read the power supply alarm setting by name (eParamID_SuppressPSAlarm)
    send:
      method: GET
      path: /config
      query: { action: get, paramid: eParamID_SuppressPSAlarm }
    expect: { json_path: "$.value_name" }
    returns: value

telemetry:
  # Changes arrive over the event connection (the aja-config-events
  # extension) as "event <param_id> value=<value>" and "event <param_id>
  # value_name=<name>" lines, matched by the event rules below. Events carry
  # changes only, so names, locks, salvos and the product are read once on
  # connecting, and the whole routing map, in one request, every 30 seconds:
  # that fills routing in at the start and corrects it if the router has no
  # event connection or changes were missed while it was reopened. Every
  # command reply also goes through these rules, so this client's own
  # changes appear at once.
  subscribe:
    send:
      - { method: GET, path: /config, query: { action: get, paramid: eParamID_KumoProductID } }
      - { method: GET, path: /config, query: { action: get, paramid: eParamID_NumberOfSources } }
      - { method: GET, path: /config, query: { action: get, paramid: eParamID_NumberOfDestinations } }
      - { method: GET, path: /config, query: { action: get, paramid: eParamID_SuppressPSAlarm } }
