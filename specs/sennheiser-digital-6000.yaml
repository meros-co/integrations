spec: 1
id: sennheiser-digital-6000
name: Sennheiser Digital 6000 receivers (SSC)
vendor: Sennheiser
category: wireless
implementation: native
reason: >
  Telemetry is delivered through subscriptions that expire and must be renewed
  on a schedule, and a lapsed subscription is only detectable by silence. That
  is session logic, not data.

source:
  - title: Sennheiser Sound Control Protocol (SSC) — Developer's guide for Digital 6000 (TI 1109 v2.2)
    author: Sennheiser
    url: https://www.sennheiser.com/globalassets/digizuite/41931-en-ti_1109_v2.2_sennheiser_sound_control_protocol_digital_6000_en.pdf
    note: >
      Manufacturer document. Transport (UDP, default port 45), subscriptions,
      the method list (§8: bank and user bank frequencies §8.4-8.15,
      active_bank_channel §8.16, sync settings §8.29-8.38, the wsm_master_cnt
      on-change counters §8.42 and §8.95, name §8.44, encryption §8.45, active
      status §8.47, clock §8.97, brightness §8.98, booster §8.99, network
      §8.106-8.119, device name §8.120), the metering array and its conversion
      formulae.
  - title: Meros internal Digital 6000 client and protocol notes (not public)
    note: >
      Meros. Subscription lifecycle, renewal at a third of the lifetime, and the
      silence timeout. Tested against a simulated device only.
  - title: Bitfocus Companion, companion-module-sennheiser-digital6000
    url: https://github.com/bitfocus/companion-module-sennheiser-digital6000
    note: >
      MIT-licensed; cross-check only, no code copied. Its default port of 6970
      is not supported by the document. Corroborates user banks u1-u6 for
      active_bank_channel (the document's limits list u1-u3) and the 8-character
      channel name with its forbidden characters, which the document leaves out.

ports:
  - { port: 45, protocol: udp, role: control }

models:
  - id: em-6000
    name: Sennheiser EM 6000 two-channel receiver
    channels: 2
    supports: [mute, set_frequency, set_af_out, identify, get_frequency_limits, set_channel_name, set_device_name, set_bank_channel,
               set_encryption, set_sync_settings, set_user_frequency, get_bank, set_booster, set_brightness, set_clock, set_network]
    verification: none
  - id: em-6000-dante
    name: Sennheiser EM 6000 Dante two-channel receiver
    channels: 2
    supports: [mute, set_frequency, set_af_out, identify, get_frequency_limits, set_channel_name, set_device_name, set_bank_channel,
               set_encryption, set_sync_settings, set_user_frequency, get_bank, set_booster, set_brightness, set_clock, set_network, set_dante_network]
    verification: none

commands:
  mute:
    summary: Mute or unmute a receiver channel's audio
    params:
      channel: { type: int, min: 1, max: 2, required: true, label: Channel, description: "Receiver channel, 1 or 2 as numbered on the front panel." }
      muted:   { type: bool, default: true, label: Mute, description: "On mutes the channel's audio output, off unmutes it." }
    returns: ack

  set_frequency:
    summary: >
      Tune a channel. Returns the frequency the device applied, which differs
      from the request when the device adapts an out-of-range value.
    params:
      channel:       { type: int, min: 1, max: 2, required: true, label: Channel, description: "Receiver channel, 1 or 2 as numbered on the front panel." }
      frequency_khz: { type: int, min: 470100, max: 713900, required: true, label: Frequency, description: "Carrier frequency in kHz; the receiver applies the nearest frequency it supports and reports it back." }
    returns: value

  set_af_out:
    summary: >
      Set a channel's analogue audio output level. Returns the level the device
      applied.
    params:
      channel:  { type: int, min: 1, max: 2, required: true, label: Channel, description: "Receiver channel, 1 or 2 as numbered on the front panel." }
      level_db: { type: int, min: -10, max: 18, required: true, label: Output level, description: "Analogue audio output level in dB; the receiver applies the nearest level it supports and reports it back." }
    returns: value

  identify:
    summary: Show "Identified" on the receiver and blink the channel's triangle LED
    params:
      channel: { type: int, min: 1, max: 2, default: 1, label: Channel, description: "Receiver channel whose triangle LED blinks, 1 or 2 as numbered on the front panel." }
    returns: ack

  get_frequency_limits:
    summary: The carrier range the receiver accepts, as {min_khz, max_khz, step_khz}
    returns: value

  set_channel_name:
    summary: Name a receiver channel. Returns the name the receiver applied.
    params:
      channel: { type: int, min: 1, max: 2, required: true, label: Channel, description: "Receiver channel, 1 or 2 as numbered on the front panel." }
      name:    { type: string, max_length: 8, pattern: '^[^{}\[\]()~`!@$%^&_\\:''".?]*$', required: true, label: Name, description: "Channel name shown on the receiver, up to 8 characters, without brackets, braces or the punctuation the receiver refuses." }
    returns: value

  set_device_name:
    summary: >
      Name the receiver (its device id in the menu and in discovery). Returns
      the name applied, to which the receiver appends its MAC address.
    params:
      name: { type: string, max_length: 32, pattern: '^[^{}\[\]\\"]*$', required: true, label: Device name, description: "Name for the receiver; it adds its MAC address after it to keep names unique in discovery." }
    returns: value

  set_bank_channel:
    summary: >
      Tune a channel to a channel of a system or user bank. Returns the bank and
      channel applied, as [bank, channel].
    params:
      channel:      { type: int, min: 1, max: 2, required: true, label: Channel, description: "Receiver channel, 1 or 2 as numbered on the front panel." }
      bank:         { type: enum, values: [b1, b2, b3, b4, b5, b6, u1, u2, u3, u4, u5, u6], required: true, label: Bank, description: "b1 to b6 are the system banks, u1 to u6 the user banks." }
      bank_channel: { type: int, min: 0, max: 99, required: true, label: Bank channel, description: "Channel within the bank, 0 to 99." }
    returns: value

  set_encryption:
    summary: Turn a channel's AES 256 encryption on or off; the transmitter must be synced again
    params:
      channel: { type: int, min: 1, max: 2, required: true, label: Channel, description: "Receiver channel, 1 or 2 as numbered on the front panel." }
      enabled: { type: bool, default: true, label: Encryption, description: "On encrypts the link to the transmitter, off sends it in the clear." }
    returns: ack

  set_sync_settings:
    summary: >
      Set what a transmitter is given when synced to the channel. Only the
      settings given are written.
    params:
      channel:                { type: int, min: 1, max: 2, required: true, label: Channel, description: "Receiver channel, 1 or 2 as numbered on the front panel." }
      low_cut_hz:             { type: enum, values: ["30", "60", "80", "100", "120"], label: Low cut, description: "Transmitter low cut frequency in Hz." }
      ignore_low_cut:         { type: bool, label: Keep low cut, description: "On leaves the transmitter's own low cut alone at sync." }
      gain_db:                { type: int, min: -6, max: 60, label: Gain, description: "Transmitter gain in dB, -6 to 60 in 3 dB steps." }
      ignore_gain:            { type: bool, label: Keep gain, description: "On leaves the transmitter's own gain alone at sync." }
      display:                { type: enum, values: [frequency, name], label: Display, description: "What the transmitter's display shows: its frequency or its name." }
      ignore_display:         { type: bool, label: Keep display, description: "On leaves the transmitter's own display setting alone at sync." }
      cable_emulation:        { type: enum, values: [line, type1, type2, type3], label: Cable emulation, description: "The instrument cable the transmitter emulates, or line for none." }
      ignore_cable_emulation: { type: bool, label: Keep cable emulation, description: "On leaves the transmitter's own cable emulation alone at sync." }
      auto_lock:              { type: bool, label: Auto lock, description: "On locks the transmitter's controls automatically." }
      ignore_auto_lock:       { type: bool, label: Keep auto lock, description: "On leaves the transmitter's own auto lock alone at sync." }
    returns: ack

  set_user_frequency:
    summary: Store a frequency in a user bank channel. Returns the frequency the receiver stored.
    params:
      channel:       { type: int, min: 1, max: 2, required: true, label: Channel, description: "Receiver channel whose user banks to change, 1 or 2." }
      bank:          { type: enum, values: [u1, u2, u3, u4, u5, u6], required: true, label: User bank, description: "User bank u1 to u6." }
      index:         { type: int, min: 0, max: 99, required: true, label: Bank channel, description: "Channel within the bank, 0 to 99." }
      frequency_khz: { type: int, min: 470100, max: 713900, required: true, label: Frequency, description: "Frequency in kHz to store; the receiver adapts it to its range and 25 kHz grid." }
    returns: value

  get_bank:
    summary: >
      Read the hundred frequencies of a system or user bank, as {"00": kHz, ...};
      they also land in the channel's presets.
    params:
      channel: { type: int, min: 1, max: 2, required: true, label: Channel, description: "Receiver channel whose bank to read, 1 or 2." }
      bank:    { type: enum, values: [b1, b2, b3, b4, b5, b6, u1, u2, u3, u4, u5, u6], required: true, label: Bank, description: "b1 to b6 are the system banks, u1 to u6 the user banks." }
    returns: value

  set_booster:
    summary: Turn the antenna booster feed (DC to the antenna inputs) on or off
    params:
      enabled: { type: bool, default: true, label: Booster feed, description: "On powers active antennas and boosters through the antenna cables, off turns that supply off." }
    returns: ack

  set_brightness:
    summary: Set the brightness of both displays. Returns the level applied.
    params:
      percent: { type: int, min: 0, max: 100, required: true, label: Brightness, description: "Display brightness in percent." }
    returns: value

  set_clock:
    summary: Set the word clock mode
    params:
      mode: { type: enum, values: [internal_48k, internal_96k, external, internal_manual], required: true, label: Clock, description: "internal_48k or internal_96k runs from the receiver's own clock; external follows the word clock input; internal_manual is the receiver's manual internal mode." }
    returns: ack

  set_network:
    summary: >
      Set the control network's addressing. The receiver may move to the new
      address, and the core then has to be pointed at it.
    params:
      mode:        { type: enum, values: [auto, manual], required: true, label: Addressing, description: "auto uses DHCP and link-local addressing; manual uses the address, mask and gateway given." }
      address:     { type: string, max_length: 15, pattern: "^[0-9.]*$", label: IP address, description: "Dotted IPv4 address for manual addressing." }
      subnet_mask: { type: string, max_length: 15, pattern: "^[0-9.]*$", label: Subnet mask, description: "Dotted IPv4 subnet mask for manual addressing." }
      gateway:     { type: string, max_length: 15, pattern: "^[0-9.]*$", label: Gateway, description: "Dotted IPv4 gateway for manual addressing; leave out for none." }
      mdns:        { type: bool, label: mDNS only, description: "With manual addressing, on keeps mDNS discovery without DHCP or link-local addressing." }
    returns: ack

  set_dante_network:
    summary: Set the Dante network's addressing (EM 6000 Dante)
    params:
      mode:        { type: enum, values: [auto, manual], required: true, label: Addressing, description: "auto uses DHCP or link-local addressing; manual uses the address, mask and gateway given." }
      address:     { type: string, max_length: 15, pattern: "^[0-9.]*$", label: IP address, description: "Dotted IPv4 address for manual addressing." }
      subnet_mask: { type: string, max_length: 15, pattern: "^[0-9.]*$", label: Subnet mask, description: "Dotted IPv4 subnet mask for manual addressing." }
      gateway:     { type: string, max_length: 15, pattern: "^[0-9.]*$", label: Gateway, description: "Dotted IPv4 gateway for manual addressing; leave out for none." }
    returns: ack

