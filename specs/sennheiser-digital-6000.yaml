  device.network.*.static_gateway: { type: string, description: "Gateway used in manual mode (control)" }

quirks:
  - models: [all]
    severity: critical
    text: >
      Telemetry arrives through subscriptions with a 20 s lifetime. A lapsed
      subscription goes quiet without closing anything, which looks like a
      healthy receiver on an idle channel. The core renews every 6.7 s and treats
      15 s of silence as a lost connection.

  - models: [all]
    severity: warning
    text: >
      The default SSC port is 45 (TI 1109 §6.1). The Bitfocus Companion module's
      default of 6970 does not appear in the document.

  - models: [all]
    severity: warning
    text: >
      Out-of-range setter values are adapted, not rejected: the device applies
      the nearest valid value and replies with it. set_frequency and set_af_out
      return the value actually applied.

  - models: [all]
    severity: info
    text: >
      Battery is reported as one of four states, not a percentage, with an
      optional remaining time. An empty report means no transmitter, and the
      battery is left absent rather than reported as empty.

  - models: [all]
    severity: info
    text: >
      identify is a read of a read-only method, per TI 1109 §8.41, and always
      returns true.

  - models: [all]
    severity: warning
    text: >
      Bank and channel, encryption, sync settings, user banks, AF out, booster,
      brightness, clock and network cannot be subscribed. The core reads them on
      connecting, and again when the receiver's on-change counters (which are
      subscribed) show they were changed on the receiver; changes made by
      another SSC client are not counted, so they are only seen on the next
      connection.

  - models: [all]
    severity: warning
    text: >
      set_encryption and set_sync_settings take effect on the transmitter only
      at its next sync; with encryption changed, audio stops until the
      transmitter is synced again.

  - models: [all]
    severity: critical
    text: >
      set_network and set_dante_network change the receiver's addressing at
      once; on the control interface the receiver may move away from the
      address the core uses.

  - models: [all]
    severity: info
    text: >
      Over SSC the transmitter's settings (low cut, gain, display, capsule,
      cable emulation, auto lock) are read only; they are set on the
      transmitter through the sync settings and a sync. The test tone, the
      system banks and the Dante name are read only too. The frequency scan
      (§8.18-8.19) and walk test (§8.39-8.40) are not offered.
