spec: 1
id: kiloview-decoder
name: Kiloview D-series decoders (D350, D260, RD-350, RD-260, FD-360)
vendor: Kiloview
category: other

source:
  - title: "Dxx Decoder API Documentation v2.2 (2025-06-23)"
    author: Kiloview
    url: "https://enstatic.kiloview.com/wp-content/uploads/2026/05/%E2%80%8CDxx-Decoder-API-Documentation-v2.2-20250623-1.pdf"
    note: >
      Manufacturer-documented, public; linked as the API of the D260, D350,
      FD-360, RD-260 and RD-350 from their product pages
      (https://www.kiloview.com/en/docs/d260-h-265-decoder/api/, /d350/api/,
      /fd-360/api/, /rd-260/api/, /rd-350-rd-260/api/), retrieved 2026-10-23;
      the same file is re-uploaded under several names (2026/05 -1, -2, -3 and
      2026/09), none newer than v2.2. Used: section 1 (paths under /api, the
      result/data/msg reply), 2-3 (the app header holding a JSON object with
      username and token, the token from the login reply), 4 (error codes), 5
      INFO (info/get), 6 USER (login, logout, list, add, remove, modify), 7
      OVERLAY (list, select), 8 SOURCE (groups list, add, rename, remove;
      streams add, modify, remove, copy, move, with the request body of every
      protocol), 9 LAYOUT (template list, list, add, remove, select, modify,
      save, resave, reload, rename), 10 OUTPUT (interfaces get and set, list,
      get, source set and remove, resolution list and set, audiomix get, set,
      remove, add, PTZ, audio sound, border, background, audio check), 11
      NETWORK (get, set, maintenance address, HTTP ports, ping, routes), 12
      SYSTIME (settings, time, time zone), 13 SYSTEM (reboot, reset, restore,
      device name, ip get and replace), 14 FIRMWARE (upgrade), 15 PREVIEW
      (get, source modify, source remove), 16 NDI-Discovery (all, sources,
      auto, manual and server entries).
  - title: "D350 and D260 product pages, and the D350/D260 Series Decoder User Manual V2.1 (2025-05-28)"
    author: Kiloview
    url: "https://www.kiloview.com/en/products/decoders/d350/"
    note: >
      Retrieved 2026-10-23 for the model names: D350 4K multi-functional
      decoder, D260 HD decoder, RD-350 4K and RD-260 HD multi-functional
      decoding cards, FD-360 4K multi-functional decoding card; the D350's
      one 3G-SDI and two HDMI outputs, any two of which carry the two
      outputs (https://www.kiloview.com/en/products/decoders/d260/,
      https://enstatic.kiloview.com/wp-content/uploads/2025/08/D350-D260-Decoder-User-Manual-V2.120250528.pdf,
      default login admin / admin).
  - title: "HTTP API of Decoders (Device HTTP API), kiloview.com docs"
    author: Kiloview
    url: "https://www.kiloview.com/en/docs/device-http-api/"
    note: >
      Read and not used: an older API with paths ending in .json
      (/api/info/get.json, /api/output/get.json?output=1), login by query
      user and password, and modules this family has no trace of (sip/GB28181,
      streamer publishing points, encode, platform, MsgCode). It names no
      model, so it is a different family that this spec does not cover.

settings:
  scheme:
    type: enum
    values: [http, https]
    default: http
    label: Scheme
    description: "http, or https where the decoder's HTTPS port is enabled; its certificate is not checked."
  username:
    type: string
    default: admin
    max_length: 64
    label: User name
    description: "The user the token belongs to, sent with it in the app header; admin by default."
  token:
    type: string
    secret: true
    default: ""
    max_length: 256
    label: Token
    description: "The token the login command returns for that user; every request carries it in the app header (with an empty token until it is set, which only the login accepts)."

ports:
  - { port: 80, protocol: http, role: control, when: "scheme http" }
  - { port: 443, protocol: https, role: control, setting: scheme, when: "scheme https" }

transport:
  type: http
  port: 80
  https_port: 443
  scheme: { setting: scheme }
  accept_invalid_certs: true
  auth: none
  timeout_ms: 5000
  # Sections 2-3: every request carries the header app, a JSON object with
  # the user name and the login's token (empty until the token setting is
  # filled; only the login works then).
  headers:
    app: '{"username":{settings.username:json},"token":{settings.token:json}}'
  probe: { method: GET, path: /api/info/get }

maps:
  dhcp: { "true": "y", "false": "n" }
  rtmp_security: { none: "", token: "token" }
  ndi_discovery_method: { public: "1", manual: "2", group: "3", server: "4" }
  white_balance: { auto: ptz_white_balance_auto, indoor: ptz_white_balance_indoor, outdoor: ptz_white_balance_outdoor, oneshot: ptz_white_balance_oneshot }

models:
  - id: d350
    name: Kiloview D350 4K multi-functional decoder
    supports: &all
      - login
      - logout
      - get_info
      - list_users
      - add_user
      - remove_user
      - change_password
      - list_overlays
      - select_overlay
      - list_source_groups
      - add_source_group
      - rename_source_group
      - remove_source_group
      - add_streams
      - add_rtsp_stream
      - add_rtmp_stream
      - add_plain_stream
      - add_srt_stream
      - add_srt_listener_stream
      - add_rtmp_server_stream
      - add_rtp_stream
      - add_ndi_stream
      - modify_stream
      - modify_rtsp_stream
      - modify_rtmp_stream
      - modify_plain_stream
      - modify_srt_stream
      - modify_srt_listener_stream
      - modify_rtmp_server_stream
      - modify_rtp_stream
      - modify_ndi_stream
      - remove_stream
      - copy_stream
      - move_stream
      - list_layout_templates
      - list_layouts
      - add_layout
      - remove_layout
      - select_layout
      - modify_layout
      - modify_layout_pane
      - save_layout
      - save_layout_as
      - reload_layout
      - rename_layout
      - get_output_interfaces
      - set_audio_interface
      - list_outputs
      - get_output
      - set_window_source
      - set_window_source_raw
      - move_window_source
      - clear_window
      - list_resolutions
      - set_resolution
      - get_audio_mix
      - set_audio_mix
      - remove_audio_mix
      - add_audio_mix
      - ptz_zoom
      - ptz_zoom_speed
      - ptz_pan_tilt
      - ptz_pan_tilt_speed
      - ptz_store_preset
      - ptz_recall_preset
      - ptz_auto_focus
      - ptz_focus
      - ptz_focus_speed
      - ptz_white_balance
      - ptz_white_balance_manual
      - ptz_exposure_auto
      - ptz_exposure_manual
      - ptz_is_supported
      - get_audio_levels
      - set_border
      - get_border
      - set_background
      - get_background
      - check_audio
      - get_network
      - set_network
      - set_maintenance_address
      - get_http_ports
      - set_http_ports
      - ping
      - list_routes
      - add_route
      - modify_route
      - set_route_enabled
      - delete_route
      - get_time_settings
      - set_time
      - set_timezone
      - reboot
      - reset
      - restore_factory
      - get_device_name
      - set_device_name
      - parse_url
      - replace_url_address
      - upgrade_firmware
      - get_preview
      - add_preview_source
      - remove_preview_source
      - get_ndi_discovery
      - list_ndi_sources
      - set_ndi_manual_discovery
      - add_ndi_group_discovery
      - remove_ndi_group_discovery
      - add_ndi_discovery_server
      - remove_ndi_discovery_server
    verification: none
  - id: d260
    name: Kiloview D260 HD multi-functional decoder
    supports: *all
    verification: none
  - id: rd-350
    name: Kiloview RD-350 4K multi-functional decoding card
    supports: *all
    verification: none
  - id: rd-260
    name: Kiloview RD-260 HD multi-functional decoding card
    supports: *all
    verification: none
  - id: fd-360
    name: Kiloview FD-360 4K multi-functional decoding card
    supports: *all
    verification: none

# Every reply is {"result":"ok"} with data, or {"result":"error","msg":code}
# (section 1). Writes are read back by the telemetry rules' then_send on
# their "ok" reply.
commands:
  # --- Users (section 6) ---
  login:
    summary: "Log in and return the token for the token setting (POST /api/users/login)"
    params:
      username: { type: string, default: admin, max_length: 64, label: User name, description: "The account to log in as; admin by default." }
      password: { type: string, secret: true, required: true, max_length: 64, label: Password, description: "That account's password; admin until it is changed." }
    send: { method: POST, path: /api/users/login, content_type: application/json,
            body: '{"username":{username:json},"password":{password:json}}' }
    expect: { status: 200, json_path: "$.data.token" }
    returns: value
  logout:
    summary: "End the token setting's login (POST /api/users/logout)"
    send: { method: POST, path: /api/users/logout, content_type: application/json, body: '{"token":{settings.token:json}}' }
    expect: &ok { status: 200, json_equals: { "$.result": "ok" } }
    returns: ack
  list_users:
    summary: "Accounts with id, user name, alias, role, phone and description (GET /api/users/list)"
    send: { method: GET, path: /api/users/list }
    expect: { status: 200, json_path: "$" }
    returns: value
  add_user:
    summary: "Create an account (POST /api/users/add)"
    params:
      username: { type: string, required: true, max_length: 64, label: User name, description: "The new account's login name." }
      password: { type: string, secret: true, required: true, max_length: 64, label: Password, description: "The new account's password." }
      alias: { type: string, default: "", max_length: 64, label: Alias, description: "A display name for the account." }
      role: { type: string, default: user, max_length: 32, label: Role, description: "The account's role, as the document's examples give them: admin or user." }
      phone: { type: string, default: "", max_length: 32, label: Phone, description: "A contact number, or empty." }
      description: { type: string, default: "", max_length: 256, label: Description, description: "A free-text description, or empty." }
    send: { method: POST, path: /api/users/add, content_type: application/json,
            body: '{"username":{username:json},"password":{password:json},"alias":{alias:json},"role":{role:json},"phone":{phone:json},"descript":{description:json}}' }
    expect: *ok
    returns: ack
  remove_user:
    summary: "Delete an account by id (POST /api/users/remove)"
    params:
      id: { type: int, min: 0, required: true, label: User id, description: "The account's id, as list_users gives it." }
    send: { method: POST, path: /api/users/remove, content_type: application/json, body: '{"id":{id}}' }
    expect: *ok
    returns: ack
  change_password:
    summary: "Change an account's password (POST /api/users/modify)"
    params:
      username: { type: string, required: true, max_length: 64, label: User name, description: "The account whose password changes." }
      password: { type: string, secret: true, required: true, max_length: 64, label: New password, description: "The new password; it is sent twice, as password and passwordAgain." }
    send: { method: POST, path: /api/users/modify, content_type: application/json,
            body: '{"username":{username:json},"password":{password:json},"passwordAgain":{password:json}}' }
    expect: *ok
    returns: ack

  # --- Info and system (sections 5, 13, 14) ---
  get_info:
    summary: "Device name, firmware, hardware and software versions, serial number (GET /api/info/get)"
    send: { method: GET, path: /api/info/get }
    expect: &val { status: 200, json_equals: { "$.result": "ok" }, json_path: "$.data" }
    returns: value
  get_device_name:
    summary: "The device name (GET /api/sys/device/get)"
    send: { method: GET, path: /api/sys/device/get }
    expect: { status: 200, json_equals: { "$.result": "ok" }, json_path: "$.data.device_name" }
    returns: value
  set_device_name:
    summary: "Set the device name (POST /api/sys/device/set)"
    params:
      name: { type: string, required: true, max_length: 64, label: Device name, description: "The name the decoder shows and announces." }
    send: { method: POST, path: /api/sys/device/set, content_type: application/json, body: '{"device_name":{name:json}}' }
    expect: *ok
    returns: ack
  reboot:
    summary: "Restart the decoder; outputs stop until it is back (GET /api/sys/reboot)"
    send: { method: GET, path: /api/sys/reboot }
    expect: *ok
    returns: ack
  reset:
    summary: "System reset (GET /api/sys/reset)"
    send: { method: GET, path: /api/sys/reset }
    expect: *ok
    returns: ack
  restore_factory:
    summary: "Restore factory settings (GET /api/sys/restore)"
    send: { method: GET, path: /api/sys/restore }
    expect: *ok
    returns: ack
  parse_url:
    summary: "The address, port and path of a stream URL, as the decoder reads it (POST /api/sys/ip/get)"
    params:
      url: { type: string, required: true, max_length: 1024, label: URL, description: "A stream URL such as ndi://10.20.30.21:5961." }
    send: { method: POST, path: /api/sys/ip/get, content_type: application/json, body: '{"url":{url:json}}' }
    expect: *val
    returns: value
  replace_url_address:
    summary: "A stream URL with its address and port replaced (POST /api/sys/ip/replace)"
    params:
      url: { type: string, required: true, max_length: 1024, label: URL, description: "The stream URL to rewrite, such as srt://192.168.1.1:13?streamid=a." }
      address: { type: string, required: true, max_length: 255, label: Address, description: "The address to put in the URL." }
      port: { type: string, required: true, pattern: "^[0-9]{1,5}$", label: Port, description: "The port to put in the URL, as digits." }
    send: { method: POST, path: /api/sys/ip/replace, content_type: application/json,
            body: '{"url":{url:json},"target_ip":{address:json},"target_port":{port:json}}' }
    expect: { status: 200, json_equals: { "$.result": "ok" }, json_path: "$.data.url" }
    returns: value
  upgrade_firmware:
    summary: "Upload a firmware file and upgrade; the decoder restarts (POST /api/firmware/upgrade)"
    params:
      file: { type: binary, required: true, label: Firmware file, description: "The firmware image for this model, such as firmware-D350-kiloview-x.xx.xxxx-yyyymmdd.bin." }
      filename: { type: string, default: firmware.bin, max_length: 255, label: File name, description: "The file name sent with the upload." }
    send:
      method: POST
      path: /api/firmware/upgrade
      multipart:
        - { name: upload, binary: file, filename: "{filename}", content_type: application/octet-stream }
    expect: *ok
    returns: ack

  # --- Overlays (section 7) ---
  list_overlays:
    summary: "Overlay templates of an output, with the one selected (GET /api/overlay/list)"
    params:
      output: &output { type: int, min: 1, max: 2, required: true, label: Output, description: "The decoder output, 1 or 2." }
    send: { method: GET, path: /api/overlay/list, query: { output_id: "{output}" } }
    expect: *val
    returns: value
  select_overlay:
    summary: "Select an overlay template on an output (POST /api/overlay/select)"
    params:
      output: *output
      overlay: { type: int, min: 0, required: true, label: Overlay, description: "The template id, as list_overlays gives it." }
    send: { method: POST, path: /api/overlay/select, content_type: application/json, body: '{"overlay_id":{overlay},"output_id":{output}}' }
    expect: *ok
    returns: ack

  # --- Sources (section 8) ---
  list_source_groups:
    summary: "Source groups with their streams and each stream's status (POST /api/source/groups/list)"
    send: { method: POST, path: /api/source/groups/list, content_type: application/json, body: '{"is_need_stream":true}' }
    expect: *val
    returns: value
  add_source_group:
    summary: "Create a source group (POST /api/source/groups/add)"
    params:
      name: { type: string, required: true, max_length: 64, label: Group name, description: "The new group's name." }
    send: { method: POST, path: /api/source/groups/add, content_type: application/json, body: '{"name":{name:json}}' }
    expect: *ok
    returns: ack
  rename_source_group:
    summary: "Rename a source group (POST /api/source/groups/rename)"
    params:
      group: &group { type: string, required: true, max_length: 64, label: Group, description: "The group id, as list_source_groups gives it." }
      name: { type: string, required: true, max_length: 64, label: Group name, description: "The group's new name." }
    send: { method: POST, path: /api/source/groups/rename, content_type: application/json, body: '{"group_id":{group:json},"name":{name:json}}' }
    expect: *ok
    returns: ack
  remove_source_group:
    summary: "Delete a source group (POST /api/source/groups/remove)"
    params:
      group: *group
    send: { method: POST, path: /api/source/groups/remove, content_type: application/json, body: '{"group_id":{group:json}}' }
    expect: *ok
    returns: ack
  add_streams:
    summary: "Add a stream with the request body of section 8 (3), POST /api/source/groups/streams/add: group_id, name, Type and the protocol's fields, or Type ndi with a data list of discovered NDI sources"
    params:
      body: { type: json, required: true, label: Request body, description: "The JSON object section 8 (3) gives for the stream's protocol." }
    send: { method: POST, path: /api/source/groups/streams/add, content_type: application/json, body: "{body}" }
    expect: *ok
    returns: ack
  add_rtsp_stream:
    summary: "Add an RTSP stream to a group (POST /api/source/groups/streams/add, Type rtsp)"
    params: &rtsp_params
      group: *group
      name: &stream_name { type: string, required: true, max_length: 128, label: Name, description: "The stream's name; it may not be empty." }
      url: &stream_url { type: string, required: true, max_length: 1024, label: URL, description: "The stream address, such as rtsp://192.168.1.20:554/ch01." }
      transport: { type: enum, values: [tcp, udp], default: tcp, label: RTSP transport, description: "Whether RTSP media comes over TCP or UDP." }
      buffer: &buffer { type: string, default: "live:0:0:0:0:0", max_length: 64, label: Buffer, description: "The cache setting in the device's form live:a:b:c:d:e, such as live:200:200:500:0:0." }
      connect_speed: &connect_speed { type: int, min: 0, default: 5000, label: Connection timeout, description: "The connection timeout in milliseconds; 5000 in the document's examples." }
      audio_sync: &audio_sync { type: int, default: 0, label: Audio delay, description: "Audio synchronization compensation in milliseconds." }
      user: &stream_user { type: string, default: "", max_length: 128, label: User, description: "The account the source asks for, or empty." }
      password: &stream_password { type: string, secret: true, default: "", max_length: 128, label: Password, description: "That account's password, or empty." }
    send: { method: POST, path: /api/source/groups/streams/add, content_type: application/json,
            body: '{"group_id":{group:json},"name":{name:json},"Type":"rtsp","url":{url:json},"buffer":{buffer:json},"trans_mode":"{transport}","connect_speed":{connect_speed},"audio_sync_compst":{audio_sync},"user":{user:json},"password":{password:json}}' }
    expect: *ok
    returns: ack
  add_rtmp_stream:
    summary: "Add an RTMP or RTMPS pull stream to a group (POST /api/source/groups/streams/add, Type rtmp or rtmps)"
    params: &rtmp_params
      group: *group
      type: { type: enum, values: [rtmp, rtmps], default: rtmp, label: Protocol, description: "RTMP, or RTMP over TLS." }
      name: *stream_name
      url: *stream_url
      buffer: *buffer
      connect_speed: *connect_speed
      audio_sync: *audio_sync
      user: *stream_user
      password: *stream_password
    send: { method: POST, path: /api/source/groups/streams/add, content_type: application/json,
            body: '{"group_id":{group:json},"name":{name:json},"Type":"{type}","url":{url:json},"buffer":{buffer:json},"connect_speed":{connect_speed},"audio_sync_compst":{audio_sync},"user":{user:json},"password":{password:json}}' }
    expect: *ok
    returns: ack
  add_plain_stream:
    summary: "Add a UDP, HTTP or HTTPS stream to a group (POST /api/source/groups/streams/add, Type udp, http or https)"
    params: &plain_params
      group: *group
      type: { type: enum, values: [udp, http, https], required: true, label: Protocol, description: "The stream's protocol." }
      name: *stream_name
      url: *stream_url
      buffer: *buffer
      connect_speed: *connect_speed
      audio_sync: *audio_sync
    send: { method: POST, path: /api/source/groups/streams/add, content_type: application/json,
            body: '{"group_id":{group:json},"name":{name:json},"Type":"{type}","url":{url:json},"buffer":{buffer:json},"connect_speed":{connect_speed},"audio_sync_compst":{audio_sync}}' }
    expect: *ok
    returns: ack
  add_srt_stream:
    summary: "Add an SRT caller or rendezvous stream to a group (POST /api/source/groups/streams/add, Type srt)"
    params: &srt_params
      group: *group
      name: *stream_name
      mode: { type: enum, values: [Caller, Rendezvous], default: Caller, label: SRT mode, description: "Caller connects to the sender; Rendezvous meets a sender that also connects." }
      url: { type: string, required: true, max_length: 1024, label: URL, description: "The SRT address, such as srt://192.168.1.59:1025." }
      address: { type: string, required: true, max_length: 255, label: Address, description: "The sender's address, the same as in the URL." }
      port: &srt_port { type: int, min: 1, max: 65535, required: true, label: Port, description: "The SRT port." }
      latency: &srt_latency { type: int, min: 0, default: 125, label: Latency, description: "SRT latency in milliseconds." }
      stream_id: &srt_id { type: string, default: "", max_length: 512, label: Stream ID, description: "The SRT stream id, or empty." }
      encryption: &srt_encryption { type: enum, values: [none, AES-128, AES-192, AES-256], default: none, label: Encryption, description: "SRT encryption, none or the AES key length." }
      passphrase: &srt_passphrase { type: string, secret: true, default: "", max_length: 79, label: Passphrase, description: "The SRT passphrase when encrypted, or empty." }
      bandwidth: &srt_bandwidth { type: int, min: 0, default: 25, label: Bandwidth overhead, description: "SRT recovery bandwidth overhead in percent." }
      payload_size: &srt_payload { type: int, min: 0, default: 1316, label: Payload size, description: "SRT payload size in bytes." }
      buffer: *buffer
      connect_speed: *connect_speed
      audio_sync: *audio_sync
    send: { method: POST, path: /api/source/groups/streams/add, content_type: application/json,
            body: '{"group_id":{group:json},"name":{name:json},"Type":"srt","url":{url:json},"buffer":{buffer:json},"connection_mode":"{mode}","address":{address:json},"listener_port":{port},"latency":{latency},"connect_speed":{connect_speed},"audio_sync_compst":{audio_sync},"show_advanced":"1","srt_id":{stream_id:json},"encryption":"{encryption}","passphrase":{passphrase:json},"bandwidth":{bandwidth},"payload_size":{payload_size}}' }
    expect: *ok
    returns: ack
  add_srt_listener_stream:
    summary: "Add an SRT listener stream to a group; the URL is srt://:port (POST /api/source/groups/streams/add, Type srt, Listener)"
    params: &srt_listener_params
      group: *group
      name: *stream_name
      port: *srt_port
      latency: *srt_latency
      stream_id: *srt_id
      encryption: *srt_encryption
      passphrase: *srt_passphrase
      bandwidth: *srt_bandwidth
      payload_size: *srt_payload
      buffer: *buffer
      connect_speed: *connect_speed
      audio_sync: *audio_sync
    send: { method: POST, path: /api/source/groups/streams/add, content_type: application/json,
            body: '{"group_id":{group:json},"name":{name:json},"Type":"srt","url":"srt://:{port}","buffer":{buffer:json},"connection_mode":"Listener","listener_port":{port},"latency":{latency},"connect_speed":{connect_speed},"audio_sync_compst":{audio_sync},"show_advanced":"1","srt_id":{stream_id:json},"encryption":"{encryption}","passphrase":{passphrase:json},"bandwidth":{bandwidth},"payload_size":{payload_size}}' }
