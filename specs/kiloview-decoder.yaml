  set_background:
    summary: "Turn an output's background color on or off and set it (POST /api/output/background/set)"
    params:
      output: *output
      enabled: { type: bool, required: true, label: Background, description: "Whether the background color is used." }
      color: *color
    send: { method: POST, path: /api/output/background/set, content_type: application/json, body: '{"output_id":"{output}","enable":{enabled},"background":"{color}"}' }
    expect: *ok
