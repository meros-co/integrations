    params:
      output: *output
      stream: *stream
      list: *mix_list
    send: { method: POST, path: /api/output/audiomix/remove, content_type: application/json, body: '{"output_id":"{output}","stream_id":{stream:json},"Type":"{list}"}' }
    expect: *ok
    returns: ack
  add_audio_mix:
    summary: "Add a previewed stream's audio to an output's mix list (POST /api/output/audiomix/add)"
    params:
