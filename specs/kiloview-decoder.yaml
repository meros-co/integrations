  # --- PTZ of a window's NDI source (section 10 (12)) ---
  ptz_zoom:
    summary: "Zoom the NDI camera in a window to a position (POST /api/ptz/set, ptz_zoom)"
    params:
      output: *output
      window: *window
      value: { type: float, min: 0.0, max: 1.0, required: true, label: Zoom, description: "0.0 zoomed in to 1.0 zoomed out." }
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_zoom","data":{"zoom_value":{value:.3f}}}' }
    expect: *ok
    returns: ack
  ptz_zoom_speed:
    summary: "Zoom the NDI camera in a window at a speed; send 0 to stop (POST /api/ptz/set, ptz_zoom_speed)"
    params:
      output: *output
      window: *window
      speed: { type: float, min: -1.0, max: 1.0, required: true, label: Zoom speed, description: "-1.0 zooms out, 0 stops, +1.0 zooms in." }
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_zoom_speed","data":{"zoom_speed":{speed:.3f}}}' }
    expect: *ok
    returns: ack
  ptz_pan_tilt:
    summary: "Point the NDI camera in a window (POST /api/ptz/set, ptz_pan_tilt)"
    params:
      output: *output
      window: *window
      pan: { type: float, min: -1.0, max: 1.0, required: true, label: Pan, description: "-1.0 left, 0 centered, +1.0 right." }
      tilt: { type: float, min: -1.0, max: 1.0, required: true, label: Tilt, description: "-1.0 bottom, 0 centered, +1.0 top." }
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_pan_tilt","data":{"pan_value":{pan:.3f},"tilt_value":{tilt:.3f}}}' }
    expect: *ok
    returns: ack
  ptz_pan_tilt_speed:
    summary: "Move the NDI camera in a window at a speed; send 0, 0 to stop (POST /api/ptz/set, ptz_pan_tilt_speed)"
    params:
      output: *output
      window: *window
      pan_speed: { type: float, min: -1.0, max: 1.0, required: true, label: Pan speed, description: "-1.0 moves right, 0 stops, +1.0 moves left." }
      tilt_speed: { type: float, min: -1.0, max: 1.0, required: true, label: Tilt speed, description: "-1.0 moves down, 0 stops, +1.0 moves up." }
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_pan_tilt_speed","data":{"pan_speed":{pan_speed:.3f},"tilt_speed":{tilt_speed:.3f}}}' }
    expect: *ok
    returns: ack
  ptz_store_preset:
    summary: "Store the NDI camera's position as a preset (POST /api/ptz/set, ptz_store_preset)"
    params:
      output: *output
      window: *window
      preset: &preset { type: int, min: 0, max: 99, required: true, label: Preset, description: "The preset number, 0 to 99." }
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_store_preset","data":{"preset_no":{preset}}}' }
    expect: *ok
    returns: ack
  ptz_recall_preset:
    summary: "Move the NDI camera to a preset (POST /api/ptz/set, ptz_recall_preset)"
    params:
      output: *output
      window: *window
      preset: *preset
      speed: { type: float, min: 0.0, max: 1.0, default: 0.5, label: Speed, description: "0.0 as slow as possible to 1.0 as fast as possible." }
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_recall_preset","data":{"preset_no":{preset},"speed":{speed:.3f}}}' }
    expect: *ok
    returns: ack
  ptz_auto_focus:
    summary: "Turn on the NDI camera's auto focus (POST /api/ptz/set, ptz_auto_focus)"
    params: &ptz_window
      output: *output
      window: *window
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_auto_focus","data":{}}' }
    expect: *ok
    returns: ack
  ptz_focus:
    summary: "Focus the NDI camera to a position (POST /api/ptz/set, ptz_focus)"
    params:
      output: *output
      window: *window
      value: { type: float, min: 0.0, max: 1.0, required: true, label: Focus, description: "0.0 focused at infinity to 1.0 focused as close as possible." }
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_focus","data":{"focus_value":{value:.3f}}}' }
    expect: *ok
    returns: ack
  ptz_focus_speed:
    summary: "Focus the NDI camera at a speed; send 0 to stop (POST /api/ptz/set, ptz_focus_speed)"
    params:
      output: *output
      window: *window
      speed: { type: float, min: -1.0, max: 1.0, required: true, label: Focus speed, description: "-1.0 focuses outwards, 0 stops, +1.0 focuses inwards." }
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_focus_speed","data":{"focus_speed":{speed:.3f}}}' }
    expect: *ok
    returns: ack
  ptz_white_balance:
    summary: "Set the NDI camera's white balance mode (POST /api/ptz/set, ptz_white_balance_auto, _indoor, _outdoor or _oneshot)"
    params:
      output: *output
      window: *window
      mode: { type: enum, values: [auto, indoor, outdoor, oneshot], required: true, label: White balance, description: "Automatic, indoor, outdoor, or a one-time adjustment." }
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"{mode:map.white_balance}","data":{}}' }
    expect: *ok
    returns: ack
  ptz_white_balance_manual:
    summary: "Set the NDI camera's white balance by hand (POST /api/ptz/set, ptz_white_balance_manual)"
    params:
      output: *output
      window: *window
      red: { type: float, min: 0.0, max: 1.0, required: true, label: Red, description: "0.0 not red to 1.0 very red." }
      blue: { type: float, min: 0.0, max: 1.0, required: true, label: Blue, description: "0.0 not blue to 1.0 very blue." }
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_white_balance_manual","data":{"red":{red:.3f},"blue":{blue:.3f}}}' }
    expect: *ok
    returns: ack
  ptz_exposure_auto:
    summary: "Turn on the NDI camera's auto exposure (POST /api/ptz/set, ptz_exposure_auto)"
    params: *ptz_window
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_exposure_auto","data":{}}' }
    expect: *ok
    returns: ack
  ptz_exposure_manual:
    summary: "Set the NDI camera's exposure by hand (POST /api/ptz/set, ptz_exposure_manual)"
    params:
      output: *output
      window: *window
      level: { type: float, min: 0.0, max: 1.0, required: true, label: Exposure, description: "0.0 dark to 1.0 light." }
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_exposure_manual","data":{"exposure_level":{level:.3f}}}' }
    expect: *ok
    returns: ack
  ptz_is_supported:
    summary: "Whether the NDI source in a window supports PTZ; returns the reply (POST /api/ptz/set, ptz_is_supported)"
    params: *ptz_window
    send: { method: POST, path: /api/ptz/set, content_type: application/json,
            body: '{"output_id":"{output}","pos_id":{window},"Type":"ptz_is_supported","data":{}}' }
    expect: { status: 200, json_equals: { "$.result": "ok" }, json_path: "$" }
    returns: value

  # --- Network (section 11) ---
  get_network:
    summary: "Network ports with address, DHCP, gateway, DNS, MAC, link and the maintenance address (GET /api/network/get)"
    send: { method: GET, path: /api/network/get }
    expect: *val
    returns: value
  set_network:
    summary: "Set a network port's address, DHCP, gateway and DNS (POST /api/network/set)"
    params:
      interface: &interface { type: string, required: true, pattern: "^[A-Za-z0-9_.-]{1,16}$", label: Network port, description: "The port's name, as get_network gives it: eth0 or eth1." }
      dhcp: { type: bool, required: true, label: DHCP, description: "On takes the address from DHCP; off uses the address given." }
      ip: &ipv4 { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: IP address, description: "An IPv4 address, such as 192.168.1.168." }
      mask: &mask { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Subnet mask, description: "The subnet mask, such as 255.255.255.0." }
      gateway: { type: string, default: "", pattern: "^([0-9]{1,3}(\\.[0-9]{1,3}){3})?$", label: Gateway, description: "The gateway address, or empty for none." }
      dns: { type: string, default: "", max_length: 255, label: DNS, description: "The DNS server address, or empty." }
      mac: { type: string, required: true, pattern: "^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$", label: MAC address, description: "The port's MAC address, as get_network gives it." }
    send: { method: POST, path: /api/network/set, content_type: application/json,
            body: '{"device":"{interface}","dynamic":"{dhcp:map.dhcp}","ip":"{ip}","mask":"{mask}","gw":"{gateway}","dns":{dns:json},"mac":"{mac}"}' }
    expect: *ok
    returns: ack
  set_maintenance_address:
    summary: "Turn a network port's second (maintenance) address on or off and set it (POST /api/network/modify)"
    params:
      interface: *interface
      enabled: { type: bool, required: true, label: Maintenance address, description: "Whether the port also answers on the maintenance address." }
      ip: *ipv4
      mask: *mask
      gateway: { type: string, default: "", pattern: "^([0-9]{1,3}(\\.[0-9]{1,3}){3})?$", label: Gateway, description: "The maintenance address's gateway, or empty for none." }
    send: { method: POST, path: /api/network/modify, content_type: application/json,
            body: '{"device":"{interface}","enable2":{enabled},"ip2":"{ip}","mask2":"{mask}","gw2":"{gateway}"}' }
    expect: *ok
    returns: ack
  get_http_ports:
    summary: "Whether HTTP and HTTPS are on, and their ports (GET /api/network/http/get)"
    send: { method: GET, path: /api/network/http/get }
    expect: *val
    returns: value
  set_http_ports:
    summary: "Turn HTTP and HTTPS on or off and set their ports (POST /api/network/http/set)"
    params:
      http: { type: bool, required: true, label: HTTP, description: "Whether the web server answers HTTP." }
      http_port: { type: int, min: 1, max: 65535, default: 80, label: HTTP port, description: "The HTTP port, 80 by default." }
      https: { type: bool, required: true, label: HTTPS, description: "Whether the web server answers HTTPS." }
      https_port: { type: int, min: 1, max: 65535, default: 443, label: HTTPS port, description: "The HTTPS port, 443 by default." }
    send: { method: POST, path: /api/network/http/set, content_type: application/json,
            body: '{"http":{http},"httpPort":{http_port},"https":{https},"httpsPort":{https_port}}' }
    expect: *ok
    returns: ack
  ping:
    summary: "Ping an address from the decoder; returns its loss rate and whether it answered (POST /api/network/ping)"
    params:
      address: { type: string, required: true, max_length: 255, label: Address, description: "The address to ping." }
    send: { method: POST, path: /api/network/ping, content_type: application/json, body: '{"ip":{address:json}}' }
    expect: *val
    returns: value
  list_routes:
    summary: "Static routes (GET /api/network/routing/get)"
    send: { method: GET, path: /api/network/routing/get }
    expect: *val
    returns: value
  add_route:
    summary: "Add a static route (POST /api/network/routing/add)"
    params: &route_params
      interface: *interface
      ip: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Destination, description: "The route's destination address." }
      netmask: *mask
      gateway: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Gateway, description: "The gateway the route goes through." }
      mtu: { type: int, min: 1, default: 1500, label: MTU, description: "The route's MTU in bytes." }
      metric: { type: int, min: 0, default: 0, label: Metric, description: "The route's metric; lower is preferred." }
    send: { method: POST, path: /api/network/routing/add, content_type: application/json,
            body: '{"device":"{interface}","ip":"{ip}","netmask":"{netmask}","gw":"{gateway}","mtu":{mtu},"metric":{metric}}' }
    expect: *ok
    returns: ack
  modify_route:
    summary: "Change a static route (POST /api/network/routing/modify)"
    params:
      id: &route_id { type: string, required: true, max_length: 64, label: Route, description: "The route's id, as list_routes gives it." }
      interface: *interface
      ip: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Destination, description: "The route's destination address." }
      netmask: *mask
      gateway: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Gateway, description: "The gateway the route goes through." }
      mtu: { type: int, min: 1, default: 1500, label: MTU, description: "The route's MTU in bytes." }
      metric: { type: int, min: 0, default: 0, label: Metric, description: "The route's metric; lower is preferred." }
    send: { method: POST, path: /api/network/routing/modify, content_type: application/json,
            body: '{"id":{id:json},"device":"{interface}","ip":"{ip}","netmask":"{netmask}","gw":"{gateway}","mtu":{mtu},"metric":{metric}}' }
    expect: *ok
    returns: ack
  set_route_enabled:
    summary: "Turn a static route on or off (POST /api/network/routing/set)"
    params:
      id: *route_id
      enabled: { type: bool, required: true, label: Enabled, description: "Whether the route is used." }
    send: { method: POST, path: /api/network/routing/set, content_type: application/json, body: '{"id":{id:json},"status":{enabled:bool01}}' }
    expect: *ok
    returns: ack
  delete_route:
    summary: "Delete a static route (POST /api/network/routing/del)"
    params:
      id: *route_id
    send: { method: POST, path: /api/network/routing/del, content_type: application/json, body: '{"ids":{id:json}}' }
    expect: *ok
    returns: ack

  # --- Time (section 12) ---
  get_time_settings:
    summary: "Time, time zone, offset, time source and NTP servers (GET /api/timeregion/settings)"
    send: { method: GET, path: /api/timeregion/settings }
    expect: *val
    returns: value
  set_time:
    summary: "Set the time source and time: NTP servers, the controlling computer's time, or a manual time (POST /api/timeregion/time/set)"
    params:
      mode: { type: enum, values: [ntp, pc, manual], required: true, label: Time source, description: "ntp follows the NTP servers; pc and manual take the time given." }
      time: { type: string, required: true, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$", label: Time, description: "The time as YYYY-MM-DD HH:MM:SS." }
      offset: &tz_offset { type: int, min: -12, max: 14, required: true, label: UTC offset, description: "The time zone's offset from UTC in hours, such as 8." }
      ntp_servers: { type: string, default: "", max_length: 512, label: NTP servers, description: "NTP server names separated by spaces; empty unless the source is ntp." }
    send: { method: POST, path: /api/timeregion/time/set, content_type: application/json,
            body: '{"time":"{time}","timeType":"{mode}","offset":{offset},"ntp_servers":{ntp_servers:json}}' }
    expect: *ok
    returns: ack
  set_timezone:
    summary: "Set the time zone (POST /api/timeregion/timezone/set)"
    params:
      timezone: { type: string, required: true, max_length: 64, label: Time zone, description: "The time zone name, such as Europe/London." }
      offset: *tz_offset
    send: { method: POST, path: /api/timeregion/timezone/set, content_type: application/json, body: '{"timezone":{timezone:json},"offset":{offset}}' }
    expect: *ok
    returns: ack

  # --- Preview (section 15) ---
  get_preview:
    summary: "Sources in the preview, each with its status and resolution (GET /api/preview/get)"
    send: { method: GET, path: /api/preview/get }
    expect: *val
    returns: value
  add_preview_source:
    summary: "Add a source stream to the preview (POST /api/preview/source/modify)"
    params:
      output: *output
      stream: *stream
      stream_name: { type: string, required: true, max_length: 256, label: Stream name, description: "The stream's name, as list_source_groups gives it." }
      stream_url: { type: string, required: true, max_length: 1024, label: Stream URL, description: "The stream's URL, as list_source_groups gives it." }
    send: { method: POST, path: /api/preview/source/modify, content_type: application/json,
            body: '{"from":{"Type":"source","stream_id":{stream:json},"stream_name":{stream_name:json},"stream_url":{stream_url:json},"pos_id":"","output_id":"{output}","layout_id":""},"to":{"Type":"preview","stream_id":{stream:json},"stream_name":{stream_name:json},"stream_url":{stream_url:json},"output_id":"{output}","layout_id":""}}' }
    expect: *ok
    returns: ack
  remove_preview_source:
    summary: "Remove a source from the preview (POST /api/preview/source/remove)"
    params:
      position: { type: int, min: 1, required: true, label: Preview position, description: "The preview position id, as get_preview gives it." }
    send: { method: POST, path: /api/preview/source/remove, content_type: application/json, body: '{"id":{position},"pos_id":{position}}' }
    expect: *ok
    returns: ack

  # --- NDI discovery (section 16) ---
  get_ndi_discovery:
    summary: "NDI discovery entries: public, by group, manual addresses and discovery servers (GET /api/ndi/discovery/all)"
    send: { method: GET, path: /api/ndi/discovery/all }
    expect: *val
    returns: value
  list_ndi_sources:
    summary: "NDI sources found by one discovery method (GET /api/ndi/discovery/sources)"
    params:
      method: { type: enum, values: [public, manual, group, server], default: public, label: Discovery, description: "public automatic discovery, manual addresses, automatic discovery in a group, or a discovery server." }
      group: { type: string, default: "", max_length: 128, label: NDI group, description: "The group name; needed for group and server." }
      server: { type: string, default: "", max_length: 255, label: Discovery server, description: "The discovery server's address; needed for server." }
    send: { method: GET, path: /api/ndi/discovery/sources,
            query: { dis_method: "{method:map.ndi_discovery_method}", dis_g_name: "{group}", dis_s_ip: "{server}" } }
    expect: *val
    returns: value
  set_ndi_manual_discovery:
    summary: "Replace the manual NDI discovery list (POST /api/ndi/discovery/manual/add): the entries given are all that remain"
    params:
      entries: { type: json, required: true, label: Entries, description: "The manuals array: objects with dis_d_ip (an address to search) and dis_g_name (its NDI group)." }
    send: { method: POST, path: /api/ndi/discovery/manual/add, content_type: application/json, body: '{"manuals":{entries}}' }
    expect: *ok
    returns: ack
  add_ndi_group_discovery:
    summary: "Add automatic NDI discovery in a group (POST /api/ndi/discovery/auto/add)"
    params:
      group: { type: string, required: true, max_length: 128, label: NDI group, description: "The NDI group to discover in." }
    send: { method: POST, path: /api/ndi/discovery/auto/add, content_type: application/json, body: '{"dis_g_name":{group:json}}' }
    expect: *ok
    returns: ack
  remove_ndi_group_discovery:
    summary: "Remove automatic NDI discovery in a group (POST /api/ndi/discovery/auto/del)"
    params:
      group: { type: string, required: true, max_length: 128, label: NDI group, description: "The group, as get_ndi_discovery gives it." }
      address: { type: string, default: "", max_length: 255, label: Address, description: "The entry's dis_d_ip as get_ndi_discovery gives it, usually empty." }
    send: { method: POST, path: /api/ndi/discovery/auto/del, content_type: application/json, body: '{"dis_d_ip":{address:json},"dis_g_name":{group:json}}' }
    expect: *ok
    returns: ack
  add_ndi_discovery_server:
    summary: "Add an NDI discovery server for a group (POST /api/ndi/discovery/server/add)"
    params: &ndi_server
      group: { type: string, default: public, max_length: 128, label: NDI group, description: "The NDI group." }
      server: { type: string, required: true, max_length: 255, label: Discovery server, description: "The discovery server's address." }
    send: { method: POST, path: /api/ndi/discovery/server/add, content_type: application/json, body: '{"dis_g_name":{group:json},"dis_s_ip":{server:json}}' }
    expect: *ok
    returns: ack
  remove_ndi_discovery_server:
    summary: "Remove an NDI discovery server entry (POST /api/ndi/discovery/server/del)"
    params: *ndi_server
    send: { method: POST, path: /api/ndi/discovery/server/del, content_type: application/json, body: '{"dis_s_ip":{server:json},"dis_g_name":{group:json}}' }
    expect: *ok
    returns: ack

