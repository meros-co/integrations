    send: { method: POST, path: /api/output/resolution/set, content_type: application/json, body: '{"output_id":"{output}","res_id":{resolution},"res_index":{resolution}}' }
    expect: *ok
    returns: ack
  get_audio_mix:
    summary: "An output's audio mix: the windows' and the preview's audio sources, each enabled, muted and its gain (GET /api/output/audiomix/get)"
    params:
      output: *output
    send: { method: GET, path: /api/output/audiomix/get, query: { output_id: "{output}" } }
    expect: *val
    returns: value
  set_audio_mix:
    summary: "Turn a stream's audio on or off in an output's mix, with its gain and mute (POST /api/output/audiomix/set)"
    params:
      output: *output
      stream: *stream
      enabled: { type: bool, required: true, label: Enabled, description: "Whether the stream's audio is in the mix." }
      volume: { type: int, default: 0, label: Gain, description: "The stream's gain in dB." }
      muted: { type: bool, default: false, label: Muted, description: "Whether the stream's audio is muted." }
      list: &mix_list { type: enum, values: [output, preview], default: output, label: List, description: "output for the windows' audio, which follows the layout; preview for audio added from the preview." }
    send: { method: POST, path: /api/output/audiomix/set, content_type: application/json,
