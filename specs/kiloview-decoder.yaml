quirks:
  - models: [all]
    severity: warning
    text: >
      Authentication: the login (POST /api/users/login with username and
      password, admin / admin until changed) answers the token in its JSON
      body, and every other request must carry the header app holding the
      JSON object {"username": ..., "token": ...}. The core cannot take a
      token from a login's body, so the consumer runs the login command,
      puts the token it returns into the token setting with update_settings
      (and username if not admin), and the core then sends the header on
      every request. The document says a token can expire without giving its
      lifetime or how an expired token is answered; the consumer logs in
      again when commands start failing with an authentication error.
  - models: [all]
    severity: info
    text: >
      Every reply is {"result": "ok"} with its data, or {"result": "error",
      "msg": "<code>"} (section 1). Section 4 lists the codes in a table whose
      columns are misaligned in the PDF; read in order they are 0 success, 1
      parameter error, 2 authentication error, 100 output not found, 101
      video source not found, 102 audio source not found, 103 output
      interface not found, 104 layout template not found, 105 preset not
      found, 106 output interface not found, 107 layout out of range, 200
      group not found, 201 stream not found, 202 stream does not exist, 203
      NDI server duplicate, 204 stream repeat, 205 unsupported protocol, 206
      group already exists, 207 cache exceeds maximum, 300 user not found,
      301 passwords do not match, 302 wrong user name or password, 400 ping
      failed, 401 network change error, 402 network configuration error, 403
      duplicate routes, 404 route not found, 405 port already occupied, 500
      duplicate name, 501 in use, 502 failed to save configuration, 503 time
      setting failed, 504 invalid video output, 505 the mixer takes only four
      audio channels, 506 target already exists, 507 file does not exist,
      508 PTZ setup failed, 509 insufficient performance, 1000 common error.
      A failed command reports the reply's result; the msg code is in the
      reply only.
  - models: [all]
    severity: critical
    text: >
      restore_factory (GET /api/sys/restore) returns the decoder to factory
      settings, removing sources, layouts, users and network settings, and
      cannot be undone; the decoder may come back at its default address
      (192.168.1.168 per the user manual). reset (GET /api/sys/reset, "System
      Reset") is not described further by the document and should be treated
      the same way. upgrade_firmware flashes the uploaded image and restarts
      the decoder; outputs stop meanwhile, and a wrong image may not be
      recoverable live.
  - models: [all]
    severity: warning
    text: >
      reboot stops both outputs until the decoder is back. set_network,
      set_maintenance_address and set_http_ports can move the decoder off
      the address and port the core reaches it on; the core then loses it
      until it is opened at the new address.
  - models: [all]
    severity: info
    text: >
      Two outputs, 1 and 2. On the D350 three video interfaces (two HDMI, one
      SDI) each carry one of them (get_output_interfaces); the document does
      not say how the cards (RD-350, RD-260, FD-360) differ, and their
      interfaces are read from get_output_interfaces as on the others. The
      document types output_id as a string in some requests and a number in
      others; each request sends it as that request's example does.
  - models: [all]
    severity: info
    text: >
      Speed-type PTZ commands (ptz_zoom_speed, ptz_pan_tilt_speed,
      ptz_focus_speed) keep the camera moving: send the same command again
      with speed 0 to stop it. Position commands (ptz_zoom, ptz_pan_tilt,
      ptz_focus, ptz_recall_preset) need no reset. PTZ works only for an NDI
      source in the window (section 10 (12)).
  - models: [all]
    severity: info
    text: >
      Some request bodies differ between the document's example and its
      field table: set_resolution's example names the resolution res_index
      and its table res_id, and remove_preview_source's example names the
      position id and its table pos_id; both requests send both names.
      remove_ndi_group_discovery and remove_ndi_discovery_server send the
      example's dis_d_ip or dis_s_ip and dis_g_name, where the table names
      an id the discovery list does not give. The stream modify requests
      follow the examples, without the group_id the table also lists.
  - models: [all]
    severity: info
    text: >
      set_ndi_manual_discovery replaces the whole manual discovery list: the
      document uses the same request to delete entries, by sending the ones
      that remain. The stream add and modify commands for each protocol send
      the fields the document's example for that protocol gives; add_streams
      and modify_stream take the body as a whole for anything else, such as
      several NDI sources at once.
  - models: [all]
    severity: info
    text: >
      State is polled (the decoder pushes nothing): window status, bitrate,
      format and audio levels every 2 s, source connection status and the
      preview every 5 s, configuration every 30 s; a write's ok reply re-reads
      what it changed at once. The audio levels are only as fresh as the
      2-second poll. ndi.sources holds what public discovery finds; other
      discovery methods are read with list_ndi_sources.
  - models: [all]
    severity: info
    text: >
      The firmware and software versions come from info/get; the document
      gives no CPU load, temperature or uptime reading, and no way to read
      or upload overlay templates beyond listing and selecting them (they
      are edited in the web interface).
  - models: [all]
    severity: info
    text: >
      The document's audio interface read gives the sample rate as 44.1 (kHz)
      while its write example sends 48000 (Hz); set_audio_interface sends Hz
      as the write example does. The pane geometry of layouts is a percent
      the document types as an integer, though its 3x3 template reports
      33.33; modify_layout_pane takes whole percents.
