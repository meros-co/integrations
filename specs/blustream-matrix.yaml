spec: 1
id: blustream-matrix
name: Blustream HDMI and HDBaseT matrix switchers (Telnet and RS-232 API)
vendor: Blustream
category: router

# Blustream's matrix switchers take one plain-text command set over Telnet
# (TCP 23) and their RS-232 port, each model's own help text (the "<model> -
# API" download on its product page, the switcher's answer to HELP) listing
# the commands it has. Two spellings of the same grammar exist: the HDBaseT
# matrices (C, HMX, HMXL and PLA ranges) write OUTxx FR yy with the number
# against the word, and the CMX, MX and Pro ranges write OUT xx FR yy.
# Numbers are two digits, 00 meaning every output or input. Every model below
# supports only the commands its own help text lists, in its own spelling.
#
# Blustream documents no answer to any command, so commands are sent without
# waiting for one (reply: none). State comes from the STATUS report, whose
# layout Blustream documents for the PLA88CS (its API download includes it);
# the rules here read that layout's tables line by line.
#
# Not here: the MX44KVM (a USB KVM matrix with GPIO, a separate command set),
# the ACM210/500/1000 controllers of the IP50/IP200/IP300 AV-over-IP range
# (another product), the help commands, and the "Yes" confirmation's
# alternatives (any other command discards a pending reset).
source:
  - title: "PLA88CS - API (help text, firmware V2.3.0, with the STATUS and CTRLSTA reports)"
    author: Blustream
    url: https://www.blustream.co.uk/Attachment/DownloadFile?downloadId=646
    note: >
      Manufacturer document. Every PLA88CS command with its ranges: STATUS,
      INSTA, OUTSTA, CTRLSTA, HDBTSTA, PRESETSTATUS, FWVERSION, PON/OFF, KEY,
      IR, LCD, RESET (confirmed with Yes), OUTxx ON/OFF, IROUTxx and IRINxx
      (SIMPLE), POCOUTxx, POCINxx, OUT/IN xx GUEST, OUT/IN xx IRHEXSEND,
      OUTxx FR yy (00 all outputs), OUTxx and INxx EH/ET, INxx SWMODE yy
      (00-07), AUDIOxx FR yy, AUDIOxx DMIX, AUDIOxx Delay (0-1000 ms),
      OUTxx EMBED yy, MUTE ON/OFF TX xx, AUDOUT xx ON/OFF, VOLxx TX yy
      (0-100, +, -), OUTxx VOLSTA, OUT xx SCALING, OUT/IN xx LR, OUT xx ARC,
      MXRS232OUT/IN, MXIRRX, MXIRTX, MXIR, IRFV, EDID xx DF zz (00-36),
      EDID xx CP yy, EDID SAVE yy TO zz, PRESET pp SAVE/CLR/APPLY (1-9), the
      output and input CEC commands, CECUSERCMD, RS232BAUD z (1-7, 57600
      default), OUT/IN xx RS232SEND, RS232DLYOUT/IN, RS232OUT/IN, RS232ON,
      RS232OFF (and DISABLE), NET DHCP, TN, TN8000, MDNS, IP, GW, SM, RB,
      TN port; then the STATUS report (system, input, output and audio
      tables, network, Telnet, MAC) and the CTRLSTA report (RS-232 and IR
      control tables, stored RS-232 commands and delays).
  - title: "PLA88CS User Manual, REVB3"
    author: Blustream
    url: https://www.blustream.co.uk/Attachment/DownloadFile?downloadId=1155
    note: Manufacturer document. RS-232 and Telnet control, 57600 8N1.
  - title: "CMX88CS-V2 User Manual, REVA2"
    author: Blustream
    url: https://www.blustream.co.uk/Attachment/DownloadFile?downloadId=1411
    note: >
      Manufacturer document. Web GUI network settings (Port 8000 TCP/IP
      access, Telnet access and port, 23 by default, mDNS) p.20; serial
      57600 8N1 by default, control over RS-232 and TCP/IP (Telnet, SSH),
      CR LF required after every command, spaces optional "unless specified"
      p.26; the command tables (including OUT xx DIAG, IN xx DIAG, DIAGPRINT,
      SYSTEMLOG, IN yy ON/OFF, OUT xx SCALING 01-03, RSB 0-6, RS232ONOUT
      y:z:a, NET MDNS name.local) p.27-28.
  - title: "Help text API downloads for the C44CS, C66CS, C88CS, CMX42AB, CMX42CS (firmware 2.1.0), CMX44CS, CMX88CS, HMX44-18G, HMX88-18G (V1.2.0), HMXL42ARC-KIT (V1.5.0), HMXL66ARC, HMXL88ARC, MX22AB-8K, MX44VW, 16x16 Pro and Custom Pro HUB 8x8"
    author: Blustream
    url: https://www.blustream.co.uk/
    note: >
      Manufacturer documents, the "<model> - API" download of each product
      page (DownloadFile ids 622, 623, 624, 625, 858, 626, 628, 632, 733, 633,
      634, 635, 640, 642, 619 and 647). Each model's supports list below is
      its own help text; the C44CS download ends after OUT xx SCALING.
  - title: Bitfocus Companion module companion-module-blustream-hdmimatrix (MIT), index.js
    author: Joseph Adams and contributors
    url: https://github.com/bitfocus/companion-module-blustream-hdmimatrix
    note: >
      Community code, read for corroboration only (top-level LICENSE is MIT;
      no code copied). It sends each command with CR LF on TCP 23, polls
      STATUS, reads the Output table's FromIn and OutputEn columns, and shows
      a 4x4 matrix answering OUT01FR01 with "[SUCCESS]Set output 01 connect
      from input 01." after a prompt.

transport:
  type: line-tcp
  port: 23
  framing: terminated
  terminator: crlf
  encoding: ascii
  timeout_ms: 3000
  # Blustream documents no answers, only the reports STATUS and the other
  # status commands print: commands are sent without waiting.
  reply: none
  # The same commands on the rear RS-232 port, 57600 8N1 by default (PLA88CS
  # and CMX88CS-V2 manuals; RS232BAUD and RSB "57600 (Default)").
  serial:
    baud_rate: { default: 57600, values: [2400, 4800, 9600, 19200, 38400, 57600, 115200] }
    data_bits: 8
    parity: none
    stop_bits: 1
    flow_control: none

maps:
  upper_onoff: { "true": "ON", "false": "OFF" }
  title_onoff: { "true": "On", "false": "Off" }
  power_word: { "true": "PON", "false": "POFF" }
  cec_word: { "true": "ENABLE", "false": "DISABLE" }
  edid_source: { hdmi: EH, hdbt: ET }
  baud_code: { "2400": "1", "4800": "2", "9600": "3", "19200": "4", "38400": "5", "57600": "6", "115200": "7" }
  rsb_code: { "115200": "0", "57600": "1", "38400": "2", "19200": "3", "9600": "4", "4800": "5", "2400": "6" }

ports:
  - { port: 23, protocol: tcp, role: control, when: "link tcp", note: "Telnet, changeable with NET TN; some models also accept the API on TCP 8000 (NET TN8000)" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "The matrix's RS-232 port, 3-pin Phoenix connector" }

