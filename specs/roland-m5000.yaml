        "PTQ:I108;", "PTQ:I109;", "PTQ:I110;", "PTQ:I111;", "PTQ:I112;", "PTQ:I113;", "PTQ:I114;", "PTQ:I115;",
        "PTQ:I116;", "PTQ:I117;", "PTQ:I118;", "PTQ:I119;", "PTQ:I120;", "PTQ:I121;", "PTQ:I122;", "PTQ:I123;",
        "PTQ:I124;", "PTQ:I125;", "PTQ:I126;", "PTQ:I127;", "PTQ:I128;", "DBQ;", "PBQ;", "LBQ;", "DMQ:MON1;",
        "DMQ:MON2;", "RRQ;", "RCQ:A;", "RCQ:B;"]
  updates:
    - match: '^[\x02\x11\x13]*CNS:([A-Z]+[0-9]+),"([^"]*)";'
      state: { "channels.{1}.name": "{2}" }
    - match: '^[\x02\x11\x13]*FDS:([A-Z]+[0-9]+),(-?[0-9]+\.[0-9]);'
      state: { "channels.{1}.fader": "{2}" }
    - match: '^[\x02\x11\x13]*FDS:([A-Z]+[0-9]+),INF;'
      state: { "channels.{1}.fader": "-inf" }
    - match: '^[\x02\x11\x13]*MUS:([A-Z]+[0-9]+),([01]);'
      state: { "channels.{1}.mute": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^[\x02\x11\x13]*PNS:([A-Z]+[0-9]+),L([0-9]+);'
      state: { "channels.{1}.pan": "-{2}" }
    - match: '^[\x02\x11\x13]*PNS:([A-Z]+[0-9]+),C;'
      state: { "channels.{1}.pan": "0" }
    - match: '^[\x02\x11\x13]*PNS:([A-Z]+[0-9]+),R([0-9]+);'
      state: { "channels.{1}.pan": "{2}" }
    - match: '^[\x02\x11\x13]*EQS:([A-Z]+[0-9]+),([01]);'
      state: { "channels.{1}.eq": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^[\x02\x11\x13]*PTS:([A-Z]+[0-9]+),([01]);'
      state: { "channels.{1}.phantom": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^[\x02\x11\x13]*AXS:([A-Z]+[0-9]+),(AX[0-9]+),(-?[0-9]+\.[0-9]),'
      state: { "channels.{1}.aux_sends.{2}.level": "{3}" }
    - match: '^[\x02\x11\x13]*AXS:([A-Z]+[0-9]+),(AX[0-9]+),INF,'
      state: { "channels.{1}.aux_sends.{2}.level": "-inf" }
    - match: '^[\x02\x11\x13]*AXS:([A-Z]+[0-9]+),(AX[0-9]+),[^,]+,L([0-9]+);'
      state: { "channels.{1}.aux_sends.{2}.pan": "-{3}" }
    - match: '^[\x02\x11\x13]*AXS:([A-Z]+[0-9]+),(AX[0-9]+),[^,]+,(?:C|0);'
      state: { "channels.{1}.aux_sends.{2}.pan": "0" }
    - match: '^[\x02\x11\x13]*AXS:([A-Z]+[0-9]+),(AX[0-9]+),[^,]+,R([0-9]+);'
      state: { "channels.{1}.aux_sends.{2}.pan": "{3}" }
    - match: '^[\x02\x11\x13]*SCS:([0-9]+\.[0-9]+),"([^"]*)";'
      state: { scene.number: "{1}", scene.name: "{2}" }
    - match: '^[\x02\x11\x13]*DBS:([0-9]+);'
      state: { brightness.display: "{1}" }
    - match: '^[\x02\x11\x13]*PBS:([0-9]+);'
      state: { brightness.panel: "{1}" }
    - match: '^[\x02\x11\x13]*LBS:([0-9]+);'
      state: { brightness.lamp: "{1}" }
    - match: '^[\x02\x11\x13]*DMS:(MON[12]),([01]);'
      state: { "monitors.{1}.dimmer": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^[\x02\x11\x13]*RTS:(-?[0-9]+);'
      state: { recorder.status: { value: "{1}", map: { "-1": unavailable, "0": stopped, "1": playing, "2": recording, "3": preparing, "4": rec_pause } } }
    - match: '^[\x02\x11\x13]*RLS:([0-9hms]*);'
      state: { recorder.position: "{1}" }
    - match: '^[\x02\x11\x13]*RIS:([0-9]+),([0-9]+);'
      state: { recorder.song: "{1}", recorder.song_count: "{2}" }
    - match: '^[\x02\x11\x13]*RNS:([0-9]+),"([^";]*)"?;'
      state: { "recorder.songs.{1}.name": "{2}" }
    - match: '^[\x02\x11\x13]*RRS:([0-9hms]*);'
      state: { recorder.remaining: "{1}" }
    - match: '^[\x02\x11\x13]*RCS:([AB]),([0-2]);'
      state: { "reac.{1}.status": { value: "{2}", map: { "0": disconnected, "1": establishing, "2": connected } } }
    - match: '^[\x02\x11\x13]*EPS:(A|B|D1|D2|E1|E2),([0-2]);'
      state: { "reac.{1}.error": { value: "{2}", map: { "0": fan_stopped, "1": temperature, "2": transmission } } }
    - match: '^[\x02\x11\x13]*ERS:([0-9]+);'
      state: { device.error: "{1}" }
    - match: '^[\x02\x11\x13]*VRS:([^;]+);'
      state: { device.version: "{1}" }
