spec: 1
id: roland-m5000
name: Roland M-5000 / M-5000C live mixing console (LAN or RS-232C control)
vendor: Roland
category: mixer

# The console's RS-232C/Telnet command set: three letters, ":" and
# comma-separated parameters, then ";" (Reference p.6-7). Control commands
# (ending in C) are answered by ack, request commands (ending in Q) by a reply
# command (ending in S), both by ERR:n; on failure. Over Telnet (TCP 8023) the
# stx before each command is dropped, ack becomes the text OK, and each line
# ends in CR LF (p.4, p.6). The console reports nothing when a setting changes
# on its own surface (p.6), so state comes from the replies to requests.
source:
  - title: "RS-232C/Telnet Reference, Model M-5000/M-5000C, Version 1.20 (Nov. 19th 2015)"
    author: Roland Corporation
    url: https://static.roland.com/assets/media/pdf/M-5000_M-5000C_RS-232C_Telnet_e02_W.pdf
    note: >
      Manufacturer document. RS-232C connector, speeds, 8N1, Xon/Xoff p.2-3;
      Telnet on TCP 8023, character mode with remote echo, CR/LF/CR-LF in and
      CR-LF out p.4; conversion of stx and ack for Telnet and the special OK
      and QUIT commands p.6, p.8; command format and exchange, and that no
      change on the console is transmitted p.6-7; channel tokens p.9; control
      commands PTC, EQC, AXC, PNC p.9-10, MUC, FDC, RFC, SCC p.11, RSC, SSC,
      SNC, DBC p.12, PBC, LBC, DMC, RTC, RLC, RIC p.12-14; request commands
      and replies CNQ/CNS to RRQ/RRS p.14-20; ERR, ERS and EPS p.20-21.
  - title: "MIDI Implementation, Model M-5000/M-5000C, Version 1.20 (Nov. 10th 2015)"
    author: Roland Corporation
    url: https://static.roland.com/assets/media/pdf/M-5000_M-5000C_MIDI_e01_W.pdf
    note: >
      Manufacturer document, read to confirm that only MIDI (not the LAN or
      RS-232C command set) transmits fader and mute changes made on the
      console; MIDI is not used here.

transport:
  type: line-tcp
  port: 8023
  framing: terminated
  terminator: crlf
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # A command's reply is OK (ack) or ERR:n;, a request's its reply command
  # (two letters and S). The console echoes what it receives over Telnet
  # (p.4); the echoed command ends in C or Q and is never a reply. ERS and EPS
  # are sent unprompted (p.20-21) and go to the telemetry rules only.
  reply_match: '^[\x02\x11\x13]*(?:OK|\x06|ERR:[0-9]+;|(?:CN|PT|EQ|AX|PN|MU|FD|SC|VR|RC|DB|PB|LB|DM|RT|RL|RI|RN|RR)S:)'
  probe: "VRQ;"

ports:
  - { port: 8023, protocol: tcp, role: control }

