      - new_scene
      - new_scene_with_m48
      - get_scene
      - set_display_brightness
      - get_display_brightness
      - set_panel_brightness
      - get_panel_brightness
      - set_lamp_brightness
      - get_lamp_brightness
      - set_monitor_dimmer
      - get_monitor_dimmer
      - recorder_transport
      - recorder_locate
      - recorder_select_song
      - recorder_move_song
