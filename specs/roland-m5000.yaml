commands:
  set_phantom:
    summary: "Turn an input's phantom power (+48V) on or off (PTC, p.9-10)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel whose phantom power to switch, by the console's token: I1-I128 input channels; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
      enabled: { type: bool, required: true, label: Phantom power, description: "On supplies +48V to the input, off removes it." }
    send: "PTC:{channel},{enabled:bool01};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_phantom:
    summary: "Read an input's phantom power (PTQ, p.14); the reply goes to state"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel to read, by the console's token: I1-I128 input channels; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
    send: "PTQ:{channel};"
    expect: { reply_contains: "PTS:{channel},", matches: 'PTS:[^,]+,([01]);' }
    returns: value

  set_eq:
    summary: "Turn a channel's EQ on or off (EQC, p.10)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|SG(?:[1-9]|[1-5][0-9]|6[0-4])|AX(?:[1-9]|[1-5][0-9]|6[0-4])|MM(?:[1-9]|[1-5][0-9]|6[0-4])|MX(?:[1-9]|[1-5][0-9]|6[0-4])|MA[12]|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel whose EQ to switch, by the console's token: I1-I128 input channels; SG1-SG64 subgroups; AX1-AX64 AUX buses; MM1-MM64 MIX-MINUS buses; MX1-MX64 matrices; MA1-MA2 mains; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
      enabled: { type: bool, required: true, label: EQ, description: "On turns the channel EQ on, off bypasses it." }
    send: "EQC:{channel},{enabled:bool01};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_eq:
    summary: "Read whether a channel's EQ is on (EQQ, p.14-15)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|SG(?:[1-9]|[1-5][0-9]|6[0-4])|AX(?:[1-9]|[1-5][0-9]|6[0-4])|MM(?:[1-9]|[1-5][0-9]|6[0-4])|MX(?:[1-9]|[1-5][0-9]|6[0-4])|MA[12]|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel to read, by the console's token: I1-I128 input channels; SG1-SG64 subgroups; AX1-AX64 AUX buses; MM1-MM64 MIX-MINUS buses; MX1-MX64 matrices; MA1-MA2 mains; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
    send: "EQQ:{channel};"
    expect: { reply_contains: "EQS:{channel},", matches: 'EQS:[^,]+,([01]);' }
    returns: value

  set_aux_send:
    summary: "Set an input's send level and pan to an AUX bus (AXC, p.10); the pan is ignored on a mono AUX"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel whose send to set, by the console's token: I1-I128 input channels; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
      aux: { type: int, min: 1, max: 64, required: true, label: AUX bus, description: "The AUX bus the send feeds, 1 to 64." }
      level: { type: float, min: -80.0, max: 10.0, required: true, label: Send level, description: "Send level in dB, -80.0 to +10.0 in 0.1 dB steps; set_aux_send_off sends -inf." }
      pan: { type: int, min: -100, max: 100, required: true, label: Pan,
                 description: "Pan from -100 (L100) through 0 (C) to 100 (R100) in steps of 1." }
    send: "AXC:{channel},AX{aux},{level:.1f},{pan:map.pan};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  set_aux_send_off:
    summary: "Set an input's send to an AUX bus to -inf, with its pan (AXC, p.10)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel whose send to set, by the console's token: I1-I128 input channels; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
      aux: { type: int, min: 1, max: 64, required: true, label: AUX bus, description: "The AUX bus the send feeds, 1 to 64." }
      pan: { type: int, min: -100, max: 100, required: true, label: Pan,
                 description: "Pan from -100 (L100) through 0 (C) to 100 (R100) in steps of 1." }
    send: "AXC:{channel},AX{aux},INF,{pan:map.pan};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_aux_send:
    summary: "Read an input's send level and pan to an AUX bus (AXQ, p.15); the reply goes to state, and returns the level"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel to read, by the console's token: I1-I128 input channels; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
      aux: { type: int, min: 1, max: 64, required: true, label: AUX bus, description: "The AUX bus the send feeds, 1 to 64." }
    send: "AXQ:{channel},AX{aux};"
    expect: { reply_contains: "AXS:{channel},AX{aux},", matches: 'AXS:[^,]+,[^,]+,([^,]+),' }
    returns: value

  set_pan:
    summary: "Set a channel's pan (PNC, p.10)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|SG(?:[1-9]|[1-5][0-9]|6[0-4])|AX(?:[1-9]|[1-5][0-9]|6[0-4])|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel to pan, by the console's token: I1-I128 input channels; SG1-SG64 subgroups; AX1-AX64 AUX buses; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
      pan: { type: int, min: -100, max: 100, required: true, label: Pan,
                 description: "Pan from -100 (L100) through 0 (C) to 100 (R100) in steps of 1." }
    send: "PNC:{channel},{pan:map.pan};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_pan:
    summary: "Read a channel's pan (PNQ, p.15), as the console writes it (L45, C, R100)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|SG(?:[1-9]|[1-5][0-9]|6[0-4])|AX(?:[1-9]|[1-5][0-9]|6[0-4])|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel to read, by the console's token: I1-I128 input channels; SG1-SG64 subgroups; AX1-AX64 AUX buses; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
    send: "PNQ:{channel};"
    expect: { reply_contains: "PNS:{channel},", matches: 'PNS:[^,]+,([LCR0-9]+);' }
    returns: value

  set_mute:
    summary: "Mute or unmute a channel, DCA or mute group (MUC, p.11)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|SG(?:[1-9]|[1-5][0-9]|6[0-4])|AX(?:[1-9]|[1-5][0-9]|6[0-4])|MM(?:[1-9]|[1-5][0-9]|6[0-4])|MX(?:[1-9]|[1-5][0-9]|6[0-4])|MA[12]|DCA(?:[1-9]|1[0-9]|2[0-4])|MG[1-8]|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel to mute or unmute, by the console's token: I1-I128 input channels; SG1-SG64 subgroups; AX1-AX64 AUX buses; MM1-MM64 MIX-MINUS buses; MX1-MX64 matrices; MA1-MA2 mains; DCA1-DCA24; MG1-MG8 mute groups; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
      muted: { type: bool, required: true, label: Muted, description: "On mutes, off unmutes." }
    send: "MUC:{channel},{muted:bool01};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_mute:
    summary: "Read a channel's, DCA's or mute group's mute (MUQ, p.16)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|SG(?:[1-9]|[1-5][0-9]|6[0-4])|AX(?:[1-9]|[1-5][0-9]|6[0-4])|MM(?:[1-9]|[1-5][0-9]|6[0-4])|MX(?:[1-9]|[1-5][0-9]|6[0-4])|MA[12]|DCA(?:[1-9]|1[0-9]|2[0-4])|MG[1-8]|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel to read, by the console's token: I1-I128 input channels; SG1-SG64 subgroups; AX1-AX64 AUX buses; MM1-MM64 MIX-MINUS buses; MX1-MX64 matrices; MA1-MA2 mains; DCA1-DCA24; MG1-MG8 mute groups; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
    send: "MUQ:{channel};"
    expect: { reply_contains: "MUS:{channel},", matches: 'MUS:[^,]+,([01]);' }
    returns: value

  set_fader:
    summary: "Set a fader level in dB (FDC, p.11)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|SG(?:[1-9]|[1-5][0-9]|6[0-4])|AX(?:[1-9]|[1-5][0-9]|6[0-4])|MM(?:[1-9]|[1-5][0-9]|6[0-4])|MX(?:[1-9]|[1-5][0-9]|6[0-4])|MA[12]|MON[12]|DCA(?:[1-9]|1[0-9]|2[0-4])|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel whose fader to move, by the console's token: I1-I128 input channels; SG1-SG64 subgroups; AX1-AX64 AUX buses; MM1-MM64 MIX-MINUS buses; MX1-MX64 matrices; MA1-MA2 mains; MON1-MON2 monitors; DCA1-DCA24; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
      level: { type: float, min: -80.0, max: 10.0, required: true, label: Level, description: "Fader level in dB, -80.0 to +10.0 in 0.1 dB steps; set_fader_off sets -inf." }
    send: "FDC:{channel},{level:.1f};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  set_fader_off:
    summary: "Set a fader to -inf (FDC with INF, p.11)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|SG(?:[1-9]|[1-5][0-9]|6[0-4])|AX(?:[1-9]|[1-5][0-9]|6[0-4])|MM(?:[1-9]|[1-5][0-9]|6[0-4])|MX(?:[1-9]|[1-5][0-9]|6[0-4])|MA[12]|MON[12]|DCA(?:[1-9]|1[0-9]|2[0-4])|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel whose fader to close, by the console's token: I1-I128 input channels; SG1-SG64 subgroups; AX1-AX64 AUX buses; MM1-MM64 MIX-MINUS buses; MX1-MX64 matrices; MA1-MA2 mains; MON1-MON2 monitors; DCA1-DCA24; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
    send: "FDC:{channel},INF;"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  adjust_fader:
    summary: "Move a fader by a relative amount (RFC, p.11); refused (ERR:5) for 0.0, upwards at +10.0 and downwards at -inf"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|SG(?:[1-9]|[1-5][0-9]|6[0-4])|AX(?:[1-9]|[1-5][0-9]|6[0-4])|MM(?:[1-9]|[1-5][0-9]|6[0-4])|MX(?:[1-9]|[1-5][0-9]|6[0-4])|MA[12]|MON[12]|DCA(?:[1-9]|1[0-9]|2[0-4])|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel whose fader to move, by the console's token: I1-I128 input channels; SG1-SG64 subgroups; AX1-AX64 AUX buses; MM1-MM64 MIX-MINUS buses; MX1-MX64 matrices; MA1-MA2 mains; MON1-MON2 monitors; DCA1-DCA24; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
      change: { type: float, min: -99.9, max: 99.9, required: true, label: Change, description: "Amount to move the fader in dB, -99.9 to +99.9 in 0.1 dB steps, positive upwards." }
    send: "RFC:{channel},{change:.1f};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_fader:
    summary: "Read a fader level (FDQ, p.16): dB as text, or INF"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|SG(?:[1-9]|[1-5][0-9]|6[0-4])|AX(?:[1-9]|[1-5][0-9]|6[0-4])|MM(?:[1-9]|[1-5][0-9]|6[0-4])|MX(?:[1-9]|[1-5][0-9]|6[0-4])|MA[12]|MON[12]|DCA(?:[1-9]|1[0-9]|2[0-4])|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel to read, by the console's token: I1-I128 input channels; SG1-SG64 subgroups; AX1-AX64 AUX buses; MM1-MM64 MIX-MINUS buses; MX1-MX64 matrices; MA1-MA2 mains; MON1-MON2 monitors; DCA1-DCA24; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
    send: "FDQ:{channel};"
    expect: { reply_contains: "FDS:{channel},", matches: 'FDS:[^,]+,([^;]+);' }
    returns: value

  get_channel_name:
    summary: "Read a channel's name (CNQ, p.14)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])|SG(?:[1-9]|[1-5][0-9]|6[0-4])|AX(?:[1-9]|[1-5][0-9]|6[0-4])|MM(?:[1-9]|[1-5][0-9]|6[0-4])|MX(?:[1-9]|[1-5][0-9]|6[0-4])|MA[12]|DCA(?:[1-9]|1[0-9]|2[0-4])|MG[1-8]|U(?:[1-9]|[1-9][0-9]|1[0-8][0-9]|19[0-2]))$', label: Channel,
                 description: "The channel whose name to read, by the console's token: I1-I128 input channels; SG1-SG64 subgroups; AX1-AX64 AUX buses; MM1-MM64 MIX-MINUS buses; MX1-MX64 matrices; MA1-MA2 mains; DCA1-DCA24; MG1-MG8 mute groups; U1-U192 user faders (USER1 1-64, USER2 65-128, USER3 129-192), which reach the channel assigned to them." }
    send: "CNQ:{channel};"
    expect: { reply_contains: "CNS:{channel},", matches: 'CNS:[^,]+,"([^"]*)"' }
    returns: value

  recall_scene:
    summary: "Recall a scene (SCC, p.11); refused (ERR:5) for a scene that does not exist"
    params:
      scene: { type: float, min: 1.0, max: 300.0, required: true, label: Scene,
              description: "Scene number, 1.00 to 300.00 in steps of 0.01, as the console numbers scenes." }
    send: "SCC:{scene:.2f};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  recall_scene_relative:
    summary: "Recall the scene a number of scenes before or after the current one (RSC, p.12)"
    params:
      offset: { type: int, min: -299, max: 299, required: true, label: Offset, description: "How many scenes to move, negative for earlier scenes; refused when the result lies outside 1.00-300.00." }
    send: "RSC:{offset};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  store_scene:
    summary: "Store the current settings to an existing scene, keeping its name and M-48 setting (SSC, p.12)"
    params:
      scene: { type: float, min: 1.0, max: 300.0, required: true, label: Scene,
              description: "Scene number, 1.00 to 300.00 in steps of 0.01, as the console numbers scenes." }
    send: "SSC:{scene:.2f};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  store_scene_named:
    summary: "Store the current settings to an existing scene under a new name (SSC, p.12)"
    params:
      scene: { type: float, min: 1.0, max: 300.0, required: true, label: Scene,
              description: "Scene number, 1.00 to 300.00 in steps of 0.01, as the console numbers scenes." }
      name: { type: string, required: true, max_length: 32, pattern: '^[^,;"]+$', label: Scene name,
             description: "The scene's name, up to 32 characters, without commas, semicolons or quotes." }
    send: "SSC:{scene:.2f},{name};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  store_scene_with_m48:
    summary: "Store the current settings to an existing scene with a name and M-48 memory (SSC, p.12)"
    params:
      scene: { type: float, min: 1.0, max: 300.0, required: true, label: Scene,
              description: "Scene number, 1.00 to 300.00 in steps of 0.01, as the console numbers scenes." }
      name: { type: string, required: true, max_length: 32, pattern: '^[^,;"]+$', label: Scene name,
             description: "The scene's name, up to 32 characters, without commas, semicolons or quotes." }
      memory: { type: int, min: 0, max: 16, required: true, label: M-48 memory,
              description: "The M-48 personal mixer memory the scene recalls, 1 to 16, or 0 for none." }
    send: "SSC:{scene:.2f},{name},{memory:map.m48};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  new_scene:
    summary: "Store the current settings as a new scene after the current one (SNC, p.12); refused when 300 scenes exist"
    params:
      name: { type: string, required: true, max_length: 32, pattern: '^[^,;"]+$', label: Scene name,
             description: "The scene's name, up to 32 characters, without commas, semicolons or quotes." }
    send: "SNC:{name};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  new_scene_with_m48:
    summary: "Store the current settings as a new scene after the current one, with an M-48 memory (SNC, p.12)"
    params:
      name: { type: string, required: true, max_length: 32, pattern: '^[^,;"]+$', label: Scene name,
             description: "The scene's name, up to 32 characters, without commas, semicolons or quotes." }
      memory: { type: int, min: 0, max: 16, required: true, label: M-48 memory,
              description: "The M-48 personal mixer memory the scene recalls, 1 to 16, or 0 for none." }
    send: "SNC:{name},{memory:map.m48};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_scene:
    summary: "Read the scene last recalled, its number and name (SCQ, p.16-17); refused when none has been recalled"
    send: "SCQ;"
    expect: { reply_contains: "SCS:", matches: 'SCS:([0-9.]+),' }
    returns: value

  set_display_brightness:
    summary: "Set the display brightness (DBC, p.12)"
    params:
      brightness: { type: int, min: 0, max: 100, required: true, label: Brightness, description: "Brightness in percent, 0 to 100." }
    send: "DBC:{brightness};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_display_brightness:
    summary: "Read the display brightness (DBQ, p.17-18)"
    send: "DBQ;"
    expect: { reply_contains: "DBS:", matches: 'DBS:([0-9]+);' }
    returns: value

  set_panel_brightness:
    summary: "Set the panel brightness (PBC, p.12-13)"
    params:
      brightness: { type: int, min: 0, max: 100, required: true, label: Brightness, description: "Brightness in percent, 0 to 100." }
    send: "PBC:{brightness};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_panel_brightness:
    summary: "Read the panel brightness (PBQ, p.18)"
    send: "PBQ;"
    expect: { reply_contains: "PBS:", matches: 'PBS:([0-9]+);' }
    returns: value

  set_lamp_brightness:
    summary: "Set the lamp (LAMP jack) brightness (LBC, p.13)"
    params:
      brightness: { type: int, min: 0, max: 100, required: true, label: Brightness, description: "Brightness in percent, 0 to 100." }
    send: "LBC:{brightness};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_lamp_brightness:
    summary: "Read the lamp (LAMP jack) brightness (LBQ, p.18)"
    send: "LBQ;"
    expect: { reply_contains: "LBS:", matches: 'LBS:([0-9]+);' }
    returns: value

  set_monitor_dimmer:
    summary: "Turn a monitor's dimmer on or off (DMC, p.13)"
    params:
      monitor: { type: enum, values: [MON1, MON2], required: true, label: Monitor, description: "MON1 or MON2." }
      enabled: { type: bool, required: true, label: Dimmer, description: "On dims the monitor, off returns it to its level." }
    send: "DMC:{monitor},{enabled:bool01};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_monitor_dimmer:
    summary: "Read whether a monitor's dimmer is on (DMQ, p.18)"
    params:
      monitor: { type: enum, values: [MON1, MON2], required: true, label: Monitor, description: "MON1 or MON2." }
    send: "DMQ:{monitor};"
    expect: { reply_contains: "DMS:{monitor},", matches: 'DMS:[^,]+,([01]);' }
    returns: value

  recorder_transport:
    summary: "Stop, play or record-pause the USB memory recorder (RTC, p.13); play from record-pause starts recording"
    params:
      action: { type: enum, values: [stop, play, rec_pause], required: true, label: Action,
                description: "stop, play (or start recording from record-pause), or rec_pause to arm recording." }
    send: "RTC:{action:map.recorder_action};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  recorder_locate:
    summary: "Move the playback position of the USB memory recorder (RLC, p.13); valid only during playback"
    params:
      hours: { type: int, min: 0, max: 99, required: true, label: Hours, description: "Hours into the song." }
      minutes: { type: int, min: 0, max: 59, required: true, label: Minutes, description: "Minutes past the hour." }
      seconds: { type: int, min: 0, max: 59, required: true, label: Seconds, description: "Seconds past the minute." }
    send: "RLC:{hours:02d}h{minutes:02d}m{seconds:02d}s;"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  recorder_select_song:
    summary: "Select a song of the USB memory recorder by number (RIC, p.13-14)"
    params:
      song: { type: int, min: 0, max: 999, required: true, label: Song, description: "Song number, 0 to 999." }
    send: "RIC:{song};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  recorder_move_song:
    summary: "Select the song a number of songs before or after the current one (RIC with + or -, p.13-14)"
    params:
      offset: { type: int, min: -999, max: 999, required: true, label: Offset, description: "Songs to move, negative for earlier songs; 0 is refused." }
    send: "RIC:{offset:signed};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  recorder_next_song:
    summary: "Select the next song of the USB memory recorder (RIC:N, p.13-14)"
    send: "RIC:N;"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  recorder_previous_song:
    summary: "Select the previous song of the USB memory recorder (RIC:P, p.13-14)"
    send: "RIC:P;"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_recorder_status:
    summary: "Read the USB memory recorder's status (RTQ, p.18-19): -1 unavailable, 0 stopped, 1 playing, 2 recording, 3 preparing playback, 4 record-pause"
    send: "RTQ;"
    expect: { reply_contains: "RTS:", matches: 'RTS:(-?[0-9]+);' }
    returns: value

  get_recorder_position:
    summary: "Read the USB memory recorder's playback position (RLQ, p.19), as HHhMMmSSs with leading fields left out"
    send: "RLQ;"
    expect: { reply_contains: "RLS:", matches: 'RLS:([0-9hms]*);' }
    returns: value

  get_recorder_song:
    summary: "Read the current song number and the number of songs (RIQ, p.19); returns the current song"
    send: "RIQ;"
    expect: { reply_contains: "RIS:", matches: 'RIS:([0-9]+),' }
    returns: value

  get_recorder_song_name:
    summary: "Read the current song's number and name (RNQ, p.19); returns the name"
    send: "RNQ;"
    expect: { reply_contains: "RNS:", matches: 'RNS:[0-9]+,"([^";]*)' }
    returns: value

  get_recorder_song_name_of:
    summary: "Read a song's name by number (RNQ:a, p.19)"
    params:
      song: { type: int, min: 0, max: 999, required: true, label: Song, description: "Song number, 0 to 999." }
    send: "RNQ:{song};"
    expect: { reply_contains: "RNS:{song},", matches: 'RNS:[0-9]+,"([^";]*)' }
    returns: value

  get_recorder_remaining:
    summary: "Read the remaining recording time of the USB memory (RRQ, p.19-20), as HHhMMmSSs"
    send: "RRQ;"
    expect: { reply_contains: "RRS:", matches: 'RRS:([0-9hms]*);' }
    returns: value

  get_reac_status:
    summary: "Read a REAC port's connection status (RCQ, p.17): 0 not connected, 1 establishing, 2 connected"
    params:
      port: { type: enum, values: [A, B], required: true, label: REAC port, description: "REAC port A or B." }
    send: "RCQ:{port};"
    expect: { reply_contains: "RCS:{port},", matches: 'RCS:[AB],([0-2]);' }
    returns: value

  get_version:
    summary: "Read the mixer engine's version (VRQ, p.17)"
    send: "VRQ;"
    expect: { reply_contains: "VRS:", matches: 'VRS:([^;]+);' }
    returns: value

  resend_last_reply:
    summary: "Ask the console to send its last reply again (ERR:0 from the host, p.20)"
    send: "ERR:0;"
    expect: { matches: '^[\x02\x11\x13]*(?:[A-Z]{2}S:|OK|\x06)' }
    returns: text

quirks:
  - models: [all]
    severity: critical
    text: >
      recall_scene, recall_scene_relative and the M-48 memory a scene carries
      change the whole console at once; store_scene, store_scene_named and
      store_scene_with_m48 overwrite a scene's stored settings. Neither can
      be undone from here.
  - models: [all]
    severity: warning
    text: >
      The console sends nothing when a setting is changed on its own surface
      (p.6), so state comes from polling: the scene and the USB memory
      recorder every two seconds, faders and mutes every ten, and names,
      pans, EQ and phantom switches every minute. A change on the console
      shows up only at the next poll. AUX send levels (128 inputs by 64 AUX
      buses) are not polled; get_aux_send reads one into state. User faders
      (U1-U192) reach whichever channel is assigned to them and are not
      polled; state is kept by the channel's own token.
  - models: [all]
    severity: info
    text: >
      Over Telnet the console echoes what it receives (character mode with
      remote echo, p.4); the echo is never taken as a reply. Telnet option
      negotiation is not documented; the core sends none. Over RS-232C the
      host may send ack after a request's reply (optional, p.6-7); the core
      does not.
  - models: [all]
    severity: info
    text: >
      Channel names are 12 characters (p.14); the console may pad shorter
      names. Scene names are up to 32 characters and are sent without quotes
      (p.12). Scene numbers are decimals, 1.00 to 300.00; the scene in state
      is the number as the console wrote it. ERR:0 syntax error, ERR:2 busy,
      ERR:5 out of range (or a channel that does not have the parameter),
      ERR:6 other error (p.20). ERS (console errors: 0 fan stopped, 1 lithium
      battery low, 10-12 RS-232C errors, 99 abnormal stop) and EPS (REAC
      device errors) are sent unprompted (p.20-21).

state:
  channels.*.name:              { type: string, description: "Channel name (CNS), keyed by the console's channel token (I1, SG3, AX12, MM1, MX4, MA1, DCA2, MG5)" }
  channels.*.fader:             { type: string, unit: dB, description: "Fader level in dB as the console writes it (-80.0 to 10.0), or \"-inf\"" }
  channels.*.mute:              { type: bool, description: "Muted" }
  channels.*.pan:               { type: int, description: "Pan, -100 (L100) through 0 (C) to 100 (R100)" }
  channels.*.eq:                { type: bool, description: "EQ on" }
  channels.*.phantom:           { type: bool, description: "Phantom power (+48V) on" }
  channels.*.aux_sends.*.level: { type: string, unit: dB, description: "Send level to the AUX bus (keyed AX1-AX64) in dB, or \"-inf\"; read by get_aux_send only" }
  channels.*.aux_sends.*.pan:   { type: int, description: "Send pan to the AUX bus, -100 to 100; 0 on a mono AUX" }
  scene.number:                 { type: string, description: "Scene last recalled, 1.00-300.00 as the console writes it" }
  scene.name:                   { type: string, description: "Name of the scene last recalled" }
  brightness.display:           { type: int, unit: "%", description: "Display brightness" }
  brightness.panel:             { type: int, unit: "%", description: "Panel brightness" }
  brightness.lamp:              { type: int, unit: "%", description: "LAMP jack brightness" }
  monitors.*.dimmer:            { type: bool, description: "Dimmer on, keyed MON1 or MON2" }
  recorder.status:              { type: string, description: "USB memory recorder: unavailable, stopped, playing, recording, preparing or rec_pause" }
  recorder.position:            { type: string, description: "Playback position as HHhMMmSSs, leading fields left out by the console" }
  recorder.song:                { type: int, description: "Current song number" }
  recorder.song_count:          { type: int, description: "Number of songs" }
  recorder.songs.*.name:        { type: string, description: "Song name, keyed by song number" }
  recorder.remaining:           { type: string, description: "Remaining recording time as HHhMMmSSs" }
  reac.*.status:                { type: string, description: "REAC port A or B: disconnected, establishing or connected" }
  reac.*.error:                 { type: string, description: "Last REAC device error, keyed A, B, D1, D2, E1, E2: fan_stopped, temperature or transmission" }
  device.version:               { type: string, description: "Mixer engine version" }
  device.error:                 { type: int, description: "Last console error status code (ERS): 0 fan stopped, 1 lithium battery low, 10 RS-232C framing, 11 parity, 12 receive buffer full, 99 abnormal system stop" }

telemetry:
  # Nothing is pushed but REAC status and errors (p.6, p.17, p.20-21): see
  # the polling quirk.
  subscribe:
    send: ["VRQ;"]
  poll:
    - every_ms: 2000
      send: [
        "SCQ;", "RTQ;", "RLQ;", "RIQ;", "RNQ;"]
    - every_ms: 10000
      send: [
        "FDQ:I1;", "FDQ:I2;", "FDQ:I3;", "FDQ:I4;", "FDQ:I5;", "FDQ:I6;", "FDQ:I7;", "FDQ:I8;", "FDQ:I9;",
        "FDQ:I10;", "FDQ:I11;", "FDQ:I12;", "FDQ:I13;", "FDQ:I14;", "FDQ:I15;", "FDQ:I16;", "FDQ:I17;", "FDQ:I18;",
        "FDQ:I19;", "FDQ:I20;", "FDQ:I21;", "FDQ:I22;", "FDQ:I23;", "FDQ:I24;", "FDQ:I25;", "FDQ:I26;", "FDQ:I27;",
        "FDQ:I28;", "FDQ:I29;", "FDQ:I30;", "FDQ:I31;", "FDQ:I32;", "FDQ:I33;", "FDQ:I34;", "FDQ:I35;", "FDQ:I36;",
        "FDQ:I37;", "FDQ:I38;", "FDQ:I39;", "FDQ:I40;", "FDQ:I41;", "FDQ:I42;", "FDQ:I43;", "FDQ:I44;", "FDQ:I45;",
        "FDQ:I46;", "FDQ:I47;", "FDQ:I48;", "FDQ:I49;", "FDQ:I50;", "FDQ:I51;", "FDQ:I52;", "FDQ:I53;", "FDQ:I54;",
        "FDQ:I55;", "FDQ:I56;", "FDQ:I57;", "FDQ:I58;", "FDQ:I59;", "FDQ:I60;", "FDQ:I61;", "FDQ:I62;", "FDQ:I63;",
        "FDQ:I64;", "FDQ:I65;", "FDQ:I66;", "FDQ:I67;", "FDQ:I68;", "FDQ:I69;", "FDQ:I70;", "FDQ:I71;", "FDQ:I72;",
