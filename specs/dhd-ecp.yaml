spec: 1
id: dhd-ecp
name: DHD audio RM4200D and Series 52 cores (External Control Protocol, ECP)
vendor: DHD audio
category: mixer
implementation: native
reason: >
  ECP over TCP is binary: every block is 16 bytes (a length byte, a 29-bit command ID, up to eight data bytes),
  big-endian, with no acknowledgement and no request numbering. A request and its answer share the command ID
  and differ only in the length byte, so an answer is tied to its request by the address bytes it repeats, and
  the same block types also arrive unasked (crosspoint and fader-value notifications, motor-fader touches,
  meters, clean feed changes). Levels are signed 16-bit hundredths of a dB and one clean feed output word packs
  five fields. None of this is expressible as text templates.

source:
  - title: "DHD Developer Documentation, version 10.4: ECP - External Control Protocol (overview, device and firmware table, deprecation notice)"
    author: DHD audio
    url: "https://developer.dhd.audio/docs/API/ECP/"
    note: >
      Read 2026-10-21. Devices and controllers that speak ECP (RM4200D with RM420-850/852/853, 52/XR with
      52-6850/6851, 52/XS, XC, XD with 52-7450, XS2, XC2, XD2 with 52-7456) and their firmware lines; ECP is
      deprecated from firmware 10.2 for third-generation cores (XC3/XD3/XS3), kept as a legacy protocol with a
      reduced feature set, and the commands planned for removal (16-bit routing, arbitration, display labels,
      load/save setups, both I/O gain forms, both clean feed parameters).
  - title: "DHD Developer Documentation, version 10.4: ECP Communication"
    author: DHD audio
    url: "https://developer.dhd.audio/docs/API/ECP/communication"
    note: >
      Interfaces per frame and controller (up to 10 TCP sockets; 5 before firmware 7.04.06; 4 on some 05.05.27 to
      05.06.01 firmware); IP communication: TCP port 2008, the 16-byte block (length, unused byte, ID28..ID0 in
      four bytes, data bytes 0-7, two unused bytes), unused bytes sent as zero and ignored on receipt, Motorola
      byte order; sockets are non-blocking from firmware 06.xx.xx and closed when data is not fetched fast
      enough. The serial framing (STX, DLE escaping, checksum, ACK/NAK) is described there too but is not used.
  - title: "DHD Developer Documentation, version 10.4: ECP Commands"
    author: DHD audio
    url: "https://developer.dhd.audio/docs/API/ECP/commands"
    note: >
      The command overview by firmware line and its footnotes; Set Output Routing 0x01F5 16-bit (lengths 0, 2,
      4; physical I/O numbers) and 32-bit (lengths 1, 5, 8; crosspoint notification; AudioID versions 1 and 2);
      Set Arbitration 0x01F9; Set Monitor Channel 0x1100; Switch Fader/Channel On/Off 0x1102; Set Fader Level
      0x1103 (lengths 1, 2, 4, 7; level and time encoding; fade types); Set Fader Access 0x1104; Set Channel
      Input Number 0x110D; Set Internal Logic States 0x110E; Set Monitor Level 0x1110; Set Display or Channel
      Label 0x1114; Set PFL 0x1116; Load Save Setups 0x111C; Set IO Gain 0x112D 16-bit and 32-bit; Motorfader
      Touched 0x1182; Metering 0x111D; Get / Set Parameter 0x1181 for clean feed input (prefix 0x0024) and
      clean feed output (prefix 0x0025), with their bit layouts.
  - title: "companion-module-dhdaudio-ecp (README, companion/HELP.md, src/ecp.ts)"
    author: "Daniel Lippens (MIT licence)"
    url: "https://github.com/daniellippens/companion-module-dhdaudio-ecp"
    note: >
      Corroboration only (MIT, checked 2026-10-21; no code used): the 16-byte block layout and port 2008; logic
      IDs are the low 16 bits of the 32-bit logic address a Toolbox Export.dpx file lists.

settings:
  read_mixers: { type: int, min: 0, max: 4, default: 1, label: Mixers read, description: "How many virtual mixers, from mixer 1, have their logic faders read on connecting (level, input and PFL); 0 reads none." }
  read_faders: { type: int, min: 0, max: 48, default: 0, label: Faders read, description: "How many logic faders of each of those mixers, from fader 1, are read on connecting; 0 reads none." }
  read_monitors: { type: int, min: 0, max: 200, default: 0, label: Monitors read, description: "How many monitor (selector) channels, from monitor 1, have their inputs read on connecting." }
  read_pots: { type: int, min: 0, max: 120, default: 0, label: Pots read, description: "How many monitor potentiometers, from pot 1, have their levels read on connecting." }
  meters: { type: int, min: 0, max: 48, default: 0, label: Meters, description: "How many level detects, from 1, have meter notifications switched on when monitoring (firmware 08.01.18 and later); each sends levels as they change." }

ports:
  - { port: 2008, protocol: tcp, role: control }

