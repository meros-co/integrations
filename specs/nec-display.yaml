quirks:
  - models: [all]
    severity: info
    text: >
      After power on or off the next message waits 15 s, and after an input change, auto setup or factory
      reset 10 s, as NEC requires; commands queue meanwhile. A message the display cannot take now is answered
      with the NULL message and fails; one it does not support (result 01) fails too.
  - models: [all]
    severity: warning
    text: >
      Some models ignore an out-of-range value and still answer it was set: every set is read back, so state
      shows what the display holds. Settings are kept over a power cycle only after save_settings.
  - models: [all]
    severity: info
    text: >
      Value ranges and codes differ by generation; each parameter's description gives them, and get_vcp
      returns the maximum a model takes. get_vcp and set_vcp reach any operation code of NEC's tables, for
      the many settings (option slot, SpectraView Engine, network, proof of play) not named here.
  - models: [all]
    severity: info
    text: >
      Nothing is pushed: power, input, volume and mute are read every poll_ms, the other settings, the
      temperature sensors, the fans, the self-diagnosis and the clock every minute. In standby a display
      answers only the power, identity and input commands unless quick start is on.
  - models: [all]
    severity: info
    text: >
      Schedules, the network settings, the security lock, asset data, proof of play and auto tile matrix are
      command messages whose layouts differ by generation and are not named here. Broadcast and group
      addressing are not offered: whether displays answer them is not documented.
  - models: [all]
    severity: critical
    text: >
      reset with factory restores every setting, and set_monitor_id changes the ID this device addresses:
      set monitor_id to the new ID afterwards. Neither can be undone from here.
  - models: [g4, g2]
    severity: info
    text: >
      These generations' tables name 00-18 the blue gain and 00-1A the green gain, the M series, the PN-ME
      and NEC's SDK the other way round; set_green_gain and set_blue_gain follow the latter.
