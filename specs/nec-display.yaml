commands:
  get_input: {summary: Read the input (00-60), returns: value}
  set_input:
    summary: Set the input (00-60) and read it back
    params:
      value:
        type: enum
        values: &id001 [vga, rgbhv, dvi, hdmi_set_only, video1, video2, s_video, tv, ypbpr, option, ypbpr2, displayport1, displayport2,
          hdmi1, hdmi2, displayport3, hdmi3, media_player, compute_module, usb_c]
        required: true
        label: Input
        description: 'The input; a model has some of them: vga, rgbhv (BNC), dvi, video1, video2, s_video, ypbpr, ypbpr2 and displayport3
          on the older generations, option (the slot), displayport1 and 2, hdmi1 to hdmi3, media_player (P404 generation; HOME on the
          PN-ME), compute_module and usb_c (PN-ME); hdmi_set_only is the older generations'' set-only HDMI code.'
    returns: ack
  get_backlight: {summary: Read the backlight (00-10), returns: value}
  set_backlight:
    summary: Set the backlight (00-10) and read it back
    params:
      value: {type: int, min: 0, max: 100, required: true, label: Backlight, description: Backlight from 0 to 100.}
    returns: ack
  get_contrast: {summary: Read the contrast (00-12), returns: value}
  set_contrast:
    summary: Set the contrast (00-12) and read it back
    params:
      value: {type: int, min: 0, max: 100, required: true, label: Contrast, description: Contrast from 0 to 100.}
    returns: ack
  get_black_level: {summary: Read the black level (00-92), returns: value}
  set_black_level:
    summary: Set the black level (00-92) and read it back
    params:
      value: {type: int, min: 0, max: 100, required: true, label: Black level, description: Black level (brightness) from 0 to 100.}
    returns: ack
  get_sharpness: {summary: Read the sharpness (00-8C), returns: value}
  set_sharpness:
    summary: Set the sharpness (00-8C) and read it back
    params:
      value: {type: int, min: 0, max: 24, required: true, label: Sharpness, description: 'Sharpness: 0 to 24, or 0 to 10 on the M series
          and PN-ME.'}
    returns: ack
  get_tint: {summary: Read the tint (00-90), returns: value}
  set_tint:
    summary: Set the tint (00-90) and read it back
    params:
      value: {type: int, min: 0, max: 100, required: true, label: Tint, description: Tint from 0 (purplish) to 100 (greenish).}
    returns: ack
  get_color: {summary: Read the color (02-1F), returns: value}
  set_color:
    summary: Set the color (02-1F) and read it back
    params:
      value: {type: int, min: 0, max: 100, required: true, label: Color, description: Color saturation from 0 to 100.}
    returns: ack
  get_color_temperature: {summary: Read the color temperature (00-54), returns: value}
  set_color_temperature:
    summary: Set the color temperature (00-54) and read it back
    params:
      value: {type: int, min: 0, max: 74, required: true, label: Color temperature, description: Color temperature from 0 (2600 K) to
          74 (10000 K) in 100 K steps.}
    returns: ack
  get_color_preset: {summary: Read the color preset (00-14), returns: value}
  set_color_preset:
    summary: Set the color preset (00-14) and read it back
    params:
      value: {type: int, min: 0, max: 255, required: true, label: Color preset, description: 'Color preset code: 2 native, 9 10000 K,
          11 custom (user), and others the operation code tables list per model.'}
    returns: ack
  get_red_gain: {summary: Read the red gain (00-16), returns: value}
  set_red_gain:
    summary: Set the red gain (00-16) and read it back
    params:
      value: {type: int, min: 0, max: 255, required: true, label: Red gain, description: 'Red gain: 0 to 255, or 0 to 100 on the M series.'}
    returns: ack
  get_green_gain: {summary: Read the green gain (00-18), returns: value}
  set_green_gain:
    summary: Set the green gain (00-18) and read it back
    params:
      value: {type: int, min: 0, max: 255, required: true, label: Green gain, description: 'Green gain: 0 to 255, or 0 to 100 on the
          M series.'}
    returns: ack
  get_blue_gain: {summary: Read the blue gain (00-1A), returns: value}
  set_blue_gain:
    summary: Set the blue gain (00-1A) and read it back
    params:
      value: {type: int, min: 0, max: 255, required: true, label: Blue gain, description: 'Blue gain: 0 to 255, or 0 to 100 on the M
          series.'}
    returns: ack
  get_picture_mode: {summary: Read the picture mode (02-1A), returns: value}
  set_picture_mode:
    summary: Set the picture mode (02-1A) and read it back
    params:
      value: {type: int, min: 0, max: 255, required: true, label: Picture mode, description: 'Picture mode code: 1 sRGB, 3 high bright,
          4 standard, 5 cinema, 8 and 9 custom 1 and 2, 13-17 SpectraView Engine modes (P404 generation); on the M series 3 high bright,
          8 custom, 28 retail, 29 conferencing, 30 transportation, 31 native.'}
    returns: ack
  get_gamma: {summary: Read the gamma (02-68), returns: value}
  set_gamma:
    summary: Set the gamma (02-68) and read it back
    params:
      value: {type: int, min: 0, max: 255, required: true, label: Gamma, description: 'Gamma code: 1 native, 4 2.2, 5 DICOM simulation,
          6 programmable 1, 7 S gamma, 8 2.4, 9 custom, 15 BT.1886, 16 HLG, 17 PQ, as each model lists.'}
    returns: ack
  get_adaptive_contrast: {summary: Read the adaptive contrast (02-8D), returns: value}
  set_adaptive_contrast:
    summary: Set the adaptive contrast (02-8D) and read it back
    params:
      value: {type: int, min: 0, max: 4, required: true, label: Adaptive contrast, description: '1 off, 2 low, 3 middle (oldest generation),
          4 high.'}
    returns: ack
  get_noise_reduction: {summary: Read the noise reduction (02-26), returns: value}
  set_noise_reduction:
    summary: Set the noise reduction (02-26) and read it back
    params:
      value: {type: int, min: 0, max: 7, required: true, label: Noise reduction, description: 'Noise reduction level: 0 to 3, 5 or 7
          by generation.'}
    returns: ack
  get_aspect: {summary: Read the aspect (02-70), returns: value}
  set_aspect:
    summary: Set the aspect (02-70) and read it back
    params:
      value:
        type: enum
        values: [normal, full, wide, zoom, trim, dynamic, dot_by_dot, cinema, auto]
        required: true
        label: Aspect
        description: 'The aspect: normal, full, wide, zoom, dynamic and dot_by_dot on most models; trim, cinema and auto on some.'
    returns: ack
  get_overscan: {summary: Read the overscan (02-E3), returns: value}
  set_overscan:
    summary: Set the overscan (02-E3) and read it back
    params:
      value: {type: int, min: 1, max: 3, required: true, label: Overscan, description: '1 off and 2 on; on the M series 1 underscan,
          2 overscan, 3 auto.'}
    returns: ack
  get_image_flip: {summary: Read the image flip (02-D7), returns: value}
  set_image_flip:
    summary: Set the image flip (02-D7) and read it back
    params:
      value:
        type: enum
        values: [none, horizontal, vertical, rotate_180]
        required: true
        label: Image flip
        description: Flip the picture horizontally, vertically or both (180 degrees).
    returns: ack
  get_auto_dimming: {summary: Read the auto dimming (02-2D), returns: value}
  set_auto_dimming:
    summary: Set the auto dimming (02-2D) and read it back
    params:
      value: {type: int, min: 0, max: 2, required: true, label: Auto dimming, description: '0 off, 1 on (mode 1), 2 mode 2.'}
