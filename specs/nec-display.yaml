      value: {type: bool, required: true, label: Screen mute, description: On blanks the picture; off shows it.}
    returns: ack
  get_balance: {summary: Read the balance (00-93), returns: value}
  set_balance:
    summary: Set the balance (00-93) and read it back
    params:
      value: {type: int, min: 0, max: 60, required: true, label: Balance, description: 'Balance: 0 to 60 with 30 centered, or 0 to 50
          with 25 centered on the M series and PN-ME.'}
    returns: ack
  get_treble: {summary: Read the treble (00-8F), returns: value}
  set_treble:
    summary: Set the treble (00-8F) and read it back
    params:
      value: {type: int, min: 0, max: 100, required: true, label: Treble, description: 'Treble: 0 to 12 with 6 centered, 0 to 100 on
          the M series, 0 to 10 on the PN-ME.'}
    returns: ack
  get_bass: {summary: Read the bass (00-91), returns: value}
  set_bass:
    summary: Set the bass (00-91) and read it back
    params:
      value: {type: int, min: 0, max: 100, required: true, label: Bass, description: 'Bass: 0 to 12 with 6 centered, 0 to 100 on the
          M series, 0 to 10 on the PN-ME.'}
    returns: ack
  get_stereo: {summary: Read the stereo (00-94), returns: value}
  set_stereo:
    summary: Set the stereo (00-94) and read it back
    params:
      value:
        type: enum
        values: [mono, stereo]
        required: true
        label: Stereo
        description: Mono or stereo sound.
    returns: ack
  get_audio_input: {summary: Read the audio input (02-2E), returns: value}
  set_audio_input:
    summary: Set the audio input (02-2E) and read it back
    params:
      value: {type: int, min: 0, max: 255, required: true, label: Audio input, description: 'Audio input code: 1 to 3 analog inputs,
          4 HDMI 1, 6 option, 7 DisplayPort 1, 8 DisplayPort 2, 10 HDMI 2, 13 media player, 14 compute module, as each model lists.'}
    returns: ack
  get_line_out: {summary: Read the line out (10-81), returns: value}
  set_line_out:
    summary: Set the line out (10-81) and read it back
    params:
      value:
        type: enum
        values: [fixed, variable]
        required: true
        label: Line out
        description: 'The line out level: fixed or variable.'
    returns: ack
  get_pip_mode: {summary: Read the pIP mode (02-72), returns: value}
  set_pip_mode:
    summary: Set the pIP mode (02-72) and read it back
    params:
      value: {type: int, min: 1, max: 6, required: true, label: PIP mode, description: '1 off, 2 PIP, 3 POP, 4 still, 5 PBP aspect,
          6 PBP full (P404 generation: 1, 2, 5).'}
    returns: ack
  get_pip_input: {summary: Read the pIP input (02-73), returns: value}
  set_pip_input:
    summary: Set the pIP input (02-73) and read it back
    params:
      value:
        type: enum
        values: *id001
        required: true
        label: PIP input
        description: The sub picture's input.
    returns: ack
  get_pip_size: {summary: Read the pIP size (10-B9), returns: value}
  set_pip_size:
    summary: Set the pIP size (10-B9) and read it back
    params:
      value: {type: int, min: 0, max: 80, required: true, label: PIP size, description: PIP size from 0 to 80.}
    returns: ack
  get_pip_x: {summary: Read the pIP horizontal position (02-74), returns: value}
  set_pip_x:
    summary: Set the pIP horizontal position (02-74) and read it back
    params:
      value: {type: int, min: 0, max: 100, required: true, label: PIP horizontal position, description: PIP horizontal position from
          0 to 100.}
    returns: ack
  get_pip_y: {summary: Read the pIP vertical position (02-75), returns: value}
  set_pip_y:
    summary: Set the pIP vertical position (02-75) and read it back
    params:
      value: {type: int, min: 0, max: 100, required: true, label: PIP vertical position, description: PIP vertical position from 0 to
          100.}
    returns: ack
  get_multi_picture_mode: {summary: Read the multi-picture mode (11-EB), returns: value}
  set_multi_picture_mode:
    summary: Set the multi-picture mode (11-EB) and read it back
    params:
      value:
        type: enum
        values: ['off', pip2, pbp2, pbp4]
        required: true
        label: Multi-picture mode
        description: Off, two pictures as PIP, two side by side, or four.
    returns: ack
  get_picture1_input: {summary: Read the picture 1 input (11-0E), returns: value}
  set_picture1_input:
    summary: Set the picture 1 input (11-0E) and read it back
    params:
      value:
        type: enum
        values: *id001
        required: true
        label: Picture 1 input
        description: Picture 1's input in multi-picture mode.
    returns: ack
  get_picture2_input: {summary: Read the picture 2 input (11-0F), returns: value}
  set_picture2_input:
    summary: Set the picture 2 input (11-0F) and read it back
    params:
      value:
        type: enum
        values: *id001
        required: true
        label: Picture 2 input
        description: Picture 2's input in multi-picture mode.
    returns: ack
  get_picture3_input: {summary: Read the picture 3 input (11-10), returns: value}
  set_picture3_input:
    summary: Set the picture 3 input (11-10) and read it back
    params:
      value:
        type: enum
        values: *id001
        required: true
        label: Picture 3 input
        description: Picture 3's input in multi-picture mode.
    returns: ack
  get_picture4_input: {summary: Read the picture 4 input (11-11), returns: value}
  set_picture4_input:
    summary: Set the picture 4 input (11-11) and read it back
    params:
      value:
        type: enum
        values: *id001
        required: true
        label: Picture 4 input
        description: Picture 4's input in multi-picture mode.
    returns: ack
  get_tile_columns: {summary: Read the tile columns (02-D0), returns: value}
  set_tile_columns:
    summary: Set the tile columns (02-D0) and read it back
    params:
      value: {type: int, min: 1, max: 10, required: true, label: Tile columns, description: 'Displays across the wall, 1 to 10 (1 to
          5 on the PN-ME).'}
    returns: ack
  get_tile_rows: {summary: Read the tile rows (02-D1), returns: value}
  set_tile_rows:
    summary: Set the tile rows (02-D1) and read it back
    params:
      value: {type: int, min: 1, max: 10, required: true, label: Tile rows, description: 'Displays down the wall, 1 to 10 (1 to 5 on
          the PN-ME).'}
    returns: ack
  get_tile_position: {summary: Read the tile position (02-D2), returns: value}
  set_tile_position:
    summary: Set the tile position (02-D2) and read it back
    params:
      value: {type: int, min: 1, max: 100, required: true, label: Tile position, description: 'This display''s place in the wall from
          1, left to right then top to bottom (1 to 25 on the PN-ME).'}
    returns: ack
  get_tile_matrix: {summary: Read the tile matrix (02-D3), returns: value}
  set_tile_matrix:
    summary: Set the tile matrix (02-D3) and read it back
    params:
      value:
        type: enum
        values: [disabled, enabled, disabled_erase_frame]
        required: true
        label: Tile matrix
        description: enabled shows this display's part of the wall; disabled_erase_frame (set only, M series and oldest generation)
          also erases the frame.
    returns: ack
  get_tile_compensation: {summary: Read the tile compensation (02-D5), returns: value}
  set_tile_compensation:
    summary: Set the tile compensation (02-D5) and read it back
    params:
      value: {type: bool, required: true, label: Tile compensation, description: On hides the picture behind the bezels.}
    returns: ack
  get_power_on_delay: {summary: Read the power on delay (02-D8), returns: value}
  set_power_on_delay:
    summary: Set the power on delay (02-D8) and read it back
    params:
      value: {type: int, min: 0, max: 50, required: true, label: Power on delay, description: Seconds from 0 (off) to 50 to wait before
          turning on.}
    returns: ack
  get_osd_language: {summary: Read the oSD language (00-68), returns: value}
  set_osd_language:
    summary: Set the oSD language (00-68) and read it back
    params:
      value: {type: int, min: 1, max: 15, required: true, label: OSD language, description: 'Menu language: 1 English, 2 German, 3 French,
          4 Spanish, 5 Japanese, 6 Italian, 7 Swedish, 9 Russian, 14 Chinese.'}
    returns: ack
  get_osd_time: {summary: Read the oSD time (00-FC), returns: value}
  set_osd_time:
    summary: Set the oSD time (00-FC) and read it back
    params:
      value: {type: int, min: 2, max: 48, required: true, label: OSD time, description: 'How long the menu stays, 2 to 48 in 5 s steps
          (10 to 240 s).'}
    returns: ack
  get_information_osd: {summary: Read the information OSD (02-3D), returns: value}
  set_information_osd:
    summary: Set the information OSD (02-3D) and read it back
    params:
      value: {type: int, min: 0, max: 16, required: true, label: Information OSD, description: '0 off, or 3 to 10 seconds (on the M
          series 1 to 16, on the PN-ME 1 on).'}
    returns: ack
  get_osd_rotation: {summary: Read the oSD rotation (02-41), returns: value}
  set_osd_rotation:
    summary: Set the oSD rotation (02-41) and read it back
    params:
      value: {type: int, min: 0, max: 3, required: true, label: OSD rotation, description: '0 landscape, 1 rotated, 2 auto (M series),
          3 180 degrees (PN-ME).'}
    returns: ack
  get_power_led: {summary: Read the power LED (02-BE), returns: value}
  set_power_led:
    summary: Set the power LED (02-BE) and read it back
    params:
      value: {type: bool, required: true, label: Power LED, description: On lights the power indicator.}
    returns: ack
  get_monitor_id: {summary: Read the monitor ID (02-3E), returns: value}
  set_monitor_id:
    summary: Set the monitor ID (02-3E) and read it back
    params:
      value: {type: int, min: 1, max: 100, required: true, label: Monitor ID, description: 'The display''s monitor ID, 1 to 100 (1 to
          25 on the PN-ME).'}
    returns: ack
  get_group_ids: {summary: Read the group IDs (10-7F), returns: value}
  set_group_ids:
    summary: Set the group IDs (10-7F) and read it back
    params:
      value: {type: int, min: 0, max: 1023, required: true, label: Group IDs, description: 'The groups the display is in, a bit each:
          bit 0 group A to bit 9 group J.'}
    returns: ack
  get_off_timer: {summary: Read the off timer (02-2B), returns: value}
  set_off_timer:
    summary: Set the off timer (02-2B) and read it back
    params:
      value: {type: int, min: 0, max: 24, required: true, label: Off timer, description: Hours from 0 (off) to 24 before the display
          turns off.}
    returns: ack
  get_quick_start: {summary: Read the quick start (11-EA), returns: value}
  set_quick_start:
    summary: Set the quick start (11-EA) and read it back
    params:
      value: {type: bool, required: true, label: Quick start, description: 'On keeps the display ready in standby, so every command
          is taken there, using more standby power.'}
    returns: ack
  get_fan_control: {summary: Read the fan control (02-7D), returns: value}
  set_fan_control:
    summary: Set the fan control (02-7D) and read it back
    params:
      value: {type: int, min: 1, max: 7, required: true, label: Fan control, description: '1 auto, 2 forced on; 3 to 7 auto with an
          offset of -2 to -10 on the oldest generation.'}
    returns: ack
  get_fan_speed: {summary: Read the fan speed (10-3F), returns: value}
  set_fan_speed:
    summary: Set the fan speed (10-3F) and read it back
    params:
      value:
        type: enum
        values: [high, low]
        required: true
        label: Fan speed
        description: Fan speed high or low.
    returns: ack
  get_input_detect: {summary: Read the input detect (02-40), returns: value}
  set_input_detect:
    summary: Set the input detect (02-40) and read it back
    params:
      value:
        type: enum
        values: [first, last, none, video, custom]
        required: true
        label: Input detect
        description: 'How the display switches input on its own: first or last detected, none, video, or custom priorities.'
    returns: ack
  get_screen_saver_motion: {summary: Read the screen saver motion (02-DD), returns: value}
  set_screen_saver_motion:
    summary: Set the screen saver motion (02-DD) and read it back
    params:
      value: {type: int, min: 0, max: 90, required: true, label: Screen saver motion, description: Pixel shift interval from 0 (off)
          to 90 in 10 s steps.}
    returns: ack
  get_side_border_color: {summary: Read the side border color (02-DF), returns: value}
  set_side_border_color:
    summary: Set the side border color (02-DF) and read it back
    params:
      value: {type: int, min: 0, max: 100, required: true, label: Side border color, description: Side border color from 0 (black) to
          100 (white).}
    returns: ack
  get_ir_lock: {summary: Read the iR lock (10-D4), returns: value}
  set_ir_lock:
    summary: Set the iR lock (10-D4) and read it back
    params:
      value:
        type: enum
        values: [unlocked, all, custom]
        required: true
        label: IR lock
        description: 'The remote control: unlocked, all locked, or locked as the custom IR lock settings say.'
    returns: ack
  get_key_lock: {summary: Read the key lock (11-6A), returns: value}
  set_key_lock:
    summary: Set the key lock (11-6A) and read it back
    params:
      value: {type: int, min: 1, max: 3, required: true, label: Key lock, description: 'The display''s keys: 1 unlocked, 2 all locked,
          3 custom.'}
    returns: ack
  get_cec: {summary: Read the cEC (11-76), returns: value}
  set_cec:
    summary: Set the cEC (11-76) and read it back
    params:
      value: {type: int, min: 1, max: 3, required: true, label: CEC, description: 'HDMI CEC: 1 off, 2 on (mode 1), 3 mode 2 (M series).'}
    returns: ack
  get_human_sensing: {summary: Read the human sensing (10-75), returns: value}
  set_human_sensing:
    summary: Set the human sensing (10-75) and read it back
    params:
      value: {type: int, min: 1, max: 4, required: true, label: Human sensing, description: '1 disabled, 2 auto off, 4 custom.'}
    returns: ack
  get_illuminance: {summary: Read the illuminance (02-B4), returns: value}
  get_power: {summary: 'Read the power state (01D6): on, standby, suspend or off', returns: value}
  set_power:
    summary: Turn the display on or off (C203D6); the next message waits 15 s, then the power state is read
    params:
      'on': {type: bool, required: true, label: Power, description: On turns the display on; off turns it off as the remote's power
          key does.}
    returns: ack
  save_settings: {summary: 'Save the current settings (0C), so they survive a power cycle', returns: ack}
  get_timing: {summary: 'Read the input timing (07): signal state and horizontal and vertical frequencies', returns: value}
  self_diagnosis: {summary: 'Run the self-diagnosis (B1): normal, or the faults found (power rails, fans, backlight, temperature, no
      signal)', returns: value}
  get_serial_number: {summary: Read the serial number (C216), returns: value}
  get_model: {summary: Read the model name (C217), returns: value}
  get_firmware_version: {summary: Read the firmware version (CA02 00), returns: value}
  get_date: {summary: Read the display's date and time (C211), returns: value}
  set_date:
    summary: Set the display's date and time (C212) and read it back
    params:
      year: {type: int, min: 2000, max: 2099, required: true, label: Year, description: Year from 2000 to 2099 (2015 at the earliest
          on the M series).}
      month: {type: int, min: 1, max: 12, required: true, label: Month, description: Month from 1 to 12.}
      day: {type: int, min: 1, max: 31, required: true, label: Day, description: Day of the month from 1 to 31.}
      weekday: {type: int, min: 0, max: 6, required: true, label: Weekday, description: Day of the week from 0 (Sunday) to 6 (Saturday).}
      hour: {type: int, min: 0, max: 23, required: true, label: Hour, description: Hour from 0 to 23.}
      minute: {type: int, min: 0, max: 59, required: true, label: Minute, description: Minute from 0 to 59.}
      daylight_saving: {type: bool, required: true, label: Daylight saving, description: 'On marks the time as daylight saving time
          (reserved on the M series, which takes off).'}
    returns: ack
  get_temperature:
    summary: Read one temperature sensor (select it with 02-78, read 02-79), in °C
    params:
      sensor: {type: int, min: 1, max: 3, required: true, label: Sensor, description: Temperature sensor from 1 to 3; models have one
          to three.}
    returns: value
  get_fan_status:
    summary: 'Read one fan''s status (select it with 02-7A, read 02-7B): off, on or error'
    params:
      fan: {type: int, min: 1, max: 3, required: true, label: Fan, description: Fan from 1 to 3; models have up to three.}
    returns: value
  auto_setup: {summary: Adjust the VGA picture automatically (00-1E); the next message waits 10 s, returns: ack}
  reset:
    summary: Reset all settings or a menu's (02-CB)
    params:
      target:
        type: enum
        values: [factory, picture, adjust, audio, schedule, pip, osd, multi_display, protection, advanced, advanced2, control, remote_control,
          slot, network, protect, system, input]
        required: true
        label: Reset
        description: factory resets everything; the others one menu's settings, as each model lists them.
    returns: ack
  get_vcp:
    summary: 'Read any operation code (page, code): returns its value and maximum'
    params:
      page: {type: int, min: 0, max: 255, required: true, label: Page, description: 'Operation code page, 0 to 255 (00h, 02h, 10h, 11h
          in NEC''s tables).'}
      code: {type: int, min: 0, max: 255, required: true, label: Code, description: 'Operation code, 0 to 255.'}
    returns: value
  set_vcp:
    summary: 'Set any operation code (page, code) to a value: returns the value set and the maximum'
    params:
      page: {type: int, min: 0, max: 255, required: true, label: Page, description: 'Operation code page, 0 to 255.'}
      code: {type: int, min: 0, max: 255, required: true, label: Code, description: 'Operation code, 0 to 255.'}
      value: {type: int, min: 0, max: 65535, required: true, label: Value, description: 'The value, 0 to 65535, as NEC''s operation
          code table gives it.'}
    returns: value
