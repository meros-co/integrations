  get_ambient_light_sensing: {summary: Read the ambient light sensing (10-C8), returns: value}
  set_ambient_light_sensing:
    summary: Set the ambient light sensing (10-C8) and read it back
    params:
      value: {type: int, min: 1, max: 3, required: true, label: Ambient light sensing, description: '1 off, 2 mode 1 (on), 3 mode 2.'}
    returns: ack
  get_video_range: {summary: Read the video range (10-40), returns: value}
  set_video_range:
    summary: Set the video range (10-40) and read it back
    params:
      value:
