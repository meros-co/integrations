spec: 1
id: nec-display
name: NEC (Sharp NEC) large-format displays (External Control protocol)
vendor: NEC Display Solutions / Sharp NEC Display Solutions
category: display
implementation: native
reason: >
  NEC's display protocol frames each message with SOH, the monitor ID as a byte, the message type, a length
  in hex, the body between STX and ETX in hex digits, and an XOR check code; replies are matched by type and
  operation code, a busy display answers a NULL message, and the controller must wait 15 s after power and
  10 s after an input change before the next message. Temperatures and fans are read by selecting a sensor
  with one message and reading it with the next.

source:
  - title: "External Control, M series M751/M861/M981, Rev.1.1 (2023-07)"
    author: "Sharp NEC Display Solutions"
    url: "https://sharp-displays.jp.sharp/support/webdl/dl_service/data/display/manual/External_Control_M751_M861_M981_EN_Rev1.1.pdf"
    note: >
      RS-232C 9600 bps, 8 data bits, no parity, 1 stop bit, crossed cable; LAN on TCP 7142, dropped after 15
      minutes without a packet (§2-§3); waiting for each reply, then 15 s after power and 10 s after input,
      auto setup or factory reset (§3); the header, destination addresses (monitor ID 40h + n, ALL, groups),
      length, check code and its example, delimiter (§4); get, set and command message bodies, the NULL
      message (§5); temperature readout in 0.5 °C (§6.2); power status 01D6 and control C203D6, save 0C,
      timing 07, self-diagnosis B1, serial C216, model C217, firmware CA02, date and time C211/C212, and the
      operation code tables (VCP and CTL chapters).
  - title: "External Control, NEC LCD Monitor, Rev.1.0 (G4), P404/P484/P554/V404/V484/V554 (2016-11-16)"
    author: "NEC Display Solutions"
    url: "https://www.nec.com.au/download_file/1839/781"
    note: "The same framing; the 2016 generation's operation codes (input codes with media player and compute module, picture inputs 11-0E to 11-11, IR and key locks, CEC)."
  - title: "External Control, NEC LCD Monitor, Rev.2.4 (G2), P403 family and X464UN/X554UN video wall models (2015-06-19)"
    author: "NEC Display Solutions"
    url: "https://www.nec.com.au/download_file/view/1870/552"
    note: "The 2015 generation's operation codes, frame compensation of the UN video wall models, schedules C221/C222."
  - title: "EXTERNAL CONTROL, NEC LCD Monitor, Rev.3.8 (2013-06-28)"
    author: "NEC Display Solutions"
    url: "https://www.nec.com.au/download_file/1794/781"
    note: "The 2011-2013 generation (P402, V422, X461S, X463UN ...): a packet interval longer than 600 ms (§3.3), the oldest input and picture mode codes."
  - title: "External Control, ME series PN-ME432/PN-ME502/PN-ME552/PN-ME652, Rev.1.4"
    author: "Sharp NEC Display Solutions"
    url: "https://smj.jp.sharp/bs/lcd-display/lineup/pnme/download_files/pnme652_pnme552_pnme502_pnme432_external_control_manual_ver1_4.pdf"
    note: "Japanese. The same protocol on Sharp's ME series; the commands taken in standby (§8.1); out-of-range values ignored with result 00 (§8.2); at most 100 ms between the bytes of one message."
  - title: "NEC PD SDK (nec_pd_sdk), Sharp NEC Display Solutions (MIT)"
    url: "https://github.com/SharpNECDisplaySolutions/necpdsdk"
    note: "Corroboration only, licence checked, no code copied: the operation code list and the controller's reply timeout."

settings:
  monitor_id: { type: int, min: 1, max: 100, default: 1, label: Monitor ID, description: "The display's monitor ID from its menu, 1 to 100; on an RS-232C chain, the display this device addresses." }
  poll_ms: { type: int, min: 1000, max: 3600000, default: 5000, label: Read interval, description: "Milliseconds between reads of power, input, volume and mute; other settings are read every minute." }
  packet_interval_ms: { type: int, min: 0, max: 10000, label: Packet interval, description: "Milliseconds to wait after each reply before the next message; left out, 600 on the 2011-2013 generation (g1), as NEC asks, and 0 on later ones." }

ports:
  - { port: 7142, protocol: tcp, role: control, note: "fixed on the display" }

