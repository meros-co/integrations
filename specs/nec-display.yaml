    params:
      value: {type: int, min: 0, max: 100, required: true, label: Volume, description: Volume from 0 to 100.}
    returns: ack
  get_mute: {summary: Read the mute (00-8D), returns: value}
  set_mute:
    summary: Set the mute (00-8D) and read it back
    params:
      value: {type: bool, required: true, label: Mute, description: On mutes the sound; off restores it.}
