commands:
  set_gain:
    summary: "OcaGain SetGain (4.2): the gain in dB, on an object addressed by role path (object) or object number (ono)"
    params:
      object: &object { type: string, max_length: 4096,
                        label: Object,
                        description: "Object by role path, the roles from the root block down joined by '/', e.g. Input 1/Gain; give this or an object number." }
      ono: &ono { type: int, min: 1, max: 4294967295,
                  label: Object number,
                  description: "Object number (ono), stable for a device's configuration; give this or a role path." }
      gain_db: { type: float, required: true,
                 label: Gain,
                 description: "Gain in dB; the object's own minimum and maximum apply." }
    returns: ack
  set_mute:
    summary: "OcaMute SetState (4.2): muted (state 1) or unmuted (2)"
    params:
      object: *object
      ono: *ono
      muted: { type: bool, default: true,
               label: Mute,
               description: "True mutes the object, false unmutes it." }
    returns: ack
  set_switch:
    summary: >
      OcaSwitch SetPosition (4.2): a position number from 0, or a position by its name (position_name, from the
      switch's position names read on connecting)
    params:
      object: *object
      ono: *ono
      position: { type: int, min: 0, max: 65535,
                  label: Position,
                  description: "Switch position, numbered from 0; give this or a position name." }
      position_name: { type: string, max_length: 1024,
                       label: Position name,
                       description: "Switch position by its name, as the switch reported on connecting; give this or a position number." }
    returns: ack
  set_polarity:
    summary: "OcaPolarity SetState (4.2): inverted (state 2) or non-inverted (1)"
    params:
      object: *object
      ono: *ono
      inverted: { type: bool, default: true,
                  label: Invert,
                  description: "True inverts the polarity, false sets it back to normal." }
    returns: ack
  set_delay:
    summary: "OcaDelay SetDelayTime (4.2): the delay in seconds"
    params:
      object: *object
      ono: *ono
      delay_s: { type: float, min: 0, required: true,
                 label: Delay,
                 description: "Delay time in seconds, e.g. 0.005 for 5 ms." }
    returns: ack
  set_bool:
    summary: "OcaBooleanActuator SetSetting (5.2)"
    params:
      object: *object
      ono: *ono
      value: { type: bool, required: true,
               label: Value,
               description: "New setting of the boolean actuator." }
    returns: ack
  set_int:
    summary: "OcaInt8/16/32/64Actuator or OcaUint8/16/32/64Actuator SetSetting (5.2); the value must fit the actuator's type"
    params:
      object: *object
      ono: *ono
      value: { type: int, required: true,
               label: Value,
               description: "New setting of the integer actuator; it must fit the actuator's type, e.g. 0 to 255 for an 8-bit unsigned one." }
    returns: ack
  set_float:
    summary: "OcaFloat32Actuator or OcaFloat64Actuator SetSetting (5.2)"
    params:
      object: *object
      ono: *ono
      value: { type: float, required: true,
               label: Value,
               description: "New setting of the floating-point actuator, in the actuator's own unit." }
    returns: ack
  set_string:
    summary: "OcaStringActuator SetSetting (5.2)"
    params:
      object: *object
      ono: *ono
      value: { type: string, required: true, max_length: 65535,
               label: Value,
               description: "New text for the string actuator." }
    returns: ack
  identify:
    summary: >
      Start or stop the device's identification. On an amplifier, d&b's wink (the Wink object's method 5.2 with
      0x0200 to start and 0 to stop: the display flashes and the buzzer sounds); on a DS10 or DS100, OcaIdentificationActuator
      SetActive (4.2) on the object given, or the first identification actuator found in the tree
    params:
      object: *object
      ono: *ono
      enabled: { type: bool, default: true,
                 label: Identify,
                 description: "True starts the device's identification (a flashing LED or display), false stops it." }
    returns: ack
  get_property:
    summary: >
      Read one property ("level.index", e.g. "4.1") of an object, with the getter of its class. Returns the
      decoded value, or {value, min, max} for a bounded property, or {hex} when the reply cannot be decoded. Only
      the properties listed under state are known; call_method reaches any other
    params:
      object: *object
      ono: *ono
      property: &property { type: string, required: true, pattern: "^[0-9]{1,5}\\.[0-9]{1,5}$",
                            label: Property,
                            description: "Property ID as level.index, e.g. 4.1 for the fourth class level's first property." }
    returns: value
  set_property:
    summary: >
      Write one property ("level.index") of an object with the setter of its class; value is JSON of the
      property's type (a number, boolean, string, or list of strings or booleans; muted and inverted states as
      booleans, delays in seconds)
    params:
      object: *object
      ono: *ono
      property: *property
      value: { type: json, required: true,
               label: Value,
               description: "New value as JSON of the property's type: a number, boolean, string or list; mute and polarity states as booleans, delays in seconds." }
    returns: ack
  call_method:
    summary: >
      Escape hatch: call any method ("level.index") on an object with parameters already marshalled as OCP.1
      bytes (params_hex) and their count (param_count; 1 when params_hex is not empty, else 0). Returns the
      response as {status, status_name, param_count, params_hex}, whatever the status
    params:
      object: *object
      ono: *ono
      method: { type: string, required: true, pattern: "^[0-9]{1,5}\\.[0-9]{1,5}$",
                label: Method,
                description: "Method ID as level.index, e.g. 4.2." }
      params_hex: { type: string, default: "", max_length: 131070, pattern: "^[0-9A-Fa-f ]*$",
                    label: Parameters,
                    description: "Method parameters already marshalled as OCP.1 bytes, in hex; empty for none." }
      param_count: { type: int, min: 0, max: 255,
                     label: Parameter count,
                     description: "Number of parameters in the hex; when not given, 1 if parameters are given and 0 if not." }
    returns: value
  refresh_objects:
    summary: >
      Forget the object tree and walk the root block again; acknowledged when the walk is done. When monitored,
      known objects are then read again and any new ones subscribed to
    returns: ack
  get_device_info:
    summary: >
      Read the device manager (object 1): model GUID, serial number, model description, name, AES70 version,
      role, user inventory code, enabled, state, message and revision id. A property the device does not
      implement is null
    returns: value
  set_power:
    summary: "Switch the amplifier on or to standby (Settings_PwrOn, an OcaSwitch: 1 on, 0 standby)"
    params:
      powered: { type: bool, default: true, label: Power, description: "True switches the amplifier on, false to standby." }
    returns: ack
  set_channel_mute:
    summary: "Mute an output channel (Config_Mute, an OcaMute)"
    params:
      channel: &channel { type: enum, values: [A, B, C, D], required: true, label: Channel,
                          description: "Output channel, A to D as on the amplifier." }
      muted: { type: bool, default: true, label: Mute, description: "True mutes the channel, false unmutes it." }
    returns: ack
  set_channel_level:
    summary: "Set an output channel's level (Config_PotiLevel, an OcaGain), in dB"
    params:
      channel: *channel
      gain_db: { type: float, min: -57.5, max: 6, required: true, label: Level,
                 description: "Channel level in dB, -57.5 to +6 as d&b's integrations give it; the object's own range applies." }
    returns: ack
  set_channel_delay:
    summary: "Set an output channel's delay (ChStatus_MsDelay, an OcaDelay set in seconds), in milliseconds"
    params:
      channel: *channel
      delay_ms: { type: float, min: 0.3, max: 9999, required: true, label: Delay,
                  description: "Delay in milliseconds, 0.3 to 9999 as d&b's Q-SYS plug-in offers; the object's own range applies." }
    returns: ack
  set_channel_delay_enabled:
    summary: "Switch an output channel's delay in or out (Config_DelayOn, an OcaSwitch: 1 on, 0 off)"
    params:
      channel: *channel
      enabled: { type: bool, default: true, label: Delay on, description: "True switches the delay in, false out." }
    returns: ack
  set_channel_name:
    summary: "Name an output channel (Config_ChannelName, an OcaStringActuator)"
    params:
      channel: *channel
      name: { type: string, required: true, max_length: 65535, label: Name, description: "The channel's new name." }
    returns: ack
  set_load_monitoring:
    summary: "Switch an output channel's load monitoring (En_En_Enabled, an OcaSwitch: 1 on, 0 off)"
    params:
      channel: *channel
      enabled: { type: bool, default: true, label: Load monitoring,
                 description: "True enables load monitoring on the channel, false disables it, which also clears its errors." }
    returns: ack
  set_channel_filter:
    summary: >
      Set one of an output channel's three filter switches (Config_Filter1 and 2, OcaSwitch; Config_Filter3, an
      OcaInt32Actuator), whose meaning depends on the loudspeaker setup selected on the channel
    params:
      channel: *channel
      filter: { type: int, min: 1, max: 3, required: true, label: Filter,
                description: "Filter 1 (CUT, INFRA, 100Hz, LFC or HFC: 0 off, 1 on), 2 (HFA, CSA: 0 to 2) or 3 (CPL or HF trim: -9 to 5)." }
      value: { type: int, min: -9, max: 5, required: true, label: Value,
               description: "Position for filters 1 and 2, the setting for filter 3, as the loudspeaker setup defines them." }
    returns: ack
  set_input_routing:
    summary: "Route an input to an output channel or take it off (Config_InputEnable1 to 8, OcaSwitch per channel: 1 on, 0 off)"
    params:
      channel: *channel
      input: &input { type: enum, values: [A1, A2, A3, A4, D1, D2, D3, D4], required: true, label: Input,
                      description: "Analog input A1 to A4 or digital input D1 to D4 (Dante on a 5D, Milan on a 5DM)." }
      enabled: { type: bool, default: true, label: Routed, description: "True routes the input to the channel, false removes it." }
    returns: ack
  set_input_gain:
    summary: "Set an input's gain (Input_Analog_Gain or Input_Digital_Gain, an OcaGain per input), in dB"
    params:
      input: *input
      gain_db: { type: float, min: -57.5, max: 6, required: true, label: Gain,
                 description: "Input gain in dB, -57.5 to +6 as d&b's Q-SYS plug-in offers; the object's own range applies." }
    returns: ack
  set_input_gain_enabled:
    summary: "Switch the input gains in or out (Settings_InputGainEnable, an OcaSwitch: 1 on, 0 off)"
    params:
      enabled: { type: bool, default: true, label: Input gain, description: "True applies the input gains, false bypasses them." }
    returns: ack
  set_input_monitoring:
    summary: "Switch an input's monitoring (InputMonitoring_Analog_Enable or _Digital_Enable, an OcaSwitch per input: 1 on, 0 off)"
    params:
      input: *input
      enabled: { type: bool, default: true, label: Input monitoring,
                 description: "True enables monitoring of the input, false disables it, which also clears its errors." }
    returns: ack
  set_input_fallback:
    summary: "Set the input fallback mode (Settings_InputFallbackMode, an OcaSwitch: 0 off, 1 manual, 2 auto)"
    params:
      mode: &fallback_mode { type: enum, values: ["off", manual, auto], required: true, label: Mode,
                             description: "Off, manual (switched with the active command) or auto (switched by the amplifier)." }
    returns: ack
  set_input_fallback_active:
    summary: "Switch to or from the fallback inputs by hand (Status_InputFallbackActive, an OcaSwitch: 1 active, 0 not)"
    params:
      active: { type: bool, default: true, label: Fallback active, description: "True switches to the fallback inputs, false back." }
    returns: ack
  set_input_override:
    summary: "Set the input override mode (Settings_InputOverrideMode, an OcaSwitch: 0 off, 1 manual, 2 auto)"
    params:
      mode: *fallback_mode
    returns: ack
  set_input_override_active:
    summary: "Switch to or from the override inputs by hand (Status_InputOverrideActive, an OcaSwitch: 1 active, 0 not)"
    params:
      active: { type: bool, default: true, label: Override active, description: "True switches to the override inputs, false back." }
    returns: ack
  set_input_mode:
    summary: >
      Set the D80 or D20's input mode (Settings_InputModes, an OcaSwitch): which input pairs are analog and which
      digital
    params:
      mode: { type: int, min: 1, max: 5, required: true, label: Input mode,
              description: "1 inputs 1-2 and 3-4 analog, 2 inputs 1-2 digital and 3-4 analog, 3 inputs 1-2 analog and 3-4 digital, 4 and 5 all digital." }
    returns: ack
  set_device_name:
    summary: "Name the amplifier (Settings_DeviceName, an OcaStringActuator)"
    params:
      name: { type: string, required: true, max_length: 65535, label: Name, description: "The amplifier's new name." }
    returns: ack
  load_amp_preset:
    summary: "Load an AmpPreset (the AmpPreset agent, object 10003, method 3.3 with the preset number)"
    params:
      preset: &preset { type: int, min: 1, max: 15, required: true, label: AmpPreset,
                        description: "AmpPreset number, 1 to 15." }
    returns: ack
  backup_and_load_amp_preset:
    summary: >
      Store the current settings in a backup AmpPreset (13 to 15), then load an AmpPreset (the AmpPreset agent,
      object 10003, method 3.1)
    params:
      preset: *preset
      backup: { type: int, min: 13, max: 15, required: true, label: Backup slot,
                description: "The AmpPreset, 13 to 15, the current settings are stored in first." }
    returns: ack
  set_amp_preset_name:
    summary: "Name an AmpPreset (Preset_PresetName of that preset, an OcaStringActuator)"
    params:
      preset: *preset
      name: { type: string, required: true, max_length: 65535, label: Name, description: "The AmpPreset's new name." }
    returns: ack
  set_device_time:
    summary: >
      Set the amplifier's clock (OcaDeviceTimeManager SetDeviceTimeNTP, 3.2, with seconds since 1900): to the given
      time, or to the host's clock now
    params:
      unix_seconds: { type: int, min: 0, max: 2085978495, label: Time,
                      description: "Time to set as seconds since 1970 (UTC); the host's clock when not given." }
    returns: ack

state:
  discovery.complete:              { type: bool, description: "The walk of the root block has been answered or has timed out throughout" }
  discovery.objects:               { type: int, description: "Objects found under the root block, at every level walked" }
  objects.*.ono:                   { type: int, description: "Object number. An amplifier's documented objects are keyed by name (Power, PowerOk, GeneralError, DeviceError, DeviceErrorText, DeviceName, Wink, AmpPreset/Selected, AmpPreset/Modified, AmpPreset <n>/Name and /Stored, InputFallback/Mode and /Active, InputOverride/Mode and /Active, InputGain/Enabled, InputMode, <channel>/Name, /Mute, /Level, /Delay, /DelayOn, /LoadMonitoring, /Filter1 to 3, /Error, /ErrorText, /ISP, /GR, /OVL, /Headroom and /Input <A1-D4>, Input <A1-D4>/Gain, /Monitoring and /MonitoringError); others found by a walk by role path" }
  objects.*.class:                 { type: string, description: "Class name (OcaGain, OcaBlock, ...) when the class is one the module knows by name, else the class id" }
  objects.*.class_id:              { type: string, description: "Class id, its fields joined by '.' (\"1.1.1.5\"); proprietary classes include 65535 and the vendor's fields" }
  objects.*.class_version:         { type: int, description: "Class version the device reports" }
  objects.*.kind:                  { type: string, description: "The nearest standard class the object is or derives from, e.g. OcaGain for a vendor's subclass of it" }
  objects.*.gain_db:               { type: float, unit: dB, description: "OcaGain 4.1 Gain; with gain_db_min and gain_db_max" }
  objects.*.gain_db_min:           { type: float, unit: dB, description: "OcaGain minimum gain" }
  objects.*.gain_db_max:           { type: float, unit: dB, description: "OcaGain maximum gain" }
  objects.*.muted:                 { type: bool, description: "OcaMute 4.1 State: true for Muted (1), false for Unmuted (2)" }
  objects.*.inverted:              { type: bool, description: "OcaPolarity 4.1 State: true for Inverted (2)" }
  objects.*.position:              { type: int, description: "OcaSwitch 4.1 Position, from 0; with position_min and position_max" }
  objects.*.position_min:          { type: int, description: "OcaSwitch lowest position" }
  objects.*.position_max:          { type: int, description: "OcaSwitch highest position" }
  objects.*.position_names:        { type: array, description: "OcaSwitch 4.2 PositionNames, indexed by position" }
  objects.*.position_enabled:      { type: array, description: "OcaSwitch 4.3 PositionEnableds, when a change is reported" }
  objects.*.delay_s:               { type: float, unit: s, description: "OcaDelay 4.1 DelayTime in seconds; with delay_s_min and delay_s_max" }
  objects.*.delay_s_min:           { type: float, unit: s, description: "OcaDelay minimum delay" }
  objects.*.delay_s_max:           { type: float, unit: s, description: "OcaDelay maximum delay" }
  objects.*.active:                { type: bool, description: "OcaIdentificationActuator 4.1 Active: the device is identifying itself" }
  objects.*.setting:               { type: float, description: "Basic actuator 5.1 Setting: a boolean, integer, float or string by the actuator's class; numeric ones with setting_min and setting_max" }
  objects.*.setting_min:           { type: float, description: "Numeric basic actuator minimum" }
  objects.*.setting_max:           { type: float, description: "Numeric basic actuator maximum" }
  objects.*.reading:               { type: float, description: "Basic sensor 5.1 Reading (OcaBooleanSensor to OcaStringSensor): a boolean, integer, float or string by the sensor's class; numeric ones with reading_min and reading_max" }
  objects.*.reading_min:           { type: float, description: "Numeric basic sensor lowest reading" }
  objects.*.reading_max:           { type: float, description: "Numeric basic sensor highest reading" }
  objects.*.reading_db:            { type: float, unit: dB, description: "OcaLevelSensor 4.1 Reading, as the level_sensors setting asks; with reading_db_min and reading_db_max. Infinite or NaN readings are \"inf\", \"-inf\" or \"nan\"" }
  objects.*.reading_db_min:        { type: float, unit: dB, description: "OcaLevelSensor lowest reading" }
  objects.*.reading_db_max:        { type: float, unit: dB, description: "OcaLevelSensor highest reading" }
  objects.*.reading_state:         { type: string, description: "OcaSensor 3.1 ReadingState when a change is reported: unknown, valid, underrange, overrange or error" }
  objects.*.enabled:               { type: bool, description: "OcaWorker 2.1 Enabled, when a change is reported or set" }
  objects.*.label:                 { type: string, description: "OcaWorker 2.3 Label, when a change is reported or set" }
  objects.*.raw.*:                 { type: string, description: "A reported change of a property the module does not know, keyed by property id (\"4.9\"): its new value as OCP.1 bytes in hex" }
  device.model_guid:               { type: string, description: "OcaDeviceManager ModelGUID as 16 hex digits: a reserved byte, the manufacturer's IEEE OUI (3 bytes) and the model code (4)" }
  device.serial_number:            { type: string, description: "OcaDeviceManager SerialNumber" }
  device.model.manufacturer:       { type: string, description: "OcaDeviceManager ModelDescription manufacturer" }
  device.model.name:               { type: string, description: "OcaDeviceManager ModelDescription name" }
  device.model.version:            { type: string, description: "OcaDeviceManager ModelDescription version" }
  device.name:                     { type: string, description: "OcaDeviceManager DeviceName" }
  device.oca_version:              { type: int, description: "OcaDeviceManager OcaVersion: the AES70 version the device implements" }
  device.role:                     { type: string, description: "OcaDeviceManager Role, from get_device_info" }
  device.user_inventory_code:      { type: string, description: "OcaDeviceManager UserInventoryCode, from get_device_info" }
  device.enabled:                  { type: bool, description: "OcaDeviceManager Enabled" }
  device.state:                    { type: array, description: "OcaDeviceManager State: the names of the bits set, of operational, disabled, error, initializing and updating" }
  device.message:                  { type: string, description: "OcaDeviceManager Message, from get_device_info" }
  device.revision_id:              { type: string, description: "OcaDeviceManager DeviceRevisionID, where implemented" }

quirks:
  - models: [all]
    severity: info
    text: >
      d&b documents its amplifiers' AES70 objects in its own integration plug-ins rather than in a protocol
      document: the object numbers, their classes and the methods here are those of d&b's Q-SYS plug-in (1.16.0),
      with the port and an example command from its AMX module's interface specification. Each object number is
      type << 28 | record << 20 | channel << 15 | object, with type 1, the output channel (A to D as 1 to 4), and
      the record an input or AmpPreset number. The D80, D20, 30D and 10D number objects one way, the D90, D40,
      40D, D25 and 25D another, the 5D and 5DM a third, so the model opened must be the amplifier's.
  - models: [all]
    severity: warning
    text: >
      d&b's integrations connect to TCP port 30013 on the D80, D20, 30D and 10D and 50014 on the others, which is
      the default here; the AMX module notes older firmware may use another port, which can be given. Its
      integrations need 10D, 30D, D20 or D80 firmware 2.02.00 or later, 40D or D40 1.00.00 or later, and 5D
      5.0.1 or later. Only OCP.1 over TCP is documented for the amplifiers. Switched off (not in standby), an
      amplifier stops answering, and is reported lost after three keep-alive intervals.
  - models: [all]
    severity: info
    text: >
      The amplifier's model is in device.model_guid: d&b's integrations check its manufacturer code (3CC0C6, then
      a DB byte) and its last byte, the model (D90 10, D80 07, D40 12, D25 16, D20 09, 40D 13, 30D 0B, 25D 15, 10D
      0A, 5D E0, 5DM E1). A model mismatch means the named objects are the wrong ones; open it with the right
      model.
  - models: [all]
    severity: info
    text: >
      The named objects are known without a walk: on connecting, their classes are asked for and, when the
      amplifier is monitored, each is read and followed by subscription under objects.<name>; with walk on (the
      default), the root block is walked as well and anything else found is keyed by role path. Opened for
      commands only, a named command asks for its object's class once, then sends the setter. Every setter's
      value is read back by notification.
  - models: [d90, d80, d40, d25, d20, 40d, 30d, 25d, 10d]
    severity: critical
    text: >
      load_amp_preset and backup_and_load_amp_preset replace the amplifier's settings at once (outputs, routing,
      levels) and cannot be undone except by loading another AmpPreset; backup_and_load_amp_preset first stores
      the current settings in AmpPreset 13, 14 or 15. AmpPreset/Selected is the active AmpPreset and
      AmpPreset/Modified non-zero once its settings have been changed since it was loaded; AmpPreset <n>/Stored
      false means the slot is empty. The 5D and 5DM have no AmpPresets.
  - models: [all]
    severity: info
    text: >
      identify on an amplifier sends d&b's wink as its plug-ins do: method 5.2 of the Wink object (a d&b subclass
      of OcaIdentificationActuator) with the 16-bit value 0x0200 to start and 0 to stop. Its state is read as the
      identification actuator's Active.
  - models: [all]
    severity: info
    text: >
      In the 2-way active and mix top/sub output modes a channel pair works as one, and d&b's Q-SYS plug-in leaves
      the second channel of an active pair (B or D) out; its controls follow the first. The output mode itself is
      set in R1 or on the amplifier, not through these objects.
  - models: [all]
    severity: info
    text: >
      Delay is an OcaDelay set in seconds (delay_ms / 1000); d&b's plug-in never sends less than 0.3 ms, and the
      delay applies only with the channel's DelayOn switched in. The filter switches are in d&b's plug-in but
      switched off there; what each position does depends on the loudspeaker setup on the channel.
  - models: [d80, d20]
    severity: info
    text: >
      On the D80 and D20 the input mode decides which inputs exist: d&b's plug-in follows the analog inputs A1-A2
      for modes 1 and 3, the digital D1-D2 for 2, 4 and 5, the analog A3-A4 for modes 1 and 2, and the digital
      D3-D4 for 3, 4 and 5. The routing switches of inputs that do not exist in the current mode may refuse a
      change. The other amplifiers have every input at once.
  - models: [all]
    severity: info
    text: >
      Errors: GeneralError is the sum of the device and channel errors, with DeviceErrorText and each channel's
      ErrorText saying what is wrong; PowerOk is false in standby. d&b documents no method that clears load or
      input monitoring errors: its plug-in switches the monitoring off and, a second later, on again, which
      set_load_monitoring and set_input_monitoring do here.
  - models: [all]
    severity: info
    text: >
      Meters: each channel's Headroom (ChStatus_GrHead) is an OcaLevelSensor, read as the level_sensors setting
      says, every second by default; the ISP (input signal present), GR (gain reduction) and OVL (overload)
      indicators are boolean sensors followed by subscription, which may change many times a second.
  - models: [ds10, ds100]
    severity: warning
    text: >
      d&b publishes no AES70 object list or port for the DS10 or DS100: its Q-SYS plug-in for the DS100 is
      distributed through Q-SYS Designer's Asset Manager only. Their objects are found by walking their tree (walk
      on) and reached by role path or object number with the generic commands; the port must be given.
  - models: [all]
    severity: info
    text: >
      Everything else (the transports, keep-alives, the walk, subscriptions, status codes and commands-only
      opening) is the aes70 integration's; see its quirks.
