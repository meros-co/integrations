spec: 1
id: dbaudio
name: d&b audiotechnik amplifiers (AES70)
vendor: d&b audiotechnik
category: other
implementation: native
reason: >
  AES70 over OCP.1: a binary object protocol of objects addressed by number and class, followed through
  subscriptions, with a negotiated keep-alive (see aes70). This integration is the AES70 module with d&b's
  amplifier objects named and their controls as commands.

source:
  - title: "d&b Q-SYS Plug-in 1.16.0 (dbaudio-plugins-q-sys-1.16.0.zip: dbaudio-q-sys plugin.qplug, 20.04.2026)"
    author: d&b audiotechnik GmbH & Co. KG
    url: "https://www.dbaudio.com/assets/products/downloads/software/plugins/dbaudio-plugins-q-sys-1.16.0.zip"
    note: >
      d&b's own plug-in for its D90, D80, D40, D25, D20, 40D, 30D, 25D, 10D, 5D and 5DM amplifiers, a Lua script
      under a BSD-style licence from d&b (redistribution with the notice; read 2026-10-22). Facts only were used:
      the object number tables of the three families (each with d&b's object names, Settings_PwrOn, Config_Mute,
      Config_PotiLevel, ChStatus_MsDelay and the rest), the object number layout (type, record, channel and
      object fields), each object's class (OcaSwitch, OcaMute, OcaGain, OcaDelay, OcaBooleanSensor,
      OcaInt32Sensor, OcaStringSensor, OcaStringActuator, OcaInt32Actuator, OcaLevelSensor, the CdbOcaWinkActuator
      and the CdbOcaAmpPreset agent at object 10003 with methods 3.1 backup-and-load and 3.3 load), the wink's
      method 5.2 and values, the switch positions of the fallback and override modes, the D80 and D20 input modes,
      the AmpPreset range (1 to 15, backups 13 to 15), the level and delay ranges, the time manager's object and
      NTP time, the model codes in the model GUID, the subscription on object 4, and the TCP ports (30013 for the
      D80, D20, 30D and 10D, 50014 for the others). No code was copied.
  - title: "TI 316 1.7 en: QSC Q-SYS Plug-in for d&b 5D, 10D, 30D, 40D, D20, D40 and D80 amplifiers (D5316.EN.01, 10/2022)"
    author: d&b audiotechnik
    url: "https://www.dbaudio.com/assets/products/downloads/ti/dbaudio-technical-information-ti316-1.7-en.pdf"
    note: >
      What the plug-in controls (power, power and error status, wink, input routing, input gains, channel level,
      mute, name and metering of ISP, GR and OVL, AmpPresets with backup, input and load monitoring, fallback and
      override, the device clock) and the firmware it needs (10D, 30D, D20, D80 2.02.00 or later).
  - title: "TI 321 1.3 en: Crestron Module for d&b four channel amplifiers (D5321.EN.01, 02/2023)"
    author: d&b audiotechnik
    url: "https://www.dbaudio.com/assets/products/downloads/ti/dbaudio-technical-information-ti-321-1.3-en.pdf"
    note: Firmware needed (40D and D40 1.00.00, 5D 5.0.1 or later) and the controls, which agree with TI 316.
  - title: "d&b AMX plug-in 2.0.1: Duet Module Interface Specification for D20 / D80 / 10D / 30D Amplifiers (v2.0.0, 09/2016)"
    author: d&b audiotechnik
    url: "https://www.dbaudio.com/assets/products/downloads/integration/amx/db_AMX_PlugIn_2.0.1.ZIP"
    note: >
      The OCP.1 TCP port 30013 on up-to-date firmware (another port for legacy firmware), an example PDU muting
      channel A (SetState 4.2 on object 0x10008205), AmpPresets 1 to 15, the channel level range -57.5 to +6 dB,
      that a switched-off amplifier stops answering keep-alives, and that state is followed by OCA subscriptions.
  - title: "TI 320 1.1 en: Beckhoff Module for d&b 10D, 30D, D20 and D80 amplifiers (D5320.EN.01, 01/2017)"
    author: d&b audiotechnik
    url: "https://www.dbaudio.com/assets/products/downloads/integration/beckhoff/TI320_1.1EN.PDF"
    note: Corroborates the controls (power, name, levels, mutes, AmpPresets, input and load monitoring, fallback and override).
  - title: "d&b audiotechnik: OCA/AES70"
    author: d&b audiotechnik
    url: "https://www.dbaudio.com/global/en/solutions/signal-distribution-and-networking/ocaaes70/"
    note: d&b's AES70 page; it publishes no object documentation of its own beyond the plug-ins above.
  - title: "aes70 integration (this repository)"
    url: "specs/aes70.yaml"
    note: The OCP.1 transports, session, walk, subscriptions, meters and generic commands, with their own sources.

settings:
  # How OCP.1 reaches the device (AES70-3): a TCP stream, UDP datagrams, or
  # WebSocket binary messages, plain (ws) or over TLS (wss). The port given on
  # opening is that transport's.
  transport: { type: enum, values: [tcp, udp, ws, wss], default: tcp,
               label: Transport,
               description: "How OCP.1 reaches the device: TCP, UDP, a WebSocket (ws) or a WebSocket over TLS (wss), on the port given when opening." }
  # The WebSocket's path, for ws and wss.
  ws_path: { type: string, default: "/", max_length: 1024,
             label: WebSocket path,
             description: "Path of the device's OCP.1 WebSocket, for the ws and wss transports." }
  # Offer the AES70-OCP.1 subprotocol when opening the WebSocket, as AES70-3
  # has controllers do; off for a device that predates it.
  ws_subprotocol: { type: bool, default: true,
                    label: Offer OCP.1 subprotocol,
                    description: "Whether to offer the AES70-OCP.1 WebSocket subprotocol; turn off for a device that answers without one." }
  # Over wss, accept a certificate that is not trusted, such as a device's
  # self-signed one: still encrypted, but the device is not authenticated.
  accept_invalid_certs: { type: bool, default: false,
                          label: Accept untrusted certificate,
                          description: "Over wss, accept a certificate that does not chain to a trusted root or name the device, such as a self-signed one." }
  # The heartbeat time sent to the device in the keep-alive on connecting: the
  # device sends a keep-alive when it has sent nothing for this long, and
  # nothing heard for three of them drops the connection. Whole seconds are
  # sent in seconds; anything else in milliseconds (AES70-2018's second form).
  keepalive_interval_ms: { type: int, min: 100, max: 600000, default: 1000,
                           label: Keep-alive interval,
                           description: "Heartbeat time in milliseconds asked of the device; three intervals with nothing heard drop the connection." }
  # How long a request waits for its response.
  request_timeout_ms: { type: int, min: 100, max: 600000, default: 5000,
                        label: Request timeout,
                        description: "Milliseconds a request waits for its response before it fails." }
  # Walk the root block on connecting (when the device is monitored). An
  # amplifier's named objects are known without it; the DS10 and DS100 need it.
  walk: { type: bool, default: true,
          label: Walk object tree,
          description: "Whether to walk the root block on connecting to learn the device's objects, when the device is monitored." }
  # Block levels walked: 1 is the root block's members only, 2 also their
  # members, and so on. Every level when not given.
  walk_depth: { type: int, min: 1, max: 255,
                label: Walk depth,
                description: "Block levels walked: 1 is the root block's members only, 2 also their members, and so on; every level when not given." }
  # Subscribe to the property changes of every known object found.
  subscribe: { type: bool, default: true,
               label: Subscribe,
               description: "Whether to subscribe to property changes of every known object found." }
  # Level sensors (meters): off (not read), read (once, on connecting), poll
  # (read every level_poll_ms), or subscribe (follow their changes, which may
  # be many per second).
  level_sensors: { type: enum, values: ["off", read, poll, subscribe], default: poll,
                   label: Level sensors,
                   description: "How meters are read: off, read once on connecting, poll every level poll interval, or subscribe to their changes (may be many per second)." }
  level_poll_ms: { type: int, min: 50, max: 600000, default: 1000,
                   label: Level poll interval,
                   description: "Milliseconds between level sensor reads when level sensors are polled." }
  # Requests waiting for a response at once; more are queued.
  max_in_flight: { type: int, min: 1, max: 1024, default: 32,
                   label: Requests in flight,
                   description: "Requests waiting for a response at once; more are queued." }


ports:
  - { port: 30013, protocol: tcp, role: control, when: "model d80, d20, 30d, 10d", note: "OCP.1 as d&b's integrations use it on these models; older firmware may use another, given when opening" }
  - { port: 50014, protocol: tcp, role: control, when: "model d90, d40, d25, 40d, 25d, 5d, 5dm" }
  - { port: null, protocol: tcp, role: control, when: "model ds10, ds100", note: "d&b documents no OCP.1 port for these: give it when opening" }
  - { port: null, protocol: udp, role: control, when: "transport udp", note: "OCP.1 over UDP, if the device speaks it: the port given when opening" }
  - { port: null, protocol: ws, role: control, when: "transport ws", note: "OCP.1 over a WebSocket, if the device speaks it: the port given when opening" }
  - { port: null, protocol: wss, role: control, when: "transport wss", note: "OCP.1 over a WebSocket over TLS, if the device speaks it: the port given when opening" }

