        "license.valid": { value: "{valid}", map: { "true": true, "false": false, "1": true, "0": false } }
        "license.time_limit": "{limit}"
        "license.time_zone": "{tz}"
        "license.start.year": "{start_year}"
        "license.start.month": "{start_month}"
        "license.start.day": "{start_day}"
        "license.start.hour": "{start_hour}"
        "license.start.minute": "{start_minute}"
        "license.start.second": "{start_second}"
        "license.stop.year": "{stop_year}"
        "license.stop.month": "{stop_month}"
