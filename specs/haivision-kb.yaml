spec: 1
id: haivision-kb
name: Haivision KB Encoder/Transcoder
vendor: Haivision
category: other

# The KB REST API of the Encoder Communication Server (ECS): JSON over HTTPS
# on port 1080 under /ecs, each resource named with a .json suffix. A login
# answers with a session id that every later request carries in its
# Authorization header. A channel is one encoding process: its input, video
# and audio encoders and outputs come from a channel configuration (preset).
# Nothing is pushed: state is polled, with each channel's state read in
# turn, and every write reads back what it changed.

source:
  - title: "KB Encoder/Transcoder 5.9 API Integrator's Reference (HVS-ID-API-KB-5.9, 2024-01-31)"
    author: Haivision
    url: "https://doc.haivision.com/__attachments/a_337876342e2d4f8769019b883dcf4efbf4b73be21aa9a24f9f9ec913b5e6af21/KB5.9%20API%20Integrator's%20Reference.pdf"
    note: >
      Manufacturer-documented and public: linked from the KB 5.9 document
      page, https://doc.haivision.com/KB/5.9/ (retrieved 2026-10-27). The
      source of every command and state rule here. Resource URIs, port 1080,
      HTTPS only with a self-signed certificate by default, the session and
      its Authorization header, standard messages (Introducing the KB REST
      API); Login, Logout; Get License Parameter, Reset License, Get License
      State; Get Version, Get System Information, Get System Time, Get ECS
      State; Get Channel List, Create Channel, Get Channel State, Delete
      Channel, Controlling a Channel, Input Control, Output Control, Get
      Channel Signal List, Get Video Preview, Inject Metadata, Inject AdCue
      Messages; Get Channel Configurations, Review, Load and Get
      Configuration Label; Error Response Messages; Signals Reference;
      Channel Configuration File Syntax Reference.
  - title: "companion-module-haivision-kbencoder (Bitfocus Companion module)"
    author: Bitfocus
    url: "https://github.com/bitfocus/companion-module-haivision-kbencoder"
    note: >
      Community source (MIT license), read as corroboration only: it logs in
      before any other request and follows channel state, input and output
      status and recording.

settings:
  username:
    type: string
    default: ""
    max_length: 64
    label: User name
    description: "A KB web interface user (Administrator, Operator or Observer); empty sends no login, for software before 4.3.1, which needs none."
  password:
    type: string
    secret: true
    default: ""
    max_length: 128
    label: Password
    description: "That user's password."

ports:
  - { port: 1080, protocol: https, role: control, note: "the ECS REST API; the port given when opening wins" }

transport:
  type: http
  port: 1080
  scheme: https
  # A self-signed certificate unless one is configured in the KB UI.
  accept_invalid_certs: true
  timeout_ms: 10000
  # Any answer means the ECS is there (without a session it refuses).
  probe: { method: GET, path: /ecs/version.json }
  # Login (4.3.1+): the session id comes back as {"sessionid": "..."} and
  # goes back as the Authorization header; a refused login is 403.
  session:
    when_set: username
    login: { method: POST, path: /ecs/auth.json, content_type: application/json,
             body: '{"username":{settings.username:json},"password":{settings.password:json}}' }
    capture: { json: "$.sessionid", header: Authorization }
    relogin: { status: [401, 403] }
    refused: { status: [401, 403] }

maps:
  start_param: { "true": startrecord, "false": "" }

models:
  - id: kb-encoder
    name: Haivision KB Encoder/Transcoder
    supports:
      [get_version, get_system, get_time, get_ecs_state, get_license, get_license_state, reset_license,
       list_channels, create_channel, get_channel, save_channel_preview, delete_channel, start_channel, prepare_stop_channel,
       stop_channel, start_recording, stop_recording, set_audio_gain, increase_audio_gain,
       decrease_audio_gain, enable_output, disable_output, get_signals_after, get_signals_since,
       get_signals_recent, inject_metadata, inject_scte35, inject_splice_out, list_channel_configs,
       get_channel_configuration, load_channel_configuration, get_configuration_label]
    verification: none
    notes: >
      KB software 5.9 as documented, on Haivision's KB Max, Mini and Server
      appliances or installed on a server (software-only). Requests marked
      with a version in their summary need that version or later (Get ECS
      State 4.5, input control and ad cues 5.0, channel configurations 5.4;
      the license state only 4.0 to 4.3.1).

commands:
  # ── Encoder ────────────────────────────────────────────────────────────
  get_version:
    summary: "The KB software version (GET /ecs/version.json)"
    send: { method: GET, path: /ecs/version.json }
    expect: &read { status: 200, json_path: "$" }
    returns: value

  get_system:
    summary: "CPUs, memory, GPU encoders, capture cards with their video modes, network adapters and uptime (GET /ecs/system.json)"
    send: { method: GET, path: /ecs/system.json }
    expect: *read
    returns: value

  get_time:
    summary: "The encoder's local and UTC time (GET /ecs/time.json)"
    send: { method: GET, path: /ecs/time.json }
    expect: *read
    returns: value

  get_ecs_state:
    summary: "Load, disk, network, temperature, license, time and the channels, in one read (GET /ecs.json, 4.5 and later)"
    send: { method: GET, path: /ecs.json }
    expect: *read
    returns: value

  get_license:
    summary: "The license: channels, validity, demo mode, watermark and its period (GET /ecs/license.json)"
    send: { method: GET, path: /ecs/license.json }
    expect: *read
    returns: value

  get_license_state:
    summary: "License type, MAC address and channels registered (GET /ecs/license/state.json, 4.0 to 4.3.1)"
    send: { method: GET, path: /ecs/license/state.json }
    expect: *read
    returns: value

  reset_license:
    summary: "Remove the license and its data (DELETE /ecs/license.json)"
    send:
      - { method: DELETE, path: /ecs/license.json }
      - { method: GET, path: /ecs/license.json }
    expect: &ok { status: [200, 201, 204] }
    returns: ack

  # ── Channels ───────────────────────────────────────────────────────────
  list_channels:
    summary: "Channels running, or created through the API (GET /ecs/channels.json); list_channel_configs has every channel of the web interface"
    send: { method: GET, path: /ecs/channels.json }
    expect: *read
    returns: value

  create_channel:
    summary: "Create a channel (POST /ecs/channels.json); load_channel_configuration then gives it a configuration"
    params:
      label: { type: string, required: true, max_length: 128, label: Label, description: "The channel's unique label, such as Channel_1." }
      id: { type: string, default: "", max_length: 64, pattern: "^[A-Za-z0-9{}-]*$", label: Id, description: "The channel's id, usually a GUID; empty lets the encoder choose one." }
      preview_only: { type: bool, default: false, label: Preview only, description: "A channel with an input alone, for preview, which takes no licensed channel." }
    send:
      - { method: POST, path: /ecs/channels.json, content_type: application/json,
          body: '{"channel":{"label":{label:json},"id":{id:json},"previewonly":"{preview_only:bool01}"}}' }
      - { method: GET, path: /ecs/channels.json }
    expect: *ok
    returns: ack

  get_channel:
    summary: "A channel's state: load, its encoders, inputs and outputs (GET /ecs/channels/{channel}.json)"
    params:
      channel: &channel { type: string, required: true, max_length: 128, label: Channel, description: "The channel's id, as the channel lists give it (the API document names this part of the path the channel's label)." }
    send: { method: GET, path: "/ecs/channels/{channel}.json" }
    expect: *read
    returns: value

  save_channel_preview:
    summary: "Save a channel's video preview, a JPEG, to a host file (GET /ecs/channels/{channel}/preview.jpg); returns the file saved and its size"
    params:
      channel: *channel
      to: { type: save, required: true, label: Save to, description: "The host file the preview is written to; replaced once the whole image has arrived." }
    send: { method: GET, path: "/ecs/channels/{channel}/preview.jpg", save: to }
    expect: { status: 200 }
    returns: file

  delete_channel:
    summary: "Close and delete a channel (DELETE /ecs/channels/{channel}.json)"
    params:
      channel: *channel
    send:
      - { method: DELETE, path: "/ecs/channels/{channel}.json" }
      - { method: GET, path: /ecs/channels.json }
    expect: *ok
    returns: ack

  start_channel:
    summary: "Start a channel (PUT /ecs/channels/{channel}.json invoke StartChannel), with every file output recording from the start when asked"
    params:
      channel: *channel
      record: { type: bool, default: false, label: Record, description: "Whether every file output records from the start (startrecord)." }
    send:
      - { method: PUT, path: "/ecs/channels/{channel}.json", content_type: application/json,
          body: '{"invoke":{"command":"StartChannel","param":"{record:map.start_param}"}}' }
      - { method: GET, path: "/ecs/channels/{channel}.json" }
    expect: *ok
    returns: ack

  prepare_stop_channel:
    summary: "Stop taking input, deliver what is buffered and close the recordings, ahead of stop_channel (PUT invoke PrepareStop)"
    params:
      channel: *channel
    send:
      - { method: PUT, path: "/ecs/channels/{channel}.json", content_type: application/json,
          body: '{"invoke":{"command":"PrepareStop","param":""}}' }
      - { method: GET, path: "/ecs/channels/{channel}.json" }
    expect: *ok
    returns: ack

  stop_channel:
    summary: "Stop a channel (PUT invoke StopChannel); prepare_stop_channel first stops it cleanly"
    params:
      channel: *channel
    send:
      - { method: PUT, path: "/ecs/channels/{channel}.json", content_type: application/json,
          body: '{"invoke":{"command":"StopChannel","param":""}}' }
      - { method: GET, path: "/ecs/channels/{channel}.json" }
    expect: *ok
    returns: ack

  start_recording:
    summary: "Start recording on every file output of a running channel (PUT invoke StartRecord)"
    params:
      channel: *channel
    send:
      - { method: PUT, path: "/ecs/channels/{channel}.json", content_type: application/json,
          body: '{"invoke":{"command":"StartRecord","param":""}}' }
      - { method: GET, path: "/ecs/channels/{channel}.json" }
    expect: *ok
    returns: ack

  stop_recording:
    summary: "Stop recording on every file output of a running channel (PUT invoke StopRecord)"
    params:
      channel: *channel
    send:
      - { method: PUT, path: "/ecs/channels/{channel}.json", content_type: application/json,
          body: '{"invoke":{"command":"StopRecord","param":""}}' }
      - { method: GET, path: "/ecs/channels/{channel}.json" }
    expect: *ok
    returns: ack

  set_audio_gain:
    summary: "Set an input's audio gain (PUT /ecs/channels/{channel}/inputs/{input}.json invoke setaudiogain, 5.0 and later)"
    params:
      channel: *channel
      input: &input { type: string, required: true, max_length: 128, label: Input, description: "The input's id, such as Device_DeckLink_Baseband_2, as the channel state gives it." }
      gain: { type: float, min: -20.0, max: 40.0, required: true, label: Gain, description: "Audio gain in dB." }
    send:
      - { method: PUT, path: "/ecs/channels/{channel}/inputs/{input}.json", content_type: application/json,
          body: '{"invoke":{"command":"setaudiogain","param":"{gain:.1f}"}}' }
      - { method: GET, path: "/ecs/channels/{channel}.json" }
    expect: *ok
    returns: ack

  increase_audio_gain:
    summary: "Raise an input's audio gain by 5 dB (PUT invoke audiogaininc)"
    params:
      channel: *channel
      input: *input
    send:
      - { method: PUT, path: "/ecs/channels/{channel}/inputs/{input}.json", content_type: application/json,
          body: '{"invoke":{"command":"audiogaininc","param":""}}' }
      - { method: GET, path: "/ecs/channels/{channel}.json" }
    expect: *ok
    returns: ack

  decrease_audio_gain:
    summary: "Lower an input's audio gain by 5 dB (PUT invoke audiogaindec)"
    params:
      channel: *channel
      input: *input
    send:
      - { method: PUT, path: "/ecs/channels/{channel}/inputs/{input}.json", content_type: application/json,
          body: '{"invoke":{"command":"audiogaindec","param":""}}' }
      - { method: GET, path: "/ecs/channels/{channel}.json" }
    expect: *ok
    returns: ack

  enable_output:
    summary: "Turn on a channel's output (PUT /ecs/channels/{channel}/outputs/{output}.json invoke EnableOutput)"
    params:
      channel: *channel
      output: &output { type: string, required: true, max_length: 128, label: Output, description: "The output's id, such as HLS_Sink_12, as the channel state gives it." }
    send:
      - { method: PUT, path: "/ecs/channels/{channel}/outputs/{output}.json", content_type: application/json,
          body: '{"invoke":{"command":"EnableOutput","param":""}}' }
      - { method: GET, path: "/ecs/channels/{channel}.json" }
    expect: *ok
    returns: ack

  disable_output:
    summary: "Turn off a channel's output (PUT invoke DisableOutput)"
    params:
      channel: *channel
      output: *output
    send:
      - { method: PUT, path: "/ecs/channels/{channel}/outputs/{output}.json", content_type: application/json,
          body: '{"invoke":{"command":"DisableOutput","param":""}}' }
      - { method: GET, path: "/ecs/channels/{channel}.json" }
    expect: *ok
    returns: ack

  get_signals_after:
    summary: "A channel's signals (events) after an index, -1 for every one kept (GET /ecs/channels/{channel}/signals.json?index=...)"
    params:
      channel: *channel
      index: { type: int, min: -1, required: true, label: After index, description: "The index of the last signal already read, or -1 for the first request." }
    send: { method: GET, path: "/ecs/channels/{channel}/signals.json", query: { index: "{index}" } }
    expect: *read
    returns: value

  get_signals_since:
    summary: "A channel's signals since a time of day (GET /ecs/channels/{channel}/signals.json?time=HH:MM:SS:mmm)"
    params:
      channel: *channel
      time: { type: string, required: true, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{3}$", label: Since, description: "Time of day as HH:MM:SS:mmm, 24-hour, with milliseconds." }
    send: { method: GET, path: "/ecs/channels/{channel}/signals.json", query: { time: "{time}" } }
    expect: *read
    returns: value

  get_signals_recent:
    summary: "A channel's signals of the last seconds (GET /ecs/channels/{channel}/signals.json?timespan=...)"
    params:
      channel: *channel
      seconds: { type: int, min: 1, required: true, label: Seconds, description: "How many seconds back." }
    send: { method: GET, path: "/ecs/channels/{channel}/signals.json", query: { timespan: "{seconds}" } }
    expect: *read
    returns: value

  inject_metadata:
    summary: "Send metadata into an RTMP output stream (PUT /ecs/channels/{channel}/outputs/{output}/streams/{stream}.json) with the API's data list of {label, type (int, double, bool or string), value}"
    params:
      channel: *channel
      output: *output
      stream: { type: string, required: true, max_length: 128, label: Stream, description: "The stream component's id within the output, as the channel state gives it." }
      data: { type: json, required: true, label: Metadata, description: "JSON array of {label, type, value}, type int, double, bool or string and value its text, such as [{\"label\":\"score\",\"type\":\"int\",\"value\":\"3\"}]." }
    send: { method: PUT, path: "/ecs/channels/{channel}/outputs/{output}/streams/{stream}.json", content_type: application/json,
            body: '{"data":{data}}' }
    expect: *ok
    returns: ack

  inject_scte35:
    summary: "Insert a SCTE-35 ad cue at an input (PUT /ecs/channels/{channel}/inputs/{input}/adcue.json type scte35, 5.0 and later); an empty cue makes a splice insert of the duration"
    params:
      channel: *channel
      input: *input
      cue: { type: string, multiline: true, default: "", label: SCTE-35 message, description: "The SCTE-35 message in its XML form (SpliceInfoSection), or empty for a splice insert with out-of-network and auto-return set." }
      duration: &cue_duration { type: float, min: 0.0, required: true, label: Duration, description: "Length of the break in seconds; 0 when unknown (an empty cue needs more than 0)." }
      offset: &cue_offset { type: float, min: 0.0, default: 0.0, label: Offset, description: "Seconds from the current stream time to the cue." }
      repeat: &cue_repeat { type: bool, default: false, label: Repeat, description: "Whether this message repeats the previous one." }
    send: { method: PUT, path: "/ecs/channels/{channel}/inputs/{input}/adcue.json", content_type: application/json,
            body: '{"adcue":{"type":"scte35","cue":{cue:json},"duration":"{duration:.3f}","offset":"{offset:.3f}","repeat":"{repeat}"}}' }
    expect: *ok
    returns: ack

  inject_splice_out:
    summary: "Insert a simple ad break of a duration at an input (PUT .../adcue.json type SpliceOut, 5.0 and later)"
    params:
      channel: *channel
      input: *input
      duration: { type: float, min: 0.0, required: true, label: Duration, description: "Length of the break in seconds." }
      offset: *cue_offset
      repeat: *cue_repeat
    send: { method: PUT, path: "/ecs/channels/{channel}/inputs/{input}/adcue.json", content_type: application/json,
            body: '{"adcue":{"type":"SpliceOut","duration":"{duration:.3f}","offset":"{offset:.3f}","repeat":"{repeat}"}}' }
    expect: *ok
    returns: ack

  # ── Channel configurations ─────────────────────────────────────────────
  list_channel_configs:
    summary: "Every channel configuration of the web interface, running or idle, with its state, recording and load (GET /ecs/channelconfigs.json, 5.4 and later)"
    send: { method: GET, path: /ecs/channelconfigs.json }
    expect: *read
    returns: value

  get_channel_configuration:
    summary: "A channel's configuration in the channel configuration file syntax (GET /ecs/channels/{channel}/preset.json)"
    params:
      channel: *channel
    send: { method: GET, path: "/ecs/channels/{channel}/preset.json" }
    expect: *read
    returns: value

  load_channel_configuration:
    summary: "Give a channel a configuration (PUT /ecs/channels/{channel}/preset.json) in the channel configuration file syntax: version, type, label, description and kulabytepreset with input, preview, video_encoder, audio_encoder and output; license limits are answered as warnings"
    params:
      channel: *channel
      configuration: { type: json, required: true, label: Configuration, description: "JSON channel configuration in the shape get_channel_configuration returns, as the API document's syntax reference gives it." }
    send:
      - { method: PUT, path: "/ecs/channels/{channel}/preset.json", content_type: application/json, body: "{configuration}" }
      - { method: GET, path: "/ecs/channels/{channel}/preset.json" }
    expect: *ok
    returns: ack

  get_configuration_label:
    summary: "The label of a channel's configuration (GET /ecs/channels/{channel}/preset/label.json)"
    params:
      channel: *channel
    send: { method: GET, path: "/ecs/channels/{channel}/preset/label.json" }
    expect: { status: 200, json_path: "$.preset" }
    returns: value

quirks:
  - models: [all]
    severity: warning
    text: >
      The login (4.3.1 and later) answers {"sessionid": ...}, and the id goes
      back as the Authorization header as it is. A session ends 30 minutes
      after the last request (the polls keep it in use) or at a logout. The
      document gives 403 for a refused login and no status for a request on
      an ended session; 401 or 403 is taken as the session's end, and the
      core signs in again once. With the user name empty nothing signs in,
      for software before 4.3.1. The logout is not offered: the session is
      the core's own.
  - models: [all]
    severity: info
    text: >
      The document names the channel part of a channel's paths as the
      channel's label, while its examples and channel lists use the
      channel's id; the id from the lists is what the commands and state
      use.
  - models: [all]
    severity: info
    text: >
      Channels created through the API or running are listed by the ECS
      (channels); every channel of the web interface, running or idle, with
      its configuration, by list_channel_configs (configs). Each listed
      channel's state is read after each list (channel_state). A channel
      deleted elsewhere keeps its last channel_state until the core is
      opened again; delete_channel removes it at once.
  - models: [all]
    severity: info
    text: >
      Writes answer the standard messages list; a refused one answers HTTP
      500 with an error message (KULA_ERROR_..., such as
      KULA_ERROR_ALREADY_EXISTS or KULA_ERROR_LICENSE_NO_FREE_CHANNEL for
      create_channel, KULA_ERROR_WRONG_STATE for recording on a stopped
      channel). License limits found while loading a configuration come as
      warnings in a successful answer.
  - models: [all]
    severity: critical
    text: >
      reset_license removes the license, after which channels cannot run
      until a license is installed again; stop_channel and delete_channel
      end the channel's output at once; load_channel_configuration replaces
      a channel's whole configuration.
  - models: [all]
    severity: info
    text: >
      The video preview (GET /ecs/channels/{channel}/preview.jpg), a JPEG
      image, is saved to a host file by save_channel_preview. Values come as text; numbers and on/off flags given
      as text are converted where state declares them so.
  - models: [all]
    severity: info
    text: >
      Signals are read with get_signals_after (an index, -1 for all),
      get_signals_since (a time of day) or get_signals_recent (seconds back),
      the option as a plain query parameter; the document writes the value
      in quotes in its syntax line and spells the option timespan in its
      table (timepsan once). The last list read is kept whole as JSON text.
  - models: [all]
    severity: info
    text: >
      Ad cue durations and offsets go as text with three decimals, and
      repeat as true or false (the document's text; its example shows no).

state:
  # Encoder (GET /ecs.json, the ECS state)
  encoder.cpu: { type: float, unit: "%", description: "CPU use of the ECS" }
  encoder.memory: { type: float, description: "Memory use of the ECS" }
  encoder.disk_free_gb: { type: float, unit: "GB", description: "Free disk space" }
  encoder.system_memory_used: { type: float, unit: "MB", description: "System memory used" }
  encoder.system_memory_percent: { type: float, unit: "%", description: "System memory used" }
  encoder.system_memory_total: { type: float, unit: "MB", description: "System memory" }
  encoder.disk_total_gb: { type: float, unit: "GB", description: "Disk space" }
  encoder.disk_used_percent: { type: float, unit: "%", description: "Disk space used" }
  encoder.app: { type: string, description: "Application name, such as kulabyte" }
  encoder.label: { type: string, description: "The encoder's host label" }
  encoder.version.major: { type: string, description: "Software major version" }
  encoder.version.minor: { type: string, description: "Software minor version" }
  encoder.version.subminor: { type: string, description: "Software subminor version" }
  encoder.version.build: { type: string, description: "Software build" }
  encoder.version.type: { type: string, description: "Build type, such as DEV" }
  encoder.network.in: { type: float, unit: "Mbit/s", description: "Network traffic in" }
  encoder.network.out: { type: float, unit: "Mbit/s", description: "Network traffic out" }
  encoder.network.total: { type: float, unit: "Mbit/s", description: "Network traffic in and out" }
  encoder.temperature: { type: float, unit: "\u00b0C", description: "Temperature" }
  encoder.uptime_hours: { type: int, unit: "h", description: "Time the ECS has run" }
  encoder.gpu.h264: { type: bool, description: "Hardware H.264 encoding available" }
  encoder.gpu.hevc: { type: bool, description: "Hardware HEVC encoding available" }
  encoder.gpu.blitter: { type: float, unit: "%", description: "GPU blitter use" }
  encoder.gpu.renderer: { type: float, unit: "%", description: "GPU renderer use" }
  encoder.gpu.video: { type: float, unit: "%", description: "GPU video engine use" }
  encoder.gpu.video_enhancement: { type: float, unit: "%", description: "GPU video enhancement use" }
  encoder.gpu.metrics_valid: { type: bool, description: "Whether the GPU figures are measured" }
  encoder.gpu.hevc_use: { type: float, unit: "%", description: "GPU HEVC encoder use" }
  # License
  license.channels: { type: int, description: "Channels the license allows" }
  license.expired: { type: bool, description: "The license has expired" }
  license.valid: { type: bool, description: "The license is valid" }
  license.time_limit: { type: int, description: "Time limit, 0 for none" }
  license.time_zone: { type: string, description: "Time zone of the start and stop times" }
  license.start.year: { type: int, description: "License start time: year" }
  license.start.month: { type: int, description: "License start time: month" }
  license.start.day: { type: int, description: "License start time: day" }
  license.start.hour: { type: int, description: "License start time: hour" }
  license.start.minute: { type: int, description: "License start time: minute" }
  license.start.second: { type: int, description: "License start time: second" }
  license.stop.year: { type: int, description: "License stop time: year" }
