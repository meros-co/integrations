telemetry:
  # Nothing is pushed: the ECS state every 2 s, each channel it lists read
  # after it, the web interface's channels every 5 s, the rest each minute.
  poll:
    - every_ms: 2000
      send: [{ method: GET, path: /ecs.json }]
    - every_ms: 5000
      send: [{ method: GET, path: /ecs/channelconfigs.json }]
    - every_ms: 60000
      send:
        - { method: GET, path: /ecs/system.json }
        - { method: GET, path: /ecs/license.json }
        - { method: GET, path: /ecs/version.json }
  updates:
    - path: '^/ecs\.json$'
      json:
        cpu: "$.encoder.CurrentCpuUsage"
        mem: "$.encoder.CurrentMemUsage"
        free: "$.encoder.FreeDiskSpaceGB"
        sysmem: "$.encoder.SystemMemUsage"
        sysmemp: "$.encoder.SystemMemUsagePercent"
        systot: "$.encoder.SystemTotalMemory"
        disk: "$.encoder.TotalDiskSpaceGB"
        diskp: "$.encoder.UsedDiskSpacePercent"
        app: "$.encoder.app"
        label: "$.encoder.label"
        major: "$.encoder.major"
        minor: "$.encoder.minor"
        subminor: "$.encoder.subminor"
        build: "$.encoder.build"
        type: "$.encoder.type"
        net_in: "$.encoder.network.in"
        net_out: "$.encoder.network.out"
        net_total: "$.encoder.network.total"
        temp: "$.encoder.temperature"
        uptime: "$.encoder.uptime.hours"
        h264: "$.encoder.gpu.hwencoder.h264"
        hevc: "$.encoder.gpu.hwencoder.hevc"
        blit: "$.encoder.gpu.metrics.blitter"
        rend: "$.encoder.gpu.metrics.renderer"
        gvid: "$.encoder.gpu.metrics.video"
        genh: "$.encoder.gpu.metrics.videoenhancement"
        gvalid: "$.encoder.gpu.metrics.valid"
        ghevc: "$.encoder.gpu.usage.hevc"
      state:
        "encoder.cpu": "{cpu}"
        "encoder.memory": "{mem}"
        "encoder.disk_free_gb": "{free}"
        "encoder.system_memory_used": "{sysmem}"
        "encoder.system_memory_percent": "{sysmemp}"
        "encoder.system_memory_total": "{systot}"
        "encoder.disk_total_gb": "{disk}"
        "encoder.disk_used_percent": "{diskp}"
        "encoder.app": "{app}"
        "encoder.label": "{label}"
        "encoder.version.major": "{major}"
        "encoder.version.minor": "{minor}"
        "encoder.version.subminor": "{subminor}"
        "encoder.version.build": "{build}"
        "encoder.version.type": "{type}"
        "encoder.network.in": "{net_in}"
        "encoder.network.out": "{net_out}"
        "encoder.network.total": "{net_total}"
        "encoder.temperature": "{temp}"
        "encoder.uptime_hours": "{uptime}"
        "encoder.gpu.h264": { value: "{h264}", map: { "true": true, "false": false, "1": true, "0": false } }
        "encoder.gpu.hevc": { value: "{hevc}", map: { "true": true, "false": false, "1": true, "0": false } }
        "encoder.gpu.blitter": "{blit}"
        "encoder.gpu.renderer": "{rend}"
        "encoder.gpu.video": "{gvid}"
        "encoder.gpu.video_enhancement": "{genh}"
        "encoder.gpu.metrics_valid": { value: "{gvalid}", map: { "true": true, "false": false, "1": true, "0": false } }
        "encoder.gpu.hevc_use": "{ghevc}"
    - path: '^/ecs\.json$'
      json:
        channels: "$.encoder.license.channels"
        expired: "$.encoder.license.expired"
        valid: "$.encoder.license.valid"
        limit: "$.encoder.license.time_limit"
        tz: "$.encoder.license.time_zone"
        start_year: "$.encoder.license.start_year"
        start_month: "$.encoder.license.start_month"
        start_day: "$.encoder.license.start_day"
        start_hour: "$.encoder.license.start_hour"
        start_minute: "$.encoder.license.start_minute"
        start_second: "$.encoder.license.start_second"
        stop_year: "$.encoder.license.stop_year"
        stop_month: "$.encoder.license.stop_month"
        stop_day: "$.encoder.license.stop_day"
        stop_hour: "$.encoder.license.stop_hour"
        stop_minute: "$.encoder.license.stop_minute"
        stop_second: "$.encoder.license.stop_second"
        mac: "$.encoder.license.mac"
        reg: "$.encoder.license.registered_channels"
        ltype: "$.encoder.license.type"
      state:
        "license.channels": "{channels}"
        "license.expired": { value: "{expired}", map: { "true": true, "false": false, "1": true, "0": false } }
        "license.valid": { value: "{valid}", map: { "true": true, "false": false, "1": true, "0": false } }
        "license.time_limit": "{limit}"
        "license.time_zone": "{tz}"
        "license.start.year": "{start_year}"
        "license.start.month": "{start_month}"
        "license.start.day": "{start_day}"
        "license.start.hour": "{start_hour}"
        "license.start.minute": "{start_minute}"
        "license.start.second": "{start_second}"
        "license.stop.year": "{stop_year}"
        "license.stop.month": "{stop_month}"
        "license.stop.day": "{stop_day}"
        "license.stop.hour": "{stop_hour}"
