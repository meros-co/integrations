quirks:
  - models: [all]
    severity: info
    text: >
      Opened with no host: the core listens on UDP 6454 (another program can listen there too) and finds nodes by
      polling the poll addresses every 3 s; each answering node appears under nodes.<ip>/<bind index>. Give a
      node's address as host to poll it directly and to unicast every universe to it as well. Connected means
      listening; a port that cannot be bound is reported disconnected and retried after 1 s, doubling to 30 s.
  - models: [all]
    severity: warning
    text: >
      The default poll addresses are Art-Net's own 2.x.x.x and 10.x.x.x networks. On another network (such as
      192.168.1.0/24) set poll_addresses to its directed broadcast address (192.168.1.255), or no node is found.
      A broadcast address of no network of this host may not be sendable; that send is logged and the others go.
  - models: [all]
    severity: warning
    text: >
      Art-Net 4 sends ArtDmx only by unicast, to the nodes whose last ArtPollReply lists the universe in SwIn or
      SwOut, and to the host: a universe nobody subscribes to is held and not sent (the command returns
      {held: true, destinations: 0}) until a node subscribes. A node that misses a poll stops receiving until it
      answers again. Legacy nodes that only take broadcast ArtDmx are not served.
  - models: [all]
    severity: info
    text: >
      Output is the full 512 channels of each held universe, sent at once on a change (at most once every 23 ms,
      44 Hz, later changes in that time going together) and again every refresh_ms. Universes are Port-Addresses
      0-32767 (Net, Sub-Net, Universe), not the 1-based numbers some consoles display. Commands that send DMX,
      ArtSync, triggers, commands and timecode return unverified: Art-Net does not acknowledge them.
  - models: [all]
    severity: info
    text: >
      Node configuration (set_node_*, node_command, reset_node_port_addresses) completes when the node answers
      with its ArtPollReply, within 3 s, or fails with a timeout; the reply updates the node's state, so it reads
      the change back. Net and Sub-Net belong to the node (per bind index): changing one port's universe moves the
      node's other ports into the same Net and Sub-Net. Fields not being changed are sent as 0x7F (bit 7 clear),
      which nodes ignore; 0 resets a field to the physical switch, as reset_node_port_addresses does.
  - models: [all]
    severity: critical
    text: >
      set_node_ip, set_node_dhcp and reset_node_ip change a node's network address at once: the node may become
      unreachable from the core and from every controller that used the old address. fail_record and
      fail_hold/zero/full/scene change what a node outputs when Art-Net stops, kept across power cycles.
      direction_input and direction_output change what a port does, and setting a port to input flushes its
      subscribers.
  - models: [all]
    severity: info
    text: >
      The core answers every ArtPoll, its own included, with an ArtPollReply of a controller (Style
      StController) with no ports, from short_name, long_name, esta_code and oem_code; its IP field is
      bind_address, or 0.0.0.0 when that is empty, since the core does not read its own address. The default OEM
      code is 255 (0x00FF); Art-Net asks each manufacturer to register one. Its own packets heard back (a
      broadcast loops to the sender) are ignored.
  - models: [all]
    severity: info
    text: >
      Received ArtDmx is kept only for the universes in receive, the latest packet's data whichever device sent
      it (no merging), at most every receive_interval_ms, and not when opened for commands only. ArtNzs, ArtSync,
      ArtTrigger, ArtCommand, ArtDiagData, ArtTimeCode and ArtRdm are reported as message events (address the
      packet name, args its fields), as they arrive. Opening for commands only still polls, since sending DMX
      needs the subscribers polling finds and Art-Net requires controllers to poll.
  - models: [all]
    severity: info
    text: >
      RDM goes through as the gateways relay it: request_rdm_tod and rdm_tod_control manage the gateway's table
      of devices, and send_rdm carries a message the caller encodes per the RDM standard (ANSI E1.20), returning
      the gateway's ArtRdm answer as hex; the core does not decode RDM parameters. Firmware upload
      (ArtFirmwareMaster), the deprecated ArtMedia, ArtVideo and ArtMac packets and ArtVlc are not used.
  - models: [all]
    severity: info
    text: >
      Read where the specification leaves room: packets to a node go to the port its ArtPollReply gives (always
      6454 per the specification); a node's subscriptions are the universes of SwIn and SwOut of its first
      NumPorts ports, whichever way each port points; ArtPoll is unicast to the host without targeted mode;
      ArtCommand's ESTA code is sent high byte first, as its field names give it (the field descriptions are
      ambiguous); and ArtAddress fields not being changed are 0x7F, the specification saying only that values
      without bit 7 are ignored and that 0 resets.
