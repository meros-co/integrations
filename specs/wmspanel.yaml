rigin_apps, create_origin_apps, update_origin_apps, delete_origin_apps, get_publish_control_handler, update_publish_control_handler, list_publish_control_applications, get_publish_control_applications, create_publish_control_applications, update_publish_control_applications, delete_publish_control_applications, list_transcoder, list_transcoder_for_server, get_transcoder, update_transcoder, delete_transcoder, pause_transcoder, resume_transcoder, clone_transcoder, get_transcoder_pipeline_video, delete_transcoder_pipeline_video, get_transcoder_pipeline_video_input, update_transcoder_pipeline_video_input, get_transcoder_pipeline_video_output, update_transcoder_pipeline_video_output, get_transcoder_pipeline_video_filter, update_transcoder_pipeline_video_filter, get_transcoder_pipeline_audio, delete_transcoder_pipeline_audio, get_transcoder_pipeline_audio_input, update_transcoder_pipeline_audio_input, get_transcoder_pipeline_audio_output, update_transcoder_pipeline_audio_output, get_transcoder_pipeline_audio_filter, update_transcoder_pipeline_audio_filter, list_hotswap, get_hotswap, create_hotswap, update_hotswap, delete_hotswap, list_asr_settings, get_asr_settings, create_asr_settings, update_asr_settings, delete_asr_settings, get_asr_integration, update_asr_integration, list_users, create_user, list_data_slices, list_data_slices_with_servers, get_realtime_data, get_realtime_data_server, get_realtime_data_stream, get_realtime_data_stream_server, get_realtime_data_streams, get_realtime_data_slices, get_retro_data, get_retro_data_server, get_retro_data_stream, get_daily_stats, get_daily_stats_server, get_duration_stats, get_duration_stats_server, get_players_stats, get_players_stats_server, get_devices_stats, get_devices_stats_server, get_geo_stats, get_isp_stats, get_asn_stats, get_asn_stats_server, get_high_precision_data, list_active_streams, list_active_streams_realtime, list_active_streams_all, get_deep_stats, get_deep_daily, get_deep_duration, get_deep_players, get_d