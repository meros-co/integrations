spec: 1
id: wmspanel
name: WMSPanel (Nimble Streamer control and statistics API)
vendor: Softvelum
category: other

# Softvelum's WMSPanel, the cloud service that configures Nimble Streamer
# servers and reports their statistics: opened with host api.wmspanel.com on
# port 443, it acts for the account its client ID and API key belong to.
# Every call of the reference is a command; state follows one Nimble server
# (the server_id setting, which may be chosen after opening): its status, live streams, re-publishing, MPEG-TS
# streams, transcoder scenarios and server-side tasks.

source:
  - title: WMSPanel API reference (stats pull API, WMSAuth, Dispersa, push API settings, licenses and Nimble Streamer control API)
    author: Softvelum
    url: https://wmspanel.com/api
    note: >
      Manufacturer document, retrieved 2026-10-28. HTTPS calls to
      https://api.wmspanel.com/v1/... with client_id and api_key as query
      parameters (Control, API setup, Pull API: enable the API, copy the
      client ID, generate a key, and whitelist the calling host's address);
      wrong credentials answer 403. Each account may make 15,000 calls a
      day (reset at 00:00 UTC), more by subscription. Answers are JSON with
      status Ok. Calls: servers (GET list and one, PUT name, custom_ips and
      tags, DELETE when enabled by support); stats (streams with Deep
      stats, users, data slices, realtime_data with stream hashes,
      realtime_data_multi, retro_data, daily, duration, players and devices
      stats, geo, isp, asn, deep, deep_daily, deep_duration, deep_players,
      deep_devices, high_pre); IP ranges and their CIDRs, user-agent and
      referer groups, WMSAuth groups and rules, Dispersa streams, push API
      settings, Transcoder and Addenda licenses, VOD routes; and per Nimble
      server: live streams (status online or offline; delete offline ones),
      global live settings, live applications, RTMP, RTSP and Icecast
      interfaces and live pull settings (restart), RTMP, RTSP and HLS
      re-publish rules (restart; paused), Icecast metadata, MPEG-TS
      incoming streams (status pending, online, offline, paused; pause,
      resume, restart with apply_out) and outgoing streams (pending or
      synced; pause, resume, restart), UDP settings, ABR settings, DVR
      settings and recorded streams, server-side tasks (start, stop,
      restart; status starting, stopping, restarting, running, stopped,
      failed), aliases with their priority order, HTTP origin
      applications, publish control handler and applications, transcoder
      scenarios (pause, resume, clone; pipelines' inputs, outputs and
      filters), hot swap settings, and voice recognition (ASR) settings and
      integrations. Some bulk (multi) calls are enabled on request.

transport:
  type: http
  port: 443
  scheme: https
  auth: none
  timeout_ms: 15000
  # The followed server: one call that also checks the credentials. Before
  # a server is chosen, the account's servers.
  probe:
    - { method: GET, path: "/v1/server/{settings.server_id}", query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}" } }
    - { method: GET, path: /v1/server, query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}" } }

settings:
  client_id: { type: string, pattern: "^\\S+$", max_length: 256, required: true,
               label: Client ID,
               description: "The account's (or a user's) API client ID, from WMSPanel's API setup page." }
  api_key: { type: string, secret: true, pattern: "^\\S+$", max_length: 256, required: true,
             label: API key,
             description: "The API key generated with it; the calling host's address must be on the API whitelist." }
  server_id: { type: string, pattern: "^[0-9a-f]{24}$",
               select: { command: list_servers, items: $.servers, id: $.id, label: $.name,
                         clears: [live_streams, rtmp_republish, mpegts_incoming, mpegts_outgoing, transcoders, tasks] },
               label: Server,
               description: "The Nimble server whose state is followed, its 24-character ID from list_servers or its page's URL; may be left empty on opening and chosen later with update_settings." }

ports:
  - { port: 443, protocol: https, role: control, note: "the cloud API at api.wmspanel.com, opened by that host name" }

