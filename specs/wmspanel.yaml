    send: {"method": "GET", "path": "/v1/server", "query": {"client_id": "{settings.client_id}", "api_key": "{settings.api_key}"}}
    expect: { status: 200, json_path: "$" }
    returns: value

  get_server:
    summary: "One server (GET /v1/server/[server_id])"
