    send: {"method": "GET", "path": "/v1/deep_players", "query": {"client_id": "{settings.client_id}", "api_key": "{settings.api_key}", "from": "{from}", "to": "{to}", "data_slice": "{data_slice}", "stream": "{stream}"}}
    expect: { status: 200, json_path: "$" }
    returns: value

  get_deep_devices:
    summary: "One Deep stats stream's devices between two dates (GET /v1/deep_devices)"
    params:
      data_slice: {"type": "string", "pattern": "^[0-9a-f]{24}$", "max_length": 24, "required": true, "label": "Data slice", "description": "The data slice's ID, from list_data_slices."}
      from: {"type": "string", "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", "max_length": 10, "required": true, "label": "From", "description": "From date, YYYY-MM-DD."}
      to: {"type": "string", "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", "max_length": 10, "required": true, "label": "To", "description": "To date, YYYY-MM-DD."}
      stream: {"type": "int", "min": -2147483648, "max": 2147483647, "required": true, "label": "Stream", "description": "The stream's ID from deep_stats."}
    send: {"method": "GET", "path": "/v1/deep_devices", "query": {"client_id": "{settings.client_id}", "api_key": "{settings.api_key}", "from": "{from}", "to": "{to}", "data_slice": "{data_slice}", "stream": "{stream}"}}
    expect: { status: 200, json_path: "$" }
    returns: value

quirks:
  - models: [all]
    severity: warning
    text: >
      WMSPanel allows 15,000 calls a day per account (reset at 00:00 UTC),
      polls included. The followed server and its live streams are read
      every minute (2 calls), its re-publish rules, MPEG-TS streams,
      transcoder scenarios and tasks, and the account's servers, every 5
      minutes (6 calls): about 4,600 calls a day, leaving the rest for
      commands. With server_id left empty only the servers are read, until
      one is chosen with update_settings, which reads it at once and clears
      the last server's state. WMSPanel pushes nothing to
      this API (its push API posts to a URL the consumer runs). Live,
      per-second figures come better from the server's own native API (the
      nimble-streamer integration).

  - models: [all]
    severity: info
    text: >
      Credentials go as client_id and api_key query parameters on every
      call, and WMSPanel answers wrong ones, and calls from a host missing
      from the API whitelist, with 403; the core then reports the command's
      failure, not a refused credential, so a consumer seeing 403 checks
      the key and the whitelist. The key travels in every request's URL, as
      WMSPanel requires.

  - models: [all]
    severity: info
    text: >
      Commands are the reference's calls, named after their method and
      path: list_, get_, create_, update_ and delete_ with the resource's
      path (rtmp_republish, mpegts_incoming, transcoder_pipeline_video_input,
      ...), and pause_, resume_, restart_, start_, stop_ and clone_ for the
      actions. Create and update calls take the request data fields the
      reference lists as a JSON body. The statistics calls are written out
      with their date ranges, data slice, server and stream hash. Calls
      whose optional server filter or apply_out flag matters have a
      _for_server or _with_outputs variant.

  - models: [all]
    severity: info
    text: >
      State lists (servers, live streams, re-publish rules, MPEG-TS
      streams, transcoder scenarios, tasks) are replaced whole by each read
      of their list, and a get of one entry updates it. Destination
      passwords, stream keys and logins in re-publish rules and pull
      settings are returned by the get commands but never kept in state.

  - models: [all]
    severity: critical
    text: >
      Changes reach the Nimble server when it next synchronizes with
      WMSPanel (within seconds while it is online). delete_ calls remove
      settings and recorded DVR streams for good; delete_server removes the
      server with its settings and statistics; pausing an incoming MPEG-TS
      stream, a transcoder scenario or a re-publish rule stops what depends
      on it live.

state:
  servers.*.name:                 { type: string, description: "A server in the account, keyed by ID: its name" }
  servers.*.kind:                 { type: string, description: "Nimble or Wowza" }
  servers.*.status:               { type: string, description: "online, offline or pending" }
  servers.*.ip:                   { type: string, description: "The addresses it reports, as a JSON array" }
  live_streams.*.application:     { type: string, description: "A live stream of the followed server, keyed by ID: its application" }
  live_streams.*.stream:          { type: string, description: "Its stream name" }
  live_streams.*.status:          { type: string, description: "online or offline" }
  live_streams.*.protocol:        { type: string, description: "RTMP, RTSP, MPEGTS or ICECAST" }
  live_streams.*.video_codec:     { type: string, description: "Its video codec, empty when none" }
  live_streams.*.audio_codec:     { type: string, description: "Its audio codec, empty when none" }
  live_streams.*.bandwidth:       { type: int, unit: bit/s, description: "Its bandwidth" }
  live_streams.*.resolution:      { type: string, description: "Its video resolution, such as 720x304" }
  live_streams.*.publisher_ip:    { type: string, description: "Its publisher's address, when pushed" }
  live_streams.*.source_url:      { type: string, description: "Where it is pulled from, when pulled" }
  live_streams.*.publish_time:    { type: int, unit: s, description: "When it became available, Unix seconds" }
  live_streams.*.description:     { type: string, description: "Its description" }
  rtmp_republish.*.source:        { type: string, description: "An RTMP re-publish rule, keyed by ID: its source, application/stream" }
  rtmp_republish.*.destination:   { type: string, description: "Its destination, address:port/application/stream" }
  rtmp_republish.*.auth_schema:   { type: string, description: "NONE, NIMBLE, AKAMAI, LIMELIGHT, PERISCOPE, TELEGRAM, RTMP or TWITCH" }
  rtmp_republish.*.ssl:           { type: bool, description: "It publishes over SSL" }
  rtmp_republish.*.paused:        { type: bool, description: "It is paused" }
  rtmp_republish.*.description:   { type: string, description: "Its description" }
  mpegts_incoming.*.name:         { type: string, description: "An incoming MPEG-TS, SRT, RIST, HLS, HTTP or Zixi stream, keyed by ID: its name" }
  mpegts_incoming.*.status:       { type: string, description: "pending, online, offline or paused" }
  mpegts_incoming.*.protocol:     { type: string, description: "Its protocol" }
  mpegts_incoming.*.url:          { type: string, description: "Its URL, for HTTP and HLS" }
  mpegts_incoming.*.active_url:   { type: string, description: "The URL in use (the main one or a fallback)" }
  mpegts_incoming.*.ip:           { type: string, description: "Its address, for UDP, SRT, RIST and Zixi" }
  mpegts_incoming.*.port:         { type: int, description: "Its port, for UDP, SRT, RIST and Zixi" }
  mpegts_incoming.*.bandwidth:    { type: int, unit: bit/s, description: "Its bandwidth" }
  mpegts_incoming.*.description:  { type: string, description: "Its description" }
  mpegts_outgoing.*.application:  { type: string, description: "An outgoing MPEG-TS stream, keyed by ID: its application" }
  mpegts_outgoing.*.stream:       { type: string, description: "Its stream name" }
  mpegts_outgoing.*.status:       { type: string, description: "pending or synced with the server" }
  mpegts_outgoing.*.paused:       { type: bool, description: "It is paused" }
  mpegts_outgoing.*.description:  { type: string, description: "Its description" }
  transcoders.*.name:             { type: string, description: "A transcoder scenario of the followed server, keyed by ID: its name" }
  transcoders.*.description:      { type: string, description: "Its description" }
  transcoders.*.paused:           { type: bool, description: "It is paused" }
  transcoders.*.out_of_process:   { type: bool, description: "It runs outside the Nimble process" }
  tasks.*.alias:                  { type: string, description: "A server-side task, keyed by ID: its name" }
  tasks.*.command:                { type: string, description: "The command it runs" }
  tasks.*.status:                 { type: string, description: "starting, stopping, restarting, running, stopped or failed" }
  tasks.*.autorestart:            { type: bool, description: "It restarts after finishing or failing" }
  tasks.*.info:                   { type: string, description: "Its error output, when it failed" }

telemetry:
  poll:
    - every_ms: 60000
      send:
        - { method: GET, path: "/v1/server/{settings.server_id}", query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}" } }
        - { method: GET, path: "/v1/server/{settings.server_id}/live/streams", query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}" } }
    - every_ms: 300000
      send:
        - { method: GET, path: "/v1/server/{settings.server_id}/rtmp/republish", query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}" } }
        - { method: GET, path: "/v1/server/{settings.server_id}/mpegts/incoming", query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}" } }
        - { method: GET, path: "/v1/server/{settings.server_id}/mpegts/outgoing", query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}" } }
        - { method: GET, path: /v1/transcoder, query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}", server_id: "{settings.server_id}" } }
        - { method: GET, path: "/v1/server/{settings.server_id}/tasks", query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}" } }
        # The account's servers, what server_id is chosen from.
        - { method: GET, path: /v1/server, query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}" } }
  updates:
    - path: "^/v1/server\\?"
      json_each: "$.servers"
      replace: servers
      json: &server { id: "$.id", name: "$.name", kind: "$.kind", status: "$.status", ip: "$.ip" }
      state: &server_state
        servers.{id}.name: "{name}"
        servers.{id}.kind: "{kind}"
        servers.{id}.status: "{status}"
        servers.{id}.ip: "{ip}"
    - path: "^/v1/server/[0-9a-f]{24}\\?"
      json_match: { "$.server.id": "." }
      json: { id: "$.server.id", name: "$.server.name", kind: "$.server.kind", status: "$.server.status", ip: "$.server.ip" }
      state: *server_state

    - path: "^/v1/server/[0-9a-f]{24}/live/streams\\?"
      json_each: "$.streams"
      replace: live_streams
      json: { id: "$.id", app: "$.application", stream: "$.stream", status: "$.status", protocol: "$.protocol",
                    video: "$.video_codec", audio: "$.audio_codec", bandwidth: "$.bandwidth", resolution: "$.resolution",
                    ip: "$.publisher_ip", source: "$.source_url", time: "$.publish_time", description: "$.description" }
      state: &live_state
        live_streams.{id}.application: "{app}"
        live_streams.{id}.stream: "{stream}"
        live_streams.{id}.status: "{status}"
        live_streams.{id}.protocol: "{protocol}"
        live_streams.{id}.video_codec: "{video}"
        live_streams.{id}.audio_codec: "{audio}"
        live_streams.{id}.bandwidth: "{bandwidth}"
        live_streams.{id}.resolution: "{resolution}"
        live_streams.{id}.publisher_ip: "{ip}"
        live_streams.{id}.source_url: "{source}"
        live_streams.{id}.publish_time: "{time}"
        live_streams.{id}.description: "{description}"
    - path: "^/v1/server/[0-9a-f]{24}/live/streams/[0-9a-f]{24}\\?"
      json_match: { "$.stream.id": "." }
      json: { id: "$.stream.id", app: "$.stream.application", stream: "$.stream.stream", status: "$.stream.status",
              protocol: "$.stream.protocol", video: "$.stream.video_codec", audio: "$.stream.audio_codec",
              bandwidth: "$.stream.bandwidth", resolution: "$.stream.resolution", ip: "$.stream.publisher_ip",
              source: "$.stream.source_url", time: "$.stream.publish_time", description: "$.stream.description" }
      state: *live_state

    - path: "^/v1/server/[0-9a-f]{24}/rtmp/republish\\?"
      json_each: "$.rules"
      replace: rtmp_republish
      json: &rule { id: "$.id", src_app: "$.src_app", src_strm: "$.src_strm", dest_addr: "$.dest_addr", dest_port: "$.dest_port",
                    dest_app: "$.dest_app", dest_strm: "$.dest_strm", schema: "$.auth_schema", ssl: "$.ssl", paused: "$.paused",
                    description: "$.description" }
      state: &rule_state
        rtmp_republish.{id}.source: "{src_app}/{src_strm}"
        rtmp_republish.{id}.destination: "{dest_addr}:{dest_port}/{dest_app}/{dest_strm}"
        rtmp_republish.{id}.auth_schema: "{schema}"
        rtmp_republish.{id}.ssl: "{ssl}"
        rtmp_republish.{id}.paused: "{paused}"
        rtmp_republish.{id}.description: "{description}"
    - path: "^/v1/server/[0-9a-f]{24}/rtmp/republish/[0-9a-f]{24}\\?"
      json_each: "$.rule"
      json: *rule
      state: *rule_state

    - path: "^/v1/server/[0-9a-f]{24}/mpegts/incoming\\?"
      json_each: "$.streams"
      replace: mpegts_incoming
      json: &incoming { id: "$.id", name: "$.name", status: "$.status", protocol: "$.protocol", url: "$.url", active: "$.active_url",
                        ip: "$.ip", port: "$.port", bandwidth: "$.bandwidth", description: "$.description" }
      state: &incoming_state
        mpegts_incoming.{id}.name: "{name}"
        mpegts_incoming.{id}.status: "{status}"
        mpegts_incoming.{id}.protocol: "{protocol}"
        mpegts_incoming.{id}.url: "{url}"
        mpegts_incoming.{id}.active_url: "{active}"
        mpegts_incoming.{id}.ip: "{ip}"
        mpegts_incoming.{id}.port: "{port}"
        mpegts_incoming.{id}.bandwidth: "{bandwidth}"
        mpegts_incoming.{id}.description: "{description}"

    - path: "^/v1/server/[0-9a-f]{24}/mpegts/outgoing\\?"
      json_each: "$.streams"
      replace: mpegts_outgoing
      json: { id: "$.id", app: "$.application", stream: "$.stream", status: "$.status", paused: "$.paused", description: "$.description" }
      state:
        mpegts_outgoing.{id}.application: "{app}"
        mpegts_outgoing.{id}.stream: "{stream}"
        mpegts_outgoing.{id}.status: "{status}"
        mpegts_outgoing.{id}.paused: "{paused}"
        mpegts_outgoing.{id}.description: "{description}"

    - path: "^/v1/transcoder\\?.*server_id="
      json_each: "$.transcoders"
      replace: transcoders
      json: { id: "$.id", name: "$.name", description: "$.description", paused: "$.paused", oop: "$.out_of_process" }
      state:
        transcoders.{id}.name: "{name}"
        transcoders.{id}.description: "{description}"
        transcoders.{id}.paused: "{paused}"
        transcoders.{id}.out_of_process: "{oop}"

    - path: "^/v1/server/[0-9a-f]{24}/tasks\\?"
      json_each: "$.tasks"
      replace: tasks
      json: { id: "$.id", alias: "$.alias", command: "$.command", status: "$.status", restart: "$.autorestart", info: "$.info" }
      state:
        tasks.{id}.alias: "{alias}"
        tasks.{id}.command: "{command}"
        tasks.{id}.status: "{status}"
        tasks.{id}.autorestart: "{restart}"
        tasks.{id}.info: "{info}"
    # An action on a task, scenario, stream or rule reads its list again.
    - path: "^/v1/server/([0-9a-f]{24})/tasks/[0-9a-f]{24}/(start|stop|restart)\\?"
      json: {}
      then_send:
        - { method: GET, path: "/v1/server/{1}/tasks", query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}" } }
    - path: "^/v1/server/([0-9a-f]{24})/mpegts/incoming/[0-9a-f]{24}/(pause|resume|restart)\\?"
      json: {}
      then_send:
        - { method: GET, path: "/v1/server/{1}/mpegts/incoming", query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}" } }
    - path: "^/v1/server/([0-9a-f]{24})/mpegts/outgoing/[0-9a-f]{24}/(pause|resume|restart)\\?"
      json: {}
      then_send:
        - { method: GET, path: "/v1/server/{1}/mpegts/outgoing", query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}" } }
    - path: "^/v1/transcoder/[0-9a-f]{24}/(pause|resume|clone)\\?"
      json: {}
      then_send:
        - { method: GET, path: /v1/transcoder, query: { client_id: "{settings.client_id}", api_key: "{settings.api_key}", server_id: "{settings.server_id}" } }
