commands:
  # ── Session and device ─────────────────────────────────────────────────
  help:
    summary: Human-readable help text for every command and parameter (201 help)
    send: "help"
    expect: { code_range: [200, 299] }
    returns: text

  list_commands:
    summary: The supported commands and parameters as XML (212 commands)
    send: "commands"
    expect: { code_range: [200, 299] }
    returns: text

  ping:
    summary: Check the deck is responding
    send: "ping"
    expect: { code_range: [200, 299] }
    returns: ack

  get_device_info:
    summary: Protocol version, model, unique id, slot count, software version and name (204 device info)
    send: "device info"
    expect: { code_range: [200, 299] }
    returns: fields

  get_uptime:
    summary: Time since the deck last booted
    send: "uptime"
    expect: { code_range: [200, 299] }
    returns: text

  set_identify:
    summary: Turn the deck's identify indication on or off
    params:
      enabled: { type: bool, required: true, label: Identify, description: "On makes the deck show its identify indication, off stops it." }
    send: "identify: enable: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_watchdog:
    summary: Close this connection if the client sends nothing for the period; 0 disables
    params:
      period: { type: int, min: 0, required: true, label: Period, description: "Seconds without a command from this client before the deck closes the connection; 0 disables the watchdog." }
    send: "watchdog: period: {period}"
    expect: { code_range: [200, 299] }
    returns: ack

  reboot:
    summary: Reboot the deck
    send: "reboot"
    expect: { code_range: [200, 299] }
    returns: ack

  set_response_version:
    summary: Choose the clip-list layout of clips get, disk list and their notifications for this connection
    params:
      version: { type: int, min: 1, max: 2, required: true, label: Response version, description: "Which of the protocol's two response layouts this connection gets for clips get, disk list and their notifications." }
    send: "connection protocol: response version: {version}"
    expect: { code_range: [200, 299] }
    returns: ack

  # ── Remote control ─────────────────────────────────────────────────────
  get_remote:
    summary: Remote control state (210 remote info)
    send: "remote"
    expect: { code_range: [200, 299] }
    returns: fields

  set_remote_enabled:
    summary: Enable or disable remote control of the deck
    params:
      enabled: { type: bool, required: true, label: Remote, description: "On enables remote control of the deck, off disables it." }
    send: "remote: enable: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_remote_override:
    summary: Allow this connection to control the deck whatever the remote setting, until it closes
    params:
      enabled: { type: bool, required: true, label: Override, description: "On lets this connection control the deck whatever the remote setting, until it closes." }
    send: "remote: override: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  # ── Notifications ──────────────────────────────────────────────────────
  get_notify:
    summary: Which asynchronous notifications are enabled (209 notify)
    send: "notify"
    expect: { code_range: [200, 299] }
    returns: fields

  set_notify_transport:
    summary: Transport notifications (508 transport info)
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: transport: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_slot:
    summary: Slot notifications (502 slot info)
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: slot: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_remote:
    summary: Remote control notifications (510 remote info)
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: remote: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_configuration:
    summary: Configuration notifications (511 configuration)
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: configuration: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_dropped_frames:
    summary: Dropped frame notifications; the reported count is approximate
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: dropped frames: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_display_timecode:
    summary: Display timecode notifications
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: display timecode: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_timeline_position:
    summary: Playback timeline position notifications
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: timeline position: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_playrange:
    summary: Playrange notifications
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: playrange: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_cache:
    summary: Cache notifications
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: cache: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_dynamic_range:
    summary: Dynamic range settings notifications
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: dynamic range: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_slate:
    summary: Digital slate notifications
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: slate: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_clips:
    summary: Timeline clip notifications (519 clips info; partial add or full snapshot)
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: clips: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_disk:
    summary: Disk clip notifications (520 disk list info; partial add or full snapshot)
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: disk: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_device_info:
    summary: Device info notifications
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: device info: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_notify_nas:
    summary: NAS notifications, triggered by commands such as nas add and nas remove
    params:
      enabled: { type: bool, required: true, label: Notify, description: "On sends these notifications to this connection, off stops them." }
    send: "notify: nas: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  # ── Preview ────────────────────────────────────────────────────────────
  preview_enable:
    summary: Switch to preview (input) mode; stops playback
    send: "preview: enable: true"
    expect: { code_range: [200, 299] }
    returns: ack

  preview_disable:
    summary: Switch to output (playback) mode; refused while recording
    send: "preview: enable: false"
    expect: { code_range: [200, 299] }
    returns: ack

  # ── Playback ───────────────────────────────────────────────────────────
  play_default:
    summary: Play from the current timecode, giving no options
    send: "play"
    expect: { code_range: [200, 299] }
    returns: ack

  play:
    summary: Play from the current timecode at a speed given as a percentage of normal
    params:
      single_clip: { type: bool, default: true, label: Single clip, description: "On plays only the current clip, off plays on through the timeline." }
      loop:        { type: bool, default: false, label: Loop, description: "On loops playback, off stops at the end." }
      speed:       { type: int, min: -5000, max: 5000, default: 100, label: Speed, description: "Playback speed as a percentage of normal; 100 is normal, negative plays in reverse, up to 50 times in either direction." }
    send: "play: single clip: {single_clip} loop: {loop} speed: {speed}"
    expect: { code_range: [200, 299] }
    returns: ack

  play_clip:
    summary: Play from the start of a timeline clip
    params:
      clip_id:     { type: int, min: 1, max: 9999, required: true, label: Clip, description: "Timeline clip id, numbered from 1." }
      speed:       { type: int, min: -5000, max: 5000, default: 100, label: Speed, description: "Playback speed as a percentage of normal; 100 is normal, negative plays in reverse, up to 50 times in either direction." }
      loop:        { type: bool, default: false, label: Loop, description: "On loops playback, off stops at the end." }
      single_clip: { type: bool, default: true, label: Single clip, description: "On plays only the current clip, off plays on through the timeline." }
    send: "play: clip id: {clip_id} speed: {speed} loop: {loop} single clip: {single_clip}"
    expect: { code_range: [200, 299] }
    returns: ack

  play_clip_timecode_offset:
    summary: Play from a timecode duration into a timeline clip
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true, label: Clip, description: "Timeline clip id, numbered from 1." }
      offset:  { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Offset, description: "Duration into the clip to start from, as timecode hh:mm:ss:ff." }
    send: "play: clip id: {clip_id} timecode: +{offset}"
    expect: { code_range: [200, 299] }
    returns: ack

  play_timecode:
    summary: Play from an absolute timeline timecode
    params:
      timecode:    { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Timecode, description: "Timeline timecode as hh:mm:ss:ff." }
      speed:       { type: int, min: -5000, max: 5000, default: 100, label: Speed, description: "Playback speed as a percentage of normal; 100 is normal, negative plays in reverse, up to 50 times in either direction." }
      loop:        { type: bool, default: false, label: Loop, description: "On loops playback, off stops at the end." }
      single_clip: { type: bool, default: true, label: Single clip, description: "On plays only the current clip, off plays on through the timeline." }
    send: "play: timecode: {timecode} speed: {speed} loop: {loop} single clip: {single_clip}"
    expect: { code_range: [200, 299] }
    returns: ack

  play_timeline_frame:
    summary: Play from a frame position in the timeline
    params:
      frame:       { type: int, min: 0, required: true, label: Frame, description: "Frame position within the timeline, counted from 0." }
      speed:       { type: int, min: -5000, max: 5000, default: 100, label: Speed, description: "Playback speed as a percentage of normal; 100 is normal, negative plays in reverse, up to 50 times in either direction." }
      loop:        { type: bool, default: false, label: Loop, description: "On loops playback, off stops at the end." }
      single_clip: { type: bool, default: true, label: Single clip, description: "On plays only the current clip, off plays on through the timeline." }
    send: "play: timeline: {frame} speed: {speed} loop: {loop} single clip: {single_clip}"
    expect: { code_range: [200, 299] }
    returns: ack

  get_playrange:
    summary: The current playrange, if any
    send: "playrange"
    expect: { code_range: [200, 299] }
    returns: text

  set_playrange_clip:
    summary: Restrict playback to a single clip
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true, label: Clip, description: "Timeline clip id, numbered from 1." }
    send: "playrange set: clip id: {clip_id}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_playrange_clips:
    summary: Restrict playback to a run of clips starting at clip_id
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true, label: First clip, description: "Timeline clip id the range starts at, numbered from 1." }
      count:   { type: int, min: 1, max: 9999, required: true, label: Count, description: "Number of clips, from the first one." }
    send: "playrange set: clip id: {clip_id} count: {count}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_playrange_timecode:
    summary: Restrict playback to a timecode range
    params:
      in:  { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: In, description: "Timeline timecode the range starts at, as hh:mm:ss:ff." }
      out: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Out, description: "Timeline timecode the range ends at, as hh:mm:ss:ff." }
    send: "playrange set: in: {in} out: {out}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_playrange_frames:
    summary: Restrict playback to a range of timeline frames
    params:
      timeline_in:  { type: int, min: 0, required: true, label: In frame, description: "First timeline frame of the range, counted from 0." }
      timeline_out: { type: int, min: 0, required: true, label: Out frame, description: "Last timeline frame of the range, counted from 0." }
    send: "playrange set: timeline in: {timeline_in} timeline out: {timeline_out}"
    expect: { code_range: [200, 299] }
    returns: ack

  clear_playrange:
    summary: Clear the playrange
    send: "playrange clear"
    expect: { code_range: [200, 299] }
    returns: ack

  get_play_on_startup:
    summary: Whether the deck plays on power-up, and whether a single clip
    send: "play on startup"
    expect: { code_range: [200, 299] }
    returns: fields

  set_play_on_startup:
    summary: Start playback after each power-up
    params:
      enabled: { type: bool, required: true, label: Play on startup, description: "On starts playback after each power-up, off does not." }
    send: "play on startup: enable: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_play_on_startup_single_clip:
    summary: Play a single clip rather than all clips on power-up
    params:
      single_clip: { type: bool, required: true, label: Single clip, description: "On plays a single clip on power-up, off plays all clips." }
    send: "play on startup: single clip: {single_clip}"
    expect: { code_range: [200, 299] }
    returns: ack

  get_play_option:
    summary: The output frame shown when playback stops
    send: "play option"
    expect: { code_range: [200, 299] }
    returns: fields

  set_playback_stop_mode:
    summary: The output frame shown when playback stops
    params:
      mode: { type: enum, values: [lastframe, nextframe, black], required: true, label: Stop mode, description: "lastframe holds the last frame played, nextframe the next frame, black shows black." }
    send: "play option: stop mode: {mode}"
    expect: { code_range: [200, 299] }
    returns: ack

  get_transport_info:
    summary: Transport state, speed, slot, clip, timecodes and formats (208 transport info)
    send: "transport info"
    expect: { code_range: [200, 299] }
    returns: fields

  stop:
    summary: Stop playback or recording
    send: "stop"
    expect: { code_range: [200, 299] }
    returns: ack

  # ── Recording ──────────────────────────────────────────────────────────
  record:
    summary: Start recording from the current input
    send: "record"
    expect: { code_range: [200, 299] }
    returns: ack

  record_named:
    summary: Start recording a named clip
    params:
      name: { type: string, max_length: 128, required: true, label: Clip name, description: "Name for the recorded clip." }
    send: "record: name: {name}"
    expect: { code_range: [200, 299] }
    returns: ack

  record_spill:
    summary: Continue the current recording on the next slot
    send: "record spill"
    expect: { code_range: [200, 299] }
    returns: ack

  record_spill_to_slot:
    summary: Continue the current recording on a specific slot; the current slot spills to itself
    params:
      slot_id: { type: int, min: 1, max: 8, required: true, label: Slot, description: "Media slot to continue recording on, numbered from 1." }
    send: "record: spill: slot id: {slot_id}"
    expect: { code_range: [200, 299] }
    returns: ack

  get_spill_order:
    summary: The device order used for record spill
    send: "spill order"
    expect: { code_range: [200, 299] }
    returns: text

  # ── Timeline position ──────────────────────────────────────────────────
  goto_clip:
    summary: Jump to a clip by 1-based id
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true, label: Clip, description: "Timeline clip id, numbered from 1." }
    send: "goto: clip id: {clip_id}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_clip_offset:
    summary: Jump forward or backward a number of clips; clamps at the first and last clip
    params:
      offset: { type: int, min: -999, max: 999, required: true, label: Offset, description: "Number of clips to move, negative to go back." }
    send: "goto: clip id: {offset:signed}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_first_or_last_clip:
    summary: Jump to the first clip (start) or the last clip (end)
    params:
      which: { type: enum, values: [start, end], required: true, label: Position, description: "start jumps to the first clip, end to the last." }
    send: "goto: clip id: {which}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_clip_edge:
    summary: Jump to the start or end of the current clip
    params:
      which: { type: enum, values: [start, end], required: true, label: Position, description: "start jumps to the start of the current clip, end to its end." }
    send: "goto: clip: {which}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_clip_frame:
    summary: Jump to a frame position within the current clip
    params:
      frame: { type: int, min: 0, required: true, label: Frame, description: "Frame position within the clip, counted from 0." }
    send: "goto: clip: {frame}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_clip_frame_offset:
    summary: Move forward or backward a number of frames within the current clip
    params:
      offset: { type: int, required: true, label: Frames, description: "Number of frames to move, negative to go back." }
    send: "goto: clip: {offset:signed}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_timeline_edge:
    summary: Jump to the start or end of the timeline
    params:
      which: { type: enum, values: [start, end], required: true, label: Position, description: "start jumps to the start of the timeline, end to its end." }
    send: "goto: timeline: {which}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_timeline_frame:
    summary: Jump to a frame position within the timeline
    params:
      frame: { type: int, min: 0, required: true, label: Frame, description: "Frame position within the timeline, counted from 0." }
    send: "goto: timeline: {frame}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_timeline_frame_offset:
    summary: Move forward or backward a number of frames within the timeline
    params:
      offset: { type: int, required: true, label: Frames, description: "Number of frames to move, negative to go back." }
    send: "goto: timeline: {offset:signed}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_timecode:
    summary: Jump to an absolute timecode in the timeline
    params:
      timecode: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Timecode, description: "Timeline timecode as hh:mm:ss:ff." }
    send: "goto: timecode: {timecode}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_timecode_forward:
    summary: Move forward by a timecode duration
    params:
      duration: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Duration, description: "Duration as timecode hh:mm:ss:ff." }
    send: "goto: timecode: +{duration}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_timecode_backward:
    summary: Move backward by a timecode duration
    params:
      duration: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Duration, description: "Duration as timecode hh:mm:ss:ff." }
    send: "goto: timecode: -{duration}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_slot:
    summary: Switch to a slot; the same as select_slot
    params:
      slot_id: { type: int, min: 1, max: 8, required: true, label: Slot, description: "Media slot, numbered from 1 as on the deck." }
    send: "goto: slot id: {slot_id}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_clip_and_clip_frame:
    summary: Jump to a clip and then to a frame position within that clip
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true, label: Clip, description: "Timeline clip id, numbered from 1." }
      frame:   { type: int, min: 0, required: true, label: Frame, description: "Frame position within the clip, counted from 0." }
    send: "goto: clip id: {clip_id} clip: {frame}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_clip_and_timeline_frame:
    summary: Jump to a clip and then to a frame position within the timeline
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true, label: Clip, description: "Timeline clip id, numbered from 1." }
      frame:   { type: int, min: 0, required: true, label: Frame, description: "Frame position within the timeline, counted from 0." }
    send: "goto: clip id: {clip_id} timeline: {frame}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_clip_and_timecode:
    summary: Jump to a clip and then offset by a timecode duration
    params:
      clip_id:  { type: int, min: 1, max: 9999, required: true, label: Clip, description: "Timeline clip id, numbered from 1." }
      timecode: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Offset, description: "Duration into the clip, as timecode hh:mm:ss:ff." }
    send: "goto: clip id: {clip_id} timecode: {timecode}"
    expect: { code_range: [200, 299] }
    returns: ack

  # ── Jog and shuttle ────────────────────────────────────────────────────
  jog_to_timecode:
    summary: Jog to a timecode
    params:
      timecode: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Timecode, description: "Timeline timecode to jog to, as hh:mm:ss:ff." }
    send: "jog: timecode: {timecode}"
    expect: { code_range: [200, 299] }
    returns: ack

  jog_forward:
    summary: Jog forward by a timecode duration
    params:
      duration: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Duration, description: "Duration as timecode hh:mm:ss:ff." }
    send: "jog: timecode: +{duration}"
    expect: { code_range: [200, 299] }
    returns: ack

  jog_backward:
    summary: Jog backward by a timecode duration
    params:
      duration: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Duration, description: "Duration as timecode hh:mm:ss:ff." }
    send: "jog: timecode: -{duration}"
    expect: { code_range: [200, 299] }
    returns: ack

  shuttle:
    summary: Shuttle at a speed given as a percentage of normal
    params:
      speed: { type: int, min: -5000, max: 5000, required: true, label: Speed, description: "Shuttle speed as a percentage of normal; 100 is normal, negative is reverse, up to 50 times in either direction." }
    send: "shuttle: speed: {speed}"
    expect: { code_range: [200, 299] }
    returns: ack

  # ── Timeline clips ─────────────────────────────────────────────────────
  get_clip_count:
    summary: Number of clips on the timeline (214 clips count)
    send: "clips count"
    expect: { code_range: [200, 299], matches: "clip count: ([0-9]+)" }
    returns: value

  get_clips:
    summary: Every clip on the timeline (205 clips info)
    send: "clips get"
    expect: { code_range: [200, 299] }
    returns: text

  get_clip:
    summary: One timeline clip
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true, label: Clip, description: "Timeline clip id, numbered from 1." }
    send: "clips get: clip id: {clip_id}"
    expect: { code_range: [200, 299] }
    returns: text

  get_clips_range:
    summary: A run of timeline clips starting at clip_id
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true, label: First clip, description: "Timeline clip id the run starts at, numbered from 1." }
      count:   { type: int, min: 1, max: 9999, required: true, label: Count, description: "Number of clips, from the first one." }
    send: "clips get: clip id: {clip_id} count: {count}"
    expect: { code_range: [200, 299] }
    returns: text

  get_clips_version:
    summary: Every timeline clip in output version 1, 2 (in and out points, name last) or 3 (with folder path)
    params:
      version: { type: int, min: 1, max: 3, required: true, label: Output version, description: "1 the original layout, 2 with in and out points and the name last, 3 also with the folder path." }
    send: "clips get: version: {version}"
    expect: { code_range: [200, 299] }
    returns: text

  add_clip:
    summary: Append a clip to the timeline; the name may include folders
    params:
      name: { type: string, max_length: 255, required: true, label: Name, description: "Clip name as stored on the disk, optionally with folders." }
    send: "clips add: name: {name}"
    expect: { code_range: [200, 299] }
    returns: ack

  insert_clip:
    summary: Insert a clip before an existing timeline clip
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true, label: Before clip, description: "Timeline clip id to insert before, numbered from 1." }
      name:    { type: string, max_length: 255, required: true, label: Name, description: "Clip name as stored on the disk, optionally with folders." }
    send: "clips add: clip id: {clip_id} name: {name}"
    expect: { code_range: [200, 299] }
    returns: ack

  add_clip_timecode_range:
    summary: Append the part of a clip between two clip timecodes
    params:
      in:   { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: In, description: "Clip timecode to start from, as hh:mm:ss:ff." }
      out:  { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Out, description: "Clip timecode to end at, as hh:mm:ss:ff." }
      name: { type: string, max_length: 255, required: true, label: Name, description: "Clip name as stored on the disk, optionally with folders." }
    send: "clips add: in: {in} out: {out} name: {name}"
    expect: { code_range: [200, 299] }
    returns: ack

  add_clip_frame_range:
    summary: Append the part of a clip between two clip frame numbers
    params:
      frame_in:  { type: int, min: 0, required: true, label: In frame, description: "Clip frame to start from, counted from 0." }
      frame_out: { type: int, min: 0, required: true, label: Out frame, description: "Clip frame to end at, counted from 0." }
      name:      { type: string, max_length: 255, required: true, label: Name, description: "Clip name as stored on the disk, optionally with folders." }
    send: "clips add: frame in: {frame_in} frame out: {frame_out} name: {name}"
    expect: { code_range: [200, 299] }
    returns: ack

  remove_clip:
    summary: Remove a clip from the timeline; later clip ids shift down
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true, label: Clip, description: "Timeline clip id, numbered from 1." }
    send: "clips remove: clip id: {clip_id}"
    expect: { code_range: [200, 299] }
    returns: ack

  clear_clips:
    summary: Empty the timeline
    send: "clips clear"
    expect: { code_range: [200, 299] }
    returns: ack

  rebuild_clips:
    summary: Rebuild the timeline with the default rules
    send: "clips rebuild"
    expect: { code_range: [200, 299] }
    returns: ack

  get_current_clip_info:
    summary: Information on the clip now playing or recording
    send: "clip info"
    expect: { code_range: [200, 299] }
    returns: fields

  get_clip_info:
    summary: Information on a timeline clip
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true, label: Clip, description: "Timeline clip id, numbered from 1." }
    send: "clip info: clip id: {clip_id}"
    expect: { code_range: [200, 299] }
    returns: fields

  get_clip_info_by_name:
    summary: Information on a clip on the active disk, by name
    params:
      name: { type: string, max_length: 255, required: true, label: Clip name, description: "Name of a clip on the active disk." }
    send: "clip info: name: {name}"
    expect: { code_range: [200, 299] }
    returns: fields

  # ── Disks, slots and external drives ───────────────────────────────────
  disk_list:
    summary: Playable clips on the active disk (206 disk list)
    send: "disk list"
    expect: { code_range: [200, 299] }
    returns: text

  disk_list_slot:
    summary: Playable clips on the disk in a specific slot
    params:
      slot_id: { type: int, min: 1, max: 8, required: true, label: Slot, description: "Media slot, numbered from 1 as on the deck." }
    send: "disk list: slot id: {slot_id}"
    expect: { code_range: [200, 299] }
    returns: text

  disk_list_device:
    summary: Playable clips on a disk device; USB and network devices need not be active
    params:
      device: { type: string, max_length: 255, required: true, label: Disk device, description: "The disk device's identifying name, as the deck reports it in slot info." }
    send: "disk list: device: {device}"
    expect: { code_range: [200, 299] }
    returns: text

  get_slot_info:
    summary: The active slot (202 slot info)
    send: "slot info"
    expect: { code_range: [200, 299] }
    returns: fields

  get_slot_info_slot:
    summary: A specific slot (202 slot info)
    params:
      slot_id: { type: int, min: 1, max: 8, required: true, label: Slot, description: "Media slot, numbered from 1 as on the deck." }
    send: "slot info: slot id: {slot_id}"
    expect: { code_range: [200, 299] }
    returns: fields

  get_slot_info_device:
    summary: The slot holding a disk device; USB and network devices need not be active
    params:
      device: { type: string, max_length: 255, required: true, label: Disk device, description: "The disk device's identifying name, as the deck reports it in slot info." }
    send: "slot info: device: {device}"
    expect: { code_range: [200, 299] }
    returns: fields

  select_slot:
    summary: Switch to a slot
    params:
      slot_id: { type: int, min: 1, max: 8, required: true, label: Slot, description: "Media slot, numbered from 1 as on the deck." }
    send: "slot select: slot id: {slot_id}"
    expect: { code_range: [200, 299] }
    returns: ack

  select_slot_device:
    summary: Switch to the slot holding a disk device, including USB drives not yet active
    params:
      device: { type: string, max_length: 255, required: true, label: Disk device, description: "The disk device's identifying name, as the deck reports it in slot info." }
    send: "slot select: device: {device}"
    expect: { code_range: [200, 299] }
    returns: ack

  select_video_format:
    summary: Rebuild the timeline from the clips of one video format
    params:
      video_format:
        type: enum
        values:
          [720p50, 720p5994, 720p60,
           1080p23976, 1080p24, 1080p25, 1080p2997, 1080p30, 1080p60,
           1080i50, 1080i5994, 1080i60,
           NTSC, PAL, NTSCp, PALp,
           2160p23.98, 2160p24, 2160p25, 2160p29.97, 2160p30, 2160p50, 2160p59.94, 2160p60,
           4Kp23976, 4Kp24, 4Kp25, 4Kp2997, 4Kp30, 4Kp50, 4Kp5994, 4Kp60,
           4320p23.98, 4320p24, 4320p25, 4320p29.97, 4320p30, 4320p50, 4320p59.94, 4320p60,
           8Kp23976, 8Kp24, 8Kp25]
        required: true
        label: Video format
        description: Video format as the deck names it, such as 1080p25 or 2160p59.94; the formats available vary by model.
    send: "slot select: video format: {video_format}"
    expect: { code_range: [200, 299] }
    returns: ack

  select_slot_video_format:
    summary: Switch to a slot and play only the clips of one video format
    params:
      slot_id:      { type: int, min: 1, max: 8, required: true, label: Slot, description: "Media slot, numbered from 1 as on the deck." }
      video_format: { type: enum, values: [720p50, 720p5994, 720p60, 1080p23976, 1080p24, 1080p25, 1080p2997, 1080p30, 1080p60, 1080i50, 1080i5994, 1080i60, NTSC, PAL, NTSCp, PALp, 2160p23.98, 2160p24, 2160p25, 2160p29.97, 2160p30, 2160p50, 2160p59.94, 2160p60, 4Kp23976, 4Kp24, 4Kp25, 4Kp2997, 4Kp30, 4Kp50, 4Kp5994, 4Kp60, 4320p23.98, 4320p24, 4320p25, 4320p29.97, 4320p30, 4320p50, 4320p59.94, 4320p60, 8Kp23976, 8Kp24, 8Kp25], required: true, label: Video format, description: "Video format as the deck names it, such as 1080p25 or 2160p59.94; the formats available vary by model." }
    send: "slot select: slot id: {slot_id} video format: {video_format}"
    expect: { code_range: [200, 299] }
    returns: ack

  unblock_slot:
    summary: Unblock the active slot
    send: "slot unblock"
    expect: { code_range: [200, 299] }
    returns: ack

  unblock_slot_id:
    summary: Unblock a specific slot
    params:
      slot_id: { type: int, min: 1, max: 8, required: true, label: Slot, description: "Media slot, numbered from 1 as on the deck." }
    send: "slot unblock: slot id: {slot_id}"
    expect: { code_range: [200, 299] }
    returns: ack

  unblock_device:
    summary: Unblock a disk device
    params:
      device: { type: string, max_length: 255, required: true, label: Disk device, description: "The disk device's identifying name, as the deck reports it in slot info." }
    send: "slot unblock: device: {device}"
    expect: { code_range: [200, 299] }
    returns: ack

  list_external_drives:
    summary: USB and network drives available to the external slot (226 external drive info)
    send: "external drive list"
    expect: { code_range: [200, 299] }
    returns: text

  select_external_drive:
    summary: Switch the external slot to a drive
    params:
      device: { type: string, max_length: 255, required: true, label: Disk device, description: "Identifying name of the external drive, as the deck reports it." }
    send: "external drive select: device: {device}"
    expect: { code_range: [200, 299] }
    returns: ack

  get_selected_external_drive:
    summary: The drive selected for the external slot
    send: "external drive selected"
    expect: { code_range: [200, 299] }
    returns: text

  get_cache_info:
    summary: Record cache status
    send: "cache info"
    expect: { code_range: [200, 299] }
    returns: fields

  # ── Formatting ─────────────────────────────────────────────────────────
  format_prepare_slot:
    summary: Prepare to format the disk in a slot; the reply carries the token format_confirm needs
    params:
      slot_id:    { type: int, min: 1, max: 8, required: true, label: Slot, description: "Media slot, numbered from 1 as on the deck." }
      filesystem: { type: enum, values: [exFAT, HFS+], required: true, label: File system, description: "exFAT or HFS+." }
      name:       { type: string, max_length: 255, required: true, label: Volume name, description: "Name to give the formatted disk." }
    send: "format: slot id: {slot_id} prepare: {filesystem} name: {name}"
    expect: { code_range: [200, 299] }
    returns: text

  format_prepare_current:
    summary: Prepare to format the disk in the current mounted slot; the reply carries the token
    params:
      filesystem: { type: enum, values: [exFAT, HFS+], required: true, label: File system, description: "exFAT or HFS+." }
      name:       { type: string, max_length: 255, required: true, label: Volume name, description: "Name to give the formatted disk." }
    send: "format: prepare: {filesystem} name: {name}"
    expect: { code_range: [200, 299] }
    returns: text

  format_prepare_device:
    summary: Prepare to format a disk device; the reply carries the token
    params:
      device:     { type: string, max_length: 255, required: true, label: Disk device, description: "The disk device's identifying name, as the deck reports it in slot info." }
      filesystem: { type: enum, values: [exFAT, HFS+], required: true, label: File system, description: "exFAT or HFS+." }
      name:       { type: string, max_length: 255, required: true, label: Volume name, description: "Name to give the formatted disk." }
    send: "format: device: {device} prepare: {filesystem} name: {name}"
    expect: { code_range: [200, 299] }
    returns: text

  format_confirm:
    summary: Carry out a prepared format, erasing the disk
    params:
      token: { type: string, max_length: 255, required: true, label: Token, description: "The token returned by the matching format prepare command." }
    send: "format: confirm: {token}"
    expect: { code_range: [200, 299] }
    returns: ack

  # ── Dynamic range ──────────────────────────────────────────────────────
  get_dynamic_range:
    summary: Playback and record dynamic range overrides
    send: "dynamic range"
    expect: { code_range: [200, 299] }
    returns: fields

  set_playback_dynamic_range:
    summary: Override the dynamic range of playback
    params:
      mode:
        type: enum
        values: ["off", Rec709, Rec2020_SDR, HLG, ST2084_300, ST2084_500, ST2084_800,
                 ST2084_1000, ST2084_2000, ST2084_4000, ST2084]
        required: true
        label: Dynamic range
        description: off keeps the clip's own; otherwise Rec709, Rec2020_SDR, HLG or ST2084 at the given peak in nits.
    send: "dynamic range: playback override: {mode}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_record_dynamic_range:
    summary: Override the dynamic range of recordings
    params:
      mode:
        type: enum
        values: ["off", Rec709, Rec2020_SDR, HLG, ST2084_300, ST2084_500, ST2084_800,
                 ST2084_1000, ST2084_2000, ST2084_4000, ST2048]
        required: true
        label: Dynamic range
        description: off keeps the input's own; otherwise Rec709, Rec2020_SDR, HLG or ST2084 at the given peak in nits.
    send: "dynamic range: record override: {mode}"
    expect: { code_range: [200, 299] }
    returns: ack

  # ── Configuration ──────────────────────────────────────────────────────
  get_configuration:
    summary: The deck's configuration (211 configuration)
    send: "configuration"
    expect: { code_range: [200, 299] }
    returns: fields

  set_video_input:
    summary: Video input source; the inputs available vary by model
    params:
      input: { type: enum, values: [SDI, 4xSDI, HDMI, component, composite], required: true, label: Video input, description: "SDI, 4xSDI (quad link), HDMI, component or composite; the inputs available vary by model." }
    send: "configuration: video input: {input}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_audio_input:
    summary: Audio input source; superseded by the XLR and RCA mappings on decks that have them
    params:
      input: { type: enum, values: [embedded, XLR, RCA], required: true, label: Audio input, description: "embedded in the video, XLR or RCA." }
    send: "configuration: audio input: {input}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_file_format:
    summary: Recording file format; may reboot the deck (213 deck rebooting)
    params:
      format:
        type: enum
        values: [H.264High_SDI, H.264High, H.264Medium, H.264Low, H.264High10_422,
                 H.265High_SDI, H.265High_422, H.265High, H.265Medium, H.265Low,
                 QuickTimeProResHQ, QuickTimeProRes, QuickTimeProResLT, QuickTimeProResProxy,
                 QuickTimeDNxHD220x, DNxHD220x, QuickTimeDNxHD145, DNxHD145,
                 QuickTimeDNxHD45, DNxHD45,
                 QuickTimeDNxHR_HQX, DNxHR_HQX, QuickTimeDNxHR_SQ, DNxHR_SQ,
                 QuickTimeDNxHR_LB, DNxHR_LB]
        required: true
        label: File format
        description: Recording codec and quality as the deck names it, such as QuickTimeProResHQ or H.265High; the formats available vary by model.
    send: "configuration: file format: {format}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_audio_codec:
    summary: Recording audio codec
    params:
      codec: { type: enum, values: [PCM, AAC], required: true, label: Audio codec, description: "PCM for uncompressed audio, AAC for compressed." }
    send: "configuration: audio codec: {codec}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_timecode_input:
    summary: Timecode source for recording
    params:
      source: { type: enum, values: [external, embedded, internal, preset, clip], required: true, label: Timecode input, description: "external, embedded in the video, internal, the preset timecode, or the clip's own." }
    send: "configuration: timecode input: {source}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_timecode_output:
    summary: Whether timecode output follows the clip or the timeline
    params:
      mode: { type: enum, values: [clip, timeline], required: true, label: Timecode output, description: "clip outputs the clip's timecode, timeline the timeline's." }
    send: "configuration: timecode output: {mode}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_timecode_preference:
    summary: Drop-frame timecode use where not otherwise specified
    params:
      preference: { type: enum, values: [default, dropframe, nondropframe], required: true, label: Drop frame, description: "default uses the format's own choice, dropframe or nondropframe forces it." }
    send: "configuration: timecode preference: {preference}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_timecode_preset:
    summary: The preset timecode
    params:
      timecode: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Preset timecode, description: "Timecode to start from when the timecode input is preset, as hh:mm:ss:ff." }
    send: "configuration: timecode preset: {timecode}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_audio_input_channels:
    summary: Number of audio channels recorded
    params:
      channels: { type: int, min: 0, required: true, label: Audio channels, description: "Number of audio channels to record; the counts available vary by model." }
    send: "configuration: audio input channels: {channels}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_record_trigger:
    summary: What starts recording
    params:
      trigger: { type: enum, values: [none, recordbit, timecoderun], required: true, label: Record trigger, description: "none records only on command, recordbit on the SDI record flag, timecoderun when input timecode runs." }
    send: "configuration: record trigger: {trigger}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_record_prefix:
    summary: Prefix of recorded clip names (UTF-8)
    params:
      prefix: { type: string, max_length: 255, required: true, label: Prefix, description: "Text put before the names of recorded clips." }
    send: "configuration: record prefix: {prefix}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_record_cache:
    summary: Record through the cache; no effect where no cache is installed and formatted
    params:
      enabled: { type: bool, required: true, label: Record cache, description: "On records through the cache, off records directly; no effect without a formatted cache." }
    send: "configuration: record cache: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_append_timestamp:
    summary: Append a timestamp to recorded file names
    params:
      enabled: { type: bool, required: true, label: Append timestamp, description: "On appends a timestamp to recorded file names, off does not." }
    send: "configuration: append timestamp: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_usb_spill:
    summary: Spill recording between USB disks
    params:
      enabled: { type: bool, required: true, label: USB spill, description: "On continues recording onto the next USB disk when one fills, off does not." }
    send: "configuration: usb spill: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_reference_source:
    summary: Source of the reference signal
    params:
      source: { type: enum, values: [auto, input, external], required: true, label: Reference, description: "auto chooses, input locks to the video input, external to the reference input." }
    send: "configuration: reference source: {source}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_genlock_input_resync:
    summary: Genlock input resync; when enabled, set the reference source to auto or external
    params:
      enabled: { type: bool, required: true, label: Genlock resync, description: "On enables genlock input resync; set the reference source to auto or external with it." }
    send: "configuration: genlock input resync: {enabled}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_default_standard:
    summary: Default playback video format
    params:
      video_format: { type: enum, values: [720p50, 720p5994, 720p60, 1080p23976, 1080p24, 1080p25, 1080p2997, 1080p30, 1080p60, 1080i50, 1080i5994, 1080i60, NTSC, PAL, NTSCp, PALp, 2160p23.98, 2160p24, 2160p25, 2160p29.97, 2160p30, 2160p50, 2160p59.94, 2160p60, 4Kp23976, 4Kp24, 4Kp25, 4Kp2997, 4Kp30, 4Kp50, 4Kp5994, 4Kp60, 4320p23.98, 4320p24, 4320p25, 4320p29.97, 4320p30, 4320p50, 4320p59.94, 4320p60, 8Kp23976, 8Kp24, 8Kp25], required: true, label: Video format, description: "Video format used for playback when none is set by the clips, as the deck names it." }
    send: "configuration: default standard: {video_format}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_xlr_input_type:
    summary: Line or mic level for one XLR input
    params:
      xlr_id: { type: int, min: 1, required: true, label: XLR input, description: "XLR input, numbered from 1." }
      type:   { type: enum, values: [line, mic], required: true, label: Input level, description: "line for line level, mic for microphone level." }
    send: "configuration: xlr input id: {xlr_id} xlr type: {type}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_xlr_mapping:
    summary: Map the input XLRs to channels starting from channel
    params:
      channel: { type: int, min: 1, required: true, label: First channel, description: "Channel the first XLR input is mapped to, numbered from 1." }
    send: "configuration: xlr mapping: {channel}"
    expect: { code_range: [200, 299] }
    returns: ack

  unmap_xlr:
    summary: Unmap the input XLRs
    send: "configuration: xlr mapping: none"
    expect: { code_range: [200, 299] }
    returns: ack

  set_rca_mapping:
    summary: Map the input RCAs to channels starting from channel
    params:
      channel: { type: int, min: 1, required: true, label: First channel, description: "Channel the first RCA input is mapped to, numbered from 1." }
    send: "configuration: rca mapping: {channel}"
    expect: { code_range: [200, 299] }
    returns: ack

  unmap_rca:
    summary: Unmap the input RCAs
    send: "configuration: rca mapping: none"
    expect: { code_range: [200, 299] }
    returns: ack

  # ── Digital slate (multiline only) ─────────────────────────────────────
  get_slate_clips:
    summary: Slate clip information
    send: "slate clips"
    expect: { code_range: [200, 299] }
    returns: fields

  get_slate_project:
    summary: Slate project information
    send: "slate project"
    expect: { code_range: [200, 299] }
    returns: fields

  get_slate_lens:
    summary: Slate lens information
    send: "slate lens"
    expect: { code_range: [200, 299] }
    returns: fields

  set_slate_reel:
    summary: Slate reel number
    params:
      reel: { type: int, min: 1, max: 999, required: true, label: Reel, description: "Slate reel number, 1 to 999." }
    send: "slate clips:\r\nreel: {reel}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_scene_id:
    summary: Slate scene id
    params:
      scene_id: { type: string, max_length: 255, required: true, label: Scene, description: "Slate scene id, such as 12A." }
    send: "slate clips:\r\nscene id: {scene_id}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_shot_type:
    summary: Slate shot type
    params:
      shot_type: { type: enum, values: [WS, MS, CU, BCU, MCU, ECU, none], required: true, label: Shot type, description: "WS wide, MS medium, CU close-up, BCU big close-up, MCU medium close-up, ECU extreme close-up, or none." }
    send: "slate clips:\r\nshot type: {shot_type}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_take:
    summary: Slate take number
    params:
      take: { type: int, min: 1, max: 99, required: true, label: Take, description: "Slate take number, 1 to 99." }
    send: "slate clips:\r\ntake: {take}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_take_scenario:
    summary: Slate take scenario
    params:
      scenario: { type: enum, values: [PU, VFX, SER, none], required: true, label: Take scenario, description: "PU pick-up, VFX visual effects, SER series, or none." }
    send: "slate clips:\r\ntake scenario: {scenario}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_take_auto_inc:
    summary: Slate take auto-increment
    params:
      enabled: { type: bool, required: true, label: Take auto-increment, description: "On increments the take number after each recording, off does not." }
    send: "slate clips:\r\ntake auto inc: {enabled}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_good_take:
    summary: Mark the slate take good
    params:
      good: { type: bool, required: true, label: Good take, description: "On marks the take good, off clears it." }
    send: "slate clips:\r\ngood take: {good}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_environment:
    summary: Slate environment
    params:
      environment: { type: enum, values: [interior, exterior], required: true, label: Environment, description: "interior or exterior." }
    send: "slate clips:\r\nenvironment: {environment}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_day_night:
    summary: Slate day or night
    params:
      day_night: { type: enum, values: [day, night], required: true, label: Day or night, description: "day or night." }
    send: "slate clips:\r\nday night: {day_night}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_project_name:
    summary: Slate project name (may be empty, UTF-8)
    params:
      name: { type: string, max_length: 255, required: true, label: Project, description: "Project name on the slate; may be empty." }
    send: "slate project:\r\nproject name: {name}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_camera:
    summary: Slate camera index, such as A
    params:
      camera: { type: string, max_length: 255, required: true, label: Camera, description: "Camera index on the slate, such as A." }
    send: "slate project:\r\ncamera: {camera}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_director:
    summary: Slate director (may be empty, UTF-8)
    params:
      name: { type: string, max_length: 255, required: true, label: Director, description: "Director on the slate; may be empty." }
    send: "slate project:\r\ndirector: {name}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_camera_operator:
    summary: Slate camera operator (may be empty, UTF-8)
    params:
      name: { type: string, max_length: 255, required: true, label: Camera operator, description: "Camera operator on the slate; may be empty." }
    send: "slate project:\r\ncamera operator: {name}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_lens_type:
    summary: Slate lens type (may be empty, UTF-8)
    params:
      lens_type: { type: string, max_length: 255, required: true, label: Lens type, description: "Lens type on the slate; may be empty." }
    send: "slate lens:\r\nlens type: {lens_type}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_iris:
    summary: Slate iris (may be empty, UTF-8)
    params:
      iris: { type: string, max_length: 255, required: true, label: Iris, description: "Iris on the slate, such as f2.8; may be empty." }
    send: "slate lens:\r\niris: {iris}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_focal_length:
    summary: Slate focal length (may be empty, UTF-8)
    params:
      focal_length: { type: string, max_length: 255, required: true, label: Focal length, description: "Focal length on the slate, such as 50mm; may be empty." }
    send: "slate lens:\r\nfocal length: {focal_length}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_distance:
    summary: Slate lens distance (may be empty, UTF-8)
    params:
      distance: { type: string, max_length: 255, required: true, label: Distance, description: "Lens distance on the slate; may be empty." }
    send: "slate lens:\r\ndistance: {distance}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  set_slate_filter:
    summary: Slate lens filter (may be empty, UTF-8)
    params:
      filter: { type: string, max_length: 255, required: true, label: Filter, description: "Lens filter on the slate; may be empty." }
    send: "slate lens:\r\nfilter: {filter}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  # ── Network storage ────────────────────────────────────────────────────
  list_nas:
    summary: Every NAS share bookmark
    send: "nas list"
    expect: { code_range: [200, 299] }
    returns: text

  list_nas_discovered:
    summary: NAS servers discovered over mDNS (225 nas host info)
    send: "nas discovered"
    expect: { code_range: [200, 299] }
    returns: text

  get_nas_selected:
    summary: The NAS share currently selected
    send: "nas selected"
    expect: { code_range: [200, 299] }
    returns: text

  deselect_nas:
    summary: Unmount the selected NAS share
    send: "nas deselect"
    expect: { code_range: [200, 299] }
    returns: ack

  add_nas:
    summary: Bookmark a NAS share with guest access
    params:
      url: { type: string, max_length: 1024, required: true, label: NAS URL, description: "The share's URL, such as smb://192.168.1.10/media." }
    send: "nas add:\r\nurl: {url}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  add_nas_with_credentials:
    summary: Bookmark a NAS share with a username and password, sent in plain text on this port
    params:
      url:      { type: string, max_length: 1024, required: true, label: NAS URL, description: "The share's URL, such as smb://192.168.1.10/media." }
      username: { type: string, max_length: 255, required: true, label: Username, description: "User name for the NAS share, sent in plain text." }
      password: { type: string, max_length: 255, required: true, label: Password, description: "Password for the NAS share, sent in plain text." }
    send: "nas add:\r\nurl: {url}\r\nusername: {username}\r\npassword: {password}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  remove_nas:
    summary: Remove a NAS share bookmark; does not unmount it
    params:
      url: { type: string, max_length: 1024, required: true, label: NAS URL, description: "The share's URL, such as smb://192.168.1.10/media." }
    send: "nas remove:\r\nurl: {url}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  select_nas:
    summary: Mount a NAS share asynchronously, with its bookmark's credentials or as guest
    params:
      url: { type: string, max_length: 1024, required: true, label: NAS URL, description: "The share's URL, such as smb://192.168.1.10/media." }
    send: "nas select:\r\nurl: {url}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

codes:
  "100": syntax error
  "101": unsupported parameter
  "102": invalid value
  "103": unsupported
  "104": disk full
  "105": no disk
  "106": disk error
  "107": timeline empty
  "108": internal error
  "109": out of range
  "110": no input
  "111": remote control disabled
  "112": clip not found
  "120": connection failed
  "121": authentication failed
  "122": authentication required
  "150": invalid state
  "151": invalid codec
  "160": invalid format
  "161": invalid token
  "162": format not prepared
  "163": parameterized single line command not supported

telemetry:
  # The document defines the asynchronous messages 500 connection info (on
  # connect), 502 slot info, 508 transport info, 510 remote info and 511
  # configuration, each carrying the same fields as its 2xx reply (p.11-23),
  # and 519 clips info (p.8). The other notifications are documented by their
  # notify switch only; they are read by the field names the switches use
  # (corroborated for display timecode, timeline position and playrange by
  # Sofie's hyperdeck-connection, MIT). One notify line per kind, so a deck
  # lacking one still enables the rest; a protocol 1.8 or 1.11 deck answers
  # the later ones with an error, which changes nothing.
  subscribe:
    send:
      - "notify: transport: true"
      - "notify: slot: true"
      - "notify: remote: true"
      - "notify: configuration: true"
      - "notify: display timecode: true"
      - "notify: timeline position: true"
      - "notify: dropped frames: true"
      - "notify: playrange: true"
      - "notify: cache: true"
      - "notify: dynamic range: true"
      - "notify: slate: true"
      - "notify: clips: true"
      - "notify: nas: true"
  # Asked once on connecting; after that the pushes and the re-reads below
  # keep state. Slots 1 to 4 are each asked for; a deck answers a slot it
  # lacks with an error.
  poll:
    send:
      - "device info"
      - "transport info"
      - "slot info"
      - "slot info: slot id: 1"
      - "slot info: slot id: 2"
      - "slot info: slot id: 3"
      - "slot info: slot id: 4"
      - "remote"
      - "configuration"
      - "notify"
      - "clips get"
      - "playrange"
      - "play on startup"
      - "play option"
      - "cache info"
      - "dynamic range"
      - "slate clips"
      - "slate project"
      - "slate lens"
      - "nas list"
      - "nas selected"
      - "external drive list"
      - "external drive selected"
  updates:
    - header: "^500 connection info:$"
      fields:
        protocol version: device.protocol_version
        model: device.model
    - header: "^204 device info:$"
      fields:
        protocol version: device.protocol_version
        model: device.model
        unique id: device.unique_id
        slot count: device.slot_count
        software version: device.software_version
        name: device.name
    - header: "^[25]08 transport info:$"
      fields:
        status: transport.status
        speed: transport.speed
        slot id: transport.slot
        slot name: transport.slot_name
        device name: transport.device_name
        clip id: transport.clip
        single clip: { path: transport.single_clip, map: { "true": true, "false": false } }
        display timecode: transport.display_timecode
        timecode: transport.timecode
        video format: transport.video_format
        loop: { path: transport.loop, map: { "true": true, "false": false } }
        timeline: transport.timeline
        input video format: transport.input_video_format
        dynamic range: transport.dynamic_range
        reference locked: { path: transport.reference_locked, map: { "true": true, "false": false } }
    # Display timecode, timeline position and dropped frames notifications.
    - header: "^5[0-9][0-9] [^:]*:$"
      fields:
        display timecode: transport.display_timecode
        timeline position: transport.timeline_position
        dropped frames: transport.dropped_frames

    # ── Slots, each by its slot id (202 replies and 502 pushes) ──────────
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^slot name: (.*?)$"
      state: { "slots.{1}.name": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^device name: (.*?)$"
      state: { "slots.{1}.device_name": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^status: (.*?)$"
      state: { "slots.{1}.status": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^volume name: (.*?)$"
      state: { "slots.{1}.volume_name": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^recording time: (\\d+)$"
      state: { "slots.{1}.recording_time": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^video format: (.*?)$"
      state: { "slots.{1}.video_format": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^blocked: (true|false)$"
      state: { "slots.{1}.blocked": { value: "{2}", map: { "true": true, "false": false } } }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^remaining size: (\\d+)$"
      state: { "slots.{1}.remaining_size": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^total size: (\\d+)$"
      state: { "slots.{1}.total_size": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^url: (.*?)$"
      state: { "slots.{1}.url": "{2}" }

    - header: "^[25]10 remote info:$"
      fields:
        enabled: { path: remote.enabled, map: { "true": true, "false": false } }
        override: { path: remote.override, map: { "true": true, "false": false } }
    - header: "^[25]11 configuration:$"
      fields:
        audio input: configuration.audio_input
        audio mapping: configuration.audio_mapping
        video input: configuration.video_input
        file format: configuration.file_format
        audio codec: configuration.audio_codec
        timecode input: configuration.timecode_input
        timecode output: configuration.timecode_output
        timecode preference: configuration.timecode_preference
        timecode preset: configuration.timecode_preset
        audio input channels: configuration.audio_input_channels
        record trigger: configuration.record_trigger
        record prefix: configuration.record_prefix
        record cache: { path: configuration.record_cache, map: { "true": true, "false": false } }
        append timestamp: { path: configuration.append_timestamp, map: { "true": true, "false": false } }
        reference source: configuration.reference_source
        genlock input resync: { path: configuration.genlock_input_resync, map: { "true": true, "false": false } }
        usb spill: { path: configuration.usb_spill, map: { "true": true, "false": false } }
        default standard: configuration.default_standard
        xlr mapping: configuration.xlr_mapping
        rca mapping: configuration.rca_mapping
        xlr input id: configuration.xlr_input_id
        xlr type: configuration.xlr_type
    - header: "^209 notify:$"
      fields:
        transport: { path: notify.transport, map: { "true": true, "false": false } }
        slot: { path: notify.slot, map: { "true": true, "false": false } }
        remote: { path: notify.remote, map: { "true": true, "false": false } }
        configuration: { path: notify.configuration, map: { "true": true, "false": false } }
        dropped frames: { path: notify.dropped_frames, map: { "true": true, "false": false } }
        display timecode: { path: notify.display_timecode, map: { "true": true, "false": false } }
        timeline position: { path: notify.timeline_position, map: { "true": true, "false": false } }
        playrange: { path: notify.playrange, map: { "true": true, "false": false } }
        cache: { path: notify.cache, map: { "true": true, "false": false } }
        dynamic range: { path: notify.dynamic_range, map: { "true": true, "false": false } }
        slate: { path: notify.slate, map: { "true": true, "false": false } }
        clips: { path: notify.clips, map: { "true": true, "false": false } }
        disk: { path: notify.disk, map: { "true": true, "false": false } }
        device info: { path: notify.device_info, map: { "true": true, "false": false } }
        nas: { path: notify.nas, map: { "true": true, "false": false } }

    # ── Timeline clips (205 clips info) ───────────────────────────────────
    # A whole-timeline "clips get" replaces the list; a get of one clip or a
    # run of clips only updates those. Version 1 lines are id: name start
    # duration; versions 2 and 3 id: start duration in out name (p.8, p.19).
    - header: "^214 clips count:$"
      fields:
        clip count: timeline.clip_count
    - match: "(?m)\\A205 clips info:$(?s:.*?)^clip count: (\\d+)$"
      request_match: "^clips get(?:: version: [123])?$"
      replace: timeline.clips
      state: { timeline.clip_count: "{1}" }
    - header: "^205 clips info:$"
      fields:
        clip count: timeline.clip_count
    - header: "^205 clips info:$"
      each_line: "^(\\d+): (.+) ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}) ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2})$"
      state:
        "timeline.clips.{1}.name": "{2}"
        "timeline.clips.{1}.start_timecode": "{3}"
        "timeline.clips.{1}.duration": "{4}"
    - header: "^205 clips info:$"
      each_line: "^(\\d+): ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}) ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}) ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}) ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}) (.+)$"
      state:
        "timeline.clips.{1}.start_timecode": "{2}"
        "timeline.clips.{1}.duration": "{3}"
        "timeline.clips.{1}.in_timecode": "{4}"
        "timeline.clips.{1}.out_timecode": "{5}"
        "timeline.clips.{1}.name": "{6}"
    # An empty timeline answers 107 timeline empty.
    - match: "^107 "
      request_match: "^clips get(?:: version: [123])?$"
      replace: timeline.clips
      state: { timeline.clip_count: "0" }
    # A timeline clips notification (519, an addition or a snapshot) has the
    # whole timeline read again.
    - match: "^519 "
      then_send: ["clips get"]

    # ── Playrange, play on startup, play option (219, 218, 220) ──────────
    # Reply codes as Sofie's hyperdeck-connection gives them; a playrange
    # report replaces the last, so a cleared range leaves state.
    - header: "^(?:219|515) [^:]*:$"
      replace: playrange
      fields:
        timeline in: playrange.timeline_in
        timeline out: playrange.timeline_out
    - header: "^218 [^:]*:$"
      fields:
        enable: { path: play_on_startup.enabled, map: { "true": true, "false": false } }
        single clip: { path: play_on_startup.single_clip, map: { "true": true, "false": false } }
    - header: "^220 [^:]*:$"
      fields:
        stop mode: play_option.stop_mode

    # ── Cache, dynamic range, slate ───────────────────────────────────────
    - header: "^(?:221 [^:]*|5[0-9][0-9] cache info):$"
      fields:
        status: cache.status
        transferring slot id: cache.transferring_slot
        recording time: cache.recording_time
    # Dynamic range and slate field names belong to no other documented
    # report, so any report holding them (2xx after 201, or 5xx) is read.
    - header: "^(?:20[2-9]|2[1-9][0-9]|5[0-9][0-9]) [^:]*:$"
      fields:
        playback override: dynamic_range.playback_override
        record override: dynamic_range.record_override
        reel: slate.reel
        scene id: slate.scene_id
        shot type: slate.shot_type
        take: slate.take
        take scenario: slate.take_scenario
        take auto inc: { path: slate.take_auto_inc, map: { "true": true, "false": false } }
        good take: { path: slate.good_take, map: { "true": true, "false": false } }
        environment: slate.environment
        day night: slate.day_night
        project name: slate.project_name
        camera: slate.camera
        director: slate.director
        camera operator: slate.camera_operator
        lens type: slate.lens_type
        iris: slate.iris
        focal length: slate.focal_length
        distance: slate.distance
        filter: slate.filter

    # ── NAS and external drives, kept as the deck words them ──────────────
    - match: "(?s)\\A2[0-9][0-9] [^\\n]*\\n?(.*)$"
      request_match: "^nas list$"
      state: { nas.bookmarks: "{1}" }
    - match: "(?s)\\A2[0-9][0-9] [^\\n]*\\n?(.*)$"
      request_match: "^nas selected$"
      state: { nas.selected: "{1}" }
    - match: "(?s)\\A2[0-9][0-9] [^\\n]*\\n?(.*)$"
      request_match: "^external drive list$"
      state: { external_drives.available: "{1}" }
    - match: "(?s)\\A2[0-9][0-9] [^\\n]*\\n?(.*)$"
      request_match: "^external drive selected$"
      state: { external_drives.selected: "{1}" }

    # ── Re-reads after this integration's own changes ─────────────────────
    # Settings the deck sends no documented notification for, or not on every
    # protocol version, are read again once the deck accepts a change.
    - match: "^200 ok$"
      request_match: "^playrange (?:set|clear)"
      then_send: ["playrange"]
    - match: "^200 ok$"
      request_match: "^play on startup: "
      then_send: ["play on startup"]
    - match: "^200 ok$"
      request_match: "^play option: "
      then_send: ["play option"]
    - match: "^200 ok$"
      request_match: "^dynamic range: "
      then_send: ["dynamic range"]
    - match: "^200 ok$"
      request_match: "^slate (clips|project|lens):"
      then_send: ["slate {1}"]
    - match: "^200 ok$"
      request_match: "^nas (?:add|remove|select|deselect)"
      then_send: ["nas list", "nas selected"]
    - match: "^200 ok$"
      request_match: "^external drive select: "
      then_send: ["external drive selected"]
    - match: "^200 ok$"
      request_match: "^configuration: record cache: "
      then_send: ["cache info"]
    # A notify switch the deck accepted (200 ok) is as the request set it;
    # the subscriptions on connecting set them too.
    - match: "^200 ok$"
      request_match: "^notify: transport: (true|false)$"
      state: { notify.transport: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: slot: (true|false)$"
      state: { notify.slot: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: remote: (true|false)$"
      state: { notify.remote: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: configuration: (true|false)$"
      state: { notify.configuration: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: dropped frames: (true|false)$"
      state: { notify.dropped_frames: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: display timecode: (true|false)$"
      state: { notify.display_timecode: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: timeline position: (true|false)$"
      state: { notify.timeline_position: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: playrange: (true|false)$"
      state: { notify.playrange: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: cache: (true|false)$"
      state: { notify.cache: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: dynamic range: (true|false)$"
      state: { notify.dynamic_range: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: slate: (true|false)$"
      state: { notify.slate: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: clips: (true|false)$"
      state: { notify.clips: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: disk: (true|false)$"
      state: { notify.disk: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: device info: (true|false)$"
      state: { notify.device_info: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: nas: (true|false)$"
      state: { notify.nas: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^(?:clips (?:add|remove|clear|rebuild)|slot select)"
      then_send: ["clips get"]

state:
  device.protocol_version:   { type: string, description: "Protocol version, from 500 connection info and 204 device info" }
  device.model:              { type: string, description: "Model name" }
  device.unique_id:          { type: string, description: "Unique alphanumeric identifier" }
  device.slot_count:         { type: int, description: "Number of storage slots" }
  device.software_version:   { type: string, description: "Software version" }
  device.name:               { type: string, description: "Device name" }
  transport.status:          { type: string, description: "preview, stopped, play, forward, rewind, jog, shuttle or record" }
  transport.speed:           { type: int, unit: "%", description: "Play speed, -5000 to 5000" }
  transport.slot:            { type: int, description: "Active slot; left unchanged when the deck reports none" }
  transport.slot_name:       { type: string, description: "Name of the active slot" }
  transport.device_name:     { type: string, description: "Identifying name of the active disk device" }
  transport.clip:            { type: int, description: "Current clip; left unchanged when the deck reports none" }
  transport.single_clip:     { type: bool, description: "Single-clip playback" }
  transport.loop:            { type: bool, description: "Loop playback" }
  transport.timecode:        { type: string, description: "Timecode within the timeline in playback, or the clip in record" }
  transport.display_timecode: { type: string, description: "Timecode on the front panel, from transport info and the display timecode notification" }
  transport.timeline_position: { type: int, unit: frames, description: "Playback position in the timeline, from the timeline position notification" }
  transport.dropped_frames:  { type: int, unit: frames, description: "Dropped frames, from the dropped frames notification (approximate, p.5)" }
  transport.video_format:    { type: string, description: "Video format, such as 1080p30" }
  transport.timeline:        { type: int, description: "Timeline value the deck reports (undefined in the document)" }
  transport.input_video_format: { type: string, description: "Video format at the input" }
  transport.dynamic_range:   { type: string, description: "off, Rec709, Rec2020_SDR, HLG, ST2084_300 to ST2084_4000, ST2048 or none" }
  transport.reference_locked: { type: bool, description: "Locked to the reference signal" }
  slots.*.name:              { type: string, description: "Slot name, keyed by slot id" }
  slots.*.device_name:       { type: string, description: "Identifying name of the disk device in the slot" }
  slots.*.status:            { type: string, description: "empty, mounting, error or mounted" }
  slots.*.volume_name:       { type: string, description: "Volume name" }
  slots.*.recording_time:    { type: int, unit: s, description: "Recording time available" }
  slots.*.video_format:      { type: string, description: "The disk's default video format" }
  slots.*.blocked:           { type: bool, description: "Slot blocked (unblock_slot clears it)" }
  slots.*.remaining_size:    { type: int, unit: bytes, description: "Remaining space" }
  slots.*.total_size:        { type: int, unit: bytes, description: "Total space" }
  slots.*.url:               { type: string, description: "URL of the NAS share mounted in the network slot" }
  remote.enabled:            { type: bool, description: "Remote control enabled" }
