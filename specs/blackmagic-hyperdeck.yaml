quirks:
  - models: [all]
    severity: warning
    text: >
      Responses begin with a numeric code. 200-299 is success, 100-199 is
      failure. A success code may be followed by a multi-line payload, as with
      "205 clips info:".

  - models: [all]
    severity: warning
    text: >
      Play and shuttle speed limits differ by generation: +/-1600 percent on
      protocol 1.8 decks, +/-5000 on 1.11 and the current decks. The commands
      accept +/-5000; a 1.8 deck answers a value beyond its range with an
      error such as 109 out of range.

  - models: [all]
    severity: info
    text: >
      Asynchronous 5xx messages can arrive at any time, starting with "500
      connection info:" on connect. They are not replies to the pending command
      and are skipped when matching a response. Only 500, 502, 508, 510, 511
      and 519 are documented with their codes; the dropped frames, display
      timecode, timeline position, playrange, cache, dynamic range, slate,
      device info and nas notifications are documented by their notify switch
      only. They are read by field name (display timecode, timeline position,
      dropped frames, the playrange's timeline in and out, the dynamic range
      overrides, the slate fields), so any 5xx code carrying them is taken.
      The reply codes of playrange (219), play on startup (218), play option
      (220), cache info (221) and dynamic range (222), and the playrange push
      (515), come from Sofie's hyperdeck-connection, not the document. Device
      info and disk notifications are not subscribed: their content is
      undocumented.

  - models: [all]
    severity: info
    text: >
      A slot info report (202 or 502) describes one slot, named by its slot id
      field; state keeps each slot under its id. Slots 1 to 4 are asked for on
      connecting, then slot notifications keep them current.

  - models: [all]
    severity: info
    text: >
      Settings without a documented notification on every protocol version
      (play on startup, play option, playrange, dynamic range, slate, NAS,
      external drive, record cache, the timeline after clip and slot changes)
      are read again as soon as the deck answers 200 ok to a
      change this integration makes; a change made elsewhere shows only on
      the next connection unless the deck notifies it. The nas list, nas
      selected and external drive replies are undocumented and kept as the
      reply's text. Each slot's disk clip list (slots.<id>.clips) is read on
      connecting, when the deck notifies a disk change (520, the active
      disk's list) or a slot change (502, that slot's), and from any disk
      list reply; a list read again replaces the last, so a removed clip
      leaves state. A clip list is keyed by the index the deck gives, which
      changes as clips are added or removed.

  - models: [all]
    severity: info
    text: >
      The deck reports "none" for slot id and clip id when there is none. A
      numeric state cannot hold "none", so transport.slot and transport.clip
      keep their previous value until a number is reported.

  - models: [all]
    severity: info
    text: >
      A relative goto past the first or last clip clamps to that clip rather
      than failing. The document says only one parameter is allowed per goto,
      yet documents the goto clip id with clip, timeline and timecode
      combinations; those are offered as documented. It also says the combined
      forms accept relative offsets without defining what they are relative
      to, so only the absolute forms are offered.

  - models: [all]
    severity: info
    text: >
      Sending "quit" before closing the socket makes the deck release the
      session immediately rather than waiting for a timeout.

  - models: [all]
    severity: warning
    text: >
      Code 111, remote control disabled, means the deck is in local mode. No
      command that changes the deck's state succeeds until remote is enabled
      on the front panel, by set_remote_enabled, or for this connection only by
      set_remote_override.

  - models: [all]
    severity: warning
    text: >
      Only a limited number of clients may connect at a time; one more is
      answered "120 connection failed" and disconnected.

  - models: [all]
    severity: warning
    text: >
      Changing the file format may reset the deck. It then answers "213 deck
      rebooting" instead of "200 ok" and closes the connection.

  - models: [all]
    severity: critical
    text: >
      Formatting is two steps. format_prepare_slot, format_prepare_current or
      format_prepare_device returns a token, and format_confirm with that token
      erases the disk. Confirming without a prepared operation answers 162
      format not prepared; a wrong token answers 161 invalid token. The reply
      shape carrying the token is not documented, so it is returned as text.

  - models: [all]
    severity: warning
    text: >
      After set_watchdog with a non-zero period the deck closes the connection
      if the client sends nothing for that period, so a period shorter than the
      client's own traffic interval drops the session.

  - models: [all]
    severity: info
    text: >
      Slate, nas add, nas remove and nas select are multiline-only: the command
      name and colon on one line, one parameter per line, then a blank line.
      The single-line form answers 163. The table prints "slate clips" without
      the colon the multiline syntax requires; the colon is sent. Each slate
      command here sets one field, leaving the others unchanged.

  - models: [all]
    severity: warning
    text: >
      When the username setting is filled in, the multiline "authenticate:"
      command is sent first on connecting and its reply awaited before any
      other command; "121 authentication failed" is a terminal refusal of the
      credential, and "122 authentication required" answers commands sent
      without it. The document recommends the protocol's secure mode for
      passwords but does not say how secure mode is reached, so on port 9993
      this credential, like NAS credentials, travels in plain text.

  - models: [all]
    severity: info
    text: >
      Parameter values end at the next "name:" pair, so a clip name, device or
      record prefix is placed last in its command. Names support UTF-8.

  - models: [all]
    severity: info
    text: >
      Video formats, file formats, video inputs and audio inputs vary by model
      and software release (p.21-23). The parameter lists hold every value the
      document names; a deck answers one it lacks with an error. H.265 and
      DNxHR file formats are documented for Studio 4K Pro and Extreme HDR;
      clips get version 3 for models with recursive timelines, which are not
      named. XLR and RCA settings have no effect on decks without them.

  - models: [all]
    severity: info
    text: >
      The document spells the last dynamic range value "ST2084" in the
      playback override list and "ST2048" in the record override list and in
      transport info. Each command offers the value as its own list prints it.

  - models: [hyperdeck-1-8, hyperdeck-1-11]
    severity: info
    text: >
      The earlier manual gives no per-version command marking beyond the speed
      limits. These models keep the command lists this spec has always given
      them; the other documented commands may work but are not offered without
      a source.

  # ── Configuration API (admin endpoint) ────────────────────────────────
  - models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: warning
    text: >
      Blackmagic does not document the configuration API (/admin/api/v1 on
      the HTTP port); its REST API document covers /control/api/v1 only. Its
      paths, bodies and replies are hyperdeckwire's (MIT), measured on two
      HyperDeck Studio HD Mini units on software 9.0.2; hyperdeckwire says
      the other Studio models, Extreme and Shuttle serve the same API, but
      only the HD Mini was measured, and it reports port 80 closed on the HD
      Mini's software 8.1.1. A deck without the API answers its polls with
      errors, which are logged, and its admin state stays absent. Decks on
      protocol 1.8 and 1.11 are not offered it.

  - models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: critical
    text: >
      The manual's "Allow Utility Administration" lets HyperDeck Setup reach
      the deck over the network or over USB only (p.47). hyperdeckwire
      reports, from software 9.0.2, that while network administration is off
      ("Configure via USB and Ethernet" in HyperDeck Setup) the deck still
      answers every GET but refuses every PUT with HTTP 401, including one
      that would turn it on: admin.remote_admin.enabled reads it, and only
      HyperDeck Setup over USB changes it. That is an API limit, so no
      command writes it. The manual also says HyperDeck Setup shows the
      network access settings over USB or Ethernet but disables them when
      only Ethernet is connected (p.53). Whether POST and DELETE are refused
      the same way was not measured; a refused write fails with the HTTP
      status as its code.

  - models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: critical
    text: >
      set_ethernet_protocol Disabled closes TCP 9993: this connection drops,
      reconnecting fails and the device reports disconnected, while commands
      on the configuration API still go, so set_ethernet_protocol Enabled
      turns the protocol back on. The admin polls run only while the
      protocol is connected, so admin state is not read meanwhile.
      SecureOnly requires the secure login (the username and password
      settings, sent with authenticate on connecting).

  - models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: critical
    text: >
      set_network_interface and its one-DNS and no-DNS forms write the
      interface whole (the API takes the whole object, so every field is
      given; read admin.network.interfaces first to keep what should not
      change). The deck applies it at once and takes about a second to run
      on it. A changed address or a switch to DHCP moves the deck: this
      connection drops, and the read-back sent after the write goes to the
      old address and fails, so the device is opened again at its new
      address. A wrong address or gateway leaves the deck unreachable until
      someone reaches it over USB or its front panel.

  - models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: critical
    text: >
      set_network_access sets FTP and the web media manager (HTTP) together,
      as the API takes the whole list. The configuration API is served on
      the same HTTP port; hyperdeckwire did not test what Disabled for HTTP
      does to it, so turning it off may cut off this API too, leaving only
      USB. SecureOnly for HTTP serves HTTPS with the deck's certificate,
      where admin_scheme https and admin_port 443 may be needed. The deck
      may answer that the change applies only after a reboot
      (admin.network_access.reboot_required); until then the read-back shows
      the old states.

  - models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: critical
    text: >
      admin_reboot reboots the deck at once, stopping playback and
      recording, and the protocol connection drops and reconnects. The API
      hands out a key on GET /reboot that the PUT must return, so the key is
      read with get_reboot_key just before; hyperdeckwire calls it one-time,
      which was not measured. The protocol's own reboot command (p.24) does
      the same over TCP 9993.

  - models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: warning
    text: >
      set_device_name also changes the host name the deck derives from it
      (mDNS, and the FTP and web media manager URLs); hyperdeckwire notes
      that this invalidates a certificate issued for the old host name. The
      name is the one device info reports on TCP 9993.

  - models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: warning
    text: >
      hyperdeckwire exercised on hardware only the reads and same-value
      writes of the name, network interface, network access, Ethernet
      Protocol, NTP, time zone and identify. The language, date and time,
      certificate (self-signed, import, removal, signing request), user and
      reboot writes follow its client code without a measured answer; the
      signing request's answer, and the id it gives for download, are not
      known, so create_signing_request returns the answer whole. Write
      statuses were not recorded, so 200 and 204 (and 201 for a creation)
      are taken as success; a 2xx answer whose body says "success": false is
      not seen as a failure, but the read-back then shows the deck unchanged.

  - models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: info
    text: >
      The configuration API takes no credential on a deck as it ships
      (hyperdeckwire: unauthenticated on the LAN, as TCP 9993 and FTP are).
      With admin.auth.admin_required true the deck wants an administrator
      login, and how the API takes one is not known: nothing is sent. User
      passwords (create_user, set_user_password) are secret parameters,
      never logged, and travel in the request body: in plain text unless
      admin_scheme is https. A user's shared folder permissions are read as
      JSON text; their shape is not known (a fresh deck lists none), so no
      command writes them.

  - models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: info
    text: >
      Nothing on the configuration API is pushed. It is read on connecting
      (capabilities, languages, access options once; the rest once a minute)
      and after each write, whose read-back is part of the command. Only
      interface 0 is polled; get_network_interface reads another into state.
      The clock (admin.date_time.time) is in Unix seconds, sent and received
      as a string; with NTP on the deck sets its clock itself. The identify
      the configuration API starts is not readable, and the protocol's
      set_identify (p.24) does the same over TCP 9993.

  - models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: info
    text: >
      A certificate is passed as PEM text, as the API takes it in a JSON
      body ({"certificate": ...}); no file on the host is read. The signing
      request comes back as text from download_signing_request.

  - models: [hyperdeck-1-11, hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: critical
    text: >
      upload_file with overwrite, and rename_file with overwrite, replace a
      file of that name on the deck's media, and delete_file removes one;
      none can be undone, and a clip replaced or removed while it plays or
      is cued may stop playback (not measured). Without overwrite, SIZE is
      asked first and an existing file fails the command before anything
      is sent; a deck whose server does not answer SIZE fails it too. A
      canceled or failed upload leaves the part sent on the deck under the
      new name (delete_file removes it); an upload replacing a file has
      then already lost the old one. The manuals say files can be
      transferred while the deck records, which slows transfers so
      recording is not affected; what the deck does to a file deleted or
      replaced while it is being recorded is not documented.

  - models: [hyperdeck-1-11, hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: info
    text: >
      Files move over the deck's FTP server (port 21), which every deck the
      manuals describe since the Studio Mini offers, logged in anonymously
      unless ftp_username is set; the earlier Studio models with SSD slots
      have none. FTP access is switched in HyperDeck Setup
      (set_network_access); while it is off, every FTP command fails to
      connect. The top folders are the media by slot, named as the deck
      chooses: sd1, sd2, ssd1, ssd2 (Studio), cfast1, cfast2 (Extreme),
      sd1 (Shuttle) with USB drives under usb, or slot numbers 1, 2, 3
      (hyperdeckwire, HD Mini on software 8.1.1); list_files with no path
      shows them, and the root itself refuses files (hyperdeckwire: 550).
      Any file can be stored, but only files in the deck's codecs and
      formats play; a clip stored is listed by disk list at once
      (hyperdeckwire).

  - models: [hyperdeck-1-11, hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: info
    text: >
      download_file and upload_file run in the background, one at a time in
      the order asked, on an FTP connection of their own; each command
      answers at once with {transfer, ahead}: the transfer's number and how
      many are before it. transfers.<number> then follows it (queued,
      connecting, transferring, writing, then done, failed or canceled),
      with bytes, size and progress, and message events mark its ends:
      transfer_started {transfer, kind, remote, path} and transfer_finished
      with status, error and bytes too. The last 32 finished transfers stay
      in the state. list_files, delete_file, rename_file and create_folder
      answer when done, one at a time, on another connection, so they run
      while a transfer does. A download is checked against the deck's SIZE
      answer; one cut off fails and leaves the part received in the host
      file. Every connection logs in, works and quits; a reply is waited
      for 15 s and a transfer may be silent 30 s before it fails.

  - models: [hyperdeck-1-11, hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: warning
    text: >
      The manuals name no FTP command, listing format or passive port range;
      what this extension sends follows the FTP standards and the clients
      the manuals recommend (Cyberduck, FileZilla, Transmit). A listing is
      asked for with MLSD, then LIST where the deck answers MLSD as not
      understood; LIST is read in the Unix and DOS forms, and lines in
      neither come back as unparsed. Data connections are passive (PASV,
      falling back to EPSV, EPSV only over IPv6) and always go to the
      deck's own address, whatever address its PASV reply names. Whether the
      deck takes two FTP sessions at once (a transfer and a listing), SIZE,
      DELE, RNFR and RNTO, MKD and ABOR has not been measured.

  - models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle]
    severity: info
    text: >
      FTP travels in plain text, the anonymous login included. SecureOnly
      for FTP (set_network_access), where a deck offers it (the HD Mini does
      not), is not reached: no FTP over TLS is spoken, and how the deck
      offers it (explicit AUTH TLS or implicit TLS) is not documented.
