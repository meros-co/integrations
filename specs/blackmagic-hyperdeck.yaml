spec: 1
id: blackmagic-hyperdeck
name: Blackmagic HyperDeck
vendor: Blackmagic Design
category: recorder

source:
  - title: Blackmagic HyperDeck Ethernet Protocol (Developer Information, December 2024)
    url: https://documents.blackmagicdesign.com/DeveloperManuals/HyperDeckEthernetProtocol.pdf
    note: >
      Manufacturer-documented; covers HyperDeck Extreme, HyperDeck Shuttle and
      HyperDeck Studio. Command table p.2-9 (single-line commands p.2-8,
      connection protocol response versions p.8, multiline-only commands
      p.8-9), syntax and response codes p.10-11, 500 connection info p.11,
      remote state and 210/510 remote info p.12, help p.13, preview p.13,
      play, playrange, play on startup and play option p.14, goto and commands
      XML p.15, notify and 209 notify, 204 device info p.16, 202/502 slot info
      and external drives p.17, 206 disk list and 214 clips count p.18, 205
      clips info p.19, 208/508 transport info p.20, video and file formats by
      model p.21, 211/511 configuration and 213 deck rebooting p.22-23, slot
      select and clips clear p.23, clips add and watchdog p.24, NAS p.25
  - title: Blackmagic HyperDeck Installation and Operation Manual, Developer Information (earlier edition)
    url: https://www.manualslib.com/manual/1899983/Blackmagicdesign-Hyperdeck.html?page=66
    note: >
      Manufacturer manual, read through a third-party mirror because the
      earlier edition is no longer on Blackmagic's site. Source of the
      protocol-version split only: "HyperDeck Studio recorders with SSD slots
      use version 1.8. HyperDeck Studio Mini uses 1.11", and the play and
      shuttle speed limits of -1600 to 1600 and -5000 to 5000 (p.66-68)
  - title: sofie-hyperdeck-connection (MIT)
    url: https://github.com/Sofie-Automation/sofie-hyperdeck-connection
    note: >
      MIT licence (top-level LICENSE). Read, not copied, as corroboration of
      what the document leaves out: the reply codes 218 to 222 (play on
      startup, playrange, play option, cache info, dynamic range) and their
      field names, and the 513 display timecode, 514 timeline position and
      515 playrange notifications with their fields (src/codes.ts,
      src/asyncHandlers, src/commands)

transport:
  type: line-tcp
  port: 9993
  framing: terminated
  terminator: crlf
  encoding: utf-8
  timeout_ms: 2000
  reply: expected
  reply_framing: headed-block
  reply_match: "^[12][0-9][0-9] "
  probe: "ping"

settings:
  # Only for decks set up for secure access; left empty, nothing is sent.
  username: { type: string, max_length: 255, label: Username, description: "User name for a deck set up for secure access, case sensitive; leave empty when the deck has none." }
  password: { type: string, max_length: 255, secret: true, default: "", label: Password, description: "Password for a deck set up for secure access, case sensitive." }

on_connect:
  # Multiline-only "authenticate:" (p.8): username and password, each case
  # sensitive, then a blank line. A wrong credential answers "121
  # authentication failed" (p.11), which is terminal.
  - when_set: username
    send: "authenticate:\r\nusername: {settings.username}\r\npassword: {settings.password}\r\n"
    await_reply: true
    refused: "^121 "

ports:
  - { port: 9993, protocol: tcp, role: control }
  - { port: 5353, protocol: udp, role: discovery, note: "mDNS / DNS-SD (Bonjour)" }

models:
  - id: hyperdeck-1-8
    name: HyperDeck Studio with SSD slots (protocol 1.8)
    supports:
      [record, record_named, record_spill, record_spill_to_slot, stop, play,
       goto_clip, goto_clip_offset, get_transport_info, get_device_info,
       get_clip_count, get_clips, get_configuration, disk_list, disk_list_slot,
       preview_enable, preview_disable]
    verification: none
    notes: >
      Earlier-generation decks. Play and shuttle speed range is -1600 to 1600
      percent. The command list is the set this spec has always offered for
      protocol 1.8; the earlier manual does not mark which later commands each
      protocol version lacks, so nothing has been added here without a source.
  - id: hyperdeck-1-11
    name: HyperDeck Studio Mini (protocol 1.11)
    supports:
      [record, record_named, record_spill, record_spill_to_slot, stop, play,
       goto_clip, goto_clip_offset, get_transport_info, get_device_info,
       get_clip_count, get_clips, get_configuration, disk_list, disk_list_slot,
       preview_enable, preview_disable, get_playrange, set_playrange_clip,
       set_playrange_clips, set_playrange_timecode, set_playrange_frames,
       clear_playrange, set_playback_stop_mode]
    verification: none
    notes: >
      Earlier-generation decks. Play speed range is -5000 to 5000 percent.
      The command list is the set this spec has always offered for protocol
      1.11, kept unchanged for the same reason as protocol 1.8.
