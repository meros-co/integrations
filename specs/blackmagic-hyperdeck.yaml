spec: 1
id: blackmagic-hyperdeck
name: Blackmagic HyperDeck
vendor: Blackmagic Design
category: recorder

source:
  - title: Blackmagic HyperDeck Ethernet Protocol (Developer Information, December 2024)
    url: https://documents.blackmagicdesign.com/DeveloperManuals/HyperDeckEthernetProtocol.pdf
    note: >
      Manufacturer-documented; covers HyperDeck Extreme, HyperDeck Shuttle and
      HyperDeck Studio. Command table p.2-9 (single-line commands p.2-8,
      connection protocol response versions p.8, multiline-only commands
      p.8-9), syntax and response codes p.10-11, 500 connection info p.11,
      remote state and 210/510 remote info p.12, help p.13, preview p.13,
      play, playrange, play on startup and play option p.14, goto and commands
      XML p.15, notify and 209 notify, 204 device info p.16, 202/502 slot info
      and external drives p.17, 206 disk list and 214 clips count p.18, 205
      clips info p.19, 208/508 transport info p.20, video and file formats by
      model p.21, 211/511 configuration and 213 deck rebooting p.22-23, slot
      select and clips clear p.23, clips add and watchdog p.24, NAS p.25
  - title: Blackmagic HyperDeck Installation and Operation Manual, Developer Information (earlier edition)
    url: https://www.manualslib.com/manual/1899983/Blackmagicdesign-Hyperdeck.html?page=66
    note: >
      Manufacturer manual, read through a third-party mirror because the
      earlier edition is no longer on Blackmagic's site. Source of the
      protocol-version split only: "HyperDeck Studio recorders with SSD slots
      use version 1.8. HyperDeck Studio Mini uses 1.11", and the play and
      shuttle speed limits of -1600 to 1600 and -5000 to 5000 (p.66-68)
  - title: sofie-hyperdeck-connection (MIT)
    url: https://github.com/Sofie-Automation/sofie-hyperdeck-connection
    note: >
      MIT licence (top-level LICENSE). Read, not copied, as corroboration of
      what the document leaves out: the reply codes 218 to 222 (play on
      startup, playrange, play option, cache info, dynamic range) and their
      field names, and the 513 display timecode, 514 timeline position and
      515 playrange notifications with their fields (src/codes.ts,
      src/asyncHandlers, src/commands)
  - title: Blackmagic HyperDeck Operation Manual (HyperDeck Studio HD Mini, HD Plus, HD Pro, 4K Pro), 20 February 2026
    url: https://documents.blackmagicdesign.com/UserManuals/HyperDeckHDManual.pdf
    note: >
      Manufacturer manual. What each configuration setting is and does, not
      its API: "Blackmagic HyperDeck Setup" chapter (p.45-50: name, identify,
      date and time with NTP and time zone, DHCP or static network, network
      access for FTP, the web media manager and the Ethernet Protocol, allow
      utility administration over the network or USB only, secure login
      settings, the secure certificate: self-signed, signing request with
      common name, subject alternative name, country, state, location and
      organization, and import), the Settings chapter's date and time (p.24:
      time.cloudflare.com the default NTP server) and "Transferring Files
      over a Network" (p.52-55: FTP on every model it covers, any file both
      ways, only the deck's codecs play, transfers while recording slowed so
      recording is not affected, anonymous login, SD cards and SSDs as top
      folders by slot, USB drives under a usb folder; the web media manager
      names the slots sd1, sd2, ssd1, ssd2 and USB/)
  - title: Blackmagic HyperDeck Extreme Installation and Operation Manual, August 2025
    url: https://documents.blackmagicdesign.com/UserManuals/HyperDeckExtremeManual.pdf
    note: >
      Manufacturer manual. "Transferring Files over a Network" (p.92-95):
      FTP as on the Studio models, anonymous login, CFast cards as top
      folders cfast1 and cfast2, USB drives under a usb folder, the optional
      M.2 SSD as Internal in the web media manager, transfers while
      recording
  - title: Blackmagic HyperDeck Shuttle Installation and Operation Manual, September 2025
    url: https://documents.blackmagicdesign.com/UserManuals/HyperDeckShuttleHDManual.pdf
    note: >
      Manufacturer manual. "Transferring Files over a Network" (p.105-108):
      FTP as on the Studio models, anonymous login, the SD card as the top
      folder sd1, transfers while recording
  - title: Blackmagic HyperDeck Disk Recorders Installation and Operation Manual, March 2020
    url: https://documents.blackmagicdesign.com/UserManuals/HyperDeckManual.pdf
    note: >
      Manufacturer manual for the earlier decks. "Transferring Files over a
      Network" (p.35-36) offers FTP on HyperDeck Studio Mini only, with no
      user name or password (anonymous login), any file both ways and
      transfers while recording; no FTP is described for the earlier Studio
      models with SSD slots
  - title: REST API for HyperDeck (Developer Information, December 2024)
    url: https://documents.blackmagicdesign.com/DeveloperManuals/RESTAPIForHyperDeck.pdf
    note: >
      Manufacturer document for /control/api/v1 (transport, media, system).
      Read to establish that it does not cover the configuration API at
      /admin/api/v1: nothing here is taken from it
  - title: bmdwire, hyperdeckwire package (MIT), version 1.6.0
    url: https://github.com/lucas-romanenko/bmdwire/tree/main/hyperdeckwire
    note: >
      hyperdeckwire/LICENSE is MIT (the repository's LICENSE gives each
      package its own; only hyperdeckwire was read). Read, not copied, for
      the configuration API at /admin/api/v1, which Blackmagic does not
      document: every path, request body and reply shape (setup.py,
      docs/API.md "Configuration", and the replies in
      tests/test_hyperdeckwire_setup.py, which it says were taken from a
      HyperDeck Studio HD Mini on software 9.0.2), that reads answer while
      a write is refused with HTTP 401 when utility administration is USB
      only, and that the reboot takes a key from a GET first. Its README
      reports port 80 closed on the HD Mini's software 8.1.1. For FTP
      (upload.py, docs/API.md "FTP upload"): port 21, anonymous login (USER
      anonymous when a bare login is refused), top folders named by slot
      number (1, 2, 3) on the HD Mini on 8.1.1 and by medium (sd1, ssd1,
      usb) on other models, STOR at the root refused with 550, STOR in a
      slot folder taken, and a stored clip listed by disk list on 9993 at
      once; measured 47.6 MB/s on a 50 MB clip

transport:
  type: line-tcp
  port: 9993
  framing: terminated
  terminator: crlf
  encoding: utf-8
  timeout_ms: 2000
  reply: expected
  reply_framing: headed-block
  reply_match: "^[12][0-9][0-9] "
  probe: "ping"
  # The configuration API HyperDeck Setup drives, on the deck's HTTP port
  # (SPEC.md §2, Endpoints). It takes no credential (hyperdeckwire, measured
  # on software 9.0.2); over HTTPS the deck's certificate is usually its own
  # self-signed one.
  endpoints:
    admin:
      port: { setting: admin_port }
      scheme: { setting: admin_scheme }
      accept_invalid_certs: true

settings:
  # Only for decks set up for secure access; left empty, nothing is sent.
  username: { type: string, max_length: 255, label: Username, description: "User name for a deck set up for secure access, case sensitive; leave empty when the deck has none." }
  password: { type: string, max_length: 255, secret: true, default: "", label: Password, description: "Password for a deck set up for secure access, case sensitive." }
  admin_port: { type: int, min: 1, max: 65535, default: 80, label: Configuration API port, description: "The deck's HTTP port, where HyperDeck Setup's configuration API answers; 80 unless the deck serves it elsewhere." }
  admin_scheme: { type: enum, values: [http, https], default: http, label: Configuration API scheme, description: "http, or https for a deck that serves its configuration API encrypted (set the port to 443 with it)." }
  ftp_port: { type: int, min: 1, max: 65535, default: 21, label: FTP port, description: "The deck's FTP server port, where files move to and from its media; 21 on every deck." }
  # Empty logs in anonymously, as the manuals say to (USER anonymous).
  ftp_username: { type: string, max_length: 255, default: "", label: FTP user name, description: "User name for the deck's FTP server; leave empty to log in anonymously, as a deck as it ships expects." }
  ftp_password: { type: string, max_length: 255, secret: true, default: "", label: FTP password, description: "Password for the FTP user name; ignored for an anonymous login." }

# FTP file transfer (list, download, upload, delete, rename, folders), which
# the format cannot express: a control connection, passive data connections
# and transfers longer than a command's timeout (SPEC.md, Native extensions).
extension: hyperdeck-ftp

on_connect:
  # Multiline-only "authenticate:" (p.8): username and password, each case
  # sensitive, then a blank line. A wrong credential answers "121
  # authentication failed" (p.11), which is terminal.
  - when_set: username
    send: "authenticate:\r\nusername: {settings.username}\r\npassword: {settings.password}\r\n"
    await_reply: true
    refused: "^121 "

ports:
  - { port: 9993, protocol: tcp, role: control }
  - { port: 80, protocol: http, role: control, setting: admin_port, note: "configuration API (/admin/api/v1) on HyperDeck Studio, Extreme and Shuttle; 443 over https" }
  - { port: 5353, protocol: udp, role: discovery, note: "mDNS / DNS-SD (Bonjour)" }
  - { port: 21, protocol: tcp, role: control, setting: ftp_port, note: "FTP control connection, for files on the deck's media (hyperdeck-ftp extension)" }
  - { port: null, protocol: tcp, role: control, note: "FTP passive data connections, on the port the deck names in each PASV or EPSV reply" }

models:
  - id: hyperdeck-1-8
    name: HyperDeck Studio with SSD slots (protocol 1.8)
    supports:
      [record, record_named, record_spill, record_spill_to_slot, stop, play,
       goto_clip, goto_clip_offset, get_transport_info, get_device_info,
       get_clip_count, get_clips, get_configuration, disk_list, disk_list_slot,
       preview_enable, preview_disable]
    verification: none
    notes: >
      Earlier-generation decks. Play and shuttle speed range is -1600 to 1600
      percent. The command list is the set this spec has always offered for
      protocol 1.8; the earlier manual does not mark which later commands each
      protocol version lacks, so nothing has been added here without a source.
  - id: hyperdeck-1-11
    name: HyperDeck Studio Mini (protocol 1.11)
    supports:
      [record, record_named, record_spill, record_spill_to_slot, stop, play,
       goto_clip, goto_clip_offset, get_transport_info, get_device_info,
       get_clip_count, get_clips, get_configuration, disk_list, disk_list_slot,
       preview_enable, preview_disable, get_playrange, set_playrange_clip,
       set_playrange_clips, set_playrange_timecode, set_playrange_frames,
       clear_playrange, set_playback_stop_mode, list_files, download_file,
       upload_file, delete_file, rename_file, create_folder, cancel_transfer]
    verification: none
    notes: >
      Earlier-generation decks. Play speed range is -5000 to 5000 percent.
      The command list is the set this spec has always offered for protocol
      1.11, kept unchanged for the same reason as protocol 1.8.
