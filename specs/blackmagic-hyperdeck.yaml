  # ── Network storage ────────────────────────────────────────────────────
  list_nas:
    summary: Every NAS share bookmark
    send: "nas list"
    expect: { code_range: [200, 299] }
    returns: text

  list_nas_discovered:
    summary: NAS servers discovered over mDNS (225 nas host info)
    send: "nas discovered"
    expect: { code_range: [200, 299] }
    returns: text

  get_nas_selected:
    summary: The NAS share currently selected
    send: "nas selected"
    expect: { code_range: [200, 299] }
    returns: text

  deselect_nas:
    summary: Unmount the selected NAS share
    send: "nas deselect"
    expect: { code_range: [200, 299] }
    returns: ack

  add_nas:
    summary: Bookmark a NAS share with guest access
    params:
      url: { type: string, max_length: 1024, required: true, label: NAS URL, description: "The share's URL, such as smb://192.168.1.10/media." }
    send: "nas add:\r\nurl: {url}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  add_nas_with_credentials:
    summary: Bookmark a NAS share with a username and password, sent in plain text on this port
    params:
      url:      { type: string, max_length: 1024, required: true, label: NAS URL, description: "The share's URL, such as smb://192.168.1.10/media." }
      username: { type: string, max_length: 255, required: true, label: Username, description: "User name for the NAS share, sent in plain text." }
      password: { type: string, max_length: 255, required: true, label: Password, description: "Password for the NAS share, sent in plain text." }
    send: "nas add:\r\nurl: {url}\r\nusername: {username}\r\npassword: {password}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  remove_nas:
    summary: Remove a NAS share bookmark; does not unmount it
    params:
      url: { type: string, max_length: 1024, required: true, label: NAS URL, description: "The share's URL, such as smb://192.168.1.10/media." }
    send: "nas remove:\r\nurl: {url}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  select_nas:
    summary: Mount a NAS share asynchronously, with its bookmark's credentials or as guest
    params:
      url: { type: string, max_length: 1024, required: true, label: NAS URL, description: "The share's URL, such as smb://192.168.1.10/media." }
    send: "nas select:\r\nurl: {url}\r\n"
    expect: { code_range: [200, 299] }
    returns: ack

  # ── Configuration API (admin endpoint, HTTP) ───────────────────────────
  # What Blackmagic HyperDeck Setup shows for a networked deck (the manual's
  # "Blackmagic HyperDeck Setup" chapter) lives on a REST API at
  # /admin/api/v1 on the deck's HTTP port. Blackmagic does not document the
  # API itself; its paths, bodies and replies are hyperdeckwire's (MIT),
  # measured on two HyperDeck Studio HD Mini units on software 9.0.2. Every
  # reply wraps its value as {"response": ..., "success": true}. A write is
  # followed by a read of what it changed, so state holds what the deck
  # keeps; a write the deck refuses (HTTP 401 while utility administration
  # is limited to USB) fails with that status.
  get_admin_heartbeat:
    summary: Whether the configuration API answers (GET /admin/api/v1/heartBeat)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/heartBeat }
    expect: { status: 200, json_path: "$.success" }
    returns: value

  get_admin_capabilities:
    summary: The configuration API's sections and their versions (GET /admin/api/v1/capabilities)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/capabilities }
    expect: { status: 200, json_path: "$.response" }
    returns: value

  get_setup:
    summary: Product, name, host name, software, build, hardware and language (GET /admin/api/v1/setupBasic)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/setupBasic }
    expect: { status: 200, json_path: "$.response" }
    returns: value

  set_device_name:
    summary: Name the deck (the name 204 device info reports); the deck derives its host name from it
    params:
      name: { type: string, max_length: 64, required: true, label: Name, description: "The deck's name, as HyperDeck Setup and device info show it." }
    send:
      - { endpoint: admin, method: PUT, path: /admin/api/v1/setupBasic/name, body: '{"name":{name:json}}', content_type: application/json }
      - { endpoint: admin, method: GET, path: /admin/api/v1/setupBasic }
    expect: { status: [200, 204] }
    returns: ack

  get_languages:
    summary: The languages the deck offers, each a locale code and a name (GET /admin/api/v1/languages)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/languages }
    expect: { status: 200, json_path: "$.response.languages" }
    returns: value

  set_language:
    summary: Set the deck's language by locale code, one of those get_languages lists
    params:
      language: { type: string, max_length: 64, pattern: "^[A-Za-z0-9_.@-]+$", required: true, label: Language, description: "A locale code from the deck's language list, such as en_US.UTF-8." }
    send:
      - { endpoint: admin, method: PUT, path: /admin/api/v1/setupBasic/language, body: '{"language":{language:json}}', content_type: application/json }
      - { endpoint: admin, method: GET, path: /admin/api/v1/setupBasic }
    expect: { status: [200, 204] }
    returns: ack

  start_admin_identify:
    summary: Flash the deck's front panel over the configuration API, as HyperDeck Setup's identify does
    send: { endpoint: admin, method: PUT, path: /admin/api/v1/setupBasic/identify }
    expect: { status: [200, 204] }
    returns: ack

  stop_admin_identify:
    summary: Stop the front panel flashing that start_admin_identify started
    send: { endpoint: admin, method: DELETE, path: /admin/api/v1/setupBasic/identify }
    expect: { status: [200, 204] }
    returns: ack

  get_remote_admin:
    summary: Whether utility administration is allowed over the network as well as USB, and whether this request came over USB (GET /admin/api/v1/remoteAdmin)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/remoteAdmin }
    expect: { status: 200, json_path: "$.response" }
    returns: value

  get_network_interface:
    summary: A network interface's configured and running address, netmask, gateway and DNS, DHCP or static, link and speed
    params:
      interface: { type: int, min: 0, max: 7, default: 0, label: Interface, description: "Interface id, 0 for the deck's Ethernet port." }
    send: { endpoint: admin, method: GET, path: "/admin/api/v1/network/interface/{interface}" }
    expect: { status: 200, json_path: "$.response" }
    returns: value

  set_network_interface:
    summary: Set a network interface whole, with two DNS servers; the deck may move to another address at once
    params:
      interface: { type: int, min: 0, max: 7, default: 0, label: Interface, description: "Interface id, 0 for the deck's Ethernet port." }
      type: { type: enum, values: [DHCP, Static], required: true, label: Addressing, description: "DHCP takes an address from the network, Static uses the address below." }
      address: { type: string, max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: Address, description: "The static IPv4 address, kept for when the interface is static." }
      netmask: { type: string, max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: Netmask, description: "The static subnet mask, such as 255.255.255.0." }
      gateway: { type: string, max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: Gateway, description: "The static default gateway's IPv4 address." }
      dns_primary: { type: string, max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: Primary DNS, description: "The first DNS server's IPv4 address." }
      dns_secondary: { type: string, max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: Secondary DNS, description: "The second DNS server's IPv4 address." }
    send:
      endpoint: admin
      method: PUT
      path: "/admin/api/v1/network/interface/{interface}"
      body: '{"id":"{interface}","type":"{type}","address":{address:json},"netmask":{netmask:json},"gateway":{gateway:json},"dnsServers":[{dns_primary:json},{dns_secondary:json}]}'
      content_type: application/json
    expect: { status: [200, 204] }
    returns: ack

  set_network_interface_one_dns:
    summary: Set a network interface whole, with one DNS server; the deck may move to another address at once
    params:
      interface: { type: int, min: 0, max: 7, default: 0, label: Interface, description: "Interface id, 0 for the deck's Ethernet port." }
      type: { type: enum, values: [DHCP, Static], required: true, label: Addressing, description: "DHCP takes an address from the network, Static uses the address below." }
      address: { type: string, max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: Address, description: "The static IPv4 address, kept for when the interface is static." }
      netmask: { type: string, max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: Netmask, description: "The static subnet mask, such as 255.255.255.0." }
      gateway: { type: string, max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: Gateway, description: "The static default gateway's IPv4 address." }
      dns: { type: string, max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: DNS, description: "The DNS server's IPv4 address." }
    send:
      endpoint: admin
      method: PUT
      path: "/admin/api/v1/network/interface/{interface}"
      body: '{"id":"{interface}","type":"{type}","address":{address:json},"netmask":{netmask:json},"gateway":{gateway:json},"dnsServers":[{dns:json}]}'
      content_type: application/json
    expect: { status: [200, 204] }
    returns: ack

  set_network_interface_no_dns:
    summary: Set a network interface whole, with no DNS server; the deck may move to another address at once
    params:
      interface: { type: int, min: 0, max: 7, default: 0, label: Interface, description: "Interface id, 0 for the deck's Ethernet port." }
      type: { type: enum, values: [DHCP, Static], required: true, label: Addressing, description: "DHCP takes an address from the network, Static uses the address below." }
      address: { type: string, max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: Address, description: "The static IPv4 address, kept for when the interface is static." }
      netmask: { type: string, max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: Netmask, description: "The static subnet mask, such as 255.255.255.0." }
      gateway: { type: string, max_length: 15, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", required: true, label: Gateway, description: "The static default gateway's IPv4 address." }
    send:
      endpoint: admin
      method: PUT
      path: "/admin/api/v1/network/interface/{interface}"
      body: '{"id":"{interface}","type":"{type}","address":{address:json},"netmask":{netmask:json},"gateway":{gateway:json},"dnsServers":[]}'
      content_type: application/json
    expect: { status: [200, 204] }
    returns: ack

  get_network_access:
    summary: The FTP and web media manager (HTTP) access states and the URLs the deck gives for them (GET /admin/api/v1/networkAccess)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/networkAccess }
    expect: { status: 200, json_path: "$.response.protocols" }
    returns: value

  get_network_access_options:
    summary: Which access protocols offer a secure-only state, and which show a URL (GET /admin/api/v1/networkAccess/options)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/networkAccess/options }
    expect: { status: 200, json_path: "$.response.options" }
    returns: value

  set_network_access:
    summary: Set FTP and web media manager (HTTP) access together; the deck may answer that a reboot applies it
    params:
      ftp: { type: enum, values: [Disabled, Enabled, SecureOnly], required: true, label: FTP, description: "File transfer over FTP: off, on, or secure only where the deck offers it (it does not for FTP on the HD Mini)." }
      http: { type: enum, values: [Disabled, Enabled, SecureOnly], required: true, label: Web media manager, description: "The web media manager: off, on over HTTP, or HTTPS only with the deck's certificate." }
    send:
      - { endpoint: admin, method: PUT, path: /admin/api/v1/networkAccess, body: '{"protocols":[{"id":"FTP","state":"{ftp}"},{"id":"HTTP","state":"{http}"}]}', content_type: application/json }
      - { endpoint: admin, method: GET, path: /admin/api/v1/networkAccess }
    expect: { status: [200, 204] }
    returns: ack

  get_ethernet_protocol:
    summary: Whether the HyperDeck Ethernet Protocol (TCP 9993) is enabled (GET /admin/api/v1/hyperDeckEthernetProtocol)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/hyperDeckEthernetProtocol }
    expect: { status: 200, json_path: "$.response.state" }
    returns: value

  set_ethernet_protocol:
    summary: Turn the HyperDeck Ethernet Protocol (TCP 9993) on, off or secure only; off drops this connection's protocol port
    params:
      state: { type: enum, values: [Disabled, Enabled, SecureOnly], required: true, label: Ethernet Protocol, description: "Disabled closes TCP 9993, Enabled opens it, SecureOnly requires the secure login." }
    send:
      - { endpoint: admin, method: PUT, path: /admin/api/v1/hyperDeckEthernetProtocol, body: '{"state":"{state}"}', content_type: application/json }
      - { endpoint: admin, method: GET, path: /admin/api/v1/hyperDeckEthernetProtocol }
    expect: { status: [200, 204] }
    returns: ack

  get_certificate:
    summary: The deck's host name and, with a certificate installed, its domain, issuer and validity (GET /admin/api/v1/certificate/summary)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/certificate/summary }
    expect: { status: 200, json_path: "$.response" }
    returns: value

  create_self_signed_certificate:
    summary: Have the deck issue itself a certificate for its host name, replacing any installed
    send:
      - { endpoint: admin, method: PUT, path: /admin/api/v1/certificate/selfSigned }
      - { endpoint: admin, method: GET, path: /admin/api/v1/certificate/summary }
    expect: { status: [200, 204] }
    returns: ack

  install_certificate:
    summary: Import a signed certificate, the PEM text of the .cert, .crt or .pem file a certificate authority returned
    params:
      certificate: { type: string, multiline: true, max_length: 65536, required: true, label: Certificate, description: "The signed certificate as PEM text, from -----BEGIN CERTIFICATE----- to its end line." }
    send:
      - { endpoint: admin, method: POST, path: /admin/api/v1/certificate, body: '{"certificate":{certificate:json}}', content_type: application/json }
      - { endpoint: admin, method: GET, path: /admin/api/v1/certificate/summary }
    expect: { status: [200, 204] }
    returns: ack

  delete_certificate:
    summary: Remove the installed certificate; HTTPS access then has none
    send:
      - { endpoint: admin, method: DELETE, path: /admin/api/v1/certificate }
      - { endpoint: admin, method: GET, path: /admin/api/v1/certificate/summary }
    expect: { status: [200, 204] }
    returns: ack

  create_signing_request:
    summary: Have the deck generate a key pair and a certificate signing request; returns what the deck answers, which names the request to download
    params:
      common_name: { type: string, max_length: 255, required: true, label: Common name, description: "The domain name the deck will be reached by, such as hyperdeck.example.com." }
      country: { type: string, max_length: 2, pattern: "^[A-Za-z]{2}$", required: true, label: Country, description: "The organization's two-letter country code, such as AU." }
      state_name: { type: string, max_length: 128, required: true, label: State, description: "The organization's province, region, county or state." }
      locality: { type: string, max_length: 128, required: true, label: Location, description: "The organization's town or city." }
      organization: { type: string, max_length: 128, required: true, label: Organization, description: "The organization's name." }
    send: { endpoint: admin, method: POST, path: /admin/api/v1/certificate/signingRequest, body: '{"commonName":{common_name:json},"country":{country:json},"stateName":{state_name:json},"locality":{locality:json},"organization":{organization:json}}', content_type: application/json }
    expect: { status: [200, 201, 204], json_path: "$" }
    returns: value

  create_signing_request_with_alternative_name:
    summary: As create_signing_request, with a subject alternative name, a second domain name for the deck
    params:
      common_name: { type: string, max_length: 255, required: true, label: Common name, description: "The domain name the deck will be reached by, such as hyperdeck.example.com." }
      subject_alternative_name: { type: string, max_length: 255, required: true, label: Alternative name, description: "A second domain name for the deck, such as hyperdeck.example.net." }
      country: { type: string, max_length: 2, pattern: "^[A-Za-z]{2}$", required: true, label: Country, description: "The organization's two-letter country code, such as AU." }
      state_name: { type: string, max_length: 128, required: true, label: State, description: "The organization's province, region, county or state." }
      locality: { type: string, max_length: 128, required: true, label: Location, description: "The organization's town or city." }
      organization: { type: string, max_length: 128, required: true, label: Organization, description: "The organization's name." }
    send: { endpoint: admin, method: POST, path: /admin/api/v1/certificate/signingRequest, body: '{"commonName":{common_name:json},"country":{country:json},"stateName":{state_name:json},"locality":{locality:json},"organization":{organization:json},"subjectAlternativeName":{subject_alternative_name:json}}', content_type: application/json }
    expect: { status: [200, 201, 204], json_path: "$" }
    returns: value

  download_signing_request:
    summary: The certificate signing request's file (.csr) as text, by the id the deck gave when creating it
    params:
      id: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: Request id, description: "The signing request's id from create_signing_request's answer." }
    send: { endpoint: admin, method: GET, path: "/admin/api/v1/certificate/signingRequest/{id}" }
    expect: { status: 200 }
    returns: text

  get_admin_status:
    summary: Whether the deck requires an administrator login (GET /admin/api/v1/auth/adminStatus)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/auth/adminStatus }
    expect: { status: 200, json_path: "$.response.adminRequired" }
    returns: value

  get_users:
    summary: The secure login users, each with its id, name, utility administration access and shared folder permissions (GET /admin/api/v1/auth/users)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/auth/users }
    expect: { status: 200, json_path: "$.response.users" }
    returns: value

  create_user:
    summary: Add a secure login user, for the web media manager and the Ethernet Protocol when set to secure only
    params:
      username: { type: string, max_length: 64, required: true, label: Username, description: "The new user's name, case sensitive." }
      password: { type: string, max_length: 128, secret: true, required: true, label: Password, description: "The new user's password, case sensitive." }
      remote_admin_utility_access: { type: bool, default: false, label: Utility administration, description: "On lets this user administer the deck with HyperDeck Setup over the network." }
    send:
      - { endpoint: admin, method: POST, path: /admin/api/v1/auth/user, body: '{"username":{username:json},"password":{password:json},"remoteAdminUtilityAccess":{remote_admin_utility_access}}', content_type: application/json }
      - { endpoint: admin, method: GET, path: /admin/api/v1/auth/users }
    expect: { status: [200, 201, 204] }
    returns: ack

  rename_user:
    summary: Change a secure login user's name
    params:
      user_id: { type: string, max_length: 32, pattern: "^[0-9A-Za-z_-]+$", required: true, label: User id, description: "The user's id, as the user list gives it (the guest user is 1)." }
      username: { type: string, max_length: 64, required: true, label: Username, description: "The user's new name, case sensitive." }
    send:
      - { endpoint: admin, method: PUT, path: /admin/api/v1/auth/user, body: '{"authUserId":{user_id:json},"username":{username:json}}', content_type: application/json }
      - { endpoint: admin, method: GET, path: /admin/api/v1/auth/users }
    expect: { status: [200, 204] }
    returns: ack

  set_user_password:
    summary: Change a secure login user's password
    params:
      user_id: { type: string, max_length: 32, pattern: "^[0-9A-Za-z_-]+$", required: true, label: User id, description: "The user's id, as the user list gives it (the guest user is 1)." }
      password: { type: string, max_length: 128, secret: true, required: true, label: Password, description: "The user's new password, case sensitive." }
    send: { endpoint: admin, method: PUT, path: /admin/api/v1/auth/user, body: '{"authUserId":{user_id:json},"password":{password:json}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  set_user_admin_access:
    summary: Allow or refuse a secure login user administering the deck with HyperDeck Setup over the network
    params:
      user_id: { type: string, max_length: 32, pattern: "^[0-9A-Za-z_-]+$", required: true, label: User id, description: "The user's id, as the user list gives it (the guest user is 1)." }
      enabled: { type: bool, required: true, label: Utility administration, description: "On lets the user administer the deck over the network, off does not." }
    send:
      - { endpoint: admin, method: PUT, path: /admin/api/v1/auth/user, body: '{"authUserId":{user_id:json},"remoteAdminUtilityAccess":{enabled}}', content_type: application/json }
      - { endpoint: admin, method: GET, path: /admin/api/v1/auth/users }
    expect: { status: [200, 204] }
    returns: ack

  delete_user:
    summary: Remove a secure login user
    params:
      user_id: { type: string, max_length: 32, pattern: "^[0-9A-Za-z_-]+$", required: true, label: User id, description: "The user's id, as the user list gives it." }
    send:
      - { endpoint: admin, method: DELETE, path: /admin/api/v1/auth/user, body: '{"authUserId":{user_id:json}}', content_type: application/json }
      - { endpoint: admin, method: GET, path: /admin/api/v1/auth/users }
    expect: { status: [200, 204] }
    returns: ack

  get_date_time:
    summary: The deck's clock in Unix seconds and as YYYYMMDD-HHMMSS, and its time zone offset (GET /admin/api/v1/dateAndTime)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/dateAndTime }
    expect: { status: 200, json_path: "$.response" }
    returns: value

  set_date_time:
    summary: Set the deck's clock and time zone offset by hand; with NTP on, the deck sets the clock itself
    params:
      time: { type: int, min: 0, max: 4294967295, required: true, label: Time, description: "The time to set, in Unix seconds (since 1970-01-01 UTC)." }
      timezone_offset: { type: int, min: -720, max: 840, default: 0, label: Time zone offset, description: "Minutes ahead of UTC, negative behind it, such as -300 for UTC-5." }
    send:
      - { endpoint: admin, method: PUT, path: /admin/api/v1/dateAndTime, body: '{"time":"{time}","timezoneOffset":{timezone_offset}}', content_type: application/json }
      - { endpoint: admin, method: GET, path: /admin/api/v1/dateAndTime }
    expect: { status: [200, 204] }
    returns: ack

  get_ntp:
    summary: Whether the deck sets its clock from NTP, the server, and the synchronization state (GET /admin/api/v1/dateAndTime/ntp)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/dateAndTime/ntp }
    expect: { status: 200, json_path: "$.response" }
    returns: value

  set_ntp:
    summary: Set the NTP server and whether the deck sets its clock from it (time.cloudflare.com by default)
    params:
      server_url: { type: string, max_length: 255, pattern: "^[A-Za-z0-9.:_\\[\\]-]+$", required: true, label: NTP server, description: "The NTP server's host name or address, such as time.cloudflare.com." }
      enabled: { type: bool, default: true, label: Auto set date and time, description: "On sets the clock from the server, off keeps the time set by hand." }
    send:
      - { endpoint: admin, method: PUT, path: /admin/api/v1/dateAndTime/ntp, body: '{"serverUrl":{server_url:json},"enabled":{enabled}}', content_type: application/json }
      - { endpoint: admin, method: GET, path: /admin/api/v1/dateAndTime/ntp }
    expect: { status: [200, 204] }
    returns: ack

  get_timezone:
    summary: The deck's time zone offset from UTC in minutes (GET /admin/api/v1/dateAndTime/timezone)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/dateAndTime/timezone }
    expect: { status: 200, json_path: "$.response.timezoneOffset" }
    returns: value

  set_timezone:
    summary: Set the deck's time zone offset from UTC
    params:
      timezone_offset: { type: int, min: -720, max: 840, required: true, label: Time zone offset, description: "Minutes ahead of UTC, negative behind it, such as -300 for UTC-5." }
    send:
      - { endpoint: admin, method: PUT, path: /admin/api/v1/dateAndTime/timezone, body: '{"timezoneOffset":{timezone_offset}}', content_type: application/json }
      - { endpoint: admin, method: GET, path: /admin/api/v1/dateAndTime/timezone }
    expect: { status: [200, 204] }
    returns: ack

  get_reboot_key:
    summary: The key admin_reboot must return, which the deck hands out so a stray request cannot reboot it (GET /admin/api/v1/reboot)
    send: { endpoint: admin, method: GET, path: /admin/api/v1/reboot }
    expect: { status: 200, json_path: "$.response.key" }
    returns: value

  admin_reboot:
    summary: Reboot the deck over the configuration API with the key get_reboot_key gave; playback and recording stop
    params:
      key: { type: string, max_length: 256, pattern: "^[A-Za-z0-9._~+/=-]+$", required: true, label: Reboot key, description: "The key get_reboot_key returned just before." }
    send: { endpoint: admin, method: PUT, path: /admin/api/v1/reboot, body: '{"key":{key:json}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  # Files on the deck's media over its FTP server, answered by the
  # hyperdeck-ftp extension (no message of the spec's). Paths on the deck
  # start at its FTP root, whose folders are the media by slot (sd1, ssd2,
  # cfast1, usb/<drive>, or 1, 2 on some decks; list_files with no path
  # shows them).
  list_files:
    summary: List a folder on the deck's media over FTP (the root, with no path, lists the media) with each entry's name, type, size and modification time
    params:
      path: { type: string, max_length: 1024, default: "", label: Folder, description: "Folder on the deck from its FTP root, such as sd1 or usb/Drive/Clips; empty for the root, which lists the media by slot." }
    returns: value
    # HyperDeck manuals, Transferring Files via FTP; MLSD (RFC 3659), or LIST where the deck has no MLSD.
    # The result: {path, entries: [{name, type (file, folder, link or other), size (bytes, files only),
    # modified}], unparsed (listing lines not read, when any)}.

  download_file:
    summary: >
      Download a file from the deck's media to a file on the host over FTP.
      Answers at once with the transfer's number; transfers.<number> follows
      it to done or failed.
    params:
      remote: { type: string, max_length: 1024, required: true, label: File on the deck, description: "Path of the file on the deck from its FTP root, such as sd1/Clip 0001.mov." }
      path: { type: string, max_length: 4096, required: true, label: Host path, description: "Path of the file on the host running the core; created, or replaced if it exists." }
    returns: value
    # SIZE, then RETR on a passive data connection. The result: {transfer, ahead}.

  upload_file:
    summary: >
      Upload a file on the host into a folder on the deck's media over FTP;
      a file of that name on the deck is replaced only with overwrite.
      Answers at once with the transfer's number; transfers.<number> follows
      it to done or failed.
    params:
      path: { type: string, max_length: 4096, required: true, label: Host path, description: "Path of the file on the host running the core." }
      folder: { type: string, max_length: 1024, required: true, label: Folder on the deck, description: "Folder on the deck from its FTP root, such as sd1 or ssd2/Show; the root itself refuses files." }
      name: { type: string, max_length: 255, label: Name on the deck, description: "File name on the deck; the host file's name when not given." }
      overwrite: { type: bool, default: false, label: Overwrite, description: "Replace a file of the same name on the deck; when false such an upload fails before anything is sent." }
    returns: value
    # SIZE says whether the file exists, then STOR on a passive data connection. The result: {transfer, ahead}.

  delete_file:
    summary: Delete a file from the deck's media over FTP; it cannot be undone
    params:
      remote: { type: string, max_length: 1024, required: true, label: File on the deck, description: "Path of the file on the deck from its FTP root, such as sd1/Clip 0001.mov." }
    returns: ack
    # DELE.

  rename_file:
    summary: Rename or move a file on the deck's media over FTP; a file already at the new path is replaced only with overwrite
    params:
      remote: { type: string, max_length: 1024, required: true, label: File on the deck, description: "Path of the file on the deck from its FTP root, such as sd1/Clip 0001.mov." }
      to: { type: string, max_length: 1024, required: true, label: New path, description: "Its new path on the deck from the FTP root, such as sd1/Opener.mov." }
      overwrite: { type: bool, default: false, label: Overwrite, description: "Replace a file already at the new path; when false such a rename fails before anything changes." }
    returns: ack
    # SIZE on the new path, then RNFR and RNTO.

  create_folder:
    summary: Create a folder on the deck's media over FTP
    params:
      remote: { type: string, max_length: 1024, required: true, label: Folder on the deck, description: "Path of the new folder on the deck from its FTP root, such as sd1/Show." }
    returns: ack
    # MKD.

  cancel_transfer:
    summary: >
      Cancel a queued or running FTP transfer, or every one when no
      transfer is given. The value lists the transfers canceled.
    params:
      transfer: { type: int, min: 1, max: 4294967295, label: Transfer, description: "Number of the transfer, as its command answered; all when not given." }
    returns: value
    # Closes the data connection and sends ABOR. The result: {canceled}.

codes:
  "100": syntax error
  "101": unsupported parameter
  "102": invalid value
  "103": unsupported
  "104": disk full
  "105": no disk
  "106": disk error
  "107": timeline empty
  "108": internal error
  "109": out of range
  "110": no input
  "111": remote control disabled
  "112": clip not found
  "120": connection failed
  "121": authentication failed
  "122": authentication required
  "150": invalid state
  "151": invalid codec
  "160": invalid format
  "161": invalid token
  "162": format not prepared
  "163": parameterized single line command not supported

telemetry:
  # The document defines the asynchronous messages 500 connection info (on
  # connect), 502 slot info, 508 transport info, 510 remote info and 511
  # configuration, each carrying the same fields as its 2xx reply (p.11-23),
  # and 519 clips info (p.8). The other notifications are documented by their
  # notify switch only; they are read by the field names the switches use
  # (corroborated for display timecode, timeline position and playrange by
  # Sofie's hyperdeck-connection, MIT). One notify line per kind, so a deck
  # lacking one still enables the rest. A protocol 1.8 or 1.11 deck is sent
  # only the transport, slot, remote and configuration switches.
  subscribe:
    send:
      - "notify: transport: true"
      - "notify: slot: true"
      - "notify: remote: true"
      - "notify: configuration: true"
      - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "notify: display timecode: true" }
      - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "notify: timeline position: true" }
      - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "notify: dropped frames: true" }
      - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "notify: playrange: true" }
      - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "notify: cache: true" }
      - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "notify: dynamic range: true" }
      - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "notify: slate: true" }
      - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "notify: clips: true" }
      - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "notify: disk: true" }
      - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "notify: nas: true" }
  # Asked once on connecting; after that the pushes and the re-reads below
  # keep state. Slots 1 to 4 are each asked for; a deck answers a slot it
  # lacks with an error. A protocol 1.8 or 1.11 deck is asked only what its
  # commands cover (device and transport info, its disks' clip lists, the
  # configuration and the timeline, and on 1.11 the playrange), and told to
  # send only the notifications of its era.
  poll:
    - send:
        - "device info"
        - "transport info"
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "slot info" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "slot info: slot id: 1" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "slot info: slot id: 2" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "slot info: slot id: 3" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "slot info: slot id: 4" }
        - "disk list: slot id: 1"
        - "disk list: slot id: 2"
        - "disk list: slot id: 3"
        - "disk list: slot id: 4"
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "remote" }
        - "configuration"
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "notify" }
        - "clips get"
        - { models: [hyperdeck-1-11, hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "playrange" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "play on startup" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "play option" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "cache info" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "dynamic range" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "slate clips" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "slate project" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "slate lens" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "nas list" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "nas selected" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "external drive list" }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], message: "external drive selected" }
    # The configuration API (hyperdeckwire): what changes only when someone
    # sets it up, asked once on connecting...
    - send:
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/capabilities }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/languages }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/networkAccess/options }
    # ...and what HyperDeck Setup or the front panel can change, once a
    # minute: the deck pushes none of it.
    - every_ms: 60000
      send:
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/setupBasic }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/remoteAdmin }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/network/interface/0 }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/networkAccess }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/hyperDeckEthernetProtocol }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/certificate/summary }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/auth/adminStatus }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/auth/users }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/dateAndTime }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/dateAndTime/ntp }
        - { models: [hyperdeck-studio, hyperdeck-extreme, hyperdeck-shuttle], endpoint: admin, method: GET, path: /admin/api/v1/dateAndTime/timezone }
  updates:
    - header: "^500 connection info:$"
      fields:
        protocol version: device.protocol_version
        model: device.model
    - header: "^204 device info:$"
      fields:
        protocol version: device.protocol_version
        model: device.model
        unique id: device.unique_id
        slot count: device.slot_count
        software version: device.software_version
        name: device.name
    - header: "^[25]08 transport info:$"
      fields:
        status: transport.status
        speed: transport.speed
        slot id: transport.slot
        slot name: transport.slot_name
        device name: transport.device_name
        clip id: transport.clip
        single clip: { path: transport.single_clip, map: { "true": true, "false": false } }
        display timecode: transport.display_timecode
        timecode: transport.timecode
        video format: transport.video_format
        loop: { path: transport.loop, map: { "true": true, "false": false } }
        timeline: transport.timeline
        input video format: transport.input_video_format
        dynamic range: transport.dynamic_range
        reference locked: { path: transport.reference_locked, map: { "true": true, "false": false } }
    # Display timecode, timeline position and dropped frames notifications.
    - header: "^5[0-9][0-9] [^:]*:$"
      fields:
        display timecode: transport.display_timecode
        timeline position: transport.timeline_position
        dropped frames: transport.dropped_frames

    # ── Slots, each by its slot id (202 replies and 502 pushes) ──────────
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^slot name: (.*?)$"
      state: { "slots.{1}.name": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^device name: (.*?)$"
      state: { "slots.{1}.device_name": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^status: (.*?)$"
      state: { "slots.{1}.status": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^volume name: (.*?)$"
      state: { "slots.{1}.volume_name": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^recording time: (\\d+)$"
      state: { "slots.{1}.recording_time": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^video format: (.*?)$"
      state: { "slots.{1}.video_format": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^blocked: (true|false)$"
      state: { "slots.{1}.blocked": { value: "{2}", map: { "true": true, "false": false } } }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^remaining size: (\\d+)$"
      state: { "slots.{1}.remaining_size": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^total size: (\\d+)$"
      state: { "slots.{1}.total_size": "{2}" }
    - match: "(?ms)\\A[25]02 slot info:$.*?^slot id: (\\d+)$.*?^url: (.*?)$"
      state: { "slots.{1}.url": "{2}" }

    - header: "^[25]10 remote info:$"
      fields:
        enabled: { path: remote.enabled, map: { "true": true, "false": false } }
        override: { path: remote.override, map: { "true": true, "false": false } }
    - header: "^[25]11 configuration:$"
      fields:
        audio input: configuration.audio_input
        audio mapping: configuration.audio_mapping
        video input: configuration.video_input
        file format: configuration.file_format
        audio codec: configuration.audio_codec
        timecode input: configuration.timecode_input
        timecode output: configuration.timecode_output
        timecode preference: configuration.timecode_preference
        timecode preset: configuration.timecode_preset
        audio input channels: configuration.audio_input_channels
        record trigger: configuration.record_trigger
        record prefix: configuration.record_prefix
        record cache: { path: configuration.record_cache, map: { "true": true, "false": false } }
        append timestamp: { path: configuration.append_timestamp, map: { "true": true, "false": false } }
        reference source: configuration.reference_source
        genlock input resync: { path: configuration.genlock_input_resync, map: { "true": true, "false": false } }
        usb spill: { path: configuration.usb_spill, map: { "true": true, "false": false } }
        default standard: configuration.default_standard
        xlr mapping: configuration.xlr_mapping
        rca mapping: configuration.rca_mapping
        xlr input id: configuration.xlr_input_id
        xlr type: configuration.xlr_type
    - header: "^209 notify:$"
      fields:
        transport: { path: notify.transport, map: { "true": true, "false": false } }
        slot: { path: notify.slot, map: { "true": true, "false": false } }
        remote: { path: notify.remote, map: { "true": true, "false": false } }
        configuration: { path: notify.configuration, map: { "true": true, "false": false } }
        dropped frames: { path: notify.dropped_frames, map: { "true": true, "false": false } }
        display timecode: { path: notify.display_timecode, map: { "true": true, "false": false } }
        timeline position: { path: notify.timeline_position, map: { "true": true, "false": false } }
        playrange: { path: notify.playrange, map: { "true": true, "false": false } }
        cache: { path: notify.cache, map: { "true": true, "false": false } }
        dynamic range: { path: notify.dynamic_range, map: { "true": true, "false": false } }
        slate: { path: notify.slate, map: { "true": true, "false": false } }
        clips: { path: notify.clips, map: { "true": true, "false": false } }
        disk: { path: notify.disk, map: { "true": true, "false": false } }
        device info: { path: notify.device_info, map: { "true": true, "false": false } }
        nas: { path: notify.nas, map: { "true": true, "false": false } }

    # ── Timeline clips (205 clips info) ───────────────────────────────────
    # A whole-timeline "clips get" replaces the list; a get of one clip or a
    # run of clips only updates those. Version 1 lines are id: name start
    # duration; versions 2 and 3 id: start duration in out name (p.8, p.19).
    - header: "^214 clips count:$"
      fields:
        clip count: timeline.clip_count
    - match: "(?m)\\A205 clips info:$(?s:.*?)^clip count: (\\d+)$"
      request_match: "^clips get(?:: version: [123])?$"
      replace: timeline.clips
      state: { timeline.clip_count: "{1}" }
    - header: "^205 clips info:$"
      fields:
        clip count: timeline.clip_count
    - header: "^205 clips info:$"
      each_line: "^(\\d+): (.+) ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}) ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2})$"
      state:
        "timeline.clips.{1}.name": "{2}"
        "timeline.clips.{1}.start_timecode": "{3}"
        "timeline.clips.{1}.duration": "{4}"
    - header: "^205 clips info:$"
      each_line: "^(\\d+): ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}) ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}) ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}) ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}) (.+)$"
      state:
        "timeline.clips.{1}.start_timecode": "{2}"
        "timeline.clips.{1}.duration": "{3}"
        "timeline.clips.{1}.in_timecode": "{4}"
        "timeline.clips.{1}.out_timecode": "{5}"
        "timeline.clips.{1}.name": "{6}"
    # An empty timeline answers 107 timeline empty.
    - match: "^107 "
      request_match: "^clips get(?:: version: [123])?$"
      replace: timeline.clips
      state: { timeline.clip_count: "0" }
    # A timeline clips notification (519, an addition or a snapshot) has the
    # whole timeline read again.
    - match: "^519 "
      then_send: ["clips get"]

    # ── Disk clip lists (206 disk list, p.18) ─────────────────────────────
    # The reply names its slot on the line after the header, then lists the
    # clips: in response version 1 "{index}: {name} {file format} {video
    # format} {duration}", in version 2 "{index}: {codec} {format}
    # {duration} {folder/filename}" (p.8). The slot's list is replaced whole.
    - match: "(?ms)\\A206 disk list:$.*?^slot id: (\\d+)$"
      replace: "slots.{1}.clips"
    - match: "(?ms)\\A206 disk list:$.*?^slot id: (\\d+)$"
      match_each: "(?m)^(\\d+): (.+) (\\S+) (\\S+) ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2})$"
      state:
        "slots.{1}.clips.{2}.name": "{3}"
        "slots.{1}.clips.{2}.file_format": "{4}"
        "slots.{1}.clips.{2}.video_format": "{5}"
        "slots.{1}.clips.{2}.duration": "{6}"
    - match: "(?ms)\\A206 disk list:$.*?^slot id: (\\d+)$"
      match_each: "(?m)^(\\d+): (\\S+) (\\S+) ([0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}) (.+)$"
      state:
        "slots.{1}.clips.{2}.file_format": "{3}"
        "slots.{1}.clips.{2}.video_format": "{4}"
        "slots.{1}.clips.{2}.duration": "{5}"
        "slots.{1}.clips.{2}.name": "{6}"
    # A disk clips notification (520) has the active disk's list read again;
    # a slot change (502) has that slot's.
    - match: "^520 "
      then_send: ["disk list"]
    - match: "(?ms)\\A502 slot info:$.*?^slot id: (\\d+)$"
      then_send: ["disk list: slot id: {1}"]

    # ── Playrange, play on startup, play option (219, 218, 220) ──────────
    # Reply codes as Sofie's hyperdeck-connection gives them; a playrange
    # report replaces the last, so a cleared range leaves state.
    - header: "^(?:219|515) [^:]*:$"
      replace: playrange
      fields:
        timeline in: playrange.timeline_in
        timeline out: playrange.timeline_out
    - header: "^218 [^:]*:$"
      fields:
        enable: { path: play_on_startup.enabled, map: { "true": true, "false": false } }
        single clip: { path: play_on_startup.single_clip, map: { "true": true, "false": false } }
    - header: "^220 [^:]*:$"
      fields:
        stop mode: play_option.stop_mode

    # ── Cache, dynamic range, slate ───────────────────────────────────────
    - header: "^(?:221 [^:]*|5[0-9][0-9] cache info):$"
      fields:
        status: cache.status
        transferring slot id: cache.transferring_slot
        recording time: cache.recording_time
    # Dynamic range and slate field names belong to no other documented
    # report, so any report holding them (2xx after 201, or 5xx) is read.
    - header: "^(?:20[2-9]|2[1-9][0-9]|5[0-9][0-9]) [^:]*:$"
      fields:
        playback override: dynamic_range.playback_override
        record override: dynamic_range.record_override
        reel: slate.reel
        scene id: slate.scene_id
        shot type: slate.shot_type
        take: slate.take
        take scenario: slate.take_scenario
        take auto inc: { path: slate.take_auto_inc, map: { "true": true, "false": false } }
        good take: { path: slate.good_take, map: { "true": true, "false": false } }
        environment: slate.environment
        day night: slate.day_night
        project name: slate.project_name
        camera: slate.camera
        director: slate.director
        camera operator: slate.camera_operator
        lens type: slate.lens_type
        iris: slate.iris
        focal length: slate.focal_length
        distance: slate.distance
        filter: slate.filter

    # ── NAS and external drives, kept as the deck words them ──────────────
    - match: "(?s)\\A2[0-9][0-9] [^\\n]*\\n?(.*)$"
      request_match: "^nas list$"
      state: { nas.bookmarks: "{1}" }
    - match: "(?s)\\A2[0-9][0-9] [^\\n]*\\n?(.*)$"
      request_match: "^nas selected$"
      state: { nas.selected: "{1}" }
    - match: "(?s)\\A2[0-9][0-9] [^\\n]*\\n?(.*)$"
      request_match: "^external drive list$"
      state: { external_drives.available: "{1}" }
    - match: "(?s)\\A2[0-9][0-9] [^\\n]*\\n?(.*)$"
      request_match: "^external drive selected$"
      state: { external_drives.selected: "{1}" }

    # ── Re-reads after this integration's own changes ─────────────────────
    # Settings the deck sends no documented notification for, or not on every
    # protocol version, are read again once the deck accepts a change.
    - match: "^200 ok$"
      request_match: "^playrange (?:set|clear)"
      then_send: ["playrange"]
    - match: "^200 ok$"
      request_match: "^play on startup: "
      then_send: ["play on startup"]
    - match: "^200 ok$"
      request_match: "^play option: "
      then_send: ["play option"]
    - match: "^200 ok$"
      request_match: "^dynamic range: "
      then_send: ["dynamic range"]
    - match: "^200 ok$"
      request_match: "^slate (clips|project|lens):"
      then_send: ["slate {1}"]
    - match: "^200 ok$"
      request_match: "^nas (?:add|remove|select|deselect)"
      then_send: ["nas list", "nas selected"]
    - match: "^200 ok$"
      request_match: "^external drive select: "
      then_send: ["external drive selected"]
    - match: "^200 ok$"
      request_match: "^configuration: record cache: "
      then_send: ["cache info"]
    # A notify switch the deck accepted (200 ok) is as the request set it;
    # the subscriptions on connecting set them too.
    - match: "^200 ok$"
      request_match: "^notify: transport: (true|false)$"
      state: { notify.transport: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: slot: (true|false)$"
      state: { notify.slot: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: remote: (true|false)$"
      state: { notify.remote: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: configuration: (true|false)$"
      state: { notify.configuration: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: dropped frames: (true|false)$"
      state: { notify.dropped_frames: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: display timecode: (true|false)$"
      state: { notify.display_timecode: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: timeline position: (true|false)$"
      state: { notify.timeline_position: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: playrange: (true|false)$"
      state: { notify.playrange: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: cache: (true|false)$"
      state: { notify.cache: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: dynamic range: (true|false)$"
      state: { notify.dynamic_range: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: slate: (true|false)$"
      state: { notify.slate: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: clips: (true|false)$"
      state: { notify.clips: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: disk: (true|false)$"
      state: { notify.disk: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: device info: (true|false)$"
      state: { notify.device_info: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^notify: nas: (true|false)$"
      state: { notify.nas: { value: "{1}", map: { "true": true, "false": false } } }
    - match: "^200 ok$"
      request_match: "^(?:clips (?:add|remove|clear|rebuild)|slot select)"
      then_send: ["clips get"]

    # ── Configuration API (hyperdeckwire) ──────────────────────────────────
    # Each reply is {"response": {...}, "success": true}; the polls above and
    # every write's read-back come here alike.
    - path: "^/admin/api/v1/capabilities$"
      json_each: "$.response.*"
      json: { version: "$.version" }
      state: { "admin.capabilities.{key:key}.version": "{version}" }
    - path: "^/admin/api/v1/setupBasic$"
      json:
        product_name: "$.response.productName"
        short_product_name: "$.response.shortProductName"
        product_id: "$.response.productId"
        device_name: "$.response.deviceName"
        hostname: "$.response.hostname"
        software: "$.response.software"
        build: "$.response.build"
        hardware: "$.response.hardware"
        language: "$.response.language"
      state:
        admin.setup.product_name: "{product_name}"
        admin.setup.short_product_name: "{short_product_name}"
        admin.setup.product_id: "{product_id}"
        admin.setup.device_name: "{device_name}"
        admin.setup.hostname: "{hostname}"
        admin.setup.software: "{software}"
        admin.setup.build: "{build}"
        admin.setup.hardware: "{hardware}"
        admin.setup.language: "{language}"
    - path: "^/admin/api/v1/languages$"
      json_match: { "$.response.languages": "^\\[" }
      json_each: "$.response.languages"
      json: { code: "$.code", name: "$.name" }
      replace: admin.languages
      state: { "admin.languages.{code:key}.name": "{name}" }
    - path: "^/admin/api/v1/remoteAdmin$"
      json: { enabled: "$.response.enabled", usb: "$.response.isUSBRequestSource" }
      state:
        admin.remote_admin.enabled: "{enabled}"
        admin.remote_admin.usb_request: "{usb}"
    # One interface, by the id in the path. Configured (manualConfig) and
    # running (activeConfig) values differ on DHCP, and for about a second
    # after a static change while the deck applies it.
    - path: "^/admin/api/v1/network/interface/(\\d+)$"
      json:
        hostname: "$.response.hostname"
        name: "$.response.interface.name"
        mac: "$.response.interface.macAddress"
        type: "$.response.interface.type"
        address: "$.response.interface.manualConfig.address"
        netmask: "$.response.interface.manualConfig.netmask"
        gateway: "$.response.interface.manualConfig.gateway"
        active_address: "$.response.interface.activeConfig.address"
        active_netmask: "$.response.interface.activeConfig.netmask"
        active_gateway: "$.response.interface.activeConfig.gateway"
        linked: "$.response.interface.physicallyLinked"
        present: "$.response.interface.physicallyPresent"
        speed: "$.response.interface.currentSpeedBps"
        mtu: "$.response.interface.currentMtu"
        current_state: "$.response.interface.currentState"
        default_route: "$.response.interface.defaultRoute"
        priority: "$.response.interface.priority"
      state:
        "admin.network.interfaces.{1}.hostname": "{hostname}"
        "admin.network.interfaces.{1}.name": "{name}"
        "admin.network.interfaces.{1}.mac_address": "{mac}"
        "admin.network.interfaces.{1}.type": "{type}"
        "admin.network.interfaces.{1}.address": "{address}"
        "admin.network.interfaces.{1}.netmask": "{netmask}"
        "admin.network.interfaces.{1}.gateway": "{gateway}"
        "admin.network.interfaces.{1}.active_address": "{active_address}"
        "admin.network.interfaces.{1}.active_netmask": "{active_netmask}"
        "admin.network.interfaces.{1}.active_gateway": "{active_gateway}"
        "admin.network.interfaces.{1}.linked": { value: "{linked}", map: { "1": true, "0": false, "true": true, "false": false } }
        "admin.network.interfaces.{1}.present": { value: "{present}", map: { "1": true, "0": false, "true": true, "false": false } }
        "admin.network.interfaces.{1}.speed": "{speed}"
        "admin.network.interfaces.{1}.mtu": "{mtu}"
        "admin.network.interfaces.{1}.state": "{current_state}"
        "admin.network.interfaces.{1}.default_route": { value: "{default_route}", map: { "1": true, "0": false, "true": true, "false": false } }
        "admin.network.interfaces.{1}.priority": "{priority}"
    # The DNS lists, whole, from a reply that holds them (not a write's
    # answer on the same path).
    - path: "^/admin/api/v1/network/interface/(\\d+)$"
      json_match: { "$.response.interface.manualConfig.dnsServers": "^\\[" }
      json_each: "$.response.interface.manualConfig.dnsServers"
      json: { server: "$" }
      replace: "admin.network.interfaces.{1}.dns_servers"
      state: { "admin.network.interfaces.{1}.dns_servers.{index:+1}": "{server}" }
    - path: "^/admin/api/v1/network/interface/(\\d+)$"
      json_match: { "$.response.interface.activeConfig.dnsServers": "^\\[" }
      json_each: "$.response.interface.activeConfig.dnsServers"
      json: { server: "$" }
      replace: "admin.network.interfaces.{1}.active_dns_servers"
      state: { "admin.network.interfaces.{1}.active_dns_servers.{index:+1}": "{server}" }
    # A network write's answer: the interface is read again. When the write
    # moved the deck to another address, the read goes to the old one and
    # fails; the deck is then opened at its new address.
    - path: "^/admin/api/v1/network/interface/(\\d+)$"
      request_match: { "$.type": "^(DHCP|Static)$" }
      json: {}
      then_send:
        - { endpoint: admin, method: GET, path: "/admin/api/v1/network/interface/{1}" }
    - path: "^/admin/api/v1/networkAccess$"
      json_each: "$.response.protocols"
      json: { id: "$.id", state: "$.state", url: "$.url" }
      state:
        "admin.network_access.protocols.{id:key}.state": "{state}"
        "admin.network_access.protocols.{id:key}.url": "{url}"
    # A network access write's answer says whether the change waits for a
    # reboot.
    - path: "^/admin/api/v1/networkAccess$"
      json: { reboot: "$.response.rebootRequired" }
      state: { admin.network_access.reboot_required: "{reboot}" }
    - path: "^/admin/api/v1/networkAccess/options$"
      json_each: "$.response.options"
      json: { protocol: "$.protocol", secure: "$.secureOption", show: "$.showURL" }
      state:
        "admin.network_access.protocols.{protocol:key}.secure_option": "{secure}"
        "admin.network_access.protocols.{protocol:key}.show_url": "{show}"
    - path: "^/admin/api/v1/hyperDeckEthernetProtocol$"
      json: { state: "$.response.state" }
      state: { admin.ethernet_protocol: "{state}" }
    # The summary whole: a removed certificate leaves only the host name.
    # The validity fields' names are not known, so the summary is also kept
    # as the JSON the deck gives.
    - path: "^/admin/api/v1/certificate/summary$"
      json_match: { "$.response": "^\\{" }
      json: { summary: "$.response", hostname: "$.response.hostname", domain: "$.response.domain", issuer: "$.response.issuer" }
      replace: admin.certificate
      state:
        admin.certificate.summary: "{summary}"
        admin.certificate.hostname: "{hostname}"
        admin.certificate.domain: "{domain}"
        admin.certificate.issuer: "{issuer}"
    - path: "^/admin/api/v1/auth/adminStatus$"
      json: { required: "$.response.adminRequired" }
      state: { admin.auth.admin_required: "{required}" }
    - path: "^/admin/api/v1/auth/users$"
      json_match: { "$.response.users": "^\\[" }
      json_each: "$.response.users"
      json: { id: "$.authUserId", username: "$.username", access: "$.remoteAdminUtilityAccess", folders: "$.sharedFolderPermissions" }
      replace: admin.auth.users
      state:
        "admin.auth.users.{id:key}.username": "{username}"
        "admin.auth.users.{id:key}.remote_admin_utility_access": "{access}"
        "admin.auth.users.{id:key}.shared_folder_permissions": "{folders}"
    - path: "^/admin/api/v1/dateAndTime$"
      json: { time: "$.response.time", friendly: "$.response.timeFriendly", offset: "$.response.timezoneOffset" }
      state:
        admin.date_time.time: "{time}"
        admin.date_time.time_friendly: "{friendly}"
        admin.date_time.timezone_offset: "{offset}"
    - path: "^/admin/api/v1/dateAndTime/ntp$"
      json: { enabled: "$.response.enabled", server: "$.response.serverUrl", state: "$.response.state" }
      state:
        admin.date_time.ntp.enabled: "{enabled}"
        admin.date_time.ntp.server_url: "{server}"
        admin.date_time.ntp.state: "{state}"
    - path: "^/admin/api/v1/dateAndTime/timezone$"
      json: { offset: "$.response.timezoneOffset" }
      state: { admin.date_time.timezone_offset: "{offset}" }

