spec: 1
id: blackmagic-hyperdeck
name: Blackmagic HyperDeck
vendor: Blackmagic Design
category: recorder

source:
  - title: Blackmagic HyperDeck Ethernet Protocol (Developer Information, December 2024)
    url: https://documents.blackmagicdesign.com/DeveloperManuals/HyperDeckEthernetProtocol.pdf
    note: Manufacturer-documented. Command syntax, response codes and response framing

transport:
  type: line-tcp
  port: 9993
  framing: terminated
  terminator: crlf
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  reply_framing: headed-block
  reply_match: "^[12][0-9][0-9] "
  probe: "ping"

models:
  - id: hyperdeck-1-8
    name: HyperDeck (protocol 1.8)
    supports:
      [record, record_named, record_spill, record_spill_to_slot, stop, play,
       goto_clip, goto_clip_offset, get_transport_info, get_device_info,
       get_clip_count, get_clips, get_configuration, disk_list, disk_list_slot,
       preview_enable, preview_disable]
    verification: none
    notes: >
      Play speed range is -1600 to 1600 percent on this protocol version.
  - id: hyperdeck-1-11
    name: HyperDeck (protocol 1.11 and later)
    supports:
      [record, record_named, record_spill, record_spill_to_slot, stop, play,
       goto_clip, goto_clip_offset, get_transport_info, get_device_info,
       get_clip_count, get_clips, get_configuration, disk_list, disk_list_slot,
       preview_enable, preview_disable, get_playrange, set_playrange_clip,
       set_playrange_clips, set_playrange_timecode, set_playrange_frames,
       clear_playrange, set_playback_stop_mode]
    verification: none
    notes: >
      Play speed range is -5000 to 5000 percent. Playrange and stop-mode
      commands require this protocol version.

commands:
  record:
    summary: Start recording from the current input
    send: "record"
    expect: { code_range: [200, 299] }
    returns: ack

  record_named:
    summary: Start recording a named clip
    params:
      name: { type: string, max_length: 128, required: true }
    send: "record: name: {name}"
    expect: { code_range: [200, 299] }
    returns: ack

  record_spill:
    summary: Continue the current recording on the next slot
    send: "record spill"
    expect: { code_range: [200, 299] }
    returns: ack

  record_spill_to_slot:
    summary: Continue the current recording on a specific slot
    params:
      slot_id: { type: int, min: 1, max: 8, required: true }
    send: "record: spill: slot id: {slot_id}"
    expect: { code_range: [200, 299] }
    returns: ack

  stop:
    send: "stop"
    expect: { code_range: [200, 299] }
    returns: ack

  play:
    summary: Play at a speed given as a percentage of normal
    params:
      single_clip: { type: bool, default: true }
      loop:        { type: bool, default: false }
      speed:       { type: int, min: -5000, max: 5000, default: 100 }
    send: "play: single clip: {single_clip} loop: {loop} speed: {speed}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_clip:
    summary: Jump to a clip by 1-based id
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true }
    send: "goto: clip id: {clip_id}"
    expect: { code_range: [200, 299] }
    returns: ack

  goto_clip_offset:
    summary: Jump forward or backward relative to the current clip
    params:
      offset: { type: int, min: -999, max: 999, required: true }
    send: "goto: clip id: {offset:signed}"
    expect: { code_range: [200, 299] }
    returns: ack

  get_transport_info:
    send: "transport info"
    expect: { code_range: [200, 299] }
    returns: fields

  get_device_info:
    send: "device info"
    expect: { code_range: [200, 299] }
    returns: fields

  get_clip_count:
    send: "clips count"
    expect: { code_range: [200, 299], matches: "clip count: ([0-9]+)" }
    returns: value

  get_clips:
    send: "clips get"
    expect: { code_range: [200, 299] }
    returns: text

  get_configuration:
    send: "configuration"
    expect: { code_range: [200, 299] }
    returns: fields

  disk_list:
    summary: List clips on the active disk
    send: "disk list"
    expect: { code_range: [200, 299] }
    returns: text

  disk_list_slot:
    summary: List clips on the disk in a specific slot
    params:
      slot_id: { type: int, min: 1, max: 8, required: true }
    send: "disk list: slot id: {slot_id}"
    expect: { code_range: [200, 299] }
    returns: text

  preview_enable:
    send: "preview: enable: true"
    expect: { code_range: [200, 299] }
    returns: ack

  preview_disable:
    send: "preview: enable: false"
    expect: { code_range: [200, 299] }
    returns: ack

  get_playrange:
    send: "playrange"
    expect: { code_range: [200, 299] }
    returns: text

  set_playrange_clip:
    summary: Restrict playback to a single clip
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true }
    send: "playrange set: clip id: {clip_id}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_playrange_clips:
    summary: Restrict playback to a run of clips starting at clip_id
    params:
      clip_id: { type: int, min: 1, max: 9999, required: true }
      count:   { type: int, min: 1, max: 9999, required: true }
    send: "playrange set: clip id: {clip_id} count: {count}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_playrange_timecode:
    summary: Restrict playback to a timecode range
    params:
      in:  { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true }
      out: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true }
    send: "playrange set: in: {in} out: {out}"
    expect: { code_range: [200, 299] }
    returns: ack

  set_playrange_frames:
    summary: Restrict playback to a range of timeline frames
    params:
      timeline_in:  { type: int, min: 0, required: true }
      timeline_out: { type: int, min: 0, required: true }
    send: "playrange set: timeline in: {timeline_in} timeline out: {timeline_out}"
    expect: { code_range: [200, 299] }
    returns: ack

  clear_playrange:
    send: "playrange clear"
    expect: { code_range: [200, 299] }
    returns: ack

  set_playback_stop_mode:
    params:
      mode: { type: enum, values: [lastframe, nextframe, black], required: true }
    send: "play option: stop mode: {mode}"
    expect: { code_range: [200, 299] }
    returns: ack

codes:
  "100": syntax error
  "101": unsupported parameter
  "102": invalid value
  "103": unsupported
  "104": disk full
  "105": no disk
  "106": disk error
  "107": timeline empty
  "108": internal error
  "109": out of range
  "110": no input
  "111": remote control disabled
  "112": clip not found
  "120": connection failed
  "121": authentication failed
  "122": authentication required
  "150": invalid state
  "151": invalid codec
  "160": invalid format
  "161": invalid token
  "162": format not prepared
  "163": parameterized single line command not supported

telemetry:
  # "notify: transport: true" makes the deck send "508 transport info:" whenever
  # the transport changes; "transport info" asks once on connection. Both
  # answers carry the same fields.
  subscribe:
    send: ["notify: transport: true"]
  poll:
    send: ["transport info"]
  updates:
    - header: "^[25]08 transport info:$"
      fields:
        status: transport.status
        speed: transport.speed
        slot id: transport.slot
        clip id: transport.clip
        single clip: { path: transport.single_clip, map: { "true": true, "false": false } }
        loop: { path: transport.loop, map: { "true": true, "false": false } }
        timecode: transport.timecode
        display timecode: transport.display_timecode
        video format: transport.video_format

state:
  transport.status:           { type: string, description: "preview, stopped, play, forward, rewind, jog, shuttle or record" }
  transport.speed:            { type: int, unit: "%", description: "Play speed" }
  transport.slot:             { type: int, description: "Active slot" }
  transport.clip:             { type: int, description: "Current clip; absent when none" }
  transport.single_clip:      { type: bool, description: "Single-clip playback" }
  transport.loop:             { type: bool, description: "Loop playback" }
  transport.timecode:         { type: string, description: "Timecode" }
  transport.display_timecode: { type: string, description: "Timecode on the front panel" }
  transport.video_format:     { type: string, description: "Video format, such as 1080p30" }

quirks:
  - models: [all]
    severity: warning
    text: >
      Responses begin with a numeric code. 200-299 is success, 100-199 is
      failure. A success code may be followed by a multi-line payload, as with
      "205 clips info:".

  - models: [all]
    severity: warning
    text: >
      Play speed limits differ by protocol version: +/-1600 percent on 1.8,
      +/-5000 on 1.11 and later. Sending a value outside the device's range
      returns 109 out of range.

  - models: [all]
    severity: info
    text: >
      Asynchronous 5xx messages can arrive at any time, starting with "500
      connection info:" on connect. They are not replies to the pending command
      and are skipped when matching a response.

  - models: [all]
    severity: info
    text: >
      A relative goto past the first or last clip clamps to that clip rather
      than failing.

  - models: [all]
    severity: info
    text: >
      Sending "quit" before closing the socket makes the deck release the
      session immediately rather than waiting for a timeout.

  - models: [all]
    severity: warning
    text: >
      Code 111, remote control disabled, means the deck is in local mode. No
      transport command will succeed until remote is enabled on the front panel.
