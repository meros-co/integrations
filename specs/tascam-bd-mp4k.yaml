  time_display: { title_elapsed: TL, title_remaining: TR, chapter_elapsed: EL, chapter_remaining: RM }
  shown: { "true": "00", "false": "01" }
  on00: { "true": "00", "false": "01" }
  dialog: { primary: "+", secondary: "-" }
  tray: { open: OP, close: CL }
  resolution: { auto: "1", 480i: "2", 480p: "3", 720p: "4", 1080i: "5", 1080p: "6", 2160p: "7" }
  color: { red: "1", green: "2", blue: "3", yellow: "4" }
  direction: { forward: F, reverse: R }
  speed: { fast: f, slow: s }
  cursor: { left: "1", right: "2", up: "3", down: "4" }
  auto_play: { "on": "00", "off": "01", on_repeat: "02" }
  hdmi_3d: { auto: AT, "off": "01" }
  aspect: { "16_9_full": 9W, "16_9_normal": 9A, "4_3_pan_scan": 3P, "4_3_letterbox": 3L }
  tv_system: { ntsc: NT, pal: PL, multi: MS }
  color_space: { rgb_video: RV, rgb_pc: RP, ycbcr444: Y4, ycbcr422: Y2 }
  deep_color: { "48": "48", "36": "36", "30": "30", "off": OF }
  digital_fs: { "48": "48", "96": "96", "192": "19" }
  speaker_config: { "2.1": "21", "3.1": "31", "4.1": "41", "5.1": "51", "6.1": "61", "7.1": "71" }
  speaker: { center: C, left: L, right: R, surround_left: l, surround_right: r, surround_back_left: B,
    surround_back_right: b, subwoofer: S }
  size: { large: "0", small: "1" }
  level: {
