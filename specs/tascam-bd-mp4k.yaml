spec: 1
id: tascam-bd-mp4k
name: TASCAM BD-MP4K 4K UHD Blu-ray player (RS-232C / Ethernet protocol)
vendor: TASCAM
category: playback

# TEAC's RS-232C/ETHERNET protocol for the BD-MP4K: the same ASCII messages on the RS-232C port and on TCP port
# 9030. A message is "!", the unit type "7" (a Blu-ray player), a three-character command and its parameter, then
# CR. The player answers every message with "ack", or "nack" when it cannot take it; a status request is answered
# "ack" and then the status, which is the request's command with its value ("!7?SST" is answered "!7SSTPL"). The
# player also sends a status by itself whenever it changes (transport, chapter, title, disc), and expects the host
# to answer it with "ack". "Track" here is a chapter (DVD, BD) or a file; "group" a title (DVD, BD) or an audio CD's
# track. The BD-MP1 family's protocol is the tascam-bd-mp1 spec's.
source:
  - title: "TASCAM BD-MP4K CONTROL I/O Terminals RS-232C/ETHERNET Protocol Specifications, Ver. 1.01 (Sep. 2021)"
    author: TEAC Corporation
    url: https://tascam.com/wp-content/uploads/downloads/products/tascam/bd-mp4k/rs232c_ethernet_protocol_bd-mp4k_v101_en.pdf
    note: >
      Manufacturer document (retrieved 2026-10-27), offered for download with a protocol use agreement that grants
      its use for developing compatible devices and software; nothing of it is copied here. RS-232C at 115200, 57600
      or 38400 bit/s (57600 only in standby), 8 data bits, no parity, 1 stop bit (§2.1.2); TCP port 9030, fixed, one
      client at a time, kept open to receive status notifications (§2.2, §3.2); message format "!7", command,
      parameter, CR, with the device's messages shown without CR since Ver. 1.01 (§3); ack and nack and when each is
      sent (§4.2); a new command only after ack or nack, 30 ms (IP) or 300 ms (RS-232C) reply timeout, at least 30 ms
      between commands, BUSY (@0BDERBUSY) when the buffer is full (§4.3); status notifications answered ack by the
      host, sent once more without it (§4.4.3); the key control (power on not over Ethernet, Wake-on-LAN instead, and
      at 57600 bit/s), menu setting (with HDR, Dolby Vision, video and audio processing) and current status tables
      (§5.1-5.3).
  - title: "TASCAM BD-MP4K Owner's Manual"
    author: TEAC Corporation
    url: https://tascam.com/wp-content/uploads/downloads/products/tascam/bd-mp4k/bd-mp4k_om_efsgi_ve.pdf
    note: >
      Manufacturer document. RS-232C settings: 38400, 57600 or 115200 bit/s, 57600 whatever the setting while the
      power is off, so power on from RS-232C needs 57600 (p.21); remote control over RS-232C or ETHERNET, the protocol
      on the download page.

transport:
  type: line-tcp
  port: 9030
  framing: terminated
  terminator: cr
  encoding: utf-8
  timeout_ms: 1000
  reply: expected
  # The player's messages: "ack" or "nack" (no line ending), and statuses from "!7" to CR. Every message the player
  # sends is one of them, or BUSY.
  reply_framing: terminated
  reply_terminators: ["\r", "ack"]
  reply_match: "^(n?ack|!7|@0BDER)"
  error_match: "^(nack|@0BDERBUSY)"
  probe: "!7?PWR"
  # Each status the player notifies by itself is answered with "ack" (§4.4.3), or it is sent once more; the
  # status answering a status request other than ?PWR (answered ack alone) is not.
  acknowledge: { match: "^!7", send: ack, framed: false, answers: '^!7\?(?:[^P]|P[^W]|PW[^R])' }
  # At least 30 ms between commands (§4.3.6).
  pacing:
    min_interval_ms: 30
  # RS-232C: the same messages; the speed is set on the player (RS-232C settings), 8N1 fixed (§2.1.2).
  serial:
    baud_rate: { default: 115200, values: [38400, 57600, 115200] }
    data_bits: 8
    parity: none
    stop_bits: 1
    flow_control: none

ports:
  - { port: 9030, protocol: tcp, role: control, when: "link tcp", note: "fixed; one client at a time" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "RS-232C, D-sub 9-pin female" }

models:
  - id: bd-mp4k
    name: TASCAM BD-MP4K
    supports: [power_on, power_off, get_power, stop, play, pause, locate_chapter, skip_chapter, locate_title,
      skip_title, set_time_display, get_time_display, set_osd_hidden, get_osd_hidden, setup_menu, top_menu, option_menu,
      popup_menu, menu_return, audio_dialog, subtitle, enter, tray, set_resolution, get_resolution, display_info,
      color_key, home, number_key, search, get_search, set_mute, get_mute, cursor, clear, set_auto_play, get_auto_play,
      set_pip_mark, get_pip_mark, set_hdmi_3d, get_hdmi_3d, set_aspect, get_aspect, set_tv_system, get_tv_system,
      set_hdmi_1080p24, get_hdmi_1080p24, set_color_space, get_color_space, set_deep_color, get_deep_color,
      set_secondary_audio_mark, get_secondary_audio_mark, set_digital_fs, get_digital_fs, set_speaker_config,
      get_speaker_config, set_speaker, firmware_upgrade, set_hdmi_cec, get_hdmi_cec, factory_reset, set_bd_live,
      get_bd_live, set_hdr, get_hdr, set_dolby_vision, get_dolby_vision, set_video_mode,
      set_video_mode_custom, get_video_mode, set_color_adjust, get_color_adjust, set_noise_reduction,
      get_noise_reduction, set_audio_eq, get_audio_eq, set_downmix, get_downmix, get_disc_status, get_status,
      get_chapter_count, get_chapter, get_title_count, get_title, get_elapsed, get_remaining]
    verification: none

