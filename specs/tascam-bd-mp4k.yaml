    "-30": "-030", "-29": "-029", "-28": "-028", "-27": "-027", "-26": "-026", "-25": "-025", "-24": "-024", "-23": "-023", "-22": "-022", "-21": "-021",
    "-20": "-020", "-19": "-019", "-18": "-018", "-17": "-017", "-16": "-016", "-15": "-015", "-14": "-014", "-13": "-013", "-12": "-012", "-11": "-011",
    "-10": "-010", "-9": "-009", "-8": "-008", "-7": "-007", "-6": "-006", "-5": "-005", "-4": "-004", "-3": "-003", "-2": "-002", "-1": "-001",
    "0": "+000", "1": "+001", "2": "+002", "3": "+003", "4": "+004", "5": "+005", "6": "+006", "7": "+007", "8": "+008", "9": "+009",
