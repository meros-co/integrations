  general.device_name: { type: string, description: "The device name" }
  general.language_switch: { type: bool, description: "Whether the language switch icon is shown" }
  general.languages: { type: string, description: "The languages offered, as JSON text of {value, name, default}" }
  general.logo_shown: { type: bool, description: "Whether the logo is shown" }
  general.logo_url: { type: string, description: "The logo image's address, empty for none" }
  general.qrcode: { type: string, description: "The address the QR code points to" }
  general.nav_shown: { type: bool, description: "Whether the navigation bar is shown" }
  layouts.*.name: { type: string, description: "An added layout, keyed by id: its name" }
  layouts.*.grid_count: { type: int, description: "Its number of grids" }
  layouts.*.in_use: { type: bool, description: "Whether it is in use" }
  layouts.*.grids: { type: string, description: "Its grids as JSON text of {x, y, width, height}" }
  layout_templates.*.name: { type: string, description: "A layout template, keyed by id: its name" }
  layout_templates.*.grids: { type: string, description: "Its grids as JSON text" }
  windows.*.name: { type: string, description: "A window, keyed by id: its name" }
  windows.*.in_use: { type: bool, description: "Whether it is the window in use (enable)" }
  windows.*.ndi: { type: bool, description: "Whether NDI streaming is on (window list)" }
  windows.*.take_target: { type: int, description: "The window its Take goes to (window list)" }
  windows.*.layout: { type: string, description: "Its layout's id" }
  windows.*.grid_count: { type: int, description: "Its number of grids" }
  windows.*.screen: { type: int, description: "The screen it is on" }
  windows.*.full_screen: { type: bool, description: "Whether it is full screen" }
  windows.*.shown: { type: bool, description: "Whether it is shown (false: minimized)" }
  windows.*.toolbar.audio_meters: { type: bool, description: "Whether audio meters are shown" }
  windows.*.toolbar.safe_areas: { type: bool, description: "Whether safe areas are shown" }
  windows.*.toolbar.center_crosses: { type: bool, description: "Whether center crosses are shown" }
  windows.*.toolbar.names: { type: bool, description: "Whether names are shown" }
  windows.*.ndi_streaming: { type: bool, description: "Whether it is in NDI streaming mode (get_status)" }
  windows.*.take.auto: { type: bool, description: "Whether the Take is automatic" }
  windows.*.take.target: { type: string, description: "The window the Take goes to" }
  windows.*.take.center_cross: { type: bool, description: "Whether center crosses are copied" }
  windows.*.take.title: { type: bool, description: "Whether titles are copied" }
  windows.*.take.safe_area: { type: bool, description: "Whether safe areas are copied" }
  windows.*.take.audio_meter: { type: bool, description: "Whether audio meters are copied" }
  windows.*.take.border: { type: bool, description: "Whether borders are copied" }
  grids.*.*.source: { type: string, description: "A grid, keyed by window then grid id: its source's id (stream_id)" }
  grids.*.*.source_name: { type: string, description: "Its source's name" }
  grids.*.*.audio: { type: string, description: "on, or off when muted" }
  grids.*.*.name: { type: string, description: "Its name" }
  grids.*.*.name_color: { type: string, description: "Its name's font color" }
  grids.*.*.name_size: { type: int, description: "Its name's font size" }
  grids.*.*.pvw: { type: bool, description: "Whether its PVW tally is on" }
  grids.*.*.pgm: { type: bool, description: "Whether its PGM tally is on" }
  grids.*.*.active: { type: int, description: "Tally summary: 0 none, 1 PVW, 2 PVW and PGM" }
  grids.*.*.frame_rate: { type: int, description: "Its source's frame rate" }
  grids.*.*.resolution: { type: string, description: "Its source's resolution, such as 1080x720" }
  grids.*.*.url: { type: string, description: "Its NDI source's web address" }
  grids.*.*.safe_area: { type: bool, description: "Whether its safe area is shown (grid settings)" }
  grids.*.*.audio_meter: { type: bool, description: "Whether its audio meter is shown" }
  grids.*.*.center_cross: { type: bool, description: "Whether its center cross is shown" }
  grids.*.*.stream_mode: { type: string, description: "auto, main or sub" }
  screens.*: { type: string, description: "A screen of the host, keyed by id: its label" }
  border.color: { type: int, description: "The border color as a 24-bit RGB number" }
  border.shown: { type: bool, description: "Whether the border is shown" }
  audio_gain: { type: int, unit: dB, description: "The audio gain of the pulled sources" }
  ndi_output.window: { type: string, description: "The window the NDI output sends" }
  ndi_output.host: { type: string, description: "The host name" }
  ndi_output.name: { type: string, description: "The NDI channel name" }
  ndi_output.resolution: { type: int, description: "The resolution's value, 0 custom" }
  ndi_output.width: { type: int, description: "The resolution's width" }
  ndi_output.height: { type: int, description: "The resolution's height" }
  ndi_output.aspect_ratio: { type: int, description: "The aspect ratio's id, 0 no limit, 999 custom" }
  ndi_output.aspect_width: { type: int, description: "The custom aspect ratio's width" }
  ndi_output.aspect_height: { type: int, description: "The custom aspect ratio's height" }
  ndi_output.frame_rate: { type: int, description: "The frame rate, 0 custom" }
  ndi_output.custom_frame_rate: { type: int, description: "The custom frame rate" }
  sources.*.ip: { type: string, description: "A discovered NDI source, keyed by name: its address" }
  sources.*.url: { type: string, description: "Its address and port" }
  sources.*.official: { type: bool, description: "Whether it is an official source" }
  ndi_discovery.groups: { type: string, description: "The NDI groups searched, as JSON text" }
  ndi_discovery.manual_ips: { type: string, description: "The addresses searched outside the subnet, as JSON text" }

telemetry:
  poll:
    - every_ms: 3000
      send:
        - { method: GET, path: /api/output/tabs_get.json }
    - every_ms: 30000
      send:
        - { method: GET, path: /api/config/general/get.json }
        - { method: GET, path: /api/config/nav/nav.json }
        - { method: GET, path: /api/output/icon.json }
        - { method: GET, path: /api/pattern/template.json }
        - { method: GET, path: /api/window/get_screen_list.json }
        - { method: GET, path: /api/output/GetEnableBorder.json }
        - { method: GET, path: /api/audio/getGlobalGain.json }
        - { method: GET, path: /api/ndi/get.json }
        - { method: GET, path: /api/source/get.json }
        - { method: GET, path: /api/discovery/scan/groupChecked.json }
        - { method: GET, path: /api/discovery/scan/getManualIps.json }
  updates:
    - path: "^/api/config/general/get\\.json$"
      json_match: { "$.result": "^ok$" }
      json: { name: "$.data.deviceName", lang: "$.data.languageShow", langs: "$.data.languageOptions", logo: "$.data.logoShow", logo_url: "$.data.logoUrl", qr: "$.data.qrcode" }
      state:
        general.device_name: "{name}"
        general.language_switch: "{lang}"
        general.languages: "{langs}"
        general.logo_shown: "{logo}"
        general.logo_url: "{logo_url}"
        general.qrcode: "{qr}"
    - path: "^/api/config/nav/nav\\.json$"
      json_match: { "$.result": "^ok$" }
      json: { home: "$.data.main_nav.home" }
      state: { general.nav_shown: "{home}" }
    - path: "^/api/output/icon\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", nm: "$.number", name: "$.name", use: "$.use_output", pos: "$.position" }
      replace: layouts
      state:
        "layouts.{id}.name": "{name}"
        "layouts.{id}.grid_count": "{nm}"
        "layouts.{id}.in_use": { value: "{use}", map: { "1": true, "0": false } }
        "layouts.{id}.grids": "{pos}"
    - path: "^/api/pattern/template\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", name: "$.name", pos: "$.position" }
      replace: layout_templates
      state:
        "layout_templates.{id}.name": "{name}"
        "layout_templates.{id}.grids": "{pos}"
    - path: "^/api/window/get_screen_list\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", label: "$.label" }
      replace: screens
      state: { "screens.{id}": "{label}" }
    - path: "^/api/output/GetEnableBorder\\.json$"
      json_match: { "$.result": "^ok$" }
      json: { c: "$.data.bordercolor", e: "$.data.bordercolor_enabled" }
      state:
        border.color: "{c}"
        border.shown: { value: "{e}", map: { "1": true, "0": false } }
    - path: "^/api/audio/getGlobalGain\\.json$"
      json_match: { "$.result": "^ok$" }
      json: { g: "$.data.audioGain" }
      state: { audio_gain: "{g}" }
    - path: "^/api/ndi/get\\.json$"
      json_match: { "$.result": "^ok$" }
      json: { o: "$.data.output", h: "$.data.host", nm: "$.data.name", r: "$.data.resolution", w: "$.data.customResolution.width", ht: "$.data.customResolution.height", a: "$.data.aspectRatio", aw: "$.data.customAspectRatio.width", ah: "$.data.customAspectRatio.height", f: "$.data.frameRate", cf: "$.data.customFrameRate" }
      state:
        ndi_output.window: "{o}"
        ndi_output.host: "{h}"
        ndi_output.name: "{nm}"
        ndi_output.resolution: "{r}"
        ndi_output.width: "{w}"
        ndi_output.height: "{ht}"
        ndi_output.aspect_ratio: "{a}"
        ndi_output.aspect_width: "{aw}"
        ndi_output.aspect_height: "{ah}"
        ndi_output.frame_rate: "{f}"
        ndi_output.custom_frame_rate: "{cf}"
    - path: "^/api/source/get\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", ip: "$.ip", url: "$.url", official: "$.official" }
      replace: sources
      state:
        "sources.{id:key}.ip": "{ip}"
        "sources.{id:key}.url": "{url}"
        "sources.{id:key}.official": "{official}"
    - path: "^/api/discovery/scan/groupChecked\\.json$"
      json_match: { "$.result": "^ok$" }
      json: { g: "$.data" }
      state: { ndi_discovery.groups: "{g}" }
    - path: "^/api/discovery/scan/getManualIps\\.json$"
      json_match: { "$.result": "^ok$" }
      json: { i: "$.data" }
      state: { ndi_discovery.manual_ips: "{i}" }

    # ── Windows, then each window's grids, screen, toolbar, NDI, Take ──
    - path: "^/api/output/tabs_get\\.json$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", name: "$.name", enable: "$.enable", ndi: "$.NDIStatus", take: "$.takeTarget" }
      replace: windows
      state:
        "windows.{id}.name": "{name}"
        "windows.{id}.in_use": "{enable}"
        "windows.{id}.ndi": "{ndi}"
        "windows.{id}.take_target": "{take}"
      then_send:
        - { method: GET, path: /api/output/get.json, query: { output: "{id}" } }
        - { method: GET, path: /api/window/get_window_position.json, query: { output: "{id}" } }
        - { method: GET, path: /api/output/get_state_contol.json, query: { output: "{id}" } }
        - { method: GET, path: /api/ndi/get_status.json, query: { output: "{id}" } }
        - { method: GET, path: /api/ndi/get_take.json, query: { output: "{id}" } }
    - path: "^/api/output/get\\.json\\?output=(\\d+)$"
      json_match: { "$.result": "^ok$" }
      json: { l: "$.data.layout_id", nm: "$.data.layout_number" }
      state:
        "windows.{1}.layout": "{l}"
        "windows.{1}.grid_count": "{nm}"
    - path: "^/api/output/get\\.json\\?output=(\\d+)$"
      json_match: { "$.result": "^ok$" }
      json_each: "$.data.layout"
      json: { id: "$.id", sid: "$.stream_id", sname: "$.stream_name", vol: "$.volume", pn: "$.pattern_name", pc: "$.pattern_color", ps: "$.pattern_size", pvw: "$.PVW", pgm: "$.PGM", act: "$.Active", fr: "$.frameRate", ar: "$.aspectRatio", url: "$.url" }
      replace: "grids.{1}"
      state:
        "grids.{1}.{id}.source": "{sid}"
        "grids.{1}.{id}.source_name": "{sname}"
        "grids.{1}.{id}.audio": "{vol}"
        "grids.{1}.{id}.name": "{pn}"
        "grids.{1}.{id}.name_color": "{pc}"
        "grids.{1}.{id}.name_size": "{ps}"
        "grids.{1}.{id}.pvw": { value: "{pvw}", map: { "1": true, "0": false } }
        "grids.{1}.{id}.pgm": { value: "{pgm}", map: { "1": true, "0": false } }
        "grids.{1}.{id}.active": "{act}"
        "grids.{1}.{id}.frame_rate": "{fr}"
        "grids.{1}.{id}.resolution": "{ar}"
        "grids.{1}.{id}.url": "{url}"
    - path: "^/api/window/get_window_position\\.json\\?output=(\\d+)$"
      json_match: { "$.result": "^ok$" }
      json: { s: "$.data.screen", f: "$.data.isFull", v: "$.data.isShow" }
      state:
        "windows.{1}.screen": "{s}"
        "windows.{1}.full_screen": "{f}"
        "windows.{1}.shown": "{v}"
    - path: "^/api/output/get_state_contol\\.json\\?output=(\\d+)$"
      json_match: { "$.result": "^ok$" }
      json: { a: "$.data.soundColumn.enable", s: "$.data.securityBox.enable", c: "$.data.centerline.enable", nm: "$.data.nameEnable.enable" }
      state:
        "windows.{1}.toolbar.audio_meters": { value: "{a}", map: { "1": true, "0": false, "true": true, "false": false } }
        "windows.{1}.toolbar.safe_areas": { value: "{s}", map: { "1": true, "0": false, "true": true, "false": false } }
        "windows.{1}.toolbar.center_crosses": { value: "{c}", map: { "1": true, "0": false, "true": true, "false": false } }
        "windows.{1}.toolbar.names": { value: "{nm}", map: { "1": true, "0": false, "true": true, "false": false } }
    - path: "^/api/ndi/get_status\\.json\\?output=(\\d+)$"
      json_match: { "$.result": "^ok$" }
      json: { e: "$.data.enable" }
      state: { "windows.{1}.ndi_streaming": "{e}" }
    - path: "^/api/ndi/get_take\\.json\\?output=(\\d+)$"
      json_match: { "$.result": "^ok$" }
      json: { a: "$.data.autoTake", t: "$.data.takeTarget", c: "$.data.centerLine", ti: "$.data.title", s: "$.data.safeFrame", v: "$.data.volumeMeter", b: "$.data.border" }
      state:
        "windows.{1}.take.auto": "{a}"
        "windows.{1}.take.target": "{t}"
        "windows.{1}.take.center_cross": "{c}"
        "windows.{1}.take.title": "{ti}"
        "windows.{1}.take.safe_area": "{s}"
        "windows.{1}.take.audio_meter": "{v}"
        "windows.{1}.take.border": "{b}"
    - path: "^/api/output/get_single_layout\\.json\\?output_id=(\\d+)&id=(\\d+)$"
      json_match: { "$.result": "^ok$" }
      json: { nm: "$.data.name", s: "$.data.size", c: "$.data.color", sa: "$.data.safe", sc: "$.data.soundColumn", cl: "$.data.centerline" }
      state:
        "grids.{1}.{2}.name": "{nm}"
        "grids.{1}.{2}.name_size": "{s}"
        "grids.{1}.{2}.name_color": "{c}"
        "grids.{1}.{2}.safe_area": "{sa}"
        "grids.{1}.{2}.audio_meter": "{sc}"
        "grids.{1}.{2}.center_cross": "{cl}"
    - path: "^/api/output/get_stream_mode\\.json\\?output=(\\d+)&id=(\\d+)$"
      json_match: { "$.result": "^ok$" }
      json: { m: "$.data.mode" }
      state: { "grids.{1}.{2}.stream_mode": "{m}" }

    # ── Read-backs ──────────────────────────────────────────────────────
    - path: "^/api/pattern/(add|remove|modify)\\.json(\\?.*)?$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/output/icon.json }]
    - path: "^/api/(window/new|output/tabs_modify|window/close_window|window/set_window_position|output/layout|output/delete_all|output/set_state_contol|output/window_audio_set|output/set_pvw_pgm|ndi/set_take|ndi/apply_take)\\.json$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/output/tabs_get.json }]
    - path: "^/api/ndi/set_status\\.json$"
      json: {}
      then_send: [{ method: GET, path: /api/output/tabs_get.json }]
    - path: "^/api/output/set_single_layout\\.json$"
      request_match: { "$.output": "^(\\d+)$", "$.id": "^(\\d+)$" }
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send:
        - { method: GET, path: /api/output/get_single_layout.json, query: { output_id: "{1}", id: "{2}" } }
        - { method: GET, path: /api/output/get.json, query: { output: "{1}" } }
    - path: "^/api/output/EnableBorder\\.json$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/output/GetEnableBorder.json }]
    - path: "^/api/audio/setGlobalGain\\.json$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/audio/getGlobalGain.json }]
    - path: "^/api/ndi/set\\.json$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/ndi/get.json }]
    - path: "^/api/(source/modify|webSite/refresh)\\.json$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send: [{ method: GET, path: /api/source/get.json }]
    - path: "^/api/discovery/scan/addManualIp\\.json$"
      json_match: { "$.result": "^ok$" }
      json: {}
      then_send:
        - { method: GET, path: /api/discovery/scan/groupChecked.json }
        - { method: GET, path: /api/discovery/scan/getManualIps.json }
