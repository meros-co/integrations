spec: 1
id: resolume
name: Resolume Arena / Avenue (REST API)
vendor: Resolume
category: playback

# Written over the REST API rather than OSC. The REST API acknowledges every
# request with a status code, reads back the whole composition in one request,
# and is described by Resolume's own OpenAPI document. Resolume's OSC input is
# never acknowledged and its OSC output goes to a destination configured in
# Resolume, not to the sender. The four command names of the earlier OSC spec
# are kept, with the same effect.

source:
  - title: Arena & Avenue REST API (OpenAPI 3.1.0 document, info.version 0.0.1)
    author: Resolume
    url: https://resolume.com/docs/restapi/swagger.yaml
    note: >
      Manufacturer document, retrieved 2026-09-30 and again 2026-10-14
      (served with Last-Modified 2026-10-09). Rendered at https://resolume.com/docs/restapi/. Every command
      here is an operation in it: paths under the server URL /api/v1, request
      bodies as the operation's requestBody, success and failure statuses as its
      responses. Parameter value shapes from components.schemas (BooleanParameter,
      RangeParameter, StringParameter, ChoiceParameter, EventParameter), object
      shapes from Composition, Layer, LayerGroup, Clip, Column, Deck, CrossFader
      and TempoController; effect chains, audio tracks, transports and
      transitions from VideoEffect, AudioEffect, ParameterCollection,
      VideoTrack, AudioTrack, TransportTimeline, TransportBPMSync,
      LayerTransition and ClipTransition. Arena-only layer groups from the 'layergroup' tag
      description and the ArenaOnly (402) response.
  - title: REST API & Webserver (support article, v7.8)
    author: Resolume
    url: https://resolume.com/support/en/restapi
    note: >
      Manufacturer document. Enabling the webserver in Preferences > Webserver,
      default listen port 8080 for Arena and Avenue, configurable listen port and
      address, and that each installation serves the reference for its own
      version.
  - title: Websocket API (support article, v7.8)
    author: Resolume
    url: https://resolume.com/support/en/websocket-api
    note: >
      Manufacturer document, retrieved 2026-10-02. The only channel on which
      Resolume pushes parameter changes: ws://address:port/api/v1 on the
      webserver's port; on connecting the composition state, then
      sources_update and effects_update; parameter actions {"action":
      <action>, "parameter": <path>} with subscribe, unsubscribe, set, get,
      reset and trigger; a parameter path is /parameter/by-id/<id> or "the
      logical path, based on the paths from the reference documentation,
      without /api/v1 and with the parameter name appended"; every action but
      trigger and reset answered with the parameter plus 'type'
      (parameter_subscribed, parameter_unsubscribed, parameter_get,
      parameter_set, parameter_update) and 'path'; parameter_update "is sent
      for parameters that have a subscription where the value is changed";
      the composition message "repeated ... when there are structural
      changes. For example: a column or layer is added/removed". Used by the
      resolume-push extension for all telemetry.
  - title: OSC (support article, v7.18)
    author: Resolume
    url: https://resolume.com/support/en/osc
    note: >
      Manufacturer document. Used only for the opacity scale: "set the opacity of
      layer 1 to 25%, you send ... 0.25".
  - title: arena-rest-example (Resolume's example application, MIT licence)
    author: Resolume
    url: https://github.com/resolume/arena-rest-example
    note: >
      Manufacturer code, not reference documentation. src/clip.js lists the five
      states of a clip's 'connected' parameter; used only for the state
      description below.

transport:
  type: http
  port: 8080
  scheme: http
  auth: none
  timeout_ms: 5000
  probe: { method: GET, path: /api/v1/product }

# The whole composition is kept current by push over Resolume's websocket API
# (the resolume-push extension, SPEC.md "Native extensions"): it reads the
# composition Resolume sends on connecting and after each structural change,
# subscribes to every parameter the state below shows by its unique id, and
# applies each update. Commands stay on REST.
extension: resolume-push

settings:
  # A safety re-read of the composition over REST, in seconds (0 for none),
  # restarted by every composition Resolume sends. Only for what the
  # websocket cannot report: a deck closed or opened from Resolume itself.
  composition_refresh_s: { type: int, min: 0, max: 3600, default: 60, label: Composition refresh, description: "Seconds without a composition from Resolume before it is read again, to catch a deck closed or opened in Resolume; 0 turns it off." }
  # Two kinds of state that can mean many updates or subscriptions.
  clip_positions: { type: bool, default: true, label: Clip positions, description: "On keeps every clip's transport position current, which changes continuously while a clip plays; off leaves it out of state." }
  effect_parameters: { type: bool, default: true, label: Effect parameters, description: "On keeps every effect's parameters current, one subscription each; off keeps only each effect's place, name and bypass." }

ports:
  - { port: 8080, protocol: http, role: control }
  - { port: 8080, protocol: ws, role: push }

