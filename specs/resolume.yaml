commands:
  # ── Product and composition ──────────────────────────────────────────────
  get_product:
    summary: Product name (Arena or Avenue) and version (operationId get_product)
    send: { method: GET, path: /api/v1/product }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_composition:
    summary: The complete composition with its decks, layers, columns, clips and layer groups (list_composition)
    send: { method: GET, path: /api/v1/composition }
    expect: { status: 200, json_path: "$" }
    returns: value

  disconnect_all:
    summary: Disconnect every connected clip in the composition (composition_disconnect_all)
    send: { method: POST, path: /api/v1/composition/disconnect-all }
    expect: { status: 204 }
    returns: ack

  set_composition_master:
    summary: Set the composition master level, 0.0 to 1.0 (replace_composition, master RangeParameter)
    params:
      level: { type: float, min: 0.0, max: 1.0, required: true, label: Master, description: "Composition master level from 0.0 (off) to 1.0 (full)." }
    send: { method: PUT, path: /api/v1/composition, body: '{"master":{"value":{level:.3f}}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  set_composition_opacity:
    summary: Set the composition video opacity, 0.0 to 1.0 (replace_composition, video.opacity RangeParameter)
    params:
      opacity: { type: float, min: 0.0, max: 1.0, required: true, label: Opacity, description: "Composition video opacity from 0.0 (transparent) to 1.0 (opaque)." }
    send: { method: PUT, path: /api/v1/composition, body: '{"video":{"opacity":{"value":{opacity:.3f}}}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  set_composition_speed:
    summary: Set the composition speed RangeParameter value (replace_composition, speed); the document gives no range, see quirks
    params:
      speed: { type: float, required: true, label: Speed, description: "Speed value; the range is the parameter's own min and max, which Resolume reports and the document does not give." }
    send: { method: PUT, path: /api/v1/composition, body: '{"speed":{"value":{speed:.3f}}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  set_composition_bypassed:
    summary: Bypass or un-bypass the composition (replace_composition, bypassed BooleanParameter)
    params:
      bypassed: { type: bool, default: true, label: Bypass, description: "On bypasses the composition, off returns it to the output." }
    send: { method: PUT, path: /api/v1/composition, body: '{"bypassed":{"value":{bypassed}}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  set_crossfader:
    summary: Set the crossfader phase RangeParameter value (replace_composition, crossfader.phase); the document gives no range, see quirks
    params:
      phase: { type: float, required: true, label: Crossfader phase, description: "Crossfader position; the range is the parameter's own min and max, which Resolume reports and the document does not give." }
    send: { method: PUT, path: /api/v1/composition, body: '{"crossfader":{"phase":{"value":{phase:.3f}}}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  set_tempo:
    summary: Set the composition tempo in BPM (replace_composition, tempocontroller.tempo RangeParameter); the document gives no range, see quirks
    params:
      bpm: { type: float, required: true, label: Tempo, description: "Composition tempo in BPM; the allowed range is not documented." }
    send: { method: PUT, path: /api/v1/composition, body: '{"tempocontroller":{"tempo":{"value":{bpm:.2f}}}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  # ── Parameters by unique id ──────────────────────────────────────────────
  trigger_parameter:
    summary: >
      Trigger a button-type parameter by its unique id (trigger_parameter_by_id).
      This is how tempo tap, resync, tempo push and pull, and crossfader side A
      and B are pressed; their ids are in the state under tempo.* and crossfader.*.
    params:
      parameter_id: { type: int, min: 1, required: true, label: Parameter ID, description: "Unique id of the button-type parameter, such as the tempo tap or crossfader side ids held in the state." }
    send: { method: POST, path: "/api/v1/parameter/by-id/{parameter_id}/trigger" }
    expect: { status: 204 }
    returns: ack

  get_parameter:
    summary: The value of any parameter, by its unique id (get_parameter_by_id)
    params:
      parameter_id: { type: int, min: 1, required: true, label: Parameter ID, description: "Unique parameter id from the composition reply, which stays the same across sessions and reordering." }
    send: { method: GET, path: "/api/v1/parameter/by-id/{parameter_id}" }
    expect: { status: 200, json_path: "$.value" }
    returns: value

  set_parameter:
    summary: >
      Update any parameter by its unique id (set_parameter_by_id). The body is
      JSON in the shape of the document's parameter schema for that parameter's
      type, such as {"value": 0.5} for a RangeParameter.
    params:
      parameter_id: { type: int, min: 1, required: true, label: Parameter ID, description: "Unique parameter id from the composition reply, which stays the same across sessions and reordering." }
      body: { type: json, required: true, label: Value, description: "JSON in the shape of the document's parameter schema for that parameter's type, such as {\"value\": 0.5} for a RangeParameter." }
    send: { method: PUT, path: "/api/v1/parameter/by-id/{parameter_id}", body: "{body}", content_type: application/json }
    expect: { status: 204 }
    returns: ack

  reset_parameter:
    summary: Reset a parameter to its default value, by its unique id (reset_parameter_by_id)
    params:
