  clips.*.beat_snap: { type: string, description: "Clip beat snap, the selected option's name" }
  clips.*.color: { type: string, description: "Clip colour, the selected option's name" }
  clips.*.volume: { type: float, description: "Clip audio volume, in Resolume's own scale" }
  clips.*.opacity: { type: float, description: "Clip video opacity, 0.0 to 1.0" }
  effects.*.chain: { type: string, description: "Effect chain the effect is in: video or audio; keyed by the effect's unique id" }
  effects.*.owner: { type: string, description: "What the effect is on: composition, layer, group or clip" }
  effects.*.owner_id: { type: int, description: "Unique id of the layer, layer group or clip the effect is on; absent on the composition" }
  effects.*.position: { type: int, description: "1-based place in its chain, the offset effect commands take" }
  effects.*.name: { type: string, description: "Effect name" }
  effects.*.display_name: { type: string, description: "Name shown for the effect, as rename commands set it" }
  effects.*.removable: { type: bool, description: "Video effect can be removed (Transform, for one, cannot)" }
  effects.*.bypassed: { type: bool, description: "Effect bypassed; absent for an effect that cannot be bypassed" }
  effects.*.params.*: { type: object, description: "One effect parameter, keyed by Resolume's own name for it: id (for set_parameter and get_phase_source), valuetype, value, and min and max or options where the parameter has them; left out with the effect_parameters setting off" }
  effects.*.mixer.*: { type: object, description: "One parameter of a video effect's mixer (its blend mode and opacity), in the same shape as params" }

quirks:
  - models: [all]
    severity: critical
    text: >
      The webserver is off by default. It is enabled under Preferences >
      Webserver ("Enable Webserver & REST API"). Arena and Avenue listen on port
      8080 by default; the listen port and address can be changed there. The API
      has no authentication: anyone who can reach the port can control the
      composition.

  - models: [all]
    severity: warning
    text: >
      The REST API arrived with Arena and Avenue 7.8 (Resolume's support article
      is written for 7.8). The OpenAPI document is the current one and carries no
      per-endpoint version; each installation serves the reference for its own
      version under Preferences > Webserver. An endpoint an older version lacks
      answers 404, the same as a missing layer or clip.

  - models: [all]
    severity: warning
    text: >
      Layer, column, clip, deck and group numbers are 1-based positions and
      change when items are reordered, added or removed. The document gives no
      maximum; a position that does not exist answers 404. The state is keyed by
      each item's unique id instead, which the document says stays constant
      across sessions and reordering. layers.*.position, columns.*.position,
      decks.*.position and groups.*.position are each item's 1-based place in
      the composition's own list, updated with every composition Resolume
      sends; the document says positions are "by position in the
      composition" but does not state in words that the list order is that
      position. A layer listed only inside a layer group has no position.

  - models: [all]
    severity: warning
    text: >
      Only the layers and clips of the active deck can be read or changed (Deck
      schema). After select_deck, layer and clip positions refer to the newly
      selected deck. A deck switch, by any client, turns that deck's
      'selected' parameter true; the extension then reads the composition
      again over REST, since the websocket article lists only layers and
      columns added or removed as structural changes that resend it.

  - models: [all]
    severity: warning
    text: >
      Connect endpoints model a mouse button. With no body (trigger_clip,
      trigger_column) Resolume sends a press and a release, as a short click.
      press_clip and press_column send only the press (true) or only the
      release (false); a press must be followed by a release. What a click does
      depends on the clip's trigger style set in Resolume.

  - models: [all]
    severity: info
    text: >
      clear_layer disconnects the playing clip and keeps the clip, which is what
      the OSC /clear address did. clear_layer_clips and clear_clip are
      different: they remove the clips' content from the slots.

  - models: [all]
    severity: warning
    text: >
      Setters send a PUT whose body holds only the property being changed, such
      as {"video":{"opacity":{"value":0.250}}}. The document's schemas mark no
      property as required, and the operations are described as updating "the
      layer and/or clips", but the document does not state in words that
      properties left out are unchanged.

  - models: [all]
    severity: warning
    text: >
      The document gives no value range for any individual RangeParameter; each
      one reports its own min and max in the composition reply. Opacity and
      master levels are taken as 0.0 to 1.0, the scale Resolume's OSC article
      gives for opacity. Composition and group speed, crossfader phase and tempo
      are sent unbounded, and what Resolume does with a value outside the
      parameter's min and max is not documented.

  - models: [all]
    severity: info
    text: >
      Tempo tap, resync, tempo push and pull, and crossfader side A and B are
      event parameters with no fixed REST path. They are pressed with
      trigger_parameter using the id the composition reply gives, which the
      state holds under tempo.*_parameter and crossfader.side_*_parameter.

  - models: [all]
    severity: info
    text: >
      State is pushed. The resolume-push extension opens Resolume's websocket
      (ws://host:port/api/v1, the webserver's port), reads the composition
      Resolume sends on connecting and again after each structural change,
      and subscribes to every parameter the state shows by
      /parameter/by-id/<id>: the composition's name, description, master,
      opacity, speed, bypass, render depth, frame rate, default clip target,
      trigger style and beat snap, audio volume and pan, crossfader phase,
      behaviour and curve, tempo and play state; each layer's name,
      opacity, master, bypass, solo, selected, crossfader side, mask mode,
      column-trigger and fader-start flags, colour, audio volume and pan,
      and transition duration and blend mode; each column's name,
      connected, selected, colour and beat snap; each deck's name, selected
      and colour; each layer group's name, opacity, master, speed, bypass,
      solo, selected, crossfader side, column-trigger flag, colour and audio
      volume and pan; each clip's name, connected state, transport type,
      trigger style, target, beat snap, colour, audio volume, video
      opacity, transport position, speed, play direction, play mode and
      duration; and every effect on the composition, a layer, a layer group
      or a clip, in its video or audio chain: its bypass and each of its
      parameters and mixer parameters. A new composition is compared with
      the last: items that went are removed from state and their parameters
      unsubscribed, new ones are read and subscribed. A composition with
      many clips and effects means many subscriptions (a loaded clip alone
      has its transport, its settings and its Transform effect's
      parameters), sent once per connection and once per new item; the
      effect_parameters setting off drops the effect parameters, and
      clip_positions off drops the transport positions, which change
      continuously while clips play. Nothing is polled.

  - models: [all]
    severity: warning
    text: >
      Three changes bring no new composition on the websocket, so it is
      read again over REST (GET /api/v1/composition) for them: a deck switch
      (see above); after this session's commands that change the structure
      in a way the article does not name succeed (deck commands,
      open_composition, new_composition, undo and redo; every effect add,
      move, removal, rename and copy; layer, group, column and clip moves
      and swaps; and opening, clearing, inserting, merging and removing
      tracks of clips, whose effects and transport change with what they
      hold); and a deck closed or opened from Resolume itself or another client,
      because a deck's 'closed' is a plain boolean in the Deck schema, not a
      parameter with an id, and cannot be subscribed. For the last only, the
      composition is read again when none has arrived for
      composition_refresh_s seconds (default 60; 0 turns it off, and
      decks.*.closed then changes only with a structural change). The
      composition message's exact shape is not documented beyond "similar
      to GET /composition"; a bare composition object, or one wrapped as
      {"type": ..., "value": <composition>} like sources_update, is read.

  - models: [all]
    severity: info
    text: >
      A layer's active clip is the clip whose connected state is Connected or
      Connected & previewing (the states Resolume's example application
      lists), taken from the composition's active_clip when it gives one.
      layers.*.active_clip and active_clip_name are removed when nothing
      plays. A reply to get_composition, read by the rules above, does not
      remove them, as a null is not assigned there; the next pushed change
      corrects it.

  - models: [all]
    severity: info
    text: >
      Clip and composition file paths are percent-encoded file:/// URLs with
      forward slashes, even on Windows (file:///C:/Shows/Main%20Show.avc). The
      body is sent as given; the caller encodes spaces and #, %, & and ?.

  - models: [all]
    severity: info
    text: >
      undo and redo answer 412 when there is nothing to undo or redo. open,
      new, save and structural changes answer 412 when the composition is
      locked.

  - models: [avenue]
    severity: info
    text: >
      Avenue answers 402 to every layer group endpoint. The document also lists
      the same 402 response on get_deck, replace_deck and the deck
      delete and duplicate operations, while describing it as applying to layer
      groups only; whether Avenue refuses those deck operations is ambiguous.

  - models: [all]
    severity: warning
    text: >
      Effect commands follow the document's own forms: an effect is added
      with the text effect:///video/<name> or effect:///audio/<name>, with
      /<preset> after the name for a preset, the name percent-encoded as in
      a URL; an existing effect is moved by naming it as
      effects/by-id/<id>, the document's effect-by-id example, so it can
      come from any chain; and an effect is removed or renamed by its place
      in its chain (by id, rename_effect renames any effect). The document
      does not say whether a chain's offsets count from 0 or 1; they are
      taken as 1-based like every other index in it, and effects.*.position
      counts the same way. A video chain starts with Transform, which cannot
      be removed (effects.*.removable false). By-id and selected forms have
      no move-from-chain or rename-at-offset operation in the document.

  - models: [all]
    severity: warning
    text: >
      Setters for choice parameters (crossfader side, transition blend mode,
      play direction and mode, transport type, trigger style, target, beat
      snap, colour, mask mode, crossfader behaviour and curve, tempo play
      state, default clip settings) send the option's name as the value,
      {"value": "<name>"}, the way the ChoiceParameter schema reports the
      selected option; the document lists no option names and does not say
      whether a value is accepted in place of the option's index. Each
      parameter's options are in the composition reply (get_composition),
      and an effect parameter's in effects.*.params.*.options.

  - models: [all]
    severity: info
    text: >
      Volume and pan of the composition, layers, groups and clips, a
      layer's transition duration, and a clip's speed, position and
      duration are RangeParameters whose unit and range the document does
      not give; each reports its own min and max in the composition reply.
      They are sent as given, unbounded, as speed is.

  - models: [all]
    severity: info
    text: >
      Not offered: clip thumbnails and monitor snapshots, which are binary
      images (PNG, JPEG or GIF) the format does not return, and setting a
      thumbnail by upload (multipart); the deprecated openfile operations
      (open_clip loads files and sources); the batched clips/open; resetting
      a parameter by its name under an item (reset_parameter does it by
      id); and the selected-item variants of setters. A parameter of an
      item that the state does not name (a layer's dashboard, autopilot or
      video size, a clip's source parameters or RGBA channels) is read with
      get_layer, get_clip and the other get commands and set with
      set_parameter by the id they give. A phase source's sub-parameters
      are read with get_phase_source and set with set_parameter; they are
      not kept in state.

  - models: [all]
    severity: critical
    text: >
      delete_layer, delete_column, delete_deck, delete_group and their by-id
      forms, clear_*_clips, remove_clip_*_track, merge_clip with
      clear_source, and every effect removal cannot be undone from here
      except with undo; set_composition_high_detail and
      set_composition_frame_rate stop any recording in progress, as the
      document says.
