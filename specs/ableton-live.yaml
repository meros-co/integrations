        - { address: /live/scene/start_listen/name, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(scene/get/name|error)$" }
        - { address: /live/scene/start_listen/tempo, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(scene/get/tempo|error)$" }
        - { address: /live/scene/start_listen/tempo_enabled, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(scene/get/tempo_enabled|error)$" }
        - { address: /live/scene/start_listen/time_signature_denominator, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(scene/get/time_signature_denominator|error)$" }
        - { address: /live/scene/start_listen/time_signature_enabled, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(scene/get/time_signature_enabled|error)$" }
        - { address: /live/scene/start_listen/time_signature_numerator, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(scene/get/time_signature_numerator|error)$" }
    - address: "^/live/scene/get/color$"
      state: { "scenes.{arg0:+1}.color": "{arg1}" }
    - address: "^/live/scene/get/color_index$"
      state: { "scenes.{arg0:+1}.color_index": "{arg1}" }
    - address: "^/live/scene/get/is_triggered$"
      state: { "scenes.{arg0:+1}.is_triggered": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/scene/get/name$"
      state: { "scenes.{arg0:+1}.name": "{arg1}" }
    - address: "^/live/scene/get/tempo$"
      state: { "scenes.{arg0:+1}.tempo": "{arg1}" }
    - address: "^/live/scene/get/tempo_enabled$"
      state: { "scenes.{arg0:+1}.tempo_enabled": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/scene/get/time_signature_denominator$"
      state: { "scenes.{arg0:+1}.time_signature_denominator": "{arg1}" }
    - address: "^/live/scene/get/time_signature_enabled$"
      state: { "scenes.{arg0:+1}.time_signature_enabled": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/scene/get/time_signature_numerator$"
      state: { "scenes.{arg0:+1}.time_signature_numerator": "{arg1}" }

quirks:
  - models: [all]
    severity: warning
    text: >
      AbletonOSC sends replies and listener updates to the IP address of the last
      client that sent it anything, on UDP 11001. Only one controller can follow
      Live's state at a time: another client sending to the same Live moves the
      updates to itself. feedback_port must be the port AbletonOSC replies to
      (11001); commands are sent from that port too.
  - models: [all]
    severity: warning
    text: >
      Tracks, scenes, clip slots, devices and parameters are addressed by index,
      and state is keyed by those indexes from 1. Adding, deleting or moving a
      track, scene or device in Live shifts the indexes: the listeners already
      registered keep reporting under their old index, and nothing pushes the
      change. resync (or reload_tracks and reload_scenes) reads everything again
      and registers the listeners under the new indexes; reading song.num_tracks
      (polled nowhere) is how a consumer can notice the count changed. Return
      tracks and the master track are not reachable through AbletonOSC's track
      API.
  - models: [all]
    severity: info
    text: >
      What Live can report as it changes is listened to; what it cannot (the
      Live Object Model's get-only properties, marked "as last read") is read once
      when the Set is walked and when a command reads or sets it. Undo and redo
      availability are polled every 5 s. The song position (current_song_time),
      the track output meters and clip playing positions change continuously and
      are reported only after listen_song_time, listen_track_meters or
      listen_clip_playing_position; song.beat is always reported, once per beat.
  - models: [all]
    severity: info
    text: >
      The Set is walked by reading one index after another (is_foldable for
      tracks, is_empty for scenes, is_group_slot for clip slots, class_name for
      devices, the send level for sends) until AbletonOSC answers /live/error past
      the end. Those reads are therefore not offered as commands (reading one would
      walk again from the next index). Each read waits for its reply, so a large
      Set takes a few seconds to appear in state; commands go ahead of the walk.
  - models: [all]
    severity: info
    text: >
      Device parameters are not walked on connecting: a Set holds thousands, and
      each listened parameter costs Live work on every change. watch_device_parameters
      reads one device's parameter names and listens to their values;
      stop_listening_device_parameter stops one. A parameter's minimum, maximum and
      quantization are only available as lists for the whole device, which this
      format cannot read into state.
  - models: [all]
    severity: info
    text: >
      AbletonOSC answers a list (track names, scene names, clip and device names
      of a track, cue points, a device's parameter names and values, a clip's
      notes, the available routing types and channels, track_data) as one message
      with a variable number of arguments, which the spec format cannot read item
      by item; those queries are left out, and the walks read the same items one
      at a time where AbletonOSC allows it. Cue points and notes cannot be read at
      all; the routing choices must be known from Live's own menus.
  - models: [all]
    severity: warning
    text: >
      Booleans are sent as the integers 1 and 0, as AbletonOSC's README writes
      them ("1=on, 0=off"); Live stores them as booleans and AbletonOSC reports
      them as OSC true and false.
  - models: [all]
    severity: info
    text: >
      fired_slot_index and playing_slot_index are numbered from 1 here, so 0 means
      no slot and -1 that the track's stop button was fired (Live's -1 and -2).
      They are how a clip's playing state is followed: a clip's own is_playing and
      is_triggered cannot be listened to and are read only once.
  - models: [all]
    severity: info
    text: >
      A property AbletonOSC cannot read for an object (fold_state of a track that
      is not a group, warp settings of a MIDI clip, arm of a group track) answers
      /live/error, which goes to application.last_error. The walks only ask for
      arm, monitoring and fold state where they apply.
  - models: [all]
    severity: critical
    text: >
      delete_track, delete_scene, delete_return_track, delete_device, delete_clip,
      remove_clip_notes and remove_all_clip_notes change the Set at once, with no
      confirmation; only Live's undo brings it back.
  - models: [all]
    severity: info
    text: >
      test shows a confirmation message in Live's window; the probe reads the
      application version instead. AbletonOSC's /live/api/reload (a development
      reload of the script) is left out.
  - models: [all]
    severity: info
    text: >
      Ranges a consumer enters (tempo 20 to 999 BPM, signature numerator 1 to 99
      and denominator up to 16, clip transposition -48 to 48 semitones and detune
      -50 to 49 cents) are Live's user interface limits, not stated in the Live
      Object Model; Live refuses or clamps a value outside what it accepts.
  - models: [all]
    severity: info
    text: >
      current_monitoring_state is read and set as in (0), auto (1) and off (2), as
      Live's monitoring switch orders them; the Live Object Model page does not list
      the values. A device's type is kept as the integer AbletonOSC reports (its
      README gives 1 audio effect, 2 instrument, 4 MIDI effect; a source comment
      gives 0, 1 and 2).
  - models: [all]
    severity: info
    text: >
      AbletonOSC sends /live/startup when the script starts, which happens when
      Live starts and when a Control Surface is chosen; whether it also does when
      Live loads another Set is not documented. On /live/startup every listener is
      registered and the Set read again; after loading a Set without it, call
      resync.
  - models: [all]
    severity: info
    text: >
      Levels are kept as Live gives them, without dB: the Live Object Model gives a track's output
      meters as 0.0 to 1.0 with no scale (Track: output_meter_left, output_meter_right,
      output_meter_level) and the mixer's volume and sends as DeviceParameter values with no range or
      law (MixerDevice), and AbletonOSC sends the raw values. 0.85 reading 0 dB on Live's volume fader
      is observed behaviour, not documented; Live's own dB text for a mixer parameter is not offered by
      AbletonOSC.
