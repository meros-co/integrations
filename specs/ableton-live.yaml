commands:
  test:
    summary: "Show AbletonOSC's confirmation message in Live and answer ok"
    send: { address: /live/test }
    expect: { address: /live/test, arg: 0 }
    returns: value

  get_version:
    summary: "Read Live's major version (the minor version goes to state)"
    send: { address: /live/application/get/version }
    expect: { address: /live/application/get/version, arg: 0 }
    returns: value

  get_log_level:
    summary: "Read AbletonOSC's log level"
    send: { address: /live/api/get/log_level }
    expect: { address: /live/api/get/log_level, arg: 0 }
    returns: value

  set_log_level:
    summary: "Set AbletonOSC's log level"
    params:
      level: { type: enum, values: [debug, info, warning, error, critical], required: true, label: Log level, description: "Lowest level AbletonOSC writes to its log file (logs/abletonosc.log in the script's folder); error and critical also come back as /live/error." }
    send:
      - { address: /live/api/set/log_level, args: [{ value: "{level}", type: string }] }
      - { address: /live/api/get/log_level }
    returns: none

  show_message:
    summary: "Show a message in Live's status bar"
    params:
      text: { type: string, max_length: 1024, required: true, label: Message, description: "Text shown in Live's status bar at the bottom of the window." }
    send: { address: /live/api/show_message, args: [{ value: "{text}", type: string }] }
    returns: none

  start_playing:
    summary: "Start playback (Live's Play button)"
    send: { address: /live/song/start_playing }
    returns: none

  stop_playing:
    summary: "Stop playback (Live's Stop button)"
    send: { address: /live/song/stop_playing }
    returns: none

  continue_playing:
    summary: "Continue playback from where it stopped"
    send: { address: /live/song/continue_playing }
    returns: none

  stop_all_clips:
    summary: "Stop every clip in the Session View"
    send: { address: /live/song/stop_all_clips }
    returns: none

  tap_tempo:
    summary: "Tap the tempo once, as the Tap button does"
    send: { address: /live/song/tap_tempo }
    returns: none

  undo:
    summary: "Undo the last operation"
    send: { address: /live/song/undo }
    returns: none

  redo:
    summary: "Redo the last undone operation"
    send: { address: /live/song/redo }
    returns: none

  capture_midi:
    summary: "Capture recently played MIDI into a clip"
    send: { address: /live/song/capture_midi }
    returns: none

  capture_and_insert_scene:
    summary: "Capture the playing clips into a new scene below the selected one"
    send: { address: /live/song/capture_and_insert_scene }
    returns: none

  trigger_session_record:
    summary: "Trigger Session Record, as the Session Record button does"
    send: { address: /live/song/trigger_session_record }
    returns: none

  jump_to_next_cue:
    summary: "Jump to the next cue point (locator)"
    send: { address: /live/song/jump_to_next_cue }
    returns: none

  jump_to_prev_cue:
    summary: "Jump to the previous cue point (locator)"
    send: { address: /live/song/jump_to_prev_cue }
    returns: none

  re_enable_automation:
    summary: "Re-enable automation overridden by hand"
    send: { address: /live/song/re_enable_automation }
    returns: none

  force_link_beat_time:
    summary: "Force Link's beat time to Live's"
    send: { address: /live/song/force_link_beat_time }
    returns: none

  create_return_track:
    summary: "Create a return track"
    send: { address: /live/song/create_return_track }
    returns: none

  add_or_delete_cue_point:
    summary: "Add a cue point (locator) at the playback position, or delete the one there"
    send: { address: /live/song/cue_point/add_or_delete }
    returns: none

  jump_by:
    summary: "Move the song position by a number of beats"
    params:
      beats: { type: float, required: true, label: Beats, description: "Beats to move by: positive forward, negative back." }
    send: { address: /live/song/jump_by, args: [{ value: "{beats}", type: float }] }
    returns: none

  create_audio_track:
    summary: "Create an audio track"
    params:
      position: { type: int, min: 0, required: true, label: Position, description: "Where the new one goes, numbered from 1 from the left (tracks) or top (scenes); 0 puts it at the end." }
    send: { address: /live/song/create_audio_track, args: [{ value: "{position:-1}", type: int }] }
    returns: none

  create_midi_track:
    summary: "Create a MIDI track"
    params:
      position: { type: int, min: 0, required: true, label: Position, description: "Where the new one goes, numbered from 1 from the left (tracks) or top (scenes); 0 puts it at the end." }
    send: { address: /live/song/create_midi_track, args: [{ value: "{position:-1}", type: int }] }
    returns: none

  create_scene:
    summary: "Create a scene"
    params:
      position: { type: int, min: 0, required: true, label: Position, description: "Where the new one goes, numbered from 1 from the left (tracks) or top (scenes); 0 puts it at the end." }
    send: { address: /live/song/create_scene, args: [{ value: "{position:-1}", type: int }] }
    returns: none

  duplicate_track:
    summary: "Duplicate a track, the copy going to its right"
    params:
      track: { type: int, min: 1, required: true, label: Track, description: "Track, numbered from 1 as in Live's Session View from the left; return tracks and the master track are not reachable." }
    send: { address: /live/song/duplicate_track, args: [{ value: "{track:-1}", type: int }] }
    returns: none

  duplicate_scene:
    summary: "Duplicate a scene, the copy going below it"
    params:
      scene: { type: int, min: 1, required: true, label: Scene, description: "Scene, numbered from 1 from the top of the Session View." }
    send: { address: /live/song/duplicate_scene, args: [{ value: "{scene:-1}", type: int }] }
    returns: none

  delete_track:
    summary: "Delete a track"
    params:
      track: { type: int, min: 1, required: true, label: Track, description: "Track, numbered from 1 as in Live's Session View from the left; return tracks and the master track are not reachable." }
    send: { address: /live/song/delete_track, args: [{ value: "{track:-1}", type: int }] }
    returns: none

  delete_scene:
    summary: "Delete a scene"
    params:
      scene: { type: int, min: 1, required: true, label: Scene, description: "Scene, numbered from 1 from the top of the Session View." }
    send: { address: /live/song/delete_scene, args: [{ value: "{scene:-1}", type: int }] }
    returns: none

  delete_return_track:
    summary: "Delete a return track"
    params:
      return_track: { type: int, min: 1, required: true, label: Return track, description: "Return track, numbered from 1 (A = 1)." }
    send: { address: /live/song/delete_return_track, args: [{ value: "{return_track:-1}", type: int }] }
    returns: none

  jump_to_cue_point:
    summary: "Jump to a cue point (locator) by number"
    params:
      cue_point: { type: int, min: 1, required: true, label: Cue point, description: "Cue point (locator), numbered from 1 in Arrangement order." }
    send: { address: /live/song/cue_point/jump, args: [{ value: "{cue_point:-1}", type: int }] }
    returns: none

  jump_to_cue_point_named:
    summary: "Jump to a cue point (locator) by name"
    params:
      name: { type: string, max_length: 1024, required: true, label: Name, description: "Name of the cue point, exactly as in the Arrangement." }
    send: { address: /live/song/cue_point/jump, args: [{ value: "{name}", type: string }] }
    returns: none

  rename_cue_point:
    summary: "Rename a cue point (locator)"
    params:
      cue_point: { type: int, min: 1, required: true, label: Cue point, description: "Cue point (locator), numbered from 1 in Arrangement order." }
      name: { type: string, max_length: 1024, required: true, label: Name, description: "New name of the cue point." }
    send: { address: /live/song/cue_point/set/name, args: [{ value: "{cue_point:-1}", type: int }, { value: "{name}", type: string }] }
    returns: none

  listen_song_time:
    summary: "Have Live report the song position as it moves (song.current_song_time)"
    send: { address: /live/song/start_listen/current_song_time }
    returns: none

  stop_listening_song_time:
    summary: "Stop the song position reports"
    send: { address: /live/song/stop_listen/current_song_time }
    returns: none

  reload_tracks:
    summary: "Read every track again: listeners, properties, clip slots, clips, devices and sends"
    send: { address: /live/song/get/num_tracks }
    expect: { address: /live/song/get/num_tracks, arg: 0 }
    returns: value

  reload_scenes:
    summary: "Read every scene again, with its listeners"
    send: { address: /live/song/get/num_scenes }
    expect: { address: /live/song/get/num_scenes, arg: 0 }
    returns: value

  get_arrangement_overdub:
    summary: "Read: mIDI Arrangement Overdub button on"
    send: { address: /live/song/get/arrangement_overdub }
    expect: { address: /live/song/get/arrangement_overdub, arg: 0 }
    returns: value

  set_arrangement_overdub:
    summary: "Set: mIDI Arrangement Overdub button on"
    params:
      value: { type: bool, required: true, label: Arrangement overdub, description: "On sets it: mIDI Arrangement Overdub button on; off clears it." }
    send:
      - { address: /live/song/set/arrangement_overdub, args: [{ value: "{value:bool01}", type: int }] }
      - { address: /live/song/get/arrangement_overdub }
    returns: none

  get_back_to_arranger:
    summary: "Read: back to Arrangement button lit (playback differs from the Arrangement); setting it off returns playback to the Arrangement"
    send: { address: /live/song/get/back_to_arranger }
    expect: { address: /live/song/get/back_to_arranger, arg: 0 }
    returns: value

  set_back_to_arranger:
    summary: "Set: back to Arrangement button lit (playback differs from the Arrangement); setting it off returns playback to the Arrangement"
    params:
      value: { type: bool, required: true, label: Back to Arrangement, description: "On sets it: back to Arrangement button lit (playback differs from the Arrangement); setting it off returns playback to the Arrangement; off clears it." }
    send:
      - { address: /live/song/set/back_to_arranger, args: [{ value: "{value:bool01}", type: int }] }
      - { address: /live/song/get/back_to_arranger }
    returns: none

  get_clip_trigger_quantization:
    summary: "Read: global launch quantization of the transport bar"
    send: { address: /live/song/get/clip_trigger_quantization }
    expect: { address: /live/song/get/clip_trigger_quantization, arg: 0 }
    returns: value

  set_clip_trigger_quantization:
    summary: "Set: global launch quantization of the transport bar"
    params:
      value: { type: enum, values: ["none", "8_bars", "4_bars", "2_bars", "1_bar", "1/2", "1/2t", "1/4", "1/4t", "1/8", "1/8t", "1/16", "1/16t", "1/32"], required: true, label: Global quantization, description: "The new value: global launch quantization of the transport bar." }
    send:
      - { address: /live/song/set/clip_trigger_quantization, args: [{ value: "{value:map.clip_trigger_quantization}", type: int }] }
      - { address: /live/song/get/clip_trigger_quantization }
    returns: none

  get_song_time:
    summary: "Read: playing position of the Live Set, in beats"
    send: { address: /live/song/get/current_song_time }
    expect: { address: /live/song/get/current_song_time, arg: 0 }
    returns: value

  set_song_time:
    summary: "Set: playing position of the Live Set, in beats"
    params:
      value: { type: float, min: 0.0, required: true, label: Song position, description: "The new value: playing position of the Live Set, in beats." }
    send:
