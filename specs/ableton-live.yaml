  tracks.*.slots.*.playing_status: { type: int, description: "A group slot's state: 0 stopped, 1 playing, 2 playing or recording; 0 for other slots" }
  tracks.*.slots.*.will_record_on_start: { type: bool, description: "The slot will record when launched, as last read" }
  tracks.*.slots.*.clip.color: { type: int, description: "Clip color as 0x00rrggbb" }
  tracks.*.slots.*.clip.color_index: { type: int, description: "Clip color as an index into Live's palette" }
  tracks.*.slots.*.clip.end_marker: { type: float, unit: beats, description: "End marker, in beats" }
  tracks.*.slots.*.clip.end_time: { type: float, unit: beats, description: "End time of the clip, in beats" }
  tracks.*.slots.*.clip.file_path: { type: string, description: "Path of an audio clip's sample file" }
  tracks.*.slots.*.clip.gain: { type: float, description: "Audio clip gain as a parameter value, 0 to 1" }
  tracks.*.slots.*.clip.gain_display_string: { type: string, description: "Audio clip gain as Live shows it (\"0.0 dB\")" }
  tracks.*.slots.*.clip.has_groove: { type: bool, description: "A groove is assigned" }
  tracks.*.slots.*.clip.is_audio_clip: { type: bool, description: "The clip is an audio clip" }
  tracks.*.slots.*.clip.is_midi_clip: { type: bool, description: "The clip is a MIDI clip" }
  tracks.*.slots.*.clip.is_overdubbing: { type: bool, description: "The clip is overdubbing" }
  tracks.*.slots.*.clip.is_playing: { type: bool, description: "The clip is playing or recording, as last read" }
  tracks.*.slots.*.clip.is_recording: { type: bool, description: "The clip is recording" }
  tracks.*.slots.*.clip.is_triggered: { type: bool, description: "The clip's launch button is blinking, as last read" }
  tracks.*.slots.*.clip.launch_mode: { type: string, description: "Launch mode" }
  tracks.*.slots.*.clip.launch_quantization: { type: string, description: "Launch quantization (global follows the transport bar)" }
  tracks.*.slots.*.clip.legato: { type: bool, description: "Legato mode on" }
  tracks.*.slots.*.clip.length: { type: float, unit: beats, description: "Length, in beats (the loop length when looping), as last read" }
  tracks.*.slots.*.clip.loop_end: { type: float, unit: beats, description: "Loop end, in beats" }
  tracks.*.slots.*.clip.loop_start: { type: float, unit: beats, description: "Loop start, in beats" }
  tracks.*.slots.*.clip.looping: { type: bool, description: "Loop switch on" }
  tracks.*.slots.*.clip.muted: { type: bool, description: "Clip muted (its Clip Activator off)" }
  tracks.*.slots.*.clip.name: { type: string, description: "Clip name" }
  tracks.*.slots.*.clip.pitch_coarse: { type: int, unit: semitones, description: "Audio clip transposition, in semitones" }
  tracks.*.slots.*.clip.pitch_fine: { type: float, unit: cents, description: "Audio clip detune, in cents" }
  tracks.*.slots.*.clip.playing_position: { type: float, unit: beats, description: "Playing position, in beats, while listened to" }
  tracks.*.slots.*.clip.position: { type: float, unit: beats, description: "Loop position (the loop start, moving the loop end with it), in beats" }
  tracks.*.slots.*.clip.ram_mode: { type: bool, description: "Audio clip loaded into RAM" }
  tracks.*.slots.*.clip.sample_length: { type: int, unit: samples, description: "Length of an audio clip's sample, in samples" }
  tracks.*.slots.*.clip.start_marker: { type: float, unit: beats, description: "Start marker, in beats" }
  tracks.*.slots.*.clip.start_time: { type: float, unit: beats, description: "Start time of the clip, in beats" }
  tracks.*.slots.*.clip.velocity_amount: { type: float, description: "How much note velocity affects an audio clip's volume, 0 to 1" }
  tracks.*.slots.*.clip.warp_mode: { type: string, description: "Warp mode of an audio clip" }
  tracks.*.slots.*.clip.warping: { type: bool, description: "Warp switch of an audio clip on" }
  tracks.*.slots.*.clip.will_record_on_start: { type: bool, description: "The clip will record when launched" }
  tracks.*.devices.*.class_name: { type: string, description: "Live's device class (Operator, Reverb, PluginDevice, AuPluginDevice, InstrumentGroupDevice...)" }
  tracks.*.devices.*.name: { type: string, description: "Device name as shown in the device chain" }
  tracks.*.devices.*.type: { type: int, description: "Device type: 1 audio effect, 2 instrument, 4 MIDI effect (as AbletonOSC's README gives it)" }
  tracks.*.devices.*.num_parameters: { type: int, description: "Number of parameters the device exposes" }
  tracks.*.devices.*.parameters.*.name: { type: string, description: "Parameter name, once the device's parameters are watched" }
  tracks.*.devices.*.parameters.*.value: { type: float, description: "Parameter value in its own range, while watched" }
  tracks.*.devices.*.parameters.*.value_string: { type: string, description: "Parameter value as Live shows it, while watched" }
  scenes.*.color: { type: int, description: "Scene color as 0x00rrggbb" }
  scenes.*.color_index: { type: int, description: "Scene color as an index into Live's palette" }
  scenes.*.is_empty: { type: bool, description: "None of the scene's slots holds a clip, as last read" }
  scenes.*.is_triggered: { type: bool, description: "The scene's launch button is blinking" }
  scenes.*.name: { type: string, description: "Scene name" }
  scenes.*.tempo: { type: float, description: "Scene tempo in BPM; -1 when the scene tempo is off" }
  scenes.*.tempo_enabled: { type: bool, description: "The scene's tempo is in use" }
  scenes.*.time_signature_denominator: { type: int, description: "Scene time signature denominator; -1 when the scene signature is off" }
  scenes.*.time_signature_enabled: { type: bool, description: "The scene's time signature is in use" }
  scenes.*.time_signature_numerator: { type: int, description: "Scene time signature numerator; -1 when the scene signature is off" }

telemetry:
  # Listeners sent on connecting; AbletonOSC answers each with the current
  # value, then with every change, on the property's get address.
  subscribe:
    send:
      - /live/song/start_listen/arrangement_overdub
      - /live/song/start_listen/back_to_arranger
      - /live/song/start_listen/clip_trigger_quantization
      - /live/song/start_listen/groove_amount
      - /live/song/start_listen/is_ableton_link_enabled
      - /live/song/start_listen/is_playing
      - /live/song/start_listen/loop
      - /live/song/start_listen/loop_length
      - /live/song/start_listen/loop_start
      - /live/song/start_listen/metronome
      - /live/song/start_listen/midi_recording_quantization
      - /live/song/start_listen/nudge_down
      - /live/song/start_listen/nudge_up
      - /live/song/start_listen/punch_in
      - /live/song/start_listen/punch_out
      - /live/song/start_listen/record_mode
      - /live/song/start_listen/root_note
      - /live/song/start_listen/scale_name
      - /live/song/start_listen/session_record
      - /live/song/start_listen/session_record_status
      - /live/song/start_listen/signature_denominator
      - /live/song/start_listen/signature_numerator
      - /live/song/start_listen/song_length
      - /live/song/start_listen/tempo
      - /live/song/start_listen/beat
      - /live/view/start_listen/selected_scene
      - /live/view/start_listen/selected_track
  poll:
    # Once on connecting: what can only be read, and the walks of the tracks
    # and scenes (the num_tracks and num_scenes rules start them).
    - send:
        - /live/application/get/version
        - /live/api/get/log_level
        - /live/view/get/selected_clip
        - /live/view/get/selected_device
        - /live/song/get/num_tracks
        - /live/song/get/num_scenes
    # Undo and redo availability are not observable.
    - every_ms: 5000
      send: [/live/song/get/can_undo, /live/song/get/can_redo]
  updates:
    - address: "^/live/application/get/version$"
      state: { application.version_major: "{arg0}", application.version_minor: "{arg1}" }
    - address: "^/live/api/get/log_level$"
      state: { application.log_level: "{arg0}" }
    - address: "^/live/error$"
      state: { application.last_error: "{arg0}" }
    # AbletonOSC started (Live opened a Set, or the script was reloaded): its
    # listeners are gone, so everything is registered and read again.
    - address: "^/live/startup$"
      then_send:
        - { address: /live/song/start_listen/arrangement_overdub, reply_address: "^/live/(song/get/arrangement_overdub|error)$" }
        - { address: /live/song/start_listen/back_to_arranger, reply_address: "^/live/(song/get/back_to_arranger|error)$" }
        - { address: /live/song/start_listen/clip_trigger_quantization, reply_address: "^/live/(song/get/clip_trigger_quantization|error)$" }
        - { address: /live/song/start_listen/groove_amount, reply_address: "^/live/(song/get/groove_amount|error)$" }
        - { address: /live/song/start_listen/is_ableton_link_enabled, reply_address: "^/live/(song/get/is_ableton_link_enabled|error)$" }
        - { address: /live/song/start_listen/is_playing, reply_address: "^/live/(song/get/is_playing|error)$" }
        - { address: /live/song/start_listen/loop, reply_address: "^/live/(song/get/loop|error)$" }
        - { address: /live/song/start_listen/loop_length, reply_address: "^/live/(song/get/loop_length|error)$" }
        - { address: /live/song/start_listen/loop_start, reply_address: "^/live/(song/get/loop_start|error)$" }
        - { address: /live/song/start_listen/metronome, reply_address: "^/live/(song/get/metronome|error)$" }
        - { address: /live/song/start_listen/midi_recording_quantization, reply_address: "^/live/(song/get/midi_recording_quantization|error)$" }
        - { address: /live/song/start_listen/nudge_down, reply_address: "^/live/(song/get/nudge_down|error)$" }
        - { address: /live/song/start_listen/nudge_up, reply_address: "^/live/(song/get/nudge_up|error)$" }
        - { address: /live/song/start_listen/punch_in, reply_address: "^/live/(song/get/punch_in|error)$" }
        - { address: /live/song/start_listen/punch_out, reply_address: "^/live/(song/get/punch_out|error)$" }
        - { address: /live/song/start_listen/record_mode, reply_address: "^/live/(song/get/record_mode|error)$" }
        - { address: /live/song/start_listen/root_note, reply_address: "^/live/(song/get/root_note|error)$" }
        - { address: /live/song/start_listen/scale_name, reply_address: "^/live/(song/get/scale_name|error)$" }
        - { address: /live/song/start_listen/session_record, reply_address: "^/live/(song/get/session_record|error)$" }
        - { address: /live/song/start_listen/session_record_status, reply_address: "^/live/(song/get/session_record_status|error)$" }
        - { address: /live/song/start_listen/signature_denominator, reply_address: "^/live/(song/get/signature_denominator|error)$" }
        - { address: /live/song/start_listen/signature_numerator, reply_address: "^/live/(song/get/signature_numerator|error)$" }
        - { address: /live/song/start_listen/song_length, reply_address: "^/live/(song/get/song_length|error)$" }
        - { address: /live/song/start_listen/tempo, reply_address: "^/live/(song/get/tempo|error)$" }
        - { address: /live/song/start_listen/beat, reply_address: "^/live/(song/get/beat|error)$" }
        - { address: /live/view/start_listen/selected_scene, reply_address: "^/live/(view/get/selected_scene|error)$" }
        - { address: /live/view/start_listen/selected_track, reply_address: "^/live/(view/get/selected_track|error)$" }
        - { address: /live/application/get/version, reply_address: "^/live/(application/get/version|error)$" }
        - { address: /live/api/get/log_level, reply_address: "^/live/(api/get/log_level|error)$" }
        - { address: /live/view/get/selected_clip, reply_address: "^/live/(view/get/selected_clip|error)$" }
        - { address: /live/view/get/selected_device, reply_address: "^/live/(view/get/selected_device|error)$" }
        - { address: /live/song/get/num_tracks, reply_address: "^/live/(song/get/num_tracks|error)$" }
        - { address: /live/song/get/num_scenes, reply_address: "^/live/(song/get/num_scenes|error)$" }
    - address: "^/live/song/get/arrangement_overdub$"
      state: { song.arrangement_overdub: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/back_to_arranger$"
      state: { song.back_to_arranger: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/clip_trigger_quantization$"
      state: { song.clip_trigger_quantization: { value: "{arg0}", map: { "0": "none", "1": "8_bars", "2": "4_bars", "3": "2_bars", "4": "1_bar", "5": "1/2", "6": "1/2t", "7": "1/4", "8": "1/4t", "9": "1/8", "10": "1/8t", "11": "1/16", "12": "1/16t", "13": "1/32" } } }
    - address: "^/live/song/get/current_song_time$"
      state: { song.current_song_time: "{arg0}" }
    - address: "^/live/song/get/groove_amount$"
      state: { song.groove_amount: "{arg0}" }
    - address: "^/live/song/get/is_ableton_link_enabled$"
      state: { song.is_ableton_link_enabled: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/is_playing$"
      state: { song.is_playing: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/loop$"
      state: { song.loop: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/loop_length$"
      state: { song.loop_length: "{arg0}" }
    - address: "^/live/song/get/loop_start$"
      state: { song.loop_start: "{arg0}" }
    - address: "^/live/song/get/metronome$"
      state: { song.metronome: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/midi_recording_quantization$"
      state: { song.midi_recording_quantization: { value: "{arg0}", map: { "0": "none", "1": "1/4", "2": "1/8", "3": "1/8t", "4": "1/8+1/8t", "5": "1/16", "6": "1/16t", "7": "1/16+1/16t", "8": "1/32" } } }
    - address: "^/live/song/get/nudge_down$"
      state: { song.nudge_down: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/nudge_up$"
      state: { song.nudge_up: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/punch_in$"
      state: { song.punch_in: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/punch_out$"
      state: { song.punch_out: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/record_mode$"
      state: { song.record_mode: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/root_note$"
      state: { song.root_note: "{arg0}" }
    - address: "^/live/song/get/scale_name$"
      state: { song.scale_name: "{arg0}" }
    - address: "^/live/song/get/session_record$"
      state: { song.session_record: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/session_record_status$"
      state: { song.session_record_status: "{arg0}" }
    - address: "^/live/song/get/signature_denominator$"
      state: { song.signature_denominator: "{arg0}" }
    - address: "^/live/song/get/signature_numerator$"
      state: { song.signature_numerator: "{arg0}" }
    - address: "^/live/song/get/song_length$"
      state: { song.song_length: "{arg0}" }
    - address: "^/live/song/get/tempo$"
      state: { song.tempo: "{arg0}" }
    - address: "^/live/song/get/can_undo$"
      state: { song.can_undo: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/can_redo$"
      state: { song.can_redo: { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/song/get/beat$"
      state: { song.beat: "{arg0}" }
    - address: "^/live/view/get/selected_scene$"
      state: { view.selected_scene: "{arg0:+1}" }
    - address: "^/live/view/get/selected_track$"
      state: { view.selected_track: "{arg0:+1}" }
    - address: "^/live/view/get/selected_clip$"
      state: { view.selected_clip_track: "{arg0:+1}", view.selected_clip_slot: "{arg1:+1}" }
    - address: "^/live/view/get/selected_device$"
      state: { view.selected_device_track: "{arg0:+1}", view.selected_device: "{arg1:+1}" }
    # The track count: every track is read again from scratch. Listeners for
    # every track at once ("*"), then the walk from the first track.
    - address: "^/live/song/get/num_tracks$"
      replace: tracks
      state: { song.num_tracks: "{arg0}" }
      then_send:
        - { address: /live/track/start_listen/color, args: [{ value: "*", type: string }], reply_address: "^/live/(track/get/color|error)$" }
        - { address: /live/track/start_listen/color_index, args: [{ value: "*", type: string }], reply_address: "^/live/(track/get/color_index|error)$" }
        - { address: /live/track/start_listen/fired_slot_index, args: [{ value: "*", type: string }], reply_address: "^/live/(track/get/fired_slot_index|error)$" }
        - { address: /live/track/start_listen/mute, args: [{ value: "*", type: string }], reply_address: "^/live/(track/get/mute|error)$" }
        - { address: /live/track/start_listen/name, args: [{ value: "*", type: string }], reply_address: "^/live/(track/get/name|error)$" }
        - { address: /live/track/start_listen/panning, args: [{ value: "*", type: string }], reply_address: "^/live/(track/get/panning|error)$" }
        - { address: /live/track/start_listen/playing_slot_index, args: [{ value: "*", type: string }], reply_address: "^/live/(track/get/playing_slot_index|error)$" }
        - { address: /live/track/start_listen/solo, args: [{ value: "*", type: string }], reply_address: "^/live/(track/get/solo|error)$" }
        - { address: /live/track/start_listen/volume, args: [{ value: "*", type: string }], reply_address: "^/live/(track/get/volume|error)$" }
        - { address: /live/track/get/is_foldable, args: [{ value: "0", type: int }], reply_address: "^/live/(track/get/is_foldable|error)$" }
    # One track read: the next track, this track's one-off reads, and the
    # walks of its sends, clip slots and devices. is_foldable is never
    # listened to, so only this walk sends it.
    - address: "^/live/track/get/is_foldable$"
      state: { "tracks.{arg0:+1}.is_foldable": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
      then_send:
        - { address: /live/track/get/is_foldable, args: [{ value: "{arg0:+1}", type: int }], reply_address: "^/live/(track/get/is_foldable|error)$" }
        - { address: /live/track/get/can_be_armed, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/can_be_armed|error)$" }
        - { address: /live/track/get/has_audio_input, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/has_audio_input|error)$" }
        - { address: /live/track/get/has_audio_output, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/has_audio_output|error)$" }
        - { address: /live/track/get/has_midi_input, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/has_midi_input|error)$" }
        - { address: /live/track/get/has_midi_output, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/has_midi_output|error)$" }
        - { address: /live/track/get/is_grouped, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/is_grouped|error)$" }
        - { address: /live/track/get/is_visible, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/is_visible|error)$" }
        - { address: /live/track/get/input_routing_type, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/input_routing_type|error)$" }
        - { address: /live/track/get/input_routing_channel, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/input_routing_channel|error)$" }
        - { address: /live/track/get/output_routing_type, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/output_routing_type|error)$" }
        - { address: /live/track/get/output_routing_channel, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/output_routing_channel|error)$" }
        - { address: /live/track/get/num_devices, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/num_devices|error)$" }
        - { address: /live/track/get/send, args: [{ value: "{arg0}", type: int }, { value: "0", type: int }], reply_address: "^/live/(track/get/send|error)$" }
        - { address: /live/clip_slot/get/is_group_slot, args: [{ value: "{arg0}", type: int }, { value: "0", type: int }], reply_address: "^/live/(clip_slot/get/is_group_slot|error)$" }
        - { address: /live/device/get/class_name, args: [{ value: "{arg0}", type: int }, { value: "0", type: int }], reply_address: "^/live/(device/get/class_name|error)$" }
    # A group track: its fold state (which raises for any other track).
    - address: "^/live/track/get/is_foldable$"
      arg_match: { "1": "^(true|1)$" }
      then_send:
        - { address: /live/track/get/fold_state, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/fold_state|error)$" }
    # A track that can be armed: arm and monitoring are listened to (both
    # raise for a group track).
    - address: "^/live/track/get/can_be_armed$"
      arg_match: { "1": "^(true|1)$" }
      then_send:
        - { address: /live/track/start_listen/arm, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/arm|error)$" }
        - { address: /live/track/start_listen/current_monitoring_state, args: [{ value: "{arg0}", type: int }], reply_address: "^/live/(track/get/current_monitoring_state|error)$" }
    - address: "^/live/track/get/arm$"
      state: { "tracks.{arg0:+1}.arm": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/track/get/can_be_armed$"
      state: { "tracks.{arg0:+1}.can_be_armed": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/track/get/color$"
      state: { "tracks.{arg0:+1}.color": "{arg1}" }
    - address: "^/live/track/get/color_index$"
      state: { "tracks.{arg0:+1}.color_index": "{arg1}" }
    - address: "^/live/track/get/current_monitoring_state$"
      state: { "tracks.{arg0:+1}.current_monitoring_state": { value: "{arg1}", map: { "0": "in", "1": "auto", "2": "off" } } }
    - address: "^/live/track/get/fired_slot_index$"
      state: { "tracks.{arg0:+1}.fired_slot_index": "{arg1:+1}" }
    - address: "^/live/track/get/fold_state$"
      state: { "tracks.{arg0:+1}.fold_state": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/track/get/has_audio_input$"
      state: { "tracks.{arg0:+1}.has_audio_input": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/track/get/has_audio_output$"
      state: { "tracks.{arg0:+1}.has_audio_output": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/track/get/has_midi_input$"
      state: { "tracks.{arg0:+1}.has_midi_input": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/track/get/has_midi_output$"
      state: { "tracks.{arg0:+1}.has_midi_output": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/track/get/input_routing_channel$"
      state: { "tracks.{arg0:+1}.input_routing_channel": "{arg1}" }
    - address: "^/live/track/get/input_routing_type$"
      state: { "tracks.{arg0:+1}.input_routing_type": "{arg1}" }
    - address: "^/live/track/get/is_grouped$"
      state: { "tracks.{arg0:+1}.is_grouped": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/track/get/is_visible$"
      state: { "tracks.{arg0:+1}.is_visible": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/track/get/mute$"
      state: { "tracks.{arg0:+1}.mute": { value: "{arg1}", map: { "true": true, "false": false, "1": true, "0": false } } }
    - address: "^/live/track/get/name$"
      state: { "tracks.{arg0:+1}.name": "{arg1}" }
