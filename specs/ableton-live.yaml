    expect: { address: /live/scene/get/tempo, arg: 1 }
    returns: value

  set_scene_tempo:
    summary: "Set a scene's tempo"
    params:
      scene: { type: int, min: 1, required: true, label: Scene, description: "Scene, numbered from 1 from the top of the Session View." }
      value: { type: float, min: -1.0, max: 999.0, required: true, label: Tempo, description: "The new value: scene tempo in BPM; -1 when the scene tempo is off." }
    send:
      - { address: /live/scene/set/tempo, args: [{ value: "{scene:-1}", type: int }, { value: "{value}", type: float }] }
      - { address: /live/scene/get/tempo, args: [{ value: "{scene:-1}", type: int }] }
    returns: none

  get_scene_tempo_enabled:
    summary: "Read a scene's tempo enabled"
    params:
      scene: { type: int, min: 1, required: true, label: Scene, description: "Scene, numbered from 1 from the top of the Session View." }
    send: { address: /live/scene/get/tempo_enabled, args: [{ value: "{scene:-1}", type: int }] }
    expect: { address: /live/scene/get/tempo_enabled, arg: 1 }
    returns: value

  set_scene_tempo_enabled:
    summary: "Set a scene's tempo enabled"
    params:
      scene: { type: int, min: 1, required: true, label: Scene, description: "Scene, numbered from 1 from the top of the Session View." }
      value: { type: bool, required: true, label: Tempo on, description: "On sets it: the scene's tempo is in use; off clears it." }
    send:
      - { address: /live/scene/set/tempo_enabled, args: [{ value: "{scene:-1}", type: int }, { value: "{value:bool01}", type: int }] }
      - { address: /live/scene/get/tempo_enabled, args: [{ value: "{scene:-1}", type: int }] }
    returns: none

  get_scene_time_signature_denominator:
