    params:
      scene: { type: int, min: 1, required: true, label: Scene, description: "Scene, numbered from 1 from the top of the Session View." }
    send: { address: /live/scene/get/time_signature_denominator, args: [{ value: "{scene:-1}", type: int }] }
    expect: { address: /live/scene/get/time_signature_denominator, arg: 1 }
    returns: value

  set_scene_time_signature_denominator:
    summary: "Set a scene's time signature denominator"
    params:
      scene: { type: int, min: 1, required: true, label: Scene, description: "Scene, numbered from 1 from the top of the Session View." }
      value: { type: int, min: -1, max: 16, required: true, label: Signature denominator, description: "The new value: scene time signature denominator; -1 when the scene signature is off." }
    send:
      - { address: /live/scene/set/time_signature_denominator, args: [{ value: "{scene:-1}", type: int }, { value: "{value}", type: int }] }
      - { address: /live/scene/get/time_signature_denominator, args: [{ value: "{scene:-1}", type: int }] }
    returns: none

  get_scene_time_signature_enabled:
    summary: "Read a scene's time signature enabled"
    params:
      scene: { type: int, min: 1, required: true, label: Scene, description: "Scene, numbered from 1 from the top of the Session View." }
    send: { address: /live/scene/get/time_signature_enabled, args: [{ value: "{scene:-1}", type: int }] }
    expect: { address: /live/scene/get/time_signature_enabled, arg: 1 }
    returns: value

  set_scene_time_signature_enabled:
    summary: "Set a scene's time signature enabled"
    params:
      scene: { type: int, min: 1, required: true, label: Scene, description: "Scene, numbered from 1 from the top of the Session View." }
      value: { type: bool, required: true, label: Signature on, description: "On sets it: the scene's time signature is in use; off clears it." }
    send:
      - { address: /live/scene/set/time_signature_enabled, args: [{ value: "{scene:-1}", type: int }, { value: "{value:bool01}", type: int }] }
      - { address: /live/scene/get/time_signature_enabled, args: [{ value: "{scene:-1}", type: int }] }
    returns: none

  get_scene_time_signature_numerator:
    summary: "Read a scene's time signature numerator"
    params:
      scene: { type: int, min: 1, required: true, label: Scene, description: "Scene, numbered from 1 from the top of the Session View." }
    send: { address: /live/scene/get/time_signature_numerator, args: [{ value: "{scene:-1}", type: int }] }
    expect: { address: /live/scene/get/time_signature_numerator, arg: 1 }
    returns: value

  set_scene_time_signature_numerator:
    summary: "Set a scene's time signature numerator"
    params:
      scene: { type: int, min: 1, required: true, label: Scene, description: "Scene, numbered from 1 from the top of the Session View." }
      value: { type: int, min: -1, max: 99, required: true, label: Signature numerator, description: "The new value: scene time signature numerator; -1 when the scene signature is off." }
    send:
      - { address: /live/scene/set/time_signature_numerator, args: [{ value: "{scene:-1}", type: int }, { value: "{value}", type: int }] }
      - { address: /live/scene/get/time_signature_numerator, args: [{ value: "{scene:-1}", type: int }] }
    returns: none

  get_device_name:
    summary: "Read a device's name"
    params:
      track: { type: int, min: 1, required: true, label: Track, description: "Track, numbered from 1 as in Live's Session View from the left; return tracks and the master track are not reachable." }
      device: { type: int, min: 1, required: true, label: Device, description: "Device on the track, numbered from 1 from the left of the device chain." }
    send: { address: /live/device/get/name, args: [{ value: "{track:-1}", type: int }, { value: "{device:-1}", type: int }] }
    expect: { address: /live/device/get/name, arg: 2 }
    returns: value

  get_device_type:
    summary: "Read a device's type (1 audio effect, 2 instrument, 4 MIDI effect)"
    params:
      track: { type: int, min: 1, required: true, label: Track, description: "Track, numbered from 1 as in Live's Session View from the left; return tracks and the master track are not reachable." }
      device: { type: int, min: 1, required: true, label: Device, description: "Device on the track, numbered from 1 from the left of the device chain." }
    send: { address: /live/device/get/type, args: [{ value: "{track:-1}", type: int }, { value: "{device:-1}", type: int }] }
    expect: { address: /live/device/get/type, arg: 2 }
    returns: value

  get_device_num_parameters:
    summary: "Read a device's number of parameters"
    params:
      track: { type: int, min: 1, required: true, label: Track, description: "Track, numbered from 1 as in Live's Session View from the left; return tracks and the master track are not reachable." }
      device: { type: int, min: 1, required: true, label: Device, description: "Device on the track, numbered from 1 from the left of the device chain." }
    send: { address: /live/device/get/num_parameters, args: [{ value: "{track:-1}", type: int }, { value: "{device:-1}", type: int }] }
    expect: { address: /live/device/get/num_parameters, arg: 2 }
    returns: value

  get_device_parameter_value:
    summary: "Read a device parameter's value"
    params:
      track: { type: int, min: 1, required: true, label: Track, description: "Track, numbered from 1 as in Live's Session View from the left; return tracks and the master track are not reachable." }
      device: { type: int, min: 1, required: true, label: Device, description: "Device on the track, numbered from 1 from the left of the device chain." }
      parameter: { type: int, min: 1, required: true, label: Parameter, description: "Device parameter, numbered from 1 in the device's parameter list (1 is usually Device On)." }
    send: { address: /live/device/get/parameter/value, args: [{ value: "{track:-1}", type: int }, { value: "{device:-1}", type: int }, { value: "{parameter:-1}", type: int }] }
    expect: { address: /live/device/get/parameter/value, arg: 3 }
    returns: value

  get_device_parameter_value_string:
    summary: "Read a device parameter's value as Live shows it (\"2500 Hz\")"
    params:
      track: { type: int, min: 1, required: true, label: Track, description: "Track, numbered from 1 as in Live's Session View from the left; return tracks and the master track are not reachable." }
      device: { type: int, min: 1, required: true, label: Device, description: "Device on the track, numbered from 1 from the left of the device chain." }
      parameter: { type: int, min: 1, required: true, label: Parameter, description: "Device parameter, numbered from 1 in the device's parameter list (1 is usually Device On)." }
    send: { address: /live/device/get/parameter/value_string, args: [{ value: "{track:-1}", type: int }, { value: "{device:-1}", type: int }, { value: "{parameter:-1}", type: int }] }
    expect: { address: /live/device/get/parameter/value_string, arg: 3 }
    returns: value

  set_device_parameter:
    summary: "Set a device parameter's value"
    params:
      track: { type: int, min: 1, required: true, label: Track, description: "Track, numbered from 1 as in Live's Session View from the left; return tracks and the master track are not reachable." }
      device: { type: int, min: 1, required: true, label: Device, description: "Device on the track, numbered from 1 from the left of the device chain." }
      parameter: { type: int, min: 1, required: true, label: Parameter, description: "Device parameter, numbered from 1 in the device's parameter list (1 is usually Device On)." }
      value: { type: float, required: true, label: Value, description: "The new value, within the parameter's own range (0 to 1 for most; Live clamps or refuses a value outside it)." }
    send:
      - { address: /live/device/set/parameter/value, args: [{ value: "{track:-1}", type: int }, { value: "{device:-1}", type: int }, { value: "{parameter:-1}", type: int }, { value: "{value}", type: float }] }
      - { address: /live/device/get/parameter/value, args: [{ value: "{track:-1}", type: int }, { value: "{device:-1}", type: int }, { value: "{parameter:-1}", type: int }] }
    returns: none

  watch_device_parameters:
    summary: "Read every parameter's name of a device and have Live report their values as they change"
    params:
      track: { type: int, min: 1, required: true, label: Track, description: "Track, numbered from 1 as in Live's Session View from the left; return tracks and the master track are not reachable." }
      device: { type: int, min: 1, required: true, label: Device, description: "Device on the track, numbered from 1 from the left of the device chain." }
    send: { address: /live/device/get/parameter/name, args: [{ value: "{track:-1}", type: int }, { value: "{device:-1}", type: int }, { value: "0", type: int }] }
    returns: none

  stop_listening_device_parameter:
    summary: "Stop a device parameter's value reports"
    params:
      track: { type: int, min: 1, required: true, label: Track, description: "Track, numbered from 1 as in Live's Session View from the left; return tracks and the master track are not reachable." }
      device: { type: int, min: 1, required: true, label: Device, description: "Device on the track, numbered from 1 from the left of the device chain." }
      parameter: { type: int, min: 1, required: true, label: Parameter, description: "Device parameter, numbered from 1 in the device's parameter list (1 is usually Device On)." }
    send: { address: /live/device/stop_listen/parameter/value, args: [{ value: "{track:-1}", type: int }, { value: "{device:-1}", type: int }, { value: "{parameter:-1}", type: int }] }
    returns: none

  map_midi_cc:
    summary: "Map a MIDI control change to a device parameter"
    params:
      track: { type: int, min: 1, required: true, label: Track, description: "Track, numbered from 1 as in Live's Session View from the left; return tracks and the master track are not reachable." }
      device: { type: int, min: 1, required: true, label: Device, description: "Device on the track, numbered from 1 from the left of the device chain." }
      parameter: { type: int, min: 1, required: true, label: Parameter, description: "Device parameter, numbered from 1 in the device's parameter list (1 is usually Device On)." }
      channel: { type: int, min: 1, max: 16, required: true, label: MIDI channel, description: "MIDI channel of the control change, 1 to 16." }
      cc: { type: int, min: 0, max: 127, required: true, label: Controller, description: "Control change number, 0 to 127." }
    send: { address: /live/midimap/map_cc, args: [{ value: "{track:-1}", type: int }, { value: "{device:-1}", type: int }, { value: "{parameter:-1}", type: int }, { value: "{channel:-1}", type: int }, { value: "{cc}", type: int }] }
    returns: none

  resync:
    summary: "Read the whole Set again and register every listener again (after tracks or scenes moved)"
    send:
      - { address: /live/song/start_listen/arrangement_overdub }
      - { address: /live/song/start_listen/back_to_arranger }
      - { address: /live/song/start_listen/clip_trigger_quantization }
      - { address: /live/song/start_listen/groove_amount }
      - { address: /live/song/start_listen/is_ableton_link_enabled }
      - { address: /live/song/start_listen/is_playing }
      - { address: /live/song/start_listen/loop }
      - { address: /live/song/start_listen/loop_length }
      - { address: /live/song/start_listen/loop_start }
      - { address: /live/song/start_listen/metronome }
      - { address: /live/song/start_listen/midi_recording_quantization }
      - { address: /live/song/start_listen/nudge_down }
      - { address: /live/song/start_listen/nudge_up }
      - { address: /live/song/start_listen/punch_in }
      - { address: /live/song/start_listen/punch_out }
      - { address: /live/song/start_listen/record_mode }
      - { address: /live/song/start_listen/root_note }
      - { address: /live/song/start_listen/scale_name }
      - { address: /live/song/start_listen/session_record }
      - { address: /live/song/start_listen/session_record_status }
      - { address: /live/song/start_listen/signature_denominator }
      - { address: /live/song/start_listen/signature_numerator }
      - { address: /live/song/start_listen/song_length }
      - { address: /live/song/start_listen/tempo }
      - { address: /live/song/start_listen/beat }
      - { address: /live/view/start_listen/selected_scene }
      - { address: /live/view/start_listen/selected_track }
      - { address: /live/application/get/version }
      - { address: /live/api/get/log_level }
      - { address: /live/song/get/can_undo }
      - { address: /live/song/get/can_redo }
      - { address: /live/view/get/selected_clip }
      - { address: /live/view/get/selected_device }
      - { address: /live/song/get/num_tracks }
      - { address: /live/song/get/num_scenes }
    returns: none

state:
  application.version_major: { type: int, description: "Live's major version" }
  application.version_minor: { type: int, description: "Live's minor version" }
  application.log_level: { type: string, description: "AbletonOSC's log level" }
  application.last_error: { type: string, description: "The last error AbletonOSC reported (/live/error), such as an index past the end" }
  song.arrangement_overdub: { type: bool, description: "MIDI Arrangement Overdub button on" }
  song.back_to_arranger: { type: bool, description: "Back to Arrangement button lit (playback differs from the Arrangement); setting it off returns playback to the Arrangement" }
  song.clip_trigger_quantization: { type: string, description: "Global launch quantization of the transport bar" }
  song.current_song_time: { type: float, unit: beats, description: "Playing position of the Live Set, in beats" }
  song.groove_amount: { type: float, description: "Groove amount of the Set's groove pool, 0 to 1" }
  song.is_ableton_link_enabled: { type: bool, description: "Ableton Link enabled" }
  song.is_playing: { type: bool, description: "The transport is running" }
  song.loop: { type: bool, description: "Arrangement loop enabled" }
  song.loop_length: { type: float, unit: beats, description: "Arrangement loop length, in beats" }
  song.loop_start: { type: float, unit: beats, description: "Arrangement loop start, in beats" }
  song.metronome: { type: bool, description: "Metronome on" }
  song.midi_recording_quantization: { type: string, description: "MIDI Record Quantization" }
  song.nudge_down: { type: bool, description: "Tempo Nudge Down button pressed" }
  song.nudge_up: { type: bool, description: "Tempo Nudge Up button pressed" }
  song.punch_in: { type: bool, description: "Punch-In button on" }
  song.punch_out: { type: bool, description: "Punch-Out button on" }
  song.record_mode: { type: bool, description: "Arrangement Record button on" }
  song.root_note: { type: int, description: "Root note of the current scale, 0 = C to 11 = B" }
  song.scale_name: { type: string, description: "Name of the current scale, as Live's Current Scale chooser shows it" }
  song.session_record: { type: bool, description: "Session Overdub (Session Record) button on" }
  song.session_record_status: { type: int, description: "State of the Session Record button, as Live reports it" }
  song.signature_denominator: { type: int, description: "Time signature denominator" }
  song.signature_numerator: { type: int, description: "Time signature numerator" }
  song.song_length: { type: float, unit: beats, description: "Length of the Arrangement, in beats (a little more than its last event)" }
  song.tempo: { type: float, unit: BPM, description: "Song tempo, in BPM" }
  song.can_undo: { type: bool, description: "There is something to undo" }
  song.can_redo: { type: bool, description: "There is something to redo" }
  song.beat: { type: int, unit: beats, description: "Beat the playback reached, counted from 0 at the song start; sent on each beat while playing" }
  song.num_tracks: { type: int, description: "Number of tracks (not counting return tracks and the master), as last read" }
  song.num_scenes: { type: int, description: "Number of scenes, as last read" }
  view.selected_scene: { type: int, description: "Selected scene, from 1" }
  view.selected_track: { type: int, description: "Selected track, from 1" }
  view.selected_clip_track: { type: int, description: "Track of the selected clip slot, from 1, as last read" }
  view.selected_clip_slot: { type: int, description: "Slot (scene row) of the selected clip slot, from 1, as last read" }
  view.selected_device_track: { type: int, description: "Track of the selected device, from 1, as last read" }
  view.selected_device: { type: int, description: "Selected device on that track, from 1, as last read" }
  tracks.*.arm: { type: bool, description: "Armed for recording" }
  tracks.*.can_be_armed: { type: bool, description: "The track can be armed (false for group tracks), as last read" }
  tracks.*.color: { type: int, description: "Track color as 0x00rrggbb" }
  tracks.*.color_index: { type: int, description: "Track color as an index into Live's palette" }
  tracks.*.current_monitoring_state: { type: string, description: "Monitoring: in, auto or off" }
  tracks.*.fired_slot_index: { type: int, description: "Clip slot whose clip is launching (blinking), from 1; 0 when none, -1 when the track's stop button was fired" }
  tracks.*.fold_state: { type: bool, description: "A group track is folded, as last read" }
  tracks.*.has_audio_input: { type: bool, description: "The track has an audio input, as last read" }
  tracks.*.has_audio_output: { type: bool, description: "The track has an audio output, as last read" }
  tracks.*.has_midi_input: { type: bool, description: "The track has a MIDI input, as last read" }
  tracks.*.has_midi_output: { type: bool, description: "The track has a MIDI output, as last read" }
  tracks.*.input_routing_channel: { type: string, description: "Input routing channel, by display name (\"1/2\"), as last read" }
  tracks.*.input_routing_type: { type: string, description: "Input routing type, by display name (\"Ext. In\"), as last read" }
  tracks.*.is_foldable: { type: bool, description: "The track is a group track, as last read" }
  tracks.*.is_grouped: { type: bool, description: "The track is inside a group track, as last read" }
  tracks.*.is_visible: { type: bool, description: "The track is visible (not inside a folded group), as last read" }
  tracks.*.mute: { type: bool, description: "Track muted (its Track Activator off)" }
  tracks.*.name: { type: string, description: "Track name" }
  tracks.*.output_meter_left: { type: float, description: "Smoothed momentary peak of the left channel's output meter, 0.0 to 1.0 as Live gives it (Live Object Model, Track); Live documents no dB scale for it" }
  tracks.*.output_meter_level: { type: float, description: "Hold peak of the track's output meter (the louder channel, held 1 second), 0.0 to 1.0 as Live gives it (Live Object Model, Track); Live documents no dB scale for it" }
  tracks.*.output_meter_right: { type: float, description: "Smoothed momentary peak of the right channel's output meter, 0.0 to 1.0 as Live gives it, the meter Live shows (Live Object Model, Track); Live documents no dB scale for it" }
  tracks.*.output_routing_channel: { type: string, description: "Output routing channel, by display name, as last read" }
  tracks.*.output_routing_type: { type: string, description: "Output routing type, by display name (\"Master\"), as last read" }
  tracks.*.panning: { type: float, description: "Mixer pan, -1 (left) to 1 (right)" }
  tracks.*.playing_slot_index: { type: int, description: "Clip slot whose clip is playing, from 1; 0 when none, -1 when the stop button was fired" }
  tracks.*.solo: { type: bool, description: "Track soloed" }
  tracks.*.volume: { type: float, description: "Mixer volume as the fader's parameter value, 0 to 1; Live documents no dB law for it (0.85 is 0 dB on Live's fader, by observation)" }
  tracks.*.num_devices: { type: int, description: "Number of devices on the track, as last read" }
  tracks.*.sends.*.level: { type: float, description: "Send level, 0 to 1, as last read or set here (sends are not listened to)" }
  tracks.*.slots.*.controls_other_clips: { type: bool, description: "A group slot whose fire launches clips of the grouped tracks" }
  tracks.*.slots.*.has_clip: { type: bool, description: "The slot holds a clip" }
  tracks.*.slots.*.has_stop_button: { type: bool, description: "The slot has a stop button" }
  tracks.*.slots.*.is_group_slot: { type: bool, description: "The slot belongs to a group track, as last read" }
