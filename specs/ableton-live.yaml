spec: 1
id: ableton-live
name: Ableton Live (AbletonOSC)
vendor: Ableton
category: playback

# Ableton Live 11 and 12 through AbletonOSC, a MIDI Remote Script run inside
# Live that exposes Live's Python API (the Live Object Model) over OSC. It
# listens on UDP 11000 and sends every reply and every listener update to
# the last sender's address on UDP 11001, so this integration sends from,
# and listens on, the shared local port 11001 (feedback_port). Tracks,
# scenes, clip slots, devices and parameters are addressed by index from 0 on
# the wire; here they are numbered from 1, as Live's user interface counts
# them. Listeners are registered on connecting; what can only be read is read
# by walking the Set (each reply asking for the next index until AbletonOSC
# answers /live/error past the end).

source:
  - title: AbletonOSC README, Control Ableton Live with OSC
    author: Daniel John Jones (ideoforms) and contributors
    url: https://github.com/ideoforms/AbletonOSC
    note: >
      MIT licence (LICENSE.md checked). The OSC API this integration is written
      from, retrieved 2026-10-23 (master, last pushed 2025-11-19): ports 11000
      (in) and 11001 (replies, to the sender's IP); the Application, Song, View,
      Track, Clip Slot, Clip, Scene, Device and MidiMap APIs; start_listen and
      stop_listen with updates on the get address; /live/song/start_listen/beat;
      /live/startup and /live/error.
  - title: AbletonOSC source, abletonosc/*.py and manager.py
    author: Daniel John Jones (ideoforms) and contributors
    url: https://github.com/ideoforms/AbletonOSC/tree/master/abletonosc
    note: >
      MIT licence; read to fill gaps the README leaves, no code taken. The
      exact property lists of each handler (song.py, track.py, clip.py,
      clip_slot.py, scene.py, device.py, view.py), the "*" track index applying
      a track handler to every track, get replies carrying the indexes before
      the value, a listener sending the current value when registered, listener
      updates going to the last sender's IP on 11001, handler exceptions
      reported as /live/error, and /live/song/cue_point/jump taking an index or
      a name.
  - title: Live Object Model (Max for Live documentation, Live 12.1)
    author: Cycling '74 / Ableton
    url: https://docs.cycling74.com/legacy/max8/vignettes/live_object_model
    note: >
      The object model AbletonOSC exposes, which the README links: property
      types, which properties are observable, and the enumerations of
      clip_trigger_quantization, midi_recording_quantization, launch_mode,
      launch_quantization, warp_mode, root_note, ClipSlot.playing_status and
      the scene tempo and signature (-1 when off).

transport:
  type: osc-udp
  port: 11000
  timeout_ms: 1000
  reply: to-source
  listen_port: { setting: feedback_port }
  probe: /live/application/get/version

settings:
  feedback_port: { type: int, min: 1, max: 65535, default: 11001, label: Reply port, description: "Local UDP port AbletonOSC sends its replies and updates to; 11001 unless AbletonOSC's constants.py was changed." }

ports:
  - { port: 11000, protocol: udp, role: control }
  - { port: 11001, protocol: udp, role: feedback, listener: core, setting: feedback_port, note: "AbletonOSC replies and sends updates to the sender's address on this port; commands are sent from it too" }

maps:
  clip_trigger_quantization: { "none": "0", "8_bars": "1", "4_bars": "2", "2_bars": "3", "1_bar": "4", "1/2": "5", "1/2t": "6", "1/4": "7", "1/4t": "8", "1/8": "9", "1/8t": "10", "1/16": "11", "1/16t": "12", "1/32": "13" }
  midi_recording_quantization: { "none": "0", "1/4": "1", "1/8": "2", "1/8t": "3", "1/8+1/8t": "4", "1/16": "5", "1/16t": "6", "1/16+1/16t": "7", "1/32": "8" }
  monitoring: { "in": "0", "auto": "1", "off": "2" }
  launch_mode: { "trigger": "0", "gate": "1", "toggle": "2", "repeat": "3" }
  launch_quantization: { "global": "0", "none": "1", "8_bars": "2", "4_bars": "3", "2_bars": "4", "1_bar": "5", "1/2": "6", "1/2t": "7", "1/4": "8", "1/4t": "9", "1/8": "10", "1/8t": "11", "1/16": "12", "1/16t": "13", "1/32": "14" }
  warp_mode: { "beats": "0", "tones": "1", "texture": "2", "re_pitch": "3", "complex": "4", "rex": "5", "complex_pro": "6" }

