commands:
  get_model:
    summary: "Read the model (MODEL)"
    send: "GET MODEL"
    expect: { reply_contains: " MODEL ", matches: " MODEL \\{?(.*?) *\\}? *>$" }
    returns: value
  get_serial_number:
    summary: "Read the serial number (SERIAL_NUM)"
    send: "GET SERIAL_NUM"
    expect: { reply_contains: " SERIAL_NUM ", matches: " SERIAL_NUM \\{?(.*?) *\\}? *>$" }
    returns: value
  get_firmware:
    summary: "Read the firmware version (FW_VER)"
    send: "GET FW_VER"
    expect: { reply_contains: " FW_VER ", matches: " FW_VER \\{?(.*?) *\\}? *>$" }
    returns: value
  get_device_id:
    summary: "Read the device ID (name) (DEVICE_ID)"
    send: "GET DEVICE_ID"
    expect: { reply_contains: " DEVICE_ID ", matches: " DEVICE_ID \\{?(.*?) *\\}? *>$" }
    returns: value
  get_ip_address:
    summary: "Read the primary audio network IP address (IP_ADDR_NET_AUDIO_PRIMARY)"
    send: "GET IP_ADDR_NET_AUDIO_PRIMARY"
    expect: { reply_contains: " IP_ADDR_NET_AUDIO_PRIMARY ", matches: " IP_ADDR_NET_AUDIO_PRIMARY \\{?(.*?) *\\}? *>$" }
    returns: value
  get_subnet:
    summary: "Read the primary audio network subnet mask (IP_SUBNET_NET_AUDIO_PRIMARY)"
    send: "GET IP_SUBNET_NET_AUDIO_PRIMARY"
    expect: { reply_contains: " IP_SUBNET_NET_AUDIO_PRIMARY ", matches: " IP_SUBNET_NET_AUDIO_PRIMARY \\{?(.*?) *\\}? *>$" }
    returns: value
  get_gateway:
    summary: "Read the primary audio network gateway (IP_GATEWAY_NET_AUDIO_PRIMARY)"
    send: "GET IP_GATEWAY_NET_AUDIO_PRIMARY"
    expect: { reply_contains: " IP_GATEWAY_NET_AUDIO_PRIMARY ", matches: " IP_GATEWAY_NET_AUDIO_PRIMARY \\{?(.*?) *\\}? *>$" }
    returns: value
  get_encryption:
    summary: "Read audio encryption (ENCRYPTION)"
    send: "GET ENCRYPTION"
    expect: { reply_contains: " ENCRYPTION ", matches: " ENCRYPTION \\{?(.*?) *\\}? *>$" }
    returns: value
  get_preset:
    summary: "The preset last recalled (PRESET), 1-10"
    send: "GET PRESET"
    expect: { reply_contains: " PRESET ", matches: " PRESET \\{?(.*?) *\\}? *>$" }
    returns: value
  recall_preset:
    summary: "Recall a preset (SET PRESET), 1-10"
    params:
      preset: { type: int, min: 1, max: 10, required: true, label: "Preset", description: "Preset number, 1 to 10, as on the device." }
    send: "SET PRESET {preset:02d}"
    expect: { reply_contains: " PRESET ", contains: " PRESET " }
    returns: ack
  get_preset_name:
    summary: "A preset's name (PRESET1-PRESET10)"
    params:
      preset: { type: int, min: 1, max: 10, required: true, label: "Preset", description: "Preset number, 1 to 10, as on the device." }
    send: "GET PRESET{preset}"
    expect: { reply_contains: " PRESET", matches: " PRESET\\d+ \\{?(.*?) *\\}? *>$" }
    returns: value
  flash:
    summary: "Flash the device's lights to identify it (FLASH); it stops by itself after about 30 s"
    params:
      enabled: { type: bool, default: true, label: "Flash", description: "On flashes the lights, off stops them; they stop by themselves after about 30 s." }
    send: "SET FLASH {enabled:on_off}"
    expect: { reply_contains: " FLASH ", contains: " FLASH " }
    returns: ack
  reboot:
    summary: "Reboot the device (SET REBOOT); not acknowledged"
    send: "SET REBOOT"
    returns: none
  restore_defaults:
    summary: "Restore default settings (SET DEFAULT_SETTINGS)"
    send: "SET DEFAULT_SETTINGS"
    expect: { reply_contains: "DEFAULT_SETTINGS", contains: "DEFAULT_SETTINGS" }
    returns: ack
  get_all:
    summary: "Ask for every parameter of a channel (0: the device and all channels); the answers update state"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel whose parameters to read; 0 reads the device and every channel." }
    send: "GET {channel:02d} ALL"
    returns: none
  get_parameter:
    summary: "Read any documented channel parameter by name (GET <channel> <PARAM>), returning its value text"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
      parameter: { type: string, pattern: "^[A-Z][A-Z0-9_]*$", max_length: 40, required: true, label: "Parameter", description: "The parameter name as the command-string document writes it, such as AUDIO_MUTE." }
    send: "GET {channel:02d} {parameter}"
    expect: { reply_contains: " {parameter} ", matches: "^< REP (?:\\d+ )?[A-Z][A-Z0-9_]* \\{?(.*?) *\\}? *>$" }
    returns: value
  set_parameter:
    summary: "Set any documented channel parameter by name (SET <channel> <PARAM> <value>), the value in the document's form"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
      parameter: { type: string, pattern: "^[A-Z][A-Z0-9_]*$", max_length: 40, required: true, label: "Parameter", description: "The parameter name as the command-string document writes it, such as AUDIO_MUTE." }
      value: { type: string, pattern: "^[^<>]+$", max_length: 64, required: true, label: "Value", description: "The value in the document's form, such as ON or 1100." }
    send: "SET {channel:02d} {parameter} {value}"
    expect: { reply_contains: " {parameter} ", not_contains: "REP ERR" }
    returns: ack
  get_device_parameter:
    summary: "Read any documented device parameter by name (GET <PARAM>)"
    params:
      parameter: { type: string, pattern: "^[A-Z][A-Z0-9_]*$", max_length: 40, required: true, label: "Parameter", description: "The device parameter name as the command-string document writes it, such as ENCRYPTION." }
    send: "GET {parameter}"
    expect: { reply_contains: " {parameter} ", matches: "^< REP (?:\\d+ )?[A-Z][A-Z0-9_]* \\{?(.*?) *\\}? *>$" }
    returns: value
  set_device_parameter:
    summary: "Set any documented device parameter by name (SET <PARAM> <value>)"
    params:
      parameter: { type: string, pattern: "^[A-Z][A-Z0-9_]*$", max_length: 40, required: true, label: "Parameter", description: "The device parameter name as the command-string document writes it, such as LED_BRIGHTNESS." }
      value: { type: string, pattern: "^[^<>]+$", max_length: 128, required: true, label: "Value", description: "The value in the document's form, such as 2." }
    send: "SET {parameter} {value}"
    expect: { reply_contains: " {parameter} ", not_contains: "REP ERR" }
    returns: ack
  get_name:
    summary: "Read a channel's name (CHAN_NAME)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
    send: "GET {channel:02d} CHAN_NAME"
    expect: { reply_contains: " CHAN_NAME ", matches: " CHAN_NAME \\{?(.*?) *\\}? *>$" }
    returns: value
  get_mute:
    summary: "Read a channel's mute (AUDIO_MUTE)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
    send: "GET {channel:02d} AUDIO_MUTE"
    expect: { reply_contains: " AUDIO_MUTE ", matches: " AUDIO_MUTE \\{?(.*?) *\\}? *>$" }
    returns: value
  set_mute:
    summary: "Turn a channel's mute on or off (AUDIO_MUTE)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
      muted: { type: bool, default: true, label: "Mute", description: "On mutes the channel, off unmutes it." }
    send: "SET {channel:02d} AUDIO_MUTE {muted:on_off}"
    expect: { reply_contains: " AUDIO_MUTE ", contains: " AUDIO_MUTE " }
    returns: ack
  toggle_mute:
    summary: "Toggle a channel's mute (AUDIO_MUTE TOGGLE)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
    send: "SET {channel:02d} AUDIO_MUTE TOGGLE"
    expect: { reply_contains: " AUDIO_MUTE ", contains: " AUDIO_MUTE " }
    returns: ack
  get_gain:
    summary: "Read a channel's digital gain (AUDIO_GAIN_HI_RES)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
    send: "GET {channel:02d} AUDIO_GAIN_HI_RES"
    expect: { reply_contains: " AUDIO_GAIN_HI_RES ", matches: " AUDIO_GAIN_HI_RES \\{?(.*?) *\\}? *>$" }
    returns: value
  set_gain:
    summary: "Set a channel's digital gain (AUDIO_GAIN_HI_RES), dB"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
      gain_tenth_db: { type: int, min: -1100, max: 300, required: true, label: "Gain", description: "Digital gain in tenths of a dB, -1100 (-110.0 dB) to 300 (+30.0 dB)." }
    send: "SET {channel:02d} AUDIO_GAIN_HI_RES {gain_tenth_db:+1100:04d}"
    expect: { reply_contains: " AUDIO_GAIN_HI_RES ", contains: " AUDIO_GAIN_HI_RES " }
    returns: ack
  increase_gain:
    summary: "Increase a channel's digital gain by a step (AUDIO_GAIN_HI_RES INC)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
      step: { type: int, min: 1, max: 1400, required: true, label: "Step", description: "Amount to change the gain by, in tenths of a dB." }
    send: "SET {channel:02d} AUDIO_GAIN_HI_RES INC {step}"
    expect: { reply_contains: " AUDIO_GAIN_HI_RES ", contains: " AUDIO_GAIN_HI_RES " }
    returns: ack
  decrease_gain:
    summary: "Decrease a channel's digital gain by a step (AUDIO_GAIN_HI_RES DEC)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
      step: { type: int, min: 1, max: 1400, required: true, label: "Step", description: "Amount to change the gain by, in tenths of a dB." }
    send: "SET {channel:02d} AUDIO_GAIN_HI_RES DEC {step}"
    expect: { reply_contains: " AUDIO_GAIN_HI_RES ", contains: " AUDIO_GAIN_HI_RES " }
    returns: ack
  get_analog_gain:
    summary: "Read an analog input's preamp gain, dB in 3 dB steps (00-51) (AUDIO_GAIN)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
    send: "GET {channel:02d} AUDIO_GAIN"
    expect: { reply_contains: " AUDIO_GAIN ", matches: " AUDIO_GAIN \\{?(.*?) *\\}? *>$" }
    returns: value
  set_analog_gain:
    summary: "Set an analog input's preamp gain, dB in 3 dB steps (00-51) (AUDIO_GAIN), dB"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
      gain_db: { type: int, min: 0, max: 51, required: true, label: "Analog gain", description: "Preamp gain of an analog input in dB, 0 to 51 in 3 dB steps." }
    send: "SET {channel:02d} AUDIO_GAIN {gain_db:02d}"
    expect: { reply_contains: " AUDIO_GAIN ", contains: " AUDIO_GAIN " }
    returns: ack
  increase_analog_gain:
    summary: "Increase an analog input's preamp gain, dB in 3 dB steps (00-51) by a step (AUDIO_GAIN INC)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
      step: { type: int, min: 3, max: 51, required: true, label: "Step", description: "Amount to change the analog gain by, in dB (3 dB steps)." }
    send: "SET {channel:02d} AUDIO_GAIN INC {step}"
    expect: { reply_contains: " AUDIO_GAIN ", contains: " AUDIO_GAIN " }
    returns: ack
  decrease_analog_gain:
    summary: "Decrease an analog input's preamp gain, dB in 3 dB steps (00-51) by a step (AUDIO_GAIN DEC)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
      step: { type: int, min: 3, max: 51, required: true, label: "Step", description: "Amount to change the analog gain by, in dB (3 dB steps)." }
    send: "SET {channel:02d} AUDIO_GAIN DEC {step}"
    expect: { reply_contains: " AUDIO_GAIN ", contains: " AUDIO_GAIN " }
    returns: ack
  get_device_mute:
    summary: "Read the device mute (DEVICE_AUDIO_MUTE)"
    send: "GET DEVICE_AUDIO_MUTE"
    expect: { reply_contains: " DEVICE_AUDIO_MUTE ", matches: " DEVICE_AUDIO_MUTE \\{?(.*?) *\\}? *>$" }
    returns: value
  set_device_mute:
    summary: "Turn the device mute on or off (DEVICE_AUDIO_MUTE)"
    params:
      muted: { type: bool, default: true, label: "Device mute", description: "On mutes the whole device, off unmutes it." }
    send: "SET DEVICE_AUDIO_MUTE {muted:on_off}"
    expect: { reply_contains: " DEVICE_AUDIO_MUTE ", contains: " DEVICE_AUDIO_MUTE " }
    returns: ack
  toggle_device_mute:
    summary: "Toggle the device mute (DEVICE_AUDIO_MUTE TOGGLE)"
    send: "SET DEVICE_AUDIO_MUTE TOGGLE"
    expect: { reply_contains: " DEVICE_AUDIO_MUTE ", contains: " DEVICE_AUDIO_MUTE " }
    returns: ack
  get_output_level:
    summary: "Read an analog output's level switch (AUDIO_OUT_LVL_SWITCH)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
    send: "GET {channel:02d} AUDIO_OUT_LVL_SWITCH"
    expect: { reply_contains: " AUDIO_OUT_LVL_SWITCH ", matches: " AUDIO_OUT_LVL_SWITCH \\{?(.*?) *\\}? *>$" }
