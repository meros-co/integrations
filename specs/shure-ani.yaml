  set_output_level:
    summary: "Set an analog output's level switch (AUDIO_OUT_LVL_SWITCH)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
      value: { type: enum, values: ["LINE_LVL", "AUX_LVL", "MIC_LVL"], required: true, label: "Output level", description: "LINE_LVL, AUX_LVL or MIC_LVL, on an analog output." }
    send: "SET {channel:02d} AUDIO_OUT_LVL_SWITCH {value}"
    expect: { reply_contains: " AUDIO_OUT_LVL_SWITCH ", contains: " AUDIO_OUT_LVL_SWITCH " }
