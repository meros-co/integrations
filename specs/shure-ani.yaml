  get_summing_mode:
    summary: "Read the audio summing mode (AUDIO_SUMMING_MODE)"
    send: "GET AUDIO_SUMMING_MODE"
    expect: { reply_contains: " AUDIO_SUMMING_MODE ", matches: " AUDIO_SUMMING_MODE \\{?(.*?) *\\}? *>$" }
