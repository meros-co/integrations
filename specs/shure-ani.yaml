  get_usb_connected:
    summary: "Read a USB host connected (ANIUSB-MATRIX) (USB_CONNECT)"
    send: "GET USB_CONNECT"
    expect: { reply_contains: " USB_CONNECT ", matches: " USB_CONNECT \\{?(.*?) *\\}? *>$" }
    returns: value
  get_logic_mute:
    summary: "Read the logic mute (ANIUSB-MATRIX) (LOGIC_MUTE)"
    send: "GET LOGIC_MUTE"
    expect: { reply_contains: " LOGIC_MUTE ", matches: " LOGIC_MUTE \\{?(.*?) *\\}? *>$" }
    returns: value
  set_logic_mute:
    summary: "Turn the logic mute (ANIUSB-MATRIX) on or off (LOGIC_MUTE)"
    params:
      muted: { type: bool, default: true, label: "Logic mute", description: "On sets the logic mute, off clears it (ANIUSB-MATRIX)." }
    send: "SET LOGIC_MUTE {muted:on_off}"
    expect: { reply_contains: " LOGIC_MUTE ", contains: " LOGIC_MUTE " }
    returns: ack
  toggle_logic_mute:
    summary: "Toggle the logic mute (ANIUSB-MATRIX) (LOGIC_MUTE TOGGLE)"
    send: "SET LOGIC_MUTE TOGGLE"
    expect: { reply_contains: " LOGIC_MUTE ", contains: " LOGIC_MUTE " }
    returns: ack
  get_last_error:
    summary: "Read the last error event (ANI4OUT) (LAST_ERROR_EVENT)"
    send: "GET LAST_ERROR_EVENT"
    expect: { reply_contains: " LAST_ERROR_EVENT ", matches: " LAST_ERROR_EVENT \\{?(.*?) *\\}? *>$" }
    returns: value
  get_meter_rate:
    summary: "Read the metering interval, ms (0: off; 1-99 refused) (METER_RATE)"
    send: "GET METER_RATE"
    expect: { reply_contains: " METER_RATE ", matches: " METER_RATE \\{?(.*?) *\\}? *>$" }
    returns: value
  set_meter_rate:
    summary: "Set the metering interval, ms (0: off; 1-99 refused) (METER_RATE), ms"
    params:
      rate_ms: { type: int, min: 0, max: 99999, required: true, label: "Metering interval", description: "Interval in ms at which SAMPLE meter messages are sent, from 100, or 0 to stop; 1-99 are refused." }
    send: "SET METER_RATE {rate_ms:05d}"
    expect: { reply_contains: " METER_RATE ", contains: " METER_RATE " }
