  get_input_meter_mode:
    summary: "Read the input meter tap (INPUT_METER_MODE)"
    send: "GET INPUT_METER_MODE"
    expect: { reply_contains: " INPUT_METER_MODE ", matches: " INPUT_METER_MODE \\{?(.*?) *\\}? *>$" }
    returns: value
  set_input_meter_mode:
    summary: "Set the input meter tap (INPUT_METER_MODE)"
    params:
      value: { type: enum, values: ["PRE_FADER", "POST_FADER"], required: true, label: "Input meter tap", description: "Meter the inputs PRE_FADER or POST_FADER." }
    send: "SET INPUT_METER_MODE {value}"
    expect: { reply_contains: " INPUT_METER_MODE ", contains: " INPUT_METER_MODE " }
    returns: ack
  get_output_meter_mode:
    summary: "Read the output meter tap (OUTPUT_METER_MODE)"
    send: "GET OUTPUT_METER_MODE"
    expect: { reply_contains: " OUTPUT_METER_MODE ", matches: " OUTPUT_METER_MODE \\{?(.*?) *\\}? *>$" }
    returns: value
  set_output_meter_mode:
    summary: "Set the output meter tap (OUTPUT_METER_MODE)"
    params:
      value: { type: enum, values: ["PRE_FADER", "POST_FADER"], required: true, label: "Output meter tap", description: "Meter the outputs PRE_FADER or POST_FADER." }
    send: "SET OUTPUT_METER_MODE {value}"
    expect: { reply_contains: " OUTPUT_METER_MODE ", contains: " OUTPUT_METER_MODE " }
