spec: 1
id: shure-ani
name: "Shure ANI audio network interfaces (ANI4IN, ANI4OUT, ANIUSB-MATRIX, ANI22)"
vendor: Shure
category: mixer

# Written from Shure's command strings for each interface. Channels:
# ANI4IN 1-4 inputs; ANI4OUT 1-4 outputs; ANI22 01-02 analog inputs, 03-04
# analog outputs; ANIUSB-MATRIX 00-10 (see its document); 0 or 00 is all.
source:
  - title: "ANI4IN Command Strings, Version 2.2 (2024-F)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/ANI4IN/en-US"
    note: >
      Manufacturer document, also as a PDF at
      https://pubs2-api.prod.shureweb.eu/documents/public/download/7317.pdf . TCP 2202; GET ALL,
      device information, CHAN_NAME, presets, AUDIO_GAIN_HI_RES and the analog AUDIO_GAIN (00-51 in
      3 dB steps) with INC/DEC, AUDIO_MUTE, FLASH, METER_RATE, sig/clip LED, LED_BRIGHTNESS,
      PHANTOM_PWR_ENABLE, HW_GATING_LOGIC, CHAN_LED_IN_STATE (no answer), REBOOT, INPUT_METER_MODE,
      LIMITER_ENGAGED, AUDIO_SUMMING_MODE, levels, NA names, DEFAULT_SETTINGS, PEQ, ENCRYPTION.
  - title: "ANI4OUT Command Strings, Version 3 (2019-G)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/ANI4OUT/en-US"
    note: >
      Manufacturer document, also as a PDF at
      https://pubs2-api.prod.shureweb.eu/documents/public/download/7106.pdf . TCP 2202; as the
      ANI4IN for outputs, with AUDIO_OUT_LVL_SWITCH (LINE_LVL, AUX_LVL, MIC_LVL), LAST_ERROR_EVENT
      and OUTPUT_METER_MODE.
  - title: "ANIUSB-Matrix Command Strings, Version 4.7 (2024-E)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/ANIUSB-MATRIX/en-US"
    note: >
      Manufacturer document, also as a PDF at
      https://pubs2-api.prod.shureweb.eu/documents/public/download/7125.pdf . TCP 2202; GET ALL (V1
      only), presets incl. PRESET_AUDIO_ROUTE, gain, level switches, AUDIO_MUTE, DEVICE_AUDIO_MUTE,
      metering, LED, limiter, ENCRYPTION_CH, PEQ, meter modes, USB_CONNECT, matrix routing and gain,
      LOGIC_MUTE, call status.
  - title: "ANI22 Command Strings, Version 2.2 (2024-L)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/ANI22/en-US"
    note: >
      Manufacturer document, also as a PDF at
      https://pubs2-api.prod.shureweb.eu/documents/public/download/7123.pdf . TCP 2202; channel
      table p.3; gain (digital and analog), AUDIO_MUTE, DEVICE_AUDIO_MUTE, output level switch,
      metering, LED, PHANTOM_PWR_ENABLE, AUDIO_SUMMING_MODE, logic, PEQ.

transport:
  type: line-tcp
  port: 2202
  framing: delimited
  open: "< "
  close: " >"
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # Answers and change reports are both REP; SAMPLE (metering) never answers.
  # Commands name the parameter their REP carries (expect.reply_contains), so
  # a change pushed meanwhile is never taken for an answer.
  reply_match: "^< REP "
  error_match: "^< REP ERR"
  probe: "GET MODEL"

conversions:
  # AUDIO_GAIN_HI_RES and similar: tenths of a dB offset by 1100 (0-1400 = -110.0 to +30.0 dB)
  shure_gain:
    points: [[0, -110.0], [1400, 30.0]]

ports:
  - { port: 2202, protocol: tcp, role: control }

