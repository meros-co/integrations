  set_led_in:
    summary: "Set an input's mic logic LED in (CHAN_LED_IN_STATE); not answered on the ANI4IN"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel: ANI4IN 1-4 inputs, ANI4OUT 1-4 outputs, ANI22 1-2 analog inputs and 3-4 analog outputs, ANIUSB-MATRIX as its document numbers them; 0 is all." }
      enabled: { type: bool, default: true, label: "LED in", description: "On sets the input's mic logic LED in on, off sets it off." }
    send: "SET {channel:02d} CHAN_LED_IN_STATE {enabled:on_off}"
