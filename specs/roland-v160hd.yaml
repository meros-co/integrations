spec: 1
id: roland-v160hd
name: Roland V-160HD / V-80HD / VR-120HD / VR-6HD / V-1-4K (LAN control)
vendor: Roland
category: switcher

# Roland's current switchers share one LAN command language. Two command sets
# run on the same connection (Basic Control Commands p.2: "You can use the
# basic control commands at the same time as the regular commands"):
#
#   - the Basic Control Commands, mnemonics such as PGM:INPUT2; with ACK;
#     replies, one document for all five models;
#   - the regular commands of each model's Remote Control Guide: DTH (write)
#     and RQH (read) by SysEx address into the model's MIDI Implementation
#     address map, plus VER.
#
# Every Basic command is a command here. The regular commands are offered as
# set_parameter/get_parameter over raw addresses: the address maps run to
# thousands of entries, differ per model, and duplicate most of what the Basic
# set already names. Roland's older LAN command sets (V-60HD, XS-62S, P-20HD,
# XS-82H/83H/84H) answer with a bare ACK byte or a ";" that no line ending
# follows, which the line-tcp framings cannot delimit; they are not here.
# V-600UHD, VR-400UHD and XS-42H/VP-42H have their own specs.
source:
  - title: "LAN/RS-232 Basic Control Commands, edition 02 (© 2025, PDF dated 2026-04-09)"
    author: Roland Corporation
    url: https://static.roland.com/assets/media/pdf/LAN_RS-232_Basic_Control_Commands_eng02_W.pdf
    note: >
      Manufacturer document covering V-160HD, V-80HD, VR-120HD, VR-6HD and
      V-1-4K; the cover lists minimum versions 3.5, 2.2, 1.3, 2.2 and 1.0
      without naming which model each belongs to. Command format and LF after
      replies p.2; VIDEO p.3-19 (QVISRC/QVIST p.3, VFL/PGM p.4, PST p.5,
      AUX/ATO p.6, ATO/CUT/QATG/FRZ p.7, FTB/VIS p.8, QVIS/VOS p.9, TRS/TIM
      p.10, PIS/PPS p.11, PPW p.12, PIP/DSK p.13, DVW p.14, DSS p.15, KYL/KYG
      p.16, SPS/SPT p.17, SPT/STO p.18, ROI p.19); AUDIO p.20-27 (AOS p.20,
      IAL p.21, IAM/IAS p.22, ADT p.23, HPF/GATE p.24, STLK/VOCH p.25,
      OAL/OAM p.26, RVB/ATM p.27); METER p.28-31; CONTROL p.32-38 (MEM/GPO/TLY
      p.32-33, ASW/INSC/MEMSC/PPSC p.33, DSKSC/STRTY/STROA/SRTOSS/QSTRST/QSTRTM
      p.34, SFIM/EXRC/APL p.35, Audio Player p.36-37, Video Player p.37,
      SRT In and readiness checks p.38); CAMERA p.39-41; Macro, Sequencer,
      Graphics Presenter p.42-43; SYSTEM and error replies p.44-45.
  - title: "V-160HD Remote Control Guide, edition 06 (MIDI Implementation version 3.30, Apr. 11, 2025)"
    author: Roland Corporation
    url: https://static.roland.com/assets/media/pdf/V-160HD_Control_eng06_W.pdf
    note: >
      LAN interface (Telnet, TCP 8023, four-character network password) p.37;
      command format (stx optional over LAN, ack, xon/xoff) p.37-38; DTH,
      RQH, VER and ERR codes 0, 4, 5, 6 p.38; address map p.3-34 (Tally
      Info 0C 00 00-33 and TALLY AUTO SEND 0C 01 00 p.32-33).
  - title: "V-80HD Remote Control Guide, edition 01 (MIDI Implementation version 1.03, August 28, 2024)"
    author: Roland Corporation
    url: https://static.roland.com/assets/media/pdf/V-80HD_Control_eng01_W.pdf
    note: >
      LAN interface (TCP 8023, eight-character network password) p.35;
      command list p.36: DTH answered stxACK;, RQH answered stxDTH:a,c;, VER,
      ERR codes 0, 4, 5.
  - title: "VR-120HD Remote Control Guide, edition 04 (MIDI Implementation version 2.00, September 4, 2024)"
    author: Roland Corporation
    url: https://static.roland.com/assets/media/pdf/VR-120HD_Control_eng04_W.pdf
    note: LAN/RS-232 Command Reference p.46-47; four-character network password.
  - title: "VR-6HD Remote Control Guide, edition 03 (MIDI Implementation version 2.00, Sep 27, 2024)"
    author: Roland Corporation
    url: https://static.roland.com/assets/media/pdf/VR-6HD_Control_eng03_W.pdf
    note: LAN/RS-232 Command Reference p.34-35; four-character network password.
  - title: "V-1-4K Remote Control Guide, edition 01 (MIDI Implementation version 1.00, April 9, 2026)"
    author: Roland Corporation
    url: https://static.roland.com/assets/media/pdf/V-1-4K_Remote_Control_eng01_W.pdf
    note: LAN only (TCP 8023, eight-character network password), command list p.21-22.
  - title: Roland V-80HD LAN Control Protocol (PROTOCOL.md, Bitfocus Companion module roland-v80hd, MIT)
    author: Purple Badger Solutions
    url: https://github.com/bitfocus/companion-module-roland-v80hd/blob/main/PROTOCOL.md
    note: >
      Community document, used for corroboration only and labelled as such in
      the quirks: the unterminated "Enter password:" prompt and the effect of
      answering it early, frames prefixed with STX/XON/XOFF, a query answered
      as a value frame then ACK;, one command per TCP write, and no pushes to
      a second control session. Bitfocus companion-module-roland-v160hd (MIT)
      corroborates the prompt and the password line ending.

transport:
  type: line-tcp
  port: 8023
  framing: terminated
  # Roland documents Telnet; a Telnet client ends each line with CR LF, which
  # the V-80HD community document also uses. Commands carry their own ";".
  terminator: crlf
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # A command's reply ends with ACK; or ERR:n; (p.2, p.45). The value frame a
  # query returns before its ACK; is offered to the telemetry rules only, so
  # it is never taken as the reply to the next command. GRCH, AMCH, SPCH,
  # AUXCH, QSRTIST and QBSY are documented without an ACK (p.29-31, p.38,
  # p.44): their frames are replies.
  reply_match: 'ACK;|ERR:[0-9]+;|^[\x02\x11\x13]*(GRCH|AMCH|SPCH|QAUXCH|SRTIST|BSY):'
  probe: "ACS;"

settings:
  password:
    type: string
    secret: true
    default: ""
    max_length: 8
    pattern: '^([\x21-\x7e]{4,8})?$'

# The network password answers the switcher's "Enter password:" prompt. See
# the critical quirk: it is sent on connecting, without waiting for the
# prompt. LAN control needs one set on the switcher, so in practice the
# setting is never empty; it is optional here only so that a configuration
# without it fails at the device (ERR:0) rather than in the catalogue.
on_connect:
  - when_set: password
    after_prompt: "Enter password:"
    send: "{settings.password}"
    refused: "^(Authentication error|Wait a moment)"

ports:
  - { port: 8023, protocol: tcp, role: control }

