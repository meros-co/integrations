    summary: "Whether a macro is executing (QMCRST)"
    params:
      macro: { type: "int", min: 1, max: 100, required: true }
    send: "QMCRST:MACRO{macro};"
    expect: { contains: "ACK;" }
    returns: ack

  set_sequencer:
    summary: "Set the SEQUENCER on or off (SEQSW)"
    params:
      enabled: { type: "bool", required: true }
    send: "SEQSW:{enabled:on_off};"
    expect: { contains: "ACK;" }
    returns: ack

  get_sequencer:
    summary: "SEQUENCER status (QSEQSW)"
    send: "QSEQSW;"
    expect: { contains: "ACK;" }
    returns: ack

  set_auto_sequence:
    summary: "Set SEQUENCER Auto Sequence on or off (SEQAS)"
    params:
      enabled: { type: "bool", required: true }
    send: "SEQAS:{enabled:on_off};"
    expect: { contains: "ACK;" }
    returns: ack

  get_auto_sequence:
    summary: "SEQUENCER Auto Sequence status (QSEQAS)"
    send: "QSEQAS;"
    expect: { contains: "ACK;" }
    returns: ack

  sequencer_previous:
    summary: "Set the SEQUENCER back one step (SEQPV)"
    send: "SEQPV;"
    expect: { contains: "ACK;" }
    returns: ack

  sequencer_back:
    summary: "Set the SEQUENCER back one step (false) or to the beginning (true) (SEQPV:a)"
    params:
      to_start: { type: "bool", required: true }
    send: "SEQPV:{to_start:bool01};"
    expect: { contains: "ACK;" }
    returns: ack

  sequencer_next:
    summary: "Advance the SEQUENCER one step (SEQNX)"
    send: "SEQNX;"
    expect: { contains: "ACK;" }
    returns: ack

  sequencer_jump:
    summary: "Set the SEQUENCER to a sequence number, 1-1000 (SEQJP)"
    params:
      sequence: { type: "int", min: 1, max: 1000, required: true }
    send: "SEQJP:SEQ{sequence};"
    expect: { contains: "ACK;" }
    returns: ack

  sequencer_jump_start:
    summary: "Set the SEQUENCER to START (SEQJP:START)"
    send: "SEQJP:START;"
    expect: { contains: "ACK;" }
    returns: ack

  graphics_next:
    summary: "Graphics Presenter: select the next contents (GPNC)"
    send: "GPNC;"
    expect: { contains: "ACK;" }
    returns: ack

  graphics_select:
    summary: "Graphics Presenter: select contents 1-124 (GPSC)"
    params:
      content: { type: "int", min: 1, max: 124, required: true }
    send: "GPSC:CONTENT{content};"
    expect: { contains: "ACK;" }
    returns: ack

  graphics_hide_front:
    summary: "Graphics Presenter: hide front contents (GPHF)"
    send: "GPHF;"
    expect: { contains: "ACK;" }
    returns: ack

  graphics_hide_background:
    summary: "Graphics Presenter: hide background contents (GPHB)"
    send: "GPHB;"
    expect: { contains: "ACK;" }
    returns: ack

  graphics_toggle_on_air:
    summary: "Graphics Presenter: toggle ON AIR (GPOA)"
    send: "GPOA;"
    expect: { contains: "ACK;" }
    returns: ack

  # ── SYSTEM (Basic Control Commands p.44-45)
  active_sense:
    summary: "Ask for an ACK (ACS)"
    send: "ACS;"
    expect: { contains: "ACK;" }
    returns: ack

  get_version:
    summary: "Model name and version (VER)"
    send: "VER;"
    expect: { contains: "ACK;" }
    returns: ack

  get_busy:
    summary: "Whether the unit is busy (QBSY); the reply carries no ACK (p.44)"
    send: "QBSY;"
    expect: { matches: '^[\x02\x11\x13]*BSY:(OFF|ON);' }
    returns: value

  set_hdcp:
    summary: "Set HDCP on or off (HDCP)"
    params:
      enabled: { type: "bool", required: true }
    send: "HDCP:{enabled:on_off};"
    expect: { contains: "ACK;" }
    returns: ack

  get_hdcp:
    summary: "HDCP status (QHDCP)"
    send: "QHDCP;"
    expect: { contains: "ACK;" }
    returns: ack

  set_test_pattern:
    summary: "Set the test pattern; V-1-4K takes OFF or COLORBAR only (TPT)"
    params:
      pattern: { type: "enum", values: ["OFF", "COLORBAR75", "COLORBAR100", "RAMP", "STEP", "HATCH", "DIAMOND", "CIRCLE", "COLORBAR75-SP", "COLORBAR100-SP", "RAMP-SP", "STEP-SP", "HATCH-SP", "COLORBAR"], required: true }
    send: "TPT:{pattern};"
    expect: { contains: "ACK;" }
    returns: ack

  get_test_pattern:
    summary: "Test pattern (QTPT)"
    send: "QTPT;"
    expect: { contains: "ACK;" }
    returns: ack

  set_test_tone:
    summary: "Set the test tone level, OFF, -20, -10 or 0 dB (TTN:a)"
    params:
      level: { type: "enum", values: ["OFF", "-20", "-10", "0"], required: true }
    send: "TTN:{level};"
    expect: { contains: "ACK;" }
    returns: ack

  set_test_tone_frequency:
    summary: "Set the test tone level and the L and R frequencies, 500 Hz, 1 kHz or 2 kHz (TTN:a,b,c)"
    params:
      level: { type: "enum", values: ["OFF", "-20", "-10", "0"], required: true }
      left: { type: "enum", values: ["500", "1k", "2k"], required: true }
      right: { type: "enum", values: ["500", "1k", "2k"], required: true }
    send: "TTN:{level},{left},{right};"
    expect: { contains: "ACK;" }
    returns: ack

  get_test_tone:
    summary: "Test tone level and frequencies (QTTN)"
    send: "QTTN;"
    expect: { contains: "ACK;" }
    returns: ack

  # ── Regular commands: parameter access by SysEx address (each model's Remote Control Guide, LAN/RS-232 Command Reference). Addresses and values are the model's own MIDI Implementation address map
  set_parameter:
    summary: "Write a parameter at a SysEx address (six hex digits) with a hex value of whole bytes (DTH)"
    params:
      address: { type: "string", required: true, pattern: '^[0-7][0-9A-F]{5}$' }
      value: { type: "string", max_length: 256, required: true, pattern: '^([0-7][0-9A-F])+$' }
    send: "DTH:{address},{value};"
    expect: { contains: "ACK;" }
    returns: ack

  get_parameter:
    summary: "Read a parameter by SysEx address and size, both six hex digits; the value arrives as a DTH frame (RQH)"
    params:
      address: { type: "string", required: true, pattern: '^[0-7][0-9A-F]{5}$' }
      size: { type: "string", default: "000001", pattern: '^[0-7][0-9A-F]{5}$' }
    send: "RQH:{address},{size};"
    expect: { contains: "ACK;" }
    returns: ack

telemetry:
  # Nothing in Roland's documents is pushed for the Basic commands, and the
  # V-80HD community document measured no pushes at all to a control session
  # other than Roland's own RCS. State therefore comes from the replies to
  # queries: the version once on connecting, and the on-air essentials on a
  # one-second schedule (the same community document found 500 ms polling of
  # 65 reads to be the device's limit). Every other query's reply also lands
  # in state when it is asked.
  subscribe:
    send: ["VER;"]
  poll:
    send: ["TLY;", "QPGM;", "QPST;", "QFTB;", "QATG;"]
    every_ms: 1000
  updates:
    # VIDEO
    - match: '^[\x02\x11\x13]*VISRC:(\d+),([^;]+);'
      state: { "video_sources.{1}.name": "{2}" }
    - match: '^[\x02\x11\x13]*VIST:([A-Z0-9]+),([A-Z]+);'
      state: { "video_inputs.{1}.status": "{2}" }
    - match: '^[\x02\x11\x13]*VFL:(\d+);'
      state: { "fader.level": "{1}" }
    - match: '^[\x02\x11\x13]*PGM:([^,;]+);'
      state: { "program.source": "{1}", "program.input": "" }
    - match: '^[\x02\x11\x13]*PGM:([^,;]+),([^;]+);'
      state: { "program.source": "{1}", "program.input": "{2}" }
    - match: '^[\x02\x11\x13]*PST:([^,;]+);'
      state: { "preview.source": "{1}", "preview.input": "" }
    - match: '^[\x02\x11\x13]*PST:([^,;]+),([^;]+);'
      state: { "preview.source": "{1}", "preview.input": "{2}" }
    - match: '^[\x02\x11\x13]*AUX:AUX(\d+),([^,;]+);'
      state: { "aux.{1}.source": "{2}", "aux.{1}.input": "" }
    - match: '^[\x02\x11\x13]*AUX:AUX(\d+),([^,;]+),([^;]+);'
      state: { "aux.{1}.source": "{2}", "aux.{1}.input": "{3}" }
    - match: '^[\x02\x11\x13]*ATG:(OFF|ON);'
      state: { "transition.auto_in_progress": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*FRZ:(OFF|ON);'
      state: { "freeze": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*FTB:([A-Z]+);'
      state: { "output_fade": "{1}" }
    - match: '^[\x02\x11\x13]*VIS:INPUT(\d+),([^;]+);'
      state: { "input_assign.{1}": "{2}" }
    - match: '^[\x02\x11\x13]*VOS:([A-Z0-9]+),([^;]+);'
      state: { "video_outputs.{1}.bus": "{2}" }
    - match: '^[\x02\x11\x13]*TRS:(MIX|WIPE);'
      state: { "transition.type": "{1}" }
    - match: '^[\x02\x11\x13]*TIM:([A-Za-z0-9]+),(\d+);'
      state: { "transition_time.{1}": "{2}" }
    - match: '^[\x02\x11\x13]*PIS:PinP(\d+),([^;]+);'
      state: { "pinp.{1}.source": "{2}" }
    - match: '^[\x02\x11\x13]*PPS:PinP(\d+),(OFF|ON);'
      state: { "pinp.{1}.pgm": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*PPW:PinP(\d+),(OFF|ON);'
      state: { "pinp.{1}.pvw": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*PIP:PinP(\d+),(-?\d+),(-?\d+);'
      state: { "pinp.{1}.position_h": "{2}", "pinp.{1}.position_v": "{3}" }
    - match: '^[\x02\x11\x13]*DSK:DSK(\d+),(OFF|ON);'
      state: { "dsk.{1}.pgm": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*DVW:DSK(\d+),(OFF|ON);'
      state: { "dsk.{1}.pvw": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*DSS:DSK(\d+),([^,;]+),([^;]+);'
      state: { "dsk.{1}.source": "{2}", "dsk.{1}.input": "{3}" }
    - match: '^[\x02\x11\x13]*DSS:DSK(\d+),([^,;]+);'
      state: { "dsk.{1}.source": "{2}", "dsk.{1}.input": "" }
    - match: '^[\x02\x11\x13]*KYL:DSK(\d+),(\d+);'
      state: { "dsk.{1}.level": "{2}" }
    - match: '^[\x02\x11\x13]*KYG:DSK(\d+),(\d+);'
      state: { "dsk.{1}.gain": "{2}" }
    - match: '^[\x02\x11\x13]*SPS:SPLIT(\d+),(OFF|ON);'
      state: { "split.{1}.on": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*SPT:SPLIT(\d+),(-?\d+),(-?\d+),(-?\d+);'
      state: { "split.{1}.a_center": "{2}", "split.{1}.b_center": "{3}", "split.{1}.center": "{4}" }
    - match: '^[\x02\x11\x13]*STO:([^;]+);'
      state: { "still_output": "{1}" }
    - match: '^[\x02\x11\x13]*ROISW:(OFF|ON);'
      state: { "roi.mode": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*ROIZM:ROI(\d+),(\d+);'
      state: { "roi.{1}.zoom": "{2}" }
    - match: '^[\x02\x11\x13]*ROIPT:ROI(\d+),(-?\d+),(-?\d+);'
      state: { "roi.{1}.position_h": "{2}", "roi.{1}.position_v": "{3}" }
    # AUDIO
    - match: '^[\x02\x11\x13]*AOS:([A-Z0-9]+),([A-Z0-9]+);'
      state: { "audio_outputs.{1}.bus": "{2}" }
    - match: '^[\x02\x11\x13]*IAL:([A-Z0-9]+),(-INF|-?\d+);'
      state: { "audio_inputs.{1}.level": "{2}" }
    - match: '^[\x02\x11\x13]*IAM:([A-Z0-9]+),(OFF|ON);'
      state: { "audio_inputs.{1}.mute": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*IAS:([A-Z0-9]+),(OFF|ON);'
      state: { "audio_inputs.{1}.solo": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*ADT:([A-Z0-9]+),(\d+);'
      state: { "audio_inputs.{1}.delay": "{2}" }
    - match: '^[\x02\x11\x13]*HPF:([A-Z0-9]+),(OFF|ON);'
      state: { "audio_inputs.{1}.high_pass_filter": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*GATE:([A-Z0-9]+),(OFF|ON);'
      state: { "audio_inputs.{1}.gate": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*STLK:([A-Z0-9]+),(OFF|ON);'
      state: { "audio_inputs.{1}.stereo_link": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*VOCH:([A-Z0-9]+),(OFF|ON);'
      state: { "audio_inputs.{1}.voice_changer": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*OAL:([A-Z0-9]+),(-INF|-?\d+);'
      state: { "audio_buses.{1}.level": "{2}" }
    - match: '^[\x02\x11\x13]*OAM:([A-Z0-9]+),(OFF|ON);'
      state: { "audio_buses.{1}.mute": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*RVB:(OFF|ON);'
      state: { "reverb": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*ATM:(OFF|ON);'
      state: { "auto_mixing": { value: "{1}", map: { "ON": true, "OFF": false } } }
    # METER
    - match: '^[\x02\x11\x13]*MTRLV:([^;]*);'
      state: { "meters.levels": "{1}" }
    - match: '^[\x02\x11\x13]*MTRCH:(\d+),([^;]+);'
      state: { "meters.channels.{1}": "{2}" }
    - match: '^[\x02\x11\x13]*GRLV:([^;]*);'
      state: { "meters.comp_gr_levels": "{1}" }
    - match: '^[\x02\x11\x13]*GRCH:(\d+),([^;]+);'
      state: { "meters.comp_gr_channels.{1}": "{2}" }
    - match: '^[\x02\x11\x13]*AMLV:([^;]*);'
      state: { "meters.auto_mixing_levels": "{1}" }
    - match: '^[\x02\x11\x13]*AMCH:(\d+),([^;]+);'
      state: { "meters.auto_mixing_channels.{1}": "{2}" }
    - match: '^[\x02\x11\x13]*SPLV:([^;]*);'
      state: { "meters.sig_peak_levels": "{1}" }
    - match: '^[\x02\x11\x13]*SPCH:(\d+),([^;]+);'
      state: { "meters.sig_peak_channels.{1}": "{2}" }
    - match: '^[\x02\x11\x13]*QAUXLV:([^;]*);'
      state: { "meters.aux_levels": "{1}" }
    - match: '^[\x02\x11\x13]*QAUXCH:(\d+),([^;]+);'
      state: { "meters.aux_channels.{1}": "{2}" }
    # CONTROL
    - match: '^[\x02\x11\x13]*MEM:([^;]+);'
      state: { "memory": "{1}" }
    - match: '^[\x02\x11\x13]*GPO:GPO(\d+),(OFF|ON);'
      state: { "gpo.{1}": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*TLY:([0-9,]*);'
      state: { "tally": "{1}" }
    - match: '^[\x02\x11\x13]*ASW:(OFF|ON);'
      state: { "auto_switching": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*STRTY:([A-Z]+);'
      state: { "stream.type": "{1}" }
    - match: '^[\x02\x11\x13]*STRST:([A-Z]+);'
      state: { "stream.status": "{1}" }
    - match: '^[\x02\x11\x13]*STRTM:(\d+);'
      state: { "stream.elapsed": "{1}" }
    - match: '^[\x02\x11\x13]*SFIM:([A-Z]+);'
      state: { "stream.safety_image": "{1}" }
    - match: '^[\x02\x11\x13]*EXRC:(OFF|ON);'
      state: { "stream.external_rec_control": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*STRSTB:([A-Z_]+);'
      state: { "stream.ready": "{1}" }
    - match: '^[\x02\x11\x13]*APS:([A-H]-[1-8]),([A-Z]+);'
      state: { "audio_player.{1}.status": "{2}" }
    - match: '^[\x02\x11\x13]*APE:([A-H]-[1-8]),(OFF|ON);'
      state: { "audio_player.{1}.imported": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*APD:([A-H]-[1-8]),(\d+);'
      state: { "audio_player.{1}.length": "{2}" }
    - match: '^[\x02\x11\x13]*APC:([A-H]-[1-8]),(\d+);'
      state: { "audio_player.{1}.position": "{2}" }
    - match: '^[\x02\x11\x13]*APR:([A-H]-[1-8]),(OFF|ON);'
      state: { "audio_player.{1}.repeat": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*PBTY:([A-Z.]+);'
      state: { "video_player.type": "{1}" }
    - match: '^[\x02\x11\x13]*VPS:([A-Z]+);'
      state: { "video_player.status": "{1}" }
    - match: '^[\x02\x11\x13]*VPE:([A-Z/]+);'
      state: { "video_player.import": "{1}" }
    - match: '^[\x02\x11\x13]*VPD:(\d+);'
      state: { "video_player.length": "{1}" }
    - match: '^[\x02\x11\x13]*VPC:(\d+);'
      state: { "video_player.position": "{1}" }
    - match: '^[\x02\x11\x13]*VPSTB:([A-Z_]+);'
      state: { "video_player.ready": "{1}" }
    - match: '^[\x02\x11\x13]*SRTIST:([A-Z]+);'
      state: { "srt_in.status": "{1}" }
    - match: '^[\x02\x11\x13]*SRTISTB:([A-Z_]+);'
      state: { "srt_in.ready": "{1}" }
    # CAMERA
    - match: '^[\x02\x11\x13]*CPTS:CAMERA(\d+),(\d+);'
      state: { "cameras.{1}.pan_tilt_speed": "{2}" }
    - match: '^[\x02\x11\x13]*CAFC:CAMERA(\d+),(OFF|ON);'
      state: { "cameras.{1}.auto_focus": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*CAEP:CAMERA(\d+),(OFF|ON);'
      state: { "cameras.{1}.auto_exposure": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*CPR:CAMERA(\d+),([^;]+);'
      state: { "cameras.{1}.preset": "{2}" }
    # Macro, Sequencer
    - match: '^[\x02\x11\x13]*MCRST:MACRO(\d+),(OFF|ON);'
      state: { "macros.{1}.running": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*SQS:(OFF|ON);'
      state: { "sequencer.on": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*SQA:(OFF|ON);'
      state: { "sequencer.auto_sequence": { value: "{1}", map: { "ON": true, "OFF": false } } }
    # SYSTEM
    - match: '^[\x02\x11\x13]*VER:([^,;]+),([^;]+);'
      state: { "device.model": "{1}", "device.version": "{2}" }
    - match: '^[\x02\x11\x13]*BSY:(OFF|ON);'
      state: { "busy": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*HCP:(OFF|ON);'
      state: { "hdcp": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: '^[\x02\x11\x13]*TPT:([^;]+);'
      state: { "test_pattern": "{1}" }
    - match: '^[\x02\x11\x13]*TTN:([^,;]+),([^,;]+),([^;]+);'
      state: { "test_tone.level": "{1}", "test_tone.frequency_l": "{2}", "test_tone.frequency_r": "{3}" }
    # Regular commands: a DTH frame answering RQH, or any other DTH the
    # switcher sends, kept by address as raw hex.
    - match: '^[\x02\x11\x13]*DTH:([0-9A-F]{6}),([0-9A-F]+);'
      state: { "parameters.{1}": "{2}" }

state:
  video_sources.*.name:        { type: string, description: "Source at a QVISRC video input index, such as HDMI1 or INPUT3" }
  video_inputs.*.status:       { type: string, description: "Signal status of a physical input (HDMI1, SDI2, ...): NOSIGNAL, DETECTED or UNSUPPORTED" }
  fader.level:                 { type: int, description: "Video fader level, 0-2047 (0-4095 on V-1-4K)" }
  program.source:              { type: string, description: "PGM channel: HDMIn, SDIn, STILLn, V.PLAYER or SRT" }
  program.input:               { type: string, description: "INPUT channel the PGM source is selected as, INPUTn; empty when it was selected directly" }
  preview.source:              { type: string, description: "PST channel" }
  preview.input:               { type: string, description: "INPUT channel the PST source is selected as; empty when selected directly" }
  aux.*.source:                { type: string, description: "Channel on an AUX bus, numbered from 1" }
  aux.*.input:                 { type: string, description: "INPUT channel the AUX source is selected as; empty when selected directly" }
  transition.auto_in_progress: { type: bool, description: "An auto transition is in progress (QATG)" }
  transition.type:             { type: string, description: "MIX or WIPE" }
  transition_time.*:           { type: int, unit: "0.1 s", description: "Transition time by target: MIX, WIPE, PinPn, DSKn, OUTPUTFADE" }
  freeze:                      { type: bool, description: "Freeze on" }
  output_fade:                 { type: string, description: "Output fade: OFF, ON, FADEIN or FADEOUT" }
