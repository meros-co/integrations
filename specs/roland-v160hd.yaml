quirks:
  - models: [all]
    severity: critical
    text: >
      LAN control needs a network password set on the switcher (menu, LAN
      CONTROL or Network, Network Password: four characters on V-160HD,
      VR-120HD and VR-6HD, eight on V-80HD and V-1-4K). The documents say only
      that it is "input when connecting". Community evidence (V-80HD
      PROTOCOL.md, Bitfocus companion-module-roland-v160hd) shows the
      switcher sends "Enter password:" with no line ending about 10 ms after
      the socket opens, then "Welcome to ..." on success or "Authentication
      error..." on failure, and that a password sent before the prompt is
      parsed as a command (ERR:0). The password is sent once the prompt has
      arrived, and nothing is sent before it. "Authentication error" or "Wait
      a moment" (the lockout that repeated wrong passwords trip, during which
      the correct password is also refused) marks the device unauthorized,
      and the password is not sent again until it is opened with corrected
      settings. These prompt and reply texts are community-sourced.

  - models: [all]
    severity: warning
    text: >
      A query is answered by its value frame and then ACK; (p.2-45, "VFL:a;ACK;").
      Queries here complete on the ACK; and return ack; the value is in state,
      assigned by the telemetry rules from the value frame, which arrives
      first. The document says an LF follows the semicolon of each response;
      whether the value frame and ACK; share a line is not stated, and both
      forms are handled. GRCH, AMCH, SPCH, AUXCH, QSRTIST and QBSY are
      documented with no ACK; and return their value directly; if a unit
      does send ACK; after them, that ACK; would be taken as the next
      command's reply.

  - models: [all]
    severity: warning
    text: >
      Responses may start with STX (02H), and the switcher sends XON (11H) and
      XOFF (13H) flow control (Remote Control Guides; V-80HD and V-1-4K print
      replies as stxACK;). STX on commands is optional over LAN (V-160HD,
      VR-120HD, VR-6HD guides) and absent from the V-80HD and V-1-4K command
      lists, so commands are sent without it. Error replies: ERR:0 syntax
      error, ERR:4 invalid (controlled by another setting), ERR:5 out of
      range; ERR:6 (no stx) is RS-232 only.

  - models: [all]
    severity: warning
    text: >
      Send one command at a time and wait for its reply; the queue does this.
      The V-80HD community document measured that several commands in one TCP
      write go unanswered, and that polling faster than every 500 ms locked
      the panel. The telemetry poll here is five queries a second.

  - models: [all]
    severity: info
    text: >
      Parameter ranges differ by model and the commands accept the union of
      them; the switcher answers a value outside its own range with ERR:5.
      Per model (p.3-45): sources V-160HD HDMI1-8, SDI1-8, STILL1-16,
      INPUT1-20; V-80HD HDMI1-4, SDI1-4, STILL1-32, V.PLAYER, SRT, INPUT1-16;
      VR-120HD HDMI1-6, SDI1-6, STILL1-16, V.PLAYER, SRT, INPUT1-8; VR-6HD
      HDMI1-6, STILL1-16, V.PLAYER, SRT, INPUT1-6; V-1-4K HDMI1-5, STILL1-2,
      INPUT1-8. Input Assign also takes STATUS1-2 and TIME (V-80HD, VR-120HD),
      HDMI and BLACK (V-1-4K). Video outputs: V-160HD HDMI1-3, SDI1-3, USB;
      V-80HD HDMI1-3, SDI1-2, USB, STREAM, LCD; VR-120HD HDMI1-3, SDI1-3, USB,
      STREAM, LCD; VR-6HD HDMI1-3, USB, STREAM, LCD; V-1-4K HDMI3-4. Audio
      inputs: V-160HD XLR1-2, RCA1, USB, BLUETOOTH, HDMI1-8, SDI1-8; V-80HD
      adds A.PLAYER, V.PLAYER, SRT with HDMI1-4, SDI1-4; VR-120HD XLR1-6,
      RCA1-2 and HDMI1-6, SDI1-6; VR-6HD XLR1-6, RCA1, HDMI1-6; V-1-4K XLR1,
      USB, HDMI1-5. The meter index ranges are in each command's summary.

  - models: [all]
    severity: info
    text: >
      Wire spellings the document leaves open: test tone levels are printed
      "OFF, -20, -10, 0dB" and frequencies "500, 1k, 2kHz"; the unit is taken
      to apply to the list, so the spec sends OFF, -20, -10, 0 and 500, 1k, 2k.
      Several values are printed with a space before the comma ("RTMP , SRT",
      "STOP , START"); the space is taken as typesetting. The VER example
      prints "V-160HD,2 .00". QTIM on V-1-4K names the DSK as DSK rather than
      DSK1. The AUXLV reply is printed QAUXLV and the AUXCH reply QAUXCH;
      both are taken as printed. Test pattern COLORBAR is the V-1-4K value.

  - models: [all]
    severity: info
    text: >
      The cover of the Basic Control Commands lists minimum versions 3.5, 2.2,
      1.3, 2.2 and 1.0 without model names; in the document's model order
      that is V-160HD 3.5, V-80HD 2.2, VR-120HD 1.3, VR-6HD 2.2 and V-1-4K
      1.0, but the pairing is an inference. Older firmware answers the Basic
      commands with ERR:0.

  - models: [all]
    severity: info
    text: >
      The regular commands address each model's own MIDI Implementation map
      (different on every model) and take hex values in 7-bit bytes;
      multi-byte values follow that map's encoding. The V-80HD community
      document found RQH sizes other than 000001 unanswered. The V-160HD map
      has TALLY AUTO SEND at 0C 01 00 (set_parameter 0C0100 01); the switcher
      then sends tally frames, which land in parameters.0C00xx, but whether a
      second control session receives them is not documented.

  - models: [v-80hd, v-160hd]
    severity: info
    text: >
      Only one control session is served. The V-80HD community document found
      a second connection accepted and then sent nothing, not even the
      password prompt.
