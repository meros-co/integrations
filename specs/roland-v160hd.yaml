commands:
  # ── VIDEO (Basic Control Commands p.3-19)
  get_video_input_source:
    summary: "Name of the source at a video input index (QVISRC); index ranges: V-160HD 0-51, V-80HD 0-56, VR-120HD 0-36, VR-6HD 0-28, V-1-4K 0-15"
    params:
      index: { type: "int", min: 0, max: 56, required: true }
    send: "QVISRC:{index};"
    expect: { contains: "ACK;" }
    returns: ack

  get_video_input_status:
    summary: "Signal status of a physical video input: NOSIGNAL, DETECTED or UNSUPPORTED (QVIST)"
    params:
      input: { type: "enum", values: ["HDMI1", "HDMI2", "HDMI3", "HDMI4", "HDMI5", "HDMI6", "HDMI7", "HDMI8", "SDI1", "SDI2", "SDI3", "SDI4", "SDI5", "SDI6", "SDI7", "SDI8"], required: true }
    send: "QVIST:{input};"
    expect: { contains: "ACK;" }
    returns: ack

  set_video_fader_level:
    summary: "Set the video fader (A/B) level: 0-2047 (V-160HD, V-80HD, VR-120HD, VR-6HD), 0-4095 (V-1-4K) (VFL)"
    params:
      level: { type: "int", min: 0, max: 4095, required: true }
    send: "VFL:{level};"
    expect: { contains: "ACK;" }
    returns: ack

  get_video_fader_level:
    summary: "Video fader level (QVFL)"
    send: "QVFL;"
    expect: { contains: "ACK;" }
    returns: ack

  select_pgm:
    summary: "Select the PGM (program) video channel (PGM)"
    params:
      source: { type: "enum", values: ["HDMI1", "HDMI2", "HDMI3", "HDMI4", "HDMI5", "HDMI6", "HDMI7", "HDMI8", "SDI1", "SDI2", "SDI3", "SDI4", "SDI5", "SDI6", "SDI7", "SDI8", "STILL1", "STILL2", "STILL3", "STILL4", "STILL5", "STILL6", "STILL7", "STILL8", "STILL9", "STILL10", "STILL11", "STILL12", "STILL13", "STILL14", "STILL15", "STILL16", "STILL17", "STILL18", "STILL19", "STILL20", "STILL21", "STILL22", "STILL23", "STILL24", "STILL25", "STILL26", "STILL27", "STILL28", "STILL29", "STILL30", "STILL31", "STILL32", "V.PLAYER", "SRT", "INPUT1", "INPUT2", "INPUT3", "INPUT4", "INPUT5", "INPUT6", "INPUT7", "INPUT8", "INPUT9", "INPUT10", "INPUT11", "INPUT12", "INPUT13", "INPUT14", "INPUT15", "INPUT16", "INPUT17", "INPUT18", "INPUT19", "INPUT20"], required: true }
    send: "PGM:{source};"
    expect: { contains: "ACK;" }
    returns: ack

  get_pgm:
    summary: "PGM channel, and the INPUT it is selected as when it is one (QPGM)"
    send: "QPGM;"
    expect: { contains: "ACK;" }
    returns: ack

  select_pst:
    summary: "Select the PST (preset/preview) video channel (PST)"
    params:
      source: { type: "enum", values: ["HDMI1", "HDMI2", "HDMI3", "HDMI4", "HDMI5", "HDMI6", "HDMI7", "HDMI8", "SDI1", "SDI2", "SDI3", "SDI4", "SDI5", "SDI6", "SDI7", "SDI8", "STILL1", "STILL2", "STILL3", "STILL4", "STILL5", "STILL6", "STILL7", "STILL8", "STILL9", "STILL10", "STILL11", "STILL12", "STILL13", "STILL14", "STILL15", "STILL16", "STILL17", "STILL18", "STILL19", "STILL20", "STILL21", "STILL22", "STILL23", "STILL24", "STILL25", "STILL26", "STILL27", "STILL28", "STILL29", "STILL30", "STILL31", "STILL32", "V.PLAYER", "SRT", "INPUT1", "INPUT2", "INPUT3", "INPUT4", "INPUT5", "INPUT6", "INPUT7", "INPUT8", "INPUT9", "INPUT10", "INPUT11", "INPUT12", "INPUT13", "INPUT14", "INPUT15", "INPUT16", "INPUT17", "INPUT18", "INPUT19", "INPUT20"], required: true }
    send: "PST:{source};"
    expect: { contains: "ACK;" }
    returns: ack

  get_pst:
    summary: "PST channel, and the INPUT it is selected as when it is one (QPST)"
    send: "QPST;"
    expect: { contains: "ACK;" }
    returns: ack

  select_aux:
    summary: "Select the channel sent to an AUX bus; PGMLINK only with AUX Linked PGM enabled (AUX)"
    params:
      aux: { type: "int", min: 1, max: 3, required: true }
      source: { type: "enum", values: ["HDMI1", "HDMI2", "HDMI3", "HDMI4", "HDMI5", "HDMI6", "HDMI7", "HDMI8", "SDI1", "SDI2", "SDI3", "SDI4", "SDI5", "SDI6", "SDI7", "SDI8", "STILL1", "STILL2", "STILL3", "STILL4", "STILL5", "STILL6", "STILL7", "STILL8", "STILL9", "STILL10", "STILL11", "STILL12", "STILL13", "STILL14", "STILL15", "STILL16", "STILL17", "STILL18", "STILL19", "STILL20", "STILL21", "STILL22", "STILL23", "STILL24", "STILL25", "STILL26", "STILL27", "STILL28", "STILL29", "STILL30", "STILL31", "STILL32", "V.PLAYER", "SRT", "INPUT1", "INPUT2", "INPUT3", "INPUT4", "INPUT5", "INPUT6", "INPUT7", "INPUT8", "INPUT9", "INPUT10", "INPUT11", "INPUT12", "INPUT13", "INPUT14", "INPUT15", "INPUT16", "INPUT17", "INPUT18", "INPUT19", "INPUT20", "PGMLINK"], required: true }
    send: "AUX:AUX{aux},{source};"
    expect: { contains: "ACK;" }
    returns: ack

  get_aux:
    summary: "Channel sent to an AUX bus (QAUX)"
    params:
      aux: { type: "int", min: 1, max: 3, required: true }
    send: "QAUX:AUX{aux};"
    expect: { contains: "ACK;" }
    returns: ack

  auto:
    summary: "Auto-switch PST to PGM with the set transition time; only while SPLIT is off (ATO)"
    send: "ATO;"
    expect: { contains: "ACK;" }
    returns: ack

  auto_to:
    summary: "Auto-switch to the given channel; only while SPLIT is off (ATO:a)"
    params:
      source: { type: "enum", values: ["HDMI1", "HDMI2", "HDMI3", "HDMI4", "HDMI5", "HDMI6", "HDMI7", "HDMI8", "SDI1", "SDI2", "SDI3", "SDI4", "SDI5", "SDI6", "SDI7", "SDI8", "STILL1", "STILL2", "STILL3", "STILL4", "STILL5", "STILL6", "STILL7", "STILL8", "STILL9", "STILL10", "STILL11", "STILL12", "STILL13", "STILL14", "STILL15", "STILL16", "STILL17", "STILL18", "STILL19", "STILL20", "STILL21", "STILL22", "STILL23", "STILL24", "STILL25", "STILL26", "STILL27", "STILL28", "STILL29", "STILL30", "STILL31", "STILL32", "V.PLAYER", "SRT", "INPUT1", "INPUT2", "INPUT3", "INPUT4", "INPUT5", "INPUT6", "INPUT7", "INPUT8", "INPUT9", "INPUT10", "INPUT11", "INPUT12", "INPUT13", "INPUT14", "INPUT15", "INPUT16", "INPUT17", "INPUT18", "INPUT19", "INPUT20"], required: true }
    send: "ATO:{source};"
    expect: { contains: "ACK;" }
    returns: ack

  auto_to_with_time:
    summary: "Auto-switch to the given channel over 0.0-4.0 s in tenths, or -1 for the set Transition Time (ATO:a,b)"
    params:
      source: { type: "enum", values: ["HDMI1", "HDMI2", "HDMI3", "HDMI4", "HDMI5", "HDMI6", "HDMI7", "HDMI8", "SDI1", "SDI2", "SDI3", "SDI4", "SDI5", "SDI6", "SDI7", "SDI8", "STILL1", "STILL2", "STILL3", "STILL4", "STILL5", "STILL6", "STILL7", "STILL8", "STILL9", "STILL10", "STILL11", "STILL12", "STILL13", "STILL14", "STILL15", "STILL16", "STILL17", "STILL18", "STILL19", "STILL20", "STILL21", "STILL22", "STILL23", "STILL24", "STILL25", "STILL26", "STILL27", "STILL28", "STILL29", "STILL30", "STILL31", "STILL32", "V.PLAYER", "SRT", "INPUT1", "INPUT2", "INPUT3", "INPUT4", "INPUT5", "INPUT6", "INPUT7", "INPUT8", "INPUT9", "INPUT10", "INPUT11", "INPUT12", "INPUT13", "INPUT14", "INPUT15", "INPUT16", "INPUT17", "INPUT18", "INPUT19", "INPUT20"], required: true }
      time: { type: "int", min: -1, max: 40, required: true }
    send: "ATO:{source},{time};"
    expect: { contains: "ACK;" }
    returns: ack

  cut:
    summary: "Cut PST to PGM; only while SPLIT is off (CUT)"
    send: "CUT;"
    expect: { contains: "ACK;" }
    returns: ack

  cut_to:
    summary: "Cut to the given channel; only while SPLIT is off (CUT:a)"
    params:
      source: { type: "enum", values: ["HDMI1", "HDMI2", "HDMI3", "HDMI4", "HDMI5", "HDMI6", "HDMI7", "HDMI8", "SDI1", "SDI2", "SDI3", "SDI4", "SDI5", "SDI6", "SDI7", "SDI8", "STILL1", "STILL2", "STILL3", "STILL4", "STILL5", "STILL6", "STILL7", "STILL8", "STILL9", "STILL10", "STILL11", "STILL12", "STILL13", "STILL14", "STILL15", "STILL16", "STILL17", "STILL18", "STILL19", "STILL20", "STILL21", "STILL22", "STILL23", "STILL24", "STILL25", "STILL26", "STILL27", "STILL28", "STILL29", "STILL30", "STILL31", "STILL32", "V.PLAYER", "SRT", "INPUT1", "INPUT2", "INPUT3", "INPUT4", "INPUT5", "INPUT6", "INPUT7", "INPUT8", "INPUT9", "INPUT10", "INPUT11", "INPUT12", "INPUT13", "INPUT14", "INPUT15", "INPUT16", "INPUT17", "INPUT18", "INPUT19", "INPUT20"], required: true }
    send: "CUT:{source};"
    expect: { contains: "ACK;" }
    returns: ack

  get_auto_transition:
    summary: "Whether an auto transition is in progress (QATG)"
    send: "QATG;"
    expect: { contains: "ACK;" }
    returns: ack

  toggle_freeze:
    summary: "Toggle freeze (FRZ)"
    send: "FRZ;"
    expect: { contains: "ACK;" }
    returns: ack

  set_freeze:
    summary: "Set freeze on or off (FRZ:a)"
    params:
      enabled: { type: "bool", required: true }
    send: "FRZ:{enabled:on_off};"
    expect: { contains: "ACK;" }
    returns: ack

  get_freeze:
    summary: "Freeze status (QFRZ)"
    send: "QFRZ;"
    expect: { contains: "ACK;" }
    returns: ack

  toggle_output_fade:
    summary: "Toggle output fade (fade to black) (FTB)"
    send: "FTB;"
    expect: { contains: "ACK;" }
    returns: ack

  set_output_fade:
    summary: "Set output fade on or off (FTB:a)"
    params:
      enabled: { type: "bool", required: true }
    send: "FTB:{enabled:on_off};"
    expect: { contains: "ACK;" }
    returns: ack

  get_output_fade:
    summary: "Output fade status: OFF, ON, FADEIN or FADEOUT (QFTB)"
    send: "QFTB;"
    expect: { contains: "ACK;" }
    returns: ack

  set_input_assign:
    summary: "Assign a source to an INPUT channel; N/A clears it (VIS)"
    params:
      input: { type: "int", min: 1, max: 20, required: true }
      source: { type: "enum", values: ["HDMI1", "HDMI2", "HDMI3", "HDMI4", "HDMI5", "HDMI6", "HDMI7", "HDMI8", "SDI1", "SDI2", "SDI3", "SDI4", "SDI5", "SDI6", "SDI7", "SDI8", "STILL1", "STILL2", "STILL3", "STILL4", "STILL5", "STILL6", "STILL7", "STILL8", "STILL9", "STILL10", "STILL11", "STILL12", "STILL13", "STILL14", "STILL15", "STILL16", "STILL17", "STILL18", "STILL19", "STILL20", "STILL21", "STILL22", "STILL23", "STILL24", "STILL25", "STILL26", "STILL27", "STILL28", "STILL29", "STILL30", "STILL31", "STILL32", "V.PLAYER", "SRT", "STATUS1", "STATUS2", "TIME", "HDMI", "BLACK", "N/A"], required: true }
    send: "VIS:INPUT{input},{source};"
    expect: { contains: "ACK;" }
    returns: ack

  get_input_assign:
    summary: "Source assigned to an INPUT channel (QVIS)"
    params:
      input: { type: "int", min: 1, max: 20, required: true }
    send: "QVIS:INPUT{input};"
    expect: { contains: "ACK;" }
    returns: ack

  set_output_assign:
    summary: "Assign a video bus or view to a video output (VOS)"
    params:
      output: { type: "enum", values: ["HDMI1", "HDMI2", "HDMI3", "HDMI4", "SDI1", "SDI2", "SDI3", "USB", "STREAM", "LCD"], required: true }
      bus: { type: "enum", values: ["PGM", "SUB", "PVW", "AUX1", "AUX2", "AUX3", "DSK1", "DSK2", "MULTIVIEW", "INPUTVIEW1", "INPUTVIEW2", "STILLVIEW", "QUADVIEW", "INPUT1", "INPUT2", "INPUT3", "INPUT4", "INPUT5", "INPUT6", "INPUT7", "INPUT8"], required: true }
    send: "VOS:{output},{bus};"
    expect: { contains: "ACK;" }
    returns: ack

  get_output_assign:
    summary: "Video bus assigned to a video output (QVOS)"
    params:
      output: { type: "enum", values: ["HDMI1", "HDMI2", "HDMI3", "HDMI4", "SDI1", "SDI2", "SDI3", "USB", "STREAM", "LCD"], required: true }
    send: "QVOS:{output};"
    expect: { contains: "ACK;" }
    returns: ack

  set_transition_type:
    summary: "Set the transition type, MIX or WIPE (TRS)"
    params:
      type: { type: "enum", values: ["MIX", "WIPE"], required: true }
    send: "TRS:{type};"
    expect: { contains: "ACK;" }
    returns: ack

  get_transition_type:
    summary: "Transition type (QTRS)"
    send: "QTRS;"
    expect: { contains: "ACK;" }
    returns: ack

  set_transition_time:
    summary: "Set a transition time, 0-40 tenths of a second (TIM)"
    params:
      target: { type: "enum", values: ["MIX", "WIPE", "PinP1", "PinP2", "PinP3", "PinP4", "DSK1", "DSK2", "DSK", "OUTPUTFADE"], required: true }
      time: { type: "int", min: 0, max: 40, required: true }
    send: "TIM:{target},{time};"
    expect: { contains: "ACK;" }
    returns: ack

  get_transition_time:
    summary: "A transition time in tenths of a second (QTIM)"
    params:
      target: { type: "enum", values: ["MIX", "WIPE", "PinP1", "PinP2", "PinP3", "PinP4", "DSK1", "DSK2", "DSK", "OUTPUTFADE"], required: true }
    send: "QTIM:{target};"
    expect: { contains: "ACK;" }
    returns: ack

  set_pinp_source:
    summary: "Set the source of a PinP & KEY layer (PIS)"
