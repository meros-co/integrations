quirks:
  - models: [all]
    severity: critical
    text: >
      Only one TCP controller can be connected at a time (guide 2.3 and 2.7); while the core holds the
      connection, the RCS² software and other controllers cannot connect over TCP. UDP, which the guide
      offers for several controllers, is not used.
  - models: [all]
    severity: warning
    text: >
      TAKE, TAKE ALL, step back and reload need TAKEAVA to be 1 first (guide 3.4, 3.5; variables). The
      device answers a TAKE sent while it is not available like any other; read get_take_available first
      when it matters.
  - models: [all]
    severity: warning
    text: >
      The device pushes register changes in the same form as its answers. A push arriving while a command
      waits for its answer is taken as that answer, and a command whose answer does not start with its
      register then fails, though the change is still applied to the state.
  - models: [all]
    severity: info
    text: >
      Ambiguities: the guide gives TAKE ALL as "1,GCtalLF" (3.5), a form with one index, while the commands
      document gives TAKE_ALL no index; the document's "1GCtal" is used. The guide shows commands ended with
      LF in some examples and CR LF in others ("1#CRLF") and says a command ends with its last letter; LF is
      sent.
  - models: [all]
    severity: info
    text: >
      An invalid command is answered with the previous value and then an error E10-E12 (guide 2.4.5), so
      the first line can acknowledge a command the device rejected; values are range-checked before
      sending.
  - models: [all]
    severity: info
    text: >
      Master memories 1-8 are the only presets a controller can recall; the 56 RCS² memories live on the
      computer running RCS² (guide 3.6.2).
