spec: 1
id: analogway-picturall
name: Analog Way Picturall media servers
vendor: Analog Way
category: playback

# Picturall servers take text commands on a telnet-like TCP connection to
# port 11000, one per line, executed when the line feed arrives. The server
# answers in human-readable text with no documented acknowledgement, so
# commands are sent and reported unverified. On connecting, the client waits
# for the server's start-up, turns off the human-readable log and asks for the
# server's messages: control status messages, MSG(target, source, 13, ...),
# are then sent to every client whenever a parameter changes, and are what the
# telemetry rules read.
source:
  - title: "Picturall Series Media Servers (V3.5) User Manual, Appendix D: Picturall Server communication protocol specifications (05/2026)"
    author: Analog Way
    url: "https://dwn01.analogway.com/Site+Internet/Series/Picturall++Mark+II/Common/User+Manual/user-manual-picturall-media-server-357.pdf"
    note: >
      Manufacturer document, references MST02, MSTC02, MSQ04, MSQC04 and MSP16 (R1, R2 and MkII). Appendix D,
      pp.140-147: D.a multicast discovery (224.0.0.180 port 11009, "HELLO"); D.b TCP port 11000 and
      wait_startup on connecting; D.c objects, controls and parameters (sourcen, layern, audion; ctrl_info
      source1 listing play_state, timecode, media_length, slot, collection, media_end_action,
      play_state_req, seek 0-1, fps); D.d media modes (table 12: -1 error, 0 play loop default, 1 play
      next, 2 play stop, 3 play pause, 4 play loop, 5 pause, 6 stop) and draw modes; D.e messages
      MSG(target, source, type, content), types 13 control status, 14 control info, 15 object list, 20
      overflow (then disconnect), 24 object added, 33/38 system results, and the control status example
      with object name="source1" and info media_file, play_state, timecode, media_length; D.f ctrl_status,
      ctrl_info, enum_objects, loglevel all|none, receiving all|none, set object control
      [time=<t>] param=value[,...] with the examples, wait_startup, fullscreen layer display...; D.g
      system and system_bg. Appendix E (pp.148-152): lua, lua_file, runcue and the Lua API. Read again
      2026-10-14 for the full-control commands: the D.c ctrl_info example's source parameters with their
      ranges and defaults (media_end_action 0-10, play_state_req 0-6, seek 0-1, sync source 0-255, fps
      1-140 default 30, relative_fps 0.1-2, fps_mode 0-1, effective_fps, frame_blending mode 0-1), table
      13's draw modes, D.e.c's control status as set-compatible controls separated by "\n", D.e.e's
      object list (id:name), the full set format with time=, fullscreen over several displays; E.b's
      connect and set_pda_value_by_index; Appendix F (pp.153-156): send_ui_event's mouse and keyboard
      events and set_global.
  - title: "Picturall Mark II media servers, TCP/IP quick start guide v1.0 (June 2021)"
    author: Analog Way
    url: "https://dwn01.analogway.com/Site+Internet/Series/Picturall++Mark+II/Common/Programmer's+Guide/picturall_markii_series_tcpip_quick_start_guide.pdf"
    note: >
      Manufacturer document, 5 pages, listed as the Picturall programmer's guide. p.2: port 11000, command
      executed on line feed, Commander's command log; p.3: "cue x" runs a cue; p.4: "set stack2 select
      cue_stack=1,major=0,minor=0" puts cue stack 1 in playback 2 (playback 2 is named stack2), with
      major/minor selecting the cue position, "set stack2 control command=1" presses the playback's go
      button, power on by Wake-on-LAN and "poweroff".

transport:
  type: line-tcp
  port: 11000
  framing: terminated
  terminator: lf
  encoding: utf-8
  timeout_ms: 3000
  reply: none

on_connect:
  - "wait_startup"
  - "loglevel none"
  - "receiving all"

ports:
  - { port: 11000, protocol: tcp, role: control }

models:
  - id: picturall-pro-mkii
    name: Analog Way Picturall Pro Mark II (MSP16-MkII)
    supports: &all [run_cue, playback_select, playback_go, layer_media, layer_play_mode, layer_seek,
               layer_intensity, layer_intensity_fade, layer_position, layer_fullscreen, layer_status,
               status_all, list_objects, poweroff, send_raw, set_parameter, set_parameters, set_parameter_fade,
               set_parameters_fade, object_status, object_info, set_array_value, layer_play, layer_pause,
               layer_stop, layer_media_end_action, layer_sync_source, layer_fps, layer_relative_fps,
               layer_fps_mode, layer_frame_blending, layer_position_fade, layer_fullscreen_displays,
               connect_io, set_global, web_ui_event, run_lua, run_lua_file]
    verification: none
  - id: picturall-quad-mkii
    name: Analog Way Picturall Quad Mark II (MSQ04-MkII)
    supports: *all
    verification: none
  - id: picturall-quad-compact-mkii
    name: Analog Way Picturall Quad Compact Mark II (MSQC04-MkII)
    supports: *all
    verification: none
  - id: picturall-twin-compact-mkii
    name: Analog Way Picturall Twin Compact Mark II (MSTC02-MkII)
    supports: *all
    verification: none
  - id: picturall-pro
    name: Analog Way Picturall Pro (MSP16-R1/R2)
    supports: *all
    verification: none
  - id: picturall-quad
    name: Analog Way Picturall Quad (MSQ04-R1/R2)
    supports: *all
    verification: none
  - id: picturall-quad-compact
    name: Analog Way Picturall Quad Compact (MSQC04-R1/R2)
    supports: *all
    verification: none
  - id: picturall-twin
    name: Analog Way Picturall Twin (MST02-R1/R2)
    supports: *all
    verification: none
  - id: picturall-twin-compact
    name: Analog Way Picturall Twin Compact (MSTC02-R1/R2)
    supports: *all
    verification: none

commands:
  run_cue:
    summary: "Run a cue by number (quick start guide p.3, cue x)"
    params:
      cue: { type: int, min: 0, required: true,
             label: Cue,
             description: "Cue number to run, as numbered in the show." }
    send: "cue {cue}"
    returns: none
  playback_select:
    summary: "Put a cue stack in a playback, at a cue position major.minor; a position other than 0.0 also runs that cue (quick start guide p.4). The playback is named stack<n> on the command line"
    params:
      playback: { type: int, min: 1, required: true,
                  label: Playback,
                  description: "Playback number, from 1." }
      cue_stack: { type: int, min: 0, required: true,
                   label: Cue stack,
                   description: "Cue stack to put in the playback; it is named stack<n> on the server." }
      major: { type: int, min: 0, default: 0,
               label: Cue major,
               description: "Major part of the cue position (the 3 in 3.1); 0.0 only loads the stack, any other position also runs that cue." }
      minor: { type: int, min: 0, default: 0,
               label: Cue minor,
               description: "Minor part of the cue position (the 1 in 3.1); 0.0 only loads the stack, any other position also runs that cue." }
    send: "set stack{playback} select cue_stack={cue_stack},major={major},minor={minor}"
    returns: none
  playback_go:
    summary: "Press a playback's go button (quick start guide p.4, command=1)"
    params:
      playback: { type: int, min: 1, required: true,
                  label: Playback,
                  description: "Playback whose go button to press, from 1." }
    send: "set stack{playback} control command=1"
    returns: none
  layer_media:
    summary: "Select the media a layer plays: slot in a media library (collection) (manual D.f.f example)"
    params:
      layer: { type: int, min: 1, required: true,
               label: Layer,
               description: "Layer number as in the show's objects (layer1, layer2, ...), from 1." }
      slot: { type: int, min: 0, max: 255, required: true,
              label: Slot,
              description: "Media slot in the collection, 0 to 255." }
      collection: { type: int, min: 0, max: 255, default: 0,
                    label: Collection,
                    description: "Media library (collection) holding the slot, 0 to 255." }
    send: "set source{layer} selection slot={slot},collection={collection}"
    returns: none
  layer_play_mode:
    summary: "Requested play mode of a layer: 0 play loop (default), 1 play next, 2 play stop, 3 play pause, 4 play loop, 5 pause, 6 stop (manual D.d.a, play_state_req)"
    params:
      layer: { type: int, min: 1, required: true,
               label: Layer,
               description: "Layer number as in the show's objects (layer1, layer2, ...), from 1." }
      mode: { type: int, min: 0, max: 6, required: true,
              label: Play mode,
              description: "Requested play mode: 0 play loop (default), 1 play next, 2 play stop, 3 play pause, 4 play loop, 5 pause, 6 stop." }
    send: "set source{layer} control play_state_req={mode}"
    returns: none
  layer_seek:
    summary: "Seek a layer's media, 0 to 1 of its length (manual D.c, seek)"
    params:
      layer: { type: int, min: 1, required: true,
               label: Layer,
               description: "Layer number as in the show's objects (layer1, layer2, ...), from 1." }
      position: { type: float, min: 0, max: 1, required: true,
                  label: Position,
                  description: "Position in the layer's media as a fraction of its length: 0 is the start, 1 the end." }
    send: "set source{layer} control seek={position:.4f}"
    returns: none
  layer_intensity:
    summary: "Intensity of a layer, 0 to 1 (manual D.f.f, composition intensity)"
    params:
      layer: { type: int, min: 1, required: true,
               label: Layer,
               description: "Layer number as in the show's objects (layer1, layer2, ...), from 1." }
      intensity: { type: float, min: 0, max: 1, required: true,
                   label: Intensity,
                   description: "Layer intensity, 0 (invisible) to 1 (full)." }
    send: "set layer{layer} composition intensity={intensity:.3f}"
    returns: none
  layer_intensity_fade:
    summary: "Fade a layer's intensity over a time in seconds (manual D.f.f, time=)"
    params:
      layer: { type: int, min: 1, required: true,
               label: Layer,
               description: "Layer number as in the show's objects (layer1, layer2, ...), from 1." }
      intensity: { type: float, min: 0, max: 1, required: true,
                   label: Intensity,
                   description: "Target layer intensity, 0 (invisible) to 1 (full)." }
      time: { type: float, min: 0, required: true,
              label: Fade time,
              description: "Fade duration in seconds; 0 changes at once." }
    send: "set layer{layer} composition time={time:.2f} intensity={intensity:.3f}"
    returns: none
  layer_position:
    summary: "Position of a layer, x and y in the composition's units (manual D.f.f, composition x and y)"
    params:
      layer: { type: int, min: 1, required: true,
               label: Layer,
               description: "Layer number as in the show's objects (layer1, layer2, ...), from 1." }
      x: { type: float, required: true,
           label: X,
           description: "Horizontal position of the layer in the composition's units." }
      y: { type: float, required: true,
           label: "Y",
           description: "Vertical position of the layer in the composition's units." }
    send: "set layer{layer} composition x={x:.4f},y={y:.4f}"
    returns: none
  layer_fullscreen:
    summary: "Fit a layer to a display (manual D.f.h, fullscreen layer display)"
    params:
      layer: { type: int, min: 1, required: true,
               label: Layer,
               description: "Layer number as in the show's objects (layer1, layer2, ...), from 1." }
      display: { type: int, min: 1, required: true,
                 label: Display,
                 description: "Display to fit the layer to, from 1." }
    send: "fullscreen layer{layer} {display}"
    returns: none
  layer_status:
    summary: "Ask for a layer's source status; the answer arrives as a control status message (manual D.f.a)"
    params:
      layer: { type: int, min: 1, required: true,
               label: Layer,
               description: "Layer number as in the show's objects (layer1, layer2, ...), from 1." }
    send: "ctrl_status source{layer}"
    returns: none
  status_all:
    summary: "Ask for the status of every object; the answers arrive as control status messages (manual D.f.a)"
    send: "ctrl_status"
    returns: none
  list_objects:
    summary: "Ask for the list of objects and their IDs (manual D.f.c, enum_objects)"
    send: "enum_objects"
    returns: none
  poweroff:
    summary: "Power the server off; it is started again by Wake-on-LAN (quick start guide p.4)"
    send: "poweroff"
    returns: none
  send_raw:
    summary: "Any server command line, e.g. a set command copied from Picturall Commander's command log (quick start guide p.2)"
    params:
      command: { type: string, max_length: 1024, required: true,
                 label: Command,
                 description: "A full server command line, e.g. a set command copied from Picturall Commander's command log." }
    send: "{command}"
    returns: none

  # ── Any object's parameters (D.f.f set, D.f.a ctrl_status, D.f.b ctrl_info) ─
  set_parameter:
    summary: "Set one parameter of any object's control, such as a layer's composition or a source's selection (manual D.f.f, set)"
    params:
      object: &object { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$', required: true, label: Object, description: "Object name, as enum_objects lists it: sourceN, layerN, audioN, stackN, gpuN and so on." }
      control: &control { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$', required: true, label: Control, description: "Control of the object holding the parameter, as ctrl_info lists it (composition, selection, control, time...)." }
      param: &param { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$', required: true, label: Parameter, description: "Parameter name in the control, as ctrl_info lists it." }
      value: &pvalue { type: string, max_length: 1024, pattern: '^("[^"\\]*"|[^\s",=]+)$', required: true, label: Value, description: "Value in the parameter's type: a number such as 0.8 or 3, or text in double quotes such as \"clip.mov\"." }
    send: "set {object} {control} {param}={value}"
    returns: none
  set_parameters:
    summary: "Set several parameters of one object's control at once, as parameter=value pairs separated by commas (manual D.f.f, set)"
    params:
      object: *object
      control: *control
      values: &pvalues { type: string, max_length: 4096, pattern: '^[A-Za-z][A-Za-z0-9_]*=("[^"\\]*"|[^\s",=]+)(,[A-Za-z][A-Za-z0-9_]*=("[^"\\]*"|[^\s",=]+))*$', required: true, label: Values, description: "parameter=value pairs separated by commas, such as x=0.3,y=0.2,intensity=0.8; text values in double quotes." }
    send: "set {object} {control} {values}"
    returns: none
  set_parameter_fade:
    summary: "Crossfade one parameter of an object's control to a value over a time in seconds (manual D.f.f, set with time=)"
    params:
      object: *object
      control: *control
      param: *param
      value: *pvalue
      time: &fade { type: float, min: 0, max: 3600, required: true, label: Fade time, description: "Crossfade duration in seconds; 0 changes at once." }
    send: "set {object} {control} time={time:.2f} {param}={value}"
    returns: none
  set_parameters_fade:
    summary: "Crossfade several parameters of one object's control over a time in seconds (manual D.f.f, set with time=)"
    params:
      object: *object
      control: *control
      values: *pvalues
      time: *fade
    send: "set {object} {control} time={time:.2f} {values}"
    returns: none
  object_status:
    summary: "Ask for an object's current parameter values; they arrive as a control status message (manual D.f.a, ctrl_status)"
    params:
      object: *object
    send: "ctrl_status {object}"
    returns: none
  object_info:
    summary: "Ask for an object's controls and parameters with their types, defaults and ranges; they arrive as a control info message (manual D.f.b, ctrl_info)"
    params:
      object: *object
    send: "ctrl_info {object}"
    returns: none
  set_array_value:
    summary: "Set one element of an array (DoubleArray) parameter, through the Lua API's set_pda_value_by_index (manual E.b)"
    params:
      object: *object
      control: *control
      param: *param
      index: { type: int, min: 0, max: 65535, required: true, label: Index, description: "Element of the array to set, from 0; an index out of range is ignored." }
      value: { type: float, required: true, label: Value, description: "New value of the element." }
    send: 'lua "set_pda_value_by_index(\"{object}\", \"{control}\", \"{param}\", {index}, {value:.6f})"'
    returns: none

  # ── Layer playback and timing (manual D.c, D.d.a) ────────────────────────
  layer_play:
    summary: "Play a layer's media, looping (play_state_req 0, the default play mode)"
    params:
      layer: &layer { type: int, min: 1, required: true, label: Layer, description: "Layer number as in the show's objects (layer1, layer2, ...), from 1." }
    send: "set source{layer} control play_state_req=0"
    returns: none
  layer_pause:
    summary: "Pause a layer's media (play_state_req 5)"
    params:
      layer: *layer
    send: "set source{layer} control play_state_req=5"
    returns: none
  layer_stop:
    summary: "Stop a layer's media (play_state_req 6)"
    params:
      layer: *layer
    send: "set source{layer} control play_state_req=6"
    returns: none
  layer_media_end_action:
    summary: "What a layer's source does at the end of its media, 0 to 10 (source control media_end_action)"
    params:
      layer: *layer
      action: { type: int, min: 0, max: 10, required: true, label: End action, description: "Media end action number, 0 to 10; the manual gives the range but not the meanings." }
    send: "set source{layer} control media_end_action={action}"
    returns: none
  layer_sync_source:
    summary: "Synchronise a layer's source to another, 0 for none (source sync source)"
    params:
      layer: *layer
      source: { type: int, min: 0, max: 255, required: true, label: Sync source, description: "Source number to follow, 0 to 255; 0 is the default." }
    send: "set source{layer} sync source={source}"
    returns: none
  layer_fps:
    summary: "Frame rate a layer's source plays at, 1 to 140 fps (source time fps)"
    params:
      layer: *layer
      fps: { type: float, min: 1, max: 140, required: true, label: Frame rate, description: "Playback frame rate in frames per second, 1 to 140 (default 30)." }
    send: "set source{layer} time fps={fps:.3f}"
    returns: none
  layer_relative_fps:
    summary: "Relative playback speed of a layer's source, 0.1 to 2 (source time relative_fps)"
    params:
      layer: *layer
      speed: { type: float, min: 0.1, max: 2, required: true, label: Relative speed, description: "Speed relative to the media's own rate, 0.1 to 2 (default 1)." }
    send: "set source{layer} time relative_fps={speed:.3f}"
    returns: none
  layer_fps_mode:
    summary: "Frame rate mode of a layer's source, 0 or 1 (source time fps_mode)"
    params:
      layer: *layer
      mode: { type: int, min: 0, max: 1, required: true, label: FPS mode, description: "Frame rate mode, 0 (default) or 1; the manual gives the range but not the meanings." }
    send: "set source{layer} time fps_mode={mode}"
    returns: none
  layer_frame_blending:
    summary: "Frame blending of a layer's source, off (0) or on (1) (source frame_blending mode)"
    params:
      layer: *layer
      mode: { type: int, min: 0, max: 1, required: true, label: Frame blending, description: "Frame blending mode, 0 (default) or 1." }
    send: "set source{layer} frame_blending mode={mode}"
    returns: none
  layer_position_fade:
    summary: "Move a layer to x and y over a time in seconds (manual D.f.f, composition time=)"
    params:
      layer: *layer
      x: { type: float, required: true, label: X, description: "Horizontal position of the layer in the composition's units." }
      y: { type: float, required: true, label: "Y", description: "Vertical position of the layer in the composition's units." }
      time: *fade
    send: "set layer{layer} composition time={time:.2f} x={x:.4f},y={y:.4f}"
    returns: none
  layer_fullscreen_displays:
    summary: "Fit a layer to the bounding box of several displays (manual D.f.h, fullscreen layer2 2 5 3)"
    params:
      layer: *layer
      displays: { type: string, pattern: '^[0-9]{1,3}( [0-9]{1,3}){0,63}$', required: true, label: Displays, description: "Display numbers separated by spaces, such as 2 5 3." }
    send: "fullscreen layer{layer} {displays}"
    returns: none

  # ── Routing, globals, web pages and Lua (manual E, F) ────────────────────
  connect_io:
    summary: "Connect an output of one IO object to an input of another, through the Lua API's connect (manual E.b)"
    params:
      output: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$', required: true, label: Output object, description: "Name of the object whose output is connected." }
      output_id: { type: int, min: 0, max: 65535, required: true, label: Output index, description: "Output index on that object." }
      input: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$', required: true, label: Input object, description: "Name of the object whose input it feeds." }
      input_id: { type: int, min: 0, max: 65535, required: true, label: Input index, description: "Input index on that object." }
    send: 'lua "connect(\"{output}\", {output_id}, \"{input}\", {input_id})"'
    returns: none
  set_global:
    summary: "Set a server global variable, such as enable_cef_logging (manual F.a, set_global)"
    params:
      name: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$', required: true, label: Global, description: "Name of the global variable." }
      value: { type: string, pattern: '^[^\s"]{1,256}$', required: true, label: Value, description: "Value of the variable; a global is false when it is 0 or absent." }
    send: "set_global {name} {value}"
    returns: none
  web_ui_event:
    summary: "Send a mouse or keyboard event to a web page source (manual F.c, send_ui_event)"
    params:
      source: { type: int, min: 1, max: 32, required: true, label: Source, description: "Source showing the web page, 1 to 32." }
      event: { type: string, pattern: '^(Mouse (ButtonLeftDown|ButtonLeftUp|ButtonMiddleDown|ButtonMiddleUp|ButtonRightDown|ButtonRightUp|Move) [0-9]{1,5} [0-9]{1,5}|Keyboard (KeyDown|KeyChar|KeyUp) (Name [A-Za-z0-9]{1,32}|[0-9]{1,5} [0-9]{1,5})( (CapsLock|NumLock|Shift|Ctrl|Alt|AltGr|Meta|MouseButtonLeft|MouseButtonMiddle|MouseButtonRight)){0,10})$', required: true, label: Event, description: "Event as the manual writes it, such as Mouse ButtonLeftDown 1010 890 or Keyboard KeyDown Name KeyA Shift." }
    send: 'lua "send_ui_event(\"source{source}\", \"{event}\")"'
    returns: none
  run_lua:
    summary: "Run Lua code on the server (manual E.a, lua); quotation marks inside the code are escaped with a backslash, as the manual requires"
    params:
      code: { type: string, max_length: 4096, required: true, label: Lua code, description: "Lua code on one line, with every double quote inside it written as \\\" as the manual shows (dmesg(\\\"hello\\\"))." }
    send: 'lua "{code}"'
    returns: none
  run_lua_file:
    summary: "Run a Lua script file on the server, by path or by name in /picturall/media/scripts (manual E.a, lua_file)"
    params:
      path: { type: string, pattern: '^[^\s"]{1,512}$', required: true, label: Script, description: "Absolute path, or a file name looked up in /picturall/media/scripts, without spaces." }
    send: "lua_file {path}"
    returns: none

telemetry:
  # Every parameter is reported once; afterwards the server sends a control
  # status message to every client whenever a parameter changes (D.e.c).
  poll:
    send: ["enum_objects", "ctrl_status"]
  updates:
    # Every object's every control, as the set-compatible text the server
    # sends (D.e.c): one state value per control, "param=value,...".
    - match: '^MSG\(\d+, *\d+, *13, *object name="([A-Za-z0-9_]+)"'
      match_each: '\\n([a-z][a-z0-9_]*) ((?:[^\\]|\\[^n])*)'
      state: { "objects.{1}.controls.{2}": "{3}" }
    # The object list (D.e.e): each object's id, the source field of its messages.
    - match: '^MSG\(\d+, *\d+, *15, *'
      match_each: '(\d+):([A-Za-z][A-Za-z0-9_]*):'
      replace: objects_by_id
      state: { "objects_by_id.{1}": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\bmedia_end_action=(\d+)'
      state: { "layers.{1}.media_end_action": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\bplay_state_req=(\d+)'
      state: { "layers.{1}.play_mode": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\bseek=(-?[0-9.]+)'
      state: { "layers.{1}.seek": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\\nsync source=(\d+)'
      state: { "layers.{1}.sync_source": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\bfps=(-?[0-9.]+)'
      state: { "layers.{1}.fps": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\brelative_fps=(-?[0-9.]+)'
      state: { "layers.{1}.relative_fps": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\bfps_mode=(\d+)'
      state: { "layers.{1}.fps_mode": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\beffective_fps=(-?[0-9.]+)'
      state: { "layers.{1}.effective_fps": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\\nframe_blending mode=(\d+)'
      state: { "layers.{1}.frame_blending": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="layer(\d+)".*\\ncomposition (?:[^\\]*,)?x="?(-?[0-9.]+)'
      state: { "layers.{1}.x": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="layer(\d+)".*\\ncomposition (?:[^\\]*,)?y="?(-?[0-9.]+)'
      state: { "layers.{1}.y": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\bmedia_file="([^"]*)"'
      state: { "layers.{1}.media_file": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\bplay_state=(-?\d+)'
      state: { "layers.{1}.play_state": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\btimecode=(\d+)'
      state: { "layers.{1}.timecode_ns": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\bmedia_length=(\d+)'
      state: { "layers.{1}.media_length_ns": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\bslot=(\d+)'
      state: { "layers.{1}.slot": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="source(\d+)".*\bcollection=(\d+)'
      state: { "layers.{1}.collection": "{2}" }
    - match: '^MSG\(\d+, *\d+, *13, *object name="layer(\d+)".*\bintensity="?(-?[0-9.]+)'
      state: { "layers.{1}.intensity": "{2}" }
    - match: '^MSG\(\d+, *\d+, *24, *([^)]+)\)'
      state: { "server.last_object_added": "{1}" }
    # A new object: the list read again, and the object's values.
    - match: '^MSG\(\d+, *\d+, *24, *([A-Za-z][A-Za-z0-9_]*)\)'
      then_send: ["enum_objects", "ctrl_status {1}"]
    - match: '^MSG\(\d+, *\d+, *20\b'
      state: { "server.overflow": { value: "20", map: { "20": true } } }

state:
  layers.*.media_file: { type: string, description: "File the layer's source plays" }
  layers.*.play_state: { type: int, description: "Actual play state: -1 error, 0 play loop, 1 play next, 2 play stop, 3 play pause, 4 play loop, 5 pause, 6 stop" }
  layers.*.timecode_ns: { type: int, unit: ns, description: "Timecode of the media playing" }
  layers.*.media_length_ns: { type: int, unit: ns, description: "Length of the media" }
  layers.*.slot: { type: int, description: "Media slot playing" }
  layers.*.collection: { type: int, description: "Media library playing" }
  layers.*.intensity: { type: float, description: "Layer intensity, 0 to 1" }
  server.last_object_added: { type: string, description: "Name of the last object added to the show (message 24)" }
  objects.*.controls.*: { type: string, description: "An object's control as the server last reported it, by object and control name: its parameters as set-compatible parameter=value text, such as slot=2,collection=0" }
  objects_by_id.*: { type: string, description: "Object name by the object id the server's messages carry as their source (enum_objects)" }
  layers.*.media_end_action: { type: int, description: "Source's media end action, 0 to 10" }
  layers.*.play_mode: { type: int, description: "Source's requested play mode (play_state_req), as layer_play_mode sets it" }
  layers.*.seek: { type: float, description: "Source's seek position, 0 to 1" }
  layers.*.sync_source: { type: int, description: "Source the layer's source synchronises to, 0 for none" }
  layers.*.fps: { type: float, unit: fps, description: "Source's frame rate control" }
  layers.*.relative_fps: { type: float, description: "Source's relative playback speed" }
  layers.*.fps_mode: { type: int, description: "Source's frame rate mode" }
  layers.*.effective_fps: { type: float, unit: fps, description: "Source's current effective frame rate" }
  layers.*.frame_blending: { type: int, description: "Source's frame blending mode" }
  layers.*.x: { type: float, description: "Layer's horizontal position in the composition" }
  layers.*.y: { type: float, description: "Layer's vertical position in the composition" }
  server.overflow: { type: bool, description: "The server reported a message queue overflow and disconnects the client (message 20)" }

quirks:
  - models: [all]
    severity: warning
    text: >
      The server has no documented acknowledgement: its answers are human-readable text, so every command
      is reported unverified. Failures show only as missing state changes.
  - models: [all]
    severity: warning
    text: >
      Control status messages list parameters as name=value pairs separated by commas and by the string
      "\n" (D.e.c). The rules read them from one line; if a server sends real line breaks between controls,
      only the parameters on the line with object name are read.
  - models: [all]
    severity: info
    text: >
      The manual's set examples write values quoted (x="0.3") and unquoted (intensity=0.0); unquoted values
      are sent, as in the timed examples. Layer numbers are those of the show's objects (sourcen, layern).
  - models: [all]
    severity: info
    text: >
      Playback go is the only playback command documented (command=1); others, and the meaning of
      media_end_action, are not, and are reachable through send_raw (Picturall Commander's command log
      shows the lines it sends).
  - models: [all]
    severity: info
    text: >
      If the client cannot keep up, the server sends message 20 and disconnects (D.e.b); the core
      reconnects.
  - models: [all]
    severity: info
    text: >
      The commands system and system_bg (Linux shell) are not offered as commands; send_raw can still send
      them.
  - models: [all]
    severity: critical
    text: >
      run_lua and run_lua_file run any Lua on the server, which can change any parameter, run any console
      command and wait or loop; nothing limits what the code does and none of it can be undone from here.
      The manual requires double quotes inside the code to be escaped with a backslash; the code is sent
      as given. set_array_value, connect_io and web_ui_event are sent as one lua command each, built from
      the Lua API functions set_pda_value_by_index, connect and send_ui_event.
  - models: [all]
    severity: info
    text: >
      set_parameter, set_parameters and their _fade forms set any parameter of any object, the way
      Picturall Commander does: a layer's transform, colour, crop and draw mode are parameters of its
      layerN object, its media and playback of sourceN, its audio of audioN. The manual describes only the
      parameters of a source (and x, y and intensity of a layer's composition); every object's controls,
      parameters, types, defaults and ranges are listed by object_info (ctrl_info) and their values by
      object_status, and the state keeps every object's every control as the server reports it
      (objects.*.controls.*), so a parameter changed from any client shows there.
  - models: [all]
    severity: info
    text: >
      Not in the protocol document, so not offered beyond the generic set and Lua: creating or deleting
      objects (the server only reports an object added, message 24, after which the object list and the
      object are read again), stopping or pausing a playback (stack), whose only documented command is go
      (command=1), and outputs and mappings other than fitting a layer to displays (fullscreen) and
      connecting IO objects (connect_io). The meanings of media_end_action 0 to 10, fps_mode 0 and 1 and
      the layer draw-mode parameter's name are not documented either; draw modes are 0 additive, 1 replace,
      2 subtract, 3 darken, 4 lighten, 5 multiply, 6 linear burn, 7 screen (table 13).
