# FreeShow's variables, as its answer to the variable request names them.
state:
  show.name: { type: string, description: "Name of the show on output" }
  show.next_name: { type: string, description: "Name of the next show in the project" }
  layout.slides: { type: int, description: "Number of slides in the active layout" }
  layout.notes: { type: string, description: "Notes of the active layout" }
  slide.number: { type: int, description: "Number of the slide on output, as FreeShow counts it" }
  slide.group: { type: string, description: "Group (verse, chorus...) of the slide on output" }
  slide.next_group: { type: string, description: "Group of the next slide" }
  slide.notes: { type: string, description: "Notes of the slide on output" }
  slide.next_notes: { type: string, description: "Notes of the next slide" }
  slide.previous_text: { type: string, description: "Text of the previous slide" }
  slide.text: { type: string, description: "Text of the slide on output" }
  slide.next_text: { type: string, description: "Text of the next slide" }
  video.time: { type: string, description: "Playing video's position, as FreeShow formats it (00:00)" }
  video.remaining: { type: string, description: "Playing video's time remaining, as FreeShow formats it" }
  video.duration: { type: string, description: "Playing video's length, as FreeShow formats it" }
  audio.title: { type: string, description: "Title of the playing audio" }
  audio.time: { type: string, description: "Playing audio's position, as FreeShow formats it (00:00)" }
  audio.remaining: { type: string, description: "Playing audio's time remaining, as FreeShow formats it" }
  audio.duration: { type: string, description: "Playing audio's length, as FreeShow formats it" }
  audio.volume: { type: string, description: "Audio volume, as FreeShow reports it" }
  project.name: { type: string, description: "Name of the active project" }
  timer.status: { type: string, description: "Timer state as FreeShow reports it: playing, paused or stopped" }
  output.active_layers: { type: string, description: "Output layers showing something, as FreeShow lists them" }
  output.active_styles: { type: string, description: "Output styles in use, as FreeShow lists them" }
  output.windows_active: { type: bool, description: "Whether the output windows are shown" }
  output.locked: { type: bool, description: "Whether the outputs are locked" }
  stage.layout: { type: string, description: "Stage layout on the stage output" }
  song_usage.logging: { type: bool, description: "Whether song usage is being logged" }

telemetry:
  # FreeShow's Socket.IO server on 5505 answers the variable request with
  # every variable's value; the request goes once a second, as the
  # Companion module sends it. With an API password, it goes in the
  # Socket.IO handshake's auth as FreeShow's API page shows (auth: {token}).
  websocket:
    path: /socket.io/
    port: { setting: socket_port }
    socketio: { auth: '{"token":{settings.token:json}}' }
    send: '["data","{\"isVariable\":true,\"keys\":[\"show_name\",\"show_name_next\",\"layout_slides\",\"layout_notes\",\"slide_number\",\"slide_group\",\"slide_group_next\",\"slide_notes\",\"slide_notes_next\",\"slide_text_previous\",\"slide_text_current\",\"slide_text_next\",\"video_time\",\"video_countdown\",\"video_duration\",\"audio_title\",\"audio_time\",\"audio_countdown\",\"audio_duration\",\"audio_volume\",\"active_project_name\",\"timer_status\",\"active_layers\",\"active_styles\",\"output_windows_active\",\"outputs_locked\",\"stage_output_layout\",\"log_song_usage\"]}"]'
    every_ms: 1000
  updates:
    - json_match: { "$.event": "^data$", "$.data.isVariable": "^true$" }
      json:
        show_name: "$.data.values.show_name"
        show_name_next: "$.data.values.show_name_next"
        layout_slides: "$.data.values.layout_slides"
        layout_notes: "$.data.values.layout_notes"
        slide_number: "$.data.values.slide_number"
        slide_group: "$.data.values.slide_group"
        slide_group_next: "$.data.values.slide_group_next"
        slide_notes: "$.data.values.slide_notes"
        slide_notes_next: "$.data.values.slide_notes_next"
        slide_text_previous: "$.data.values.slide_text_previous"
        slide_text_current: "$.data.values.slide_text_current"
        slide_text_next: "$.data.values.slide_text_next"
        video_time: "$.data.values.video_time"
        video_countdown: "$.data.values.video_countdown"
        video_duration: "$.data.values.video_duration"
        audio_title: "$.data.values.audio_title"
        audio_time: "$.data.values.audio_time"
        audio_countdown: "$.data.values.audio_countdown"
        audio_duration: "$.data.values.audio_duration"
        audio_volume: "$.data.values.audio_volume"
        active_project_name: "$.data.values.active_project_name"
        timer_status: "$.data.values.timer_status"
        active_layers: "$.data.values.active_layers"
        active_styles: "$.data.values.active_styles"
        output_windows_active: "$.data.values.output_windows_active"
        outputs_locked: "$.data.values.outputs_locked"
        stage_output_layout: "$.data.values.stage_output_layout"
        log_song_usage: "$.data.values.log_song_usage"
      state:
        show.name: "{show_name}"
        show.next_name: "{show_name_next}"
        layout.slides: "{layout_slides}"
        layout.notes: "{layout_notes}"
        slide.number: "{slide_number}"
        slide.group: "{slide_group}"
        slide.next_group: "{slide_group_next}"
        slide.notes: "{slide_notes}"
        slide.next_notes: "{slide_notes_next}"
        slide.previous_text: "{slide_text_previous}"
        slide.text: "{slide_text_current}"
        slide.next_text: "{slide_text_next}"
        video.time: "{video_time}"
        video.remaining: "{video_countdown}"
        video.duration: "{video_duration}"
        audio.title: "{audio_title}"
        audio.time: "{audio_time}"
        audio.remaining: "{audio_countdown}"
        audio.duration: "{audio_duration}"
        audio.volume: "{audio_volume}"
        project.name: "{active_project_name}"
        timer.status: "{timer_status}"
        output.active_layers: "{active_layers}"
        output.active_styles: "{active_styles}"
        output.windows_active: { value: "{output_windows_active}", map: { "true": true, "false": false } }
        output.locked: { value: "{outputs_locked}", map: { "true": true, "false": false } }
        stage.layout: "{stage_output_layout}"
        song_usage.logging: { value: "{log_song_usage}", map: { "true": true, "false": false } }

quirks:
  - models: [all]
    severity: critical
    text: >
      delete_project deletes a project at once, with no confirmation and no undo through the API.

  - models: [all]
    severity: warning
    text: >
      set_plain_text, rearrange_groups, add_group, set_template, transpose_show_up and
      transpose_show_down change a saved show, and create_show, create_project, rename_project,
      add_to_project and remove_project_item change the library. They are saved as FreeShow saves
      any edit, and only FreeShow's own undo reverses them.

  - models: [all]
    severity: warning
    text: >
      The API is off until "WebSocket/REST API" is enabled in Settings > Connections, and the port
      can be changed there (REST 5506 by default; 5505 is the WebSocket and OSC port). The
      Companion module uses 5505 because it speaks Socket.IO; register this device with the REST
      port.

  - models: [all]
    severity: warning
    text: >
      With an API password (auth key) set in Connections, requests without it are answered 401, a
      terminal refusal here: set the token setting to the same key. The password exists from
      1.6.6-beta.4 (issue #3785); older versions accept every request, and a token sent to them is
      ignored.

  - models: [all]
    severity: warning
    text: >
      Success is taken as HTTP 204 for an action and 200 for a get_ query. The API page documents
      neither; 204 is what the API answered in issue #3700, and get_ replies carrying data is
      inferred from issue #1280. The get_ replies are returned as FreeShow sends them, since their
      shapes are not documented.

  - models: [all]
    severity: warning
    text: >
      Positions (index) are passed through as FreeShow numbers them, which the API page does not
      state; the Companion module offers them from 1. remove_project_item and rearrange_groups
      take 0 as well, as the page gives no lower bound for them.

  - models: [all]
    severity: warning
    text: >
      State is read from FreeShow's Socket.IO server on port 5505, the WebSocket/OSC port, not the
      REST port: the core asks for FreeShow's variables once a second and applies the answer, as
      FreeShow's own Companion module does. This exchange is not on the FreeShow API page; it is
      taken from that module. When the WebSocket port is changed from 5505 in FreeShow, the state is
      not read; commands still work. Variable values arrive as FreeShow formats them (times as
      00:00 text); a slide number or count that is not a number is not assigned. Per-timer (timer_<name>) and per-variable
      (variable_<name>) values in the answer are not kept, since their names are the user's.

  - models: [all]
    severity: info
    text: >
      start_scripture before 1.6.6-beta.1 showed the whole chapter on the first call into a chapter
      not yet loaded, and a single verse had to be written as a range (Psalms 23:3-3); the API
      still answered 204 (issue #3700).

  - models: [all]
    severity: info
    text: >
      Left out: set_show and edit_timer (their value is undocumented "any" or free-form),
      send_rest_command (makes FreeShow send an arbitrary HTTP request), the thumbnail queries
      (image data), change_draw_zoom, get_variable (documented without parameters), and the
      optional-field forms of start_camera, start_metronome, start_slide_timers, get_slide and the
      seek actions' "id".
