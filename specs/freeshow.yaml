spec: 1
id: freeshow
name: FreeShow (REST API)
vendor: ChurchApps (Live Church Solutions)
category: playback

# FreeShow's API (Settings > Connections, "WebSocket/REST API") takes every
# action as an HTTP POST to / on port 5506 with the JSON body
# {"action": ACTION_ID, ...data}; the same actions go over a Socket.IO
# websocket and OSC on port 5505. Actions answer 204 with no body; the get_
# actions answer with the data. State comes from the same Socket.IO server
# on 5505: once a second the core emits the "data" event asking for
# FreeShow's variables, as FreeShow's own Companion module does, and FreeShow
# answers with their values on a "data" event. FreeShow's source is GPL-3 and
# was not read.

source:
  - title: FreeShow API Documentation
    author: ChurchApps / Live Church Solutions (FreeShow, Kristoffer Vassbø)
    url: https://freeshow.app/api
    note: >
      Manufacturer document, retrieved 2026-10-02. Every action id with its JSON data, grouped as
      Project, Shows, Presentation, Clear, Media, Overlays, Visual, Stage, Audio, Timers, Functions,
      Other, Action, Edit and Get ("?" marks an optional value); the Examples section: enable the
      WebSocket/REST API in Settings > Connections; an optional password (auth key) makes requests
      without it answer 401; HTTP GET to port 5506 with ?action=&data=&auth=; REST "must be a POST"
      to port 5506 with an "Authorization: Bearer <key>" header and the body {action, ...data};
      Socket.IO on port 5505 (emit "data" with the JSON text); OSC to /freeshow/<ACTION_ID> with
      the JSON as argument.
  - title: FreeShow Docs, Bitfocus Companion and Connecting
    author: ChurchApps / Live Church Solutions
    url: https://freeshow.app/docs/companion
    note: >
      Manufacturer documents: the Connection settings and the default API port 5505 for Companion;
      remote and stage web interfaces on other ports (5510 and up), which are not this API.
  - title: "FreeShow issues #1280 (API Issues), #853 (API Endpoint Overview), #3700 (start_scripture) and #3785 (API authentication)"
    author: ChurchApps/FreeShow issue tracker (maintainer replies by vassbo)
    url: https://github.com/ChurchApps/FreeShow/issues/853
    note: >
      Issue discussions, not code. #853 and #1280: REST is a POST to the REST port with the body
      {action, ...data}, and get_shows answers over it. #3700: the API answers HTTP 204 to
      start_scripture (POST to 127.0.0.1:5506 with Content-Type application/json), and from 1.6.6-beta.1
      a single verse reference selects that verse. #3785: the WebSocket and OSC servers are on 5505
      and REST on 5506; the optional API token with "Authorization: Bearer" and 401 arrived in
      v1.6.6-beta.4.
  - title: companion-module-churchapps-freeshow (Bitfocus Companion module, MIT licence)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-churchapps-freeshow
    note: >
      Read for corroboration only (main.js, src/connect.js, src/actions.js, src/variables.js,
      companion/HELP.md). It connects over Socket.IO to port 5505 and sends the same action ids; its
      indexes start at 1, its transition types are none, blur, fade, crossfade, fly, scale and spin
      with easing "sine" by default, and its volume is 0-1. The module is maintained by FreeShow's
      author (companion/manifest.json, maintainer Kristoffer Vassbø, version 1.2.0, retrieved
      2026-10-04), so it is the vendor's own client: src/variables.js emits the "data" event with
      the JSON text {"isVariable": true, "keys": [...]} every second, naming each variable (show,
      layout, slide, video, audio, project, timer, output, stage and song-usage variables), and
      src/connect.js takes FreeShow's answer on the "data" event as an object {isVariable: true,
      values: {key: value}}, where values can also hold timer_<name> and variable_<name> keys. The
      telemetry here is that exchange; the FreeShow API page does not document it.

# REST on 5506 (the WebSocket/OSC port is 5505). With an API password set in
# Connections, the token setting holds it and is sent as Authorization:
# Bearer; empty sends none.
transport:
  type: http
  port: 5506
  scheme: http
  auth: bearer
  timeout_ms: 4000
  probe:
    method: POST
    path: /
    body: '{"action":"get_cleared"}'
    content_type: application/json

settings:
  token: { type: string, secret: true, default: "",
    label: API password,
    description: "The API password set in FreeShow's Settings > Connections, sent as a bearer token; leave empty when none is set." }
  socket_port: { type: int, min: 1, max: 65535, default: 5505,
    label: WebSocket port,
    description: "The port of FreeShow's WebSocket (Socket.IO) API, 5505 unless changed in Settings > Connections; state is read there." }

ports:
  - { port: 5506, protocol: http, role: control }
  - { port: 5505, protocol: ws, role: push, setting: socket_port, note: "FreeShow's Socket.IO server (Engine.IO 4), where its variables are read" }

models:
  - id: freeshow
    name: FreeShow 1.x (WebSocket/REST API enabled)
    supports:
      [select_project, select_project_by_index, select_project_by_name, next_project_item,
      previous_project_item, select_project_item, select_show_by_name, start_show, change_layout,
      set_plain_text, rearrange_groups, add_group, set_template, transpose_show_up, transpose_show_down,
      next_slide, previous_slide, random_slide, select_slide, select_slide_in_layout, select_slide_by_name,
      select_group, start_slide_recording, restore_output, clear_all, clear_background, clear_slide,
      clear_overlays, clear_overlay, clear_audio, clear_next_timer, clear_drawing, start_camera,
      start_screen, play_media, toggle_playing_media, video_seek, start_effect, select_overlay_by_index,
      select_overlay_by_name, select_overlay, start_scripture, scripture_next, scripture_previous,
      toggle_output_lock, set_output_lock, toggle_output_windows, toggle_output, select_output_style,
      change_output_style, change_stage_output_layout, change_transition, select_stage_layout, play_audio,
      pause_audio, stop_audio, audio_seek, set_volume, start_audio_stream, start_playlist,
      start_playlist_by_name, playlist_next, start_metronome, start_audio_effect, start_timer_by_name,
      start_timer, start_slide_timers, pause_timers, stop_timers, timer_seek, pause_timer,
      pause_timer_by_name, stop_timer, stop_timer_by_name, set_variable, increment_variable,
      decrement_variable, start_trigger, sync_drive, sync_content_provider, emit_action,
      toggle_log_song_usage, set_log_song_usage, run_action_by_name, run_action, toggle_action,
      set_action_enabled, add_to_project, create_show, create_show_named, create_project, delete_project,
      remove_project_item, rename_project, get_shows, get_show, get_show_layout, get_projects, get_project,
      get_plain_text, get_groups, get_output, get_output_slide_text, get_output_group_name,
      get_dynamic_value, get_playing_video_duration, get_playing_video_time, get_playing_video_time_left,
      get_playing_audio_duration, get_playing_audio_time, get_playing_audio_time_left,
      get_playing_audio_data, get_variables, get_timers, get_playlists, get_playlist, get_slide, get_cleared]
    verification: none

commands:
  select_project:
    summary: "Select a project by its id (id_select_project)"
    params:
      id: { type: string, max_length: 256, required: true,
        label: Project ID,
        description: "The project's ID in FreeShow." }
    send:
      method: POST
      path: /
      body: '{"action":"id_select_project","id":{id:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  select_project_by_index:
    summary: "Select a project by its position in the project list (index_select_project)"
    params:
      index: { type: int, min: 1, max: 100000, required: true,
        label: Project position,
        description: "Position of the project in the project list, as FreeShow numbers it (the Companion module counts from 1)." }
    send:
      method: POST
      path: /
      body: '{"action":"index_select_project","index":{index}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  select_project_by_name:
    summary: "Select a project by its name (name_select_project)"
    params:
      name: { type: string, max_length: 256, required: true,
        label: Project name,
        description: "The project's name as shown in FreeShow." }
    send:
      method: POST
      path: /
      body: '{"action":"name_select_project","value":{name:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  next_project_item:
    summary: "Go to the next item in the active project (next_project_item)"
    send:
      method: POST
      path: /
      body: '{"action":"next_project_item"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  previous_project_item:
    summary: "Go to the previous item in the active project (previous_project_item)"
    send:
      method: POST
      path: /
      body: '{"action":"previous_project_item"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  select_project_item:
    summary: "Select an item of the active project by its position (index_select_project_item)"
    params:
      index: { type: int, min: 1, max: 100000, required: true,
        label: Item position,
        description: "Position of the item in the active project, as FreeShow numbers it (the Companion module counts from 1)." }
    send:
      method: POST
      path: /
      body: '{"action":"index_select_project_item","index":{index}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  select_show_by_name:
    summary: "Select a show by its name (name_select_show)"
    params:
      name: { type: string, max_length: 256, required: true,
        label: Show name,
        description: "The show's name as shown in FreeShow." }
    send:
      method: POST
      path: /
      body: '{"action":"name_select_show","value":{name:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  start_show:
    summary: "Start a show by its id, showing its first slide (start_show)"
    params:
      id: { type: string, max_length: 256, required: true,
        label: Show ID,
        description: "The show's ID in FreeShow." }
    send:
      method: POST
      path: /
      body: '{"action":"start_show","id":{id:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  change_layout:
    summary: "Change a show's active layout (change_layout)"
    params:
      show:   { type: string, max_length: 256, required: true,
        label: Show ID,
        description: "The show's ID in FreeShow." }
      layout: { type: string, max_length: 256, required: true,
        label: Layout ID,
        description: "The ID of the layout within the show." }
    send:
      method: POST
      path: /
      body: '{"action":"change_layout","showId":{show:json},"layoutId":{layout:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  set_plain_text:
    summary: "Replace a show's text with plain text (the show editor's plain-text form); text is a JSON string, so it can hold the line breaks between lines and slides (set_plain_text)"
    params:
      id:   { type: string, max_length: 256, required: true,
        label: Show ID,
        description: "The ID of the show whose text is replaced." }
      text: { type: json, required: true,
        label: Text,
        description: "The show's text as a JSON string; line breaks separate lines and a blank line separates slides." }
    send:
      method: POST
      path: /
      body: '{"action":"set_plain_text","id":{id:json},"value":{text}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  rearrange_groups:
    summary: "Move a group in a show's layout from one position to another (rearrange_groups)"
    params:
      show: { type: string, max_length: 256, required: true,
        label: Show ID,
        description: "The show's ID in FreeShow." }
      from: { type: int, min: 0, max: 100000, required: true,
        label: From position,
        description: "Current position of the group in the layout, as FreeShow numbers it." }
      to:   { type: int, min: 0, max: 100000, required: true,
        label: To position,
        description: "New position of the group in the layout, as FreeShow numbers it." }
    send:
      method: POST
      path: /
      body: '{"action":"rearrange_groups","showId":{show:json},"from":{from},"to":{to}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  add_group:
    summary: "Add a group (by its id) to a show's layout (add_group)"
    params:
      show:  { type: string, max_length: 256, required: true,
        label: Show ID,
        description: "The show's ID in FreeShow." }
      group: { type: string, max_length: 256, required: true,
        label: Group ID,
        description: "The ID of the slide group to add." }
    send:
      method: POST
      path: /
      body: '{"action":"add_group","showId":{show:json},"groupId":{group:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  set_template:
    summary: "Apply a template, by its id, to the active show (set_template)"
    params:
      id: { type: string, max_length: 256, required: true,
        label: Template ID,
        description: "The template's ID in FreeShow." }
    send:
      method: POST
      path: /
      body: '{"action":"set_template","id":{id:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  transpose_show_up:
    summary: "Transpose a show's chords up a semitone (transpose_show_up)"
    params:
      id: { type: string, max_length: 256, required: true,
        label: Show ID,
        description: "The ID of the show to transpose." }
    send:
      method: POST
      path: /
      body: '{"action":"transpose_show_up","id":{id:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  transpose_show_down:
    summary: "Transpose a show's chords down a semitone (transpose_show_down)"
    params:
      id: { type: string, max_length: 256, required: true,
        label: Show ID,
        description: "The ID of the show to transpose." }
    send:
      method: POST
      path: /
      body: '{"action":"transpose_show_down","id":{id:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  next_slide:
    summary: "Go to the next slide (next_slide)"
    send:
      method: POST
      path: /
      body: '{"action":"next_slide"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  previous_slide:
    summary: "Go to the previous slide (previous_slide)"
    send:
      method: POST
      path: /
      body: '{"action":"previous_slide"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  random_slide:
    summary: "Go to a random slide of the active show (random_slide)"
    send:
      method: POST
      path: /
      body: '{"action":"random_slide"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  select_slide:
    summary: "Go to a slide of the active show by its position (index_select_slide)"
    params:
      index: { type: int, min: 1, max: 100000, required: true,
        label: Slide position,
        description: "Position of the slide in the active show, as FreeShow numbers it (the Companion module counts from 1)." }
    send:
      method: POST
      path: /
      body: '{"action":"index_select_slide","index":{index}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  select_slide_in_layout:
    summary: "Go to a slide by its position in a given show and layout (index_select_slide)"
    params:
      show:   { type: string, max_length: 256, required: true,
        label: Show ID,
        description: "The show's ID in FreeShow." }
      layout: { type: string, max_length: 256, required: true,
        label: Layout ID,
        description: "The ID of the layout within the show." }
      index:  { type: int, min: 1, max: 100000, required: true,
        label: Slide position,
        description: "Position of the slide in the show's layout, as FreeShow numbers it (the Companion module counts from 1)." }
    send:
      method: POST
      path: /
      body: '{"action":"index_select_slide","showId":{show:json},"layoutId":{layout:json},"index":{index}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  select_slide_by_name:
    summary: "Go to a slide of the active show by its group name (name_select_slide)"
    params:
      name: { type: string, max_length: 256, required: true,
        label: Group name,
        description: "The slide group's name, such as Verse 1, in the active show." }
    send:
      method: POST
      path: /
      body: '{"action":"name_select_slide","value":{name:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  select_group:
    summary: "Go to a slide group by its id (id_select_group)"
    params:
      id: { type: string, max_length: 256, required: true,
        label: Group ID,
        description: "The slide group's ID in FreeShow." }
    send:
      method: POST
      path: /
      body: '{"action":"id_select_group","id":{id:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  start_slide_recording:
    summary: "Start playing the active show's slide recording (start_slide_recording)"
    send:
      method: POST
      path: /
      body: '{"action":"start_slide_recording"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  restore_output:
    summary: "Restore the output cleared last (restore_output)"
    send:
      method: POST
      path: /
      body: '{"action":"restore_output"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  clear_all:
    summary: "Clear every output layer (clear_all)"
    send:
      method: POST
      path: /
      body: '{"action":"clear_all"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  clear_background:
    summary: "Clear the background (media) layer (clear_background)"
    send:
      method: POST
      path: /
      body: '{"action":"clear_background"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  clear_slide:
    summary: "Clear the slide layer (clear_slide)"
    send:
      method: POST
      path: /
      body: '{"action":"clear_slide"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  clear_overlays:
    summary: "Clear every overlay (clear_overlays)"
    send:
      method: POST
      path: /
      body: '{"action":"clear_overlays"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  clear_overlay:
    summary: "Clear one overlay by its id (clear_overlay)"
    params:
      id: { type: string, max_length: 256, required: true,
        label: Overlay ID,
        description: "The ID of the overlay to clear." }
    send:
      method: POST
      path: /
      body: '{"action":"clear_overlay","id":{id:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  clear_audio:
    summary: "Stop all audio (clear_audio)"
    send:
      method: POST
      path: /
      body: '{"action":"clear_audio"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  clear_next_timer:
    summary: "Clear the next-slide timer (clear_next_timer)"
    send:
      method: POST
      path: /
      body: '{"action":"clear_next_timer"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  clear_drawing:
    summary: "Clear the drawing on the output (clear_drawing)"
    send:
      method: POST
      path: /
      body: '{"action":"clear_drawing"}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  start_camera:
    summary: "Show a camera (video input) by its device id (start_camera)"
    params:
      id: { type: string, max_length: 256, required: true,
        label: Camera ID,
        description: "The camera's (video input's) device ID." }
    send:
      method: POST
      path: /
      body: '{"action":"start_camera","id":{id:json}}'
      content_type: application/json
    expect: { status: 204 }
    returns: ack

  start_screen:
    summary: "Show a screen or window capture by its id (start_screen)"
    params:
