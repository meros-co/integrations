      action: { type: enum, values: [muteVideo, unmuteVideo, muteAudio, unmuteAudio], required: true, label: Action, description: "muteVideo, unmuteVideo, muteAudio or unmuteAudio." }
      user: { type: int, min: 0, max: 4294967295, required: true, label: "Participant ID", description: "The participant's numeric user ID, from the participant list." }
    send: { method: GET, path: /api/v1/zoom/meetingaction, query: {"command": "{action}", "userid": "{user}"} }
    expect: { status: 200 }
