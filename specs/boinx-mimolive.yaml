    params:
      action: { type: enum, values: [requestRecordingPermission, enableUnmuteBySelf, disableUnmuteBySelf, muteAll, unmuteAll, lockMeeting, unlockMeeting, lowerAllHands, shareFitWindowMode, pauseShare, resumeShare, joinVoip, leaveVoip, allowParticipantsToChat, disallowParticipantsToChat, allowParticipantsToShare, disallowParticipantsToShare, allowParticipantsToStartVideo, disallowParticipantsToStartVideo, allowParticipantsToShareWhiteBoard, disallowParticipantsToShareWhiteBoard, enableAutoAllowLocalRecordingRequest, disableAutoAllowLocalRecordingRequest, allowParticipantsToRename, disallowParticipantsToRename, showParticipantProfilePictures, hideParticipantProfilePictures], required: true, label: Action, description: "The meeting action, such as muteAll, lockMeeting or lowerAllHands." }
