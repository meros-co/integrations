telemetry:
  # mimoLive pushes each change on its websocket; it closes a client that
  # sends nothing for 15 seconds, so the ping goes every 5.
  websocket:
    path: /api/v1/socket
    send: '{"event":"ping"}'
    every_ms: 5000
  # Everything, once on connecting and then every minute as a safety net:
  # the document list with each kind of object sideloaded, one kind per
  # request so a version that refuses one include still answers the others;
  # the devices, the accounts (6.19), the layer, source and output
  # destination type catalogs, the Zoom meeting's participants, and
  # mlController's status where it is installed.
  poll:
    send:
      - { method: GET, path: /api/v1/documents, query: { include: layers } }
      - { method: GET, path: /api/v1/documents, query: { include: sources } }
      - { method: GET, path: /api/v1/documents, query: { include: output-destinations } }
      - { method: GET, path: /api/v1/documents, query: { include: layer-sets } }
      - { method: GET, path: /api/v1/devices }
      - { method: GET, path: /api/v1/accounts }
      - { method: GET, path: /api/v1/layertypes }
      - { method: GET, path: /api/v1/sourcetypes }
      - { method: GET, path: /api/v1/outputdestinationtypes }
      - { method: GET, path: /api/v1/zoom/participants }
      - { endpoint: mlcontroller, method: GET, path: /api/status }
    every_ms: 60000
  updates:
    # A list reply: each object in data.
    - path: "^/api/v1/"
      json_each: "$.data"
      json: &object
        type: "$.type"
        id: "$.id"
        name: "$.attributes.name"
        live: "$.attributes.live-state"
        duration: "$.attributes.duration"
        show_start: "$.attributes.show-start"
        program_volume: "$.attributes.programOutputMasterVolume"
        title: "$.attributes.metadata.title"
        width: "$.attributes.metadata.width"
        height: "$.attributes.metadata.height"
        framerate: "$.attributes.metadata.framerate"
        stack_index: "$.attributes.index"
        volume: "$.attributes.volume"
        composition: "$.attributes.composition-id"
        tally: "$.attributes.tally-state"
        gain: "$.attributes.gain"
        video: "$.attributes.video"
        audio: "$.attributes.audio"
        video_connected: "$.attributes.video-device-connected"
        audio_connected: "$.attributes.audio-device-connected"
        summary: "$.attributes.summary"
        source_type: "$.attributes.source-type"
        output_title: "$.attributes.title"
        kind: "$.attributes.type"
        ready: "$.attributes.ready-to-go-live"
        starts: "$.attributes.starts-with-show"
        stops: "$.attributes.stops-with-show"
        active: "$.attributes.active"
        recall_start: "$.attributes.recall-on-show-start"
        recall_end: "$.attributes.recall-on-show-end"
        document: "$.relationships.document.data.id"
        active_variant: "$.relationships.active-variant.data.id"
        live_variant: "$.relationships.live-variant.data.id"
        layer: "$.relationships.layer.data.id"
        samplerate: "$.attributes.metadata.samplerate"
        author: "$.attributes.metadata.author"
        comments: "$.attributes.metadata.comments"
        show: "$.attributes.metadata.show"
        planned: "$.attributes.metadata.duration"
        inputs: "$.attributes.input-values"
        input_descriptions: "$.attributes.input-descriptions"
        outputs: "$.attributes.output-values"
        hidden: "$.attributes.is-hidden"
        static: "$.attributes.is-static"
        filepath: "$.attributes.filepath"
        zoom_user: "$.attributes.zoom-userid"
        zoom_name: "$.attributes.zoom-username"
        zoom_selection: "$.attributes.zoom-userselectiontype"
        zoom_resolution: "$.attributes.zoom-videoresolution"
        codec: "$.attributes.video-codec"
        hq_audio: "$.attributes.prefers-high-quality-audio"
        sees: "$.attributes.partner-sees.type"
        sees_source: "$.attributes.partner-sees.source-id"
        sees_layer: "$.attributes.partner-sees.layer-index"
        hears: "$.attributes.partner-hears.type"
        hears_mix: "$.attributes.partner-hears.mix-name"
        hears_source: "$.attributes.partner-hears.source-id"
        actions: "$.attributes.available-actions"
        output_type: "$.attributes.output-destination-type"
        location: "$.attributes.settings.location"
        filename: "$.attributes.settings.filename"
        rtmp: "$.attributes.settings.rtmpurl"
        public_url: "$.attributes.settings.publicurl"
        connected: "$.attributes.connected"
        device_type: "$.attributes.device-type"
        channels: "$.attributes.input-channels"
        account_type: "$.attributes.account-type"
        identifier: "$.attributes.identifier"
        email: "$.attributes.email"
        source: "$.relationships.source.data.id"
      state: &assign
        "{type}.{id}.name": "{name}"
        "{type}.{id}.live_state": "{live}"
        "{type}.{id}.duration": "{duration}"
        "{type}.{id}.show_start": "{show_start}"
        "{type}.{id}.program_volume": "{program_volume}"
        "{type}.{id}.show_title": "{title}"
        "{type}.{id}.width": "{width}"
        "{type}.{id}.height": "{height}"
        "{type}.{id}.framerate": "{framerate}"
        "{type}.{id}.index": "{stack_index}"
        "{type}.{id}.volume": "{volume}"
        "{type}.{id}.composition_id": "{composition}"
        "{type}.{id}.tally_state": "{tally}"
        "{type}.{id}.gain": "{gain}"
        "{type}.{id}.video": "{video}"
        "{type}.{id}.audio": "{audio}"
        "{type}.{id}.video_connected": "{video_connected}"
        "{type}.{id}.audio_connected": "{audio_connected}"
        "{type}.{id}.summary": "{summary}"
        "{type}.{id}.source_type": "{source_type}"
        "{type}.{id}.title": "{output_title}"
        "{type}.{id}.kind": "{kind}"
        "{type}.{id}.ready": "{ready}"
        "{type}.{id}.starts_with_show": "{starts}"
        "{type}.{id}.stops_with_show": "{stops}"
        "{type}.{id}.active": "{active}"
        "{type}.{id}.recall_on_show_start": "{recall_start}"
        "{type}.{id}.recall_on_show_end": "{recall_end}"
        "{type}.{id}.document": "{document}"
        "{type}.{id}.active_variant": "{active_variant}"
        "{type}.{id}.live_variant": "{live_variant}"
        "{type}.{id}.layer": "{layer}"
        "{type}.{id}.samplerate": "{samplerate}"
        "{type}.{id}.show_author": "{author}"
        "{type}.{id}.show_comments": "{comments}"
        "{type}.{id}.show_name": "{show}"
        "{type}.{id}.planned_duration": "{planned}"
        "{type}.{id}.input_values": "{inputs}"
        "{type}.{id}.input_descriptions": "{input_descriptions}"
        "{type}.{id}.output_values": "{outputs}"
        "{type}.{id}.hidden": "{hidden}"
        "{type}.{id}.static": "{static}"
        "{type}.{id}.filepath": "{filepath}"
        "{type}.{id}.zoom_user_id": "{zoom_user}"
        "{type}.{id}.zoom_user_name": "{zoom_name}"
        "{type}.{id}.zoom_selection_type": "{zoom_selection}"
        "{type}.{id}.zoom_video_resolution": "{zoom_resolution}"
        "{type}.{id}.video_codec": "{codec}"
        "{type}.{id}.high_quality_audio": "{hq_audio}"
        "{type}.{id}.partner_sees": "{sees}"
        "{type}.{id}.partner_sees_source": "{sees_source}"
        "{type}.{id}.partner_sees_layer_index": "{sees_layer}"
        "{type}.{id}.partner_hears": "{hears}"
        "{type}.{id}.partner_hears_mix": "{hears_mix}"
        "{type}.{id}.partner_hears_source": "{hears_source}"
        "{type}.{id}.available_actions": "{actions}"
        "{type}.{id}.output_type": "{output_type}"
        "{type}.{id}.location": "{location}"
        "{type}.{id}.filename": "{filename}"
        "{type}.{id}.rtmp_url": "{rtmp}"
        "{type}.{id}.public_url": "{public_url}"
        "{type}.{id}.connected": "{connected}"
        "{type}.{id}.device_type": "{device_type}"
        "{type}.{id}.input_channels": "{channels}"
        "{type}.{id}.account_type": "{account_type}"
        "{type}.{id}.identifier": "{identifier}"
        "{type}.{id}.email": "{email}"
        "{type}.{id}.source": "{source}"

    # The objects sideloaded in included (the poll's layers, sources, output
    # destinations and layer sets).
    - path: "^/api/v1/"
      json_each: "$.included"
      json: *object
      state: *assign

    # A reply with one object in data: a GET of one object, and the updated
    # object setLive, setOff, PUT and PATCH answer with.
    - path: "^/api/v1/"
      json: &single
        type: "$.data.type"
        id: "$.data.id"
        name: "$.data.attributes.name"
        live: "$.data.attributes.live-state"
        duration: "$.data.attributes.duration"
        show_start: "$.data.attributes.show-start"
        program_volume: "$.data.attributes.programOutputMasterVolume"
        title: "$.data.attributes.metadata.title"
        width: "$.data.attributes.metadata.width"
        height: "$.data.attributes.metadata.height"
        framerate: "$.data.attributes.metadata.framerate"
        stack_index: "$.data.attributes.index"
        volume: "$.data.attributes.volume"
        composition: "$.data.attributes.composition-id"
        tally: "$.data.attributes.tally-state"
        gain: "$.data.attributes.gain"
        video: "$.data.attributes.video"
        audio: "$.data.attributes.audio"
        video_connected: "$.data.attributes.video-device-connected"
        audio_connected: "$.data.attributes.audio-device-connected"
        summary: "$.data.attributes.summary"
        source_type: "$.data.attributes.source-type"
        output_title: "$.data.attributes.title"
        kind: "$.data.attributes.type"
        ready: "$.data.attributes.ready-to-go-live"
        starts: "$.data.attributes.starts-with-show"
        stops: "$.data.attributes.stops-with-show"
        active: "$.data.attributes.active"
        recall_start: "$.data.attributes.recall-on-show-start"
        recall_end: "$.data.attributes.recall-on-show-end"
        document: "$.data.relationships.document.data.id"
        active_variant: "$.data.relationships.active-variant.data.id"
        live_variant: "$.data.relationships.live-variant.data.id"
        layer: "$.data.relationships.layer.data.id"
        samplerate: "$.data.attributes.metadata.samplerate"
        author: "$.data.attributes.metadata.author"
        comments: "$.data.attributes.metadata.comments"
        show: "$.data.attributes.metadata.show"
        planned: "$.data.attributes.metadata.duration"
        inputs: "$.data.attributes.input-values"
        input_descriptions: "$.data.attributes.input-descriptions"
        outputs: "$.data.attributes.output-values"
        hidden: "$.data.attributes.is-hidden"
        static: "$.data.attributes.is-static"
        filepath: "$.data.attributes.filepath"
        zoom_user: "$.data.attributes.zoom-userid"
        zoom_name: "$.data.attributes.zoom-username"
        zoom_selection: "$.data.attributes.zoom-userselectiontype"
        zoom_resolution: "$.data.attributes.zoom-videoresolution"
        codec: "$.data.attributes.video-codec"
        hq_audio: "$.data.attributes.prefers-high-quality-audio"
        sees: "$.data.attributes.partner-sees.type"
        sees_source: "$.data.attributes.partner-sees.source-id"
        sees_layer: "$.data.attributes.partner-sees.layer-index"
        hears: "$.data.attributes.partner-hears.type"
        hears_mix: "$.data.attributes.partner-hears.mix-name"
        hears_source: "$.data.attributes.partner-hears.source-id"
        actions: "$.data.attributes.available-actions"
        output_type: "$.data.attributes.output-destination-type"
        location: "$.data.attributes.settings.location"
        filename: "$.data.attributes.settings.filename"
        rtmp: "$.data.attributes.settings.rtmpurl"
        public_url: "$.data.attributes.settings.publicurl"
        connected: "$.data.attributes.connected"
        device_type: "$.data.attributes.device-type"
        channels: "$.data.attributes.input-channels"
        account_type: "$.data.attributes.account-type"
        identifier: "$.data.attributes.identifier"
        email: "$.data.attributes.email"
        source: "$.data.relationships.source.data.id"
      state: *assign

    # A layer set's layers, an array of {layer-id, action, variant}, kept by
    # position as layer-sets.<id>.layers.<index>. Only layer-sets objects, and
    # only when the object carries a layers attribute: an empty array clears
    # the list, an object without one (an answer that leaves it out) keeps it.
    # In a list reply (list_layer_sets) and sideloaded (the poll's included):
    - path: "^/api/v1/"
      json_each: "$.data"
      each_match: &has_layers { "$.type": "^layer-sets$", "$.attributes.layers": "^\\[" }
      json: { id: "$.id" }
      replace: "layer-sets.{id}.layers"
    - path: "^/api/v1/"
      json_each: "$.data[*].attributes.layers"
      each_match: &in_layer_set { "$^.type": "^layer-sets$" }
      json: &entry { id: "$^.id", layer_id: "$.layer-id", action: "$.action", variant: "$.variant" }
      state: &entry_state
        "layer-sets.{id}.layers.{index}.layer_id": "{layer_id}"
        "layer-sets.{id}.layers.{index}.action": &action { value: "{action}", map: { live: live, "off": "off", force-off: force-off } }
        "layer-sets.{id}.layers.{index}.variant": "{variant}"
    - path: "^/api/v1/"
      json_each: "$.included"
      each_match: *has_layers
      json: { id: "$.id" }
      replace: "layer-sets.{id}.layers"
    - path: "^/api/v1/"
      json_each: "$.included[*].attributes.layers"
      each_match: *in_layer_set
      json: *entry
      state: *entry_state
    # In a reply with one layer set in data: a GET of the set, and the PATCH
    # answer if it carries the object.
    - path: "^/api/v1/"
      json_match: { "$.data.type": "^layer-sets$", "$.data.id": "^([^.]+)$", "$.data.attributes.layers": "^\\[" }
      json_each: "$.data.attributes.layers"
      json: &one_entry { layer_id: "$.layer-id", action: "$.action", variant: "$.variant" }
      replace: "layer-sets.{1}.layers"
      state:
        "layer-sets.{1}.layers.{index}.layer_id": "{layer_id}"
        "layer-sets.{1}.layers.{index}.action": *action
        "layer-sets.{1}.layers.{index}.variant": "{variant}"
    # Any change to a layer set (its name, recall flags or layers), whatever
    # the PATCH answers: the set is read back, so state holds it as mimoLive
    # keeps it. Only a request with a body matches, never the GET it sends.
    - path: "^/api/v1/documents/([^/?]+)/layer-sets/([^/?]+)$"
      request_match: { "$.data.attributes": "^\\{" }
      json: {}
      then_send:
        - { method: GET, path: "/api/v1/documents/{1}/layer-sets/{2}" }

    # The device and account lists, whole: a device unplugged or an account
    # logged out leaves state. (A GET of one device goes to the rules above.)
    - path: "^/api/v1/devices(\\?.*)?$"
      json_each: "$.data"
      json: { id: "$.id", name: "$.attributes.name", connected: "$.attributes.connected",
              video: "$.attributes.video", audio: "$.attributes.audio", kind: "$.attributes.device-type",
              tally: "$.attributes.tally-state", channels: "$.attributes.input-channels" }
      replace: devices
      state:
        "devices.{id}.name": "{name}"
        "devices.{id}.connected": "{connected}"
        "devices.{id}.video": "{video}"
        "devices.{id}.audio": "{audio}"
        "devices.{id}.device_type": "{kind}"
        "devices.{id}.tally_state": "{tally}"
        "devices.{id}.input_channels": "{channels}"
    - path: "^/api/v1/accounts(\\?.*)?$"
      json_each: "$.data"
      json: { id: "$.id", name: "$.attributes.name", kind: "$.attributes.account-type",
              identifier: "$.attributes.identifier", email: "$.attributes.email" }
      replace: accounts
      state:
        "accounts.{id}.name": "{name}"
        "accounts.{id}.account_type": "{kind}"
        "accounts.{id}.identifier": "{identifier}"
        "accounts.{id}.email": "{email}"

    # The layer, source and output destination type catalogs, whole, each
    # type kept by its position in the list (its identifier, such as
    # com.boinx.mimoLive.sources.deviceVideoSource, holds dots, which a state
    # key cannot): a type no longer listed leaves state. A GET of one type
    # (/layertypes/(TypeID)) does not match and is returned to the caller.
    - path: "^/api/v1/layertypes(\\?.*)?$"
      json_each: "$.data"
      json: &type_entry { id: "$.id", name: "$.attributes.name", attributes: "$.attributes" }
      replace: types.layers
      state:
        "types.layers.{index}.id": "{id}"
        "types.layers.{index}.name": "{name}"
        "types.layers.{index}.attributes": "{attributes}"
    - path: "^/api/v1/sourcetypes(\\?.*)?$"
      json_each: "$.data"
      json: *type_entry
      replace: types.sources
      state:
        "types.sources.{index}.id": "{id}"
        "types.sources.{index}.name": "{name}"
        "types.sources.{index}.attributes": "{attributes}"
    - path: "^/api/v1/outputdestinationtypes(\\?.*)?$"
      json_each: "$.data"
      json: *type_entry
      replace: types.output-destinations
      state:
        "types.output-destinations.{index}.id": "{id}"
        "types.output-destinations.{index}.name": "{name}"
        "types.output-destinations.{index}.attributes": "{attributes}"

    # The Zoom meeting's participants, whole, by numeric user ID: none while
    # no meeting is joined. Read again after joining, leaving and each
    # meeting action.
    - path: "^/api/v1/zoom/participants"
      json: {}
      replace: zoom.participants
    - path: "^/api/v1/zoom/participants"
      json_each: "$.data"
      json: { user: "$.id", name: "$.name", role: "$.userRole", host: "$.isHost", co_host: "$.isCoHost",
              video: "$.isVideoOn", audio: "$.isAudioOn", talking: "$.isTalking", hand: "$.isRaisingHand" }
      state:
        "zoom.participants.{user}.name": "{name}"
        "zoom.participants.{user}.role": "{role}"
        "zoom.participants.{user}.host": "{host}"
        "zoom.participants.{user}.co_host": "{co_host}"
        "zoom.participants.{user}.video_on": "{video}"
        "zoom.participants.{user}.audio_on": "{audio}"
        "zoom.participants.{user}.talking": "{talking}"
        "zoom.participants.{user}.hand_raised": "{hand}"
    - path: "^/api/v1/zoom/(join|leave|end|meetingaction)"
      json: {}
      then_send:
        - { method: GET, path: /api/v1/zoom/participants }

    # mlController's status (port 8990).
    - path: "^/api/status$"
      json: { running: "$.running", app: "$.selectedMimoLive", app_path: "$.selectedMimoLivePath",
              apps: "$.availableMimoLiveApps", open: "$.openDocuments", local: "$.localDocuments" }
      state:
        mlcontroller.running: "{running}"
        mlcontroller.selected_app: "{app}"
        mlcontroller.selected_app_path: "{app_path}"
        mlcontroller.available_apps: "{apps}"
        mlcontroller.open_documents: "{open}"
        mlcontroller.local_documents: "{local}"

    # A document's built-in outputs, in the document object.
    - path: "^/api/v1/documents/([^/?]+)"
      json_each: "$.data.attributes.outputs"
      json: { output: "$.id", live: "$.live-state" }
      state: { "documents.{1}.outputs.{output}.live_state": "{live}" }

    # Pushed: an object added or changed, the whole object in data.
    - json_match: { "$.event": "^(added|changed)$" }
      json: *single
      state: *assign
    - json_match: { "$.event": "^(added|changed)$", "$.type": "^documents$", "$.id": "^(.+)$" }
      json_each: "$.data.attributes.outputs"
      json: { output: "$.id", live: "$.live-state" }
      state: { "documents.{2}.outputs.{output}.live_state": "{live}" }
    # Pushed: a layer set added or changed. Its layers are applied when the
    # object carries them, and the set is read again either way, since what
    # mimoLive pushes for layer sets is not documented.
    - json_match: { "$.event": "^(added|changed)$", "$.type": "^layer-sets$", "$.data.id": "^([^.]+)$", "$.data.attributes.layers": "^\\[" }
      json_each: "$.data.attributes.layers"
      json: *one_entry
      replace: "layer-sets.{2}.layers"
      state:
        "layer-sets.{2}.layers.{index}.layer_id": "{layer_id}"
        "layer-sets.{2}.layers.{index}.action": *action
        "layer-sets.{2}.layers.{index}.variant": "{variant}"
    - json_match: { "$.event": "^(added|changed)$", "$.type": "^layer-sets$", "$.data.id": "^([^./?#]+)$", "$.data.relationships.document.data.id": "^([^./?#]+)$" }
      json: {}
      then_send:
        - { method: GET, path: "/api/v1/documents/{3}/layer-sets/{2}" }
    # Pushed: an object removed. It leaves state, with everything under it.
    - json_match: { "$.event": "^removed$", "$.type": "^(documents|layers|variants|sources|filters|output-destinations|layer-sets)$", "$.id": "^([^.]+)$" }
      json: {}
      state: { "{1}.{2}": { delete: true } }

quirks:
  - models: [all]
    severity: critical
    text: >
      The HTTP API is off until "Allow Remote Control Access" is turned on in mimoLive's Remote
      Control preferences, and it serves the local network. Without a remote control password
      anyone who can reach port 8989 controls the show. With one, the token setting holds the API
      key the preference pane shows (the password's SHA-256 in hex), sent in the
      X-MimoLive-Password-SHA256 header; a wrong key answers 401, which stops the device until it
      is opened again with the right key. The older X-MimoLive-Password header, which sends the
      password itself, is not used.

  - models: [all]
    severity: critical
    text: >
      start_show, stop_show and toggle_show start or stop the show, and with it every output
      destination set to start or stop with the show: a recording or a live stream starts or ends,
      which cannot be undone on air. stop_show can leave the document in shutdown while it runs
      its end-of-show events.

  - models: [all]
    severity: critical
    text: >
      output_destination_live and start_output start recording, streaming or playout, and
      output_destination_off and stop_output stop it; a stopped recording or stream cannot be
      resumed into the same file or broadcast. setLive answers 409 when the destination is not
      configured or the licence does not allow it to go live, and setOff 409 when it may not stop.
      start_output and stop_output send only setLive and setOff, because the built-in output
      endpoint toggles on any other verb, so a mistyped verb could start a recording.

  - models: [all]
    severity: critical
    text: >
      recall_layer_set switches every layer in the set to the state the set records at once, on
      air. layer_live, layer_off, layer_toggle, variant_live, variant_off, variant_toggle,
      layer_live_first_variant and layer_live_last_variant change the program output immediately;
      layer_next_variant and layer_previous_variant only choose what goes live next. A layer set
      with recall on show start or end set (set_layer_set_recall_on_show_start and _end) is
      recalled by start_show and stop_show too.

  - models: [all]
    severity: critical
    text: >
      set_document_resolution, set_document_framerate and set_document_samplerate change the
      document's video and audio format, which every source, layer and output follows; a running
      recording or stream may not take the change cleanly. set_mimocall_partner_sees and
      set_mimocall_partner_hears change what a remote guest sees and hears at once.

  - models: [all]
    severity: critical
    text: >
      quit_mimolive and restart_mimolive end mimoLive through Boinx's mlController app, stopping
      the show and every recording and stream with it; open_document opens another document. They
      go to mlController's own API (port 8990, the mlcontroller_port setting), which answers only
      where mlController is installed and running on the mimoLive computer, and which is reached
      while mimoLive itself is not running (launch_mimolive). mimoLive's API key is never sent
      to it, and mlController's own optional password is not supported: with it set,
      mlController answers 401 to these commands and to the status poll, without stopping the
      device. Its status is read every minute with the rest; while it is not installed that read
      fails and is logged.

  - models: [all]
    severity: critical
    text: >
      delete_layer, delete_source, delete_output_destination, delete_layer_set and
      delete_datastore remove the object from the document with no undo through the API; a layer
      or source in use on air disappears from the output. mimoLive refuses to delete a required
      demo layer. zoom_end ends the Zoom meeting for every participant when mimoLive is host.

  - models: [all]
    severity: warning
    text: >
      Writes are sent with Content-Type application/vnd.api+json, as Boinx's API reference says
      they need; the user manual's curl examples send application/json. Layer, variant, source and
      document changes are sent as plain JSON objects holding only the changed fields, as the
      manual shows for layers, variants and sources; output destination and layer set changes in
      the JSON:API form {"data": {"attributes": {...}}}, as the manual shows for them. The shape
      for the document's programOutputMasterVolume is not shown in either document and follows
      the layer form; the show metadata is written the same way, as {"metadata": {...}} with only
      the changed fields, which the user manual names but does not show. mimoCall source changes
      (6.18) are sent as PATCH with a plain body, as the manual's example does.
      add_source_with_attributes and add_output_destination_with_attributes send the JSON object
      given as the whole body, since the manual (plain fields) and Boinx's reference
      (data.attributes) show different forms for both.

  - models: [all]
    severity: warning
    text: >
      add_layer and add_layer_at send the layer template as layer-identifier with name and index,
      as the user manual's example does. Boinx's API reference instead shows {"data":
      {"attributes": {"composition-id": ...}}}; the two documents disagree.

  - models: [all]
    severity: info
    text: >
      Input values written to a layer (set_layer_text, set_layer_number, set_layer_flag,
      set_layer_inputs) go to its live variant, or to its active variant while the layer is off,
      and some take effect only after another render cycle. Input keys are the layer's own
      (tvGroup_Content__Subtitle and the like), described with their types, labels and ranges in
      the layer's input-descriptions, which state keeps (layers.<id>.input_descriptions); signal
      IDs are the input-values keys ending in _TypeSignal.

  - models: [all]
    severity: info
    text: >
      State is kept current by the websocket mimoLive pushes added, changed and removed objects
      on, each carrying the whole object; the core sends {"event":"ping"} every 5 seconds, since
      mimoLive closes a quiet client after 15. The document list with each kind of object
      sideloaded is read on connecting and every minute. State is keyed by mimoLive's own type
      names and IDs (layers.<id>.live_state, output-destinations.<id>.live_state); a removed
      object leaves state with everything under it. A layer's live_variant is not cleared when the
      layer goes off, so its live_state is the one to read. Layer variants enter the state from
      websocket events and get_layer replies, not from the poll, which cannot sideload them. A
      layer set's entries are kept by position (layer-sets.<id>.layers.<index>.layer_id, action,
      variant), replaced whole whenever an answer or a push carries the set's layers attribute and
      left as they are when it does not; a pushed layer set and every layer set PATCH (name,
      recall flags or layers) have the set read again, since what mimoLive pushes for layer sets
      is not documented. Input values, input descriptions and output values of layers, variants,
      sources and filters are kept whole, as JSON text (layers.<id>.input_values,
      input_descriptions, output_values), since their keys are each layer type's own. Filters
      enter the state from list_filters, get_source and get_filter replies and from the websocket,
      not from the poll. The devices, the logged-in accounts, the Zoom meeting's participants and
      mlController's status are read every minute, each list replaced whole; the participants are
      read again after each Zoom command, and talking and hand_raised are only as current as that
      read. A device whose ID holds a dot is not kept in state.

  - models: [all]
    severity: info
    text: >
      The layer, source and output destination types (GET /layertypes, /sourcetypes and
      /outputdestinationtypes) are read on connecting and every minute, each list replaced whole,
      and kept by position (types.sources.<index>.id, name, and everything else the list reports
      as JSON text in attributes), because type identifiers such as
      com.boinx.mimoLive.sources.deviceVideoSource hold dots, which a state key cannot. The shape
      of these lists is not documented beyond each type's id; the JSON:API form the rest of the
      API answers with is assumed. A type's parameters and settings come from get_layer_type,
      get_source_type and get_output_destination_type, which return them to the caller and are not
      kept in state: a GET of one type cannot be matched to the type's position in the list, and
      its identifier cannot be a state key, so a layer type's inputs and their defaults are not in
      state until the core can key state by identifiers that hold dots. A layer already in the
      document reports its own (layers.<id>.input_descriptions and input_values).
      add_output_destination takes the ten type identifiers the manual lists;
      add_output_destination_with_attributes takes any other the type list gives.

  - models: [all]
    severity: info
    text: >
      Which video and audio device a camera or device source uses, and its channel map, can be
      written (set_source_video_device, set_source_video_device_id, set_source_audio_device,
      set_source_audio_device_id, set_source_channel_map, set_source_channel_map_by_name) but not
      read back: neither the manual's sources data type nor Boinx's reference lists
      video-device-id, video-device-name, audio-device-id, audio-device-name or channel-map among
      the attributes a source reports, so state does not hold them. A source reports only whether
      its video and audio hardware is connected (video_connected, audio_connected) and its
      summary, which for a camera source shows the device's name. An unknown device or channel
      name is ignored without an error.

  - models: [all]
    severity: info
    text: >
      Each document has two kinds of output: the four built-in outputs (record, stream, playout,
      fullscreen) in the document object, started with start_output, and the output destinations
      (output_destination_live), which carry the recording and streaming settings. The RTMP URL and
      stream key read back obfuscated; set_streaming_target writes them in full.

  - models: [all]
    severity: info
    text: >
      Zoom commands need mimoLive's Zoom integration: from mimoLive 6.19 zoom_join needs the name
      of a Zoom account logged in to mimoLive (list_accounts gives them) and answers 400 without
      one; every meeting action answers 409 when no meeting is joined, and meeting-wide actions
      need mimoLive to be host or co-host. There is no way to read the meeting-wide settings back.
