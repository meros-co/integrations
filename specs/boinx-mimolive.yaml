    params:
      path: { type: string, max_length: 4096, pattern: "^/.*\\.tvshow/?$", required: true, label: "Document path", description: "Full path of the .tvshow file on the mimoLive computer, as mlController's local documents list it." }
    send: { endpoint: mlcontroller, method: POST, path: /api/open, body: "{\"path\":{path:json}}", content_type: application/json }
    expect: { status: 200 }
