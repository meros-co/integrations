      action: { type: enum, values: [requestRecordingPermission, enableUnmuteBySelf, disableUnmuteBySelf, muteAll, unmuteAll, lockMeeting, unlockMeeting, lowerAllHands, shareFitWindowMode, pauseShare, resumeShare, joinVoip, leaveVoip, allowParticipantsToChat, disallowParticipantsToChat, allowParticipantsToShare, disallowParticipantsToShare, allowParticipantsToStartVideo, disallowParticipantsToStartVideo, allowParticipantsToShareWhiteBoard, disallowParticipantsToShareWhiteBoard, enableAutoAllowLocalRecordingRequest, disableAutoAllowLocalRecordingRequest, allowParticipantsToRename, disallowParticipantsToRename, showParticipantProfilePictures, hideParticipantProfilePictures], required: true, label: Action, description: "The meeting action, such as muteAll, lockMeeting or lowerAllHands." }
    send: { method: GET, path: /api/v1/zoom/meetingaction, query: {"command": "{action}"} }
    expect: { status: 200 }
    returns: ack

  zoom_participant_action:
    summary: "Mute or unmute one participant's audio or video (zoom/meetingaction with userid)"
    params:
      action: { type: enum, values: [muteVideo, unmuteVideo, muteAudio, unmuteAudio], required: true, label: Action, description: "muteVideo, unmuteVideo, muteAudio or unmuteAudio." }
      user: { type: int, min: 0, max: 4294967295, required: true, label: "Participant ID", description: "The participant's numeric user ID, from the participant list." }
    send: { method: GET, path: /api/v1/zoom/meetingaction, query: {"command": "{action}", "userid": "{user}"} }
    expect: { status: 200 }
    returns: ack

  zoom_assign_participant:
    summary: "Show one Zoom participant in a Zoom participant source (PATCH, zoom-userid)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      source: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Source ID", description: "The source's ID, which mimoLive writes as the document ID, a dash and a UUID." }
      user: { type: int, min: 0, max: 4294967295, required: true, label: "Participant ID", description: "The participant's numeric user ID, from the participant list." }
    send: { method: PATCH, path: "/api/v1/documents/{document}/sources/{source}", body: "{\"zoom-userid\":{user}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  zoom_unassign_source:
    summary: "Show nothing in a Zoom participant source (PATCH, zoom-userselectiontype 0)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      source: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Source ID", description: "The source's ID, which mimoLive writes as the document ID, a dash and a UUID." }
    send: { method: PATCH, path: "/api/v1/documents/{document}/sources/{source}", body: "{\"zoom-userselectiontype\":0}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  zoom_assign_active_speaker:
    summary: "Show the active speaker in a Zoom participant source (PATCH, zoom-userselectiontype 2)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      source: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Source ID", description: "The source's ID, which mimoLive writes as the document ID, a dash and a UUID." }
    send: { method: PATCH, path: "/api/v1/documents/{document}/sources/{source}", body: "{\"zoom-userselectiontype\":2}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  zoom_assign_screen_share:
    summary: "Show the screen share in a Zoom participant source (PATCH, zoom-userselectiontype 6)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      source: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Source ID", description: "The source's ID, which mimoLive writes as the document ID, a dash and a UUID." }
    send: { method: PATCH, path: "/api/v1/documents/{document}/sources/{source}", body: "{\"zoom-userselectiontype\":6}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

# State is keyed by mimoLive's own JSON:API type names and IDs, so every
# reply and every websocket event updates it the same way whatever endpoint it
# came from: documents.<id>, layers.<id>, variants.<id>, sources.<id>,
# output-destinations.<id> and layer-sets.<id>.
state:
  documents.*.name: { type: string, description: "Document name, the .tvshow file's name" }
  documents.*.live_state: { type: string, description: "Show state: off (not running) or live (running)" }
  documents.*.duration: { type: int, unit: s, description: "While the show is live, how long it has been running" }
  documents.*.show_start: { type: int, description: "While the show is live, the timestamp at which it went live" }
  documents.*.program_volume: { type: float, description: "Program output master volume, 0.0 to 1.0" }
  documents.*.show_title: { type: string, description: "Show title from the show metadata" }
  documents.*.width: { type: int, unit: px, description: "Document video width" }
  documents.*.height: { type: int, unit: px, description: "Document video height" }
  documents.*.framerate: { type: float, unit: fps, description: "Document frame rate" }
  documents.*.removed: { type: bool, description: "True once mimoLive reports the document closed" }
  documents.*.outputs.*.live_state: { type: string, description: "A built-in output's state (record, stream, playout, fullscreen): off or live" }
  layers.*.name: { type: string, description: "Layer name as shown in the layer stack" }
  layers.*.live_state: { type: string, description: "off, live, preview, or shutdown while an outgoing transition runs" }
  layers.*.index: { type: int, description: "Position in the layer stack, 0 at the top" }
  layers.*.volume: { type: float, description: "Layer volume, 0.0 to 1.0, for a layer with a volume control" }
  layers.*.composition_id: { type: string, description: "The layer type's composition identifier" }
  layers.*.document: { type: string, description: "ID of the document the layer is in" }
  layers.*.active_variant: { type: string, description: "ID of the variant selected to go live" }
  layers.*.live_variant: { type: string, description: "ID of the variant on air, while the layer is live; not cleared when it goes off" }
  layers.*.removed: { type: bool, description: "True once mimoLive reports the layer removed" }
  variants.*.name: { type: string, description: "Variant name" }
  variants.*.live_state: { type: string, description: "live when its layer is live with this variant, otherwise off" }
  variants.*.layer: { type: string, description: "ID of the layer the variant belongs to" }
  variants.*.removed: { type: bool, description: "True once mimoLive reports the variant removed" }
  sources.*.name: { type: string, description: "Source name" }
  sources.*.tally_state: { type: string, description: "Highest use of the source: off, in-use, effect, preview or program" }
  sources.*.gain: { type: float, description: "Audio gain, 0.0 (silent), 1.0 (unchanged) to 2.0, for a source with audio" }
  sources.*.video: { type: bool, description: "Whether the source supplies video" }
  sources.*.audio: { type: bool, description: "Whether the source supplies audio" }
  sources.*.video_connected: { type: bool, description: "Whether the source's video hardware is connected (mimoLive 5.5 and later)" }
  sources.*.audio_connected: { type: bool, description: "Whether the source's audio hardware is connected (mimoLive 5.5 and later)" }
  sources.*.summary: { type: string, description: "Summary text as mimoLive shows it" }
  sources.*.source_type: { type: string, description: "Source type identifier" }
  sources.*.document: { type: string, description: "ID of the document the source is in" }
  sources.*.removed: { type: bool, description: "True once mimoLive reports the source removed" }
  output-destinations.*.title: { type: string, description: "Output destination name" }
  output-destinations.*.kind: { type: string, description: "Kind, as mimoLive names it: File Recording, Live Streaming, NDI®, Fullscreen and others" }
  output-destinations.*.live_state: { type: string, description: "off (not configured), preview (ready), startup, live (recording or streaming) or shutdown" }
  output-destinations.*.ready: { type: bool, description: "Whether it is configured well enough to go live" }
  output-destinations.*.starts_with_show: { type: bool, description: "Whether it starts when the show starts" }
  output-destinations.*.stops_with_show: { type: bool, description: "Whether it stops when the show stops" }
  output-destinations.*.summary: { type: string, description: "Summary of its most important settings" }
  output-destinations.*.document: { type: string, description: "ID of the document it belongs to" }
  output-destinations.*.removed: { type: bool, description: "True once mimoLive reports it removed" }
  layer-sets.*.name: { type: string, description: "Layer set name" }
  layer-sets.*.active: { type: bool, description: "Whether the layer stack matches the layer set" }
  layer-sets.*.document: { type: string, description: "ID of the document it belongs to" }
  layer-sets.*.removed: { type: bool, description: "True once mimoLive reports it removed" }

telemetry:
  # mimoLive pushes each change on its websocket; it closes a client that
  # sends nothing for 15 seconds, so the ping goes every 5.
  websocket:
    path: /api/v1/socket
    send: '{"event":"ping"}'
    every_ms: 5000
  # Everything, once on connecting and then every minute as a safety net:
  # the document list with each kind of object sideloaded, one kind per
  # request so a version that refuses one include still answers the others.
  poll:
    send:
      - { method: GET, path: /api/v1/documents, query: { include: layers } }
      - { method: GET, path: /api/v1/documents, query: { include: sources } }
      - { method: GET, path: /api/v1/documents, query: { include: output-destinations } }
      - { method: GET, path: /api/v1/documents, query: { include: layer-sets } }
    every_ms: 60000
  updates:
    # A list reply: each object in data.
    - path: "^/api/v1/"
      json_each: "$.data"
      json: &object
        type: "$.type"
        id: "$.id"
        name: "$.attributes.name"
        live: "$.attributes.live-state"
        duration: "$.attributes.duration"
        show_start: "$.attributes.show-start"
        program_volume: "$.attributes.programOutputMasterVolume"
        title: "$.attributes.metadata.title"
        width: "$.attributes.metadata.width"
        height: "$.attributes.metadata.height"
        framerate: "$.attributes.metadata.framerate"
        index: "$.attributes.index"
        volume: "$.attributes.volume"
        composition: "$.attributes.composition-id"
        tally: "$.attributes.tally-state"
        gain: "$.attributes.gain"
        video: "$.attributes.video"
        audio: "$.attributes.audio"
        video_connected: "$.attributes.video-device-connected"
        audio_connected: "$.attributes.audio-device-connected"
        summary: "$.attributes.summary"
        source_type: "$.attributes.source-type"
        output_title: "$.attributes.title"
        kind: "$.attributes.type"
        ready: "$.attributes.ready-to-go-live"
        starts: "$.attributes.starts-with-show"
        stops: "$.attributes.stops-with-show"
        active: "$.attributes.active"
        document: "$.relationships.document.data.id"
        active_variant: "$.relationships.active-variant.data.id"
        live_variant: "$.relationships.live-variant.data.id"
        layer: "$.relationships.layer.data.id"
      state: &assign
        "{type}.{id}.name": "{name}"
        "{type}.{id}.live_state": "{live}"
        "{type}.{id}.duration": "{duration}"
        "{type}.{id}.show_start": "{show_start}"
        "{type}.{id}.program_volume": "{program_volume}"
        "{type}.{id}.show_title": "{title}"
        "{type}.{id}.width": "{width}"
        "{type}.{id}.height": "{height}"
        "{type}.{id}.framerate": "{framerate}"
        "{type}.{id}.index": "{index}"
        "{type}.{id}.volume": "{volume}"
        "{type}.{id}.composition_id": "{composition}"
        "{type}.{id}.tally_state": "{tally}"
        "{type}.{id}.gain": "{gain}"
        "{type}.{id}.video": "{video}"
        "{type}.{id}.audio": "{audio}"
        "{type}.{id}.video_connected": "{video_connected}"
        "{type}.{id}.audio_connected": "{audio_connected}"
        "{type}.{id}.summary": "{summary}"
        "{type}.{id}.source_type": "{source_type}"
        "{type}.{id}.title": "{output_title}"
        "{type}.{id}.kind": "{kind}"
        "{type}.{id}.ready": "{ready}"
        "{type}.{id}.starts_with_show": "{starts}"
        "{type}.{id}.stops_with_show": "{stops}"
        "{type}.{id}.active": "{active}"
        "{type}.{id}.document": "{document}"
        "{type}.{id}.active_variant": "{active_variant}"
        "{type}.{id}.live_variant": "{live_variant}"
        "{type}.{id}.layer": "{layer}"
        "{type}.{id}.removed": "false"

    # The objects sideloaded in included (the poll's layers, sources, output
    # destinations and layer sets).
    - path: "^/api/v1/"
      json_each: "$.included"
      json: *object
      state: *assign

    # A reply with one object in data: a GET of one object, and the updated
    # object setLive, setOff, PUT and PATCH answer with.
    - path: "^/api/v1/"
      json: &single
        type: "$.data.type"
        id: "$.data.id"
        name: "$.data.attributes.name"
        live: "$.data.attributes.live-state"
        duration: "$.data.attributes.duration"
        show_start: "$.data.attributes.show-start"
        program_volume: "$.data.attributes.programOutputMasterVolume"
        title: "$.data.attributes.metadata.title"
        width: "$.data.attributes.metadata.width"
        height: "$.data.attributes.metadata.height"
        framerate: "$.data.attributes.metadata.framerate"
        index: "$.data.attributes.index"
        volume: "$.data.attributes.volume"
        composition: "$.data.attributes.composition-id"
        tally: "$.data.attributes.tally-state"
        gain: "$.data.attributes.gain"
        video: "$.data.attributes.video"
        audio: "$.data.attributes.audio"
        video_connected: "$.data.attributes.video-device-connected"
        audio_connected: "$.data.attributes.audio-device-connected"
        summary: "$.data.attributes.summary"
        source_type: "$.data.attributes.source-type"
        output_title: "$.data.attributes.title"
        kind: "$.data.attributes.type"
        ready: "$.data.attributes.ready-to-go-live"
        starts: "$.data.attributes.starts-with-show"
        stops: "$.data.attributes.stops-with-show"
        active: "$.data.attributes.active"
        document: "$.data.relationships.document.data.id"
        active_variant: "$.data.relationships.active-variant.data.id"
        live_variant: "$.data.relationships.live-variant.data.id"
        layer: "$.data.relationships.layer.data.id"
      state: *assign

    # A document's built-in outputs, in the document object.
    - path: "^/api/v1/documents/([^/?]+)"
      json_each: "$.data.attributes.outputs"
      json: { output: "$.id", live: "$.live-state" }
      state: { "documents.{1}.outputs.{output}.live_state": "{live}" }

    # Pushed: an object added or changed, the whole object in data.
    - json_match: { "$.event": "^(added|changed)$" }
      json: *single
      state: *assign
    - json_match: { "$.event": "^(added|changed)$", "$.type": "^documents$", "$.id": "^(.+)$" }
      json_each: "$.data.attributes.outputs"
      json: { output: "$.id", live: "$.live-state" }
      state: { "documents.{2}.outputs.{output}.live_state": "{live}" }
    # Pushed: an object removed. Its last state stays, marked removed.
    - json_match: { "$.event": "^removed$", "$.type": "^(documents|layers|variants|sources|output-destinations|layer-sets)$", "$.id": "^(.+)$" }
      json: {}
      state: { "{1}.{2}.removed": "true" }

quirks:
  - models: [all]
    severity: critical
    text: >
      The HTTP API is off until "Allow Remote Control Access" is turned on in mimoLive's Remote
      Control preferences, and it serves the local network. Without a remote control password
      anyone who can reach port 8989 controls the show. With one, the token setting holds the API
      key the preference pane shows (the password's SHA-256 in hex), sent in the
      X-MimoLive-Password-SHA256 header; a wrong key answers 401, which stops the device until it
      is opened again with the right key. The older X-MimoLive-Password header, which sends the
      password itself, is not used.

  - models: [all]
    severity: critical
    text: >
      start_show, stop_show and toggle_show start or stop the show, and with it every output
      destination set to start or stop with the show: a recording or a live stream starts or ends,
      which cannot be undone on air. stop_show can leave the document in shutdown while it runs
      its end-of-show events.

  - models: [all]
    severity: critical
    text: >
      output_destination_live and start_output start recording, streaming or playout, and
      output_destination_off and stop_output stop it; a stopped recording or stream cannot be
      resumed into the same file or broadcast. setLive answers 409 when the destination is not
      configured or the licence does not allow it to go live, and setOff 409 when it may not stop.
      start_output and stop_output send only setLive and setOff, because the built-in output
      endpoint toggles on any other verb, so a mistyped verb could start a recording.

  - models: [all]
    severity: critical
    text: >
      recall_layer_set switches every layer in the set to the state the set records at once, on
      air. layer_live, layer_off, layer_toggle, variant_live, variant_off, variant_toggle,
      layer_live_first_variant and layer_live_last_variant change the program output immediately;
      layer_next_variant and layer_previous_variant only choose what goes live next.

  - models: [all]
    severity: critical
    text: >
      delete_layer, delete_source, delete_output_destination, delete_layer_set and
      delete_datastore remove the object from the document with no undo through the API; a layer
      or source in use on air disappears from the output. mimoLive refuses to delete a required
      demo layer. zoom_end ends the Zoom meeting for every participant when mimoLive is host.

  - models: [all]
    severity: warning
    text: >
      Writes are sent with Content-Type application/vnd.api+json, as Boinx's API reference says
      they need; the user manual's curl examples send application/json. Layer, variant, source and
      document changes are sent as plain JSON objects holding only the changed fields, as the
      manual shows for layers, variants and sources; output destination and layer set changes in
      the JSON:API form {"data": {"attributes": {...}}}, as the manual shows for them. The shape
      for the document's programOutputMasterVolume is not shown in either document and follows
      the layer form.

  - models: [all]
    severity: warning
    text: >
      add_layer and add_layer_at send the layer template as layer-identifier with name and index,
      as the user manual's example does. Boinx's API reference instead shows {"data":
      {"attributes": {"composition-id": ...}}}; the two documents disagree.

  - models: [all]
    severity: info
    text: >
      Input values written to a layer (set_layer_text, set_layer_number, set_layer_flag,
      set_layer_inputs) go to its live variant, or to its active variant while the layer is off,
      and some take effect only after another render cycle. Input keys are the layer's own
      (tvGroup_Content__Subtitle and the like), listed with their types and ranges in the layer's
      input-descriptions; signal IDs are the input-values keys ending in _TypeSignal.

  - models: [all]
    severity: info
    text: >
      State is kept current by the websocket mimoLive pushes added, changed and removed objects
      on, each carrying the whole object; the core sends {"event":"ping"} every 5 seconds, since
      mimoLive closes a quiet client after 15. The document list with each kind of object
      sideloaded is read on connecting and every minute. State is keyed by mimoLive's own type
      names and IDs (layers.<id>.live_state, output-destinations.<id>.live_state); a removed
      object keeps its last state with removed true. A layer's live_variant is not cleared when
      the layer goes off, so its live_state is the one to read. Layer variants enter the state
      from websocket events and get_layer replies, not from the poll, which cannot sideload them.

  - models: [all]
    severity: info
    text: >
      Each document has two kinds of output: the four built-in outputs (record, stream, playout,
      fullscreen) in the document object, started with start_output, and the output destinations
      (output_destination_live), which carry the recording and streaming settings. The RTMP URL and
      stream key read back obfuscated; set_streaming_target writes them in full.

  - models: [all]
    severity: info
    text: >
      Zoom commands need mimoLive's Zoom integration: from mimoLive 6.19 zoom_join needs the name
      of a Zoom account logged in to mimoLive (list_accounts gives them) and answers 400 without
      one; every meeting action answers 409 when no meeting is joined, and meeting-wide actions
      need mimoLive to be host or co-host. There is no way to read the meeting-wide settings back.
