  select_mimolive_app:
    summary: "Choose which installed mimoLive version mlController launches (POST :8990/api/select)"
    params:
      path: { type: string, max_length: 4096, required: true, label: "Application path", description: "Path of the mimoLive application, as mlController's list of installed versions gives it, or empty for the system's default." }
    send: { endpoint: mlcontroller, method: POST, path: /api/select, body: "{\"path\":{path:json}}", content_type: application/json }
    expect: { status: 200 }
    returns: ack

# State is keyed by mimoLive's own JSON:API type names and IDs, so every
# reply and every websocket event updates it the same way whatever endpoint it
# came from: documents.<id>, layers.<id>, variants.<id>, sources.<id>,
# filters.<id>, output-destinations.<id>, layer-sets.<id>, devices.<id> and
# accounts.<id>; beside them the type catalogs types.layers.<index>,
# types.sources.<index> and types.output-destinations.<index> (by position, since
# type identifiers hold dots), zoom.participants.<user id> and mlController's
# mlcontroller.*.
state:
  documents.*.name: { type: string, description: "Document name, the .tvshow file's name" }
  documents.*.live_state: { type: string, description: "Show state: off (not running) or live (running)" }
  documents.*.duration: { type: int, unit: s, description: "While the show is live, how long it has been running" }
  documents.*.show_start: { type: int, description: "While the show is live, the timestamp at which it went live" }
  documents.*.program_volume: { type: float, description: "Program output master volume, 0.0 to 1.0" }
  documents.*.show_title: { type: string, description: "Show title from the show metadata" }
  documents.*.width: { type: int, unit: px, description: "Document video width" }
  documents.*.height: { type: int, unit: px, description: "Document video height" }
  documents.*.framerate: { type: float, unit: fps, description: "Document frame rate" }
  documents.*.samplerate: { type: int, unit: Hz, description: "Document audio sample rate" }
  documents.*.show_author: { type: string, description: "Author from the show metadata" }
  documents.*.show_comments: { type: string, description: "Comments from the show metadata" }
  documents.*.show_name: { type: string, description: "Generic show name from the show metadata, the %show file name placeholder" }
  documents.*.planned_duration: { type: int, unit: s, description: "Proposed show length from the show metadata, the show timer's length" }
  documents.*.outputs.*.live_state: { type: string, description: "A built-in output's state (record, stream, playout, fullscreen): off or live" }
  layers.*.name: { type: string, description: "Layer name as shown in the layer stack" }
  layers.*.live_state: { type: string, description: "off, live, preview, or shutdown while an outgoing transition runs" }
  layers.*.index: { type: int, description: "Position in the layer stack, 0 at the top" }
  layers.*.volume: { type: float, description: "Layer volume, 0.0 to 1.0, for a layer with a volume control" }
  layers.*.composition_id: { type: string, description: "The layer type's composition identifier" }
  layers.*.document: { type: string, description: "ID of the document the layer is in" }
  layers.*.active_variant: { type: string, description: "ID of the variant selected to go live" }
  layers.*.live_variant: { type: string, description: "ID of the variant on air, while the layer is live; not cleared when it goes off" }
  layers.*.input_values: { type: string, description: "The layer's input values (of its live, or else active, variant) as JSON text: an object of input keys and values" }
  layers.*.input_descriptions: { type: string, description: "Descriptions of the layer's inputs (of its live, or else active, variant) as JSON text: an object keyed by input key, each with type (string, number, index, bool, color, image or structure), label, hidden, index and, where they apply, value-min, value-max, value-step, value-unit and value-list" }
  layers.*.output_values: { type: string, description: "The layer's output values from its last render cycle as JSON text, such as tvOut_SettingName" }
  variants.*.name: { type: string, description: "Variant name" }
  variants.*.live_state: { type: string, description: "live when its layer is live with this variant, otherwise off" }
  variants.*.layer: { type: string, description: "ID of the layer the variant belongs to" }
  variants.*.input_values: { type: string, description: "The variant's input values as JSON text: an object of input keys and values" }
  variants.*.input_descriptions: { type: string, description: "Descriptions of the variant's inputs as JSON text: an object keyed by input key, each with type (string, number, index, bool, color, image or structure), label, hidden, index and, where they apply, value-min, value-max, value-step, value-unit and value-list" }
  variants.*.output_values: { type: string, description: "The variant's output values from its last render cycle as JSON text" }
  sources.*.name: { type: string, description: "Source name" }
  sources.*.tally_state: { type: string, description: "Highest use of the source: off, in-use, effect, preview or program" }
  sources.*.gain: { type: float, description: "Audio gain, 0.0 (silent), 1.0 (unchanged) to 2.0, for a source with audio" }
  sources.*.video: { type: bool, description: "Whether the source supplies video" }
  sources.*.audio: { type: bool, description: "Whether the source supplies audio" }
  sources.*.video_connected: { type: bool, description: "Whether the source's video hardware is connected (mimoLive 5.5 and later)" }
