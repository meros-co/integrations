      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      source: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Source ID", description: "The source's ID, which mimoLive writes as the document ID, a dash and a UUID." }
    send: { method: PATCH, path: "/api/v1/documents/{document}/sources/{source}", body: "{\"zoom-userselectiontype\":2}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  zoom_assign_screen_share:
    summary: "Show the screen share in a Zoom participant source (PATCH, zoom-userselectiontype 6)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      source: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Source ID", description: "The source's ID, which mimoLive writes as the document ID, a dash and a UUID." }
    send: { method: PATCH, path: "/api/v1/documents/{document}/sources/{source}", body: "{\"zoom-userselectiontype\":6}", content_type: application/vnd.api+json }
