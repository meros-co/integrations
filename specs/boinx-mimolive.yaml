spec: 1
id: boinx-mimolive
name: Boinx mimoLive (HTTP API)
vendor: Boinx Software
category: switcher

# mimoLive's HTTP API (JSON:API) on port 8989, under /api/v1, when it is
# enabled in mimoLive's Remote Control preferences. Commands are HTTP
# requests; mimoLive pushes every added, changed and removed document, layer,
# variant, source, output destination and layer set on its websocket
# (/api/v1/socket), which keeps the state current. A slow poll of the
# document list, with each kind of object sideloaded, fills the state on
# connecting and catches anything missed while the websocket was reopening.
# Every object is addressed by the IDs mimoLive gives it, which it stores in
# the document, so they stay valid for as long as the document is used.

source:
  - title: mimoLive User Manual, Remote Control & Automation > HTTP API (overview)
    author: Boinx Software
    url: https://mimolive.com/user-manual/remote-control-automation/http-api/
    note: >
      Manufacturer document, last updated 2024-10-08, retrieved 2026-10-04. The server on port
      8989 when enabled, the /api/v1 prefix, JSON:API, IDs persisted in the document; from 3.1 the
      password as its SHA-256 in hex, in the X-MimoLive-Password-SHA256 header or the pwSHA256
      query parameter, shown and copyable in the Remote Controls preference pane; the error
      object {"errors": [{status, title, description}]}.
  - title: mimoLive User Manual, HTTP API > Endpoints
    author: Boinx Software
    url: https://mimolive.com/user-manual/remote-control-automation/http-api/endpoints/
    note: >
      Manufacturer document, last updated 2026-08-19. Every endpoint here: documents and their
      setLive, setOff and toggleLive; creating, querying, modifying (name, volume from 5.6,
      input-values) and deleting layers; layer setLive, setOff, toggleLive, signals,
      cycleThroughVariants (5.6), cycleThroughVariantsBackwards, setLiveFirstVariant,
      setLiveLastVariant and input media control with its thirteen commands; variants and their
      actions; sources (gain clipped to 0-2, channel-map, video and audio device by id or name or
      none, mimoCall attributes from 6.18), source media control, signals and actions (6.18);
      filters; output destinations with their ten type identifiers, JSON:API PATCH of title,
      starts-with-show, stops-with-show and settings, setLive and setOff answering 409 when they
      cannot; layer sets (5.0) with create, PATCH, delete and recall; data stores; Zoom join (a
      Zoom account name required from 6.19, 400 without), leave, end, participants and the
      meeting action commands.
  - title: mimoLive User Manual, HTTP API > Data Types
    author: Boinx Software
    url: https://mimolive.com/user-manual/remote-control-automation/http-api/data-types/
    note: >
      Manufacturer document, last updated 2026-08-19. The documents, layers, variants, sources,
      filters, output-destinations and layer-sets objects, their attributes and relationships; the
      LiveState values off, live, preview, shutdown and startup, and the TallyState values off,
      in-use, effect, preview and program; recording settings and filename placeholders.
  - title: mimoLive API Reference (mimoLive-API.md)
    author: Boinx Software
    url: https://github.com/boinx/mimoLive-API-Reference
    note: >
      Manufacturer document under the MIT licence, last pushed 2026-07-10. The websocket at
      /api/v1/socket with {"event": "ping"} every 5 seconds or a timeout at 15, and added, removed
      and changed events by resource type; the built-in outputs record, stream, playout and
      fullscreen started and stopped with documents/(DocumentID)/outputs/(OutputID)/setLive and
      setOff (any other verb toggles); programOutputMasterVolume; Content-Type
      application/vnd.api+json for writes; POST answering 201 and DELETE 204; the type catalogs
      (/layertypes, /sourcetypes, /outputdestinationtypes); /comments/new; /accounts (6.19);
      Zoom participant source assignment by zoom-userid and zoom-userselectiontype (0, 2, 6);
      the include query that sideloads a document's layers and sources.
  - title: mlController (Boinx's mimoLive controller app, MIT licence)
    author: Boinx Software
    url: https://github.com/boinx/mlController
    note: >
      Manufacturer code, read for corroboration only (Services/MimoLiveWebSocket.swift): the
      websocket URL, the ping message every 5 seconds against the 15-second timeout, and that
      pong and ping messages are not state.
  - title: companion-module-boinx-mimolive (Bitfocus Companion module, MIT licence)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-boinx-mimolive
    note: >
      Read for corroboration only (src/api.js, src/actions.js). Its websocket handler shows the
      event message shape: {event, type, id, data} where data is the whole object, with
      data.attributes and data.relationships (document, layer, active-variant) as the HTTP API
      returns them; it sets a layer's volume with a plain PUT body {"volume": x}.

# The API key (the password's SHA-256 in hex, which the Remote Controls
# preference pane shows and copies) goes in mimoLive's own header on every
# request and on the websocket's opening request; empty sends none.
transport:
  type: http
  port: 8989
  scheme: http
  auth: header
  auth_header: X-MimoLive-Password-SHA256
  timeout_ms: 5000
  probe: { method: GET, path: /api/v1/documents }

settings:
  token: { type: string, secret: true, max_length: 64, pattern: "^([0-9A-Fa-f]{64})?$",
    label: API key,
    description: "The API key from mimoLive's Remote Controls preferences, the SHA-256 of the remote control password in hex; leave empty when no password is set." }

ports:
  - { port: 8989, protocol: http, role: control }
  - { port: 8989, protocol: ws, role: push }

models:
  - id: mimolive
    name: mimoLive 6 (HTTP API enabled)
    supports: [list_documents, get_document, start_show, stop_show, toggle_show, set_program_volume,
               start_output, stop_output, list_layers, get_layer, layer_live, layer_off, layer_toggle,
               layer_next_variant, layer_previous_variant, layer_live_first_variant,
               layer_live_last_variant, set_layer_volume, set_layer_name, set_layer_text,
               set_layer_number, set_layer_flag, set_layer_inputs, trigger_layer_signal,
               layer_media_control, add_layer, add_layer_at, delete_layer, list_variants, get_variant,
               variant_live, variant_off, variant_toggle, set_variant_name, set_variant_text,
               set_variant_inputs, trigger_variant_signal, list_sources, get_source, set_source_gain,
               set_source_name, set_source_inputs, set_source_video_device, set_source_audio_device,
               set_source_channel_map, source_media_control, trigger_source_signal, source_action,
               add_source, delete_source, list_filters, set_filter_inputs, trigger_filter_signal,
               list_output_destinations, get_output_destination, output_destination_live,
               output_destination_off, set_output_destination_title,
               set_output_destination_starts_with_show, set_output_destination_stops_with_show,
               set_recording_location, set_recording_filename, set_streaming_target,
               add_output_destination, delete_output_destination, list_layer_sets, recall_layer_set,
               set_layer_set_name, set_layer_set_layers, add_layer_set, delete_layer_set,
               get_datastore, put_datastore, delete_datastore, list_devices, get_device, list_accounts,
               list_layer_types, list_source_types, list_output_destination_types, inject_comment,
               zoom_join, zoom_join_with_passcode, zoom_leave, zoom_end, zoom_participants,
               zoom_meeting_action, zoom_participant_action, zoom_assign_participant,
               zoom_unassign_source, zoom_assign_active_speaker, zoom_assign_screen_share]
    verification: none

commands:
  # ── Documents and the show ────────────────────────────────────────────────
  list_documents:
    summary: "The open documents with their live state (GET /documents)"
    send: { method: GET, path: /api/v1/documents }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_document:
    summary: "One document, with its layers, sources and output destinations sideloaded (GET /documents/(DocumentID))"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
    send: { method: GET, path: "/api/v1/documents/{document}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  start_show:
    summary: "Start the show: the document goes live and triggers its start events, such as outputs set to start with the show (setLive)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
    send: { method: POST, path: "/api/v1/documents/{document}/setLive" }
    expect: { status: 200 }
    returns: ack

  stop_show:
    summary: "Stop the show, with the outputs set to stop with it (setOff)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
    send: { method: POST, path: "/api/v1/documents/{document}/setOff" }
    expect: { status: 200 }
    returns: ack

  toggle_show:
    summary: "Start the show if it is off, stop it if it is live (toggleLive)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
    send: { method: POST, path: "/api/v1/documents/{document}/toggleLive" }
    expect: { status: 200 }
    returns: ack

  set_program_volume:
    summary: "Set the program output master volume (PUT /documents/(DocumentID), programOutputMasterVolume)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      volume: { type: float, min: 0.0, max: 1.0, required: true, label: Volume, description: "Program output master volume from 0.0 (silent) to 1.0 (full)." }
    send: { method: PUT, path: "/api/v1/documents/{document}", body: "{\"programOutputMasterVolume\":{volume:.3f}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  start_output:
    summary: "Start one of the document's built-in outputs (outputs/(OutputID)/setLive)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      output: { type: enum, values: [record, stream, playout, fullscreen], required: true, label: Output, description: "The document's built-in output: record (file recording), stream, playout or fullscreen." }
    send: { method: POST, path: "/api/v1/documents/{document}/outputs/{output}/setLive" }
    expect: { status: 200 }
    returns: ack

  stop_output:
    summary: "Stop one of the document's built-in outputs (outputs/(OutputID)/setOff)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      output: { type: enum, values: [record, stream, playout, fullscreen], required: true, label: Output, description: "The document's built-in output: record (file recording), stream, playout or fullscreen." }
    send: { method: POST, path: "/api/v1/documents/{document}/outputs/{output}/setOff" }
    expect: { status: 200 }
    returns: ack

  # ── Layers ────────────────────────────────────────────────────────────────
  list_layers:
    summary: "The document's layers, top of the stack first (GET /documents/(DocumentID)/layers)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
    send: { method: GET, path: "/api/v1/documents/{document}/layers" }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_layer:
    summary: "One layer with its variants sideloaded (GET .../layers/(LayerID))"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
    send: { method: GET, path: "/api/v1/documents/{document}/layers/{layer}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  layer_live:
    summary: "Switch a layer live with its last selected variant (setLive)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
    send: { method: POST, path: "/api/v1/documents/{document}/layers/{layer}/setLive" }
    expect: { status: 200 }
    returns: ack

  layer_off:
    summary: "Switch a layer off, with its outgoing transition (setOff)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
    send: { method: POST, path: "/api/v1/documents/{document}/layers/{layer}/setOff" }
    expect: { status: 200 }
    returns: ack

  layer_toggle:
    summary: "Toggle a layer between live and off (toggleLive)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
    send: { method: POST, path: "/api/v1/documents/{document}/layers/{layer}/toggleLive" }
    expect: { status: 200 }
    returns: ack

  layer_next_variant:
    summary: "Select the next variant to go live next, without changing what is on air (cycleThroughVariants, mimoLive 5.6 and later)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
    send: { method: POST, path: "/api/v1/documents/{document}/layers/{layer}/cycleThroughVariants" }
    expect: { status: 200 }
    returns: ack

  layer_previous_variant:
    summary: "Select the previous variant to go live next, without changing what is on air (cycleThroughVariantsBackwards)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
    send: { method: POST, path: "/api/v1/documents/{document}/layers/{layer}/cycleThroughVariantsBackwards" }
    expect: { status: 200 }
    returns: ack

  layer_live_first_variant:
    summary: "Activate the layer's first variant and switch the layer live (setLiveFirstVariant)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
    send: { method: POST, path: "/api/v1/documents/{document}/layers/{layer}/setLiveFirstVariant" }
    expect: { status: 200 }
    returns: ack

  layer_live_last_variant:
    summary: "Activate the layer's last variant and switch the layer live (setLiveLastVariant)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
    send: { method: POST, path: "/api/v1/documents/{document}/layers/{layer}/setLiveLastVariant" }
    expect: { status: 200 }
    returns: ack

  set_layer_volume:
    summary: "Set a layer's volume (PUT .../layers/(LayerID), volume; mimoLive 5.6 and later)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
      volume: { type: float, min: 0.0, max: 1.0, required: true, label: Volume, description: "Layer volume from 0.0 (silent) to 1.0 (full); ignored by a layer with no volume control." }
    send: { method: PUT, path: "/api/v1/documents/{document}/layers/{layer}", body: "{\"volume\":{volume:.3f}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_layer_name:
    summary: "Rename a layer (PUT .../layers/(LayerID), name)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
      name: { type: string, max_length: 256, required: true, label: Name, description: "The new name, as mimoLive shows it." }
    send: { method: PUT, path: "/api/v1/documents/{document}/layers/{layer}", body: "{\"name\":{name:json}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_layer_text:
    summary: "Set one text input of a layer's live, or else active, variant (PUT .../layers/(LayerID), input-values)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
      input_key: { type: string, max_length: 256, pattern: "^[A-Za-z0-9_]+$", required: true, label: "Input key", description: "The key of the input in the object's input-values, such as tvGroup_Content__Subtitle." }
      text: { type: string, max_length: 4096, required: true, label: Text, description: "The text to put in the input." }
    send: { method: PUT, path: "/api/v1/documents/{document}/layers/{layer}", body: "{\"input-values\":{{input_key:json}:{text:json}}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_layer_number:
    summary: "Set one number input of a layer's live, or else active, variant (PUT .../layers/(LayerID), input-values)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
      input_key: { type: string, max_length: 256, pattern: "^[A-Za-z0-9_]+$", required: true, label: "Input key", description: "The key of the input in the object's input-values, such as tvGroup_Content__Subtitle." }
      value: { type: float, required: true, label: Value, description: "The number to put in the input, within the input's own value-min and value-max." }
    send: { method: PUT, path: "/api/v1/documents/{document}/layers/{layer}", body: "{\"input-values\":{{input_key:json}:{value:.4f}}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_layer_flag:
    summary: "Set one on/off input of a layer's live, or else active, variant (PUT .../layers/(LayerID), input-values)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
      input_key: { type: string, max_length: 256, pattern: "^[A-Za-z0-9_]+$", required: true, label: "Input key", description: "The key of the input in the object's input-values, such as tvGroup_Content__Subtitle." }
      value: { type: bool, required: true, label: Value, description: "On or off for the input." }
    send: { method: PUT, path: "/api/v1/documents/{document}/layers/{layer}", body: "{\"input-values\":{{input_key:json}:{value}}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_layer_inputs:
    summary: "Set several inputs of a layer's live, or else active, variant at once (PUT .../layers/(LayerID), input-values object)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
      values: { type: json, required: true, label: "Input values", description: "A JSON object of input keys and their new values, as the object's input-values reports them; keys left out are unchanged." }
    send: { method: PUT, path: "/api/v1/documents/{document}/layers/{layer}", body: "{\"input-values\":{values}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  trigger_layer_signal:
    summary: "Trigger a signal input (a button) on the layer's live, or else active, variant (signals/(SignalID))"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
      signal: { type: string, max_length: 256, pattern: "^[A-Za-z0-9_]+$", required: true, label: "Signal ID", description: "The signal input's key, one of the input-values keys ending in _TypeSignal." }
    send: { method: POST, path: "/api/v1/documents/{document}/layers/{layer}/signals/{signal}" }
    expect: { status: 200 }
    returns: ack

  layer_media_control:
    summary: "Send a media command to the media bound to one of a layer's inputs (inputs/(SourceInputKey)/mediacontrol/(Command))"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
