  zoom_assign_participant:
    summary: "Show one Zoom participant in a Zoom participant source (PATCH, zoom-userid)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      source: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Source ID", description: "The source's ID, which mimoLive writes as the document ID, a dash and a UUID." }
      user: { type: int, min: 0, max: 4294967295, required: true, label: "Participant ID", description: "The participant's numeric user ID, from the participant list." }
    send: { method: PATCH, path: "/api/v1/documents/{document}/sources/{source}", body: "{\"zoom-userid\":{user}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
