spec: 1
id: boinx-mimolive
name: Boinx mimoLive (HTTP API)
vendor: Boinx Software
category: switcher

# mimoLive's HTTP API (JSON:API) on port 8989, under /api/v1, when it is
# enabled in mimoLive's Remote Control preferences. Commands are HTTP
# requests; mimoLive pushes every added, changed and removed document, layer,
# variant, source, output destination and layer set on its websocket
# (/api/v1/socket), which keeps the state current. A slow poll of the
# document list, with each kind of object sideloaded, fills the state on
# connecting and catches anything missed while the websocket was reopening.
# Every object is addressed by the IDs mimoLive gives it, which it stores in
# the document, so they stay valid for as long as the document is used.
# Boinx's mlController, a menu bar app beside mimoLive, serves a second HTTP
# API on port 8990 that launches, quits and restarts mimoLive and opens
# documents; those commands and its status go to the mlcontroller endpoint.

source:
  - title: mimoLive User Manual, Remote Control & Automation > HTTP API (overview)
    author: Boinx Software
    url: https://mimolive.com/user-manual/remote-control-automation/http-api/
    note: >
      Manufacturer document, last updated 2024-10-08, retrieved 2026-10-04. The server on port
      8989 when enabled, the /api/v1 prefix, JSON:API, IDs persisted in the document; from 3.1 the
      password as its SHA-256 in hex, in the X-MimoLive-Password-SHA256 header or the pwSHA256
      query parameter, shown and copyable in the Remote Controls preference pane; the error
      object {"errors": [{status, title, description}]}.
  - title: mimoLive User Manual, HTTP API > Endpoints
    author: Boinx Software
    url: https://mimolive.com/user-manual/remote-control-automation/http-api/endpoints/
    note: >
      Manufacturer document, last updated 2026-08-19. Every endpoint here: documents and their
      setLive, setOff and toggleLive; creating, querying, modifying (name, volume from 5.6,
      input-values) and deleting layers; layer setLive, setOff, toggleLive, signals,
      cycleThroughVariants (5.6), cycleThroughVariantsBackwards, setLiveFirstVariant,
      setLiveLastVariant and input media control with its thirteen commands; variants and their
      actions; sources (gain clipped to 0-2, channel-map, video and audio device by id or name or
      none, mimoCall attributes from 6.18), source media control, signals and actions (6.18);
      filters; output destinations with their ten type identifiers, JSON:API PATCH of title,
      starts-with-show, stops-with-show and settings, setLive and setOff answering 409 when they
      cannot; layer sets (5.0) with create, PATCH, delete and recall; data stores; Zoom join (a
      Zoom account name required from 6.19, 400 without), leave, end, participants and the
      meeting action commands.
  - title: mimoLive User Manual, HTTP API > Data Types
    author: Boinx Software
    url: https://mimolive.com/user-manual/remote-control-automation/http-api/data-types/
    note: >
      Manufacturer document, last updated 2026-08-19. The documents, layers, variants, sources,
      filters, output-destinations and layer-sets objects, their attributes and relationships; the
      LiveState values off, live, preview, shutdown and startup, and the TallyState values off,
      in-use, effect, preview and program; recording settings and filename placeholders.
  - title: mimoLive API Reference (mimoLive-API.md)
    author: Boinx Software
    url: https://github.com/boinx/mimoLive-API-Reference
    note: >
      Manufacturer document under the MIT licence, last pushed 2026-07-10. The websocket at
      /api/v1/socket with {"event": "ping"} every 5 seconds or a timeout at 15, and added, removed
      and changed events by resource type; the built-in outputs record, stream, playout and
      fullscreen started and stopped with documents/(DocumentID)/outputs/(OutputID)/setLive and
      setOff (any other verb toggles); programOutputMasterVolume; Content-Type
      application/vnd.api+json for writes; POST answering 201 and DELETE 204; the type catalogs
      (/layertypes, /sourcetypes, /outputdestinationtypes) and one type of each by its id;
      /comments/new with comment, username, platform, date, favorite and userimageurl; /settings;
      /accounts (6.19); Zoom participant source assignment by zoom-userid and
      zoom-userselectiontype (0, 2, 6) and the webinartoken join parameter; the document's name
      and metadata (title, comments, author, show, width, height, framerate, samplerate,
      duration) as PUT or PATCH attributes; the source attributes is-hidden, is-static,
      filepath, zoom-username and zoom-videoresolution; the output destination attribute
      output-destination-type; layer sets created with name, recall flags and layers; the
      include query that sideloads a document's layers and sources; the mlController proxy API on
      port 8990 (/api/status, /api/start, /api/stop, /api/restart, /api/open, /api/select).
  - title: mlController (Boinx's mimoLive controller app, MIT licence)
    author: Boinx Software
    url: https://github.com/boinx/mlController
    note: >
      Manufacturer code, read for corroboration (Services/MimoLiveWebSocket.swift: the websocket
      URL, the ping message every 5 seconds against the 15-second timeout, and that pong and ping
      messages are not state; Services/WebServer.swift: the routes of its API on port 8990, the
      status object's running, openDocuments, localDocuments, selectedMimoLive,
      selectedMimoLivePath and availableMimoLiveApps, every answer 200 with JSON, a path in the
      JSON body of /api/open and /api/select, and its optional password by Basic or the
      x-mlcontroller-password header, answering 401 without it).
  - title: companion-module-boinx-mimolive (Bitfocus Companion module, MIT licence)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-boinx-mimolive
    note: >
      Read for corroboration only (src/api.js, src/actions.js). Its websocket handler shows the
      event message shape: {event, type, id, data} where data is the whole object, with
      data.attributes and data.relationships (document, layer, active-variant) as the HTTP API
      returns them; it sets a layer's volume with a plain PUT body {"volume": x}.

# The API key (the password's SHA-256 in hex, which the Remote Controls
# preference pane shows and copies) goes in mimoLive's own header on every
# request and on the websocket's opening request; empty sends none.
transport:
  type: http
  port: 8989
  scheme: http
  auth: header
  auth_header: X-MimoLive-Password-SHA256
  timeout_ms: 5000
  probe: { method: GET, path: /api/v1/documents }
  # mlController's API: mimoLive's key never goes to it, and it is reached
  # while mimoLive itself is not running.
  endpoints:
    mlcontroller:
      port: { setting: mlcontroller_port }
      auth: none

settings:
  token: { type: string, secret: true, max_length: 64, pattern: "^([0-9A-Fa-f]{64})?$",
    label: API key,
    description: "The API key from mimoLive's Remote Controls preferences, the SHA-256 of the remote control password in hex; leave empty when no password is set." }
  mlcontroller_port: { type: int, min: 1, max: 65535, default: 8990,
    label: mlController port,
    description: "Port of Boinx's mlController app on the mimoLive computer, which launches, quits and restarts mimoLive and opens documents." }

ports:
  - { port: 8989, protocol: http, role: control }
  - { port: 8989, protocol: ws, role: push }
  - { port: 8990, protocol: http, role: control, setting: mlcontroller_port, note: "Boinx's mlController app, when installed: launch, quit and restart mimoLive, open documents, and its status" }

models:
  - id: mimolive
    name: mimoLive 6 (HTTP API enabled)
    supports: [list_documents, get_document, start_show, stop_show, toggle_show, set_program_volume,
               set_document_name, set_show_title, set_show_author, set_show_comments, set_show_name,
               set_show_planned_duration, set_document_resolution, set_document_framerate,
               set_document_samplerate, set_document_metadata, start_output, stop_output,
               list_layers, get_layer, layer_live, layer_off, layer_toggle, layer_next_variant,
               layer_previous_variant, layer_live_first_variant, layer_live_last_variant,
               set_layer_volume, set_layer_name, set_layer_text, set_layer_number, set_layer_flag,
               set_layer_inputs, trigger_layer_signal, layer_media_control, add_layer, add_layer_at,
               add_layer_with_inputs, delete_layer, list_variants, get_variant, variant_live,
               variant_off, variant_toggle, set_variant_name, set_variant_text, set_variant_inputs,
               trigger_variant_signal, list_sources, get_source, set_source_gain, set_source_name,
               set_source_inputs, set_source_video_device, set_source_audio_device,
               set_source_channel_map, set_source_channel_map_by_name, set_source_video_device_id,
               set_source_audio_device_id, set_mimocall_video_codec,
               set_mimocall_high_quality_audio, set_mimocall_partner_sees,
               set_mimocall_partner_sees_source, set_mimocall_partner_sees_above_layer,
               set_mimocall_partner_hears, set_mimocall_partner_hears_custom_mix,
               set_mimocall_partner_hears_solo_source, source_media_control, trigger_source_signal,
               source_action, add_source, add_source_with_attributes, delete_source, list_filters,
               get_filter, set_filter_inputs, trigger_filter_signal, list_output_destinations,
               get_output_destination, output_destination_live, output_destination_off,
               set_output_destination_title, set_output_destination_starts_with_show,
               set_output_destination_stops_with_show, set_recording_location,
               set_recording_filename, set_streaming_target, set_streaming_public_url,
               reset_recording_location, reset_recording_filename, add_output_destination,
               add_output_destination_at, add_output_destination_with_attributes,
               delete_output_destination, list_layer_sets, get_layer_set, recall_layer_set,
               set_layer_set_name, set_layer_set_layers, set_layer_set_recall_on_show_start,
               set_layer_set_recall_on_show_end, add_layer_set, add_layer_set_with_layers,
               delete_layer_set, get_datastore, put_datastore, delete_datastore, list_devices,
               get_device, list_accounts, list_layer_types, list_source_types,
               list_output_destination_types, get_layer_type, get_source_type,
               get_output_destination_type, get_server_settings, inject_comment,
               inject_comment_with_details, zoom_join, zoom_join_with_passcode, zoom_join_webinar,
               zoom_leave, zoom_end, zoom_participants, zoom_meeting_action,
               zoom_participant_action, zoom_assign_participant, zoom_unassign_source,
               zoom_assign_active_speaker, zoom_assign_screen_share, mlcontroller_status,
               launch_mimolive, quit_mimolive, restart_mimolive, open_document, select_mimolive_app]
    verification: none

commands:
  # ── Documents and the show ────────────────────────────────────────────────
  list_documents:
    summary: "The open documents with their live state (GET /documents)"
    send: { method: GET, path: /api/v1/documents }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_document:
    summary: "One document, with its layers, sources and output destinations sideloaded (GET /documents/(DocumentID))"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
    send: { method: GET, path: "/api/v1/documents/{document}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  start_show:
    summary: "Start the show: the document goes live and triggers its start events, such as outputs set to start with the show (setLive)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
    send: { method: POST, path: "/api/v1/documents/{document}/setLive" }
    expect: { status: 200 }
    returns: ack

  stop_show:
    summary: "Stop the show, with the outputs set to stop with it (setOff)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
    send: { method: POST, path: "/api/v1/documents/{document}/setOff" }
    expect: { status: 200 }
    returns: ack

  toggle_show:
    summary: "Start the show if it is off, stop it if it is live (toggleLive)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
    send: { method: POST, path: "/api/v1/documents/{document}/toggleLive" }
    expect: { status: 200 }
    returns: ack

  set_program_volume:
    summary: "Set the program output master volume (PUT /documents/(DocumentID), programOutputMasterVolume)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      volume: { type: float, min: 0.0, max: 1.0, required: true, label: Volume, description: "Program output master volume from 0.0 (silent) to 1.0 (full)." }
    send: { method: PUT, path: "/api/v1/documents/{document}", body: "{\"programOutputMasterVolume\":{volume:.3f}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_document_name:
    summary: "Rename a document (PUT /documents/(DocumentID), name)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      name: { type: string, max_length: 256, required: true, label: Name, description: "The new name, as mimoLive shows it." }
    send: { method: PUT, path: "/api/v1/documents/{document}", body: "{\"name\":{name:json}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_show_title:
    summary: "Set the show title in the show metadata (PUT /documents/(DocumentID), metadata.title)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      title: { type: string, max_length: 1024, required: true, label: "Show title", description: "The show's title, as the show metadata panel holds it." }
    send: { method: PUT, path: "/api/v1/documents/{document}", body: "{\"metadata\":{\"title\":{title:json}}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_show_author:
    summary: "Set the author in the show metadata (PUT /documents/(DocumentID), metadata.author)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      author: { type: string, max_length: 1024, required: true, label: Author, description: "The show's author, as the show metadata panel holds it." }
    send: { method: PUT, path: "/api/v1/documents/{document}", body: "{\"metadata\":{\"author\":{author:json}}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_show_comments:
    summary: "Set the comments in the show metadata (PUT /documents/(DocumentID), metadata.comments)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      comments: { type: string, max_length: 4096, required: true, label: Comments, description: "Free text comments about the show, as the show metadata panel holds them, on one line (set_document_metadata takes line breaks as JSON escapes)." }
    send: { method: PUT, path: "/api/v1/documents/{document}", body: "{\"metadata\":{\"comments\":{comments:json}}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_show_name:
    summary: "Set the generic show name in the show metadata, which the %show file name placeholder uses (PUT /documents/(DocumentID), metadata.show)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      show: { type: string, max_length: 1024, required: true, label: "Show name", description: "The generic name of the show, as the show metadata panel holds it." }
    send: { method: PUT, path: "/api/v1/documents/{document}", body: "{\"metadata\":{\"show\":{show:json}}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_show_planned_duration:
    summary: "Set the proposed show length, the show timer's length (PUT /documents/(DocumentID), metadata.duration)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      seconds: { type: int, min: 0, max: 604800, required: true, label: "Show length", description: "The planned length of the show in seconds, which a countdown against the running duration uses." }
    send: { method: PUT, path: "/api/v1/documents/{document}", body: "{\"metadata\":{\"duration\":{seconds}}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_document_resolution:
    summary: "Set the document's video resolution (PUT /documents/(DocumentID), metadata.width and height)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      width: { type: int, min: 16, max: 16384, required: true, label: Width, description: "Video width in pixels, such as 1920." }
      height: { type: int, min: 16, max: 16384, required: true, label: Height, description: "Video height in pixels, such as 1080." }
    send: { method: PUT, path: "/api/v1/documents/{document}", body: "{\"metadata\":{\"width\":{width},\"height\":{height}}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_document_framerate:
    summary: "Set the document's frame rate (PUT /documents/(DocumentID), metadata.framerate)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      framerate: { type: float, min: 1.0, max: 240.0, required: true, label: "Frame rate", description: "Frames per second, such as 29.97, 30, 50 or 60." }
    send: { method: PUT, path: "/api/v1/documents/{document}", body: "{\"metadata\":{\"framerate\":{framerate:.3f}}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_document_samplerate:
    summary: "Set the document's audio sample rate (PUT /documents/(DocumentID), metadata.samplerate)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      samplerate: { type: int, min: 8000, max: 192000, required: true, label: "Sample rate", description: "Audio sample rate in hertz, such as 48000." }
    send: { method: PUT, path: "/api/v1/documents/{document}", body: "{\"metadata\":{\"samplerate\":{samplerate}}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  set_document_metadata:
    summary: "Set several show metadata fields at once (PUT /documents/(DocumentID), metadata object: title, comments, author, show, width, height, framerate, samplerate, duration)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      metadata: { type: json, required: true, label: Metadata, description: "A JSON object of metadata fields and their new values, as the document's metadata attribute reports them; fields left out are unchanged." }
    send: { method: PUT, path: "/api/v1/documents/{document}", body: "{\"metadata\":{metadata}}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  start_output:
    summary: "Start one of the document's built-in outputs (outputs/(OutputID)/setLive)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      output: { type: enum, values: [record, stream, playout, fullscreen], required: true, label: Output, description: "The document's built-in output: record (file recording), stream, playout or fullscreen." }
    send: { method: POST, path: "/api/v1/documents/{document}/outputs/{output}/setLive" }
    expect: { status: 200 }
    returns: ack

  stop_output:
    summary: "Stop one of the document's built-in outputs (outputs/(OutputID)/setOff)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      output: { type: enum, values: [record, stream, playout, fullscreen], required: true, label: Output, description: "The document's built-in output: record (file recording), stream, playout or fullscreen." }
    send: { method: POST, path: "/api/v1/documents/{document}/outputs/{output}/setOff" }
    expect: { status: 200 }
    returns: ack

  # ── Layers ────────────────────────────────────────────────────────────────
  list_layers:
    summary: "The document's layers, top of the stack first (GET /documents/(DocumentID)/layers)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
    send: { method: GET, path: "/api/v1/documents/{document}/layers" }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_layer:
    summary: "One layer with its variants sideloaded (GET .../layers/(LayerID))"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
    send: { method: GET, path: "/api/v1/documents/{document}/layers/{layer}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  layer_live:
    summary: "Switch a layer live with its last selected variant (setLive)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
    send: { method: POST, path: "/api/v1/documents/{document}/layers/{layer}/setLive" }
    expect: { status: 200 }
    returns: ack

  layer_off:
    summary: "Switch a layer off, with its outgoing transition (setOff)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
    send: { method: POST, path: "/api/v1/documents/{document}/layers/{layer}/setOff" }
    expect: { status: 200 }
    returns: ack

  layer_toggle:
    summary: "Toggle a layer between live and off (toggleLive)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer ID", description: "The layer's ID (a UUID), from the layer list or its Copy API Endpoint menu." }
    send: { method: POST, path: "/api/v1/documents/{document}/layers/{layer}/toggleLive" }
    expect: { status: 200 }
    returns: ack

  layer_next_variant:
    summary: "Select the next variant to go live next, without changing what is on air (cycleThroughVariants, mimoLive 5.6 and later)"
    params:
