      recall_on_show_start: { type: bool, required: true, label: "Recall at show start", description: "On recalls the layer set each time the show starts; off leaves it to be recalled by hand." }
      recall_on_show_end: { type: bool, required: true, label: "Recall at show end", description: "On recalls the layer set each time the show ends; off leaves it to be recalled by hand." }
      layers: { type: json, required: true, label: "Layer actions", description: "JSON array of {\"layer-id\", \"action\", \"variant\"} entries, action live, off or force-off, variant edit-variant or a variant ID for a live entry." }
    send: { method: POST, path: "/api/v1/documents/{document}/layer-sets", body: "{\"data\":{\"attributes\":{\"name\":{name:json},\"recall-on-show-start\":{recall_on_show_start},\"recall-on-show-end\":{recall_on_show_end},\"layers\":{layers}}}}", content_type: application/vnd.api+json }
    expect: { status: 201 }
    returns: ack

  delete_layer_set:
    summary: "Remove a layer set (DELETE .../layer-sets/(LayerSetID))"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      layer_set: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer set ID", description: "The layer set's ID (a UUID), from the layer set list." }
    send: { method: DELETE, path: "/api/v1/documents/{document}/layer-sets/{layer_set}" }
    expect: { status: 204 }
    returns: ack

  # ── Data stores ───────────────────────────────────────────────────────────
  get_datastore:
    summary: "Read a data store kept in the document (GET .../datastores/(StoreID), mimoLive 6.8 and later)"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      store: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Store ID", description: "A name of your choosing for the data store; mimoLive cannot list them." }
    send: { method: GET, path: "/api/v1/documents/{document}/datastores/{store}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  put_datastore:
    summary: "Create or replace a data store with a JSON value (PUT .../datastores/(StoreID))"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      store: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Store ID", description: "A name of your choosing for the data store; mimoLive cannot list them." }
      data: { type: json, required: true, label: Data, description: "The JSON value to keep in the store, returned exactly as given." }
    send: { method: PUT, path: "/api/v1/documents/{document}/datastores/{store}", body: "{data}", content_type: application/vnd.api+json }
    expect: { status: 200 }
    returns: ack

  delete_datastore:
    summary: "Delete a data store (DELETE .../datastores/(StoreID))"
    params:
      document: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Document ID", description: "The document's ID, from the document list or the document's Copy API Endpoint menu in mimoLive." }
      store: { type: string, max_length: 128, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Store ID", description: "A name of your choosing for the data store; mimoLive cannot list them." }
    send: { method: DELETE, path: "/api/v1/documents/{document}/datastores/{store}" }
    expect: { status: 204 }
    returns: ack

  # ── Devices, accounts, types and comments ─────────────────────────────────
  list_devices:
    summary: "The video and audio devices on the mimoLive computer, with their connection and tally state (GET /devices)"
    send: { method: GET, path: /api/v1/devices }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_device:
    summary: "One device, with an audio device's input channel names (GET /devices/(DeviceID))"
    params:
      device: { type: string, max_length: 256, required: true, label: "Device ID", description: "The video or audio device's ID, from the device list." }
    send: { method: GET, path: "/api/v1/devices/{device}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  list_accounts:
    summary: "The web service accounts logged in to mimoLive (GET /accounts, mimoLive 6.19 and later)"
    send: { method: GET, path: /api/v1/accounts }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  list_layer_types:
    summary: "Every layer type, whose ids add_layer takes (GET /layertypes)"
    send: { method: GET, path: /api/v1/layertypes }
    expect: { status: 200, json_path: "$" }
    returns: value

  list_source_types:
    summary: "Every source type, whose ids add_source takes (GET /sourcetypes)"
    send: { method: GET, path: /api/v1/sourcetypes }
    expect: { status: 200, json_path: "$" }
    returns: value

  list_output_destination_types:
    summary: "Every output destination type (GET /outputdestinationtypes)"
    send: { method: GET, path: /api/v1/outputdestinationtypes }
    expect: { status: 200, json_path: "$" }
    returns: value

  # The reply's shape is not documented beyond "incl. its input parameters"
  # (Boinx's reference); a JSON:API object is assumed, {"data": {"type":
  # "layertypes", "id": TypeID, "attributes": {...}}}, with the type's inputs
  # as a layer reports them (input-descriptions, and input-values holding the
  # defaults). It is returned whole to the caller and not kept in state: the
  # reply names the type only by its dotted identifier, which cannot be a
  # state key, and cannot be matched to the type's position in the list.
  get_layer_type:
    summary: "One layer type with its input parameters, such as the descriptions and default values of its inputs, returned whole and not kept in state (GET /layertypes/(TypeID))"
    params:
      type_id: { type: string, max_length: 256, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Layer type", description: "The layer type's identifier from the layer type list, such as com.boinx.mimoLive.layer.lowerthird." }
    send: { method: GET, path: "/api/v1/layertypes/{type_id}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_source_type:
    summary: "One source type with its settings (GET /sourcetypes/(TypeID))"
    params:
      type_id: { type: string, max_length: 256, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Source type", description: "The source type's identifier from the source type list, such as com.boinx.mimoLive.sources.deviceVideoSource." }
    send: { method: GET, path: "/api/v1/sourcetypes/{type_id}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_output_destination_type:
    summary: "One output destination type with its settings (GET /outputdestinationtypes/(TypeID))"
    params:
      type_id: { type: string, max_length: 256, pattern: "^[A-Za-z0-9._-]+$", required: true, label: "Output destination type", description: "The output destination type's identifier from the type list, such as com.boinx.mimoLive.outputDestination.fileRecording." }
    send: { method: GET, path: "/api/v1/outputdestinationtypes/{type_id}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_server_settings:
    summary: "The HTTP server's own settings, such as whether usage tracking is on (GET /settings)"
    send: { method: GET, path: /api/v1/settings }
    expect: { status: 200, json_path: "$" }
    returns: value

  inject_comment:
    summary: "Add a comment to mimoLive's live comments, as if it came from a social platform (comments/new)"
    params:
      username: { type: string, max_length: 256, required: true, label: Author, description: "The name shown as the comment's author." }
      comment: { type: string, max_length: 4096, required: true, label: Comment, description: "The comment text." }
      platform: { type: enum, values: [facebook, twitter, youtube, twitch], required: true, label: Platform, description: "The service whose icon the comment carries." }
    send: { method: POST, path: /api/v1/comments/new, query: {"username": "{username}", "comment": "{comment}", "platform": "{platform}"} }
    expect: { status: 200 }
    returns: ack

  inject_comment_with_details:
    summary: "Add a comment to mimoLive's live comments with its time, favorite mark and author picture (comments/new)"
    params:
      username: { type: string, max_length: 256, required: true, label: Author, description: "The name shown as the comment's author." }
      comment: { type: string, max_length: 4096, required: true, label: Comment, description: "The comment text." }
      platform: { type: enum, values: [facebook, twitter, youtube, twitch], required: true, label: Platform, description: "The service whose icon the comment carries." }
      date: { type: string, max_length: 64, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+(Z|[+-][0-9]{2}:?[0-9]{2})$", required: true, label: Time, description: "When the comment was written, as an ISO 8601 timestamp such as 2026-10-07T18:30:00Z." }
      favorite: { type: bool, required: true, label: Favorite, description: "On marks the comment as a favorite." }
      user_image_url: { type: string, max_length: 2048, pattern: "^https?://", required: true, label: "Author picture", description: "Web address of the author's picture, shown beside the comment." }
    send: { method: POST, path: /api/v1/comments/new, query: {"username": "{username}", "comment": "{comment}", "platform": "{platform}", "date": "{date}", "favorite": "{favorite}", "userimageurl": "{user_image_url}"} }
    expect: { status: 200 }
    returns: ack

  # ── Zoom ──────────────────────────────────────────────────────────────────
  zoom_join:
    summary: "Join a Zoom meeting with a logged-in Zoom account (zoom/join)"
    params:
      meeting: { type: string, max_length: 64, pattern: "^[A-Za-z0-9-]+$", required: true, label: "Meeting ID", description: "The Zoom meeting number, or Demo-Meeting-ID for mimoLive's demo meeting." }
      account: { type: string, max_length: 256, required: true, label: "Zoom account", description: "The name of a Zoom account logged in to mimoLive, as the account list gives it." }
    send: { method: GET, path: /api/v1/zoom/join, query: {"meetingid": "{meeting}", "zoomaccountname": "{account}"} }
    expect: { status: 200, json_path: "$" }
    returns: value

  zoom_join_with_passcode:
    summary: "Join a Zoom meeting with a passcode and display name, sending the program out as video (zoom/join)"
    params:
      meeting: { type: string, max_length: 64, pattern: "^[A-Za-z0-9-]+$", required: true, label: "Meeting ID", description: "The Zoom meeting number, or Demo-Meeting-ID for mimoLive's demo meeting." }
      account: { type: string, max_length: 256, required: true, label: "Zoom account", description: "The name of a Zoom account logged in to mimoLive, as the account list gives it." }
      passcode: { type: string, max_length: 64, required: true, label: Passcode, description: "The meeting's passcode." }
      display_name: { type: string, max_length: 128, required: true, label: "Display name", description: "The name mimoLive appears under in the meeting." }
    send: { method: GET, path: /api/v1/zoom/join, query: {"meetingid": "{meeting}", "zoomaccountname": "{account}", "passcode": "{passcode}", "displayname": "{display_name}", "virtualcamera": "true"} }
    expect: { status: 200, json_path: "$" }
    returns: value

  zoom_join_webinar:
    summary: "Join a Zoom webinar with its token and a display name, sending the program out as video or not (zoom/join)"
    params:
      meeting: { type: string, max_length: 64, pattern: "^[A-Za-z0-9-]+$", required: true, label: "Meeting ID", description: "The Zoom webinar's meeting number." }
      account: { type: string, max_length: 256, required: true, label: "Zoom account", description: "The name of a Zoom account logged in to mimoLive, as the account list gives it." }
      webinar_token: { type: string, max_length: 1024, required: true, label: "Webinar token", description: "The webinar token Zoom gives for joining the webinar." }
      display_name: { type: string, max_length: 128, required: true, label: "Display name", description: "The name mimoLive appears under in the webinar." }
      virtual_camera: { type: bool, required: true, label: "Send program", description: "On sends mimoLive's program output to Zoom as mimoLive's video." }
    send: { method: GET, path: /api/v1/zoom/join, query: {"meetingid": "{meeting}", "zoomaccountname": "{account}", "webinartoken": "{webinar_token}", "displayname": "{display_name}", "virtualcamera": "{virtual_camera}"} }
    expect: { status: 200, json_path: "$" }
    returns: value

  zoom_leave:
    summary: "Leave the Zoom meeting (zoom/leave)"
    send: { method: GET, path: /api/v1/zoom/leave }
    expect: { status: 200 }
    returns: ack

  zoom_end:
