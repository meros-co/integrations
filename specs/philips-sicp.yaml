spec: 1
id: philips-sicp
name: Philips professional displays (SICP, Serial / Ethernet Interface Communication Protocol)
vendor: Philips (PPDS)
category: display
implementation: native
reason: >
  SICP is binary: each message is its own length, the monitor ID, a group byte (absent before SICP 1.86), the
  command and its data, and an XOR checksum, answered by a generic ACK, NACK or NAV report or by a report
  under the get's own code. Several settings travel in one message (the video parameters, the color gains and
  offsets, both volumes, treble and bass, the volume limits), so changing one means sending the others as last
  read, and the reports' layouts differ per command.

source:
  - title: "Serial / Ethernet Interface Communication Protocol Specification (SICP V2.03) for Professional Displays (2019-06-14)"
    author: "Philips Signage (TPV Technology for Koninklijke Philips N.V.)"
    url: "https://community.xibo.org.uk/uploads/short-url/vwVq2nPyhJKL4kTCYpa6VYhQUa8.pdf"
    note: >
      Philips's own document, read from a copy posted on the Xibo community forum; no copy on a Philips domain
      was found, and later versions (2.05 and on) are not public. Nothing here is quoted from it. RS-232 1200
      to 57600 bps, 9600 by default, 8 data bits, no parity, 1 stop bit, crossed cable, daisy chain (§2.1);
      TCP 5000 (§2.2); one message answered before the next, a retry after 500 ms (§2.2); message layout,
      monitor ID, group, checksum (§2.2.1); ACK, NACK and NAV (§2.4); platform and SICP version labels A2,
      model, firmware and build date A1 (§3); power 18/19, input locks 1A-1D, cold start A3/A4, input source
      AC/AD with playlist and OSD bytes, auto signal detecting AE/AF, failover A5/A6, restart 57, backlight
      71/72 (§4); video parameters 32/33, color temperature 34/35, color parameters 36/37, color temperature in
      100 K 11/12, picture format 3A/3B, VGA 38/39, PIP 3C/3D and 84/85 (§5); volume 44/45, volume step 41,
      volume limits B6-B9, treble and bass 42/43, mute 46/47 (§6); operating hours 0F, smart power DD/DE, VGA
      auto adjust 70, temperature 2F, serial code 15, tiling 22/23, monitor and group IDs C0, show ID 4C,
      AnyTile 4A/4B and 4E/4F, light sensor 24/25, human sensor B3/B4, OSD rotating 26/27, orientation 16/17,
      information OSD 2C/2D, MEMC 28/29, touch 1E/1F, noise reduction 2A/2B, scan mode 50/51, scan conversion
      52/53, switch-on delay 54/55, factory reset 56, power-on logo 3E/3F, fan speed 61/62, APM D0/D1, power
      save D2/D3, pixel shift B1/B2, off timer 91/92, ECO 63/64, picture style 65/66, screenshot 58, signal 59,
      frame compensation 5E/5F and 67/68 (§7); scheduling 5A/5B (§8); group ID 5C/5D (§9); custom
      multi-window FB-FD (§10); LED strip F3/F4 (§12); storage lock F1/F2 (§13); monitor ID 69 (§14);
      platforms and models (§15); revision history (§17).
  - title: "User Manual, 43BDL3650Q, 50BDL3650Q, 55BDL3650Q (2023)"
    author: "Philips / PPDS"
    url: "https://www.documents.philips.com/assets/20240207/326b8676a5bf4ef98de2b10f00b4e145.pdf"
    note: >
      Network SICP on by default on port 5000, configurable 1025-65535 (Settings > Signage Display > Network
      Application > SICP Network Port); the four power save modes, of which 3 and 4 keep TCP on in standby and
      1 and 2 wake on LAN; monitor ID 1-255 and group 1-254; RS-232 routing.
  - title: "Bitfocus Companion module philips-sicp (MIT)"
    url: "https://github.com/bitfocus/companion-module-philips-sicp"
    note: "Corroboration only, licence checked, no code copied: the same framing and port."

settings:
  # The display's Monitor ID (menu, 1-255). 0 broadcasts and is never answered, so it is not offered.
  monitor_id: { type: int, min: 1, max: 255, default: 1, label: Monitor ID, description: "The display's monitor ID from its menu, 1 to 255; on an RS-232 chain, the display this device addresses." }
  # Firmware before SICP 1.86 has no group byte; the Himalaya 1.0 platform and later always take it.
  group_byte: { type: bool, default: true, label: Group byte, description: "On sends the group byte (SICP 1.86 and later); off for older firmware that takes none." }
  poll_ms: { type: int, min: 500, max: 3600000, default: 5000, label: Read interval, description: "Milliseconds between reads of power, input, volume and mute; other settings are read every minute." }
  # tcp: SICP over LAN, port 5000 by default (set on the display). serial: its RS-232 port, the same messages.
  link: { type: enum, values: [tcp, serial], default: tcp, label: Link, description: "tcp reaches the display on the network; serial uses an RS-232 port of the host wired to the display's RS-232 IN." }
  serial_port: { type: string, max_length: 256, label: Serial port, description: "With link serial, the host's serial port wired to the display: COM3 on Windows, /dev/ttyUSB0 on Linux, /dev/cu.usbserial-1420 on macOS." }
  baud_rate: { type: enum, values: ["1200", "2400", "4800", "9600", "19200", "38400", "57600"], default: "9600", label: Baud rate, description: "With link serial, the speed set on the display: 9600 by default." }
  data_bits: { type: int, min: 8, max: 8, default: 8, label: Data bits, description: "With link serial, bits per character; SICP uses 8." }
  parity: { type: enum, values: [none], default: none, label: Parity, description: "With link serial, no parity." }
  stop_bits: { type: int, min: 1, max: 1, default: 1, label: Stop bits, description: "With link serial, one stop bit." }
  flow_control: { type: enum, values: [none], default: none, label: Flow control, description: "With link serial, no flow control: only RXD, TXD and ground are wired." }

ports:
  - { port: 5000, protocol: tcp, role: control, when: "link tcp", note: "the display's SICP network port, 5000 unless changed in its menu" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "RS-232 port of the host wired to the display's RS-232 IN (DB-9 or 2.5 mm jack), crossed cable" }

