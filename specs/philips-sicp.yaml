commands:
  get_power: {summary: Read the power state (19), returns: value}
  set_power:
    summary: Set the power state (18) and read it back
    params:
      'on': {type: bool, required: true, label: Power, description: 'On turns the display on; off puts it in standby (from standby over
          LAN, power save mode 3 or 4 must keep the network up).'}
    returns: ack
  get_power_at_cold_start: {summary: Read the power state after mains power returns (A4), returns: value}
  set_power_at_cold_start:
    summary: Set the power state after mains power returns (A3) and read it back
    params:
      state:
        type: enum
        values: ['off', 'on', last]
        required: true
        label: State
        description: 'The state after mains power returns: off, on, or the last state.'
    returns: ack
  get_backlight: {summary: Read the backlight (71), returns: value}
  set_backlight:
    summary: Set the backlight (72) and read it back
    params:
      'on': {type: bool, required: true, label: Backlight, description: On lights the backlight; off turns it off with the display running.}
    returns: ack
  get_ir_lock: {summary: Read the remote control lock (1D), returns: value}
  set_ir_lock:
    summary: Set the remote control lock (1C) and read it back
    params:
      lock:
        type: enum
        values: [unlocked, all, all_but_power, all_but_volume, primary, secondary, all_but_power_and_volume]
        required: true
        label: IR lock
        description: 'What the remote control may do: unlocked, all locked, all but power or volume (or both) locked; primary and secondary
          set a daisy chain''s IR roles.'
    returns: ack
  get_keypad_lock: {summary: Read the keypad lock (1B), returns: value}
  set_keypad_lock:
    summary: Set the keypad lock (1A) and read it back
    params:
      lock:
        type: enum
        values: [unlocked, all, all_but_power, all_but_volume, all_but_power_and_volume]
        required: true
        label: Keypad lock
        description: What the display's keys may do; the partial locks are not on the 10BDL3151T and 24BDL2451T.
    returns: ack
  get_auto_signal_detecting: {summary: Read the auto signal detecting (AF), returns: value}
  set_auto_signal_detecting:
    summary: Set the auto signal detecting (AE) and read it back
    params:
      mode:
        type: enum
        values: ['off', all, pc_sources, video_sources, failover]
        required: true
        label: Auto signal detecting
        description: Which sources the display switches to on losing its signal, or failover (the order set_failover_priority sets).
    returns: ack
  get_color_temperature: {summary: Read the color temperature preset (35), returns: value}
  set_color_temperature:
    summary: Set the color temperature preset (34) and read it back
    params:
      preset:
        type: enum
        values: [user1, native, 11000k, 10000k, 9300k, 7500k, 6500k, 5770k, 5500k, 5000k, 4000k, 3400k, 3350k, 3000k, 2800k, 2600k,
          1850k, user2]
        required: true
        label: Color temperature
        description: A preset; most models offer user1, native, 10000k, 9300k, 7500k, 6500k, 5000k, 4000k, 3000k and user2.
    returns: ack
  get_color_temperature_kelvin: {summary: Read the color temperature in 100 K steps (12), returns: value}
  set_color_temperature_kelvin:
    summary: Set the color temperature in 100 K steps (11) and read it back
    params:
      hundreds: {type: int, min: 20, max: 100, required: true, label: Color temperature, description: 'Color temperature in hundreds
          of kelvin, 20 (2000 K) to 100 (10000 K); 26 at least on Phoenix 2.0.'}
    returns: ack
  get_picture_format: {summary: Read the picture format (3B), returns: value}
  set_picture_format:
    summary: Set the picture format (3A) and read it back
    params:
      format:
        type: enum
        values: [normal, custom, real, full, '21_9', dynamic, '16_9']
        required: true
        label: Picture format
        description: normal (4:3), custom, real (1:1), full, 21:9, dynamic or 16:9.
    returns: ack
  get_picture_style: {summary: Read the picture style (65), returns: value}
  set_picture_style:
    summary: Set the picture style (66) and read it back
    params:
      style:
        type: enum
        values: [highbright, srgb, vivid, natural, standard, video, static_signage, text, energy_saving, soft, user]
        required: true
        label: Picture style
        description: The picture style; each model offers some of them.
    returns: ack
  get_noise_reduction: {summary: Read the noise reduction (2B), returns: value}
  set_noise_reduction:
    summary: Set the noise reduction (2A) and read it back
    params:
      level:
        type: enum
        values: ['off', low, middle, high, default]
        required: true
        label: Noise reduction
        description: Noise reduction level; default is Challenger 2.1's.
    returns: ack
  get_memc: {summary: Read the MEMC effect (29), returns: value}
  set_memc:
    summary: Set the MEMC effect (28) and read it back
    params:
      level:
        type: enum
        values: ['off', low, medium, high]
        required: true
        label: MEMC
        description: Motion compensation level.
    returns: ack
  get_scan_mode: {summary: Read the scan mode (51), returns: value}
  set_scan_mode:
    summary: Set the scan mode (50) and read it back
    params:
      mode:
        type: enum
        values: [overscan, underscan, 'off']
        required: true
        label: Scan mode
        description: Overscan, underscan or off.
    returns: ack
  get_scan_conversion: {summary: Read the scan conversion (53), returns: value}
  set_scan_conversion:
    summary: Set the scan conversion (52) and read it back
    params:
      mode:
        type: enum
        values: [progressive, interlace]
        required: true
        label: Scan conversion
        description: Progressive or interlaced conversion.
    returns: ack
  get_mute: {summary: Read the mute (46), returns: value}
  set_mute:
    summary: Set the mute (47) and read it back
    params:
      muted: {type: bool, required: true, label: Mute, description: On mutes the speakers and the audio out; off restores them.}
    returns: ack
  get_switch_on_delay: {summary: Read the tiling switch-on delay (55), returns: value}
  set_switch_on_delay:
    summary: Set the tiling switch-on delay (54) and read it back
    params:
      delay: {type: int, min: 0, max: 255, required: true, label: Switch-on delay, description: '0 off, 1 auto (by tile position), or
          2 to 255 seconds before turning on.'}
    returns: ack
  get_frame_compensation_h: {summary: Read the horizontal frame compensation (5E), returns: value}
  set_frame_compensation_h:
    summary: Set the horizontal frame compensation (5F) and read it back
    params:
      value: {type: int, min: 0, max: 255, required: true, label: Horizontal frame compensation, description: 'Horizontal bezel compensation,
          0 to 255.'}
    returns: ack
  get_frame_compensation_v: {summary: Read the vertical frame compensation (67), returns: value}
  set_frame_compensation_v:
    summary: Set the vertical frame compensation (68) and read it back
    params:
      value: {type: int, min: 0, max: 255, required: true, label: Vertical frame compensation, description: 'Vertical bezel compensation,
          0 to 255.'}
    returns: ack
  get_anytile_resolution: {summary: Read the AnyTile resolution mode (4E), returns: value}
  set_anytile_resolution:
    summary: Set the AnyTile resolution mode (4F) and read it back
    params:
      mode:
        type: enum
        values: [default, fhd, uhd]
        required: true
        label: AnyTile resolution
        description: 'The canvas resolution: default, FHD or UHD.'
    returns: ack
  get_group_id: {summary: Read the group ID (5D), returns: value}
  set_group_id:
    summary: Set the group ID (5C) and read it back
    params:
      group: {type: int, min: 1, max: 255, required: true, label: Group ID, description: 'The display''s group, 1 to 254, or 255 for
          off on legacy firmware.'}
    returns: ack
  get_light_sensor: {summary: Read the light sensor (25), returns: value}
  set_light_sensor:
    summary: Set the light sensor (24) and read it back
    params:
      'on': {type: bool, required: true, label: Light sensor, description: On adjusts the backlight to the ambient light (a fitted sensor).}
    returns: ack
  get_human_sensor: {summary: Read the human sensor (B3), returns: value}
  set_human_sensor:
    summary: Set the human sensor (B4) and read it back
    params:
      minutes: {type: int, min: 0, max: 6, required: true, label: Human sensor, description: '0 off, or 1 to 6 for 10 to 60 minutes
          without a person before the backlight goes off; read 255 when no sensor is fitted.'}
    returns: ack
  get_fan_speed: {summary: Read the fan speed setting (62), returns: value}
  set_fan_speed:
    summary: Set the fan speed setting (61) and read it back
    params:
      speed:
        type: enum
        values: ['off', auto, low, middle, high]
        required: true
        label: Fan speed
        description: The fan speed setting.
    returns: ack
  get_smart_power: {summary: Read the smart power (DE), returns: value}
  set_smart_power:
    summary: Set the smart power (DD) and read it back
    params:
      level:
        type: enum
        values: ['off', low, medium, high]
        required: true
        label: Smart power
        description: Backlight dimming to save power; low is the same as off.
    returns: ack
  get_apm: {summary: Read the advanced power management (D1), returns: value}
  set_apm:
    summary: Set the advanced power management (D0) and read it back
    params:
      mode:
        type: enum
        values: ['off', 'on', mode1, mode2]
        required: true
        label: APM
        description: 'Advanced power management: off, on, mode1 (TCP off, Wake on LAN on) or mode2 (TCP on, Wake on LAN off).'
    returns: ack
  get_power_save: {summary: Read the power save mode (D3), returns: value}
  set_power_save:
    summary: Set the power save mode (D2) and read it back
    params:
      mode:
        type: enum
        values: [rgb_off_video_off, rgb_off_video_on, rgb_on_video_off, rgb_on_video_on, mode1, mode2, mode3, mode4]
        required: true
        label: Power save
        description: Power save mode; Android platforms take mode1 to mode4 (modes 3 and 4 keep TCP on in standby), older ones the RGB
          and video combinations.
    returns: ack
  get_eco_mode: {summary: Read the ECO mode (63), returns: value}
  set_eco_mode:
    summary: Set the ECO mode (64) and read it back
    params:
      mode:
        type: enum
        values: [low_power_standby, normal]
        required: true
        label: ECO mode
        description: 'Standby kind: low_power_standby or normal (Phoenix platforms).'
    returns: ack
  get_pixel_shift: {summary: Read the pixel shift (B1), returns: value}
  set_pixel_shift:
    summary: Set the pixel shift (B2) and read it back
    params:
      steps: {type: int, min: 0, max: 90, required: true, label: Pixel shift, description: '0 off, or 1 to 90 for 10 to 900 seconds
          between shifts (set_pixel_shift_auto for auto); read 91 for auto.'}
    returns: ack
  get_off_timer: {summary: Read the off timer (91), returns: value}
  set_off_timer:
    summary: Set the off timer (92) and read it back
    params:
      hours: {type: int, min: 0, max: 24, required: true, label: Off timer, description: '0 off, or 1 to 24 hours before the display
          turns off.'}
    returns: ack
  get_osd_rotation: {summary: Read the on-screen menu rotation (27), returns: value}
  set_osd_rotation:
    summary: Set the on-screen menu rotation (26) and read it back
    params:
      'on': {type: bool, required: true, label: OSD rotation, description: On rotates the on-screen menu.}
    returns: ack
  get_information_osd: {summary: Read the information OSD (2D), returns: value}
  set_information_osd:
    summary: Set the information OSD (2C) and read it back
    params:
      seconds: {type: int, min: 0, max: 60, required: true, label: Information OSD, description: '0 off, or 1 to 60 seconds the information
          box shows.'}
    returns: ack
  get_touch: {summary: Read the touch feature (1F), returns: value}
  set_touch:
    summary: Set the touch feature (1E) and read it back
    params:
      'on': {type: bool, required: true, label: Touch, description: On enables the touch feature.}
    returns: ack
  get_power_on_logo: {summary: Read the power-on logo (3F), returns: value}
  set_power_on_logo:
    summary: Set the power-on logo (3E) and read it back
    params:
      logo:
        type: enum
        values: ['off', 'on', user]
        required: true
        label: Power-on logo
        description: 'The logo while starting: off, on (Philips) or user.'
    returns: ack
  get_external_storage_lock: {summary: Read the USB and microSD lock (F2), returns: value}
  set_external_storage_lock:
    summary: Set the USB and microSD lock (F1) and read it back
    params:
      locked: {type: bool, required: true, label: Storage lock, description: On locks every USB and microSD port.}
    returns: ack
  get_sicp_version: {summary: Read the SICP version the display implements (A2 00), returns: value}
  get_platform: {summary: 'Read the platform label (Eagle, Phoenix, Himalaya, Dragon ...) (A2 01)', returns: value}
  get_platform_version: {summary: Read the platform version (A2 02), returns: value}
  get_model: {summary: Read the model number (A1 00), returns: value}
  get_firmware_version: {summary: Read the firmware version (A1 01), returns: value}
  get_build_date: {summary: Read the firmware build date (A1 02), returns: value}
  get_android_firmware_version: {summary: Read the Android firmware build (A1 03), returns: value}
  get_serial_number: {summary: Read the serial code (15), returns: value}
  get_input: {summary: Read the input source and its playlist or URL number (AD), returns: value}
  set_input:
    summary: Select the input source (AC) and read it back
    params:
      source:
        type: enum
        values: &id001 [video, s_video, component, cvi2, vga, hdmi2, displayport2, usb2, card_dvi_d, displayport, card_ops, usb, hdmi,
          dvi_d, hdmi3, browser, smartcms, dms, internal_storage, media_player, pdf_player, custom, hdmi4, vga2, vga3, iwb]
        required: true
        label: Source
        description: 'The source; a model has some of them: hdmi is HDMI 1, card_ops the OPS slot, browser, smartcms, media_player,
          pdf_player and custom the Android sources.'
      playlist: {type: int, min: 0, max: 7, required: true, label: Playlist, description: 'For media_player and pdf_player the playlist
          1 to 7, for browser the URL 1 to 7, or 0 for none (Android platforms).'}
      show_label: {type: bool, required: true, label: Show label, description: On shows the source label on screen as it switches.}
    returns: ack
  get_failover_priority: {summary: Read the failover priority list (A6), returns: value}
  set_failover_priority:
    summary: Set the failover priority list (A5) and read it back
    params:
      sources: {type: string, max_length: 400, pattern: '^[a-z0-9_]+( *, *[a-z0-9_]+)*$', required: true, label: Sources, description: 'Sources
          in priority order, separated by commas, from: hdmi, component, composite, displayport, dvi_d, vga, ops, usb, browser, smartcms,
          internal_storage, dms, hdmi2, hdmi3, usb_playlist, usb_autoplay, media_player, pdf_player, custom, hdmi4, vga2, vga3, iwb.'}
    returns: ack
  restart:
    summary: 'Restart the display (57): Android or the scalar; Android platforms only'
    params:
      target:
        type: enum
        values: [android, scalar]
        required: true
        label: Restart
        description: What to restart.
    returns: ack
  get_video_parameters: {summary: 'Read the video parameters (33): brightness, color, contrast, sharpness, tint, black level and gamma',
    returns: value}
  set_brightness:
    summary: Set the brightness (32, with the other video parameters as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Brightness, description: Brightness from 0 to 100 percent of the display's
          range (sharpness 0 to 10 and tint -50 to 50 as signed bytes on Phoenix 2.0).}
    returns: ack
  set_color:
    summary: Set the color (32, with the other video parameters as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Color, description: Color from 0 to 100 percent of the display's range
          (sharpness 0 to 10 and tint -50 to 50 as signed bytes on Phoenix 2.0).}
    returns: ack
  set_contrast:
    summary: Set the contrast (32, with the other video parameters as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Contrast, description: Contrast from 0 to 100 percent of the display's
          range (sharpness 0 to 10 and tint -50 to 50 as signed bytes on Phoenix 2.0).}
    returns: ack
  set_sharpness:
    summary: Set the sharpness (32, with the other video parameters as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Sharpness, description: Sharpness from 0 to 100 percent of the display's
          range (sharpness 0 to 10 and tint -50 to 50 as signed bytes on Phoenix 2.0).}
    returns: ack
  set_tint:
    summary: Set the tint (32, with the other video parameters as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Tint, description: Tint from 0 to 100 percent of the display's range
          (sharpness 0 to 10 and tint -50 to 50 as signed bytes on Phoenix 2.0).}
    returns: ack
  set_black_level:
    summary: Set the black level (32, with the other video parameters as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Black level, description: Black level from 0 to 100 percent of the
          display's range (sharpness 0 to 10 and tint -50 to 50 as signed bytes on Phoenix 2.0).}
    returns: ack
  set_gamma:
    summary: Set the gamma (32, with the other video parameters as read) and read it back
    params:
      gamma:
        type: enum
        values: [native, s_gamma, '2.2', '2.4', dicom]
        required: true
        label: Gamma
        description: native, S gamma, 2.2, 2.4 or DICOM.
    returns: ack
  get_color_parameters: {summary: 'Read the red, green and blue gains and offsets (37)', returns: value}
  set_red_gain:
    summary: Set the red gain (36, with the others as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Red gain, description: Red gain from 0 to 255.}
    returns: ack
  set_green_gain:
    summary: Set the green gain (36, with the others as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Green gain, description: Green gain from 0 to 255.}
    returns: ack
  set_blue_gain:
    summary: Set the blue gain (36, with the others as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Blue gain, description: Blue gain from 0 to 255.}
    returns: ack
  set_red_offset:
    summary: Set the red offset (36, with the others as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Red offset, description: Red offset from 0 to 255.}
    returns: ack
  set_green_offset:
    summary: Set the green offset (36, with the others as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Green offset, description: Green offset from 0 to 255.}
    returns: ack
  set_blue_offset:
    summary: Set the blue offset (36, with the others as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Blue offset, description: Blue offset from 0 to 255.}
    returns: ack
  get_vga_parameters: {summary: 'Read the VGA clock, phase and position (39)', returns: value}
  set_vga_h_position:
    summary: Set the VGA horizontal position (38, with the others as read) and read it back
    params:
      position: {type: int, min: 0, max: 100, required: true, label: Horizontal position, description: 'Horizontal position from 0 to
          100 percent, in steps of 10.'}
    returns: ack
  set_vga_v_position:
    summary: Set the VGA vertical position (38, with the others as read) and read it back
    params:
      position: {type: int, min: 0, max: 100, required: true, label: Vertical position, description: 'Vertical position from 0 to 100
          percent, in steps of 10.'}
    returns: ack
  auto_adjust: {summary: Adjust the VGA picture automatically (70 40 00), returns: ack}
  get_signal: {summary: Read whether the input has a signal (59), returns: value}
  get_volume: {summary: Read the speaker and audio-out volumes (45), returns: value}
  set_volume:
    summary: Set the speaker volume (44, with the audio-out volume as read) and read it back
    params:
      level: {type: int, min: 0, max: 100, required: true, label: Volume, description: Speaker volume from 0 to 100; 0 does not mute.}
    returns: ack
  set_audio_out_volume:
    summary: Set the audio-out volume (44, with the speaker volume as read) and read it back
    params:
      level: {type: int, min: 0, max: 100, required: true, label: Audio out volume, description: Audio-out volume from 0 to 100.}
    returns: ack
  volume_up:
    summary: Step the volume up (41) and read it back
    params:
      audio_out: {type: bool, required: true, label: Audio out too, description: On steps the audio-out volume up with the speakers;
          off leaves it (newer firmware only).}
    returns: ack
  volume_down:
    summary: Step the volume down (41) and read it back
    params:
      audio_out: {type: bool, required: true, label: Audio out too, description: On steps the audio-out volume down with the speakers;
          off leaves it (newer firmware only).}
    returns: ack
  get_audio_parameters: {summary: Read the treble and bass (43), returns: value}
  set_treble:
    summary: Set the treble (42, with the other as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Treble, description: Treble from 0 to 100 percent (-8 to 8 as signed
          bytes on Phoenix 2.0).}
    returns: ack
  set_bass:
    summary: Set the bass (42, with the other as read) and read it back
    params:
      level: {type: int, min: 0, max: 255, required: true, label: Bass, description: Bass from 0 to 100 percent (-8 to 8 as signed bytes
          on Phoenix 2.0).}
    returns: ack
  get_speaker_volume_limits: {summary: Read the speaker volume limits (B6), returns: value}
  set_speaker_volume_limits:
    summary: Set the speaker volume limits (B8) and read them back
    params:
      minimum: {type: int, min: 0, max: 100, required: true, label: Minimum, description: Lowest volume from 0 to 100.}
      maximum: {type: int, min: 0, max: 100, required: true, label: Maximum, description: Highest volume from 0 to 100 (60 for the audio
          out on Phoenix 2.0).}
      switch_on: {type: int, min: 0, max: 100, required: true, label: Switch-on volume, description: 'Volume at power on, between the
          minimum and the maximum.'}
    returns: ack
  get_audio_out_volume_limits: {summary: Read the audio-out volume limits (B7), returns: value}
  set_audio_out_volume_limits:
    summary: Set the audio-out volume limits (B9) and read them back
    params:
      minimum: {type: int, min: 0, max: 100, required: true, label: Minimum, description: Lowest volume from 0 to 100.}
      maximum: {type: int, min: 0, max: 100, required: true, label: Maximum, description: Highest volume from 0 to 100 (60 for the audio
          out on Phoenix 2.0).}
      switch_on: {type: int, min: 0, max: 100, required: true, label: Switch-on volume, description: 'Volume at power on, between the
          minimum and the maximum.'}
    returns: ack
  get_pip: {summary: Read the PIP mode and position (3D), returns: value}
  set_pip:
    summary: Set the PIP mode and position (3C) and read it back
    params:
      mode:
        type: enum
        values: ['off', pip, pop, quick_swap, pbp_2win, pbp_3win, pbp_4win, pbp_3win_1, pbp_3win_2, pbp_4win_1, custom]
        required: true
        label: PIP mode
        description: Off, PIP, POP, quick swap, the PBP layouts, or custom (the multi-window layout); each platform offers some of them.
      position:
        type: enum
        values: [bottom_left, top_left, top_right, bottom_right, center]
        required: true
        label: PIP position
        description: Where the sub picture shows.
    returns: ack
  get_pip_sources: {summary: Read the PIP sources (85), returns: value}
  set_pip_source:
    summary: Set the PIP source (84, short form for Dragon platforms) and read it back
    params:
      source:
        type: enum
        values: *id001
        required: true
        label: Source
        description: 'The source; a model has some of them: hdmi is HDMI 1, card_ops the OPS slot, browser, smartcms, media_player,
          pdf_player and custom the Android sources.'
    returns: ack
  set_pip_sources:
    summary: Set the sources of PIP windows 2 to 4 (84) and read them back
    params:
      q2:
        type: enum
        values: *id001
        required: true
        label: Window 2 source
        description: 'The source; a model has some of them: hdmi is HDMI 1, card_ops the OPS slot, browser, smartcms, media_player,
          pdf_player and custom the Android sources.'
      q3:
        type: enum
        values: *id001
        required: true
        label: Window 3 source
        description: 'The source; a model has some of them: hdmi is HDMI 1, card_ops the OPS slot, browser, smartcms, media_player,
          pdf_player and custom the Android sources.'
      q4:
        type: enum
        values: *id001
        required: true
        label: Window 4 source
        description: 'The source; a model has some of them: hdmi is HDMI 1, card_ops the OPS slot, browser, smartcms, media_player,
          pdf_player and custom the Android sources.'
    returns: ack
  get_tiling: {summary: Read the tiling settings (23), returns: value}
  set_tiling:
    summary: 'Set tiling: on or off, frame compensation, position and the wall''s size (22), and read it back'
    params:
      enabled: {type: bool, required: true, label: Tiling, description: On shows this display's part of the wall.}
      frame_compensation: {type: bool, required: true, label: Frame compensation, description: On hides the picture behind the bezels.}
      position: {type: int, min: 1, max: 150, required: true, label: Position, description: 'This display''s place in the wall from
          1, left to right then top to bottom.'}
      columns: {type: int, min: 1, max: 15, required: true, label: Columns, description: 'Displays across the wall: 1 to 5, or 1 to
          15 with zero_bezel.'}
      rows: {type: int, min: 1, max: 10, required: true, label: Rows, description: 'Displays down the wall: 1 to 5, or 1 to 10 with
          zero_bezel.'}
      zero_bezel: {type: bool, required: true, label: Zero bezel, description: 'On for a model whose wall can be 15 by 10 (the size
          is coded 15 to a row), off for a 5 by 5 one.'}
    returns: ack
  set_tiling_enabled:
    summary: Turn tiling on or off, keeping the other tiling settings (22 with keep values), and read it back
    params:
      enabled: {type: bool, required: true, label: Tiling, description: On shows this display's part of the wall.}
    returns: ack
  get_anytile: {summary: Read the AnyTile canvas settings (4A), returns: value}
  set_anytile:
    summary: Set the AnyTile canvas (4B) and read it back; canvas tiling must be enabled in the admin menu
    params:
      enabled: {type: bool, required: true, label: AnyTile, description: On shows a part of the canvas.}
      rotation: {type: int, min: 0, max: 270, required: true, label: Rotation, description: 'Rotation in degrees: 0, 90, 180 or 270.'}
      h_start: {type: int, min: 0, max: 65535, required: true, label: Horizontal start, description: 'Left edge of this display''s part,
          in pixels.'}
      v_start: {type: int, min: 0, max: 65535, required: true, label: Vertical start, description: 'Top edge of this display''s part,
          in pixels.'}
      h_size: {type: int, min: 0, max: 65535, required: true, label: Width, description: 'Width of this display''s part, in pixels.'}
      v_size: {type: int, min: 0, max: 65535, required: true, label: Height, description: 'Height of this display''s part, in pixels.'}
    returns: ack
  assign_ids:
    summary: Set the display's monitor ID and group ID (C0, over LAN only)
    params:
      monitor_id: {type: int, min: 1, max: 255, required: true, label: Monitor ID, description: 'The new monitor ID, 1 to 255.'}
      group_id: {type: int, min: 1, max: 254, required: true, label: Group ID, description: 'The new group ID, 1 to 254.'}
    returns: ack
  show_monitor_id:
    summary: Show the monitor ID on screen (4C)
    params:
      monitor_id: {type: int, min: 1, max: 255, required: true, label: Monitor ID, description: 'The monitor ID to show, 1 to 255.'}
    returns: ack
  set_monitor_id:
    summary: Change the display's monitor ID (69)
    params:
      monitor_id: {type: int, min: 1, max: 255, required: true, label: Monitor ID, description: 'The new monitor ID, 1 to 255.'}
    returns: ack
  get_operating_hours: {summary: Read the operating hours (0F 02), returns: value}
  get_temperature: {summary: 'Read the temperature sensors (2F), 0 to 100 °C', returns: value}
  set_pixel_shift_auto: {summary: Set pixel shift to auto (B2 5B) and read it back, returns: ack}
  get_orientation: {summary: Read the display orientation settings (16), returns: value}
  set_orientation:
    summary: Set the on-screen menu and picture rotation (17) and read it back
    params:
      osd_portrait: {type: bool, required: true, label: Portrait menu, description: On shows the menu in portrait.}
      image:
        type: enum
        values: ['off', 'on', clockwise, counter_clockwise]
        required: true
        label: Picture rotation
        description: 'The whole picture: off, on, clockwise or counter-clockwise (the last two on the CRD50 only).'
      window1: {type: bool, required: true, label: Window 1 rotation, description: On rotates window 1.}
      window2: {type: bool, required: true, label: Window 2 rotation, description: On rotates window 2.}
      window3: {type: bool, required: true, label: Window 3 rotation, description: On rotates window 3.}
      window4: {type: bool, required: true, label: Window 4 rotation, description: On rotates window 4.}
    returns: ack
  factory_reset: {summary: Restore the factory settings (56), returns: ack}
  screenshot: {summary: Take a screenshot and e-mail it (58); Android platforms with e-mail notification set up, returns: ack}
  get_led_strip: {summary: Read the LED strip (F4), returns: value}
  set_led_strip:
    summary: Set the LED strip (F3) and read it back
    params:
      'on': {type: bool, required: true, label: LED strip, description: On lights the strip.}
      red: {type: int, min: 0, max: 255, required: true, label: Red, description: Red from 0 to 255.}
      green: {type: int, min: 0, max: 255, required: true, label: Green, description: Green from 0 to 255.}
      blue: {type: int, min: 0, max: 255, required: true, label: Blue, description: Blue from 0 to 255.}
    returns: ack
  get_schedule:
    summary: Read a schedule page (5B)
    params:
      page: &id002 {type: int, min: 1, max: 7, required: true, label: Page, description: Schedule page from 1 to 7.}
    returns: value
  set_schedule:
    summary: Set a schedule page (5A) and read it back
    params:
      page: *id002
      enabled: {type: bool, required: true, label: Enabled, description: On makes the page take effect.}
      start_hour: {type: int, min: 0, max: 24, required: true, label: Start hour, description: 'Hour from 0 to 23, or 24 for none.'}
      start_minute: {type: int, min: 0, max: 60, required: true, label: Start minute, description: 'Minute from 0 to 59, or 60 for none.'}
      end_hour: {type: int, min: 0, max: 24, required: true, label: End hour, description: 'Hour from 0 to 23, or 24 for none.'}
      end_minute: {type: int, min: 0, max: 60, required: true, label: End minute, description: 'Minute from 0 to 59, or 60 for none.'}
      source:
        type: enum
        values: *id001
        required: true
        label: Source
        description: 'The source; a model has some of them: hdmi is HDMI 1, card_ops the OPS slot, browser, smartcms, media_player,
          pdf_player and custom the Android sources.'
      every_week: {type: bool, required: true, label: Every week, description: On runs the page every week.}
      monday: {type: bool, required: true, label: Monday, description: On runs the page on Monday.}
      tuesday: {type: bool, required: true, label: Tuesday, description: On runs the page on Tuesday.}
      wednesday: {type: bool, required: true, label: Wednesday, description: On runs the page on Wednesday.}
      thursday: {type: bool, required: true, label: Thursday, description: On runs the page on Thursday.}
      friday: {type: bool, required: true, label: Friday, description: On runs the page on Friday.}
      saturday: {type: bool, required: true, label: Saturday, description: On runs the page on Saturday.}
      sunday: {type: bool, required: true, label: Sunday, description: On runs the page on Sunday.}
      playlist: {type: int, min: 0, max: 7, required: true, label: Playlist, description: 'Playlist or bookmark 1 to 7, or 0 for none
          (Dragon and Himalaya 2.0).'}
    returns: ack
  set_multi_window:
    summary: Turn the custom multi-window layout on or off and set its window count (FB)
    params:
      enabled: {type: bool, required: true, label: Multi-window, description: On shows the custom layout.}
      windows: {type: int, min: 1, max: 4, required: true, label: Windows, description: Windows from 1 to 4 (2 on Dragon 1.x).}
    returns: ack
  get_window:
    summary: Read a custom multi-window window (FD)
    params:
      window: &id003 {type: int, min: 0, max: 3, required: true, label: Window, description: Window from 0 (main) to 3 (sub 3).}
    returns: value
  set_window:
    summary: Set a custom multi-window window's rotation, place, size and format (FC) and read it back
    params:
      window: *id003
      rotation:
        type: enum
        values: [none, rot90, rot270, mirror_h, mirror_v, mirror_hv]
        required: true
        label: Rotation
        description: Rotation or mirroring of the window.
      x: {type: int, min: 0, max: 65535, required: true, label: X, description: Left edge in pixels.}
      y: {type: int, min: 0, max: 65535, required: true, label: Y, description: Top edge in pixels.}
      width: {type: int, min: 0, max: 65535, required: true, label: Width, description: 'Width in pixels, within the panel.'}
      height: {type: int, min: 0, max: 65535, required: true, label: Height, description: 'Height in pixels, within the panel.'}
      format:
        type: enum
        values: [normal, custom, real, full, '21_9', dynamic, '16_9']
        required: true
        label: Picture format
        description: The window's picture format.
    returns: ack
state:
