  audio.limits.speaker.switch_on: {type: int, description: 'Speaker volume limit: switch-on volume'}
  audio.treble: {type: int, description: Treble (43)}
  audio.volume: {type: int, description: 'Speaker volume (45), 0 to 100'}
  auto_signal_detecting: {type: string, description: Auto signal detecting (AF)}
  backlight: {type: bool, description: Whether the backlight is on (71)}
  color_temperature: {type: string, description: Color temperature preset (35)}
  color_temperature_kelvin: {type: int, description: Color temperature in hundreds of kelvin (12)}
  eco_mode: {type: string, description: ECO mode (63)}
  external_storage_lock: {type: bool, description: USB and microSD lock (F2)}
