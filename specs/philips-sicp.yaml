quirks:
  - models: [all]
    severity: warning
    text: >
      In power save modes 1 and 2 the network is off in standby, so the display cannot be reached to turn it
      on: use mode 3 or 4 (set_power_save), or Wake on LAN, which this integration does not send. In standby
      most commands are answered NAV.
  - models: [all]
    severity: info
    text: >
      A command a display lacks, or cannot run now, is answered NAV and fails; NACK means the display could not
      read it. Platforms differ widely and Philips publishes no list per current model: get_platform and
      get_sicp_version say which a display is. Commands added after SICP 2.03 (date and time, power LED, HDMI
      CEC, freeze and others) are not offered: their document is not public.
  - models: [all]
    severity: info
    text: >
      Changing one video parameter, color gain or offset, volume, treble or bass, or VGA position sends the
      others of its message as last read (read first when not yet known), as SICP sets them together; a change
      made on the display in between is overwritten. Every set is followed by its read.
  - models: [all]
    severity: info
    text: >
      Nothing is pushed: power, input, volume and mute are read every poll_ms, the other settings every minute
      and the identity on connecting. A tiling report does not say whether the wall is coded 5 or 15 to a row,
      so both readings are kept.
  - models: [all]
    severity: critical
    text: >
      factory_reset restores the factory settings, network and IDs included, and set_monitor_id and assign_ids
      change the ID this device addresses: set monitor_id to the new ID afterwards. None can be undone from
      here.
  - models: [all]
    severity: info
    text: >
      The group byte of a reply may be other than 0 (the document's own acknowledgements carry 01), so replies
      are taken from any group. Broadcast (monitor ID 0) and group addressing are never answered and are not
      offered.
