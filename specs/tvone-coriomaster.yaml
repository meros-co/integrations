quirks:
  - models: [all]
    severity: warning
    text: >
      The unit accepts one controlling connection at a time, serial or
      Ethernet, never both (Commands 411, Constraints). CORIOgrapher or another
      controller connected at the same time can lose its connection or take
      this one's.

  - models: [all]
    severity: warning
    text: >
      The command reference does not document error replies. A failed command
      is assumed to answer a line starting "!Error", which fails it; a reply in
      another form would leave the command waiting until the timeout.

  - models: [all]
    severity: info
    text: >
      Login uses the web interface's accounts, admin/adminpw by default. The
      reference gives the success text ("!Info : User admin Logged In") but no
      failure text, so a wrong password is not detected as a refusal.

  - models: [all]
    severity: info
    text: >
      A read answers with "<path> = <value>" lines before "!Done", so read
      commands (get_window, get_canvas, get_property, preset_list,
      get_device_info) return only an acknowledgement; the values reach the
      state through the rules. get_property returns nothing for a path the
      rules do not name.

  - models: [all]
    severity: critical
    text: >
      preset_take and storyboard_take change the live outputs, with the
      preset's transition time. window_input, window_canvas and the window
      geometry commands change what is on screen immediately. Do not use
      presets to add or remove windows (Commands 411, Preset Commands).

  - models: [all]
    severity: warning
    text: >
      preset_save, preset_remove, preset_remove_all, preset_save_all and
      storyboard_remove overwrite or clear stored presets without asking.
      Window<n>.Input must never be set to NULL (undefined behaviour), so
      window_input takes a SlotN.InN only.

  - models: [all]
    severity: info
    text: >
      API limits: the command reference has no window crop (no crop
      property on a window, canvas or layout), so cropping is done in
      CORIOgrapher; a window's keying lists KeyingU and KeyingV values beside
      KeyingY, but only the luma (Y) key is documented, so only it is offered
      and kept. Window events report only an input change; other window
      properties reach state from the echo of this connection's commands,
      the reads on connecting and the re-read after a preset or storyboard.
      Only one controlling connection is allowed, so no other controller
      changes them meanwhile.

  - models: [all]
    severity: info
    text: >
      Not included: System.Reset() (reboot), which answers "!Info: Rebooting..."
      rather than "!Done"; the per-slot input and output module properties
      (resolution, EDID, HDBaseT, audio, media player), which set_property and
      get_property reach by path; and CORIOmaster2 (CM2 series), which has its
      own command reference.
