spec: 1
id: tvone-coriomaster
name: tvONE CORIOmaster (command line API)
vendor: tvONE
category: switcher

# CORIOmaster's command line API is a tree of properties and methods over TCP
# port 10001, one command per line. "<path> = <value>" sets a property and
# "<path>" reads it (or lists a branch); the unit echoes each value as
# "<path> = <value>" and ends every command with "!Done <path>". Methods are
# "<path>()". Events the connection has subscribed to with AddEvents arrive
# unasked as "!Event <category>,<event>,<detail>". A command's reply is the
# "!Done" line; the value lines before it go to the telemetry rules, so a read
# fills the state rather than returning its value.

source:
  - title: tvONE CORIOmaster Commands, document version 411.0.1 (System API 4.11, firmware M411)
    author: tvONE
    url: https://api.tvone.com/products/c3-series/c3-5xx/tvONE%20CORIOmaster%20Commands_current.pdf
    note: >
      Manufacturer document, linked from tvONE's CORIOmaster API page
      (https://api.tvone.com/products/c3-series/c3-5xx/). Used for the serial
      and Ethernet settings (port 10001, one controlling connection at a time,
      page 4), Login, StartBatch and EndBatch (page 6), the CORIOmax
      properties (page 8), the event mechanism (AddEvents, RemoveEvents and
      the event list, page 37), the Window, Canvas, Layout, Storyboard and
      Preset properties, methods, ranges and events (Routing commands, pages
      187-204) and the custom types (page 205). Cited as Commands 411.
  - title: tvONE CORIOmaster / CORIOmaster mini Manual, version 1.0.7
    author: tvONE
    url: https://tvone.com/filestore/Manuals-CORIO-Products/CORIOmaster_Manual.pdf
    note: >
      Manufacturer document. The command line section ("Using Command Line
      Interface for Resolution Editing") shows the unit greeting a connection
      with a caret prompt, login(<username>,<password>), and "!Done <path>"
      after each command.

transport:
  type: line-tcp
  port: 10001
  framing: terminated
  terminator: crlf
  reply_framing: line
  # Only "!Done" (and an error line, see quirks) ends a command; value lines,
  # "!Info" and "!Event" lines go to the telemetry rules.
  reply_match: "^!(Done|Error)"
  timeout_ms: 3000
  probe: "CORIOmax.Model_Name"

settings:
  username: { type: string, default: admin,
              label: Username,
              description: "A user account of the unit's web interface, used to log in when a password is set; admin by default." }
  password: { type: string, secret: true, default: adminpw,
              label: Password,
              description: "The password of that web interface account, adminpw by default; leave it unset to skip logging in." }

on_connect:
  - when_set: password
    send: "login({settings.username},{settings.password})"

ports:
  - { port: 10001, protocol: tcp, role: control }

models:
  - id: c3-540
    name: tvONE CORIOmaster (C3-540)
    supports: [window_input, window_canvas, window_alias, window_width, window_height, window_x, window_y, window_geometry, window_zorder, window_rotation, window_quality, window_border_width, window_border_color, window_hflip, window_vflip, window_fade, window_animate_fade, window_animate_hshrink, window_animate_vshrink, window_animate_spin, window_keying_layer, window_luma_key, get_window, canvas_alias, canvas_windows, canvas_layouts, canvas_audio_mode, canvas_audio_source, canvas_audio_follow_window, canvas_audio_mute, canvas_audio_volume, get_canvas, layout_canvas, layout_outputs, layout_size, layout_centre, layout_alias, storyboard_canvas, storyboard_take, storyboard_save, storyboard_remove, storyboard_name, preset_take, preset_save, preset_name, preset_duration, preset_remove, preset_list, preset_save_all, preset_restore_all, preset_remove_all, get_property, set_property, add_events, remove_events, get_device_info]
    verification: none
  - id: c3-510
    name: tvONE CORIOmaster mini (C3-510)
    supports: [window_input, window_canvas, window_alias, window_width, window_height, window_x, window_y, window_geometry, window_zorder, window_rotation, window_quality, window_border_width, window_border_color, window_hflip, window_vflip, window_fade, window_animate_fade, window_animate_hshrink, window_animate_vshrink, window_animate_spin, window_keying_layer, window_luma_key, get_window, canvas_alias, canvas_windows, canvas_layouts, canvas_audio_mode, canvas_audio_source, canvas_audio_follow_window, canvas_audio_mute, canvas_audio_volume, get_canvas, layout_canvas, layout_outputs, layout_size, layout_centre, layout_alias, storyboard_canvas, storyboard_take, storyboard_save, storyboard_remove, storyboard_name, preset_take, preset_save, preset_name, preset_duration, preset_remove, preset_list, preset_save_all, preset_restore_all, preset_remove_all, get_property, set_property, add_events, remove_events, get_device_info]
    verification: none
  - id: c3-503
    name: tvONE CORIOmaster micro (C3-503)
    supports: [window_input, window_canvas, window_alias, window_width, window_height, window_x, window_y, window_geometry, window_zorder, window_rotation, window_quality, window_border_width, window_border_color, window_hflip, window_vflip, window_fade, window_animate_fade, window_animate_hshrink, window_animate_vshrink, window_animate_spin, window_keying_layer, window_luma_key, get_window, canvas_alias, canvas_windows, canvas_layouts, canvas_audio_mode, canvas_audio_source, canvas_audio_follow_window, canvas_audio_mute, canvas_audio_volume, get_canvas, layout_canvas, layout_outputs, layout_size, layout_centre, layout_alias, storyboard_canvas, storyboard_take, storyboard_save, storyboard_remove, storyboard_name, preset_take, preset_save, preset_name, preset_duration, preset_remove, preset_list, preset_save_all, preset_restore_all, preset_remove_all, get_property, set_property, add_events, remove_events, get_device_info]
    verification: none

commands:
  window_input:
    summary: "Route an input to a window, such as Slot4.In1 (Window<n>.Input)"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      input: { type: string, pattern: "^Slot\\d+\\.In\\d+$", required: true,
               label: Input,
               description: "The input to show in the window, as Slot<n>.In<n> such as Slot4.In1; it changes the window on screen at once." }
    send: "Window{window}.Input = {input}"
    expect: { contains: "!Done" }
    returns: ack

  window_canvas:
    summary: "Assign a window to canvases, comma separated (Canvas1,Canvas2), or NULL for none"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      canvases: { type: string, pattern: "^(Canvas\\d+(,Canvas\\d+)*|NULL)$", required: true,
                  label: Canvases,
                  description: "The canvases the window appears on, comma separated such as Canvas1,Canvas2, or NULL to take it off every canvas." }
    send: "Window{window}.Canvas = {canvases}"
    expect: { contains: "!Done" }
    returns: ack

  window_alias:
    summary: "Set a window's alias name"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      alias: { type: string, pattern: "^[A-Za-z0-9_-]{1,32}$", required: true,
               label: Alias,
               description: "The alias name shown for it, up to 32 letters, digits, underscores or hyphens." }
    send: "Window{window}.Alias = {alias}"
    expect: { contains: "!Done" }
    returns: ack

  window_width:
    summary: "Set a window's width on the canvas, 0 to 16383"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      width: { type: int, min: 0, max: 16383, required: true,
               label: Width,
               description: "The window's width on the canvas, in canvas pixels, 0 to 16383." }
    send: "Window{window}.CanWidth = {width}"
    expect: { contains: "!Done" }
    returns: ack

  window_height:
    summary: "Set a window's height on the canvas, 0 to 16383"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      height: { type: int, min: 0, max: 16383, required: true,
                label: Height,
                description: "The window's height on the canvas, in canvas pixels, 0 to 16383." }
    send: "Window{window}.CanHeight = {height}"
    expect: { contains: "!Done" }
    returns: ack

  window_x:
    summary: "Set the x coordinate of a window's centre, -8192 to 8191"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      x: { type: int, min: -8192, max: 8191, required: true,
           label: Centre X,
           description: "Horizontal position of the window's centre on the canvas, in canvas pixels, -8192 to 8191." }
    send: "Window{window}.CanXCentre = {x}"
    expect: { contains: "!Done" }
    returns: ack

  window_y:
    summary: "Set the y coordinate of a window's centre, -8192 to 8191"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      y: { type: int, min: -8192, max: 8191, required: true,
           label: Centre Y,
           description: "Vertical position of the window's centre on the canvas, in canvas pixels, -8192 to 8191." }
    send: "Window{window}.CanYCentre = {y}"
    expect: { contains: "!Done" }
    returns: ack

  window_geometry:
    summary: "Set a window's size and centre together, applied at once (StartBatch ... EndBatch)"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      width: { type: int, min: 0, max: 16383, required: true,
               label: Width,
               description: "The window's width on the canvas, in canvas pixels, 0 to 16383." }
      height: { type: int, min: 0, max: 16383, required: true,
                label: Height,
                description: "The window's height on the canvas, in canvas pixels, 0 to 16383." }
      x: { type: int, min: -8192, max: 8191, required: true,
           label: Centre X,
           description: "Horizontal position of the window's centre on the canvas, in canvas pixels, -8192 to 8191." }
      y: { type: int, min: -8192, max: 8191, required: true,
           label: Centre Y,
           description: "Vertical position of the window's centre on the canvas, in canvas pixels, -8192 to 8191." }
    send:
      - "StartBatch"
      - "Window{window}.CanWidth = {width}"
      - "Window{window}.CanHeight = {height}"
      - "Window{window}.CanXCentre = {x}"
      - "Window{window}.CanYCentre = {y}"
      - "EndBatch"
    expect: { contains: "!Done" }
    returns: ack

  window_zorder:
    summary: "Set a window's depth within the canvas, 0 to 15"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      zorder: { type: int, min: 0, max: 15, required: true,
                label: Z-order,
                description: "The window's depth within the canvas, 0 to 15, deciding which overlapping window is drawn over which." }
    send: "Window{window}.Zorder = {zorder}"
    expect: { contains: "!Done" }
    returns: ack

  window_rotation:
    summary: "Rotate a window, 0 to 359 degrees"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      degrees: { type: int, min: 0, max: 359, required: true,
                 label: Rotation,
                 description: "Rotation of the window in whole degrees, 0 to 359; 0 is upright." }
    send: "Window{window}.RotateDeg = {degrees}"
    expect: { contains: "!Done" }
    returns: ack

  window_quality:
    summary: "Set a window's quality: 0 preview, 1024 HQ, 2048 EHQ, 4096 UHQ"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      quality: { type: enum, values: ["0", "1024", "2048", "4096"], required: true,
                 label: Quality,
                 description: "The window's processing quality: 0 preview, 1024 HQ, 2048 EHQ and 4096 UHQ (ultra high quality)." }
    send: "Window{window}.WDPQ = {quality}"
    expect: { contains: "!Done" }
    returns: ack

  window_border_width:
    summary: "Set a window's border width, 0 to 64 pixels"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      width: { type: int, min: 0, max: 64, required: true,
               label: Border width,
               description: "Width of the window's border in pixels, 0 (no border) to 64." }
    send: "Window{window}.BdrPixWidth = {width}"
    expect: { contains: "!Done" }
    returns: ack

  window_border_color:
    summary: "Set a window's border colour as an RGB integer (0xRRGGBB)"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      rgb: { type: int, min: 0, max: 16777215, required: true,
             label: Border colour,
             description: "The border colour as one RGB integer, 0xRRGGBB, so 16711680 is red and 0 is black." }
    send: "Window{window}.BdrRGB = {rgb}"
    expect: { contains: "!Done" }
    returns: ack

  window_hflip:
    summary: "Flip a window horizontally, or not"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      enabled: { type: enum, values: ["On", "Off"], default: "On",
                 label: Horizontal flip,
                 description: "On mirrors the window left to right and Off shows it unflipped." }
    send: "Window{window}.HFlip = {enabled}"
    expect: { contains: "!Done" }
    returns: ack

  window_vflip:
    summary: "Flip a window vertically, or not"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      enabled: { type: enum, values: ["On", "Off"], default: "On",
                 label: Vertical flip,
                 description: "On flips the window upside down and Off shows it unflipped." }
    send: "Window{window}.VFlip = {enabled}"
    expect: { contains: "!Done" }
    returns: ack

  window_fade:
    summary: "Set a window's fade: 0 full brightness to 256 black (FTB)"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      level: { type: int, min: 0, max: 256, required: true,
               label: Fade,
               description: "How far the window is faded to black: 0 is full brightness and 256 is fully black (fade to black)." }
    send: "Window{window}.FTB = {level}"
    expect: { contains: "!Done" }
    returns: ack

  window_animate_fade:
    summary: "Turn a window's fade-through-black animation on or off"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      enabled: { type: enum, values: ["On", "Off"], default: "On",
                 label: Fade animation,
                 description: "On makes the window fade through black when it changes and Off turns that animation off." }
    send: "Window{window}.SCFTB = {enabled}"
    expect: { contains: "!Done" }
    returns: ack

  window_animate_hshrink:
    summary: "Turn a window's horizontal shrink animation on or off"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      enabled: { type: enum, values: ["On", "Off"], default: "On",
                 label: Horizontal shrink animation,
                 description: "On makes the window shrink horizontally when it changes and Off turns that animation off." }
    send: "Window{window}.SCHShrink = {enabled}"
    expect: { contains: "!Done" }
    returns: ack

  window_animate_vshrink:
    summary: "Turn a window's vertical shrink animation on or off"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      enabled: { type: enum, values: ["On", "Off"], default: "On",
                 label: Vertical shrink animation,
                 description: "On makes the window shrink vertically when it changes and Off turns that animation off." }
    send: "Window{window}.SCVShrink = {enabled}"
    expect: { contains: "!Done" }
    returns: ack

  window_animate_spin:
    summary: "Set a window's spin animation, -7 (anticlockwise) to 7 (clockwise), 0 off"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      spin: { type: int, min: -7, max: 7, required: true,
              label: Spin,
              description: "Spin animation speed and direction, -7 anticlockwise to 7 clockwise, with 0 off." }
    send: "Window{window}.SCSpin = {spin}"
    expect: { contains: "!Done" }
    returns: ack

  window_keying_layer:
    summary: "Set a window's keying layer: 1 background, 2 foreground (keyed)"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      layer: { type: int, min: 1, max: 2, required: true,
               label: Keying layer,
               description: "Layer 1 is the background and layer 2 the foreground, where the window is keyed." }
    send: "Window{window}.KeyingLayer = {layer}"
    expect: { contains: "!Done" }
    returns: ack

  window_luma_key:
    summary: "Set a window's luma key: minimum and maximum 0-255, softness 0-15 (0 turns keying off)"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
      min: { type: int, min: 0, max: 255, required: true,
             label: Key minimum,
             description: "Lowest luma level of the key range, 0 to 255." }
      max: { type: int, min: 0, max: 255, required: true,
             label: Key maximum,
             description: "Highest luma level of the key range, 0 to 255." }
      softness: { type: int, min: 0, max: 15, required: true,
                  label: Key softness,
                  description: "Softness of the key edge, 0 to 15, where 0 turns luma keying off." }
    send:
      - "StartBatch"
      - "Window{window}.KeyingYMin = {min}"
      - "Window{window}.KeyingYMax = {max}"
      - "Window{window}.KeyingYSoft = {softness}"
      - "EndBatch"
    expect: { contains: "!Done" }
    returns: ack

  get_window:
    summary: "Read every property of a window into state (Window<n>)"
    params:
      window: { type: int, min: 1, max: 99, required: true,
                label: Window,
                description: "The window number, as in Window1 on the unit, from 1." }
    send: "Window{window}"
    expect: { contains: "!Done" }
    returns: ack

  canvas_alias:
    summary: "Set a canvas's alias name"
    params:
      canvas: { type: int, min: 1, max: 99, required: true,
                label: Canvas,
                description: "The canvas number, as in Canvas1 on the unit, from 1." }
      alias: { type: string, pattern: "^[A-Za-z0-9_-]{1,32}$", required: true,
               label: Alias,
               description: "The alias name shown for it, up to 32 letters, digits, underscores or hyphens." }
    send: "Canvas{canvas}.Alias = {alias}"
    expect: { contains: "!Done" }
    returns: ack

  canvas_windows:
    summary: "Set the windows on a canvas, comma separated (Window1,Window2)"
    params:
      canvas: { type: int, min: 1, max: 99, required: true,
                label: Canvas,
                description: "The canvas number, as in Canvas1 on the unit, from 1." }
      windows: { type: string, pattern: "^(Window\\d+(,Window\\d+)*|NULL)$", required: true,
                 label: Windows,
                 description: "The windows on the canvas, comma separated such as Window1,Window2, or NULL for none." }
    send: "Canvas{canvas}.WindowList = {windows}"
    expect: { contains: "!Done" }
    returns: ack

  canvas_layouts:
    summary: "Set the layouts a canvas is assigned to, comma separated"
    params:
      canvas: { type: int, min: 1, max: 99, required: true,
                label: Canvas,
                description: "The canvas number, as in Canvas1 on the unit, from 1." }
      layouts: { type: string, pattern: "^(Layout\\d+(,Layout\\d+)*|NULL)$", required: true,
                 label: Layouts,
                 description: "The layouts the canvas is assigned to, comma separated such as Layout1,Layout2, or NULL for none." }
    send: "Canvas{canvas}.LayoutList = {layouts}"
    expect: { contains: "!Done" }
    returns: ack

  canvas_audio_mode:
    summary: "Set where a canvas's audio comes from: FromSource or FollowWindow"
    params:
      canvas: { type: int, min: 1, max: 99, required: true,
                label: Canvas,
                description: "The canvas number, as in Canvas1 on the unit, from 1." }
      mode: { type: enum, values: [FromSource, FollowWindow], required: true,
              label: Audio mode,
              description: "FromSource takes the canvas audio from the chosen audio source and FollowWindow from the chosen window's input." }
    send: "Canvas{canvas}.AudioMode = {mode}"
    expect: { contains: "!Done" }
    returns: ack

  canvas_audio_source:
    summary: "Set a canvas's audio source, such as Slot1.In1, or NULL"
    params:
      canvas: { type: int, min: 1, max: 99, required: true,
                label: Canvas,
                description: "The canvas number, as in Canvas1 on the unit, from 1." }
      source: { type: string, pattern: "^(Slot\\d+\\.In\\d+(\\.AudIn[A-Z])?|NULL)$", required: true,
                label: Audio source,
                description: "The input whose audio the canvas outputs, as Slot<n>.In<n> with an optional .AudIn<letter> such as Slot1.In1.AudInA, or NULL for none; used in FromSource mode." }
    send: "Canvas{canvas}.AudioSource = {source}"
    expect: { contains: "!Done" }
    returns: ack

  canvas_audio_follow_window:
    summary: "Set the window whose audio a canvas outputs"
    params:
      canvas: { type: int, min: 1, max: 99, required: true,
                label: Canvas,
                description: "The canvas number, as in Canvas1 on the unit, from 1." }
      window: { type: int, min: 0, max: 99, required: true,
                label: Window,
                description: "The number of the window whose audio the canvas outputs in FollowWindow mode, from 1; the spec does not say what 0 does." }
    send: "Canvas{canvas}.AudioFollowWindow = {window}"
    expect: { contains: "!Done" }
    returns: ack

  canvas_audio_mute:
    summary: "Mute or unmute a canvas's audio"
    params:
      canvas: { type: int, min: 1, max: 99, required: true,
                label: Canvas,
                description: "The canvas number, as in Canvas1 on the unit, from 1." }
      muted: { type: enum, values: ["On", "Off"], default: "On",
               label: Mute,
               description: "On mutes the canvas audio and Off unmutes it." }
    send: "Canvas{canvas}.AudioMute = {muted}"
    expect: { contains: "!Done" }
    returns: ack

  canvas_audio_volume:
    summary: "Set a canvas's audio volume, 0 to 100 percent"
    params:
      canvas: { type: int, min: 1, max: 99, required: true,
                label: Canvas,
                description: "The canvas number, as in Canvas1 on the unit, from 1." }
      volume: { type: int, min: 0, max: 100, required: true,
                label: Volume,
                description: "The canvas audio volume in percent, 0 silent to 100 full." }
    send: "Canvas{canvas}.AudioVolume = {volume}"
    expect: { contains: "!Done" }
    returns: ack

  get_canvas:
    summary: "Read every property of a canvas into state (Canvas<n>)"
    params:
      canvas: { type: int, min: 1, max: 99, required: true,
                label: Canvas,
                description: "The canvas number, as in Canvas1 on the unit, from 1." }
    send: "Canvas{canvas}"
    expect: { contains: "!Done" }
    returns: ack

  layout_canvas:
    summary: "Assign a layout to a canvas"
    params:
      layout: { type: int, min: 1, max: 99, required: true,
                label: Layout,
                description: "The layout number, as in Layout1 on the unit, from 1." }
      canvas: { type: int, min: 1, max: 99, required: true,
                label: Canvas,
                description: "The number of the canvas the layout shows, from 1." }
    send: "Layout{layout}.Canvas = Canvas{canvas}"
    expect: { contains: "!Done" }
    returns: ack

  layout_outputs:
    summary: "Set a layout's outputs, comma separated (Slot13.Out1,Slot16.Out2)"
    params:
      layout: { type: int, min: 1, max: 99, required: true,
                label: Layout,
                description: "The layout number, as in Layout1 on the unit, from 1." }
      outputs: { type: string, pattern: "^(Slot\\d+\\.Out\\d+(,Slot\\d+\\.Out\\d+)*|NULL)$", required: true,
                 label: Outputs,
                 description: "The outputs the layout drives, comma separated as Slot<n>.Out<n> such as Slot13.Out1,Slot16.Out2, or NULL for none." }
    send: "Layout{layout}.OutputList = {outputs}"
    expect: { contains: "!Done" }
    returns: ack

  layout_size:
    summary: "Set a layout's image sizing, -32 to 16383 each (smaller is a larger image)"
    params:
      layout: { type: int, min: 1, max: 99, required: true,
                label: Layout,
                description: "The layout number, as in Layout1 on the unit, from 1." }
      width: { type: int, min: -32, max: 16383, required: true,
               label: Width,
               description: "Horizontal image sizing of the layout, -32 to 16383, where a smaller value gives a larger image." }
      height: { type: int, min: -32, max: 16383, required: true,
                label: Height,
                description: "Vertical image sizing of the layout, -32 to 16383, where a smaller value gives a larger image." }
    send:
      - "StartBatch"
      - "Layout{layout}.CanWidth4kUnit = {width}"
      - "Layout{layout}.CanHeight4kUnit = {height}"
      - "EndBatch"
    expect: { contains: "!Done" }
    returns: ack

  layout_centre:
    summary: "Set a layout's centring, -8191 to 8191 each"
    params:
      layout: { type: int, min: 1, max: 99, required: true,
                label: Layout,
                description: "The layout number, as in Layout1 on the unit, from 1." }
      x: { type: int, min: -8191, max: 8191, required: true,
           label: Centre X,
           description: "Horizontal centring of the layout, -8191 to 8191." }
      y: { type: int, min: -8191, max: 8191, required: true,
           label: Centre Y,
           description: "Vertical centring of the layout, -8191 to 8191." }
    send:
      - "StartBatch"
      - "Layout{layout}.CanXCentre = {x}"
      - "Layout{layout}.CanYCentre = {y}"
      - "EndBatch"
    expect: { contains: "!Done" }
    returns: ack

  layout_alias:
    summary: "Set a layout's alias name"
    params:
      layout: { type: int, min: 1, max: 99, required: true,
                label: Layout,
                description: "The layout number, as in Layout1 on the unit, from 1." }
      alias: { type: string, pattern: "^[A-Za-z0-9_-]{1,32}$", required: true,
               label: Alias,
               description: "The alias name shown for it, up to 32 letters, digits, underscores or hyphens." }
    send: "Layout{layout}.Alias = {alias}"
    expect: { contains: "!Done" }
    returns: ack

  storyboard_canvas:
    summary: "Assign a storyboard to a canvas"
    params:
      storyboard: { type: int, min: 1, max: 50, required: true,
                    label: Storyboard,
                    description: "The storyboard number, as in Stbd1 on the unit, from 1." }
      canvas: { type: int, min: 1, max: 99, required: true,
                label: Canvas,
                description: "The canvas the storyboard plays on, as in Canvas1 on the unit, from 1." }
    send: "Stbds.Stbd{storyboard}.Canvas = Canvas{canvas}"
    expect: { contains: "!Done" }
    returns: ack

  storyboard_take:
    summary: "Run a storyboard (Stbds.Stbd<n>.Take())"
    params:
      storyboard: { type: int, min: 1, max: 50, required: true,
                    label: Storyboard,
                    description: "The storyboard number to run, as in Stbd1 on the unit, from 1; running it changes the live outputs." }
    send: "Stbds.Stbd{storyboard}.Take()"
    expect: { contains: "!Done" }
    returns: ack

  storyboard_save:
    summary: "Make a storyboard persistent"
    params:
      storyboard: { type: int, min: 1, max: 50, required: true,
                    label: Storyboard,
                    description: "The storyboard number, as in Stbd1 on the unit, from 1." }
    send: "Stbds.Stbd{storyboard}.Save()"
    expect: { contains: "!Done" }
    returns: ack

  storyboard_remove:
    summary: "Clear a storyboard"
    params:
      storyboard: { type: int, min: 1, max: 50, required: true,
                    label: Storyboard,
                    description: "The storyboard number to clear, as in Stbd1 on the unit, from 1; it is cleared without asking." }
    send: "Stbds.Stbd{storyboard}.Remove()"
    expect: { contains: "!Done" }
    returns: ack

  storyboard_name:
    summary: "Rename a storyboard"
    params:
      storyboard: { type: int, min: 1, max: 50, required: true,
                    label: Storyboard,
                    description: "The storyboard number, as in Stbd1 on the unit, from 1." }
      name: { type: string, pattern: "^[A-Za-z0-9_]{1,20}$", required: true,
              label: Name,
              description: "The new storyboard name, up to 20 letters, digits or underscores." }
    send: "Stbds.Stbd{storyboard}.Name = {name}"
    expect: { contains: "!Done" }
    returns: ack

  preset_take:
    summary: "Take a preset, 1 to 49 (Preset.Take)"
    params:
      preset: { type: int, min: 1, max: 49, required: true,
                label: Preset,
                description: "The preset number to take, from 1; taking it changes the live outputs with the preset's transition time." }
    send: "Preset.Take = {preset}"
    expect: { contains: "!Done" }
    returns: ack

  preset_save:
    summary: "Save the live layout as a preset (Preset.Read, then Preset.SaveRead())"
    params:
      preset: { type: int, min: 1, max: 49, required: true,
                label: Preset,
                description: "The preset number to save the live layout into, from 1; an existing preset there is overwritten without asking." }
    send:
      - "Preset.Read = {preset}"
      - "Preset.SaveRead()"
    expect: { contains: "!Done" }
    returns: ack

  preset_name:
    summary: "Name a preset, up to 20 letters, digits or underscores"
    params:
      preset: { type: int, min: 1, max: 49, required: true,
                label: Preset,
                description: "The preset number as the unit numbers it, from 1." }
      name: { type: string, pattern: "^[A-Za-z0-9_]{1,20}$", required: true,
              label: Name,
              description: "The preset name, up to 20 letters, digits or underscores." }
    send:
      - "Preset.Read = {preset}"
      - "Preset.NameRead = {name}"
    expect: { contains: "!Done" }
    returns: ack

  preset_duration:
    summary: "Set a preset's transition time, 0 to 60000 ms"
    params:
      preset: { type: int, min: 1, max: 49, required: true,
                label: Preset,
                description: "The preset number as the unit numbers it, from 1." }
      ms: { type: int, min: 0, max: 60000, required: true,
            label: Transition time,
            description: "How long the preset's transition takes when it is taken, in milliseconds, 0 (a cut) to 60000." }
    send:
      - "Preset.Read = {preset}"
      - "Preset.DurationRead = {ms}"
    expect: { contains: "!Done" }
    returns: ack

  preset_remove:
    summary: "Clear a preset from memory"
    params:
      preset: { type: int, min: 1, max: 49, required: true,
                label: Preset,
                description: "The preset number to clear from memory, from 1; it is cleared without asking." }
    send:
      - "Preset.Read = {preset}"
      - "Preset.RmvPresetFileRead()"
    expect: { contains: "!Done" }
    returns: ack

  preset_list:
    summary: "List the valid presets: each answers Routing.Preset.PresetList[n]=name,canvas,duration (into state)"
    send: "Preset.PresetList()"
    expect: { contains: "!Done" }
    returns: ack

  preset_save_all:
    summary: "Save every preset to on-chip memory"
    send: "Preset.SaveAllPresets()"
    expect: { contains: "!Done" }
    returns: ack

  preset_restore_all:
    summary: "Restore every preset from on-chip memory"
    send: "Preset.RestoreAllPresets()"
    expect: { contains: "!Done" }
    returns: ack

  preset_remove_all:
    summary: "Clear every preset from on-chip memory"
    send: "Preset.RemovePresetFiles()"
    expect: { contains: "!Done" }
    returns: ack

  get_property:
    summary: "Read any property or list by its path, such as Slot4.In1 or System; matching lines update state"
    params:
      path: { type: string, pattern: "^[A-Za-z0-9_.()\\[\\]]{1,128}$", required: true,
              label: Path,
              description: "The property or branch to read, as the command reference names it, such as Slot4.In1 or System; only values the spec recognises reach state." }
    send: "{path}"
    expect: { contains: "!Done" }
    returns: ack

  set_property:
    summary: "Set any property: <path> = <value>, as the command reference lists them"
    params:
      path: { type: string, pattern: "^[A-Za-z0-9_.\\[\\]]{1,128}$", required: true,
              label: Path,
              description: "The property to set, as the command reference names it, such as Window1.Alias." }
      value: { type: string, pattern: "^[A-Za-z0-9_.:,@/ -]{0,128}$", required: true,
               label: Value,
               description: "The value to give the property, in the form the command reference lists for it." }
    send: "{path} = {value}"
    expect: { contains: "!Done" }
    returns: ack

  add_events:
    summary: "Subscribe this connection to an event category, such as HDMI or MODULE"
    params:
      category: { type: string, pattern: "^[A-Z_]{1,32}$", required: true,
                  label: Event category,
                  description: "The event category to receive on this connection, in capitals as the command reference lists them, such as HDMI or MODULE." }
    send: "AddEvents({category})"
    expect: { contains: "!Done" }
    returns: ack

  remove_events:
    summary: "Unsubscribe this connection from an event category"
    params:
      category: { type: string, pattern: "^[A-Z_]{1,32}$", required: true,
                  label: Event category,
                  description: "The event category to stop receiving on this connection, such as HDMI or MODULE." }
    send: "RemoveEvents({category})"
    expect: { contains: "!Done" }
    returns: ack

  get_device_info:
    summary: "Read the model, serial number and software version (CORIOmax) into state"
    send: "CORIOmax"
    expect: { contains: "!Done" }
    returns: ack

telemetry:
  # The unit pushes the events a connection subscribes to; the window input,
  # preset, storyboard and canvas categories are added on connecting. On
  # connecting, the model information, the active preset and the preset list
  # are read, and the Windows, Canvases, Layouts and Stbds lists: each entry
  # they list has every property read, so the reads follow the windows,
  # canvases, layouts and storyboards the unit has rather than a fixed
  # count. After that the echo of every command and the events keep them
  # current, and a preset or storyboard, which changes window properties
  # without echoing them, has the windows read again.
  subscribe:
    send:
      - "AddEvents(WINDOW)"
      - "AddEvents(PRESET)"
      - "AddEvents(STBD)"
      - "AddEvents(CANVAS)"
  poll:
    send: ["CORIOmax", "Preset.Take", "Preset.PresetList()", "Windows", "Canvases", "Layouts", "Stbds"]
  updates:
    # The lists: one line per entry, "Windows.Window1 = <...>"; each entry is read whole.
    - match: "^(?:Routing\\.)?Windows\\.Window(\\d+) ?= ?<"
      then_send: ["Window{1}"]
    - match: "^(?:Routing\\.)?Canvases\\.Canvas(\\d+) ?= ?<"
      then_send: ["Canvas{1}"]
    - match: "^(?:Routing\\.)?Layouts\\.Layout(\\d+) ?= ?<"
      then_send: ["Layout{1}"]
    - match: "^(?:Routing\\.)?Stbds\\.Stbd(\\d+) ?= ?<"
      then_send: ["Stbds.Stbd{1}"]
    - match: "^!Event WINDOW, ?INPUT, ?Window(\\d+), ?(\\S+)$"
      state: { "windows.{1}.input": "{2}" }
    - match: "^!Event PRESET, ?TAKE, ?(\\d+)$"
      state: { preset.current: "{1}" }
    # A preset or storyboard changes window properties without echoing them.
    - match: "^!Event PRESET, ?COMPLETE, ?(\\d+)$"
      state: { preset.completed: "{1}" }
      then_send: ["Windows"]
    - match: "^!Event PRESET, ?SAVE, ?(\\d+)$"
      then_send: ["Preset.PresetList()"]
    - match: "^!Event PRESET, ?REMOVE, ?(\\d+)$"
      state: { "presets.{1}": { delete: true } }
    - match: "^!Event STBD, ?ISCURRENT_CHANGED, ?Stbd(\\d+), ?([01])$"
      state: { "storyboards.{1}.current": { value: "{2}", map: { "0": false, "1": true } } }
      then_send: ["Windows"]
    - match: "^!Event CANVAS, ?PROPERTY_CHANGED, ?Canvas(\\d+), ?AudioMute, ?(On|Off)$"
      state: { "canvases.{1}.audio_mute": { value: "{2}", map: { "On": true, "Off": false } } }
    - match: "^!Event CANVAS, ?PROPERTY_CHANGED, ?Canvas(\\d+), ?AudioMode, ?(\\S+)$"
      state: { "canvases.{1}.audio_mode": "{2}" }
    - match: "^!Event CANVAS, ?PROPERTY_CHANGED, ?Canvas(\\d+), ?AudioFollowWindow, ?(?:Window)?(\\d+)$"
      state: { "canvases.{1}.audio_follow_window": "{2}" }
    - match: "^!Event CANVAS, ?PROPERTY_CHANGED, ?Canvas(\\d+), ?AudioSource, ?(\\S+)$"
      state: { "canvases.{1}.audio_source": "{2}" }
    - match: "^!Event CANVAS, ?PROPERTY_CHANGED, ?Canvas(\\d+), ?AudioVolume, ?(\\d+)$"
      state: { "canvases.{1}.audio_volume": "{2}" }
    - match: "^!Event CANVAS, ?STBDCURRENT_CHANGED, ?Canvas(\\d+), ?(\\S+?),?$"
      state: { "canvases.{1}.current_storyboard": "{2}" }
    - match: "^(?:Routing\\.)?Preset\\.Take ?= ?(\\d+)$"
      state: { preset.current: "{1}" }
    - match: "^Routing\\.Preset\\.PresetList\\[(\\d+)\\] ?= ?([^,]*),([^,]*),(\\d+)$"
      state:
        "presets.{1}.name": "{2}"
        "presets.{1}.canvas": "{3}"
        "presets.{1}.duration": "{4}"
    # preset_name and preset_duration write the preset being edited (Preset.Read), whose
    # echo names no preset: the list is read again.
    - match: "^(?:Routing\\.)?Preset\\.(?:NameRead|DurationRead) ?= ?"
      then_send: ["Preset.PresetList()"]
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.Status ?= ?(\\S+)$"
      state: { "windows.{1}.status": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.Input ?= ?(\\S+)$"
      state: { "windows.{1}.input": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.Canvas ?= ?(\\S*)$"
      state: { "windows.{1}.canvas": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.Alias ?= ?(\\S*)$"
      state: { "windows.{1}.alias": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.CanWidth ?= ?(-?\\d+)$"
      state: { "windows.{1}.width": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.CanHeight ?= ?(-?\\d+)$"
      state: { "windows.{1}.height": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.CanXCentre ?= ?(-?\\d+)$"
      state: { "windows.{1}.x": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.CanYCentre ?= ?(-?\\d+)$"
      state: { "windows.{1}.y": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.Zorder ?= ?(\\d+)$"
      state: { "windows.{1}.zorder": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.RotateDeg ?= ?(\\d+)$"
      state: { "windows.{1}.rotation": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.WDPQ ?= ?(\\d+)$"
      state: { "windows.{1}.quality": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.BdrPixWidth ?= ?(\\d+)$"
      state: { "windows.{1}.border_width": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.BdrRGB ?= ?(\\d+)$"
      state: { "windows.{1}.border_color": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.HFlip ?= ?(On|Off|Yes|No)$"
      state: { "windows.{1}.hflip": { value: "{2}", map: { "On": true, "Yes": true, "Off": false, "No": false } } }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.VFlip ?= ?(On|Off|Yes|No)$"
      state: { "windows.{1}.vflip": { value: "{2}", map: { "On": true, "Yes": true, "Off": false, "No": false } } }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.FTB ?= ?(\\d+)$"
      state: { "windows.{1}.fade": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.SCFTB ?= ?(On|Off|Yes|No)$"
      state: { "windows.{1}.animate_fade": { value: "{2}", map: { "On": true, "Yes": true, "Off": false, "No": false } } }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.SCHShrink ?= ?(On|Off|Yes|No)$"
      state: { "windows.{1}.animate_hshrink": { value: "{2}", map: { "On": true, "Yes": true, "Off": false, "No": false } } }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.SCVShrink ?= ?(On|Off|Yes|No)$"
      state: { "windows.{1}.animate_vshrink": { value: "{2}", map: { "On": true, "Yes": true, "Off": false, "No": false } } }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.SCSpin ?= ?(-?\\d+)$"
      state: { "windows.{1}.animate_spin": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.KeyingLayer ?= ?(\\d+)$"
      state: { "windows.{1}.keying_layer": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.KeyingYMin ?= ?(\\d+)$"
      state: { "windows.{1}.luma_key_min": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.KeyingYMax ?= ?(\\d+)$"
      state: { "windows.{1}.luma_key_max": "{2}" }
    - match: "^(?:Routing\\.)?(?:Windows\\.)?Window(\\d+)\\.KeyingYSoft ?= ?(\\d+)$"
      state: { "windows.{1}.luma_key_softness": "{2}" }
    - match: "^(?:Routing\\.)?(?:Canvases\\.)?Canvas(\\d+)\\.Status ?= ?(\\S+)$"
      state: { "canvases.{1}.status": "{2}" }
    - match: "^(?:Routing\\.)?(?:Canvases\\.)?Canvas(\\d+)\\.Alias ?= ?(\\S*)$"
      state: { "canvases.{1}.alias": "{2}" }
    - match: "^(?:Routing\\.)?(?:Canvases\\.)?Canvas(\\d+)\\.WindowList ?= ?(\\S*)$"
      state: { "canvases.{1}.windows": "{2}" }
    - match: "^(?:Routing\\.)?(?:Canvases\\.)?Canvas(\\d+)\\.LayoutList ?= ?(\\S*)$"
      state: { "canvases.{1}.layouts": "{2}" }
    - match: "^(?:Routing\\.)?(?:Canvases\\.)?Canvas(\\d+)\\.StbdCurrent ?= ?(\\S+)$"
      state: { "canvases.{1}.current_storyboard": "{2}" }
    - match: "^(?i:(?:Routing\\.)?(?:Canvases\\.)?Canvas)(\\d+)\\.(?i:AudioMode) ?= ?(\\S+)$"
      state: { "canvases.{1}.audio_mode": "{2}" }
    - match: "^(?:Routing\\.)?(?:Canvases\\.)?Canvas(\\d+)\\.AudioSource ?= ?(\\S+)$"
      state: { "canvases.{1}.audio_source": "{2}" }
    - match: "^(?:Routing\\.)?(?:Canvases\\.)?Canvas(\\d+)\\.AudioFollowWindow ?= ?(\\d+)$"
      state: { "canvases.{1}.audio_follow_window": "{2}" }
    - match: "^(?:Routing\\.)?(?:Canvases\\.)?Canvas(\\d+)\\.AudioMute ?= ?(On|Off)$"
      state: { "canvases.{1}.audio_mute": { value: "{2}", map: { "On": true, "Off": false } } }
    - match: "^(?:Routing\\.)?(?:Canvases\\.)?Canvas(\\d+)\\.AudioVolume ?= ?(\\d+)$"
      state: { "canvases.{1}.audio_volume": "{2}" }
    - match: "^(?:Routing\\.)?(?:Layouts\\.)?Layout(\\d+)\\.Status ?= ?(\\S+)$"
      state: { "layouts.{1}.status": "{2}" }
    - match: "^(?:Routing\\.)?(?:Layouts\\.)?Layout(\\d+)\\.Alias ?= ?(\\S*)$"
      state: { "layouts.{1}.alias": "{2}" }
    - match: "^(?:Routing\\.)?(?:Layouts\\.)?Layout(\\d+)\\.Canvas ?= ?(\\S*)$"
      state: { "layouts.{1}.canvas": "{2}" }
    - match: "^(?:Routing\\.)?(?:Layouts\\.)?Layout(\\d+)\\.CanWidth4kUnit ?= ?(-?\\d+)$"
      state: { "layouts.{1}.width": "{2}" }
    - match: "^(?:Routing\\.)?(?:Layouts\\.)?Layout(\\d+)\\.CanHeight4kUnit ?= ?(-?\\d+)$"
      state: { "layouts.{1}.height": "{2}" }
    - match: "^(?:Routing\\.)?(?:Layouts\\.)?Layout(\\d+)\\.CanXCentre ?= ?(-?\\d+)$"
      state: { "layouts.{1}.x": "{2}" }
    - match: "^(?:Routing\\.)?(?:Layouts\\.)?Layout(\\d+)\\.CanYCentre ?= ?(-?\\d+)$"
      state: { "layouts.{1}.y": "{2}" }
    - match: "^(?:Routing\\.)?(?:Layouts\\.)?Layout(\\d+)\\.StbdActive ?= ?(Yes|No)$"
      state: { "layouts.{1}.storyboard_active": { value: "{2}", map: { "Yes": true, "No": false } } }
    - match: "^(?:Routing\\.)?(?:Layouts\\.)?Layout(\\d+)\\.OutputList ?= ?(\\S*)$"
      state: { "layouts.{1}.outputs": "{2}" }
    - match: "^(?:Routing\\.)?(?:Layouts\\.)?Layout(\\d+)\\.Mode ?= ?(\\S+)$"
      state: { "layouts.{1}.mode": "{2}" }
    - match: "^(?:Routing\\.)?Stbds\\.Stbd(\\d+)\\.Name ?= ?(\\S*)$"
      state: { "storyboards.{1}.name": "{2}" }
    - match: "^(?:Routing\\.)?Stbds\\.Stbd(\\d+)\\.Canvas ?= ?(\\S*)$"
      state: { "storyboards.{1}.canvas": "{2}" }
    - match: "^(?:Routing\\.)?St(?:bd|db)s\\.Stbd(\\d+)\\.IsCurrent ?= ?(Yes|No)$"
      state: { "storyboards.{1}.current": { value: "{2}", map: { "Yes": true, "No": false } } }
    - match: "^CORIOmax\\.Model_Name ?= ?(.+)$"
      state: { device.model_name: "{1}" }
    - match: "^CORIOmax\\.Model_Number ?= ?(.+)$"
      state: { device.model_number: "{1}" }
    - match: "^CORIOmax\\.Serial_Number ?= ?(.+)$"
      state: { device.serial_number: "{1}" }
    - match: "^CORIOmax\\.Software_Version ?= ?(.+)$"
      state: { device.software_version: "{1}" }

state:
  windows.*.input: { type: string, description: "Input routed to the window, such as Slot4.In1, keyed by window number" }
  windows.*.canvas: { type: string, description: "Canvases the window is on, comma separated, or NULL" }
  windows.*.alias: { type: string, description: "Window alias, NULL when none" }
  windows.*.width: { type: int, description: "Window width on the canvas" }
  windows.*.height: { type: int, description: "Window height on the canvas" }
