spec: 1
id: turtleav-amp150
name: Turtle AV 150W Dante amplifier
vendor: Turtle AV
category: other

source:
  - title: 150W Dante Power Amp user manual, §8 (pp. 15-19)
    author: Turtle AV
    url: https://turtleav.com/download/179/user-guide/28565/150w-dante-power-amp-user-guide.pdf
    note: >
      Manufacturer-documented, free download. Serial 115200 8N1 and TCP/IP port 8000 with
      the s and r commands and their replies: system (power, auto standby, LCD, ID LED,
      trigger, baud rate, fans), input select, volume and mute (Set input: Line, Input line
      volume: 50), master member, volume and mute, output volume, mute, mix, delay and
      31-band graphic EQ, presets and their names, network and passwords; default LAN IP
      192.168.0.200; it reports its type as HDP-PA150D.

transport:
  type: line-tcp
  port: 8000
  framing: terminated
  terminator: crlf
  encoding: ascii
  timeout_ms: 3000
  reply: expected

ports:
  - {port: 8000, protocol: tcp, role: control, note: 'TCP/IP control port, changeable'}

models:
  - id: amp-150w
    name: Turtle AV 150W Dante power amplifier
    supports:
      [set_power, reboot, set_auto_standby, set_lcd, set_id_led, set_trigger, set_baud_rate,
       set_fan, select_input, set_input_volume, step_input_volume, set_input_mute,
       set_master_member, set_master_volume, step_master_volume, set_master_mute,
       set_output_volume, step_output_volume, set_output_mute, set_output_mix,
       set_output_delay, set_output_geq, set_output_geq_preset, clear_output_geq,
       recall_preset, save_preset, clear_preset, set_preset_name, set_ip_mode,
       set_ip_address, set_subnet, set_gateway, set_tcp_port, set_telnet_port, net_reboot]
    verification: none
    notes: >
      Line and Dante inputs; speaker, line and Dante outputs.

commands:
  set_power:
    summary: Power on, or off into standby
    params:
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: s power {state}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  reboot:
    summary: Reboot the amplifier; audio stops until it is back
    send: s reboot
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_auto_standby:
    summary: Set the auto standby time, or turn it off
    params:
      minutes: {type: int, min: 0, max: 120, required: true, label: Auto standby, description: 'Minutes without signal before standby, 1 to 120; 0 turns auto standby off.'}
    send: s auto stb {minutes}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_lcd:
    summary: Set when the volume LCD is lit
    params:
      mode: {type: enum, values: ['on', 'off', on 15, on 30, on 60], required: true, label: LCD, description: 'on always lit, off always dark, or on for 15, 30 or 60 seconds after use.'}
    send: s lcd {mode}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_id_led:
    summary: Set when the ID LED is lit
    params:
      mode: {type: enum, values: ['on', 'off', on 15, on 30, on 60], required: true, label: ID LED, description: 'on always lit, off always dark, or on for 15, 30 or 60 seconds.'}
    send: s idled {mode}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_trigger:
    summary: Set the trigger input that mutes the outputs
    params:
      mode: {type: enum, values: ['off', on 0, on 1], required: true, label: Trigger, description: 'off ignores the trigger; on 0 mutes the outputs at a low level (0 V), on 1 at a high level (5-12 V).'}
    send: s trigger {mode}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_baud_rate:
    summary: Set the RS-232 port's baud rate
    params:
      baud: {type: enum, values: ['115200', '57600', '38400', '19200', '9600', '4800'], required: true, label: Baud rate, description: Serial port speed in bits per second.}
    send: s rsb {baud}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_fan:
    summary: Let a fan turn on automatically, or keep it off
    params:
      fan: {type: int, min: 0, max: 2, required: true, label: Fan, description: 'Fan 1 or 2; 0 both.'}
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on lets the fan turn on as needed; off keeps it off.}
    send: s fan {fan} {state}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  select_input:
    summary: Choose the line or Dante input
    params:
      input: {type: int, min: 1, max: 2, required: true, label: Input, description: '1 line, 2 Dante.'}
    send: s input {input}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_input_volume:
    summary: Set an input's volume, 0-100
    params:
      input: {type: int, min: 0, max: 2, required: true, label: Input, description: '1 line, 2 Dante; 0 both.'}
      volume: {type: int, min: 0, max: 100, required: true, label: Volume, description: Input volume from 0 to 100.}
    send: s input {input} vol {volume}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  step_input_volume:
    summary: Raise or lower an input's volume by one step
    params:
      input: {type: int, min: 0, max: 2, required: true, label: Input, description: '1 line, 2 Dante; 0 both.'}
      direction: {type: enum, values: [+, '-'], required: true, label: Direction, description: '+ raises, - lowers.'}
    send: s input {input} vol{direction}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_input_mute:
    summary: Mute or unmute an input
    params:
      input: {type: int, min: 0, max: 2, required: true, label: Input, description: '1 line, 2 Dante; 0 both.'}
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: s input {input} mute {state}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_master_member:
    summary: Choose which outputs the master volume and mute act on
    params:
      members: {type: string, pattern: '^[01]{3}$', required: true, label: Members, description: 'Three digits, 1 to include and 0 to exclude, for the speaker, line and Dante outputs in that order, e.g. 110.'}
    send: s master member {members}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_master_volume:
    summary: Set the master volume, 0-100
    params:
      volume: {type: int, min: 0, max: 100, required: true, label: Master volume, description: Master volume from 0 to 100.}
    send: s master vol {volume}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  step_master_volume:
    summary: Raise or lower the master volume by one step
    params:
      direction: {type: enum, values: [+, '-'], required: true, label: Direction, description: '+ raises, - lowers.'}
    send: s master vol{direction}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_master_mute:
    summary: Mute or unmute the master output
    params:
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: s master mute {state}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_output_volume:
    summary: Set an output's volume, 0-100
    params:
      output: {type: int, min: 0, max: 3, required: true, label: Output, description: '1 speaker, 2 line, 3 Dante; 0 all.'}
      volume: {type: int, min: 0, max: 100, required: true, label: Volume, description: Output volume from 0 to 100.}
    send: s output {output} vol {volume}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  step_output_volume:
    summary: Raise or lower an output's volume by one step
    params:
      output: {type: int, min: 0, max: 3, required: true, label: Output, description: '1 speaker, 2 line, 3 Dante; 0 all.'}
      direction: {type: enum, values: [+, '-'], required: true, label: Direction, description: '+ raises, - lowers.'}
    send: s output {output} vol{direction}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_output_mute:
    summary: Mute or unmute an output
    params:
      output: {type: int, min: 0, max: 3, required: true, label: Output, description: '1 speaker, 2 line, 3 Dante; 0 all.'}
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: s output {output} mute {state}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_output_mix:
    summary: Set which input channels an output carries
    params:
      output: {type: int, min: 0, max: 3, required: true, label: Output, description: '1 speaker, 2 line, 3 Dante; 0 all.'}
      mix: {type: int, min: 1, max: 4, required: true, label: Mix, description: '1 stereo, 2 left, 3 right, 4 left and right summed.'}
    send: s output {output} mix {mix}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_output_delay:
    summary: Set an output's delay, 0-50 ms
    params:
      output: {type: int, min: 0, max: 3, required: true, label: Output, description: '1 speaker, 2 line, 3 Dante; 0 all.'}
      ms: {type: int, min: 0, max: 50, required: true, label: Delay, description: 'Output delay in milliseconds, 0 to 50.'}
    send: s output {output} delay {ms}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_output_geq:
    summary: Set one band of an output's 31-band graphic EQ
    params:
      output: {type: int, min: 0, max: 3, required: true, label: Output, description: '1 speaker, 2 line, 3 Dante; 0 all.'}
      band: {type: int, min: 1, max: 31, required: true, label: Band, description: 'Graphic EQ band, 1 (lowest) to 31.'}
      value: {type: int, min: 0, max: 20, required: true, label: Value, description: 'Band value 0 to 20 as the device states it in dB; 10 is the default.'}
    send: s output {output} eq {band} val {value}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_output_geq_preset:
    summary: Load a graphic EQ preset on an output
    params:
      output: {type: int, min: 0, max: 3, required: true, label: Output, description: '1 speaker, 2 line, 3 Dante; 0 all.'}
      preset: {type: int, min: 1, max: 3, required: true, label: EQ preset, description: '1 flat, 2 custom 1, 3 custom 2.'}
    send: s output {output} eq preset {preset}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  clear_output_geq:
    summary: Clear an output's graphic EQ
    params:
      output: {type: int, min: 0, max: 3, required: true, label: Output, description: '1 speaker, 2 line, 3 Dante; 0 all.'}
    send: s output {output} eq clear
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  recall_preset:
    summary: 'Recall a preset: settings change at once'
    params:
      preset: {type: int, min: 1, max: 5, required: true, label: Preset, description: Preset 1 to 5.}
    send: s preset recall {preset}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  save_preset:
    summary: Save the current settings to a preset, overwriting it
    params:
      preset: {type: int, min: 1, max: 5, required: true, label: Preset, description: Preset 1 to 5.}
    send: s preset save {preset}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  clear_preset:
    summary: Clear a preset
    params:
      preset: {type: int, min: 1, max: 5, required: true, label: Preset, description: Preset 1 to 5.}
    send: s preset clear {preset}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_preset_name:
    summary: Name a preset
    params:
      preset: {type: int, min: 1, max: 5, required: true, label: Preset, description: Preset 1 to 5.}
      name: {type: string, max_length: 16, pattern: '^[ -~]{1,16}$', required: true, label: Name, description: 'Preset name, up to 16 printable ASCII characters.'}
    send: s preset {preset} name {name}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_ip_mode:
    summary: Use a static address or DHCP; applies after net_reboot
    params:
      mode: {type: int, min: 0, max: 1, required: true, label: IP mode, description: '0 static, 1 DHCP.'}
    send: s ip mode {mode}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_ip_address:
    summary: Set the static IP address; applies after net_reboot
    params:
      address: {type: string, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', required: true, label: IP address, description: 'Static IPv4 address, e.g. 192.168.1.100.'}
    send: s ip addr {address}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_subnet:
    summary: Set the static subnet mask; applies after net_reboot
    params:
      mask: {type: string, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', required: true, label: Subnet mask, description: 'Subnet mask, e.g. 255.255.255.0.'}
    send: s subnet {mask}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_gateway:
    summary: Set the static gateway; applies after net_reboot
    params:
      gateway: {type: string, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', required: true, label: Gateway, description: 'Gateway IPv4 address, e.g. 192.168.1.1.'}
    send: s gateway {gateway}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_tcp_port:
    summary: Set the TCP/IP control port
    params:
      port: {type: int, min: 1, max: 65535, required: true, label: Port, description: 'TCP control port, 8000 by default.'}
    send: s tcp/ipport {port}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  set_telnet_port:
    summary: Set the Telnet port
    params:
      port: {type: int, min: 1, max: 65535, required: true, label: Port, description: 'Telnet port, 23 by default.'}
    send: s telnet port {port}
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

  net_reboot:
    summary: Restart the network module to apply new network settings
    send: s net reboot
    expect: {not_contains: rror}
    returns: ack
    # 150W Dante Power Amp user manual, §8

telemetry:
  poll:
    every_ms: 5000
    send:
    - r master vol
    - r master mute
    - r input
    - r input 1 vol
    - r input 2 vol
    - r input 1 mute
    - r input 2 mute
    - r output 1 vol
    - r output 2 vol
    - r output 3 vol
    - r output 1 mute
    - r output 2 mute
    - r output 3 mute
  subscribe:
    every_ms: 60000
    send:
    - r power
    - r auto stb
    - r lcd
    - r idled
    - r trigger
    - r rsb
    - r fan
    - r master member
    - r output 1 mix
    - r output 1 delay
    - r output 1 eq preset
    - r output 1 eq 1 val
