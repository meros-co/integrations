    - r output 2 mix
    - r output 2 delay
    - r output 2 eq preset
    - r output 2 eq 1 val
    - r output 2 eq 2 val
    - r output 2 eq 3 val
    - r output 2 eq 4 val
    - r output 2 eq 5 val
    - r output 2 eq 6 val
    - r output 2 eq 7 val
    - r output 2 eq 8 val
