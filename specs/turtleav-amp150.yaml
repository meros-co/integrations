    - r output 2 eq 15 val
    - r output 2 eq 16 val
    - r output 2 eq 17 val
    - r output 2 eq 18 val
    - r output 2 eq 19 val
    - r output 2 eq 20 val
    - r output 2 eq 21 val
    - r output 2 eq 22 val
    - r output 2 eq 23 val
    - r output 2 eq 24 val
    - r output 2 eq 25 val
    - r output 2 eq 26 val
    - r output 2 eq 27 val
    - r output 2 eq 28 val
    - r output 2 eq 29 val
    - r output 2 eq 30 val
    - r output 2 eq 31 val
    - r output 3 mix
    - r output 3 delay
    - r output 3 eq preset
    - r output 3 eq 1 val
    - r output 3 eq 2 val
    - r output 3 eq 3 val
    - r output 3 eq 4 val
    - r output 3 eq 5 val
    - r output 3 eq 6 val
    - r output 3 eq 7 val
    - r output 3 eq 8 val
    - r output 3 eq 9 val
    - r output 3 eq 10 val
    - r output 3 eq 11 val
    - r output 3 eq 12 val
    - r output 3 eq 13 val
    - r output 3 eq 14 val
    - r output 3 eq 15 val
    - r output 3 eq 16 val
    - r output 3 eq 17 val
    - r output 3 eq 18 val
    - r output 3 eq 19 val
    - r output 3 eq 20 val
    - r output 3 eq 21 val
    - r output 3 eq 22 val
    - r output 3 eq 23 val
    - r output 3 eq 24 val
    - r output 3 eq 25 val
    - r output 3 eq 26 val
    - r output 3 eq 27 val
    - r output 3 eq 28 val
    - r output 3 eq 29 val
    - r output 3 eq 30 val
    - r output 3 eq 31 val
    - r preset 1 name
    - r preset 2 name
    - r preset 3 name
    - r preset 4 name
    - r preset 5 name
    - r ip mode
    - r ip addr
    - r subnet
    - r gateway
    - r tcp/ipport
    - r telnet port
    - r mac addr
  updates:
    - match: '^(?:Set |Increase |Decrease )?[Mm]aster volume: (\d+)$'
      state:
        master.volume: '{1}'
    - match: '^(?:Set )?[Mm]aster mute:? (on|off)$'
      state:
        master.mute: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '^(?:Set )?[Mm]aster member: ?([01](?: ?[01])*)$'
      state:
        master.member: '{1}'
    - match: '^(?:Set )?[Ii]nput: (Line|Dante)$'
      state:
        input: '{1}'
    - match: '(?i)^(?:Set |Increase |Decrease )?input line volume: (\d+)$'
      state:
        inputs.1.volume: '{1}'
    - match: '(?i)^(?:Set )?input line mute:? (on|off)$'
      state:
        inputs.1.mute: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '(?i)^(?:Set |Increase |Decrease )?input dante volume: (\d+)$'
      state:
        inputs.2.volume: '{1}'
    - match: '(?i)^(?:Set )?input dante mute:? (on|off)$'
      state:
        inputs.2.mute: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '(?i)^(?:Set |Increase |Decrease )?output speaker volume: (\d+)$'
      state:
        outputs.1.volume: '{1}'
    - match: '(?i)^(?:Set )?output speaker mute:? (on|off)$'
      state:
        outputs.1.mute: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '(?i)^(?:Set )?output speaker mix: (Stereo|Left|Right|Left and Right)$'
      state:
        outputs.1.mix: {value: '{1}', map: {Stereo: 1, stereo: 1, Left: 2, left: 2, Right: 3, right: 3, Left and Right: 4, left and right: 4}}
    - match: '(?i)^(?:Set )?output speaker delay: (\d+) ?ms$'
      state:
        outputs.1.delay_ms: '{1}'
    - match: '(?i)^(?:Set )?output speaker GEQ index (\d+): (\d+) ?dB$'
      state:
        outputs.1.geq.{1}: '{2}'
    - match: '(?i)^(?:Set )?output speaker GEQ: (Flat|Custom1|Custom2)$'
      state:
        outputs.1.geq_preset: {value: '{1}', map: {Flat: 1, flat: 1, Custom1: 2, custom1: 2, Custom2: 3, custom2: 3}}
    - match: '(?i)^(?:Set |Increase |Decrease )?output line volume: (\d+)$'
      state:
        outputs.2.volume: '{1}'
    - match: '(?i)^(?:Set )?output line mute:? (on|off)$'
      state:
        outputs.2.mute: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '(?i)^(?:Set )?output line mix: (Stereo|Left|Right|Left and Right)$'
      state:
        outputs.2.mix: {value: '{1}', map: {Stereo: 1, stereo: 1, Left: 2, left: 2, Right: 3, right: 3, Left and Right: 4, left and right: 4}}
    - match: '(?i)^(?:Set )?output line delay: (\d+) ?ms$'
      state:
        outputs.2.delay_ms: '{1}'
    - match: '(?i)^(?:Set )?output line GEQ index (\d+): (\d+) ?dB$'
      state:
        outputs.2.geq.{1}: '{2}'
    - match: '(?i)^(?:Set )?output line GEQ: (Flat|Custom1|Custom2)$'
      state:
        outputs.2.geq_preset: {value: '{1}', map: {Flat: 1, flat: 1, Custom1: 2, custom1: 2, Custom2: 3, custom2: 3}}
    - match: '(?i)^(?:Set |Increase |Decrease )?output dante volume: (\d+)$'
      state:
        outputs.3.volume: '{1}'
    - match: '(?i)^(?:Set )?output dante mute:? (on|off)$'
      state:
        outputs.3.mute: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '(?i)^(?:Set )?output dante mix: (Stereo|Left|Right|Left and Right)$'
      state:
        outputs.3.mix: {value: '{1}', map: {Stereo: 1, stereo: 1, Left: 2, left: 2, Right: 3, right: 3, Left and Right: 4, left and right: 4}}
    - match: '(?i)^(?:Set )?output dante delay: (\d+) ?ms$'
      state:
        outputs.3.delay_ms: '{1}'
    - match: '(?i)^(?:Set )?output dante GEQ index (\d+): (\d+) ?dB$'
      state:
        outputs.3.geq.{1}: '{2}'
    - match: '(?i)^(?:Set )?output dante GEQ: (Flat|Custom1|Custom2)$'
      state:
        outputs.3.geq_preset: {value: '{1}', map: {Flat: 1, flat: 1, Custom1: 2, custom1: 2, Custom2: 3, custom2: 3}}
    - match: '(?i)^Power:? (on|off)$'
      state:
        power: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '(?i)^(?:Set )?auto standby time: (\d+) ?mins?$'
      state:
        auto_standby_min: '{1}'
    - match: '(?i)^(?:Set )?LCD light (always on|always off|on \d+s)$'
      state:
        lcd: '{1}'
    - match: '(?i)^(?:Set )?ID L[EC]D light (always on|always off|on \d+s)$'
      state:
        id_led: '{1}'
    - match: '(?i)^(?:Set )?trigger on with (high|low) level$'
      state:
        trigger: {value: '{1}', map: {high: high, High: high, low: low, Low: low}}
    - match: '(?i)^(?:Set )?trigger (off)$'
      state:
        trigger: {value: '{1}', map: {'off': 'off', 'Off': 'off'}}
    - match: '(?i)^(?:Set )?baud rate(?: to)? (\d+)$'
      state:
        baud: '{1}'
    - match: '(?i)^(?:Set )?all fan (on|off)$'
      state:
        fans_auto: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '^(?:Set )?[Pp]reset ([1-5]) name: (.*)$'
      state:
        presets.{1}.name: '{2}'
    - match: '^Recall preset ([1-5])$'
      state:
        preset.recalled: '{1}'
    - match: '(?i)^IP mode: (Static|DHCP)$'
      state:
        network.ip_mode: {value: '{1}', map: {Static: static, static: static, DHCP: dhcp, dhcp: dhcp}}
    - match: '^IP(?: address)?: ([0-9.]+)$'
      state:
        network.ip: '{1}'
    - match: '(?i)^subnet mask: ([0-9.]+)$'
      state:
        network.subnet: '{1}'
    - match: '(?i)^gateway: ([0-9.]+)$'
      state:
        network.gateway: '{1}'
    - match: '^TCP/IP port: (\d+)$'
      state:
        network.tcp_port: '{1}'
    - match: '(?i)^telnet port: (\d+)$'
      state:
        network.telnet_port: '{1}'
    - match: '^MAC: ([0-9A-Fa-f:]+)$'
      state:
        network.mac: '{1}'

state:
  power:              {type: bool, description: Amplifier powered on}
  auto_standby_min:   {type: int, unit: min, description: 'Auto standby time in minutes'}
  lcd:                {type: string, description: 'When the volume LCD is lit, as the device words it: always on, always off, on 15s'}
  id_led:             {type: string, description: 'When the ID LED is lit, as the device words it'}
  trigger:            {type: string, description: 'Trigger mute: off, low (0 V mutes) or high (5-12 V mutes)'}
  baud:               {type: int, description: RS-232 baud rate}
  fans_auto:          {type: bool, description: 'Fans turn on as needed (true) or are kept off'}
  input:              {type: string, description: 'Selected input: Line or Dante'}
  inputs.*.volume:    {type: int, description: 'Input volume 0-100; 1 line, 2 Dante'}
  inputs.*.mute:      {type: bool, description: 'Input muted; 1 line, 2 Dante'}
  master.volume:      {type: int, description: 'Master volume, 0-100'}
  master.mute:        {type: bool, description: Master output muted}
  master.member:      {type: string, description: 'Outputs the master acts on, as the device shows the digits (speaker, line, Dante; 1 included)'}
  outputs.*.volume:   {type: int, description: 'Output volume 0-100; 1 speaker, 2 line, 3 Dante'}
  outputs.*.mute:     {type: bool, description: Output muted}
  outputs.*.mix:      {type: int, description: 'Output mix: 1 stereo, 2 left, 3 right, 4 left and right'}
  outputs.*.delay_ms: {type: int, unit: ms, description: Output delay in milliseconds}
  outputs.*.geq.*:    {type: int, description: 'Graphic EQ band value 0-20, keyed by band 1-31'}
  outputs.*.geq_preset: {type: int, description: 'Graphic EQ preset: 1 flat, 2 custom 1, 3 custom 2'}
  presets.*.name:     {type: string, description: 'Preset name, keyed by preset 1-5'}
  preset.recalled:    {type: int, description: 'The preset last recalled, as the device reported it'}
  network.ip_mode:    {type: string, description: 'static or dhcp'}
  network.ip:         {type: string, description: IPv4 address}
  network.subnet:     {type: string, description: Subnet mask}
  network.gateway:    {type: string, description: Gateway}
  network.tcp_port:   {type: int, description: TCP/IP control port}
  network.telnet_port: {type: int, description: Telnet port}
  network.mac:        {type: string, description: MAC address}

quirks:
  - models: [all]
    severity: critical
    text: >
      recall_preset changes the amplifier's settings at once and reboot or power off stops
      the audio. Neither asks for confirmation. The network commands take effect after
      net_reboot or a power cycle, and a wrong address leaves the amplifier unreachable.

  - models: [all]
    severity: warning
    text: >
      Nothing is pushed. Master, input and output volumes and mutes and the selected input
      are polled every 5 seconds; every other setting the API reads (power, standby, LCD,
      ID LED, trigger, baud rate, fans, master member, output mix, delay, every graphic EQ
      band and preset, preset names and the network) is read on connecting and every
      minute. Replies to this session's commands update state at once. The documents
      state no line ending (CR LF is sent) and no login.

  - models: [all]
    severity: warning
    text: >
      Reply texts are taken from the document's examples, which show only the speaker
      output's and line input's wording (Output speaker volume: 50, Input line mute on);
      the line and Dante wordings are assumed to follow them. Some replies are documented
      as several lines (a network change adds a reminder to run net_reboot); the extra
      lines can be taken as the answers to the next queued reads, which only delays state.

  - models: [all]
    severity: info
    text: >
      Not offered: s reset and s reset all, which ask for Yes at a further prompt, and the
      admin and user password commands, which the API answers in clear text. The status
      report (r status) is a multi-line table not read into state; its amplifier mode,
      L/R inverter and EQ fields have no command of their own (an API limit).
