    summary: "Set one configuration parameter of a DMX interface"
    params:
      interface_id: { type: string, required: true, label: Interface ID, description: "The DMX interface's ID, as dmx_interfaces in state keys it." }
      parameter_name: { type: string, label: Parameter, description: "The parameter's name, as get_dmx_interface_parameters lists it." }
      value: { type: json, label: Value, description: "JSON object of the parameter's value (ObjectData); none when reading." }
    returns: ack
  set_dmx_values:
    summary: "Set DMX channels to values directly, as a named source that overrides the output"
    params:
      source: { type: string, label: Source, description: "The name of the source, which clear_dmx_values clears." }
      dmx_channels: { type: json, label: Channels, description: "JSON array of the DMX channels to set, as DMXControl numbers them." }
      dmx_values: { type: string, pattern: '^[A-Za-z0-9+/]*={0,2}$', label: Values, description: "The channels' values, one byte each in the order of channels, as base64." }
    returns: ack
  set_executor_values:
    summary: "Press or release an executor's buttons and move its fader, absolutely or by an increment"
    params:
      executor_id: { type: string, required: true, label: Executor ID, description: "The executor's ID, as executors in state keys it." }
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      button1: { type: enum, values: [NullBoolValue, "True", "False"], label: Button 1, description: "Press (True) or release (False) the executor's first button; NullBoolValue leaves it." }
      button2: { type: enum, values: [NullBoolValue, "True", "False"], label: Button 2, description: "Press (True) or release (False) the executor's second button; NullBoolValue leaves it." }
      button3: { type: enum, values: [NullBoolValue, "True", "False"], label: Button 3, description: "Press (True) or release (False) the executor's third button; NullBoolValue leaves it." }
      button4: { type: enum, values: [NullBoolValue, "True", "False"], label: Button 4, description: "Press (True) or release (False) the executor's fourth button; NullBoolValue leaves it." }
      fader_increment: { type: float, label: Fader increment, description: "How far to move the executor fader, negative for down; give this or a position." }
      fader_absolut: { type: float, label: Fader position, description: "The executor fader's new position; give this or an increment." }
      key: { type: string, label: Key, description: "The executor's key to act on, as its fader_key and button keys name them; empty for the executor itself." }
    returns: ack
  set_macro_button_state:
    summary: "Press or release a macro's button"
    params:
      macro_id: { type: string, required: true, label: Macro ID, description: "The macro's ID, as macros in state keys it." }
      button_number: { type: int, min: 0, max: 4294967295, label: Button, description: "The macro button's number, as the macro lists its buttons." }
      active: { type: bool, label: Pressed, description: "Whether the button is pressed (true) or released (false)." }
    returns: ack
  set_macro_fader_state:
    summary: "Move a macro's fader, absolutely or by an increment"
    params:
      macro_id: { type: string, required: true, label: Macro ID, description: "The macro's ID, as macros in state keys it." }
      fader_number: { type: int, min: 0, max: 4294967295, label: Fader, description: "The macro fader's number, as the macro lists its faders." }
      increment: { type: float, label: Increment, description: "How far to move the fader, negative for down; give this or a position." }
      absolut: { type: float, label: Position, description: "The fader's new position, absolute; give this or an increment." }
    returns: ack
  set_main_switch:
    summary: "Turn a main switch on or off, or toggle it"
    params:
      main_switch_id: { type: string, required: true, label: Main switch ID, description: "The main switch's ID, as main_switches in state keys it." }
      enabled_state: { type: bool, label: "On", description: "Whether the main switch is on; give this or toggle." }
      toggle: { type: bool, label: Toggle, description: "Toggle the main switch; give this or on." }
    returns: ack
  set_manual_beat:
    summary: "Set the manual beat's interval and turn it on or off"
    params:
      interval: { type: int, min: -2147483648, max: 2147483647, label: Interval, description: "The manual beat's interval, in milliseconds." }
      enabled: { type: bool, label: "On", description: "Whether the manual beat is on; used when enabled_set is true." }
      enabled_set: { type: bool, label: Set enabled, description: "Whether to set enabled." }
    returns: ack
  set_manual_beat_factor:
    summary: "Set the manual beat's factor, which multiplies its speed"
    params:
      factor: { type: float, label: Factor, description: "The manual beat's factor, multiplying its speed." }
    returns: ack
  set_master_value:
    summary: "Move a master's fader or press its button"
    params:
      master_id: { type: string, required: true, label: Master ID, description: "The master's ID, as masters in state keys it." }
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      fader: { type: json, label: Fader, description: "JSON object of the fader to move: masterId, name and increment or absolut." }
      button: { type: json, label: Button, description: "JSON object of the button to press or release: masterId, name and ButtonValue (true pressed)." }
    returns: ack
  set_parameter_value:
    summary: "Set one parameter of an object"
    params:
      id: { type: string, label: Object ID, description: "The ID of the object." }
      parameter: { type: json, label: Parameter, description: "JSON object of the parameter (GenericParameterData), as get_parameters lists it." }
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      value: { type: json, label: Value, description: "JSON object of the parameter's new value (ObjectData)." }
    returns: ack
  set_plugin_enabled:
    summary: "Enable or disable a plugin"
    params:
      plugin_id: { type: string, required: true, label: Plugin ID, description: "The plugin's ID, as plugins in state keys it." }
      enabled: { type: bool, label: Enabled, description: "Whether to enable (true) or disable (false) the plugin; ignored when reading." }
    returns: ack
  set_preview_position_mapping:
    summary: "Set the positions of devices in the position preview"
    params:
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      device_positions: { type: json, label: Positions, description: "JSON array of {deviceId, position: {pan, tilt, panset, tiltset}}." }
    returns: ack
  set_preview_position_mapping_intensity:
    summary: "Set the intensities of devices in the position preview"
    params:
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      device_intensities: { type: json, label: Intensities, description: "JSON array of {deviceId, intensity}." }
    returns: ack
  set_programmer_attachable:
    summary: "Attach an attachable (an effect) to a property in the programmer"
    params:
      group_id: { type: string, label: Group ID, description: "The ID of the group; give this or a device." }
      device_id: { type: string, label: Device ID, description: "The ID of the device; give this or a group." }
      property_id: { type: string, label: Property ID, description: "The ID of the device property." }
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      attachable: { type: json, label: Attachable, description: "JSON object of the attachable (AttachableData: id, type, name and the rest), as get_attachables lists it." }
    returns: value
  set_programmer_output:
    summary: "Set what the programmer outputs: all, filtered by a predicate, or hidden"
    params:
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      mode: { type: enum, values: [ALL, FILTER, HIDDEN], label: Output, description: "ALL, FILTER or HIDDEN; give this or a filter." }
      predicate: { type: json, label: Filter, description: "JSON object of the programmer filter: userContextId, includedDeviceIds, includedGroupIds, includedPropertyIds and destinationSources." }
    returns: ack
  set_programmer_value:
    summary: "Set a property value of a device or group in a user context's programmer"
    params:
      group_id: { type: string, label: Device or group ID, description: "The ID of the device or group whose property to set." }
      property_id: { type: string, label: Property ID, description: "The ID of the device property." }
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      dpv: { type: json, label: Value, description: "JSON object of the property value (DevicePropertyValue: doubleValue, color, position and the other kinds)." }
      fpv: { type: json, label: Fanned value, description: "JSON object of the fanned property value (FannedPropertyValue)." }
      group_handling: { type: enum, values: [CONCAT_GROUPS, GROUP_IS_DEVICE, PARALLEL_GROUPS], label: Group handling, description: "How a group's devices take the value: CONCAT_GROUPS, GROUP_IS_DEVICE or PARALLEL_GROUPS." }
      fanning_group_size: { type: int, min: -2147483648, max: 2147483647, label: Fanning group size, description: "How many devices share a fanned value." }
      relative: { type: bool, label: Relative, description: "Whether the value is relative to the current one." }
    returns: value
  set_setting:
    summary: "Set a setting's value"
    params:
      path: { type: string, required: true, label: Setting, description: "The setting's path, as get_registered_settings lists it." }
      project: { type: bool, label: Project, description: "Whether the setting is the project's (true) or the application's (false)." }
      registered: { type: bool, label: Registered, description: "Whether the setting is a registered one." }
      string_value: { type: string, label: Text value, description: "The setting's new value, for a text setting." }
      bool_value: { type: bool, label: Boolean value, description: "The setting's new value, for a Boolean setting." }
      int_value: { type: int, min: -2147483648, max: 2147483647, label: Whole number value, description: "The setting's new value, for a whole-number setting." }
      double_value: { type: float, label: Number value, description: "The setting's new value, for a number setting." }
    returns: ack
  set_user_defined_affinity_list:
    summary: "Use an item list as the user-defined affinity list of a reference object of an affinity class"
    params:
      class_name: { type: string, required: true, label: Affinity class, description: "The affinity class, as get_affinity_classes names it." }
      reference_object_id: { type: string, label: Reference object, description: "The ID of the reference object of the affinity class." }
      item_list_id: { type: string, required: true, label: Item list, description: "The ID of the item list to use as the affinity list; empty to remove it." }
    returns: ack
  start_preview_position_mapping:
    summary: "Start previewing positions and intensities on devices, for a user context"
    params:
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      devices: { type: json, label: Devices, description: "JSON array of {deviceId, intensity, position: {pan, tilt, panset, tiltset}} to preview." }
    returns: ack
  stop_preview_position_mapping:
    summary: "Stop the position preview of a user context"
    params:
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
    returns: ack
  stream_resource_data:
    summary: "Read or write a block of a resource stream that load_resource or save_resource opened (one request on a bidirectional call; the answer is every message the server sends back)"
    params:
      stream_id: { type: string, required: true, label: Stream ID, description: "The stream's ID, as load_resource or save_resource answered it." }
      bytes_to_read: { type: int, min: -2147483648, max: 2147483647, label: Bytes to read, description: "How many bytes of the stream to read; 0 to only write." }
      data_to_write: { type: string, pattern: '^[A-Za-z0-9+/]*={0,2}$', label: Data, description: "The bytes to write, as base64; empty to only read." }
      crc_value: { type: int, label: CRC, description: "The CRC of the data written, to check it." }
      close_in_backend: { type: bool, label: Close, description: "Whether to close the stream after this block." }
    returns: value
  sync_manual_beat:
    summary: "Restart the manual beat's count at the given time"
    params:
      time: { type: int, label: Time, description: "The time to restart the count at, as DMXControl counts time." }
    returns: ack
  test_dmx_interface_parameter:
    summary: "Check whether a value is valid for a DMX interface's parameter, without setting it"
    params:
      interface_id: { type: string, required: true, label: Interface ID, description: "The DMX interface's ID, as dmx_interfaces in state keys it." }
      parameter_name: { type: string, label: Parameter, description: "The parameter's name, as get_dmx_interface_parameters lists it." }
      value: { type: json, label: Value, description: "JSON object of the parameter's value (ObjectData); none when reading." }
    returns: ack
  test_parameter_value:
    summary: "Check whether a value is valid for an object's parameter, without setting it"
    params:
      id: { type: string, label: Object ID, description: "The ID of the object." }
      parameter: { type: json, label: Parameter, description: "JSON object of the parameter (GenericParameterData), as get_parameters lists it." }
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      value: { type: json, label: Value, description: "JSON object of the parameter's new value (ObjectData)." }
    returns: ack
  timecode_action:
    summary: "Play, stop, pause, record or clear a timecode show"
    params:
      timecode_id: { type: string, required: true, label: Timecode ID, description: "The timecode show's ID, as timecodes in state keys it." }
      action: { type: enum, values: [UNKNOWN_0, PLAY, STOP, PAUSE, RECORD, CLEAR], label: Action, description: "PLAY, STOP, PAUSE, RECORD or CLEAR." }
    returns: ack
  update_origin_of_programmer:
    summary: "Write the programmer's values back to where they came from (presets, cues)"
    params:
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      predicate: { type: json, label: Filter, description: "JSON object of the programmer filter: userContextId, includedDeviceIds, includedGroupIds, includedPropertyIds and destinationSources." }
      clear_programmer: { type: bool, label: Clear programmer, description: "Whether to clear the programmer afterwards." }
      dependencies: { type: json, label: Dependencies, description: "JSON object of the dependencies, as a refused update answered them, each with its solution chosen; none for the first try." }
    returns: value

state:
  polled.status: { type: int, unit: s, description: "When the poll of what no stream reports (every 5 seconds) was last answered, in Unix seconds: the polled state is as old as this" }
  session.client_name: { type: string, description: "The client name this client logged in with" }
  session.runtime_id: { type: string, description: "This client's runtime ID in the DMXControl network, made up for each start of the module" }
  session.network_id: { type: string, description: "The network ID this client logged in with" }
  umbra.client_name: { type: string, description: "Umbra's client name" }
  umbra.hostname: { type: string, description: "The host name of the computer Umbra runs on" }
  umbra.ips: { type: array, description: "Umbra's IP addresses, as text" }
  umbra.network_id: { type: string, description: "Umbra's network ID" }
  umbra.runtime_id: { type: string, description: "Umbra's runtime ID" }
  umbra.project_name: { type: string, description: "The project Umbra reports" }
  umbra.port: { type: int, description: "Umbra's broker port" }
  umbra.secure_port: { type: int, description: "Umbra's TLS broker port" }
  umbra.program_name: { type: string, description: "Umbra's program name" }
  umbra.program_version: { type: string, description: "Umbra's program version, the DMXControl version" }
  umbra.vendor: { type: string, description: "Umbra's vendor" }
  clients.*.client_name: { type: string, description: "A program of the DMXControl network (GUI, Kernel, interface broker, external tool), keyed by its runtime ID: its client name" }
  clients.*.hostname: { type: string, description: "The host name of the computer it runs on" }
  clients.*.type: { type: string, description: "The kind of program: Kernel, GUI, DMXInterfaceBroker, ExternalTool, Umbra or EClientType_Unknown" }
  clients.*.ips: { type: array, description: "Its IP addresses, as text" }
  clients.*.project_name: { type: string, description: "The project it has loaded" }
  clients.*.network_id: { type: string, description: "Its network ID" }
  clients.*.connected: { type: bool, description: "Whether it is connected to Umbra; false once it logged off, until Umbra forgets it" }
  clients.*.logoff_reason: { type: string, description: "Why it left: ClientLogoff, ClientTimeout, ClientKilled, UmbraShutdown, or none while connected" }
  clients.*.ready_to_work: { type: bool, description: "Whether it reported itself ready to work" }
  clients.*.program_name: { type: string, description: "Its program name" }
  clients.*.program_version: { type: string, description: "Its program version" }
  clients.*.vendor: { type: string, description: "Its vendor" }
  clients.*.latency_us: { type: int, unit: us, description: "Its connection latency as Umbra measured it, in microseconds" }
  beat.interval: { type: int, unit: ms, description: "The manual beat's interval" }
  beat.enabled: { type: bool, description: "Whether the manual beat is on" }
  beat.factor: { type: float, description: "The manual beat's factor, multiplying its speed" }
  beat.count: { type: int, description: "The manual beat's count, rising with each beat" }
  project.loaded: { type: bool, description: "Whether a project is loaded" }
  project.closed: { type: bool, description: "Whether the project is closed" }
  project.state: { type: string, description: "The project's state: EProjectState_UNDEFINED, _LOADING, _CLOSING, _CLOSED or _LOADED" }
  project.file_version: { type: int, description: "The loaded project's file version" }
  project.current_version: { type: object, description: "The project version loaded: guid, major, minor and revision" }
  project.dirty: { type: bool, description: "Whether the project has unsaved changes, as every program last reported, read every 10 s" }
  project.dirty_where: { type: array, description: "Which programs have unsaved changes, each {client, dirty_items}" }
  project.warning: { type: bool, description: "Whether the project has warnings, read every 10 s" }
  project.warning_where: { type: array, description: "Which programs have warnings, each {client, warning_items}" }
  global.blackout: { type: bool, description: "Whether blackout is on, read on connecting, after global_function and every 5 s" }
  global.freeze: { type: bool, description: "Whether freeze is on" }
  global.fog_state: { type: int, description: "The fog global function's state" }
  global.highlight: { type: object, description: "The highlight global function: user_context_id, id, and enabled or item_type" }
  dmx.in2out_mapping: { type: array, description: "The mapping of DMX input channels to output channels, each {in_address, out_address, mapping_mode}" }
  dmx.output.*: { type: int, description: "A DMX output channel's value, 0 to 255, keyed by channel, for the channels the settings watch" }
  dmx.input.*: { type: int, description: "A DMX input channel's value, 0 to 255, keyed by channel, for the channels the settings watch" }
  dmx.values_per_second: { type: int, description: "How many DMX values DMXControl sends per second, read every 5 s" }
  dmx.frame_rate: { type: float, unit: Hz, description: "DMXControl's DMX frame rate, read every 5 s" }
  dmx_interface_states.*.interface: { type: object, description: "A DMX interface's state, keyed by interface ID, as it changes: working, enabled and available, each present once reported" }
  dmx_interface_states.*.inputs: { type: object, description: "Its input ports' states, keyed by port: working, enabled and available" }
  dmx_interface_states.*.outputs: { type: object, description: "Its output ports' states, keyed by port: working, enabled and available" }
  dmx_interface_states.*.rdm: { type: bool, description: "Whether RDM is on, as last reported" }
  item_list_types: { type: object, description: "The kinds of item list, type to display name" }
  user_contexts.*.name: { type: string, description: "A user context, keyed by ID: its name" }
  user_contexts.*.selected_device_group: { type: string, description: "The device group selected" }
  user_contexts.*.selected_device_groups: { type: array, description: "The device groups selected" }
  user_contexts.*.selected_executor_page: { type: string, description: "The executor page selected" }
  user_contexts.*.dynamic_executor_page: { type: object, description: "The page of executors it shows, with its executor IDs" }
  user_contexts.*.selected_executor: { type: string, description: "The executor selected" }
  user_contexts.*.fixed_executors: { type: array, description: "The executors fixed so they stay when the page changes" }
  user_contexts.*.selected_timecode: { type: string, description: "The timecode show selected" }
  user_contexts.*.selected_track: { type: string, description: "The timecode track selected" }
  command_lines.*.current: { type: string, description: "A user context's command line, keyed by user context ID" }
  command_lines.*.history: { type: array, description: "Its command line history, each {command_line, message, status}" }
  settings_values.*: { type: object, description: "A setting's value, keyed by path: value (in the setting's own type), type and registered" }
  power_usage.amps.*: { type: float, unit: A, description: "The current drawn from a power source, keyed by its ID" }
  power_usage.watts.*: { type: float, unit: W, description: "The power drawn from a power source, keyed by its ID, as it changes" }
  cuelist_progress.*.cuelist_state: { type: string, description: "A cuelist's state, keyed by cuelist ID: STOPPED, PAUSED or RUNNING" }
  cuelist_progress.*.cues: { type: object, description: "Its running cues' progress, keyed by cue index: cue_id, fade_type, progress (0 to 1), text, ms_to_wait and the times left" }
  property_values.*.*: { type: object, description: "A device property's current value, keyed by device ID and property ID (DevicePropertyValue: double_value, color, position and the other kinds), published at most every 100 ms" }
  input_sink_values.*: { type: object, description: "The value an input sink this client provides was last sent, keyed by sink ID (ObjectData)" }
  connection_set_values.*: { type: array, description: "A connection set's port values as last processed, keyed by connection set ID, each {port_id, value}" }
  procedure_executions.*: { type: object, description: "A device procedure's last run, keyed by procedure ID: parent_device_id, procedure, type (STARTED, RAN_TO_COMPLETION, FAULTED, CANCELLED) and error_message" }
  programmers.*.output_mode: { type: string, description: "A user context's programmer output, keyed by user context ID: ALL, FILTER or HIDDEN, as last changed" }
  programmers.*.snapshots: { type: array, description: "Its programmer snapshots' names, as last changed" }
  programmers.*.last_change: { type: object, description: "Its programmer's last change (ProgrammerChangeMessage)" }
  monitoring.slots: { type: array, description: "DMXControl's performance counters (MonitorSlotData), read every 5 s" }
  monitoring.transfer_statistics: { type: array, description: "The traffic between DMXControl's programs by service (TransferStatisticData), read every 5 s" }
  # Collections (generated by tools/generate_dmxcontrol3.py)
  attachables.*: { type: object, description: "Each attachable (an effect or other item attachable to a device property), keyed by its id: AttachableData with its fields in snake_case; read with get_attachables on connecting, kept current from ReceiveAttachableChanges" }
  attachables.*.id: { type: string, description: "The id field of each attachable" }
  attachables.*.is_fanned_clone: { type: bool, description: "The is_fanned_clone field of each attachable" }
  attachables.*.parent_id: { type: string, description: "The parent_id field of each attachable" }
  attachables.*.type: { type: string, description: "The type field of each attachable" }
  attachables.*.name: { type: string, description: "The name field of each attachable" }
  attachables.*.attachable_group: { type: string, description: "The attachable_group field of each attachable" }
  attachables.*.attachable_sort_group: { type: string, description: "The attachable_sort_group field of each attachable" }
  attachables.*.image_file: { type: string, description: "The image_file field of each attachable" }
  attachables.*.supports_animation: { type: bool, description: "The supports_animation field of each attachable" }
  attachables.*.cardinality: { type: int, description: "The cardinality field of each attachable" }
  attachables.*.cardinality_set: { type: bool, description: "The cardinality_set field of each attachable" }
  attachables.*.disabled: { type: bool, description: "The disabled field of each attachable" }
  attachables.*.display_name: { type: string, description: "The display_name field of each attachable" }
