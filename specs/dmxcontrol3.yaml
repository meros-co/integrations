quirks:
  - models: [all]
    severity: warning
    text: >
      The session ID travels in a gRPC metadata header whose name the public repository does not give (its client
      code takes the headers from its host program). The session_header setting names it, sessionid by default,
      inferred; a wrong name shows as calls refused UNAUTHENTICATED or PERMISSION_DENIED after a successful login.
  - models: [all]
    severity: info
    text: >
      Umbra drops a client that does not answer its pings for about five minutes. The module keeps the Ping call
      open on every connection, sends a ping every 5 s and answers Umbra's, whether or not the device is monitored;
      an HTTP/2 PING every 5 s is its liveness check and round-trip time, and a connection that answers none for
      15 s is opened again, after 1 s doubling to 30 s.
  - models: [all]
    severity: info
    text: >
      Opened for commands only, the module logs in, reports itself ready and keeps the ping call, and opens no
      change stream and reads no state; command answers still reach the caller.
  - models: [all]
    severity: info
    text: >
      Commands are DMXControl's own methods, one each, their parameters the request's fields in snake_case and
      nested messages as JSON objects with the fields of the .proto file (either spelling). A command answered by
      ConfirmedResponse fails when ok is false, with the message; a deletion or other answer whose error choice is
      set fails with it; any other answer is returned as the decoded message. Enums take and give the value names
      of the .proto file (STOPPED, RUNNING, NullBoolValue).
  - models: [all]
    severity: info
    text: >
      Get-style methods that take a GetRequest read the object named by its requestId (the reference client reads
      a program by its runtime ID that way); the id parameter fills it. What each method takes there besides
      get_client_program_info is inferred from the method's name.
  - models: [all]
    severity: warning
    text: >
      Many commands act in a user context (an operator's selection, programmer and pages). DMXControl's own
      reference to user contexts says Umbra fills it in (FixExecutorsRequest); a command given none acts in the one
      Umbra assigns this client. bind_user_context binds one by user name and password hash, whose hashing the
      repository does not describe.
  - models: [all]
    severity: critical
    text: >
      load_project_version, close_project_version and import_project replace or close the show running on every
      program of the DMXControl network; delete_* commands, reset_application_settings and all_cuelist_action
      (STOP) cannot be undone live; global_function with blackout or freeze set changes every output at once.
  - models: [all]
    severity: info
    text: >
      Changes the streams report without the object's data (attachables, projects, a cue, a timecode action node)
      are read again: the whole list, the cue's cuelist or the action node's track. A change stream that ends is
      opened again after 1 s.
  - models: [all]
    severity: info
    text: >
      Property values are watched for every property of every device's beams (DevicePropertyChangeRequest with
      their IDs), cuelist progress for every cuelist, connection set values for every connection set, and DMX
      values for the channel ranges the settings give; each subscription is sent again when its list changes.
      What the IDs and channel numbers mean there is inferred from the field names.

commands:
  add_children_to_track:
    summary: "Add children (cuelists, executors, sounds) to a timecode track at a time"
    params:
      track_id: { type: string, required: true, label: Track ID, description: "The track's ID, as tracks in state keys it." }
      children_ids: { type: json, label: Children, description: "JSON array of the IDs of the children to add." }
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      ticks: { type: int, label: Position, description: "Where to add them on the track, in ticks." }
    returns: ack
  add_dmx_interface:
    summary: "Add a DMX interface to the project"
    params:
      interface: { type: json, label: Interface, description: "JSON object of the interface (DMXInterfaceMetadata), as get_available_dmx_interfaces lists it." }
    returns: value
  add_programmer_cue:
    summary: "Store the programmer into a cuelist as a cue: added, inserted, replacing, merged, appended or subtracted"
    params:
      cuelist_id: { type: string, required: true, label: Cuelist ID, description: "The cuelist's ID, as cuelists in state keys it." }
      user_context_id: { type: string, label: User context, description: "The user context (one operator's selection, programmer and pages) the command acts in, as bind_user_context returns it; empty for the one Umbra assigns." }
      predicate: { type: json, label: Filter, description: "JSON object of the programmer filter: userContextId, includedDeviceIds, includedGroupIds, includedPropertyIds and destinationSources." }
      type: { type: enum, values: ["NONE", ADD, INSERT, REPLACE, MERGE, APPEND, SUBTRACT], label: How, description: "ADD, INSERT, REPLACE, MERGE, APPEND or SUBTRACT." }
      index: { type: int, min: -2147483648, max: 2147483647, label: Index, description: "The place in the cuelist, from 0." }
      trigger_value: { type: json, label: Trigger, description: "JSON object {trigger, value}: the trigger, as get_cue_triggers names it, and its value." }
    returns: ack
  all_cuelist_action:
    summary: "Stop every cuelist"
    params:
      action: { type: enum, values: ["NONE", STOP], label: Action, description: "STOP: stop every cuelist." }
    returns: value
  bind_user_context:
    summary: "Get a user context for a user name and password hash, for commands that act in one"
    params:
      username: { type: string, label: User, description: "The user's name in DMXControl's user management." }
      password_hash: { type: string, label: Password hash, description: "The user's password, hashed as DMXControl's user management stores it." }
    returns: value
  can_attach_attachable_to:
    summary: "Ask which properties of a device or group an attachable can be attached to"
    params:
      device_id: { type: string, label: Device ID, description: "The device to check; give this or a group." }
      device_group_id: { type: string, label: Group ID, description: "The group to check; give this or a device." }
      property_id: { type: string, label: Property ID, description: "A property to check; empty for every property." }
      attachable: { type: json, label: Attachable, description: "JSON object of the attachable (AttachableData: id, type, name and the rest), as get_attachables lists it." }
    returns: value
  can_attach_preset_to:
    summary: "Ask which properties of a device or group a preset can be applied to"
    params:
      device_id: { type: string, label: Device ID, description: "The device to check; give this or a group." }
      device_group_id: { type: string, label: Group ID, description: "The group to check; give this or a device." }
      preset_id: { type: string, required: true, label: Preset ID, description: "The preset's ID, as presets in state keys it." }
    returns: value
  change_macro_board_profile:
    summary: "Rename or renumber a macro board profile, or press and release its buttons"
    params:
      profile_id: { type: string, required: true, label: Profile ID, description: "The macro board profile's ID, as macro_board_profiles in state keys it." }
      name: { type: string, label: Name, description: "The profile's new name." }
      number: { type: int, min: 0, max: 4294967295, label: Number, description: "The profile's new number." }
      button_pressed: { type: json, label: Button presses, description: "JSON array of button presses, each {x, y, pressed}: the button's column and row from 0, and pressed or released." }
    returns: ack
  clear_dmx_values:
    summary: "Clear the values a named source set with set_dmx_values"
    params:
      source: { type: string, label: Source, description: "The name of the source, which clear_dmx_values clears." }
    returns: ack
  close_project_version:
    summary: "Close the loaded project; the answer is every status message up to the end (a server-streaming call)"
    returns: value
  control_client:
    summary: "Ask another program in the DMXControl network to shut down, show or hide itself"
    params:
      source: { type: json, label: Source, description: "JSON object of this client's information (ClientInfo); filled in when left out." }
      control_client_runtime_id: { type: string, label: Program, description: "The runtime ID of the program to control, as clients in state keys it." }
      shutdown_action: { type: enum, values: [EClientShutdownAction_NONE, EClientShutdownAction_NOW, EClientShutdownAction_NO_OTHER_CLIENT], label: Shutdown, description: "EClientShutdownAction_NOW, or EClientShutdownAction_NO_OTHER_CLIENT to shut down only when no other program is connected." }
      show_hide_action: { type: enum, values: [EShowHideProcess_NONE, EShowHideProcess_SHOW, EShowHideProcess_HIDE], label: Show or hide, description: "EShowHideProcess_SHOW or EShowHideProcess_HIDE; give this or a shutdown action." }
    returns: ack
  control_player_thread:
    summary: "Play, stop, pause or buffer an audio file on a player, and set its volume, balance, position and sound output"
    params:
      audio_file: { type: string, label: Audio file, description: "The audio file to play, by its resource name." }
      player_thread_id: { type: string, label: Player ID, description: "The audio player's ID, as audio_players in state keys it; empty for a new player." }
      play_mode: { type: enum, values: ["None", Play, Stop, Pause, Buffer], label: Play mode, description: "Play, Stop, Pause or Buffer; None leaves the playback as it is." }
      balance: { type: float, label: Balance, description: "The player's balance, from left to right; used when balance_set is true." }
      balance_set: { type: bool, label: Set balance, description: "Whether to set the balance." }
      volume: { type: float, label: Volume, description: "The player's volume; used when volume_set is true." }
      volume_set: { type: bool, label: Set volume, description: "Whether to set the volume." }
      time: { type: int, label: Time, description: "The player's position, in milliseconds; used when time_set is true." }
      time_set: { type: bool, label: Set time, description: "Whether to set the position." }
      sound_output_info: { type: json, label: Sound output, description: "JSON object of the sound output {guid, description, moduleName}, as sound_outputs lists it." }
      sound_output_info_set: { type: bool, label: Set sound output, description: "Whether to set the sound output." }
    returns: ack
  copy_cue:
    summary: "Copy a cue to a place in the same or another cuelist"
    params:
      parent_container_id: { type: string, label: Cuelist ID, description: "The ID of the cuelist the cue is in." }
      cue_id: { type: string, required: true, label: Cue ID, description: "The cue's ID, as its cuelist lists its cues." }
      target_parent_container_id: { type: string, label: Target cuelist, description: "The ID of the cuelist to copy into." }
      target_index: { type: int, min: -2147483648, max: 2147483647, label: Target index, description: "The place in the target cuelist, from 0." }
      copy_name_template: { type: string, label: Name, description: "The copy's name, or a template for it." }
    returns: ack
  copy_programmer_values:
    summary: "Copy programmer values from one user context or group to another"
    params:
      from_user_context_id: { type: string, label: From user context, description: "The user context to copy from." }
      from_group_id: { type: string, label: From group, description: "The group whose values to copy; empty for every group." }
      target_user_context_id: { type: string, label: To user context, description: "The user context to copy to." }
      target_group_id: { type: string, label: To group, description: "The group to copy them to; empty for the same group." }
    returns: ack
  create_bank:
    summary: "Create an input bank, empty or as a copy of another"
    params:
      copy_from_bank: { type: string, label: Copy from, description: "The ID of a bank to copy; empty for an empty bank." }
      bank_name_template: { type: string, label: Name, description: "The new bank's name, or a template for it." }
    returns: value
  create_connection_set:
    summary: "Create an input connection set (a graph linking input sources to sinks), in a bank"
    params:
      copy_from_connection_set: { type: string, label: Copy from, description: "The ID of a connection set to copy; empty for an empty one." }
      target_bank_id: { type: string, label: Bank, description: "The ID of the bank to create it in." }
      connection_set_name_template: { type: string, label: Name, description: "The new connection set's name, or a template for it." }
      source_or_element_id: { type: string, label: Source, description: "The ID of the source (or source element) to connect." }
      sink_or_element_id: { type: string, label: Sink, description: "The ID of the sink (or sink element) to connect." }
      add_feedback: { type: bool, label: Add feedback, description: "Whether to also connect the sink's feedback back to the source." }
    returns: value
  create_cuelist:
    summary: "Create a cuelist, empty or as a copy of another"
    params:
      copy_from_cuelist: { type: string, label: Copy from, description: "The ID of a cuelist to copy; empty for an empty cuelist." }
      cuelist_name_template: { type: string, label: Name, description: "The new cuelist's name, or a template for it." }
    returns: ack
  create_cuelist_group:
    summary: "Create a cuelist group, empty or as a copy of another"
    params:
      copy_from_group: { type: string, label: Copy from, description: "The ID of a group to copy; empty for an empty group." }
      group_name_template: { type: string, label: Group name, description: "The name of a new group for the devices, or a template for it; give this or an existing group." }
    returns: ack
  create_device_group:
    summary: "Create a device group, empty or as a copy of another"
    params:
      copy_from_group: { type: string, label: Copy from, description: "The ID of a group to copy; empty for an empty group." }
