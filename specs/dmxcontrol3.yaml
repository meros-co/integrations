spec: 1
id: dmxcontrol3
name: DMXControl 3
vendor: DMXControl Projects
category: lighting
implementation: native
reason: >
  DMXControl 3 (3.3 and later) talks gRPC: protobuf messages over HTTP/2, through its broker, Umbra. A client logs
  in for a session ID that every later call carries in its metadata, must report itself ready, must keep a
  bidirectional ping call open (Umbra drops a client after about five minutes without it), and learns of changes
  through dozens of server-streaming calls, some of them bidirectional with a subscription it sends. None of that
  is text or request-and-reply the spec format can express.

source:
  - title: "DMXControl 3 Network Interface (protobuf definitions and C# connection client), version 3.3.2"
    author: DMXControl Projects e.V.
    url: https://github.com/DMXControl/DMXControl3-Network-Interface
    note: >
      Tag v3.3.2, commit b7330950d5 (2026-05-15). The official repository of DMXControl 3's network interface, one commit per release. proto/: every service,
      method, message and enum; the commands, parameters and state here are generated from it by
      tools/generate_dmxcontrol3.py (read as documentation; nothing of it is stored here). Common/UmbraClientService.proto:
      ClientService.Login and Logoff, ConnectedClientService (ReportReadyToWork mandatory once after connecting,
      Ping mandatory or Umbra drops the client after about 5 minutes, SendBroadcast, ReceiveClientChanges),
      DMXCNetService (GetUmbraNetworkInfo, callable without logging in). Common/Types/UmbraServiceTypes.proto: the
      login answer's return codes and session ID, the session ID being in a header field (UmbraLogoffRequest's
      reserved field 3), and UmbraUdpBroadcast, the discovery datagram. csharp/src/NetConstants.cs: discovery on
      UDP 17474 to multicast group 225.68.67.3, Umbra on TCP 17475 and TLS on 17476, messages up to 50 MB.
      csharp/src/UmbraConnectionClient.cs: the login with a 3 s timeout, its session ID refused when it holds a
      character outside printable ASCII, NoError and AlreadyLoggedIn accepted, PERMISSION_DENIED as access denied;
      ReportReadyToWork; a ping sent every 5 s with a rising counter and the client name, and every ping from
      another name answered with this client's name as responder; GetClientProgramInfo with the runtime ID in
      GetRequest's requestId. csharp/src/UmbraDiscoveryClient.cs and UdpListener.cs: each datagram is one
      UmbraUdpBroadcast protobuf message, nothing around it, joined on every IPv4 interface. The repository
      carries no licence file; it was read for these facts only.
  - title: "DMXControl 3 manual: Netzwerk-Konzept (network concept) and Umbra"
    author: DMXControl Projects e.V.
    url: https://wiki.dmxcontrol.de/index.php?title=Netzwerk-Konzept_DMXC3
    note: >
      The GUI, the Kernel (which computes the output and drives the interfaces) and Umbra (which coordinates all
      network communication); a session ID of ASCII characters only; ports 17474 UDP (discovery), 17475 TCP
      (network broker) and 17476 TCP (broker over TLS). The Umbra page (index.php?title=Umbra_DMXC3): programs with
      the same network ID connect to each other automatically, the network ID defaulting to the PC's name; Umbra
      must not be closed during a show, or the GUI and other clients lose the Kernel.
  - title: "gRPC over HTTP2 (PROTOCOL-HTTP2.md) and status codes (statuscodes.md)"
    author: gRPC Authors
    url: https://github.com/grpc/grpc/blob/master/doc/PROTOCOL-HTTP2.md
    note: >
      Requests as HTTP/2 POSTs to /package.Service/Method with content-type application/grpc and te trailers,
      length-prefixed messages, grpc-status and grpc-message trailers, trailers-only answers, and the mapping of
      HTTP statuses and stream resets to status codes; implemented by the core's gRPC client.
  - title: "RFC 9113 HTTP/2; RFC 7541 HPACK; Protocol Buffers encoding"
    author: IETF; Google
    url: https://www.rfc-editor.org/rfc/rfc9113
    note: >
      The core's HTTP/2 client (frames, settings, flow control, ping), header compression (static table and
      Huffman code of RFC 7541 Appendix A and B), and the protobuf wire format (protobuf.dev/programming-guides/encoding).

settings:
  scheme: { type: enum, values: [tcp, tls], default: tcp, label: Connection, description: "tcp connects to Umbra's plain port (17475), tls to its TLS port (17476)." }
  accept_invalid_certs: { type: bool, default: true, label: Accept self-signed certificates, description: "With tls, accept Umbra's certificate when it is self-signed or does not name the host; the link is encrypted but Umbra not authenticated." }
  client_name: { type: string, max_length: 256, default: Meros, label: Client name, description: "The name this client logs in with, as DMXControl's network explorer lists it." }
  network_id: { type: string, max_length: 256, default: "", label: Network ID, description: "The DMXControl network ID to log in with; empty takes Umbra's own, read from it before logging in." }
  session_header: { type: string, max_length: 64, pattern: "^[a-z0-9][a-z0-9_.-]*$", default: sessionid, label: Session header, description: "The gRPC metadata key the session ID is sent in on every call after logging in, in lower case." }
  timeout_ms: { type: int, min: 100, max: 600000, default: 10000, label: Timeout, description: "Milliseconds to wait for the answer to a command before failing it; calls that stream their answer have none." }
  watch_property_values: { type: bool, default: true, label: Property values, description: "Whether to keep every device property's value current in property_values, published at most every 100 ms; off reads none." }
  dmx_output_start: { type: int, min: 0, max: 2147483647, default: 0, label: First DMX output channel, description: "The first DMX output channel kept current in dmx.output; with the last at 0, none is." }
  dmx_output_stop: { type: int, min: 0, max: 2147483647, default: 0, label: Last DMX output channel, description: "The last DMX output channel kept current in dmx.output; 0 keeps none." }
  dmx_input_start: { type: int, min: 0, max: 2147483647, default: 0, label: First DMX input channel, description: "The first DMX input channel kept current in dmx.input; with the last at 0, none is." }
  dmx_input_stop: { type: int, min: 0, max: 2147483647, default: 0, label: Last DMX input channel, description: "The last DMX input channel kept current in dmx.input; 0 keeps none." }

ports:
  - { port: 17475, protocol: tcp, role: control, when: "scheme tcp", note: "Umbra, the network broker: gRPC over HTTP/2" }
  - { port: 17476, protocol: tls, role: control, when: "scheme tls", note: "Umbra over TLS: gRPC over HTTP/2 with ALPN h2" }
  - { port: 17474, protocol: udp, role: discovery, listener: core, note: "Umbra's discovery datagrams, multicast to 225.68.67.3" }

