commands:
  set_power:
    summary: "Switch the frame on or to standby (Dev.Power=1 or 0); a frame already in that state is success too"
    params:
      powered: { type: bool, required: true, label: Power, description: "On powers the frame up, off puts it in standby." }
    returns: ack
  get_power:
    summary: "Read the desired power state (Dev.Power?): 1 on, 0 standby"
    returns: value
  get_model_name:
    summary: "Read the frame's model name (Dev.ModelName?), e.g. D80:4L or 20K44"
    returns: value
  get_bundle_version:
    summary: "Read the firmware bundle (.lkc) version (Dev.BundleVer?)"
    returns: value
  get_hardware_id:
    summary: "Read the frame id (Dev.Network.ID?), xxxxxxxx:xxxxxxxx"
    returns: value
  get_preset_name:
    summary: "Read a stored frame preset's name (Dev.Preset.Name?)"
    params:
      preset: &preset { type: int, min: 1, max: 100, required: true, label: Preset,
                        description: "Frame preset number, 1 to 100." }
    returns: value
  recall_preset:
    summary: "Recall a frame preset (Dev.Preset.Recall!); answered once every DSP parameter is set"
    params:
      preset: *preset
    returns: ack
  store_preset:
    summary: "Store the current configuration as a frame preset (Dev.Preset.Store!), overwriting what is there"
    params:
      preset: *preset
      name: { type: string, required: true, max_length: 64, pattern: "^[ -~]+$", label: Name,
              description: "Preset name, up to 64 printable ASCII characters." }
    returns: ack
  set_frame_label:
    summary: "Set the frame label (Dev.FrameLabel=)"
    params:
      label: { type: string, required: true, max_length: 30, pattern: "^[ -~]*$", label: Label,
               description: "Frame label, up to 30 printable ASCII characters." }
    returns: ack
  set_redundancy:
    summary: "Switch dual network redundancy (Dev.Network.Redund=)"
    params:
      enabled: &enabled { type: bool, required: true, label: Enabled, description: "On enables it, off disables it." }
    returns: ack
  factory_reset:
    summary: "Reset the frame to factory settings (Dev.Reset.Factory!)"
    returns: ack
  soft_reset:
    summary: "Reset the processing to defaults (Dev.Reset.Soft!)"
    returns: ack
  reset_to_contour:
    summary: "Reset the processing to Contour mode (Dev.Reset.Contour!, LM firmware 1.00)"
    returns: ack
  reset_to_mesa:
    summary: "Reset the processing to Mesa mode (Dev.Reset.Mesa!, LM firmware 1.00)"
    returns: ack
  set_iso_float:
    summary: "Set the ISO-float setting (Dev.IsoFloat=): floating or grounded"
    params:
      grounded: &grounded { type: bool, required: true, label: Grounded, description: "On grounds, off floats." }
    returns: ack
  set_iso_float_inputs:
    summary: "Set the inputs floating or grounded (Dev.IsoFloatInputs=)"
    params:
      grounded: *grounded
    returns: ack
  set_iso_float_outputs:
    summary: "Set the outputs floating or grounded (Dev.IsoFloatOutputs=)"
    params:
      grounded: *grounded
    returns: ack
  set_aes_termination:
    summary: "Terminate the AES loop or leave it unterminated (Dev.AesLoopTermination=)"
    params:
      terminated: { type: bool, required: true, label: Terminated, description: "On terminates the AES loop, off leaves it unterminated." }
    returns: ack
  set_breaker_current:
    summary: "Set the breaker emulation's nominal mains current (Dev.Fuse.NominalCurrent=)"
    params:
      current_a: { type: float, min: 1, max: 32, required: true, label: Current,
                   description: "Nominal mains breaker current in A, one decimal; 5-32 in DLM v3.4, 1-32 from Lake Controller 7 on D Series and PLM+." }
    returns: ack
  set_breaker_type:
    summary: "Set the breaker emulation type (Dev.Fuse.Type=)"
    params:
      type: { type: enum, values: [conservative, fast, universal], required: true, label: Breaker type,
              description: "Conservative, fast or universal breaker emulation." }
    returns: ack
  set_latency_match:
    summary: "Switch latency match mode (Dev.LatencyMatch=)"
    params:
      enabled: *enabled
    returns: ack
  get_latency:
    summary: "Read a power channel's total latency, amplifier and Lake (Dev.Latency?), in ms"
    params:
      power_channel: &power_channel { type: int, min: 1, max: 4, required: true, label: Power channel,
                                      description: "Amplifier output channel, 1 to 4." }
    returns: value
  get_route:
    summary: "Read which power outputs a module's processing channel feeds (Dev.Route?): X for routed, per output"
    params:
      module: &module_req { type: enum, values: [A, B, C, D], required: true, label: Module,
                            description: "Lake module: A-D on D Series and PLM+, A-B on PLM and LM." }
      channel: &channel_req { type: int, min: 1, max: 6, required: true, label: Channel,
                              description: "Module output (processing) channel, 1 to 6." }
    returns: value
  get_bridge_mode:
    summary: "Read whether a channel pair is bridged (Dev.BridgeMode?)"
    params:
      pair: { type: int, min: 1, max: 2, required: true, label: Channel pair, description: "Power channel pair, 1 (channels 1-2) or 2 (3-4)." }
    returns: value
  set_load_speakers:
    summary: "Set the number of loudspeakers on a power channel, for load monitoring (Dev.Load.Speakers=)"
    params:
      power_channel: *power_channel
      count: { type: int, min: 1, max: 4, required: true, label: Speakers, description: "Loudspeakers connected to the channel, 1 to 4." }
    returns: ack
  set_power_channel_attenuation:
    summary: "Set a power channel's attenuation (Dev.Pwr.Attenuation=)"
    params:
      power_channel: *power_channel
      attenuation_db: { type: float, min: -100, max: 0, required: true, label: Attenuation,
                        description: "Attenuation in dB, -100 to 0 in 0.25 dB steps." }
    returns: ack
  set_power_channel_mute:
    summary: "Mute or unmute a power channel (Dev.Pwr.Mute=)"
    params:
      power_channel: *power_channel
      muted: &muted { type: bool, required: true, label: Mute, description: "On mutes, off unmutes." }
    returns: ack
  set_gpi_config:
    summary: "Set what a GPI does when closed and opened (Dev.GPI.Config=); both actions of one kind"
    params:
      gpi: &gpi { type: int, min: 1, max: 2, required: true, label: GPI, description: "General purpose input, 1 or 2." }
      closed_action: &gpi_action { type: enum, required: true, label: Action when closed,
                                   values: [ToggleMute, Mute, Unmute, ToggleStandby, Standby, "On", Recall99, Recall100, NoAction],
                                   description: "Protective mute (ToggleMute, Mute, Unmute), standby (ToggleStandby, Standby, On), preset recall (Recall99, Recall100), or NoAction." }
      opened_action: { type: enum, required: true, label: Action when opened,
                       values: [ToggleMute, Mute, Unmute, ToggleStandby, Standby, "On", Recall99, Recall100, NoAction],
                       description: "As the closed action, and of the same kind." }
    returns: ack
  get_gpi_state:
    summary: "Read a GPI (Dev.GPI.State?): Open or Closed"
    params:
      gpi: *gpi
    returns: value
  set_gpo_config:
    summary: "Set what a GPO indicates when closed (Dev.GPO.Config=)"
    params:
      gpo: &gpo { type: int, min: 1, max: 2, required: true, label: GPO, description: "General purpose output, 1 or 2." }
      indication: { type: enum, required: true, label: Indication,
                    values: [Muted, Unmuted, Standby, "On", NoFault, Fault, NotReady, Ready, NoInd],
                    description: "The state the output closes on: muted or unmuted, standby or on, fault or none, ready or not, or no indication." }
    returns: ack
  get_gpo_state:
    summary: "Read a GPO (Dev.GPO.State?): Open or Closed"
    params:
      gpo: *gpo
    returns: value
  set_dante_break_in:
    summary: "Send an input or a voltage or current probe out on a Dante transmitter channel (Dev.Dante.BreakIn=)"
    params:
      transmitter: { type: int, min: 1, max: 2, required: true, label: Dante transmitter, description: "Dante transmit channel, 1 or 2." }
      source: { type: enum, values: [Analog, AES, Probe, Empty], required: true, label: Source,
                description: "An analog or AES input, an amplifier probe, or nothing." }
      channel: { type: int, min: 1, max: 2, default: 1, label: Channel, description: "Input or probe channel, 1 or 2." }
      probe: { type: enum, values: [U, I], default: U, label: Probe, description: "For a probe: U for voltage, I for current." }
      power_channel: { type: int, min: 1, max: 4, default: 1, label: Power channel, description: "For a probe: the amplifier channel probed, 1 to 4." }
    returns: ack
  set_output_route_lm:
    summary: "Route a source to the LM's analog, AES or Dante outputs (Dev.Out.Route=), one position per output"
    params:
      source: { type: enum, values: [PC, Analog, AES, Dante, Router], required: true, label: Source,
                description: "A processing channel (PC), an analog, AES or Dante input, or an input router." }
      channel: { type: int, min: 1, max: 6, required: true, label: Channel,
                 description: "Source channel: 1-6 for PC and Router, 1-2 for Analog, 1-4 for AES and Dante." }
      output_type: { type: enum, values: [Analog, AES, Dante], required: true, label: Output type,
                     description: "The outputs routed: the six analog, or the eight AES or Dante outputs." }
      outputs: { type: string, required: true, pattern: "^[X-]{6}([X-]{2})?$", label: Outputs,
                 description: "One position per output, X routed and - not: six for Analog, eight for AES and Dante, e.g. XX----." }
    returns: ack
  set_router_input:
    summary: >
      Set one priority of an input router (Dev.Router.InputTypSel=): the source type, its channel and optionally its
      sensitivity; an analog source at a priority needs every lower priority Empty
    params:
      input: &router_input { type: int, min: 1, max: 8, required: true, label: Router input,
                             description: "Input router: 1-2 on PLM, 1-4 on D Series and PLM+, 1-8 on LM." }
      priority: { type: int, min: 1, max: 4, required: true, label: Priority, description: "Priority slot, 1 (highest) to 4." }
      type: { type: enum, values: [Analog, AES, Dante, Empty], required: true, label: Source type,
              description: "Analog, AES or Dante input, or Empty." }
      channel: { type: int, min: 1, max: 8, required: true, label: Channel,
                 description: "Source channel: analog 1-2, AES 1-4, Dante 1-8 (D Series and PLM+)." }
      sensitivity: { type: float, min: -100, max: 26, label: Sensitivity,
                     description: "12 or 26 dBu for analog, -100 to 15 dB for AES and Dante; 26 dBu and 0 dB when not given." }
    returns: ack
  get_router_input:
    summary: "Read one priority of an input router (Dev.Router.InputTypSel?): type, channel, sensitivity and Dante name"
    params:
      input: *router_input
      priority: { type: int, min: 1, max: 4, required: true, label: Priority, description: "Priority slot, 1 (highest) to 4." }
    returns: value
  force_input_priority:
    summary: "Force an input router to one priority, or back to automatic selection (Dev.Router.ForceInputPriority=)"
    params:
      input: *router_input
      priority: { type: int, min: 0, max: 4, required: true, label: Priority, description: "0 selects automatically by priority, 1-4 forces that priority." }
    returns: ack
  set_router_input_mute:
    summary: "Mute or unmute an input router (Dev.Router.InputMute=)"
    params:
      input: *router_input
      muted: *muted
    returns: ack
  get_input_sample_rate:
    summary: "Read an AES (or on LM, Dante) input's sample rate (Dev.Route.InputSR?), in kHz; 00.0 without input"
    params:
      type: { type: enum, values: [AES, Dante], required: true, label: Input type, description: "AES, or Dante on LM." }
      channel: { type: int, min: 1, max: 8, required: true, label: Channel, description: "Input channel: 1-2 on PLM, 1-4 on D Series and PLM+ and LM, 1-8 for AES on LM 44." }
    returns: value
  get_meters:
    summary: "Read the full meter data now (Dev.MD.FullBin), decoded as under state meters; the frame must be on"
    returns: value
  get_no_faults:
    summary: "Read whether any fault is present (Dev.MD.NoFaults?): 1 none, 0 faults; the frame must be on"
    returns: value
  set_load_pilot:
    summary: "Switch LoadPilot's pilot tones on a power channel (Dev.LoadPilot.Enable=)"
    params:
      power_channel: *power_channel
      enabled: *enabled
    returns: ack
  get_load_pilot_readings:
    summary: "Read LoadPilot's last impedances (ohm) and currents (mA) of both tones on a power channel (Dev.LoadPilot.Readings?)"
    params:
      power_channel: *power_channel
    returns: value
  set_load_pilot_signal:
    summary: "Set LoadPilot's tone amplitudes on a power channel (Dev.LoadPilot.Signal=); the tones are fixed at 10 Hz and 24 kHz"
    params:
      power_channel: *power_channel
      tone_1_amplitude_v: { type: float, min: 0, max: 2, required: true, label: Tone 1 amplitude, description: "10 Hz tone amplitude in V, 0 to 2, three decimals." }
      tone_2_amplitude_v: { type: float, min: 0, max: 2, required: true, label: Tone 2 amplitude, description: "24 kHz tone amplitude in V, 0 to 2, three decimals." }
    returns: ack
  set_load_pilot_thresholds:
    summary: "Set LoadPilot's impedance thresholds on a power channel (Dev.LoadPilot.Threshold=)"
    params:
      power_channel: *power_channel
      tone_1_lower_ohm: &ohm { type: float, min: 0, max: 10000, required: true, label: Tone 1 lower threshold, description: "Impedance in ohm, 0 to 10000, two decimals." }
      tone_2_lower_ohm: { type: float, min: 0, max: 10000, required: true, label: Tone 2 lower threshold, description: "Impedance in ohm, 0 to 10000, two decimals." }
      tone_1_upper_ohm: { type: float, min: 0, max: 10000, required: true, label: Tone 1 upper threshold, description: "Impedance in ohm, 0 to 10000, two decimals." }
      tone_2_upper_ohm: { type: float, min: 0, max: 10000, required: true, label: Tone 2 upper threshold, description: "Impedance in ohm, 0 to 10000, two decimals." }
    returns: ack
  set_pilot_tone:
    summary: "Switch pilot tone generation on a power channel (Dev.PTG.Active=, Dev.PTG2.Active= on the PLM 20000Q)"
    params:
      power_channel: *power_channel
      active: { type: bool, required: true, label: Active, description: "On generates the pilot tone, off stops it; configure it first." }
    returns: ack
  get_pilot_tone_impedance:
    summary: "Read a power channel's measured load impedance (Dev.PTG.Impedance?), in ohm, ? when not measured"
    params:
      power_channel: *power_channel
    returns: value
  set_output_mute:
    summary: "Mute or unmute a module output channel (Mod.Out.Mute=)"
    params:
      module: &module { type: enum, values: [A, B, C, D], label: Module,
                        description: "Lake module: A-D on D Series and PLM+, A-B on PLM and LM; give it with channel, or give power_channel." }
      channel: &channel { type: int, min: 1, max: 6, label: Channel,
                          description: "Module output channel, 1 to 6; give it with module, or give power_channel." }
      power_channel: &by_power { type: int, min: 1, max: 4, label: Power channel,
                                 description: "On D Series and PLM+, the output routed to this power channel, in place of module and channel." }
      muted: *muted
    returns: ack
  set_output_gain:
    summary: "Set a module output channel's gain (Mod.Out.Gain=)"
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      gain_db: { type: float, min: -100, max: 20, required: true, label: Gain, description: "Gain in dB, -100 to +20, two decimals." }
    returns: ack
  set_output_delay:
    summary: "Set a module output channel's delay (Mod.Out.Delay=)"
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      delay_ms: { type: float, min: 0, max: 100, required: true, label: Delay, description: "Delay in ms, 0 to 100, two decimals." }
    returns: ack
  set_output_polarity:
    summary: "Set a module output channel's polarity (Mod.Out.Phase=: 1 positive, 0 negative)"
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      inverted: &inverted { type: bool, required: true, label: Invert, description: "On inverts the polarity (negative), off is positive." }
    returns: ack
  set_output_label:
    summary: "Set a module output channel's label (Mod.Out.Label=)"
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      label: &label32 { type: string, required: true, max_length: 32, pattern: "^[ -~]*$", label: Label,
                        description: "Label, up to 32 printable ASCII characters." }
    returns: ack
  set_output_max_rms_level:
    summary: "Set a module output channel's MaxRMS limiter level (Mod.Out.MaxRMSLvl=)"
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      level_db: { type: float, min: -30, max: 30, required: true, label: Level, description: "MaxRMS level in dB, -30 to +30." }
    returns: ack
  set_output_max_rms_corner:
    summary: "Set a module output channel's MaxRMS corner (Mod.Out.MaxRMSCor=)"
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      corner_db: { type: float, min: -100, max: 0, required: true, label: Corner, description: "MaxRMS corner in dB, -100 to 0." }
    returns: ack
  set_output_max_rms_attack:
    summary: "Set a module output channel's MaxRMS attack time (Mod.Out.MaxRMSAtk=)"
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      attack_ms: { type: float, min: 1, max: 500, required: true, label: Attack, description: "Attack time in ms, 1 to 500." }
    returns: ack
  set_output_max_rms_release:
    summary: "Set a module output channel's MaxRMS release time (Mod.Out.MaxRMSRel=)"
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      release_ms: { type: float, min: 1, max: 500, required: true, label: Release, description: "Release time in ms, 1 to 500." }
    returns: ack
  set_output_max_peak_level:
    summary: "Set a module output channel's MaxPeak limiter level (Mod.Out.MaxPeakLvl=)"
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      level_db: { type: float, min: -30, max: 30, required: true, label: Level, description: "MaxPeak level in dB, -30 to +30." }
    returns: ack
  set_output_amp_gain:
    summary: "Set the amplifier gain of a module output channel (Mod.Out.AmpGain=)"
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      gain_db: { type: int, min: 22, max: 44, required: true, label: Amplifier gain, description: "Amplifier gain in whole dB, 22 to 44." }
    returns: ack
  set_output_vpl:
    summary: "Set the voltage peak limit of a module output channel (Mod.Out.AmpVPL=)"
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      vpl_v: { type: float, min: 17.8, max: 193, required: true, label: VPL, description: "Desired voltage peak limit in V, 17.8 to 193.0, one decimal." }
    returns: ack
  set_output_vpl_profile:
    summary: "Set the voltage peak limit profile of a module output channel (Mod.Out.VPLProfile=)"
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      profile: { type: enum, values: [universal, sub_lf, sub, lf, mf, hf], required: true, label: VPL profile,
                 description: "Universal, Sub/LF, Sub, LF, MF or HF." }
    returns: ack
  get_output_parameter:
    summary: >
      Read one parameter of a module output channel (Mod.Out.<parameter>?); levels and times answer with their group
      sum and limits after the value, AmpVPL with its limits and the actual VPL, Phase with its lock
    params:
      module: *module
      channel: *channel
      power_channel: *by_power
      parameter: { type: enum, required: true, label: Parameter,
                   values: [Mute, Gain, Delay, MaxRMSLvl, MaxRMSCor, MaxRMSAtk, MaxRMSRel, MaxPeakLvl, Phase, Label, AmpGain, AmpVPL, VPLProfile],
                   description: "The output parameter to read, by its DLM name." }
    returns: value
  get_output_channels:
    summary: "Read how many output channels a module has (Mod.Out.Chans?)"
    params:
      module: *module_req
    returns: value
  set_input_mute:
    summary: "Mute or unmute a module input (Mod.In.Mute=)"
    params:
      module: &in_module { type: enum, values: [A, B, C, D], label: Module,
                           description: "Lake module: A-D on D Series and PLM+, A-B on PLM and LM; or give power_channel." }
      power_channel: *by_power
      muted: *muted
    returns: ack
  set_input_gain:
    summary: "Set a module input's gain (Mod.In.Gain=)"
    params:
      module: *in_module
      power_channel: *by_power
      gain_db: { type: float, min: -100, max: 15, required: true, label: Gain, description: "Gain in dB, -100 to +15, two decimals." }
    returns: ack
  set_input_delay:
    summary: "Set a module input's delay (Mod.In.Delay=)"
    params:
      module: *in_module
      power_channel: *by_power
      delay_ms: { type: float, min: 0, max: 1800, required: true, label: Delay, description: "Delay in ms, 0 to 1800, two decimals." }
    returns: ack
  set_input_polarity:
    summary: "Set a module input's polarity (Mod.In.Phase=: 1 positive, 0 negative)"
    params:
      module: *in_module
      power_channel: *by_power
      inverted: *inverted
    returns: ack
  set_input_label:
    summary: "Set a module input's label (Mod.In.Label=)"
    params:
      module: *in_module
      power_channel: *by_power
      label: *label32
    returns: ack
  set_input_mixer_gain:
    summary: "Set the gain of an input router into a module's input mixer (Mod.In.MixerGain=)"
    params:
      module: *in_module
      power_channel: *by_power
      router: { type: int, min: 1, max: 4, required: true, label: Router, description: "Input router feeding the mixer, 1 to 4." }
      gain_db: { type: float, min: -100, max: 15, required: true, label: Gain, description: "Mixer gain in dB, -100 to +15, two decimals." }
    returns: ack
  set_module_label:
    summary: "Set a module's label (Mod.Mod.Label=)"
    params:
      module: *in_module
      power_channel: *by_power
      label: *label32
    returns: ack
  set_module_selected:
    summary: "Mark a module selected, as Lake Controller and the front panel show it (Mod.Mod.Selected=)"
    params:
      module: *in_module
      power_channel: *by_power
      selected: { type: bool, required: true, label: Selected, description: "On marks the module selected, off clears it." }
    returns: ack
  query:
    summary: "Read anything DLM documents by its path and arguments (<path>?<args>); returns the answer text"
    params:
      path: { type: string, required: true, max_length: 64, pattern: "^(Dev|Mod)\\.[A-Za-z0-9.]+$", label: Path,
              description: "The DLM path, e.g. Dev.Out.Route or Mod.In.Delay." }
      args: { type: string, default: "", max_length: 100, pattern: "^[A-Za-z0-9#. -]*$", label: Arguments,
              description: "Arguments as the document gives them, separated by single spaces, e.g. PC 1 Analog." }
    returns: value
  send_message:
    summary: >
      Send any DLM command text as written (Path?args, Path=args or Path!args); a get returns the answer text, a set
      or do is acknowledged
    params:
      message: { type: string, required: true, max_length: 500, pattern: "^(Dev|Mod)\\.[ -~]+$", label: Message,
                 description: "The command text, e.g. Dev.Out.Route=PC 1 Analog XX----." }
    returns: value

