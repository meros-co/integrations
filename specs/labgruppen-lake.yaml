quirks:
  - models: [all]
    severity: critical
    text: >
      recall_preset mutes the audio for about a second while every DSP parameter is set, every time, even when the
      same preset is recalled again (DLM FAQ 11); the frame does not know which preset is active (FAQ 9). store_preset
      overwrites the stored preset, factory_reset and soft_reset discard the frame's configuration, and
      reset_to_contour and reset_to_mesa change the LM's processing mode. None can be undone from here.
  - models: [all]
    severity: critical
    text: >
      Lake Controller 8's release notes list a known issue: invalid DLM messages can reset the device. D Series and
      PLM+ firmware 2.50 or later is recommended for third-party control. The typed commands check their parameters
      before sending, but query and send_message send what they are given, and DLM itself accepts out-of-range
      values (its disclaimer, 1.2): use them with care on a live system.
  - models: [all]
    severity: warning
    text: >
      Any host on the subnet can control the frame: DLM has no authentication, and the controller must be on the
      same subnet (FAQ 17). Frames default to link-local addressing (Zero-Conf), so their IP address can change at
      each start; the frame id stays.
  - models: [all]
    severity: warning
    text: >
      Fixed answer port mode answers on UDP 6004 of this computer, which only one program can hold, and Lake
      Controller itself uses it; the default, dynamic mode (6016), works beside Lake Controller.
  - models: [all]
    severity: info
    text: >
      Without the frame_id setting, the module asks the device at the given address for its frame id
      (Dev.Network.ID?, sent to that address with the broadcast id and class) and takes the id from the answer's
      source, as the document's example application does, then addresses the frame by it.
  - models: [all]
    severity: info
    text: >
      Nothing is pushed. While monitored the module reads the meters and the fault flag every meter_poll_ms; every
      parameter_poll_ms the power state, frame label, latency match, power channel mutes and attenuations, LoadPilot
      readings (D Series and PLM+) or pilot tone impedances (PLM), GPI and GPO states (LM), input router mutes and
      active priorities, and each module's label, input mute, gain and delay and each output channel's mute, gain,
      delay and label (for the channel count Mod.Out.Chans gives); and every configuration_poll_ms (a minute by
      default) every other setting DLM can read: ISO-float, AES termination, redundancy, IP configuration, address
      and mask, Dante slave-only, breaker current and type, per power channel latency, speaker count, LoadPilot
      enable, signal and thresholds or pilot tone, bridge mode, Dante break-in, the LM's output routing, GPI and GPO
      configuration and Dante input labels, every input router priority and forced priority, input sample rates,
      and each module's selection, input polarity, label and mixer gains and each output channel's power routing,
      polarity, limiters, amplifier gain, VPL and VPL profile. Sets update state when acknowledged. One request is
      in flight at a time, commands ahead of polls; a round is not started while the last is still being read.
  - models: [all]
    severity: info
    text: >
      DLM v3.4 has no EQ, crossover, filter or speaker-preset command (8.2 lists every command: module outputs offer
      gain, delay, polarity, label, the MaxRMS and MaxPeak limiters and the amplifier settings; module inputs gain,
      delay, polarity, label and mixer gains). EQ and crossovers are set in Lake Controller only: an API limit.
      Dev.Load.MaskNotVerified (PLM 2.94) is obsolete from Lake Controller 6.3, as the warning it masks was removed,
      and Dev.Speakers is the older form of Dev.Load.Speakers; neither is offered beyond send_message. DLM cannot
      read which frame preset is active (FAQ 9).
  - models: [all]
    severity: info
    text: >
      Several answers hold more than one value: Dev.Fuse.NominalCurrent the nominal and actual current, LoadPilot
      four tones' values, Dev.Router.InputTypSel the type, channel, sensitivity and an optional Dante name,
      Dev.Dante.BreakIn the type and channel (and probe and power channel for a probe), Mod.Out.Phase the polarity
      and its lock, Mod.Out.AmpVPL the desired, minimum, maximum and actual VPL, and Dev.Route one X or dash per power
      output. Each word is read into its own key, in the order the document gives; a dash is taken as not routed.
  - models: [all]
    severity: info
    text: >
      The document gives a get's answer as the value or values alone (levels and times add their group sum and
      limits after the value). The module takes the first word for numbers and switches; if a device answers with
      the command echoed (path, operator and arguments), they are removed first. Text values (labels) are taken whole.
  - models: [all]
    severity: info
    text: >
      Meters are peak and hold (the worst value since the last read). Levels are 0.5 dB steps from full scale; a
      level of -128 means below -127 dBFS. Amplifier power, voltage and current are relative to the channel's
      maximum and read -127 dB from -127 to -60 dB (Appendix B). Gain reduction is read at 0.1 dB a step, as the
      version 1 table and the peak values give it; the document's RMS gain reduction text says 0.5 dB a step.
  - models: [all]
    severity: info
    text: >
      Acknowledgement results other than -2 (success) fail the command with the code: -3 not master, -4 invalid
      packet, -5 DSP error, -6 bad parameters (6.2, read in the order the table's columns give, which are
      misaligned in the document); Dev.Power's -20 (already on) and -21 (already in standby) count as success. The
      document's FAQ 7 calls the codes other than -2 internal and advises sending again; the module does not resend.
  - models: [all]
    severity: info
    text: >
      Three requests in a row without an answer (1 s each; 5 s for a preset recall or store) are taken as a lost
      device, which is probed again every 2 s. Opened for commands only, the module reads nothing but asks
      Dev.Power? after 3 s without traffic, as DLM has no presence signal.
  - models: [plm-20000q, plm-14000, plm-10000q]
    severity: info
    text: >
      PLM Series meters use the version 2 structure (Dev.MD.FullBin?2), which needs firmware 2.74; older firmware
      answers only version 1, which the module does not request. Power channel attenuation and mute need firmware
      2.98, the load speaker count 2.94, Dante break-in 2.79 and redundancy 4.33.
  - models: [d-40-4l, d-20-4l, d-10-4l]
    severity: warning
    text: >
      DLM v3.4 lists no product code for the D Series Slimline models (D 10:4L, D 20:4L, D 40:4L), which came later;
      they run the same Lake platform and are assumed to answer as the D Series. Lake Controller 7's notes refer to
      a later DLM document for up to eight Dante probes on some models, which is not public.
