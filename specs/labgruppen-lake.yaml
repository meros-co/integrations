spec: 1
id: labgruppen-lake
name: Lab.gruppen Lake amplifiers and processors (Direct Lake Messaging)
vendor: Lab.gruppen
category: other
implementation: native
reason: >
  DLM is a binary UDP envelope (a little-endian header with 64-bit source and destination ids, classes, a length,
  a packet type and a message id that must rise per packet) around text commands. Answers are matched to requests
  by message id and come as either an acknowledgement code or a text, the device has to be found by its frame id
  first, and meters arrive as a binary structure that differs per product family. Nothing is pushed, so state is
  kept by paced polling.

source:
  - title: "Lab.gruppen AB, Direct Lake Messaging v3.4: 3rd party protocol for Lake enabled products (PLM and LM 3rd party protocol v3_4 PUBLIC - APPROVED v1A), 2015-06-09"
    author: Lab.gruppen AB
    url: "https://beetech-inc.com/wp/wp-content/uploads/DLM-Lake-3rd-party-protocol-v3_4.pdf"
    note: >
      Marked PUBLIC by Lab.gruppen; mirrored by a distributor, as Lab.gruppen no longer hosts it (the Lake
      Controller manual, 25.2, has integrators ask for it by email). Version requirements (2: DLM 3 from D Series
      and PLM+ firmware 2.36, DLM 1 and 2 from PLM 2.58 and 2.74, DLM 2 from LM 0.32), UDP ports (4.1 fixed 6015
      with answers to 6004, 4.2 dynamic 6016 with answers to the sender's port), the packet format (5: header
      fields, classes 6, 5 and 0, broadcast ids -2/-3, length up to 560, types 701 and 2, message id, footer,
      little-endian), messages and acknowledgement codes (6.1, 6.2), addressing by frame id (7), every command
      with its operations, parameters, ranges and supported families (8.1-8.4), the meter structures of versions
      1, 2, 3 and LM (Appendix B), the FAQ (10: source id, footer, alignment, result codes, active preset unknown,
      a recall mutes audio for about a second), the example application (Appendix C: answers matched by message
      id, broadcasts ignored, the frame id from the answer's source) and the example packets (Appendix D).
  - title: "Lake Controller v8.0.0 release notes (Installer 140, 2023-07-07)"
    author: Music Tribe Brands Sweden AB
    url: "https://beetech-inc.com/wp/wp-content/uploads/Lake_Controller_v8-Release-Notes.pdf"
    note: >
      Current firmware bundles stay compatible with DLM v3.4; known issue that invalid DLM messages can reset a
      device, with D Series and PLM+ firmware 2.50 recommended for third-party control.

settings:
  frame_id: { type: string, max_length: 17, pattern: "^([0-9A-Fa-f]{8}:[0-9A-Fa-f]{8})?$", label: Frame ID,
              description: "The frame's hardware id as Lake Controller or the front panel (MENU, Frame, Network) shows it, e.g. 3d000011:d6ed9201; asked of the device when empty." }
  response_port: { type: enum, values: [dynamic, fixed], default: dynamic, label: Answer port,
                   description: "dynamic sends to UDP 6016 and the device answers the sending port; fixed sends to 6015 and the device answers on 6004, which Lake Controller must not hold on this computer." }
  meter_poll_ms: { type: int, min: 0, max: 60000, default: 1000, label: Meter interval,
                   description: "Milliseconds between meter and fault reads while monitored; 0 reads none." }
  parameter_poll_ms: { type: int, min: 0, max: 600000, default: 5000, label: Parameter interval,
                       description: "Milliseconds between rounds of parameter reads (power, mutes, gains, labels) while monitored; 0 reads them once." }
  configuration_poll_ms: { type: int, min: 0, max: 3600000, default: 60000, label: Configuration interval,
                           description: "Milliseconds between rounds of configuration reads (limiters, amplifier, routing, breaker, LoadPilot, GPIO, network) while monitored; 0 reads them once." }

ports:
  - { port: 6016, protocol: udp, role: control, note: "dynamic answer port mode: the device answers the sender's port" }
  - { port: 6015, protocol: udp, role: control, setting: response_port, when: "response_port fixed" }
  - { port: 6004, protocol: udp, role: feedback, listener: core, setting: response_port, when: "response_port fixed" }

