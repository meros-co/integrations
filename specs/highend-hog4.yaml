spec: 1
id: highend-hog4
name: High End Systems Hog 4 family and Hog OS consoles
vendor: High End Systems
category: lighting

source:
  - title: Hog Lighting Control System User Manual 5.2.1, Section 22 Open Sound Control
    author: High End Systems (ETC)
    url: https://www.etcconnect.com/WebDocs/Controls/Hog_5x/Content/22_OSC/OSCInputMapping.htm
    note: >
      Manual version 5.2.1 (built 2026-09-01, retrieved 2026-10-02). 22.1 (OSCIntro.htm): OSC
      input on every console of the family including Hog PC. 22.2 and 22.3 (OSCConfigIN.htm,
      OSCConfigOUT.htm): Setup, Network, console Settings, Open Sound Control pane: OSC In with an
      input port; OSC Out with an output port, the IP address to send to and the protocol. 22.4
      OSC Input Mappings: playback paths /hog/playback/go|halt|resume|release/<type> where the
      path number is the object type (0 list, 1 scene, 2 macro) and the argument the object
      number, "Hog can process arguments sent as a float or integer", goto as list#.cue#
      ("/hog/playback/go/0 15.2"); 22.4.2 button paths with 0 = up, 1 = down (masters
      /hog/hardware/choose|go|pause|goback|flash/<master>, playback, programmer and number pad
      keys, h# function keys, u# keys); 22.4.3 wheel paths (ewheelbutton/#, iwheelup, iwheeldown,
      posmode 0 off 1 on, trackball "x,y values", encoderwheel/# -20 to 20, ratewheel, iwheel);
      22.4.4 fader paths (/hog/hardware/fader/0 GM and faders 1 thru 90, 0 to 255); 22.4.5 system
      commands /hog/command consoleledrefresh, consolefaderrefresh, refreshall. 22.5 OSC Output
      Mappings (OSCOutputMapping.htm): no playback output; status paths /hog/status/led/<button>,
      /hog/status/led/<button>colour, /hog/status/commandline, /hog/status/encoderwheel#/label and
      value, /hog/status/h#/line1 and line2, /hog/status/chatline1-3. 22.6 (OSCNetwork.htm): wired
      networks recommended; UDP OSC is not error checked.
  - title: Hog 4 Lighting Control System User Manual 3.15.0, Section 22 Open Sound Control
    author: High End Systems
    url: https://www.etcconnect.com/webdocs/Controls/HOG/HTML/en/sect-osc_mappings.htm
    note: >
      Hog 4 OS manual version 3.15.0 (chap-osc.htm, sect-osc_intro.htm, sect-connecting_osc.htm,
      sect-connecting_osc_output.htm, sect-osc_mappings.htm, sect-osc_wifi.htm). The same playback
      table without resume for scenes; 22.4.2 OSC MIDI note mappings /hog/midi/on|off/<channel>/<note>
      with the velocity as data ("if velocity = 0, then message is treated as note off"); a
      shorter key table (masters, wheel buttons, pig, period, arrows, @, -, +, /, backspace, h#,
      main play/pause/back, center choose, skip forward/back, 0-9); trackball, GM fader, encoder,
      rate and i-wheel paths; the status outputs without the LED colour.
  - title: ETC support articles, How To Setup Touch OSC and Hog 4; How To Setup iHog OSC and Hog 4
    author: Electronic Theatre Controls
    url: https://support.etcconnect.com/HES/Consoles/Hog_4/Networking/How_To_Setup_Touch_OSC_and_Hog_4
    note: >
      Retrieved 2026-10-02. OSC In and OSC Out enabled in the console's Open Sound Control tab with
      different ports, "Recommended to use input port: 7001" and "output port: 7002", the output
      IP address being the controller's; Hog 4 PC needs a wing, widget, Nano Hog or unlocked
      ETCnomad key for encoders to work from TouchOSC. The port defaults below follow these.
  - title: ETC support, All Hog Software Versions
    author: Electronic Theatre Controls
    url: https://support.etcconnect.com/HES/Consoles/Hog_4/Software_and_Programming/All_Hog_Software_Versions
    note: >
      Retrieved 2026-10-02: Hog OS releases 3.x, 4.0-4.3 and 5.0-5.2 and the manual for each; the
      Hog OS 5 manual's technical specifications list Stage Hog, Flex Hog, Gig Hog, Hog 4, Hog
      4-18, Full Boar 4, HPU, HPU+, Road Hog 4, Road Hog 4-21, HedgeHog 4 (4N, 4S, 4X, 2020 4X),
      Nano Hog 4 and Hog PC.
  - title: Bitfocus Companion module companion-module-highend-hog4 (community, MIT)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-highend-hog4
    note: >
      Community code, read for corroboration only (MIT at the top level). It sends the object
      number in the address (/hog/playback/go/0/<n>) with a float 1 or 0, where the manual's
      tables send it as the argument; this spec follows the manual. It also sends
      /hog/hardware/fader/<master> with 0-255 for any master, and keys (full, enter, rate) that
      the manual does not list and this spec leaves out.

# OSC 1.0 over UDP to the console's OSC In port. Hog acknowledges nothing, so every command
# reports unverified. Status output goes to the IP address, port and protocol set under OSC Out,
# not back to the sender: set OSC Out to UDP, this host's address and feedback_port, and the core
# receives there (a fixed local port shared by every console sending to it, each datagram routed
# by its source address). With feedback_port empty nothing is read back.
transport:
  type: osc-udp
  port: 7001
  reply: none
  listen_port: { setting: feedback_port }

settings:
  feedback_port: { type: int, min: 1, max: 65535, default: 7002 }

ports:
  - { port: 7001, protocol: udp, role: control }
  - { port: 7002, protocol: udp, role: feedback, listener: core, setting: feedback_port, note: "where the device sends its feedback" }

