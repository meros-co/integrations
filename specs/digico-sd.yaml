quirks:
  - models: [all]
    severity: critical
    text: >
      fire_snapshot, fire_next_snapshot and fire_previous_snapshot recall a snapshot on the live
      console at once: every parameter in the snapshot's recall scope changes, faders and mutes
      included, and nothing undoes it except firing another snapshot. fire_next_snapshot and
      fire_previous_snapshot act relative to the console's current snapshot, which this spec cannot
      read back.

  - models: [all]
    severity: critical
    text: >
      Nothing is accepted until the console is set up for it (TN324 p.2; V987 release notes): Setup >
      External Control enabled, Add device > Other OSC with this host's IP address and a Send and a
      Receive port unique among the devices, and the device's Enable box ticked. Register the device
      here with the console's address and that Receive port; DiGiCo documents no default port. With
      no acknowledgement on Other OSC, a console that is not set up drops every message while each
      command still reports unverified.

  - models: [all]
    severity: warning
    text: >
      Other OSC is one-way. DiGiCo documents no feedback or query to an Other OSC device, and the
      Companion module's help says feedback needs the device added as a DiGiCo Pad, whose command set
      is not public. This spec therefore keeps no state: a fader moved on the surface, or a snapshot
      fired there, is not seen.

  - models: [all]
    severity: warning
    text: >
      Faders, sends, trims, gains, frequencies, Q, thresholds, ratios, times and pans are sent as
      the list gives them, a float from 0.0 to 1.0 across the control's travel. The list does not
      give the dB, Hz or millisecond value of any position, so the spec does not convert; the
      Companion module's dB labels for fader positions (0.75 = 0 dB) are not from DiGiCo and are
      not used.

  - models: [all]
    severity: warning
    text: >
      Strip numbers are limited to the largest console in the range (Quantum852: 384 input
      channels, 192 aux and group outputs together, 64 matrix outputs, 36 control groups; graphic EQ
      up to 64). How many exist depends on the console and on the session's channel configuration;
      DiGiCo does not document what happens to a message for a strip the session does not have.

  - models: [all]
    severity: warning
    text: >
      press_macro takes the macro number from 1, as the console shows it, and sends it 0-based: the
      list's range for Macros/Buttons/press is 0-255, and the Companion module sends macro N as N-1.
      A macro can run any console action, including snapshot recalls.

  - models: [all]
    severity: warning
    text: >
      save_session overwrites the session file on the console with its current state, replacing
      what was saved before. It does not change the audio.

  - models: [all]
    severity: info
    text: >
      Left out of the list: Input_Channels/*/Channel_Input/main/alt_in (the table's row is garbled,
      so its address is uncertain), CGs_level and CGs_mute (their meaning is not explained),
      Matrix_Inputs/*/Matrix_Send (matrix input numbering is not explained), and Multis (the
      "multis" are not explained). The list dates from 2014; parameters added to the consoles since
      have no published address.
