commands:
  set_input_trim:
    summary: "Set the input trim of an input channel, normalised 0.0-1.0 (Input_Channels/*/Channel_Input/trim, f)"
    params:
      channel: { type: int, min: 1, max: 384, required: true }
      value:   { type: float, min: 0, max: 1, required: true }
    send: { address: "/sd/Input_Channels/{channel}/Channel_Input/trim", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_input_phase:
    summary: "Set the phase (polarity) setting of an input channel, 0-3 as the console numbers it (Input_Channels/*/Channel_Input/phase, i)"
    params:
      channel: { type: int, min: 1, max: 384, required: true }
      value:   { type: int, min: 0, max: 3, required: true }
    send: { address: "/sd/Input_Channels/{channel}/Channel_Input/phase", args: [ { value: "{value}", type: int } ] }
    returns: none

  set_input_phantom:
    summary: "Switch the 48 V phantom power of an input channel on or off (Input_Channels/*/Channel_Input/phantom, i)"
    params:
      channel: { type: int, min: 1, max: 384, required: true }
      enabled: { type: bool, default: true }
    send: { address: "/sd/Input_Channels/{channel}/Channel_Input/phantom", args: [ { value: "{enabled:bool01}", type: int } ] }
    returns: none

  set_input_alt_phantom:
    summary: "Switch the 48 V phantom power of the alternate input of an input channel on or off (Input_Channels/*/Channel_Input/alt_phantom, i)"
    params:
      channel: { type: int, min: 1, max: 384, required: true }
      enabled: { type: bool, default: true }
