      channel: { type: int, min: 1, max: 384, required: true }
      enabled: { type: bool, default: true }
    send: { address: "/sd/Input_Channels/{channel}/Channel_Input/alt_input_pad", args: [ { value: "{enabled:bool01}", type: int } ] }
    returns: none

