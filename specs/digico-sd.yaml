spec: 1
id: digico-sd
name: DiGiCo SD and Quantum consoles (External Control, Other OSC)
vendor: DiGiCo
category: mixer

# DiGiCo's general-purpose OSC input: in Setup > External Control the console
# adds an "Other OSC" device with this host's IP address and a Send and a
# Receive port, and then takes the /sd/... messages of DiGiCo's OSC command
# list on its Receive port, over UDP. Every value is an OSC int, float or
# string; continuous controls are normalised 0.0-1.0. The console does not
# acknowledge, and DiGiCo documents no feedback to an Other OSC device, so the
# spec has no state and every write reports unverified. The iPad/Pixel
# ("DiGiCo Pad") command set, which does send feedback, is not publicly
# documented and is not included.

source:
  - title: "DiGiCo OSC Command List for Other OSC (17/11/2014)"
    author: DiGiCo (UK) Ltd
    url: https://raw.githubusercontent.com/bitfocus/companion-module-digico-osc/HEAD/api/DiGiCo_OTHER_OSC_List_17_11_14.pdf
    note: >
      Manufacturer document, distributed by DiGiCo dealers and mirrored in the MIT-licensed Bitfocus
      Companion module repository (api/), which is where it was read; DiGiCo publishes no copy on
      digico.biz. Page 1: message format (address, type tag, value) with examples for an input
      channel's name (s), mute (i 1 = on) and fader (f 1 = maximum); the /sd/ prefix; "*" standing
      for the channel, aux output, group, matrix, graphic EQ or multi number. The table (pages 1-12)
      gives every address with its type (Int, Float, String) and OSC minimum and maximum: Input_Channels
      (Channel_Input, Aux_Send, Group_Send, EQ, Dynamics, Filters, Insert, Channel_Delay, CGs_level,
      solo, CGs_mute, fader, mute, Panner), Aux_Outputs, Group_Outputs and Matrix_Outputs (EQ with
      eight bands, Dynamics, Insert, Channel_Delay, Buss_Trim, solo, fader, mute), Control_Groups
      (solo, fader, mute, name), Matrix_Inputs (Matrix_Send), Graphic_EQ (geq_in, geq_gain_1-32),
      Multis, Filing/Save_current_Session, Snapshots (Fire_Snapshot_number 0-9999,
      Fire_Prev_Snapshot, Fire_Next_Snapshot) and Macros/Buttons/press (0-255).
  - title: "TN324: Use of SD Series External Control for iPad (Oct 2014, rev 5 May 2018)"
    author: DiGiCo (UK) Ltd
    url: https://digico.biz/wp-content/uploads/2020/02/TN324-SD-Series-iPad-External-Control.pdf
    note: >
      Manufacturer technical note. The External Control panel (Master Screen > Setup > External
      Control): enable External Control, Add device, device name, the device's IP address, Send and
      Receive port numbers (example Send 9000, Receive 8000), unique ports per device, the Enable
      column (p.2); the console's Local IP address shown at the bottom of the panel (p.1); general
      purpose OSC "available in v987 onwards" (p.1). Default subnet masks (p.1).
  - title: "SD Series V987 Release Notes (April 2018)"
    author: DiGiCo (UK) Ltd
    url: http://www.digico.org/downloads/support/SD%20Series%20V987%20Release%20Notes.pdf
    note: >
      Manufacturer document. External Control Panel: Add Device, "Other OSC" from the drop-down
      list with IP address and Send/Receive ports (p.4-5); Generic OSC and L-ISA controls are
      messages the console sends, not commands it receives.
  - title: "SD & Quantum V1742 Release Notes (April 2024)"
    author: DiGiCo (UK) Ltd
    url: https://digico.biz/wp-content/uploads/2024/04/SD-and-Quantum-V1742_Release_Notes.pdf
    note: >
      Manufacturer document: current SD and Quantum software; "Add device" and "other OSC", then the
      IP address and Send/Rcv port numbers, in Setup > External Control (Spacemap Go and AFM
      sections).
  - title: "Quantum852 data sheet (2023)"
    author: DiGiCo (UK) Ltd
    url: https://digico.biz/wp-content/uploads/2023/05/DiGiCo-Quantum-852-Data-Sheet-Web.pdf
    note: >
      Manufacturer document: 384 input channels, 192 aux/sub-group busses, 64 x 64 matrix and 36
      control groups, the largest counts in the range and the parameter limits used here.
  - title: companion-module-digico-osc (Bitfocus Companion module, MIT licence)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-digico-osc
    note: >
      Read for corroboration only (index.js, actions.js, HELP.md). It sends the list's /sd/ addresses
      to the console's Other OSC port with int mutes, float faders 0.0-1.0, snapshot numbers as ints,
      int 0 for next/previous snapshot, and macro numbers 1-256 sent as 0-255. Its help says feedback
      needs the device added as a DiGiCo Pad (the iPad command set), and that an Other OSC device
      gets none.

# The port is the Receive (Rcv) port entered for this device in the console's
# External Control panel. DiGiCo documents no default; 8000 is TN324's example
# Receive port, and the host's configured port overrides it.
transport:
  type: osc-udp
  port: 8000
  reply: none

