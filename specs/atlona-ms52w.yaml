telemetry:
  poll:
    - every_ms: 10000
      send: ["Display:Input:Get", "Display:Input:All:Get", "Display:Matrix:Get 0", "Display:Matrix:Get 1",
             "Audio:Volume:Get", "Audio:Mute:Get", "Display:Minimal:Get"]
    - every_ms: 60000
      send:
        - "Display:Control:IP:Get"
        - "Display:Matrix:Mode:Get"
        - "Display:Input:HDCP:State:Get 0"
        - "Display:Input:HDCP:State:Get 1"
        - "Display:Input:HDCP:State:Get 2"
        - "Display:Input:HDCP:State:Get 3"
        - "Display:Input:HDCP:State:Get 4"
        - "GetHostName"
        - "Instruments:Temperature:Get c"
        - "Misc:Model:Get"
        - "Misc:Versions:Get"
        - "Moderator:Status:Get"
        - "Net:GetInfo"
        - "Relay:State:Get 0"
        - "Relay:State:Get 1"
        - "Zone:PortParams 1"
        - "Zone:PortParams 2"
        - { models: [at-ome-ms52w], message: "Audio:GetBass" }
        - { models: [at-ome-ms52w], message: "Audio:GetTreble" }
        - { models: [at-ome-ms52w], message: "Audio:GetSource" }
        - { models: [at-ome-ms52w], message: "GetBroadcast" }
        - { models: [at-ome-ms52w], message: "GetNoSignalTimeout" }
        - { models: [at-ome-ms52w], message: "Relay:PulseDuration:Get" }
        - { models: [at-ome-ms52w], message: "USBRouting:Input:Get" }
        - { models: [at-ome-ms52w], message: "USBRouting:Mode:Get" }
        - { models: [at-uhd-sw-510w], message: "OSD:State:Get" }
  updates:
    - json_match: { "$.methodreturn": "(?i)^audio:\\s*getbass" }
      json: { v: "$.result.bass.value" }
      state: { audio.bass_db: "{v}" }
    - json_match: { "$.methodreturn": "(?i)^audio:\\s*gettreble" }
      json: { v: "$.result.treble.value" }
      state: { audio.treble_db: "{v}" }
    - json_match: { "$.methodreturn": "(?i)^audio:\\s*getsource" }
      json: { v: "$.result.audiosource" }
      state: { audio.source: "{v}" }
    - json_match: { "$.methodreturn": "(?i)^audio:\\s*mute:\\s*get" }
      json: { hdmi: "$.result.outputmute.hdmi", analog: "$.result.outputmute.analog" }
      state: { audio.mute.hdmi: "{hdmi}", audio.mute.analog: "{analog}" }
    - json_match: { "$.methodreturn": "(?i)^audio:\\s*volume:\\s*get" }
      json: { v: "$.result.volume.value" }
      state: { audio.volume_db: "{v}" }
    # Increase, decrease and SetVol answer with the new level.
    - json_match: { "$.methodreturn": "(?i)^(audio:\\s*volume:\\s*(increase|decrease)|setvol)" }
      json: { v: "$.result.volume" }
      state: { audio.volume_db: "{v}" }
    - json_match: { "$.methodreturn": "(?i)^display:\\s*control:\\s*ip:\\s*get" }
      json: { ip: "$.result.ip", port: "$.result.port" }
      state: { display_control.ip: "{ip}", display_control.port: "{port}" }
    - json_match: { "$.methodreturn": "(?i)^display:\\s*input:\\s*all:\\s*get" }
      json_each: "$.result.*"
      json: { status: "$.status", type: "$.type" }
      state: { "inputs.{key}.connected": "{status}", "inputs.{key}.type": "{type}" }
    - json_match: { "$.methodreturn": "(?i)^(?:display:\\s*)?input:\\s*get", "$.result.input": "^(\\d)$" }
      json: { type: "$.result.type" }
      state: { active_input: { value: "{1}", map: { "0": usb_c, "1": displayport, "2": hdmi_3, "3": hdmi_4, "4": byod } }, active_input_type: "{type}" }
    - json_match: { "$.methodreturn": "(?i)^(?:display:\\s*)?input:\\s*get", "$.result.input": "^unknown$" }
      json: {}
      state: { active_input: "unknown", active_input_type: "" }
    - json_match: { "$.methodreturn": "(?i)^display:\\s*input:\\s*hdcp:\\s*state:\\s*get\\s*(\\d)" }
      json: { v: "$.result.state" }
      state: { "inputs.{1}.hdcp": "{v}" }
    - json_match: { "$.methodreturn": "(?i)^display:\\s*inputstate:\\s*get\\s*(\\d)" }
      json: { v: "$.result.state" }
      state: { "inputs.{1}.connected": "{v}" }
    - json_match: { "$.methodreturn": "(?i)^display:\\s*matrix:\\s*get\\s*0", "$.result.input": "^(\\d)$" }
      json: {}
      state: { "outputs.hdbaset.input": { value: "{1}", map: { "0": usb_c, "1": displayport, "2": hdmi_3, "3": hdmi_4, "4": byod } } }
    - json_match: { "$.methodreturn": "(?i)^display:\\s*matrix:\\s*get\\s*1", "$.result.input": "^(\\d)$" }
      json: {}
      state: { "outputs.hdmi.input": { value: "{1}", map: { "0": usb_c, "1": displayport, "2": hdmi_3, "3": hdmi_4, "4": byod } } }
    - json_match: { "$.methodreturn": "(?i)^display:\\s*matrix:\\s*mode:\\s*get" }
      json: { mode: "$.result.mode", subtype: "$.result.subtype" }
      state: { matrix_mode.enabled: "{mode}", matrix_mode.subtype: "{subtype}" }
    - match: "(?i)^(on|off|true|false)\\s*$"
      request_match: '(?i)^Display:Minimal:Get$'
      state: { display_power: { value: "{1:lower}", map: { "on": true, "off": false, "true": true, "false": false } } }
    - match: "(?i)^(?:broadcast\\s+)?(on|off)\\s*$"
      request_match: '(?i)^(GetBroadcast|SetBroadcast [01])$'
      state: { broadcast: { value: "{1:lower}", map: { "on": true, "off": false } } }
    - json_match: { "$.methodreturn": "(?i)^gethostname" }
      json: { v: "$.result.hostname" }
      state: { hostname: "{v}" }
    - json_match: { "$.methodreturn": "(?i)^getnosignaltimeout" }
      json: { v: "$.result.value" }
      state: { no_signal_timeout_s: "{v}" }
    - json_match: { "$.methodreturn": "(?i)^instruments:\\s*temperature:\\s*get(\\s*c)?\\s*$" }
      json: { v: "$.result.value" }
      state: { temperature_c: "{v}" }
    - json_match: { "$.methodreturn": "(?i)^misc:\\s*model:\\s*get" }
      json: { v: "$.result.model" }
      state: { model: "{v}" }
    - json_match: { "$.methodreturn": "(?i)^misc:\\s*versions:\\s*get" }
      json: { master: "$.result.versions.master", mcu: "$.result.versions.mcu" }
      state: { versions.master: "{master}", versions.mcu: "{mcu}" }
    - json_match: { "$.methodreturn": "(?i)^osd:\\s*state:\\s*get" }
      json: { v: "$.result.state" }
      state: { osd_shown: "{v}" }
    - json_match: { "$.methodreturn": "(?i)^misc:\\s*version:\\s*get\\s*mcu" }
      json: { v: "$.result.version.mcu" }
      state: { versions.mcu: "{v}" }
    - json_match: { "$.methodreturn": "(?i)^misc:\\s*version:\\s*get\\s*master" }
      json: { v: "$.result.version.master" }
      state: { versions.master: "{v}" }
    - json_match: { "$.methodreturn": "(?i)^moderator:\\s*enable:\\s*get" }
      json: { v: "$.result.enable" }
      state: { moderator.enabled: "{v}" }
    # Moderator status, and the moderator event Moderator:Enable:Set and
    # broadcast send.
    - json_match: { "$.moderator.enabled": "^(true|false)$" }
      json: { enabled: "$.moderator.enabled", index: "$.moderator.activeindex", streams: "$.moderator.streams" }
      state: { moderator.enabled: "{enabled}", moderator.active_index: "{index}", moderator.streams: "{streams}" }
    - json_match: { "$.event.moderator.enabled": "^(true|false)$" }
      json: { enabled: "$.event.moderator.enabled", index: "$.event.moderator.activeindex", streams: "$.event.moderator.streams" }
      state: { moderator.enabled: "{enabled}", moderator.active_index: "{index}", moderator.streams: "{streams}" }
    - json_match: { "$.methodreturn": "(?i)^net:\\s*getinfo" }
      json_each: "$.result.netinfo.*"
      json: { ip: "$.ip", netmask: "$.netmask", mac: "$.mac", mode: "$.mode" }
      state: { "network.{key}.ip": "{ip}", "network.{key}.netmask": "{netmask}", "network.{key}.mac": "{mac}", "network.{key}.mode": "{mode}" }
    - json_match: { "$.methodreturn": "(?i)^net:\\s*getinfo" }
      json: { ssid: "$.result.netinfo.wlan0.ap.ssid", channel: "$.result.netinfo.wlan0.ap.channel" }
      state: { network.wlan0.ssid: "{ssid}", network.wlan0.channel: "{channel}" }
    - json_match: { "$.methodreturn": "(?i)^relay:\\s*pulseduration:\\s*get" }
      json: { v: "$.result.duration" }
      state: { relay_pulse_s: "{v}" }
    - json_match: { "$.methodreturn": "(?i)^relay:\\s*state:\\s*get\\s*([01])" }
      json: { v: "$.result.state" }
      state: { "relays.{1}.closed": "{v}" }
    - json_match: { "$.methodreturn": "(?i)^usbrouting:\\s*input:\\s*get" }
      json: { input: "$.result.input", host: "$.result.host" }
      state: { usb.input: "{input}", usb.host: "{host}" }
    - json_match: { "$.methodreturn": "(?i)^usbrouting:\\s*mode:\\s*get", "$.result.mode": "(?i)^(manual|autoswitch|follow)$" }
      json: {}
      state: { usb.mode: "{1:lower}" }
    - json_match: { "$.methodreturn": "(?i)^zone:\\s*portparams\\s*([12])" }
      json: { v: "$.result.params" }
      state: { "zones.{1}.params": "{v}" }

quirks:
  - models: [at-uhd-sw-510w]
    severity: info
    text: >
      Inferred for the AT-UHD-SW-510W: that the Telnet port is 23 (its document does not give it), that it
      takes OutputMode j as the MS52W does (the command appears in its ? listing without a page of its own),
      and how SetVol sta answers (read as the level under "volume" or "value"). It has no audio source read,
      bass, treble, broadcast, no-signal timeout, relay pulse or USB routing commands. Its REST commands
      (Wi-Fi fence, Wi-Fi station kick, maintenance reboot time) are in the atlona-sw510w-rest spec.
  - models: [all]
    severity: critical
    text: >
      factory_reset resets the unit at once, restart reboots it and shutdown powers it off; none of them is
      answered.
  - models: [all]
    severity: info
    text: >
      OutputMode j is sent on connecting so every JSON answer arrives on one line; the document prints the
      pretty form. Display:Minimal:Get, GetBroadcast, SetBroadcast and GetInputStates answer in plain text, and
      the matches for them are inferred from the document's single examples. The 500 ms the document asks for
      between commands is kept.
  - models: [all]
    severity: info
    text: >
      Inputs are numbered 0 (USB-C, port 1), 1 (DisplayPort, port 2), 2 and 3 (HDMI, ports 3 and 4) and 4 (BYOD)
      and outputs 0 (HDBaseT) and 1 (HDMI), as the document numbers them. Matrix routing needs Matrix Mode on
      (otherwise "Command Failure"). The document gives the parity values 0, 1 and 2 without naming them; none,
      odd and even is inferred. Relay states are the document's 0 and 1, without saying which is closed.
