                     description: "The item's description; empty removes it." }
    send: { method: PATCH, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}/items/{item_id}", content_type: application/json,
            body: '{"data":{"type":"Item","attributes":{"description":{description:json}}}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  delete_item:
    summary: Remove an item from a plan (Item delete)
    params:
