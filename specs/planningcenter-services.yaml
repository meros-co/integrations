telemetry:
  # Planning Center pushes nothing the documentation describes, so the
  # followed plan is polled every 10 seconds; replies to the reading commands
  # and LIVE actions go through the same rules.
  poll:
    - name: plan
      every_ms: 10000
      send:
        - { method: GET, path: "/services/v2/service_types/{settings.service_type_id}/plans/{settings.plan_id}/live",
            query: { include: "current_item_time,next_item_time" } }
        - { method: GET, path: "/services/v2/service_types/{settings.service_type_id}/plans/{settings.plan_id}" }
        - { method: GET, path: "/services/v2/service_types/{settings.service_type_id}/plans/{settings.plan_id}/items",
            query: { per_page: "100", include: "song,arrangement,key" }, pages: *pages }
        - { method: GET, path: "/services/v2/service_types/{settings.service_type_id}/plans/{settings.plan_id}/plan_times",
            query: { per_page: "100" }, pages: *pages }
    # What the account offers, the choices for the settings: the
    # organization, the signed-in person, the service types, and the chosen
    # service type's future plans.
    - name: account
      every_ms: 300000
      send:
        - { method: GET, path: /services/v2 }
        - { method: GET, path: /services/v2/me }
        - { method: GET, path: /services/v2/service_types, query: { per_page: "100" }, pages: *pages }
        - { method: GET, path: "/services/v2/service_types/{settings.service_type_id}/plans",
            query: { filter: future, order: sort_date, per_page: "25" } }
  updates:
    # The Live resource: from a read, or the reply to a LIVE action.
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/live(/(go_to_next_item|go_to_previous_item|toggle_control))?(\?.*)?$'
      json:
        title: "$.data.attributes.title"
        series_title: "$.data.attributes.series_title"
        dates: "$.data.attributes.dates"
        live_channel: "$.data.attributes.live_channel"
        chat_room_channel: "$.data.attributes.chat_room_channel"
        can_control: "$.data.attributes.can_control"
        can_take_control: "$.data.attributes.can_take_control"
        can_control_video_feed: "$.data.attributes.can_control_video_feed"
        can_chat: "$.data.attributes.can_chat"
        current: "$.data.relationships.current_item_time.data.id"
        next: "$.data.relationships.next_item_time.data.id"
        controller: "$.data.relationships.controller.data.id"
      state:
        plans.{1}.live.title: "{title}"
        plans.{1}.live.series_title: "{series_title}"
        plans.{1}.live.dates: "{dates}"
        plans.{1}.live.live_channel: "{live_channel}"
        plans.{1}.live.chat_room_channel: "{chat_room_channel}"
        plans.{1}.live.can_control: "{can_control}"
        plans.{1}.live.can_take_control: "{can_take_control}"
        plans.{1}.live.can_control_video_feed: "{can_control_video_feed}"
        plans.{1}.live.can_chat: "{can_chat}"
        plans.{1}.live.current_item_time_id: "{current}"
        plans.{1}.live.next_item_time_id: "{next}"
        plans.{1}.live.controller_id: "{controller}"
    # The current and next item times, included with the Live resource: each
    # Live reply holds them all, so it replaces the last one's, and an item
    # time that is no longer current or next leaves the state.
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/live(/(go_to_next_item|go_to_previous_item|toggle_control))?(\?.*)?$'
      json_each: "$.included"
      replace: plans.{1}.item_times
      json:
        id: "$.id"
        item: "$.relationships.item.data.id"
        plan_time: "$.relationships.plan_time.data.id"
        live_start_at: "$.attributes.live_start_at"
        live_end_at: "$.attributes.live_end_at"
        length: "$.attributes.length"
        length_offset: "$.attributes.length_offset"
        exclude: "$.attributes.exclude"
      state:
        plans.{1}.item_times.{id}.item_id: "{item}"
        plans.{1}.item_times.{id}.plan_time_id: "{plan_time}"
        plans.{1}.item_times.{id}.live_start_at: "{live_start_at}"
        plans.{1}.item_times.{id}.live_end_at: "{live_end_at}"
        plans.{1}.item_times.{id}.length: "{length}"
        plans.{1}.item_times.{id}.length_offset: "{length_offset}"
        plans.{1}.item_times.{id}.exclude: "{exclude}"
    - path: '^/services/v2/service_types/(\d+)/plans/(\d+)(\?.*)?$'
      json:
        title: "$.data.attributes.title"
        series_title: "$.data.attributes.series_title"
        dates: "$.data.attributes.dates"
        short_dates: "$.data.attributes.short_dates"
        sort_date: "$.data.attributes.sort_date"
        last_time_at: "$.data.attributes.last_time_at"
        total_length: "$.data.attributes.total_length"
        items_count: "$.data.attributes.items_count"
        url: "$.data.attributes.planning_center_url"
      state:
        plans.{2}.service_type_id: "{1}"
        plans.{2}.title: "{title}"
        plans.{2}.series_title: "{series_title}"
        plans.{2}.dates: "{dates}"
        plans.{2}.short_dates: "{short_dates}"
        plans.{2}.sort_date: "{sort_date}"
        plans.{2}.last_time_at: "{last_time_at}"
        plans.{2}.total_length: "{total_length}"
        plans.{2}.items_count: "{items_count}"
        plans.{2}.planning_center_url: "{url}"
    # A list of plans is filtered (future, past, no dates) and one page of up
    # to 100, never every plan, and plans.<id> also holds the followed plan's
    # LIVE session, items and times: it adds to plans and never replaces them.
    - path: '^/services/v2/service_types/(\d+)/plans(\?.*)?$'
      json_each: "$.data"
      json:
        id: "$.id"
        title: "$.attributes.title"
        series_title: "$.attributes.series_title"
        dates: "$.attributes.dates"
        short_dates: "$.attributes.short_dates"
        sort_date: "$.attributes.sort_date"
        last_time_at: "$.attributes.last_time_at"
        total_length: "$.attributes.total_length"
        items_count: "$.attributes.items_count"
        url: "$.attributes.planning_center_url"
      state:
        plans.{id}.service_type_id: "{1}"
        plans.{id}.title: "{title}"
        plans.{id}.series_title: "{series_title}"
        plans.{id}.dates: "{dates}"
        plans.{id}.short_dates: "{short_dates}"
        plans.{id}.sort_date: "{sort_date}"
        plans.{id}.last_time_at: "{last_time_at}"
        plans.{id}.total_length: "{total_length}"
        plans.{id}.items_count: "{items_count}"
        plans.{id}.planning_center_url: "{url}"
    # A plan's items. Read with every page joined, the list is complete
    # (top-level links with no next: the last page's), so it also replaces
    # the plan's items, by the rule after this one, and an item deleted from
    # the plan leaves the state. A list one page deep (another command's
    # page) is added to, never replaced.
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/items(\?.*)?$'
      json_each: "$.data"
      json:
        id: "$.id"
        title: "$.attributes.title"
        sequence: "$.attributes.sequence"
        length: "$.attributes.length"
        item_type: "$.attributes.item_type"
        service_position: "$.attributes.service_position"
        description: "$.attributes.description"
        key_name: "$.attributes.key_name"
        song: "$.relationships.song.data.id"
        arrangement: "$.relationships.arrangement.data.id"
        key: "$.relationships.key.data.id"
        custom_sequence: "$.attributes.custom_arrangement_sequence"
      state: &item_state
        plans.{1}.items.{id}.title: "{title}"
        plans.{1}.items.{id}.sequence: "{sequence}"
        plans.{1}.items.{id}.length: "{length}"
        plans.{1}.items.{id}.item_type: "{item_type}"
        plans.{1}.items.{id}.service_position: "{service_position}"
        plans.{1}.items.{id}.description: "{description}"
        plans.{1}.items.{id}.key_name: "{key_name}"
        plans.{1}.items.{id}.song_id: "{song}"
        plans.{1}.items.{id}.arrangement_id: "{arrangement}"
        plans.{1}.items.{id}.key_id: "{key}"
        plans.{1}.items.{id}.custom_arrangement_sequence: "{custom_sequence}"
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/items\?per_page='
      json_match: { "$.links": '^\{(?:"(?:[^n"]|n[^e"]|ne[^x"]|nex[^t"]|next[^"])[^"]*":"[^"]*",?)*\}$' }
      json: {}
      replace: plans.{1}.items
    # The songs, arrangements and keys included with the poll's items: the
    # whole list when it is complete.
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/items\?per_page=100&include='
      json_match: { "$.links": '^\{(?:"(?:[^n"]|n[^e"]|ne[^x"]|nex[^t"]|next[^"])[^"]*":"[^"]*",?)*\}$' }
      json: {}
      replace: ["plans.{1}.songs", "plans.{1}.arrangements", "plans.{1}.keys"]
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/items\?'
      json_each: "$.included"
      each_match: { "$.type": "^Song$" }
      json: { id: "$.id", title: "$.attributes.title", author: "$.attributes.author",
              ccli: "$.attributes.ccli_number", copyright: "$.attributes.copyright" }
      state:
        plans.{1}.songs.{id}.title: "{title}"
        plans.{1}.songs.{id}.author: "{author}"
        plans.{1}.songs.{id}.ccli_number: "{ccli}"
        plans.{1}.songs.{id}.copyright: "{copyright}"
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/items\?'
      json_each: "$.included"
      each_match: { "$.type": "^Arrangement$" }
      json: { id: "$.id", name: "$.attributes.name", bpm: "$.attributes.bpm", meter: "$.attributes.meter",
              length: "$.attributes.length", sequence: "$.attributes.sequence",
              chart_key: "$.attributes.chord_chart_key", chords: "$.attributes.has_chords", lyrics: "$.attributes.lyrics" }
      state:
        plans.{1}.arrangements.{id}.name: "{name}"
        plans.{1}.arrangements.{id}.bpm: "{bpm}"
        plans.{1}.arrangements.{id}.meter: "{meter}"
        plans.{1}.arrangements.{id}.length: "{length}"
        plans.{1}.arrangements.{id}.sequence: "{sequence}"
        plans.{1}.arrangements.{id}.chord_chart_key: "{chart_key}"
        plans.{1}.arrangements.{id}.has_chords: "{chords}"
        plans.{1}.arrangements.{id}.lyrics: "{lyrics}"
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/items\?'
      json_each: "$.included"
      each_match: { "$.type": "^Key$" }
      json: { id: "$.id", name: "$.attributes.name", start: "$.attributes.starting_key", end: "$.attributes.ending_key" }
      state:
        plans.{1}.keys.{id}.name: "{name}"
        plans.{1}.keys.{id}.starting_key: "{start}"
        plans.{1}.keys.{id}.ending_key: "{end}"
    # One item: a read, an update's reply, or a create's (no item id yet).
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/items(/\d+)?(\?.*)?$'
      json_match: { "$.data.type": "^Item$" }
      json:
        id: "$.data.id"
        title: "$.data.attributes.title"
        sequence: "$.data.attributes.sequence"
        length: "$.data.attributes.length"
        item_type: "$.data.attributes.item_type"
        service_position: "$.data.attributes.service_position"
        description: "$.data.attributes.description"
        key_name: "$.data.attributes.key_name"
        song: "$.data.relationships.song.data.id"
        arrangement: "$.data.relationships.arrangement.data.id"
        key: "$.data.relationships.key.data.id"
        custom_sequence: "$.data.attributes.custom_arrangement_sequence"
      state: *item_state
    # Each item change of the integration's own reads the plan's items again.
    - path: '^/services/v2/service_types/(\d+)/plans/(\d+)/(items(/\d+)?|item_reorder)$'
      json: {}
      then_send:
        - { method: GET, path: "/services/v2/service_types/{1}/plans/{2}/items",
            query: { per_page: "100", include: "song,arrangement,key" }, pages: *pages }
    # A plan's times; a complete list (no next link) replaces the last, by
    # the rule after this one.
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/plan_times(\?.*)?$'
      json_each: "$.data"
      json:
        id: "$.id"
        name: "$.attributes.name"
        time_type: "$.attributes.time_type"
        starts_at: "$.attributes.starts_at"
        ends_at: "$.attributes.ends_at"
        live_starts_at: "$.attributes.live_starts_at"
        live_ends_at: "$.attributes.live_ends_at"
      state:
        plans.{1}.plan_times.{id}.name: "{name}"
        plans.{1}.plan_times.{id}.time_type: "{time_type}"
        plans.{1}.plan_times.{id}.starts_at: "{starts_at}"
        plans.{1}.plan_times.{id}.ends_at: "{ends_at}"
        plans.{1}.plan_times.{id}.live_starts_at: "{live_starts_at}"
        plans.{1}.plan_times.{id}.live_ends_at: "{live_ends_at}"
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/plan_times\?per_page='
      json_match: { "$.links": '^\{(?:"(?:[^n"]|n[^e"]|ne[^x"]|nex[^t"]|next[^"])[^"]*":"[^"]*",?)*\}$' }
      json: {}
      replace: plans.{1}.plan_times
    # A created or changed plan time; each change reads the times again.
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/plan_times(/\d+)?$'
      json_match: { "$.data.type": "^PlanTime$" }
      json:
        id: "$.data.id"
        name: "$.data.attributes.name"
        time_type: "$.data.attributes.time_type"
        starts_at: "$.data.attributes.starts_at"
        ends_at: "$.data.attributes.ends_at"
        live_starts_at: "$.data.attributes.live_starts_at"
        live_ends_at: "$.data.attributes.live_ends_at"
      state:
        plans.{1}.plan_times.{id}.name: "{name}"
        plans.{1}.plan_times.{id}.time_type: "{time_type}"
        plans.{1}.plan_times.{id}.starts_at: "{starts_at}"
        plans.{1}.plan_times.{id}.ends_at: "{ends_at}"
        plans.{1}.plan_times.{id}.live_starts_at: "{live_starts_at}"
        plans.{1}.plan_times.{id}.live_ends_at: "{live_ends_at}"
    - path: '^/services/v2/service_types/(\d+)/plans/(\d+)/plan_times/\d+$'
      json: {}
      then_send:
        - { method: GET, path: "/services/v2/service_types/{1}/plans/{2}/plan_times", query: { per_page: "100" }, pages: *pages }
    # A created plan.
    - path: '^/services/v2/service_types/(\d+)/plans$'
      json_match: { "$.data.type": "^Plan$" }
      json:
        id: "$.data.id"
        title: "$.data.attributes.title"
        series_title: "$.data.attributes.series_title"
        dates: "$.data.attributes.dates"
        url: "$.data.attributes.planning_center_url"
      state:
        plans.{id}.service_type_id: "{1}"
        plans.{id}.title: "{title}"
        plans.{id}.series_title: "{series_title}"
        plans.{id}.dates: "{dates}"
        plans.{id}.planning_center_url: "{url}"
    # Item notes: a list replaces the item's notes; a create or update adds
    # one; a change reads the list again.
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/items/(\d+)/item_notes\?'
      json_each: "$.data"
      json: { id: "$.id", category: "$.attributes.category_name", content: "$.attributes.content" }
      replace: "plans.{1}.item_notes.{2}"
      state:
        plans.{1}.item_notes.{2}.{id}.category: "{category}"
        plans.{1}.item_notes.{2}.{id}.content: "{content}"
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/items/(\d+)/item_notes(/\d+)?$'
      json_match: { "$.data.type": "^ItemNote$" }
      json: { id: "$.data.id", category: "$.data.attributes.category_name", content: "$.data.attributes.content" }
      state:
        plans.{1}.item_notes.{2}.{id}.category: "{category}"
        plans.{1}.item_notes.{2}.{id}.content: "{content}"
    - path: '^/services/v2/service_types/(\d+)/plans/(\d+)/items/(\d+)/item_notes/\d+$'
      json: {}
      then_send:
        - { method: GET, path: "/services/v2/service_types/{1}/plans/{2}/items/{3}/item_notes", query: { per_page: "100" }, pages: *pages }
    # Plan notes, the same way.
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/notes\?'
      json_each: "$.data"
      json: { id: "$.id", category: "$.attributes.category_name", content: "$.attributes.content" }
      replace: "plans.{1}.notes"
      state:
        plans.{1}.notes.{id}.category: "{category}"
        plans.{1}.notes.{id}.content: "{content}"
    - path: '^/services/v2/service_types/\d+/plans/(\d+)/notes(/\d+)?$'
      json_match: { "$.data.type": "^PlanNote$" }
      json: { id: "$.data.id", category: "$.data.attributes.category_name", content: "$.data.attributes.content" }
      state:
        plans.{1}.notes.{id}.category: "{category}"
        plans.{1}.notes.{id}.content: "{content}"
    - path: '^/services/v2/service_types/(\d+)/plans/(\d+)/notes/\d+$'
      json: {}
      then_send:
        - { method: GET, path: "/services/v2/service_types/{1}/plans/{2}/notes", query: { per_page: "100" }, pages: *pages }
    # The organization (the API root): get_organization, the poll and the
    # probe.
    - path: '^/services/v2$'
      json_match: { "$.data.type": "^Organization$" }
      json:
        id: "$.data.id"
        name: "$.data.attributes.name"
        owner: "$.data.attributes.owner_name"
        zone: "$.data.attributes.time_zone"
        clock24: "$.data.attributes.twenty_four_hour_time"
        date_format: "$.data.attributes.date_format"
        ccli: "$.data.attributes.ccli"
      state:
        organization.id: "{id}"
        organization.name: "{name}"
        organization.owner_name: "{owner}"
        organization.time_zone: "{zone}"
        organization.twenty_four_hour_time: "{clock24}"
        organization.date_format: "{date_format}"
        organization.ccli: "{ccli}"
    # The person the credential acts as: get_me and the poll.
    - path: '^/services/v2/me$'
      json_match: { "$.data.type": "^Person$" }
      json:
        id: "$.data.id"
        first: "$.data.attributes.first_name"
        last: "$.data.attributes.last_name"
        full: "$.data.attributes.full_name"
        photo: "$.data.attributes.photo_thumbnail_url"
        plans: "$.data.attributes.plan_permissions"
        songs: "$.data.attributes.song_permissions"
        media: "$.data.attributes.media_permissions"
        view_all: "$.data.attributes.can_view_all_people"
        edit_all: "$.data.attributes.can_edit_all_people"
      state:
        me.id: "{id}"
        me.first_name: "{first}"
        me.last_name: "{last}"
        me.full_name: "{full}"
        me.photo_thumbnail_url: "{photo}"
        me.plan_permissions: "{plans}"
        me.song_permissions: "{songs}"
        me.media_permissions: "{media}"
        me.can_view_all_people: "{view_all}"
        me.can_edit_all_people: "{edit_all}"
    # The service types; a complete list (no next link) replaces the last,
    # by the rule after this one.
    - path: '^/services/v2/service_types(\?.*)?$'
      json_each: "$.data"
      json:
        id: "$.id"
        name: "$.attributes.name"
      state:
        service_types.{id}.name: "{name}"
    - path: '^/services/v2/service_types(\?.*)?$'
      json_match: { "$.links": '^\{(?:"(?:[^n"]|n[^e"]|ne[^x"]|nex[^t"]|next[^"])[^"]*":"[^"]*",?)*\}$' }
      json: {}
      replace: service_types
