spec: 1
id: planningcenter-services
name: Planning Center Services LIVE (Services API v2)
vendor: Planning Center
category: other

# A cloud service, not a device on the venue network: the integration is
# opened with host api.planningcenteronline.com on port 443, and follows one
# plan's LIVE session, named by the service_type_id and plan_id settings,
# which may be chosen after opening. The
# consumer owns the credential: a Personal Access Token (HTTP Basic with its
# application id and secret), or OAuth tokens from its own sign-in, which the
# core keeps fresh with the refresh token and reports as credentials events.
# The core never runs a sign-in.

source:
  - title: Planning Center Services API, version 2018-11-01 (API documentation graph)
    author: Planning Center
    url: https://api.planningcenteronline.com/services/v2/documentation/2018-11-01
    note: >
      Manufacturer document, retrieved 2026-10-04: the machine-readable form of
      https://developer.planning.center/docs/#/apps/services. Vertices used:
      Live (attributes can_chat, can_control, can_control_video_feed,
      can_take_control, chat_room_channel, dates, live_channel, series_title,
      title; actions go_to_next_item, go_to_previous_item, toggle_control;
      includes controller, current_item_time, items, next_item_time,
      service_type), ItemTime (exclude, length, length_offset, live_start_at,
      live_end_at; relationships item, plan_time, plan), Item (title,
      sequence, length, item_type, service_position, description, key_name,
      html_details; edge item_notes), Plan (title, series_title, dates,
      short_dates, sort_date, last_time_at, total_length, items_count,
      planning_center_url; edges items, plan_times, live, next_plan,
      previous_plan), PlanTime (name, time_type, starts_at, ends_at,
      live_starts_at, live_ends_at), ServiceType (name; edges plans with
      filters after, before, future, no_dates and past, live_controllers),
      and the per_page (1 to 100, default 25) and offset parameters.
      Retrieved again 2026-10-14 for the writes and the song and media
      vertices: Plan (create title, public, series_id, series_title; update
      also reminders_disabled; destroy; action item_reorder, a POST of
      PlanItemReorder with sequence, answering 204; actions import and
      autoschedule), Item (create assignable arrangement_id,
      custom_arrangement_sequence, description, html_details, key_id,
      length, selected_layout_id, service_position, song_id, title,
      item_type (header only), sequence; update the same but item_type and
      sequence; includes song, arrangement, key), ItemNote and PlanNote
      (content, with an item_note_category or plan_note_category), the
      ItemNoteCategory and PlanNoteCategory lists, PlanTime (starts_at,
      ends_at, name, time_type, team_reminders), Song (title, author,
      ccli_number, copyright, themes; where[title] and other queries),
      Arrangement (bpm, meter, length, sequence, lyrics, chord_chart,
      chord_chart_key, has_chords; edges keys, sections, attachments), Key
      (starting_key, ending_key, alternate_keys), Media (media_type, title,
      length, preview and thumbnail URLs; edge attachments) and Attachment
      (action open answering attachment_url in an AttachmentActivity).
  - title: Planning Center API documentation, Overview (Authentication, Rate Limiting, Versioning)
    author: Planning Center
    url: https://developer.planning.center/docs/#/overview/authentication
    note: >
      Manufacturer document, retrieved 2026-10-04. Two ways to authenticate:
      a Personal Access Token, sent as HTTP Basic with the application id and
      secret, and OAuth 2, sent as a Bearer token; OAuth access tokens expire
      2 hours after issue and are renewed with a refresh token. Rate limiting:
      usually 100 requests per 20 seconds per user, subject to change, with
      X-PCO-API-Request-Rate-Limit, -Rate-Period and -Rate-Count headers and
      HTTP 429 with Retry-After when exceeded. Versioning: an
      X-PCO-API-Version header, else the application's default version.
  - title: Planning Center API documentation, Overview (Authentication, Current User; Specifying a User-Agent Header)
    author: Planning Center
    url: https://developer.planning.center/docs/#/overview/authentication/current-user
    note: >
      Manufacturer document, retrieved 2026-10-28. To identify the current
      user, the /me endpoint in any application API (or /current/v2/me of
      the Current API); in an application API it needs that application's
      OAuth scope and applies the user's access and permissions there. The
      Services API's /me is therefore /services/v2/me; its answer is taken
      to be the Services Person resource (attributes from the Person vertex
      of the 2018-11-01 documentation graph: first_name, last_name,
      full_name, photo_thumbnail_url, plan_permissions, song_permissions,
      media_permissions, can_view_all_people, can_edit_all_people). Every
      request must carry a User-Agent naming the application (its name and
      a link or contact address), and may be answered 403 without one. The
      Organization vertex (the API root, /services/v2): name, owner_name,
      time_zone, twenty_four_hour_time, date_format, ccli.
  - title: pco_api_oauth_example_sinatra_ruby (app.rb), MIT licence
    author: Planning Center (Ministry Centered Technologies)
    url: https://github.com/planningcenter/pco_api_oauth_example_sinatra_ruby
    note: >
      Planning Center's own example, read for corroboration only. Its OAuth
      client's site is https://api.planningcenteronline.com with the oauth2
      library's default token path, /oauth/token, and it refreshes a token
      that has a refresh token when it is within 300 seconds of expiring.
  - title: RFC 6749, The OAuth 2.0 Authorization Framework, section 6 (Refreshing an Access Token) and 5.2 (Error Response)
    author: IETF
    url: https://www.rfc-editor.org/rfc/rfc6749
    note: >
      The refresh request, the client authentication of section 2.3.1, a new
      refresh token in the answer replacing the old one, and invalid_grant.
  - title: companion-module-planningcenter-serviceslive (src/api.js), MIT licence
    author: Bitfocus contributors
    url: https://github.com/bitfocus/companion-module-planningcenter-serviceslive
    note: >
      Community code, read for corroboration only; no command comes from it.
      Corroborates that the LIVE actions are POSTs to
      /service_types/{id}/plans/{id}/live/<action> (the documentation graph
      prints them under a series path with a live id), that their reply is the
      Live resource, that include=current_item_time works on them, and that a
      plan can only be moved by the person in control (toggle_control).
  - title: pco_api_ruby (README.md), MIT licence
    author: Planning Center (Ministry Centered Technologies)
    url: https://github.com/planningcenter/pco_api_ruby
    note: >
      Planning Center's own API client, read for corroboration only. Its
      README shows a paged list response: top-level links with self and, when
      another page follows, next (with the offset), and meta with total_count,
      count and next. A list without a next link is taken to be complete.

transport:
  type: http
  port: 443
  scheme: https
  # Basic for a Personal Access Token; oauth2 for OAuth tokens, the access
  # token sent as Bearer and refreshed at the token endpoint.
  auth: { setting: auth }
  oauth:
    token_url: https://api.planningcenteronline.com/oauth/token
    refresh_ahead_s: 300
    client_auth: body
  # 403 is a permission answer (a plan this user can't see or control), not a
  # refused credential; only 401 is.
  refusal_status: [401]
  headers:
    X-PCO-API-Version: "2018-11-01"
    # Planning Center wants every request to name the application.
    User-Agent: "{settings.user_agent}"
  timeout_ms: 10000
  # The organization: answers any valid credential, and nothing else.
  probe: { method: GET, path: /services/v2 }

settings:
  auth: { type: enum, values: [basic, oauth2], default: basic,
          label: Credential type,
          description: "basic for a Personal Access Token (application id and secret), oauth2 for OAuth tokens from the consumer's own sign-in, refreshed by the core." }
  username: { type: string, max_length: 256, default: "",
              label: Application ID,
              description: "The Personal Access Token's application id, from api.planningcenteronline.com/oauth/applications; used when the credential type is basic." }
  password: { type: string, secret: true, max_length: 256, default: "",
              label: Secret,
              description: "The Personal Access Token's secret; used when the credential type is basic." }
  client_id: { type: string, max_length: 512, default: "",
               label: OAuth client ID,
               description: "The consumer's own Planning Center OAuth application's client id, sent with each token refresh; used when the credential type is oauth2." }
  client_secret: { type: string, secret: true, max_length: 512, default: "",
                   label: OAuth client secret,
                   description: "The OAuth application's secret, sent with each token refresh when set; leave empty when token_url names a proxy that adds it." }
  refresh_token: { type: string, secret: true, max_length: 4096, default: "",
                   label: Refresh token,
                   description: "The refresh token from the consumer's sign-in; with it the core keeps the access token fresh, and without it the access token is used until Planning Center refuses it." }
  access_token: { type: string, secret: true, max_length: 4096, default: "",
                  label: Access token,
                  description: "The current OAuth access token, which expires 2 hours after issue; may be left empty when a refresh token is given, and the core reports each new one in a credentials event." }
  expires_at: { type: int, min: 0,
                label: Access token expiry,
                description: "When the access token expires, in Unix seconds; the core refreshes 5 minutes before, and reports each new expiry in a credentials event." }
  token_url: { type: string, max_length: 2048, default: "",
               pattern: "^(https://[^\\s]+|http://(localhost|127\\.0\\.0\\.1|\\[::1\\])(:[0-9]+)?(/[^\\s]*)?)?$",
               label: Token endpoint override,
               description: "A token endpoint to refresh at instead of Planning Center's, such as the consumer's own token proxy that holds the client secret; https, or http to this machine only. Empty uses Planning Center's." }
  user_agent: { type: string, max_length: 256, default: "Meros integrations (https://github.com/meros-co/integrations)",
                label: User-Agent,
                description: "The User-Agent sent with every request, naming the application: Planning Center asks for the application's name and a link or contact address, and may answer 403 without one." }
  service_type_id: { type: string, pattern: "^[0-9]+$", max_length: 20,
                     select: { command: list_service_types, id: $.id, label: $.attributes.name },
                     label: Service type ID,
                     description: "The numeric id of the service type that holds the plan to follow, as in the plan's Planning Center URL or list_service_types; may be left empty on opening and chosen later with update_settings." }
  plan_id: { type: string, pattern: "^[0-9]+$", max_length: 20,
             select: { command: list_plans, id: $.id, label: $.attributes.title,
                       params: { service_type_id: service_type_id } },
             label: Plan ID,
             description: "The numeric id of the plan whose LIVE session is followed and controlled, as in the plan's Planning Center URL or list_plans; may be left empty on opening and chosen later with update_settings." }

ports:
  - { port: 443, protocol: https, role: control, note: "the cloud API at api.planningcenteronline.com, opened by that host name" }

models:
  - id: services-v2
    name: Planning Center Services API v2 (version 2018-11-01)
    supports: [go_to_next_item, go_to_previous_item, toggle_control, get_live,
               get_organization, get_me, list_service_types, list_live_controllers,
               list_plans, get_plan, get_next_plan, get_previous_plan,
               list_items, get_item, list_item_notes, list_plan_times,
               create_plan, update_plan, set_plan_title, delete_plan,
               create_item, create_header, update_item, set_item_title, set_item_length,
               set_item_description, delete_item, reorder_items,
               list_item_note_categories, create_item_note, update_item_note, delete_item_note,
               list_plan_note_categories, list_plan_notes, create_plan_note, update_plan_note, delete_plan_note,
               create_plan_time, update_plan_time, delete_plan_time,
               list_songs, search_songs, get_song, list_arrangements, get_arrangement,
               list_arrangement_keys, list_arrangement_sections,
               list_media, get_media, list_media_attachments, get_item_media, list_item_attachments,
               list_plan_attachments, list_song_attachments, open_media_attachment, open_item_attachment]
    verification: none
    notes: >
      Version 2018-11-01 is the current version of the Services API. The
      integration follows the plan named by its settings, which may be
      chosen after opening and changed with update_settings.

commands:
  # ── LIVE control, on the plan the integration follows ────────────────────
  go_to_next_item:
    summary: Advance the plan's LIVE session to the next item (Live action go_to_next_item); needs control of the session
    send: { method: POST, path: "/services/v2/service_types/{settings.service_type_id}/plans/{settings.plan_id}/live/go_to_next_item",
            query: { include: "current_item_time,next_item_time" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  go_to_previous_item:
    summary: Move the plan's LIVE session back to the previous item (Live action go_to_previous_item); needs control of the session
    send: { method: POST, path: "/services/v2/service_types/{settings.service_type_id}/plans/{settings.plan_id}/live/go_to_previous_item",
            query: { include: "current_item_time,next_item_time" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  toggle_control:
    summary: Take control of the plan's LIVE session, or give it up when this user holds it (Live action toggle_control)
    send: { method: POST, path: "/services/v2/service_types/{settings.service_type_id}/plans/{settings.plan_id}/live/toggle_control",
            query: { include: "current_item_time,next_item_time" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_live:
    summary: The plan's LIVE session with its current and next item times (Live, include current_item_time and next_item_time)
    send: { method: GET, path: "/services/v2/service_types/{settings.service_type_id}/plans/{settings.plan_id}/live",
            query: { include: "current_item_time,next_item_time" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  # ── Reading plans ────────────────────────────────────────────────────────
  get_organization:
    summary: The organization the credential belongs to (Organization, the API root)
    send: { method: GET, path: /services/v2 }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_me:
    summary: The person the credential acts as, in Services, with their permissions (the /me endpoint, a Person)
    send: { method: GET, path: /services/v2/me }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  list_service_types:
    summary: The organization's service types, every page (ServiceType list)
    send: { method: GET, path: /services/v2/service_types, query: { per_page: "100" }, pages: &pages { items: ["$.data", "$.included"], next: "$.links.next" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  list_live_controllers:
    summary: The people who can control LIVE for a service type (ServiceType edge live_controllers)
    params:
      service_type_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                         label: Service type ID,
                         description: "The numeric id of the service type." }
    send: { method: GET, path: "/services/v2/service_types/{service_type_id}/live_controllers", query: { per_page: "100" }, pages: *pages }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  list_plans:
    summary: A service type's plans, filtered and ordered (ServiceType edge plans, filter future, past or no_dates)
    params:
      service_type_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                         label: Service type ID,
                         description: "The numeric id of the service type whose plans are listed." }
      filter: { type: enum, values: [future, past, no_dates], default: future,
                label: Filter,
                description: "future for plans still to come, past for those already held, no_dates for plans without a time." }
      order: { type: enum, values: [sort_date, -sort_date, title, -title, created_at, -created_at, updated_at, -updated_at], default: sort_date,
               label: Order,
               description: "The attribute plans are sorted by; a leading minus sorts it descending." }
      per_page: { type: int, min: 1, max: 100, default: 25,
                  label: Plans per page,
                  description: "How many plans to return, from 1 to 100." }
    send: { method: GET, path: "/services/v2/service_types/{service_type_id}/plans",
            query: { filter: "{filter}", order: "{order}", per_page: "{per_page}" } }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_plan:
    summary: One plan (Plan)
    params:
      service_type_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                         label: Service type ID,
                         description: "The numeric id of the service type that holds the plan." }
      plan_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                 label: Plan ID,
                 description: "The numeric id of the plan." }
    send: { method: GET, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}" }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_next_plan:
    summary: The plan after this one in its service type (Plan edge next_plan)
    params:
      service_type_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                         label: Service type ID,
                         description: "The numeric id of the service type that holds the plan." }
      plan_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                 label: Plan ID,
                 description: "The numeric id of the plan whose successor is wanted." }
    send: { method: GET, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}/next_plan" }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_previous_plan:
    summary: The plan before this one in its service type (Plan edge previous_plan)
    params:
      service_type_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                         label: Service type ID,
                         description: "The numeric id of the service type that holds the plan." }
      plan_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                 label: Plan ID,
                 description: "The numeric id of the plan whose predecessor is wanted." }
    send: { method: GET, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}/previous_plan" }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  list_items:
    summary: A plan's items, every page, each with its sequence (Plan edge items)
    params:
      service_type_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                         label: Service type ID,
                         description: "The numeric id of the service type that holds the plan." }
      plan_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                 label: Plan ID,
                 description: "The numeric id of the plan whose items are listed." }
    send: { method: GET, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}/items", query: { per_page: "100" }, pages: *pages }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  get_item:
    summary: One item of a plan (Item)
    params:
      service_type_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                         label: Service type ID,
                         description: "The numeric id of the service type that holds the plan." }
      plan_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                 label: Plan ID,
                 description: "The numeric id of the plan that holds the item." }
      item_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                 label: Item ID,
                 description: "The numeric id of the item." }
    send: { method: GET, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}/items/{item_id}" }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  list_item_notes:
    summary: An item's notes, such as lighting or camera notes, every page (Item edge item_notes)
    params:
      service_type_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                         label: Service type ID,
                         description: "The numeric id of the service type that holds the plan." }
      plan_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                 label: Plan ID,
                 description: "The numeric id of the plan that holds the item." }
      item_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                 label: Item ID,
                 description: "The numeric id of the item whose notes are listed." }
    send: { method: GET, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}/items/{item_id}/item_notes", query: { per_page: "100" }, pages: *pages }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  list_plan_times:
    summary: A plan's times (services, rehearsals and others) with the start and end LIVE recorded (Plan edge plan_times)
    params:
      service_type_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                         label: Service type ID,
                         description: "The numeric id of the service type that holds the plan." }
      plan_id: { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                 label: Plan ID,
                 description: "The numeric id of the plan whose times are listed." }
    send: { method: GET, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}/plan_times", query: { per_page: "100" }, pages: *pages }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  # ── Editing plans ────────────────────────────────────────────────────────
  create_plan:
    summary: Create a plan in a service type with Plan attributes (title, public, series_id, series_title)
    params:
      service_type_id: &st { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                             label: Service type ID,
                             description: "The numeric id of the service type that holds the plan." }
      attributes: { type: json, required: true,
                    label: Attributes,
                    description: "A JSON object of the Plan attributes Planning Center lets a create assign: title, public, series_id, series_title." }
    send: { method: POST, path: "/services/v2/service_types/{service_type_id}/plans", content_type: application/json,
            body: '{"data":{"type":"Plan","attributes":{attributes}}}' }
    expect: { status: 201, json_path: "$.data" }
    returns: value

  update_plan:
    summary: Change a plan's attributes (title, public, series_id, series_title, reminders_disabled)
    params:
      service_type_id: *st
      plan_id: &plan { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                       label: Plan ID,
                       description: "The numeric id of the plan." }
      attributes: { type: json, required: true,
                    label: Attributes,
                    description: "A JSON object of the Plan attributes to change, as Planning Center documents them; others are unchanged." }
    send: { method: PATCH, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}", content_type: application/json,
            body: '{"data":{"type":"Plan","attributes":{attributes}}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  set_plan_title:
    summary: Change a plan's title (Plan title)
    params:
      service_type_id: *st
      plan_id: *plan
      title: { type: string, max_length: 255, required: true,
               label: Title,
               description: "The plan's new title; empty removes it." }
    send: { method: PATCH, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}", content_type: application/json,
            body: '{"data":{"type":"Plan","attributes":{"title":{title:json}}}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  delete_plan:
    summary: Delete a plan with its items, times and notes (Plan delete)
    params:
      service_type_id: *st
      plan_id: *plan
    send: { method: DELETE, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}" }
    expect: { status: 204 }
    returns: ack

  # ── Editing items ────────────────────────────────────────────────────────
  create_item:
    summary: Add an item to a plan with Item attributes (title, length, description, html_details, service_position, sequence, song_id, arrangement_id, key_id, custom_arrangement_sequence, selected_layout_id, item_type header)
    params:
      service_type_id: *st
      plan_id: *plan
      attributes: { type: json, required: true,
                    label: Attributes,
                    description: "A JSON object of the Item attributes a create may assign; a song item is made by giving song_id, and item_type takes only header." }
    send: { method: POST, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}/items", content_type: application/json,
            body: '{"data":{"type":"Item","attributes":{attributes}}}' }
    expect: { status: 201, json_path: "$.data" }
    returns: value

  create_header:
    summary: Add a header to a plan, a section title between items (Item create, item_type header)
    params:
      service_type_id: *st
      plan_id: *plan
      title: { type: string, pattern: "\\S", max_length: 255, required: true,
               label: Title,
               description: "The header's text." }
    send: { method: POST, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}/items", content_type: application/json,
            body: '{"data":{"type":"Item","attributes":{"title":{title:json},"item_type":"header"}}}' }
    expect: { status: 201, json_path: "$.data" }
    returns: value

  update_item:
    summary: Change an item's attributes (title, length, description, html_details, service_position, song_id, arrangement_id, key_id, custom_arrangement_sequence, selected_layout_id)
    params:
      service_type_id: *st
      plan_id: *plan
      item_id: &item { type: string, pattern: "^[0-9]+$", max_length: 20, required: true,
                       label: Item ID,
                       description: "The numeric id of the item." }
      attributes: { type: json, required: true,
                    label: Attributes,
                    description: "A JSON object of the Item attributes to change, as Planning Center documents them; others are unchanged." }
    send: { method: PATCH, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}/items/{item_id}", content_type: application/json,
            body: '{"data":{"type":"Item","attributes":{attributes}}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  set_item_title:
    summary: Change an item's title (Item title)
    params:
      service_type_id: *st
      plan_id: *plan
      item_id: *item
      title: { type: string, pattern: "\\S", max_length: 255, required: true,
               label: Title,
               description: "The item's new title." }
    send: { method: PATCH, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}/items/{item_id}", content_type: application/json,
            body: '{"data":{"type":"Item","attributes":{"title":{title:json}}}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  set_item_length:
    summary: Change an item's planned length (Item length)
    params:
      service_type_id: *st
      plan_id: *plan
      item_id: *item
      length: { type: int, min: 0, max: 86400, required: true,
                label: Length,
                description: "The item's planned length in seconds." }
    send: { method: PATCH, path: "/services/v2/service_types/{service_type_id}/plans/{plan_id}/items/{item_id}", content_type: application/json,
            body: '{"data":{"type":"Item","attributes":{"length":{length}}}}' }
    expect: { status: 200, json_path: "$.data" }
    returns: value

  set_item_description:
    summary: Change an item's description (Item description)
    params:
      service_type_id: *st
      plan_id: *plan
      item_id: *item
      description: { type: string, max_length: 10000, required: true,
