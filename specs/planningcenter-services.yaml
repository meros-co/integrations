quirks:
  - models: [all]
    severity: info
    text: >
      A cloud service. Open the integration with host
      api.planningcenteronline.com and port 443; it is reached over HTTPS and
      the certificate is checked against that name. The plan followed and
      controlled is the one named by the service_type_id and plan_id settings
      (both in the plan's Planning Center URL). Both may be left empty on
      opening: the organization, the signed-in person and the service types
      are still read, list_service_types lists the service types to choose
      from, and once service_type_id is set, list_plans (and the poll of
      that type's future plans) the plans; each id chosen is passed with
      update_settings, which reads what it names at once. Until plan_id is
      set the LIVE commands fail saying so. Changing either follows another
      plan without reopening. Reading commands take any ids.

  - models: [all]
    severity: warning
    text: >
      The consumer owns the credential. A Personal Access Token is the
      application id and secret, sent as Basic (credential type basic). With
      credential type oauth2 the consumer registers its own OAuth
      application, runs the sign-in and passes client_id, client_secret,
      refresh_token, access_token and expires_at; the access token (2 hours
      long) is sent as Bearer and refreshed at
      api.planningcenteronline.com/oauth/token 5 minutes before it expires,
      or at once when there is none, and each new token is reported in a
      credentials event that the consumer must persist (a refresh token
      Planning Center replaces included). A 401 refreshes the token and sends
      the request once more; a second 401, a refused refresh
      (invalid_grant), or a 401 with a Personal Access Token, is terminal:
      the integration reports unauthorized, commands fail with auth, and
      nothing more is sent until the consumer passes corrected settings with
      update_settings. Without a refresh token the access token is used
      until refused. A 403 (a plan this user can't see or control) is an
      ordinary command failure, not a refusal.

  - models: [all]
    severity: warning
    text: >
      Only the person in control of the LIVE session can move it. Before
      go_to_next_item or go_to_previous_item, the credential's user takes
      control with toggle_control. toggle_control is a toggle: when this user
      already has control it gives it up, and when someone else has it, it
      takes it from them, so an operator running LIVE on another screen
      loses control mid-service. Check the session's controller first.

  - models: [all]
    severity: warning
    text: >
      Planning Center limits the API to about 100 requests per 20 seconds
      per user (subject to change), shared by every application acting as
      that user, and answers 429 with Retry-After when it is exceeded; a 429
      fails the command that met it. The followed plan is polled every 10
      seconds with four requests (the LIVE session, the plan, its items and
      its times), about 8 per 20 seconds; the organization, the signed-in
      person, the service types and the chosen service type's future plans
      every 5 minutes; plus a probe of the organization when the
      integration has been idle for 10 seconds.

  - models: [all]
    severity: info
    text: >
      State is polled, so a change made in Planning Center (another
      operator advancing LIVE) shows up within about 10 seconds. The replies
      to this integration's own LIVE actions update state at once. Planning
      Center's own LIVE view is pushed over a realtime channel named by the
      Live resource's live_channel attribute, but the API documentation does
      not describe that channel or how to subscribe to it, so it isn't used;
      live_channel is kept in state for a consumer that can. Webhooks would
      need a public HTTP listener, which the core does not run.

  - models: [all]
    severity: info
    text: >
      State is keyed by Planning Center ids: plans, and under each plan its
      items, plan times and item times. The plan's current and next item
      times are named in plans.<plan_id>.live, and each item time names its
      item, so the current item is
      plans.<plan_id>.items.<plans.<plan_id>.item_times.<current_item_time_id>.item_id>.
      Countdowns are computed by the consumer from live_start_at and length;
      Planning Center reports times, not a running clock. Each read of a
      plan's items or times replaces the last, so an item deleted from the
      plan leaves the state; each Live reply replaces the plan's item times
      with the current and next ones. Lists are read whole: the core follows
      each answer's next link (100 a page) and joins the pages into one
      reply, so a plan of any length is kept whole, and the list commands
      return every entry. Plans read with list_plans (one page, filtered)
      and the song and media libraries (list_songs, list_media, a page at a
      time with offset) are added to and never removed.

  - models: [all]
    severity: info
    text: >
      Every request names the API version this spec is written from in the
      X-PCO-API-Version header (2018-11-01), so an application whose default
      version is another one is answered as documented here.

  - models: [all]
    severity: info
    text: >
      Times are kept as Planning Center sends them. The documentation gives
      ISO 8601 (2000-01-01T12:00:00Z); LIVE's item and plan times have been
      seen in the form 2026/06/16 11:24:29 -0500 instead.

  - models: [all]
    severity: info
    text: >
      Not offered, because the API has no such action: LIVE chat and video
      feed control (the documentation describes chat_room_channel and
      can_control_video_feed but no actions for them) and resetting a plan's
      recorded LIVE times. Not built, being scheduling rather than the
      running of a service: team scheduling (autoschedule, plan people), plan
      import from a template, tags, and file uploads (which go to Planning
      Center's separate upload service).

  - models: [all]
    severity: info
    text: >
      Plans, items, notes and plan times are edited with JSON:API bodies
      ({"data": {"type": ..., "attributes": {...}}}); the commands that take
      attributes send only what they are given, and Planning Center leaves
      the rest unchanged. Writes need the editor permission on the service
      type. An item's song, arrangement and key are set with song_id,
      arrangement_id and key_id in its attributes; item_type can only be set
      to header, on create. reorder_items takes every item id of the plan in
      the new order. Each change to the followed plan's items, notes or
      times reads that list again, so state follows at once; a change to
      another plan shows when that plan is read.

  - models: [all]
    severity: critical
    text: >
      delete_plan deletes a plan with its items, times, notes and people,
      and delete_item, delete_plan_time and the note deletes remove what
      they name; none can be undone. Editing the plan LIVE is running
      changes what every operator and musician sees at once.

  - models: [all]
    severity: info
    text: >
      The followed plan's items are read with their songs, arrangements and
      keys included, so state holds what the band plays: each item's
      song_id, arrangement_id and key_id, and under the plan the songs
      (title, author, CCLI number), arrangements (name, BPM, meter, length,
      sequence, chord chart key, lyrics) and keys (starting and ending key).
      An item's custom_arrangement_sequence overrides its arrangement's
      sequence when not empty. Item notes and plan notes are kept from
      list_item_notes and list_plan_notes and from each change, not polled.
      The song and media libraries are read on demand and not kept;
      open_media_attachment and open_item_attachment answer a short-lived
      download URL for a file.

