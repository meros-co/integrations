    - match: '^[\x02\x11\x13]*MXS:([A-Z]+[0-9]*[LRCM]?),(MX[0-9]+),INF,'
      state: { "channels.{1}.matrix_sends.{2}.level": "-inf" }
    - match: '^[\x02\x11\x13]*MXS:([A-Z]+[0-9]*[LRCM]?),(MX[0-9]+),[^,]+,L([0-9]+);'
      state: { "channels.{1}.matrix_sends.{2}.pan": "-{3}" }
    - match: '^[\x02\x11\x13]*MXS:([A-Z]+[0-9]*[LRCM]?),(MX[0-9]+),[^,]+,(?:C|0);'
      state: { "channels.{1}.matrix_sends.{2}.pan": "0" }
    - match: '^[\x02\x11\x13]*MXS:([A-Z]+[0-9]*[LRCM]?),(MX[0-9]+),[^,]+,R([0-9]+);'
      state: { "channels.{1}.matrix_sends.{2}.pan": "{3}" }
    - match: '^[\x02\x11\x13]*SCS:([0-9]+),"([^"]*)";'
      state: { scene.number: "{1}", scene.name: "{2}" }
    - match: '^[\x02\x11\x13]*LCS:([01]);'
      state: { console.locked: { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^[\x02\x11\x13]*BLS:([01]);'
      state: { console.blackout: { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^[\x02\x11\x13]*DMS:([01]);'
      state: { console.monitor_dimmer: { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^[\x02\x11\x13]*DBS:([0-9]+);'
      state: { brightness.display: "{1}" }
    - match: '^[\x02\x11\x13]*PBS:([0-9]+);'
      state: { brightness.panel: "{1}" }
    - match: '^[\x02\x11\x13]*LBS:([0-9]+);'
      state: { brightness.lamp: "{1}" }
    - match: '^[\x02\x11\x13]*RTS:(-?[0-9]+);'
      state: { recorder.status: { value: "{1}", map: { "-1": unavailable, "0": stopped, "1": playing, "2": recording, "3": preparing, "4": rec_pause } } }
    - match: '^[\x02\x11\x13]*RLS:([0-9hms]*);'
      state: { recorder.position: "{1}" }
    - match: '^[\x02\x11\x13]*RIS:([0-9]+),([0-9]+);'
      state: { recorder.song: "{1}", recorder.song_count: "{2}" }
    - match: '^[\x02\x11\x13]*RNS:([0-9]+),"([^";]*)"?;'
      state: { "recorder.songs.{1}.name": "{2}" }
    - match: '^[\x02\x11\x13]*RRS:([0-9hms]*);'
      state: { recorder.remaining: "{1}" }
    - match: '^[\x02\x11\x13]*RCS:([AB]),([0-2]);'
      state: { "reac.{1}.status": { value: "{2}", map: { "0": disconnected, "1": establishing, "2": connected } } }
    - match: '^[\x02\x11\x13]*EPS:([AB]),([0-2]);'
      state: { "reac.{1}.error": { value: "{2}", map: { "0": fan_stopped, "1": temperature, "2": transmission } } }
    - match: '^[\x02\x11\x13]*ERS:([0-9]+);'
      state: { device.error: "{1}" }
    - match: '^[\x02\x11\x13]*VRS:([^,;]+),([^,;]+),([^,;]+);'
      state: { device.version: "{1}", device.panel_version: "{2}", device.fader_version: "{3}" }
