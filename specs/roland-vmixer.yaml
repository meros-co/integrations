      state: { "channels.{1}.aux_sends.{2}.pan": "-{3}" }
    - match: '^[\x02\x11\x13]*AXS:([A-Z]+[0-9]*[LRCM]?),(AX[0-9]+),[^,]+,(?:C|0);'
