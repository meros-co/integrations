commands:
  set_phantom:
    summary: "Turn an input's phantom power (+48V) on or off (PTC)"
    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6][LR]|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel to switch, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); R1L-R6R one side of an M-480 return; U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
      enabled: { type: bool, required: true, label: Phantom power, description: "On supplies +48V, off removes it." }
    send: "PTC:{channel},{enabled:bool01};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_phantom:
    summary: "Read whether an input's phantom power (+48V) is on (PTQ)"
    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6][LR]|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel to read, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); R1L-R6R one side of an M-480 return; U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
    send: "PTQ:{channel};"
    expect: { reply_contains: "PTS:{channel},", matches: 'PTS:[^,]+,([01]);' }
    returns: value

  set_polarity:
    summary: "Turn an input's polarity inversion on or off (PSC)"
    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6][LR]|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel to switch, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); R1L-R6R one side of an M-480 return; U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
      enabled: { type: bool, required: true, label: Polarity inverted, description: "On inverts the polarity, off leaves it normal." }
    send: "PSC:{channel},{enabled:bool01};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_polarity:
    summary: "Read whether an input's polarity inversion is on (PSQ)"
    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6][LR]|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel to read, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); R1L-R6R one side of an M-480 return; U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
    send: "PSQ:{channel};"
    expect: { reply_contains: "PSS:{channel},", matches: 'PSS:[^,]+,([01]);' }
    returns: value

  set_gain:
    summary: "Set an input's pad and gain (PGC); refused (ERR:5) for a gain outside the input's range or an input without a pad"
    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6][LR]|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel to set, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); R1L-R6R one side of an M-480 return; U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
      pad: { type: bool, required: true, label: Pad, description: "On engages the pad, off releases it; 0 for an input without a pad." }
      gain: { type: int, min: -65, max: 10, required: true, label: Gain, description: "Gain in dB in 1 dB steps: -65 to -10 with the pad off and -45 to +10 with it on on most inputs; STEREO IN 0 to -18, M-300 CONSOLE IN 5-12 and M-200i INPUT 17-24 -28 to +4, M-200i INPUT 1-16 -65 to +4." }
    send: "PGC:{channel},{pad:bool01},{gain};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_gain:
    summary: "Read an input's pad and gain (PGQ); returns the gain"
    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6][LR]|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel to read, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); R1L-R6R one side of an M-480 return; U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
    send: "PGQ:{channel};"
    expect: { reply_contains: "PGS:{channel},", matches: 'PGS:[^,]+,[01],(-?[0-9]+);' }
    returns: value

  set_filter:
    summary: "Turn an input's filter (high-pass) on or off (FLC)"
    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6][LR]|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel to switch, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); R1L-R6R one side of an M-480 return; U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
      enabled: { type: bool, required: true, label: Filter, description: "On turns the filter on, off bypasses it." }
    send: "FLC:{channel},{enabled:bool01};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_filter:
    summary: "Read whether an input's filter (high-pass) is on (FLQ)"
    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6][LR]|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel to read, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); R1L-R6R one side of an M-480 return; U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
    send: "FLQ:{channel};"
    expect: { reply_contains: "FLS:{channel},", matches: 'FLS:[^,]+,([01]);' }
    returns: value

  set_eq:
    summary: "Turn a channel's EQ on or off (EQC)"
    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|AX(?:[1-9]|1[0-6])|MX[1-8]|MA[LRC]|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel to switch, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); AX1-AX16 AUX buses (AX1-AX8 on M-300 and M-200i); MX1-MX8 matrices (MX1-MX4 on M-300 and M-200i); MAL, MAR, MAC the main buses (no MAC on M-200i; L and R are linked); U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
      enabled: { type: bool, required: true, label: EQ, description: "On turns the EQ on, off bypasses it." }
    send: "EQC:{channel},{enabled:bool01};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_eq:
