spec: 1
id: roland-vmixer
name: Roland V-Mixer M-480 / M-400 / M-380 / M-300 / M-200i (RS-232C, and Telnet on the M-200i)
vendor: Roland
category: mixer

# The V-Mixers' RS-232C command set: three letters, ":" and comma-separated
# parameters, then ";", stx (02H) before each command (Reference p.6-9).
# Control commands (ending in C) are answered by ack (06H), request commands
# (ending in Q) by a reply command (ending in S), both by ERR:n; on failure.
# Only the M-200i also takes the set over Telnet on TCP 8023, where stx is
# dropped, ack becomes OK and each line ends in CR LF (M-200i Telnet
# Reference). The consoles report nothing when a setting changes on their own
# surface, so state comes from the replies to requests. The M-5000 has its own
# command set and is roland-m5000.
source:
  - title: "V-Mixer RS-232C Reference, Version 2.2 (M-480, M-400, M-380, M-300, M-200i) (© 2016)"
    author: Roland Corporation
    url: https://static.roland.com/assets/media/pdf/V-Mixer_RS-232C_v22_e01.pdf
    note: >
      Manufacturer document. Connection, speeds (4800-115200, 115200 by
      default), 8N1, Xon/Xoff and the RS-232C/MIDI switch p.5-6; command format
      and exchange, no transmission of the console's own changes p.7-9;
      channel tokens per model p.10; control commands p.11-37; request
      commands and replies p.38-68; ERR, ERS and EPS after them.
  - title: "M-200i Telnet Reference (© 2013)"
    author: Roland Corporation
    url: https://static.roland.com/assets/media/pdf/m200i_manual_telnet_e01.pdf
    note: >
      Manufacturer document. TCP 8023, character mode with remote echo, CR, LF
      or CR-LF received and CR-LF sent, stx removed and ack sent as OK, the
      special commands OK and QUIT.

transport:
  type: line-tcp
  port: 8023
  framing: terminated
  terminator: crlf
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # Over Telnet (M-200i): OK, ERR:n; or a reply command (two letters and S).
  # The echo of the command ends in C or Q and is never a reply.
  reply_match: '^[\x02\x11\x13]*(?:OK|\x06|ERR:[0-9]+;|(?:CN|PT|PS|PG|FL|EQ|GT|CP|AX|MX|MA|PN|MU|FD|DS|DT|SC|PI|PO|LC|VR|RC|BL|DB|PB|LB|DM|RT|RL|RI|RN|RR)S:)'
  probe: "VRQ;"
  # Every V-Mixer has the RS-232C connector (with the rear RS-232C/MIDI switch
  # set to RS-232C; the M-200i chooses it in its menu): stx before each
  # command, nothing after the ";", ack the byte 06H. 4800-115200 bps,
  # 115200 by default, 8N1, Xon/Xoff (p.5-6). Only the M-200i has Telnet.
  serial:
    serial_only: [m-480, m-400, m-380, m-300]
    baud_rate: { default: 115200, values: [4800, 9600, 14400, 31250, 38400, 57600, 115200] }
    data_bits: 8
    parity: none
    stop_bits: 1
    flow_control: xon-xoff
    overrides:
      framing: delimited
      open: "\u0002"
      close: ""
      reply_framing: terminated
      reply_terminators: [";", "\u0006"]
      reply_match: '^[\x02\x11\x13]*(?:\x06|ERR:[0-9]+;|(?:CN|PT|PS|PG|FL|EQ|GT|CP|AX|MX|MA|PN|MU|FD|DS|DT|SC|PI|PO|LC|VR|RC|BL|DB|PB|LB|DM|RT|RL|RI|RN|RR)S:)'

ports:
  - { port: 8023, protocol: tcp, role: control, when: "link tcp", note: "M-200i only" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "The RS-232C connector, D-sub 9-pin" }

