    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6]|R[1-6][LR]|AX(?:[1-9]|1[0-6])|MX[1-8]|MA[LRC]|DCA(?:[1-9]|1[0-9]|2[0-4])|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel whose fader to close, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); R1-R6 the M-480's stereo returns (the L side where a mono value is meant); R1L-R6R one side of an M-480 return; AX1-AX16 AUX buses (AX1-AX8 on M-300 and M-200i); MX1-MX8 matrices (MX1-MX4 on M-300 and M-200i); MAL, MAR, MAC the main buses (no MAC on M-200i; L and R are linked); DCA1-DCA24 (DCA1-DCA8 on M-400, M-380 and M-200i, DCA1-DCA4 on M-300); U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
    send: "FDC:{channel},INF;"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  adjust_fader:
    summary: "Move a fader by a relative amount (RFC); refused (ERR:5) for 0.0, upwards at +10.0 and downwards at -inf"
    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6]|R[1-6][LR]|AX(?:[1-9]|1[0-6])|MX[1-8]|MA[LRC]|DCA(?:[1-9]|1[0-9]|2[0-4])|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel whose fader to move, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); R1-R6 the M-480's stereo returns (the L side where a mono value is meant); R1L-R6R one side of an M-480 return; AX1-AX16 AUX buses (AX1-AX8 on M-300 and M-200i); MX1-MX8 matrices (MX1-MX4 on M-300 and M-200i); MAL, MAR, MAC the main buses (no MAC on M-200i; L and R are linked); DCA1-DCA24 (DCA1-DCA8 on M-400, M-380 and M-200i, DCA1-DCA4 on M-300); U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
      change: { type: float, min: -99.9, max: 99.9, required: true, label: Change, description: "Amount to move the fader in dB, -99.9 to +99.9 in 0.1 dB steps, positive upwards." }
    send: "RFC:{channel},{change:.1f};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_fader:
    summary: "Read a fader level (FDQ): dB as text, or INF"
    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6]|R[1-6][LR]|AX(?:[1-9]|1[0-6])|MX[1-8]|MA[LRC]|DCA(?:[1-9]|1[0-9]|2[0-4])|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel to read, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); R1-R6 the M-480's stereo returns (the L side where a mono value is meant); R1L-R6R one side of an M-480 return; AX1-AX16 AUX buses (AX1-AX8 on M-300 and M-200i); MX1-MX8 matrices (MX1-MX4 on M-300 and M-200i); MAL, MAR, MAC the main buses (no MAC on M-200i; L and R are linked); DCA1-DCA24 (DCA1-DCA8 on M-400, M-380 and M-200i, DCA1-DCA4 on M-300); U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
    send: "FDQ:{channel};"
    expect: { reply_contains: "FDS:{channel},", matches: 'FDS:[^,]+,([^;]+);' }
    returns: value

  set_delay:
    summary: "Turn an output's delay on or off (DSC; M-200i)"
    params:
      channel: { type: string, required: true, max_length: 4, pattern: '^(?:MA[LR]|AX[1-8]|MX[1-4]|U(?:[1-9]|[12][0-9]|3[0-2]))$', label: Channel,
                 description: "The output whose delay to set: MAL, MAR, AX1-AX8, MX1-MX4, or U1-U32 assigned to one." }
      enabled: { type: bool, required: true, label: Delay, description: "On turns the output delay on, off bypasses it." }
    send: "DSC:{channel},{enabled:bool01};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_delay:
    summary: "Read whether an output's delay is on (DSQ; M-200i)"
    params:
      channel: { type: string, required: true, max_length: 4, pattern: '^(?:MA[LR]|AX[1-8]|MX[1-4]|U(?:[1-9]|[12][0-9]|3[0-2]))$', label: Channel,
                 description: "The output whose delay to set: MAL, MAR, AX1-AX8, MX1-MX4, or U1-U32 assigned to one." }
    send: "DSQ:{channel};"
    expect: { reply_contains: "DSS:{channel},", matches: 'DSS:[^,]+,([01]);' }
    returns: value

  set_delay_time:
    summary: "Set an output's delay time in a given unit (DTC; M-200i)"
    params:
      channel: { type: string, required: true, max_length: 4, pattern: '^(?:MA[LR]|AX[1-8]|MX[1-4]|U(?:[1-9]|[12][0-9]|3[0-2]))$', label: Channel,
                 description: "The output whose delay to set: MAL, MAR, AX1-AX8, MX1-MX4, or U1-U32 assigned to one." }
      time: { type: string, required: true, max_length: 7, pattern: '^[0-9]{1,5}(?:\.[0-9])?$', label: Delay,
              description: "Delay time in the unit given, as a number with at most one decimal (frames, feet and samples are whole numbers)." }
      unit: { type: enum, values: [MS, FT, M, F24, F25, F29, F30, SMPL], required: true, label: Unit,
              description: "MS milliseconds (0.0-400), FT feet (0-451), M metres (0.0-137.4), F24/F25/F29/F30 frames (0-10, 0-10, 0-12, 0-12), SMPL samples (0-19200 at 48 kHz, 0-17640 at 44.1 kHz; only with the system's delay unit set to samples)." }
    send: "DTC:{channel},{time},{unit};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  set_delay_time_system_unit:
    summary: "Set an output's delay time in the console's SYSTEM DELAY UNIT (DTC; M-200i)"
    params:
      channel: { type: string, required: true, max_length: 4, pattern: '^(?:MA[LR]|AX[1-8]|MX[1-4]|U(?:[1-9]|[12][0-9]|3[0-2]))$', label: Channel,
                 description: "The output whose delay to set: MAL, MAR, AX1-AX8, MX1-MX4, or U1-U32 assigned to one." }
      time: { type: string, required: true, max_length: 7, pattern: '^[0-9]{1,5}(?:\.[0-9])?$', label: Delay,
              description: "Delay time in the unit given, as a number with at most one decimal (frames, feet and samples are whole numbers)." }
    send: "DTC:{channel},{time};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_delay_time:
    summary: "Read an output's delay time in a given unit (DTQ; M-200i); returns the time"
    params:
      channel: { type: string, required: true, max_length: 4, pattern: '^(?:MA[LR]|AX[1-8]|MX[1-4]|U(?:[1-9]|[12][0-9]|3[0-2]))$', label: Channel,
                 description: "The output whose delay to set: MAL, MAR, AX1-AX8, MX1-MX4, or U1-U32 assigned to one." }
      unit: { type: enum, values: [MS, FT, M, F24, F25, F29, F30, SMPL], required: true, label: Unit,
              description: "MS milliseconds (0.0-400), FT feet (0-451), M metres (0.0-137.4), F24/F25/F29/F30 frames (0-10, 0-10, 0-12, 0-12), SMPL samples (0-19200 at 48 kHz, 0-17640 at 44.1 kHz; only with the system's delay unit set to samples)." }
    send: "DTQ:{channel},{unit};"
    expect: { reply_contains: "DTS:{channel},", matches: 'DTS:[^,]+,([0-9.]+),' }
    returns: value

  get_delay_time_system_unit:
    summary: "Read an output's delay time in the console's SYSTEM DELAY UNIT (DTQ; M-200i); returns the time"
    params:
      channel: { type: string, required: true, max_length: 4, pattern: '^(?:MA[LR]|AX[1-8]|MX[1-4]|U(?:[1-9]|[12][0-9]|3[0-2]))$', label: Channel,
                 description: "The output whose delay to set: MAL, MAR, AX1-AX8, MX1-MX4, or U1-U32 assigned to one." }
    send: "DTQ:{channel};"
    expect: { reply_contains: "DTS:{channel},", matches: 'DTS:[^,]+,([0-9.]+),' }
    returns: value

  recall_scene:
    summary: "Recall a scene (SCC); refused (ERR:5) for a blank scene"
    params:
      scene: { type: int, min: 0, max: 299, required: true, label: Scene, description: "Scene number, 000 to 299 as the console numbers scenes." }
    send: "SCC:{scene:03d};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  recall_scene_relative:
    summary: "Recall the scene a number of scenes before or after the current one (RSC)"
    params:
      offset: { type: int, min: -299, max: 299, required: true, label: Offset, description: "How many scenes to move, negative for earlier scenes; refused when the result lies outside 000-299." }
    send: "RSC:{offset};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  store_scene:
    summary: "Store the current settings to a scene, keeping the current name and M-48 setting (SSC); refused (ERR:6) for a locked scene"
    params:
      scene: { type: int, min: 0, max: 299, required: true, label: Scene, description: "Scene number, 000 to 299 as the console numbers scenes." }
    send: "SSC:{scene:03d};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  store_scene_named:
    summary: "Store the current settings to a scene under a name (SSC)"
    params:
      scene: { type: int, min: 0, max: 299, required: true, label: Scene, description: "Scene number, 000 to 299 as the console numbers scenes." }
      name: { type: string, required: true, max_length: 16, pattern: '^[^,;"]+$', label: Scene name,
             description: "The scene's name, up to 16 characters, without commas, semicolons or quotes." }
    send: "SSC:{scene:03d},{name};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  store_scene_with_m48:
    summary: "Store the current settings to a scene with a name and M-48 memory (SSC)"
    params:
      scene: { type: int, min: 0, max: 299, required: true, label: Scene, description: "Scene number, 000 to 299 as the console numbers scenes." }
      name: { type: string, required: true, max_length: 16, pattern: '^[^,;"]+$', label: Scene name,
             description: "The scene's name, up to 16 characters, without commas, semicolons or quotes." }
      memory: { type: int, min: 0, max: 16, required: true, label: M-48 memory,
              description: "The M-48 personal mixer memory the scene recalls, 1 to 16, or 0 for none." }
    send: "SSC:{scene:03d},{name},{memory:map.m48};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_scene:
    summary: "Read the scene last recalled, its number and name (SCQ)"
    send: "SCQ;"
    expect: { reply_contains: "SCS:", matches: 'SCS:([0-9]+),' }
    returns: value

  set_input_patch:
    summary: "Patch an input port to a channel (PIC)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6][LR]|CS(?:MA[LRC]|AX(?:[1-9]|1[0-6])|MX[1-8]|SO[LR]))$', label: Channel,
              description: "The channel whose input patch to set: I1-I48 (I1-I32 on M-300 and M-200i), and on the M-480 R1L-R6R and the cascade inputs CSMAL, CSMAR, CSMAC, CSAX1-CSAX16, CSMX1-CSMX8, CSSOL, CSSOR." }
      port: { type: string, required: true, max_length: 6, pattern: '^(?:R[AB]I(?:[1-9]|[1-3][0-9]|40)|CI(?:[1-9]|1[0-9]|2[0-4])|STI[LR]|FX[1-6][LR]|PLAY[LR]|OFF)$', label: Input port,
              description: "The port patched to it: RAI1-RAI40 and RBI1-RBI40 (REAC A and B), CI1-CI24 (the console's inputs: 8 on M-480, M-400 and M-380, 12 on M-300, 24 on M-200i), STIL or STIR, FX1L-FX6R (FX4R on all but the M-480), PLAYL or PLAYR, or OFF." }
    send: "PIC:{channel},{port};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_input_patch:
    summary: "Read the port patched to a channel (PIQ)"
    params:
      channel: { type: string, required: true, max_length: 6, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6][LR]|CS(?:MA[LRC]|AX(?:[1-9]|1[0-6])|MX[1-8]|SO[LR]))$', label: Channel,
              description: "The channel whose input patch to set: I1-I48 (I1-I32 on M-300 and M-200i), and on the M-480 R1L-R6R and the cascade inputs CSMAL, CSMAR, CSMAC, CSAX1-CSAX16, CSMX1-CSMX8, CSSOL, CSSOR." }
    send: "PIQ:{channel};"
    expect: { reply_contains: "PIS:{channel},", matches: 'PIS:[^,]+,([A-Z0-9]+);' }
    returns: value

  set_output_patch:
    summary: "Patch a source to an output port (POC)"
    params:
      port: { type: string, required: true, max_length: 5, pattern: '^(?:R[AB]O(?:[1-9]|[1-3][0-9]|40)|CO(?:[1-9]|1[0-2])|DO[LR])$', label: Output port,
              description: "The output port: RAO1-RAO40 (RAO1-RAO8 on M-400 and M-380), RBO1-RBO40 (not M-200i), CO1-CO12 (the console's outputs: 8, or 12 on the M-200i where CO11 and CO12 are MAIN OUT L and R), DOL or DOR (digital out)." }
      source: { type: string, required: true, max_length: 6, pattern: '^(?:MA[LRCM]|AX(?:[1-9]|1[0-6])|MX[1-8]|MON[LR]|REC[LR]|I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6][LR]|TB|OSC2?|R[AB]I(?:[1-9]|[1-3][0-9]|40)|CI(?:[1-9]|1[0-9]|2[0-4])|STI[LR]|CS(?:MA[LRC]|AX(?:[1-9]|1[0-6])|MX[1-8]|SO[LR])|OFF)$', label: Source,
              description: "The source patched to it: MAL, MAR, MAC, MAM (mono main), AX1-AX16, MX1-MX8, MONL, MONR, RECL, RECR, I1-I48, R1L-R6R (M-480), TB, OSC (and OSC2 on the M-480), a direct input port (RAI, RBI, CI, STIL, STIR; not on M-400 and M-380), the M-480's cascade outputs CSMAL-CSSOR, or OFF." }
    send: "POC:{port},{source};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_output_patch:
    summary: "Read the source patched to an output port (POQ)"
    params:
      port: { type: string, required: true, max_length: 5, pattern: '^(?:R[AB]O(?:[1-9]|[1-3][0-9]|40)|CO(?:[1-9]|1[0-2])|DO[LR])$', label: Output port,
              description: "The output port: RAO1-RAO40 (RAO1-RAO8 on M-400 and M-380), RBO1-RBO40 (not M-200i), CO1-CO12 (the console's outputs: 8, or 12 on the M-200i where CO11 and CO12 are MAIN OUT L and R), DOL or DOR (digital out)." }
    send: "POQ:{port};"
    expect: { reply_contains: "POS:{port},", matches: 'POS:[^,]+,([A-Z0-9]+);' }
    returns: value

  set_lock:
    summary: "Lock or unlock the console's surface (LCC), even with a user password; refused (ERR:5) when already so, ERR:2 while an operation is in progress"
    params:
      locked: { type: bool, required: true, label: Locked, description: "On locks the console, off unlocks it." }
    send: "LCC:{locked:bool01};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_lock:
    summary: "Read whether the console is locked (LCQ)"
    send: "LCQ;"
    expect: { reply_contains: "LCS:", matches: 'LCS:([01]);' }
    returns: value

  set_blackout:
    summary: "Black out the display or cancel it (BLC); refused (ERR:5) when already so"
    params:
      enabled: { type: bool, required: true, label: Blackout, description: "On blacks out the display, off restores it." }
    send: "BLC:{enabled:bool01};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_blackout:
    summary: "Read whether the display is blacked out (BLQ)"
    send: "BLQ;"
    expect: { reply_contains: "BLS:", matches: 'BLS:([01]);' }
    returns: value

  set_display_brightness:
    summary: "Set the display brightness (DBC)"
    params:
      brightness: { type: int, min: 0, max: 100, required: true, label: Brightness, description: "Brightness in percent, 0 to 100, which the console rounds to its own steps." }
    send: "DBC:{brightness};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_display_brightness:
    summary: "Read the display brightness (DBQ)"
    send: "DBQ;"
    expect: { reply_contains: "DBS:", matches: 'DBS:([0-9]+);' }
    returns: value

  set_panel_brightness:
    summary: "Set the panel brightness (PBC)"
    params:
      brightness: { type: int, min: 0, max: 100, required: true, label: Brightness, description: "Brightness in percent, 0 to 100, which the console rounds to its own steps." }
    send: "PBC:{brightness};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_panel_brightness:
    summary: "Read the panel brightness (PBQ)"
    send: "PBQ;"
    expect: { reply_contains: "PBS:", matches: 'PBS:([0-9]+);' }
    returns: value

  set_lamp_brightness:
    summary: "Set the lamp (LAMP jack) brightness (LBC)"
    params:
      brightness: { type: int, min: 0, max: 100, required: true, label: Brightness, description: "Brightness in percent, 0 to 100, which the console rounds to its own steps." }
    send: "LBC:{brightness};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_lamp_brightness:
    summary: "Read the lamp (LAMP jack) brightness (LBQ)"
    send: "LBQ;"
    expect: { reply_contains: "LBS:", matches: 'LBS:([0-9]+);' }
    returns: value

  set_monitor_dimmer:
    summary: "Turn the monitor dimmer on or off (DMC); refused (ERR:5) when already so"
    params:
      enabled: { type: bool, required: true, label: Dimmer, description: "On dims the monitor, off returns it to its level." }
    send: "DMC:{enabled:bool01};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_monitor_dimmer:
    summary: "Read whether the monitor dimmer is on (DMQ)"
    send: "DMQ;"
    expect: { reply_contains: "DMS:", matches: 'DMS:([01]);' }
    returns: value

  recorder_transport:
    summary: "Stop, play or record-pause the USB memory recorder (RTC); play from record-pause starts recording"
    params:
      action: { type: enum, values: [stop, play, rec_pause], required: true, label: Action,
                description: "stop, play (or start recording from record-pause), or rec_pause to arm recording." }
    send: "RTC:{action:map.recorder_action};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  recorder_locate:
    summary: "Move the playback position of the USB memory recorder (RLC); valid only during playback"
    params:
      hours: { type: int, min: 0, max: 99, required: true, label: Hours, description: "Hours into the song." }
      minutes: { type: int, min: 0, max: 59, required: true, label: Minutes, description: "Minutes past the hour." }
      seconds: { type: int, min: 0, max: 59, required: true, label: Seconds, description: "Seconds past the minute." }
    send: "RLC:{hours:02d}h{minutes:02d}m{seconds:02d}s;"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  recorder_select_song:
    summary: "Select a song of the USB memory recorder by number (RIC)"
    params:
      song: { type: int, min: 0, max: 999, required: true, label: Song, description: "Song number, 0 to 999." }
    send: "RIC:{song};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  recorder_move_song:
    summary: "Select the song a number of songs before or after the current one (RIC with + or -)"
    params:
      offset: { type: int, min: -999, max: 999, required: true, label: Offset, description: "Songs to move, negative for earlier songs; 0 is refused." }
    send: "RIC:{offset:signed};"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  recorder_next_song:
    summary: "Select the next song of the USB memory recorder (RIC:N)"
    send: "RIC:N;"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  recorder_previous_song:
    summary: "Select the previous song of the USB memory recorder (RIC:P)"
    send: "RIC:P;"
    expect: { matches: '(?:^|[\x02\x11\x13])(?:OK|\x06)' }
    returns: ack

  get_recorder_status:
    summary: "Read the USB memory recorder's status (RTQ): -1 unavailable, 0 stopped, 1 playing, 2 recording, 3 preparing playback, 4 record-pause"
    send: "RTQ;"
    expect: { reply_contains: "RTS:", matches: 'RTS:(-?[0-9]+);' }
    returns: value

  get_recorder_position:
    summary: "Read the USB memory recorder's playback position (RLQ), as HHhMMmSSs"
    send: "RLQ;"
    expect: { reply_contains: "RLS:", matches: 'RLS:([0-9hms]*);' }
    returns: value

  get_recorder_song:
    summary: "Read the current song number and the number of songs (RIQ); returns the current song"
    send: "RIQ;"
    expect: { reply_contains: "RIS:", matches: 'RIS:([0-9]+),' }
    returns: value

  get_recorder_remaining:
    summary: "Read the remaining recording time of the USB memory (RRQ), as HHhMMmSSs"
    send: "RRQ;"
    expect: { reply_contains: "RRS:", matches: 'RRS:([0-9hms]*);' }
    returns: value

  get_recorder_song_name:
    summary: "Read the current song's number and name (RNQ); returns the name"
    send: "RNQ;"
    expect: { reply_contains: "RNS:", matches: 'RNS:[0-9]+,"([^";]*)' }
    returns: value

  get_recorder_song_name_of:
    summary: "Read a song's name by number (RNQ:a)"
    params:
      song: { type: int, min: 0, max: 999, required: true, label: Song, description: "Song number, 0 to 999." }
    send: "RNQ:{song};"
    expect: { reply_contains: "RNS:{song},", matches: 'RNS:[0-9]+,"([^";]*)' }
    returns: value

  get_channel_name:
    summary: "Read a channel's name (CNQ), six characters"
    params:
      channel: { type: string, required: true, max_length: 5, pattern: '^(?:I(?:[1-9]|[1-3][0-9]|4[0-8])|R[1-6]|R[1-6][LR]|AX(?:[1-9]|1[0-6])|MX[1-8]|MA[LRC]|DCA(?:[1-9]|1[0-9]|2[0-4])|MG[1-8]|U(?:[1-9]|[1-6][0-9]|7[0-2]))$', label: Channel,
                 description: "The channel whose name to read, by the console's token: I1-I48 inputs (I1-I32 on M-300 and M-200i); R1-R6 the M-480's stereo returns (the L side where a mono value is meant); R1L-R6R one side of an M-480 return; AX1-AX16 AUX buses (AX1-AX8 on M-300 and M-200i); MX1-MX8 matrices (MX1-MX4 on M-300 and M-200i); MAL, MAR, MAC the main buses (no MAC on M-200i; L and R are linked); DCA1-DCA24 (DCA1-DCA8 on M-400, M-380 and M-200i, DCA1-DCA4 on M-300); MG1-MG8 mute groups (MG1-MG4 on M-300 and M-200i); U1-U72 user faders (U1-U32 on M-300 and M-200i), which reach the channel assigned to them." }
    send: "CNQ:{channel};"
    expect: { reply_contains: "CNS:{channel},", matches: 'CNS:[^,]+,"([^"]*)"' }
    returns: value

  get_reac_status:
    summary: "Read a REAC port's connection status (RCQ): 0 not connected, 1 establishing, 2 connected"
    params:
      port: { type: enum, values: [A, B], required: true, label: REAC port, description: "REAC port A or B (A only on the M-200i)." }
    send: "RCQ:{port};"
    expect: { reply_contains: "RCS:{port},", matches: 'RCS:[AB],([0-2]);' }
    returns: value

  get_version:
    summary: "Read the system, panel and fader versions (VRQ); returns the system version"
    send: "VRQ;"
    expect: { reply_contains: "VRS:", matches: 'VRS:([^,;]+),' }
    returns: value

  resend_last_reply:
    summary: "Ask the console to send its last reply again (ERR:0 from the host)"
    send: "ERR:0;"
    expect: { matches: '^[\x02\x11\x13]*(?:[A-Z]{2}S:|OK|\x06)' }
    returns: text

quirks:
  - models: [all]
    severity: critical
    text: >
      recall_scene and recall_scene_relative change the whole console at once;
      the store_scene commands overwrite a scene; set_input_patch and
      set_output_patch reroute signals at once; set_lock locks the surface
      against the operator. None can be undone from here.
  - models: [all]
    severity: warning
    text: >
      The consoles send nothing when a setting is changed on their own
      surface, so state comes from polling: the scene and the USB
      memory recorder every two seconds, faders and mutes every ten, and
      names, pans, gains, the processing switches, the input patch and the
      console settings every minute. A change on the console shows up only at
      the next poll. AUX and MATRIX send levels, the output patch and the
      M-200i's delays are not polled; their get_ commands read one into state.
      User faders reach whichever channel is assigned to them and are not
      polled.
  - models: [m-480, m-400, m-380, m-300]
    severity: info
    text: >
      These consoles have only the RS-232C connector for this command set
      (link serial); the rear RS-232C/MIDI switch must be on RS-232C.
  - models: [m-200i]
    severity: info
    text: >
      The M-200i takes the command set over Telnet (TCP 8023) as well, where
      it echoes what it receives (character mode with remote echo); the echo
      is never taken as a reply. Telnet option negotiation is not documented.
  - models: [all]
    severity: info
    text: >
      Channel names are 6 characters, six spaces when blank. Scene
      names are up to 16 characters. Stereo-linked channels take a setting on
      both sides and report the same value for either. MAIN L and R are always
      linked. Pan values run L63-C-R63. ERR:0 syntax error, ERR:2 busy, ERR:5
      out of range (or a channel without the parameter, or a model without
      the channel), ERR:6 other error. ERS and EPS are sent unprompted.

state:
  channels.*.name:              { type: string, description: "Channel name (CNS), six characters, keyed by the console's channel token (I1, R1L, AX3, MX2, MAL, DCA4, MG1)" }
  channels.*.fader:             { type: string, unit: dB, description: "Fader level in dB as the console writes it (-80.0 to 10.0), or \"-inf\"" }
  channels.*.mute:              { type: bool, description: "Muted" }
  channels.*.pan:               { type: int, description: "Pan or balance, -63 (L63) through 0 (C) to 63 (R63)" }
  channels.*.phantom:           { type: bool, description: "Phantom power (+48V) on" }
  channels.*.polarity:          { type: bool, description: "Polarity inverted" }
  channels.*.pad:               { type: bool, description: "Pad engaged" }
  channels.*.gain:              { type: int, unit: dB, description: "Input gain" }
  channels.*.filter:            { type: bool, description: "Filter on" }
  channels.*.eq:                { type: bool, description: "EQ on" }
  channels.*.gate:              { type: bool, description: "Gate on" }
  channels.*.compressor:        { type: bool, description: "Compressor or limiter on" }
  channels.*.input_patch:       { type: string, description: "Port patched to the channel (RAI1, CI3, STIL, OFF, ...)" }
  channels.*.aux_sends.*.level: { type: string, unit: dB, description: "Send level to the AUX bus (keyed AX1-AX16) in dB, or \"-inf\"; read by get_aux_send only" }
  channels.*.aux_sends.*.pan:   { type: int, description: "Send pan to the AUX bus, -63 to 63" }
  channels.*.matrix_sends.*.level: { type: string, unit: dB, description: "Send level to the MATRIX bus (keyed MX1-MX8) in dB, or \"-inf\"; read by get_matrix_send only" }
  channels.*.matrix_sends.*.pan: { type: int, description: "Send pan to the MATRIX bus, -63 to 63" }
  channels.*.main_sends.*:      { type: bool, description: "Sent to the side of MAIN (keyed MAL or MAR); M-200i, read by get_main_send only" }
  channels.*.delay:             { type: bool, description: "Output delay on (M-200i)" }
  channels.*.delay_time:        { type: string, description: "Output delay time as the console writes it, with delay_unit (M-200i)" }
  channels.*.delay_unit:        { type: string, description: "Unit of delay_time: MS, FT, M, F24, F25, F29, F30 or SMPL" }
  output_patch.*:               { type: string, description: "Source patched to the output port (keyed RAO1, CO3, DOL, ...): MAL, AX2, I5, OFF, ...; read by get_output_patch only" }
  scene.number:                 { type: int, description: "Scene last recalled, 0-299" }
  scene.name:                   { type: string, description: "Name of the scene last recalled" }
  console.locked:               { type: bool, description: "Surface locked" }
  console.blackout:             { type: bool, description: "Display blacked out" }
  console.monitor_dimmer:       { type: bool, description: "Monitor dimmer on" }
  brightness.display:           { type: int, unit: "%", description: "Display brightness" }
  brightness.panel:             { type: int, unit: "%", description: "Panel brightness" }
  brightness.lamp:              { type: int, unit: "%", description: "LAMP jack brightness (M-480, M-400, M-380)" }
  recorder.status:              { type: string, description: "USB memory recorder: unavailable, stopped, playing, recording, preparing or rec_pause" }
  recorder.position:            { type: string, description: "Playback position as HHhMMmSSs, leading fields left out by the console" }
  recorder.song:                { type: int, description: "Current song number" }
  recorder.song_count:          { type: int, description: "Number of songs" }
  recorder.songs.*.name:        { type: string, description: "Song name, keyed by song number" }
  recorder.remaining:           { type: string, description: "Remaining recording time as HHhMMmSSs" }
  reac.*.status:                { type: string, description: "REAC port A or B: disconnected, establishing or connected" }
  reac.*.error:                 { type: string, description: "Last REAC device error, keyed A or B: fan_stopped, temperature or transmission" }
  device.version:               { type: string, description: "System version" }
  device.panel_version:         { type: string, description: "Panel version" }
  device.fader_version:         { type: string, description: "Fader version (0.000 on M-300 and M-200i)" }
  device.error:                 { type: int, description: "Last console error status code (ERS): 0 fan stopped, 1 lithium battery low, 10 RS-232C framing, 11 parity, 12 receive buffer full, 99 abnormal system stop" }

telemetry:
