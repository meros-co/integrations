  aspect: { type: string, description: "TV aspect ratio: 16_9_wide, 16_9_auto, 4_3_pan_scan or 4_3_letterbox (DVAr)" }
  tv_system: { type: string, description: "TV system: ntsc, pal or multi (DVFM)" }
  hdmi_1080p24: { type: bool, description: "1080p 24 Hz on (DV1K24)" }
  dvd_24p: { type: bool, description: "DVD 24p conversion on (DV24pC)" }
  color_space: { type: string, description: "HDMI color space: rgb_video, rgb_pc, ycbcr444 or ycbcr422 (DVCS)" }
  deep_color: { type: string, description: "HDMI deep color: 48, 36, 30 or off (DVDC)" }
  captions.attribute: { type: string, description: "Closed caption style: auto or custom (DVCC)" }
  captions.font_color: { type: string, description: "Caption font color: default, white, black, red, green, blue, yellow, magenta or cyan (DVFC)" }
  captions.font_size: { type: string, description: "Caption font size: default, standard, small or large (DVFS)" }
  captions.font_style: { type: string, description: "Caption font style: default, mono_serif, mono_sans, proportional_serif, proportional_sans, casual, cursive or small_capitals (DVFT)" }
  captions.font_opacity: { type: string, description: "Caption font opacity: solid, translucent or transparent (DVFO)" }
  captions.font_edge: { type: string, description: "Caption font edge: default, none, raised, depressed, uniform, left_drop or right_drop (DVFE)" }
  captions.edge_color: { type: string, description: "Caption edge color: white, black, red or green (DVFc)" }
  captions.background_color: { type: string, description: "Caption background color: white, black, red or green (DVBC)" }
  captions.background_opacity: { type: string, description: "Caption background opacity: solid, translucent or transparent (DVBO)" }
  captions.window_color: { type: string, description: "Caption window color: white, black, red or green (DVWC)" }
  captions.window_opacity: { type: string, description: "Caption window opacity: solid, translucent or transparent (DVWO)" }
  secondary_audio_mark: { type: bool, description: "Secondary audio mark on (DVSA)" }
  hdmi_audio: { type: string, description: "HDMI audio: stereo, lpcm or bitstream (DVHA)" }
  digital_out: { type: string, description: "Coaxial/optical output: lpcm48, lpcm96, lpcm192 or bitstream (DVDO)" }
  drc: { type: string, description: "Dynamic range control: auto, on or off (DVDR)" }
  remote_code: { type: string, description: "Remote control code: code1, code2 or code3 (DVRC)" }
  hdmi_cec: { type: string, description: "HDMI CEC: hdmi1 or off (DVHDC)" }
  bd_live: { type: string, description: "BD-Live access: permitted, limited or prohibited (DVBDLNA)" }
  buda: { type: string, description: "BD-Live storage: internal or external (DVBUDA)" }
  network_interface: { type: string, description: "Network interface: ethernet or wifi (PCNI)" }
  ir_lock: { type: bool, description: "IR lock on (PCIRLK)" }
  program: { type: bool, description: "Program mode on (PCPMP)" }
  time_display: { type: string, description: "Time display: elapsed, remaining, total_elapsed or total_remaining (PCTMD)" }
  osd_hidden: { type: bool, description: "OSD hiding on (DVHOSD)" }
  resolution: { type: string, description: "Resolution: auto, 480i, 480p, 720p, 1080i or 1080p (DVVR)" }
  mute: { type: bool, description: "Mute on (mt)" }

telemetry:
  poll:
    - every_ms: 1000
      send: ["@0?ST", "@0?ET", "@0?RM"]
    - every_ms: 5000
      send: ["@0?CD", "@0?Tr", "@0?Tt", "@0?PCGp", "@0?PCTG", "@0?PCPMR", { models: [dn-500bd], message: "@0?PCSLS" }]
    - every_ms: 30000
      send: ["@0?PCTYP", "@0?PCAFMT", "@0?PCACH", "@0?PCDG+", "@0?PCDG-", "@0?DVSTC", "@0?VN", "@0?fs",
        { models: [dn-500bd], message: "@0?DVANGL" }, { models: [dn-500bd], message: "@0?DVPCRT" },
        { models: [dn-500bd], message: "@0?DVPCAC" }, { models: [dn-500bd], message: "@0?DVLGOS" },
        { models: [dn-500bd], message: "@0?DVLGDM" }, { models: [dn-500bd], message: "@0?DVLGAD" },
        { models: [dn-500bd], message: "@0?DVLGST" }, { models: [dn-500bd], message: "@0?DVPABN" },
        { models: [dn-500bd], message: "@0?DVPACT" }, { models: [dn-500bd], message: "@0?DVPAHU" },
        { models: [dn-500bd], message: "@0?DVPASR" }, { models: [dn-500bd], message: "@0?DVSCStC" },
        { models: [dn-500bd], message: "@0?DVSCStL" }, { models: [dn-500bd], message: "@0?DVSCStR" },
        { models: [dn-500bd], message: "@0?DVSCStl" }, { models: [dn-500bd], message: "@0?DVSCStr" },
        { models: [dn-500bd], message: "@0?DVCO" }, { models: [dn-500bd], message: "@0?DVOV" },
        { models: [dn-500bd], message: "@0?DVMV" }, { models: [dn-500bd], message: "@0?MA" },
        { models: [dn-500bd], message: "@0?DVBUDASZ" }, { models: [dn-500bd], message: "@0?Ip" },
        { models: [dn-500bd], message: "@0?SM" }, { models: [dn-500bd], message: "@0?GW" },
        { models: [dn-500bd], message: "@0?DN" }, { models: [dn-500bd], message: "@0?PCPX" },
        { models: [dn-500bd], message: "@0?PCAP" },
        { models: [dn-500bd], message: "@0?PCAR" },
        { models: [dn-500bd], message: "@0?DVPIP" },
        { models: [dn-500bd], message: "@0?DV3D" },
        { models: [dn-500bd], message: "@0?DVAr" },
        { models: [dn-500bd], message: "@0?DVFM" },
        { models: [dn-500bd], message: "@0?DV1K24" },
        { models: [dn-500bd], message: "@0?DV24pC" },
        { models: [dn-500bd], message: "@0?DVCS" },
        { models: [dn-500bd], message: "@0?DVDC" },
        { models: [dn-500bd], message: "@0?DVCC" },
        { models: [dn-500bd], message: "@0?DVFC" },
        { models: [dn-500bd], message: "@0?DVFS" },
        { models: [dn-500bd], message: "@0?DVFT" },
        { models: [dn-500bd], message: "@0?DVFO" },
        { models: [dn-500bd], message: "@0?DVFE" },
        { models: [dn-500bd], message: "@0?DVFc" },
        { models: [dn-500bd], message: "@0?DVBC" },
        { models: [dn-500bd], message: "@0?DVBO" },
        { models: [dn-500bd], message: "@0?DVWC" },
        { models: [dn-500bd], message: "@0?DVWO" },
        { models: [dn-500bd], message: "@0?DVSA" },
        { models: [dn-500bd], message: "@0?DVHA" },
        { models: [dn-500bd], message: "@0?DVDO" },
        { models: [dn-500bd], message: "@0?DVDR" },
        { models: [dn-500bd], message: "@0?DVRC" },
        { models: [dn-500bd], message: "@0?DVHDC" },
        { models: [dn-500bd], message: "@0?DVBDLNA" },
        { models: [dn-500bd], message: "@0?DVBUDA" },
        { models: [dn-500bd], message: "@0?PCNI" },
        { models: [dn-500bd], message: "@0?PCIRLK" },
        { models: [dn-500bd], message: "@0?PCPMP" },
        { models: [dn-500bd], message: "@0?PCTMD" },
        { models: [dn-500bd], message: "@0?DVHOSD" },
        { models: [dn-500bd], message: "@0?DVVR" },
        { models: [dn-500bd], message: "@0?mt" }]
  updates:
    - match: '^@0CD([A-Z]{2})\r?$'
      state: { disc.status: { value: "{1}", map: { NC: no_disc, CI: disc, UF: unformatted, TO: tray_open, TC: tray_closed, TE: tray_error } } }
    - match: '^@0ST([A-Z]+)\r?$'
      state: { transport.status: { value: "{1}", map: { PL: play, PP: pause, DVSF: slow_forward, DVSR: slow_reverse, DVFF: fast_forward,
        DVFR: fast_reverse, DVSP: step, DVFS: fs_play, ED: menu, DVSU: setup, DVTR: track_menu, DVHM: home } } }
    # A new track: its title, artist and album are read.
    - match: '^@0Tr ?([0-9]{4})\r?$'
      state: { track.number: "{1}" }
      then_send: ["@0?ti", "@0?at", "@0?al", "@0?tl"]
    - match: '^@0Tr ?UNKN\r?$'
      state: { track.number: { delete: true } }
    - match: '^@0Tt ?([0-9]{4})\r?$'
      state: { tracks.total: "{1}" }
    - match: '^@0Tt ?UNKN\r?$'
      state: { tracks.total: { delete: true } }
    - match: '^@0\?PCGp ?([0-9]{4})\r?$'
      state: { group.number: "{1}" }
    - match: '^@0\?PCGp ?UNKN\r?$'
      state: { group.number: { delete: true } }
    - match: '^@0\?PCTG ?([0-9]{4})\r?$'
      state: { groups.total: "{1}" }
    - match: '^@0\?PCTG ?UNKN\r?$'
      state: { groups.total: { delete: true } }
    - match: '^@0ET([0-9]{3})([0-9]{2})([0-9]{2})\r?$'
      state: { time.elapsed: "{1}:{2:02d}:{3:02d}" }
    - match: '^@0RM([0-9]{3})([0-9]{2})([0-9]{2})\r?$'
      state: { time.remaining: "{1}:{2:02d}:{3:02d}" }
    - match: '^@0tl ?([0-9]{3})([0-9]{2})([0-9]{2})\r?$'
      state: { track.time: "{1}:{2:02d}:{3:02d}" }
    - match: '^@0tl ?([0-9]{3})([0-9]{2})\r?$'
      state: { track.time: "{1}:{2:02d}" }
    - match: '^@0ti ?([^\r]*)\r?$'
      state: { track.title: "{1}" }
    - match: '^@0at ?([^\r]*)\r?$'
      state: { track.artist: "{1}" }
    - match: '^@0al ?([^\r]*)\r?$'
      state: { track.album: "{1}" }
    - match: '^@0Fs ?([0-9A-Z.]+)\r?$'
      state: { track.sample_rate: "{1}" }
    - match: '^@0PCTYP([A-Z]{3})\r?$'
      state: { media.type: { value: "{1}", map: { DVV: dvd_video, DVA: dvd_audio, CDA: cdda, CDR: cd_rom, SAC: sacd, DVR: dvd_vr,
        BDM: bdmv, BDA: bdav, AVH: avchd, DLN: dlna, EXT: external, UKN: unknown } } }
    - match: '^@0PCAFMT([A-Z0-9+]{3})\r?$'
      state: { audio.format: "{1}" }
    - match: '^@0BDACH([A-Z0-9/]{3})\r?$'
      state: { audio.channels: "{1}" }
    - match: '^@0PCDG\+([A-Za-z]{3})\r?$'
      state: { audio.primary_language: "{1}" }
    - match: '^@0PCDG-([A-Za-z]{3})\r?$'
      state: { audio.secondary_language: "{1}" }
    - match: '^@0DVSTC ?([A-Za-z]{3})\r?$'
      state: { subtitle.language: "{1}" }
    - match: '^@0DVANGL([0-9]+)\r?$'
      state: { angle: "{1}" }
    - match: '^@0VN ?([^\r]+)\r?$'
      state: { version: "{1}" }
    - match: '^@0PCPMR([SR])([A-Z]{2})\r?$'
      state:
        random.kind: { value: "{1}", map: { S: shuffle, R: random } }
        random.mode: { value: "{2}", map: { OF: "off", SI: sub_item, IT: item, AL: all } }
    - match: '^@0PCSLS([FR])([fs])\r?$'
      state:
        search.direction: { value: "{1}", map: { F: forward, R: reverse } }
        search.speed: { value: "{2}", map: { f: fast, s: slow } }
    - match: '^@0DVPCRT([A-Z0-9-]+)\r?$'
      state: { rating: "{1}" }
    - match: '^@0DVPCAC([^\r]*)\r?$'
      state: { area_code: "{1}" }
    - match: '^@0DVLGOS([A-Za-z]{3})\r?$'
      state: { languages.osd: "{1}" }
    - match: '^@0DVLGDM([A-Za-z]{3})\r?$'
      state: { languages.menu: "{1}" }
    - match: '^@0DVLGAD([A-Za-z]{3})\r?$'
      state: { languages.audio: "{1}" }
    - match: '^@0DVLGST([A-Za-z]{3})\r?$'
      state: { languages.subtitle: "{1}" }
    - match: '^@0DVPABN([-+0-9]{3})\r?$'
      state: { picture.brightness: "{1}" }
    - match: '^@0DVPACT([-+0-9]{3})\r?$'
      state: { picture.contrast: "{1}" }
    - match: '^@0DVPAHU([-+0-9]{2})\r?$'
      state: { picture.hue: "{1}" }
    - match: '^@0DVPASR([-+0-9]{2})\r?$'
      state: { picture.saturation: "{1}" }
    # A speaker: its type, size, a sign and two digits of level, four digits of delay.
    - match: '^@0DVSCStC([01])([-+][0-9]{2})([0-9]{4})\r?$'
      state: { speakers.center.size: { value: "{1}", map: &size { "0": large, "1": small } }, speakers.center.level: "{2}", speakers.center.delay: "{3}" }
    - match: '^@0DVSCStL([01])([-+][0-9]{2})([0-9]{4})\r?$'
      state: { speakers.left.size: { value: "{1}", map: *size }, speakers.left.level: "{2}", speakers.left.delay: "{3}" }
    - match: '^@0DVSCStR([01])([-+][0-9]{2})([0-9]{4})\r?$'
      state: { speakers.right.size: { value: "{1}", map: *size }, speakers.right.level: "{2}", speakers.right.delay: "{3}" }
    - match: '^@0DVSCStl([01])([-+][0-9]{2})([0-9]{4})\r?$'
      state: { speakers.surround_left.size: { value: "{1}", map: *size }, speakers.surround_left.level: "{2}", speakers.surround_left.delay: "{3}" }
    - match: '^@0DVSCStr([01])([-+][0-9]{2})([0-9]{4})\r?$'
      state: { speakers.surround_right.size: { value: "{1}", map: *size }, speakers.surround_right.level: "{2}", speakers.surround_right.delay: "{3}" }
    - match: '^@0DVCO([0-9A-Z]{3})\r?$'
      state: { crossover: "{1}" }
    - match: '^@0DVOV([-+][0-9]{2}|000)\r?$'
      state: { output_volume.mode: variable, output_volume.db: "{1}" }
    - match: '^@0DVOVFX\r?$'
      state: { output_volume.mode: fixed }
    - match: '^@0DVOVinf\r?$'
      state: { output_volume.mode: infinity }
    - match: '^@0DVMV([-+][0-9]{2})\r?$'
      state: { max_volume: "{1}" }
    - match: '^@0MA([0-9A-Fa-f]{12})\r?$'
      state: { mac_address: "{1}" }
    - match: '^@0DVBUDASZ([^\r]+)\r?$'
      state: { buda_size: "{1}" }
    - match: '^@0Ip([0-9A-Z]{12,15})\r?$'
      state: { network.ip_address: "{1}" }
    - match: '^@0SM([0-9]{12})\r?$'
      state: { network.subnet_mask: "{1}" }
    - match: '^@0GW([0-9]{12})\r?$'
      state: { network.gateway: "{1}" }
    - match: '^@0DN([0-9]{12})\r?$'
      state: { network.dns: "{1}" }
    - match: '^@0PCPX([^\r]+)\r?$'
      state: { network.proxy: "{1}" }
    - match: '^@0PCCT([0-9]{2})\r?$'
      state: { network.connection_test: { value: "{1}", map: { "00": success, "01": failure } } }
    - match: '^@0PCAP([0-9A-Za-z]+)\r?$'
      state: { auto_play: { value: "{1}", map: { "00": true, "01": false } } }
