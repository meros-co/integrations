spec: 1
id: denon-dn500bd
name: Denon Professional DN-500BD / DN-500BD MKII Blu-ray players (RS-232C / IP control)
vendor: Denon Professional
category: playback

# Denon Professional's serial command protocol for the DN-500BD and DN-500BD MKII: the same messages on the RS-232C
# port and, for IP control, on TCP port 9030. Every message is "@0" (the start character and ID), a command, then
# CR. The player answers each command with the ACK byte (06H), or NACK (15H) when it cannot take it; a status
# request is answered ACK and then the status ("@0?ST" is answered "@0STPL"). Status notifications it sends by
# itself expect the host's ACK. "Track" is a chapter (DVD, BD) or a file; "group" a title (DVD, BD) or a folder.
source:
  - title: "[DV04] DN-500BD Serial Command Protocol Guide, Ver. 2.00 (March 16th, 2016)"
    author: inMusic Brands, Inc.
    url: https://cdn.inmusicbrands.com/DenonPro/cdn/1453/documents/DV04_Protocol_Guide2.0.pdf
    note: >
      Manufacturer document (retrieved 2026-10-27). RS-232C at 9600, 38400 or 115200 bit/s (115200 for every command
      to work), 8N1, no flow control (§2-1); IP control on TCP port 9030 (§2-2); packets from "@" to CR (§3-1); ACK
      06H and NACK 15H and when each is sent (§3-2); a new command only after ACK, NACK or the 30 ms (IP) or 300 ms
      (RS-232C) timeout, at least 30 ms between commands, BUSY (@0BDERBUSY) otherwise (§3-3); the control, status
      request and notification flows (§3-4); the key control, menu setting and current status tables, with the
      status requests for each setting (§4-1); the BUSY error (§4-2).
  - title: "Denon Professional DN-500BD MKII Serial Command Protocol Guide, Manual Version 1.1"
    author: inMusic Brands, Inc.
    url: https://cdn.inmusicbrands.com/DenonPro/cdn/1841/documents/DN-500BD_MKII_Protocol_Guide_v1.1.pdf
    note: >
      Manufacturer document. The same "@0" commands for the DN-500BD MKII (control commands pp.6-15, status requests
      pp.16-19), with ACK/NACK, BUSY, one second after power on before the next command, automatic statuses
      answered ACK by the host (p.5); RS-232C at 9600, 38400 or 115200 bit/s, 115200 for every command to work, 8N1,
      no flow control (p.21). It lists no status requests for the menu settings.
  - title: "Denon Professional DN-500BD MKII User Guide v1.8"
    author: inMusic Brands, Inc.
    url: https://cdn.inmusicbrands.com/DenonPro/cdn/1841/documents/DN-500BD_MKII_-_User_Guide_-_v1.8.pdf
    note: >
      Manufacturer document. The LAN port lets a host control the player with commands, the Remote input does over
      RS-232C (rear panel, p.5); Serial Bit Rate 9600, 38400 or 115200 in the System Setting menu.
  - title: "Denon Professional DN-500BD User Guide v1.4"
    author: inMusic Brands, Inc.
    url: https://cdn.inmusicbrands.com/DenonPro/cdn/1453/documents/DN-500BD%20-%20User%20Guide%20-%20v1.4.pdf
    note: "Manufacturer document. LAN port control by a host; Serial Bit Rate 9600 or 38400 in the System Setting menu."
  - title: "bitfocus/companion-module-denon-dn-500bd-mkii (MIT)"
    author: Andreas H. Thomsen and contributors
    url: https://github.com/bitfocus/companion-module-denon-dn-500bd-mkii
    note: "Corroboration only, not copied: controls the DN-500BD MKII over TCP, port 9030 by default."

transport:
  type: line-tcp
  port: 9030
  framing: terminated
  terminator: cr
  encoding: utf-8
  timeout_ms: 1000
  reply: expected
  # The player's messages: the ACK or NACK byte alone, and statuses from "@0" to CR.
  reply_framing: terminated
  reply_terminators: ["\r", "\u0006", "\u0015"]
  reply_match: '^(\x06|\x15|@0)'
  error_match: '^(\x15|@0BDERBUSY)'
  probe: "@0?PW"
  # Each status the player notifies by itself is answered with the ACK byte alone (no CR), or it is sent once
  # more; the status answering a status request other than ?PW (answered ACK alone) is not, nor BUSY.
  acknowledge: { match: '^@0(?:[^B]|B[^D]|BD[^E])', send: "\u0006", framed: false, answers: '^@0\?(?:[^P]|P[^W])' }
  # At least 30 ms between commands (§3-3-6), one second after power on (MKII p.5).
  pacing:
    min_interval_ms: 30
    groups:
      power_on:
        match: "^@0PW00$"
        after_ms: 1000
  serial:
    baud_rate: { default: 115200, values: [9600, 38400, 115200] }
    data_bits: 8
    parity: none
    stop_bits: 1
    flow_control: none

ports:
  - { port: 9030, protocol: tcp, role: control, when: "link tcp", note: "IP control (DN-500BD guide §2-2)" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "RS-232C, D-sub 9-pin female; pin 7 can supply 5 V, 500 mA" }

