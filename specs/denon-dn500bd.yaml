commands:
  power_on:
    summary: Power on (PW00); the next command waits a second
    send: "@0PW00"
    expect: &ack { reply_contains: "\u0006", contains: "\u0006" }
    returns: ack
  power_off:
    summary: Power off (PW01)
    send: "@0PW01"
    expect: *ack
    returns: ack
  get_power:
    summary: "Ask whether the player is on (?PW): answered ACK when on, nothing when off"
    send: "@0?PW"
    expect: *ack
    returns: ack
  stop:
    summary: Stop (2354)
    send: "@02354"
    expect: *ack
    returns: ack
  play:
    summary: Play (2353)
    send: "@02353"
    expect: *ack
    returns: ack
  pause:
    summary: Pause playback (2348)
    send: "@02348"
    expect: *ack
    returns: ack
  locate_track:
    summary: Go to a track (chapter or file) by number (Tr)
    params:
      track: { type: int, min: 1, max: 2000, required: true, label: Track, description: "The chapter's or file's number, 1-2000." }
    send: "@0Tr{track:04d}"
    expect: *ack
    returns: ack
  skip_track:
    summary: Skip to the next track, or restart the current one or skip to the previous (2332, 2333)
    params:
      to: &to { type: enum, values: [next, previous], required: true, label: Skip to, description: "next or previous." }
    send: "@023{to:map.track_skip}"
    expect: *ack
    returns: ack
  locate_group:
    summary: Go to a group (title or folder) by number (PCGp)
    params:
      group: { type: int, min: 1, max: 2000, required: true, label: Group, description: "The title's or folder's number, 1-2000." }
    send: "@0PCGp{group:04d}"
    expect: *ack
    returns: ack
  skip_group:
    summary: Skip to the next or previous group (PCGPNX, PCGPPV)
    params: { to: *to }
    send: "@0PCGP{to:map.next_previous}"
    expect: *ack
    returns: ack
  panel_lock:
    summary: Lock or unlock the front panel keys (23KL, 23KU); the player has no request to read it back
    params:
      locked: { type: bool, required: true, label: Locked, description: "On locks the front panel keys, off unlocks them." }
    send: "@0{locked:map.locked}"
    expect: *ack
    returns: ack
  ab_repeat_a:
    summary: Set the A point of an A-B repeat (PCRPAF)
    send: "@0PCRPAF"
    expect: *ack
    returns: ack
  ab_repeat_b:
    summary: Set the B point and start the A-B repeat (PCRPBF)
    send: "@0PCRPBF"
    expect: *ack
    returns: ack
  ab_repeat_exit:
    summary: Leave A-B repeat (PCEXRP)
    send: "@0PCEXRP"
    expect: *ack
    returns: ack
  random_mode:
    summary: Step the random or shuffle playback mode (PCPMR), then read it back
    send: ["@0PCPMR", "@0?PCPMR"]
    expect: *ack
    returns: ack
  get_random:
    summary: "Read the random mode (?PCPMR): S shuffle or R random, then OF off, SI sub item, IT item or AL all"
    send: "@0?PCPMR"
    expect: { reply_contains: "@0PCPMR", matches: '^@0PCPMR([SR][A-Z]{2})\r?$' }
    returns: value
  setup_menu:
    summary: Show the setup menu (PCSU)
    send: "@0PCSU"
    expect: *ack
    returns: ack
  top_menu:
    summary: Show a BD's or DVD's title menu (DVTP)
    send: "@0DVTP"
    expect: *ack
    returns: ack
  option_menu:
    summary: Show the playback option menu (DVOP)
    send: "@0DVOP"
    expect: *ack
    returns: ack
  popup_menu:
    summary: Show the disc's pop-up menu (DVPU)
    send: "@0DVPU"
    expect: *ack
    returns: ack
  menu_return:
    summary: Go back to the previous menu screen (PCRTN)
    send: "@0PCRTN"
    expect: *ack
    returns: ack
  audio_dialog:
    summary: Change to the next primary or secondary audio stream of a BD or DVD (DVADLG)
    params:
      stream: { type: enum, values: [primary, secondary], required: true, label: Audio stream, description: "primary or secondary audio." }
    send: "@0DVADLG{stream:map.dialog}"
    expect: *ack
    returns: ack
  subtitle:
    summary: Change the subtitle language of a BD or DVD (DVSBTL1)
    send: "@0DVSBTL1"
    expect: *ack
    returns: ack
  angle:
    summary: Step to the next video angle of a BD or DVD that has several (DVANGL+)
    send: "@0DVANGL+"
    expect: *ack
    returns: ack
  get_angle:
    summary: "Read the video angle's number (?DVANGL)"
    send: "@0?DVANGL"
    expect: { reply_contains: "@0DVANGL", matches: '^@0DVANGL([0-9]+)\r?$' }
    returns: value
  cursor:
    summary: Move the menu cursor (PCCUSR)
    params:
      direction: { type: enum, values: [left, right, up, down], required: true, label: Direction, description: "left, right, up or down." }
    send: "@0PCCUSR{direction:map.cursor}"
    expect: *ack
    returns: ack
  enter:
    summary: Confirm the selected item (PCENTR)
    send: "@0PCENTR"
    expect: *ack
    returns: ack
  tray:
    summary: Open or close the disc tray (PCDTRY)
    params:
      action: { type: enum, values: [open, close], required: true, label: Tray, description: "open or close the disc tray." }
    send: "@0PCDTRY{action:map.tray}"
    expect: *ack
    returns: ack
  display_info:
    summary: Show the bit rate and media information on screen (DVDSIF)
    send: "@0DVDSIF"
    expect: *ack
    returns: ack
  color_key:
    summary: Press a color key, whose function the disc gives (DVFCLR)
    params:
      color: { type: enum, values: [red, green, blue, yellow], required: true, label: Color, description: "red, green, blue or yellow." }
    send: "@0DVFCLR{color:map.color}"
    expect: *ack
    returns: ack
  pip_mode:
    summary: Step through the picture-in-picture modes (DVMO)
    send: "@0DVMO"
    expect: *ack
    returns: ack
  home:
    summary: Show the home menu (PCHM)
    send: "@0PCHM"
    expect: *ack
    returns: ack
  number_key:
    summary: Press a number key (PCTKEY)
    params:
      digit: { type: int, min: 0, max: 9, required: true, label: Digit, description: "The number key, 0-9." }
    send: "@0PCTKEY{digit}"
