  track.number: { type: int, description: "The current track: chapter or file (Tr)" }
  tracks.total: { type: int, description: "Tracks (Tt)" }
  group.number: { type: int, description: "The current group: title or folder (PCGp)" }
  groups.total: { type: int, description: "Groups (PCTG)" }
  time.elapsed: { type: string, description: "Elapsed time, H:MM:SS (ET)" }
  time.remaining: { type: string, description: "Remaining time, H:MM:SS (RM)" }
  track.time: { type: string, description: "The current track's time, M:SS or M:SS:FF with frames (tl)" }
  track.title: { type: string, description: "The current track's title (ti)" }
  track.artist: { type: string, description: "The current track's artist (at)" }
  track.album: { type: string, description: "The current track's album (al)" }
  track.sample_rate: { type: string, description: "The current track's sampling rate in kHz, or UKN (Fs)" }
  media.type: { type: string, description: "dvd_video, dvd_audio, cdda, cd_rom, sacd, dvd_vr, bdmv, bdav, avchd, dlna, external or unknown (PCTYP)" }
  audio.format: { type: string, description: "The audio format code: DBD, DTS, MPG, LPC, PPC, DSD, DD+, DTH, DHM, DLH, MP3, AAC, WMA or UKN (PCAFMT)" }
  audio.channels: { type: string, description: "The audio channel code: 1CH to 8CH, 21C to 71C, L/R, RCH, LCH or UKN (BDACH)" }
  audio.primary_language: { type: string, description: "The primary audio's ISO 639-2 language, or UKN (PCDG+)" }
  audio.secondary_language: { type: string, description: "The secondary audio's ISO 639-2 language, or UKN (PCDG-)" }
  subtitle.language: { type: string, description: "The subtitle's ISO 639-2 language, or UKN (DVSTC)" }
  angle: { type: int, description: "The video angle's number (DVANGL)" }
  version: { type: string, description: "The version digits and model name (VN)" }
  random.kind: { type: string, description: "shuffle or random (PCPMR)" }
  random.mode: { type: string, description: "off, sub_item, item or all (PCPMR)" }
  search.direction: { type: string, description: "forward or reverse (PCSLS)" }
  search.speed: { type: string, description: "fast or slow (PCSLS)" }
  rating: { type: string, description: "The rating limit: OFF, KIDSAFE, G, PG, PG13, R, NC-17 or ADULT (DVPCRT)" }
  area_code: { type: string, description: "The area code's country (DVPCAC)" }
  languages.osd: { type: string, description: "On-screen menu language, ISO 639-2 or OFF (DVLGOS)" }
  languages.menu: { type: string, description: "Disc menu language (DVLGDM)" }
  languages.audio: { type: string, description: "Audio language (DVLGAD)" }
  languages.subtitle: { type: string, description: "Subtitle language (DVLGST)" }
  picture.brightness: { type: int, description: "Brightness, -16 to +16 (DVPABN)" }
  picture.contrast: { type: int, description: "Contrast, -16 to +16 (DVPACT)" }
  picture.hue: { type: int, description: "Hue, -9 to +9 (DVPAHU)" }
