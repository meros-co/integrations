    expect: { reply_contains: "@0DVVR", matches: '^@0DVVR([0-9A-Za-z]+)\r?$' }
    returns: value
  set_mute:
    summary: "Set mute (mt), then read it back on the DN-500BD"
    params: { muted: { type: bool, required: true, label: "Mute", description: "On mutes the audio, off unmutes it." } }
    send:
      - "@0mt{muted:map.mute}"
      - { models: [dn-500bd], message: "@0?mt" }
    expect: *ack
    returns: ack
  get_mute:
    summary: "Read mute (?mt): 00 on, 01 off"
    send: "@0?mt"
    expect: { reply_contains: "@0mt", matches: '^@0mt([0-9A-Za-z]+)\r?$' }
    returns: value

quirks:
  - models: [all]
    severity: critical
    text: >
      factory_reset erases every setting, restore_settings replaces them with the backup, and firmware_upgrade starts
      an upgrade; none can be stopped from here. Changing the IP settings can take the player off the network.
  - models: [all]
    severity: warning
    text: >
      The player expects the host to answer each status it sends by itself with ACK, and sends it once more without
      one; the core answers each such status at once, opened for commands only too. The status that answers a status
      request is not a notification and is not answered: the next status after each request but ?PW (answered ACK
      alone) is taken as its answer (unless it has not come within the timeout, or NACK came instead). NACK, or BUSY
      when commands come too fast, fails the command.
  - models: [dn-500bd-mkii]
    severity: warning
    text: >
      The DN-500BD MKII's protocol guide documents RS-232C only, while its user guide offers control over the LAN
      port; the TCP port, 9030, is the one the DN-500BD's guide documents for the same commands (and the one the
      Bitfocus Companion module uses for the MKII). Its guide lists no status requests for the menu settings, the
      panel lock, the program mode or the time display, so on the MKII those sets are not read back; and it gives
      the rewind as PCSLSR and no separate fast forward (search forward covers it).
  - models: [all]
    severity: info
    text: >
      get_power is answered ACK when on and not at all when off (a timeout). The panel lock, the speaker
      configuration and the parental password cannot be read back; the DN-500BD's guide marks its statuses as not
      notified, so state is polled. The total group and group answers carry a "?" ("@0?PCTG0003"), as the guide
      gives them; the guides show a space before some answer values ("@0at xxx"), which is read with or without it.
  - models: [all]
    severity: info
    text: >
      The RS-232C speed's factory setting is not documented; 115200 is assumed, the speed the guides ask for so that
      every command works (the DN-500BD's user guide lists only 9600 and 38400). The speaker delay is in
      milliseconds as the guide gives it; its range is not documented.

