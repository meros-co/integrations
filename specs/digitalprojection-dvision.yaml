commands:
  set_power:
    summary: "Set power (POWR)"
    params:
      value: { type: bool, required: true, label: "Power", description: "1 to power on, 0 to power off (standby)." }
    send: ":POWR {value:bool01}"
    expect: { matches: "^%\\d{3} ?POWR " }
    returns: ack
  set_source:
    summary: "Set source (IABS)"
    params:
      value: { type: enum, values: ["vga1", "vga2", "dvi1", "component", "hdmi1", "dvi2", "hdmi2", "dual_head_dvi", "dual_head_hdmi", "dual_head_xp2", "xp2_a", "xp2_b"], required: true, label: "Source", description: "Source, as the projector names it." }
    send: ":IABS {value:map.iabs}"
    expect: { matches: "^%\\d{3} ?IABS " }
    returns: ack
  set_brightness:
    summary: "Set brightness (BRIG)"
    params:
      value: { type: int, min: -99999, max: 999999, required: true, label: "Brightness", description: "Picture brightness." }
    send: ":BRIG {value}"
    expect: { matches: "^%\\d{3} ?BRIG " }
    returns: ack
  set_contrast:
