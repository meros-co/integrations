  tatb_target: { "4_3": "0", "5_4": "1", "16_9": "2", "16_10": "3", "no_source": "4", "standby": "5" }
  tatb_value: { "on": "0", "off": "1", "no_change": "2" }
  edid_input: { "vga1": "0", "vga2": "1", "dvi1": "2", "hdmi1": "3", "dvi2": "12", "hdmi2": "14" }
  edir_value: { "auto": "0", "custom": "1", "vga": "2", "svga": "3", "xga": "4", "720p50": "5", "720p60": "6", "wxga_1366": "7", "sxga": "8", "sxga_plus": "9", "1080_deep_color": "10", "1080_standard": "11", "wuxga": "12", "wqxga": "13" }
  edit_value: { "dvi": "1", "hdmi": "2" }
  limit: { "maximum": "M", "minimum": "N", "default": "D", "step": "S" }

