      value: { type: int, min: 1, max: 31, required: true, label: "Clock day", description: "Real-time clock day of the month, 1 to 31." }
    send: ":RTCD {value}"
    expect: { matches: "^%\\d{3} ?RTCD " }
    returns: ack
  set_clock_month:
    summary: "Set clock month (RTCN)"
    params:
      value: { type: int, min: 1, max: 12, required: true, label: "Clock month", description: "Real-time clock month, 1 to 12." }
    send: ":RTCN {value}"
    expect: { matches: "^%\\d{3} ?RTCN " }
    returns: ack
  set_clock_year:
    summary: "Set clock year (RTCY)"
    params:
      value: { type: int, min: 2000, max: 2099, required: true, label: "Clock year", description: "Real-time clock year." }
    send: ":RTCY {value}"
    expect: { matches: "^%\\d{3} ?RTCY " }
    returns: ack
  set_stereo_mode:
    summary: "Set stereo mode (TDSM)"
    params:
      value: { type: bool, required: true, label: "Stereo mode", description: "True turns 3D stereo mode on (120 Hz only)." }
    send: ":TDSM {value:bool01}"
    expect: { matches: "^%\\d{3} ?TDSM " }
    returns: ack
  set_glass_type:
    summary: "Set glass type (TDGT)"
    params:
      value: { type: enum, values: ["dlp_link", "ir", "ir_high_brightness"], required: true, label: "Glass type", description: "Glass type, as the projector names it." }
    send: ":TDGT {value:map.tdgt}"
    expect: { matches: "^%\\d{3} ?TDGT " }
    returns: ack
  set_genlock_phase_delay:
    summary: "Set genlock phase delay (TDGD)"
    params:
      value: { type: int, min: -99999, max: 999999, required: true, label: "Genlock phase delay", description: "Stereo genlock phase delay." }
    send: ":TDGD {value}"
    expect: { matches: "^%\\d{3} ?TDGD " }
    returns: ack
  set_swap_eyes:
    summary: "Set swap eyes (TDSE)"
    params:
      value: { type: bool, required: true, label: "Swap eyes", description: "True swaps the left and right eyes." }
    send: ":TDSE {value:bool01}"
    expect: { matches: "^%\\d{3} ?TDSE " }
    returns: ack
  focus_in:
    summary: "Move focus in (FOIN)"
    params:
      speed: { type: enum, values: [slow, medium, fast], default: medium, label: Speed, description: "How fast the lens moves." }
    send: ":FOIN {speed:map.lens_speed}"
    expect: { matches: "^%\\d{3} ?FOIN " }
    returns: ack
  focus_out:
    summary: "Move focus out (FOUT)"
    params:
      speed: { type: enum, values: [slow, medium, fast], default: medium, label: Speed, description: "How fast the lens moves." }
    send: ":FOUT {speed:map.lens_speed}"
    expect: { matches: "^%\\d{3} ?FOUT " }
    returns: ack
  zoom_in:
    summary: "Zoom in (ZOIN)"
    params:
      speed: { type: enum, values: [slow, medium, fast], default: medium, label: Speed, description: "How fast the lens moves." }
    send: ":ZOIN {speed:map.lens_speed}"
    expect: { matches: "^%\\d{3} ?ZOIN " }
    returns: ack
  zoom_out:
    summary: "Zoom out (ZOUT)"
    params:
      speed: { type: enum, values: [slow, medium, fast], default: medium, label: Speed, description: "How fast the lens moves." }
    send: ":ZOUT {speed:map.lens_speed}"
    expect: { matches: "^%\\d{3} ?ZOUT " }
    returns: ack
  iris_open:
    summary: "Open the iris (IROP)"
    params:
      speed: { type: enum, values: [slow, medium, fast], default: medium, label: Speed, description: "How fast the lens moves." }
    send: ":IROP {speed:map.lens_speed}"
    expect: { matches: "^%\\d{3} ?IROP " }
    returns: ack
  iris_close:
    summary: "Close the iris (IRCL)"
    params:
      speed: { type: enum, values: [slow, medium, fast], default: medium, label: Speed, description: "How fast the lens moves." }
    send: ":IRCL {speed:map.lens_speed}"
    expect: { matches: "^%\\d{3} ?IRCL " }
    returns: ack
  lens_shift_down:
    summary: "Shift the lens down (LSDW)"
    params:
      speed: { type: enum, values: [slow, medium, fast], default: medium, label: Speed, description: "How fast the lens moves." }
    send: ":LSDW {speed:map.lens_speed}"
    expect: { matches: "^%\\d{3} ?LSDW " }
    returns: ack
  lens_shift_up:
    summary: "Shift the lens up (LSUP)"
    params:
      speed: { type: enum, values: [slow, medium, fast], default: medium, label: Speed, description: "How fast the lens moves." }
    send: ":LSUP {speed:map.lens_speed}"
    expect: { matches: "^%\\d{3} ?LSUP " }
    returns: ack
  lens_shift_left:
    summary: "Shift the lens left (LSLF)"
    params:
      speed: { type: enum, values: [slow, medium, fast], default: medium, label: Speed, description: "How fast the lens moves." }
    send: ":LSLF {speed:map.lens_speed}"
    expect: { matches: "^%\\d{3} ?LSLF " }
    returns: ack
  lens_shift_right:
    summary: "Shift the lens right (LSRH)"
    params:
      speed: { type: enum, values: [slow, medium, fast], default: medium, label: Speed, description: "How fast the lens moves." }
    send: ":LSRH {speed:map.lens_speed}"
    expect: { matches: "^%\\d{3} ?LSRH " }
    returns: ack
  set_shutter:
    summary: "Set shutter (SHUT)"
    params:
      value: { type: bool, required: true, label: "Shutter", description: "True closes the shutter, false opens it." }
    send: ":SHUT {value:bool01}"
    expect: { matches: "^%\\d{3} ?SHUT " }
    returns: ack
  set_lens_monitoring:
    summary: "Set lens monitoring (LMON)"
    params:
      value: { type: bool, required: true, label: "Lens monitoring", description: "True turns lens monitoring on." }
    send: ":LMON {value:bool01}"
    expect: { matches: "^%\\d{3} ?LMON " }
    returns: ack
  menu:
    summary: "Toggle the OSD menu (MENU)"
    send: ":MENU"
    expect: { matches: "^%\\d{3} ?MENU " }
    returns: ack
  menu_up:
    summary: "Navigate up in the OSD menu (NVUP)"
    send: ":NVUP"
    expect: { matches: "^%\\d{3} ?NVUP " }
    returns: ack
  menu_down:
    summary: "Navigate down in the OSD menu (NVDW)"
    send: ":NVDW"
    expect: { matches: "^%\\d{3} ?NVDW " }
    returns: ack
  menu_left:
    summary: "Navigate left in the OSD menu (NVLF)"
    send: ":NVLF"
    expect: { matches: "^%\\d{3} ?NVLF " }
    returns: ack
  menu_right:
    summary: "Navigate right in the OSD menu (NVRH)"
    send: ":NVRH"
    expect: { matches: "^%\\d{3} ?NVRH " }
    returns: ack
  menu_ok:
    summary: "Press OK in the OSD menu (NVOK)"
    send: ":NVOK"
    expect: { matches: "^%\\d{3} ?NVOK " }
    returns: ack
  set_echo:
    summary: "Set acknowledges (ECHO)"
    params:
      value: { type: bool, required: true, label: "Acknowledges", description: "True makes the projector acknowledge every command (the default); false turns acknowledges off." }
    send: ":ECHO {value:bool01}"
    expect: { matches: "^%\\d{3} ?ECHO " }
    returns: ack
  set_language:
    summary: "Set language (LANG)"
    params:
      value: { type: int, min: -99999, max: 999999, required: true, label: "Language", description: "OSD language number." }
    send: ":LANG {value}"
    expect: { matches: "^%\\d{3} ?LANG " }
    returns: ack
  show_info:
    summary: "Show the information OSD (SINF)"
    send: ":SINF"
    expect: { matches: "^%\\d{3} ?SINF " }
    returns: ack
  set_aspect_trigger:
    summary: Set what a trigger output does for an input aspect ratio or state (TATB target value)
    params:
      target: { type: enum, values: ["4_3", "5_4", "16_9", "16_10", no_source, standby], required: true, label: Aspect or state, description: "The input aspect ratio, or no source or standby, whose trigger behavior is set." }
      behavior: { type: enum, values: ["on", "off", no_change], required: true, label: Behavior, description: "Whether the trigger is on, off or left unchanged then." }
    send: ":TATB {behavior:map.tatb_value} {target:map.tatb_target}"
    expect: { matches: "^%\\d{3} ?TATB " }
    returns: ack
  get_aspect_trigger:
    summary: Read what a trigger output does for an input aspect ratio or state (TATB ? target)
    params:
      target: { type: enum, values: ["4_3", "5_4", "16_9", "16_10", no_source, standby], required: true, label: Aspect or state, description: "The input aspect ratio, or no source or standby, whose trigger behavior is read." }
    send: ":TATB ? {target:map.tatb_target}"
    expect: { matches: "^%\\d{3} ?TATB ?0*(\\d+)" }
    returns: value
  set_edid_resolution:
    summary: Set the EDID resolution an input announces (EDIR value target)
    params:
      input: { type: enum, values: [vga1, vga2, dvi1, hdmi1, dvi2, hdmi2], required: true, label: Input, description: "The input whose EDID is set." }
      resolution: { type: enum, values: [auto, custom, vga, svga, xga, 720p50, 720p60, wxga_1366, sxga, sxga_plus, 1080_deep_color, 1080_standard, wuxga, wqxga], required: true, label: Resolution, description: "The EDID resolution; WQXGA on the DVI inputs only, custom not implemented." }
    send: ":EDIR {resolution:map.edir_value} {input:map.edid_input}"
    expect: { matches: "^%\\d{3} ?EDIR " }
    returns: ack
  get_edid_resolution:
    summary: Read the EDID resolution an input announces (EDIR ? target)
    params:
      input: { type: enum, values: [vga1, vga2, dvi1, hdmi1, dvi2, hdmi2], required: true, label: Input, description: "The input whose EDID is read." }
    send: ":EDIR ? {input:map.edid_input}"
    expect: { matches: "^%\\d{3} ?EDIR ?0*(\\d+)" }
    returns: value
  set_edid_type:
    summary: Set whether an HDMI input announces a DVI or an HDMI EDID (EDIT value target)
    params:
      input: { type: enum, values: [hdmi1, hdmi2], required: true, label: Input, description: "The HDMI input whose EDID type is set." }
      type: { type: enum, values: [dvi, hdmi], required: true, label: EDID type, description: "DVI or HDMI." }
    send: ":EDIT {type:map.edit_value} {input:map.edid_input}"
    expect: { matches: "^%\\d{3} ?EDIT " }
    returns: ack
  get_edid_type:
    summary: Read whether an HDMI input announces a DVI or an HDMI EDID (EDIT ? target)
    params:
      input: { type: enum, values: [hdmi1, hdmi2], required: true, label: Input, description: "The HDMI input whose EDID type is read." }
    send: ":EDIT ? {input:map.edid_input}"
    expect: { matches: "^%\\d{3} ?EDIT ?0*(\\d+)" }
    returns: value
  set_pin_code:
    summary: Enter the PIN code (PINC)
    params:
      code: { type: int, min: 0, max: 999999, required: true, secret: true, label: PIN code, description: "The projector's PIN code." }
    send: ":PINC {code}"
    expect: { matches: "^%\\d{3} ?PINC " }
    returns: ack
  enter_service_code:
    summary: Enter a service code for a higher access level (CODE)
    params:
      code: { type: int, min: 0, max: 999999, required: true, secret: true, label: Service code, description: "The service code Digital Projection gives." }
    send: ":CODE {code}"
    expect: { matches: "^%\\d{3} ?CODE " }
    returns: ack
  step:
    summary: Change a setting relative to its value (mnemonic R step)
    params:
      setting: &mnemonic { type: string, pattern: "^[A-Za-z0-9]{4}$", required: true, label: Setting, description: "The protocol's four-character mnemonic, such as BRIG or CNTR." }
      amount: { type: int, min: -99999, max: 99999, required: true, label: Steps, description: "Steps to add, negative to subtract." }
    send: ":{setting:upper} R{amount}"
    expect: { matches: "^%\\d{3} ?[A-Z0-9]{4} ?(-?\\d+)" }
    returns: value
  get:
    summary: Read any setting's current value by its mnemonic (mnemonic ?); the reply also updates state
    params:
      setting: *mnemonic
    send: ":{setting:upper} ?"
    expect: { matches: "^%\\d{3} ?[A-Z0-9]{4} ?(.*?)\\s*$" }
    returns: value
  get_limit:
    summary: Read a setting's maximum, minimum, default or step value (mnemonic ?M, ?N, ?D or ?S)
    params:
      setting: *mnemonic
      limit: { type: enum, values: [maximum, minimum, default, step], required: true, label: Limit, description: "Which limit of the setting is read." }
    send: ":{setting:upper} ?{limit:map.limit}"
    expect: { matches: "^%\\d{3} ?[A-Z0-9]{4} ?(-?\\d+)" }
    returns: value

