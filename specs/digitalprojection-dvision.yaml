spec: 1
id: digitalprojection-dvision
name: Digital Projection dVision 35 and dVision Scope (ASCII protocol)
vendor: Digital Projection
category: display

# The ASCII protocol of Digital Projection's dVision 35 and dVision Scope
# displays, the same on the LAN (TCP 1025) and on RS-232 (19200 8N1): ":" +
# a four-character mnemonic + an optional modifier (R for a relative change,
# ?, ?M, ?N, ?D, ?S to read) + a value, ended by CR. Every command is
# acknowledged "%" + the projector's three-digit address + the mnemonic + a
# six-character value, ended by CR; an error puts !0000n in the value, a
# string "e00001" and the text. The protocol pushes nothing: state is polled
# and follows each acknowledge.
source:
  - title: "Communication Protocol, dVision 35 and dVision Scope displays"
    author: Digital Projection Ltd
    url: https://digitalprojection.co.uk/dpdownloads/Protocol/dVision35%20and%20Scope%20External%20Control%20Protocol.pdf
    note: >
      Manufacturer document (retrieved 2026-10-28). LAN defaults and TCP/UDP
      port 1025 (p.3); RS-232 19200 N 8 1, no flow control, straight 9-pin
      cable (p.4); timing (30 s after power on, wait for each response, 2 s
      before resending, 500 ms between commands, 5 s after 20 commands), the
      message structure, modifiers, the acknowledge and its error codes
      (p.5-6); examples (p.6-7); the command table (p.9-14) and value tables
      (p.15-17).

transport:
  type: line-tcp
  port: 1025
  framing: terminated
  terminator: cr
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  reply_match: "^%"
  probe: ":POST ?"
  pacing:
    min_interval_ms: 500
    groups:
      power_on:
        match: "^:POWR ?1$"
        after_ms: 30000
  serial:
    baud_rate: 19200
    data_bits: 8
    parity: none
    stop_bits: 1
    flow_control: none

ports:
  - { port: 1025, protocol: tcp, role: control, when: "link tcp" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "RS-232, 9-pin D-sub, straight cable" }

maps:
