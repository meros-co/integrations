  orie: { "desktop_front": "0", "ceiling_rear": "1", "desktop_rear": "2", "ceiling_front": "3" }
  osdc: { "off": "0", "warnings_only": "1", "on": "2" }
  lmod: { "single_lamp_1": "0", "single_lamp_2": "1", "dual_lamps": "2", "auto_lamp_switch": "3" }
  trg: { "on": "1", "off": "2", "screen": "3", "aspect": "4" }
  flot: { "auto": "0", "ttl": "1", "75_ohm": "2" }
  baud: { "4800": "4800", "9600": "9600", "19200": "19200", "38400": "38400", "57600": "57600", "115200": "115200" }
  tdgt: { "dlp_link": "0", "ir": "1", "ir_high_brightness": "2" }
