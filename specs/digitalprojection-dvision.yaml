quirks:
  - models: [all]
    severity: critical
    text: >
      factory_reset resets the projector at once, to the level set_factory_reset_full
      chooses; power off (set_power false) puts the projector in standby, and it
      takes no command for 30 s after powering on.
  - models: [all]
    severity: warning
    text: >
      The document asks for 500 ms between commands (kept by the core's pacing),
      30 s after power on (kept), and a 5 s pause after every 20 commands, which
      the format cannot count: the polls are spread out to stay well under it,
      but a burst of more than 20 commands from a consumer should be paced by
      the consumer.
  - models: [all]
    severity: info
    text: >
      Value ranges are not in the document for most settings; the projector
      reports them through get_limit (?M, ?N, ?D, ?S), and a value out of range
      is answered !00004. The int parameters therefore take any six-digit
      value. The document's command table is printed with some descriptions
      and comments one row off; the value meanings follow the value tables.
  - models: [all]
    severity: info
    text: >
      Commands with no value in the document (picture reset, the menu keys,
      the resets, show info) are sent as the mnemonic alone, and the per-input,
      per-scaling, per-gamma and per-orientation shortcut mnemonics (IDVI,
      S169, GAVI, DESK and the like) are left out: the abs-value commands
      (IABS, SABS, GABS, ORIE) and get read and set the same settings.
  - models: [all]
    severity: info
    text: >
      Lamp commands answer !00002 (not available) on LED models and the LED
      dim commands on lamp models; LPW1 is lamp 1's power on lamp models and
      the LED power on LED models. Shutter and ECHO are set-only.
  - models: [all]
    severity: info
    text: >
      No request lists the inputs: the document's command table has only IABS (set source
      abs values, set and read the selected input), with the inputs in the IABS value
      table (Value tables, p. 15). MODL (Model Name) and PLAT (Platform Name) are read on
      connecting into model_name and platform.
