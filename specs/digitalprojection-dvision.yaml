    send: ":SABS {value:map.sabs}"
    expect: { matches: "^%\\d{3} ?SABS " }
    returns: ack
  set_gamma:
    summary: "Set gamma (GABS)"
    params:
      value: { type: enum, values: ["film_2_2", "film_2_8", "video_1", "video_2", "computer_1", "computer_2"], required: true, label: "Gamma", description: "Gamma, as the projector names it." }
    send: ":GABS {value:map.gabs}"
    expect: { matches: "^%\\d{3} ?GABS " }
    returns: ack
  set_brilliant_color:
    summary: "Set brilliantColor (BCCR)"
    params:
      value: { type: enum, values: ["off", "computer_balanced", "video_balanced", "computer_native", "video_native"], required: true, label: "BrilliantColor", description: "BrilliantColor, as the projector names it." }
    send: ":BCCR {value:map.bccr}"
