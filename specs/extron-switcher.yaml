    - match: '^Rate(?:1\*)?\s*0*(\d+)$'
      state: { output_rate: "{1}" }
    - match: '^(?:Test(?:1\*)?\s*)?0*(\d+)$'
      request_match: '^\x1b1?TEST$'
      state: { test_pattern: "{1}" }
    - match: '^Test(?:1\*)?\s*0*(\d+)$'
      state: { test_pattern: "{1}" }
    - match: '^(?:Swef(?:O1\*)?)?([0-3])$'
      request_match: '^\x1b(?:O1)?SWEF$'
      state: { switch_effect: "{1}" }
    - match: '^Swef(?:O1\*)?([0-3])$'
      state: { switch_effect: "{1}" }
    - match: '^(?:Ausw)?([0-2])$'
      request_match: '^\x1bAUSW$'
      state: { auto_switch_mode: "{1}" }
    - match: '^Ausw([0-2])$'
      state: { auto_switch_mode: "{1}" }
    - match: '^(?:AuswT\s*)?0*(\d+)$'
      request_match: '^\x1bTAUSW$'
      state: { auto_switch_timeout: "{1}" }
    - match: '^AuswT\s*0*(\d+)$'
      state: { auto_switch_timeout: "{1}" }
    - match: '^(?:AuswP\s*)?([1-8](?: [1-8])+)$'
      request_match: '^\x1bPAUSW$'
      state: { auto_switch_priority: "{1}" }
    - match: '^AuswP\s*([1-8](?: [1-8])+)$'
      state: { auto_switch_priority: "{1}" }
    - match: '^(?:Alvl\s*)?0*(\d+)$'
      request_match: '^\x1bALVL$'
      state: { auto_image_threshold: "{1}" }
    - match: '^Alvl\s*0*(\d+)$'
      state: { auto_image_threshold: "{1}" }
    - match: '^Oscn\s*([1-6])\s*\*\s*([0-2])$'
      state: { "overscan.{1}": "{2}" }
    - match: '^([0-2])$'
      request_match: '^\x1b([1-6])OSCN$'
      state: { "overscan.{2}": "{1}" }
    - match: '^(?:Mdur\s*)?0*(\d+)$'
      request_match: '^\x1bMDUR$'
      state: { osd_duration: "{1}" }
    - match: '^Mdur\s*0*(\d+)$'
      state: { osd_duration: "{1}" }
    - match: '^Ssav\s*M\s*(?:1\s*\*\s*)?([0-3])$'
      state: { screen_saver.mode: "{1}" }
    - match: '^([0-3])$'
      request_match: '^\x1bM1?SSAV$'
      state: { screen_saver.mode: "{1}" }
    - match: '^Ssav\s*T\s*(?:1\s*\*\s*)?0*(\d+)$'
      state: { screen_saver.timeout: "{1}" }
    - match: '^0*(\d+)$'
      request_match: '^\x1bT1?SSAV$'
      state: { screen_saver.timeout: "{1}" }
    - match: '^Ssav\s*S\s*(?:1\s*\*\s*)?([0-2])$'
      state: { screen_saver.status: "{1}" }
    - match: '^([0-2])$'
      request_match: '^\x1bS1?SSAV$'
      state: { screen_saver.status: "{1}" }
    - match: '^Ssav\s*C\s*([0-9A-Fa-f]{6})$'
      state: { screen_saver.color: "{1}" }
    - match: '^(?:Vrb)?([0-3])$'
      request_match: '^\x1bCV$'
      state: { verbose_mode: "{1}" }
    - match: '^Vrb([0-3])$'
      state: { verbose_mode: "{1}" }
    - match: '^Play0*(\d+)\*([01])$'
      state: { audio_playback_slot: "{1}", audio_playing: { value: "{2}", map: { "0": false, "1": true } } }
    # Signal presence: "IN00 1*0*1..." pushed on a sync change, and the tagged 0LS reply. One rule per
    # input position (up to 8).
    - match: '^I[Nn]00\s*([01])(?:\*[01])*$'
      state: { "inputs.1.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*[01]\*([01])(?:\*[01])*$'
      state: { "inputs.2.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*(?:[01]\*){2}([01])(?:\*[01])*$'
      state: { "inputs.3.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*(?:[01]\*){3}([01])(?:\*[01])*$'
      state: { "inputs.4.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*(?:[01]\*){4}([01])(?:\*[01])*$'
      state: { "inputs.5.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*(?:[01]\*){5}([01])(?:\*[01])*$'
      state: { "inputs.6.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*(?:[01]\*){6}([01])(?:\*[01])*$'
      state: { "inputs.7.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*(?:[01]\*){7}([01])(?:\*[01])*$'
      state: { "inputs.8.signal": { value: "{1}", map: { "0": false, "1": true } } }
    # IN1604 (IN1604 guide p.35-48).
    - models: [in1604-dtp, in1604-hd]
      match: '^Hsrt\s*0*(\d+)\s*\*\s*0*(\d+)$'
      state: { "inputs.{1}.horizontal_start": "{2}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^Vsrt\s*0*(\d+)\s*\*\s*0*(\d+)$'
      state: { "inputs.{1}.vertical_start": "{2}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^Phas\s*0*(\d+)\s*\*\s*0*(\d+)$'
      state: { "inputs.{1}.pixel_phase": "{2}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^Tpix\s*0*(\d+)\s*\*\s*0*(\d+)$'
      state: { "inputs.{1}.total_pixels": "{2}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^Apix\s*0*(\d+)\s*\*\s*0*(\d+)$'
      state: { "inputs.{1}.active_pixels": "{2}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^Alin\s*0*(\d+)\s*\*\s*0*(\d+)$'
      state: { "inputs.{1}.active_lines": "{2}" }
    - match: '^EdidA\s*0*(\d+)\*0*(\d+)$'
      models: [in1604-dtp, in1604-hd]
      state: { "inputs.{1}.edid": "{2}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^0*(\d+)$'
      request_match: '^\x1bA(\d+)EDID$'
      state: { "inputs.{2}.edid": "{1}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^(?:Vtpo\s*)?([0-7])$'
      request_match: '^\x1b[0-7]?VTPO$'
      state: { output_format: "{1}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^(?:Vtpo\s*)?([0-7])$'
      request_match: '^\x1b1\*VTPO$'
      state: { auto_output_format: "{1}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^([0-2])$'
      request_match: '^B$'
      state: { video_mute_all: "{1}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^Amt\s*([12])\s*\*\s*([01])$'
      state: { "audio_outputs.{1}.muted": { value: "{2}", map: { "0": false, "1": true } } }
    - models: [in1604-dtp, in1604-hd]
      match: '^Amt([01])$'
      state:
        audio_outputs.1.muted: { value: "{1}", map: { "0": false, "1": true } }
        audio_outputs.2.muted: { value: "{1}", map: { "0": false, "1": true } }
    - models: [in1604-dtp, in1604-hd]
      match: '^Amt\s*([01])\s+([01])$'
      state:
        audio_outputs.1.muted: { value: "{1}", map: { "0": false, "1": true } }
        audio_outputs.2.muted: { value: "{2}", map: { "0": false, "1": true } }
    - models: [in1604-dtp, in1604-hd]
      match: '^([01])\s+([01])$'
      request_match: '^Z$'
      state:
        audio_outputs.1.muted: { value: "{1}", map: { "0": false, "1": true } }
        audio_outputs.2.muted: { value: "{2}", map: { "0": false, "1": true } }
    - models: [in1604-dtp, in1604-hd]
      match: '^AfmtI\s*0*(\d+)\*([0-8])$'
      state: { "inputs.{1}.audio_format": "{2}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^([0-8])$'
      request_match: '^\x1bI(\d+)AFMT$'
      state: { "inputs.{2}.audio_format": "{1}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^Aud\s*([-+]?\d+)$'
      state: { audio_gain: "{1}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^([-+]?\d+)$'
      request_match: '^G$'
      state: { audio_gain: "{1}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^Vol\s*([-+]?\d+)$'
      state: { volume: "{1}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^([-+]?\d+)$'
      request_match: '^V$'
      state: { volume: "{1}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^(?:AfmtO1\*)?([12])$'
      request_match: '^\x1bO(?:1\*\d)?AFMT$'
      state: { audio_output_format: "{1}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^AfmtO1\*([12])$'
      state: { audio_output_format: "{1}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^Mutm\s*([0-2])\s*\*\s*([0-2])$'
      state: { contact.av_mute_mode: "{1}", contact.tally_mode: "{2}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^([0-2])\s*\*\s*([0-2])$'
      request_match: '^\x1bMUTM$'
      state: { contact.av_mute_mode: "{1}", contact.tally_mode: "{2}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^Menu\s*([01])$'
      state: { osd_menu_open: { value: "{1}", map: { "0": false, "1": true } } }
    - models: [in1604-dtp, in1604-hd]
      match: '^([01])$'
      request_match: '^\x1bMENU$'
      state: { osd_menu_open: { value: "{1}", map: { "0": false, "1": true } } }
    - models: [in1604-dtp, in1604-hd]
      match: '^Ipn\s*(\S+)$'
      state: { unit_name: "{1}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^Pnam1\*0*(\d+),(.*)$'
      state: { "user_presets.{1}.name": "{2}" }
    - models: [in1604-dtp, in1604-hd]
      match: '^Pnam2\*0*(\d+),(.*)$'
      state: { "input_presets.{1}.name": "{2}" }
    - models: [in1604-dtp]
      match: '^(?:HdbtO1\*)?([01])$'
      request_match: '^\x1bO1HDBT$'
      state: { tp_output_format: "{1}" }
    - models: [in1604-dtp]
      match: '^HdbtO1\*([01])$'
      state: { tp_output_format: "{1}" }
    # IN1604 signal presence: "In00 1 0 1 1" (tagged) or "1 0 1 1" (bare), one digit per input.
    - models: [in1604-dtp, in1604-hd]
      match: '^I[Nn]00\s+'
      match_each: '([01])'
      state: { "inputs.{index:+1}.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - models: [in1604-dtp, in1604-hd]
      match: '^([01](?:\s[01])*)$'
      request_match: '^\x1b0LS$'
      match_each: '([01])'
      match_each_in: 1
      state: { "inputs.{index:+1}.signal": { value: "{2}", map: { "0": false, "1": true } } }
