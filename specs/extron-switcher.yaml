    params:
      frozen: { type: bool, required: true,
                label: Freeze,
                description: "True freezes the output's picture, false releases it." }
    send: "1*{frozen:bool01}F"
    expect: { matches: '^Frz1\*[01]$' }
    returns: ack
  get_freeze:
    summary: Get whether the output is frozen (1F)
    send: "1F"
    expect: { matches: '^(?:Frz1\*)?([01])$' }
    returns: value
  set_freeze_in1600:
    summary: Freeze or unfreeze the current input (1F / 0F)
    params:
      frozen: { type: bool, required: true,
                label: Freeze,
                description: "True freezes the current input's picture, false releases it." }
    send: "{frozen:bool01}F"
    expect: { matches: '^Frz[01]$' }
    returns: ack
  get_freeze_in1600:
    summary: Get whether the current input is frozen (F)
