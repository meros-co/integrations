      state: { "outputs.{2}.video_mute": "{1}" }
    - match: '^Vmt([0-2])$'
      state: { video_mute_all: "{1}" }
    # IN1808: B answers one digit per output.
    - match: '^(?:Vmt)?([0-2]) ([0-2]) ([0-2])$'
      state: { outputs.1.video_mute: "{1}", outputs.2.video_mute: "{2}", outputs.3.video_mute: "{3}" }
    - match: '^VnamI\s*0*(\d+)\*(.*)$'
