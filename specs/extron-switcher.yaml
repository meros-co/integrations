       increase_brightness_current_input, decrease_brightness_current_input,
       increase_detail_current_input, decrease_detail_current_input, increase_color_current_input,
       decrease_color_current_input, increase_tint_current_input, decrease_tint_current_input,
       set_image_horizontal_position, increase_image_horizontal_position,
       decrease_image_horizontal_position, get_image_horizontal_position, set_image_vertical_position,
       increase_image_vertical_position, decrease_image_vertical_position, get_image_vertical_position,
       set_image_width, increase_image_width, decrease_image_width, get_image_width, set_image_height,
       increase_image_height, decrease_image_height, get_image_height, delete_user_preset,
       delete_input_preset, set_user_preset_name, get_user_preset_name, set_input_preset_name,
       get_input_preset_name, set_output_format_in1604, get_output_format_in1604,
       get_auto_output_format_in1604, set_screen_saver_mode_in1604, set_output_rate_in1604,
       set_audio_mute_all_in1604, set_audio_mute_in1604, get_audio_mute_in1604,
       set_audio_input_format_in1604, get_audio_input_format_in1604, set_audio_gain_in1604,
       increase_audio_gain_in1604, decrease_audio_gain_in1604, get_audio_gain_in1604, set_volume_in1604,
       increase_volume_in1604, decrease_volume_in1604, get_volume_in1604, set_audio_output_format,
       get_audio_output_format, set_test_pattern_in1604, set_overscan_in1604, get_overscan_in1604,
       get_signal_status_in1604, set_output_hdcp_mode_in1604, set_contact_mute_mode,
       get_contact_mute_mode, osd_menu, get_osd_menu, set_unit_name, reset_unit_name, get_unit_name,
       get_description_in1604, get_temperature_in1604]
    verification: none
    notes: >
      Inputs 1 (configurable VGA: RGB, YUV, S-video or composite) and 2-4
      (HDMI or DVI); one scaled output (p.30). Picture, analog timing and
      audio gain controls adjust the current input (p.36-43). Front panel
      lockout 0 off, 1 complete, 2 input switching and Auto-Image only;
      power save 0 full, 1 low; screen saver 1 black, 2 blue; auto switch
      0 off, 1 highest, 2 lowest active input (p.41-46). RS-232 and USB
      control only.

commands:
  # ── Input selection (IN1808 p.63; IN1608 p.50) ──────────────────────────
  select_input:
    summary: Select an input's video and audio for the output (X!*1!); 9 is the aux audio input
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}*1!"
    expect: { matches: '^In\s*\d+(?:\*1)?\s*All$' }
    returns: ack
  select_video_input:
    summary: Select an input's video only (breakaway) (X!*1%)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}*1%"
    expect: { matches: '^In\s*\d+(?:\*1)?\s*Vid$' }
    returns: ack
  select_audio_input:
    summary: Select an input's audio only (breakaway) (X!*1$); 9 is the aux audio input
    params:
      input: { type: int, min: 1, max: 9, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel; 9 is the IN1808's aux audio input." }
    send: "{input}*1$"
    expect: { matches: '^In\s*\d+(?:\*1)?\s*Aud$' }
    returns: ack
  get_input:
    summary: Get the input whose video and audio go to the output (1!); E13 in breakaway
    send: "1!"
    expect: { matches: '^(?:In\s*)?0*(\d+)(?:\*1)?(?:\s*All)?$' }
    returns: value
  get_video_input:
    summary: Get the video input (1%)
    send: "1%"
    expect: { matches: '^(?:In\s*)?0*(\d+)(?:\*1)?(?:\s*Vid)?$' }
    returns: value
  get_audio_input:
    summary: Get the audio input (1$)
    send: "1$"
    expect: { matches: '^(?:In\s*)?0*(\d+)(?:\*1)?(?:\s*Aud)?$' }
    returns: value
  select_input_in1600:
    summary: Select an input's video and audio (X!!)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}!"
    expect: { matches: '^In\s*\d+\s*All$' }
    returns: ack
  select_video_input_in1600:
    summary: Select an input's video only (X!&); not allowed from an input set to a digital audio format (E17)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}&"
    expect: { matches: '^In\s*\d+\s*RGB$' }
    returns: ack
  select_audio_input_in1600:
    summary: Select an input's audio only (X!$); not allowed to an input set to a digital audio format (E17)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}$"
    expect: { matches: '^In\s*\d+\s*Aud$' }
    returns: ack
  get_input_in1600:
    summary: Get the current video and audio input (!)
    send: "!"
    expect: { matches: '^(?:In\s*)?0*(\d+)(?:\s*All)?$' }
    returns: value
  get_video_input_in1600:
    summary: Get the current video input (&)
    send: "&"
    expect: { matches: '^(?:In\s*)?0*(\d+)(?:\s*RGB)?$' }
    returns: value
  get_audio_input_in1600:
    summary: Get the current audio input ($)
    send: "$"
    expect: { matches: '^(?:In\s*)?0*(\d+)(?:\s*Aud)?$' }
    returns: value

  # ── Loop out and names ──────────────────────────────────────────────────
  set_loop_out_input:
    summary: Tie the HDMI loop output to an input (Esc X!LOUT)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}LOUT"
    expect: { matches: '^Lout\s*\d+$' }
    returns: ack
  get_loop_out_input:
    summary: Get the input on the loop output (Esc LOUT)
    send: "\x1bLOUT"
    expect: { matches: '^(?:Lout\s*)?0*(\d+)$' }
    returns: value
  set_input_name:
    summary: Name a video input, up to 32 characters; a single space restores the default (Esc IX!*name VNAM)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      name: { type: string, max_length: 32, pattern: '^[^,*|]+$', required: true,
              label: Name,
              description: "Name to give, without commas, asterisks or |; a single space restores the default." }
    send: "\x1bI{input}*{name}VNAM"
    expect: { matches: '^VnamI' }
    returns: ack
  get_input_name:
    summary: Get a video input's name (Esc IX!VNAM)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1bI{input}VNAM"
    expect: { matches: '^(?:VnamI\s*\d+\*)?(.*)$' }
    returns: value
  set_output_name:
    summary: Name a video output (1A, 1B, loop), up to 32 characters (Esc OX@*name VNAM)
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
      name: { type: string, max_length: 32, pattern: '^[^,*|]+$', required: true,
              label: Name,
              description: "Name to give, up to 32 characters, without commas, asterisks or |." }
    send: "\x1bO{output}*{name}VNAM"
    expect: { matches: '^VnamO' }
    returns: ack
  get_output_name:
    summary: Get a video output's name (Esc OX@VNAM)
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
    send: "\x1bO{output}VNAM"
    expect: { matches: '^(?:VnamO\s*\d+\*)?(.*)$' }
    returns: value
  set_input_name_in1600:
    summary: Name an input, up to 16 characters; a single space restores the default (Esc X!,name NI)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      name: { type: string, max_length: 16, pattern: '^[^,*|]+$', required: true,
              label: Name,
              description: "Name to give, without commas, asterisks or |; a single space restores the default." }
    send: "\x1b{input},{name}NI"
    expect: { matches: '^Nmi' }
    returns: ack
  get_input_name_in1600:
    summary: Get an input's name (Esc X!NI)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}NI"
    expect: { matches: '^(?:Nmi\s*\d+,)?(.*)$' }
    returns: value

  # ── Input configuration ─────────────────────────────────────────────────
  auto_image:
    summary: Run Auto-Image on the current input, following its aspect ratio, filling the output, or keeping the input's aspect (1*0A / 1*1A / 1*2A)
    params:
      mode: { type: enum, values: ["0", "1", "2"], default: "0",
              label: Auto-Image mode,
              description: "0 follows the input's aspect ratio, 1 fills the output, 2 keeps the input's aspect." }
    send: "1*{mode}A"
    expect: { matches: '^Img1\*[0-2]$' }
    returns: ack
  auto_image_in1600:
    summary: Run Auto-Image on the current input, following the input's aspect ratio setting (A)
    send: "A"
    expect: { matches: '^Img0$' }
    returns: ack
  auto_image_fill_in1600:
    summary: Run Auto-Image on the current input and fill the output (1*A)
    send: "1*A"
    expect: { matches: '^Img1$' }
    returns: ack
  auto_image_keep_aspect_in1600:
    summary: Run Auto-Image on the current input keeping its aspect ratio (2*A)
    send: "2*A"
    expect: { matches: '^Img2$' }
    returns: ack
  set_auto_image:
    summary: Turn automatic Auto-Image on or off for an input (X!*1A / X!*0A)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      enabled: { type: bool, required: true,
                 label: Auto-Image,
                 description: "True runs Auto-Image automatically when the input's signal changes, false turns it off." }
    send: "{input}*{enabled:bool01}A"
    expect: { matches: '^Img\s*\d+\*[01]$' }
    returns: ack
  get_auto_image:
    summary: Get whether automatic Auto-Image is on for an input (X!A)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}A"
    expect: { matches: '^(?:Img\s*\d+\*)?([01])$' }
    returns: value
  set_input_hdcp_authorized:
    summary: Allow or block HDCP-encrypted content on an input (Esc EX!*1HDCP / *0)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      allowed: { type: bool, required: true,
                 label: HDCP allowed,
                 description: "True lets the input accept HDCP-encrypted content, false blocks it." }
    send: "\x1bE{input}*{allowed:bool01}HDCP"
    expect: { matches: '^HdcpE\s*\d+\*[01]$' }
    returns: ack
  get_input_hdcp_authorized:
    summary: Get whether HDCP is allowed on an input (Esc EX!HDCP)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1bE{input}HDCP"
    expect: { matches: '^(?:HdcpE\s*\d+\*)?([01])$' }
    returns: value
  set_aspect_ratio:
    summary: Fill the output with an input (1) or keep its native aspect ratio (2) (Esc X!*nASPR)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      mode: { type: int, min: 1, max: 2, required: true,
              label: Aspect ratio,
              description: "1 fills the output with the input, 2 keeps the input's native aspect ratio." }
    send: "\x1b{input}*{mode}ASPR"
    expect: { matches: '^Aspr\s*\d+\s*\*\s*[12]$' }
    returns: ack
  get_aspect_ratio:
    summary: Get an input's aspect ratio setting, 1 fill or 2 follow (Esc X!ASPR)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}ASPR"
    expect: { matches: '^(?:Aspr\s*\d+\s*\*\s*)?([12])$' }
    returns: value
  set_film_mode:
    summary: Turn 3:2, 2:2 and 24:1 film mode detection on (auto) or off for an input (Esc X!*1FILM / *0)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      enabled: { type: bool, required: true,
                 label: Film mode,
                 description: "True turns 3:2, 2:2 and 24:1 film mode detection on (auto), false off." }
    send: "\x1b{input}*{enabled:bool01}FILM"
    expect: { matches: '^Film\s*\d+\s*\*\s*[01]$' }
    returns: ack
  get_film_mode:
    summary: Get an input's film mode detection (Esc X!FILM)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}FILM"
    expect: { matches: '^(?:Film\s*\d+\s*\*\s*)?([01])$' }
    returns: value
  set_auto_switch_mode:
    summary: "Set auto-input switching (Esc nAUSW): 0 manual; IN1808 1 user priority, 2 last connected; IN1608 and IN1604 1 highest active input, 2 lowest active input"
    params:
      mode: { type: int, min: 0, max: 2, required: true,
              label: Auto-switch mode,
              description: "0 manual; IN1808 1 user priority, 2 last connected; IN1608 and IN1604 1 highest active input, 2 lowest active input." }
    send: "\x1b{mode}AUSW"
    expect: { matches: '^Ausw[0-2]$' }
    returns: ack
  get_auto_switch_mode:
    summary: Get the auto-input switch mode (Esc AUSW)
    send: "\x1bAUSW"
    expect: { matches: '^(?:Ausw)?([0-2])$' }
    returns: value
  set_auto_switch_timeout:
    summary: Set the seconds without video before auto-input switching moves on, 0-500 (Esc TnAUSW)
    params:
      seconds: { type: int, min: 0, max: 500, required: true,
                 label: Timeout,
                 description: "Seconds without video before auto-input switching moves on, 0 to 500." }
    send: "\x1bT{seconds}AUSW"
    expect: { matches: '^AuswT\s*\d+$' }
    returns: ack
  get_auto_switch_timeout:
    summary: Get the auto-input switch timeout in seconds (Esc TAUSW)
    send: "\x1bTAUSW"
    expect: { matches: '^(?:AuswT\s*)?0*(\d+)$' }
    returns: value
  set_auto_switch_priority:
    summary: Set the user priority order for auto-input switching, every input once, highest first, such as "8 7 1 2 3 4 5 6" (Esc P... AUSW); E13 unless every input is given
    params:
      order: { type: string, pattern: '^[1-8]( [1-8]){5,7}$', required: true,
               label: Priority order,
               description: "Every input number once, separated by spaces, highest priority first: six on an IN1806, eight on an IN1808." }
    send: "\x1bP{order}AUSW"
    expect: { matches: '^AuswP\s*[1-8](?: [1-8])+$' }
    returns: ack
  get_auto_switch_priority:
    summary: Get the user priority order, highest first, as space-separated input numbers (Esc PAUSW)
    send: "\x1bPAUSW"
    expect: { matches: '^(?:AuswP\s*)?([1-8](?: [1-8])+)$' }
    returns: value
  get_input_video_format:
    summary: "Get the digital video format detected on an input: 0 no signal, 1 DVI, 2 HDMI, 3 DisplayPort (X!*\\)"
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}*\\"
    expect: { matches: '^(?:Vtyp\s*\d+\*)?([0-3])$' }
    returns: value
  set_input_video_format_in1600:
    summary: "Set an input's video format: 1 RGB, 2 YUV, 3 RGBcvS, 4 S-video, 5 composite, 6 HDMI (X!*X#\\); analog formats on inputs 1 and 2"
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      format: { type: int, min: 1, max: 6, required: true,
                label: Video format,
                description: "1 RGB, 2 YUV, 3 RGBcvS, 4 S-video, 5 composite, 6 HDMI (the default for inputs 3 and higher)." }
    send: "{input}*{format}\\"
    expect: { matches: '^Typ\s*\d+\s*\*\s*[1-6]$' }
    returns: ack
  get_input_video_format_in1600:
    summary: Get an input's video format setting (X!\\)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}\\"
    expect: { matches: '^(?:Typ\s*\d+\s*\*\s*)?([1-6])$' }
    returns: value
  set_auto_image_threshold:
    summary: Set the luminosity Auto-Image takes as active video, 0 black to 100 white (25 default) (Esc nALVL)
    params:
      level: { type: int, min: 0, max: 100, required: true,
               label: Threshold,
               description: "Luminosity Auto-Image takes as active video, from 0 (black) to 100 (white); 25 is the default." }
    send: "\x1b{level}ALVL"
    expect: { matches: '^Alvl\s*\d+$' }
    returns: ack
  get_auto_image_threshold:
    summary: Get the Auto-Image threshold (Esc ALVL)
    send: "\x1bALVL"
    expect: { matches: '^(?:Alvl\s*)?0*(\d+)$' }
    returns: value
  set_overscan:
    summary: "Set the overscan of an input video format (SMPTE rates only): 0 0%, 1 2.5%, 2 5% (Esc X#*nOSCN)"
    params:
      format: { type: int, min: 1, max: 6, required: true,
                label: Video format,
                description: "Input video format the overscan applies to: 1 RGB, 2 YUV, 3 RGBcvS, 4 S-video, 5 composite, 6 HDMI." }
      overscan: { type: int, min: 0, max: 2, required: true,
                  label: Overscan,
                  description: "0 is 0% (default for RGB and HDMI), 1 is 2.5% (default for the others), 2 is 5%." }
    send: "\x1b{format}*{overscan}OSCN"
    expect: { matches: '^Oscn\s*[1-6]\s*\*\s*[0-2]$' }
    returns: ack
  get_overscan:
    summary: Get the overscan of an input video format (Esc X#OSCN)
    params:
      format: { type: int, min: 1, max: 6, required: true,
                label: Video format,
                description: "Input video format: 1 RGB, 2 YUV, 3 RGBcvS, 4 S-video, 5 composite, 6 HDMI." }
    send: "\x1b{format}OSCN"
    expect: { matches: '^(?:Oscn\s*[1-6]\s*\*\s*)?([0-2])$' }
    returns: value

  # ── Picture (IN1808 p.66-68; IN1608 p.54-55, p.60) ──────────────────────
  set_freeze:
    summary: Freeze or unfreeze the output (1*1F / 1*0F)
    params:
      frozen: { type: bool, required: true,
                label: Freeze,
                description: "True freezes the output's picture, false releases it." }
    send: "1*{frozen:bool01}F"
    expect: { matches: '^Frz1\*[01]$' }
    returns: ack
  get_freeze:
    summary: Get whether the output is frozen (1F)
    send: "1F"
    expect: { matches: '^(?:Frz1\*)?([01])$' }
    returns: value
  set_freeze_in1600:
    summary: Freeze or unfreeze the current input (1F / 0F)
    params:
      frozen: { type: bool, required: true,
                label: Freeze,
                description: "True freezes the current input's picture, false releases it." }
    send: "{frozen:bool01}F"
    expect: { matches: '^Frz[01]$' }
    returns: ack
  get_freeze_in1600:
    summary: Get whether the current input is frozen (F)
    send: "F"
    expect: { matches: '^(?:Frz)?([01])$' }
    returns: value
  set_contrast:
    summary: Set an input's contrast, 0-127 (64 default) (Esc X!*nCONT)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      level: { type: int, min: 0, max: 127, required: true,
               label: Contrast,
               description: "Contrast of the input, 0 to 127; 64 is the default." }
    send: "\x1b{input}*{level}CONT"
    expect: { matches: '^Cont\s*\d+\*\d+$' }
    returns: ack
  get_contrast:
    summary: Get an input's contrast (Esc X!CONT)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}CONT"
    expect: { matches: '^(?:Cont\s*\d+\*)?0*(\d+)$' }
    returns: value
  set_brightness:
    summary: Set an input's brightness, 0-127 (64 default) (Esc X!*nBRIT)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      level: { type: int, min: 0, max: 127, required: true,
               label: Brightness,
               description: "Brightness of the input, 0 to 127; 64 is the default." }
    send: "\x1b{input}*{level}BRIT"
    expect: { matches: '^Brit\s*\d+\*\d+$' }
    returns: ack
  get_brightness:
    summary: Get an input's brightness (Esc X!BRIT)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}BRIT"
    expect: { matches: '^(?:Brit\s*\d+\*)?0*(\d+)$' }
    returns: value
  set_detail:
    summary: Set the detail (sharpness) of the current input, 0-127 (Esc 1*nHDET)
    params:
      level: { type: int, min: 0, max: 127, required: true,
               label: Detail,
               description: "Detail (sharpness) of the current input, 0 to 127." }
    send: "\x1b1*{level}HDET"
    expect: { matches: '^Hdet1\*\d+$' }
    returns: ack
  get_detail:
    summary: Get the detail of the current input (Esc 1HDET)
    send: "\x1b1HDET"
    expect: { matches: '^(?:Hdet1\*)?0*(\d+)$' }
    returns: value
  set_image_position:
    summary: "Set the image's position and size at once: horizontal -4096..4096, vertical -2400..2400, width 10-8192, height 10-4800 (Esc 1,h*v*w*hXIMG)"
    params:
      horizontal: { type: int, min: -4096, max: 4096, required: true,
                    label: Horizontal position,
                    description: "Horizontal position of the image in pixels; negative moves it left." }
      vertical: { type: int, min: -2400, max: 2400, required: true,
                  label: Vertical position,
                  description: "Vertical position of the image in pixels; negative moves it up." }
      width: { type: int, min: 10, max: 8192, required: true,
               label: Width,
               description: "Image width in pixels." }
      height: { type: int, min: 10, max: 4800, required: true,
                label: Height,
                description: "Image height in pixels." }
    send: "\x1b1,{horizontal}*{vertical}*{width}*{height}XIMG"
    expect: { matches: '^Ximg1,' }
    returns: ack
  get_image_position:
    summary: Get the image's position and size as "h*v*width*height" (Esc 1XIMG)
    send: "\x1b1XIMG"
    expect: { matches: '^(?:Ximg1,)?([-+]?\d+\*[-+]?\d+\*\d+\*\d+)$' }
    returns: value
  set_contrast_current_input:
    summary: Set the current input's contrast, 0-127 (Esc nCONT)
    params:
      level: { type: int, min: 0, max: 127, required: true,
               label: Contrast,
               description: "Contrast of the current input, 0 to 127; 64 is the default." }
    send: "\x1b{level}CONT"
    expect: { matches: '^Cont\s*\d+\*\d+$' }
    returns: ack
  get_contrast_current_input:
    summary: Get the current input's contrast (Esc CONT)
    send: "\x1bCONT"
    expect: { matches: '^(?:Cont\s*\d+\*)?0*(\d+)$' }
    returns: value
  set_brightness_current_input:
    summary: Set the current input's brightness, 0-127 (Esc nBRIT)
    params:
      level: { type: int, min: 0, max: 127, required: true,
               label: Brightness,
               description: "Brightness of the current input, 0 to 127; 64 is the default." }
    send: "\x1b{level}BRIT"
    expect: { matches: '^Brit\s*\d+\*\d+$' }
    returns: ack
  get_brightness_current_input:
    summary: Get the current input's brightness (Esc BRIT)
    send: "\x1bBRIT"
    expect: { matches: '^(?:Brit\s*\d+\*)?0*(\d+)$' }
    returns: value
  set_detail_current_input:
    summary: Set the current input's detail filter, 0-127 (Esc nHDET)
    params:
      level: { type: int, min: 0, max: 127, required: true,
               label: Detail,
               description: "Detail filter of the current input, 0 to 127." }
    send: "\x1b{level}HDET"
    expect: { matches: '^Hdet\s*\d+\s*\*\s*\d+$' }
    returns: ack
  get_detail_current_input:
    summary: Get the current input's detail filter (Esc HDET)
    send: "\x1bHDET"
    expect: { matches: '^(?:Hdet\s*\d+\s*\*\s*)?0*(\d+)$' }
    returns: value
  set_color_current_input:
    summary: Set the current input's color level, 0-127 (NTSC, PAL and SECAM inputs only) (Esc nCOLR)
    params:
      level: { type: int, min: 0, max: 127, required: true,
               label: Color,
               description: "Color level of the current input, 0 to 127; NTSC, PAL and SECAM inputs only." }
    send: "\x1b{level}COLR"
    expect: { matches: '^Colr\s*\d+\*\d+$' }
    returns: ack
  get_color_current_input:
    summary: Get the current input's color level (Esc COLR)
    send: "\x1bCOLR"
    expect: { matches: '^(?:Colr\s*\d+\*)?0*(\d+)$' }
    returns: value
  set_tint_current_input:
    summary: Set the current input's tint, 0-127 (NTSC inputs only) (Esc nTINT)
    params:
      level: { type: int, min: 0, max: 127, required: true,
               label: Tint,
               description: "Tint of the current input, 0 to 127; NTSC inputs only." }
    send: "\x1b{level}TINT"
    expect: { matches: '^Tint\s*\d+\*\d+$' }
    returns: ack
  get_tint_current_input:
    summary: Get the current input's tint (Esc TINT)
    send: "\x1bTINT"
    expect: { matches: '^(?:Tint\s*\d+\*)?0*(\d+)$' }
    returns: value
  set_image_position_in1600:
    summary: "Set the image's position and size at once: horizontal -2048..2048, vertical -1200..1200, width 10-4096, height 10-2400 (Esc h*v*w*hXIMG)"
    params:
      horizontal: { type: int, min: -2048, max: 2048, required: true,
                    label: Horizontal position,
                    description: "Horizontal position of the image in pixels; negative moves it left." }
      vertical: { type: int, min: -1200, max: 1200, required: true,
                  label: Vertical position,
                  description: "Vertical position of the image in pixels; negative moves it up." }
      width: { type: int, min: 10, max: 4096, required: true,
               label: Width,
               description: "Image width in pixels." }
      height: { type: int, min: 10, max: 2400, required: true,
                label: Height,
                description: "Image height in pixels." }
    send: "\x1b{horizontal}*{vertical}*{width}*{height}XIMG"
    expect: { matches: '^Ximg' }
    returns: ack
  get_image_position_in1600:
    summary: Get the image's position and size as "h*v*width*height" (Esc XIMG)
    send: "\x1bXIMG"
    expect: { matches: '^(?:Ximg)?([-+]?\d+\*[-+]?\d+\*\d+\*\d+)$' }
    returns: value

  # ── Output (IN1808 p.69-71; IN1608 p.54, p.56) ──────────────────────────
  set_video_mute:
    summary: "Mute an output: 0 unmute, 1 video to black, 2 video and sync (X@*nB)"
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
      mode: { type: int, min: 0, max: 2, required: true,
              label: Video mute,
              description: "0 unmutes, 1 mutes video to black, 2 mutes video and sync." }
    send: "{output}*{mode}B"
    expect: { matches: '^Vmt\s*\d+\*[0-2]$' }
    returns: ack
  get_video_mute:
    summary: Get an output's video mute, 0-2 (X@*B)
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
    send: "{output}*B"
    expect: { matches: '^(?:Vmt\s*\d+\*)?([0-2])$' }
    returns: value
  set_video_mute_all:
    summary: "Mute every output: 0 unmute, 1 video to black, 2 video and sync (nB)"
    params:
      mode: { type: int, min: 0, max: 2, required: true,
              label: Video mute,
              description: "0 unmutes, 1 mutes video to black, 2 mutes video and sync." }
    send: "{mode}B"
    expect: { matches: '^Vmt[0-2]$' }
    returns: ack
  get_video_mute_all:
    summary: Get the outputs' video mute (B); one digit per output on IN1808, one summary digit on IN1608
    send: "B"
    expect: { matches: '^(?:Vmt)?([0-2](?:\s[0-2])*)$' }
    returns: value
  set_output_rate:
    summary: Set the output resolution and rate by the guide's code (Esc 1*nRATE); see the IN1808 guide's table (p.57)
    params:
      rate: { type: int, min: 10, max: 210, required: true,
              label: Output rate,
              description: "Output resolution and refresh rate code from the IN1808 guide's table (p.57)." }
    send: "\x1b1*{rate}RATE"
    expect: { matches: '^Rate1\*\d+$' }
    returns: ack
  get_output_rate:
    summary: Get the output rate code (Esc 1RATE)
    send: "\x1b1RATE"
    expect: { matches: '^(?:Rate1\*)?0*(\d+)$' }
    returns: value
  set_output_rate_in1600:
    summary: Set the output resolution and rate by the guide's code, 3-8, 10-92, 201, 202 (Esc nRATE); see the IN1608 guide's table (p.49)
    params:
      rate: { type: int, min: 3, max: 202, required: true,
              label: Output rate,
              description: "Output resolution and refresh rate code from the IN1608 guide's table (p.49): 3-8, 10-92, 201 or 202." }
    send: "\x1b{rate}RATE"
    expect: { matches: '^Rate\s*\d+$' }
    returns: ack
  get_output_rate_in1600:
    summary: Get the output rate code (Esc RATE)
    send: "\x1bRATE"
    expect: { matches: '^(?:Rate\s*)?0*(\d+)$' }
    returns: value
  set_hdmi_output_format:
    summary: Set an HDMI output's format and colour space by the guide's code, 0 auto (Esc X@*nVTPO)
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
      format: { type: int, min: 0, max: 7, required: true,
                label: Output format,
                description: "HDMI format and colour space code from the guide; 0 is auto." }
    send: "\x1b{output}*{format}VTPO"
    expect: { matches: '^Vtpo\s*\d+\s*\*\s*\d$' }
    returns: ack
  get_hdmi_output_format:
    summary: Get an HDMI output's format code (Esc X@VTPO)
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
    send: "\x1b{output}VTPO"
    expect: { matches: '^(?:Vtpo\s*\d+\s*\*\s*)?(\d)$' }
    returns: value
  set_power_save:
    summary: "Set the power save mode: 0 full power; 1 lowest (IN1608: low) power; 2 low power with TP functions (IN1808) (Esc nPSAV)"
    params:
      mode: { type: int, min: 0, max: 2, required: true,
              label: Power save mode,
              description: "0 full power; 1 lowest power (IN1608 low power); 2 low power with TouchLink functions (IN1808)." }
    send: "\x1b{mode}PSAV"
    expect: { matches: '^Psav[0-2]$' }
    returns: ack
  get_power_save:
    summary: Get the power save mode (Esc PSAV)
    send: "\x1bPSAV"
    expect: { matches: '^(?:Psav)?([0-2])$' }
    returns: value
  set_osd_duration:
    summary: Set how long the on-screen input bug or menu shows, in seconds (IN1608 0 never shows, 501 always) (Esc nMDUR)
    params:
      seconds: { type: int, min: 0, max: 501, required: true,
                 label: OSD duration,
                 description: "Seconds the on-screen input bug or menu shows; on IN1608 units 0 never shows it and 501 always." }
    send: "\x1b{seconds}MDUR"
    expect: { matches: '^Mdur\s*\d+$' }
    returns: ack
  get_osd_duration:
    summary: Get the on-screen display duration (Esc MDUR)
    send: "\x1bMDUR"
    expect: { matches: '^(?:Mdur\s*)?0*(\d+)$' }
    returns: value
  set_screen_saver_mode:
    summary: "Set what the output shows with no active input: 1 black, 2 blue with OSD text, 3 user image on black (Esc M1*nSSAV)"
    params:
      mode: { type: int, min: 1, max: 3, required: true,
              label: Screen saver,
              description: "What the output shows with no active input: 1 black screen, 2 blue screen with OSD text, 3 user image on black." }
    send: "\x1bM1*{mode}SSAV"
    expect: { matches: '^Ssav\s*M\s*1\s*\*\s*[1-3]$' }
    returns: ack
  get_screen_saver_mode:
    summary: Get the screen saver mode (Esc M1SSAV)
    send: "\x1bM1SSAV"
    expect: { matches: '^(?:Ssav\s*M\s*1\s*\*\s*)?([1-3])$' }
    returns: value
  set_screen_saver_timeout:
    summary: Set the seconds without an active input before output sync is disabled, 0 at once, 1-500, 501 never (Esc T1*nSSAV)
    params:
      seconds: { type: int, min: 0, max: 501, required: true,
                 label: Sync timeout,
                 description: "Seconds without an active input before output sync is disabled: 0 at once, 1 to 500, 501 never." }
    send: "\x1bT1*{seconds}SSAV"
    expect: { matches: '^Ssav\s*T\s*1\s*\*\s*\d+$' }
    returns: ack
  get_screen_saver_timeout:
    summary: Get the screen saver timeout in seconds (Esc T1SSAV)
    send: "\x1bT1SSAV"
    expect: { matches: '^(?:Ssav\s*T\s*1\s*\*\s*)?0*(\d+)$' }
    returns: value
  get_screen_saver_status:
    summary: "Get the screen saver status: 0 active input, 1 no input and the timer running, 2 timer expired and sync off (Esc S1SSAV)"
    send: "\x1bS1SSAV"
    expect: { matches: '^(?:Ssav\s*S\s*1\s*\*\s*)?([0-2])$' }
    returns: value
  set_screen_saver_mode_in1600:
    summary: "Set what the outputs show with no active input: 0 the custom color, 1 black, 2 blue (Esc MnSSAV)"
    params:
      mode: { type: int, min: 0, max: 2, required: true,
              label: Screen saver,
              description: "What the outputs show with no active input: 0 the custom color, 1 black, 2 blue." }
    send: "\x1bM{mode}SSAV"
    expect: { matches: '^Ssav\s*M\s*[0-2]$' }
    returns: ack
  get_screen_saver_mode_in1600:
    summary: Get the screen saver mode (Esc MSSAV)
    send: "\x1bMSSAV"
    expect: { matches: '^(?:Ssav\s*M\s*)?([0-2])$' }
    returns: value
  set_screen_saver_color_in1600:
    summary: Set the custom screen saver color as six hex digits, such as FF0000 for red (Esc ChexSSAV); the guide documents no query for it
    params:
      color: { type: string, pattern: '^[0-9A-Fa-f]{6}$', required: true,
               label: Color,
               description: "Custom screen saver color as HTML-style hexadecimal RGB, 000000 black to FFFFFF white." }
    send: "\x1bC{color}SSAV"
    expect: { matches: '^Ssav\s*C\s*[0-9A-Fa-f]{6}$' }
    returns: ack
  set_screen_saver_timeout_in1600:
    summary: Set the seconds without an active input before output sync is disabled, 0 at once, 1-500, 501 never (Esc TnSSAV)
    params:
      seconds: { type: int, min: 0, max: 501, required: true,
                 label: Sync timeout,
                 description: "Seconds without an active input before output sync is disabled: 0 at once, 1 to 500, 501 never." }
    send: "\x1bT{seconds}SSAV"
    expect: { matches: '^Ssav\s*T\s*\d+$' }
    returns: ack
  get_screen_saver_timeout_in1600:
    summary: Get the screen saver timeout in seconds (Esc TSSAV)
    send: "\x1bTSSAV"
    expect: { matches: '^(?:Ssav\s*T\s*)?0*(\d+)$' }
    returns: value
  get_screen_saver_status_in1600:
    summary: "Get the screen saver status: 0 active input, 1 no input and the timer running, 2 timer expired and sync off (Esc SSSAV)"
    send: "\x1bSSSAV"
    expect: { matches: '^(?:Ssav\s*S\s*)?([0-2])$' }
    returns: value

  # ── Presets (IN1808 p.74; IN1608 p.59) ──────────────────────────────────
  recall_input_preset:
    summary: Recall an input preset (picture settings) for the current input, 1-16 on IN1808 and IN1604, 1-128 on IN1608 (2*n.)
    params:
      preset: { type: int, min: 1, max: 128, required: true,
                label: Input preset,
                description: "Input preset (picture settings) number: 1 to 16 on IN1808 and IN1604 units, 1 to 128 on IN1608 units." }
    send: "2*{preset}."
    expect: { matches: '^2Rpr\s*\d+$' }
    returns: ack
  save_input_preset:
    summary: Save the current input's picture settings as an input preset (2*n,)
    params:
      preset: { type: int, min: 1, max: 128, required: true,
                label: Input preset,
                description: "Input preset (picture settings) number: 1 to 16 on IN1808 and IN1604 units, 1 to 128 on IN1608 units." }
    send: "2*{preset},"
    expect: { matches: '^2Spr\s*\d+$' }
    returns: ack
  recall_user_preset:
    summary: Recall a user preset (picture and audio settings), 1-16 (1*n.)
    params:
      preset: { type: int, min: 1, max: 16, required: true,
                label: User preset,
                description: "User preset (picture and audio settings) number, 1 to 16." }
    send: "1*{preset}."
    expect: { matches: '^1Rpr\s*\d+$' }
    returns: ack
  save_user_preset:
    summary: Save the current picture controls as a user preset, 1-16 (1*n,)
    params:
      preset: { type: int, min: 1, max: 16, required: true,
                label: User preset,
                description: "User preset number, 1 to 16." }
    send: "1*{preset},"
    expect: { matches: '^1Spr\s*\d+$' }
    returns: ack
  set_auto_memory:
    summary: Turn Auto Memory (automatic per-signal input presets) on or off for an input (Esc X!*1AMEM / *0)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      enabled: { type: bool, required: true,
                 label: Auto Memory,
                 description: "True turns Auto Memory (automatic per-signal input presets) on for the input, false off." }
    send: "\x1b{input}*{enabled:bool01}AMEM"
    expect: { matches: '^Amem\s*\d+\s*\*\s*[01]$' }
    returns: ack
  get_auto_memory:
    summary: Get an input's Auto Memory setting (Esc X!AMEM)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}AMEM"
    expect: { matches: '^(?:Amem\s*\d+\s*\*\s*)?([01])$' }
    returns: value

  # ── Audio (IN1808 p.75, p.88-92; IN1608 p.57-58) ────────────────────────
  set_audio_input_format:
    summary: "Set an input's audio format: 0 none (muted), 1 analog, 2 LPCM-2Ch, 3 multichannel, 4 LPCM-2Ch auto, 5 multichannel auto (Esc IX!*nAFMT)"
    params:
      input: { type: int, min: 1, max: 9, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel; 9 is the IN1808's aux audio input." }
      format: { type: int, min: 0, max: 5, required: true,
                label: Audio format,
                description: "0 none (muted), 1 analog, 2 LPCM-2Ch, 3 multichannel, 4 LPCM-2Ch auto, 5 multichannel auto." }
    send: "\x1bI{input}*{format}AFMT"
    expect: { matches: '^AfmtI\s*\d+\*[0-5]$' }
    returns: ack
  get_audio_input_format:
    summary: Get an input's audio format (Esc IX!AFMT)
    params:
      input: { type: int, min: 1, max: 9, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel; 9 is the IN1808's aux audio input." }
    send: "\x1bI{input}AFMT"
    expect: { matches: '^(?:AfmtI\s*\d+\*)?([0-5])$' }
    returns: value
  set_group_level:
    summary: Set a group master (volume, bass or treble) in tenths of a dB, such as -293 for -29.3 dB (Esc Dg*nGRPM); groups per model in the notes
    params:
      group: { type: int, min: 1, max: 10, required: true,
               label: Group,
               description: "Group master number; what each group controls depends on the model (see the model notes, e.g. 3 is program volume on the IN1808)." }
      level: { type: int, min: -1000, max: 800, required: true,
               label: Level,
               description: "Group master value in tenths of a dB, e.g. -293 for -29.3 dB; the group's own range applies." }
    send: "\x1bD{group}*{level}GRPM"
    expect: { matches: '^GrpmD\s*\d+\*[-+]?\d+$' }
    returns: ack
  increase_group_level:
    summary: Raise a group master by a step in tenths of a dB (Esc Dg*n+GRPM)
    params:
      group: { type: int, min: 1, max: 10, required: true,
               label: Group,
               description: "Group master number; what each group controls depends on the model (see the model notes, e.g. 3 is program volume on the IN1808)." }
      step: { type: int, min: 1, max: 1800, required: true,
              label: Step,
              description: "Amount to raise the group master by, in tenths of a dB." }
    send: "\x1bD{group}*{step}+GRPM"
    expect: { matches: '^GrpmD\s*\d+\*[-+]?\d+$' }
    returns: ack
  decrease_group_level:
    summary: Lower a group master by a step in tenths of a dB (Esc Dg*n-GRPM)
    params:
      group: { type: int, min: 1, max: 10, required: true,
               label: Group,
               description: "Group master number; what each group controls depends on the model (see the model notes, e.g. 3 is program volume on the IN1808)." }
      step: { type: int, min: 1, max: 1800, required: true,
              label: Step,
              description: "Amount to lower the group master by, in tenths of a dB." }
    send: "\x1bD{group}*{step}-GRPM"
    expect: { matches: '^GrpmD\s*\d+\*[-+]?\d+$' }
    returns: ack
  get_group_level:
    summary: Get a group master's value in tenths of a dB (Esc DgGRPM)
    params:
      group: { type: int, min: 1, max: 10, required: true,
               label: Group,
               description: "Group master number; what each group controls depends on the model (see the model notes, e.g. 3 is program volume on the IN1808)." }
    send: "\x1bD{group}GRPM"
    expect: { matches: '^(?:GrpmD\s*\d+\*)?([-+]?\d+)$' }
    returns: value
  set_group_mute:
    summary: Mute or unmute every block in a mute group (Esc Dg*1GRPM / *0)
    params:
      group: { type: int, min: 1, max: 10, required: true,
               label: Group,
               description: "Group master number; what each group controls depends on the model (see the model notes, e.g. 3 is program volume on the IN1808)." }
      muted: { type: bool, required: true,
               label: Mute,
               description: "True mutes every block in the mute group, false unmutes them." }
    send: "\x1bD{group}*{muted:bool01}GRPM"
    expect: { matches: '^GrpmD\s*\d+\*[01]$' }
    returns: ack
  get_group_mute:
    summary: Get a mute group's state (Esc DgGRPM)
    params:
      group: { type: int, min: 1, max: 10, required: true,
               label: Group,
               description: "Group master number; what each group controls depends on the model (see the model notes, e.g. 3 is program volume on the IN1808)." }
    send: "\x1bD{group}GRPM"
    expect: { matches: '^(?:GrpmD\s*\d+\*)?([01])$' }
    returns: value
  set_dsp_gain:
    summary: Set the gain or attenuation of a DSP block by its object ID (OID), in tenths of a dB (Esc Goid*nAU); OIDs per model in the quirks
    params:
      oid: { type: int, min: 30000, max: 60011, required: true,
             label: Object ID,
             description: "DSP block object ID (OID), as listed per model in the spec's quirks." }
      level: { type: int, min: -1000, max: 800, required: true,
               label: Level,
               description: "Level in tenths of a dB, e.g. -293 for -29.3 dB; the block's own range applies." }
    send: "\x1bG{oid}*{level}AU"
    expect: { matches: '^DsG\s*\d+\*[-+]?\d+$' }
    returns: ack
  get_dsp_gain:
    summary: Get a DSP block's gain in tenths of a dB (Esc GoidAU)
    params:
      oid: { type: int, min: 30000, max: 60011, required: true,
             label: Object ID,
             description: "DSP block object ID (OID), as listed per model in the spec's quirks." }
    send: "\x1bG{oid}AU"
    expect: { matches: '^(?:DsG\s*\d+\*)?([-+]?\d+)$' }
    returns: value
  set_dsp_mute:
    summary: Mute or unmute a DSP block by its object ID (Esc Moid*1AU / *0)
    params:
      oid: { type: int, min: 30000, max: 60011, required: true,
             label: Object ID,
             description: "DSP block object ID (OID), as listed per model in the spec's quirks." }
      muted: { type: bool, required: true,
               label: Mute,
               description: "True mutes the DSP block, false unmutes it." }
    send: "\x1bM{oid}*{muted:bool01}AU"
    expect: { matches: '^DsM\s*\d+\*[01]$' }
    returns: ack
  get_dsp_mute:
    summary: Get a DSP block's mute (Esc MoidAU)
    params:
      oid: { type: int, min: 30000, max: 60011, required: true,
             label: Object ID,
             description: "DSP block object ID (OID), as listed per model in the spec's quirks." }
    send: "\x1bM{oid}AU"
    expect: { matches: '^(?:DsM\s*\d+\*)?([01])$' }
    returns: value
  set_phantom_power:
    summary: Turn 48 V phantom power on or off on mic/line input 1 (OID 40000) or 2 (40001) (Esc Zoid*1AU / *0)
    params:
      oid: { type: enum, values: ["40000", "40001"], required: true,
             label: Mic input,
             description: "Mic/line input by object ID: 40000 is input 1, 40001 input 2." }
      enabled: { type: bool, required: true,
                 label: Phantom power,
                 description: "True turns 48 V phantom power on, false off." }
    send: "\x1bZ{oid}*{enabled:bool01}AU"
    expect: { matches: '^DsZ\s*\d+\*[01]$' }
    returns: ack
  get_phantom_power:
    summary: Get whether 48 V phantom power is on for mic/line input 1 (OID 40000) or 2 (40001) (Esc ZoidAU)
    params:
      oid: { type: enum, values: ["40000", "40001"], required: true,
             label: Mic input,
             description: "Mic/line input by object ID: 40000 is input 1, 40001 input 2." }
    send: "\x1bZ{oid}AU"
    expect: { matches: '^(?:DsZ\s*\d+\*)?([01])$' }
    returns: value
  set_dsp_embedded_gain:
    summary: Set the gain of the embedded HDMI LPCM-2Ch audio on DTP input 7 (OIDs 30012, 30013) or 8 (30014, 30015), in tenths of a dB (Esc Hoid*nAU)
    params:
      oid: { type: enum, values: ["30012", "30013", "30014", "30015"], required: true,
             label: Object ID,
             description: "DTP input channel by object ID: 30012 and 30013 input 7, 30014 and 30015 input 8 (the guide's example takes 30012 as the right channel)." }
      level: { type: int, min: -1000, max: 800, required: true,
               label: Level,
               description: "Gain in tenths of a dB, e.g. 120 for +12.0 dB; the block's own range applies." }
    send: "\x1bH{oid}*{level}AU"
    expect: { matches: '^DsH\s*\d+\*[-+]?\d+$' }
    returns: ack
  get_dsp_embedded_gain:
    summary: Get the embedded audio gain of a DTP input channel in tenths of a dB (Esc HoidAU)
    params:
      oid: { type: enum, values: ["30012", "30013", "30014", "30015"], required: true,
             label: Object ID,
             description: "DTP input channel by object ID: 30012 and 30013 input 7, 30014 and 30015 input 8." }
    send: "\x1bH{oid}AU"
    expect: { matches: '^(?:DsH\s*\d+\*)?([-+]?\d+)$' }
    returns: value
  set_audio_input_name:
    summary: Name an audio input, up to 32 characters; a single space restores the default (Esc IX$*name ANAM)
    params:
      input: { type: int, min: 1, max: 15, required: true,
               label: Audio input,
               description: "1 DP 1, 2-6 HDMI 2-6, 7-8 TP 7-8, 9 Aux In, 10-11 Mic/Line 1-2, 12-13 Line In 3-4, 14-15 File Playback L and R." }
      name: { type: string, max_length: 32, pattern: '^[^,*|]+$', required: true,
              label: Name,
              description: "Name to give, without commas, asterisks or |; a single space restores the default." }
    send: "\x1bI{input}*{name}ANAM"
    expect: { matches: '^AnamI' }
    returns: ack
  get_audio_input_name:
    summary: Get an audio input's name (Esc IX$ANAM)
    params:
      input: { type: int, min: 1, max: 15, required: true,
               label: Audio input,
               description: "1 DP 1, 2-6 HDMI 2-6, 7-8 TP 7-8, 9 Aux In, 10-11 Mic/Line 1-2, 12-13 Line In 3-4, 14-15 File Playback L and R." }
    send: "\x1bI{input}ANAM"
    expect: { matches: '^(?:AnamI\s*\d+\*)?(.*)$' }
    returns: value
  set_audio_output_name:
    summary: Name an audio output, up to 32 characters; a single space restores the default (Esc OX%*name ANAM)
    params:
      output: { type: int, min: 1, max: 7, required: true,
                label: Audio output,
                description: "1 HDMI 1A, 2 TP 1B, 3 Over DTP Analog, 4-7 Line Out 1-4." }
      name: { type: string, max_length: 32, pattern: '^[^,*|]+$', required: true,
              label: Name,
              description: "Name to give, without commas, asterisks or |; a single space restores the default." }
    send: "\x1bO{output}*{name}ANAM"
    expect: { matches: '^AnamO' }
    returns: ack
  get_audio_output_name:
    summary: Get an audio output's name (Esc OX%ANAM)
    params:
      output: { type: int, min: 1, max: 7, required: true,
                label: Audio output,
                description: "1 HDMI 1A, 2 TP 1B, 3 Over DTP Analog, 4-7 Line Out 1-4." }
    send: "\x1bO{output}ANAM"
    expect: { matches: '^(?:AnamO\s*\d+\*)?(.*)$' }
    returns: value
  set_volume_knob_group:
    summary: Choose what the front panel volume knob controls, 1 program, 3 mic or 8 output volume (Esc 1*nKNOB)
    params:
      group: { type: enum, values: ["1", "3", "8"], required: true,
               label: Knob controls,
               description: "What the front panel volume knob controls: 1 program, 3 mic, 8 output volume." }
    send: "\x1b1*{group}KNOB"
    expect: { matches: '^Knob1\*\d+$' }
    returns: ack
  get_volume_knob_group:
    summary: Get the volume knob's group (Esc 1KNOB)
    send: "\x1b1KNOB"
    expect: { matches: '^(?:Knob1\*)?(\d+)$' }
    returns: value
  play_audio_file:
    summary: Play the audio file in slot 1-16; a lower priority slot than the one playing is refused (E22) (Esc slot*1PLAY)
    params:
      slot: { type: int, min: 1, max: 16, required: true,
              label: Slot,
              description: "Audio file slot, 1 to 16; a slot of lower priority than the one playing is refused." }
    send: "\x1b{slot}*1PLAY"
    expect: { matches: '^Play\s*\d+\*1$' }
    returns: ack
  stop_audio_file:
    summary: Stop the audio file in a slot (Esc slot*0PLAY)
    params:
      slot: { type: int, min: 1, max: 16, required: true,
              label: Slot,
              description: "Audio file slot, 1 to 16." }
    send: "\x1b{slot}*0PLAY"
    expect: { matches: '^Play\s*\d+\*0$' }
    returns: ack
  get_playing_audio_file:
    summary: Get the slot playing, 0 when none (Esc PLAY)
    send: "\x1bPLAY"
    expect: { matches: '^(?:Play)?0*(\d+)(?:\*[01])?$' }
    returns: value

  # ── Advanced (IN1808 p.78-79; IN1608 p.60-62) ───────────────────────────
  set_test_pattern:
    summary: "Show a test pattern on the output: 0 off, 1 crop, 2 alternating pixels, 3 crosshatch, 4 color bars, 5 grayscale, 6 audio test (pink noise) (Esc 1*nTEST)"
    params:
      pattern: { type: int, min: 0, max: 6, required: true,
                 label: Test pattern,
                 description: "0 off, 1 crop, 2 alternating pixels, 3 crosshatch, 4 color bars, 5 grayscale, 6 audio test (pink noise)." }
    send: "\x1b1*{pattern}TEST"
    expect: { matches: '^Test1\*\d+$' }
    returns: ack
  get_test_pattern:
    summary: Get the test pattern (Esc 1TEST)
    send: "\x1b1TEST"
    expect: { matches: '^(?:Test1\*)?0*(\d+)$' }
    returns: value
  set_test_pattern_in1600:
    summary: "Show a test pattern: 0 none, 1 crop, 2 alternating pixels, 3 color bars, 4 grayscale, 5 blue mode, 6 audio test (Esc nTEST)"
    params:
      pattern: { type: int, min: 0, max: 6, required: true,
                 label: Test pattern,
                 description: "0 none, 1 crop, 2 alternating pixels, 3 color bars, 4 grayscale, 5 blue mode, 6 audio test." }
    send: "\x1b{pattern}TEST"
    expect: { matches: '^Test\s*\d+$' }
    returns: ack
  get_test_pattern_in1600:
    summary: Get the test pattern (Esc TEST)
    send: "\x1bTEST"
    expect: { matches: '^(?:Test\s*)?0*(\d+)$' }
    returns: value
  set_switch_effect:
    summary: "Set the input switch effect: 0 cut through black, 1 fade through black, 2 seamless fade, 3 seamless cut (Esc O1*nSWEF)"
    params:
      effect: { type: int, min: 0, max: 3, required: true,
                label: Switch effect,
                description: "0 cut through black, 1 fade through black, 2 seamless fade, 3 seamless cut." }
    send: "\x1bO1*{effect}SWEF"
    expect: { matches: '^SwefO1\*[0-3]$' }
    returns: ack
  get_switch_effect:
    summary: Get the switch effect (Esc O1SWEF)
    send: "\x1bO1SWEF"
    expect: { matches: '^(?:SwefO1\*)?([0-3])$' }
    returns: value
  set_switch_effect_in1600:
    summary: Set the switch effect, 0 cut or 1 fade through black (Esc nSWEF)
    params:
      effect: { type: int, min: 0, max: 1, required: true,
                label: Switch effect,
                description: "0 cut, 1 fade through black." }
    send: "\x1b{effect}SWEF"
    expect: { matches: '^Swef[01]$' }
    returns: ack
  get_switch_effect_in1600:
    summary: Get the switch effect (Esc SWEF)
    send: "\x1bSWEF"
    expect: { matches: '^(?:Swef)?([01])$' }
    returns: value
  get_signal_status:
    summary: Get every input's video signal presence as "1*0*..." (Esc 0LS)
    send: "\x1b0LS"
    expect: { matches: '^I[Nn]00\s*([01](?:\*[01])*)$' }
    returns: value
  set_front_panel_lock:
    summary: "Lock the front panel: 0 off, 1 complete, 2 switching and volume (IN1808 also logos), 3 switching and logos (IN1808), 4 volume only (IN1808) (nX)"
    params:
      mode: { type: int, min: 0, max: 4, required: true,
              label: Lock mode,
              description: "0 off, 1 complete, 2 switching and volume (IN1808 also logos), 3 switching and logos (IN1808), 4 volume only (IN1808)." }
    send: "{mode}X"
    expect: { matches: '^Exe[0-4]$' }
    returns: ack
  get_front_panel_lock:
    summary: Get the front panel lock mode (X)
    send: "X"
    expect: { matches: '^(?:Exe)?([0-4])$' }
    returns: value
  set_output_hdcp_mode:
    summary: "Set an output's HDCP mode: 0 off, 1 follow input, 2 always encrypt (10 s of retries), 3 follow, 4 encrypt (continuous retries) (Esc SX@*nHDCP)"
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
      mode: { type: int, min: 0, max: 4, required: true,
              label: HDCP mode,
              description: "0 off, 1 follow input, 2 always encrypt (10 s of retries), 3 follow, 4 encrypt (continuous retries)." }
    send: "\x1bS{output}*{mode}HDCP"
    expect: { matches: '^HdcpS\s*\d+\*[0-4]$' }
    returns: ack
  get_output_hdcp_mode:
    summary: Get an output's HDCP mode (Esc SX@HDCP)
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
    send: "\x1bS{output}HDCP"
    expect: { matches: '^(?:HdcpS\s*\d+\*)?([0-4])$' }
    returns: value
  set_output_hdcp_mode_in1600:
    summary: "Set the HDMI outputs' HDCP mode: 0 encrypt when required, 1 always, 2 and 3 the same for DVI sinks that drop to green screen, 4 never (Esc SnHDCP)"
    params:
      mode: { type: int, min: 0, max: 4, required: true,
              label: HDCP mode,
              description: "0 encrypt when required, 1 always, 2 and 3 the same for DVI sinks that drop to green screen, 4 never." }
    send: "\x1bS{mode}HDCP"
    expect: { matches: '^HdcpS\s*[0-4]$' }
    returns: ack
  get_output_hdcp_mode_in1600:
    summary: Get the HDCP mode (Esc SHDCP)
    send: "\x1bSHDCP"
    expect: { matches: '^(?:HdcpS\s*)?([0-4])$' }
    returns: value
  set_hdcp_notification:
    summary: "Set what a non-HDCP display shows for HDCP content: 0 black, 1 green screen with message, 2 user image (Esc N1*nHDCP)"
    params:
      mode: { type: int, min: 0, max: 2, required: true,
              label: HDCP notification,
              description: "What a non-HDCP display shows for HDCP content: 0 black, 1 green screen with message, 2 user image." }
    send: "\x1bN1*{mode}HDCP"
    expect: { matches: '^HdcpN1\*[0-2]$' }
    returns: ack
  get_hdcp_notification:
    summary: Get the HDCP notification mode (Esc N1HDCP)
    send: "\x1bN1HDCP"
    expect: { matches: '^(?:HdcpN1\*)?([0-2])$' }
    returns: value
  set_hdcp_notification_in1600:
    summary: Show a green screen (true) or mute to black (false) on a non-HDCP display for HDCP content (Esc N1HDCP / N0HDCP)
    params:
      enabled: { type: bool, required: true,
                 label: Green screen,
                 description: "True shows a green screen on a non-HDCP display for HDCP content, false mutes it to black." }
    send: "\x1bN{enabled:bool01}HDCP"
    expect: { matches: '^HdcpN[01]$' }
    returns: ack
  get_hdcp_notification_in1600:
    summary: Get whether the HDCP notification is on (Esc NHDCP)
    send: "\x1bNHDCP"
    expect: { matches: '^(?:HdcpN)?([01])$' }
    returns: value
  get_input_hdcp_status:
    summary: "Get an input's HDCP status (Esc IX!HDCP): IN1808 0 no source, 1 no HDCP, 2 HDCP; IN1608 and IN1604 0 no source, 1 HDCP, 2 no HDCP"
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1bI{input}HDCP"
    expect: { matches: '^(?:HdcpI\s*\d+\*)?([0-2])$' }
    returns: value
  get_output_hdcp_status:
    summary: Get an output's HDCP status (Esc OX@HDCP), coded as for inputs
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
    send: "\x1bO{output}HDCP"
    expect: { matches: '^(?:HdcpO\s*\d+\*)?([0-2])$' }
    returns: value

  # ── Information (IN1808 p.83-84; IN1608 p.63-64) ────────────────────────
  get_input_info:
    summary: Get an input's signal type, audio and video mute and frequencies, as the unit reports them (X!*I)
    params:
      input: { type: int, min: 1, max: 9, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel; 9 is the IN1808's aux audio input." }
    send: "{input}*I"
    expect: { matches: '^(?:Inf00\*)?(Vid.*)$' }
    returns: value
  get_info_in1600:
    summary: Get the current video and audio inputs, signal type, standard, mute and frequencies, as the unit reports them (I)
    send: "I"
    expect: { matches: '^(Vid.*)$' }
    returns: value
  get_model_name:
    summary: Get the model name (1I)
    send: "1I"
    expect: { matches: '^(?:Inf01\*)?(.+)$' }
    returns: value
  get_firmware:
    summary: Get the firmware version (Q)
    send: "Q"
    expect: { matches: '^(?:Ver01\*)?(\d+\.\d+)$' }
    returns: value
  get_firmware_full:
    summary: Get the firmware version with its build number (*Q)
    send: "*Q"
    expect: { matches: '^(?:Bld)?(\d+\.\d+\.\d+)$' }
    returns: value
  get_part_number:
    summary: Get the part number, such as 60-1615-01 (N)
    send: "N"
    expect: { matches: '^(?:Pno)?(60-\d+-\d+)$' }
    returns: value
  get_temperature:
    summary: Get the internal temperature in degrees Celsius (Esc 20STAT)
    send: "\x1b20STAT"
    expect: { matches: '^(?:20Stat\s*)?0*(\d+)$' }
    returns: value
  set_verbose_mode:
    summary: "Set the verbose mode: 0 none, 1 verbose, 2 tagged replies, 3 both (Esc nCV); state needs 3, which is set on connecting"
    params:
      mode: { type: int, min: 0, max: 3, required: true,
              label: Verbose mode,
              description: "0 none, 1 verbose, 2 tagged replies, 3 both; state needs 3, which is set on connecting." }
    send: "\x1b{mode}CV"
    expect: { matches: '^Vrb[0-3]$' }
    returns: ack
  get_verbose_mode:
    summary: Get the verbose mode (Esc CV)
    send: "\x1bCV"
    expect: { matches: '^(?:Vrb)?([0-3])$' }
    returns: value

  # ── IN1604 DTP and IN1604 HD (IN1604 guide p.35-48) ──────────────────────
  set_input_video_format_in1604:
    summary: "Set an input's video format (X!*X@\\): input 1 takes 1 RGB, 2 YUV, 3 S-video, 4 composite; inputs 2-4 take 5 HDMI"
    params:
      input: { type: int, min: 1, max: 4, required: true,
        label: Input,
        description: "Input number: 1 the configurable VGA input, 2 to 4 the HDMI or DVI inputs." }
      format: { type: int, min: 1, max: 5, required: true,
        label: Video format,
        description: "1 RGB, 2 YUV, 3 S-video, 4 composite (input 1 only), 5 HDMI (inputs 2-4 only)." }
    send: "{input}*{format}\\"
    expect: { matches: '^Typ\s*\d+\s*\*\s*[1-5]$' }
    returns: ack

  get_input_video_format_in1604:
    summary: "An input's video format (0 no input detected, 1 RGB, 2 YUV, 3 S-video, 4 composite, 5 HDMI) (X!\\)"
    params:
      input: { type: int, min: 1, max: 4, required: true,
        label: Input,
        description: "Input number: 1 the configurable VGA input, 2 to 4 the HDMI or DVI inputs." }
    send: "{input}\\"
    expect: { matches: '^(?:Typ\s*\d+\s*\*\s*)?([0-5])$' }
    returns: value

  set_input_edid:
    summary: "Assign the EDID an input presents (Esc AX!*X4(EDID)"
    params:
      input: { type: int, min: 1, max: 4, required: true,
        label: Input,
        description: "Input number: 1 the configurable VGA input, 2 to 4 the HDMI or DVI inputs." }
      edid: { type: int, min: 0, max: 205, required: true,
        label: EDID,
        description: "0 automatic (matches the output rate), a resolution and rate code 10 to 53 from the guide's table, or 201 to 205 a custom EDID slot." }
    send: "\x1bA{input}*{edid}EDID"
    expect: { matches: '^EdidA\s*\d+\*\d+$' }
    returns: ack

  get_input_edid:
    summary: "The EDID code assigned to an input"
    params:
      input: { type: int, min: 1, max: 4, required: true,
        label: Input,
        description: "Input number: 1 the configurable VGA input, 2 to 4 the HDMI or DVI inputs." }
    send: "\x1bA{input}EDID"
    expect: { matches: '^(?:EdidA\s*\d+\*)?0*(\d+)$' }
    returns: value

  save_output_edid:
    summary: "Save the display's EDID on the output to a custom EDID slot, 201-205, overwriting it (Esc S1*X4(EDID)"
    params:
      slot: { type: int, min: 201, max: 205, required: true,
        label: Custom slot,
        description: "The custom EDID slot to save the display's EDID into, 201 to 205." }
    send: "\x1bS1*{slot}EDID"
    expect: { matches: '^EdidS1\*\d+$' }
    returns: ack

  set_horizontal_start:
    summary: "Set the current input's horizontal start (Esc nHSRT)"
    params:
      value: { type: int, min: 0, max: 255, required: true,
        label: Horizontal start,
        description: "The analog input's horizontal start (where active video begins on the line), 0 to 255; 128 is the default." }
    send: "\x1b{value}HSRT"
    expect: { matches: '^Hsrt\s*\d+\s*\*\s*\d+$' }
    returns: ack

  increase_horizontal_start:
    summary: "Raise the current input's horizontal start by one (Esc +HSRT)"
    send: "\x1b+HSRT"
    expect: { matches: '^Hsrt\s*\d+\s*\*\s*\d+$' }
    returns: ack

  decrease_horizontal_start:
    summary: "Lower the current input's horizontal start by one (Esc -HSRT)"
    send: "\x1b-HSRT"
    expect: { matches: '^Hsrt\s*\d+\s*\*\s*\d+$' }
    returns: ack

  get_horizontal_start:
    summary: "The current input's horizontal start (Esc HSRT)"
    send: "\x1bHSRT"
    expect: { matches: '^(?:Hsrt\s*\d+\s*\*\s*)?0*(\d+)$' }
    returns: value

  set_vertical_start:
    summary: "Set the current input's vertical start (Esc nVSRT)"
    params:
      value: { type: int, min: 0, max: 255, required: true,
        label: Vertical start,
        description: "The analog input's vertical start (the first active line), 0 to 255; 128 is the default." }
    send: "\x1b{value}VSRT"
    expect: { matches: '^Vsrt\s*\d+\s*\*\s*\d+$' }
    returns: ack

  increase_vertical_start:
    summary: "Raise the current input's vertical start by one (Esc +VSRT)"
    send: "\x1b+VSRT"
    expect: { matches: '^Vsrt\s*\d+\s*\*\s*\d+$' }
    returns: ack

  decrease_vertical_start:
    summary: "Lower the current input's vertical start by one (Esc -VSRT)"
    send: "\x1b-VSRT"
    expect: { matches: '^Vsrt\s*\d+\s*\*\s*\d+$' }
    returns: ack

  get_vertical_start:
    summary: "The current input's vertical start (Esc VSRT)"
    send: "\x1bVSRT"
    expect: { matches: '^(?:Vsrt\s*\d+\s*\*\s*)?0*(\d+)$' }
    returns: value

  set_pixel_phase:
    summary: "Set the current input's pixel phase (Esc nPHAS)"
    params:
      value: { type: int, min: 0, max: 63, required: true,
        label: Pixel phase,
        description: "The analog input's pixel sampling phase, 0 to 63; 31 is the default (RGB and YUV-HD signals only)." }
    send: "\x1b{value}PHAS"
    expect: { matches: '^Phas\s*\d+\s*\*\s*\d+$' }
    returns: ack

  increase_pixel_phase:
    summary: "Raise the current input's pixel phase by one (Esc +PHAS)"
    send: "\x1b+PHAS"
    expect: { matches: '^Phas\s*\d+\s*\*\s*\d+$' }
    returns: ack

  decrease_pixel_phase:
    summary: "Lower the current input's pixel phase by one (Esc -PHAS)"
    send: "\x1b-PHAS"
    expect: { matches: '^Phas\s*\d+\s*\*\s*\d+$' }
    returns: ack

  get_pixel_phase:
    summary: "The current input's pixel phase (Esc PHAS)"
    send: "\x1bPHAS"
    expect: { matches: '^(?:Phas\s*\d+\s*\*\s*)?0*(\d+)$' }
