        "\x1b4FILM", "\x1b4AMEM", "\x1bI4AFMT", "\x1bI4HDCP", "4\\", "\x1b5NI", "5A", "\x1bE5HDCP",
        "\x1b5ASPR", "\x1b5FILM", "\x1b5AMEM", "\x1bI5AFMT", "\x1bI5HDCP", "5\\", "\x1b6NI", "6A",
        "\x1bE6HDCP", "\x1b6ASPR", "\x1b6FILM", "\x1b6AMEM", "\x1bI6AFMT", "\x1bI6HDCP", "6\\", "\x1b7NI",
        "7A", "\x1bE7HDCP", "\x1b7ASPR", "\x1b7FILM", "\x1b7AMEM", "\x1bI7AFMT", "\x1bI7HDCP", "7\\",
        "\x1b8NI", "8A", "\x1bE8HDCP", "\x1b8ASPR", "\x1b8FILM", "\x1b8AMEM", "\x1bI8AFMT", "\x1bI8HDCP",
        "8\\", "\x1bCONT", "\x1bBRIT", "\x1bHDET", "\x1bCOLR", "\x1bTINT", "\x1bXIMG", "F", "1*B", "\x1b1VTPO",
        "\x1bO1HDCP", "2*B", "\x1b2VTPO", "\x1bO2HDCP", "3*B", "\x1b3VTPO", "\x1bO3HDCP", "\x1bAUSW",
        "\x1bRATE", "\x1bMDUR", "\x1bMSSAV", "\x1bTSSAV", "\x1bSSSAV", "\x1bTEST", "\x1bSWEF", "\x1bSHDCP",
        "\x1bNHDCP", "\x1b1KNOB", "\x1bALVL", "\x1bCV", "\x1b1OSCN", "\x1b2OSCN", "\x1b3OSCN", "\x1b4OSCN",
        "\x1b5OSCN", "\x1b6OSCN", "\x1bD1GRPM", "\x1bD2GRPM", "\x1bD3GRPM", "\x1bD4GRPM", "\x1bD5GRPM",
        "\x1bD6GRPM", "\x1bD7GRPM", "\x1bD8GRPM", "\x1bG40100AU", "\x1bG40101AU", "\x1bG60000AU",
        "\x1bG60002AU", "\x1bG60004AU", "\x1bG60005AU", "\x1bG60006AU", "\x1bG60007AU", "\x1bG60008AU",
        "\x1bG60009AU", "\x1bM40000AU", "\x1bM40001AU", "\x1bM60000AU", "\x1bM60002AU", "\x1bM60004AU",
        "\x1bM60005AU", "\x1bM60006AU", "\x1bM60007AU", "\x1bM60008AU", "\x1bM60009AU"]
    # The IN1606/IN1608 picture controls, image and freeze follow the current input: read again
    # after a switch. Both families: a preset recall or an Auto-Image changes the picture and image
    # without reporting each setting.
    - models: [in1608-series]
      match: '^In\s*0*\d+\s*(?:All|RGB)$'
      then_send: [
        "\x1bCONT", "\x1bBRIT", "\x1bHDET", "\x1bCOLR", "\x1bTINT", "\x1bXIMG", "F"]
    - models: [in1608-series]
      match: '^(?:[12]Rpr\s*\d+|Img[0-2])$'
      then_send: [
        "\x1bCONT", "\x1bBRIT", "\x1bHDET", "\x1bCOLR", "\x1bTINT", "\x1bXIMG", "F"]
    - models: [in1808-series]
      match: '^(?:In\s*0*\d+\*1\s*(?:All|Vid)|Img1\*[0-2])$'
      then_send: ["\x1b1HDET", "\x1b1XIMG"]
    - models: [in1808-series]
      match: '^2Rpr\s*\d+$'
      then_send: [
        "\x1b1HDET", "\x1b1XIMG", "\x1b1CONT", "\x1b1BRIT", "\x1b1FILM", "\x1b2CONT", "\x1b2BRIT", "\x1b2FILM",
        "\x1b3CONT", "\x1b3BRIT", "\x1b3FILM", "\x1b4CONT", "\x1b4BRIT", "\x1b4FILM", "\x1b5CONT", "\x1b5BRIT",
        "\x1b5FILM", "\x1b6CONT", "\x1b6BRIT", "\x1b6FILM", "\x1b7CONT", "\x1b7BRIT", "\x1b7FILM", "\x1b8CONT",
        "\x1b8BRIT", "\x1b8FILM"]
    - match: '^In\s*0*(\d+)(?:\*1)?\s*All$'
      state: { input: "{1}", video_input: "{1}", audio_input: "{1}" }
    - match: '^In\s*0*(\d+)(?:\*1)?\s*(?:Vid|RGB)$'
      state: { video_input: "{1}" }
    - match: '^In\s*0*(\d+)(?:\*1)?\s*Aud$'
      state: { audio_input: "{1}" }
    - match: '^0*(\d+)$'
      request_match: '^1?!$'
      state: { input: "{1}", video_input: "{1}", audio_input: "{1}" }
    - match: '^0*(\d+)$'
      request_match: '^(?:1%|&)$'
      state: { video_input: "{1}" }
    - match: '^0*(\d+)$'
      request_match: '^1?\$$'
      state: { audio_input: "{1}" }
    - match: '^(?:Lout\s*)?0*(\d+)$'
      request_match: '^\x1bLOUT$'
      state: { loop_out_input: "{1}" }
    - match: '^Lout\s*0*(\d+)$'
      state: { loop_out_input: "{1}" }
    - match: '^Vmt\s*0*([1-3])\*([0-2])$'
      state: { "outputs.{1}.video_mute": "{2}" }
    - match: '^([0-2])$'
      request_match: '^([1-3])\*B$'
      state: { "outputs.{2}.video_mute": "{1}" }
    - match: '^Vmt([0-2])$'
      state: { video_mute_all: "{1}" }
    # IN1808: B answers one digit per output.
    - match: '^(?:Vmt)?([0-2]) ([0-2]) ([0-2])$'
      state: { outputs.1.video_mute: "{1}", outputs.2.video_mute: "{2}", outputs.3.video_mute: "{3}" }
    - match: '^VnamI\s*0*(\d+)\*(.*)$'
      state: { "inputs.{1}.name": "{2}" }
    - match: '^VnamO\s*0*(\d+)\*(.*)$'
      state: { "outputs.{1}.name": "{2}" }
    - match: '^Nmi\s*0*(\d+),(.*)$'
      state: { "inputs.{1}.name": "{2}" }
    - match: '^AnamI\s*0*(\d+)\*(.*)$'
      state: { "audio_inputs.{1}.name": "{2}" }
    - match: '^AnamO\s*0*(\d+)\*(.*)$'
      state: { "audio_outputs.{1}.name": "{2}" }
    - match: '^AfmtI\s*0*(\d+)\*([0-5])$'
      state: { "inputs.{1}.audio_format": "{2}" }
    - match: '^([0-5])$'
      request_match: '^\x1bI(\d+)AFMT$'
      state: { "inputs.{2}.audio_format": "{1}" }
    - match: '^HdcpI\s*0*(\d+)\*([0-2])$'
      state: { "inputs.{1}.hdcp_status": "{2}" }
    - match: '^([0-2])$'
      request_match: '^\x1bI(\d+)HDCP$'
      state: { "inputs.{2}.hdcp_status": "{1}" }
    - match: '^HdcpO\s*0*(\d+)\*([0-2])$'
      state: { "outputs.{1}.hdcp_status": "{2}" }
    - match: '^([0-2])$'
      request_match: '^\x1bO(\d+)HDCP$'
      state: { "outputs.{2}.hdcp_status": "{1}" }
    - match: '^HdcpE\s*0*(\d+)\*([01])$'
      state: { "inputs.{1}.hdcp_authorized": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^([01])$'
      request_match: '^\x1bE(\d+)HDCP$'
      state: { "inputs.{2}.hdcp_authorized": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^HdcpS\s*0*([1-3])\s*\*\s*([0-4])$'
      state: { "outputs.{1}.hdcp_mode": "{2}" }
    - models: [in1808-series]
      match: '^([0-4])$'
      request_match: '^\x1bS([1-3])HDCP$'
      state: { "outputs.{2}.hdcp_mode": "{1}" }
    - models: [in1608-series]
      match: '^([0-4])$'
      request_match: '^\x1bSHDCP$'
      state: { hdcp_mode: "{1}" }
    - models: [in1608-series]
      match: '^HdcpS\s*([0-4])$'
      state: { hdcp_mode: "{1}" }
    - match: '^HdcpN\s*1\s*\*\s*([0-2])$'
      state: { hdcp_notification: "{1}" }
    - match: '^HdcpN\s*([01])$'
      state: { hdcp_notification: "{1}" }
    - match: '^([0-2])$'
      request_match: '^\x1bN1?HDCP$'
      state: { hdcp_notification: "{1}" }
    - match: '^Aspr\s*0*(\d+)\s*\*\s*([12])$'
      state: { "inputs.{1}.aspect_ratio": "{2}" }
    - match: '^([12])$'
      request_match: '^\x1b(\d+)ASPR$'
      state: { "inputs.{2}.aspect_ratio": "{1}" }
    - match: '^Film\s*0*(\d+)\s*\*\s*([01])$'
      state: { "inputs.{1}.film_mode": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^([01])$'
      request_match: '^\x1b(\d+)FILM$'
      state: { "inputs.{2}.film_mode": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^Amem\s*0*(\d+)\s*\*\s*([01])$'
      state: { "inputs.{1}.auto_memory": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^([01])$'
      request_match: '^\x1b(\d+)AMEM$'
      state: { "inputs.{2}.auto_memory": { value: "{1}", map: { "0": false, "1": true } } }
    # IN1606/IN1608 automatic Auto-Image per input (Img X!*1); the IN1808's Img1*n reports an
    # Auto-Image run, not a setting.
    - models: [in1608-series]
      match: '^Img\s*0*(\d+)\s*\*\s*([01])$'
      state: { "inputs.{1}.auto_image": { value: "{2}", map: { "0": false, "1": true } } }
    - models: [in1608-series]
      match: '^([01])$'
      request_match: '^(\d+)A$'
      state: { "inputs.{2}.auto_image": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^Vtyp\s*0*(\d+)\s*\*\s*([0-3])$'
      state: { "inputs.{1}.detected_format": "{2}" }
    - match: '^([0-3])$'
      request_match: '^(\d+)\*\\$'
      state: { "inputs.{2}.detected_format": "{1}" }
    - match: '^Typ\s*0*(\d+)\s*\*\s*([1-6])$'
      state: { "inputs.{1}.video_format": "{2}" }
    - match: '^([1-6])$'
      request_match: '^(\d+)\\$'
      state: { "inputs.{2}.video_format": "{1}" }
    - match: '^Cont\s*0*(\d+)\*0*(\d+)$'
      state: { "inputs.{1}.contrast": "{2}" }
    - models: [in1808-series]
      match: '^0*(\d+)$'
      request_match: '^\x1b(\d)CONT$'
      state: { "inputs.{2}.contrast": "{1}" }
    - match: '^Brit\s*0*(\d+)\*0*(\d+)$'
      state: { "inputs.{1}.brightness": "{2}" }
    - models: [in1808-series]
      match: '^0*(\d+)$'
      request_match: '^\x1b(\d)BRIT$'
      state: { "inputs.{2}.brightness": "{1}" }
    - models: [in1808-series]
      match: '^(?:Hdet1\*)?0*(\d+)$'
      request_match: '^\x1b1(?:\*\d+)?HDET$'
      state: { detail: "{1}" }
    - models: [in1808-series]
      match: '^Hdet1\*0*(\d+)$'
      state: { detail: "{1}" }
    - models: [in1608-series]
      match: '^Hdet\s*0*(\d+)\s*\*\s*0*(\d+)$'
      state: { "inputs.{1}.detail": "{2}" }
    - match: '^Colr\s*0*(\d+)\*0*(\d+)$'
      state: { "inputs.{1}.color": "{2}" }
    - match: '^Tint\s*0*(\d+)\*0*(\d+)$'
      state: { "inputs.{1}.tint": "{2}" }
    - match: '^Ximg(?:1,)?([-+]?\d+)\*([-+]?\d+)\*(\d+)\*(\d+)$'
      state: { image.horizontal: "{1}", image.vertical: "{2}", image.width: "{3}", image.height: "{4}" }
    - match: '^([-+]?\d+)\*([-+]?\d+)\*(\d+)\*(\d+)$'
      request_match: '^\x1b1?XIMG$'
      state: { image.horizontal: "{1}", image.vertical: "{2}", image.width: "{3}", image.height: "{4}" }
    - match: '^Hctr(?:I1\*)?\s*([-+]?\d+)$'
      state: { image.horizontal: "{1}" }
    - match: '^Vctr(?:I1\*)?\s*([-+]?\d+)$'
      state: { image.vertical: "{1}" }
    - match: '^Hsiz(?:I1\*)?\s*0*(\d+)$'
      state: { image.width: "{1}" }
    - match: '^Vsiz(?:I1\*)?\s*0*(\d+)$'
      state: { image.height: "{1}" }
    - match: '^Vtpo\s*0*([1-3])\s*\*\s*(\d)$'
      state: { "outputs.{1}.hdmi_format": "{2}" }
    - match: '^(\d)$'
      request_match: '^\x1b([1-3])VTPO$'
      state: { "outputs.{2}.hdmi_format": "{1}" }
    - match: '^GrpmD\s*0*(\d+)\*([-+]?\d+)$'
      state: { "groups.{1}.value": "{2}" }
    - match: '^([-+]?\d+)$'
      request_match: '^\x1bD(\d+)GRPM$'
      state: { "groups.{2}.value": "{1}" }
    - match: '^DsG\s*(\d+)\*([-+]?\d+)$'
      state: { "dsp.{1}.gain": "{2}" }
    - match: '^([-+]?\d+)$'
      request_match: '^\x1bG(\d+)AU$'
      state: { "dsp.{2}.gain": "{1}" }
    - match: '^DsM\s*(\d+)\*([01])$'
      state: { "dsp.{1}.mute": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^([01])$'
      request_match: '^\x1bM(\d+)AU$'
      state: { "dsp.{2}.mute": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^DsZ\s*(\d+)\*([01])$'
      state: { "dsp.{1}.phantom_power": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^([01])$'
      request_match: '^\x1bZ(\d+)AU$'
      state: { "dsp.{2}.phantom_power": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^DsH\s*(\d+)\*([-+]?\d+)$'
      state: { "dsp.{1}.embedded_gain": "{2}" }
    - match: '^([-+]?\d+)$'
      request_match: '^\x1bH(\d+)AU$'
      state: { "dsp.{2}.embedded_gain": "{1}" }
    - match: '^(?:Knob1\*)?0*(\d+)$'
      request_match: '^\x1b1(?:\*\d+)?KNOB$'
      state: { volume_knob_group: "{1}" }
    - match: '^Knob1\*0*(\d+)$'
      state: { volume_knob_group: "{1}" }
    - match: '^Frz(?:1\*)?([01])$'
      state: { freeze: { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^([01])$'
      request_match: '^1?F$'
      state: { freeze: { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^(?:Exe)?([0-4])$'
      request_match: '^X$'
      state: { front_panel_lock: "{1}" }
    - match: '^Exe([0-4])$'
      state: { front_panel_lock: "{1}" }
    - match: '^(?:Psav)?([0-2])$'
      request_match: '^\x1bPSAV$'
      state: { power_save: "{1}" }
    - match: '^Psav([0-2])$'
      state: { power_save: "{1}" }
    - match: '^(?:Rate(?:1\*)?\s*)?0*(\d+)$'
      request_match: '^\x1b1?RATE$'
      state: { output_rate: "{1}" }
    - match: '^Rate(?:1\*)?\s*0*(\d+)$'
      state: { output_rate: "{1}" }
    - match: '^(?:Test(?:1\*)?\s*)?0*(\d+)$'
      request_match: '^\x1b1?TEST$'
      state: { test_pattern: "{1}" }
    - match: '^Test(?:1\*)?\s*0*(\d+)$'
      state: { test_pattern: "{1}" }
    - match: '^(?:Swef(?:O1\*)?)?([0-3])$'
      request_match: '^\x1b(?:O1)?SWEF$'
      state: { switch_effect: "{1}" }
    - match: '^Swef(?:O1\*)?([0-3])$'
      state: { switch_effect: "{1}" }
    - match: '^(?:Ausw)?([0-2])$'
      request_match: '^\x1bAUSW$'
      state: { auto_switch_mode: "{1}" }
    - match: '^Ausw([0-2])$'
      state: { auto_switch_mode: "{1}" }
    - match: '^(?:AuswT\s*)?0*(\d+)$'
      request_match: '^\x1bTAUSW$'
      state: { auto_switch_timeout: "{1}" }
    - match: '^AuswT\s*0*(\d+)$'
      state: { auto_switch_timeout: "{1}" }
    - match: '^(?:AuswP\s*)?([1-8](?: [1-8])+)$'
      request_match: '^\x1bPAUSW$'
      state: { auto_switch_priority: "{1}" }
    - match: '^AuswP\s*([1-8](?: [1-8])+)$'
      state: { auto_switch_priority: "{1}" }
    - match: '^(?:Alvl\s*)?0*(\d+)$'
      request_match: '^\x1bALVL$'
      state: { auto_image_threshold: "{1}" }
    - match: '^Alvl\s*0*(\d+)$'
      state: { auto_image_threshold: "{1}" }
    - match: '^Oscn\s*([1-6])\s*\*\s*([0-2])$'
      state: { "overscan.{1}": "{2}" }
    - match: '^([0-2])$'
      request_match: '^\x1b([1-6])OSCN$'
      state: { "overscan.{2}": "{1}" }
    - match: '^(?:Mdur\s*)?0*(\d+)$'
      request_match: '^\x1bMDUR$'
      state: { osd_duration: "{1}" }
    - match: '^Mdur\s*0*(\d+)$'
      state: { osd_duration: "{1}" }
    - match: '^Ssav\s*M\s*(?:1\s*\*\s*)?([0-3])$'
      state: { screen_saver.mode: "{1}" }
    - match: '^([0-3])$'
      request_match: '^\x1bM1?SSAV$'
      state: { screen_saver.mode: "{1}" }
    - match: '^Ssav\s*T\s*(?:1\s*\*\s*)?0*(\d+)$'
      state: { screen_saver.timeout: "{1}" }
    - match: '^0*(\d+)$'
      request_match: '^\x1bT1?SSAV$'
      state: { screen_saver.timeout: "{1}" }
    - match: '^Ssav\s*S\s*(?:1\s*\*\s*)?([0-2])$'
      state: { screen_saver.status: "{1}" }
    - match: '^([0-2])$'
      request_match: '^\x1bS1?SSAV$'
      state: { screen_saver.status: "{1}" }
    - match: '^Ssav\s*C\s*([0-9A-Fa-f]{6})$'
      state: { screen_saver.color: "{1}" }
    - match: '^(?:Vrb)?([0-3])$'
      request_match: '^\x1bCV$'
      state: { verbose_mode: "{1}" }
    - match: '^Vrb([0-3])$'
      state: { verbose_mode: "{1}" }
    - match: '^Play0*(\d+)\*([01])$'
      state: { audio_playback_slot: "{1}", audio_playing: { value: "{2}", map: { "0": false, "1": true } } }
    # Signal presence: "IN00 1*0*1..." pushed on a sync change, and the tagged 0LS reply. One rule per
    # input position (up to 8).
    - match: '^I[Nn]00\s*([01])(?:\*[01])*$'
      state: { "inputs.1.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*[01]\*([01])(?:\*[01])*$'
      state: { "inputs.2.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*(?:[01]\*){2}([01])(?:\*[01])*$'
      state: { "inputs.3.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*(?:[01]\*){3}([01])(?:\*[01])*$'
      state: { "inputs.4.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*(?:[01]\*){4}([01])(?:\*[01])*$'
      state: { "inputs.5.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*(?:[01]\*){5}([01])(?:\*[01])*$'
      state: { "inputs.6.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*(?:[01]\*){6}([01])(?:\*[01])*$'
      state: { "inputs.7.signal": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^I[Nn]00\s*(?:[01]\*){7}([01])(?:\*[01])*$'
      state: { "inputs.8.signal": { value: "{1}", map: { "0": false, "1": true } } }
