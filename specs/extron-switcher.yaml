  auto_switch_timeout:          { type: int, unit: s, description: "IN1808: seconds without video before auto-input switching moves on" }
  auto_switch_priority:         { type: string, description: "IN1808: user priority order, input numbers highest first, separated by spaces" }
  auto_image_threshold:         { type: int, description: "IN1608: luminosity Auto-Image takes as active video, 0-100" }
  overscan.*:                   { type: int, description: "IN1608 and IN1604: overscan of an input video format, keyed by the model's format number, 0 0%, 1 2.5%, 2 5%" }
  hdcp_mode:                    { type: int, description: "IN1608 and IN1604: HDCP mode of the HDMI outputs, IN1608 0-4, IN1604 0-3 (see set_output_hdcp_mode_in1600 and _in1604)" }
  hdcp_notification:            { type: int, description: "What a non-HDCP display shows for HDCP content: IN1808 0 black, 1 green screen, 2 user image; IN1608 0 black, 1 green screen" }
  osd_duration:                 { type: int, unit: s, description: "Seconds the OSD menu (IN1808) or input bug (IN1608) shows; IN1608 0 never, 501 always" }
  screen_saver.mode:            { type: int, description: "What the output shows with no active input: IN1808 1 black, 2 blue, 3 user image; IN1608 0 custom color, 1 black, 2 blue" }
  screen_saver.timeout:         { type: int, unit: s, description: "Seconds without an active input before output sync is disabled; 501 never" }
  screen_saver.status:          { type: int, description: "0 active input, 1 no input and the timer running, 2 timer expired and sync disabled" }
  screen_saver.color:           { type: string, description: "IN1608: custom screen saver color as six hex digits, as the unit last reported it (no query exists)" }
  volume_knob_group:            { type: int, description: "IN1608: group the front panel volume knob controls, 1 program, 3 mic, 8 output" }
  verbose_mode:                 { type: int, description: "Verbose mode 0-3 (3 set on connecting)" }
  audio_playback_slot:          { type: int, description: "Audio file slot last reported playing (IN1808); 0 none" }
  audio_playing:                { type: bool, description: "The slot in audio_playback_slot is playing" }
  inputs.*.edid:                { type: int, description: "IN1604: EDID code assigned to the input, 0 automatic, 10-53 by resolution and rate, 201-205 custom" }
  inputs.*.horizontal_start:    { type: int, description: "IN1604: the input's horizontal start, 0-255" }
  inputs.*.vertical_start:      { type: int, description: "IN1604: the input's vertical start, 0-255" }
  inputs.*.pixel_phase:         { type: int, description: "IN1604: the input's pixel phase, 0-63" }
  inputs.*.total_pixels:        { type: int, description: "IN1604: the input's total pixels per line" }
  inputs.*.active_pixels:       { type: int, description: "IN1604: the input's active pixels per line" }
  inputs.*.active_lines:        { type: int, description: "IN1604: the input's active lines" }
  output_format:                { type: int, description: "IN1604: the output's color space and format setting, 0 auto to 7 (see set_output_format_in1604)" }
  auto_output_format:           { type: int, description: "IN1604: the color space and format the auto setting chose from the display, 1-7" }
  audio_outputs.*.muted:        { type: bool, description: "IN1604: the audio output is muted, 1 the analog outputs, 2 the embedded HDMI audio" }
  audio_gain:                   { type: int, unit: dB, description: "IN1604: the current input's analog audio gain or attenuation, -18 to +24" }
  volume:                       { type: int, unit: dB, description: "IN1604: the output volume, -100 to 0" }
  audio_output_format:          { type: int, description: "IN1604: the analog audio output, 1 dual mono, 2 stereo" }
  contact.av_mute_mode:         { type: int, description: "IN1604: what a Contact In closure on the current input does, 0 nothing, 1 mute video and audio, 2 mute video, sync and audio" }
  contact.tally_mode:           { type: int, description: "IN1604: Tally Out while muted, 0 always on, 1 off, 2 blinking" }
  osd_menu_open:                { type: bool, description: "IN1604: the on-screen menu is shown" }
  unit_name:                    { type: string, description: "IN1604: the device name" }
  user_presets.*.name:          { type: string, description: "IN1604: a user preset's name, from tagged replies" }
  input_presets.*.name:         { type: string, description: "IN1604: an input preset's name, from tagged replies" }
  tp_output_format:             { type: int, description: "IN1604 DTP: the twisted pair output's format, 0 DTP, 1 HDBaseT (rear panel switch)" }

telemetry:
  # Verbose mode 3 (set on connecting) makes the unit report every change, from any source, in the
  # tagged form of a reply, and tag the replies to queries, so the same rules read both. Rules with
  # request_match also read a query's bare reply, tied to the query it answers. Signal presence is
  # read on connecting, and changes to it are pushed (IN1808 guide p.53). N (the part number) is
  # asked by both families; its reply queues the family's own queries for every other setting.
  # The internal temperature changes without a notification: it is asked every 30 s.
  poll:
    - send: ["\x1b0LS", "X", "\x1bPSAV", "N"]
    - every_ms: 30000
      send: ["\x1b20STAT"]
  updates:
    # Esc 20STAT: the internal temperature in degrees Celsius, tagged or bare.
    - match: '^(?:20Stat\s*)?0*(\d+(?:\.\d)?)$'
      request_match: '^\x1b20STAT$'
      state: { device.temperature: "{1}" }
    # The copyright banner sent on connecting (IN1808 guide p.52, IN1608 guide p.42).
    - match: '^\(c\) Copyright \d{4}, Extron Electronics,? (.+?), V(\d+\.\d+), (60-\d+-\d+)$'
      state: { device.model: "{1}", device.firmware: "{2}", device.part_number: "{3}" }
    - match: '^Login (Administrator|User)$'
      state: { device.login: "{1}" }
    # Every setting the commands write, read on connecting: one query per setting, input, output,
    # group and DSP block the family's guide documents.
    - models: [in1808-series]
      match: '^(?:Pno)?(60-\d+-\d+)$'
      request_match: '^N$'
      state: { device.part_number: "{1}" }
      then_send: [
        "1!", "1%", "1$", "\x1bLOUT", "\x1bI1VNAM", "\x1bE1HDCP", "\x1b1ASPR", "\x1b1FILM", "\x1b1CONT",
        "\x1b1BRIT", "\x1b1AMEM", "\x1bI1AFMT", "\x1bI1HDCP", "1*\\", "\x1bI2VNAM", "\x1bE2HDCP", "\x1b2ASPR",
        "\x1b2FILM", "\x1b2CONT", "\x1b2BRIT", "\x1b2AMEM", "\x1bI2AFMT", "\x1bI2HDCP", "2*\\", "\x1bI3VNAM",
        "\x1bE3HDCP", "\x1b3ASPR", "\x1b3FILM", "\x1b3CONT", "\x1b3BRIT", "\x1b3AMEM", "\x1bI3AFMT",
        "\x1bI3HDCP", "3*\\", "\x1bI4VNAM", "\x1bE4HDCP", "\x1b4ASPR", "\x1b4FILM", "\x1b4CONT", "\x1b4BRIT",
        "\x1b4AMEM", "\x1bI4AFMT", "\x1bI4HDCP", "4*\\", "\x1bI5VNAM", "\x1bE5HDCP", "\x1b5ASPR", "\x1b5FILM",
        "\x1b5CONT", "\x1b5BRIT", "\x1b5AMEM", "\x1bI5AFMT", "\x1bI5HDCP", "5*\\", "\x1bI6VNAM", "\x1bE6HDCP",
        "\x1b6ASPR", "\x1b6FILM", "\x1b6CONT", "\x1b6BRIT", "\x1b6AMEM", "\x1bI6AFMT", "\x1bI6HDCP", "6*\\",
        "\x1bI7VNAM", "\x1bE7HDCP", "\x1b7ASPR", "\x1b7FILM", "\x1b7CONT", "\x1b7BRIT", "\x1b7AMEM",
        "\x1bI7AFMT", "\x1bI7HDCP", "7*\\", "\x1bI8VNAM", "\x1bE8HDCP", "\x1b8ASPR", "\x1b8FILM", "\x1b8CONT",
        "\x1b8BRIT", "\x1b8AMEM", "\x1bI8AFMT", "\x1bI8HDCP", "8*\\", "\x1bI9AFMT", "\x1bO1VNAM", "1*B",
        "\x1b1VTPO", "\x1bS1HDCP", "\x1bO1HDCP", "\x1bO2VNAM", "2*B", "\x1b2VTPO", "\x1bS2HDCP", "\x1bO2HDCP",
        "\x1bO3VNAM", "3*B", "\x1b3VTPO", "\x1bS3HDCP", "\x1bO3HDCP", "\x1bAUSW", "\x1bTAUSW", "\x1bPAUSW",
        "1F", "\x1b1HDET", "\x1b1XIMG", "\x1b1RATE", "\x1bMDUR", "\x1bM1SSAV", "\x1bT1SSAV", "\x1bS1SSAV",
        "\x1b1TEST", "\x1bO1SWEF", "\x1bN1HDCP", "\x1bPLAY", "\x1bCV", "\x1bD1GRPM", "\x1bD2GRPM",
        "\x1bD3GRPM", "\x1bD4GRPM", "\x1bD5GRPM", "\x1bD6GRPM", "\x1bD7GRPM", "\x1bD8GRPM", "\x1bD9GRPM",
        "\x1bD10GRPM", "\x1bG30000AU", "\x1bG30001AU", "\x1bG30002AU", "\x1bG30003AU", "\x1bG30004AU",
        "\x1bG30005AU", "\x1bG30006AU", "\x1bG30007AU", "\x1bG30008AU", "\x1bG30009AU", "\x1bG30010AU",
        "\x1bG30011AU", "\x1bG30012AU", "\x1bG30013AU", "\x1bG30014AU", "\x1bG30015AU", "\x1bG30016AU",
