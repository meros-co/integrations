    summary: Get the screen saver timeout in seconds (Esc T1SSAV)
    send: "\x1bT1SSAV"
    expect: { matches: '^(?:Ssav\s*T\s*1\s*\*\s*)?0*(\d+)$' }
    returns: value
  get_screen_saver_status:
    summary: "Get the screen saver status: 0 active input, 1 no input and the timer running, 2 timer expired and sync off (Esc S1SSAV)"
    send: "\x1bS1SSAV"
    expect: { matches: '^(?:Ssav\s*S\s*1\s*\*\s*)?([0-2])$' }
    returns: value
  set_screen_saver_mode_in1600:
    summary: "Set what the outputs show with no active input: 0 the custom color, 1 black, 2 blue (Esc MnSSAV)"
    params:
      mode: { type: int, min: 0, max: 2, required: true,
              label: Screen saver,
              description: "What the outputs show with no active input: 0 the custom color, 1 black, 2 blue." }
    send: "\x1bM{mode}SSAV"
    expect: { matches: '^Ssav\s*M\s*[0-2]$' }
    returns: ack
  get_screen_saver_mode_in1600:
    summary: Get the screen saver mode (Esc MSSAV)
    send: "\x1bMSSAV"
    expect: { matches: '^(?:Ssav\s*M\s*)?([0-2])$' }
    returns: value
  set_screen_saver_color_in1600:
    summary: Set the custom screen saver color as six hex digits, such as FF0000 for red (Esc ChexSSAV); the guide documents no query for it
    params:
      color: { type: string, pattern: '^[0-9A-Fa-f]{6}$', required: true,
               label: Color,
               description: "Custom screen saver color as HTML-style hexadecimal RGB, 000000 black to FFFFFF white." }
    send: "\x1bC{color}SSAV"
    expect: { matches: '^Ssav\s*C\s*[0-9A-Fa-f]{6}$' }
    returns: ack
  set_screen_saver_timeout_in1600:
    summary: Set the seconds without an active input before output sync is disabled, 0 at once, 1-500, 501 never (Esc TnSSAV)
    params:
      seconds: { type: int, min: 0, max: 501, required: true,
                 label: Sync timeout,
                 description: "Seconds without an active input before output sync is disabled: 0 at once, 1 to 500, 501 never." }
    send: "\x1bT{seconds}SSAV"
    expect: { matches: '^Ssav\s*T\s*\d+$' }
    returns: ack
  get_screen_saver_timeout_in1600:
    summary: Get the screen saver timeout in seconds (Esc TSSAV)
    send: "\x1bTSSAV"
    expect: { matches: '^(?:Ssav\s*T\s*)?0*(\d+)$' }
    returns: value
  get_screen_saver_status_in1600:
    summary: "Get the screen saver status: 0 active input, 1 no input and the timer running, 2 timer expired and sync off (Esc SSSAV)"
    send: "\x1bSSSAV"
    expect: { matches: '^(?:Ssav\s*S\s*)?([0-2])$' }
    returns: value

  # ── Presets (IN1808 p.74; IN1608 p.59) ──────────────────────────────────
  recall_input_preset:
    summary: Recall an input preset (picture settings) for the current input, 1-16 on IN1808, 1-128 on IN1608 (2*n.)
    params:
      preset: { type: int, min: 1, max: 128, required: true,
                label: Input preset,
                description: "Input preset (picture settings) number: 1 to 16 on IN1808 units, 1 to 128 on IN1608 units." }
    send: "2*{preset}."
    expect: { matches: '^2Rpr\s*\d+$' }
    returns: ack
  save_input_preset:
    summary: Save the current input's picture settings as an input preset (2*n,)
    params:
      preset: { type: int, min: 1, max: 128, required: true,
                label: Input preset,
                description: "Input preset (picture settings) number: 1 to 16 on IN1808 units, 1 to 128 on IN1608 units." }
    send: "2*{preset},"
    expect: { matches: '^2Spr\s*\d+$' }
    returns: ack
  recall_user_preset:
    summary: Recall a user preset (picture and audio settings), 1-16 (1*n.)
    params:
      preset: { type: int, min: 1, max: 16, required: true,
                label: User preset,
                description: "User preset (picture and audio settings) number, 1 to 16." }
    send: "1*{preset}."
    expect: { matches: '^1Rpr\s*\d+$' }
    returns: ack
  save_user_preset:
    summary: Save the current picture controls as a user preset, 1-16 (1*n,)
    params:
      preset: { type: int, min: 1, max: 16, required: true,
                label: User preset,
                description: "User preset number, 1 to 16." }
    send: "1*{preset},"
    expect: { matches: '^1Spr\s*\d+$' }
    returns: ack
  set_auto_memory:
    summary: Turn Auto Memory (automatic per-signal input presets) on or off for an input (Esc X!*1AMEM / *0)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      enabled: { type: bool, required: true,
                 label: Auto Memory,
                 description: "True turns Auto Memory (automatic per-signal input presets) on for the input, false off." }
    send: "\x1b{input}*{enabled:bool01}AMEM"
    expect: { matches: '^Amem\s*\d+\s*\*\s*[01]$' }
    returns: ack
  get_auto_memory:
    summary: Get an input's Auto Memory setting (Esc X!AMEM)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}AMEM"
    expect: { matches: '^(?:Amem\s*\d+\s*\*\s*)?([01])$' }
    returns: value

  # ── Audio (IN1808 p.75, p.88-92; IN1608 p.57-58) ────────────────────────
  set_audio_input_format:
    summary: "Set an input's audio format: 0 none (muted), 1 analog, 2 LPCM-2Ch, 3 multichannel, 4 LPCM-2Ch auto, 5 multichannel auto (Esc IX!*nAFMT)"
    params:
      input: { type: int, min: 1, max: 9, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel; 9 is the IN1808's aux audio input." }
      format: { type: int, min: 0, max: 5, required: true,
                label: Audio format,
                description: "0 none (muted), 1 analog, 2 LPCM-2Ch, 3 multichannel, 4 LPCM-2Ch auto, 5 multichannel auto." }
    send: "\x1bI{input}*{format}AFMT"
    expect: { matches: '^AfmtI\s*\d+\*[0-5]$' }
    returns: ack
  get_audio_input_format:
    summary: Get an input's audio format (Esc IX!AFMT)
    params:
      input: { type: int, min: 1, max: 9, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel; 9 is the IN1808's aux audio input." }
    send: "\x1bI{input}AFMT"
    expect: { matches: '^(?:AfmtI\s*\d+\*)?([0-5])$' }
    returns: value
  set_group_level:
    summary: Set a group master (volume, bass or treble) in tenths of a dB, such as -293 for -29.3 dB (Esc Dg*nGRPM); groups per model in the notes
    params:
      group: { type: int, min: 1, max: 10, required: true,
               label: Group,
               description: "Group master number; what each group controls depends on the model (see the model notes, e.g. 3 is program volume on the IN1808)." }
      level: { type: int, min: -1000, max: 800, required: true,
               label: Level,
               description: "Group master value in tenths of a dB, e.g. -293 for -29.3 dB; the group's own range applies." }
    send: "\x1bD{group}*{level}GRPM"
    expect: { matches: '^GrpmD\s*\d+\*[-+]?\d+$' }
    returns: ack
  increase_group_level:
    summary: Raise a group master by a step in tenths of a dB (Esc Dg*n+GRPM)
    params:
      group: { type: int, min: 1, max: 10, required: true,
               label: Group,
               description: "Group master number; what each group controls depends on the model (see the model notes, e.g. 3 is program volume on the IN1808)." }
      step: { type: int, min: 1, max: 1800, required: true,
              label: Step,
              description: "Amount to raise the group master by, in tenths of a dB." }
    send: "\x1bD{group}*{step}+GRPM"
    expect: { matches: '^GrpmD\s*\d+\*[-+]?\d+$' }
    returns: ack
  decrease_group_level:
    summary: Lower a group master by a step in tenths of a dB (Esc Dg*n-GRPM)
    params:
      group: { type: int, min: 1, max: 10, required: true,
               label: Group,
               description: "Group master number; what each group controls depends on the model (see the model notes, e.g. 3 is program volume on the IN1808)." }
      step: { type: int, min: 1, max: 1800, required: true,
              label: Step,
              description: "Amount to lower the group master by, in tenths of a dB." }
    send: "\x1bD{group}*{step}-GRPM"
    expect: { matches: '^GrpmD\s*\d+\*[-+]?\d+$' }
    returns: ack
  get_group_level:
    summary: Get a group master's value in tenths of a dB (Esc DgGRPM)
    params:
      group: { type: int, min: 1, max: 10, required: true,
               label: Group,
               description: "Group master number; what each group controls depends on the model (see the model notes, e.g. 3 is program volume on the IN1808)." }
    send: "\x1bD{group}GRPM"
    expect: { matches: '^(?:GrpmD\s*\d+\*)?([-+]?\d+)$' }
    returns: value
  set_group_mute:
    summary: Mute or unmute every block in a mute group (Esc Dg*1GRPM / *0)
    params:
      group: { type: int, min: 1, max: 10, required: true,
               label: Group,
               description: "Group master number; what each group controls depends on the model (see the model notes, e.g. 3 is program volume on the IN1808)." }
      muted: { type: bool, required: true,
               label: Mute,
               description: "True mutes every block in the mute group, false unmutes them." }
    send: "\x1bD{group}*{muted:bool01}GRPM"
    expect: { matches: '^GrpmD\s*\d+\*[01]$' }
    returns: ack
  get_group_mute:
    summary: Get a mute group's state (Esc DgGRPM)
    params:
      group: { type: int, min: 1, max: 10, required: true,
               label: Group,
               description: "Group master number; what each group controls depends on the model (see the model notes, e.g. 3 is program volume on the IN1808)." }
    send: "\x1bD{group}GRPM"
    expect: { matches: '^(?:GrpmD\s*\d+\*)?([01])$' }
    returns: value
  set_dsp_gain:
    summary: Set the gain or attenuation of a DSP block by its object ID (OID), in tenths of a dB (Esc Goid*nAU); OIDs per model in the quirks
    params:
      oid: { type: int, min: 30000, max: 60011, required: true,
             label: Object ID,
             description: "DSP block object ID (OID), as listed per model in the spec's quirks." }
      level: { type: int, min: -1000, max: 800, required: true,
               label: Level,
               description: "Level in tenths of a dB, e.g. -293 for -29.3 dB; the block's own range applies." }
    send: "\x1bG{oid}*{level}AU"
    expect: { matches: '^DsG\s*\d+\*[-+]?\d+$' }
    returns: ack
  get_dsp_gain:
    summary: Get a DSP block's gain in tenths of a dB (Esc GoidAU)
    params:
      oid: { type: int, min: 30000, max: 60011, required: true,
             label: Object ID,
             description: "DSP block object ID (OID), as listed per model in the spec's quirks." }
    send: "\x1bG{oid}AU"
    expect: { matches: '^(?:DsG\s*\d+\*)?([-+]?\d+)$' }
    returns: value
  set_dsp_mute:
    summary: Mute or unmute a DSP block by its object ID (Esc Moid*1AU / *0)
    params:
      oid: { type: int, min: 30000, max: 60011, required: true,
             label: Object ID,
             description: "DSP block object ID (OID), as listed per model in the spec's quirks." }
      muted: { type: bool, required: true,
               label: Mute,
               description: "True mutes the DSP block, false unmutes it." }
    send: "\x1bM{oid}*{muted:bool01}AU"
    expect: { matches: '^DsM\s*\d+\*[01]$' }
    returns: ack
  get_dsp_mute:
    summary: Get a DSP block's mute (Esc MoidAU)
    params:
      oid: { type: int, min: 30000, max: 60011, required: true,
             label: Object ID,
             description: "DSP block object ID (OID), as listed per model in the spec's quirks." }
    send: "\x1bM{oid}AU"
    expect: { matches: '^(?:DsM\s*\d+\*)?([01])$' }
    returns: value
  set_phantom_power:
    summary: Turn 48 V phantom power on or off on mic/line input 1 (OID 40000) or 2 (40001) (Esc Zoid*1AU / *0)
    params:
      oid: { type: enum, values: ["40000", "40001"], required: true,
             label: Mic input,
             description: "Mic/line input by object ID: 40000 is input 1, 40001 input 2." }
      enabled: { type: bool, required: true,
                 label: Phantom power,
                 description: "True turns 48 V phantom power on, false off." }
    send: "\x1bZ{oid}*{enabled:bool01}AU"
    expect: { matches: '^DsZ\s*\d+\*[01]$' }
    returns: ack
  get_phantom_power:
    summary: Get whether 48 V phantom power is on for mic/line input 1 (OID 40000) or 2 (40001) (Esc ZoidAU)
    params:
      oid: { type: enum, values: ["40000", "40001"], required: true,
             label: Mic input,
             description: "Mic/line input by object ID: 40000 is input 1, 40001 input 2." }
    send: "\x1bZ{oid}AU"
    expect: { matches: '^(?:DsZ\s*\d+\*)?([01])$' }
    returns: value
  set_dsp_embedded_gain:
    summary: Set the gain of the embedded HDMI LPCM-2Ch audio on DTP input 7 (OIDs 30012, 30013) or 8 (30014, 30015), in tenths of a dB (Esc Hoid*nAU)
    params:
      oid: { type: enum, values: ["30012", "30013", "30014", "30015"], required: true,
             label: Object ID,
             description: "DTP input channel by object ID: 30012 and 30013 input 7, 30014 and 30015 input 8 (the guide's example takes 30012 as the right channel)." }
      level: { type: int, min: -1000, max: 800, required: true,
               label: Level,
               description: "Gain in tenths of a dB, e.g. 120 for +12.0 dB; the block's own range applies." }
    send: "\x1bH{oid}*{level}AU"
    expect: { matches: '^DsH\s*\d+\*[-+]?\d+$' }
    returns: ack
  get_dsp_embedded_gain:
    summary: Get the embedded audio gain of a DTP input channel in tenths of a dB (Esc HoidAU)
    params:
      oid: { type: enum, values: ["30012", "30013", "30014", "30015"], required: true,
             label: Object ID,
             description: "DTP input channel by object ID: 30012 and 30013 input 7, 30014 and 30015 input 8." }
    send: "\x1bH{oid}AU"
    expect: { matches: '^(?:DsH\s*\d+\*)?([-+]?\d+)$' }
    returns: value
  set_audio_input_name:
    summary: Name an audio input, up to 32 characters; a single space restores the default (Esc IX$*name ANAM)
    params:
      input: { type: int, min: 1, max: 15, required: true,
               label: Audio input,
               description: "1 DP 1, 2-6 HDMI 2-6, 7-8 TP 7-8, 9 Aux In, 10-11 Mic/Line 1-2, 12-13 Line In 3-4, 14-15 File Playback L and R." }
      name: { type: string, max_length: 32, pattern: '^[^,*|]+$', required: true,
              label: Name,
              description: "Name to give, without commas, asterisks or |; a single space restores the default." }
    send: "\x1bI{input}*{name}ANAM"
    expect: { matches: '^AnamI' }
    returns: ack
  get_audio_input_name:
    summary: Get an audio input's name (Esc IX$ANAM)
    params:
      input: { type: int, min: 1, max: 15, required: true,
               label: Audio input,
               description: "1 DP 1, 2-6 HDMI 2-6, 7-8 TP 7-8, 9 Aux In, 10-11 Mic/Line 1-2, 12-13 Line In 3-4, 14-15 File Playback L and R." }
    send: "\x1bI{input}ANAM"
    expect: { matches: '^(?:AnamI\s*\d+\*)?(.*)$' }
    returns: value
  set_audio_output_name:
    summary: Name an audio output, up to 32 characters; a single space restores the default (Esc OX%*name ANAM)
    params:
      output: { type: int, min: 1, max: 7, required: true,
                label: Audio output,
                description: "1 HDMI 1A, 2 TP 1B, 3 Over DTP Analog, 4-7 Line Out 1-4." }
      name: { type: string, max_length: 32, pattern: '^[^,*|]+$', required: true,
              label: Name,
              description: "Name to give, without commas, asterisks or |; a single space restores the default." }
    send: "\x1bO{output}*{name}ANAM"
    expect: { matches: '^AnamO' }
    returns: ack
  get_audio_output_name:
    summary: Get an audio output's name (Esc OX%ANAM)
    params:
      output: { type: int, min: 1, max: 7, required: true,
                label: Audio output,
                description: "1 HDMI 1A, 2 TP 1B, 3 Over DTP Analog, 4-7 Line Out 1-4." }
    send: "\x1bO{output}ANAM"
    expect: { matches: '^(?:AnamO\s*\d+\*)?(.*)$' }
    returns: value
  set_volume_knob_group:
    summary: Choose what the front panel volume knob controls, 1 program, 3 mic or 8 output volume (Esc 1*nKNOB)
    params:
      group: { type: enum, values: ["1", "3", "8"], required: true,
               label: Knob controls,
               description: "What the front panel volume knob controls: 1 program, 3 mic, 8 output volume." }
    send: "\x1b1*{group}KNOB"
    expect: { matches: '^Knob1\*\d+$' }
    returns: ack
  get_volume_knob_group:
    summary: Get the volume knob's group (Esc 1KNOB)
    send: "\x1b1KNOB"
    expect: { matches: '^(?:Knob1\*)?(\d+)$' }
    returns: value
  play_audio_file:
    summary: Play the audio file in slot 1-16; a lower priority slot than the one playing is refused (E22) (Esc slot*1PLAY)
    params:
      slot: { type: int, min: 1, max: 16, required: true,
              label: Slot,
              description: "Audio file slot, 1 to 16; a slot of lower priority than the one playing is refused." }
    send: "\x1b{slot}*1PLAY"
    expect: { matches: '^Play\s*\d+\*1$' }
    returns: ack
  stop_audio_file:
    summary: Stop the audio file in a slot (Esc slot*0PLAY)
    params:
      slot: { type: int, min: 1, max: 16, required: true,
              label: Slot,
              description: "Audio file slot, 1 to 16." }
    send: "\x1b{slot}*0PLAY"
    expect: { matches: '^Play\s*\d+\*0$' }
    returns: ack
  get_playing_audio_file:
    summary: Get the slot playing, 0 when none (Esc PLAY)
    send: "\x1bPLAY"
    expect: { matches: '^(?:Play)?0*(\d+)(?:\*[01])?$' }
    returns: value

  # ── Advanced (IN1808 p.78-79; IN1608 p.60-62) ───────────────────────────
  set_test_pattern:
    summary: "Show a test pattern on the output: 0 off, 1 crop, 2 alternating pixels, 3 crosshatch, 4 color bars, 5 grayscale, 6 audio test (pink noise) (Esc 1*nTEST)"
    params:
      pattern: { type: int, min: 0, max: 6, required: true,
                 label: Test pattern,
                 description: "0 off, 1 crop, 2 alternating pixels, 3 crosshatch, 4 color bars, 5 grayscale, 6 audio test (pink noise)." }
    send: "\x1b1*{pattern}TEST"
    expect: { matches: '^Test1\*\d+$' }
    returns: ack
  get_test_pattern:
    summary: Get the test pattern (Esc 1TEST)
    send: "\x1b1TEST"
    expect: { matches: '^(?:Test1\*)?0*(\d+)$' }
    returns: value
  set_test_pattern_in1600:
    summary: "Show a test pattern: 0 none, 1 crop, 2 alternating pixels, 3 color bars, 4 grayscale, 5 blue mode, 6 audio test (Esc nTEST)"
    params:
      pattern: { type: int, min: 0, max: 6, required: true,
                 label: Test pattern,
                 description: "0 none, 1 crop, 2 alternating pixels, 3 color bars, 4 grayscale, 5 blue mode, 6 audio test." }
    send: "\x1b{pattern}TEST"
    expect: { matches: '^Test\s*\d+$' }
    returns: ack
  get_test_pattern_in1600:
    summary: Get the test pattern (Esc TEST)
    send: "\x1bTEST"
    expect: { matches: '^(?:Test\s*)?0*(\d+)$' }
    returns: value
  set_switch_effect:
    summary: "Set the input switch effect: 0 cut through black, 1 fade through black, 2 seamless fade, 3 seamless cut (Esc O1*nSWEF)"
    params:
      effect: { type: int, min: 0, max: 3, required: true,
                label: Switch effect,
                description: "0 cut through black, 1 fade through black, 2 seamless fade, 3 seamless cut." }
    send: "\x1bO1*{effect}SWEF"
    expect: { matches: '^SwefO1\*[0-3]$' }
    returns: ack
  get_switch_effect:
    summary: Get the switch effect (Esc O1SWEF)
    send: "\x1bO1SWEF"
    expect: { matches: '^(?:SwefO1\*)?([0-3])$' }
    returns: value
  set_switch_effect_in1600:
    summary: Set the switch effect, 0 cut or 1 fade through black (Esc nSWEF)
    params:
      effect: { type: int, min: 0, max: 1, required: true,
                label: Switch effect,
                description: "0 cut, 1 fade through black." }
    send: "\x1b{effect}SWEF"
    expect: { matches: '^Swef[01]$' }
    returns: ack
  get_switch_effect_in1600:
    summary: Get the switch effect (Esc SWEF)
    send: "\x1bSWEF"
    expect: { matches: '^(?:Swef)?([01])$' }
    returns: value
  get_signal_status:
    summary: Get every input's video signal presence as "1*0*..." (Esc 0LS)
    send: "\x1b0LS"
    expect: { matches: '^I[Nn]00\s*([01](?:\*[01])*)$' }
    returns: value
  set_front_panel_lock:
    summary: "Lock the front panel: 0 off, 1 complete, 2 switching and volume (IN1808 also logos), 3 switching and logos (IN1808), 4 volume only (IN1808) (nX)"
    params:
      mode: { type: int, min: 0, max: 4, required: true,
              label: Lock mode,
              description: "0 off, 1 complete, 2 switching and volume (IN1808 also logos), 3 switching and logos (IN1808), 4 volume only (IN1808)." }
    send: "{mode}X"
    expect: { matches: '^Exe[0-4]$' }
    returns: ack
  get_front_panel_lock:
    summary: Get the front panel lock mode (X)
    send: "X"
    expect: { matches: '^(?:Exe)?([0-4])$' }
    returns: value
  set_output_hdcp_mode:
    summary: "Set an output's HDCP mode: 0 off, 1 follow input, 2 always encrypt (10 s of retries), 3 follow, 4 encrypt (continuous retries) (Esc SX@*nHDCP)"
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
      mode: { type: int, min: 0, max: 4, required: true,
              label: HDCP mode,
              description: "0 off, 1 follow input, 2 always encrypt (10 s of retries), 3 follow, 4 encrypt (continuous retries)." }
    send: "\x1bS{output}*{mode}HDCP"
    expect: { matches: '^HdcpS\s*\d+\*[0-4]$' }
    returns: ack
  get_output_hdcp_mode:
    summary: Get an output's HDCP mode (Esc SX@HDCP)
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
    send: "\x1bS{output}HDCP"
    expect: { matches: '^(?:HdcpS\s*\d+\*)?([0-4])$' }
    returns: value
  set_output_hdcp_mode_in1600:
    summary: "Set the HDMI outputs' HDCP mode: 0 encrypt when required, 1 always, 2 and 3 the same for DVI sinks that drop to green screen, 4 never (Esc SnHDCP)"
    params:
      mode: { type: int, min: 0, max: 4, required: true,
              label: HDCP mode,
              description: "0 encrypt when required, 1 always, 2 and 3 the same for DVI sinks that drop to green screen, 4 never." }
    send: "\x1bS{mode}HDCP"
    expect: { matches: '^HdcpS\s*[0-4]$' }
    returns: ack
  get_output_hdcp_mode_in1600:
    summary: Get the HDCP mode (Esc SHDCP)
    send: "\x1bSHDCP"
    expect: { matches: '^(?:HdcpS\s*)?([0-4])$' }
    returns: value
  set_hdcp_notification:
    summary: "Set what a non-HDCP display shows for HDCP content: 0 black, 1 green screen with message, 2 user image (Esc N1*nHDCP)"
    params:
      mode: { type: int, min: 0, max: 2, required: true,
              label: HDCP notification,
              description: "What a non-HDCP display shows for HDCP content: 0 black, 1 green screen with message, 2 user image." }
    send: "\x1bN1*{mode}HDCP"
    expect: { matches: '^HdcpN1\*[0-2]$' }
    returns: ack
  get_hdcp_notification:
    summary: Get the HDCP notification mode (Esc N1HDCP)
    send: "\x1bN1HDCP"
    expect: { matches: '^(?:HdcpN1\*)?([0-2])$' }
    returns: value
  set_hdcp_notification_in1600:
    summary: Show a green screen (true) or mute to black (false) on a non-HDCP display for HDCP content (Esc N1HDCP / N0HDCP)
    params:
      enabled: { type: bool, required: true,
                 label: Green screen,
                 description: "True shows a green screen on a non-HDCP display for HDCP content, false mutes it to black." }
    send: "\x1bN{enabled:bool01}HDCP"
    expect: { matches: '^HdcpN[01]$' }
    returns: ack
  get_hdcp_notification_in1600:
    summary: Get whether the HDCP notification is on (Esc NHDCP)
    send: "\x1bNHDCP"
    expect: { matches: '^(?:HdcpN)?([01])$' }
    returns: value
  get_input_hdcp_status:
    summary: "Get an input's HDCP status (Esc IX!HDCP): IN1808 0 no source, 1 no HDCP, 2 HDCP; IN1608 0 no source, 1 HDCP, 2 no HDCP"
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1bI{input}HDCP"
    expect: { matches: '^(?:HdcpI\s*\d+\*)?([0-2])$' }
    returns: value
  get_output_hdcp_status:
    summary: Get an output's HDCP status (Esc OX@HDCP), coded as for inputs
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
    send: "\x1bO{output}HDCP"
    expect: { matches: '^(?:HdcpO\s*\d+\*)?([0-2])$' }
    returns: value

  # ── Information (IN1808 p.83-84; IN1608 p.63-64) ────────────────────────
  get_input_info:
    summary: Get an input's signal type, audio and video mute and frequencies, as the unit reports them (X!*I)
    params:
      input: { type: int, min: 1, max: 9, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel; 9 is the IN1808's aux audio input." }
    send: "{input}*I"
    expect: { matches: '^(?:Inf00\*)?(Vid.*)$' }
    returns: value
  get_info_in1600:
    summary: Get the current video and audio inputs, signal type, standard, mute and frequencies, as the unit reports them (I)
    send: "I"
    expect: { matches: '^(Vid.*)$' }
    returns: value
  get_model_name:
    summary: Get the model name (1I)
    send: "1I"
    expect: { matches: '^(?:Inf01\*)?(.+)$' }
    returns: value
  get_firmware:
    summary: Get the firmware version (Q)
    send: "Q"
    expect: { matches: '^(?:Ver01\*)?(\d+\.\d+)$' }
    returns: value
  get_firmware_full:
    summary: Get the firmware version with its build number (*Q)
    send: "*Q"
    expect: { matches: '^(?:Bld)?(\d+\.\d+\.\d+)$' }
    returns: value
  get_part_number:
    summary: Get the part number, such as 60-1615-01 (N)
    send: "N"
    expect: { matches: '^(?:Pno)?(60-\d+-\d+)$' }
    returns: value
  get_temperature:
    summary: Get the internal temperature in degrees Celsius (Esc 20STAT)
    send: "\x1b20STAT"
    expect: { matches: '^(?:20Stat\s*)?0*(\d+)$' }
    returns: value
  set_verbose_mode:
    summary: "Set the verbose mode: 0 none, 1 verbose, 2 tagged replies, 3 both (Esc nCV); state needs 3, which is set on connecting"
    params:
      mode: { type: int, min: 0, max: 3, required: true,
              label: Verbose mode,
              description: "0 none, 1 verbose, 2 tagged replies, 3 both; state needs 3, which is set on connecting." }
    send: "\x1b{mode}CV"
    expect: { matches: '^Vrb[0-3]$' }
    returns: ack
  get_verbose_mode:
    summary: Get the verbose mode (Esc CV)
    send: "\x1bCV"
    expect: { matches: '^(?:Vrb)?([0-3])$' }
    returns: value

quirks:
  - models: [all]
    severity: warning
    text: >
      In verbose mode 3 the unit tags its replies and reports changes made from the front panel, PCS and other
      connections in the same form as replies (IN1808 guide p.59, IN1608 guide p.42). A change report that
      arrives while a command is waiting for its reply can be taken as that reply; the command's expect
      pattern then fails it, or, when the shapes agree, accepts the wrong report. State is updated from both
      either way. The core sets verbose mode 3 on connecting; set_verbose_mode with another value stops the
      change reports and the tagged forms the state rules read.
  - models: [all]
    severity: info
    text: >
      Telnet connections close after 5 minutes without traffic (port timeout 30 x 10 s by default, IN1808
      guide p.85); the core's liveness query (Q) keeps the session open. A password-protected unit sends
      "Password:" after the copyright banner and repeats it after a wrong password; the factory password is
      the unit's serial number, and a factory reset clears it (IN1808 guide p.53, IN1608 guide p.43).
  - models: [all]
    severity: warning
    text: >
      Simple commands (1*3!, 2B, 1X) need no terminator, Esc commands end with CR (IN1808 guide p.55); every
      command here is sent with a CR after it, which the unit ignores after a simple command. Commands the
      unit does not recognise are ignored without a reply (IN1808 guide p.55), so they time out.
  - models: [in1808-series]
    severity: info
    text: >
      Replies pad numbers with zeros (inputs to two digits, levels to three or four); the expect patterns and
      state rules read them as numbers. The tagged forms printed in the guide (In X!*1 All, VnamIX!*name,
      Inf00*...) are followed loosely: spaces and zero padding are optional in every pattern.
  - models: [in1808-series]
    severity: info
    text: >
      DSP object IDs (IN1808 guide p.88): line input gain 30000-30017 (two per input, DisplayPort 1 to aux),
      mic/line inputs 40000-40003, file player 40004-40005, output attenuation 60000-60011 (HDMI, DTP2/XTP/HDBT,
      DTP analog, line outputs 1-4, amplifier). Gains are in tenths of a dB within each block's range. DTP
      inputs 7 and 8 take their embedded HDMI audio gain with H in place of G (p.92: set_dsp_embedded_gain),
      G there being the over-DTP analog audio. Every OID listed is read on connecting.
  - models: [in1608-series]
    severity: info
    text: >
      DSP control numbers (IN1608 guide p.57): 40100 and 40101 mic 1 and 2 mix volume, 40000 and 40001 mic 1
      and 2 mute, 60000 and 60002 outputs 1 and 2, 60004-60005 variable, 60006-60007 digital and 60008-60009
      amplified outputs; levels -1000 to 0 in tenths of a dB. Audio breakaway is refused (E17) to or from an
      input set to a digital audio format (p.50).
  - models: [all]
    severity: critical
    text: >
      recall_input_preset and recall_user_preset replace the picture (and on IN1608 user presets audio gain)
      settings of the current input at once, on air. set_power_save 1 or 2 on IN1808 turns off twisted-pair
      remote power and over-TP functions or the output video. set_video_mute_all and a set_front_panel_lock
      mode of 1 take the whole output or the whole panel away from the room until they are undone.
  - models: [all]
    severity: info
    text: >
      Input names are up to 32 characters on IN1808 and 16 on IN1608 and may not contain a comma, * or |;
      a single space restores the default name (IN1808 guide p.63, IN1608 guide p.51).
  - models: [all]
    severity: info
    text: >
      The scaler pushes "IN00 1*0*..." on every sync change, one digit per input (IN1808 guide p.53), and
      HdcpI / HdcpO on HDCP changes; these keep inputs.*.signal and the HDCP state current. Reconfig and HplgO
      carry no state. The IN1606/IN1608 guide documents the 0LS reply and its "In00" tagged form (p.62) but
      not the unsolicited signal message.
  - models: [all]
    severity: info
    text: >
      Every setting is read once on connecting, after the unit answers the part number query (N): about
      225 queries on an IN1806/IN1808 and 140 on an IN1606/IN1608, one at a time behind any command, so the
      state fills over a few seconds. get_part_number queues them again. An IN1806 or IN1606 is asked about
      inputs 7 and 8 too and answers those with an error. After that, verbose mode 3's change reports keep
      the state current; an input switch (IN1608 picture controls follow the current input), an input or
      user preset recall and an Auto-Image are followed by a re-read of the picture and image settings they
      change, which the unit does not report one by one.
  - models: [in1608-series]
    severity: info
    text: >
      API limits: the custom screen saver color (Esc C SSAV) has no query, so screen_saver.color holds the
      color the unit last reported setting, from this or another connection, and is unknown until then.
      The current-input picture queries (Esc CONT, BRIT, HDET, COLR, TINT) name no input; state takes their
      values from the tagged replies of verbose mode 3 (Cont3*060), and a bare reply is not assigned. Detail,
      image position and size, freeze, color and tint are readable for the current input only.
  - models: [all]
    severity: info
    text: >
      Model-specific numbering: group masters are 1-10 on IN1808 and 1-8 on IN1608, with different meanings
      (see each model's notes), and HDCP status 1 and 2 mean the opposite on the two families (IN1808 guide
      p.79: 1 no HDCP, 2 HDCP; IN1608 guide p.61: 1 HDCP, 2 no HDCP). State keeps the numbers as sent.

state:
  device.model:                 { type: string, description: "Model from the copyright banner, such as IN1808 IPCP SA" }
  device.firmware:              { type: string, description: "Firmware version from the copyright banner" }
  device.part_number:           { type: string, description: "Part number from the copyright banner or the N query, such as 60-1615-02" }
  device.login:                 { type: string, description: "Access level granted at login: Administrator or User" }
  input:                        { type: int, description: "Input whose video and audio go to the output (In X! All), numbered from 1" }
  video_input:                  { type: int, description: "Input whose video goes to the output, numbered from 1" }
  audio_input:                  { type: int, description: "Input whose audio goes to the output, numbered from 1; 9 is the IN1808 aux input" }
  loop_out_input:               { type: int, description: "Input on the IN1808 loop output" }
  outputs.*.video_mute:         { type: int, description: "Video mute of an output: 0 unmuted, 1 video muted to black, 2 video and sync muted" }
  outputs.*.name:               { type: string, description: "Output name (IN1808)" }
  outputs.*.hdcp_status:        { type: int, description: "Output HDCP status as the unit codes it (see quirks)" }
  outputs.*.hdmi_format:        { type: int, description: "HDMI output format and colour space code, 0 auto (see set_hdmi_output_format)" }
  outputs.*.hdcp_mode:          { type: int, description: "IN1808 output HDCP mode 0-4 (see set_output_hdcp_mode)" }
  video_mute_all:               { type: int, description: "IN1608: 0 every output unmuted, 1 at least one muted, 2 at least one with sync off; either family: the mute last set on every output at once" }
  inputs.*.name:                { type: string, description: "Input name" }
  inputs.*.signal:              { type: bool, description: "Video signal present on the input" }
  inputs.*.audio_format:        { type: int, description: "Audio input format 0-5 (see set_audio_input_format)" }
  inputs.*.hdcp_status:         { type: int, description: "Input HDCP status as the unit codes it (see quirks)" }
  inputs.*.hdcp_authorized:     { type: bool, description: "HDCP content allowed on the input" }
  inputs.*.aspect_ratio:        { type: int, description: "1 fill, 2 follow" }
  inputs.*.film_mode:           { type: bool, description: "3:2, 2:2 and 24:1 film mode detection on (auto)" }
  inputs.*.auto_memory:         { type: bool, description: "Auto Memory on: per-signal input presets saved and recalled automatically" }
  inputs.*.auto_image:          { type: bool, description: "IN1608: Auto-Image runs automatically on the input" }
  inputs.*.detected_format:     { type: int, description: "IN1808: digital format detected on the input, 0 no signal, 1 DVI, 2 HDMI, 3 DisplayPort" }
  inputs.*.video_format:        { type: int, description: "IN1608: the input's video format setting, 1 RGB, 2 YUV, 3 RGBcvS, 4 S-video, 5 composite, 6 HDMI" }
  inputs.*.contrast:            { type: int, description: "Contrast 0-127" }
  inputs.*.brightness:          { type: int, description: "Brightness 0-127" }
  inputs.*.detail:              { type: int, description: "IN1608: detail filter 0-127" }
  inputs.*.color:               { type: int, description: "IN1608: color level 0-127 (NTSC, PAL and SECAM inputs)" }
  inputs.*.tint:                { type: int, description: "IN1608: tint 0-127 (NTSC inputs)" }
  detail:                       { type: int, description: "IN1808: detail (sharpness) of the current input, 0-127" }
  image.horizontal:             { type: int, unit: px, description: "Horizontal position of the scaled image; negative is left" }
  image.vertical:               { type: int, unit: px, description: "Vertical position of the scaled image; negative is up" }
  image.width:                  { type: int, unit: px, description: "Width of the scaled image" }
  image.height:                 { type: int, unit: px, description: "Height of the scaled image" }
  groups.*.value:               { type: int, description: "Group master value as sent: tenths of a dB for a volume, bass or treble group, 0 or 1 for a mute group" }
  dsp.*.gain:                   { type: int, description: "Gain or attenuation of a DSP block, keyed by object ID, in tenths of a dB" }
  dsp.*.mute:                   { type: bool, description: "Mute of a DSP block, keyed by object ID" }
  dsp.*.phantom_power:          { type: bool, description: "IN1808: 48 V phantom power on mic/line input 40000 or 40001" }
  dsp.*.embedded_gain:          { type: int, description: "IN1808: embedded HDMI audio gain of a DTP input channel (30012-30015), in tenths of a dB" }
  audio_inputs.*.name:          { type: string, description: "IN1808: audio input name, 1-15 as for set_audio_input_name" }
  audio_outputs.*.name:         { type: string, description: "IN1808: audio output name, 1-7 as for set_audio_output_name" }
  freeze:                       { type: bool, description: "Output (IN1808) or current input (IN1608) frozen" }
  front_panel_lock:             { type: int, description: "Front panel lock mode (0 off)" }
  power_save:                   { type: int, description: "Power save mode (0 full power)" }
  output_rate:                  { type: int, description: "Output rate code from the guide's table" }
  test_pattern:                 { type: int, description: "Test pattern code (0 off)" }
  switch_effect:                { type: int, description: "Switch effect code" }
  auto_switch_mode:             { type: int, description: "Auto-input switch mode (0 manual)" }
  auto_switch_timeout:          { type: int, unit: s, description: "IN1808: seconds without video before auto-input switching moves on" }
  auto_switch_priority:         { type: string, description: "IN1808: user priority order, input numbers highest first, separated by spaces" }
  auto_image_threshold:         { type: int, description: "IN1608: luminosity Auto-Image takes as active video, 0-100" }
  overscan.*:                   { type: int, description: "IN1608: overscan of an input video format (1-6), 0 0%, 1 2.5%, 2 5%" }
  hdcp_mode:                    { type: int, description: "IN1608: HDCP mode of the HDMI outputs, 0-4 (see set_output_hdcp_mode_in1600)" }
  hdcp_notification:            { type: int, description: "What a non-HDCP display shows for HDCP content: IN1808 0 black, 1 green screen, 2 user image; IN1608 0 black, 1 green screen" }
  osd_duration:                 { type: int, unit: s, description: "Seconds the OSD menu (IN1808) or input bug (IN1608) shows; IN1608 0 never, 501 always" }
  screen_saver.mode:            { type: int, description: "What the output shows with no active input: IN1808 1 black, 2 blue, 3 user image; IN1608 0 custom color, 1 black, 2 blue" }
  screen_saver.timeout:         { type: int, unit: s, description: "Seconds without an active input before output sync is disabled; 501 never" }
  screen_saver.status:          { type: int, description: "0 active input, 1 no input and the timer running, 2 timer expired and sync disabled" }
  screen_saver.color:           { type: string, description: "IN1608: custom screen saver color as six hex digits, as the unit last reported it (no query exists)" }
  volume_knob_group:            { type: int, description: "IN1608: group the front panel volume knob controls, 1 program, 3 mic, 8 output" }
  verbose_mode:                 { type: int, description: "Verbose mode 0-3 (3 set on connecting)" }
  audio_playback_slot:          { type: int, description: "Audio file slot last reported playing (IN1808); 0 none" }
  audio_playing:                { type: bool, description: "The slot in audio_playback_slot is playing" }

telemetry:
  # Verbose mode 3 (set on connecting) makes the unit report every change, from any source, in the
  # tagged form of a reply, and tag the replies to queries, so the same rules read both. Rules with
  # request_match also read a query's bare reply, tied to the query it answers. Signal presence is
  # read on connecting, and changes to it are pushed (IN1808 guide p.53). N (the part number) is
  # asked by both families; its reply queues the family's own queries for every other setting.
  poll:
    send: ["\x1b0LS", "X", "\x1bPSAV", "N"]
  updates:
    # The copyright banner sent on connecting (IN1808 guide p.52, IN1608 guide p.42).
    - match: '^\(c\) Copyright \d{4}, Extron Electronics,? (.+?), V(\d+\.\d+), (60-\d+-\d+)$'
      state: { device.model: "{1}", device.firmware: "{2}", device.part_number: "{3}" }
    - match: '^Login (Administrator|User)$'
      state: { device.login: "{1}" }
    # Every setting the commands write, read on connecting: one query per setting, input, output,
    # group and DSP block the family's guide documents.
    - models: [in1808-series]
      match: '^(?:Pno)?(60-\d+-\d+)$'
      request_match: '^N$'
      state: { device.part_number: "{1}" }
      then_send: [
        "1!", "1%", "1$", "\x1bLOUT", "\x1bI1VNAM", "\x1bE1HDCP", "\x1b1ASPR", "\x1b1FILM", "\x1b1CONT",
        "\x1b1BRIT", "\x1b1AMEM", "\x1bI1AFMT", "\x1bI1HDCP", "1*\\", "\x1bI2VNAM", "\x1bE2HDCP", "\x1b2ASPR",
