spec: 1
id: extron-switcher
name: Extron IN-series scaling presentation switchers (IN1806, IN1808, IN1606, IN1608, IN1604)
vendor: Extron
category: switcher

# Extron's Simple Instruction Set (SIS) as the IN-series scaling presentation
# switchers speak it over Telnet (TCP 23). The two current families share the
# SIS grammar but not every command: the IN1806/IN1808 address picture
# controls by input and the output by number (1*), while the IN1606/IN1608
# adjust the current input. Commands whose syntax differs are separate
# commands, the IN1606/IN1608 forms ending in _current_input or _in1600, and
# each model supports only the forms its own guide documents. The IN1604 DTP
# and IN1604 HD share most IN1606/IN1608 forms; where their syntax or values
# differ, the IN1604 form ends in _in1604. Page numbers are the guides' printed
# page numbers. Every model speaks the same SIS on its rear RS-232 Remote
# port, so a unit is reached over Telnet or on a serial port of the host,
# chosen by the link setting (transport.serial). The IN1604 has RS-232 and
# USB ports only: link serial is its default, and link tcp reaches it
# through a serial-to-Ethernet interface's raw TCP port (see the quirks).
#
# Every setting a command here writes is read back into state: on connecting
# (the part number query N is answered, and each family's rule then queues
# that family's queries), from the tagged replies and change reports of
# verbose mode 3, and by re-reads after an input switch, a preset recall and
# an Auto-Image, which change settings the unit does not report one by one.
#
# Not here, on the IN1806/IN1808 and IN1606/IN1608: EDID import/export and
# assignment, logos and audio files (file names on the unit), preset names,
# CEC, serial port and IP settings, unit name, passwords, firmware,
# backup/restore and resets (Esc ZXXX/ZQQQ/ZY reset settings or the network
# and passwords), pixel-level analog input timing (HSRT, VSRT, PHAS, TPIX,
# APIX, ALIN on IN1606/IN1608), DTP remote power and twisted-pair format
# (wrong DTP2 power can damage a DTP endpoint, IN1808 guide p.80). On the
# IN1604, whose EDID assignment, analog timing, preset names and unit name are
# here: binary EDID import and export (no SIS command in its guide) and the
# factory reset (Esc ZXXX).
source:
  - title: "IN1806 and IN1808 Series Scaling Presentation Switchers User Guide, 68-3131-01 Rev. B"
    author: Extron Electronics
    url: https://media.extron.com/public/download/files/userman/68-3131-01_B_IN1806-1808_UG.pdf
    note: >
      Manufacturer document. SIS chapter p.52-93: host communication (no start or end characters, CR LF
      after every response), copyright message and part numbers p.52; Password prompt, serial-number
      factory password, Login Administrator / Login User, prompt repeated on a wrong password p.53;
      scaler-initiated messages (Reconfig, HplgO, HdcpI, HdcpO, IN00 signal list) p.53; error codes p.54;
      symbols (| for CR, W for Esc) and variables p.55-62, verbose mode 0-3 and tagged responses p.59;
      input selection 1!, 1%, 1$, views, input format and names, loop out p.63; Auto-Image p.64; HDCP
      authorized, aspect ratio, film mode p.65; auto-input switching p.66; freeze p.66; contrast,
      brightness, detail, image position and size p.67-68; output video mute, output rate and names
      p.69; HDMI output format and power save p.70; screen saver and OSD duration p.71; input presets
      and auto memories p.74; audio input format p.75; audio names and file playback p.76-77; test pattern,
      switch effect, signal presence, front panel lock p.78; HDCP output mode, notification and status
      p.79; information requests, temperature, verbose mode p.83-84; port timeout p.85; group masters
      (groups 1-10, 0.1 dB units) p.88-90; DSP gain, mute and phantom power by OID p.91-92.
  - title: "IN1606 and IN1608 Series Scaling Presentation Switchers User Guide, 68-2290-01 Rev. J"
    author: Extron Electronics
    url: https://media.extron.com/public/download/files/userman/IN1606-1608_UG_68-2290-01_J.pdf
    note: >
      Manufacturer document. SIS chapter p.42-65: host communication, scaler-initiated messages (In X!
      All on a front panel switch, Reconfig, HplgO) and copyright message p.42; password prompt and Login
      replies p.43; error codes p.43; symbols and variables p.44-49; input selection X!!, X!&, X!$ and
      views, auto switch mode p.50; input video format, EDID, input names (NI, 16 characters) p.51;
      Auto-Image and threshold p.52; film mode p.53; output and all-output video mute, color, tint,
      contrast, brightness p.54; detail, image position and size p.55; output rate, HDMI output format,
      power save, screen saver p.56; audio input format, DSP gain and mute by control number p.57;
      volume knob, group volume, mute, bass and treble p.58; user and input presets, auto memories p.59;
      test pattern, freeze, switch effect, aspect ratio, front panel lock p.60; overscan, HDCP notification,
      status and authorization p.61; HDCP mode and signal presence p.62; OSD duration and verbose mode
      p.63; information requests p.64.
  - title: "IN1604 DTP and IN1604 HD Scalers User Guide, 68-2631-01 Rev. B"
    author: Extron Electronics
    url: https://media.extron.com/public/download/files/userman/68-2631-01_B.pdf
    note: >
      Manufacturer document. RS-232 (9600 baud, 1 stop bit, no parity, no
      flow control, not adjustable) and front USB ports only p.5 and p.29;
      SIS chapter p.29-48: no start or end characters, CR LF after every
      response, scaler-initiated messages (In X All, Reconfig, HplgO) and
      error codes p.29; symbols (inputs 1 VGA, 2-4 HDMI/DVI; video formats
      1-5; picture 0-127; position and size; test patterns 0-7; presets
      1-16; screen saver; verbose mode 1 the default for RS-232 and USB)
      p.30-33; EDID and output rate codes (0 automatic, 10-53 by resolution
      and rate, 201-205 custom) p.34; input selection, video format, EDID,
      Auto-Image and threshold p.35; analog timing (HSRT, VSRT, PHAS, TPIX)
      p.36; APIX, ALIN, film mode, HDCP authorization and status p.37;
      contrast, brightness, detail, color, tint, auto memories p.38; image
      shift, size and XIMG p.39; user and input presets, delete and names
      p.40; output format (VTPO), power save, screen saver p.41; video mute
      and output rate p.42; audio mute, input format, gain p.43; volume,
      audio output format, test pattern, freeze p.44; aspect ratio, front
      panel lockout, overscan, signal presence p.45; auto switch, switch
      effect, HDCP mode and notification, contact AV mute (MUTM) p.46; OSD
      menu emulation, reset, verbose mode, unit name p.47; information,
      firmware, part number, temperature, description, TP format (DTP
      only, read-only) p.48.
  - title: "IPL T S Series User Guide, 68-1218-01 Rev. G"
    author: Extron Electronics
    url: https://media.extron.com/public/download/files/userman/68-1218-01_G_IPL_T_S_Series_UG.pdf
    note: >
      Manufacturer document, for reaching an RS-232-only scaler over the
      network: direct port access on TCP 2001 (COM1) to 2006, no password,
      data passed both ways unprocessed p.47.
  - title: Bitfocus Companion modules extron-dxp and extron-mmx-tcp (MIT)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-extron-dxp
    note: >
      Community code, read for corroboration only (top-level LICENSE is MIT; no code copied): answers the
      "Password:" prompt with the password and CR, and ends every command with a line ending.

transport:
  type: line-tcp
  port: 23
  framing: terminated
  # Simple commands need no terminator; Esc commands end with CR or |. Every
  # command here is sent with a CR, as in extron-matrix (see the quirks).
  terminator: cr
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  # The same SIS on the rear Remote RS-232 port (3-pole captive screw): IN1808
  # guide p.13, p.52 and p.61 (9600 8N1 default, no flow control; Esc...CP sets
  # 300 to 115200 baud, odd, even or no parity, 7 or 8 data bits); IN1608
  # guide p.18 and p.42 (9600, 1 stop bit, no parity, no flow control; the
  # rate is changed on the front panel, p.39); IN1604 guide p.10 and p.29
  # (9600, 1 stop bit, no parity, no flow control, not adjustable).
  serial:
    serial_only: [in1604-dtp, in1604-hd]
    baud_rate: { default: 9600, values: [300, 600, 1200, 1800, 2400, 3600, 4800, 7200, 9600, 14400, 19200, 28800, 38400, 57600, 115200] }
    data_bits: { default: 8, values: [7, 8] }
    parity: { default: none, values: [none, odd, even] }
    stop_bits: 1
    flow_control: none
  # Every response shape the commands here can get; the banner, its date line,
  # "Password:", "Login ...", "Reconfig" and "HplgO" never match.
  # A bare value (a query answered in verbose mode 0 or 1 form) starts with a digit or a sign.
  reply_match: '^(E\d\d$|In|Vmt|Exe|Frz|Img|Cont|Brit|Hdet|Colr|Tint|Hctr|Vctr|Hsiz|Vsiz|Ximg|Rate|Vtpo|Psav|Swef|Aspr|Ausw|Afmt|Anam|Alvl|Oscn|Grpm|Hsrt|Vsrt|Phas|Tpix|Apix|Alin|Edid|Aud|Vol|Amt|Mutm|Menu|Ipn|Pnam|Hdbt|SCAL|Ds[GMZH]|Knob|\dRpr|\dSpr|Prst|Pnam|Amem|Test|Hdcp|Lout|Vnam|Nmi|Nam|Mdur|Ssav|Play|Vrb|Ver|Bld|Pno|Inf|Vid|20Stat|Film|Typ|Vtyp|\d|[-+]\d)'
  # Q (firmware version) keeps the Telnet session from timing out (5 minutes by default).
  probe: "Q"

settings:
  # Administrator or user password; empty for a unit without passwords. The factory password is the unit's
  # serial number (IN1808 guide p.53, IN1608 guide p.43).
  password: { type: string, secret: true, default: "", max_length: 128, pattern: '^[^|/\\* ]*$',
              label: Password,
              description: "Administrator or user password; empty for a unit without passwords (the factory password is the unit's serial number)." }

on_connect:
  # Over Telnet only: no guide documents a password prompt on the serial port.
  - when_set: password
    link: tcp
    after_prompt: "Password:"
    send: "{settings.password}"
    refused: '^Password:?$'
    accepted: '^Login (Administrator|User)$'
  # Verbose mode 3: tagged replies and change reports from the front panel and other connections
  # (IN1808 guide p.59 and p.84, IN1608 guide p.63). Telnet connections start in mode 0, RS-232 and USB
  # ones in mode 1 (IN1808 p.59, IN1608 p.63, IN1604 p.47), so it is sent on either link. Answered "Vrb3".
  - send: "\x1b3CV"
    await_reply: true

maps:
  osd_key: { toggle: M, open: A, exit: X, enter: E, up: U, down: D, left: L, right: R }

ports:
  - { port: 23, protocol: tcp, role: control, when: "link tcp" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "The rear Remote RS-232 port, 3-pole captive screw; the front USB configuration port carries SIS too" }
  - { port: null, protocol: tcp, role: control, when: "model in1604-dtp or in1604-hd with link tcp", note: "RS-232 only: the raw TCP port of the serial-to-Ethernet interface the scaler's RS-232 port is wired to (an Extron IPL T S's direct port access, 2001 for COM1), given when the device is opened" }

