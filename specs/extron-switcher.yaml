    expect: { matches: '^(?:Cont\s*\d+\*)?0*(\d+)$' }
    returns: value
  set_brightness:
    summary: Set an input's brightness, 0-127 (64 default) (Esc X!*nBRIT)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      level: { type: int, min: 0, max: 127, required: true,
               label: Brightness,
               description: "Brightness of the input, 0 to 127; 64 is the default." }
    send: "\x1b{input}*{level}BRIT"
    expect: { matches: '^Brit\s*\d+\*\d+$' }
    returns: ack
  get_brightness:
    summary: Get an input's brightness (Esc X!BRIT)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}BRIT"
    expect: { matches: '^(?:Brit\s*\d+\*)?0*(\d+)$' }
    returns: value
  set_detail:
    summary: Set the detail (sharpness) of the current input, 0-127 (Esc 1*nHDET)
    params:
      level: { type: int, min: 0, max: 127, required: true,
               label: Detail,
               description: "Detail (sharpness) of the current input, 0 to 127." }
    send: "\x1b1*{level}HDET"
    expect: { matches: '^Hdet1\*\d+$' }
    returns: ack
  get_detail:
    summary: Get the detail of the current input (Esc 1HDET)
    send: "\x1b1HDET"
    expect: { matches: '^(?:Hdet1\*)?0*(\d+)$' }
    returns: value
  set_image_position:
    summary: "Set the image's position and size at once: horizontal -4096..4096, vertical -2400..2400, width 10-8192, height 10-4800 (Esc 1,h*v*w*hXIMG)"
    params:
      horizontal: { type: int, min: -4096, max: 4096, required: true,
                    label: Horizontal position,
                    description: "Horizontal position of the image in pixels; negative moves it left." }
      vertical: { type: int, min: -2400, max: 2400, required: true,
                  label: Vertical position,
                  description: "Vertical position of the image in pixels; negative moves it up." }
      width: { type: int, min: 10, max: 8192, required: true,
               label: Width,
               description: "Image width in pixels." }
      height: { type: int, min: 10, max: 4800, required: true,
                label: Height,
                description: "Image height in pixels." }
    send: "\x1b1,{horizontal}*{vertical}*{width}*{height}XIMG"
