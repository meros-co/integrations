spec: 1
id: extron-switcher
name: Extron IN-series scaling presentation switchers (IN1806, IN1808, IN1606, IN1608)
vendor: Extron
category: switcher

# Extron's Simple Instruction Set (SIS) as the IN-series scaling presentation
# switchers speak it over Telnet (TCP 23). The two current families share the
# SIS grammar but not every command: the IN1806/IN1808 address picture
# controls by input and the output by number (1*), while the IN1606/IN1608
# adjust the current input. Commands whose syntax differs are separate
# commands, the IN1606/IN1608 forms ending in _current_input or _in1600, and
# each model supports only the forms its own guide documents. Page numbers are
# the guides' printed page numbers.
#
# Every setting a command here writes is read back into state: on connecting
# (the part number query N is answered, and each family's rule then queues
# that family's queries), from the tagged replies and change reports of
# verbose mode 3, and by re-reads after an input switch, a preset recall and
# an Auto-Image, which change settings the unit does not report one by one.
#
# Not here: EDID import/export and assignment, logos and audio files (file
# names on the unit), preset names, CEC, serial port and IP settings, unit
# name, passwords, firmware, backup/restore and resets (Esc ZXXX/ZQQQ/ZY reset
# settings or the network and passwords), pixel-level analog input timing
# (HSRT, VSRT, PHAS, TPIX, APIX, ALIN on IN1606/IN1608), DTP remote power and
# twisted-pair format (wrong DTP2 power can damage a DTP endpoint, IN1808
# guide p.80).
source:
  - title: "IN1806 and IN1808 Series Scaling Presentation Switchers User Guide, 68-3131-01 Rev. B"
    author: Extron Electronics
    url: https://media.extron.com/public/download/files/userman/68-3131-01_B_IN1806-1808_UG.pdf
    note: >
      Manufacturer document. SIS chapter p.52-93: host communication (no start or end characters, CR LF
      after every response), copyright message and part numbers p.52; Password prompt, serial-number
      factory password, Login Administrator / Login User, prompt repeated on a wrong password p.53;
      scaler-initiated messages (Reconfig, HplgO, HdcpI, HdcpO, IN00 signal list) p.53; error codes p.54;
      symbols (| for CR, W for Esc) and variables p.55-62, verbose mode 0-3 and tagged responses p.59;
      input selection 1!, 1%, 1$, views, input format and names, loop out p.63; Auto-Image p.64; HDCP
      authorized, aspect ratio, film mode p.65; auto-input switching p.66; freeze p.66; contrast,
      brightness, detail, image position and size p.67-68; output video mute, output rate and names
      p.69; HDMI output format and power save p.70; screen saver and OSD duration p.71; input presets
      and auto memories p.74; audio input format p.75; audio names and file playback p.76-77; test pattern,
      switch effect, signal presence, front panel lock p.78; HDCP output mode, notification and status
      p.79; information requests, temperature, verbose mode p.83-84; port timeout p.85; group masters
      (groups 1-10, 0.1 dB units) p.88-90; DSP gain, mute and phantom power by OID p.91-92.
  - title: "IN1606 and IN1608 Series Scaling Presentation Switchers User Guide, 68-2290-01 Rev. J"
    author: Extron Electronics
    url: https://media.extron.com/public/download/files/userman/IN1606-1608_UG_68-2290-01_J.pdf
    note: >
      Manufacturer document. SIS chapter p.42-65: host communication, scaler-initiated messages (In X!
      All on a front panel switch, Reconfig, HplgO) and copyright message p.42; password prompt and Login
      replies p.43; error codes p.43; symbols and variables p.44-49; input selection X!!, X!&, X!$ and
      views, auto switch mode p.50; input video format, EDID, input names (NI, 16 characters) p.51;
      Auto-Image and threshold p.52; film mode p.53; output and all-output video mute, color, tint,
      contrast, brightness p.54; detail, image position and size p.55; output rate, HDMI output format,
      power save, screen saver p.56; audio input format, DSP gain and mute by control number p.57;
      volume knob, group volume, mute, bass and treble p.58; user and input presets, auto memories p.59;
      test pattern, freeze, switch effect, aspect ratio, front panel lock p.60; overscan, HDCP notification,
      status and authorization p.61; HDCP mode and signal presence p.62; OSD duration and verbose mode
      p.63; information requests p.64.
  - title: Bitfocus Companion modules extron-dxp and extron-mmx-tcp (MIT)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-extron-dxp
    note: >
      Community code, read for corroboration only (top-level LICENSE is MIT; no code copied): answers the
      "Password:" prompt with the password and CR, and ends every command with a line ending.

transport:
  type: line-tcp
  port: 23
  framing: terminated
  # Simple commands need no terminator; Esc commands end with CR or |. Every
  # command here is sent with a CR, as in extron-matrix (see the quirks).
  terminator: cr
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  # Every response shape the commands here can get; the banner, its date line,
  # "Password:", "Login ...", "Reconfig" and "HplgO" never match.
  # A bare value (a query answered in verbose mode 0 or 1 form) starts with a digit or a sign.
  reply_match: '^(E\d\d$|In|Vmt|Exe|Frz|Img|Cont|Brit|Hdet|Colr|Tint|Hctr|Vctr|Hsiz|Vsiz|Ximg|Rate|Vtpo|Psav|Swef|Aspr|Ausw|Afmt|Anam|Alvl|Oscn|Grpm|Ds[GMZH]|Knob|\dRpr|\dSpr|Prst|Pnam|Amem|Test|Hdcp|Lout|Vnam|Nmi|Nam|Mdur|Ssav|Play|Vrb|Ver|Bld|Pno|Inf|Vid|20Stat|Film|Typ|Vtyp|\d|[-+]\d)'
  # Q (firmware version) keeps the Telnet session from timing out (5 minutes by default).
  probe: "Q"

settings:
  # Administrator or user password; empty for a unit without passwords. The factory password is the unit's
  # serial number (IN1808 guide p.53, IN1608 guide p.43).
  password: { type: string, secret: true, default: "", max_length: 128, pattern: '^[^|/\\* ]*$',
              label: Password,
              description: "Administrator or user password; empty for a unit without passwords (the factory password is the unit's serial number)." }

on_connect:
  - when_set: password
    after_prompt: "Password:"
    send: "{settings.password}"
    refused: '^Password:?$'
    accepted: '^Login (Administrator|User)$'
  # Verbose mode 3: tagged replies and change reports from the front panel and other connections
  # (IN1808 guide p.59 and p.84, IN1608 guide p.63). Telnet connections start in mode 0. Answered "Vrb3".
  - send: "\x1b3CV"
    await_reply: true

ports:
  - { port: 23, protocol: tcp, role: control }

models:
  - id: in1808-series
    name: Extron IN1806, IN1808, IN1808 IPCP SA / MA 70 / Q SA / Q MA 70
    supports:
      [select_input, select_video_input, select_audio_input, get_input, get_video_input, get_audio_input,
       set_loop_out_input, get_loop_out_input, set_input_name, get_input_name, set_output_name,
       get_output_name, auto_image, set_input_hdcp_authorized, get_input_hdcp_authorized, set_aspect_ratio,
       get_aspect_ratio, set_film_mode, get_film_mode, set_auto_switch_mode, get_auto_switch_mode,
       set_auto_switch_timeout, get_auto_switch_timeout, set_freeze, get_freeze, set_contrast, get_contrast,
       set_brightness, get_brightness, set_detail, get_detail, set_image_position, get_image_position,
       set_video_mute, get_video_mute, set_video_mute_all, get_video_mute_all, set_output_rate,
       get_output_rate, set_hdmi_output_format, get_hdmi_output_format, set_power_save, get_power_save,
       set_osd_duration, get_osd_duration, recall_input_preset, save_input_preset, set_auto_memory,
       get_auto_memory, set_audio_input_format, get_audio_input_format, set_group_level,
       increase_group_level, decrease_group_level, get_group_level, set_group_mute, get_group_mute,
       set_dsp_gain, get_dsp_gain, set_dsp_mute, get_dsp_mute, set_phantom_power, play_audio_file,
       stop_audio_file, get_playing_audio_file, set_test_pattern, get_test_pattern, set_switch_effect,
       get_switch_effect, get_signal_status, set_front_panel_lock, get_front_panel_lock,
       set_output_hdcp_mode, get_output_hdcp_mode, set_hdcp_notification, get_hdcp_notification,
       get_input_hdcp_status, get_output_hdcp_status, get_input_info, get_model_name, get_firmware,
       get_firmware_full, get_part_number, get_temperature, set_verbose_mode, get_verbose_mode,
       set_auto_switch_priority, get_auto_switch_priority, get_input_video_format, set_screen_saver_mode,
       get_screen_saver_mode, set_screen_saver_timeout, get_screen_saver_timeout, get_screen_saver_status,
       get_phantom_power, set_dsp_embedded_gain, get_dsp_embedded_gain, set_audio_input_name,
       get_audio_input_name, set_audio_output_name, get_audio_output_name]
    verification: none
    notes: >
      DisplayPort input 1, HDMI inputs 2-6, DTP2/XTP inputs 7 and 8 (IN1808 Series only), aux audio 9;
      outputs 1A (1), 1B DTP2/XTP/HDBT (2) and loop (3) (p.55). Picture controls are per input; image
      position and size, switch effect and test pattern address the scaler output as 1 (p.66-68, p.78).
      Group masters 1-10: 1 mic volume, 2 mic mute, 3 program volume, 4 program mute, 5 line volume,
      6 line mute, 7 bass, 8 treble, 9 output volume, 10 output mute (p.89).
  - id: in1608-series
    name: Extron IN1606, IN1608, IN1608 SA / MA / xi
    supports:
      [select_input_in1600, select_video_input_in1600, select_audio_input_in1600, get_input_in1600,
       get_video_input_in1600, get_audio_input_in1600, set_input_name_in1600, get_input_name_in1600,
       auto_image_in1600, auto_image_fill_in1600, auto_image_keep_aspect_in1600, set_auto_image, get_auto_image, set_input_hdcp_authorized,
       get_input_hdcp_authorized, set_aspect_ratio, get_aspect_ratio, set_film_mode, get_film_mode,
       set_auto_switch_mode, get_auto_switch_mode, set_freeze_in1600, get_freeze_in1600,
       set_contrast_current_input, get_contrast_current_input, set_brightness_current_input,
       get_brightness_current_input, set_detail_current_input, get_detail_current_input,
       set_color_current_input, get_color_current_input, set_tint_current_input, get_tint_current_input,
       set_image_position_in1600, get_image_position_in1600, set_video_mute, get_video_mute,
       set_video_mute_all, get_video_mute_all, set_output_rate_in1600, get_output_rate_in1600,
       set_hdmi_output_format, get_hdmi_output_format, set_power_save, get_power_save, set_osd_duration,
       get_osd_duration, recall_user_preset, save_user_preset, recall_input_preset, save_input_preset,
       set_auto_memory, get_auto_memory, set_audio_input_format, get_audio_input_format,
       set_group_level, increase_group_level, decrease_group_level, get_group_level, set_group_mute,
       get_group_mute, set_dsp_gain, get_dsp_gain, set_dsp_mute, get_dsp_mute, set_volume_knob_group,
       get_volume_knob_group, set_test_pattern_in1600, get_test_pattern_in1600, set_switch_effect_in1600,
       get_switch_effect_in1600, get_signal_status, set_front_panel_lock, get_front_panel_lock,
       set_output_hdcp_mode_in1600, get_output_hdcp_mode_in1600, set_hdcp_notification_in1600,
       get_hdcp_notification_in1600, get_input_hdcp_status, get_output_hdcp_status, get_info_in1600,
       get_firmware, get_firmware_full, get_part_number, get_temperature, set_verbose_mode,
       get_verbose_mode, set_input_video_format_in1600, get_input_video_format_in1600,
       set_screen_saver_mode_in1600, get_screen_saver_mode_in1600, set_screen_saver_color_in1600,
       set_screen_saver_timeout_in1600, get_screen_saver_timeout_in1600, get_screen_saver_status_in1600,
       set_auto_image_threshold, get_auto_image_threshold, set_overscan, get_overscan]
    verification: none
    notes: >
      Inputs 1-6 (IN1606) or 1-8 (IN1608 Series), analog on inputs 1 and 2; outputs HDMI A (1), HDMI B (2)
      and Out C (3) (p.44). Picture controls adjust the current input (p.54-55). Group masters: 1 program
      volume, 2 program mute, 3 mic volume, 4 mic mute, 5 bass, 6 treble, 7 output mute, 8 variable volume
      (p.58). Front panel lock modes 0-2 only.

commands:
  # ── Input selection (IN1808 p.63; IN1608 p.50) ──────────────────────────
  select_input:
    summary: Select an input's video and audio for the output (X!*1!); 9 is the aux audio input
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}*1!"
    expect: { matches: '^In\s*\d+(?:\*1)?\s*All$' }
    returns: ack
  select_video_input:
    summary: Select an input's video only (breakaway) (X!*1%)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}*1%"
    expect: { matches: '^In\s*\d+(?:\*1)?\s*Vid$' }
    returns: ack
  select_audio_input:
    summary: Select an input's audio only (breakaway) (X!*1$); 9 is the aux audio input
    params:
      input: { type: int, min: 1, max: 9, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel; 9 is the IN1808's aux audio input." }
    send: "{input}*1$"
    expect: { matches: '^In\s*\d+(?:\*1)?\s*Aud$' }
    returns: ack
  get_input:
    summary: Get the input whose video and audio go to the output (1!); E13 in breakaway
    send: "1!"
    expect: { matches: '^(?:In\s*)?0*(\d+)(?:\*1)?(?:\s*All)?$' }
    returns: value
  get_video_input:
    summary: Get the video input (1%)
    send: "1%"
    expect: { matches: '^(?:In\s*)?0*(\d+)(?:\*1)?(?:\s*Vid)?$' }
    returns: value
  get_audio_input:
    summary: Get the audio input (1$)
    send: "1$"
    expect: { matches: '^(?:In\s*)?0*(\d+)(?:\*1)?(?:\s*Aud)?$' }
    returns: value
  select_input_in1600:
    summary: Select an input's video and audio (X!!)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}!"
    expect: { matches: '^In\s*\d+\s*All$' }
    returns: ack
  select_video_input_in1600:
    summary: Select an input's video only (X!&); not allowed from an input set to a digital audio format (E17)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}&"
    expect: { matches: '^In\s*\d+\s*RGB$' }
    returns: ack
  select_audio_input_in1600:
    summary: Select an input's audio only (X!$); not allowed to an input set to a digital audio format (E17)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}$"
    expect: { matches: '^In\s*\d+\s*Aud$' }
    returns: ack
  get_input_in1600:
    summary: Get the current video and audio input (!)
    send: "!"
    expect: { matches: '^(?:In\s*)?0*(\d+)(?:\s*All)?$' }
    returns: value
  get_video_input_in1600:
    summary: Get the current video input (&)
    send: "&"
    expect: { matches: '^(?:In\s*)?0*(\d+)(?:\s*RGB)?$' }
    returns: value
  get_audio_input_in1600:
    summary: Get the current audio input ($)
    send: "$"
    expect: { matches: '^(?:In\s*)?0*(\d+)(?:\s*Aud)?$' }
    returns: value

  # ── Loop out and names ──────────────────────────────────────────────────
  set_loop_out_input:
    summary: Tie the HDMI loop output to an input (Esc X!LOUT)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}LOUT"
    expect: { matches: '^Lout\s*\d+$' }
    returns: ack
  get_loop_out_input:
    summary: Get the input on the loop output (Esc LOUT)
    send: "\x1bLOUT"
    expect: { matches: '^(?:Lout\s*)?0*(\d+)$' }
    returns: value
  set_input_name:
    summary: Name a video input, up to 32 characters; a single space restores the default (Esc IX!*name VNAM)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      name: { type: string, max_length: 32, pattern: '^[^,*|]+$', required: true,
              label: Name,
              description: "Name to give, without commas, asterisks or |; a single space restores the default." }
    send: "\x1bI{input}*{name}VNAM"
    expect: { matches: '^VnamI' }
    returns: ack
  get_input_name:
    summary: Get a video input's name (Esc IX!VNAM)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1bI{input}VNAM"
    expect: { matches: '^(?:VnamI\s*\d+\*)?(.*)$' }
    returns: value
  set_output_name:
    summary: Name a video output (1A, 1B, loop), up to 32 characters (Esc OX@*name VNAM)
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
      name: { type: string, max_length: 32, pattern: '^[^,*|]+$', required: true,
              label: Name,
              description: "Name to give, up to 32 characters, without commas, asterisks or |." }
    send: "\x1bO{output}*{name}VNAM"
    expect: { matches: '^VnamO' }
    returns: ack
  get_output_name:
    summary: Get a video output's name (Esc OX@VNAM)
    params:
      output: { type: int, min: 1, max: 3, required: true,
                label: Output,
                description: "Output number: on IN1808 units 1 is 1A, 2 is 1B (DTP2/XTP/HDBT), 3 the loop; on IN1600 units HDMI A, HDMI B, Out C." }
    send: "\x1bO{output}VNAM"
    expect: { matches: '^(?:VnamO\s*\d+\*)?(.*)$' }
    returns: value
  set_input_name_in1600:
    summary: Name an input, up to 16 characters; a single space restores the default (Esc X!,name NI)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      name: { type: string, max_length: 16, pattern: '^[^,*|]+$', required: true,
              label: Name,
              description: "Name to give, without commas, asterisks or |; a single space restores the default." }
    send: "\x1b{input},{name}NI"
    expect: { matches: '^Nmi' }
    returns: ack
  get_input_name_in1600:
    summary: Get an input's name (Esc X!NI)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}NI"
    expect: { matches: '^(?:Nmi\s*\d+,)?(.*)$' }
    returns: value

  # ── Input configuration ─────────────────────────────────────────────────
  auto_image:
    summary: Run Auto-Image on the current input, following its aspect ratio, filling the output, or keeping the input's aspect (1*0A / 1*1A / 1*2A)
    params:
      mode: { type: enum, values: ["0", "1", "2"], default: "0",
              label: Auto-Image mode,
              description: "0 follows the input's aspect ratio, 1 fills the output, 2 keeps the input's aspect." }
    send: "1*{mode}A"
    expect: { matches: '^Img1\*[0-2]$' }
    returns: ack
  auto_image_in1600:
    summary: Run Auto-Image on the current input, following the input's aspect ratio setting (A)
    send: "A"
    expect: { matches: '^Img0$' }
    returns: ack
  auto_image_fill_in1600:
    summary: Run Auto-Image on the current input and fill the output (1*A)
    send: "1*A"
    expect: { matches: '^Img1$' }
    returns: ack
  auto_image_keep_aspect_in1600:
    summary: Run Auto-Image on the current input keeping its aspect ratio (2*A)
    send: "2*A"
    expect: { matches: '^Img2$' }
    returns: ack
  set_auto_image:
    summary: Turn automatic Auto-Image on or off for an input (X!*1A / X!*0A)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      enabled: { type: bool, required: true,
                 label: Auto-Image,
                 description: "True runs Auto-Image automatically when the input's signal changes, false turns it off." }
    send: "{input}*{enabled:bool01}A"
    expect: { matches: '^Img\s*\d+\*[01]$' }
    returns: ack
  get_auto_image:
    summary: Get whether automatic Auto-Image is on for an input (X!A)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}A"
    expect: { matches: '^(?:Img\s*\d+\*)?([01])$' }
    returns: value
  set_input_hdcp_authorized:
    summary: Allow or block HDCP-encrypted content on an input (Esc EX!*1HDCP / *0)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      allowed: { type: bool, required: true,
                 label: HDCP allowed,
                 description: "True lets the input accept HDCP-encrypted content, false blocks it." }
    send: "\x1bE{input}*{allowed:bool01}HDCP"
    expect: { matches: '^HdcpE\s*\d+\*[01]$' }
    returns: ack
  get_input_hdcp_authorized:
    summary: Get whether HDCP is allowed on an input (Esc EX!HDCP)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1bE{input}HDCP"
    expect: { matches: '^(?:HdcpE\s*\d+\*)?([01])$' }
    returns: value
  set_aspect_ratio:
    summary: Fill the output with an input (1) or keep its native aspect ratio (2) (Esc X!*nASPR)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      mode: { type: int, min: 1, max: 2, required: true,
              label: Aspect ratio,
              description: "1 fills the output with the input, 2 keeps the input's native aspect ratio." }
    send: "\x1b{input}*{mode}ASPR"
    expect: { matches: '^Aspr\s*\d+\s*\*\s*[12]$' }
    returns: ack
  get_aspect_ratio:
    summary: Get an input's aspect ratio setting, 1 fill or 2 follow (Esc X!ASPR)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}ASPR"
    expect: { matches: '^(?:Aspr\s*\d+\s*\*\s*)?([12])$' }
    returns: value
  set_film_mode:
    summary: Turn 3:2, 2:2 and 24:1 film mode detection on (auto) or off for an input (Esc X!*1FILM / *0)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      enabled: { type: bool, required: true,
                 label: Film mode,
                 description: "True turns 3:2, 2:2 and 24:1 film mode detection on (auto), false off." }
    send: "\x1b{input}*{enabled:bool01}FILM"
    expect: { matches: '^Film\s*\d+\s*\*\s*[01]$' }
    returns: ack
  get_film_mode:
    summary: Get an input's film mode detection (Esc X!FILM)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "\x1b{input}FILM"
    expect: { matches: '^(?:Film\s*\d+\s*\*\s*)?([01])$' }
    returns: value
  set_auto_switch_mode:
    summary: "Set auto-input switching (Esc nAUSW): 0 manual; IN1808 1 user priority, 2 last connected; IN1608 1 highest active input, 2 lowest active input"
    params:
      mode: { type: int, min: 0, max: 2, required: true,
              label: Auto-switch mode,
              description: "0 manual; IN1808 1 user priority, 2 last connected; IN1608 1 highest active input, 2 lowest active input." }
    send: "\x1b{mode}AUSW"
    expect: { matches: '^Ausw[0-2]$' }
    returns: ack
  get_auto_switch_mode:
    summary: Get the auto-input switch mode (Esc AUSW)
    send: "\x1bAUSW"
    expect: { matches: '^(?:Ausw)?([0-2])$' }
    returns: value
  set_auto_switch_timeout:
    summary: Set the seconds without video before auto-input switching moves on, 0-500 (Esc TnAUSW)
    params:
      seconds: { type: int, min: 0, max: 500, required: true,
                 label: Timeout,
                 description: "Seconds without video before auto-input switching moves on, 0 to 500." }
    send: "\x1bT{seconds}AUSW"
    expect: { matches: '^AuswT\s*\d+$' }
    returns: ack
  get_auto_switch_timeout:
    summary: Get the auto-input switch timeout in seconds (Esc TAUSW)
    send: "\x1bTAUSW"
    expect: { matches: '^(?:AuswT\s*)?0*(\d+)$' }
    returns: value
  set_auto_switch_priority:
    summary: Set the user priority order for auto-input switching, every input once, highest first, such as "8 7 1 2 3 4 5 6" (Esc P... AUSW); E13 unless every input is given
    params:
      order: { type: string, pattern: '^[1-8]( [1-8]){5,7}$', required: true,
               label: Priority order,
               description: "Every input number once, separated by spaces, highest priority first: six on an IN1806, eight on an IN1808." }
    send: "\x1bP{order}AUSW"
    expect: { matches: '^AuswP\s*[1-8](?: [1-8])+$' }
    returns: ack
  get_auto_switch_priority:
    summary: Get the user priority order, highest first, as space-separated input numbers (Esc PAUSW)
    send: "\x1bPAUSW"
    expect: { matches: '^(?:AuswP\s*)?([1-8](?: [1-8])+)$' }
    returns: value
  get_input_video_format:
    summary: "Get the digital video format detected on an input: 0 no signal, 1 DVI, 2 HDMI, 3 DisplayPort (X!*\\)"
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}*\\"
    expect: { matches: '^(?:Vtyp\s*\d+\*)?([0-3])$' }
    returns: value
  set_input_video_format_in1600:
    summary: "Set an input's video format: 1 RGB, 2 YUV, 3 RGBcvS, 4 S-video, 5 composite, 6 HDMI (X!*X#\\); analog formats on inputs 1 and 2"
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
      format: { type: int, min: 1, max: 6, required: true,
                label: Video format,
                description: "1 RGB, 2 YUV, 3 RGBcvS, 4 S-video, 5 composite, 6 HDMI (the default for inputs 3 and higher)." }
    send: "{input}*{format}\\"
    expect: { matches: '^Typ\s*\d+\s*\*\s*[1-6]$' }
    returns: ack
  get_input_video_format_in1600:
    summary: Get an input's video format setting (X!\\)
    params:
      input: { type: int, min: 1, max: 8, required: true,
               label: Input,
               description: "Input number, from 1 as on the unit's rear panel." }
    send: "{input}\\"
    expect: { matches: '^(?:Typ\s*\d+\s*\*\s*)?([1-6])$' }
    returns: value
  set_auto_image_threshold:
    summary: Set the luminosity Auto-Image takes as active video, 0 black to 100 white (25 default) (Esc nALVL)
    params:
      level: { type: int, min: 0, max: 100, required: true,
               label: Threshold,
               description: "Luminosity Auto-Image takes as active video, from 0 (black) to 100 (white); 25 is the default." }
    send: "\x1b{level}ALVL"
    expect: { matches: '^Alvl\s*\d+$' }
    returns: ack
  get_auto_image_threshold:
    summary: Get the Auto-Image threshold (Esc ALVL)
    send: "\x1bALVL"
    expect: { matches: '^(?:Alvl\s*)?0*(\d+)$' }
    returns: value
  set_overscan:
    summary: "Set the overscan of an input video format (SMPTE rates only): 0 0%, 1 2.5%, 2 5% (Esc X#*nOSCN)"
    params:
      format: { type: int, min: 1, max: 6, required: true,
                label: Video format,
                description: "Input video format the overscan applies to: 1 RGB, 2 YUV, 3 RGBcvS, 4 S-video, 5 composite, 6 HDMI." }
      overscan: { type: int, min: 0, max: 2, required: true,
                  label: Overscan,
                  description: "0 is 0% (default for RGB and HDMI), 1 is 2.5% (default for the others), 2 is 5%." }
    send: "\x1b{format}*{overscan}OSCN"
    expect: { matches: '^Oscn\s*[1-6]\s*\*\s*[0-2]$' }
    returns: ack
  get_overscan:
    summary: Get the overscan of an input video format (Esc X#OSCN)
    params:
      format: { type: int, min: 1, max: 6, required: true,
                label: Video format,
                description: "Input video format: 1 RGB, 2 YUV, 3 RGBcvS, 4 S-video, 5 composite, 6 HDMI." }
    send: "\x1b{format}OSCN"
    expect: { matches: '^(?:Oscn\s*[1-6]\s*\*\s*)?([0-2])$' }
    returns: value

  # ── Picture (IN1808 p.66-68; IN1608 p.54-55, p.60) ──────────────────────
  set_freeze:
