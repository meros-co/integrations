state:
  version:                 { type: string, description: "Sofie Core's version (GET /)" }
  health.status:           { type: string, description: "Sofie's health: OK, FAIL, WARNING or UNDEFINED" }
  health.message:          { type: string, description: "Sofie's status and every component's, separated by semicolons" }
  health.updated:          { type: string, description: "When the health was last updated (ISO 8601)" }
  health.blueprints_version: { type: string, description: "The blueprints' version" }
  health.components.*.name:    { type: string, description: "A component's name (a gateway), keyed by its place from 0" }
  health.components.*.status:  { type: string, description: "The component's status: OK, FAIL, WARNING or UNDEFINED" }
  health.components.*.version: { type: string, description: "The component's version" }
  playlist_ids.*:          { type: string, description: "A playlist's ID (GET /playlists), keyed by its place from 0" }
  studio_ids.*:            { type: string, description: "A studio's ID, keyed by its place from 0" }
  device_ids.*:            { type: string, description: "A peripheral device's ID, keyed by its place from 0" }
  blueprint_ids.*:         { type: string, description: "A blueprint's ID, keyed by its place from 0" }
  show_style_ids.*:        { type: string, description: "A show style base's ID, keyed by its place from 0" }
  buckets.*.name:          { type: string, description: "A bucket's name, keyed by its ID" }
  buckets.*.studio:        { type: string, description: "The bucket's studio ID" }
  studio.id:               { type: string, description: "The studio the Live Status Gateway reports" }
  studio.name:             { type: string, description: "The studio's name" }
  playlists.*.name:        { type: string, description: "A playlist of the studio, keyed by ID: its name" }
  playlists.*.external_id: { type: string, description: "The playlist's ID in the ingest system" }
  playlists.*.activation:  { type: string, description: "deactivated, rehearsal or activated" }
  active_playlist.id:      { type: string, description: "The active playlist's ID; absent when none is active" }
  active_playlist.name:    { type: string, description: "The active playlist's name" }
  active_playlist.external_id: { type: string, description: "Its ID in the ingest system" }
  active_playlist.current_part.id:    { type: string, description: "The part on air" }
  active_playlist.current_part.name:  { type: string, description: "Its name" }
  active_playlist.current_part.segment: { type: string, description: "Its segment's ID" }
  active_playlist.current_part.auto_next: { type: bool, description: "It takes the next part automatically" }
  active_playlist.current_part.start_ms: { type: int, unit: ms, description: "When it went on air, Unix milliseconds" }
  active_playlist.current_part.duration_ms: { type: int, unit: ms, description: "Its expected duration" }
  active_playlist.current_part.end_ms: { type: int, unit: ms, description: "When it is projected to end, Unix milliseconds" }
  active_playlist.next_part.id:       { type: string, description: "The part set as next" }
  active_playlist.next_part.name:     { type: string, description: "Its name" }
  active_playlist.next_part.segment:  { type: string, description: "Its segment's ID" }
  active_playlist.current_segment.id: { type: string, description: "The segment on air" }
  active_playlist.current_segment.name: { type: string, description: "Its name" }
  active_playlist.timing.mode:        { type: string, description: "Timing mode: none, forward-time or back-time" }
  active_playlist.timing.started_ms:  { type: int, unit: ms, description: "When playback started, Unix milliseconds" }
  active_playlist.timing.expected_start_ms: { type: int, unit: ms, description: "When the playlist is expected to start" }
  active_playlist.timing.expected_duration_ms: { type: int, unit: ms, description: "The playlist's expected duration" }
  active_playlist.timing.expected_end_ms: { type: int, unit: ms, description: "When the playlist is expected to end" }
  active_playlist.quick_loop.running: { type: bool, description: "The QuickLoop runs" }
  active_playlist.quick_loop.locked:  { type: bool, description: "The QuickLoop is locked" }
  active_playlist.timers.*.label:     { type: string, description: "A T-timer's label, keyed by its index 1 to 3" }
  active_playlist.timers.*.configured: { type: bool, description: "The T-timer is configured" }
  active_playlist.timers.*.mode:      { type: string, description: "countdown, freeRun or timeOfDay" }
  active_playlist.timers.*.paused:    { type: bool, description: "The T-timer is paused" }
  active_playlist.timers.*.zero_time_ms: { type: int, unit: ms, description: "When a running T-timer reaches zero, Unix milliseconds" }
  active_playlist.timers.*.duration_ms: { type: int, unit: ms, description: "A paused T-timer's remaining duration, or a countdown's duration" }
  active_pieces.*.name:          { type: string, description: "A piece on air, keyed by ID: its name" }
  active_pieces.*.source_layer:  { type: string, description: "Its source layer" }
  active_pieces.*.output_layer:  { type: string, description: "Its output layer" }
  segments.*.name:               { type: string, description: "A segment of the active playlist, keyed by ID: its name" }
  segments.*.identifier:         { type: string, description: "Its identifier" }
  segments.*.rundown:            { type: string, description: "Its rundown's ID" }
  segments.*.duration_ms:        { type: int, unit: ms, description: "Its expected duration" }

telemetry:
  websocket:
    port: { setting: lsg_port }
    path: /
    scheme: ws
    send:
      - '{"event":"subscribe","reqid":1,"subscription":{"name":"studio"}}'
      - '{"event":"subscribe","reqid":2,"subscription":{"name":"activePlaylist"}}'
      - '{"event":"subscribe","reqid":3,"subscription":{"name":"activePieces"}}'
      - '{"event":"subscribe","reqid":4,"subscription":{"name":"segments"}}'
  poll:
    - every_ms: 10000
      send: [{ method: GET, path: /api/v1.0/health }]
    - every_ms: 60000
      send:
        - { method: GET, path: /api/v1.0/ }
        - { method: GET, path: /api/v1.0/playlists }
        - { method: GET, path: /api/v1.0/studios }
        - { method: GET, path: /api/v1.0/devices }
        - { method: GET, path: /api/v1.0/blueprints }
        - { method: GET, path: /api/v1.0/showstyles }
        - { method: GET, path: /api/v1.0/buckets }
  updates:
    # REST reads.
    - path: "^/api/v1\\.0/$"
      json: { version: "$.result.version" }
      state: { version: "{version}" }
    - path: "^/api/v1\\.0/health$"
      json: { status: "$.status", message: "$.statusMessage", updated: "$.updated", bp: "$.blueprintsVersion", version: "$.version" }
      state: { health.status: "{status}", health.message: "{message}", health.updated: "{updated}", health.blueprints_version: "{bp}", version: "{version}" }
    - path: "^/api/v1\\.0/health$"
      json_each: "$.components"
      json: { name: "$.name", status: "$.status", version: "$.version" }
      replace: health.components
      state: { "health.components.{index}.name": "{name}", "health.components.{index}.status": "{status}", "health.components.{index}.version": "{version}" }
    - path: "^/api/v1\\.0/playlists$"
      json_each: "$.result"
      json: { id: "$.id" }
      replace: playlist_ids
      state: { "playlist_ids.{index}": "{id}" }
    - path: "^/api/v1\\.0/studios$"
      json_each: "$.result"
      json: { id: "$.id" }
      replace: studio_ids
      state: { "studio_ids.{index}": "{id}" }
    - path: "^/api/v1\\.0/devices$"
      json_each: "$.result"
      json: { id: "$.id" }
      replace: device_ids
      state: { "device_ids.{index}": "{id}" }
    - path: "^/api/v1\\.0/blueprints$"
      json_each: "$.result"
      json: { id: "$.id" }
      replace: blueprint_ids
      state: { "blueprint_ids.{index}": "{id}" }
    - path: "^/api/v1\\.0/showstyles$"
      json_each: "$.result"
      json: { id: "$.id" }
      replace: show_style_ids
      state: { "show_style_ids.{index}": "{id}" }
    - path: "^/api/v1\\.0/buckets$"
      json_each: "$.result"
      json: { id: "$.id", name: "$.name", studio: "$.studioId" }
      replace: buckets
      state: { "buckets.{id:key}.name": "{name}", "buckets.{id:key}.studio": "{studio}" }
    # The Live Status Gateway.
    - json_match: { "$.event": "^studio$" }
      json: { id: "$.id", name: "$.name" }
      state: { studio.id: "{id}", studio.name: "{name}" }
    - json_match: { "$.event": "^studio$" }
      json_each: "$.playlists"
      json: { id: "$.id", name: "$.name", external: "$.externalId", activation: "$.activationStatus" }
      replace: playlists
      state: { "playlists.{id:key}.name": "{name}", "playlists.{id:key}.external_id": "{external}", "playlists.{id:key}.activation": "{activation}" }
    - json_match: { "$.event": "^activePlaylist$" }
      json:
        id: "$.id"
        name: "$.name"
        external: "$.externalId"
        cp_id: "$.currentPart.id"
        cp_name: "$.currentPart.name"
        cp_segment: "$.currentPart.segmentId"
        cp_auto: "$.currentPart.autoNext"
        cp_start: "$.currentPart.timing.startTime"
        cp_duration: "$.currentPart.timing.expectedDurationMs"
        cp_end: "$.currentPart.timing.projectedEndTime"
        np_id: "$.nextPart.id"
        np_name: "$.nextPart.name"
        np_segment: "$.nextPart.segmentId"
        cs_id: "$.currentSegment.id"
        cs_name: "$.currentSegment.name"
        t_mode: "$.timing.timingMode"
        t_started: "$.timing.startedPlayback"
        t_start: "$.timing.expectedStart"
        t_duration: "$.timing.expectedDurationMs"
        t_end: "$.timing.expectedEnd"
        ql_running: "$.quickLoop.running"
        ql_locked: "$.quickLoop.locked"
      replace: active_playlist
      state:
        active_playlist.id: "{id}"
        active_playlist.name: "{name}"
        active_playlist.external_id: "{external}"
        active_playlist.current_part.id: "{cp_id}"
        active_playlist.current_part.name: "{cp_name}"
        active_playlist.current_part.segment: "{cp_segment}"
        active_playlist.current_part.auto_next: "{cp_auto}"
        active_playlist.current_part.start_ms: "{cp_start}"
        active_playlist.current_part.duration_ms: "{cp_duration}"
        active_playlist.current_part.end_ms: "{cp_end}"
        active_playlist.next_part.id: "{np_id}"
        active_playlist.next_part.name: "{np_name}"
        active_playlist.next_part.segment: "{np_segment}"
        active_playlist.current_segment.id: "{cs_id}"
        active_playlist.current_segment.name: "{cs_name}"
        active_playlist.timing.mode: "{t_mode}"
        active_playlist.timing.started_ms: "{t_started}"
        active_playlist.timing.expected_start_ms: "{t_start}"
        active_playlist.timing.expected_duration_ms: "{t_duration}"
        active_playlist.timing.expected_end_ms: "{t_end}"
        active_playlist.quick_loop.running: "{ql_running}"
        active_playlist.quick_loop.locked: "{ql_locked}"
    - json_match: { "$.event": "^activePlaylist$" }
      json_each: "$.tTimers"
      json: { i: "$.index", label: "$.label", configured: "$.configured", mode: "$.mode.type", paused: "$.state.paused",
              zero: "$.state.zeroTime", duration: "$.state.duration" }
      state:
        "active_playlist.timers.{i}.label": "{label}"
        "active_playlist.timers.{i}.configured": "{configured}"
        "active_playlist.timers.{i}.mode": "{mode}"
        "active_playlist.timers.{i}.paused": "{paused}"
        "active_playlist.timers.{i}.zero_time_ms": "{zero}"
        "active_playlist.timers.{i}.duration_ms": "{duration}"
    - json_match: { "$.event": "^activePieces$" }
      json_each: "$.activePieces"
      json: { id: "$.id", name: "$.name", source: "$.sourceLayer", output: "$.outputLayer" }
      replace: active_pieces
      state: { "active_pieces.{id:key}.name": "{name}", "active_pieces.{id:key}.source_layer": "{source}", "active_pieces.{id:key}.output_layer": "{output}" }
    - json_match: { "$.event": "^segments$" }
      json_each: "$.segments"
      json: { id: "$.id", name: "$.name", identifier: "$.identifier", rundown: "$.rundownId", duration: "$.timing.expectedDurationMs" }
      replace: segments
      state: { "segments.{id:key}.name": "{name}", "segments.{id:key}.identifier": "{identifier}", "segments.{id:key}.rundown": "{rundown}", "segments.{id:key}.duration_ms": "{duration}" }

quirks:
  - models: [all]
    severity: critical
    text: >
      take, activate_playlist, deactivate_playlist, reset_playlist and reload_playlist change what goes to air at
      once; the delete commands, the put commands and apply_pending_migrations change Sofie's configuration, and
      the ingest commands replace or delete rundowns, segments and parts.
  - models: [all]
    severity: warning
    text: >
      The OpenAPI document calls its server "for use during development only" and describes no authentication;
      Sofie's REST API is meant for a trusted network or behind a proxy that authenticates. The Live Status
      Gateway is a separate process: this spec reaches it on the Core's host at lsg_port.
  - models: [all]
    severity: info
    text: >
      Requests whose body is a documented object (studios, show styles, variants, buckets, AdLib imports,
      ingest rundowns, segments and parts, snapshots, migrations, device, studio and show-style actions,
      AdLib options and T-timer projections) take it whole as the json body parameter, as the API reference
      describes it. Optional booleans of a typed body are sent as false unless given; optional strings have a
      second command that sends them (take_with_from_part_instance_id and the like).
  - models: [all]
    severity: info
    text: >
      The REST lists give IDs only (buckets their names too), kept as lists; the studio's playlists with their
      names and activation, and everything on air, come from the Live Status Gateway's events. The adLibs,
      resolvedPlaylist, buckets, packages and notifications topics are not subscribed; their content is read
      with the REST commands. An activePlaylist event with no active playlist clears active_playlist.
