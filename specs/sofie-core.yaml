spec: 1
id: sofie-core
name: Sofie Core (User Actions REST API and Live Status Gateway)
vendor: Sofie
category: other

# Sofie Core's User Actions API (REST, /api/v1.0 on the Core's port 3000) for
# every command, and the Live Status Gateway's websocket (port 8080 on the same
# host) for what is on air: the studio's playlists, the active playlist with its
# current and next part, segment and T-timers, the active pieces and the
# segments. Lists the REST API gives (studios, devices, show styles, buckets,
# blueprints) and Sofie's health are polled. Every command is generated from
# the project's OpenAPI document, one per operation.
source:
  - title: "Sofie User Actions API 1.0.0 (OpenAPI 3.0.3, packages/openapi/api)"
    author: Sofie TV Automation (MIT License)
    url: https://github.com/Sofie-Automation/sofie-core/tree/main/packages/openapi/api
    note: >
      The project's own API definition (retrieved 2026-10-28, main branch): actions.yaml (every path under
      /api/v1.0, server http://localhost:3000/api/v1.0) and definitions/blueprints, buckets, devices, ingest,
      playlists, showstyles, snapshots, sofie and studios .yaml (each operation's method, path and query
      parameters, request body schema and responses, including the {status, result} answer and the health
      schema).
  - title: "Sofie Live Status Service 2.0.1 (AsyncAPI 2.6.0, packages/live-status-gateway-api/api)"
    author: Sofie TV Automation (MIT License)
    url: https://github.com/Sofie-Automation/sofie-core/tree/main/packages/live-status-gateway-api/api
    note: >
      The gateway's message definitions (retrieved 2026-10-28): subscribe messages {event: subscribe, reqid,
      subscription: {name}} for studio, activePlaylist, resolvedPlaylist, activePieces, segments, adLibs,
      notifications, buckets and packages; the studio, activePlaylist (id, name, currentPart, currentSegment,
      nextPart, timing, quickLoop, tTimers), activePieces and segments events and their fields.
  - title: "Sofie Live Status Gateway README"
    author: Sofie TV Automation (MIT License)
    url: https://github.com/Sofie-Automation/sofie-core/blob/main/packages/live-status-gateway/README.md
    note: "The gateway at ws://<host>:8080 and the subscribe message, in its example."

transport:
  type: http
  port: 3000
  https_port: 443
  scheme: { setting: scheme }
  auth: none
  timeout_ms: 10000
  probe: { method: GET, path: /api/v1.0/health }

settings:
  scheme: { type: enum, values: [http, https], default: http, label: Connection,
            description: "http, or https when Sofie Core is served behind TLS." }
  lsg_port: { type: int, min: 1, max: 65535, default: 8080, label: Live Status Gateway port,
              description: "Port of the Live Status Gateway's websocket on the Core's host, 8080 unless the gateway is set otherwise." }

ports:
  - { port: 3000, protocol: http, role: control, when: "scheme http", note: "Sofie Core's web server; the API is under /api/v1.0" }
  - { port: 443, protocol: https, role: control, when: "scheme https" }
  - { port: 8080, protocol: ws, role: push, setting: lsg_port, note: "the Live Status Gateway, on the Core's host" }

models:
  - id: sofie-core
    name: Sofie Core (User Actions API 1.0) with the Live Status Gateway
    supports: [get_version, get_health, assign_system_blueprint, unassign_system_blueprint, get_pending_migrations, apply_pending_migrations, get_devices, get_device, device_action, get_blueprints, get_blueprint, get_playlists, activate_playlist, deactivate_playlist, activate_adlib_testing, execute_adlib, execute_bucket_adlib, execute_bucket_adlib_with_action_type, move_next_part, move_next_segment, reload_playlist, reset_playlist, set_next_part, set_next_segment, queue_next_segment, clear_source_layers, take, take_with_from_part_instance_id, clear_source_layer, recall_sticky, start_timer_countdown, start_timer_free_run, pause_timer, resume_timer, restart_timer, clear_timer_projection, set_timer_projection_anchor, set_timer_projection_time, set_timer_projection_duration, get_studios, add_studio, get_studio, put_studio, delete_studio, get_studio_config, update_studio_config, switch_route_set, get_studio_devices, attach_device, attach_device_with_config_id, detach_device, studio_action, get_show_styles, add_show_style, get_show_style, put_show_style, delete_show_style, get_show_style_config, update_show_style_config, get_show_style_variants, add_show_style_variant, get_show_style_variant, put_show_style_variant, delete_show_style_variant, show_style_action, get_buckets, add_bucket, get_bucket, delete_bucket, import_bucket_adlib, delete_bucket_adlibs, delete_bucket_adlib, store_snapshot, ingest_get_playlists, ingest_delete_playlists, ingest_get_playlist, ingest_delete_playlist, ingest_post_rundown_in_studio, ingest_get_rundowns, ingest_post_rundown, ingest_put_rundowns, ingest_delete_rundowns, ingest_get_rundown, ingest_put_rundown, ingest_delete_rundown, ingest_get_segments, ingest_post_segment, ingest_put_segments, ingest_delete_segments, ingest_get_segment, ingest_put_segment, ingest_delete_segment, ingest_get_parts, ingest_post_part, ingest_put_parts, ingest_delete_parts, ingest_get_part, ingest_put_part, ingest_delete_part]
    verification: none

commands:
  get_version:
    summary: "Returns the current version of Sofie (GET /)"
    send: { method: GET, path: "/api/v1.0/" }
    expect: { status: [200, 201, 202], json_path: "$" }
    returns: value
  get_health:
    summary: "Gets the current health status of Sofie and all its components (GET /health)"
    send: { method: GET, path: "/api/v1.0/health" }
    expect: { status: [200, 201, 202], json_path: "$" }
    returns: value
  assign_system_blueprint:
    summary: "Assigns a system Blueprint to Sofie core (PUT /system/blueprint)"
    params:
      blueprint_id: { type: string, max_length: 1024, required: true, label: "Blueprint id", description: "System blueprint to assign." }
    send: { method: PUT, path: "/api/v1.0/system/blueprint", content_type: application/json, body: '{"blueprintId":{blueprint_id:json}}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  unassign_system_blueprint:
    summary: "Unassigns the assigned system Blueprint, if any Blueprint is assigned (DELETE /system/blueprint)"
    send: { method: DELETE, path: "/api/v1.0/system/blueprint" }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  get_pending_migrations:
    summary: "Gets a set of pending system-level migrations (GET /system/migrations)"
    send: { method: GET, path: "/api/v1.0/system/migrations" }
    expect: { status: [200, 201, 202], json_path: "$" }
    returns: value
  apply_pending_migrations:
    summary: "Apply a set of migrations with a given set of values (POST /system/migrations)"
    params:
      body: { type: json, required: true, label: Body, description: "The JSON body the Sofie API documents for this request: Apply a set of migrations with a given set of values." }
    send: { method: POST, path: "/api/v1.0/system/migrations", content_type: application/json, body: '{body}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  get_devices:
    summary: "Gets all peripheral devices attached to Sofie (GET /devices)"
    send: { method: GET, path: "/api/v1.0/devices" }
    expect: { status: [200, 201, 202], json_path: "$" }
    returns: value
  get_device:
    summary: "Gets a specified peripheral device (GET /devices/{deviceId})"
    params:
      device: { type: string, max_length: 256, required: true, label: "Device", description: "The peripheral device's ID." }
    send: { method: GET, path: "/api/v1.0/devices/{device}" }
    expect: { status: [200, 201, 202], json_path: "$" }
    returns: value
  device_action:
    summary: "Sends a command to a specified peripheral device (POST /devices/{deviceId}/action)"
    params:
      device: { type: string, max_length: 256, required: true, label: "Device", description: "The peripheral device's ID." }
      body: { type: json, required: true, label: Body, description: "The JSON body the Sofie API documents for this request: Contains the action to perform." }
    send: { method: POST, path: "/api/v1.0/devices/{device}/action", content_type: application/json, body: '{body}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  get_blueprints:
    summary: "Returns all blueprints available in Sofie (GET /blueprints)"
    send: { method: GET, path: "/api/v1.0/blueprints" }
    expect: { status: [200, 201, 202], json_path: "$" }
    returns: value
  get_blueprint:
    summary: "Returns some information about the specified blueprint (GET /blueprints/{blueprintId})"
    params:
      blueprint: { type: string, max_length: 256, required: true, label: "Blueprint", description: "The blueprint's ID." }
    send: { method: GET, path: "/api/v1.0/blueprints/{blueprint}" }
    expect: { status: [200, 201, 202], json_path: "$" }
    returns: value
  get_playlists:
    summary: "Returns all playlists available in Sofie (GET /playlists)"
    send: { method: GET, path: "/api/v1.0/playlists" }
    expect: { status: [200, 201, 202], json_path: "$" }
    returns: value
  activate_playlist:
    summary: "Activates a Playlist (PUT /playlists/{playlistId}/activate)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      rehearsal: { type: bool, default: false, label: "Rehearsal", description: "The rehearsal. Sent as false unless given." }
    send: { method: PUT, path: "/api/v1.0/playlists/{playlist}/activate", content_type: application/json, body: '{"rehearsal":{rehearsal}}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  deactivate_playlist:
    summary: "Deactivates a Playlist (PUT /playlists/{playlistId}/deactivate)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
    send: { method: PUT, path: "/api/v1.0/playlists/{playlist}/deactivate" }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  activate_adlib_testing:
    summary: "Activates AdLib testing mode (PUT /playlists/{playlistId}/rundowns/{rundownId}/activate-adlib-testing)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      rundown: { type: string, max_length: 256, required: true, label: "Rundown", description: "The rundown's ID." }
    send: { method: PUT, path: "/api/v1.0/playlists/{playlist}/rundowns/{rundown}/activate-adlib-testing" }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  execute_adlib:
    summary: "Executes the requested AdLib/AdLib Action. This is a \"planned\" AdLib (Action) that has been produced by the blueprints during the ingest process (POST /playlists/{playlistId}/execute-adlib)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      body: { type: json, required: true, label: Body, description: "The JSON body the Sofie API documents for this request: Executes the requested AdLib/AdLib Action. This is a \"planned\" AdLib (Action) that has been produced by the blueprints during the ingest process." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/execute-adlib", content_type: application/json, body: '{body}' }
    expect: { status: [200, 201, 202], json_path: "$" }
    returns: value
  execute_bucket_adlib:
    summary: "Executes the requested Bucket AdLib/AdLib Action. This is a Bucket AdLib (Action) that has been previously inserted into a Bucket (POST /playlists/{playlistId}/execute-bucket-adlib)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      bucket_id: { type: string, max_length: 1024, required: true, label: "Bucket id", description: "Bucket to execute the adlib from" }
      external_id: { type: string, max_length: 1024, required: true, label: "External id", description: "External Id of the Bucket AdLib to execute" }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/execute-bucket-adlib", content_type: application/json, body: '{"bucketId":{bucket_id:json},"externalId":{external_id:json}}' }
    expect: { status: [200, 201, 202], json_path: "$" }
    returns: value
  execute_bucket_adlib_with_action_type:
    summary: "Executes the requested Bucket AdLib/AdLib Action. This is a Bucket AdLib (Action) that has been previously inserted into a Bucket, with action type (POST /playlists/{playlistId}/execute-bucket-adlib)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      bucket_id: { type: string, max_length: 1024, required: true, label: "Bucket id", description: "Bucket to execute the adlib from" }
      external_id: { type: string, max_length: 1024, required: true, label: "External id", description: "External Id of the Bucket AdLib to execute" }
      action_type: { type: string, max_length: 1024, required: true, label: "Action type", description: "An actionType string to specify a particular variation for the AdLibAction, valid strings are to be read from the status API" }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/execute-bucket-adlib", content_type: application/json, body: '{"bucketId":{bucket_id:json},"externalId":{external_id:json},"actionType":{action_type:json}}' }
    expect: { status: [200, 201, 202], json_path: "$" }
    returns: value
  move_next_part:
    summary: "Moves the next point by delta places. Negative values are allowed to move \"backwards\" in the script (POST /playlists/{playlistId}/move-next-part)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      delta: { type: int, min: -1000, max: 999999999999999, required: true, label: "Delta", description: "Amount to move next point by (+/-). If delta results in an index that is greater than the number of Parts available, no action will be taken." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/move-next-part", content_type: application/json, body: '{"delta":{delta}}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  move_next_segment:
    summary: "Moves the next Segment point by delta places. Negative values are allowed to move \"backwards\" in the script (POST /playlists/{playlistId}/move-next-segment)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      delta: { type: int, min: -1000, max: 999999999999999, required: true, label: "Delta", description: "Amount to move next Segment point by (+/-). If delta results in an index that is greater than the number of Segments available, no action will be taken." }
      ignore_quick_loop: { type: bool, default: false, label: "Ignore quick loop", description: "When true, the operation will ignore any boundaries set by the QuickLoop feature when moving to the next part Sent as false unless given." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/move-next-segment", content_type: application/json, body: '{"delta":{delta},"ignoreQuickLoop":{ignore_quick_loop}}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  reload_playlist:
    summary: "Reloads a Playlist from its ingest source (e.g. MOS/Spreadsheet etc.) (PUT /playlists/{playlistId}/reload-playlist)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
    send: { method: PUT, path: "/api/v1.0/playlists/{playlist}/reload-playlist" }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  reset_playlist:
    summary: "Resets a Playlist back to its pre-played state (PUT /playlists/{playlistId}/reset-playlist)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
    send: { method: PUT, path: "/api/v1.0/playlists/{playlist}/reset-playlist" }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  set_next_part:
    summary: "Sets the next Part to a given PartId (PUT /playlists/{playlistId}/set-next-part)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      part_id: { type: string, max_length: 1024, required: true, label: "Part id", description: "Part to set as next." }
    send: { method: PUT, path: "/api/v1.0/playlists/{playlist}/set-next-part", content_type: application/json, body: '{"partId":{part_id:json}}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  set_next_segment:
    summary: "Sets the next part to the first playable Part of the Segment with given segmentId (POST /playlists/{playlistId}/set-next-segment)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      segment_id: { type: string, max_length: 1024, required: true, label: "Segment id", description: "Segment to set as next." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/set-next-segment", content_type: application/json, body: '{"segmentId":{segment_id:json}}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  queue_next_segment:
    summary: "Queue Segment with a given segmentId, so that the Next point will jump to that Segment when reaching the end of the currently playing Segment. If the part currently set as next is outside of the current segment, it will set the first part of the given segment as next (POST /playlists/{playlistId}/queue-next-segment)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      segment_id: { type: string, max_length: 1024, required: true, label: "Segment id", description: "Segment to queue." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/queue-next-segment", content_type: application/json, body: '{"segmentId":{segment_id:json}}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  clear_source_layers:
    summary: "Clears the target SourceLayers (PUT /playlists/{playlistId}/clear-sourcelayers)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      body: { type: json, required: true, label: Body, description: "The JSON body the Sofie API documents for this request: Clears the target SourceLayers." }
    send: { method: PUT, path: "/api/v1.0/playlists/{playlist}/clear-sourcelayers", content_type: application/json, body: '{body}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  take:
    summary: "Performs a take in the given Playlist (POST /playlists/{playlistId}/take)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/take", content_type: application/json, body: '{}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  take_with_from_part_instance_id:
    summary: "Performs a take in the given Playlist, with from part instance id (POST /playlists/{playlistId}/take)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      from_part_instance_id: { type: string, max_length: 1024, required: true, label: "From part instance id", description: "May be specified to ensure that multiple take requests from the same Part do not result in multiple takes." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/take", content_type: application/json, body: '{"fromPartInstanceId":{from_part_instance_id:json}}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  clear_source_layer:
    summary: "Clears the target SourceLayer. This endpoint is deprecated, use the clear-sourcelayers endpoint instead (DELETE /playlists/{playlistId}/sourceLayer/{sourceLayerId})"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      source_layer: { type: string, max_length: 256, required: true, label: "Source layer", description: "The source layer's ID." }
    send: { method: DELETE, path: "/api/v1.0/playlists/{playlist}/sourceLayer/{source_layer}" }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  recall_sticky:
    summary: "Recalls the last sticky Piece on the specified SourceLayer, if there is any (POST /playlists/{playlistId}/sourceLayer/{sourceLayerId}/sticky)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      source_layer: { type: string, max_length: 256, required: true, label: "Source layer", description: "The source layer's ID." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/sourceLayer/{source_layer}/sticky" }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  start_timer_countdown:
    summary: "Start a countdown timer (POST /playlists/{playlistId}/t-timers/{timerIndex}/countdown)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      timer: { type: int, min: 1, max: 3, required: true, label: "Timer", description: "The T-timer, 1 to 3." }
      duration: { type: int, min: 0, max: 999999999999999, required: true, label: "Duration", description: "Duration in seconds." }
      stop_at_zero: { type: bool, default: false, label: "Stop at zero", description: "Whether to stop the timer at zero. Sent as false unless given." }
      start_paused: { type: bool, default: false, label: "Start paused", description: "Whether to start the timer in a paused state. Sent as false unless given." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/t-timers/{timer}/countdown", content_type: application/json, body: '{"duration":{duration},"stopAtZero":{stop_at_zero},"startPaused":{start_paused}}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  start_timer_free_run:
    summary: "Start a free-running timer (POST /playlists/{playlistId}/t-timers/{timerIndex}/free-run)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      timer: { type: int, min: 1, max: 3, required: true, label: "Timer", description: "The T-timer, 1 to 3." }
      start_paused: { type: bool, default: false, label: "Start paused", description: "Whether to start the timer in a paused state. Sent as false unless given." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/t-timers/{timer}/free-run", content_type: application/json, body: '{"startPaused":{start_paused}}' }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  pause_timer:
    summary: "Pause a timer (POST /playlists/{playlistId}/t-timers/{timerIndex}/pause)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      timer: { type: int, min: 1, max: 3, required: true, label: "Timer", description: "The T-timer, 1 to 3." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/t-timers/{timer}/pause" }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  resume_timer:
    summary: "Resume a timer (POST /playlists/{playlistId}/t-timers/{timerIndex}/resume)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      timer: { type: int, min: 1, max: 3, required: true, label: "Timer", description: "The T-timer, 1 to 3." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/t-timers/{timer}/resume" }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  restart_timer:
    summary: "Restart a timer (POST /playlists/{playlistId}/t-timers/{timerIndex}/restart)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      timer: { type: int, min: 1, max: 3, required: true, label: "Timer", description: "The T-timer, 1 to 3." }
    send: { method: POST, path: "/api/v1.0/playlists/{playlist}/t-timers/{timer}/restart" }
    expect: { status: [200, 201, 202, 204] }
    returns: ack
  clear_timer_projection:
    summary: "Clear the projection state of a timer (POST /playlists/{playlistId}/t-timers/{timerIndex}/projected/clear)"
    params:
      playlist: { type: string, max_length: 256, required: true, label: "Playlist", description: "The playlist's ID." }
      timer: { type: int, min: 1, max: 3, required: true, label: "Timer", description: "The T-timer, 1 to 3." }
