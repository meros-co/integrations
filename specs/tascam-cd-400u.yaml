spec: 1
id: tascam-cd-400u
name: TASCAM CD-400U / CD-400UDAB CD and media players (RS-232C / TELNET protocol)
vendor: TASCAM
category: playback

# TEAC's RS-232C/TELNET protocol for the CD-400U and CD-400UDAB: the same ASCII commands on the RS-232C port and,
# with the IF-E100 Ethernet card fitted, on its Telnet server (TCP 23, a password asked first). On the network a
# message is the machine ID "0", a two-character command and its data, ended by CR LF; on RS-232C the same message
# is preceded by LF and ended by CR. Transport and preset commands are not acknowledged; sense commands are answered
# by a return command (the command with its top bit set); the player pushes F6 CHANGE STATUS when its transport,
# track or tuner station changes, F0 and F1 when its error or caution status changes, and F4 when it powers on.
# Functions of its own are the 7F vendor commands, answered by FF. Track numbers and minutes are sent as four digits
# in the order tens, ones, thousands, hundreds ("2301" is 123).
source:
  - title: "TASCAM CD-400U/CD-400UDAB CONTROL I/O Terminals RS-232C/TELNET Protocol Specifications, Ver. 1.21 (Nov. 2022)"
    author: TEAC Corporation
    url: https://tascam.com/wp-content/uploads/downloads/products/tascam/cd-400u/rs-232c_protocol_cd400u_v1.21_e.pdf
    note: >
      Manufacturer document (retrieved 2026-10-27), offered for download with a protocol use agreement that grants
      its use for developing compatible devices and software; nothing of it is copied here. RS-232C (4800-57600
      bit/s set on the unit, 8 data bits, no parity, 1 stop bit; RTS and CTS joined inside), command format on
      RS-232C (LF, ID, command, data, CR) and TELNET (ID, command, data, CR LF; the vendor command page shows LF CR),
      ID 0, the command sequence (no ACK, return commands, CHANGED STATUS, at least 100 ms between commands), the
      command and vendor command lists with the firmware each needs (search, clear, enter and back from 1.14), each
      command and return, the tuner's preset and frequency data (Ver. 1.20) and the vendor commands (device select,
      play area, enter, back).
  - title: "TASCAM CD-400U Owner's Manual"
    author: TEAC Corporation
    url: https://tascam.com/wp-content/uploads/downloads/products/tascam/cd-400u/cd-400u_om_es_vn.pdf
    note: >
      Manufacturer document. Serial Mode (RS-232C by default, or Ethernet with the card fitted, p.38); Baud Rate
      (4800, 9600 by default, 19200, 38400 or 57600 bit/s, p.38); the panel lock leaves RS-232C control working
      (p.22).
  - title: "TASCAM IF-E100 Reference Manual"
    author: TEAC Corporation
    url: https://tascam.com/wp-content/uploads/downloads/products/tascam/if-e100/if-e100_rm_e_vc.pdf
    note: >
      Manufacturer document. Serial Mode must be Ethernet to control a CD-400U over the card (p.4); a numeric
      password of up to 10 digits (p.5); Telnet on port 23, press Enter, "Enter Password", "Login Successful"; one
      connection at a time; changing a network setting drops the connection (p.8).
  - title: "TASCAM IF-E100 Product Spec Sheet (Jan. 2019)"
    author: TEAC Corporation
    url: https://tascam.com/wp-content/uploads/downloads/products/tascam/if-e100/if-e100_e-spec_om_va.pdf
    note: "Manufacturer document. Telnet, port 23, password of digits only, 400 by default."
  - title: "TASCAM IF-E100 Network Settings Owner's Manual V1.1.0"
    author: TEAC Corporation
    url: https://tascam.com/wp-content/uploads/downloads/products/tascam/if-e100/if-e100_network-settings_om_e_vb.pdf
    note: "Manufacturer document. Initializing the card replaces the password with a unique one, shown on the unit (p.13)."

transport:
  type: line-tcp
  port: 23
  framing: terminated
  terminator: crlf
  encoding: utf-8
  timeout_ms: 3000
  reply: expected
  # A reply is a return command, which has its top bit set (8F to FF): an echo of a command sent (00 to 7F) is
  # never taken for one.
  reply_match: "^0[89A-F][0-9A-F]"
  error_match: "^0F2$"
  probe: "00F"
  # At least 100 ms between commands.
  pacing:
    min_interval_ms: 100

settings:
  password: { type: string, secret: true, max_length: 10, default: "400", label: Password,
    description: "The IF-E100 card's Telnet password, digits only, set on the unit's Network Set. > Password screen; 400 by default, and a unique one after the card is initialized." }

# Enter first, then the password at "Enter Password", on the network only. TEAC documents no answer to a wrong
# password.
on_connect:
  - send: ""
  - after_prompt: "Enter Password"
    send: "{settings.password}"

ports:
  - { port: 23, protocol: tcp, role: control, note: "the Telnet server of the IF-E100 Ethernet card (sold separately); one connection at a time" }

models:
  - id: cd-400u
    name: TASCAM CD-400U (CD, SD, USB, Bluetooth, FM and AM tuner)
    supports: [stop, play, ready, search, eject, skip, locate_track, select_preset, set_resume, get_resume, set_repeat,
      get_repeat, set_incremental_play, get_incremental_play, clear, set_remote_local, get_remote_local, set_play_mode,
      get_play_mode, get_status, get_track_number, get_media_status, get_track_info, get_time, get_totals, get_error,
      get_caution, get_information, select_device, get_device, set_play_area, get_play_area, enter, back]
    verification: none
  - id: cd-400udab
    name: TASCAM CD-400UDAB (CD, SD, USB, Bluetooth, DAB+ and FM tuner)
    supports: [stop, play, ready, search, eject, skip, locate_track, select_preset, set_resume, get_resume, set_repeat,
      get_repeat, set_incremental_play, get_incremental_play, clear, set_remote_local, get_remote_local, set_play_mode,
      get_play_mode, get_status, get_track_number, get_media_status, get_track_info, get_time, get_totals, get_error,
      get_caution, get_information, select_device_dab, get_device, set_play_area, get_play_area, enter, back]
    verification: none

