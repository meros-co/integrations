  device_dab: { sd: "00", usb: "10", cd: "11", bluetooth: "20", dab: "30", fm: "31", aux: "40" }
  play_area: { all: "00", folder: "01", folder_skip: "0F" }
  back: { push: "01", hold: "20" }

commands:
  stop:
    summary: Stop playback; with the tuner selected, switch between frequency and preset modes (10)
    send: "010"
    returns: none
  play:
    summary: Start playback from stop or playback standby (12)
    send: "012"
    returns: none
  ready:
    summary: Enter playback standby (14, data 01)
    send: "01401"
    returns: none
  search:
    summary: Search forward or back until stopped, played or readied; with FM or AM selected, seek the next station up or down (16)
    params:
      direction: { type: enum, values: [forward, reverse, forward_high, reverse_high], required: true, label: Direction,
        description: "forward or reverse at normal speed, forward_high or reverse_high at high speed; on the FM or AM tuner forward seeks up and reverse down." }
    send: "016{direction:map.search}"
    returns: none
  eject:
    summary: Eject the CD (18)
    send: "018"
    returns: none
  skip:
    summary: Skip to the next or previous track; on the tuner, step the frequency or the preset (1A)
    params:
      to: { type: enum, values: [next, previous], required: true, label: Skip to,
        description: "next or previous track (previous restarts the current track when more than a second into it); on the FM or AM tuner the next or previous frequency step, or preset in preset mode." }
    send: "01A{to:map.skip}"
    returns: none
  locate_track:
    summary: Go to a track by number; from stop it stays stopped at the track's start, otherwise the state is kept (23)
    params:
      track: { type: int, min: 1, max: 999, required: true, label: Track, description: "The track's number, 1-999 on SD, USB or data CDs, 1-99 on audio CDs." }
    send: "023{track:map.num}"
    returns: none
  select_preset:
    summary: Tune to a tuner preset (23, with the FM, AM or DAB source selected)
    params:
      preset: { type: int, min: 1, max: 20, required: true, label: Preset, description: "The tuner preset, 1-20." }
    send: "023{preset:02d}00"
    returns: none
  set_resume:
    summary: Turn resume playback on or off (34), then read it back
    params:
      enabled: &enabled { type: bool, required: true, label: Enabled, description: "On turns the function on, off turns it off." }
    send: ["034{enabled:map.onoff}", "034FF"]
    returns: none
  get_resume:
    summary: "Read resume playback (34 sense, answered B4): 00 off, 01 on"
    send: "034FF"
    expect: { reply_contains: "0B4", matches: "^0B4([0-9]{2})$" }
    returns: value
  set_repeat:
    summary: Turn repeat playback on or off (37), then read it back
    params: { enabled: *enabled }
    send: ["037{enabled:map.onoff}", "037FF"]
    returns: none
  get_repeat:
    summary: "Read repeat playback (37 sense, answered B7): 00 off, 01 on"
    send: "037FF"
    expect: { reply_contains: "0B7", matches: "^0B7([0-9]{2})$" }
    returns: value
  set_incremental_play:
    summary: Turn incremental playback on or off (3A), then read it back
    params: { enabled: *enabled }
    send: ["03A{enabled:map.onoff}", "03AFF"]
    returns: none
  get_incremental_play:
    summary: "Read incremental playback (3A sense, answered BA): 00 off, 01 on"
    send: "03AFF"
    expect: { reply_contains: "0BA", matches: "^0BA([0-9]{2})$" }
    returns: value
  clear:
    summary: Answer no to, or cancel, a message on the display, as the CLEAR key does (4A)
    send: "04A"
    returns: none
  set_remote_local:
    summary: Choose which of the front keys and the IR remote work beside RS-232C and Ethernet (4C), then read it back
    params:
      mode: { type: enum, values: [remote, local, serial_only, ir_disabled], required: true, label: Control,
        description: "remote (front keys off, IR remote on), local (everything on), serial_only (front keys and IR remote off) or ir_disabled (front keys on, IR remote off); RS-232C and Ethernet always work." }
    send: ["04C{mode:map.remote_local}", "04CFF"]
    returns: none
  get_remote_local:
    summary: "Read which controls are enabled (4C sense, answered CC): 00 remote, 01 local, 10 serial only, 11 IR remote off"
    send: "04CFF"
    expect: { reply_contains: "0CC", matches: "^0CC([0-9]{2})$" }
    returns: value
  set_play_mode:
    summary: Set continuous, single or random playback (4D), then read it back
    params:
      mode: { type: enum, values: [continuous, single, random], required: true, label: Play mode, description: "continuous, single (one track) or random playback." }
    send: ["04D{mode:map.play_mode}", "04E"]
    returns: none
  get_play_mode:
    summary: "Read the play mode (4E, answered CE): 00 continuous, 01 single, 06 random"
    send: "04E"
    expect: { reply_contains: "0CE", matches: "^0CE([0-9]{2})$" }
    returns: value
  get_status:
    summary: "Read the transport (50, answered D0): 00 no media, 01 ejecting, 10 stop, 11 play, 12 ready, 28 searching forward, 29 searching back, 81 record, 82 record ready, 83 writing, FF other"
    send: "050"
    expect: { reply_contains: "0D0", matches: "^0D0([0-9A-F]{2})$" }
    returns: value
  get_track_number:
    summary: "Read the current track, or the tuner preset (55, answered D5: the number's four digits); refused in tuner frequency mode"
    send: "055"
    expect: { reply_contains: "0D5", matches: "^0D5([0-9]{4,6})$" }
    returns: value
  get_media_status:
    summary: "Read whether media is loaded and its type (56, answered D6: 00 none or 01 loaded, then 00 CD-DA, SD or USB, or 10 data CD)"
    send: "056"
    expect: { reply_contains: "0D6", matches: "^0D6([0-9]{4})$" }
    returns: value
  get_track_info:
    summary: "Read the current track's number and length, or the tuner's preset and frequency or DAB station (57, answered D7)"
    send: "057"
    expect: { reply_contains: "0D7", matches: "^0D7([0-9A-Z ]{12})$" }
    returns: value
  get_time:
    summary: "Read a time of the current track or the disc (58, answered D8: the kind, minutes, seconds); all but elapsed only for audio CDs"
    params:
      kind: { type: enum, values: [elapsed, remaining, total_elapsed, total_remaining], required: true, label: Time,
        description: "elapsed or remaining in the track, or total_elapsed or total_remaining on the disc; remaining and the totals only on audio CDs, the totals not in random play." }
    send: "058{kind:map.time}"
    expect: { reply_contains: "0D8{kind:map.time}", matches: "^0D8[0-9]{2}([0-9]{8})$" }
    returns: value
  get_totals:
    summary: "Read the number of tracks and the disc's total time (5D, answered DD); the time only for audio CDs"
    send: "05D"
    expect: { reply_contains: "0DD", matches: "^0DD([0-9]{12})$" }
    returns: value
  get_error:
    summary: "Read the last error (78, answered F8): the code N1-N2N3 as four characters N2 N3 0 N1"
    send: "078"
    expect: { reply_contains: "0F8", matches: "^0F8([0-9A-F]{4})$" }
    returns: value
  get_caution:
    summary: "Read the last caution (79, answered F9): the code N1-N2N3 as four characters N2 N3 0 N1"
    send: "079"
    expect: { reply_contains: "0F9", matches: "^0F9([0-9A-F]{4})$" }
    returns: value
  get_information:
    summary: "Read the software version (0F, answered 8F): four digits, 0123 being 1.23"
    send: "00F"
    expect: { reply_contains: "08F", matches: "^08F([0-9]{4})$" }
    returns: value
  select_device:
    summary: Select the source (7F 01), then read it back
    params:
      device: { type: enum, values: [sd, usb, cd, bluetooth, fm, am, aux], required: true, label: Source,
        description: "sd, usb, cd, bluetooth, the fm or am tuner, or the aux input." }
    send: ["07F01{device:map.device}", "07F01FF"]
    returns: none
  select_device_dab:
    summary: Select the source (7F 01), then read it back
    params:
      device: { type: enum, values: [sd, usb, cd, bluetooth, dab, fm, aux], required: true, label: Source,
        description: "sd, usb, cd, bluetooth, the dab or fm tuner, or the aux input." }
    send: ["07F01{device:map.device_dab}", "07F01FF"]
    returns: none
  get_device:
    summary: "Read the source (7F 01 sense, answered FF 01): 00 SD, 10 USB, 11 CD, 20 Bluetooth, 30 FM (DAB on the CD-400UDAB), 31 AM (FM on the CD-400UDAB), 40 AUX"
    send: "07F01FF"
    expect: { reply_contains: "0FF01", matches: "^0FF01([0-9]{2})$" }
    returns: value
  set_play_area:
    summary: Play all tracks or the current folder (7F 07 4F), then read it back; refused for audio CDs
    params:
      area: { type: enum, values: [all, folder, folder_skip], required: true, label: Play area,
        description: "all tracks, the current folder, or the current folder in skip mode." }
    send: ["07F074F{area:map.play_area}", "07F074FFF"]
    returns: none
  get_play_area:
    summary: "Read the play area (7F 07 4F sense, answered FF 07 CF): 00 all, 01 folder, 0F folder in skip mode; refused for audio CDs"
    send: "07F074FFF"
    expect: { reply_contains: "0FF07CF", matches: "^0FF07CF([0-9A-F]{2})$" }
    returns: value
  enter:
    summary: "Press ENTER, as the MULTI JOG dial does: confirm a menu item, play a selected track or open a folder, or answer yes (7F 70 49)"
    send: "07F704901"
    returns: none
  back:
    summary: "Press or hold BACK [PAIRING]: leave a menu level or a folder; on Bluetooth, hold to pair or press to disconnect (7F 70 4A)"
    params:
      action: { type: enum, values: [push, hold], required: true, label: Action, description: "push presses the key; hold presses and holds it (Bluetooth pairing)." }
    send: "07F704A{action:map.back}"
    returns: none

quirks:
  - models: [all]
    severity: warning
    text: >
      Transport and preset commands are not acknowledged (the commands report unverified): a set is followed by its
      sense, whose answer updates state, and a command the player refuses is answered ILLEGAL (F2), which sets
      last_illegal in state. Some senses are refused in some states too: the track number in tuner frequency mode,
      the play area for audio CDs, and the remaining and total times for anything but an audio CD; the polls ask for
      them, so last_illegal can be set by a poll.
  - models: [all]
    severity: info
    text: >
      Ethernet control needs the IF-E100 card and the unit's Serial Mode set to Ethernet; RS-232C then stops
      answering, and with Serial Mode at RS-232C (the default) the card does not answer. The card takes one Telnet
      connection at a time, asks for its password after an Enter, and drops the connection when a network setting
      changes; TEAC documents no answer to a wrong password. The panel lock leaves RS-232C and Ethernet control
      working.
  - models: [all]
    severity: info
    text: >
      Track numbers and minutes travel as four digits in the order tens, ones, thousands, hundreds; the commands
      take plain numbers. Frames are not given: times are minutes and seconds. Search, clear, enter and back need
      firmware 1.14 or later; the protocol has no recording, dubbing, tuner frequency entry or volume commands.
  - models: [all]
    severity: info
    text: >
      With a tuner selected, track.number holds the preset, and the current track information carries the
      frequency (AM in kHz, FM in MHz) or the DAB channel and service in place of the track's length. The message
      does not say which source it describes, so its digits are written to track.length, tuner.am_khz and
      tuner.fm_mhz alike, each meaningful only while device is that source; a DAB station (a channel holding a
      letter) is told apart by its letter.
  - models: [cd-400udab]
    severity: info
    text: >
      On the CD-400UDAB the device codes 30 and 31 are DAB and FM (on the CD-400U, FM and AM); there is no AM
      tuner.

state:
  transport.status: { type: string, description: "The transport: no_media, ejecting, stop, play, ready, cue (searching forward), review (searching back), record, record_ready, writing or other (D0)" }
  track.number: { type: int, description: "The current track, numbered from 1, or with a tuner selected the preset; 0 with none (D5)" }
  track.eom: { type: bool, description: "True while the end-of-track warning shows, when the player gives it (D5's six-digit form; inferred)" }
  track.length: { type: string, description: "The current track's length, MMMM:SS (D7), while device is sd, usb or cd" }
  tuner.am_khz: { type: int, unit: kHz, description: "The AM frequency (D7), meaningful while device is am" }
  tuner.fm_mhz: { type: float, unit: MHz, description: "The FM frequency (D7), meaningful while device is fm" }
  tuner.dab_channel: { type: string, description: "The DAB channel, such as 12B (D7), while device is dab" }
  tuner.dab_service: { type: int, description: "The DAB service number on the channel (D7), while device is dab" }
  media.loaded: { type: bool, description: "Whether media is loaded in the current source (D6)" }
  media.type: { type: string, description: "audio (CD-DA, SD or USB) or data_cd (CD-ROM) (D6)" }
  time.elapsed: { type: string, description: "Elapsed time in the track, MMMM:SS (D8 00)" }
  time.remaining: { type: string, description: "Remaining time in the track, MMMM:SS (D8 01, audio CDs only)" }
  time.total_elapsed: { type: string, description: "Elapsed time on the disc, MMMM:SS (D8 02, audio CDs only)" }
  time.total_remaining: { type: string, description: "Remaining time on the disc, MMMM:SS (D8 03, audio CDs only)" }
  tracks.total: { type: int, description: "Tracks on the media (DD)" }
  tracks.total_time: { type: string, description: "The disc's total time, MMMM:SS; 0000:00 for anything but an audio CD (DD)" }
  resume: { type: bool, description: "Resume playback on (B4)" }
  repeat: { type: bool, description: "Repeat playback on (B7)" }
  incremental_play: { type: bool, description: "Incremental playback on (BA)" }
  remote_local: { type: string, description: "remote, local, serial_only or ir_disabled (CC)" }
  play_mode: { type: string, description: "continuous, single or random (CE)" }
  version: { type: string, description: "The software version, such as 1.23 (8F)" }
  powered_on: { type: bool, description: "Set when the player reports it has powered on (F4)" }
  error.code: { type: string, description: "The last error as N1-N2N3; 0-00 for none (F8)" }
  error.text: { type: string, description: "The last error: none, dubbing_error, device_error or other_error (F8)" }
  caution.code: { type: string, description: "The last caution as N1-N2N3; 0-00 for none (F9)" }
  caution.text: { type: string, description: "The last caution: none, media_error, media_full, write_protected, not_executed, cannot_select, name_full, decode_error, media_not_match or other (F9)" }
  last_illegal: { type: bool, description: "True once the player has answered a command ILLEGAL (F2)" }
  device: { type: string, description: "The current source: sd, usb, cd, bluetooth, fm, am (CD-400U), dab (CD-400UDAB) or aux (FF01)" }
  play_area: { type: string, description: "all, folder or folder_skip (FF07CF)" }

telemetry:
  poll:
    - every_ms: 1000
      send: ["050", "05800"]
    - every_ms: 5000
      send: ["055", "056", "057", "05801", "05802", "05803", "05D"]
    - every_ms: 30000
      send: ["00F", "034FF", "037FF", "03AFF", "04CFF", "04E", "078", "079", "07F01FF", "07F074FFF"]
  updates:
    - match: "^0F600$"
      then_send: ["050"]
    - match: "^0F603$"
      then_send: ["055", "057", "05D"]
    - match: "^0F0$"
      then_send: ["078"]
    - match: "^0F1$"
      then_send: ["079"]
    - match: "^0F2$"
      state: { last_illegal: "true" }
    - match: "^0F4$"
      state: { powered_on: "true" }
    - match: "^0D0([0-9A-F]{2})$"
      state:
        transport.status: { value: "{1}", map: { "00": no_media, "01": ejecting, "10": stop, "11": play, "12": ready, "28": cue,
          "29": review, "81": record, "82": record_ready, "83": writing, FF: other } }
    # The track's (or preset's) digits: tens, ones, thousands, hundreds; a six-digit answer has the EOM status first.
    - match: "^0D5([0-9])([0-9])([0-9])([0-9])$"
      state: { track.number: "{3}{4}{1}{2}" }
    - match: "^0D5(0[01])([0-9])([0-9])([0-9])([0-9])$"
      state:
        track.number: "{4}{5}{2}{3}"
        track.eom: { value: "{1}", map: { "00": false, "01": true } }
    - match: "^0D601([0-9]{2})$"
      state:
        media.loaded: "true"
        media.type: { value: "{1}", map: { "00": audio, "10": data_cd } }
    - match: "^0D600[0-9]{2}$"
      state: { media.loaded: "false" }
    # Track information: the number, then minutes (tens, ones, thousands, hundreds) and seconds; with a tuner,
    # the same digits are the AM kHz or the FM MHz to two decimals.
    - match: "^0D7([0-9])([0-9])([0-9])([0-9])([0-9])([0-9])([0-9])([0-9])([0-9])([0-9])00$"
      state:
        track.number: "{3}{4}{1}{2}"
        track.length: "{7}{8}{5}{6}:{9}{10}"
        tuner.am_khz: "{5}{6}{7}{8}{9}"
        tuner.fm_mhz: "{5}{6}{7}.{8}{9}"
    # DAB: the preset, the channel's three characters (one a letter), the service's two digits.
    - match: "^0D7([0-9])([0-9])00([0-9 ][0-9][A-Z])([0-9]{2})000$"
      state: { track.number: "{1}{2}", tuner.dab_channel: "{3}", tuner.dab_service: "{4}" }
    # Times: the kind, minutes (tens, ones, thousands, hundreds), seconds, frames (always 00).
    - match: "^0D800([0-9])([0-9])([0-9])([0-9])([0-9]{2})[0-9]{2}$"
      state: { time.elapsed: "{3}{4}{1}{2}:{5:02d}" }
    - match: "^0D801([0-9])([0-9])([0-9])([0-9])([0-9]{2})[0-9]{2}$"
      state: { time.remaining: "{3}{4}{1}{2}:{5:02d}" }
    - match: "^0D802([0-9])([0-9])([0-9])([0-9])([0-9]{2})[0-9]{2}$"
      state: { time.total_elapsed: "{3}{4}{1}{2}:{5:02d}" }
    - match: "^0D803([0-9])([0-9])([0-9])([0-9])([0-9]{2})[0-9]{2}$"
      state: { time.total_remaining: "{3}{4}{1}{2}:{5:02d}" }
    - match: "^0DD([0-9])([0-9])([0-9])([0-9])([0-9])([0-9])([0-9])([0-9])([0-9]{2})[0-9]{2}$"
      state: { tracks.total: "{3}{4}{1}{2}", tracks.total_time: "{7}{8}{5}{6}:{9:02d}" }
    - match: "^0B4([0-9]{2})$"
      state: { resume: { value: "{1}", map: &onoff { "00": false, "01": true } } }
    - match: "^0B7([0-9]{2})$"
      state: { repeat: { value: "{1}", map: *onoff } }
    - match: "^0BA([0-9]{2})$"
      state: { incremental_play: { value: "{1}", map: *onoff } }
    - match: "^0CC([0-9]{2})$"
      state: { remote_local: { value: "{1}", map: { "00": remote, "01": local, "10": serial_only, "11": ir_disabled } } }
    - match: "^0CE([0-9]{2})$"
      state: { play_mode: { value: "{1}", map: { "00": continuous, "01": single, "06": random } } }
    - match: "^08F([0-9]{2})([0-9])([0-9])$"
      state: { version: "{1}.{2}{3}" }
    # Error and caution codes N1-N2N3 arrive as N2 N3 0 N1.
    - match: "^0F8([0-9A-F])([0-9A-F])0([0-9A-F])$"
      state:
        error.code: "{3}-{1}{2}"
        error.text: { value: "{3}-{1}{2}", map: { "0-00": none, "1-01": dubbing_error, "1-02": device_error, "1-FF": other_error } }
    - match: "^0F9([0-9A-F])([0-9A-F])0([0-9A-F])$"
      state:
        caution.code: "{3}-{1}{2}"
        caution.text: { value: "{3}-{1}{2}", map: { "0-00": none, "1-02": media_error, "1-06": media_full, "1-0C": write_protected,
          "1-0D": not_executed, "1-13": cannot_select, "1-16": name_full, "1-1E": decode_error, "1-1F": media_not_match, "1-FF": other } }
    - models: [cd-400u]
      match: "^0FF01([0-9]{2})$"
      state: { device: { value: "{1}", map: { "00": sd, "10": usb, "11": cd, "20": bluetooth, "30": fm, "31": am, "40": aux } } }
    - models: [cd-400udab]
      match: "^0FF01([0-9]{2})$"
      state: { device: { value: "{1}", map: { "00": sd, "10": usb, "11": cd, "20": bluetooth, "30": dab, "31": fm, "40": aux } } }
    - match: "^0FF07CF([0-9A-F]{2})$"
      state: { play_area: { value: "{1}", map: { "00": all, "01": folder, "0F": folder_skip } } }
