  voting.seats.*.final_selection: { type: int, description: "Button the seat chose in the completed vote (open votes only)" }
  voting.buttons.*.interim_count: { type: int, description: "Votes for the button so far (open votes only)" }
  voting.buttons.*.final_count: { type: int, description: "Votes for the button in the completed vote" }
  voting.results_shared: { type: bool, description: "Results shown on the conference units" }

telemetry:
  # GET ALL on connecting; every change is pushed after that.
  poll:
    send: ["GET ALL"]
  updates:
    - match: "^< REP MODEL \\{?(.*?) *\\}? >$"
      state: { "device.model": "{1}" }
    - match: "^< REP DEVICE_ID \\{?(.*?) *\\}? >$"
      state: { "device.device_id": "{1}" }
    - match: "^< REP FLASH (ON|OFF) >$"
      state: { "device.flash": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) FLASH (ON|OFF) >$"
      state: { "seats.{1}.flash": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP RF_POWER ([A-Z]+) >$"
      state: { "device.rf_power": "{1}" }
    - match: "^< REP (\\d+) MIC_STATUS (ON|OFF) >$"
      state: { "seats.{1}.mic": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) EXCLUSIVE_MUTE (ON|OFF) >$"
      state: { "seats.{1}.exclusive_mute": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP GLOBAL_MUTE (ON|OFF) >$"
      state: { "device.global_mute": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) REQUEST_LIST_STATUS (IN_LIST|NOT_IN_LIST) >$"
      state: { "seats.{1}.in_request_list": "{2}" }
    - match: "^< REP (\\d+) SPEAK_LIST_STATUS (IN_LIST|NOT_IN_LIST) >$"
      state: { "seats.{1}.in_speak_list": "{2}" }
    - match: "^< REP MAX_TOTAL_SPEAKERS (\\d+) >$"
      state: { "device.max_speakers": "{1}" }
    - match: "^< REP MAX_DELEGATE_SPEAKERS (\\d+) >$"
      state: { "device.max_delegate_speakers": "{1}" }
    - match: "^< REP MAX_NUM_REQUESTS (\\d+) >$"
      state: { "device.max_requests": "{1}" }
    - match: "^< REP OPERATION_MODE ([A-Z]+) >$"
      state: { "device.discussion_mode": "{1}" }
    - match: "^< REP INTERRUPT_MODE ([A-Z_]+) >$"
      state: { "device.interrupt_mode": "{1}" }
    - match: "^< REP (\\d+) MIC_PRIORITY (\\d+) >$"
      state: { "seats.{1}.priority": "{2}" }
    - match: "^< REP (\\d+) ROLE ([A-Z_]+) >$"
      state: { "seats.{1}.role": "{2}" }
    - match: "^< REP (\\d+) SEAT_NAME \\{?(.*?) *\\}? >$"
      state: { "seats.{1}.name": "{2}" }
    - match: "^< REP (\\d+) UNIT_AVAILABLE ([A-Z_]+) >$"
      state: { "seats.{1}.unit_available": "{2}" }
    - match: "^< REP AUDIO_INPUT_SPEAKLIST (ON|OFF) >$"
      state: { "device.audio_input_speaklist": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP WDU_LOCK_WELCOME (ENABLED|DISABLED) >$"
      state: { "device.welcome_lock": "{1}" }
    - match: "^< REP RETAIN_SEAT_PERSISTENCE (ENABLED|DISABLED) >$"
      state: { "device.retain_seats": "{1}" }
    - match: "^< REP LOUDSPEAKER_VOLUME (0\\d\\d) >$"
      state: { "device.loudspeaker_volume": "{1:-30}" }
    - match: "^< REP (\\d+) MIC_GAIN (0\\d\\d) >$"
      state: { "seats.{1}.mic_gain": "{2:-30}" }
    - match: "^< REP (\\d+) DANTE_INPUT_GAIN (0\\d\\d) >$"
      state: { "dante.{1}.dante_input_gain": "{2:-30}" }
    - match: "^< REP (\\d+) DANTE_OUTPUT_GAIN (0\\d\\d) >$"
      state: { "dante.{1}.dante_output_gain": "{2:-30}" }
    - match: "^< REP (\\d+) AUX_INPUT_GAIN (\\d{1,3}) >$"
      state: { "aux.{1}.input_gain": "{2:-30}" }
    - match: "^< REP (\\d+) AUX_OUTPUT_GAIN (\\d{1,3}) >$"
      state: { "aux.{1}.output_gain": "{2:-30}" }
    - match: "^< REP (\\d+) AUX_INPUT_PAD (ON|OFF) >$"
      state: { "aux.{1}.input_pad": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) AUX_INPUT_AGC (ON|OFF) >$"
      state: { "aux.{1}.input_agc": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) AUX_INPUT_MUTE (ON|OFF) >$"
      state: { "aux.{1}.input_mute": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) AUX_OUTPUT_MUTE (ON|OFF) >$"
      state: { "aux.{1}.output_mute": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) DANTE_INPUT_AGC (ON|OFF) >$"
      state: { "dante.{1}.input_agc": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) DANTE_INPUT_MUTE (ON|OFF) >$"
      state: { "dante.{1}.input_mute": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) DANTE_OUTPUT_MUTE (ON|OFF) >$"
      state: { "dante.{1}.output_mute": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) MIC_AGC (ON|OFF) >$"
      state: { "seats.{1}.mic_agc": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) BATT_CHARGE (0\\d\\d|100) >$"
      state: { "seats.{1}.battery_charge": "{2}" }
    - match: "^< REP (\\d+) BATT_RUN_TIME (\\d{5}) >$"
      state: { "seats.{1}.battery_minutes": "{2}" }
    - match: "^< REP (\\d+) BATT_CYCLE (\\d{4}) >$"
      state: { "seats.{1}.battery_cycles": "{2}" }
    - match: "^< REP (\\d+) BATT_HEALTH (0\\d\\d|100) >$"
      state: { "seats.{1}.battery_health": "{2}" }
    - match: "^< REP AUDIO_METER_RATE (\\d+) >$"
      state: { "device.audio_meter_rate": "{1}" }
    - match: "^< REP RF_METER_RATE (\\d+) >$"
      state: { "device.rf_meter_rate": "{1}" }
    - match: "^< AUDIO_SAMPLE (\\d{3}) (\\d{3})((?: \\d{3} \\d{3})*) >$"
      match_each: "(\\d{3}) (\\d{3})"
      match_each_in: 3
      state: { meters.aux_input_peak: "{1:-98}", meters.aux_input_rms: "{2:-98}", "meters.slots.{index:+1}.peak": "{4:-98}", "meters.slots.{index:+1}.rms": "{5:-98}" }
    - match: "^< REP (\\d+) RSSI (\\S+) >$"
      state: { "seats.{1}.rssi": "{2}" }
    - match: "^< REP VOTING_CONFIGURATION (\\d+) >$"
      state: { "device.voting_configuration": "{1}" }
    - match: "^< REP VOTING_STATE ([A-Z]+) >$"
      state: { "device.voting_state": "{1}" }
    - match: "^< REP (\\d+) VOTING_CONFIGURATION_NAME \\{?(.*?) *\\}? >$"
      state: { "voting.configurations.{1}.name": "{2}" }
    - match: "^< REP (\\d+) (\\d+) VOTING_BUTTON_NAME \\{?(.*?) *\\}? >$"
      state: { "voting.configurations.{1}.buttons.{2}.name": "{3}" }
    - match: "^< REP (\\d+) INTERIM_VOTING_SELECTION (\\d+) >$"
      state: { "voting.seats.{1}.interim_selection": "{2}" }
    - match: "^< REP (\\d+) FINAL_VOTING_SELECTION (\\d+) >$"
      state: { "voting.seats.{1}.final_selection": "{2}" }
    - match: "^< REP (\\d+) INTERIM_VOTING_RESULT (\\d+) >$"
      state: { "voting.buttons.{1}.interim_count": "{2}" }
    - match: "^< REP (\\d+) FINAL_VOTING_RESULT (\\d+) >$"
      state: { "voting.buttons.{1}.final_count": "{2}" }
    - match: "^< REP SHARE_VOTING_RESULTS TRUE >$"
      state: { voting.results_shared: "true" }
    - match: "^< REP CLOSE_VOTING_RESULTS TRUE >$"
      state: { voting.results_shared: "false" }

quirks:
  - models: [all]
    severity: info
    text: >
      One GET ALL on connecting reads every parameter; the access point reports every change after
      that, so nothing is polled. Opened for commands only, nothing is asked. Meters
      (AUDIO_METER_RATE, RF_METER_RATE) are never started here; a consumer that sets a rate gets
      them in state.
  - models: [all]
    severity: info
    text: >
      Commands are matched to their REP by the parameter name, not by the seat: a change to the same
      parameter on another seat arriving in the same moment could be taken for the answer. Several
      commands answer with other parameters (a speak request with SPEAK_LIST_STATUS or
      REQUEST_LIST_STATUS, a vote start with VOTING_STATE): their answers go to state, and the
      command reports unverified. A seat that is offline may not answer at all; a registered seat
      that is unavailable answers UNKNOWN.
  - models: [all]
    severity: critical
    text: >
      turn_off_units turns every conference unit off, start_vote, complete_vote and cancel_vote
      change a vote in progress, and set_role to DUAL_DELEGATE brings a second seat online (setting
      it back deregisters that seat). None can be undone from here.
  - models: [all]
    severity: info
    text: >
      SEAT_NAME takes UTF-8 except { } < >, up to 128 bytes, and is reported padded to 128 bytes; an
      NFC card's name overrides it, and setting it while a card is inserted answers REP ERR. Gains
      are whole dB: MIC_GAIN, DANTE_INPUT_GAIN and AUX_INPUT_GAIN -30 to +10, DANTE_OUTPUT_GAIN and
      AUX_OUTPUT_GAIN -30 to 0, LOUDSPEAKER_VOLUME -30 to +6.
