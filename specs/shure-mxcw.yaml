spec: 1
id: shure-mxcw
name: "Shure Microflex Complete Wireless (MXCWAPT access point)"
vendor: Shure
category: other

# The MXCWAPT's command strings on TCP 2202: GET, SET and REP in angle
# brackets, a REP pushed whenever a value changes on the access point, its web
# application or a conference unit. Seats are the conference units, numbered
# from 1; 0 is every seat where the document allows it. The MXCWNCS charging
# station is in shure-chargers.
source:
  - title: "MXCW Command Strings, Version 8.1 (2021-K)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/MXCW/en-US"
    note: >
      Manufacturer document (PDF docId 6944, page numbers the PDF's). TCP 2202, GET/SET/REP/SAMPLE,
      REP on change, REP ERR, UNKNOWN for an unavailable seat, index ranges p.3; MIC_STATUS,
      SPEAK_REQUEST, SPEAK_RELEASE, ALL_DELEGATE_MIC_OFF, EXCLUSIVE_MUTE, GLOBAL_MUTE,
      REQUEST_LIST_STATUS, SPEAK_LIST_STATUS, CLEAR_REQUEST_LIST, NEXT_MIC_ON, MAX_TOTAL_SPEAKERS,
      MAX_DELEGATE_SPEAKERS, MAX_NUM_REQUESTS, OPERATION_MODE, INTERRUPT_MODE, MIC_PRIORITY p.4-11;
      LOUDSPEAKER_VOLUME (000-036, minus 30), AUX_INPUT_PAD, AUX_INPUT_GAIN (000-040),
      AUX_OUTPUT_GAIN (000-030), MIC_GAIN, DANTE_INPUT_GAIN, DANTE_OUTPUT_GAIN, the AGC and mute
      switches p.12-18; FLASH, ROLE, SEAT_NAME, RF_POWER, DEVICE_ID, ALL, BATT_CHARGE,
      BATT_RUN_TIME, BATT_CYCLE, BATT_HEALTH, UNIT_AVAILABLE p.18-26; AUDIO_METER_RATE with
      AUDIO_SAMPLE (000-098, minus 98) and RF_METER_RATE with RSSI p.26-27; AUX mutes, MODEL
      p.27-28; voting START_VOTE to CLOSE_VOTING_RESULTS p.28-39; AUDIO_INPUT_SPEAKLIST, WDU_OFF,
      WDU_LOCK_WELCOME, WELCOME_LOCK_RESET, RETAIN_SEAT_PERSISTENCE p.39-41.

transport:
  type: line-tcp
  port: 2202
  framing: delimited
  open: "< "
  close: " >"
  encoding: utf-8
  timeout_ms: 2000
  reply: expected
  # Answers and change reports are both REP: commands name the parameter
  # their REP carries (expect.reply_contains). AUDIO_SAMPLE is never a reply.
  reply_match: "^< REP "
  error_match: "^< REP ERR"
  probe: "GET MODEL"

ports:
  - { port: 2202, protocol: tcp, role: control }

models:
  - id: mxcwapt
    name: "Shure MXCWAPT access point (Microflex Complete Wireless conference system)"
    supports:
      - get_model
      - get_device_id
      - set_device_id
      - get_flash
      - set_flash
      - get_seat_flash
      - set_seat_flash
      - get_rf_power
      - set_rf_power
      - get_all
      - get_mic
      - set_mic
      - request_to_speak
      - release_speaker
      - all_delegate_mics_off
      - clear_request_list
      - next_mic_on
      - turn_off_units
      - reset_welcome_lock
      - set_exclusive_mute
      - get_global_mute
      - set_global_mute
      - get_in_request_list
      - get_in_speak_list
      - get_max_speakers
      - set_max_speakers
      - get_max_delegate_speakers
      - set_max_delegate_speakers
      - get_max_requests
      - set_max_requests
      - get_discussion_mode
      - set_discussion_mode
      - get_interrupt_mode
      - set_interrupt_mode
      - get_priority
      - set_priority
      - get_role
      - set_role
      - get_seat_name
      - set_seat_name
      - get_unit_available
      - get_audio_input_speaklist
      - set_audio_input_speaklist
      - get_welcome_lock
      - set_welcome_lock
      - get_retain_seats
      - set_retain_seats
      - get_loudspeaker_volume
      - set_loudspeaker_volume
      - get_mic_gain
      - set_mic_gain
      - get_dante_input_gain
      - set_dante_input_gain
      - get_dante_output_gain
      - set_dante_output_gain
      - get_aux_input_gain
      - set_aux_input_gain
      - get_aux_output_gain
      - set_aux_output_gain
      - get_aux_input_pad
      - set_aux_input_pad
      - get_aux_input_agc
      - set_aux_input_agc
      - get_aux_input_mute
      - set_aux_input_mute
      - get_aux_output_mute
      - set_aux_output_mute
      - get_dante_input_agc
      - set_dante_input_agc
      - get_dante_input_mute
      - set_dante_input_mute
      - get_dante_output_mute
      - set_dante_output_mute
      - get_mic_agc
      - set_mic_agc
      - get_battery_charge
      - get_battery_minutes
      - get_battery_cycles
      - get_battery_health
      - get_audio_meter_rate
      - set_audio_meter_rate
      - get_rf_meter_rate
      - set_rf_meter_rate
      - start_vote
      - complete_vote
      - pause_vote
      - resume_vote
      - cancel_vote
      - share_voting_results
      - close_voting_results
      - get_voting_configuration
      - get_voting_state
      - get_voting_configuration_name
      - get_voting_button_name
      - get_final_voting_selection
      - get_final_voting_results
    verification: none

commands:
  get_model:
    summary: "Read the model (MODEL)"
    send: "GET MODEL"
    expect: { reply_contains: " MODEL ", matches: " MODEL \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  get_device_id:
    summary: "Read the device ID (DEVICE_ID)"
    send: "GET DEVICE_ID"
    expect: { reply_contains: " DEVICE_ID ", matches: " DEVICE_ID \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_device_id:
    summary: "Set the device ID (DEVICE_ID)"
    params:
      value: { type: string, required: true, max_length: 31, pattern: "^[A-Za-z0-9-]+$", label: "Device ID", description: "1 to 31 letters, digits and hyphens, not starting or ending with a hyphen." }
    send: "SET DEVICE_ID \\{{value}\\}"
    expect: { reply_contains: " DEVICE_ID ", contains: " DEVICE_ID " }
    returns: ack
  get_flash:
    summary: "Read the access point's identify flash (FLASH)"
    send: "GET FLASH"
    expect: { reply_contains: " FLASH ", matches: " FLASH \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_flash:
    summary: "Turn the access point's identify flash on or off (FLASH)"
    params:
      enabled: { type: bool, required: true, label: "Flash", description: "On flashes the access point's lights, off stops them." }
    send: "SET FLASH {enabled:on_off}"
    expect: { reply_contains: " FLASH ", contains: " FLASH " }
    returns: ack
  get_seat_flash:
    summary: "Read a conference unit's identify flash (FLASH)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
    send: "GET {seat} FLASH"
    expect: { reply_contains: " FLASH ", matches: " FLASH \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_seat_flash:
    summary: "Turn a conference unit's identify flash on or off (FLASH)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
      enabled: { type: bool, required: true, label: "Flash", description: "On flashes the unit's lights, off stops them." }
    send: "SET {seat} FLASH {enabled:on_off}"
    expect: { reply_contains: " FLASH ", contains: " FLASH " }
    returns: ack
  get_rf_power:
    summary: "Read the RF power (RF_POWER)"
    send: "GET RF_POWER"
    expect: { reply_contains: " RF_POWER ", matches: " RF_POWER \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_rf_power:
    summary: "Set the RF power (RF_POWER)"
    params:
      value: { type: enum, values: ["OFF", "LOW", "MEDIUM", "HIGH", "MAXIMUM"], required: true, label: "RF power", description: "OFF, LOW, MEDIUM, HIGH or MAXIMUM." }
    send: "SET RF_POWER {value}"
    expect: { reply_contains: " RF_POWER ", contains: " RF_POWER " }
    returns: ack
  get_all:
    summary: "Ask for every parameter (GET ALL); the answers update state"
    send: "GET ALL"
    returns: none
  get_mic:
    summary: "Read a seat's microphone (MIC_STATUS)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
    send: "GET {seat} MIC_STATUS"
    expect: { reply_contains: " MIC_STATUS ", matches: " MIC_STATUS \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_mic:
    summary: "Turn a seat's microphone on or off (MIC_STATUS)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
      enabled: { type: bool, required: true, label: "Microphone on", description: "On turns the seat's microphone on, off turns it off." }
    send: "SET {seat} MIC_STATUS {enabled:on_off}"
    expect: { reply_contains: " MIC_STATUS ", contains: " MIC_STATUS " }
    returns: ack
  request_to_speak:
    summary: "Add a seat to the speaker or request list, as if its button were pressed (SPEAK_REQUEST)"
    params:
      seat: { type: int, min: 1, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1." }
    send: "SET {seat} SPEAK_REQUEST TRUE"
    returns: none
  release_speaker:
    summary: "Take a seat off the speaker or request list (SPEAK_RELEASE)"
    params:
      seat: { type: int, min: 1, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1." }
    send: "SET {seat} SPEAK_RELEASE TRUE"
    returns: none
  all_delegate_mics_off:
    summary: "Turn every delegate microphone off (ALL_DELEGATE_MIC_OFF)"
    send: "SET ALL_DELEGATE_MIC_OFF TRUE"
    returns: none
  clear_request_list:
    summary: "Clear the request list (CLEAR_REQUEST_LIST)"
    send: "SET CLEAR_REQUEST_LIST TRUE"
    returns: none
  next_mic_on:
    summary: "Turn on the next microphone of the request list (NEXT_MIC_ON)"
    send: "SET NEXT_MIC_ON TRUE"
    returns: none
  turn_off_units:
    summary: "Turn every conference unit off (WDU_OFF)"
    send: "SET WDU_OFF TRUE"
    returns: none
  reset_welcome_lock:
    summary: "Reset the welcome lock of the conference units (WELCOME_LOCK_RESET)"
    send: "SET WELCOME_LOCK_RESET TRUE"
    returns: none
  set_exclusive_mute:
    summary: "Mute every other microphone from a chairman seat, or release it (EXCLUSIVE_MUTE)"
    params:
      seat: { type: int, min: 1, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1." }
      enabled: { type: bool, required: true, label: "Exclusive mute", description: "On mutes every other microphone, off releases them; only for a chairman seat." }
    send: "SET {seat} EXCLUSIVE_MUTE {enabled:on_off}"
    expect: { reply_contains: " EXCLUSIVE_MUTE ", contains: " EXCLUSIVE_MUTE " }
    returns: ack
  get_global_mute:
    summary: "Read the global mute (GLOBAL_MUTE)"
    send: "GET GLOBAL_MUTE"
    expect: { reply_contains: " GLOBAL_MUTE ", matches: " GLOBAL_MUTE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_global_mute:
    summary: "Turn the global mute on or off (GLOBAL_MUTE)"
    params:
      enabled: { type: bool, required: true, label: "Global mute", description: "On mutes every microphone, off releases this controller's hold (another controller may still hold it)." }
    send: "SET GLOBAL_MUTE {enabled:on_off}"
    expect: { reply_contains: " GLOBAL_MUTE ", contains: " GLOBAL_MUTE " }
    returns: ack
  get_in_request_list:
    summary: "Read whether a seat is in the request list (REQUEST_LIST_STATUS)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
    send: "GET {seat} REQUEST_LIST_STATUS"
    expect: { reply_contains: " REQUEST_LIST_STATUS ", matches: " REQUEST_LIST_STATUS \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  get_in_speak_list:
    summary: "Read whether a seat is in the speaker list (SPEAK_LIST_STATUS)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
    send: "GET {seat} SPEAK_LIST_STATUS"
    expect: { reply_contains: " SPEAK_LIST_STATUS ", matches: " SPEAK_LIST_STATUS \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  get_max_speakers:
    summary: "Read the most microphones on at once (MAX_TOTAL_SPEAKERS)"
    send: "GET MAX_TOTAL_SPEAKERS"
    expect: { reply_contains: " MAX_TOTAL_SPEAKERS ", matches: " MAX_TOTAL_SPEAKERS \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_max_speakers:
    summary: "Set the most microphones on at once (MAX_TOTAL_SPEAKERS)"
    params:
      value: { type: int, min: 1, max: 9, required: true, label: "Number", description: "A single digit, 1 to 9 (the document gives no range)." }
    send: "SET MAX_TOTAL_SPEAKERS {value}"
    expect: { reply_contains: " MAX_TOTAL_SPEAKERS ", contains: " MAX_TOTAL_SPEAKERS " }
    returns: ack
  get_max_delegate_speakers:
    summary: "Read the most delegate microphones on at once (MAX_DELEGATE_SPEAKERS)"
    send: "GET MAX_DELEGATE_SPEAKERS"
    expect: { reply_contains: " MAX_DELEGATE_SPEAKERS ", matches: " MAX_DELEGATE_SPEAKERS \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_max_delegate_speakers:
    summary: "Set the most delegate microphones on at once (MAX_DELEGATE_SPEAKERS)"
    params:
      value: { type: int, min: 1, max: 9, required: true, label: "Number", description: "A single digit, 1 to 9 (the document gives no range)." }
    send: "SET MAX_DELEGATE_SPEAKERS {value}"
    expect: { reply_contains: " MAX_DELEGATE_SPEAKERS ", contains: " MAX_DELEGATE_SPEAKERS " }
    returns: ack
  get_max_requests:
    summary: "Read the most requests in the request list (MAX_NUM_REQUESTS)"
    send: "GET MAX_NUM_REQUESTS"
    expect: { reply_contains: " MAX_NUM_REQUESTS ", matches: " MAX_NUM_REQUESTS \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_max_requests:
    summary: "Set the most requests in the request list (MAX_NUM_REQUESTS)"
    params:
      value: { type: int, min: 1, max: 9, required: true, label: "Number", description: "A single digit, 1 to 9 (the document gives no range)." }
    send: "SET MAX_NUM_REQUESTS {value}"
    expect: { reply_contains: " MAX_NUM_REQUESTS ", contains: " MAX_NUM_REQUESTS " }
    returns: ack
  get_discussion_mode:
    summary: "Read the discussion mode (OPERATION_MODE)"
    send: "GET OPERATION_MODE"
    expect: { reply_contains: " OPERATION_MODE ", matches: " OPERATION_MODE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_discussion_mode:
    summary: "Set the discussion mode (OPERATION_MODE)"
    params:
      value: { type: enum, values: ["AUTO", "MANUAL", "FIFO", "HANDSFREE"], required: true, label: "Mode", description: "AUTO, MANUAL, FIFO or HANDSFREE." }
    send: "SET OPERATION_MODE {value}"
    expect: { reply_contains: " OPERATION_MODE ", contains: " OPERATION_MODE " }
    returns: ack
  get_interrupt_mode:
    summary: "Read who may interrupt a speaker (INTERRUPT_MODE)"
    send: "GET INTERRUPT_MODE"
    expect: { reply_contains: " INTERRUPT_MODE ", matches: " INTERRUPT_MODE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_interrupt_mode:
    summary: "Set who may interrupt a speaker (INTERRUPT_MODE)"
    params:
      value: { type: enum, values: ["NOT_ALLOWED", "HIGHER_PRIORITY", "EQUAL_AND_HIGHER_PRIORITY"], required: true, label: "Interrupt mode", description: "NOT_ALLOWED, HIGHER_PRIORITY or EQUAL_AND_HIGHER_PRIORITY." }
    send: "SET INTERRUPT_MODE {value}"
    expect: { reply_contains: " INTERRUPT_MODE ", contains: " INTERRUPT_MODE " }
    returns: ack
  get_priority:
    summary: "Read a seat's microphone priority (MIC_PRIORITY)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
    send: "GET {seat} MIC_PRIORITY"
    expect: { reply_contains: " MIC_PRIORITY ", matches: " MIC_PRIORITY \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_priority:
    summary: "Set a seat's microphone priority (MIC_PRIORITY)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
      value: { type: int, min: 0, max: 9, required: true, label: "Priority", description: "A single digit, 0 to 9 (the document gives no range)." }
    send: "SET {seat} MIC_PRIORITY {value}"
    expect: { reply_contains: " MIC_PRIORITY ", contains: " MIC_PRIORITY " }
    returns: ack
  get_role:
    summary: "Read a seat's role (ROLE)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
    send: "GET {seat} ROLE"
    expect: { reply_contains: " ROLE ", matches: " ROLE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_role:
    summary: "Set a seat's role (ROLE)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
      value: { type: enum, values: ["DELEGATE", "CHAIRMAN", "LISTENER", "AMBIENT", "REMOTE_CALLER", "DUAL_DELEGATE"], required: true, label: "Role", description: "DELEGATE, CHAIRMAN, LISTENER, AMBIENT, REMOTE_CALLER or DUAL_DELEGATE (which brings the next seat online)." }
    send: "SET {seat} ROLE {value}"
    expect: { reply_contains: " ROLE ", contains: " ROLE " }
    returns: ack
  get_seat_name:
    summary: "Read a seat's name (SEAT_NAME)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
    send: "GET {seat} SEAT_NAME"
    expect: { reply_contains: " SEAT_NAME ", matches: " SEAT_NAME \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_seat_name:
    summary: "Set a seat's name (SEAT_NAME)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
      value: { type: string, required: true, max_length: 128, pattern: "^[^{}<>\\x00-\\x1f]+$", label: "Name", description: "Up to 128 bytes of UTF-8 without { } < >." }
    send: "SET {seat} SEAT_NAME \\{{value}\\}"
    expect: { reply_contains: " SEAT_NAME ", contains: " SEAT_NAME " }
    returns: ack
  get_unit_available:
    summary: "Read whether a conference unit is online (UNIT_AVAILABLE)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
    send: "GET {seat} UNIT_AVAILABLE"
    expect: { reply_contains: " UNIT_AVAILABLE ", matches: " UNIT_AVAILABLE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  get_audio_input_speaklist:
    summary: "Read whether the audio input joins the speaker list (AUDIO_INPUT_SPEAKLIST)"
    send: "GET AUDIO_INPUT_SPEAKLIST"
    expect: { reply_contains: " AUDIO_INPUT_SPEAKLIST ", matches: " AUDIO_INPUT_SPEAKLIST \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_audio_input_speaklist:
    summary: "Turn whether the audio input joins the speaker list on or off (AUDIO_INPUT_SPEAKLIST)"
    params:
      enabled: { type: bool, required: true, label: "Audio input in speaker list", description: "On lets the audio input take a place in the speaker list, off keeps it out." }
    send: "SET AUDIO_INPUT_SPEAKLIST {enabled:on_off}"
    expect: { reply_contains: " AUDIO_INPUT_SPEAKLIST ", contains: " AUDIO_INPUT_SPEAKLIST " }
    returns: ack
  get_welcome_lock:
    summary: "Read the conference units' welcome lock (WDU_LOCK_WELCOME)"
    send: "GET WDU_LOCK_WELCOME"
    expect: { reply_contains: " WDU_LOCK_WELCOME ", matches: " WDU_LOCK_WELCOME \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_welcome_lock:
    summary: "Set the conference units' welcome lock (WDU_LOCK_WELCOME)"
    params:
      value: { type: enum, values: ["ENABLED", "DISABLED"], required: true, label: "Welcome lock", description: "ENABLED or DISABLED." }
    send: "SET WDU_LOCK_WELCOME {value}"
    expect: { reply_contains: " WDU_LOCK_WELCOME ", contains: " WDU_LOCK_WELCOME " }
    returns: ack
  get_retain_seats:
    summary: "Read whether seat assignments are kept (RETAIN_SEAT_PERSISTENCE)"
    send: "GET RETAIN_SEAT_PERSISTENCE"
    expect: { reply_contains: " RETAIN_SEAT_PERSISTENCE ", matches: " RETAIN_SEAT_PERSISTENCE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_retain_seats:
    summary: "Set whether seat assignments are kept (RETAIN_SEAT_PERSISTENCE)"
    params:
      value: { type: enum, values: ["ENABLED", "DISABLED"], required: true, label: "Retain seats", description: "ENABLED keeps seat numbers across restarts, DISABLED does not." }
    send: "SET RETAIN_SEAT_PERSISTENCE {value}"
    expect: { reply_contains: " RETAIN_SEAT_PERSISTENCE ", contains: " RETAIN_SEAT_PERSISTENCE " }
    returns: ack
  get_loudspeaker_volume:
    summary: "Read the conference units' loudspeaker volume (LOUDSPEAKER_VOLUME)"
    send: "GET LOUDSPEAKER_VOLUME"
    expect: { reply_contains: " LOUDSPEAKER_VOLUME ", matches: " LOUDSPEAKER_VOLUME \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_loudspeaker_volume:
    summary: "Set the conference units' loudspeaker volume (LOUDSPEAKER_VOLUME), dB"
    params:
      value: { type: int, min: -30, max: 6, required: true, label: "Volume", description: "Volume in dB, -30 to +6." }
    send: "SET LOUDSPEAKER_VOLUME {value:+30}"
    expect: { reply_contains: " LOUDSPEAKER_VOLUME ", contains: " LOUDSPEAKER_VOLUME " }
    returns: ack
  get_mic_gain:
    summary: "Read a seat's microphone gain (MIC_GAIN)"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
    send: "GET {seat} MIC_GAIN"
    expect: { reply_contains: " MIC_GAIN ", matches: " MIC_GAIN \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_mic_gain:
    summary: "Set a seat's microphone gain (MIC_GAIN), dB"
    params:
      seat: { type: int, min: 0, max: 65535, required: true, label: "Seat", description: "Conference unit (seat) number from 1; 0 is every seat where the command allows it." }
      value: { type: int, min: -30, max: 10, required: true, label: "Gain", description: "Gain in dB, -30 to +10." }
