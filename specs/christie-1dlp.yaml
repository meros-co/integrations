    - match: '^\(#?SKS(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "video.source_key_mode": "{1}" }
    - match: '^\(#?BKI(?:!\s*0*|\s*)([01])[\s)]'
      state: { "backup_input.enabled": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?BKI\+FSRC(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "backup_input.first": "{1}" }
    - match: '^\(#?BKI\+SSRC(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "backup_input.second": "{1}" }
    - match: '^\(BKI\+(CHAN|CSRC|FCSP|FHDR|FHOR|FRES|SCSP|SHDR|SHOR|SRES|STAT)!(.*)\)$'
      state: { "backup_input.info.{1}": "{2}" }
    - match: '^\(#?SNS\+SRC(?:!\s*|\s*)([0-9A-B]+) "([^"]*)"'
      state: { "video.source_names.{1}": "{2}" }
    - match: '^\(#?MMC\+COLR(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "video.memc.COLR": "{1}" }
    - match: '^\(#?MMC\+DEMO(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "video.memc.DEMO": "{1}" }
    - match: '^\(#?MMC\+DTIL(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "video.memc.DTIL": "{1}" }
    - match: '^\(#?MMC\+MOTN(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "video.memc.MOTN": "{1}" }
    - match: '^\(#?AMU(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "audio.amu": "{1}" }
    - match: '^\(#?AVL(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "audio.volume": "{1}" }
    - match: '^\(#?MUT(?:!\s*0*|\s*)([01])[\s)]'
      state: { "audio.muted": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?VOL(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "audio.speaker_volume": "{1}" }
    - match: '^\(#?MIC(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "audio.microphone_volume": "{1}" }
    - match: '^\(#?OSD(?:!\s*0*|\s*)([01])[\s)]'
      state: { "osd.visible": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?OSD\s*[-\w"]'
      then_send: ["OSD?"]
    - match: '^\(#?OST(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "osd.transparency": "{1}" }
    - match: '^\(#?MSH(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "osd.menu_horizontal": "{1}" }
    - match: '^\(#?MSV(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "osd.menu_vertical": "{1}" }
    - match: '^\(#?MSV\s*[-\w"]'
      then_send: ["MSV?"]
    - match: '^\(#?MSP(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "osd.menu_position": "{1}" }
    - match: '^\(#?MSP\s*[-\w"]'
      then_send: ["MSP?"]
    - match: '^\(#?MTO(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "osd.menu_timeout": "{1}" }
    - match: '^\(#?MBE\+USER(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "osd.message_boxes": "{1}" }
    - match: '^\(#?LOC(?:\+LANG)?(?:!\s*|\s*)(\d+)[\s)]'
      state: { "osd.language": "{1}" }
    - match: '^\(#?SPS\+SLCT(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "setup.splash_screen": "{1}" }
    - match: '^\(#?SBL(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "setup.status_led": "{1}" }
    - match: '^\(#?KBL(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "setup.keypad_backlight": "{1}" }
    - match: '^\(#?HKS(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "setup.hot_key": "{1}" }
    - match: '^\(#?CEL(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "setup.ceiling": "{1}" }
    - match: '^\(#?SOR(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "setup.orientation": "{1}" }
    - match: '^\(#?HAT(?:!\s*0*|\s*)([01])[\s)]'
      state: { "setup.high_altitude": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?APW(?:!\s*0*|\s*)([01])[\s)]'
      state: { "setup.auto_power_on": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?ASH(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "setup.auto_shutdown": "{1}" }
    - match: '^\(#?SLP(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "setup.sleep_timer": "{1}" }
    - match: '^\(#?STP(?:!\s*0*|\s*)([01])[\s)]'
      state: { "setup.startup": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?VTT(?:!\s*0*|\s*)([01])[\s)]'
      state: { "setup.trigger_12v": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?IRC\+FRNT(?:!\s*0*|\s*)([01])[\s)]'
      state: { "setup.ir.front": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?IRC\+TOPP(?:!\s*0*|\s*)([01])[\s)]'
      state: { "setup.ir.top": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?IRC\+HDBT(?:!\s*0*|\s*)([01])[\s)]'
      state: { "setup.ir.hdbaset": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?ADR(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "setup.address": "{1}" }
    - match: '^\(#?BDR(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "setup.baud_rate": "{1}" }
    - match: '^\(#?SEC(?:!\s*0*|\s*)([01])[\s)]'
      state: { "setup.serial_echo": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?SPP(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "setup.serial_path": "{1}" }
    - match: '^\(#?DDD(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "clock.day": "{1}" }
    - match: '^\(#?DDM(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "clock.month": "{1}" }
    - match: '^\(#?DDY(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "clock.year": "{1}" }
    - match: '^\(#?DTH(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "clock.hour": "{1}" }
    - match: '^\(#?DTM(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "clock.minute": "{1}" }
    - match: '^\(#?DUI(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "clock.update_interval": "{1}" }
    - match: '^\(#?TCM(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "clock.mode": "{1}" }
    - match: '^\(#?NTP(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "clock.ntp_server": "{1}" }
    - match: '^\(#?UTC(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "clock.time_zone": "{1}" }
    - match: '^\(#?DST(?:!\s*0*|\s*)([01])[\s)]'
      state: { "clock.daylight_saving": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(SDT!(.*)\)$'
      state: { "clock.schedule_date_time": "{1}" }
    - match: '^\(#?SCH\+MODE(?:!\s*0*|\s*)([01])[\s)]'
      state: { "schedule.enabled": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(SCH\+WDAY!(.*)\)$'
      state: { "schedule.today": "{1}" }
    - match: '^\(#?SD([0-6])\+MODE(?:!\s*0*|\s*)([01])[\s)]'
      state: { "schedule.days.{1}.enabled": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^\(SD([0-6])\+EVRD!(.*)\)$'
      state: { "schedule.days.{1}.events": "{2}" }
    - match: '^\(#?NET\+DHCP(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "network.dhcp": "{1}" }
    - match: '^\(#?NET\+ETH0(?:!\s*|\s*)"([^"]*)"'
      state: { "network.ip_address": "{1}" }
    - match: '^\(#?NET\+SUB0(?:!\s*|\s*)"([^"]*)"'
      state: { "network.subnet_mask": "{1}" }
    - match: '^\(#?NET\+GATE(?:!\s*|\s*)"([^"]*)"'
      state: { "network.gateway": "{1}" }
    - match: '^\(#?NET\+PDNS(?:!\s*|\s*)"([^"]*)"'
      state: { "network.primary_dns": "{1}" }
    - match: '^\(#?NET\+SDNS(?:!\s*|\s*)"([^"]*)"'
      state: { "network.secondary_dns": "{1}" }
    - match: '^\(#?NET\+HOST(?:!\s*|\s*)"([^"]*)"'
      state: { "network.hostname": "{1}" }
    - match: '^\(#?NET\+MAC0(?:!\s*|\s*)"([^"]*)"'
      state: { "network.mac_address": "{1}" }
    - match: '^\(#?NET\+PATH(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "network.lan_path": "{1}" }
    - match: '^\(#?NET\+SHOW(?:!\s*0*|\s*)([01])[\s)]'
      state: { "network.messages": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(NET\+STAT!(.*)\)$'
      state: { "network.status": "{1}" }
    - match: '^\(#?NTW\+ETH0(?:!\s*|\s*)"([^"]*)"'
      state: { "wlan.start_ip": "{1}" }
    - match: '^\(#?NTW\+ENIP(?:!\s*|\s*)"([^"]*)"'
      state: { "wlan.end_ip": "{1}" }
    - match: '^\(#?NTW\+GATE(?:!\s*|\s*)"([^"]*)"'
      state: { "wlan.gateway": "{1}" }
    - match: '^\(#?NTW\+SUB0(?:!\s*|\s*)"([^"]*)"'
      state: { "wlan.subnet_mask": "{1}" }
    - match: '^\(#?NTW\+SSID(?:!\s*|\s*)"([^"]*)"'
      state: { "wlan.ssid": "{1}" }
    - match: '^\(#?NTW\+SLCT(?:!\s*0*|\s*)([01])[\s)]'
      state: { "wlan.enabled": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?FLT\+TYPE(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "filter.type": "{1}" }
    - match: '^\(#?FLT\+TYPE\s*[-\w"]'
      then_send: ["FLT+TYPE ?"]
    - match: '^\(FLT\+TREM!(.*)\)$'
      state: { "filter.remaining": "{1}" }
    - match: '^\(#?GUP(?:!\s*0*|\s*)([01])[\s)]'
      state: { "group.enabled": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?GUP\+ACME(?:!\s*0*|\s*)([01])[\s)]'
      state: { "group.ACME": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?GUP\+ATFE(?:!\s*0*|\s*)([01])[\s)]'
      state: { "group.ATFE": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?GUP\+FRZE(?:!\s*0*|\s*)([01])[\s)]'
      state: { "group.FRZE": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?GUP\+SCHE(?:!\s*0*|\s*)([01])[\s)]'
      state: { "group.SCHE": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^\(#?GUP\+SHUT(?:!\s*0*|\s*)([01])[\s)]'
      state: { "group.SHUT": { value: "{1}", map: { "0": false, "1": true } } }

    - match: '^\(SST!\s*(\d+)\s+"([^"]*)" "([^"]*)"\)$'
      state: { "status.items.{1}.value": "{2}", "status.items.{1}.name": "{3}" }
    - match: '^\(SST!\s*\d+\s+"([^"]*)" "Model Name"\)$'
      state: { "device.model": "{1}" }
    - match: '^\(LIF\+(LP[12T][HR])!\s*(\d+)[\s)]'
      state: { "lamp.info.{1}": "{2}" }
    - match: '^\(#?OVS(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "image.overscan": "{1}" }
    - match: '^\(#?PXT(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "image.pixel_track": "{1}" }
    - match: '^\(#?SIZ(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "image.digital_zoom_size": "{1}" }
    - match: '^\(#?NRD(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "image.noise_reduction": "{1}" }
    - match: '^\(#?FTC(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "image.flesh_tone": "{1}" }
    - match: '^\(#?VBL(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "image.video_black_level": "{1}" }
    - match: '^\(#?FMD(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "image.film_detect": "{1}" }
    - match: '^\(#?CLC(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "image.closed_captions": "{1}" }
    - match: '^\(#?BCL(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "image.brilliant_color": "{1}" }
    - match: '^\(#?EDG(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "image.edge_enhancement": "{1}" }
    - match: '^\(#?TMG(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "video.timing_detect": "{1}" }
    - match: '^\(#?ESH(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "video.source_hot_keys": "{1}" }
    - match: '^\(#?LOP(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "lamp.current": "{1}" }
    - match: '^\(#?WSP(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "lamp.whisper_mode": "{1}" }
    - match: '^\(#?LSF(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "lamp.auto_switch": "{1}" }
    - match: '^\(#?LSF\+TIME(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "lamp.auto_switch_hours": "{1}" }
    - match: '^\(#?LPL(?:!\s*|\s*)(-?\d+)[\s)]'
      state: { "lamp.life_warning": "{1}" }
    - match: '^\(#?MHK\+(VGA1|VGA2|BNC1|HDM1|HDM2|CON1|SVDO|COPS)(?:!\s*|\s*)(\d)[\s)]'
      state: { "video.source_hot_key.{1}": "{2}" }

state:
  power.state: { type: "int", description: "Power state from PWR?: 0 = standby, 1 = on, 10 = cooling, 11 = warming up (Captiva documents 0 and 1 only)" }
  power.standby_mode: { type: "int", description: "Standby power mode: 0 = 0.5 W / ECO, 1 = communication mode" }
  status.sst: { type: "string", description: "The last SST reply without its parentheses, as the projector sent it (the item format is not documented)" }
  status.sst_items.*.*: { type: "string", description: "A status item from an SST+<group> reply, keyed by group and item number, as sent" }
  status.light_source_info: { type: "string", description: "The ILI reply text: projector hours and laser diode hours, as the projector formats them" }
  device.firmware_info: { type: "string", description: "The FVI reply text: software, LAN, formatter and other versions" }
  device.version: { type: "string", description: "The VER reply text (Captiva)" }
  network.info: { type: "string", description: "The ICI reply text: IP address, subnet and other communication settings" }
  device.serial_command_version: { type: "string", description: "The SIV reply text" }
  status.error_log: { type: "string", description: "The last ERR reply text (the error log)" }
  status.last_system_error: { type: "int", description: "Last system error: 1 = light source did not engage after five attempts, 3 = light source went out unexpectedly, 4 = fan failure, 5 = over temperature" }
  status.last_command_error: { type: "string", description: "The LCE reply text" }
  status.last_error.code: { type: "string", description: "Code of the last error reply, such as ERR00005" }
  status.last_error.text: { type: "string", description: "Text of the last error reply, such as \"ITP: Too Few Parameters\"" }
  status.fans.*: { type: "string", description: "A FAN reply text, keyed by item (FA01, TEC1, PUMP, FILT ...)" }
  status.laser_diodes.*: { type: "string", description: "An LDI reply text (voltage, current, temperature), keyed by laser diode bank number" }
  source.main.info.*: { type: "string", description: "An MIF reply text, keyed by item (ACTS, APRT, CLSP, HREF, PIXC, RESL, SGFT, SYNC, VREF)" }
  source.secondary.info.*: { type: "string", description: "An SIF reply text, keyed by item" }
  device.model: { type: "string", description: "Model name from the SST? status item \"Model Name\" (item 0 on the E Series, as \"DWU670-E\")" }
  device.info.*: { type: "string", description: "A PIF reply text, keyed by item: MDLN model, SNUM serial number, NERS native resolution, LOCK, STBM, WHEE, CFVS" }
  device.component_versions.*: { type: "string", description: "A PIF+FWV# reply text, keyed by component character" }
  input.main: { type: "int", description: "Active main input number (see set_input)" }
  input.pip: { type: "int", description: "Active picture-in-picture input number" }
  shutter.closed: { type: "bool", description: "The shutter is closed (SHU 1)" }
  shutter.av_mute: { type: "bool", description: "The image is blanked by AVM (Captiva)" }
  image.frozen: { type: "bool", description: "The image is frozen" }
  image.fade_in: { type: "int", description: "Fade-in time: 0 off, n x 0.5 s" }
  image.fade_out: { type: "int", description: "Fade-out time: 0 off, n x 0.5 s" }
  image.test_pattern: { type: "int", description: "Test pattern set with TPG+ITPG (0 = off)" }
  image.itp_pattern: { type: "int", description: "Test pattern set with ITP (0 = off)" }
  image.picture_setting: { type: "int", description: "Picture setting preset number (see set_picture_setting)" }
  image.user_configuration: { type: "int", description: "Picture setting the user configuration is based on" }
  image.brightness: { type: "int", description: "Brightness: image brightness (black level on Captiva), 50 is the default" }
  image.contrast: { type: "int", description: "Contrast: image contrast (white level on Captiva), 50 is the default" }
  image.color: { type: "int", description: "Color: color saturation, 50 is the default" }
  image.tint: { type: "int", description: "Tint: red-to-green balance, 50 is the default" }
  image.red_gain: { type: "int", description: "Red gain: red gain, 50 is the default" }
  image.green_gain: { type: "int", description: "Green gain: green gain, 50 is the default" }
  image.blue_gain: { type: "int", description: "Blue gain: blue gain, 50 is the default" }
  image.red_offset: { type: "int", description: "Red offset: red offset, 50 is the default" }
  image.green_offset: { type: "int", description: "Green offset: green offset, 50 is the default" }
  image.blue_offset: { type: "int", description: "Blue offset: blue offset, 50 is the default" }
  image.white_peaking: { type: "int", description: "White peaking: white peaking for video sources, 0 to 100 (in steps of 10 on most families)" }
  image.detail: { type: "int", description: "Detail: edge clarity: 0 = maximum, 1 = high, 2 = normal, 3 = low, 4 = minimum" }
  image.gamma_curve: { type: "int", description: "Gamma curve: 0 = video, 1 = film, 2 = bright, 3 = computer (CRT), 4 = DICOM, 5 = HDR (not on Inspire, D13/D16/D20 and 4K7/4K10)" }
  image.color_temperature: { type: "int", description: "Color temperature: 0 = warmest, 1 = warm, 2 = cool" }
  image.color_space: { type: "int", description: "Color space: 0 = auto, 1 = RGB full, 2 = RGB limited, 3 = REC709, 4 = REC601" }
  image.skin_color: { type: "int", description: "Skin color: 0 = off, 1 = low, 2 = middle, 3 = high adjustment of skin tones" }
  image.mpeg_noise_reduction: { type: "int", description: "MPEG noise reduction: 0 = off, 1 = low, 2 = middle, 3 = high" }
  image.temporal_noise_reduction: { type: "int", description: "Temporal noise reduction: 0 = off, 1 = low, 2 = middle, 3 = high" }
  image.color_enhancement: { type: "int", description: "Color enhancement: 0 = off, 1 = mode 1 (more natural), 2 = mode 2 (more vivid)" }
  image.contrast_enhancement: { type: "int", description: "Contrast enhancement: 0 = off, 1 = dynamic black, 2 = real black" }
  image.pixel_phase: { type: "int", description: "Pixel phase: pixel sampling phase for analog inputs, 50 is the default" }
  image.sync_threshold: { type: "int", description: "Sync threshold: sync threshold for progressive signals, 50 is the default" }
  image.cct_calibration: { type: "int", description: "CCT calibration: cCT calibration value" }
  video.hdmi_output: { type: "int", description: "HDMI output: default HDMI output port: 1 = HDMI 1, 2 = HDMI 2" }
  image.size_preset: { type: "int", description: "Size preset: 0 = auto, 1 = native, 2 = 4:3, 3 = letterbox, 4 = full size, 5 = full width, 6 = full height, 7 = custom, 8 = 3D mode, 9 = 21:9" }
  image.aspect_ratio: { type: "int", description: "Aspect ratio: 1 = auto, 2 = 4:3, 3 = 16:9, 4 = 16:10/ultra wide" }
  light.dynamic_black: { type: "bool", description: "Dynamic Black is on" }
  light.dynamic_black_level: { type: "int", unit: "%", description: "Dynamic Black level" }
  light.dynamic_black_speed: { type: "int", description: "Dynamic Black correction speed" }
  light.dynamic_black_strength: { type: "int", description: "Dynamic Black strength" }
  light.real_black: { type: "bool", description: "Real Black is on (RBS)" }
  light.real_black_drb: { type: "int", description: "DRB value: 0 = Real Black on, 1 = off" }
  light.lights_out_level: { type: "int", description: "Lights-out signal level" }
  light.lights_out_timer: { type: "int", unit: "s", description: "Lights-out timer" }
  light.lights_on_threshold: { type: "int", description: "Lights-on threshold" }
  light.mode: { type: "int", description: "Light source mode, or lamp power on the E Series (see set_light_mode)" }
  light.power: { type: "int", description: "Laser power setting (1 to 100)" }
  color.matching.*.*: { type: "int", description: "Color matching level (0 to 254), keyed by wire color (RED, GRE, BLU, CYA, MAG, YEL) and component (G gain, H hue, S saturation)" }
  color.white_gain.*: { type: "int", description: "White gain (0 to 254), keyed by wire subcode WHRG, WHGG, WHBG" }
  color.blue_of_white: { type: "int", description: "Blue portion of white" }
  color.hsg_enabled: { type: "bool", description: "HSG adjustments are on" }
  color.hsg_test_patterns: { type: "bool", description: "Automatic HSG test patterns are on" }
  color.wall_color: { type: "int", description: "Wall color: 0 white, 1 gray 130, 2 light yellow" }
  color.auto_color_uniformity: { type: "bool", description: "Automatic color uniformity is on" }
  color.wheel_speed: { type: "int", description: "Color wheel speed: 0 = 2x, 1 = 3x" }
