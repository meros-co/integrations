spec: 1
id: christie-1dlp
name: Christie 1DLP projectors (serial commands over TCP)
vendor: Christie
category: display

# Christie's single-chip DLP laser families (HS, GS, Inspire, Jazz, Korus), the lamp-based E
# Series and the Captiva DWU500S share one ASCII command set: "(" + three-letter code [+ four-character subcode]
# [value | ?] + ")", on the RS232 IN port and on TCP 3002. A set is sent with the "#" prefix,
# which makes the projector echo the message when it has processed it; requests carry no "#"
# and are answered "(CODE!value ...)". Each family documents its own command list and value
# ranges, so each family is a model with its own supports list; a parameter takes the union
# of the documented ranges, the per-family meanings listed in its description.
source:
  - title: "Christie HS Series 2K Technical Reference: Serial Commands, 020-103716-02 Rev. 1 (04-2024)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-103716-02-christie-lit-tech-ref-hs-series-api.pdf
    note: "Model list, RS-232 and Ethernet (TCP 3002) connection, 115200 8N1, message format with the # full acknowledgment, error example (pp. 8-11); every command of the hs-2k model (pp. 12-94)."
  - title: "Christie HS Series 2K Technical Reference: Serial Commands, 020-102783-04 Rev. 1 (07-2021)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-102783-04-Christie-LIT-TECH-REF-HS-Series-2K-API.pdf
    note: "D13HD2/D13WU2/D16HD/D16WU/D20HD/D20WU-HS: commands of the hs-2k-gen1 model. Its Ethernet section leaves the port number blank (\"use port .\")."
  - title: "Christie HS Series 4K Technical Reference: Serial Commands, 020-103737-02 Rev. 1 (05-2024)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-103737-02-christie-lit-tech-ref-hs-series-4k-api.pdf
    note: "Model list and commands of the hs-4k model; TCP 3002, 115200 8N1."
  - title: "Christie 4K7-HS and 4K10-HS Technical Reference: Serial Commands, 020-102782-02 Rev. 1 (07-2021)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-102782-02-Christie-LIT-TECH-REF-4K10-4K7-HS-API.pdf
    note: "Commands of the hs-4k10 model; TCP 3002, 115200 8N1."
  - title: "Christie GS Series 2K Technical Reference: Serial Commands, 020-103480-07 Rev. 1 (06-2025)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-103480-07-Christie-LIT-TECH-REF-GS-Series-2K-API.pdf
    note: "Model list and commands of the gs-2k model; TCP 3002, 115200 8N1."
  - title: "Christie Inspire Series Technical Reference: Serial Commands, 020-103542-03 Rev. 1 (06-2025)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-103542-03-Christie-LIT-TECH-REF-Inspire-Series-API.pdf
    note: "Model list and commands of the inspire model; TCP 3002, 115200 8N1."
  - title: "Christie Jazz Series Technical Reference: Serial Commands, 020-103859-03 Rev. 1 (11-2025)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-103859-03-Christie-LIT-TECH-REF-JS-Series-API.pdf
    note: "Commands of the jazz model (the document lists no models; its per-model notes name 4K1600(A)-JS, 4K2100(A)-JS, DWU1800(A)-JS and DWU2400(A)-JS); TCP 3002, 115200 8N1."
  - title: "Christie Korus Series Technical Reference: Serial Commands, 020-104044-01 Rev. 1 (01-2026)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-104044-01-christie-lit-tech-ref-korus-series-api.pdf
    note: "Commands of the korus model; TCP 3002, 115200 8N1."
  - title: "Captiva DWU500S Technical Reference, 020-103535-02 Rev. 1 (05-2026)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-103535-02-christie-lit-tech-ref-captiva-dwu500s-api.pdf
    note: "Same message format and # acknowledgment; the commands of the captiva-dwu500s model; RS-232 19200 8N1. Names no TCP port."
  - title: "E Series Serial Commands, Technical Reference 020-000372-05 Rev. 1 (5-2011)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/globalassets/resources/public/020-000372-05-christie-e-series-serial-communications.pdf
    note: "DWU670-E (lamp projector): same message format, # acknowledgment and error example; READ/WRITE column per command (R/W codes answer requests); SST reply items; IR key codes (Appendix 2); RS-232 115200 8N1. Names an ETHERNET port but no TCP port number."
  - title: "Christie product pages (Jazz, Korus and HS series model names)"
    author: Christie Digital Systems USA, Inc.
    url: https://www.christiedigital.com/products/projectors/all-projectors/
    note: "Jazz Series: 4K1600-JS, 4K2100-JS, DWU1800-JS, DWU2400-JS; Korus Series: 4K1000-KS, 4K1400-KS."
  - title: "Bitfocus companion-module-christie-projector (MIT)"
    author: Bitfocus
    url: https://github.com/bitfocus/companion-module-christie-projector
    note: "Open code for Christie projectors, read for corroboration only: TCP 3002 default, replies read as \"(CODE!data)\", and SST+<group> status replies with an item number, a code and quoted texts."

transport:
  type: line-tcp
  port: 3002
  framing: delimited
  open: "("
  close: ")"
  encoding: ascii
  timeout_ms: 5000
  reply: expected
  # The documented error reply: (65535 00000 ERR00005 "ITP: Too Few Parameters").
  error_match: '^\(\d+ \d+ ERR\d+ '
  probe: "PWR?"
  # The same commands on the RS232 IN port (every reference: one set of "serial commands" for RS-232 and
  # TCP 3002): 115200 8N1 by default, no flow control; BDR offers the other rates (14400 on GS, D13/D16/D20
  # and 4K7/4K10 only). The Captiva DWU500S runs at 19200 (see the quirks).
  serial:
    baud_rate: { default: 115200, values: [1200, 2400, 4800, 9600, 14400, 19200, 38400, 57600, 115200] }
    data_bits: 8
    parity: none
    stop_bits: 1
    flow_control: none

ports:
  - { port: 3002, protocol: tcp, role: control, when: "link tcp" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "RS232 IN, 9-pin D-sub: a null-modem female-to-female cable (2-3, 3-2, 5-5)" }

