quirks:
  - models: [all]
    severity: info
    text: >
      Every message is in parentheses. A set is sent with the "#" prefix, which the references document as
      a request for a full acknowledgment: the projector echoes the message when it has finished
      processing it, and the command waits for that echo. Whether the echo keeps the "#" ("(#PWR 1)") or
      not ("(PWR 1)") is not documented; the commands and rules accept both. Requests carry no "#" (the
      references say not to) and are answered "(CODE!value)", often with a zero-padded value and a quoted
      text, as in "(PWR!001 "On")".
  - models: [all]
    severity: warning
    text: >
      The acknowledgment of a set comes when the projector has finished processing it. For power on and
      off, lens calibration and centering, auto focus, auto color calibration and backup restore that may
      take longer than the 5 s timeout, so the command can report a timeout although the projector
      accepted it; a late echo is not mistaken for another reply. The power state is read with PWR? every
      5 s and again after each power echo.
  - models: [all]
    severity: info
    text: >
      Only some codes document a request (CODE?). The general message format documents "(Code ?)" and
      "(Code+Subcode ?)" for any code, and request, get_freeze, get_light_mode, get_light_power and
      get_input on the DLP families (SIN+MAIN?) use that form; a code that does not answer it gets an
      error reply. Settings without a request are read back from the echo of each set, so state shows what
      was last set through this connection, not changes made on the keypad or remote.
  - models: [all]
    severity: info
    text: >
      The status replies (SST, ILI light source and laser hours, FVI firmware, ICI network, ERR error log,
      FAN fans, LDI laser diode voltage, current and temperature, MIF and SIF signal information, PIF,
      BKI, NET+STAT, SDT, MDT) have no documented data format, so each is kept as the text after the "!".
      SST may answer with several messages, one per item.
  - models: [hs-2k, hs-2k-gen1, hs-4k, hs-4k10, gs-2k, inspire, jazz, korus]
    severity: info
    text: >
      The model name, serial number, native resolution and component versions (PIF) are documented as
      available only in service mode (enter_service_mode); outside it the projector answers PIF requests
      with an error. FVI (firmware) and ILI (hours) need no service mode. CWI (wheel index) also requires
      service mode.
  - models: [all]
    severity: info
    text: >
      No request lists the projector's inputs. The SIN (Select Input) section of each reference (HS Series
      2K 020-103716-02 p. 81, and the same section in the other references; Captiva DWU500S p. 19; E Series
      "(SIN) INPUT/SOURCE CHANGE" p. 34) documents only selecting and reading the active input, with the
      family's input numbers in its value list, given in set_input's description. The E Series SST? reply
      names the model in its "Model Name" item, kept in device.model; on the DLP families the model name is
      PIF+MDLN?, which needs service mode, so it is not polled.
  - models: [hs-2k, hs-2k-gen1, hs-4k, hs-4k10, gs-2k, inspire, jazz, korus]
    severity: info
    text: >
      ADR sets the projector address for RS-232 daisy chains and IR remotes. Over TCP each projector is
      its own connection, so no address is needed and none is sent.
  - models: [all]
    severity: info
    text: >
      An error is answered as "(65535 00000 ERR00005 "ITP: Too Few Parameters")": two numbers, an ERR code
      and a text. The references give only this example and publish no code table; such a reply fails the
      waiting command and its code and text are kept in status.last_error.
  - models: [all]
    severity: info
    text: >
      A message ends at the first ")": a closing parenthesis inside a quoted reply text would end it
      early. Names and other text parameters refuse quotes and parentheses for that reason.
  - models: [all]
    severity: warning
    text: >
      Some values are inverted or differ between families, as documented: MBE+USER (0 shows message boxes
      on the D13/D16/D20), NET+DHCP (0 turns DHCP on on the D13/D16/D20 and 4K7/4K10), HDR+HDRE (0 = auto
      on the 4K7/4K10), DRB (0 enables Real Black), FKC (0 enables 4K compatibility) and AMU (1 enables
      audio). Such settings are kept as the wire number.
  - models: [all]
    severity: critical
    text: >
      These cannot be undone from the API: factory_defaults (DEF 111), reset_configuration, reset_network,
      restore_backup and restore_backup_file (replace every setting), save_backup, save_backup_file,
      save_lens_memory, save_warp, save_blend and save_picture_setting_user (overwrite the stored record),
      reset_warping, reset_corners, reset_image_settings, reset_gain_offset, reset_hue_saturation_gain,
      reset_color_matching, reset_contrast_enhancement, reset_auto_color_uniformity, reset_schedule and
      reset_schedule_day. recall_lens_memory, apply_warp, apply_blend and the lens commands move the image
      on screen at once.
  - models: [all]
    severity: warning
    text: >
      Network settings (set_ip_address and the other NET and NTW sets) take effect with apply_network or
      apply_wlan, which can drop this connection; the device must then be opened at its new address.
      set_baud_rate, set_serial_echo and set_serial_path affect the serial port only.
  - models: [all]
    severity: info
    text: >
      Serial (link serial): the same command set and message format are documented for the RS232 IN port
      and for TCP 3002 (the references describe one set of "serial commands" for both), so link serial
      sends the same messages. The Captiva DWU500S is opened with baud_rate 19200, its only rate; after
      set_baud_rate over the serial port, change the link's baud_rate to match. HS Series 2K (020-103716-02
      and 020-102783-04), HS Series 4K, 4K7/4K10-HS, GS, Inspire, Jazz and Korus: default 115200 baud (BDR
      0 to 8 = 1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200; the GS, D13/D16/D20 and 4K7/4K10
      references add 4 = 14400), 8 data bits, no parity, 1 stop bit, no flow control, RS232 IN on a nine-
      pin D-sub through a null-modem female-to-female cable (pins 2-3, 3-2, 5-5). SPP chooses RS-232 or
      HDBaseT for the serial path and SEC turns character echo on. E Series (DWU670-E): 115200 baud default (BDR 0 to 7 = 2400 to 115200), 8 data bits, no parity, 1 stop bit, no flow control, RS232 IN through a null-modem cable, nine-pin female at both ends (2-3, 3-2, 5-5). Captiva DWU500S: 19200 baud, 8 data
      bits, no parity, 1 stop bit, no flow control, an RS-232 cable to the projector COM port (connector
      not specified), no baud rate command.
  - models: [captiva-dwu500s]
    severity: warning
    text: >
      The Captiva DWU500S reference documents the same message format but names no TCP port: its Ethernet
      section only describes Wake on LAN with the LAN (Standby) setting enabled. Port 3002 is the family
      port and is assumed. Its sharpness command (SHA) gives no value range, so it is not offered; its SOR
      documents only 2 = rear and 3 = front ceiling; PWR? is documented with 0 and 1 only.
  - models: [hs-2k-gen1]
    severity: warning
    text: >
      The D13/D16/D20 reference leaves the TCP port blank ("use port ."); port 3002 is the family port and
      is assumed. Its backup commands take no record (BAC+REST, BAC+SAVE), and its PST+USER value is not
      documented; "1" is sent as on the other families.
  - models: [hs-2k, hs-2k-gen1, hs-4k, hs-4k10, gs-2k, inspire, jazz, korus]
    severity: info
    text: >
      Where references disagree with themselves the spec follows the syntax line and the other families:
      the HS 2K reference shows the month and year commands as "DDD" (DDM and DDY are sent), and ACT is
      sent as "ACTxy" with no space, as documented. The D13/D16/D20, 4K7/4K10 and Inspire references list
      the CCA reset subcodes (BRTD and so on) with no value; "1" is sent as on the other families. The
      Inspire, D13/D16/D20 and 4K7/4K10 references show SNS+SRC without the name argument.
  - models: [hs-4k]
    severity: info
    text: >
      The HS Series 4K reference documents no shutter command (SHU), so the image cannot be blanked with
      set_shutter there; a black test pattern (set_test_pattern 3) or fade out (FDO) is the documented
      alternative. The Captiva blanks with set_av_mute.
  - models: [hs-2k, hs-4k, gs-2k, jazz, korus]
    severity: warning
    text: >
      SD#+EVWR is documented as SD#+EVWR "<event>, <time>, <function>" but its example is "(SD2+EVWR 01 11
      28 31 42)" (event, then function codes, no time); write_schedule_event sends its argument text as
      given so either form can be used. Functions: 00 off, 11 power on, 12 0.5 W (ECO) mode, 13
      communication mode, 21 to 28 inputs, 31 to 34 light modes, 41 shutter on, 42 off.
  - models: [hs-2k, hs-2k-gen1, hs-4k10, gs-2k, inspire, jazz, korus]
    severity: info
    text: >
      Service mode is documented as UID "service,service", with the example (UID "service" "<password>");
      enter_service_mode sends UID "<user>,<password>".
  - models: [korus]
    severity: info
    text: >
      The Korus grouping subcodes (GUP+ACME, ATFE, FRZE, SCHE, SHUT) document no values; they are sent as
      0 or 1 like GUP itself. GUP+RSET is sent with no value. HDR+NTDP (maximum mastering nits) documents
      no value and is not offered.
  - models: [hs-2k, hs-2k-gen1, hs-4k, hs-4k10, gs-2k, inspire, jazz, korus]
    severity: info
    text: >
      Ranges that differ between families take the union, with each family's values in the parameter
      description: a value outside a family's documented range is sent and refused by the projector with
      an error reply.
  - models: [all]
    severity: info
    text: >
      Polling: power, shutter, main input and freeze every 5 s; light mode and power, PIP, OSD, warp,
      blend and last system error every 30 s; SST, ILI (hours) and the error log every 5 minutes;
      firmware, network, address, baud rate and lens type every hour. Messages the projector sends unasked
      (network messages, NET+SHOW) are not documented; one arriving while a poll request waits is taken as
      its reply, and its text still goes to the rules.
  - models: [all]
    severity: info
    text: >
      No credential is documented for the TCP port. A PIN set with set_pin_protect must be entered before
      an image is shown; set_pin and set_pin_protect send the PIN in clear text, as the protocol does.
  - models: [e-series]
    severity: warning
    text: >
      The E Series reference (020-000372-05, DWU670-E, a lamp projector) documents the same message
      format, "#" acknowledgment and error reply, and an ETHERNET port, but no TCP port number; port 3002
      is the family port and is assumed. Its READ/WRITE column marks the codes that answer requests (R/W
      and READ ONLY). It has no freeze, light power or laser commands: LPM is lamp power there, and the
      lamp commands (LOP, WSP, LSF, LIF, LPL, LPC) are E Series only. SST answers with one message per
      item, "(SST!017 "10 Hours" "Lamp 1 Hours")", kept in status.items.
  - models: [e-series]
    severity: info
    text: >
      E Series differences kept as documented: SNS takes the input in the subcode ("SNS+SRC1 "WUXGA""),
      ESH is inverted (0 = on), SKS is marked read-only although it has values, DSV and AIM are write-
      only, keystone runs 0 to 100 (50 neutral), BDR codes start at 0 = 2400, and the PIF, DEF and some
      ITP patterns need service mode. The reference shows lamp 2 reset as both LPC+LMP2 (subcode list) and
      LPC+LAMP2 (example); LMP2 is sent. Its BCL text documents only 0 and 1. LSF+TIME and LPL give no
      upper limit.
