maps:
  cca_color: { red: "RED", green: "GRE", blue: "BLU", cyan: "CYA", magenta: "MAG", yellow: "YEL" }
  cca_component: { gain: "G", hue: "H", saturation: "S" }
  cca_reset: { red: "RRTD", green: "GRTD", blue: "BRTD", cyan: "CRTD", magenta: "MRTD", yellow: "YRTD", white: "WRTD" }
  white_gain: { red: "WHRG", green: "WHGG", blue: "WHBG" }
  focus_step: { increase: "n", decrease: "p" }

commands:
  set_power:
    summary: "Turn the projector on or off (PWR)"
    params:
      value: { type: "bool", required: true, label: "On", description: "True turns the projector on, false turns it off (to standby)." }
    send: "#PWR {value:bool01}"
    expect: { reply_contains: "PWR {value:bool01}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_power:
    summary: "Read the power state (PWR?): 0 standby, 1 on, 10 cooling, 11 warming up"
    send: "PWR?"
    expect: { reply_contains: "PWR!", matches: 'PWR!\s*(-?\d+)' }
    returns: value
  set_standby_power_mode:
    summary: "Set the standby power mode (PWR+STBM)"
    params:
      value: { type: "int", min: 0, max: 1, required: true, label: "Standby mode", description: "Power drawn in standby: 0 = 0.5 W (ECO on Jazz and Korus, 1 W on the E Series) low power mode, 1 = communication mode (network control stays available)." }
    send: "#PWR+STBM {value}"
    expect: { reply_contains: "PWR+STBM {value}", matches: '^\(#?[A-Za-z]' }
    returns: ack
  get_status:
    summary: "Read every projector status item (SST?)"
    send: "SST?"
    expect: { reply_contains: "SST", matches: 'SST!(.*)\)$' }
    returns: value
  get_light_source_info:
