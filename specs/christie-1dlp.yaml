        - { models: [hs-2k, hs-2k-gen1, hs-4k, hs-4k10, gs-2k, inspire, jazz, korus], message: "ERR?" }
    - every_ms: 3600000
      send:
        - { models: [hs-2k, hs-2k-gen1, hs-4k, gs-2k, inspire, jazz, korus], message: "FVI?" }
        - { models: [captiva-dwu500s], message: "VER?" }
        - { models: [hs-2k, hs-2k-gen1, hs-4k, hs-4k10, gs-2k, inspire, jazz, korus], message: "ICI?" }
        - { models: [hs-2k, hs-2k-gen1, hs-4k, hs-4k10, gs-2k, inspire, jazz, korus, e-series], message: "SIV?" }
