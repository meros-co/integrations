commands:
  # Selected executor. "Commands not sent to a specific executor [are]
  # executed on all the selected executors" (What are Executors).
  go:
    summary: Go on the selected executor(s)
    send: "Go"
    returns: none

  go_back:
    summary: Go back on the selected executor(s)
    send: "GoBack"
    returns: none

  goto_cue:
    summary: Jump to a cue on the selected executor(s)
    params:
      cue: { type: string, max_length: 8, pattern: "^[0-9]{1,4}(\\.[0-9]{1,3})?$", required: true,
             label: Cue,
             description: "Cue number as on the console, 0.001 to 9999.999 with up to three decimals, such as 5 or 12.5, jumped to on every selected executor." }
    send: "Goto Cue {cue}"
    returns: none

  pause:
    summary: DefGoPause, the large Pause key - pause the current fade on the selected executor
    send: "DefGoPause"
    returns: none

  # Executors. "Executor [ID]" is on the current fader/button page;
  # "Executor [Page].[ID]" names the page (Executor keyword).
  go_executor:
    summary: "Go (Go+): next step of the executor's sequence, or start a step-less object (the current page's executor)"
    params:
      executor: { type: int, min: 1, max: 220, required: true,
                  label: Executor,
                  description: "Executor number on the current fader or button page, which an operator can change: fader executors 1-30 (1-15 on a light or ultra light) and button executors 101-190, depending on the hardware and wings." }
    send: "Go Executor {executor}"
    returns: none

  go_page_executor:
    summary: "Go (Go+): next step of the executor's sequence, or start a step-less object (a page's executor)"
    params:
      page:     { type: int, min: 1, max: 9999, required: true,
                  label: Page,
                  description: "Executor page the executor is on, numbered as on the console." }
      executor: { type: int, min: 1, max: 220, required: true,
                  label: Executor,
                  description: "Executor number on the page given, as on the console: fader executors 1-30 (1-15 on a light or ultra light) and button executors 101-190, depending on the hardware and wings." }
    send: "Go Executor {page}.{executor}"
    returns: none

  go_back_executor:
    summary: "GoBack (Go-): previous step of the executor's sequence (the current page's executor)"
    params:
      executor: { type: int, min: 1, max: 220, required: true,
                  label: Executor,
                  description: "Executor number on the current fader or button page, which an operator can change: fader executors 1-30 (1-15 on a light or ultra light) and button executors 101-190, depending on the hardware and wings." }
    send: "GoBack Executor {executor}"
    returns: none

  go_back_page_executor:
    summary: "GoBack (Go-): previous step of the executor's sequence (a page's executor)"
    params:
      page:     { type: int, min: 1, max: 9999, required: true,
                  label: Page,
                  description: "Executor page the executor is on, numbered as on the console." }
      executor: { type: int, min: 1, max: 220, required: true,
                  label: Executor,
                  description: "Executor number on the page given, as on the console: fader executors 1-30 (1-15 on a light or ultra light) and button executors 101-190, depending on the hardware and wings." }
    send: "GoBack Executor {page}.{executor}"
    returns: none

  goto_cue_executor:
    summary: "Jump to a cue on the executor (the current page's executor)"
    params:
      cue:      { type: string, max_length: 8, pattern: "^[0-9]{1,4}(\\.[0-9]{1,3})?$", required: true,
                  label: Cue,
                  description: "Cue number as on the console, 0.001 to 9999.999 with up to three decimals, such as 5 or 12.5." }
      executor: { type: int, min: 1, max: 220, required: true,
                  label: Executor,
                  description: "Executor number on the current fader or button page, which an operator can change: fader executors 1-30 (1-15 on a light or ultra light) and button executors 101-190, depending on the hardware and wings." }
    send: "Goto Cue {cue} Executor {executor}"
    returns: none

  goto_cue_page_executor:
    summary: "Jump to a cue on the executor (a page's executor)"
    params:
      cue:      { type: string, max_length: 8, pattern: "^[0-9]{1,4}(\\.[0-9]{1,3})?$", required: true,
                  label: Cue,
                  description: "Cue number as on the console, 0.001 to 9999.999 with up to three decimals, such as 5 or 12.5." }
      page:     { type: int, min: 1, max: 9999, required: true,
                  label: Page,
                  description: "Executor page the executor is on, numbered as on the console." }
      executor: { type: int, min: 1, max: 220, required: true,
                  label: Executor,
                  description: "Executor number on the page given, as on the console: fader executors 1-30 (1-15 on a light or ultra light) and button executors 101-190, depending on the hardware and wings." }
    send: "Goto Cue {cue} Executor {page}.{executor}"
    returns: none

  load_cue_executor:
    summary: "Load a cue so the next Go jumps to it (the current page's executor)"
    params:
      cue:      { type: string, max_length: 8, pattern: "^[0-9]{1,4}(\\.[0-9]{1,3})?$", required: true,
                  label: Cue,
                  description: "Cue number as on the console, 0.001 to 9999.999 with up to three decimals, such as 5 or 12.5; the next Go jumps to it." }
      executor: { type: int, min: 1, max: 220, required: true,
                  label: Executor,
