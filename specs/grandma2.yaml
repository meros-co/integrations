spec: 1
id: grandma2
name: MA Lighting grandMA2
vendor: MA Lighting
category: lighting

source:
  - title: grandMA2 User Manual, Telnet Remote (Remote Controlling the System)
    author: MA Lighting International GmbH
    url: https://help.malighting.com/grandMA2/en/help/key_remote_control_telnet.html
    note: >
      Version 3.9 (manual for software 3.9; latest release notes list bug fix
      3.9.63.11). Port 30000, the Telnet setting (Setup > Console > Global
      Settings > Telnet: Login Disabled / Login Enabled), the login requirement,
      case-sensitive username and password, port 30001 read-only System
      Monitor, and the fixture setup lock restriction.
  - title: grandMA2 User Manual, Login keyword; Login on a station
    url: https://help.malighting.com/grandMA2/en/help/key_keyword_login.html
    note: >
      Syntax Login "User-name" "password". Login on a station
      (key_single_multi_systems_login.html) gives the default users Guest and
      Administrator (password admin) and the example "login administrator admin".
  - title: grandMA2 User Manual, General syntax rules
    url: https://help.malighting.com/grandMA2/en/help/key_cs_general_syntax_rules.html
    note: >
      The console does not distinguish upper and lower case in keywords;
      quotation marks enter a name. Each line is executed on Enter (Please).
  - title: grandMA2 User Manual, keyword pages (version 3.9)
    url: https://help.malighting.com/grandMA2/en/help/key_command_syntax_and_keywords.html
    note: >
      Every command below is the syntax of its keyword page,
      key_keyword_<name>.html: Go, GoBack, Goto, Load, LoadNext, LoadPrev,
      >>> (skipplus), <<< (skipminus), Pause, On, Off, Toggle, Top, Kill, Flash,
      FlashGo, FlashOn, Temp, Swop, SwopOn, SwopGo, Black, ToFull, ToZero,
      Crossfade, Learn, Rate1, DoubleRate, HalfRate, DoubleSpeed, HalfSpeed,
      Fix, Select, At, Executor, Page, FaderPage, ButtonPage, ChannelPage,
      Macro, Sequence, Cue, Timecode, Timer, DefGoPause, Blackout, Blind,
      Freeze, Solo, Highlight, SpecialMaster, View, ViewPage, World, Group,
      Fixture, Channel, Preset, Clear, ClearAll, ClearSelection, ClearActive,
      SaveShow.
  - title: grandMA2 User Manual, Remote keyword (remote input parameter table)
    url: https://help.malighting.com/grandMA2/en/help/key_keyword_remote.html
    note: >
      The documented ranges for an executor reference: page 0...9999 or
      current, executor 1...220.
  - title: grandMA2 User Manual, What are Executors; Executors on the Screens; Default and Grand Masters
    url: https://help.malighting.com/grandMA2/en/help/key_exec_what_are.html
    note: >
      Fader executors 1-30 (full-size) or 1-15 (light, ultra light), button
      executors 101-190 (key_exec_on_screen.html), SpecialMaster 2.1 is the
      Grand Master (key_adv_exec_spec_master_grand.html).
  - title: grandMA2 Release Notes 2.8, 3.1, 3.2, 3.3, 3.8
    url: https://help.malighting.com/grandMA2/en/help/release_notes/key_releasenotes.html
    note: Telnet fixes that become quirks below.
  - title: grandMA2 User Manual, grandMA3 Mode2 introduction
    url: https://help.malighting.com/grandMA2/en/help/grandma3_mode2/key_mode2_introduction.html
    note: grandMA3 hardware running grandMA2 software 3.4 and later.

transport:
  type: line-tcp
  port: 30000
  framing: terminated
  terminator: crlf
  encoding: ascii
  timeout_ms: 2000
  reply: none

settings:
  username:
    type: string
    default: administrator
    max_length: 64
    pattern: '^[^"]+$'
    label: Username
    description: "The show user the telnet session logs in as, case sensitive, so match the installation's exact spelling (administrator or Administrator)."
  password:
    type: string
    secret: true
    default: admin
    max_length: 64
    pattern: '^[^"]+$'
    label: Password
    description: "That user's password, case sensitive; a user without a password cannot be configured."

on_connect:
  - 'Login "{settings.username}" "{settings.password}"'

ports:
  - { port: 30000, protocol: tcp, role: control }

