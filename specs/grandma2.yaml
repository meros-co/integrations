quirks:
  - models: [all]
    severity: critical
    text: >
      Telnet is off by default. Setup > Console > Global Settings > Telnet must
      be set to Login Enabled; otherwise the station does not accept the
      connection. Use port 30000, not the telnet default 23 (Telnet Remote).

  - models: [all]
    severity: critical
    text: >
      Before any command is accepted the session must log in as a user in the
      show; on_connect sends Login "<username>" "<password>". The console's
      greeting claims the default guest user although the session is not
      logged in. Username and password are case sensitive over telnet,
      although keywords are not (Telnet Remote). A failed login is reported
      only as free text, which this spec cannot read, so with wrong
      credentials the connection looks established and every command is
      silently discarded. MA's own command-line example logs in as
      "administrator" while the station login page names the user
      "Administrator"; with case-sensitive telnet login the installation's
      exact spelling must be configured. A user without a password cannot be
      configured: the manual does not say whether Login "user" "" is accepted.

  - models: [all]
    severity: warning
    text: >
      There is no structured acknowledgement and no pushed state. The console
      echoes command-line feedback as free text, so a rejected command, a
      non-existent executor and a successful Go are indistinguishable. MA
      documents no machine-readable feedback over telnet; port 30001 gives a
      read-only System Monitor stream, also free text. All commands are
      unverified, and no state is tracked.

  - models: [all]
    severity: warning
    text: >
      The command entry point accepts arbitrary console syntax, including
      destructive operations such as Delete, Store and NewShow. CR and LF are
      rejected to prevent injecting a second command, but intent cannot be
      validated.

  - models: [all]
    severity: warning
    text: >
      Accessing the fixture setup (Patch) or schedule from a telnet session
      locks access for other users without a warning (Telnet Remote).

  - models: [all]
    severity: warning
    text: >
      Software before 3.8 could freeze when telnet commands contained illegal
      characters, and before 3.2 could crash on thousands of telnet commands
      or on a telnet connection closed too early (Release Notes 3.2, 3.8).
      Run 3.9 and pace bulk commands.

  - models: [all]
    severity: info
    text: >
      go, go_back, goto_cue and pause act on whichever executors are selected
      on the console, and the selection is per user. The *_executor commands
      act on the executor number on the current fader or button page, which an
      operator can change; the *_page_executor commands name the page and are
      the fixed target.

  - models: [all]
    severity: info
    text: >
      Executor numbers are 1-220 as the Remote keyword documents; which exist
      depends on the hardware and wings: fader executors 1-30 on a full-size
      and 1-15 on a light or ultra light, button executors 101-190 (101-130 on
      a full-size console, 101-115 on a light). The X-keys (X1-X20) are not
      reachable by number here. ButtonPage only calls pages already created.

  - models: [all]
    severity: info
    text: >
      Pool numbers for macros, sequences, timecode shows, timers, views,
      worlds, groups and presets, and fixture and channel IDs, have no
      documented upper bound; 9999 (99999 for fixtures and channels) is the
      bound used here, after the documented cue (9999.999) and page (9999)
      limits. Cue numbers are 0.001 to 9999.999 (Cue keyword).

  - models: [all]
    severity: info
    text: >
      Levels are whole percent. The manual's At examples use whole numbers
      and do not say whether a fractional percentage is accepted.
      Rate, Speed and MasterFade values are left to the command entry point:
      their units depend on user settings (Speed mode BPM/Hz/Sec) and their
      ranges are not documented.

  - models: [all]
    severity: info
    text: >
      Flash, Temp, Swop, SwopOn, SwopGo, Black and Fix are sent with an
      explicit On or Off (press and release); Blackout, Blind, Freeze, Solo
      and Highlight have both an explicit and a toggle form. Pause has both.
      Keywords are case-insensitive, so ON and OFF are accepted as On and Off.

  - models: [all]
    severity: info
    text: >
      MA's Web Remote is a browser interface (Setup > Console > Global
      Settings > Remotes, at most three remote users, Administrator cannot log
      in). MA documents no protocol for it, so it is not used here.
