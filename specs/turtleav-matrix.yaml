  set_ip_address:
    summary: Set the static IP address; applies after net_reboot
    params:
      address: {type: string, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', required: true, label: IP address, description: 'Static IPv4 address, e.g. 192.168.0.100.'}
