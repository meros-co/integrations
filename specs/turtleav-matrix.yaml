      action: {type: enum, values: ['on', 'off', menu, back, up, down, left, right, enter, play, pause, stop, rew, mute, vol-, vol+, ff, previous, next], required: true, label: Action, description: The CEC command to send to the source device.}
    send: s cec in {input} {action}!
