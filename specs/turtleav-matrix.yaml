    params:
      output: {type: int, min: 0, max: 8, required: true, label: Output, description: 'HDMI output 1 to 8 (1 to 4 on the 4x4); 0 addresses every output.'}
      action: {type: enum, values: ['on', 'off', mute, vol-, vol+, active], required: true, label: Action, description: The CEC command to send to the display.}
    send: s cec hdmi out {output} {action}!
    expect: {not_contains: E0}
    returns: ack
    # 4X4 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §13 RS-232 Control Command, 8x8 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §10 RS-232 Control Command

  set_panel_lock:
    summary: Lock or unlock the front panel buttons
    params:
      locked: {type: bool, required: true, label: Locked, description: On locks the front panel buttons.}
