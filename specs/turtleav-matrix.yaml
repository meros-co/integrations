  set_subnet:
    summary: Set the static subnet mask; applies after net_reboot
    params:
      mask: {type: string, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', required: true, label: Subnet mask, description: 'Subnet mask, e.g. 255.255.255.0.'}
    send: s subnet {mask}!
    expect: {not_contains: E0}
    returns: ack
    # 4X4 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §13 RS-232 Control Command, 8x8 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §10 RS-232 Control Command

  set_gateway:
    summary: Set the static gateway; applies after net_reboot
    params:
      gateway: {type: string, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$', required: true, label: Gateway, description: 'Gateway IPv4 address, e.g. 192.168.0.1.'}
    send: s gateway {gateway}!
    expect: {not_contains: E0}
    returns: ack
    # 4X4 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §13 RS-232 Control Command, 8x8 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §10 RS-232 Control Command

  set_tcp_port:
    summary: Set the TCP/IP control port
    params:
      port: {type: int, min: 1, max: 65535, required: true, label: Port, description: 'TCP control port, 8000 by default.'}
    send: s tcp/ipport {port}!
    expect: {not_contains: E0}
    returns: ack
    # 4X4 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §13 RS-232 Control Command, 8x8 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §10 RS-232 Control Command

  set_telnet_port:
    summary: Set the Telnet port
    params:
      port: {type: int, min: 1, max: 65535, required: true, label: Port, description: 'Telnet port, 23 by default.'}
    send: s telnet port {port}!
    expect: {not_contains: E0}
    returns: ack
    # 4X4 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §13 RS-232 Control Command, 8x8 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §10 RS-232 Control Command

  net_reboot:
    summary: Restart the network module to apply new network settings
    send: s net reboot!
    expect: {not_contains: E0}
    returns: ack
    # 4X4 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §13 RS-232 Control Command, 8x8 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §10 RS-232 Control Command

telemetry:
  # r power! is polled and r lock! read each minute; their replies queue each
  # model's own reads (then_send), so a model is asked only for what it has.
  poll:
    every_ms: 10000
    send:
    - r power!
  subscribe:
    every_ms: 60000
    send:
    - r lock!
  updates:
    - match: '(?i)^output ?(\d+) ?-> ?input ?(\d+)$'
      state:
        outputs.{1}.input: '{2}'
    - match: '(?i)^power (on|off)$'
      state:
        power: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '^beep (on|off)$'
      state:
        beep: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '^panel button lock (on|off)$'
      state:
        panel_locked: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '^lcd (always on|off|on \d+ seconds)$'
      state:
        lcd: '{1}'
    - match: '^logo1 ?: ?(.*)$'
      state:
        logo: '{1}'
    - match: '^serial number ?: ?(\S+)$'
      state:
        serial: '{1}'
    - match: '^mcu fw ?version ?: ?(\S+)$'
      state:
        firmware.mcu: '{1}'
    - match: '^web gui(?: version)? ?: ?(\S+)$'
      state:
        firmware.web: '{1}'
    - match: '^(cpld|audio|key)(?: fw)?(?: version)? ?: ?(\S+)$'
      state:
        firmware.{1}: '{2}'
    - match: '^display mode: (.+)$'
      state:
        display_mode: '{1}'
    - match: '^output ?(\d+) resolution: ?(\S+)$'
      state:
        outputs.{1}.resolution: '{2}'
    - match: '^output ?(\d+) csc: ?(\S+)$'
      state:
        outputs.{1}.csc: '{2}'
    - match: '^output ?(\d+) hdcp: ?(.+)$'
      state:
        outputs.{1}.hdcp: '{2}'
    - models: [mx44vw]
      match: '^output ?(\d+) h mirror (on|off)(?:, ?v mirror (on|off))?$'
      state:
        outputs.{1}.h_mirror: {value: '{2}', map: {'on': true, 'off': false}}
        outputs.{1}.v_mirror: {value: '{3}', map: {'on': true, 'off': false}}
    - models: [mx44vw]
      match: '^output ?(\d+) v mirror (on|off)$'
      state:
        outputs.{1}.v_mirror: {value: '{2}', map: {'on': true, 'off': false}}
    - models: [mx88vw]
      match: '^output ?(\d+) ((?:h\+v |h |v )?mirror (?:on|off))$'
      state:
        outputs.{1}.mirror: '{2}'
    - match: '^output ?(\d+) stream: ?(enable|disable)$'
      state:
        outputs.{1}.stream: {value: '{2}', map: {enable: true, disable: false}}
    - match: '^output background: (.+)$'
      state:
        background: '{1}'
    - match: '^input ?(\d+) edid: ?(.+)$'
      state:
        inputs.{1}.edid: '{2}'
    - match: '^input ?(\d+) select (hdmi original|embed analog) audio$'
      state:
        inputs.{1}.audio_source: {value: '{2}', map: {hdmi original: hdmi, embed analog: analog}}
    - match: '^output ?(\d+) ext-audio: ?(enable|disable)$'
      state:
        outputs.{1}.exa: {value: '{2}', map: {enable: true, disable: false}}
    - match: '^output ?(\d+) ext-audio ?-> ?input ?(\d+)$'
      state:
        outputs.{1}.exa_input: '{2}'
    - match: '^output ext-audio mo(?:d)?e: (.+)$'
      state:
        exa_mode: '{1}'
    - match: '^recall from preset (\d+)$'
      state:
        preset.recalled: '{1}'
    - match: '^tv wall mode: (.+)$'
      state:
        wall.layout: '{1}'
    - match: '^tv wall horizontal bezel: (\d+)$'
      state:
        wall.h_bezel: '{1}'
    - match: '^tv wall vertical bezel: (\d+)$'
      state:
        wall.v_bezel: '{1}'
    - match: '^tv wall group (\d) input: hdmi input (\d)$'
      state:
        wall.groups.{1}.input: '{2}'
    - match: '^tv wall resolution: (\S+)$'
      state:
        wall.resolution: '{1}'
    - models: [mx44vw]
      match: '^(single|pip|dual|triple|quad|user) screen$'
      state:
        multiview.layout: '{1}'
    - match: '^window (\d) select hdmi (\d)$'
      state:
        multiview.windows.{1}.input: '{2}'
    - match: '^pip on (upper left|lower left|upper right|lower right)$'
      state:
        multiview.pip_position: '{1}'
    - match: '^pip size: (small|middle|large)$'
      state:
        multiview.pip_size: '{1}'
    - match: '^(dual|triple|quad|user) (\d) mode$'
      state:
        multiview.{1}_mode: '{2}'
    - match: '^aspect: (.+)$'
      state:
        multiview.aspect: '{1}'
    - match: '^output audio: (.+)$'
      state:
        multiview.audio: '{1}'
    - match: '^multi-viewer resolution: (\S+)$'
      state:
        multiview.resolution: '{1}'
    - match: '^create vw screen (\d)x(\d)$'
      state:
        wall.rows: '{1}'
        wall.cols: '{2}'
    - models: [mx88vw]
      match: '^row ?: ?(\d)$'
      state:
        wall.rows: '{1}'
    - models: [mx88vw]
      match: '^col ?: ?(\d)$'
      state:
        wall.cols: '{1}'
    - match: '^hdmi output ?(\d) ?-> ?screen ?(\d)$'
      state:
        wall.screens.{2}.output: '{1}'
    - match: '^vw group (\d) row (\d) col (\d)!?$'
      state:
        wall.groups.{1}.rows: '{2}'
        wall.groups.{1}.cols: '{3}'
    - match: '^vw group (\d) screen ([1-8]+)!?$'
      state:
        wall.groups.{1}.screens: '{2}'
    - match: '^vw group (\d) source (\d)!?$'
      state:
        wall.groups.{1}.input: '{2}'
    - match: '^video wall group (\d) h bezel: (\d+)$'
      state:
        wall.groups.{1}.h_bezel: '{2}'
    - match: '^video wall group (\d) v bezel: (\d+)$'
      state:
        wall.groups.{1}.v_bezel: '{2}'
    - match: '^video wall group (\d) resolution: (\S+)$'
      state:
        wall.groups.{1}.resolution: '{2}'
    - match: '^delete vw group (\d)!?$'
      state:
        wall.groups.{1}: {delete: true}
    - match: '^(side|top) fans ?: ?(on|off)$'
      state:
        fans.{1}: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^set (side|top) fans (on|off)$'
      state:
        fans.{1}: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^(?:set )?ip mode: ?(static|dhcp)\.?$'
      state:
        network.ip_mode: '{1}'
    - match: '^(?:set )?ip(?: address)?: ?([0-9.]+)$'
      state:
        network.ip: '{1}'
    - match: '^(?:set )?subnet mask: ?([0-9.]+)$'
      state:
        network.subnet: '{1}'
    - match: '^(?:set )?gateway: ?([0-9.]+)$'
      state:
        network.gateway: '{1}'
    - match: '^(?:set )?tcp/ip ?port ?[:=] ?(\d+)$'
      state:
        network.tcp_port: '{1}'
    - match: '^(?:set )?telnet port ?[:=] ?(\d+)$'
      state:
        network.telnet_port: '{1}'
    - match: '^mac address: ?([0-9A-Fa-f:]+)$'
      state:
        network.mac: '{1}'
    - models: [mx44vw]
      match: '(?i)^power (?:on|off)$'
      request_match: '^r power!$'
      then_send:
      - 'r output 1 in source!'
      - 'r output 2 in source!'
      - 'r output 3 in source!'
      - 'r output 4 in source!'
      - 'r display mode!'
    - models: [mx88vw]
      match: '(?i)^power (?:on|off)$'
