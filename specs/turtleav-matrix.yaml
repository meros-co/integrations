    params:
      mode: {type: int, min: 0, max: 4, required: true, label: LCD, description: '0 off, 1 always on, 2 15 s, 3 30 s, 4 60 s.'}
    send: s lcd on time {mode}!
    expect: {not_contains: E0}
    returns: ack
    # 4X4 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §13 RS-232 Control Command, 8x8 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §10 RS-232 Control Command

  set_logo:
    summary: Set the text on the front LCD's first line
    params:
      text: {type: string, max_length: 16, pattern: '^[ -~]{1,16}$', required: true, label: Logo, description: 'Up to 16 printable ASCII characters.'}
    send: s logo1 {text}!
    expect: {not_contains: E0}
    returns: ack
    # 4X4 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §13 RS-232 Control Command, 8x8 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §10 RS-232 Control Command

  set_baud_rate:
    summary: Set the 8x8's RS-232 baud rate
    params:
      rate: {type: int, min: 1, max: 6, required: true, label: Baud rate, description: '1 115200, 2 57600, 3 38400, 4 19200, 5 9600, 6 4800.'}
    send: s baud rate {rate}!
    expect: {not_contains: E0}
    returns: ack
    # 8x8 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §10 RS-232 Control Command

  set_fan:
    summary: Turn the 8x8's fans on or off
    params:
      fans: {type: int, min: 0, max: 2, required: true, label: Fans, description: '1 side fans, 2 top fans; 0 all.'}
      enabled: {type: bool, required: true, label: Running, description: True runs the fans.}
    send: s fan {fans} {enabled:bool01}!
