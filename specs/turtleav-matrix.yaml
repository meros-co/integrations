    expect: {not_contains: E0}
    returns: ack
    # 8x8 4K60 4:4:4 Videowall, Matrix and Multiview user manual, §10 RS-232 Control Command

  set_wall_group_screens:
    summary: Set which screens make up an 8x8 video wall group
    params:
      group: {type: int, min: 1, max: 4, required: true, label: Group, description: Video wall group 1 to 4.}
