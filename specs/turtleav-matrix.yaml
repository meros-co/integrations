  set_output_exa:
    summary: Enable or disable an output's analog audio out
    params:
      output: {type: int, min: 0, max: 8, required: true, label: Output, description: 'HDMI output 1 to 8 (1 to 4 on the 4x4); 0 addresses every output.'}
      enabled: {type: bool, required: true, label: Analog audio, description: True enables the output's analog audio out.}
    send: s output {output} exa {enabled:bool01}!
    expect: {not_contains: E0}
    returns: ack
