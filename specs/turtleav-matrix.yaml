  set_wall_group_h_bezel:
    summary: Set an 8x8 video wall group's horizontal bezel compensation
    params:
      group: {type: int, min: 1, max: 4, required: true, label: Group, description: Video wall group 1 to 4.}
      bezel: {type: int, min: 0, max: 10, required: true, label: Bezel, description: Bezel compensation 0 to 10.}
    send: s vw group {group} hbezel {bezel}!
    expect: {not_contains: E0}
    returns: ack
