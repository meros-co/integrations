state:
  power:                 {type: bool, description: Matrix powered on}
  model_name:            {type: string, description: 'The model the matrix reports (HDP-MXB88VW, 4x4 hdmi seamless matrix)'}
  serial:                {type: string, description: Serial number (8x8)}
  firmware.mcu:          {type: string, description: MCU firmware version}
  firmware.web:          {type: string, description: Web interface version}
  firmware.cpld:         {type: string, description: CPLD firmware version (8x8)}
  firmware.audio:        {type: string, description: Audio firmware version (8x8)}
  firmware.key:          {type: string, description: Key board firmware version (8x8)}
  beep:                  {type: bool, description: Buzzer on}
  panel_locked:          {type: bool, description: Front panel buttons locked}
  lcd:                   {type: string, description: 'How long the LCD stays lit, as the matrix words it (lcd always on, lcd on 30 seconds)'}
  logo:                  {type: string, description: Text on the LCD's first line}
  display_mode:          {type: string, description: 'Display mode as the matrix words it: matrix, video wall or multi-viewer'}
  background:            {type: string, description: 'No-signal background, as the matrix words it (black screen)'}
  exa_mode:              {type: string, description: 'How the analog audio outs follow the video, as the matrix words it (bind to input)'}
  preset.recalled:       {type: int, description: 'The preset last recalled, as the matrix reported it'}
  outputs.*.input:       {type: int, description: 'Input shown on the output, keyed by output number'}
  outputs.*.resolution:  {type: string, description: 'Output resolution, e.g. 3840x2160p60'}
  outputs.*.csc:         {type: string, description: 'Output colour space: rgb444, ycbcr444, ycbcr422 or ycbcr420'}
  outputs.*.hdcp:        {type: string, description: 'Output HDCP mode, as the matrix words it (hdcp 1.4, follow sink)'}
  outputs.*.h_mirror:    {type: bool, description: Output mirrored left to right (4x4)}
  outputs.*.v_mirror:    {type: bool, description: Output flipped top to bottom (4x4)}
  outputs.*.mirror:      {type: string, description: 'Output mirroring, as the 8x8 words it (mirror off, h mirror on, h+v mirror on)'}
  outputs.*.stream:      {type: bool, description: Output video enabled}
  outputs.*.exa:         {type: bool, description: Output's analog audio out enabled}
  outputs.*.exa_input:   {type: int, description: Input whose audio the output's analog out carries}
  inputs.*.edid:         {type: string, description: 'Input EDID, as the matrix words it (4k60, 2.0ch)'}
  inputs.*.audio_source: {type: string, description: 'Input audio (4x4): hdmi, or analog embedded in its place'}
  wall.layout:           {type: string, description: 'The 4x4 video wall layout, as it words it (2x2)'}
  wall.h_bezel:          {type: int, description: The 4x4 video wall's horizontal bezel compensation}
  wall.v_bezel:          {type: int, description: The 4x4 video wall's vertical bezel compensation}
  wall.resolution:       {type: string, description: The 4x4 video wall's resolution}
  wall.rows:             {type: int, description: Video wall screen rows (8x8)}
  wall.cols:             {type: int, description: Video wall screen columns (8x8)}
  wall.screens.*.output: {type: int, description: 'HDMI output assigned to a wall screen, keyed by screen (8x8)'}
  wall.groups.*.input:   {type: int, description: 'Input a video wall group shows, keyed by group 1-4'}
  wall.groups.*.rows:    {type: int, description: Group rows (8x8)}
  wall.groups.*.cols:    {type: int, description: Group columns (8x8)}
  wall.groups.*.screens: {type: string, description: 'Screens in the group, written together (2367) (8x8)'}
  wall.groups.*.h_bezel: {type: int, description: Group horizontal bezel compensation (8x8)}
  wall.groups.*.v_bezel: {type: int, description: Group vertical bezel compensation (8x8)}
  wall.groups.*.resolution: {type: string, description: Group output resolution (8x8)}
  multiview.layout:      {type: string, description: 'Multiviewer layout (4x4): single, pip, dual, triple, quad or user'}
  multiview.windows.*.input: {type: int, description: 'Input in a multiviewer window, keyed by window 1-4'}
  multiview.pip_position: {type: string, description: 'Picture-in-picture position: upper left, lower left, upper right, lower right'}
  multiview.pip_size:    {type: string, description: 'Picture-in-picture size: small, middle or large'}
  multiview.dual_mode:   {type: int, description: Dual-window arrangement}
  multiview.triple_mode: {type: int, description: Triple-window arrangement}
  multiview.quad_mode:   {type: int, description: Quad-window arrangement}
  multiview.user_mode:   {type: int, description: User-defined arrangement}
  multiview.aspect:      {type: string, description: 'Window aspect ratio, as the matrix words it (full screen)'}
  multiview.audio:       {type: string, description: 'Multiviewer output audio, as the matrix words it (follow window 1 selected source)'}
  multiview.resolution:  {type: string, description: Multiviewer output resolution}
  fans.side:             {type: bool, description: Side fans on (8x8)}
  fans.top:              {type: bool, description: Top fans on (8x8)}
  network.ip_mode:       {type: string, description: 'static or dhcp'}
  network.ip:            {type: string, description: IPv4 address}
  network.subnet:        {type: string, description: Subnet mask}
  network.gateway:       {type: string, description: Gateway}
  network.tcp_port:      {type: int, description: TCP/IP control port}
  network.telnet_port:   {type: int, description: Telnet port}
  network.mac:           {type: string, description: MAC address}

quirks:
  - models: [all]
    severity: critical
    text: >
      route, the preset recalls, set_display_mode and the video wall and multiviewer
      commands change what the displays show at once; reboot drops every output until the
      matrix is back, and factory_reset also clears routing, EDID, presets and the network.
      None asks for confirmation. The network commands take effect after net_reboot or a
      power cycle, and a wrong address leaves the matrix unreachable.

  - models: [all]
    severity: warning
    text: >
      Commands end with ! as documented, and the core adds CR LF after it, since the
      documents say nothing of line endings and replies are read as lines. The documents
      do not say whether port 23 or port 8000 carries the commands, or whether Telnet
      options are negotiated; port 23 is used, and a port given when opening overrides it.

  - models: [all]
    severity: warning
    text: >
      Nothing is pushed. r power! is polled every 10 seconds and its reply queues each
      output's routing and the display mode; r lock! (the panel lock) is read every minute
      and its reply queues every other setting the model reads (model name, output
      resolution, colour space, HDCP, mirror, stream, analog audio, input EDID, beep, LCD,
      background, video wall and multiviewer settings, serial number, network, firmware).
      Replies to this session's commands update state at once. Only the 8x8 documents
      error codes (E00, E01, E02); a 4x4 error reply is not documented.

  - models: [all]
    severity: warning
    text: >
      Some replies are several lines (r fw version!, r vw info!, an output or input 0 for
      all, a network change with its reminder to run s net reboot!). Replies are taken in
      order, so the extra lines can be taken as the answers to the next queued reads; the
      multi-line reads are queued last, and every line that names its output, input or
      setting still updates state.

  - models: [mx88vw]
    severity: info
    text: >
      r vw info! gives the wall's output and input assignment and each mosaic's screens on
      lines of their own after a label line (output:, then 12345678), which the spec format
      cannot tie to the label (one message at a time, no state between lines); only its
      row and col lines are read. Video wall groups are kept from the replies to the vw
      group commands. The preset reads (get_matrix_preset, get_wall_preset) answer in an
      undocumented multi-line form and are offered as commands returning the first line,
      not kept in state. The baud rate has no read (an API limit).

  - models: [mx44vw]
    severity: info
    text: >
      route_ext_audio, set_output_csc, set_output_stream, set_output_exa, cec_input and
      cec_output take indexes up to 8 for both models; the 4x4 has 4 inputs and outputs.
      The multiviewer layout reply is documented only for single (single screen). get_preset
      answers in an undocumented multi-line form and returns the first line.
