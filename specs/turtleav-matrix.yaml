  route_ext_audio:
    summary: Route an input's audio to an output's analog audio out
    params:
      output: {type: int, min: 0, max: 8, required: true, label: Output, description: 'HDMI output 1 to 8 (1 to 4 on the 4x4); 0 addresses every output.'}
      input: {type: int, min: 1, max: 8, required: true, label: Input, description: HDMI input 1 to 8.}
