  create_wall_screen:
    summary: Lay out the 8x8's video wall screens in rows and columns
    params:
      rows: {type: int, min: 1, max: 8, required: true, label: Rows, description: Screen rows 1 to 8.}
      cols: {type: int, min: 1, max: 8, required: true, label: Columns, description: Screen columns 1 to 8.}
