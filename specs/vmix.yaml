state:
  device.version:          { type: string, description: "vMix version" }
  device.edition:          { type: string, description: "vMix edition" }
  program:                 { type: int, description: "Input number on program" }
  preview:                 { type: int, description: "Input number on preview" }
  inputs.*.title:          { type: string, description: "Input title, keyed by input number" }
  inputs.*.type:           { type: string, description: "Input type, such as Capture, Video or GT" }
  inputs.*.key:            { type: string, description: "Input GUID, stable across renumbering" }
  inputs.*.playing:        { type: bool, description: "Input playing" }
  inputs.*.muted:          { type: bool, description: "Input audio muted; absent for inputs without audio" }
  inputs.*.volume:         { type: float, description: "Input volume, 0 to 100; absent for inputs without audio" }
  tally.*.program:         { type: bool, description: "Input on program, keyed by input number (main mix)" }
  tally.*.preview:         { type: bool, description: "Input on preview (main mix)" }
  overlays.*.input:        { type: int, description: "Input in the overlay channel, keyed by overlay number; absent when empty" }
  recording:               { type: bool, description: "Recording" }
  streaming:               { type: bool, description: "Streaming (any stream)" }
  external:                { type: bool, description: "External output running" }
  multicorder:             { type: bool, description: "MultiCorder running" }
  fade_to_black:           { type: bool, description: "Faded to black" }

quirks:
  - models: [all]
    severity: info
    text: >
      Inputs are given as a number, the exact title (case-sensitive), or the
      input's key from the state. Numbers change when inputs are added or
      removed; keys do not.

  - models: [all]
    severity: info
    text: >
      Tally, program, preview, playing, mute and the output flags are pushed as
      they change (SUBSCRIBE TALLY and ACTS). Titles, volumes and overlays come
      from the full XML state, read on connection and every 10 seconds.

  - models: [all]
    severity: info
    text: >
      The TCP API documents no authentication, and none is sent. vMix restricts
      the TCP API to the local network by default ("Restrict access to LAN
      only").
