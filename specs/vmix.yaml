commands:
  activator_refresh:
    summary: "ActivatorRefresh (General): Refresh all activator device lights and controls"
    returns: ack

  call_manager_show_hide:
    summary: "CallManagerShowHide (General)"
    returns: ack

  key_press:
    summary: "KeyPress (General): Value = Key"
    params:
      value: { type: string, max_length: 4096, label: Key, description: "Key to press, as vMix names it." }
    returns: ack

  send_keys:
    summary: "SendKeys (General): Send keys to active window Value = Keys"
    params:
      value: { type: string, max_length: 4096, label: Keys, description: "Keys to send to the active window." }
    returns: ack

  set_dynamic_value1:
    summary: "SetDynamicValue1 (General): Set Dynamic Value to use when specifying Dynamic1 as a shortcut value. Value = Value"
    params:
      value: { type: string, max_length: 4096, label: Value, description: "Text to use wherever Dynamic1 to Dynamic4 is given as a shortcut value." }
    returns: ack

  set_dynamic_value2:
    summary: "SetDynamicValue2 (General): Set Dynamic Value to use when specifying Dynamic2 as a shortcut value. Value = Value"
    params:
      value: { type: string, max_length: 4096, label: Value, description: "Text to use wherever Dynamic1 to Dynamic4 is given as a shortcut value." }
    returns: ack

  set_dynamic_value3:
    summary: "SetDynamicValue3 (General): Set Dynamic Value to use when specifying Dynamic3 as a shortcut value. Value = Value"
    params:
      value: { type: string, max_length: 4096, label: Value, description: "Text to use wherever Dynamic1 to Dynamic4 is given as a shortcut value." }
    returns: ack

  set_dynamic_value4:
    summary: "SetDynamicValue4 (General): Set Dynamic Value to use when specifying Dynamic4 as a shortcut value. Value = Value"
    params:
      value: { type: string, max_length: 4096, label: Value, description: "Text to use wherever Dynamic1 to Dynamic4 is given as a shortcut value." }
    returns: ack

  undo:
    summary: "Undo (General): Undo closing Input."
    returns: ack

  audio:
    summary: "Audio (Audio): Toggle Audio Mute On/Off"
    params:
      input: { type: string, max_length: 256, label: Input, description: "Input by number, exact title (case-sensitive) or key; left out, vMix uses its own default." }
    returns: ack

  audio_auto:
