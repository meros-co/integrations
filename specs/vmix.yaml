spec: 1
id: vmix
name: vMix
vendor: StudioCoast
category: switcher
implementation: native
reason: >
  The TCP API mixes line replies with replies whose header gives a byte count
  for the data that follows, and pushes subscribed tally and activator events
  at any time, including between a request and its reply. Replies are paired
  with requests by order, one request at a time.

source:
  - title: vMix Help, TCP API
    author: StudioCoast
    url: https://www.vmix.com/help29/TCPAPI.html
    note: >
      Manufacturer document. Port 8099, CRLF lines, the <command> <status or
      length> [response] reply grammar, one request at a time, FUNCTION,
      TALLY, ACTS, XML, SUBSCRIBE, and events arriving between requests and
      replies.
  - title: vMix Help, Shortcut Function Reference and Developer API
    author: StudioCoast
    url: https://www.vmix.com/help29/ShortcutFunctionReference.html
    note: >
      Every function and its parameters. Each command here is one of them,
      generated by tools/generate_vmix.py: the function in snake_case, with
      the parameters the reference lists (Input as a number, title or key;
      Value; Duration in ms; SelectedName; SelectedIndex; Mix; Channel), all
      optional because vMix applies its own defaults. Transitions are
      functions named as in vMix's interface: cut and fade, and
      run_transition for any other.
  - title: Bitfocus Companion, companion-module-studiocoast-vmix
    url: https://github.com/bitfocus/companion-module-studiocoast-vmix
    note: >
      MIT-licensed; cross-check only. The unsolicited VERSION OK line on
      connect, activator message shapes, and URL-encoded function values.
  - title: TallyArbiter vMix source
    url: https://github.com/josephdadams/TallyArbiter
    note: MIT-licensed; the tally string's first digit is input 1.
  - title: Tally vMix client (tally/vMix.cpp)
    note: Meros. SUBSCRIBE TALLY and the digit-per-input tally line.

ports:
  - { port: 8099, protocol: tcp, role: control }

