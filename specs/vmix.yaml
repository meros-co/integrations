state:
  device.version:          { type: string, description: "vMix version" }
  device.edition:          { type: string, description: "vMix edition, such as Basic HD, HD, 4K or Pro" }
  device.preset:           { type: string, description: "Path of the preset file open in vMix, on the vMix computer; absent when none has been saved or opened" }
  program:                 { type: int, description: "Input number on program (main mix)" }
  preview:                 { type: int, description: "Input number on preview (main mix)" }
  mixes.*.program:         { type: int, description: "Input number on program in another mix, keyed by mix number as the XML numbers them (2 to 16; the mix command parameter is this number less 1)" }
  mixes.*.preview:         { type: int, description: "Input number on preview in another mix, keyed as mixes.*.program" }
  inputs.*.title:          { type: string, description: "Input title, keyed by input number" }
  inputs.*.type:           { type: string, description: "Input type, such as Capture, Video or GT" }
  inputs.*.key:            { type: string, description: "Input GUID, stable across renumbering" }
  inputs.*.playing:        { type: bool, description: "Input playing" }
  inputs.*.muted:          { type: bool, description: "Input audio muted; absent for inputs without audio" }
  inputs.*.volume:         { type: float, unit: percent, description: "Input volume, 0 to 100; absent for inputs without audio" }
  inputs.*.balance:        { type: float, description: "Input audio balance, -1 (left) to 1 (right), 0 centred" }
  inputs.*.solo:           { type: bool, description: "Input audio soloed" }
  inputs.*.gain_db:        { type: float, unit: dB, description: "Input audio gain, 0 to 24" }
  inputs.*.audio_auto:     { type: bool, description: "Input audio follows the input on and off program (Audio Auto); from its activator, asked for once per new input with audio" }
  inputs.*.audio_buses.*:  { type: bool, description: "Input audio sent to the bus, keyed M (master) and A to G" }
  inputs.*.channel_mixer.*: { type: float, unit: percent, description: "Channel mixer volume, 0 to 100, keyed by channel 1 to 16; from its activator, asked for once per new input with audio" }
  inputs.*.meter_left:     { type: float, description: "Input audio level of the first channel (meterF1), linear from 0, as of the last XML read" }
  inputs.*.meter_right:    { type: float, description: "Input audio level of the second channel (meterF2), linear from 0, as of the last XML read" }
  tally.*.program:         { type: bool, description: "Input on program, keyed by input number (main mix)" }
  tally.*.preview:         { type: bool, description: "Input on preview (main mix)" }
  master.volume:           { type: float, unit: percent, description: "Master volume, 0 to 100" }
  master.muted:            { type: bool, description: "Master muted" }
  master.headphones_volume: { type: float, unit: percent, description: "Headphones volume, 0 to 100" }
  master.meter_left:       { type: float, description: "Master level of the first channel (meterF1), linear from 0, as of the last XML read" }
  master.meter_right:      { type: float, description: "Master level of the second channel (meterF2), linear from 0, as of the last XML read" }
  master.solo:             { type: bool, description: "Master soloed, when vMix reports it" }
  master.send_to_master:   { type: bool, description: "As buses.*.send_to_master, when vMix reports it for the master" }
  master.attributes.*:     { type: string, description: "Any other attribute of the master's XML element, by name, as vMix reports it" }
  buses.*.volume:          { type: float, unit: percent, description: "Bus volume, 0 to 100, keyed by bus A to G; absent for buses the edition lacks" }
  buses.*.muted:           { type: bool, description: "Bus muted" }
  buses.*.solo:            { type: bool, description: "Bus soloed" }
  buses.*.send_to_master:  { type: bool, description: "Bus also sent to the master" }
  buses.*.headphones_volume: { type: float, unit: percent, description: "As master.headphones_volume, when vMix reports it for a bus" }
  buses.*.meter_left:      { type: float, description: "Bus level of the first channel (meterF1), linear from 0, as of the last XML read" }
  buses.*.meter_right:     { type: float, description: "Bus level of the second channel (meterF2), linear from 0, as of the last XML read" }
  buses.*.attributes.*:    { type: string, description: "Any other attribute of the bus's XML element, by name, as vMix reports it" }
  overlays.*.input:        { type: int, description: "Input in the overlay channel, keyed by overlay number (1 to 4 the overlay channels, higher numbers the stingers); absent when empty" }
  overlays.*.preview:      { type: bool, description: "The overlay is shown on preview only, not on program" }
  transitions.*.effect:    { type: string, description: "Effect of the transition button, keyed by button number (1 to 4), such as Fade, Merge or Wipe" }
  transitions.*.duration:  { type: int, unit: ms, description: "Duration of the transition button's effect" }
  outputs.*.type:          { type: string, description: "Output or Fullscreen, keyed by type and number in lower case (output1 to output4, fullscreen1, fullscreen2)" }
  outputs.*.number:        { type: int, description: "The output's number within its type" }
  outputs.*.source:        { type: string, description: "What the output shows: Output, Preview, MultiView, Replay, Mix or Input" }
  outputs.*.input:         { type: int, description: "Input shown, when the source is Input" }
  outputs.*.mix:           { type: int, description: "Mix shown, when the source is Mix, as the XML numbers it" }
  outputs.*.ndi:           { type: bool, description: "The output is also sent as NDI" }
  outputs.*.omt:           { type: bool, description: "The output is also sent as OMT" }
  outputs.*.srt:           { type: bool, description: "The output is also sent as SRT" }
  recording:               { type: bool, description: "Recording" }
  recording_duration:      { type: int, unit: s, description: "Time recording so far" }
  recording_files.*:       { type: string, description: "File being recorded, keyed 1 and 2 (the second recording), on the vMix computer" }
  streaming:               { type: bool, description: "Streaming (any stream)" }
  streams.*:               { type: bool, description: "Stream running, keyed by stream number from 1" }
  external:                { type: bool, description: "External output running" }
  multicorder:             { type: bool, description: "MultiCorder running" }
  playlist:                { type: bool, description: "Playlist running" }
  fullscreen:              { type: bool, description: "Fullscreen output on" }
  fade_to_black:           { type: bool, description: "Faded to black" }
  other.*:                 { type: string, description: "Any other top-level XML element holding text only, keyed by element name, as vMix reports it" }

quirks:
  - models: [all]
    severity: info
    text: >
      Inputs are given as a number, the exact title (case-sensitive), or the
      input's key from the state. Numbers change when inputs are added or
      removed; keys do not.

  - models: [all]
    severity: info
    text: >
      Tally, program and preview (every mix), playing, mute and the output
      flags are pushed as they change (SUBSCRIBE TALLY and ACTS). Everything
      else comes from the full XML state, read on connection and every
      state_poll_ms (1 s by default); a read reports only what changed since
      the state last held it. Overlays come from the XML only: their
      activators do not tell an overlay on preview from one on program.

  - models: [all]
    severity: info
    text: >
      The TCP API documents no authentication, and none is sent. vMix restricts
      the TCP API to the local network by default ("Restrict access to LAN
      only").
