quirks:
  - models: [all]
    severity: critical
    text: >
      recall_preset replaces the unit's whole conversion and processing setup at once, and
      set_output_video_mode changes the output format at once; downstream equipment sees
      the change live. save_preset overwrites a stored preset. None of them asks for
      confirmation.

  - models: [all]
    severity: critical
    text: >
      set_dhcp changes how the unit takes its address; the connection can drop and the
      unit come back at another address, or none if no DHCP server answers. The document
      advises against changing DHCP over the protocol (p.111).

  - models: [all]
    severity: warning
    text: >
      Replies are asynchronous: an ACK means the request was understood, not that it
      happened. The unit then sends the changed block, sometimes followed by other blocks
      it changed as a result, and only those blocks update state (p.101-102). The document
      calls the refusal NACK; Blackmagic's other Ethernet protocols use NAK, so both are
      taken as a refusal. A status update holds only the items that changed (p.102).

  - models: [all]
    severity: warning
    text: >
      The document gives the output format two ways: the Command Syntax example sends
      Video mode 1080i5994 (p.101), while the Video Output table writes 2160p59.94
      (p.116), and the community Companion module uses the dotted form (1080i59.94).
      set_output_video_mode sends the text given; the format the unit reports in
      video_output.video_mode is the one to send back.

  - models: [all]
    severity: warning
    text: >
      The document names each command group by a section title rather than always showing
      its block header. VIDEO OUTPUT, VIDEO ADJUST, ANCILLARY DATA, VARIABLE ASPECT RATIO,
      ALIGN, MODE3D, TERANEX DEVICE and PROTOCOL PREAMBLE appear as headers in its
      examples, and the community Companion module also uses VIDEO INPUT, VIDEO PROC AMP,
      VIDEO ADVANCED, NOISE REDUCTION, GENLOCK, TEST PATTERN and PRESET. AUDIO and NETWORK
      CONFIG are inferred the same way from the section titles; a NACK to those commands
      means the header differs.

  - models: [all]
    severity: info
    text: >
      On/off settings are written as True/False in the document's tables, false in its
      example status, and ON/OFF by the community Companion module. Commands send true or
      false; state accepts true, false, True, False, ON, OFF, On and Off.

  - models: [all]
    severity: info
    text: >
      Genlock line and pixel offsets, Variable Aspect Ratio and camera align values have
      ranges set by the current output format (p.109, p.113). The parameter bounds are the
      widest the core accepts (genlock up to the 2160p line and sample counts, aspect and
      align plus or minus 4096); the unit refuses a value outside the current format's
      range. The unit reports Variable Aspect Ratio and align values as decimals
      (0.000000), sent here as whole pixels or lines.

  - models: [all]
    severity: info
    text: >
      Some VIDEO INPUT and VIDEO OUTPUT items are read only (Video mode of the input,
      Signal present, Timecode present, Closed captioning present, Optical module present,
      the still frame flags, Signal locked, Auto detection prefer PsF, PCIe mode) and the
      network addresses are reported as integers (p.111). Auto detection enabled must
      always be true, so no command sets it (p.115).

  - models: [teranex-av, teranex-express, teranex-2d]
    severity: info
    text: >
      AudioInLevel0 sets every channel's gain on these models; only the Teranex 3D sets
      each channel separately (p.106-107). AudioUserDelay0 is documented for Teranex 2D
      and Express (p.106).

  - models: [teranex-3d]
    severity: info
    text: >
      The Align commands act only while the unit receives left and right eye signals and
      3D mode is 3DModeAlign (p.103). Dolby decode and encode mapping (AudioDD sources,
      AudioEncode) need the optional Dolby modules (p.107).
