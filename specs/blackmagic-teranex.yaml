    params:
      channel: {type: int, min: 1, max: 8, required: true, label: Encoder channel, description: 'Dolby encoder channel, 1 to 8.'}
      source: {type: enum, values: [AudioIn1, AudioIn2, AudioIn3, AudioIn4, AudioIn5, AudioIn6, AudioIn7, AudioIn8, AudioIn9, AudioIn10, AudioIn11, AudioIn12, AudioIn13, AudioIn14, AudioIn15, AudioIn16, AudioDD1, AudioDD2, AudioDD3, AudioDD4, AudioDD5, AudioDD6, AudioDD7, AudioDD8, TT750, TT1500, TT3000, TT6000, TTMute], required: true, label: Source, description: 'An input channel, a Dolby-decoded channel, a test tone or mute.'}
    send: |
      AUDIO:
      AudioEncode{channel:-1}: {source}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.108, Output Mapping, AudioEncode0 is
    # channel 1

  set_audio_input_pair:
    summary: Map an audio input pair to one of the 16 input channels' pairs (Teranex 2D)
    params:
      pair: {type: int, min: 1, max: 8, required: true, label: Input pair, description: 'Input pair, 1 to 8 (pair 1 is channels 1-2).'}
      source: {type: enum, values: [EmbedPair1, EmbedPair2, EmbedPair3, EmbedPair4, EmbedPair5, EmbedPair6, EmbedPair7, EmbedPair8, AESPair1, AESPair2, AESPair3, AESPair4, DB25Pair1, DB25Pair2, RCAPair, MutePair], required: true, label: Source, description: 'Embedded pair 1-8, AES pair 1-4, DB25 pair 1-2, the RCA pair, or mute.'}
    send: |
      AUDIO:
      AudioInPair{pair:-1}: {source}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.108-109, Input Mapping for Teranex 2D,
    # AudioInPair0 is pair 1

  set_metadata_channel_mode:
    summary: Set the Dolby metadata channel mode (Teranex 3D)
    params:
      value: {type: enum, values: ['32', '20'], required: true, label: Channel mode, description: '32 for 3/2 (L, C, R, Ls, Rs) or 20 for 2/0 (L, R).'}
    send: |
      AUDIO:
      Metadata channel mode: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.109, Metadata Commands for Teranex 3D

  set_metadata_lfe:
    summary: Turn Dolby metadata LFE on or off (Teranex 3D)
    params:
      value: {type: bool, required: true, label: LFE, description: On enables LFE in the Dolby metadata.}
    send: |
      AUDIO:
      Metadata lfe select: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.109, Metadata Commands for Teranex 3D

  set_friendly_name:
    summary: Rename the unit
    params:
      value: {type: string, max_length: 64, required: true, label: Name, description: The user-defined name the unit shows and advertises.}
    send: |
      NETWORK CONFIG:
      Friendly name: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.111, Network Config

  set_dhcp:
    summary: Turn DHCP on or off; the unit's address can change and the connection drop
    params:
      value: {type: bool, required: true, label: DHCP, description: On takes an address from DHCP; off keeps the configured static address (the document advises against changing it).}
    send: |
      NETWORK CONFIG:
      DHCP enabled: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.111, Network Config

  set_align:
    summary: Set a Teranex 3D camera align size, position or trim value for one eye (3D mode must be 3DModeAlign)
    params:
      control: {type: enum, values: [size X left, size X right, size Y left, size Y right, pos X left, pos X right, pos Y left, pos Y right, trim X left, trim X right, trim Y left, trim Y right], required: true, label: Adjustment, description: 'Which adjustment: size (zoom), position or trim, horizontal (X) or vertical (Y), left or right eye.'}
      value: {type: int, min: -4096, max: 4096, required: true, label: Value, description: 'Size and position in pixels (X) or lines (Y), negative shrinking or moving; trim symmetrical; 0 is the default.'}
    send: |
      ALIGN:
      Align {control}: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.103-104, Align; range bound assumed, see
    # quirks

  set_3d_mode:
    summary: Set the Teranex 3D processing mode
    params:
      value: {type: enum, values: [3DModeOff, 3DModeConvert, 3DMode2Dto3D, 3DModeAlign], required: true, label: 3D mode, description: 'Off, convert between 3D formats, 2D to 3D, or camera align.'}
    send: |
      MODE3D:
      3D mode: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.110, MODE3D, 3D mode

  set_2d3d_intensity:
    summary: Set the 2D to 3D intensity
    params:
      value: {type: int, min: -40, max: 40, required: true, label: Intensity, description: '2D to 3D intensity, -40 to +40 (default 15).'}
    send: |
      MODE3D:
      2D3D intensity: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.110, MODE3D, 2D3D intensity

  set_2d3d_depth:
    summary: Set the 2D to 3D depth
    params:
      value: {type: int, min: -12, max: 12, required: true, label: Depth, description: '2D to 3D depth, -12 to +12 (default 0).'}
    send: |
      MODE3D:
      2D3D depth: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.110, MODE3D, 2D3D depth

  set_3d_output:
    summary: Set the 3D output signal format
    params:
      value: {type: enum, values: [3DFullFrame, 3DSideBySide, 3DTopBottom, 3DLinebyLine], required: true, label: 3D output, description: 'Full frame, side by side, top and bottom, or line by line.'}
    send: |
      MODE3D:
      3D output: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.110, MODE3D, 3D output

  set_3d_input:
    summary: Set the 3D input signal format
    params:
      value: {type: enum, values: [3DFullFrame, 3DSideBySide, 3DTopBottom, 3DLinebyLine], required: true, label: 3D input, description: 'Full frame, side by side, top and bottom, or line by line.'}
    send: |
      MODE3D:
      3D input: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.110, MODE3D, 3D input

  set_3d_rotation:
    summary: Set a Teranex 3D camera align rotation (roll, tilt or toe-in) for one eye
    params:
      axis: {type: enum, values: [roll, tilt, toeIn], required: true, label: Rotation, description: 'Roll (Z axis, 50 units a degree, -400 to 400), tilt (X axis) or toe-in (Y axis) (5 units a degree, -40 to 40).'}
      eye: {type: enum, values: [left, right], required: true, label: Eye, description: Left or right eye.}
      value: {type: int, min: -400, max: 400, required: true, label: Value, description: 'Rotation in the axis''s units; roll accepts -400 to 400, tilt and toe-in -40 to 40, and the unit refuses a value outside its axis''s range.'}
    send: |
      MODE3D:
      3D {axis} {eye}: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.111, Rotation and Tilt Commands

  set_3d_flip:
    summary: Flip one eye's image (Teranex 3D)
    params:
      eye: {type: enum, values: [left, right], required: true, label: Eye, description: Left or right eye.}
      flip: {type: enum, values: ['Off', Horizontal, Vertical, Both], required: true, label: Flip, description: 'No flip, horizontal, vertical or both.'}
    send: |
      MODE3D:
      3D flip {eye}: {flip}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.111, Rotation and Tilt Commands

  request_status:
    summary: Ask the unit to resend one status block in full; it follows the ACK and updates state
    params:
      block: {type: enum, values: [TERANEX DEVICE, VIDEO INPUT, VIDEO OUTPUT, VIDEO ADJUST, VIDEO PROC AMP, VIDEO ADVANCED, NOISE REDUCTION, GENLOCK, TEST PATTERN, PRESET, VARIABLE ASPECT RATIO, ANCILLARY DATA, AUDIO, NETWORK CONFIG, ALIGN, MODE3D], required: true, label: Block, description: 'The status block to resend, by its header.'}
    send: '{block}:'
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.102, Requesting a Status Dump; p.103,
    # Retrieving Device Information

  ping:
    summary: Check that the unit is still responding
    send: 'PING:'
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.102, Checking Connection Status

