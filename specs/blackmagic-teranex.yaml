      fields:
        Version: device.protocol_version
    - header: ^TERANEX DEVICE:$
      fields:
        Model name: device.model
        Software Version: device.software_version
        FPGA Version: device.fpga_version
        Panel lock: {path: device.panel_lock, map: {'true': true, 'false': false, 'True': true, 'False': false, 'TRUE': true, 'FALSE': false, 'ON': true, 'OFF': false, 'On': true, 'Off': false}}
        Remote lock: {path: device.remote_lock, map: {'true': true, 'false': false, 'True': true, 'False': false, 'TRUE': true, 'FALSE': false, 'ON': true, 'OFF': false, 'On': true, 'Off': false}}
    - header: ^VIDEO INPUT:$
