spec: 1
id: blackmagic-teranex
name: Blackmagic Teranex
vendor: Blackmagic Design
category: other

source:
  - title: Teranex Processors Installation and Operation Manual (June 2017), Developer Information, Blackmagic Teranex Ethernet Protocol
    author: Blackmagic Design
    url: https://documents.blackmagicdesign.com/UserManuals/TeranexManual.pdf
    note: >
      Manufacturer-documented, and the source of every block and command here. Covers
      Teranex AV and Teranex Express, and in the protocol text Teranex 2D and 3D
      Processor. TCP 9800, CR LF line ends from the unit and LF or CR LF accepted, the
      state dump on connecting, blocks ended by a blank line, ACK and NACK, status updates
      holding only changed items, status requests and PING (p.101-103); Align (p.103-104);
      Ancillary Data (p.105-106); Audio (p.106-109); Genlock (p.109); MODE3D (p.110-111);
      Network Config (p.111); Noise Reduction, Preset (p.112); Protocol Preamble, Teranex
      Device, Test Pattern, Variable Aspect Ratio (p.112-114); Video Adjust, Video
      Advanced, Video Input (p.114-116); Video Output, Video Proc Amp (p.116-117).
  - title: companion-module-bmd-teranex (Bitfocus Companion module)
    author: Bitfocus
    url: https://github.com/bitfocus/companion-module-bmd-teranex
    note: >
      Community source (MIT licence), read as corroboration only. It confirms the block
      headers VIDEO INPUT, VIDEO OUTPUT, VIDEO ADJUST, VIDEO PROC AMP, VIDEO ADVANCED,
      NOISE REDUCTION, GENLOCK, TEST PATTERN and PRESET, sends PING as a keep-alive,
      writes on/off settings as ON and OFF and reads them back as ON and OFF, and offers
      output formats in the form 1080i59.94 and 2160p59.94.
  - title: Teranex Mini Converters Installation and Operation Manual (April 2020) and Teranex Mini IP Video 12G manual (July 2017)
    author: Blackmagic Design
    url: https://documents.blackmagicdesign.com/UserManuals/TeranexMiniConvertersManual.pdf
    note: >
      Read to check for a network protocol: neither has a Developer Information section.
      Teranex Mini converters are set up over USB or Ethernet with Blackmagic Teranex
      Setup only, so they are not covered here.

transport:
  type: line-tcp
  port: 9800
  framing: block
  encoding: utf-8
  timeout_ms: 2000
  reply: expected
  reply_match: ^(ACK|NACK|NAK)
  probe: 'PING:'

ports:
  - {port: 9800, protocol: tcp, role: control}

