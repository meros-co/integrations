commands:
  set_panel_lock:
    summary: Lock or unlock the front panel against local operation
    params:
      value: {type: bool, required: true, label: Panel locked, description: On locks the front panel so the unit cannot be operated locally; off unlocks it.}
    send: |
      TERANEX DEVICE:
      Panel lock: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.113, Teranex Device

  set_remote_lock:
    summary: Lock or unlock Teranex Setup's access over Ethernet; this protocol keeps working
    params:
      value: {type: bool, required: true, label: Remote locked, description: On stops Teranex Setup reaching the unit over Ethernet (this protocol still works); off allows it.}
    send: |
      TERANEX DEVICE:
      Remote lock: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.113, Teranex Device

  set_video_source:
    summary: Select the video input
    params:
      value: {type: enum, values: [SDI, SDI1, SDI2, HDMI, Optical, Composite, Component], required: true, label: Video input, description: 'The input to convert: SDI, HDMI, Composite or Component on 2D/3D; SDI or Optical on Express; SDI1, SDI2, HDMI or Optical on AV.'}
    send: |
      VIDEO INPUT:
      Video source: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.115, Video Input, Video source

  set_audio_source:
    summary: Select the audio input
    params:
      value: {type: enum, values: [Embedded, AES, RCA, DB25], required: true, label: Audio input, description: 'Audio input: Embedded on every model, and AES, RCA or DB25 on AV, 2D and 3D.'}
    send: |
      VIDEO INPUT:
      Audio source: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.116, Video Input, Audio source

  set_wide_sd_aspect:
    summary: Treat an SD source as widescreen (letterboxed on SD output) or 4:3
    params:
      value: {type: bool, required: true, label: Widescreen SD, description: 'On treats the SD source as widescreen and letterboxes it on an SD output; off treats it as 4:3.'}
    send: |
      VIDEO INPUT:
      Wide SD aspect: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.116, Video Input, Wide SD aspect

  set_output_video_mode:
    summary: Set the output video format; the output changes format at once
    params:
      value: {type: string, required: true, pattern: '^[0-9A-Za-z. ]{2,24}$', label: Output format, description: 'Output video format as the unit names it, e.g. 1080i59.94 or 2160p59.94; only formats in the unit''s conversion table are accepted.'}
    send: |
      VIDEO OUTPUT:
      Video mode: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.101 and p.116, Video Output, Video mode;
    # value forms differ in the document, see quirks

  set_aspect_ratio:
    summary: Set the aspect ratio conversion
    params:
      value: {type: enum, values: [Anamorphic, Letterbox, CentreCut, 14x9, Smart], required: true, label: Aspect ratio, description: How the picture is fitted when the aspect ratio changes; the unit offers only the choices valid for the current conversion.}
    send: |
      VIDEO OUTPUT:
      Aspect ratio: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.116, Video Output, Aspect ratio

  set_demux_mode:
    summary: Set the SDI output link mode
    params:
      value: {type: enum, values: [SingleLink, DualLink, QuadLink], required: true, label: Link mode, description: 'SDI output links: single, dual or quad link.'}
    send: |
      VIDEO OUTPUT:
      Video demux mode: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.116, Video Output, Video demux mode

  set_output_sdi_mode:
    summary: Set the 3G-SDI output level
    params:
      value: {type: enum, values: [LevelA, LevelB], required: true, label: 3G-SDI level, description: '3G-SDI output mapping, level A or level B.'}
    send: |
      VIDEO OUTPUT:
      Output SDI mode: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.116, Video Output, Output SDI mode

  set_output_pixel_format:
    summary: Set the output pixel format (Teranex 3D)
    params:
      value: {type: enum, values: [YCbCr422, RGB422, RGB444], required: true, label: Pixel format, description: Output pixel format and sampling.}
    send: |
      VIDEO OUTPUT:
      Video pixel format: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.116, Video Output, Video pixel format

  set_analog_output:
    summary: Set the analog video output type
    params:
      value: {type: enum, values: [Composite, Component], required: true, label: Analog output, description: 'Analog video output: composite or component.'}
    send: |
      VIDEO OUTPUT:
      Analog output: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.116, Video Output, Analog output

  set_hdmi_output:
    summary: Set the HDMI output colour space (Teranex AV)
    params:
      value: {type: enum, values: [YCbCr422, RGB444], required: true, label: HDMI colour space, description: 'HDMI output colour space: YCbCr 4:2:2 or RGB 4:4:4.'}
    send: |
      VIDEO OUTPUT:
      HDMI Output: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.117, Video Output, HDMI Output; the
    # document writes YCbCR422; see quirks

  set_output_option:
    summary: Switch the Teranex AV output to the input, black, the still or a freeze
    params:
      value: {type: enum, values: [Input, Black, Still, Freeze], required: true, label: Output, description: 'What the unit outputs: the converted input, black, the stored still, or a freeze of the current frame.'}
    send: |
      VIDEO OUTPUT:
      Output option: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.117, Video Output, Output option

  set_quad_ancillary_replication:
    summary: Replicate ancillary data on all four quad-link outputs, or output A only
    params:
      value: {type: bool, required: true, label: Replicate ancillary, description: On carries ancillary data on all four quad-link outputs; off on output A only.}
    send: |
      VIDEO OUTPUT:
      Quad ancillary replication: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.117, Video Output, Quad ancillary
    # replication

  set_quad_sdi_output:
    summary: Set the quad SDI output mode (Teranex AV)
    params:
      value: {type: enum, values: [QuadLink, QuadHDSplit], required: true, label: Quad SDI mode, description: 'Quad link Ultra HD, or quad HD split.'}
    send: |
      VIDEO OUTPUT:
      Quad SDI output: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.117, Video Output, Quad SDI output

  set_transition_setting:
    summary: Set the transition time between output options (Teranex AV)
    params:
      value: {type: int, min: 0, max: 50, required: true, label: Transition time, description: 'Transition between output options in tenths of a second: 0 is a cut, 50 is 5 seconds.'}
    send: |
      VIDEO OUTPUT:
      Transition setting: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.117, Video Output, Transition setting

  set_adjust_red:
    summary: Set Video Adjust Red
    params:
      value: {type: int, min: -200, max: 200, required: true, label: Red, description: 'Red colour correction, -200 to +200 with 0 neutral.'}
    send: |
      VIDEO ADJUST:
      Red: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.114-115, Video Adjust, Red

  set_adjust_green:
    summary: Set Video Adjust Green
    params:
      value: {type: int, min: -200, max: 200, required: true, label: Green, description: 'Green colour correction, -200 to +200 with 0 neutral.'}
    send: |
      VIDEO ADJUST:
      Green: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.114-115, Video Adjust, Green

  set_adjust_blue:
    summary: Set Video Adjust Blue
    params:
      value: {type: int, min: -200, max: 200, required: true, label: Blue, description: 'Blue colour correction, -200 to +200 with 0 neutral.'}
    send: |
      VIDEO ADJUST:
      Blue: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.114-115, Video Adjust, Blue

  set_adjust_luma_low:
    summary: Set Video Adjust Luma low
    params:
      value: {type: int, min: 4, max: 1018, required: true, label: Luma low, description: 'Luminance clip for undershoots, in 10-bit code values (default 4).'}
    send: |
      VIDEO ADJUST:
      Luma low: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.114-115, Video Adjust, Luma low

  set_adjust_luma_high:
    summary: Set Video Adjust Luma high
    params:
      value: {type: int, min: 5, max: 1019, required: true, label: Luma high, description: 'Luminance clip for overshoots, in 10-bit code values (default 1019).'}
    send: |
      VIDEO ADJUST:
      Luma high: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.114-115, Video Adjust, Luma high

  set_adjust_chroma_low:
    summary: Set Video Adjust Chroma low
    params:
      value: {type: int, min: 4, max: 1018, required: true, label: Chroma low, description: 'Chrominance clip for undershoots, in 10-bit code values (default 4).'}
    send: |
      VIDEO ADJUST:
      Chroma low: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.114-115, Video Adjust, Chroma low

  set_adjust_chroma_high:
    summary: Set Video Adjust Chroma high
    params:
      value: {type: int, min: 5, max: 1019, required: true, label: Chroma high, description: 'Chrominance clip for overshoots, in 10-bit code values (default 1019).'}
    send: |
      VIDEO ADJUST:
      Chroma high: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.114-115, Video Adjust, Chroma high

  set_adjust_aspect_fill_luma:
    summary: Set Video Adjust Aspect fill luma
    params:
      value: {type: int, min: 64, max: 940, required: true, label: Aspect fill luma, description: 'Luminance (Y) of the letterbox or pillarbox fill, in 10-bit code values (default 64).'}
    send: |
      VIDEO ADJUST:
      Aspect fill luma: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.114-115, Video Adjust, Aspect fill luma

  set_adjust_aspect_fill_cb:
    summary: Set Video Adjust Aspect fill Cb
    params:
      value: {type: int, min: 64, max: 960, required: true, label: Aspect fill Cb, description: 'B-Y of the letterbox or pillarbox fill, in 10-bit code values (default 512).'}
    send: |
      VIDEO ADJUST:
      Aspect fill Cb: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.114-115, Video Adjust, Aspect fill Cb

  set_adjust_aspect_fill_cr:
    summary: Set Video Adjust Aspect fill Cr
    params:
      value: {type: int, min: 64, max: 960, required: true, label: Aspect fill Cr, description: 'R-Y of the letterbox or pillarbox fill, in 10-bit code values (default 512).'}
    send: |
      VIDEO ADJUST:
      Aspect fill Cr: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.114-115, Video Adjust, Aspect fill Cr

  set_proc_amp_gain:
    summary: Set Video Proc Amp Gain
    params:
      value: {type: int, min: -60, max: 60, required: true, label: Gain, description: 'Output video level, -60 to +60 with 0 unchanged.'}
    send: |
      VIDEO PROC AMP:
      Gain: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.117, Video Proc Amp, Gain

  set_proc_amp_black:
    summary: Set Video Proc Amp Black
    params:
      value: {type: int, min: -30, max: 30, required: true, label: Black, description: 'Output black level, -30 to +30 with 0 unchanged.'}
    send: |
      VIDEO PROC AMP:
      Black: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.117, Video Proc Amp, Black

  set_proc_amp_saturation:
    summary: Set Video Proc Amp Saturation
    params:
      value: {type: int, min: -60, max: 60, required: true, label: Saturation, description: 'Output saturation, -60 to +60 with 0 unchanged.'}
    send: |
      VIDEO PROC AMP:
      Saturation: {value}
    expect: {matches: ^ACK}
    returns: ack
    # Teranex Ethernet Protocol (Teranex manual, June 2017), p.117, Video Proc Amp, Saturation

  set_proc_amp_hue:
