state:
  device.protocol_version:                  {type: string, description: 'Protocol version from the preamble, e.g. 3.18'}
  device.model:                             {type: string, description: Teranex model name}
  device.software_version:                  {type: string, description: Checksum of the installed software release}
  device.fpga_version:                      {type: string, description: FPGA version of the installed software release}
  device.panel_lock:                        {type: bool, description: The front panel is locked against local operation}
  device.remote_lock:                       {type: bool, description: Teranex Setup is locked out over Ethernet (this protocol still works)}
  video_input.video_source:                 {type: string, description: 'Selected video input: SDI, SDI1, SDI2, HDMI, Optical, Composite or Component'}
  video_input.audio_source:                 {type: string, description: 'Selected audio input: Embedded, AES, RCA or DB25'}
  video_input.video_mode:                   {type: string, description: Detected input video format (read only)}
  video_input.signal_present:               {type: bool, description: Input video is present (read only)}
  video_input.timecode_present:             {type: string, description: 'Detected when the input carries timecode, None otherwise (read only)'}
  video_input.closed_captioning_present:    {type: string, description: 'Detected when the input carries closed captions, None otherwise (read only)'}
  video_input.wide_sd_aspect:               {type: bool, description: 'The SD source is widescreen (true) or 4:3 (false)'}
  video_input.optical_module_present:       {type: bool, description: A fibre optic SFP module is installed (read only)}
  video_input.pixel_format:                 {type: string, description: 'Input pixel format, e.g. YCbCr422 (read only)'}
  video_input.auto_detection:               {type: bool, description: Input format auto-detection; the document says it must always be true}
  video_input.auto_detection_prefer_psf:    {type: bool, description: Auto-detection prefers PsF formats (read only)}
  video_input.pcie_mode:                    {type: string, description: 'Teranex 2D/3D Thunderbolt connection: Capture, Playback or None (read only)'}
  video_output.video_mode:                  {type: string, description: 'Output video format, as the unit names it'}
  video_output.aspect_ratio:                {type: string, description: 'Aspect ratio conversion: Anamorphic, Letterbox, CentreCut, 14x9 or Smart'}
  video_output.demux_mode:                  {type: string, description: 'SDI output link mode: SingleLink, DualLink or QuadLink'}
