commands:
  app_enlarge:
    summary: "Zoom in the app screen in the program scene"
    send: { method: GET, path: /V1.0/app/enlarge }
    expect: { status: 200 }
    returns: ack

  app_go_back:
    summary: "Go back to the app's previous page in the program scene"
    send: { method: GET, path: /V1.0/app/goBack }
    expect: { status: 200 }
    returns: ack

  app_reduce:
    summary: "Zoom out the app screen in the program scene"
    send: { method: GET, path: /V1.0/app/reduce }
    expect: { status: 200 }
    returns: ack

  app_reset:
    summary: "Reset the app screen in the program scene to its default size"
    send: { method: GET, path: /V1.0/app/reset }
    expect: { status: 200 }
    returns: ack

  app_zoom:
    summary: "Zoom the app screen in the program scene by a factor"
    params:
      zoom: { type: "float", min: 0.5, max: 1.5, required: true, label: "Zoom", description: "Zoom factor from 0.5 to 1.5." }
    send: { method: GET, path: /V1.0/app/zoom, query: { zoomSize: "{zoom:.2f}" } }
    expect: { status: 200 }
    returns: ack

  scene_playlist_enter:
    summary: "Start the scene playlist"
    send: { method: GET, path: /V1.0/auto-play/enter }
    expect: { status: 200 }
    returns: ack

  scene_playlist_exit:
    summary: "Leave the scene playlist"
    send: { method: GET, path: /V1.0/auto-play/exit }
    expect: { status: 200 }
    returns: ack

  scene_playlist_next:
    summary: "Go to the next scene of the scene playlist"
    send: { method: GET, path: /V1.0/auto-play/next }
    expect: { status: 200 }
    returns: ack

  scene_playlist_previous:
    summary: "Go to the previous scene of the scene playlist"
    send: { method: GET, path: /V1.0/auto-play/previous }
    expect: { status: 200 }
    returns: ack

  scene_playlist_pause:
    summary: "Pause the scene playlist"
    send: { method: GET, path: /V1.0/auto-play/pause }
    expect: { status: 200 }
    returns: ack

  scene_playlist_play:
    summary: "Resume the scene playlist"
    send: { method: GET, path: /V1.0/auto-play/play }
    expect: { status: 200 }
    returns: ack

  scene_playlist_toggle:
    summary: "Pause or resume the scene playlist"
    send: { method: GET, path: /V1.0/auto-play/togglePlay }
    expect: { status: 200 }
    returns: ack

  scene_playlist_switch:
    summary: "Go to a scene of the scene playlist"
    params:
      index: { type: "int", min: 1, max: 9999, required: true, label: "Index", description: "The scene in the scene playlist's place in its list, counted from 1." }
    send: { method: GET, path: /V1.0/auto-play/switch, query: { index: "{index}" } }
    expect: { status: 200 }
    returns: ack

  set_vfa:
    summary: "Turn VFA mode on or off"
    params:
      enabled: { type: "bool", required: true, label: "Enabled", description: "True turns VFA mode on, false off." }
    send: { method: GET, path: /V1.0/vfa/enable, query: { enable: "{enabled}" } }
    expect: { status: 200 }
    returns: ack

  toggle_vfa:
    summary: "Turn VFA mode on if off, off if on"
    send: { method: GET, path: /V1.0/vfa/switch }
    expect: { status: 200 }
    returns: ack

  bgm_first:
    summary: "Jump to the first background music track"
    send: { method: GET, path: /V1.0/bgm/first }
    expect: { status: 200 }
    returns: ack

  bgm_last:
    summary: "Jump to the last background music track"
    send: { method: GET, path: /V1.0/bgm/last }
    expect: { status: 200 }
    returns: ack

  bgm_next:
    summary: "Go to the next background music track"
    send: { method: GET, path: /V1.0/bgm/next }
    expect: { status: 200 }
    returns: ack

  bgm_previous:
    summary: "Go to the previous background music track"
    send: { method: GET, path: /V1.0/bgm/previous }
    expect: { status: 200 }
    returns: ack

  bgm_pause:
    summary: "Pause the background music"
    send: { method: GET, path: /V1.0/bgm/pause }
    expect: { status: 200 }
    returns: ack

  bgm_play:
    summary: "Play the background music"
    send: { method: GET, path: /V1.0/bgm/play }
    expect: { status: 200 }
    returns: ack

  bgm_play_toggle:
    summary: "Play or pause the background music"
    send: { method: GET, path: /V1.0/bgm/playAction }
    expect: { status: 200 }
    returns: ack

  bgm_play_file:
    summary: "Play a background music track by its file path"
    params:
      file_path: { type: "string", max_length: 1024, required: true, label: "File", description: "The track's file path on the Director, as the BGM play list gives it." }
    send: { method: GET, path: /V1.0/bgm/playByFile, query: { filePath: "{file_path}" } }
    expect: { status: 200 }
    returns: ack

  bgm_play_index:
    summary: "Play a background music track by its place in the play list"
    params:
      index: { type: "int", min: 1, max: 9999, required: true, label: "Index", description: "The track's place in its list, counted from 1." }
    send: { method: GET, path: /V1.0/bgm/playByIndex, query: { index: "{index}" } }
    expect: { status: 200 }
    returns: ack

  bgm_seek:
    summary: "Jump to a point in the current background music track"
    params:
      progress: { type: "float", min: 0.0, max: 1.0, required: true, label: "Position", description: "Where to jump, as a fraction of the track from 0 (start) to 1 (end)." }
    send: { method: GET, path: /V1.0/bgm/seekByProgress, query: { progress: "{progress:.3f}" } }
    expect: { status: 200 }
    returns: ack

  gfx_toggle_by_index:
    summary: "Show a graphic if hidden, hide it if shown, by its place in the GFX list"
    params:
      index: { type: "int", min: 1, max: 9999, required: true, label: "Index", description: "The graphic's place in its list, counted from 1." }
    send: { method: GET, path: /V1.0/gfx/actionByIndex, query: { index: "{index}" } }
    expect: { status: 200 }
    returns: ack

  gfx_set_by_index:
    summary: "Show or hide a graphic by its place in the GFX list"
    params:
      index: { type: "int", min: 1, max: 9999, required: true, label: "Index", description: "The graphic's place in its list, counted from 1." }
      shown: { type: "bool", required: true, label: "Shown", description: "True shows the graphic on the program image, false takes it off." }
    send: { method: GET, path: /V1.0/gfx/actionByIndex, query: { index: "{index}", "on": "{shown}" } }
    expect: { status: 200 }
    returns: ack

  gfx_toggle_by_name:
    summary: "Show a graphic if hidden, hide it if shown, by name"
    params:
      name: { type: "string", max_length: 256, required: true, label: "Name", description: "The graphic's name, as the Director shows it." }
    send: { method: GET, path: /V1.0/gfx/actionByName, query: { name: "{name}" } }
    expect: { status: 200 }
    returns: ack

  gfx_set_by_name:
    summary: "Show or hide a graphic by name"
    params:
      name: { type: "string", max_length: 256, required: true, label: "Name", description: "The graphic's name, as the Director shows it." }
      shown: { type: "bool", required: true, label: "Shown", description: "True shows the graphic on the program image, false takes it off." }
    send: { method: GET, path: /V1.0/gfx/actionByName, query: { name: "{name}", "on": "{shown}" } }
    expect: { status: 200 }
    returns: ack

  gfx_toggle_by_id:
    summary: "Show a graphic if hidden, hide it if shown, by its ID"
    params:
      id: { type: "string", pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true, label: "ID", description: "The graphic's unique ID, as the Director lists it." }
    send: { method: GET, path: /V1.0/gfx/actionByUUID, query: { uuid: "{id}" } }
    expect: { status: 200 }
    returns: ack

  gfx_set_by_id:
    summary: "Show or hide a graphic by its ID"
    params:
      id: { type: "string", pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true, label: "ID", description: "The graphic's unique ID, as the Director lists it." }
      shown: { type: "bool", required: true, label: "Shown", description: "True shows the graphic on the program image, false takes it off." }
    send: { method: GET, path: /V1.0/gfx/actionByUUID, query: { uuid: "{id}", "on": "{shown}" } }
    expect: { status: 200 }
    returns: ack

  gfx_clear:
    summary: "Take every graphic off"
    send: { method: GET, path: /V1.0/gfx/clear }
    expect: { status: 200 }
    returns: ack

  scoreboard_adjust_ball_strike:
    summary: "Change the numbers of balls and strikes (the global scoreboard on the program scene)"
    params:
      balls: { type: "int", min: -9, max: 9, required: true, label: "Balls", description: "Balls to add; negative takes them away." }
      strikes: { type: "int", min: -9, max: 9, required: true, label: "Strikes", description: "Strikes to add; negative takes them away." }
    send: { method: GET, path: /V1.0/gfx/scoreboard/adjustBallStrike, query: { ballChange: "{balls}", strikeChange: "{strikes}" } }
    expect: { status: 200 }
    returns: ack

  scoreboard_adjust_ball_strike_by_id:
    summary: "Change the numbers of balls and strikes (a global scoreboard, by ID)"
    params:
      balls: { type: "int", min: -9, max: 9, required: true, label: "Balls", description: "Balls to add; negative takes them away." }
      strikes: { type: "int", min: -9, max: 9, required: true, label: "Strikes", description: "Strikes to add; negative takes them away." }
      id: { type: "string", pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true, label: "Scoreboard ID", description: "The unique ID of the scoreboard, as the GFX list or the scene list gives it." }
    send: { method: GET, path: /V1.0/gfx/scoreboard/adjustBallStrike, query: { ballChange: "{balls}", strikeChange: "{strikes}", uuid: "{id}" } }
    expect: { status: 200 }
    returns: ack

  scoreboard_adjust_ball_strike_private:
    summary: "Change the numbers of balls and strikes (a scene's private scoreboard)"
    params:
      balls: { type: "int", min: -9, max: 9, required: true, label: "Balls", description: "Balls to add; negative takes them away." }
      strikes: { type: "int", min: -9, max: 9, required: true, label: "Strikes", description: "Strikes to add; negative takes them away." }
      id: { type: "string", pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true, label: "Scoreboard ID", description: "The unique ID of the scoreboard, as the GFX list or the scene list gives it." }
      scene_id: { type: "string", pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true, label: "Scene ID", description: "The unique ID of the scene the private graphic belongs to, as getSceneList gives it." }
    send: { method: GET, path: /V1.0/gfx/scoreboard/adjustBallStrike, query: { ballChange: "{balls}", strikeChange: "{strikes}", uuid: "{id}", sceneId: "{scene_id}" } }
    expect: { status: 200 }
    returns: ack

  scoreboard_adjust_out:
    summary: "Change the number of outs (the global scoreboard on the program scene)"
    params:
      change: { type: "int", min: -9, max: 9, required: true, label: "Change", description: "Outs to add; negative takes them away." }
    send: { method: GET, path: /V1.0/gfx/scoreboard/adjustOut, query: { change: "{change}" } }
    expect: { status: 200 }
    returns: ack

  scoreboard_adjust_out_by_id:
