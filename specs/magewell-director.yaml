spec: 1
id: magewell-director
name: Magewell Director Mini, Director One and Director Plus
vendor: Magewell
category: switcher

source:
  - title: "Magewell Director API (Director Mini and One firmware 3.1 and later, Director Plus 3.3 and later)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/director-api/"
    note: >
      Manufacturer-documented, public; retrieved 2026-10-23 with its version history to 3.3
      and the PDF edition (director-api-en_US.pdf). HTTP GET or POST to
      http://ip/V1.0/<group>/<method> with query parameters, port 8080 in the command-line
      demo (1.3), no response data except for the get methods, HTTP status 200, 400, 403 or
      404 (1.2). Groups: App, Scene Playlist (auto-play) and VFA (Director Plus only), BGM,
      GFX, Scoreboard and Tennis (gfx/scoreboard, gfx/tennis), Timer (gfx/countdown),
      Stopwatch, Webpage (graphics), Replay, PTZ including the Director Utility phone camera
      and OBSBOT webcams, Record, Scene, Show, Stream, Shortcuts, System and Volume, each
      method's parameters, ranges and enumerations, which are optional ("non-essential"),
      and which differ between the Director Plus and the Director Mini and One. Get
      methods: bgm/getPlayList, gfx/getGFXList, scene/getSceneList (with isPGM, isPreview and
      privateGfx since 3.1), show/getShowList, stream/getStreamServersList,
      shortcuts/getConfig, replay/getEventList and getAllTags, ptz/getDeviceList and
      getPhoneCameraConfig, volume/getConfig and getMonitorDevices, and
      system/getOutSettingsSourceList (Director Plus), each with a status of 0 for success.
  - title: "Magewell Director Mini API (firmware 3.0)"
    author: Magewell
    url: "https://magewell.com/api-docs/director-mini-api/"
    note: >
      Manufacturer document, the Director Mini's earlier edition of the same API, used to
      confirm the base path and the port of the command-line demo.

transport:
  type: http
  port: 8080
  scheme: http
  auth: none
  timeout_ms: 4000
  probe: { method: GET, path: /V1.0/scene/getSceneList }

ports:
  - { port: 8080, protocol: http, role: control, note: "the port of the API document's command-line demo" }

