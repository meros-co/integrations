quirks:
  - models: [all]
    severity: warning
    text: >
      The API pushes nothing, and its set methods return no data: state comes
      from polling its get methods (scenes and audio every 2 s, shows, replay
      events and PTZ devices every 5 s, the rest every 15 s). The API has no
      read of the recording or streaming state, of which graphics are on the
      program image, of scoreboard, timer and stopwatch values, of the
      transition effect, duration and patterns, the fade to black state and
      duration, freeze, quick switch, VFA, the BGM playing state and position,
      the replay state, speed and stinger setting, a PTZ camera's position, or
      what each output shows; these are API limits. Nor can a scene be put on
      preview without taking it: the Scene group (Director API V1.0, Scene)
      switches the program by index, name or UUID and takes preview to
      program (previewToPGM), and has no method that selects the preview,
      which getSceneList's isPreview only reports; and Record (start, stop,
      action) and Stream (actionById, stopAll, getStreamServersList) have no
      status method. An ack is HTTP 200; 403
      means the Director refused it (the content does not exist, or the
      action is not allowed now).

  - models: [all]
    severity: info
    text: >
      Optional parameters are separate commands, since a template sends every
      value it names: each toggle (no value) beside its set (gfx, stream,
      replay audio and microphone mutes, stinger, quick switch, slide show,
      layer transition, soccer substitution and stoppage time, tennis
      server); each scene switch with the Switch Settings' transition beside
      one with a cut or fade; each scoreboard, timer and stopwatch command on
      the global graphic of the program scene, on one by ID (_by_id) and on a
      scene's private one (_private, with the scene's ID); and the replay
      commands with their defaults beside those choosing a mode and end
      policy. setCountdown and setGameTime take either fields or text, so
      each is two commands.

  - models: [director-plus]
    severity: info
    text: >
      The Director Plus's replay commands take its own parameters (a
      sequential or multiview mode, an ordered camera list written as
      [0,1,2,3], an end by duration or times, a cut or fade between events,
      and the order); the _plus commands send them. Its outputs (USB Out,
      HDMI Out 1 and 2) can also loop an app or custom source by ID, with the
      _source commands. Camera list brackets and commas are sent
      percent-encoded in the query.

  - models: [director-mini, director-one]
    severity: info
    text: >
      The Director Mini and One take the dual-camera replay mode (camera 1 or
      2, one then the other, or side by side) and an end policy of stop,
      loop, or loop for a duration. Their USB-C output's modes 0 and 1 are
      documented as duplicate screen and clean program, sent here as mirror
      and program. replay_select_lens takes camera 1 or 2 and the side by
      side images there, cameras 1 to 4 and multiview on the Director Plus.

  - models: [all]
    severity: critical
    text: >
      reboot and shutdown take the Director off air at once, and shutdown
      leaves it off until it is powered on by hand. replay_remove_all_events,
      replay_remove_events and replay_remove_events_between delete recorded
      events, which cannot be undone; show switching loads another show's
      scenes live.

  - models: [all]
    severity: info
    text: >
      The document names no authentication and no port beyond its
      command-line demo's 8080, which is the default here. Scene, graphic,
      shortcut and stream IDs are the strings and numbers the get methods
      return; show and scene list places count from 0 for shows and from 1
      for scenes, graphics, stream servers, BGM tracks and the scene
      playlist, as the document says. phone_camera_set_audio_capture sends
      the mute parameter, which the document describes as whether the phone
      captures audio (true captures); the poll's micMute is kept as
      audio_capture likewise.
