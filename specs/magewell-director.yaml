telemetry:
  # The API pushes nothing: its get methods are polled. Scenes (program and
  # preview) and audio every two seconds, shows, replay events, PTZ devices
  # and the phone camera every five, and the lists an operator edits every
  # fifteen.
  poll:
    - every_ms: 2000
      send:
        - { method: GET, path: /V1.0/scene/getSceneList }
        - { method: GET, path: /V1.0/volume/getConfig }
    - every_ms: 5000
      send:
        - { method: GET, path: /V1.0/show/getShowList }
        - { method: GET, path: /V1.0/replay/getEventList }
        - { method: GET, path: /V1.0/replay/getAllTags }
        - { method: GET, path: /V1.0/ptz/getDeviceList }
        - { method: GET, path: /V1.0/ptz/getPhoneCameraConfig }
    - every_ms: 15000
      send:
        - { method: GET, path: /V1.0/gfx/getGFXList }
        - { method: GET, path: /V1.0/bgm/getPlayList }
        - { method: GET, path: /V1.0/stream/getStreamServersList }
        - { method: GET, path: /V1.0/shortcuts/getConfig }
        - { method: GET, path: /V1.0/volume/getMonitorDevices }
        - { models: [director-plus], method: GET, path: /V1.0/system/getOutSettingsSourceList }
  updates:
    # Scenes (getSceneList), keyed by their ID, the list replaced whole.
    - path: "^/V1.0/scene/getSceneList$"
      json_each: "$.sceneList"
      json: { id: "$.uuid", name: "$.name", pgm: "$.isPGM", pvw: "$.isPreview",
              gfx_id: "$.privateGfx.uuid", gfx_name: "$.privateGfx.name", gfx_type: "$.privateGfx.gfxSceneType" }
      replace: scenes
      state:
        "scenes.{id:key}.name": "{name}"
        "scenes.{id:key}.index": "{index:+1}"
        "scenes.{id:key}.program": "{pgm}"
        "scenes.{id:key}.preview": "{pvw}"
        "scenes.{id:key}.private_gfx.id": "{gfx_id}"
        "scenes.{id:key}.private_gfx.name": "{gfx_name}"
        "scenes.{id:key}.private_gfx.type": { value: "{gfx_type}", map: { "0": general, "1": scoreboard, "2": timer, "3": stopwatch, "4": custom, "5": baseball_scoreboard, "6": webpage, "7": ndi, "8": soccer_scoreboard, "9": pag } }
    - path: "^/V1.0/scene/getSceneList$"
      json_each: "$.sceneList"
      each_match: { "$.isPGM": "^true$" }
      json: { id: "$.uuid", name: "$.name" }
      state: { program.scene_id: "{id}", program.scene_name: "{name}" }
    - path: "^/V1.0/scene/getSceneList$"
      json_each: "$.sceneList"
      each_match: { "$.isPreview": "^true$" }
      json: { id: "$.uuid", name: "$.name" }
      state: { preview.scene_id: "{id}", preview.scene_name: "{name}" }
    # Graphics (getGFXList).
    - path: "^/V1.0/gfx/getGFXList$"
      json_each: "$.gfxList"
      json: { id: "$.uuid", name: "$.name", type: "$.gfxSceneType" }
      replace: gfx
      state:
        "gfx.{id:key}.name": "{name}"
        "gfx.{id:key}.index": "{index:+1}"
        "gfx.{id:key}.type": { value: "{type}", map: { "0": general, "1": scoreboard, "2": timer, "3": stopwatch, "4": custom, "5": baseball_scoreboard, "6": webpage, "7": ndi, "8": soccer_scoreboard, "9": pag } }
    # Background music play list (getPlayList), by place from 1.
    - path: "^/V1.0/bgm/getPlayList$"
      json_each: "$.bgmList"
      json: { title: "$.title", file: "$.filePath", md5: "$.fileMD5", duration: "$.duration", artist: "$.singer", artwork: "$.artworkPath", missing: "$.notExist" }
      replace: bgm.tracks
      state:
        "bgm.tracks.{index:+1}.title": "{title}"
        "bgm.tracks.{index:+1}.file_path": "{file}"
        "bgm.tracks.{index:+1}.md5": "{md5}"
        "bgm.tracks.{index:+1}.duration": "{duration}"
        "bgm.tracks.{index:+1}.artist": "{artist}"
        "bgm.tracks.{index:+1}.artwork_path": "{artwork}"
        "bgm.tracks.{index:+1}.missing": "{missing}"
    # Shows (getShowList), and the one presenting.
    - path: "^/V1.0/show/getShowList$"
      json_each: "$.showList"
      json: { id: "$.showId", name: "$.name", orientation: "$.orientation", current: "$.inCurrent", rate: "$.frameRate", width: "$.frameWidth", height: "$.frameHeight" }
      replace: shows
      state:
        "shows.{id}.name": "{name}"
        "shows.{id}.index": "{index}"
        "shows.{id}.current": "{current}"
        "shows.{id}.orientation": { value: "{orientation}", map: { "0": horizontal, "1": vertical } }
        "shows.{id}.frame_rate_x1000": "{rate}"
        "shows.{id}.width": "{width}"
        "shows.{id}.height": "{height}"
    - path: "^/V1.0/show/getShowList$"
      json_each: "$.showList"
      each_match: { "$.inCurrent": "^true$" }
      json: { id: "$.showId", name: "$.name" }
      state: { show.current_id: "{id}", show.current_name: "{name}" }
    # Stream servers (getStreamServersList).
    - path: "^/V1.0/stream/getStreamServersList$"
      json_each: "$.serverList"
      json: { id: "$.id", name: "$.name", type: "$.type", configured: "$.isConfigured" }
      replace: streams
      state:
        "streams.{id}.name": "{name}"
        "streams.{id}.index": "{index:+1}"
        "streams.{id}.configured": "{configured}"
        "streams.{id}.type": { value: "{type}", map: { "1": youtube, "2": twitch, "3": facebook, "4": rtmp, "5": srt_caller, "6": ndi, "8": srt_listener, "9": rtsp } }
    # Shortcuts (getConfig) and the functions each runs.
    - path: "^/V1.0/shortcuts/getConfig$"
      json_each: "$.list"
      json: { id: "$.id", name: "$.name" }
      replace: shortcuts
      state: { "shortcuts.{id}.name": "{name}" }
    - path: "^/V1.0/shortcuts/getConfig$"
      json_each: "$.list[*].functions"
      json: { shortcut: "$^.id", id: "$.id", name: "$.name" }
      state:
        "shortcuts.{shortcut}.functions.{index:+1}.id": "{id}"
        "shortcuts.{shortcut}.functions.{index:+1}.name": "{name}"
    # Replay events (getEventList) and their tags, and the tag list.
    - path: "^/V1.0/replay/getEventList$"
      json_each: "$.eventList"
      json: { id: "$.replayRecordId", name: "$.customName", number: "$.number", duration: "$.duration", size: "$.totalSize", rating: "$.rating", team: "$.teamName", suffix: "$.clipSuffixName" }
      replace: replay.events
      state:
        "replay.events.{id}.name": "{name}"
        "replay.events.{id}.number": "{number}"
        "replay.events.{id}.duration": "{duration}"
        "replay.events.{id}.size": "{size}"
        "replay.events.{id}.rating": "{rating}"
        "replay.events.{id}.team": "{team}"
        "replay.events.{id}.clip_suffix": "{suffix}"
    - path: "^/V1.0/replay/getEventList$"
      json_each: "$.eventList[*].tags"
      json: { id: "$^.replayRecordId", tag: "$" }
      state: { "replay.events.{id}.tags.{index:+1}": "{tag}" }
    - path: "^/V1.0/replay/getAllTags$"
      json_each: "$.data"
      json: { tag: "$" }
      replace: replay.tags
      state: { "replay.tags.{index:+1}": "{tag}" }
    # PTZ devices (getDeviceList) and the one under control.
    - path: "^/V1.0/ptz/getDeviceList$"
      json: { current: "$.current" }
      state: { ptz.current_id: "{current}" }
    - path: "^/V1.0/ptz/getDeviceList$"
      json_each: "$.deviceList"
      json: { id: "$.id", name: "$.layerName", type: "$.controlType", ptz: "$.isSupportPtz" }
      replace: ptz.devices
      state:
        "ptz.devices.{id:key}.name": "{name}"
        "ptz.devices.{id:key}.supports_ptz": "{ptz}"
        "ptz.devices.{id:key}.type": { value: "{type}", map: { "100": visca_udp, "101": ndi, "102": phone_camera, "103": uvc, "104": obsbot_ndi } }
    # The phone camera under control (getPhoneCameraConfig).
    - path: "^/V1.0/ptz/getPhoneCameraConfig$"
      json:
        id: "$.info.id"
        name: "$.info.name"
        version: "$.info.clientVersion"
        platform: "$.info.clientPlatform"
        resolution: "$.info.resolution"
        fps: "$.info.fpsx1000"
        bitrate: "$.info.videoBitrate"
        recording: "$.info.isRecording"
        duration: "$.info.duration"
        error: "$.info.lastErrorCode"
        mic: "$.info.micMute"
        device: "$.info.currentDevice"
        wb_support: "$.info.whiteBalance.support"
        wb_mode: "$.info.whiteBalance.mode"
        wb: "$.info.whiteBalance.currentValue"
        wb_min: "$.info.whiteBalance.minValue"
        wb_max: "$.info.whiteBalance.maxValue"
        iso_support: "$.info.iso.support"
        iso_auto: "$.info.iso.continuousAuto"
        iso: "$.info.iso.currentValue"
        iso_min: "$.info.iso.minValue"
        iso_max: "$.info.iso.maxValue"
        ev_support: "$.info.exposureTargetBias.support"
        ev: "$.info.exposureTargetBias.currentValue"
        ev_min: "$.info.exposureTargetBias.minValue"
        ev_max: "$.info.exposureTargetBias.maxValue"
        ev_step: "$.info.exposureTargetBias.stepValue"
        focus_support: "$.info.focusLens.support"
        focus_auto: "$.info.focusLens.continuousAuto"
        focus: "$.info.focusLens.currentValue"
        focus_min: "$.info.focusLens.minValue"
        focus_max: "$.info.focusLens.maxValue"
        stab_support: "$.info.videoStabilization.support"
        stab: "$.info.videoStabilization.enable"
        flash_support: "$.info.flashlight.support"
        flash: "$.info.flashlight.enable"
      state:
        phone_camera.id: "{id}"
        phone_camera.name: "{name}"
        phone_camera.app_version: "{version}"
        phone_camera.platform: "{platform}"
        phone_camera.resolution: "{resolution}"
        phone_camera.frame_rate_x1000: "{fps}"
        phone_camera.video_bitrate: "{bitrate}"
        phone_camera.recording: "{recording}"
        phone_camera.recording_duration: "{duration}"
        phone_camera.last_record_error: { value: "{error}", map: { "0": none, "1": file_size_limit, "2": disk_full, "3": too_short } }
        phone_camera.audio_capture: "{mic}"
        phone_camera.camera: "{device}"
        phone_camera.white_balance.supported: "{wb_support}"
        phone_camera.white_balance.mode: { value: "{wb_mode}", map: { "0": custom, "1": auto, "2": incandescent, "3": fluorescent, "5": daylight, "6": cloudy } }
        phone_camera.white_balance.value: "{wb}"
        phone_camera.white_balance.min: "{wb_min}"
        phone_camera.white_balance.max: "{wb_max}"
        phone_camera.iso.supported: "{iso_support}"
        phone_camera.iso.auto: "{iso_auto}"
        phone_camera.iso.value: "{iso}"
        phone_camera.iso.min: "{iso_min}"
        phone_camera.iso.max: "{iso_max}"
        phone_camera.exposure_bias.supported: "{ev_support}"
        phone_camera.exposure_bias.value: "{ev}"
        phone_camera.exposure_bias.min: "{ev_min}"
        phone_camera.exposure_bias.max: "{ev_max}"
        phone_camera.exposure_bias.step: "{ev_step}"
        phone_camera.focus.supported: "{focus_support}"
        phone_camera.focus.auto: "{focus_auto}"
        phone_camera.focus.value: "{focus}"
        phone_camera.focus.min: "{focus_min}"
        phone_camera.focus.max: "{focus_max}"
        phone_camera.stabilization.supported: "{stab_support}"
        phone_camera.stabilization.enabled: "{stab}"
        phone_camera.flashlight.supported: "{flash_support}"
        phone_camera.flashlight.enabled: "{flash}"
    - path: "^/V1.0/ptz/getPhoneCameraConfig$"
      json_each: "$.info.cameraList"
      json: { id: "$.uniqueId", name: "$.name", position: "$.position" }
      replace: phone_camera.cameras
      state:
        "phone_camera.cameras.{index:+1}.id": "{id}"
        "phone_camera.cameras.{index:+1}.name": "{name}"
        "phone_camera.cameras.{index:+1}.position": "{position}"
    # Audio (volume/getConfig), keyed by the type number the volume commands
    # take.
    - path: "^/V1.0/volume/getConfig$"
      json_each: "$.audioList"
      json: { type: "$.audioInfo.type", source: "$.audioSourceId", name: "$.audioInfo.name", label: "$.audioInfo.label", muted: "$.audioInfo.muted",
              volume: "$.audioInfo.volume", solo: "$.audioInfo.solo", scope: "$.audioInfo.scope", afv: "$.audioInfo.supportAFV",
              multi: "$.audioInfo.beInMultiScenes", uuid: "$.audioInfo.uuid", source_type: "$.audioInfo.sourceType",
              left: "$.meter[0]", right: "$.meter[1]" }
      replace: audio.sources
      state:
        "audio.sources.{type}.source_id": "{source}"
        "audio.sources.{type}.name": "{name}"
        "audio.sources.{type}.label": "{label}"
        "audio.sources.{type}.state": { value: "{muted}", map: { "0": "on", "1": "off", "2": afv } }
        "audio.sources.{type}.volume": "{volume}"
        "audio.sources.{type}.solo": { value: "{solo}", map: { "0": false, "1": true } }
        "audio.sources.{type}.scope": { value: "{scope}", map: { "0": shared, "1": own } }
        "audio.sources.{type}.supports_afv": "{afv}"
        "audio.sources.{type}.in_several_scenes": { value: "{multi}", map: { "0": false, "1": true } }
        "audio.sources.{type}.uuid": "{uuid}"
        "audio.sources.{type}.source_type": "{source_type}"
        "audio.sources.{type}.meter.left": "{left}"
        "audio.sources.{type}.meter.right": "{right}"
    - path: "^/V1.0/volume/getConfig$"
      json: { monitor_mic: "$.monitorMicSound", mic: "$.micAudioDevice.id", mic_type: "$.micAudioDevice.deviceType",
              mon: "$.monitorAudioDevice.id", mon_type: "$.monitorAudioDevice.deviceType", mon_card: "$.monitorAudioDevice.cardNo", mon_dev: "$.monitorAudioDevice.devNo" }
      state:
        audio.monitor_mic: "{monitor_mic}"
        audio.mic_device.id: "{mic}"
        audio.mic_device.type: { value: "{mic_type}", map: { "0": internal, "1": external } }
        audio.monitor_device.id: "{mon}"
        audio.monitor_device.type: { value: "{mon_type}", map: { "0": internal, "1": external } }
        audio.monitor_device.card: "{mon_card}"
        audio.monitor_device.device: "{mon_dev}"
    # Monitor devices (getMonitorDevices; the API spells the list
    # monitorAudioDeivceList), by place from 1.
    - path: "^/V1.0/volume/getMonitorDevices$"
      json_each: "$.monitorAudioDeivceList"
      json: { id: "$.id", type: "$.deviceType", card: "$.cardNo", dev: "$.devNo", name: "$.name", card_name: "$.cardName" }
      replace: audio.monitor_devices
      state:
        "audio.monitor_devices.{index:+1}.id": "{id}"
        "audio.monitor_devices.{index:+1}.type": { value: "{type}", map: { "0": internal, "1": external } }
        "audio.monitor_devices.{index:+1}.card": "{card}"
        "audio.monitor_devices.{index:+1}.device": "{dev}"
        "audio.monitor_devices.{index:+1}.name": "{name}"
        "audio.monitor_devices.{index:+1}.card_name": "{card_name}"
    # Sources the Director Plus's outputs can show (getOutSettingsSourceList).
    - models: [director-plus]
      path: "^/V1.0/system/getOutSettingsSourceList$"
      json_each: "$"
      json: { mode: "$.mode", name: "$.name", id: "$.uuid" }
      replace: output_sources
      state:
        "output_sources.{index:+1}.mode": { value: "{mode}", map: { "0": mirror, "1": program, "2": loop_hdmi1, "3": loop_hdmi2, "4": multiview, "5": preview, "6": loop_hdmi3, "7": loop_hdmi4, "8": loop_app, "9": loop_custom_source, "10": loop_webcam1, "11": loop_webcam2 } }
        "output_sources.{index:+1}.name": "{name}"
        "output_sources.{index:+1}.id": "{id}"

