commands:
  cut:
    summary: Cut preview to program
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
    returns: ack

  auto:
    summary: Run the current transition from preview to program
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
    returns: ack

  set_program:
    summary: Put a source on program. Source ids are listed in the sources state.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      source: { type: int, min: 0, max: 65535, required: true,
                label: Source,
                description: "Video source ID as listed in the sources state (e.g. 1 for input 1)." }
    returns: ack

  set_preview:
    summary: Put a source on preview
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      source: { type: int, min: 0, max: 65535, required: true,
                label: Source,
                description: "Video source ID as listed in the sources state (e.g. 1 for input 1)." }
    returns: ack

  set_transition_style:
    summary: Choose the transition style for the next transition
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      style: { type: enum, values: [mix, dip, wipe, dve, sting], required: true,
               label: Style,
               description: "Transition style: mix, dip, wipe, DVE or stinger." }
    returns: ack

  set_transition_position:
    summary: Move the transition lever, 0 to 1
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      position: { type: float, min: 0.0, max: 1.0, required: true,
                  label: Position,
                  description: "Transition lever position, 0 (start) to 1 (complete)." }
    returns: ack

  set_aux:
    summary: Route a source to an aux output
    params:
      aux: { type: int, min: 1, max: 24, required: true,
             label: Aux,
             description: "Aux output, numbered from 1." }
      source: { type: int, min: 0, max: 65535, required: true,
                label: Source,
                description: "Video source ID as listed in the sources state (e.g. 1 for input 1)." }
    returns: ack

  dsk_auto:
    summary: Run a downstream keyer's auto transition, on or off air
    params:
      dsk: { type: int, min: 1, max: 4, required: true,
             label: DSK,
             description: "Downstream keyer, numbered from 1." }
    returns: ack

  dsk_on_air:
    summary: Cut a downstream keyer on or off air
    params:
      dsk:    { type: int, min: 1, max: 4, required: true,
                label: DSK,
                description: "Downstream keyer, numbered from 1." }
      on_air: { type: bool, default: true,
                label: On air,
                description: "True cuts the downstream keyer on air, false off air." }
    returns: ack

  usk_on_air:
    summary: Cut an upstream keyer on or off air
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer:  { type: int, min: 1, max: 16, required: true,
                label: Keyer,
                description: "Upstream keyer on the M/E, numbered from 1." }
      on_air: { type: bool, default: true,
                label: On air,
                description: "True cuts the upstream keyer on air, false off air." }
    returns: ack

  fade_to_black:
    summary: Run fade to black, or fade back up when already black
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
    returns: ack

  run_macro:
    summary: Run a macro by its slot number, counting from 1
    params:
      macro: { type: int, min: 1, max: 100, required: true,
               label: Macro,
               description: "Macro slot, numbered from 1 as in ATEM Software Control." }
    returns: ack

  stop_macro:
    summary: Stop the running macro
    returns: ack

  start_streaming: { summary: Start streaming with the configured service, returns: ack }
  stop_streaming:  { summary: Stop streaming, returns: ack }
  start_recording: { summary: Start recording to the attached disk, returns: ack }
  stop_recording:  { summary: Stop recording, returns: ack }

  set_next_transition:
    summary: >
      Choose the layers the next transition takes: the background and each
      upstream keyer. Layers not given keep their current setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      background: { type: bool,
                    label: Background,
                    description: "Whether the next transition takes the background; not given keeps the current setting." }
      key1: { type: bool,
              label: Key 1,
              description: "Whether the next transition takes upstream key 1; not given keeps the current setting." }
      key2: { type: bool,
              label: Key 2,
              description: "Whether the next transition takes upstream key 2; not given keeps the current setting." }
      key3: { type: bool,
              label: Key 3,
              description: "Whether the next transition takes upstream key 3; not given keeps the current setting." }
      key4: { type: bool,
              label: Key 4,
              description: "Whether the next transition takes upstream key 4; not given keeps the current setting." }
    returns: ack

  set_preview_transition:
    summary: Preview the next transition on the preview output (PREV TRANS)
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      enabled: { type: bool, default: true,
                 label: Preview transition,
                 description: "True previews the next transition on the preview output (PREV TRANS), false stops." }
    returns: ack

  set_mix_rate:
    summary: Set the mix transition's rate, in frames
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      rate: { type: int, min: 1, max: 250, required: true,
              label: Rate,
              description: "Mix transition duration in frames." }
    returns: ack

  set_dip:
    summary: Set the dip transition's rate (frames) and dip source. Give at least one.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      rate: { type: int, min: 1, max: 250,
              label: Rate,
              description: "Dip transition duration in frames." }
      source: { type: int, min: 0, max: 65535,
                label: Dip source,
                description: "Video source ID as listed in the sources state (e.g. 1 for input 1) to dip through." }
    returns: ack

  set_wipe:
    summary: >
      Set the wipe transition. Width, symmetry and softness are percent; x and
      y place the wipe's origin from 0 to 1. Give at least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      rate: { type: int, min: 1, max: 250,
              label: Rate,
              description: "Wipe transition duration in frames." }
      pattern:
        type: enum
        values: [left_to_right_bar, top_to_bottom_bar, horizontal_barn_door,
                 vertical_barn_door, corners_in_four_box, rectangle_iris,
                 diamond_iris, circle_iris, top_left_box, top_right_box,
                 bottom_right_box, bottom_left_box, top_centre_box,
                 right_centre_box, bottom_centre_box, left_centre_box,
                 top_left_diagonal, top_right_diagonal]
        label: Pattern
        description: "Wipe pattern, e.g. left_to_right_bar, circle_iris or top_left_diagonal, as on the ATEM's wipe palette."
      border_width: { type: float, min: 0.0, max: 100.0,
                      label: Border width,
                      description: "Wipe border width in percent, 0 (none) to 100." }
      border_source: { type: int, min: 0, max: 65535,
                       label: Border source,
                       description: "Video source ID as listed in the sources state (e.g. 1 for input 1) filling the wipe border." }
      symmetry: { type: float, min: 0.0, max: 100.0,
                  label: Symmetry,
                  description: "Pattern symmetry in percent, 0 to 100." }
      softness: { type: float, min: 0.0, max: 100.0,
                  label: Softness,
                  description: "Edge softness in percent, 0 to 100." }
      x: { type: float, min: 0.0, max: 1.0,
           label: X position,
           description: "Horizontal origin of the wipe, 0 (left) to 1 (right)." }
      y: { type: float, min: 0.0, max: 1.0,
           label: Y position,
           description: "Vertical origin of the wipe, 0 (top) to 1 (bottom)." }
      reverse: { type: bool,
                 label: Reverse,
                 description: "Whether the transition runs in reverse direction." }
      flip_flop: { type: bool,
                   label: Flip flop,
                   description: "Whether the direction alternates on each transition." }
    returns: ack

  set_dve_transition:
    summary: >
      Set the DVE transition: rate (frames), style, key sources and key
      settings. Clip and gain are percent. Give at least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      rate: { type: int, min: 1, max: 250,
              label: Rate,
              description: "DVE transition duration in frames." }
      style:
        type: enum
        values: [swoosh_top_left, swoosh_top, swoosh_top_right, swoosh_left,
                 swoosh_right, swoosh_bottom_left, swoosh_bottom, swoosh_bottom_right,
                 spin_cw_top_left, spin_cw_top_right, spin_cw_bottom_left,
                 spin_cw_bottom_right, spin_ccw_top_left, spin_ccw_top_right,
                 spin_ccw_bottom_left, spin_ccw_bottom_right, squeeze_top_left,
                 squeeze_top, squeeze_top_right, squeeze_left, squeeze_right,
                 squeeze_bottom_left, squeeze_bottom, squeeze_bottom_right,
                 push_top_left, push_top, push_top_right, push_left, push_right,
                 push_bottom_left, push_bottom, push_bottom_right, graphic_cw_spin,
                 graphic_ccw_spin, graphic_logo_wipe]
        label: Style
        description: "DVE move, e.g. swoosh_left, spin_cw_top_left, squeeze_top, push_right or a graphic wipe."
      fill_source: { type: int, min: 0, max: 65535,
                     label: Fill source,
                     description: "Fill source ID as listed in the sources state (e.g. 1 for input 1) for the graphic DVE key." }
      key_source: { type: int, min: 0, max: 65535,
                    label: Key source,
                    description: "Key (cut) source ID as listed in the sources state (e.g. 1 for input 1) for the graphic DVE key." }
      enable_key: { type: bool,
                    label: Enable key,
                    description: "Whether the DVE transition keys a graphic over the move." }
      pre_multiplied: { type: bool,
                        label: Pre-multiplied,
                        description: "Whether the key is pre-multiplied (the fill already shaped by the key); off uses clip and gain." }
      clip: { type: float, min: 0.0, max: 100.0,
              label: Clip,
              description: "Key clip level in percent, 0 to 100." }
      gain: { type: float, min: 0.0, max: 100.0,
              label: Gain,
              description: "Key gain in percent, 0 to 100." }
      invert_key: { type: bool,
                    label: Invert key,
                    description: "Whether the key signal is inverted." }
      reverse: { type: bool,
                 label: Reverse,
                 description: "Whether the transition runs in reverse direction." }
      flip_flop: { type: bool,
                   label: Flip flop,
                   description: "Whether the direction alternates on each transition." }
    returns: ack

  set_stinger:
    summary: >
      Set the stinger transition: the media player playing the clip, its key,
      and the preroll, clip duration, trigger point and mix rate in frames.
      Clip and gain are percent. Give at least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      media_player: { type: int, min: 1, max: 4,
                      label: Media player,
                      description: "Media player that plays the stinger clip, numbered from 1." }
      pre_multiplied: { type: bool,
                        label: Pre-multiplied,
                        description: "Whether the key is pre-multiplied (the fill already shaped by the key); off uses clip and gain." }
      clip: { type: float, min: 0.0, max: 100.0,
              label: Clip,
              description: "Key clip level in percent, 0 to 100." }
      gain: { type: float, min: 0.0, max: 100.0,
              label: Gain,
              description: "Key gain in percent, 0 to 100." }
      invert: { type: bool,
                label: Invert key,
                description: "Whether the key signal is inverted." }
      preroll: { type: int, min: 0, max: 65535,
                 label: Preroll,
                 description: "Frames the clip plays before the transition starts." }
      clip_duration: { type: int, min: 0, max: 65535,
                       label: Clip duration,
                       description: "Length of the stinger clip in frames." }
      trigger_point: { type: int, min: 0, max: 65535,
                       label: Trigger point,
                       description: "Frame of the clip at which the background starts to mix." }
      mix_rate: { type: int, min: 0, max: 65535,
                  label: Mix rate,
                  description: "Duration of the background mix in frames." }
    returns: ack

  set_fade_to_black_rate:
    summary: Set the fade to black rate, in frames
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      rate: { type: int, min: 1, max: 250, required: true,
              label: Rate,
              description: "Fade to black duration in frames." }
    returns: ack

  set_usk_type:
    summary: Set an upstream keyer's type, and whether it flies (DVE). Give at least one.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      type: { type: enum, values: [luma, chroma, pattern, dve],
              label: Key type,
              description: "Upstream key type: luma, chroma, pattern or DVE." }
      fly_enabled: { type: bool,
                     label: Flying key,
                     description: "Whether the key flies (uses the DVE)." }
    returns: ack

  set_usk_sources:
    summary: Set an upstream keyer's fill and key (cut) sources. Give at least one.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      fill: { type: int, min: 0, max: 65535,
              label: Fill source,
              description: "Fill source ID as listed in the sources state (e.g. 1 for input 1)." }
      key: { type: int, min: 0, max: 65535,
             label: Key source,
             description: "Key (cut) source ID as listed in the sources state (e.g. 1 for input 1)." }
    returns: ack

  set_usk_luma:
    summary: Set an upstream luma key. Clip and gain are percent. Give at least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      pre_multiplied: { type: bool,
                        label: Pre-multiplied,
                        description: "Whether the key is pre-multiplied (the fill already shaped by the key); off uses clip and gain." }
      clip: { type: float, min: 0.0, max: 100.0,
              label: Clip,
              description: "Key clip level in percent, 0 to 100." }
      gain: { type: float, min: 0.0, max: 100.0,
              label: Gain,
              description: "Key gain in percent, 0 to 100." }
      invert: { type: bool,
                label: Invert key,
                description: "Whether the key signal is inverted." }
    returns: ack

  set_usk_pattern:
    summary: >
      Set an upstream pattern key. Size, symmetry and softness are percent; x
      and y place the pattern from 0 to 1. Give at least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      style:
        type: enum
        values: [left_to_right_bar, top_to_bottom_bar, horizontal_barn_door,
                 vertical_barn_door, corners_in_four_box, rectangle_iris,
                 diamond_iris, circle_iris, top_left_box, top_right_box,
                 bottom_right_box, bottom_left_box, top_centre_box,
                 right_centre_box, bottom_centre_box, left_centre_box,
                 top_left_diagonal, top_right_diagonal]
        label: Pattern
        description: "Pattern shape, e.g. circle_iris or left_to_right_bar, as on the ATEM's pattern palette."
      size: { type: float, min: 0.0, max: 100.0,
              label: Size,
              description: "Pattern size in percent, 0 to 100." }
      symmetry: { type: float, min: 0.0, max: 100.0,
                  label: Symmetry,
                  description: "Pattern symmetry in percent, 0 to 100." }
      softness: { type: float, min: 0.0, max: 100.0,
                  label: Softness,
                  description: "Edge softness in percent, 0 to 100." }
      x: { type: float, min: 0.0, max: 1.0,
           label: X position,
           description: "Horizontal position of the pattern, 0 (left) to 1 (right)." }
      y: { type: float, min: 0.0, max: 1.0,
           label: Y position,
           description: "Vertical position of the pattern, 0 (top) to 1 (bottom)." }
      invert: { type: bool,
                label: Invert,
                description: "Whether the pattern is inverted." }
    returns: ack

  set_usk_dve:
    summary: >
      Set an upstream keyer's DVE (picture in picture): size, position,
      rotation, border, drop shadow and its light source, mask, and the fly
      rate. Size is a factor (1 is full frame); position is in the frame's
      units, 0 at the centre and about ±16 wide by ±9 high at the edges. Give
      at least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      size_x: { type: float, min: 0.0, max: 99.99,
                label: Size X,
                description: "Horizontal size as a factor of the frame, 1 being full width." }
      size_y: { type: float, min: 0.0, max: 99.99,
                label: Size Y,
                description: "Vertical size as a factor of the frame, 1 being full height." }
      x: { type: float, min: -1000.0, max: 1000.0,
           label: Position X,
           description: "Horizontal position of the key's centre; 0 is the centre, about ±16 the frame's edges." }
      y: { type: float, min: -1000.0, max: 1000.0,
           label: Position Y,
           description: "Vertical position of the key's centre; 0 is the centre, about ±9 the frame's edges." }
      rotation: { type: float, min: -3600.0, max: 3600.0,
                  label: Rotation,
                  description: "Rotation in degrees; values past 360 turn more than once when flying." }
      border_enabled: { type: bool,
                        label: Border,
                        description: "Whether the key has a border." }
      shadow_enabled: { type: bool,
                        label: Drop shadow,
                        description: "Whether the key casts a drop shadow." }
      border_bevel: { type: enum, values: ["none", "in_out", "in", "out"],
                      label: Border bevel,
                      description: "Border bevel style: none, in and out, in, or out." }
      border_outer_width: { type: float, min: 0.0, max: 16.0,
                            label: Border outer width,
                            description: "Outer border width, 0 to 16." }
      border_inner_width: { type: float, min: 0.0, max: 16.0,
                            label: Border inner width,
                            description: "Inner border width, 0 to 16." }
      border_outer_softness: { type: int, min: 0, max: 100,
                               label: Border outer softness,
                               description: "Outer border softness in percent." }
      border_inner_softness: { type: int, min: 0, max: 100,
                               label: Border inner softness,
                               description: "Inner border softness in percent." }
      border_bevel_softness: { type: int, min: 0, max: 100,
                               label: Bevel softness,
                               description: "Bevel softness in percent." }
      border_bevel_position: { type: int, min: 0, max: 100,
                               label: Bevel position,
                               description: "Bevel position in percent." }
      border_opacity: { type: int, min: 0, max: 100,
                        label: Border opacity,
                        description: "Border opacity in percent." }
      border_hue: { type: float, min: 0.0, max: 359.9,
                    label: Border hue,
                    description: "Border colour hue in degrees." }
      border_saturation: { type: float, min: 0.0, max: 100.0,
                           label: Border saturation,
                           description: "Border colour saturation in percent." }
      border_luma: { type: float, min: 0.0, max: 100.0,
                     label: Border luma,
                     description: "Border colour luminance in percent." }
      light_direction: { type: float, min: 0.0, max: 359.9,
                         label: Light angle,
                         description: "Direction the light source shines from, in degrees, for the bevel and drop shadow." }
      light_altitude: { type: int, min: 10, max: 100,
                        label: Light altitude,
                        description: "Altitude of the light source, 10 to 100." }
      mask_enabled: { type: bool,
                      label: Mask,
                      description: "Whether the DVE's mask is on." }
      mask_top: { type: float, min: -9.0, max: 9.0,
                  label: Mask top,
                  description: "Top edge of the mask, -9 to 9." }
      mask_bottom: { type: float, min: -9.0, max: 9.0,
                     label: Mask bottom,
                     description: "Bottom edge of the mask, -9 to 9." }
      mask_left: { type: float, min: -16.0, max: 16.0,
                   label: Mask left,
                   description: "Left edge of the mask, -16 to 16." }
      mask_right: { type: float, min: -16.0, max: 16.0,
                    label: Mask right,
                    description: "Right edge of the mask, -16 to 16." }
      rate: { type: int, min: 1, max: 250,
              label: Fly rate,
              description: "Frames the key takes to fly between keyframes." }
    returns: ack

  set_usk_keyframe:
