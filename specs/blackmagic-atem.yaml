      stops Blackmagic cameras' own recording. Give at least one.
    params:
      filename: { type: string, max_length: 127,
                  label: File name,
                  description: "Base name for recorded files." }
      working_set_1_disk: { type: int, min: 0, max: 4294967295,
                            label: Disk 1,
                            description: "First working-set disk, a key of recording.disks; 0 for none." }
      working_set_2_disk: { type: int, min: 0, max: 4294967295,
                            label: Disk 2,
                            description: "Second working-set disk, a key of recording.disks; 0 for none." }
      record_in_all_cameras: { type: bool,
                               label: Record in cameras,
                               description: "Whether starting a recording also records in the Blackmagic cameras connected." }
    returns: ack

  switch_recording_disk:
    summary: Move recording to the other working-set disk
    returns: ack

  set_recording_iso:
    summary: On ISO models, record every input to its own file as well as the program
    params:
      record_all_inputs: { type: bool, default: true,
                           label: Record all inputs,
                           description: "True records every input separately (ISO), false the program only." }
    returns: ack

  set_streaming_audio_bitrates:
    summary: Set the streaming audio bitrates for the low and high quality, in bits per second. Give at least one.
    params:
      low: { type: int, min: 0, max: 4294967295,
             label: Low,
             description: "Audio bitrate for the low quality, in bits per second (e.g. 128000)." }
      high: { type: int, min: 0, max: 4294967295,
              label: High,
              description: "Audio bitrate for the high quality, in bits per second (e.g. 192000)." }
    returns: ack

  set_multiviewer_properties:
    summary: >
      Set a multiviewer's layout (which quadrants hold four small windows)
