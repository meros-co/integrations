            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      foreground_level: { type: float, min: 0.0, max: 100.0,
                          label: Foreground,
                          description: "Foreground level in percent." }
      background_level: { type: float, min: 0.0, max: 100.0,
                          label: Background,
                          description: "Background level in percent." }
      key_edge: { type: float, min: 0.0, max: 100.0,
                  label: Key edge,
                  description: "Key edge in percent." }
      spill_suppression: { type: float, min: 0.0, max: 100.0,
                           label: Spill suppression,
                           description: "Colour spill suppression in percent." }
      flare_suppression: { type: float, min: 0.0, max: 100.0,
                           label: Flare suppression,
                           description: "Flare suppression in percent." }
      brightness: { type: float, min: -100.0, max: 100.0,
                    label: Brightness,
                    description: "Foreground brightness adjustment, -100 to 100." }
      contrast: { type: float, min: -100.0, max: 100.0,
                  label: Contrast,
                  description: "Foreground contrast adjustment, -100 to 100." }
      saturation: { type: float, min: 0.0, max: 200.0,
                    label: Saturation,
                    description: "Foreground saturation in percent, 100 unchanged." }
      red: { type: float, min: -100.0, max: 100.0,
             label: Red,
             description: "Red adjustment, -100 to 100." }
      green: { type: float, min: -100.0, max: 100.0,
               label: Green,
               description: "Green adjustment, -100 to 100." }
      blue: { type: float, min: -100.0, max: 100.0,
              label: Blue,
              description: "Blue adjustment, -100 to 100." }
