                       label: Border source,
                       description: "Video source ID as listed in the sources state (e.g. 1 for input 1) filling the wipe border." }
      symmetry: { type: float, min: 0.0, max: 100.0,
                  label: Symmetry,
                  description: "Pattern symmetry in percent, 0 to 100." }
      softness: { type: float, min: 0.0, max: 100.0,
                  label: Softness,
                  description: "Edge softness in percent, 0 to 100." }
      x: { type: float, min: 0.0, max: 1.0,
           label: X position,
           description: "Horizontal origin of the wipe, 0 (left) to 1 (right)." }
      y: { type: float, min: 0.0, max: 1.0,
           label: Y position,
           description: "Vertical origin of the wipe, 0 (top) to 1 (bottom)." }
      reverse: { type: bool,
                 label: Reverse,
                 description: "Whether the transition runs in reverse direction." }
      flip_flop: { type: bool,
                   label: Flip flop,
                   description: "Whether the direction alternates on each transition." }
    returns: ack

  set_dve_transition:
    summary: >
      Set the DVE transition: rate (frames), style, key sources and key
      settings. Clip and gain are percent. Give at least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      rate: { type: int, min: 1, max: 250,
              label: Rate,
              description: "DVE transition duration in frames." }
      style:
        type: enum
        values: [swoosh_top_left, swoosh_top, swoosh_top_right, swoosh_left,
                 swoosh_right, swoosh_bottom_left, swoosh_bottom, swoosh_bottom_right,
                 spin_cw_top_left, spin_cw_top_right, spin_cw_bottom_left,
                 spin_cw_bottom_right, spin_ccw_top_left, spin_ccw_top_right,
                 spin_ccw_bottom_left, spin_ccw_bottom_right, squeeze_top_left,
                 squeeze_top, squeeze_top_right, squeeze_left, squeeze_right,
                 squeeze_bottom_left, squeeze_bottom, squeeze_bottom_right,
                 push_top_left, push_top, push_top_right, push_left, push_right,
                 push_bottom_left, push_bottom, push_bottom_right, graphic_cw_spin,
                 graphic_ccw_spin, graphic_logo_wipe]
        label: Style
        description: "DVE move, e.g. swoosh_left, spin_cw_top_left, squeeze_top, push_right or a graphic wipe."
      fill_source: { type: int, min: 0, max: 65535,
                     label: Fill source,
                     description: "Fill source ID as listed in the sources state (e.g. 1 for input 1) for the graphic DVE key." }
      key_source: { type: int, min: 0, max: 65535,
                    label: Key source,
                    description: "Key (cut) source ID as listed in the sources state (e.g. 1 for input 1) for the graphic DVE key." }
      enable_key: { type: bool,
                    label: Enable key,
                    description: "Whether the DVE transition keys a graphic over the move." }
      pre_multiplied: { type: bool,
                        label: Pre-multiplied,
                        description: "Whether the key is pre-multiplied (the fill already shaped by the key); off uses clip and gain." }
      clip: { type: float, min: 0.0, max: 100.0,
              label: Clip,
              description: "Key clip level in percent, 0 to 100." }
      gain: { type: float, min: 0.0, max: 100.0,
              label: Gain,
              description: "Key gain in percent, 0 to 100." }
      invert_key: { type: bool,
                    label: Invert key,
                    description: "Whether the key signal is inverted." }
      reverse: { type: bool,
                 label: Reverse,
                 description: "Whether the transition runs in reverse direction." }
      flip_flop: { type: bool,
                   label: Flip flop,
                   description: "Whether the direction alternates on each transition." }
    returns: ack

  set_stinger:
    summary: >
      Set the stinger transition: the media player playing the clip, its key,
