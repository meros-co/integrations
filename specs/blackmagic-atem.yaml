            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
    returns: ack

  run_macro:
    summary: Run a macro by its slot number, counting from 1, optionally setting it to loop
    params:
      macro: { type: int, min: 1, max: 100, required: true,
               label: Macro,
               description: "Macro slot, numbered from 1 as in ATEM Software Control." }
      loop: { type: bool,
              label: Loop,
              description: "Whether the macro loops; not given keeps the current loop setting." }
