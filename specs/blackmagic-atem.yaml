                   description: "Left edge of the mask, -16 to 16." }
      mask_right: { type: float, min: -16.0, max: 16.0,
                    label: Mask right,
                    description: "Right edge of the mask, -16 to 16." }
      rate: { type: int, min: 1, max: 250,
              label: Fly rate,
              description: "Frames the key takes to fly between keyframes." }
    returns: ack

