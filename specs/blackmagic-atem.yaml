    params:
      multiviewer: { type: int, min: 1, max: 4, required: true,
                     label: Multiviewer,
                     description: "Multiviewer output, numbered from 1." }
      layout:
        type: enum
        values: [default, top_left_small, top_right_small, program_bottom, bottom_left_small,
                 program_right, bottom_right_small, program_left, program_top]
        label: Layout
        description: "Which quadrants are split into four small windows; program_bottom, program_right, program_left and program_top name the large windows' place."
      program_preview_swapped: { type: bool,
                                 label: Swap program and preview,
                                 description: "Whether program and preview swap places." }
    returns: ack

  set_multiviewer_vu_meter:
    summary: Show or hide a multiviewer window's audio meter
    params:
      multiviewer: { type: int, min: 1, max: 4, required: true,
                     label: Multiviewer,
                     description: "Multiviewer output, numbered from 1." }
      window: { type: int, min: 1, max: 16, required: true,
                label: Window,
                description: "Multiviewer window, numbered as in the multiviewers state." }
      enabled: { type: bool, default: true,
                 label: Audio meter,
                 description: "True shows the window's audio meter, false hides it." }
    returns: ack

  set_multiviewer_safe_area:
    summary: Show or hide a multiviewer window's safe area markers. Protocol 2.28 and later.
    params:
      multiviewer: { type: int, min: 1, max: 4, required: true,
                     label: Multiviewer,
                     description: "Multiviewer output, numbered from 1." }
      window: { type: int, min: 1, max: 16, required: true,
                label: Window,
                description: "Multiviewer window, numbered as in the multiviewers state." }
      enabled: { type: bool, default: true,
                 label: Safe area,
                 description: "True shows the safe area markers, false hides them." }
    returns: ack

  set_multiviewer_vu_opacity:
    summary: Set the opacity of a multiviewer's audio meters, in percent
    params:
      multiviewer: { type: int, min: 1, max: 4, required: true,
                     label: Multiviewer,
                     description: "Multiviewer output, numbered from 1." }
      opacity: { type: int, min: 0, max: 100, required: true,
                 label: Opacity,
                 description: "Audio meter opacity in percent." }
    returns: ack

  set_multiviewer_overlay:
    summary: Show or hide a multiviewer window's label and border. Give at least one.
    params:
      multiviewer: { type: int, min: 1, max: 4, required: true,
                     label: Multiviewer,
                     description: "Multiviewer output, numbered from 1." }
      window: { type: int, min: 1, max: 16, required: true,
                label: Window,
                description: "Multiviewer window, numbered as in the multiviewers state." }
      label_visible: { type: bool,
                       label: Label,
                       description: "Whether the window shows its source's label." }
      border_visible: { type: bool,
                        label: Border,
                        description: "Whether the window has a border." }
    returns: ack

  set_video_mode:
    summary: >
      Set the switcher's video standard. Every output drops while it
      reconfigures; topology.video_modes lists the modes it offers.
    params:
      mode:
        type: enum
        required: true
        values: ["525i59_94_ntsc", "625i50_pal", "525i59_94_ntsc_16_9", "625i50_pal_16_9",
                 "720p50", "720p59_94", "1080i50", "1080i59_94", "1080p23_98", "1080p24",
                 "1080p25", "1080p29_97", "1080p50", "1080p59_94", "2160p23_98", "2160p24",
                 "2160p25", "2160p29_97", "2160p50", "2160p59_94", "4320p23_98", "4320p24",
                 "4320p25", "4320p29_97", "4320p50", "4320p59_94", "1080p30", "1080p60"]
        label: Video mode
        description: "Video standard: lines, scan (i or p) and frame rate, e.g. 1080p25 or 1080i59_94."
    returns: ack

  save_startup_state:
    summary: Save the switcher's current state as the state it starts up in
    returns: ack

  clear_startup_state:
    summary: Clear the saved startup state, so the switcher starts with its defaults
    returns: ack

  start_macro_recording:
    summary: >
      Start recording a macro into a slot: the switcher records what is done
      until stop_macro_recording. Overwrites a macro already there.
    params:
      macro: { type: int, min: 1, max: 100, required: true,
               label: Macro,
               description: "Macro slot, numbered from 1 as in ATEM Software Control." }
      name: { type: string, max_length: 255,
              label: Name,
              description: "Macro name." }
      description: { type: string, max_length: 1023,
                     label: Description,
                     description: "Macro description." }
    returns: ack

  stop_macro_recording:
    summary: Stop recording a macro
    returns: ack

  macro_add_pause:
    summary: While recording a macro, add a pause of a number of frames
    params:
      frames: { type: int, min: 1, max: 65535, required: true,
                label: Frames,
                description: "Length of the pause in frames." }
    returns: ack

  macro_add_user_wait:
    summary: While recording a macro, add a wait for the operator (continue_macro resumes it)
    returns: ack

  delete_macro:
    summary: Delete a macro
    params:
      macro: { type: int, min: 1, max: 100, required: true,
               label: Macro,
               description: "Macro slot, numbered from 1 as in ATEM Software Control." }
    returns: ack

  set_macro_properties:
    summary: Rename a macro or change its description. Give at least one.
    params:
      macro: { type: int, min: 1, max: 100, required: true,
               label: Macro,
               description: "Macro slot, numbered from 1 as in ATEM Software Control." }
      name: { type: string, max_length: 255,
              label: Name,
              description: "Macro name." }
      description: { type: string, max_length: 1023,
                     label: Description,
                     description: "Macro description." }
    returns: ack
  camera_iris:
    summary: Set a Blackmagic camera's iris, 0 (closed) to 1 (open), over SDI camera control
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      iris: { type: float, min: 0.0, max: 1.0, required: true,
              label: Iris,
              description: "Iris opening, 0 (closed) to 1 (open)." }
    returns: ack

  camera_focus:
    summary: >
      Set a Blackmagic camera's focus, 0 (near) to 1 (far), or move it by -1
      to 1 when relative
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      focus: { type: float, min: -1.0, max: 1.0, required: true,
               label: Focus,
               description: "Focus position, 0 (near) to 1 (far); with relative, a move of -1 to 1." }
      relative: { type: bool, default: false,
                  label: Relative,
                  description: "Whether focus moves the focus by that amount rather than setting it." }
    returns: ack

  camera_zoom:
    summary: Zoom a Blackmagic camera's lens at a speed, -1 (wide) to 1 (tele); 0 stops
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      speed: { type: float, min: -1.0, max: 1.0, required: true,
               label: Zoom speed,
               description: "Zoom speed, -1 (wide) to 1 (tele); 0 stops." }
    returns: ack

  camera_gain:
    summary: Set a Blackmagic camera's gain, in dB
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      gain: { type: int, min: 0, max: 127, required: true,
              label: Gain,
              description: "Camera gain in dB." }
    returns: ack

  camera_white_balance:
    summary: Set a Blackmagic camera's white balance in kelvin, and tint
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      kelvin: { type: int, min: 1000, max: 15000, required: true,
                label: White balance,
                description: "Colour temperature in kelvin, 1000 to 15000." }
      tint: { type: int, min: -50, max: 50, default: 0,
              label: Tint,
              description: "Tint, -50 to 50; 0 is neutral." }
    returns: ack

  camera_shutter:
    summary: Set a Blackmagic camera's exposure time, in microseconds (20000 is 1/50 s)
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      exposure_us: { type: int, min: 2500, max: 1000000, required: true,
                     label: Exposure,
                     description: "Exposure time in microseconds, e.g. 20000 for 1/50 s." }
    returns: ack

  camera_auto_focus:
    summary: Run a Blackmagic camera's one-shot auto focus
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
    returns: ack

  camera_auto_iris:
    summary: Run a Blackmagic camera's one-shot auto iris
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
    returns: ack

  camera_auto_white_balance:
    summary: Run a Blackmagic camera's one-shot auto white balance
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
    returns: ack

  camera_iris_fstop:
    summary: Set a Blackmagic camera's iris as an f-stop number
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      fstop: { type: float, min: -1.0, max: 15.99, required: true,
               label: Aperture value,
               description: "Aperture value (AV) as Blackmagic's camera control protocol gives it, where f-number is the square root of 2 to that power." }
    returns: ack

  camera_stabilisation:
    summary: Turn a Blackmagic camera's optical image stabilisation on or off
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      enabled: { type: bool, default: true,
                 label: Stabilisation,
                 description: "True turns optical image stabilisation on, false off." }
    returns: ack

  camera_sharpening:
    summary: Set a Blackmagic camera's detail (sharpening) level
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      level: { type: enum, values: ["off", low, medium, high], required: true,
               label: Detail,
               description: "Detail (sharpening): off, low, medium or high." }
    returns: ack

  camera_nd_filter:
    summary: Set a Blackmagic camera's ND filter, in stops
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      stop: { type: float, min: 0.0, max: 15.99, required: true,
              label: ND stops,
              description: "ND filter in stops (0 is clear); the camera takes the nearest filter it has." }
    returns: ack

  camera_color_bars:
    summary: Show or hide a Blackmagic camera's colour bars
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      enabled: { type: bool, default: true,
                 label: Colour bars,
                 description: "True shows colour bars (for 30 s, as ATEM Software Control asks), false hides them." }
    returns: ack

  camera_display_tools:
    summary: >
      Set the exposure and focus tools a Blackmagic camera shows on its
      outputs: zebra, focus assist and false colour. Tools not given are off.
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      zebra: { type: bool, default: false,
               label: Zebra,
               description: "Whether zebra stripes show." }
      focus_assist: { type: bool, default: false,
                      label: Focus assist,
                      description: "Whether focus assist (peaking) shows." }
      false_color: { type: bool, default: false,
                     label: False colour,
                     description: "Whether false colour shows." }
    returns: ack

  camera_overlays:
    summary: Show or hide a Blackmagic camera's overlays (frame guides, status) on its outputs
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      enabled: { type: bool, default: true,
                 label: Overlays,
                 description: "True shows the camera's overlays, false hides them." }
    returns: ack

  camera_color_wheel:
    summary: >
      Set one of a Blackmagic camera's primary colour correction wheels:
      lift (-2 to 2), gamma (-4 to 4), gain (0 to 15.99) or offset (-8 to 8),
      each with red, green, blue and luma
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      wheel: { type: enum, values: [lift, gamma, gain, offset], required: true,
               label: Wheel,
               description: "Colour wheel: lift (shadows), gamma (mid tones), gain (highlights) or offset (overall)." }
      red: { type: float, min: -8.0, max: 15.99, required: true,
             label: Red,
             description: "Red value, within the wheel's range." }
      green: { type: float, min: -8.0, max: 15.99, required: true,
               label: Green,
               description: "Green value, within the wheel's range." }
      blue: { type: float, min: -8.0, max: 15.99, required: true,
              label: Blue,
              description: "Blue value, within the wheel's range." }
      luma: { type: float, min: -8.0, max: 15.99, required: true,
              label: Luma,
              description: "Luma value, within the wheel's range." }
    returns: ack

  camera_contrast:
    summary: Set a Blackmagic camera's contrast (0 to 2, 1 neutral) and its pivot (0 to 1)
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      pivot: { type: float, min: 0.0, max: 1.0, required: true,
               label: Pivot,
               description: "Contrast pivot, 0 to 1; 0.5 is the middle." }
      adjust: { type: float, min: 0.0, max: 2.0, required: true,
                label: Contrast,
                description: "Contrast, 0 to 2; 1 is unchanged." }
    returns: ack

  camera_luma_mix:
    summary: Set a Blackmagic camera's luma mix, 0 to 1
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      luma_mix: { type: float, min: 0.0, max: 1.0, required: true,
                  label: Luma mix,
                  description: "Luma mix, 0 to 1; 1 is the default." }
    returns: ack

  camera_hue_saturation:
    summary: Set a Blackmagic camera's hue (-1 to 1, a full turn) and saturation (0 to 2, 1 neutral)
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      hue: { type: float, min: -1.0, max: 1.0, required: true,
             label: Hue,
             description: "Hue rotation, -1 to 1 (-180 to 180 degrees); 0 is unchanged." }
      saturation: { type: float, min: 0.0, max: 2.0, required: true,
                    label: Saturation,
                    description: "Saturation, 0 to 2; 1 is unchanged." }
    returns: ack

  camera_color_reset:
    summary: Reset a Blackmagic camera's colour correction to its defaults
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
    returns: ack

  camera_record:
    summary: Start or stop recording in a Blackmagic camera
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      recording: { type: bool, default: true,
                   label: Record,
                   description: "True starts recording on the camera's media, false stops it." }
    returns: ack

state:
  device.product:              { type: string, description: "Product name the switcher reports (_pin)" }
  device.model_id:             { type: int, description: "Model number the switcher reports (_pin); see the models' comments" }
  device.protocol_version:     { type: string, description: "Protocol version (_ver), such as 2.30; not the firmware version" }
  topology.mes:                { type: int, description: "Number of M/Es" }
  topology.sources:            { type: int, description: "Number of video sources" }
  topology.auxes:              { type: int, description: "Number of aux outputs" }
  topology.dsks:               { type: int, description: "Number of downstream keyers" }
  topology.media_players:      { type: int, description: "Number of media players" }
  topology.supersources:       { type: int, description: "Number of SuperSources" }
  topology.macros:             { type: int, description: "Number of macro slots" }
  sources.*.long_name:         { type: string, description: "Source long name, keyed by source id" }
  sources.*.short_name:        { type: string, description: "Source short name (4 characters)" }
  sources.*.kind:              { type: string, description: "external, black, color_bars, color, media_player_fill, media_player_key, supersource, external_direct, me_output, aux, mask, multiviewer, audio_monitor or unknown" }
  mes.*.program:               { type: int, description: "Source id on program, keyed by M/E number from 1" }
  mes.*.preview:               { type: int, description: "Source id on preview" }
  mes.*.keyers:                { type: int, description: "Upstream keyers on this M/E" }
  mes.*.transition.style:      { type: string, description: "mix, dip, wipe, dve or sting" }
  mes.*.transition.in_progress: { type: bool, description: "A transition is running" }
  mes.*.transition.position:   { type: float, description: "Transition position, 0 to 1" }
  mes.*.fade_to_black.black:   { type: bool, description: "Output fully faded to black" }
  mes.*.fade_to_black.in_progress: { type: bool, description: "Fade to black running" }
  mes.*.usk.*.on_air:          { type: bool, description: "Upstream keyer on air, keyed by keyer number from 1" }
  auxes.*.source:              { type: int, description: "Source id routed to the aux, keyed by aux number from 1" }
  dsks.*.on_air:               { type: bool, description: "Downstream keyer on air, keyed by DSK number from 1" }
  dsks.*.in_transition:        { type: bool, description: "Downstream keyer transitioning" }
  dsks.*.tie:                  { type: bool, description: "Downstream keyer tied to the next transition" }
  tally.*.program:             { type: bool, description: "Source on program, keyed by source id, as the switcher computes it (keyers included)" }
  tally.*.preview:             { type: bool, description: "Source on preview" }
  macros.*.name:               { type: string, description: "Macro name, keyed by slot number from 1; only slots in use" }
  macro_running:               { type: int, description: "Slot number of the running macro; absent when none runs" }
  streaming.state:             { type: string, description: "idle, connecting, streaming or stopping" }
  recording.active:            { type: bool, description: "Recording" }
  recording.error:             { type: string, description: "none, no_media, media_full, media_error, media_unformatted, dropping_frames or unknown" }
  topology.dves:               { type: int, description: "Number of DVEs; set_dve_transition and the dve key type need one" }
  topology.stingers:           { type: int, description: "Number of stinger engines; set_stinger needs one" }
  topology.camera_control:     { type: bool, description: "The switcher passes camera control to Blackmagic cameras over SDI" }
  topology.stills:             { type: int, description: "Still slots in the media pool" }
  topology.clips:              { type: int, description: "Clip slots in the media pool; 0 means media players hold stills only" }
  topology.audio:              { type: string, description: "classic or fairlight: which audio mixer the switcher has" }
  mes.*.transition.selection:  { type: array, description: "Layers in the current transition: background, key1 to key4" }
  mes.*.transition.next_style: { type: string, description: "Style of the next transition" }
  mes.*.transition.next_selection: { type: array, description: "Layers the next transition takes: background, key1 to key4" }
  mes.*.transition.preview:    { type: bool, description: "Transition preview (PREV TRANS) on" }
  mes.*.transition.mix.rate:   { type: int, unit: frames, description: "Mix transition rate" }
  mes.*.transition.dip.rate:   { type: int, unit: frames, description: "Dip transition rate" }
  mes.*.transition.dip.source: { type: int, description: "Dip source id" }
  mes.*.transition.wipe.rate:  { type: int, unit: frames, description: "Wipe transition rate" }
  mes.*.transition.wipe.pattern: { type: string, description: "Wipe pattern, as set_wipe names them" }
  mes.*.transition.wipe.border_width: { type: float, unit: percent, description: "Wipe border width" }
  mes.*.transition.wipe.border_source: { type: int, description: "Wipe border fill source id" }
  mes.*.transition.wipe.symmetry: { type: float, unit: percent, description: "Wipe symmetry" }
  mes.*.transition.wipe.softness: { type: float, unit: percent, description: "Wipe softness" }
  mes.*.transition.wipe.x:     { type: float, description: "Wipe origin x, 0 to 1" }
  mes.*.transition.wipe.y:     { type: float, description: "Wipe origin y, 0 to 1" }
  mes.*.transition.wipe.reverse: { type: bool, description: "Wipe reversed" }
  mes.*.transition.wipe.flip_flop: { type: bool, description: "Wipe flip flop" }
  mes.*.transition.dve.rate:   { type: int, unit: frames, description: "DVE transition rate" }
  mes.*.transition.dve.style:  { type: string, description: "DVE transition style, as set_dve_transition names them" }
  mes.*.transition.dve.fill_source: { type: int, description: "DVE transition key fill source id" }
  mes.*.transition.dve.key_source: { type: int, description: "DVE transition key source id" }
  mes.*.transition.dve.enable_key: { type: bool, description: "DVE transition key on" }
  mes.*.transition.dve.pre_multiplied: { type: bool, description: "DVE transition key pre-multiplied" }
  mes.*.transition.dve.clip:   { type: float, unit: percent, description: "DVE transition key clip" }
  mes.*.transition.dve.gain:   { type: float, unit: percent, description: "DVE transition key gain" }
  mes.*.transition.dve.invert_key: { type: bool, description: "DVE transition key inverted" }
  mes.*.transition.dve.reverse: { type: bool, description: "DVE transition reversed" }
  mes.*.transition.dve.flip_flop: { type: bool, description: "DVE transition flip flop" }
  mes.*.transition.sting.media_player: { type: int, description: "Media player the stinger plays, from 1" }
  mes.*.transition.sting.pre_multiplied: { type: bool, description: "Stinger key pre-multiplied" }
  mes.*.transition.sting.clip: { type: float, unit: percent, description: "Stinger key clip" }
  mes.*.transition.sting.gain: { type: float, unit: percent, description: "Stinger key gain" }
  mes.*.transition.sting.invert: { type: bool, description: "Stinger key inverted" }
  mes.*.transition.sting.preroll: { type: int, unit: frames, description: "Stinger preroll" }
  mes.*.transition.sting.clip_duration: { type: int, unit: frames, description: "Stinger clip duration" }
  mes.*.transition.sting.trigger_point: { type: int, unit: frames, description: "Stinger trigger point" }
  mes.*.transition.sting.mix_rate: { type: int, unit: frames, description: "Stinger mix rate" }
  mes.*.fade_to_black.rate:    { type: int, unit: frames, description: "Fade to black rate" }
  mes.*.usk.*.type:            { type: string, description: "luma, chroma, pattern or dve" }
  mes.*.usk.*.can_fly:         { type: bool, description: "The keyer can fly (has a DVE)" }
  mes.*.usk.*.fly_enabled:     { type: bool, description: "Flying key on" }
  mes.*.usk.*.fill_source:     { type: int, description: "Keyer fill source id" }
  mes.*.usk.*.key_source:      { type: int, description: "Keyer key (cut) source id" }
  mes.*.usk.*.luma.pre_multiplied: { type: bool, description: "Luma key pre-multiplied" }
  mes.*.usk.*.luma.clip:       { type: float, unit: percent, description: "Luma key clip" }
  mes.*.usk.*.luma.gain:       { type: float, unit: percent, description: "Luma key gain" }
  mes.*.usk.*.luma.invert:     { type: bool, description: "Luma key inverted" }
  mes.*.usk.*.pattern.style:   { type: string, description: "Pattern key style, as set_usk_pattern names them" }
  mes.*.usk.*.pattern.size:    { type: float, unit: percent, description: "Pattern key size" }
  mes.*.usk.*.pattern.symmetry: { type: float, unit: percent, description: "Pattern key symmetry" }
  mes.*.usk.*.pattern.softness: { type: float, unit: percent, description: "Pattern key softness" }
  mes.*.usk.*.pattern.x:       { type: float, description: "Pattern key x, 0 to 1" }
  mes.*.usk.*.pattern.y:       { type: float, description: "Pattern key y, 0 to 1" }
  mes.*.usk.*.pattern.invert:  { type: bool, description: "Pattern key inverted" }
  mes.*.usk.*.mask.enabled:    { type: bool, description: "Upstream key mask on" }
  mes.*.usk.*.mask.top:        { type: float, description: "Upstream key mask top edge, -9 to 9" }
  mes.*.usk.*.mask.bottom:     { type: float, description: "Upstream key mask bottom edge, -9 to 9" }
  mes.*.usk.*.mask.left:       { type: float, description: "Upstream key mask left edge, -16 to 16" }
  mes.*.usk.*.mask.right:      { type: float, description: "Upstream key mask right edge, -16 to 16" }
  mes.*.usk.*.dve.size_x:      { type: float, description: "DVE key horizontal size, 1 is full frame" }
  mes.*.usk.*.dve.size_y:      { type: float, description: "DVE key vertical size, 1 is full frame" }
  mes.*.usk.*.dve.x:           { type: float, description: "DVE key horizontal position, 0 at the centre" }
  mes.*.usk.*.dve.y:           { type: float, description: "DVE key vertical position, 0 at the centre" }
  mes.*.usk.*.dve.rotation:    { type: float, unit: degrees, description: "DVE key rotation" }
