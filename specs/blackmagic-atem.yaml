quirks:
  - models: [all]
    severity: info
    text: >
      An ack means the switcher acknowledged the packet carrying the command,
      not that it applied it. The resulting change arrives as a state patch,
      for example the new program source after set_program.

  - models: [all]
    severity: info
    text: >
      Commands are checked against the switcher's own topology and source list,
      which it sends on connection. An M/E, aux, keyer, source or macro the
      switcher does not have fails as invalid parameters without being sent.

  - models: [all]
    severity: warning
    text: >
      Switchers accept only a handful of simultaneous connections (reported as
      about five on small and older models and eight or more on larger ones;
      Blackmagic does not document the number). A dropped connection holds its
      place until the switcher times it out. The core reconnects on a fresh
      socket after five seconds of silence.

  - models: [all]
    severity: info
    text: >
      The switcher is the source of tally: tally.* is its own calculation,
      including keyers and downstream keyers, not one derived from program and
      preview.

  - models: [all]
    severity: info
    text: >
      Streaming and recording need protocol 2.30 (firmware 8.1.1) or later and
      a model with a built-in encoder or recorder. Elsewhere those commands are
      refused as unsupported.

  - models: [all]
    severity: info
    text: >
      Setting commands send only the parameters given: the switcher applies the
      fields named in each command's mask and keeps the rest. A setting
      command with nothing to change fails as invalid parameters.

  - models: [all]
    severity: info
    text: >
      SuperSource commands change layout at protocol 2.28 (firmware 8.0), when
      a second SuperSource became possible; the layout follows the version the
      switcher reports. Before 2.28 only SuperSource 1 exists.

  - models: [all]
    severity: info
    text: >
      A switcher has either the classic audio mixer (set_audio_input,
      set_audio_master) or the Fairlight mixer (set_fairlight_source,
      set_fairlight_master, set_audio_levels); topology.audio says which, and
      the other mixer's commands are refused as unsupported. Only the Fairlight
      mixer sends meter levels, and only while asked; the sources document no
      level subscription for the classic mixer.

  - models: [all]
    severity: info
    text: >
      The switcher does not push streaming and recording durations. While
      streaming or recording, the core asks for them every 500 ms (SRDR and
      RMDR), as Companion does.

  - models: [all]
    severity: info
    text: >
      Camera commands reach Blackmagic cameras through the switcher's SDI
      outputs; the camera number is the input the camera is plugged into. The
      switcher acknowledges the command whether or not a camera is there, and
      reports what the camera applied as cameras.* state.

  - models: [atem-1-me-constellation-hd, atem-2-me-constellation-hd, atem-4-me-constellation-hd]
    severity: info
    text: >
      These models resend every multiviewer window's routing each frame. Only
      changes reach the state.

  - models: [all]
    severity: info
    text: >
      Media players, still and clip slots, keyers, SuperSource boxes, colour
      generators, multiviewer windows and audio inputs are checked against what
      the switcher reported on connection. Clip playback and stingers need a
      clip pool and a stinger engine (topology.clips, topology.stingers).

  - models: [all]
    severity: info
    text: >
      Keyer positions, sizes and masks use the switcher's own units: a size of
      1 is full frame, and positions and mask edges are 0 at the centre and
      about ±16 across and ±9 up and down at the frame's edges. A DVE position
      can be set well outside the frame (to ±1000), which is how a key is
      parked off screen.

  - models: [all]
    severity: info
    text: >
      Newer switchers have the advanced chroma keyer (set_usk_advanced_chroma,
      set_usk_chroma_sample), older ones the simpler chroma keyer
      (set_usk_chroma). The switcher reports only the one it has, as
      mes.*.usk.*.advanced_chroma or mes.*.usk.*.chroma, and acknowledges the
      other's commands without applying them.

  - models: [all]
    severity: info
    text: >
      Flying keys need a DVE and a keyer that can fly (mes.*.usk.*.can_fly);
      set_usk_dve, the keyframe commands and usk_fly_to are refused as
      unsupported on a switcher without a DVE and as invalid on a keyer that
      cannot fly.
