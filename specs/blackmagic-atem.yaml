      units, 0 at the centre and about ±16 wide by ±9 high at the edges. Give
      at least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      size_x: { type: float, min: 0.0, max: 99.99,
                label: Size X,
                description: "Horizontal size as a factor of the frame, 1 being full width." }
      size_y: { type: float, min: 0.0, max: 99.99,
                label: Size Y,
                description: "Vertical size as a factor of the frame, 1 being full height." }
      x: { type: float, min: -1000.0, max: 1000.0,
           label: Position X,
           description: "Horizontal position of the key's centre; 0 is the centre, about ±16 the frame's edges." }
      y: { type: float, min: -1000.0, max: 1000.0,
           label: Position Y,
           description: "Vertical position of the key's centre; 0 is the centre, about ±9 the frame's edges." }
      rotation: { type: float, min: -3600.0, max: 3600.0,
                  label: Rotation,
                  description: "Rotation in degrees; values past 360 turn more than once when flying." }
      border_enabled: { type: bool,
                        label: Border,
                        description: "Whether the key has a border." }
      shadow_enabled: { type: bool,
                        label: Drop shadow,
                        description: "Whether the key casts a drop shadow." }
      border_bevel: { type: enum, values: ["none", "in_out", "in", "out"],
                      label: Border bevel,
                      description: "Border bevel style: none, in and out, in, or out." }
      border_outer_width: { type: float, min: 0.0, max: 16.0,
                            label: Border outer width,
                            description: "Outer border width, 0 to 16." }
      border_inner_width: { type: float, min: 0.0, max: 16.0,
                            label: Border inner width,
                            description: "Inner border width, 0 to 16." }
      border_outer_softness: { type: int, min: 0, max: 100,
                               label: Border outer softness,
                               description: "Outer border softness in percent." }
      border_inner_softness: { type: int, min: 0, max: 100,
                               label: Border inner softness,
                               description: "Inner border softness in percent." }
      border_bevel_softness: { type: int, min: 0, max: 100,
                               label: Bevel softness,
                               description: "Bevel softness in percent." }
      border_bevel_position: { type: int, min: 0, max: 100,
                               label: Bevel position,
                               description: "Bevel position in percent." }
      border_opacity: { type: int, min: 0, max: 100,
                        label: Border opacity,
                        description: "Border opacity in percent." }
      border_hue: { type: float, min: 0.0, max: 359.9,
                    label: Border hue,
                    description: "Border colour hue in degrees." }
      border_saturation: { type: float, min: 0.0, max: 100.0,
                           label: Border saturation,
                           description: "Border colour saturation in percent." }
      border_luma: { type: float, min: 0.0, max: 100.0,
                     label: Border luma,
                     description: "Border colour luminance in percent." }
      light_direction: { type: float, min: 0.0, max: 359.9,
                         label: Light angle,
                         description: "Direction the light source shines from, in degrees, for the bevel and drop shadow." }
      light_altitude: { type: int, min: 10, max: 100,
                        label: Light altitude,
                        description: "Altitude of the light source, 10 to 100." }
      mask_enabled: { type: bool,
                      label: Mask,
                      description: "Whether the DVE's mask is on." }
      mask_top: { type: float, min: -9.0, max: 9.0,
                  label: Mask top,
                  description: "Top edge of the mask, -9 to 9." }
