      Clip and gain are percent. Give at least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      media_player: { type: int, min: 1, max: 4,
                      label: Media player,
                      description: "Media player that plays the stinger clip, numbered from 1." }
      pre_multiplied: { type: bool,
                        label: Pre-multiplied,
                        description: "Whether the key is pre-multiplied (the fill already shaped by the key); off uses clip and gain." }
      clip: { type: float, min: 0.0, max: 100.0,
              label: Clip,
              description: "Key clip level in percent, 0 to 100." }
      gain: { type: float, min: 0.0, max: 100.0,
              label: Gain,
              description: "Key gain in percent, 0 to 100." }
      invert: { type: bool,
                label: Invert key,
                description: "Whether the key signal is inverted." }
      preroll: { type: int, min: 0, max: 65535,
                 label: Preroll,
                 description: "Frames the clip plays before the transition starts." }
      clip_duration: { type: int, min: 0, max: 65535,
                       label: Clip duration,
                       description: "Length of the stinger clip in frames." }
      trigger_point: { type: int, min: 0, max: 65535,
                       label: Trigger point,
                       description: "Frame of the clip at which the background starts to mix." }
      mix_rate: { type: int, min: 0, max: 65535,
                  label: Mix rate,
                  description: "Duration of the background mix in frames." }
    returns: ack

  set_fade_to_black_rate:
