spec: 1
id: blackmagic-atem
name: Blackmagic ATEM switchers
vendor: Blackmagic Design
category: switcher
implementation: native
reason: >
  A proprietary UDP protocol with a session handshake, per-packet sequence
  numbers, acknowledgements and retransmission, carrying binary commands whose
  layout depends on the protocol version the switcher reports.

source:
  - title: Sofie atem-connection (v3.10.2, commit 6b91b9e)
    author: Norsk rikskringkasting AS
    url: https://github.com/Sofie-Automation/sofie-atem-connection
    note: >
      MIT-licensed; read as a reference, not copied. Packet header and flags,
      handshake, acknowledgement and retransmission behaviour, command layouts
      and their protocol-version boundaries. Its test captures of the initial
      state from 28 real switchers (ATEM Mini to Constellation, firmware 7.2 to
      10.1.1) confirm the dump starts with _ver and ends with InCm.
  - title: OpenSwitcher protocol documentation
    url: https://docs.openswitcher.org/udptransport.html
    note: >
      Documentation pages only (the transport description and field and command
      tables). No OpenSwitcher or pyatem source code was read.
  - title: Bitfocus Companion, companion-module-bmd-atem
    url: https://github.com/bitfocus/companion-module-bmd-atem
    note: MIT-licensed; source id numbering.
  - title: SKAARHOJ, BlackMagic ATEM Switcher Protocol (documentation page)
    note: >
      Protocol prose (CC BY-SA), used to corroborate command names. SKAARHOJ's
      GPL libraries were not read.

