      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      keyframe: { type: enum, values: [a, b], required: true,
                  label: Keyframe,
                  description: "Keyframe A or B to store the current settings in." }
    returns: ack

  usk_fly_to:
    summary: >
      Fly a key to keyframe A, B, full frame, or off to infinity in a
      direction, at the key's fly rate
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      keyframe: { type: enum, values: [a, b, full, infinite], required: true,
                  label: Run to,
                  description: "Keyframe A, B, full frame, or infinite (off frame in the direction given)." }
      direction:
        type: enum
        values: [centre_of_key, top_left, top_centre, top_right, middle_left,
                 middle_centre, middle_right, bottom_left, bottom_centre, bottom_right]
        label: Direction
        description: "Where an infinite run goes off frame; required with infinite and ignored otherwise."
    returns: ack

  set_usk_chroma:
    summary: >
      Set an upstream keyer's chroma key (the older chroma keyer): hue in
      degrees; gain, Y suppress and lift in percent; narrow range. Give at
      least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      hue: { type: float, min: 0.0, max: 359.9,
             label: Hue,
             description: "Hue of the key colour in degrees." }
      gain: { type: float, min: 0.0, max: 100.0,
              label: Gain,
              description: "Key gain in percent." }
      y_suppress: { type: float, min: 0.0, max: 100.0,
                    label: Y suppress,
                    description: "Luminance suppression in percent." }
      lift: { type: float, min: 0.0, max: 100.0,
              label: Lift,
              description: "Key lift in percent." }
      narrow: { type: bool,
                label: Narrow,
                description: "Whether the key uses a narrow chroma range." }
    returns: ack

  set_usk_advanced_chroma:
    summary: >
      Set an upstream keyer's advanced chroma key: key adjustments, chroma
      correction and colour adjustments, in percent. Give at least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      foreground_level: { type: float, min: 0.0, max: 100.0,
                          label: Foreground,
                          description: "Foreground level in percent." }
      background_level: { type: float, min: 0.0, max: 100.0,
                          label: Background,
                          description: "Background level in percent." }
      key_edge: { type: float, min: 0.0, max: 100.0,
                  label: Key edge,
                  description: "Key edge in percent." }
      spill_suppression: { type: float, min: 0.0, max: 100.0,
                           label: Spill suppression,
                           description: "Colour spill suppression in percent." }
      flare_suppression: { type: float, min: 0.0, max: 100.0,
                           label: Flare suppression,
                           description: "Flare suppression in percent." }
      brightness: { type: float, min: -100.0, max: 100.0,
                    label: Brightness,
                    description: "Foreground brightness adjustment, -100 to 100." }
      contrast: { type: float, min: -100.0, max: 100.0,
                  label: Contrast,
                  description: "Foreground contrast adjustment, -100 to 100." }
      saturation: { type: float, min: 0.0, max: 200.0,
                    label: Saturation,
                    description: "Foreground saturation in percent, 100 unchanged." }
      red: { type: float, min: -100.0, max: 100.0,
             label: Red,
             description: "Red adjustment, -100 to 100." }
      green: { type: float, min: -100.0, max: 100.0,
               label: Green,
               description: "Green adjustment, -100 to 100." }
      blue: { type: float, min: -100.0, max: 100.0,
              label: Blue,
              description: "Blue adjustment, -100 to 100." }
    returns: ack

  set_usk_chroma_sample:
    summary: >
      Set an advanced chroma key's sampling: the cursor and its size, the
      key preview, and the sampled colour as Y, Cb and Cr. Give at least one
      setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      cursor_enabled: { type: bool,
                        label: Cursor,
                        description: "Whether the sampling cursor shows on the preview." }
      preview: { type: bool,
                 label: Key preview,
                 description: "Whether the preview shows the key signal." }
      cursor_x: { type: float, min: -16.0, max: 16.0,
                  label: Cursor X,
                  description: "Horizontal position of the cursor, -16 to 16." }
      cursor_y: { type: float, min: -9.0, max: 9.0,
                  label: Cursor Y,
                  description: "Vertical position of the cursor, -9 to 9." }
      cursor_size: { type: float, min: 0.0, max: 100.0,
                     label: Cursor size,
                     description: "Size of the cursor in percent." }
      y: { type: float, min: 0.0, max: 1.0,
           label: Sampled Y,
           description: "Luminance of the sampled colour, 0 to 1." }
      cb: { type: float, min: -1.0, max: 1.0,
            label: Sampled Cb,
            description: "Blue-difference value of the sampled colour." }
      cr: { type: float, min: -1.0, max: 1.0,
            label: Sampled Cr,
            description: "Red-difference value of the sampled colour." }
    returns: ack

  reset_usk_advanced_chroma:
    summary: Reset parts of an advanced chroma key to their defaults. Give at least one part.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      key_adjustments: { type: bool, default: false,
                         label: Key adjustments,
                         description: "Reset the foreground, background, key edge and suppression levels." }
      chroma_correction: { type: bool, default: false,
                           label: Chroma correction,
                           description: "Reset the chroma correction (the sampled colour)." }
      color_adjustments: { type: bool, default: false,
                           label: Colour adjustments,
                           description: "Reset brightness, contrast, saturation and the red, green and blue adjustments." }
    returns: ack

  set_usk_mask:
    summary: >
      Set an upstream keyer's mask: on or off, and its edges (top and bottom
      -9 to 9, left and right -16 to 16). Give at least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
            label: M/E,
            description: "Mix effects bus, numbered from 1; 1 on single-M/E models." }
      keyer: { type: int, min: 1, max: 16, required: true,
               label: Keyer,
               description: "Upstream keyer on the M/E, numbered from 1." }
      enabled: { type: bool,
                 label: Mask,
                 description: "Whether the mask is on." }
      top: { type: float, min: -9.0, max: 9.0,
             label: Top,
             description: "Top edge of the mask, -9 to 9." }
      bottom: { type: float, min: -9.0, max: 9.0,
                label: Bottom,
                description: "Bottom edge of the mask, -9 to 9." }
      left: { type: float, min: -16.0, max: 16.0,
              label: Left,
              description: "Left edge of the mask, -16 to 16." }
      right: { type: float, min: -16.0, max: 16.0,
               label: Right,
               description: "Right edge of the mask, -16 to 16." }
    returns: ack

  set_dsk_mask:
    summary: >
      Set a downstream keyer's mask: on or off, and its edges (top and bottom
      -9 to 9, left and right -16 to 16). Give at least one setting.
    params:
      dsk: { type: int, min: 1, max: 4, required: true,
             label: DSK,
             description: "Downstream keyer, numbered from 1." }
      enabled: { type: bool,
                 label: Mask,
                 description: "Whether the mask is on." }
      top: { type: float, min: -9.0, max: 9.0,
             label: Top,
             description: "Top edge of the mask, -9 to 9." }
      bottom: { type: float, min: -9.0, max: 9.0,
                label: Bottom,
                description: "Bottom edge of the mask, -9 to 9." }
      left: { type: float, min: -16.0, max: 16.0,
              label: Left,
              description: "Left edge of the mask, -16 to 16." }
      right: { type: float, min: -16.0, max: 16.0,
               label: Right,
               description: "Right edge of the mask, -16 to 16." }
    returns: ack
  set_dsk_sources:
    summary: Set a downstream keyer's fill and key (cut) sources. Give at least one.
    params:
      dsk: { type: int, min: 1, max: 4, required: true,
             label: DSK,
             description: "Downstream keyer, numbered from 1." }
      fill: { type: int, min: 0, max: 65535,
              label: Fill source,
              description: "Fill source ID as listed in the sources state (e.g. 1 for input 1)." }
      key: { type: int, min: 0, max: 65535,
             label: Key source,
             description: "Key (cut) source ID as listed in the sources state (e.g. 1 for input 1)." }
    returns: ack

  set_dsk_tie:
    summary: Tie a downstream keyer to the next transition, or untie it
    params:
      dsk: { type: int, min: 1, max: 4, required: true,
             label: DSK,
             description: "Downstream keyer, numbered from 1." }
      tie: { type: bool, default: true,
             label: Tie,
             description: "True ties the downstream keyer to the next transition, false unties it." }
    returns: ack

  set_dsk_rate:
    summary: Set a downstream keyer's auto transition rate, in frames
    params:
      dsk: { type: int, min: 1, max: 4, required: true,
             label: DSK,
             description: "Downstream keyer, numbered from 1." }
      rate: { type: int, min: 1, max: 250, required: true,
              label: Rate,
              description: "Downstream keyer auto transition duration in frames." }
    returns: ack

  set_dsk_key:
    summary: Set a downstream keyer's key. Clip and gain are percent. Give at least one setting.
    params:
      dsk: { type: int, min: 1, max: 4, required: true,
             label: DSK,
             description: "Downstream keyer, numbered from 1." }
      pre_multiplied: { type: bool,
                        label: Pre-multiplied,
                        description: "Whether the key is pre-multiplied (the fill already shaped by the key); off uses clip and gain." }
      clip: { type: float, min: 0.0, max: 100.0,
              label: Clip,
              description: "Key clip level in percent, 0 to 100." }
      gain: { type: float, min: 0.0, max: 100.0,
              label: Gain,
              description: "Key gain in percent, 0 to 100." }
      invert: { type: bool,
                label: Invert key,
                description: "Whether the key signal is inverted." }
    returns: ack

  set_color_generator:
    summary: >
      Set a colour generator: hue in degrees, saturation and luma in percent.
      Give at least one.
    params:
      generator: { type: int, min: 1, max: 2, required: true,
                   label: Colour generator,
                   description: "Colour generator, 1 or 2." }
      hue: { type: float, min: 0.0, max: 359.9,
             label: Hue,
             description: "Hue in degrees, 0 to 359.9." }
      saturation: { type: float, min: 0.0, max: 100.0,
                    label: Saturation,
                    description: "Saturation in percent, 0 to 100." }
      luma: { type: float, min: 0.0, max: 100.0,
              label: Luma,
              description: "Luminance in percent, 0 to 100." }
    returns: ack

  set_media_player_source:
    summary: Load a still or a clip from the media pool into a media player. Give one of still or clip.
    params:
      player: { type: int, min: 1, max: 4, required: true,
                label: Media player,
                description: "Media player, numbered from 1." }
      still: { type: int, min: 1, max: 255,
               label: Still,
               description: "Still slot in the media pool, numbered from 1; give this or a clip." }
      clip: { type: int, min: 1, max: 255,
              label: Clip,
              description: "Clip slot in the media pool, numbered from 1; give this or a still." }
    returns: ack

  media_player_play:
    summary: Play the clip in a media player
    params:
      player: { type: int, min: 1, max: 4, required: true,
                label: Media player,
                description: "Media player, numbered from 1." }
    returns: ack

  media_player_stop:
    summary: Stop the clip in a media player, optionally returning to its first frame
    params:
      player: { type: int, min: 1, max: 4, required: true,
                label: Media player,
                description: "Media player, numbered from 1." }
      rewind: { type: bool, default: false,
                label: Rewind,
                description: "Whether to return to the clip's first frame when stopping." }
    returns: ack

  set_media_player_loop:
    summary: Loop the clip in a media player, or not
    params:
      player: { type: int, min: 1, max: 4, required: true,
                label: Media player,
                description: "Media player, numbered from 1." }
      loop: { type: bool, default: true,
              label: Loop,
              description: "True loops the clip, false plays it once." }
    returns: ack

  set_supersource_box:
    summary: >
      Set a SuperSource box: on, source, position (x -48 to 48, y -34 to 34),
      size (0.07 to 1) and crop (top and bottom 0 to 18, left and right 0 to
      32). Give at least one setting.
    params:
      supersource: { type: int, min: 1, max: 2, default: 1,
                     label: SuperSource,
                     description: "SuperSource, numbered from 1; 1 on models with one." }
      box: { type: int, min: 1, max: 4, required: true,
             label: Box,
             description: "SuperSource box, 1 to 4." }
      enabled: { type: bool,
                 label: "On",
                 description: "Whether the box is shown." }
      source: { type: int, min: 0, max: 65535,
                label: Source,
                description: "Video source ID as listed in the sources state (e.g. 1 for input 1) shown in the box." }
      x: { type: float, min: -48.0, max: 48.0,
           label: X position,
           description: "Horizontal position of the box's centre, -48 (left) to 48 (right)." }
      y: { type: float, min: -34.0, max: 34.0,
           label: Y position,
           description: "Vertical position of the box's centre, -34 (bottom) to 34 (top)." }
      size: { type: float, min: 0.07, max: 1.0,
              label: Size,
              description: "Box size, 0.07 to 1 (full frame)." }
      cropped: { type: bool,
                 label: Crop,
                 description: "Whether the box is cropped." }
      crop_top: { type: float, min: 0.0, max: 18.0,
                  label: Crop top,
                  description: "Top crop, 0 to 18." }
      crop_bottom: { type: float, min: 0.0, max: 18.0,
                     label: Crop bottom,
                     description: "Bottom crop, 0 to 18." }
      crop_left: { type: float, min: 0.0, max: 32.0,
                   label: Crop left,
                   description: "Left crop, 0 to 32." }
      crop_right: { type: float, min: 0.0, max: 32.0,
                    label: Crop right,
                    description: "Right crop, 0 to 32." }
    returns: ack

  set_supersource_art:
    summary: >
      Set a SuperSource's art: fill and key sources, in front of or behind the
      boxes, and its key. Clip and gain are percent. Give at least one setting.
    params:
      supersource: { type: int, min: 1, max: 2, default: 1,
                     label: SuperSource,
                     description: "SuperSource, numbered from 1; 1 on models with one." }
      fill: { type: int, min: 0, max: 65535,
              label: Fill source,
              description: "Fill source ID as listed in the sources state (e.g. 1 for input 1)." }
      key: { type: int, min: 0, max: 65535,
             label: Key source,
             description: "Key (cut) source ID as listed in the sources state (e.g. 1 for input 1)." }
      placement: { type: enum, values: [background, foreground],
                   label: Placement,
                   description: "Art in the background (behind the boxes) or foreground (in front of them)." }
      pre_multiplied: { type: bool,
                        label: Pre-multiplied,
                        description: "Whether the key is pre-multiplied (the fill already shaped by the key); off uses clip and gain." }
      clip: { type: float, min: 0.0, max: 100.0,
              label: Clip,
              description: "Key clip level in percent, 0 to 100." }
      gain: { type: float, min: 0.0, max: 100.0,
              label: Gain,
              description: "Key gain in percent, 0 to 100." }
      invert: { type: bool,
                label: Invert key,
                description: "Whether the key signal is inverted." }
    returns: ack

  set_audio_input:
    summary: >
      Classic audio mixer: set an input's mix option (off, on, audio follow
      video), gain in dB and balance. Inputs are numbered as in the
      audio.inputs state. Give at least one setting.
    params:
      input: { type: int, min: 0, max: 65535, required: true,
               label: Audio input,
               description: "Audio input number as in the audio.inputs state." }
      mix: { type: enum, values: ["off", "on", "afv"],
             label: Mix,
             description: "Off, on (always in the mix) or afv (audio follows video)." }
      gain: { type: float, min: -60.0, max: 6.0,
              label: Gain,
              description: "Input gain in dB, -60 to +6." }
      balance: { type: float, min: -50.0, max: 50.0,
                 label: Balance,
                 description: "Balance, -50 (left) to 50 (right); 0 is centre." }
      rca_to_xlr: { type: bool,
                    label: RCA to XLR,
                    description: "Whether an analogue input with the switch takes XLR rather than RCA." }
    returns: ack

  set_audio_master:
    summary: >
      Classic audio mixer master gain in dB, balance, and whether it follows
      fade to black. Give at least one.
    params:
      gain: { type: float, min: -60.0, max: 6.0,
              label: Gain,
              description: "Master gain in dB, -60 to +6." }
      balance: { type: float, min: -50.0, max: 50.0,
                 label: Balance,
                 description: "Master balance, -50 (left) to 50 (right); 0 is centre." }
      follow_fade_to_black: { type: bool,
                              label: Follow fade to black,
                              description: "Whether the master audio fades with fade to black." }
    returns: ack

  set_fairlight_source:
    summary: >
      Fairlight mixer: set a source's input gain and fader gain in dB, balance
      (-100 to 100), mix option (off mutes it), input delay, stereo
      simulation, equalizer on and gain, and dynamics make-up gain. Input and
      source are as in the fairlight.inputs state. Give at least one setting.
    params:
      input: { type: int, min: 0, max: 65535, required: true,
               label: Audio input,
               description: "Fairlight audio input number as in the fairlight.inputs state." }
      source: { type: int, required: true,
                label: Audio source,
                description: "Source of the input (e.g. a channel of a stereo pair), as in the fairlight.inputs state." }
      gain: { type: float, min: -100.0, max: 6.0,
              label: Input gain,
              description: "Input gain in dB, -100 to +6." }
      fader_gain: { type: float, min: -100.0, max: 10.0,
                    label: Fader,
                    description: "Fader gain in dB, -100 to +10." }
      balance: { type: float, min: -100.0, max: 100.0,
                 label: Balance,
                 description: "Balance, -100 (left) to 100 (right); 0 is centre." }
      mix: { type: enum, values: ["off", "on", "afv"],
             label: Mix,
             description: "Off (muted), on, or afv (audio follows video)." }
      frames_delay: { type: int, min: 0, max: 255,
                      label: Delay,
                      description: "Input delay in frames, up to the source's max_frames_delay." }
      stereo_simulation: { type: float, min: 0.0, max: 100.0,
                           label: Stereo simulation,
                           description: "Stereo simulation in percent, on sources that offer it." }
      eq_enabled: { type: bool,
                    label: EQ on,
                    description: "Whether the source's equalizer is on." }
      eq_gain: { type: float, min: -20.0, max: 20.0,
                 label: EQ gain,
                 description: "Equalizer make-up gain in dB." }
      make_up_gain: { type: float, min: 0.0, max: 20.0,
                      label: Dynamics make-up gain,
                      description: "Dynamics make-up gain in dB." }
    returns: ack

  set_fairlight_master:
    summary: >
      Fairlight mixer master fader gain in dB, whether it follows fade to
      black, equalizer on and gain, and dynamics make-up gain. Give at least
      one.
    params:
      eq_enabled: { type: bool,
                    label: EQ on,
                    description: "Whether the master equalizer is on." }
      eq_gain: { type: float, min: -20.0, max: 20.0,
                 label: EQ gain,
                 description: "Master equalizer make-up gain in dB." }
      make_up_gain: { type: float, min: 0.0, max: 20.0,
                      label: Dynamics make-up gain,
                      description: "Master dynamics make-up gain in dB." }
      fader_gain: { type: float, min: -100.0, max: 10.0,
                    label: Fader,
                    description: "Master fader gain in dB, -100 to +10." }
      follow_fade_to_black: { type: bool,
                              label: Follow fade to black,
                              description: "Whether the master audio fades with fade to black." }
    returns: ack

  set_audio_levels:
    summary: >
      Ask the Fairlight mixer to send its meter levels, or stop. They arrive
      many times a second as fairlight.*.level state while on.
    params:
      enabled: { type: bool, default: true,
                 label: Send levels,
                 description: "True asks the mixer to send meter levels many times a second, false stops them." }
    returns: ack

  set_fairlight_input:
    summary: >
      Fairlight mixer: set an input's channel configuration (mono, stereo or
      dual mono) and its analogue input level. Inputs are as in the
      fairlight.inputs state; configurations and input_levels there list what
      each input offers. Give at least one setting.
    params:
      input: { type: int, min: 0, max: 65535, required: true,
               label: Audio input,
               description: "Fairlight audio input number as in the fairlight.inputs state." }
      configuration: { type: enum, values: [mono, stereo, dual_mono],
                       label: Configuration,
                       description: "Channel configuration: mono, stereo, or dual mono (a stereo pair split into two sources)." }
      input_level: { type: enum, values: [microphone, consumer_line, pro_line],
                     label: Input level,
                     description: "Analogue input level: microphone, consumer line or pro line." }
    returns: ack

  set_fairlight_eq_band:
    summary: >
      Fairlight mixer: set one band of a source's equalizer: on or off, shape,
      frequency range, frequency in Hz, gain in dB and Q. Bands are numbered
      from 1 as in the source's equalizer.bands state. Give at least one
      setting.
    params:
      input: { type: int, min: 0, max: 65535, required: true,
               label: Audio input,
               description: "Fairlight audio input number as in the fairlight.inputs state." }
      source: { type: int, required: true,
                label: Audio source,
                description: "Source of the input (e.g. a channel of a stereo pair), as in the fairlight.inputs state." }
      band: { type: int, min: 1, max: 6, required: true,
              label: Band,
              description: "Equalizer band, numbered from 1." }
      enabled: { type: bool,
                 label: Band on,
                 description: "Whether the band is on." }
      shape: { type: enum, values: [low_shelf, low_pass, bell, notch, high_pass, high_shelf],
               label: Shape,
               description: "Filter shape; the band's shapes state lists the ones it offers." }
      frequency_range: { type: int, min: 1, max: 128,
                         label: Frequency range,
                         description: "Frequency range, one of the values in the band's frequency_ranges state." }
      frequency: { type: int, min: 20, max: 22000,
                   label: Frequency,
                   description: "Band frequency in hertz." }
      gain: { type: float, min: -20.0, max: 20.0,
              label: Gain,
              description: "Band gain in dB." }
      q: { type: float, min: 0.3, max: 10.3,
           label: Q,
           description: "Band Q factor (width)." }
    returns: ack

  set_fairlight_master_eq_band:
    summary: >
      Fairlight mixer: set one band of the master equalizer, as
      set_fairlight_eq_band does for a source. Give at least one setting.
    params:
      band: { type: int, min: 1, max: 6, required: true,
              label: Band,
              description: "Equalizer band, numbered from 1." }
      enabled: { type: bool,
                 label: Band on,
                 description: "Whether the band is on." }
      shape: { type: enum, values: [low_shelf, low_pass, bell, notch, high_pass, high_shelf],
               label: Shape,
               description: "Filter shape; the band's shapes state lists the ones it offers." }
      frequency_range: { type: int, min: 1, max: 128,
                         label: Frequency range,
                         description: "Frequency range, one of the values in the band's frequency_ranges state." }
      frequency: { type: int, min: 20, max: 22000,
                   label: Frequency,
                   description: "Band frequency in hertz." }
      gain: { type: float, min: -20.0, max: 20.0,
              label: Gain,
              description: "Band gain in dB." }
      q: { type: float, min: 0.3, max: 10.3,
           label: Q,
           description: "Band Q factor (width)." }
    returns: ack

  set_fairlight_compressor:
    summary: >
      Fairlight mixer: set a source's compressor: on or off, threshold in dB,
      ratio (2 is 2:1), attack, hold and release in milliseconds. Give at
      least one setting.
    params:
      input: { type: int, min: 0, max: 65535, required: true,
               label: Audio input,
               description: "Fairlight audio input number as in the fairlight.inputs state." }
      source: { type: int, required: true,
                label: Audio source,
                description: "Source of the input (e.g. a channel of a stereo pair), as in the fairlight.inputs state." }
      enabled: { type: bool,
                 label: Compressor on,
                 description: "Whether the compressor is on." }
      threshold: { type: float, min: -50.0, max: 0.0,
                   label: Threshold,
                   description: "Threshold in dB." }
      ratio: { type: float, min: 1.0, max: 20.0,
               label: Ratio,
               description: "Compression ratio, e.g. 2 for 2:1." }
      attack: { type: float, min: 0.0, max: 100.0,
                label: Attack,
                description: "Attack time in milliseconds." }
      hold: { type: float, min: 0.0, max: 4000.0,
              label: Hold,
              description: "Hold time in milliseconds." }
      release: { type: float, min: 0.0, max: 4000.0,
                 label: Release,
                 description: "Release time in milliseconds." }
    returns: ack

  set_fairlight_limiter:
    summary: >
      Fairlight mixer: set a source's limiter: on or off, threshold in dB,
      attack, hold and release in milliseconds. Give at least one setting.
    params:
      input: { type: int, min: 0, max: 65535, required: true,
               label: Audio input,
               description: "Fairlight audio input number as in the fairlight.inputs state." }
      source: { type: int, required: true,
                label: Audio source,
                description: "Source of the input (e.g. a channel of a stereo pair), as in the fairlight.inputs state." }
      enabled: { type: bool,
                 label: Limiter on,
                 description: "Whether the limiter is on." }
      threshold: { type: float, min: -50.0, max: 0.0,
                   label: Threshold,
                   description: "Threshold in dB." }
      attack: { type: float, min: 0.0, max: 100.0,
                label: Attack,
                description: "Attack time in milliseconds." }
      hold: { type: float, min: 0.0, max: 4000.0,
              label: Hold,
              description: "Hold time in milliseconds." }
      release: { type: float, min: 0.0, max: 4000.0,
                 label: Release,
                 description: "Release time in milliseconds." }
    returns: ack

  set_fairlight_expander:
    summary: >
      Fairlight mixer: set a source's expander or gate: on or off, gate mode,
      threshold and range in dB, ratio, attack, hold and release in
      milliseconds. Give at least one setting.
    params:
      input: { type: int, min: 0, max: 65535, required: true,
               label: Audio input,
               description: "Fairlight audio input number as in the fairlight.inputs state." }
      source: { type: int, required: true,
                label: Audio source,
                description: "Source of the input (e.g. a channel of a stereo pair), as in the fairlight.inputs state." }
      enabled: { type: bool,
                 label: Expander on,
                 description: "Whether the expander or gate is on." }
      gate: { type: bool,
              label: Gate,
              description: "True works as a gate, false as an expander." }
      threshold: { type: float, min: -50.0, max: 0.0,
                   label: Threshold,
                   description: "Threshold in dB." }
      range: { type: float, min: 0.0, max: 60.0,
               label: Range,
               description: "Range (maximum attenuation) in dB." }
      ratio: { type: float, min: 1.0, max: 10.0,
               label: Ratio,
               description: "Expansion ratio, e.g. 2 for 1:2." }
      attack: { type: float, min: 0.0, max: 100.0,
                label: Attack,
                description: "Attack time in milliseconds." }
      hold: { type: float, min: 0.0, max: 4000.0,
              label: Hold,
              description: "Hold time in milliseconds." }
      release: { type: float, min: 0.0, max: 4000.0,
                 label: Release,
                 description: "Release time in milliseconds." }
    returns: ack

  set_fairlight_master_compressor:
    summary: Fairlight mixer master compressor, as set_fairlight_compressor. Give at least one setting.
    params:
      enabled: { type: bool,
                 label: Compressor on,
                 description: "Whether the compressor is on." }
      threshold: { type: float, min: -50.0, max: 0.0,
                   label: Threshold,
                   description: "Threshold in dB." }
      ratio: { type: float, min: 1.0, max: 20.0,
               label: Ratio,
               description: "Compression ratio, e.g. 2 for 2:1." }
      attack: { type: float, min: 0.0, max: 100.0,
                label: Attack,
                description: "Attack time in milliseconds." }
      hold: { type: float, min: 0.0, max: 4000.0,
              label: Hold,
              description: "Hold time in milliseconds." }
      release: { type: float, min: 0.0, max: 4000.0,
                 label: Release,
                 description: "Release time in milliseconds." }
    returns: ack

  set_fairlight_master_limiter:
    summary: Fairlight mixer master limiter, as set_fairlight_limiter. Give at least one setting.
    params:
      enabled: { type: bool,
                 label: Limiter on,
                 description: "Whether the limiter is on." }
      threshold: { type: float, min: -50.0, max: 0.0,
                   label: Threshold,
                   description: "Threshold in dB." }
      attack: { type: float, min: 0.0, max: 100.0,
                label: Attack,
                description: "Attack time in milliseconds." }
      hold: { type: float, min: 0.0, max: 4000.0,
              label: Hold,
              description: "Hold time in milliseconds." }
      release: { type: float, min: 0.0, max: 4000.0,
                 label: Release,
                 description: "Release time in milliseconds." }
    returns: ack

  reset_fairlight_eq:
    summary: "Fairlight mixer: reset a source's whole equalizer, or one band of it, to its defaults"
    params:
      input: { type: int, min: 0, max: 65535, required: true,
               label: Audio input,
               description: "Fairlight audio input number as in the fairlight.inputs state." }
      source: { type: int, required: true,
                label: Audio source,
                description: "Source of the input (e.g. a channel of a stereo pair), as in the fairlight.inputs state." }
      band: { type: int, min: 1, max: 6,
              label: Band,
              description: "The one band to reset, numbered from 1; not given resets the whole equalizer." }
    returns: ack

  reset_fairlight_master_eq:
    summary: "Fairlight mixer: reset the master equalizer, or one band of it, to its defaults"
    params:
      band: { type: int, min: 1, max: 6,
              label: Band,
              description: "The one band to reset, numbered from 1; not given resets the whole equalizer." }
    returns: ack

  reset_fairlight_dynamics:
    summary: "Fairlight mixer: reset parts of a source's dynamics to their defaults. Give at least one part."
    params:
      input: { type: int, min: 0, max: 65535, required: true,
               label: Audio input,
               description: "Fairlight audio input number as in the fairlight.inputs state." }
      source: { type: int, required: true,
                label: Audio source,
                description: "Source of the input (e.g. a channel of a stereo pair), as in the fairlight.inputs state." }
      dynamics: { type: bool, default: false,
                  label: All dynamics,
                  description: "Reset the whole dynamics section, including the make-up gain." }
      expander: { type: bool, default: false,
                  label: Expander,
                  description: "Reset the expander or gate." }
      compressor: { type: bool, default: false,
                    label: Compressor,
                    description: "Reset the compressor." }
      limiter: { type: bool, default: false,
                 label: Limiter,
                 description: "Reset the limiter." }
    returns: ack

  reset_fairlight_master_dynamics:
    summary: "Fairlight mixer: reset parts of the master dynamics to their defaults. Give at least one part."
    params:
      dynamics: { type: bool, default: false,
                  label: All dynamics,
                  description: "Reset the whole dynamics section, including the make-up gain." }
      expander: { type: bool, default: false,
                  label: Expander,
                  description: "Reset the expander." }
      compressor: { type: bool, default: false,
                    label: Compressor,
                    description: "Reset the compressor." }
      limiter: { type: bool, default: false,
                 label: Limiter,
                 description: "Reset the limiter." }
    returns: ack

  reset_fairlight_peaks:
    summary: "Fairlight mixer: reset the peak meters of every source, of the master, or both. Give at least one."
    params:
      all: { type: bool, default: false,
             label: All sources,
             description: "Reset every source's peak meters." }
      master: { type: bool, default: false,
                label: Master,
                description: "Reset the master's peak meters." }
    returns: ack

  reset_fairlight_source_peaks:
    summary: "Fairlight mixer: reset one source's peak meters. Give at least one meter."
    params:
      input: { type: int, min: 0, max: 65535, required: true,
               label: Audio input,
               description: "Fairlight audio input number as in the fairlight.inputs state." }
      source: { type: int, required: true,
                label: Audio source,
                description: "Source of the input (e.g. a channel of a stereo pair), as in the fairlight.inputs state." }
      dynamics_input: { type: bool, default: false,
                        label: Dynamics input,
                        description: "Reset the peaks before the dynamics." }
      dynamics_output: { type: bool, default: false,
                         label: Dynamics output,
                         description: "Reset the peaks after the dynamics." }
      output: { type: bool, default: false,
                label: Output,
                description: "Reset the peaks after the fader." }
    returns: ack

  set_fairlight_audio_follow_video:
    summary: "Fairlight mixer: whether audio crossfades with video transitions (audio follow video)"
    params:
      enabled: { type: bool, default: true,
                 label: Audio follow video,
                 description: "True makes audio-follow-video sources crossfade with the transition, false cuts them." }
    returns: ack

  set_fairlight_monitor:
    summary: >
      Fairlight mixer: set the monitor and headphone output: its gain, and the
      level and mute of the program, talkback and sidetone feeding it, in dB.
      Give at least one setting.
    params:
      gain: { type: float, min: -60.0, max: 6.0,
              label: Monitor gain,
              description: "Monitor output gain in dB." }
      master_gain: { type: float, min: -60.0, max: 6.0,
                     label: Program level,
                     description: "Level of the program mix in the monitor, in dB." }
      master_muted: { type: bool,
                      label: Program muted,
                      description: "Whether the program mix is muted in the monitor." }
      talkback_gain: { type: float, min: -60.0, max: 6.0,
                       label: Talkback level,
                       description: "Level of talkback in the monitor, in dB." }
      talkback_muted: { type: bool,
                        label: Talkback muted,
                        description: "Whether talkback is muted in the monitor." }
      sidetone_gain: { type: float, min: -60.0, max: 6.0,
                       label: Sidetone level,
                       description: "Level of the sidetone (your own talkback) in dB." }
    returns: ack

  set_fairlight_solo:
    summary: >
      Fairlight mixer: solo a source to the monitor and headphones, or end the
      solo. Give enabled, the source (input and source together), or both.
    params:
      enabled: { type: bool,
                 label: Solo,
                 description: "Whether a source is soloed." }
      input: { type: int, min: 0, max: 65535,
               label: Audio input,
               description: "Fairlight audio input of the source to solo, as in the fairlight.inputs state." }
      source: { type: int,
                label: Audio source,
                description: "Source of that input to solo, as in the fairlight.inputs state." }
    returns: ack

  set_audio_routing_output:
    summary: >
      Fairlight audio routing: route a source to an audio output, rename the
      output, or both. Outputs and sources are keyed by id in the
      fairlight.routing state. Give a source or a name.
    params:
      output: { type: int, min: 0, max: 4294967295, required: true,
                label: Output,
                description: "Audio output id, as a key of fairlight.routing.outputs." }
      source: { type: int, min: 0, max: 4294967295,
                label: Source,
                description: "Audio source id to route, as a key of fairlight.routing.sources." }
      name: { type: string, max_length: 63,
              label: Name,
              description: "New name for the output." }
    returns: ack

  set_audio_routing_source:
    summary: "Fairlight audio routing: rename an audio source"
    params:
      source: { type: int, min: 0, max: 4294967295, required: true,
                label: Source,
                description: "Audio source id, as a key of fairlight.routing.sources." }
      name: { type: string, max_length: 63, required: true,
              label: Name,
              description: "New name for the source." }
    returns: ack

  set_audio_monitor:
    summary: >
      Classic audio mixer: set the monitor output: on, gain in dB, mute, solo
      and the soloed input, dim and dim level in percent. Give at least one
      setting.
    params:
      enabled: { type: bool,
                 label: Monitor on,
                 description: "Whether the monitor output is on." }
      gain: { type: float, min: -60.0, max: 6.0,
              label: Gain,
              description: "Monitor gain in dB." }
      mute: { type: bool,
              label: Mute,
              description: "Whether the monitor is muted." }
      solo: { type: bool,
              label: Solo,
              description: "Whether the monitor solos one input." }
      solo_input: { type: int, min: 0, max: 65535,
                    label: Solo input,
                    description: "Audio input soloed, as in the audio.inputs state." }
      dim: { type: bool,
             label: Dim,
             description: "Whether the monitor is dimmed." }
      dim_level: { type: float, min: 0.0, max: 100.0,
                   label: Dim level,
                   description: "Dim level in percent." }
    returns: ack

  set_audio_headphones:
    summary: >
      Classic audio mixer: set the headphone output's gain and its program,
      talkback and sidetone levels, in dB. Give at least one.
    params:
      gain: { type: float, min: -60.0, max: 6.0,
              label: Gain,
              description: "Headphone gain in dB." }
      program_out_gain: { type: float, min: -60.0, max: 6.0,
                          label: Program level,
                          description: "Level of the program mix in the headphones, in dB." }
      talkback_gain: { type: float, min: -60.0, max: 6.0,
                       label: Talkback level,
                       description: "Level of talkback in the headphones, in dB." }
      sidetone_gain: { type: float, min: -60.0, max: 6.0,
                       label: Sidetone level,
                       description: "Level of the sidetone in the headphones, in dB." }
    returns: ack

  set_audio_follow_video:
    summary: "Classic audio mixer: whether audio crossfades with video transitions (audio follow video)"
    params:
      enabled: { type: bool, default: true,
                 label: Audio follow video,
                 description: "True makes audio-follow-video inputs crossfade with the transition, false cuts them." }
    returns: ack

  reset_audio_peaks:
    summary: "Classic audio mixer: reset peak meters. Give at least one."
    params:
      all: { type: bool, default: false,
             label: All,
             description: "Reset every peak meter." }
      input: { type: int, min: 0, max: 65535,
               label: Input,
               description: "Reset this audio input's peak meters, as in the audio.inputs state." }
      master: { type: bool, default: false,
                label: Master,
                description: "Reset the master's peak meters." }
      monitor: { type: bool, default: false,
                 label: Monitor,
                 description: "Reset the monitor's peak meters." }
    returns: ack
  set_multiviewer_window:
    summary: Route a source to a multiviewer window. Windows are as in the multiviewers state.
    params:
      multiviewer: { type: int, min: 1, max: 4, required: true,
                     label: Multiviewer,
                     description: "Multiviewer output, numbered from 1." }
      window: { type: int, min: 1, max: 16, required: true,
                label: Window,
                description: "Multiviewer window, numbered as in the multiviewers state." }
      source: { type: int, min: 0, max: 65535, required: true,
                label: Source,
                description: "Video source ID as listed in the sources state (e.g. 1 for input 1) shown in the window." }
    returns: ack

  set_input_name:
    summary: Rename a source. Give at least one name.
    params:
      source: { type: int, min: 0, max: 65535, required: true,
                label: Source,
                description: "Video source ID as listed in the sources state (e.g. 1 for input 1) to rename." }
      long_name: { type: string, max_length: 20,
                   label: Long name,
                   description: "Long name, up to 20 characters." }
      short_name: { type: string, max_length: 4,
                    label: Short name,
                    description: "Short name shown on buttons, up to 4 characters." }
    returns: ack

  continue_macro:
    summary: Continue a macro waiting at a user wait
    returns: ack

  set_macro_loop:
    summary: Loop the running macro, or not
    params:
      loop: { type: bool, default: true,
              label: Loop,
              description: "True loops the running macro, false stops looping." }
    returns: ack

  set_streaming_service:
    summary: >
      Set the streaming service name, server URL, stream key and the low and
      high quality video bitrates. Give at least one. The key is never
      reported back in the state.
    params:
      service_name: { type: string, max_length: 63,
                      label: Service,
                      description: "Streaming service name, e.g. YouTube." }
      url: { type: string, max_length: 511,
             label: Server URL,
             description: "Streaming server URL, e.g. rtmp://a.rtmp.youtube.com/live2." }
      key: { type: string, max_length: 511,
             label: Stream key,
             description: "Stream key; it is never reported back in the state." }
      low_bitrate: { type: int, min: 0, max: 4294967295,
                     label: Low video bitrate,
                     description: "Video bitrate for the low quality, in bits per second." }
      high_bitrate: { type: int, min: 0, max: 4294967295,
                      label: High video bitrate,
                      description: "Video bitrate for the high quality, in bits per second." }
    returns: ack

  capture_still:
    summary: Capture the program output as a still in the media pool's first free slot
    returns: ack

  clear_still:
    summary: Clear a still slot in the media pool
    params:
      still: { type: int, min: 1, max: 255, required: true,
               label: Still,
               description: "Still slot in the media pool, numbered from 1." }
    returns: ack

  clear_clip:
    summary: Clear a clip slot in the media pool
    params:
      clip: { type: int, min: 1, max: 4, required: true,
              label: Clip,
              description: "Clip slot in the media pool, numbered from 1." }
    returns: ack

  set_clip:
    summary: >
      Name a clip slot and set its length in frames, as the switcher does
      before a clip's frames are uploaded
    params:
      clip: { type: int, min: 1, max: 4, required: true,
              label: Clip,
              description: "Clip slot in the media pool, numbered from 1." }
      name: { type: string, max_length: 43, required: true,
              label: Name,
              description: "Clip name, up to 43 characters." }
      frames: { type: int, min: 0, max: 65535, required: true,
                label: Frames,
                description: "Number of frames in the clip." }
    returns: ack

  set_clip_lengths:
    summary: >
      Share the clip memory between the clip slots: the most frames each clip
      can hold. Clips not given keep their length. Protocol 2.28 and later.
    params:
      clip1: { type: int, min: 0, max: 65535,
               label: Clip 1 frames,
               description: "Most frames clip 1 can hold." }
      clip2: { type: int, min: 0, max: 65535,
               label: Clip 2 frames,
               description: "Most frames clip 2 can hold." }
      clip3: { type: int, min: 0, max: 65535,
               label: Clip 3 frames,
               description: "Most frames clip 3 can hold." }
      clip4: { type: int, min: 0, max: 65535,
               label: Clip 4 frames,
               description: "Most frames clip 4 can hold." }
    returns: ack

  set_recording:
    summary: >
      Set the recording file name, the two working-set disks (ids as in the
