                label: Dip source,
                description: "Video source ID as listed in the sources state (e.g. 1 for input 1) to dip through." }
    returns: ack

  set_wipe:
    summary: >
      Set the wipe transition. Width, symmetry and softness are percent; x and
      y place the wipe's origin from 0 to 1. Give at least one setting.
    params:
      me: { type: int, min: 1, max: 4, default: 1,
