                 label: Mask,
                 description: "Whether the mask is on." }
      top: { type: float, min: -9.0, max: 9.0,
             label: Top,
             description: "Top edge of the mask, -9 to 9." }
      bottom: { type: float, min: -9.0, max: 9.0,
                label: Bottom,
                description: "Bottom edge of the mask, -9 to 9." }
      left: { type: float, min: -16.0, max: 16.0,
              label: Left,
              description: "Left edge of the mask, -16 to 16." }
      right: { type: float, min: -16.0, max: 16.0,
               label: Right,
               description: "Right edge of the mask, -16 to 16." }
    returns: ack
  set_dsk_sources:
    summary: Set a downstream keyer's fill and key (cut) sources. Give at least one.
    params:
      dsk: { type: int, min: 1, max: 4, required: true,
             label: DSK,
             description: "Downstream keyer, numbered from 1." }
      fill: { type: int, min: 0, max: 65535,
              label: Fill source,
              description: "Fill source ID as listed in the sources state (e.g. 1 for input 1)." }
      key: { type: int, min: 0, max: 65535,
             label: Key source,
             description: "Key (cut) source ID as listed in the sources state (e.g. 1 for input 1)." }
    returns: ack

  set_dsk_tie:
    summary: Tie a downstream keyer to the next transition, or untie it
    params:
      dsk: { type: int, min: 1, max: 4, required: true,
             label: DSK,
             description: "Downstream keyer, numbered from 1." }
      tie: { type: bool, default: true,
             label: Tie,
             description: "True ties the downstream keyer to the next transition, false unties it." }
    returns: ack

  set_dsk_rate:
    summary: Set a downstream keyer's auto transition rate, in frames
    params:
      dsk: { type: int, min: 1, max: 4, required: true,
             label: DSK,
             description: "Downstream keyer, numbered from 1." }
      rate: { type: int, min: 1, max: 250, required: true,
              label: Rate,
              description: "Downstream keyer auto transition duration in frames." }
    returns: ack

  set_dsk_key:
    summary: Set a downstream keyer's key. Clip and gain are percent. Give at least one setting.
    params:
      dsk: { type: int, min: 1, max: 4, required: true,
             label: DSK,
             description: "Downstream keyer, numbered from 1." }
      pre_multiplied: { type: bool,
                        label: Pre-multiplied,
                        description: "Whether the key is pre-multiplied (the fill already shaped by the key); off uses clip and gain." }
      clip: { type: float, min: 0.0, max: 100.0,
              label: Clip,
              description: "Key clip level in percent, 0 to 100." }
      gain: { type: float, min: 0.0, max: 100.0,
              label: Gain,
              description: "Key gain in percent, 0 to 100." }
      invert: { type: bool,
                label: Invert key,
                description: "Whether the key signal is inverted." }
    returns: ack

  set_color_generator:
    summary: >
      Set a colour generator: hue in degrees, saturation and luma in percent.
      Give at least one.
    params:
      generator: { type: int, min: 1, max: 2, required: true,
                   label: Colour generator,
                   description: "Colour generator, 1 or 2." }
      hue: { type: float, min: 0.0, max: 359.9,
             label: Hue,
             description: "Hue in degrees, 0 to 359.9." }
      saturation: { type: float, min: 0.0, max: 100.0,
                    label: Saturation,
                    description: "Saturation in percent, 0 to 100." }
      luma: { type: float, min: 0.0, max: 100.0,
              label: Luma,
              description: "Luminance in percent, 0 to 100." }
    returns: ack

  set_media_player_source:
    summary: Load a still or a clip from the media pool into a media player. Give one of still or clip.
    params:
      player: { type: int, min: 1, max: 4, required: true,
                label: Media player,
                description: "Media player, numbered from 1." }
      still: { type: int, min: 1, max: 255,
               label: Still,
               description: "Still slot in the media pool, numbered from 1; give this or a clip." }
      clip: { type: int, min: 1, max: 255,
              label: Clip,
              description: "Clip slot in the media pool, numbered from 1; give this or a still." }
    returns: ack

  media_player_play:
    summary: Play the clip in a media player
    params:
      player: { type: int, min: 1, max: 4, required: true,
                label: Media player,
                description: "Media player, numbered from 1." }
    returns: ack

  media_player_stop:
    summary: Stop the clip in a media player, optionally returning to its first frame
    params:
      player: { type: int, min: 1, max: 4, required: true,
                label: Media player,
                description: "Media player, numbered from 1." }
      rewind: { type: bool, default: false,
                label: Rewind,
                description: "Whether to return to the clip's first frame when stopping." }
    returns: ack

  set_media_player_loop:
    summary: Loop the clip in a media player, or not
    params:
      player: { type: int, min: 1, max: 4, required: true,
                label: Media player,
                description: "Media player, numbered from 1." }
      loop: { type: bool, default: true,
              label: Loop,
              description: "True loops the clip, false plays it once." }
    returns: ack

  set_supersource_box:
    summary: >
      Set a SuperSource box: on, source, position (x -48 to 48, y -34 to 34),
      size (0.07 to 1) and crop (top and bottom 0 to 18, left and right 0 to
      32). Give at least one setting.
    params:
      supersource: { type: int, min: 1, max: 2, default: 1,
                     label: SuperSource,
                     description: "SuperSource, numbered from 1; 1 on models with one." }
      box: { type: int, min: 1, max: 4, required: true,
             label: Box,
             description: "SuperSource box, 1 to 4." }
      enabled: { type: bool,
                 label: "On",
                 description: "Whether the box is shown." }
      source: { type: int, min: 0, max: 65535,
                label: Source,
                description: "Video source ID as listed in the sources state (e.g. 1 for input 1) shown in the box." }
      x: { type: float, min: -48.0, max: 48.0,
           label: X position,
           description: "Horizontal position of the box's centre, -48 (left) to 48 (right)." }
      y: { type: float, min: -34.0, max: 34.0,
           label: Y position,
           description: "Vertical position of the box's centre, -34 (bottom) to 34 (top)." }
      size: { type: float, min: 0.07, max: 1.0,
              label: Size,
              description: "Box size, 0.07 to 1 (full frame)." }
      cropped: { type: bool,
                 label: Crop,
                 description: "Whether the box is cropped." }
      crop_top: { type: float, min: 0.0, max: 18.0,
                  label: Crop top,
                  description: "Top crop, 0 to 18." }
      crop_bottom: { type: float, min: 0.0, max: 18.0,
                     label: Crop bottom,
                     description: "Bottom crop, 0 to 18." }
      crop_left: { type: float, min: 0.0, max: 32.0,
                   label: Crop left,
                   description: "Left crop, 0 to 32." }
      crop_right: { type: float, min: 0.0, max: 32.0,
                    label: Crop right,
                    description: "Right crop, 0 to 32." }
    returns: ack

  set_supersource_art:
    summary: >
      Set a SuperSource's art: fill and key sources, in front of or behind the
      boxes, and its key. Clip and gain are percent. Give at least one setting.
    params:
      supersource: { type: int, min: 1, max: 2, default: 1,
                     label: SuperSource,
                     description: "SuperSource, numbered from 1; 1 on models with one." }
      fill: { type: int, min: 0, max: 65535,
              label: Fill source,
              description: "Fill source ID as listed in the sources state (e.g. 1 for input 1)." }
      key: { type: int, min: 0, max: 65535,
             label: Key source,
             description: "Key (cut) source ID as listed in the sources state (e.g. 1 for input 1)." }
      placement: { type: enum, values: [background, foreground],
                   label: Placement,
                   description: "Art in the background (behind the boxes) or foreground (in front of them)." }
      pre_multiplied: { type: bool,
                        label: Pre-multiplied,
                        description: "Whether the key is pre-multiplied (the fill already shaped by the key); off uses clip and gain." }
      clip: { type: float, min: 0.0, max: 100.0,
              label: Clip,
              description: "Key clip level in percent, 0 to 100." }
      gain: { type: float, min: 0.0, max: 100.0,
              label: Gain,
              description: "Key gain in percent, 0 to 100." }
      invert: { type: bool,
                label: Invert key,
                description: "Whether the key signal is inverted." }
    returns: ack

  set_audio_input:
    summary: >
      Classic audio mixer: set an input's mix option (off, on, audio follow
      video), gain in dB and balance. Inputs are numbered as in the
      audio.inputs state. Give at least one setting.
    params:
      input: { type: int, min: 0, max: 65535, required: true,
               label: Audio input,
               description: "Audio input number as in the audio.inputs state." }
      mix: { type: enum, values: ["off", "on", "afv"],
             label: Mix,
             description: "Off, on (always in the mix) or afv (audio follows video)." }
      gain: { type: float, min: -60.0, max: 6.0,
              label: Gain,
              description: "Input gain in dB, -60 to +6." }
      balance: { type: float, min: -50.0, max: 50.0,
                 label: Balance,
                 description: "Balance, -50 (left) to 50 (right); 0 is centre." }
    returns: ack

  set_audio_master:
    summary: Classic audio mixer master gain in dB and balance. Give at least one.
    params:
      gain: { type: float, min: -60.0, max: 6.0,
              label: Gain,
              description: "Master gain in dB, -60 to +6." }
      balance: { type: float, min: -50.0, max: 50.0,
                 label: Balance,
                 description: "Master balance, -50 (left) to 50 (right); 0 is centre." }
    returns: ack

  set_fairlight_source:
    summary: >
      Fairlight mixer: set a source's input gain and fader gain in dB, balance
      (-100 to 100) and mix option (off mutes it). Input and source are as in
      the fairlight.inputs state. Give at least one setting.
    params:
      input: { type: int, min: 0, max: 65535, required: true,
               label: Audio input,
               description: "Fairlight audio input number as in the fairlight.inputs state." }
      source: { type: int, required: true,
                label: Audio source,
                description: "Source of the input (e.g. a channel of a stereo pair), as in the fairlight.inputs state." }
      gain: { type: float, min: -100.0, max: 6.0,
              label: Input gain,
              description: "Input gain in dB, -100 to +6." }
      fader_gain: { type: float, min: -100.0, max: 10.0,
                    label: Fader,
                    description: "Fader gain in dB, -100 to +10." }
      balance: { type: float, min: -100.0, max: 100.0,
                 label: Balance,
                 description: "Balance, -100 (left) to 100 (right); 0 is centre." }
      mix: { type: enum, values: ["off", "on", "afv"],
             label: Mix,
             description: "Off (muted), on, or afv (audio follows video)." }
    returns: ack

  set_fairlight_master:
    summary: Fairlight mixer master fader gain in dB, and whether it follows fade to black. Give at least one.
    params:
      fader_gain: { type: float, min: -100.0, max: 10.0,
                    label: Fader,
                    description: "Master fader gain in dB, -100 to +10." }
      follow_fade_to_black: { type: bool,
                              label: Follow fade to black,
                              description: "Whether the master audio fades with fade to black." }
    returns: ack

  set_audio_levels:
    summary: >
      Ask the Fairlight mixer to send its meter levels, or stop. They arrive
      many times a second as fairlight.*.level state while on.
    params:
      enabled: { type: bool, default: true,
                 label: Send levels,
                 description: "True asks the mixer to send meter levels many times a second, false stops them." }
    returns: ack

  set_multiviewer_window:
    summary: Route a source to a multiviewer window. Windows are as in the multiviewers state.
    params:
      multiviewer: { type: int, min: 1, max: 4, required: true,
                     label: Multiviewer,
                     description: "Multiviewer output, numbered from 1." }
      window: { type: int, min: 1, max: 16, required: true,
                label: Window,
                description: "Multiviewer window, numbered as in the multiviewers state." }
      source: { type: int, min: 0, max: 65535, required: true,
                label: Source,
                description: "Video source ID as listed in the sources state (e.g. 1 for input 1) shown in the window." }
    returns: ack

  set_input_name:
    summary: Rename a source. Give at least one name.
    params:
      source: { type: int, min: 0, max: 65535, required: true,
                label: Source,
                description: "Video source ID as listed in the sources state (e.g. 1 for input 1) to rename." }
      long_name: { type: string, max_length: 20,
                   label: Long name,
                   description: "Long name, up to 20 characters." }
      short_name: { type: string, max_length: 4,
                    label: Short name,
                    description: "Short name shown on buttons, up to 4 characters." }
    returns: ack

  continue_macro:
    summary: Continue a macro waiting at a user wait
    returns: ack

  set_macro_loop:
    summary: Loop the running macro, or not
    params:
      loop: { type: bool, default: true,
              label: Loop,
              description: "True loops the running macro, false stops looping." }
    returns: ack

  set_streaming_service:
    summary: >
      Set the streaming service name, server URL and stream key. Give at least
      one. The key is never reported back in the state.
    params:
      service_name: { type: string, max_length: 63,
                      label: Service,
                      description: "Streaming service name, e.g. YouTube." }
      url: { type: string, max_length: 511,
             label: Server URL,
             description: "Streaming server URL, e.g. rtmp://a.rtmp.youtube.com/live2." }
      key: { type: string, max_length: 511,
             label: Stream key,
             description: "Stream key; it is never reported back in the state." }
    returns: ack

  camera_iris:
    summary: Set a Blackmagic camera's iris, 0 (closed) to 1 (open), over SDI camera control
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      iris: { type: float, min: 0.0, max: 1.0, required: true,
              label: Iris,
              description: "Iris opening, 0 (closed) to 1 (open)." }
    returns: ack

  camera_focus:
    summary: >
      Set a Blackmagic camera's focus, 0 (near) to 1 (far), or move it by -1
      to 1 when relative
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      focus: { type: float, min: -1.0, max: 1.0, required: true,
               label: Focus,
               description: "Focus position, 0 (near) to 1 (far); with relative, a move of -1 to 1." }
      relative: { type: bool, default: false,
                  label: Relative,
                  description: "Whether focus moves the focus by that amount rather than setting it." }
    returns: ack

  camera_zoom:
    summary: Zoom a Blackmagic camera's lens at a speed, -1 (wide) to 1 (tele); 0 stops
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      speed: { type: float, min: -1.0, max: 1.0, required: true,
               label: Zoom speed,
               description: "Zoom speed, -1 (wide) to 1 (tele); 0 stops." }
    returns: ack

  camera_gain:
    summary: Set a Blackmagic camera's gain, in dB
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      gain: { type: int, min: 0, max: 127, required: true,
              label: Gain,
              description: "Camera gain in dB." }
    returns: ack

  camera_white_balance:
    summary: Set a Blackmagic camera's white balance in kelvin, and tint
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      kelvin: { type: int, min: 1000, max: 15000, required: true,
                label: White balance,
                description: "Colour temperature in kelvin, 1000 to 15000." }
      tint: { type: int, min: -50, max: 50, default: 0,
              label: Tint,
              description: "Tint, -50 to 50; 0 is neutral." }
    returns: ack

  camera_shutter:
    summary: Set a Blackmagic camera's exposure time, in microseconds (20000 is 1/50 s)
    params:
      camera: { type: int, min: 1, max: 255, required: true,
                label: Camera,
                description: "Camera number as set on the Blackmagic camera for SDI camera control, from 1." }
      exposure_us: { type: int, min: 2500, max: 1000000, required: true,
                     label: Exposure,
                     description: "Exposure time in microseconds, e.g. 20000 for 1/50 s." }
    returns: ack

state:
  device.product:              { type: string, description: "Product name the switcher reports (_pin)" }
  device.model_id:             { type: int, description: "Model number the switcher reports (_pin); see the models' comments" }
  device.protocol_version:     { type: string, description: "Protocol version (_ver), such as 2.30; not the firmware version" }
  topology.mes:                { type: int, description: "Number of M/Es" }
  topology.sources:            { type: int, description: "Number of video sources" }
  topology.auxes:              { type: int, description: "Number of aux outputs" }
  topology.dsks:               { type: int, description: "Number of downstream keyers" }
  topology.media_players:      { type: int, description: "Number of media players" }
  topology.supersources:       { type: int, description: "Number of SuperSources" }
  topology.macros:             { type: int, description: "Number of macro slots" }
  sources.*.long_name:         { type: string, description: "Source long name, keyed by source id" }
  sources.*.short_name:        { type: string, description: "Source short name (4 characters)" }
  sources.*.kind:              { type: string, description: "external, black, color_bars, color, media_player_fill, media_player_key, supersource, external_direct, me_output, aux, mask, multiviewer, audio_monitor or unknown" }
  mes.*.program:               { type: int, description: "Source id on program, keyed by M/E number from 1" }
  mes.*.preview:               { type: int, description: "Source id on preview" }
  mes.*.keyers:                { type: int, description: "Upstream keyers on this M/E" }
  mes.*.transition.style:      { type: string, description: "mix, dip, wipe, dve or sting" }
  mes.*.transition.in_progress: { type: bool, description: "A transition is running" }
  mes.*.transition.position:   { type: float, description: "Transition position, 0 to 1" }
  mes.*.fade_to_black.black:   { type: bool, description: "Output fully faded to black" }
  mes.*.fade_to_black.in_progress: { type: bool, description: "Fade to black running" }
  mes.*.usk.*.on_air:          { type: bool, description: "Upstream keyer on air, keyed by keyer number from 1" }
  auxes.*.source:              { type: int, description: "Source id routed to the aux, keyed by aux number from 1" }
  dsks.*.on_air:               { type: bool, description: "Downstream keyer on air, keyed by DSK number from 1" }
  dsks.*.in_transition:        { type: bool, description: "Downstream keyer transitioning" }
  dsks.*.tie:                  { type: bool, description: "Downstream keyer tied to the next transition" }
  tally.*.program:             { type: bool, description: "Source on program, keyed by source id, as the switcher computes it (keyers included)" }
  tally.*.preview:             { type: bool, description: "Source on preview" }
  macros.*.name:               { type: string, description: "Macro name, keyed by slot number from 1; only slots in use" }
  macro_running:               { type: int, description: "Slot number of the running macro; absent when none runs" }
  streaming.state:             { type: string, description: "idle, connecting, streaming or stopping" }
  recording.active:            { type: bool, description: "Recording" }
  recording.error:             { type: string, description: "none, no_media, media_full, media_error, media_unformatted, dropping_frames or unknown" }
  topology.dves:               { type: int, description: "Number of DVEs; set_dve_transition and the dve key type need one" }
  topology.stingers:           { type: int, description: "Number of stinger engines; set_stinger needs one" }
  topology.camera_control:     { type: bool, description: "The switcher passes camera control to Blackmagic cameras over SDI" }
  topology.stills:             { type: int, description: "Still slots in the media pool" }
  topology.clips:              { type: int, description: "Clip slots in the media pool; 0 means media players hold stills only" }
  topology.audio:              { type: string, description: "classic or fairlight: which audio mixer the switcher has" }
  mes.*.transition.selection:  { type: array, description: "Layers in the current transition: background, key1 to key4" }
  mes.*.transition.next_style: { type: string, description: "Style of the next transition" }
  mes.*.transition.next_selection: { type: array, description: "Layers the next transition takes: background, key1 to key4" }
  mes.*.transition.preview:    { type: bool, description: "Transition preview (PREV TRANS) on" }
  mes.*.transition.mix.rate:   { type: int, unit: frames, description: "Mix transition rate" }
  mes.*.transition.dip.rate:   { type: int, unit: frames, description: "Dip transition rate" }
  mes.*.transition.dip.source: { type: int, description: "Dip source id" }
  mes.*.transition.wipe.rate:  { type: int, unit: frames, description: "Wipe transition rate" }
  mes.*.transition.wipe.pattern: { type: string, description: "Wipe pattern, as set_wipe names them" }
  mes.*.transition.wipe.border_width: { type: float, unit: percent, description: "Wipe border width" }
  mes.*.transition.wipe.border_source: { type: int, description: "Wipe border fill source id" }
  mes.*.transition.wipe.symmetry: { type: float, unit: percent, description: "Wipe symmetry" }
  mes.*.transition.wipe.softness: { type: float, unit: percent, description: "Wipe softness" }
  mes.*.transition.wipe.x:     { type: float, description: "Wipe origin x, 0 to 1" }
  mes.*.transition.wipe.y:     { type: float, description: "Wipe origin y, 0 to 1" }
  mes.*.transition.wipe.reverse: { type: bool, description: "Wipe reversed" }
  mes.*.transition.wipe.flip_flop: { type: bool, description: "Wipe flip flop" }
  mes.*.transition.dve.rate:   { type: int, unit: frames, description: "DVE transition rate" }
  mes.*.transition.dve.style:  { type: string, description: "DVE transition style, as set_dve_transition names them" }
  mes.*.transition.dve.fill_source: { type: int, description: "DVE transition key fill source id" }
  mes.*.transition.dve.key_source: { type: int, description: "DVE transition key source id" }
  mes.*.transition.dve.enable_key: { type: bool, description: "DVE transition key on" }
  mes.*.transition.dve.pre_multiplied: { type: bool, description: "DVE transition key pre-multiplied" }
  mes.*.transition.dve.clip:   { type: float, unit: percent, description: "DVE transition key clip" }
  mes.*.transition.dve.gain:   { type: float, unit: percent, description: "DVE transition key gain" }
  mes.*.transition.dve.invert_key: { type: bool, description: "DVE transition key inverted" }
  mes.*.transition.dve.reverse: { type: bool, description: "DVE transition reversed" }
  mes.*.transition.dve.flip_flop: { type: bool, description: "DVE transition flip flop" }
  mes.*.transition.sting.media_player: { type: int, description: "Media player the stinger plays, from 1" }
  mes.*.transition.sting.pre_multiplied: { type: bool, description: "Stinger key pre-multiplied" }
  mes.*.transition.sting.clip: { type: float, unit: percent, description: "Stinger key clip" }
  mes.*.transition.sting.gain: { type: float, unit: percent, description: "Stinger key gain" }
  mes.*.transition.sting.invert: { type: bool, description: "Stinger key inverted" }
  mes.*.transition.sting.preroll: { type: int, unit: frames, description: "Stinger preroll" }
  mes.*.transition.sting.clip_duration: { type: int, unit: frames, description: "Stinger clip duration" }
  mes.*.transition.sting.trigger_point: { type: int, unit: frames, description: "Stinger trigger point" }
  mes.*.transition.sting.mix_rate: { type: int, unit: frames, description: "Stinger mix rate" }
  mes.*.fade_to_black.rate:    { type: int, unit: frames, description: "Fade to black rate" }
  mes.*.usk.*.type:            { type: string, description: "luma, chroma, pattern or dve" }
  mes.*.usk.*.can_fly:         { type: bool, description: "The keyer can fly (has a DVE)" }
  mes.*.usk.*.fly_enabled:     { type: bool, description: "Flying key on" }
