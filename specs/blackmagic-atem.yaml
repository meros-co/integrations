spec: 1
id: blackmagic-atem
name: Blackmagic ATEM switchers
vendor: Blackmagic Design
category: switcher
implementation: native
reason: >
  A proprietary UDP protocol with a session handshake, per-packet sequence
  numbers, acknowledgements and retransmission, carrying binary commands whose
  layout depends on the protocol version the switcher reports.

source:
  - title: Sofie atem-connection (v3.10.2, commit 6b91b9e)
    author: Norsk rikskringkasting AS
    url: https://github.com/Sofie-Automation/sofie-atem-connection
    note: >
      MIT-licensed; read as a reference, not copied. Packet header and flags,
      handshake, acknowledgement and retransmission behaviour, command layouts
      and their protocol-version boundaries. Its test captures of the initial
      state from 28 real switchers (ATEM Mini to Constellation, firmware 7.2 to
      10.1.1) confirm the dump starts with _ver and ends with InCm, and show
      which models have classic or Fairlight audio, clips, stingers and camera
      control. The LibAtem samples in its tests
      (src/commands/__tests__/libatem-data.json) give each command both as
      bytes and in the user's units, which fixes the fixed-point scaling of
      the keyer, Fairlight dynamics and EQ, monitor and multiviewer fields.
  - title: OpenSwitcher protocol documentation
    url: https://docs.openswitcher.org/udptransport.html
    note: >
      Documentation pages only (the transport description and field and command
      tables, which corroborate the transition, keyer, colour, media player and
      SuperSource layouts and give their value ranges). No OpenSwitcher or
      pyatem source code was read.
  - title: Bitfocus Companion, companion-module-bmd-atem (v4.3.0, commit 4cd3d9a)
    url: https://github.com/bitfocus/companion-module-bmd-atem
    note: >
      MIT-licensed; source id numbering, the value ranges and fixed-point
      scaling operators use (percent, 0 to 1, dB in hundredths), each model's
      audio mixer, SuperSource and streaming capabilities, and the 500 ms
      duration polling.
  - title: atem-connection camera-control (v0.4.0)
    author: Julian Waller
    url: https://github.com/Julusian/atem-connection-camera-control
    note: >
      MIT-licensed; the SDI camera control categories and parameter ids (lens
      focus, aperture and zoom; video white balance, exposure and gain) and the
      data type each one takes.
  - title: SKAARHOJ, BlackMagic ATEM Switcher Protocol (documentation page)
    note: >
      Protocol prose (CC BY-SA), used to corroborate command names. SKAARHOJ's
      GPL libraries were not read.

ports:
  - { port: 9910, protocol: udp, role: control }
  - { port: 5353, protocol: udp, role: discovery, note: "mDNS / DNS-SD (Bonjour)" }

