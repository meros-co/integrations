commands:
  cut:
    summary: Cut preview to program
    params:
      me: { type: int, min: 1, max: 4, default: 1 }
    returns: ack

  auto:
    summary: Run the current transition from preview to program
    params:
      me: { type: int, min: 1, max: 4, default: 1 }
    returns: ack

  set_program:
    summary: Put a source on program. Source ids are listed in the sources state.
    params:
      me: { type: int, min: 1, max: 4, default: 1 }
      source: { type: int, min: 0, max: 65535, required: true }
    returns: ack

  set_preview:
    summary: Put a source on preview
    params:
      me: { type: int, min: 1, max: 4, default: 1 }
      source: { type: int, min: 0, max: 65535, required: true }
    returns: ack

  set_transition_style:
    summary: Choose the transition style for the next transition
    params:
      me: { type: int, min: 1, max: 4, default: 1 }
      style: { type: enum, values: [mix, dip, wipe, dve, sting], required: true }
    returns: ack

  set_transition_position:
    summary: Move the transition lever, 0 to 1
    params:
      me: { type: int, min: 1, max: 4, default: 1 }
      position: { type: float, min: 0.0, max: 1.0, required: true }
    returns: ack

  set_aux:
    summary: Route a source to an aux output
    params:
      aux: { type: int, min: 1, max: 24, required: true }
      source: { type: int, min: 0, max: 65535, required: true }
    returns: ack

  dsk_auto:
    summary: Run a downstream keyer's auto transition, on or off air
    params:
      dsk: { type: int, min: 1, max: 4, required: true }
    returns: ack

  dsk_on_air:
    summary: Cut a downstream keyer on or off air
    params:
      dsk:    { type: int, min: 1, max: 4, required: true }
      on_air: { type: bool, default: true }
    returns: ack

  usk_on_air:
    summary: Cut an upstream keyer on or off air
    params:
      me: { type: int, min: 1, max: 4, default: 1 }
      keyer:  { type: int, min: 1, max: 16, required: true }
      on_air: { type: bool, default: true }
    returns: ack

  fade_to_black:
    summary: Run fade to black, or fade back up when already black
    params:
      me: { type: int, min: 1, max: 4, default: 1 }
    returns: ack

  run_macro:
    summary: Run a macro by its slot number, counting from 1
    params:
      macro: { type: int, min: 1, max: 100, required: true }
    returns: ack

  stop_macro:
    summary: Stop the running macro
    returns: ack

  start_streaming: { summary: Start streaming with the configured service, returns: ack }
  stop_streaming:  { summary: Stop streaming, returns: ack }
  start_recording: { summary: Start recording to the attached disk, returns: ack }
  stop_recording:  { summary: Stop recording, returns: ack }

state:
  device.product:              { type: string, description: "Product name the switcher reports (_pin)" }
  device.model_id:             { type: int, description: "Model number the switcher reports (_pin); see the models' comments" }
  device.protocol_version:     { type: string, description: "Protocol version (_ver), such as 2.30; not the firmware version" }
  topology.mes:                { type: int, description: "Number of M/Es" }
  topology.sources:            { type: int, description: "Number of video sources" }
  topology.auxes:              { type: int, description: "Number of aux outputs" }
  topology.dsks:               { type: int, description: "Number of downstream keyers" }
  topology.media_players:      { type: int, description: "Number of media players" }
  topology.supersources:       { type: int, description: "Number of SuperSources" }
  topology.macros:             { type: int, description: "Number of macro slots" }
  sources.*.long_name:         { type: string, description: "Source long name, keyed by source id" }
  sources.*.short_name:        { type: string, description: "Source short name (4 characters)" }
  sources.*.kind:              { type: string, description: "external, black, color_bars, color, media_player_fill, media_player_key, supersource, external_direct, me_output, aux, mask, multiviewer, audio_monitor or unknown" }
  mes.*.program:               { type: int, description: "Source id on program, keyed by M/E number from 1" }
  mes.*.preview:               { type: int, description: "Source id on preview" }
  mes.*.keyers:                { type: int, description: "Upstream keyers on this M/E" }
  mes.*.transition.style:      { type: string, description: "mix, dip, wipe, dve or sting" }
  mes.*.transition.in_progress: { type: bool, description: "A transition is running" }
  mes.*.transition.position:   { type: float, description: "Transition position, 0 to 1" }
  mes.*.fade_to_black.black:   { type: bool, description: "Output fully faded to black" }
  mes.*.fade_to_black.in_progress: { type: bool, description: "Fade to black running" }
  mes.*.usk.*.on_air:          { type: bool, description: "Upstream keyer on air, keyed by keyer number from 1" }
  auxes.*.source:              { type: int, description: "Source id routed to the aux, keyed by aux number from 1" }
  dsks.*.on_air:               { type: bool, description: "Downstream keyer on air, keyed by DSK number from 1" }
  dsks.*.in_transition:        { type: bool, description: "Downstream keyer transitioning" }
  dsks.*.tie:                  { type: bool, description: "Downstream keyer tied to the next transition" }
  tally.*.program:             { type: bool, description: "Source on program, keyed by source id, as the switcher computes it (keyers included)" }
  tally.*.preview:             { type: bool, description: "Source on preview" }
  macros.*.name:               { type: string, description: "Macro name, keyed by slot number from 1; only slots in use" }
  macro_running:               { type: int, description: "Slot number of the running macro; absent when none runs" }
  streaming.state:             { type: string, description: "idle, connecting, streaming or stopping" }
  recording.active:            { type: bool, description: "Recording" }
  recording.error:             { type: string, description: "none, no_media, media_full, media_error, media_unformatted, dropping_frames or unknown" }

quirks:
  - models: [all]
    severity: info
    text: >
      An ack means the switcher acknowledged the packet carrying the command,
      not that it applied it. The resulting change arrives as a state patch,
      for example the new program source after set_program.

  - models: [all]
    severity: info
    text: >
      Commands are checked against the switcher's own topology and source list,
      which it sends on connection. An M/E, aux, keyer, source or macro the
      switcher does not have fails as invalid parameters without being sent.

  - models: [all]
    severity: warning
    text: >
      Switchers accept only a handful of simultaneous connections (reported as
      about five on small and older models and eight or more on larger ones;
      Blackmagic does not document the number). A dropped connection holds its
      place until the switcher times it out. The core reconnects on a fresh
      socket after five seconds of silence.

  - models: [all]
    severity: info
    text: >
      The switcher is the source of tally: tally.* is its own calculation,
      including keyers and downstream keyers, not one derived from program and
      preview.

  - models: [all]
    severity: info
    text: >
      Streaming and recording need protocol 2.30 (firmware 8.1.1) or later and
      a model with a built-in encoder or recorder. Elsewhere those commands are
      refused as unsupported.
