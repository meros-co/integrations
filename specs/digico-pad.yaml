      value: { type: float, min: -150, max: 10, required: true, label: "Send level", description: "Matrix send level in dB, -150 to +10." }
    send: { address: "/Matrix_Inputs/{matrix_input}/Matrix_Send/{matrix}/send_level", args: [ { value: "{value}", type: float } ] }
