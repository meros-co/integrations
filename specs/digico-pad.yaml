  matrix_outputs.*.dynamics.compressor.bands.*.knee: { type: string, description: "Band knee of the matrix output, band *: hard, medium or soft (0, 1, 2 on the wire)." }
  matrix_outputs.*.dynamics.compressor.bands.*.auto_gain: { type: bool, description: "Band auto gain of the matrix output, band *: True switches the band's auto gain on." }
  matrix_outputs.*.dynamics.compressor.bands.*.listen: { type: bool, description: "Band listen of the matrix output, band *: True listens to the compressor band." }
  matrix_outputs.*.dynamics.compressor.lp_crossover: { type: float, unit: Hz, description: "LP crossover of the matrix output: Multiband compressor low-pass crossover in Hz, 20 to 20000." }
  matrix_outputs.*.dynamics.compressor.hp_crossover: { type: float, unit: Hz, description: "HP crossover of the matrix output: Multiband compressor high-pass crossover in Hz, 20 to 20000." }
  matrix_outputs.*.dynamics.de_esser.centre: { type: float, description: "De-esser centre of the matrix output: De-esser centre frequency as the console's number, 0 to 255; the source gives no unit." }
  matrix_outputs.*.dynamics.de_esser.width: { type: float, description: "De-esser width of the matrix output: De-esser frequency width as the console's number, 0 to 255; the source gives no unit." }
  matrix_outputs.*.dynamics.gate.key_centre: { type: float, description: "Gate key centre of the matrix output: Gate or ducker key filter centre frequency as the console's number, 0 to 255; the source gives no unit." }
  matrix_outputs.*.dynamics.gate.key_width: { type: float, description: "Gate key width of the matrix output: Gate or ducker key filter width as the console's number, 0 to 255; the source gives no unit." }
  matrix_outputs.*.dynamics.gate.attack: { type: float, unit: s, description: "Gate attack of the matrix output: Gate attack in seconds, 0.00005 to 0.1." }
  matrix_outputs.*.dynamics.gate.hold: { type: float, unit: s, description: "Gate hold of the matrix output: Gate hold in seconds, 0.002 to 2." }
  matrix_outputs.*.dynamics.gate.range: { type: float, unit: dB, description: "Gate range of the matrix output: Gate range in dB, 0 to 90." }
  matrix_outputs.*.dynamics.gate.release: { type: float, unit: s, description: "Gate release of the matrix output: Gate release in seconds, 0.005 to 10." }
  matrix_outputs.*.dynamics.gate.threshold: { type: float, unit: dB, description: "Gate threshold of the matrix output: Gate threshold in dB, -60 to 0." }
  matrix_outputs.*.dynamics.key_solo: { type: bool, description: "Key solo of the matrix output: True solos (listens to) the dynamics side-chain key." }
  matrix_inputs.*.name: { type: string, description: "Name of the matrix input: Matrix input name as the console shows it." }
  control_groups.*.name: { type: string, description: "Name of the control group: Control group name as the console shows it." }
  control_groups.*.fader: { type: float, unit: dB, description: "Fader level of the control group: Fader level in dB, -150 (the bottom of the fader) to +10." }
  control_groups.*.mute: { type: bool, description: "Muted of the control group: True mutes the strip, false unmutes it." }
  control_groups.*.solo: { type: bool, description: "Soloed of the control group: True solos the strip, false clears its solo." }
  control_groups.*.aux_send: { type: float, unit: dB, description: "Aux send of the control group: Control group aux send level in dB, -18 to +18." }
  graphic_eqs.*.name: { type: string, description: "Name of the graphic EQ: Graphic EQ name as the console shows it." }
  graphic_eqs.*.enabled: { type: bool, description: "Graphic EQ in of the graphic EQ: True switches the graphic EQ in." }
  graphic_eqs.*.bands.*.gain: { type: float, unit: dB, description: "Band gain of the graphic EQ, band *: Graphic EQ band gain in dB, -12 to +12." }
  multis.*.name: { type: string, description: "Name of the multi: Multi name as the console shows it." }
  multis.*.fader: { type: float, unit: dB, description: "Fader level of the multi: Fader level in dB, -150 (the bottom of the fader) to +10." }
  multis.*.mute: { type: bool, description: "Muted of the multi: True mutes the strip, false unmutes it." }
  multis.*.solo: { type: bool, description: "Soloed of the multi: True solos the strip, false clears its solo." }
  inputs.*.aux_sends.*.level: { type: float, unit: dB, description: "Send level of the input channel, to aux output *: Aux send level in dB, -150 to +10." }
  inputs.*.aux_sends.*.enabled: { type: bool, description: "Send on of the input channel, to aux output *: True switches the aux send on." }
  inputs.*.aux_sends.*.pan: { type: float, description: "Send pan of the input channel, to aux output *: Aux send pan, -1 (left) to +1 (right)." }
  group_outputs.*.aux_sends.*.level: { type: float, unit: dB, description: "Send level of the group output, to aux output *: Aux send level in dB, -150 to +10." }
  group_outputs.*.aux_sends.*.enabled: { type: bool, description: "Send on of the group output, to aux output *: True switches the aux send on." }
  group_outputs.*.aux_sends.*.pan: { type: float, description: "Send pan of the group output, to aux output *: Aux send pan, -1 (left) to +1 (right)." }
  group_outputs.*.aux_sends.*.tap: { type: float, description: "Send tap of the group output, to aux output *: Pre- or post-fader tap point of the send, 0 to 2 as the console numbers it; the source names no value." }
  inputs.*.group_sends.*.assigned: { type: bool, description: "Routed to group of the input channel, to group output *: True routes the channel to the group; the source marks this parameter as a guess." }
  group_outputs.*.group_sends.*.assigned: { type: bool, description: "Routed to group of the group output, to group output *: True routes the group to the other group; the source marks this parameter as a guess." }
  matrix_inputs.*.matrix_sends.*.level: { type: float, unit: dB, description: "Send level of the matrix input, to matrix output *: Matrix send level in dB, -150 to +10." }
  matrix_inputs.*.matrix_sends.*.enabled: { type: bool, description: "Send on of the matrix input, to matrix output *: True switches the matrix send on." }
  console.counts.input_channels: { type: int, description: "How many input channels the session has, as the console reports it (/Console/Input_Channels)." }
  console.counts.aux_outputs: { type: int, description: "How many aux outputs the session has, as the console reports it (/Console/Aux_Outputs)." }
  console.counts.group_outputs: { type: int, description: "How many group outputs the session has, as the console reports it (/Console/Group_Outputs)." }
  console.counts.matrix_inputs: { type: int, description: "How many matrix inputs the session has, as the console reports it (/Console/Matrix_Inputs)." }
  console.counts.matrix_outputs: { type: int, description: "How many matrix outputs the session has, as the console reports it (/Console/Matrix_Outputs)." }
  console.counts.control_groups: { type: int, description: "How many control groups the session has, as the console reports it (/Console/Control_Groups)." }
  console.counts.graphic_eqs: { type: int, description: "How many graphic eqs the session has, as the console reports it (/Console/Graphic_EQ)." }
  console.counts.multis: { type: int, description: "How many multis the session has, as the console reports it (/Console/Multis)." }
  console.counts.talkback_outputs: { type: int, description: "How many talkback outputs the session has, as the console reports it (/Console/Talkback_Outputs)." }
  inputs.*.mode: { type: int, description: "Format of the input channel from /Console/Input_Channels/modes, one number per strip in strip order: 1 mono, 2 stereo." }
  aux_outputs.*.mode: { type: int, description: "Format of the aux output from /Console/Aux_Outputs/modes, one number per strip in strip order: 1 mono, 2 stereo." }
  group_outputs.*.mode: { type: int, description: "Format of the group output from /Console/Group_Outputs/modes, one number per strip in strip order: 1 to 6; the source names 1 mono and 2 stereo." }
  console.name: { type: string, description: "The console's name (/Console/Name)." }
  console.session_file: { type: string, description: "The file name of the session loaded (/Console/Session/Filename)." }
  snapshots.count: { type: int, description: "How many snapshots the session has (/Snapshots/count)." }
  snapshots.current: { type: int, description: "Index of the current snapshot, as snapshots.list keys it; -1 for none (/Snapshots/Current_Snapshot)." }
  snapshots.list.*.number: { type: float, description: "The snapshot's number as the console shows it (sent in hundredths)." }
  snapshots.list.*.group: { type: string, description: "The snapshot's group, empty for none." }
  snapshots.list.*.name: { type: string, description: "The snapshot's name." }
  snapshots.list.*.notes: { type: string, description: "The snapshot's notes (/Snapshots/notes)." }
  macros.count: { type: int, description: "How many macros the session has (/Macros/count)." }
  macros.list.*.name: { type: string, description: "The macro's name, keyed by its index." }
  macros.buttons.count: { type: int, description: "How many OSC macro buttons there are (/Macros/Buttons/count)." }
  macros.buttons.*.state: { type: int, description: "The OSC macro button's state, 0 to 2 as the console numbers it." }
  macros.buttons.*.name: { type: string, description: "The OSC macro button's name." }
  presets.count: { type: int, description: "How many presets the session has (/Presets/count)." }
  presets.list.*.channel_count: { type: int, description: "How many channels the preset holds, as the source reads its second field." }
  presets.list.*.section: { type: string, description: "The console section the preset applies to." }
  presets.list.*.group: { type: string, description: "The preset's group, empty for none." }
  presets.list.*.name: { type: string, description: "The preset's name." }
  presets.list.*.locked: { type: bool, description: "True when the preset is locked (/Presets/Lock_Preset/<index>)." }
  layout.banks: { type: string, description: "The surface's fader bank selection, as the console sends it (/Layout/Layout/Banks)." }

telemetry:
  poll:
    send:
      - { address: "/Console/Name/?", reply_address: "^/Console/Name$" }
      - { address: "/Console/Session/Filename/?", reply_address: "^/Console/Session/Filename$" }
      - { address: "/Console/Channels/?", reply_address: "^/Console/" }
      - { address: "/Console/Input_Channels/modes/?", reply_address: "^/Console/Input_Channels/modes$" }
      - { address: "/Console/Aux_Outputs/modes/?", reply_address: "^/Console/Aux_Outputs/modes$" }
      - { address: "/Console/Group_Outputs/modes/?", reply_address: "^/Console/Group_Outputs/modes$" }
      - { address: "/Layout/Layout/Banks/?", reply_address: "^/Layout/Layout/Banks$" }
      - { address: "/Snapshots/count/?", reply_address: "^/Snapshots/count$" }
      - { address: "/Snapshots/Current_Snapshot/?", reply_address: "^/Snapshots/Current_Snapshot$" }
      - { address: "/Macros/count/?", reply_address: "^/Macros/count$" }
      - { address: "/Macros/Buttons/count/?", reply_address: "^/Macros/Buttons/count$" }
      - { address: "/Presets/count/?", reply_address: "^/Presets/count$" }
      - { when_set: read_on_connect, address: "/Input_Channels/1/Channel_Input/name/?", reply_address: "^/Input_Channels/1/Channel_Input/name$" }
      - { when_set: read_on_connect, address: "/Aux_Outputs/1/Buss_Trim/name/?", reply_address: "^/Aux_Outputs/1/Buss_Trim/name$" }
      - { when_set: read_on_connect, address: "/Group_Outputs/1/Buss_Trim/name/?", reply_address: "^/Group_Outputs/1/Buss_Trim/name$" }
      - { when_set: read_on_connect, address: "/Matrix_Outputs/1/Buss_Trim/name/?", reply_address: "^/Matrix_Outputs/1/Buss_Trim/name$" }
      - { when_set: read_on_connect, address: "/Matrix_Inputs/1/Channel_Input/name/?", reply_address: "^/Matrix_Inputs/1/Channel_Input/name$" }
      - { when_set: read_on_connect, address: "/Control_Groups/1/name/?", reply_address: "^/Control_Groups/1/name$" }
      - { when_set: read_on_connect, address: "/Graphic_EQ/1/name/?", reply_address: "^/Graphic_EQ/1/name$" }
      - { when_set: read_on_connect, address: "/Multis/1/name/?", reply_address: "^/Multis/1/name$" }
  updates:
    - address: '^/Console/Name$'
      state: { console.name: "{arg0}" }
    - address: '^/Console/Session/Filename$'
      state: { console.session_file: "{arg0}" }
    - address: '^/Layout/Layout/Banks$'
      state: { layout.banks: "{arg0}" }
    - address: '^/Snapshots/Current_Snapshot$'
      state: { snapshots.current: "{arg0}" }
    - address: '^/Snapshots/name$'
      state: { "snapshots.list.{arg0}.number": "{arg1:from.snapshot_number}", "snapshots.list.{arg0}.group": "{arg2}", "snapshots.list.{arg0}.name": "{arg3}" }
      then_send:
        - { address: "/Snapshots/notes/?", args: [ { value: "{arg0}", type: int } ], reply_address: "^/Snapshots/notes$" }
    - address: '^/Snapshots/notes$'
      state: { "snapshots.list.{arg0}.notes": "{arg4}" }
    - address: '^/Macros/name$'
      state: { "macros.list.{arg0}.name": "{arg1}" }
    - address: '^/Macros/Buttons/count$'
      state: { macros.buttons.count: "{arg0}" }
    - address: '^/Macros/Buttons/count$'
      request_match: '^/Macros/Buttons/count/\?$'
      replace: macros.buttons
      then_send:
        - { address: "/Macros/Buttons/?", reply_address: "^/Macros/Buttons/" }
    - address: '^/Macros/Buttons/state$'
      state: { "macros.buttons.{arg0}.state": "{arg1}", "macros.buttons.{arg0}.name": "{arg2}" }
    - address: '^/Macros/Buttons/state/(\d+)$'
      state: { "macros.buttons.{1}.state": "{arg0}" }
    - address: '^/Presets/name$'
      state: { "presets.list.{arg0}.channel_count": "{arg1}", "presets.list.{arg0}.section": "{arg3}", "presets.list.{arg0}.group": "{arg4}", "presets.list.{arg0}.name": "{arg5}" }
      then_send:
        - { address: "/Presets/Lock_Preset/{arg0}/?", reply_address: "^/Presets/Lock_Preset/{arg0}$" }
    - address: '^/Presets/Lock_Preset/(\d+)$'
      state: { "presets.list.{1}.locked": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/Snapshots/count$'
      state: { snapshots.count: "{arg0}" }
    - address: '^/Snapshots/count$'
      request_match: '^/Snapshots/count/\?$'
      replace: snapshots.list
      then_send:
        - { address: "/Snapshots/names/?", reply_address: "^/Snapshots/name$" }
    - address: '^/Snapshots/!$'
      then_send:
        - { address: "/Snapshots/count/?", reply_address: "^/Snapshots/count$" }
    - address: '^/Macros/count$'
      state: { macros.count: "{arg0}" }
    - address: '^/Macros/count$'
      request_match: '^/Macros/count/\?$'
      replace: macros.list
      then_send:
        - { address: "/Macros/names/?", reply_address: "^/Macros/name$" }
    - address: '^/Macros/!$'
      then_send:
        - { address: "/Macros/count/?", reply_address: "^/Macros/count$" }
    - address: '^/Presets/count$'
      state: { presets.count: "{arg0}" }
    - address: '^/Presets/count$'
      request_match: '^/Presets/count/\?$'
      replace: presets.list
      then_send:
        - { address: "/Presets/names/?", reply_address: "^/Presets/name$" }
    - address: '^/Presets/!$'
      then_send:
        - { address: "/Presets/count/?", reply_address: "^/Presets/count$" }
    - address: '^/(.+)/!$'
      then_send:
        - { address: "/{1}/?", reply_address: "^/{1}(/|$)" }
    - address: '^/Console/Session/!$'
      then_send:
        - { address: "/Console/Name/?", reply_address: "^/Console/Name$" }
        - { address: "/Console/Session/Filename/?", reply_address: "^/Console/Session/Filename$" }
        - { address: "/Console/Channels/?", reply_address: "^/Console/" }
        - { address: "/Console/Input_Channels/modes/?", reply_address: "^/Console/Input_Channels/modes$" }
        - { address: "/Console/Aux_Outputs/modes/?", reply_address: "^/Console/Aux_Outputs/modes$" }
        - { address: "/Console/Group_Outputs/modes/?", reply_address: "^/Console/Group_Outputs/modes$" }
        - { address: "/Layout/Layout/Banks/?", reply_address: "^/Layout/Layout/Banks$" }
        - { address: "/Snapshots/count/?", reply_address: "^/Snapshots/count$" }
        - { address: "/Snapshots/Current_Snapshot/?", reply_address: "^/Snapshots/Current_Snapshot$" }
        - { address: "/Macros/count/?", reply_address: "^/Macros/count$" }
        - { address: "/Macros/Buttons/count/?", reply_address: "^/Macros/Buttons/count$" }
        - { address: "/Presets/count/?", reply_address: "^/Presets/count$" }
        - { when_set: read_on_connect, address: "/Input_Channels/1/Channel_Input/name/?", reply_address: "^/Input_Channels/1/Channel_Input/name$" }
        - { when_set: read_on_connect, address: "/Aux_Outputs/1/Buss_Trim/name/?", reply_address: "^/Aux_Outputs/1/Buss_Trim/name$" }
        - { when_set: read_on_connect, address: "/Group_Outputs/1/Buss_Trim/name/?", reply_address: "^/Group_Outputs/1/Buss_Trim/name$" }
        - { when_set: read_on_connect, address: "/Matrix_Outputs/1/Buss_Trim/name/?", reply_address: "^/Matrix_Outputs/1/Buss_Trim/name$" }
        - { when_set: read_on_connect, address: "/Matrix_Inputs/1/Channel_Input/name/?", reply_address: "^/Matrix_Inputs/1/Channel_Input/name$" }
        - { when_set: read_on_connect, address: "/Control_Groups/1/name/?", reply_address: "^/Control_Groups/1/name$" }
        - { when_set: read_on_connect, address: "/Graphic_EQ/1/name/?", reply_address: "^/Graphic_EQ/1/name$" }
        - { when_set: read_on_connect, address: "/Multis/1/name/?", reply_address: "^/Multis/1/name$" }
    - address: '^/Input_Channels/(\d+)/Channel_Input/name$'
      state: { "inputs.{1}.name": "{arg0}" }
    - address: '^/Input_Channels/(\d+)/Channel_Input/trim$'
      state: { "inputs.{1}.trim": "{arg0}" }
    - address: '^/Input_Channels/(\d+)/Channel_Input/phase$'
      state: { "inputs.{1}.phase": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/Input_Channels/(\d+)/Channel_Input/phantom$'
