      path: { type: string, max_length: 128, pattern: '^[A-Za-z][A-Za-z0-9_/.-]*$', required: true, label: Address, description: "The parameter's address without the leading slash, as the command set writes it (Input_Channels/1/fader)." }
      value: { type: int, required: true, label: Value, description: "The value as the console numbers it." }
    send: { address: "/{path}", args: [ { value: "{value}", type: int } ] }
    returns: none

  set_parameter_string:
    summary: "Send any parameter of the command set a string (any address, s)"
    params:
      path: { type: string, max_length: 128, pattern: '^[A-Za-z][A-Za-z0-9_/.-]*$', required: true, label: Address, description: "The parameter's address without the leading slash, as the command set writes it (Input_Channels/1/fader)." }
      value: { type: string, max_length: 256, required: true, label: Value, description: "The text." }
    send: { address: "/{path}", args: [ { value: "{value}", type: string } ] }
    returns: none

  query_parameter:
    summary: "Read any parameter of the command set (its address with /? appended)"
    params:
      path: { type: string, max_length: 128, pattern: '^[A-Za-z][A-Za-z0-9_/.-]*$', required: true, label: Address, description: "The parameter's address without the leading slash, as the command set writes it (Input_Channels/1/fader)." }
    send: { address: "/{path}/?" }
    expect: { address: "/{path}", arg: 0 }
    returns: value

quirks:
  - models: [all]
    severity: info
    text: >
      DiGiCo does not document the DiGiCo Pad command set. Every address, type, range, unit and
      behaviour here is taken from DiGiCo's MIT-licensed Bitfocus Companion module (its parameter table
      and code); TN324 documents only how the device is set up. Each is listed in VERIFICATION.md to be
      checked on a console. Where DiGiCo's own documents say otherwise, they win.

  - models: [all]
    severity: critical
    text: >
      Nothing is accepted until the console is set up for it (TN324 p.2): Setup > External Control
      enabled, Add device > DiGiCo Pad with this host's IP address, a Send port (the feedback_port
      setting, 9000 in TN324's example) and a Receive port (the device's port, 8000), the device's Enable
      box ticked, and the iPad command file for the console loaded with Load (the module's help names
      iPadv2sd8-9-11-12 for SD8, SD9, SD11 and SD12, and ipad_q3 for Quantum); if the panel says no
      commands are enabled, Clear All and load it again. The module's help also asks for Bundles off and
      Suppress OSC Retransmit on. With software V685 and app 1.2.0 only one DiGiCo Pad device can be
      enabled at a time, so this host may take the place of an iPad.

  - models: [all]
    severity: critical
    text: >
      recall_snapshot, fire_next_snapshot, fire_previous_snapshot, fire_selected_snapshot,
      undo_snapshot, recall_preset and recall_macro change the live console at once (a snapshot's
      recall scope, faders and mutes included), and only another recall changes it back.
      update_snapshot, update_current_snapshot, update_preset, delete_snapshot and delete_preset
      overwrite or remove what the session holds.

  - models: [all]
    severity: warning
    text: >
      Reading: the console answers a query (the address with /? appended) on the address itself, and
      sends the same message when the value changes there, so state is read on opening and kept
      current from what the console sends. With read_on_connect on, the strips are read by walking
      their names from 1: each name answered reads that strip's every parameter and asks for the next
      name, and the walk ends at the first strip not answered (so at the session's strip count, plus
      one query that times out after 500 ms). Sends are walked the same way, per destination. A large
      session takes thousands of queries, sent one at a time behind any command; a session loaded on
      the console (/Console/Session/!) reads everything again. To read everything again otherwise,
      open the device again.

  - models: [all]
    severity: warning
    text: >
      Units: levels and gains are in dB, frequencies in Hz, times in seconds (the module's table gives
      milliseconds with a scale of 1000, so the console takes and sends seconds), fine delay in samples,
      pans from -1 to +1. A fader at -150 dB is the bottom of its travel. De-esser and gate key centre
      and width, the EQ curve, dynamic EQ over/under, the solo bus, a group's send tap, the input type,
      the gate mode and macro button states are kept as the console's numbers: the source does not
      say what they mean.

  - models: [all]
    severity: warning
    text: >
      The module's table marks some parameters "MAYBE?": their address or meaning is its author's
      guess. They are built as the table reads them and listed in VERIFICATION.md: input channel
      input_type and Dynamics gate-duck-comp, the outputs' alternate_solo, and the group sends of
      input channels and group outputs (Group_Send/<n>/group). The table's other MAYBE rows (the
      /Console/.../group_sends and send_levels lists, /Console/Session/!) are not built.

  - models: [all]
    severity: warning
    text: >
      Snapshots, macros and presets are keyed by their index in the console's list, which is what
      recall_snapshot, rename_snapshot, recall_macro and the preset commands take; a snapshot's number
      (snapshots.list.*.number) is what the console shows, sent in hundredths. A preset is recalled
      onto, updated from or created from a strip named by the preset's section, as presets.list.*.section
      gives it, and the strip's number. Inserting, deleting or moving an item renumbers the list; the
      console then sends /Snapshots/! (or /Macros/!, /Presets/!) and the list is read again whole.

  - models: [all]
    severity: info
    text: >
      Meters are not read. The command set has meter requests (Meters/request/<n> with a string, and
      Meters/values) whose argument the source does not give, and the module's code notes that some
      meter messages arrive with no OSC type-tag string, which is not valid OSC 1.0.

conversions:
  snapshot_number:   # a snapshot's number, sent in hundredths (0-32767 = 0.00 to 327.67)
    points: [[0, 0.0], [32767, 327.67]]

maps:
  stereo_mode: { "mono": "1", "stereo": "2" }
  dynamics_mode: { "compressor": "0", "multiband": "1", "de_esser": "2" }
  knee: { "hard": "0", "medium": "1", "soft": "2" }
  auto_solo: { "off": "0", "solo_1": "1", "solo_2": "2", "solo_1_and_2": "3" }
  recall_scope: { "all": "0", "eq": "1", "dynamics": "2" }

state:
  inputs.*.name: { type: string, description: "Name of the input channel: Channel name as the console shows it." }
  inputs.*.trim: { type: float, unit: dB, description: "Trim of the input channel: Digital input trim in dB, -40 to +60." }
  inputs.*.phase: { type: bool, description: "Phase of the input channel: True inverts the channel's polarity." }
  inputs.*.phantom: { type: bool, description: "Phantom power of the input channel: True switches 48 V phantom power on." }
  inputs.*.alt_phantom: { type: bool, description: "Alternate phantom power of the input channel: True switches 48 V phantom power on for the alternate input." }
  inputs.*.analog_gain: { type: float, unit: dB, description: "Analogue gain of the input channel: Analogue preamp gain in dB, -20 to +60." }
  inputs.*.alt_analog_gain: { type: float, unit: dB, description: "Alternate analogue gain of the input channel: Analogue preamp gain of the alternate input in dB, -20 to +60." }
  inputs.*.pad: { type: bool, description: "Pad of the input channel: True switches the input pad in." }
  inputs.*.alt_pad: { type: bool, description: "Alternate pad of the input channel: True switches the alternate input's pad in." }
  inputs.*.alt_input: { type: bool, description: "Alternate input of the input channel: True selects the alternate input, false the main input." }
  inputs.*.input_type: { type: float, description: "Input type of the input channel: Input source type, 0 to 2 as the console numbers it; the source marks this parameter as a guess (mic or line) and names no value." }
  inputs.*.stereo_mode: { type: string, description: "Stereo mode of the input channel: mono or stereo (1, 2 on the wire)." }
  inputs.*.pan: { type: float, description: "Pan of the input channel: Pan position, -1 (left) to +1 (right)." }
  inputs.*.front_back: { type: float, description: "Front-back pan of the input channel: Front-to-back pan position, 0 to 1; the source does not say which end is front." }
  inputs.*.fader: { type: float, unit: dB, description: "Fader level of the input channel: Fader level in dB, -150 (the bottom of the fader) to +10." }
  inputs.*.mute: { type: bool, description: "Muted of the input channel: True mutes the strip, false unmutes it." }
  inputs.*.solo: { type: bool, description: "Soloed of the input channel: True solos the strip, false clears its solo." }
  inputs.*.control_group_level: { type: float, unit: dB, description: "Control group level of the input channel: Level the strip takes from its control groups, in dB, -150 to +10." }
  inputs.*.control_group_mute: { type: bool, description: "Control group mute of the input channel: True when the strip's control groups mute it." }
  inputs.*.delay.enabled: { type: bool, description: "Delay on of the input channel: True switches the channel delay in." }
  inputs.*.delay.time: { type: float, unit: s, description: "Delay time of the input channel: Channel delay in seconds, 0 to 1.3 (1300 ms)." }
  inputs.*.delay.fine: { type: float, unit: samples, description: "Fine delay of the input channel: Fine delay adjustment in samples, -127 to +127." }
