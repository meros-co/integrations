commands:
  set_input_name:
    summary: "Set the name of an input channel (Channel_Input/name)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      name: { type: string, max_length: 64, required: true, label: "Name", description: "Channel name as the console shows it. Up to 64 characters." }
    send: { address: "/Input_Channels/{channel}/Channel_Input/name", args: [ { value: "{name}", type: string } ] }
    returns: none

  set_input_trim:
    summary: "Set the trim of an input channel (Channel_Input/trim)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      value: { type: float, min: -40, max: 60, required: true, label: "Trim", description: "Digital input trim in dB, -40 to +60." }
    send: { address: "/Input_Channels/{channel}/Channel_Input/trim", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_input_phase:
    summary: "Set the phase of an input channel (Channel_Input/phase)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      enabled: { type: bool, default: true, label: "Phase", description: "True inverts the channel's polarity." }
    send: { address: "/Input_Channels/{channel}/Channel_Input/phase", args: [ { value: "{enabled:bool01}", type: float } ] }
    returns: none

  set_input_phantom:
    summary: "Set the phantom power of an input channel (Channel_Input/phantom)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      enabled: { type: bool, default: true, label: "Phantom power", description: "True switches 48 V phantom power on." }
    send: { address: "/Input_Channels/{channel}/Channel_Input/phantom", args: [ { value: "{enabled:bool01}", type: float } ] }
    returns: none

  set_input_alt_phantom:
    summary: "Set the alternate phantom power of an input channel (Channel_Input/alt_phantom)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      enabled: { type: bool, default: true, label: "Alternate phantom power", description: "True switches 48 V phantom power on for the alternate input." }
    send: { address: "/Input_Channels/{channel}/Channel_Input/alt_phantom", args: [ { value: "{enabled:bool01}", type: float } ] }
    returns: none

  set_input_analog_gain:
    summary: "Set the analogue gain of an input channel (Channel_Input/analog_gain)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      value: { type: float, min: -20, max: 60, required: true, label: "Analogue gain", description: "Analogue preamp gain in dB, -20 to +60." }
    send: { address: "/Input_Channels/{channel}/Channel_Input/analog_gain", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_input_alt_analog_gain:
    summary: "Set the alternate analogue gain of an input channel (Channel_Input/alt_analog_gain)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      value: { type: float, min: -20, max: 60, required: true, label: "Alternate analogue gain", description: "Analogue preamp gain of the alternate input in dB, -20 to +60." }
    send: { address: "/Input_Channels/{channel}/Channel_Input/alt_analog_gain", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_input_pad:
    summary: "Set the pad of an input channel (Channel_Input/input_pad)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      enabled: { type: bool, default: true, label: "Pad", description: "True switches the input pad in." }
    send: { address: "/Input_Channels/{channel}/Channel_Input/input_pad", args: [ { value: "{enabled:bool01}", type: float } ] }
    returns: none

  set_input_alt_pad:
    summary: "Set the alternate pad of an input channel (Channel_Input/alt_input_pad)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      enabled: { type: bool, default: true, label: "Alternate pad", description: "True switches the alternate input's pad in." }
    send: { address: "/Input_Channels/{channel}/Channel_Input/alt_input_pad", args: [ { value: "{enabled:bool01}", type: float } ] }
    returns: none

  set_input_alt_input:
    summary: "Set the alternate input of an input channel (Channel_Input/main/alt_in)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      enabled: { type: bool, default: true, label: "Alternate input", description: "True selects the alternate input, false the main input." }
    send: { address: "/Input_Channels/{channel}/Channel_Input/main/alt_in", args: [ { value: "{enabled:bool01}", type: float } ] }
    returns: none

  set_input_input_type:
    summary: "Set the input type of an input channel (Channel_Input/input_type)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      value: { type: float, min: 0, max: 2, required: true, label: "Input type", description: "Input source type, 0 to 2 as the console numbers it; the source marks this parameter as a guess (mic or line) and names no value." }
    send: { address: "/Input_Channels/{channel}/Channel_Input/input_type", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_input_stereo_mode:
    summary: "Set the stereo mode of an input channel (Channel_Input/stereo_mode)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      value: { type: enum, values: ["mono", "stereo"], required: true, label: "Stereo mode", description: "mono or stereo (1, 2 on the wire)." }
    send: { address: "/Input_Channels/{channel}/Channel_Input/stereo_mode", args: [ { value: "{value:map.stereo_mode}", type: float } ] }
    returns: none

  set_input_pan:
    summary: "Set the pan of an input channel (Panner/pan)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      value: { type: float, min: -1, max: 1, required: true, label: "Pan", description: "Pan position, -1 (left) to +1 (right)." }
    send: { address: "/Input_Channels/{channel}/Panner/pan", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_input_front_back:
    summary: "Set the front-back pan of an input channel (Panner/f-b)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      value: { type: float, min: 0, max: 1, required: true, label: "Front-back pan", description: "Front-to-back pan position, 0 to 1; the source does not say which end is front." }
    send: { address: "/Input_Channels/{channel}/Panner/f-b", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_input_fader:
    summary: "Set the fader level of an input channel (fader)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      value: { type: float, min: -150, max: 10, required: true, label: "Fader level", description: "Fader level in dB, -150 (the bottom of the fader) to +10." }
    send: { address: "/Input_Channels/{channel}/fader", args: [ { value: "{value}", type: float } ] }
    returns: none

  mute_input:
    summary: "Set the muted of an input channel (mute)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      muted: { type: bool, default: true, label: "Muted", description: "True mutes the strip, false unmutes it." }
    send: { address: "/Input_Channels/{channel}/mute", args: [ { value: "{muted:bool01}", type: float } ] }
    returns: none

  solo_input:
    summary: "Set the soloed of an input channel (solo)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      soloed: { type: bool, default: true, label: "Soloed", description: "True solos the strip, false clears its solo." }
    send: { address: "/Input_Channels/{channel}/solo", args: [ { value: "{soloed:bool01}", type: float } ] }
    returns: none

  set_input_cgs_level:
    summary: "Set the control group level of an input channel (CGs_level)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      value: { type: float, min: -150, max: 10, required: true, label: "Control group level", description: "Level the strip takes from its control groups, in dB, -150 to +10." }
    send: { address: "/Input_Channels/{channel}/CGs_level", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_input_cgs_mute:
    summary: "Set the control group mute of an input channel (CGs_mute)"
    params:
