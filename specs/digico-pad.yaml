    send: { address: "/Group_Outputs/{group}/Aux_Send/{aux}/send_pre-post", args: [ { value: "{value}", type: float } ] }
    returns: none

  set_input_group_send:
    summary: "Set the routed to group of an input channel's send to a group output (Group_Send/<n>/group)"
    params:
      channel: { type: int, min: 1, max: 384, required: true, label: Channel, description: "The input channel, numbered from 1 as on the console (up to 384)." }
      group: { type: int, min: 1, max: 192, required: true, label: Group output, description: "The group output, numbered from 1 as on the console (up to 192)." }
      enabled: { type: bool, default: true, label: "Routed to group", description: "True routes the channel to the group; the source marks this parameter as a guess." }
    send: { address: "/Input_Channels/{channel}/Group_Send/{group}/group", args: [ { value: "{enabled:bool01}", type: float } ] }
    returns: none

  set_group_group_send:
    summary: "Set the routed to group of a group output's send to a group output (Group_Send/<n>/group)"
    params:
      group: { type: int, min: 1, max: 192, required: true, label: Group output, description: "The group output, numbered from 1 as on the console (up to 192)." }
      to_group: { type: int, min: 1, max: 192, required: true, label: Group output, description: "The group output, numbered from 1 as on the console (up to 192)." }
      enabled: { type: bool, default: true, label: "Routed to group", description: "True routes the group to the other group; the source marks this parameter as a guess." }
