quirks:
  - models: [all]
    severity: info
    text: >
      A command is "V", the projector ID as two digits (99 for all, the projector_id
      setting), "G" to read or "S" to set, the four-digit code and, for a set, the value as
      ASCII digits with a minus sign when negative ("V99S0309-20"), ended by CR. The answer
      is "P" (pass) followed by the value for a read, or "F" (fail). The answer does not
      repeat the code, so the reply to each read is matched to the read that asked for it,
      and a set's "P" does not update state until the next poll.
  - models: [all]
    severity: warning
    text: >
      The network port is "RS232 by Telnet" on TCP 23 and the document gives no further
      detail of it (a Telnet option negotiation, a login or a delay between commands); the
      queue sends one command after each answer.
  - models: [all]
    severity: critical
    text: >
      system_reset restores the factory settings and cannot be undone. power_off starts the
      cool-down.
  - models: [all]
    severity: info
    text: >
      Power on is "op power.on" from software V04; the document says VXXS0001 is replaced
      and gives no answer for the op form, so P, F or an "OP" line ends it. Inputs are
      selected with one code each (select_input) and read back with get_source.
  - models: [all]
    severity: info
    text: >
      API limits: the command set has no lens, color gain, edge blend or network commands
      and no temperatures; the light source power level of Custom Light cannot be set. The
      document lists some codes and values as not used on the 6500 II B (display mode 7,
      inputs 2, 5, 8 and 10).
  - models: [all]
    severity: info
    text: >
      The document's hexadecimal column disagrees with the ASCII column for VXXS0317 (shown
      as 0316) and VXXG0319/VXXS0319 (shown as 0318); the ASCII codes are used.
  - models: [all]
    severity: info
    text: >
      The same commands work on the RS-232 port: 9600 baud, 8 data bits, no parity, 1 stop
      bit, no flow control (UART FIFO disabled). This spec uses the network port.
