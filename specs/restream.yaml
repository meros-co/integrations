quirks:
  - models: [all]
    severity: info
    text: >
      A cloud service. Open the integration with host api.restream.io and
      port 443; it is reached over HTTPS and the certificate is checked
      against that name. It acts for the Restream account that signed in.

  - models: [all]
    severity: warning
    text: >
      The consumer owns the credential. It registers its own Restream
      application (with the scopes of the commands it uses), runs the
      authorization code sign-in at api.restream.io/login itself, and passes
      client_id, refresh_token, access_token and expires_at as settings. The
      access token (1 hour) is refreshed 5 minutes before it expires, or at
      once when there is none. Restream's refresh needs the client secret,
      and Restream says a user's device must not hold it: an open-source or
      installed product sets token_url to its own token proxy, which adds
      the secret and forwards to https://api.restream.io/oauth/token, and
      leaves client_secret empty; only a product that keeps its secret on
      its own server fills client_secret. A 401 refreshes the token and
      sends the request once more; a second 401, or a refresh Restream
      refuses (400 invalid_grant), is terminal: the integration reports
      unauthorized and nothing more is sent until the consumer signs the
      user in again and passes the new tokens with update_settings. A 403
      (insufficient_scope, a feature not on the plan) is an ordinary failure.

  - models: [all]
    severity: critical
    text: >
      Every refresh invalidates the old access and refresh token pair and
      answers a new one. The core reports the new refresh token in a
      credentials event, and the consumer must persist it at once; if it
      keeps the old one, the next open refreshes with a dead token and the
      user must sign in again. One sign-in must feed one open integration
      only: two integrations refreshing with the same refresh token
      invalidate each other. A refresh token lasts a year from the grant
      (the documents do not say whether a refresh extends it), and revoking
      either token at api.restream.io/oauth/revoke revokes the pair.

  - models: [all]
    severity: info
    text: >
      Restream pushes streaming updates (the encoder's incoming bitrate, fps
      and codecs, each destination's CONNECTING, CONNECTED or DISCONNECTED
      status and outgoing bitrate, and each platform's viewers) over a
      websocket at wss://streaming.api.restream.io/ws, and chat over
      wss://chat.api.restream.io/ws, both with the access token in the URL's
      query. The format's push websocket opens on the transport's own host
      and cannot carry a rotating OAuth token in its URL, so neither is
      used: state is polled every 30 seconds (in-progress, upcoming and
      recent events, channels and the selected ingest), and ingest health,
      per-destination status and live viewer counts are not in state. A
      consumer wanting them opens those websockets itself with the access
      token from the latest credentials event. The documents state no rate
      limits.

  - models: [all]
    severity: warning
    text: >
      get_stream_key, get_event_stream_key and get_event_srt_stream_key
      return stream keys and SRT passphrases anyone could stream to the
      account with, and get_chat_url a URL carrying a token: they are
      returned as the command's value only, never kept in state or logged.
      add_rtmp_channel and add_channel send a destination's stream key to
      Restream; it is not kept. Show them to the operator only on demand.

  - models: [all]
    severity: warning
    text: >
      set_channel_enabled, get_channel_meta, set_channel_title,
      set_channel_meta and the channels.*.enabled poll use Restream's earlier
      channel endpoints (/v2/user/channel/{id}, /v2/user/channel/all and
      /v2/user/channel-meta/{id}), which the current reference no longer
      lists; they are taken from the archived reference's navigation and
      Bitfocus's Restream module and are unconfirmed. If Restream has
      removed them they fail (the poll's answer is then ignored), and the
      current API has no other way to switch a channel on or off: attach
      and detach event destinations instead. A title change applies to the
      platform's next or current stream as the platform allows.

  - models: [all]
    severity: critical
    text: >
      delete_channel removes the destination from the account at once and
      can't be undone: an upcoming or in-progress event stops sending to it,
      mid-stream included, and re-adding it needs its stream key again.
      delete_event_destination works only while the event is scheduled (409
      EventInProgress or EventFinished otherwise).

  - models: [all]
    severity: info
    text: >
      Events are keyed in state by their UUID. An event leaves the upcoming
      and in-progress lists as it changes, and its finished status comes
      from the first page of history (the 10 most recent), so an event that
      ends while older ones fill that page keeps its last polled status.
      stream.live is true while any event is in progress; Restream only
      knows an event is in progress once an encoder or Studio streams to
      it. Times are Unix seconds, absent when Restream gives null.

state:
  user.id:                  { type: int, description: "The signed-in account's id (Profile id)" }
  user.username:            { type: string, description: "The signed-in account's username (Profile username)" }
  ingest.selected_id:       { type: int, description: "The ingest server the account streams to, an id from list_ingest_servers (Selected Ingest ingestId)" }
  stream.live:              { type: bool, description: "An event is in progress now (In Progress Events is not empty)" }
  stream.event_id:          { type: string, description: "The UUID of the event in progress, empty when none" }
  channels.*.platform_id:   { type: int, description: "The channel's platform, an id from list_platforms (platformId), keyed by channel id" }
  channels.*.display_name:  { type: string, description: "The channel's name in Restream (displayName)" }
  channels.*.url:           { type: string, description: "The channel's page on its platform (channelUrl)" }
  channels.*.enabled:       { type: bool, description: "The channel is switched on for streaming (legacy channel list enabled; unconfirmed)" }
  events.*.status:          { type: string, description: "upcoming, in-progress, finished or missed, keyed by event UUID" }
  events.*.title:           { type: string, description: "The event's title" }
  events.*.description:     { type: string, description: "The event's description" }
  events.*.scheduled_for:   { type: int, unit: s, description: "When the event is scheduled, Unix seconds (scheduledFor)" }
  events.*.started_at:      { type: int, unit: s, description: "When the event started, Unix seconds (startedAt)" }
  events.*.finished_at:     { type: int, unit: s, description: "When the event finished, Unix seconds (finishedAt)" }
  events.*.record_only:     { type: bool, description: "The event is streamed in record-only mode (isRecordOnly)" }

telemetry:
  # The streaming-updates websocket is on another host with the token in its
  # URL (see quirks): events, channels and the selected ingest are polled
  # every 30 seconds (6 requests).
  poll:
    every_ms: 30000
    send:
      - { method: GET, path: /v2/user/events/in-progress }
      - { method: GET, path: /v2/user/events/upcoming }
      - { method: GET, path: /v2/user/events/history, query: { page: "1", limit: "10" } }
      - { method: GET, path: /v2/user/channels }
      - { method: GET, path: /v2/user/channel/all }
      - { method: GET, path: /v2/user/ingest }
  updates:
    - path: '^/v2/user/profile$'
      json: { id: "$.id", username: "$.username" }
      state:
        user.id: "{id}"
        user.username: "{username}"
    - path: '^/v2/user/ingest$'
      json: { id: "$.ingestId" }
      state: { ingest.selected_id: "{id}" }
    # Live: an event in progress.
    - path: '^/v2/user/events/in-progress$'
      json_each: "$"
      json: &event
        id: "$.id"
        status: "$.status"
        title: "$.title"
        description: "$.description"
        scheduled: "$.scheduledFor"
        started: "$.startedAt"
        finished: "$.finishedAt"
        record_only: "$.isRecordOnly"
      state:
        stream.live: { value: "{status}", map: { "in-progress": true } }
        stream.event_id: "{id}"
        events.{id}.status: "{status}"
        events.{id}.title: "{title}"
        events.{id}.description: "{description}"
        events.{id}.scheduled_for: "{scheduled}"
        events.{id}.started_at: "{started}"
        events.{id}.finished_at: "{finished}"
        events.{id}.record_only: "{record_only}"
    # Nothing in progress.
    - path: '^/v2/user/events/in-progress$'
      json_match: { "$": '^\[\]$' }
      json: {}
      state:
        stream.live: "false"
        stream.event_id: ""
    - path: '^/v2/user/events/upcoming$'
      json_each: "$"
      json: *event
      state: &event_state
        events.{id}.status: "{status}"
        events.{id}.title: "{title}"
        events.{id}.description: "{description}"
        events.{id}.scheduled_for: "{scheduled}"
        events.{id}.started_at: "{started}"
        events.{id}.finished_at: "{finished}"
        events.{id}.record_only: "{record_only}"
    - path: '^/v2/user/events/history\?'
      json_each: "$.items"
      json: *event
      state: *event_state
    # get_event.
    - path: '^/v2/user/events/[0-9a-fA-F-]{36}$'
      json: *event
      state: *event_state
    - path: '^/v2/user/channels$'
      json_each: "$.channels"
      json: &channel { id: "$.id", platform: "$.platformId", name: "$.displayName", url: "$.channelUrl" }
      state: &channel_state
        channels.{id}.platform_id: "{platform}"
        channels.{id}.display_name: "{name}"
        channels.{id}.url: "{url}"
    # get_channel.
    - path: '^/v2/user/channels/\d+$'
      json: *channel
      state: *channel_state
    # The legacy list's enabled flag (unconfirmed).
    - path: '^/v2/user/channel/all$'
      json_each: "$"
      json: { id: "$.id", enabled: "$.enabled" }
      state:
        channels.{id}.enabled: "{enabled}"
