  set_hdr_output_mode:
    summary: "HDR output: automatic or off; HDR PQ and HLG are listed as not yet supported (POST /api/video/config/set hdr-output-mode)"
    params:
      mode: { type: enum, values: [auto, disable, hdr-pq, hlg], required: true, label: HDR output, description: "auto follows the source and display, disable sends SDR; hdr-pq and hlg are documented as not yet supported." }
