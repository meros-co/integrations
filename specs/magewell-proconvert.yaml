    summary: "Phantom (MIC bias) power on the analog input (general-settings or general-apply micbias)"
    params:
      enabled: { type: bool, required: true, label: MIC bias, description: "On powers a microphone that needs bias on the analog input." }
    send:
      - { models: [aes67], method: POST, path: /api/aes67/general-settings, content_type: application/json, body: '{"micbias":{enabled}}' }
      - { models: [audio-dx], method: POST, path: /api/aoip/general-apply, content_type: application/json, body: '{"micbias":{enabled}}' }
    expect: *ok
    returns: ack
  set_igmp_version:
    summary: "IGMP version for multicast streams (general-settings or general-apply igmp)"
