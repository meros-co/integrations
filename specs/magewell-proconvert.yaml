quirks:
  - models: [all]
    severity: critical
    text: >
      select_ndi_source, select_preset, select_source, select_profile,
      select_screen_source and set_config_mode switch the decoded picture at
      once, and ptz_recall_preset moves the camera at once; ptz_store_preset
      overwrites a camera preset, reboot stops the output until the device is
      back, reset_video_config puts every video setting back to its default,
      clear_presets, delete_source and delete_profile cannot be undone, and
      set_network_static and set_network_dhcp move the device to another
      address, where the core no longer reaches it. None asks for
      confirmation.

  - models: [all]
    severity: warning
    text: >
      The API has no push. The status (the summary, and the NDI decoders'
      current source) is polled every 2 seconds; every setting the API can
      read is read on connecting and every 30 seconds, and the settings a
      command changes are read again as soon as the device accepts it. Opened
      for commands only, the core polls nothing and checks the device with
      ping (which needs no login) when it has been quiet for 10 seconds. The
      core logs in before the first request that needs a session and again
      whenever the device answers not logged in (status 37, or HTTP 401),
      repeating that request once; a refused login (status 36, 16 on the IP
      decoders, or HTTP 401 or 403) is final until the settings are corrected.

  - models: [all]
    severity: info
    text: >
      The documents state no port; port 80 (443 over HTTPS) is assumed. The
      session ID arrives only in a Set-Cookie header; the core sends every
      cookie the login set back with each later request, one request at a
      time. ndi.video gives the field rate with two decimals (60.00).
      get-eth-status, get-ntp-server, get-net-access and their setters need
      an administrator login; for another user they fail and their state
      stays empty.

  - models: [all]
    severity: info
    text: >
      Not covered here, as administration rather than operation: user
      accounts, firmware update, logs, reports, cloud registration, factory
      reset, the USB (RNDIS) network, setting the clock (sync-time, whose
      documented date format contradicts its example), certificates, and
      importing or exporting EDIDs, presets and settings as files.

  - models: [ndi-to-hdmi, ndi-to-sdi, ndi-to-aio, ndi-to-hdmi-4k]
    severity: info
    text: >
      Decoder API V1.3 and v1.1 differ in places (set-net-access names,
      the cloud API port); the commands here use only methods both share.
      The output flip, overlays and switch mode are set with
      set-video-config, which takes any subset of its fields. The preset
      list is kept by position (presets.0, presets.1, ...), since preset
      names may hold dots; a preset's shortcut (hotkey) is read but not set
      here. vu-meter-mode is documented as none, db, post-gain-db or
      post-gain-dbfs when read and as none, dbu, dbvu, dbfs and their
      post-gain- forms when set; set_vu_meter_mode sends the set forms and
      the state keeps what the device reports.

  - models: [hdmi-4k-plus, hdmi-plus, hdmi-tx, 12g-sdi-4k-plus, sdi-4k-plus, sdi-plus, sdi-tx]
    severity: info
    text: >
      At most one NDI transport flag may be on; set_ndi_transport sends all
      four, with only the chosen one true (tcp: all false). ndi.transport is
      tcp only when the device reports all four flags off; the document's
      example reply leaves enable-rudp and enable-tcp out, so the separate
      flags (ndi.transport_flags) are the reliable reading. The encoders send
      full-bandwidth NDI only: bit-rate-ratio is the only bitrate control,
      and there is no codec or H.26x setting. ar-convertion is reported only
      while the advanced settings are shown (video.show_advanced). The PTZ
      settings describe the camera attached to the encoder; the encoder has
      no command that moves it, which NDI receivers do through the stream
      (set_ndi_ptz_control).

  - models: [ip-to-hdmi, ip-to-hdmi-4k, ip-to-aio-4k]
    severity: warning
    text: >
      select_source works only in simple mode and select_profile only in
      profile mode (IP Decoder API section 3 and 6). The PTZ commands reach a
      camera only when the decoded source is an NDI source that accepts PTZ;
      the API reads back neither the camera's position nor its presets. The
      document does not give the IP decoders' default credentials; Admin /
      Admin is assumed as on the other Pro Convert models. Numbered values
      (safe area, ident, deinterlace, aspect conversion, signal loss, colour
      space, HDR mode, view mode, configuration mode) are reported in the
      words the commands take. The NDI settings are changed one field at a
      time through /api/settings/ndi/set, whose document example sends every
      field; the reboot schedule is read through /api/system/info, a POST.
