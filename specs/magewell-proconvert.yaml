    summary: "NDI receive transport: TCP (all flags off), multi-TCP, UDP, reliable UDP or multicast (set-ndi-config enable-tcp, enable-udp, enable-rudp, enable-mcast)"
    params:
      transport: { type: enum, values: [tcp, multi-tcp, udp, rudp, multicast], required: true, label: Transport,
        description: "How the decoder asks sources to send; tcp is the single-connection mode with every flag off." }
