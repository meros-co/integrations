      [ping, reboot, get_summary, get_device_info, get_system_info, set_device_name, set_ntp, set_clock,
       set_timezone, set_auto_reboot_days, get_network_interfaces, set_network_dhcp, set_network_static,
       get_usb_mode, set_usb_mode, get_video_config, set_decoder_flip, set_aspect_conversion, get_ndi_discovery,
       set_usb_ndi_discovery, get_no_signal_image, upload_no_signal_image, delete_no_signal_image, get_usb_sources,
       add_source, add_usb_ndi_source, modify_source, delete_source, select_source, get_stream_status]
