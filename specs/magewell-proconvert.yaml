      replace: ndi.sources
      state:
        ndi.sources.{index}.name: "{name}"
        ndi.sources.{index}.address: "{address}"
    # Encoder API section 9.4.
    - path: "^/mwapi\\?method=get-tally$"
      json_match: { "$.status": "^0$" }
      json: { ext: "$.ext-tally" }
      state: { tally.user_controlled: "{ext}" }
    # Encoder API section PTZ, get-ptz-config.
    - path: "^/mwapi\\?method=get-ptz-config$"
      json_match: { "$.status": "^0$" }
      json:
        proto: "$.proto"
        index: "$.index"
        baud: "$.baudrate"
        ip: "$.invert-pan"
        it: "$.invert-tilt"
        addr: "$.ip-addr"
        port: "$.port"
        hdr: "$.visca-msg-hdr"
        pl: "$.pan-left-limit"
        pc: "$.pan-center"
        pr: "$.pan-right-limit"
        tt: "$.tilt-top-limit"
        tc: "$.tilt-center"
        tb: "$.tilt-bottom-limit"
        zo: "$.zoom-out-limit"
        fn: "$.focus-near-limit"
        ff: "$.focus-far-limit"
      state:
        ptz.protocol: "{proto}"
        ptz.camera: "{index}"
        ptz.baudrate: "{baud}"
        ptz.invert_pan: "{ip}"
        ptz.invert_tilt: "{it}"
        ptz.address: "{addr}"
        ptz.port: "{port}"
        ptz.visca_header: "{hdr}"
        ptz.limits.pan_left: "{pl}"
        ptz.limits.pan_center: "{pc}"
        ptz.limits.pan_right: "{pr}"
        ptz.limits.tilt_top: "{tt}"
        ptz.limits.tilt_center: "{tc}"
        ptz.limits.tilt_bottom: "{tb}"
        ptz.limits.zoom_out: "{zo}"
        ptz.limits.focus_near: "{fn}"
        ptz.limits.focus_far: "{ff}"
    # Encoder API section EDID (set-default-edid answers the same fields).
    - path: "^/mwapi\\?method=(get-edid-config|set-default-edid)$"
      json_match: { "$.status": "^0$" }
      json: { smart: "$.smart-edid", keep: "$.keep-last", audio: "$.add-audio", clock: "$.limit-pixel-clock" }
      state:
        edid.smart: "{smart}"
        edid.keep_last: "{keep}"
        edid.add_audio: "{audio}"
        edid.limit_pixel_clock: "{clock}"
