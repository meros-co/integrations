# Nothing is pushed. Status is polled every 2 seconds; settings are read on
# connecting, every 30 seconds, and again after each command that changes
# them (then_send).
telemetry:
  poll:
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-summary-info } }
      - { models: &dec [ndi-to-hdmi, ndi-to-sdi, ndi-to-aio, ndi-to-hdmi-4k], method: GET, path: /mwapi, query: { method: get-channel } }
      - { models: *ip, method: GET, path: /api/system/summary }
    every_ms: 2000
  subscribe:
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-video-config } }
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-ndi-config } }
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-ndi-sources } }
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-auto-reboot } }
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-ntp-server } }
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-net-access } }
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-eth-status } }
      - { models: &enc [hdmi-4k-plus, hdmi-plus, hdmi-tx, 12g-sdi-4k-plus, sdi-4k-plus, sdi-plus, sdi-tx], method: GET, path: /mwapi, query: { method: get-tally } }
      - { models: *enc, method: GET, path: /mwapi, query: { method: get-ptz-config } }
      - { models: *enc, method: GET, path: /mwapi, query: { method: get-edid-config } }
      - { models: *dec, method: GET, path: /mwapi, query: { method: get-video-format } }
      - { models: *dec, method: GET, path: /mwapi, query: { method: get-hdmi-output } }
      - { models: *dec, method: GET, path: /mwapi, query: { method: get-supported-video-modes } }
      - { models: *dec, method: GET, path: /mwapi, query: { method: get-audio-config } }
      - { models: *dec, method: GET, path: /mwapi, query: { method: list-channels } }
      - { models: *dec, method: GET, path: /mwapi, query: { method: get-playback-config } }
      - { models: *ip, method: GET, path: /api/video/config/get }
      - { models: *ip, method: GET, path: /api/video/mode/get }
      - { models: *ip, method: GET, path: /api/audio/config/get }
      - { models: *ip, method: GET, path: /api/source/list, query: { type: all } }
      - { models: *ip, method: GET, path: /api/profile/list }
      - { models: *ip, method: GET, path: /api/settings/get }
      - { models: *ip, method: GET, path: /api/settings/zixi/master/get }
      - { models: *ip, method: POST, path: /api/system/info }
    every_ms: 30000
  updates:
    # Encoder API section 5.1, Decoder API V1.3 section 5.1.
    - path: "^/mwapi\\?method=get-summary-info$"
      json_match: { "$.status": "^0$" }
      json:
        model: "$.device.model"
        name: "$.device.name"
        serial: "$.device.serial-no"
        firmware: "$.device.fw-version"
        up_to_date: "$.device.up-to-date"
        hw: "$.device.hw-revision"
        temperature: "$.device.core-temp"
        uptime: "$.device.up-time"
        cpu: "$.device.cpu-usage"
        memory: "$.device.memory-usage"
        fan: "$.device.fan-rpm"
        board: "$.device.board-id"
        input: "$.device.input-state"
        output: "$.device.output-state"
        ptz_proto: "$.device.ptz-proto"
        ptz_state: "$.device.ptz-state"
        eth_state: "$.ethernet.state"
        mac: "$.ethernet.mac-addr"
        ip: "$.ethernet.ip-addr"
        mask: "$.ethernet.ip-mask"
        gw: "$.ethernet.gw-addr"
        dns: "$.ethernet.dns-addr"
        tx: "$.ethernet.tx-speed-kbps"
        rx: "$.ethernet.rx-speed-kbps"
        ndi_name: "$.ndi.name"
        url: "$.ndi.url"
        enabled: "$.ndi.enabled"
        connected: "$.ndi.connected"
        clients: "$.ndi.num-clients"
        kbps: "$.ndi.video-bit-rate"
        akbps: "$.ndi.audio-bit-rate"
        vdrops: "$.ndi.video-drop-frames"
        adrops: "$.ndi.audio-drop-frames"
        achannels: "$.ndi.audio-num-channels"
        arate: "$.ndi.audio-sample-rate"
        width: "$.ndi.video-width"
        height: "$.ndi.video-height"
        scan: "$.ndi.video-scan"
        rate: "$.ndi.video-field-rate"
        preview: "$.ndi.tally-preview"
        program: "$.ndi.tally-program"
      state:
        device.model: "{model}"
        device.name: "{name}"
        device.serial: "{serial}"
        device.firmware: "{firmware}"
        device.firmware_up_to_date: "{up_to_date}"
        device.hardware_revision: "{hw}"
        device.temperature: "{temperature}"
        device.uptime: "{uptime}"
        device.cpu_usage: "{cpu}"
        device.memory_usage: "{memory}"
        device.fan_rpm: "{fan}"
        device.board_id: "{board}"
        device.input_state: "{input}"
        device.output_state: "{output}"
        ptz.protocol: "{ptz_proto}"
        ptz.state: "{ptz_state}"
        network.ethernet.state: "{eth_state}"
        network.ethernet.mac: "{mac}"
        network.ethernet.ip_address: "{ip}"
        network.ethernet.netmask: "{mask}"
        network.ethernet.gateway: "{gw}"
        network.ethernet.dns: "{dns}"
        network.ethernet.tx_kbps: "{tx}"
        network.ethernet.rx_kbps: "{rx}"
        ndi.name: "{ndi_name}"
        ndi.url: "{url}"
        ndi.enabled: "{enabled}"
        ndi.clients: "{clients}"
        ndi.video_kbps: "{kbps}"
        ndi.audio_kbps: "{akbps}"
        ndi.video_drops: "{vdrops}"
        ndi.audio_drops: "{adrops}"
        ndi.audio_channels: "{achannels}"
        ndi.audio_sample_rate: "{arate}"
        ndi.video: "{width}x{height} {scan} {rate:.2f}"
        tally.preview: "{preview}"
        tally.program: "{program}"
    # Decoder API V1.3 section 5.1: an NDI decoder reports connected for enabled.
    - path: "^/mwapi\\?method=get-summary-info$"
      json_match: { "$.status": "^0$" }
      json: { connected: "$.ndi.connected" }
      state: { ndi.enabled: "{connected}" }
    # IP Decoder API section 2: the first stream of the current profile.
    - path: "^/api/system/summary$"
      json_match: { "$.status": "^0$" }
      json:
        model: "$.product-name"
        name: "$.device-name"
        serial: "$.serial-number"
        firmware: "$.firmware-ver"
        hw: "$.hardware-rev"
        temperature: "$.core-temp"
        uptime: "$.uptime"
        fan: "$.fan-speed"
        hdmi: "$.hdmi-state"
        ndi_name: "$.profile.streams[0].name"
        kbps: "$.profile.streams[0].video.kbps"
        akbps: "$.profile.streams[0].audio.kbps"
        achannels: "$.profile.streams[0].audio.num-channels"
        arate: "$.profile.streams[0].audio.sample-rate"
        preview: "$.profile.streams[0].extra.tally-preview"
        program: "$.profile.streams[0].extra.tally-program"
        ptz: "$.ptz.enabled"
        profile: "$.profile.id"
      state:
        device.model: "{model}"
        device.name: "{name}"
        device.serial: "{serial}"
        device.firmware: "{firmware}"
        device.hardware_revision: "{hw}"
        device.temperature: "{temperature}"
        device.uptime: "{uptime}"
        device.fan_rpm: "{fan}"
        device.output_state: "{hdmi}"
        ndi.name: "{ndi_name}"
        ndi.video_kbps: "{kbps}"
        ndi.audio_kbps: "{akbps}"
        ndi.audio_channels: "{achannels}"
        ndi.audio_sample_rate: "{arate}"
        tally.preview: "{preview}"
        tally.program: "{program}"
        ptz.enabled: "{ptz}"
        profile.current_id: "{profile}"
    - path: "^/api/system/summary$"
      json_match: { "$.status": "^0$" }
      json: { mode: "$.mode" }
      state: { config.mode: { value: "{mode}", map: { "1": simple, "2": profile } } }

    # Encoder API section 7.1 (get-video-config; reset-video-config answers
    # the same fields).
    - path: "^/mwapi\\?method=(get|reset)-video-config$"
      json_match: { "$.status": "^0$", "$.out-raw-resolution": "^(true|false)$" }
      json:
        adv: "$.show-adv-ui"
        brightness: "$.brightness"
        contrast: "$.contrast"
        hue: "$.hue"
        saturation: "$.saturation"
        deinterlace: "$.deinterlace"
        flip: "$.out-flip"
        mirror: "$.out-mirror"
        cx: "$.out-cx"
        cy: "$.out-cy"
        raw: "$.out-raw-resolution"
        ratio: "$.bit-rate-ratio"
        in_aspect_auto: "$.in-auto-aspect"
        in_x: "$.in-aspect-x"
        in_y: "$.in-aspect-y"
        in_color_auto: "$.in-auto-color-fmt"
        in_color: "$.in-color-fmt"
        in_quant_auto: "$.in-auto-quant-range"
        in_quant: "$.in-quant-range"
        ar: "$.ar-convertion"
