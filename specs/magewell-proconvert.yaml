      rate: { type: enum, values: ["44100", "48000", "88200", "96000"], required: true, label: Sample rate, description: "Sample rate of the device, in Hz." }
    send: { models: [audio-dx], method: POST, path: /api/aoip/general-apply, content_type: application/json, body: '{"tx-sample-rate":"{rate}"}' }
