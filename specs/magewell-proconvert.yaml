    send: { models: *base, method: POST, path: /api/system/info }
    expect: *value
    returns: value
  set_auto_reboot_days:
    summary: "Schedule a weekly reboot (POST /api/system/auto-reboot)"
    params:
      enabled: { type: bool, required: true, label: Auto reboot, description: "On reboots the device at the time and on the days given." }
      hour: { type: int, min: 0, max: 23, default: 3, label: Hour, description: "Hour of the reboot, 0 to 23." }
      minute: { type: int, min: 0, max: 59, default: 0, label: Minute, description: "Minute of the reboot, 0 to 59." }
      days: { type: string, default: "", pattern: "^([1-7](,[1-7]){0,6})?$", label: Days,
        description: "Days separated by commas, 1 Monday to 7 Sunday, e.g. 1,2,3,4,5." }
