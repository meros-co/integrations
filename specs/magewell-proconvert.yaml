      json: { iface: "$.iface", type: "$.type" }
      state: { "network.interfaces.{iface}.type": { value: "{type}", map: { "0": ethernet, "1": wifi, "2": usb-sharing, "3": usb, "4": cellular, "5": bridge } } }
    - path: "^/api/network/if-info$"
      json_match: { "$.status": "^0$" }
      json_each: "$.net"
      json: { iface: "$.iface", enabled: "$.enable", dhcp: "$.use-dhcp", ip: "$.ipaddr", mask: "$.netmask", gw: "$.gateway",
              dns1: "$.dns1", dns2: "$.dns2", mac: "$.mac", speed: "$.link-speed", link: "$.link-state",
              tx: "$.tx-speed-kbps", rx: "$.rx-speed-kbps" }
      replace: network.interfaces
      state:
        network.interfaces.{iface}.enabled: "{enabled}"
        network.interfaces.{iface}.dhcp: "{dhcp}"
        network.interfaces.{iface}.ip_address: "{ip}"
        network.interfaces.{iface}.netmask: "{mask}"
        network.interfaces.{iface}.gateway: "{gw}"
        network.interfaces.{iface}.dns1: "{dns1}"
        network.interfaces.{iface}.dns2: "{dns2}"
        network.interfaces.{iface}.mac: "{mac}"
        network.interfaces.{iface}.link_speed: "{speed}"
        network.interfaces.{iface}.link_state: { value: "{link}", map: { "0": down, "1": disconnected, "2": connected } }
        network.interfaces.{iface}.tx_kbps: "{tx}"
        network.interfaces.{iface}.rx_kbps: "{rx}"
    - path: "^/api/network/if-route$"
      json_match: { "$.status": "^0$" }
      json: { iface: "$.iface" }
      state: { network.default_route: "{iface}" }
    - path: "^/api/network/get-dns$"
      json_match: { "$.status": "^0$" }
      json: { manual: "$.is-manual", dns1: "$.dns1", dns2: "$.dns2" }
      state:
        network.dns.manual: "{manual}"
        network.dns.primary: "{dns1}"
        network.dns.secondary: "{dns2}"
    # IP to USB API sections 3.7-3.8 (the summary's example names the
    # temperature cpu_temp, its table cpu-temp).
    - path: "^/api/system/summary/get$"
      json_match: { "$.status": "^0$" }
      json: { temp: "$.data.cpu_temp" }
      state: { device.temperature: "{temp}" }
    - path: "^/api/system/summary/get$"
      json_match: { "$.status": "^0$" }
      json: { temp: "$.data.cpu-temp" }
      state: { device.temperature: "{temp}" }
    - path: "^/api/system/usb-mode/get$"
      json_match: { "$.status": "^0$" }
      json: { mode: "$.data.mode" }
      state: { usb.mode: { value: "{mode}", map: { "Normal mode": video-conferencing, "Content mode": content-sharing } } }
    # IP to USB API sections 4.1, 5.1 and 6.3.
    - models: [ip-to-usb]
      path: "^/api/video/config/get$"
      json_match: { "$.status": "^0$" }
      json: { h: "$.data.h_flip", v: "$.data.v_flip", ar: "$.data.ar_convert_mode" }
      state:
        video.h_flip: "{h}"
        video.v_flip: "{v}"
        video.aspect_conversion: { value: "{ar}", map: { Windowbox: windowbox, Crop: zoom, Stretch: full } }
    - path: "^/api/ndi/config/get$"
      json_match: { "$.status": "^0$" }
      json: { enabled: "$.data.enable", servers: "$.data.discovery_server", groups: "$.data.groups" }
      state:
        ndi.discovery.enabled: "{enabled}"
        ndi.discovery.servers: "{servers}"
        ndi.groups: "{groups}"
    - path: "^/api/resource/image/get$"
      json_match: { "$.status": "^0$", "$.data.id": "^([A-Za-z0-9_-]+)$" }
      json: { path: "$.data.path", default: "$.data.is_default" }
      state:
        video.no_signal_images.{1}.path: "{path}"
        video.no_signal_images.{1}.default: "{default}"
    # IP to USB API section 7.1: each list whole, keyed by source id.
    - path: "^/api/source/list\\?type=static$"
      json_match: { "$.status": "^0$" }
      json_each: "$.data"
      json: { id: "$.id", name: "$.config.name", protocol: "$.config.protocol", type: "$.config.type", buffer: "$.config.data.buffer_ms" }
      replace: sources
      state:
        sources.{id}.name: "{name}"
        sources.{id}.protocol: "{protocol}"
        sources.{id}.source_type: "{type}"
        sources.{id}.buffer_ms: "{buffer}"
        sources.{id}.kind: static
    - path: "^/api/source/list\\?type=static$"
      json_match: { "$.status": "^0$" }
      json_each: "$.data"
      each_match: { "$.config.type": "^url$" }
      json: { id: "$.id", url: "$.config.data.url", ptz: "$.config.data.ptz_en", proto: "$.config.data.ptz.protocol",
              ip: "$.config.data.ptz.ip", port: "$.config.data.ptz.port", camera: "$.config.data.ptz.device_id",
              header: "$.config.data.ptz.message_header", pan: "$.config.data.ptz.invert_pan",
              tilt: "$.config.data.ptz.invert_tilt" }
      state:
        sources.{id}.url: "{url}"
        sources.{id}.ptz_enabled: "{ptz}"
        sources.{id}.ptz.protocol: "{proto}"
        sources.{id}.ptz.address: "{ip}"
        sources.{id}.ptz.port: "{port}"
        sources.{id}.ptz.camera: "{camera}"
        sources.{id}.ptz.header: "{header}"
        sources.{id}.ptz.invert_pan: "{pan}"
        sources.{id}.ptz.invert_tilt: "{tilt}"
    - path: "^/api/source/list\\?type=static$"
      json_match: { "$.status": "^0$" }
      json_each: "$.data"
      each_match: { "$.config.type": "^(ndi|d_ndi)$" }
      json: { id: "$.id", name: "$.config.data.name", url: "$.config.data.url", low: "$.config.data.low_bw",
              transport: "$.config.data.transport", pts: "$.config.data.pts_mode" }
      state:
        sources.{id}.ndi_name: "{name}"
        sources.{id}.ndi_url: "{url}"
        sources.{id}.low_bandwidth: "{low}"
        sources.{id}.transport: "{transport}"
        sources.{id}.pts_mode: "{pts}"
    - path: "^/api/source/list\\?type=dynamic$"
      json_match: { "$.status": "^0$" }
      json_each: "$.data"
      json: { id: "$.id", name: "$.config.data.name", url: "$.config.data.url" }
      replace: ndi.discovered
      state:
        ndi.discovered.{id}.name: "{name}"
        ndi.discovered.{id}.address: "{url}"
    - path: "^/api/source/list\\?type=(static|dynamic)$"
      json_match: { "$.status": "^0$" }
      json: { selected: "$.selected" }
      state: { source.selected_id: "{selected}" }
    # IP to USB API section 8.1 (its example names the tally
    # extra.tally_preview, its table tally-prview).
    - path: "^/api/stream/status/get$"
      json_match: { "$.status": "^0$" }
      json: { name: "$.data.name", protocol: "$.data.protocol", state: "$.data.state", uptime: "$.data.uptime",
              preview: "$.data.extra.tally_preview", program: "$.data.extra.tally_program",
              vcodec: "$.data.video.codec", vjitter: "$.data.video.jitter", vkbps: "$.data.video.kbps",
              width: "$.data.video.width", height: "$.data.video.height", rate: "$.data.video.field_rate",
              vdrops: "$.data.video.drops", acodec: "$.data.audio.codec", ajitter: "$.data.audio.jitter",
              akbps: "$.data.audio.kbps", arate: "$.data.audio.sample_rate", bits: "$.data.audio.bit_count",
              channels: "$.data.audio.channels", adrops: "$.data.audio.drops" }
      state:
        stream.name: "{name}"
        stream.protocol: "{protocol}"
        stream.state: "{state}"
        stream.uptime_ms: "{uptime}"
        tally.preview: "{preview}"
        tally.program: "{program}"
        stream.video.codec: "{vcodec}"
        stream.video.jitter: "{vjitter}"
        stream.video.kbps: "{vkbps}"
        stream.video.width: "{width}"
        stream.video.height: "{height}"
        stream.video.field_rate: "{rate}"
        stream.video.drops: "{vdrops}"
        stream.audio.codec: "{acodec}"
        stream.audio.jitter: "{ajitter}"
        stream.audio.kbps: "{akbps}"
        stream.audio.sample_rate: "{arate}"
        stream.audio.bit_depth: "{bits}"
        stream.audio.channels: "{channels}"
        stream.audio.drops: "{adrops}"

