      enabled: { type: bool, required: true, label: Automatic, description: "On uses BT.601 for SD and BT.709 for HD sources; off uses the colour space set." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, in-auto-color-fmt: "{enabled}" } }
    expect: *ok
    returns: ack
  set_follow_input:
