spec: 1
id: magewell-proconvert
name: Magewell Pro Convert
vendor: Magewell
category: other

source:
  - title: "Magewell Pro Convert Encoder API (unversioned; examples from firmware 1.1.72)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/pro-convert-encoder-api/"
    note: >
      Manufacturer-documented, public. GET http://IP/mwapi?method=<name>&...,
      JSON replies with an integer status, 0 for success, and the status code
      table (sections 1.2-1.3); ping, get-caps, reboot (section 2); login with
      id and the MD5 of the password, the sid cookie, logout (section 4);
      get-summary-info with device, ethernet and ndi objects including
      input-state and the NDI tally-preview and tally-program (section 5.1);
      get-signal-info (6.1); get-video-config and set-video-config with
      brightness, contrast, hue, saturation, deinterlace, out-flip,
      out-mirror, out-cx, out-cy, out-raw-resolution and bit-rate-ratio
      (section 7); get-ndi-config and set-ndi-config with enable,
      source-name, group-name, enable-web-control, enable-ptz-control,
      fail-over, the four transport flags of which at most one may be true,
      the multicast address, mask and TTL, discovery server and
      reference-level 20 (SMPTE) or 14 (EBU) (sections 9.1-9.2);
      get-ndi-sources; get-tally and set-tally ext-tally (9.4-9.5). Retrieved
      again 2026-10-09 for the rest of the video configuration (the input and
      output auto switches, colour space, quantization and saturation range,
      aspect ratios, frame-rate conversion, ar-convertion, low-res-full-fr,
      reset-video-config), the NDI vendor fields, get-ptz-config,
      set-ptz-config and arrange-ptz-cameras, get-edid-config,
      set-edid-config and set-default-edid, get-auto-reboot and
      set-auto-reboot, get-eth-status and set-eth-config, get-net-access and
      set-net-access, get-ntp-server and set-ntp-server, and the summary's
      device, ethernet and ndi fields.
  - title: "Magewell Pro Convert Decoder API V1.3 (firmware V1.3), and v1.1"
    author: Magewell
    url: "https://www.magewell.com/api-docs/pro-convert-decoder-api/v1.3/"
    note: >
      Manufacturer-documented, public. The same transport, login and status
      codes 0-55 (sections 1.3-1.4, 4.1); get-summary-info with the decoded
      source's ndi object, url and tally (5.1); get-signal-info for the
      decoded source (6.1); get-video-config and set-video-config with
      show-title, show-tally, show-vu-meter, show-center-cross, h-flip,
      v-flip, switch-mode, ar-convert-mode, deinterlace-mode (7.1-7.3);
      get-supported-video-modes and set-video-mode (7.5-7.6); get-hdmi-output
      and set-hdmi-output (7.9-7.10); get-audio-config and set-audio-config
      gain -100.00 to 20.00 dB (8.1-8.2); list-channels, get-ndi-sources,
      get-channel and set-channel with ndi-name true (a discovered source) or
      false (a preset), add-channel, del-channel, get-playback-config and
      set-playback-config buffer-duration (sections 10-11); get-ndi-config
      and set-ndi-config with enable-discovery, discovery-server and
      group-name (11.1-11.2). v1.1 adds Pro Convert for NDI to HDMI 4K to the
      product list. Retrieved again 2026-10-09 for the rest of
      get-video-config and set-video-config (vu-meter-mode, safe-area-mode,
      ident-mode and ident-text, reset-source-on-boot, deinterlace-mode,
      in-auto-color-fmt and in-color-fmt, follow-input-mode),
      reset-video-config, get-video-format and set-video-format,
      get-hdmi-output, the rest of get-audio-config and set-audio-config
      (sample-rate, channels, ch0-ch15, check-pts, convert-mode),
      modify-channel and clear-channels, get-playback-config, the rest of
      get-ndi-config and set-ndi-config (mcast-subnets, low-bandwidth, the
      transport flags, ignore-ndi-hx-video-pts, use-timecode-first), and the
      same auto-reboot, network and NTP methods as the Encoder API.
  - title: "Magewell Pro Convert IP Decoder API V1.2 (firmware V1.2)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/pro-convert-ip-decoder-api/latest/"
    note: >
      Manufacturer-documented, public. JSON requests under /api with a status
      in every reply (1.2-1.3); POST /api/user/login with the SHA-256 of the
      password, the reply's sid and the sid-<serial number> cookie, valid
      until the device restarts (section 15); GET /api/system/summary (2);
      GET /api/source/list, POST /api/source/select (simple mode only) and
      /api/source/restart (3); /api/audio/config/set gain (5); profile list,
      select and screen select (6); PTZ move, zoom, focus, auto focus and
      preset recall and store through the decoded NDI source (7);
      GET /api/signal/info (10); /api/ping without login and /api/reboot
      (12). Retrieved again 2026-10-09 for the source list's shape and
      /api/source/add, /del and /set; /api/video/config/get and /set with
      their numbered values and the Common Types page; /api/video/mode/get
      and /set and /api/video/screen/wakeup; /api/audio/config/get and /set;
      /api/profile/list, /add, /del and /set; /api/settings/get,
      /settings/mode/set, /settings/ndi/set, /settings/gui/set and the Zixi
      ZEN Master get and set; and the base pages Get basic info
      (POST /api/system/info, with the reboot schedule and NTP), Schedule
      automatic reboots and Set device name.
  - title: "Pro Convert Decoder User Manual, and the Pro Convert knowledge base"
    author: Magewell
    url: "https://www.magewell.com/files/documents/User_Manual/ProConvert_Decoder-UserManual_en_US.pdf"
    note: >
      Default credentials Admin / Admin, case sensitive; the web interface
      signs out after ten minutes idle; USB address 192.168.66.1 and DHCP on
      Ethernet by default; HTTPS on decoders after uploading a certificate.
  - title: "companion-module-magewell-proconvert-decoder (Bitfocus Companion module)"
    author: Bitfocus
    url: "https://github.com/bitfocus/companion-module-magewell-proconvert-decoder"
    note: >
      Community source (MIT licence), read as corroboration only: it logs in
      with GET login and the MD5 of the password, sends the session cookie it
      received on every request, logs in again on status 37, and polls; there
      is no push.

settings:
  username:
    type: string
    default: Admin
    max_length: 64
    label: User name
    description: "The user the core logs in as; Admin by default."
  password:
    type: string
    secret: true
    default: Admin
    max_length: 64
    label: Password
    description: "That user's password; the core sends only its MD5 (encoders, NDI decoders) or SHA-256 (IP decoders) hash."
  scheme:
    type: enum
    values: [http, https]
    default: http
    label: Scheme
    description: "http, or https once a certificate is installed on a decoder; the certificate is not checked."

ports:
  - { port: 80, protocol: http, role: control, note: "the documents state no port; the web interface's standard port is assumed", when: "scheme http" }
  - { port: 443, protocol: https, role: control, setting: scheme, when: "scheme https" }

# Two APIs: the encoders and first-generation NDI decoders take
# GET /mwapi?method=<name> (Encoder API, Decoder API V1.3), the IP decoders
# JSON under /api (IP Decoder API V1.2). Each message names the models it is
# for. Every reply carries an integer status, 0 for success.
transport:
  type: http
  port: 80
  https_port: 443
  scheme: { setting: scheme }
  # HTTPS only after a certificate is uploaded to a decoder (user manual).
  accept_invalid_certs: true
  timeout_ms: 5000
  # ping needs no login (Encoder API section 2, IP Decoder API section 12).
  probe:
    - { models: &mw [hdmi-4k-plus, hdmi-plus, hdmi-tx, 12g-sdi-4k-plus, sdi-4k-plus, sdi-plus, sdi-tx,
                     ndi-to-hdmi, ndi-to-sdi, ndi-to-aio, ndi-to-hdmi-4k],
        method: GET, path: /mwapi, query: { method: ping } }
    - { models: &ip [ip-to-hdmi, ip-to-hdmi-4k, ip-to-aio-4k], method: GET, path: /api/ping }
  # The session ID comes back only in Set-Cookie (sid, or sid-<serial number>
  # on the IP decoders) and goes back as a cookie on every later request.
  session:
    login:
      # Encoder API section 4: id and the MD5 of the password.
      - { models: *mw, method: GET, path: /mwapi,
          query: { method: login, id: "{settings.username}", pass: "{settings.password:md5}" } }
      # IP Decoder API section 15: the SHA-256 of the password, as JSON.
      - { models: *ip, method: POST, path: /api/user/login, content_type: application/json,
          body: '{"username":{settings.username:json},"password":"{settings.password:sha256}"}' }
    capture: { cookie: "*" }
    # 37 "not logged in": the session ended (a restart, or idle).
    relogin: { status: [401], json: { "$.status": "^37$" } }
    # 36 "authentication failed"; 16 "does not exist" (an unknown user on
    # the IP decoders).
    refused: { status: [401, 403], json: { "$.status": "^(36|16)$" } }

# The status codes of Encoder API section 1.3 and Decoder API V1.3 section 1.4.
codes:
  "1": pending
  "2": timeout
  "3": interrupted
  "4": try again
  "5": not implemented
  "6": unknown error
  "7": invalid argument
  "8": no memory
  "9": unsupported
  "10": file busy
  "11": device busy
  "12": device lost
  "13": I/O failed
  "14": read failed
  "15": write failed
  "16": does not exist
  "17": too many
  "18": too large
  "19": overflow
  "20": underflow
  "21": format error
  "22": file exists
  "23": file type error
  "24": device type error
  "25": is a directory
  "26": read only
  "27": range error
  "28": broken pipe
  "29": no space
  "30": not a directory
  "31": not permitted
  "32": bad address
  "33": seek error
  "34": cross-device link
  "35": not initialized
  "36": authentication failed
  "37": not logged in
  "38": wrong state
  "39": mismatch
  "40": verify failed
  "41": constraint violation
  "42": canceled
  "43": in progress
  "44": connection refused
  "45": connection reset
  "46": address in use
  "47": no response
  "48": information changed
  "49": invalid data
  "50": need more data
  "51": no buffer
  "52": buffer too small
  "53": buffer is empty
  "54": buffer is full
  "55": network unreachable

maps:
  # set-ndi-config's transport flags: at most one true (section 9.2); TCP
  # is all four false.
  ndi_mcast: { tcp: "false", multi-tcp: "false", udp: "false", rudp: "false", multicast: "true" }
  ndi_rudp: { tcp: "false", multi-tcp: "false", udp: "false", rudp: "true", multicast: "false" }
  ndi_multi_tcp: { tcp: "false", multi-tcp: "true", udp: "false", rudp: "false", multicast: "false" }
  ndi_udp: { tcp: "false", multi-tcp: "false", udp: "true", rudp: "false", multicast: "false" }
  reference_level: { smpte: "20", ebu: "14" }
  # Decoder API V1.3 section 7.3: the overlay switches of set-video-config.
  overlay_field: { title: show-title, tally: show-tally, vu-meter: show-vu-meter, center-cross: show-center-cross }
  # Encoder API section 7: each "auto" switch of set-video-config.
  video_auto_field: { input-aspect: in-auto-aspect, input-color-format: in-auto-color-fmt,
                      input-quant-range: in-auto-quant-range, output-aspect: out-auto-aspect,
                      output-color-format: out-auto-color-fmt, output-sat-range: out-auto-sat-range,
                      output-quant-range: out-auto-quant-range }
  # Decoder API V1.3 section 8.2: 0 follows the source.
  sample_rate: { follow: "0", "32000": "32000", "44100": "44100", "48000": "48000", "88200": "88200", "96000": "96000" }
  audio_channels: { follow: "0", "2": "2", "4": "4", "8": "8" }
  # IP Decoder API V1.2, section 5 (convert-mode) and the video
  # configuration's numbered values (section 4 and Common Types).
  convert_mode_ip: { smpte: "0", ebu: "1" }
  safe_area_ip: { none: "0", "4:3": "1", "80%": "2", square: "3" }
  ar_convert_ip: { windowbox: "0", zoom: "1", full: "2" }
  vu_scale_ip: { hide: "0", post-dbvu: "1", post-dbfs: "2" }
  ident_ip: { none: "0", text: "1", source-name: "2" }
  deinterlace_ip: { bob: "0", weave: "1", blend: "2" }
  in_color_ip: { auto: "0", bt.601: "1", bt.709: "2", bt.2020: "3" }
  hdr_output_ip: { auto: "0", disable: "1", hdr-pq: "2", hlg: "3" }
  signal_loss_ip: { no-signal-image: "0", black: "1", last-frame: "2", output-off: "3" }
  config_mode_ip: { simple: "1", profile: "2" }

