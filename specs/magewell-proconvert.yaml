spec: 1
id: magewell-proconvert
name: Magewell Pro Convert
vendor: Magewell
category: other

source:
  - title: "Magewell Pro Convert Encoder API (unversioned; examples from firmware 1.1.72)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/pro-convert-encoder-api/"
    note: >
      Manufacturer-documented, public. GET http://IP/mwapi?method=<name>&...,
      JSON replies with an integer status, 0 for success, and the status code
      table (sections 1.2-1.3); ping, get-caps, reboot (section 2); login with
      id and the MD5 of the password, the sid cookie, logout (section 4);
      get-summary-info with device, ethernet and ndi objects including
      input-state and the NDI tally-preview and tally-program (section 5.1);
      get-signal-info (6.1); get-video-config and set-video-config with
      brightness, contrast, hue, saturation, deinterlace, out-flip,
      out-mirror, out-cx, out-cy, out-raw-resolution and bit-rate-ratio
      (section 7); get-ndi-config and set-ndi-config with enable,
      source-name, group-name, enable-web-control, enable-ptz-control,
      fail-over, the four transport flags of which at most one may be true,
      the multicast address, mask and TTL, discovery server and
      reference-level 20 (SMPTE) or 14 (EBU) (sections 9.1-9.2);
      get-ndi-sources; get-tally and set-tally ext-tally (9.4-9.5). Retrieved
      again 2026-10-09 for the rest of the video configuration (the input and
      output auto switches, color space, quantization and saturation range,
      aspect ratios, frame-rate conversion, ar-convertion, low-res-full-fr,
      reset-video-config), the NDI vendor fields, get-ptz-config,
      set-ptz-config and arrange-ptz-cameras, get-edid-config,
      set-edid-config and set-default-edid, get-auto-reboot and
      set-auto-reboot, get-eth-status and set-eth-config, get-net-access and
      set-net-access, get-ntp-server and set-ntp-server, and the summary's
      device, ethernet and ndi fields.
  - title: "Magewell Pro Convert Decoder API V1.3 (firmware V1.3), and v1.1"
    author: Magewell
    url: "https://www.magewell.com/api-docs/pro-convert-decoder-api/v1.3/"
    note: >
      Manufacturer-documented, public. The same transport, login and status
      codes 0-55 (sections 1.3-1.4, 4.1); get-summary-info with the decoded
      source's ndi object, url and tally (5.1); get-signal-info for the
      decoded source (6.1); get-video-config and set-video-config with
      show-title, show-tally, show-vu-meter, show-center-cross, h-flip,
      v-flip, switch-mode, ar-convert-mode, deinterlace-mode (7.1-7.3);
      get-supported-video-modes and set-video-mode (7.5-7.6); get-hdmi-output
      and set-hdmi-output (7.9-7.10); get-audio-config and set-audio-config
      gain -100.00 to 20.00 dB (8.1-8.2); list-channels, get-ndi-sources,
      get-channel and set-channel with ndi-name true (a discovered source) or
      false (a preset), add-channel, del-channel, get-playback-config and
      set-playback-config buffer-duration (sections 10-11); get-ndi-config
      and set-ndi-config with enable-discovery, discovery-server and
      group-name (11.1-11.2). v1.1 adds Pro Convert for NDI to HDMI 4K to the
      product list. Retrieved again 2026-10-09 for the rest of
      get-video-config and set-video-config (vu-meter-mode, safe-area-mode,
      ident-mode and ident-text, reset-source-on-boot, deinterlace-mode,
      in-auto-color-fmt and in-color-fmt, follow-input-mode),
      reset-video-config, get-video-format and set-video-format,
      get-hdmi-output, the rest of get-audio-config and set-audio-config
      (sample-rate, channels, ch0-ch15, check-pts, convert-mode),
      modify-channel and clear-channels, get-playback-config, the rest of
      get-ndi-config and set-ndi-config (mcast-subnets, low-bandwidth, the
      transport flags, ignore-ndi-hx-video-pts, use-timecode-first), and the
      same auto-reboot, network and NTP methods as the Encoder API.
  - title: "Magewell Pro Convert IP Decoder API V1.2 (firmware V1.2)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/pro-convert-ip-decoder-api/latest/"
    note: >
      Manufacturer-documented, public. JSON requests under /api with a status
      in every reply (1.2-1.3); POST /api/user/login with the SHA-256 of the
      password, the reply's sid and the sid-<serial number> cookie, valid
      until the device restarts (section 15); GET /api/system/summary (2);
      GET /api/source/list, POST /api/source/select (simple mode only) and
      /api/source/restart (3); /api/audio/config/set gain (5); profile list,
      select and screen select (6); PTZ move, zoom, focus, auto focus and
      preset recall and store through the decoded NDI source (7);
      GET /api/signal/info (10); /api/ping without login and /api/reboot
      (12). Retrieved again 2026-10-09 for the source list's shape and
      /api/source/add, /del and /set; /api/video/config/get and /set with
      their numbered values and the Common Types page; /api/video/mode/get
      and /set and /api/video/screen/wakeup; /api/audio/config/get and /set;
      /api/profile/list, /add, /del and /set; /api/settings/get,
      /settings/mode/set, /settings/ndi/set, /settings/gui/set and the Zixi
      ZEN Master get and set; and the base pages Get basic info
      (POST /api/system/info, with the reboot schedule and NTP), Schedule
      automatic reboots and Set device name.
  - title: "Magewell Pro Convert AES67 API V2.0 (firmware V1.2.433 and later), and V1.0 (firmware up through V1.2.402)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/pro-convert-aes67-api/lastest/"
    note: >
      Manufacturer-documented, public (the PDF of V2.0 at
      /api-docs/pro-convert-aes67-api/lastest/pro-convert-aes67-api-en_US.pdf,
      dated 2024-07-05; V1.0 at /api-docs/pro-convert-aes67-api/v1.0/,
      2023-03-01). Retrieved 2026-10-22. JSON over HTTP POST, a status in every
      reply and the same status codes (1.2-1.3); login with the SHA-256 of the
      password and the sid cookie (18.1); ping, reboot (2.1-2.2); summary-info
      with the analog, USB audio, AES67 source and sink state (3.1);
      general-info and general-settings: AES67 sample rate and packet time,
      analog levels, MIC bias, IGMP, AAC bitrate, test tone (4.1-4.2);
      ptp-info, ptp-settings, ptp-default, ptp-state (5.1-5.4); AES67 TX
      source-info, -apply, -update, -del (6); AES67 RX sink-info, -apply,
      -update, -del, sink-statistics, sink-statistics-clear, sdp-parse (7);
      receiver-select (8.1); NDI, SRT and Icecast senders and receivers with
      info, apply, update, del, find and options (9-14); the audio matrix
      matrix-info, audio-meter, audio-meter-limit, matrix-meter,
      matrix-settings, matrix-clear, volume-tx, volume-mix (15); device-info,
      info, set-device-name, set-date-time, timezone-set (16); if-info,
      if-set, if-route, get-dns, set-dns (17). V1.0 has no update methods,
      and gives the Icecast receiver's apply as POST /api/ices/receiver-apply,
      which V2.0's section 14.2 misprints as /api/live/receiver-select.
  - title: "Magewell Pro Convert Audio DX API (unversioned)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/pro-convert-audio-dx-api/"
    note: >
      Manufacturer-documented, public (PDF dated 2024-07-04). Retrieved
      2026-10-22. The same agreement, status codes and login as the AES67 API
      (1.2-1.3, 11.1); summary-info (3.1); general-range, general-info and
      general-apply with the levels as text (4.1-4.3); tx-live-info, -apply,
      -del for RTSP, TS over SRT and NDI streams, rx-live-info, -apply, -del
      with SRT and NDI URLs, rx-ndi-options-apply (5); matrix-desc and the
      audio matrix under /api/aoip (6); dante-state (7.1); the same system and
      network methods (8-9). Its auto-reboot (8.6) and Certificate (10) pages
      are listed but have no content.
  - title: "Magewell Pro Convert IP to USB API (unversioned)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/pro-convert-ip-to-usb-api/"
    note: >
      Manufacturer-documented, public (PDF dated 2025-08-22). Retrieved
      2026-10-22. Each method's administrator and login requirements, a
      status and code in every reply; ping, reboot (2); auto-reboot,
      device-info, info, set-device-name, set-date-time, timezone-set,
      summary/get, usb-mode/get and /update (3); video/config/get and
      /update (4); ndi/config/get and /update (5); the no-signal image
      upload, delete and get (6); source list, add, update, delete and
      select with NDI, discovered NDI and URL sources (7); stream/status/get
      (8); if-info and if-set (9); login with the sid-<serial number> cookie
      (10.1).
  - title: "Pro Convert Decoder User Manual, and the Pro Convert knowledge base"
    author: Magewell
    url: "https://www.magewell.com/files/documents/User_Manual/ProConvert_Decoder-UserManual_en_US.pdf"
    note: >
      Default credentials Admin / Admin, case sensitive; the web interface
      signs out after ten minutes idle; USB address 192.168.66.1 and DHCP on
      Ethernet by default; HTTPS on decoders after uploading a certificate.
  - title: "companion-module-magewell-proconvert-decoder (Bitfocus Companion module)"
    author: Bitfocus
    url: "https://github.com/bitfocus/companion-module-magewell-proconvert-decoder"
    note: >
      Community source (MIT license), read as corroboration only: it logs in
      with GET login and the MD5 of the password, sends the session cookie it
      received on every request, logs in again on status 37, and polls; there
      is no push.

settings:
  username:
    type: string
    default: Admin
    max_length: 64
    label: User name
    description: "The user the core logs in as; Admin by default."
  password:
    type: string
    secret: true
    default: Admin
    max_length: 64
    label: Password
    description: "That user's password; the core sends only its MD5 (encoders, NDI decoders) or SHA-256 (IP decoders, AES67, Audio DX, IP to USB) hash."
  scheme:
    type: enum
    values: [http, https]
    default: http
    label: Scheme
    description: "http, or https once a certificate is installed on a decoder; the certificate is not checked."

ports:
  - { port: 80, protocol: http, role: control, note: "the documents state no port; the web interface's standard port is assumed", when: "scheme http" }
  - { port: 443, protocol: https, role: control, setting: scheme, when: "scheme https" }

# Two APIs: the encoders and first-generation NDI decoders take
# GET /mwapi?method=<name> (Encoder API, Decoder API V1.3), the IP decoders
# JSON under /api (IP Decoder API V1.2, and the AES67, Audio DX and IP to USB
# APIs, which share its login and system methods). Each message names the
# models it is for. Every reply carries an integer status, 0 for success.
transport:
  type: http
  port: 80
  https_port: 443
  scheme: { setting: scheme }
  # HTTPS only after a certificate is uploaded to a decoder (user manual).
  accept_invalid_certs: true
  timeout_ms: 5000
  # ping needs no login (Encoder API section 2, IP Decoder API section 12).
  probe:
    - { models: &mw [hdmi-4k-plus, hdmi-plus, hdmi-tx, 12g-sdi-4k-plus, sdi-4k-plus, sdi-plus, sdi-tx,
                     ndi-to-hdmi, ndi-to-sdi, ndi-to-aio, ndi-to-hdmi-4k],
        method: GET, path: /mwapi, query: { method: ping } }
    - { models: &ip [ip-to-hdmi, ip-to-hdmi-4k, ip-to-aio-4k], method: GET, path: /api/ping }
    # AES67 API 2.1, Audio DX API 2.1, IP to USB API 2.1.
    - { models: &newapi [aes67, audio-dx, ip-to-usb], method: GET, path: /api/ping }
  # The session ID comes back only in Set-Cookie (sid, or sid-<serial number>
  # on the IP decoders and IP to USB) and goes back as a cookie on every later
  # request.
  session:
    login:
      # Encoder API section 4: id and the MD5 of the password.
      - { models: *mw, method: GET, path: /mwapi,
          query: { method: login, id: "{settings.username}", pass: "{settings.password:md5}" } }
      # IP Decoder API section 15, AES67 API 18.1, Audio DX API 11.1, IP to
      # USB API 10.1: the SHA-256 of the password, as JSON.
      - { models: &base [ip-to-hdmi, ip-to-hdmi-4k, ip-to-aio-4k, aes67, audio-dx, ip-to-usb],
          method: POST, path: /api/user/login, content_type: application/json,
          body: '{"username":{settings.username:json},"password":"{settings.password:sha256}"}' }
    capture: { cookie: "*" }
    # 37 "not logged in": the session ended (a restart, or idle).
    relogin: { status: [401], json: { "$.status": "^37$" } }
    # 36 "authentication failed"; 16 "does not exist" (an unknown user on
    # the IP decoders).
    refused: { status: [401, 403], json: { "$.status": "^(36|16)$" } }

# The status codes of Encoder API section 1.3 and Decoder API V1.3 section 1.4.
codes:
  "1": pending
  "2": timeout
  "3": interrupted
  "4": try again
  "5": not implemented
  "6": unknown error
  "7": invalid argument
  "8": no memory
  "9": unsupported
  "10": file busy
  "11": device busy
  "12": device lost
  "13": I/O failed
  "14": read failed
  "15": write failed
  "16": does not exist
  "17": too many
  "18": too large
  "19": overflow
  "20": underflow
  "21": format error
  "22": file exists
  "23": file type error
  "24": device type error
  "25": is a directory
  "26": read only
  "27": range error
  "28": broken pipe
  "29": no space
  "30": not a directory
  "31": not permitted
  "32": bad address
  "33": seek error
  "34": cross-device link
  "35": not initialized
  "36": authentication failed
  "37": not logged in
  "38": wrong state
  "39": mismatch
  "40": verify failed
  "41": constraint violation
  "42": canceled
  "43": in progress
  "44": connection refused
  "45": connection reset
  "46": address in use
  "47": no response
  "48": information changed
  "49": invalid data
  "50": need more data
  "51": no buffer
  "52": buffer too small
  "53": buffer is empty
  "54": buffer is full
  "55": network unreachable

maps:
  # set-ndi-config's transport flags: at most one true (section 9.2); TCP
  # is all four false.
  ndi_mcast: { tcp: "false", multi-tcp: "false", udp: "false", rudp: "false", multicast: "true" }
  ndi_rudp: { tcp: "false", multi-tcp: "false", udp: "false", rudp: "true", multicast: "false" }
  ndi_multi_tcp: { tcp: "false", multi-tcp: "true", udp: "false", rudp: "false", multicast: "false" }
  ndi_udp: { tcp: "false", multi-tcp: "false", udp: "true", rudp: "false", multicast: "false" }
  reference_level: { smpte: "20", ebu: "14" }
  # Decoder API V1.3 section 7.3: the overlay switches of set-video-config.
  overlay_field: { title: show-title, tally: show-tally, vu-meter: show-vu-meter, center-cross: show-center-cross }
  # Encoder API section 7: each "auto" switch of set-video-config.
  video_auto_field: { input-aspect: in-auto-aspect, input-color-format: in-auto-color-fmt,
                      input-quant-range: in-auto-quant-range, output-aspect: out-auto-aspect,
                      output-color-format: out-auto-color-fmt, output-sat-range: out-auto-sat-range,
                      output-quant-range: out-auto-quant-range }
  # Decoder API V1.3 section 8.2: 0 follows the source.
  sample_rate: { follow: "0", "32000": "32000", "44100": "44100", "48000": "48000", "88200": "88200", "96000": "96000" }
  audio_channels: { follow: "0", "2": "2", "4": "4", "8": "8" }
  # IP Decoder API V1.2, section 5 (convert-mode) and the video
  # configuration's numbered values (section 4 and Common Types).
  convert_mode_ip: { smpte: "0", ebu: "1" }
  safe_area_ip: { none: "0", "4:3": "1", "80%": "2", square: "3" }
  ar_convert_ip: { windowbox: "0", zoom: "1", full: "2" }
  vu_scale_ip: { hide: "0", post-dbvu: "1", post-dbfs: "2" }
  ident_ip: { none: "0", text: "1", source-name: "2" }
  deinterlace_ip: { bob: "0", weave: "1", blend: "2" }
  in_color_ip: { auto: "0", bt.601: "1", bt.709: "2", bt.2020: "3" }
  hdr_output_ip: { auto: "0", disable: "1", hdr-pq: "2", hlg: "3" }
  signal_loss_ip: { no-signal-image: "0", black: "1", last-frame: "2", output-off: "3" }
  config_mode_ip: { simple: "1", profile: "2" }
  # AES67 API section 4.2: the analog levels, IGMP and test tone as numbers.
  unbld_level_aes67: { "+12dBu": "0", "+4dBu": "1", "0dBu": "2", "-2dBu": "3", "0dBV": "4", "-10dBV": "5" }
  bld_in_level_aes67: { "+24dBu": "0", "+18dBu": "1", "+4dBu": "2", "0dBu": "3", "-2dBu": "4", "0dBV": "5", "-10dBV": "6" }
  bld_out_level_aes67: { "+18dBu": "0", "+4dBu": "1", "0dBu": "2", "-2dBu": "3", "0dBV": "4", "-10dBV": "5" }
  igmp_aes67: { auto: "0", v2: "2", v3: "3" }
  test_tone_aes67: { "off": "0", analog-input: "1", analog-output: "2" }
  # Audio DX API sections 4.1-4.3: the same as text, -2 dB on the balanced
  # connectors written -2dBV in general-range.
  bld_level_dx: { "+24dBu": "+24dBu", "+18dBu": "+18dBu", "+4dBu": "+4dBu", "0dBu": "0dBu", "-2dBu": "-2dBV", "0dBV": "0dBV", "-10dBV": "-10dBV" }
  igmp_dx: { auto: Auto, v2: IGMPv2, v3: IGMPv3 }
  test_tone_dx: { "off": "off", analog-input: input, analog-output: output }
  # AES67 API sections 5 and 8-14.
  ptp_role: { auto: Auto, follower: Slaver }
  stream_receiver: { ndi: "0", srt: "1", icecast: "2" }
  # IP to USB API sections 3.9, 4.2 and 7.1.
  usb_mode: { video-conferencing: Normal mode, content-sharing: Content mode }
  ar_convert_usb: { windowbox: Windowbox, zoom: Crop, full: Stretch }
  usb_source_list: { static: static, discovered: dynamic }

conversions:
  # /api/system/info's cpu.usage is the CPU load in percent times 100.
  percent_x100:
    points: [[0, 0.0], [10000, 100.0]]

models:
  - id: hdmi-4k-plus
    name: "Magewell Pro Convert HDMI 4K Plus (and Module)"
    supports: &encoder
      [ping, reboot, get_summary, get_caps, get_signal_info, get_video_config, get_ndi_config, get_ndi_sources,
       get_tally_config, set_ndi_enabled, set_ndi_source_name, set_ndi_groups, set_ndi_transport,
       set_ndi_multicast, set_ndi_discovery, set_ndi_failover, set_ndi_web_control, set_ndi_ptz_control,
       set_reference_level, set_ndi_vendor, set_bitrate_ratio, set_brightness, set_contrast, set_hue,
       set_saturation, set_deinterlace, set_output_flip, set_output_mirror, set_output_resolution,
       set_output_follows_input, set_video_auto, set_input_color_format, set_input_quant_range,
       set_input_aspect, set_output_aspect, set_output_color_format, set_output_sat_range,
       set_output_quant_range, set_frame_rate_conversion, set_encoder_aspect_conversion,
       set_low_res_full_frame_rate, reset_video_config, set_ext_tally, get_ptz_config, set_ptz_none,
       set_ptz_serial, set_ptz_visca_udp, set_ptz_visca_bridge, set_ptz_limits, apply_ptz_config,
       get_edid_config, set_edid_option, reset_edid, get_auto_reboot, set_auto_reboot, get_ntp_server,
       set_ntp_server, get_net_access, set_ssdp, get_network_status, set_device_name, set_network_dhcp,
       set_network_static]
    verification: none
    notes: >
      HDMI to full-bandwidth NDI encoder (Encoder API). The Module variant has
      the same API.
  - id: hdmi-plus
    name: "Magewell Pro Convert HDMI Plus (and Module)"
    supports: *encoder
    verification: none
  - id: hdmi-tx
    name: "Magewell Pro Convert HDMI TX"
    supports: *encoder
    verification: none
    notes: "Encoder without loop-through."
  - id: 12g-sdi-4k-plus
    name: "Magewell Pro Convert 12G SDI 4K Plus (and Module)"
    supports: *encoder
    verification: none
  - id: sdi-4k-plus
    name: "Magewell Pro Convert SDI 4K Plus"
    supports: *encoder
    verification: none
  - id: sdi-plus
    name: "Magewell Pro Convert SDI Plus (and Module)"
    supports: *encoder
    verification: none
  - id: sdi-tx
    name: "Magewell Pro Convert SDI TX"
    supports: *encoder
    verification: none
  - id: ndi-to-hdmi
    name: "Magewell Pro Convert for NDI to HDMI (and Module)"
    supports: &decoder
      [ping, reboot, get_summary, get_caps, get_signal_info, get_video_config, get_ndi_config, get_ndi_sources,
       list_presets, get_current_source, select_ndi_source, select_preset, add_preset, modify_preset,
       delete_preset, clear_presets, get_hdmi_output, set_hdmi_output, get_video_modes, set_video_mode,
       get_video_format, set_output_format, get_audio_config, set_audio_gain, set_audio_sample_rate,
       set_audio_channels, set_audio_channel_map, set_audio_convert_mode, set_audio_check_pts, set_overlay,
       set_vu_meter_mode, set_safe_area, set_ident, set_switch_mode, set_reset_source_on_boot,
       set_aspect_conversion, set_decoder_flip, set_decoder_deinterlace, set_decoder_input_color_format,
       set_decoder_input_color_auto, set_follow_input, reset_video_config, get_playback_config,
       set_buffer_duration, set_decoder_ndi_discovery, set_decoder_ndi_group, set_decoder_ndi_transport,
       set_decoder_low_bandwidth, set_decoder_mcast_subnets, set_decoder_ignore_hx_pts,
       set_decoder_timecode_first, get_auto_reboot, set_auto_reboot, get_ntp_server, set_ntp_server,
       get_net_access, set_ssdp, get_network_status, set_device_name, set_network_dhcp, set_network_static]
    verification: none
    notes: "First-generation NDI decoder (Decoder API V1.3)."
  - id: ndi-to-sdi
    name: "Magewell Pro Convert for NDI to SDI"
    supports: *decoder
    verification: none
  - id: ndi-to-aio
    name: "Magewell Pro Convert for NDI to AIO (and Module)"
    supports: *decoder
    verification: none
    notes: "HDMI and SDI outputs (Decoder API V1.3)."
  - id: ndi-to-hdmi-4k
    name: "Magewell Pro Convert for NDI to HDMI 4K (and Module)"
    supports: *decoder
    verification: none
    notes: "Listed in Decoder API v1.1 only; whether it has firmware V1.3 is not documented."
  - id: ip-to-hdmi
    name: "Magewell Pro Convert IP to HDMI"
    supports: &ipdecoder
      [ping, reboot, get_summary, get_signal_info, get_sources, select_source, restart_source,
       add_source_url, add_source, modify_source, delete_source, list_profiles, select_profile,
       select_screen_source, add_profile, modify_profile, delete_profile, get_video_config, set_overlay,
       set_vu_meter_scale, set_safe_area, set_ip_ident, set_decoder_flip, set_ip_deinterlace,
       set_aspect_conversion, set_follow_input, set_output_format, set_ip_input_color_space,
       set_hdr_output_mode, set_signal_loss_mode, set_screen_debug, set_webrtc_preview, get_video_modes,
