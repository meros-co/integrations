  # AES67, Audio DX and IP to USB: the system and network methods they share
  # (AES67 API sections 16-17, Audio DX API 8-9, IP to USB API 3 and 9).
  get_device_info:
    summary: "Model, serial number, hardware revision, firmware version and build, and capabilities (POST /api/system/device-info)"
    send: { models: *newapi, method: POST, path: /api/system/device-info }
    expect: *value
    returns: value
  set_ntp:
    summary: "Keep the clock with NTP from the servers given (POST /api/system/set-date-time ntp-enable=true)"
    params:
      server1: { type: string, required: true, max_length: 255, label: NTP server 1, description: "Host name or address of the first NTP server." }
      server2: { type: string, default: "", max_length: 255, label: NTP server 2, description: "Host name or address of the second NTP server; empty for none." }
    send: { models: *newapi, method: POST, path: /api/system/set-date-time, content_type: application/json,
            body: '{"ntp-enable":true,"ntp-server1":{server1:json},"ntp-server2":{server2:json}}' }
    expect: *ok
    returns: ack
  set_clock:
    summary: "Turn NTP off and set the clock by hand (POST /api/system/set-date-time ntp-enable=false, time)"
    params:
      time: { type: string, required: true, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$", label: Date and time,
        description: "The device's local date and time as yyyy-MM-dd HH:mm:ss." }
      server1: { type: string, required: true, max_length: 255, label: NTP server 1, description: "First NTP server kept for when NTP is turned on again." }
      server2: { type: string, default: "", max_length: 255, label: NTP server 2, description: "Second NTP server kept for when NTP is turned on again; empty for none." }
    send: { models: *newapi, method: POST, path: /api/system/set-date-time, content_type: application/json,
            body: '{"ntp-enable":false,"ntp-server1":{server1:json},"ntp-server2":{server2:json},"time":"{time}"}' }
    expect: *ok
    returns: ack
  set_timezone:
    summary: "Time zone, by name (POST /api/system/timezone-set)"
    params:
      zone: { type: string, required: true, max_length: 64, pattern: "^[A-Za-z0-9_+/-]+$", label: Time zone, description: "A time zone name such as Europe/London or Asia/Shanghai." }
    send: { models: *newapi, method: POST, path: /api/system/timezone-set, content_type: application/json, body: '{"zonename":"{zone}"}' }
    expect: *ok
    returns: ack
  get_network_interfaces:
    summary: "Network interfaces: Ethernet and USB, each with DHCP, addresses, link and traffic (POST /api/network/if-info)"
    send: { models: *newapi, method: POST, path: /api/network/if-info }
    expect: *value
    returns: value
  set_network_address:
    summary: "Fixed Ethernet address; the device moves to it (POST /api/network/if-set use-dhcp=false); DNS is set with set_dns_manual"
    params:
      address: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: IP address, description: "The device's new IPv4 address." }
      netmask: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Subnet mask, description: "Subnet mask, e.g. 255.255.255.0." }
      gateway: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Gateway, description: "Default gateway address." }
    send: { models: &aoip [aes67, audio-dx], method: POST, path: /api/network/if-set, content_type: application/json,
            body: '{"iface":"eth0","use-dhcp":false,"ipaddr":"{address}","netmask":"{netmask}","gateway":"{gateway}"}' }
    expect: *ok
    returns: ack
  get_default_route:
    summary: "The interface the default route goes through, empty for none (POST /api/network/if-route)"
    send: { models: *aoip, method: POST, path: /api/network/if-route }
    expect: *value
    returns: value
  get_dns:
    summary: "DNS servers and whether they are set by hand (POST /api/network/get-dns)"
    send: { models: *aoip, method: POST, path: /api/network/get-dns }
    expect: *value
    returns: value
  set_dns_manual:
    summary: "Use the DNS servers given (POST /api/network/set-dns is-manual=true)"
    params:
      dns1: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: DNS server 1, description: "Primary DNS server address." }
      dns2: { type: string, default: "", pattern: "^([0-9]{1,3}(\\.[0-9]{1,3}){3})?$", label: DNS server 2, description: "Secondary DNS server address; empty for none." }
    send: { models: *aoip, method: POST, path: /api/network/set-dns, content_type: application/json,
            body: '{"is-manual":true,"dns1":"{dns1}","dns2":"{dns2}"}' }
    expect: *ok
    returns: ack
  set_dns_auto:
    summary: "Take the DNS servers from DHCP (POST /api/network/set-dns is-manual=false)"
    send: { models: *aoip, method: POST, path: /api/network/set-dns, content_type: application/json, body: '{"is-manual":false}' }
    expect: *ok
    returns: ack

  # AES67 and Audio DX: general settings (AES67 API section 4, Audio DX API
