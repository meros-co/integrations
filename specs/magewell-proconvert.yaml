commands:
  ping:
    summary: "Check the device is ready; needs no login (ping)"
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: ping }, session: false }
      - { models: *base, method: GET, path: /api/ping, session: false }
    # Every reply: HTTP 200 and status 0; any other status fails with its code.
    expect: &ok { status: 200, code_path: "$.status", code_range: [0, 0] }
    returns: ack
  reboot:
    summary: "Restart the device; its output stops until it is back (reboot)"
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: reboot } }
      - { models: *base, method: POST, path: /api/reboot }
    expect: *ok
    returns: ack
  get_summary:
    summary: "Device, network and stream status: model, firmware, input or output state, temperature, NDI stream and tally; on the audio models the connectors and AES67 streams; on IP to USB the temperature (get-summary-info, /api/system/summary, summary-info or /api/system/summary/get)"
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-summary-info } }
      - { models: *ip, method: GET, path: /api/system/summary }
      - { models: [aes67], method: POST, path: /api/aes67/summary-info }
      - { models: [audio-dx], method: POST, path: /api/aoip/summary-info }
      - { models: [ip-to-usb], method: POST, path: /api/system/summary/get }
    expect: &value { status: 200, code_path: "$.status", code_range: [0, 0], json_path: "$" }
    returns: value
  get_caps:
    summary: "Capabilities: maximum input and output size, loop-through, fan, SD card, PTZ (get-caps)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-caps } }
    expect: *value
    returns: value
  get_signal_info:
    summary: "The input signal (encoders) or decoded source (decoders): format, color, audio (get-signal-info, or /api/signal/info)"
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-signal-info } }
      - { models: *ip, method: GET, path: /api/signal/info }
    expect: *value
    returns: value
  get_video_config:
    summary: "Video settings (get-video-config, or GET /api/video/config/get)"
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-video-config } }
      - { models: [ip-to-hdmi, ip-to-hdmi-4k, ip-to-aio-4k, ip-to-usb], method: GET, path: /api/video/config/get }
    expect: *value
    returns: value
  get_ndi_config:
    summary: "NDI settings (get-ndi-config)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-ndi-config } }
    expect: *value
    returns: value
  get_ndi_sources:
    summary: "NDI sources discovered on the network, each with ndi-name and ip-addr (get-ndi-sources)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-ndi-sources } }
    expect: *value
    returns: value
  get_tally_config:
    summary: "Whether the tally lights are user-controlled (get-tally)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-tally } }
    expect: *value
    returns: value

  set_ndi_enabled:
    summary: "Turn the encoder's NDI output on or off (set-ndi-config enable)"
    params:
      enabled: { type: bool, required: true, label: NDI output, description: "On sends the input as an NDI source; off stops it." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, enable: "{enabled}" } }
    expect: *ok
    returns: ack
  set_ndi_source_name:
    summary: "Set the NDI source name template (set-ndi-config source-name)"
    params:
      name: { type: string, required: true, max_length: 63, label: Source name,
        description: "The NDI source name; %board-id% and %serial-no% are replaced, and the default is #%board-id% (%serial-no%)." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, source-name: "{name}" } }
    expect: *ok
    returns: ack
  set_ndi_groups:
    summary: "NDI groups the source is published in (set-ndi-config group-name)"
    params:
      groups: { type: string, required: true, max_length: 255, label: NDI groups, description: "Group names separated by commas; public is the default group." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, group-name: "{groups}" } }
    expect: *ok
    returns: ack
  set_ndi_transport:
    summary: "NDI transport: TCP (all flags off), multi-TCP, UDP, reliable UDP or multicast (set-ndi-config enable-tcp, enable-udp, enable-rudp, enable-mcast)"
    params:
      transport: { type: enum, values: [tcp, multi-tcp, udp, rudp, multicast], required: true, label: Transport,
        description: "How receivers are sent the stream; tcp is the single-connection default with every transport flag off." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, enable-mcast: "{transport:map.ndi_mcast}", enable-rudp: "{transport:map.ndi_rudp}", enable-tcp: "{transport:map.ndi_multi_tcp}", enable-udp: "{transport:map.ndi_udp}" } }
    expect: *ok
    returns: ack
  set_ndi_multicast:
    summary: "Multicast address, netmask and TTL (set-ndi-config mcast-addr, mcast-mask, mcast-ttl)"
    params:
      address: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Multicast address, description: "Multicast base address, e.g. 239.255.0.0." }
      netmask: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Netmask, description: "Multicast netmask, e.g. 255.255.0.0." }
      ttl: { type: int, min: 1, max: 255, required: true, label: TTL, description: "Multicast time-to-live in router hops, 1 to 255." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, mcast-addr: "{address}", mcast-mask: "{netmask}", mcast-ttl: "{ttl}" } }
    expect: *ok
    returns: ack
  set_ndi_discovery:
    summary: "Use NDI discovery servers, or not (set-ndi-config enable-discovery, discovery-server)"
    params:
      enabled: { type: bool, required: true, label: Discovery server, description: "On registers with the discovery servers given." }
      servers: { type: string, default: "", max_length: 255, label: Servers, description: "Discovery server IP addresses separated by commas; needed when on." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, enable-discovery: "{enabled}", discovery-server: "{servers}" } }
    expect: *ok
    returns: ack
  set_ndi_failover:
    summary: "NDI failover source receivers switch to when this one stops (set-ndi-config enable-fail-over, fail-over-ndi-name, fail-over-ip-addr)"
    params:
      enabled: { type: bool, required: true, label: Failover, description: "On names a failover source." }
      ndi_name: { type: string, default: "", max_length: 255, label: Failover source, description: "The failover NDI source's name, as get_ndi_sources lists it." }
      ip_address: { type: string, default: "", max_length: 64, label: Failover address, description: "The failover source's ip-addr as get_ndi_sources lists it, e.g. 192.168.1.192:5963." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, enable-fail-over: "{enabled}", fail-over-ndi-name: "{ndi_name}", fail-over-ip-addr: "{ip_address}" } }
    expect: *ok
    returns: ack
  set_ndi_web_control:
    summary: "Allow web control from NDI tools (set-ndi-config enable-web-control)"
    params:
      enabled: { type: bool, required: true, label: Web control, description: "On lets NDI receivers open the device's web control." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, enable-web-control: "{enabled}" } }
    expect: *ok
    returns: ack
  set_ndi_ptz_control:
    summary: "Allow PTZ control from NDI receivers such as Studio Monitor (set-ndi-config enable-ptz-control)"
    params:
      enabled: { type: bool, required: true, label: PTZ control, description: "On passes NDI PTZ commands to the camera on the device's PTZ port." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, enable-ptz-control: "{enabled}" } }
    expect: *ok
    returns: ack
  set_reference_level:
    summary: "Audio reference level, SMPTE (20) or EBU (14) (set-ndi-config reference-level)"
    params:
      level: { type: enum, values: [smpte, ebu], required: true, label: Reference level, description: "SMPTE (+4 dBu = -20 dBFS) or EBU (-14 dBFS) audio alignment." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, reference-level: "{level:map.reference_level}" } }
    expect: *ok
    returns: ack
  set_bitrate_ratio:
    summary: "NDI bitrate as a percentage of the standard rate, 50-200 (set-video-config bit-rate-ratio)"
    params:
      percent: { type: int, min: 50, max: 200, required: true, label: Bitrate, description: "Bitrate as a percentage of NDI's standard rate; 100 is the default." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, bit-rate-ratio: "{percent}" } }
    expect: *ok
    returns: ack
  set_brightness:
    summary: "Picture brightness, -100 to 100 (set-video-config brightness)"
    params:
      value: { type: int, min: -100, max: 100, required: true, label: Brightness, description: "Brightness from -100 to 100, 0 unchanged." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, brightness: "{value}" } }
    expect: *ok
    returns: ack
  set_contrast:
    summary: "Picture contrast, 50 to 200 (set-video-config contrast)"
    params:
      value: { type: int, min: 50, max: 200, required: true, label: Contrast, description: "Contrast from 50 to 200, 100 unchanged." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, contrast: "{value}" } }
    expect: *ok
    returns: ack
  set_hue:
    summary: "Picture hue, -90 to 90 (set-video-config hue)"
    params:
      value: { type: int, min: -90, max: 90, required: true, label: Hue, description: "Hue rotation from -90 to 90, 0 unchanged." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, hue: "{value}" } }
    expect: *ok
    returns: ack
  set_saturation:
    summary: "Picture saturation, 0 to 200 (set-video-config saturation)"
    params:
      value: { type: int, min: 0, max: 200, required: true, label: Saturation, description: "Saturation from 0 (black and white) to 200, 100 unchanged." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, saturation: "{value}" } }
    expect: *ok
    returns: ack
  set_deinterlace:
    summary: "Deinterlacing of an interlaced input (set-video-config deinterlace)"
    params:
      mode: { type: enum, values: [none, top-field, bottom-field], required: true, label: Deinterlace, description: "Keep interlaced (none), or deinterlace from the top or bottom field." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, deinterlace: "{mode}" } }
    expect: *ok
    returns: ack
  set_output_flip:
    summary: "Flip the encoded picture vertically (set-video-config out-flip)"
    params:
      enabled: { type: bool, required: true, label: Vertical flip, description: "On flips the picture upside down." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, out-flip: "{enabled}" } }
    expect: *ok
    returns: ack
  set_output_mirror:
    summary: "Mirror the encoded picture horizontally (set-video-config out-mirror)"
    params:
      enabled: { type: bool, required: true, label: Mirror, description: "On mirrors the picture left to right." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, out-mirror: "{enabled}" } }
    expect: *ok
    returns: ack
  set_output_resolution:
    summary: "Fixed NDI output resolution (set-video-config out-raw-resolution false, out-cx, out-cy)"
    params:
      width: { type: int, min: 64, max: 4096, required: true, label: Width, description: "Output width in pixels, a multiple of 4." }
      height: { type: int, min: 64, max: 2160, required: true, label: Height, description: "Output height in lines, a multiple of 2." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, out-raw-resolution: "false", out-cx: "{width}", out-cy: "{height}" } }
    expect: *ok
    returns: ack
  set_output_follows_input:
    summary: "NDI output resolution follows the input (set-video-config out-raw-resolution)"
    params:
      enabled: { type: bool, required: true, label: Follow input, description: "On encodes at the input's resolution; off uses the set output resolution." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, out-raw-resolution: "{enabled}" } }
    expect: *ok
    returns: ack
  set_ext_tally:
    summary: "User-controlled tally lights (set-tally ext-tally)"
    params:
      enabled: { type: bool, required: true, label: User tally, description: "On lets the user control the tally lights rather than NDI tally." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-tally, ext-tally: "{enabled}" } }
    expect: *ok
    returns: ack
  set_ndi_vendor:
    summary: "NDI vendor name and id the source announces (set-ndi-config vendor-name, vendor-id)"
    params:
      name: { type: string, required: true, max_length: 63, label: Vendor name, description: "Vendor name announced with the NDI source, 1 to 63 characters." }
      id: { type: string, required: true, max_length: 31, label: Vendor ID, description: "Vendor id announced with the NDI source, 1 to 31 characters." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, vendor-name: "{name}", vendor-id: "{id}" } }
    expect: *ok
    returns: ack
  set_video_auto:
    summary: "Detect an input or output property automatically, or use the value set (set-video-config in-auto-* and out-auto-*)"
    params:
      setting: { type: enum, values: [input-aspect, input-color-format, input-quant-range, output-aspect, output-color-format, output-sat-range, output-quant-range],
        required: true, label: Setting, description: "The property: input or output aspect ratio, color space, saturation range or quantization range." }
      enabled: { type: bool, required: true, label: Automatic, description: "On detects the property from the signal; off uses the value set with its own command." }
    send: { models: *mw, method: GET, path: /mwapi, raw_query: "method=set-video-config&{setting:map.video_auto_field}={enabled}" }
    expect: *ok
    returns: ack
  set_input_color_format:
    summary: "Fixed input color space (set-video-config in-auto-color-fmt=false, in-color-fmt)"
    params:
      format: { type: enum, values: [rgb, bt.601, bt.709, bt.2020], required: true, label: Input color space, description: "The input's color space, used instead of the one detected." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, in-auto-color-fmt: "false", in-color-fmt: "{format}" } }
    expect: *ok
    returns: ack
  set_input_quant_range:
    summary: "Fixed input quantization range (set-video-config in-auto-quant-range=false, in-quant-range)"
    params:
      range: { type: enum, values: [full, limited], required: true, label: Input range, description: "Full (0-255) or limited (16-235) input levels, used instead of the ones detected." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, in-auto-quant-range: "false", in-quant-range: "{range}" } }
    expect: *ok
    returns: ack
  set_input_aspect:
    summary: "Fixed input aspect ratio (set-video-config in-auto-aspect=false, in-aspect-x, in-aspect-y)"
    params:
      x: { type: int, min: 1, max: 255, required: true, label: Width, description: "Aspect ratio width, e.g. 16 for 16:9." }
      y: { type: int, min: 1, max: 255, required: true, label: Height, description: "Aspect ratio height, e.g. 9 for 16:9." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, in-auto-aspect: "false", in-aspect-x: "{x}", in-aspect-y: "{y}" } }
    expect: *ok
    returns: ack
  set_output_aspect:
    summary: "Fixed NDI output aspect ratio (set-video-config out-auto-aspect=false, out-aspect-x, out-aspect-y)"
    params:
      x: { type: int, min: 1, max: 255, required: true, label: Width, description: "Aspect ratio width, e.g. 16 for 16:9." }
      y: { type: int, min: 1, max: 255, required: true, label: Height, description: "Aspect ratio height, e.g. 9 for 16:9." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, out-auto-aspect: "false", out-aspect-x: "{x}", out-aspect-y: "{y}" } }
    expect: *ok
    returns: ack
  set_output_color_format:
    summary: "Fixed NDI output color space (set-video-config out-auto-color-fmt=false, out-color-fmt)"
    params:
      format: { type: enum, values: [bt.601, bt.709, bt.2020], required: true, label: Output color space, description: "The color space the stream is sent in, used instead of the automatic choice." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, out-auto-color-fmt: "false", out-color-fmt: "{format}" } }
    expect: *ok
    returns: ack
  set_output_sat_range:
    summary: "Fixed NDI output saturation range (set-video-config out-auto-sat-range=false, out-sat-range)"
    params:
      range: { type: enum, values: [full, limited, extended], required: true, label: Saturation range, description: "Output saturation range: full, limited or extended gamut." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, out-auto-sat-range: "false", out-sat-range: "{range}" } }
    expect: *ok
    returns: ack
  set_output_quant_range:
    summary: "Fixed NDI output quantization range (set-video-config out-auto-quant-range=false, out-quant-range)"
    params:
      range: { type: enum, values: [full, limited], required: true, label: Output range, description: "Full (0-255) or limited (16-235) output levels." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, out-auto-quant-range: "false", out-quant-range: "{range}" } }
    expect: *ok
    returns: ack
  set_frame_rate_conversion:
    summary: "NDI output frame rate relative to the input (set-video-config out-fr-convertion)"
    params:
      rate: { type: enum, values: [raw, half, one-third, quarter], required: true, label: Frame rate, description: "The input's rate (raw), or a half, third or quarter of it." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, out-fr-convertion: "{rate}" } }
    expect: *ok
    returns: ack
  set_encoder_aspect_conversion:
    summary: "How the encoder fits an input of another aspect ratio, an advanced setting (set-video-config ar-convertion)"
    params:
      mode: { type: enum, values: [ignore, cropping, padding], required: true, label: Aspect conversion, description: "Stretch (ignore), crop, or pad with borders." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, ar-convertion: "{mode}" } }
    expect: *ok
    returns: ack
  set_low_res_full_frame_rate:
    summary: "Full frame rate for the low-bandwidth stream (set-video-config low-res-full-fr)"
    params:
      enabled: { type: bool, required: true, label: Full frame rate, description: "On sends the low-bandwidth NDI stream at the full frame rate." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, low-res-full-fr: "{enabled}" } }
    expect: *ok
    returns: ack
  reset_video_config:
    summary: "Put every video setting back to its default; the picture changes at once (reset-video-config)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: reset-video-config } }
    expect: *ok
    returns: ack
  get_ptz_config:
    summary: "The PTZ camera link: protocol, camera id, baud rate, VISCA over IP address, inversion and limits (get-ptz-config)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-ptz-config } }
    expect: *value
    returns: value
  set_ptz_none:
    summary: "No PTZ camera attached (set-ptz-config proto=none)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ptz-config, proto: none } }
    expect: *ok
    returns: ack
  set_ptz_serial:
    summary: "Control a PTZ camera on the serial port with VISCA, PELCO-D or PELCO-P (set-ptz-config proto, index, baudrate, invert-pan, invert-tilt)"
    params:
      protocol: { type: enum, values: [visca, pelco-d, pelco-p], required: true, label: Protocol, description: "The camera's serial control protocol." }
      camera: { type: int, min: 1, max: 7, default: 1, label: Camera ID, description: "The camera's address on the serial line, 1 to 7." }
      baudrate: { type: enum, values: ["2400", "4800", "9600", "19200", "38400"], default: "9600", label: Baud rate, description: "Serial speed in bits per second; every camera on the line uses the same." }
      invert_pan: { type: bool, default: false, label: Invert pan, description: "On reverses the pan direction." }
      invert_tilt: { type: bool, default: false, label: Invert tilt, description: "On reverses the tilt direction." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ptz-config, proto: "{protocol}", index: "{camera}", baudrate: "{baudrate}", invert-pan: "{invert_pan}", invert-tilt: "{invert_tilt}" } }
    expect: *ok
    returns: ack
  set_ptz_visca_udp:
    summary: "Control a PTZ camera with VISCA over IP (set-ptz-config proto=visca-udp, index, ip-addr, port, visca-msg-hdr, invert-pan, invert-tilt)"
    params:
      camera: { type: int, min: 1, max: 7, default: 1, label: Camera ID, description: "The camera's VISCA address, 1 to 7." }
      address: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Camera address, description: "The camera's IPv4 address." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "The camera's VISCA over IP UDP port, often 52381." }
      header: { type: bool, default: false, label: VISCA header, description: "On wraps each command in the VISCA over IP message header." }
      invert_pan: { type: bool, default: false, label: Invert pan, description: "On reverses the pan direction." }
      invert_tilt: { type: bool, default: false, label: Invert tilt, description: "On reverses the tilt direction." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ptz-config, proto: visca-udp, index: "{camera}", ip-addr: "{address}", port: "{port}", visca-msg-hdr: "{header}", invert-pan: "{invert_pan}", invert-tilt: "{invert_tilt}" } }
    expect: *ok
    returns: ack
  set_ptz_visca_bridge:
    summary: "Pass VISCA over IP received on a UDP port to the serial port (set-ptz-config proto=visca-udp2rs232, baudrate, port)"
    params:
      baudrate: { type: enum, values: ["2400", "4800", "9600", "19200", "38400"], default: "9600", label: Baud rate, description: "Serial speed in bits per second." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "The UDP port the device listens on for VISCA over IP." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ptz-config, proto: visca-udp2rs232, baudrate: "{baudrate}", port: "{port}" } }
    expect: *ok
    returns: ack
  set_ptz_limits:
    summary: "PTZ travel limits and center (set-ptz-config pan-*, tilt-*, zoom-out-limit, focus-near-limit, focus-far-limit)"
    params:
      pan_left: { type: int, min: -32768, max: 32767, required: true, label: Pan left, description: "Pan left limit in camera units." }
      pan_center: { type: int, min: -32768, max: 32767, required: true, label: Pan center, description: "Pan center in camera units." }
      pan_right: { type: int, min: -32768, max: 32767, required: true, label: Pan right, description: "Pan right limit in camera units." }
      tilt_top: { type: int, min: -32768, max: 32767, required: true, label: Tilt top, description: "Tilt top limit in camera units." }
      tilt_center: { type: int, min: -32768, max: 32767, required: true, label: Tilt center, description: "Tilt center in camera units." }
      tilt_bottom: { type: int, min: -32768, max: 32767, required: true, label: Tilt bottom, description: "Tilt bottom limit in camera units." }
      zoom_out: { type: int, min: 0, max: 32767, required: true, label: Zoom out limit, description: "Widest zoom position in camera units." }
      focus_near: { type: int, min: 0, max: 65535, required: true, label: Focus near limit, description: "Nearest focus position in camera units." }
      focus_far: { type: int, min: 0, max: 65535, required: true, label: Focus far limit, description: "Farthest focus position in camera units." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ptz-config, focus-near-limit: "{focus_near}", focus-far-limit: "{focus_far}", pan-left-limit: "{pan_left}", pan-center: "{pan_center}", pan-right-limit: "{pan_right}", tilt-top-limit: "{tilt_top}", tilt-center: "{tilt_center}", tilt-bottom-limit: "{tilt_bottom}", zoom-out-limit: "{zoom_out}" } }
    expect: *ok
    returns: ack
  apply_ptz_config:
    summary: "Apply the PTZ settings to the attached cameras (arrange-ptz-cameras)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: arrange-ptz-cameras } }
    expect: *ok
    returns: ack
  get_edid_config:
    summary: "Input EDID settings and the EDID in base64 (get-edid-config)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-edid-config } }
    expect: *value
    returns: value
  set_edid_option:
    summary: "One input EDID option: SmartEDID, keep the last loop-through EDID, force audio, or limit the pixel clock (set-edid-config)"
    params:
      option: { type: enum, values: [smart-edid, keep-last, add-audio, limit-pixel-clock], required: true, label: Option,
        description: "SmartEDID, keep the last loop-through display's EDID, ask the source for audio, or keep the pixel clock within the device's limit." }
      enabled: { type: bool, required: true, label: Enabled, description: "On enables the option." }
    send: { models: *mw, method: GET, path: /mwapi, raw_query: "method=set-edid-config&{option}={enabled}" }
    expect: *ok
    returns: ack
  reset_edid:
    summary: "Put the input EDID back to its default; the source may re-read it (set-default-edid)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-default-edid } }
    expect: *ok
    returns: ack

  list_presets:
    summary: "Preset sources, each with name and url (list-channels)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: list-channels } }
    expect: *value
    returns: value
  get_current_source:
    summary: "The source being decoded: name, and ndi-name true for a discovered NDI source or false for a preset (get-channel)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-channel } }
    expect: *value
    returns: value
  select_ndi_source:
    summary: "Decode a discovered NDI source by name; the output switches at once (set-channel ndi-name=true)"
    params:
      name: { type: string, required: true, max_length: 255, label: NDI source, description: "The source's full NDI name as get_ndi_sources lists it, e.g. STUDIO (Camera 1)." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-channel, ndi-name: "true", name: "{name}" } }
    expect: *ok
    returns: ack
  select_preset:
    summary: "Decode a preset source by name; the output switches at once (set-channel ndi-name=false)"
    params:
      name: { type: string, required: true, max_length: 120, label: Preset, description: "The preset's name as list_presets lists it." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-channel, ndi-name: "false", name: "{name}" } }
    expect: *ok
    returns: ack
  add_preset:
    summary: "Add a preset source (add-channel)"
    params:
      name: { type: string, required: true, max_length: 120, label: Name, description: "A unique preset name, 1 to 120 characters." }
      url: { type: string, required: true, max_length: 1024, label: URL,
        description: "Source URL: ntkndi://ndi?name=..., rtsp://, http://, rtmp://, rtmps://, udp://, srt:// or rtp:// with the options the API documents." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: add-channel, name: "{name}", url: "{url}" } }
    expect: *ok
    returns: ack
  delete_preset:
    summary: "Delete a preset source (del-channel)"
    params:
      name: { type: string, required: true, max_length: 120, label: Name, description: "The preset to delete." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: del-channel, name: "{name}" } }
    expect: *ok
    returns: ack
  set_hdmi_output:
    summary: "Send the decoded picture to the output, or not (set-hdmi-output)"
    params:
      enabled: { type: bool, required: true, label: Output, description: "On outputs the decoded picture; off stops the output." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-hdmi-output, enabled: "{enabled}" } }
    expect: *ok
    returns: ack
  get_video_modes:
    summary: "Video modes the connected display supports, with the current and preferred (get-supported-video-modes, or GET /api/video/mode/get)"
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-supported-video-modes } }
      - { models: *ip, method: GET, path: /api/video/mode/get }
    expect: *value
    returns: value
  set_video_mode:
    summary: "Set the output video mode to one get_video_modes lists (set-video-mode)"
    params:
      width: { type: int, min: 1, max: 4096, required: true, label: Width, description: "Width in pixels, from the supported modes." }
      height: { type: int, min: 1, max: 2160, required: true, label: Height, description: "Height in lines, from the supported modes." }
      interlaced: { type: bool, default: false, label: Interlaced, description: "On for an interlaced mode." }
      field_rate: { type: int, min: 1, max: 24000, required: true, label: Field rate, description: "Field rate times 100, as the modes list gives it, e.g. 5994 for 59.94." }
      aspect_ratio: { type: float, min: 0.1, max: 10.0, required: true, label: Aspect ratio, description: "Aspect ratio as the modes list gives it, e.g. 1.78." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-mode, width: "{width}", height: "{height}", interlaced: "{interlaced}", field-rate: "{field_rate}", aspect-ratio: "{aspect_ratio:.2f}" } }
    expect: *ok
    returns: ack
  get_audio_config:
    summary: "Audio output settings: gain, sample rate, channels and mapping (get-audio-config, or GET /api/audio/config/get)"
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: get-audio-config } }
      - { models: *ip, method: GET, path: /api/audio/config/get }
    expect: *value
    returns: value
  set_audio_gain:
    summary: "Audio output gain in dB, -100 to +20 (set-audio-config gain, or /api/audio/config/set)"
    params:
      gain: { type: float, min: -100.0, max: 20.0, required: true, label: Gain, description: "Audio gain in dB, -100.00 to +20.00." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-audio-config, gain: "{gain:.2f}" } }
      - { models: *ip, method: POST, path: /api/audio/config/set, content_type: application/json, body: '{"gain":{gain:.2f}}' }
    expect: *ok
    returns: ack
  set_overlay:
    summary: "Show or hide an overlay on the decoded output: title, tally, VU meter or center cross (set-video-config, or /api/video/config/set)"
    params:
      overlay: { type: enum, values: [title, tally, vu-meter, center-cross], required: true, label: Overlay, description: "The source title, a tally border, audio meters, or a center cross." }
      visible: { type: bool, required: true, label: Visible, description: "On shows the overlay." }
    send:
      - { models: *mw, method: GET, path: /mwapi, raw_query: "method=set-video-config&{overlay:map.overlay_field}={visible}" }
      - { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json,
          body: '{"{overlay:map.overlay_field}":{visible}}' }
    expect: *ok
    returns: ack
  set_switch_mode:
    summary: "What the output shows while the source changes (set-video-config switch-mode)"
    params:
      mode: { type: enum, values: [blank, keep-last], required: true, label: Switch mode, description: "Blank the output, or hold the last frame, while switching." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, switch-mode: "{mode}" } }
    expect: *ok
    returns: ack
  set_aspect_conversion:
    summary: "How a source of another aspect ratio is fitted (set-video-config ar-convert-mode, /api/video/config/set ar-convert, or /api/video/config/update ar_convert_mode)"
    params:
      mode: { type: enum, values: [windowbox, full, zoom], required: true, label: Aspect conversion, description: "Letterbox or pillarbox (windowbox), stretch (full), or crop (zoom)." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, ar-convert-mode: "{mode}" } }
      - { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json,
          body: '{"ar-convert":{mode:map.ar_convert_ip}}' }
      - { models: [ip-to-usb], method: POST, path: /api/video/config/update, content_type: application/json,
          body: '{"data":{"ar_convert_mode":"{mode:map.ar_convert_usb}"}}' }
    expect: *ok
    returns: ack
  set_decoder_flip:
    summary: "Flip the decoded output horizontally or vertically (set-video-config h-flip, v-flip, /api/video/config/set, or /api/video/config/update h_flip, v_flip)"
    params:
      horizontal: { type: bool, default: false, label: Horizontal flip, description: "On mirrors left to right." }
      vertical: { type: bool, default: false, label: Vertical flip, description: "On flips upside down." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, h-flip: "{horizontal}", v-flip: "{vertical}" } }
      - { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json,
          body: '{"h-flip":{horizontal},"v-flip":{vertical}}' }
      - { models: [ip-to-usb], method: POST, path: /api/video/config/update, content_type: application/json,
          body: '{"data":{"h_flip":{horizontal},"v_flip":{vertical}}}' }
    expect: *ok
    returns: ack
  set_buffer_duration:
    summary: "Decoder buffer in milliseconds, 20-120 (set-playback-config buffer-duration)"
    params:
      ms: { type: int, min: 20, max: 120, required: true, label: Buffer, description: "Buffer length in milliseconds; shorter is lower latency and less tolerant of jitter." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-playback-config, buffer-duration: "{ms}" } }
    expect: *ok
    returns: ack
  set_decoder_ndi_discovery:
    summary: "Use NDI discovery servers for finding sources (set-ndi-config enable-discovery, discovery-server, or /api/settings/ndi/set enable-d, d-server)"
    params:
      enabled: { type: bool, required: true, label: Discovery server, description: "On finds sources through the discovery servers given." }
      servers: { type: string, default: "", max_length: 255, label: Servers, description: "Discovery server IP addresses separated by commas; needed when on." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, enable-discovery: "{enabled}", discovery-server: "{servers}" } }
      - { models: *ip, method: POST, path: /api/settings/ndi/set, content_type: application/json,
          body: '{"enable-d":{enabled},"d-server":{servers:json}}' }
    expect: *ok
    returns: ack
  set_decoder_ndi_group:
    summary: "NDI groups the decoder finds sources in (set-ndi-config group-name, or /api/settings/ndi/set groups)"
    params:
      group: { type: string, required: true, max_length: 255, label: NDI group, description: "NDI group name; public is the default." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, group-name: "{group}" } }
      - { models: *ip, method: POST, path: /api/settings/ndi/set, content_type: application/json,
          body: '{"groups":{group:json}}' }
    expect: *ok
    returns: ack
  modify_preset:
    summary: "Rename a preset source or change its URL (modify-channel)"
    params:
      name: { type: string, required: true, max_length: 120, label: Preset, description: "The preset to change, as list_presets lists it." }
      new_name: { type: string, required: true, max_length: 120, label: New name, description: "Its new unique name, 1 to 120 characters; the same name keeps it." }
      url: { type: string, required: true, max_length: 1024, label: URL, description: "Its source URL, in the form add_preset takes." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: modify-channel, name: "{name}", new-name: "{new_name}", url: "{url}" } }
    expect: *ok
    returns: ack
  clear_presets:
    summary: "Delete every preset source (clear-channels)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: clear-channels } }
    expect: *ok
    returns: ack
  get_hdmi_output:
    summary: "Whether the decoded picture is sent to the output (get-hdmi-output)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-hdmi-output } }
    expect: *value
    returns: value
  get_video_format:
    summary: "Output color format and quantization range (get-video-format)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-video-format } }
    expect: *value
    returns: value
  set_output_format:
    summary: "Output color format and quantization range (set-video-format, or /api/video/config/set color-format, quant-range)"
    params:
      color_format: { type: enum, values: [rgb, yuv444, yuv422], required: true, label: Color format, description: "RGB, or YUV 4:4:4 or 4:2:2 on the output." }
      quant_range: { type: enum, values: [limited, full], default: limited, label: Range, description: "Limited or full levels; applies to RGB only." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-video-format, color-format: "{color_format}", quant-range: "{quant_range}" } }
      - { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json,
          body: '{"color-format":"{color_format}","quant-range":"{quant_range}"}' }
    expect: *ok
    returns: ack
  set_audio_sample_rate:
    summary: "Audio output sample rate, or the source's (set-audio-config sample-rate, or /api/audio/config/set)"
    params:
      rate: { type: enum, values: [follow, "32000", "44100", "48000", "88200", "96000"], required: true, label: Sample rate, description: "Output sample rate in Hz, or follow to keep the source's." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-audio-config, sample-rate: "{rate:map.sample_rate}" } }
      - { models: *ip, method: POST, path: /api/audio/config/set, content_type: application/json, body: '{"sample-rate":{rate:map.sample_rate}}' }
    expect: *ok
    returns: ack
  set_audio_channels:
    summary: "Number of audio output channels, or the source's (set-audio-config channels, or /api/audio/config/set)"
    params:
      channels: { type: enum, values: [follow, "2", "4", "8"], required: true, label: Channels, description: "Output channel count, or follow to keep the source's." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-audio-config, channels: "{channels:map.audio_channels}" } }
      - { models: *ip, method: POST, path: /api/audio/config/set, content_type: application/json, body: '{"channels":{channels:map.audio_channels}}' }
    expect: *ok
    returns: ack
  set_audio_channel_map:
    summary: "Which source channel an output channel carries, when the channel count is not follow (set-audio-config ch0-ch15)"
    params:
      output: { type: int, min: 1, max: 16, required: true, label: Output channel, description: "Output channel, numbered from 1." }
      source: { type: int, min: 1, max: 16, required: true, label: Source channel, description: "Source channel it carries, numbered from 1." }
    send: { models: *mw, method: GET, path: /mwapi, raw_query: "method=set-audio-config&ch{output:-1}={source:-1}" }
    expect: *ok
    returns: ack
  set_audio_convert_mode:
    summary: "NDI audio level standard, SMPTE or EBU (set-audio-config convert-mode, or /api/audio/config/set)"
    params:
      mode: { type: enum, values: [smpte, ebu], required: true, label: Level standard, description: "SMPTE or EBU alignment of the NDI audio level." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-audio-config, convert-mode: "{mode}" } }
      - { models: *ip, method: POST, path: /api/audio/config/set, content_type: application/json, body: '{"convert-mode":{mode:map.convert_mode_ip}}' }
    expect: *ok
    returns: ack
  set_audio_check_pts:
    summary: "Check audio timestamps (set-audio-config check-pts, or /api/audio/config/set)"
    params:
      enabled: { type: bool, required: true, label: Check timestamps, description: "On checks the audio PTS against the video." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-audio-config, check-pts: "{enabled}" } }
      - { models: *ip, method: POST, path: /api/audio/config/set, content_type: application/json, body: '{"check-pts":{enabled}}' }
    expect: *ok
    returns: ack
  set_vu_meter_mode:
    summary: "Scale of the VU meter overlay (set-video-config vu-meter-mode)"
    params:
      mode: { type: enum, values: [none, dbu, dbvu, dbfs, post-gain-dbu, post-gain-dbvu, post-gain-dbfs], required: true, label: Meter scale,
