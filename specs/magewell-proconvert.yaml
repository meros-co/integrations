  set_balanced_output_level:
    summary: "Reference level of the balanced analog output (general-settings or general-apply bld-out)"
    params:
      level: { type: enum, values: ["+18dBu", "+4dBu", "0dBu", "-2dBu", "0dBV", "-10dBV"], required: true, label: Output level, description: "The analog level full scale gives; +18dBu is the default." }
    send:
      - { models: [aes67], method: POST, path: /api/aes67/general-settings, content_type: application/json, body: '{"bld-out":{level:map.bld_out_level_aes67}}' }
      - { models: [audio-dx], method: POST, path: /api/aoip/general-apply, content_type: application/json, body: '{"bld-out":"{level:map.bld_level_dx}"}' }
    expect: *ok
    returns: ack
