        ndi.audio_kbps: "{akbps}"
        ndi.audio_channels: "{achannels}"
        ndi.audio_sample_rate: "{arate}"
        tally.preview: "{preview}"
        tally.program: "{program}"
        ptz.enabled: "{ptz}"
        profile.current_id: "{profile}"
    - path: "^/api/system/summary$"
      json_match: { "$.status": "^0$" }
      json: { mode: "$.mode" }
      state: { config.mode: { value: "{mode}", map: { "1": simple, "2": profile } } }

    # Encoder API section 7.1 (get-video-config; reset-video-config answers
    # the same fields).
    - path: "^/mwapi\\?method=(get|reset)-video-config$"
      json_match: { "$.status": "^0$", "$.out-raw-resolution": "^(true|false)$" }
      json:
        adv: "$.show-adv-ui"
        brightness: "$.brightness"
        contrast: "$.contrast"
        hue: "$.hue"
        saturation: "$.saturation"
        deinterlace: "$.deinterlace"
        flip: "$.out-flip"
        mirror: "$.out-mirror"
        cx: "$.out-cx"
        cy: "$.out-cy"
        raw: "$.out-raw-resolution"
        ratio: "$.bit-rate-ratio"
        in_aspect_auto: "$.in-auto-aspect"
        in_x: "$.in-aspect-x"
        in_y: "$.in-aspect-y"
        in_color_auto: "$.in-auto-color-fmt"
        in_color: "$.in-color-fmt"
        in_quant_auto: "$.in-auto-quant-range"
        in_quant: "$.in-quant-range"
        ar: "$.ar-convertion"
        out_aspect_auto: "$.out-auto-aspect"
        out_x: "$.out-aspect-x"
        out_y: "$.out-aspect-y"
        fr: "$.out-fr-convertion"
        out_color_auto: "$.out-auto-color-fmt"
        out_color: "$.out-color-fmt"
        sat_auto: "$.out-auto-sat-range"
        sat: "$.out-sat-range"
        out_quant_auto: "$.out-auto-quant-range"
        out_quant: "$.out-quant-range"
        low_res: "$.low-res-full-fr"
      state:
        video.show_advanced: "{adv}"
        video.brightness: "{brightness}"
        video.contrast: "{contrast}"
        video.hue: "{hue}"
        video.saturation: "{saturation}"
        video.deinterlace: "{deinterlace}"
        video.v_flip: "{flip}"
        video.h_flip: "{mirror}"
        video.output_width: "{cx}"
        video.output_height: "{cy}"
        video.output_follows_input: "{raw}"
        video.bitrate_ratio: "{ratio}"
        video.input_aspect_auto: "{in_aspect_auto}"
        video.input_aspect: "{in_x}:{in_y}"
        video.input_color_auto: "{in_color_auto}"
        video.input_color_format: "{in_color}"
        video.input_quant_auto: "{in_quant_auto}"
        video.input_quant_range: "{in_quant}"
        video.aspect_conversion: "{ar}"
        video.output_aspect_auto: "{out_aspect_auto}"
        video.output_aspect: "{out_x}:{out_y}"
        video.frame_rate_conversion: "{fr}"
        video.output_color_auto: "{out_color_auto}"
        video.output_color_format: "{out_color}"
        video.output_sat_auto: "{sat_auto}"
        video.output_sat_range: "{sat}"
        video.output_quant_auto: "{out_quant_auto}"
        video.output_quant_range: "{out_quant}"
        video.low_res_full_frame_rate: "{low_res}"
    # Decoder API V1.3 section 7.1.
    - path: "^/mwapi\\?method=(get|reset)-video-config$"
      json_match: { "$.status": "^0$", "$.switch-mode": "." }
      json:
        title: "$.show-title"
        tally: "$.show-tally"
        vu: "$.show-vu-meter"
        vu_mode: "$.vu-meter-mode"
        cross: "$.show-center-cross"
        safe: "$.safe-area-mode"
        ident: "$.ident-mode"
        ident_text: "$.ident-text"
        h: "$.h-flip"
        v: "$.v-flip"
        switch: "$.switch-mode"
        reset: "$.reset-source-on-boot"
        deint: "$.deinterlace-mode"
        color_auto: "$.in-auto-color-fmt"
        color: "$.in-color-fmt"
        ar: "$.ar-convert-mode"
        follow: "$.follow-input-mode"
      state:
        video.overlay.title: "{title}"
        video.overlay.tally: "{tally}"
        video.overlay.vu_meter: "{vu}"
        video.vu_meter_mode: "{vu_mode}"
        video.overlay.center_cross: "{cross}"
        video.safe_area: "{safe}"
        video.ident_mode: "{ident}"
        video.ident_text: "{ident_text}"
        video.h_flip: "{h}"
        video.v_flip: "{v}"
        video.switch_mode: "{switch}"
        video.reset_source_on_boot: "{reset}"
        video.deinterlace: "{deint}"
        video.input_color_auto: "{color_auto}"
        video.input_color_format: "{color}"
        video.aspect_conversion: "{ar}"
        video.output_follows_input: "{follow}"
    # IP Decoder API section 4.1: numbered values in the NDI decoders' words.
    - models: *ip
      path: "^/api/video/config/get$"
      json_match: { "$.status": "^0$" }
      json:
        title: "$.show-title"
        tally: "$.show-tally"
        vu: "$.show-vu-meter"
        vu_mode: "$.vu-meter-mode"
        cross: "$.show-center-cross"
        safe: "$.safe-area"
        ident: "$.ident-mode"
        ident_text: "$.ident-text"
        h: "$.h-flip"
        v: "$.v-flip"
        deint: "$.deinterlace-mode"
        force: "$.force-deint"
        ar: "$.ar-convert"
        follow: "$.follow-input"
        follow_ok: "$.enable-follow-input"
        color_format: "$.color-format"
        quant: "$.quant-range"
        switch: "$.switch-mode"
        in_color: "$.in-color-fmt"
        hdr: "$.hdr-output-mode"
        debug: "$.screen-debug"
        webrtc: "$.enable-webrtc"
        view: "$.screen-mode"
      state:
        video.overlay.title: "{title}"
        video.overlay.tally: "{tally}"
        video.overlay.vu_meter: "{vu}"
        video.vu_meter_mode: { value: "{vu_mode}", map: { "0": hide, "1": post-dbvu, "2": post-dbfs } }
        video.overlay.center_cross: "{cross}"
        video.safe_area: { value: "{safe}", map: { "0": none, "1": "4:3", "2": "80%", "3": square } }
        video.ident_mode: { value: "{ident}", map: { "0": none, "1": text, "2": source-name } }
        video.ident_text: "{ident_text}"
        video.h_flip: "{h}"
        video.v_flip: "{v}"
        video.deinterlace: { value: "{deint}", map: { "0": bob, "1": weave, "2": blend } }
        video.force_deinterlace: "{force}"
        video.aspect_conversion: { value: "{ar}", map: { "0": windowbox, "1": zoom, "2": full } }
        video.output_follows_input: "{follow}"
        video.follow_input_allowed: "{follow_ok}"
        video.output_color_format: "{color_format}"
        video.output_quant_range: "{quant}"
        video.switch_mode: { value: "{switch}", map: { "0": no-signal-image, "1": black, "2": last-frame, "3": output-off } }
        video.input_color_auto: { value: "{in_color}", map: { "0": true, "1": false, "2": false, "3": false } }
        video.input_color_format: { value: "{in_color}", map: { "1": bt.601, "2": bt.709, "3": bt.2020 } }
        video.hdr_output_mode: { value: "{hdr}", map: { "0": auto, "1": disable, "2": hdr-pq, "3": hlg } }
        video.screen_debug: "{debug}"
        video.webrtc_preview: "{webrtc}"
        video.view_mode: { value: "{view}", map: { "1": single, "2": pip, "4": quad } }
    # Decoder API V1.3 sections 7.7-7.8 (set-video-format answers the same).
    - path: "^/mwapi\\?method=(get|set)-video-format(&|$)"
      json_match: { "$.status": "^0$" }
      json: { format: "$.color-format", quant: "$.quant-range" }
      state:
        video.output_color_format: "{format}"
        video.output_quant_range: "{quant}"
    # Decoder API V1.3 section 7.9.
    - path: "^/mwapi\\?method=get-hdmi-output$"
      json_match: { "$.status": "^0$" }
      json: { enabled: "$.enabled" }
      state: { output.enabled: "{enabled}" }
    # Decoder API V1.3 section 7.5 and IP Decoder API section 4.4: the list
    # whole, and the mode in use.
    - path: "^(/mwapi\\?method=get-supported-video-modes|/api/video/mode/get)$"
      json_match: { "$.status": "^0$" }
      json_each: "$.modes"
      json: { width: "$.width", height: "$.height", interlaced: "$.interlaced", field: "$.field-rate", frame: "$.frame-rate", preferred: "$.pref-mode" }
      replace: output.modes
      state:
        output.modes.{index}.width: "{width}"
        output.modes.{index}.height: "{height}"
        output.modes.{index}.interlaced: "{interlaced}"
        output.modes.{index}.rate: "{field}"
        output.modes.{index}.preferred: "{preferred}"
    - path: "^/api/video/mode/get$"
      json_match: { "$.status": "^0$" }
      json_each: "$.modes"
      json: { frame: "$.frame-rate" }
      state: { "output.modes.{index}.rate": "{frame}" }
    - path: "^(/mwapi\\?method=get-supported-video-modes|/api/video/mode/get)$"
      json_match: { "$.status": "^0$" }
      json_each: "$.modes"
      each_match: { "$.curr-mode": "^true$" }
      json: { width: "$.width", height: "$.height", interlaced: "$.interlaced", field: "$.field-rate", frame: "$.frame-rate" }
      state:
        output.mode.width: "{width}"
        output.mode.height: "{height}"
        output.mode.interlaced: "{interlaced}"
        output.mode.rate: "{field}"
    - path: "^/api/video/mode/get$"
      json_match: { "$.status": "^0$" }
      json_each: "$.modes"
      each_match: { "$.curr-mode": "^true$" }
      json: { frame: "$.frame-rate" }
      state: { output.mode.rate: "{frame}" }
    # Decoder API V1.3 section 8.1.
    - path: "^/mwapi\\?method=get-audio-config$"
      json_match: { "$.status": "^0$" }
      json:
        gain: "$.gain"
        rate: "$.sample-rate"
        channels: "$.channels"
        mode: "$.convert-mode"
        pts: "$.check-pts"
        ch0: "$.ch0"
        ch1: "$.ch1"
        ch2: "$.ch2"
        ch3: "$.ch3"
        ch4: "$.ch4"
        ch5: "$.ch5"
        ch6: "$.ch6"
        ch7: "$.ch7"
        ch8: "$.ch8"
        ch9: "$.ch9"
        ch10: "$.ch10"
        ch11: "$.ch11"
        ch12: "$.ch12"
        ch13: "$.ch13"
        ch14: "$.ch14"
        ch15: "$.ch15"
      state:
        audio.gain: "{gain}"
        audio.sample_rate: "{rate}"
        audio.channels: "{channels}"
        audio.convert_mode: "{mode}"
        audio.check_pts: "{pts}"
        audio.map.1: "{ch0:+1}"
        audio.map.2: "{ch1:+1}"
        audio.map.3: "{ch2:+1}"
        audio.map.4: "{ch3:+1}"
        audio.map.5: "{ch4:+1}"
        audio.map.6: "{ch5:+1}"
        audio.map.7: "{ch6:+1}"
        audio.map.8: "{ch7:+1}"
        audio.map.9: "{ch8:+1}"
        audio.map.10: "{ch9:+1}"
        audio.map.11: "{ch10:+1}"
        audio.map.12: "{ch11:+1}"
        audio.map.13: "{ch12:+1}"
        audio.map.14: "{ch13:+1}"
        audio.map.15: "{ch14:+1}"
        audio.map.16: "{ch15:+1}"
    # IP Decoder API section 5.1.
    - path: "^/api/audio/config/get$"
      json_match: { "$.status": "^0$" }
      json: { gain: "$.gain", rate: "$.sample-rate", channels: "$.channels", mode: "$.convert-mode", pts: "$.check-pts", map: "$.channel-map" }
      state:
        audio.gain: "{gain}"
        audio.sample_rate: "{rate}"
        audio.channels: "{channels}"
        audio.convert_mode: { value: "{mode}", map: { "0": smpte, "1": ebu } }
        audio.check_pts: "{pts}"
        audio.channel_map: "{map}"
    # Decoder API V1.3 sections 10.1-10.2.
    - path: "^/mwapi\\?method=get-channel$"
      json_match: { "$.status": "^0$" }
      json: { name: "$.name", ndi: "$.ndi-name" }
      state:
        source.name: "{name}"
        source.ndi: "{ndi}"
    - path: "^/mwapi\\?method=list-channels$"
      json_match: { "$.status": "^0$" }
      json_each: "$.channels"
      json: { name: "$.name", url: "$.url", hotkey: "$.hotkey" }
      replace: presets
      state:
        presets.{index}.name: "{name}"
        presets.{index}.url: "{url}"
        presets.{index}.hotkey: "{hotkey}"
    - path: "^/mwapi\\?method=get-playback-config$"
      json_match: { "$.status": "^0$" }
      json: { ms: "$.buffer-duration" }
      state: { decoder.buffer_ms: "{ms}" }
    # Encoder API section 9.1 and Decoder API V1.3 section 11.1 (each
    # reports its own subset).
    - path: "^/mwapi\\?method=get-ndi-config$"
      json_match: { "$.status": "^0$" }
      json:
        enabled: "$.enable"
        source_name: "$.source-name"
        groups: "$.group-name"
        web: "$.enable-web-control"
        ptz: "$.enable-ptz-control"
        fo: "$.enable-fail-over"
        fo_name: "$.fail-over-ndi-name"
        fo_ip: "$.fail-over-ip-addr"
        mcast: "$.enable-mcast"
        rudp: "$.enable-rudp"
        tcp: "$.enable-tcp"
        udp: "$.enable-udp"
        addr: "$.mcast-addr"
        mask: "$.mcast-mask"
        ttl: "$.mcast-ttl"
        subnets: "$.mcast-subnets"
        disc: "$.enable-discovery"
        servers: "$.discovery-server"
        level: "$.reference-level"
        vendor: "$.vendor-name"
        vendor_id: "$.vendor-id"
        low: "$.low-bandwidth"
        hx: "$.ignore-ndi-hx-video-pts"
        tc: "$.use-timecode-first"
      state:
        ndi.enabled: "{enabled}"
        ndi.source_name: "{source_name}"
        ndi.groups: "{groups}"
        ndi.web_control: "{web}"
        ndi.ptz_control: "{ptz}"
        ndi.failover.enabled: "{fo}"
        ndi.failover.name: "{fo_name}"
        ndi.failover.address: "{fo_ip}"
        ndi.transport_flags.multicast: "{mcast}"
        ndi.transport_flags.rudp: "{rudp}"
        ndi.transport_flags.multi_tcp: "{tcp}"
        ndi.transport_flags.udp: "{udp}"
        ndi.multicast.address: "{addr}"
        ndi.multicast.netmask: "{mask}"
        ndi.multicast.ttl: "{ttl}"
        ndi.multicast_subnets: "{subnets}"
        ndi.discovery.enabled: "{disc}"
        ndi.discovery.servers: "{servers}"
        ndi.reference_level: { value: "{level}", map: { "20": smpte, "14": ebu } }
        ndi.vendor_name: "{vendor}"
        ndi.vendor_id: "{vendor_id}"
        ndi.low_bandwidth: "{low}"
        ndi.ignore_hx_pts: "{hx}"
        ndi.timecode_first: "{tc}"
    # The transport as one value: the flag that is on, or tcp when all four
    # are reported off.
    - path: "^/mwapi\\?method=get-ndi-config$"
      json_match: { "$.status": "^0$", "$.enable-mcast": "^true$" }
      json: {}
      state: { ndi.transport: multicast }
    - path: "^/mwapi\\?method=get-ndi-config$"
      json_match: { "$.status": "^0$", "$.enable-rudp": "^true$" }
      json: {}
      state: { ndi.transport: rudp }
    - path: "^/mwapi\\?method=get-ndi-config$"
      json_match: { "$.status": "^0$", "$.enable-tcp": "^true$" }
      json: {}
      state: { ndi.transport: multi-tcp }
    - path: "^/mwapi\\?method=get-ndi-config$"
      json_match: { "$.status": "^0$", "$.enable-udp": "^true$" }
      json: {}
      state: { ndi.transport: udp }
    - path: "^/mwapi\\?method=get-ndi-config$"
      json_match: { "$.status": "^0$", "$.enable-mcast": "^false$", "$.enable-rudp": "^false$", "$.enable-tcp": "^false$", "$.enable-udp": "^false$" }
      json: {}
      state: { ndi.transport: tcp }
    - path: "^/mwapi\\?method=get-ndi-sources$"
      json_match: { "$.status": "^0$" }
      json_each: "$.sources"
      json: { name: "$.ndi-name", address: "$.ip-addr" }
      replace: ndi.sources
      state:
        ndi.sources.{index}.name: "{name}"
        ndi.sources.{index}.address: "{address}"
    # Encoder API section 9.4.
    - path: "^/mwapi\\?method=get-tally$"
      json_match: { "$.status": "^0$" }
      json: { ext: "$.ext-tally" }
      state: { tally.user_controlled: "{ext}" }
    # Encoder API section PTZ, get-ptz-config.
    - path: "^/mwapi\\?method=get-ptz-config$"
      json_match: { "$.status": "^0$" }
      json:
        proto: "$.proto"
        index: "$.index"
        baud: "$.baudrate"
        ip: "$.invert-pan"
        it: "$.invert-tilt"
        addr: "$.ip-addr"
        port: "$.port"
        hdr: "$.visca-msg-hdr"
        pl: "$.pan-left-limit"
        pc: "$.pan-center"
        pr: "$.pan-right-limit"
        tt: "$.tilt-top-limit"
        tc: "$.tilt-center"
        tb: "$.tilt-bottom-limit"
        zo: "$.zoom-out-limit"
        fn: "$.focus-near-limit"
        ff: "$.focus-far-limit"
      state:
        ptz.protocol: "{proto}"
        ptz.camera: "{index}"
        ptz.baudrate: "{baud}"
        ptz.invert_pan: "{ip}"
        ptz.invert_tilt: "{it}"
        ptz.address: "{addr}"
        ptz.port: "{port}"
        ptz.visca_header: "{hdr}"
        ptz.limits.pan_left: "{pl}"
        ptz.limits.pan_center: "{pc}"
        ptz.limits.pan_right: "{pr}"
        ptz.limits.tilt_top: "{tt}"
        ptz.limits.tilt_center: "{tc}"
        ptz.limits.tilt_bottom: "{tb}"
        ptz.limits.zoom_out: "{zo}"
        ptz.limits.focus_near: "{fn}"
        ptz.limits.focus_far: "{ff}"
    # Encoder API section EDID (set-default-edid answers the same fields).
    - path: "^/mwapi\\?method=(get-edid-config|set-default-edid)$"
      json_match: { "$.status": "^0$" }
      json: { smart: "$.smart-edid", keep: "$.keep-last", audio: "$.add-audio", clock: "$.limit-pixel-clock" }
      state:
        edid.smart: "{smart}"
        edid.keep_last: "{keep}"
        edid.add_audio: "{audio}"
        edid.limit_pixel_clock: "{clock}"
    # Universal Interfaces and Network (both APIs on /mwapi).
    - path: "^/mwapi\\?method=get-auto-reboot$"
      json_match: { "$.status": "^0$" }
      json: { enabled: "$.enable", days: "$.week-flags", hour: "$.hour", minute: "$.min" }
      state:
        auto_reboot.enabled: "{enabled}"
        auto_reboot.days: "{days}"
        auto_reboot.hour: "{hour}"
        auto_reboot.minute: "{minute}"
    - path: "^/mwapi\\?method=get-ntp-server$"
      json_match: { "$.status": "^0$" }
      json: { server: "$.ntp-server" }
      state: { network.ntp_server: "{server}" }
    - path: "^/mwapi\\?method=get-net-access$"
      json_match: { "$.status": "^0$" }
      json: { ssdp: "$.use-ssdp" }
      state: { network.ssdp: "{ssdp}" }
    - path: "^/mwapi\\?method=get-eth-status$"
      json_match: { "$.status": "^0$" }
      json: { dhcp: "$.use-dhcp", name: "$.device-name", state: "$.state", ip: "$.ip-addr", mask: "$.ip-mask", gw: "$.gw-addr", dns: "$.dns-addr" }
      state:
        network.ethernet.dhcp: "{dhcp}"
        device.name: "{name}"
        network.ethernet.state: "{state}"
        network.ethernet.ip_address: "{ip}"
        network.ethernet.netmask: "{mask}"
        network.ethernet.gateway: "{gw}"
        network.ethernet.dns: "{dns}"
    # IP Decoder API section 3.1: both lists whole, keyed by source id.
    - path: "^/api/source/list\\?type=all$"
      json_match: { "$.status": "^0$" }
      json_each: "$.static"
      json: { id: "$.id", name: "$.config.name", type: "$.config.type", protocol: "$.protocol", url: "$.config.url",
              ndi_name: "$.config.ndi.name", ndi_url: "$.config.ndi.url", hotkey: "$.config.hotkey" }
      replace: sources
      state: &source_state
        sources.{id}.name: "{name}"
        sources.{id}.type: "{type}"
        sources.{id}.protocol: { value: "{protocol}", map: { "1": rtmp, "2": srt, "4": udp, "8": rtp, "16": rtsp, "32": http, "64": ndi, "128": zixi, "256": rist } }
        sources.{id}.url: "{url}"
        sources.{id}.ndi_name: "{ndi_name}"
        sources.{id}.ndi_url: "{ndi_url}"
        sources.{id}.hotkey: "{hotkey}"
    - path: "^/api/source/list\\?type=all$"
      json_match: { "$.status": "^0$" }
      json_each: "$.static"
      json: { id: "$.id" }
      state: { "sources.{id}.kind": static }
    - path: "^/api/source/list\\?type=all$"
      json_match: { "$.status": "^0$" }
      json_each: "$.ndi"
      json: { id: "$.id", name: "$.config.name", type: "$.config.type", protocol: "$.protocol", url: "$.config.url",
              ndi_name: "$.config.ndi.name", ndi_url: "$.config.ndi.url", hotkey: "$.config.hotkey" }
      replace: sources
      state: *source_state
    - path: "^/api/source/list\\?type=all$"
      json_match: { "$.status": "^0$" }
      json_each: "$.ndi"
      json: { id: "$.id" }
      state: { "sources.{id}.kind": ndi }
    - path: "^/api/source/list\\?type=all$"
      json_match: { "$.status": "^0$" }
      json: { selected: "$.selected" }
      state: { source.selected_id: "{selected}" }
    # IP Decoder API section 6.1: the profiles whole, keyed by id, with each
    # profile's screens.
    - path: "^/api/profile/list$"
      json_match: { "$.status": "^0$" }
      json_each: "$.profiles"
      json: { id: "$.id", name: "$.name", mode: "$.mode", audio: "$.audio-idx", selected: "$.selected" }
      replace: profiles
      state:
        profiles.{id}.name: "{name}"
        profiles.{id}.view_mode: { value: "{mode}", map: { "1": single, "2": pip, "4": quad } }
        profiles.{id}.audio_screen: "{audio}"
        profiles.{id}.selected: "{selected}"
    - path: "^/api/profile/list$"
      json_match: { "$.status": "^0$" }
      json_each: "$.profiles[*].screens"
      json: { profile: "$^.id", source: "$.id", name: "$.name" }
      state:
        profiles.{profile}.screens.{index}.source_id: "{source}"
        profiles.{profile}.screens.{index}.source_name: "{name}"
    - path: "^/api/profile/list$"
      json_match: { "$.status": "^0$" }
      json: { current: "$.current-id" }
      state: { profile.current_id: "{current}" }
    # IP Decoder API section Settings.
    - path: "^/api/settings/get$"
      json_match: { "$.status": "^0$" }
      json: { mode: "$.mode", lang: "$.gui.lang", disc: "$.ndi.enable-d", servers: "$.ndi.d-server", groups: "$.ndi.groups",
              extra: "$.ndi.extra-ips", transport: "$.ndi.transport", subnets: "$.ndi.mcast-subnets", pts: "$.ndi.pts-mode",
              low: "$.ndi.low-bw", buffer: "$.ndi.buffer-ms" }
      state:
        config.mode: { value: "{mode}", map: { "1": simple, "2": profile } }
        config.language: "{lang}"
        ndi.discovery.enabled: "{disc}"
        ndi.discovery.servers: "{servers}"
        ndi.groups: "{groups}"
        ndi.extra_ips: "{extra}"
        ndi.transport: "{transport}"
        ndi.multicast_subnets: "{subnets}"
        ndi.pts_mode: "{pts}"
        ndi.low_bandwidth: "{low}"
        ndi.default_buffer_ms: "{buffer}"
    - path: "^/api/settings/zixi/master/get$"
      json_match: { "$.status": "^0$" }
      json: { enabled: "$.enable", host: "$.host", ssh: "$.ssh-port", tunnel: "$.tunnel-port", user: "$.user-name", state: "$.state" }
      state:
        zen_master.enabled: "{enabled}"
        zen_master.host: "{host}"
        zen_master.ssh_port: "{ssh}"
        zen_master.tunnel_port: "{tunnel}"
        zen_master.user: "{user}"
        zen_master.state: "{state}"
    # Base API, Get basic info (AES67 API section 16.2, Audio DX API 8.2, IP
    # to USB API 3.3).
    - path: "^/api/system/info$"
      json_match: { "$.status": "^0$" }
      json: { name: "$.device-name", uptime: "$.uptime", ntp: "$.datetime.ntp-server1", enabled: "$.auto-reboot.enable",
              hour: "$.auto-reboot.hour", minute: "$.auto-reboot.min", week: "$.auto-reboot.week", cpu: "$.cpu.usage",
              mem: "$.mem.total", avail: "$.mem.avail", time: "$.datetime.cur-time", zone: "$.datetime.zonename",
              ntp_on: "$.datetime.ntp-enable", ntp2: "$.datetime.ntp-server2" }
      state:
        device.name: "{name}"
        device.uptime: "{uptime}"
        device.cpu_usage: "{cpu:from.percent_x100}"
        device.memory_total_kb: "{mem}"
        device.memory_available_kb: "{avail}"
        device.time: "{time}"
        device.timezone: "{zone}"
        network.ntp_enabled: "{ntp_on}"
        network.ntp_server: "{ntp}"
        network.ntp_server2: "{ntp2}"
        auto_reboot.enabled: "{enabled}"
        auto_reboot.hour: "{hour}"
        auto_reboot.minute: "{minute}"
        auto_reboot.week: "{week}"

    # AES67 API section 3.1, Audio DX API section 3.1. The temperature is
    # text with its unit ("79.61°C"), so it is read from the body's text.
    - path: "^/api/(?:aes67|aoip)/summary-info$"
      json_match: { "$.status": "^0$" }
      json:
        board: "$.card-address"
        ui_l: "$.unbalance.in.linked"
        ui_d: "$.unbalance.in.depth"
        ui_c: "$.unbalance.in.channel-num"
        uo_l: "$.unbalance.out.linked"
        uo_d: "$.unbalance.out.depth"
        uo_c: "$.unbalance.out.channel-num"
        bi_l: "$.balance.in.linked"
        bi_d: "$.balance.in.depth"
        bi_c: "$.balance.in.channel-num"
        bo_l: "$.balance.out.linked"
        bo_d: "$.balance.out.depth"
        bo_c: "$.balance.out.channel-num"
        usb: "$.uac.usb-connected"
        ai_l: "$.uac.in.linked"
        ai_r: "$.uac.in.sample-rate"
        ai_d: "$.uac.in.depth"
        ai_c: "$.uac.in.channel-num"
        ao_l: "$.uac.out.linked"
        ao_r: "$.uac.out.sample-rate"
        ao_d: "$.uac.out.depth"
        ao_c: "$.uac.out.channel-num"
      state:
        device.board_id: "{board}"
        io.unbalanced.in.linked: "{ui_l}"
        io.unbalanced.in.depth: "{ui_d}"
        io.unbalanced.in.channels: "{ui_c}"
        io.unbalanced.out.linked: "{uo_l}"
        io.unbalanced.out.depth: "{uo_d}"
        io.unbalanced.out.channels: "{uo_c}"
        io.balanced.in.linked: "{bi_l}"
        io.balanced.in.depth: "{bi_d}"
        io.balanced.in.channels: "{bi_c}"
        io.balanced.out.linked: "{bo_l}"
        io.balanced.out.depth: "{bo_d}"
        io.balanced.out.channels: "{bo_c}"
        io.usb.connected: "{usb}"
        io.usb.in.linked: "{ai_l}"
        io.usb.in.sample_rate: "{ai_r}"
        io.usb.in.depth: "{ai_d}"
        io.usb.in.channels: "{ai_c}"
        io.usb.out.linked: "{ao_l}"
        io.usb.out.sample_rate: "{ao_r}"
        io.usb.out.depth: "{ao_d}"
        io.usb.out.channels: "{ao_c}"
    - path: "^/api/(?:aes67|aoip)/summary-info$"
      match: '"temperature"\s*:\s*"(-?[0-9]+(?:\.[0-9]+)?)'
      state: { device.temperature: "{1}" }
    - path: "^/api/aes67/summary-info$"
      json_match: { "$.status": "^0$" }
      json_each: "$.sources"
      json: { name: "$.name", rate: "$.sample-rate", depth: "$.depth", channels: "$.channel-num", ptime: "$.ptime" }
      replace: aes67.active_sources
      state:
        aes67.active_sources.{index}.name: "{name}"
        aes67.active_sources.{index}.sample_rate: "{rate}"
        aes67.active_sources.{index}.depth: "{depth}"
        aes67.active_sources.{index}.channels: "{channels}"
        aes67.active_sources.{index}.ptime: "{ptime}"
    - path: "^/api/aes67/summary-info$"
      json_match: { "$.status": "^0$" }
      json_each: "$.sinks"
      json: { name: "$.name", rate: "$.sample-rate", depth: "$.depth", channels: "$.channel-num", ptime: "$.ptime", qos: "$.qos" }
      replace: aes67.active_sinks
      state:
        aes67.active_sinks.{index}.name: "{name}"
        aes67.active_sinks.{index}.sample_rate: "{rate}"
        aes67.active_sinks.{index}.depth: "{depth}"
        aes67.active_sinks.{index}.channels: "{channels}"
        aes67.active_sinks.{index}.ptime: "{ptime}"
        aes67.active_sinks.{index}.qos: "{qos}"
    # AES67 API section 4.1: numbered values.
    - path: "^/api/aes67/general-info$"
      json_match: { "$.status": "^0$" }
      json: { rate: "$.tx-sample-rate", ptime: "$.tx-ptime", ui: "$.unbld-in", uo: "$.unbld-out", bi: "$.bld-in", bo: "$.bld-out",
              bias: "$.micbias", st2110: "$.st2110", igmp: "$.igmp", aac: "$.aac-bitrate-kbps", tone: "$.audio-pattern",
              uac: "$.uac-num-channels" }
      state:
        aoip.sample_rate: "{rate}"
        aoip.packet_time: "{ptime}"
        analog.unbalanced_in_level: { value: "{ui}", map: { "0": "+12dBu", "1": "+4dBu", "2": "0dBu", "3": "-2dBu", "4": "0dBV", "5": "-10dBV" } }
        analog.unbalanced_out_level: { value: "{uo}", map: { "0": "+12dBu", "1": "+4dBu", "2": "0dBu", "3": "-2dBu", "4": "0dBV", "5": "-10dBV" } }
        analog.balanced_in_level: { value: "{bi}", map: { "0": "+24dBu", "1": "+18dBu", "2": "+4dBu", "3": "0dBu", "4": "-2dBu", "5": "0dBV", "6": "-10dBV" } }
        analog.balanced_out_level: { value: "{bo}", map: { "0": "+18dBu", "1": "+4dBu", "2": "0dBu", "3": "-2dBu", "4": "0dBV", "5": "-10dBV" } }
        analog.mic_bias: "{bias}"
        aoip.st2110: "{st2110}"
        network.igmp: { value: "{igmp}", map: { "0": auto, "2": v2, "3": v3 } }
        stream.aac_bitrate_kbps: "{aac}"
        analog.test_tone: { value: "{tone}", map: { "0": "off", "1": analog-input, "2": analog-output } }
        io.usb.channel_setting: "{uac}"
    # Audio DX API section 4.2: the same as text.
    - path: "^/api/aoip/general-info$"
      json_match: { "$.status": "^0$" }
      json: { lock: "$.device-lock", rate: "$.tx-sample-rate", ui: "$.unbld-in", uo: "$.unbld-out", bi: "$.bld-in", bo: "$.bld-out",
              bias: "$.micbias", igmp: "$.igmp", tone: "$.audio-pattern", uac: "$.uac-num-channels" }
      state:
        dante.device_lock: "{lock}"
        aoip.sample_rate: "{rate}"
        analog.unbalanced_in_level: { value: "{ui}", map: &dx_unbld { "+12dBu": "+12dBu", "+4dBu": "+4dBu", "0dBu": "0dBu", "+0dBu": "0dBu", "-2dBu": "-2dBu", "0dBV": "0dBV", "-10dBV": "-10dBV" } }
        analog.unbalanced_out_level: { value: "{uo}", map: *dx_unbld }
        analog.balanced_in_level: { value: "{bi}", map: &dx_bld { "+24dBu": "+24dBu", "+18dBu": "+18dBu", "+4dBu": "+4dBu", "0dBu": "0dBu", "+0dBu": "0dBu", "-2dBu": "-2dBu", "-2dBV": "-2dBu", "0dBV": "0dBV", "-10dBV": "-10dBV" } }
        analog.balanced_out_level: { value: "{bo}", map: *dx_bld }
        analog.mic_bias: "{bias}"
        network.igmp: { value: "{igmp}", map: { Auto: auto, IGMPv2: v2, IGMPv3: v3 } }
        analog.test_tone: { value: "{tone}", map: { "off": "off", input: analog-input, output: analog-output } }
        io.usb.channel_setting: "{uac}"
    # AES67 API sections 5.1, 5.3 (ptp-default answers the defaults it set)
    # and 5.4.
    - path: "^/api/aes67/ptp-(info|default)$"
      json_match: { "$.status": "^0$" }
      json: { version: "$.version", p1: "$.priority1", p2: "$.priority2", domain: "$.domain", gm: "$.gmid", role: "$.role",
              delay: "$.delay-mech", announce: "$.announce", sync: "$.sync" }
      state:
        ptp.version: "{version}"
        ptp.priority1: "{p1}"
        ptp.priority2: "{p2}"
        ptp.domain: "{domain}"
        ptp.grandmaster: "{gm}"
        ptp.role: { value: "{role}", map: { Auto: auto, Slaver: follower } }
        ptp.delay_mechanism: "{delay}"
        ptp.announce_interval: "{announce}"
        ptp.sync_interval: "{sync}"
    - path: "^/api/aes67/ptp-state$"
      json_match: { "$.status": "^0$" }
      json: { sync: "$.is-sync", leader: "$.is-master", lock: "$.lock-to", time: "$.statistics.datetime",
              interval: "$.statistics.interval", delay: "$.statistics.delay" }
      state:
        ptp.synced: "{sync}"
        ptp.leader: "{leader}"
        ptp.locked_to: "{lock}"
        ptp.datetime: "{time}"
        ptp.statistics_interval_ms: "{interval}"
        ptp.delay_ns: "{delay}"
    # AES67 API sections 6.1 and 7.1: the lists whole, keyed by uid and sink
    # index; the sources found on the network by position.
    - path: "^/api/aes67/source-info$"
      json_match: { "$.status": "^0$" }
      json_each: "$.sources"
      json: { uid: "$.uid", name: "$.name", enabled: "$.enable", state: "$.state", ip: "$.dst-ip", port: "$.dst-port",
              payload: "$.payload", depth: "$.depth", channels: "$.channel-num", ttl: "$.ttl", dscp: "$.dscp", sdp: "$.sdp" }
      replace: aes67.sources
      state:
        aes67.sources.{uid}.name: "{name}"
        aes67.sources.{uid}.enabled: "{enabled}"
        aes67.sources.{uid}.state: { value: "{state}", map: { "0": pending, "1": sending, "2": fail, "3": unicast-unavailable } }
        aes67.sources.{uid}.address: "{ip}"
        aes67.sources.{uid}.port: "{port}"
        aes67.sources.{uid}.payload: "{payload}"
        aes67.sources.{uid}.depth: "{depth}"
        aes67.sources.{uid}.channels: "{channels}"
        aes67.sources.{uid}.ttl: "{ttl}"
        aes67.sources.{uid}.dscp: "{dscp}"
        aes67.sources.{uid}.sdp: "{sdp}"
    - path: "^/api/aes67/sink-info$"
      json_match: { "$.status": "^0$" }
      json_each: "$.sinks"
      json: { idx: "$.sink-idx", state: "$.state", name: "$.name", manual: "$.is-manual", src: "$.source-name",
              src_ip: "$.source-src-ip", src_mac: "$.source-src-mac", ip: "$.source-dst-ip", port: "$.source-dst-port",
              ssrc: "$.ssrc", rate: "$.sample-rate", depth: "$.depth", channels: "$.channel-num", ptime: "$.ptime",
              offset: "$.mediaclk-offset", delay: "$.max-delay", buffer: "$.max-buffer", ttl: "$.ttl", sdp: "$.sdp" }
      replace: aes67.sinks
      state:
        aes67.sinks.{idx}.state: { value: "{state}", map: { "0": idle, "1": receiving, "2": connecting, "3": lost, "4": format-error } }
        aes67.sinks.{idx}.name: "{name}"
        aes67.sinks.{idx}.manual: "{manual}"
        aes67.sinks.{idx}.source_name: "{src}"
        aes67.sinks.{idx}.source_ip: "{src_ip}"
        aes67.sinks.{idx}.source_mac: "{src_mac}"
        aes67.sinks.{idx}.address: "{ip}"
        aes67.sinks.{idx}.port: "{port}"
        aes67.sinks.{idx}.ssrc: "{ssrc}"
        aes67.sinks.{idx}.sample_rate: "{rate}"
        aes67.sinks.{idx}.depth: "{depth}"
        aes67.sinks.{idx}.channels: "{channels}"
        aes67.sinks.{idx}.ptime: "{ptime}"
        aes67.sinks.{idx}.mediaclk_offset: "{offset}"
        aes67.sinks.{idx}.max_delay_ms: "{delay}"
        aes67.sinks.{idx}.max_buffer: "{buffer}"
        aes67.sinks.{idx}.ttl: "{ttl}"
        aes67.sinks.{idx}.sdp: "{sdp}"
    - path: "^/api/aes67/sink-info$"
      json_match: { "$.status": "^0$" }
      json_each: "$.sources"
      json: { name: "$.source-name", src_ip: "$.source-src-ip", src_mac: "$.source-src-mac", ip: "$.source-dst-ip",
              port: "$.source-dst-port", ssrc: "$.ssrc", rate: "$.sample-rate", depth: "$.depth", channels: "$.channel-num",
              ptime: "$.ptime", offset: "$.mediaclk-offset", ttl: "$.ttl", sdp: "$.sdp" }
      replace: aes67.discovered
      state:
        aes67.discovered.{index}.name: "{name}"
        aes67.discovered.{index}.source_ip: "{src_ip}"
        aes67.discovered.{index}.source_mac: "{src_mac}"
        aes67.discovered.{index}.address: "{ip}"
        aes67.discovered.{index}.port: "{port}"
        aes67.discovered.{index}.ssrc: "{ssrc}"
        aes67.discovered.{index}.sample_rate: "{rate}"
        aes67.discovered.{index}.depth: "{depth}"
        aes67.discovered.{index}.channels: "{channels}"
        aes67.discovered.{index}.ptime: "{ptime}"
        aes67.discovered.{index}.mediaclk_offset: "{offset}"
        aes67.discovered.{index}.ttl: "{ttl}"
        aes67.discovered.{index}.sdp: "{sdp}"
    # AES67 API section 7.5: the reply names no sink; the request does.
    - path: "^/api/aes67/sink-statistics$"
      request_match: { "$.sink-idx": "^([0-3])$" }
      json_match: { "$.status": "^0$" }
      json: { qos: "$.qos", duration: "$.duration", peak: "$.peak", average: "$.average", late: "$.late", lost: "$.lost",
              count: "$.buff-count", under: "$.buff-underflow", over: "$.buff-overflow", hist: "$.statistics" }
      state:
        aes67.sink_stats.{1}.qos: "{qos}"
        aes67.sink_stats.{1}.duration_s: "{duration}"
        aes67.sink_stats.{1}.peak_us: "{peak}"
        aes67.sink_stats.{1}.average_us: "{average}"
        aes67.sink_stats.{1}.late: "{late}"
        aes67.sink_stats.{1}.lost: "{lost}"
        aes67.sink_stats.{1}.buffer_count: "{count}"
        aes67.sink_stats.{1}.underflows: "{under}"
        aes67.sink_stats.{1}.overflows: "{over}"
        aes67.sink_stats.{1}.histogram: "{hist}"
    # AES67 API sections 9.1 and 10.1.
    - path: "^/api/ndi/sender-info$"
      json_match: { "$.status": "^0$" }
      json: { servers: "$.discovery-server" }
      state: { stream.ndi_tx_discovery_servers: "{servers}" }
    - path: "^/api/ndi/sender-info$"
      json_match: { "$.status": "^0$" }
      json_each: "$.ndi"
      json: { uid: "$.uid", enabled: "$.enable", name: "$.ndi-name", group: "$.group", full: "$.enable-full",
              disc: "$.discovery-server-enable", audio: "$.audio-standard", mode: "$.mode", ttl: "$.multicast-ttl",
              prefix: "$.multicast-net-prefix", mask: "$.multicast-netmask", fo: "$.failover-enable",
              fo_name: "$.failover-ndi-name", fo_url: "$.failover-url", web: "$.web-control",
              published: "$.report.ndi-name", clients: "$.report.num-clients" }
      replace: streams.ndi_tx
      state:
        streams.ndi_tx.{uid}.enabled: "{enabled}"
        streams.ndi_tx.{uid}.name: "{name}"
        streams.ndi_tx.{uid}.group: "{group}"
        streams.ndi_tx.{uid}.full_bandwidth: "{full}"
        streams.ndi_tx.{uid}.discovery_enabled: "{disc}"
        streams.ndi_tx.{uid}.audio_standard: { value: "{audio}", map: { "0": smpte, "1": ebu } }
        streams.ndi_tx.{uid}.transport: { value: "{mode}", map: { "0": udp, "1": multicast, "2": rudp, "3": tcp, "4": multi-tcp } }
        streams.ndi_tx.{uid}.multicast_ttl: "{ttl}"
        streams.ndi_tx.{uid}.multicast_address: "{prefix}"
        streams.ndi_tx.{uid}.multicast_netmask: "{mask}"
        streams.ndi_tx.{uid}.failover_enabled: "{fo}"
        streams.ndi_tx.{uid}.failover_name: "{fo_name}"
        streams.ndi_tx.{uid}.failover_url: "{fo_url}"
        streams.ndi_tx.{uid}.web_control: "{web}"
        streams.ndi_tx.{uid}.published_name: "{published}"
        streams.ndi_tx.{uid}.clients: "{clients}"
    - path: "^/api/ndi/receiver-info$"
      json_match: { "$.status": "^0$" }
      json: { servers: "$.discovery-server", group: "$.group", extra: "$.extra-ips" }
      state:
        ndi.discovery.servers: "{servers}"
        ndi.groups: "{group}"
        ndi.extra_ips: "{extra}"
