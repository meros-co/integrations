      enabled: { type: bool, required: true, label: Auto reboot, description: "On reboots the device at the time and on the days given." }
      days: { type: int, min: 0, max: 127, default: 0, label: Days, description: "Sum of the day masks: Monday 1, Tuesday 2, Wednesday 4, Thursday 8, Friday 16, Saturday 32, and Sunday taken as 64 (the documents print 0)." }
      hour: { type: int, min: 0, max: 23, default: 3, label: Hour, description: "Hour of the reboot in UTC, 0 to 23." }
      minute: { type: int, min: 0, max: 59, default: 0, label: Minute, description: "Minute of the reboot, 0 to 59." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-auto-reboot, enable: "{enabled}", week-flags: "{days}", hour: "{hour}", min: "{minute}" } }
    expect: *ok
    returns: ack
