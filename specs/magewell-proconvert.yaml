    params:
      enabled: { type: bool, required: true, label: Reset on boot, description: "On clears the current source each time the device starts." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, reset-source-on-boot: "{enabled}" } }
