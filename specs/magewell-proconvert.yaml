      text: { type: string, default: "", max_length: 127, label: Text, description: "The ident text, up to 127 bytes; used with ident-text." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, ident-mode: "{mode}", ident-text: "{text}" } }
    expect: *ok
    returns: ack
  set_reset_source_on_boot:
    summary: "Clear the source on start and go back to NDI discovery (set-video-config reset-source-on-boot)"
    params:
