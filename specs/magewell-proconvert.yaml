    summary: "Extra addresses to find NDI sources at (POST /api/settings/ndi/set extra-ips)"
    params:
      ips: { type: string, default: "", max_length: 255, label: Extra IPs, description: "IP addresses separated by commas; empty for none." }
    send: { models: *ip, method: POST, path: /api/settings/ndi/set, content_type: application/json, body: '{"extra-ips":{ips:json}}' }
