# Nothing is pushed. Status is polled every 2 seconds; settings are read on
# connecting, every 30 seconds, and again after each command that changes
# them (then_send).
telemetry:
  poll:
    - send:
        - { models: *mw, method: GET, path: /mwapi, query: { method: get-summary-info } }
        - { models: &dec [ndi-to-hdmi, ndi-to-sdi, ndi-to-aio, ndi-to-hdmi-4k], method: GET, path: /mwapi, query: { method: get-channel } }
        - { models: *ip, method: GET, path: /api/system/summary }
        - { models: [aes67], method: POST, path: /api/aes67/summary-info }
        - { models: [aes67], method: POST, path: /api/aes67/ptp-state }
        - { models: [aes67], method: POST, path: /api/aes67/audio-meter }
        - { models: [audio-dx], method: POST, path: /api/aoip/summary-info }
        - { models: [audio-dx], method: POST, path: /api/dante/state }
        - { models: [audio-dx], method: POST, path: /api/aoip/audio-meter }
        - { models: [ip-to-usb], method: POST, path: /api/system/summary/get }
        - { models: [ip-to-usb], method: GET, path: /api/stream/status/get }
      every_ms: 2000
    - send:
        - { models: *mw, method: GET, path: /mwapi, query: { method: get-video-config } }
        - { models: *mw, method: GET, path: /mwapi, query: { method: get-ndi-config } }
        - { models: *mw, method: GET, path: /mwapi, query: { method: get-ndi-sources } }
        - { models: *mw, method: GET, path: /mwapi, query: { method: get-auto-reboot } }
        - { models: *mw, method: GET, path: /mwapi, query: { method: get-ntp-server } }
        - { models: *mw, method: GET, path: /mwapi, query: { method: get-net-access } }
        - { models: *mw, method: GET, path: /mwapi, query: { method: get-eth-status } }
        - { models: &enc [hdmi-4k-plus, hdmi-plus, hdmi-tx, 12g-sdi-4k-plus, sdi-4k-plus, sdi-plus, sdi-tx], method: GET, path: /mwapi, query: { method: get-tally } }
        - { models: *enc, method: GET, path: /mwapi, query: { method: get-ptz-config } }
        - { models: *enc, method: GET, path: /mwapi, query: { method: get-edid-config } }
        - { models: *dec, method: GET, path: /mwapi, query: { method: get-video-format } }
        - { models: *dec, method: GET, path: /mwapi, query: { method: get-hdmi-output } }
        - { models: *dec, method: GET, path: /mwapi, query: { method: get-supported-video-modes } }
        - { models: *dec, method: GET, path: /mwapi, query: { method: get-audio-config } }
        - { models: *dec, method: GET, path: /mwapi, query: { method: list-channels } }
        - { models: *dec, method: GET, path: /mwapi, query: { method: get-playback-config } }
        - { models: *ip, method: GET, path: /api/video/config/get }
        - { models: *ip, method: GET, path: /api/video/mode/get }
        - { models: *ip, method: GET, path: /api/audio/config/get }
        - { models: *ip, method: GET, path: /api/source/list, query: { type: all } }
        - { models: *ip, method: GET, path: /api/profile/list }
        - { models: *ip, method: GET, path: /api/settings/get }
        - { models: *ip, method: GET, path: /api/settings/zixi/master/get }
        - { models: *base, method: POST, path: /api/system/info }
        - { models: *newapi, method: POST, path: /api/system/device-info }
        - { models: *newapi, method: POST, path: /api/network/if-info }
        - { models: *aoip, method: POST, path: /api/network/if-route }
        - { models: *aoip, method: POST, path: /api/network/get-dns }
        - { models: [aes67], method: POST, path: /api/aes67/general-info }
        - { models: [aes67], method: POST, path: /api/aes67/ptp-info }
        - { models: [aes67], method: POST, path: /api/aes67/source-info }
        - { models: [aes67], method: POST, path: /api/aes67/sink-info }
        - { models: [aes67], method: POST, path: /api/aes67/matrix-info }
        - { models: [aes67], method: POST, path: /api/ndi/sender-info }
        - { models: [aes67], method: POST, path: /api/ndi/receiver-info }
        - { models: [aes67], method: POST, path: /api/ndi/receiver-find }
        - { models: [aes67], method: POST, path: /api/srt/sender-info }
        - { models: [aes67], method: POST, path: /api/srt/receiver-info }
        - { models: [aes67], method: POST, path: /api/ices/sender-info }
        - { models: [aes67], method: POST, path: /api/ices/receiver-info }
        - { models: [audio-dx], method: POST, path: /api/aoip/general-info }
        - { models: [audio-dx], method: POST, path: /api/aoip/matrix-desc }
        - { models: [audio-dx], method: POST, path: /api/aoip/matrix-info }
        - { models: [audio-dx], method: POST, path: /api/tx/live-info }
        - { models: [audio-dx], method: POST, path: /api/rx/live-info }
        - { models: [ip-to-usb], method: GET, path: /api/system/usb-mode/get }
        - { models: [ip-to-usb], method: GET, path: /api/video/config/get }
        - { models: [ip-to-usb], method: GET, path: /api/ndi/config/get }
        - { models: [ip-to-usb], method: POST, path: /api/resource/image/get, content_type: application/json,
            body: '{"id":"no_signal_1","type":"simple"}' }
        - { models: [ip-to-usb], method: GET, path: /api/source/list, query: { type: static } }
        - { models: [ip-to-usb], method: GET, path: /api/source/list, query: { type: dynamic } }
      every_ms: 30000
  updates:
    # Encoder API section 5.1, Decoder API V1.3 section 5.1.
    - path: "^/mwapi\\?method=get-summary-info$"
      json_match: { "$.status": "^0$" }
      json:
        model: "$.device.model"
        name: "$.device.name"
        serial: "$.device.serial-no"
        firmware: "$.device.fw-version"
        up_to_date: "$.device.up-to-date"
        hw: "$.device.hw-revision"
        temperature: "$.device.core-temp"
        uptime: "$.device.up-time"
        cpu: "$.device.cpu-usage"
        memory: "$.device.memory-usage"
        fan: "$.device.fan-rpm"
        board: "$.device.board-id"
