      - { models: [aes67], method: POST, path: /api/aes67/general-settings, content_type: application/json, body: '{"igmp":{version:map.igmp_aes67}}' }
      - { models: [audio-dx], method: POST, path: /api/aoip/general-apply, content_type: application/json, body: '{"igmp":"{version:map.igmp_dx}"}' }
    expect: *ok
    returns: ack
  set_test_tone:
    summary: "Test tone on the analog input or output, or off (general-settings or general-apply audio-pattern)"
    params:
      mode: { type: enum, values: ["off", analog-input, analog-output], required: true, label: Test tone, description: "Replace the analog input, or feed the analog output, with a test tone, or neither." }
    send:
      - { models: [aes67], method: POST, path: /api/aes67/general-settings, content_type: application/json, body: '{"audio-pattern":{mode:map.test_tone_aes67}}' }
      - { models: [audio-dx], method: POST, path: /api/aoip/general-apply, content_type: application/json, body: '{"audio-pattern":"{mode:map.test_tone_dx}"}' }
    expect: *ok
    returns: ack

  # AES67: PTP (AES67 API section 5).
  get_ptp_settings:
    summary: "PTP settings and the grandmaster in use (POST /api/aes67/ptp-info)"
    send: { models: [aes67], method: POST, path: /api/aes67/ptp-info }
    expect: *value
    returns: value
  get_ptp_state:
    summary: "PTP lock: synchronized, leader or follower, the clock locked to, and recent delays (POST /api/aes67/ptp-state)"
    send: { models: [aes67], method: POST, path: /api/aes67/ptp-state }
    expect: *value
    returns: value
  set_ptp_version:
    summary: "PTP version (POST /api/aes67/ptp-settings version)"
    params:
      version: { type: enum, values: [PTPV1, PTPV2], required: true, label: PTP version, description: "IEEE 1588-2002 (PTPV1) or 1588-2008 (PTPV2), which AES67 uses." }
    send: { models: [aes67], method: POST, path: /api/aes67/ptp-settings, content_type: application/json, body: '{"version":"{version}"}' }
    expect: *ok
    returns: ack
  set_ptp_priority:
    summary: "PTP priorities, which decide the grandmaster (POST /api/aes67/ptp-settings priority1, priority2)"
    params:
      priority1: { type: int, min: 0, max: 255, required: true, label: Priority 1, description: "PTP priority 1; lower wins the grandmaster election, 255 never leads." }
      priority2: { type: int, min: 0, max: 255, required: true, label: Priority 2, description: "PTP priority 2, the tie-break after clock quality." }
    send: { models: [aes67], method: POST, path: /api/aes67/ptp-settings, content_type: application/json, body: '{"priority1":{priority1},"priority2":{priority2}}' }
    expect: *ok
    returns: ack
  set_ptp_domain:
    summary: "PTP domain (POST /api/aes67/ptp-settings domain)"
    params:
      domain: { type: int, min: 0, max: 127, required: true, label: Domain, description: "PTP domain number, 0 to 127; every device on one clock uses the same." }
    send: { models: [aes67], method: POST, path: /api/aes67/ptp-settings, content_type: application/json, body: '{"domain":{domain}}' }
    expect: *ok
    returns: ack
  set_ptp_role:
    summary: "Whether the device may become the PTP leader (POST /api/aes67/ptp-settings role)"
