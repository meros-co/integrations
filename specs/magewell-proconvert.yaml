  set_unbalanced_output_level:
    summary: "Reference level of the unbalanced analog output (general-settings or general-apply unbld-out)"
    params:
      level: { type: enum, values: ["+12dBu", "+4dBu", "0dBu", "-2dBu", "0dBV", "-10dBV"], required: true, label: Output level, description: "The analog level full scale gives; +12dBu is the default." }
    send:
      - { models: [aes67], method: POST, path: /api/aes67/general-settings, content_type: application/json, body: '{"unbld-out":{level:map.unbld_level_aes67}}' }
      - { models: [audio-dx], method: POST, path: /api/aoip/general-apply, content_type: application/json, body: '{"unbld-out":"{level}"}' }
    expect: *ok
    returns: ack
  set_balanced_input_level:
    summary: "Reference level of the balanced analog input (general-settings or general-apply bld-in)"
    params:
      level: { type: enum, values: ["+24dBu", "+18dBu", "+4dBu", "0dBu", "-2dBu", "0dBV", "-10dBV"], required: true, label: Input level, description: "The analog level that reaches full scale; +18dBu is the default." }
    send:
      - { models: [aes67], method: POST, path: /api/aes67/general-settings, content_type: application/json, body: '{"bld-in":{level:map.bld_in_level_aes67}}' }
      - { models: [audio-dx], method: POST, path: /api/aoip/general-apply, content_type: application/json, body: '{"bld-in":"{level:map.bld_level_dx}"}' }
