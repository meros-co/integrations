  set_decoder_input_color_auto:
    summary: "Choose the source color space automatically (set-video-config in-auto-color-fmt)"
    params:
      enabled: { type: bool, required: true, label: Automatic, description: "On uses BT.601 for SD and BT.709 for HD sources; off uses the color space set." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, in-auto-color-fmt: "{enabled}" } }
    expect: *ok
    returns: ack
  set_follow_input:
    summary: "Output resolution follows the source (set-video-config follow-input-mode, or /api/video/config/set follow-input)"
    params:
      enabled: { type: bool, required: true, label: Follow source, description: "On sets the output resolution to the source's; off uses the video mode set." }
