    params:
      address: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: IP address, description: "The device's new IPv4 address." }
      netmask: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Subnet mask, description: "Subnet mask, e.g. 255.255.255.0." }
      gateway: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Gateway, description: "Default gateway address." }
      dns: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: DNS server, description: "DNS server address." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-eth-config, dhcp: "false", addr: "{address}", mask: "{netmask}", gw-addr: "{gateway}", dns-addr: "{dns}" } }
    expect: *ok
    returns: ack

  get_sources:
    summary: "Static and discovered NDI sources with their ids (GET /api/source/list?type=all)"
    send: { models: *ip, method: GET, path: /api/source/list, query: { type: all } }
    expect: *value
    returns: value
  select_source:
    summary: "Decode a source by id, in simple mode; the output switches at once (POST /api/source/select)"
    params:
      id: { type: int, min: 0, max: 2147483647, required: true, label: Source, description: "The source id from get_sources." }
    send: { models: *ip, method: POST, path: /api/source/select, content_type: application/json, body: '{"id":{id}}' }
    expect: *ok
    returns: ack
  restart_source:
    summary: "Reconnect the active source (POST /api/source/restart)"
    send: { models: *ip, method: POST, path: /api/source/restart, content_type: application/json, body: '{}' }
    expect: *ok
    returns: ack
  list_profiles:
    summary: "Profiles (single, picture-in-picture or four-way layouts) and the current one (GET /api/profile/list)"
    send: { models: *ip, method: GET, path: /api/profile/list }
    expect: *value
    returns: value
  select_profile:
    summary: "Switch to a profile, in profile mode; the output layout changes at once (POST /api/profile/select)"
    params:
      id: { type: int, min: 0, max: 2147483647, required: true, label: Profile, description: "The profile id from list_profiles." }
    send: { models: *ip, method: POST, path: /api/profile/select, content_type: application/json, body: '{"id":{id}}' }
    expect: *ok
    returns: ack
  select_screen_source:
    summary: "Put a source on one screen of a profile (POST /api/profile/screen/select)"
    params:
      profile: { type: int, min: 0, max: 2147483647, required: true, label: Profile, description: "The profile id from list_profiles." }
      screen: { type: int, min: 0, max: 3, required: true, label: Screen, description: "Screen index in the profile's layout, from 0." }
      source: { type: int, min: 0, max: 2147483647, required: true, label: Source, description: "The source id from get_sources." }
    send: { models: *ip, method: POST, path: /api/profile/screen/select, content_type: application/json, body: '{"id":{profile},"screen-index":{screen},"source-id":{source}}' }
    expect: *ok
    returns: ack
  ptz_move:
    summary: "Pan and tilt the decoded NDI camera; 0 and 0 stop (POST /api/ptz/move)"
    params:
      pan: { type: float, min: -1.0, max: 1.0, required: true, label: Pan speed, description: "Pan speed from -1 (left) to 1 (right); 0 stops." }
      tilt: { type: float, min: -1.0, max: 1.0, required: true, label: Tilt speed, description: "Tilt speed from -1 (down) to 1 (up); 0 stops." }
    send: { models: *ip, method: POST, path: /api/ptz/move, content_type: application/json, body: '{"pan":{pan:.2f},"tilt":{tilt:.2f}}' }
    expect: *ok
    returns: ack
  ptz_zoom:
    summary: "Zoom the decoded NDI camera at a speed; 0 stops (POST /api/ptz/zoom/set)"
    params:
      speed: { type: float, min: -1.0, max: 1.0, required: true, label: Zoom speed, description: "Zoom speed from -1 (out) to 1 (in); 0 stops." }
    send: { models: *ip, method: POST, path: /api/ptz/zoom/set, content_type: application/json, body: '{"speed":{speed:.2f}}' }
    expect: *ok
    returns: ack
  ptz_focus:
    summary: "Focus the decoded NDI camera at a speed; 0 stops (POST /api/ptz/focus/set)"
    params:
      speed: { type: float, min: -1.0, max: 1.0, required: true, label: Focus speed, description: "Focus speed from -1 (near) to 1 (far); 0 stops." }
    send: { models: *ip, method: POST, path: /api/ptz/focus/set, content_type: application/json, body: '{"speed":{speed:.2f}}' }
    expect: *ok
    returns: ack
  ptz_auto_focus:
    summary: "Return the decoded NDI camera to auto focus (POST /api/ptz/focus/auto)"
    send: { models: *ip, method: POST, path: /api/ptz/focus/auto, content_type: application/json, body: '{}' }
    expect: *ok
    returns: ack
  ptz_recall_preset:
    summary: "Recall a preset on the decoded NDI camera; it moves at once (POST /api/ptz/preset/recall)"
    params:
      number: { type: int, min: 1, max: 255, required: true, label: Preset, description: "Camera preset number, 1 to 255." }
    send: { models: *ip, method: POST, path: /api/ptz/preset/recall, content_type: application/json, body: '{"number":{number}}' }
    expect: *ok
    returns: ack
  ptz_store_preset:
    summary: "Store the decoded NDI camera's position as a preset, overwriting it (POST /api/ptz/preset/store)"
    params:
      number: { type: int, min: 1, max: 255, required: true, label: Preset, description: "Camera preset number to overwrite, 1 to 255." }
    send: { models: *ip, method: POST, path: /api/ptz/preset/store, content_type: application/json, body: '{"number":{number}}' }
    expect: *ok
    returns: ack
  add_source_url:
    summary: "Add a stream source by URL: SRT, RIST, RTMP, RTSP, HTTP/HLS, UDP, RTP or Zixi (POST /api/source/add type 1)"
    params:
      name: { type: string, required: true, max_length: 120, label: Name, description: "The source's name." }
      url: { type: string, required: true, max_length: 1024, label: URL,
        description: "Source URL with the options the IP Decoder API documents, e.g. srt://10.0.0.5:9000?mode=caller&latency=120." }
    send: { models: *ip, method: POST, path: /api/source/add, content_type: application/json, body: '{"name":{name:json},"type":1,"url":{url:json}}' }
    expect: *ok
    returns: ack
  add_source:
    summary: "Add a source in the IP Decoder API's Source Configuration shape: a URL source (type 1) or a custom NDI source (type 3) (POST /api/source/add)"
    params:
      config: { type: json, required: true, label: Configuration, description: "The source configuration object as IP Decoder API section 3 gives it." }
    send: { models: *ip, method: POST, path: /api/source/add, content_type: application/json, body: '{config}' }
    expect: *ok
    returns: ack
  modify_source:
    summary: "Change a source's configuration (POST /api/source/set)"
    params:
      id: { type: int, min: 0, max: 2147483647, required: true, label: Source, description: "The source id from get_sources." }
      config: { type: json, required: true, label: Configuration, description: "The Source Configuration fields to change, as IP Decoder API section 3 gives them." }
    send: { models: *ip, method: POST, path: /api/source/set, content_type: application/json, body: '{"id":{id},"config":{config}}' }
    expect: *ok
    returns: ack
  delete_source:
    summary: "Delete a source (POST /api/source/del)"
    params:
      id: { type: int, min: 0, max: 2147483647, required: true, label: Source, description: "The source id from get_sources." }
    send: { models: *ip, method: POST, path: /api/source/del, content_type: application/json, body: '{"id":[{id}]}' }
    expect: *ok
    returns: ack
  add_profile:
    summary: "Add a profile: name, view mode, audio screen, picture-in-picture and screens (POST /api/profile/add)"
    params:
      config: { type: json, required: true, label: Profile, description: "The Profile Configuration object as IP Decoder API section 6 gives it." }
    send: { models: *ip, method: POST, path: /api/profile/add, content_type: application/json, body: '{config}' }
    expect: *ok
    returns: ack
  modify_profile:
    summary: "Change a profile; the default profile keeps one screen (POST /api/profile/set)"
    params:
      id: { type: int, min: 0, max: 2147483647, required: true, label: Profile, description: "The profile id from list_profiles." }
      config: { type: json, required: true, label: Configuration, description: "The Profile Configuration fields to change, as IP Decoder API section 6 gives them." }
    send: { models: *ip, method: POST, path: /api/profile/set, content_type: application/json, body: '{"id":{id},"config":{config}}' }
    expect: *ok
    returns: ack
  delete_profile:
    summary: "Delete a profile; the default profile cannot be deleted (POST /api/profile/del)"
    params:
      id: { type: int, min: 1, max: 2147483647, required: true, label: Profile, description: "The profile id from list_profiles." }
    send: { models: *ip, method: POST, path: /api/profile/del, content_type: application/json, body: '{"id":{id}}' }
    expect: *ok
    returns: ack
  set_vu_meter_scale:
    summary: "Scale of the volume bar overlay (POST /api/video/config/set vu-meter-mode)"
    params:
      scale: { type: enum, values: [hide, post-dbvu, post-dbfs], required: true, label: Meter scale, description: "Hide the scale, or dBVU (dBu) or dBFS after the gain." }
    send: { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json, body: '{"vu-meter-mode":{scale:map.vu_scale_ip}}' }
    expect: *ok
    returns: ack
  set_ip_ident:
    summary: "Ident overlay: none, a text, or the source name (POST /api/video/config/set ident-mode, ident-text)"
    params:
      mode: { type: enum, values: [none, text, source-name], required: true, label: Ident, description: "Show nothing, the text given, or the source name over the output." }
      text: { type: string, default: "", max_length: 127, label: Text, description: "The ident text; used with text." }
    send: { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json, body: '{"ident-mode":{mode:map.ident_ip},"ident-text":{text:json}}' }
    expect: *ok
    returns: ack
  set_ip_deinterlace:
    summary: "Deinterlacing, and whether to deinterlace for an interlaced output too (POST /api/video/config/set deinterlace-mode, force-deint)"
    params:
      mode: { type: enum, values: [bob, weave, blend], required: true, label: Deinterlace, description: "Bob, weave or blend." }
      force: { type: bool, default: false, label: Force, description: "On deinterlaces even when the output is interlaced." }
    send: { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json, body: '{"deinterlace-mode":{mode:map.deinterlace_ip},"force-deint":{force}}' }
    expect: *ok
    returns: ack
  set_ip_input_color_space:
    summary: "Source colour space, or automatic (POST /api/video/config/set in-color-fmt)"
    params:
      space: { type: enum, values: [auto, bt.601, bt.709, bt.2020], required: true, label: Source colour space, description: "The source's colour space, or auto." }
    send: { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json, body: '{"in-color-fmt":{space:map.in_color_ip}}' }
    expect: *ok
    returns: ack
  set_hdr_output_mode:
    summary: "HDR output: automatic or off; HDR PQ and HLG are listed as not yet supported (POST /api/video/config/set hdr-output-mode)"
    params:
      mode: { type: enum, values: [auto, disable, hdr-pq, hlg], required: true, label: HDR output, description: "auto follows the source and display, disable sends SDR; hdr-pq and hlg are documented as not yet supported." }
    send: { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json, body: '{"hdr-output-mode":{mode:map.hdr_output_ip}}' }
    expect: *ok
    returns: ack
  set_signal_loss_mode:
    summary: "What the output shows when the signal is lost (POST /api/video/config/set switch-mode)"
    params:
      mode: { type: enum, values: [no-signal-image, black, last-frame, output-off], required: true, label: On signal loss,
        description: "The no-signal image, black, the last frame, or no output 30 seconds after the loss." }
    send: { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json, body: '{"switch-mode":{mode:map.signal_loss_ip}}' }
    expect: *ok
    returns: ack
  set_screen_debug:
    summary: "On-screen debugging information (POST /api/video/config/set screen-debug)"
    params:
      enabled: { type: bool, required: true, label: Debug overlay, description: "On shows debugging information on the output." }
    send: { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json, body: '{"screen-debug":{enabled}}' }
    expect: *ok
    returns: ack
  set_webrtc_preview:
    summary: "WebRTC preview in the web interface (POST /api/video/config/set enable-webrtc)"
    params:
      enabled: { type: bool, required: true, label: WebRTC preview, description: "On serves a live WebRTC preview; off a still image." }
    send: { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json, body: '{"enable-webrtc":{enabled}}' }
    expect: *ok
    returns: ack
  set_ip_video_mode:
    summary: "Set the output video mode to one get_video_modes lists (POST /api/video/mode/set)"
    params:
      width: { type: int, min: 1, max: 4096, required: true, label: Width, description: "Width in pixels, from the modes list." }
      height: { type: int, min: 1, max: 2160, required: true, label: Height, description: "Height in lines, from the modes list." }
      interlaced: { type: bool, default: false, label: Interlaced, description: "On for an interlaced mode." }
      frame_rate: { type: int, min: 1, max: 24000, required: true, label: Frame rate, description: "Frame rate times 100, as the modes list gives it, e.g. 5994." }
      aspect_x: { type: int, min: 1, max: 255, required: true, label: Aspect width, description: "Aspect ratio width, e.g. 16." }
      aspect_y: { type: int, min: 1, max: 255, required: true, label: Aspect height, description: "Aspect ratio height, e.g. 9." }
    send: { models: *ip, method: POST, path: /api/video/mode/set, content_type: application/json,
            body: '{"width":{width},"height":{height},"interlaced":{interlaced},"frame-rate":{frame_rate},"aspect-x":{aspect_x},"aspect-y":{aspect_y}}' }
    expect: *ok
    returns: ack
  wake_screen:
    summary: "Send a signal to wake a display that slept on signal loss (POST /api/video/screen/wakeup)"
    send: { models: *ip, method: POST, path: /api/video/screen/wakeup }
    expect: *ok
    returns: ack
  set_ip_audio_channel_map:
    summary: "Output channel map, the whole array (POST /api/audio/config/set channel-map)"
    params:
      map: { type: json, required: true, label: Channel map, description: "Array of source channel indexes from 0, one per output channel, as get_audio_config's channel-map." }
    send: { models: *ip, method: POST, path: /api/audio/config/set, content_type: application/json, body: '{"channel-map":{map}}' }
    expect: *ok
    returns: ack
  get_settings:
    summary: "System settings: configuration mode, NDI receive settings and GUI language (GET /api/settings/get)"
    send: { models: *ip, method: GET, path: /api/settings/get }
    expect: *value
    returns: value
  set_config_mode:
    summary: "Simple mode (one source) or profile mode (layouts); the output changes at once (POST /api/settings/mode/set)"
    params:
      mode: { type: enum, values: [simple, profile], required: true, label: Mode, description: "simple selects a source directly; profile uses profiles and their screens." }
    send: { models: *ip, method: POST, path: /api/settings/mode/set, content_type: application/json, body: '{"mode":{mode:map.config_mode_ip}}' }
    expect: *ok
    returns: ack
  set_ndi_receive_transport:
    summary: "NDI receive transport (POST /api/settings/ndi/set transport)"
    params:
      transport: { type: enum, values: [auto, rudp, udp, multicast, multi-tcp, tcp], required: true, label: Transport, description: "How sources are asked to send, or auto." }
    send: { models: *ip, method: POST, path: /api/settings/ndi/set, content_type: application/json, body: '{"transport":"{transport}"}' }
    expect: *ok
    returns: ack
  set_ndi_pts_mode:
    summary: "Which NDI timing the decoder follows (POST /api/settings/ndi/set pts-mode)"
    params:
      mode: { type: enum, values: [auto, timecode, timestamp], required: true, label: Timing, description: "The NDI timecode, the timestamp, or auto." }
    send: { models: *ip, method: POST, path: /api/settings/ndi/set, content_type: application/json, body: '{"pts-mode":"{mode}"}' }
    expect: *ok
    returns: ack
  set_ndi_default_buffer:
    summary: "Buffer for discovered NDI sources in milliseconds (POST /api/settings/ndi/set buffer-ms)"
    params:
      ms: { type: int, min: 0, max: 10000, required: true, label: Buffer, description: "Default buffer for discovered NDI sources, in milliseconds." }
    send: { models: *ip, method: POST, path: /api/settings/ndi/set, content_type: application/json, body: '{"buffer-ms":{ms}}' }
    expect: *ok
    returns: ack
  set_ndi_extra_ips:
    summary: "Extra addresses to find NDI sources at (POST /api/settings/ndi/set extra-ips)"
    params:
      ips: { type: string, default: "", max_length: 255, label: Extra IPs, description: "IP addresses separated by commas; empty for none." }
    send: { models: *ip, method: POST, path: /api/settings/ndi/set, content_type: application/json, body: '{"extra-ips":{ips:json}}' }
    expect: *ok
    returns: ack
  set_gui_language:
    summary: "Web interface language (POST /api/settings/gui/set lang)"
    params:
      language: { type: enum, values: [en, zh], required: true, label: Language, description: "English or Chinese." }
    send: { models: *ip, method: POST, path: /api/settings/gui/set, content_type: application/json, body: '{"lang":"{language}"}' }
    expect: *ok
    returns: ack
  get_zen_master:
    summary: "Zixi ZEN Master connection settings and state (GET /api/settings/zixi/master/get)"
    send: { models: *ip, method: GET, path: /api/settings/zixi/master/get }
    expect: *value
    returns: value
  set_zen_master:
    summary: "Connect to Zixi ZEN Master, or not (POST /api/settings/zixi/master/set)"
    params:
      enabled: { type: bool, required: true, label: ZEN Master, description: "On connects to the ZEN Master given." }
      host: { type: string, default: "", max_length: 255, label: Host, description: "ZEN Master address." }
      ssh_port: { type: int, min: 1, max: 65535, default: 22, label: SSH port, description: "ZEN Master SSH port." }
      tunnel_port: { type: int, min: 1, max: 65535, required: true, label: Tunnel port, description: "The forwarding (remote source) port configured on ZEN Master." }
      user: { type: string, default: "", max_length: 255, label: User name, description: "User name configured on ZEN Master." }
    send: { models: *ip, method: POST, path: /api/settings/zixi/master/set, content_type: application/json,
            body: '{"enable":{enabled},"host":{host:json},"ssh-port":{ssh_port},"tunnel-port":{tunnel_port},"user-name":{user:json}}' }
    expect: *ok
    returns: ack
  get_system_info:
    summary: "Device name, uptime, CPU, memory, date and time, NTP and the reboot schedule (POST /api/system/info)"
    send: { models: *ip, method: POST, path: /api/system/info }
    expect: *value
    returns: value
  set_auto_reboot_days:
    summary: "Schedule a weekly reboot (POST /api/system/auto-reboot)"
    params:
      enabled: { type: bool, required: true, label: Auto reboot, description: "On reboots the device at the time and on the days given." }
      hour: { type: int, min: 0, max: 23, default: 3, label: Hour, description: "Hour of the reboot, 0 to 23." }
      minute: { type: int, min: 0, max: 59, default: 0, label: Minute, description: "Minute of the reboot, 0 to 59." }
      days: { type: string, default: "", pattern: "^([1-7](,[1-7]){0,6})?$", label: Days,
        description: "Days separated by commas, 1 Monday to 7 Sunday, e.g. 1,2,3,4,5." }
    send: { models: *ip, method: POST, path: /api/system/auto-reboot, content_type: application/json,
            body: '{"enable":{enabled},"hour":{hour},"min":{minute},"week":[{days}]}' }
    expect: *ok
    returns: ack

state:
  device.model:          { type: string, description: "Model, e.g. HDMI 4K Plus, NDI to HDMI or Pro Convert IP to HDMI" }
  device.name:           { type: string, description: "Device name" }
  device.serial:         { type: string, description: "Serial number" }
  device.firmware:       { type: string, description: "Firmware version" }
  device.firmware_up_to_date: { type: bool, description: "Encoders and NDI decoders: the firmware is the latest" }
  device.hardware_revision: { type: string, description: "Hardware revision, A to Z" }
  device.temperature:    { type: float, description: "Core temperature, degrees Celsius" }
  device.uptime:         { type: int, description: "Seconds since start" }
  device.cpu_usage:      { type: float, description: "Encoders and NDI decoders: CPU load, percent" }
  device.memory_usage:   { type: float, description: "Encoders and NDI decoders: memory in use, percent" }
  device.fan_rpm:        { type: int, description: "Fan speed in RPM, on models with a fan" }
  device.board_id:       { type: int, description: "Encoders and NDI decoders: the rotary switch, 0 to 15" }
  device.input_state:    { type: string, description: "Encoder input: no-signal, locking, unsupported, or the format, e.g. 1920x1080p60" }
  device.output_state:   { type: string, description: "Output connection: e.g. connected, unconnected, active, or the IP decoder's HDMI state 0 disconnected, 1 working, 10 not supported" }
  network.ethernet.state: { type: string, description: "Ethernet link: down, disconnected, or the speed such as 1000m" }
  network.ethernet.mac:  { type: string, description: "Ethernet MAC address" }
  network.ethernet.ip_address: { type: string, description: "Ethernet IP address in use" }
  network.ethernet.netmask: { type: string, description: "Ethernet subnet mask in use" }
  network.ethernet.gateway: { type: string, description: "Ethernet gateway in use" }
  network.ethernet.dns:  { type: string, description: "DNS server in use" }
  network.ethernet.dhcp: { type: bool, description: "Encoders and NDI decoders: the address comes from DHCP (get-eth-status, administrators only)" }
  network.ethernet.tx_kbps: { type: int, description: "Ethernet send rate, kbit/s" }
  network.ethernet.rx_kbps: { type: int, description: "Ethernet receive rate, kbit/s" }
  network.ntp_server:    { type: string, description: "NTP server (administrators only on the encoders and NDI decoders)" }
  network.ssdp:          { type: bool, description: "Encoders and NDI decoders: SSDP discovery answered (administrators only)" }
  auto_reboot.enabled:   { type: bool, description: "Scheduled reboot on" }
  auto_reboot.days:      { type: int, description: "Encoders and NDI decoders: sum of day masks, Monday 1 to Saturday 32 (week-flags)" }
  auto_reboot.week:      { type: string, description: "IP decoders: reboot days as a JSON array, 1 Monday to 7 Sunday" }
  auto_reboot.hour:      { type: int, description: "Reboot hour (UTC on the encoders and NDI decoders)" }
  auto_reboot.minute:    { type: int, description: "Reboot minute" }
  ndi.name:              { type: string, description: "Encoder: the NDI source name sent; decoder: the NDI source decoded" }
  ndi.url:               { type: string, description: "Decoder: the current preset's URL, empty for a discovered source" }
  ndi.enabled:           { type: bool, description: "Encoder: NDI output on (summary enabled); NDI decoder: NDI connected (summary connected)" }
  ndi.clients:           { type: int, description: "Encoder: receivers connected to the stream" }
  ndi.video:             { type: string, description: "Stream video as width x height, scan and field rate, e.g. 1920x1080 progressive 59.94" }
  ndi.video_kbps:        { type: int, description: "Stream video bitrate over the last second, kbit/s" }
  ndi.audio_kbps:        { type: int, description: "Stream audio bitrate over the last second, kbit/s" }
