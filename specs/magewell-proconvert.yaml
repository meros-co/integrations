    expect: *ok
    returns: ack
  set_decoder_timecode_first:
    summary: "Prefer NDI timecode when timing video (set-ndi-config use-timecode-first)"
    params:
      enabled: { type: bool, required: true, label: Timecode first, description: "On times video from the NDI timecode before its timestamps." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ndi-config, use-timecode-first: "{enabled}" } }
    expect: *ok
    returns: ack

  # Encoders and NDI decoders: system settings (Encoder API and Decoder API
  # V1.3, sections Universal Interfaces and Network).
  get_auto_reboot:
    summary: "Scheduled reboot: on or off, days and UTC time (get-auto-reboot)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-auto-reboot } }
    expect: *value
    returns: value
  set_auto_reboot:
    summary: "Schedule a daily or weekly reboot, in UTC (set-auto-reboot)"
    params:
      enabled: { type: bool, required: true, label: Auto reboot, description: "On reboots the device at the time and on the days given." }
      days: { type: int, min: 0, max: 127, default: 0, label: Days, description: "Sum of the day masks: Monday 1, Tuesday 2, Wednesday 4, Thursday 8, Friday 16, Saturday 32, and Sunday taken as 64 (the documents print 0)." }
      hour: { type: int, min: 0, max: 23, default: 3, label: Hour, description: "Hour of the reboot in UTC, 0 to 23." }
      minute: { type: int, min: 0, max: 59, default: 0, label: Minute, description: "Minute of the reboot, 0 to 59." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-auto-reboot, enable: "{enabled}", week-flags: "{days}", hour: "{hour}", min: "{minute}" } }
    expect: *ok
    returns: ack
  get_ntp_server:
    summary: "NTP server, administrators only (get-ntp-server)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-ntp-server } }
    expect: *value
    returns: value
  set_ntp_server:
    summary: "NTP server, administrators only (set-ntp-server)"
    params:
      server: { type: string, required: true, max_length: 255, label: NTP server, description: "Host name or address of the NTP server." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-ntp-server, ntp-server: "{server}" } }
    expect: *ok
    returns: ack
  get_net_access:
    summary: "Whether SSDP discovery is on, administrators only (get-net-access)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-net-access } }
    expect: *value
    returns: value
  set_ssdp:
    summary: "Turn SSDP discovery on or off, administrators only (set-net-access use-ssdp)"
    params:
      enabled: { type: bool, required: true, label: SSDP, description: "On answers SSDP discovery on the network." }
    send: { models: *mw, method: GET, path: /mwapi, query: { method: set-net-access, use-ssdp: "{enabled}" } }
    expect: *ok
    returns: ack
  get_network_status:
    summary: "Ethernet settings and link: DHCP, device name, link speed, addresses, traffic; administrators only (get-eth-status)"
    send: { models: *mw, method: GET, path: /mwapi, query: { method: get-eth-status } }
    expect: *value
    returns: value
  set_device_name:
    summary: "Device name (set-eth-config name, or POST /api/system/set-device-name)"
    params:
      name: { type: string, required: true, max_length: 63, label: Device name, description: "The name the device shows and announces." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-eth-config, name: "{name}" } }
      - { models: *base, method: POST, path: /api/system/set-device-name, content_type: application/json, body: '{"name":{name:json}}' }
    expect: *ok
    returns: ack
  set_network_dhcp:
    summary: "Take the Ethernet address from DHCP; the device may move to a new address (set-eth-config dhcp=true, or /api/network/if-set use-dhcp=true)"
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-eth-config, dhcp: "true" } }
      - { models: *newapi, method: POST, path: /api/network/if-set, content_type: application/json,
          body: '{"iface":"eth0","use-dhcp":true}' }
    expect: *ok
    returns: ack
  set_network_static:
    summary: "Fixed Ethernet address; the device moves to it (set-eth-config dhcp=false, addr, mask, gw-addr, dns-addr, or /api/network/if-set use-dhcp=false on IP to USB)"
    params:
      address: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: IP address, description: "The device's new IPv4 address." }
      netmask: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Subnet mask, description: "Subnet mask, e.g. 255.255.255.0." }
      gateway: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Gateway, description: "Default gateway address." }
      dns: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: DNS server, description: "DNS server address." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-eth-config, dhcp: "false", addr: "{address}", mask: "{netmask}", gw-addr: "{gateway}", dns-addr: "{dns}" } }
      - { models: [ip-to-usb], method: POST, path: /api/network/if-set, content_type: application/json,
          body: '{"iface":"eth0","use-dhcp":false,"ipaddr":"{address}","netmask":"{netmask}","gateway":"{gateway}","dns1":"{dns}","dns2":""}' }
    expect: *ok
    returns: ack

