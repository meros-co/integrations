    params:
      enabled: { type: bool, required: true, label: Follow source, description: "On sets the output resolution to the source's; off uses the video mode set." }
    send:
      - { models: *mw, method: GET, path: /mwapi, query: { method: set-video-config, follow-input-mode: "{enabled}" } }
      - { models: *ip, method: POST, path: /api/video/config/set, content_type: application/json, body: '{"follow-input":{enabled}}' }
    expect: *ok
    returns: ack
  get_playback_config:
    summary: "Decoder buffer duration (get-playback-config)"
