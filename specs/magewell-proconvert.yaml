  apply_tx_stream:
    summary: "Add or change a stream sent, by uid, from an object in tx-live-apply's shape: uid, enable, name, stream-no, type (rtsp, srt or ndi), the rtsp, srt or ndi object, aac-bitrate-kbps (POST /api/tx/live-apply)"
    params:
      config: { type: json, required: true, label: Stream, description: "The stream object as Audio DX API section 5.2 gives it." }
    send: { models: [audio-dx], method: POST, path: /api/tx/live-apply, content_type: application/json, body: '{config}' }
    expect: *ok
    returns: ack
  delete_tx_stream:
    summary: "Delete a stream sent (POST /api/tx/live-del)"
    params:
      uid: { type: int, min: 1, max: 2147483647, required: true, label: Stream, description: "The stream's uid from get_tx_streams." }
    send: { models: [audio-dx], method: POST, path: /api/tx/live-del, content_type: application/json, body: '{"uid":{uid}}' }
    expect: *ok
    returns: ack
  get_rx_streams:
    summary: "Streams received (SRT, NDI) with their URLs, the buffer limits, the NDI options and NDI sources found (POST /api/rx/live-info)"
    send: { models: [audio-dx], method: POST, path: /api/rx/live-info }
    expect: *value
    returns: value
  apply_rx_stream:
    summary: "Add or change a stream received, by uid: an srt:// or ntkndi:// URL on Stream1 or Stream2 (POST /api/rx/live-apply)"
    params:
      uid: { type: int, min: 1, max: 2147483647, required: true, label: Stream, description: "The stream's uid; a new uid adds a stream." }
      enabled: { type: bool, required: true, label: Receiving, description: "On receives the stream; off stops it." }
      name: { type: string, required: true, max_length: 63, label: Name, description: "The stream's name, 1 to 63 characters." }
      stream: { type: enum, values: [Stream1, Stream2], required: true, label: Stream slot, description: "Which of the two received streams this is." }
      url: { type: string, required: true, max_length: 1024, label: URL,
        description: "An srt:// URL with mode, streamid, passphrase, latency, mw-audio-track, mw-buffer-duration and mw-headroom-db, or an ntkndi://ndi?ndi-name=... URL, as Audio DX API section 5.5 gives them." }
    send: { models: [audio-dx], method: POST, path: /api/rx/live-apply, content_type: application/json,
            body: '{"uid":{uid},"enable":{enabled},"name":{name:json},"stream-no":"{stream}","url":{url:json}}' }
    expect: *ok
    returns: ack
  delete_rx_stream:
    summary: "Delete a stream received (POST /api/rx/live-del)"
    params:
      uid: { type: int, min: 1, max: 2147483647, required: true, label: Stream, description: "The stream's uid from get_rx_streams." }
    send: { models: [audio-dx], method: POST, path: /api/rx/live-del, content_type: application/json, body: '{"uid":{uid}}' }
    expect: *ok
    returns: ack
  set_rx_ndi_options:
    summary: "Where NDI streams are looked for: discovery server, group and extra addresses (POST /api/rx/ndi-options-apply)"
    params:
      enabled: { type: bool, required: true, label: Discovery server, description: "On finds sources through the discovery server given." }
      servers: { type: string, default: "", max_length: 255, label: Servers, description: "Discovery server addresses separated by commas; needed when on." }
      group: { type: string, default: public, max_length: 255, label: NDI group, description: "NDI group to look in; public is the default." }
      extra_ips: { type: string, default: "", max_length: 255, label: Extra IPs, description: "Further addresses to look for sources at, separated by commas." }
    send: { models: [audio-dx], method: POST, path: /api/rx/ndi-options-apply, content_type: application/json,
            body: '{"enable-discovery":{enabled},"discovery-server":{servers:json},"group-name":{group:json},"extra-ips":{extra_ips:json}}' }
    expect: *ok
    returns: ack
  get_dante_state:
    summary: "Dante clock and format: lock, leader and grandmaster, PTP parameters, sample rate and encoding, and the Dante device lock (POST /api/dante/state)"
    send: { models: [audio-dx], method: POST, path: /api/dante/state }
    expect: *value
    returns: value

  # AES67 and Audio DX: the audio matrix (AES67 API section 15, Audio DX API
  # section 6). Channels are numbered from 0, as the device numbers them.
  get_matrix:
    summary: "Audio matrix: each TX channel's mute and volume, each crosspoint's connection, mute and volume, and the channels of each input and output (matrix-info)"
    send:
      - { models: [aes67], method: POST, path: /api/aes67/matrix-info }
      - { models: [audio-dx], method: POST, path: /api/aoip/matrix-info }
    expect: *value
    returns: value
  get_matrix_layout:
    summary: "The matrix's channel groups (analog, USB, Dante, streams) and the channels each covers (POST /api/aoip/matrix-desc)"
    send: { models: [audio-dx], method: POST, path: /api/aoip/matrix-desc }
    expect: *value
    returns: value
  get_audio_meters:
    summary: "Level of every TX and RX channel of the matrix, in dBFS (audio-meter)"
    send:
      - { models: [aes67], method: POST, path: /api/aes67/audio-meter }
      - { models: [audio-dx], method: POST, path: /api/aoip/audio-meter }
    expect: *value
    returns: value
  get_channel_meters:
    summary: "Level of one TX channel and the RX channels given, with their minimum and maximum (audio-meter-limit)"
    params:
      tx: { type: int, min: 0, max: 31, required: true, label: TX channel, description: "TX (output) channel, numbered from 0." }
      rx: { type: json, required: true, label: RX channels, description: "Array of RX (input) channel numbers from 0, as audio-meter-limit's rx-no takes it, e.g. [1, 2, 3, 4]." }
    send:
      - { models: [aes67], method: POST, path: /api/aes67/audio-meter-limit, content_type: application/json, body: '{"tx-no":{tx},"rx-no":{rx}}' }
      - { models: [audio-dx], method: POST, path: /api/aoip/audio-meter-limit, content_type: application/json, body: '{"tx-no":{tx},"rx-no":{rx}}' }
    expect: *value
    returns: value
  get_crosspoint_meter:
    summary: "Level at one crosspoint, with its minimum and maximum (POST /api/aes67/matrix-meter)"
    params:
      tx: { type: int, min: 0, max: 31, required: true, label: TX channel, description: "TX (output) channel, numbered from 0." }
      rx: { type: int, min: 0, max: 63, required: true, label: RX channel, description: "RX (input) channel, numbered from 0." }
    send: { models: [aes67], method: POST, path: /api/aes67/matrix-meter, content_type: application/json, body: '{"tx-no":{tx},"rx-no":{rx}}' }
    expect: *value
    returns: value
  set_crosspoint:
    summary: "Connect or disconnect an RX channel to a TX channel; the audio changes at once (matrix-settings)"
    params:
      tx: { type: int, min: 0, max: 31, required: true, label: TX channel, description: "TX (output) channel, numbered from 0." }
      rx: { type: int, min: 0, max: 63, required: true, label: RX channel, description: "RX (input) channel, numbered from 0." }
      connected: { type: bool, required: true, label: Connected, description: "On mixes the RX channel into the TX channel; off removes it." }
    send:
      - { models: [aes67], method: POST, path: /api/aes67/matrix-settings, content_type: application/json,
          body: '{"matrix":[{"tx-no":{tx},"rx-no":{rx},"mix":{connected:bool01}}]}' }
      - { models: [audio-dx], method: POST, path: /api/aoip/matrix-settings, content_type: application/json,
          body: '{"matrix":[{"tx-no":{tx},"rx-no":{rx},"mix":{connected:bool01}}]}' }
    expect: *ok
    returns: ack
  set_crosspoints:
    summary: "Connect or disconnect many crosspoints at once from matrix-settings' matrix array of tx-no, rx-no and mix (0 or 1)"
    params:
      matrix: { type: json, required: true, label: Crosspoints, description: "The matrix array as AES67 API section 15.5 and Audio DX API section 6.5 give it." }
    send:
      - { models: [aes67], method: POST, path: /api/aes67/matrix-settings, content_type: application/json, body: '{"matrix":{matrix}}' }
      - { models: [audio-dx], method: POST, path: /api/aoip/matrix-settings, content_type: application/json, body: '{"matrix":{matrix}}' }
    expect: *ok
    returns: ack
  clear_matrix:
    summary: "Disconnect every crosspoint of the matrix; all routed audio stops (matrix-clear)"
    send:
      - { models: [aes67], method: POST, path: /api/aes67/matrix-clear }
      - { models: [audio-dx], method: POST, path: /api/aoip/matrix-clear }
    expect: *ok
    returns: ack
  set_tx_volume:
    summary: "Mute and volume of a TX channel of the matrix (volume-tx)"
    params:
      tx: { type: int, min: 0, max: 31, required: true, label: TX channel, description: "TX (output) channel, numbered from 0." }
      muted: { type: bool, required: true, label: Muted, description: "On mutes the TX channel." }
      db: { type: int, min: -36, max: 36, required: true, label: Volume, description: "TX channel volume in dB, -36 to +36." }
    send:
      - { models: [aes67], method: POST, path: /api/aes67/volume-tx, content_type: application/json,
          body: '{"volumes":[{"tx-no":{tx},"tx-mute":{muted},"db":{db}}]}' }
      - { models: [audio-dx], method: POST, path: /api/aoip/volume-tx, content_type: application/json,
          body: '{"volumes":[{"tx-no":{tx},"tx-mute":{muted},"db":{db}}]}' }
    expect: *ok
    returns: ack
  set_crosspoint_volume:
    summary: "Mute and volume of one crosspoint of the matrix (volume-mix)"
    params:
      tx: { type: int, min: 0, max: 31, required: true, label: TX channel, description: "TX (output) channel, numbered from 0." }
      rx: { type: int, min: 0, max: 63, required: true, label: RX channel, description: "RX (input) channel, numbered from 0." }
      muted: { type: bool, required: true, label: Muted, description: "On mutes the RX channel at this crosspoint." }
      db: { type: int, min: -36, max: 36, required: true, label: Volume, description: "Crosspoint volume in dB, -36 to +36." }
    send:
      - { models: [aes67], method: POST, path: /api/aes67/volume-mix, content_type: application/json,
          body: '{"volumes":[{"tx-no":{tx},"rx-no":{rx},"rx-mute":{muted},"db":{db}}]}' }
      - { models: [audio-dx], method: POST, path: /api/aoip/volume-mix, content_type: application/json,
          body: '{"volumes":[{"tx-no":{tx},"rx-no":{rx},"rx-mute":{muted},"db":{db}}]}' }
    expect: *ok
    returns: ack

  # IP to USB (IP to USB API sections 3-8).
  get_usb_mode:
    summary: "USB mode: video conferencing or content sharing (GET /api/system/usb-mode/get)"
    send: { models: [ip-to-usb], method: GET, path: /api/system/usb-mode/get }
    expect: *value
    returns: value
  set_usb_mode:
    summary: "USB mode: video conferencing or content sharing (POST /api/system/usb-mode/update)"
    params:
      mode: { type: enum, values: [video-conferencing, content-sharing], required: true, label: USB mode, description: "How the computer is offered the picture: as a conferencing camera (Normal mode) or for content sharing (Content mode)." }
    send: { models: [ip-to-usb], method: POST, path: /api/system/usb-mode/update, content_type: application/json, body: '{"mode":"{mode:map.usb_mode}"}' }
    expect: *ok
    returns: ack
  get_ndi_discovery:
    summary: "NDI discovery settings: discovery servers on or off, the servers and the groups (GET /api/ndi/config/get)"
    send: { models: [ip-to-usb], method: GET, path: /api/ndi/config/get }
    expect: *value
    returns: value
  set_usb_ndi_discovery:
    summary: "NDI discovery: discovery servers on or off, the servers and the groups (POST /api/ndi/config/update)"
    params:
      enabled: { type: bool, required: true, label: Discovery server, description: "On finds sources through the discovery servers given." }
      servers: { type: string, default: "", max_length: 255, label: Servers, description: "Discovery server addresses separated by commas; needed when on." }
      groups: { type: string, default: public, max_length: 255, label: NDI groups, description: "NDI groups to look in, separated by commas; public is the default." }
    send: { models: [ip-to-usb], method: POST, path: /api/ndi/config/update, content_type: application/json,
            body: '{"data":{"enable":{enabled},"discovery_server":{servers:json},"groups":{groups:json}}}' }
    expect: *ok
    returns: ack
  get_no_signal_image:
    summary: "A no-signal image: its path and whether it is the default (POST /api/resource/image/get)"
    params:
      id: { type: string, default: no_signal_1, max_length: 63, pattern: "^[A-Za-z0-9_-]+$", label: Image, description: "The image's preset id, e.g. no_signal_1." }
    send: { models: [ip-to-usb], method: POST, path: /api/resource/image/get, content_type: application/json, body: '{"id":"{id}","type":"simple"}' }
    expect: *value
    returns: value
  upload_no_signal_image:
    summary: "Upload a PNG shown while there is no signal, replacing the one there (POST /api/resource/image/upload, multipart/form-data)"
    params:
      image: { type: binary, required: true, label: Image, description: "The PNG image's contents, given as base64 or as a host file." }
      id: { type: string, default: no_signal_1, max_length: 63, pattern: "^[A-Za-z0-9_-]+$", label: Image, description: "The image's preset id, e.g. no_signal_1." }
    send:
      method: POST
      path: /api/resource/image/upload
      models: [ip-to-usb]
      multipart:
        - { name: id, value: "{id}" }
        - { name: type, value: simple }
        - { name: file, binary: image, filename: no_signal.png, content_type: application/octet-stream }
    expect: *ok
    returns: ack
  delete_no_signal_image:
    summary: "Delete an uploaded no-signal image; the default one comes back (POST /api/resource/image/delete)"
    params:
      id: { type: string, default: no_signal_1, max_length: 63, pattern: "^[A-Za-z0-9_-]+$", label: Image, description: "The image's preset id, e.g. no_signal_1." }
    send: { models: [ip-to-usb], method: POST, path: /api/resource/image/delete, content_type: application/json, body: '{"id":"{id}"}' }
    expect: *ok
    returns: ack
  get_usb_sources:
    summary: "Sources added by hand, or NDI sources discovered, with their ids and the source selected (GET /api/source/list?type=static or dynamic)"
    params:
      list: { type: enum, values: [static, discovered], default: static, label: List, description: "Sources added by hand (static), or NDI sources found by discovery." }
    send: { models: [ip-to-usb], method: GET, path: /api/source/list, query: { type: "{list:map.usb_source_list}" } }
    expect: *value
    returns: value
  add_usb_ndi_source:
    summary: "Add an NDI source by name and address (POST /api/source/add protocol ndi, type ndi)"
    params:
      name: { type: string, required: true, max_length: 255, label: Name, description: "The source's name in the list." }
      ndi_name: { type: string, required: true, max_length: 255, label: NDI name, description: "The NDI stream's full name, e.g. ENCODER (Camera 1)." }
      url: { type: string, required: true, max_length: 255, label: NDI address, description: "The NDI source's address and port, e.g. 10.0.0.5:5961." }
      transport: { type: enum, values: [auto, multicast, udp, rudp, tcp, multi-tcp], default: auto, label: Transport, description: "How the source is asked to send, or auto." }
      pts_mode: { type: enum, values: [auto, timecode, timestamp], default: auto, label: Timing, description: "Time the video by the NDI timecode, the timestamp, or auto." }
      low_bandwidth: { type: bool, default: false, label: Low bandwidth, description: "On asks the source for its low-bandwidth stream." }
      buffer_ms: { type: int, min: 0, max: 10000, default: 60, label: Buffer, description: "Buffer in milliseconds; shorter is lower latency and less tolerant of jitter." }
    send: { models: [ip-to-usb], method: POST, path: /api/source/add, content_type: application/json,
            body: '{"name":{name:json},"protocol":"ndi","type":"ndi","data":{"name":{ndi_name:json},"url":{url:json},"low_bw":{low_bandwidth},"transport":"{transport}","pts_mode":"{pts_mode}","buffer_ms":{buffer_ms}}}' }
    expect: *ok
    returns: ack
  get_stream_status:
    summary: "The stream being decoded: name, protocol, connection, uptime, tally, and its video and audio format, bitrate, jitter and drops (GET /api/stream/status/get)"
    send: { models: [ip-to-usb], method: GET, path: /api/stream/status/get }
    expect: *value
    returns: value

state:
  device.model:          { type: string, description: "Model, e.g. HDMI 4K Plus, NDI to HDMI or Pro Convert IP to HDMI" }
  device.name:           { type: string, description: "Device name" }
  device.serial:         { type: string, description: "Serial number" }
  device.firmware:       { type: string, description: "Firmware version" }
  device.firmware_up_to_date: { type: bool, description: "Encoders and NDI decoders: the firmware is the latest" }
  device.hardware_revision: { type: string, description: "Hardware revision, A to Z" }
  device.temperature:    { type: float, description: "Core temperature, degrees Celsius" }
  device.uptime:         { type: int, description: "Seconds since start" }
  device.cpu_usage:      { type: float, description: "CPU load, percent (encoders, NDI decoders, and models answering /api/system/info)" }
  device.memory_usage:   { type: float, description: "Encoders and NDI decoders: memory in use, percent" }
  device.fan_rpm:        { type: int, description: "Fan speed in RPM, on models with a fan" }
  device.board_id:       { type: int, description: "Encoders, NDI decoders, AES67 and Audio DX: the rotary switch, 0 to 15" }
  device.input_state:    { type: string, description: "Encoder input: no-signal, locking, unsupported, or the format, e.g. 1920x1080p60" }
  device.output_state:   { type: string, description: "Output connection: e.g. connected, unconnected, active, or the IP decoder's HDMI state 0 disconnected, 1 working, 10 not supported" }
  network.ethernet.state: { type: string, description: "Ethernet link: down, disconnected, or the speed such as 1000m" }
  network.ethernet.mac:  { type: string, description: "Ethernet MAC address" }
  network.ethernet.ip_address: { type: string, description: "Ethernet IP address in use" }
  network.ethernet.netmask: { type: string, description: "Ethernet subnet mask in use" }
  network.ethernet.gateway: { type: string, description: "Ethernet gateway in use" }
  network.ethernet.dns:  { type: string, description: "DNS server in use" }
  network.ethernet.dhcp: { type: bool, description: "Encoders and NDI decoders: the address comes from DHCP (get-eth-status, administrators only)" }
  network.ethernet.tx_kbps: { type: int, description: "Ethernet send rate, kbit/s" }
  network.ethernet.rx_kbps: { type: int, description: "Ethernet receive rate, kbit/s" }
  network.ntp_server:    { type: string, description: "NTP server (administrators only on the encoders and NDI decoders)" }
  network.ssdp:          { type: bool, description: "Encoders and NDI decoders: SSDP discovery answered (administrators only)" }
  auto_reboot.enabled:   { type: bool, description: "Scheduled reboot on" }
  auto_reboot.days:      { type: int, description: "Encoders and NDI decoders: sum of day masks, Monday 1 to Saturday 32 (week-flags)" }
  auto_reboot.week:      { type: string, description: "IP decoders and IP to USB: reboot days as a JSON array, 1 Monday to 7 Sunday" }
  auto_reboot.hour:      { type: int, description: "Reboot hour (UTC on the encoders and NDI decoders)" }
  auto_reboot.minute:    { type: int, description: "Reboot minute" }
  ndi.name:              { type: string, description: "Encoder: the NDI source name sent; decoder: the NDI source decoded" }
  ndi.url:               { type: string, description: "Decoder: the current preset's URL, empty for a discovered source" }
  ndi.enabled:           { type: bool, description: "Encoder: NDI output on (summary enabled); NDI decoder: NDI connected (summary connected)" }
  ndi.clients:           { type: int, description: "Encoder: receivers connected to the stream" }
  ndi.video:             { type: string, description: "Stream video as width x height, scan and field rate, e.g. 1920x1080 progressive 59.94" }
  ndi.video_kbps:        { type: int, description: "Stream video bitrate over the last second, kbit/s" }
  ndi.audio_kbps:        { type: int, description: "Stream audio bitrate over the last second, kbit/s" }
  ndi.video_drops:       { type: int, description: "Encoders and NDI decoders: video frames dropped in the last second" }
  ndi.audio_drops:       { type: int, description: "Encoders and NDI decoders: audio frames dropped in the last second" }
  ndi.audio_channels:    { type: int, description: "Stream audio channels" }
  ndi.audio_sample_rate: { type: int, description: "Stream audio sample rate, Hz" }
  ndi.source_name:       { type: string, description: "Encoder: the source name template set, e.g. #%board-id% (%serial-no%)" }
  ndi.groups:            { type: string, description: "NDI groups, separated by commas (encoder: published in; decoder: searched)" }
  ndi.web_control:       { type: bool, description: "Encoder: NDI receivers may open the web interface" }
  ndi.ptz_control:       { type: bool, description: "Encoder: NDI receivers may control the attached PTZ camera" }
  ndi.failover.enabled:  { type: bool, description: "Encoder: failover source named" }
  ndi.failover.name:     { type: string, description: "Encoder: failover NDI source name" }
  ndi.failover.address:  { type: string, description: "Encoder: failover NDI source address" }
  ndi.transport:         { type: string, description: "NDI transport: tcp (every flag off), multi-tcp, udp, rudp or multicast; the IP decoders also auto" }
  ndi.transport_flags.multicast: { type: bool, description: "Encoders and NDI decoders: enable-mcast" }
  ndi.transport_flags.rudp: { type: bool, description: "Encoders and NDI decoders: enable-rudp" }
  ndi.transport_flags.multi_tcp: { type: bool, description: "Encoders and NDI decoders: enable-tcp (multi-connection TCP)" }
  ndi.transport_flags.udp: { type: bool, description: "Encoders and NDI decoders: enable-udp" }
  ndi.multicast.address: { type: string, description: "Encoder: multicast base address" }
  ndi.multicast.netmask: { type: string, description: "Encoder: multicast netmask" }
  ndi.multicast.ttl:     { type: int, description: "Encoder: multicast time-to-live, hops" }
  ndi.multicast_subnets: { type: string, description: "Decoders: CIDR ranges multicast is received from, empty for any" }
  ndi.discovery.enabled: { type: bool, description: "NDI discovery servers in use" }
  ndi.discovery.servers: { type: string, description: "Discovery server addresses, separated by commas" }
  ndi.reference_level:   { type: string, description: "Encoder audio reference level: smpte (20) or ebu (14)" }
  ndi.vendor_name:       { type: string, description: "Encoder: NDI vendor name" }
  ndi.vendor_id:         { type: string, description: "Encoder: NDI vendor id" }
  ndi.low_bandwidth:     { type: bool, description: "Decoders: low-bandwidth stream requested" }
  ndi.ignore_hx_pts:     { type: bool, description: "NDI decoders: NDI|HX video timestamps ignored" }
  ndi.timecode_first:    { type: bool, description: "NDI decoders: NDI timecode preferred for timing" }
  ndi.pts_mode:          { type: string, description: "IP decoders: auto, timecode or timestamp" }
  ndi.default_buffer_ms: { type: int, description: "IP decoders: buffer for discovered NDI sources, ms" }
  ndi.extra_ips:         { type: string, description: "IP decoders, AES67 and Audio DX: extra addresses NDI sources are looked for at" }
  ndi.sources.*.name:    { type: string, description: "NDI source discovered on the network, by position in the list" }
  ndi.sources.*.address: { type: string, description: "Its address and port; holding amc_id means multicast" }
  tally.preview:         { type: bool, description: "NDI tally: on preview at some receiver (encoder) or at the source (decoder)" }
  tally.program:         { type: bool, description: "NDI tally: on program" }
  tally.user_controlled: { type: bool, description: "Encoder: the tally lights are user-controlled (ext-tally)" }
  video.show_advanced:   { type: bool, description: "Encoder: advanced video settings shown (ar-convertion is reported only then)" }
  video.brightness:      { type: int, description: "Encoder: brightness, -100 to 100" }
  video.contrast:        { type: int, description: "Encoder: contrast, 50 to 200" }
  video.hue:             { type: int, description: "Encoder: hue, -90 to 90" }
