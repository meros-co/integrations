quirks:
  - models: [all]
    severity: warning
    text: >
      Authentication is OAuth 2.0 against the device's own /oauth/token, which the
      core's oauth2 support cannot reach (it refreshes only, against a fixed
      token_url). The spec sends the token setting as Authorization Bearer and
      offers the grants as commands: get_access_token (the password grant) and
      refresh_access_token (the refresh grant) each return the token answer, and
      the consumer passes its access_token with update_settings. An access token
      lasts one hour and a refresh token one week; changing the device password
      invalidates them all. The token commands go to the token endpoint without
      the bearer token, as Teradek's SDK sends them, and are not paced (they have
      their own limit of 30 per 60 seconds). A 401 is not a terminal refusal here,
      so an expired token never blocks the token commands: requests answered 401
      fail on their own (commands with HTTP 401, polls logged) until a new token
      is set. GET /api/v1 needs no token, so the device is reported connected
      without one.
  - models: [all]
    severity: info
    text: >
      The device serves HTTPS with a certificate of its own, which is accepted
      without checking (the link is encrypted, the device not authenticated), as
      Teradek's SDK does with rejectUnauthorized false. The token endpoint is
      reached on port 443 even when the device is opened on another port.
  - models: [all]
    severity: warning
    text: >
      The API allows 60 requests per 60 seconds and answers 429 beyond it. The
      core spaces requests one second apart, so it alone never exceeds the limit,
      and polls sparingly: the stream pool every 15 s, with the status and
      recording of the pipeline owning the first listed stream; every encoder's
      and decoder's status and configuration, the streams they own, the inputs
      and the capacity every 60 s; system, Wi-Fi, wired ports and modems every 5
      minutes. A unit with many pipelines and streams needs more than a minute
      for a round, and its reads then lag; commands go ahead of queued reads.
      Writes are read back at once. The rate limit headers of each answer are
      kept in rate_limit.
  - models: [all]
    severity: warning
    text: >
      A 504 means the device did not confirm a write or an action in time, but it
      may still have applied it: the command fails, and the value is read again
      by the next poll, or at once with the matching get command, before
      retrying.
  - models: [all]
    severity: warning
    text: >
      Firmware: Apollo OS 2.25 or later. The lists of encoders, decoders and
      streams, adding, deleting and restarting pipelines, the inputs, the
      capacity, the audio track endpoints, a pipeline's streams, the snapshot,
      and the publish, unpublish, broadcast, halt and cancel actions need 2.26;
      2.25 answers them 404. On 2.25 a unit has encoder 0, decoder 0 and streams 0
      to 4, every other endpoint works with those ids, and the stream mode is
      kept per codec (set_stream_codec_modes, mode-h264 and mode-hevc). Since
      the pipelines are found through the 2.26 lists, a 2.25 unit's telemetry
      keeps only system and network state current; its pipelines' and streams'
      state comes from the replies to the get commands.
  - models: [all]
    severity: info
    text: >
      Encoder, decoder and stream ids are pool ids and can have gaps after a
      deletion; read them from the lists. pools.encoders, pools.decoders and
      pools.streams are replaced on each list read and say what exists now. A
      pipeline or stream deleted through this API leaves state at once; one
      deleted in the web UI keeps its last values under encoders, decoders or
      streams until the device is opened again. A stream with no state (a
      Disabled stream) or no owner keeps the last one reported.
  - models: [all]
    severity: critical
    text: >
      A change to a setting that belongs to a pipeline makes the device apply the
      pipeline again, and encoding restarts, as in the web UI: changing an
      encoder's input does (set_encoder, set_encoder_physical_input,
      set_encoder_network_input), and so may other encoder video, audio and
      decoder ingest settings. restart_encoder and restart_decoder restart a
      pipeline at once. Every stream of the pipeline drops while it restarts.
  - models: [all]
    severity: critical
    text: >
      delete_encoder, delete_decoder and delete_stream remove the pipeline or
      stream and its configuration for good; the last pipeline, stream 0 and
      anything at the device's minimum cannot be deleted. stop_stream,
      stop_all_streams, unpublish_stream, halt_stream, cancel_stream and
      complete_stream end live output (complete is taken to end the broadcast
      on platforms that have one), and stop_encoder_recording and
      stop_decoder_recording end the take.
  - models: [all]
    severity: critical
    text: >
      upgrade_firmware starts a firmware upgrade, which stops the device's
      output while it runs. import_settings replaces this device's settings with
      another's, and push_settings and push_settings_to replace the settings of
      up to 10 other devices; the other devices' admin passwords are sent in the
      request body.
  - models: [all]
    severity: info
    text: >
      start_stream and stop_stream send the action the stream's mode takes
      (publish or unpublish for RTMP, Twitch, Wowza, Facebook, DolbyIO,
      PhenixRTS and WHIP; broadcast or halt for YouTubeLive; start or stop for the
      others such as Bond). TS, SRT, RTSP, RTP, RIST, HLS, DASH and WHEP streams
      run whenever their pipeline runs and answer start and stop with 400. An
      action the mode or state does not offer answers 400 with "Invalid: ...".
      The owner of a stream cannot be changed through the API: attach a stream
      to a pipeline in the web UI; a stream added here has no owner.
  - models: [all]
    severity: info
    text: >
      Settings writes are checked value by value: an invalid value or an unknown
      key fails the whole write with the reason (such as "bitrate_list: Invalid
      choice"). The describe commands (?command=description) give each setting's
      label, default, type, choices, range and help for building a form, and
      never change state. The keys each endpoint takes differ by product,
      firmware and, for streams and decoder ingests, by mode; the settings_json
      state keeps every key last read. A stream's secrets read back masked.
  - models: [all]
    severity: info
    text: >
      Units: the video bitrate (bitrate_list) is in kbit/s (100 to 80000 as the
      device describes it), the audio bitrate in bit/s, and the measured Bitrate
      in encoder info in bit/s. On 2.26 an encoder's audio enable is the opposite
      of mute_track and is mapped to it; send one of them, not both with
      different meanings (400). An encoder has up to 8 audio tracks (2.26), and
      the audio settings endpoint without a track id is the first one.
  - models: [all]
    severity: info
    text: >
      The physical audio output, and its 16 channels, are shared by all decoders:
      the decoder id in their path picks no output of its own, and the core reads
      them through the first decoder listed. Every decoder path answers 404
      Decoder not available while the device is in encoder-only mode. SCTE
      markers are not supported on decoders (the API always refuses them), so
      no command sends one.
  - models: [all]
    severity: info
    text: >
      Snapshots: the device saves a JPEG of each pipeline every 5 seconds and
      returns the latest (up to 5 s old) as image/jpeg. The core cannot return a
      binary image as a command result, so there is no snapshot command;
      set_encoder_snapshot_settings and set_decoder_snapshot_settings save the
      width, height and quality for the next snapshot, and the image in their
      reply is dropped. The API has no read of the snapshot settings. The wired
      ports and modems are read-only in the API.
  - models: [all]
    severity: info
    text: >
      A POST without a body must carry Content-Length 0, or the device answers
      411; the actions here (record start and stop, stream actions, restarts,
      adding, the firmware upgrade, a plain SCTE marker) are sent without a body.
      The insert_scte_marker_with and start_encoder_recording_with commands save
      their fields to the settings first, so they apply to later markers and
      recordings too.
