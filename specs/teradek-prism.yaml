                          description: "The decoder pipeline's id, from list_decoders (pools.decoders); ids can have gaps, and firmware 2.25 uses decoder 0 whatever is given." }
    send: { method: GET, path: "/api/v1/decoders/{decoder}" }
    expect: { status: 200, json_path: "$" }
