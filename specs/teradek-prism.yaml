  set_stream_name:
    summary: "Rename a stream (PUT /api/v1/streams/{sid} name)"
    params: { stream: *stream, name: *name }
    send: { method: PUT, path: "/api/v1/streams/{stream}", body: '{"settings":{"name":{name:json}}}', content_type: application/json }
    expect: *ok
    returns: ack
  set_stream_mode:
    summary: "Set a stream's protocol, such as SRT, or Disabled (PUT /api/v1/streams/{sid} mode, 2.26)"
    params: { stream: *stream, mode: *stream_mode }
    send: { method: PUT, path: "/api/v1/streams/{stream}", body: '{"settings":{"mode":{mode:json}}}', content_type: application/json }
    expect: *ok
    returns: ack
  set_stream_codec_modes:
    summary: "Set a stream's protocol for H.264 and for HEVC encoding, as firmware 2.25 keeps them (PUT /api/v1/streams/{sid} mode-h264 and mode-hevc; 2.26 writes them to mode)"
    params:
      stream: *stream
      mode_h264: { type: string, required: true, max_length: 32, pattern: "^[A-Za-z0-9._-]+$",
                   label: Mode for H.264,
                   description: "The protocol used while encoding H.264, by the device's own name such as TS, SRT or Disabled." }
      mode_hevc: { type: string, required: true, max_length: 32, pattern: "^[A-Za-z0-9._-]+$",
                   label: Mode for HEVC,
                   description: "The protocol used while encoding HEVC, by the device's own name such as TS, SRT or Disabled." }
    send: { method: PUT, path: "/api/v1/streams/{stream}", body: '{"settings":{"mode-h264":{mode_h264:json},"mode-hevc":{mode_hevc:json}}}',
            content_type: application/json }
    expect: *ok
    returns: ack
  get_stream_settings:
    summary: "The settings of the stream's current mode, such as the SRT connection type, ports, latency and encryption; fails with Stream is Disabled when its mode is Disabled (GET /api/v1/streams/{sid}/settings)"
    params: { stream: *stream }
    send: { method: GET, path: "/api/v1/streams/{stream}/settings" }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  describe_stream_settings:
    summary: "Each of the current mode's settings described: label, default, type, choices and their display names, range (GET /api/v1/streams/{sid}/settings?command=description)"
    params: { stream: *stream }
    send: { method: GET, path: "/api/v1/streams/{stream}/settings", query: { command: description } }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  set_stream_settings:
    summary: "Set the current mode's settings; values is an object of the keys GET /api/v1/streams/{sid}/settings returns (PUT /api/v1/streams/{sid}/settings)"
    params: { stream: *stream, values: *values }
    send: { method: PUT, path: "/api/v1/streams/{stream}/settings", body: '{"settings":{values}}', content_type: application/json }
    expect: *ok
    returns: ack
  get_stream_info:
    summary: "A stream's status: state and details, uptime, URL, port, latency, encryption and traffic statistics (GET /api/v1/streams/{sid}/info)"
    params: { stream: *stream }
    send: { method: GET, path: "/api/v1/streams/{stream}/info" }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  start_stream:
    summary: "Start a stream: publish for RTMP, Twitch, Wowza, Facebook, DolbyIO, PhenixRTS and WHIP, broadcast for YouTubeLive, start for the others such as Bond (POST /api/v1/streams/{sid}/start)"
    params: { stream: *stream }
    send: { method: POST, path: "/api/v1/streams/{stream}/start" }
    expect: *ok
    returns: ack
  stop_stream:
    summary: "Stop a stream: unpublish, halt for YouTubeLive, or stop, by its mode (POST /api/v1/streams/{sid}/stop)"
    params: { stream: *stream }
    send: { method: POST, path: "/api/v1/streams/{stream}/stop" }
    expect: *ok
    returns: ack
  start_all_streams:
    summary: "Start all streams (POST /api/v1/streams/0/start_all)"
    send: { method: POST, path: /api/v1/streams/0/start_all }
    expect: *ok
    returns: ack
  stop_all_streams:
    summary: "Stop all streams (POST /api/v1/streams/0/stop_all)"
    send: { method: POST, path: /api/v1/streams/0/stop_all }
    expect: *ok
    returns: ack
  start_preview:
    summary: "Start a stream's preview (POST /api/v1/streams/{sid}/preview)"
    params: { stream: *stream }
    send: { method: POST, path: "/api/v1/streams/{stream}/preview" }
    expect: *ok
    returns: ack
  end_preview:
    summary: "End a stream's preview (POST /api/v1/streams/{sid}/endpreview)"
    params: { stream: *stream }
    send: { method: POST, path: "/api/v1/streams/{stream}/endpreview" }
    expect: *ok
    returns: ack
  complete_stream:
    summary: "Mark a stream complete (POST /api/v1/streams/{sid}/complete)"
    params: { stream: *stream }
    send: { method: POST, path: "/api/v1/streams/{stream}/complete" }
    expect: *ok
    returns: ack
  publish_stream:
    summary: "Send the publish action to a stream (POST /api/v1/streams/{sid}/publish, 2.26)"
    params: { stream: *stream }
    send: { method: POST, path: "/api/v1/streams/{stream}/publish" }
    expect: *ok
    returns: ack
  unpublish_stream:
    summary: "Send the unpublish action to a stream (POST /api/v1/streams/{sid}/unpublish, 2.26)"
    params: { stream: *stream }
    send: { method: POST, path: "/api/v1/streams/{stream}/unpublish" }
    expect: *ok
    returns: ack
  broadcast_stream:
    summary: "Send the broadcast action to a stream (POST /api/v1/streams/{sid}/broadcast, 2.26)"
    params: { stream: *stream }
    send: { method: POST, path: "/api/v1/streams/{stream}/broadcast" }
    expect: *ok
    returns: ack
  halt_stream:
    summary: "Send the halt action to a stream (POST /api/v1/streams/{sid}/halt, 2.26)"
    params: { stream: *stream }
    send: { method: POST, path: "/api/v1/streams/{stream}/halt" }
    expect: *ok
    returns: ack
  cancel_stream:
    summary: "Send the cancel action to a stream (POST /api/v1/streams/{sid}/cancel, 2.26)"
    params: { stream: *stream }
    send: { method: POST, path: "/api/v1/streams/{stream}/cancel" }
    expect: *ok
    returns: ack

  # ── Network (Network: Wired, WiFi, Modem) ─────────────────────────────
  get_wired:
    summary: "A wired port's status: label, status, detail and MAC address (GET /api/v1/network/wired/{0-1})"
    params:
      port: { type: int, min: 0, max: 1, required: true,
              label: Wired port,
              description: "The wired Ethernet port, 0 or 1." }
    send: { method: GET, path: "/api/v1/network/wired/{port}" }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  get_wifi:
    summary: "Wi-Fi settings and status: label, status, network, IP address, mask and MAC address (GET /api/v1/network/wifi)"
    send: { method: GET, path: /api/v1/network/wifi }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  describe_wifi:
    summary: "Each Wi-Fi setting's type, default and allowed values (GET /api/v1/network/wifi?command=description)"
    send: { method: GET, path: /api/v1/network/wifi, query: { command: description } }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  set_wifi:
    summary: "Set Wi-Fi settings; values is an object of the keys GET /api/v1/network/wifi returns, such as Network and IP Address (PUT /api/v1/network/wifi)"
    params: { values: *values }
    send: { method: PUT, path: /api/v1/network/wifi, body: '{"settings":{values}}', content_type: application/json }
    expect: *ok
    returns: ack
  get_modem:
    summary: "A cellular modem's status: type, model, version, status, carrier report, RSSI, IMEI, IMSI and ICCID (GET /api/v1/network/modem/{0-7})"
    params:
      modem: { type: int, min: 0, max: 7, required: true,
               label: Modem,
               description: "The modem, 0 to 7." }
    send: { method: GET, path: "/api/v1/network/modem/{modem}" }
    expect: { status: 200, json_path: "$.settings" }
    returns: value

  # ── Settings sync (Settings Sync: Import, Push) ───────────────────────
  import_settings:
    summary: "Import the settings of another Teradek device into this one (POST /api/v1/settings/sync/import)"
    params:
      type: { type: string, default: encoder, max_length: 32, pattern: "^[a-z]+$",
              label: Settings type,
              description: "Which settings to import, as the document's example names them: encoder." }
      host: &sync_host { type: string, required: true, max_length: 253, pattern: "^[A-Za-z0-9.:-]+$",
                         label: Device address,
                         description: "The other device's IP address or host name, such as 192.168.1.50." }
      password: &sync_password { type: string, required: true, secret: true, max_length: 256,
                                 label: Device password,
                                 description: "The other device's admin password." }
    send: { method: POST, path: /api/v1/settings/sync/import,
            body: '{"type":{type:json},"settings":{"host":{host:json},"password":{password:json}}}', content_type: application/json }
    expect: *ok
    returns: ack
  push_settings:
    summary: "Push this device's settings to up to 10 other devices; targets is the document's array of {host, password} (POST /api/v1/settings/sync/push)"
    params:
      targets: { type: json, required: true,
                 label: Targets,
                 description: "A JSON array of up to 10 objects, each the host and admin password of a device to receive the settings: [{\"host\": \"192.168.1.51\", \"password\": \"...\"}]." }
    send: { method: POST, path: /api/v1/settings/sync/push, body: '{"targets":{targets}}', content_type: application/json }
    expect: *ok
    returns: ack
  push_settings_to:
    summary: "Push this device's settings to one other device (POST /api/v1/settings/sync/push with one target)"
    params: { host: *sync_host, password: *sync_password }
    send: { method: POST, path: /api/v1/settings/sync/push,
            body: '{"targets":[{"host":{host:json},"password":{password:json}}]}', content_type: application/json }
    expect: *ok
    returns: ack

telemetry:
  # The API has no push. Polling is kept within the 60 requests per minute
  # the device allows (see quirks): the stream pool every 15 s, with the
  # status and recording of the pipeline owning the first listed stream;
  # every pipeline's status and configuration, with its streams', every
  # 60 s; system and network every 5 minutes. A write is read back at once.
  poll:
    - every_ms: 15000
      send:
        - { method: GET, path: /api/v1/streams }
    - every_ms: 60000
      send:
        - { method: GET, path: /api/v1/encoders }
        - { method: GET, path: /api/v1/decoders }
        - { method: GET, path: /api/v1/inputs }
        - { method: GET, path: /api/v1/encoders/capacity }
    - every_ms: 300000
      send:
        - { method: GET, path: /api/v1/system/info }
        - { method: GET, path: /api/v1/system/firmware/settings }
        - { method: GET, path: /api/v1/network/wired/0 }
        - { method: GET, path: /api/v1/network/wired/1 }
        - { method: GET, path: /api/v1/network/wifi }
        - { method: GET, path: /api/v1/network/modem/0 }
        - { method: GET, path: /api/v1/network/modem/1 }
        - { method: GET, path: /api/v1/network/modem/2 }
        - { method: GET, path: /api/v1/network/modem/3 }
        - { method: GET, path: /api/v1/network/modem/4 }
        - { method: GET, path: /api/v1/network/modem/5 }
        - { method: GET, path: /api/v1/network/modem/6 }
        - { method: GET, path: /api/v1/network/modem/7 }
  updates:
    # Every API answer carries the rate limit (Authentication, Rate Limit Headers).
    - path: "^/api/v1"
      headers: { limit: X-RateLimit-Limit, remaining: X-RateLimit-Remaining, reset: X-RateLimit-Reset }
      state:
        rate_limit.limit: "{limit}"
        rate_limit.remaining: "{remaining}"
        rate_limit.reset: "{reset}"

    # ── System ──
    - path: "^/api/v1/system/info$"
      json: { model: "$.settings.Device Model", serial: "$.settings.Serial", firmware: "$.settings.Firmware Version" }
      state:
        system.model: "{model}"
        system.serial: "{serial}"
        system.firmware_version: "{firmware}"
    - path: "^/api/v1/system/firmware/check$"
      json: { latest: "$.settings.Latest Firmware", message: "$.message" }
      state:
        system.latest_firmware: "{latest}"
        system.firmware_check: "{message}"
    - path: "^/api/v1/system/firmware/settings$"
      json: { auto: "$.settings.auto_check" }
      state: { system.firmware_auto_check: "{auto}" }
    - path: "^/api/v1/system/firmware/settings$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: /api/v1/system/firmware/settings }]

    # ── Inputs (2.26): replaced whole on each read ──
    - path: "^/api/v1/inputs$"
      json_each: "$.video"
      json: { id: "$.id", label: "$.label", port: "$.port", index: "$.index", format: "$.info.Input Format",
              scan: "$.info.Input Scan", rate: "$.info.Framerate", depth: "$.info.Color Depth",
              sub: "$.info.SubSampling", colorimetry: "$.info.Colorimetry", range: "$.info.Range",
              eotf: "$.info.EOTF", resolution: "$.info.enc-input-resolution" }
      replace: inputs.video
      state:
        "inputs.video.{id:key}.label": "{label}"
        "inputs.video.{id:key}.port": "{port}"
        "inputs.video.{id:key}.index": "{index}"
        "inputs.video.{id:key}.format": "{format}"
        "inputs.video.{id:key}.scan": "{scan}"
        "inputs.video.{id:key}.framerate": "{rate}"
        "inputs.video.{id:key}.color_depth": "{depth}"
        "inputs.video.{id:key}.subsampling": "{sub}"
        "inputs.video.{id:key}.colorimetry": "{colorimetry}"
        "inputs.video.{id:key}.range": "{range}"
        "inputs.video.{id:key}.eotf": "{eotf}"
        "inputs.video.{id:key}.resolution": "{resolution}"
    - path: "^/api/v1/inputs$"
      json_each: "$.audio"
      json: { id: "$.id", label: "$.label" }
      replace: inputs.audio
      state: { "inputs.audio.{id:key}.label": "{label}" }

    # ── Capacity (2.26) ──
    - path: "^/api/v1/encoders/capacity$"
      json: { eb: "$.settings.encode_budget_mpixps", eu: "$.settings.encode_used_mpixps", ep: "$.settings.encode_percent",
              db: "$.settings.decode_budget_mpixps", du: "$.settings.decode_used_mpixps", dp: "$.settings.decode_percent",
              limiting: "$.settings.limiting", refusal: "$.settings.last_refusal",
              used: "$.settings.physical_inputs_used", total: "$.settings.physical_inputs_total" }
      state:
        capacity.encode_budget_mpixps: "{eb}"
        capacity.encode_used_mpixps: "{eu}"
        capacity.encode_percent: "{ep}"
        capacity.decode_budget_mpixps: "{db}"
        capacity.decode_used_mpixps: "{du}"
        capacity.decode_percent: "{dp}"
        capacity.limiting: "{limiting}"
        capacity.last_refusal: "{refusal}"
        capacity.physical_inputs_used: "{used}"
        capacity.physical_inputs_total: "{total}"

    # ── Encoder pool (2.26) ──
    # The list: membership in pools.encoders (replaced whole), each
    # encoder's list fields, and its status and configuration read in turn.
    - path: "^/api/v1/encoders$"
      json_match: { "$.encoders": "^\\[" }
      json_each: "$.encoders"
      json: { id: "$.id", name: "$.name", state: "$.state", uptime: "$.uptime", input_type: "$.input_type",
              physical: "$.physical_input", network: "$.network_input", audio: "$.audio_source",
              streams: "$.streams", tracks: "$.audio_tracks" }
      replace: pools.encoders
      state:
        "pools.encoders.{id}.name": "{name}"
        "encoders.{id}.name": "{name}"
        "encoders.{id}.state": "{state}"
        "encoders.{id}.uptime": "{uptime}"
        "encoders.{id}.input_type": "{input_type}"
        "encoders.{id}.physical_input": "{physical}"
        "encoders.{id}.network_input": "{network}"
        "encoders.{id}.audio_source": "{audio}"
        "encoders.{id}.streams": "{streams}"
        "encoders.{id}.audio_tracks": "{tracks}"
      then_send:
        - { method: GET, path: "/api/v1/encoders/{id}/info" }
        - { method: GET, path: "/api/v1/encoders/{id}/record/info" }
        - { method: GET, path: "/api/v1/encoders/{id}/video/settings" }
        - { method: GET, path: "/api/v1/encoders/{id}/audio" }
        - { method: GET, path: "/api/v1/encoders/{id}/metadata/settings" }
        - { method: GET, path: "/api/v1/encoders/{id}/record/settings" }
    - path: "^/api/v1/encoders$"
      json_match: { "$.encoders": "^\\[" }
      json: { limit: "$.limit", minimum: "$.minimum" }
      state:
        limits.encoders: "{limit}"
        limits.encoders_minimum: "{minimum}"
    # Each encoder's streams: configuration, mode settings and status.
    - path: "^/api/v1/encoders$"
      json_each: "$.encoders[*].streams"
      json: { sid: "$" }
      then_send:
        - { method: GET, path: "/api/v1/streams/{sid}" }
        - { method: GET, path: "/api/v1/streams/{sid}/settings" }
        - { method: GET, path: "/api/v1/streams/{sid}/info" }
    # A pipeline or stream added: its list read again.
    - path: "^/api/v1/(encoders|decoders|streams)$"
      json_match: { "$.id": "^\\d+$" }
      json: {}
      then_send: [{ method: GET, path: "/api/v1/{1}" }]
    # A deletion: its state removed, its list read again.
    - path: "^/api/v1/encoders/(\\d+)$"
      json_match: { "$.message": "^Encoder \\d+ removed$" }
      json: {}
      state: { "encoders.{1}": { delete: true } }
      then_send: [{ method: GET, path: /api/v1/encoders }]
    - path: "^/api/v1/decoders/(\\d+)$"
      json_match: { "$.message": "^Decoder \\d+ removed$" }
      json: {}
      state: { "decoders.{1}": { delete: true } }
      then_send: [{ method: GET, path: /api/v1/decoders }]
    - path: "^/api/v1/streams/(\\d+)$"
      json_match: { "$.message": "^Stream \\d+ removed$" }
      json: {}
      state: { "streams.{1}": { delete: true } }
      then_send: [{ method: GET, path: /api/v1/streams }]

    # ── One encoder (2.26) ──
    - path: "^/api/v1/encoders/(\\d+)$"
      json: { name: "$.settings.name", input_type: "$.settings.input_type", physical: "$.settings.physical_input",
              network: "$.settings.network_input", audio: "$.settings.audio_source", streams: "$.settings.streams",
              tracks: "$.settings.audio_tracks", state: "$.info.State", uptime: "$.info.Uptime", started: "$.info.StartedAt" }
      state:
        "encoders.{1}.name": "{name}"
        "encoders.{1}.input_type": "{input_type}"
        "encoders.{1}.physical_input": "{physical}"
        "encoders.{1}.network_input": "{network}"
        "encoders.{1}.audio_source": "{audio}"
        "encoders.{1}.streams": "{streams}"
        "encoders.{1}.audio_tracks": "{tracks}"
        "encoders.{1}.state": "{state}"
        "encoders.{1}.uptime": "{uptime}"
        "encoders.{1}.started_at": "{started}"
    # Writes read back: a pipeline's own settings.
    - path: "^/api/v1/(encoders|decoders)/(\\d+)$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: "/api/v1/{1}/{2}" }]
    # A restart: the pipeline's status read again.
    - path: "^/api/v1/(encoders|decoders)/(\\d+)/restart$"
      json: {}
      then_send: [{ method: GET, path: "/api/v1/{1}/{2}/info" }]
    # A pipeline's streams (2.26), into each stream's state.
    - path: "^/api/v1/(?:encoders|decoders)/\\d+/streams$"
      json_each: "$.streams"
      json: { id: "$.id", name: "$.name", mode: "$.mode", state: "$.state" }
      state:
        "streams.{id}.name": "{name}"
        "streams.{id}.mode": "{mode}"
        "streams.{id}.state": "{state}"

    # ── Encoder status ──
    - path: "^/api/v1/encoders/(\\d+)/info$"
      json: { format: "$.settings.Format", status: "$.settings.Status", generator: "$.settings.Generator",
              resolution: "$.settings.enc-output-resolution", bitrate: "$.settings.Bitrate",
              target: "$.settings.Target Bitrate", state: "$.settings.State", uptime: "$.settings.Uptime",
              started: "$.settings.StartedAt", audio: "$.settings.AudioSource" }
      state:
        "encoders.{1}.info.format": "{format}"
        "encoders.{1}.info.status": "{status}"
        "encoders.{1}.info.generator": "{generator}"
        "encoders.{1}.info.output_resolution": "{resolution}"
        "encoders.{1}.info.bitrate": "{bitrate}"
        "encoders.{1}.info.target_bitrate": "{target}"
        "encoders.{1}.state": "{state}"
        "encoders.{1}.uptime": "{uptime}"
        "encoders.{1}.started_at": "{started}"
        "encoders.{1}.audio_source": "{audio}"

    # ── Encoder video ──
    - path: "^/api/v1/encoders/(\\d+)/video/settings$"
      json: { codec: "$.settings.codec", p264: "$.settings.profile_h264", p265: "$.settings.profile_hevc",
              bitrate: "$.settings.bitrate_list", rc: "$.settings.control-rate", gop: "$.settings.gop_length",
              kfi: "$.settings.kfi_seconds", slices: "$.settings.num_slices", level: "$.settings.level",
              tier: "$.settings.tier", entropy: "$.settings.entropy-mode", interlacer: "$.settings.interlacer",
              resolution: "$.settings.resolution", res_common: "$.settings.resolution_common",
              width: "$.settings.width", height: "$.settings.height", fr_setting: "$.settings.framerate_setting",
              fr_common: "$.settings.framerate_common", fr_exact: "$.settings.framerate_exact",
              depth: "$.settings.bit_depth", chroma: "$.settings.chroma_subsampling",
              override: "$.settings.color_override", colorimetry: "$.settings.colorimetry",
              eotf: "$.settings.eotf", range: "$.settings.range" }
      state:
        "encoders.{1}.video.codec": "{codec}"
        "encoders.{1}.video.profile_h264": "{p264}"
        "encoders.{1}.video.profile_hevc": "{p265}"
        "encoders.{1}.video.bitrate_kbps": "{bitrate}"
        "encoders.{1}.video.rate_control": "{rc}"
        "encoders.{1}.video.gop_length": "{gop}"
        "encoders.{1}.video.keyframe_interval_s": "{kfi}"
        "encoders.{1}.video.slices": "{slices}"
        "encoders.{1}.video.level": "{level}"
        "encoders.{1}.video.tier": "{tier}"
        "encoders.{1}.video.entropy_mode": "{entropy}"
        "encoders.{1}.video.interlacer": "{interlacer}"
        "encoders.{1}.video.resolution": "{resolution}"
        "encoders.{1}.video.resolution_common": "{res_common}"
        "encoders.{1}.video.width": "{width}"
        "encoders.{1}.video.height": "{height}"
        "encoders.{1}.video.framerate_setting": "{fr_setting}"
        "encoders.{1}.video.framerate_common": "{fr_common}"
        "encoders.{1}.video.framerate_exact": "{fr_exact}"
        "encoders.{1}.video.bit_depth": "{depth}"
        "encoders.{1}.video.chroma_subsampling": "{chroma}"
        "encoders.{1}.video.color_override": "{override}"
        "encoders.{1}.video.colorimetry": "{colorimetry}"
        "encoders.{1}.video.eotf": "{eotf}"
        "encoders.{1}.video.range": "{range}"
    # The whole settings object as read (a GET, not a write's echo).
    - path: "^/api/v1/encoders/(\\d+)/video/settings$"
      json_match: { "$.message": "^Settings retrieved" }
      json: { all: "$.settings" }
      state: { "encoders.{1}.video.settings_json": "{all}" }

    # ── Encoder audio ──
    - path: "^/api/v1/encoders/(\\d+)/audio$"
      json_each: "$.tracks"
      json: { id: "$.id", codec: "$.codec", channels: "$.channel_mode", bitrate: "$.bitrate_list",
              rate: "$.samplerate_list", mute: "$.mute_track", enable: "$.enable" }
      replace: "encoders.{1}.tracks"
      state:
        "encoders.{1}.tracks.{id}.codec": "{codec}"
        "encoders.{1}.tracks.{id}.channel_mode": "{channels}"
        "encoders.{1}.tracks.{id}.bitrate_bps": "{bitrate}"
        "encoders.{1}.tracks.{id}.samplerate_hz": "{rate}"
        "encoders.{1}.tracks.{id}.mute_track": "{mute}"
        "encoders.{1}.tracks.{id}.enable": "{enable}"
      then_send: [{ method: GET, path: "/api/v1/encoders/{1}/audio/{id}/settings" }]
    - path: "^/api/v1/encoders/(\\d+)/audio/settings$"
      json: &audio_json { codec: "$.settings.codec", bitrate: "$.settings.bitrate_list", channels: "$.settings.channel_mode",
                          channels2: "$.settings.channel_mode2", rate_setting: "$.settings.samplerate",
                          rate: "$.settings.samplerate_list", map: "$.settings.default-channel-map",
                          delay: "$.settings.delay", afterburner: "$.settings.afterburner",
                          mute: "$.settings.mute_track", enable: "$.settings.enable" }
      state:
        "encoders.{1}.audio.codec": "{codec}"
        "encoders.{1}.audio.bitrate_bps": "{bitrate}"
        "encoders.{1}.audio.channel_mode": "{channels}"
        "encoders.{1}.audio.channel_mode2": "{channels2}"
        "encoders.{1}.audio.samplerate": "{rate_setting}"
        "encoders.{1}.audio.samplerate_hz": "{rate}"
        "encoders.{1}.audio.channel_map": "{map}"
        "encoders.{1}.audio.delay": "{delay}"
        "encoders.{1}.audio.afterburner": "{afterburner}"
        "encoders.{1}.audio.mute_track": "{mute}"
        "encoders.{1}.audio.enable": "{enable}"
    - path: "^/api/v1/encoders/(\\d+)/audio/settings$"
      json_match: { "$.message": "^Settings retrieved" }
      json: { all: "$.settings" }
      state: { "encoders.{1}.audio.settings_json": "{all}" }
    - path: "^/api/v1/encoders/(\\d+)/audio/(\\d+)/settings$"
      json: *audio_json
      state:
        "encoders.{1}.tracks.{2}.codec": "{codec}"
        "encoders.{1}.tracks.{2}.bitrate_bps": "{bitrate}"
        "encoders.{1}.tracks.{2}.channel_mode": "{channels}"
        "encoders.{1}.tracks.{2}.channel_mode2": "{channels2}"
        "encoders.{1}.tracks.{2}.samplerate": "{rate_setting}"
        "encoders.{1}.tracks.{2}.samplerate_hz": "{rate}"
        "encoders.{1}.tracks.{2}.channel_map": "{map}"
        "encoders.{1}.tracks.{2}.delay": "{delay}"
        "encoders.{1}.tracks.{2}.afterburner": "{afterburner}"
        "encoders.{1}.tracks.{2}.mute_track": "{mute}"
        "encoders.{1}.tracks.{2}.enable": "{enable}"
    - path: "^/api/v1/encoders/(\\d+)/audio/(\\d+)/settings$"
      json_match: { "$.message": "^Settings retrieved" }
      json: { all: "$.settings" }
      state: { "encoders.{1}.tracks.{2}.settings_json": "{all}" }
    # A track's write read back; the first track's write also changes the
    # track list.
    - path: "^/api/v1/encoders/(\\d+)/audio/(\\d+)/settings$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: "/api/v1/encoders/{1}/audio/{2}/settings" }]

    # ── Encoder metadata ──
    - path: "^/api/v1/encoders/(\\d+)/metadata/settings$"
      json: { duration: "$.settings.break_duration", program: "$.settings.program_id", expect: "$.settings.avail_expect",
              timecode: "$.settings.timecode", preroll: "$.settings.pre_roll", event: "$.settings.network_event",
              num: "$.settings.avail_num", dpi: "$.settings.dpi", cc: "$.settings.closed-captions",
              event_id: "$.settings.event_id", splice: "$.settings.splice_type" }
      state:
        "encoders.{1}.metadata.break_duration_ms": "{duration}"
        "encoders.{1}.metadata.program_id": "{program}"
        "encoders.{1}.metadata.avail_expect": "{expect}"
        "encoders.{1}.metadata.timecode": "{timecode}"
        "encoders.{1}.metadata.pre_roll_ms": "{preroll}"
        "encoders.{1}.metadata.network_event": "{event}"
        "encoders.{1}.metadata.avail_num": "{num}"
        "encoders.{1}.metadata.dpi": "{dpi}"
        "encoders.{1}.metadata.closed_captions": "{cc}"
        "encoders.{1}.metadata.event_id": "{event_id}"
        "encoders.{1}.metadata.splice_type": "{splice}"
    # An SCTE marker with fields saves them: the settings read again.
    - path: "^/api/v1/encoders/(\\d+)/metadata/scte$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: "/api/v1/encoders/{1}/metadata/settings" }]

    # ── Encoder recording ──
    - path: "^/api/v1/encoders/(\\d+)/record/settings$"
      json: &record_json { mode: "$.settings.mode", selection: "$.settings.audio_track_selection", tracks: "$.settings.audio_tracks",
                           name: "$.settings.name", format: "$.settings.format", files: "$.settings.max-files",
                           size_time: "$.settings.max-size-time", bonded: "$.settings.bonded_uploads",
                           cyclic: "$.settings.cyclic", loop: "$.settings.file-loop-index",
                           camera: "$.settings.camera_type", auto: "$.settings.auto_record",
                           drive: "$.settings.drive_id", fragmented: "$.settings.fragmented",
                           timecode: "$.settings.timecode", sidecar: "$.settings.sidecar" }
      state:
        "encoders.{1}.record.mode": "{mode}"
        "encoders.{1}.record.audio_track_selection": "{selection}"
        "encoders.{1}.record.audio_tracks": "{tracks}"
        "encoders.{1}.record.name": "{name}"
        "encoders.{1}.record.format": "{format}"
        "encoders.{1}.record.max_files": "{files}"
        "encoders.{1}.record.max_size_time": "{size_time}"
        "encoders.{1}.record.bonded_uploads": "{bonded}"
        "encoders.{1}.record.cyclic": "{cyclic}"
        "encoders.{1}.record.file_loop_index": "{loop}"
        "encoders.{1}.record.camera_type": "{camera}"
        "encoders.{1}.record.auto_record": "{auto}"
        "encoders.{1}.record.drive_id": "{drive}"
        "encoders.{1}.record.fragmented": "{fragmented}"
        "encoders.{1}.record.timecode": "{timecode}"
        "encoders.{1}.record.sidecar": "{sidecar}"
    - path: "^/api/v1/encoders/(\\d+)/record/settings$"
      json_match: { "$.message": "^Settings retrieved" }
      json: { all: "$.settings" }
      state: { "encoders.{1}.record.settings_json": "{all}" }
    - path: "^/api/v1/encoders/(\\d+)/record/info$"
      json: &record_info_json { state: "$.settings.State", details: "$.settings.State Details", uptime: "$.settings.Uptime",
                                format: "$.settings.Format", size: "$.settings.Size", used: "$.settings.Used",
                                available: "$.settings.Available", percent: "$.settings.Percent Used", all: "$.settings" }
      state:
        "encoders.{1}.record_info.state": "{state}"
        "encoders.{1}.record_info.state_details": "{details}"
        "encoders.{1}.record_info.uptime": "{uptime}"
        "encoders.{1}.record_info.format": "{format}"
        "encoders.{1}.record_info.size": "{size}"
        "encoders.{1}.record_info.used": "{used}"
        "encoders.{1}.record_info.available": "{available}"
        "encoders.{1}.record_info.percent_used": "{percent}"
        "encoders.{1}.record_info.info_json": "{all}"
    # Recording started or stopped: its status read again, and with a body
    # (settings saved before starting) its settings too.
    - path: "^/api/v1/(encoders|decoders)/(\\d+)/record/(?:start|stop)$"
      json: {}
      then_send: [{ method: GET, path: "/api/v1/{1}/{2}/record/info" }]
    - path: "^/api/v1/(encoders|decoders)/(\\d+)/record/start$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: "/api/v1/{1}/{2}/record/settings" }]
    # A settings write read back: video, audio, metadata and recording of
    # an encoder; ingest, video, audio output, metadata and recording of a
    # decoder.
    - path: "^/api/v1/(encoders|decoders)/(\\d+)/(video|audio|metadata|record)/(settings|mode)$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: "/api/v1/{1}/{2}/{3}/{4}" }]
    # The first track's settings change the track list (2.26).
    - path: "^/api/v1/encoders/(\\d+)/audio/settings$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: "/api/v1/encoders/{1}/audio" }]

    # ── Decoder pool (2.26) ──
    - path: "^/api/v1/decoders$"
      json_match: { "$.decoders": "^\\[" }
      json_each: "$.decoders"
      json: { id: "$.id", name: "$.name", state: "$.state", uptime: "$.uptime", ingests: "$.ingests",
              restreams: "$.restreams", failover: "$.failover_timeout_ms" }
      replace: pools.decoders
      state:
        "pools.decoders.{id}.name": "{name}"
        "decoders.{id}.name": "{name}"
        "decoders.{id}.state": "{state}"
        "decoders.{id}.uptime": "{uptime}"
        "decoders.{id}.ingests": "{ingests}"
        "decoders.{id}.restreams": "{restreams}"
        "decoders.{id}.failover_timeout_ms": "{failover}"
      then_send:
        - { method: GET, path: "/api/v1/decoders/{id}/info" }
        - { method: GET, path: "/api/v1/decoders/{id}/record/info" }
        - { method: GET, path: "/api/v1/decoders/{id}/video/mode" }
        - { method: GET, path: "/api/v1/decoders/{id}/video/settings" }
        - { method: GET, path: "/api/v1/decoders/{id}/metadata/settings" }
        - { method: GET, path: "/api/v1/decoders/{id}/record/settings" }
    - path: "^/api/v1/decoders$"
      json_match: { "$.decoders": "^\\[" }
      json: { limit: "$.limit", minimum: "$.minimum" }
      state:
        limits.decoders: "{limit}"
        limits.decoders_minimum: "{minimum}"
    - path: "^/api/v1/decoders$"
      json_each: "$.decoders[*].restreams"
      json: { sid: "$" }
      then_send:
        - { method: GET, path: "/api/v1/streams/{sid}" }
        - { method: GET, path: "/api/v1/streams/{sid}/settings" }
        - { method: GET, path: "/api/v1/streams/{sid}/info" }
    # The physical audio output, shared by all decoders, read through the
    # first decoder listed.
    - path: "^/api/v1/decoders$"
      json_match: { "$.decoders[0].id": "^(\\d+)$" }
      json: {}
      then_send:
        - { method: GET, path: "/api/v1/decoders/{1}/audio/settings" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/0" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/1" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/2" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/3" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/4" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/5" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/6" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/7" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/8" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/9" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/10" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/11" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/12" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/13" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/14" }
        - { method: GET, path: "/api/v1/decoders/{1}/audio/15" }

    # ── One decoder ──
    - path: "^/api/v1/decoders/(\\d+)$"
      json: { name: "$.settings.name", failover: "$.settings.failover_timeout_ms", ingests: "$.settings.ingests",
              restreams: "$.settings.restreams", state: "$.info.State", uptime: "$.info.Uptime", started: "$.info.StartedAt" }
      state:
        "decoders.{1}.name": "{name}"
        "decoders.{1}.failover_timeout_ms": "{failover}"
        "decoders.{1}.ingests": "{ingests}"
        "decoders.{1}.restreams": "{restreams}"
        "decoders.{1}.state": "{state}"
        "decoders.{1}.uptime": "{uptime}"
        "decoders.{1}.started_at": "{started}"
    - path: "^/api/v1/decoders/(\\d+)/info$"
      json: { format: "$.settings.Format", status: "$.settings.Status", state: "$.settings.State",
              uptime: "$.settings.Uptime", started: "$.settings.StartedAt" }
      state:
        "decoders.{1}.info.format": "{format}"
        "decoders.{1}.info.status": "{status}"
        "decoders.{1}.state": "{state}"
        "decoders.{1}.uptime": "{uptime}"
        "decoders.{1}.started_at": "{started}"
    - path: "^/api/v1/decoders/(\\d+)/video/mode$"
      json: { mode: "$.settings.mode", name: "$.settings.name", target: "$.settings.jitter-buffer-target-delay",
              max: "$.settings.jitter-buffer-max-delay", restreamed: "$.settings.restreamed" }
      state:
        "decoders.{1}.ingest.mode": "{mode}"
        "decoders.{1}.ingest.name": "{name}"
        "decoders.{1}.ingest.jitter_target_ms": "{target}"
        "decoders.{1}.ingest.jitter_max_ms": "{max}"
        "decoders.{1}.ingest.restreamed": "{restreamed}"
    # A new ingest mode has its own settings: read them too.
    - path: "^/api/v1/decoders/(\\d+)/video/mode$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: "/api/v1/decoders/{1}/video/settings" }]
    - path: "^/api/v1/decoders/(\\d+)/video/settings$"
      json_match: { "$.message": "^Settings retrieved" }
      json: { all: "$.settings" }
      state: { "decoders.{1}.video.settings_json": "{all}" }
    - path: "^/api/v1/decoders/\\d+/audio/settings$"
      json: { enable: "$.settings.enable", channels: "$.settings.channel_mode", map: "$.settings.default-channel-map",
              delay: "$.settings.delay", mute: "$.settings.embedded-output-mute", volume: "$.settings.embedded-output-volume",
              remapping: "$.settings.remapping", selected: "$.settings.selected" }
      state:
        audio_output.enable: "{enable}"
        audio_output.channel_mode: "{channels}"
        audio_output.channel_map: "{map}"
        audio_output.delay: "{delay}"
        audio_output.embedded_mute: "{mute}"
        audio_output.embedded_volume: "{volume}"
        audio_output.remapping: "{remapping}"
        audio_output.selected: "{selected}"
    - path: "^/api/v1/decoders/\\d+/audio/settings$"
      json_match: { "$.message": "^Settings retrieved" }
      json: { all: "$.settings" }
      state: { audio_output.settings_json: "{all}" }
    - path: "^/api/v1/decoders/\\d+/audio/(\\d+)$"
      json: { mute: "$.settings.mute", track: "$.settings.track", volume: "$.settings.volume" }
      state:
        "audio_output.channels.{1}.mute": "{mute}"
        "audio_output.channels.{1}.track": "{track}"
        "audio_output.channels.{1}.volume": "{volume}"
    - path: "^/api/v1/decoders/(\\d+)/audio/(\\d+)$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: "/api/v1/decoders/{1}/audio/{2}" }]
    - path: "^/api/v1/decoders/(\\d+)/metadata/settings$"
      json: { cc: "$.settings.insert_cc", cc_line: "$.settings.cc_insertion_line", dpi: "$.settings.insert_dpi",
              dpi_line: "$.settings.dpi_insertion_line", timecode: "$.settings.insert_timecode" }
      state:
        "decoders.{1}.metadata.insert_cc": "{cc}"
        "decoders.{1}.metadata.cc_insertion_line": "{cc_line}"
        "decoders.{1}.metadata.insert_dpi": "{dpi}"
        "decoders.{1}.metadata.dpi_insertion_line": "{dpi_line}"
        "decoders.{1}.metadata.insert_timecode": "{timecode}"
    - path: "^/api/v1/decoders/(\\d+)/record/settings$"
      json: *record_json
      state:
        "decoders.{1}.record.mode": "{mode}"
        "decoders.{1}.record.audio_track_selection": "{selection}"
        "decoders.{1}.record.audio_tracks": "{tracks}"
        "decoders.{1}.record.name": "{name}"
        "decoders.{1}.record.format": "{format}"
        "decoders.{1}.record.max_files": "{files}"
        "decoders.{1}.record.max_size_time": "{size_time}"
        "decoders.{1}.record.bonded_uploads": "{bonded}"
        "decoders.{1}.record.cyclic": "{cyclic}"
        "decoders.{1}.record.file_loop_index": "{loop}"
        "decoders.{1}.record.camera_type": "{camera}"
        "decoders.{1}.record.auto_record": "{auto}"
        "decoders.{1}.record.drive_id": "{drive}"
        "decoders.{1}.record.fragmented": "{fragmented}"
        "decoders.{1}.record.timecode": "{timecode}"
        "decoders.{1}.record.sidecar": "{sidecar}"
    - path: "^/api/v1/decoders/(\\d+)/record/settings$"
      json_match: { "$.message": "^Settings retrieved" }
      json: { all: "$.settings" }
      state: { "decoders.{1}.record.settings_json": "{all}" }
    - path: "^/api/v1/decoders/(\\d+)/record/info$"
      json: *record_info_json
      state:
        "decoders.{1}.record_info.state": "{state}"
        "decoders.{1}.record_info.state_details": "{details}"
        "decoders.{1}.record_info.uptime": "{uptime}"
        "decoders.{1}.record_info.format": "{format}"
        "decoders.{1}.record_info.size": "{size}"
        "decoders.{1}.record_info.used": "{used}"
        "decoders.{1}.record_info.available": "{available}"
        "decoders.{1}.record_info.percent_used": "{percent}"
        "decoders.{1}.record_info.info_json": "{all}"

    # ── Stream pool (2.26) ──
    - path: "^/api/v1/streams$"
      json_match: { "$.streams": "^\\[" }
      json_each: "$.streams"
      json: { id: "$.id", name: "$.name", mode: "$.mode", state: "$.state", owner: "$.owner" }
      replace: pools.streams
      state:
        "pools.streams.{id}.name": "{name}"
        "streams.{id}.name": "{name}"
        "streams.{id}.mode": "{mode}"
        "streams.{id}.state": "{state}"
        "streams.{id}.owner": "{owner}"
    - path: "^/api/v1/streams$"
      json_match: { "$.streams": "^\\[" }
      json: { limit: "$.limit", minimum: "$.minimum", protected: "$.protected" }
      state:
        limits.streams: "{limit}"
        limits.streams_minimum: "{minimum}"
        limits.streams_protected: "{protected}"
    # The pipeline owning the first listed stream (the base stream 0, the
    # main encoder on most units): its status and recording on the fast poll.
    - path: "^/api/v1/streams$"
      json_match: { "$.streams[0].owner": "^(encoders|decoders)/(\\d+)$" }
      json: {}
      then_send:
        - { method: GET, path: "/api/v1/{1}/{2}/info" }
        - { method: GET, path: "/api/v1/{1}/{2}/record/info" }

    # ── One stream ──
    - path: "^/api/v1/streams/(\\d+)$"
      json: { name: "$.settings.name", mode: "$.settings.mode", h264: "$.settings.mode-h264", hevc: "$.settings.mode-hevc",
              selection: "$.settings.audio_track_selection", tracks: "$.settings.audio_tracks", owner: "$.settings.owner" }
      state:
        "streams.{1}.name": "{name}"
        "streams.{1}.mode": "{mode}"
        "streams.{1}.mode_h264": "{h264}"
        "streams.{1}.mode_hevc": "{hevc}"
        "streams.{1}.audio_track_selection": "{selection}"
        "streams.{1}.audio_tracks": "{tracks}"
        "streams.{1}.owner": "{owner}"
    # A configuration write (possibly a new mode): configuration, mode
    # settings and pool read again.
    - path: "^/api/v1/streams/(\\d+)$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send:
        - { method: GET, path: "/api/v1/streams/{1}" }
        - { method: GET, path: "/api/v1/streams/{1}/settings" }
        - { method: GET, path: /api/v1/streams }
    - path: "^/api/v1/streams/(\\d+)/settings$"
      json_match: { "$.message": "^Settings retrieved" }
      json: { all: "$.settings" }
      state: { "streams.{1}.settings_json": "{all}" }
    - path: "^/api/v1/streams/(\\d+)/settings$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: "/api/v1/streams/{1}/settings" }]
    - path: "^/api/v1/streams/(\\d+)/info$"
      json: { state: "$.settings.State", details: "$.settings.State Details", uptime: "$.settings.Uptime",
              url: "$.settings.Stream", port: "$.settings.Port", latency: "$.settings.Latency",
              encryption: "$.settings.Encryption", all: "$.settings" }
      state:
        "streams.{1}.state": "{state}"
        "streams.{1}.info.state_details": "{details}"
        "streams.{1}.info.uptime": "{uptime}"
        "streams.{1}.info.url": "{url}"
        "streams.{1}.info.port": "{port}"
        "streams.{1}.info.latency": "{latency}"
        "streams.{1}.info.encryption": "{encryption}"
        "streams.{1}.info.info_json": "{all}"
    # A stream action: its status and the pool read again.
    - path: "^/api/v1/streams/(\\d+)/(?:start|stop|preview|endpreview|complete|publish|unpublish|broadcast|halt|cancel)$"
      json: {}
      then_send:
        - { method: GET, path: "/api/v1/streams/{1}/info" }
        - { method: GET, path: /api/v1/streams }
    - path: "^/api/v1/streams/\\d+/(?:start_all|stop_all)$"
      json: {}
      then_send: [{ method: GET, path: /api/v1/streams }]

    # ── Network ──
    - path: "^/api/v1/network/wired/(\\d+)$"
      json: { label: "$.settings.Custom Labels.intf_name", status: "$.settings.Status", detail: "$.settings.Detail",
              mac: "$.settings.MAC Address", all: "$.settings" }
      state:
        "network.wired.{1}.label": "{label}"
        "network.wired.{1}.status": "{status}"
        "network.wired.{1}.detail": "{detail}"
        "network.wired.{1}.mac_address": "{mac}"
        "network.wired.{1}.status_json": "{all}"
    - path: "^/api/v1/network/wifi$"
      json: { label: "$.settings.Custom Labels.intf_name", status: "$.settings.Status", network: "$.settings.Network",
              mask: "$.settings.Subnet Mask", mac: "$.settings.MAC Address", ip: "$.settings.IP Address" }
      state:
        network.wifi.label: "{label}"
        network.wifi.status: "{status}"
        network.wifi.network: "{network}"
        network.wifi.subnet_mask: "{mask}"
        network.wifi.mac_address: "{mac}"
        network.wifi.ip_address: "{ip}"
    - path: "^/api/v1/network/wifi$"
      json_match: { "$.message": "^Statuses received" }
      json: { all: "$.settings" }
      state: { network.wifi.settings_json: "{all}" }
    - path: "^/api/v1/network/wifi$"
      request_match: { "$": "^\\{" }
      json: {}
      then_send: [{ method: GET, path: /api/v1/network/wifi }]
    - path: "^/api/v1/network/modem/(\\d+)$"
      json: { type: "$.settings.Modem Type", model: "$.settings.Model", version: "$.settings.Version",
              status: "$.settings.Status", detail: "$.settings.Detail", report: "$.settings.Modem Report",
              rssi: "$.settings.RSSI", imei: "$.settings.IMEI", imsi: "$.settings.IMSI", iccid: "$.settings.ICCID",
              label: "$.settings.Custom Labels.intf_name", all: "$.settings" }
      state:
        "network.modems.{1}.type": "{type}"
        "network.modems.{1}.model": "{model}"
        "network.modems.{1}.version": "{version}"
        "network.modems.{1}.status": "{status}"
        "network.modems.{1}.detail": "{detail}"
        "network.modems.{1}.report": "{report}"
        "network.modems.{1}.rssi": "{rssi}"
        "network.modems.{1}.imei": "{imei}"
        "network.modems.{1}.imsi": "{imsi}"
        "network.modems.{1}.iccid": "{iccid}"
        "network.modems.{1}.label": "{label}"
        "network.modems.{1}.status_json": "{all}"

    # ── Settings sync ──
    # Imported settings change the pipelines and streams: read them again.
    - path: "^/api/v1/settings/sync/import$"
      json: {}
      then_send:
        - { method: GET, path: /api/v1/encoders }
        - { method: GET, path: /api/v1/decoders }
        - { method: GET, path: /api/v1/streams }

