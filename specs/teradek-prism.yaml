spec: 1
id: teradek-prism
name: Teradek Prism encoders and decoders (REST API v1)
vendor: Teradek
category: other

source:
  - title: Teradek Developer Docs, REST API v1, Getting Started
    author: Teradek
    url: https://teradekdev.com/docs/getting-started
    note: >
      Manufacturer document, retrieved 2026-10-23. Base URL https://<device>/api/v1,
      Apollo OS 2.25 or later (devices with more than one encoder or decoder, and the
      endpoints listing, adding and deleting them, need 2.26), the password grant
      example, the response envelope (settings, timestamp, message, status ok or
      error), and endpoint discovery: GET /api/v1 needs no token. The site's home page
      (https://teradekdev.com/) names the supported products (Prism Jetpack, Prism
      Flex, Prism Mobile, Prism Rack Unit), the 60 requests per 60 seconds limit and
      the streaming protocols.
  - title: Teradek Developer Docs, REST API v1, Authentication
    author: Teradek
    url: https://teradekdev.com/docs/authentication
    note: >
      Manufacturer document, retrieved 2026-10-23. OAuth 2.0 password grant (RFC
      6749) on POST /oauth/token with grant_type and the device admin password, the
      refresh grant, Authorization Bearer, token lifetimes (access 1 hour, refresh 1
      week, all invalidated by a password change), rate limits (API 60 and OAuth 30
      requests per 60 seconds, X-RateLimit-Limit/Remaining/Reset headers) and the
      HTTP status codes (400, 401, 404, 405, 411, 429, 500, 504).
  - title: Teradek Developer Docs, REST API v1, API Reference (Firmware 2.26 tab)
    author: Teradek
    url: https://teradekdev.com/docs/api-reference
    note: >
      Manufacturer document, retrieved 2026-10-23, the source of every endpoint here:
      Response Format, Request Bodies, Query Parameters (?settings= and
      ?command=description), Pipeline, Stream and Track IDs, Changes in 2.26, System
      (Device Info, Firmware), Inputs, Encoders (Pipelines, Encoder Info, Video, Audio,
      Metadata, Recording, Snapshot), Decoders (the same), Streams (Stream Pool,
      Configuration, Status, Control), Network (Wired, WiFi, Modem) and Settings Sync
      (Import, Push).
  - title: Teradek Developer Docs, REST API v1, API Reference (Firmware 2.25 tab)
    author: Teradek
    url: https://teradekdev.com/docs/api-reference/2.25
    note: >
      Manufacturer document, retrieved 2026-10-23: the same paths with encoder 0,
      decoder 0 and streams 0 to 4, the per-codec stream modes mode-h264 and
      mode-hevc, the encoder's audio enable flag, and example replies for stream
      settings and status in TS mode.
  - title: Teradek Developer Docs, TypeScript SDK
    author: Teradek
    url: https://teradekdev.com/docs/sdk
    note: >
      Manufacturer document, retrieved 2026-10-23: rejectUnauthorized false for the
      device's self-signed certificate, which resources take ?settings= and
      ?command=description (encoder audio among them), and the error classes.
  - title: "@teradek/sdk 0.3.0 (npm, MIT License, Teradek LLC)"
    author: Teradek
    url: https://www.npmjs.com/package/@teradek/sdk
    note: >
      Teradek's own MIT-licensed client (repository bitbucket.org/teradek/tdk-dev-sdk-js),
      read to corroborate request shapes only: the token requests are form-encoded
      with no Authorization header; JSON bodies are sent bare (without the settings
      wrapper); start_all and stop_all are sent on stream 0; the encoder snapshot is
      a GET and the decoder snapshot a POST, both read as raw bytes.

transport:
  type: http
  port: 443
  scheme: https
  # The device serves HTTPS with its own certificate (the SDK's
  # rejectUnauthorized: false).
  accept_invalid_certs: true
  auth: bearer
  # A 401 fails only the request it answers: the token setting is renewed by
  # the get_access_token and refresh_access_token commands, which must stay
  # usable when the token has expired (see quirks).
  refusal_status: []
  # The device answers 504 itself when a write is not confirmed in time.
  timeout_ms: 10000
  # 60 requests per 60 seconds (Authentication, Rate Limiting).
  pacing: { min_interval_ms: 1000 }
  # GET /api/v1 needs no token (Getting Started, Endpoint Discovery).
  probe: { method: GET, path: /api/v1 }
  endpoints:
    # The token endpoint, without the bearer token (the SDK sends none).
    oauth: { port: 443, auth: none }

settings:
  token:
    type: string
    secret: true
    max_length: 4096
    label: Access token
    description: "The OAuth access token sent as Authorization Bearer, from get_access_token or refresh_access_token; it lasts one hour, so the consumer renews it and passes the new one with update_settings."

ports:
  - { port: 443, protocol: https, role: control, note: "the REST API under /api/v1 and the token endpoint /oauth/token" }

models:
  - id: prism-jetpack
    name: Teradek Prism Jetpack
    supports: &all
      [get_access_token, refresh_access_token, get_api_root,
       get_system_info, check_firmware, get_firmware_settings, describe_firmware_settings,
       set_firmware_settings, set_firmware_auto_check, upgrade_firmware,
       list_inputs,
       list_encoders, add_encoder, get_capacity, get_encoder, set_encoder, set_encoder_name,
       set_encoder_physical_input, set_encoder_network_input, set_encoder_audio_source,
       delete_encoder, restart_encoder, list_encoder_streams, get_encoder_info,
       get_encoder_video_settings, describe_encoder_video_settings, set_encoder_video_settings,
       set_encoder_codec, set_encoder_bitrate, set_encoder_gop_length,
       list_encoder_audio_tracks, get_encoder_audio_settings, describe_encoder_audio_settings,
       set_encoder_audio_settings, set_encoder_audio_enabled, get_encoder_audio_track,
       describe_encoder_audio_track, set_encoder_audio_track, set_encoder_audio_track_muted,
       get_encoder_metadata_settings, describe_encoder_metadata_settings,
       set_encoder_metadata_settings, set_encoder_closed_captions, insert_scte_marker,
       insert_scte_marker_with, get_encoder_record_settings, describe_encoder_record_settings,
       set_encoder_record_settings, get_encoder_record_info, start_encoder_recording,
       start_encoder_recording_with, stop_encoder_recording, set_encoder_snapshot_settings, save_encoder_snapshot,
       list_decoders, add_decoder, get_decoder, set_decoder, set_decoder_name,
       set_decoder_failover_timeout, delete_decoder, restart_decoder, list_decoder_streams,
       get_decoder_info, get_decoder_ingest, set_decoder_ingest, set_decoder_ingest_mode,
       set_decoder_jitter_buffer, get_decoder_video_settings, describe_decoder_video_settings,
       set_decoder_video_settings, get_audio_output, describe_audio_output, set_audio_output,
       set_audio_output_enabled, get_audio_output_channel, describe_audio_output_channel,
       set_audio_output_channel, set_audio_output_channel_muted,
       get_decoder_metadata_settings, describe_decoder_metadata_settings,
       set_decoder_metadata_settings, get_decoder_record_settings,
       describe_decoder_record_settings, set_decoder_record_settings, get_decoder_record_info,
       start_decoder_recording, stop_decoder_recording, set_decoder_snapshot_settings, save_decoder_snapshot,
       list_streams, add_stream, delete_stream, get_stream, set_stream, set_stream_name,
       set_stream_mode, set_stream_codec_modes, get_stream_settings, describe_stream_settings,
       set_stream_settings, get_stream_info, start_stream, stop_stream, start_all_streams,
       stop_all_streams, start_preview, end_preview, complete_stream, publish_stream,
       unpublish_stream, broadcast_stream, halt_stream, cancel_stream,
       get_wired, get_wifi, describe_wifi, set_wifi, get_modem,
       import_settings, push_settings, push_settings_to]
    verification: none
    notes: >
      Mobile encoder with an integrated monitor (teradekdev.com, Supported Products).
  - id: prism-flex
    name: Teradek Prism Flex
    supports: *all
    verification: none
    notes: >
      4K HDR encoder for multi-camera production (teradekdev.com, Supported Products).
  - id: prism-mobile
    name: Teradek Prism Mobile
    supports: *all
    verification: none
    notes: >
      5G cellular bonding encoder (teradekdev.com, Supported Products); its modems
      are read with get_modem.
  - id: prism-ru
    name: Teradek Prism Rack Unit
    supports: *all
    verification: none
    notes: >
      Rackmount encoder for permanent installation (teradekdev.com, Supported
      Products).

commands:
  # ── Authentication (Authentication) ───────────────────────────────────
  get_access_token:
    summary: "Sign in with the device admin password (OAuth 2.0 password grant, POST /oauth/token); returns the token answer {access_token, refresh_token, expires_in, token_type}, whose access_token goes into the token setting"
    params:
      password: { type: string, required: true, secret: true, max_length: 256,
                  label: Admin password,
                  description: "The device's admin password, as set in its web UI; it is sent once, to the device's own token endpoint." }
    send: { endpoint: oauth, method: POST, path: /oauth/token, body: "grant_type=password&password={password:url}",
            content_type: application/x-www-form-urlencoded }
    expect: { status: 200, json_path: "$" }
    returns: value
  refresh_access_token:
    summary: "Get a new access token with the refresh token (OAuth 2.0 refresh grant, POST /oauth/token); returns the token answer, whose access_token goes into the token setting"
    params:
      refresh_token: { type: string, required: true, secret: true, max_length: 4096,
                       label: Refresh token,
                       description: "The refresh_token from the last token answer; it lasts one week and is invalidated when the device password changes." }
    send: { endpoint: oauth, method: POST, path: /oauth/token, body: "grant_type=refresh_token&refresh_token={refresh_token:url}",
            content_type: application/x-www-form-urlencoded }
    expect: { status: 200, json_path: "$" }
    returns: value
  get_api_root:
    summary: "The API's top-level collections (GET /api/v1, no token needed); returns the endpoints array"
    send: { method: GET, path: /api/v1 }
    expect: { status: 200, json_path: "$.endpoints" }
    returns: value

  # ── System (System: Device Info, Firmware) ────────────────────────────
  get_system_info:
    summary: "Device model, serial number and firmware version (GET /api/v1/system/info)"
    send: { method: GET, path: /api/v1/system/info }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  check_firmware:
    summary: "Check for a firmware update; returns the latest firmware the device knows of and keeps it, with the message, in state (GET /api/v1/system/firmware/check)"
    send: { method: GET, path: /api/v1/system/firmware/check }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  get_firmware_settings:
    summary: "Firmware settings: auto_check (GET /api/v1/system/firmware/settings)"
    send: { method: GET, path: /api/v1/system/firmware/settings }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  describe_firmware_settings:
    summary: "Each firmware setting's type, default and allowed values (GET /api/v1/system/firmware/settings?command=description)"
    send: { method: GET, path: /api/v1/system/firmware/settings, query: { command: description } }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  set_firmware_settings:
    summary: "Set firmware settings; values is an object of the keys GET /api/v1/system/firmware/settings returns, as described by describe_firmware_settings (PUT /api/v1/system/firmware/settings)"
    params:
      values: &values { type: json, required: true,
                        label: Settings,
                        description: "A JSON object of the keys to change and their new values, named as the matching GET returns them; the device checks every value and rejects unknown keys." }
    send: { method: PUT, path: /api/v1/system/firmware/settings, body: '{"settings":{values}}', content_type: application/json }
    expect: &ok { status: 200, json_equals: { "$.status": "ok" } }
    returns: ack
  set_firmware_auto_check:
    summary: "Turn the automatic firmware update check on or off (PUT /api/v1/system/firmware/settings auto_check)"
    params:
      enabled: { type: bool, required: true,
                 label: Check automatically,
                 description: "True lets the device check for firmware updates by itself; false stops it." }
    send: { method: PUT, path: /api/v1/system/firmware/settings, body: '{"settings":{"auto_check":{enabled}}}', content_type: application/json }
    expect: *ok
    returns: ack
  upgrade_firmware:
    summary: "Start a firmware upgrade (POST /api/v1/system/firmware/upgrade)"
    send: { method: POST, path: /api/v1/system/firmware/upgrade }
    expect: *ok
    returns: ack

  # ── Inputs (Inputs, 2.26) ─────────────────────────────────────────────
  list_inputs:
    summary: "The video inputs with their current signal, and the audio inputs, for an encoder's physical_input and audio_source (GET /api/v1/inputs, 2.26)"
    send: { method: GET, path: /api/v1/inputs }
    expect: { status: 200, json_path: "$" }
    returns: value

  # ── Encoder pipelines (Encoders: Pipelines) ───────────────────────────
  list_encoders:
    summary: "Every encoder with its state, input, stream ids and audio track ids, and the device's encoder limit and minimum (GET /api/v1/encoders, 2.26)"
    send: { method: GET, path: /api/v1/encoders }
    expect: { status: 200, json_path: "$" }
    returns: value
  add_encoder:
    summary: "Add an encoder; returns its new id (POST /api/v1/encoders, 2.26)"
    send: { method: POST, path: /api/v1/encoders }
    expect: { status: 200, json_equals: { "$.status": "ok" }, json_path: "$.id" }
    returns: value
  get_capacity:
    summary: "Encode and decode capacity: budget, use and percent of each, which one limits, the last refusal and the physical inputs in use (GET /api/v1/encoders/capacity, 2.26)"
    send: { method: GET, path: /api/v1/encoders/capacity }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  get_encoder:
    summary: "One encoder: name, input, audio source, stream and audio track ids, state and uptime (GET /api/v1/encoders/{id}, 2.26)"
    params:
      encoder: &encoder { type: int, min: 0, required: true,
                          label: Encoder,
                          description: "The encoder pipeline's id, from list_encoders (pools.encoders); ids can have gaps, and firmware 2.25 has encoder 0 only." }
    send: { method: GET, path: "/api/v1/encoders/{encoder}" }
    expect: { status: 200, json_path: "$" }
    returns: value
  set_encoder:
    summary: "Change an encoder's name, input or audio source; values takes only name, input_type, physical_input, network_input and audio_source (PUT /api/v1/encoders/{id}, 2.26)"
    params:
      encoder: *encoder
      values: { type: json, required: true,
                label: Encoder settings,
                description: "A JSON object of name, input_type, physical_input, network_input and audio_source, as GET /api/v1/encoders/{id} returns them; the input ids come from list_inputs." }
    send: { method: PUT, path: "/api/v1/encoders/{encoder}", body: '{"settings":{values}}', content_type: application/json }
    expect: *ok
    returns: ack
  set_encoder_name:
    summary: "Rename an encoder (PUT /api/v1/encoders/{id} name, 2.26)"
    params:
      encoder: *encoder
      name: &name { type: string, required: true, max_length: 128,
                    label: Name,
                    description: "The display name shown in the web UI and in the lists." }
    send: { method: PUT, path: "/api/v1/encoders/{encoder}", body: '{"settings":{"name":{name:json}}}', content_type: application/json }
    expect: *ok
    returns: ack
  set_encoder_physical_input:
    summary: "Encode a physical video input (PUT /api/v1/encoders/{id} input_type physical and physical_input, 2.26); encoding restarts"
    params:
      encoder: *encoder
      input: { type: string, required: true, max_length: 64, pattern: "^[A-Za-z0-9_-]+$",
               label: Video input,
               description: "The video input's id from list_inputs, such as sdi0 or hdmi0." }
    send: { method: PUT, path: "/api/v1/encoders/{encoder}", body: '{"settings":{"input_type":"physical","physical_input":{input:json}}}',
            content_type: application/json }
    expect: *ok
    returns: ack
  set_encoder_network_input:
    summary: "Encode a network input, named as the device names it, such as Input/Stream/1 (PUT /api/v1/encoders/{id} input_type network and network_input, 2.26); encoding restarts"
    params:
      encoder: *encoder
      input: { type: string, required: true, max_length: 128,
               label: Network input,
               description: "The device's internal name of the network input, as an encoder's network_input reads, such as Input/Stream/1." }
    send: { method: PUT, path: "/api/v1/encoders/{encoder}", body: '{"settings":{"input_type":"network","network_input":{input:json}}}',
            content_type: application/json }
    expect: *ok
    returns: ack
  set_encoder_audio_source:
    summary: "Choose an encoder's audio input (PUT /api/v1/encoders/{id} audio_source, 2.26)"
    params:
      encoder: *encoder
      source: { type: string, required: true, max_length: 64, pattern: "^[A-Za-z0-9_-]+$",
                label: Audio input,
                description: "The audio input's id from list_inputs, such as embedded, analog or usb." }
    send: { method: PUT, path: "/api/v1/encoders/{encoder}", body: '{"settings":{"audio_source":{source:json}}}', content_type: application/json }
    expect: *ok
    returns: ack
  delete_encoder:
    summary: "Delete an encoder (DELETE /api/v1/encoders/{id}, 2.26); the last one, a protected one, or one at the device's minimum cannot be deleted"
    params: { encoder: *encoder }
    send: { method: DELETE, path: "/api/v1/encoders/{encoder}" }
    expect: *ok
    returns: ack
  restart_encoder:
    summary: "Restart a running encoder (POST /api/v1/encoders/{id}/restart, 2.26)"
    params: { encoder: *encoder }
    send: { method: POST, path: "/api/v1/encoders/{encoder}/restart" }
    expect: *ok
    returns: ack
  list_encoder_streams:
    summary: "The streams an encoder owns, in display order, with their mode and state (GET /api/v1/encoders/{id}/streams, 2.26)"
    params: { encoder: *encoder }
    send: { method: GET, path: "/api/v1/encoders/{encoder}/streams" }
    expect: { status: 200, json_path: "$.streams" }
    returns: value
  get_encoder_info:
    summary: "Encoder status: video format, actual and target bitrate, generator, and the pipeline's state, uptime and start time (GET /api/v1/encoders/{id}/info)"
    params: { encoder: *encoder }
    send: { method: GET, path: "/api/v1/encoders/{encoder}/info" }
    expect: { status: 200, json_path: "$.settings" }
    returns: value

  # ── Encoder video (Encoders: Video) ───────────────────────────────────
  get_encoder_video_settings:
    summary: "Encoding, scaling and color settings (GET /api/v1/encoders/{id}/video/settings)"
    params: { encoder: *encoder }
    send: { method: GET, path: "/api/v1/encoders/{encoder}/video/settings" }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  describe_encoder_video_settings:
    summary: "Each video setting's label, default, type, choices and their display names, range and help (GET /api/v1/encoders/{id}/video/settings?command=description)"
    params: { encoder: *encoder }
    send: { method: GET, path: "/api/v1/encoders/{encoder}/video/settings", query: { command: description } }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  set_encoder_video_settings:
    summary: "Set video settings; values is an object of the keys GET /api/v1/encoders/{id}/video/settings returns, as describe_encoder_video_settings describes them (PUT /api/v1/encoders/{id}/video/settings)"
    params: { encoder: *encoder, values: *values }
    send: { method: PUT, path: "/api/v1/encoders/{encoder}/video/settings", body: '{"settings":{values}}', content_type: application/json }
    expect: *ok
    returns: ack
  set_encoder_codec:
    summary: "Encode H.264 or HEVC (PUT /api/v1/encoders/{id}/video/settings codec)"
    params:
      encoder: *encoder
      codec: { type: enum, values: [h264, hevc], required: true,
               label: Codec,
               description: "h264 for H.264 (AVC), hevc for HEVC (H.265)." }
    send: { method: PUT, path: "/api/v1/encoders/{encoder}/video/settings", body: '{"settings":{"codec":"{codec}"}}', content_type: application/json }
    expect: *ok
    returns: ack
  set_encoder_bitrate:
    summary: "Set the video bitrate in kbps (PUT /api/v1/encoders/{id}/video/settings bitrate_list)"
    params:
      encoder: *encoder
      kbps: { type: int, min: 100, max: 80000, required: true,
              label: Video bitrate,
              description: "The video bitrate in kilobits per second, 100 to 80000 as the device describes it; the device may allow less for some modes." }
    send: { method: PUT, path: "/api/v1/encoders/{encoder}/video/settings", body: '{"settings":{"bitrate_list":{kbps}}}', content_type: application/json }
    expect: *ok
    returns: ack
  set_encoder_gop_length:
    summary: "Set the GOP length in frames, including the I picture (PUT /api/v1/encoders/{id}/video/settings gop_length)"
    params:
      encoder: *encoder
      frames: { type: int, min: 0, max: 1000, required: true,
                label: GOP length,
                description: "Frames from one I picture to the next, including it; the device's default is 30." }
    send: { method: PUT, path: "/api/v1/encoders/{encoder}/video/settings", body: '{"settings":{"gop_length":{frames}}}', content_type: application/json }
    expect: *ok
    returns: ack

  # ── Encoder audio (Encoders: Audio) ───────────────────────────────────
  list_encoder_audio_tracks:
    summary: "The audio tracks attached to an encoder (up to 8) with codec, channels, bitrate, sample rate and mute (GET /api/v1/encoders/{id}/audio, 2.26)"
    params: { encoder: *encoder }
    send: { method: GET, path: "/api/v1/encoders/{encoder}/audio" }
    expect: { status: 200, json_path: "$.tracks" }
    returns: value
  get_encoder_audio_settings:
    summary: "The first audio track's settings (GET /api/v1/encoders/{id}/audio/settings)"
    params: { encoder: *encoder }
    send: { method: GET, path: "/api/v1/encoders/{encoder}/audio/settings" }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  describe_encoder_audio_settings:
    summary: "Each audio setting's type, default and allowed values (GET /api/v1/encoders/{id}/audio/settings?command=description)"
    params: { encoder: *encoder }
    send: { method: GET, path: "/api/v1/encoders/{encoder}/audio/settings", query: { command: description } }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  set_encoder_audio_settings:
    summary: "Set the first audio track's settings; values is an object of the keys GET /api/v1/encoders/{id}/audio/settings returns (PUT /api/v1/encoders/{id}/audio/settings)"
    params: { encoder: *encoder, values: *values }
    send: { method: PUT, path: "/api/v1/encoders/{encoder}/audio/settings", body: '{"settings":{values}}', content_type: application/json }
    expect: *ok
    returns: ack
  set_encoder_audio_enabled:
    summary: "Turn the first audio track on or off (PUT /api/v1/encoders/{id}/audio/settings enable; on 2.26 the opposite of mute_track)"
    params:
      encoder: *encoder
      enabled: { type: bool, required: true,
                 label: Audio on,
                 description: "True sends the first audio track's audio; false mutes it." }
    send: { method: PUT, path: "/api/v1/encoders/{encoder}/audio/settings", body: '{"settings":{"enable":{enabled}}}', content_type: application/json }
    expect: *ok
    returns: ack
  get_encoder_audio_track:
    summary: "One audio track's settings (GET /api/v1/encoders/{id}/audio/{tid}/settings, 2.26)"
    params:
      encoder: *encoder
      track: &track { type: int, min: 0, required: true,
                      label: Audio track,
                      description: "The audio track's id, from list_encoder_audio_tracks; the track must be attached to this encoder." }
    send: { method: GET, path: "/api/v1/encoders/{encoder}/audio/{track}/settings" }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  describe_encoder_audio_track:
    summary: "Each of an audio track's settings described (GET /api/v1/encoders/{id}/audio/{tid}/settings?command=description, 2.26)"
    params: { encoder: *encoder, track: *track }
    send: { method: GET, path: "/api/v1/encoders/{encoder}/audio/{track}/settings", query: { command: description } }
    expect: { status: 200, json_path: "$.settings" }
    returns: value
  set_encoder_audio_track:
    summary: "Set one audio track's settings; values is an object of the keys its GET returns (PUT /api/v1/encoders/{id}/audio/{tid}/settings, 2.26)"
    params: { encoder: *encoder, track: *track, values: *values }
    send: { method: PUT, path: "/api/v1/encoders/{encoder}/audio/{track}/settings", body: '{"settings":{values}}', content_type: application/json }
    expect: *ok
    returns: ack
  set_encoder_audio_track_muted:
