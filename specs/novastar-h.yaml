quirks:
  - models: [all]
    severity: warning
    text: >
      Requests are sent unencrypted, signed with Base64(md5(timeStamp + pId)).
      Turn encryption off for the requestor under Settings > OpenAPI
      Management; with encryption on, the splicer expects a DES-encrypted body,
      which the core does not send. The p_id setting is the requestor ID made
      there.

  - models: [all]
    severity: warning
    text: >
      The splicer checks the request time (error 11, incorrect device time):
      the computer running the core and the splicer must agree on the time.
      The time sent is the core's clock when the device was opened plus the
      time since.

  - models: [all]
    severity: info
    text: >
      A reply with status other than 0 fails the command with that code and
      the reply's msg (the error code page lists them: 18 incorrect signature,
      404 screen does not exist, 410 brightness cannot be set, 412 OSD limit,
      912 initialising ...). A successful command returns the reply's body.

  - models: [all]
    severity: info
    text: >
      deviceId is 0 in every example except the screen brightness pages, which
      say to pass 1; device_id defaults to 0. set_screen_brightness and
      save_screen_brightness work only with the H_16xRJ45+2xfiber, H_20xRJ45
      and H_4xfiber (and enhanced) sending cards.

  - models: [all]
    severity: info
    text: >
      State is polled (poll_ms, 5 s by default): the initialisation status,
      the device's details (health: temperature, fans, power supplies, card
      slots, control cards, genlock; device/readDetail), the screen list, inputs, outputs, background images and signal source
      playlists, and for each screen its details (screen/readDetail), layers,
      presets, current preset, preset groups and the preset group playing,
      six requests per screen and six more each round; raise poll_ms for a
      splicer with many screens. A command that succeeds has what it changed
      read back at once (a screen's details, its layers, presets or groups,
      inputs, outputs, backgrounds or playlists; the screen list after
      create, rename, delete or a layout). Opened for commands only, the
      module asks only the initialisation status, as its liveness check, and
      reads nothing back. The change history mentions websocket push
      notifications (layer z-order) whose form the pages do not give, so they
      are not used.

  - models: [all]
    severity: info
    text: >
      API limits: the OpenAPI has no read for show_screen_ids (screen ID
      display), set_output_locating or input groups, so those are not kept in
      state. Kept out of state though readable: the OSD's text, colours and
      position and the 3D timing (get_screen returns them), and preset group
      contents and play times (get_preset_group). The background switch's
      sense is documented for the write only: Set BKG (screen/writeBKG) gives
      enable as "0: Enable, 1: Disable", the reverse of the other switches.
      Read Screen Detailed Information's Bkg refers to the BKG detail page,
      which has no enable, so the read's sense is not documented; it is kept
      as the splicer reports it (screens.*.bkg.enable), taken to be the
      write's.

  - models: [all]
    severity: critical
    text: >
      load_preset, screen_ftb, set_screen_freeze, freeze_layer,
      set_layer_source, create_layer, delete_layer, clear_layers and
      play_preset_group change the live wall. delete_screens, clear_screens,
      clear_presets, delete_preset, overwrite_preset and the delete commands
      remove configuration without asking.

  - models: [all]
    severity: info
    text: >
      Commands whose request is a nested structure take it in `body` as the
      documentation gives it (merged over the named parameters); `call`
      reaches the IPC endpoints and any other by path. The set_screen_bkg
      page documents enable 0 as on and 1 as off, the reverse of the other
      switches.
