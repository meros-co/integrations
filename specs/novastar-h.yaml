    summary: "Fade a screen to black (type 0) or back on (type 1) over a time in seconds"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      screen_id: { type: int, min: 0, max: 255, required: true, label: Screen, description: "The screen's screenId, as list_screens returns it." }
