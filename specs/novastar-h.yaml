      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      screen_id: { type: int, min: 0, max: 255, required: true, label: Screen, description: "The screen's screenId, as list_screens returns it." }
      group_id: { type: int, min: 0, required: true, label: Preset group, description: "The preset group's ID on the screen, as list_preset_groups returns it." }
      enable: { type: int, min: 0, max: 1, required: true, label: Play, description: "1 starts playing the preset group on the screen, 0 stops it." }
    returns: value

  get_preset_group_playing:
    summary: "The preset group playing on a screen"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      screen_id: { type: int, min: 0, max: 255, required: true, label: Screen, description: "The screen's screenId, as list_screens returns it." }
    returns: value

  list_bkgs:
    summary: "Every background image"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
    returns: value

  get_bkg:
    summary: "A background image's details"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      bkg_id: { type: int, min: 0, required: true, label: Background image, description: "The background image's ID, as list_bkgs returns it." }
    returns: value

  create_bkg:
    summary: "Add a background image: name, file name, and the file as Base64"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      name: { type: string, max_length: 64, required: true, label: Background name, description: "Name of the new background image, as it will show on the splicer." }
      file_name: { type: string, max_length: 255, required: true, label: File name, description: "Name of the image file, such as background.png." }
      file: { type: string, max_length: 16777216, required: true, label: Image file, description: "The background image file, encoded as Base64." }
    returns: value

  delete_bkgs:
    summary: "Delete background images: bkg_ids is a JSON array"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      bkg_ids: { type: json, required: true, label: Background images, description: "JSON array of the background image IDs to delete, such as [0, 1]." }
    returns: value

  call:
    summary: "Call any OpenAPI endpoint by its path after /open/api/ (such as ipc/readList) with the documented body as JSON; deviceId is not added"
    params:
      path: { type: string, pattern: "^[A-Za-z0-9/_]{1,128}$", required: true, label: Endpoint path, description: "Endpoint path after /open/api/, such as ipc/readList." }
      body: { type: json, required: true, label: Body, description: "JSON object of the endpoint's documented body fields, deviceId included where it has one." }
    returns: value

