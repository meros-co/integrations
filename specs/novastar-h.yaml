      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      screen_id: { type: int, min: 0, max: 255, required: true, label: Screen, description: "The screen's screenId, as list_screens returns it." }
      group_id: { type: int, min: 0, required: true, label: Preset group, description: "The preset group's ID on the screen, as list_preset_groups returns it." }
      enable: { type: int, min: 0, max: 1, required: true, label: Play, description: "1 starts playing the preset group on the screen, 0 stops it." }
    returns: value

  get_preset_group_playing:
    summary: "The preset group playing on a screen"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      screen_id: { type: int, min: 0, max: 255, required: true, label: Screen, description: "The screen's screenId, as list_screens returns it." }
    returns: value

  list_bkgs:
    summary: "Every background image"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
    returns: value

  get_bkg:
    summary: "A background image's details"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      bkg_id: { type: int, min: 0, required: true, label: Background image, description: "The background image's ID, as list_bkgs returns it." }
    returns: value

  create_bkg:
    summary: "Add a background image: name, file name, and the file as Base64"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      name: { type: string, max_length: 64, required: true, label: Background name, description: "Name of the new background image, as it will show on the splicer." }
      file_name: { type: string, max_length: 255, required: true, label: File name, description: "Name of the image file, such as background.png." }
      file: { type: string, max_length: 16777216, required: true, label: Image file, description: "The background image file, encoded as Base64." }
    returns: value

  delete_bkgs:
    summary: "Delete background images: bkg_ids is a JSON array"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      bkg_ids: { type: json, required: true, label: Background images, description: "JSON array of the background image IDs to delete, such as [0, 1]." }
    returns: value

  call:
    summary: "Call any OpenAPI endpoint by its path after /open/api/ (such as ipc/readList) with the documented body as JSON; deviceId is not added"
    params:
      path: { type: string, pattern: "^[A-Za-z0-9/_]{1,128}$", required: true, label: Endpoint path, description: "Endpoint path after /open/api/, such as ipc/readList." }
      body: { type: json, required: true, label: Body, description: "JSON object of the endpoint's documented body fields, deviceId included where it has one." }
    returns: value

state:
  device.initialized: { type: bool, description: "The splicer finished initialising (initStatus 1)" }
  device.serial: { type: string, description: "Device serial number" }
  device.software_version: { type: string, description: "Software version, such as 1.9.7.0.S1.T1" }
  device.main_model_id: { type: int, description: "Main control card model ID" }
  screens.*.name: { type: string, description: "Screen name, keyed by screenId" }
  screens.*.preset: { type: int, description: "Preset playing on the screen, -1 for none" }

quirks:
  - models: [all]
    severity: warning
    text: >
      Requests are sent unencrypted, signed with Base64(md5(timeStamp + pId)).
      Turn encryption off for the requestor under Settings > OpenAPI
      Management; with encryption on, the splicer expects a DES-encrypted body,
      which the core does not send. The p_id setting is the requestor ID made
      there.

  - models: [all]
    severity: warning
    text: >
      The splicer checks the request time (error 11, incorrect device time):
      the computer running the core and the splicer must agree on the time.
      The time sent is the core's clock when the device was opened plus the
      time since.

  - models: [all]
    severity: info
    text: >
      A reply with status other than 0 fails the command with that code and
      the reply's msg (the error code page lists them: 18 incorrect signature,
      404 screen does not exist, 410 brightness cannot be set, 412 OSD limit,
      912 initialising ...). A successful command returns the reply's body.

  - models: [all]
    severity: info
    text: >
      deviceId is 0 in every example except the screen brightness pages, which
      say to pass 1; device_id defaults to 0. set_screen_brightness and
      save_screen_brightness work only with the H_16xRJ45+2xfiber, H_20xRJ45
      and H_4xfiber (and enhanced) sending cards.

  - models: [all]
    severity: info
    text: >
      State is polled (poll_ms, 5 s by default): the initialisation status,
      the screen list, and the preset each screen plays. Opened for commands
      only, the module asks only the initialisation status, as its liveness
      check. The change history mentions websocket push notifications (layer
      z-order) whose form the pages do not give, so they are not used.

  - models: [all]
    severity: critical
    text: >
      load_preset, screen_ftb, set_screen_freeze, freeze_layer,
      set_layer_source, create_layer, delete_layer, clear_layers and
      play_preset_group change the live wall. delete_screens, clear_screens,
      clear_presets, delete_preset, overwrite_preset and the delete commands
      remove configuration without asking.

  - models: [all]
    severity: info
    text: >
      Commands whose request is a nested structure take it in `body` as the
      documentation gives it (merged over the named parameters); `call`
      reaches the IPC endpoints and any other by path. The set_screen_bkg
      page documents enable 0 as on and 1 as off, the reverse of the other
      switches.
