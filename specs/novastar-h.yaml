spec: 1
id: novastar-h
name: NovaStar H series video wall splicers (OpenAPI)
vendor: NovaStar
category: switcher
implementation: native
reason: >
  Every request carries a signature over the current time in milliseconds and the requestor ID
  (Base64 of the hexadecimal MD5 of timestamp + pId), and the splicer refuses a request whose time
  is wrong; the format has no clock and no hashing. Replies wrap the data in {status, msg, body}, and
  the poll walks the screens it reads to ask each one's current preset.

# Every request is an HTTP POST of JSON to http://<splicer>:8000/open/api/<endpoint>
# with the body {"body": {...}, "sign": ..., "pId": ..., "timeStamp": ...}.
# The commands below take the business fields of each endpoint; the module adds
# deviceId (device_id, default 0) where the endpoint has one and signs the
# request. Endpoints with nested structures (layers, screen layouts, OSD,
# timing, playlists) take those structures in `body`, merged in as the
# documentation gives them; `call` reaches any endpoint by path.

source:
  - title: H Series OpenAPI Instructions (English), NovaStar's "H" project on Apifox
    author: NovaStar (Xi'an NovaStar Tech Co.)
    url: https://openapi.novastar.tech/en/h/doc-7540897
    note: >
      Manufacturer documentation, read 2026-10-03 through its Markdown export
      (llms.txt and each page's .md). Used for: HTTP POST of JSON, the pId
      and secret key made under Settings > OpenAPI Management, the request
      envelope (body, sign, pId, timeStamp), the signature rules (unencrypted:
      Base64 of md5(timeStamp + pId) in hexadecimal; encrypted: DES of the
      body and md5 over ciphertext, time, pId and key), the reply envelope
      {status, msg, sign, body}, the root http://<ip>:8000/open/api (sections
      1-5), the error codes page (including 11, incorrect device time, and 18,
      incorrect signature), the change history (to V2000), and every endpoint
      page used here: device, homepage, screen, inputs, outputs, layers,
      presets, BKG and IPC. The signature rule was checked against both
      worked examples on the pages (pId ZTlj and YmRj at 1689586062335).
      Cited as H OpenAPI.

settings:
  # Settings > OpenAPI Management on the splicer.
  p_id: { type: string, max_length: 64, default: "", label: Requestor ID, description: "The pId of the requestor made under Settings > OpenAPI Management on the splicer, with encryption turned off." }
  # Read the state (screens and the preset each plays) every this many ms; 0 reads it once.
  poll_ms: { type: int, min: 0, max: 600000, default: 5000, label: Poll interval, description: "How often, in milliseconds, the screens and the preset each plays are read; 0 reads them once." }

ports:
  - { port: 8000, protocol: http, role: control }

models:
  - id: h2
    name: NovaStar H2
    supports: &all [read_device_detail, read_card_versions, read_device_ip, read_init_status, list_screens, get_screen, get_screen_offline, set_screen_brightness, save_screen_brightness, set_screen_gamma, screen_ftb, set_screen_freeze, set_screen_bkg, show_screen_ids, rename_screen, delete_screens, clear_screens, create_screen, set_screen_layout, set_screen_3d, set_text_osd, set_image_osd, list_inputs, get_input, rename_input, set_input_resolution, set_input_timing, create_input_crop, update_input_crop, delete_input_crop, create_input_group, update_input_group, sort_input_groups, delete_input_group, remove_input_from_group, import_edid, list_source_playlists, create_source_playlist, update_source_playlist, enable_source_playlists, delete_source_playlists, list_outputs, get_output, rename_output, set_output_gamma, set_output_image_quality, set_output_locating, set_output_resolution, set_output_timing, set_4k_output_timing, set_all_in_one_payload, list_layers, get_layer, get_layer_zorder, create_layer, delete_layer, clear_layers, set_layer_window, set_layer_general, set_layer_zorder, lock_layer, set_layer_source, freeze_layer, open_layer_layout, set_layer_stream_rule, list_presets, get_preset, get_current_preset, load_preset, create_preset, overwrite_preset, rename_preset, delete_preset, clear_presets, list_preset_groups, get_preset_group, create_preset_group, update_preset_group, delete_preset_group, play_preset_group, get_preset_group_playing, list_bkgs, get_bkg, create_bkg, delete_bkgs, call]
    verification: none
  - id: h5
    name: NovaStar H5
    supports: *all
    verification: none
  - id: h9
    name: NovaStar H9
    supports: *all
    verification: none
  - id: h15
    name: NovaStar H15
    supports: *all
    verification: none
  - id: h20
    name: NovaStar H20
    supports: *all
    verification: none

commands:
  read_device_detail:
    summary: "Device information: name, model, work mode, slots and cards, power supplies, fans, network, genlock"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
    returns: value

  read_card_versions:
    summary: "Every card's model, MCU and FPGA versions and serial number"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
    returns: value

  read_device_ip:
    summary: "The device's IP settings"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
    returns: value

  read_init_status:
    summary: "Whether initialisation completed, the main control model, serial number and software version"
    returns: value

  list_screens:
    summary: "Screens: screenId, name and creation time"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
    returns: value

  get_screen:
    summary: "A screen's details: layout, outputs, OSD, BKG, 3D and audio"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      screen_id: { type: int, min: 0, max: 255, required: true, label: Screen, description: "The screen's screenId, as list_screens returns it." }
    returns: value

  get_screen_offline:
    summary: "Screen details not in live mode (body as documented)"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      body: { type: json, label: Body, description: "JSON object of the documented request fields for reading screen details outside live mode." }
    returns: value

  set_screen_brightness:
    summary: "Set a screen's brightness, 0 to 100 (certain sending cards only)"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses; the brightness pages say to pass 1, while every other example uses 0." }
      screen_id: { type: int, min: 0, max: 255, required: true, label: Screen, description: "The screen's screenId, as list_screens returns it." }
      brightness: { type: int, min: 0, max: 100, required: true, label: Brightness, description: "Screen brightness in percent, from 0 (dark) to 100 (full); only certain sending cards accept it." }
    returns: value

  save_screen_brightness:
    summary: "Set and save a screen's brightness, 0 to 100 (certain sending cards only)"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses; the brightness pages say to pass 1, while every other example uses 0." }
      screen_id: { type: int, min: 0, max: 255, required: true, label: Screen, description: "The screen's screenId, as list_screens returns it." }
      brightness: { type: int, min: 0, max: 100, required: true, label: Brightness, description: "Screen brightness in percent, from 0 (dark) to 100 (full); only certain sending cards accept it." }
    returns: value

  set_screen_gamma:
    summary: "Set a screen's gamma"
    params:
      device_id: { type: int, min: 0, max: 255, default: 0, label: Device ID, description: "The deviceId the request addresses, 0 in the documentation's examples, so leave it at 0 unless the splicer needs another." }
      screen_id: { type: int, min: 0, max: 255, required: true, label: Screen, description: "The screen's screenId, as list_screens returns it." }
