telemetry:
  sse:
    path: /api/ssc/state/subscriptions
  poll:
    send:
      - { method: GET, path: /api/ssc/version }
      - { method: GET, path: /api/device/licenseAgreements/hash }
  updates:
    - json_match: { "$.event": "^open$", "$.data.sessionUUID": "^([0-9A-Za-z-]+)$" }
