quirks:
  - models: [all]
    severity: info
    text: >
      On connecting the core opens the event stream; its open event gives the
      session, to which every readable resource is added with one PUT (a
      resource the device does not have refuses the whole list). The device
      sends each resource's value at once and on every change, so nothing is
      polled but the version and the license hash, read once. Opened for
      commands only, no stream is opened and nothing is read.
  - models: [all]
    severity: info
    text: >
      Third-party access is off until enabled, with a password, in Sennheiser
      Control Cockpit; the user is api. A 401 or 403 is a refusal of the
      password. The device's certificate is self-signed and accepted as such.
  - models: [all]
    severity: info
    text: >
      The API offers no write for the device name, location and position, the
      network settings, restart, factory reset, firmware update or the
      room-in-use settings: they are set in Control Cockpit. The equalizer and
      the noise gate are shared by the outputs; each output turns them on or
      off. The reference gain can be set only with automatic adjustment off
      (409 or 422 otherwise). Zones narrower than 10 degrees (15 for the
      priority zone) are refused.
  - models: [all]
    severity: warning
    text: >
      Each write is a PUT of the one field it changes (partial bodies, as the
      schema's requests have no required fields); the new value arrives on
      the event stream.

