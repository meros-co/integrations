spec: 1
id: sennheiser-tcc-m
name: Sennheiser TeamConnect Ceiling Medium (Sound Control Protocol v2)
vendor: Sennheiser
category: other

# The TeamConnect Ceiling Medium speaks SSCv2: an HTTPS REST API on port 443
# (Basic authentication as user api with the third-party password set in
# Sennheiser Control Cockpit) and a server-sent event stream for changes. The
# stream's first event names a session, to which the core then adds every
# readable resource with one PUT; the device sends each one's value at once
# and again whenever it changes. Writes are PUTs of the fields that change.
source:
  - title: "Sennheiser Sound Control Protocol v2 (SSCv2), TeamConnect Ceiling Medium, v1.1 (06/2023)"
    author: Sennheiser
    url: https://assets.sennheiser.com/download/assets/06_2023_Sennheiser_Sound_Control_Protocol_v2_TCCM_EN.pdf/64399174e7b411f0b959ce3d75c40f07
    note: >
      Manufacturer document. HTTPS on 443, Basic authentication as api, access
      enabled and its password set in Control Cockpit §2; status codes;
      subscriptions §3.4: the event stream, its open event with the session,
      PUT of resource lists to the session (replace, add, remove), initial
      values, close on reboot.
  - title: "SSCv2 Schema for TCCM, OpenAPI 1.9 (released 2026-02-25)"
    author: Sennheiser
    url: https://assets.sennheiser.com/download/assets/api_1.9.0.json/18b31510118311f186a21e752e7f194a
    note: >
      Manufacturer document, the API reference (Swagger at
      https://docs.cloud.sennheiser.com/en-us/api-docs/api-docs/open-api-tc-ceiling-medium.html).
      Every resource, its methods, fields, ranges, enumerations and defaults.
  - title: "Sennheiser Sound Control (SSCv2) Specification, Version 2.3; Subscribing to real-time updates"
    author: Sennheiser
    url: https://docs.cloud.sennheiser.com/en-us/api-docs/api-docs/sscv2-specification-2.3.html
    note: >
      Manufacturer documents. The event format (event and data lines, data an
      object keyed by resource path), sessions and their management.

transport:
  type: http
  port: 443
  scheme: https
  accept_invalid_certs: true
  auth: basic
  timeout_ms: 4000
  probe: { method: GET, path: /api/ssc/version }

settings:
  username: { type: string, default: api, max_length: 32, label: User, description: "The SSCv2 user; api for third-party access." }
  password: { type: string, secret: true, default: "", max_length: 128, label: Password, description: "The third-party access password set in Sennheiser Control Cockpit, where third-party access must also be enabled." }

ports:
  - { port: 443, protocol: https, role: control }
  - { port: 443, protocol: https, role: push, note: "The event stream, on the same server" }

models:
  - id: tcc-m
    name: Sennheiser TeamConnect Ceiling Medium
    supports:
      - get_ssc_version
      - get_device_identity
      - get_device_identification
      - identify
      - get_device_site
      - get_device_state
      - get_firmware_update_state
      - get_audio_outputs_global_mute
      - set_mute
      - get_audio_inputs_microphone_beam
      - set_beam_installation_type
      - set_beam_source_detection_threshold
      - set_beam_offset
      - get_audio_inputs_microphone_beam_direction
      - get_audio_inputs_microphone_level
      - get_audio_inputs_reference_level
      - get_audio_room_in_use
      - get_audio_room_in_use_activity_level
      - get_audio_room_in_use_config
      - get_audio_outputs_analog
      - set_analog_out_gain
      - set_analog_out_source
      - get_audio_outputs_dante_far_end
      - set_dante_far_end_gain
      - set_dante_far_end_noise_gate_enabled
      - set_dante_far_end_equalizer_enabled
      - set_dante_far_end_delay
      - get_audio_outputs_dante_local
      - set_dante_local_gain
      - set_dante_local_noise_gate_enabled
      - set_dante_local_equalizer_enabled
      - set_dante_local_voice_lift_enabled
      - set_dante_local_delay
      - get_audio_voice_lift
      - set_voice_lift_emergency_mute_threshold
      - set_voice_lift_emergency_mute_time
      - get_audio_inputs_dante_reference
      - set_reference_gain
      - set_reference_far_end_auto_adjust_enabled
      - get_audio_noise_gate
      - set_noise_gate_threshold
      - set_noise_gate_hold_time
      - get_device_leds_ring
      - set_led_brightness
      - set_led_show_farend_activity
      - set_led_mic_on_color
      - set_led_mic_mute_color
      - set_led_mic_custom_color
      - set_led_mic_custom_enabled
      - get_device_power_poe_daisychain
      - get_audio_inputs_microphone_exclusion_zones
      - set_exclusion_zone_active
      - set_exclusion_zone_elevation_min
      - set_exclusion_zone_elevation_max
      - set_exclusion_zone_azimuth_min
      - set_exclusion_zone_azimuth_max
      - get_audio_inputs_microphone_priority_zones
      - set_priority_zone_active
      - set_priority_zone_elevation_min
      - set_priority_zone_elevation_max
      - set_priority_zone_azimuth_min
      - set_priority_zone_azimuth_max
      - set_priority_zone_weight
      - get_audio_inputs_microphone_denoiser
      - set_denoiser
      - get_device_license_agreements_hash
      - get_audio_inputs_microphone_input_lowcuts
      - set_input_lowcuts
      - get_audio_inputs_microphone_single_capsule_mode
      - set_single_capsule_mode
      - get_audio_inputs_microphone_beam_beamfreeze_auto_hold
      - set_beam_freeze_enabled
      - set_beam_freeze_hold_time
      - get_equalizer
      - set_equalizer
    verification: none

commands:
  get_ssc_version:
    summary: "Read the SSC version (GET /api/ssc/version)"
    send: { method: GET, path: "/api/ssc/version" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_device_identity:
    summary: "Read the device identity (GET /api/device/identity)"
    send: { method: GET, path: "/api/device/identity" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_device_identification:
    summary: "Read the identification (GET /api/device/identification)"
    send: { method: GET, path: "/api/device/identification" }
    expect: { status: 200, json_path: "$" }
    returns: value

  identify:
    summary: "Set the identification: identifying: the LED ring flashes (PUT /api/device/identification)"
    params:
      value: { type: bool, required: true, label: "Visual", description: "Identifying: the LED ring flashes." }
    send: { method: PUT, path: "/api/device/identification", body: '{"visual":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  get_device_site:
    summary: "Read the site (GET /api/device/site)"
    send: { method: GET, path: "/api/device/site" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_device_state:
    summary: "Read the device state (GET /api/device/state)"
