  get_video_input:
    summary: "One video input (GET /apis/vidin/{id})"
    params:
      id: &vidin { type: int, min: 0, required: true, label: Video input, description: "The video input's id, from 0." }
    send: { method: GET, path: "/apis/vidin/{id}" }
    expect: *read
    returns: value

  configure_video_input:
    summary: "Set a video input's filtering and Square Division capture (PUT /apis/vidin/{id})"
    params:
      id: *vidin
      fir_filter: { type: bool, required: true, label: Image filtering, description: "Whether input noise is filtered to help compression." }
      square_division: { type: bool, default: false, label: Square Division, description: "Whether the input is a Square Division quad (SQD or DEFENSE personality)." }
    send:
      - { method: PUT, path: "/apis/vidin/{id}", content_type: application/json,
          body: '{"firFilter":{fir_filter},"squareDivisionCapture":{square_division}}' }
      - { method: GET, path: /apis/vidin }
    expect: *ok
    returns: ack

  # ── Audio encoders (encoder) ───────────────────────────────────────────
  list_audio_encoders:
    summary: "Every audio encoder with configuration and statistics (GET /apis/audenc)"
    send: { method: GET, path: /apis/audenc }
    expect: *read
    returns: value

  get_audio_encoder:
    summary: "One audio encoder (GET /apis/audenc/{id})"
    params:
      id: &audenc { type: int, min: 0, required: true, label: Audio encoder, description: "The audio encoder's id, from 0." }
    send: { method: GET, path: "/apis/audenc/{id}" }
    expect: *read
    returns: value

  configure_audio_encoder:
    summary: "Set an audio encoder (PUT /apis/audenc/{id})"
    params:
      id: *audenc
      name: { type: string, required: true, max_length: 64, label: Name, description: "The encoder's name." }
      interface: { type: int, min: 0, max: 32, required: true, label: Input, description: "0 analog; 1 to 8 SDI 1 channel pairs 1-2 to 15-16; 9 to 16 SDI 2; 17 to 24 SDI 3; 25 to 32 SDI 4 (as many SDI inputs as the unit has)." }
      algorithm: { type: enum, values: [pcm_passthrough, aac_adts, aac_latm, opus], required: true, label: Coding, description: "16-bit PCM pass-through, MPEG-2 AAC-LC ADTS, MPEG-4 AAC-LC LOAS/LATM or Opus." }
      bitrate: { type: int, min: 0, required: true, label: Bit rate, description: "The bit rate in kbit/s; the range depends on the mode, as the user's guide gives it." }
      sample_rate: { type: enum, values: ["48", "16"], default: "48", label: Sample rate, description: "48 kHz, or 16 kHz on the analog input." }
      mode: { type: enum, values: [stereo, mono_left, mono_right, "3.0", "4.0", "4.1", "5.1", "7.0", "7.1"], required: true, label: Channels, description: "Stereo, left or right alone, or a surround layout." }
      input_level: { type: int, min: 2, max: 21, default: 6, label: Analog level, description: "Analog input level: 2 to 9 on rugged units, 5 to 21 on others." }
      language: { type: string, default: "", max_length: 3, pattern: "^([a-z]{3})?$", label: Language, description: "Three-letter ISO 639 language code, or empty." }
    send:
      - { method: PUT, path: "/apis/audenc/{id}", content_type: application/json,
          body: '{"name":{name:json},"interface":{interface},"algorithm":{algorithm:map.audio_algorithm},"bitRate":{bitrate},"sampleRate":{sample_rate},"mode":{mode:map.audio_mode},"inputLevel":{input_level},"lang":{language:json}}' }
      - { method: GET, path: /apis/audenc }
    expect: *ok
    returns: ack

  start_audio_encoder:
    summary: "Start an audio encoder (PUT /apis/audenc/{id}/start)"
    params:
      id: *audenc
    send:
      - { method: PUT, path: "/apis/audenc/{id}/start" }
      - { method: GET, path: /apis/audenc }
    expect: *ok
    returns: ack

  stop_audio_encoder:
    summary: "Stop an audio encoder (PUT /apis/audenc/{id}/stop)"
    params:
      id: *audenc
    send:
      - { method: PUT, path: "/apis/audenc/{id}/stop" }
      - { method: GET, path: /apis/audenc }
    expect: *ok
