commands:
  # ── Session and system ─────────────────────────────────────────────────
  get_session:
    summary: "The signed-in user, its ids and whether its password has expired (GET /apis/authentication)"
    send: { method: GET, path: /apis/authentication }
    expect: &read { status: 200, json_path: "$" }
    returns: value

  get_status:
    summary: "Hardware, firmware, uptime, temperature and load (GET /apis/status)"
    send: { method: GET, path: /apis/status }
    expect: *read
    returns: value

  get_system_info:
    summary: "Capabilities, counts of encoders, decoders and inputs, licenses in effect and the personality (GET /apis/system_info)"
    send: { method: GET, path: /apis/system_info }
    expect: *read
    returns: value

  set_device_name:
    summary: "Set the name the web interface shows (PUT /apis/system_info deviceName); the host name is separate (configure_network)"
    params:
      name: { type: string, required: true, max_length: 64, label: Device name, description: "The unit's display name; it does not change the network host name." }
    send:
      - { method: PUT, path: /apis/system_info, content_type: application/json, body: '{"deviceName":{name:json}}' }
      - { method: GET, path: /apis/system_info }
    expect: &ok { status: [200, 204] }
    returns: ack

  set_analytics:
    summary: "Allow or refuse sending usage analytics to Haivision (PUT /apis/system_info analytics)"
    params:
      analytics: { type: enum, values: [accepted, declined, undecided], required: true, label: Analytics, description: "accepted sends usage analytics, declined does not, undecided asks again in the web interface." }
    send:
      - { method: PUT, path: /apis/system_info, content_type: application/json, body: '{"analytics":"{analytics}"}' }
      - { method: GET, path: /apis/system_info }
    expect: *ok
    returns: ack

  set_personality:
    summary: "Choose the encoder's personality for the next reboot (PUT /apis/system_info personality); info.next_personality reads it back"
    params:
      personality: { type: enum, values: [sdi, "2110", sqd, defense], required: true, label: Personality, description: "sdi for SDI inputs, 2110 for ST 2110 inputs (needs the license), sqd for Square Division quad split, defense for logo insertion." }
    send:
      - { method: PUT, path: /apis/system_info, content_type: application/json, body: '{"personality":"{personality}"}' }
      - { method: GET, path: /apis/system_info }
    expect: *ok
    returns: ack

  set_decoder_personality:
    summary: "Choose the decoder's personality for the next reboot (PUT /apis/system_info personality)"
    params:
      personality: { type: enum, values: [SDI, "2110"], required: true, label: Personality, description: "SDI for SDI outputs, 2110 for ST 2110 outputs (needs the license)." }
    send:
      - { method: PUT, path: /apis/system_info, content_type: application/json, body: '{"personality":"{personality}"}' }
      - { method: GET, path: /apis/system_info }
    expect: *ok
    returns: ack

  reboot:
    summary: "Restart the unit (POST /apis/reboot); returns {upgrade}, 1 when a package will be installed during the restart"
    send: { method: POST, path: /apis/reboot }
    expect: *read
    returns: value

  get_messages:
    summary: "Recent system messages (GET /apis/messages)"
    send: { method: GET, path: /apis/messages }
    expect: *read
    returns: value

  clear_messages:
    summary: "Clear the system messages (DELETE /apis/messages)"
    send:
      - { method: DELETE, path: /apis/messages }
      - { method: GET, path: /apis/messages }
    expect: *ok
    returns: ack

  get_leds:
    summary: "The status LED and how long it keeps blinking (GET /apis/leds)"
    send: { method: GET, path: /apis/leds }
    expect: *read
    returns: value

  blink_leds:
    summary: "Blink the LEDs to find the unit (POST /apis/leds)"
    params:
      duration: { type: int, min: 1, max: 60, required: true, label: Duration, description: "How long the LEDs blink, in minutes." }
    send:
      - { method: POST, path: /apis/leds, content_type: application/json, body: '{"duration":{duration}}' }
      - { method: GET, path: /apis/leds }
    expect: *ok
    returns: ack

  stop_blinking_leds:
    summary: "Stop the LEDs blinking (DELETE /apis/leds)"
    send:
      - { method: DELETE, path: /apis/leds }
      - { method: GET, path: /apis/leds }
    expect: *ok
    returns: ack

  # ── Accounts ───────────────────────────────────────────────────────────
  list_accounts:
    summary: "Every account with role, state, expiry and SSH keys (GET /apis/accounts)"
    send: { method: GET, path: /apis/accounts }
    expect: *read
    returns: value

  create_account:
    summary: "Create an account (POST /apis/accounts); the password is sent twice, as the web form confirms it"
    params:
      username: &account { type: string, required: true, max_length: 64, label: User name, description: "The account's sign-in name." }
      role: { type: enum, values: [Administrator, Operator, Guest], required: true, label: Role, description: "Administrator may change everything, Operator runs the unit, Guest only reads." }
      password: &new_password { type: string, secret: true, required: true, max_length: 128, label: Password, description: "The account's password, held to the password policies." }
    send:
      - { method: POST, path: /apis/accounts, content_type: application/json,
          body: '{"name":{username:json},"role":"{role}","password":{password:json},"passwordConfirm":{password:json}}' }
      - { method: GET, path: /apis/accounts }
    expect: *ok
    returns: ack

  change_password:
    summary: "Change an account's password (PUT /apis/accounts/{username}); the old password is needed only for the account signed in"
    params:
      username: *account
      password: *new_password
      old_password: { type: string, secret: true, default: "", max_length: 128, label: Old password, description: "The current password, needed when changing the signed-in account's own; empty for an administrator changing another's." }
    send:
      - { method: PUT, path: "/apis/accounts/{username}", content_type: application/json,
          body: '{"oldPassword":{old_password:json},"password":{password:json},"passwordConfirm":{password:json}}' }
      - { method: GET, path: /apis/accounts }
    expect: *ok
    returns: ack

  delete_account:
    summary: "Delete an account (DELETE /apis/accounts/{username})"
    params:
      username: *account
    send:
      - { method: DELETE, path: "/apis/accounts/{username}" }
      - { method: GET, path: /apis/accounts }
    expect: *ok
    returns: ack

  enable_account:
    summary: "Enable a disabled account (PUT /apis/accounts/{username}/enable)"
    params:
      username: *account
    send:
      - { method: PUT, path: "/apis/accounts/{username}/enable" }
      - { method: GET, path: /apis/accounts }
    expect: *ok
    returns: ack

  lock_account:
    summary: "Lock an account (PUT /apis/accounts/{username}/lock)"
    params:
      username: *account
    send:
      - { method: PUT, path: "/apis/accounts/{username}/lock" }
      - { method: GET, path: /apis/accounts }
    expect: *ok
    returns: ack

  unlock_account:
    summary: "Unlock a locked account (PUT /apis/accounts/{username}/unlock)"
    params:
      username: *account
    send:
      - { method: PUT, path: "/apis/accounts/{username}/unlock" }
      - { method: GET, path: /apis/accounts }
    expect: *ok
    returns: ack

  upload_public_key:
    summary: "Add an SSH public key to an account (POST /apis/accounts/{username}/pubkeys, multipart file)"
    params:
      username: *account
      key: { type: binary, required: true, label: Public key, description: "The SSH public key file, such as id_rsa.pub." }
      filename: &key_name { type: string, required: true, max_length: 128, pattern: "^[^/\\\\]+$", label: Key name, description: "The key's file name, which names it on the unit, such as id_rsa.pub." }
    send:
      - { method: POST, path: "/apis/accounts/{username}/pubkeys",
          multipart: [{ name: file, binary: key, filename: "{filename}", content_type: application/octet-stream }] }
      - { method: GET, path: /apis/accounts }
    expect: *ok
    returns: ack

  delete_public_key:
    summary: "Remove an SSH public key from an account (DELETE /apis/accounts/{username}/pubkeys/{filename})"
    params:
      username: *account
      filename: *key_name
    send:
      - { method: DELETE, path: "/apis/accounts/{username}/pubkeys/{filename}" }
      - { method: GET, path: /apis/accounts }
    expect: *ok
    returns: ack

  get_policies:
    summary: "Password, sign-in and TLS policies (GET /apis/policies)"
    send: { method: GET, path: /apis/policies }
    expect: *read
    returns: value

  configure_policies:
    summary: "Set the policies (PUT /apis/policies) from the API's policies object: minLen, quality, uppercase, digits, symbols, rememberedPasswords, minimumLifetime, expiration, expirationDays, hsts, autoLogout, autoLogoutTime, limitPwdRetries, limitPwdRetriesMaxAttempts, limitPwdRetriesInterval, inactiveLock, inactiveLockTime, compliance, ssl3, tls1, tls1_1, tls1_2"
    params:
      policies: { type: json, required: true, label: Policies, description: "JSON object in the shape get_policies returns; a compliance mode or TLS change can end the connection." }
    send:
      - { method: PUT, path: /apis/policies, content_type: application/json, body: "{policies}" }
      - { method: GET, path: /apis/policies }
    expect: *ok
    returns: ack

  get_audit:
    summary: "Where audit messages go (GET /apis/audit)"
    send: { method: GET, path: /apis/audit }
    expect: *read
    returns: value

  configure_audit:
    summary: "Set the audit server (PUT /apis/audit)"
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "Whether audit messages are sent to the server." }
      transport: { type: enum, values: [UDP, TLS], required: true, label: Transport, description: "UDP, or TLS with the certificate trust below." }
      server: { type: string, required: true, max_length: 253, label: Server, description: "The audit server's address or host name." }
      trusted: { type: enum, values: [All, CA-signed, Self-signed], default: All, label: Trust, description: "All accepts any certificate, CA-signed checks it against the CA certificates loaded, Self-signed against the fingerprint." }
      fingerprint: { type: string, default: "", max_length: 128, label: Fingerprint, description: "The server certificate's MD5 or SHA1 fingerprint, such as SHA1:AD:4C:..., for Self-signed; empty otherwise." }
    send:
      - { method: PUT, path: /apis/audit, content_type: application/json,
          body: '{"enabled":{enabled:bool01},"transport":"{transport}","server":{server:json},"trusted":"{trusted}","fingerprint":{fingerprint:json}}' }
      - { method: GET, path: /apis/audit }
    expect: *ok
    returns: ack

  get_banner:
    summary: "The sign-in banner and whether it is shown (GET /apis/banner)"
    send: { method: GET, path: /apis/banner }
    expect: *read
    returns: value

  upload_banner:
    summary: "Replace the sign-in banner with a text file (POST /apis/banner, multipart file)"
    params:
      file: { type: binary, required: true, label: Banner file, description: "A UTF-8 or ASCII text file." }
    send:
      - { method: POST, path: /apis/banner,
          multipart: [{ name: file, binary: file, filename: banner.txt, content_type: application/octet-stream }] }
      - { method: GET, path: /apis/banner }
    expect: *ok
    returns: ack

  set_banner_enabled:
    summary: "Show or hide the sign-in banner (PUT /apis/banner)"
    params:
      enabled: { type: bool, required: true, label: Shown, description: "Whether the banner is shown before sign-in." }
    send:
      - { method: PUT, path: /apis/banner, content_type: application/json, body: '{"enabled":{enabled}}' }
      - { method: GET, path: /apis/banner }
    expect: *ok
    returns: ack

  delete_banner:
    summary: "Remove the sign-in banner (DELETE /apis/banner)"
    send:
      - { method: DELETE, path: /apis/banner }
      - { method: GET, path: /apis/banner }
    expect: *ok
    returns: ack

  # ── Certificates ───────────────────────────────────────────────────────
  list_ca_certificates:
    summary: "The CA certificates loaded (GET /apis/ca)"
    send: { method: GET, path: /apis/ca }
    expect: *read
    returns: value

  get_ca_certificate:
    summary: "One CA certificate (GET /apis/ca/{id})"
    params:
      id: &cert_id { type: string, required: true, max_length: 128, label: Certificate, description: "The certificate's id, as the certificate list gives it." }
    send: { method: GET, path: "/apis/ca/{id}" }
    expect: *read
    returns: value

  upload_ca_certificate:
    summary: "Load a CA certificate or chain (POST /apis/ca, multipart file, name, type, infmt, password)"
    params:
      file: &cert_file { type: binary, required: true, label: Certificate file, description: "The certificate file." }
      name: &cert_name { type: string, required: true, max_length: 64, label: Name, description: "The certificate's name on the unit, without extension." }
      type: { type: enum, values: [ca, chain], default: ca, label: Type, description: "ca for one certificate, chain for a certificate chain." }
      format: &cert_format { type: enum, values: [auto, pem, der, p7, p12, pfx], default: auto, label: Format, description: "The file's format: auto to detect it, or PEM, DER, PKCS#7 (p7), PKCS#12 (p12) or PFX." }
      file_password: &cert_password { type: string, secret: true, default: "", max_length: 128, label: File password, description: "The password of an encrypted certificate file; empty for none." }
    send:
      - { method: POST, path: /apis/ca,
          multipart: [{ name: name, value: "{name}" }, { name: type, value: "{type}" }, { name: infmt, value: "{format}" },
                      { name: password, value: "{file_password}" },
                      { name: file, binary: file, filename: "{name}", content_type: application/octet-stream }] }
      - { method: GET, path: /apis/ca }
    expect: *ok
    returns: ack

  delete_ca_certificate:
    summary: "Delete a CA certificate (DELETE /apis/ca/{id})"
    params:
      id: *cert_id
    send:
      - { method: DELETE, path: "/apis/ca/{id}" }
      - { method: GET, path: /apis/ca }
    expect: *ok
    returns: ack

  set_default_ca_certificate:
    summary: "Make a CA certificate the default (PUT /apis/ca/{id}/default)"
    params:
      id: *cert_id
    send:
      - { method: PUT, path: "/apis/ca/{id}/default" }
      - { method: GET, path: /apis/ca }
    expect: *ok
    returns: ack

  list_identity_certificates:
    summary: "The unit's own certificates and signing requests (GET /apis/identity)"
    send: { method: GET, path: /apis/identity }
    expect: *read
    returns: value

  get_identity_certificate:
    summary: "One identity certificate (GET /apis/identity/{id})"
    params:
      id: *cert_id
    send: { method: GET, path: "/apis/identity/{id}" }
    expect: *read
    returns: value

  generate_identity_certificate:
    summary: "Make a self-signed certificate or a certificate signing request (POST /apis/identity)"
    params:
      name: *cert_name
      sign: { type: enum, values: [self, request], required: true, label: Kind, description: "self for a self-signed certificate, request for a signing request to send to a CA." }
      subject: { type: string, required: true, max_length: 512, label: Subject, description: "The subject, such as /C=US/ST=Illinois/O=Example/CN=encoder.example.com." }
    send:
      - { method: POST, path: /apis/identity, content_type: application/json,
          body: '{"name":{name:json},"sign":"{sign}","subject":{subject:json}}' }
      - { method: GET, path: /apis/identity }
    expect: *ok
    returns: ack

  upload_identity_certificate:
    summary: "Load an identity certificate (POST /apis/identity, multipart file, name, type id, infmt, password)"
    params:
      file: *cert_file
      name: *cert_name
      format: *cert_format
      file_password: *cert_password
    send:
      - { method: POST, path: /apis/identity,
          multipart: [{ name: name, value: "{name}" }, { name: type, value: id }, { name: infmt, value: "{format}" },
                      { name: password, value: "{file_password}" },
                      { name: file, binary: file, filename: "{name}", content_type: application/octet-stream }] }
      - { method: GET, path: /apis/identity }
    expect: *ok
    returns: ack

  delete_identity_certificate:
    summary: "Delete an identity certificate (DELETE /apis/identity/{id})"
    params:
      id: *cert_id
    send:
      - { method: DELETE, path: "/apis/identity/{id}" }
      - { method: GET, path: /apis/identity }
    expect: *ok
    returns: ack

  set_default_identity_certificate:
    summary: "Use an identity certificate for the unit's HTTPS (PUT /apis/identity/{id}/default)"
    params:
      id: *cert_id
    send:
      - { method: PUT, path: "/apis/identity/{id}/default" }
      - { method: GET, path: /apis/identity }
    expect: *ok
    returns: ack

  # ── Licenses and upgrade ───────────────────────────────────────────────
  get_license_features:
    summary: "The licensed features in effect (GET /apis/license)"
    send: { method: GET, path: /apis/license }
    expect: *read
    returns: value

  list_licenses:
    summary: "The license files installed (GET /apis/licenses)"
    send: { method: GET, path: /apis/licenses }
    expect: *read
    returns: value

  get_license:
    summary: "A license file's summary as text (GET /apis/licenses/{name}); not a backup of the file"
    params:
      name: &license_name { type: string, required: true, max_length: 128, label: License, description: "The license file's name, such as HAI-032004020015.lic." }
    send: { method: GET, path: "/apis/licenses/{name}" }
    expect: { status: 200 }
    returns: text

  upload_license:
    summary: "Install a license file (POST /apis/licenses, multipart file)"
    params:
      file: { type: binary, required: true, label: License file, description: "The .lic file from Haivision." }
      filename: { type: string, required: true, max_length: 128, pattern: "^[^/\\\\]+$", label: File name, description: "The license file's name, such as HAI-032004020015.lic." }
    send:
      - { method: POST, path: /apis/licenses,
          multipart: [{ name: file, binary: file, filename: "{filename}", content_type: application/octet-stream }] }
      - { method: GET, path: /apis/licenses }
    expect: *ok
    returns: ack

  delete_license:
    summary: "Remove a license file (DELETE /apis/licenses/{name})"
    params:
      name: *license_name
    send:
      - { method: DELETE, path: "/apis/licenses/{name}" }
      - { method: GET, path: /apis/licenses }
    expect: *ok
    returns: ack

  get_upgrade_state:
    summary: "The firmware running and any package waiting for the next reboot (GET /apis/upgrade)"
    send: { method: GET, path: /apis/upgrade }
    expect: *read
    returns: value

  upload_upgrade_package:
    summary: "Upload and verify a .hai firmware package in one request (POST /apis/upgrade, multipart file); it installs at the next reboot"
    params:
      package: &hai { type: binary, required: true, label: Package, description: "The .hai firmware package." }
      filename: &hai_name { type: string, required: true, max_length: 128, pattern: "^[^/\\\\]+\\.hai$", label: File name, description: "The package's file name, ending .hai, such as makitox4_enc_v1.9.0-40.hai." }
    send:
      - { method: POST, path: /apis/upgrade,
          multipart: [{ name: file, binary: package, filename: "{filename}", content_type: application/octet-stream }] }
      - { method: GET, path: /apis/upgrade }
    expect: *ok
    returns: ack

  upload_upgrade_file:
    summary: "Upload a .hai package without verifying it (POST /apis/upgrade/upload), the first of the two-step upgrade; install_upgrade_package is the second"
    params:
      package: *hai
      filename: *hai_name
    send: { method: POST, path: /apis/upgrade/upload,
            multipart: [{ name: file, binary: package, filename: "{filename}", content_type: application/octet-stream }] }
    expect: *ok
    returns: ack

  install_upgrade_package:
    summary: "Verify the uploaded package and prepare it for the next reboot (POST /apis/upgrade/install)"
    send:
      - { method: POST, path: /apis/upgrade/install }
      - { method: GET, path: /apis/upgrade }
    expect: *ok
    returns: ack

  get_upgrade_progress:
    summary: "Upload and verification progress of a package (GET /{filename}): {state 1 uploading, 2 verifying, 3 ready; total; uploaded}"
    params:
      filename: *hai_name
    send: { method: GET, path: "/{filename}" }
    expect: *read
    returns: value

  delete_upgrade_package:
    summary: "Remove a package waiting to be installed (DELETE /apis/upgrade/{filename})"
    params:
      filename: *hai_name
    send:
      - { method: DELETE, path: "/apis/upgrade/{filename}" }
      - { method: GET, path: /apis/upgrade }
    expect: *ok
    returns: ack

  # ── Network, time and services ─────────────────────────────────────────
  get_network:
    summary: "Network interfaces, DNS, host name and mDNS (GET /apis/network)"
    send: { method: GET, path: /apis/network }
    expect: *read
    returns: value

  configure_network:
    summary: "Set the network (PUT /apis/network) from the API's network object: eth0 and eth1 objects (ipv4, ipv6, ipv6_mode, ipv6_ip, ipv6_prefix_length, ipv6_gateway, link, speed, duplex, bandwidth, dhcp, ip, netmask, gateway, linklocal, dhcpVendorID), dnsPrecedence, hostname, autoDns, dns, dns2, domain, mDnsEnabled, mDnsName"
    params:
      network: { type: json, required: true, label: Network, description: "JSON object in the shape get_network returns; a new address takes the unit away from the one the core reaches." }
    send:
      - { method: PUT, path: /apis/network, content_type: application/json, body: "{network}" }
      - { method: GET, path: /apis/network }
    expect: *ok
    returns: ack

  get_datetime:
    summary: "Time zone, NTP, the unit's time and PTP (GET /apis/datetime)"
    send: { method: GET, path: /apis/datetime }
    expect: *read
    returns: value

  set_time_ntp:
    summary: "Set the time zone and take the time from an NTP server (PUT /apis/datetime)"
    params:
      timezone: &timezone { type: string, required: true, max_length: 64, pattern: "^[A-Za-z0-9_+/-]+$", label: Time zone, description: "A time zone name as the web interface offers, such as Europe/London." }
      server: { type: string, required: true, max_length: 253, label: NTP server, description: "The NTP server's address or host name; validate_ntp_server checks it first." }
    send:
      - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: PUT, path: /apis/datetime, content_type: application/json,
          body: '{"timezone":{timezone:json},"ntp":true,"server":{server:json}}' }
      - { models: [makito-x4-decoder], method: PUT, path: /apis/datetime, content_type: application/json,
          body: '{"timezone":{timezone:json},"ntp":1,"server":{server:json}}' }
      - { method: GET, path: /apis/datetime }
    expect: *ok
    returns: ack

  set_time_manual:
    summary: "Set the time zone and the time by hand, NTP off (PUT /apis/datetime time_text)"
    params:
      timezone: *timezone
      time: { type: string, required: true, pattern: "^[0-9]{2} [0-9]{2} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2}$", label: Time, description: "The unit's local time as MM DD YYYY HH:mm:ss, such as 08 04 2020 16:07:00." }
    send:
      - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: PUT, path: /apis/datetime, content_type: application/json,
          body: '{"timezone":{timezone:json},"ntp":false,"time_text":{time:json}}' }
      - { models: [makito-x4-decoder], method: PUT, path: /apis/datetime, content_type: application/json,
          body: '{"timezone":{timezone:json},"ntp":0,"time_text":{time:json}}' }
      - { method: GET, path: /apis/datetime }
    expect: *ok
    returns: ack

  set_ptp:
    summary: "Set PTP for the ST 2110 personality (PUT /apis/datetime domainNumber, announcementInterval, announcementTimeout, delayMechanism, syncInterval)"
    params:
      domain: { type: int, min: 0, max: 255, required: true, label: Domain, description: "The PTP domain number." }
      announce_interval: { type: int, min: -3, max: 1, required: true, label: Announce interval, description: "Announce interval as a power of two of a second: -3 125 ms, -2 250 ms, -1 500 ms, 0 1 s, 1 2 s." }
      announce_timeout: { type: int, min: 1, required: true, label: Announce timeout, description: "Announce intervals without a message before the master is taken as lost." }
      delay_mechanism: { type: enum, values: [auto, e2e, p2p], required: true, label: Delay mechanism, description: "auto, end-to-end or peer-to-peer delay measurement." }
      sync_interval: { type: int, min: -7, max: 1, required: true, label: Sync interval, description: "Sync interval as a power of two of a second, from -7 (7.8125 ms) to 1 (2 s)." }
    send:
      - { method: PUT, path: /apis/datetime, content_type: application/json,
          body: '{"domainNumber":{domain},"announcementInterval":{announce_interval},"announcementTimeout":{announce_timeout},"delayMechanism":{delay_mechanism:map.ptp_delay},"syncInterval":{sync_interval}}' }
      - { method: GET, path: /apis/datetime }
    expect: *ok
    returns: ack

  validate_ntp_server:
    summary: "Check an NTP server before using it (POST /apis/ntpvalidate); returns {error, apply, warning, shortmsg, message}, apply true when it may be set"
    params:
      server: { type: string, required: true, max_length: 253, label: NTP server, description: "The server's address or host name." }
    send: { method: POST, path: /apis/ntpvalidate, content_type: application/json, body: '{"server":{server:json}}' }
    expect: *read
    returns: value

  validate_hostname:
    summary: "Check that a host name or address resolves, for a use (POST /apis/hostnamevalidate/{use}); returns {error, success, message, shortmsg}"
    params:
      use: { type: string, required: true, max_length: 32, pattern: "^[a-z0-9]+$", label: Use, description: "What the name is for, such as audit or stream." }
      hostname: { type: string, required: true, max_length: 253, label: Host name, description: "The host name or address to check." }
    send: { method: POST, path: "/apis/hostnamevalidate/{use}", content_type: application/json, body: '{"hostname":{hostname:json}}' }
    expect: *read
    returns: value

  get_nmos:
    summary: "NMOS node and registry settings (GET /apis/nmos)"
    send: { method: GET, path: /apis/nmos }
    expect: *read
    returns: value

  configure_nmos:
    summary: "Set NMOS (PUT /apis/nmos)"
    params:
      node_port: { type: int, min: 0, max: 65535, required: true, label: Node port, description: "The NMOS node's port; 0 restores the default, 8001." }
      mode: { type: enum, values: [manual, automatic], required: true, label: Registry, description: "manual uses the IS-04 address below, automatic discovers the registry." }
      is04_address: { type: string, default: "", max_length: 64, label: IS-04 address, description: "The IS-04 registry's IPv4 address (manual)." }
      is04_port: { type: int, min: 0, max: 65535, default: 0, label: IS-04 port, description: "The IS-04 registry's port (manual)." }
      is09: { type: bool, default: false, label: IS-09, description: "Whether system parameters are taken from an IS-09 server." }
      is09_address: { type: string, default: "", max_length: 64, label: IS-09 address, description: "The IS-09 server's IPv4 address." }
      is09_port: { type: int, min: 0, max: 65535, default: 0, label: IS-09 port, description: "The IS-09 server's port." }
      version: { type: string, default: "1.3", max_length: 8, label: Registry version, description: "The registry API version, such as 1.3." }
    send:
      - { method: PUT, path: /apis/nmos, content_type: application/json,
          body: '{"nodePort":{node_port},"mode":"{mode}","is04Address":{is04_address:json},"is04Port":{is04_port},"is09":{is09},"is09Address":{is09_address:json},"is09Port":{is09_port},"version":{version:json}}' }
      - { method: GET, path: /apis/nmos }
    expect: *ok
    returns: ack

  get_services:
    summary: "Which services are asked to be on, and their interfaces (GET /apis/services)"
    send: { method: GET, path: /apis/services }
    expect: *read
    returns: value

  get_services_status:
    summary: "Which services are asked to be on and which are running (GET /apis/services/status); slower than get_services"
    send: { method: GET, path: /apis/services/status }
    expect: *read
    returns: value

  set_service:
    summary: "Turn one service on or off (PUT /apis/services with that service alone); turning off HTTP ends the API"
    params:
      service: { type: enum, values: [http, ssh, telnet, snmp, ems, rtsp, onvif, preview, passthrough], required: true, label: Service, description: "The service: web and API (http), SSH, Telnet, SNMP, EMS, RTSP server, ONVIF, preview images or serial pass-through (rugged encoder)." }
      enabled: { type: bool, required: true, label: "On", description: "Whether the service runs." }
    send:
      - { method: PUT, path: /apis/services, content_type: application/json, body: '{"{service}":{enabled:bool01}}' }
      - { method: GET, path: /apis/services/status }
    expect: *ok
    returns: ack

  set_service_interface:
    summary: "Choose the network interfaces a service listens on, on a dual-interface unit (PUT /apis/services nic)"
    params:
      service: { type: enum, values: [http, ssh, telnet, snmp, nmos, ems, rtsp, onvif, passthrough], required: true, label: Service, description: "The service." }
      interface: { type: enum, values: [all, eth0, eth1], required: true, label: Interface, description: "Both interfaces, or eth0 or eth1 alone." }
    send:
      - { method: PUT, path: /apis/services, content_type: application/json, body: '{"nic":{"{service}":"{interface}"}}' }
      - { method: GET, path: /apis/services/status }
    expect: *ok
    returns: ack

  set_passthrough:
    summary: "Turn on serial pass-through on a TCP port (PUT /apis/services passthrough, passthroughPort)"
    params:
      port: { type: int, min: 1, max: 65535, required: true, label: TCP port, description: "The TCP port that carries the serial port's data." }
    send:
      - { method: PUT, path: /apis/services, content_type: application/json, body: '{"passthrough":1,"passthroughPort":{port}}' }
      - { method: GET, path: /apis/services/status }
    expect: *ok
    returns: ack

  restart_service:
    summary: "Restart a service (PUT /apis/services/{service}/restart)"
    params:
      service: { type: enum, values: [http, ssh, telnet, snmp, nmos, ems, rtsp, onvif, passthrough, preview], required: true, label: Service, description: "The service to restart." }
    send:
      - { method: PUT, path: "/apis/services/{service}/restart" }
      - { method: GET, path: /apis/services/status }
    expect: *ok
    returns: ack

  get_ems:
    summary: "Pairing with a Haivision EMS server (GET /apis/ems)"
    send: { method: GET, path: /apis/ems }
    expect: *read
    returns: value

  decode_ems_pairing_code:
    summary: "Read the server, port and keep-alive a pairing code holds (PUT /apis/ems/decode)"
    params:
      code: &pairing { type: string, required: true, max_length: 1024, label: Pairing code, description: "The code from the EMS server's pairing dialog." }
    send: { method: PUT, path: /apis/ems/decode, content_type: application/json, body: '{"pairingCode":{code:json}}' }
    expect: *read
    returns: value

  pair_ems:
    summary: "Pair with an EMS server (PUT /apis/ems/pair)"
    params:
      code: *pairing
      hostname: { type: string, required: true, max_length: 253, label: Server, description: "The EMS server's address or host name." }
      port: { type: int, min: 1, max: 65535, default: 8883, label: Port, description: "The EMS server's port." }
      keepalive: { type: int, min: 0, required: true, label: Keep-alive, description: "Keep-alive in seconds, as the pairing code gives it." }
    send:
      - { method: PUT, path: /apis/ems/pair, content_type: application/json,
          body: '{"emsPort":{port},"pairingCode":{code:json},"emsHostname":{hostname:json},"emsKeepalive":{keepalive}}' }
      - { method: GET, path: /apis/ems }
    expect: *ok
    returns: ack

  unpair_ems:
    summary: "Unpair from the EMS server (PUT /apis/ems/unpair)"
    send:
      - { method: PUT, path: /apis/ems/unpair }
      - { method: GET, path: /apis/ems }
    expect: *ok
    returns: ack

  get_preview_service:
    summary: "Preview image settings (GET /apis/services/preview)"
    send: { method: GET, path: /apis/services/preview }
    expect: *read
    returns: value

  set_preview_service:
    summary: "Turn input preview images on or off and set their interval (PUT /apis/services/preview)"
    params:
      enabled: { type: bool, required: true, label: "On", description: "Whether preview images of the inputs are made." }
      interval: { type: int, min: 1, max: 60, required: true, label: Interval, description: "Seconds between preview images." }
    send:
      - { method: PUT, path: /apis/services/preview, content_type: application/json, body: '{"enabled":{enabled},"interval":{interval}}' }
      - { method: GET, path: /apis/services/preview }
    expect: *ok
    returns: ack

  set_decoder_preview_service:
    summary: "Turn decoder preview images on or off and set each decoder's interval (PUT /apis/services/preview enabled, decoders)"
    params:
      enabled: { type: bool, required: true, label: "On", description: "Whether preview images of the decoders are made." }
      decoders: { type: json, required: true, label: Decoders, description: "JSON array with one {interval, enabled} per decoder, decoder 0 first, interval in minutes." }
    send:
      - { method: PUT, path: /apis/services/preview, content_type: application/json, body: '{"enabled":{enabled},"decoders":{decoders}}' }
      - { method: GET, path: /apis/services/preview }
    expect: *ok
    returns: ack

  get_comport:
    summary: "The serial port's mode and line settings (GET /apis/comport)"
    send: { method: GET, path: /apis/comport }
    expect: *read
    returns: value

  set_comport_mode:
    summary: "Choose what the serial port does (PUT /apis/comport mode)"
    params:
      mode: { type: enum, values: [serial, metadata, passthrough], required: true, label: Mode, description: "serial for the console, metadata for a metadata source, passthrough to carry it over TCP (set_passthrough)." }
    send:
      - { method: PUT, path: /apis/comport, content_type: application/json, body: '{"mode":{mode:map.comport_mode}}' }
      - { method: GET, path: /apis/comport }
    expect: *ok
    returns: ack

  set_comport_baud_rate:
    summary: "Set the serial port's baud rate, in pass-through mode only (PUT /apis/comport baudRate)"
    params:
      baud_rate: { type: enum, values: ["1200", "2400", "4800", "9600", "19200", "38400", "57600", "115200"], required: true, label: Baud rate, description: "The serial line's speed in bit/s." }
    send:
      - { method: PUT, path: /apis/comport, content_type: application/json, body: '{"baudRate":{baud_rate}}' }
      - { method: GET, path: /apis/comport }
    expect: *ok
    returns: ack

  # ── Presets ────────────────────────────────────────────────────────────
  list_presets:
    summary: "Every preset, the active and startup ones and autosave (GET /apis/presets)"
    send: { method: GET, path: /apis/presets }
    expect: *read
    returns: value

  create_preset:
    summary: "Save the unit's current configuration as a new preset (POST /apis/presets)"
    params:
      name: &preset { type: string, required: true, max_length: 128, pattern: "^[^/\\\\]+$", label: Preset, description: "The preset's file name, such as show.cfg." }
      startup: { type: bool, default: false, label: Startup, description: "Whether the unit loads it when it starts." }
      make_active: { type: bool, default: false, label: Make active, description: "Whether it becomes the active preset." }
    send:
      - { method: POST, path: /apis/presets, content_type: application/json,
          body: '{"name":{name:json},"startup":{startup},"changeActive":{make_active}}' }
      - { method: GET, path: /apis/presets }
    expect: *ok
    returns: ack

  upload_preset:
    summary: "Upload a preset file (POST /apis/presets, multipart file)"
    params:
      file: { type: binary, required: true, label: Preset file, description: "A preset file saved from a unit." }
      name: *preset
    send:
      - { method: POST, path: /apis/presets,
          multipart: [{ name: file, binary: file, filename: "{name}", content_type: application/octet-stream }] }
      - { method: GET, path: /apis/presets }
    expect: *ok
    returns: ack

  set_preset_autosave:
    summary: "Turn preset autosave on or off (PUT /apis/presets autosave)"
    params:
      enabled: { type: bool, required: true, label: Autosave, description: "On saves every change into the active preset as it is made." }
    send:
      - { method: PUT, path: /apis/presets, content_type: application/json, body: '{"autosave":{enabled}}' }
      - { method: GET, path: /apis/presets }
    expect: *ok
    returns: ack

  set_preset_startup:
    summary: "Mark a preset as the startup preset or not (PUT /apis/presets/{name} startup)"
    params:
      name: *preset
      startup: { type: bool, required: true, label: Startup, description: "Whether the unit loads this preset when it starts." }
    send:
      - { method: PUT, path: "/apis/presets/{name}", content_type: application/json, body: '{"startup":{startup}}' }
      - { method: GET, path: /apis/presets }
    expect: *ok
    returns: ack

  make_startup_preset:
    summary: "Make a preset the startup preset (PUT /apis/presets/{name}/startup)"
    params:
      name: *preset
    send:
      - { method: PUT, path: "/apis/presets/{name}/startup" }
      - { method: GET, path: /apis/presets }
    expect: *ok
    returns: ack

  load_preset:
    summary: "Load a preset, replacing the running configuration (PUT /apis/presets/{name}/load); with autosave on it also becomes the startup preset"
    params:
      name: *preset
    send:
      - { method: PUT, path: "/apis/presets/{name}/load" }
      - { method: GET, path: /apis/presets }
    expect: *ok
    returns: ack

  duplicate_preset:
    summary: "Copy a preset as \"<name> - Copy\" (PUT /apis/presets/{name}/duplicate)"
    params:
      name: *preset
    send:
      - { method: PUT, path: "/apis/presets/{name}/duplicate" }
      - { method: GET, path: /apis/presets }
    expect: *ok
    returns: ack

  rename_preset:
    summary: "Rename a preset (PUT /apis/presets/{name}/rename)"
    params:
      name: *preset
      new_name: { type: string, required: true, max_length: 128, label: New name, description: "The new name; the unit adds .cfg." }
      overwrite: { type: bool, default: false, label: Overwrite, description: "Whether a preset already of that name is replaced." }
    send:
      - { method: PUT, path: "/apis/presets/{name}/rename", content_type: application/json,
          body: '{"name":{new_name:json},"overwriteIfAlreadyExists":{overwrite}}' }
      - { method: GET, path: /apis/presets }
    expect: *ok
    returns: ack

  delete_preset:
    summary: "Delete a preset (DELETE /apis/presets/{name})"
    params:
      name: *preset
    send:
      - { method: DELETE, path: "/apis/presets/{name}" }
      - { method: GET, path: /apis/presets }
    expect: *ok
    returns: ack

  check_preset_saved:
    summary: "Whether every change is saved in the active preset (PUT /apis/presets/current/issaved on the encoder, GET on the decoder); presets.saved reads it"
    send:
      - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: PUT, path: /apis/presets/current/issaved }
      - { models: [makito-x4-decoder], method: GET, path: /apis/presets/current/issaved }
    expect: *read
    returns: value

  # ── Streams ────────────────────────────────────────────────────────────
  list_streams:
    summary: "Every stream with its configuration and statistics (GET /apis/streams)"
    send: { method: GET, path: /apis/streams }
    expect: *read
    returns: value

  get_stream:
    summary: "One stream's configuration and statistics (GET /apis/streams/{id})"
    params:
      id: &stream { type: int, min: 0, required: true, label: Stream, description: "The stream's id, as list_streams gives it." }
    send: { method: GET, path: "/apis/streams/{id}" }
    expect: *read
    returns: value

  create_stream:
    summary: "Create a stream (POST /apis/streams) from the API's stream object: on the encoder name, encapsulation (2 TS/UDP, 3 TS/RTP, 34 TS/SRT, 128 WHIP), address, port, video, audio, metadata and scte content lists of {id}, SRT, FEC, SAP, shaping and TS fields, url and bearerToken for WHIP; on the decoder name, encapsulation, address, port, sourceIp, SRT, srtToUdp and FEC fields"
    params:
      stream: &stream_json { type: json, required: true, label: Stream, description: "JSON stream object in the shape the unit's API reference gives for the model, such as {\"name\":\"camera 2\",\"encapsulation\":2,\"address\":\"10.65.10.175\",\"port\":12000,\"video\":[{\"id\":0}],\"audio\":[{\"id\":0}]}." }
    send:
      - { method: POST, path: /apis/streams, content_type: application/json, body: "{stream}" }
      - { method: GET, path: /apis/streams }
    expect: *ok
    returns: ack

  configure_stream:
    summary: "Change a stream (PUT /apis/streams/{id}) with the API's stream object, as for create_stream"
    params:
      id: *stream
      stream: *stream_json
    send:
      - { method: PUT, path: "/apis/streams/{id}", content_type: application/json, body: "{stream}" }
      - { method: GET, path: /apis/streams }
    expect: *ok
    returns: ack

  delete_stream:
    summary: "Delete a stream (DELETE /apis/streams/{id})"
    params:
      id: *stream
    send:
      - { method: DELETE, path: "/apis/streams/{id}" }
      - { method: GET, path: /apis/streams }
    expect: *ok
    returns: ack

  start_stream:
    summary: "Start a stream (PUT /apis/streams/{id}/start)"
    params:
      id: *stream
    send:
      - { method: PUT, path: "/apis/streams/{id}/start" }
      - { method: GET, path: /apis/streams }
    expect: *ok
    returns: ack

  stop_stream:
    summary: "Stop a stream (PUT /apis/streams/{id}/stop)"
    params:
      id: *stream
    send:
      - { method: PUT, path: "/apis/streams/{id}/stop" }
      - { method: GET, path: /apis/streams }
    expect: *ok
    returns: ack

  get_stream_srt_csv:
    summary: "A stream's SRT statistics history as CSV text (GET /apis/streams/{id}/stats?type=srt&interval=...)"
    params:
      id: *stream
      interval: { type: enum, values: [last5min, last60min, last24hours], required: true, label: Period, description: "The period of history returned." }
    send: { method: GET, path: "/apis/streams/{id}/stats", query: { type: srt, interval: "{interval}" } }
    expect: { status: 200 }
    returns: text

  get_stream_srt_csv_path:
    summary: "One redundancy path's SRT statistics history as CSV text (GET /apis/streams/{id}/stats?type=srt&interval=...&redundancyPath=...), for a stream with SRT redundancy"
    params:
      id: *stream
      interval: { type: enum, values: [last5min, last60min, last24hours], required: true, label: Period, description: "The period of history returned." }
      path: { type: int, min: 1, max: 2, required: true, label: Path, description: "Redundancy path 1 or 2." }
    send: { method: GET, path: "/apis/streams/{id}/stats", query: { type: srt, interval: "{interval}", redundancyPath: "{path}" } }
    expect: { status: 200 }
    returns: text

  # ── Recordings (encoder 1.10) ──────────────────────────────────────────
  get_recording:
    summary: "A stream's recording (GET /apis/recordings/{id}); the id is the stream's"
    params:
      id: &recording { type: int, min: 0, required: true, label: Stream, description: "The id of the stream recorded, as list_streams gives it." }
    send: { method: GET, path: "/apis/recordings/{id}" }
    expect: *read
    returns: value

  create_recording:
    summary: "Record a stream to the unit's storage (POST /apis/recordings)"
    params:
      id: *recording
      name: &rec_name { type: string, required: true, max_length: 128, label: Name, description: "The recording's name, which prefixes its files." }
      auto_start: &rec_auto { type: bool, default: true, label: Start with the stream, description: "Whether the recording starts whenever the stream does." }
      limit: &rec_limit { type: enum, values: [none, size, time], default: none, label: Limit, description: "Whether the recording stops at a size, at a time, or not at all." }
      limit_value: &rec_limit_value { type: int, min: 0, default: 0, label: Limit value, description: "The limit in KB (size) or seconds (time); ignored without a limit." }
      segments: &rec_segments { type: enum, values: ["0", size, time], default: "0", label: Segments, description: "Split the recording by size or time, or 0 for one file." }
      segment_value: &rec_segment_value { type: int, min: 0, default: 0, label: Segment value, description: "The segment length in KB (size) or seconds (time)." }
      recycle: &rec_recycle { type: bool, default: false, label: Recycle segments, description: "Whether the oldest segments are reused once the limit is reached." }
    send:
      - { method: POST, path: /apis/recordings, content_type: application/json,
          body: '{"streamId":{id},"autoStart":{auto_start},"format":"ts","name":{name:json},"limitType":"{limit}","limitSize":"{limit_value}","segmentType":"{segments}","segmentSize":"{segment_value}","recycleSegments":{recycle}}' }
      - { method: GET, path: /apis/streams }
    expect: *ok
    returns: ack

  configure_recording:
    summary: "Change a stream's recording (PUT /apis/recordings/{id})"
    params:
      id: *recording
      name: *rec_name
      auto_start: *rec_auto
      limit: *rec_limit
      limit_value: *rec_limit_value
      segments: *rec_segments
      segment_value: *rec_segment_value
      recycle: *rec_recycle
    send:
      - { method: PUT, path: "/apis/recordings/{id}", content_type: application/json,
          body: '{"streamId":{id},"autoStart":{auto_start},"format":"ts","name":{name:json},"limitType":"{limit}","limitSize":"{limit_value}","segmentType":"{segments}","segmentSize":"{segment_value}","recycleSegments":{recycle}}' }
      - { method: GET, path: /apis/streams }
    expect: *ok
    returns: ack

  start_recording:
    summary: "Start a stream's recording (PUT /apis/recordings/{id}/start)"
    params:
      id: *recording
    send:
      - { method: PUT, path: "/apis/recordings/{id}/start" }
      - { method: GET, path: /apis/streams }
    expect: *ok
    returns: ack

  stop_recording:
    summary: "Stop a stream's recording (PUT /apis/recordings/{id}/stop)"
    params:
      id: *recording
    send:
      - { method: PUT, path: "/apis/recordings/{id}/stop" }
      - { method: GET, path: /apis/streams }
    expect: *ok
    returns: ack

  delete_recording:
    summary: "Remove a stream's recording (DELETE /apis/recordings/{id})"
    params:
      id: *recording
    send:
      - { method: DELETE, path: "/apis/recordings/{id}" }
      - { method: GET, path: /apis/streams }
    expect: *ok
    returns: ack

  # ── Video encoders and inputs (encoder) ────────────────────────────────
