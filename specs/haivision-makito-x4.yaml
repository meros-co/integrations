  services.passthrough.interface: { type: string, description: "Interfaces the passthrough service listens on: all, eth0 or eth1 (dual-interface units)" }
  services.passthrough.port: { type: int, description: "Serial pass-through TCP port (rugged encoder)" }
  services.passthrough.configured: { type: bool, description: "The serial port is set for pass-through (rugged encoder)" }
  # Preview images (GET /apis/services/preview)
  preview.enabled: { type: bool, description: "Preview images on" }
  preview.interval_s: { type: int, unit: "s", description: "Interval, 1 to 60 (encoder)" }
  preview.width: { type: int, unit: "px", description: "Image width (encoder)" }
  preview.height: { type: int, unit: "px", description: "Image height (encoder)" }
  preview.decoders: { type: string, description: "Per decoder (decoder) as JSON text: a list of {interval, enabled, width, height}, interval in minutes" }
  # Snapshots (encoder)
  snapshots.settings.quality: { type: int, description: "Image quality, 1 to 100" }
  snapshots.settings.format: { type: string, description: "png or jpg" }
  snapshots.settings.last_input: { type: int, description: "Video input of the last snapshot" }
  snapshots.settings.system_type: { type: string, description: "System type, such as SDI" }
  snapshots.settings.max_storage_kb: { type: int, unit: "KB", description: "Space kept for snapshots" }
  snapshots.files.*.created: { type: string, description: "When the snapshot was taken, as the unit words it" }
  snapshots.files.*.age_s: { type: int, unit: "s", description: "Age of the snapshot" }
  # Logos (encoder, DEFENSE personality)
  logos.files.*.modified: { type: int, unit: "s", description: "When the file last changed, Unix time" }
  logos.files.*.thumbnail: { type: string, description: "Path of the logo's thumbnail on the unit" }
  logos.interfaces.*.display: { type: bool, description: "Logo shown on the interface" }
  logos.interfaces.*.interface_name: { type: string, description: "Interface name, such as BNC-1" }
  logos.interfaces.*.opacity: { type: int, unit: "%", description: "Opacity, 0 to 100" }
  logos.interfaces.*.scaling: { type: int, unit: "%", description: "Scaling, 25 to 400" }
  logos.interfaces.*.relative: { type: bool, description: "Scaling kept relative across resolutions" }
  logos.interfaces.*.positioning: { type: int, description: "0 bottom right, 1 top right, 2 bottom left, 3 top left, 4 centered, 5 absolute, 6 relative" }
  logos.interfaces.*.x: { type: int, description: "X position (absolute 0 to 3839, relative 0 to 1920)" }
  logos.interfaces.*.y: { type: int, description: "Y position (absolute 0 to 2159, relative 0 to 1080)" }
  logos.interfaces.*.file: { type: string, description: "Logo shown, without extension" }
  # Serial port (GET /apis/comport, rugged encoder)
  comport.mode: { type: int, description: "0 serial, 1 metadata, 2 pass-through" }
  comport.standard: { type: int, description: "Serial standard code" }
  comport.baud_rate: { type: int, description: "Baud rate" }
  comport.flow_control: { type: int, description: "Flow control code" }
  comport.parity: { type: int, description: "Parity code" }
  comport.stop_bits: { type: int, description: "Stop bits" }
  comport.data_bits: { type: int, description: "Data bits" }
  comport.passthrough_active: { type: bool, description: "Pass-through active" }
  # EMS (GET /apis/ems)
  ems.state: { type: string, description: "CONNECTED, CONNECTING, PAIRING, PAIRED, UNPAIRED or UNKNOWN" }
  ems.port: { type: int, description: "EMS server port" }
  ems.unpairing: { type: bool, description: "Unpairing, whatever the state" }
  ems.hostname: { type: string, description: "EMS server address or host name" }
  ems.service_enabled: { type: bool, description: "EMS service on" }
  ems.device_id: { type: string, description: "Device ID the server assigned" }
  ems.keepalive_s: { type: int, unit: "s", description: "Keep-alive" }
  ems.last_pairing_error: { type: string, description: "Last pairing error, empty for none" }
  # Status LED (GET /apis/leds)
  leds.status: { type: string, description: "Status LED color, such as Green" }
  leds.blinking_stops_in: { type: string, description: "Time left blinking, such as 14m55s" }
  # Presets (GET /apis/presets); keyed by file name
  presets.files.*.startup: { type: bool, description: "The startup preset" }
  presets.files.*.modified: { type: int, unit: "s", description: "When the preset last changed, Unix time" }
  presets.autosave: { type: bool, description: "Changes saved to the active preset as they are made" }
  presets.active: { type: string, description: "Active preset file name" }
  presets.active_is_startup: { type: bool, description: "The active preset is the startup preset" }
  presets.active_modified: { type: bool, description: "The active preset has unsaved changes (without autosave)" }
  presets.saved: { type: bool, description: "Everything is saved in the active preset (check_preset_saved)" }
  # Accounts (GET /apis/accounts); keyed by user name
  accounts.*.role: { type: string, description: "Administrator, Operator or Guest" }
  accounts.*.state: { type: int, description: "0 active, 1 locked, 2 disabled" }
  accounts.*.expiration: { type: int, description: "0 never expires, -1 expired by an administrator, otherwise the expiry day (days since 1970-01-01)" }
  accounts.*.expiration_days: { type: int, description: "Days until expiry, negative when expired that long ago" }
  accounts.*.password_set: { type: bool, description: "A password is set" }
  accounts.*.public_keys: { type: string, description: "SSH public keys as JSON text: a list of {name, fingerprint}" }
  # Security policies (GET /apis/policies)
  policies.min_length: { type: int, description: "Least password length" }
  policies.quality: { type: string, description: "Password quality: Basic or Strong" }
  policies.uppercase: { type: int, description: "Upper-case letters required (Strong)" }
  policies.digits: { type: int, description: "Digits required (Strong)" }
  policies.symbols: { type: int, description: "Symbols required (Strong)" }
  policies.remembered_passwords: { type: int, description: "Earlier passwords refused, 5 to 500 (Strong)" }
  policies.minimum_lifetime_days: { type: int, unit: "d", description: "Days before a password may change again, 0 for none (Strong)" }
  policies.expiration: { type: bool, description: "Passwords expire" }
  policies.expiration_days: { type: int, unit: "d", description: "Days before a password expires" }
  policies.hsts: { type: bool, description: "HTTP Strict Transport Security" }
  policies.auto_logout: { type: bool, description: "Idle sessions signed out" }
  policies.auto_logout_min: { type: int, unit: "min", description: "Idle time before sign-out" }
  policies.limit_retries: { type: bool, description: "Failed sign-ins limited" }
  policies.limit_retries_attempts: { type: int, description: "Failed sign-ins allowed, 3 to 10" }
  policies.limit_retries_interval: { type: int, description: "Interval of the failed sign-in limit, 5 to 60" }
  policies.inactive_lock: { type: bool, description: "Unused accounts locked" }
  policies.inactive_lock_days: { type: int, unit: "d", description: "Days unused before an account is locked" }
  policies.compliance: { type: string, description: "NONE, FIPS140, NDPP11, SP800-52r2 or SP800-52r1" }
  policies.ssl3: { type: bool, description: "SSL 3 allowed" }
  policies.tls1_0: { type: bool, description: "TLS 1.0 allowed" }
  policies.tls1_1: { type: bool, description: "TLS 1.1 allowed" }
  policies.tls1_2: { type: bool, description: "TLS 1.2 allowed" }
  # Audit log server (GET /apis/audit)
  audit.enabled: { type: bool, description: "Audit messages sent to a server" }
  audit.transport: { type: string, description: "UDP or TLS" }
  audit.server: { type: string, description: "Audit server address or host name" }
  audit.trusted: { type: string, description: "Certificate trust: All, CA-signed or Self-signed" }
  audit.fingerprint: { type: string, description: "Server certificate fingerprint (Self-signed)" }
  # Sign-in banner (GET /apis/banner)
  banner.enabled: { type: bool, description: "Banner shown before sign-in" }
  banner.text: { type: string, description: "Banner text with HTML character references, as the unit gives it" }
  # Certificates (GET /apis/ca, /apis/identity); keyed by certificate id
  certificates.ca.*.name: { type: string, description: "Certificate name" }
  certificates.ca.*.type: { type: string, description: "CA" }
  certificates.ca.*.default: { type: bool, description: "The default" }
  certificates.identity.*.name: { type: string, description: "Certificate name" }
  certificates.identity.*.type: { type: string, description: "CSR or Self-signed" }
  certificates.identity.*.default: { type: bool, description: "The identity in use" }
  # Licenses
  license.features.*.value: { type: string, description: "The feature's value, such as On, a count or a release" }
  license.features.*.category: { type: string, description: "Category: system, avin, video, audio, metadata, adinsertion, stream or misc" }
  license.files.*.name: { type: string, description: "License file name" }
  # Firmware upgrade (GET /apis/upgrade)
  upgrade.package: { type: string, description: "Package ready to install at the next reboot, empty for none" }
  upgrade.current_version: { type: string, description: "Firmware version running" }
  # System messages (GET /apis/messages, encoder)
  messages.text: { type: string, description: "Recent system messages, lines separated by the HTML reference for a line feed" }
  # Session (GET /apis/authentication)
  session.username: { type: string, description: "User the session is for" }
  session.uid: { type: int, description: "User id" }
  session.gid: { type: int, description: "Group id" }
  session.password_expired: { type: bool, description: "The user's password has expired" }

telemetry:
  # Nothing is pushed: four poll groups, and every write reads back the list
  # it changed (its second message), so its rules below apply at once.
  poll:
    # What moves during a show: streams, encoders, decoders.
    - every_ms: 2000
      send:
        - { method: GET, path: /apis/streams }
        - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: GET, path: /apis/videnc }
        - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: GET, path: /apis/audenc }
        - { models: [makito-x4-decoder], method: GET, path: /apis/decoders }
    # Health, inputs, sources and the active preset.
    - every_ms: 5000
      send:
        - { method: GET, path: /apis/status }
        - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: GET, path: /apis/vidin }
        - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: GET, path: /apis/metadata }
        - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: GET, path: /apis/scte }
        - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: GET, path: /apis/essences }
        - { models: [makito-x4-decoder], method: GET, path: /apis/st2110 }
        - { method: GET, path: /apis/leds }
        - { method: GET, path: /apis/presets }
        - { method: GET, path: /apis/services/status }
        - { method: GET, path: /apis/ems }
    # Configuration an operator changes.
    - every_ms: 30000
      send:
        - { method: GET, path: /apis/system_info }
        - { method: GET, path: /apis/network }
        - { method: GET, path: /apis/datetime }
        - { method: GET, path: /apis/nmos }
        - { method: GET, path: /apis/services/preview }
        - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: GET, path: /apis/snapshotsettings }
        - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: GET, path: /apis/snapshots }
        - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: GET, path: /apis/logos }
        - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: GET, path: /apis/logosettings }
        - { models: [makito-x4-encoder, makito-x4-rugged-encoder], method: GET, path: /apis/messages }
        - { models: [makito-x4-rugged-encoder], method: GET, path: /apis/comport }
        - { method: GET, path: /apis/upgrade }
        - { method: GET, path: /apis/authentication }
    # Administration.
    - every_ms: 120000
      send:
        - { method: GET, path: /apis/accounts }
        - { method: GET, path: /apis/policies }
        - { method: GET, path: /apis/audit }
        - { method: GET, path: /apis/banner }
        - { method: GET, path: /apis/ca }
        - { method: GET, path: /apis/identity }
        - { method: GET, path: /apis/license }
        - { method: GET, path: /apis/licenses }
  updates:
    - path: '^/apis/status$'
      json:
        card_status: "$.cardStatus"
        serial: "$.serialNumber"
        hwcompat: "$.hardwareCompatibility"
        hwrev: "$.hardwareRevision"
        cpld: "$.cpldRevision"
        boot: "$.bootVersion"
        card_type: "$.cardType"
        part: "$.partNumber"
        fw_date: "$.firmwareDate"
        fw: "$.firmwareVersion"
        fw_opts: "$.firmwareOptions"
        uptime: "$.uptime"
        uptime_s: "$.uptimeSec"
        httpd: "$.httpdUptime"
        load: "$.chipsetLoad"
        temp: "$.temperature"
        cpu: "$.cpu"
        ram: "$.ram"
      state:
        "system.card_status": "{card_status}"
        "system.serial_number": "{serial}"
        "system.hardware_compatibility": "{hwcompat}"
        "system.hardware_revision": "{hwrev}"
        "system.cpld_revision": "{cpld}"
        "system.boot_version": "{boot}"
        "system.card_type": "{card_type}"
        "system.part_number": "{part}"
        "system.firmware_date": "{fw_date}"
        "system.firmware_version": "{fw}"
        "system.firmware_options": "{fw_opts}"
        "system.uptime": "{uptime}"
        "system.uptime_s": "{uptime_s}"
        "system.httpd_uptime_s": "{httpd}"
        "system.chipset_load": "{load}"
        "system.temperature": "{temp}"
        "system.cpu": "{cpu}"
        "system.ram": "{ram}"
    - path: '^/apis/system_info$'
      json:
        analytics: "$.analytics"
        caps: "$.capabilities"
        ip: "$.deviceIp"
        domain: "$.domainName"
        hostname: "$.hostname"
        fqdn: "$.fqdn"
        device_name: "$.deviceName"
        venc: "$.videoEncoders"
        aenc: "$.audioEncoders"
        vdec: "$.videoDecoders"
        adec: "$.audioDecoders"
        max_src: "$.maxStreamContentSources"
        features: "$.features"
        hevc: "$.hevc"
        yuv10: "$.yuv10bit"
        yuv422: "$.yuv422"
        snapshot: "$.snapshot"
        rugged: "$.rugged"
        storage: "$.storage"
        vin: "$.videoInputs"
        ain: "$.audioInputs"
        com: "$.COMPorts"
        licensed: "$.licensed"
        onvif: "$.onvif"
        scte: "$.scte"
        eth1: "$.hasEth1"
        hdr: "$.hasHDR"
        hdcp: "$.hasHDCP"
        srtid: "$.hasSrtStreamId"
        srt: "$.hasSRT"
        srtred: "$.hasSrtRedundancy"
        lic2110: "$.has2110license"
        sqd: "$.hasSQD"
        logo: "$.hasLogo"
        version: "$.version"
        fips: "$.isFipsEnabled"
        pers: "$.personality"
        next_pers: "$.nextPersonality"
      state:
        "info.analytics": "{analytics}"
        "info.capabilities": "{caps}"
        "info.device_ip": "{ip}"
        "info.domain_name": "{domain}"
        "info.hostname": "{hostname}"
        "info.fqdn": "{fqdn}"
        "info.device_name": "{device_name}"
        "info.video_encoders": "{venc}"
        "info.audio_encoders": "{aenc}"
        "info.video_decoders": "{vdec}"
        "info.audio_decoders": "{adec}"
        "info.max_stream_content_sources": "{max_src}"
        "info.features": "{features}"
        "info.hevc": { value: "{hevc}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.yuv_10bit": { value: "{yuv10}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.yuv_422": { value: "{yuv422}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.snapshot": "{snapshot}"
        "info.rugged": { value: "{rugged}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.storage": { value: "{storage}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.video_inputs": "{vin}"
        "info.audio_inputs": "{ain}"
        "info.com_ports": "{com}"
        "info.licensed": { value: "{licensed}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.onvif_licensed": { value: "{onvif}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.scte_licensed": { value: "{scte}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.has_eth1": { value: "{eth1}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.has_hdr": { value: "{hdr}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.has_hdcp": { value: "{hdcp}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.has_srt_stream_id": { value: "{srtid}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.has_srt": { value: "{srt}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.has_srt_redundancy": { value: "{srtred}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.has_2110_license": { value: "{lic2110}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.has_sqd": { value: "{sqd}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.has_logo": { value: "{logo}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.version": "{version}"
        "info.fips": { value: "{fips}", map: { "true": true, "false": false, "1": true, "0": false } }
        "info.personality": "{pers}"
        "info.next_personality": "{next_pers}"
    # Every stream, configuration and statistics; the list replaces what was there.
    - path: '^/apis/streams$'
      json_each: "$.data"
      json:
        id: "$.info.id"
        name: "$.info.name"
        encap: "$.info.encapsulation"
        user_data: "$.info.userData"
        address: "$.info.address"
        port: "$.info.port"
        nic: "$.info.networkInterface"
        latency: "$.info.latency"
        srt_mode: "$.info.srtMode"
        src_port: "$.info.sourcePort"
        pp_set: "$.info.passphraseSet"
        auth: "$.info.authentication"
        idtype: "$.info.srtAccessControlPublishingIdType"
        res_name: "$.info.srtAccessResourceName"
        user_name: "$.info.srtAccessUserName"
        pub_id: "$.info.srtAccessPublishingID"
        second_port: "$.info.srtListenerSecondPort"
        red_mode: "$.info.srtRedundancyMode"
        p1_name: "$.info.srtRedundancyPath1Name"
        p2_name: "$.info.srtRedundancyPath2Name"
        p2_nic: "$.info.srtRedundancyPath2NetworkInterface"
        p1_addr: "$.info.srtRedundancyPath1Address"
        p2_addr: "$.info.srtRedundancyPath2Address"
        p1_role: "$.info.srtRedundancyPath1Role"
        p1_port: "$.info.srtRedundancyPath1Port"
        p2_port: "$.info.srtRedundancyPath2Port"
        p1_sport: "$.info.srtRedundancyPath1SourcePort"
        p2_sport: "$.info.srtRedundancyPath2SourcePort"
        program: "$.info.programNumber"
        st_uptime: "$.stats.uptime"
        st_bitrate: "$.stats.bitrate"
        st_kbps: "$.stats.bitrateInKbps"
        st_state: "$.stats.state"
        st_reset: "$.stats.lastReset"
        srt_dmode: "$.stats.srt.detectedRedundancyMode"
        srt_peer: "$.stats.srt.peerVersion"
        srt_reconn: "$.stats.srt.reconnections"
        srt_keylen: "$.stats.srt.keyLength"
        srt_auth: "$.stats.srt.authentication"
        srt_enc: "$.stats.srt.encryption"
        srt_mss: "$.stats.srt.mss"
        srt_dpk: "$.stats.srt.droppedPackets"
        srt_dby: "$.stats.srt.droppedBytes"
        srt_maxbw: "$.stats.srt.maxBandwidth"
        srt_lport: "$.stats.srt.localPort"
        srt_pmaxbw: "$.stats.srt.pathMaxBandwidth"
        srt_lost: "$.stats.srt.lostPackets"
        srt_lver: "$.stats.srt.localVersion"
        srt_rtt: "$.stats.srt.rtt"
        srt_buf: "$.stats.srt.buffer"
        srt_lat: "$.stats.srt.latency"
        p2_peer: "$.stats.srt.path2.peerVersion"
        p2_reconn: "$.stats.srt.path2.reconnections"
        p2_dpk: "$.stats.srt.path2.droppedPackets"
        p2_dby: "$.stats.srt.path2.droppedBytes"
        p2_maxbw: "$.stats.srt.path2.maxBandwidth"
        p2_lport: "$.stats.srt.path2.localPort"
        p2_pmaxbw: "$.stats.srt.path2.pathMaxBandwidth"
        p2_lost: "$.stats.srt.path2.lostPackets"
        p2_rtt: "$.stats.srt.path2.rtt"
        p2_buf: "$.stats.srt.path2.buffer"
        p2_lat: "$.stats.srt.path2.latency"
        p2_enc: "$.stats.srt.path2.encryption"
        p2_mss: "$.stats.srt.path2.mss"
      replace: "streams"
      state:
        "streams.{id}.name": "{name}"
        "streams.{id}.encapsulation": "{encap}"
        "streams.{id}.user_data": "{user_data}"
        "streams.{id}.address": "{address}"
        "streams.{id}.port": "{port}"
        "streams.{id}.network_interface": "{nic}"
        "streams.{id}.latency_ms": "{latency}"
        "streams.{id}.srt_mode": "{srt_mode}"
        "streams.{id}.source_port": "{src_port}"
        "streams.{id}.passphrase_set": { value: "{pp_set}", map: { "true": true, "false": false, "1": true, "0": false } }
        "streams.{id}.authentication": "{auth}"
        "streams.{id}.srt_access_id_type": "{idtype}"
        "streams.{id}.srt_access_resource_name": "{res_name}"
        "streams.{id}.srt_access_user_name": "{user_name}"
        "streams.{id}.srt_access_publishing_id": "{pub_id}"
        "streams.{id}.srt_listener_second_port": "{second_port}"
        "streams.{id}.srt_redundancy_mode": "{red_mode}"
        "streams.{id}.srt_path1_name": "{p1_name}"
        "streams.{id}.srt_path2_name": "{p2_name}"
        "streams.{id}.srt_path2_network_interface": "{p2_nic}"
        "streams.{id}.srt_path1_address": "{p1_addr}"
        "streams.{id}.srt_path2_address": "{p2_addr}"
        "streams.{id}.srt_path1_role": "{p1_role}"
        "streams.{id}.srt_path1_port": "{p1_port}"
        "streams.{id}.srt_path2_port": "{p2_port}"
        "streams.{id}.srt_path1_source_port": "{p1_sport}"
        "streams.{id}.srt_path2_source_port": "{p2_sport}"
        "streams.{id}.program_number": "{program}"
