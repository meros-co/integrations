    params:
      id: *scte
    send:
      - { method: PUT, path: "/apis/scte/{id}/stop" }
      - { method: GET, path: /apis/scte }
    expect: *ok
    returns: ack

  # ── ST 2110 essences (encoder) ─────────────────────────────────────────
  list_essences:
    summary: "Every ST 2110 essence received, with statistics (GET /apis/essences)"
    send: { method: GET, path: /apis/essences }
    expect: *read
    returns: value

  list_essence_resolutions:
    summary: "The video formats an essence can be set to, with their codes (GET /apis/essences/resolutions)"
    send: { method: GET, path: /apis/essences/resolutions }
    expect: *read
    returns: value

  create_video_essence:
    summary: "Receive an ST 2110-20 video essence (POST /apis/essences type video)"
    params:
      name: &ess_name { type: string, default: "", max_length: 63, label: Name, description: "The essence's name, or empty." }
      auto_start: &ess_auto { type: bool, default: true, label: Start, description: "Whether it starts now and on boot; a start that fails is reported as a warning." }
      input_channel: &ess_ch { type: int, min: 0, required: true, label: Input channel, description: "The input it feeds, from 0 (as many as the unit has video inputs)." }
      address: &ess_addr { type: string, required: true, max_length: 45, label: Multicast address, description: "The multicast group, or 0.0.0.0 for unicast." }
      port: &ess_port { type: int, min: 1, max: 65535, required: true, label: Port, description: "The UDP port." }
      source_address: &ess_src { type: string, default: "", max_length: 45, label: Source address, description: "The sender's address for source-specific multicast, or empty." }
      rtp_payload: &ess_pt { type: int, min: 0, max: 127, required: true, label: RTP payload type, description: "The RTP payload type." }
      format: &ess_fmt { type: string, default: "0", max_length: 20, pattern: "^[0-9]+$", label: Video format, description: "A format code from list_essence_resolutions, or 0 for automatic." }
    send:
      - { method: POST, path: /apis/essences, content_type: application/json,
          body: '{"type":"video","name":{name:json},"autoStart":{auto_start},"address":{address:json},"port":{port},"sourceAddress":{source_address:json},"rtpPayload":{rtp_payload},"inputChannel":{input_channel},"inputFormat":"{format}"}' }
      - { method: GET, path: /apis/essences }
    expect: *ok
    returns: ack

  create_audio_essence:
    summary: "Receive an ST 2110-30 audio essence (POST /apis/essences type audio)"
    params:
      name: *ess_name
      auto_start: *ess_auto
      input_channel: *ess_ch
      address: *ess_addr
      port: *ess_port
      source_address: *ess_src
      rtp_payload: *ess_pt
      channels: &ess_chans { type: int, min: 1, max: 16, required: true, label: Channels, description: "Audio channels in the essence." }
      packet_time: &ess_ptime { type: enum, values: [1ms, 125us], default: 1ms, label: Packet time, description: "Audio packet time: 1 ms or 125 µs." }
    send:
      - { method: POST, path: /apis/essences, content_type: application/json,
          body: '{"type":"audio","name":{name:json},"autoStart":{auto_start},"address":{address:json},"port":{port},"sourceAddress":{source_address:json},"rtpPayload":{rtp_payload},"inputChannel":{input_channel},"numOfChannels":{channels},"packetTime":{packet_time:map.packet_time}}' }
      - { method: GET, path: /apis/essences }
    expect: *ok
    returns: ack

  create_data_essence:
    summary: "Receive an ST 2110-40 ancillary data essence (POST /apis/essences type data)"
    params:
      name: *ess_name
      auto_start: *ess_auto
      input_channel: *ess_ch
      address: *ess_addr
      port: *ess_port
      source_address: *ess_src
      rtp_payload: *ess_pt
    send:
      - { method: POST, path: /apis/essences, content_type: application/json,
          body: '{"type":"data","name":{name:json},"autoStart":{auto_start},"address":{address:json},"port":{port},"sourceAddress":{source_address:json},"rtpPayload":{rtp_payload},"inputChannel":{input_channel}}' }
      - { method: GET, path: /apis/essences }
    expect: *ok
    returns: ack

  configure_video_essence:
    summary: "Change a video essence (PUT /apis/essences/{id} type video); starting is start_essence's"
    params:
      id: &essence { type: int, min: 0, required: true, label: Essence, description: "The essence's id, as list_essences gives it." }
      name: *ess_name
      input_channel: *ess_ch
      address: *ess_addr
      port: *ess_port
      source_address: *ess_src
      rtp_payload: *ess_pt
      format: *ess_fmt
    send:
      - { method: PUT, path: "/apis/essences/{id}", content_type: application/json,
          body: '{"type":"video","name":{name:json},"address":{address:json},"port":{port},"sourceAddress":{source_address:json},"rtpPayload":{rtp_payload},"inputChannel":{input_channel},"inputFormat":"{format}"}' }
      - { method: GET, path: /apis/essences }
    expect: *ok
    returns: ack

  configure_audio_essence:
    summary: "Change an audio essence (PUT /apis/essences/{id} type audio)"
    params:
      id: *essence
      name: *ess_name
      input_channel: *ess_ch
      address: *ess_addr
      port: *ess_port
      source_address: *ess_src
      rtp_payload: *ess_pt
      channels: *ess_chans
      packet_time: *ess_ptime
    send:
      - { method: PUT, path: "/apis/essences/{id}", content_type: application/json,
          body: '{"type":"audio","name":{name:json},"address":{address:json},"port":{port},"sourceAddress":{source_address:json},"rtpPayload":{rtp_payload},"inputChannel":{input_channel},"numOfChannels":{channels},"packetTime":{packet_time:map.packet_time}}' }
      - { method: GET, path: /apis/essences }
    expect: *ok
    returns: ack

  configure_data_essence:
    summary: "Change a data essence (PUT /apis/essences/{id} type data)"
    params:
      id: *essence
      name: *ess_name
      input_channel: *ess_ch
      address: *ess_addr
      port: *ess_port
      source_address: *ess_src
      rtp_payload: *ess_pt
    send:
      - { method: PUT, path: "/apis/essences/{id}", content_type: application/json,
          body: '{"type":"data","name":{name:json},"address":{address:json},"port":{port},"sourceAddress":{source_address:json},"rtpPayload":{rtp_payload},"inputChannel":{input_channel}}' }
      - { method: GET, path: /apis/essences }
    expect: *ok
    returns: ack

  start_essence:
    summary: "Start receiving an essence (PUT /apis/essences/{id}/start)"
    params:
      id: *essence
    send:
      - { method: PUT, path: "/apis/essences/{id}/start" }
      - { method: GET, path: /apis/essences }
    expect: *ok
    returns: ack

  stop_essence:
    summary: "Stop receiving an essence (PUT /apis/essences/{id}/stop)"
    params:
      id: *essence
    send:
      - { method: PUT, path: "/apis/essences/{id}/stop" }
      - { method: GET, path: /apis/essences }
    expect: *ok
    returns: ack

  delete_essence:
    summary: "Delete an essence (DELETE /apis/essences/{id})"
    params:
      id: *essence
    send:
      - { method: DELETE, path: "/apis/essences/{id}" }
      - { method: GET, path: /apis/essences }
    expect: *ok
    returns: ack

  # ── Snapshots and logos (encoder) ──────────────────────────────────────
  list_snapshots:
    summary: "Snapshots stored on the unit (GET /apis/snapshots); each image is at /apis/snapshots/{id}"
    send: { method: GET, path: /apis/snapshots }
    expect: *read
    returns: value

  take_snapshot:
    summary: "Take a snapshot of a video encoder's picture (POST /apis/snapshots); returns {data: {filename, id}}"
    params:
      encoder: { type: int, min: 0, default: 0, label: Video encoder, description: "The video encoder whose picture is taken; it must be started." }
      quality: { type: int, min: 1, max: 100, default: 90, label: Quality, description: "Image quality." }
    send: { method: POST, path: /apis/snapshots, content_type: application/json, body: '{"videnc":{encoder},"quality":{quality}}' }
    expect: *read
    returns: value

  delete_snapshot:
    summary: "Delete a snapshot (DELETE /apis/snapshots/{id})"
    params:
      id: { type: string, required: true, max_length: 128, label: Snapshot, description: "The snapshot's id (its file name), as list_snapshots gives it." }
    send:
      - { method: DELETE, path: "/apis/snapshots/{id}" }
      - { method: GET, path: /apis/snapshots }
    expect: *ok
    returns: ack

  get_snapshot_settings:
    summary: "Snapshot quality, format and space (GET /apis/snapshotsettings)"
    send: { method: GET, path: /apis/snapshotsettings }
    expect: *read
    returns: value

  configure_snapshot_settings:
    summary: "Set snapshot quality, format and space (PUT /apis/snapshotsettings)"
    params:
      quality: { type: int, min: 1, max: 100, required: true, label: Quality, description: "Default image quality." }
      format: { type: enum, values: [png, jpg], required: true, label: Format, description: "Image format." }
      max_storage_kb: { type: int, min: 1, required: true, label: Space, description: "Space kept for snapshots, in KB." }
    send:
      - { method: PUT, path: /apis/snapshotsettings, content_type: application/json,
          body: '{"quality":{quality},"format":"{format}","maxStorageKb":{max_storage_kb}}' }
      - { method: GET, path: /apis/snapshotsettings }
    expect: *ok
    returns: ack

  list_logos:
    summary: "Logo files on the unit (GET /apis/logos), DEFENSE personality"
    send: { method: GET, path: /apis/logos }
    expect: *read
    returns: value

  upload_logo:
    summary: "Upload a logo image (POST /apis/logos, multipart file); its name is the file name without extension"
    params:
      image: { type: binary, required: true, label: Image, description: "The logo image, such as a PNG, JPEG or BMP file." }
      filename: { type: string, required: true, max_length: 128, pattern: "^[^/\\\\]+$", label: File name, description: "The image's file name; without its extension it names the logo." }
      content_type: { type: enum, values: [image/png, image/jpeg, image/bmp, application/octet-stream], default: application/octet-stream, label: Content type, description: "The image's media type." }
    send:
      - { method: POST, path: /apis/logos,
          multipart: [{ name: file, binary: image, filename: "{filename}", content_type: "{content_type}" }] }
      - { method: GET, path: /apis/logos }
    expect: *ok
    returns: ack

  delete_logo:
    summary: "Delete a logo (DELETE /apis/logos/{name})"
    params:
      name: &logo { type: string, required: true, max_length: 128, label: Logo, description: "The logo's name, without extension, as list_logos gives it." }
    send:
      - { method: DELETE, path: "/apis/logos/{name}" }
      - { method: GET, path: /apis/logos }
    expect: *ok
    returns: ack

  list_logo_settings:
    summary: "The logo overlay of every input (GET /apis/logosettings)"
    send: { method: GET, path: /apis/logosettings }
    expect: *read
    returns: value

  configure_logo:
    summary: "Set the logo overlay of an input (PUT /apis/logosettings/{interface})"
    params:
      interface: { type: int, min: 0, required: true, label: Input, description: "The SDI input, from 0." }
      display: { type: bool, required: true, label: Shown, description: "Whether the logo is shown on the input's encoded video." }
      file: { type: string, required: true, max_length: 128, label: Logo, description: "The logo's name, without extension, as list_logos gives it." }
      opacity: { type: int, min: 0, max: 100, default: 100, label: Opacity, description: "Opacity in percent." }
      scaling: { type: int, min: 25, max: 400, default: 100, label: Scaling, description: "Size in percent." }
      relative: { type: bool, default: false, label: Relative scaling, description: "Whether the size keeps its proportion across resolutions." }
      position: { type: enum, values: [bottom_right, top_right, bottom_left, top_left, centered, absolute, relative], default: bottom_right, label: Position, description: "A corner, the center, or the x and y below (absolute pixels, or relative to 1920x1080)." }
      x: { type: int, min: 0, max: 3839, default: 0, label: X, description: "Horizontal position: 0 to 3839 absolute, 0 to 1920 relative." }
      y: { type: int, min: 0, max: 2159, default: 0, label: Y, description: "Vertical position: 0 to 2159 absolute, 0 to 1080 relative." }
    send:
      - { method: PUT, path: "/apis/logosettings/{interface}", content_type: application/json,
          body: '{"display":{display},"interface":{interface},"opacity":{opacity},"scaling":{scaling},"relative":{relative},"positioning":{position:map.logo_position},"x":{x},"y":{y},"fileName":{file:json}}' }
      - { method: GET, path: /apis/logosettings }
    expect: *ok
    returns: ack

  # ── Decoders (decoder) ─────────────────────────────────────────────────
  list_decoders:
    summary: "Every decoder with configuration and statistics (GET /apis/decoders)"
    send: { method: GET, path: /apis/decoders }
    expect: *read
    returns: value

  get_decoder:
    summary: "One decoder (GET /apis/decoders/{id})"
    params:
      id: &decoder { type: int, min: 0, max: 3, required: true, label: Decoder, description: "The decoder, from 0." }
    send: { method: GET, path: "/apis/decoders/{id}" }
    expect: *read
    returns: value

  set_decoder_stream:
    summary: "Choose the stream a decoder decodes (PUT /apis/decoders/{id} streamId)"
    params:
      id: *decoder
      stream: { type: int, min: -1, required: true, label: Stream, description: "The stream's id, as list_streams gives it, or -1 for none." }
    send:
      - { method: PUT, path: "/apis/decoders/{id}", content_type: application/json, body: '{"streamId":{stream}}' }
      - { method: GET, path: /apis/decoders }
    expect: *ok
    returns: ack

  configure_decoder:
    summary: "Set a decoder (PUT /apis/decoders/{id})"
    params:
      id: *decoder
      name: { type: string, required: true, max_length: 64, label: Name, description: "The decoder's name." }
      stream: { type: int, min: -1, required: true, label: Stream, description: "The stream decoded, or -1 for none." }
      still_image: { type: enum, values: [freeze, black, blue, color_bars, mute, custom], required: true, label: Still image, description: "What is shown when the stream stops: the last frame, black, blue, color bars, nothing, or the custom image file." }
      still_image_delay: { type: int, min: 1, max: 1000, required: true, label: Still image delay, description: "Seconds without a stream before the still image." }
      still_image_file: { type: string, default: "", max_length: 255, label: Custom image, description: "The custom still image's file name on the unit, for still_image custom." }
      buffering: { type: enum, values: [automatic, fixed, multisync], required: true, label: Buffering, description: "Automatic, a fixed delay, or a fixed delay from the encode time (multisync)." }
      buffering_delay: { type: int, min: 0, max: 3000, required: true, label: Fixed delay, description: "Milliseconds of fixed buffering." }
      multisync_delay: { type: int, min: 0, max: 10000, required: true, label: Multisync delay, description: "Milliseconds from the encode time, for multisync." }
      hdr: { type: enum, values: ["off", auto, hlg, pq], required: true, label: HDR, description: "HDR output: off, automatic, or forced HLG or PQ (licensed)." }
      output1: { type: bool, required: true, label: SDI 1, description: "Whether SDI output 1 shows this decoder." }
      output2: { type: bool, required: true, label: SDI 2, description: "Whether SDI output 2 shows this decoder." }
      output3: { type: bool, required: true, label: SDI 3, description: "Whether SDI output 3 shows this decoder." }
      output4: { type: bool, required: true, label: SDI 4, description: "Whether SDI output 4 shows this decoder." }
      frame_rate: { type: enum, values: [auto, "60", "59.94", "50", "30", "29.97", "25", "24", "23.98"], required: true, label: Output frame rate, description: "The display frame rate, or auto for the stream's." }
      quad: { type: enum, values: ["off", 2si, sqd], required: true, label: Quad mode, description: "UHD over four SDI outputs as two-sample interleave or Square Division, or off." }
      drop_corrupted: { type: bool, required: true, label: Drop corrupted frames, description: "Whether corrupted frames are dropped rather than shown." }
    send:
      - { method: PUT, path: "/apis/decoders/{id}", content_type: application/json,
          body: '{"name":{name:json},"streamId":{stream},"stillImage":{still_image:map.still_image},"stillImageDelay":{still_image_delay},"stillImageFilename":{still_image_file:json},"bufferingMode":{buffering:map.buffering_mode},"bufferingDelay":{buffering_delay},"multisyncBufferingDelay":{multisync_delay},"hdrDynamicRange":{hdr:map.hdr_mode},"outputs":[{output1},{output2},{output3},{output4}],"outputFrameRate":{frame_rate:map.output_rate},"quadMode":{quad:map.quad_mode},"dropCorruptedFrames":{drop_corrupted}}' }
      - { method: GET, path: /apis/decoders }
    expect: *ok
    returns: ack

  start_decoder:
    summary: "Start a decoder (PUT /apis/decoders/{id}/start)"
    params:
      id: *decoder
    send:
      - { method: PUT, path: "/apis/decoders/{id}/start" }
      - { method: GET, path: /apis/decoders }
    expect: *ok
    returns: ack

  stop_decoder:
    summary: "Stop a decoder (PUT /apis/decoders/{id}/stop)"
    params:
      id: *decoder
    send:
      - { method: PUT, path: "/apis/decoders/{id}/stop" }
      - { method: GET, path: /apis/decoders }
    expect: *ok
    returns: ack

  # ── ST 2110 outputs (decoder) ──────────────────────────────────────────
  list_st2110_outputs:
    summary: "Every ST 2110 essence sent, with statistics (GET /apis/st2110)"
    send: { method: GET, path: /apis/st2110 }
    expect: *read
    returns: value

  configure_st2110_output:
    summary: "Set an ST 2110 essence sent (PUT /apis/st2110/{id})"
    params:
      id: &st2110 { type: int, min: 0, required: true, label: Essence, description: "The essence's id, as list_st2110_outputs gives it." }
      name: { type: string, default: "", max_length: 63, label: Name, description: "The essence's name, or empty." }
      address: { type: string, required: true, max_length: 45, label: Multicast address, description: "The multicast group sent to, or 0.0.0.0." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "The UDP port." }
      rtp_payload: { type: int, min: 0, max: 127, required: true, label: RTP payload type, description: "The RTP payload type." }
      tos: { type: string, default: "0x88", pattern: "^0x[0-9A-Fa-f]{2}$", label: Type of service, description: "IP type of service in hexadecimal, such as 0x88." }
      ttl: { type: int, min: 1, max: 255, default: 64, label: Time to live, description: "IP time to live." }
    send:
      - { method: PUT, path: "/apis/st2110/{id}", content_type: application/json,
          body: '{"name":{name:json},"address":{address:json},"port":{port},"rtpPayload":{rtp_payload},"tos":"{tos}","ttl":{ttl}}' }
      - { method: GET, path: /apis/st2110 }
    expect: *ok
    returns: ack

  configure_st2110_audio_output:
    summary: "Set an ST 2110 audio essence sent, with its packet time (PUT /apis/st2110/{id})"
    params:
      id: *st2110
      name: { type: string, default: "", max_length: 63, label: Name, description: "The essence's name, or empty." }
      address: { type: string, required: true, max_length: 45, label: Multicast address, description: "The multicast group sent to, or 0.0.0.0." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "The UDP port." }
      rtp_payload: { type: int, min: 0, max: 127, required: true, label: RTP payload type, description: "The RTP payload type." }
      tos: { type: string, default: "0x88", pattern: "^0x[0-9A-Fa-f]{2}$", label: Type of service, description: "IP type of service in hexadecimal, such as 0x88." }
      ttl: { type: int, min: 1, max: 255, default: 64, label: Time to live, description: "IP time to live." }
      packet_time: *ess_ptime
    send:
      - { method: PUT, path: "/apis/st2110/{id}", content_type: application/json,
          body: '{"name":{name:json},"address":{address:json},"port":{port},"rtpPayload":{rtp_payload},"tos":"{tos}","ttl":{ttl},"packetTime":{packet_time:map.packet_time}}' }
      - { method: GET, path: /apis/st2110 }
    expect: *ok
    returns: ack

  start_st2110_output:
    summary: "Start sending an essence (PUT /apis/st2110/{id}/start)"
    params:
      id: *st2110
    send:
      - { method: PUT, path: "/apis/st2110/{id}/start" }
      - { method: GET, path: /apis/st2110 }
    expect: *ok
    returns: ack

  stop_st2110_output:
    summary: "Stop sending an essence (PUT /apis/st2110/{id}/stop)"
    params:
      id: *st2110
    send:
      - { method: PUT, path: "/apis/st2110/{id}/stop" }
      - { method: GET, path: /apis/st2110 }
    expect: *ok
    returns: ack

quirks:
  - models: [all]
    severity: warning
    text: >
      The session is the SessionID cookie the login sets (the decoder's API
      reference shows it; the encoder's names no cookie and is taken to set
      the same one). A request answered 401 is taken as the session's end:
      the core signs in again and sends the request once more. How long an
      idle session lasts follows the auto-logout policy (policies); the
      polls keep it in use.
  - models: [all]
    severity: info
    text: >
      The liveness probe asks GET /apis/authentication without the session,
      which a unit answers 401: any answer means the unit is there. The
      logout (DELETE /apis/authentication) is not offered as a command: the
      session is the core's own.
  - models: [all]
    severity: info
    text: >
      The default password is not in the public documents (the user's guide
      sends readers to the unit's Important Notice), so the password setting
      has no default. The API accepts requests over HTTPS only, and the
      unit's certificate is its own unless one is loaded, so it is not
      checked.
  - models: [all]
    severity: warning
    text: >
      Several commands send only some fields of an object the API reference
      lists in full (set_device_name, set_analytics and the personality
      commands on /apis/system_info; set_time_manual without the NTP server
      and set_ptp on /apis/datetime; set_comport_baud_rate; set_decoder_stream;
      configure_video_encoder with the fields given). The services and
      decoder endpoints document that fields left out are kept; for the
      others it is taken to be the same.
  - models: [all]
    severity: info
    text: >
      Start and stop requests go without a body (the ad insertion and stream
      examples), although the reference lets a start carry settings too
      (metadata, audio encoder): settings change with the configure
      commands. The audio and video encoders also take POST to start, which
      the reference answers with an error when already started; PUT is used,
      which does not.
  - models: [all]
    severity: critical
    text: >
      reboot restarts the unit and stops every stream; load_preset replaces
      the running configuration; configure_network can move the unit to an
      address the core does not reach; set_service with http off ends the
      API until the unit is reached another way; configure_policies can end
      the connection through its compliance and TLS settings; the
      personality commands take effect at the next reboot and change which
      endpoints exist. None can be undone from here once done.
  - models: [all]
    severity: info
    text: >
      Images and files the API serves as binary (snapshots at
      /apis/snapshots/{id}, input previews at /apis/preview/{id}, decoder
      previews at /apis/decoders/{id}/preview, logos at /apis/logos/{file})
      are not offered: a spec-driven command cannot hand a binary answer to
      the consumer. Their lists and settings are in state.
  - models: [makito-x4-encoder, makito-x4-rugged-encoder]
    severity: info
    text: >
      The recordings list (GET /apis/recordings) is not implemented by the
      unit (the reference says so); each stream's recording is read from the
      stream (streams.*.recording). Recording limits and segment lengths go
      as text, as the reference types them.
  - models: [makito-x4-decoder]
    severity: info
    text: >
      A custom still image is named by stillImageFilename after an upload
      the decoder's reference mentions (POST /apis/stillimages) but does not
      document, so uploading one is not offered; an image already on the
      unit can be chosen with configure_decoder.
  - models: [all]
    severity: info
    text: >
      Counters come as text with thousands separators ("15,968"), and many
      statistics as worded text ("807 kbps", "4 (Last: 4m11s ago)"); they are
      kept as the unit gives them. Codes stay numbers, with their meanings in
      each state description. Lists inside objects (a stream's content, PIDs,
      UAS tags, relays, audio pairs) are kept whole as JSON text. The WHIP
      bearer token a stream returns is not kept in state, which is not
      secret; the SRT passphrase is never returned (passphrase_set says
      whether one is set).
  - models: [all]
    severity: info
    text: >
      Endpoints of another personality or feature answer errors when polled
      (logos outside the DEFENSE personality, essences and ST 2110 outputs
      outside the 2110 personality, the serial port on non-rugged units);
      those polls change nothing in state. The rugged encoder is the encoder
      with its serial port (comport and serial pass-through), which the
      reference says need a rugged unit.
  - models: [all]
    severity: info
    text: >
      Firmware packages, presets, licenses and certificates go up in one
      request each, answered after the unit has stored (and, for
      upload_upgrade_package, verified) them; the transport waits up to 20 s
      for any answer. The two-step upgrade (upload_upgrade_file, then
      install_upgrade_package) answers the upload sooner, and
      get_upgrade_progress follows both.
  - models: [all]
    severity: info
    text: >
      create_account and the API reference's role list spell the role
      Administrator (the examples); the reference's own description of the
      field spells it Administator.

