  configure_video_encoder:
    summary: "Change a video encoder (PUT /apis/videnc/{id}) with the API's video encoder fields: name, interface, codecAlgorithm, resolution (a code from list_downscale_resolutions), encodingProfile, chromaSubSampling, dynamicRangeMode, ratecontrol, bitrate, maxBitrate, pictureRate, gopSize, closedCaption, aspectRatio, timeCode, countingMode, dailyResync, resyncHour, gopStructure, slices, intraRefresh, partialFrameSkip, cropping, firFilter, squareDivisionCapture, hdcp, sceneChangeDetection, sceneChangeThreshold"
    params:
      id: *videnc
      settings: { type: json, required: true, label: Settings, description: "JSON object of the video encoder fields to set, such as {\"bitrate\":5000,\"gopSize\":60}." }
    send:
      - { method: PUT, path: "/apis/videnc/{id}", content_type: application/json, body: "{settings}" }
      - { method: GET, path: /apis/videnc }
    expect: *ok
    returns: ack

  start_video_encoder:
    summary: "Start a video encoder (PUT /apis/videnc/{id}/start)"
    params:
      id: *videnc
    send:
      - { method: PUT, path: "/apis/videnc/{id}/start" }
      - { method: GET, path: /apis/videnc }
    expect: *ok
    returns: ack

  stop_video_encoder:
    summary: "Stop a video encoder (PUT /apis/videnc/{id}/stop)"
    params:
      id: *videnc
    send:
