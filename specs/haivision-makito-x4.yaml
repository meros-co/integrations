spec: 1
id: haivision-makito-x4
name: Haivision Makito X4 encoder and decoder
vendor: Haivision
category: other

# The Makito X4's REST API (the same API as its web interface): JSON over
# HTTPS under /apis, behind a session cookie (SessionID) that a login with a
# user name and password sets. The encoder and the decoder share the system
# endpoints (accounts, certificates, network, time, presets, services,
# streams, upgrade); the encoder adds its video and audio encoders, inputs,
# metadata, ad insertion, ST 2110 essences, snapshots, logos and recordings,
# the decoder its decoders and ST 2110 outputs. Nothing is pushed: state is
# polled in four groups, and every write is followed by a read of the list
# it changed, so state follows at once.

source:
  - title: "Makito X4 Encoder REST API doc, version 1.10.0 (apidoc, generated 2026-09-23)"
    author: Haivision
    url: "https://mx4e.demo.haivision.com/apidoc/"
    note: >
      Manufacturer-documented and public: the endpoint reference a unit
      serves at /apidoc, published on Haivision's demo encoder and linked
      from the user's guide (below); retrieved 2026-10-27 as its apidoc data
      (api_data.json). The latest documented version of each endpoint is
      followed. Groups used: Accounts, Ad_Insertion_SCTE, Audio_Encoder,
      Audit, Authentication, Banner, Certificates, Comport, Date_and_Time,
      EMS, Essences_ST-2110, Leds, License, Licenses, LogoSettings, Logos,
      MESSAGES, Metadata, NMOS, NTP_validate, Network, Policies, Presets,
      Preview, Reboot, Recordings, Services, Snapshots, Status, Streams,
      SystemInfo, Upgrade, Video_Encoder, Video_Inputs.
  - title: "Makito X4 Decoder REST API doc, version 1.7.0 (apidoc, generated 2026-02-12)"
    author: Haivision
    url: "https://mx4d.demo.haivision.com/apidoc/"
    note: >
      Manufacturer-documented and public: the decoder's endpoint reference on
      Haivision's demo decoder, linked from the decoder user's guide (below);
      retrieved 2026-10-27. Groups used: Accounts, Audit, Authentication
      (with the SessionID cookie of the login's answer), Banner,
      Certificates, Date_and_Time, Decoders, EMS, Essences_ST-2110,
      Hostname_Validate, Leds, License, Licenses, NMOS, NTP_validate,
      Network, Policies, Presets, Preview, Reboot, Services, Status, Streams,
      SystemInfo, Upgrade.
  - title: "Makito X4 Encoder User's Guide 1.9: Accessing the REST API"
    author: Haivision
    url: "https://doc.haivision.com/MakitoX4Enc/1.9/accessing-the-rest-api"
    note: >
      Manufacturer-documented: the API covers the web interface's functions,
      its reference is at /apidoc on a unit, and the public demo reference
      above. The guide's sign-in page sends the default credentials to the
      Important Notice and the support portal, so no default password is
      given here.
  - title: "Makito X4 Decoder User's Guide 1.5: Accessing the REST API"
    author: Haivision
    url: "https://doc.haivision.com/MakitoX4Dec/1.5/accessing-the-rest-api"
    note: >
      Manufacturer-documented: the decoder's API reference is at /apidoc,
      with the public demo decoder's reference above.
  - title: "dal-avdevices-encoderdecoder-haivision-x4encoder (Symphony device adapter)"
    author: AVI-SPL
    url: "https://github.com/AVISPL/dal-avdevices-encoderdecoder-haivision-x4encoder"
    note: >
      Community source (MIT license), read as corroboration only: it logs in
      with a JSON body of username and password to /apis/authentication and
      sends the Set-Cookie value back as a Cookie header.

settings:
  username:
    type: string
    default: admin
    max_length: 64
    label: User name
    description: "The account the core signs in with; admin is one of the unit's predefined accounts."
  password:
    type: string
    secret: true
    required: true
    max_length: 128
    label: Password
    description: "That account's password; the default is on the unit's Important Notice, not in the public documents."

ports:
  - { port: 443, protocol: https, role: control, note: "the web interface and REST API; the port given when opening wins" }

transport:
  type: http
  port: 443
  scheme: https
  # The unit's certificate is its own unless one is loaded (certificates).
  accept_invalid_certs: true
  # Upgrade packages and presets go up as one request each, answered once
  # the unit has taken them (see quirks).
  timeout_ms: 20000
  # Any answer means the unit is there; without the session it is 401.
  probe: { method: GET, path: /apis/authentication }
  # Cookie-based: the login answers with a SessionID cookie, which every
  # later request carries; a 401 means the session has ended.
  session:
    login: { method: POST, path: /apis/authentication, content_type: application/json,
             body: '{"username":{settings.username:json},"password":{settings.password:json}}' }
    capture: { cookie: SessionID }
    relogin: { status: [401] }
    refused: { status: [401] }

maps:
  audio_algorithm: { pcm_passthrough: "1", aac_adts: "10", aac_latm: "21", opus: "50" }
  audio_mode: { stereo: "0", mono_left: "1", mono_right: "2", "3.0": "3", "4.0": "4", "4.1": "5", "5.1": "6", "7.0": "7", "7.1": "8" }
  ptp_delay: { auto: "0", e2e: "1", p2p: "2" }
  comport_mode: { serial: "0", metadata: "1", passthrough: "2" }
  logo_position: { bottom_right: "0", top_right: "1", bottom_left: "2", top_left: "3", centered: "4", absolute: "5", relative: "6" }
  still_image: { freeze: "1", black: "2", blue: "3", color_bars: "4", mute: "5", custom: "6" }
  buffering_mode: { automatic: "3", fixed: "2", multisync: "4" }
  hdr_mode: { "off": "-1", auto: "0", hlg: "1", pq: "2" }
  quad_mode: { "off": "0", 2si: "1", sqd: "2" }
  output_rate: { auto: "0", "60": "60", "59.94": "59", "50": "50", "30": "30", "29.97": "29", "25": "25", "24": "24", "23.98": "23" }
  packet_time: { 1ms: "1", 125us: "2" }

