spec: 1
id: barco-projection-protocol
name: Barco projectors (Barco Projection Protocol, binary)
vendor: Barco
category: display
implementation: native
reason: >
  The Barco Projection Protocol is binary: each message is 0xFE, the device address, the command bytes, a checksum
  (the address plus the command bytes, modulo 256) and 0xFF, with 0x80, 0xFE and 0xFF inside escaped as 0x80 and
  a second byte. Every request is acknowledged (0x00 0x06) or refused (0x00 0x15) before a read's response, which
  repeats the request's bytes, so requests go one at a time and replies are matched to the request in flight; the
  same command bytes carry different layouts on each projector family, and several values are C or Pascal
  strings, big-endian words, two's complement numbers or IEEE-754 floats.

source:
  - title: "HDX series/Apollo Command Catalog, R5905447 v03 (2015-06-08)"
    author: "Barco NV"
    url: "https://www.barco.com/en/support/docs/R5905447"
    note: >
      Manufacturer document for the HDX-W12, HDX-W14, HDX-W18 and HDX-W20 FLEX (public; retrieved 2026-10-22). §2.1
      message structure, checksum, byte conversion, C and Pascal strings, big-endian data words, two's complement,
      ACK 0x00 0x06 and NACK 0x00 0x15 before the response, timeouts of up to 10 s; §2.2 Ethernet: the device is a
      server that never sends on its own, blocking one request at a time, TCP 0xAAA0 (43680), UDP discovery with
      "?" to 255.255.255.255 port 0xA001 answered with hostname, ip-address, mac-address and type strings; §2.3
      RS232/RS422/USB-B with 8 data bits, no parity, 1 stop bit and the baud rate set on the projector; §3 the 336
      commands (3D, adjustments, blanking, color, DMX, input balance, lamp and CLO, lens, network and Wi-Fi, output
      window, P7, scan, soft edge, source, test patterns, warp and its files, window). Only wire layouts are
      restated here.
  - title: "PGWU-61B Command Catalog, R5905746 v03 (2015-05-07, released 2015-05-19)"
    author: "Barco NV"
    url: "https://www.barco.com/en/support/docs/r5905746"
    note: >
      Manufacturer document for the PGWU-61B (public; retrieved 2026-10-22); its about-info reply also names the
      PGXG-61B and PGWX-61B. The same §2 protocol on TCP 43680, then 99 commands: AV mute, aspect ratio, auto image,
      auto power, auto source, picture adjustments, ceiling and rear mode, color temperature, color wheel, info
      blocks 0x2A (about, general, image, geometry, advanced control, IP, diagnostics, serial number), lamps by
      number, language, lens, digital zoom, menu, no-signal background, noise reduction, PIP, projector power
      0x58, factory reset, TCP/IP, versions and keystone.
  - title: "RS232 Commands for LCD and DLP projectors (Serial communication LCD-DLP projector users manual), R5975236 index 09 (2004-11-02)"
    author: "Barco NV"
    url: "https://www.barco.com/en/support/docs/r5975236"
    note: >
      Manufacturer document (public; retrieved 2026-10-22) for Barco's LCD and DLP projectors of the time (barco.com
      lists BarcoData, BarcoGraphics, BarcoReality and BarcoVision 2100-9300 and 6300-6500, RetroData and
      RetroGraphics 2100, Ultra Reality 7000, Galaxy, Galaxy WARP and the Galaxy 4 LL+, 6 Classic+, 9 HC+ and 12 HB+,
      Helios, ELM R12, R12 Director, R18 Director and G10, and the SLM Performer and Executive), with commands
      marked for the DP100 and the XLM series. Its PDF text uses a shifted font; it reads with each glyph code plus
      29. §1 communication basics (the same framing over RS-232, 8 data bits, no parity, 1 stop bit, the baud rate
      per the owner's manual, address up to 256, RS232 IN and OUT for a chain), §2 elementary and §3 advanced
      commands with the projector types each applies to, and an appendix summarizing every command's bytes.

settings:
  poll_ms: { type: int, min: 500, max: 3600000, default: 5000, label: Status read interval,
    description: "Milliseconds between reads of power, lamp, source, shutter, freeze and mute." }
  refresh_ms: { type: int, min: 1000, max: 86400000, default: 60000, label: Full read interval,
    description: "Milliseconds between reads of every other setting; identity and network are read on connecting." }

ports:
  - { port: 43680, protocol: tcp, role: control, note: "TCP 0xAAA0 on the HDX and PGWU; for an RS-232-only projector, the port of a serial-to-Ethernet converter, given when the device is opened" }

