commands:
  clear_lcd:
    summary: "Clear the 2-line LCD (0x7A 0x85)"
    returns: ack
  clear_test_pattern:
    summary: "Leave the test pattern (0x41 0xC4 0x00)"
    returns: ack
  copy_file:
    summary: "Copy a file to a custom file (file copy 0xC2), overwriting what is at the destination's index"
    params:
      file: { type: string, required: true, max_length: 12, label: "From", description: "8.3 name as the catalog lays it out: eight characters (padded with spaces), a dot, s or c and a two-digit index, e.g. \"ntsc    .c01\"; ? is a wildcard where allowed." }
      to: { type: string, required: true, max_length: 12, label: "To", description: "The destination custom file (no wildcards)." }
    returns: ack
  delete_files:
    summary: "Delete custom files matching a name with wildcards (file delete 0xC1)"
    params:
      pattern: { type: string, required: true, max_length: 12, label: "Pattern", description: "Custom file name, ? wildcards allowed (????????.c??)." }
    returns: ack
  delete_warp_file:
    summary: "Delete a warp file (0xBD 0xC6); the name starts with $HDXWARP/"
    params:
      file: { type: string, required: true, max_length: 255, pattern: "^\\$HDXWARP/.+", label: "File", description: "The file, starting with $HDXWARP/." }
    returns: ack
  exit_menu:
    summary: "Leave one on-screen menu, or all (menu exit 0x42 0x01)"
    params:
      all: { type: bool, default: false, label: "All", description: "On leaves every menu, off one." }
    returns: ack
  factory_reset:
    summary: "Reset the settings to factory defaults (0x31)"
    returns: ack
  get_3d:
    summary: "Read the 3D (3D 0x3D 0x00)"
    returns: value
  get_3d_dark_time:
    summary: "Read the 3D dark time set and actual, in microseconds (3D 0x3D 0x02)"
    returns: value
  get_3d_field_dominance:
    summary: "Read the Field dominance (3D 0x3D 0x05)"
    returns: value
  get_3d_flash_limit:
    summary: "Read the double and triple flash limits (3D 0x3D 0x09)"
    returns: value
  get_3d_mode:
    summary: "Read the 3D mode (3D 0x3D 0x01)"
    returns: value
  get_3d_output_delay:
    summary: "Read the 3D L/R output reference delay in microseconds (3D 0x3D 0x03)"
    returns: value
  get_3d_sync_loop:
    summary: "Read the Sync loop (3D 0x3D 0x07)"
    returns: value
  get_about_info:
    summary: "Read the about info block (0x2A 0x01 0xA2): model, serial number, firmware, sources, signal timing, lamp and projector run time, power, installation and color space"
    returns: value
  get_active_file:
    summary: "Read the name of the active file (file list active 0xC5)"
    returns: value
  get_address:
    summary: "Read the projector's address (0x6D)"
    returns: value
  get_adjustment_possible:
    summary: "Ask whether an adjustment is possible on the current signal (adj possible 0x29)"
    params:
      adjustment: { type: enum, values: ["contrast", "brightness", "saturation", "tint", "sharpness", "phase", "input_format"], required: true, label: "Adjustment", description: "The adjustment to ask about; input_format is the horizontal total." }
    returns: value
  get_adjustment_range:
    summary: "Read an adjustment's value with its minimum, maximum and step (get adj ext 0x2B)"
    params:
      adjustment: { type: enum, values: ["contrast", "sharpness", "phase", "gamma", "contrast_enhancement"], required: true, label: "Adjustment", description: "The adjustment to read." }
    returns: value
  get_advanced_control_info:
    summary: "Read the advanced control block (0x2A 0x05 0xA2): color temperature, RGB gains and offsets"
    returns: value
  get_alpha_blending:
    summary: "Read the alpha blending (0x21 0x8D 0x44 0x45, a word)"
    returns: value
  get_aspect_ratio:
    summary: "Read the aspect ratio (0x21 0x0B 0xC0)"
    returns: value
  get_aspect_ratio_size:
    summary: "Read the custom aspect ratio width or height (0x21 0x0B 0xC1, 0xC2)"
    params:
      dimension: { type: enum, values: ["width", "height"], required: true, label: "Dimension", description: "width or height of the custom aspect ratio." }
    returns: value
  get_audio:
    summary: "Read an audio value (0x21 with the setting byte)"
    params:
      setting: { type: enum, values: ["volume", "bass", "treble", "balance", "fade", "fade_external", "fade_internal"], required: true, label: "Setting", description: "volume, bass, treble, balance, or the fade between external and internal speakers (fade, fade_external, fade_internal)." }
    returns: value
  get_audio_lock:
    summary: "Read the audio lock (0x21 0x3F)"
    returns: value
  get_audio_mute:
    summary: "Read audio mute (0x21 0x3D)"
    returns: value
  get_auto_alignment:
    summary: "Read the auto picture alignment (file 0xBD 0x88)"
    returns: value
  get_auto_image:
    summary: "Read the auto image adjust mode (0x21 0xA8)"
    returns: value
  get_auto_source:
    summary: "Read automatic source search (0x91 0x01)"
    returns: value
  get_av_mute:
    summary: "Read AV mute (0x21 0xA9)"
    returns: value
  get_barscale_position:
    summary: "Read where the bar scale appears (projector info 0xF5 0x02)"
    returns: value
  get_baud_rate:
    summary: "Read the serial baud rate (0x75, a C string)"
    returns: value
  get_brightness:
    summary: "Read the brightness of the active source (0x21 0x02)"
    returns: value
  get_button_macro:
    summary: "Read the macro attached to a macro button (button read macro 0xE8 0x05)"
    params:
      button: { type: int, min: 1, max: 255, required: true, label: "Button", description: "Macro button, from 1." }
    returns: value
  get_clamp:
    summary: "Read the clamp delay or width of the active source (0x21 0x67, 0x21 0x68)"
    params:
      setting: { type: enum, values: ["clamp_delay", "clamp_width"], required: true, label: "Setting", description: "clamp_delay or clamp_width." }
    returns: value
  get_clamp_edge:
    summary: "Read the clamp edge (0x21 0x66)"
    returns: value
  get_clo:
    summary: "Read constant light output (lamp 0x76 0x96)"
    returns: value
  get_clo_target:
    summary: "Read the constant light output target in lumens (lamp 0x76 0x9E)"
    returns: value
  get_color_balance:
    summary: "Read a color balance ratio times 100 (0x21 0x43, 0x21 0x44)"
    params:
      pair: { type: enum, values: ["red_green", "blue_green"], required: true, label: "Ratio", description: "red_green or blue_green." }
      preset: { type: enum, values: ["projector_white", "custom_projector_white", "custom", "3200", "5400", "6500", "9300"], label: "Preset", description: "Older models only: read the balance of this color temperature preset instead of the active one." }
    returns: value
  get_color_gain:
    summary: "Read the red, green or blue gain of the color temperature, times 100 (0x21 0x93 to 0x95)"
    params:
      color: { type: enum, values: ["red", "green", "blue"], required: true, label: "Color", description: "red, green or blue." }
    returns: value
  get_color_key:
    summary: "Read whether the color key is on (0x21 0x8D 0x52 0x53)"
    returns: value
  get_color_key_settings:
    summary: "Read the color key range, color, palette and algorithm (0x21 0x8D 0x46 0x51)"
    returns: value
  get_color_space:
    summary: "Read the input color space (get format 0x21 0x14)"
    returns: value
  get_color_temperature:
    summary: "Read the color temperature of the active source (0x21 0x45): the preset, or the file name on projectors with a directory structure"
    returns: value
  get_color_wheel_index:
    summary: "Read the color wheel index (0x58 0x21 0x41)"
    returns: value
  get_common_address:
    summary: "Read the common address every projector answers to (0x6C)"
    returns: value
  get_contrast:
    summary: "Read the contrast of the active source (0x21 0x01)"
    returns: value
  get_contrast_enhancement:
    summary: "Read the contrast enhancement and plate position (0x21 0x86)"
    returns: value
  get_convergence:
    summary: "Read the electronic convergence (function 0x82, 0x0000004B)"
    returns: value
  get_customer_id:
    summary: "Read the customer ID (projector info 0xF5 0x01)"
    returns: value
  get_date_time:
    summary: "Read the projector's date and time, YYYY.MM.DDhh:mm (projector info 0xF5 0x05)"
    returns: value
  get_diagnosis:
    summary: "Read diagnosis data by index (diagnosis 3 read 0x81 0x03 from to): temperatures, voltages, fan speeds, switches, error bits and limits"
    params:
      from: { type: int, min: 0, max: 65535, required: true, label: "From index", description: "First data index (0-301; see the catalog's diagnosis 3 table)." }
      to: { type: int, min: 0, max: 65535, required: true, label: "To index", description: "Last data index." }
    returns: value
  get_diagnostics:
    summary: "Read the diagnostics block (0x2A 0x07 0xA2): the error or operating code"
    returns: value
  get_digital_zoom:
    summary: "Read the main (digital) zoom (0xA1 0x00)"
    returns: value
  get_dimming:
    summary: "Read the dimming (0x21 0x0D)"
    returns: value
  get_display_mode:
    summary: "Read the display mode (0x21 0x15)"
    returns: value
  get_dmx_address:
    summary: "Read the DMX start address (DMX 0x57 0x40)"
    returns: value
  get_dmx_mode:
    summary: "Read the DMX mode (DMX 0x57 0x42)"
    returns: value
  get_dmx_universe:
    summary: "Read the Art-Net universe (DMX 0x57 0x45)"
    returns: value
  get_field_polarity:
    summary: "Read the field polarity (0x21 0x62)"
    returns: value
  get_field_select:
    summary: "Read the field select (0x21 0x63)"
    returns: value
  get_file_permissions:
    summary: "Read a file's permissions, rwx (file read permission 0xBD 0x48)"
    params:
      path: { type: string, required: true, max_length: 255, label: "Path", description: "File name starting with an environment name." }
    returns: value
  get_frame_delay:
    summary: "Read the frame delay (0x21 0x65)"
    returns: value
  get_freeze:
    summary: "Read whether the picture is frozen (0x21 0x23; PGWU 0x21 0xAC)"
    returns: value
  get_gamma:
    summary: "Read the gamma (0x21 0x70)"
    returns: value
