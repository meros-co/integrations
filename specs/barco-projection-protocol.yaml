  color.offset_green: { type: int, description: "Green offset, 0-100 (PGWU)" }
  color.offset_red: { type: int, description: "Red offset, 0-100 (PGWU)" }
  color.p7.blue_x: { type: float, description: "P7 target blue x coordinate (HDX)" }
  color.p7.blue_y: { type: float, description: "P7 target blue y coordinate (HDX)" }
  color.p7.cyan_x: { type: float, description: "P7 target cyan x coordinate (HDX)" }
  color.p7.cyan_y: { type: float, description: "P7 target cyan y coordinate (HDX)" }
  color.p7.file: { type: string, description: "File holding the active P7 values (HDX)" }
