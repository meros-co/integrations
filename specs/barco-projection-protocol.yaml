  color.input_balance.white.blue: { type: int, description: "White input balance of blue (HDX -127 to 127, PGWU 0-100)" }
  color.input_balance.white.green: { type: int, description: "White input balance of green (HDX -127 to 127, PGWU 0-100)" }
  color.input_balance.white.red: { type: int, description: "White input balance of red (HDX -127 to 127, PGWU 0-100)" }
