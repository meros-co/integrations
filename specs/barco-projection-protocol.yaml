quirks:
  - models: [all]
    severity: critical
    text: >
      factory_reset (PGWU) returns every setting to factory defaults; set_network, set_wifi, set_wifi_enabled,
      set_gateway_interface, set_address, set_baud_rate and set_serial_interface can cut this connection;
      set_serial_number writes the serial number once, for good; delete_files, delete_warp_file, move_file,
      copy_file and write_file overwrite or remove files. None can be undone from here.
  - models: [all]
    severity: warning
    text: >
      The projector never sends on its own, so state is only as fresh as the reads: status, lamp, source,
      shutter, freeze and mutes every poll_ms, everything else every refresh_ms. A read the projector refuses
      (NACK), or leaves unanswered twice, is not polled again until reconnecting or refresh: no family answers
      every read the catalogs list (a feature may be absent or need a signal).
  - models: [all]
    severity: info
    text: >
      Every request is acknowledged (0x00 0x06) or refused (0x00 0x15) before any response; a refusal fails the
      command with a device error. The catalogs suggest waiting up to 10 s for an answer; this module waits 5 s,
      and three unanswered requests in a row report the projector disconnected.
  - models: [all]
    severity: info
    text: >
      The three catalogs give one command different layouts by family (for example 0x21 0x45 answers a C string
      on the HDX, a preset number on the PGWU, and either on older models), so each model's family decides how a
      command is sent and read. Commands taking a value that a family lacks (a preset, a focus direction, a
      geometry setting) refuse it as invalid for the model.
  - models: [all]
    severity: info
    text: >
      Lens shift, zoom, focus, tilt, bridge and anamorphic commands move the motor by one step per command; the
      catalogs document no lens position read, no lens memory and no motor stop, so those are API limits. Lamp
      hours are in seconds on the HDX, hours on the PGWU and on older models (0x64).
  - models: [all]
    severity: info
    text: >
      API limits: temperatures, voltages and fan speeds are readable only on the DP100 and XLM (diagnosis 3);
      the HDX and older models report no temperatures, the PGWU a single diagnostics code. The HDX catalog has
      no read of the P7 green X coordinate and no write of the infrared hold-off or of the date and time.
  - models: [all]
    severity: info
    text: >
      Not offered as commands of their own: the source prefix (0x31 with a source before another command, on the
      HDX, DP100 and XLM) and the window prefix (0x8F 0x88), which are the same messages as set_source and
      select_window; and the answer prefix 0x00 0x03 (DP100, XLM). send_raw sends any message of the protocol as
      hex, for these or anything else.
  - models: [all]
    severity: info
    text: >
      The UDP discovery of §2.2 (the byte "?" broadcast to port 0xA001, answered with hostname, ip-address, mac-
      address and type strings) is not offered by this integration; open the projector by address.
  - models: [all]
    severity: info
    text: >
      Values set with set_ commands are read back after their acknowledgement while monitoring; opened for
      commands only, nothing is read beyond what commands ask, except the status (or the PGWU lamp status) after
      10 s without traffic, as the liveness check.
  - models: [hdx-w12, hdx-w14, hdx-w18, hdx-w20-flex]
    severity: info
    text: >
      The HDX catalog gives "increment blanking top" as 0x22 0x45, which is the color temperature byte; this
      spec sends 0x22 0x4C, the blanking top byte of every other blanking command. Warp floats (IEEE-754, four
      bytes) are sent and read big-endian, the protocol's byte order for data words; the catalog lists them as
      BYTE 0 to BYTE 3 without saying. The write DMX universe command uses 0x57 0x45, the same bytes as the
      read, as the catalog gives it. set_network and set_wifi carry a MAC address because the catalog's message
      does; give the projector's own.
  - models: [hdx-w12, hdx-w14, hdx-w18, hdx-w20-flex]
    severity: info
    text: >
      set_warp_status's enabled bit field is passed through as a number: the catalog lists the warp kinds of the
      two bytes (four corner, keystone, pincushion/barrel, linearity, line shift and point move, deprecated from
      1.6; scale, shift, rotate and hierarchic points) without their bit numbers.
  - models: [pgwu-61b, pgwx-61b, pgxg-61b]
    severity: info
    text: >
      get_versions passes the data indexes through: the catalog's tables of from and to indexes for the
      components (PW392, DDP442x, PIC, LAN module, waveform, EDID) disagree, so the firmware in state comes from
      the about and IP configuration blocks. Settable values the catalog lists as invalid (aspect ratio, color
      temperature, color space 0x00) are not offered.
  - models: [barcodata, barcographics, barcoreality, barcovision, galaxy, helios, elm, slm, dp100, xlm]
    severity: info
    text: >
      The RS-232 catalog's pages give vertical refresh write synchronous as 0x26 0x61 and asynchronous as 0x27
      0x61, while its appendix gives the reverse; this spec follows the pages. Phase is one byte on the BD2100,
      BD3000, BD3100, BD5000 and BD8000 and a word on the others (set_phase width). Sharpness on the BD5000 and
      BD8000 is 0-3 for -4, 0, 3.5 and 6 dB, and on the BD3000, BD3100, BD5100 and BD8100 0-3 for 0, 0.25, 0.5
      and 1. Lamp power and nominal current are read as unsigned numbers of the length the projector answers;
      their unit is not documented.
  - models: [barcodata, barcographics, barcoreality, barcovision, galaxy, helios, elm, slm, dp100, xlm]
    severity: info
    text: >
      Projectors that cannot sense the shutter answer undetermined, reported as in_between. The status byte's
      freeze bit is significant only on projectors that show one image at a time, and the 800-peripheral bit not
      on the BD5000, BD8000 and BD8000LC. set_baud_rate is acknowledged at the old rate and switches after; an
      invalid rate gives 9600. set_address is acknowledged from the old address.
