    send: '{"Command":"playlist.activate","RequestID":84,"ChannelIndex":{channel},"Name":{name:json}}'
    expect: { reply_json: { "$.RequestID": "84" }, code_path: "$.Code", code_range: [0, 0], json_path: "$.Result" }
    returns: value
  playlist_can_activate_index:
    summary: "Check whether a playlist item can be activated, by index; returns its result (playlist.can.activate)"
    params: { channel: *channel, index: *item_index }
    send: '{"Command":"playlist.can.activate","RequestID":85,"ChannelIndex":{channel},"Index":{index}}'
    expect: { reply_json: { "$.RequestID": "85" }, json_path: "$" }
    returns: value
  playlist_can_activate_name:
    summary: "Check whether a playlist item can be activated, by name; returns its result (playlist.can.activate)"
    params: { channel: *channel, name: *item_name }
    send: '{"Command":"playlist.can.activate","RequestID":86,"ChannelIndex":{channel},"Name":{name:json}}'
    expect: { reply_json: { "$.RequestID": "86" }, json_path: "$" }
    returns: value
  playlist_restart:
    summary: "Restart a channel's playlist and cue its first item; the timeline must be off (playlist.restart)"
    params: { channel: *channel }
    send: '{"Command":"playlist.restart","RequestID":87,"ChannelIndex":{channel}}'
    expect: { reply_json: { "$.RequestID": "87" }, code_path: "$.Code", code_range: [0, 0], json_path: "$.Result" }
    returns: value
  playlist_can_restart:
    summary: "Check whether a channel's playlist can restart; returns its result (playlist.can.restart)"
    params: { channel: *channel }
    send: '{"Command":"playlist.can.restart","RequestID":88,"ChannelIndex":{channel}}'
    expect: { reply_json: { "$.RequestID": "88" }, json_path: "$" }
    returns: value

  # ── Remote playlist ─────────────────────────────────────────────────────
  remote_playlist_get:
    summary: "Read the remote playlist's id, name and publish contexts (remoteplaylist.get)"
    send: '{"Command":"remoteplaylist.get","RequestID":90}'
    expect: { reply_json: { "$.RequestID": "90" }, code_path: "$.Code", code_range: [0, 0], json_path: "$.Result" }
    returns: value
  remote_playlist_open:
    summary: "Open a remote playlist with a blank, the default or the current show (remoteplaylist.open)"
    params:
      playlist_id: &playlist_id { type: string, pattern: '^\{?[0-9A-Fa-f-]{36}\}?$', required: true,
                                  label: Remote playlist, description: "The remote playlist's id, a GUID." }
      publish_context: &publish_context { type: string, max_length: 1024, default: "", label: Publish context,
                                          description: "The publish context's name; empty for none." }
      show: { type: enum, values: [UseBlankShow, UseDefaultShow, UseCurrentShow], default: UseCurrentShow,
              label: Show, description: "The show the playlist opens with: a new blank show, the default show mappings' show, or the show open now." }
    send: '{"Command":"remoteplaylist.open","RequestID":91,"PlaylistId":"{playlist_id}","PublishContextName":{publish_context:json},"SpecialAction":"{show}"}'
    expect: { reply_json: { "$.RequestID": "91" }, code_path: "$.Code", code_range: [0, 0] }
    returns: ack
  remote_playlist_open_show:
    summary: "Open a remote playlist with a given show (remoteplaylist.open, SpecialAction UseShowUri)"
    params:
      playlist_id: *playlist_id
      publish_context: *publish_context
      show_uri: *show_uri
    send: '{"Command":"remoteplaylist.open","RequestID":92,"PlaylistId":"{playlist_id}","PublishContextName":{publish_context:json},"SpecialAction":"UseShowUri","ShowUri":{show_uri:json}}'
    expect: { reply_json: { "$.RequestID": "92" }, code_path: "$.Code", code_range: [0, 0] }
    returns: ack

  # ── Macros ──────────────────────────────────────────────────────────────
  macro_get:
    summary: "List the macros, each id and name (macro.get)"
    send: '{"Command":"macro.get","RequestID":100}'
    expect: { reply_json: { "$.RequestID": "100" }, code_path: "$.Code", code_range: [0, 0], json_path: "$.Result" }
    returns: value
  macro_execute_id:
    summary: "Run a macro, by id (macro.execute)"
    params:
      id: &macro_id { type: string, max_length: 256, required: true, label: Macro, description: "The macro's id, as macro.get lists it." }
    send: '{"Command":"macro.execute","RequestID":101,"Id":{id:json}}'
    expect: { reply_json: { "$.RequestID": "101" }, code_path: "$.Code", code_range: [0, 0] }
    returns: ack
  macro_execute_name:
    summary: "Run a macro, by name (macro.execute)"
    params:
      name: &macro_name { type: string, max_length: 1024, required: true, label: Macro name, description: "The macro's name." }
    send: '{"Command":"macro.execute","RequestID":102,"Name":{name:json}}'
    expect: { reply_json: { "$.RequestID": "102" }, code_path: "$.Code", code_range: [0, 0] }
    returns: ack
  macro_can_execute_id:
    summary: "Check whether a macro can run, by id; succeeds when it can (macro.can.execute)"
    params: { id: *macro_id }
    send: '{"Command":"macro.can.execute","RequestID":103,"Id":{id:json}}'
    expect: { reply_json: { "$.RequestID": "103" }, code_path: "$.Code", code_range: [0, 0] }
    returns: ack
  macro_can_execute_name:
    summary: "Check whether a macro can run, by name; succeeds when it can (macro.can.execute)"
    params: { name: *macro_name }
    send: '{"Command":"macro.can.execute","RequestID":104,"Name":{name:json}}'
    expect: { reply_json: { "$.RequestID": "104" }, code_path: "$.Code", code_range: [0, 0] }
    returns: ack

  # ── Timeline ────────────────────────────────────────────────────────────
  timeline_play:
    summary: "Play the timeline (timeline.play)"
    send: '{"Command":"timeline.play","RequestID":110}'
    expect: { reply_json: { "$.RequestID": "110" }, code_path: "$.Code", code_range: [0, 0] }
    returns: ack
  timeline_pause:
    summary: "Pause the timeline (timeline.pause)"
    send: '{"Command":"timeline.pause","RequestID":111}'
    expect: { reply_json: { "$.RequestID": "111" }, code_path: "$.Code", code_range: [0, 0] }
    returns: ack
  timeline_rewind:
    summary: "Rewind the timeline (timeline.rewind)"
    send: '{"Command":"timeline.rewind","RequestID":112}'
    expect: { reply_json: { "$.RequestID": "112" }, code_path: "$.Code", code_range: [0, 0] }
    returns: ack
  timeline_forward:
    summary: "Fast-forward the timeline (timeline.forward)"
    send: '{"Command":"timeline.forward","RequestID":113}'
    expect: { reply_json: { "$.RequestID": "113" }, code_path: "$.Code", code_range: [0, 0] }
    returns: ack
  timeline_jump_start:
    summary: "Jump to the timeline's beginning (timeline.jumpstart)"
    send: '{"Command":"timeline.jumpstart","RequestID":114}'
    expect: { reply_json: { "$.RequestID": "114" }, code_path: "$.Code", code_range: [0, 0] }
    returns: ack
  timeline_jump_end:
    summary: "Jump to the timeline's end (timeline.jumpend)"
    send: '{"Command":"timeline.jumpend","RequestID":115}'
    expect: { reply_json: { "$.RequestID": "115" }, code_path: "$.Code", code_range: [0, 0] }
    returns: ack

codes:
  "1": "ErrorException: an unexpected error"
  "2": "ErrorValidation: a value or the request is invalid"
  "3": "ErrorNotFound: a value asked for was not found"
  "4": "ErrorNoShow: the command needs an open show"
  "5": "ErrorInvalidOperation: not allowed now, for example by a channel rule"

quirks:
  - models: [all]
    severity: warning
    text: >
      Director Remoting is off until it is turned on in Director's Application Settings (Tools >
      Options); with its websocket turned off Director answers every request with the error
      "'Websocket' connection is disabled". The documentation gives port 22404; the vendor's own Companion
      module defaults to 21404, so a Director answering on neither should be checked in its settings.
  - models: [all]
    severity: info
    text: >
      The API pushes nothing: the status, topology, show, channels, playlists, window layout, macros and
      remote playlist are polled (every 2 s for the playlists and the status, every 10 s for the rest).
      Project data, templates, pages and assets are read on request only, their shapes being the show's.
  - models: [all]
    severity: info
    text: >
      Each command sends a fixed RequestID of its own (1 to 115, polls from 1000) and waits for the reply
      echoing it. The documentation writes RequestID as an integer in quotes; it is sent here as a JSON
      number, as the vendor's Companion module sends it. Channel and playlist item indexes are sent as
      Director lists them; the documentation does not say whether they count from 0 or 1.
  - models: [all]
    severity: critical
    text: >
      show_take, show_take_out, show_take_out_recue, show_clear, playlist_activate_*, playlist_restart,
      show_open, show_close, topology_set and remote_playlist_open change what is on air at once and
      cannot be undone. The can_* commands check first without changing anything.

state:
  status.version: { type: string, description: "Director's version (status.get)" }
  status.lifetime_ms: { type: int, unit: ms, description: "How long Director has been running" }
  status.user: { type: string, description: "The user Director runs as" }
  status.machine: { type: string, description: "The machine Director runs on" }
  status.channel_count: { type: int, description: "The number of channels of the open show" }
  topology.name: { type: string, description: "The topology in use" }
  topology.state: { type: string, description: "The topology's state: Ok, Warning or Error (status.get and topology.status)" }
  topology.source_type: { type: string, description: "Where the topology comes from: DefaultTopology, LocalFile or EmbeddedInProject" }
  topology.number_of_ports: { type: int, description: "The topology's number of ports" }
  show.id: { type: string, description: "The open show's id (a GUID)" }
  show.name: { type: string, description: "The open show's name" }
  show.uri: { type: string, description: "The open show's URI" }
  show.description: { type: string, description: "The open show's description" }
  show.publish_context_id: { type: string, description: "The open show's publish context id" }
  project.id: { type: string, description: "The project's id (a GUID)" }
  project.name: { type: string, description: "The project's name" }
  project.uri: { type: string, description: "The project's URI" }
  remote_playlist.id: { type: string, description: "The remote playlist in use (a GUID)" }
  remote_playlist.name: { type: string, description: "The remote playlist's name" }
  window.layout_index: { type: int, description: "The window layout in use, its index" }
  window.layout_name: { type: string, description: "The window layout in use, its name" }
  channels.*.name: { type: string, description: "Each channel's name, keyed by its index" }
  macros.*.name: { type: string, description: "Each macro's name, keyed by its id" }
  playlists.*.channel_name: { type: string, description: "The channel's name, the playlist keyed by channel index" }
  playlists.*.items.*.name: { type: string, description: "Each item's name, keyed by its index in the playlist" }
  playlists.*.items.*.display_name: { type: string, description: "The item's display name" }
  playlists.*.items.*.id: { type: string, description: "The item's id" }
  playlists.*.items.*.status: { type: string, description: "The item's status: Default, Cued, On-Air or Aired" }

telemetry:
  poll:
    - every_ms: 2000
      send:
        - '{"Command":"status.get","RequestID":1000}'
        - '{"Command":"playlist.get","RequestID":1001}'
    - every_ms: 10000
      send:
        - '{"Command":"topology.get","RequestID":1002}'
        - '{"Command":"topology.status","RequestID":1003}'
        - '{"Command":"show.get","RequestID":1004}'
        - '{"Command":"show.getchannels","RequestID":1005}'
        - '{"Command":"window.getlayout","RequestID":1006}'
        - '{"Command":"macro.get","RequestID":1007}'
        - '{"Command":"remoteplaylist.get","RequestID":1008}'
  updates:
    - json_match: { "$.RequestID": "^(1|1000)$", "$.Code": "^0$" }
      json: { version: "$.Result.Version", lifetime: "$.Result.LifetimeMs", user: "$.Result.User", machine: "$.Result.Machine",
              topology: "$.Result.TopologyName", topology_state: "$.Result.TopologyState", show_id: "$.Result.ShowId",
              show_name: "$.Result.ShowName", show_uri: "$.Result.ShowUri", project_id: "$.Result.ProjectId",
              project_name: "$.Result.ProjectName", project_uri: "$.Result.ProjectUri",
              remote_playlist: "$.Result.RemotePlaylistId", channels: "$.Result.ChannelCount" }
      state:
        status.version: "{version}"
        status.lifetime_ms: "{lifetime}"
        status.user: "{user}"
        status.machine: "{machine}"
        status.channel_count: "{channels}"
        topology.name: "{topology}"
        topology.state: "{topology_state}"
        show.id: "{show_id}"
        show.name: "{show_name}"
        show.uri: "{show_uri}"
        project.id: "{project_id}"
        project.name: "{project_name}"
        project.uri: "{project_uri}"
        remote_playlist.id: "{remote_playlist}"
    - json_match: { "$.RequestID": "^(20|1002)$", "$.Code": "^0$" }
      json: { name: "$.Result.Name", source: "$.Result.SourceType" }
      state: { topology.name: "{name}", topology.source_type: "{source}" }
    - json_match: { "$.RequestID": "^(23|1003)$", "$.Code": "^0$" }
      json: { name: "$.Result.Name", ports: "$.Result.NumberOfPorts", state: "$.Result.State" }
      state: { topology.name: "{name}", topology.number_of_ports: "{ports}", topology.state: "{state}" }
    - json_match: { "$.RequestID": "^(30|1004)$", "$.Code": "^0$" }
      json: { id: "$.Result.Id", project: "$.Result.ProjectId", context: "$.Result.PublishContextId", uri: "$.Result.Uri",
              description: "$.Result.Description" }
      state: { show.id: "{id}", project.id: "{project}", show.publish_context_id: "{context}", show.uri: "{uri}",
               show.description: "{description}" }
    - json_match: { "$.RequestID": "^(63|1005)$", "$.Code": "^0$" }
      json_each: "$.Result"
      json: { index: "$.ChannelIndex", name: "$.Name" }
      replace: channels
      state: { "channels.{index}.name": "{name}" }
    - json_match: { "$.RequestID": "^(12|1006)$", "$.Code": "^0$" }
      json: { index: "$.Result.Index", name: "$.Result.Name" }
      state: { window.layout_index: "{index}", window.layout_name: "{name}" }
    - json_match: { "$.RequestID": "^(100|1007)$", "$.Code": "^0$" }
      json_each: "$.Result"
      json: { id: "$.Id", name: "$.Name" }
      replace: macros
      state: { "macros.{id:key}.name": "{name}" }
    - json_match: { "$.RequestID": "^(90|1008)$", "$.Code": "^0$" }
      json: { id: "$.Result.Id", name: "$.Result.Name" }
      state: { remote_playlist.id: "{id}", remote_playlist.name: "{name}" }
    - json_match: { "$.RequestID": "^(80|1001)$", "$.Code": "^0$" }
      json_each: "$.Result"
      json: { channel: "$.ChannelIndex", name: "$.ChannelName" }
      replace: playlists
      state: { "playlists.{channel}.channel_name": "{name}" }
    - json_match: { "$.RequestID": "^(80|1001)$", "$.Code": "^0$" }
      json_each: "$.Result[*].Items"
      json: { channel: "$^.ChannelIndex", index: "$.Index", name: "$.Name", display: "$.DisplayName", id: "$.Id",
              status: "$.Status" }
      state:
        "playlists.{channel}.items.{index}.name": "{name}"
        "playlists.{channel}.items.{index}.display_name": "{display}"
        "playlists.{channel}.items.{index}.id": "{id}"
        "playlists.{channel}.items.{index}.status": "{status}"
