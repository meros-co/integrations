    send: '{"Command":"playlist.getmeta","RequestID":82,"ChannelIndex":{channel},"Name":{name:json}}'
    expect: { reply_json: { "$.RequestID": "82" }, code_path: "$.Code", code_range: [0, 0], json_path: "$.Result" }
    returns: value
  playlist_activate_index:
