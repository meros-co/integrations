      serial: *kls_serial
      group: *group
      device_ip: *device_ip
    send: { method: POST, path: /v1/kls/input/manual/add, content_type: application/json, body: '{"serial_number":{serial:json},"manuals":[{"dis_g_name":{group:json},"dis_d_ip":{device_ip:json}}]}' }
