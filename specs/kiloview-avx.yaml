  # ── 4.5 Panel inputs, 4.6 Panel outputs ──────────────────────────────
  add_panel_inputs:
    summary: "Add input sources to a panel; inputs is the API's inputs list, each a discovered source's fields (4.5.1)"
    params:
      panel: *panel
      inputs: { type: json, required: true, label: Inputs, description: "A list of source objects as 4.5.1 documents (name, alias, c_name, g_name, d_ip, d_port, url, enable, dis_method, dis_g_name, dis_d_ip, dis_s_ip, vlan_id, switcher_id), as the discovery queries return them." }
    send: { method: POST, path: /v1/panel/input/add, content_type: application/json, body: '{"id":{panel},"inputs":{inputs}}' }
    expect: *ok
    returns: ack
  remove_panel_input:
    summary: Remove an input source from a panel (4.5.2)
    params:
      panel: *panel
      input: *input_id
    send: { method: POST, path: /v1/panel/input/remove, content_type: application/json, body: '{"id":{panel},"input_ids":[{input}]}' }
    expect: *ok
    returns: ack
  remove_panel_inputs:
    summary: "Remove several input sources from a panel; ids is the API's input_ids list (4.5.2)"
    params:
      panel: *panel
      ids: { type: json, required: true, label: Input IDs, description: "A list of input ids, as panel_inputs.<panel>.<id> in state lists them." }
    send: { method: POST, path: /v1/panel/input/remove, content_type: application/json, body: '{"id":{panel},"input_ids":{ids}}' }
    expect: *ok
    returns: ack
  sort_panel_inputs:
    summary: "Put a panel's input sources in order; ids is the API's input_ids list in the new order (4.5.3)"
    params:
      panel: *panel
      ids: { type: json, required: true, label: Input order, description: "The panel's input ids in the order wanted, such as [3, 1, 2]." }
    send: { method: POST, path: /v1/panel/input/sort, content_type: application/json, body: '{"id":{panel},"input_ids":{ids}}' }
    expect: *ok
    returns: ack
  add_panel_output:
    summary: Add an NDI output to a panel (4.6.1)
    params:
      panel: *panel
      output: *output_id
    send: { method: POST, path: /v1/panel/output/add, content_type: application/json, body: '{"id":{panel},"output_ids":[{output}]}' }
    expect: *ok
    returns: ack
  add_panel_outputs:
    summary: "Add several NDI outputs to a panel; ids is the API's output_ids list (4.6.1)"
    params:
      panel: *panel
      ids: { type: json, required: true, label: Output IDs, description: "A list of output ids, as outputs.<id> in state lists them." }
    send: { method: POST, path: /v1/panel/output/add, content_type: application/json, body: '{"id":{panel},"output_ids":{ids}}' }
    expect: *ok
    returns: ack
  remove_panel_output:
    summary: Remove an NDI output from a panel (4.6.2)
    params:
      panel: *panel
      output: *output_id
    send: { method: POST, path: /v1/panel/output/remove, content_type: application/json, body: '{"id":{panel},"output_ids":[{output}]}' }
    expect: *ok
    returns: ack
  remove_panel_outputs:
    summary: "Remove several NDI outputs from a panel; ids is the API's output_ids list (4.6.2)"
    params:
      panel: *panel
      ids: { type: json, required: true, label: Output IDs, description: "A list of output ids, as panel_outputs.<panel>.<id> in state lists them." }
    send: { method: POST, path: /v1/panel/output/remove, content_type: application/json, body: '{"id":{panel},"output_ids":{ids}}' }
    expect: *ok
    returns: ack
  sort_panel_outputs:
    summary: "Put a panel's outputs in order; ids is the API's output_ids list in the new order (4.6.3)"
    params:
      panel: *panel
      ids: { type: json, required: true, label: Output order, description: "The panel's output ids in the order wanted, such as [3, 1, 2]." }
    send: { method: POST, path: /v1/panel/output/sort, content_type: application/json, body: '{"id":{panel},"output_ids":{ids}}' }
    expect: *ok
    returns: ack

  # ── 4.7 Cross switching ──────────────────────────────────────────────
  get_panel_detail:
    summary: Return a panel's inputs, outputs and what each output carries (4.7.1)
