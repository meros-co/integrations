        "ports.{port}.poe.enabled": "{poe}"
        "ports.{port}.poe.type": "{poe_type}"
        "ports.{port}.poe.power": "{poe_power}"
        "ports.{port}.poe.voltage": "{poe_voltage}"
        "ports.{port}.poe.current": "{poe_current}"
        "ports.{port}.bind_ip.enabled": "{bind}"
