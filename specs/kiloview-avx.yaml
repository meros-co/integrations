        "ports.{port}.device_model": "{model}"
        "ports.{port}.device_image": "{image}"
        "ports.{port}.device_company": "{company}"
        "ports.{port}.connect_mode": "{mode}"
    - path: "^/v1/switch/port/traffic$"
      request_match: { "$.port": "^(\\d+)$" }
      json_match: *ok200
      json: { traffic: "$.data.traffic" }
      state: { "port_traffic.{1}": "{traffic}" }
    - path: "^/v1/switch/port/traffic/query/top$"
      json_match: *ok200
      json: { rx: "$.data.sum_rx_rate", tx: "$.data.sum_tx_rate" }
      state: { traffic.rx_rate_total: "{rx}", traffic.tx_rate_total: "{tx}" }
    - path: "^/v1/switch/port/traffic/query/top$"
      json_match: *ok200
      json_each: "$.data.desc_stat"
      json: { port: "$.port", rx: "$.rx_rate", tx: "$.tx_rate", top: "$.top_rate", usage: "$.top_usage" }
      replace: traffic.top
      state:
        "traffic.top.{index}.port": "{port}"
