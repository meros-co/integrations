      discovery_server_ip: { type: string, required: true, label: Discovery Server, description: "The NDI Discovery Server the output registers with; empty for none." }
    send:
      method: POST
      path: /v1/kls/output/modify
      content_type: application/json
      body: '{"uuid":{uuid:json},"name":{name:json},"vlan_id":{vlan},"g_name":{group:json},"dis_s_ip":{discovery_server_ip:json}}'
    expect: *ok
    returns: ack
  kls_get_output:
    summary: Return one KLS output (5.2.4)
    params:
      uuid: *kls_output
    send: { method: GET, path: /v1/kls/output/query, query: { uuid: "{uuid}" } }
    expect: *data
    returns: value
  kls_get_outputs:
    summary: Return every KLS output (5.2.5)
    send: { method: GET, path: /v1/kls/output/query/all }
    expect: *data
    returns: value
  kls_add_panel:
    summary: Add a KLS panel (5.3.1)
    params:
      name: { type: string, required: true, label: Name, description: "The panel's name." }
      uuid: &kls_panel { type: string, required: true, label: Panel UUID, description: "The KLS panel's UUID." }
      serial: *kls_serial
    send: { method: POST, path: /v1/kls/panel/add, content_type: application/json, body: '{"name":{name:json},"uuid":{uuid:json},"serial_number":{serial:json}}' }
    expect: *ok
    returns: ack
  kls_delete_panel:
    summary: Delete a KLS panel (5.3.2)
    params:
      uuid: *kls_panel
      serial: *kls_serial
    send: { method: POST, path: /v1/kls/panel/delete, content_type: application/json, body: '{"uuid":{uuid:json},"serial_number":{serial:json}}' }
    expect: *ok
    returns: ack
  kls_enable_switcher:
    summary: "Enable a KLS switch with its whole configuration: discoveries, inputs, outputs, panels, panel inputs and outputs and routing, each as the API's list (5.3.3)"
    params:
      serial: *kls_serial
      discoveries: { type: json, required: true, label: Discoveries, description: "The discoverys list: objects with dis_method, dis_g_name, dis_d_ip and dis_s_ip." }
      inputs: { type: json, required: true, label: Inputs, description: "The inputs list: objects with name, alias, channel_name, group_name, dev_ip, dev_port, url, enable, dis_method, dis_g_name, dis_d_ip, dis_s_ip, vlan_id and switcher_id." }
      outputs: { type: json, required: true, label: Outputs, description: "The outputs list: objects with uuid, name, alias, channel_name, group_name, router, codec_keepconn, dis_s_ip, locked, enable, vlan_id, switcher_id, multi_add, multi_mask and ttl_time." }
      panels: { type: json, required: true, label: Panels, description: "The panels list: objects with uuid, name and Icon." }
      panel_inputs: { type: json, required: true, label: Panel inputs, description: "The panel_inputs list: objects with panel_uuid and input (an input object as above)." }
      panel_outputs: { type: json, required: true, label: Panel outputs, description: "The panel_outputs list: objects with panel_uuid and output (an output object as above)." }
      panel_matrix: { type: json, required: true, label: Panel routing, description: "The panel_matrixs list: objects with panel_uuid, output_uuid, input_name, rl_uuid (playlist) and rl_loop." }
    send:
      method: POST
      path: /v1/kls/panel/switcher/enable
      content_type: application/json
      body: '{"serial_number":{serial:json},"discoverys":{discoveries},"inputs":{inputs},"outputs":{outputs},"panels":{panels},"panel_inputs":{panel_inputs},"panel_outputs":{panel_outputs},"panel_matrixs":{panel_matrix}}'
    expect: *ok
    returns: ack
  kls_delete_device:
    summary: Delete a KLS device (5.3.4)
    params:
      serial: *kls_serial
    send: { method: POST, path: /v1/kls/panel/device/delete, content_type: application/json, body: '{"serial_number":{serial:json}}' }
    expect: *ok
    returns: ack
  kls_add_panel_inputs:
    summary: "Add input sources to a KLS panel; inputs is the API's inputs list (5.4.1)"
    params:
      panel: *kls_panel
      inputs: { type: json, required: true, label: Inputs, description: "A list of source objects as 5.4.1 documents (name, alias, c_name, g_name, d_ip, d_port, url, enable, dis_method, dis_g_name, dis_d_ip, dis_s_ip, vlan_id, switcher_id)." }
    send: { method: POST, path: /v1/kls/panel/input/add, content_type: application/json, body: '{"panel_uuid":{panel:json},"inputs":{inputs}}' }
    expect: *ok
    returns: ack
  kls_remove_panel_input:
    summary: Remove an input source from a KLS panel (5.4.2)
    params:
      panel: *kls_panel
      input: &kls_input { type: string, required: true, label: Input name, description: "The input source's name, as kls_panels.<uuid>.inputs.<name> in state lists it." }
    send: { method: POST, path: /v1/kls/panel/input/remove, content_type: application/json, body: '{"panel_uuid":{panel:json},"input_names":[{input:json}]}' }
    expect: *ok
    returns: ack
  kls_remove_panel_inputs:
    summary: "Remove several input sources from a KLS panel; names is the API's input_names list (5.4.2)"
    params:
      panel: *kls_panel
      names: { type: json, required: true, label: Input names, description: "A list of input source names." }
    send: { method: POST, path: /v1/kls/panel/input/remove, content_type: application/json, body: '{"panel_uuid":{panel:json},"input_names":{names}}' }
    expect: *ok
    returns: ack
  kls_add_panel_output:
    summary: Add a KLS output to a KLS panel (5.5.1)
    params:
      panel: *kls_panel
      output: *kls_output
    send: { method: POST, path: /v1/kls/panel/output/add, content_type: application/json, body: '{"panel_uuid":{panel:json},"output_uuids":[{output:json}]}' }
    expect: *ok
    returns: ack
  kls_add_panel_outputs:
    summary: "Add several KLS outputs to a KLS panel; uuids is the API's output_uuids list (5.5.1)"
    params:
      panel: *kls_panel
      uuids: { type: json, required: true, label: Output UUIDs, description: "A list of KLS output UUIDs." }
    send: { method: POST, path: /v1/kls/panel/output/add, content_type: application/json, body: '{"panel_uuid":{panel:json},"output_uuids":{uuids}}' }
    expect: *ok
    returns: ack
  kls_remove_panel_output:
    summary: Remove a KLS output from a KLS panel (5.5.2)
    params:
      panel: *kls_panel
      output: *kls_output
    send: { method: POST, path: /v1/kls/panel/output/remove, content_type: application/json, body: '{"panel_uuid":{panel:json},"output_uuids":[{output:json}]}' }
    expect: *ok
    returns: ack
  kls_remove_panel_outputs:
    summary: "Remove several KLS outputs from a KLS panel; uuids is the API's output_uuids list (5.5.2)"
    params:
      panel: *kls_panel
      uuids: { type: json, required: true, label: Output UUIDs, description: "A list of KLS output UUIDs." }
    send: { method: POST, path: /v1/kls/panel/output/remove, content_type: application/json, body: '{"panel_uuid":{panel:json},"output_uuids":{uuids}}' }
    expect: *ok
    returns: ack
  kls_get_panel:
    summary: Return a KLS panel's inputs, outputs and what each output carries (5.6.1)
    params:
      panel: *kls_panel
    send: { method: GET, path: /v1/kls/panel/detail, query: { panel_uuid: "{panel}" } }
    expect: *data
    returns: value
  kls_route:
    summary: Route an input source to an output of a KLS panel (5.6.2)
    params:
      panel: *kls_panel
      output: *kls_output
      input: *kls_input
    send: { method: POST, path: /v1/kls/panel/cross/output/input, content_type: application/json, body: '{"panel_uuid":{panel:json},"output_uuid":{output:json},"input_name":{input:json}}' }
    expect: *ok
    returns: ack
  kls_select_input_all:
    summary: Route an input source to every output of a KLS panel, or take it off them (5.6.3)
    params:
      panel: *kls_panel
      input: *kls_input
      select: { type: bool, default: true, label: Select, description: "On to select the input on every output; off to deselect it." }
    send: { method: POST, path: /v1/kls/panel/cross/input/select, content_type: application/json, body: '{"panel_uuid":{panel:json},"input_name":{input:json},"select":{select}}' }
    expect: *ok
    returns: ack

  # ── 6 KLS binding ────────────────────────────────────────────────────
  bind_kls:
    summary: Bind a KLS at an address to an interface and position (6.1)
    params:
      ip: { type: string, required: true, label: KLS address, description: "The KLS's IP address." }
      ifname: { type: string, required: true, label: Interface, description: "The interface name, such as 1 for eth1.1 (get_kls_vlans lists them)." }
      location: { type: int, min: 0, required: true, label: Position, description: "The position ID to bind the KLS at." }
    send: { method: POST, path: /v1/bindkls/tobind, content_type: application/json, body: '{"ip":{ip:json},"ifname":{ifname:json},"location":{location}}' }
    expect: *ok
    returns: ack
  unbind_kls:
    summary: Unbind the KLS at a position (6.2)
    params:
      location: { type: int, min: 0, required: true, label: Position, description: "The position ID, as kls.bindings.<id> in state lists it." }
    send: { method: GET, path: /v1/bindkls/unbind, query: { id: "{location}" } }
    expect: *ok
    returns: ack
  get_kls_vlans:
    summary: Return the interface names a KLS can be bound on (6.3)
    send: { method: GET, path: /v1/bindkls/vlan }
    expect: *data
    returns: value
  get_kls_binding:
    summary: Return the binding status and every bound position (6.4)
    send: { method: GET, path: /v1/bindkls/bindinfo }
    expect: *data
    returns: value
  get_kls_binding_status:
    summary: Return the binding status alone (6.5)
    send: { method: GET, path: /v1/bindkls/status }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.data.status" }
    returns: value

  # ── 7 Icons ──────────────────────────────────────────────────────────
  upload_icon:
    summary: Upload a custom icon image as multipart form data (7.1)
    params:
      index: { type: int, min: 0, required: true, label: Icon index, description: "The icon's index." }
      file: { type: binary, required: true, label: Icon file, description: "The icon's image file." }
      name: { type: string, required: true, pattern: '^[^/\\"]+$', label: Icon name, description: "The icon's file name, such as custom_icon.png." }
      mime_type: { type: string, default: image/png, pattern: '^[a-z]+/[A-Za-z0-9.+-]+$', label: MIME type, description: "The image's media type, image/png by default." }
      width: { type: int, min: 1, required: true, label: Width, description: "The icon's width in pixels." }
      height: { type: int, min: 1, required: true, label: Height, description: "The icon's height in pixels." }
    send:
      method: POST
      path: /v1/icon/upload
      multipart:
        - { name: index, value: "{index}" }
        - { name: icon_file, binary: file, filename: "{name}", content_type: "{mime_type}" }
        - { name: icon_name, value: "{name}" }
        - { name: mime_type, value: "{mime_type}" }
        - { name: width, value: "{width}" }
        - { name: height, value: "{height}" }
    expect: *ok
    returns: ack
  modify_icons:
    summary: "Modify custom icons named by id; ids is the API's list of icon ids, the request's only field (7.2)"
    params:
      ids: { type: json, required: true, label: Icon IDs, description: "A list of custom icon ids, as icons.<id> in state lists them." }
    send: { method: POST, path: /v1/icon/modify, content_type: application/json, body: '{"ids":{ids}}' }
    expect: *ok
    returns: ack
  get_icons:
    summary: Return the official and custom icons (7.3)
    send: { method: GET, path: /v1/icon/all }
    expect: *data
    returns: value
  notify_icon_update:
    summary: Notify the device that an icon was updated (7.4)
    params:
      name: { type: string, required: true, label: Icon name, description: "The icon's name, such as custom_icon.png." }
    send: { method: POST, path: /v1/icon/notify/update, content_type: application/json, body: '{"icon_name":{name:json}}' }
    expect: *ok
    returns: ack

  # ── 8 Front panel ────────────────────────────────────────────────────
  preview_input:
    summary: Turn the preview of an input source on or off (8.1)
    params:
      input: *input_id
      enabled: { type: bool, default: true, label: Preview, description: "On to preview the input source; off to stop." }
    send: { method: POST, path: /v1/front/input/preview, content_type: application/json, body: '{"input_id":{input},"enable":{enabled}}' }
    expect: *ok
    returns: ack
  take:
    summary: Switch an input source to an output of a front panel (8.2)
    params:
      panel: &front_panel { type: int, min: 0, required: true, label: Front panel, description: "The front panel's id, as front_panels.<id> in state lists it." }
      input: *input_id
      output: { type: int, min: 0, required: true, label: Output, description: "The output's id, as front_panels.<panel>.outputs.<id> in state lists it." }
    send: { method: POST, path: /v1/front/input/output/take, content_type: application/json, body: '{"panel_id":{panel},"input_id":{input},"output_ids":[{output}]}' }
    expect: *ok
    returns: ack
  take_all:
    summary: "Switch an input source to several outputs of a front panel; outputs is the API's output_ids list (8.2)"
    params:
      panel: *front_panel
      input: *input_id
      outputs: { type: json, required: true, label: Outputs, description: "A list of output ids, as front_panels.<panel>.outputs.<id> in state lists them." }
    send: { method: POST, path: /v1/front/input/output/take, content_type: application/json, body: '{"panel_id":{panel},"input_id":{input},"output_ids":{outputs}}' }
    expect: *ok
    returns: ack
  get_front_panels:
    summary: Return the front panel's panels (8.3)
    send: { method: GET, path: /v1/front/panel/query }
    expect: *data
    returns: value
  get_front_panel:
    summary: Return a front panel's inputs and outputs and what each output carries (8.4)
    params:
      panel: *front_panel
    send: { method: GET, path: /v1/front/panel/detail, query: { panel_id: "{panel}" } }
    expect: *data
    returns: value
  stop_ndi:
    summary: Stop NDI (8.5)
    send: { method: POST, path: /v1/front/ndi/stop }
    expect: *ok
    returns: ack

  # ── 9 VLAN configuration profiles ────────────────────────────────────
  get_vlan_profiles:
    summary: Return the VLAN configurations (profiles such as NDI) with their VLANs (9.1)
    send: { method: GET, path: /v1/vlan/cfg/all }
    expect: *data
    returns: value
  modify_vlan_profile:
    summary: Set the VLANs of a VLAN configuration (9.2)
    params:
      profile: { type: int, min: 0, required: true, label: Configuration, description: "The VLAN configuration's id, as vlan_profiles.<id> in state lists it." }
      vlans: { type: string, required: true, label: VLAN IDs, description: "The VLAN IDs, written as the document's example writes them, such as 1." }
    send: { method: POST, path: /v1/vlan/cfg/modify, content_type: application/json, body: '{"id":{profile},"vlan_ids":{vlans:json}}' }
    expect: *ok
    returns: ack

  # ── 10 Topology ──────────────────────────────────────────────────────
  get_topology:
    summary: Return the topology's nodes and links (10.1)
    send: { method: GET, path: /v1/topology/query }
    expect: *data
    returns: value
  get_topology_status:
    summary: Return the topology nodes' and links' status (10.2)
    send: { method: GET, path: /v1/topology/status/query }
    expect: { status: 200, json_path: "$.data" }
    returns: value
  get_topology_device_by_port:
    summary: Return the device on a switch port, with its traffic, media and resources (10.3)
    params:
      port: &port { type: int, min: 1, required: true, label: Port, description: "The switch port: 1-24 copper, 33-36 optical." }
    send: { method: POST, path: /v1/topology/dev/info/query, content_type: application/json, body: '{"data":{"port_id":{port},"dev_mac":""}}' }
    expect: *data
    returns: value
  get_topology_device_by_mac:
    summary: Return the device with a MAC address, with its traffic, media and resources (10.3)
    params:
      mac: &mac { type: string, required: true, label: MAC address, description: "The device's MAC address, such as 18:C3:F4:20:64:E1." }
    send: { method: POST, path: /v1/topology/dev/info/query, content_type: application/json, body: '{"data":{"port_id":0,"dev_mac":{mac:json}}}' }
    expect: *data
    returns: value

  # ── 11 Network diagnostic ────────────────────────────────────────────
  kls_start_diagnostic:
    summary: Start a KLS end-to-end diagnostic task with the default packet length, bandwidth and duration (11.1.1)
    params:
      task: { type: int, min: 0, required: true, label: Task ID, description: "The KLS task ID." }
      type: &diag_type { type: enum, values: [connectivity, quick, performance], default: connectivity, label: Diagnostic type, description: "connectivity, quick or performance." }
      from_dev: &from_dev { type: string, required: true, label: Source device, description: "The source device's name." }
      to_dev: &to_dev { type: string, required: true, label: Target device, description: "The target device's name." }
      from_mac: &from_mac { type: string, required: true, label: Source MAC, description: "The source device's MAC address." }
      to_mac: &to_mac { type: string, required: true, label: Target MAC, description: "The target device's MAC address." }
      from_ip: &from_ip { type: string, required: true, label: Source address, description: "The source device's IP address." }
      to_ip: &to_ip { type: string, required: true, label: Target address, description: "The target device's IP address." }
      from_type: &from_type { type: enum, values: [avx, device], default: avx, label: Source type, description: "avx for an AVX, device for any other device." }
      to_type: &to_type { type: enum, values: [avx, device], default: device, label: Target type, description: "avx for an AVX, device for any other device." }
    send:
      method: POST
      path: /v1/diagnose/task/rfppadd
      content_type: application/json
      body: '{"task_id":{task},"type":{type:map.diag_type},"from_dev":{from_dev:json},"to_dev":{to_dev:json},"from_mac":{from_mac:json},"to_mac":{to_mac:json},"from_ip":{from_ip:json},"to_ip":{to_ip:json},"from_type":{from_type:map.dev_type},"to_type":{to_type:map.dev_type}}'
    expect: *ok
    returns: ack
  kls_start_diagnostic_full:
    summary: Start a KLS end-to-end diagnostic task with every parameter given (11.1.1)
    params:
      task: { type: int, min: 0, required: true, label: Task ID, description: "The KLS task ID." }
      type: *diag_type
      role: { type: string, required: true, label: Role, description: "The RF02 serial number (role)." }
      packet_len: { type: int, min: 1, default: 1400, label: Packet length, description: "The test packets' length in bytes; 1400 by default." }
      speed: { type: int, min: 1, default: 900, label: Bandwidth, description: "The test bandwidth in Mbps; 900 by default." }
      duration: { type: int, min: 1, default: 120, label: Duration, description: "How long the diagnostic runs, in seconds; 120 by default." }
      from_dev: *from_dev
      to_dev: *to_dev
      from_mac: *from_mac
      to_mac: *to_mac
      from_ip: *from_ip
      to_ip: *to_ip
      from_type: *from_type
      to_type: *to_type
    send:
      method: POST
      path: /v1/diagnose/task/rfppadd
      content_type: application/json
      body: '{"task_id":{task},"type":{type:map.diag_type},"role":{role:json},"packet_len":{packet_len},"speed":{speed},"duration":{duration},"from_dev":{from_dev:json},"to_dev":{to_dev:json},"from_mac":{from_mac:json},"to_mac":{to_mac:json},"from_ip":{from_ip:json},"to_ip":{to_ip:json},"from_type":{from_type:map.dev_type},"to_type":{to_type:map.dev_type}}'
    expect: *ok
    returns: ack
  get_diagnostic_devices:
    summary: Return every device the switch knows, for end-to-end diagnostics (11.1.2)
    send: { method: GET, path: /v1/diagnose/task/alldev/list }
    expect: *data
    returns: value
  delete_diagnostic_task:
    summary: Delete a diagnostic task (11.1.3)
    params:
      task: &diag_task { type: int, min: 0, required: true, label: Task ID, description: "The diagnostic task's id, as diagnostics.tasks.<id> in state lists it." }
    send: { method: POST, path: /v1/diagnose/task/del, content_type: application/json, body: '{"ids":[{task}]}' }
    expect: *ok
    returns: ack
  delete_diagnostic_tasks:
    summary: "Delete several diagnostic tasks; ids is the API's list of task ids (11.1.3)"
    params:
      ids: { type: json, required: true, label: Task IDs, description: "A list of diagnostic task ids." }
    send: { method: POST, path: /v1/diagnose/task/del, content_type: application/json, body: '{"ids":{ids}}' }
    expect: *ok
    returns: ack
  get_diagnostic_result:
    summary: Return a diagnostic task's progress and per-device results (11.1.4)
    params:
      task: *diag_task
      task_type: { type: enum, values: [global, end_to_end], default: end_to_end, label: Task type, description: "global for a global diagnostic, end_to_end for an end-to-end one." }
    send: { method: POST, path: /v1/diagnose/task/device, content_type: application/json, body: '{"task_id":{task},"task_type":{task_type:map.task_type}}' }
    expect: *data
    returns: value
  start_diagnostic:
    summary: Start an end-to-end diagnostic between two devices with the default settings and return its task ID (11.1.5)
    params:
      from_dev: *from_dev
      from_ip: *from_ip
      from_mac: *from_mac
      to_dev: *to_dev
      to_ip: *to_ip
      to_mac: *to_mac
      type: *diag_type
    send:
      method: POST
      path: /v1/diagnose/task/p2pdev/add
      content_type: application/json
      body: '{"from_dev":{from_dev:json},"from_ip":{from_ip:json},"from_mac":{from_mac:json},"to_dev":{to_dev:json},"to_ip":{to_ip:json},"to_mac":{to_mac:json},"type":{type:map.diag_type}}'
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.data.task_id" }
    returns: value
  start_diagnostic_full:
    summary: Start an end-to-end diagnostic with its send/receive mode, bandwidth, duration and packet length, and return its task ID (11.1.5)
    params:
      from_dev: *from_dev
      from_ip: *from_ip
      from_mac: *from_mac
      to_dev: *to_dev
      to_ip: *to_ip
      to_mac: *to_mac
      type: *diag_type
      role: { type: enum, values: [recv, send, sendrecv], default: sendrecv, label: Mode, description: "recv, send or sendrecv: which way the test traffic goes." }
      speed: { type: int, min: 1, required: true, label: Bandwidth, description: "The test bandwidth in Mbps." }
      duration: { type: int, min: 1, required: true, label: Duration, description: "How long the diagnostic runs, in seconds." }
      packet_len: { type: int, min: 1, required: true, label: Packet length, description: "The test packets' length in bytes." }
    send:
      method: POST
      path: /v1/diagnose/task/p2pdev/add
      content_type: application/json
      body: '{"from_dev":{from_dev:json},"from_ip":{from_ip:json},"from_mac":{from_mac:json},"to_dev":{to_dev:json},"to_ip":{to_ip:json},"to_mac":{to_mac:json},"type":{type:map.diag_type},"role":{role:json},"speed":{speed},"duration":{duration},"packet_len":{packet_len}}'
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.data.task_id" }
    returns: value
  get_diagnostic_tasks:
    summary: Return the diagnostic task history (11.1.6)
    send: { method: GET, path: /v1/diagnose/task/query/type }
    expect: *data
    returns: value

  # ── 12.1 Switch system information ───────────────────────────────────
  get_switch_info:
    summary: Return the switch's MAC, uptime, versions, load, model, alias, serial number, KiloLink status and port use (12.1.1)
    send: { method: GET, path: /v1/switch/sys/info }
    expect: *data
    returns: value
  set_device_alias:
    summary: Set the alias a device shows in the topology, by its MAC address (12.1.2)
    params:
      mac: *mac
      alias: { type: string, required: true, label: Alias, description: "The device's new display alias, such as Camera-01." }
    send: { method: POST, path: /v1/switch/dev/alias/set, content_type: application/json, body: '{"mac":{mac:json},"alias":{alias:json}}' }
    expect: *ok
    returns: ack

  # ── 12.2 Ports ───────────────────────────────────────────────────────
  get_ports:
    summary: Return every port's VLAN, link, aggregation, traffic, EEE, PoE, bound IP, IGMP and attached device (12.2.1)
    send: { method: GET, path: /v1/switch/port/dump }
    expect: *data
    returns: value
  port_control:
    summary: Take a port down, bring it up or restart it, leaving its PoE policy as it is (12.2.2)
    params:
      port: *port
      command: { type: enum, values: [down, up, restart], required: true, label: Action, description: "down, up or restart." }
    send: { method: POST, path: /v1/switch/port/control, content_type: application/json, body: '{"switch_id":0,"port_id":{port},"command":{command:json}}' }
    expect: *ok
    returns: ack
  set_port:
    summary: "Set a port's alias, VLAN, link, EEE, PoE, static IP and IGMP; settings is the API's msg object (12.2.3)"
    params:
      settings: { type: json, required: true, label: Port settings, description: "The msg object as 12.2.3 documents: port (required), and any of alias, vlan, link, eee, poe, ip (enable, addr, op) and igmp, each shaped as get_ports reports it." }
    send: { method: POST, path: /v1/switch/port/set, content_type: application/json, body: '{"msg":{settings}}' }
    expect: *ok
    returns: ack
  set_ports:
    summary: "Set the enable, speed, EEE, PoE, uplink and VLAN of several ports at once; settings is the API's msg object (12.2.4)"
    params:
      settings: { type: json, required: true, label: Batch settings, description: "The msg object as 12.2.4 documents: ports (a list of port ids, required) and any of port_enable, speed_duplex, eee_enable, poe_enable, uplink and vlan." }
    send: { method: POST, path: /v1/switch/port/set/batch, content_type: application/json, body: '{"msg":{settings}}' }
    expect: *ok
    returns: ack
  set_port_enabled:
    summary: Enable or disable a port (12.2.4)
    params:
      port: *port
      enabled: { type: bool, default: true, label: Enabled, description: "On to enable the port; off to disable it." }
    send: { method: POST, path: /v1/switch/port/set/batch, content_type: application/json, body: '{"msg":{"ports":[{port}],"port_enable":{enabled}}}' }
    expect: *ok
    returns: ack
  set_port_poe:
    summary: Turn a port's PoE power on or off (12.2.4)
    params:
      port: *port
      enabled: { type: bool, default: true, label: PoE, description: "On to supply PoE power on the port; off to stop." }
    send: { method: POST, path: /v1/switch/port/set/batch, content_type: application/json, body: '{"msg":{"ports":[{port}],"poe_enable":{enabled}}}' }
    expect: *ok
    returns: ack
  set_port_eee:
    summary: Turn a port's Energy Efficient Ethernet on or off (12.2.4)
    params:
      port: *port
      enabled: { type: bool, default: true, label: EEE, description: "On to enable EEE on the port; off to disable it." }
    send: { method: POST, path: /v1/switch/port/set/batch, content_type: application/json, body: '{"msg":{"ports":[{port}],"eee_enable":{enabled}}}' }
    expect: *ok
    returns: ack
  set_port_speed:
    summary: Set a port's speed and duplex (12.2.4)
    params:
      port: *port
      speed_duplex: { type: string, required: true, pattern: '^[A-Za-z0-9]+$', label: Speed and duplex, description: "auto, 10G, 1G, 100MF, 10MF or another value the port reports in link.speed_duplex." }
    send: { method: POST, path: /v1/switch/port/set/batch, content_type: application/json, body: '{"msg":{"ports":[{port}],"speed_duplex":{speed_duplex:json}}}' }
    expect: *ok
    returns: ack
  set_port_alias:
    summary: Set a port's alias (12.2.5)
    params:
      port: *port
      alias: { type: string, required: true, label: Alias, description: "The port's display alias." }
    send: { method: POST, path: /v1/switch/port/alias/set, content_type: application/json, body: '{"port":{port},"alias":{alias:json}}' }
    expect: *ok
    returns: ack
  get_port_traffic:
    summary: Return a port's send and receive traffic statistics (12.2.6)
    params:
      port: *port
    send: { method: POST, path: /v1/switch/port/traffic, content_type: application/json, body: '{"port":{port}}' }
    expect: *data
    returns: value
  get_traffic_top:
    summary: Return the total receive and send rates and the busiest ports (12.2.7)
    send: { method: GET, path: /v1/switch/port/traffic/query/top }
    expect: *data
    returns: value
  watch_ports:
    summary: "Add ports to the watched list; ports is the API's list of port ids (12.2.8)"
    params:
      ports: &watch_ports { type: json, required: true, label: Ports, description: "A list of port ids, such as [1, 11, 33]." }
      type: &watch_type { type: string, default: select, pattern: '^[a-z_]+$', label: Watch type, description: "The watch type; select in the document's example." }
    send: { method: POST, path: /v1/switch/port/display/set, content_type: application/json, body: '{"type":{type:json},"ports":{ports}}' }
    expect: *ok
    returns: ack
  unwatch_ports:
    summary: "Remove ports from the watched list; ports is the API's list of port ids (12.2.9)"
    params:
      ports: *watch_ports
      type: *watch_type
    send: { method: POST, path: /v1/switch/port/display/del, content_type: application/json, body: '{"type":{type:json},"ports":{ports}}' }
    expect: *ok
    returns: ack
  get_watched_ports:
    summary: Return the watched and cascade ports with their status (12.2.10)
    send: { method: GET, path: /v1/switch/port/display/query }
    expect: { status: 200, json_path: "$" }
    returns: value
  remove_device:
    summary: Remove the device connected to a switch port, for the duration given (12.2.11)
    params:
      port: *port
      duration: { type: int, min: 0, default: 0, label: Duration, description: "How long the removal lasts, in minutes; 0 for the default 10 minutes." }
      switch_sn: { type: string, default: "", label: Switch serial number, description: "The switch's serial number; empty for this device." }
    send: { method: POST, path: /v1/switch/device/remove, content_type: application/json, body: '{"switch_sn":{switch_sn:json},"port":{port},"duration":{duration}}' }
    expect: *ok
    returns: ack

  # ── 12.3 Port aggregation ────────────────────────────────────────────
  add_aggregation:
    summary: "Create a link aggregation group; members is the API's list of port ids (12.3.1)"
    params:
      group: { type: int, min: 0, default: 0, label: Group ID, description: "The aggregation group's id, unique on the device; 0 lets the device choose one." }
      alias: { type: string, required: true, label: Alias, description: "The aggregation group's alias." }
      type: { type: enum, values: [static, lacp_active], default: static, label: Type, description: "static, or lacp_active for LACP active." }
      members: &members { type: json, required: true, label: Member ports, description: "A list of port ids, such as [1, 2]." }
    send: { method: POST, path: /v1/switch/aggr/add, content_type: application/json, body: '{"msg":[{"aggre_id":{group},"alias":{alias:json},"type":{type:json},"members":{members}}]}' }
    expect: *ok
    returns: ack
  delete_aggregation:
    summary: Delete a link aggregation group (12.3.2)
    params:
      group: &aggr { type: int, min: 1, required: true, label: Group ID, description: "The aggregation group's id, as aggregations.<id> in state lists it." }
    send: { method: POST, path: /v1/switch/aggr/del, content_type: application/json, body: '{"aggre_id":[{group}]}' }
    expect: *ok
    returns: ack
  delete_aggregations:
    summary: "Delete several link aggregation groups; ids is the API's aggre_id list (12.3.2)"
    params:
      ids: { type: json, required: true, label: Group IDs, description: "A list of aggregation group ids." }
    send: { method: POST, path: /v1/switch/aggr/del, content_type: application/json, body: '{"aggre_id":{ids}}' }
    expect: *ok
    returns: ack
  get_aggregations:
    summary: Return every link aggregation group with its configured and aggregated ports (12.3.3)
    send: { method: GET, path: /v1/switch/aggr/dump }
    expect: *data
    returns: value
  get_aggregation:
    summary: "Return the link aggregation groups named; ids is the API's aggre_id list (12.3.4)"
    params:
      ids: { type: json, required: true, label: Group IDs, description: "A list of aggregation group ids; an empty list returns none." }
    send: { method: POST, path: /v1/switch/aggr/get, content_type: application/json, body: '{"aggre_id":{ids}}' }
    expect: *data
    returns: value
  add_aggregation_ports:
    summary: "Add ports to a link aggregation group, keeping its type; members is the API's list of port ids (12.3.5)"
    params:
      group: *aggr
      members: *members
    send: { method: POST, path: /v1/switch/aggr/port/add, content_type: application/json, body: '{"aggre_id":{group},"members":{members}}' }
    expect: *ok
    returns: ack
  set_aggregation:
    summary: "Set a link aggregation group's alias, type and member ports; members is the API's list of port ids (12.3.6)"
    params:
      group: *aggr
      alias: { type: string, required: true, label: Alias, description: "The aggregation group's alias." }
      type: { type: enum, values: [static, lacp_active, lacp_passive], required: true, label: Type, description: "static, lacp_active (LACP active) or lacp_passive (LACP passive, the document's example)." }
      members: *members
    send: { method: POST, path: /v1/switch/aggr/set, content_type: application/json, body: '{"msg":[{"aggre_id":{group},"alias":{alias:json},"type":{type:json},"members":{members}}]}' }
    expect: *ok
    returns: ack

  # ── 12.4 VLANs ───────────────────────────────────────────────────────
  get_vlans:
    summary: Return every VLAN with its ports, interface, VLANIF and DHCP flags (12.4.1)
    send: { method: GET, path: /v1/switch/vlan/dump }
    expect: *data
    returns: value
  add_vlan:
    summary: Add a VLAN with an alias and color, the device filling in the rest; a VLAN with that ID is overwritten (12.4.2)
    params:
      vlan: *vlan_id
      alias: { type: string, required: true, label: Alias, description: "The VLAN's alias, such as vlan10." }
      color: &vlan_color { type: string, required: true, pattern: '^#[0-9A-Fa-f]{6}$', label: Color, description: "The VLAN's display color, such as #38bb70." }
    send: { method: POST, path: /v1/switch/vlan/add, content_type: application/json, body: '{"data":[{"id":{vlan},"alias":{alias:json},"color":{color:json}}]}' }
    expect: *ok
    returns: ack
  add_vlans:
    summary: "Add or overwrite VLANs; vlans is the API's data list of VLAN objects (12.4.2)"
    params:
      vlans: { type: json, required: true, label: VLANs, description: "A list of VLAN objects shaped as get_vlans reports them (id, configs, color, alias, ports, vlan_if, interface); fields left out take the device's defaults." }
    send: { method: POST, path: /v1/switch/vlan/add, content_type: application/json, body: '{"data":{vlans}}' }
    expect: *ok
    returns: ack
  set_vlan:
    summary: "Edit a VLAN; vlan is the API's data object (12.4.3)"
    params:
      vlan: { type: json, required: true, label: VLAN, description: "One VLAN object shaped as get_vlans reports it: id, configs, color, alias, ports and vlan_if." }
    send: { method: POST, path: /v1/switch/vlan/set, content_type: application/json, body: '{"data":{vlan}}' }
    expect: *ok
    returns: ack
  get_vlan:
    summary: Return one VLAN (12.4.4)
    params:
      vlan: *vlan_id
    send: { method: POST, path: /v1/switch/vlan/query, content_type: application/json, body: '{"vlan_id":{vlan}}' }
    expect: *data
    returns: value
  delete_vlan:
    summary: Delete a VLAN (12.4.5)
    params:
      vlan: *vlan_id
    send: { method: POST, path: /v1/switch/vlan/del, content_type: application/json, body: '{"vlans":[{vlan}]}' }
    expect: *ok
    returns: ack
  delete_vlans:
    summary: "Delete several VLANs; vlans is the API's list of VLAN IDs (12.4.5)"
    params:
      vlans: { type: json, required: true, label: VLAN IDs, description: "A list of VLAN IDs." }
    send: { method: POST, path: /v1/switch/vlan/del, content_type: application/json, body: '{"vlans":{vlans}}' }
    expect: *ok
    returns: ack
  set_vlan_ports:
    summary: "Add ports to a VLAN; ports is the API's list of port ids (12.4.6)"
    params:
      vlan: *vlan_id
      ports: { type: json, required: true, label: Ports, description: "A list of port ids to add to the VLAN, such as [35, 36]." }
    send: { method: POST, path: /v1/switch/vlan/port/set, content_type: application/json, body: '{"msg":[{"vlan_id":{vlan},"ports":{ports}}]}' }
    expect: *ok
    returns: ack
  set_vlans_ports:
    summary: "Add ports to several VLANs; settings is the API's msg list of {vlan_id, ports} (12.4.6)"
    params:
      settings: { type: json, required: true, label: VLAN ports, description: "A list of objects each with vlan_id and ports (a list of port ids)." }
    send: { method: POST, path: /v1/switch/vlan/port/set, content_type: application/json, body: '{"msg":{settings}}' }
    expect: *ok
    returns: ack

  # ── 12.5 DHCP ────────────────────────────────────────────────────────
  get_dhcp_clients:
    summary: Return every VLAN's DHCP clients (12.5.1)
    send: { method: POST, path: /v1/switch/dhcps/clients/dump, content_type: application/json, body: '{"vlan_id":[]}' }
    expect: *data
    returns: value
  get_dhcp_clients_of:
    summary: "Return the DHCP clients of the VLANs named; vlans is the API's vlan_id list (12.5.1)"
    params:
      vlans: { type: json, required: true, label: VLAN IDs, description: "A list of VLAN IDs." }
    send: { method: POST, path: /v1/switch/dhcps/clients/dump, content_type: application/json, body: '{"vlan_id":{vlans}}' }
    expect: *data
    returns: value
  get_dhcp:
    summary: Return a VLAN's interface and DHCP server configuration (12.5.2)
    params:
      vlan: *vlan_id
    send: { method: GET, path: /v1/switch/dhcps/get, query: { vlan_id: "{vlan}" } }
    expect: *data
    returns: value
  set_dhcp:
    summary: Configure a VLAN's interface and DHCP server (12.5.3)
    params:
      vlan: *vlan_id
      interface_enabled: { type: bool, required: true, label: Interface enabled, description: "On to enable the VLAN interface." }
      interface_ip: { type: string, required: true, label: Interface address, description: "The VLAN interface's IP address." }
      interface_netmask: { type: string, required: true, label: Interface mask, description: "The VLAN interface's subnet mask." }
      enabled: { type: bool, required: true, label: DHCP server, description: "On to run the DHCP server on the VLAN." }
      pool_start: { type: string, required: true, label: Pool start, description: "The first address the DHCP server gives out." }
      pool_end: { type: string, required: true, label: Pool end, description: "The last address the DHCP server gives out." }
      gateway_type: { type: enum, values: [default, manual], default: default, label: Gateway, description: "default to give out the VLAN interface's address as the gateway, manual to give gateway_ip." }
      gateway_ip: { type: string, default: "", label: Gateway address, description: "The gateway address given out, needed when the gateway is manual." }
      dns: { type: string, required: true, label: DNS server, description: "The DNS server address given out, such as 8.8.8.8." }
      lease_days: { type: int, min: 0, required: true, label: Lease days, description: "The lease time's days." }
      lease_hours: { type: int, min: 0, max: 23, required: true, label: Lease hours, description: "The lease time's hours." }
      lease_minutes: { type: int, min: 0, max: 59, required: true, label: Lease minutes, description: "The lease time's minutes." }
    send:
      method: POST
      path: /v1/switch/dhcps/set
      content_type: application/json
      body: '{"vlan_if":{"vlan_id":{vlan},"enable":{interface_enabled},"ip":{interface_ip:json},"netmask":{interface_netmask:json}},"dhcp":{"vlan_id":{vlan},"enable":{enabled},"ip_pool":{"start":{pool_start:json},"end":{pool_end:json}},"gateway":{"type":{gateway_type:json},"ip":{gateway_ip:json}},"dns":{dns:json},"lease_time":{"days":{lease_days},"hours":{lease_hours},"minutes":{lease_minutes}}}}'
    expect: *ok
    returns: ack
  enable_dhcp:
    summary: Turn a VLAN's DHCP server on or off (12.5.4)
    params:
      vlan: *vlan_id
      enabled: { type: bool, default: true, label: DHCP server, description: "On to run the DHCP server on the VLAN; off to stop it." }
    send: { method: POST, path: /v1/switch/dhcps/enable/set, content_type: application/json, body: '{"vlan_id":{vlan},"enable":{enabled}}' }
    expect: *ok
    returns: ack
  get_static_bindings:
    summary: Return every static IP binding (12.5.5)
    send: { method: POST, path: /v1/switch/dhcps/static/get, content_type: application/json, body: '{}' }
    expect: *data
    returns: value
  get_static_bindings_of:
    summary: "Return the static IP bindings of the VLANs named; vlans is the API's vlan_id list (12.5.5)"
    params:
      vlans: { type: json, required: true, label: VLAN IDs, description: "A list of VLAN IDs, such as [10, 20]." }
    send: { method: POST, path: /v1/switch/dhcps/static/get, content_type: application/json, body: '{"vlan_id":{vlans}}' }
    expect: *data
    returns: value
  set_static_binding:
    summary: Bind or unbind a static IP address to a MAC address and port (12.5.6)
    params:
      vlan: *vlan_id
      ip: { type: string, required: true, label: IP address, description: "The IP address to bind." }
      mac: { type: string, required: true, label: MAC address, description: "The MAC address to bind." }
      port: { type: int, min: 1, required: true, label: Port, description: "The switch port of the binding." }
      bind: { type: bool, default: true, label: Bind, description: "On to bind, off to unbind." }
      bind_type: { type: enum, values: [port, mac, unbound], default: port, label: Binding type, description: "port for a port-based binding (the only one the document says is supported), mac for a MAC-based one, unbound for none." }
    send:
      method: POST
      path: /v1/switch/dhcps/static/set
      content_type: application/json
      body: '{"data":[{"vlan_id":{vlan},"ip":{ip:json},"mac":{mac:json},"bind_port":{port},"op":{bind:bool01},"bind_type":{bind_type:map.bind_type}}]}'
    expect: *ok
    returns: ack
  set_static_bindings:
    summary: "Bind or unbind several static IP addresses; bindings is the API's data list of {vlan_id, ip, mac, bind_port, op, bind_type} (12.5.6)"
    params:
      bindings: { type: json, required: true, label: Bindings, description: "A list of objects each with vlan_id, ip, mac, bind_port, op (1 bind, 0 unbind) and bind_type (1 port, 2 MAC, 3 unbound)." }
    send: { method: POST, path: /v1/switch/dhcps/static/set, content_type: application/json, body: '{"data":{bindings}}' }
    expect: *ok
    returns: ack

  # ── 12.6 Power, 12.7 Static routes, 12.8 Network save ────────────────
  get_power:
    summary: Return the power slots and the total PoE power (12.6.1)
    send: { method: GET, path: /v1/switch/power/status/query }
    expect: *data
    returns: value
  add_route:
    summary: Add a static route (12.7.1)
    params:
      dest_ip: &dest_ip { type: string, required: true, label: Destination, description: "The destination network's address, such as 192.168.2.0." }
      dest_mask: &dest_mask { type: int, min: 0, max: 32, required: true, label: Prefix length, description: "The destination network's mask as a prefix length, such as 24 for 255.255.255.0." }
      next_hop: &next_hop { type: string, required: true, label: Next hop, description: "The next hop's IP address." }
      priority: &priority { type: int, min: 0, required: true, label: Priority, description: "The route's priority; a lower value is preferred." }
    send: { method: POST, path: /v1/switch/iproutes/add, content_type: application/json, body: '{"dest_ip":{dest_ip:json},"dest_mask":{dest_mask},"next_hop":{next_hop:json},"priority":{priority}}' }
    expect: *ok
    returns: ack
  delete_route:
    summary: Delete a static route (12.7.2)
    params:
      dest_ip: *dest_ip
      dest_mask: *dest_mask
      next_hop: *next_hop
      priority: *priority
    send: { method: POST, path: /v1/switch/iproutes/delete, content_type: application/json, body: '{"dest_ip":{dest_ip:json},"dest_mask":{dest_mask},"next_hop":{next_hop:json},"priority":{priority}}' }
    expect: *ok
    returns: ack
  get_routes:
    summary: Return every static route (12.7.3)
    send: { method: GET, path: /v1/switch/iproutes/get }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.routes" }
    returns: value
  save_network:
    summary: Save the network configuration (12.8.1)
    send: { method: POST, path: /v1/network/save }
    expect: *ok
    returns: ack
  get_network_status:
    summary: Return the network configuration's status flag (12.8.2)
    send: { method: GET, path: /v1/network/query }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.data.status" }
    returns: value

  # ── 13 Alarms ────────────────────────────────────────────────────────
  get_device_alarms:
    summary: Return the alarm events of the device with a MAC address (13.1.1)
    params:
      mac: *mac
    send: { method: GET, path: /v1/alarm/dev/events/get, query: { mac: "{mac}" } }
    expect: *data
    returns: value
  get_alarms:
    summary: Return every alarm event with the unread counts of each level (13.1.4)
    send: { method: GET, path: /v1/alarm/events/levels/get, raw_query: "alarm_levels=1&alarm_levels=2&alarm_levels=3" }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$" }
    returns: value
  delete_alarm:
    summary: Delete an alarm event (13.1.2)
    params:
      alarm: &alarm_id { type: int, min: 0, required: true, label: Alarm ID, description: "The alarm event's id, as alarms.events.<id> in state lists it." }
    send: { method: POST, path: /v1/alarm/events/del, content_type: application/json, body: '{"ids":[{alarm}]}' }
    expect: *ok
    returns: ack
  delete_alarms:
    summary: "Delete several alarm events; ids is the API's list of alarm ids (13.1.2)"
    params:
      ids: &alarm_ids { type: json, required: true, label: Alarm IDs, description: "A list of alarm event ids." }
    send: { method: POST, path: /v1/alarm/events/del, content_type: application/json, body: '{"ids":{ids}}' }
    expect: *ok
    returns: ack
  get_alarm_page:
    summary: Return one page of the alarm events with the total count (13.1.3)
    params:
      page: { type: int, min: 1, default: 1, label: Page, description: "The page to return, numbered from 1." }
      page_size: { type: int, min: 1, default: 20, label: Page size, description: "Events per page." }
    send: { method: POST, path: /v1/alarm/events/get, content_type: application/json, body: '{"page_index":{page},"page_size":{page_size}}' }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$" }
    returns: value
  find_alarms:
    summary: "Return one page of the alarm events matching a filter; filter is the API's request object (13.1.3)"
    params:
      filter: { type: json, required: true, label: Filter, description: "The 13.1.3 request object: any of alarm_level (a list of 1 error, 2 warning, 3 info), start_time and end_time (yyyy-MM-dd HH:mm:ss), status (1 unread, 2 read), page_index, page_size, port_id (a list) and keyword." }
    send: { method: POST, path: /v1/alarm/events/get, content_type: application/json, body: '{filter}' }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$" }
    returns: value
  get_alarms_by_level:
    summary: Return the alarm events of one level with the unread counts of each level (13.1.4)
    params:
      level: &alarm_level { type: enum, values: [error, warning, info], required: true, label: Level, description: "error, warning or info." }
    send: { method: GET, path: /v1/alarm/events/levels/get, query: { alarm_levels: "{level:map.alarm_level}" } }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$" }
    returns: value
  set_alarm_status:
    summary: Mark an alarm event read or unread (13.1.5)
    params:
      alarm: *alarm_id
      status: &alarm_status { type: enum, values: [read, unread], default: read, label: Status, description: "read or unread." }
    send: { method: POST, path: /v1/alarm/events/status/set, content_type: application/json, body: '{"ids":[{alarm}],"status":{status:map.alarm_status}}' }
    expect: *ok
    returns: ack
  set_alarms_status:
    summary: "Mark several alarm events read or unread; ids is the API's list of alarm ids (13.1.5)"
    params:
      ids: *alarm_ids
      status: *alarm_status
    send: { method: POST, path: /v1/alarm/events/status/set, content_type: application/json, body: '{"ids":{ids},"status":{status:map.alarm_status}}' }
    expect: *ok
    returns: ack
  export_alarms:
    summary: Export the alarm list to a spreadsheet file on the device and return its path there (13.1.7)
    send: { method: GET, path: /v1/alarm/list/export }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.data.file_path" }
    returns: value
  download_alarm_export:
    summary: "Save an alarm export, the Excel file export_alarms made, to a host file (POST /v1/alarm/file/download, 13.1.6)"
    params:
      file_path: { type: string, required: true, max_length: 1024, label: File path, description: "The file path export_alarms returned." }
      to: { type: save, required: true, label: Save to, description: "The host file the download is written to; replaced once the whole file has arrived." }
    send: { method: POST, path: /v1/alarm/file/download, content_type: application/json, body: '{"file_path":{file_path:json}}', save: to }
    expect: { status: 200 }
    returns: file
  export_alarms_by_level:
    summary: Export the alarms of one level to a spreadsheet file on the device and return its path there (13.1.7)
    params:
      level: *alarm_level
    send: { method: GET, path: /v1/alarm/list/export, query: { alarm_level: "{level:map.alarm_level}" } }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.data.file_path" }
    returns: value
  get_alarm_config:
    summary: Return the alarm policy (13.2.1)
    send: { method: GET, path: /v1/alarm/config/get }
    expect: *data
    returns: value
  set_alarm_config:
    summary: Set the alarm policy (13.2.2)
    params:
      cpu: { type: bool, required: true, label: CPU alarm, description: "On to raise CPU alarms." }
      memory: { type: bool, required: true, label: Memory alarm, description: "On to raise memory alarms." }
      temperature: { type: bool, required: true, label: Temperature alarm, description: "On to raise temperature alarms." }
      interval: { type: int, min: 0, required: true, label: Alarm interval, description: "The least time between two alarms of one type from one device, in minutes." }
      disconnect: { type: bool, required: true, label: Disconnection alarm, description: "On to raise an alarm when a device disconnects unexpectedly." }
      disconnect_duration: { type: int, min: 0, required: true, label: Disconnection time, description: "How long a device must stay disconnected before the alarm, in seconds; one back sooner raises none." }
    send:
      method: POST
      path: /v1/alarm/config/set
      content_type: application/json
      body: '{"cpu_enabled":{cpu},"mem_enabled":{memory},"temp_enabled":{temperature},"alarm_interval":{interval},"disconnect_alarm_enabled":{disconnect},"disconnect_duration":{disconnect_duration}}'
    expect: *ok
    returns: ack
  get_port_alarms:
    summary: Return every port's alarm events, a debugging request (13.3.1)
    send: { method: GET, path: /v1/alarm/ports/events/get }
    expect: *data
    returns: value
  get_port_alarm:
    summary: Return one port's alarm and error events, a debugging request (13.3.2)
    params:
      port: *port
    send: { method: POST, path: /v1/alarm/debug/port, content_type: application/json, body: '{"port_id":{port}}' }
    expect: *data
    returns: value

  # ── 14 Production test ───────────────────────────────────────────────
  test_factory_reset:
    summary: Restore factory settings through the production test interface (14.1.1)
    send: { method: GET, path: /v1/test/factory_reset }
    expect: *data
    returns: value
  get_fans:
    summary: Return the fan list (14.1.2)
    send: { method: GET, path: /v1/test/fan_list }
    expect: *data
    returns: value
  get_resources:
    summary: Return each board's load, temperature and versions, and the device's serial number and versions (14.1.3)
    send: { method: GET, path: /v1/test/get_resources }
    expect: *data
    returns: value
  get_test_port_status:
    summary: Return each switch port's speed, link, PoE power and test result (14.1.4)
    send: { method: GET, path: /v1/test/port_status }
    expect: *data
    returns: value
  set_serial_number:
    summary: Set the device's serial number (14.1.5)
    params:
      serial: { type: string, required: true, label: Serial number, description: "The device's new serial number." }
    send: { method: POST, path: /v1/test/set_serial_number, content_type: application/json, body: '{"serial_number":{serial:json}}' }
    expect: *data
    returns: value
  start_fan_test:
    summary: Start the fan test and return each fan's status and speed (14.1.6)
    send: { method: GET, path: /v1/test/start_fan_test }
    expect: *data
    returns: value
  stop_fan_test:
    summary: Stop the fan test (14.1.7)
    send: { method: GET, path: /v1/test/stop_fan_test }
    expect: *data
    returns: value
  get_usb_status:
    summary: Return the USB port's status (14.1.8)
    send: { method: GET, path: /v1/test/usb_port_status }
    expect: *data
    returns: value

  # ── 15 Page interface, 16 Reverse proxy ──────────────────────────────
  get_system_info:
    summary: Return the host name, versions, MAC, mode and CPU, temperature, memory and disk use (15.1)
    send: { method: GET, path: /api/systemctrl/report/get_system_info }
    expect: *data
    returns: value
  get_network:
    summary: Return every network interface's addressing, status and traffic (15.2)
    send: { method: GET, path: /api/networkmanager/report/get_network }
    expect: *data
    returns: value
  get_device_page:
    summary: Return the reverse proxy path of a child device's web page, by its MAC address (16.1)
    params:
      mac: *mac
    send: { method: GET, path: /v1/local/klnk/forward, query: { id: "{mac}" } }
    expect: *data
    returns: value

maps:
  diag_type: { connectivity: "0", quick: "1", performance: "2" }
  dev_type: { avx: "0", device: "1" }
  task_type: { global: "0", end_to_end: "1" }
  alarm_level: { error: "1", warning: "2", info: "3" }
  alarm_status: { unread: "1", read: "2" }
  bind_type: { port: "1", mac: "2", unbound: "3" }

quirks:
  - models: [all]
    severity: warning
    text: >
      Authentication: the core logs in with the username and password
      settings (1.1.1), keeps the token the answer holds (data.token) and
      sends it on every later request. The document does not say how a
      request carries the token; it is sent as "Authorization: Bearer
      <token>", as Kiloview's other HTTP APIs take theirs. The document's
      example token is a JWT valid for about an hour (its exp is 3660
      seconds after its nbf); a request answered HTTP 401 (taken to be an
      expired or refused token) has the core log in again and send it once
      more. A wrong password is answered with a code other than 200 and no
      token, which fails what waits for the login. The document's
      introduction mentions logout and session validation, but it
      documents no such request.
  - models: [all]
    severity: critical
    text: >
      These act at once and none asks for confirmation. route, select_input_all,
      take, take_all, kls_route, kls_select_input_all, kls_enable_switcher
      and stop_ndi change what NDI outputs carry; load_preset replaces the
      running configuration; factory_reset and test_factory_reset erase every
      setting; reboot, upgrade_firmware, set_switch_mode, port_control
      (down, restart) and remove_device interrupt traffic; set_port,
      set_ports, set_port_enabled, set_port_poe, set_port_speed, the VLAN,
      aggregation, DHCP, static binding, route and virtual NIC commands can
      cut off devices or this connection itself; add_vlan and add_vlans
      overwrite a VLAN with the same ID; the delete_* commands, kls_delete_*,
      remove_panel_* and unbind_kls cannot be undone; set_serial_number
      replaces the device's serial number.
  - models: [all]
    severity: warning
    text: >
      Request forms the document leaves open, read from its examples: a GET
      whose parameters the document writes as a JSON object (panel detail,
      output and panel queries, panel configuration, discovery queries, KLS
      output and panel queries, unbind_kls, front panel detail, device
      page) sends them as query parameters, as its URL examples for
      sethostname, ptp/detail/query and dhcps/get do. The document gives no
      port; port 80 is assumed. Set System Time (2.2.3) is documented at the
      same path as Set Timezone, /v1/systime/setLocation, and is sent there.
      modify_user sends every field of the document's example, the password
      among them, and its id as a number as the example does (the table
      says string). modify_vlan_profile sends vlan_ids as a string as the
      example does (the table says array). set_aggregation offers
      lacp_passive, which the example uses though its table lists static and
      lacp_active. set_static_binding sends bind_type as the request table
      numbers it (1 port, 2 MAC, 3 unbound), while the binding lists number
      their bind_type 0 unbound, 1 IP, 2 MAC, 3 IP and MAC. The single-port
      set_port_enabled, set_port_poe, set_port_eee and set_port_speed send
      one field of the batch request (12.2.4), whose fields the document
      marks optional; add_vlan sends id, alias and color only, the document
      saying the device fills in the fields left out. get_dhcp_clients sends
      an empty vlan_id list, as the document's example does, and
      get_static_bindings none, as its text says, both for every VLAN.
      upload_icon sends multipart form data, the document typing icon_file
      a file but writing its example as JSON. modify_icons sends the only
      field the document gives (ids), without saying what it modifies. The
      panel output configuration (4.8.2) is read under data.cfg_outputs as
      the table names it and data.outputs as the example does. The topology
      status reply (10.2) is read without the code its example leaves out,
      and its links under data.edges as the example names them and
      data.wires as the table does. The watched port reply (12.2.10) is read
      with and without the {code, message, data} envelope, as the document
      allows both.
  - models: [all]
    severity: info
    text: >
      Errors come back as a code other than 200 in the {code, message,
      data} envelope (the document names 70001 for a refused VLAN), which
      fails the command as a device error with that code; the document
      shows HTTP 200 for its answers and gives no list of codes. Some
      replies carry their data outside data: delete_preset's delete_info,
      get_routes' routes, the alarm counts, and the watched and topology
      status replies.
  - models: [all]
    severity: info
    text: >
      The device pushes nothing the document describes, so state is polled.
      Every 2 seconds the panel list, then each panel's details (routing,
      locks, signal), input and output configuration and physical panel
      enable, and the front panel list, then each front panel's details;
      every 5 seconds the switch and system information, ports, traffic,
      power, PTP, topology status, KLS binding and the alarm events; every
      30 seconds users, time, presets, virtual NICs and interface addresses,
      the Layer 2/3 mode, discovery methods and the sources each finds,
      outputs, KLS outputs, icons, VLAN configurations, topology, VLANs and
      each VLAN's DHCP server, aggregation, DHCP clients and static
      bindings, routes, the network status, alarm policy, diagnostic tasks
      and devices, watched ports, KLS interfaces, boards and versions, fans
      and the USB port. Every change a command makes has what it changed
      read again as soon as the device accepts it.
  - models: [all]
    severity: info
    text: >
      API limits: there is no list of inputs (inputs are what the panel
      details list, in each panel or among its other inputs) and no way to
      disconnect an output (the details report input_id 0 for none, but no
      request is documented to set it). An output's alias is set only when
      it is added. An output's lock is read (4.3.4 locked, 4.7.1
      panel_outputs lock) but no request of section 4 sets it: Modify
      Output (4.3.3) takes no locked field, and neither do the panel output
      and cross-switching requests (4.6, 4.7); the only documented write is
      the outputs list of a KLS switch's whole configuration
      (kls_enable_switcher, 5.3.3, outputs[].locked). The panel details' panel_templates and rotationlists,
      and the KLS panel details' templates and carousel lists, have no
      documented fields and no requests to change them, so they are not
      kept. There is no list of KLS panels: a KLS panel's state comes from
      kls_get_panel and the KLS commands that read it back. Preview state,
      the operation log export's file (the document names no download for
      it) cannot be read back; export_operation_log and export_alarms
      return the file's path on the device, and download_alarm_export saves
      the alarm export, an Excel file, to a host file (13.1.6). upload_firmware carries the
      file as base64 text inside JSON, so the caller gives the base64 text
      rather than a host file, and it is not streamed. A panel deleted from
      the web console stays in panel_* state until the device is opened
      again, since the panel list does not name the details it replaces.
      The debugging alarm requests (13.3) and the production test
      requests (14) are offered as documented; the debugging ones are not
      polled.
  - models: [all]
    severity: info
    text: >
      Field meanings follow the document where it is terse: the preset
      list's apply flag is kept as the document describes it (whether the
      preset is available); a port's PoE power, voltage and current, and the
      traffic rates, carry no unit in the document and are kept as numbers
      as reported; the switch's CPU, memory and fan load and the boards'
      figures are kept as the display strings the device sends (such as
      10%); the network status flag (12.8.2) is kept as status, which the
      document does not explain further.
  - models: [all]
    severity: info
    text: >
      Readings the document implies without stating: the time offset is in
      hours (its example gives 8 for Asia/Shanghai); the switch and system
      temperatures are in degrees Celsius; the PTP clock table's
      misaligned descriptions are read with de_mainclock as the offset from
      the master, average_delay as the mean path delay, and
      upstream_equipment and upstream_port as the upstream device and port;
      a panel output's input_id 0 means no input (the example shows 0 with
      linked false); a panel's other_inputs are the inputs not in it, so
      the inputs state is the union of both lists; set_dhcp sends an empty
      gateway address when the gateway type is default; get_alarms asks for
      all three levels in one request, taken as every alarm event; and
      enabling a panel on the physical front panel is taken to change the
      front panel list, which is read again.

state:
  # 1.1.5 users
  users.*.username: { type: string, description: "The user's login name" }
  users.*.alias: { type: string, description: "The user's display name" }
  users.*.role: { type: string, description: "common (a regular user) or admin (an administrator)" }
  users.*.online: { type: bool, description: "Whether the user is online" }
  users.*.first_login: { type: bool, description: "Whether the user is logging in for the first time" }
  users.*.created: { type: string, description: "When the user was created, yyyy-MM-dd HH:mm:ss" }
  users.*.updated: { type: string, description: "When the user was last changed, yyyy-MM-dd HH:mm:ss" }
  # 2.2.1 time
  time.timezone: { type: string, description: "The time zone, such as Asia/Shanghai" }
  time.ntp: { type: string, description: "The NTP servers, separated by spaces" }
  time.offset: { type: int, unit: h, description: "The time zone's offset" }
  time.now: { type: string, description: "The device's time when last read, yyyy-MM-dd HH:mm:ss" }
  time.source: { type: string, description: "pc, manual or ntp: where the time comes from" }
  # 2.3 PTP
  ptp.clocks.*.enabled: { type: bool, description: "Whether the PTP clock instance (1-3) is enabled" }
  ptp.clocks.*.domain: { type: int, description: "Its PTP domain" }
  ptp.clocks.*.type: { type: string, description: "BC, TC or stop" }
  ptp.clocks.*.identity: { type: string, description: "Its clock identity" }
  ptp.clocks.*.parent_port: { type: string, description: "Its parent port ID" }
  ptp.clocks.*.status: { type: string, description: "stopped, running or config_error" }
  ptp.clocks.*.two_step: { type: bool, description: "Whether two-step mode is on" }
  ptp.clocks.*.priority1: { type: int, description: "Priority 1, 0-255" }
  ptp.clocks.*.priority2: { type: int, description: "Priority 2, 0-255" }
  ptp.clocks.*.leap_second: { type: bool, description: "The leap second switch" }
  ptp.clocks.*.offset_from_master: { type: string, description: "The offset from the master clock, as the device reports it" }
  ptp.clocks.*.mean_path_delay: { type: string, description: "The average path delay, as the device reports it" }
  ptp.clocks.*.upstream_device: { type: string, description: "The upstream device's name" }
  ptp.clocks.*.upstream_port: { type: string, description: "The upstream port ID" }
  ptp.ports.*.clock: { type: int, description: "The PTP clock instance the port is bound to, 0 when unbound" }
  ptp.ports.*.mode: { type: string, description: "e2e or p2p" }
  ptp.ports.*.master: { type: bool, description: "Whether it is a primary (master) port" }
  # 3.1.1 presets
  presets.*.version: { type: string, description: "A saved preset, keyed by name: its version" }
  presets.*.apply: { type: bool, description: "The preset's apply flag, which the document describes as whether the preset is available" }
  # 3.2 virtual NICs (preset/vlan/interface)
  virtual_nics.*.ip: { type: string, description: "A VLAN's virtual NIC, keyed by VLAN ID: its IP address" }
  virtual_nics.*.netmask: { type: string, description: "Its subnet mask" }
  virtual_nics.*.alias: { type: string, description: "The VLAN's alias" }
  virtual_nics.*.color: { type: string, description: "The VLAN's color" }
  virtual_nics.*.enabled: { type: bool, description: "Whether the virtual interface is enabled (from get_virtual_nic)" }
  virtual_nics.*.type: { type: string, description: "How it is addressed, such as static (from get_virtual_nic)" }
  virtual_nics.*.referenced: { type: bool, description: "Whether the matrix references it (from get_virtual_nic)" }
  virtual_nics.*.default_route: { type: bool, description: "Whether it is the default route (from get_virtual_nic)" }
  virtual_nics.*.recommend_dhcp: { type: bool, description: "Whether DHCP is the recommended addressing (from get_virtual_nic)" }
  virtual_nics.*.recommend_manual: { type: bool, description: "Whether manual addressing is recommended (from get_virtual_nic)" }
  virtual_nics.*.recommended_ip: { type: string, description: "The recommended manual VLANIF address (from get_virtual_nic)" }
  virtual_nics.*.recommended_range: { type: string, description: "The recommended manual address range (from get_virtual_nic)" }
  interface_ips.*: { type: string, description: "Each VLAN interface's IP address, keyed by VLAN ID; 0 is the management port eth0" }
  switch.mode: { type: string, description: "layer2 or layer3" }
  # 4.1 discovery
  discovery.*.method: { type: string, description: "manual (one device), auto (a group) or server (an NDI Discovery Server)" }
  discovery.*.group: { type: string, description: "The discovery group" }
  discovery.*.device_ip: { type: string, description: "Manual discovery: the device's IP address" }
  discovery.*.server_ip: { type: string, description: "Server discovery: the NDI Discovery Server's IP address" }
  discovered.manual.*.name: { type: string, description: "A source the manual discoveries find, keyed by its URL (address:port): its name" }
  discovered.manual.*.alias: { type: string, description: "Its alias" }
  discovered.manual.*.channel_name: { type: string, description: "Its channel name" }
  discovered.manual.*.device_name: { type: string, description: "The sending device's name" }
  discovered.manual.*.device_ip: { type: string, description: "The sending device's IP address" }
  discovered.manual.*.device_port: { type: int, description: "The sending device's port" }
  discovered.manual.*.enabled: { type: bool, description: "Whether it is enabled" }
  discovered.manual.*.group: { type: string, description: "Its discovery group" }
  discovered.manual.*.vlan: { type: int, description: "Its VLAN ID" }
  discovered.manual.*.switch_serial: { type: string, description: "The serial number of the switch it was found on" }
  discovered.auto.*.*.name: { type: string, description: "A source automatic discovery finds, keyed by group then URL (address:port): its name" }
  discovered.auto.*.*.alias: { type: string, description: "Its alias" }
  discovered.auto.*.*.channel_name: { type: string, description: "Its channel name" }
  discovered.auto.*.*.device_name: { type: string, description: "The sending device's name" }
  discovered.auto.*.*.device_ip: { type: string, description: "The sending device's IP address" }
  discovered.auto.*.*.device_port: { type: int, description: "The sending device's port" }
  discovered.auto.*.*.enabled: { type: bool, description: "Whether it is enabled" }
  discovered.auto.*.*.vlan: { type: int, description: "Its VLAN ID" }
  discovered.auto.*.*.switch_serial: { type: string, description: "The serial number of the switch it was found on" }
  discovered.server.*.*.*.name: { type: string, description: "A source an NDI Discovery Server lists, keyed by server address, group, then URL (address:port): its name" }
  discovered.server.*.*.*.alias: { type: string, description: "Its alias" }
  discovered.server.*.*.*.channel_name: { type: string, description: "Its channel name" }
  discovered.server.*.*.*.device_name: { type: string, description: "The sending device's name" }
  discovered.server.*.*.*.device_ip: { type: string, description: "The sending device's IP address" }
  discovered.server.*.*.*.device_port: { type: int, description: "The sending device's port" }
  discovered.server.*.*.*.enabled: { type: bool, description: "Whether it is enabled" }
  discovered.server.*.*.*.vlan: { type: int, description: "Its VLAN ID" }
  discovered.server.*.*.*.switch_serial: { type: string, description: "The serial number of the switch it was found on" }
  # inputs, from the panel details (4.7.1)
  inputs.*.name: { type: string, description: "An input source, keyed by id: its name" }
  inputs.*.alias: { type: string, description: "Its alias" }
  inputs.*.channel_name: { type: string, description: "Its channel name" }
  inputs.*.group: { type: string, description: "Its group" }
  inputs.*.device_ip: { type: string, description: "The sending device's IP address" }
  inputs.*.device_port: { type: int, description: "The sending device's port" }
  inputs.*.url: { type: string, description: "Its URL (address:port)" }
  inputs.*.enabled: { type: bool, description: "Whether it is enabled" }
  inputs.*.discovery: { type: string, description: "How it was discovered: manual, auto or server" }
  inputs.*.discovery_group: { type: string, description: "Its discovery group" }
  inputs.*.discovery_device_ip: { type: string, description: "The discovered device's IP address" }
  inputs.*.discovery_server_ip: { type: string, description: "The NDI Discovery Server's IP address" }
  inputs.*.vlan: { type: int, description: "Its VLAN ID" }
  inputs.*.switch_serial: { type: string, description: "The serial number of the switch it is on" }
  inputs.*.resolution: { type: string, description: "Its video format, such as 1920x1080@60HZ (0x0@0HZ without signal)" }
  inputs.*.video_bitrate: { type: string, description: "Its video bitrate as the device shows it, such as 50.00Mbps" }
  inputs.*.audio_bitrate: { type: string, description: "Its audio bitrate as the device shows it, such as 1.50Mbps" }
