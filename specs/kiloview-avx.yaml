  kls_add_manual_discoveries:
    summary: "Add several manual input discoveries for a KLS; manuals is the API's manuals list of {dis_g_name, dis_d_ip} (5.1.2)"
    params:
      serial: *kls_serial
      manuals: { type: json, required: true, label: Manual discoveries, description: "A list of objects each with dis_g_name (the NDI group) and dis_d_ip (the device's IP address)." }
    send: { method: POST, path: /v1/kls/input/manual/add, content_type: application/json, body: '{"serial_number":{serial:json},"manuals":{manuals}}' }
    expect: *ok
    returns: ack
  kls_add_auto_discovery:
    summary: Add an automatic input discovery in a group for a KLS (5.1.3)
    params:
      serial: *kls_serial
      group: { type: string, required: true, label: Discovery group, description: "The NDI group whose sources are found automatically." }
    send: { method: POST, path: /v1/kls/input/auto/add, content_type: application/json, body: '{"serial_number":{serial:json},"dis_g_name":{group:json}}' }
    expect: *ok
    returns: ack
  kls_delete_discoveries:
    summary: "Delete input discoveries of a KLS; discoveries is the API's discoverys list of {dis_method, dis_g_name, dis_d_ip, dis_s_ip} (5.1.4)"
    params:
      serial: *kls_serial
      discoveries: { type: json, required: true, label: Discoveries, description: "A list of objects each with dis_method (manual, auto or server), dis_g_name, dis_d_ip and dis_s_ip naming a discovery to delete." }
