        "traffic.top.{index}.tx_rate": "{tx}"
        "traffic.top.{index}.top_rate": "{top}"
        "traffic.top.{index}.top_usage": "{usage}"
    # 12.2.10: the reply with or without the {code, message, data} envelope.
    - path: "^/v1/switch/port/display/query$"
      json_match: { "$.select_ports": "^\\[" }
      json_each: "$.select_ports"
      json: { port: "$.port" }
