        "vlans.{id}.vlan_if.netmask": "{vif_mask}"
      then_send: [{ method: GET, path: /v1/switch/dhcps/get, query: { vlan_id: "{id}" } }]
    - path: "^/v1/switch/vlan/query$"
      json_match: { "$.code": "^200$", "$.data.id": "^\\d+$" }
      json:
        id: "$.data.id"
        alias: "$.data.alias"
        color: "$.data.color"
        configs: "$.data.configs"
        names: "$.data.config_names"
        ports: "$.data.ports"
        if_enable: "$.data.interface.enable"
        if_ip: "$.data.interface.ip"
        if_mask: "$.data.interface.netmask"
        if_type: "$.data.interface.type"
        if_ref: "$.data.interface.referenced"
        if_route: "$.data.interface.is_default_route"
        dhcp: "$.data.dhcp_enable"
        conflict: "$.data.dhcp_conflict"
        vif_enable: "$.data.vlan_if.enable"
        vif_ip: "$.data.vlan_if.ip"
        vif_mask: "$.data.vlan_if.netmask"
      state: *vlan_state

