      uuids: { type: json, required: true, label: Output UUIDs, description: "A list of KLS output UUIDs, as kls_outputs.<uuid> in state lists them." }
    send: { method: POST, path: /v1/kls/output/delete, content_type: application/json, body: '{"uuids":{uuids}}' }
    expect: *ok
    returns: ack
  kls_modify_output:
    summary: Change a KLS output's name, VLAN, group and Discovery Server (5.2.3)
