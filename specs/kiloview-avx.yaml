    # ── 11 diagnostics ────────────────────────────────────────────────
    - path: "^/v1/diagnose/task/alldev/list$"
      json_match: *ok200
      json_each: "$.data"
      json: { name: "$.name", mac: "$.mac", sn: "$.serial_number", ip: "$.ip" }
      replace: diagnostics.devices
      state:
        "diagnostics.devices.{mac:key}.name": "{name}"
        "diagnostics.devices.{mac:key}.serial": "{sn}"
        "diagnostics.devices.{mac:key}.ip": "{ip}"
    - path: "^/v1/diagnose/task/query/type$"
      json_match: *ok200
      json_each: "$.data"
      json: { id: "$.id", name: "$.name", type: "$.type", from: "$.from_dev", to: "$.to_dev", seq: "$.seq", speed: "$.speed", duration: "$.duration", len: "$.pkg_len", vlan: "$.vlan_id", status: "$.status", sn: "$.switcher_sn", created: "$.create_time", updated: "$.update_time" }
      replace: diagnostics.tasks
      state:
        "diagnostics.tasks.{id}.name": "{name}"
        "diagnostics.tasks.{id}.type": { value: "{type}", map: { "0": global, "1": end_to_end } }
        "diagnostics.tasks.{id}.from": "{from}"
        "diagnostics.tasks.{id}.to": "{to}"
        "diagnostics.tasks.{id}.seq": "{seq}"
        "diagnostics.tasks.{id}.speed": "{speed}"
        "diagnostics.tasks.{id}.duration": "{duration}"
        "diagnostics.tasks.{id}.packet_len": "{len}"
        "diagnostics.tasks.{id}.vlan": "{vlan}"
        "diagnostics.tasks.{id}.status": { value: "{status}", map: { "0": in_progress, "1": completed, "2": partly_failed, "3": failed } }
        "diagnostics.tasks.{id}.switch_serial": "{sn}"
        "diagnostics.tasks.{id}.created": "{created}"
        "diagnostics.tasks.{id}.updated": "{updated}"
    - path: "^/v1/diagnose/task/device$"
      request_match: { "$.task_id": "^(\\d+)$" }
      json_match: *ok200
      json:
        msg: "$.data.result_msg"
        count: "$.data.device_count"
        done: "$.data.done"
        time: "$.data.diagnose_time"
        abnormal: "$.data.diagnose_info.abnormal"
        normal: "$.data.diagnose_info.normal"
        recognize: "$.data.diagnose_info.recognize"
        unrecognized: "$.data.diagnose_info.unrecognized"
        step: "$.data.diagnose_info.step"
        complete: "$.data.diagnose_info.network_diagnose"
      state:
        "diagnostics.results.{1}.message": "{msg}"
        "diagnostics.results.{1}.device_count": "{count}"
        "diagnostics.results.{1}.progress": "{done}"
        "diagnostics.results.{1}.time": "{time}"
        "diagnostics.results.{1}.abnormal": "{abnormal}"
        "diagnostics.results.{1}.normal_count": "{normal}"
        "diagnostics.results.{1}.recognized": "{recognize}"
        "diagnostics.results.{1}.unrecognized": "{unrecognized}"
        "diagnostics.results.{1}.step": "{step}"
        "diagnostics.results.{1}.complete": { value: "{complete}", map: { "0": false, "1": true } }
    - path: "^/v1/diagnose/task/device$"
      request_match: { "$.task_id": "^(\\d+)$" }
      json_match: *ok200
      json_each: "$.data.device_info_list"
      json: { id: "$.id", from: "$.from_dev", to: "$.to_dev", ping: "$.ping_result", delay: "$.delay", loss: "$.loss", rx: "$.rx", tx: "$.tx", ip: "$.ip", mac: "$.devmac", type: "$.dev_type", identify: "$.identify", cd: "$.check_device_data.check_delay", cl: "$.check_device_data.check_loss", ct: "$.check_device_data.check_tx", cv: "$.check_device_data.check_device", cp: "$.check_device_data.check_ping" }
      replace: "diagnostics.results.{1}.devices"
      state:
        "diagnostics.results.{1}.devices.{id}.from": "{from}"
        "diagnostics.results.{1}.devices.{id}.to": "{to}"
        "diagnostics.results.{1}.devices.{id}.ping": { value: "{ping}", map: { "0": not_connected, "1": connected, "2": not_tested } }
        "diagnostics.results.{1}.devices.{id}.delay": "{delay}"
        "diagnostics.results.{1}.devices.{id}.loss": "{loss}"
        "diagnostics.results.{1}.devices.{id}.rx": "{rx}"
        "diagnostics.results.{1}.devices.{id}.tx": "{tx}"
        "diagnostics.results.{1}.devices.{id}.ip": "{ip}"
        "diagnostics.results.{1}.devices.{id}.mac": "{mac}"
        "diagnostics.results.{1}.devices.{id}.device_type": "{type}"
        "diagnostics.results.{1}.devices.{id}.identified": { value: "{identify}", map: { "0": false, "1": true } }
        "diagnostics.results.{1}.devices.{id}.delay_ok": "{cd}"
        "diagnostics.results.{1}.devices.{id}.loss_ok": "{cl}"
        "diagnostics.results.{1}.devices.{id}.tx_ok": "{ct}"
        "diagnostics.results.{1}.devices.{id}.device_ok": "{cv}"
        "diagnostics.results.{1}.devices.{id}.ping_ok": "{cp}"

    # ── 12.1 switch information ───────────────────────────────────────
    - path: "^/v1/switch/sys/info$"
