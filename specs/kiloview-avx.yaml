    - path: "^/v1/switch/port/display/query$"
      json_match: { "$.cascade_ports": "^\\[" }
      json_each: "$.cascade_ports"
      json: { port: "$.port" }
      replace: watched_ports.cascade
      state: { "watched_ports.cascade.{port}": "true" }
    - path: "^/v1/switch/port/display/query$"
      json_match: { "$.data.select_ports": "^\\[" }
      json_each: "$.data.select_ports"
      json: { port: "$.port" }
      replace: watched_ports.select
      state: { "watched_ports.select.{port}": "true" }
    - path: "^/v1/switch/port/display/query$"
      json_match: { "$.data.cascade_ports": "^\\[" }
      json_each: "$.data.cascade_ports"
      json: { port: "$.port" }
      replace: watched_ports.cascade
      state: { "watched_ports.cascade.{port}": "true" }

    # ── 12.3 aggregation ──────────────────────────────────────────────
    - path: "^/v1/switch/aggr/dump$"
