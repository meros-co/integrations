        "ports.{port}.link.autonego": "{autonego}"
        "ports.{port}.link.flow_control": "{flow}"
        "ports.{port}.aggregation.id": "{aggr}"
        "ports.{port}.aggregation.type": "{aggr_type}"
        "ports.{port}.rx.packets": "{rxp}"
        "ports.{port}.rx.bytes": "{rxb}"
        "ports.{port}.rx.errors": "{rxe}"
        "ports.{port}.rx.loss": "{rxl}"
        "ports.{port}.tx.packets": "{txp}"
        "ports.{port}.tx.bytes": "{txb}"
        "ports.{port}.tx.errors": "{txe}"
        "ports.{port}.tx.loss": "{txl}"
        "ports.{port}.eee.actiphy": "{actiphy}"
        "ports.{port}.eee.perfect_reach": "{reach}"
