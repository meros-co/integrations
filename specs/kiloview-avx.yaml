    notes: >
      An NDI / AV-over-IP media hub with a built-in managed switch (24
      copper and 4 optical ports, ports 1-24 and 33-36): NDI input sources
      found by server, manual or automatic discovery, cross-switched to NDI
      outputs organized in panels, a physical front panel, KLS link
      switches bound to it, and the switch's ports, PoE, aggregation,
      VLANs, DHCP, PTP clocks, static routes, topology, diagnostics and
      alarms.

commands:
  # ── 1 User authentication ────────────────────────────────────────────
  login:
    summary: Log in as a user and return its token, beside the session the core keeps (1.1.1)
    params:
      username: { type: string, required: true, label: User name, description: "The user to log in as; admin on a new device in the document's example." }
      password: { type: string, required: true, secret: true, label: Password, description: "That user's password." }
    send: { method: POST, path: /v1/user/login, content_type: application/json, session: false, body: '{"username":{username:json},"password":{password:json}}' }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.data.token" }
    returns: value
  add_user:
    summary: Add a login user, a regular user or an administrator (1.1.3)
    params:
      username: { type: string, required: true, label: User name, description: "The new user's login name." }
      alias: { type: string, required: true, label: Alias, description: "The new user's display name." }
      password: { type: string, required: true, secret: true, label: Password, description: "The new user's password." }
      role: &role { type: enum, values: [common, admin], default: common, label: Role, description: "common for a regular user, admin for an administrator." }
    send: { method: POST, path: /v1/user/add, content_type: application/json, body: '{"alias":{alias:json},"password":{password:json},"role":{role:json},"username":{username:json}}' }
    expect: &ok { status: 200, code_path: "$.code", code_range: [200, 200] }
    returns: ack
  delete_user:
    summary: Delete a user (1.1.2)
    params:
      user: &user_id { type: int, min: 0, required: true, label: User ID, description: "The user's id, as users.<id> in state lists it." }
    send: { method: POST, path: /v1/user/delete, content_type: application/json, body: '{"ids":[{user}]}' }
    expect: *ok
    returns: ack
  delete_users:
    summary: "Delete several users; ids is the API's list of user ids (1.1.2)"
    params:
      ids: { type: json, required: true, label: User IDs, description: "A list of user ids, as users.<id> in state lists them." }
    send: { method: POST, path: /v1/user/delete, content_type: application/json, body: '{"ids":{ids}}' }
    expect: *ok
    returns: ack
  modify_user:
    summary: Change a user's alias, password and role (1.1.4)
    params:
      user: *user_id
      alias: { type: string, required: true, label: Alias, description: "The user's display name." }
      password: { type: string, required: true, secret: true, label: Password, description: "The user's password after the change." }
      role: { type: enum, values: [common, admin], required: true, label: Role, description: "common for a regular user, admin for an administrator." }
    send: { method: POST, path: /v1/user/modify, content_type: application/json, body: '{"alias":{alias:json},"id":{user},"password":{password:json},"role":{role:json}}' }
    expect: *ok
    returns: ack
  get_users:
    summary: Return every user with its role, online state and times (1.1.5)
    send: { method: GET, path: /v1/user/userlist }
    expect: &data { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.data" }
    returns: value

  # ── 2.1 System settings ──────────────────────────────────────────────
  set_hostname:
    summary: Set the device's host name (2.1.1)
    params:
      hostname: { type: string, required: true, label: Host name, description: "The device's new system host name, such as AVX-Core-Switch-001." }
    send: { method: GET, path: /v1/sys/sethostname, query: { hostname: "{hostname}" } }
    expect: *ok
    returns: ack
  factory_reset:
    summary: Restore every setting of the device to its factory default (2.1.2)
    send: { method: GET, path: /v1/sys/refactory }
    expect: *ok
    returns: ack
  get_system_log:
    summary: Return the system log as text (2.1.3)
    send: { method: GET, path: /v1/sys/syslog }
    expect: *data
    returns: value
  reboot:
    summary: Reboot the device (2.1.4)
    send: { method: GET, path: /v1/sys/reboot }
    expect: *ok
    returns: ack
  upload_firmware:
    summary: Upload a firmware file, its bytes base64-encoded in the JSON body (2.1.5); upgrade_firmware then installs it
    params:
      file: { type: string, required: true, pattern: '^[A-Za-z0-9+/]*={0,2}$', label: Firmware (base64), description: "The whole firmware file's bytes, base64-encoded (RFC 4648), as the request carries them." }
      filename: { type: string, required: true, label: File name, description: "The firmware file's name, such as AVX-Firmware.bin." }
    send: { method: POST, path: /v1/sys/upload, content_type: application/json, body: '{"u_file":{file:json},"filename":{filename:json}}' }
    expect: *ok
    returns: ack
  upgrade_firmware:
    summary: Install a firmware file uploaded with upload_firmware (2.1.6)
    params:
      filename: { type: string, required: true, label: File name, description: "The name the firmware file was uploaded under." }
    send: { method: POST, path: /v1/sys/upgrade, content_type: application/json, body: '{"filename":{filename:json}}' }
    expect: *ok
    returns: ack
  get_runtime_log:
    summary: Return the system's operation (runtime) log as text (2.1.7)
    send: { method: GET, path: /v1/sys/getlog }
    expect: *data
    returns: value
  export_operation_log:
    summary: Write the operation log to a text file on the device and return its path there (2.1.8)
    send: { method: GET, path: /v1/sys/operation/export }
    expect: *data
    returns: value

  # ── 2.2 System time ──────────────────────────────────────────────────
  get_time:
    summary: Return the time, time zone, offset, NTP servers and time source (2.2.1)
    send: { method: GET, path: /v1/systime/get }
    expect: *data
    returns: value
  set_timezone:
    summary: Set the time zone and its offset (2.2.2)
    params:
      timezone: { type: string, required: true, label: Time zone, description: "The time zone's name, such as Asia/Shanghai." }
      offset: &offset { type: int, required: true, label: Offset, description: "The time zone's offset from UTC in hours, such as 8." }
    send: { method: POST, path: /v1/systime/setLocation, content_type: application/json, body: '{"timezone":{timezone:json},"offset":{offset}}' }
    expect: *ok
    returns: ack
  set_time_ntp:
    summary: Take the time from NTP servers (2.2.3)
    params:
      offset: *offset
      ntp: { type: string, required: true, label: NTP servers, description: "The NTP servers, separated by spaces, such as time.windows.com pool.ntp.org." }
    send: { method: POST, path: /v1/systime/setLocation, content_type: application/json, body: '{"timetype":"ntp","offset":{offset},"ntp":{ntp:json}}' }
    expect: *ok
    returns: ack
  set_time_manual:
    summary: Set the time by hand (2.2.3)
    params:
      offset: *offset
      time: { type: string, required: true, pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$', label: Time, description: "The time to set, as yyyy-MM-dd HH:mm:ss." }
    send: { method: POST, path: /v1/systime/setLocation, content_type: application/json, body: '{"timetype":"manual","offset":{offset},"time":{time:json}}' }
    expect: *ok
    returns: ack
  set_time_pc:
    summary: Set the time source to the PC's time (2.2.3)
    params:
      offset: *offset
    send: { method: POST, path: /v1/systime/setLocation, content_type: application/json, body: '{"timetype":"pc","offset":{offset}}' }
    expect: *ok
    returns: ack

  # ── 2.3 PTP clock ────────────────────────────────────────────────────
  get_ptp:
    summary: Return the PTP clock instances and the ports' PTP bindings (2.3.1)
    send: { method: GET, path: /v1/ptp/query }
    expect: *data
    returns: value
  enable_ptp_clock:
    summary: Start or stop a PTP clock instance (2.3.2)
    params:
      clock: &clock { type: int, min: 1, max: 3, required: true, label: Clock, description: "The PTP clock instance, 1 to 3." }
      enabled: { type: bool, default: true, label: Enabled, description: "On to start the clock instance; off to stop it." }
    send: { method: POST, path: /v1/ptp/save, content_type: application/json, body: '{"ptps":[{"id":{clock},"enable":{enabled}}]}' }
    expect: *ok
    returns: ack
  enable_ptp_clocks:
    summary: "Start or stop several PTP clock instances; ptps is the API's ptps list of {id, enable} (2.3.2)"
    params:
      ptps: { type: json, required: true, label: Clocks, description: "A list of objects each with id (a clock instance, 1 to 3) and enable (true or false)." }
    send: { method: POST, path: /v1/ptp/save, content_type: application/json, body: '{"ptps":{ptps}}' }
    expect: *ok
    returns: ack
  get_ptp_clock:
    summary: Return one PTP clock instance's configuration and bound ports (2.3.3)
    params:
      clock: *clock
    send: { method: GET, path: /v1/ptp/detail/query, query: { id: "{clock}" } }
    expect: *data
    returns: value
  modify_ptp_clock:
    summary: "Configure a PTP clock instance and its port bindings; ports is the API's ports list of {id, mode, master} (2.3.4)"
    params:
      clock: *clock
      type: { type: enum, values: [BC, TC, stop], required: true, label: Clock type, description: "BC for a boundary clock, TC for a transparent clock, stop to stop it." }
      domain: { type: int, min: 0, required: true, label: Domain, description: "The PTP domain number; the device takes the clock number less 1 when it is left out." }
      two_step: { type: bool, required: true, label: Two-step, description: "On for two-step mode." }
      priority1: { type: int, min: 0, max: 255, required: true, label: Priority 1, description: "The clock's priority 1, 0 to 255." }
      priority2: { type: int, min: 0, max: 255, required: true, label: Priority 2, description: "The clock's priority 2, 0 to 255." }
      leap_second: { type: bool, required: true, label: Leap second, description: "The leap second switch (leap_s)." }
      ports: { type: json, required: true, label: Ports, description: "The ports bound to the clock: objects each with id (a port), mode (e2e or p2p) and master (true for a primary port, forced off in TC mode)." }
    send:
      method: POST
      path: /v1/ptp/modify
      content_type: application/json
      body: '{"id":{clock},"type":{type:json},"domain":{domain},"two_step":{two_step},"priority1":{priority1},"priority2":{priority2},"leap_s":{leap_second},"ports":{ports}}'
    expect: *ok
    returns: ack

  # ── 3.1 Presets ──────────────────────────────────────────────────────
  get_presets:
    summary: Return the saved configuration presets (3.1.1)
    send: { method: GET, path: /v1/preset/getlist }
    expect: *data
    returns: value
  save_preset:
    summary: Save the running configuration as a new preset (3.1.2)
    params:
      name: &preset_name { type: string, required: true, pattern: '^[^-]+$', label: Preset name, description: "The preset's name, which may not contain a hyphen (-)." }
    send: { method: POST, path: /v1/preset/save, content_type: application/json, body: '{"prname":{name:json}}' }
    expect: *ok
    returns: ack
  load_preset:
    summary: Apply a saved preset to the device, replacing its running configuration (3.1.3)
    params:
      name: { type: string, required: true, label: Preset name, description: "The preset to apply, as presets.<name> in state lists it." }
    send: { method: POST, path: /v1/preset/read, content_type: application/json, body: '{"prname":{name:json}}' }
    expect: *ok
    returns: ack
  delete_preset:
    summary: Delete a preset (3.1.4)
    params:
      name: { type: string, required: true, label: Preset name, description: "The preset to delete, as presets.<name> in state lists it." }
    send: { method: POST, path: /v1/preset/delete, content_type: application/json, body: '{"namelist":[{name:json}]}' }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.delete_info" }
    returns: value
  delete_presets:
    summary: "Delete several presets and return which were deleted, not found or failed; names is the API's namelist (3.1.4)"
    params:
      names: { type: json, required: true, label: Preset names, description: "A list of preset names, as presets.<name> in state lists them." }
    send: { method: POST, path: /v1/preset/delete, content_type: application/json, body: '{"namelist":{names}}' }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.delete_info" }
    returns: value
  rename_preset:
    summary: Rename a preset (3.1.5)
    params:
      name: { type: string, required: true, label: Preset name, description: "The preset's current name." }
      new_name: { type: string, required: true, label: New name, description: "The preset's new name." }
    send: { method: POST, path: /v1/preset/modify, content_type: application/json, body: '{"old_name":{name:json},"new_name":{new_name:json}}' }
    expect: *ok
    returns: ack

  # ── 3.2 Virtual NIC interfaces, 3.3 Mode ─────────────────────────────
  get_virtual_nic:
    summary: Return a VLAN's virtual interface and the recommended addressing (3.2.1)
    params:
      vlan: &vlan_id { type: int, min: 1, max: 4096, required: true, label: VLAN, description: "The VLAN ID, 1 to 4096." }
    send: { method: GET, path: /v1/preset/vlan/interface/get, query: { vlan_id: "{vlan}" } }
    expect: *data
    returns: value
  get_virtual_nics:
    summary: Return every virtual NIC's address with its VLAN's alias and color (3.2.2)
    send: { method: GET, path: /v1/preset/vlan/interface/list/get }
    expect: *data
    returns: value
  set_virtual_nic:
    summary: Configure a VLAN's virtual interface (3.2.3)
    params:
      vlan: *vlan_id
      enabled: { type: bool, required: true, label: Enabled, description: "On to enable the virtual interface." }
      ip: { type: string, required: true, label: IP address, description: "The interface's IPv4 address." }
      netmask: { type: string, required: true, label: Subnet mask, description: "The interface's subnet mask, such as 255.255.255.0." }
      type: { type: string, required: true, pattern: '^[a-z]+$', label: Address type, description: "How the interface is addressed: static in the document's example (the VLAN list reports dhcp or manual)." }
      default_route: { type: bool, required: true, label: Default route, description: "On to make the interface the default route." }
    send:
      method: POST
      path: /v1/preset/vlan/interface/set
      content_type: application/json
      body: '{"vlan_id":{vlan},"interface":{"enable":{enabled},"ip":{ip:json},"netmask":{netmask:json},"type":{type:json},"is_default_route":{default_route}}}'
    expect: *ok
    returns: ack
  get_interface_ips:
    summary: Return every VLAN interface's IP address, VLAN 0 being the management port eth0 (3.2.4)
    send: { method: GET, path: /v1/switch/interface/ip/get }
    expect: *data
    returns: value
  get_switch_mode:
    summary: Return whether the switch is in Layer 2 or Layer 3 mode (3.3.1)
    send: { method: GET, path: /v1/preset/mode/get }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.data.mode" }
    returns: value
  set_switch_mode:
    summary: Switch between Layer 2 and Layer 3 mode (3.3.2)
    params:
      mode: { type: enum, values: [layer2, layer3], required: true, label: Mode, description: "layer2 for Layer 2 switching, layer3 for Layer 3." }
    send: { method: POST, path: /v1/preset/mode/set, content_type: application/json, body: '{"mode":{mode:json}}' }
    expect: *ok
    returns: ack

  # ── 4.1 Input source discovery ───────────────────────────────────────
  add_discovery_server:
    summary: Add an NDI Discovery Server to find sources through (4.1.1)
    params:
      group: &group { type: string, default: public, label: Discovery group, description: "The NDI group the sources are found in; public by default." }
      server_ip: &server_ip { type: string, required: true, label: Server address, description: "The NDI Discovery Server's IP address." }
    send: { method: POST, path: /v1/input/server/add, content_type: application/json, body: '{"dis_g_name":{group:json},"dis_s_ip":{server_ip:json}}' }
    expect: *ok
    returns: ack
  add_manual_discovery:
    summary: Add a manual discovery of the NDI sources of one device (4.1.2)
    params:
      group: *group
      device_ip: &device_ip { type: string, required: true, label: Device address, description: "The IP address of the device whose sources are found." }
    send: { method: POST, path: /v1/input/manual/add, content_type: application/json, body: '{"manuals":[{"dis_g_name":{group:json},"dis_d_ip":{device_ip:json}}]}' }
    expect: *ok
    returns: ack
  add_manual_discoveries:
    summary: "Add several manual discoveries; manuals is the API's manuals list of {dis_g_name, dis_d_ip} (4.1.2)"
    params:
      manuals: { type: json, required: true, label: Manual discoveries, description: "A list of objects each with dis_g_name (the NDI group) and dis_d_ip (the device's IP address)." }
    send: { method: POST, path: /v1/input/manual/add, content_type: application/json, body: '{"manuals":{manuals}}' }
    expect: *ok
    returns: ack
  add_auto_discovery:
    summary: Add automatic discovery of the NDI sources in a group (4.1.3)
    params:
      group: { type: string, required: true, label: Discovery group, description: "The NDI group whose sources are found automatically." }
    send: { method: POST, path: /v1/input/auto/add, content_type: application/json, body: '{"dis_g_name":{group:json}}' }
    expect: *ok
    returns: ack
  discover_server:
    summary: Return the NDI sources an NDI Discovery Server lists in a group (4.1.4)
    params:
      group: *group
      server_ip: *server_ip
    send: { method: GET, path: /v1/input/server/discovery, query: { dis_g_name: "{group}", dis_s_ip: "{server_ip}" } }
    expect: *data
    returns: value
  discover_manual:
    summary: Return the NDI sources the manual discoveries find (4.1.5)
    send: { method: GET, path: /v1/input/manual/discovery }
    expect: *data
    returns: value
  discover_auto:
    summary: Return the NDI sources found automatically in a group (4.1.6)
    params:
      group: *group
    send: { method: GET, path: /v1/input/auto/discovery, query: { dis_g_name: "{group}" } }
    expect: *data
    returns: value
  delete_discovery:
    summary: Delete a discovery method (4.1.7)
    params:
      discovery: { type: int, min: 0, required: true, label: Discovery ID, description: "The discovery method's id, as discovery.<id> in state lists it." }
    send: { method: POST, path: /v1/input/discovery/delete, content_type: application/json, body: '{"ids":[{discovery}]}' }
    expect: *ok
    returns: ack
  delete_discoveries:
    summary: "Delete several discovery methods; ids is the API's list of discovery ids (4.1.7)"
    params:
      ids: { type: json, required: true, label: Discovery IDs, description: "A list of discovery method ids, as discovery.<id> in state lists them." }
    send: { method: POST, path: /v1/input/discovery/delete, content_type: application/json, body: '{"ids":{ids}}' }
    expect: *ok
    returns: ack
  get_discovery_methods:
    summary: Return every discovery method, as manuals and auto_servers lists (4.1.8)
    send: { method: GET, path: /v1/input/discovery/all }
    expect: *data
    returns: value

  # ── 4.2 Inputs, 4.3 Outputs ──────────────────────────────────────────
  modify_input:
    summary: Change an input source's alias (4.2.1)
    params:
      input: &input_id { type: int, min: 0, required: true, label: Input, description: "The input source's id, as inputs.<id> in state lists it." }
      alias: { type: string, required: true, label: Alias, description: "The input source's display name." }
    send: { method: POST, path: /v1/input/modify, content_type: application/json, body: '{"id":{input},"alias":{alias:json}}' }
    expect: *ok
    returns: ack
  add_output:
    summary: Add one NDI output (4.3.1)
    params:
      name: { type: string, required: true, label: Name, description: "The output's name." }
      alias: { type: string, required: true, label: Alias, description: "The output's display name." }
      channel_name: { type: string, required: true, label: Channel name, description: "The output's NDI channel name." }
      group: &out_group { type: string, default: public, label: NDI group, description: "The NDI group the output is sent in; public by default." }
      routed: &routed { type: bool, default: false, label: Routing mode, description: "Whether the output is in routing mode (router)." }
      discovery_server_ip: &out_server { type: string, default: "", label: Discovery Server, description: "The NDI Discovery Server the output registers with; empty for none." }
      vlan: &out_vlan { type: int, min: 1, max: 4096, required: true, label: VLAN, description: "The VLAN ID the output is sent on." }
    send:
      method: POST
      path: /v1/output/add
      content_type: application/json
      body: '{"outputs":[{"name":{name:json},"alias":{alias:json},"c_name":{channel_name:json},"g_name":{group:json},"router":{routed},"dis_s_ip":{discovery_server_ip:json},"vlan_id":{vlan}}]}'
    expect: *ok
    returns: ack
  add_outputs:
    summary: "Add several NDI outputs; outputs is the API's outputs list of {name, alias, c_name, g_name, router, dis_s_ip, vlan_id} (4.3.1)"
    params:
      outputs: { type: json, required: true, label: Outputs, description: "A list of objects as 4.3.1 documents: name, alias, c_name (channel), g_name (group), router, dis_s_ip and vlan_id." }
    send: { method: POST, path: /v1/output/add, content_type: application/json, body: '{"outputs":{outputs}}' }
    expect: *ok
    returns: ack
  delete_output:
    summary: Delete an NDI output (4.3.2)
    params:
      output: &output_id { type: int, min: 0, required: true, label: Output, description: "The output's id, as outputs.<id> in state lists it." }
    send: { method: POST, path: /v1/output/delete, content_type: application/json, body: '{"ids":[{output}]}' }
    expect: *ok
    returns: ack
  delete_outputs:
    summary: "Delete several NDI outputs; ids is the API's list of output ids (4.3.2)"
    params:
      ids: { type: json, required: true, label: Output IDs, description: "A list of output ids, as outputs.<id> in state lists them." }
    send: { method: POST, path: /v1/output/delete, content_type: application/json, body: '{"ids":{ids}}' }
    expect: *ok
    returns: ack
  modify_output:
    summary: Change an NDI output's name, group, Discovery Server, routing mode and VLAN (4.3.3)
    params:
      output: *output_id
      name: { type: string, required: true, label: Name, description: "The output's name." }
      group: { type: string, required: true, label: NDI group, description: "The NDI group the output is sent in." }
      discovery_server_ip: { type: string, required: true, label: Discovery Server, description: "The NDI Discovery Server the output registers with; empty for none." }
      routed: { type: bool, required: true, label: Routing mode, description: "Whether the output is in routing mode (router)." }
      vlan: *out_vlan
    send:
      method: POST
      path: /v1/output/modify
      content_type: application/json
      body: '{"id":{output},"name":{name:json},"g_name":{group:json},"dis_s_ip":{discovery_server_ip:json},"router":{routed},"vlan_id":{vlan}}'
    expect: *ok
    returns: ack
  get_output:
    summary: Return one NDI output (4.3.4)
    params:
      output: *output_id
    send: { method: GET, path: /v1/output/query, query: { id: "{output}" } }
    expect: *data
    returns: value
  get_outputs:
    summary: Return every NDI output (4.3.5)
    send: { method: GET, path: /v1/output/query/all }
    expect: *data
    returns: value
  get_default_output:
    summary: Return the default output's name (4.3.6)
    send: { method: GET, path: /v1/output/query/default }
    expect: { status: 200, code_path: "$.code", code_range: [200, 200], json_path: "$.data.name" }
    returns: value

  # ── 4.4 Panels ───────────────────────────────────────────────────────
  add_panel:
    summary: Add a panel (4.4.1)
    params:
      name: { type: string, required: true, label: Name, description: "The panel's name." }
    send: { method: POST, path: /v1/panel/add, content_type: application/json, body: '{"name":{name:json}}' }
    expect: *ok
    returns: ack
  delete_panel:
    summary: Delete a panel (4.4.2)
    params:
      panel: &panel { type: int, min: 0, required: true, label: Panel, description: "The panel's id, as panels.<id> in state lists it." }
    send: { method: POST, path: /v1/panel/delete, content_type: application/json, body: '{"ids":[{panel}]}' }
    expect: *ok
    returns: ack
  delete_panels:
    summary: "Delete several panels; ids is the API's list of panel ids (4.4.2)"
    params:
      ids: { type: json, required: true, label: Panel IDs, description: "A list of panel ids, as panels.<id> in state lists them." }
    send: { method: POST, path: /v1/panel/delete, content_type: application/json, body: '{"ids":{ids}}' }
    expect: *ok
    returns: ack
  rename_panel:
    summary: Rename a panel (4.4.3)
    params:
      panel: *panel
