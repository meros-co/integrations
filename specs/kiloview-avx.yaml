        "vlans.{id}.interface.netmask": "{if_mask}"
        "vlans.{id}.interface.type": "{if_type}"
        "vlans.{id}.interface.referenced": "{if_ref}"
        "vlans.{id}.interface.default_route": "{if_route}"
        "vlans.{id}.dhcp_enabled": "{dhcp}"
        "vlans.{id}.dhcp_conflict": "{conflict}"
