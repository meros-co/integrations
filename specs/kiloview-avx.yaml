  route:
    summary: Route an input source to an output of a panel (4.7.2)
    params:
      panel: *panel
      output: { type: int, min: 0, required: true, label: Output, description: "The output's id, as panel_outputs.<panel>.<id> in state lists it." }
      input: *input_id
    send: { method: POST, path: /v1/panel/cross/output/input, content_type: application/json, body: '{"id":{panel},"output_id":{output},"input_id":{input}}' }
    expect: *ok
    returns: ack
  select_input_all:
    summary: Route an input source to every output of a panel, or take it off them (4.7.3)
    params:
      panel: *panel
      input: *input_id
      select: { type: bool, default: true, label: Select, description: "On to select the input on every output; off to deselect it." }
    send: { method: POST, path: /v1/panel/cross/input/select, content_type: application/json, body: '{"id":{panel},"input_id":{input},"select":{select}}' }
    expect: *ok
    returns: ack

