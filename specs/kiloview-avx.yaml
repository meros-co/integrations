spec: 1
id: kiloview-avx
name: Kiloview AVX24-4 Media HUB
vendor: Kiloview
category: router

source:
  - title: Kiloview AVX24-4 Media HUB WEB API Documentation, v1.0
    author: Changsha Kiloview Electronic Technology Co., Ltd.
    url: https://enstatic.kiloview.com/wp-content/uploads/2026/10/AVX24-4-Media-HUB-WEB-API-Interface-Document-V1.0_0512_EN.pdf
    note: >
      Manufacturer document, linked from https://www.kiloview.com/en/docs/avx-media-hub/api/
      (checked 2026-10-27). The source of every request, field and reply
      here: the {code, message, data} reply envelope; 1 User
      Authentication (login, users); 2 System Management (host name,
      factory reset, logs, reboot, firmware upload and upgrade, time and
      time zone, PTP clocks); 3 Access Policy / Preset Configuration
      (presets, virtual NIC interfaces, Layer 2/Layer 3 mode); 4 Panel
      Management (input discovery, inputs, outputs, panels, panel inputs and
      outputs, cross switching, panel configuration, physical panel
      enable); 5 KLS Panel Management; 6 KLS Binding Management; 7 Icon
      Management; 8 Front Panel Operation; 9 VLAN Configuration; 10
      Topology Management; 11 Network Diagnostic; 12 Switch Management
      (system information, ports, aggregation, VLANs, DHCP, power, static
      routes, network save); 13 Alarm Events; 14 Production Test; 15 AVX
      Page Interface; 16 AVX Reverse Proxy Device Page Interface. Some of
      its examples carry Chinese text (messages, aliases), read as data;
      field tables whose columns are misaligned in the PDF are read
      together with the examples.

transport:
  type: http
  port: 80
  scheme: http
  timeout_ms: 5000
  # No probe: the document names no request that needs no token.
  # 1.1.1: the login issues a token "for interface authentication"; the
  # document does not say how a request carries it. The session logs in with
  # the username and password settings and sends it as "Authorization:
  # Bearer <token>", as Kiloview's other HTTP APIs take theirs, logging in
  # again when a request is answered 401 (see the quirks).
  session:
    when_set: password
    login: { method: POST, path: /v1/user/login, content_type: application/json,
             body: '{"username":{settings.username:json},"password":{settings.password:json}}' }
    capture: { json: $.data.token, header: Authorization, scheme: Bearer }
    relogin: { status: [401] }

settings:
  username:
    type: string
    default: admin
    max_length: 64
    label: User name
    description: "The user the core logs in as; admin in the document's example."
  password:
    type: string
    secret: true
    default: ""
    max_length: 128
    label: Password
    description: "That user's password; while it is empty nothing logs in, and requests go without a token."

ports:
  - { port: 80, protocol: http, role: control, note: "the web server's HTTP port; the document gives no port, so the web console's default HTTP port is assumed" }

