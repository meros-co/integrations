        "dhcp_servers.{1}.lease_hours": "{hours}"
        "dhcp_servers.{1}.lease_minutes": "{minutes}"
    # The unfiltered client list replaces the clients; a filtered one adds.
    - path: "^/v1/switch/dhcps/clients/dump$"
      request_match: { "$.vlan_id": "^\\[\\]$" }
      json_match: *ok200
      json_each: "$.data"
      json: {}
      replace: dhcp_clients
    - path: "^/v1/switch/dhcps/clients/dump$"
      json_match: *ok200
      json_each: "$.data"
      json: &client_fields { vlan: "$.vlan_id", ip: "$.ip", netmask: "$.netmask", type: "$.type", host: "$.host_name", mac: "$.mac", days: "$.expired_time.days", hours: "$.expired_time.hours", minutes: "$.expired_time.minutes", brand: "$.brand", model: "$.mode", sn: "$.sn", port: "$.connect_port", bind: "$.bind_type", color: "$.color" }
      state:
        "dhcp_clients.{mac:key}.vlan": "{vlan}"
        "dhcp_clients.{mac:key}.ip": "{ip}"
        "dhcp_clients.{mac:key}.netmask": "{netmask}"
        "dhcp_clients.{mac:key}.type": "{type}"
        "dhcp_clients.{mac:key}.host_name": "{host}"
        "dhcp_clients.{mac:key}.lease_days": "{days}"
        "dhcp_clients.{mac:key}.lease_hours": "{hours}"
        "dhcp_clients.{mac:key}.lease_minutes": "{minutes}"
        "dhcp_clients.{mac:key}.brand": "{brand}"
        "dhcp_clients.{mac:key}.model": "{model}"
        "dhcp_clients.{mac:key}.serial": "{sn}"
        "dhcp_clients.{mac:key}.port": "{port}"
        "dhcp_clients.{mac:key}.binding": { value: "{bind}", map: &binding { "0": none, "1": ip, "2": mac, "3": ip_mac } }
        "dhcp_clients.{mac:key}.color": "{color}"
    - path: "^/v1/switch/dhcps/static/get$"
      request_match: { "$": "^\\{\\}$" }
      json_match: *ok200
      json_each: "$.data"
      json: {}
      replace: dhcp_static
    - path: "^/v1/switch/dhcps/static/get$"
      json_match: *ok200
      json_each: "$.data"
      json: *client_fields
      state:
        "dhcp_static.{mac:key}.vlan": "{vlan}"
        "dhcp_static.{mac:key}.ip": "{ip}"
        "dhcp_static.{mac:key}.netmask": "{netmask}"
        "dhcp_static.{mac:key}.type": "{type}"
        "dhcp_static.{mac:key}.host_name": "{host}"
        "dhcp_static.{mac:key}.lease_days": "{days}"
        "dhcp_static.{mac:key}.lease_hours": "{hours}"
        "dhcp_static.{mac:key}.lease_minutes": "{minutes}"
        "dhcp_static.{mac:key}.brand": "{brand}"
        "dhcp_static.{mac:key}.model": "{model}"
        "dhcp_static.{mac:key}.serial": "{sn}"
        "dhcp_static.{mac:key}.port": "{port}"
        "dhcp_static.{mac:key}.binding": { value: "{bind}", map: *binding }
        "dhcp_static.{mac:key}.color": "{color}"

    # ── 12.6 power, 12.7 routes, 12.8 network ─────────────────────────
    - path: "^/v1/switch/power/status/query$"
      json_match: *ok200
      json_each: "$.data"
      json: { slot: "$.slot", name: "$.name", status: "$.status", power: "$.power" }
      replace: power
      state: { "power.{slot:key}.name": "{name}", "power.{slot:key}.status": "{status}", "power.{slot:key}.power": "{power}" }
    - path: "^/v1/switch/iproutes/get$"
      json_match: *ok200
      json_each: "$.routes"
      json: { dest: "$.dest_ip", mask: "$.dest_mask", hop: "$.next_hop", priority: "$.priority" }
      replace: routes
      state:
        "routes.{index}.dest_ip": "{dest}"
        "routes.{index}.dest_mask": "{mask}"
        "routes.{index}.next_hop": "{hop}"
        "routes.{index}.priority": "{priority}"
    - path: "^/v1/network/query$"
      json_match: *ok200
      json: { status: "$.data.status" }
      state: { network_config.status: "{status}" }

    # ── 13 alarms ─────────────────────────────────────────────────────
    - path: "^/v1/alarm/events/levels/get\\?"
      json_match: *ok200
      json: { count: "$.events_num", errors: "$.error_total", warnings: "$.warning_total", info: "$.info_total" }
      state: { alarms.count: "{count}", alarms.unread_errors: "{errors}", alarms.unread_warnings: "{warnings}", alarms.unread_info: "{info}" }
    # Every level: the list replaces the events; one level adds.
    - path: "^/v1/alarm/events/levels/get\\?alarm_levels=1&alarm_levels=2&alarm_levels=3$"
      json_match: *ok200
      json_each: "$.data"
      json: {}
      replace: alarms.events
    - path: "^/v1/alarm/(?:events/levels/get\\?|dev/events/get)"
      json_match: *ok200
      json_each: "$.data"
      json: &alarm_fields { id: "$.id", status: "$.status", level: "$.alarm_level", time: "$.time", message: "$.message", port: "$.source_port" }
      state: &alarm_state
        "alarms.events.{id}.status": { value: "{status}", map: { "1": unread, "2": read } }
        "alarms.events.{id}.level": { value: "{level}", map: { "1": error, "2": warning, "3": info } }
        "alarms.events.{id}.time": "{time}"
        "alarms.events.{id}.message": "{message}"
        "alarms.events.{id}.port": "{port}"
    - path: "^/v1/alarm/events/get$"
      json_match: *ok200
      json_each: "$.data"
      json: *alarm_fields
      state: *alarm_state
    - path: "^/v1/alarm/config/get$"
      json_match: *ok200
      json: { cpu: "$.data.cpu_enabled", mem: "$.data.mem_enabled", temp: "$.data.temp_enabled", interval: "$.data.alarm_interval", disc: "$.data.disconnect_alarm_enabled", dur: "$.data.disconnect_duration" }
      state:
        alarms.config.cpu: "{cpu}"
        alarms.config.memory: "{mem}"
        alarms.config.temperature: "{temp}"
        alarms.config.interval: "{interval}"
        alarms.config.disconnect: "{disc}"
        alarms.config.disconnect_duration: "{dur}"
    - path: "^/v1/alarm/ports/events/get$"
      json_match: *ok200
      json_each: "$.data.*"
      json: { alarm: "$.has_alarm", error: "$.has_error" }
      replace: port_alarms
      state: { "port_alarms.{key:key}.has_alarm": "{alarm}", "port_alarms.{key:key}.has_error": "{error}" }
    - path: "^/v1/alarm/debug/port$"
      request_match: { "$.port_id": "^(\\d+)$" }
      json_match: *ok200
      json: { alarm: "$.data.has_alarm", error: "$.data.has_error" }
      state: { "port_alarms.{1}.has_alarm": "{alarm}", "port_alarms.{1}.has_error": "{error}" }

    # ── 14 production test ────────────────────────────────────────────
    - path: "^/v1/test/get_resources$"
      json_match: *ok200
      json_each: "$.data.*"
      each_match: { "$.cpu_usage": "^" }
      json: { cpu: "$.cpu_usage", mem: "$.mem_usage", temp: "$.temperature", sw: "$.software_version", hw: "$.hardware_version" }
      state:
        "boards.{key:key}.cpu": "{cpu}"
        "boards.{key:key}.memory": "{mem}"
        "boards.{key:key}.temperature": "{temp}"
        "boards.{key:key}.software_version": "{sw}"
        "boards.{key:key}.hardware_version": "{hw}"
    - path: "^/v1/test/get_resources$"
      json_match: *ok200
      json: { sn: "$.data.serial_number", fw: "$.data.firmware_version", hw: "$.data.hardware_version" }
      state: { device.serial: "{sn}", device.firmware_version: "{fw}", device.hardware_version: "{hw}" }
    - path: "^/v1/test/fan_list$"
      json_match: *ok200
      json: { fans: "$.data" }
      state: { test.fans: "{fans}" }
    - path: "^/v1/test/usb_port_status$"
      json_match: *ok200
      json: { usb: "$.data" }
      state: { test.usb: "{usb}" }
    - path: "^/v1/test/start_fan_test$"
      json_match: *ok200
      json_each: "$.data.fans"
      json: { name: "$.name", status: "$.status", rpm: "$.rpm" }
      replace: test.fan_test
      state: { "test.fan_test.{name:key}.status": "{status}", "test.fan_test.{name:key}.rpm": "{rpm}" }
    - path: "^/v1/test/port_status$"
      json_match: *ok200
      json_each: "$.data"
      json: { port: "$.port", speed: "$.speed_duplex", link: "$.link", poe: "$.poe_power", result: "$.test_result" }
      replace: test.ports
      state:
        "test.ports.{port}.speed_duplex": "{speed}"
        "test.ports.{port}.link": "{link}"
        "test.ports.{port}.poe_power": "{poe}"
        "test.ports.{port}.result": "{result}"

    # ── 15 page interface ─────────────────────────────────────────────
    - path: "^/api/systemctrl/report/get_system_info$"
      json_match: *ok200
      json:
        host: "$.data.hostname"
        hw: "$.data.version.hardwareVersion"
        sw: "$.data.version.softwareVersion"
        fw: "$.data.version.firmwareVersion"
        sn: "$.data.version.serialnumber"
        ndi: "$.data.version.ndiVersion"
        product: "$.data.version.product"
        oem: "$.data.version.oem"
        mac: "$.data.mac"
        mode: "$.data.mode"
        cpu: "$.data.cpu.percent"
        temp: "$.data.temperature"
        mem: "$.data.mem.percent"
        mem_total: "$.data.mem.total"
        mem_used: "$.data.mem.used"
        disk: "$.data.disk.percent"
        disk_total: "$.data.disk.total"
        disk_used: "$.data.disk.used"
      state:
        system.hostname: "{host}"
        system.hardware_version: "{hw}"
        system.software_version: "{sw}"
        system.firmware_version: "{fw}"
        system.serial: "{sn}"
        system.ndi_version: "{ndi}"
        system.product: "{product}"
        system.oem: "{oem}"
        system.mac: "{mac}"
        system.mode: "{mode}"
        system.cpu: "{cpu}"
        system.temperature: "{temp}"
        system.memory: "{mem}"
        system.memory_total: "{mem_total}"
        system.memory_used: "{mem_used}"
        system.disk: "{disk}"
        system.disk_total: "{disk_total}"
        system.disk_used: "{disk_used}"
    - path: "^/api/networkmanager/report/get_network$"
      json_match: *ok200
      json_each: "$.data"
      json: { name: "$.name", type: "$.type", mac: "$.mac", ip: "$.address", mask: "$.netmask", gw: "$.gw", dns: "$.dns", method: "$.method", status: "$.status", mc: "$.multicast", rx: "$.receive", tx: "$.transmit" }
      replace: network.interfaces
      state:
        "network.interfaces.{name:key}.type": "{type}"
        "network.interfaces.{name:key}.mac": "{mac}"
        "network.interfaces.{name:key}.ip": "{ip}"
        "network.interfaces.{name:key}.netmask": "{mask}"
        "network.interfaces.{name:key}.gateway": "{gw}"
        "network.interfaces.{name:key}.dns": "{dns}"
        "network.interfaces.{name:key}.method": "{method}"
        "network.interfaces.{name:key}.status": "{status}"
        "network.interfaces.{name:key}.multicast": "{mc}"
        "network.interfaces.{name:key}.received": "{rx}"
        "network.interfaces.{name:key}.transmitted": "{tx}"

    # ── Read-backs: what a command changed is read again once the
    # device accepts it ────────────────────────────────────────────────
    - path: "^/v1/user/(?:add|delete|modify)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/user/userlist }]
    - path: "^/v1/sys/sethostname\\?"
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/switch/sys/info }
        - { method: GET, path: /api/systemctrl/report/get_system_info }
    - path: "^/v1/systime/setLocation$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/systime/get }]
    - path: "^/v1/ptp/(?:save|modify)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/ptp/query }]
    - path: "^/v1/preset/(?:save|delete|modify)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/preset/getlist }]
    # A preset applied changes everything: the presets, panels, outputs,
    # VLANs and ports are read again.
    - path: "^/v1/preset/read$"
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/preset/getlist }
        - { method: GET, path: /v1/panel/query/all }
        - { method: GET, path: /v1/output/query/all }
        - { method: GET, path: /v1/switch/vlan/dump }
        - { method: GET, path: /v1/switch/port/dump }
    - path: "^/v1/preset/vlan/interface/set$"
      request_match: { "$.vlan_id": "^(\\d+)$" }
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/preset/vlan/interface/get, query: { vlan_id: "{1}" } }
        - { method: GET, path: /v1/preset/vlan/interface/list/get }
        - { method: GET, path: /v1/switch/vlan/dump }
        - { method: GET, path: /v1/switch/interface/ip/get }
    - path: "^/v1/preset/mode/set$"
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/preset/mode/get }
        - { method: GET, path: /v1/switch/sys/info }
    - path: "^/v1/input/(?:server/add|manual/add|auto/add|discovery/delete)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/input/discovery/all }]
    - path: "^/v1/input/modify$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/panel/query/all }]
    - path: "^/v1/output/(?:add|delete|modify)$"
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/output/query/all }
        - { method: GET, path: /v1/panel/query/all }
    - path: "^/v1/panel/(?:add|delete|modify|expand)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/panel/query/all }]
    # A panel deleted by itself takes its details with it.
    - path: "^/v1/panel/delete$"
      request_match: { "$.ids": "^\\[(\\d+)\\]$" }
      json_match: *ok200
      json: {}
      state:
        "panel_info.{1}": { delete: true }
        "panel_inputs.{1}": { delete: true }
        "panel_outputs.{1}": { delete: true }
        "panel_config.{1}": { delete: true }
    - path: "^/v1/panel/(?:input|output)/(?:add|remove|sort)$"
      request_match: { "$.id": "^(\\d+)$" }
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/panel/query/all }
        - { method: GET, path: /v1/panel/detail, query: { id: "{1}" } }
    - path: "^/v1/panel/cross/(?:output/input|input/select)$"
      request_match: { "$.id": "^(\\d+)$" }
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/panel/detail, query: { id: "{1}" } }]
    - path: "^/v1/panel/cfg/input/apply$"
      request_match: { "$.id": "^(\\d+)$" }
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/panel/cfg/input/all, query: { id: "{1}" } }]
    - path: "^/v1/panel/cfg/output/apply$"
      request_match: { "$.id": "^(\\d+)$" }
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/panel/cfg/output/all, query: { id: "{1}" } }]
    - path: "^/v1/panel/cfg/enable/set$"
      request_match: { "$.id": "^(\\d+)$" }
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/panel/cfg/enable/query, query: { id: "{1}" } }
        - { method: GET, path: /v1/front/panel/query }
    - path: "^/v1/kls/output/(?:add|delete|modify)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/kls/output/query/all }]
    - path: "^/v1/kls/panel/(?:input/add|input/remove|output/add|output/remove|cross/output/input|cross/input/select)$"
      request_match: { "$.panel_uuid": "^(.+)$" }
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/kls/panel/detail, query: { panel_uuid: "{1}" } }]
    - path: "^/v1/kls/panel/delete$"
      request_match: { "$.uuid": "^([^.]+)$" }
      json_match: *ok200
      json: {}
      state: { "kls_panels.{1:key}": { delete: true } }
    - path: "^/v1/kls/panel/(?:switcher/enable|device/delete)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/kls/output/query/all }]
    - path: "^/v1/bindkls/(?:tobind$|unbind\\?)"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/bindkls/bindinfo }]
    - path: "^/v1/icon/(?:upload|modify|notify/update)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/icon/all }]
    - path: "^/v1/front/input/output/take$"
      request_match: { "$.panel_id": "^(\\d+)$" }
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/front/panel/detail, query: { panel_id: "{1}" } }
        - { method: GET, path: /v1/panel/query/all }
    - path: "^/v1/vlan/cfg/modify$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/vlan/cfg/all }]
    - path: "^/v1/switch/dev/alias/set$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/topology/query }]
    - path: "^/v1/diagnose/task/(?:rfppadd|p2pdev/add|del)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/diagnose/task/query/type }]
    - path: "^/v1/switch/port/(?:control|set|set/batch|alias/set)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/switch/port/dump }]
    - path: "^/v1/switch/port/display/(?:set|del)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/switch/port/display/query }]
    - path: "^/v1/switch/device/remove$"
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/switch/port/dump }
        - { method: GET, path: /v1/topology/query }
    - path: "^/v1/switch/aggr/(?:add|del|port/add|set)$"
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/switch/aggr/dump }
        - { method: GET, path: /v1/switch/port/dump }
    - path: "^/v1/switch/vlan/(?:add|set|del|port/set)$"
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/switch/vlan/dump }
        - { method: GET, path: /v1/switch/port/dump }
    - path: "^/v1/switch/dhcps/set$"
      request_match: { "$.vlan_if.vlan_id": "^(\\d+)$" }
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/switch/dhcps/get, query: { vlan_id: "{1}" } }
        - { method: GET, path: /v1/switch/vlan/dump }
    - path: "^/v1/switch/dhcps/enable/set$"
      request_match: { "$.vlan_id": "^(\\d+)$" }
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/switch/dhcps/get, query: { vlan_id: "{1}" } }
        - { method: GET, path: /v1/switch/vlan/dump }
    - path: "^/v1/switch/dhcps/static/set$"
      json_match: *ok200
      json: {}
      then_send: [{ method: POST, path: /v1/switch/dhcps/static/get, content_type: application/json, body: '{}' }]
    - path: "^/v1/switch/iproutes/(?:add|delete)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/switch/iproutes/get }]
    - path: "^/v1/network/save$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/network/query }]
    - path: "^/v1/alarm/events/(?:del|status/set)$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/alarm/events/levels/get, raw_query: "alarm_levels=1&alarm_levels=2&alarm_levels=3" }]
    - path: "^/v1/alarm/config/set$"
      json_match: *ok200
      json: {}
      then_send: [{ method: GET, path: /v1/alarm/config/get }]
    - path: "^/v1/test/set_serial_number$"
      json_match: *ok200
      json: {}
      then_send:
        - { method: GET, path: /v1/test/get_resources }
        - { method: GET, path: /v1/switch/sys/info }
