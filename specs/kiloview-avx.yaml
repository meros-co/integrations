    send: { method: POST, path: /v1/kls/input/server/add, content_type: application/json, body: '{"serial_number":{serial:json},"dis_g_name":{group:json},"dis_s_ip":{server_ip:json}}' }
    expect: *ok
    returns: ack
  kls_add_manual_discovery:
    summary: Add a manual input discovery of one device for a KLS (5.1.2)
