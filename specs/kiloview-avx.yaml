  traffic.top.*.rx_rate: { type: float, description: "Its receive rate as reported" }
  traffic.top.*.tx_rate: { type: float, description: "Its send rate as reported" }
  traffic.top.*.top_rate: { type: float, description: "Its peak rate, which orders the list" }
  traffic.top.*.top_usage: { type: float, description: "Its utilization as reported" }
  watched_ports.select.*: { type: bool, description: "The watched ports, keyed by port: true for each" }
  watched_ports.cascade.*: { type: bool, description: "The cascade ports, keyed by port: true for each" }
  # 12.3 aggregation
  aggregations.*.alias: { type: string, description: "A link aggregation group, keyed by id: its alias" }
  aggregations.*.type: { type: string, description: "static, lacp_active or lacp_passive" }
  aggregations.*.configured: { type: string, description: "The ports configured in it, as JSON text" }
  aggregations.*.aggregated: { type: string, description: "The ports actually aggregated, as JSON text" }
  # 12.4 VLANs
  vlans.*.alias: { type: string, description: "A VLAN, keyed by VLAN ID: its alias" }
  vlans.*.color: { type: string, description: "Its color" }
  vlans.*.configs: { type: string, description: "Its configuration file IDs, as JSON text" }
  vlans.*.config_names: { type: string, description: "Its configuration file names, as JSON text" }
  vlans.*.ports: { type: string, description: "Its ports, as JSON text" }
  vlans.*.interface.enabled: { type: bool, description: "Whether its interface is enabled" }
  vlans.*.interface.ip: { type: string, description: "Its interface's IPv4 address, empty when none" }
  vlans.*.interface.netmask: { type: string, description: "Its interface's subnet mask" }
  vlans.*.interface.type: { type: string, description: "Its interface's addressing, such as dhcp or manual" }
  vlans.*.interface.referenced: { type: bool, description: "Whether its interface is referenced" }
  vlans.*.interface.default_route: { type: bool, description: "Whether its interface is the default route" }
  vlans.*.dhcp_enabled: { type: bool, description: "Whether its DHCP server is on" }
  vlans.*.dhcp_conflict: { type: bool, description: "Whether a DHCP conflict is flagged" }
  vlans.*.vlan_if.enabled: { type: bool, description: "Whether its VLANIF is enabled" }
  vlans.*.vlan_if.ip: { type: string, description: "Its VLANIF address" }
  vlans.*.vlan_if.netmask: { type: string, description: "Its VLANIF mask" }
  # 12.5 DHCP
  dhcp_servers.*.interface_enabled: { type: bool, description: "A VLAN's DHCP configuration, keyed by VLAN ID: whether its interface is enabled" }
  dhcp_servers.*.interface_ip: { type: string, description: "Its interface's IP address" }
  dhcp_servers.*.interface_netmask: { type: string, description: "Its interface's subnet mask" }
  dhcp_servers.*.enabled: { type: bool, description: "Whether the DHCP server is on" }
  dhcp_servers.*.pool_start: { type: string, description: "The first address given out" }
  dhcp_servers.*.pool_end: { type: string, description: "The last address given out" }
  dhcp_servers.*.gateway_type: { type: string, description: "default or manual" }
  dhcp_servers.*.gateway_ip: { type: string, description: "The gateway address given out" }
  dhcp_servers.*.dns: { type: string, description: "The DNS server given out" }
  dhcp_servers.*.lease_days: { type: int, description: "The lease time's days" }
  dhcp_servers.*.lease_hours: { type: int, description: "The lease time's hours" }
  dhcp_servers.*.lease_minutes: { type: int, description: "The lease time's minutes" }
  dhcp_clients.*.vlan: { type: int, description: "A DHCP client, keyed by MAC address: its VLAN ID" }
  dhcp_clients.*.ip: { type: string, description: "Its IP address" }
  dhcp_clients.*.netmask: { type: string, description: "Its subnet mask" }
  dhcp_clients.*.type: { type: string, description: "Automatic or Manual" }
  dhcp_clients.*.host_name: { type: string, description: "Its host name" }
  dhcp_clients.*.lease_days: { type: int, description: "Lease time left: days" }
  dhcp_clients.*.lease_hours: { type: int, description: "Lease time left: hours" }
  dhcp_clients.*.lease_minutes: { type: int, description: "Lease time left: minutes" }
  dhcp_clients.*.brand: { type: string, description: "Its vendor" }
  dhcp_clients.*.model: { type: string, description: "Its model" }
  dhcp_clients.*.serial: { type: string, description: "Its serial number" }
  dhcp_clients.*.port: { type: int, description: "The switch port it is on" }
  dhcp_clients.*.binding: { type: string, description: "none, ip, mac or ip_mac" }
  dhcp_clients.*.color: { type: string, description: "Its VLAN's color" }
  dhcp_static.*.vlan: { type: int, description: "A static IP binding, keyed by MAC address: its VLAN ID" }
  dhcp_static.*.ip: { type: string, description: "The bound IP address" }
  dhcp_static.*.netmask: { type: string, description: "Its subnet mask" }
  dhcp_static.*.type: { type: string, description: "Manual" }
  dhcp_static.*.host_name: { type: string, description: "The client's host name" }
  dhcp_static.*.lease_days: { type: int, description: "Lease time left: days" }
  dhcp_static.*.lease_hours: { type: int, description: "Lease time left: hours" }
  dhcp_static.*.lease_minutes: { type: int, description: "Lease time left: minutes" }
  dhcp_static.*.brand: { type: string, description: "The client's vendor" }
  dhcp_static.*.model: { type: string, description: "The client's model" }
  dhcp_static.*.serial: { type: string, description: "The client's serial number" }
  dhcp_static.*.port: { type: int, description: "The switch port it is on" }
  dhcp_static.*.binding: { type: string, description: "none, ip, mac or ip_mac" }
  dhcp_static.*.color: { type: string, description: "Its VLAN's color" }
  # 12.6-12.8
  power.*.name: { type: string, description: "A power slot or total, keyed by slot (slot1, slot2, PoE): its name" }
  power.*.status: { type: string, description: "Its status, such as Slot Empty or Power On" }
  power.*.power: { type: string, description: "Its power as the device shows it, such as 23.77W, empty when none" }
  routes.*.dest_ip: { type: string, description: "A static route, keyed by place from 0: its destination network" }
  routes.*.dest_mask: { type: int, description: "Its prefix length" }
  routes.*.next_hop: { type: string, description: "Its next hop" }
  routes.*.priority: { type: int, description: "Its priority, lower preferred" }
  network_config.status: { type: bool, description: "The network configuration's status flag (12.8.2)" }
  # 13 alarms
  alarms.count: { type: int, description: "Number of alarm events" }
  alarms.unread_errors: { type: int, description: "Number of unread error alarms" }
  alarms.unread_warnings: { type: int, description: "Number of unread warning alarms" }
  alarms.unread_info: { type: int, description: "Number of unread info alarms" }
  alarms.events.*.status: { type: string, description: "An alarm event, keyed by id: unread or read" }
  alarms.events.*.level: { type: string, description: "error, warning or info" }
  alarms.events.*.time: { type: string, description: "When it first happened" }
  alarms.events.*.message: { type: string, description: "The alarm's message" }
  alarms.events.*.port: { type: int, description: "The port it came from" }
  alarms.config.cpu: { type: bool, description: "Whether CPU alarms are on" }
  alarms.config.memory: { type: bool, description: "Whether memory alarms are on" }
  alarms.config.temperature: { type: bool, description: "Whether temperature alarms are on" }
  alarms.config.interval: { type: int, unit: min, description: "The least time between two alarms of one type from one device" }
  alarms.config.disconnect: { type: bool, description: "Whether disconnection alarms are on" }
  alarms.config.disconnect_duration: { type: int, unit: s, description: "How long a device must stay disconnected before the alarm" }
  port_alarms.*.has_alarm: { type: bool, description: "A port's alarms from get_port_alarms, keyed by port: whether it has alarm events" }
  port_alarms.*.has_error: { type: bool, description: "Whether it has error alarms" }
  # 14 production test
  boards.*.cpu: { type: string, description: "A board (exchange_board, ev4, a311d2): its CPU use as the device shows it" }
  boards.*.memory: { type: string, description: "Its memory use as the device shows it" }
  boards.*.temperature: { type: string, description: "Its temperature as the device shows it" }
  boards.*.software_version: { type: string, description: "Its software version" }
  boards.*.hardware_version: { type: string, description: "Its hardware version" }
  device.serial: { type: string, description: "The device's serial number" }
  device.firmware_version: { type: string, description: "The device's firmware version" }
  device.hardware_version: { type: string, description: "The device's hardware version" }
  test.fans: { type: string, description: "The fan list, as JSON text" }
  test.usb: { type: string, description: "The USB port's status" }
  test.fan_test.*.status: { type: string, description: "A fan in the last fan test, keyed by name: its status" }
  test.fan_test.*.rpm: { type: int, unit: rpm, description: "Its speed" }
  test.ports.*.speed_duplex: { type: string, description: "A port in the production port test, keyed by port: its speed and duplex" }
  test.ports.*.link: { type: bool, description: "Whether its link is up" }
  test.ports.*.poe_power: { type: string, description: "Its PoE power as the device shows it" }
  test.ports.*.result: { type: string, description: "Its test result" }
  # 15 page interface
  system.hostname: { type: string, description: "The host name" }
  system.hardware_version: { type: string, description: "Hardware version" }
  system.software_version: { type: string, description: "Software version" }
  system.firmware_version: { type: string, description: "Firmware version" }
  system.serial: { type: string, description: "Serial number" }
  system.ndi_version: { type: string, description: "NDI version" }
  system.product: { type: string, description: "Product" }
  system.oem: { type: string, description: "OEM brand" }
  system.mac: { type: string, description: "MAC address" }
  system.mode: { type: string, description: "Mode, such as L2" }
  system.cpu: { type: int, unit: "%", description: "CPU use" }
  system.temperature: { type: int, unit: degC, description: "Temperature" }
  system.memory: { type: int, unit: "%", description: "Memory use" }
  system.memory_total: { type: int, description: "Total memory, as reported (no unit documented)" }
  system.memory_used: { type: int, description: "Memory in use, as reported" }
  system.disk: { type: int, unit: "%", description: "Disk use" }
  system.disk_total: { type: int, description: "Total disk, as reported (no unit documented)" }
  system.disk_used: { type: int, description: "Disk in use, as reported" }
  network.interfaces.*.type: { type: string, description: "A network interface, keyed by name (such as eth1.1): its type, eth" }
  network.interfaces.*.mac: { type: string, description: "Its MAC address" }
  network.interfaces.*.ip: { type: string, description: "Its IP address" }
  network.interfaces.*.netmask: { type: string, description: "Its subnet mask" }
  network.interfaces.*.gateway: { type: string, description: "Its gateway" }
  network.interfaces.*.dns: { type: string, description: "Its DNS server" }
  network.interfaces.*.method: { type: string, description: "How it is addressed, DHCP or static" }
  network.interfaces.*.status: { type: string, description: "up or down" }
  network.interfaces.*.multicast: { type: string, description: "Whether it supports multicast, yes or no" }
  network.interfaces.*.received: { type: int, unit: KB, description: "Traffic received" }
  network.interfaces.*.transmitted: { type: int, unit: KB, description: "Traffic sent" }

telemetry:
  poll:
    # Routing and the panels: the panel and front panel lists, and each
    # one's details read in turn (then_send below).
    - every_ms: 2000
      send:
        - { method: GET, path: /v1/panel/query/all }
        - { method: GET, path: /v1/front/panel/query }
    # Live status.
    - every_ms: 5000
      send:
        - { method: GET, path: /v1/switch/sys/info }
        - { method: GET, path: /api/systemctrl/report/get_system_info }
        - { method: GET, path: /api/networkmanager/report/get_network }
        - { method: GET, path: /v1/switch/port/dump }
        - { method: GET, path: /v1/switch/port/traffic/query/top }
        - { method: GET, path: /v1/switch/power/status/query }
        - { method: GET, path: /v1/ptp/query }
        - { method: GET, path: /v1/topology/status/query }
        - { method: GET, path: /v1/bindkls/bindinfo }
        - { method: GET, path: /v1/alarm/events/levels/get, raw_query: "alarm_levels=1&alarm_levels=2&alarm_levels=3" }
    # Configuration.
    - every_ms: 30000
      send:
        - { method: GET, path: /v1/user/userlist }
        - { method: GET, path: /v1/systime/get }
        - { method: GET, path: /v1/preset/getlist }
        - { method: GET, path: /v1/preset/vlan/interface/list/get }
        - { method: GET, path: /v1/switch/interface/ip/get }
        - { method: GET, path: /v1/preset/mode/get }
        - { method: GET, path: /v1/input/discovery/all }
        - { method: GET, path: /v1/output/query/all }
        - { method: GET, path: /v1/output/query/default }
        - { method: GET, path: /v1/kls/output/query/all }
        - { method: GET, path: /v1/bindkls/vlan }
        - { method: GET, path: /v1/icon/all }
        - { method: GET, path: /v1/vlan/cfg/all }
        - { method: GET, path: /v1/topology/query }
        - { method: GET, path: /v1/switch/vlan/dump }
        - { method: GET, path: /v1/switch/aggr/dump }
        - { method: POST, path: /v1/switch/dhcps/clients/dump, content_type: application/json, body: '{"vlan_id":[]}' }
        - { method: POST, path: /v1/switch/dhcps/static/get, content_type: application/json, body: '{}' }
        - { method: GET, path: /v1/switch/iproutes/get }
        - { method: GET, path: /v1/network/query }
        - { method: GET, path: /v1/alarm/config/get }
        - { method: GET, path: /v1/diagnose/task/query/type }
        - { method: GET, path: /v1/diagnose/task/alldev/list }
        - { method: GET, path: /v1/switch/port/display/query }
        - { method: GET, path: /v1/test/get_resources }
        - { method: GET, path: /v1/test/fan_list }
        - { method: GET, path: /v1/test/usb_port_status }
  updates:
    # ── 1.1.5 users ───────────────────────────────────────────────────
    - path: "^/v1/user/userlist$"
      json_match: &ok200 { "$.code": "^200$" }
      json_each: "$.data"
      json: { id: "$.id", username: "$.username", alias: "$.alias", role: "$.role", online: "$.online", first: "$.first_login", created: "$.create_time", updated: "$.update_time" }
      replace: users
      state:
        "users.{id}.username": "{username}"
        "users.{id}.alias": "{alias}"
        "users.{id}.role": "{role}"
        "users.{id}.online": "{online}"
        "users.{id}.first_login": "{first}"
        "users.{id}.created": "{created}"
        "users.{id}.updated": "{updated}"

    # ── 2.2.1 time, 2.3 PTP ───────────────────────────────────────────
    - path: "^/v1/systime/get$"
      json_match: *ok200
      json: { tz: "$.data.Timezone", ntp: "$.data.ntp", offset: "$.data.offset", time: "$.data.time", type: "$.data.timetype" }
      state: { time.timezone: "{tz}", time.ntp: "{ntp}", time.offset: "{offset}", time.now: "{time}", time.source: "{type}" }
    - path: "^/v1/ptp/query$"
      json_match: *ok200
      json_each: "$.data.ptps"
      json: &ptp_fields
        id: "$.id"
        enable: "$.enable"
        domain: "$.domain"
        type: "$.type"
        identity: "$.identity"
        pport: "$.pport_id"
        status: "$.status"
        two_step: "$.two_step"
        p1: "$.priority1"
        p2: "$.priority2"
        leap: "$.leap_s"
        offset: "$.de_mainclock"
        delay: "$.average_delay"
        up_dev: "$.upstream_equipment"
        up_port: "$.upstream_port"
      replace: ptp.clocks
      state: &ptp_state
        "ptp.clocks.{id}.enabled": "{enable}"
        "ptp.clocks.{id}.domain": "{domain}"
        "ptp.clocks.{id}.type": "{type}"
        "ptp.clocks.{id}.identity": "{identity}"
        "ptp.clocks.{id}.parent_port": "{pport}"
        "ptp.clocks.{id}.status": { value: "{status}", map: { "0": stopped, "1": running, "3": config_error } }
        "ptp.clocks.{id}.two_step": "{two_step}"
        "ptp.clocks.{id}.priority1": "{p1}"
        "ptp.clocks.{id}.priority2": "{p2}"
        "ptp.clocks.{id}.leap_second": "{leap}"
        "ptp.clocks.{id}.offset_from_master": "{offset}"
        "ptp.clocks.{id}.mean_path_delay": "{delay}"
        "ptp.clocks.{id}.upstream_device": "{up_dev}"
        "ptp.clocks.{id}.upstream_port": "{up_port}"
    - path: "^/v1/ptp/query$"
      json_match: *ok200
      json_each: "$.data.ports"
      json: { id: "$.id", clock: "$.ptp_id", mode: "$.mode", master: "$.master" }
      replace: ptp.ports
      state: { "ptp.ports.{id}.clock": "{clock}", "ptp.ports.{id}.mode": "{mode}", "ptp.ports.{id}.master": "{master}" }
    - path: "^/v1/ptp/detail/query\\?id=\\d+$"
      json_match: { "$.code": "^200$", "$.data.id": "^\\d+$" }
      json: { id: "$.data.id", enable: "$.data.enable", domain: "$.data.domain", type: "$.data.type", two_step: "$.data.two_step", p1: "$.data.priority1", p2: "$.data.priority2", leap: "$.data.leap_s" }
      state:
        "ptp.clocks.{id}.enabled": "{enable}"
        "ptp.clocks.{id}.domain": "{domain}"
        "ptp.clocks.{id}.type": "{type}"
        "ptp.clocks.{id}.two_step": "{two_step}"
        "ptp.clocks.{id}.priority1": "{p1}"
        "ptp.clocks.{id}.priority2": "{p2}"
        "ptp.clocks.{id}.leap_second": "{leap}"

    # ── 3.1 presets, 3.2 virtual NICs, 3.3 mode ───────────────────────
    - path: "^/v1/preset/getlist$"
      json_match: *ok200
      json_each: "$.data"
      json: { name: "$.prname", version: "$.version", apply: "$.apply" }
      replace: presets
      state: { "presets.{name:key}.version": "{version}", "presets.{name:key}.apply": "{apply}" }
    - path: "^/v1/preset/vlan/interface/list/get$"
      json_match: *ok200
      json_each: "$.data"
      json: { vlan: "$.vlan_id", ip: "$.ip", netmask: "$.netmask", alias: "$.alias", color: "$.color" }
      state:
        "virtual_nics.{vlan}.ip": "{ip}"
        "virtual_nics.{vlan}.netmask": "{netmask}"
        "virtual_nics.{vlan}.alias": "{alias}"
        "virtual_nics.{vlan}.color": "{color}"
    - path: "^/v1/preset/vlan/interface/get\\?vlan_id=(\\d+)$"
      json_match: *ok200
      json:
        enable: "$.data.interface.enable"
        ip: "$.data.interface.ip"
        netmask: "$.data.interface.netmask"
        type: "$.data.interface.type"
        referenced: "$.data.interface.referenced"
        default_route: "$.data.interface.is_default_route"
        dhcp: "$.data.recommend.dhcp.is_recommend"
        manual: "$.data.recommend.manual.is_recommend"
        manual_ip: "$.data.recommend.manual.vlanif_ip"
        manual_range: "$.data.recommend.manual.recommend_range"
      state:
        "virtual_nics.{1}.enabled": "{enable}"
        "virtual_nics.{1}.ip": "{ip}"
        "virtual_nics.{1}.netmask": "{netmask}"
        "virtual_nics.{1}.type": "{type}"
        "virtual_nics.{1}.referenced": "{referenced}"
        "virtual_nics.{1}.default_route": "{default_route}"
        "virtual_nics.{1}.recommend_dhcp": "{dhcp}"
        "virtual_nics.{1}.recommend_manual": "{manual}"
        "virtual_nics.{1}.recommended_ip": "{manual_ip}"
        "virtual_nics.{1}.recommended_range": "{manual_range}"
    - path: "^/v1/switch/interface/ip/get$"
      json_match: *ok200
      json_each: "$.data.interface_ip_list"
      json: { vlan: "$.vlan_id", ip: "$.ip" }
      replace: interface_ips
      state: { "interface_ips.{vlan}": "{ip}" }
    - path: "^/v1/preset/mode/get$"
      json_match: *ok200
      json: { mode: "$.data.mode" }
      state: { switch.mode: "{mode}" }

    # ── 4.1 discovery: the methods, and each one's sources read in turn ─
    - path: "^/v1/input/discovery/all$"
      json_match: *ok200
      json_each: "$.data.manuals"
      json: { id: "$.dis_id", group: "$.dis_g_name", device: "$.dis_d_ip" }
      replace: discovery
      state:
        "discovery.{id}.method": manual
        "discovery.{id}.group": "{group}"
        "discovery.{id}.device_ip": "{device}"
      then_send: [{ method: GET, path: /v1/input/manual/discovery }]
    - path: "^/v1/input/discovery/all$"
      json_match: *ok200
      json_each: "$.data.auto_servers"
      json: { id: "$.dis_id", method: "$.dis_method", group: "$.dis_g_name", device: "$.dis_d_ip", server: "$.dis_s_ip" }
      replace: discovery
      state:
        "discovery.{id}.method": "{method}"
        "discovery.{id}.group": "{group}"
        "discovery.{id}.device_ip": "{device}"
        "discovery.{id}.server_ip": "{server}"
    - path: "^/v1/input/discovery/all$"
      json_match: *ok200
      json_each: "$.data.auto_servers"
      each_match: { "$.dis_method": "^auto$" }
      json: { group: "$.dis_g_name" }
      then_send: [{ method: GET, path: /v1/input/auto/discovery, query: { dis_g_name: "{group}" } }]
    - path: "^/v1/input/discovery/all$"
      json_match: *ok200
      json_each: "$.data.auto_servers"
      each_match: { "$.dis_method": "^server$" }
      json: { group: "$.dis_g_name", server: "$.dis_s_ip" }
      then_send: [{ method: GET, path: /v1/input/server/discovery, query: { dis_g_name: "{group}", dis_s_ip: "{server}" } }]
    - path: "^/v1/input/manual/discovery$"
      json_match: *ok200
      json_each: "$.data.inputs"
      json: &found { url: "$.url", name: "$.name", alias: "$.alias", channel: "$.c_name", dname: "$.d_name", ip: "$.d_ip", port: "$.d_port", enable: "$.enable", group: "$.dis_g_name", vlan: "$.vlan_id", sw: "$.switcher_id" }
      replace: discovered.manual
      state:
        "discovered.manual.{url:key}.name": "{name}"
        "discovered.manual.{url:key}.alias": "{alias}"
        "discovered.manual.{url:key}.channel_name": "{channel}"
        "discovered.manual.{url:key}.device_name": "{dname}"
        "discovered.manual.{url:key}.device_ip": "{ip}"
        "discovered.manual.{url:key}.device_port": "{port}"
        "discovered.manual.{url:key}.enabled": "{enable}"
        "discovered.manual.{url:key}.group": "{group}"
        "discovered.manual.{url:key}.vlan": "{vlan}"
        "discovered.manual.{url:key}.switch_serial": "{sw}"
    - path: "^/v1/input/auto/discovery\\?dis_g_name=([^&]*)$"
      json_match: *ok200
      json_each: "$.data.inputs"
      json: *found
      replace: "discovered.auto.{1:url_decode:key}"
      state:
        "discovered.auto.{1:url_decode:key}.{url:key}.name": "{name}"
        "discovered.auto.{1:url_decode:key}.{url:key}.alias": "{alias}"
        "discovered.auto.{1:url_decode:key}.{url:key}.channel_name": "{channel}"
        "discovered.auto.{1:url_decode:key}.{url:key}.device_name": "{dname}"
        "discovered.auto.{1:url_decode:key}.{url:key}.device_ip": "{ip}"
        "discovered.auto.{1:url_decode:key}.{url:key}.device_port": "{port}"
        "discovered.auto.{1:url_decode:key}.{url:key}.enabled": "{enable}"
        "discovered.auto.{1:url_decode:key}.{url:key}.vlan": "{vlan}"
        "discovered.auto.{1:url_decode:key}.{url:key}.switch_serial": "{sw}"
    - path: "^/v1/input/server/discovery\\?dis_g_name=([^&]*)&dis_s_ip=([^&]*)$"
      json_match: *ok200
      json_each: "$.data.inputs"
      json: *found
      replace: "discovered.server.{2:url_decode:key}.{1:url_decode:key}"
      state:
        "discovered.server.{2:url_decode:key}.{1:url_decode:key}.{url:key}.name": "{name}"
        "discovered.server.{2:url_decode:key}.{1:url_decode:key}.{url:key}.alias": "{alias}"
        "discovered.server.{2:url_decode:key}.{1:url_decode:key}.{url:key}.channel_name": "{channel}"
        "discovered.server.{2:url_decode:key}.{1:url_decode:key}.{url:key}.device_name": "{dname}"
        "discovered.server.{2:url_decode:key}.{1:url_decode:key}.{url:key}.device_ip": "{ip}"
        "discovered.server.{2:url_decode:key}.{1:url_decode:key}.{url:key}.device_port": "{port}"
        "discovered.server.{2:url_decode:key}.{1:url_decode:key}.{url:key}.enabled": "{enable}"
        "discovered.server.{2:url_decode:key}.{1:url_decode:key}.{url:key}.vlan": "{vlan}"
        "discovered.server.{2:url_decode:key}.{1:url_decode:key}.{url:key}.switch_serial": "{sw}"

    # ── 4.3 outputs ───────────────────────────────────────────────────
    - path: "^/v1/output/query/all$"
      json_match: *ok200
      json_each: "$.data.outputs"
      json: &output_fields
        id: "$.id"
        name: "$.name"
        alias: "$.alias"
        channel: "$.c_name"
        group: "$.g_name"
        smooth: "$.smooth"
        router: "$.router"
        codec_k: "$.codec_k"
        server: "$.dis_s_ip"
        locked: "$.locked"
        enable: "$.enable"
        vlan: "$.vlan_id"
        vlan_alias: "$.vlan_alias"
        vlan_color: "$.vlan_color"
        sw: "$.switcher_id"
        links: "$.connect_num"
        created: "$.create_time"
        updated: "$.update_time"
      replace: outputs
      state: &output_state
        "outputs.{id}.name": "{name}"
        "outputs.{id}.alias": "{alias}"
        "outputs.{id}.channel_name": "{channel}"
        "outputs.{id}.group": "{group}"
        "outputs.{id}.smooth": "{smooth}"
        "outputs.{id}.routed": "{router}"
        "outputs.{id}.codec_keepalive": "{codec_k}"
        "outputs.{id}.discovery_server_ip": "{server}"
        "outputs.{id}.locked": "{locked}"
        "outputs.{id}.enabled": "{enable}"
        "outputs.{id}.vlan": "{vlan}"
        "outputs.{id}.vlan_alias": "{vlan_alias}"
        "outputs.{id}.vlan_color": "{vlan_color}"
        "outputs.{id}.switch_serial": "{sw}"
        "outputs.{id}.connections": "{links}"
        "outputs.{id}.created": "{created}"
        "outputs.{id}.updated": "{updated}"
    - path: "^/v1/output/query\\?id=\\d+$"
      json_match: { "$.code": "^200$", "$.data.id": "^\\d+$" }
      json:
        id: "$.data.id"
        name: "$.data.name"
        alias: "$.data.alias"
        channel: "$.data.c_name"
        group: "$.data.g_name"
        smooth: "$.data.smooth"
        router: "$.data.router"
        codec_k: "$.data.codec_k"
        server: "$.data.dis_s_ip"
        locked: "$.data.locked"
        enable: "$.data.enable"
        vlan: "$.data.vlan_id"
        vlan_alias: "$.data.vlan_alias"
        vlan_color: "$.data.vlan_color"
        sw: "$.data.switcher_id"
        links: "$.data.connect_num"
        created: "$.data.create_time"
        updated: "$.data.update_time"
      state: *output_state
    - path: "^/v1/output/query/default$"
      json_match: *ok200
      json: { name: "$.data.name" }
      state: { output_default: "{name}" }

    # ── 4.4 panels: the list, then each panel's details and configuration
    - path: "^/v1/panel/query/all$"
      json_match: *ok200
      json_each: "$.data.panels"
      json: { id: "$.id", name: "$.name", inputs: "$.input_num", outputs: "$.output_num", created: "$.create_time", updated: "$.update_time" }
      replace: panels
      state:
        "panels.{id}.name": "{name}"
        "panels.{id}.input_count": "{inputs}"
        "panels.{id}.output_count": "{outputs}"
        "panels.{id}.created": "{created}"
        "panels.{id}.updated": "{updated}"
      then_send:
        - { method: GET, path: /v1/panel/detail, query: { id: "{id}" } }
        - { method: GET, path: /v1/panel/cfg/input/all, query: { id: "{id}" } }
        - { method: GET, path: /v1/panel/cfg/output/all, query: { id: "{id}" } }
        - { method: GET, path: /v1/panel/cfg/enable/query, query: { id: "{id}" } }
    - path: "^/v1/panel/query\\?id=\\d+$"
      json_match: { "$.code": "^200$", "$.data.id": "^\\d+$" }
      json: { id: "$.data.id", name: "$.data.name", inputs: "$.data.input_num", outputs: "$.data.output_num", created: "$.data.create_time", updated: "$.data.update_time" }
      state:
        "panels.{id}.name": "{name}"
        "panels.{id}.input_count": "{inputs}"
        "panels.{id}.output_count": "{outputs}"
        "panels.{id}.created": "{created}"
        "panels.{id}.updated": "{updated}"

    # ── 4.7.1 panel details ───────────────────────────────────────────
    - path: "^/v1/panel/detail\\?id=(\\d+)$"
      json_match: *ok200
      json: { expand: "$.data.expand" }
      state: { "panel_info.{1}.expanded": "{expand}" }
    - path: "^/v1/panel/detail\\?id=(\\d+)$"
      json_match: *ok200
      json_each: "$.data.panel_inputs"
      json: &input_fields
        id: "$.id"
        name: "$.name"
        alias: "$.alias"
        channel: "$.c_name"
        group: "$.g_name"
        ip: "$.d_ip"
        port: "$.d_port"
        url: "$.url"
        enable: "$.enable"
        method: "$.dis_method"
        dgroup: "$.dis_g_name"
        dip: "$.dis_d_ip"
        sip: "$.dis_s_ip"
        vlan: "$.vlan_id"
        sw: "$.switcher_id"
        res: "$.resolution"
        vb: "$.vb"
        ab: "$.ab"
        multicast: "$.multicast"
        icon_type: "$.icon_type"
        icon_name: "$.icon_name"
      replace: "panel_inputs.{1}"
      state: &input_state
        "panel_inputs.{1}.{id}.position": "{index}"
        "inputs.{id}.name": "{name}"
        "inputs.{id}.alias": "{alias}"
        "inputs.{id}.channel_name": "{channel}"
        "inputs.{id}.group": "{group}"
        "inputs.{id}.device_ip": "{ip}"
        "inputs.{id}.device_port": "{port}"
        "inputs.{id}.url": "{url}"
        "inputs.{id}.enabled": "{enable}"
        "inputs.{id}.discovery": "{method}"
        "inputs.{id}.discovery_group": "{dgroup}"
        "inputs.{id}.discovery_device_ip": "{dip}"
        "inputs.{id}.discovery_server_ip": "{sip}"
        "inputs.{id}.vlan": "{vlan}"
        "inputs.{id}.switch_serial": "{sw}"
        "inputs.{id}.resolution": "{res}"
        "inputs.{id}.video_bitrate": "{vb}"
        "inputs.{id}.audio_bitrate": "{ab}"
        "inputs.{id}.multicast": "{multicast}"
        "inputs.{id}.icon_type": "{icon_type}"
        "inputs.{id}.icon_name": "{icon_name}"
    - path: "^/v1/panel/detail\\?id=(\\d+)$"
      json_match: *ok200
      json_each: "$.data.other_inputs"
      json: *input_fields
      state:
        "inputs.{id}.name": "{name}"
        "inputs.{id}.alias": "{alias}"
        "inputs.{id}.channel_name": "{channel}"
        "inputs.{id}.group": "{group}"
        "inputs.{id}.device_ip": "{ip}"
        "inputs.{id}.device_port": "{port}"
        "inputs.{id}.url": "{url}"
        "inputs.{id}.enabled": "{enable}"
        "inputs.{id}.discovery": "{method}"
        "inputs.{id}.discovery_group": "{dgroup}"
        "inputs.{id}.discovery_device_ip": "{dip}"
        "inputs.{id}.discovery_server_ip": "{sip}"
        "inputs.{id}.vlan": "{vlan}"
        "inputs.{id}.switch_serial": "{sw}"
        "inputs.{id}.resolution": "{res}"
        "inputs.{id}.video_bitrate": "{vb}"
        "inputs.{id}.audio_bitrate": "{ab}"
        "inputs.{id}.multicast": "{multicast}"
        "inputs.{id}.icon_type": "{icon_type}"
        "inputs.{id}.icon_name": "{icon_name}"
    - path: "^/v1/panel/detail\\?id=(\\d+)$"
      json_match: *ok200
      json_each: "$.data.panel_outputs"
      json:
        id: "$.id"
        input: "$.input_id"
        linked: "$.linked"
        lock: "$.lock"
        links: "$.connect_num"
        res: "$.resolution"
        vb: "$.vb"
        ab: "$.ab"
        r_id: "$.r_id"
        r_loop: "$.r_loop"
        r_src: "$.r_src_id"
        r_uuid: "$.r_src_uuid"
        r_progress: "$.r_src_progress"
        icon_type: "$.icon_type"
        icon_name: "$.icon_name"
        dip: "$.d_ip"
      replace: "panel_outputs.{1}"
      state:
        "panel_outputs.{1}.{id}.position": "{index}"
        "panel_outputs.{1}.{id}.input": "{input}"
        "panel_outputs.{1}.{id}.linked": "{linked}"
        "panel_outputs.{1}.{id}.locked": "{lock}"
        "panel_outputs.{1}.{id}.connections": "{links}"
        "panel_outputs.{1}.{id}.resolution": "{res}"
        "panel_outputs.{1}.{id}.video_bitrate": "{vb}"
        "panel_outputs.{1}.{id}.audio_bitrate": "{ab}"
        "panel_outputs.{1}.{id}.rotation_list": "{r_id}"
        "panel_outputs.{1}.{id}.rotation_loop": "{r_loop}"
        "panel_outputs.{1}.{id}.rotation_source": "{r_src}"
        "panel_outputs.{1}.{id}.rotation_source_uuid": "{r_uuid}"
        "panel_outputs.{1}.{id}.rotation_progress": "{r_progress}"
        "panel_outputs.{1}.{id}.icon_type": "{icon_type}"
        "panel_outputs.{1}.{id}.icon_name": "{icon_name}"
        "panel_outputs.{1}.{id}.device_ip": "{dip}"

    # ── 4.8 panel configuration ───────────────────────────────────────
    - path: "^/v1/panel/cfg/input/all\\?id=(\\d+)$"
      json_match: *ok200
      json_each: "$.data.cfg_inputs"
      json: &cfg_fields { id: "$.id", name: "$.name", alias: "$.alias", icon: "$.icon_id", content: "$.front_content" }
      replace: "panel_config.{1}.inputs"
      state:
        "panel_config.{1}.inputs.{id}.name": "{name}"
        "panel_config.{1}.inputs.{id}.alias": "{alias}"
        "panel_config.{1}.inputs.{id}.icon": "{icon}"
        "panel_config.{1}.inputs.{id}.front_content": "{content}"
    - path: "^/v1/panel/cfg/output/all\\?id=(\\d+)$"
      json_match: *ok200
      json_each: "$.data.cfg_outputs"
      json: *cfg_fields
      replace: "panel_config.{1}.outputs"
      state: &cfg_output_state
        "panel_config.{1}.outputs.{id}.name": "{name}"
        "panel_config.{1}.outputs.{id}.alias": "{alias}"
        "panel_config.{1}.outputs.{id}.icon": "{icon}"
        "panel_config.{1}.outputs.{id}.front_content": "{content}"
    - path: "^/v1/panel/cfg/output/all\\?id=(\\d+)$"
      json_match: *ok200
      json_each: "$.data.outputs"
      json: *cfg_fields
      replace: "panel_config.{1}.outputs"
      state: *cfg_output_state
    - path: "^/v1/panel/cfg/enable/query\\?id=(\\d+)$"
      json_match: *ok200
      json: { enable: "$.data.enable" }
      state: { "panel_config.{1}.physical_panel": "{enable}" }

    # ── 5 KLS outputs and panels ──────────────────────────────────────
    - path: "^/v1/kls/output/query/all$"
      json_match: *ok200
      json_each: "$.data.outputs"
      json: &kls_output_fields { uuid: "$.uuid", name: "$.name", alias: "$.alias", channel: "$.c_name", group: "$.g_name", router: "$.router", server: "$.dis_s_ip", vlan: "$.vlan_id", sw: "$.switcher_id" }
      replace: kls_outputs
      state: &kls_output_state
        "kls_outputs.{uuid:key}.name": "{name}"
        "kls_outputs.{uuid:key}.alias": "{alias}"
        "kls_outputs.{uuid:key}.channel_name": "{channel}"
        "kls_outputs.{uuid:key}.group": "{group}"
        "kls_outputs.{uuid:key}.routed": "{router}"
        "kls_outputs.{uuid:key}.discovery_server_ip": "{server}"
        "kls_outputs.{uuid:key}.vlan": "{vlan}"
        "kls_outputs.{uuid:key}.switch_serial": "{sw}"
    - path: "^/v1/kls/output/add$"
      json_match: *ok200
      json_each: "$.data.outputs"
      json: *kls_output_fields
      state: *kls_output_state
    - path: "^/v1/kls/output/query\\?uuid="
      json_match: { "$.code": "^200$", "$.data.uuid": "^.+$" }
      json: { uuid: "$.data.uuid", name: "$.data.name", alias: "$.data.alias", channel: "$.data.c_name", group: "$.data.g_name", router: "$.data.router", server: "$.data.dis_s_ip", vlan: "$.data.vlan_id", sw: "$.data.switcher_id" }
      state: *kls_output_state
    - path: "^/v1/kls/panel/detail\\?panel_uuid=([^&]+)$"
      json_match: *ok200
      json_each: "$.data.panel_inputs"
      json: { name: "$.name", alias: "$.alias", channel: "$.c_name", group: "$.g_name", ip: "$.d_ip", port: "$.d_port", url: "$.url", enable: "$.enable", method: "$.dis_method", vlan: "$.vlan_id", sw: "$.switcher_id", res: "$.resolution", vb: "$.vb", ab: "$.ab", multicast: "$.multicast" }
      replace: "kls_panels.{1:url_decode:key}.inputs"
      state:
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.alias": "{alias}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.channel_name": "{channel}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.group": "{group}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.device_ip": "{ip}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.device_port": "{port}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.url": "{url}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.enabled": "{enable}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.discovery": "{method}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.vlan": "{vlan}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.switch_serial": "{sw}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.resolution": "{res}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.video_bitrate": "{vb}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.audio_bitrate": "{ab}"
        "kls_panels.{1:url_decode:key}.inputs.{name:key}.multicast": "{multicast}"
    - path: "^/v1/kls/panel/detail\\?panel_uuid=([^&]+)$"
      json_match: *ok200
      json_each: "$.data.panel_outputs"
      json: { uuid: "$.uuid", name: "$.name", alias: "$.alias", channel: "$.c_name", group: "$.g_name", router: "$.router", enable: "$.enable", vlan: "$.vlan_id", links: "$.connect_num", lock: "$.lock", res: "$.resolution", vb: "$.vb", ab: "$.ab", input: "$.input_name", linked: "$.linked", r_uuid: "$.r_uuid", r_loop: "$.r_loop", progress: "$.r_src_progress", dip: "$.d_ip" }
      replace: "kls_panels.{1:url_decode:key}.outputs"
      state:
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.name": "{name}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.alias": "{alias}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.channel_name": "{channel}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.group": "{group}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.routed": "{router}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.enabled": "{enable}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.vlan": "{vlan}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.connections": "{links}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.locked": "{lock}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.resolution": "{res}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.video_bitrate": "{vb}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.audio_bitrate": "{ab}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.input": "{input}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.linked": "{linked}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.playlist": "{r_uuid}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.playlist_loop": "{r_loop}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.playlist_progress": "{progress}"
        "kls_panels.{1:url_decode:key}.outputs.{uuid:key}.device_ip": "{dip}"

    # ── 6 KLS binding ─────────────────────────────────────────────────
    - path: "^/v1/bindkls/vlan$"
      json_match: *ok200
      json: { vlans: "$.data" }
      state: { kls.vlans: "{vlans}" }
    - path: "^/v1/bindkls/(?:bindinfo|status)$"
      json_match: *ok200
      json: { status: "$.data.status" }
      state: { kls.binding_status: { value: "{status}", map: &bind_status { "1": bound, "2": binding, "3": failed, "4": unbound } } }
    - path: "^/v1/bindkls/bindinfo$"
      json_match: *ok200
      json_each: "$.data.bind_list"
      json: { id: "$.id", ip: "$.ip", ifname: "$.ifname", status: "$.bind_status" }
      replace: kls.bindings
      state:
        "kls.bindings.{id}.ip": "{ip}"
        "kls.bindings.{id}.ifname": "{ifname}"
        "kls.bindings.{id}.status": { value: "{status}", map: *bind_status }

    # ── 7 icons ───────────────────────────────────────────────────────
    - path: "^/v1/icon/all$"
      json_match: *ok200
      json_each: "$.data.official_icons"
      json: &icon_fields { id: "$.id", name: "$.name", type: "$.type" }
      replace: icons
      state: &icon_state { "icons.{id}.name": "{name}", "icons.{id}.type": "{type}" }
    - path: "^/v1/icon/all$"
      json_match: *ok200
      json_each: "$.data.custom_icons"
      json: *icon_fields
      replace: icons
      state: *icon_state

    # ── 8 front panels: the list, then each one's details ─────────────
    - path: "^/v1/front/panel/query$"
      json_match: *ok200
      json_each: "$.data.panels"
      json: { id: "$.id", name: "$.name", alias: "$.alias" }
      replace: front_panels
      state: { "front_panels.{id}.name": "{name}", "front_panels.{id}.alias": "{alias}" }
      then_send: [{ method: GET, path: /v1/front/panel/detail, query: { panel_id: "{id}" } }]
    - path: "^/v1/front/panel/detail\\?panel_id=(\\d+)$"
      json_match: *ok200
      json_each: "$.data.panel_inputs"
      json: { id: "$.id", name: "$.name", alias: "$.alias", icon: "$.icon_name", content: "$.front_content" }
      replace: "front_panels.{1}.inputs"
      state:
        "front_panels.{1}.inputs.{id}.name": "{name}"
        "front_panels.{1}.inputs.{id}.alias": "{alias}"
        "front_panels.{1}.inputs.{id}.icon_name": "{icon}"
        "front_panels.{1}.inputs.{id}.front_content": "{content}"
    - path: "^/v1/front/panel/detail\\?panel_id=(\\d+)$"
      json_match: *ok200
      json_each: "$.data.panel_outputs"
      json: { id: "$.id", name: "$.name", alias: "$.alias", lock: "$.lock", input: "$.input_id", linked: "$.linked", icon: "$.icon_name", content: "$.front_content" }
      replace: "front_panels.{1}.outputs"
      state:
        "front_panels.{1}.outputs.{id}.name": "{name}"
        "front_panels.{1}.outputs.{id}.alias": "{alias}"
        "front_panels.{1}.outputs.{id}.locked": "{lock}"
        "front_panels.{1}.outputs.{id}.input": "{input}"
        "front_panels.{1}.outputs.{id}.linked": "{linked}"
        "front_panels.{1}.outputs.{id}.icon_name": "{icon}"
        "front_panels.{1}.outputs.{id}.front_content": "{content}"

    # ── 9 VLAN configurations ─────────────────────────────────────────
    - path: "^/v1/vlan/cfg/all$"
      json_match: *ok200
      json_each: "$.data.vlan_cfgs"
      json: { id: "$.id", type: "$.type", name: "$.name", priority: "$.priority", description: "$.description", vlans: "$.vlans" }
      replace: vlan_profiles
      state:
        "vlan_profiles.{id}.name": "{name}"
        "vlan_profiles.{id}.official": "{type}"
        "vlan_profiles.{id}.priority": "{priority}"
        "vlan_profiles.{id}.description": "{description}"
        "vlan_profiles.{id}.vlans": "{vlans}"

    # ── 10 topology ───────────────────────────────────────────────────
    - path: "^/v1/topology/query$"
      json_match: *ok200
      json_each: "$.data.nodes"
      json: { id: "$.id", name: "$.name", type: "$.type", label: "$.label", parent: "$.parent_id", shape: "$.shape", image: "$.image", valid: "$.valid", x: "$.x", y: "$.y", port: "$.connection_port" }
      replace: topology_nodes
      state:
        "topology_nodes.{id:key}.name": "{name}"
        "topology_nodes.{id:key}.type": "{type}"
        "topology_nodes.{id:key}.label": "{label}"
        "topology_nodes.{id:key}.parent": "{parent}"
