spec: 1
id: roland-xs62s
name: Roland XS-62S (LAN control)
vendor: Roland
category: switcher

# The XS-62S's LAN/RS-232 command set: the same grammar as the V-60HD
# (roland-v60hd), "stx" + three letters + optional ":" arguments + ";",
# acknowledged by the single byte ACK (06H), with a different command list.
source:
  - title: "XS-62S Reference Manual, Version 3.1 and later, edition 02 (PDF dated 2022-04-08)"
    author: Roland Corporation
    url: https://static.roland.com/assets/media/pdf/XS-62S_reference_v31_eng02_W.pdf
    note: >
      Manufacturer document. RS-232/GPIO menu and RS-232 PNL INFO p.14; LAN
      interface (Telnet, TCP 8023) and command format p.26; video commands
      p.27-28, audio commands p.28-29, system commands, QPL, TLY, VER and ERR
      codes p.29; commands by operation mode (PGM-PST, DISSOLVE, MATRIX) p.30.

transport:
  type: line-tcp
  port: 8023
  # Sent as STX, the command, then ";" (p.26), with no line ending.
  framing: delimited
  open: "\u0002"
  close: ";"
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  reply_framing: terminated
  reply_terminators: [";", "\u0006"]
  # A command's reply is ACK or ERR:n; (p.27-29). Data frames, VER's
  # included, come before their ACK and go to the telemetry rules only.
  reply_match: '^[\x02\x11\x13]*(\x06|ERR:[0-9]+;)'
  probe: "ACS"

ports:
  - { port: 8023, protocol: tcp, role: control }

models:
  - id: xs-62s
    name: Roland XS-62S Multi-Format AV Mixer
    supports:
      - select_pgm
      - select_pst
      - select_aux
      - set_transition
      - set_transition_time
      - cut
      - take
      - set_pinp
      - set_split
      - set_dsk
      - set_dsk_preview
      - set_auto_mixing
      - set_freeze
      - get_bus_channel
      - set_edid
      - set_input_scaling
      - set_scaler_resolution
      - get_scaler_resolution
      - set_scaler_scaling
      - set_hdmi_color_space
      - set_hdmi_signal
      - set_pinp_position
      - set_split_position
      - set_dsk_source
      - set_dsk_level
      - set_dsk_gain
      - set_ch6_input
      - get_ch6_input
      - set_output_bus
      - get_output_bus
      - set_pgm_input_level
      - set_pvw_input_level
      - set_master_level
      - set_pvw_level
      - set_aux_level
      - set_input_delay
      - get_audio_level
      - set_audio_output_bus
      - get_audio_output_bus
      - set_input_mute
      - set_input_solo
      - set_hdcp
      - set_test_pattern
      - set_test_tone
      - recall_memory
      - get_panel_status
      - pulse_gpo
      - set_gpo
      - set_mode
      - camera_recall
      - get_tally
      - get_version
      - active_sense
    verification: none
    notes: >
      Eight channels: 1-4 SDI IN, 5 HDMI IN, 6 HDMI/ANLG IN, 7-8 STILL/BKG.
      Commands from Reference Manual version 3.1.

commands:
  # ── Video (Reference Manual p.27-28)
  select_pgm:
    summary: "Select the PGM/1 channel 1-8: 1-4 SDI IN, 5 HDMI IN, 6 HDMI/ANLG IN, 7-8 STL/BKG (PGM)"
    params:
      xpt: { type: int, min: 1, max: 8, required: true, label: Channel, description: "Channel for the PGM/1 bus: 1-4 SDI IN, 5 HDMI IN, 6 HDMI/ANLG IN, 7-8 STL/BKG." }
    send: "PGM:{xpt:-1}"
    expect: { contains: "\u0006" }
    returns: ack

  select_pst:
    summary: "Select the PVW/2 channel 1-8; ERR:4 in DISSOLVE mode (PST)"
    params:
      xpt: { type: int, min: 1, max: 8, required: true, label: Channel, description: "Channel for the PVW/2 bus: 1-4 SDI IN, 5 HDMI IN, 6 HDMI/ANLG IN, 7-8 STL/BKG; refused in DISSOLVE mode." }
    send: "PST:{xpt:-1}"
    expect: { contains: "\u0006" }
    returns: ack

  select_aux:
    summary: "Select the AUX/3 channel 1-8 (AUX)"
    params:
      xpt: { type: int, min: 1, max: 8, required: true, label: Channel, description: "Channel for the AUX/3 bus: 1-4 SDI IN, 5 HDMI IN, 6 HDMI/ANLG IN, 7-8 STL/BKG." }
    send: "AUX:{xpt:-1}"
    expect: { contains: "\u0006" }
    returns: ack

  set_transition:
    summary: "Select the transition effect: 0 MIX, 1 MIX, 2 WIPE, as printed (TRS)"
    params:
      effect: { type: int, min: 0, max: 2, required: true, label: Transition effect, description: "0 MIX, 1 MIX, 2 WIPE, as printed in the manual." }
    send: "TRS:{effect}"
    expect: { contains: "\u0006" }
    returns: ack

  set_transition_time:
    summary: "Set the video transition time, 0-40 tenths of a second (TIM)"
    params:
      time: { type: int, min: 0, max: 40, required: true, label: Transition time, description: "Video transition time in tenths of a second, 0 to 40 (0.0 to 4.0 s)." }
    send: "TIM:{time}"
    expect: { contains: "\u0006" }
    returns: ack

  cut:
    summary: "Cut transition; PGM-PST mode only (CUT)"
    send: "CUT"
    expect: { contains: "\u0006" }
    returns: ack

  take:
    summary: "Press the [TAKE] button; PGM-PST mode only (TAK)"
    send: "TAK"
    expect: { contains: "\u0006" }
    returns: ack

  set_pinp:
    summary: "Set [PinP]: 0 OFF, 1 PVW ON, 2 PGM ON (PPS)"
    params:
      state: { type: int, min: 0, max: 2, required: true, label: PinP, description: "0 OFF, 1 on in PVW, 2 on in PGM." }
    send: "PPS:{state}"
    expect: { contains: "\u0006" }
    returns: ack

  set_split:
    summary: "Set SPLIT: 0 OFF, 1 PVW ON, 2 PGM ON (SPS)"
    params:
      state: { type: int, min: 0, max: 2, required: true, label: Split, description: "0 OFF, 1 on in PVW, 2 on in PGM." }
    send: "SPS:{state}"
    expect: { contains: "\u0006" }
    returns: ack

  set_dsk:
    summary: "Set DSK on or off (DSK)"
    params:
      enabled: { type: bool, required: true, label: DSK, description: "On turns DSK on, off turns it off." }
    send: "DSK:{enabled:bool01}"
    expect: { contains: "\u0006" }
    returns: ack

  set_dsk_preview:
    summary: "Preview the DSK result on the multi-view, on or off (DVW)"
    params:
      enabled: { type: bool, required: true, label: DSK preview, description: "On shows the DSK result on the multi-view, off hides it." }
    send: "DVW:{enabled:bool01}"
    expect: { contains: "\u0006" }
    returns: ack

  set_auto_mixing:
    summary: "Set the [AUTO MIXING] button on or off (ATM)"
    params:
      enabled: { type: bool, required: true, label: Auto mixing, description: "On turns the [AUTO MIXING] button on, off turns it off." }
    send: "ATM:{enabled:bool01}"
    expect: { contains: "\u0006" }
    returns: ack

  set_freeze:
    summary: "Set the [FREEZE] button on or off (FRZ)"
    params:
      enabled: { type: bool, required: true, label: Freeze, description: "On turns the [FREEZE] button on, off turns it off." }
    send: "FRZ:{enabled:bool01}"
    expect: { contains: "\u0006" }
    returns: ack

  get_bus_channel:
    summary: "Ask which channel a bus carries: 0 PGM/1, 1 PVW/2, 2 AUX/3 (QVC)"
    params:
      bus: { type: int, min: 0, max: 2, required: true, label: Bus, description: "Bus to ask about: 0 PGM/1, 1 PVW/2, 2 AUX/3." }
    send: "QVC:{bus}"
    expect: { contains: "\u0006" }
    returns: ack

  set_edid:
    summary: "Set the EDID of 0 HDMI IN 5, 1 HDMI IN 6 or 2 RGB IN 6: 0 INTERNAL, 1 SVGA, 2 XGA, 3 WXGA, 4 FWXGA, 5 SXGA, 6 SXGA+, 7 UXGA, 8 WUXGA, 9 720p, 10 1080i, 11 1080p (0-8 for RGB) (EDD)"
    params:
      input: { type: int, min: 0, max: 2, required: true, label: Input, description: "0 HDMI IN 5, 1 HDMI IN 6, 2 RGB IN 6." }
      edid: { type: int, min: 0, max: 11, required: true, label: EDID, description: "0 INTERNAL, 1 SVGA, 2 XGA, 3 WXGA, 4 FWXGA, 5 SXGA, 6 SXGA+, 7 UXGA, 8 WUXGA, 9 720p, 10 1080i, 11 1080p; RGB IN 6 takes 0 to 8 only." }
    send: "EDD:{input},{edid}"
    expect: { contains: "\u0006" }
    returns: ack

  set_input_scaling:
    summary: "Set the scaling of 0 HDMI IN 5, 1 HDMI IN 6 or 2 RGB IN 6: 0 FULL, 1 LETTERBOX, 2 CROP, 3 DOT BY DOT, 4 MANUAL (VIA)"
    params:
      input: { type: int, min: 0, max: 2, required: true, label: Input, description: "0 HDMI IN 5, 1 HDMI IN 6, 2 RGB IN 6." }
      type: { type: int, min: 0, max: 4, required: true, label: Scaling, description: "0 FULL, 1 LETTERBOX, 2 CROP, 3 DOT BY DOT, 4 MANUAL." }
    send: "VIA:{input},{type}"
    expect: { contains: "\u0006" }
    returns: ack

  set_scaler_resolution:
    summary: "Set the scaler out resolution: 0 480p/576p, 1 720p, 2 1080p, 3 SVGA, 4 XGA, 5 WXGA, 6 SXGA, 7 FWXGA, 8 SXGA+, 9 UXGA, 10 WUXGA (VOR)"
    params:
      resolution: { type: int, min: 0, max: 10, required: true, label: Resolution, description: "Scaler out resolution: 0 480p/576p, 1 720p, 2 1080p, 3 SVGA, 4 XGA, 5 WXGA, 6 SXGA, 7 FWXGA, 8 SXGA+, 9 UXGA, 10 WUXGA." }
    send: "VOR:{resolution}"
    expect: { contains: "\u0006" }
    returns: ack

  get_scaler_resolution:
    summary: "Ask for the scaler out resolution (QVR)"
    send: "QVR"
    expect: { contains: "\u0006" }
    returns: ack

  set_scaler_scaling:
    summary: "Set the scaler out scaling: 0 FULL, 1 LETTERBOX, 2 CROP, 3 DOT BY DOT, 4 MANUAL (VOA)"
    params:
      type: { type: int, min: 0, max: 4, required: true, label: Scaling, description: "Scaler out scaling: 0 FULL, 1 LETTERBOX, 2 CROP, 3 DOT BY DOT, 4 MANUAL." }
    send: "VOA:{type}"
    expect: { contains: "\u0006" }
    returns: ack

  set_hdmi_color_space:
    summary: "Set the color space of HDMI OUT 1-3 (0-2): 0 YCC, 1 RGB LMT, 2 RGB FULL (VOC)"
    params:
      output: { type: int, min: 0, max: 2, required: true, label: HDMI output, description: "HDMI OUT numbered from 0: 0 HDMI OUT 1, 1 HDMI OUT 2, 2 HDMI OUT 3." }
      space: { type: int, min: 0, max: 2, required: true, label: Color space, description: "0 YCC, 1 RGB LMT (limited range), 2 RGB FULL." }
    send: "VOC:{output},{space}"
    expect: { contains: "\u0006" }
    returns: ack

  set_hdmi_signal:
    summary: "Set the signal of HDMI OUT 1-3 (0-2): false DVI-D, true HDMI (VOD)"
    params:
      output: { type: int, min: 0, max: 2, required: true, label: HDMI output, description: "HDMI OUT numbered from 0: 0 HDMI OUT 1, 1 HDMI OUT 2, 2 HDMI OUT 3." }
      hdmi: { type: bool, required: true, label: HDMI signal, description: "On sends an HDMI signal, off sends DVI-D." }
    send: "VOD:{output},{hdmi:bool01}"
    expect: { contains: "\u0006" }
    returns: ack

  set_pinp_position:
    summary: "Position the PinP inset: horizontal -450 to 450, vertical -400 to 400 (PIP)"
    params:
      h: { type: int, min: -450, max: 450, required: true, label: Horizontal position, description: "Horizontal position of the inset, from -450 (left) to 450 (right), 0 centred." }
      v: { type: int, min: -400, max: 400, required: true, label: Vertical position, description: "Vertical position of the inset, from -400 to 400, 0 centred." }
    send: "PIP:{h},{v}"
    expect: { contains: "\u0006" }
    returns: ack

  set_split_position:
    summary: "Split positions of the PGM and PVW video, -250 to 250 each (SPT)"
    params:
      pgm: { type: int, min: -250, max: 250, required: true, label: PGM split position, description: "Split position of the PGM video, -250 to 250, 0 centred." }
      pst: { type: int, min: -250, max: 250, required: true, label: PVW split position, description: "Split position of the PVW video, -250 to 250, 0 centred." }
    send: "SPT:{pgm},{pst}"
    expect: { contains: "\u0006" }
    returns: ack

  set_dsk_source:
    summary: "Set the DSK logo or image channel, 1-8 (DSS)"
    params:
      xpt: { type: int, min: 1, max: 8, required: true, label: DSK source, description: "Channel carrying the DSK logo or image: 1-4 SDI IN, 5 HDMI IN, 6 HDMI/ANLG IN, 7-8 STL/BKG." }
    send: "DSS:{xpt:-1}"
    expect: { contains: "\u0006" }
    returns: ack

  set_dsk_level:
    summary: "Set the DSK key level, 0-255 (KYL)"
    params:
      level: { type: int, min: 0, max: 255, required: true, label: Key level, description: "DSK key level, 0 to 255." }
    send: "KYL:{level}"
    expect: { contains: "\u0006" }
    returns: ack

  set_dsk_gain:
    summary: "Set the DSK key gain, 0-255 (KYG)"
    params:
      gain: { type: int, min: 0, max: 255, required: true, label: Key gain, description: "DSK key gain, 0 to 255." }
    send: "KYG:{gain}"
    expect: { contains: "\u0006" }
    returns: ack

  set_ch6_input:
    summary: "Select the channel 6 input connector: false HDMI, true RGB/COMPONENT (IPS)"
    params:
      rgb: { type: bool, required: true, label: RGB/component, description: "On selects the RGB/COMPONENT connector for channel 6, off selects HDMI." }
    send: "IPS:{rgb:bool01}"
    expect: { contains: "\u0006" }
    returns: ack

  get_ch6_input:
    summary: "Ask for the channel 6 input connector: 0 HDMI, 1 RGB/COMPONENT, 2 COMPOSITE (QIP)"
    send: "QIP"
    expect: { contains: "\u0006" }
    returns: ack

  set_output_bus:
    summary: "Set the bus of the video output connector: 0 PGM, 1 PVW, 2 AUX; the manual names no connector (VOS)"
    params:
      bus: { type: int, min: 0, max: 2, required: true, label: Bus, description: "0 PGM, 1 PVW, 2 AUX; the manual does not name which video output connector this sets." }
    send: "VOS:{bus}"
    expect: { contains: "\u0006" }
    returns: ack

  get_output_bus:
    summary: "Ask for the bus of an output: 0 SDI OUT 1, 1 SDI OUT 2, 2-4 HDMI OUT 1-3 (QVS)"
    params:
      output: { type: int, min: 0, max: 4, required: true, label: Video output, description: "0 SDI OUT 1, 1 SDI OUT 2, 2 HDMI OUT 1, 3 HDMI OUT 2, 4 HDMI OUT 3." }
    send: "QVS:{output}"
    expect: { contains: "\u0006" }
    returns: ack

  # ── Audio (p.28-29)
  set_pgm_input_level:
    summary: "Set an input level of the PGM/1 bus audio; inputs 0 AUDIO IN 1, 1 AUDIO IN 2, 2 AUDIO IN 3, 3 AUDIO IN 4, 4 AUDIO IN 5/6, 5-8 SDI IN 1-4, 9 HDMI IN 5, 10 HDMI IN 6; level -800 to 100 (-80.0 to 10.0 dB), or -801 for -INF (IL1)"
    params:
      input: { type: int, min: 0, max: 10, required: true, label: Audio input, description: "Audio input: 0 AUDIO IN 1, 1 AUDIO IN 2, 2 AUDIO IN 3, 3 AUDIO IN 4, 4 AUDIO IN 5/6, 5-8 SDI IN 1-4, 9 HDMI IN 5, 10 HDMI IN 6." }
      level: { type: int, min: -801, max: 100, required: true, label: Level, description: "Input level on the PGM/1 bus in tenths of a dB, -800 (-80.0 dB) to 100 (+10.0 dB), or -801 for -INF." }
    send: "IL1:{input},{level}"
    expect: { contains: "\u0006" }
    returns: ack

  set_pvw_input_level:
    summary: "Set an input level of the PVW/2 bus audio; inputs as IL1; level -800 to 100 (-80.0 to 10.0 dB), or -801 for -INF (IL2)"
    params:
      input: { type: int, min: 0, max: 10, required: true, label: Audio input, description: "Audio input: 0 AUDIO IN 1, 1 AUDIO IN 2, 2 AUDIO IN 3, 3 AUDIO IN 4, 4 AUDIO IN 5/6, 5-8 SDI IN 1-4, 9 HDMI IN 5, 10 HDMI IN 6." }
      level: { type: int, min: -801, max: 100, required: true, label: Level, description: "Input level on the PVW/2 bus in tenths of a dB, -800 (-80.0 dB) to 100 (+10.0 dB), or -801 for -INF." }
    send: "IL2:{input},{level}"
    expect: { contains: "\u0006" }
    returns: ack

  set_master_level:
    summary: "Set the master out level, -800 to 100 (-80.0 to 10.0 dB), or -801 for -INF (OL1)"
    params:
      level: { type: int, min: -801, max: 100, required: true, label: Master level, description: "Master out level in tenths of a dB, -800 (-80.0 dB) to 100 (+10.0 dB), or -801 for -INF." }
    send: "OL1:{level}"
    expect: { contains: "\u0006" }
    returns: ack

  set_pvw_level:
    summary: "Set the PVW/2 bus output level, -800 to 100 (-80.0 to 10.0 dB), or -801 for -INF (OL2)"
    params:
      level: { type: int, min: -801, max: 100, required: true, label: PVW level, description: "PVW/2 bus output level in tenths of a dB, -800 (-80.0 dB) to 100 (+10.0 dB), or -801 for -INF." }
    send: "OL2:{level}"
    expect: { contains: "\u0006" }
    returns: ack

  set_aux_level:
    summary: "Set the AUX/3 bus output level, -800 to 100 (-80.0 to 10.0 dB), or -801 for -INF (OL3)"
    params:
      level: { type: int, min: -801, max: 100, required: true, label: AUX level, description: "AUX/3 bus output level in tenths of a dB, -800 (-80.0 dB) to 100 (+10.0 dB), or -801 for -INF." }
    send: "OL3:{level}"
    expect: { contains: "\u0006" }
    returns: ack

  set_input_delay:
    summary: "Set an input audio delay; inputs 0-4; 0-120 (0.0-12.0 frames) (ADT)"
    params:
      input: { type: int, min: 0, max: 4, required: true, label: Audio input, description: "Analogue audio input: 0 AUDIO IN 1, 1 AUDIO IN 2, 2 AUDIO IN 3, 3 AUDIO IN 4, 4 AUDIO IN 5/6." }
      delay: { type: int, min: 0, max: 120, required: true, label: Delay, description: "Audio delay in tenths of a frame, 0 to 120 (0.0 to 12.0 frames)." }
    send: "ADT:{input},{delay}"
    expect: { contains: "\u0006" }
    returns: ack

  get_audio_level:
    summary: "Ask for a volume level: 0-10 inputs, 11 MASTER OUT, 12 PVW/2, 13 AUX/3, 14 all (QAL)"
    params:
      channel: { type: int, min: 0, max: 14, required: true, label: Channel, description: "0 to 10 the inputs as for the input level, 11 MASTER OUT, 12 PVW/2, 13 AUX/3, 14 all." }
    send: "QAL:{channel}"
    expect: { contains: "\u0006" }
    returns: ack

  set_audio_output_bus:
    summary: "Assign 0 AUDIO OUT XLR, 1 AUDIO OUT RCA or 2 PHONES to 0 PGM/1, 1 PVW/2 or 2 AUX/3 (AOS)"
    params:
      output: { type: int, min: 0, max: 2, required: true, label: Audio output, description: "0 AUDIO OUT XLR, 1 AUDIO OUT RCA, 2 PHONES." }
      bus: { type: int, min: 0, max: 2, required: true, label: Bus, description: "Bus the audio output carries: 0 PGM/1, 1 PVW/2, 2 AUX/3." }
    send: "AOS:{output},{bus}"
    expect: { contains: "\u0006" }
    returns: ack

  get_audio_output_bus:
    summary: "Ask for the bus of an audio output, 0-2 (QAS)"
    params:
      output: { type: int, min: 0, max: 2, required: true, label: Audio output, description: "0 AUDIO OUT XLR, 1 AUDIO OUT RCA, 2 PHONES." }
    send: "QAS:{output}"
    expect: { contains: "\u0006" }
    returns: ack

  set_input_mute:
    summary: "Set an input audio mute; inputs 0 AUDIO IN 1, 1 AUDIO IN 2, 2 AUDIO IN 3, 3 AUDIO IN 4, 4 AUDIO IN 5/6, 5-8 SDI IN 1-4, 9 HDMI IN 5, 10 HDMI IN 6 (IAM)"
    params:
      input: { type: int, min: 0, max: 10, required: true, label: Audio input, description: "Audio input: 0 AUDIO IN 1, 1 AUDIO IN 2, 2 AUDIO IN 3, 3 AUDIO IN 4, 4 AUDIO IN 5/6, 5-8 SDI IN 1-4, 9 HDMI IN 5, 10 HDMI IN 6." }
      enabled: { type: bool, required: true, label: Mute, description: "On mutes the input, off unmutes it." }
    send: "IAM:{input},{enabled:bool01}"
    expect: { contains: "\u0006" }
    returns: ack

  set_input_solo:
    summary: "Set an input audio solo; inputs 0 AUDIO IN 1, 1 AUDIO IN 2, 2 AUDIO IN 3, 3 AUDIO IN 4, 4 AUDIO IN 5/6, 5-8 SDI IN 1-4, 9 HDMI IN 5, 10 HDMI IN 6 (IAS)"
    params:
      input: { type: int, min: 0, max: 10, required: true, label: Audio input, description: "Audio input: 0 AUDIO IN 1, 1 AUDIO IN 2, 2 AUDIO IN 3, 3 AUDIO IN 4, 4 AUDIO IN 5/6, 5-8 SDI IN 1-4, 9 HDMI IN 5, 10 HDMI IN 6." }
      enabled: { type: bool, required: true, label: Solo, description: "On solos the input, off releases the solo." }
    send: "IAS:{input},{enabled:bool01}"
    expect: { contains: "\u0006" }
    returns: ack

  # ── System (p.29)
  set_hdcp:
    summary: "Set HDCP on or off (HCP)"
    params:
      enabled: { type: bool, required: true, label: HDCP, description: "On turns HDCP on, off turns it off." }
    send: "HCP:{enabled:bool01}"
    expect: { contains: "\u0006" }
    returns: ack

  set_test_pattern:
    summary: "Set the test pattern: 0 OFF, 1 75% COLOR BAR, 2 100% COLOR BAR, 3 RAMP, 4 STEP, 5 HATCH (TPT)"
    params:
      pattern: { type: int, min: 0, max: 5, required: true, label: Test pattern, description: "0 OFF, 1 75% COLOR BAR, 2 100% COLOR BAR, 3 RAMP, 4 STEP, 5 HATCH." }
    send: "TPT:{pattern}"
    expect: { contains: "\u0006" }
    returns: ack

  set_test_tone:
    summary: "Set the test tone: 0 OFF, 1-3 -20/-10/0 dB at 1 kHz, 4-6 -20/-10/0 dB at 400 Hz (TTN)"
    params:
      tone: { type: int, min: 0, max: 6, required: true, label: Test tone, description: "0 OFF, 1 to 3 at -20, -10 and 0 dB at 1 kHz, 4 to 6 at -20, -10 and 0 dB at 400 Hz." }
    send: "TTN:{tone}"
    expect: { contains: "\u0006" }
    returns: ack

  recall_memory:
    summary: "Call up preset memory 1-8 (MEM)"
    params:
      memory: { type: int, min: 1, max: 8, required: true, label: Memory, description: "Preset memory to call up, 1 to 8 as on the panel." }
    send: "MEM:{memory:-1}"
    expect: { contains: "\u0006" }
    returns: ack

  get_panel_status:
    summary: "Ask for panel status: 0 PGM/1, 1 PVW/2, 2 AUX/3, 3 PinP/SPLIT, 4 DSK, 5 FREEZE, 6 video fade level, 7 all (QPL)"
    params:
      item: { type: int, min: 0, max: 7, required: true, label: Item, description: "0 PGM/1, 1 PVW/2, 2 AUX/3, 3 PinP/SPLIT, 4 DSK, 5 FREEZE, 6 video fade level, 7 all." }
    send: "QPL:{item}"
    expect: { contains: "\u0006" }
    returns: ack

  pulse_gpo:
    summary: "Output GPO 1-4 when its GPO TYPE is ONE SHOT (GPO:a,1)"
    params:
      gpo: { type: int, min: 1, max: 4, required: true, label: GPO, description: "GPO 1 to 4; it must have GPO TYPE set to ONE SHOT." }
    send: "GPO:{gpo:-1},1"
    expect: { contains: "\u0006" }
    returns: ack

  set_gpo:
    summary: "Set GPO 1-4 on or off when its GPO TYPE is ALT (GPO:a,b)"
    params:
      gpo: { type: int, min: 1, max: 4, required: true, label: GPO, description: "GPO 1 to 4; it must have GPO TYPE set to ALT." }
      enabled: { type: bool, required: true, label: "On", description: "On turns the GPO on, off turns it off." }
    send: "GPO:{gpo:-1},{enabled:bool01}"
    expect: { contains: "\u0006" }
    returns: ack

  set_mode:
    summary: "Set the video transition mode: 0 PGM-PST, 1 DISSOLVE, 2 MATRIX (MOD)"
    params:
      mode: { type: int, min: 0, max: 2, required: true, label: Transition mode, description: "0 PGM-PST, 1 DISSOLVE, 2 MATRIX." }
    send: "MOD:{mode}"
    expect: { contains: "\u0006" }
    returns: ack

  camera_recall:
    summary: "Recall memory 1-8 on camera ID 0-6 (CAM)"
    params:
      camera: { type: int, min: 0, max: 6, required: true, label: Camera ID, description: "Camera ID 0 to 6 as set up in the switcher's camera control." }
      memory: { type: int, min: 1, max: 8, required: true, label: Camera memory, description: "Camera preset memory to recall, 1 to 8." }
    send: "CAM:{camera},{memory:-1}"
    expect: { contains: "\u0006" }
    returns: ack

  get_tally:
    summary: "Cross-point status of channels 1-8: 0 dark, 1 red, 2 green (TLY)"
    send: "TLY"
    expect: { contains: "\u0006" }
    returns: ack

  get_version:
    summary: "Version; the reply is followed by ACK (VER)"
    send: "VER"
    expect: { contains: "\u0006" }
    returns: ack

  active_sense:
    summary: "Check the switcher is responding (ACS)"
    send: "ACS"
    expect: { contains: "\u0006" }
    returns: ack

telemetry:
  # With RS-232 PNL INFO on (menu RS-232/GPIO, p.14) the mixer sends the QPL
  # all-items frame from the RS-232 and CONTROL (LAN) connectors whenever the
  # cross-point or other status changes. The status is also asked every
  # second, for installations that leave it off, with the tally and every
  # audio level (QAL:14). The settings the other queries read (scaler
  # resolution, channel 6 connector, video and audio output buses) are asked
  # on connecting and every ten seconds. Nothing else the commands set can
  # be read (see the quirks).
  subscribe:
    send: ["VER", "QVR", "QIP", "QVS:0", "QVS:1", "QVS:2", "QVS:3", "QVS:4", "QAS:0", "QAS:1", "QAS:2"]
    every_ms: 10000
  poll:
    send: ["QPL:7", "TLY", "QAL:14"]
    every_ms: 1000
  updates:
    - match: '^[\x02\x11\x13]*QPL:(\d+),(\d+),(\d+),(\d+),(\d+),(\d+),(\d+);'
      state:
        "program.xpt": "{1:+1}"
        "preview.xpt": "{2:+1}"
        "aux.xpt": "{3:+1}"
        "composition": "{4}"
        "dsk": { value: "{5}", map: { "1": true, "0": false } }
        "freeze": { value: "{6}", map: { "1": true, "0": false } }
        "fader.level": "{7}"
    - match: '^[\x02\x11\x13]*QVC:([0-2]),(\d+);'
      state: { "buses.{1:+1}.xpt": "{2:+1}" }
    - match: '^[\x02\x11\x13]*QVR:(\d+);'
      state: { "scaler.resolution": "{1}" }
    - match: '^[\x02\x11\x13]*QIP:(\d+);'
      state: { "ch6_input": "{1}" }
    - match: '^[\x02\x11\x13]*QVS:(\d+),(\d+);'
      state: { "video_outputs.{1}.bus": "{2}" }
    - match: '^[\x02\x11\x13]*QAS:(\d+),(\d+);'
      state: { "audio_outputs.{1}.bus": "{2}" }
    - match: '^[\x02\x11\x13]*TLY:([0-9, ]+);'
      state: { "tally": "{1}" }
    - match: '^[\x02\x11\x13]*QAL:(-?\d+(?:, ?-?\d+){13});'
      state: { "audio.levels": "{1}" }
    # QAL:14 in the parameter list's order (p.28): inputs 0-10, MASTER OUT, PVW/2, AUX/3.
    - match: '^[\x02\x11\x13]*QAL:(-?\d+), ?(-?\d+), ?(-?\d+), ?(-?\d+), ?(-?\d+), ?(-?\d+), ?(-?\d+), ?(-?\d+), ?(-?\d+), ?(-?\d+), ?(-?\d+), ?(-?\d+), ?(-?\d+), ?(-?\d+);'
      state:
        "audio.inputs.0.level": "{1}"
        "audio.inputs.1.level": "{2}"
        "audio.inputs.2.level": "{3}"
        "audio.inputs.3.level": "{4}"
        "audio.inputs.4.level": "{5}"
        "audio.inputs.5.level": "{6}"
        "audio.inputs.6.level": "{7}"
        "audio.inputs.7.level": "{8}"
        "audio.inputs.8.level": "{9}"
        "audio.inputs.9.level": "{10}"
        "audio.inputs.10.level": "{11}"
        "audio.master_level": "{12}"
        "audio.pvw_level": "{13}"
        "audio.aux_level": "{14}"
    - match: '^[\x02\x11\x13]*VER:([^,;]*),([^;]+);'
      state: { "device.model": "{1}", "device.version": "{2}" }

state:
  program.xpt:         { type: int, description: "PGM/1 channel, 1-8" }
  preview.xpt:         { type: int, description: "PVW/2 channel, 1-8" }
  aux.xpt:             { type: int, description: "AUX/3 channel, 1-8" }
  composition:         { type: int, description: "0 off, 1 [PinP], 2 [SPLIT]" }
  dsk:                 { type: bool, description: "[DSK] on" }
  freeze:              { type: bool, description: "[FREEZE] on" }
  fader.level:         { type: int, description: "Video fade level, 0-2047" }
  buses.*.xpt:         { type: int, description: "Channel 1-8 on a bus from QVC: bus 1 PGM/1, 2 PVW/2, 3 AUX/3" }
  scaler.resolution:   { type: int, description: "Scaler out resolution code, as set_scaler_resolution" }
  ch6_input:           { type: int, description: "Channel 6 input: 0 HDMI, 1 RGB/COMPONENT, 2 COMPOSITE" }
  video_outputs.*.bus: { type: int, description: "Bus of an output, keyed by wire index (0 SDI OUT 1, 1 SDI OUT 2, 2-4 HDMI OUT 1-3): 0 PGM, 1 PVW, 2 AUX, 3 MULTI-VIEW" }
  audio_outputs.*.bus: { type: int, description: "Bus of an audio output, keyed by wire index (0 XLR, 1 RCA, 2 PHONES): 0 PGM/1, 1 PVW/2, 2 AUX/3" }
  tally:               { type: string, description: "Cross-point status of channels 1-8, comma-separated: 0 dark, 1 red, 2 green" }
  audio.levels:        { type: string, unit: "0.1 dB", description: "Every volume level from QAL:14, comma-separated: inputs 0-10, MASTER OUT, PVW/2, AUX/3 (-801 is -INF)" }
  audio.inputs.*.level: { type: int, unit: "0.1 dB", description: "Input audio level from QAL, keyed by the input number the level commands take (0 AUDIO IN 1 to 10 HDMI IN 6); -801 is -INF" }
  audio.master_level:  { type: int, unit: "0.1 dB", description: "Master out level; -801 is -INF" }
  audio.pvw_level:     { type: int, unit: "0.1 dB", description: "PVW/2 bus output level; -801 is -INF" }
  audio.aux_level:     { type: int, unit: "0.1 dB", description: "AUX/3 bus output level; -801 is -INF" }
  device.model:        { type: string, description: "Model field of VER (printed empty in the manual)" }
  device.version:      { type: string, description: "Version from VER" }

quirks:
  - models: [all]
    severity: warning
    text: >
      Wait for ACK after each command before sending the next (p.27); the
      queue does this. ACK is the single byte 06H with no line ending and data
      replies end in ";" with no line ending. A query's data frame comes
      before its ACK, so queries return ack and their values are in state.
      QPL and QAL for one item answer a bare value that does not say which
      item it is, so only the all-items forms (QPL:7, QAL:14) reach state.

  - models: [all]
    severity: warning
    text: >
      What works depends on the operation mode (set_mode, p.30): in DISSOLVE
      mode PST, CUT and TAK answer ERR:4; in MATRIX mode CUT, TAK, PPS, SPS,
      DSK and DVW answer ERR:4 and switching is by fade to black.

  - models: [all]
    severity: info
    text: >
      Wire numbers are 0-based; cross-points, memories and GPOs here are
      converted. ERR:0 syntax error, ERR:4 invalid, ERR:5 out of range. The
      manual leaves some forms open: VOS takes only the bus (0 PGM, 1 PVW,
      2 AUX) and names no output connector, although QVS asks per connector;
      IL2 is printed "stxIL2:a;" while listing both a and b, and is sent here
      with both, as IL1; TRS lists 0 and 1 both as MIX; VER is printed
      "stxVER:,a;" with an empty model field. No password protects the LAN
      port.

  - models: [all]
    severity: info
    text: >
      API limits: the queries are QPL (panel status), QVC (bus channels), QVR
      (scaler resolution), QIP (channel 6 connector), QVS (video output
      buses), QAL (audio levels), QAS (audio output buses), TLY and VER
      (p.27-29); state keeps all of them. QAL documents one level per input,
      without saying whether it is the PGM/1 (IL1) or PVW/2 (IL2) bus level.
      Nothing reads back the transition effect and time, PinP and SPLIT
      PVW/PGM state (QPL gives only which is on), the DSK preview, AUTO
      MIXING, the EDIDs, input and scaler scaling, the HDMI color space and
      signal, the PinP and split positions, the DSK source, level and gain,
      the audio delays, the input mutes and solos, HDCP, the test pattern
      and tone, the memory last recalled, the GPOs or the operation mode.
