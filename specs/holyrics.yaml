       action_previous_quick_presentation, close_current_quick_presentation,
       get_current_quick_presentation, get_triggers, get_trigger_tags,
       get_trigger_pause_state_for_tag, set_trigger_pause_state_for_tag,
       get_trigger_pause_state_for_receiver, set_trigger_pause_state_for_receiver,
       get_scheduled_tasks, get_global_settings, set_global_settings, get_styled_models,
       get_styled_models_as_map, get_midi_settings, get_rule_group_list, get_rule_group,
       test_rule_group, get_transition_effect_template_settings_list,
       get_transition_effect_template_settings, set_transition_effect_template_settings,
       create_item, edit_item, delete_item, add_songs_to_song_group, remove_songs_from_song_group,
       set_current_schedule, disable_hue]
    verification: none

commands:
  get_token_info:
