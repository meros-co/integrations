       get_bible_responsive_reading_settings_preset,
       apply_bible_responsive_reading_settings_preset, get_bible_versions, get_bible_versions_v2,
       get_bible_settings, set_bible_settings, get_available_bible_books, get_bible_books,
       identify_verse_references, parse_verse_id2_verse_reference,
       parse_verse_id2_verse_reference_group, get_presentation_footer_settings,
       set_presentation_footer_settings, get_bpm, set_bpm, get_hue, set_hue,
       get_runtime_environment, set_runtime_environment, set_logo, get_sync_status,
