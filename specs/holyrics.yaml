telemetry:
  # Holyrics pushes nothing to an API client: what changes live is polled
  # every second, the rest every five, the program's facts once.
  poll:
    - every_ms: 1000
      send:
        - { method: POST, path: /api/GetCurrentPresentation, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetMediaPlayerInfo, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetCommunicationPanelInfo, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetF8, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetF9, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetF10, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
    - every_ms: 5000
      send:
        - { method: POST, path: /api/GetAlert, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetAutomaticPresentationPlayerInfo, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetCurrentQuickPresentation, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetBpm, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetHue, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetRuntimeEnvironment, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetSyncStatus, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetLyricsPlaylist, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetMediaPlaylist, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
    - send:
        - { method: POST, path: /api/GetVersion, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetTokenInfo, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetAPIServerInfo, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
        - { method: POST, path: /api/GetHolyricsPlanInfo, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }
  updates:
    - path: "^/api/GetCurrentPresentation(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: {"id": "$.data.id", "type": "$.data.type", "name": "$.data.name", "slide_number": "$.data.slide_number", "total_slides": "$.data.total_slides", "slide_type": "$.data.slide_type"}
      replace: presentation
      state:
        presentation.id: "{id}"
        presentation.type: "{type}"
        presentation.name: "{name}"
        presentation.slide_number: "{slide_number}"
        presentation.total_slides: "{total_slides}"
        presentation.slide_type: "{slide_type}"
    - path: "^/api/GetMediaPlayerInfo(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: {"name": "$.data.name", "path": "$.data.path", "relative_path": "$.data.relative_path", "playing": "$.data.playing", "duration_ms": "$.data.duration_ms", "time_ms": "$.data.time_ms", "time_elapsed": "$.data.time_elapsed", "time_remaining": "$.data.time_remaining", "volume": "$.data.volume", "mute": "$.data.mute", "repeat": "$.data.repeat", "execute_single": "$.data.execute_single", "shuffle": "$.data.shuffle", "fullscreen": "$.data.fullscreen"}
      state:
        media_player.name: "{name}"
        media_player.path: "{path}"
        media_player.relative_path: "{relative_path}"
        media_player.playing: "{playing}"
        media_player.duration_ms: "{duration_ms}"
        media_player.time_ms: "{time_ms}"
        media_player.time_elapsed: "{time_elapsed}"
        media_player.time_remaining: "{time_remaining}"
        media_player.volume: "{volume}"
        media_player.mute: "{mute}"
        media_player.repeat: "{repeat}"
        media_player.execute_single: "{execute_single}"
        media_player.shuffle: "{shuffle}"
        media_player.fullscreen: "{fullscreen}"
    - path: "^/api/GetAutomaticPresentationPlayerInfo(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: {"name": "$.data.name", "playing": "$.data.playing", "time_ms": "$.data.time_ms", "volume": "$.data.volume", "mute": "$.data.mute", "duration_ms": "$.data.duration_ms"}
      state:
        automatic_presentation_player.name: "{name}"
        automatic_presentation_player.playing: "{playing}"
        automatic_presentation_player.time_ms: "{time_ms}"
        automatic_presentation_player.volume: "{volume}"
        automatic_presentation_player.mute: "{mute}"
        automatic_presentation_player.duration_ms: "{duration_ms}"
    - path: "^/api/GetCommunicationPanelInfo(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: {"text": "$.data.text", "show": "$.data.show", "display_ahead": "$.data.display_ahead", "alert_text": "$.data.alert_text", "alert_show": "$.data.alert_show", "countdown_show": "$.data.countdown_show", "countdown_time": "$.data.countdown_time", "stopwatch_show": "$.data.stopwatch_show", "stopwatch_time": "$.data.stopwatch_time", "theme": "$.data.theme", "countdown_font_relative_size": "$.data.countdown_font_relative_size", "countdown_font_color": "$.data.countdown_font_color", "stopwatch_font_color": "$.data.stopwatch_font_color", "time_font_color": "$.data.time_font_color", "display_clock_as_background": "$.data.display_clock_as_background", "display_clock_on_alert": "$.data.display_clock_on_alert", "countdown_display_location": "$.data.countdown_display_location", "display_clock_with_countdown_fullscreen": "$.data.display_clock_with_countdown_fullscreen", "display_vlc_player_remaining_time": "$.data.display_vlc_player_remaining_time", "attention_icon_color": "$.data.attention_icon_color", "attention_background_color": "$.data.attention_background_color", "countdown_hide_zero_minute": "$.data.countdown_hide_zero_minute", "countdown_hide_zero_hour": "$.data.countdown_hide_zero_hour", "stopwatch_hide_zero_minute": "$.data.stopwatch_hide_zero_minute", "stopwatch_hide_zero_hour": "$.data.stopwatch_hide_zero_hour"}
      state:
        communication_panel.text: "{text}"
        communication_panel.show: "{show}"
        communication_panel.display_ahead: "{display_ahead}"
        communication_panel.alert_text: "{alert_text}"
        communication_panel.alert_show: "{alert_show}"
        communication_panel.countdown_show: "{countdown_show}"
        communication_panel.countdown_time: "{countdown_time}"
        communication_panel.stopwatch_show: "{stopwatch_show}"
        communication_panel.stopwatch_time: "{stopwatch_time}"
