spec: 1
id: holyrics
name: Holyrics (API Server)
vendor: Holyrics
category: playback

# Holyrics' API Server over the local network: POST /api/<Action>?token=<token>
# with a JSON body (Content-Type application/json), every reply
# {"status": "ok", "data": ...} or {"status": "error", "error": ...}. Tokens and
# their permissions are made in File > Settings > API Server > manage
# permissions. Every documented action is a command: those whose parameters
# are all required scalars take them typed, the others take the request object
# as the API documents it. State follows the live actions, polled.

source:
  - title: Holyrics API-Server documentation (README-en.md)
    author: Holyrics
    url: https://github.com/holyrics/API-Server/blob/main/README-en.md
    note: >
      Manufacturer documentation (repository without a licence: facts only,
      nothing quoted), retrieved 2026-10-23. The local request form POST
      http://[IP]:[PORT]/api/{action}?token=..., the hash method (Auth nonce,
      sid, rid, sha256 dtoken), the internet relay (api.holyrics.com.br with
      api_key and token headers), the reply envelope and its errors, and
      every action of "Available actions" with its parameters, response
      fields and version (v2.19.0 to v2.29.0); GetAPIServerInfo's example
      port 8091.

transport:
  type: http
  port: 8091
  scheme: http
  auth: none
  refusal_status: [401]
  refusal_status_body: { json: { "$.error": "(?i)^invalid token$" } }
  timeout_ms: 5000
  probe: { method: POST, path: /api/GetTokenInfo, query: { token: "{settings.token}" }, content_type: application/json, body: '{}' }

settings:
  token: { type: string, secret: true, required: true, label: Token, description: "An API Server token made in Holyrics (File > Settings > API Server > manage permissions); it allows only the actions its permissions list." }

ports:
  - { port: 8091, protocol: http, role: control, note: "Holyrics' API Server (File > Settings > API Server); 8091 as the documentation's example gives it" }

models:
  - id: holyrics
    name: Holyrics 2.19 and later, API Server
    supports:
      [get_token_info, check_permissions, get_lyrics, get_songs, search_lyrics, show_lyrics,
       get_text, get_texts, search_text, show_text, show_verse, get_audios, get_videos, get_images,
       get_files, get_audio, get_video, get_image, get_file, get_file_tags,
       set_audio_item_property, set_video_item_property, set_image_item_property,
       set_file_item_property, play_audio, play_video, show_image, execute_file, audio_exists,
       video_exists, image_exists, file_exists, show_announcement, get_custom_messages,
       show_custom_message, show_custom_message_standalone, get_custom_message_display_info,
       show_quick_presentation, show_countdown, get_quiz_list, show_quiz, quiz_action,
       get_automatic_presentations, get_automatic_presentation, play_automatic_presentation,
       get_automatic_presentation_player_info, automatic_presentation_player_action,
       get_media_player_info, media_player_action, get_lyrics_playlist, add_lyrics_to_playlist,
       remove_from_lyrics_playlist, set_lyrics_playlist_item, get_media_playlist,
       set_media_playlist_item, media_playlist_action, get_next_song_playlist,
       get_next_media_playlist, show_next_song_playlist, show_next_media_playlist,
       get_previous_song_playlist, get_previous_media_playlist, show_previous_song_playlist,
       show_previous_media_playlist, add_to_playlist, remove_from_media_playlist,
       set_playlist_item_duration, set_playlist_item_midi_time_code, get_slide_descriptions,
       get_favorites, favorite_action, get_apis, get_scripts, api_action, script_action,
       api_request, module_action, run_actions, get_current_presentation,
       close_current_presentation, get_f8, get_f9, get_f10, set_f8, set_f9, set_f10, toggle_f8,
       toggle_f9, toggle_f10, action_next, action_previous, action_go_to_index,
       action_go_to_slide_description, get_current_background, get_current_theme, get_themes,
       get_backgrounds, get_background_tags, set_current_background, get_thumbnail, get_color_map,
       get_alert, set_alert, get_current_schedule, get_schedules, get_saved_playlists,
       load_saved_playlist, get_history, get_histories, get_nearest_history, get_song_group,
       get_song_groups, get_teams, get_members, get_roles, get_services, get_events,
       get_announcement, get_announcements, get_modules, get_communication_panel_info,
       set_communication_panel_settings, start_countdown_communication_panel,
       stop_countdown_communication_panel, start_timer_communication_panel,
       stop_timer_communication_panel, set_text_communication_panel, set_alert_communication_panel,
       communication_panel_call_attention, get_wallpaper_settings, set_wallpaper_settings,
       get_display_settings, set_display_settings, get_display_settings_presets,
       get_ndi_settings_list, get_ndi_settings, set_ndi_settings, get_transition_effect_settings,
       set_transition_effect_settings, get_translation_preset_list, get_translation_preset,
       apply_translation_preset, get_logo_settings_preset_list, get_logo_settings_preset,
