        program.language: "{language}"
        program.platform_language: "{platform_language}"
        program.theme: "{theme}"
        program.jsc_version: "{jsc_version}"
    - path: "^/api/GetTokenInfo(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: {"version": "$.data.version", "permissions": "$.data.permissions"}
      state:
        token.version: "{version}"
        token.permissions: "{permissions}"
    - path: "^/api/GetAPIServerInfo(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: {"enabled_local": "$.data.enabled_local", "enabled_web": "$.data.enabled_web", "port": "$.data.port"}
      state:
        api_server.enabled_local: "{enabled_local}"
        api_server.enabled_web: "{enabled_web}"
        api_server.port: "{port}"
    - path: "^/api/GetHolyricsPlanInfo(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: {"type": "$.data.type", "name": "$.data.name"}
      state:
        plan.type: "{type}"
        plan.name: "{name}"
    - path: "^/api/GetF8(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: { state: "$.data" }
      state: { screen.f8: "{state}" }
    - path: "^/api/GetF9(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: { state: "$.data" }
      state: { screen.f9: "{state}" }
    - path: "^/api/GetF10(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: { state: "$.data" }
      state: { screen.f10: "{state}" }
    - path: "^/api/GetBpm(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { bpm: "{v}" }
    - path: "^/api/GetHue(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      replace: hue
      state: { hue: "{v}" }
    - path: "^/api/GetRuntimeEnvironment(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json: { v: "$.data" }
      state: { runtime_environment: "{v}" }
    - path: "^/api/GetLyricsPlaylist(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", title: "$.title", artist: "$.artist" }
      replace: song_playlist
      state:
        "song_playlist.{index}.id": "{id}"
        "song_playlist.{index}.title": "{title}"
        "song_playlist.{index}.artist": "{artist}"
    - path: "^/api/GetMediaPlaylist(\\?|$)"
      json_match: { "$.status": "^ok$" }
      json_each: "$.data"
      json: { id: "$.id", type: "$.type", name: "$.name" }
      replace: media_playlist
      state:
        "media_playlist.{index}.id": "{id}"
        "media_playlist.{index}.type": "{type}"
        "media_playlist.{index}.name": "{name}"

quirks:
  - models: [all]
    severity: warning
    text: >
      The token goes in the URL of every request (?token=), as the
      documentation's first method gives it, over plain HTTP on the local
      network. The documentation's hash method (a nonce from Auth, then a
      sha256 dtoken per request with a growing request id) is not used, nor
      the internet relay (api.holyrics.com.br with an API key). A token
      allows only the actions its permissions list: the others answer with
      status error, and a poll of one it lacks fills no state.
  - models: [all]
    severity: info
    text: >
      Actions whose parameters are all required and scalar take typed
      parameters; the others, with optional fields or objects (themes,
      settings, items), take the request object itself, which Holyrics
      validates, since an optional field cannot be left out of a template.
      Synonym actions (GetSong for GetLyrics, GetCPInfo for
      GetCommunicationPanelInfo, GetAP for GetAutomaticPresentation and the
      others) are sent under the first name.
  - models: [all]
    severity: info
    text: >
      Holyrics pushes nothing over this API: the current presentation, media
      player, communication panel and F8, F9 and F10 are polled every second;
      the alert, automatic presentation player, quick presentation, BPM, hue,
      runtime environment, sync and both playlists every five; the version,
      token, API Server and plan once. A presentation or quick presentation
      that closes empties its state. Only the response fields the
      documentation gives in its tables are kept in state; everything else
      is in each command's returned data.
  - models: [all]
    severity: info
    text: >
      The documentation gives no default port; 8091 is the port in its
      GetAPIServerInfo example. Thumbnails and slide previews come back as
      base64 text in the data, as Holyrics sends them.
  - models: [all]
    severity: critical
    text: >
      Show, play and close actions, the F8, F9 and F10 screens, the
      communication panel, alerts and settings changes act on the projection
      at once; delete_item deletes an item, and set_global_settings,
      set_display_settings and the other settings actions change the
      program's configuration.
