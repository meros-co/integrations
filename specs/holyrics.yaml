      actions: {"type": "string", "required": true, "label": "Actions", "description": "List of required actions for the token, separated by commas."}
    send: { method: POST, path: /api/CheckPermissions, query: { token: "{settings.token}" }, content_type: application/json, body: '{"actions":{actions:json}}' }
