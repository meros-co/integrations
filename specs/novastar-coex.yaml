  inputs.*.edid_height: { type: int, unit: px, description: "EDID resolution, height" }
  inputs.*.edid_refresh_rate: { type: float, unit: Hz, description: "EDID frame rate" }
  inputs.*.edid_custom: { type: bool, description: "The EDID is custom rather than one from the supported list" }
  input_config.*.hue: { type: int, description: "Input hue, keyed by the source's logic ID (set_input_hue writes it)" }
