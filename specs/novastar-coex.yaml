  input_config.*.saturation: { type: int, description: "Input saturation (set_input_saturation writes it)" }
  input_config.*.limit_to_full: { type: bool, description: "Limited-to-full conversion on" }
  input_config.*.range: { type: int, description: "Quantisation range override: 0 limited, 1 full, 255 auto (set_input_range writes it)" }
  input_config.*.color_space: { type: int, description: "Colour space override (set_input_color_space writes it)" }
  input_config.*.color_gamut: { type: int, description: "Colour gamut override (set_input_gamut writes it)" }
  input_config.*.hdr_mode: { type: int, description: "HDR mode override: 0 HDR10, 1 HLG, 2 SDR, 255 auto (set_hdr_mode writes it)" }
  input_config.*.real_hdr_mode: { type: string, description: "HDR mode in effect: the input's own when the override is auto" }
  test_pattern.mode: { type: int, description: "Sending card test pattern: 0 solid colour, 16-21 stripes and grids, 32-39 gradients, 48 lightning" }
  test_pattern.on: { type: bool, description: "Internal source test pattern shown" }
  test_pattern.red: { type: int, description: "Test pattern red level" }
  test_pattern.green: { type: int, description: "Test pattern green level" }
  test_pattern.blue: { type: int, description: "Test pattern blue level" }
  test_pattern.gray: { type: int, description: "Test pattern grey level" }
  test_pattern.grid_width: { type: int, description: "Test pattern stripe or grid width" }
  test_pattern.move_speed: { type: int, description: "Test pattern movement speed" }
