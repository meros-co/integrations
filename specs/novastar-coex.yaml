spec: 1
id: novastar-coex
name: NovaStar COEX controllers (OpenAPI)
vendor: NovaStar
category: display

# COEX controllers (MX, KU and CX series) answer an HTTP JSON API on port
# 8001. Reads are GET, writes PUT or POST with a JSON body, and every answer is
# {"code": <error code>, "data": ..., "message": ...}, code 0 meaning success.
# Most writes name what they act on: screens by screenID (a string from
# get_screens), canvases by canvasID, cabinets by cabinet ID (from
# get_cabinets), inputs by source ID and source group ID (from
# get_input_sources). Commands taking one screen send it as a one-element
# screenIdList; lists of cabinet or canvas IDs are JSON arrays. The commands
# marked "2023 manual" use the earlier API generation, whose paths later
# firmware replaced.

source:
  - title: COEX OpenAPI documentation (English), "COEX" project on Apifox
    author: NovaStar (Xi'an NovaStar Tech Co.)
    url: https://api.coex.novastar.tech/en/doc-7530630
    note: >
      Manufacturer documentation, read 2026-10-03 through its Markdown export
      (llms.txt and each page's .md, which embed an OpenAPI 3.0 description of
      the endpoint). Used for every endpoint's method, path, request body
      fields, types, ranges and enumerations, and the response data of the
      reads: General API, Input (internal sources, colour adjustment, EDID,
      HDR mode), Screen (image, colour gamut, schedule, colour correction,
      layer, 3D LUT, canvas, preset, output, 3D, multi-mode), Device (audio,
      identify, backup, time, name, SNMP, multifunction card, monitoring) and
      Cabinet pages, the API instructions (release the device from VMP
      first) and the error code table. Cited as OpenAPI.
  - title: COEX Series Interface API User Manual (COEX-Series-Interface-API-User-Manual.pdf, 2023)
    author: NovaStar
    url: https://oss.novastar.tech/uploads/2023/02/COEX-Series-Interface-API-User-Manual.pdf
    note: >
      Manufacturer document for the CX80 Pro, CX40 Pro, MX40 Pro and KU20. Used
      for HTTP on port 8001 (1.4), the {code, data, message} answer (1.5.2),
      the error codes (1.5.1), and the earlier endpoints kept here as legacy_
      commands and as the InfoFrame override, cabinet gamma and gamut, project
      file and working mode commands. Cited as 2023 manual.
  - title: companion-module-novastar-coex and novastar-coex (MIT)
    author: Bitfocus contributors; Atomic
    url: https://github.com/bitfocus/companion-module-novastar-coex
    note: >
      MIT licences (top-level LICENSE of each; the module uses
      https://github.com/atomicinfotech/novastar-coex). Read, not copied, as
      corroboration: port 8001 and the 2023-manual paths, and the known issues
      in its HELP.md (input selection only in send-only mode; a controller held
      by COEX VMP answers other clients with "device locked").

transport:
  type: http
  port: 8001
  scheme: http
  auth: none
  timeout_ms: 5000
  probe: { method: GET, path: /api/v1/device/hw }

ports:
  - { port: 8001, protocol: http, role: control }

