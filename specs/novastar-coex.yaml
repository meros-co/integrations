      blue: { type: int, min: 0, max: 4095, default: 4095,
        label: Blue,
        description: "Blue level of the pattern, 0 to 4095." }
      gray: { type: int, min: 0, max: 4095, default: 4095,
        label: Grey,
        description: "Grey level of the pattern, 0 to 4095." }
      grid_width: { type: int, min: 1, max: 255, default: 1,
        label: Grid width,
        description: "Width of the pattern's stripes or grid lines, 1 to 255." }
      move_speed: { type: int, min: 0, max: 100, default: 50,
        label: Move speed,
        description: "Speed at which the pattern moves, 0 (still) to 100." }
      gradient_stretch: { type: int, min: 1, max: 20, default: 8,
        label: Gradient stretch,
        description: "Stretch of the gradient patterns, 1 to 20." }
    send: { method: PUT, path: "/api/v1/device/screen/controller/pattern/test", body: '{"mode":{mode},"parameters":{"red":{red},"green":{green},"blue":{blue},"gray":{gray},"gridWidth":{grid_width},"moveSpeed":{move_speed},"gradientStretch":{gradient_stretch},"state":0}}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack

  legacy_set_output_bit_depth:
    summary: "Output bit depth: 0 8-bit, 1 10-bit, 2 12-bit, 255 automatic (2023 manual, earlier firmware)"
    params:
      bit_depth: { type: enum, values: ["0", "1", "2", "255"], required: true,
        label: Bit depth,
        description: "0 8-bit, 1 10-bit, 2 12-bit, 255 automatic." }
    send: { method: PUT, path: "/api/v1/device/screen/video/bitdepth", body: '{"bitDepth":{bit_depth}}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack

telemetry:
  # The controller does not push. Display parameters, display state, cabinet
  # counts, controller information, monitoring (without cabinets) and audio
  # are read every 10 seconds.
  poll:
    send:
      - { method: GET, path: /api/v1/screen/displayparams }
      - { method: GET, path: /api/v1/screen/output/display/state }
      - { method: GET, path: /api/v1/screen/cabinet/count }
      - { method: GET, path: /api/v1/device/hw }
      - { method: GET, path: /api/v1/device/monitor/info, raw_query: "isNeedCabinetInfo=1" }
    every_ms: 10000
  updates:
    - path: "^/api/v1/screen/displayparams$"
      json_each: "$.data.list"
      json: { id: "$.screenId", brightness: "$.brightness", kelvin: "$.colorTemperature", gamma: "$.gamma" }
      state:
        "screens.{id}.brightness": "{brightness}"
        "screens.{id}.color_temperature": "{kelvin}"
        "screens.{id}.gamma": "{gamma}"
    - path: "^/api/v1/screen/cabinet/count$"
      json_each: "$.data.list"
      json: { id: "$.screenId", count: "$.cabinetCount" }
      state:
        "screens.{id}.cabinet_count": "{count}"
    # Every canvas's display and mapping state: each successful read replaces
    # the canvases, so a canvas removed from the screen configuration leaves.
    - path: "^/api/v1/screen/output/display/state$"
      json_match: { "$.code": "^0$" }
      replace: canvases
      json_each: "$.data.displayState"
      json: { id: "$.canvasID", mode: "$.displayMode" }
      state:
        "canvases.{id}.display_mode": "{mode}"
    - path: "^/api/v1/screen/output/display/state$"
      json_each: "$.data.mappingState"
      json: { id: "$.canvasID", enable: "$.enable" }
      state:
        "canvases.{id}.mapping": "{enable}"
    - path: "^/api/v1/device/hw$"
      json:
        name: "$.data.name"
        custom_name: "$.data.customName"
        model: "$.data.modelID"
        sn: "$.data.sn"
        mac: "$.data.mac"
        ip: "$.data.ip"
        hw: "$.data.hwVersion"
        sw: "$.data.swVersion"
        mode: "$.data.mode"
      state:
        device.name: "{name}"
        device.custom_name: "{custom_name}"
        device.model_id: "{model}"
        device.serial: "{sn}"
        device.mac: "{mac}"
        device.ip: "{ip}"
        device.firmware_version: "{hw}"
        device.software_version: "{sw}"
        device.working_mode: "{mode}"
    - path: "^/api/v1/device/monitor/info"
      json:
        runtime: "$.data.runtime"
        backup: "$.data.backupStatus"
        temp: "$.data.mainBoardTemperature.value"
        temp_status: "$.data.mainBoardTemperature.status"
        volt: "$.data.mainBoardVoltage.value"
        volt_status: "$.data.mainBoardVoltage.status"
      state:
        device.runtime: "{runtime}"
        device.backup_status: "{backup}"
        device.mainboard_temperature: "{temp}"
        device.mainboard_temperature_status: "{temp_status}"
        device.mainboard_voltage: "{volt}"
        device.mainboard_voltage_status: "{volt_status}"
    - path: "^/api/v1/device/audio$"
      json: { enable: "$.data.enable", source: "$.data.source" }
      state:
        audio.enabled: "{enable}"
        audio.source: "{source}"

state:
  screens.*.brightness: { type: float, description: "Screen brightness, 0 to 1, keyed by screen ID" }
  screens.*.color_temperature: { type: int, unit: K, description: "Screen colour temperature" }
  screens.*.gamma: { type: float, description: "Screen gamma" }
  screens.*.cabinet_count: { type: int, description: "Online cabinets on the screen" }
  canvases.*.display_mode: { type: int, description: "Canvas display mode as the controller reports it, keyed by canvas ID (the read documents 0 normal, 1 frozen, 2 blackout; the writes use 1 blackout, 2 freeze)" }
  canvases.*.mapping: { type: bool, description: "Mapping overlay shown on the canvas" }
  device.name: { type: string, description: "Controller name" }
  device.custom_name: { type: string, description: "Controller custom name" }
  device.model_id: { type: int, description: "Controller model ID" }
  device.serial: { type: string, description: "Controller serial number" }
  device.mac: { type: string, description: "Controller MAC address" }
  device.ip: { type: string, description: "Controller IP address" }
  device.firmware_version: { type: string, description: "Firmware version" }
  device.software_version: { type: string, description: "Software version" }
  device.working_mode: { type: int, description: "Working mode: 1 fibre converter, 2 sending card (send-only), 3 all-in-one" }
  device.runtime: { type: int, unit: s, description: "Controller uptime" }
  device.backup_status: { type: int, description: "Backup status: 109 primary in use and backup standby, 110 both in use, 111 primary in use and backup failed, 112 primary failed and backup standby, 113 primary failed and backup in use, 114 and up further failure states" }
  device.mainboard_temperature: { type: float, unit: degC, description: "Main board temperature" }
  device.mainboard_temperature_status: { type: int, description: "Main board temperature status: 0 normal, 1 alarm, 2 fault" }
  device.mainboard_voltage: { type: float, unit: V, description: "Main board voltage" }
  device.mainboard_voltage_status: { type: int, description: "Main board voltage status: 0 normal, 1 alarm, 2 fault" }
  audio.enabled: { type: bool, description: "SPDIF audio output on" }
  audio.source: { type: int, description: "Audio source group ID" }

quirks:
  - models: [all]
    severity: warning
    text: >
      A controller held by NovaStar's COEX VMP software accepts API requests
      only from that computer; release it in VMP (click a blank space in the
      device tree) before using the API. Others are answered "device locked"
      (OpenAPI instructions; Companion module HELP.md).

  - models: [all]
    severity: info
    text: >
      Failures arrive as HTTP 200 with a non-zero code (1 invalid parameters, 5
      device busy, 6 not supported, 27-35 function restrictions, ...), so every
      command requires $.code 0. The documents give no answer body for a 4xx.

  - models: [all]
    severity: info
    text: >
      Screen IDs are strings the controller makes; read them with get_screens
      (screenID). Canvas, cabinet and input IDs come from get_screens,
      get_cabinets and get_input_sources. The layer IDs for switch_layer_source
      depend on the working mode (get_screens workingMode). Input selection on
      layers is documented for all-in-one mode; legacy_select_input for
      send-only mode.

  - models: [all]
    severity: warning
    text: >
      The OpenAPI pages give some paths without the /api/v1 prefix (internal
      source, colour correction, 3D emitter, sync source, controller identify,
      controller name, no-signal image, thermal compensation amount); the
      prefix is used here, as on every other endpoint.

  - models: [all]
    severity: warning
    text: >
      The display state read documents displayMode 1 as frozen and 2 as
      blackout, the reverse of the writes (1 blackout, 2 freeze); the state
      keeps the number as the controller reports it.

  - models: [all]
    severity: critical
    text: >
      recall_preset and legacy_recall_preset apply a preset to the live screen
      at once; there is no undo. set_display_mode, set_display_mode_all,
      set_canvas_display_mode and legacy_set_display_mode black out or freeze
      the live output. switch_layer_source and the test pattern commands change
      what is on screen.

  - models: [all]
    severity: critical
    text: >
      import_project replaces the controller's whole configuration;
      set_working_mode switches between send-only and all-in-one, which
      changes the layer structure. Setting all-in-one (3) through the API is
      reported not to work (Companion module HELP.md).

  - models: [all]
    severity: info
    text: >
      Not included: 3D LUT import (multipart/form-data upload) and log export
      (a file download). set_custom_gamma, set_custom_gamut, the colour
      correction data commands and move_cabinets take the documented request
      body as JSON.

  - models: [all]
    severity: info
    text: >
      The OpenAPI pages show a Device-Key header holding the controller's
      ip:port in every example, with no description; it is not sent. Audio and
      RGBW brightness components need firmware 1.5.0 or later.
