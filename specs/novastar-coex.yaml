commands:
  get_screens:
    summary: "Every screen with its ID, working mode, canvases, cabinets, cabinet groups and layers (GET /api/v1/screen)"
    send: { method: GET, path: "/api/v1/screen" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_screens_brief:
    summary: "As get_screens, without cabinet and cabinet group data (isNeedCabinetInfo=1)"
    send: { method: GET, path: "/api/v1/screen", raw_query: "isNeedCabinetInfo=1" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_screen_properties:
    summary: "Screen properties: whether calibrated, image booster and multi-mode information (modeId)"
    send: { method: GET, path: "/api/v1/screen/base/info" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_cabinet_count:
    summary: "Online cabinets per screen"
    send: { method: GET, path: "/api/v1/screen/cabinet/count" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_display_params:
    summary: "Each screen's brightness, colour temperature and gamma"
    send: { method: GET, path: "/api/v1/screen/displayparams" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_display_state:
    summary: "Each canvas's blackout/freeze state and mapping state"
    send: { method: GET, path: "/api/v1/screen/output/display/state" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_output:
    summary: "Screen output data: 3D, frame multiplication, sync, gamut list and more"
    send: { method: GET, path: "/api/v1/screen/output" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_schedules:
    summary: "Every screen's schedules: brightness, preset and power strategies"
    send: { method: GET, path: "/api/v1/screen/schedule/all" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_presets:
    summary: "Presets per screen: sequenceNumber, name, whether applied, and what they hold"
    send: { method: GET, path: "/api/v1/preset" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_input_sources:
    summary: "Input sources: id, groupId, connector type, resolution, frame rate, EDID, HDR"
    send: { method: GET, path: "/api/v1/device/input/sources" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_inputs:
    summary: "Input configuration, including internal sources and EDID"
    send: { method: GET, path: "/api/v1/device/input" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_device_info:
    summary: "Controller information: name, model, serial, MAC, IP, versions, working mode, capabilities"
    send: { method: GET, path: "/api/v1/device/hw" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_monitoring:
    summary: "Controller monitoring: uptime, backup status, temperatures, voltages, fans, ports, cards (without cabinets)"
    send: { method: GET, path: "/api/v1/device/monitor/info", raw_query: "isNeedCabinetInfo=1" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_monitoring_full:
    summary: "As get_monitoring, with every cabinet and receiving card"
    send: { method: GET, path: "/api/v1/device/monitor/info", raw_query: "isNeedCabinetInfo=0" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_cabinets:
    summary: "Every cabinet with its ID (the idList value of the cabinet commands)"
    send: { method: GET, path: "/api/v1/device/cabinet" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_audio:
    summary: "Audio output setting: on and the source group (firmware 1.5.0 and later)"
    send: { method: GET, path: "/api/v1/device/audio" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_backup_status:
    summary: "Primary and backup controller MAC addresses and names"
    send: { method: GET, path: "/api/v1/device/backup" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  get_snmp:
    summary: "Whether SNMP is on"
    send: { method: GET, path: "/api/v1/device/snmpstate" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data.state" }
    returns: value

  get_multifunction_cards:
    summary: "Multifunction cards: power channels, light and environment sensors"
    send: { method: GET, path: "/api/v1/device/multifunc-card/detailinfo" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  export_project:
    summary: "Export the controller's project file, base64 (2023 manual 5.1.1)"
    send: { method: GET, path: "/api/v1/device/hw/deviceengineeringdocdata" }
    expect: { status: 200, json_equals: { "$.code": 0 }, json_path: "$.data" }
    returns: value

  set_brightness:
    summary: "Set a screen's brightness, 0 to 1 (all its cabinets)"
    params:
      screen: { type: string, pattern: "^[A-Za-z0-9{}_.:-]{1,64}$", required: true,
        label: Screen ID,
        description: "The screen's ID, a string the controller makes, as get_screens returns it (screenID)." }
      brightness: { type: float, min: 0, max: 1, required: true,
        label: Brightness,
        description: "Screen brightness from 0 (off) to 1 (full), for all its cabinets." }
    send: { method: PUT, path: "/api/v1/screen/brightness", body: '{"screenIdList":[{screen:json}],"brightness":{brightness:.4f}}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack

  set_gamma:
    summary: "Set a screen's gamma, 1 to 4"
    params:
      screen: { type: string, pattern: "^[A-Za-z0-9{}_.:-]{1,64}$", required: true,
        label: Screen ID,
        description: "The screen's ID, a string the controller makes, as get_screens returns it (screenID)." }
      gamma: { type: float, min: 1, max: 4, required: true,
        label: Gamma,
        description: "Gamma from 1 to 4." }
    send: { method: PUT, path: "/api/v1/screen/gamma", body: '{"screenIdList":[{screen:json}],"gamma":{gamma:.2f}}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack

  set_color_temperature:
    summary: "Set a screen's colour temperature, 1700 to 15000 K"
    params:
      screen: { type: string, pattern: "^[A-Za-z0-9{}_.:-]{1,64}$", required: true,
        label: Screen ID,
        description: "The screen's ID, a string the controller makes, as get_screens returns it (screenID)." }
      kelvin: { type: int, min: 1700, max: 15000, required: true,
        label: Colour temperature,
        description: "Colour temperature in kelvin, 1700 to 15000." }
    send: { method: PUT, path: "/api/v1/screen/colortemperature", body: '{"screenIdList":[{screen:json}],"colorTemperature":{kelvin}}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack

  set_display_mode:
    summary: "Set a screen's display: 0 normal, 1 blackout, 2 freeze"
    params:
      screen: { type: string, pattern: "^[A-Za-z0-9{}_.:-]{1,64}$", required: true,
        label: Screen ID,
        description: "The screen's ID, a string the controller makes, as get_screens returns it (screenID)." }
      mode: { type: int, min: 0, max: 2, required: true,
        label: Display mode,
        description: "0 normal, 1 blackout, 2 freeze." }
    send: { method: PUT, path: "/api/v1/screen/output/displaymode", body: '{"value":{mode},"screenIdList":[{screen:json}]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack

  set_display_mode_all:
    summary: "Set every screen's display: 0 normal, 1 blackout, 2 freeze (an empty screen list)"
    params:
      mode: { type: int, min: 0, max: 2, required: true,
        label: Display mode,
        description: "0 normal, 1 blackout, 2 freeze, for every screen." }
    send: { method: PUT, path: "/api/v1/screen/output/displaymode", body: '{"value":{mode},"screenIdList":[]}', content_type: application/json }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack

  set_canvas_display_mode:
    summary: "Set canvases' display by canvas ID: 0 normal, 1 blackout, 2 freeze; canvases is a JSON array of canvas IDs"
    params:
      canvases: { type: json, required: true,
        label: Canvas IDs,
