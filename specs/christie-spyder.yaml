    summary: "Flush configuration and user data to non-volatile storage (SAV)"
    send: "spyder\0\0\0\0SAV"
    expect: { matches: "^0( |$)" }
    returns: ack

  restart_server:
    summary: "Restart the Spyder server application (SDN 1)"
    send: "spyder\0\0\0\0SDN 1"
    expect: { matches: "^0( |$)" }
    returns: ack

  power_off:
    summary: "Power the Spyder server off (SDN 0)"
    send: "spyder\0\0\0\0SDN 0"
    expect: { matches: "^0( |$)" }
    returns: ack

  get_layer_count:
    summary: "Logical layer count, including the two background layers (RLC)"
    send: "spyder\0\0\0\0RLC"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_source_names:
    summary: "Source names, space separated, spaces inside a name as %20 (RSN)"
    send: "spyder\0\0\0\0RSN"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_basic_presets:
    summary: "Basic presets: count, then ID and name pairs (RBL)"
    send: "spyder\0\0\0\0RBL"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_register_count:
    summary: "Number of registers of a type (RRC)"
    params:
      type: { type: int, min: 0, max: 10, required: true, label: Register type, description: "0 effect, 1 playitem, 4 command key, 5 treatment, 6 source, 7 function key, 10 still." }
    send: "spyder\0\0\0\0RRC {type}"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_registers:
    summary: "Registers of a type on every page: count, then ID and name pairs (RRL ... -1)"
    params:
      type: { type: int, min: 0, max: 10, required: true, label: Register type, description: "0 effect, 1 playitem, 4 command key, 5 treatment, 6 source, 7 function key, 10 still." }
    send: "spyder\0\0\0\0RRL {type} -1"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_script_cue:
    summary: "Current cue of a script by script ID, -1 when not running (SCR ... S)"
    params:
      script: { type: int, min: 0, required: true, label: Script, description: "Script ID of the command key; unlike a register ID it does not change when the list is reordered." }
    send: "spyder\0\0\0\0SCR {script} S"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_register_cue:
    summary: "Current cue of the script in a register, -1 when not running (SCR ... R)"
    params:
      register: { type: int, min: 0, required: true, label: Register, description: "Register ID; registers on page n are n*1000 + register, so register 2 on page 3 is 3002." }
    send: "spyder\0\0\0\0SCR {register} R"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_layer_keyframe:
    summary: "A layer's keyframe values: position, size, border, shadow, clone, crop, aspect, zoom, pan, PixelSpace, transparency (RLK)"
    params:
      layer: { type: int, min: 2, required: true, label: Layer, description: "Layer ID, from 2; 0 and 1 are the backgrounds." }
    send: "spyder\0\0\0\0RLK {layer}"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_layer_source:
    summary: "A layer's source name and source register ID (RLS)"
    params:
      layer: { type: int, min: 2, required: true, label: Layer, description: "Layer ID, from 2; 0 and 1 are the backgrounds." }
    send: "spyder\0\0\0\0RLS {layer}"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_connection_status:
    summary: "A layer's input connector type and connection status: 0 disconnected, 1 connected, 2 unknown (RCS; at most once a second)"
    params:
      layer: { type: int, min: 2, required: true, label: Layer, description: "Layer ID, from 2; 0 and 1 are the backgrounds." }
    send: "spyder\0\0\0\0RCS {layer}"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_pixelspaces:
    summary: "PixelSpace definitions: ID, name, backgrounds, position, size, renewal group (RPD)"
    send: "spyder\0\0\0\0RPD"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_io_status:
    summary: "I/O processor progress (0-100) and task, for still loads (RPS)"
    send: "spyder\0\0\0\0RPS"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_aspect_ratio:
    summary: "A source's aspect ratio, by source name or layer ID (RAR)"
    params:
      source: { type: string, pattern: "^[A-Za-z0-9_.%-]{1,128}$", required: true, label: Source, description: "Source name, or a layer ID." }
    send: "spyder\0\0\0\0RAR {source}"
    expect: { matches: "^0 (.*)$" }
    returns: value

state:
  layer_count: { type: int, description: "Logical layers, including the two background layers (RLC)" }
  layers.*.source: { type: string, description: "Name of the source on the layer, keyed by layer ID from 2 (RLS); absent when the layer has none" }
  layers.*.source_register: { type: int, description: "Register ID of the layer's source, 1 when no register holds it (RLS)" }
  layers.*.aspect_ratio: { type: float, description: "Aspect ratio of the layer's source, width divided by height (RAR)" }
  layers.*.connector: { type: string, description: "Connector the layer's input uses: hd15, dvi, sdi, composite or svideo (RCS)" }
  layers.*.connection: { type: string, description: "Whether a signal is connected to the layer's input: connected, disconnected or unknown (RCS)" }
  layers.*.h_position_relative: { type: float, description: "Keyframe horizontal position, relative (RLK)" }
  layers.*.v_position_relative: { type: float, description: "Keyframe vertical position, relative (RLK)" }
  layers.*.x: { type: float, unit: px, description: "Keyframe horizontal position (RLK)" }
  layers.*.y: { type: float, unit: px, description: "Keyframe vertical position (RLK)" }
  layers.*.width: { type: float, unit: px, description: "Keyframe width (RLK)" }
  layers.*.height: { type: float, unit: px, description: "Keyframe height (RLK)" }
  layers.*.border.thickness: { type: float, description: "Border thickness, -255 to 255, negative for outside softness (RLK)" }
  layers.*.border.red: { type: float, description: "Border colour red, 0-255 (RLK)" }
  layers.*.border.green: { type: float, description: "Border colour green, 0-255 (RLK)" }
  layers.*.border.blue: { type: float, description: "Border colour blue, 0-255 (RLK)" }
  layers.*.border.h_bevel: { type: float, description: "Border horizontal bevel offset (RLK)" }
  layers.*.border.v_bevel: { type: float, description: "Border vertical bevel offset (RLK)" }
  layers.*.border.inside_softness: { type: float, description: "Border inside softness (RLK)" }
  layers.*.border.outside_softness: { type: float, description: "Border outside softness (RLK)" }
  layers.*.border.outside_edges: { type: string, description: "Edges with outside softness, as Spyder's hexadecimal flags: 1 top, 2 bottom, 4 left, 8 right (RLK)" }
  layers.*.shadow.h_offset: { type: float, description: "Shadow horizontal offset, 0-255 (RLK)" }
  layers.*.shadow.v_offset: { type: float, description: "Shadow vertical offset, 0-255 (RLK)" }
  layers.*.shadow.size: { type: float, description: "Shadow size, 0-255 (RLK)" }
  layers.*.shadow.softness: { type: float, description: "Shadow softness, 0-255 (RLK)" }
  layers.*.shadow.transparency: { type: float, description: "Shadow transparency, 0-255 (RLK)" }
  layers.*.clone.mode: { type: string, description: "Clone mode: off, offset or mirror (RLK)" }
  layers.*.clone.offset: { type: float, description: "Clone offset (RLK)" }
  layers.*.crop.left: { type: float, description: "Left crop, 0.0 (none) to 1.0 (RLK)" }
  layers.*.crop.right: { type: float, description: "Right crop, 0.0 to 1.0 (RLK)" }
  layers.*.crop.top: { type: float, description: "Top crop, 0.0 to 1.0 (RLK)" }
  layers.*.crop.bottom: { type: float, description: "Bottom crop, 0.0 to 1.0 (RLK)" }
  layers.*.crop.anchor: { type: string, description: "Crop anchor: input_center or window_center (RLK)" }
  layers.*.aspect_offset: { type: float, description: "Keyframe aspect ratio offset (RLK)" }
  layers.*.zoom: { type: float, description: "Zoom, 0 to 20 (RLK)" }
  layers.*.h_pan: { type: float, description: "Horizontal pan, -2048 to 2048 (RLK)" }
  layers.*.v_pan: { type: float, description: "Vertical pan, -2048 to 2048 (RLK)" }
  layers.*.pixelspace: { type: int, description: "PixelSpace the layer is assigned to (RLK)" }
  layers.*.transparency: { type: float, description: "Keyframe transparency (RLK)" }
  pixelspace_count: { type: int, description: "Number of PixelSpaces defined (RPD)" }
  pixelspaces.*.name: { type: string, description: "PixelSpace name, keyed by PixelSpace ID (RPD)" }
  pixelspaces.*.current_background: { type: string, description: "Still shown as the current background (RPD)" }
  pixelspaces.*.next_background: { type: string, description: "Still loaded as the next background (RPD)" }
  pixelspaces.*.x: { type: float, unit: px, description: "PixelSpace horizontal position (RPD)" }
  pixelspaces.*.y: { type: float, unit: px, description: "PixelSpace vertical position (RPD)" }
  pixelspaces.*.width: { type: float, unit: px, description: "PixelSpace width (RPD)" }
  pixelspaces.*.height: { type: float, unit: px, description: "PixelSpace height (RPD)" }
  pixelspaces.*.renewal_group: { type: int, description: "PixelSpace renewal group ID (RPD)" }
  basic_preset_count: { type: int, description: "Number of basic presets (RBL)" }
  basic_presets.*.name: { type: string, description: "Basic preset name, keyed by preset ID (RBL)" }
  registers.*.count: { type: int, description: "Registers of a type on every page, keyed by register type: 0 effect, 1 playitem, 4 command key, 5 treatment, 6 source, 7 function key, 10 still (RRL)" }
  registers.*.*.name: { type: string, description: "Register name, keyed by register type and register ID (page * 1000 + register) (RRL)" }
  registers.*.*.cue: { type: int, description: "Command keys (type 4) only: the cue the register's script is at, -1 when it is not running (SCR)" }
  source_names.*: { type: string, description: "Source names as Spyder lists them, keyed by place from 0 (RSN)" }
  io.progress: { type: int, description: "I/O processor progress, 0-100, 101 when ready (RPS)" }
  io.status: { type: string, description: "I/O processor task, such as a still being loaded; empty or Ready when idle (RPS)" }
  routers.*.outputs.*.input: { type: int, description: "Input routed to a router output, both numbered from 0 as Spyder numbers them, keyed by router ID and output; -1 when none (QRC)" }

telemetry:
  # Spyder never pushes, and its answers do not say what they answer: each
  # is read with the query it answers (request_match, header included). The
  # layers are walked: each RLK answer asks for the next layer, until a
  # layer that does not exist answers an error; RCS walks the same way on
  # its own, once a poll. Writes ask for the state they change again.
  poll:
    send:
      - "spyder\0\0\0\0RLC"
      - "spyder\0\0\0\0RLK 2"
      - "spyder\0\0\0\0RCS 2"
      - "spyder\0\0\0\0RBL"
      - "spyder\0\0\0\0RRL 0 -1"
      - "spyder\0\0\0\0RRL 1 -1"
      - "spyder\0\0\0\0RRL 4 -1"
      - "spyder\0\0\0\0RRL 5 -1"
      - "spyder\0\0\0\0RRL 6 -1"
      - "spyder\0\0\0\0RRL 7 -1"
      - "spyder\0\0\0\0RRL 10 -1"
      - "spyder\0\0\0\0RPD"
      - "spyder\0\0\0\0RSN"
      - "spyder\0\0\0\0RPS"
      - "spyder\0\0\0\0QRC 0"
      - "spyder\0\0\0\0QRC 1"
      - "spyder\0\0\0\0QRC 2"
      - "spyder\0\0\0\0QRC 3"
    every_ms: 10000
  updates:
    - match: "^0 (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) ([0-9A-Fa-fx]+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+)(?: |$)"
      request_match: '^spyder\x00{4}RLK (\d+)$'
      state:
        "layers.{34}.h_position_relative": "{1}"
        "layers.{34}.v_position_relative": "{2}"
        "layers.{34}.x": "{3}"
        "layers.{34}.y": "{4}"
        "layers.{34}.width": "{5}"
        "layers.{34}.height": "{6}"
        "layers.{34}.border.thickness": "{7}"
        "layers.{34}.border.red": "{8}"
        "layers.{34}.border.green": "{9}"
        "layers.{34}.border.blue": "{10}"
        "layers.{34}.border.h_bevel": "{11}"
        "layers.{34}.border.v_bevel": "{12}"
        "layers.{34}.border.inside_softness": "{13}"
        "layers.{34}.border.outside_softness": "{14}"
        "layers.{34}.border.outside_edges": "{15}"
        "layers.{34}.shadow.h_offset": "{16}"
        "layers.{34}.shadow.v_offset": "{17}"
        "layers.{34}.shadow.size": "{18}"
        "layers.{34}.shadow.softness": "{19}"
        "layers.{34}.shadow.transparency": "{20}"
        "layers.{34}.clone.mode": { value: "{21}", map: { "0": "off", "1": "offset", "2": "mirror" } }
        "layers.{34}.clone.offset": "{22}"
        "layers.{34}.crop.left": "{23}"
        "layers.{34}.crop.right": "{24}"
        "layers.{34}.crop.top": "{25}"
        "layers.{34}.crop.bottom": "{26}"
        "layers.{34}.crop.anchor": { value: "{27}", map: { "0": "input_center", "1": "window_center" } }
        "layers.{34}.aspect_offset": "{28}"
        "layers.{34}.zoom": "{29}"
        "layers.{34}.h_pan": "{30}"
        "layers.{34}.v_pan": "{31}"
        "layers.{34}.pixelspace": "{32}"
        "layers.{34}.transparency": "{33}"
      then_send:
        - "spyder\0\0\0\0RLK {34:+1}"
        - "spyder\0\0\0\0RLS {34}"
        - "spyder\0\0\0\0RAR {34}"
    - match: "^0 (\\S+) (-?\\d+)$"
      request_match: '^spyder\x00{4}RLS (\d+)$'
      state:
        "layers.{3}.source": "{1:url_decode}"
        "layers.{3}.source_register": "{2}"
    # An empty layer answers the Empty code alone (X80 TR p.33).
    - match: "^1$"
      request_match: '^spyder\x00{4}RLS (\d+)$'
      state:
        "layers.{1}.source": { delete: true }
        "layers.{1}.source_register": { delete: true }
    - match: "^0 (\\S+)$"
      request_match: '^spyder\x00{4}RAR (\d+)$'
      state: { "layers.{2}.aspect_ratio": "{1}" }
    - match: "^0 (\\d+) ([0-4]) ([0-2])$"
      request_match: '^spyder\x00{4}RCS \d+$'
      state:
        "layers.{1}.connector": { value: "{2}", map: { "0": "hd15", "1": "dvi", "2": "sdi", "3": "composite", "4": "svideo" } }
        "layers.{1}.connection": { value: "{3}", map: { "0": "disconnected", "1": "connected", "2": "unknown" } }
      then_send: ["spyder\0\0\0\0RCS {1:+1}"]
    - match: "^0 (\\d+)$"
      request_match: '^spyder\x00{4}RLC$'
      state: { layer_count: "{1}" }
    - match: "^0 (\\d+)(?: |$)"
      request_match: '^spyder\x00{4}RBL$'
      state: { basic_preset_count: "{1}" }
    - match: "^0 \\d+(?: |$)"
      request_match: '^spyder\x00{4}RBL$'
      match_each: '(\d+) (\S+)'
      replace: basic_presets
      state: { "basic_presets.{1}.name": "{2:url_decode}" }
    - match: "^0 (\\d+)(?: |$)"
      request_match: '^spyder\x00{4}RRL (\d+) -1$'
      state: { "registers.{2}.count": "{1}" }
    - match: "^0 \\d+(?: |$)"
      request_match: '^spyder\x00{4}RRL (\d+) -1$'
      match_each: '(\d+) (\S+)'
      replace: "registers.{1}"
      state: { "registers.{1}.{2}.name": "{3:url_decode}" }
    # Each command key's script cue.
    - match: "^0 \\d+(?: |$)"
      request_match: '^spyder\x00{4}RRL 4 -1$'
      match_each: '(\d+) \S+'
      then_send: ["spyder\0\0\0\0SCR {1} R"]
    - match: "^0 (-?\\d+)$"
      request_match: '^spyder\x00{4}SCR (\d+) R$'
      state: { "registers.4.{2}.cue": "{1}" }
    - match: "^0 (\\d+)(?: |$)"
      request_match: '^spyder\x00{4}RPD$'
      state: { pixelspace_count: "{1}" }
    - match: "^0 \\d+(?: |$)"
      request_match: '^spyder\x00{4}RPD$'
      match_each: '(\d+) (\S+) (\S+) (\S+) (\S+) (\S+) (\S+) (\S+) (\d+)'
      replace: pixelspaces
      state:
        "pixelspaces.{1}.name": "{2:url_decode}"
        "pixelspaces.{1}.current_background": "{3:url_decode}"
        "pixelspaces.{1}.next_background": "{4:url_decode}"
        "pixelspaces.{1}.x": "{5}"
        "pixelspaces.{1}.y": "{6}"
        "pixelspaces.{1}.width": "{7}"
        "pixelspaces.{1}.height": "{8}"
        "pixelspaces.{1}.renewal_group": "{9}"
    - match: "^0(?: |$)"
      request_match: '^spyder\x00{4}RSN$'
      match_each: '(\S+)'
      replace: source_names
      state: { "source_names.{index}": "{1:url_decode}" }
    - match: "^0 (\\d+) ?(.*)$"
      request_match: '^spyder\x00{4}RPS$'
      state:
        io.progress: "{1}"
        io.status: "{2:url_decode}"
    - match: "^0 (\\d+)(?: |$)"
      request_match: '^spyder\x00{4}QRC \d+(?: \d+)?$'
      match_each: '(\d+):(-?\d+)'
      state: { "routers.{1}.outputs.{2}.input": "{3}" }
    # Writes that change layers walk the layers again.
    - match: "^0( |$)"
      request_match: '^spyder\x00{4}(?:BPR|RSC|FKR|ARL|TRN|SRA|LAP|KSZ|KPS|LSP|CRP|ARO|KBD|KSH|ZPA|LCC|LAC|KTR|ICR|SLD|SCL|DMB|DMT) '
      then_send: ["spyder\0\0\0\0RLK 2"]
    - match: "^0( |$)"
      request_match: '^spyder\x00{4}(?:RSC|FKR|ARL|LCK|DCK) '
      then_send: ["spyder\0\0\0\0RRL 4 -1"]
    - match: "^0( |$)"
      request_match: '^spyder\x00{4}BPL '
      then_send: ["spyder\0\0\0\0RBL"]
    - match: "^0( |$)"
      request_match: '^spyder\x00{4}KTL '
      then_send: ["spyder\0\0\0\0RRL 5 -1"]
    - match: "^0( |$)"
      request_match: '^spyder\x00{4}(?:BLD|BTR)'
      then_send: ["spyder\0\0\0\0RPD"]
    - match: "^0( |$)"
      request_match: '^spyder\x00{4}(?:BLD|SLD|LSO) '
      then_send: ["spyder\0\0\0\0RPS"]
    - match: "^0( |$)"
      request_match: '^spyder\x00{4}RCR (\d+) '
      then_send: ["spyder\0\0\0\0QRC {2}"]

quirks:
  - models: [all]
    severity: info
    text: >
      Spyder does not push and its answers do not name the command they answer,
      so state is read by polling every 10 seconds and each answer is read with
      the query it answers. The layers are walked from layer 2, each existing
      layer's keyframe, source and aspect ratio read in turn, and its input's
      connection status in a second walk; the walk ends at the first layer that
      answers an error. Writes ask again for what they change: layer commands,
      recalls and transitions walk the layers again, learns re-read their
      lists, and a router switch re-reads that router. The query commands
      (get_*, router_query) still return the raw answer after the result code.

  - models: [all]
    severity: info
    text: >
      The external control protocol has no query for a layer's freeze, input
      levels, luminance or colour key, input raster, visibility on its
      PixelSpace, or for an output's format, mode, rotation, blend or freeze,
      for mixer device buses, or for stored treatments and input
      configurations; what freeze_layers, input_levels, luminance_key,
      color_key, input_raster, transition_layers, the output_* commands,
      freeze_outputs and device_mixer_bus set cannot be read back. Routers are
      not listed either: routers 0 to 3 are polled, and a router a command
      switches is read again.

  - models: [all]
    severity: info
    text: >
      Result codes other than 0 fail the command (1 empty, 2 unknown command,
      3 too few arguments, 4 bad argument value, 5 execution error, see the
      alert log). A query for data that does not exist, such as the source of
      an empty layer, answers 1.

  - models: [all]
    severity: info
    text: >
      Names (sources, stills, command keys) are sent URL-encoded, so a space is
      %20 as the manuals require; other characters outside letters, digits and
      -._~ are percent-encoded too, which Spyder is assumed to decode.

  - models: [all]
    severity: critical
    text: >
      recall_basic_preset, recall_script_cue, recall_register_cue,
      function_key_recall, transition_layers, source_apply, device_mixer_bus,
      device_mixer_transition and background_transition change what is on
      screen at once. Script cues and command keys can change every layer.

  - models: [all]
    severity: critical
    text: >
      restart_server and power_off take every output down; power_off cannot be
      undone over the network.

  - models: [all]
    severity: warning
    text: >
      learn_basic_preset, treatment_learn, input_config_learn and
      learn_command_key overwrite whatever is stored under that ID, and
      delete_command_key deletes; output_format, output_mode_*,
      output_rotation and output_blend change an output's signal, and are lost
      at restart unless output_save is sent.

  - models: [all]
    severity: info
    text: >
      Registers on pages above the first are addressed as page * 1000 +
      register (register 2 on page 3 is 3002). A register ID changes when the
      operator reorders the list; a script ID does not.

  - models: [all]
    severity: warning
    text: >
      get_connection_status makes the frame probe the input; calling it more
      than once a second can degrade the system. Output freeze works on
      universal outputs only, not DX4.

  - models: [all]
    severity: info
    text: >
      UDP gives no delivery guarantee; a lost command or answer ends in a
      timeout, and the command may or may not have run.
