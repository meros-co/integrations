spec: 1
id: christie-spyder
name: Christie Spyder X20 / X80 (external control protocol)
vendor: Christie
category: switcher

# Spyder takes three-letter ASCII commands, arguments separated by single
# spaces, in a UDP datagram to port 11116, each preceded by the 10-byte header
# "spyder" and four 0x00 bytes (sent here as part of every template). Every
# command is answered with a datagram whose first argument is a result code:
# 0 success, 1 empty, 2 unknown command, 3 too few arguments, 4 bad argument,
# 5 execution error. Query results follow the code, space separated, with
# spaces inside values as %20. Optional trailing arguments are separate
# commands. Layer IDs start at 2 (0 and 1 are the backgrounds); a layer list
# can name a control device's bus instead, as <DVCE2:PGM>.

source:
  - title: Spyder X20 User Manual, 020-000916-01 Rev. 1 (04-2016), "External Control Protocol"
    author: Christie Digital Systems
    url: https://www.christiedigital.com/globalassets/020-000916-01-lit-man--usr-spyder-x20.pdf
    note: >
      Manufacturer document, pages 111-128: serial and Ethernet connectivity
      (UDP 11116, the 10-byte header, no space after it), the command table,
      result codes, every command's arguments and ranges, layer alignment
      effects, device substitution (<DVCEn:PGM|PVW>), registers (page n adds
      n*1000) and register types. Cited as X20 UM.
  - title: Spyder Serial Commands Technical Reference, 020-102207-01 Rev. 1 (10-2017)
    author: Christie Digital Systems
    url: https://qed-productions.com/downloads/christie/Christie-Spyder-X80-Serial-Command.pdf
    note: >
      Manufacturer document for Spyder X80 with Spyder Studio, read from a
      dealer's copy (also on ManualsLib as the Spyder X80 Technical Reference,
      https://www.manualslib.com/manual/2088615/Christie-Spyder-X80.html).
      Same transport, header and result codes as the X20 manual, and the same
      commands; ILA takes an optional gamma (0.0-3.0). Cited as X80 TR.
  - title: companion-module-christie-spyder (Bitfocus Companion module, MIT)
    author: Bitfocus contributors
    url: https://github.com/bitfocus/companion-module-christie-spyder
    note: >
      MIT licence (top-level LICENSE). Read, not copied, as corroboration: it
      sends "spyder" plus four NUL bytes and the command in one UDP datagram
      to port 11116, matches each answer to the oldest request in flight,
      reads the result code from the first character, and decodes names with
      URL decoding.

transport:
  type: line-udp
  port: 11116
  terminator: none
  reply: to-source
  timeout_ms: 2000
  probe: "spyder\0\0\0\0RLC"

ports:
  - { port: 11116, protocol: udp, role: control }

models:
  - id: x20
    name: Christie Spyder X20
    supports: [recall_basic_preset, recall_basic_preset_duration, learn_basic_preset, learn_basic_preset_duration, recall_script_cue, recall_register_cue, function_key_recall, function_key_recall_layers, function_key_recall_register, learn_command_key, delete_command_key, delete_command_key_register, apply_register, transition_layers, freeze_layers, source_apply, layer_assign_pixelspace, layer_size, layer_position, layer_size_position, layer_crop, layer_aspect_ratio, layer_border, layer_border_full, layer_shadow, layer_zoom_pan, layer_clone, layer_clone_offset, layer_alignment, treatment_recall, treatment_learn, input_levels, luminance_key, color_key, input_config_recall, input_auto_sync, input_config_learn, input_raster, input_auto_raster, still_load_layers, still_clear_layers, background_load, background_transition, background_transition_duration, still_load_output, still_load_output_channel, still_clear_output, still_clear_output_channel, device_mixer_transition, device_mixer_bus, freeze_outputs, output_format, output_format_timing, output_mode_normal, output_mode_normal_start, output_mode_opmon, output_mode_scaled, output_rotation, output_blend, output_blend_enabled, output_save, router_switch, router_switch_physical, router_query, router_query_output, save, restart_server, power_off, get_layer_count, get_source_names, get_basic_presets, get_register_count, get_registers, get_script_cue, get_register_cue, get_layer_keyframe, get_layer_source, get_connection_status, get_pixelspaces, get_io_status, get_aspect_ratio]
    verification: none
    notes: >
      Vista Advanced or Vista Basic; external control as in the X20 user manual.
  - id: x80
    name: Christie Spyder X80
    supports: [recall_basic_preset, recall_basic_preset_duration, learn_basic_preset, learn_basic_preset_duration, recall_script_cue, recall_register_cue, function_key_recall, function_key_recall_layers, function_key_recall_register, learn_command_key, delete_command_key, delete_command_key_register, apply_register, transition_layers, freeze_layers, source_apply, layer_assign_pixelspace, layer_size, layer_position, layer_size_position, layer_crop, layer_aspect_ratio, layer_border, layer_border_full, layer_shadow, layer_zoom_pan, layer_clone, layer_clone_offset, layer_alignment, treatment_recall, treatment_learn, input_levels, input_levels_gamma, luminance_key, color_key, input_config_recall, input_auto_sync, input_config_learn, input_raster, input_auto_raster, still_load_layers, still_clear_layers, background_load, background_transition, background_transition_duration, still_load_output, still_load_output_channel, still_clear_output, still_clear_output_channel, device_mixer_transition, device_mixer_bus, freeze_outputs, output_format, output_format_timing, output_mode_normal, output_mode_normal_start, output_mode_opmon, output_mode_scaled, output_rotation, output_blend, output_blend_enabled, output_save, router_switch, router_switch_physical, router_query, router_query_output, save, restart_server, power_off, get_layer_count, get_source_names, get_basic_presets, get_register_count, get_registers, get_script_cue, get_register_cue, get_layer_keyframe, get_layer_source, get_connection_status, get_pixelspaces, get_io_status, get_aspect_ratio]
    verification: none
    notes: >
      Spyder Studio; external control as in the X80 serial commands reference.

commands:
  recall_basic_preset:
    summary: "Recall a basic preset at its default 60-frame duration (BPR)"
    params:
      preset: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0BPR {preset}"
    expect: { matches: "^0( |$)" }
    returns: ack

  recall_basic_preset_duration:
    summary: "Recall a basic preset over this duration in frames (BPR)"
    params:
      preset: { type: int, min: 0, required: true }
      duration: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0BPR {preset} {duration}"
    expect: { matches: "^0( |$)" }
    returns: ack

  learn_basic_preset:
    summary: "Store the current screen layout as this basic preset (BPL)"
    params:
      preset: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0BPL {preset}"
    expect: { matches: "^0( |$)" }
    returns: ack

  learn_basic_preset_duration:
    summary: "Store the current layout as this basic preset with a recall duration in frames (BPL)"
    params:
      preset: { type: int, min: 0, required: true }
      duration: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0BPL {preset} {duration}"
    expect: { matches: "^0( |$)" }
    returns: ack

  recall_script_cue:
    summary: "Recall a script (command key) at a cue, by script ID (RSC)"
    params:
      script: { type: int, min: 0, required: true }
      cue: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0RSC {script} {cue} S"
    expect: { matches: "^0( |$)" }
    returns: ack

  recall_register_cue:
    summary: "Recall the command key in a register at a cue; registers on page n are n*1000 + register (RSC ... R)"
    params:
      register: { type: int, min: 0, required: true }
      cue: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0RSC {register} {cue} R"
    expect: { matches: "^0( |$)" }
    returns: ack

  function_key_recall:
    summary: "Recall a function key by its ID (FKR)"
    params:
      key: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0FKR {key}"
    expect: { matches: "^0( |$)" }
    returns: ack

  function_key_recall_layers:
    summary: "Recall a relative function key onto these layers (FKR)"
    params:
      key: { type: int, min: 0, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0FKR {key} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  function_key_recall_register:
    summary: "Recall the function key in a register (FKR ... R)"
    params:
      register: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0FKR {register} R"
    expect: { matches: "^0( |$)" }
    returns: ack

  learn_command_key:
    summary: "Learn a command key from the current layers into a register (LCK); answers the command key and script IDs"
    params:
      relative: { type: bool, default: false }
      name: { type: string, max_length: 128, required: true }
      register: { type: int, min: 0, required: true }
      learn_from: { type: int, min: 1, max: 3, default: 3 }
      as_mixers: { type: bool, default: false }
    send: "spyder\0\0\0\0LCK {relative:bool01} {name:url} {register} {learn_from} {as_mixers:bool01}"
    expect: { matches: "^0 (.*)$" }
    returns: value

  delete_command_key:
    summary: "Delete a command key by script ID (DCK)"
    params:
      script: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0DCK {script} S"
    expect: { matches: "^0( |$)" }
    returns: ack

  delete_command_key_register:
    summary: "Delete the command key in a register (DCK ... R)"
    params:
      register: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0DCK {register} R"
    expect: { matches: "^0( |$)" }
    returns: ack

  apply_register:
    summary: "Apply a register to layers: type 0 effect, 1 playitem, 4 command key, 5 treatment, 6 source, 7 function key, 10 still (ARL)"
    params:
      type: { type: int, min: 0, max: 10, required: true }
      register: { type: int, min: 0, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0ARL {type} {register} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  transition_layers:
    summary: "Mix layers on (true) or off their PixelSpace over a duration in frames (TRN)"
    params:
      mix_on: { type: bool, default: true }
      duration: { type: int, min: 0, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0TRN {mix_on:bool01} {duration} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  freeze_layers:
    summary: "Freeze or unfreeze layers (FRZ)"
    params:
      frozen: { type: bool, default: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0FRZ {frozen:bool01} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  source_apply:
    summary: "Apply a source (input configuration plus router input) to layers by name (SRA)"
    params:
      source: { type: string, max_length: 128, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0SRA {source:url} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_assign_pixelspace:
    summary: "Assign layers to a PixelSpace, optionally making them visible (LAP)"
    params:
      pixelspace: { type: int, min: 0, required: true }
      visible: { type: bool, default: false }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0LAP {pixelspace} {visible:bool01} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_size:
    summary: "Set layers' horizontal size in pixels; height follows the aspect ratio (KSZ)"
    params:
      width: { type: int, min: 1, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0KSZ {width} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_position:
    summary: "Set layers' position in pixels, absolute or relative (KPS)"
    params:
      relative: { type: bool, default: false }
      x: { type: int, required: true }
      y: { type: int, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0KPS {relative:bool01} {x} {y} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_size_position:
    summary: "Set layers' position and horizontal size together (LSP)"
    params:
      relative: { type: bool, default: false }
      x: { type: int, required: true }
      y: { type: int, required: true }
      width: { type: int, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0LSP {relative:bool01} {x} {y} {width} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_crop:
    summary: "Crop layers' left, right, top and bottom, each 0.0 to 1.0 (CRP)"
    params:
      left: { type: float, min: 0, max: 1, required: true }
      right: { type: float, min: 0, max: 1, required: true }
      top: { type: float, min: 0, max: 1, required: true }
      bottom: { type: float, min: 0, max: 1, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0CRP {left:.3f} {right:.3f} {top:.3f} {bottom:.3f} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_aspect_ratio:
    summary: "Aspect ratio: t sets the total, o sets the keyframe offset, a adjusts the offset (ARO)"
    params:
      type: { type: enum, values: [t, o, a], required: true }
      ratio: { type: float, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0ARO {type} {ratio:.3f} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_border:
    summary: "Set a layer's border thickness, -255 to 255, negative for outside softness (KBD)"
    params:
      layer: { type: int, min: 2, required: true }
      thickness: { type: int, min: -255, max: 255, required: true }
    send: "spyder\0\0\0\0KBD {layer} {thickness}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_border_full:
    summary: "Set a layer's border thickness, colour, bevel offsets and inside softness (KBD)"
    params:
      layer: { type: int, min: 2, required: true }
      thickness: { type: int, min: -255, max: 255, required: true }
      red: { type: int, min: 0, max: 255, required: true }
      green: { type: int, min: 0, max: 255, required: true }
      blue: { type: int, min: 0, max: 255, required: true }
      h_bevel: { type: int, min: 0, max: 255, required: true }
      v_bevel: { type: int, min: 0, max: 255, required: true }
      inside_softness: { type: int, min: 0, max: 255, required: true }
    send: "spyder\0\0\0\0KBD {layer} {thickness} {red} {green} {blue} {h_bevel} {v_bevel} {inside_softness}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_shadow:
    summary: "Set a layer's shadow position, size, transparency and softness, each 0 to 255 (KSH)"
    params:
      layer: { type: int, min: 2, required: true }
      x: { type: int, min: 0, max: 255, required: true }
      y: { type: int, min: 0, max: 255, required: true }
      size: { type: int, min: 0, max: 255, required: true }
      transparency: { type: int, min: 0, max: 255, required: true }
      softness: { type: int, min: 0, max: 255, required: true }
    send: "spyder\0\0\0\0KSH {layer} {x} {y} {size} {transparency} {softness}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_zoom_pan:
    summary: "Set or adjust a layer's zoom (0 to 20) and pan (-2048 to 2048) (ZPA)"
    params:
      relative: { type: bool, default: false }
      zoom: { type: float, min: 0, max: 20, required: true }
      h_pan: { type: float, min: -2048, max: 2048, required: true }
      v_pan: { type: float, min: -2048, max: 2048, required: true }
      layer: { type: int, min: 2, required: true }
    send: "spyder\0\0\0\0ZPA {relative:bool01} {zoom:.3f} {h_pan:.3f} {v_pan:.3f} {layer}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_clone:
    summary: "Set a layer's clone mode: 0 off, 1 offset, 2 mirror (LCC)"
    params:
      layer: { type: int, min: 2, required: true }
      mode: { type: int, min: 0, max: 2, required: true }
    send: "spyder\0\0\0\0LCC {layer} {mode}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_clone_offset:
    summary: "Set a layer's clone mode with an offset in relative coordinates (LCC)"
    params:
      layer: { type: int, min: 2, required: true }
      mode: { type: int, min: 0, max: 2, required: true }
      offset: { type: float, required: true }
    send: "spyder\0\0\0\0LCC {layer} {mode} {offset:.3f}"
    expect: { matches: "^0( |$)" }
    returns: ack

  layer_alignment:
    summary: "Apply an alignment effect, 0 to 24 (align, centre, size, snap, stack, swap), over a duration in frames (LAC)"
    params:
      effect: { type: int, min: 0, max: 24, required: true }
      duration: { type: int, min: 0, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0LAC {effect} {duration} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  treatment_recall:
    summary: "Recall a treatment onto layers (KTR)"
    params:
      treatment: { type: int, min: 0, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0KTR {treatment} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  treatment_learn:
    summary: "Learn a treatment from a layer, -1 for the next free ID (KTL)"
    params:
      treatment: { type: int, min: -1, required: true }
      layer: { type: int, min: 2, required: true }
    send: "spyder\0\0\0\0KTL {treatment} {layer}"
    expect: { matches: "^0( |$)" }
    returns: ack

  input_levels:
    summary: "Set layers' input brightness (0-2), contrast (0-2.5), hue (-180-180) and saturation (0-2) (ILA)"
    params:
      brightness: { type: float, min: 0, max: 2, required: true }
      contrast: { type: float, min: 0, max: 2.5, required: true }
      hue: { type: float, min: -180, max: 180, required: true }
      saturation: { type: float, min: 0, max: 2, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0ILA {brightness:.3f} {contrast:.3f} {hue:.3f} {saturation:.3f} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  input_levels_gamma:
    summary: "As input_levels, with gamma 0 to 3 (ILA, X80 reference)"
    params:
      brightness: { type: float, min: 0, max: 2, required: true }
      contrast: { type: float, min: 0, max: 2.5, required: true }
      hue: { type: float, min: -180, max: 180, required: true }
      saturation: { type: float, min: 0, max: 2, required: true }
      gamma: { type: float, min: 0, max: 3, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0ILA {brightness:.3f} {contrast:.3f} {hue:.3f} {saturation:.3f} {gamma:.3f} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  luminance_key:
    summary: "Turn layers' luminance key on with clip and gain, 0 to 512, or off with both 0 (ILK)"
    params:
      enabled: { type: bool, default: true }
      clip: { type: int, min: 0, max: 512, default: 0 }
      gain: { type: int, min: 0, max: 512, default: 0 }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0ILK {enabled:bool01} {clip} {gain} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  color_key:
    summary: "Turn layers' colour key on with colour and range (0-255) and gain (0-512), or off with zeros (ICK)"
    params:
      enabled: { type: bool, default: true }
      red: { type: int, min: 0, max: 255, default: 0 }
      green: { type: int, min: 0, max: 255, default: 0 }
      blue: { type: int, min: 0, max: 255, default: 0 }
      range_red: { type: int, min: 0, max: 255, default: 0 }
      range_green: { type: int, min: 0, max: 255, default: 0 }
      range_blue: { type: int, min: 0, max: 255, default: 0 }
      gain: { type: int, min: 0, max: 512, default: 0 }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0ICK {enabled:bool01} {red} {green} {blue} {range_red} {range_green} {range_blue} {gain} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  input_config_recall:
    summary: "Load a saved input configuration onto a layer's source (ICR)"
    params:
      config: { type: int, min: 0, required: true }
      layer: { type: int, min: 2, required: true }
    send: "spyder\0\0\0\0ICR {config} {layer}"
    expect: { matches: "^0( |$)" }
    returns: ack

  input_auto_sync:
    summary: "Switch a layer's input to a connector and auto-sync it: 0 HD15, 1 DVI, 2 SDI, 3 composite, 4 S-Video (ICR -1)"
    params:
      layer: { type: int, min: 2, required: true }
      connector: { type: int, min: 0, max: 4, required: true }
    send: "spyder\0\0\0\0ICR -1 {layer} {connector}"
    expect: { matches: "^0( |$)" }
    returns: ack

  input_config_learn:
    summary: "Save a layer's input configuration under an ID (ICL)"
    params:
      config: { type: int, min: 0, required: true }
      layer: { type: int, min: 2, required: true }
    send: "spyder\0\0\0\0ICL {config} {layer}"
    expect: { matches: "^0( |$)" }
    returns: ack

  input_raster:
    summary: "Move one edge of a layer's input video by pixels, negative inward (IRA)"
    params:
      layer: { type: int, min: 2, required: true }
      edge: { type: enum, values: [L, R, T, B], required: true }
      pixels: { type: int, required: true }
    send: "spyder\0\0\0\0IRA {layer} {edge} {pixels}"
    expect: { matches: "^0( |$)" }
    returns: ack

  input_auto_raster:
    summary: "Auto-raster a layer's analog input (IRA ... A)"
    params:
      layer: { type: int, min: 2, required: true }
    send: "spyder\0\0\0\0IRA {layer} A"
    expect: { matches: "^0( |$)" }
    returns: ack

  still_load_layers:
    summary: "Load a still from the Stills directory onto layers (SLD)"
    params:
      file: { type: string, max_length: 128, required: true }
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0SLD {file:url} {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  still_clear_layers:
    summary: "Clear stills from layers (SCL)"
    params:
      layers: { type: string, pattern: "^(\\d+|<DVCE\\d+:(PGM|PVW)>)( (\\d+|<DVCE\\d+:(PGM|PVW)>))*$", required: true }
    send: "spyder\0\0\0\0SCL {layers}"
    expect: { matches: "^0( |$)" }
    returns: ack

  background_load:
    summary: "Load a still as a PixelSpace's next (false) or current (true) background (BLD)"
    params:
      file: { type: string, max_length: 128, required: true }
      pixelspace: { type: int, min: 0, required: true }
      current: { type: bool, default: false }
    send: "spyder\0\0\0\0BLD {file:url} {pixelspace} {current:bool01}"
    expect: { matches: "^0( |$)" }
    returns: ack

  background_transition:
    summary: "Transition the backgrounds of every PixelSpace (BTR)"
    send: "spyder\0\0\0\0BTR"
    expect: { matches: "^0( |$)" }
    returns: ack

  background_transition_duration:
    summary: "Transition the backgrounds of every PixelSpace over a duration in frames (BTR)"
    params:
      duration: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0BTR {duration}"
    expect: { matches: "^0( |$)" }
    returns: ack

  still_load_output:
    summary: "Load an unscaled still straight onto an output, as a test pattern (LSO)"
    params:
      file: { type: string, max_length: 128, required: true }
      output: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0LSO {file:url} {output}"
    expect: { matches: "^0( |$)" }
    returns: ack

  still_load_output_channel:
    summary: "Load an unscaled still onto one channel, 0 to 3, of a DX4 output (LSO)"
    params:
      file: { type: string, max_length: 128, required: true }
      output: { type: int, min: 0, required: true }
      channel: { type: int, min: 0, max: 3, required: true }
    send: "spyder\0\0\0\0LSO {file:url} {output} {channel}"
    expect: { matches: "^0( |$)" }
    returns: ack

  still_clear_output:
    summary: "Clear the still on an output, every channel of a DX4 (CSO)"
    params:
      output: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0CSO {output}"
    expect: { matches: "^0( |$)" }
    returns: ack

  still_clear_output_channel:
    summary: "Clear the still on one channel, 0 to 3, of a DX4 output (CSO)"
    params:
      output: { type: int, min: 0, required: true }
      channel: { type: int, min: 0, max: 3, required: true }
    send: "spyder\0\0\0\0CSO {output} {channel}"
    expect: { matches: "^0( |$)" }
    returns: ack

  device_mixer_transition:
    summary: "Auto-transition mixer devices (zero-based) over a duration in frames; 1 is a cut (DMT)"
    params:
      duration: { type: int, min: 0, required: true }
      devices: { type: string, pattern: "^\\d+( \\d+)*$", required: true }
    send: "spyder\0\0\0\0DMT {duration} {devices}"
    expect: { matches: "^0( |$)" }
    returns: ack

  device_mixer_bus:
    summary: "Select mixer devices' bus: OFF, PVW or PGM (DMB)"
    params:
      duration: { type: int, min: 0, required: true }
      bus: { type: enum, values: ["OFF", PVW, PGM], required: true }
      devices: { type: string, pattern: "^\\d+( \\d+)*$", required: true }
    send: "spyder\0\0\0\0DMB {duration} {bus} {devices}"
    expect: { matches: "^0( |$)" }
    returns: ack

  freeze_outputs:
    summary: "Freeze or unfreeze outputs; universal outputs only (OFZ)"
    params:
      frozen: { type: bool, default: true }
      outputs: { type: string, pattern: "^\\d+( \\d+)*$", required: true }
    send: "spyder\0\0\0\0OFZ {frozen:bool01} {outputs}"
    expect: { matches: "^0( |$)" }
    returns: ack

  output_format:
    summary: "Set an output's VESA format: active size, refresh rate and interlace (OCF)"
    params:
      output: { type: int, min: 0, required: true }
      width: { type: int, min: 1, required: true }
      height: { type: int, min: 1, required: true }
      rate: { type: float, min: 1, required: true }
      interlaced: { type: bool, default: false }
    send: "spyder\0\0\0\0OCF {output} {width} {height} {rate:.2f} {interlaced:bool01}"
    expect: { matches: "^0( |$)" }
    returns: ack

  output_format_timing:
    summary: "As output_format, choosing standard (false) or reduced blanking (true) timing (OCF)"
    params:
      output: { type: int, min: 0, required: true }
      width: { type: int, min: 1, required: true }
      height: { type: int, min: 1, required: true }
      rate: { type: float, min: 1, required: true }
      interlaced: { type: bool, default: false }
      reduced_blanking: { type: bool, default: true }
    send: "spyder\0\0\0\0OCF {output} {width} {height} {rate:.2f} {interlaced:bool01} {reduced_blanking:bool01}"
    expect: { matches: "^0( |$)" }
    returns: ack

  output_mode_normal:
    summary: "Set an output to Normal mode (OCM)"
    params:
      output: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0OCM {output} Normal"
    expect: { matches: "^0( |$)" }
    returns: ack

  output_mode_normal_start:
    summary: "Set an output to Normal mode starting at this position on the canvas (OCM)"
    params:
      output: { type: int, min: 0, required: true }
      h_start: { type: int, min: 0, required: true }
      v_start: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0OCM {output} Normal {h_start} {v_start}"
    expect: { matches: "^0( |$)" }
    returns: ack

  output_mode_opmon:
    summary: "Set an output to OpMon of a program PixelSpace (OCM)"
    params:
      output: { type: int, min: 0, required: true }
      pixelspace: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0OCM {output} OpMon {pixelspace}"
    expect: { matches: "^0( |$)" }
    returns: ack

  output_mode_scaled:
    summary: "Set an output to Scaled mode on a program PixelSpace (OCM)"
    params:
      output: { type: int, min: 0, required: true }
      pixelspace: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0OCM {output} Scaled {pixelspace}"
    expect: { matches: "^0( |$)" }
    returns: ack

  output_rotation:
    summary: "Rotate an output by 0, 90, 180 or 270 degrees (OCR)"
    params:
      output: { type: int, min: 0, required: true }
      angle: { type: enum, values: ["0", "90", "180", "270"], required: true }
    send: "spyder\0\0\0\0OCR {output} {angle}"
    expect: { matches: "^0( |$)" }
    returns: ack

  output_blend:
    summary: "Set an output edge's blend: width in pixels, mode and two curve parameters 0 to 1 (OCB)"
    params:
      output: { type: int, min: 0, required: true }
      edge: { type: enum, values: [L, R], required: true }
      enabled: { type: bool, default: true }
      width: { type: int, min: 0, required: true }
      mode: { type: enum, values: [Bezier, Gamma, Velocity], required: true }
      curve1: { type: float, min: 0, max: 1, required: true }
      curve2: { type: float, min: 0, max: 1, required: true }
    send: "spyder\0\0\0\0OCB {output} {edge} {enabled:bool01} {width} {mode} {curve1:.3f} {curve2:.3f}"
    expect: { matches: "^0( |$)" }
    returns: ack

  output_blend_enabled:
    summary: "Turn an output edge's blend on or off (OCB)"
    params:
      output: { type: int, min: 0, required: true }
      edge: { type: enum, values: [L, R], required: true }
      enabled: { type: bool, default: true }
    send: "spyder\0\0\0\0OCB {output} {edge} {enabled:bool01}"
    expect: { matches: "^0( |$)" }
    returns: ack

  output_save:
    summary: "Save an output's configuration to persistent storage (OCS)"
    params:
      output: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0OCS {output}"
    expect: { matches: "^0( |$)" }
    returns: ack

  router_switch:
    summary: "Switch a router's logical output (zero-based) to an input (RCR ... L)"
    params:
      router: { type: int, min: 0, required: true }
      output: { type: int, min: 0, required: true }
      input: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0RCR {router} L {output} {input}"
    expect: { matches: "^0( |$)" }
    returns: ack

  router_switch_physical:
    summary: "Switch a router's physical output (zero-based) to an input (RCR ... P)"
    params:
      router: { type: int, min: 0, required: true }
      output: { type: int, min: 0, required: true }
      input: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0RCR {router} P {output} {input}"
    expect: { matches: "^0( |$)" }
    returns: ack

  router_query:
    summary: "Every output's input on a router, as output:input pairs, -1 when none (QRC)"
    params:
      router: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0QRC {router}"
    expect: { matches: "^0 (.*)$" }
    returns: value

  router_query_output:
    summary: "One router output's input (QRC)"
    params:
      router: { type: int, min: 0, required: true }
      output: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0QRC {router} {output}"
    expect: { matches: "^0 (.*)$" }
    returns: value

  save:
    summary: "Flush configuration and user data to non-volatile storage (SAV)"
    send: "spyder\0\0\0\0SAV"
    expect: { matches: "^0( |$)" }
    returns: ack

  restart_server:
    summary: "Restart the Spyder server application (SDN 1)"
    send: "spyder\0\0\0\0SDN 1"
    expect: { matches: "^0( |$)" }
    returns: ack

  power_off:
    summary: "Power the Spyder server off (SDN 0)"
    send: "spyder\0\0\0\0SDN 0"
    expect: { matches: "^0( |$)" }
    returns: ack

  get_layer_count:
    summary: "Logical layer count, including the two background layers (RLC)"
    send: "spyder\0\0\0\0RLC"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_source_names:
    summary: "Source names, space separated, spaces inside a name as %20 (RSN)"
    send: "spyder\0\0\0\0RSN"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_basic_presets:
    summary: "Basic presets: count, then ID and name pairs (RBL)"
    send: "spyder\0\0\0\0RBL"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_register_count:
    summary: "Number of registers of a type (RRC)"
    params:
      type: { type: int, min: 0, max: 10, required: true }
    send: "spyder\0\0\0\0RRC {type}"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_registers:
    summary: "Registers of a type on every page: count, then ID and name pairs (RRL ... -1)"
    params:
      type: { type: int, min: 0, max: 10, required: true }
    send: "spyder\0\0\0\0RRL {type} -1"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_script_cue:
    summary: "Current cue of a script by script ID, -1 when not running (SCR ... S)"
    params:
      script: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0SCR {script} S"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_register_cue:
    summary: "Current cue of the script in a register, -1 when not running (SCR ... R)"
    params:
      register: { type: int, min: 0, required: true }
    send: "spyder\0\0\0\0SCR {register} R"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_layer_keyframe:
    summary: "A layer's keyframe values: position, size, border, shadow, clone, crop, aspect, zoom, pan, PixelSpace, transparency (RLK)"
    params:
      layer: { type: int, min: 2, required: true }
    send: "spyder\0\0\0\0RLK {layer}"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_layer_source:
    summary: "A layer's source name and source register ID (RLS)"
    params:
      layer: { type: int, min: 2, required: true }
    send: "spyder\0\0\0\0RLS {layer}"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_connection_status:
    summary: "A layer's input connector type and connection status: 0 disconnected, 1 connected, 2 unknown (RCS; at most once a second)"
    params:
      layer: { type: int, min: 2, required: true }
    send: "spyder\0\0\0\0RCS {layer}"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_pixelspaces:
    summary: "PixelSpace definitions: ID, name, backgrounds, position, size, renewal group (RPD)"
    send: "spyder\0\0\0\0RPD"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_io_status:
    summary: "I/O processor progress (0-100) and task, for still loads (RPS)"
    send: "spyder\0\0\0\0RPS"
    expect: { matches: "^0 (.*)$" }
    returns: value

  get_aspect_ratio:
    summary: "A source's aspect ratio, by source name or layer ID (RAR)"
    params:
      source: { type: string, pattern: "^[A-Za-z0-9_.%-]{1,128}$", required: true }
    send: "spyder\0\0\0\0RAR {source}"
    expect: { matches: "^0 (.*)$" }
    returns: value

quirks:
  - models: [all]
    severity: info
    text: >
      Spyder does not push and its answers do not name the command they answer,
      so no state is kept: an answer can only be told apart by the request it
      follows, which telemetry rules on a line transport cannot see. The query
      commands (get_*, router_query) return the raw answer after the result
      code.

  - models: [all]
    severity: info
    text: >
      Result codes other than 0 fail the command (1 empty, 2 unknown command,
      3 too few arguments, 4 bad argument value, 5 execution error, see the
      alert log). A query for data that does not exist, such as the source of
      an empty layer, answers 1.

  - models: [all]
    severity: info
    text: >
      Names (sources, stills, command keys) are sent URL-encoded, so a space is
      %20 as the manuals require; other characters outside letters, digits and
      -._~ are percent-encoded too, which Spyder is assumed to decode.

  - models: [all]
    severity: critical
    text: >
      recall_basic_preset, recall_script_cue, recall_register_cue,
      function_key_recall, transition_layers, source_apply, device_mixer_bus,
      device_mixer_transition and background_transition change what is on
      screen at once. Script cues and command keys can change every layer.

  - models: [all]
    severity: critical
    text: >
      restart_server and power_off take every output down; power_off cannot be
      undone over the network.

  - models: [all]
    severity: warning
    text: >
      learn_basic_preset, treatment_learn, input_config_learn and
      learn_command_key overwrite whatever is stored under that ID, and
      delete_command_key deletes; output_format, output_mode_*,
      output_rotation and output_blend change an output's signal, and are lost
      at restart unless output_save is sent.

  - models: [all]
    severity: info
    text: >
      Registers on pages above the first are addressed as page * 1000 +
      register (register 2 on page 3 is 3002). A register ID changes when the
      operator reorders the list; a script ID does not.

  - models: [all]
    severity: warning
    text: >
      get_connection_status makes the frame probe the input; calling it more
      than once a second can degrade the system. Output freeze works on
      universal outputs only, not DX4.

  - models: [all]
    severity: info
    text: >
      UDP gives no delivery guarantee; a lost command or answer ends in a
      timeout, and the command may or may not have run.
