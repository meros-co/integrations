telemetry:
  # Change broadcasts on the WebSocket API; the keep-alive is the empty
  # object, sent with the subscriptions every 10 s.
  websocket:
    path: /query
    scheme: { setting: scheme }
    send:
      - '{"subscribe":"scene"}'
      - '{"subscribe":"timeline"}'
      - '{"subscribe":"group"}'
      - '{"subscribe":"beacon"}'
      - '{"subscribe":"remote_device"}'
      - '{"subscribe":"lua"}'
      - '{"subscribe":"content_target"}'
      - '{}'
    every_ms: 10000
  poll:
    - every_ms: 2000
      send:
        - { method: GET, path: /api/scene }
        - { method: GET, path: /api/timeline }
        - { models: [lpc, lpc-x, tpc], method: GET, path: /api/group }
        - { models: [vlc, vlc-plus], method: GET, path: /api/content_target }
        - { method: GET, path: /api/input }
    - every_ms: 30000
      send:
        - { method: GET, path: /api/system }
        - { method: GET, path: /api/temperature }
        - { method: GET, path: /api/fan_speed }
        - { method: GET, path: /api/time }
        - { method: GET, path: /api/project }
        - { method: GET, path: /api/replication }
        - { method: GET, path: /api/controller }
        - { method: GET, path: /api/remote_device }
        - { method: GET, path: /api/protocol }
        - { method: GET, path: /api/text_slot }
        - { method: GET, path: /api/playback_group }
        - { method: GET, path: /api/trigger }
        - { method: GET, path: /api/cloud }
        - { method: GET, path: /api/config }
        - { models: [lpc, lpc-x, tpc], method: GET, path: /api/status_monitor }
  updates:
    - path: "^/api/scene$"
      json_each: "$.scenes"
      json: { num: "$.num", name: "$.name", group: "$.group", group_num: "$.group_num", state: "$.state", onstage: "$.onstage" }
      replace: scenes
      state:
        "scenes.{num}.name": "{name}"
        "scenes.{num}.group": "{group}"
        "scenes.{num}.group_num": "{group_num}"
        "scenes.{num}.state": "{state}"
        "scenes.{num}.onstage": "{onstage}"
    - path: "^/api/timeline$"
      json_each: "$.timelines"
      json: { num: "$.num", name: "$.name", group: "$.group", group_num: "$.group_num", length: "$.length",
              source_bus: "$.source_bus", timecode_format: "$.timecode_format", audio_band: "$.audio_band",
              audio_channel: "$.audio_channel", audio_peak: "$.audio_peak", time_offset: "$.time_offset",
              state: "$.state", onstage: "$.onstage", position: "$.position", rate_adjusted: "$.rate_adjusted",
              priority: "$.priority" }
      replace: timelines
      state:
        "timelines.{num}.name": "{name}"
        "timelines.{num}.group": "{group}"
        "timelines.{num}.group_num": "{group_num}"
        "timelines.{num}.length": "{length}"
        "timelines.{num}.source_bus": "{source_bus}"
        "timelines.{num}.timecode_format": "{timecode_format}"
        "timelines.{num}.audio_band": "{audio_band}"
        "timelines.{num}.audio_channel": "{audio_channel}"
        "timelines.{num}.audio_peak": "{audio_peak}"
        "timelines.{num}.time_offset": "{time_offset}"
        "timelines.{num}.state": "{state}"
        "timelines.{num}.onstage": "{onstage}"
        "timelines.{num}.position": "{position}"
        "timelines.{num}.rate_adjusted": "{rate_adjusted}"
        "timelines.{num}.priority": "{priority}"
    - path: "^/api/group$"
      json_each: "$.groups"
      json: { num: "$.num", name: "$.name", level: "$.level" }
      state: { "groups.{num}.name": "{name}", "groups.{num}.level": "{level}" }
    - path: "^/api/content_target$"
      json_each: "$.content_targets"
      json: { name: "$.name", level: "$.level" }
      state: { "content_targets.{name:key}.level": "{level}" }
    - path: "^/api/input$"
      json_each: "$.gpio"
      each_match: { "$.type": "^Analog$" }
      json: { input: "$.input", type: "$.type", value: "$.value" }
      state: { "inputs.{input}.type": "{type}", "inputs.{input}.level": "{value}" }
    - path: "^/api/input$"
      json_each: "$.gpio"
      each_match: { "$.type": "^(Digital|Contact Closure)$" }
      json: { input: "$.input", type: "$.type", value: "$.value" }
      state: { "inputs.{input}.type": "{type}", "inputs.{input}.active": "{value}" }
    - path: "^/api/system$"
      json: { hardware_type: "$.hardware_type", channel_capacity: "$.channel_capacity", serial_number: "$.serial_number",
              memory_total: "$.memory_total", memory_used: "$.memory_used", memory_available: "$.memory_available",
              lua_memory_used: "$.lua_memory_used", lua_memory_allowed: "$.lua_memory_allowed",
              storage_size: "$.storage_size", bootloader_version: "$.bootloader_version",
              firmware_version: "$.firmware_version", reset_reason: "$.reset_reason",
              last_boot_time: "$.last_boot_time", ip_address: "$.ip_address", subnet_mask: "$.subnet_mask",
              default_gateway: "$.default_gateway", host_name: "$.host_name", domain_name: "$.domain_name",
              vlan_tag: "$.vlan_tag" }
      state:
        system.hardware_type: "{hardware_type}"
        system.channel_capacity: "{channel_capacity}"
        system.serial_number: "{serial_number}"
        system.memory_total: "{memory_total}"
        system.memory_used: "{memory_used}"
        system.memory_available: "{memory_available}"
        system.lua_memory_used: "{lua_memory_used}"
        system.lua_memory_allowed: "{lua_memory_allowed}"
        system.storage_size: "{storage_size}"
        system.bootloader_version: "{bootloader_version}"
        system.firmware_version: "{firmware_version}"
        system.reset_reason: "{reset_reason}"
        system.last_boot_time: "{last_boot_time}"
        system.ip_address: "{ip_address}"
        system.subnet_mask: "{subnet_mask}"
        system.default_gateway: "{default_gateway}"
        system.host_name: "{host_name}"
        system.domain_name: "{domain_name}"
        system.vlan_tag: "{vlan_tag}"
    - path: "^/api/temperature$"
      json: { sys: "$.sys_temp", core1: "$.core1_temp", core2: "$.core2_temp", ambient: "$.ambient_temp", cc: "$.cc_temp", gpu: "$.gpu_temp" }
      state:
        temperature.sys_temp: "{sys}"
        temperature.core1_temp: "{core1}"
        temperature.core2_temp: "{core2}"
        temperature.ambient_temp: "{ambient}"
        temperature.cc_temp: "{cc}"
        temperature.gpu_temp: "{gpu}"
    - path: "^/api/fan_speed$"
      json: { fan_1: "$.fan_speed.fan_1", fan_2: "$.fan_speed.fan_2" }
      state: { fans.fan_1: "{fan_1}", fans.fan_2: "{fan_2}" }
    - path: "^/api/time$"
      json: { datetime: "$.datetime", local_time: "$.local_time", uptime: "$.uptime" }
      state: { time.datetime: "{datetime}", time.local_time: "{local_time}", time.uptime: "{uptime}" }
    - path: "^/api/project$"
      json: { name: "$.name", author: "$.author", filename: "$.filename", unique_id: "$.unique_id", upload_date: "$.upload_date" }
      state:
        project.name: "{name}"
        project.author: "{author}"
        project.filename: "{filename}"
        project.unique_id: "{unique_id}"
        project.upload_date: "{upload_date}"
    - path: "^/api/replication$"
      json: { name: "$.name", unique_id: "$.unique_id" }
      state: { replication.name: "{name}", replication.unique_id: "{unique_id}" }
    - path: "^/api/controller$"
      json_each: "$.controllers"
      json: { num: "$.num", type: "$.type", name: "$.name", serial: "$.serial", ip: "$.ip_address", online: "$.online", primary: "$.is_network_primary" }
      replace: controllers
      state:
        "controllers.{num}.name": "{name}"
        "controllers.{num}.type": "{type}"
        "controllers.{num}.serial": "{serial}"
        "controllers.{num}.ip_address": "{ip}"
        "controllers.{num}.online": "{online}"
        "controllers.{num}.is_network_primary": "{primary}"
    - path: "^/api/remote_device$"
      json_each: "$.remote_devices"
      json: { num: "$.num", name: "$.name", type: "$.type", online: "$.online" }
      replace: remote_devices
      state: { "remote_devices.{num}.name": "{name}", "remote_devices.{num}.type": "{type}", "remote_devices.{num}.online": "{online}" }
    - path: "^/api/protocol$"
      json_each: "$.outputs"
      json: { type: "$.type", name: "$.name", disabled: "$.disabled" }
      replace: protocols
      state: { "protocols.{type}.name": "{name}", "protocols.{type}.disabled": "{disabled}" }
    - path: "^/api/text_slot$"
      json_each: "$.text_slots"
      json: { name: "$.name", value: "$.value" }
      replace: text_slots
      state: { "text_slots.{name:key}.value": "{value}" }
    - path: "^/api/playback_group$"
      json_each: "$.playback_groups"
      json: { num: "$.num", name: "$.name" }
      replace: playback_groups
      state: { "playback_groups.{num}.name": "{name}" }
    - path: "^/api/trigger$"
      json_each: "$.triggers"
      json: { num: "$.num", name: "$.name", type: "$.type", description: "$.description", text: "$.trigger_text" }
      replace: triggers
      state:
        "triggers.{num}.name": "{name}"
        "triggers.{num}.type": "{type}"
        "triggers.{num}.description": "{description}"
        "triggers.{num}.trigger_text": "{text}"
    - path: "^/api/cloud$"
      json: { connected: "$.connected", connecting: "$.connecting" }
      state: { cloud.connected: "{connected}", cloud.connecting: "{connecting}" }
    - path: "^/api/config$"
      json: { ip: "$.ip", subnet_mask: "$.subnet_mask", gateway: "$.gateway", dhcp: "$.dhcp_enabled", ns1: "$.name_server_1",
              ns2: "$.name_server_2", http_port: "$.http_port", https_port: "$.https_port", datetime: "$.datetime",
              watchdog: "$.watchdog_enabled", log_level: "$.log_level", syslog: "$.syslog_enabled", syslog_ip: "$.syslog_ip",
              ntp: "$.ntp_enabled", ntp_ip: "$.ntp_ip" }
      state:
        config.ip: "{ip}"
        config.subnet_mask: "{subnet_mask}"
        config.gateway: "{gateway}"
        config.dhcp_enabled: "{dhcp}"
        config.name_server_1: "{ns1}"
        config.name_server_2: "{ns2}"
        config.http_port: "{http_port}"
        config.https_port: "{https_port}"
        config.datetime: "{datetime}"
        config.watchdog_enabled: "{watchdog}"
        config.log_level: "{log_level}"
        config.syslog_enabled: "{syslog}"
        config.syslog_ip: "{syslog_ip}"
        config.ntp_enabled: "{ntp}"
        config.ntp_ip: "{ntp_ip}"
    - path: "^/api/status_monitor$"
      json: { completed_at: "$.latest_refresh_all.completed_at", discovered: "$.latest_refresh_all.discovered_device_count",
              unpatched: "$.latest_refresh_all.unpatched_device_count" }
      state:
        status_monitor.completed_at: "{completed_at}"
        status_monitor.discovered_device_count: "{discovered}"
        status_monitor.unpatched_device_count: "{unpatched}"
    # WebSocket broadcasts.
    - json_match: { "$.broadcast": "^scene$" }
      json: { num: "$.data.num", state: "$.data.state", onstage: "$.data.onstage" }
      state: { "scenes.{num}.state": "{state}", "scenes.{num}.onstage": "{onstage}" }
    - json_match: { "$.broadcast": "^timeline$" }
      json: { num: "$.data.num", state: "$.data.state", onstage: "$.data.onstage", position: "$.data.position" }
      state: { "timelines.{num}.state": "{state}", "timelines.{num}.onstage": "{onstage}", "timelines.{num}.position": "{position}" }
    - json_match: { "$.broadcast": "^group$" }
      json: { num: "$.data.num", name: "$.data.name", level: "$.data.level" }
      state: { "groups.{num}.name": "{name}", "groups.{num}.level": "{level}" }
    - json_match: { "$.broadcast": "^beacon$" }
      json: { beacon_on: "$.data.on" }
      state: { beacon: "{beacon_on}" }
    - json_match: { "$.data.content_targets": "^\\[" }
      json_each: "$.data.content_targets"
      json: { name: "$.name", level: "$.level" }
      state: { "content_targets.{name:key}.level": "{level}" }
    - json_match: { "$.data.remote_devices": "^\\[" }
      json_each: "$.data.remote_devices"
      json: { num: "$.num", name: "$.name", type: "$.type", online: "$.online" }
      state: { "remote_devices.{num}.name": "{name}", "remote_devices.{num}.type": "{type}", "remote_devices.{num}.online": "{online}" }
    - json_match: { "$.broadcast": "^lua$" }
      json_each: "$.data.*"
      json: { value: "$" }
      state: { "lua.{key:key}": "{value}" }

quirks:
  - models: [all]
    severity: warning
    text: >
      With security enabled the session logs in with POST /authenticate?original_url=/ and keeps
      the token cookie the answer sets; a token lasts 5 minutes from the request that issued it,
      and the session logs in again when a request is refused with 401. That the cookie comes
      with a redirect (or a 200) and that an expired token is answered 401 are inferred. Wrong
      credentials are answered with a redirect to the referring page, which the session reads as
      a login without a session, not as a refusal. The WebSocket wants the token inside each
      message, which the spec format cannot add, so with security enabled the broadcasts do not
      come and state is kept by polling only.
  - models: [all]
    severity: warning
    text: >
      The WebSocket keep-alive and the subscriptions are sent together every 10 s, so a
      controller receives the same subscription again each time; whether a repeated
      subscription duplicates the broadcasts is not documented. A WebSocket uses one of the
      controller's HTTP connections (8 on an LPC, 16 on an LPC X or VLC). Scenes, timelines,
      groups, content targets and inputs are also polled every 2 s; the rest every 30 s. The
      timeline broadcast's example in the reference is labeled "scene"; the rule reads
      "timeline" as the subscription names it.
  - models: [all]
    severity: info
    text: >
      Optional attributes become separate commands or explicit values: a fade of 0, a delay of
      0, the Default crossfade path and conditions true are sent when not given. The group
      "All Fixtures" (group 0) is read without a number and is not kept. RDM discovery and
      RDM Get and Set results arrive on the rdm_discovery and rdm_get_set channels and are not
      kept in state; get_rdm_discovery and get_rdm_device read results on demand. The Ping
      endpoint is given in the reference as POST /api/beacon, the beacon's own path, so it is
      not built. download_project saves the project file (GET /api/project/file) to a host
      file. Lua values pushed with push_to_web are
      kept as text.
  - models: [vlc, vlc-plus]
    severity: info
    text: >
      Group masters and the status monitor are not available on a VLC or VLC+; content targets
      are VLC and VLC+ only, and only the primary target exists on a VLC.
  - models: [all]
    severity: info
    text: >
      Over https the controller is assumed to present its own self-signed certificate, which is
      accepted. The run_command endpoint answers 501 unless the project enables the Command
      Line Parser in its web interface settings.
  - models: [all]
    severity: critical
    text: >
      factory_reset erases the configuration, network settings and user accounts; reboot,
      upload_project, set_ip, set_dhcp and set_web_ports interrupt or move the controller (the
      config answer says whether it restarts); playback actions propagate to every controller
      in the project. None can be undone remotely.
