  increase_gain:
    summary: "Increase a channel's digital gain by a step (AUDIO_GAIN_HI_RES inc)"
    params:
      channel: { type: int, min: 0, max: 99, required: true, label: "Channel", description: "Channel in the microphone's channel table: lobes or Dante outputs first, then the automixer output (9 on MXA910 and MXA920, 5 on MXA310) and the AEC reference; 0 is all." }
      step: { type: int, min: 1, max: 1400, required: true, label: "Step", description: "Amount to change the gain by, in tenths of a dB." }
    send: "SET {channel:02d} AUDIO_GAIN_HI_RES inc {step}"
    expect: { reply_contains: " AUDIO_GAIN_HI_RES ", contains: " AUDIO_GAIN_HI_RES " }
