spec: 1
id: shure-mxa
name: "Shure Microflex Advance array microphones (MXA910, MXA920, MXA710, MXA310, MXA902, MXA901)"
vendor: Shure
category: mixer

# Written from Shure's command strings for each microphone. Channel numbers
# differ by model (each document's Channel Number Assignments): typically the
# lobes or Dante outputs first, then the automixer output (MXA910 and MXA920:
# 09; MXA310: 05) and the AEC reference; 0 is all.
source:
  - title: "MXA910 Command Strings, Version 6.2 (2021-J)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/MXA910/en-US"
    note: >
      Manufacturer document, also as a PDF at
      https://pubs2-api.prod.shureweb.eu/documents/public/download/6999.pdf . TCP 2202; channels
      0-9; device information, CHAN_NAME, gains incl. post-gate and echo reduction, mutes, clip
      indicator, FLASH, metering rates, levels, presets, gate outputs, LED colours, states and
      brightness, lobe steering BEAM_X/Y/Z/W and autofocus positions, REBOOT, LAST_ERROR_EVENT,
      filters, IntelliMix bypass, NA names, NUM_ACTIVE_MICS, PEQ, solo, ENCRYPTION.
  - title: "MXA920 Command Strings, Version 1.4 (2025-J)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/MXA920/en-US"
    note: >
      Manufacturer document, also as a PDF at
      https://pubs2-api.prod.shureweb.eu/documents/public/download/8372.pdf . TCP 2202; Telnet
      negotiation not supported; channel table and automatic coverage on/off p.3-5; device
      information, presets incl. PRESET_NAME, gains, mutes incl. post-gate and coverage areas,
      speech gating, noise filter, metering, LEDs (brightness 0-5, 17 colours, ON/FLASHING/OFF),
      PEQ, EQ contour, lobe width, ARRAY_HEIGHT, AUTO_COVERAGE, VAB, talker positions, array groups,
      gate outputs, lobe steering, AUTOFOCUS, coverage areas.
  - title: "MXA710 Command Strings, Version 3.8 (2025-G)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/MXA710/en-US"
    note: >
      Manufacturer document, also as a PDF at
      https://pubs2-api.prod.shureweb.eu/documents/public/download/7643.pdf . TCP 2202; 2 ft and 4
      ft channel tables; DEVICE_INSTALLATION; BEAM_ANGLE (-90 to +90) and BEAM_W per lobe; as the
      MXA920 otherwise.
  - title: "MXA310 Command Strings, Version 3.2 (2023-C)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/MXA310/en-US"
    note: >
      Manufacturer document, also as a PDF at
      https://pubs2-api.prod.shureweb.eu/documents/public/download/7094.pdf . TCP 2202; channels
      0-5; polar pattern, lobe angle, mute button and LED states, external switch, low-cut filter,
      mute control function, as the MXA910 otherwise.
  - title: "MXA902 Command Strings, Version 0.5 (2025-G)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/MXA902/en-US"
    note: >
      Manufacturer document, also as a PDF at
      https://pubs2-api.prod.shureweb.eu/documents/public/download/9932.pdf . TCP 2202; automixer
      output 09, speaker output 10, Dante inputs 11-12; SPEAKER, DELAY (1-160 ms on 10), COMPRESSOR,
      signal generator.
  - title: "MXA901-R Command Strings, Version 0.3 (2025-F)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/MXA901-R/en-US"
    note: >
      Manufacturer document, also as a PDF at
      https://pubs2-api.prod.shureweb.eu/documents/public/download/10256.pdf . TCP 2202; output 09,
      AEC reference 10; ARRAY_HEIGHT, talker positions, AUTOFOCUS.

transport:
  type: line-tcp
  port: 2202
  framing: delimited
  open: "< "
  close: " >"
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # Answers and change reports are both REP; SAMPLE (metering) never answers.
  # Commands name the parameter their REP carries (expect.reply_contains), so
  # a change pushed meanwhile is never taken for an answer.
  reply_match: "^< REP "
  error_match: "^< REP ERR"
  probe: "GET MODEL"

conversions:
  # AUDIO_GAIN_HI_RES and similar: tenths of a dB offset by 1100 (0-1400 = -110.0 to +30.0 dB)
  shure_gain:
    points: [[0, -110.0], [1400, 30.0]]
  # lobe X/Y position: cm offset by 1524 (0-3048 = -1524 to +1524 cm)
  shure_xy:
    points: [[0, -1524.0], [3048, 1524.0]]

ports:
  - { port: 2202, protocol: tcp, role: control }

