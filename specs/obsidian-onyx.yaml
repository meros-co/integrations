spec: 1
id: obsidian-onyx
name: Obsidian Control Systems ONYX and ONYX Manager (Telnet)
vendor: Obsidian Control Systems
category: lighting
implementation: native
reason: >
  A reply's extent depends on its form: a status line followed by data lines ended by a line holding
  only ".", or "NNN-" continuation lines ended by a line without the dash, as on the connection banner
  and for errors. What the data lines mean depends on the query that was sent (QLList and QLActive both
  answer "00002 - House Lights"), so cuelist names and active flags can only be kept from replies matched
  to their request, and a connection must wait out the banner before its first command. The spec
  format's line rules cannot attribute data lines to a request.

source:
  - title: ONYX Manual 4.32, Networking > Telnet; Telnet and UDP Commands
    author: Obsidian Control Systems
    url: https://support.obsidiancontrol.com/Content/Onyx_Manual/Networking/Telnet_and_UDP_Commands.htm
    note: >
      Retrieved 2026-10-02. Telnet.htm: ONYX accepts Telnet (UDP or TCP) commands for triggering
      playback and command line operations, ONYX 4.10 or later. Telnet_and_UDP_Commands.htm: the
      server must be enabled and given a TCP port (example 2323); "Telnet commands will return a
      response"; UDP commands are a string and a carriage return with no response. Commands: CLRCLR,
      GQL #, RQL #, PQL #, GTQ #,# ("full cue and point cue numbers supported", examples GTQ 14,3 and
      GTQ 14,4.1), RAO, RAQLDF, RAQLO, RAQL, SQL #,# (level 0-255, example SQL 12,255). Network
      Settings: Telnet is enabled per network interface.
  - title: onyx_lighting (Dart package), README and lib/onyx/model.dart (community, MIT)
    author: Jeff Mikels
    url: https://github.com/jeffmikels/onyx_lighting_dart
    note: >
      Community code and documentation, read for corroboration only (MIT at the top level). The README
      reproduces the server's Help output on ONYX Manager's Telnet port 2323: ACT, ActList, ActName,
      BYE, CLRCLR, CMD, CmdList, CmdName, GQL, GSC, GTQ, Help, IsMxRun, IsQLActive, IsSchRun, LastLog
      (300 lines max), PQL, QLActive, QLList, QLName, RAO, RAQL, RAQLDF, RAQLO, RAQLODF, RQL, SchList,
      SchName, SchUseCalendar, SetDate (YYYY,MM,DD), SetPosDec, SetPosDMS, SetQLLevel (#,# level 0-255),
      SetTime (HH,MM,SS), SetTimepreset, Status, TimePresetList, WhoIAm. model.dart describes the
      replies: a banner of "200-" lines ending "200"; errors as "400-" lines ending "400 <command>";
      data replies "200 Ok", data lines such as "00002 - House Lights", then "."; QLActive with no
      active cuelist answering "No Active Qlist in List"; Yes or No for the Is commands; CRLF line
      endings; QLName timing out on some versions.
  - title: Bitfocus Companion module companion-module-obsidiancontrol-onyx (community, MIT)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-obsidiancontrol-onyx
    note: >
      Read for corroboration only (MIT at the top level). Sends commands ended by CRLF; describes ONYX's
      built-in Telnet server and ONYX Manager's (default port 2323, needed for the scheduler), enabled
      under Menu > Network-Remote > Telnet (TCP) and in ONYX Manager under Setup > Net Remote; polls
      QLActive only through ONYX Manager.

settings: {}

ports:
  - { port: 2323, protocol: tcp, role: control, note: "Telnet" }

