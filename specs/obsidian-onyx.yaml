commands:
  clear_programmer:
    summary: "Press Clear twice to clear the programmer (CLRCLR)"
    returns: ack
  go_cuelist:
    summary: "Go on a cuelist by number (GQL #)"
    params:
      cuelist: { type: int, min: 1, max: 99999, required: true }
    returns: ack
  pause_cuelist:
    summary: "Pause a cuelist (PQL #)"
    params:
      cuelist: { type: int, min: 1, max: 99999, required: true }
    returns: ack
  release_cuelist:
    summary: "Release a cuelist (RQL #)"
    params:
      cuelist: { type: int, min: 1, max: 99999, required: true }
    returns: ack
  go_to_cue:
    summary: "Go to a cue of a cuelist, whole or point cue such as 4.1 (GTQ #,#)"
    params:
      cuelist: { type: int, min: 1, max: 99999, required: true }
      cue: { type: string, pattern: '^[0-9]{1,5}(\.[0-9]{1,3})?$', required: true }
    returns: ack
  set_cuelist_level:
    summary: "Set a cuelist's fader level 0-255 (SQL #,#; ONYX's own Telnet server)"
    params:
      cuelist: { type: int, min: 1, max: 99999, required: true }
      level: { type: int, min: 0, max: 255, required: true }
    returns: ack
  set_cuelist_level_manager:
    summary: "Set a cuelist's level 0-255 through ONYX Manager (SetQLLevel #,#)"
    params:
      cuelist: { type: int, min: 1, max: 99999, required: true }
      level: { type: int, min: 0, max: 255, required: true }
    returns: ack
  release_all_cuelists:
    summary: "Release all cuelists (RAQL)"
    returns: ack
  release_all_cuelists_dimmer_first:
    summary: "Release all cuelists, dimmers first (RAQLDF)"
    returns: ack
  release_all_overrides:
    summary: "Release all override cuelists (RAO)"
    returns: ack
  release_all_cuelists_and_overrides:
    summary: "Release all cuelists and overrides (RAQLO)"
    returns: ack
  release_all_cuelists_and_overrides_dimmer_first:
    summary: "Release all cuelists and overrides, dimmers first (RAQLODF)"
    returns: ack
  list_cuelists:
    summary: "List the available cuelists (QLList); returns [{number, name}] and updates the state"
    returns: value
  list_active_cuelists:
    summary: "List the active cuelists (QLActive); returns [{number, name}] and updates the state"
    returns: value
  is_cuelist_active:
    summary: "Whether a cuelist is active (IsQLActive #); returns true or false"
    params:
      cuelist: { type: int, min: 1, max: 99999, required: true }
    returns: value
  cuelist_name:
    summary: "A cuelist's name (QLName #)"
    params:
      cuelist: { type: int, min: 1, max: 99999, required: true }
    returns: value
  is_onyx_running:
    summary: "Whether ONYX is running (IsMxRun); returns true or false"
    returns: value
  action_group:
    summary: "Run an ONYX Manager action group (ACT #)"
    params:
      group: { type: int, min: 1, max: 99999, required: true }
    returns: ack
  list_action_groups:
    summary: "List the ONYX Manager action groups (ActList); returns [{number, name}]"
    returns: value
  action_group_name:
    summary: "An action group's name (ActName #)"
    params:
      group: { type: int, min: 1, max: 99999, required: true }
    returns: value
  run_command:
    summary: "Run an ONYX Manager internal command by number (CMD #)"
    params:
      command: { type: int, min: 1, max: 99999, required: true }
    returns: ack
  list_commands:
    summary: "List the ONYX Manager commands (CmdList); returns [{number, name}]"
    returns: value
  command_name:
    summary: "A command's name (CmdName #)"
    params:
      command: { type: int, min: 1, max: 99999, required: true }
    returns: value
  go_schedule:
    summary: "Make a schedule the default schedule (GSC #); see use_calendar_rules to return"
    params:
      schedule: { type: int, min: 1, max: 99999, required: true }
    returns: ack
  use_calendar_rules:
    summary: "Set the scheduler back to its calendar rules (SchUseCalendar)"
    returns: ack
  list_schedules:
    summary: "List the schedules (SchList); returns [{number, name}]"
    returns: value
  schedule_name:
    summary: "A schedule's name (SchName #)"
    params:
      schedule: { type: int, min: 1, max: 99999, required: true }
    returns: value
  is_scheduler_running:
    summary: "Whether the scheduler is running (IsSchRun); returns true or false"
    returns: value
  list_time_presets:
    summary: "List the time presets (TimePresetList); returns [{number, name}] where the lines have that form, else the lines"
    returns: value
  status:
    summary: "ONYX Manager's status report (Status); returns the text"
    returns: value
  last_log:
    summary: "The last 1-300 log lines (LastLog #); returns the text"
    params:
      lines: { type: int, min: 1, max: 300, default: 10 }
    returns: value
  who_am_i:
    summary: "The address the server sees this connection from (WhoIAm)"
    returns: value
  set_date:
    summary: "Set the date of the computer running ONYX Manager (SetDate YYYY,MM,DD)"
    params:
      year: { type: int, min: 2000, max: 2099, required: true }
      month: { type: int, min: 1, max: 12, required: true }
      day: { type: int, min: 1, max: 31, required: true }
    returns: ack
  set_time:
    summary: "Set the time of the computer running ONYX Manager, 24-hour (SetTime HH,MM,SS)"
    params:
      hour: { type: int, min: 0, max: 23, required: true }
      minute: { type: int, min: 0, max: 59, required: true }
      second: { type: int, min: 0, max: 59, required: true }
    returns: ack
  set_position:
    summary: "Set the geographical position for astronomical schedule rules, in decimal degrees (SetPosDec lat,N|S,long,E|W)"
    params:
      latitude: { type: float, min: 0, max: 90, required: true }
      north: { type: bool, required: true }
      longitude: { type: float, min: 0, max: 180, required: true }
      east: { type: bool, required: true }
    returns: ack
  help:
    summary: "The server's list of commands (Help); returns the text"
    returns: value
  send_raw:
    summary: "Send any command line and return the reply's text (data lines, or the message for a reply without data)"
    params:
      text: { type: string, pattern: '^[ -~]{1,200}$', required: true }
    returns: value

state:
  "cuelists.*.name": { type: string, description: "Cuelist name by cuelist number, from QLList (and QLActive) replies" }
  "cuelists.*.active": { type: bool, description: "Whether the cuelist is active, from QLActive replies; numbers QLList lists and QLActive does not are false" }
  onyx_running: { type: bool, description: "ONYX running, from IsMxRun (ONYX Manager)" }
  scheduler_running: { type: bool, description: "Scheduler running, from IsSchRun (ONYX Manager)" }

quirks:
  - models: [all]
    severity: warning
    text: >
      Obsidian documents the commands of ONYX's own Telnet server but not its replies; the reply forms
      (banner, "200 Ok" with data lines ended by ".", "NNN-" continuation lines, 4xx errors) are those
      of ONYX Manager's server as the community library records them, and are assumed for both. A
      reply with a status line and no "." is taken as complete after 300 ms without more lines.

  - models: [all]
    severity: info
    text: >
      Opened for monitoring, the module asks QLList on connecting and every 30 s, QLActive every 2 s
      (and 300 ms after a cuelist command), and IsMxRun and IsSchRun every 10 s. A query the server
      refuses (a 4xx reply, as ONYX's own server may for ONYX Manager queries) is not asked again on
      that connection. Commands go ahead of queued queries; one request is in flight at a time.
      Opened for commands only, it asks WhoIAm every 10 s as the liveness check and reads no state.

  - models: [all]
    severity: info
    text: >
      Nothing is sent until the connection banner has ended (a line of only a status code) or 1 s has
      passed, so the banner is never taken as a reply. Commands end with CRLF. The port is the host's,
      2323 when none is given (ONYX Manager's default and the manual's example; ONYX's own server's
      port is set in its Telnet settings).

  - models: [onyx-manager]
    severity: warning
    text: >
      set_date and set_time change the clock of the computer running ONYX Manager, which the scheduler
      runs from; go_schedule overrides the calendar rules until use_calendar_rules. QLName times out on
      some versions (community report).

  - models: [all]
    severity: info
    text: >
      UDP Telnet commands (no reply) are not used; TCP gives replies and errors. Cuelist numbers are
      sent without leading zeros; ONYX Manager lists them with five digits (00002), read as numbers.
