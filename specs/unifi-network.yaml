telemetry:
  poll:
    - every_ms: 15000
      send:
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/devices", query: { offset: "0", limit: "200" }, pages: &pages { items: "$.data", offset: offset, size: limit } }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/clients", query: { offset: "0", limit: "200" }, pages: *pages }
    - every_ms: 60000
      send:
        - { method: GET, path: /proxy/network/integration/v1/info }
        - { method: GET, path: /proxy/network/integration/v1/sites, query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: /proxy/network/integration/v1/pending-devices, query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/device-tags", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/networks", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/wifi/broadcasts", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/firewall/zones", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/firewall/policies", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/acl-rules", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/dns/policies", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/traffic-matching-lists", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/hotspot/vouchers", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/wans", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/vpn/servers", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/vpn/site-to-site-tunnels", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/radius/profiles", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/switching/lags", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/switching/mc-lag-domains", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/switching/switch-stacks", query: { offset: "0", limit: "200" }, pages: *pages }
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/acl-rules/ordering" }
  updates:
    - path: "^/proxy/network/integration/v1/sites\\?offset=0&limit=200$"
      json_each: $.data
      json:
        id: $.id
        internal_reference: $.internalReference
        name: $.name
      replace: sites
      state:
        "sites.{id:key}.internal_reference": "{internal_reference}"
        "sites.{id:key}.name": "{name}"
    - path: "^/proxy/network/integration/v1/pending-devices\\?offset=0&limit=200$"
      json_each: $.data
      json:
        mac: $.macAddress
        adoption_target_site_ids: $.adoptionTargetSiteIds
        features: $.features
        firmware_updatable: $.firmwareUpdatable
        firmware_version: $.firmwareVersion
        ip_address: $.ipAddress
        model: $.model
        state: $.state
        supported: $.supported
      replace: pending_devices
      state:
        "pending_devices.{mac:key}.adoption_target_site_ids": "{adoption_target_site_ids}"
        "pending_devices.{mac:key}.features": "{features}"
        "pending_devices.{mac:key}.firmware_updatable": "{firmware_updatable}"
        "pending_devices.{mac:key}.firmware_version": "{firmware_version}"
        "pending_devices.{mac:key}.ip_address": "{ip_address}"
        "pending_devices.{mac:key}.model": "{model}"
        "pending_devices.{mac:key}.state": "{state}"
        "pending_devices.{mac:key}.supported": "{supported}"
    - path: "^/proxy/network/integration/v1/sites/[^/]+/devices\\?offset=0&limit=200$"
      json_each: $.data
