        interfaces: $.interfaces
        ip_address: $.ipAddress
        mac_address: $.macAddress
        model: $.model
        name: $.name
        state: $.state
        supported: $.supported
      replace: devices
      state:
        "devices.{id:key}.features": "{features}"
        "devices.{id:key}.firmware_updatable": "{firmware_updatable}"
        "devices.{id:key}.firmware_version": "{firmware_version}"
        "devices.{id:key}.interfaces": "{interfaces}"
        "devices.{id:key}.ip_address": "{ip_address}"
        "devices.{id:key}.mac_address": "{mac_address}"
        "devices.{id:key}.model": "{model}"
        "devices.{id:key}.name": "{name}"
        "devices.{id:key}.state": "{state}"
        "devices.{id:key}.supported": "{supported}"
      then_send:
        - { method: GET, path: "/proxy/network/integration/v1/sites/{settings.site_id}/devices/{id}" }
