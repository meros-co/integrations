      limit: { type: int, min: 0, max: 200, default: 25, label: Limit, description: "How many items to return, at most 200 (25 by default)." }
      filter: { type: string, max_length: 4096, required: true, label: Filter, description: "A filter expression in the API's syntax, such as name.eq('Studio'), on the properties the reference lists for this endpoint." }
    send: { method: GET, path: /proxy/network/integration/v1/countries, query: { offset: "{offset}", limit: "{limit}", filter: "{filter}" } }
