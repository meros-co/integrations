quirks:
  - models: [all]
    severity: critical
    text: >
      power_cycle_port cuts a port's PoE power and turns it on again (the device on it restarts), restart_device
      restarts a switch, gateway or access point (everything behind it loses its link), and remove_device unadopts a
      device. Deleting or changing networks, firewall policies and zones, ACL rules, Wi-Fi broadcasts or DNS
      policies changes traffic at once; delete_network and delete_wifi_broadcast refuse a network or broadcast in
      use unless force is set.
  - models: [all]
    severity: info
    text: >
      API limits (11.0.97): a port's PoE can be power-cycled but not turned on or off, and a port's VLAN, profile,
      speed and enabled state cannot be read or written; networks (VLANs) are created, changed and deleted as a
      whole. LAGs, MC-LAG domains and switch stacks are read only. Statistics are the latest only.
  - models: [all]
    severity: info
    text: >
      State is polled: devices (each one's details, ports, PoE and radios, and latest statistics read after the
      list) and clients every 15 s, the rest every minute. Each list is read whole, 200 at a time (the most the API
      returns at once): the core asks for the next offset until a page holds fewer, and replaces the list in state
      once; the list commands take offset, limit and a filter to read one page. Nested and polymorphic properties (a firewall
      policy's source and destination, a Wi-Fi broadcast's security) are kept as JSON text; get_* commands return
      the full objects.
  - models: [all]
    severity: info
    text: >
      Request bodies (body) are the objects the reference defines for each operation, sent as given; the API
      validates them and answers 400 with its error otherwise. Ubiquiti's cloud connector (api.ui.com, the same
      API under /v1/connector/consoles/<console id>/proxy/network/integration) is not used: the console is reached
      on the local network.
