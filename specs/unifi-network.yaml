spec: 1
id: unifi-network
name: UniFi Network (Network API)
vendor: Ubiquiti
category: other
source:
  - title: "UniFi Network API reference, version 11.0.97 (OpenAPI document and Getting Started)"
    author: Ubiquiti
    url: "https://developer.ui.com/network/v11.0.97/gettingstarted"
    note: >
      The Network application's official API, served by a UniFi console at https://<console>/proxy/network/integration
      (and through Ubiquiti's cloud connector), with an API key created in the application sent in X-API-Key. Every
      operation of the 11.0.97 OpenAPI document (/network/v11.0.97/openapi.json): application info, sites, devices
      pending adoption, adopted devices (list, details with ports, PoE and radios, latest statistics, adopt,
      remove, restart), port actions (POWER_CYCLE of a port's PoE), connected clients and their guest-access
      actions, networks (VLANs), Wi-Fi broadcasts, firewall zones and policies and their ordering, ACL rules and
      their ordering, DNS policies, traffic matching lists, hotspot vouchers, WANs, VPN servers and site-to-site
      tunnels, RADIUS profiles, device tags, LAGs, MC-LAG domains, switch stacks, countries and DPI applications
      and categories; paging with offset and limit (25 by default, at most 200) and the filter syntax.

transport:
  type: http
  port: 443
  scheme: https
  # A console serves its own certificate.
  accept_invalid_certs: true
  auth: header
  auth_header: X-API-Key
  timeout_ms: 8000
  probe: { method: GET, path: /proxy/network/integration/v1/info }

settings:
  token: { type: string, secret: true, max_length: 256, label: API key,
           description: "An API key created in the Network application's Integrations section on the console (Create New API Key), sent as X-API-Key." }
  site_id: { type: string, pattern: '^[0-9A-Fa-f-]{36}$', max_length: 36, label: Site ID,
             select: { command: list_sites, items: $.data, id: $.id, label: $.name,
                       clears: [devices, clients, device_tags, networks, wifi_broadcasts, firewall_zones,
                                firewall_policies, acl_rules, dns_policies, traffic_matching_lists, vouchers, wans,
                                vpn_servers, vpn_tunnels, radius_profiles, lags, mc_lag_domains, switch_stacks,
                                acl_rule_order] },
             description: "The site this device reads and controls, as list_sites gives its id; may be left empty on opening (the sites, the application and devices pending adoption are still read) and chosen later with update_settings, which reads the site at once and clears the last site's state." }

ports:
  - { port: 443, protocol: https, role: control, note: "the UniFi console's web server" }

models:
  - id: network
    name: "UniFi Network application on a UniFi console (Cloud Gateway, Dream Machine, Cloud Key, UniFi OS Server), its switches, gateways and access points"
    supports: [list_countries, list_countries_filtered, list_dpi_applications, list_dpi_applications_filtered, list_dpi_application_categories, list_dpi_application_categories_filtered, get_application_info, list_pending_devices, list_pending_devices_filtered, list_sites, list_sites_filtered, list_acl_rules, list_acl_rules_filtered, create_acl_rule, get_user_defined_acl_rule_ordering, reorder_user_defined_acl_rules, delete_acl_rule, get_acl_rule, update_acl_rule, list_clients, list_clients_filtered, get_client, client_action, list_device_tags, list_device_tags_filtered, list_devices, list_devices_filtered, adopt_devices, remove_device, get_device, restart_device, power_cycle_port, get_device_statistics, list_dns_policies, list_dns_policies_filtered, create_dns_policy, delete_dns_policy, get_dns_policy, update_dns_policy, list_firewall_policies, list_firewall_policies_filtered, create_firewall_policy, get_user_defined_firewall_policy_ordering, reorder_user_defined_firewall_policies, delete_firewall_policy, get_firewall_policy, patch_firewall_policy, update_firewall_policy, list_firewall_zones, list_firewall_zones_filtered, create_custom_firewall_zone, delete_custom_firewall_zone, get_firewall_zone, update_firewall_zone, delete_vouchers, list_vouchers, list_vouchers_filtered, generate_vouchers, delete_voucher, get_voucher_details, list_networks, list_networks_filtered, create_network, delete_network, get_network_details, update_network, get_network_references, list_radius_profiles, list_radius_profiles_filtered, list_lags, list_lags_filtered, get_lag, list_mc_lag_domains, list_mc_lag_domains_filtered, get_mc_lag_domain, list_switch_stacks, list_switch_stacks_filtered, get_switch_stack, list_traffic_matching_lists, list_traffic_matching_lists_filtered, create_traffic_matching_list, delete_traffic_matching_list, get_traffic_matching_list, update_traffic_matching_list, list_vpn_servers, list_vpn_servers_filtered, list_site_to_site_vpn_tunnels, list_site_to_site_vpn_tunnels_filtered, list_wan_interfaces, list_wifi_broadcasts, list_wifi_broadcasts_filtered, create_wifi_broadcast, delete_wifi_broadcast, get_wifi_broadcast_details, update_wifi_broadcast]
    verification: none
    notes: >
      One device per site: devices, ports, clients and the site's configuration as the Network application reports
      them. The site may be chosen after opening, from sites.*. A switch's ports, PoE and uplinks are read through it; the application, not the switch, is reached.

commands:
  list_countries:
    summary: List Countries (GET /v1/countries)
    params:
      offset: { type: int, min: 0, max: 2147483647, default: 0, label: Offset, description: "How many items to skip before the first returned, from 0." }
      limit: { type: int, min: 0, max: 200, default: 25, label: Limit, description: "How many items to return, at most 200 (25 by default)." }
    send: { method: GET, path: /proxy/network/integration/v1/countries, query: { offset: "{offset}", limit: "{limit}" } }
    expect: { status: 200, json_path: $ }
    returns: value
  list_countries_filtered:
    summary: "List Countries (GET /v1/countries), filtered"
