      filter: { type: string, max_length: 4096, required: true, label: Filter, description: "A filter expression in the API's syntax, such as name.eq('Studio'), on the properties the reference lists for this endpoint." }
    send: { method: GET, path: /proxy/network/integration/v1/pending-devices, query: { offset: "{offset}", limit: "{limit}", filter: "{filter}" } }
