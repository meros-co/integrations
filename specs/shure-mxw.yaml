commands:
  get_device_id:
    summary: "Read the device ID (DEVICE_ID)"
    send: "GET DEVICE_ID"
    expect: { reply_contains: " DEVICE_ID ", matches: " DEVICE_ID \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_device_id:
    summary: "Set the device ID (DEVICE_ID)"
    params:
      value: { type: string, required: true, max_length: 31, pattern: "^[\\x20-\\x3b\\x3d\\x3f-\\x7a\\x7c\\x7e]+$", label: "Device ID", description: "1 to 8 characters on legacy MXW; 1 to 31 letters, digits and hyphens on MXW neXt (no hyphen first or last)." }
    send: "SET DEVICE_ID \\{{value}\\}"
    expect: { reply_contains: " DEVICE_ID ", contains: " DEVICE_ID " }
    returns: ack
  flash:
    summary: "Identify the device by flashing its lights (FLASH); it stops by itself"
    params:
      enabled: { type: bool, required: true, label: "Flash", description: "On flashes the lights, off stops them." }
    send: "SET FLASH {enabled:on_off}"
    expect: { reply_contains: " FLASH ", contains: " FLASH " }
    returns: ack
  flash_microphone:
    summary: "Identify a microphone by flashing its lights (FLASH on a channel); legacy MXW only, neXt answers ERROR"
    params:
      slot: { type: enum, values: [primary, secondary, bay, channel], default: primary, label: "Microphone", description: "primary (the channel's microphone), secondary (legacy MXW's second microphone, SEC), or on MXW neXt rack units bay (BAY, the dock bay on the MXWAPXD2) or channel (CH)." }
      channel: { type: int, min: 0, max: 8, required: true, label: "Channel", description: "Channel or bay from 1 (2, 4 or 8 by model); 0 is every one where the document allows it." }
      enabled: { type: bool, required: true, label: "Flash", description: "On flashes the microphone's lights, off stops them." }
    send: "SET {slot:map.slot}{channel} FLASH {enabled:on_off}"
    expect: { reply_contains: " FLASH ", contains: " FLASH " }
    returns: ack
  get_model:
    summary: "Read the model (DEVICE_MODEL)"
    send: "GET DEVICE_MODEL"
    expect: { reply_contains: " DEVICE_MODEL ", matches: " DEVICE_MODEL \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  get_firmware:
    summary: "Read the firmware version (a * after it: self test failed) (FW_VER)"
    send: "GET FW_VER"
    expect: { reply_contains: " FW_VER ", matches: " FW_VER \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  get_serial_number:
    summary: "Read the serial number (SERIAL_NUM)"
    send: "GET SERIAL_NUM"
    expect: { reply_contains: " SERIAL_NUM ", matches: " SERIAL_NUM \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  get_operation_mode:
    summary: "Read the system operation mode (SYSTEM_OPERATION_MODE)"
    send: "GET SYSTEM_OPERATION_MODE"
    expect: { reply_contains: " SYSTEM_OPERATION_MODE ", matches: " SYSTEM_OPERATION_MODE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_operation_mode:
    summary: "Set the system operation mode (SYSTEM_OPERATION_MODE)"
    params:
      mode: { type: enum, values: [PRESENTATION, CONFERENCE, DIRECT, CUSTOM], required: true, label: "Mode", description: "PRESENTATION, CONFERENCE, DIRECT or CUSTOM." }
    send: "SET SYSTEM_OPERATION_MODE {mode}"
    expect: { reply_contains: " SYSTEM_OPERATION_MODE ", contains: " SYSTEM_OPERATION_MODE " }
    returns: ack
  get_channel_count:
    summary: "Read the number of DECT channels (DECT_CHANNEL_COUNT)"
    send: "GET DECT_CHANNEL_COUNT"
    expect: { reply_contains: " DECT_CHANNEL_COUNT ", matches: " DECT_CHANNEL_COUNT \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  reboot:
    summary: "Restart the unit (REBOOT); not acknowledged"
    send: "SET REBOOT"
    returns: none
  get_all:
    summary: "Ask for every parameter (GET ALL); the answers update state"
    send: "GET ALL"
    returns: none
  get_automix_mute:
    summary: "Read the automix output mute (AUTOMIX_OUT_MUTE)"
    send: "GET AUTOMIX_OUT_MUTE"
    expect: { reply_contains: " AUTOMIX_OUT_MUTE ", matches: " AUTOMIX_OUT_MUTE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_automix_mute:
    summary: "Mute, unmute or toggle the automix output (AUTOMIX_OUT_MUTE)"
    params:
      state: { type: enum, values: [MUTE, ACTIVE, TOGGLE], required: true, label: "Mute", description: "MUTE mutes the automix output, ACTIVE unmutes it, TOGGLE switches it." }
    send: "SET AUTOMIX_OUT_MUTE {state}"
    expect: { reply_contains: " AUTOMIX_OUT_MUTE ", contains: " AUTOMIX_OUT_MUTE " }
    returns: ack
  set_meter_rate:
    summary: "Set a channel's metering interval (METER_RATE): SAMPLE messages at that interval, 0 to stop"
    params:
      slot: { type: enum, values: [primary, secondary, bay, channel], default: primary, label: "Microphone", description: "primary (the channel's microphone), secondary (legacy MXW's second microphone, SEC), or on MXW neXt rack units bay (BAY, the dock bay on the MXWAPXD2) or channel (CH)." }
      channel: { type: int, min: 0, max: 8, required: true, label: "Channel", description: "Channel or bay from 1 (2, 4 or 8 by model); 0 is every one where the document allows it." }
      rate_ms: { type: int, min: 0, max: 65535, required: true, label: "Metering interval", description: "Interval in ms from 100, or 0 to stop metering." }
    send: "SET {slot:map.slot}{channel} METER_RATE {rate_ms:05d}"
    expect: { reply_contains: " METER_RATE ", contains: " METER_RATE " }
    returns: ack
  get_meter_rate:
    summary: "Read a channel's metering interval (METER_RATE), MXW neXt"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Channel", description: "Channel or bay from 1 (2, 4 or 8 by model); 0 is every one where the document allows it." }
    send: "GET {channel} METER_RATE"
    expect: { reply_contains: " METER_RATE ", matches: " METER_RATE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  get_channel_name:
    summary: "Read a channel's name (CHAN_NAME)"
    params:
      slot: { type: enum, values: [primary, secondary, bay, channel], default: primary, label: "Microphone", description: "primary (the channel's microphone), secondary (legacy MXW's second microphone, SEC), or on MXW neXt rack units bay (BAY, the dock bay on the MXWAPXD2) or channel (CH)." }
      channel: { type: int, min: 0, max: 8, required: true, label: "Channel", description: "Channel or bay from 1 (2, 4 or 8 by model); 0 is every one where the document allows it." }
    send: "GET {slot:map.slot}{channel} CHAN_NAME"
    expect: { reply_contains: " CHAN_NAME ", matches: " CHAN_NAME \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_channel_name:
    summary: "Set a channel's name (CHAN_NAME), up to 8 characters"
    params:
      slot: { type: enum, values: [primary, secondary, bay, channel], default: primary, label: "Microphone", description: "primary (the channel's microphone), secondary (legacy MXW's second microphone, SEC), or on MXW neXt rack units bay (BAY, the dock bay on the MXWAPXD2) or channel (CH)." }
      channel: { type: int, min: 0, max: 8, required: true, label: "Channel", description: "Channel or bay from 1 (2, 4 or 8 by model); 0 is every one where the document allows it." }
