      enabled: { type: bool, required: true, label: "On", description: "On turns it on, off turns it off." }
    send: "SET {channel} AC_BC_ENCRYPTION {enabled:on_off}"
    expect: { reply_contains: " AC_BC_ENCRYPTION ", contains: " AC_BC_ENCRYPTION " }
    returns: ack
  get_auracast_power:
    summary: "Read the Auracast transmit power (all broadcasts) (AC_POWER)"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
    send: "GET {channel} AC_POWER"
    expect: { reply_contains: " AC_POWER ", matches: " AC_POWER \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_auracast_power:
    summary: "Set the Auracast transmit power (all broadcasts) (AC_POWER)"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
      value: { type: enum, values: [LOW, MED, HIGH], required: true, label: "Value", description: "One of LOW, MED, HIGH." }
    send: "SET {channel} AC_POWER {value}"
    expect: { reply_contains: " AC_POWER ", contains: " AC_POWER " }
    returns: ack
  get_auracast_quality:
    summary: "Read the Auracast quality of service (all broadcasts): LL low latency, HR high reliability (AC_BC_QOS)"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
    send: "GET {channel} AC_BC_QOS"
    expect: { reply_contains: " AC_BC_QOS ", matches: " AC_BC_QOS \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_auracast_quality:
    summary: "Set the Auracast quality of service (all broadcasts): LL low latency, HR high reliability (AC_BC_QOS)"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
      value: { type: enum, values: [LL, HR], required: true, label: "Value", description: "One of LL, HR." }
    send: "SET {channel} AC_BC_QOS {value}"
    expect: { reply_contains: " AC_BC_QOS ", contains: " AC_BC_QOS " }
    returns: ack
  get_auracast_sample_rate:
    summary: "Read an Auracast broadcast's sample rate (AC_BC_SAMPLE_RATE)"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
    send: "GET {channel} AC_BC_SAMPLE_RATE"
    expect: { reply_contains: " AC_BC_SAMPLE_RATE ", matches: " AC_BC_SAMPLE_RATE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_auracast_sample_rate:
    summary: "Set an Auracast broadcast's sample rate in Hz (AC_BC_SAMPLE_RATE); allowed rates are not documented"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
      hz: { type: int, min: 8000, max: 48000, required: true, label: "Sample rate", description: "Sample rate in Hz, as the access point accepts it." }
    send: "SET {channel} AC_BC_SAMPLE_RATE {hz}Hz"
    expect: { reply_contains: " AC_BC_SAMPLE_RATE ", contains: " AC_BC_SAMPLE_RATE " }
    returns: ack
  get_auracast_name:
    summary: "Read an Auracast broadcast's name (AC_BC_NAME)"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
    send: "GET {channel} AC_BC_NAME"
    expect: { reply_contains: " AC_BC_NAME ", matches: " AC_BC_NAME \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_auracast_name:
    summary: "Set an Auracast broadcast's name (AC_BC_NAME), 4-31 characters, only while the broadcast is off"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
      value: { type: string, required: true, max_length: 31, pattern: "^[^<>{}]{4,31}$", label: "Value", description: "4 to 31 characters, without < > { }." }
    send: "SET {channel} AC_BC_NAME \\{{value}\\}"
    expect: { reply_contains: " AC_BC_NAME ", contains: " AC_BC_NAME " }
    returns: ack
  get_auracast_code:
    summary: "Read an Auracast broadcast's code (AC_BC_CODE)"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
    send: "GET {channel} AC_BC_CODE"
    expect: { reply_contains: " AC_BC_CODE ", matches: " AC_BC_CODE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_auracast_code:
    summary: "Set an Auracast broadcast's code (AC_BC_CODE), 4-16 characters, only while the broadcast is off"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
      value: { type: string, required: true, max_length: 16, pattern: "^[^<>{}]{4,16}$", label: "Value", description: "4 to 16 characters, without < > { }." }
    send: "SET {channel} AC_BC_CODE \\{{value}\\}"
    expect: { reply_contains: " AC_BC_CODE ", contains: " AC_BC_CODE " }
    returns: ack

