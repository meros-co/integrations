    expect: { reply_contains: " INPUT_CH_GAIN ", contains: " INPUT_CH_GAIN " }
    returns: ack
  get_input_mute:
    summary: "Read an input's mute (INPUT_CH_MUTE)"
    params:
      channel: { type: int, min: 0, max: 61, required: true, label: "Channel", description: "Inputs: 1-19 Dante (1-5 Dante in, 6-19 Dante mic in), 21-39 wireless microphones, 41 analog (MXWAPXD2), 51 USB; outputs: 1-9 Dante (4 on MXWAPXD2, 5 on MXWAPX4), 41-42 analog, 51 USB, 61 back channel; 0 is all." }
    send: "GET {channel} INPUT_CH_MUTE"
    expect: { reply_contains: " INPUT_CH_MUTE ", matches: " INPUT_CH_MUTE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_input_mute:
    summary: "Mute, unmute or toggle an input (INPUT_CH_MUTE)"
