  auracast.*.code: { type: string, description: "An Auracast broadcast's code, keyed by Auracast channel" }

telemetry:
  # The device ID, and every channel's or bay's parameters. Changes are
  # pushed after that (see the quirks).
  poll:
    send:
      - "GET DEVICE_ID"
      - { models: [mxwapxd2, mxwapx4, mxwapx8, mxwndx4, mxwndx8, mxwndx4g, mxwndx8g], message: "GET ALL" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 CHAN_NAME" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 TX_AVAILABLE" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 TX_STATUS" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 AUDIO_GAIN" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 INT_AUDIO_GAIN" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 BUTTON_STS" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 LED_STATUS" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 TX_TYPE" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 BP_MIC_SELECT" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 BATT_CHARGE" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 BATT_RUN_TIME" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 BATT_HEALTH" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 BATT_TIME_TO_FULL" }
      - { models: [mxwapt2, mxwapt4, mxwapt8], message: "GET 0 TX_DEVICE_ID" }
      - { models: [mxwncs2, mxwncs4, mxwncs8], message: "GET 0 TX_AVAILABLE" }
      - { models: [mxwncs2, mxwncs4, mxwncs8], message: "GET 0 TX_STATUS" }
      - { models: [mxwncs2, mxwncs4, mxwncs8], message: "GET 0 BATT_CHARGE" }
      - { models: [mxwncs2, mxwncs4, mxwncs8], message: "GET 0 BATT_HEALTH" }
      - { models: [mxwncs2, mxwncs4, mxwncs8], message: "GET 0 BATT_TIME_TO_FULL" }
      - { models: [mxwncs2, mxwncs4, mxwncs8], message: "GET 0 TX_DEVICE_ID" }
  updates:
    - match: "^< REP DEVICE_ID \\{?(.*?) *\\}? >$"
      state: { "device.id": "{1}" }
    - match: "^< REP FLASH (ON|OFF) >$"
      state: { "device.flash": { value: "{1}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP DEVICE_MODEL \\{?(.*?) *\\}? >$"
      state: { "device.model": "{1}" }
    - match: "^< REP FW_VER \\{?(.*?) *\\}? >$"
      state: { "device.firmware": "{1}" }
    - match: "^< REP SERIAL_NUM \\{?(.*?) *\\}? >$"
      state: { "device.serial_number": "{1}" }
    - match: "^< REP SYSTEM_OPERATION_MODE ([A-Z]+) >$"
      state: { "device.operation_mode": "{1}" }
    - match: "^< REP DECT_CHANNEL_COUNT (\\d+) >$"
      state: { "device.channel_count": "{1}" }
    - match: "^< REP AUTOMIX_OUT_MUTE (MUTED?|ACTIVE) >$"
      state: { "device.automix_muted": { value: "{1}", map: { "MUTED": true, "MUTE": true, "ACTIVE": false } } }
    - match: "^< REP (?:PRI |CH )?(\\d+) METER_RATE (\\d{5}) >$"
      state: { "channels.{1}.meter_rate": "{2}" }
    - match: "^< REP SEC (\\d+) METER_RATE (\\d{5}) >$"
      state: { "channels.{1}.secondary.meter_rate": "{2}" }
    - match: "^< SAMPLE (\\d+) (\\d{3}) (\\d{3}) >$"
      state: { "channels.{1}.rf_level": "{2:-110}", "channels.{1}.audio_level": "{3:-120}" }
    - match: "^< SAMPLE SEC (\\d+) (\\d{3}) (\\d{3}) >$"
      state: { "channels.{1}.secondary.rf_level": "{2:-110}", "channels.{1}.secondary.audio_level": "{3:-120}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) CHAN_NAME \\{?(.*?) *\\}? >$"
      state: { "channels.{1}.name": "{2}" }
    - match: "^< REP SEC (\\d+) CHAN_NAME \\{?(.*?) *\\}? >$"
      state: { "channels.{1}.secondary.name": "{2}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) TX_AVAILABLE (YES|NO) >$"
      state: { "channels.{1}.transmitter_available": "{2}" }
    - match: "^< REP SEC (\\d+) TX_AVAILABLE (YES|NO) >$"
      state: { "channels.{1}.secondary.transmitter_available": "{2}" }
    - match: "^< REP BAY (\\d+) TX_AVAILABLE (YES|NO) >$"
      state: { "bays.{1}.transmitter_available": "{2}" }
    - match: "^< REP (\\d+) TX_AVAILABLE YES >$"
      then_send: ["GET {1} TX_STATUS", "GET {1} AUDIO_GAIN", "GET {1} BATT_RUN_TIME", "GET {1} BATT_CHARGE", "GET {1} BATT_HEALTH", "GET {1} BUTTON_STS", "GET {1} LED_STATUS", "GET {1} TX_TYPE"]
    - match: "^< REP (?:PRI |CH )?(\\d+) TX_STATUS ([A-Z_]+) >$"
      state: { "channels.{1}.transmitter_status": "{2}" }
    - match: "^< REP SEC (\\d+) TX_STATUS ([A-Z_]+) >$"
      state: { "channels.{1}.secondary.transmitter_status": "{2}" }
    - match: "^< REP BAY (\\d+) TX_STATUS ([A-Z_]+) >$"
      state: { "bays.{1}.transmitter_status": "{2}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) AUDIO_GAIN (0\\d\\d) >$"
      state: { "channels.{1}.gain": "{2:-25}" }
    - match: "^< REP SEC (\\d+) AUDIO_GAIN (0\\d\\d) >$"
      state: { "channels.{1}.secondary.gain": "{2:-25}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) INT_AUDIO_GAIN (0\\d\\d) >$"
      state: { "channels.{1}.internal_mic_gain": "{2:-25}" }
    - match: "^< REP SEC (\\d+) INT_AUDIO_GAIN (0\\d\\d) >$"
      state: { "channels.{1}.secondary.internal_mic_gain": "{2:-25}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) BUTTON_STS (ON|OFF) >$"
      state: { "channels.{1}.button": "{2}" }
    - match: "^< REP SEC (\\d+) BUTTON_STS (ON|OFF) >$"
      state: { "channels.{1}.secondary.button": "{2}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) LED_STATUS ([A-Z]{2} [A-Z]{2}) >$"
      state: { "channels.{1}.led": "{2}" }
    - match: "^< REP SEC (\\d+) LED_STATUS ([A-Z]{2} [A-Z]{2}) >$"
      state: { "channels.{1}.secondary.led": "{2}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) TX_TYPE ([A-Z0-9_]+) >$"
      state: { "channels.{1}.transmitter_type": "{2}" }
    - match: "^< REP SEC (\\d+) TX_TYPE ([A-Z0-9_]+) >$"
      state: { "channels.{1}.secondary.transmitter_type": "{2}" }
    - match: "^< REP BAY (\\d+) TX_TYPE ([A-Z0-9_]+) >$"
      state: { "bays.{1}.transmitter_type": "{2}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) BP_MIC_SELECT ([A-Z]+) >$"
      state: { "channels.{1}.bodypack_mic": "{2}" }
    - match: "^< REP SEC (\\d+) BP_MIC_SELECT ([A-Z]+) >$"
      state: { "channels.{1}.secondary.bodypack_mic": "{2}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) BATT_CHARGE (0\\d\\d|100) >$"
      state: { "channels.{1}.battery_charge": "{2}" }
    - match: "^< REP SEC (\\d+) BATT_CHARGE (0\\d\\d|100) >$"
      state: { "channels.{1}.secondary.battery_charge": "{2}" }
    - match: "^< REP BAY (\\d+) BATT_CHARGE (0\\d\\d|100) >$"
      state: { "bays.{1}.battery_charge": "{2}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) BATT_RUN_TIME (\\d{5}) >$"
      state: { "channels.{1}.battery_minutes": "{2}" }
    - match: "^< REP SEC (\\d+) BATT_RUN_TIME (\\d{5}) >$"
      state: { "channels.{1}.secondary.battery_minutes": "{2}" }
    - match: "^< REP BAY (\\d+) BATT_RUN_TIME (\\d{5}) >$"
      state: { "bays.{1}.battery_minutes": "{2}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) BATT_HEALTH (0\\d\\d|100) >$"
      state: { "channels.{1}.battery_health": "{2}" }
    - match: "^< REP SEC (\\d+) BATT_HEALTH (0\\d\\d|100) >$"
      state: { "channels.{1}.secondary.battery_health": "{2}" }
    - match: "^< REP BAY (\\d+) BATT_HEALTH (0\\d\\d|100) >$"
      state: { "bays.{1}.battery_health": "{2}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) BATT_TIME_TO_FULL (\\d{5}) >$"
      state: { "channels.{1}.battery_time_to_full": "{2}" }
    - match: "^< REP SEC (\\d+) BATT_TIME_TO_FULL (\\d{5}) >$"
      state: { "channels.{1}.secondary.battery_time_to_full": "{2}" }
    - match: "^< REP BAY (\\d+) BATT_TIME_TO_FULL (\\d{5}) >$"
      state: { "bays.{1}.battery_time_to_full": "{2}" }
    - match: "^< REP (?:PRI |CH )?(\\d+) TX_DEVICE_ID \\{?(.*?) *\\}? >$"
      state: { "channels.{1}.transmitter_name": "{2}" }
    - match: "^< REP SEC (\\d+) TX_DEVICE_ID \\{?(.*?) *\\}? >$"
      state: { "channels.{1}.secondary.transmitter_name": "{2}" }
    - match: "^< REP BAY (\\d+) TX_DEVICE_ID \\{?(.*?) *\\}? >$"
      state: { "bays.{1}.transmitter_name": "{2}" }
    - match: "^< REP (\\d+) INPUT_CH_GAIN (\\d{1,4}) >$"
      state: { "inputs.{1}.gain": "{2:from.shure_gain}" }
    - match: "^< REP (\\d+) INPUT_CH_MUTE (MUTED?|ACTIVE) >$"
      state: { "inputs.{1}.muted": { value: "{2}", map: { "MUTED": true, "MUTE": true, "ACTIVE": false } } }
    - match: "^< REP (\\d+) OUTPUT_CH_GAIN (\\d{1,4}) >$"
      state: { "outputs.{1}.gain": "{2:from.shure_gain}" }
    - match: "^< REP (\\d+) OUTPUT_CH_MUTE (MUTED?|ACTIVE) >$"
      state: { "outputs.{1}.muted": { value: "{2}", map: { "MUTED": true, "MUTE": true, "ACTIVE": false } } }
    - match: "^< REP (\\d+) AC_BC_ENABLE (ON|OFF) >$"
      state: { "auracast.{1}.broadcast": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) AC_BC_ENCRYPTION (ON|OFF) >$"
      state: { "auracast.{1}.encryption": { value: "{2}", map: { "ON": true, "OFF": false } } }
    - match: "^< REP (\\d+) AC_POWER ([A-Z]+) >$"
      state: { "auracast.{1}.power": "{2}" }
    - match: "^< REP (\\d+) AC_BC_QOS ([A-Z]+) >$"
      state: { "auracast.{1}.quality": "{2}" }
    - match: "^< REP (\\d+) AC_BC_SAMPLE_RATE (\\d+)Hz >$"
      state: { "auracast.{1}.sample_rate": "{2}" }
    - match: "^< REP (\\d+) AC_BC_NAME \\{?(.*?) *\\}? >$"
      state: { "auracast.{1}.name": "{2}" }
    - match: "^< REP (\\d+) AC_BC_CODE \\{?(.*?) *\\}? >$"
      state: { "auracast.{1}.code": "{2}" }

quirks:
  - models: [all]
    severity: info
    text: >
      Every change is reported unasked; metered values come as SAMPLE only while a meter rate is set
      (never started here; a consumer sets one). On connecting the core asks for the device ID and
      for every channel's or bay's parameters (GET 0 ALL on neXt rack units, which document it; one
      GET per parameter elsewhere). Opened for commands only, nothing is asked.
  - models: [all]
    severity: info
    text: >
      When a transmitter becomes available (TX_AVAILABLE NO to YES) Shure advises reading its
      status, gains, battery, button, LED and type again; the core does so for the channel
      (then_send). Values 252-255 (three digits) and 65532-65535 (five digits) mean not available;
      battery minutes 65532 powered by a wall charger, 65533 on charger, 65534 calculating, 65535
      off.
  - models: [all]
    severity: info
    text: >
      Commands are matched to their REP by the parameter name, not by the channel: a change to the
      same parameter on another channel arriving in the same moment could be taken for the answer.
      An error answer is < REP ERR > (neXt also < ERROR >).
  - models: [mxwapt2, mxwapt4, mxwapt8, mxwapxd2, mxwapx4, mxwapx8]
    severity: info
    text: >
      LED_STATUS can be set only with External LED Control chosen in the web application (else REP
      ERR); with Mute Preference set to External Mute a microphone never reports MUTE.
  - models: [mxwapt2, mxwapt4, mxwapt8, mxwapxd2, mxwapx4, mxwapx8]
    severity: critical
    text: >
      unlink removes a transmitter's link to the channel at once, even while it is off or on a non-
      networked charger, after which it cannot reconnect until linked again; set_transmitter_status
      OFF turns a microphone off.
  - models: [mxwapxd2, mxwapx4, mxwapx8, mxwndx4, mxwndx8, mxwndx4g, mxwndx8g]
    severity: critical
    text: >
      reboot restarts the unit, interrupting audio, and is not acknowledged.
  - models: [mxwapxd2, mxwapx4, mxwapx8]
    severity: info
    text: >
      Auracast commands take the Auracast channel (not the microphone channel) and may answer ERR
      without a licence or with an invalid configuration; names and codes can be set only while the
      broadcast is off.
