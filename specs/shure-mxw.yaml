spec: 1
id: shure-mxw
name: "Shure Microflex Wireless (MXW and MXW neXt access points and charging stations)"
vendor: Shure
category: wireless

# Microflex Wireless command strings on TCP 2202: GET, SET and REP in angle
# brackets, a REP pushed whenever a value changes (metered values aside), and
# SAMPLE meters while a meter rate is set. Commands for microphones go to the
# access point, which relays them; charging stations take their own. On legacy
# MXW a channel can have a primary and a secondary microphone (SEC before the
# channel number); MXW neXt rack units also take BAY or CH before it, and accept
# the legacy strings except where noted.
# The gains of the neXt audio channels use the shure_gain conversion.
source:
  - title: "Microflex Wireless Command Strings, Version 2.4 (2025-C)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/MXW/en-US"
    note: >
      Manufacturer document (PDF docId 7282, page numbers the PDF's). TCP 2202, the controller the
      client, GET/SET/REP/SAMPLE and REP on change p.3; SEC and PRI microphones p.3; recommended re-
      reads when TX_AVAILABLE turns YES p.4; External LED Control and External Mute p.5-6, p.12;
      CHAN_NAME (8 characters set, 31 reported) and DEVICE_ID p.8-9; UNLINK, FLASH, METER_RATE and
      SAMPLE p.9-10; TX_AVAILABLE, TX_STATUS, AUDIO_GAIN (000-060, minus 25 dB) with INC/DEC,
      INT_AUDIO_GAIN (000-040), BUTTON_STS, LED_STATUS (ON, OF, ST, FL, PU, NC), TX_TYPE,
      BP_MIC_SELECT, BATT_CHARGE, BATT_RUN_TIME (65532-65535), BATT_HEALTH, BATT_TIME_TO_FULL,
      TX_DEVICE_ID (12 characters) p.11-18; MXWNCS REMOTE_LINK and TX_DEVICE_ID p.18-19; REP ERR and
      the 252-255 and 65532-65535 codes p.20. Further charger commands for an unlinked microphone
      are given only by Shure support (p.18) and are not here.
  - title: "MXWneXt Command Strings, Version 3.0 (2026-J)"
    author: Shure Incorporated
    url: "https://www.shure.com/en-US/docs/commandstrings/MXWneXt"
    note: >
      Manufacturer document (PDF docId 10684). Legacy strings accepted except where noted p.4; GET
      ALL, FLASH (no microphone identify on neXt), DEVICE_MODEL, SYSTEM_OPERATION_MODE, FW_VER,
      SERIAL_NUM, DEVICE_ID (1-31 characters), METER_RATE with GET (RF 000-127 for dBm + 110, audio
      000-120 for dB + 120), REBOOT p.4-8; AUDIO_GAIN on neXt (000-040) and INPUT_CH_GAIN (0-1400 in
      tenths offset by 1100; Dante 1-19, wireless 21-39, analog 41, USB 51), INPUT_CH_MUTE,
      OUTPUT_CH_GAIN, OUTPUT_CH_MUTE (Dante 1-9, analog 41-42, USB 51, back channel 61),
      AUTOMIX_OUT_MUTE, CHAN_NAME, DECT_CHANNEL_COUNT, REMOTE_LINK, UNLINK p.9-16; TX_STATUS,
      TX_AVAILABLE, TX_DEVICE_ID, TX_TYPE and TX_MODEL, BP_MIC_SELECT (with SET), LED_STATUS,
      BUTTON_STS, BAY and CH p.17-20; BATT_HEALTH, BATT_RUN_TIME, BATT_TIME_TO_FULL (65533-65535),
      BATT_CHARGE p.20-22; Auracast AC_BC_ENABLE, AC_BC_ENCRYPTION, AC_BC_NAME, AC_BC_CODE,
      AC_POWER, AC_BC_SAMPLE_RATE, AC_BC_QOS p.22-26.

transport:
  type: line-tcp
  port: 2202
  framing: delimited
  open: "< "
  close: " >"
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # Answers and change reports are both REP: commands name the parameter
  # their REP carries (expect.reply_contains).
  reply_match: "^< (?:REP |ERROR)"
  error_match: "^< (?:REP ERR|ERROR) ?>"
  probe: "GET DEVICE_ID"

conversions:
  # INPUT_CH_GAIN and OUTPUT_CH_GAIN: tenths of a dB offset by 1100 (0-1400 = -110.0 to +30.0 dB)
  shure_gain:
    points: [[0, -110.0], [1400, 30.0]]

ports:
  - { port: 2202, protocol: tcp, role: control }

maps:
  slot: { "primary": "", "secondary": "SEC ", "bay": "BAY ", "channel": "CH " }

