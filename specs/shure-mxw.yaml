    expect: { reply_contains: " OUTPUT_CH_GAIN ", matches: " OUTPUT_CH_GAIN \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_output_gain:
    summary: "Set an output's gain in tenths of a dB (OUTPUT_CH_GAIN)"
    params:
      channel: { type: int, min: 0, max: 61, required: true, label: "Channel", description: "Inputs: 1-19 Dante (1-5 Dante in, 6-19 Dante mic in), 21-39 wireless microphones, 41 analog (MXWAPXD2), 51 USB; outputs: 1-9 Dante (4 on MXWAPXD2, 5 on MXWAPX4), 41-42 analog, 51 USB, 61 back channel; 0 is all." }
      gain_tenth_db: { type: int, min: -1100, max: 300, required: true, label: "Gain", description: "Gain in tenths of a dB, -1100 (-110.0 dB) to 300 (+30.0 dB)." }
    send: "SET {channel} OUTPUT_CH_GAIN {gain_tenth_db:+1100}"
    expect: { reply_contains: " OUTPUT_CH_GAIN ", contains: " OUTPUT_CH_GAIN " }
    returns: ack
  increase_output_gain:
    summary: "Increase an output's gain by a step in tenths of a dB (OUTPUT_CH_GAIN INC)"
    params:
      channel: { type: int, min: 0, max: 61, required: true, label: "Channel", description: "Inputs: 1-19 Dante (1-5 Dante in, 6-19 Dante mic in), 21-39 wireless microphones, 41 analog (MXWAPXD2), 51 USB; outputs: 1-9 Dante (4 on MXWAPXD2, 5 on MXWAPX4), 41-42 analog, 51 USB, 61 back channel; 0 is all." }
      step: { type: int, min: 1, max: 1400, required: true, label: "Step", description: "Amount to change the gain by, in tenths of a dB." }
    send: "SET {channel} OUTPUT_CH_GAIN INC {step}"
    expect: { reply_contains: " OUTPUT_CH_GAIN ", contains: " OUTPUT_CH_GAIN " }
    returns: ack
  decrease_output_gain:
    summary: "Decrease an output's gain by a step in tenths of a dB (OUTPUT_CH_GAIN DEC)"
    params:
      channel: { type: int, min: 0, max: 61, required: true, label: "Channel", description: "Inputs: 1-19 Dante (1-5 Dante in, 6-19 Dante mic in), 21-39 wireless microphones, 41 analog (MXWAPXD2), 51 USB; outputs: 1-9 Dante (4 on MXWAPXD2, 5 on MXWAPX4), 41-42 analog, 51 USB, 61 back channel; 0 is all." }
      step: { type: int, min: 1, max: 1400, required: true, label: "Step", description: "Amount to change the gain by, in tenths of a dB." }
    send: "SET {channel} OUTPUT_CH_GAIN DEC {step}"
    expect: { reply_contains: " OUTPUT_CH_GAIN ", contains: " OUTPUT_CH_GAIN " }
    returns: ack
  get_output_mute:
    summary: "Read an output's mute (OUTPUT_CH_MUTE)"
    params:
      channel: { type: int, min: 0, max: 61, required: true, label: "Channel", description: "Inputs: 1-19 Dante (1-5 Dante in, 6-19 Dante mic in), 21-39 wireless microphones, 41 analog (MXWAPXD2), 51 USB; outputs: 1-9 Dante (4 on MXWAPXD2, 5 on MXWAPX4), 41-42 analog, 51 USB, 61 back channel; 0 is all." }
    send: "GET {channel} OUTPUT_CH_MUTE"
    expect: { reply_contains: " OUTPUT_CH_MUTE ", matches: " OUTPUT_CH_MUTE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_output_mute:
    summary: "Mute, unmute or toggle an output (OUTPUT_CH_MUTE)"
    params:
      channel: { type: int, min: 0, max: 61, required: true, label: "Channel", description: "Inputs: 1-19 Dante (1-5 Dante in, 6-19 Dante mic in), 21-39 wireless microphones, 41 analog (MXWAPXD2), 51 USB; outputs: 1-9 Dante (4 on MXWAPXD2, 5 on MXWAPX4), 41-42 analog, 51 USB, 61 back channel; 0 is all." }
      state: { type: enum, values: [MUTE, ACTIVE, TOGGLE], required: true, label: "Mute", description: "MUTE mutes, ACTIVE unmutes, TOGGLE switches." }
    send: "SET {channel} OUTPUT_CH_MUTE {state}"
    expect: { reply_contains: " OUTPUT_CH_MUTE ", contains: " OUTPUT_CH_MUTE " }
    returns: ack
  get_auracast_broadcast:
    summary: "Read an Auracast broadcast (AC_BC_ENABLE)"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
    send: "GET {channel} AC_BC_ENABLE"
    expect: { reply_contains: " AC_BC_ENABLE ", matches: " AC_BC_ENABLE \\{?(.*?) *\\}? *(?:>|\\*)$" }
    returns: value
  set_auracast_broadcast:
    summary: "Turn an Auracast broadcast on or off (AC_BC_ENABLE)"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
      enabled: { type: bool, required: true, label: "On", description: "On turns it on, off turns it off." }
    send: "SET {channel} AC_BC_ENABLE {enabled:on_off}"
    expect: { reply_contains: " AC_BC_ENABLE ", contains: " AC_BC_ENABLE " }
    returns: ack
  get_auracast_encryption:
    summary: "Read an Auracast broadcast's encryption (AC_BC_ENCRYPTION)"
    params:
      channel: { type: int, min: 0, max: 8, required: true, label: "Auracast channel", description: "Auracast broadcast channel from 1 (not the microphone channel); 0 is all." }
    send: "GET {channel} AC_BC_ENCRYPTION"
