        - { method: POST, path: /sony/appControl, content_type: application/json, body: '{"method":"getApplicationList","id":1,"params":[],"version":"1.0"}' }
        - { method: POST, path: /sony/avContent, content_type: application/json, body: '{"method":"getSchemeList","id":1,"params":[],"version":"1.0"}' }
        - { method: POST, path: /sony/avContent, content_type: application/json, body: '{"method":"getSourceList","id":1,"params":[{"scheme":"extInput"}],"version":"1.0"}' }
        - { method: POST, path: /sony/guide, content_type: application/json, body: '{"method":"getSupportedApiInfo","id":1,"params":[{"services":[]}],"version":"1.0"}' }
  updates:
    - path: "^/sony/system$"
      request_match: { "$.method": "^getPowerStatus$" }
      json: { status: "$.result[0].status" }
      state: { power: "{status}" }
    - path: "^/sony/audio$"
      request_match: { "$.method": "^getVolumeInformation$" }
      json_each: "$.result[0]"
      json: { target: "$.target", volume: "$.volume", mute: "$.mute", max: "$.maxVolume", min: "$.minVolume" }
      state:
        "audio.{target:key}.volume": "{volume}"
        "audio.{target:key}.mute": "{mute}"
        "audio.{target:key}.max": "{max}"
        "audio.{target:key}.min": "{min}"
    - path: "^/sony/avContent$"
      request_match: { "$.method": "^getPlayingContentInfo$" }
