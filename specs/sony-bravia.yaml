      request_match: { "$.method": "^getWebAppStatus$" }
      json: { active: "$.result[0].active", url: "$.result[0].url" }
      state: { webapp.active: "{active}", webapp.url: "{url}" }
    - path: "^/sony/appControl$"
      request_match: { "$.method": "^getApplicationList$" }
      json_match: { "$.result[0]": "^\\[" }
      json_each: "$.result[0]"
      json: { title: "$.title", uri: "$.uri", icon: "$.icon" }
      replace: apps.list
      state: { "apps.list.{index}.title": "{title}", "apps.list.{index}.uri": "{uri}", "apps.list.{index}.icon": "{icon}" }
    - path: "^/sony/system$"
      request_match: { "$.method": "^getSystemInformation$" }
