    - path: "^/sony/system$"
      request_match: { "$.method": "^getLEDIndicatorStatus$" }
      json: { mode: "$.result[0].mode", status: "$.result[0].status" }
      state: { led.mode: "{mode}", led.lit: "{status}" }
    - path: "^/sony/system$"
      request_match: { "$.method": "^getWolMode$" }
      json: { enabled: "$.result[0].enabled" }
      state: { wake_on_lan: "{enabled}" }
    - path: "^/sony/video$"
      request_match: { "$.method": "^getPictureQualitySettings$" }
      json_match: { "$.result[0]": "^\\[" }
      json_each: "$.result[0]"
      json: { target: "$.target", value: "$.currentValue", available: "$.isAvailable", candidates: "$.candidate" }
      replace: picture
      state:
        "picture.{target:key}.value": "{value}"
        "picture.{target:key}.available": "{available}"
        "picture.{target:key}.candidates": "{candidates}"
    - path: "^/sony/videoScreen$"
      request_match: { "$.method": "^getSceneSetting$" }
      json: { value: "$.result[0].currentValue", candidates: "$.result[0].candidate" }
      state: { scene.value: "{value}", scene.candidates: "{candidates}" }
    - path: "^/sony/audio$"
      request_match: { "$.method": "^getSpeakerSettings$" }
      json_each: "$.result[0]"
      json: { target: "$.target", value: "$.currentValue" }
      state: { "speaker.{target:key}": "{value}" }
    - path: "^/sony/system$"
      request_match: { "$.method": "^getCurrentTime$", "$.version": "^1\\.1$" }
      json: { time: "$.result[0].dateTime", tz: "$.result[0].timeZoneOffsetMinute", dst: "$.result[0].dstOffsetMinute" }
      state: { clock.time: "{time}", clock.timezone_offset_min: "{tz}", clock.dst_offset_min: "{dst}" }
    - path: "^/sony/appControl$"
      request_match: { "$.method": "^getApplicationStatusList$" }
