        mac: "$.result[0].macAddr"
        language: "$.result[0].language"
        region: "$.result[0].region"
        area: "$.result[0].area"
        cid: "$.result[0].cid"
        generation: "$.result[0].generation"
        firmware: "$.result[0].fwVersion"
        android: "$.result[0].androidOs"
        webapp: "$.result[0].webAppRuntimeVersion"
        mode: "$.result[0].mode"
      state:
        system.product: "{product}"
        system.name: "{name}"
        system.model: "{model}"
        system.serial: "{serial}"
        system.mac: "{mac}"
        system.language: "{language}"
        system.region: "{region}"
        system.area: "{area}"
        system.cid: "{cid}"
        system.generation: "{generation}"
        system.firmware: "{firmware}"
        system.android: "{android}"
        system.webapp_runtime: "{webapp}"
        system.mode: "{mode}"
    - path: "^/sony/system$"
      request_match: { "$.method": "^getInterfaceInformation$" }
      json:
        category: "$.result[0].productCategory"
        product: "$.result[0].productName"
        model: "$.result[0].modelName"
        server: "$.result[0].serverName"
        version: "$.result[0].interfaceVersion"
      state:
        interface.product_category: "{category}"
        interface.product_name: "{product}"
        interface.model_name: "{model}"
        interface.server_name: "{server}"
        interface.version: "{version}"
    - path: "^/sony/system$"
      request_match: { "$.method": "^getNetworkSettings$", "$.params[0].netif": "^$" }
