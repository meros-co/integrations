    - path: "^/sony/avContent$"
      request_match: { "$.method": "^getCurrentExternalInputsStatus$" }
      json_match: { "$.result[0]": "^\\[" }
      json_each: "$.result[0]"
      json: { uri: "$.uri", title: "$.title", label: "$.label", connection: "$.connection", icon: "$.icon", status: "$.status" }
      replace: inputs
      state:
        "inputs.{index}.uri": "{uri}"
        "inputs.{index}.title": "{title}"
        "inputs.{index}.label": "{label}"
        "inputs.{index}.connected": "{connection}"
        "inputs.{index}.icon": "{icon}"
        "inputs.{index}.signal": "{status}"
    - path: "^/sony/system$"
