      json_each: "$.result[0]"
      json: { netif: "$.netif", mac: "$.hwAddr", ipv4: "$.ipAddrV4", ipv6: "$.ipAddrV6", netmask: "$.netmask", gateway: "$.gateway", dns: "$.dns" }
      replace: network
      state:
        "network.{netif:key}.mac": "{mac}"
        "network.{netif:key}.ipv4": "{ipv4}"
        "network.{netif:key}.ipv6": "{ipv6}"
        "network.{netif:key}.netmask": "{netmask}"
        "network.{netif:key}.gateway": "{gateway}"
        "network.{netif:key}.dns": "{dns}"
    - path: "^/sony/system$"
      request_match: { "$.method": "^getRemoteDeviceSettings$" }
      json_each: "$.result[0]"
      each_match: { "$.target": "^accessPermission$" }
      json: { value: "$.currentValue" }
      state: { remote_access: "{value}" }
    - path: "^/sony/system$"
      request_match: { "$.method": "^getSystemSupportedFunction$" }
      json_each: "$.result[0]"
      json: { option: "$.option", value: "$.value" }
      state: { "functions.{option:key}": "{value}" }
    - path: "^/sony/system$"
      request_match: { "$.method": "^getRemoteControllerInfo$" }
      json_match: { "$.result[1]": "^\\[" }
      json_each: "$.result[1]"
      json: { name: "$.name", value: "$.value" }
      replace: ircc_codes
      state: { "ircc_codes.{name:key}": "{value}" }
    - path: "^/sony/avContent$"
      request_match: { "$.method": "^getSchemeList$" }
      json: { schemes: "$.result[0]" }
      state: { content.schemes: "{schemes}" }
    - path: "^/sony/avContent$"
      request_match: { "$.method": "^getSourceList$", "$.params[0].scheme": "^([A-Za-z]+)$" }
      json: { sources: "$.result[0]" }
      state: { "content.sources.{1}": "{sources}" }
    - path: "^/sony/guide$"
      request_match: { "$.method": "^getSupportedApiInfo$" }
      json: { apis: "$.result[0]" }
      state: { supported_apis: "{apis}" }
