      band7: { type: int, min: -8, max: 8, required: true, label: "8000 Hz gain", description: "Gain at 8000 Hz in dB, -8 to +8." }
    send: { method: PUT, path: /api/audio/inputs/internalMic/customEq, body: '[{band1},{band2},{band3},{band4},{band5},{band6},{band7}]', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  get_speaker_eq:
    summary: "Read the speaker's custom equalizer (GET /api/audio/outputs/speaker/customEq)"
    send: { method: GET, path: /api/audio/outputs/speaker/customEq }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_speaker_eq:
    summary: "Set the speaker's custom equalizer's seven gains (PUT /api/audio/outputs/speaker/customEq)"
    params:
      band1: { type: int, min: -8, max: 8, required: true, label: "125 Hz gain", description: "Gain at 125 Hz in dB, -8 to +8." }
      band2: { type: int, min: -8, max: 8, required: true, label: "250 Hz gain", description: "Gain at 250 Hz in dB, -8 to +8." }
      band3: { type: int, min: -8, max: 8, required: true, label: "500 Hz gain", description: "Gain at 500 Hz in dB, -8 to +8." }
      band4: { type: int, min: -8, max: 8, required: true, label: "1000 Hz gain", description: "Gain at 1000 Hz in dB, -8 to +8." }
      band5: { type: int, min: -8, max: 8, required: true, label: "2000 Hz gain", description: "Gain at 2000 Hz in dB, -8 to +8." }
      band6: { type: int, min: -8, max: 8, required: true, label: "4000 Hz gain", description: "Gain at 4000 Hz in dB, -8 to +8." }
      band7: { type: int, min: -8, max: 8, required: true, label: "8000 Hz gain", description: "Gain at 8000 Hz in dB, -8 to +8." }
    send: { method: PUT, path: /api/audio/outputs/speaker/customEq, body: '[{band1},{band2},{band3},{band4},{band5},{band6},{band7}]', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  get_network_interface:
    summary: "Read one network interface's settings (GET /api/interfaces/network/{name})"
    params:
      interface: { type: enum, values: [Port1, Port2, Port1_2, Wifi1, VlanDante], required: true, label: "Interface", description: "Port1, Port2 (Bar M), Port1_2, Wifi1 or VlanDante." }
    send: { method: GET, path: "/api/interfaces/network/{interface}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_8021x:
    summary: "Read an interface's 802.1X settings and status (GET /api/interfaces/network/{name}/8021x)"
    params:
      interface: { type: enum, values: [Port1, Port2, Port1_2, Wifi1, VlanDante], required: true, label: "Interface", description: "Port1, Port2 (Bar M), Port1_2, Wifi1 or VlanDante." }
    send: { method: GET, path: "/api/interfaces/network/{interface}/8021x" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_8021x_enabled:
    summary: "Turn 802.1X on or off on an interface (PUT /api/interfaces/network/{name}/8021x)"
    params:
      interface: { type: enum, values: [Port1, Port2, Port1_2, Wifi1, VlanDante], required: true, label: "Interface", description: "Port1, Port2 (Bar M), Port1_2, Wifi1 or VlanDante." }
      enabled: { type: bool, required: true, label: "802.1X", description: "On authenticates the port with 802.1X, off turns it off." }
    send: { method: PUT, path: "/api/interfaces/network/{interface}/8021x", body: '{"enabled":{enabled}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  configure_8021x_eap_tls:
    summary: "Configure EAP-TLS 802.1X on an interface with PEM certificates and key (PUT /api/interfaces/network/{name}/8021x)"
    params:
      interface: { type: enum, values: [Port1, Port2, Port1_2, Wifi1, VlanDante], required: true, label: "Interface", description: "Port1, Port2 (Bar M), Port1_2, Wifi1 or VlanDante." }
      enabled: { type: bool, required: true, label: "802.1X", description: "On turns 802.1X on with these credentials." }
      client_certificate: { type: string, max_length: 8000, multiline: true, required: true, label: "Client certificate", description: "The client certificate in PEM, up to 8000 characters." }
      client_private_key: { type: string, max_length: 4000, multiline: true, required: true, label: "Client private key", description: "The client's private key in PEM, up to 4000 characters." }
      passphrase: { type: string, max_length: 256, secret: true, required: true, label: "Key passphrase", description: "The private key's passphrase, empty for none." }
      ca_certificate: { type: string, max_length: 16000, multiline: true, required: true, label: "CA certificate", description: "The CA certificate in PEM, up to 16000 characters." }
      identity: { type: string, max_length: 60, required: true, label: "Identity", description: "The EAP identity, up to 60 characters." }
    send: { method: PUT, path: "/api/interfaces/network/{interface}/8021x", body: '{"enabled":{enabled},"auth":{"authType":"EapTls","clientCertificatePem":{client_certificate:json},"clientPrivatekeyPem":{client_private_key:json},"clientPrivatekeyPassphrase":{passphrase:json},"caCertificatePem":{ca_certificate:json},"identity":{identity:json}}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  configure_8021x_peap:
    summary: "Configure PEAPv0/MSCHAPv2 802.1X on an interface (PUT /api/interfaces/network/{name}/8021x)"
    params:
      interface: { type: enum, values: [Port1, Port2, Port1_2, Wifi1, VlanDante], required: true, label: "Interface", description: "Port1, Port2 (Bar M), Port1_2, Wifi1 or VlanDante." }
      enabled: { type: bool, required: true, label: "802.1X", description: "On turns 802.1X on with these credentials." }
      username: { type: string, max_length: 256, required: true, label: "User name", description: "The PEAP user name." }
      password: { type: string, max_length: 256, secret: true, required: true, label: "Password", description: "The PEAP password." }
      ca_certificate: { type: string, max_length: 16000, multiline: true, required: true, label: "CA certificate", description: "The CA certificate in PEM, up to 16000 characters." }
    send: { method: PUT, path: "/api/interfaces/network/{interface}/8021x", body: '{"enabled":{enabled},"auth":{"authType":"Peapv0MsChapv2","username":{username:json},"password":{password:json},"caCertificatePem":{ca_certificate:json}}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  clear_8021x:
    summary: "Remove an interface's 802.1X configuration (DELETE /api/interfaces/network/{name}/8021x)"
    params:
      interface: { type: enum, values: [Port1, Port2, Port1_2, Wifi1, VlanDante], required: true, label: "Interface", description: "Port1, Port2 (Bar M), Port1_2, Wifi1 or VlanDante." }
    send: { method: DELETE, path: "/api/interfaces/network/{interface}/8021x" }
    expect: { status: [200, 204] }
    returns: ack

  verify_8021x_file:
    summary: "Check a PEM file before use: its type (CA certificate, client certificate or private key) and validity (PUT /api/device/8021x/verify)"
    params:
      pem: { type: string, max_length: 16000, multiline: true, required: true, label: "PEM file", description: "The PEM file's text, up to 16000 characters." }
    send: { method: PUT, path: /api/device/8021x/verify, body: '{"pemFile":{pem:json}}', content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_8021x_certificates:
    summary: "List the ids of the 802.1X certificates stored on the bar (GET /api/device/8021x/certificates)"
    send: { method: GET, path: /api/device/8021x/certificates }
    expect: { status: 200, json_path: "$.certificates" }
    returns: value

  get_8021x_certificate:
    summary: "Read a stored 802.1X certificate in PEM (GET /api/device/8021x/certificates/{uuid})"
    params:
      certificate: { type: string, max_length: 36, pattern: "^[0-9a-fA-F-]{36}$", required: true, label: "Certificate", description: "The certificate's id, as get_8021x_certificates lists it." }
    send: { method: GET, path: "/api/device/8021x/certificates/{certificate}" }
    expect: { status: 200, json_path: "$.certificate" }
    returns: value

  get_dante_input_level:
    summary: "Read one Dante input's level (GET /api/audio/inputs/dante/{id}/level)"
    params:
      id: { type: int, min: 0, max: 1, required: true, label: "Dante input", description: "Dante input, 0 or 1." }
    send: { method: GET, path: "/api/audio/inputs/dante/{id}/level" }
    expect: { status: 200, json_path: "$.value" }
    returns: value

quirks:
  - models: [all]
    severity: critical
    text: >
      restart reboots the bar; the 802.1X commands can cut the bar off the
      network if the credentials are wrong; set_profile MicrosoftTeams
      restricts the HDMI output and camera parameters. None can be undone
      from here once the bar is unreachable.
  - models: [all]
    severity: info
    text: >
      On connecting the core opens the event stream; its open event gives the
      session, to which every readable resource is added with one PUT (a
      resource the bar does not have refuses the whole list). The bar sends
      each resource's value at once and on every change. The 802.1X settings,
      single interfaces and certificates are read on demand only. Opened for
      commands only, no stream is opened and nothing is read.
  - models: [all]
    severity: info
    text: >
      Third-party access is off until enabled, with a password, in Sennheiser
      Control Cockpit; the user is api. The bar's certificate is self-signed
      and accepted as such. Each write is a PUT of the one field it changes;
      the new value arrives on the event stream.
  - models: [all]
    severity: info
    text: >
      The API cannot write the device name, location, network addressing, the
      Dante network, the camera's video parameters or the HDMI output (known
      issues); they are set in Control Cockpit. The camera's zoom limit depends
      on the bar and the profile (Bar M 500, 150 with Microsoft Teams; Bar S
      400, 200 with Microsoft Teams, 300 custom). Port2 and the Split port
      configuration exist on the Bar M only. Turning Bluetooth off also clears
      its pairings. Auto framing and person tiling are mutually exclusive (409).

