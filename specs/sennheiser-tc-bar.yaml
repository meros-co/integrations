commands:
  get_ssc_version:
    summary: "Read the SSC version (GET /api/ssc/version)"
    send: { method: GET, path: "/api/ssc/version" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_device_license_agreements_hash:
    summary: "Read the license agreements hash (GET /api/device/licenseAgreements/hash)"
    send: { method: GET, path: "/api/device/licenseAgreements/hash" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_device_identity:
    summary: "Read the device identity (GET /api/device/identity)"
    send: { method: GET, path: "/api/device/identity" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_device_identification:
    summary: "Read the identification (GET /api/device/identification)"
    send: { method: GET, path: "/api/device/identification" }
    expect: { status: 200, json_path: "$" }
    returns: value

  identify:
    summary: "Set the identification: identifying: the LEDs flash (PUT /api/device/identification)"
    params:
      value: { type: bool, required: true, label: "Visual", description: "Identifying: the LEDs flash." }
    send: { method: PUT, path: "/api/device/identification", body: '{"visual":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  get_device_site:
    summary: "Read the site (GET /api/device/site)"
    send: { method: GET, path: "/api/device/site" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_interfaces_network:
    summary: "Read the network interfaces (GET /api/interfaces/network)"
    send: { method: GET, path: "/api/interfaces/network" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_device_state:
    summary: "Read the device state (GET /api/device/state)"
    send: { method: GET, path: "/api/device/state" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_firmware_update_state:
    summary: "Read the firmware update state (GET /api/firmware/update/state)"
    send: { method: GET, path: "/api/firmware/update/state" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_device_power_poe_output:
    summary: "Read the PoE output (GET /api/device/power/poe/output)"
    send: { method: GET, path: "/api/device/power/poe/output" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_poe_output:
    summary: "Set the PoE output: poE output port powered (PUT /api/device/power/poe/output)"
    params:
      value: { type: bool, required: true, label: "Enabled", description: "PoE output port powered." }
    send: { method: PUT, path: "/api/device/power/poe/output", body: '{"enabled":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  get_video_input_internal_camera_ai_access:
    summary: "Read the camera AI functions (GET /api/video/input/internalCamera/aiAccess)"
    send: { method: GET, path: "/api/video/input/internalCamera/aiAccess" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_camera_ai_auto_framing_access_enabled:
    summary: "Set the camera AI functions: auto framing offered to the remote side (PUT /api/video/input/internalCamera/aiAccess)"
    params:
      value: { type: bool, required: true, label: "Auto framing access enabled", description: "Auto framing offered to the remote side." }
    send: { method: PUT, path: "/api/video/input/internalCamera/aiAccess", body: '{"autoFramingAccessEnabled":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  set_camera_ai_auto_framing_enabled:
    summary: "Set the camera AI functions: auto framing on (PUT /api/video/input/internalCamera/aiAccess)"
    params:
      value: { type: bool, required: true, label: "Auto framing enabled", description: "Auto framing on." }
    send: { method: PUT, path: "/api/video/input/internalCamera/aiAccess", body: '{"autoFramingEnabled":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  set_camera_ai_person_tiling_access_enabled:
    summary: "Set the camera AI functions: person tiling offered to the remote side (PUT /api/video/input/internalCamera/aiAccess)"
    params:
      value: { type: bool, required: true, label: "Person tiling access enabled", description: "Person tiling offered to the remote side." }
    send: { method: PUT, path: "/api/video/input/internalCamera/aiAccess", body: '{"personTilingAccessEnabled":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  set_camera_ai_person_tiling_enabled:
    summary: "Set the camera AI functions: person tiling on (PUT /api/video/input/internalCamera/aiAccess)"
    params:
      value: { type: bool, required: true, label: "Person tiling enabled", description: "Person tiling on." }
    send: { method: PUT, path: "/api/video/input/internalCamera/aiAccess", body: '{"personTilingEnabled":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  get_audio_inputs_internal_mic:
    summary: "Read the internal microphones (GET /api/audio/inputs/internalMic)"
    send: { method: GET, path: "/api/audio/inputs/internalMic" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_mic_gain:
    summary: "Set the internal microphones: gain in dB, -60 to 0 (PUT /api/audio/inputs/internalMic)"
    params:
      value: { type: int, min: -60, max: 0, required: true, label: "Gain", description: "Gain in dB, -60 to 0." }
    send: { method: PUT, path: "/api/audio/inputs/internalMic", body: '{"gain":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  set_mic_enabled:
    summary: "Set the internal microphones: internal microphones on (PUT /api/audio/inputs/internalMic)"
    params:
      value: { type: bool, required: true, label: "Enabled", description: "Internal microphones on." }
    send: { method: PUT, path: "/api/audio/inputs/internalMic", body: '{"enabled":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  get_audio_inputs_internal_mic_mute:
    summary: "Read the internal microphone mute (GET /api/audio/inputs/internalMic/mute)"
    send: { method: GET, path: "/api/audio/inputs/internalMic/mute" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_mic_mute:
    summary: "Set the internal microphone mute: internal microphones muted (PUT /api/audio/inputs/internalMic/mute)"
    params:
      value: { type: bool, required: true, label: "Enabled", description: "Internal microphones muted." }
    send: { method: PUT, path: "/api/audio/inputs/internalMic/mute", body: '{"enabled":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  get_audio_inputs_mute:
    summary: "Read the input mute (GET /api/audio/inputs/mute)"
    send: { method: GET, path: "/api/audio/inputs/mute" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_input_mute:
    summary: "Set the input mute: internal and external microphones muted after the mixer (PUT /api/audio/inputs/mute)"
    params:
      value: { type: bool, required: true, label: "Enabled", description: "Internal and external microphones muted after the mixer." }
    send: { method: PUT, path: "/api/audio/inputs/mute", body: '{"enabled":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  get_audio_inputs_internal_mic_noise_gate:
    summary: "Read the microphone noise gate (GET /api/audio/inputs/internalMic/noiseGate)"
    send: { method: GET, path: "/api/audio/inputs/internalMic/noiseGate" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_mic_noise_gate_enabled:
    summary: "Set the microphone noise gate: noise gate on (PUT /api/audio/inputs/internalMic/noiseGate)"
    params:
      value: { type: bool, required: true, label: "Enabled", description: "Noise gate on." }
    send: { method: PUT, path: "/api/audio/inputs/internalMic/noiseGate", body: '{"enabled":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  set_mic_noise_gate_threshold:
    summary: "Set the microphone noise gate: threshold in dB, -70 to -30 (PUT /api/audio/inputs/internalMic/noiseGate)"
    params:
      value: { type: int, min: -70, max: -30, required: true, label: "Threshold", description: "Threshold in dB, -70 to -30." }
    send: { method: PUT, path: "/api/audio/inputs/internalMic/noiseGate", body: '{"threshold":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  set_mic_noise_gate_hold_time:
    summary: "Set the microphone noise gate: hold time in ms, 100 to 500 (PUT /api/audio/inputs/internalMic/noiseGate)"
    params:
      value: { type: int, min: 100, max: 500, required: true, label: "Hold time", description: "Hold time in ms, 100 to 500." }
    send: { method: PUT, path: "/api/audio/inputs/internalMic/noiseGate", body: '{"holdTime":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  set_mic_noise_gate_range:
    summary: "Set the microphone noise gate: range in dB, -80 to 0 (PUT /api/audio/inputs/internalMic/noiseGate)"
    params:
      value: { type: int, min: -80, max: 0, required: true, label: "Range", description: "Range in dB, -80 to 0." }
    send: { method: PUT, path: "/api/audio/inputs/internalMic/noiseGate", body: '{"range":{value}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  get_audio_inputs_noise_suppression:
    summary: "Read the noise suppression (GET /api/audio/inputs/noiseSuppression)"
    send: { method: GET, path: "/api/audio/inputs/noiseSuppression" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_noise_suppression:
    summary: "Set the noise suppression: noise suppression: Low, Medium or High (PUT /api/audio/inputs/noiseSuppression)"
    params:
      value: { type: enum, values: ["Low", "Medium", "High"], required: true, label: "Weighting", description: "Noise suppression: Low, Medium or High." }
    send: { method: PUT, path: "/api/audio/inputs/noiseSuppression", body: '{"weighting":{value:json}}', content_type: application/json }
    expect: { status: [200, 204] }
    returns: ack

  get_interfaces_network_dante_settings:
    summary: "Read the Dante settings (GET /api/interfaces/network/dante/settings)"
    send: { method: GET, path: "/api/interfaces/network/dante/settings" }
