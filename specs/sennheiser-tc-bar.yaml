    send: { method: GET, path: "/api/audio/outputs/speaker" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_speaker_volume:
    summary: "Set the speaker: volume in percent, 0 to 100 (PUT /api/audio/outputs/speaker)"
    params:
      value: { type: int, min: 0, max: 100, required: true, label: "Volume", description: "Volume in percent, 0 to 100." }
