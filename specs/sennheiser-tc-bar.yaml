spec: 1
id: sennheiser-tc-bar
name: Sennheiser TeamConnect Bar S / Bar M (Sound Control Protocol v2)
vendor: Sennheiser
category: other

# The TeamConnect Bar speaks SSCv2: an HTTPS REST API on port 443 (Basic
# authentication as user api with the third-party password set in Sennheiser
# Control Cockpit) and a server-sent event stream for changes, whose first
# event names a session to which the core adds every readable resource with
# one PUT. Writes are PUTs of the fields that change.
source:
  - title: "TCBar 3rd-party API, OpenAPI 3.1.0, version 1.16 (released 2026-07-06)"
    author: Sennheiser
    url: https://assets.sennheiser.com/download/assets/TCBar_openapi_3rdparty_release_1.16.yaml/6f93e9ae001711f19429727585c0d31f
    note: >
      Manufacturer document, the API reference (Swagger at
      https://docs.cloud.sennheiser.com/en-us/api-docs/api-docs/open-api-tc-bar.html):
      every resource, its methods, fields, ranges, enumerations and defaults;
      Basic authentication as a user without rights to vital settings; the
      subscription resources.
  - title: "TC Bar known issues"
    author: Sennheiser
    url: https://docs.cloud.sennheiser.com/en-us/api-docs/api-docs/known-issues-tc-bar.html
    note: >
      Manufacturer document. No PUT for the Dante network or the camera's
      video parameters; HDMI output and camera enable writes out of function
      or deprecated.
  - title: "Sennheiser Sound Control (SSCv2) Specification, Version 2.3"
    author: Sennheiser
    url: https://docs.cloud.sennheiser.com/en-us/api-docs/api-docs/sscv2-specification-2.3.html
    note: >
      Manufacturer document. The event stream's format, sessions and their
      management, status codes.

transport:
  type: http
  port: 443
  scheme: https
  accept_invalid_certs: true
  auth: basic
  timeout_ms: 4000
  probe: { method: GET, path: /api/ssc/version }

settings:
  username: { type: string, default: api, max_length: 32, label: User, description: "The SSCv2 user; api for third-party access." }
  password: { type: string, secret: true, default: "", max_length: 128, label: Password, description: "The third-party access password set in Sennheiser Control Cockpit, where third-party access must also be enabled." }

ports:
  - { port: 443, protocol: https, role: control }
  - { port: 443, protocol: https, role: push, note: "The event stream, on the same server" }

