    summary: "Set the Dante settings: dante streams continuously, not only in calls (PUT /api/interfaces/network/dante/settings)"
    params:
      value: { type: bool, required: true, label: "Continuous dante stream", description: "Dante streams continuously, not only in calls." }
    send: { method: PUT, path: "/api/interfaces/network/dante/settings", body: '{"continuousDanteStream":{value}}', content_type: application/json }
