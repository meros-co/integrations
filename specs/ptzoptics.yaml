      white_balance_one_push_g2, osd_navigate_g2, snapshot_resolution_g2, photobooth_photos_g2, photobooth_videos_g2,
      get_video_config_g2, get_audio_config_g2, get_network_config_g2, get_device_config_g2, get_serial_number_g2]
