    notes: >
      Commands from the 2021 HTTP-CGI Control Sheet, which predates the HTTP API and puts image settings on param.cgi with named values. Pan/tilt/zoom/focus speed minimums are 1 on this sheet (see quirks).
  - id: ptzoptics-generic
    name: PTZOptics (model not identified)
    supports:
      [move, stop_move, zoom_in, zoom_out, stop_zoom, focus_in, focus_out, stop_focus, home, pan_tilt_reset,
      recall_preset, save_preset, recall_preset_extended, save_preset_extended, focus_lock, osd_menu, osd_ptz_mode,
      osd_confirm, osd_back]
    verification: none
    notes: >
      Commands documented identically in both documents for every pan/tilt model, for a camera whose model is not known. Kept as the original model id.

commands:
  # Movement (HTTP API: Movement, p.119-138; 2021 sheet p.1)
  move:
    summary: "Begin a continuous pan/tilt move; runs until stop_move"
    params:
      direction: { type: "enum", values: ["up", "down", "left", "right", "leftup", "rightup", "leftdown", "rightdown"], required: true }
      pan_speed: { type: "int", min: 1, max: 24, default: 10 }
      tilt_speed: { type: "int", min: 1, max: 20, default: 10 }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&{direction}&{pan_speed}&{tilt_speed}" }
    expect: { status: 200 }
    returns: ack
  stop_move:
    summary: "Stop pan/tilt motion"
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&ptzstop&1&1" }
    expect: { status: 200 }
    returns: ack
  zoom_in:
    summary: "Zoom in (tele) continuously until stop_zoom; speed 0 slowest, 7 fastest"
    params:
      speed: { type: "int", min: 0, max: 7, default: 5 }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&zoomin&{speed}" }
    expect: { status: 200 }
    returns: ack
  zoom_out:
    summary: "Zoom out (wide) continuously until stop_zoom; speed 0 slowest, 7 fastest"
    params:
      speed: { type: "int", min: 0, max: 7, default: 5 }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&zoomout&{speed}" }
    expect: { status: 200 }
    returns: ack
  stop_zoom:
    summary: "Stop zooming"
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&zoomstop&0" }
    expect: { status: 200 }
    returns: ack
  zoom_to:
    summary: "Drive the zoom to a direct position, 4-digit hex 0000 (full wide) to 4000 (full tele)"
    params:
      speed: { type: "int", min: 1, max: 7, required: true }
      position: { type: "string", pattern: "^(?:[0-3][0-9A-Fa-f]{3}|4000)$", required: true }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&zoomto&{speed}&{position}" }
    expect: { status: 200 }
    returns: ack
  focus_in:
    summary: "Focus nearer continuously until stop_focus; speed 0 slowest, 7 fastest"
    params:
      speed: { type: "int", min: 0, max: 7, default: 5 }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&focusin&{speed}" }
    expect: { status: 200 }
    returns: ack
  focus_out:
    summary: "Focus farther continuously until stop_focus; speed 0 slowest, 7 fastest"
    params:
      speed: { type: "int", min: 0, max: 7, default: 5 }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&focusout&{speed}" }
    expect: { status: 200 }
    returns: ack
  stop_focus:
    summary: "Stop focusing"
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&focusstop&0" }
    expect: { status: 200 }
    returns: ack
  home:
    summary: "Move the camera to its home position"
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&home" }
    expect: { status: 200 }
    returns: ack
  pan_tilt_reset:
    summary: "Recalibrate pan/tilt (the camera runs its reset sweep)"
    send: { method: GET, path: /cgi-bin/param.cgi, raw_query: "pan_tiltdrive_reset" }
    expect: { status: 200 }
    returns: ack
  position_absolute:
    summary: "Move to an absolute pan/tilt position. pan: 4-digit hex, 0000/FFFF home, 0001-0990 right, FFFE-F670 left; tilt: 0000/FFFF home, 0001-0510 up, FFFE-FE51 down"
    params:
      pan_speed: { type: "int", min: 1, max: 24, required: true }
      tilt_speed: { type: "int", min: 1, max: 20, required: true }
      pan: { type: "string", pattern: "^(?:0[0-8][0-9A-Fa-f]{2}|09[0-8][0-9A-Fa-f]|0990|F6[7-9A-Fa-f][0-9A-Fa-f]|F[7-9A-Fa-f][0-9A-Fa-f]{2})$", required: true }
      tilt: { type: "string", pattern: "^(?:0[0-4][0-9A-Fa-f]{2}|050[0-9A-Fa-f]|0510|FE5[1-9A-Fa-f]|FE[6-9A-Fa-f][0-9A-Fa-f]|FF[0-9A-Fa-f]{2})$", required: true }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&abs&{pan_speed}&{tilt_speed}&{pan}&{tilt}" }
    expect: { status: 200 }
    returns: ack
  position_relative:
    summary: "Move by a pan/tilt offset from the current position, in the same 4-digit hex steps as position_absolute"
    params:
      pan_speed: { type: "int", min: 1, max: 24, required: true }
      tilt_speed: { type: "int", min: 1, max: 20, required: true }
      pan: { type: "string", pattern: "^(?:0[0-8][0-9A-Fa-f]{2}|09[0-8][0-9A-Fa-f]|0990|F6[7-9A-Fa-f][0-9A-Fa-f]|F[7-9A-Fa-f][0-9A-Fa-f]{2})$", required: true }
      tilt: { type: "string", pattern: "^(?:0[0-4][0-9A-Fa-f]{2}|050[0-9A-Fa-f]|0510|FE5[1-9A-Fa-f]|FE[6-9A-Fa-f][0-9A-Fa-f]|FF[0-9A-Fa-f]{2})$", required: true }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&rel&{pan_speed}&{tilt_speed}&{pan}&{tilt}" }
    expect: { status: 200 }
    returns: ack
  recall_preset:
    summary: "Recall preset 0-89 (100-254: recall_preset_extended)"
    params:
      preset: { type: "int", min: 0, max: 89, required: true }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&poscall&{preset}" }
    expect: { status: 200 }
    returns: ack
  save_preset:
    summary: "Overwrite preset 0-89 with the current position and settings"
    params:
      preset: { type: "int", min: 0, max: 89, required: true }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&posset&{preset}" }
    expect: { status: 200 }
    returns: ack
  recall_preset_extended:
    summary: "Recall preset 100-254"
    params:
      preset: { type: "int", min: 100, max: 254, required: true }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&poscall&{preset}" }
    expect: { status: 200 }
    returns: ack
  save_preset_extended:
    summary: "Overwrite preset 100-254 with the current position and settings"
    params:
      preset: { type: "int", min: 100, max: 254, required: true }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "ptzcmd&posset&{preset}" }
    expect: { status: 200 }
    returns: ack
  recall_preset_with_speed:
    summary: "Recall preset 0-89 at the given pan, tilt and zoom speeds"
    params:
      preset: { type: "int", min: 0, max: 89, required: true }
      pan_speed: { type: "int", min: 1, max: 24, required: true }
      tilt_speed: { type: "int", min: 1, max: 20, required: true }
      zoom_speed: { type: "int", min: 1, max: 7, required: true }
    send: { method: POST, path: /cgi-bin/ptzctrl.cgi, raw_query: "post_preset&poscallwithspeed={preset}&panspeed={pan_speed}&tiltspeed={tilt_speed}&zoomspeed={zoom_speed}" }
    expect: { status: 200, contains: "Success" }
    returns: ack
  recall_preset_with_speed_extended:
    summary: "Recall preset 100-254 at the given pan, tilt and zoom speeds"
    params:
      preset: { type: "int", min: 100, max: 254, required: true }
      pan_speed: { type: "int", min: 1, max: 24, required: true }
      tilt_speed: { type: "int", min: 1, max: 20, required: true }
      zoom_speed: { type: "int", min: 1, max: 7, required: true }
    send: { method: POST, path: /cgi-bin/ptzctrl.cgi, raw_query: "post_preset&poscallwithspeed={preset}&panspeed={pan_speed}&tiltspeed={tilt_speed}&zoomspeed={zoom_speed}" }
    expect: { status: 200, contains: "Success" }
    returns: ack
  snap_focus:
    summary: "Run a one-shot autofocus"
    send: { method: GET, path: /cgi-bin/param.cgi, raw_query: "set_focus&one_shot_focus" }
    expect: { status: 200, contains: "Success" }
    returns: ack

  # Focus (HTTP API: Focus, p.65-76; 2021 sheet p.1 Focus Lock)
  focus_lock:
    summary: "Lock or unlock focus"
    params:
      action: { type: "enum", values: ["lock", "unlock"], required: true }
    send: { method: GET, path: /cgi-bin/param.cgi, raw_query: "ptzcmd&{action}_mfocus" }
    expect: { status: 200 }
    returns: ack
  focus_mode:
    summary: "Focus mode: 1 auto, 2 one-shot AF, 3 manual (see quirks: the document also lists 2 as auto)"
    params:
      mode: { type: "enum", values: ["1", "2", "3"], required: true }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "post_image_value&focusmode&{mode}" }
    expect: { status: 200, contains: "Success" }
    returns: ack
  af_zone:
    summary: "Autofocus zone: 0 top, 1 center, 2 bottom, 3 front"
    params:
      zone: { type: "int", min: 0, max: 3, required: true }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "post_image_value&focusregion&{zone}" }
    expect: { status: 200, contains: "Success" }
    returns: ack
  af_sensitivity:
    summary: "Autofocus sensitivity: 1 high, 2 normal, 3 low"
    params:
      sensitivity: { type: "int", min: 1, max: 3, required: true }
    send: { method: GET, path: /cgi-bin/ptzctrl.cgi, raw_query: "post_image_value&focussense&{sensitivity}" }
    expect: { status: 200, contains: "Success" }
    returns: ack
