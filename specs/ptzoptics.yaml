telemetry:
  # The camera pushes nothing over HTTP, so its settings are asked for on a
  # schedule: changes made from the IR remote, the OSD, the web UI or another
  # controller only appear this way. Commands go ahead of queued polls.
  poll:
    every_ms: 5000
    send:
      - { method: GET, path: /cgi-bin/param.cgi, raw_query: "get_device_conf" }
      - { method: GET, path: /cgi-bin/param.cgi, raw_query: "get_language_conf" }
      - { method: GET, path: /cgi-bin/param.cgi, raw_query: "get_tally_status" }
      - { method: GET, path: /cgi-bin/param.cgi, raw_query: "get_advance_image_conf" }
      - { method: GET, path: /cgi-bin/param.cgi, raw_query: "get_image_conf" }
      - { method: GET, path: /cgi-bin/param.cgi, raw_query: "get_media_audio" }
      - { method: GET, path: /cgi-bin/param.cgi, raw_query: "get_media_video" }
      - { method: GET, path: /cgi-bin/param.cgi, raw_query: "get_ndi_info" }
      - { method: GET, path: /cgi-bin/param.cgi, raw_query: "query_ir_info" }
  updates:
    # Text replies (get_advance_image_conf, get_image_conf, get_media_audio,
    # get_media_video, query_ir_info): one rule per field. Each pattern accepts
    # the name="value" lines of the examples and the "name": "value" members of
    # the response schema, since the document shows both (see quirks).
    - match: '(?:^|[\s{,])"?focus_mode"?\s*[:=]\s*"(\d+)"'
      state: { "focus.mode": "{1}" }
    - match: '(?:^|[\s{,])"?focus_zone"?\s*[:=]\s*"(\d+)"'
      state: { "focus.zone": { value: "{1}", map: { "0": "top", "1": "center", "2": "bottom", "3": "front" } } }
    - match: '(?:^|[\s{,])"?focus_sens"?\s*[:=]\s*"(\d+)"'
      state: { "focus.sensitivity": { value: "{1}", map: { "1": "high", "2": "normal", "3": "low" } } }
    - match: '(?:^|[\s{,])"?focuslimit"?\s*[:=]\s*"(\d+)"'
      state: { "focus.limit.enabled": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '(?:^|[\s{,])"?nearestpos"?\s*[:=]\s*"(\d+)"'
      state: { "focus.limit.near": "{1}" }
    - match: '(?:^|[\s{,])"?furthestpos"?\s*[:=]\s*"(\d+)"'
      state: { "focus.limit.far": "{1}" }
    - match: '(?:^|[\s{,])"?focus_mode_status"?\s*[:=]\s*"([a-z]+)"'
      state: { "focus.locked": { value: "{1}", map: { "lock": true, "unlock": false } } }
    - match: '(?:^|[\s{,])"?exposure_mode"?\s*[:=]\s*"(\d+)"'
      state: { "exposure.mode": { value: "{1}", map: { "0": "auto", "3": "manual", "10": "sae", "11": "aae", "13": "bright" } } }
    - match: '(?:^|[\s{,])"?expcomp_mode"?\s*[:=]\s*"(\d+)"'
      state: { "exposure.compensation": { value: "{1}", map: { "2": true, "3": false } } }
    - match: '(?:^|[\s{,])"?expcomp_level"?\s*[:=]\s*"(\d+)"'
      state: { "exposure.compensation_level": "{1}" }
    - match: '(?:^|[\s{,])"?backlight"?\s*[:=]\s*"(\d+)"'
      state: { "exposure.backlight": "{1}" }
    - match: '(?:^|[\s{,])"?antiflicker"?\s*[:=]\s*"(\d+)"'
      state: { "exposure.anti_flicker": { value: "{1}", map: { "0": "off", "1": "50Hz", "2": "60Hz" } } }
    - match: '(?:^|[\s{,])"?bright"?\s*[:=]\s*"(\d+)"'
      state: { "exposure.bright": "{1}" }
    - match: '(?:^|[\s{,])"?gain_limit"?\s*[:=]\s*"(\d+)"'
      state: { "exposure.gain_limit": "{1}" }
    - match: '(?:^|[\s{,])"?manual_gain"?\s*[:=]\s*"(\d+)"'
      state: { "exposure.gain": "{1}" }
    - match: '(?:^|[\s{,])"?meter"?\s*[:=]\s*"(\d+)"'
      state: { "exposure.meter_region": { value: "{1}", map: { "0": "average", "1": "center", "2": "smart", "3": "top" } } }
    - match: '(?:^|[\s{,])"?drc"?\s*[:=]\s*"(\d+)"'
      state: { "exposure.dynamic_range": "{1}" }
    - match: '(?:^|[\s{,])"?shutter"?\s*[:=]\s*"(\d+)"'
      state: { "exposure.shutter": "{1}" }
    - match: '(?:^|[\s{,])"?iris"?\s*[:=]\s*"(\d+)"'
      state: { "exposure.iris": "{1}" }
    - match: '(?:^|[\s{,])"?wb_mode"?\s*[:=]\s*"(\d+)"'
      state: { "white_balance.mode": { value: "{1}", map: { "0": "auto", "1": "indoor", "2": "outdoor", "3": "onepush", "5": "manual", "32": "var" } } }
    - match: '(?:^|[\s{,])"?rgain_tuning"?\s*[:=]\s*"(\d+)"'
      state: { "white_balance.red_gain_tuning": "{1}" }
    - match: '(?:^|[\s{,])"?bgain_tuning"?\s*[:=]\s*"(\d+)"'
      state: { "white_balance.blue_gain_tuning": "{1}" }
    - match: '(?:^|[\s{,])"?rgain"?\s*[:=]\s*"(\d+)"'
      state: { "white_balance.red_gain": "{1}" }
    - match: '(?:^|[\s{,])"?bgain"?\s*[:=]\s*"(\d+)"'
      state: { "white_balance.blue_gain": "{1}" }
    - match: '(?:^|[\s{,])"?temperature"?\s*[:=]\s*"(\d+)"'
      state: { "white_balance.color_temperature": "{1}" }
    - match: '(?:^|[\s{,])"?saturation"?\s*[:=]\s*"(\d+)"'
      state: { "image.saturation": "{1}" }
    - match: '(?:^|[\s{,])"?hue"?\s*[:=]\s*"(\d+)"'
      state: { "image.hue": "{1}" }
    - match: '(?:^|[\s{,])"?luminance"?\s*[:=]\s*"(\d+)"'
      state: { "image.luminance": "{1}" }
    - match: '(?:^|[\s{,])"?sharpness"?\s*[:=]\s*"(\d+)"'
      state: { "image.sharpness": "{1}" }
    - match: '(?:^|[\s{,])"?contrast"?\s*[:=]\s*"(\d+)"'
      state: { "image.contrast": "{1}" }
    - match: '(?:^|[\s{,])"?style"?\s*[:=]\s*"(\d+)"'
