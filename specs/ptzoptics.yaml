      state: { "video.refresh_rate": "{1}" }
    - match: '(?:^|[\s{,])"?ndi_mode"?\s*[:=]\s*"([A-Za-z0-9]+)"'
      state: { "video.template": "{1}" }
    - match: '(?:^|[\s{,])"?advanced"?\s*[:=]\s*"([a-z]+)"'
      state: { "video.advanced": "{1}" }
    - match: '(?:^|[\s{,])"?profile"?\s*[:=]\s*"([a-z]+)"'
      state: { "video.profile": "{1}" }
    - match: '(?:^|[\s{,])"?usbprotocol"?\s*[:=]\s*"([A-Za-z0-9]+)"'
      state: { "video.usb.protocol": "{1}" }
    - match: '(?:^|[\s{,])"?usbwidth"?\s*[:=]\s*"(\d+)"'
      state: { "video.usb.width": "{1}" }
    - match: '(?:^|[\s{,])"?usbheight"?\s*[:=]\s*"(\d+)"'
      state: { "video.usb.height": "{1}" }
    - match: '(?:^|[\s{,])"?usbframerate"?\s*[:=]\s*"(\d+)"'
      state: { "video.usb.frame_rate": "{1}" }
    - match: '(?:^|[\s{,])"?vi_framerate"?\s*[:=]\s*"(\d+)"'
      state: { "video.frame_rate": "{1}" }
    - match: '(?:^|[\s{,])"?uhd4k"?\s*[:=]\s*"(\d+)"'
      state: { "video.uhd": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '(?:^|[\s{,])"?IR_Channel"?\s*[:=]\s*"([1-4])"'
      state: { "ir_channel": "{1}" }
    # One rule per stream: a rule takes only its first match in a message.
    - match: '(?:^|[\s{,])"?protocol_1"?\s*[:=]\s*"([A-Za-z0-9]+)"'
      state: { "video.streams.1.protocol": "{1}" }
    - match: '(?:^|[\s{,])"?size_1"?\s*[:=]\s*"([A-Za-z0-9_]+)"'
      state: { "video.streams.1.resolution": "{1}" }
    - match: '(?:^|[\s{,])"?bps_1"?\s*[:=]\s*"(\d+)"'
      state: { "video.streams.1.bitrate": "{1}" }
    - match: '(?:^|[\s{,])"?qfactor_1"?\s*[:=]\s*"(\d+)"'
      state: { "video.streams.1.qfactor": "{1}" }
    - match: '(?:^|[\s{,])"?fps_1"?\s*[:=]\s*"(\d+)"'
      state: { "video.streams.1.frame_rate": "{1}" }
    - match: '(?:^|[\s{,])"?gop_1"?\s*[:=]\s*"(\d+)"'
      state: { "video.streams.1.keyframe_interval": "{1}" }
    - match: '(?:^|[\s{,])"?rcmode_1"?\s*[:=]\s*"([A-Z]+)"'
      state: { "video.streams.1.rate_control": "{1}" }
    - match: '(?:^|[\s{,])"?protocol_2"?\s*[:=]\s*"([A-Za-z0-9]+)"'
      state: { "video.streams.2.protocol": "{1}" }
    - match: '(?:^|[\s{,])"?size_2"?\s*[:=]\s*"([A-Za-z0-9_]+)"'
      state: { "video.streams.2.resolution": "{1}" }
    - match: '(?:^|[\s{,])"?bps_2"?\s*[:=]\s*"(\d+)"'
      state: { "video.streams.2.bitrate": "{1}" }
    - match: '(?:^|[\s{,])"?qfactor_2"?\s*[:=]\s*"(\d+)"'
      state: { "video.streams.2.qfactor": "{1}" }
    - match: '(?:^|[\s{,])"?fps_2"?\s*[:=]\s*"(\d+)"'
      state: { "video.streams.2.frame_rate": "{1}" }
    - match: '(?:^|[\s{,])"?gop_2"?\s*[:=]\s*"(\d+)"'
      state: { "video.streams.2.keyframe_interval": "{1}" }
    - match: '(?:^|[\s{,])"?rcmode_2"?\s*[:=]\s*"([A-Z]+)"'
      state: { "video.streams.2.rate_control": "{1}" }
    # JSON replies.
    - path: '^/cgi-bin/param\.cgi\?get_device_conf$'
      json: { devname: "$.data.devname", devtype: "$.data.devtype", versioninfo: "$.data.versioninfo", serial_num: "$.data.serial_num", device_model: "$.data.device_model" }
      state:
        "device.name": "{devname}"
        "device.type": "{devtype}"
        "device.firmware": "{versioninfo}"
        "device.serial": "{serial_num}"
        "device.model": "{device_model}"
    - path: '^/cgi-bin/param\.cgi\?get_language_conf$'
      json: { default_language: "$.data.default_language", isndi: "$.data.isndi", isdante: "$.data.isdante", streaming: "$.data.streaming", standby: "$.data.standby", focusmode: "$.data.focusmode" }
      state:
        "system.language": "{default_language}"
        "system.ndi_capable": { value: "{isndi}", map: { "0": false, "1": true } }
        "system.dante_capable": { value: "{isdante}", map: { "0": false, "1": true } }
        "system.streaming": "{streaming}"
        "system.standby": "{standby}"
        "focus.mode_name": "{focusmode}"
    - path: '^/cgi-bin/param\.cgi\?get_tally_status$'
      json: { tally: "$.data.tally", standby: "$.data.standby", privacy: "$.data.privacy", target: "$.data.target" }
      state:
        "tally.state": "{tally}"
        "tally.standby": "{standby}"
        "tally.privacy": "{privacy}"
        "tracking.target": "{target}"
    - path: '^/cgi-bin/param\.cgi\?get_ndi_info$'
      json: { channelName: "$.data.channelName", group: "$.data.group", discovery_en: "$.data.discovery_en", discovery_server: "$.data.discovery_server", multicast_en: "$.data.multicast_en", multicast_ip: "$.data.multicast_ip", multicast_mask: "$.data.multicast_mask", multicast_ttl: "$.data.multicast_ttl", fullndi_en: "$.data.fullndi_en", ndi: "$.data.ndi" }
      state:
        "ndi.name": "{channelName}"
        "ndi.group": "{group}"
        "ndi.discovery": { value: "{discovery_en}", map: { "0": false, "1": true } }
        "ndi.discovery_server": "{discovery_server}"
        "ndi.multicast": { value: "{multicast_en}", map: { "0": false, "1": true } }
        "ndi.multicast_ip": "{multicast_ip}"
        "ndi.multicast_mask": "{multicast_mask}"
        "ndi.multicast_ttl": "{multicast_ttl}"
        "ndi.full_ndi": { value: "{fullndi_en}", map: { "0": false, "1": true } }
        "ndi.version": "{ndi}"

quirks:
  - models: [all]
    severity: critical
    text: >
      Query arguments are positional and ampersand-separated. "ptzcmd&poscall&3"
      is not a key/value query string; an HTTP client that parses and re-encodes
      it will corrupt the command. Transmitted via raw_query, unmodified.

  - models: [all]
    severity: critical
    text: >
      The HTTP API document states that all endpoints use digest authentication
      (p.2), while its examples send no credentials and get_system_conf reports an
      "httpauth" setting ("0" in the example, p.169). Requests go without
      credentials until the camera challenges; the challenge is then answered with
      the username and password settings. A refused login is not retried: the
      device reports unauthorized until it is opened again with corrected settings.

  - models: [all]
    severity: warning
    text: >
      move, zoom_in, zoom_out, focus_in and focus_out start continuous motion that
      runs until the matching stop command. A caller that issues one without the
      stop leaves the camera moving to its limit.

  - models: [move-4k, link-4k, move-se, studio-pro, studio-4k]
    severity: warning
    text: >
      Every endpoint's documented 200 reply is the JSON object
      {"Response":{"Result":"Success"}} (shown in full in the Device ID example,
      p.147; the other endpoints give it as an auto-generated schema). Commands only
      current models have check for "Success"; commands G2 cameras share (motion,
      presets, focus lock, OSD) check only for HTTP 200, since the 2021 sheet
      documents no reply. Either way it means the request was accepted; there is
      no execution acknowledgement for motion.

  - models: [ptz-g2]
    severity: info
    text: >
      The 2021 HTTP-CGI Control Sheet documents no reply bodies, so commands for
      G2 cameras check only for HTTP 200, and the G2 query commands return the
      reply text as received.

  - models: [ptz-g2]
    severity: info
    text: >
      The 2021 sheet gives zoom and focus speeds 1-7 and a direct-zoom speed of
      0-7; the HTTP API gives 0-7 and 1-7. The parameters follow the HTTP API, so
      speed 0 on zoom_in, zoom_out, focus_in and focus_out is not documented for
      G2 cameras.

  - models: [ptz-g2]
    severity: info
    text: >
      On G2 cameras picture settings go to param.cgi with named values
      (post_image_value&aemode&manual); current models take them on ptzctrl.cgi
      with numeric codes (post_image_value&aemode&3). The two sets are separate
      commands (the _g2 suffix) because the wire forms differ.

  - models: [all]
    severity: warning
    text: >
      Presets are documented as 0-89 and 100-254; 90-99 are not presets. Commands
      for the low and high ranges are separate (recall_preset and
      recall_preset_extended, and likewise for save and recall with speed) so that
      90-99 are refused before transmission.

  - models: [move-4k, link-4k, move-se, studio-pro, studio-4k]
    severity: warning
    text: >
      Many picture settings apply only in a particular mode, as each endpoint notes:
      gain in manual exposure; iris and shutter in manual or AAE; gain limit, meter
      region and backlight in auto, SAE or AAE; exposure compensation in auto;
      red/blue gain in manual white balance; gain tuning in auto, one-push or VAR;
      colour temperature in VAR; one-push trigger in one-push. Outside that mode the
      camera may accept and ignore the value.

  - models: [move-4k, link-4k, move-se, studio-pro, studio-4k]
    severity: warning
    text: >
      The HTTP API contradicts itself on several values; the spec takes the
      parameter table or the endpoint's example, and reports raw numbers in state
      where the meaning is uncertain. backlight: the function text lists 1 off, 2
      on, 3 enhanced while the parameter table allows 2-3 as on/off (p.37-38).
      focus_mode: the function text lists 1 auto, 2 one-shot AF, 3 manual while the
      parameter table lists 2 auto, 3 manual (p.71); all three values are allowed.
      iris (Move 4K, Link 4K): the table says 0-8 while the list and the example run
      to 12 (p.51). tally_mode is set as 2/3 but reported as "1" in the
      get_advance_image_conf example. Audio sample rates are labelled kbps but are
      kHz.

  - models: [move-4k, link-4k, move-se, studio-pro]
    severity: info
    text: >
      Video endpoints are headed post_media_video&profile&:profile but every example
      sends post_media_video&profile=highprofile (p.249-277), as the audio and
      network endpoints do; the spec sends the example's key=value form. Focus Limit
      is headed GET while its JavaScript example uses POST (p.67); GET is sent.

  - models: [move-4k, link-4k, move-se, studio-pro, studio-4k]
    severity: info
    text: >
      Shutter index meanings differ by model. Move 4K, Link 4K: 1 1/30, 2 1/60, 3
      1/90, 4 1/100, 5 1/125, 6 1/180, 7 1/250, 8 1/350, 9 1/500, 10 1/725, 11 1/1000,
      12 1/1500, 13 1/2000, 14 1/3000, 15 1/4000, 16 1/6000, 17 1/10000. Move SE,
      Studio 4K: as above but 2 1/50, 3 1/60, 6 1/200. Studio Pro: 1 1/30, 2 1/40,
      3 1/50, 4 1/60, then 1/70 to 1/190 in 1/10 steps for 5-17. Iris and sharpness
      also differ, as separate commands (iris/iris_se, sharpness/sharpness_se).

  - models: [move-se, studio-pro]
    severity: info
    text: >
      Audio input and line out volume accept 0-30 on Move SE and Studio Pro, 0-59 on
      Move 4K and Link 4K; the sample rate is 32 kHz only on Move SE and Studio Pro.
      Stream encoding on Move SE is H264 or H265 only.

  - models: [move-4k, link-4k]
    severity: warning
    text: >
      The query endpoints are documented for Move 4K and Link 4K only, and the
      telemetry polls them on every model; on other models those polls may fail and
      state stays empty. The examples for get_advance_image_conf, get_image_conf,
      get_media_audio, get_media_video and query_ir_info show name="value" lines
      while their schemas describe a JSON {"status":200,"data":{...}} object; the
      telemetry patterns accept both, and those queries return the reply text.
      get_system_conf returns password hashes and is not polled.

  - models: [move-4k, link-4k, move-se, studio-pro, studio-4k]
    severity: info
    text: >
      Names, stream keys and SRT settings are percent-encoded in the positional
      query. The document does not say whether the camera decodes them; its
      examples use only letters, digits and _ -. RTMP URLs are sent as given,
      limited to the RFC 3986 characters other than &, with % for a value the
      caller has already percent-encoded.

  - models: [move-4k, link-4k, move-se, studio-pro, studio-4k]
    severity: warning
    text: >
      ip_address, netmask, gateway, dhcp and http_port change how the camera is
      reached, and reboot, factory_reset and network_reset restart it; the
      connection drops and the device must be re-registered at its new address or
      port. focus_limit needs near no greater than far (p.67).

  - models: [all]
    severity: info
    text: >
      Power (standby) on/off, pan/tilt/zoom/focus position inquiries and the other
      VISCA functions are documented only in the VISCA API (VISCA over IP on TCP
      5678 or UDP 1259), which this HTTP spec does not carry. The snapshot image
      (/snapshot.jpg) and photobooth downloads (/photoN.jpg, /videoN.mp4) are files,
      not commands, and are not modelled.
