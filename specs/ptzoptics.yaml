spec: 1
id: ptzoptics
name: PTZOptics cameras
vendor: PTZOptics
category: camera

# HTTP-CGI with positional, '&'-separated arguments rather than key/value
# query strings: /cgi-bin/ptzctrl.cgi (motion, presets and, on current models,
# picture settings) and /cgi-bin/param.cgi (configuration and queries). Each
# command's wire form is the endpoint's own example request in the HTTP API
# document; page numbers below refer to that document's PDF.
#
# VISCA over IP (TCP 5678 / UDP 1259), which PTZOptics also documents, is a
# binary protocol on another transport and is not part of this spec.
source:
  - title: "PTZOptics HTTP API, Developer Documentation (API version 1.0, 2026-09-29)"
    author: PTZOptics
    url: https://docs.ptzoptics.com/dev/http-api/
    note: >
      Manufacturer document; the PDF is https://downloads.ptzoptics.com/docs/http-api
      (http-api-developer-documentation.pdf, 277 pages). Endpoints by section: Audio p.4-17, Color p.18-36,
      Exposure p.37-64, Focus p.65-76, Image p.77-88, Mode p.89-118, Movement p.119-138, Network p.139-158,
      OSD p.159-162, Ports p.163-168, Query p.169-198, Stream p.199-238, System p.239-248, Video p.249-277.
      Value ranges from each endpoint's parameter table; per-model support from each endpoint's
      "Camera Compatibility" list; reply shape {"Response":{"Result":"Success"}} from each endpoint's 200
      response schema and the Device ID example (p.147); authentication from p.2.
  - title: "PTZOptics HTTP-CGI Control Sheet (2021-10-15)"
    author: PTZOptics
    url: "https://f.hubspotusercontent20.net/hubfs/418770/PTZOptics%20Documentation/Misc/PTZOptics%20HTTP-CGI%20Commands.pdf"
    note: >
      Manufacturer document (2 pages) for the 12X/20X/30X G2 generation: pan/tilt, zoom, focus, focus lock,
      home, PT reset, presets, direct position and zoom recall (p.1); OSD access and navigation, image
      settings, exposure and white balance, JPEG snapshot, photobooth, inquiries (p.1-2). Supersedes
      Rev 1.4 (2020-08-10).

transport:
  type: http
  port: 80
  scheme: http
  auth: digest
  timeout_ms: 4000
  probe:
    method: GET
    path: /cgi-bin/ptzctrl.cgi
    raw_query: "ptzcmd&ptzstop&1&1"

settings:
  # The camera's web login, answered only when the camera challenges (HTTP
  # authentication on). The document gives no default credentials.
  username: { type: string }
  password: { type: string, secret: true }

ports:
  - { port: 80, protocol: http, role: control }

