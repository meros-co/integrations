    - match: '(?:^|[\s{,])"?imageOrientation"?\s*[:=]\s*"(\d+)"'
      state: { "image.orientation": { value: "{1}", map: { "0": "normal", "1": "flip", "2": "mirror", "3": "flip_mirror" } } }
    - match: '(?:^|[\s{,])"?nr3d"?\s*[:=]\s*"(\d+)"'
