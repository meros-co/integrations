spec: 1
id: megapixel-helios
name: Megapixel HELIOS LED processing platform (Public API)
vendor: Megapixel
category: display

# HELIOS keeps its state as one JSON property tree with two roots, dev
# (processor, display, groups, receivers) and sys (system). The REST interface
# reads it with GET /api/v1/public, optionally narrowed to dotted property
# paths in the query, and writes any part of it with PATCH /api/v1/public and
# the part as the body; both answer with the part of the tree they touched. The
# same tree comes over the JSON-RPC websocket, which also pushes every change.
# Saved configurations (presets) and the still store have their own endpoints.

source:
  - title: HELIOS Processor - Public API, v24.07.0.22791 (2024-07-11)
    author: Megapixel (H2VR HoldCo)
    url: https://github.com/PepperDash/epi-megapixel-helios/blob/main/docs/mvr-processor-public-api.pdf
    note: >
      Manufacturer document. Megapixel offers it on request through a form on
      its support site (HELIOS User Guide K.18); this copy is distributed in the
      MIT-licensed PepperDash Essentials plugin repository. Used for: HTTP on
      80 and HTTPS on 443 (2.1), 400 and 406 answers (2.1.3-2.1.4), GET and
      PATCH of /api/v1/public with property paths in the query and the reply
      shape, out-of-range values kept and unknown properties ignored (3.1),
      preview sources (3.2), saved configurations list and apply by id and by
      name, 404 for an unknown one (3.3), the still store list, show by id and
      name, hide, 204 and 404 answers (3.4), the JSON-RPC websocket at
      /api/v1/public/rpc/websocket with the state, set, update and ping
      methods (4), basic and digest authentication with realm "M8 Processor"
      (5), the data model tables for dev.display, dev.display.out.adjust,
      dev.display.redundancy, dev.groups, dev.ingest, dev.receivers and sys
      (6), alerts and severities (7), and the blackout, brightness, gamma, test
      pattern and redundancy flip examples (8). Cited as Public API 24.07.
  - title: Megapixel-Helios-Json-Public-Payload.json (a processor's GET /api/v1/public reply)
    author: PepperDash Technology (captured from a HELIOS processor)
    url: https://github.com/PepperDash/epi-megapixel-helios/blob/main/docs/Megapixel-Helios-Json-Public-Payload.json
    note: >
      MIT-licensed repository. A whole-tree reply from a processor on firmware
      p24.08.25. Used for the property names the tables do not spell out
      (gains r/g/b, out.adjust gain/gamma/lift/offset r/g/b, redundancy
      desired, testPattern.mediaEnabled, inputs.<key>.valid/resolution/format/
      freq/w/h/name, ports and portsIn, temps, genlock, info.version.firmware,
      blackClipping, latencyLow), the input keys (hdmi1, hdmi2, sdi1-4 and the
      stitched hdmi1X2, hdmi2X1, sdi1X2 ...), and the ranges the processor
      itself reports under sys.fixtures.display (brightness 0-100, cct
      1667-25000, cctDuv -0.03 to 0.03, gamma 1-4, blackClipping 0-0.5, the
      gamut types and redundancy modes). Cited as payload sample.
  - title: epi-megapixel-helios README (PepperDash Essentials plugin, MIT)
    author: PepperDash Technology
    url: https://github.com/PepperDash/epi-megapixel-helios
    note: >
      MIT licence (LICENSE.md). Read, not copied, as corroboration: minimum
      firmware 24.11.0, HTTPS on 443 with the web application's user name and
      password, and the redundancy notes (role is the long-term assignment;
      only main or backup can be requested as state; active, standby and mixed
      are reported states). Its input-hotplug calls use a private API and are
      not used here.
  - title: HELIOS Processing System User Guide, K.18 "HELIOS - API" and the port table
    author: Megapixel
    url: https://megapixelvr.com/downloads/HELIOS%20Processing%20System-User%20Guide.pdf
    note: >
      Manufacturer document. TCP 80 and 443 carry the web UI and Public API,
      UDP 5568 sACN control; the API documentation is available on request
      through the support site's form. Preview blocking answers 403.
  - title: HELIOS Release Notes v26.07.0
    author: Megapixel
    url: https://megapixelvr.com/downloads/HELIOS_Release_Notes_v26.07.0.pdf
    note: >
      Manufacturer document. Lists API additions after 24.07 (processor reboot,
      pixel error detection, dev.switches documented) whose request forms are
      only in the on-request API document, so they are not included.

transport:
  type: http
  port: 80
  # HTTPS is on 443 (Public API 2.1); with scheme https the host opens the
  # device on port 443. The processor's certificate is its own.
  scheme: { setting: scheme }
  accept_invalid_certs: true
  # Basic or digest, when authentication is turned on in the web application
  # (Public API 5); a digest challenge is answered.
  auth: basic
  timeout_ms: 5000
  probe: { method: GET, path: /api/v1/public, raw_query: "sys.description" }

settings:
  scheme: { type: enum, values: [http, https], default: http,
            label: Scheme,
            description: "With http the API is reached on port 80; with https on port 443, accepting the processor's own certificate." }
  username: { type: string, default: "",
              label: Username,
              description: "A user name of the processor's web application, needed only when authentication is turned on there." }
  password: { type: string, secret: true, default: "",
              label: Password,
              description: "The password of that web application user; leave it empty when authentication is off." }

ports:
  - { port: 80, protocol: http, role: control }
  - { port: 80, protocol: https, role: control, when: "scheme https" }
  - { port: 80, protocol: ws, role: push }

models:
  - id: helios
    name: Megapixel HELIOS processor
    supports: [get_state, get_properties, set_properties, get_alerts,
               set_blackout, set_freeze, set_brightness, set_cct, set_cct_duv, set_gamma,
               set_black_clipping, set_display_gains, set_display_window, set_display_size,
               set_output_adjust_enabled, set_output_adjust_gain, set_output_adjust_gamma,
               set_output_adjust_lift, set_output_adjust_offset, set_output_adjust_saturation,
               set_redundancy_mode, set_redundancy_role, redundancy_flip,
               select_input, set_test_pattern, set_test_pattern_enabled, set_test_pattern_motion,
               set_group_blackout, set_group_name, set_group_gains, set_group_mask_enabled,
               set_group_mask, set_group_test_pattern_enabled, set_group_test_pattern_color,
               set_receiver_group, set_receiver_position, set_processor_name,
               list_presets, list_presets_full, recall_preset, recall_preset_by_name,
               list_stills, show_still, show_still_by_name, hide_still, list_preview_sources]
    verification: none
    notes: >
      One processor model; what it can do depends on its input cards (HDMI
      2.0, HDMI 2.1, 12G-SDI, ST 2110) and the tiles connected.

commands:
  # ── Reading the property tree (Public API 3.1.1) ─────────────────────────
  get_state:
    summary: "The whole property tree, dev and sys (GET /api/v1/public; large on a big wall)"
    send: { method: GET, path: /api/v1/public }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_properties:
    summary: "Read the properties at these dotted paths, joined with &, such as dev.display.brightness&dev.display.gamma"
    params:
      paths: { type: string, pattern: "^[A-Za-z0-9_.:()&-]{1,512}$", required: true,
               label: Property paths,
               description: "Dotted paths in the property tree, joined with &, such as dev.display.brightness&dev.display.gamma." }
    send: { method: GET, path: /api/v1/public, raw_query: "{paths}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_properties:
    summary: "PATCH any part of the property tree (Public API 3.1.2): a JSON object such as {\"dev\": {\"display\": {\"brightness\": 42}}}; the reply holds the resulting values"
    params:
      tree: { type: json, required: true,
              label: Property tree,
              description: "A JSON object holding the part of the tree to change, such as {\"dev\": {\"display\": {\"brightness\": 42}}}; out-of-range values and unknown properties are ignored." }
    send: { method: PATCH, path: /api/v1/public, body: "{tree}", content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_alerts:
    summary: "System-wide alerts, their count and the most severe level (Public API 7.1)"
    send: { method: GET, path: /api/v1/public, raw_query: "sys.alerts&sys.alertsCount&sys.alertsSeverity" }
    expect: { status: 200, json_path: "$.sys" }
    returns: value

  # ── Display (Public API 6.1.1, 8.2-8.4) ───────────────────────────────────
  set_blackout:
    summary: "Black out the display, or bring it back"
    params:
      enabled: { type: bool, default: true,
                 label: Blackout,
                 description: "True blacks out the display and false brings the picture back; it acts on the live display at once." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"blackout":{enabled}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_freeze:
    summary: "Freeze the display, or release it"
    params:
      enabled: { type: bool, default: true,
                 label: Freeze,
                 description: "True freezes the display on the current frame and false releases it." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"freeze":{enabled}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_brightness:
    summary: "Display brightness, 0 to 100 percent"
    params:
      brightness: { type: float, min: 0, max: 100, required: true,
                    label: Brightness,
                    description: "Display brightness in percent, 0 black to 100 full." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"brightness":{brightness:.2f}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_cct:
    summary: "Colour temperature, 1667 to 25000 K"
    params:
      kelvin: { type: int, min: 1667, max: 25000, required: true,
                label: Colour temperature,
                description: "The display's white point as a correlated colour temperature in kelvin, such as 6500." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"cct":{kelvin}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_cct_duv:
    summary: "Colour temperature Duv, -0.03 to 0.03"
    params:
      duv: { type: float, min: -0.03, max: 0.03, required: true,
             label: Duv,
             description: "Distance of the white point from the Planckian locus, with 0 on it, negative towards magenta and positive towards green." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"cctDuv":{duv:.4f}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_gamma:
    summary: "Display gamma, 1 to 4"
    params:
      gamma: { type: float, min: 1, max: 4, required: true,
               label: Gamma,
               description: "The display's gamma, such as 2.2 or 2.4." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"gamma":{gamma:.2f}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_black_clipping:
    summary: "Black clipping, 0 to 0.5 (named in the processor's own data, not the API tables)"
    params:
      level: { type: float, min: 0, max: 0.5, required: true,
               label: Black clipping,
               description: "Level below which the image is clipped to black, 0 for none to 0.5; the API tables do not document it, only the processor's own data." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"blackClipping":{level:.3f}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_display_gains:
    summary: "Display RGB gains, 1 is unity"
    params:
      r: { type: float, min: 0, required: true,
           label: Red gain,
           description: "Display gain for the red channel, where 1 is unity, below 1 dims it and above 1 boosts it." }
      g: { type: float, min: 0, required: true,
           label: Green gain,
           description: "Display gain for the green channel, where 1 is unity, below 1 dims it and above 1 boosts it." }
      b: { type: float, min: 0, required: true,
           label: Blue gain,
           description: "Display gain for the blue channel, where 1 is unity, below 1 dims it and above 1 boosts it." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"gains":{"r":{r:.3f},"g":{g:.3f},"b":{b:.3f}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_display_window:
    summary: "Position and size of the output window on the input canvas, in pixels"
    params:
      x: { type: int, min: 0, required: true,
           label: X,
           description: "Horizontal position of the output window on the input canvas, in pixels." }
      y: { type: int, min: 0, required: true,
           label: "Y",
           description: "Vertical position of the output window on the input canvas, in pixels." }
      width: { type: int, min: 1, required: true,
               label: Width,
               description: "Width of the output window, in pixels." }
      height: { type: int, min: 1, required: true,
                label: Height,
                description: "Height of the output window, in pixels." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"x":{x},"y":{y},"width":{width},"height":{height}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_display_size:
    summary: "Size of the output window, in pixels"
    params:
      width: { type: int, min: 1, required: true,
               label: Width,
               description: "Width of the output window, in pixels." }
      height: { type: int, min: 1, required: true,
                label: Height,
                description: "Height of the output window, in pixels." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"width":{width},"height":{height}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_output_adjust_enabled:
    summary: "Turn output adjustments on or off (dev.display.out.adjust.enabled)"
    params:
      enabled: { type: bool, default: true,
                 label: Output adjustments,
                 description: "True applies the output adjustment gain, gamma, lift, offset and saturation, and false bypasses them." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"out":{"adjust":{"enabled":{enabled}}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_output_adjust_gain:
    summary: "Output adjustment RGB gain"
    params:
      r: { type: float, min: 0, required: true,
           label: Red gain,
           description: "Output adjustment gain for the red channel, applied when output adjustments are on; 1 is unity." }
      g: { type: float, min: 0, required: true,
           label: Green gain,
           description: "Output adjustment gain for the green channel, applied when output adjustments are on; 1 is unity." }
      b: { type: float, min: 0, required: true,
           label: Blue gain,
           description: "Output adjustment gain for the blue channel, applied when output adjustments are on; 1 is unity." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"out":{"adjust":{"gain":{"r":{r:.3f},"g":{g:.3f},"b":{b:.3f}}}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_output_adjust_gamma:
    summary: "Output adjustment RGB gamma"
    params:
      r: { type: float, min: 0, required: true,
           label: Red gamma,
           description: "Output adjustment gamma for the red channel, applied when output adjustments are on." }
      g: { type: float, min: 0, required: true,
           label: Green gamma,
           description: "Output adjustment gamma for the green channel, applied when output adjustments are on." }
      b: { type: float, min: 0, required: true,
           label: Blue gamma,
           description: "Output adjustment gamma for the blue channel, applied when output adjustments are on." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"out":{"adjust":{"gamma":{"r":{r:.3f},"g":{g:.3f},"b":{b:.3f}}}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_output_adjust_lift:
    summary: "Output adjustment RGB lift, 0 is none"
    params:
      r: { type: float, required: true,
           label: Red lift,
           description: "Output adjustment lift for the red channel, raising or lowering the dark end, applied when output adjustments are on; 0 is none." }
      g: { type: float, required: true,
           label: Green lift,
           description: "Output adjustment lift for the green channel, raising or lowering the dark end, applied when output adjustments are on; 0 is none." }
      b: { type: float, required: true,
           label: Blue lift,
           description: "Output adjustment lift for the blue channel, raising or lowering the dark end, applied when output adjustments are on; 0 is none." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"out":{"adjust":{"lift":{"r":{r:.3f},"g":{g:.3f},"b":{b:.3f}}}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_output_adjust_offset:
    summary: "Output adjustment RGB offset, 0 is none"
    params:
      r: { type: float, required: true,
           label: Red offset,
           description: "Output adjustment offset for the red channel, added across the whole range when output adjustments are on; 0 is none." }
      g: { type: float, required: true,
           label: Green offset,
           description: "Output adjustment offset for the green channel, added across the whole range when output adjustments are on; 0 is none." }
      b: { type: float, required: true,
           label: Blue offset,
           description: "Output adjustment offset for the blue channel, added across the whole range when output adjustments are on; 0 is none." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"out":{"adjust":{"offset":{"r":{r:.3f},"g":{g:.3f},"b":{b:.3f}}}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_output_adjust_saturation:
    summary: "Output adjustment saturation, 1 is unity"
    params:
      saturation: { type: float, min: 0, required: true,
                    label: Saturation,
                    description: "Output adjustment saturation, where 1 is unity, 0 is greyscale and above 1 is more saturated." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"out":{"adjust":{"saturation":{saturation:.3f}}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  # ── Redundancy (Public API 6.1.1.3, 8.6) ──────────────────────────────────
  set_redundancy_mode:
    summary: "Redundancy mode: none, failover or seamless (the processor's own list also has manual and single)"
    params:
      mode: { type: enum, values: [none, failover, seamless, manual, single], required: true,
              label: Redundancy mode,
              description: "With none there is no redundancy, with failover the processor flips to the backup by itself on loss of video, and seamless is seamless redundancy; manual and single are in the processor's own list but the API does not describe them." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"redundancy":{"mode":"{mode}"}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_redundancy_role:
    summary: "This processor's long-term redundancy role: main, backup or offline"
    params:
      role: { type: enum, values: [main, backup, offline], required: true,
              label: Redundancy role,
              description: "This processor's long-term role in the redundant pair: main, backup or offline." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"redundancy":{"role":"{role}"}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  redundancy_flip:
    summary: "Flip the display to the main or the backup processor (redundancy state)"
    params:
      to: { type: enum, values: [main, backup], required: true,
            label: Flip to,
            description: "The processor to put the display on, main or backup; the state then reads active, standby or mixed." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"display":{"redundancy":{"state":"{to}"}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  # ── Processor (dev.ingest, Public API 6.1.3, 8.5) ─────────────────────────
  select_input:
    summary: "Select the input by its key, such as hdmi1, hdmi2, sdi1 to sdi4, or a stitched input such as hdmi2X1"
    params:
      input: { type: string, pattern: "^[A-Za-z0-9]{1,32}$", required: true,
               label: Input,
               description: "The input's key, such as hdmi1, hdmi2, sdi1 to sdi4 or a stitched input such as hdmi2X1, depending on the installed input cards." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"ingest":{"input":{input:json}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_test_pattern:
    summary: "Show a test pattern of this type, such as colorBars, red or grid (Public API 8.5.1)"
    params:
      type: { type: string, pattern: "^[A-Za-z0-9]{1,32}$", required: true,
              label: Test pattern,
              description: "The pattern type as the web application names it, such as colorBars, red or grid; showing it turns the test pattern on." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"ingest":{"testPattern":{"enabled":true,"type":{type:json}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_test_pattern_enabled:
    summary: "Turn the test pattern on or off (Public API 8.5.2)"
    params:
      enabled: { type: bool, default: false,
                 label: Test pattern,
                 description: "True shows the test pattern instead of the input and false turns it off." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"ingest":{"testPattern":{"enabled":{enabled}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_test_pattern_motion:
    summary: "Turn test pattern motion on or off"
    params:
      enabled: { type: bool, default: true,
                 label: Motion,
                 description: "True makes the test pattern move and false keeps it still." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"ingest":{"testPattern":{"motion":{enabled}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  # ── Groups (dev.groups, Public API 6.1.2) ─────────────────────────────────
  set_group_blackout:
    summary: "Black out a group of tiles, or bring it back; groups are indexed from 0"
    params:
      group: { type: int, min: 0, required: true,
               label: Group,
               description: "The group's index, counted from 0, with gaps where groups were removed." }
      enabled: { type: bool, default: true,
                 label: Blackout,
                 description: "True blacks out the group's tiles and false brings their picture back." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"groups":{"{group}":{"blackout":{enabled}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_group_name:
    summary: "Rename a group"
    params:
      group: { type: int, min: 0, required: true,
               label: Group,
               description: "The group's index, counted from 0, with gaps where groups were removed." }
      name: { type: string, max_length: 64, required: true,
              label: Name,
              description: "The group's name, up to 64 characters." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"groups":{"{group}":{"name":{name:json}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_group_gains:
    summary: "A group's RGB and intensity gains"
    params:
      group: { type: int, min: 0, required: true,
               label: Group,
               description: "The group's index, counted from 0, with gaps where groups were removed." }
      r: { type: float, min: 0, required: true,
           label: Red gain,
           description: "The group's gain for the red channel; the spec gives no unity value, so read the current gains first." }
      g: { type: float, min: 0, required: true,
           label: Green gain,
           description: "The group's gain for the green channel; the spec gives no unity value, so read the current gains first." }
      b: { type: float, min: 0, required: true,
           label: Blue gain,
           description: "The group's gain for the blue channel; the spec gives no unity value, so read the current gains first." }
      i: { type: float, min: 0, required: true,
           label: Intensity gain,
           description: "The group's overall intensity gain; the spec gives no unity value, so read the current gains first." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"groups":{"{group}":{"gains":{"r":{r:.3f},"g":{g:.3f},"b":{b:.3f},"i":{i:.3f}}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_group_mask_enabled:
    summary: "Turn a group's mask on or off"
    params:
      group: { type: int, min: 0, required: true,
               label: Group,
               description: "The group's index, counted from 0, with gaps where groups were removed." }
      enabled: { type: bool, default: true,
                 label: Mask,
                 description: "True turns the group's mask on and false turns it off." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"groups":{"{group}":{"mask":{"enabled":{enabled}}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_group_mask:
    summary: "A group's mask edge offsets: left, top, bottom and right"
    params:
      group: { type: int, min: 0, required: true,
               label: Group,
               description: "The group's index, counted from 0, with gaps where groups were removed." }
      l: { type: float, min: 0, required: true,
           label: Left,
           description: "How far the mask comes in from the group's left edge; the API does not state the unit." }
      t: { type: float, min: 0, required: true,
           label: Top,
           description: "How far the mask comes in from the group's top edge; the API does not state the unit." }
      b: { type: float, min: 0, required: true,
           label: Bottom,
           description: "How far the mask comes in from the group's bottom edge; the API does not state the unit." }
      r: { type: float, min: 0, required: true,
           label: Right,
           description: "How far the mask comes in from the group's right edge; the API does not state the unit." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"groups":{"{group}":{"mask":{"l":{l:.3f},"t":{t:.3f},"b":{b:.3f},"r":{r:.3f}}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_group_test_pattern_enabled:
    summary: "Turn a group's test pattern on or off"
    params:
      group: { type: int, min: 0, required: true,
               label: Group,
               description: "The group's index, counted from 0, with gaps where groups were removed." }
      enabled: { type: bool, default: true,
                 label: Test pattern,
                 description: "True shows the group's test pattern colour on its tiles and false turns it off." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"groups":{"{group}":{"testPattern":{"enabled":{enabled}}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_group_test_pattern_color:
    summary: "A group's test pattern colour, R, G, B and A"
    params:
      group: { type: int, min: 0, required: true,
               label: Group,
               description: "The group's index, counted from 0, with gaps where groups were removed." }
      r: { type: float, min: 0, required: true,
           label: Red,
           description: "The red component of the group's test pattern colour; the API does not state its scale." }
      g: { type: float, min: 0, required: true,
           label: Green,
           description: "The green component of the group's test pattern colour; the API does not state its scale." }
      b: { type: float, min: 0, required: true,
           label: Blue,
           description: "The blue component of the group's test pattern colour; the API does not state its scale." }
      a: { type: float, min: 0, required: true,
           label: Alpha,
           description: "The alpha (opacity) of the group's test pattern colour; the API does not state its scale." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"groups":{"{group}":{"testPattern":{"r":{r:.3f},"g":{g:.3f},"b":{b:.3f},"a":{a:.3f}}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  # ── Receivers (dev.receivers, Public API 6.1.4) ───────────────────────────
  set_receiver_group:
    summary: "Put a receiver (tile), by MAC address, in a group; -1 for none"
    params:
      mac: { type: string, pattern: "^[0-9a-f]{2}(:[0-9a-f]{2}){5}$", required: true,
             label: Receiver MAC address,
             description: "The receiver (tile) by its MAC address, in lower-case hex pairs separated by colons." }
      group: { type: int, min: -1, required: true,
               label: Group,
               description: "The index of the group to put the receiver in, from 0, or -1 for no group." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"receivers":{"{mac}":{"groupId":{group}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  set_receiver_position:
    summary: "Move a receiver (tile), by MAC address, on the processor's canvas"
    params:
      mac: { type: string, pattern: "^[0-9a-f]{2}(:[0-9a-f]{2}){5}$", required: true,
             label: Receiver MAC address,
             description: "The receiver (tile) by its MAC address, in lower-case hex pairs separated by colons." }
      x: { type: int, min: 0, required: true,
           label: X,
           description: "The receiver's horizontal position on the processor's canvas, from 0 (presumably pixels); a wrong position shows the wrong part of the picture." }
      y: { type: int, min: 0, required: true,
           label: "Y",
           description: "The receiver's vertical position on the processor's canvas, from 0 (presumably pixels); a wrong position shows the wrong part of the picture." }
    send: { method: PATCH, path: /api/v1/public, body: '{"dev":{"receivers":{"{mac}":{"x":{x},"y":{y}}}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  # ── System (sys, Public API 6.2) ──────────────────────────────────────────
  set_processor_name:
    summary: "The processor's name, as on its front panel and web application (sys.description)"
    params:
      name: { type: string, max_length: 64, required: true,
              label: Processor name,
              description: "The name shown on the processor's front panel and web application, up to 64 characters." }
    send: { method: PATCH, path: /api/v1/public, body: '{"sys":{"description":{name:json}}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  # ── Saved configurations (Public API 3.3) ─────────────────────────────────
  list_presets:
    summary: "Saved configurations (presets): id, presetName and times, without their settings (HELIOS 23.12.1 and later)"
    send: { method: GET, path: /api/v1/presets/list }
    expect: { status: 200, json_path: "$.presets" }
    returns: value

  list_presets_full:
    summary: "Saved configurations with their saved settings"
    send: { method: GET, path: /api/v1/presets }
    expect: { status: 200, json_path: "$.presets" }
    returns: value

  recall_preset:
    summary: "Apply a saved configuration by id; answers with the applied state"
    params:
      id: { type: int, min: 0, required: true,
            label: Preset,
            description: "The id of the saved configuration to apply, as list_presets gives it; it changes the live display at once." }
    send: { method: POST, path: "/api/v1/presets/{id}/apply" }
    expect: { status: 200 }
    returns: ack

  recall_preset_by_name:
    summary: "Apply the first saved configuration with this name"
    params:
      name: { type: string, max_length: 128, required: true,
              label: Preset name,
              description: "The saved configuration's name; the first one with this name is applied to the live display at once." }
    send: { method: POST, path: /api/v1/presets/apply, body: '{"presetName":{name:json}}', content_type: application/json }
    expect: { status: 200 }
    returns: ack

  # ── Still store (Public API 3.4) ──────────────────────────────────────────
  list_stills:
    summary: "Stills in the still store: id, name, internal file name and times"
    send: { method: GET, path: /api/v1/media }
    expect: { status: 200, json_path: "$.media" }
    returns: value

  show_still:
    summary: "Show the still with this id on the display"
    params:
      id: { type: int, min: 0, required: true,
            label: Still,
            description: "The id of the still to show, as list_stills gives it." }
    send: { method: POST, path: "/api/v1/media/{id}/show" }
    expect: { status: 204 }
    returns: ack

  show_still_by_name:
    summary: "Show the first still with this name"
    params:
      name: { type: string, max_length: 255, required: true,
              label: Still name,
              description: "The still's name; the first still with this name is shown." }
    send: { method: POST, path: /api/v1/media/show, body: '{"name":{name:json}}', content_type: application/json }
    expect: { status: 204 }
    returns: ack

  hide_still:
    summary: "Stop showing a still"
    send: { method: POST, path: /api/v1/media/hide }
    expect: { status: 204 }
    returns: ack

  # ── Preview (Public API 3.2) ──────────────────────────────────────────────
  list_preview_sources:
    summary: "The preview sources, such as preview, hdmi and sdi1; a JPEG of each is at /api/v1/preview/<source>"
    send: { method: GET, path: /api/v1/preview }
    expect: { status: 200, json_path: "$" }
    returns: value

telemetry:
  # HELIOS pushes every property change on its JSON-RPC websocket without a
  # subscription (Public API section 4.4), as {"method":"update","params":
  # {<changed part of the tree>}}. On opening it, the core asks for the whole
  # tree with the state method; the result has the same shape under
  # $.result. HTTP replies to the commands (GET and PATCH of /api/v1/public)
  # carry the tree too. Nothing is polled. Receivers and switches are keyed by
  # MAC address, which a JSON path cannot name in advance, so only their
  # counts and alerts are kept; groups 0-7, inputs hdmi1-2 and sdi1-4, output
  # ports 1-8 and input ports 1-4 are read by their keys.
  websocket:
    path: /api/v1/public/rpc/websocket
    send:
      - '{"jsonrpc":"2.0","id":1,"method":"state"}'
  updates:
    # HTTP replies (GET and PATCH)
    - path: "^/api/v1/public(\\?.*)?$"
      json:
        v0: "$.dev.display.blackout"
        v1: "$.dev.display.freeze"
        v2: "$.dev.display.brightness"
        v3: "$.dev.display.cct"
        v4: "$.dev.display.cctDuv"
        v5: "$.dev.display.gamma"
        v6: "$.dev.display.blackClipping"
        v7: "$.dev.display.gains.r"
        v8: "$.dev.display.gains.g"
        v9: "$.dev.display.gains.b"
        v10: "$.dev.display.width"
        v11: "$.dev.display.height"
        v12: "$.dev.display.x"
        v13: "$.dev.display.y"
        v14: "$.dev.display.tilesCount"
        v15: "$.dev.display.tilesInfo"
