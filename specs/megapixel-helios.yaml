quirks:
  - models: [all]
    severity: warning
    text: >
      A PATCH with a value out of range leaves the property as it was, and an
      unknown property is ignored; both answer 200 with the property's actual
      value, or with nothing for an unknown one (Public API 3.1.4). A command
      here therefore succeeds whether or not the value was taken; the state,
      updated from the reply, shows what the processor holds. The ranges here
      are the processor's own (sys.fixtures in the payload sample) where it
      reports one, and otherwise only a lower bound.

  - models: [all]
    severity: info
    text: >
      Requests with a body need Content-Type application/json, or HELIOS
      answers 406; a malformed request answers 400 (Public API 2.1.3-2.1.4).

  - models: [all]
    severity: info
    text: >
      Authentication, when turned on in the web application, applies to the
      whole API including the websocket, by basic or digest access (realm "M8
      Processor"); use HTTPS (port 443, scheme https) where the network is not
      trusted (Public API 5). The username and password settings are the web
      application's.

  - models: [all]
    severity: info
    text: >
      Property changes are pushed on the JSON-RPC websocket to every connected
      client without subscribing (Public API 4.4); a notification can carry one
      property or many at once. The JSON-RPC interface cannot read a single
      property: the state method returns the whole tree.

  - models: [all]
    severity: info
    text: >
      Groups are keyed by index from 0, sequential but with gaps where groups
      were removed; a receiver's groupId refers to them, -1 for none.
      Receivers are keyed by MAC address. Telemetry reads groups 0 to 7 and
      the inputs, ports and input ports by their keys; any other group is
      updated only by get_properties or get_state.

  - models: [all]
    severity: critical
    text: >
      recall_preset and recall_preset_by_name apply a saved configuration to
      the live display at once (brightness, colour temperature, gamma, test
      pattern, blackout, whatever it saved); there is no undo. An unknown id
      answers 404. By name, the first configuration with that name is used.

  - models: [all]
    severity: critical
    text: >
      set_blackout, set_freeze, set_test_pattern, select_input, show_still and
      the group blackout and test pattern commands change the live display
      immediately.

  - models: [all]
    severity: critical
    text: >
      redundancy_flip moves the display to the main or backup processor. Only
      main and backup can be requested; the state then reads active, standby
      or mixed, never the value sent (Public API 8.6). With redundancy mode
      failover the processor also flips by itself on loss of video.

  - models: [all]
    severity: warning
    text: >
      set_receiver_position and set_receiver_group change the tile map that
      the processor's mapping uses; a wrong position shows the wrong part of
      the picture on that tile.

  - models: [all]
    severity: info
    text: >
      The test pattern types are not listed in the API document; colorBars,
      red and grid are named in it, and the web application shows the rest.
      Input keys (hdmi1, hdmi2, sdi1 to sdi4, and stitched inputs such as
      hdmi2X1 and sdi1X2) depend on the installed input cards; dev.ingest.inputs
      in get_state lists them.

  - models: [all]
    severity: info
    text: >
      Not included: uploading a still (multipart/form-data, which the format
      does not send), the MJPEG and JPEG previews (binary, at
      /api/v1/preview/<source>), sACN control of group gains (UDP 5568), and
      the processor reboot and pixel error detection that release notes after
      24.07 add to the API, whose request forms are only in the on-request
      API document.
