# Eos pushes the implicit outputs (/eos/out/...) whenever OSC TX is on. Show data change
# notifications need /eos/subscribe=1, which lasts for the connection. No query is asked
# on connecting: Eos answers /eos/get/... on /eos/out/get/..., not on the address asked,
# and a poll waits for the reply on its own address (see the report for this spec).
telemetry:
  subscribe:
    send:
      - { address: /eos/subscribe, args: [ { value: "1", type: int } ] }
  # Asked once on connecting (OSC Get): the version, the show path, how many of
  # each target the show holds, and cue list 1 (the only list on Element 2 and
  # Element Classic). Eos answers each on /eos/out/get/..., not on the address
  # asked, so each query names its reply_address; the replies go through the
  # rules below. A list or target that does not exist gets no reply, and the
  # query times out without dropping the connection.
  poll:
    send:
      - { address: /eos/get/version, reply_address: "^/eos/out/get/version$" }
      - { address: /eos/get/show/path, reply_address: "^/eos/out/get/show/path$" }
      - { address: /eos/get/bp/count, reply_address: "^/eos/out/get/bp/count$" }
      - { address: /eos/get/cp/count, reply_address: "^/eos/out/get/cp/count$" }
      - { address: /eos/get/fp/count, reply_address: "^/eos/out/get/fp/count$" }
      - { address: /eos/get/ip/count, reply_address: "^/eos/out/get/ip/count$" }
      - { address: /eos/get/preset/count, reply_address: "^/eos/out/get/preset/count$" }
      - { address: /eos/get/cuelist/count, reply_address: "^/eos/out/get/cuelist/count$" }
      - { address: /eos/get/curve/count, reply_address: "^/eos/out/get/curve/count$" }
      - { address: /eos/get/fx/count, reply_address: "^/eos/out/get/fx/count$" }
      - { address: /eos/get/group/count, reply_address: "^/eos/out/get/group/count$" }
      - { address: /eos/get/macro/count, reply_address: "^/eos/out/get/macro/count$" }
      - { address: /eos/get/ms/count, reply_address: "^/eos/out/get/ms/count$" }
      - { address: /eos/get/pixmap/count, reply_address: "^/eos/out/get/pixmap/count$" }
      - { address: /eos/get/snap/count, reply_address: "^/eos/out/get/snap/count$" }
      - { address: /eos/get/sub/count, reply_address: "^/eos/out/get/sub/count$" }
      - { address: /eos/get/eventlist/count, reply_address: "^/eos/out/get/eventlist/count$" }
      - { address: /eos/get/patch/count, reply_address: "^/eos/out/get/patch/count$" }
      - { address: /eos/get/fpe/count, reply_address: "^/eos/out/get/fpe/count$" }
      - { address: /eos/get/cuelist/1, reply_address: "^/eos/out/get/cuelist/1/list/0/\\d+$" }
      - { address: /eos/get/cue/1/count, reply_address: "^/eos/out/get/cue/1/count$" }
      - { address: /eos/get/cue/1/noparts/count, reply_address: "^/eos/out/get/cue/1/noparts/count$" }
  updates:
    - address: '^/eos/out/get/version$'
      state: { version.eos: "{arg0}", version.fixture_library: "{arg1}", version.gel_swatch_mode: "{arg2}" }
    - address: '^/eos/out/show/name$'
      state: { show.name: "{arg0}" }
    - address: '^/eos/out/get/show/path$'
      state: { show.path: "{arg0}" }
    - address: '^/eos/out/event/show/(saved|loaded|cleared)$'
      state: { show.last_file_event: "{1}", show.last_file: "{arg0}" }
    - address: '^/eos/out/user$'
      state: { osc_user: "{arg0}" }
    - address: '^/eos/out/cmd$'
      state:
        command_line.text: "{arg0}"
        command_line.error: { value: "{arg1}", map: { "0": false, "1": true } }
    - address: '^/eos/out/user/(\d+)/cmd$'
      state:
        "users.{1}.command_line": "{arg0}"
        "users.{1}.command_line_error": { value: "{arg1}", map: { "0": false, "1": true } }
    - address: '^/eos/out/softkey/(\d+)$'
      state: { "softkeys.{1}.label": "{arg0}" }
    - address: '^/eos/out/event/state$'
      state: { console.live: { value: "{arg0}", map: { "0": false, "1": true } } }
    - address: '^/eos/out/event/locked$'
      state: { console.locked: { value: "{arg0}", map: { "0": false, "1": true } } }
    - address: '^/eos/out/wheel$'
      state: { osc_wheel.value: "{arg0}" }
    - address: '^/eos/out/switch$'
      state: { osc_switch.value: "{arg0}" }
    - address: '^/eos/out/active/cue$'
      state: { active_cue.percent: "{arg0}" }
    - address: '^/eos/out/active/cue/(\d+)/([0-9.]+)$'
      state: { active_cue.list: "{1}", active_cue.number: "{2}", active_cue.percent: "{arg0}" }
    - address: '^/eos/out/active/cue/text$'
      state: { active_cue.text: "{arg0}" }
    - address: '^/eos/out/pending/cue/(\d+)/([0-9.]+)$'
      state: { pending_cue.list: "{1}", pending_cue.number: "{2}", pending_cue.part: "0" }
    - address: '^/eos/out/pending/cue/(\d+)/([0-9.]+)/(\d+)$'
      state: { pending_cue.list: "{1}", pending_cue.number: "{2}", pending_cue.part: "{3}" }
    - address: '^/eos/out/pending/cue/(?:\d+/[0-9.]+/)?text$'
      state: { pending_cue.text: "{arg0}" }
    - address: '^/eos/out/previous/cue/(\d+)/([0-9.]+)$'
      state: { previous_cue.list: "{1}", previous_cue.number: "{2}", previous_cue.part: "0" }
    - address: '^/eos/out/previous/cue/(\d+)/([0-9.]+)/(\d+)$'
      state: { previous_cue.list: "{1}", previous_cue.number: "{2}", previous_cue.part: "{3}" }
    - address: '^/eos/out/previous/cue/(?:\d+/[0-9.]+/)?text$'
      state: { previous_cue.text: "{arg0}" }
    - address: '^/eos/out/event/cue/(\d+)/([0-9.]+)/(fire|stop|resume)$'
      state: { last_cue_event.list: "{1}", last_cue_event.number: "{2}", last_cue_event.action: "{3}", last_cue_event.label: "{arg0}" }
    - address: '^/eos/out/event/macro/(\d+)$'
      state: { last_macro_event.macro: "{1}" }
    - address: '^/eos/out/event/sub/(\d+)$'
      state: { "submasters.{1}.bump": { value: "{arg0}", map: { "0": false, "1": true } } }
    - address: '^/eos/out/event/relay/(\d+)/(\d+)$'
      state: { "relays.{1}.{2}.state": "{arg0}" }
    - address: '^/eos/out/active/chan$'
      state: { selection.active_channels: "{arg0}", selection.active_channel_info: "{arg1}" }
    - address: '^/eos/out/get/chans$'
      state: { selection.osc_user_channels: "{arg0}" }
    - address: '^/eos/out/color/hs$'
      state: { selection.hue: "{arg0}", selection.saturation: "{arg1}" }
    - address: '^/eos/out/pantilt$'
      state:
        selection.pan_min: "{arg0}"
        selection.pan_max: "{arg1}"
        selection.tilt_min: "{arg2}"
        selection.tilt_max: "{arg3}"
        selection.pan: "{arg4}"
        selection.tilt: "{arg5}"
    - address: '^/eos/out/xyz$'
      state: { selection.x: "{arg0}", selection.y: "{arg1}", selection.z: "{arg2}" }
    - address: '^/eos/out/active/wheel/(\d+)$'
      state: { "wheels.{1}.label": "{arg0}", "wheels.{1}.category": "{arg1}", "wheels.{1}.value": "{arg2}" }
    - address: '^/eos/out/param/([^/.]+)$'
      state: { "params.{1}.value": "{arg0}", "params.{1}.min": "{arg1}", "params.{1}.max": "{arg2}" }
    - address: '^/eos/out/fader/(\d+)$'
      state: { "fader_banks.{1}.page": "{arg0}" }
    - address: '^/eos/(?:out/)?fader/(\d+)/(\d+)$'
      state: { "fader_banks.{1}.faders.{2}.level": "{arg0}" }
    - address: '^/eos/out/fader/(\d+)/(\d+)/name$'
      state: { "fader_banks.{1}.faders.{2}.name": "{arg0}" }
    - address: '^/eos/out/fader/range/(\d+)/(\d+)$'
      state: { "fader_banks.{1}.faders.{2}.min": "{arg0}", "fader_banks.{1}.faders.{2}.max": "{arg1}" }
    - address: '^/eos/out/cuelist/(\d+)$'
      state: { "cue_list_banks.{1}.label": "{arg0}", "cue_list_banks.{1}.total_cues": "{arg1}", "cue_list_banks.{1}.follow_time": "{arg2}" }
    - address: '^/eos/out/cuelist/(\d+)/(\d+)$'
      state:
        "cue_list_banks.{1}.rows.{2}.osc_label": "{arg0}"
        "cue_list_banks.{1}.rows.{2}.cue_number": "{arg1}"
        "cue_list_banks.{1}.rows.{2}.label": "{arg2}"
        "cue_list_banks.{1}.rows.{2}.notes": "{arg3}"
        "cue_list_banks.{1}.rows.{2}.scene": "{arg4}"
        "cue_list_banks.{1}.rows.{2}.scene_end": "{arg5}"
        "cue_list_banks.{1}.rows.{2}.duration": "{arg6}"
        "cue_list_banks.{1}.rows.{2}.remaining": "{arg7}"
    - address: '^/eos/out/ds/(\d+)$'
      state: { "direct_select_banks.{1}.title": "{arg0}" }
    - address: '^/eos/out/ds/(\d+)/(\d+)$'
      state: { "direct_select_banks.{1}.buttons.{2}.target": "{arg0}", "direct_select_banks.{1}.buttons.{2}.name": "{arg1}" }
    - address: '^/eos/out/notify/([a-z0-9]+)/list/0/\d+$'
      state: { "show_data.{1}.notify_sequence": "{arg0}" }
    - address: '^/eos/out/notify/cue/(\d+)/list/0/\d+$'
      state: { "cue_lists.{1}.notify_sequence": "{arg0}" }
    - address: '^/eos/out/get/(bp|cp|fp|ip|preset|cuelist|curve|fx|group|macro|ms|pixmap|snap|sub|eventlist|patch|fpe)/count$'
      state: { "show_data.{1}.count": "{arg0}" }
    - address: '^/eos/out/get/cue/(\d+)/count$'
      state: { "cue_lists.{1}.cue_count": "{arg0}" }
    - address: '^/eos/out/get/cue/(\d+)/noparts/count$'
      state: { "cue_lists.{1}.cue_count_no_parts": "{arg0}" }
    - address: '^/eos/out/get/cuelist/(\d+)/list/0/\d+$'
      state:
        "cue_lists.{1}.uid": "{arg1}"
        "cue_lists.{1}.label": "{arg2}"
        "cue_lists.{1}.playback_mode": "{arg3}"
        "cue_lists.{1}.fader_mode": "{arg4}"
        "cue_lists.{1}.independent": "{arg5}"
        "cue_lists.{1}.htp": "{arg6}"
        "cue_lists.{1}.assert": "{arg7}"
