commands:
  ping:
    summary: "Ping Eos; the reply on /eos/out/ping echoes the argument sent"
    params:
      text: { type: string, max_length: 64, default: "meros", label: Ping text, description: "Text Eos echoes back on /eos/out/ping, which confirms the reply belongs to this ping." }
    send: { address: "/eos/ping", args: [ { value: "{text}", type: string } ] }
    expect: { address: "/eos/out/ping", arg: 0 }
    returns: value

  reset:
    summary: "Reset this device's OSC configuration (switches, OSC user, wheel modes) and have Eos resend every implicit output"
    send: { address: "/eos/reset" }
    returns: none

  set_osc_user:
    summary: "Set the Eos user ID this device's OSC commands act as: 0 is the background user, -1 the console's current user"
    params:
      user: { type: int, min: -1, max: 99, required: true, label: OSC user, description: "Eos user ID from 1 to 99 for this device's OSC commands; 0 is the background user, whose commands appear on no command line, and -1 follows the console's current user." }
    send: { address: "/eos/user", args: [ { value: "{user}", type: int } ] }
    returns: none

  set_osc_user_auto:
    summary: "Have Eos give this device a user ID no other device uses, so it gets its own command line"
    send: { address: "/eos/user/auto" }
    returns: none

  subscribe:
    summary: "Subscribe to (or unsubscribe from) /eos/out/notify show data change notifications"
    params:
      enabled: { type: bool, default: true, label: Subscribed, description: "On asks Eos to send notifications whenever show data changes, off stops them." }
    send: { address: "/eos/subscribe", args: [ { value: "{enabled:bool01}", type: int } ] }
    returns: none

  subscribe_param:
    summary: "Subscribe to (or unsubscribe from) /eos/out/param updates for one or more parameters (param1/param2/...)"
    params:
      param:   { type: string, max_length: 128, pattern: "^[A-Za-z0-9_ \\\\]+(/[A-Za-z0-9_ \\\\]+)*$", required: true, label: Parameters, description: "Parameter name as Eos names it (e.g. pan, tilt, red), case-insensitive and abbreviable, with underscores or spaces for spaces and a backslash for a slash; give several as param1/param2." }
      enabled: { type: bool, default: true, label: Subscribed, description: "On asks Eos to send updates for these parameters, off stops them." }
    send: { address: "/eos/subscribe/param/{param}", args: [ { value: "{enabled:bool01}", type: int } ] }
    returns: none

  add_filter:
    summary: "Add an output filter: Eos then sends this device only messages matching its filters (* wildcards allowed)"
    params:
      filter: { type: string, max_length: 256, pattern: "^/[^ ]*$", required: true, label: Filter, description: "OSC address pattern starting with /, with * as a wildcard; once any filter is set, Eos sends this device only matching messages, including the outputs that keep state current." }
    send: { address: "/eos/filter/add", args: [ { value: "{filter}", type: string } ] }
    returns: none

  remove_filter:
    summary: "Remove an output filter from this device"
    params:
      filter: { type: string, max_length: 256, pattern: "^/[^ ]*$", required: true, label: Filter, description: "Output filter to remove, written exactly as it was added." }
    send: { address: "/eos/filter/remove", args: [ { value: "{filter}", type: string } ] }
    returns: none

  clear_filters:
    summary: "Clear every output filter for this device so Eos sends it all messages"
    send: { address: "/eos/filter/clear" }
    returns: none

  command:
    summary: "Add text to the OSC user's command line; end it with # or Enter to execute"
    params:
      text: { type: string, max_length: 256, required: true, label: Command text, description: "Text added to the OSC user's command line, in Eos command syntax; end it with # or Enter to execute it." }
    send: { address: "/eos/cmd", args: [ { value: "{text}", type: string } ] }
    returns: none

  new_command:
    summary: "Clear the OSC user's command line, then add text to it; end with # or Enter to execute"
    params:
      text: { type: string, max_length: 256, required: true, label: Command text, description: "Text that replaces the OSC user's command line, in Eos command syntax; end it with # or Enter to execute it." }
    send: { address: "/eos/newcmd", args: [ { value: "{text}", type: string } ] }
    returns: none

  command_event:
    summary: "Execute command line text as a console event (like a macro running outside the command line)"
    params:
      text: { type: string, max_length: 256, required: true, label: Command text, description: "Eos command line text executed as a console event, like a macro running outside the operator's command line." }
    send: { address: "/eos/event", args: [ { value: "{text}", type: string } ] }
    returns: none

  new_command_event:
    summary: "Clear the internal command line, then execute text as a console event"
    params:
      text: { type: string, max_length: 256, required: true, label: Command text, description: "Eos command line text executed as a console event after the internal command line is cleared." }
    send: { address: "/eos/newevent", args: [ { value: "{text}", type: string } ] }
    returns: none

  fire_show_control_event:
    summary: "Fire the event whose input string matches, on a show control list of type Network Inputs (case-sensitive)"
    params:
      input: { type: string, max_length: 128, pattern: "^[^/ #*,?\\[\\]{}]+$", required: true, label: Input string, description: "Input string of the event to fire, matched exactly including case, on a show control list of type Network Inputs." }
    send: { address: "/eos/sc/{input}" }
    returns: none

  go:
    summary: "Press and release the Go key"
    send:
      - { address: "/eos/key/go_0", args: [ { value: "1.0", type: float } ] }
      - { address: "/eos/key/go_0", args: [ { value: "0.0", type: float } ] }
    returns: none

  press_key:
    summary: "Press and release a console key by its OSC key name (for the slash key use a backslash)"
    params:
      key: { type: string, max_length: 64, pattern: "^[A-Za-z0-9_ .@+%\\\\-]+$", required: true, label: Key, description: "Console key by its OSC key name from the OSC Eos Keys list (e.g. go_0); for the slash key use a backslash." }
    send:
      - { address: "/eos/key/{key}", args: [ { value: "1.0", type: float } ] }
      - { address: "/eos/key/{key}", args: [ { value: "0.0", type: float } ] }
    returns: none

  key_down:
    summary: "Hold a console key down until key_up"
    params:
      key: { type: string, max_length: 64, pattern: "^[A-Za-z0-9_ .@+%\\\\-]+$", required: true, label: Key, description: "Console key by its OSC key name from the OSC Eos Keys list; it stays held until key_up releases it." }
    send: { address: "/eos/key/{key}", args: [ { value: "1.0", type: float } ] }
    returns: none

  key_up:
    summary: "Release a console key"
    params:
      key: { type: string, max_length: 64, pattern: "^[A-Za-z0-9_ .@+%\\\\-]+$", required: true, label: Key, description: "OSC key name of the held console key to release." }
    send: { address: "/eos/key/{key}", args: [ { value: "0.0", type: float } ] }
    returns: none

  press_softkey:
    summary: "Press and release a softkey (6 softkeys on 2 pages: 1-12)"
    params:
      softkey: { type: int, min: 1, max: 12, required: true, label: Softkey, description: "Softkey number from 1 to 12: 1-6 on the first page and 7-12 on the second." }
    send:
      - { address: "/eos/softkey/{softkey}", args: [ { value: "1.0", type: float } ] }
      - { address: "/eos/softkey/{softkey}", args: [ { value: "0.0", type: float } ] }
    returns: none

  fire_cue:
    summary: "Fire a specific cue in a cue list"
    params:
      cue_list: { type: int, min: 1, max: 999, default: 1, label: Cue list, description: "Cue list number from 1 to 999, 1 if omitted; Element 2 and Element Classic have only cue list 1." }
      cue:      { type: string, max_length: 16, pattern: "^[0-9]+(\\.[0-9]+)?$", required: true, label: Cue, description: "Cue number as text, which may contain a point (1 or 1.5); kept as text so trailing zeros are not lost." }
    send: { address: "/eos/cue/{cue_list}/{cue}/fire" }
    returns: none

  fire_cue_part:
    summary: "Fire a part of a cue in a cue list"
    params:
      cue_list: { type: int, min: 1, max: 999, required: true, label: Cue list, description: "Cue list number from 1 to 999; Element 2 and Element Classic have one cue list, so use 1 there." }
      cue:      { type: string, max_length: 16, pattern: "^[0-9]+(\\.[0-9]+)?$", required: true, label: Cue, description: "Cue number as text, which may contain a point (1 or 1.5); kept as text so trailing zeros are not lost." }
      part:     { type: int, min: 1, required: true, label: Part, description: "Cue part number, from 1." }
    send: { address: "/eos/cue/{cue_list}/{cue}/{part}/fire" }
    returns: none

  fire_cue_current_list:
    summary: "Fire a cue in the current cue list"
    params:
      cue: { type: string, max_length: 16, pattern: "^[0-9]+(\\.[0-9]+)?$", required: true, label: Cue, description: "Cue number in the current cue list as text, which may contain a point (1 or 1.5)." }
    send: { address: "/eos/cue/{cue}/fire" }
    returns: none

  go_main:
    summary: "Play back the cue list on the main playback, like [Go]"
    send: { address: "/eos/cues/fire" }
    returns: none

  stop_back:
    summary: "Stop an active fade on the main playback's cue list, or go back a cue if it is not fading"
    send: { address: "/eos/cues/stop" }
    returns: none

  go_cue_list:
    summary: "Play back a cue list, like [Go] on its playback"
    params:
      cue_list: { type: int, min: 1, max: 999, required: true, label: Cue list, description: "Cue list number from 1 to 999; Element 2 and Element Classic have one cue list, so use 1 there." }
    send: { address: "/eos/cues/{cue_list}/fire" }
    returns: none

  stop_back_cue_list:
    summary: "Stop an active fade in a cue list, or go back a cue if it is not fading"
    params:
      cue_list: { type: int, min: 1, max: 999, required: true, label: Cue list, description: "Cue list number from 1 to 999; Element 2 and Element Classic have one cue list, so use 1 there." }
    send: { address: "/eos/cues/{cue_list}/stop" }
    returns: none

  select_cue_list:
    summary: "Select a cue list"
    params:
      cue_list: { type: int, min: 1, max: 999, required: true, label: Cue list, description: "Cue list number from 1 to 999; Element 2 and Element Classic have one cue list, so use 1 there." }
    send: { address: "/eos/cues/{cue_list}" }
    returns: none

  configure_cue_list_bank:
    summary: "Create an OSC cue list bank showing a cue list (0 follows the current list) with rows before and after the current cue"
    params:
      bank:     { type: int, min: 1, required: true, label: Cue list bank, description: "OSC cue list bank number, from 1, as given when the bank was configured." }
      cue_list: { type: int, min: 0, max: 999, required: true, label: Cue list, description: "Cue list the bank shows, from 1 to 999; 0 follows the current cue list." }
      previous: { type: int, min: 0, required: true, label: Previous cues, description: "Number of cues shown before the current cue." }
      pending:  { type: int, min: 0, required: true, label: Pending cues, description: "Number of cues shown after the current cue." }
    send: { address: "/eos/cuelist/{bank}/config/{cue_list}/{previous}/{pending}" }
    returns: none

  configure_cue_list_bank_offset:
    summary: "Create an OSC cue list bank starting at a 0-based offset into the cue list"
    params:
      bank:     { type: int, min: 1, required: true, label: Cue list bank, description: "OSC cue list bank number, from 1, as given when the bank was configured." }
      cue_list: { type: int, min: 0, max: 999, required: true, label: Cue list, description: "Cue list the bank shows, from 1 to 999; 0 follows the current cue list." }
      previous: { type: int, min: 0, required: true, label: Previous cues, description: "Number of cues shown before the current cue." }
      pending:  { type: int, min: 0, required: true, label: Pending cues, description: "Number of cues shown after the current cue." }
      offset:   { type: int, min: 0, required: true, label: Offset, description: "Row of the cue list the bank starts at, counted from 0." }
    send: { address: "/eos/cuelist/{bank}/config/{cue_list}/{previous}/{pending}/{offset}" }
    returns: none

  page_cue_list_bank:
    summary: "Scroll an OSC cue list bank by rows (0 jumps back to the current cue and follows it); does not play cues"
    params:
      bank:  { type: int, min: 1, required: true, label: Cue list bank, description: "OSC cue list bank number, from 1, as given when the bank was configured." }
      delta: { type: int, required: true, label: Rows, description: "Rows to scroll the bank by, either way; 0 jumps back to the current cue and follows it again." }
    send: { address: "/eos/cuelist/{bank}/page/{delta}" }
    returns: none

  select_cue_list_bank_cue:
    summary: "Jump an OSC cue list bank's view to a cue"
    params:
      bank: { type: int, min: 1, required: true, label: Cue list bank, description: "OSC cue list bank number, from 1, as given when the bank was configured." }
      cue:  { type: string, max_length: 16, pattern: "^[0-9]+(\\.[0-9]+)?$", required: true, label: Cue, description: "Cue to show in the bank, as text that may contain a point (1 or 1.5); the cue is not played." }
    send: { address: "/eos/cuelist/{bank}/select/{cue}" }
    returns: none

  reset_cue_list_bank:
    summary: "Reset an OSC cue list bank"
    params:
      bank: { type: int, min: 1, required: true, label: Cue list bank, description: "OSC cue list bank number, from 1, as given when the bank was configured." }
    send: { address: "/eos/cuelist/{bank}/reset" }
    returns: none

  set_submaster:
    summary: "Set a submaster's level (0.0-1.0)"
    params:
      submaster: { type: int, min: 1, max: 999, required: true, label: Submaster, description: "Submaster number from 1 to 999." }
      level:     { type: float, min: 0.0, max: 1.0, required: true, label: Level, description: "Submaster level from 0.0 (out) to 1.0 (full)." }
    send: { address: "/eos/sub/{submaster}", args: [ { value: "{level}", type: float } ] }
    returns: none

  set_submaster_to:
    summary: "Set a submaster to Full, Out, Home, Min, Max, or the Level value from Setup"
    params:
      submaster: { type: int, min: 1, max: 999, required: true, label: Submaster, description: "Submaster number from 1 to 999." }
      action:    { type: enum, values: ["full", "out", "home", "min", "max", "level"], required: true, label: Action, description: "Full, Out, Home, Min or Max sets the submaster to that value; Level sets it to the Level value from Setup." }
    send: { address: "/eos/sub/{submaster}/{action}" }
    returns: none

  bump_submaster:
    summary: "Bump a submaster on and off (press and release its bump button)"
    params:
      submaster: { type: int, min: 1, max: 999, required: true, label: Submaster, description: "Submaster number from 1 to 999." }
    send:
      - { address: "/eos/sub/{submaster}/fire", args: [ { value: "1.0", type: float } ] }
      - { address: "/eos/sub/{submaster}/fire", args: [ { value: "0.0", type: float } ] }
    returns: none

  bump_submaster_down:
    summary: "Hold a submaster's bump down until bump_submaster_up"
    params:
      submaster: { type: int, min: 1, max: 999, required: true, label: Submaster, description: "Submaster number from 1 to 999." }
    send: { address: "/eos/sub/{submaster}/fire", args: [ { value: "1.0", type: float } ] }
    returns: none

  bump_submaster_up:
    summary: "Release a submaster's bump"
    params:
      submaster: { type: int, min: 1, max: 999, required: true, label: Submaster, description: "Submaster number from 1 to 999." }
    send: { address: "/eos/sub/{submaster}/fire", args: [ { value: "0.0", type: float } ] }
    returns: none

  select_submaster:
    summary: "Select a submaster"
    params:
      submaster: { type: int, min: 1, max: 999, required: true, label: Submaster, description: "Submaster number from 1 to 999." }
    send: { address: "/eos/sub", args: [ { value: "{submaster}", type: int } ] }
    returns: none

  fire_macro:
    summary: "Run a macro"
    params:
      macro: { type: int, min: 1, max: 99999, required: true, label: Macro, description: "Macro number from 1 to 99,999." }
    send: { address: "/eos/macro/fire", args: [ { value: "{macro}", type: int } ] }
    returns: none

  select_macro:
    summary: "Select a macro"
    params:
      macro: { type: int, min: 1, max: 99999, required: true, label: Macro, description: "Macro number from 1 to 99,999." }
    send: { address: "/eos/macro", args: [ { value: "{macro}", type: int } ] }
    returns: none

  select_channel:
    summary: "Select a channel"
    params:
      channel: { type: int, min: 1, max: 99999, required: true, label: Channel, description: "Channel number from 1 to 99,999, as in the show's patch." }
    send: { address: "/eos/chan", args: [ { value: "{channel}", type: int } ] }
    returns: none

  set_channel_intensity:
    summary: "Set a channel's intensity (0-100)"
    params:
      channel: { type: int, min: 1, max: 99999, required: true, label: Channel, description: "Channel number from 1 to 99,999, as in the show's patch." }
      level:   { type: float, min: 0.0, max: 100.0, required: true, label: Intensity, description: "Intensity in percent, from 0 (out) to 100 (full)." }
    send: { address: "/eos/chan/{channel}", args: [ { value: "{level}", type: float } ] }
    returns: none

  set_channel_dmx:
    summary: "Set a channel's intensity as a DMX output value (0-255)"
    params:
      channel: { type: int, min: 1, max: 99999, required: true, label: Channel, description: "Channel number from 1 to 99,999, as in the show's patch." }
      dmx:     { type: int, min: 0, max: 255, required: true, label: DMX value, description: "Intensity as a DMX output value, from 0 to 255." }
    send: { address: "/eos/chan/{channel}/dmx", args: [ { value: "{dmx}", type: int } ] }
    returns: none

  set_channel_to:
    summary: "Set a channel's intensity to Full, Out, Home, Min, Max, Level or by +% / -%"
    params:
      channel: { type: int, min: 1, max: 99999, required: true, label: Channel, description: "Channel number from 1 to 99,999, as in the show's patch." }
      action:  { type: enum, values: ["full", "out", "home", "min", "max", "level", "+%", "-%"], required: true, label: Action, description: "Full, Out, Home, Min, Max or Level sets the channel's intensity to that value; +% and -% raise or lower it by one step." }
    send: { address: "/eos/chan/{channel}/{action}" }
    returns: none

  channel_remainder_dim:
    summary: "Dim every channel except this one (RemDim)"
    params:
      channel: { type: int, min: 1, max: 99999, required: true, label: Channel, description: "Channel number from 1 to 99,999, as in the show's patch." }
    send: { address: "/eos/chan/{channel}/remdim" }
    returns: none

  set_channel_param:
    summary: "Set a channel's parameter(s) (param1/param2/...) to a level in the parameter's own units"
    params:
      channel: { type: int, min: 1, max: 99999, required: true, label: Channel, description: "Channel number from 1 to 99,999, as in the show's patch." }
      param:   { type: string, max_length: 128, pattern: "^[A-Za-z0-9_ \\\\]+(/[A-Za-z0-9_ \\\\]+)*$", required: true, label: Parameter, description: "Parameter name as Eos names it (e.g. pan, tilt, red), case-insensitive and abbreviable, with underscores or spaces for spaces and a backslash for a slash; give several as param1/param2." }
      level:   { type: float, required: true, label: Level, description: "Level in the parameter's own units (e.g. 270 for pan); Eos documents 0-100 but its examples use the parameter's units, so it is not limited." }
    send: { address: "/eos/chan/{channel}/param/{param}", args: [ { value: "{level}", type: float } ] }
    returns: none

  set_channel_param_dmx:
    summary: "Set a channel's parameter(s) as a DMX output value (0-255)"
    params:
      channel: { type: int, min: 1, max: 99999, required: true, label: Channel, description: "Channel number from 1 to 99,999, as in the show's patch." }
      param:   { type: string, max_length: 128, pattern: "^[A-Za-z0-9_ \\\\]+(/[A-Za-z0-9_ \\\\]+)*$", required: true, label: Parameter, description: "Parameter name as Eos names it (e.g. pan, tilt, red), case-insensitive and abbreviable, with underscores or spaces for spaces and a backslash for a slash; give several as param1/param2." }
      dmx:     { type: int, min: 0, max: 255, required: true, label: DMX value, description: "Output value from 0 to 255, as sent on DMX." }
    send: { address: "/eos/chan/{channel}/param/{param}/dmx", args: [ { value: "{dmx}", type: int } ] }
    returns: none

  set_channel_param_to:
    summary: "Set a channel's parameter(s) to Full, Out, Home, Min, Max, Level or by +% / -%"
    params:
      channel: { type: int, min: 1, max: 99999, required: true, label: Channel, description: "Channel number from 1 to 99,999, as in the show's patch." }
      param:   { type: string, max_length: 128, pattern: "^[A-Za-z0-9_ \\\\]+(/[A-Za-z0-9_ \\\\]+)*$", required: true, label: Parameter, description: "Parameter name as Eos names it (e.g. pan, tilt, red), case-insensitive and abbreviable, with underscores or spaces for spaces and a backslash for a slash; give several as param1/param2." }
      action:  { type: enum, values: ["full", "out", "home", "min", "max", "level", "+%", "-%"], required: true, label: Action, description: "Full, Out, Home, Min, Max or Level sets the parameter to that value; +% and -% raise or lower it by one step." }
    send: { address: "/eos/chan/{channel}/param/{param}/{action}" }
    returns: none

  set_channel_color_hs:
