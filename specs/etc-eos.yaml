    returns: value

  get_cue_count:
    summary: "Number of cues in a cue list, including parts"
    params:
      cue_list: { type: int, min: 1, max: 999, required: true, label: Cue list, description: "Cue list number from 1 to 999; Element 2 and Element Classic have one cue list, so use 1 there." }
    send: { address: "/eos/get/cue/{cue_list}/count" }
    expect: { address: "/eos/out/get/cue/{cue_list}/count", arg: 0 }
    returns: value

  get_cue_count_no_parts:
    summary: "Number of cues in a cue list, excluding parts"
    params:
      cue_list: { type: int, min: 1, max: 999, required: true, label: Cue list, description: "Cue list number from 1 to 999; Element 2 and Element Classic have one cue list, so use 1 there." }
    send: { address: "/eos/get/cue/{cue_list}/noparts/count" }
    expect: { address: "/eos/out/get/cue/{cue_list}/noparts/count", arg: 0 }
    returns: value

  get_cue_part_count:
    summary: "Number of parts of a cue"
    params:
      cue_list: { type: int, min: 1, max: 999, required: true, label: Cue list, description: "Cue list number from 1 to 999; Element 2 and Element Classic have one cue list, so use 1 there." }
      cue:      { type: string, max_length: 16, pattern: "^[0-9]+(\\.[0-9]+)?$", required: true, label: Cue, description: "Cue number as text, which may contain a point (1 or 1.5); kept as text so trailing zeros are not lost." }
    send: { address: "/eos/get/cue/{cue_list}/{cue}/count" }
    expect: { address: "/eos/out/get/cue/{cue_list}/{cue}/count", arg: 0 }
    returns: value

  get_event_count:
    summary: "Number of events in an event list"
    params:
      event_list: { type: int, min: 1, required: true, label: Event list, description: "Event list number as in the show, from 1." }
    send: { address: "/eos/get/event/{event_list}/count" }
    expect: { address: "/eos/out/get/event/{event_list}/count", arg: 0 }
    returns: value

  get_fpe_point_count:
    summary: "Number of points in a focus point (FPE) set"
    params:
      fpe_set: { type: int, min: 1, required: true, label: Focus point set, description: "Focus point (FPE) set number, from 1." }
    send: { address: "/eos/get/fpe/{fpe_set}/count" }
    expect: { address: "/eos/out/get/fpe/{fpe_set}/count", arg: 1 }
    returns: value

  get_target:
    summary: "Request a target's details; the replies (/eos/out/get/...) update state"
    params:
      target_type: { type: enum, values: ["bp", "cp", "fp", "ip", "preset", "cuelist", "curve", "fx", "group", "macro", "ms", "pixmap", "snap", "sub", "eventlist"], required: true, label: Target type, description: "Kind of target: bp, cp, fp, ip palettes, preset, cuelist, curve, fx effect, group, macro, ms magic sheet, pixmap pixel map, snap snapshot, sub submaster or eventlist." }
      number:      { type: int, min: 1, required: true, label: Number, description: "Number of the target as in the show; a target whose number has a decimal is not matched into state." }
    send: { address: "/eos/get/{target_type}/{number}" }
    returns: none

  get_target_by_index:
    summary: "Request the details of the target at a 0-based index in its list"
    params:
      target_type: { type: enum, values: ["bp", "cp", "fp", "ip", "preset", "cuelist", "curve", "fx", "group", "macro", "ms", "pixmap", "snap", "sub", "eventlist", "patch"], required: true, label: Target type, description: "Kind of target: bp, cp, fp, ip palettes, preset, cuelist, curve, fx effect, group, macro, ms magic sheet, pixmap pixel map, snap snapshot, sub submaster, eventlist or patch (patched channels)." }
      index:       { type: int, min: 0, required: true, label: Index, description: "Position of the target in its list, counted from 0." }
    send: { address: "/eos/get/{target_type}/index/{index}" }
    returns: none

  get_target_by_uid:
    summary: "Request a target's details by its UID"
    params:
      target_type: { type: enum, values: ["bp", "cp", "fp", "ip", "preset", "cuelist", "curve", "fx", "group", "macro", "ms", "pixmap", "snap", "sub", "eventlist", "patch"], required: true, label: Target type, description: "Kind of target: bp, cp, fp, ip palettes, preset, cuelist, curve, fx effect, group, macro, ms magic sheet, pixmap pixel map, snap snapshot, sub submaster, eventlist or patch (patched channels)." }
      uid:         { type: string, max_length: 36, pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$", required: true, label: UID, description: "Unique ID Eos reports for the target, in 8-4-4-4-12 hexadecimal form." }
    send: { address: "/eos/get/{target_type}/uid/{uid}" }
    returns: none

  get_group_displayed:
    summary: "Request a group's details with its channels as command line text"
    params:
      group: { type: int, min: 1, required: true, label: Group, description: "Group number as in the show, from 1; Eos refuses a group that does not exist." }
    send: { address: "/eos/get/group/displayed/{group}" }
    returns: none

  get_cue:
    summary: "Request a cue's details (the base cue and all its parts)"
    params:
      cue_list: { type: int, min: 1, max: 999, required: true, label: Cue list, description: "Cue list number from 1 to 999; Element 2 and Element Classic have one cue list, so use 1 there." }
      cue:      { type: string, max_length: 16, pattern: "^[0-9]+(\\.[0-9]+)?$", required: true, label: Cue, description: "Cue number as text, which may contain a point (1 or 1.5); kept as text so trailing zeros are not lost." }
    send: { address: "/eos/get/cue/{cue_list}/{cue}" }
    returns: none

  get_cue_part:
    summary: "Request one cue part's details"
    params:
      cue_list: { type: int, min: 1, max: 999, required: true, label: Cue list, description: "Cue list number from 1 to 999; Element 2 and Element Classic have one cue list, so use 1 there." }
      cue:      { type: string, max_length: 16, pattern: "^[0-9]+(\\.[0-9]+)?$", required: true, label: Cue, description: "Cue number as text, which may contain a point (1 or 1.5); kept as text so trailing zeros are not lost." }
      part:     { type: int, min: 1, required: true, label: Part, description: "Cue part number, from 1." }
    send: { address: "/eos/get/cue/{cue_list}/{cue}/{part}" }
    returns: none

  get_cue_by_index:
    summary: "Request the details of the cue at a 0-based index in a cue list"
    params:
      cue_list: { type: int, min: 1, max: 999, required: true, label: Cue list, description: "Cue list number from 1 to 999; Element 2 and Element Classic have one cue list, so use 1 there." }
      index:    { type: int, min: 0, required: true, label: Index, description: "Position of the cue in the cue list, counted from 0." }
    send: { address: "/eos/get/cue/{cue_list}/index/{index}" }
    returns: none

  get_cue_by_uid:
    summary: "Request a cue's details by its UID"
    params:
      uid: { type: string, max_length: 36, pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$", required: true, label: UID, description: "Unique ID Eos reports for the cue, in 8-4-4-4-12 hexadecimal form." }
    send: { address: "/eos/get/cue/uid/{uid}" }
    returns: none

  get_event:
    summary: "Request an event's details"
    params:
      event_list: { type: int, min: 1, required: true, label: Event list, description: "Event list number as in the show, from 1." }
      event:      { type: int, min: 1, required: true, label: Event, description: "Event number within the event list, from 1." }
    send: { address: "/eos/get/event/{event_list}/{event}" }
    returns: none

  get_event_by_index:
    summary: "Request the details of the event at a 0-based index in an event list"
    params:
      event_list: { type: int, min: 1, required: true, label: Event list, description: "Event list number as in the show, from 1." }
      index:      { type: int, min: 0, required: true, label: Index, description: "Position of the event in the event list, counted from 0." }
    send: { address: "/eos/get/event/{event_list}/index/{index}" }
    returns: none

  get_patch:
    summary: "Request a patched channel's details"
    params:
      channel: { type: int, min: 1, max: 99999, required: true, label: Channel, description: "Channel number from 1 to 99,999, as in the show's patch." }
    send: { address: "/eos/get/patch/{channel}" }
    returns: none

  get_patch_part:
    summary: "Request a patched channel part's details"
    params:
      channel: { type: int, min: 1, max: 99999, required: true, label: Channel, description: "Channel number from 1 to 99,999, as in the show's patch." }
      part:    { type: int, min: 1, required: true, label: Part, description: "Part number of the multi-part channel, from 1." }
    send: { address: "/eos/get/patch/{channel}/{part}" }
    returns: none

  get_params:
    summary: "Request a channel's parameters with current, minimum and maximum levels"
    params:
      channel: { type: int, min: 1, max: 99999, required: true, label: Channel, description: "Channel number from 1 to 99,999, as in the show's patch." }
    send: { address: "/eos/get/params/{channel}" }
    returns: none

  get_emitters:
    summary: "Request a channel's emitters with current, minimum and maximum levels"
    params:
      channel: { type: int, min: 1, max: 99999, required: true, label: Channel, description: "Channel number from 1 to 99,999, as in the show's patch." }
    send: { address: "/eos/get/emitters/{channel}" }
    returns: none

  get_fpe_set:
    summary: "Request a focus point (FPE) set's details"
    params:
      index: { type: int, min: 0, required: true, label: Index, description: "Position of the focus point (FPE) set in its list, counted from 0." }
    send: { address: "/eos/get/fpe/index/{index}" }
    returns: none

  get_fpe_point:
    summary: "Request one point of a focus point (FPE) set"
    params:
      fpe_set: { type: int, min: 1, required: true, label: Focus point set, description: "Focus point (FPE) set number, from 1." }
      point:   { type: int, min: 0, required: true, label: Point, description: "Point within the focus point set, numbered from 0 as Eos accepts it." }
    send: { address: "/eos/get/fpe/{fpe_set}/{point}" }
    returns: none

  get_setup:
    summary: "Request the default cue times from Setup"
    send: { address: "/eos/get/setup" }
    returns: none

  get_processors:
    summary: "Request the processors in the show file"
    send: { address: "/eos/get/processors" }
    returns: none

  get_session:
    summary: "Request multi-console session information"
    send: { address: "/eos/get/session" }
    returns: none

  get_user_list:
    summary: "Request every user in the show with console type and name"
    send: { address: "/eos/get/userlist" }
    returns: none

  get_augment3d_server:
    summary: "Request the Augment3d server addresses and UID"
    send: { address: "/eos/get/3dserver" }
    returns: none

  get_csv:
    summary: "Request the show's CSV export (sent as a blob)"
    send: { address: "/eos/get/csv" }
    returns: none

quirks:
  - models: [all]
    severity: critical
    text: >
      Key presses are a down/up pair: 1.0 then 0.0 on the same address. Sending
      only the down message leaves the key held, which on Go blocks subsequent
      presses until a release arrives. Commands that take a button edge default
      to the down edge when it is omitted (Eos OSC Conventions, Button Edge), so
      fire, stop, load and the level keywords act on the single message sent.

  - models: [all]
    severity: critical
    text: >
      All OSC to or from a multi-console session must go to the device acting as
      session Host (Eos OSC Conventions). Connect to the Primary or the Host; a
      Client, Backup that is not hosting, or Expansion Processor does not take OSC.

  - models: [all]
    severity: warning
    text: >
      Port 3032 accepts OSC only when {OSC RX} (and, for the implicit outputs and
      replies, {OSC TX}) are on in Setup > System > Show Control > OSC and the
      {UDP Strings & OSC} protocol is enabled on the network interface in the ECU.
      Ports 3037 (general third-party integration) and 3038 (detailed integration,
      including show control traffic) are always enabled. The TCP mode in the same
      Setup page defaults to OSC 1.0 (packet-length headers), which this spec uses;
      a console switched to OSC 1.1 (SLIP) will not understand it (Eos OSC Setup).

  - models: [all]
    severity: info
    text: >
      /eos/ping is answered on /eos/out/ping with the same arguments, so it serves
      as a liveness probe that confirms an Eos console specifically rather than just
      an open TCP port.

  - models: [all]
    severity: warning
    text: >
      Command line, selection, wheel, colour and fader bank commands act for this
      device's OSC user. By default that is the console's current user, so text sent
      with command lands on the operator's command line. set_osc_user_auto gives the
      device a user nobody else has; set_osc_user 0 uses the background user, whose
      commands appear on no command line. The OSC user persists until changed or
      until reset.

  - models: [all]
    severity: warning
    text: >
      Cue numbers are decimal and may contain a point (cue 1.5). The parameter
      is a string for that reason; treating it as a number loses trailing zeros
      and changes which cue fires.

  - models: [element-2, element-classic]
    severity: info
    text: >
      Element 2 and Element Classic have a single cue list (capacity "Cue Lists - 1"),
      so cue_list must be 1 on these models.

  - models: [all]
    severity: info
    text: >
      Only some ranges are documented: channels 1-99,999, cue lists 1-999, submasters
      1-999, macros 1-99,999, softkeys 1-12, OSC users -1 to 99, intensity 0-100,
      submaster and fader levels 0-1, DMX 0-255 and the colour ranges. Group, palette,
      preset, effect, snapshot, curve, magic sheet, pixel map, event list, address,
      bank and part numbers are documented only as integers, so only their minimum is
      checked; Eos refuses a number it does not have.

  - models: [all]
    severity: warning
    text: >
      The OSC Dictionary gives parameter levels (/eos/param, /eos/chan/<n>/param/<p>)
      as "Float, 0.0-100.0", but OSC Eos Control's examples set pan to 270 and 90,
      in the parameter's own units. set_param, set_channel_param and set_group_param
      therefore leave the level unbounded. Parameter names are case-insensitive, may be
      abbreviated, use underscores or spaces for spaces and a backslash for a slash
      (gobo_index\speed), and several are given as param1/param2.

  - models: [all]
    severity: info
    text: >
      Wheel and switch ticks are documented as "Int" but every example is a float
      (2.0, -1.0, 0.25 "increase value slowly"), so ticks are sent as floats. The wheel
      and switch mode and override levels are sent as the documented Int.

  - models: [all]
    severity: info
    text: >
      Fader banks, cue list banks and direct select banks exist only after a configure
      command; Eos then pushes their labels and levels (/eos/out/fader/...,
      /eos/out/cuelist/..., /eos/out/ds/...). Bank 0 of the fader banks is the master
      fader. OSC fader banks share the console's fader mapping but page by their own
      fader count.

  - models: [all]
    severity: warning
    text: >
      The fader level output is documented two ways: /eos/out/fader/<bank>/<fader>
      (OSC Eos Control, Fader Output) and /eos/fader/<bank>/<fader> (OSC Dictionary,
      OSC Outputs); both are read. The label output is documented on
      /eos/out/fader/<bank>/<fader>/name, though one example shows a label string on the
      level address; a string there is not taken as a level.

  - models: [all]
    severity: warning
    text: >
      /eos/out/active/chan is documented as one string ("1-2 [100]", OSC Eos Control and
      OSC Third-Party Integration) and as an int channel plus an info string (OSC
      Dictionary). Its first argument is kept as text in selection.active_channels and the
      second, when present, in selection.active_channel_info.

  - models: [all]
    severity: warning
    text: >
      Relay events (/eos/out/event/relay/<relay>/<group>) carry 0 = On, 1 = Off in OSC Show
      Control but 0 = off, 1 = on in the OSC Dictionary. The raw integer is reported in
      relays.*.*.state without interpretation.

  - models: [all]
    severity: info
    text: >
      OSC Get requests by list index and by UID are written /eos/get/<type>/index/<n> and
      /eos/get/<type>/uid/<uid> on the OSC Get page (and in ETCLabs' EosSyncLib) but
      /eos/get/<type>/index=<n> and /uid=<uid> in the OSC Dictionary. The path form is used.
      /eos/get/setup is said to return /eos/out/get/settings (Dictionary, input table) and
      /eos/out/get/setup/list/... (output table); the latter is read.

  - models: [all]
    severity: info
    text: >
      Detailed /eos/get replies use the OSC list convention
      (/eos/out/get/<type>/<n>/list/<index>/<count>) and can span packets. Only the packet
      starting at argument 0 is read, and only fixed fields: variable lists (group and
      palette channels, cue effects, links and actions, notify IDs, parameter lists) are
      not taken into state. Targets are keyed by number where the address carries an
      integer; cues are keyed by UID because cue numbers contain a point. A target whose
      number has a decimal is sent as a string by Eos and is not matched.

  - models: [all]
    severity: info
    text: >
      subscribe 1 makes Eos send /eos/out/notify/<type>/list/... whenever show data
      changes, with a rising sequence number and the changed target numbers; the client
      then asks for the targets with get_target. The sequence number is kept per type; the
      changed numbers are not. Subscribed parameters arrive on /eos/out/param/<name>.

  - models: [all]
    severity: warning
    text: >
      add_filter limits everything Eos sends this device, including the implicit outputs
      and get replies this spec reads: with a filter set, state not matching it stops
      updating. reset clears switches, the OSC user and wheel modes, and makes Eos resend
      every implicit output.

  - models: [all]
    severity: info
    text: >
      fire_show_control_event fires an event only on a show control list whose type is
      Network Inputs, and the input string must match exactly, including case.
      Setup > Show Control > OSC Cue Send/Receive String can change the cue OSC strings
      Eos sends and accepts (per cue list via Cue Triggers); this spec assumes the
      default /eos strings.

  - models: [all]
    severity: info
    text: >
      Macro text is read from /eos/out/get/macro/<n>/text/list/..., the sub-address used by
      ETCLabs' EosSyncLib; the OSC Dictionary prints the same /list address for the label
      and the text forms. The active cue's percent complete is updated about once a second
      while it fades (OSC Eos Control).

  - models: [all]
    severity: info
    text: >
      get_csv returns the show as a blob in /eos/out/get/csv (offset, size, data);
      get_processors, get_user_list, get_augment3d_server and get_session return variable
      argument lists (get_session's reply is not documented). Their replies are not read
      into state; the commands are for consumers reading the raw messages.

state:
  version.eos:                 { type: string, description: "Eos software version, major.minor.patch.build (/eos/out/get/version)" }
  version.fixture_library:     { type: string, description: "Fixture library version, major.minor.patch.build" }
  version.gel_swatch_mode:     { type: int, description: "Colour picker gel swatch mode: 0 Gel + S4 Lamp, 1 Gel Only (OSC Get Version)" }
  show.name:                   { type: string, description: "Show name (/eos/out/show/name)" }
  show.path:                   { type: string, description: "Show file path (/eos/out/get/show/path)" }
  show.last_file_event:        { type: string, description: "Last show file event: saved, loaded or cleared" }
  show.last_file:              { type: string, description: "File path carried by the last show file event" }
  osc_user:                    { type: int, description: "This device's OSC user ID (/eos/out/user)" }
  command_line.text:           { type: string, description: "This OSC user's command line (/eos/out/cmd); a trailing # marks it closed" }
  command_line.error:          { type: bool, description: "True when the command line shows an error" }
  users.*.command_line:        { type: string, description: "Command line of an Eos user, by user ID (/eos/out/user/<id>/cmd)" }
  users.*.command_line_error:  { type: bool, description: "True when that user's command line shows an error" }
  softkeys.*.label:            { type: string, description: "Softkey label, softkeys 1-12" }
  console.live:                { type: bool, description: "True in Live, false in Blind (/eos/out/event/state)" }
  console.locked:              { type: bool, description: "True while the console is locked" }
  osc_wheel.value:             { type: float, description: "Raw /eos/out/wheel value (documented as the wheel mode 0 coarse / 1 fine, and as the wheel's movement)" }
  osc_switch.value:            { type: float, description: "Raw /eos/out/switch value (the switch mode or movement)" }
  active_cue.list:             { type: int, description: "Cue list of the active cue" }
  active_cue.number:           { type: string, description: "Number of the active cue (may contain a point)" }
  active_cue.percent:          { type: float, description: "Fade progress of the active cue, 0.0 started to 1.0 complete" }
  active_cue.text:             { type: string, description: "Active cue as \"list/cue label duration\" text" }
  pending_cue.list:            { type: int, description: "Cue list of the pending cue" }
  pending_cue.number:          { type: string, description: "Number of the pending cue" }
  pending_cue.part:            { type: int, description: "Part of the pending cue; 0 for the base cue" }
  pending_cue.text:            { type: string, description: "Pending cue as \"list/cue label duration\" text" }
  previous_cue.list:           { type: int, description: "Cue list of the previous cue" }
  previous_cue.number:         { type: string, description: "Number of the previous cue" }
  previous_cue.part:           { type: int, description: "Part of the previous cue; 0 for the base cue" }
  previous_cue.text:           { type: string, description: "Previous cue as \"list/cue label duration\" text" }
  last_cue_event.list:         { type: int, description: "Cue list of the last cue fired, stopped or resumed (/eos/out/event/cue/...)" }
  last_cue_event.number:       { type: string, description: "Cue number of the last cue event" }
  last_cue_event.action:       { type: string, description: "fire, stop or resume" }
  last_cue_event.label:        { type: string, description: "Label of the cue of the last cue event" }
  last_macro_event.macro:      { type: int, description: "Macro last fired from a show control event" }
  submasters.*.bump:           { type: bool, description: "Submaster bump state from show control events (/eos/out/event/sub/<n>)" }
  relays.*.*.state:            { type: int, description: "Raw relay event value by relay and group (see quirks: 0/1 sense is documented both ways)" }
  selection.active_channels:   { type: string, description: "Active (selected) channels and the first channel's level (/eos/out/active/chan)" }
  selection.active_channel_info: { type: string, description: "Second argument of /eos/out/active/chan where sent: \"[level] fixture type description\"" }
  selection.osc_user_channels: { type: string, description: "Channels selected by the OSC user (/eos/out/get/chans)" }
  selection.hue:               { type: float, description: "Hue of the current selection" }
  selection.saturation:        { type: float, description: "Saturation of the current selection" }
  selection.pan_min:           { type: float, description: "Minimum pan of the selected channel, degrees" }
  selection.pan_max:           { type: float, description: "Maximum pan of the selected channel, degrees" }
  selection.tilt_min:          { type: float, description: "Minimum tilt of the selected channel, degrees" }
  selection.tilt_max:          { type: float, description: "Maximum tilt of the selected channel, degrees" }
  selection.pan:               { type: float, description: "Pan of the selected channel, degrees" }
  selection.tilt:              { type: float, description: "Tilt of the selected channel, degrees" }
  selection.x:                 { type: float, description: "Augment3d X focus of the selection, metres" }
  selection.y:                 { type: float, description: "Augment3d Y focus of the selection, metres" }
  selection.z:                 { type: float, description: "Augment3d Z focus of the selection, metres" }
  wheels.*.label:              { type: string, description: "Active wheel parameter name and level, \"Intens [0]\", by 1-based wheel index" }
  wheels.*.category:           { type: int, description: "Parameter category: 0 unassigned, 1 intensity, 2 focus, 3 color, 4 image, 5 form, 6 shutter" }
  wheels.*.value:              { type: float, description: "Active wheel parameter level" }
  params.*.value:              { type: float, description: "Subscribed parameter's level, by parameter name (/eos/out/param/<name>)" }
  params.*.min:                { type: float, description: "Subscribed parameter's minimum" }
