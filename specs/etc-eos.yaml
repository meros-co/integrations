spec: 1
id: etc-eos
name: ETC Eos family
vendor: Electronic Theatre Controls
category: lighting

source:
  - title: Eos Family v3.3.10 User Manual (online help), Show Control > Open Sound Control (OSC)
    author: Electronic Theatre Controls
    url: https://www.etcconnect.com/WebDocs/Controls/EosFamilyOnlineHelp/en/Content/22_Show_Control/08_OSC/OPEN_SOUND_CONTROL.htm
    note: >
      Manufacturer-documented; Eos Family v3.3.10 User Manual Rev A (09-2026), online help built
      2026-09-21, retrieved 2026-09-30. Every address below is from these pages: OSC Dictionary
      (22_Show_Control/08_OSC/OSC_Dictionary.htm: OSC Inputs, OSC Outputs, OSC Eos Keys);
      Using OSC with Eos (OSC Ping); Eos OSC Setup (TCP ports 3032/3036/3037/3038, OSC 1.0
      packet-length and OSC 1.1 SLIP TCP modes); OSC Networks; OSC Data; OSC Message Structure;
      Eos OSC Conventions (button edge, OSC user, names, numbers); OSC Eos Control (levels,
      colour, pan/tilt, switch, wheel, XYZ, command line, keys, softkeys, targets, cue list,
      fader and direct select banks, active cue, live/blind, reset); OSC Show Control (cue
      send/receive strings, show control events, OSC Subscribe); OSC Third-Party Integration
      (UIDs, OSC list convention, active wheels, DMX, filters, overrides, show file events,
      OSC Set); OSC Get (synchronisation, subscribe/notify, per-target get methods).
  - title: Eos Family v3.3.10 User Manual (online help), Eos Family Product Overview and Setup
    author: Electronic Theatre Controls
    url: https://www.etcconnect.com/WebDocs/Controls/EosFamilyOnlineHelp/en/Content/02_Eos_Family_Product_Overview_and_Setup/EOS_FAMILY_PRODUCT_OVERVIEW_AND_SETUP.htm
    note: >
      Manufacturer-documented; retrieved 2026-09-30. The product pages under Consoles,
      Rackmount Processors and Other Eos Family Products give each model's capacities
      (channels 1-99,999, cue lists 999 (Element 2 and Element Classic: 1), submasters 999,
      macros 99,999) and its supported device roles.
  - title: EosSyncLib (ETCLabs), "Eos Integration via OSC" and EosSyncLib.cpp
    author: ETCLabs (ETC employees and users; MIT licence; "not official ETC software")
    url: https://github.com/ETCLabs/EosSyncLib
    note: >
      Read for corroboration only (top-level LICENSE is MIT). Confirms the /index/<n> path form
      of OSC Get requests, the /eos/out/get/macro/<n>/text/list/... sub-address for macro text,
      and 3032 as the default TCP port with 4-byte length-prefix framing.

# Eos listens for OSC over TCP on 3032 (enabled in Setup > System > Show Control > OSC,
# "general external communication"); 3037 and 3038 are always enabled for third-party
# integration. The TCP mode defaults to OSC 1.0, where each packet is preceded by its
# 32-bit length; OSC 1.1 (SLIP) is the alternative (Eos OSC Setup). Eos answers on the same
# connection: replies to /eos/get/... arrive on /eos/out/get/..., and the implicit outputs
# (/eos/out/...) are pushed whenever OSC TX is enabled.
transport:
  type: osc-tcp
  port: 3032
  framing: length-prefixed
  timeout_ms: 2000
  probe: /eos/ping

ports:
  - { port: 3032, protocol: tcp, role: control }

