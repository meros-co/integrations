      hue:        { type: float, min: 0.0, max: 360.0, required: true, label: Hue, description: "Hue in degrees around the colour wheel, from 0 to 360." }
      saturation: { type: float, min: 0.0, max: 100.0, required: true, label: Saturation, description: "Saturation in percent, from 0 (white) to 100 (fully saturated)." }
