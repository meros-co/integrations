spec: 1
id: aws-elemental-medialive
name: AWS Elemental MediaLive (API)
vendor: AWS Elemental
category: other

# AWS Elemental MediaLive, the cloud live encoding service: its REST API at
# medialive.<region>.amazonaws.com, every request signed with AWS Signature
# Version 4. Every operation of the API is a command (channels, inputs,
# input security groups, schedules and their actions, multiplexes and
# programs, Link input devices, reservations and offerings, tags, the
# workflow monitor, MediaLive Anywhere clusters, nodes, networks and SDI
# sources); request bodies are the API's JSON as it documents them. State
# follows the channels, inputs, multiplexes, input devices and input
# security groups, polled.

source:
  - title: AWS Elemental MediaLive API Reference
    author: Amazon Web Services
    url: https://docs.aws.amazon.com/medialive/latest/apireference/what-is.html
    note: >
      Manufacturer document, read 2026-10-28: the REST resources under /prod
      (channels, channel class, schedule, start and stop, thumbnails, alerts;
      inputs and partners; input security groups; multiplexes and programs;
      input devices and their transfers, claim, reboot, start, stop and
      maintenance window; offerings, purchase and reservations; tags; batch
      delete, start and stop; account configuration; the workflow monitor's
      CloudWatch alarm templates, EventBridge rule templates, their groups
      and signal maps with monitor deployments; MediaLive Anywhere clusters,
      nodes, networks, channel placement groups and SDI sources; versions),
      their methods, path and query parameters, JSON request and response
      members, and success statuses.
  - title: AWS MediaLive service model (medialive 2017-10-14)
    author: Amazon Web Services (botocore, Apache License 2.0)
    url: https://github.com/boto/botocore/blob/develop/botocore/data/medialive/2017-10-14/service-2.json
    note: >
      AWS's machine-readable definition of the same API (LICENSE checked:
      Apache 2.0), read 2026-10-28 to list every operation exactly: its
      method, request URI, query parameters (maxResults bounds, nextToken),
      body members and their required ones, and its success status. The
      signing name is medialive, the protocol rest-json, the signature
      version 4.
  - title: AWS Signature Version 4 for API requests
    author: Amazon Web Services
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv-create-signed-request.html
    note: >
      Read 2026-10-28: the canonical request, the string to sign, the
      signing key from the secret, date, region and service, the
      Authorization header, X-Amz-Date and X-Amz-Security-Token for temporary
      credentials.
  - title: MediaLive service endpoints
    author: Amazon Web Services
    url: https://docs.aws.amazon.com/general/latest/gr/medialive.html
    note: >
      Read 2026-10-28: the API's host for each region,
      medialive.<region>.amazonaws.com, over HTTPS.

transport:
  type: http
  port: 443
  scheme: https
  auth: aws-sigv4
  aws: { service: medialive, region: { setting: region } }
  timeout_ms: 15000
  # AWS answers a credential it does not take with HTTP 403 and a message
  # naming the token or the signature; other 403s (a permission the key
  # lacks for one operation) fail only their command.
  refusal_status: [403]
  refusal_status_body:
    match: "(?i)(security token included in the request is (invalid|expired)|signature we calculated does not match|signature expired|request signature|unrecognizedclient|invalidsignature|expiredtoken)"
  probe: { method: GET, path: /prod/channels, query: { maxResults: "1" } }

settings:
  region:
    type: string
    required: true
    max_length: 32
    pattern: "^[a-z]{2}(-[a-z]+)+-[0-9]+$"
    label: Region
    description: "The AWS Region the device was opened for, such as us-west-2: requests are signed for it, and the host is medialive.<region>.amazonaws.com."
  access_key_id:
    type: string
    required: true
    max_length: 128
    label: Access key ID
    description: "The AWS access key ID of an IAM user or role allowed to use MediaLive."
  secret_access_key:
    type: string
    secret: true
    required: true
    max_length: 128
    label: Secret access key
    description: "That key's secret; it signs each request and is never sent."
  session_token:
    type: string
    secret: true
    default: ""
    max_length: 4096
    label: Session token
    description: "The session token of temporary credentials (from AWS STS), sent as X-Amz-Security-Token; empty for long-term keys."

ports:
  - { port: 443, protocol: https, role: control, note: "medialive.<region>.amazonaws.com: open the device with that host name" }

