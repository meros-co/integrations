quirks:
  - models: [all]
    severity: warning
    text: >
      Open the device with the API's host name for its region
      (medialive.us-west-2.amazonaws.com and so on) on port 443, and set the
      region setting to the same region: each request is signed for it with
      AWS Signature Version 4, from the access key ID and secret access key
      (and the session token of temporary credentials). The signature holds
      the host's clock, which AWS refuses when it is more than 5 minutes
      off: keep the host on NTP. A refused credential (HTTP 403 naming the
      token or the signature) stops the device until its settings change;
      a 403 for a permission the key lacks fails that command only.
  - models: [all]
    severity: critical
    text: >
      These act at once and none asks for confirmation. stop_channel,
      batch_stop, stop_multiplex, restart_channel_pipelines and
      stop_input_device interrupt what is on air; batch_update_schedule's
      actions (input switches, SCTE-35 splices, static and motion graphics,
      pauses) take effect at their times; the delete_* commands,
      batch_delete and delete_schedule cannot be undone; purchase_offering
      buys a reservation that is billed for its whole term and cannot be
      cancelled; transfer_input_device and claim_device change which account
      owns a Link device; update_channel_class changes the channel's
      pipelines. Running channels and multiplexes are billed by the hour.
  - models: [all]
    severity: info
    text: >
      Bodies are the API's own JSON (the request members the API reference
      gives for each operation, named as it names them), passed whole in the
      body parameter; answers are the API's JSON, returned whole. List
      operations return one page: list_* asks for the most the operation
      allows (max_results), and list_*_page the page after a nextToken an
      answer gave. The optional filters of list_offerings,
      list_reservations, the workflow monitor's lists and the alert lists'
      state are the API's too; only the alert state filter is offered here,
      the others' results being filtered by the consumer. delete_tags
      removes one tag key per call. describe_input_device_thumbnail answers
      a JPEG image, which a command's result (JSON) cannot carry, so it is
      not offered; describe_thumbnails gives a channel's thumbnails as
      base64 in JSON.
  - models: [all]
    severity: info
    text: >
      State is polled: the channels every 10 seconds (one page of up to
      1,000), and the inputs, multiplexes, Link input devices and input
      security groups every 60 seconds; a channel or input deleted is gone at
      the next read. A command's answer that describes a channel, input,
      multiplex, input device or security group (describe, create, update,
      start, stop, delete) updates its state at once. A schedule, a
      multiplex's programs, alerts, reservations and the workflow monitor
      are read by their commands. AWS meters API calls per account and
      throttles bursts (HTTP 429), which fail the command or poll they
      answer.

state:
  channels.*.name: { type: string, description: "The channel's name, by its ID" }
  channels.*.state: { type: string, description: "CREATING, CREATE_FAILED, IDLE, STARTING, RUNNING, RECOVERING, STOPPING, DELETING, DELETED, UPDATING or UPDATE_FAILED, by its ID" }
  channels.*.arn: { type: string, description: "The channel's ARN, by its ID" }
  channels.*.channel_class: { type: string, description: "STANDARD (two pipelines) or SINGLE_PIPELINE, by its ID" }
  channels.*.pipelines_running: { type: int, description: "How many of the channel's pipelines run, by its ID" }
  channels.*.log_level: { type: string, description: "The CloudWatch log level: ERROR, WARNING, INFO, DEBUG or DISABLED, by its ID" }
  channels.*.engine_version: { type: string, description: "The channel engine version it runs, when it names one, by its ID" }
  channels.*.input_attachments: { type: string, description: "The inputs attached, as JSON text of the API's inputAttachments, by its ID" }
  channels.*.destinations: { type: string, description: "The output destinations, as JSON text of the API's destinations, by its ID" }
  inputs.*.name: { type: string, description: "The input's name, by its ID" }
  inputs.*.state: { type: string, description: "CREATING, DETACHED, ATTACHED, DELETING or DELETED, by its ID" }
  inputs.*.arn: { type: string, description: "The input's ARN, by its ID" }
  inputs.*.type: { type: string, description: "The input type, such as RTMP_PUSH, RTP_PUSH, URL_PULL, MP4_FILE, MEDIACONNECT, INPUT_DEVICE, SRT_CALLER, by its ID" }
  inputs.*.input_class: { type: string, description: "STANDARD or SINGLE_PIPELINE, by its ID" }
  inputs.*.source_type: { type: string, description: "STATIC or DYNAMIC, by its ID" }
  inputs.*.attached_channels: { type: string, description: "The IDs of the channels it is attached to, as JSON text, by its ID" }
  inputs.*.destinations: { type: string, description: "Its push endpoints, as JSON text of the API's destinations, by its ID" }
  inputs.*.sources: { type: string, description: "Its pull sources, as JSON text of the API's sources, by its ID" }
  inputs.*.security_groups: { type: string, description: "The IDs of its input security groups, as JSON text, by its ID" }
  multiplexes.*.name: { type: string, description: "The multiplex's name, by its ID" }
  multiplexes.*.state: { type: string, description: "CREATING, CREATE_FAILED, IDLE, STARTING, RUNNING, RECOVERING, STOPPING, DELETING or DELETED, by its ID" }
  multiplexes.*.arn: { type: string, description: "The multiplex's ARN, by its ID" }
  multiplexes.*.pipelines_running: { type: int, description: "How many of its pipelines run, by its ID" }
  multiplexes.*.program_count: { type: int, description: "How many programs it carries, by its ID" }
  multiplexes.*.availability_zones: { type: string, description: "Its two Availability Zones, as JSON text, by its ID" }
  input_devices.*.name: { type: string, description: "The Link device's name, by its ID" }
  input_devices.*.connection_state: { type: string, description: "DISCONNECTED or CONNECTED, by its ID" }
  input_devices.*.type: { type: string, description: "HD, UHD or the type the API reports, by its ID" }
  input_devices.*.arn: { type: string, description: "The device's ARN, by its ID" }
  input_devices.*.device_update_status: { type: string, description: "UP_TO_DATE, NOT_UP_TO_DATE or UPDATING, by its ID" }
  input_devices.*.settings_sync_state: { type: string, description: "SYNCED or SYNCING, by its ID" }
  input_devices.*.serial_number: { type: string, description: "The device's serial number, by its ID" }
  input_devices.*.mac_address: { type: string, description: "The device's MAC address, by its ID" }
  input_devices.*.availability_zone: { type: string, description: "The Availability Zone it is set to, by its ID" }
  input_devices.*.output_type: { type: string, description: "What it feeds: NONE, MEDIALIVE_INPUT or MEDIACONNECT_FLOW, by its ID" }
  input_security_groups.*.state: { type: string, description: "IDLE, IN_USE, UPDATING or DELETED, by its ID" }
  input_security_groups.*.arn: { type: string, description: "The group's ARN, by its ID" }
  input_security_groups.*.whitelist_rules: { type: string, description: "Its allowed CIDR blocks, as JSON text of the API's whitelistRules, by its ID" }
  input_security_groups.*.inputs: { type: string, description: "The IDs of the inputs using it, as JSON text, by its ID" }
  account.kms_key_id: { type: string, description: "The KMS key the account encrypts its channels' secrets with, empty for the default" }

