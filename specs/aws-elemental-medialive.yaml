commands:
  accept_input_device_transfer:
    summary: "Accept input device transfer (POST /prod/inputDevices/{inputDeviceId}/accept, AcceptInputDeviceTransfer)"
    params:
      input_device_id: {"type": "string", "required": true, "max_length": 256, "label": "Input device ID", "description": "The Link device's ID, as input_devices.<id> in state lists it."}
    send: {"method": "POST", "path": "/prod/inputDevices/{input_device_id}/accept"}
    expect: { status: 200 }
    returns: ack
  batch_delete:
    summary: "Batch delete (POST /prod/batch/delete, BatchDelete)"
    params:
      body: {"type": "json", "required": true, "label": "Request body", "description": "The BatchDelete request's JSON object as the API reference gives it, with any of channelIds, inputIds, inputSecurityGroupIds, multiplexIds."}
    send: {"method": "POST", "path": "/prod/batch/delete", "body": "{body}", "content_type": "application/json"}
    expect: { status: 200, json_path: "$" }
    returns: value
  batch_start:
    summary: "Batch start (POST /prod/batch/start, BatchStart)"
    params:
      body: {"type": "json", "required": true, "label": "Request body", "description": "The BatchStart request's JSON object as the API reference gives it, with any of channelIds, multiplexIds."}
    send: {"method": "POST", "path": "/prod/batch/start", "body": "{body}", "content_type": "application/json"}
    expect: { status: 200, json_path: "$" }
    returns: value
  batch_stop:
    summary: "Batch stop (POST /prod/batch/stop, BatchStop)"
    params:
      body: {"type": "json", "required": true, "label": "Request body", "description": "The BatchStop request's JSON object as the API reference gives it, with any of channelIds, multiplexIds."}
    send: {"method": "POST", "path": "/prod/batch/stop", "body": "{body}", "content_type": "application/json"}
    expect: { status: 200, json_path: "$" }
    returns: value
  batch_update_schedule:
    summary: "Batch update schedule (PUT /prod/channels/{channelId}/schedule, BatchUpdateSchedule)"
    params:
      channel_id: {"type": "string", "required": true, "max_length": 256, "label": "Channel ID", "description": "The channel's ID, as channels.<id> in state lists it."}
      body: {"type": "json", "required": true, "label": "Request body", "description": "The BatchUpdateSchedule request's JSON object as the API reference gives it, with any of creates, deletes."}
    send: {"method": "PUT", "path": "/prod/channels/{channel_id}/schedule", "body": "{body}", "content_type": "application/json"}
    expect: { status: 200, json_path: "$" }
    returns: value
  cancel_input_device_transfer:
    summary: "Cancel input device transfer (POST /prod/inputDevices/{inputDeviceId}/cancel, CancelInputDeviceTransfer)"
    params:
      input_device_id: {"type": "string", "required": true, "max_length": 256, "label": "Input device ID", "description": "The Link device's ID, as input_devices.<id> in state lists it."}
    send: {"method": "POST", "path": "/prod/inputDevices/{input_device_id}/cancel"}
    expect: { status: 200 }
    returns: ack
  claim_device:
    summary: "Claim device (POST /prod/claimDevice, ClaimDevice)"
    params:
      body: {"type": "json", "required": true, "label": "Request body", "description": "The ClaimDevice request's JSON object as the API reference gives it, with any of id."}
    send: {"method": "POST", "path": "/prod/claimDevice", "body": "{body}", "content_type": "application/json"}
    expect: { status: 200 }
    returns: ack
  create_channel:
    summary: "Create channel (POST /prod/channels, CreateChannel)"
    params:
      body: {"type": "json", "required": true, "label": "Request body", "description": "The CreateChannel request's JSON object as the API reference gives it, with any of cdiInputSpecification, channelClass, destinations, encoderSettings, inputAttachments, inputSpecification, logLevel, maintenance, name, requestId, reserved, roleArn, tags, vpc, anywhereSettings, channelEngineVersion, dryRun, linkedChannelSettings, channelSecurityGroups, inferenceSettings."}
    send: {"method": "POST", "path": "/prod/channels", "body": "{body}", "content_type": "application/json"}
    expect: { status: 201, json_path: "$" }
    returns: value
  create_input:
    summary: "Create input (POST /prod/inputs, CreateInput)"
    params:
      body: {"type": "json", "required": true, "label": "Request body", "description": "The CreateInput request's JSON object as the API reference gives it, with any of destinations, inputDevices, inputSecurityGroups, mediaConnectFlows, name, requestId, roleArn, sources, tags, type, vpc, srtSettings, inputNetworkLocation, multicastSettings, smpte2110ReceiverGroupSettings, sdiSources, routerSettings."}
    send: {"method": "POST", "path": "/prod/inputs", "body": "{body}", "content_type": "application/json"}
    expect: { status: 201, json_path: "$" }
    returns: value
  create_input_security_group:
    summary: "Create input security group (POST /prod/inputSecurityGroups, CreateInputSecurityGroup)"
    params:
      body: {"type": "json", "required": true, "label": "Request body", "description": "The CreateInputSecurityGroup request's JSON object as the API reference gives it, with any of tags, whitelistRules."}
    send: {"method": "POST", "path": "/prod/inputSecurityGroups", "body": "{body}", "content_type": "application/json"}
    expect: { status: 200, json_path: "$" }
    returns: value
  create_multiplex:
    summary: "Create multiplex (POST /prod/multiplexes, CreateMultiplex)"
    params:
      body: {"type": "json", "required": true, "label": "Request body", "description": "The CreateMultiplex request's JSON object as the API reference gives it, with any of availabilityZones, multiplexSettings, name, requestId, tags (availabilityZones, multiplexSettings, name, requestId required)."}
    send: {"method": "POST", "path": "/prod/multiplexes", "body": "{body}", "content_type": "application/json"}
    expect: { status: 201, json_path: "$" }
    returns: value
  create_multiplex_program:
    summary: "Create multiplex program (POST /prod/multiplexes/{multiplexId}/programs, CreateMultiplexProgram)"
    params:
      multiplex_id: {"type": "string", "required": true, "max_length": 256, "label": "Multiplex ID", "description": "The multiplex's ID, as multiplexes.<id> in state lists it."}
      body: {"type": "json", "required": true, "label": "Request body", "description": "The CreateMultiplexProgram request's JSON object as the API reference gives it, with any of multiplexProgramSettings, programName, requestId (multiplexProgramSettings, programName, requestId required)."}
    send: {"method": "POST", "path": "/prod/multiplexes/{multiplex_id}/programs", "body": "{body}", "content_type": "application/json"}
    expect: { status: 201, json_path: "$" }
    returns: value
  create_partner_input:
    summary: "Create partner input (POST /prod/inputs/{inputId}/partners, CreatePartnerInput)"
    params:
      input_id: {"type": "string", "required": true, "max_length": 256, "label": "Input ID", "description": "The input's ID, as inputs.<id> in state lists it."}
      body: {"type": "json", "required": true, "label": "Request body", "description": "The CreatePartnerInput request's JSON object as the API reference gives it, with any of requestId, tags."}
    send: {"method": "POST", "path": "/prod/inputs/{input_id}/partners", "body": "{body}", "content_type": "application/json"}
    expect: { status: 201, json_path: "$" }
    returns: value
  create_tags:
    summary: "Create tags (POST /prod/tags/{resource-arn}, CreateTags)"
    params:
      resource_arn: {"type": "string", "required": true, "max_length": 2048, "label": "Resource ARN", "description": "The ARN of the channel, input, multiplex or other resource whose tags are meant."}
      body: {"type": "json", "required": true, "label": "Request body", "description": "The CreateTags request's JSON object as the API reference gives it, with any of tags."}
    send: {"method": "POST", "path": "/prod/tags/{resource_arn}", "body": "{body}", "content_type": "application/json"}
    expect: { status: 204 }
    returns: ack
  delete_channel:
    summary: "Delete channel (DELETE /prod/channels/{channelId}, DeleteChannel)"
    params:
      channel_id: {"type": "string", "required": true, "max_length": 256, "label": "Channel ID", "description": "The channel's ID, as channels.<id> in state lists it."}
    send: {"method": "DELETE", "path": "/prod/channels/{channel_id}"}
    expect: { status: 200, json_path: "$" }
    returns: value
  delete_input:
    summary: "Delete input (DELETE /prod/inputs/{inputId}, DeleteInput)"
    params:
      input_id: {"type": "string", "required": true, "max_length": 256, "label": "Input ID", "description": "The input's ID, as inputs.<id> in state lists it."}
    send: {"method": "DELETE", "path": "/prod/inputs/{input_id}"}
    expect: { status: 200 }
    returns: ack
  delete_input_security_group:
    summary: "Delete input security group (DELETE /prod/inputSecurityGroups/{inputSecurityGroupId}, DeleteInputSecurityGroup)"
    params:
      input_security_group_id: {"type": "string", "required": true, "max_length": 256, "label": "Input security group ID", "description": "The input security group's ID, as input_security_groups.<id> in state lists it."}
    send: {"method": "DELETE", "path": "/prod/inputSecurityGroups/{input_security_group_id}"}
    expect: { status: 200 }
    returns: ack
  delete_multiplex:
    summary: "Delete multiplex (DELETE /prod/multiplexes/{multiplexId}, DeleteMultiplex)"
    params:
      multiplex_id: {"type": "string", "required": true, "max_length": 256, "label": "Multiplex ID", "description": "The multiplex's ID, as multiplexes.<id> in state lists it."}
    send: {"method": "DELETE", "path": "/prod/multiplexes/{multiplex_id}"}
    expect: { status: 202, json_path: "$" }
    returns: value
  delete_multiplex_program:
    summary: "Delete multiplex program (DELETE /prod/multiplexes/{multiplexId}/programs/{programName}, DeleteMultiplexProgram)"
    params:
      multiplex_id: {"type": "string", "required": true, "max_length": 256, "label": "Multiplex ID", "description": "The multiplex's ID, as multiplexes.<id> in state lists it."}
      program_name: {"type": "string", "required": true, "max_length": 256, "label": "Program name", "description": "The multiplex program's name."}
    send: {"method": "DELETE", "path": "/prod/multiplexes/{multiplex_id}/programs/{program_name}"}
    expect: { status: 200, json_path: "$" }
    returns: value
  delete_reservation:
    summary: "Delete reservation (DELETE /prod/reservations/{reservationId}, DeleteReservation)"
    params:
      reservation_id: {"type": "string", "required": true, "max_length": 256, "label": "Reservation ID", "description": "The reservation's ID, from list_reservations."}
    send: {"method": "DELETE", "path": "/prod/reservations/{reservation_id}"}
    expect: { status: 200, json_path: "$" }
    returns: value
  delete_schedule:
    summary: "Delete schedule (DELETE /prod/channels/{channelId}/schedule, DeleteSchedule)"
    params:
      channel_id: {"type": "string", "required": true, "max_length": 256, "label": "Channel ID", "description": "The channel's ID, as channels.<id> in state lists it."}
    send: {"method": "DELETE", "path": "/prod/channels/{channel_id}/schedule"}
    expect: { status: 200 }
    returns: ack
  delete_tags:
    summary: "Delete tags (DELETE /prod/tags/{resource-arn}, DeleteTags)"
    params:
      resource_arn: {"type": "string", "required": true, "max_length": 2048, "label": "Resource ARN", "description": "The ARN of the channel, input, multiplex or other resource whose tags are meant."}
      tag_key: {"type": "string", "required": true, "max_length": 128, "label": "Tag key", "description": "The key of the tag to remove."}
    send: {"method": "DELETE", "path": "/prod/tags/{resource_arn}", "query": {"tagKeys": "{tag_key}"}}
    expect: { status: 204 }
    returns: ack
  describe_account_configuration:
    summary: "Describe account configuration (GET /prod/accountConfiguration, DescribeAccountConfiguration)"
    send: {"method": "GET", "path": "/prod/accountConfiguration"}
    expect: { status: 200, json_path: "$" }
    returns: value
  describe_channel:
    summary: "Describe channel (GET /prod/channels/{channelId}, DescribeChannel)"
    params:
      channel_id: {"type": "string", "required": true, "max_length": 256, "label": "Channel ID", "description": "The channel's ID, as channels.<id> in state lists it."}
    send: {"method": "GET", "path": "/prod/channels/{channel_id}"}
    expect: { status: 200, json_path: "$" }
    returns: value
  describe_input:
    summary: "Describe input (GET /prod/inputs/{inputId}, DescribeInput)"
    params:
      input_id: {"type": "string", "required": true, "max_length": 256, "label": "Input ID", "description": "The input's ID, as inputs.<id> in state lists it."}
    send: {"method": "GET", "path": "/prod/inputs/{input_id}"}
    expect: { status: 200, json_path: "$" }
    returns: value
  describe_input_device:
    summary: "Describe input device (GET /prod/inputDevices/{inputDeviceId}, DescribeInputDevice)"
    params:
      input_device_id: {"type": "string", "required": true, "max_length": 256, "label": "Input device ID", "description": "The Link device's ID, as input_devices.<id> in state lists it."}
    send: {"method": "GET", "path": "/prod/inputDevices/{input_device_id}"}
    expect: { status: 200, json_path: "$" }
    returns: value
  describe_input_security_group:
    summary: "Describe input security group (GET /prod/inputSecurityGroups/{inputSecurityGroupId}, DescribeInputSecurityGroup)"
    params:
      input_security_group_id: {"type": "string", "required": true, "max_length": 256, "label": "Input security group ID", "description": "The input security group's ID, as input_security_groups.<id> in state lists it."}
    send: {"method": "GET", "path": "/prod/inputSecurityGroups/{input_security_group_id}"}
    expect: { status: 200, json_path: "$" }
    returns: value
  describe_multiplex:
    summary: "Describe multiplex (GET /prod/multiplexes/{multiplexId}, DescribeMultiplex)"
    params:
      multiplex_id: {"type": "string", "required": true, "max_length": 256, "label": "Multiplex ID", "description": "The multiplex's ID, as multiplexes.<id> in state lists it."}
    send: {"method": "GET", "path": "/prod/multiplexes/{multiplex_id}"}
    expect: { status: 200, json_path: "$" }
    returns: value
  describe_multiplex_program:
    summary: "Describe multiplex program (GET /prod/multiplexes/{multiplexId}/programs/{programName}, DescribeMultiplexProgram)"
    params:
      multiplex_id: {"type": "string", "required": true, "max_length": 256, "label": "Multiplex ID", "description": "The multiplex's ID, as multiplexes.<id> in state lists it."}
      program_name: {"type": "string", "required": true, "max_length": 256, "label": "Program name", "description": "The multiplex program's name."}
    send: {"method": "GET", "path": "/prod/multiplexes/{multiplex_id}/programs/{program_name}"}
    expect: { status: 200, json_path: "$" }
    returns: value
  describe_offering:
    summary: "Describe offering (GET /prod/offerings/{offeringId}, DescribeOffering)"
    params:
      offering_id: {"type": "string", "required": true, "max_length": 256, "label": "Offering ID", "description": "The reservation offering's ID, from list_offerings."}
    send: {"method": "GET", "path": "/prod/offerings/{offering_id}"}
    expect: { status: 200, json_path: "$" }
    returns: value
  describe_reservation:
    summary: "Describe reservation (GET /prod/reservations/{reservationId}, DescribeReservation)"
    params:
      reservation_id: {"type": "string", "required": true, "max_length": 256, "label": "Reservation ID", "description": "The reservation's ID, from list_reservations."}
    send: {"method": "GET", "path": "/prod/reservations/{reservation_id}"}
    expect: { status: 200, json_path: "$" }
    returns: value
  describe_schedule:
    summary: "Describe schedule (GET /prod/channels/{channelId}/schedule, DescribeSchedule)"
    params:
      channel_id: {"type": "string", "required": true, "max_length": 256, "label": "Channel ID", "description": "The channel's ID, as channels.<id> in state lists it."}
      max_results: {"type": "int", "min": 1, "max": 1000, "default": 1000, "label": "Page size", "description": "How many items the page holds at most, 1 to 1000."}
    send: {"method": "GET", "path": "/prod/channels/{channel_id}/schedule", "query": {"maxResults": "{max_results}"}}
    expect: { status: 200, json_path: "$" }
    returns: value
  describe_schedule_page:
    summary: "Describe schedule, the page after a next token (GET /prod/channels/{channelId}/schedule, DescribeSchedule)"
    params:
