        "devices.{rid:key}.tags": "{tags}"
        "devices.{rid:key}.resource": "{resource}"
        "devices.{rid:key}.type": "{type}"
        "devices.{rid:key}.node_id": "{node_id}"
        "devices.{rid:key}.controls": "{controls}"
