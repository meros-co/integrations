quirks:
  - models: [all]
    severity: info
    text: >
      A Node has no standard port: open it with the Node API's port from its
      _nmos-node._tcp advertisement (mDNS discovery reports it) or its
      configuration. Its Connection, Channel Mapping and Events APIs may be on the
      same port or others: the href of each Device control (state
      devices.*.controls) gives them, and connection_port, channelmapping_port
      and events_port take them. A Node lacking one of these APIs fails its
      requests, which are then logged at each poll.

  - models: [all]
    severity: warning
    text: >
      Connecting a Receiver over RTP needs the Sender's transport file (SDP):
      connect_receiver takes it, as the Sender's own Node serves it
      (connection.senders.*.transport_file there, or its manifest_href). A
      Sender on another Node is read by opening that Node too, or from the
      registry (nmos-registry). Changes take effect at once (activate_immediate);
      stage_receiver and stage_sender schedule them.

  - models: [all]
    severity: info
    text: >
      Nothing is pushed by the Node API: the resources are read every 30 seconds,
      the IS-05 active parameters every 5 seconds, the IS-08 map every 5 seconds
      and the IS-07 event states every 2 seconds. Events are pushed as well:
      each Sender of transport urn:x-nmos:transport:websocket or
      urn:x-nmos:transport:mqtt is followed to its websocket server or MQTT
      broker (listed every 30 seconds, with its active IS-05 parameters), whose
      state messages are kept in events.* as they come. A broker the Sender
      chooses itself (destination_host auto) cannot be followed. IS-05 parameters of a Sender or Receiver
      that has gone stay in state until the Node is opened again, since the
      Connection API's lists name ids only.

  - models: [all]
    severity: info
    text: >
      The Node API's /receivers/{id}/target is deprecated since IS-04 v1.2 and may
      answer 501; set_receiver_target and clear_receiver_target are for Nodes
      without IS-05. The IS-08 scheduled activations are read from
      /map/activations/ (with the trailing slash every server accepts for GET),
      so a POST's answer, which names only the new activation, does not replace
      the list.
