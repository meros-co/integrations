  devices.*.resource: { type: string, description: "Device: the whole resource as the API gives it, as JSON text" }
  devices.*.type: { type: string, description: "Device: the Device's type, a URN such as urn:x-nmos:device:pipeline" }
  devices.*.node_id: { type: string, description: "Device: the id of the Node the Device belongs to" }
  devices.*.controls: { type: string, description: "Device: the Device's control endpoints (href, type such as urn:x-nmos:control:sr-ctrl/v1.1, authorization), as JSON text" }
  sources.*.label: { type: string, description: "Source: its label, free text" }
  sources.*.description: { type: string, description: "Source: its description, free text" }
  sources.*.version: { type: string, description: "Source: its version, the TAI time of its last change as <seconds>:<nanoseconds>" }
  sources.*.tags: { type: string, description: "Source: its tags, as JSON text (an object of string arrays)" }
  sources.*.resource: { type: string, description: "Source: the whole resource as the API gives it, as JSON text" }
  sources.*.format: { type: string, description: "Source: the Source's format, a URN such as urn:x-nmos:format:video" }
  sources.*.device_id: { type: string, description: "Source: the id of the Device the Source belongs to" }
  sources.*.clock_name: { type: string, description: "Source: the name of the Node clock the Source is timed by, empty when none" }
  sources.*.grain_rate: { type: string, description: "Source: the Source's maximum grain rate as JSON text ({numerator, denominator})" }
  sources.*.caps: { type: string, description: "Source: the Source's capabilities, as JSON text" }
  sources.*.parents: { type: string, description: "Source: the ids of the Sources this one derives from, as JSON text" }
  sources.*.channels: { type: string, description: "Source: an audio Source's channels (label, symbol), as JSON text" }
  flows.*.label: { type: string, description: "Flow: its label, free text" }
  flows.*.description: { type: string, description: "Flow: its description, free text" }
  flows.*.version: { type: string, description: "Flow: its version, the TAI time of its last change as <seconds>:<nanoseconds>" }
  flows.*.tags: { type: string, description: "Flow: its tags, as JSON text (an object of string arrays)" }
  flows.*.resource: { type: string, description: "Flow: the whole resource as the API gives it, as JSON text" }
  flows.*.format: { type: string, description: "Flow: the Flow's format, a URN such as urn:x-nmos:format:audio" }
  flows.*.source_id: { type: string, description: "Flow: the id of the Source the Flow is from" }
  flows.*.device_id: { type: string, description: "Flow: the id of the Device the Flow belongs to" }
  flows.*.media_type: { type: string, description: "Flow: the Flow's media type, such as video/raw or audio/L24" }
  flows.*.grain_rate: { type: string, description: "Flow: the Flow's grain rate as JSON text ({numerator, denominator})" }
  flows.*.frame_width: { type: int, description: "Flow: a video Flow's width in pixels" }
  flows.*.frame_height: { type: int, description: "Flow: a video Flow's height in lines" }
  flows.*.interlace_mode: { type: string, description: "Flow: a video Flow's interlace mode: progressive, interlaced_tff, interlaced_bff or interlaced_psf" }
  flows.*.colorspace: { type: string, description: "Flow: a video Flow's colorspace, such as BT709 or BT2020" }
