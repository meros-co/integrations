spec: 1
id: nmos-node
name: AMWA NMOS Node (IS-04 Node API, IS-05 Connection API, IS-08 Channel Mapping, IS-07 Events)
vendor: AMWA (NMOS specifications; any NMOS Node)
category: router

source:
  - title: AMWA IS-04 NMOS Discovery and Registration Specification v1.3.3
    author: Advanced Media Workflow Association (AMWA)
    url: https://specs.amwa.tv/is-04/v1.3.3/
    note: >
      Apache 2.0 specification, the source of every Node API request and resource
      field here: APIs/NodeAPI.raml (/self, /devices, /sources, /flows, /senders,
      /receivers, their single resources and the deprecated
      /receivers/{receiverId}/target PUT), the resource schemas (resource_core,
      node, device, source, flow, sender, receiver), docs/APIs.md (trailing
      slashes, error codes), docs/Discovery - Peer to Peer Operation.md (the
      _nmos-node._tcp advertisement and its api_proto and api_ver TXT records).
      Repository https://github.com/AMWA-TV/is-04 at tag v1.3.3.
  - title: AMWA IS-05 NMOS Device Connection Management Specification v1.1.2 (and v1.2.0)
    author: Advanced Media Workflow Association (AMWA)
    url: https://specs.amwa.tv/is-05/v1.1.2/
    note: >
      Apache 2.0 specification: APIs/ConnectionAPI.raml (single senders and
      receivers with their constraints, staged, active, transportfile and
      transporttype resources, the bulk endpoints), the stage, activation and
      transport parameter schemas and the examples (a PATCH with an SDP
      transport file, immediate and scheduled activations, the resource list
      of ids with trailing slashes). v1.2.0 adds transport types only and keeps
      the same resources (CHANGELOG). Repository https://github.com/AMWA-TV/is-05.
  - title: AMWA IS-08 NMOS Audio Channel Mapping Specification v1.0.1
    author: Advanced Media Workflow Association (AMWA)
    url: https://specs.amwa.tv/is-08/v1.0.1/
    note: >
      Apache 2.0 specification: APIs/ChannelMappingAPI.raml (/inputs, /outputs,
      /map/active, /map/activations, /io) and the examples (the /io answer, the
      active map keyed by output and channel index, an activation request).
      Repository https://github.com/AMWA-TV/is-08.
  - title: AMWA IS-07 NMOS Event and Tally Specification v1.0.1
    author: Advanced Media Workflow Association (AMWA)
    url: https://specs.amwa.tv/is-07/v1.0.1/
    note: >
      Apache 2.0 specification: APIs/EventsAPI.raml (/sources, /sources/{id}/type,
      /sources/{id}/state) and the state and type examples; docs (CC BY-SA 4.0),
      read for the event transports: "Transport - Websocket" (connection_uri,
      connection_authorization and ext_is_07_source_id; the subscription
      command and the states it resends; a health command every 5 seconds,
      the server closing after 12 seconds without one), "Transport - MQTT"
      (destination_host and destination_port, broker_protocol mqtt or
      secure-mqtt, broker_authorization, broker_topic and
      connection_status_broker_topic, retained states) and "Message types"
      (state, reboot, shutdown, connection_status and health). Repository
      https://github.com/AMWA-TV/is-07 at tag v1.0.1.
  - title: OASIS MQTT Version 3.1.1 (OASIS Standard, 29 October 2014)
    author: OASIS
    url: http://docs.oasis-open.org/mqtt/mqtt/v3.1.1/os/mqtt-v3.1.1-os.html
    note: >
      The MQTT packets the core sends and reads at an IS-07 Sender's broker
      (CONNECT, CONNACK, SUBSCRIBE, SUBACK, UNSUBSCRIBE, PUBLISH and its
      acknowledgements, PINGREQ, DISCONNECT), sections 2 and 3.

transport:
  type: http
  port: null
  scheme: { setting: scheme }
  accept_invalid_certs: true
  # IS-10 authorization, where a Node uses it: the token goes as a bearer
  # token on every request while it is set.
  auth: bearer
  # IS-10: 401 is a token refused; 403 a scope missing or a request refused
  # (deleting a non-persistent subscription), which fails that request only.
  refusal_status: [401]
  timeout_ms: 5000
  probe: { method: GET, path: /x-nmos/node }
  endpoints:
    connection: { port: { setting: connection_port } }
    channelmapping: { port: { setting: channelmapping_port } }
    events: { port: { setting: events_port } }
# Following each IS-07 Sender to its websocket or MQTT broker, where the
# address comes from the Sender's own transport parameters, is native.
extension: nmos-event-transports
settings:
  scheme:
    type: enum
    values: [http, https]
    default: http
    label: Protocol
    description: "http, or https for a Node whose APIs are served over TLS (BCP-003-01); the Node's api_proto TXT record says which."
  token:
    type: string
    secret: true
    default: ""
    label: Access token
    description: "An IS-10 bearer token for a Node that requires authorization, sent with every request; empty sends none."
  node_version:
    type: enum
    values: [v1.3, v1.2, v1.1, v1.0]
    default: v1.3
    label: Node API version
    description: "The Node API version to use, one the Node lists in its api_ver TXT record or at /x-nmos/node."
  connection_version:
    type: enum
    values: [v1.1, v1.0, v1.2]
    default: v1.1
    label: Connection API version
    description: "The IS-05 Connection API version to use, as the Device's sr-ctrl control type names it."
  connection_port:
    type: int
    min: 1
    max: 65535
    label: Connection API port
    description: "The port of the Node's IS-05 Connection API, from the href of its Devices' urn:x-nmos:control:sr-ctrl control; empty uses the Node API's port."
  channelmapping_port:
    type: int
    min: 1
    max: 65535
    label: Channel Mapping API port
    description: "The port of the Node's IS-08 Channel Mapping API, from its Devices' urn:x-nmos:control:cm-ctrl control; empty uses the Node API's port."
  events_port:
    type: int
    min: 1
    max: 65535
    label: Events API port
    description: "The port of the Node's IS-07 Events API, from its Devices' urn:x-nmos:control:events control; empty uses the Node API's port."
  mqtt_username:
    type: string
    max_length: 256
    label: MQTT user name
    description: "The user name for the MQTT broker of an IS-07 Sender whose broker_authorization is true; empty sends none."
  mqtt_password:
    type: string
    secret: true
    max_length: 256
    label: MQTT password
    description: "That user's password at the broker."

ports:
  - { port: null, protocol: http, role: control, note: "the Node API port has no standard number: it is given when the Node is opened, from its _nmos-node._tcp SRV record or its configuration" }
  - { port: null, protocol: http, role: control, setting: connection_port, note: "IS-05 Connection API; the Node API's port when not set" }
  - { port: null, protocol: http, role: control, setting: channelmapping_port, note: "IS-08 Channel Mapping API; the Node API's port when not set" }
  - { port: null, protocol: http, role: control, setting: events_port, note: "IS-07 Events API; the Node API's port when not set" }
  - { port: null, protocol: ws, role: push, note: "IS-07: each event Sender's websocket server, at the connection_uri its transport parameters give" }
  - { port: 1883, protocol: tcp, role: push, note: "IS-07: an event Sender's MQTT broker (destination_host and destination_port), mqtt" }
  - { port: 8883, protocol: tls, role: push, note: "IS-07: an event Sender's MQTT broker over TLS, secure-mqtt" }
  - { port: 5353, protocol: udp, role: discovery, note: "mDNS / DNS-SD: _nmos-node._tcp" }
models:
  - id: node
    name: Any AMWA NMOS Node (IS-04 v1.0 to v1.3, with IS-05, IS-08 and IS-07 where it has them)
    supports:
      - get_self
      - get_devices
      - get_device
      - get_sources
      - get_source
      - get_flows
      - get_flow
      - get_senders
      - get_sender
      - get_receivers
      - get_receiver
      - set_receiver_target
      - clear_receiver_target
      - get_connection_senders
      - get_sender_constraints
      - get_sender_staged
      - get_sender_active
      - get_sender_transporttype
      - get_connection_receivers
      - get_receiver_constraints
      - get_receiver_staged
      - get_receiver_active
      - get_receiver_transporttype
      - get_sender_transport_file
      - connect_receiver
      - connect_receiver_with_params
      - disconnect_receiver
      - set_receiver_enabled
      - set_sender_enabled
      - set_sender_receiver
      - stage_receiver
      - stage_sender
      - bulk_stage_senders
      - bulk_stage_receivers
      - get_channelmapping_io
      - get_active_map
      - get_map_activations
      - route_channel
      - unroute_channel
      - activate_map
      - cancel_map_activation
      - get_event_sources
      - get_event_state
      - get_event_type
    verification: none
    notes: >
      Any Node, from any vendor: a camera, gateway, encoder, decoder,
      multiviewer or software. The APIs it has are listed in its Devices' controls
      (state devices.*.controls); a request to an API it lacks fails.
commands:
  get_self:
    summary: "Read the Node resource (GET /self)"
    send: { method: GET, path: "/x-nmos/node/{settings.node_version}/self" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # NodeAPI.raml /self

  get_devices:
    summary: "List the Node's devices (GET /devices)"
    send: { method: GET, path: "/x-nmos/node/{settings.node_version}/devices" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # NodeAPI.raml /devices

  get_device:
    summary: "Read one Device (GET /devices/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Device id,
        description: "The Device's id, a UUID." }
    send: { method: GET, path: "/x-nmos/node/{settings.node_version}/devices/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # NodeAPI.raml /devices/{id}

  get_sources:
    summary: "List the Node's sources (GET /sources)"
    send: { method: GET, path: "/x-nmos/node/{settings.node_version}/sources" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # NodeAPI.raml /sources

  get_source:
    summary: "Read one Source (GET /sources/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Source id,
        description: "The Source's id, a UUID." }
    send: { method: GET, path: "/x-nmos/node/{settings.node_version}/sources/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # NodeAPI.raml /sources/{id}

  get_flows:
    summary: "List the Node's flows (GET /flows)"
    send: { method: GET, path: "/x-nmos/node/{settings.node_version}/flows" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # NodeAPI.raml /flows

  get_flow:
    summary: "Read one Flow (GET /flows/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Flow id,
        description: "The Flow's id, a UUID." }
    send: { method: GET, path: "/x-nmos/node/{settings.node_version}/flows/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # NodeAPI.raml /flows/{id}

  get_senders:
    summary: "List the Node's senders (GET /senders)"
    send: { method: GET, path: "/x-nmos/node/{settings.node_version}/senders" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # NodeAPI.raml /senders

  get_sender:
    summary: "Read one Sender (GET /senders/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id,
        description: "The Sender's id, a UUID." }
    send: { method: GET, path: "/x-nmos/node/{settings.node_version}/senders/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # NodeAPI.raml /senders/{id}

  get_receivers:
    summary: "List the Node's receivers (GET /receivers)"
    send: { method: GET, path: "/x-nmos/node/{settings.node_version}/receivers" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # NodeAPI.raml /receivers

  get_receiver:
    summary: "Read one Receiver (GET /receivers/{id})"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver's id, a UUID." }
    send: { method: GET, path: "/x-nmos/node/{settings.node_version}/receivers/{id}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # NodeAPI.raml /receivers/{id}

  set_receiver_target:
    summary: "Subscribe a Receiver to a Sender through the Node API (PUT /receivers/{id}/target, deprecated in favor of IS-05)"
    params:
      receiver_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver to subscribe, a UUID." }
      sender:
        type: json
        required: true
        label: Sender
        description: "The Sender resource to subscribe to, as the Query or Node API gives it (the IS-04 sender schema)."
    send:
      - { method: PUT, path: "/x-nmos/node/{settings.node_version}/receivers/{receiver_id}/target", content_type: application/json, body: "{sender}" }
      - { method: GET, path: "/x-nmos/node/{settings.node_version}/receivers" }
    expect: { status: [200, 202] }
    returns: ack
    # NodeAPI.raml /receivers/{receiverId}/target: 202 with the Sender, 501 where not implemented

  clear_receiver_target:
    summary: "Unsubscribe a Receiver through the Node API (PUT an empty object to /receivers/{id}/target, deprecated)"
    params:
      receiver_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver to unsubscribe, a UUID." }
    send:
      - { method: PUT, path: "/x-nmos/node/{settings.node_version}/receivers/{receiver_id}/target", content_type: application/json, body: "{}" }
      - { method: GET, path: "/x-nmos/node/{settings.node_version}/receivers" }
    expect: { status: [200, 202] }
    returns: ack
    # NodeAPI.raml: an empty object unsubscribes

  get_connection_senders:
    summary: "List the senders the Connection API controls (GET /single/senders)"
    send: { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/senders" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ConnectionAPI.raml /single/senders

  get_sender_constraints:
    summary: "Read a Sender's constraints parameters (GET /single/senders/{id}/constraints)"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id,
        description: "The Sender's id, a UUID." }
    send: { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/senders/{id}/constraints" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ConnectionAPI.raml /single/senders/{id}/constraints

  get_sender_staged:
    summary: "Read a Sender's staged parameters (GET /single/senders/{id}/staged)"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id,
        description: "The Sender's id, a UUID." }
    send: { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/senders/{id}/staged" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ConnectionAPI.raml /single/senders/{id}/staged

  get_sender_active:
    summary: "Read a Sender's active parameters (GET /single/senders/{id}/active)"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id,
        description: "The Sender's id, a UUID." }
    send: { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/senders/{id}/active" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ConnectionAPI.raml /single/senders/{id}/active

  get_sender_transporttype:
    summary: "Read a Sender's transporttype parameters (GET /single/senders/{id}/transporttype)"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id,
        description: "The Sender's id, a UUID." }
    send: { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/senders/{id}/transporttype" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ConnectionAPI.raml /single/senders/{id}/transporttype

  get_connection_receivers:
    summary: "List the receivers the Connection API controls (GET /single/receivers)"
    send: { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/receivers" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ConnectionAPI.raml /single/receivers

  get_receiver_constraints:
    summary: "Read a Receiver's constraints parameters (GET /single/receivers/{id}/constraints)"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver's id, a UUID." }
    send: { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{id}/constraints" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ConnectionAPI.raml /single/receivers/{id}/constraints

  get_receiver_staged:
    summary: "Read a Receiver's staged parameters (GET /single/receivers/{id}/staged)"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver's id, a UUID." }
    send: { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{id}/staged" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ConnectionAPI.raml /single/receivers/{id}/staged

  get_receiver_active:
    summary: "Read a Receiver's active parameters (GET /single/receivers/{id}/active)"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver's id, a UUID." }
    send: { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{id}/active" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ConnectionAPI.raml /single/receivers/{id}/active

  get_receiver_transporttype:
    summary: "Read a Receiver's transporttype parameters (GET /single/receivers/{id}/transporttype)"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver's id, a UUID." }
    send: { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{id}/transporttype" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ConnectionAPI.raml /single/receivers/{id}/transporttype

  get_sender_transport_file:
    summary: "Read a Sender's transport file, its SDP (GET /single/senders/{id}/transportfile)"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id,
        description: "The Sender's id, a UUID." }
    send: { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/senders/{id}/transportfile" }
    expect: { status: 200 }
    returns: text
    # ConnectionAPI.raml /single/senders/{id}/transportfile

  connect_receiver:
    summary: "Connect a Receiver to a Sender with the Sender's SDP, at once (PATCH staged, activate_immediate)"
    params:
      receiver_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver to change, a UUID." }
      sender_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id,
        description: "The Sender to receive, a UUID." }
      sdp: { type: string, required: true, multiline: true,
        label: SDP,
        description: "The Sender's transport file (SDP), as its transportfile resource or manifest_href gives it." }
    send:
      - { endpoint: connection, method: PATCH, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{receiver_id}/staged",
          content_type: application/json, body: '{"sender_id":{sender_id:json},"master_enable":true,"activation":{"mode":"activate_immediate"},"transport_file":{"data":{sdp:json},"type":"application/sdp"}}' }
      - { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{receiver_id}/active" }
    expect: { status: [200, 202] }
    returns: ack
    # receiver-patch-transportfile.json, activation-schema.json

  connect_receiver_with_params:
    summary: "Connect a Receiver to a Sender with explicit transport parameters, at once"
    params:
      receiver_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver to change, a UUID." }
      sender_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id,
        description: "The Sender to receive, a UUID." }
      transport_params: { type: json, required: true,
        label: Transport parameters,
        description: "The transport parameters in the shape of the IS-05 receiver_transport_params schema: an array of one object per leg, two for SMPTE 2022-7." }
    send:
      - { endpoint: connection, method: PATCH, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{receiver_id}/staged",
          content_type: application/json, body: '{"sender_id":{sender_id:json},"master_enable":true,"activation":{"mode":"activate_immediate"},"transport_params":{transport_params}}' }
      - { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{receiver_id}/active" }
    expect: { status: [200, 202] }
    returns: ack
    # receiver-patch.json, receiver-stage-schema.json

  disconnect_receiver:
    summary: "Disconnect a Receiver at once: no Sender, master enable off"
    params:
      receiver_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver to change, a UUID." }
    send:
      - { endpoint: connection, method: PATCH, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{receiver_id}/staged",
          content_type: application/json, body: '{"sender_id":null,"master_enable":false,"activation":{"mode":"activate_immediate"}}' }
      - { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{receiver_id}/active" }
    expect: { status: [200, 202] }
    returns: ack
    # receiver-stage-schema.json: sender_id null

  set_receiver_enabled:
    summary: "Turn a Receiver's master enable on or off, at once"
    params:
      receiver_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver to change, a UUID." }
      enabled: { type: bool, required: true, label: Enabled, description: "On makes the Receiver receive, off stops it." }
    send:
      - { endpoint: connection, method: PATCH, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{receiver_id}/staged",
          content_type: application/json, body: '{"master_enable":{enabled},"activation":{"mode":"activate_immediate"}}' }
      - { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{receiver_id}/active" }
    expect: { status: [200, 202] }
    returns: ack
    # receiver-stage-schema.json: master_enable

  set_sender_enabled:
    summary: "Turn a Sender's master enable on or off, at once"
    params:
      sender_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id,
        description: "The Sender to change, a UUID." }
      enabled: { type: bool, required: true, label: Enabled, description: "On makes the Sender send, off stops it." }
    send:
      - { endpoint: connection, method: PATCH, path: "/x-nmos/connection/{settings.connection_version}/single/senders/{sender_id}/staged",
          content_type: application/json, body: '{"master_enable":{enabled},"activation":{"mode":"activate_immediate"}}' }
      - { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/senders/{sender_id}/active" }
    expect: { status: [200, 202] }
    returns: ack
    # sender-stage-schema.json: master_enable

  set_sender_receiver:
    summary: "Point a unicast Sender at a Receiver, at once"
    params:
      sender_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id,
        description: "The Sender to change, a UUID." }
      receiver_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver the Sender sends to, a UUID." }
    send:
      - { endpoint: connection, method: PATCH, path: "/x-nmos/connection/{settings.connection_version}/single/senders/{sender_id}/staged",
          content_type: application/json, body: '{"receiver_id":{receiver_id:json},"activation":{"mode":"activate_immediate"}}' }
      - { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/senders/{sender_id}/active" }
    expect: { status: [200, 202] }
    returns: ack
    # sender-stage-schema.json: receiver_id

  stage_receiver:
    summary: "Stage a Receiver's parameters and activation as the IS-05 receiver-stage-schema gives them (scheduled activations, cancelling one)"
    params:
      receiver_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Receiver id,
        description: "The Receiver to change, a UUID." }
      staged: { type: json, required: true,
        label: Staged parameters,
        description: "The PATCH body in the shape of the IS-05 receiver-stage-schema: sender_id, master_enable, activation (immediate, scheduled absolute or relative, or a null mode to cancel), transport_file and transport_params." }
    send:
      - { endpoint: connection, method: PATCH, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{receiver_id}/staged",
          content_type: application/json, body: '{staged}' }
      - { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/receivers/{receiver_id}/active" }
    expect: { status: [200, 202] }
    returns: ack
    # receiver-stage-schema.json, receiver-patch-absolute.json, receiver-patch-relative.json

  stage_sender:
    summary: "Stage a Sender's parameters and activation as the IS-05 sender-stage-schema gives them"
    params:
      sender_id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Sender id,
        description: "The Sender to change, a UUID." }
      staged: { type: json, required: true,
        label: Staged parameters,
        description: "The PATCH body in the shape of the IS-05 sender-stage-schema: receiver_id, master_enable, activation (immediate, scheduled absolute or relative, or a null mode to cancel) and transport_params." }
    send:
      - { endpoint: connection, method: PATCH, path: "/x-nmos/connection/{settings.connection_version}/single/senders/{sender_id}/staged",
          content_type: application/json, body: '{staged}' }
      - { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/senders/{sender_id}/active" }
    expect: { status: [200, 202] }
    returns: ack
    # sender-stage-schema.json

  bulk_stage_senders:
    summary: "Stage several senders at once (POST /bulk/senders), each with its own parameters and activation"
    params:
      items:
        type: json
        required: true
        label: Items
        description: "The POST body in the shape of the IS-05 bulk-sender-post-schema: an array of id and params, params as for one sender."
    send: { endpoint: connection, method: POST, path: "/x-nmos/connection/{settings.connection_version}/bulk/senders", content_type: application/json, body: "{items}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ConnectionAPI.raml /bulk/senders: one result per item

  bulk_stage_receivers:
    summary: "Stage several receivers at once (POST /bulk/receivers), each with its own parameters and activation"
    params:
      items:
        type: json
        required: true
        label: Items
        description: "The POST body in the shape of the IS-05 bulk-receiver-post-schema: an array of id and params, params as for one receiver."
    send: { endpoint: connection, method: POST, path: "/x-nmos/connection/{settings.connection_version}/bulk/receivers", content_type: application/json, body: "{items}" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ConnectionAPI.raml /bulk/receivers: one result per item

  get_channelmapping_io:
    summary: "Read every input and output with their properties, channels and capabilities (GET /io)"
    send: { endpoint: channelmapping, method: GET, path: "/x-nmos/channelmapping/v1.0/io" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ChannelMappingAPI.raml /io

  get_active_map:
    summary: "Read the active channel map (GET /map/active)"
    send: { endpoint: channelmapping, method: GET, path: "/x-nmos/channelmapping/v1.0/map/active" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ChannelMappingAPI.raml /map/active

  get_map_activations:
    summary: "List the scheduled channel map activations (GET /map/activations)"
    send: { endpoint: channelmapping, method: GET, path: "/x-nmos/channelmapping/v1.0/map/activations" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # ChannelMappingAPI.raml /map/activations

  route_channel:
    summary: "Route an input channel to an output channel, at once"
    params:
      output: { type: string, required: true, max_length: 256, pattern: "^[^\\x00-\\x1f\"/]+$",
        label: Output, description: "The output's id, as /io lists it." }
      channel: { type: int, min: 0, max: 65535, required: true,
        label: Output channel, description: "The output channel, numbered from 0." }
      input: { type: string, required: true, max_length: 256, pattern: "^[^\\x00-\\x1f\"/]+$",
        label: Input, description: "The input's id, as /io lists it." }
      input_channel: { type: int, min: 0, max: 65535, required: true,
        label: Input channel, description: "The input channel, numbered from 0." }
    send:
      - { endpoint: channelmapping, method: POST, path: "/x-nmos/channelmapping/v1.0/map/activations", content_type: application/json,
          body: '{"activation":{"mode":"activate_immediate"},"action":{{output:json}:{"{channel}":{"input":{input:json},"channel_index":{input_channel}}}}}' }
      - { endpoint: channelmapping, method: GET, path: "/x-nmos/channelmapping/v1.0/map/active" }
    expect: { status: [200, 202] }
    returns: ack
    # map-activations-post-request-schema.json, map-activations-post.json

  unroute_channel:
    summary: "Leave an output channel unrouted, at once"
    params:
      output: { type: string, required: true, max_length: 256, pattern: "^[^\\x00-\\x1f\"/]+$",
        label: Output, description: "The output's id, as /io lists it." }
      channel: { type: int, min: 0, max: 65535, required: true,
        label: Output channel, description: "The output channel, numbered from 0." }
    send:
      - { endpoint: channelmapping, method: POST, path: "/x-nmos/channelmapping/v1.0/map/activations", content_type: application/json,
          body: '{"activation":{"mode":"activate_immediate"},"action":{{output:json}:{"{channel}":{"input":null,"channel_index":null}}}}' }
      - { endpoint: channelmapping, method: GET, path: "/x-nmos/channelmapping/v1.0/map/active" }
    expect: { status: [200, 202] }
    returns: ack
    # map-entries-schema.json: input and channel_index null for an unrouted channel

  activate_map:
    summary: "Change several channels, at once or scheduled, with an activation request as the IS-08 schema gives it"
    params:
      activation:
        type: json
        required: true
        label: Activation
        description: "The POST body in the shape of the IS-08 map-activations-post-request-schema: activation (mode and requested_time) and action (outputs, channels and their inputs)."
    send:
      - { endpoint: channelmapping, method: POST, path: "/x-nmos/channelmapping/v1.0/map/activations", content_type: application/json, body: "{activation}" }
      - { endpoint: channelmapping, method: GET, path: "/x-nmos/channelmapping/v1.0/map/activations" }
    expect: { status: [200, 202] }
    returns: ack
    # ChannelMappingAPI.raml /map/activations POST

  cancel_map_activation:
    summary: "Cancel a scheduled channel map activation (DELETE /map/activations/{id})"
    params:
      id: { type: string, required: true, max_length: 64, pattern: "^[A-Za-z0-9_-]+$",
        label: Activation id, description: "The scheduled activation's id, as /map/activations lists it." }
    send:
      - { endpoint: channelmapping, method: DELETE, path: "/x-nmos/channelmapping/v1.0/map/activations/{id}" }
      - { endpoint: channelmapping, method: GET, path: "/x-nmos/channelmapping/v1.0/map/activations" }
    expect: { status: [200, 204] }
    returns: ack
    # ChannelMappingAPI.raml /map/activations/{activationId} DELETE

  get_event_sources:
    summary: "List the event sources (GET /sources)"
    send: { endpoint: events, method: GET, path: "/x-nmos/events/v1.0/sources" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # EventsAPI.raml /sources

  get_event_state:
    summary: "Read an event source's current state (GET /sources/{id}/state)"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Event source id,
        description: "The event source's id (its IS-04 Source id), a UUID." }
    send: { endpoint: events, method: GET, path: "/x-nmos/events/v1.0/sources/{id}/state" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # EventsAPI.raml /sources/{id}/state

  get_event_type:
    summary: "Read an event source's type (GET /sources/{id}/type)"
    params:
      id: { type: string, required: true, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
        label: Event source id,
        description: "The event source's id (its IS-04 Source id), a UUID." }
    send: { endpoint: events, method: GET, path: "/x-nmos/events/v1.0/sources/{id}/type" }
    expect: { status: 200, json_path: "$" }
    returns: value
    # EventsAPI.raml /sources/{id}/type
telemetry:
  # Nothing is pushed: the Node API, Connection API, Channel Mapping API and
  # Events API are read in turn. Each list read has each item's state read
  # after it (then_send), as a controller does.
  poll:
    - every_ms: 2000
      send:
        - { endpoint: events, method: GET, path: "/x-nmos/events/v1.0/sources" }
    - every_ms: 5000
      send:
        - { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/receivers" }
        - { endpoint: connection, method: GET, path: "/x-nmos/connection/{settings.connection_version}/single/senders" }
        - { endpoint: channelmapping, method: GET, path: "/x-nmos/channelmapping/v1.0/map/active" }
    - every_ms: 30000
      send:
        - { method: GET, path: "/x-nmos/node/{settings.node_version}/self" }
        - { method: GET, path: "/x-nmos/node/{settings.node_version}/devices" }
        - { method: GET, path: "/x-nmos/node/{settings.node_version}/sources" }
        - { method: GET, path: "/x-nmos/node/{settings.node_version}/flows" }
        - { method: GET, path: "/x-nmos/node/{settings.node_version}/senders" }
        - { method: GET, path: "/x-nmos/node/{settings.node_version}/receivers" }
        - { endpoint: channelmapping, method: GET, path: "/x-nmos/channelmapping/v1.0/io" }
        - { endpoint: channelmapping, method: GET, path: "/x-nmos/channelmapping/v1.0/map/activations/" }
  updates:
    - path: "^/x-nmos/node/v1[.][0-9]+/self$"
      replace: "nodes"
      json: { rid: "$.id", label: "$.label", description: "$.description", version: "$.version", tags: "$.tags", resource: "$", hostname: "$.hostname", href: "$.href", api_versions: "$.api.versions", api_endpoints: "$.api.endpoints", caps: "$.caps", services: "$.services", clocks: "$.clocks", interfaces: "$.interfaces" }
      state:
        "nodes.{rid:key}.label": "{label}"
        "nodes.{rid:key}.description": "{description}"
        "nodes.{rid:key}.version": "{version}"
        "nodes.{rid:key}.tags": "{tags}"
        "nodes.{rid:key}.resource": "{resource}"
        "nodes.{rid:key}.hostname": "{hostname}"
        "nodes.{rid:key}.href": "{href}"
        "nodes.{rid:key}.api_versions": "{api_versions}"
        "nodes.{rid:key}.api_endpoints": "{api_endpoints}"
        "nodes.{rid:key}.caps": "{caps}"
        "nodes.{rid:key}.services": "{services}"
        "nodes.{rid:key}.clocks": "{clocks}"
        "nodes.{rid:key}.interfaces": "{interfaces}"
    - path: "^/x-nmos/node/v1[.][0-9]+/devices$"
      json_each: "$"
      replace: "devices"
      json: { rid: "$.id", label: "$.label", description: "$.description", version: "$.version", tags: "$.tags", resource: "$", type: "$.type", node_id: "$.node_id", controls: "$.controls" }
