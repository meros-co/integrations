  flows.*.sample_rate: { type: string, description: "Flow: an audio Flow's sample rate as JSON text ({numerator, denominator})" }
  flows.*.bit_depth: { type: int, description: "Flow: an audio Flow's bit depth" }
  flows.*.parents: { type: string, description: "Flow: the ids of the Flows this one derives from, as JSON text" }
