  senders.*.flow_id: { type: string, description: "Sender: the id of the Flow the Sender sends, empty when none" }
  senders.*.transport: { type: string, description: "Sender: the Sender's transport, a URN such as urn:x-nmos:transport:rtp.mcast" }
  senders.*.device_id: { type: string, description: "Sender: the id of the Device the Sender belongs to" }
  senders.*.manifest_href: { type: string, description: "Sender: the URL of the Sender's transport file (SDP), empty when none" }
  senders.*.interface_bindings: { type: string, description: "Sender: the Node interfaces the Sender sends on, as JSON text" }
