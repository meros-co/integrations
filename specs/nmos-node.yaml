    - path: "^/x-nmos/events/v1[.]0/sources$"
      json_each: "$"
      each_match: { "$": "^([0-9a-f-]+)/?$" }
      json: {}
      then_send:
        - { endpoint: events, method: GET, path: "/x-nmos/events/v1.0/sources/{1}/state" }
    - path: "^/x-nmos/events/v1[.]0/sources/([0-9a-f-]+)/state$"
      json: { event_type: "$.event_type", value: "$.payload.value", scale: "$.payload.scale", payload: "$.payload", time: "$.timing.creation_timestamp" }
      state:
        "events.{1}.event_type": "{event_type}"
        "events.{1}.value": "{value}"
        "events.{1}.scale": "{scale}"
        "events.{1}.payload": "{payload}"
        "events.{1}.creation_timestamp": "{time}"
    - path: "^/x-nmos/events/v1[.]0/sources/([0-9a-f-]+)/type$"
      json: { body: "$" }
      state: { "events.{1}.type": "{body}" }
    # IS-07 messages on an event Sender's websocket or MQTT broker
    # (nmos-event-transports): each state names its source.
    - json_match: { "$.message_type": "^state$", "$.identity.source_id": "^([0-9A-Za-z_-]+)$" }
      json: { event_type: "$.event_type", value: "$.payload.value", scale: "$.payload.scale", payload: "$.payload", time: "$.timing.creation_timestamp" }
      state:
        "events.{1}.event_type": "{event_type}"
        "events.{1}.value": "{value}"
        "events.{1}.scale": "{scale}"
        "events.{1}.payload": "{payload}"
        "events.{1}.creation_timestamp": "{time}"
        "events.{1}.announced": "none"
    - json_match: { "$.message_type": "^(reboot|shutdown)$", "$.identity.source_id": "^([0-9A-Za-z_-]+)$" }
      state: { "events.{2}.announced": "{1}" }
    - json_match: { "$.message_type": "^connection_status$", "$.sender_id": "^([0-9A-Za-z_-]+)$", "$.active": "^(true|false)$" }
      state: { "event_senders.{1}.broker_connected": { value: "{2}", map: { "true": true, "false": false } } }
state:
  nodes.*.label: { type: string, description: "Node: its label, free text" }
  nodes.*.description: { type: string, description: "Node: its description, free text" }
  nodes.*.version: { type: string, description: "Node: its version, the TAI time of its last change as <seconds>:<nanoseconds>" }
  nodes.*.tags: { type: string, description: "Node: its tags, as JSON text (an object of string arrays)" }
  nodes.*.resource: { type: string, description: "Node: the whole resource as the API gives it, as JSON text" }
  nodes.*.hostname: { type: string, description: "Node: the Node's host name" }
  nodes.*.href: { type: string, description: "Node: the Node's HTTP access URL (deprecated in v1.1 in favor of api.endpoints)" }
  nodes.*.api_versions: { type: string, description: "Node: the Node API versions the Node supports, as JSON text" }
  nodes.*.api_endpoints: { type: string, description: "Node: the Node API's endpoints (host, port, protocol, authorization), as JSON text" }
  nodes.*.caps: { type: string, description: "Node: the Node's capabilities, as JSON text" }
  nodes.*.services: { type: string, description: "Node: the Node's services (href, type, authorization), as JSON text" }
  nodes.*.clocks: { type: string, description: "Node: the Node's clocks (internal or PTP, with their parameters), as JSON text" }
  nodes.*.interfaces: { type: string, description: "Node: the Node's network interfaces (name, chassis_id, port_id, attached network device), as JSON text" }
  devices.*.label: { type: string, description: "Device: its label, free text" }
  devices.*.description: { type: string, description: "Device: its description, free text" }
  devices.*.version: { type: string, description: "Device: its version, the TAI time of its last change as <seconds>:<nanoseconds>" }
