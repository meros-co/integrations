spec: 1
id: sharp-display
name: Sharp professional displays (S-Format RS-232C / LAN command protocol)
vendor: Sharp
category: display

# Sharp's S-Format protocol: a four-character command and a four-character parameter, ended by CR, over
# RS-232C or TCP 10008 with a user name and password prompt. Newer models also offer the NEC-style binary
# protocol on TCP 7142 instead (their "command format" setting); that protocol is the nec-display spec's.
source:
  - title: "INTERACTIVE DISPLAY OPERATION MANUAL for S-Format command, PN-LA862, PN-LA752, PN-LA652 (2023-08, revised 2024-03)"
    author: Sharp Corporation
    url: "https://business.sharpusa.com/portals/0/downloads/Manuals/PN-LA862-LA752-LA652_S-Format_command_manual_en_Rev1.pdf"
    note: >
      The fullest current command table (pp.5-9): power, input, the picture, audio, multi/PIP, touch panel,
      administrator and function menus, model, serial number, temperature and standby cause; the
      communication procedure (p.2-3: command and parameter, CR, OK/ERR/WAIT, ???? to read, one command at a
      time, a 10 s timeout, 100 ms between commands, 1 minute after power on or off), LAN login with
      "Login:" and "Password:" prompts, BYE, auto logout after 15 minutes, up to 3 connections.
  - title: "LCD MONITOR OPERATION MANUAL for S-Format command, PN-LC862, PN-LC752, PN-LC652 (2023)"
    author: Sharp Corporation
    url: "https://business.sharpusa.com/portals/0/downloads/Manuals/PN-LC862-LC752-LC652_S-Format_command_manual.pdf"
    note: "The PN-LC table (p.4): power, input, volume, mute, size, model, serial number, reset, brightness, resolution, backlight off; the LAN procedure (p.5)."
  - title: "S-Format command operation manual, PN-HW862/752/652/552/502/432/322 (JA105, 2026-09)"
    author: Sharp Corporation
    url: "https://smj.jp.sharp/bs/lcd-display/lineup/pnhw/download_files/sharp-lcd_display_pnhw2series_command-manual_jp.pdf"
    note: >
      Japanese. The PN-HW2 table (pp.4-5): media player input, picture modes, color temperature, key and IR
      locks, pixel shift, refresh, tile matrix and bezel compensation; PC CONTROL can be allowed only once the
      factory user name and password are changed (p.6).
  - title: "Operation manual, PN-HB851/751/651, PN-HM851/751/651 (2018-10, revised 2019-06), RS-232C and LAN chapters"
    author: Sharp Corporation
    url: "https://jp.sharp/business/lcd-display/cms/images/PNHB851_HB751_HB651_HM851_HM751_HM651_Manual.pdf"
    note: >
      Japanese. RS-232C 9600/19200/38400 bps (38400 by default) and daisy chaining (p.38), replies including
      LOCKED and UNSELECTED and the ID suffix (pp.38-39), the full command table with standby availability
      (pp.42-48), LAN control (p.49).
  - title: "Operation manual, PN-R903A (2017-02, revised 2019-07), RS-232C and LAN chapters"
    author: Sharp Corporation
    url: "https://jp.sharp/business/lcd-display/cms/images/R903A_Manual.pdf"
    note: >
      Japanese. The PN-R generation's command table (pp.36-43) with PC and AV terminal settings, color
      management brightness, settings copy and six temperature sensors; the LAN data port (configurable,
      10008 by default), login and auto logout (pp.44-52).
  - title: "S-Format command manual, PN-ME982/862/752/652/552/502/432 (2025-02)"
    author: Sharp Corporation
    url: "https://smj.jp.sharp/bs/lcd-display/lineup/pnme/download_files/me_s-format_command_manual_japanese.pdf"
    note: "Japanese. The PN-ME2 table (p.4): HOME and APPLICATION 1-6 inputs, the zoom size; the LAN procedure (p.5)."
  - title: "S-Format command manual, PN-M432-M982 and PN-P436-P756 (PN-P6_M2 OM1 JP(3), 2025-07)"
    author: Sharp Corporation
    url: "https://smj.jp.sharp/bs/lcd-display/lineup/pnm/download_files/pn-pxx6-mxx2_s-format_command_manual_jp.pdf"
    note: >
      Japanese. The PN-M2/P6 table (pp.6-9): compute module input, SVE picture modes, gamma, ambient light
      and motion sensors, audio modes, time and daylight saving; S-FORMAT LOGIN AUTH on the web page (p.3);
      zero or space padding; replies with the ID over a LAN chain (p.5).

transport:
  type: line-tcp
  port: 10008
  # Command and parameter, ended by CR (CR or CR LF are taken).
  framing: terminated
  terminator: cr
  encoding: ascii
  # Replies end with CR LF. WAIT says the final reply is still to come: it is not the reply.
  reply_match: "^([^W]|W[^A]|WA[^I]|WAI[^T]|WAIT.)"
  # A reply comes within 10 s (Sharp asks for a timeout of 10 s or more).
  timeout_ms: 15000
  reply: expected
  probe: "POWR????"

settings:
  username: { type: string, max_length: 32, pattern: "^[!-~]*$", default: "", label: User name, description: "The display's user name for LAN control; empty when none is set, in which case only CR is sent." }
  password: { type: string, secret: true, max_length: 32, pattern: "^[!-~]*$", default: "", label: Password, description: "The display's password for LAN control; empty when none is set." }

# The display asks for a user name and a password on every connection, set or not, and answers OK. Sharp
# documents no answer to a wrong one.
on_connect:
  - after_prompt: "Login:"
    send: "{settings.username}"
  - after_prompt: "Password:"
    send: "{settings.password}"
    await_reply: true

ports:
  - { port: 10008, protocol: tcp, role: control, note: "the S-Format data port (configurable on the PN-R903A); an RS-232C display is reached through a serial-to-Ethernet bridge at the bridge's port" }

