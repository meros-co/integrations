        type: enum
        values: [dvi_i, dsub, dsub_component, dsub_video, hdmi1_av, hdmi1, media_player, hdmi2_av, hdmi2, displayport, hdmi3, option,
          application, usb_c, compute_module, application1, application2, application3, application4, application5, application6]
        required: true
        label: Input
        description: 'The input; each model has some of them: dsub (D-SUB or its RGB mode), hdmi1, hdmi2, hdmi3, displayport, usb_c,
          option (the expansion slot), media_player (PN-HW2), application (Android; HOME on the PN-ME2), application1 to application6
          (PN-ME2), compute_module (PN-M2/P6), and on the PN-R903A dvi_i, the D-SUB component and video modes and the HDMI AV modes.'
    send: ['INPS{value:map.sharp_input}', 'INPS????']
    expect: {matches: '^(OK|-?[0-9]+)(?: [0-9]{3})?$'}
    returns: ack
  get_input:
    summary: Read the input (INPS????)
    send: INPS????
