  updates:
  - match: '^([0-2])(?: [0-9]{3})?$'
    request_match: ^POWR
    state:
      power:
        value: '{1}'
        map: {'0': standby, '1': 'on', '2': waiting}
  - match: '^([0-9]+)(?: [0-9]{3})?$'
    request_match: ^INPS
    state:
      input:
        value: '{1}'
        map: {'1': dvi_i, '2': dsub, '3': dsub_component, '4': dsub_video, '9': hdmi1_av, '10': hdmi1, '11': media_player, '12': hdmi2_av,
          '13': hdmi2, '14': displayport, '18': hdmi3, '21': option, '24': application, '27': usb_c, '28': compute_module, '51': application1,
          '52': application2, '53': application3, '54': application4, '55': application5, '56': application6}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^BMOD
    state: {picture.mode: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^VLMP
    state: {picture.backlight: '{1}'}
  - match: '^([0-9]+)(?: [0-9]{3})?$'
    request_match: ^BADI
    state:
      picture.backlight_dimming:
        value: '{1}'
        map: {'1': true, '0': false}
  - match: '^([0-9]+)(?: [0-9]{3})?$'
    request_match: ^BOMD
    state:
      picture.backlight_on:
        value: '{1}'
        map: {'1': true, '0': false}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CONT
    state: {picture.contrast: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^BLVL
    state: {picture.black_level: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^TINT
    state: {picture.tint: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^COLR
    state: {picture.color: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^SHRP
    state: {picture.sharpness: '{1}'}
  - match: '^([0-9]+)(?: [0-9]{3})?$'
    request_match: ^WHBL
    state:
      picture.white_balance_mode:
        value: '{1}'
        map: {'0': thru, '1': preset, '2': user}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CTMP
    state: {picture.color_temperature: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CRTR
    state: {picture.red_gain: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CRTG
    state: {picture.green_gain: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CRTB
    state: {picture.blue_gain: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^OFSR
    state: {picture.red_offset: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^OFSG
    state: {picture.green_offset: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^OFSB
    state: {picture.blue_offset: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^GAMM
    state: {picture.gamma: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CMHR
    state: {picture.color_management.red.hue: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CMSR
    state: {picture.color_management.red.saturation: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CMVR
    state: {picture.color_management.red.brightness: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CMHY
    state: {picture.color_management.yellow.hue: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CMSY
    state: {picture.color_management.yellow.saturation: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CMVY
