  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CMVG
    state: {picture.color_management.green.brightness: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
    request_match: ^CMHC
    state: {picture.color_management.cyan.hue: '{1}'}
  - match: '^(-?[0-9]+)(?: [0-9]{3})?$'
