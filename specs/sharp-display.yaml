commands:
  set_power:
    summary: Turn the display on or put it in standby (POWR 1 or 0); answered WAIT, then OK once done
    params:
      'on': {type: bool, required: true, label: Power, description: On resumes from standby; off puts the display in standby.}
    send: POWR{on:map.sharp_bool_10}
    expect: {matches: '^OK(?: [0-9]{3})?$'}
    returns: ack
  get_power:
    summary: 'Read the power state (POWR????): 0 standby, 1 on, 2 waiting for a signal'
    send: POWR????
    expect: {matches: '^([0-2])(?: [0-9]{3})?$'}
    returns: value
  set_input:
    summary: Set the input (INPS) and read it back
    params:
