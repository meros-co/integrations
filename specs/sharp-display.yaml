quirks:
  - models: [all]
    severity: warning
    text: >
      LAN control must be allowed on the display first (PC CONTROL, COMMAND (LAN) or Monitor Control via
      Network, by model; the PN-HW2 allows it only once the factory user name and password are changed). The
      display asks for a user name and a password on every connection; Sharp documents no answer to a wrong
      one, so a wrong credential shows only as commands that are not answered. With power save on, LAN
      control stops in standby, so the display cannot be turned on over the network.
  - models: [all]
    severity: info
    text: >
      Only one command is answered at a time, and Sharp asks for 100 ms between a reply and the next command
      and one minute after a power or reset command before the next; the core sends the next command once a
      reply arrives. A command that takes time is answered WAIT and then OK; the WAIT is skipped.
  - models: [all]
    severity: info
    text: >
      Every set is followed by its read (????), so state follows at once; otherwise state is read every 5 s
      (power, input, backlight, volume, mute, temperature state) or every minute, as nothing is pushed. A read
      the display cannot answer in its current state (most in standby) is answered ERR.
  - models: [all]
    severity: info
    text: >
      Ranges and codes differ by family, and each parameter's description gives them: volume and backlight
      run 0 to 31 on the PN-LA, PN-HB and PN-R903A and 0 to 100 on the others, and the picture mode, gamma,
      color temperature, screen size, audio mode, language and start-up input are numbered per family. A
      value the model does not take is answered ERR.
  - models: [pn-hb, pn-r903a]
    severity: info
    text: >
      Daisy-chain addressing (IDSL, IDLK, the + repeater) is not offered: commands always go to the display
      this connection reaches. A display with an ID number set ends each reply with it, which is read past.
      RS-232C and LAN control exclude each other (set_control_select); LOCKED and UNSELECTED say control is
      prohibited or on the other path.
  - models: [pn-la]
    severity: critical
    text: >
      set_lan_command off refuses commands over LAN, including this connection, and set_rs232_command and
      set_http_server close the other paths; turning LAN control back on needs the display's menu or
      RS-232C.
  - models: [pn-la, pn-lc, pn-hb, pn-r903a, pn-me2]
    severity: critical
    text: >
      reset_all resets every setting and restarts the display; all1 also resets the LAN settings and
      credentials, so the display may not be reachable afterwards. It cannot be undone.
  - models: [pn-hb]
    severity: info
    text: >
      The FTP server settings (FCHE, FUSR, FPAS) are not offered: they write the display's FTP credentials.
  - models: [pn-r903a]
    severity: info
    text: >
      The user gamma table upload (UGRW, UGGW, UGBW and their reads), the per-input RGB ranges, auto wide,
      hot plug and DVI EDID settings, the PN-R903A's audio routing per terminal and the AV power management
      are not offered: their parameters are not given in the material read.
