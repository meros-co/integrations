  # ── Upload (sending recordings to file servers) ──────────────────────
  add_upload_server_ftp:
    summary: "Add an FTP or SFTP server to upload recordings to (send-file-add-server type=0); up to 8 servers"
    params: &ftp_params
      network: &network { type: enum, values: [ethernet, wifi, mobile], default: ethernet, label: Network, description: "Network tried first: wired Ethernet, Wi-Fi or mobile broadband." }
      protocol: &ftp_protocol { type: enum, values: [ftp, sftp], required: true, label: Protocol, description: "FTP or SFTP (SSH)." }
      url: &ftp_url { type: string, required: true, label: Server, description: "The server's address." }
      port: &ftp_port { type: int, min: 1, max: 65535, required: true, label: Port, description: "The server's port." }
      directory: &directory { type: string, default: "", label: Folder, description: "Folder on the server the files go to." }
      encryption: &ftp_encryption { type: enum, values: [plain, explicit-tls, implicit-tls], default: plain, label: Encryption, description: "FTP only: plain FTP, or FTP over TLS explicit or implicit." }
      login: &ftp_login { type: enum, values: [anonymous, normal], required: true, label: Login, description: "Anonymous, or with the user name and password given." }
      user: &ftp_user { type: string, default: "", label: User name, description: "The server account's user name, for a normal login." }
      password: &ftp_password { type: string, default: "", secret: true, label: Password, description: "The server account's password, for a normal login." }
      mode: &ftp_mode { type: enum, values: [active, passive], default: passive, label: Transfer mode, description: "Active or passive FTP transfers." }
    send: { method: GET, path: /usapi, query: { method: send-file-add-server, type: "0", net-mode: "{network:map.net_mode}", proto: "{protocol:map.ftp_proto}", url: "{url}", port: "{port}", dir-name: "{directory}", encryption: "{encryption:map.ftp_encryption}", login-type: "{login:map.ftp_login}", user-name: "{user}", passwd: "{password}", mode: "{mode:map.ftp_mode}" } }
    expect: *ok
    returns: ack
  add_upload_server_google_drive:
    summary: "Add a Google Drive account to upload recordings to, with tokens the consumer obtained (send-file-add-server type=1)"
    params:
      network: *network
      account_id: &account_id { type: string, required: true, label: Account id, description: "The account's id at the service." }
      photo_path: &photo_path { type: string, default: "", label: Avatar, description: "Path or URL of the account's picture, shown by the device's interface." }
      user: &oauth_user { type: string, required: true, label: User name, description: "The account's name, shown by the device's interface." }
      access_token: &access_token { type: string, required: true, secret: true, label: Access token, description: "OAuth access token for the account." }
      refresh_token: &refresh_token { type: string, required: true, secret: true, label: Refresh token, description: "OAuth refresh token the device renews the access token with." }
      directory: *directory
      parents: &parents { type: string, default: "", label: Parent folder, description: "Id of the Google Drive folder the target folder is in." }
    send: { method: GET, path: /usapi, query: { method: send-file-add-server, type: "1", net-mode: "{network:map.net_mode}", account-id: "{account_id}", photo-path: "{photo_path}", user-name: "{user}", access-token: "{access_token}", refresh-token: "{refresh_token}", dir-name: "{directory}", parents: "{parents}" } }
    expect: *ok
    returns: ack
  add_upload_server_dropbox:
    summary: "Add a Dropbox account to upload recordings to, with tokens the consumer obtained (send-file-add-server type=2)"
    params:
      network: *network
      account_id: *account_id
      photo_path: *photo_path
      user: *oauth_user
      access_token: *access_token
      refresh_token: *refresh_token
      directory: *directory
    send: { method: GET, path: /usapi, query: { method: send-file-add-server, type: "2", net-mode: "{network:map.net_mode}", account-id: "{account_id}", photo-path: "{photo_path}", user-name: "{user}", access-token: "{access_token}", refresh-token: "{refresh_token}", dir-name: "{directory}" } }
    expect: *ok
