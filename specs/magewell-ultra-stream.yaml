  # ── Stream servers ───────────────────────────────────────────────────
  add_stream_server_rtmp:
    summary: "Add an RTMP, Twitch, YouTube or Facebook destination, off until enabled; up to 16 servers (add-server)"
    params:
      type: &rtmp_type { type: enum, values: [rtmp, twitch, youtube, facebook], required: true, label: Service, description: "A custom RTMP server, or Twitch, YouTube or Facebook." }
      name: &server_name
        type: string
        required: true
        max_length: 32
        pattern: "^[A-Za-z0-9._+'\\[\\]()-]([A-Za-z0-9 ._+'\\[\\]()-]*[A-Za-z0-9._+'\\[\\]()-])?$"
        label: Name
        description: "1 to 32 letters, digits, spaces and ._-+'[](), not starting or ending with a space."
      url: &rtmp_url { type: string, required: true, label: Server URL, description: "The RTMP server address, such as rtmp://a.rtmp.youtube.com/live2." }
      key: &rtmp_key { type: string, default: "", secret: true, label: Stream key, description: "The stream key." }
      auth: &rtmp_auth { type: bool, default: false, label: Authentication, description: "On logs in to the server with the user name and password given." }
      user: &rtmp_user { type: string, default: "", label: User name, description: "User name, when authentication is on." }
      password: &rtmp_password { type: string, default: "", secret: true, label: Password, description: "Password, when authentication is on." }
      token: &rtmp_token { type: string, default: "", secret: true, label: Token, description: "The service's token, where it uses one." }
      event: &rtmp_event { type: string, default: "", label: Event, description: "The streaming event (event-data), where the service uses one." }
      network: *network
    send: { method: GET, path: /usapi, query: { method: add-server, type: "{type:map.rtmp_type}", name: "{name}", url: "{url}", key: "{key}", is-auth: "{auth:bool01}", user: "{user}", passwd: "{password}", token: "{token}", event-data: "{event}", net-mode: "{network:map.net_mode}" } }
    expect: *ok
    returns: ack
  add_stream_server_rtsp:
    summary: "Add an RTSP server on the device, its main and sub streams on the port given, off until enabled (add-server type=100)"
    params:
      name: *server_name
      port: &rtsp_port { type: int, min: 1, max: 65535, default: 554, label: Port, description: "RTSP port, 554 by default." }
      main: &rtsp_main { type: bool, required: true, label: Main stream, description: "On serves the main stream." }
      main_name: &rtsp_main_name
        type: string
        required: true
        max_length: 32
        pattern: "^[A-Za-z0-9._+'\\[\\]()-]([A-Za-z0-9 ._+'\\[\\]()-]*[A-Za-z0-9._+'\\[\\]()-])?$"
        label: Main stream name
        description: "The main stream's name in its RTSP URL, 1 to 32 letters, digits, spaces and ._-+'[]()."
      sub: &rtsp_sub { type: bool, required: true, label: Sub stream, description: "On serves the sub stream." }
      sub_name: &rtsp_sub_name
        type: string
        required: true
        max_length: 32
        pattern: "^[A-Za-z0-9._+'\\[\\]()-]([A-Za-z0-9 ._+'\\[\\]()-]*[A-Za-z0-9._+'\\[\\]()-])?$"
        label: Sub stream name
        description: "The sub stream's name in its RTSP URL, 1 to 32 letters, digits, spaces and ._-+'[]()."
      audio: &rtsp_audio { type: bool, required: true, label: Audio, description: "On includes the audio." }
    send: { method: GET, path: /usapi, query: { method: add-server, type: "100", name: "{name}", port: "{port}", is-main: "{main:bool01}", main-stream-name: "{main_name}", is-sub: "{sub:bool01}", sub-stream-name: "{sub_name}", is-audio: "{audio:bool01}" } }
    expect: *ok
    returns: ack
  set_stream_server_rtmp:
    summary: "Change a stream server to the RTMP, Twitch, YouTube or Facebook settings given (set-server)"
    params:
      id: &server_id { type: int, min: 0, required: true, label: Server, description: "The stream server's id, as stream_servers lists it." }
      type: *rtmp_type
      name: *server_name
      url: *rtmp_url
      key: *rtmp_key
      auth: *rtmp_auth
      user: *rtmp_user
      password: *rtmp_password
      token: *rtmp_token
      event: *rtmp_event
      network: *network
    send: { method: GET, path: /usapi, query: { method: set-server, id: "{id}", type: "{type:map.rtmp_type}", name: "{name}", url: "{url}", key: "{key}", is-auth: "{auth:bool01}", user: "{user}", passwd: "{password}", token: "{token}", event-data: "{event}", net-mode: "{network:map.net_mode}" } }
    expect: *ok
    returns: ack
  set_stream_server_rtsp:
    summary: "Change a stream server to the RTSP settings given (set-server type=100)"
    params:
      id: *server_id
      name: *server_name
      port: *rtsp_port
      main: *rtsp_main
      main_name: *rtsp_main_name
      sub: *rtsp_sub
      sub_name: *rtsp_sub_name
      audio: *rtsp_audio
    send: { method: GET, path: /usapi, query: { method: set-server, id: "{id}", type: "100", name: "{name}", port: "{port}", is-main: "{main:bool01}", main-stream-name: "{main_name}", is-sub: "{sub:bool01}", sub-stream-name: "{sub_name}", is-audio: "{audio:bool01}" } }
    expect: *ok
    returns: ack
  delete_stream_server:
    summary: "Delete a stream server (del-server)"
    params:
      id: *server_id
    send: { method: GET, path: /usapi, query: { method: del-server, id: "{id}" } }
    expect: *ok
    returns: ack
  enable_stream_server:
    summary: "Choose whether live streaming goes to a server; at most 2 at once, 1 above 4 Mbps or with RTSP (enable-server)"
    params:
      id: *server_id
      enabled: { type: bool, required: true, label: Enabled, description: "On streams to this server when live streaming starts." }
    send: { method: GET, path: /usapi, query: { method: enable-server, id: "{id}", is-use: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  start_stream_test:
    summary: "Test streaming to an RTMP, Twitch, YouTube or Facebook server for up to 20 seconds (start-test-server)"
    params:
      type: *rtmp_type
      url: *rtmp_url
      key: *rtmp_key
      auth: *rtmp_auth
      user: *rtmp_user
      password: *rtmp_password
      token: *rtmp_token
      network: *network
    send: { method: GET, path: /usapi, query: { method: start-test-server, type: "{type:map.rtmp_type}", url: "{url}", key: "{key}", is-auth: "{auth:bool01}", user: "{user}", passwd: "{password}", token: "{token}", net-mode: "{network:map.net_mode}" } }
    expect: *ok
    returns: ack
  stop_stream_test:
    summary: "Cancel the stream test (stop-test-server)"
    send: { method: GET, path: /usapi, query: { method: stop-test-server } }
    expect: *ok
    returns: ack
  clear_stream_test_status:
    summary: "Put the stream test status back to its initial state (27) after a test (clear-test-server)"
    send: { method: GET, path: /usapi, query: { method: clear-test-server } }
    expect: *ok
    returns: ack

  # ── Encoding parameters ──────────────────────────────────────────────
  set_stream_assignment:
    summary: "Which stream, main or sub, is recorded, streamed live and previewed in the app (set-stream)"
    params:
      record: { type: enum, values: [main, sub], required: true, label: Recording, description: "The stream recorded." }
      live: { type: enum, values: [main, sub], required: true, label: Live, description: "The stream sent live." }
      preview: { type: enum, values: [main, sub], required: true, label: App preview, description: "The stream the mobile app previews." }
    send: { method: GET, path: /usapi, query: { method: set-stream, rec: "{record:map.stream_kind}", live: "{live:map.stream_kind}", mws: "{preview:map.stream_kind}" } }
    expect: *ok
    returns: ack
  set_main_stream_video:
    summary: "Main stream encoding: follow the input or a set format, codec, size, frame interval, bitrate, keyframe interval, profile, bitrate window, range (set-video stream=0)"
    params:
      follow_input: { type: bool, required: true, label: Follow input, description: "On encodes at the input's own format." }
      codec: { type: enum, values: [h264, hevc], required: true, label: Codec, description: "H.264 or HEVC; live streaming is refused with HEVC." }
      width: &width { type: int, min: 1, required: true, label: Width, description: "Width in pixels, from get-info's resolutions." }
      height: &height { type: int, min: 1, required: true, label: Height, description: "Height in pixels, from get-info's resolutions." }
      frame_interval: &frame_interval { type: int, min: 1, required: true, label: Frame interval, description: "Frame interval in 100 ns units from get-info's durations, such as 333333 for 30 fps or 166667 for 60 fps." }
      kbps: &kbps { type: int, min: 1, required: true, label: Video bitrate, description: "Video bitrate in kbit/s, from get-info's video-kbps (256 to 8192 in the document)." }
      gop_seconds: &gop { type: int, min: 1, required: true, label: Keyframe interval, description: "Seconds between keyframes, from get-info's gop-sec." }
      profile: { type: int, min: 0, max: 2, required: true, label: Profile, description: "H.264: 0 Baseline, 1 Main, 2 High; HEVC: 0 Main (get-info's profile and hevc-profile)." }
      stat_seconds: &stat { type: int, min: 1, required: true, label: Bitrate window, description: "Seconds over which the constant bitrate is held, from get-info's stat-sec." }
      range: &range { type: enum, values: [limited, full], required: true, label: Range, description: "Encoded range: limited (16-235) or full (0-255)." }
    send: { method: GET, path: /usapi, query: { method: set-video, stream: "0", is-auto: "{follow_input:bool01}", cx: "{width}", cy: "{height}", duration: "{frame_interval}", kbps: "{kbps}", gop: "{gop_seconds}", fourcc: "0", profile: "{profile}", cbrstat: "{stat_seconds}", fullrange: "{range:map.full_range}", codec: "{codec:map.codec}" } }
    expect: *ok
    returns: ack
  set_sub_stream_video:
    summary: "Sub stream encoding, always H.264 at a set format: size, frame interval, bitrate, keyframe interval, profile, bitrate window, range (set-video stream=1)"
    params:
      width: *width
      height: *height
      frame_interval: *frame_interval
      kbps: *kbps
      gop_seconds: *gop
      profile: { type: int, min: 0, max: 2, required: true, label: Profile, description: "H.264 profile: 0 Baseline, 1 Main, 2 High." }
      stat_seconds: *stat
      range: *range
    send: { method: GET, path: /usapi, query: { method: set-video, stream: "1", is-auto: "0", cx: "{width}", cy: "{height}", duration: "{frame_interval}", kbps: "{kbps}", gop: "{gop_seconds}", fourcc: "0", profile: "{profile}", cbrstat: "{stat_seconds}", fullrange: "{range:map.full_range}", codec: "0" } }
    expect: *ok
    returns: ack
  set_audio_bitrate:
    summary: "Audio encoding bitrate (set-audio)"
    params:
      kbps: { type: int, min: 1, required: true, label: Audio bitrate, description: "Audio bitrate in kbit/s, from get-info's audio-kbps (16 to 128 in the document)." }
    send: { method: GET, path: /usapi, query: { method: set-audio, kbps: "{kbps}" } }
    expect: *ok
    returns: ack

  # ── Reset and reboot ─────────────────────────────────────────────────
  reboot:
    summary: "Restart the device; recording and streaming stop until it is back (reboot)"
    send: { method: GET, path: /usapi, query: { method: reboot } }
    expect: *ok
    returns: ack
  reset_all_settings:
    summary: "Put every setting back to its default and restart; the configuration is lost (reset-all-settings)"
    send: { method: GET, path: /usapi, query: { method: reset-all-settings } }
    expect: *ok
    returns: ack
  set_reset_key_enabled:
    summary: "Let holding the LIVE key for 5 seconds reset every setting, or not (set-enable-key-reset)"
    params:
      enabled: { type: bool, required: true, label: LIVE key reset, description: "On lets a 5-second press of LIVE reset all settings." }
    send: { method: GET, path: /usapi, query: { method: set-enable-key-reset, enable-key-reset: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  set_reboot_key_enabled:
    summary: "Let holding the REC key for 5 seconds reboot the device, or not (set-enable-key-reboot)"
    params:
      enabled: { type: bool, required: true, label: REC key reboot, description: "On lets a 5-second press of REC reboot the device." }
    send: { method: GET, path: /usapi, query: { method: set-enable-key-reboot, enable-key-reboot: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  logout:
    summary: "End the core's session; the next request logs in again (logout)"
    send: { method: GET, path: /usapi, query: { method: logout } }
    expect: *ok
    returns: ack

  # ── Users ────────────────────────────────────────────────────────────
  get_users:
    summary: "User accounts and whether each is the administrator or a general user (get-users)"
    send: { method: GET, path: /usapi, query: { method: get-users } }
    expect: *value
    returns: value
  add_user:
    summary: "Add a general user (add-user)"
    params:
      user: &user_id { type: string, required: true, max_length: 64, label: User name, description: "The account's user name." }
      password: { type: string, required: true, secret: true, max_length: 64, label: Password, description: "The account's password; the core sends its MD5 hash." }
    send: { method: GET, path: /usapi, query: { method: add-user, id: "{user}", pass: "{password:md5}" } }
    expect: *ok
    returns: ack
  delete_user:
    summary: "Delete a user (del-user)"
    params:
      user: *user_id
    send: { method: GET, path: /usapi, query: { method: del-user, id: "{user}" } }
    expect: *ok
    returns: ack
  change_password:
    summary: "Change the logged-in user's password; update the core's password setting afterwards (ch-password)"
    params:
      password: { type: string, required: true, secret: true, max_length: 64, label: Current password, description: "The password set now; the core sends its MD5 hash." }
      new_password: { type: string, required: true, secret: true, max_length: 64, label: New password, description: "The password to set; the core sends its MD5 hash." }
    send: { method: GET, path: /usapi, query: { method: ch-password, pass: "{password:md5}", new-pass: "{new_password:md5}" } }
    expect: *ok
    returns: ack
  set_user_password:
    summary: "Set another user's password, as the administrator (set-password)"
    params:
      user: *user_id
      password: { type: string, required: true, secret: true, max_length: 64, label: New password, description: "The password to set; the core sends its MD5 hash." }
    send: { method: GET, path: /usapi, query: { method: set-password, id: "{user}", pass: "{password:md5}" } }
    expect: *ok
    returns: ack

  # ── Network ──────────────────────────────────────────────────────────
  set_ethernet_dhcp:
    summary: "Take the wired Ethernet address from DHCP (set-net type=1 is-dhcp=1)"
    send: { method: GET, path: /usapi, query: { method: set-net, type: "1", is-dhcp: "1" } }
    expect: *ok
    returns: ack
  set_ethernet_static:
    summary: "Give wired Ethernet a fixed address (set-net type=1 is-dhcp=0)"
    params: &static_params
      ip_address: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: IP address, description: "The device's address, such as 192.168.1.20." }
      netmask: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Subnet mask, description: "The subnet mask, such as 255.255.255.0." }
      gateway: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: Gateway, description: "The default gateway's address." }
      dns: { type: string, required: true, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$", label: DNS server, description: "The DNS server's address." }
    send: { method: GET, path: /usapi, query: { method: set-net, type: "1", is-dhcp: "0", ip: "{ip_address}", mask: "{netmask}", router: "{gateway}", dns: "{dns}" } }
    expect: *ok
    returns: ack
  set_wifi_dhcp:
    summary: "Take the Wi-Fi address from DHCP (set-net type=0 is-dhcp=1)"
    send: { method: GET, path: /usapi, query: { method: set-net, type: "0", is-dhcp: "1" } }
    expect: *ok
    returns: ack
  set_wifi_static:
    summary: "Give Wi-Fi a fixed address (set-net type=0 is-dhcp=0)"
    params: *static_params
    send: { method: GET, path: /usapi, query: { method: set-net, type: "0", is-dhcp: "0", ip: "{ip_address}", mask: "{netmask}", router: "{gateway}", dns: "{dns}" } }
    expect: *ok
    returns: ack
  disconnect_wifi:
    summary: "Disconnect from the Wi-Fi network (disconn-wifi)"
    send: { method: GET, path: /usapi, query: { method: disconn-wifi } }
    expect: *ok
    returns: ack
  open_softap:
    summary: "Turn on the device's Wi-Fi access point (open-softap)"
    send: { method: GET, path: /usapi, query: { method: open-softap } }
    expect: *ok
    returns: ack
  close_softap:
    summary: "Turn off the device's Wi-Fi access point (close-softap)"
    send: { method: GET, path: /usapi, query: { method: close-softap } }
    expect: *ok
    returns: ack

  # ── Firmware ─────────────────────────────────────────────────────────
  upload_firmware:
    summary: "Upload a .mwf firmware file, ready for install_uploaded_firmware; answers its version and whether the device is up to date (upload-update-file, multipart/form-data)"
    params:
      firmware: { type: binary, required: true, label: Firmware file, description: "The .mwf firmware file's contents, given as base64 or as a host file." }
      filename: { type: string, default: firmware.mwf, max_length: 128, pattern: "^[A-Za-z0-9._ ()-]+$", label: File name, description: "The file name sent with the upload, as the vendor's demo sends the file's own name." }
    send:
      method: POST
      path: /usapi
      query: { method: upload-update-file }
      multipart:
        - { name: file, binary: firmware, filename: "{filename}", content_type: application/octet-stream }
    expect: { status: 200, code_path: "$.status", code_range: [0, 0], json_path: "$" }
    returns: value
  install_uploaded_firmware:
    summary: "Install the uploaded firmware; the device restarts (update mode=upload)"
    send: { method: GET, path: /usapi, query: { method: update, mode: upload } }
    expect: *ok
    returns: ack
  install_online_firmware:
    summary: "Download and install the newer firmware found by check_for_firmware_update; the device restarts (update mode=online)"
    send: { method: GET, path: /usapi, query: { method: update, mode: online } }
    expect: *ok
    returns: ack
  cancel_firmware_download:
    summary: "Cancel downloading the online firmware (cancel-download)"
    send: { method: GET, path: /usapi, query: { method: cancel-download } }
    expect: *ok
    returns: ack
  check_for_firmware_update:
    summary: "Ask the update server whether newer firmware exists (online-update-check)"
    send: { method: GET, path: /usapi, query: { method: online-update-check } }
    expect: *ok
    returns: ack
  clear_firmware_update_status:
    summary: "Put the update status back to its initial state (27) after a failed update (clear-upgrade)"
    send: { method: GET, path: /usapi, query: { method: clear-upgrade } }
    expect: *ok
    returns: ack
  clear_firmware_check_status:
    summary: "Put the update check status back to its initial state (27) after a failed check (clear-check-update)"
    send: { method: GET, path: /usapi, query: { method: clear-check-update } }
    expect: *ok
    returns: ack
  set_auto_update_check:
    summary: "Check for new firmware automatically, or not (set-enable-check-update)"
    params:
      enabled: { type: bool, required: true, label: Automatic check, description: "On lets the device look for new firmware by itself." }
    send: { method: GET, path: /usapi, query: { method: set-enable-check-update, is-check-update: "{enabled:bool01}" } }
    expect: *ok
    returns: ack

  # ── Cloud ────────────────────────────────────────────────────────────
  register_cloud:
    summary: "Register the device with a Magewell Cloud, in one of two slots (cloud-reg-ex, port 8070)"
    params:
      slot: &cloud_slot { type: int, min: 0, max: 1, required: true, label: Cloud slot, description: "Which of the two Cloud registrations, 0 or 1." }
      code: { type: string, required: true, pattern: "^[0-9]{4}$", label: Invitation code, description: "The 4-digit invitation code the Cloud gave." }
      address: { type: string, required: true, label: Cloud address, description: "The Cloud server's IP address." }
      http_port: { type: int, min: 1, max: 65535, default: 80, label: HTTP port, description: "The Cloud server's HTTP port." }
      https: { type: bool, default: false, label: HTTPS, description: "On reaches the Cloud over HTTPS." }
      https_port: { type: int, min: 1, max: 65535, default: 443, label: HTTPS port, description: "The Cloud server's HTTPS port." }
    send: { endpoint: cloud, method: GET, path: /cloud-api, query: { method: cloud-reg-ex, id: "{slot}", cloud-code: "{code}", cloud-ip-addr: "{address}", cloud-http-port: "{http_port}", cloud-enable-https: "{https:bool01}", cloud-https-port: "{https_port}" } }
    expect: *ok
    returns: ack
  unregister_cloud:
    summary: "Remove the device from a Magewell Cloud (cloud-unreg-ex, port 8070)"
    params:
      slot: *cloud_slot
    send: { endpoint: cloud, method: GET, path: /cloud-api, query: { method: cloud-unreg-ex, id: "{slot}" } }
    expect: *ok
    returns: ack
  get_cloud_status:
    summary: "Both Cloud registrations: address, ports, registration and connection status (cloud-status, port 8070)"
    send: { endpoint: cloud, method: GET, path: /cloud-api, query: { method: cloud-status, version: "1" } }
    expect: *value
    returns: value

  # ── EDID (HDMI input) ────────────────────────────────────────────────
  get_edid_config:
    summary: "The input EDID and its options: smart EDID, keep the last loop-through EDID, force audio, limit the pixel clock (get-edid-config)"
    send: { models: [ultra-stream-hdmi], method: GET, path: /usapi, query: { method: get-edid-config } }
    expect: *value
    returns: value
  set_edid_config:
    summary: "Input EDID options (set-edid-config)"
    params:
      smart_edid: { type: bool, required: true, label: Smart EDID, description: "On builds the input EDID from the display on the loop-through." }
      keep_last: { type: bool, required: true, label: Keep last EDID, description: "On keeps using the last loop-through display's EDID once it is unplugged." }
      add_audio: { type: bool, required: true, label: Force audio, description: "On adds audio support to the EDID." }
      limit_pixel_clock: { type: bool, required: true, label: Limit pixel clock, description: "On limits the pixel clock the EDID offers." }
    send: { models: [ultra-stream-hdmi], method: GET, path: /usapi, query: { method: set-edid-config, smart-edid: "{smart_edid:bool01}", keep-last: "{keep_last:bool01}", add-audio: "{add_audio:bool01}", limit-pixel-clock: "{limit_pixel_clock:bool01}" } }
    expect: *ok
    returns: ack
  reset_edid:
    summary: "Put the input EDID back to the default (set-default-edid)"
    send: { models: [ultra-stream-hdmi], method: GET, path: /usapi, query: { method: set-default-edid } }
    expect: *ok
    returns: ack
  import_edid:
    summary: "Load an EDID file into the input (import-edid, multipart/form-data)"
    params:
      edid: { type: binary, required: true, label: EDID file, description: "The EDID's bytes, given as base64 or as a host file." }
      filename: { type: string, default: edid.bin, max_length: 128, pattern: "^[A-Za-z0-9._ ()-]+$", label: File name, description: "The file name sent with the upload." }
    send:
      models: [ultra-stream-hdmi]
      method: POST
      path: /usapi
      query: { method: import-edid }
      multipart:
        - { name: file, binary: edid, filename: "{filename}", content_type: application/octet-stream }
    expect: *ok
    returns: ack
  get_loop_through_edid:
    summary: "The EDID of the display on the loop-through output (get-loop-through-edid)"
    send: { models: [ultra-stream-hdmi], method: GET, path: /usapi, query: { method: get-loop-through-edid } }
    expect: *value
    returns: value

state:
  # get-status (and ping): the running status mask (Device Status Mask).
  status.mask:              { type: int, description: "The device status mask (cur-status), the sum of the flags below" }
  status.first_boot:        { type: bool, description: "First boot: complete_first_setup has not been run (0x01)" }
  status.recording:         { type: bool, description: "Recording (0x02)" }
  status.live:              { type: bool, description: "Live streaming (0x04)" }
  status.usb_ready:         { type: bool, description: "The USB drive is ready to record (0x10)" }
  status.rtmp_ready:        { type: bool, description: "Ready to stream live (0x20)" }
  status.softap:            { type: bool, description: "The Wi-Fi access point is on (0x40); network.wifi then describes it" }
  status.usb_testing:       { type: bool, description: "The USB speed test is running (0x1000)" }
  status.upgrading:         { type: bool, description: "A firmware update is in progress (0x4000)" }
  status.stream_testing:    { type: bool, description: "A stream test is running (0x8000)" }
  status.password_set:      { type: bool, description: "The app pairing password is set (0x10000)" }
  status.app_locked:        { type: bool, description: "Locked by the mobile app, at most two at once (0x20000)" }
  status.formatting_usb:    { type: bool, description: "The USB drive is being formatted (0x100000)" }
  status.formatting_sd:     { type: bool, description: "The SD card is being formatted (0x200000)" }
  status.wifi_searching:    { type: bool, description: "Searching for Wi-Fi networks (0x400000)" }
  status.wifi_connecting:   { type: bool, description: "Connecting to a Wi-Fi network (0x800000)" }
  status.checking_update:   { type: bool, description: "Checking for new firmware (0x2000000)" }
  status.resetting:         { type: bool, description: "Resetting all settings (0x4000000)" }
  status.rebooting:         { type: bool, description: "Rebooting (0x20000000)" }
  status.upload_testing:    { type: bool, description: "An upload server test is running (0x40000000)" }
  status.last_recording_result: { type: int, description: "last-rec-status: the last recording's result, an API status code" }
