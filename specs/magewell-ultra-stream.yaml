    send: { method: GET, path: /usapi, query: { method: send-file-start-test-server, type: "0", net-mode: "{network:map.net_mode}", proto: "{protocol:map.ftp_proto}", url: "{url}", port: "{port}", dir-name: "{directory}", encryption: "{encryption:map.ftp_encryption}", login-type: "{login:map.ftp_login}", user-name: "{user}", passwd: "{password}", mode: "{mode:map.ftp_mode}" } }
