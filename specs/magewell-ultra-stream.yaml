      access_token: *access_token
      refresh_token: *refresh_token
      directory: *directory
    send: { method: GET, path: /usapi, query: { method: send-file-set-server, id: "{id}", type: "2", net-mode: "{network:map.net_mode}", account-id: "{account_id}", photo-path: "{photo_path}", user-name: "{user}", access-token: "{access_token}", refresh-token: "{refresh_token}", dir-name: "{directory}" } }
    expect: *ok
    returns: ack
  set_upload_server_youtube:
    summary: "Change an upload server to the YouTube account given (send-file-set-server type=3)"
    params:
      id: *upload_id
      network: *network
      account_id: *account_id
      photo_path: *photo_path
