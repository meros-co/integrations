spec: 1
id: magewell-ultra-stream
name: Magewell Ultra Stream
vendor: Magewell
category: recorder

source:
  - title: "Magewell Ultra Stream API (unversioned; methods marked as added up to V1.5; PDF built 2024-08-13)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/ultra-stream-api/"
    note: >
      Manufacturer-documented, public; the same content as the PDF at
      /api-docs/ultra-stream-api/ultra-stream-api-en_US.pdf (generated
      2024-08-13). Retrieved 2026-10-23. Overview: the products (Ultra Stream
      HDMI and SDI), the API agreement (GET http://IP/usapi?method=..., JSON
      replies with an integer result, POST for file uploads, the sid
      cookie), the API status codes, the Cloud API status codes, the device
      status mask, the storage device status codes, the API limits table,
      the device discovery protocol (multicast 239.255.255.250:2538, SSDP)
      and the Bluetooth protocol. Universal interfaces: get-info, get-status
      (with sysstat, input-signal, rec-status, live-status, living-test,
      check-upgrade, upgrade, upgrade-status, send-file, send-file-test, usb,
      sd, disk-test, format-status, wifi, eth, mobile), get-settings,
      start-rec, stop-rec, start-live, stop-live, ping, get-signal-info,
      clear-rec, clear-live, get-report, export-report. General settings:
      set-name, set-app-settings, set-app-passwd, set-first-over,
      set-rec-control, set-softap, set-date-time (and its time zone list),
      set-signal-lost-ctrl, set-ssdp, set-auto-rec, set-volume,
      set-video-color, set-low-latency-live, set-auto-live,
      set-video-input-format, set-video-output-format, set-sync-offset,
      add-, del-, set- and use-nosignal-file. Storage device: start-, clear-
      format-usb and -sd, start-, stop-, clear-test-usb, get-media-files,
      del-media-files. Upload: send-file-add-, -del-, -enable-, -set-server,
      send-file-start- and -stop-test-server, clear-test-send-file,
      send-file-add, -del, -clear, -get-status, -set-is-auto, -start, -stop.
      Stream server: add-, enable-, set-, del-server, start-, stop-,
      clear-test-server. Encoding parameters: set-stream, set-video,
      set-audio. Reset and reboot: reboot, reset-all-settings,
      set-enable-key-reset, set-enable-key-reboot. Log in and out: login (id
      and the MD5 of the password, the sid cookie), logout. User management:
      get-users, add-user, del-user, ch-password, set-password. Network:
      set-net, disconn-wifi, open-softap, close-softap. Firmware update:
      update, upload-update-file, cancel-download, online-update-check,
      clear-upgrade, clear-check-update, set-enable-check-update. EDID:
      import-edid, export-edid, set-default-edid, get-edid-config,
      set-edid-config, get-loop-through-edid, export-loop-through-edid.
      Cloud: cloud-reg-ex, cloud-unreg-ex, cloud-status (on port 8070,
      /cloud-api).
  - title: "Ultra Stream API demos for Node.js and C (ultra-stream-api-demo-nodejs.zip, ultra-stream-api-demo-c.zip, 2019)"
    author: Magewell
    url: "https://www.magewell.com/api-docs/demo/ultra-stream-api-demo-nodejs.zip"
    note: >
      Manufacturer's sample code linked from the API's DEMO pages (the C demo
      at /api-docs/demo/ultra-stream-api-demo-c.zip), read for the wire
      format only: the login request with user Admin and the MD5 of Admin,
      every Set-Cookie of its answer sent back as Cookie, and the firmware
      upload as a multipart/form-data POST with one part named file, carrying
      the file name and Content-Type application/octet-stream.

settings:
  username:
    type: string
    default: Admin
    max_length: 64
    label: User name
    description: "The user the core logs in as; Admin in the vendor's demos."
  password:
    type: string
    secret: true
    default: Admin
    max_length: 64
    label: Password
    description: "That user's password; the core sends only its MD5 hash, as the login method requires."

ports:
  - { port: 80, protocol: http, role: control, note: "the API's URLs give no port (http://ip/usapi), so the HTTP default" }
  - { port: 8070, protocol: http, role: control, note: "the Cloud API (http://ip:8070/cloud-api)" }

# GET http://IP/usapi?method=<name>&<args>, JSON replies whose result is 0
# for success (API Agreement, API Status Codes). Uploads are POSTs.
transport:
  type: http
  port: 80
  scheme: http
  timeout_ms: 5000
  # ping needs no login (common: ping).
  probe: { method: GET, path: /usapi, query: { method: ping } }
  # The Cloud API answers on its own port (cloud-reg-ex, cloud-status).
  endpoints:
    cloud:
      port: 8070
      auth: none
  # login: id and the MD5 of the password; the session ID comes back in a
  # cookie (sid) that every later request carries (API Agreement).
  session:
    login: { method: GET, path: /usapi, query: { method: login, id: "{settings.username}", pass: "{settings.password:md5}" } }
    capture: { cookie: "*" }
    # -17 errNeedAuth: "An authentication is required" (the session ended).
    relogin: { status: [401], json: { "$.result": "^-17$" } }
    # 36: user name or password incorrect (login page); -1 errPasswd; -25
    # errNoUser.
    refused: { status: [401, 403], json: { "$.result": "^(36|-1|-25)$" } }

# API Status Codes. 0 is success; positive values are states (1 a repeated
# request, 2 still running, 27 initial). The errors are negative, which the
# code table cannot list: they are reported as their raw code (see quirks).
codes:
  "1": repeated request
  "2": the request is running
  "3": the storage device is too slow to record smooth video
  "4": not enough free space on the storage device
  "5": request canceled
  "27": initial status
  "36": user name or password incorrect

maps:
  stream_kind: { main: "0", sub: "1" }
  codec: { h264: "0", hevc: "1" }
  full_range: { limited: "0", full: "1" }
  rtmp_type: { rtmp: "0", twitch: "1", youtube: "2", facebook: "3" }
  net_mode: { mobile: "0", ethernet: "1", wifi: "2" }
  ftp_proto: { ftp: "0", sftp: "1" }
  ftp_encryption: { plain: "0", explicit-tls: "1", implicit-tls: "2" }
  ftp_login: { anonymous: "0", normal: "1" }
  ftp_mode: { active: "0", passive: "1" }
  disk: { usb: "0", sd: "1" }
  usb_option: { "off": "0", normal: "1" }
  sd_option: { "off": "0", normal: "1", loop: "2" }
  file_type: { mp4: "0", mov: "1" }
  file_name_mode: { custom: "0", time: "1" }
  input_color: { rgb: "1", bt601: "2", bt709: "3", bt2020: "4" }
  output_color: { bt601: "2", bt709: "3" }
  quant_range: { full: "1", limited: "2" }
  sat_range: { full: "1", limited: "2", extended: "3" }

models:
  - id: ultra-stream-hdmi
    name: "Magewell Ultra Stream HDMI"
    supports: &common
      [ping, get_info, get_status, get_settings, get_signal_info, get_report, start_recording, stop_recording,
       start_live, stop_live, clear_recording_status, clear_live_status,
       set_device_name, set_app_settings_allowed, enable_app_password, disable_app_password, change_app_password,
       complete_first_setup, complete_first_setup_with_password, set_recording_options, set_softap,
       set_date_time, set_stop_on_signal_loss, set_ssdp, set_auto_record, set_volume, set_video_color,
       set_low_latency_live, set_live_lock, set_video_input_format, set_video_output_format,
       set_audio_sync_offset, add_no_signal_image, delete_no_signal_image, select_no_signal_image,
       set_no_signal_image_enabled,
       start_usb_format, start_sd_format, clear_usb_format_status, clear_sd_format_status, start_usb_test,
       stop_usb_test, clear_usb_test_status, get_media_files, delete_media_files,
       add_upload_server_ftp, add_upload_server_google_drive, add_upload_server_dropbox,
       add_upload_server_youtube, set_upload_server_ftp, set_upload_server_google_drive,
       set_upload_server_dropbox, set_upload_server_youtube, delete_upload_server, enable_upload_server,
       start_upload_server_test, stop_upload_server_test, clear_upload_test_status, add_upload_files,
       remove_upload_files, clear_upload_list, get_upload_status, set_auto_upload, start_upload, stop_upload,
       add_stream_server_rtmp, add_stream_server_rtsp, set_stream_server_rtmp, set_stream_server_rtsp,
       delete_stream_server, enable_stream_server, start_stream_test, stop_stream_test,
       clear_stream_test_status,
       set_stream_assignment, set_main_stream_video, set_sub_stream_video, set_audio_bitrate,
       reboot, reset_all_settings, set_reset_key_enabled, set_reboot_key_enabled, logout,
       get_users, add_user, delete_user, change_password, set_user_password,
       set_ethernet_dhcp, set_ethernet_static, set_wifi_dhcp, set_wifi_static, disconnect_wifi, open_softap,
       close_softap,
       upload_firmware, install_uploaded_firmware, install_online_firmware, cancel_firmware_download,
       check_for_firmware_update, clear_firmware_update_status, clear_firmware_check_status,
       set_auto_update_check,
       register_cloud, unregister_cloud, get_cloud_status,
       get_edid_config, set_edid_config, reset_edid, import_edid, get_loop_through_edid]
    verification: none
    notes: "HDMI input with HDMI loop-through; EDID methods apply to its HDMI input."
  - id: ultra-stream-sdi
    name: "Magewell Ultra Stream SDI"
    supports:
      [ping, get_info, get_status, get_settings, get_signal_info, get_report, start_recording, stop_recording,
       start_live, stop_live, clear_recording_status, clear_live_status,
       set_device_name, set_app_settings_allowed, enable_app_password, disable_app_password, change_app_password,
       complete_first_setup, complete_first_setup_with_password, set_recording_options, set_softap,
       set_date_time, set_stop_on_signal_loss, set_ssdp, set_auto_record, set_volume, set_video_color,
       set_low_latency_live, set_live_lock, set_video_input_format, set_video_output_format,
       set_audio_sync_offset, add_no_signal_image, delete_no_signal_image, select_no_signal_image,
       set_no_signal_image_enabled,
       start_usb_format, start_sd_format, clear_usb_format_status, clear_sd_format_status, start_usb_test,
       stop_usb_test, clear_usb_test_status, get_media_files, delete_media_files,
       add_upload_server_ftp, add_upload_server_google_drive, add_upload_server_dropbox,
       add_upload_server_youtube, set_upload_server_ftp, set_upload_server_google_drive,
       set_upload_server_dropbox, set_upload_server_youtube, delete_upload_server, enable_upload_server,
       start_upload_server_test, stop_upload_server_test, clear_upload_test_status, add_upload_files,
       remove_upload_files, clear_upload_list, get_upload_status, set_auto_upload, start_upload, stop_upload,
       add_stream_server_rtmp, add_stream_server_rtsp, set_stream_server_rtmp, set_stream_server_rtsp,
       delete_stream_server, enable_stream_server, start_stream_test, stop_stream_test,
       clear_stream_test_status,
       set_stream_assignment, set_main_stream_video, set_sub_stream_video, set_audio_bitrate,
       reboot, reset_all_settings, set_reset_key_enabled, set_reboot_key_enabled, logout,
       get_users, add_user, delete_user, change_password, set_user_password,
       set_ethernet_dhcp, set_ethernet_static, set_wifi_dhcp, set_wifi_static, disconnect_wifi, open_softap,
       close_softap,
       upload_firmware, install_uploaded_firmware, install_online_firmware, cancel_firmware_download,
       check_for_firmware_update, clear_firmware_update_status, clear_firmware_check_status,
       set_auto_update_check,
       register_cloud, unregister_cloud, get_cloud_status]
    verification: none
    notes: "SDI input; the EDID methods, which describe an HDMI input, are left out."

commands:
  # ── Universal interfaces ─────────────────────────────────────────────
  ping:
    summary: "Check the device is ready, with its status mask; needs no login (ping)"
    send: { method: GET, path: /usapi, query: { method: ping }, session: false }
    expect: &ok { status: 200, code_path: "$.result", code_range: [0, 0] }
    returns: ack
  get_info:
    summary: "Product and firmware information, MAC addresses and the ranges of every encoding, audio, color, recording and upload setting (get-info)"
    send: { method: GET, path: /usapi, query: { method: get-info } }
    expect: &value { status: 200, code_path: "$.result", code_range: [0, 0], json_path: "$" }
    returns: value
  get_status:
    summary: "Running status: status mask, recording, live streaming, tests, firmware update, uploads, input signal, USB, SD card, networks and system load (get-status)"
    send: { method: GET, path: /usapi, query: { method: get-status } }
    expect: *value
    returns: value
  get_settings:
    summary: "Every setting: name, switches, encoding, audio, color, recording, networks, streaming and upload servers, no-signal images (get-settings)"
    send: { method: GET, path: /usapi, query: { method: get-settings } }
    expect: *value
    returns: value
  get_signal_info:
    summary: "Information on the input audio and video signals (get-signal-info)"
    send: { method: GET, path: /usapi, query: { method: get-signal-info } }
    expect: *value
    returns: value
  get_report:
    summary: "The device report as HTML: device information, status and settings (get-report)"
    send: { method: GET, path: /usapi, query: { method: get-report } }
    expect: { status: 200 }
    returns: text
  start_recording:
    summary: "Start recording (start-rec)"
    send: { method: GET, path: /usapi, query: { method: start-rec } }
    expect: *ok
    returns: ack
  stop_recording:
    summary: "Stop recording (stop-rec)"
    send: { method: GET, path: /usapi, query: { method: stop-rec } }
    expect: *ok
    returns: ack
  start_live:
    summary: "Start live streaming to the enabled servers (start-live)"
    send: { method: GET, path: /usapi, query: { method: start-live } }
    expect: *ok
    returns: ack
  stop_live:
    summary: "Stop live streaming (stop-live)"
    send: { method: GET, path: /usapi, query: { method: stop-live } }
    expect: *ok
    returns: ack
  clear_recording_status:
    summary: "Put the recording status back to its initial state (27) after a recording ended or failed (clear-rec)"
    send: { method: GET, path: /usapi, query: { method: clear-rec } }
    expect: *ok
    returns: ack
  clear_live_status:
    summary: "Put the live streaming status back to its initial state (27) after a stream ended or failed (clear-live)"
    send: { method: GET, path: /usapi, query: { method: clear-live } }
    expect: *ok
    returns: ack

  # ── General settings ─────────────────────────────────────────────────
  set_device_name:
    summary: "Set the device name (set-name)"
    params:
      name: &device_name
        type: string
        required: true
        max_length: 32
        pattern: "^[A-Za-z0-9._+'\\[\\]()-]([A-Za-z0-9 ._+'\\[\\]()-]*[A-Za-z0-9._+'\\[\\]()-])?$"
        label: Device name
        description: "1 to 32 letters, digits, spaces and ._-+'[](), not starting or ending with a space."
    send: { method: GET, path: /usapi, query: { method: set-name, name: "{name}" } }
    expect: *ok
    returns: ack
  set_app_settings_allowed:
    summary: "Allow or forbid changing settings from the mobile app (set-app-settings)"
    params:
      allowed: { type: bool, required: true, label: App may change settings, description: "On lets users change the device's settings from the mobile app." }
    send: { method: GET, path: /usapi, query: { method: set-app-settings, is-settings: "{allowed:bool01}" } }
    expect: *ok
    returns: ack
  enable_app_password:
    summary: "Turn on the password that pairs the mobile app with the device (set-app-passwd is-pass=1)"
    params:
      new_password: { type: string, required: true, secret: true, max_length: 64, label: Pairing password, description: "The new pairing password; the core sends its MD5 hash." }
    send: { method: GET, path: /usapi, query: { method: set-app-passwd, is-pass: "1", new-pass: "{new_password:md5}" } }
    expect: *ok
    returns: ack
  disable_app_password:
    summary: "Turn off the app pairing password; the current one is required (set-app-passwd is-pass=0)"
    params:
      password: { type: string, required: true, secret: true, max_length: 64, label: Current pairing password, description: "The pairing password set now; the core sends its MD5 hash." }
    send: { method: GET, path: /usapi, query: { method: set-app-passwd, is-pass: "0", pass: "{password:md5}" } }
    expect: *ok
    returns: ack
  change_app_password:
    summary: "Change the app pairing password; the current one is required (set-app-passwd is-pass=1 with pass)"
    params:
      password: { type: string, required: true, secret: true, max_length: 64, label: Current pairing password, description: "The pairing password set now; the core sends its MD5 hash." }
      new_password: { type: string, required: true, secret: true, max_length: 64, label: New pairing password, description: "The pairing password to set; the core sends its MD5 hash." }
    send: { method: GET, path: /usapi, query: { method: set-app-passwd, is-pass: "1", pass: "{password:md5}", new-pass: "{new_password:md5}" } }
    expect: *ok
    returns: ack
  complete_first_setup:
    summary: "Finish the first-run setup with a device name, no pairing password, and the date and time (set-first-over enable-passwd=0)"
    params:
      name: *device_name
      timezone: &timezone { type: string, required: true, max_length: 64, pattern: "^[A-Za-z0-9_+/-]+$", label: Time zone, description: "IANA time zone name from the API's list, such as Europe/London or UTC." }
      auto_time: &auto_time { type: bool, required: true, label: Automatic time, description: "On takes the time from the network for the time zone; off sets the time given." }
      time: &time { type: string, default: "", pattern: "^(|[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2})$", label: Time, description: "Local time as YYYY-MM-DD HH:MM:SS when automatic time is off; empty when it is on." }
    send: { method: GET, path: /usapi, query: { method: set-first-over, name: "{name}", enable-passwd: "0", timezone: "{timezone}", is-auto: "{auto_time:bool01}", time: "{time}" } }
    expect: *ok
    returns: ack
  complete_first_setup_with_password:
    summary: "Finish the first-run setup with a device name, a pairing password, and the date and time (set-first-over enable-passwd=1)"
    params:
      name: *device_name
      password: { type: string, required: true, secret: true, max_length: 64, label: Pairing password, description: "The app pairing password to set; the core sends its MD5 hash." }
      timezone: *timezone
      auto_time: *auto_time
      time: *time
    send: { method: GET, path: /usapi, query: { method: set-first-over, name: "{name}", enable-passwd: "1", passwd: "{password:md5}", timezone: "{timezone}", is-auto: "{auto_time:bool01}", time: "{time}" } }
    expect: *ok
    returns: ack
  set_recording_options:
    summary: "Recording targets and files: USB and SD recording, file type, folder, file naming and file length (set-rec-control)"
    params:
      usb: { type: enum, values: ["off", normal], required: true, label: USB recording, description: "Record to the USB drive (normal) or not (off)." }
      sd: { type: enum, values: ["off", normal, loop], required: true, label: SD recording, description: "Record to the SD card normally, in a loop that overwrites the oldest files, or not." }
      file_type: { type: enum, values: [mp4, mov], required: true, label: File type, description: "Container of the recorded files." }
      folder:
        type: string
        required: true
        max_length: 255
        pattern: "^[A-Za-z0-9._+'\\[\\]()-]([A-Za-z0-9 ._+'/\\[\\]()-]*[A-Za-z0-9._+'\\[\\]()-])?$"
        label: Folder
        description: "Folder the files are written to, REC_Folder by default; at most two levels separated by /, such as a/b."
      file_name_mode: { type: enum, values: [custom, time], required: true, label: File naming, description: "Name files with the custom prefix (vid by default) or after the time each was created." }
      file_minutes: { type: int, min: 1, required: true, label: File length, description: "Minutes per recorded file, from get-info's list (5 to 120); minutes times the recording bitrate may not exceed 4 GB." }
    send: { method: GET, path: /usapi, query: { method: set-rec-control, usb-option: "{usb:map.usb_option}", sd-option: "{sd:map.sd_option}", mime-type: "{file_type:map.file_type}", root-folder: "{folder}", file-name-mode: "{file_name_mode:map.file_name_mode}", time-unit: "{file_minutes}" } }
    expect: *ok
    returns: ack
  set_softap:
    summary: "Wi-Fi access point settings: its password, and the fields the document marks reserved (set-softap)"
    params:
      enabled: { type: bool, default: true, label: Access point, description: "Documented as reserved, default on." }
      visible: { type: bool, default: true, label: SSID visible, description: "Documented as reserved, default on: whether the network name is broadcast." }
      ssid: { type: string, required: true, max_length: 32, label: Network name, description: "Documented as reserved; the default is the serial number, which device.serial holds." }
      password: { type: string, required: true, secret: true, max_length: 32, pattern: "^[A-Za-z0-9._+'\\[\\]()-]([A-Za-z0-9 ._+'\\[\\]()-]*[A-Za-z0-9._+'\\[\\]()-])?$", label: Access point password, description: "1 to 32 letters, digits, spaces and ._-+'[](), not starting or ending with a space; sent as plain text." }
    send: { method: GET, path: /usapi, query: { method: set-softap, is-softap: "{enabled:bool01}", is-visible: "{visible:bool01}", softap-ssid: "{ssid}", softap-passwd: "{password}" } }
    expect: *ok
    returns: ack
  set_date_time:
    summary: "Time zone, and automatic time or the time given (set-date-time)"
    params:
      timezone: *timezone
      auto_time: *auto_time
      time: *time
    send: { method: GET, path: /usapi, query: { method: set-date-time, timezone: "{timezone}", is-auto: "{auto_time:bool01}", time: "{time}" } }
    expect: *ok
    returns: ack
  set_stop_on_signal_loss:
    summary: "Stop recording and streaming when the input signal is lost, or keep going (set-signal-lost-ctrl)"
    params:
      enabled: { type: bool, required: true, label: Stop on signal loss, description: "On stops recording and live streaming when the input signal is lost." }
    send: { method: GET, path: /usapi, query: { method: set-signal-lost-ctrl, is-signal-lost: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  set_ssdp:
    summary: "Turn UPnP (SSDP) discovery on or off (set-ssdp)"
    params:
      enabled: { type: bool, required: true, label: UPnP, description: "On answers UPnP (SSDP) discovery." }
    send: { method: GET, path: /usapi, query: { method: set-ssdp, is-ssdp: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  set_auto_record:
    summary: "Record automatically while an input signal is locked, stopping when it is lost (set-auto-rec)"
    params:
      enabled: { type: bool, required: true, label: Auto record, description: "On starts recording when a signal locks and stops when it is lost." }
    send: { method: GET, path: /usapi, query: { method: set-auto-rec, is-auto-rec: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  set_volume:
    summary: "Gain and mute of the microphone, the input audio and the headphones (set-volume)"
    params:
      mic_enabled: { type: bool, required: true, label: Microphone on, description: "Off mutes the microphone." }
      mic_gain: { type: float, min: -12.0, max: 55.25, required: true, label: Microphone gain, description: "Microphone gain in dB; get-info's audio-range.mic gives the device's range (-12 to 55.25 in the document)." }
      input_enabled: { type: bool, required: true, label: Input audio on, description: "Off mutes the embedded input audio." }
      input_gain: { type: float, min: -100.0, max: 6.0, required: true, label: Input gain, description: "Input audio gain in dB; get-info's audio-range.hdmi gives the device's range (-100 to 6 in the document)." }
      headphone_enabled: { type: bool, required: true, label: Headphones on, description: "Off mutes the headphone output." }
      headphone_gain: { type: float, min: -57.0, max: 6.0, required: true, label: Headphone gain, description: "Headphone gain in dB; get-info's audio-range.phone gives the device's range (-57 to 6 in the document)." }
    send: { method: GET, path: /usapi, query: { method: set-volume, is-mic: "{mic_enabled:bool01}", mic-gain: "{mic_gain:.2f}", is-spi: "{input_enabled:bool01}", spi-gain: "{input_gain:.2f}", is-phone: "{headphone_enabled:bool01}", phone-gain: "{headphone_gain:.2f}" } }
    expect: *ok
    returns: ack
  set_video_color:
    summary: "Picture contrast, brightness, saturation and hue (set-video-color)"
    params:
      contrast: { type: int, min: 50, max: 200, required: true, label: Contrast, description: "Contrast from 50 to 200, 100 unchanged." }
      brightness: { type: int, min: -100, max: 100, required: true, label: Brightness, description: "Brightness from -100 to 100, 0 unchanged." }
      saturation: { type: int, min: 0, max: 200, required: true, label: Saturation, description: "Saturation from 0 to 200, 100 unchanged." }
      hue: { type: int, min: -90, max: 90, required: true, label: Hue, description: "Hue shift from -90 to 90, 0 unchanged." }
    send: { method: GET, path: /usapi, query: { method: set-video-color, contrast: "{contrast}", brightness: "{brightness}", saturation: "{saturation}", hue: "{hue}" } }
    expect: *ok
    returns: ack
  set_low_latency_live:
    summary: "Low-latency live streaming on or off (set-low-latency-live)"
    params:
      enabled: { type: bool, required: true, label: Low latency, description: "On streams with low latency." }
    send: { method: GET, path: /usapi, query: { method: set-low-latency-live, is-low-latency: "{enabled:bool01}" } }
    expect: *ok
    returns: ack
  set_live_lock:
    summary: "Lock live streaming on: it starts by itself once a server is set and the network allows, and cannot be stopped until unlocked (set-auto-live)"
    params:
      locked: { type: bool, required: true, label: Live locked, description: "On starts live streaming automatically and refuses stop_live until it is turned off." }
    send: { method: GET, path: /usapi, query: { method: set-auto-live, is-auto-live: "{locked:bool01}" } }
    expect: *ok
    returns: ack
  set_video_input_format:
    summary: "Input color space and quantization, automatic or set by hand (set-video-input-format)"
    params:
      custom_color_space: { type: bool, required: true, label: Set color space, description: "Off detects the input's color space; on uses the one given." }
      color_space: { type: enum, values: [rgb, bt601, bt709, bt2020], required: true, label: Color space, description: "RGB or YUV BT.601, BT.709 or BT.2020, used when set by hand." }
      custom_quant_range: { type: bool, required: true, label: Set quantization, description: "Off detects the input's quantization range; on uses the one given." }
      quant_range: { type: enum, values: [full, limited], required: true, label: Quantization, description: "Full (0-255) or limited (16-235) range, used when set by hand." }
    send: { method: GET, path: /usapi, query: { method: set-video-input-format, is-color-fmt: "{custom_color_space:bool01}", color-fmt: "{color_space:map.input_color}", is-quant-range: "{custom_quant_range:bool01}", quant-range: "{quant_range:map.quant_range}" } }
    expect: *ok
    returns: ack
  set_video_output_format:
    summary: "Output color space, quantization and saturation range, automatic or set by hand (set-video-output-format)"
    params:
      custom_color_space: { type: bool, required: true, label: Set color space, description: "Off chooses the output color space automatically; on uses the one given." }
      color_space: { type: enum, values: [bt601, bt709], required: true, label: Color space, description: "YUV BT.601 or BT.709, used when set by hand." }
      custom_quant_range: { type: bool, required: true, label: Set quantization, description: "Off chooses the quantization range automatically; on uses the one given." }
      quant_range: { type: enum, values: [full, limited], required: true, label: Quantization, description: "Full (0-255) or limited (16-235) range, used when set by hand." }
      custom_sat_range: { type: bool, required: true, label: Set saturation range, description: "Off chooses the saturation range automatically; on uses the one given." }
      sat_range: { type: enum, values: [full, limited, extended], required: true, label: Saturation range, description: "Full (0-255), limited (16-235) or extended gamut (1-254), used when set by hand." }
    send: { method: GET, path: /usapi, query: { method: set-video-output-format, is-color-fmt: "{custom_color_space:bool01}", color-fmt: "{color_space:map.output_color}", is-quant-range: "{custom_quant_range:bool01}", quant-range: "{quant_range:map.quant_range}", is-sat-range: "{custom_sat_range:bool01}", sat-range: "{sat_range:map.sat_range}" } }
    expect: *ok
    returns: ack
  set_audio_sync_offset:
    summary: "Audio delay against the video, -200 to 200 ms (set-sync-offset)"
    params:
      ms: { type: int, min: -200, max: 200, required: true, label: Audio offset, description: "Milliseconds: negative when the audio lags, positive when it is ahead." }
    send: { method: GET, path: /usapi, query: { method: set-sync-offset, audio-sync-offset: "{ms}" } }
    expect: *ok
    returns: ack
  add_no_signal_image:
    summary: "Upload a JPEG shown while there is no input signal, at most 1920x1080 (add-nosignal-file, multipart/form-data)"
    params:
      image: { type: binary, required: true, label: Image, description: "The JPEG image's contents, given as base64 or as a host file; at most 1920x1080 and the size get-info's nosignal.max-size-kb allows." }
      filename: &filename_jpg { type: string, default: no-signal.jpg, max_length: 128, pattern: "^[A-Za-z0-9._ ()-]+$", label: File name, description: "The file name sent with the upload." }
    send:
      method: POST
      path: /usapi
      query: { method: add-nosignal-file }
      multipart:
        - { name: file, binary: image, filename: "{filename}", content_type: image/jpeg }
    expect: *ok
    returns: ack
  delete_no_signal_image:
    summary: "Delete an uploaded no-signal image; the default image cannot be deleted (del-nosignal-file)"
    params:
      id: &image_id { type: int, min: 0, required: true, label: Image, description: "The image's id, as no_signal.images lists it." }
    send: { method: GET, path: /usapi, query: { method: del-nosignal-file, id: "{id}" } }
    expect: *ok
    returns: ack
  select_no_signal_image:
    summary: "Choose the image shown while there is no signal (set-nosignal-file)"
    params:
      id: *image_id
    send: { method: GET, path: /usapi, query: { method: set-nosignal-file, id: "{id}" } }
    expect: *ok
    returns: ack
  set_no_signal_image_enabled:
    summary: "Show the chosen image while there is no signal, or not (use-nosignal-file)"
    params:
      enabled: { type: bool, required: true, label: No-signal image, description: "On shows the chosen image while there is no input signal." }
    send: { method: GET, path: /usapi, query: { method: use-nosignal-file, use-nosignal-file: "{enabled:bool01}" } }
    expect: *ok
    returns: ack

