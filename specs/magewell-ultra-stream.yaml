    send: { method: GET, path: /usapi, query: { method: send-file-add-server, type: "3", net-mode: "{network:map.net_mode}", account-id: "{account_id}", photo-path: "{photo_path}", user-name: "{user}", access-token: "{access_token}", refresh-token: "{refresh_token}", privacy: "{privacy}" } }
    expect: *ok
    returns: ack
  set_upload_server_ftp:
