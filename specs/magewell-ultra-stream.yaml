  cloud.platforms.*.https:  { type: bool, description: "Cloud slot: reached over HTTPS" }
  cloud.platforms.*.https_port: { type: int, description: "Cloud slot: HTTPS port" }
  cloud.platforms.*.code:   { type: string, description: "Cloud slot: the invitation code" }
  cloud.platforms.*.date:   { type: int, description: "Cloud slot: cloud-date as reported" }
  cloud.platforms.*.configured: { type: bool, description: "Cloud slot: set up (is-cloud-set)" }
  cloud.platforms.*.registration: { type: string, description: "Cloud slot: registration accepted, refused, waiting or deleted" }
  cloud.platforms.*.connection: { type: string, description: "Cloud slot: online, offline or initial" }

  # get-media-files (the first 100 files of each storage).
  media.*.path:             { type: string, description: "Folder of the recordings (usb or sd) on the device" }
  media.*.thumbnail_dir:    { type: string, description: "Thumbnail subfolder, under that folder" }
  media.*.files.*.thumbnail: { type: string, description: "The recording's thumbnail name (a .jpg)" }
  media.*.files.*.status:   { type: string, description: "The recording's state: recording, normal, error or lost" }
  media.*.files.*.created:  { type: string, description: "When the recording was created" }
  media.*.files.*.size_bytes: { type: int, description: "File size, bytes" }
  media.*.files.*.duration: { type: int, description: "Duration, documented as seconds" }
  media.*.files.*.width:    { type: int, description: "Video width, pixels" }
  media.*.files.*.height:   { type: int, description: "Video height, pixels" }
  media.*.files.*.frame_interval: { type: int, description: "Frame interval, 100 ns units (frame rate is 10000000 divided by it)" }
  media.*.files.*.codec:    { type: string, description: "Codec: h264 or hevc" }

telemetry:
  poll:
    # What moves while recording or streaming.
    - every_ms: 2000
      send:
        - { method: GET, path: /usapi, query: { method: get-status } }
    # What an operator configures.
    - every_ms: 30000
      send:
        - { method: GET, path: /usapi, query: { method: get-settings } }
    # What rarely changes: product information, users, EDID, Cloud, files.
    - every_ms: 60000
      send:
        - { method: GET, path: /usapi, query: { method: get-info } }
        - { method: GET, path: /usapi, query: { method: get-users } }
        - { models: [ultra-stream-hdmi], method: GET, path: /usapi, query: { method: get-edid-config } }
        - { models: [ultra-stream-hdmi], method: GET, path: /usapi, query: { method: get-loop-through-edid } }
        - { endpoint: cloud, method: GET, path: /cloud-api, query: { method: cloud-status, version: "1" } }
        - { method: GET, path: /usapi, query: { method: get-media-files, disk-type: "0", start: "0", count: "100" } }
        - { method: GET, path: /usapi, query: { method: get-media-files, disk-type: "1", start: "0", count: "100" } }
  updates:
    # The status mask, from get-status and ping (Device Status Mask).
    - path: "^/usapi\\?method=(get-status|ping)$"
      json_match: { "$.result": "^0$" }
      json: { mask: "$.cur-status" }
      state:
        status.mask: "{mask}"
        status.first_boot: "{mask:bit.0}"
        status.recording: "{mask:bit.1}"
        status.live: "{mask:bit.2}"
        status.usb_ready: "{mask:bit.4}"
        status.rtmp_ready: "{mask:bit.5}"
        status.softap: "{mask:bit.6}"
        status.usb_testing: "{mask:bit.12}"
        status.upgrading: "{mask:bit.14}"
        status.stream_testing: "{mask:bit.15}"
        status.password_set: "{mask:bit.16}"
        status.app_locked: "{mask:bit.17}"
        status.formatting_usb: "{mask:bit.20}"
        status.formatting_sd: "{mask:bit.21}"
        status.wifi_searching: "{mask:bit.22}"
        status.wifi_connecting: "{mask:bit.23}"
        status.checking_update: "{mask:bit.25}"
        status.resetting: "{mask:bit.26}"
        status.rebooting: "{mask:bit.29}"
        status.upload_testing: "{mask:bit.30}"
    # get-status.
    - path: "^/usapi\\?method=get-status$"
      json_match: { "$.result": "^0$" }
      json:
        last_rec: "$.last-rec-status"
        time: "$.cur-time"
        box_name: "$.box-name"
        lock_user: "$.lock-user"
        cpu: "$.sysstat.cpu"
        cpu_usage: "$.sysstat.cpu-usage"
        eth_rx: "$.sysstat.eth-rx"
        eth_tx: "$.sysstat.eth-tx"
        mem_free: "$.sysstat.mem-free"
        mem_total: "$.sysstat.mem-total"
        mobile_rx: "$.sysstat.mobile-rx"
        mobile_tx: "$.sysstat.mobile-tx"
        sd_rd: "$.sysstat.sd-rd"
        sd_wr: "$.sysstat.sd-wr"
        uptime: "$.sysstat.uptime"
        usb_rd: "$.sysstat.usb-rd"
        usb_wr: "$.sysstat.usb-wr"
        wlan_rx: "$.sysstat.wlan-rx"
        wlan_tx: "$.sysstat.wlan-tx"
        in_status: "$.input-signal.status"
        in_cx: "$.input-signal.cx"
        in_cy: "$.input-signal.cy"
        in_interlaced: "$.input-signal.interlaced"
        in_rate: "$.input-signal.frame-rate"
        in_channels: "$.input-signal.channel-valid"
        in_lpcm: "$.input-signal.is-lpcm"
        in_bits: "$.input-signal.bits-per-sample"
        in_sample_rate: "$.input-signal.sample-rate"
        rec_result: "$.rec-status.result"
        rec_ms: "$.rec-status.run-ms"
        rec_bps: "$.rec-status.cur-bps"
        rec_avg: "$.rec-status.avg-bps"
        live_result: "$.live-status.result"
        live_ms: "$.live-status.run-ms"
        live_bps: "$.live-status.cur-bps"
        live_avg: "$.live-status.avg-bps"
        live_net: "$.live-status.net"
        live_result2: "$.live-status.result2"
        live_bps2: "$.live-status.cur-bps2"
        live_net2: "$.live-status.net2"
        lt_bps: "$.living-test.upload-bps"
        lt_percent: "$.living-test.percent"
        lt_result: "$.living-test.result"
        lt_net: "$.living-test.net"
        cu_result: "$.check-upgrade.result"
        up_ver: "$.upgrade.ver"
        up_date: "$.upgrade.date"
        up_size: "$.upgrade.size-byte"
        up_info: "$.upgrade.info"
        us_step: "$.upgrade-status.step"
        us_percent: "$.upgrade-status.percent"
        us_result: "$.upgrade-status.result"
        us_mode: "$.upgrade-status.mode"
        sf_ongoing: "$.send-file.total-count-ongoing"
        sf_done: "$.send-file.total-count-done"
        sf_disk: "$.send-file.disk-type"
        sf_name: "$.send-file.name"
        sf_result: "$.send-file.result"
        sf_message: "$.send-file.message"
        sf_left: "$.send-file.left-time"
        sf_percent: "$.send-file.percent"
        sft_result: "$.send-file-test.result"
        sft_id: "$.send-file-test.id"
        dt_read: "$.disk-test.read-bps"
        dt_write: "$.disk-test.write-bps"
        dt_percent: "$.disk-test.percent"
        dt_result: "$.disk-test.result"
        fs_percent: "$.format-status.percent"
        fs_result: "$.format-status.result"
        wifi_name: "$.wifi.name"
        wifi_level: "$.wifi.level"
        wifi_ip: "$.wifi.ip"
        wifi_mask: "$.wifi.mask"
        wifi_router: "$.wifi.router"
        wifi_dns: "$.wifi.dns"
        eth_ip: "$.eth.ip"
        eth_mask: "$.eth.mask"
        eth_router: "$.eth.router"
        eth_dns: "$.eth.dns"
        mob_ip: "$.mobile.ip"
        mob_mask: "$.mobile.mask"
        mob_router: "$.mobile.router"
        mob_dns: "$.mobile.dns"
      state:
        status.last_recording_result: "{last_rec}"
        device.time: "{time}"
        device.name: "{box_name}"
        status.locked_by: "{lock_user}"
        system.cpu: "{cpu}"
        system.cpu_usage: "{cpu_usage}"
        system.eth_rx: "{eth_rx}"
        system.eth_tx: "{eth_tx}"
        system.memory_free: "{mem_free}"
        system.memory_total: "{mem_total}"
        system.mobile_rx: "{mobile_rx}"
        system.mobile_tx: "{mobile_tx}"
        system.sd_read: "{sd_rd}"
        system.sd_write: "{sd_wr}"
        system.uptime: "{uptime}"
        system.usb_read: "{usb_rd}"
        system.usb_write: "{usb_wr}"
        system.wlan_rx: "{wlan_rx}"
        system.wlan_tx: "{wlan_tx}"
        input.status: "{in_status}"
        input.width: "{in_cx}"
        input.height: "{in_cy}"
        input.interlaced: { value: "{in_interlaced}", map: &b01 { "0": false, "1": true } }
        input.frame_rate: "{in_rate}"
        input.audio_channels_valid: "{in_channels}"
        input.audio_lpcm: { value: "{in_lpcm}", map: *b01 }
        input.audio_bits: "{in_bits}"
        input.audio_sample_rate: "{in_sample_rate}"
        recording.result: "{rec_result}"
        recording.run_ms: "{rec_ms}"
        recording.bps: "{rec_bps}"
        recording.avg_bps: "{rec_avg}"
        live.result: "{live_result}"
        live.run_ms: "{live_ms}"
        live.bps: "{live_bps}"
        live.avg_bps: "{live_avg}"
        live.network: "{live_net}"
        live.result2: "{live_result2}"
        live.bps2: "{live_bps2}"
        live.network2: "{live_net2}"
        stream_test.upload_bps: "{lt_bps}"
        stream_test.percent: "{lt_percent}"
        stream_test.result: "{lt_result}"
        stream_test.network: "{lt_net}"
        firmware.check.result: "{cu_result}"
        firmware.available.version: "{up_ver}"
        firmware.available.date: "{up_date}"
        firmware.available.size_bytes: "{up_size}"
        firmware.available.notes: "{up_info}"
        firmware.update.step: "{us_step}"
        firmware.update.percent: "{us_percent}"
        firmware.update.result: "{us_result}"
        firmware.update.mode: "{us_mode}"
        upload.ongoing: "{sf_ongoing}"
        upload.done: "{sf_done}"
        upload.disk: { value: "{sf_disk}", map: &disk_name { "0": usb, "1": sd } }
        upload.file: "{sf_name}"
        upload.result: "{sf_result}"
        upload.message: "{sf_message}"
        upload.seconds_left: "{sf_left}"
        upload.percent: "{sf_percent}"
        upload_test.result: "{sft_result}"
        upload_test.server_id: "{sft_id}"
        usb_test.read_bps: "{dt_read}"
        usb_test.write_bps: "{dt_write}"
        usb_test.percent: "{dt_percent}"
        usb_test.result: "{dt_result}"
        format.percent: "{fs_percent}"
        format.result: "{fs_result}"
        network.wifi.name: "{wifi_name}"
        network.wifi.level: "{wifi_level}"
        network.wifi.ip_address: "{wifi_ip}"
        network.wifi.netmask: "{wifi_mask}"
        network.wifi.gateway: "{wifi_router}"
        network.wifi.dns: "{wifi_dns}"
        network.ethernet.ip_address: "{eth_ip}"
        network.ethernet.netmask: "{eth_mask}"
        network.ethernet.gateway: "{eth_router}"
        network.ethernet.dns: "{eth_dns}"
        network.mobile.ip_address: "{mob_ip}"
        network.mobile.netmask: "{mob_mask}"
        network.mobile.gateway: "{mob_router}"
        network.mobile.dns: "{mob_dns}"
    # get-status: the USB drive and the SD card, read alike.
    - path: "^/usapi\\?method=get-status$"
      json_match: { "$.result": "^0$" }
      json_each: "$.*"
      each_match: { "$.disk-status": "^\\d+$" }
      json:
        status: "$.disk-status"
        total: "$.total-size"
        used: "$.used-size"
        free: "$.free-size"
        block: "$.block-size"
        usage: "$.usage"
        sys_path: "$.sys-path"
        fs_type: "$.fs-type"
        mount: "$.mount-path"
        label: "$.fs-label"
        write: "$.write-bps"
        read: "$.read-bps"
        free_sec: "$.free-sec"
        files: "$.file-count"
        begin: "$.beign-time"
        end: "$.end-time"
        cache: "$.total-cache-time"
      state:
        "storage.{key}.status": { value: "{status}", map: { "0": none, "1": valid, "3": full, "4": read-only, "5": low-space, "6": invalid } }
        "storage.{key}.status_code": "{status}"
        "storage.{key}.total_bytes": "{total}"
        "storage.{key}.used_bytes": "{used}"
        "storage.{key}.free_bytes": "{free}"
        "storage.{key}.block_size": "{block}"
        "storage.{key}.usage_percent": "{usage}"
        "storage.{key}.device_path": "{sys_path}"
        "storage.{key}.filesystem": "{fs_type}"
        "storage.{key}.mount_path": "{mount}"
        "storage.{key}.label": "{label}"
        "storage.{key}.write_bps": "{write}"
        "storage.{key}.read_bps": "{read}"
        "storage.{key}.free_seconds": "{free_sec}"
        "storage.{key}.file_count": "{files}"
        "storage.{key}.begin_time": "{begin}"
        "storage.{key}.end_time": "{end}"
        "storage.{key}.cache_seconds": "{cache}"

    # get-settings.
    - path: "^/usapi\\?method=get-settings$"
      json_match: { "$.result": "^0$" }
      json:
        name: "$.name"
        passwd: "$.passwd"
        is_settings: "$.is-settings"
        is_ssdp: "$.is-ssdp"
        startup_rec: "$.is-startup-rec"
        startup_live: "$.is-startup-live"
        signal_lost: "$.is-signal-lost"
        hdmi_rec: "$.is-hdmi-rec-ctrl"
        auto_send: "$.is-auto-send-file"
        check_update: "$.is-check-update"
        auto_rec: "$.is-auto-rec"
        auto_live: "$.is-auto-live"
        low_latency: "$.is-low-latency"
        key_reset: "$.enable-key-reset"
        key_reboot: "$.enable-key-reboot"
        sync: "$.audio-sync-offset"
        ap_on: "$.softap.is-softap"
        ap_visible: "$.softap.is-visible"
        ap_ssid: "$.softap.softap-ssid"
        tz: "$.date-time.timezone"
        tz_auto: "$.date-time.is-auto"
        rc_mime: "$.rec-control.mime-type"
        rc_usb: "$.rec-control.usb-option"
        rc_sd: "$.rec-control.sd-option"
        rc_folder: "$.rec-control.root-folder"
        rc_prefix: "$.rec-control.file-prefix"
        rc_mode: "$.rec-control.file-name-mode"
        rc_unit: "$.rec-control.time-unit"
        contrast: "$.video-color.contrast"
        brightness: "$.video-color.brightness"
        saturation: "$.video-color.saturation"
        hue: "$.video-color.hue"
        is_mic: "$.volume.is-mic"
        mic_gain: "$.volume.mic-gain"
        is_spi: "$.volume.is-spi"
        spi_gain: "$.volume.spi-gain"
        is_phone: "$.volume.is-phone"
        phone_gain: "$.volume.phone-gain"
        rec_stream: "$.rec-stream"
        live_stream: "$.live-stream"
        mws_stream: "$.mws-stream"
        main_auto: "$.main-stream.is-auto"
        main_codec: "$.main-stream.codec"
        sub_codec: "$.sub-stream.codec"
        a_rate: "$.audio.sample-rate"
        a_channels: "$.audio.channels"
        a_kbps: "$.audio.kbps"
        in_custom_color: "$.video-input-format.is-color-fmt"
        in_color: "$.video-input-format.color-fmt"
        in_custom_quant: "$.video-input-format.is-quant-range"
        in_quant: "$.video-input-format.quant-range"
        out_custom_color: "$.video-output-format.is-color-fmt"
        out_color: "$.video-output-format.color-fmt"
        out_custom_quant: "$.video-output-format.is-quant-range"
        out_quant: "$.video-output-format.quant-range"
        out_custom_sat: "$.video-output-format.is-sat-range"
        out_sat: "$.video-output-format.sat-range"
        use_nosignal: "$.use-nosignal-file"
      state:
        device.name: "{name}"
        app.password_enabled: { value: "{passwd}", map: *b01 }
        app.settings_allowed: { value: "{is_settings}", map: *b01 }
        network.ssdp: { value: "{is_ssdp}", map: *b01 }
        control.startup_record: { value: "{startup_rec}", map: *b01 }
        control.startup_live: { value: "{startup_live}", map: *b01 }
        control.stop_on_signal_loss: { value: "{signal_lost}", map: *b01 }
        control.hdmi_record_control: { value: "{hdmi_rec}", map: *b01 }
        upload.auto: { value: "{auto_send}", map: *b01 }
        firmware.auto_check: { value: "{check_update}", map: *b01 }
        control.auto_record: { value: "{auto_rec}", map: *b01 }
        control.live_lock: { value: "{auto_live}", map: *b01 }
        control.low_latency_live: { value: "{low_latency}", map: *b01 }
        keys.reset_enabled: { value: "{key_reset}", map: *b01 }
        keys.reboot_enabled: { value: "{key_reboot}", map: *b01 }
        audio.sync_offset_ms: "{sync}"
        softap.enabled: { value: "{ap_on}", map: *b01 }
        softap.visible: { value: "{ap_visible}", map: *b01 }
        softap.ssid: "{ap_ssid}"
        time.timezone: "{tz}"
        time.auto: { value: "{tz_auto}", map: *b01 }
        recording.options.file_type: { value: "{rc_mime}", map: { "0": mp4, "1": mov } }
        recording.options.usb: { value: "{rc_usb}", map: { "0": "off", "1": normal } }
        recording.options.sd: { value: "{rc_sd}", map: { "0": "off", "1": normal, "2": loop } }
        recording.options.folder: "{rc_folder}"
        recording.options.file_prefix: "{rc_prefix}"
        recording.options.file_name_mode: { value: "{rc_mode}", map: { "0": custom, "1": time } }
        recording.options.file_minutes: "{rc_unit}"
        video.contrast: "{contrast}"
        video.brightness: "{brightness}"
        video.saturation: "{saturation}"
        video.hue: "{hue}"
        audio.mic.enabled: { value: "{is_mic}", map: *b01 }
        audio.mic.gain: "{mic_gain}"
        audio.input.enabled: { value: "{is_spi}", map: *b01 }
        audio.input.gain: "{spi_gain}"
        audio.headphone.enabled: { value: "{is_phone}", map: *b01 }
        audio.headphone.gain: "{phone_gain}"
        streams.recording: { value: "{rec_stream}", map: &stream_name_map { "0": main, "1": sub } }
        streams.live: { value: "{live_stream}", map: *stream_name_map }
        streams.preview: { value: "{mws_stream}", map: *stream_name_map }
        encoder.main.follow_input: { value: "{main_auto}", map: *b01 }
        encoder.main.codec: { value: "{main_codec}", map: &codec_name { "0": h264, "1": hevc } }
        encoder.sub.codec: { value: "{sub_codec}", map: *codec_name }
        audio.sample_rate: "{a_rate}"
        audio.channels: "{a_channels}"
        audio.kbps: "{a_kbps}"
        video.input_format.custom_color_space: { value: "{in_custom_color}", map: *b01 }
        video.input_format.color_space: { value: "{in_color}", map: { "1": rgb, "2": bt601, "3": bt709, "4": bt2020 } }
        video.input_format.custom_quant_range: { value: "{in_custom_quant}", map: *b01 }
        video.input_format.quant_range: { value: "{in_quant}", map: &quant_name { "1": full, "2": limited } }
        video.output_format.custom_color_space: { value: "{out_custom_color}", map: *b01 }
        video.output_format.color_space: { value: "{out_color}", map: { "2": bt601, "3": bt709 } }
        video.output_format.custom_quant_range: { value: "{out_custom_quant}", map: *b01 }
        video.output_format.quant_range: { value: "{out_quant}", map: *quant_name }
        video.output_format.custom_sat_range: { value: "{out_custom_sat}", map: *b01 }
        video.output_format.sat_range: { value: "{out_sat}", map: { "1": full, "2": limited, "3": extended } }
        no_signal.enabled: { value: "{use_nosignal}", map: *b01 }
    # get-settings: the main and sub streams' encoding.
    - path: "^/usapi\\?method=get-settings$"
      json_match: { "$.result": "^0$" }
      json:
        m_cx: "$.main-stream.cx"
        m_cy: "$.main-stream.cy"
        m_duration: "$.main-stream.duration"
        m_kbps: "$.main-stream.kbps"
        m_gop: "$.main-stream.gop"
        m_profile: "$.main-stream.profile"
        m_cbrstat: "$.main-stream.cbrstat"
        m_fullrange: "$.main-stream.fullrange"
        s_cx: "$.sub-stream.cx"
        s_cy: "$.sub-stream.cy"
        s_duration: "$.sub-stream.duration"
        s_kbps: "$.sub-stream.kbps"
        s_gop: "$.sub-stream.gop"
        s_profile: "$.sub-stream.profile"
        s_cbrstat: "$.sub-stream.cbrstat"
        s_fullrange: "$.sub-stream.fullrange"
        e_dhcp: "$.eth.is-dhcp"
        e_ip: "$.eth.ip"
        e_mask: "$.eth.mask"
        e_router: "$.eth.router"
        e_dns: "$.eth.dns"
        w_dhcp: "$.wifi.is-dhcp"
        w_ip: "$.wifi.ip"
        w_mask: "$.wifi.mask"
        w_router: "$.wifi.router"
        w_dns: "$.wifi.dns"
      state:
        encoder.main.width: "{m_cx}"
        encoder.main.height: "{m_cy}"
        encoder.main.frame_interval: "{m_duration}"
        encoder.main.kbps: "{m_kbps}"
        encoder.main.gop_seconds: "{m_gop}"
        encoder.main.profile: "{m_profile}"
        encoder.main.stat_seconds: "{m_cbrstat}"
        encoder.main.range: { value: "{m_fullrange}", map: &range_name { "0": limited, "1": full } }
        encoder.sub.width: "{s_cx}"
        encoder.sub.height: "{s_cy}"
        encoder.sub.frame_interval: "{s_duration}"
        encoder.sub.kbps: "{s_kbps}"
        encoder.sub.gop_seconds: "{s_gop}"
        encoder.sub.profile: "{s_profile}"
        encoder.sub.stat_seconds: "{s_cbrstat}"
        encoder.sub.range: { value: "{s_fullrange}", map: *range_name }
        network.ethernet.config.dhcp: { value: "{e_dhcp}", map: *b01 }
        network.ethernet.config.ip_address: "{e_ip}"
        network.ethernet.config.netmask: "{e_mask}"
        network.ethernet.config.gateway: "{e_router}"
        network.ethernet.config.dns: "{e_dns}"
        network.wifi.config.dhcp: { value: "{w_dhcp}", map: *b01 }
        network.wifi.config.ip_address: "{w_ip}"
        network.wifi.config.netmask: "{w_mask}"
        network.wifi.config.gateway: "{w_router}"
        network.wifi.config.dns: "{w_dns}"
    # get-settings: the stream servers, replaced whole (the key, password
    # and token are kept out of state).
    - path: "^/usapi\\?method=get-settings$"
      json_match: { "$.result": "^0$" }
      json_each: "$.stream-server"
      json:
        id: "$.id"
        type: "$.type"
        name: "$.name"
        url: "$.url"
        auth: "$.is-auth"
        user: "$.user"
        use: "$.is-use"
        net: "$.net-mode"
        event: "$.event-data"
        port: "$.port"
        main: "$.is-main"
        main_name: "$.main-stream-name"
        sub: "$.is-sub"
        sub_name: "$.sub-stream-name"
        audio: "$.is-audio"
      replace: stream_servers
      state:
        "stream_servers.{id}.type": { value: "{type}", map: { "0": rtmp, "1": twitch, "2": youtube, "3": facebook, "100": rtsp } }
        "stream_servers.{id}.name": "{name}"
        "stream_servers.{id}.url": "{url}"
        "stream_servers.{id}.auth": { value: "{auth}", map: *b01 }
        "stream_servers.{id}.user": "{user}"
        "stream_servers.{id}.enabled": { value: "{use}", map: *b01 }
        "stream_servers.{id}.network": { value: "{net}", map: &net_name { "0": mobile, "1": ethernet, "2": wifi } }
        "stream_servers.{id}.event": "{event}"
        "stream_servers.{id}.port": "{port}"
        "stream_servers.{id}.main": { value: "{main}", map: *b01 }
        "stream_servers.{id}.main_name": "{main_name}"
        "stream_servers.{id}.sub": { value: "{sub}", map: *b01 }
        "stream_servers.{id}.sub_name": "{sub_name}"
        "stream_servers.{id}.audio": { value: "{audio}", map: *b01 }
    # get-settings: the upload servers, replaced whole (passwords and
    # tokens are kept out of state).
    - path: "^/usapi\\?method=get-settings$"
      json_match: { "$.result": "^0$" }
      json_each: "$.send-file-cloud"
      json:
        id: "$.id"
        type: "$.type"
        use: "$.is-use"
        net: "$.net-mode"
        account: "$.account-id"
        user: "$.user-name"
        photo: "$.photo-path"
        dir: "$.dir-name"
        parents: "$.parents"
        privacy: "$.privacy"
        proto: "$.proto"
        url: "$.url"
        port: "$.port"
        encryption: "$.encryption"
        login: "$.login-type"
        mode: "$.mode"
      replace: upload_servers
      state:
        "upload_servers.{id}.type": { value: "{type}", map: { "0": ftp, "1": google-drive, "2": dropbox, "3": youtube } }
        "upload_servers.{id}.enabled": { value: "{use}", map: *b01 }
        "upload_servers.{id}.network": { value: "{net}", map: *net_name }
        "upload_servers.{id}.account_id": "{account}"
        "upload_servers.{id}.user": "{user}"
        "upload_servers.{id}.photo_path": "{photo}"
        "upload_servers.{id}.directory": "{dir}"
        "upload_servers.{id}.parents": "{parents}"
        "upload_servers.{id}.privacy": "{privacy}"
        "upload_servers.{id}.protocol": { value: "{proto}", map: { "0": ftp, "1": sftp } }
        "upload_servers.{id}.url": "{url}"
        "upload_servers.{id}.port": "{port}"
        "upload_servers.{id}.encryption": { value: "{encryption}", map: { "0": plain, "1": explicit-tls, "2": implicit-tls } }
        "upload_servers.{id}.login": { value: "{login}", map: { "0": anonymous, "1": normal } }
        "upload_servers.{id}.mode": { value: "{mode}", map: { "0": active, "1": passive } }
    # get-settings: the no-signal images, replaced whole.
    - path: "^/usapi\\?method=get-settings$"
      json_match: { "$.result": "^0$" }
      json_each: "$.nosignal-files"
      json: { id: "$.id", use: "$.is-use", edit: "$.is-edit", path: "$.file-path", time: "$.time" }
      replace: no_signal.images
      state:
        "no_signal.images.{id}.selected": { value: "{use}", map: *b01 }
        "no_signal.images.{id}.editable": { value: "{edit}", map: *b01 }
        "no_signal.images.{id}.path": "{path}"
        "no_signal.images.{id}.time": "{time}"

    # get-info.
    - path: "^/usapi\\?method=get-info$"
      json_match: { "$.result": "^0$" }
      json:
        sn: "$.product.sn"
        pid: "$.product.product-id"
        hw: "$.product.hardware-ver"
        fw_id: "$.product.firmware-id"
        fw: "$.product.firmware-ver-s"
        factory: "$.product.factory-firmware-ver-s"
        product: "$.product.product-name"
        model: "$.product.module-name"
        manu: "$.product.manu-name"
        features: "$.product.features"
        locks: "$.product.max-lock-count"
        mac_eth: "$.mac-addr.eth"
        mac_wifi: "$.mac-addr.wifi"
        mac_blue: "$.mac-addr.blue"
        snapshot: "$.snapshot"
        ns_count: "$.nosignal.max-count"
        ns_width: "$.nosignal.max-width"
        ns_height: "$.nosignal.max-height"
        ns_size: "$.nosignal.max-size-kb"
        resolutions: "$.codec-cap.resolutions"
        durations: "$.codec-cap.durations"
        profile: "$.codec-cap.profile"
        hevc_profile: "$.codec-cap.hevc-profile"
        video_kbps: "$.codec-cap.video-kbps"
        audio_kbps: "$.codec-cap.audio-kbps"
        gop: "$.codec-cap.gop-sec"
        video_range: "$.codec-cap.video-range"
        stat: "$.codec-cap.stat-sec"
        codecs: "$.codec-cap.video-codec"
        usb_opt: "$.rec-control.usb-option"
        sd_opt: "$.rec-control.sd-option"
        units: "$.rec-control.time-unit"
        exts: "$.rec-control.file-ext"
        in_color: "$.video-format.input-color-fmt"
        out_color: "$.video-format.output-color-fmt"
        quant: "$.video-format.quant-range"
        sat: "$.video-format.sat-range"
        sf_server: "$.send-file.server"
        sf_proto: "$.send-file.ftp-proto"
        sf_enc: "$.send-file.ftp-encryption"
        sf_mode: "$.send-file.ftp-transfer-mode"
        a_in_min: "$.audio-range.hdmi.min"
        a_in_max: "$.audio-range.hdmi.max"
        a_in_def: "$.audio-range.hdmi.def"
        a_mic_min: "$.audio-range.mic.min"
        a_mic_max: "$.audio-range.mic.max"
        a_mic_def: "$.audio-range.mic.def"
        a_ph_min: "$.audio-range.phone.min"
        a_ph_max: "$.audio-range.phone.max"
        a_ph_def: "$.audio-range.phone.def"
      state:
        device.serial: "{sn}"
        device.product_id: "{pid}"
        device.hardware_revision: "{hw}"
        device.firmware_id: "{fw_id}"
        device.firmware: "{fw}"
        device.factory_firmware: "{factory}"
        device.product: "{product}"
        device.model: "{model}"
        device.manufacturer: "{manu}"
        device.features: "{features}"
        device.max_app_locks: "{locks}"
        device.mac.ethernet: "{mac_eth}"
        device.mac.wifi: "{mac_wifi}"
        device.mac.bluetooth: "{mac_blue}"
        device.snapshot_path: "{snapshot}"
        capabilities.no_signal.max_count: "{ns_count}"
        capabilities.no_signal.max_width: "{ns_width}"
        capabilities.no_signal.max_height: "{ns_height}"
        capabilities.no_signal.max_size_kb: "{ns_size}"
        capabilities.encoding.resolutions: "{resolutions}"
        capabilities.encoding.frame_intervals: "{durations}"
        capabilities.encoding.profiles: "{profile}"
        capabilities.encoding.hevc_profiles: "{hevc_profile}"
        capabilities.encoding.video_kbps: "{video_kbps}"
        capabilities.encoding.audio_kbps: "{audio_kbps}"
        capabilities.encoding.gop_seconds: "{gop}"
        capabilities.encoding.ranges: "{video_range}"
        capabilities.encoding.stat_seconds: "{stat}"
        capabilities.encoding.codecs: "{codecs}"
        capabilities.recording.usb_options: "{usb_opt}"
        capabilities.recording.sd_options: "{sd_opt}"
        capabilities.recording.file_minutes: "{units}"
        capabilities.recording.file_types: "{exts}"
        capabilities.video_format.input_color_spaces: "{in_color}"
        capabilities.video_format.output_color_spaces: "{out_color}"
        capabilities.video_format.quant_ranges: "{quant}"
        capabilities.video_format.sat_ranges: "{sat}"
        capabilities.upload.servers: "{sf_server}"
        capabilities.upload.ftp_protocols: "{sf_proto}"
        capabilities.upload.ftp_encryption: "{sf_enc}"
        capabilities.upload.ftp_transfer_modes: "{sf_mode}"
        capabilities.audio.input.min: "{a_in_min}"
        capabilities.audio.input.max: "{a_in_max}"
        capabilities.audio.input.default: "{a_in_def}"
        capabilities.audio.mic.min: "{a_mic_min}"
        capabilities.audio.mic.max: "{a_mic_max}"
        capabilities.audio.mic.default: "{a_mic_def}"
        capabilities.audio.headphone.min: "{a_ph_min}"
        capabilities.audio.headphone.max: "{a_ph_max}"
        capabilities.audio.headphone.default: "{a_ph_def}"
    # get-info: the picture control ranges, read alike.
    - path: "^/usapi\\?method=get-info$"
      json_match: { "$.result": "^0$" }
      json_each: "$.color-range.*"
      json: { min: "$.min", max: "$.max", def: "$.def" }
      state:
        "capabilities.color.{key}.min": "{min}"
        "capabilities.color.{key}.max": "{max}"
        "capabilities.color.{key}.default": "{def}"

    # get-users, replaced whole.
    - path: "^/usapi\\?method=get-users$"
      json_match: { "$.result": "^0$" }
      json_each: "$.users"
      json: { id: "$.id", type: "$.type" }
      replace: users
      state:
        "users.{id:key}.role": { value: "{type}", map: { "1": admin, "2": user } }

    # get-edid-config and get-loop-through-edid.
    - path: "^/usapi\\?method=get-edid-config$"
      json_match: { "$.result": "^0$" }
      json: { smart: "$.smart-edid", keep: "$.keep-last", audio: "$.add-audio", clock: "$.limit-pixel-clock", data: "$.data" }
      state:
        edid.smart: { value: "{smart}", map: *b01 }
        edid.keep_last: { value: "{keep}", map: *b01 }
        edid.add_audio: { value: "{audio}", map: *b01 }
        edid.limit_pixel_clock: { value: "{clock}", map: *b01 }
        edid.data: "{data}"
    # set-default-edid answers the default EDID it put back.
    - path: "^/usapi\\?method=set-default-edid$"
      json_match: { "$.result": "^0$" }
      json: { data: "$.data" }
      state: { edid.data: "{data}" }
      then_send: [{ models: [ultra-stream-hdmi], method: GET, path: /usapi, query: { method: get-edid-config } }]
    - path: "^/usapi\\?method=get-loop-through-edid$"
      json_match: { "$.result": "^0$" }
      json: { data: "$.data" }
      state: { edid.loop_through_data: "{data}" }

    # cloud-status (port 8070).
    - path: "^/cloud-api\\?method=cloud-status&"
      json_match: { "$.result": "^0$" }
      json: { device: "$.device_id", number: "$.number" }
      state: { cloud.device_id: "{device}", cloud.slots: "{number}" }
    - path: "^/cloud-api\\?method=cloud-status&"
      json_match: { "$.result": "^0$" }
      json_each: "$.status"
      json:
        id: "$.id"
        code: "$.cloud-code"
        date: "$.cloud-date"
        https: "$.cloud-enable-https"
        http_port: "$.cloud-http-port"
        https_port: "$.cloud-https-port"
        address: "$.cloud-ip-addr"
        reg: "$.cloud-reg-status"
        conn: "$.cloud-status"
        set: "$.is-cloud-set"
      replace: cloud.platforms
      state:
        "cloud.platforms.{id}.code": "{code}"
        "cloud.platforms.{id}.date": "{date}"
        "cloud.platforms.{id}.https": { value: "{https}", map: *b01 }
        "cloud.platforms.{id}.http_port": "{http_port}"
        "cloud.platforms.{id}.https_port": "{https_port}"
        "cloud.platforms.{id}.address": "{address}"
        "cloud.platforms.{id}.registration": { value: "{reg}", map: { "101": accepted, "102": refused, "103": waiting, "104": deleted } }
        "cloud.platforms.{id}.connection": { value: "{conn}", map: { "35": online, "36": offline, "27": initial } }
        "cloud.platforms.{id}.configured": { value: "{set}", map: *b01 }

    # get-media-files: a first page replaces the list; every page adds to it.
    - path: "^/usapi\\?method=get-media-files&disk-type=0&"
      json_match: { "$.result": "^0$" }
      json: { path: "$.path", thumbs: "$.thumbnail" }
      state: { media.usb.path: "{path}", media.usb.thumbnail_dir: "{thumbs}" }
    - path: "^/usapi\\?method=get-media-files&disk-type=1&"
      json_match: { "$.result": "^0$" }
      json: { path: "$.path", thumbs: "$.thumbnail" }
      state: { media.sd.path: "{path}", media.sd.thumbnail_dir: "{thumbs}" }
    - path: "^/usapi\\?method=get-media-files&disk-type=0&start=0&"
      json_match: { "$.result": "^0$" }
      json: {}
      replace: media.usb.files
    - path: "^/usapi\\?method=get-media-files&disk-type=0&"
      json_match: { "$.result": "^0$" }
      json_each: "$.media-files"
      json: &media_file
        name: "$.name"
        thumb: "$.thumbnail-name"
        status: "$.status"
        created: "$.create-time"
        size: "$.size-bytes"
        duration: "$.duration"
        width: "$.width"
        height: "$.height"
        interval: "$.interval"
        codec: "$.codec"
      state:
        "media.usb.files.{name:key}.thumbnail": "{thumb}"
        "media.usb.files.{name:key}.status": { value: "{status}", map: &file_status { "0": recording, "1": normal, "2": error, "3": lost } }
        "media.usb.files.{name:key}.created": "{created}"
        "media.usb.files.{name:key}.size_bytes": "{size}"
        "media.usb.files.{name:key}.duration": "{duration}"
        "media.usb.files.{name:key}.width": "{width}"
        "media.usb.files.{name:key}.height": "{height}"
        "media.usb.files.{name:key}.frame_interval": "{interval}"
        "media.usb.files.{name:key}.codec": { value: "{codec}", map: *codec_name }
    - path: "^/usapi\\?method=get-media-files&disk-type=1&start=0&"
      json_match: { "$.result": "^0$" }
      json: {}
      replace: media.sd.files
    - path: "^/usapi\\?method=get-media-files&disk-type=1&"
      json_match: { "$.result": "^0$" }
      json_each: "$.media-files"
      json: *media_file
      state:
        "media.sd.files.{name:key}.thumbnail": "{thumb}"
        "media.sd.files.{name:key}.status": { value: "{status}", map: *file_status }
        "media.sd.files.{name:key}.created": "{created}"
        "media.sd.files.{name:key}.size_bytes": "{size}"
        "media.sd.files.{name:key}.duration": "{duration}"
        "media.sd.files.{name:key}.width": "{width}"
        "media.sd.files.{name:key}.height": "{height}"
        "media.sd.files.{name:key}.frame_interval": "{interval}"
        "media.sd.files.{name:key}.codec": { value: "{codec}", map: *codec_name }

    # upload-update-file answers with a status, not a result.
    - path: "^/usapi\\?method=upload-update-file$"
      json_match: { "$.status": "^0$" }
      json: { up_to_date: "$.up-to-date", version: "$.version", size: "$.size" }
      state:
        firmware.upload.up_to_date: "{up_to_date}"
        firmware.upload.version: "{version}"
        firmware.upload.size_bytes: "{size}"
      then_send: [{ method: GET, path: /usapi, query: { method: get-status } }]

    # Re-reads after a change: what a command changed is read again as soon
    # as the device accepts it.
    - path: "^/usapi\\?method=(set-name|set-app-settings|set-app-passwd|set-rec-control|set-softap|set-date-time|set-signal-lost-ctrl|set-ssdp|set-auto-rec|set-volume|set-video-color|set-low-latency-live|set-auto-live|set-video-input-format|set-video-output-format|set-sync-offset|add-nosignal-file|del-nosignal-file|set-nosignal-file|use-nosignal-file|send-file-add-server|send-file-del-server|send-file-enable-server|send-file-set-server|send-file-set-is-auto|add-server|enable-server|set-server|del-server|set-stream|set-video|set-audio|set-enable-key-reboot|set-enable-key-reset|set-net|set-enable-check-update)(&|$)"
      json_match: { "$.result": "^0$" }
      json: {}
      then_send: [{ method: GET, path: /usapi, query: { method: get-settings } }]
    - path: "^/usapi\\?method=(start-rec|stop-rec|start-live|stop-live|clear-rec|clear-live|start-format-usb|start-format-sd|clear-format-usb|clear-format-sd|start-test-usb|stop-test-usb|clear-test-usb|start-test-server|stop-test-server|clear-test-server|send-file-start-test-server|send-file-stop-test-server|clear-test-send-file|send-file-add|send-file-del|send-file-clear|send-file-start|send-file-stop|update|cancel-download|online-update-check|clear-upgrade|clear-check-update|disconn-wifi|open-softap|close-softap|set-auto-live|set-app-passwd)(&|$)"
      json_match: { "$.result": "^0$" }
      json: {}
      then_send: [{ method: GET, path: /usapi, query: { method: get-status } }]
    - path: "^/usapi\\?method=set-first-over&"
      json_match: { "$.result": "^0$" }
      json: {}
      then_send:
        - { method: GET, path: /usapi, query: { method: get-settings } }
        - { method: GET, path: /usapi, query: { method: get-status } }
    - path: "^/usapi\\?method=(set-edid-config|import-edid)(&|$)"
      json_match: { "$.result": "^0$" }
      json: {}
      then_send: [{ models: [ultra-stream-hdmi], method: GET, path: /usapi, query: { method: get-edid-config } }]
    - path: "^/usapi\\?method=(add-user|del-user|set-password)&"
      json_match: { "$.result": "^0$" }
      json: {}
      then_send: [{ method: GET, path: /usapi, query: { method: get-users } }]
    - path: "^/cloud-api\\?method=cloud-(reg|unreg)-ex&"
      json_match: { "$.result": "^0$" }
      json: {}
      then_send: [{ endpoint: cloud, method: GET, path: /cloud-api, query: { method: cloud-status, version: "1" } }]
    - path: "^/usapi\\?method=del-media-files$"
      request_match: { "$.disk-type": "^([01])$" }
      json_match: { "$.result": "^0$" }
      json: {}
      then_send:
        - { method: GET, path: /usapi, query: { method: get-media-files, disk-type: "{1}", start: "0", count: "100" } }
        - { method: GET, path: /usapi, query: { method: get-status } }

quirks:
  - models: [all]
    severity: critical
    text: >
      None of these asks for confirmation. start_usb_format and
      start_sd_format erase every recording and cannot be canceled;
      delete_media_files cannot be undone; reset_all_settings loses the whole
      configuration and restarts the device; reboot, install_uploaded_firmware
      and install_online_firmware stop recording and streaming until the
      device is back (an update cannot be interrupted); stop_recording and
      stop_live end a take or broadcast at once, and set_live_lock refuses
      stop_live until it is turned off; delete_stream_server,
      delete_upload_server, delete_user, delete_no_signal_image,
      remove_upload_files, clear_upload_list and unregister_cloud cannot be
      undone; set_ethernet_static, set_ethernet_dhcp, set_wifi_static,
      set_wifi_dhcp, disconnect_wifi and close_softap can move the device to
      another address or network, where the core no longer reaches it;
      set_main_stream_video, set_sub_stream_video, set_audio_bitrate and
      set_stream_assignment change what is being recorded and streamed.

  - models: [all]
    severity: warning
    text: >
      The API has no push. get-status (status mask, recording, live, tests,
      firmware update, uploads, input signal, storage, networks, system load)
      is polled every 2 seconds; get-settings every 30 seconds; get-info,
      the users, the EDIDs, the Cloud status and the first 100 recordings of
      each storage every 60 seconds; and what a command changes is read again
      as soon as the device accepts it. Opened for commands only, the core
      polls nothing and checks the device with ping, which needs no login.
      The core logs in (id and the MD5 of the password, the sid cookie)
      before the first request that needs a session and again whenever the
      device answers -17 (authentication required) or HTTP 401, repeating
      that request once; a refused login (36, -1 or -25, or HTTP 401 or 403)
      is final until the settings are corrected. change_password changes the
      logged-in user's password: update the password setting with it, or the
      next login is refused.

  - models: [all]
    severity: warning
    text: >
      The device refuses requests that clash (API Limits): a USB format,
      USB test, stream test, live streaming, recording, an encoding change,
      a firmware update, a reset and a reboot exclude one another in the
      combinations the document tabulates, and a repeated request answers 1
      (repeat). Live streaming goes to at most two enabled servers, to one
      only above 4 Mbps or with RTSP (-29, -30, -41, -42), never with HEVC
      (-32), and never to Facebook beside another service (-31). A recording
      file may not exceed 4 GB (-33): file_minutes times the bitrate must
      stay below it. After a recording, stream, test, format, check or
      update ends, its status stays at its last result until the matching
      clear_* command puts it back to 27.

  - models: [all]
    severity: info
    text: >
      API limits. Joining a Wi-Fi network (its name and password), the
      Bluetooth GATT protocol and the BLE advertisement are served only over
      Bluetooth, which this integration does not use; the multicast
      discovery on 239.255.255.250:2538 and SSDP are not used either. No
      method sets the startup recording and live switches, the HDMI record
      control switch, the custom file name prefix (file-prefix), or the
      encoded audio's sample rate and channels that get-settings reports;
      they are read only, as are the user roles (add_user adds general
      users). The access point's
      is-softap, is-visible and SSID are documented as reserved. The file
      downloads (http://IP:8080/download/...), recording thumbnails, the
      snapshot image, export-report, export-edid and
      export-loop-through-edid give files to save, which the spec format
      cannot do; the EDIDs are read as base64 into state instead, and the
      report as HTML text by get_report.

  - models: [all]
    severity: info
    text: >
      The API's errors are negative numbers, which the spec's code table
      cannot hold: a command the device refuses fails with the raw code (for
      example -9 system busy, -10 invalid parameters, -14 data does not
      exist, -16 no free space, -28 invalid characters, -43 live streaming
      locked, -100 FTP server error), as the API Status Codes page lists
      them; positive states (1 repeated, 2 running) carry their message.
      Stream keys, passwords, tokens and the access point password are kept
      out of state. Values are reported in words where the document names
      them (main or sub, h264 or hevc, the storage, server, FTP and color
      settings); status results are the API status codes. The units of
      sysstat (CPU, memory, network and storage rates, uptime) and the
      meaning of input-signal's status and channel-valid are not documented,
      and are kept as reported. get-signal-info and send-file-get-status
      document only their result, so get_signal_info and get_upload_status
      return the reply unread; get-status's send-file object gives the
      upload progress. The recording list kept in state is each storage's
      first 100 files; get_media_files reads further pages, which are added
      to it. The document's examples of the JSON bodies of del-media-files,
      send-file-add and send-file-del leave the keys unquoted; the core
      sends standard JSON.

  - models: [all]
    severity: info
    text: >
      The Cloud methods answer on port 8070 (/cloud-api), which the document
      gives without a login; the core sends them without the session cookie.
      Uploads (firmware, EDID, no-signal image) are multipart/form-data with
      one part named file, as the vendor's demo sends firmware. The default
      user Admin with password Admin is taken from the vendor's demos.

  - models: [ultra-stream-sdi]
    severity: info
    text: >
      The EDID methods describe the HDMI input and its loop-through, so they
      are offered on the HDMI model only; the document does not say which
