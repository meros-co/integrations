      directory: *directory
      parents: *parents
    send: { method: GET, path: /usapi, query: { method: send-file-set-server, id: "{id}", type: "1", net-mode: "{network:map.net_mode}", account-id: "{account_id}", photo-path: "{photo_path}", user-name: "{user}", access-token: "{access_token}", refresh-token: "{refresh_token}", dir-name: "{directory}", parents: "{parents}" } }
    expect: *ok
    returns: ack
  set_upload_server_dropbox:
    summary: "Change an upload server to the Dropbox account given (send-file-set-server type=2)"
    params:
      id: *upload_id
      network: *network
      account_id: *account_id
      photo_path: *photo_path
