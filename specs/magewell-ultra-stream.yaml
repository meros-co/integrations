    send: { method: GET, path: /usapi, query: { method: send-file-set-server, id: "{id}", type: "3", net-mode: "{network:map.net_mode}", account-id: "{account_id}", photo-path: "{photo_path}", user-name: "{user}", access-token: "{access_token}", refresh-token: "{refresh_token}", privacy: "{privacy}" } }
    expect: *ok
    returns: ack
  delete_upload_server:
    summary: "Delete an upload server (send-file-del-server)"
    params:
      id: *upload_id
    send: { method: GET, path: /usapi, query: { method: send-file-del-server, id: "{id}" } }
