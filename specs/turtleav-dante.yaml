  set_downmix_include:
    summary: Choose the channels in one of Downtown's downmixes
    params:
      out: {type: int, min: 0, max: 2, required: true, label: Audio out, description: '1 line out, 2 Dante out; 0 both.'}
      downmix: {type: int, min: 0, max: 2, required: true, label: Downmix, description: '1 downmix left, 2 downmix right; 0 both.'}
      channels: {type: string, pattern: '^[01]{8}$', required: true, label: Channels, description: 'Eight digits, 1 to include and 0 to exclude, for L, R, Sub, C, Ls, Rs, Lrs and Rrs in that order.'}
    send: set audio out {out} downmix {downmix} include <{channels}>
    expect: {not_contains: rror}
    returns: ack
    # Downtown user manual, §9

  set_downmix_mono:
    summary: Turn mono on or off for one of Downtown's downmixes
    params:
      out: {type: int, min: 0, max: 2, required: true, label: Audio out, description: '1 line out, 2 Dante out; 0 both.'}
