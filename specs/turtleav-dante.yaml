commands:
  set_master_volume:
    summary: Set the master volume, 0-100
    params:
      volume: {type: int, min: 0, max: 100, required: true, label: Master volume, description: Master volume from 0 to 100.}
    send: set master vol {volume}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, Downtown user manual, §9, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  step_master_volume:
    summary: Raise or lower the master volume by a step
    params:
      direction: {type: enum, values: [+, '-'], required: true, label: Direction, description: '+ raises, - lowers.'}
      step: {type: int, min: 1, max: 100, default: 1, label: Step, description: 'Volume steps, 1 to 100.'}
    send: set master vol{direction}{step}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, Downtown user manual, §9, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_master_mute:
    summary: Mute or unmute the master output (bridges, 30W amp)
    params:
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: set master mute {state}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_master_mute_downtown:
    summary: Mute or unmute Downtown's master output
    params:
      muted: {type: bool, required: true, label: Muted, description: True mutes the master output.}
    send: set master mute {muted:bool01}
    expect: {not_contains: rror}
    returns: ack
    # Downtown user manual, §9

  get_master_volume:
    summary: Ask for the master volume; the answer updates state
    send: get master vol
    expect: {matches: 'volume: (\d+)'}
    returns: value
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, Downtown user manual, §9, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_master_member:
    summary: Choose which outputs the master volume and mute act on (bridges, 30W amp)
    params:
      members: {type: string, pattern: '^[01]{2,16}$', required: true, label: Members, description: 'One digit per output in order, 1 to include and 0 to exclude: 2, 4, 8 or 16 digits by bridge, 6 on the 30W amp (Dante 1-2, line 1-2, speaker 1-2).'}
    send: set master member <{members}>
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  recall_preset:
    summary: 'Recall a preset: every setting but the network changes at once'
    params:
      preset: {type: int, min: 1, max: 5, required: true, label: Preset, description: Preset 1 to 5.}
    send: set preset recall {preset}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, Downtown user manual, §9, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  save_preset:
    summary: Save the current settings to a preset, overwriting it
    params:
      preset: {type: int, min: 1, max: 5, required: true, label: Preset, description: Preset 1 to 5.}
    send: set preset save {preset}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, Downtown user manual, §9, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  clear_preset:
    summary: Clear a preset
    params:
      preset: {type: int, min: 1, max: 5, required: true, label: Preset, description: Preset 1 to 5.}
    send: set preset clear {preset}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, Downtown user manual, §9, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_preset_name:
    summary: Name one of Downtown's presets
    params:
      preset: {type: int, min: 1, max: 5, required: true, label: Preset, description: Preset 1 to 5.}
      name: {type: string, max_length: 32, pattern: '^[ -~]{1,32}$', required: true, label: Name, description: 'Preset name, up to 32 printable ASCII characters.'}
    send: set preset {preset} name {name}
    expect: {not_contains: rror}
    returns: ack
    # Downtown user manual, §9

  set_power:
    summary: Power on, or off into standby (Mineola, 30W amp)
    params:
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: set power {state}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_power_phoenix:
    summary: Power on, or off (Phoenix, Downtown)
    params:
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: power {state}
    expect: {not_contains: rror}
    returns: ack
    # Phoenix 8x8 Dante Bridge user manual, §7, Downtown user manual, §9

  reboot:
    summary: Reboot; audio stops until it is back (Mineola, 30W amp)
    send: set reboot
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  reboot_phoenix:
    summary: Reboot; audio stops until it is back (Phoenix, Downtown)
    send: reboot
    expect: {not_contains: rror}
    returns: ack
    # Phoenix 8x8 Dante Bridge user manual, §7, Downtown user manual, §9

  set_standby_mode:
    summary: 'Choose what power off does: standby or sleep'
    params:
      mode: {type: int, min: 1, max: 2, required: true, label: Standby mode, description: '1 standby, 2 sleep.'}
    send: set standby {mode}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7

  set_auto_standby:
    summary: Set the auto standby time, or turn it off
    params:
      minutes: {type: int, min: 0, max: 100, required: true, label: Auto standby, description: 'Minutes without signal before standby, 1 to 100; 0 turns auto standby off.'}
    send: set auto stb {minutes}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_input_gain:
    summary: Set an input's gain, -12 to +12 dB
    params:
      input: {type: int, min: 0, max: 16, required: true, label: Input, description: 'Input channel from 1 (up to 2, 4, 8 or 16 by model, 4 on the 30W amp); 0 for every input.'}
      gain: {type: float, min: -12.0, max: 12.0, required: true, label: Gain, description: 'Input gain in dB, -12.0 to +12.0 in 0.1 dB steps.'}
    send: set input {input} gain {gain:.1f}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  step_input_gain:
    summary: Raise or lower an input's gain by a step
    params:
      input: {type: int, min: 0, max: 16, required: true, label: Input, description: 'Input channel from 1 (up to 2, 4, 8 or 16 by model, 4 on the 30W amp); 0 for every input.'}
      direction: {type: enum, values: [+, '-'], required: true, label: Direction, description: '+ raises, - lowers.'}
      step: {type: float, min: 0.1, max: 24.0, default: 1.0, label: Step, description: 'Step in dB, 0.1 to 24.0.'}
    send: set input {input} gain{direction}{step:.1f}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_input_mute:
    summary: Mute or unmute an input
    params:
      input: {type: int, min: 0, max: 16, required: true, label: Input, description: 'Input channel from 1 (up to 2, 4, 8 or 16 by model, 4 on the 30W amp); 0 for every input.'}
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: set input {input} mute {state}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_input_phantom:
    summary: Turn an input's 48 V phantom power on or off
    params:
      input: {type: int, min: 0, max: 16, required: true, label: Input, description: 'Input channel from 1 (up to 2, 4, 8 or 16 by model, 4 on the 30W amp); 0 for every input.'}
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: set input {input} phantom power {state}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_input_sensitivity:
    summary: Set an analog input's sensitivity
    params:
      input: {type: int, min: 0, max: 16, required: true, label: Input, description: 'Input channel from 1 (up to 2, 4, 8 or 16 by model, 4 on the 30W amp); 0 for every input.'}
      level: {type: int, min: 1, max: 6, required: true, label: Sensitivity, description: '1 +24 dBu, 2 +14 dBu, 3 +4 dBu, 4 0 dBV, 5 -18 dBV, 6 -35 dBV.'}
    send: set input {input} sensitivity {level}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_input_stereo:
    summary: Link an input pair as stereo on the 30W amp
    params:
      pair: {type: int, min: 0, max: 2, required: true, label: Pair, description: '1 Dante in 1/2, 2 mic/line in 1/2; 0 both.'}
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: set input {pair} stereo {state}
    expect: {not_contains: rror}
    returns: ack
    # 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_input_eq_preset:
    summary: Load an EQ preset on an input
    params:
      input: {type: int, min: 0, max: 16, required: true, label: Input, description: 'Input channel from 1 (up to 2, 4, 8 or 16 by model, 4 on the 30W amp); 0 for every input.'}
      preset: {type: int, min: 1, max: 3, required: true, label: EQ preset, description: '1 flat, 2 custom 1, 3 custom 2.'}
    send: set input {input} eq preset {preset}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7

  set_input_eq_band_enabled:
    summary: Turn one band of an input's EQ, or every band, on or off
    params:
      input: {type: int, min: 0, max: 16, required: true, label: Input, description: 'Input channel from 1 (up to 2, 4, 8 or 16 by model, 4 on the 30W amp); 0 for every input.'}
      band: {type: int, min: 0, max: 8, required: true, label: Band, description: 'EQ band 1 to 8; 0 every band.'}
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: set input {input} eq {band} {state}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7

  set_input_eq_stereo:
    summary: Link an input pair's EQ so both use the same settings
    params:
      pair: {type: int, min: 0, max: 8, required: true, label: Pair, description: 'Input pair from 1 (1 is inputs 1 and 2, 2 is 3 and 4, and so on); 0 every pair.'}
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: set input {pair} eq stereo {state}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante Bridge user manual, §7

  set_input_eq_band:
    summary: 'Set one band of an input''s EQ: type, frequency, gain and Q'
    params:
