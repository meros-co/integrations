state:
  power:                 {type: bool, description: Device powered on}
  standby_mode:          {type: string, description: 'What power off does: standby or sleep (bridges)'}
  auto_standby_min:      {type: int, unit: min, description: Auto standby time in minutes}
  master.volume:         {type: int, description: 'Master volume, 0-100'}
  master.mute:           {type: bool, description: Master output muted}
  master.member:         {type: string, description: 'Outputs the master acts on, one digit per output in order, 1 included'}
  master.include:        {type: string, description: 'Outputs in Downtown''s master, as Downtown words it (all outputs, ...)'}
  inputs.*.gain:         {type: float, unit: dB, description: 'Input gain in dB, keyed by input number (30W amp: 1-2 Dante, 3-4 mic/line)'}
  inputs.*.mute:         {type: bool, description: Input muted}
  inputs.*.phantom:      {type: bool, description: Input phantom power on}
  inputs.*.sensitivity:  {type: int, description: 'Input sensitivity: 1 +24 dBu, 2 +14 dBu, 3 +4 dBu, 4 0 dBV, 5 -18 dBV, 6 -35 dBV'}
  inputs.*.stereo:       {type: bool, description: Input linked as a stereo pair (30W amp)}
  inputs.*.eq.preset:    {type: int, description: 'EQ preset: 1 flat, 2 custom 1, 3 custom 2'}
  inputs.*.eq.enabled:   {type: bool, description: 'EQ on or off as the device reports it for the whole channel'}
  inputs.*.eq.stereo:    {type: bool, description: EQ linked with the other channel of its pair}
  inputs.*.eq.bands.*.enabled:   {type: bool, description: 'EQ band on, keyed by band 1-8'}
  inputs.*.eq.bands.*.type:      {type: int, description: 'Filter type: 1 parametric, 2 low-pass, 3 high-pass, 4 low shelf, 5 high shelf'}
  inputs.*.eq.bands.*.frequency: {type: float, unit: Hz, description: Band frequency in Hz}
  inputs.*.eq.bands.*.gain:      {type: float, unit: dB, description: Band gain in dB}
  inputs.*.eq.bands.*.q:         {type: float, description: Band Q}
  outputs.*.volume:      {type: int, description: 'Output volume, 0-100, keyed by output number (30W amp: 1-2 Dante, 3-4 line, 5-6 speaker)'}
  outputs.*.mute:        {type: bool, description: Output muted}
  outputs.*.delay_ms:    {type: int, unit: ms, description: Output delay in milliseconds}
  outputs.*.level:       {type: int, description: 'Analog output level: 1 +20 dBu, 2 +14 dBu, 3 +4 dBu, 4 0 dBV, 5 -18 dBV, 6 -35 dBV'}
  outputs.*.stereo:      {type: bool, description: Output linked as a stereo pair (30W amp)}
  outputs.*.from:        {type: string, description: 'Sources routed to the output, as the 30W amp words them (Dante In CH1, Mixer 1, none)'}
  outputs.*.eq.preset:   {type: int, description: 'EQ preset: 1 flat, 2 custom 1, 3 custom 2'}
  outputs.*.eq.enabled:  {type: bool, description: 'EQ on or off as the device reports it for the whole channel'}
  outputs.*.eq.stereo:   {type: bool, description: EQ linked with the other channel of its pair}
  outputs.*.eq.bands.*.enabled:   {type: bool, description: 'EQ band on, keyed by band 1-8'}
  outputs.*.eq.bands.*.type:      {type: int, description: 'Filter type: 1 parametric, 2 low-pass, 3 high-pass, 4 low shelf, 5 high shelf'}
  outputs.*.eq.bands.*.frequency: {type: float, unit: Hz, description: Band frequency in Hz}
  outputs.*.eq.bands.*.gain:      {type: float, unit: dB, description: Band gain in dB}
  outputs.*.eq.bands.*.q:         {type: float, description: Band Q}
  outputs.*.ducking.enabled:      {type: bool, description: Output ducking on (30W amp)}
  outputs.*.ducking.source:       {type: int, description: Mic/line input 1 or 2 that ducks the output}
  outputs.*.ducking.level:        {type: int, unit: dB, description: Duck level in dB}
  outputs.*.ducking.threshold:    {type: int, unit: dB, description: Ducking threshold in dB}
  outputs.*.ducking.attack_ms:    {type: int, unit: ms, description: Attack time}
  outputs.*.ducking.hold_ms:      {type: int, unit: ms, description: Hold time}
  outputs.*.ducking.release_ms:   {type: int, unit: ms, description: Release time}
  mixers.*.levels:       {type: string, description: 'A 30W amp mixer''s four input levels in dB or off, as the amp shows them (-14 off -14 off)'}
  amp_mode:              {type: string, description: 'The 30W amp''s power mode, as it words it (PoE Class 0)'}
  front_key:             {type: bool, description: The 30W amp's front panel key enabled}
  lcd:                   {type: string, description: 'When the 30W amp''s LCD is lit, as it words it'}
  id_led:                {type: string, description: 'When the 30W amp''s ID LED is lit, as it words it'}
  trigger:               {type: string, description: 'Trigger mute: off, low or high'}
  baud:                  {type: int, description: RS-232 baud rate}
  preset.recalled:       {type: int, description: 'The preset last recalled, as the device reported it'}
  presets.*.name:        {type: string, description: 'Downtown preset name, keyed by preset 1-5'}
  front_locked:          {type: bool, description: Downtown's front button locked}
  ir:                    {type: bool, description: Downtown's IR receiver on}
  temperature_c:         {type: int, unit: C, description: Downtown's internal temperature}
  uptime:                {type: string, description: 'Downtown''s running time, day:hour:min:sec'}
  auto_event_report:     {type: bool, description: Downtown's automatic event reports on}
  hdmi.input.name:       {type: string, description: Downtown's HDMI input name}
  hdmi.input.connected:  {type: bool, description: A source is connected to Downtown's HDMI input}
  hdmi.input.edid:       {type: string, description: 'Downtown''s HDMI input EDID, as it words it'}
  hdmi.input.hdcp:       {type: bool, description: HDCP advertised on Downtown's HDMI input}
  hdmi.output.name:      {type: string, description: Downtown's HDMI output name}
  hdmi.output.connected: {type: bool, description: A display is connected to Downtown's HDMI output}
  hdmi.output.hdcp:      {type: string, description: 'Downtown''s HDMI output HDCP mode, as it words it'}
  hdmi.output.video:     {type: string, description: 'Downtown''s HDMI output video: bypass, internal pattern, AV mute or off'}
  hdmi.output.audio:     {type: string, description: 'Downtown''s HDMI output audio: bypass or downmix'}
  pattern:               {type: string, description: 'Downtown''s internal pattern, as it words it (8K30Hz color bar)'}
  audio_source:          {type: string, description: 'Downtown''s audio source, as it words it (HDMI input 1)'}
  drc:                   {type: string, description: 'Downtown''s dynamic range control: on, off, auto or heavy'}
  upmixer:               {type: bool, description: Downtown's surround upmixer on}
  virtualizer:           {type: bool, description: Downtown's speaker virtualizer on}
  speaker_mode:          {type: int, description: 'Downtown''s speaker layout, 1-27 as set_speaker_mode numbers it'}
  speaker_layout:        {type: string, description: 'Downtown''s speaker layout, as it words it (2.0CH)'}
  audio_out.*.source:    {type: string, description: 'Downtown audio output source (active input or pink noise), keyed Line or Dante'}
  audio_out.*.crossover_hz:  {type: int, unit: Hz, description: Bass crossover frequency}
  audio_out.*.downmix.*.include: {type: string, description: 'Channels in the downmix, keyed L or R: eight digits for L, R, Sub, C, Ls, Rs, Lrs, Rrs'}
  audio_out.*.downmix.*.mono:    {type: bool, description: Downmix mono}
  audio_out.*.speakers.*.bass:     {type: bool, description: 'Speaker bass management on, keyed by speaker (L, R, Sub, C, Ls, Rs, Lrs, Rrs, Ltm/DL, Rtm/DR)'}
