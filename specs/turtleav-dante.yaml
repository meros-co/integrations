telemetry:
  # Two common reads; their replies queue each model's own reads (then_send),
  # so a model is asked only for the channels it has.
  poll:
    every_ms: 10000
    send:
    - get master vol
  subscribe:
    every_ms: 60000
    send:
    - get power
  updates:
    - match: '^(?:Increase |Decrease )?[Mm]aster volume: (\d+)$'
      state:
        master.volume: '{1}'
    - match: '^Master mute: (on|off)$'
      state:
        master.mute: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '^(?:Set )?[Mm]aster member: ?([01]+)$'
      state:
        master.member: '{1}'
    - match: '^(?:XLR|LINE) IN(\d+) gain: (-?[0-9.]+) ?dB$'
      state:
        inputs.{1}.gain: '{2}'
    - match: '^Dante In CH([12]) gain: (-?[0-9.]+) ?dB$'
      state:
        inputs.{1}.gain: '{2}'
    - match: '^Mic/Line In CH([12]) gain: (-?[0-9.]+) ?dB$'
      state:
        inputs.{1:+2}.gain: '{2}'
    - match: '^(?:XLR|LINE) IN(\d+) mute: (on|off)$'
      state:
        inputs.{1}.mute: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^Dante In CH([12]) mute: (on|off)$'
      state:
        inputs.{1}.mute: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^Mic/Line In CH([12]) mute: (on|off)$'
      state:
        inputs.{1:+2}.mute: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^(?:XLR|LINE) IN(\d+) phantom power: (on|off)$'
      state:
        inputs.{1}.phantom: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^Dante In CH([12]) phantom power: (on|off)$'
      state:
        inputs.{1}.phantom: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^Mic/Line In CH([12]) phantom power: (on|off)$'
      state:
        inputs.{1:+2}.phantom: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^(?:XLR|LINE) IN(\d+) sensitivity: ([-+0-9]+dB[uV])$'
      state:
        inputs.{1}.sensitivity: {value: '{2}', map: {'+24dBu': 1, '+14dBu': 2, '+4dBu': 3, '0dBV': 4, '-18dBV': 5, '-35dBV': 6}}
    - match: '^Dante In CH([12]) sensitivity: ([-+0-9]+dB[uV])$'
      state:
        inputs.{1}.sensitivity: {value: '{2}', map: {'+24dBu': 1, '+14dBu': 2, '+4dBu': 3, '0dBV': 4, '-18dBV': 5, '-35dBV': 6}}
    - match: '^Mic/Line In CH([12]) sensitivity: ([-+0-9]+dB[uV])$'
      state:
        inputs.{1:+2}.sensitivity: {value: '{2}', map: {'+24dBu': 1, '+14dBu': 2, '+4dBu': 3, '0dBV': 4, '-18dBV': 5, '-35dBV': 6}}
    - match: '^(?:XLR|LINE) IN(\d+) PEQ: (Flat|Custom1|Custom2)$'
      state:
        inputs.{1}.eq.preset: {value: '{2}', map: {Flat: 1, Custom1: 2, Custom2: 3}}
    - match: '^Dante In CH([12]) PEQ: (Flat|Custom1|Custom2)$'
      state:
        inputs.{1}.eq.preset: {value: '{2}', map: {Flat: 1, Custom1: 2, Custom2: 3}}
    - match: '^Mic/Line In CH([12]) PEQ: (Flat|Custom1|Custom2)$'
      state:
        inputs.{1:+2}.eq.preset: {value: '{2}', map: {Flat: 1, Custom1: 2, Custom2: 3}}
    - match: '^(?:XLR|LINE) IN(\d+) EQ(?: all)?: (on|off)$'
      state:
        inputs.{1}.eq.enabled: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^Dante In CH([12]) EQ(?: all)?: (on|off)$'
      state:
        inputs.{1}.eq.enabled: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^Mic/Line In CH([12]) EQ(?: all)?: (on|off)$'
      state:
        inputs.{1:+2}.eq.enabled: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^(?:XLR|LINE) IN(\d+) EQ ([1-8]): (on|off)$'
      state:
        inputs.{1}.eq.bands.{2}.enabled: {value: '{3}', map: {'on': true, 'off': false}}
    - match: '^Dante In CH([12]) EQ ([1-8]): (on|off)$'
      state:
        inputs.{1}.eq.bands.{2}.enabled: {value: '{3}', map: {'on': true, 'off': false}}
    - match: '^Mic/Line In CH([12]) EQ ([1-8]): (on|off)$'
      state:
        inputs.{1:+2}.eq.bands.{2}.enabled: {value: '{3}', map: {'on': true, 'off': false}}
    - match: '^(?:XLR|LINE) OUT(\d+) volume: (\d+)$'
      state:
        outputs.{1}.volume: '{2}'
    - match: '^Dante Out CH([12]) volume: (\d+)$'
      state:
        outputs.{1}.volume: '{2}'
    - match: '^Line Out CH([12]) volume: (\d+)$'
      state:
        outputs.{1:+2}.volume: '{2}'
    - match: '^Speaker Out CH([12]) volume: (\d+)$'
      state:
        outputs.{1:+4}.volume: '{2}'
    - match: '^(?:Increase |Decrease )(?:XLR|LINE) OUT(\d+) volume: (\d+)$'
      state:
        outputs.{1}.volume: '{2}'
    - match: '^(?:Increase |Decrease )Dante Out CH([12]) volume: (\d+)$'
      state:
        outputs.{1}.volume: '{2}'
    - match: '^(?:Increase |Decrease )Line Out CH([12]) volume: (\d+)$'
      state:
        outputs.{1:+2}.volume: '{2}'
    - match: '^(?:Increase |Decrease )Speaker Out CH([12]) volume: (\d+)$'
      state:
        outputs.{1:+4}.volume: '{2}'
    - match: '^(?:XLR|LINE) OUT(\d+) mute: (on|off)$'
      state:
        outputs.{1}.mute: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^Dante Out CH([12]) mute: (on|off)$'
      state:
        outputs.{1}.mute: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^Line Out CH([12]) mute: (on|off)$'
      state:
        outputs.{1:+2}.mute: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^Speaker Out CH([12]) mute: (on|off)$'
      state:
        outputs.{1:+4}.mute: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^(?:XLR|LINE) OUT(\d+) delay: (\d+) ?ms$'
      state:
        outputs.{1}.delay_ms: '{2}'
    - match: '^Dante Out CH([12]) delay: (\d+) ?ms$'
      state:
        outputs.{1}.delay_ms: '{2}'
    - match: '^Line Out CH([12]) delay: (\d+) ?ms$'
      state:
        outputs.{1:+2}.delay_ms: '{2}'
    - match: '^Speaker Out CH([12]) delay: (\d+) ?ms$'
      state:
        outputs.{1:+4}.delay_ms: '{2}'
    - match: '^(?:XLR|LINE) OUT(\d+) sensitivity: ([-+0-9]+dB[uV])$'
      state:
        outputs.{1}.level: {value: '{2}', map: {'+20dBu': 1, '+14dBu': 2, '+4dBu': 3, '0dBV': 4, '-18dBV': 5, '-35dBV': 6}}
