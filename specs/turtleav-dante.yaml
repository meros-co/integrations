spec: 1
id: turtleav-dante
name: Turtle AV Dante bridges, Downtown and 30W amplifier
vendor: Turtle AV
category: mixer

source:
  - title: MINEOLA 2x2 Dante Bridge user manual (TAV-MINEOLA22XLR), §7 API Control Command (pp. 11-20)
    author: Turtle AV
    url: https://turtleav.com/download/179/user-guide/28704/mineola-2x2-user-guide.pdf
    note: >
      Manufacturer-documented, free download. TCP/IP port 8000 and Telnet 23 (both
      changeable), the lower-case set and get commands with their replies (Master volume:
      50, XLR IN1 gain: 10dB, XLR IN1 mute: on, XLR OUT5 volume: 50, XLR OUT5 delay: 50ms,
      Recall preset 1), system, input, master, output, EQ, preset, network and password
      commands. The 4x4 (28709), 8x8 (28714) and 16x16 (28699) manuals reproduce the 2x2
      table verbatim.
  - title: Phoenix 8x8 Dante Bridge user manual, §7 (pp. 11-22)
    author: Turtle AV
    url: https://turtleav.com/download/179/user-guide/28719/phoenix-8x8-user-guide.pdf
    note: >
      The same command set on LINE IN1-8 and LINE OUT1-8, with system commands (power,
      reboot, status) without the set or get prefix.
  - title: Downtown user manual, §9 (pp. 18-37)
    author: Turtle AV
    url: https://turtleav.com/download/179/user-guide/28917/downtown-user-guide.pdf
    note: >
      Master volume and mute as on Mineola, audio source, HDMI output video, DRC, speaker
      modes, presets; unprefixed power and reboot; set auto event report with no
      documented event format.
  - title: 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9 (pp. 14-23)
    author: Turtle AV
    url: https://turtleav.com/download/179/user-guide/28567/30w-power-amp-user-guide.pdf
    note: >
      Input, master, output, routing (set output x from y), mixer, ducking, EQ and preset
      commands; partly scanned, so parameter text was read with care.
  - title: companion-module-turtleav-mineola (Bitfocus Companion module)
    author: Bitfocus
    url: https://github.com/bitfocus/companion-module-turtleav-mineola
    note: >
      MIT licence, read as corroboration only. It drives the web interface's undocumented
      HTTP and websocket (port 41230) backend rather than this API, and gives the model
      codes TAV-MINEOLA22XLR, 44XLR, 88XLR, 1616XLR and TAV-PHOENIX88.

transport:
  type: line-tcp
  port: 8000
  framing: terminated
  terminator: crlf
  encoding: ascii
  timeout_ms: 3000
  reply: expected

ports:
  - {port: 8000, protocol: tcp, role: control, note: 'TCP/IP control port, changeable; Telnet on 23 carries the same commands'}

models:
  - id: mineola-2x2
    name: Turtle AV Mineola 2x2 Dante Bridge (TAV-MINEOLA22XLR)
    supports:
      [set_master_volume, step_master_volume, set_master_mute, get_master_volume,
       set_input_gain, set_input_mute, set_input_phantom, set_input_sensitivity,
       set_output_volume, set_output_mute, set_output_delay, set_output_level,
       recall_preset, save_preset, set_power, reboot]
    verification: none
    notes: >
      Two XLR inputs and outputs to and from Dante, with DSP.
  - id: mineola-4x4
    name: Turtle AV Mineola 4x4 Dante Bridge (TAV-MINEOLA44XLR)
    supports:
      [set_master_volume, step_master_volume, set_master_mute, get_master_volume,
       set_input_gain, set_input_mute, set_input_phantom, set_input_sensitivity,
       set_output_volume, set_output_mute, set_output_delay, set_output_level,
       recall_preset, save_preset, set_power, reboot]
    verification: none
    notes: >
      Four channels; its manual copies the 2x2's channel ranges.
  - id: mineola-8x8
    name: Turtle AV Mineola 8x8 Dante Bridge (TAV-MINEOLA88XLR)
    supports:
      [set_master_volume, step_master_volume, set_master_mute, get_master_volume,
       set_input_gain, set_input_mute, set_input_phantom, set_input_sensitivity,
       set_output_volume, set_output_mute, set_output_delay, set_output_level,
       recall_preset, save_preset, set_power, reboot]
    verification: none
    notes: >
      Eight channels; its manual copies the 2x2's channel ranges.
  - id: mineola-16x16
    name: Turtle AV Mineola 16x16 Dante Bridge (TAV-MINEOLA1616XLR)
    supports:
      [set_master_volume, step_master_volume, set_master_mute, get_master_volume,
       set_input_gain, set_input_mute, set_input_phantom, set_input_sensitivity,
       set_output_volume, set_output_mute, set_output_delay, set_output_level,
       recall_preset, save_preset, set_power, reboot]
    verification: none
    notes: >
      Sixteen channels; its manual copies the 2x2's channel ranges.
  - id: phoenix-8x8
    name: Turtle AV Phoenix 8x8 Dante Bridge
    supports:
      [set_master_volume, step_master_volume, set_master_mute, get_master_volume,
       set_input_gain, set_input_mute, set_output_volume, set_output_mute,
       set_output_delay, set_output_level, recall_preset, save_preset, set_power_phoenix,
       reboot_phoenix]
    verification: none
    notes: >
      Eight Phoenix-connector line inputs and outputs to and from Dante.
  - id: downtown
    name: Turtle AV Downtown
    supports:
      [set_master_volume, step_master_volume, set_master_mute, get_master_volume,
       recall_preset, save_preset, set_power_phoenix, reboot_phoenix, set_audio_source,
       set_output_video, set_drc, set_speaker_mode]
    verification: none
    notes: >
      HDMI and optical to Dante and line decoder with Atmos and DTS.
  - id: amp-30w
    name: Turtle AV 30W PoE+ Dante amplifier (TAV-DPA30D)
    supports:
      [set_master_volume, step_master_volume, set_master_mute, get_master_volume,
       set_input_gain, set_input_mute, set_input_phantom, set_input_sensitivity,
       set_output_volume, set_output_mute, set_output_delay, recall_preset, save_preset,
       set_power, reboot, set_output_route]
    verification: none
    notes: >
      Two Dante and two mic/line inputs, Dante, line and speaker outputs, mixer and
      ducking.

commands:
  set_master_volume:
    summary: Set the master volume, 0-100
    params:
      volume: {type: int, min: 0, max: 100, required: true, label: Master volume, description: Master volume from 0 to 100.}
    send: set master vol {volume}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante
    # Bridge user manual, §7, Downtown user manual, §9, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D)
    # user manual, §9

  step_master_volume:
    summary: Raise or lower the master volume by a step
    params:
      direction: {type: enum, values: [+, '-'], required: true, label: Direction, description: '+ raises, - lowers.'}
      step: {type: int, min: 1, max: 100, default: 1, label: Step, description: 'Volume steps, 1 to 100.'}
    send: set master vol{direction}{step}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante
    # Bridge user manual, §7, Downtown user manual, §9, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D)
    # user manual, §9

  set_master_mute:
    summary: Mute or unmute the master output
    params:
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: set master mute {state}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante
    # Bridge user manual, §7, Downtown user manual, §9, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D)
    # user manual, §9

  get_master_volume:
    summary: Ask for the master volume; the answer updates state
    send: get master vol
    expect: {matches: 'volume: (\d+)'}
    returns: value
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command

  set_input_gain:
    summary: Set an input's gain, -12 to +12 dB
    params:
      input: {type: int, min: 0, max: 16, required: true, label: Input, description: 'Input channel from 1 (up to 2, 4, 8 or 16 by model); 0 for every input.'}
      gain: {type: float, min: -12.0, max: 12.0, required: true, label: Gain, description: 'Input gain in dB, -12.0 to +12.0 in 0.1 dB steps.'}
    send: set input {input} gain {gain:.1f}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante
    # Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_input_mute:
    summary: Mute or unmute an input
    params:
      input: {type: int, min: 0, max: 16, required: true, label: Input, description: 'Input channel from 1 (up to 2, 4, 8 or 16 by model); 0 for every input.'}
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: set input {input} mute {state}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante
    # Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_input_phantom:
    summary: Turn an input's 48 V phantom power on or off
    params:
      input: {type: int, min: 0, max: 16, required: true, label: Input, description: 'Input channel from 1 (up to 2, 4, 8 or 16 by model); 0 for every input.'}
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: set input {input} phantom power {state}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, 30W PoE+ Audio
    # Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_input_sensitivity:
    summary: Set an analog input's sensitivity
    params:
      input: {type: int, min: 0, max: 16, required: true, label: Input, description: 'Input channel from 1 (up to 2, 4, 8 or 16 by model); 0 for every input.'}
      level: {type: int, min: 1, max: 6, required: true, label: Sensitivity, description: '1 +24 dBu, 2 +14 dBu, 3 +4 dBu, 4 0 dBV, 5 -18 dBV, 6 -35 dBV.'}
    send: set input {input} sensitivity {level}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, 30W PoE+ Audio
    # Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_output_volume:
    summary: Set an output's volume, 0-100
    params:
      output: {type: int, min: 0, max: 16, required: true, label: Output, description: 'Output channel from 1 (up to 2, 4, 8 or 16 by model, 6 on the 30W amp); 0 for every output.'}
      volume: {type: int, min: 0, max: 100, required: true, label: Volume, description: Output volume from 0 to 100.}
    send: set output {output} vol {volume}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante
    # Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_output_mute:
    summary: Mute or unmute an output
    params:
      output: {type: int, min: 0, max: 16, required: true, label: Output, description: 'Output channel from 1 (up to 2, 4, 8 or 16 by model, 6 on the 30W amp); 0 for every output.'}
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: set output {output} mute {state}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante
    # Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_output_delay:
    summary: Set an output's delay, 0-50 ms
    params:
      output: {type: int, min: 0, max: 16, required: true, label: Output, description: 'Output channel from 1 (up to 2, 4, 8 or 16 by model, 6 on the 30W amp); 0 for every output.'}
      ms: {type: int, min: 0, max: 50, required: true, label: Delay, description: 'Output delay in milliseconds, 0 to 50.'}
    send: set output {output} delay {ms}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante
    # Bridge user manual, §7, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_output_level:
    summary: Set an analog output's level
    params:
      output: {type: int, min: 0, max: 16, required: true, label: Output, description: 'Output channel from 1 (up to 2, 4, 8 or 16 by model, 6 on the 30W amp); 0 for every output.'}
      level: {type: int, min: 1, max: 5, required: true, label: Output level, description: '1 +20 dBu, 2 +14 dBu, 3 +4 dBu, 4 0 dBV, 5 -18 dBV.'}
    send: set output {output} gain {level}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante
    # Bridge user manual, §7

  recall_preset:
    summary: 'Recall a preset: every setting but the network changes at once'
    params:
      preset: {type: int, min: 1, max: 5, required: true, label: Preset, description: Preset 1 to 5.}
    send: set preset recall {preset}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante
    # Bridge user manual, §7, Downtown user manual, §9, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D)
    # user manual, §9

  save_preset:
    summary: Save the current settings to a preset, overwriting it
    params:
      preset: {type: int, min: 1, max: 5, required: true, label: Preset, description: Preset 1 to 5.}
    send: set preset save {preset}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, Phoenix 8x8 Dante
    # Bridge user manual, §7, Downtown user manual, §9, 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D)
    # user manual, §9

  set_power:
    summary: Power on, or off into standby (Mineola, 30W amp)
    params:
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: set power {state}
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, 30W PoE+ Audio
    # Amplifier with Dante (TAV-DPA30D) user manual, §9

  set_power_phoenix:
    summary: Power on, or off (Phoenix, Downtown)
    params:
      state: {type: enum, values: ['on', 'off'], required: true, label: State, description: on or off.}
    send: power {state}
    expect: {not_contains: rror}
    returns: ack
    # Phoenix 8x8 Dante Bridge user manual, §7, Downtown user manual, §9

  reboot:
    summary: Reboot; audio stops until it is back (Mineola, 30W amp)
    send: set reboot
    expect: {not_contains: rror}
    returns: ack
    # Mineola Dante Bridge user manuals (2x2, 4x4, 8x8, 16x16), §7 API Control Command, 30W PoE+ Audio
    # Amplifier with Dante (TAV-DPA30D) user manual, §9

  reboot_phoenix:
    summary: Reboot; audio stops until it is back (Phoenix, Downtown)
    send: reboot
    expect: {not_contains: rror}
    returns: ack
    # Phoenix 8x8 Dante Bridge user manual, §7, Downtown user manual, §9

  set_audio_source:
    summary: Choose Downtown's audio source
    params:
      source: {type: int, min: 1, max: 3, required: true, label: Audio source, description: '1 optical, 2 HDMI input 1, 3 eARC/ARC.'}
    send: set audio source {source}
    expect: {not_contains: rror}
    returns: ack
    # Downtown user manual, §9

  set_output_video:
    summary: Set Downtown's HDMI output video
    params:
      mode: {type: int, min: 1, max: 4, required: true, label: Video, description: '1 bypass, 2 internal pattern, 3 AV mute, 4 off.'}
    send: set output 1 video {mode}
    expect: {not_contains: rror}
    returns: ack
    # Downtown user manual, §9

  set_drc:
    summary: Set Downtown's dynamic range compression
    params:
      mode: {type: int, min: 1, max: 4, required: true, label: DRC, description: '1 on, 2 off, 3 auto, 4 heavy.'}
    send: set drc {mode}
    expect: {not_contains: rror}
    returns: ack
    # Downtown user manual, §9

  set_speaker_mode:
    summary: Set Downtown's speaker layout
    params:
      mode: {type: int, min: 1, max: 27, required: true, label: Speaker mode, description: '1 2.0 to 27 9.1: 14 is 5.1, 24 7.1, 25 7.1.2 top middle, 26 7.1.2 Atmos-enabled, as the manual lists.'}
    send: set speaker mode {mode}
    expect: {not_contains: rror}
    returns: ack
    # Downtown user manual, §9

  set_output_route:
    summary: Route a source to a 30W amp output
    params:
      output: {type: int, min: 0, max: 6, required: true, label: Output, description: '0 all, 1-2 Dante out, 3-4 line out, 5-6 speaker out.'}
      source: {type: int, min: 1, max: 6, required: true, label: Source, description: '1-2 Dante in, 3-4 mic/line in, 5-6 mixer 1-2.'}
    send: set output {output} from {source}
    expect: {not_contains: rror}
    returns: ack
    # 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9

telemetry:
  poll:
    every_ms: 5000
    send:
    - get master vol
    - get master mute
  updates:
    - match: '^(?:Increase |Decrease )?[Mm]aster volume: (\d+)$'
      state:
        master.volume: '{1}'
    - match: '^Master mute: (on|off)$'
      state:
        master.mute: {value: '{1}', map: {'on': true, 'off': false}}
    - match: '^(?:XLR|LINE) IN(\d+) gain: (-?[0-9.]+) ?dB$'
      state:
        inputs.{1}.gain: '{2}'
    - match: '^(?:XLR|LINE) IN(\d+) mute: (on|off)$'
      state:
        inputs.{1}.mute: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^(?:XLR|LINE) IN(\d+) phantom power: (on|off)$'
      state:
        inputs.{1}.phantom: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^(?:XLR|LINE) OUT(\d+) volume: (\d+)$'
      state:
        outputs.{1}.volume: '{2}'
    - match: '^(?:XLR|LINE) OUT(\d+) mute: (on|off)$'
      state:
        outputs.{1}.mute: {value: '{2}', map: {'on': true, 'off': false}}
    - match: '^(?:XLR|LINE) OUT(\d+) delay: (\d+) ?ms$'
      state:
        outputs.{1}.delay_ms: '{2}'
    - match: ^Recall preset (\d+)$
      state:
        preset.recalled: '{1}'
    - match: '^Power: ?(on|off)$'
      state:
        power: {value: '{1}', map: {'on': true, 'off': false}}

state:
  master.volume:       {type: int, description: 'Master volume, 0-100'}
  master.mute:         {type: bool, description: Master output muted}
  inputs.*.gain:       {type: float, description: 'Input gain in dB, keyed by input number'}
  inputs.*.mute:       {type: bool, description: Input muted}
  inputs.*.phantom:    {type: bool, description: Input phantom power on}
  outputs.*.volume:    {type: int, description: 'Output volume, 0-100, keyed by output number'}
  outputs.*.mute:      {type: bool, description: Output muted}
  outputs.*.delay_ms:  {type: int, description: Output delay in milliseconds}
  preset.recalled:     {type: int, description: 'The preset last recalled, as the device reported it'}
  power:               {type: bool, description: Device powered on}

quirks:
  - models: [all]
    severity: critical
    text: >
      recall_preset replaces every setting but the network at once, and reboot or power
      off stops audio. None asks for confirmation.

  - models: [all]
    severity: warning
    text: >
      Nothing is pushed (Downtown's auto event report has no documented format): the
      master volume and mute are polled every 5 seconds, and other values update from the
      replies to this session's commands, which repeat the new value (XLR IN1 mute: on).
      Changes made from the web interface to other values are not seen.

  - models: [all]
    severity: warning
    text: >
      The documents state no line ending; commands end with CR LF. No login is documented
      on port 8000 or 23. The API answers get admin password and get user password with
      the web interface's passwords in clear, unauthenticated; this spec offers neither.

  - models: [mineola-4x4, mineola-8x8, mineola-16x16]
    severity: warning
    text: >
      These manuals copy the 2x2's command table, channel range 0-2 and type XLR22, so
      their real channel ranges are not documented; the commands allow channels up to 16
      and the device's answer to a channel it lacks is not documented.

  - models: [all]
    severity: info
    text: >
      Channel 0 addresses every channel, and the device then answers with one line per
      channel; the first is taken as the reply and every line updates state. Commands fail
      when the reply contains Error (the 30W amp's Error: AMP is DC power supply ...);
      other refusals are not documented.
