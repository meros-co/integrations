spec: 1
id: turtleav-dante
name: Turtle AV Dante bridges, Downtown and 30W amplifier
vendor: Turtle AV
category: mixer

source:
  - title: MINEOLA 2x2 Dante Bridge user manual (TAV-MINEOLA22XLR), §7 API Control Command (pp. 11-20)
    author: Turtle AV
    url: https://turtleav.com/download/179/user-guide/28704/mineola-2x2-user-guide.pdf
    note: >
      Manufacturer-documented, free download. TCP/IP port 8000 and Telnet 23 (both
      changeable), the lower-case set and get commands with their replies (Master volume:
      50, XLR IN1 gain: 10dB, XLR IN1 mute: on, XLR OUT5 volume: 50, XLR OUT5 delay: 50ms,
      Recall preset 1), system, input, master, output, EQ, preset, network and password
      commands. The 4x4 (28709), 8x8 (28714) and 16x16 (28699) manuals reproduce the 2x2
      table verbatim.
  - title: Phoenix 8x8 Dante Bridge user manual, §7 (pp. 11-22)
    author: Turtle AV
    url: https://turtleav.com/download/179/user-guide/28719/phoenix-8x8-user-guide.pdf
    note: >
      The same command set on LINE IN1-8 and LINE OUT1-8, with system commands (power,
      reboot, status) without the set or get prefix.
  - title: Downtown user manual, §9 (pp. 18-37)
    author: Turtle AV
    url: https://turtleav.com/download/179/user-guide/28917/downtown-user-guide.pdf
    note: >
      Master volume and mute as on Mineola, audio source, HDMI output video, DRC, speaker
      modes, presets; unprefixed power and reboot; set auto event report with no
      documented event format.
  - title: 30W PoE+ Audio Amplifier with Dante (TAV-DPA30D) user manual, §9 (pp. 14-23)
    author: Turtle AV
    url: https://turtleav.com/download/179/user-guide/28567/30w-power-amp-user-guide.pdf
    note: >
      Input, master, output, routing (set output x from y), mixer, ducking, EQ and preset
      commands; partly scanned, so parameter text was read with care.
  - title: companion-module-turtleav-mineola (Bitfocus Companion module)
    author: Bitfocus
    url: https://github.com/bitfocus/companion-module-turtleav-mineola
    note: >
      MIT licence, read as corroboration only. It drives the web interface's undocumented
      HTTP and websocket (port 41230) backend rather than this API, and gives the model
      codes TAV-MINEOLA22XLR, 44XLR, 88XLR, 1616XLR and TAV-PHOENIX88.

transport:
  type: line-tcp
  port: 8000
  framing: terminated
  terminator: crlf
  encoding: ascii
  timeout_ms: 3000
  reply: expected

ports:
  - {port: 8000, protocol: tcp, role: control, note: 'TCP/IP control port, changeable; Telnet on 23 carries the same commands'}

