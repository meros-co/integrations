      out: {type: int, min: 0, max: 2, required: true, label: Audio out, description: '1 line out, 2 Dante out; 0 both.'}
      source: {type: int, min: 1, max: 2, required: true, label: Source, description: '1 active input, 2 pink noise.'}
    send: set audio out {out} source {source}
    expect: {not_contains: rror}
    returns: ack
    # Downtown user manual, §9

  set_speaker_bass:
    summary: Turn bass management on or off for one of Downtown's speakers
    params:
      out: {type: int, min: 0, max: 2, required: true, label: Audio out, description: '1 line out, 2 Dante out; 0 both.'}
      speaker: {type: int, min: 1, max: 10, required: true, label: Speaker, description: '1 L, 2 R, 3 Sub, 4 C, 5 Ls, 6 Rs, 7 Lrs, 8 Rrs, 9 Ltm/DL, 10 Rtm/DR.'}
      enabled: {type: bool, required: true, label: Bass, description: True sends the speaker's bass to the subwoofer.}
    send: set audio out {out} speaker {speaker} bass {enabled:bool01}
    expect: {not_contains: rror}
    returns: ack
    # Downtown user manual, §9

  set_speaker_delay:
    summary: Set one of Downtown's speaker delays, 0-50 ms
    params:
      out: {type: int, min: 0, max: 2, required: true, label: Audio out, description: '1 line out, 2 Dante out; 0 both.'}
      speaker: {type: int, min: 1, max: 10, required: true, label: Speaker, description: '1 L, 2 R, 3 Sub, 4 C, 5 Ls, 6 Rs, 7 Lrs, 8 Rrs, 9 Ltm/DL, 10 Rtm/DR.'}
      ms: {type: int, min: 0, max: 50, required: true, label: Delay, description: 'Delay in milliseconds, 0 to 50.'}
