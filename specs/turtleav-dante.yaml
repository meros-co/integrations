quirks:
  - models: [all]
    severity: critical
    text: >
      recall_preset replaces every setting but the network at once, and reboot or power
      off stops audio. None asks for confirmation. The network commands take effect after
      net_reboot or a power cycle, and a wrong address leaves the device unreachable.

  - models: [all]
    severity: warning
    text: >
      Nothing is pushed (Downtown's auto event report has no documented format). get master
      vol is polled every 10 seconds and get power every minute; each reply queues the
      model's own reads, so a model is asked only for the channels it has. The fast set is
      the master mute and every input's gain and mute and output's volume and mute
      (Downtown: master mute, audio source and HDMI connections); the minute set is every
      other setting the API reads. Replies to this session's commands update state at once.

  - models: [all]
    severity: warning
    text: >
      The documents state no line ending; commands end with CR LF. No login is documented
      on port 8000 or 23. The API answers get admin password and get user password with
      the web interface's passwords in clear, unauthenticated; this spec offers neither,
      nor set reset and set reset all, which ask for Yes at a further prompt.

  - models: [all]
    severity: warning
    text: >
      Several replies are documented as several lines: channel 0 (every channel), get
      input/output x eq on the Phoenix and the 30W amp (one line per band), a network
      change with its reminder to run net_reboot. Replies are taken in order, so the extra
      lines can be taken as the answers to the next queued reads; every reply line names
      its channel and still updates state, which is at worst a read late.

  - models: [all]
    severity: warning
    text: >
      An EQ band's settings are read back only from the reply to set_input_eq_band,
      set_output_eq_band and set_speaker_eq_band, tied to the request: get input/output x
      eq setting answers each band on a line of its own without the channel's name, which
      the spec format cannot tie to the channel (one message at a time, no state between
      lines). Settings changed elsewhere are not seen until set here.

  - models: [mineola-4x4, mineola-8x8, mineola-16x16]
    severity: warning
    text: >
      These manuals copy the 2x2's command table, channel range 0-2 and type XLR22, so
      their real channel ranges are not documented; the commands allow channels up to 16
      and the reads assume 4, 8 and 16 channels.

  - models: [downtown]
    severity: warning
    text: >
      Downtown's mute and on/off settings take 1 and 0 (set master mute 1), not on and off:
      set_master_mute_downtown replaces set_master_mute for it. Its temperature and uptime
      replies are bare values (65C, 000:00:13:04) read as the answers to get temp and get
      uptime. Its speaker EQ band settings, like the bridges', are read back only from
      set_speaker_eq_band.

  - models: [all]
    severity: info
    text: >
      Commands fail when the reply contains Error (the 30W amp's Error: AMP is DC power
      supply ...); other refusals are not documented. The status report (get status) is a
      multi-line table not read into state; everything in it has a read of its own.
