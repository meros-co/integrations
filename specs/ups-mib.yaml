spec: 1
id: ups-mib
name: UPS over SNMP (UPS-MIB, RFC 1628)
vendor: Generic (any UPS whose network card implements RFC 1628's UPS-MIB, such as Eaton's)
category: other
implementation: native
reason: >
  SNMP: BER-encoded requests over UDP, matched to their responses, retransmitted, walked with GETBULK, and on v3
  authenticated and encrypted with keys derived from passwords (see generic-snmp). The UPS's input, output, bypass
  and alarm tables are rows the agent lists only when walked, a test is started by writing a lock read first in
  the same SET, and its traps arrive on a port of the core's. The integration is the SNMP manager with the
  standard UPS-MIB's objects named.

source:
  - title: "RFC 1628: UPS Management Information Base (May 1994)"
    author: "J. Case, Ed., IETF"
    url: "https://www.rfc-editor.org/rfc/rfc1628"
    note: >
      UPS-MIB (mib-2 33): identification, battery, input, output, bypass, alarm, test, control and configuration
      groups, their tables (upsInputTable, upsOutputTable, upsBypassTable, upsAlarmTable), the well-known alarms
      and tests (upsWellKnownAlarms, upsWellKnownTests) as OBJECT-IDENTITYs, the test procedure (read
      upsTestSpinLock, then SET it with upsTestId in one request), and the notifications upsTrapOnBattery,
      upsTrapTestCompleted, upsTrapAlarmEntryAdded and upsTrapAlarmEntryRemoved.
  - title: "Eaton Gigabit Network Card (Network-M2), specifications"
    author: Eaton
    url: "https://www.eaton.com/ma/en-gb/catalog/backup-power-ups-surge-it-power-distribution/eaton-gigabit-network-card-emea.html"
    note: "Lists RFC 1628's standard UPS MIB among the card's SNMP MIBs, beside Eaton's own xUPS MIB, for the 5P, 5PX, 9PX, 9SX and 9E families and others."
  - title: "CyberPower RMCARD205 specification sheet"
    author: CyberPower Systems
    url: "https://micom.mx/storage/recursos/RMCARD205.pdf"
    note: "Lists RFC 1213 and RFC 1628 among the card's supported MIBs."
  - title: "RFC 3416, RFC 3418 and the SNMP RFCs generic-snmp cites"
    author: IETF
    url: "https://www.rfc-editor.org/rfc/rfc3416"
    note: "The protocol (GETBULK walks, SET, traps); the system group (sysDescr, sysUpTime...)."

models:
  - id: ups
    name: "Any UPS implementing RFC 1628 (Eaton Network-M2 and Network-M3 cards, CyberPower RMCARDs and others)"
    supports: [get, walk, set, refresh, set_config_audible_status, set_config_high_voltage_transfer_point, set_config_input_freq, set_config_input_voltage, set_config_low_batt_time, set_config_low_voltage_transfer_point, set_config_output_freq, set_config_output_voltage, set_control_auto_restart, set_control_reboot_with_duration, set_control_shutdown_after_delay, set_control_shutdown_type, set_control_startup_after_delay, set_ident_attached_devices, set_ident_name, set_test_id, set_test_spin_lock]
    verification: none
    notes: Walks UPS-MIB's objects (mib-2 33.1); a UPS fills the groups it implements.

settings:
  version: { type: enum, values: [v1, v2c, v3], default: v2c, label: SNMP version,
             description: "The SNMP version the agent is asked with: v1 and v2c use a community string, v3 a user with authentication and privacy." }
  community: { type: string, secret: true, max_length: 255, default: public, label: Community,
               description: "v1 and v2c: the community string for reads, and for SETs when no write community is set." }
  write_community: { type: string, secret: true, max_length: 255, default: "", label: Write community,
                     description: "v1 and v2c: the community string SETs are sent with, often private; empty uses the community." }
  user: { type: string, max_length: 32, default: "", label: User,
          description: "v3: the user name (securityName) the agent knows." }
  security_level: { type: enum, values: [no_auth_no_priv, auth_no_priv, auth_priv], default: auth_priv, label: Security level,
                    description: "v3: no_auth_no_priv sends messages unauthenticated, auth_no_priv authenticates them, auth_priv also encrypts them." }
  auth_protocol: { type: enum, values: [md5, sha, sha224, sha256, sha384, sha512], default: sha, label: Authentication protocol,
                   description: "v3: HMAC-MD5-96, HMAC-SHA-96 (sha) or HMAC-SHA-2 (RFC 7860), as the user is set up on the agent." }
  auth_password: { type: string, secret: true, max_length: 256, default: "", label: Authentication password,
                   description: "v3: the user's authentication password, at least 8 characters." }
  priv_protocol: { type: enum, values: [des, aes, aes192, aes256], default: aes, label: Privacy protocol,
                   description: "v3 at auth_priv: CBC-DES, AES-128 (aes, RFC 3826), or AES-192 or AES-256 as draft-blumenthal-aes-usm-04 defines them." }
  priv_password: { type: string, secret: true, max_length: 256, default: "", label: Privacy password,
                   description: "v3 at auth_priv: the user's privacy password, at least 8 characters." }
  context_name: { type: string, max_length: 32, default: "", label: Context name,
                  description: "v3: the context requests are made in, empty for the agent's default context." }
  context_engine_id: { type: string, pattern: '^[0-9A-Fa-fxX :.-]*$', max_length: 100, default: "", label: Context engine ID,
                       description: "v3: the contextEngineID in hex, for an agent proxying another engine; empty uses the agent's own snmpEngineID." }
  timeout_ms: { type: int, min: 1, max: 60000, default: 1500, label: Timeout,
                description: "Milliseconds to wait for each response before sending the request again." }
  retries: { type: int, min: 0, max: 10, default: 2, label: Retries,
             description: "How many times an unanswered request is sent again before it fails with timeout." }
  max_repetitions: { type: int, min: 1, max: 1000, default: 20, label: GETBULK repetitions,
                     description: "Objects asked for per GETBULK request while walking." }
  poll_interval_ms: { type: int, min: 100, max: 86400000, default: 10000, label: Poll interval,
                      description: "Milliseconds between walks of the device's objects, and reads of sysUpTime.0, the liveness check." }
  trap_port: { type: int, min: 1, max: 65535, label: Notification port,
               description: "The UDP port traps and informs are received on, 162 as standard; unset receives none." }
  trap_bind_address: { type: string, pattern: '^[0-9A-Fa-f.:]*$', max_length: 45, default: "", label: Notification bind address,
                       description: "The local address to receive notifications on with a port of this device's own; empty shares the port with every SNMP device of the core, each hearing its own agent." }
  trap_community: { type: string, secret: true, max_length: 255, default: "", label: Notification community,
                    description: "v1 and v2c notifications: accept only this community; empty accepts any." }
  local_engine_id: { type: string, pattern: '^[0-9A-Fa-fxX :.-]*$', max_length: 100, default: "", label: Local engine ID,
                     description: "v3 informs: this receiver's snmpEngineID in hex, 5 to 32 bytes, as configured on the agent; empty uses a random one for each opening." }

ports:
  - { port: 161, protocol: udp, role: control, note: "the agent; requests go from an ephemeral port of the core's" }
  - { port: null, protocol: udp, role: notification, listener: core, setting: trap_port, note: "traps and informs, when trap_port is set (162 as standard)" }

commands:
  get:
    summary: >
      GET objects by OID and return {varbinds: [{oid, type, value, hex}]}, for objects the named commands and state
      do not cover; an object state holds is updated from the answer too
    params:
      oids: { type: string, pattern: '^[0-9., ;]+$', max_length: 65536, required: true, label: OIDs,
              description: "One or more OIDs in dotted decimal, separated by commas or spaces, such as 1.3.6.1.2.1.1.3.0." }
    returns: value
  walk:
    summary: Every object under an OID, in order, as {varbinds}
    params:
      oid: { type: string, pattern: '^\.?[0-9]+(\.[0-9]+)+$', max_length: 1024, required: true, label: OID,
             description: "The subtree's root in dotted decimal." }
      limit: { type: int, min: 1, max: 100000000, label: Object limit,
               description: "Stop after this many objects; unset walks the whole subtree." }
    returns: value
  set:
    summary: >
      SET one object by OID to a typed value and return the agent's response as {varbinds}; fails with the agent's
      error-status (notWritable, wrongValue...) as the code
    params:
      oid: { type: string, pattern: '^\.?[0-9]+(\.[0-9]+)+$', max_length: 1024, required: true, label: OID,
             description: "The object instance to set, in dotted decimal." }
      type: { type: enum, values: [integer, string, hex, oid, ip_address, counter32, gauge32, timeticks, counter64, opaque], required: true, label: Type,
              description: "The value's SNMP type: string is UTF-8 text and hex is bytes for an OCTET STRING; gauge32 is also Unsigned32." }
      value: { type: string, max_length: 65536, required: true, label: Value,
               description: "The value as text: a decimal number, text, hex bytes, a dotted OID or an IPv4 address, as the type asks." }
    returns: value
  refresh:
    summary: Read the system group and walk every object now; answered when they have been read
    returns: ack
  set_ident_name:
    summary: "Set upsIdentName, then read its group back"
    params:
      value: { type: string, max_length: 63, required: true, label: Value, description: The new ident name. }
    returns: ack
  set_ident_attached_devices:
    summary: "Set upsIdentAttachedDevices, then read its group back"
    params:
      value: { type: string, max_length: 63, required: true, label: Value, description: The new ident attached devices. }
    returns: ack
  set_test_id:
    summary: "Set upsTestId, then read its group back"
    params:
      value: { type: enum, values: [no_tests_initiated, abort_test_in_progress, general_systems_test, quick_battery_test, deep_battery_calibration], required: true, label: Value, description: "The new test id, as UPS-MIB names its values." }
    returns: ack
  set_test_spin_lock:
    summary: "Set upsTestSpinLock, then read its group back"
    params:
      value: { type: int, min: -2147483648, max: 2147483647, required: true, label: Value, description: "The new test spin lock, as the MIB counts it." }
    returns: ack
  set_control_shutdown_type:
    summary: "Set upsShutdownType, then read its group back"
    params:
      value: { type: enum, values: [output, system], required: true, label: Value, description: "The new shutdown type, as UPS-MIB names its values." }
    returns: ack
  set_control_shutdown_after_delay:
    summary: "Set upsShutdownAfterDelay, then read its group back"
    params:
      value: { type: int, min: -1, max: 2147483648, required: true, label: Value, description: "The new shutdown after delay, in seconds." }
    returns: ack
  set_control_startup_after_delay:
    summary: "Set upsStartupAfterDelay, then read its group back"
    params:
      value: { type: int, min: -1, max: 2147483648, required: true, label: Value, description: "The new startup after delay, in seconds." }
    returns: ack
  set_control_reboot_with_duration:
    summary: "Set upsRebootWithDuration, then read its group back"
    params:
      value: { type: int, min: -1, max: 300, required: true, label: Value, description: "The new reboot with duration, in seconds." }
    returns: ack
  set_control_auto_restart:
    summary: "Set upsAutoRestart, then read its group back"
    params:
      value: { type: enum, values: ["on", "off"], required: true, label: Value, description: "The new auto restart, as UPS-MIB names its values." }
    returns: ack
  set_config_input_voltage:
    summary: "Set upsConfigInputVoltage, then read its group back"
    params:
      value: { type: int, min: 0, max: 2147483647, required: true, label: Value, description: "The new config input voltage, in RMS Volts." }
    returns: ack
  set_config_input_freq:
    summary: "Set upsConfigInputFreq, then read its group back"
    params:
      value: { type: int, min: 0, max: 2147483647, required: true, label: Value, description: "The new config input freq, in 0.1 Hertz." }
    returns: ack
  set_config_output_voltage:
    summary: "Set upsConfigOutputVoltage, then read its group back"
    params:
      value: { type: int, min: 0, max: 2147483647, required: true, label: Value, description: "The new config output voltage, in RMS Volts." }
    returns: ack
  set_config_output_freq:
    summary: "Set upsConfigOutputFreq, then read its group back"
    params:
      value: { type: int, min: 0, max: 2147483647, required: true, label: Value, description: "The new config output freq, in 0.1 Hertz." }
    returns: ack
  set_config_low_batt_time:
    summary: "Set upsConfigLowBattTime, then read its group back"
    params:
      value: { type: int, min: 0, max: 2147483647, required: true, label: Value, description: "The new config low batt time, in minutes." }
    returns: ack
  set_config_audible_status:
    summary: "Set upsConfigAudibleStatus, then read its group back"
    params:
      value: { type: enum, values: [disabled, enabled, muted], required: true, label: Value, description: "The new config audible status, as UPS-MIB names its values." }
    returns: ack
  set_config_low_voltage_transfer_point:
    summary: "Set upsConfigLowVoltageTransferPoint, then read its group back"
    params:
      value: { type: int, min: 0, max: 2147483647, required: true, label: Value, description: "The new config low voltage transfer point, in RMS Volts." }
    returns: ack
  set_config_high_voltage_transfer_point:
    summary: "Set upsConfigHighVoltageTransferPoint, then read its group back"
    params:
      value: { type: int, min: 0, max: 2147483647, required: true, label: Value, description: "The new config high voltage transfer point, in RMS Volts." }
    returns: ack

