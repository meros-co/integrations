quirks:
  - models: [all]
    severity: critical
    text: >
      set_control_shutdown_after_delay, set_control_startup_after_delay and set_control_reboot_with_duration turn
      the UPS's output off, on or off and on after the seconds given (RFC 1628 upsControl), whatever the load;
      set_control_shutdown_type says whether the output alone or the whole UPS goes off. A shutdown counting down
      is cancelled by writing -1. set_test_id with deep_battery_calibration discharges the battery.
  - models: [all]
    severity: info
    text: >
      set_test_id reads upsTestSpinLock first and writes it back with upsTestId in one SET, as RFC 1628 asks, so
      two managers cannot start tests over each other; an agent that changed the lock in between refuses the SET
      (inconsistentValue). test.id and the alarm table's descr name RFC 1628's well-known tests and alarms (an OID
      the RFC does not list stays in dotted decimal).
  - models: [all]
    severity: info
    text: >
      State and commands are named after UPS-MIB, the "ups" prefix left off: tables are keyed by the row index the
      agent gives (upsInputLineIndex, upsOutputLineIndex, upsBypassLineIndex, upsAlarmId), enumerations are the
      RFC's labels in snake case, and numbers are as the RFC counts them (RMS volts, 0.1 Hz, 0.1 A, watts, minutes
      and seconds), with the unit in each key's description. The alarm table is replaced as alarms come and go.
  - models: [all]
    severity: info
    text: >
      Each notification received is a message event, {event: message, address, args, source}: address is its
      snmpTrapOID (upsTraps 1 to 4: on battery, test completed, alarm entry added and removed), args is the same
      object as traps.last with the RFC's name, and a notification starts a poll half a second later.
  - models: [all]
    severity: info
    text: >
      v1 and v2c agents drop requests with a wrong community without answering, so a wrong community looks like an
      agent that is not there (disconnected, commands time out). SETs need the write community the card is
      configured with (write_community), or a v3 user with write access.
  - models: [all]
    severity: info
    text: >
      Opening for commands only walks nothing; a GET of sysUpTime.0 each interval stays as the liveness check, and
      notifications are still received.
