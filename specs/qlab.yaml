  new_cue:
    summary: "Create a cue of the given type; QLab selects it and answers its unique ID"
    params:
      cue_type: { type: enum, values: [audio, mic, video, camera, text, light, fade, network, midi, "midi file", timecode, group, start, stop, pause, load, reset, devamp, goto, target, arm, disarm, wait, memo, script, list, cuelist, "cue list", cart, cuecart, "cue cart"], required: true, label: Cue type, description: "Type of the new cue, as QLab names it; list, cuelist and cue list make a cue list, and cart, cuecart and cue cart make a cart." }
    send: { address: /new, args: [{ value: "{cue_type}", type: string }] }
    expect: { address: /reply/new, json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  new_cue_after:
    summary: "Create a cue of the given type after the given cue and answer its unique ID; not for carts, which also need a row and column"
    params:
      cue_type: { type: enum, values: [audio, mic, video, camera, text, light, fade, network, midi, "midi file", timecode, group, start, stop, pause, load, reset, devamp, goto, target, arm, disarm, wait, memo, script, list, cuelist, "cue list", cart, cuecart, "cue cart"], required: true, label: Cue type, description: "Type of the new cue, as QLab names it; list, cuelist and cue list make a cue list, and cart, cuecart and cue cart make a cart." }
      after_cue_id: { type: string, max_length: 64, pattern: "^[A-Za-z0-9-]+$", required: true, label: After cue unique ID, description: "Unique ID of the cue after which the new cue is placed." }
    send: { address: /new, args: [{ value: "{cue_type}", type: string }, { value: "{after_cue_id}", type: string }] }
    expect: { address: /reply/new, json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

