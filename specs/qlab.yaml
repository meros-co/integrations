    params:
      cue_id: { type: string, max_length: 64, pattern: "^[A-Za-z0-9-]+$", required: true, label: Cue unique ID, description: "Unique ID of the cue to move." }
      new_index: { type: int, required: true, min: 0, label: Index, description: "Position within the new parent, counted from 0 for the first place." }
