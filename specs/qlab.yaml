spec: 1
id: qlab
name: Figure 53 QLab
vendor: Figure 53
category: playback

source:
  - title: QLab 5 Documentation, Scripting & Automation, "QLab's OSC Dictionary"
    author: Figure 53
    url: https://qlab.app/docs/v5/scripting/osc-dictionary-v5/
    note: >
      Manufacturer-documented; current to QLab 5.5. Retrieved 2026-09-30. Sections
      used: Getting Started (UDP and TCP on 53000, SLIP framing over TCP), Getting
      status updates from QLab (/updates and the /update/... messages), Replies from
      QLab (/reply/... with a JSON string argument), Application messages, Workspace
      messages, Show Control Broadcast messages (/listen, QLab 5.3 and later), Cue
      messages, Workspace Settings messages, Group cue/List/Cart messages, Audio, Mic,
      Video, Camera, Text, Light, Fade, Network, MIDI, MIDI File, Timecode, Reset,
      Devamp and Script cue messages, valuesForKeys.
  - title: QLab 4 Documentation, Scripting, "QLab's OSC Dictionary"
    author: Figure 53
    url: https://qlab.app/docs/v4/scripting/osc-dictionary-v4/
    note: >
      Manufacturer-documented. Retrieved 2026-09-30. Sections used: Transport layer,
      Reply format, Update format, Application methods, Workspace methods, Cue
      methods, Settings methods, Group cue/Cue List/Cart methods, Audio, Mic, Video,
      Camera, Text, Light, Fade, Network, MIDI, MIDI File, Devamp and Script cue
      methods.
  - title: companion-module-figure53-qlab-advance
    author: Bitfocus Companion contributors
    url: https://github.com/bitfocus/companion-module-figure53-qlab-advance
    note: >
      MIT. Retrieved 2026-10-07. Read as corroboration only, no code used: a
      client keeping current asks every cue for one valuesForKeys key list
      whatever its type, re-reads a cue on /update/.../cue_id/{id}, gets no
      answer for a deleted cue, and receives /update/.../cue_id/__root__
      (QLab 5.5; earlier [root group of cue lists]) when the cue lists change.

# QLab answers queries with /reply/<address> carrying a JSON string, and pushes
# /update/... and /qlab/event/... messages to subscribed clients. Over TCP these
# arrive on the same connection; over UDP they go to port 53001 on the sender's
# address (both dictionaries, Getting Started / Transport layer), not to the
# sending socket. TCP also needs no keepalive: QLab drops an idle UDP client after
# 61 seconds and forgets its passcode, subscriptions and settings with it.
transport:
  type: osc-tcp
  port: 53000
  framing: slip
  timeout_ms: 1000
  probe: /version

settings:
  passcode: { type: string, secret: true, label: Passcode, description: "The OSC passcode set in the workspace's network settings; leave empty if the workspace has none." }

on_connect:
  - when_set: passcode
    send: { address: /connect, args: [ { value: "{settings.passcode}", type: string } ] }

ports:
  - { port: 53000, protocol: tcp, role: control }

