telemetry:
  # /updates 1 subscribes this client to /update/... pushes (QLab 5: application
  # message; QLab 4: workspace message, so rootless it reaches the front-most
  # workspace). /listen/... asks for show control broadcast events (QLab 5.3 and
  # later). /workspaces is answered with the open workspaces, and each one's
  # cue lists, cues and settings are read from there. Over TCP the subscription
  # lasts as long as the connection.
  subscribe:
    send:
      - { address: /updates, args: [ { value: "1", type: int } ] }
      - /listen/go
      - /listen/playhead
      - /listen/cue/start
      - /listen/cue/stop
      - /workspaces
  # The active cues of every workspace, and each one's times, once a second.
  poll:
    send:
      - { address: /runningOrPausedCues/shallow, reply_address: "^/reply/runningOrPausedCues/shallow$" }
    every_ms: 1000
  updates:
    # The open workspaces; each one's cue lists and settings are read.
    - address: "^/reply/workspaces$"
      json_match: { "$.status": "^ok$" }
      json_each: "$.data"
      each_match: { "$.uniqueID": "^([A-Za-z0-9-]+)$" }
      json: { name: "$.displayName", version: "$.version", port: "$.port", has_passcode: "$.hasPasscode" }
      state:
        "workspaces.{1}.name": "{name}"
        "workspaces.{1}.version": "{version}"
        "workspaces.{1}.port": "{port}"
        "workspaces.{1}.has_passcode": { value: "{has_passcode}", map: { "true": true, "false": false, "1": true, "0": false } }
      then_send: &workspace_reads
        - { address: "/workspace/{1}/cueLists", reply_address: "^/reply/workspace/[^/]+/cueLists$" }
        - { address: "/workspace/{1}/showMode", reply_address: "^/reply/workspace/[^/]+/showMode$" }
    # A workspace changed: its cue lists (and settings) are read again.
    - address: "^/update/workspace/([A-Za-z0-9-]+)$"
      then_send: *workspace_reads
    # QLab 5.5 reports a change to the cue lists themselves as one to the root group.
    - address: "^/update/workspace/([A-Za-z0-9-]+)/cue_id/(?:__root__|\\[root group of cue lists\\])$"
      then_send:
        - { address: "/workspace/{1}/cueLists", reply_address: "^/reply/workspace/[^/]+/cueLists$" }
    # The workspace is closing: everything known about it goes.
    - address: "^/update/workspace/([A-Za-z0-9-]+)/disconnect$"
      state:
        "workspaces.{1}": { delete: true }
    # A cue changed: its values, and its children if it is a list, cart or Group.
    - address: "^/update/workspace/([A-Za-z0-9-]+)/cue_id/([A-Za-z0-9-]+)$"
      then_send:
        - &values_for_keys { address: "/workspace/{1}/cue_id/{2}/valuesForKeys", args: [{ value: "[\"uniqueID\",\"number\",\"name\",\"listName\",\"displayName\",\"type\",\"colorName\",\"colorName/live\",\"secondColorName\",\"useSecondColor\",\"flagged\",\"armed\",\"notes\",\"autoLoad\",\"continueMode\",\"preWait\",\"postWait\",\"duration\",\"currentDuration\",\"parent\",\"cueTargetID\",\"cueTargetNumber\",\"fileTarget\",\"targetMode\",\"patchTargetID\",\"duckOthers\",\"duckLevel\",\"duckTime\",\"fadeAndStopOthers\",\"fadeAndStopOthersTime\",\"secondTriggerAction\",\"secondTriggerOnRelease\",\"skipIfDisarmed\",\"rate\",\"infiniteLoop\",\"hasFileTargets\",\"hasCueTargets\",\"levels\",\"sliderLevels\",\"isRunning\",\"isPaused\",\"isLoaded\",\"isBroken\",\"isAuditioning\",\"isPanicking\",\"isTailingOut\",\"isActionRunning\",\"isOverridden\",\"isWarning\",\"actionElapsed\",\"percentActionElapsed\",\"preWaitElapsed\",\"percentPreWaitElapsed\",\"postWaitElapsed\",\"percentPostWaitElapsed\",\"currentFileTime\",\"startTime\",\"endTime\",\"playCount\",\"lastSlicePlayCount\",\"lastSliceInfiniteLoop\",\"preservePitch\",\"doPitchShift\",\"doFade\",\"lockFadeToCue\",\"sliceMarkers\",\"muteChannels\",\"soloChannels\",\"numChannelsIn\",\"audioOutputPatchName\",\"audioOutputPatchNumber\",\"audioOutputPatchID\",\"patch\",\"audioMapID\",\"objects\",\"audioInputPatchName\",\"audioInputPatchID\",\"channelOffset\",\"channels\",\"anchor/x\",\"anchor/y\",\"blendMode\",\"clockType\",\"cropTop\",\"cropBottom\",\"cropLeft\",\"cropRight\",\"cueSize\",\"fillStage\",\"fullSurface\",\"fillStyle\",\"holdLastFrame\",\"layer\",\"opacity\",\"preserveAspectRatio\",\"quaternion\",\"scale/x\",\"scale/y\",\"smooth\",\"stageID\",\"stageName\",\"surfaceID\",\"translation/x\",\"translation/y\",\"videoEffects\",\"videoInputPatchName\",\"videoInputPatchID\",\"cameraPatch\",\"cueTargetId\"]", type: string }], reply_address: "^/reply/workspace/[^/]+/cue_id/[^/]+/valuesForKeys$" }
        - { address: "/workspace/{1}/cue_id/{2}/children/shallow", reply_address: "^/reply/workspace/[^/]+/cue_id/[^/]+/children/shallow$" }
    - address: "^/update/workspace/([^/]+)/cueList/([^/]+)/playbackPosition$"
      arg_types: s
      state: { "workspaces.{1}.cue_lists.{2}.playhead_id": "{arg0}" }
    # No argument: the list's playhead is unset.
    - address: "^/update/workspace/([^/]+)/cueList/([^/]+)/playbackPosition$"
      arg_types: ""
      state: { "workspaces.{1}.cue_lists.{2}.playhead_id": { delete: true } }
    # The cue lists and carts of a workspace, in order; the whole tree is replaced.
    - address: "^/reply/workspace/([^/]+)/cueLists$"
      json_match: { "$.status": "^ok$" }
      json_each: "$.data"
      each_match: { "$.uniqueID": "^([A-Za-z0-9-]+)$" }
