    params:
      cue_id: { type: string, max_length: 64, pattern: "^[A-Za-z0-9-]+$", required: true, label: Cue unique ID, description: "Unique ID of the cue to move." }
      new_index: { type: int, required: true, min: 0, label: Index, description: "Position within the cue's current parent, counted from 0 for the first place." }
    send: { address: "/move/{cue_id}", args: [{ value: "{new_index}", type: int }] }
    expect: { address: "/reply/move/{cue_id}", json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

