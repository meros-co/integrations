  save:
    summary: "Save the workspace to disk"
    send: { address: /save }
    returns: none

  undo:
    summary: "Undo the most recent change in the workspace"
    send: { address: /undo }
    returns: none

  redo:
    summary: "Redo the last undone change in the workspace"
    send: { address: /redo }
    returns: none

  thump:
    summary: "Heartbeat; answers the string thump"
