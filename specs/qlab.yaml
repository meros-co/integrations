  go:
    summary: "GO the current cue list on the cue standing by"
    send: { address: /go }
    returns: none

  go_to_cue:
    summary: "Jump the playhead to a cue and GO"
    params:
      cue: { type: string, max_length: 64, pattern: "^[A-Za-z0-9._-]+$", required: true, label: Cue, description: "Cue number as shown in QLab (letters, digits, dots, dashes and underscores); selected, playhead, playbackPosition and active address the selected cues, the cue at the playhead and all active cues." }
    send: { address: "/go/{cue}" }
    returns: none

  audition_go:
    summary: "Audition GO the current cue list"
    send: { address: /auditionGo }
    returns: none

  audition_go_to_cue:
    summary: "Jump the playhead to a cue and audition GO"
    params:
      cue: { type: string, max_length: 64, pattern: "^[A-Za-z0-9._-]+$", required: true, label: Cue, description: "Cue number as shown in QLab (letters, digits, dots, dashes and underscores); selected, playhead, playbackPosition and active address the selected cues, the cue at the playhead and all active cues." }
    send: { address: "/auditionGo/{cue}" }
    returns: none

  stop:
    summary: "Stop all playback, letting audio effects such as reverb decay"
    send: { address: /stop }
    returns: none

  hard_stop:
    summary: "Stop all playback and cut audio effects immediately"
    send: { address: /hardStop }
    returns: none

  pause:
    summary: "Pause all running cues"
    send: { address: /pause }
    returns: none

  resume:
    summary: "Resume all paused cues"
    send: { address: /resume }
    returns: none

  panic:
    summary: "Fade out over the workspace panic time, then hard stop everything"
    send: { address: /panic }
    returns: none

  panic_in_time:
    summary: "Panic over the given time instead of the workspace panic time"
    params:
      seconds: { type: float, required: true, min: 0, label: Panic time, description: "Seconds over which every running cue fades out before a hard stop, instead of the workspace panic time; 0 stops at once." }
    send: { address: /panicInTime, args: [{ value: "{seconds}", type: float }] }
    returns: none

  reset:
    summary: "Stop all cues, return the playhead to the top and revert temporary changes"
    send: { address: /reset }
    returns: none

  next_cue:
    summary: "Move the playhead forward one cue without firing"
    send: { address: /playhead/next }
    returns: none

  previous_cue:
    summary: "Move the playhead back one cue without firing"
    send: { address: /playhead/previous }
    returns: none

  next_sequence:
    summary: "Move the playhead to the next cue sequence"
    send: { address: /playhead/nextSequence }
    returns: none

  previous_sequence:
    summary: "Move the playhead to the previous cue sequence"
    send: { address: /playhead/previousSequence }
    returns: none

  set_playhead:
    summary: "Set the playhead of the active cue list to a cue by number"
    params:
      cue: { type: string, max_length: 64, pattern: "^[A-Za-z0-9._-]+$", required: true, label: Cue, description: "Cue number as shown in QLab (letters, digits, dots, dashes and underscores); selected, playhead, playbackPosition and active address the selected cues, the cue at the playhead and all active cues." }
    send: { address: "/playhead/{cue}" }
    returns: none

  set_playhead_by_id:
    summary: "Set the playhead of the active cue list to a cue by unique ID; 'none' unsets it"
    params:
      cue_id: { type: string, max_length: 64, pattern: "^[A-Za-z0-9-]+$", required: true, label: Cue unique ID, description: "Unique ID of the cue to put at the playhead; none unsets the playhead." }
    send: { address: "/playheadID/{cue_id}" }
    returns: none

  set_playhead_by_id_qlab4:
    summary: "Set the playhead of the active cue list to a cue by unique ID; 'none' unsets it (QLab 4 spelling)"
    params:
      cue_id: { type: string, max_length: 64, pattern: "^[A-Za-z0-9-]+$", required: true, label: Cue unique ID, description: "Unique ID of the cue to put at the playhead; none unsets the playhead." }
    send: { address: "/playheadId/{cue_id}" }
    returns: none

  clear_playhead:
    summary: "Unset the playhead of the active cue list"
    send: { address: /playhead/none }
    returns: none

  playhead_to_active:
    summary: "Move the playhead to the first active cue"
    send: { address: /playhead/active }
    returns: none

  playhead_to_selected:
    summary: "Move the playhead to the first selected cue"
    send: { address: /playhead/selected }
    returns: none

  select_cue:
