state:
  workspaces.*.cue_lists.*.playhead_id: { type: string, description: "Unique ID of the cue standing by in a cue list, keyed by workspace and cue list unique ID; absent when none is (/update ... /playbackPosition)" }
  playhead.number: { type: string, description: "Cue number at the playhead (show control broadcast, QLab 5.3 and later)" }
  playhead.name:   { type: string, description: "Name of the cue at the playhead" }
  playhead.id:     { type: string, description: "Unique ID of the cue at the playhead" }
  playhead.type:   { type: string, description: "Type of the cue at the playhead" }
  last_go.number:  { type: string, description: "Cue number of the most recent GO (QLab 5.3 and later)" }
  last_go.name:    { type: string, description: "Name of the cue of the most recent GO" }
  last_go.id:      { type: string, description: "Unique ID of the cue of the most recent GO" }
  last_go.type:    { type: string, description: "Type of the cue of the most recent GO" }
  last_started.number: { type: string, description: "Cue number of the most recently started cue (QLab 5.3 and later)" }
  last_started.name:   { type: string, description: "Name of the most recently started cue" }
  last_started.id:     { type: string, description: "Unique ID of the most recently started cue" }
  last_started.type:   { type: string, description: "Type of the most recently started cue" }
  last_stopped.number: { type: string, description: "Cue number of the most recently stopped cue (QLab 5.3 and later)" }
  last_stopped.name:   { type: string, description: "Name of the most recently stopped cue" }
  last_stopped.id:     { type: string, description: "Unique ID of the most recently stopped cue" }
  last_stopped.type:   { type: string, description: "Type of the most recently stopped cue" }
  cues.*.running:  { type: bool, description: "True after a cue start event, false after a cue stop event, keyed by cue unique ID (QLab 5.3 and later)" }
  workspaces.*.name: { type: string, description: "Display name of an open workspace, keyed by its unique ID" }
  workspaces.*.version: { type: string, description: "QLab version the workspace reports (QLab 5)" }
  workspaces.*.port: { type: int, description: "OSC port the workspace listens on (QLab 5)" }
  workspaces.*.has_passcode: { type: bool, description: "Whether the workspace has an OSC passcode (QLab 4)" }
  workspaces.*.cue_lists.*.index: { type: int, description: "Position of a cue list or cart in the sidebar, from 0" }
  workspaces.*.active.*: { type: string, description: "Unique IDs of the running or paused cues, in Active Cues order from 0" }
  workspaces.*.cues.*.index: { type: int, description: "Position of the cue in its list, cart or Group, from 0" }
  workspaces.*.cues.*.children.*: { type: string, description: "Unique IDs of a list's, cart's or Group's children, in order from 0" }
  workspaces.*.cues.*.number: { type: string, description: "Cue number; empty when the cue has none" }
  workspaces.*.cues.*.name: { type: string, description: "Cue name" }
  workspaces.*.cues.*.list_name: { type: string, description: "Name as the cue list shows it (the default name when the cue has no name)" }
  workspaces.*.cues.*.display_name: { type: string, description: "Display name of the cue" }
  workspaces.*.cues.*.type: { type: string, description: "Cue type: Audio, Video, Group, Cue List, Cart, Fade, ..." }
  workspaces.*.cues.*.color: { type: string, description: "Colour name (none, red, orange, green, blue, purple, and in QLab 5 more)" }
  workspaces.*.cues.*.color_live: { type: string, description: "Live colour name, which a reset clears" }
  workspaces.*.cues.*.second_color: { type: string, description: "Second colour name (QLab 5.2 and later)" }
  workspaces.*.cues.*.use_second_color: { type: bool, description: "Whether the second colour is shown (QLab 5.2 and later)" }
  workspaces.*.cues.*.flagged: { type: bool, description: "Whether the cue is flagged" }
  workspaces.*.cues.*.armed: { type: bool, description: "Whether the cue is armed" }
  workspaces.*.cues.*.notes: { type: string, description: "Notes of the cue" }
  workspaces.*.cues.*.auto_load: { type: bool, description: "Whether the cue auto-loads" }
  workspaces.*.cues.*.continue_mode: { type: int, description: "Continue mode: 0 none, 1 auto-continue, 2 auto-follow" }
  workspaces.*.cues.*.pre_wait: { type: float, unit: s, description: "Pre-wait in seconds" }
  workspaces.*.cues.*.post_wait: { type: float, unit: s, description: "Post-wait in seconds" }
  workspaces.*.cues.*.duration: { type: float, unit: s, description: "Duration in seconds" }
  workspaces.*.cues.*.current_duration: { type: float, unit: s, description: "Duration in seconds now, with a temporary duration or rate applied" }
  workspaces.*.cues.*.parent: { type: string, description: "Unique ID of the Group cue, cue list or cart the cue is in (for a cue list, QLab's root group)" }
  workspaces.*.cues.*.cue_target_id: { type: string, description: "Unique ID of the cue's target cue; empty when it has none" }
  workspaces.*.cues.*.cue_target_number: { type: string, description: "Number of the cue's target cue" }
  workspaces.*.cues.*.file_target: { type: string, description: "Path of the cue's file target" }
  workspaces.*.cues.*.target_mode: { type: int, description: "Fade and Reset cues: 0 targets a cue, 1 a patch" }
  workspaces.*.cues.*.patch_target_id: { type: string, description: "Unique ID of the patch a Fade or Reset cue targets" }
  workspaces.*.cues.*.duck_others: { type: bool, description: "Whether the cue ducks other audio" }
  workspaces.*.cues.*.duck_level: { type: float, unit: dB, description: "Duck level in dB (QLab 5)" }
  workspaces.*.cues.*.duck_time: { type: float, unit: s, description: "Duck time in seconds" }
  workspaces.*.cues.*.fade_and_stop_others: { type: int, description: "Fade and stop others: 0 none, 1 peers, 2 list or cart, 3 all" }
  workspaces.*.cues.*.fade_and_stop_others_time: { type: float, unit: s, description: "Fade and stop others time in seconds" }
  workspaces.*.cues.*.second_trigger_action: { type: int, description: "Second trigger action: 0 none, 1 panic, 2 stop, 3 hard stop, 4 pause, 5 devamp, 6 and 7 playlist (QLab 5)" }
  workspaces.*.cues.*.second_trigger_on_release: { type: bool, description: "Whether the second trigger fires on release" }
  workspaces.*.cues.*.skip_if_disarmed: { type: bool, description: "Whether the cue is skipped while disarmed (QLab 5)" }
  workspaces.*.cues.*.rate: { type: float, description: "Playback rate, 1 normal" }
