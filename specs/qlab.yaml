    verification: none
    notes: >
      QLab 4 OSC dictionary. Rootless workspace and cue messages go to the
      front-most workspace only; QLab 5 sends them to every open workspace
      listening on the port.

commands:
  get_version:
    summary: "QLab's version number"
    send: { address: /version }
    expect: { address: /reply/version, json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  get_workspaces:
    summary: "The open workspaces: uniqueID, displayName, and per version port or hasPasscode"
    send: { address: /workspaces }
    expect: { address: /reply/workspaces, json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  set_override_midi_input:
    summary: "Enable or disable MIDI input (Overrides)"
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "On allows it and off blocks it, like the switch in QLab's Overrides window." }
    send: { address: /overrides/midiInputEnabled, args: [{ value: "{enabled:bool01}", type: int }] }
    returns: none

  get_override_midi_input:
    summary: "Whether MIDI input is enabled (Overrides)"
    send: { address: /overrides/midiInputEnabled }
    expect: { address: /reply/overrides/midiInputEnabled, json_path: "$.data", json_equals: { "$.status": "ok" } }
    returns: value

  toggle_override_midi_input:
    summary: "Toggle MIDI input (Overrides)"
    send: { address: /overrides/toggleMidiInput }
    returns: none

  set_override_midi_output:
    summary: "Enable or disable MIDI output (Overrides)"
