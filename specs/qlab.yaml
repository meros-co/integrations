        "workspaces.{1}.cues.{2}.cue_size": "{cue_size}"
        "workspaces.{1}.cues.{2}.fill_stage": { value: "{fill_stage}", map: { "true": true, "false": false, "1": true, "0": false } }
        "workspaces.{1}.cues.{2}.full_surface": { value: "{full_surface}", map: { "true": true, "false": false, "1": true, "0": false } }
        "workspaces.{1}.cues.{2}.fill_style": "{fill_style}"
        "workspaces.{1}.cues.{2}.hold_last_frame": { value: "{hold_last_frame}", map: { "true": true, "false": false, "1": true, "0": false } }
        "workspaces.{1}.cues.{2}.layer": "{layer}"
        "workspaces.{1}.cues.{2}.opacity": "{opacity}"
        "workspaces.{1}.cues.{2}.preserve_aspect_ratio": { value: "{preserve_aspect_ratio}", map: { "true": true, "false": false, "1": true, "0": false } }
        "workspaces.{1}.cues.{2}.quaternion": "{quaternion}"
        "workspaces.{1}.cues.{2}.scale_x": "{scale_x}"
        "workspaces.{1}.cues.{2}.scale_y": "{scale_y}"
        "workspaces.{1}.cues.{2}.smooth": { value: "{smooth}", map: { "true": true, "false": false, "1": true, "0": false } }
        "workspaces.{1}.cues.{2}.stage_id": "{stage_id}"
        "workspaces.{1}.cues.{2}.stage_name": "{stage_name}"
        "workspaces.{1}.cues.{2}.surface_id": "{surface_id}"
        "workspaces.{1}.cues.{2}.translation_x": "{translation_x}"
        "workspaces.{1}.cues.{2}.translation_y": "{translation_y}"
        "workspaces.{1}.cues.{2}.video_effects": "{video_effects}"
        "workspaces.{1}.cues.{2}.video_input_patch_name": "{video_input_patch_name}"
        "workspaces.{1}.cues.{2}.video_input_patch_id": "{video_input_patch_id}"
        "workspaces.{1}.cues.{2}.camera_patch": "{camera_patch}"
    # QLab 4 spells the target's key cueTargetId.
    - address: "^/reply/workspace/([^/]+)/cue_id/([A-Za-z0-9-]+)/valuesForKeys$"
      json_match: { "$.status": "^ok$" }
      json: { target: "$.data.cueTargetId" }
      state: { "workspaces.{1}.cues.{2}.cue_target_id": "{target}" }
    # The active (running or paused) cues of each workspace; their times are read.
    - address: "^/reply/runningOrPausedCues/shallow$"
      json_match: { "$.workspace_id": "^([A-Za-z0-9-]+)$", "$.status": "^ok$" }
      replace: "workspaces.{1}.active"
      json_each: "$.data"
      each_match: { "$.uniqueID": "^([A-Za-z0-9-]+)$" }
      json: {}
      state: { "workspaces.{1}.active.{index}": "{2}" }
      then_send:
        - { address: "/workspace/{1}/cue_id/{2}/valuesForKeys", args: [{ value: "[\"isRunning\",\"isPaused\",\"isLoaded\",\"isBroken\",\"isAuditioning\",\"isPanicking\",\"isTailingOut\",\"isActionRunning\",\"isOverridden\",\"isWarning\",\"actionElapsed\",\"percentActionElapsed\",\"preWaitElapsed\",\"percentPreWaitElapsed\",\"postWaitElapsed\",\"percentPostWaitElapsed\",\"currentFileTime\",\"currentDuration\"]", type: string }], reply_address: "^/reply/workspace/[^/]+/cue_id/[^/]+/valuesForKeys$" }
    - address: "^/reply/workspace/([^/]+)/showMode$"
      json_match: { "$.status": "^ok$" }
      json: { value: "$.data" }
      state:
        "workspaces.{1}.show_mode": { value: "{value}", map: { "true": true, "false": false, "1": true, "0": false } }
    # Show control broadcast events (QLab 5.3 and later).
    - address: "^/qlab/event/workspace/playhead$"
      state:
        playhead.number: "{arg0}"
        playhead.name: "{arg1}"
        playhead.id: "{arg2}"
        playhead.type: "{arg3}"
    - address: "^/qlab/event/workspace/go$"
      state:
        last_go.number: "{arg0}"
        last_go.name: "{arg1}"
        last_go.id: "{arg2}"
        last_go.type: "{arg3}"
    - address: "^/qlab/event/workspace/cue/start$"
      state:
        last_started.number: "{arg0}"
        last_started.name: "{arg1}"
        last_started.id: "{arg2}"
        last_started.type: "{arg3}"
        "cues.{arg2}.running": "true"
    - address: "^/qlab/event/workspace/cue/stop$"
      state:
        last_stopped.number: "{arg0}"
        last_stopped.name: "{arg1}"
        last_stopped.id: "{arg2}"
        last_stopped.type: "{arg3}"
        "cues.{arg2}.running": "false"

quirks:
  - models: [all]
    severity: warning
    text: >
      QLab answers a query with /reply/<the address sent> carrying one string
      argument holding JSON: workspace_id, address, status (ok, error, or in QLab 5
      denied) and data. A query returns data; a reply whose status is error or
      denied fails it, with the status in the error message.

  - models: [all]
    severity: info
    text: >
      Actions (go, start, setting a property, ...) produce no reply by default, so
      they report unverified. /alwaysReply would make QLab answer every message, but
      the answer differs between ok and error only inside its JSON, which the
      format cannot inspect, so it is not used.

  - models: [all]
    severity: warning
    text: >
      A passcoded workspace rejects messages until /connect has been sent with the
      passcode. The /reply/connect answer (ok, badpass or error) is not inspected,
      so a wrong passcode shows up only as denied (QLab 5) or error replies to later
      queries. QLab 5 adds a growing delay after repeated wrong passcodes, which is
      why /connect is not sent at all when no passcode is configured. Over TCP the
      connection stays authorised until it closes; over UDP QLab forgets the client
      after 61 seconds of silence.

  - models: [all]
    severity: warning
    text: >
      Workspace and cue messages are sent rootless (/go, /cue/...), without a
      /workspace/{id} prefix. QLab 5 delivers them to every open workspace
      listening on the port, so with two workspaces open one GO fires both and a
      query is answered once per workspace; the first answer is taken. QLab 4
      delivers them to the front-most workspace only.

  - models: [all]
    severity: info
    text: >
      Cue numbers are letters, digits, dots, dashes and underscores. The dictionary
      says spaces do not work in OSC addresses, and the pattern also refuses the
      OSC wildcards * ? [ ], which would address many cues at once. The special
      addresses selected, playhead, playbackPosition and active fit the pattern and
      address the selected cues, the cue at the playhead, and all active cues.
      Unique IDs are letters, digits and dashes.

  - models: [all]
    severity: critical
    text: >
      panic fades every running cue in the workspace over the panic time, then
      hard stops; a second panic during the fade hard stops at once. It is not a
      pause and is not scoped to the current cue list. dashboard_clear sets every
      light to its home value, which the dictionary warns is generally a blackout.

  - models: [all]
    severity: warning
    text: >
      delete_cue, delete_cue_by_id, delete_selected, delete_active, new_cue,
      new_cue_after, move_cue, move_cue_to_parent and renumber change the workspace
      itself. renumber needs positive start_number and increment; the format has no
      exclusive minimum, so zero is not refused before sending.

  - models: [qlab-4]
    severity: warning
    text: >
      QLab 4 spells some addresses with Id where QLab 5 uses ID (playheadId,
      cueTargetId, playheadId on a cue list), so those are separate *_qlab4
      commands. QLab 4's duckLevel used a 0-4 scale rather than dB and is not
      included. Its second trigger actions are 0-4 only (5 devamp, 6 and 7 playlist
      are QLab 5), its colours are none, red, orange, green, blue and purple only,
      and its level and slider outputs go to 64, not 128. loadAt with a negative
      time (counted from the end) is documented for QLab 5 only.

  - models: [all]
    severity: info
    text: >
      Boolean arguments are sent as int 1 or 0; both dictionaries read 0 as false
      and any other number as true.

  - models: [all]
    severity: info
    text: >
      Level arguments are dB. The dictionary gives no fixed range: the floor and
      ceiling are the workspace's volume limits. QLab also accepts a string such as
      -inf for silence, which these float parameters cannot send.

  - models: [all]
    severity: warning
    text: >
      State is read as QLab's dictionary describes for a client keeping current.
      On connecting the client subscribes to /updates and asks for /workspaces;
      each open workspace's cue lists are read (/workspace/{id}/cueLists, the
      whole tree, which replaces what was known), then every cue's values with
      valuesForKeys and every cue list's playhead. /update/workspace/{id} reads
      the cue lists again, /update/.../cue_id/{id} reads that cue's values and
      its children, /update/.../playbackPosition sets or clears a list's
      playhead, and /update/.../disconnect drops the workspace. The running or
      paused cues are polled once a second (/runningOrPausedCues/shallow) and
      each one's elapsed times read. A full re-read empties the cue tree for
      the moment it takes to arrive, and asks each cue's values again, one
      query per cue: a large workspace takes a while. The /listen events
      (playhead, GO, cue start and stop) exist from QLab 5.3; the rules expect
      the default event format, and changing it with /eventFormat breaks them.
      The dictionary does not say how pause, panic, stop-all and reset-all
      events are addressed, so those are not used.

  - models: [all]
    severity: info
    text: >
      go_to_cue on a cue inside a cart, or on a number that matches no cue, does
      nothing: carts have no playhead. Use start_cue there. The cue_list parameter
      of the cue list playhead commands must name a cue list.

  - models: [all]
    severity: warning
    text: >
      The cue tree goes eight levels deep: cue lists and carts, then up to seven
      levels of nested Group cues. Cues nested deeper are not in state from the
      cue lists, though an update to one still reads its values. A cue deleted
      from inside a list or Group leaves the parent's children list at once,
      but its own entry stays until the workspace's cue lists are next read in
      full, since QLab answers no query about a deleted cue.

  - models: [all]
    severity: info
    text: >
      valuesForKeys asks every cue for one list of keys; a cue answers with
      the ones that apply to its type (start time for Audio, opacity for Video
      and so on), and the rest stay absent from its state. Values QLab reports
      as arrays or dictionaries (levels, slice markers, crop, objects, text
      format, quaternion) are kept as JSON text. Elapsed times are polled once
      a second, so they step; remaining time is current_duration minus
      action_elapsed. Cue-specific state covers the properties QLab can read;
      for Text cues the format runs, for Light cues the command text.

  - models: [all]
    severity: info
    text: >
      API limits (not in QLab's OSC dictionary): a Script cue's source can be
      read but not written; the light patch, the video stages' regions and the
      audio maps can be read but only partly written; a Fade cue's curve shape
      cannot be set, only its type (1D curve or 2D path) and its points
      (Network cues); and the audio output patch a cue uses is edited through
      the workspace settings commands, by patch unique ID, rather than through
      the cue. Video effects are addressed by their position in the cue's list.
      A Timecode cue's start and end times are timecode text, set with
      set_cue_timecode_start_time and set_cue_timecode_end_time; the same keys
      read as seconds on Audio and Video cues, so start_time and end_time are
      text in state.

  - models: [all]
    severity: info
    text: >
      Increment and decrement (/+ and /-), /toggle on booleans (QLab 5.2) and
      OSC wildcards in cue numbers are not offered: every command sets an
      absolute value, and the cue pattern refuses * ? [ ]. QLab's own toggle
      messages are offered where the dictionary has them.
