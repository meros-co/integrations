telemetry:
  # /updates 1 subscribes this client to /update/... pushes (QLab 5: application
  # message; QLab 4: workspace message, so rootless it reaches the front-most
  # workspace). /listen/... asks for show control broadcast events (QLab 5.3 and
  # later). /workspaces is answered with the open workspaces, and each one's
  # cue lists, cues and settings are read from there. Over TCP the subscription
  # lasts as long as the connection.
  subscribe:
    send:
      - { address: /updates, args: [ { value: "1", type: int } ] }
      - /listen/go
      - /listen/playhead
      - /listen/cue/start
      - /listen/cue/stop
      - /workspaces
  # The active cues of every workspace, and each one's times, once a second.
  poll:
    send:
      - { address: /runningOrPausedCues/shallow, reply_address: "^/reply/runningOrPausedCues/shallow$" }
    every_ms: 1000
  updates:
    # The open workspaces; each one's cue lists and settings are read.
    - address: "^/reply/workspaces$"
      json_match: { "$.status": "^ok$" }
      json_each: "$.data"
      each_match: { "$.uniqueID": "^([A-Za-z0-9-]+)$" }
      json: { name: "$.displayName", version: "$.version", port: "$.port", has_passcode: "$.hasPasscode" }
      state:
        "workspaces.{1}.name": "{name}"
        "workspaces.{1}.version": "{version}"
        "workspaces.{1}.port": "{port}"
        "workspaces.{1}.has_passcode": { value: "{has_passcode}", map: { "true": true, "false": false, "1": true, "0": false } }
      then_send: &workspace_reads
        - { address: "/workspace/{1}/cueLists", reply_address: "^/reply/workspace/[^/]+/cueLists$" }
        - { address: "/workspace/{1}/showMode", reply_address: "^/reply/workspace/[^/]+/showMode$" }
