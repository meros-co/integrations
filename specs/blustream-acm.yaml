    summary: Turn a transmitter's HTTPS web access on or off (IN iii HTTPS ON/OFF)
    params:
      input: *input_one
      enabled: { type: bool, required: true, label: HTTPS, description: "On serves the transmitter's web page over HTTPS." }
    send:
      - { models: *gen2, message: "IN {input:03d} HTTPS {enabled:map.upper_onoff}" }
    returns: none

  set_input_audio:
    summary: Choose a transmitter's audio path (IN iii AUDAH/AUDAD/AUDHA/AUDHH/AUDHD/AUDDA/AUDDH)
    params:
      input: *input_one
      path: { type: enum, values: [AUDAH, AUDAD, AUDHA, AUDHH, AUDHD, AUDDA, AUDDH], required: true, label: Audio path,
              description: "AUDAH analog to HDMI, AUDAD analog to Dante, AUDHA HDMI to analog, AUDHH HDMI to HDMI, AUDHD HDMI to Dante, AUDDA Dante to analog, AUDDH Dante to HDMI." }
    send:
      - { models: *gen2, message: "IN {input:03d} {path}" }
