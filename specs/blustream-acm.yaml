    send:
      - { models: *all, message: "OUT {output:03d} STATUS" }
    returns: none

  get_all_output_status:
    summary: Print every receiver's detail report (OUT STATUS)
    send:
      - { models: *all, message: "OUT STATUS" }
    returns: none

  reboot_output:
    summary: Restart a receiver, applying its new settings (OUT ooo RB)
    params: { output: *output_all }
    send:
      - { models: *all, message: "OUT {output:03d} RB" }
    returns: none

  reset_output:
    summary: Reset a receiver, or every receiver, to factory settings (OUT ooo RESET)
    params: { output: *output_all }
    send:
      - { models: *all, message: "OUT {output:03d} RESET" }
    returns: none

