    send:
      - { models: [acm1000], message: "OUT {output:03d} FALLBACK {input:03d}" }
    returns: none

  # ── Multiview (ACM500) ───────────────────────────────────────────────────
  set_output_multiview_preset:
    summary: Show a multiview preset on an output (OUT ooo MVP mvpid)
    params:
      output: *output_all
      preset: &mv_preset { type: int, min: 1, max: 100, required: true, label: Multiview preset, description: "The multiview preset, 1-100." }
    send:
      - { models: [acm500], message: "OUT {output:03d} MVP {preset:02d}" }
    returns: none

  set_output_multiview_layout:
    summary: Show a multiview layout on an output (OUT ooo MVL lo)
    params:
      output: *output_all
      layout: &mv_layout { type: int, min: 1, max: 100, required: true, label: Layout, description: "The multiview layout, 1-100." }
    send:
      - { models: [acm500], message: "OUT {output:03d} MVL {layout:02d}" }
    returns: none

  set_output_multiview_layouts:
    summary: Choose which multiview layouts an output offers (OUT ooo MVLA list)
    params:
      output: *output_all
      layouts: &mv_list { type: string, pattern: '^(ALL|NONE|[0-9]{1,3}(,[0-9]{1,3}){0,99})$', required: true, label: Layouts,
                          description: "Numbers 1-100 separated by commas, or ALL or NONE." }
    send:
      - { models: [acm500], message: "OUT {output:03d} MVLA {layouts}" }
    returns: none

  set_output_multiview_presets:
    summary: Choose which multiview presets an output offers (OUT ooo MVPA list)
    params:
      output: *output_all
      presets: *mv_list
    send:
      - { models: [acm500], message: "OUT {output:03d} MVPA {presets}" }
    returns: none

  route_multiview_window:
    summary: Route an input to one window of an output's multiview (OUT ooo W widx FR iii)
    params:
      output: *output_all
      window: &mv_window { type: int, min: 1, max: 16, required: true, label: Window, description: "The window in the layout, from 1 (in a PIP layout, 1 is the background)." }
      input: &input_or_clear { type: int, min: 0, max: 254, required: true, label: Input, description: "The transmitter's input ID, or 0 to clear the window." }
    send:
      - { models: [acm500], message: "OUT {output:03d} W {window:02d} FR {input:03d}" }
    returns: none

  set_output_aspect:
    summary: Fit an ACM500 output's picture to the screen or keep its aspect ratio (OUT ooo ASPECT FIT/MAINTAIN)
    params:
