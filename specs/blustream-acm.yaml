commands:
  # ── System ───────────────────────────────────────────────────────────────
  get_status:
    summary: Print the system report, every input's and output's state and the network settings; its lines update state (STATUS)
    send:
      - { models: &all [acm210, acm500, acm1000], message: "STATUS" }
    returns: none

  get_version:
    summary: Print the ACM500's, AVP2000's, MCU's and secondary stream's versions (VERSION)
    send:
      - { models: [acm500], message: "VERSION" }
    returns: none

  set_ir:
    summary: Turn the ACM's IR control input on or off (IR ON/OFF)
    params:
      enabled: { type: bool, required: true, label: IR control, description: "On accepts IR commands from a control system; off ignores them." }
    send:
      - { models: *all, message: "IR {enabled:map.upper_onoff}" }
    returns: none

  set_preview_image:
    summary: Turn the web GUI's preview images on or off (PREVIEW IMAGE ON/OFF)
    params:
      enabled: { type: bool, required: true, label: Preview images, description: "On has the ACM fetch screen grabs of the sources for its web GUI." }
    send:
      - { models: *all, message: "PREVIEW IMAGE {enabled:map.upper_onoff}" }
    returns: none

  set_serial_baud:
    summary: Set the ACM's RS-232 port baud rate (RSB x)
    params:
      baud: { type: enum, values: ["9600", "19200", "38400", "57600", "115200"], required: true, label: Baud rate,
              description: "Bits per second of the ACM's DB9 control port; 57600 by default." }
    send:
      - { models: *all, message: "RSB {baud:map.rsb_code}" }
    returns: none

  reboot:
    summary: Restart the ACM (REBOOT, or ACM REBOOT)
    send:
      - { models: [acm210], message: "REBOOT" }
      - { models: [acm1000], message: "ACM REBOOT" }
    returns: none

  factory_reset:
    summary: Reset the ACM's system settings to default, keeping its network settings (RESET)
    send:
      - { models: *all, message: "RESET" }
    returns: none

  reset_network:
    summary: Reset the ACM's network settings to default (RESET NB)
    send:
      - { models: *all, message: "RESET NB" }
    returns: none

  factory_reset_all:
    summary: Reset the ACM's system and network settings to default, confirming with Yes (RESET ALL, Yes)
    send:
      - { models: *all, message: "RESET ALL" }
      - { models: *all, message: "Yes" }
    returns: none

  # ── Output routing ───────────────────────────────────────────────────────
  route:
    summary: Route an input to an output, or to every output, with all its signals (OUT ooo FR yyy)
    params:
      output: &output_all { type: int, min: 0, max: 767, required: true, label: Output,
                            description: "The receiver's output ID from 1, or 0 for every output." }
      input: &input_one { type: int, min: 1, max: 254, required: true, label: Input,
                          description: "The transmitter's input ID, from 1." }
    send:
      - { models: *all, message: "OUT {output:03d} FR {input:03d}" }
    returns: none

  route_signal:
    summary: Fix one signal of an output to an input, apart from its video (OUT ooo VFR/AFR/RFR/SFR/UFR/CFR yyy)
    params:
      output: *output_all
      signal: &signal { type: enum, values: [video, audio, ir, serial, usb, cec], required: true, label: Signal,
                        description: "Which signal to route: video, audio, IR, RS-232, USB or CEC." }
      input: *input_one
    send:
      - { models: *all, message: "OUT {output:03d} {signal:map.signal_route} {input:03d}" }
    returns: none

  set_signal_follow:
    summary: Let one of an output's signals follow its main routing again (OUT ooo VFR/AFR/... AUTO)
    params:
      output: *output_all
      signal: *signal
    send:
      - { models: *all, message: "OUT {output:03d} {signal:map.signal_route} AUTO" }
    returns: none

  # ── Outputs (receivers) ──────────────────────────────────────────────────
  set_output_enabled:
    summary: Turn an output on or off (OUT ooo ON/OFF)
    params:
      output: *output_all
      enabled: { type: bool, required: true, label: Enabled, description: "On sends the receiver's picture; off blanks it." }
    send:
      - { models: *all, message: "OUT {output:03d} {enabled:map.upper_onoff}" }
    returns: none

  set_output_id:
    summary: Give an online receiver another output ID, swapping with the receiver that has it (OUT ooo ID id)
    params:
      output: &output_one { type: int, min: 1, max: 767, required: true, label: Output, description: "The receiver's output ID, from 1." }
      id: { type: int, min: 1, max: 767, required: true, label: New ID, description: "The output ID to give it; a receiver already holding it takes the old ID." }
    send:
      - { models: *all, message: "OUT {output:03d} ID {id:03d}" }
    returns: none

  set_fast_switching:
    summary: Turn an output's fast switching on or off (OUT ooo FAST ON/OFF)
    params:
      output: *output_all
      enabled: { type: bool, required: true, label: Fast switching, description: "On switches sources without re-syncing the display." }
    send:
      - { models: &gen2 [acm210, acm1000], message: "OUT {output:03d} FAST {enabled:map.upper_onoff}" }
    returns: none

  set_hdr:
    summary: Turn an output's HDR on or off (OUT ooo HDR ON/OFF)
    params:
      output: *output_all
      enabled: { type: bool, required: true, label: HDR, description: "On passes HDR to the display." }
    send:
      - { models: *gen2, message: "OUT {output:03d} HDR {enabled:map.upper_onoff}" }
    returns: none

  set_output_cec:
    summary: Turn CEC control of an output's display on or off (OUT ooo CEC ON/OFF)
    params:
      output: *output_all
      enabled: { type: bool, required: true, label: CEC, description: "On lets the receiver control its display over CEC." }
    send:
      - { models: *all, message: "OUT {output:03d} CEC {enabled:map.upper_onoff}" }
    returns: none

  set_output_id_osd:
    summary: Show an output's ID on its display until hidden, or hide it (OUT ooo OSD ON/OFF)
    params:
      output: *output_all
      shown: { type: bool, required: true, label: Show ID, description: "On shows the receiver's ID on screen; off hides it." }
    send:
      - { models: *all, message: "OUT {output:03d} OSD {shown:map.upper_onoff}" }
    returns: none

  show_output_id_osd_for:
    summary: Show an output's ID on its display for a time (OUT ooo OSD ON time)
    params:
      output: *output_all
      seconds: &led_seconds { type: int, min: 1, max: 3600, required: true, label: Time, description: "How long, in seconds; the ACM500's help text gives 90." }
    send:
      - { models: *all, message: "OUT {output:03d} OSD ON {seconds}" }
    returns: none

  set_output_led_flash:
    summary: Flash a receiver's power LED until stopped, or stop it (OUT ooo FLS ON/OFF)
    params:
      output: *output_all
      flashing: { type: bool, required: true, label: Flash, description: "On flashes the receiver's LED to find it; off stops." }
    send:
      - { models: *all, message: "OUT {output:03d} FLS {flashing:map.upper_onoff}" }
    returns: none

  flash_output_led_for:
    summary: Flash a receiver's power LED for a time (OUT ooo FLS ON time)
