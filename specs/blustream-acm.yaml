    summary: Print an ACM1000 receiver's details (OUT ooo ASTPARAM)
    params: { output: *output_one }
    send:
      - { models: [acm1000], message: "OUT {output:03d} ASTPARAM" }
    returns: none

  set_output_hotplug:
    summary: Turn an ACM1000 receiver's hot plug on or off (OUT ooo HOTPLUG ON/OFF)
    params:
