spec: 1
id: blustream-acm
name: Blustream Multicast ACM controllers (Telnet and RS-232 API)
vendor: Blustream
category: router

# Blustream's Advanced Control Modules run a Multicast AV-over-IP system: the
# ACM210 the IP50, IP200, IP250, IP300 and IP350 ranges, the ACM500 the
# IP500UHD and IP510UHD (SDVoE), the ACM1000 the IP200-IP350 ranges with
# presets, groups and macros of its own. Each takes one plain-text command
# set over Telnet on its control LAN port (TCP 23 by default) and its RS-232
# port, as its help text (the "<model> - API" download, the ACM's answer to
# HELP) lists it. Transmitters are the system's inputs (iii, 001-254 by ID)
# and receivers its outputs (ooo, 001-767 by ID), written with three digits;
# 000 means every input or output where the help text allows it. The ACM
# accepts numbers with or without leading zeros and ignores spaces (manual
# p.44); commands are sent as the help texts write them.
#
# Blustream documents no answer to a command, so commands are sent without
# waiting (reply: none). The STATUS report, which the manual prints (p.45),
# lists every input and output with its routing, and is polled; so are the
# OUT and IN detail reports when asked for.
#
# Not here: the ACM200 (discontinued; Blustream no longer publishes its API
# document), the help commands, the ACM1000's EVENT MACRO scheduler commands
# (their help text leaves the time and day fields' format unexplained), and
# the web GUI.
source:
  - title: "ACM210 - API (ACM210 Advanced Control Module Help, firmware 3.9.0c)"
    author: Blustream
    url: https://www.blustream.co.uk/Attachment/DownloadFile?downloadId=836
    note: >
      Manufacturer document, the ACM210's help text: system information
      (STATUS), system control (IR, PREVIEW IMAGE, RSB 0-4, REBOOT, RESET,
      RESET NB, RESET ALL with Yes), output control (OUT ooo ON/OFF, ID,
      FR/VFR/AFR/RFR/SFR/UFR/CFR yyy or AUTO, FAST, HDR, CEC, OSD, FLS, DEL,
      RES rr 0-19, ROTATE 0-3, STRETCH, HTTPS, AUDSD/AUDHA/AUDHH/AUDHD/AUDDA/
      AUDDH, LAN2M0-4, ARC OFF/HDMI/OPT, CEC and IR guest commands, NAME, MODE
      MX/VW, DBG, BTN, IR, MUTE, PAUSE, AUTOON ENABLED/DISABLED, LED 0-9, SG
      with BR 0-9 and BIT, GUEST, HDCP BYP/V14/V22, SSM L/N, STATUS, RB,
      RESET), input control (ID, DEL, RB, RESET, AUD AUTO/HDMI/ANA, HTTPS,
      AUDAH/AUDAD/AUDHA/AUDHH/AUDHD/AUDDA/AUDDH, LAN2M0-4, SWMODE 00-04,
      TGMODE 0/1, NAME, CEC, IR, FLS, LED, SG, GUEST, HDCP, SSM, EFR, ARC,
      STATUS), EDID CP and DF 00-33, CLOSEACMGUEST, the video wall commands
      (VW idx CREATE, NAME, DEL, OUT, C cidx CREATE/NAME/APPLY/DEL, G gidx,
      S, OW/VW, OH/VH, STATUS), project control (SCAN, SCAN STATUS/RESET/OSD,
      ASSIGN RESET/DF/INDEX/AUTO, with REPLACE), GPIO gg DIR/SET/GET/STATUS,
      and network (NET LAN2 DHCP, LAN1/LAN2 IP/GW/SM, RB, TN, SSH, WEB,
      HTTPS, DNS).
  - title: "ACM500 - API (IP Control Box ACM500 Advanced Control Module Help)"
    author: Blustream
    url: https://www.blustream.co.uk/Attachment/DownloadFile?downloadId=620
    note: >
      Manufacturer document, the ACM500's help text: STATUS, VERSION, IR,
      PREVIEW IMAGE, RSB, RESET/NB/ALL; output ON/OFF, ID, the FR family,
      multiview (MVP, MVL, MVLA, MVPA, W widx FR), CEC on/off and the named
      CEC commands (POWERON ... MUTE), OSD, FLS, DEL, RES 0-21, NAME, MODE
      MX/VW/MV, TXMODE, BTN, IR, IRVAL 5V/12V, MUTE, AUTOON ON/OFF, LED, SG
      with BR 0-6, GUEST, STATUS, ASPECT FIT/MAINTAIN, DISPLAYMODE DIS 0/1,
      RB, RESET; input ID, DEL, RB, RESET, AUD, NAME, CEC, FLS, RXMODE,
      STREAMDBG, IR, IRVAL, LED, SG, GUEST, STATUS, named CEC commands, the
      secondary stream (SS STATUS, MSURL, SSURL, SNAPURL, MAINENCATTR,
      SUBENCATTR, SS MAIN/SUB/PIC); EDID DL, CP and DF 00-23; CLOSEACMGUEST;
      the video wall commands; multiview presets (MVP) and PIP layouts (PIP);
      SCAN, ASSIGN RESET/AUTO; GPIO; NET LAN2 DHCP, LAN1/LAN2 IP/GW/SM, RB, TN.
  - title: "ACM1000 - API (ACM1000 Advanced Control Module Help, firmware 2.5.9)"
    author: Blustream
    url: https://www.blustream.co.uk/Attachment/DownloadFile?downloadId=1122
    note: >
      Manufacturer document, the ACM1000's help text: the ACM210's system,
      output, input, EDID, video wall, project and network commands (no SSH,
      WEB or HTTPS on the ACM itself, RES codes 0, 3, 4 and 7-23 for
      IP300-350 and 0-13 for IP200-250, SWMODE 1-6, IN TGMODE without an
      input, EDID DF 00-18 on IP200-250 and 00-33 on IP300-350); PRE xx AP,
      MACRO xx; GPIO VCC SET VOLTS, GPIO gg SET VOLTS/CURR/0-1 (01-02
      outputs, 03-04 inputs), GET, STATUS; IN/OUT ASTPARAM and HOTPLUG, OUT
      FALLBACK, PRE idx ADD/RM RX TX, PRE idx ON/OFF, GRP idx ON/OFF/AD/RM/FR,
      ACM REBOOT, and the EVENT MACRO commands.
  - title: "Blustream Multicast ACM200 / ACM210 Advanced Control Module User Manual, Revision 1.6"
    author: Blustream
    url: https://www.blustream.co.uk/Attachment/DownloadFile?downloadId=1393
    note: >
      Manufacturer document. Control port 23, default control LAN address
      192.168.0.225, RS-232 57600 8N1 with RSB codes p.4; Telnet port and
      baud rate settings p.38; the RS-232 and Telnet section (carriage return
      after each command, spaces ignored, 1 = 01 = 001, up to 762
      transmitters and receivers) p.44; the STATUS, OUT xxx STATUS, IN xxx
      STATUS and VW STATUS reports p.45-46.

transport:
  type: line-tcp
  port: 23
  framing: terminated
  terminator: cr
  encoding: ascii
  timeout_ms: 3000
  # Blustream documents no answer to a command, only the reports the status
  # commands print: commands are sent without waiting.
  reply: none

maps:
  upper_onoff: { "true": "ON", "false": "OFF" }
  enabled_word: { "true": "ENABLED", "false": "DISABLED" }
  rsb_code: { "115200": "0", "57600": "1", "38400": "2", "19200": "3", "9600": "4" }
  guest_baud_wide: { "300": "0", "600": "1", "1200": "2", "2400": "3", "4800": "4", "9600": "5", "19200": "6", "38400": "7", "57600": "8", "115200": "9" }
  guest_baud_narrow: { "2400": "0", "4800": "1", "9600": "2", "19200": "3", "38400": "4", "57600": "5", "115200": "6" }
  rotation: { "0": "0", "90": "1", "180": "2", "270": "3" }
  display_mode: { fast_switch: "0", genlock: "1" }
  active_word: { "true": "ACTIVE", "false": "INACTIVE" }
  signal_route: { video: VFR, audio: AFR, ir: RFR, serial: SFR, usb: UFR, cec: CFR }
  replace_word: { "true": " REPLACE", "false": "" }
  wallplate_mode_210: { auto: "00", auto_usbc: "01", auto_hdmi: "02", usbc: "03", hdmi: "04" }
  wallplate_mode_1000: { auto: "01", auto_usbc: "02", auto_hdmi: "03", usbc: "04", hdmi: "05" }
  wallplate_input: { hdmi: "0", usbc: "1" }
  stream_codec: { h264: "0", h265: "1" }
  main_bitrate: { "1024": "0", "2048": "1", "4096": "2", "6144": "3", "8192": "4", "10240": "5", "12288": "6", "16384": "7", "20480": "8" }
  sub_bitrate: { "128": "0", "256": "1", "512": "2", "1024": "3", "2048": "4" }

ports:
  - { port: 23, protocol: tcp, role: control, note: "Telnet on the control LAN port (LAN2), changeable with NET TN; the ACM210 also serves the API over SSH" }

