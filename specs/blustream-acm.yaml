      aspect: { type: enum, values: [FIT, MAINTAIN], required: true, label: Aspect, description: "FIT fills the screen; MAINTAIN keeps the source's aspect ratio." }
    send:
      - { models: [acm500], message: "OUT {output:03d} ASPECT {aspect}" }
    returns: none

  set_output_display_mode:
    summary: Set an ACM500 output's display mode, fast switch or genlock (OUT ooo DISPLAYMODE DIS mode)
    params:
      output: *output_all
      mode: { type: enum, values: [fast_switch, genlock], required: true, label: Display mode, description: "fast_switch switches quickly; genlock locks the output to the source." }
    send:
      - { models: [acm500], message: "OUT {output:03d} DISPLAYMODE DIS {mode:map.display_mode}" }
