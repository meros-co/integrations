      preset: *mv_preset
      window: *mv_window
      input: *input_or_clear
    send:
      - { models: [acm500], message: "MVP {preset:02d} W {window:02d} FR {input:03d}" }
    returns: none

  delete_multiview_preset:
    summary: Delete a multiview preset (MVP mvpid DEL)
    params: { preset: *mv_preset }
    send:
      - { models: [acm500], message: "MVP {preset:02d} DEL" }
    returns: none

  create_pip_layout:
    summary: Create a picture-in-picture layout (PIP pidx CREATE name)
    params:
      layout: &pip_layout { type: int, min: 26, max: 100, required: true, label: PIP layout, description: "The PIP layout, 26-100, numbered after the built-in layouts." }
      name: *letter_name
    send:
      - { models: [acm500], message: "PIP {layout} CREATE {name}" }
    returns: none

  delete_pip_layout:
    summary: Delete a picture-in-picture layout (PIP pidx DEL)
    params: { layout: *pip_layout }
    send:
      - { models: [acm500], message: "PIP {layout} DEL" }
    returns: none

  set_pip_option:
    summary: Choose a picture-in-picture layout's option (PIP pidx OP op)
    params:
      layout: *pip_layout
      option: { type: int, min: 1, max: 99, required: true, label: Option, description: "The layout option, from 1, as the web GUI numbers them." }
    send:
      - { models: [acm500], message: "PIP {layout} OP {option:02d}" }
    returns: none

  set_pip_window_active:
    summary: Turn one window of a picture-in-picture layout on or off (PIP pidx W widx ACTIVE/INACTIVE)
    params:
      layout: *pip_layout
      window: *mv_window
      active: { type: bool, required: true, label: Active, description: "On shows the window; off hides it." }
    send:
      - { models: [acm500], message: "PIP {layout} W {window:02d} {active:map.active_word}" }
    returns: none

  set_pip_mode:
