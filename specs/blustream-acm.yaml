    send:
      - { models: [acm210], message: "IN {input:03d} SWMODE {mode:map.wallplate_mode_210}" }
      - { models: [acm1000], message: "IN {input:03d} SWMODE {mode:map.wallplate_mode_1000}" }
    returns: none

  set_wallplate_button_only:
    summary: Let an ACM1000 wall-plate transmitter switch inputs only by its button (IN iii SWMODE 06)
    params: { input: *input_all }
    send:
      - { models: [acm1000], message: "IN {input:03d} SWMODE 06" }
    returns: none

  set_wallplate_input:
    summary: Switch a wall-plate transmitter to its HDMI or USB-C input (IN iii TGMODE, or IN TGMODE)
    params:
      input: *input_all
      source: { type: enum, values: [hdmi, usbc], required: true, label: Source, description: "hdmi or usbc, the wall plate's input to use." }
    send:
      - { models: [acm210], message: "IN {input:03d} TGMODE {source:map.wallplate_input}" }
      - { models: [acm1000], message: "IN TGMODE {source:map.wallplate_input}" }
    returns: none

  set_input_name:
    summary: Name a transmitter (IN iii NAME name)
    params:
      input: *input_one
      name: *device_name
    send:
      - { models: *all, message: "IN {input:03d} NAME {name}" }
    returns: none

  set_input_cec:
    summary: Turn CEC control of a transmitter's source on or off (IN iii CEC ON/OFF)
    params:
      input: *input_one
      enabled: { type: bool, required: true, label: CEC, description: "On lets the transmitter control its source over CEC." }
    send:
      - { models: *all, message: "IN {input:03d} CEC {enabled:map.upper_onoff}" }
    returns: none

  send_input_cec:
    summary: Send a CEC command to a transmitter's source (IN iii CEC command)
    params:
      input: *input_one
      command: *cec_command
    send:
      - { models: [acm210, acm500], message: "IN {input:03d} CEC {command}" }
    returns: none

  send_input_ir:
    summary: Send an IR guest command from a transmitter (IN iii IR command)
    params:
      input: *input_one
      command: *ir_command
    send:
      - { models: [acm210], message: "IN {input:03d} IR {command}" }
    returns: none

  set_input_ir:
    summary: Enable or disable an ACM500 transmitter's rear-panel IR (IN iii IR ON/OFF)
    params:
      input: *input_one
      enabled: { type: bool, required: true, label: IR, description: "On accepts IR at the transmitter; off ignores it." }
    send:
      - { models: [acm500], message: "IN {input:03d} IR {enabled:map.upper_onoff}" }
    returns: none

  set_input_ir_voltage:
    summary: Set an ACM500 transmitter's rear-panel IR voltage (IN iii IRVAL 5V/12V)
    params:
      input: *input_one
      volts: *ir_volts
    send:
      - { models: [acm500], message: "IN {input:03d} IRVAL {volts}" }
    returns: none

  set_input_led_flash:
    summary: Flash a transmitter's power LED until stopped, or stop it (IN iii FLS ON/OFF)
    params:
      input: *input_one
      flashing: { type: bool, required: true, label: Flash, description: "On flashes the transmitter's LED to find it; off stops." }
    send:
      - { models: *all, message: "IN {input:03d} FLS {flashing:map.upper_onoff}" }
    returns: none

  flash_input_led_for:
    summary: Flash a transmitter's power LED for a time (IN iii FLS ON time)
    params:
      input: *input_one
      seconds: *led_seconds
    send:
      - { models: *all, message: "IN {input:03d} FLS ON {seconds}" }
    returns: none

  set_input_rx_mode:
    summary: Turn an ACM500 transmitter into a receiver (IN iii RXMODE)
    params: { input: *input_one }
    send:
      - { models: [acm500], message: "IN {input:03d} RXMODE" }
    returns: none

  set_input_stream_debug:
    summary: Turn an ACM500 transmitter's stream debug on or off (IN iii STREAMDBG ON/OFF)
    params:
      input: *input_one
      enabled: { type: bool, required: true, label: Stream debug, description: "On turns the transmitter's stream debugging on." }
    send:
      - { models: [acm500], message: "IN {input:03d} STREAMDBG {enabled:map.upper_onoff}" }
    returns: none

  set_input_led_timeout:
    summary: Set when a transmitter's front-panel LEDs turn off (IN iii LED ee)
    params:
      input: *input_one
      timeout: *led_timeout
    send:
      - { models: *all, message: "IN {input:03d} LED {timeout}" }
    returns: none

  set_input_serial_guest:
    summary: Set a transmitter's serial guest mode and port settings (IN iii SG ON/OFF BR br BIT bit)
    params:
      input: *input_one
      enabled: *guest_enabled
      baud: *guest_baud
      format: *guest_format
    send:
      - { models: *gen2, message: "IN {input:03d} SG {enabled:map.upper_onoff} BR {baud:map.guest_baud_wide} BIT {format}" }
    returns: none

  set_input_serial_guest_sdvoe:
    summary: Set an ACM500 transmitter's serial guest mode and port settings, 2400-115200 (IN iii SG ON/OFF BR br BIT bit)
    params:
      input: *input_one
      enabled: *guest_enabled
      baud: *guest_baud_sdvoe
      format: *guest_format
    send:
      - { models: [acm500], message: "IN {input:03d} SG {enabled:map.upper_onoff} BR {baud:map.guest_baud_narrow} BIT {format}" }
    returns: none

  start_input_serial_guest:
    summary: Open serial guest mode to a transmitter's RS-232 port on this connection (IN iii GUEST)
    params: { input: *input_one }
    send:
      - { models: *all, message: "IN {input:03d} GUEST" }
    returns: none

  set_input_hdcp:
    summary: Set a transmitter's HDCP override (IN iii HDCP BYP/V14/V22)
    params:
      input: *input_one
      hdcp: *hdcp
    send:
      - { models: *gen2, message: "IN {input:03d} HDCP {hdcp}" }
    returns: none

  set_input_system_size:
    summary: Set a transmitter's system size (IN iii SSM L/N)
    params:
      input: *input_one
      size: *system_size
    send:
      - { models: *gen2, message: "IN {input:03d} SSM {size}" }
    returns: none

  set_input_arc_output:
    summary: Take a transmitter's audio return channel from an output (IN iii EFR ooo)
    params:
      input: *input_one
      output: *output_one
    send:
      - { models: *gen2, message: "IN {input:03d} EFR {output:03d}" }
    returns: none

  set_input_arc:
    summary: Turn a transmitter's audio return channel on or off (IN iii ARC ON/OFF)
    params:
      input: *input_one
      enabled: { type: bool, required: true, label: ARC, description: "On returns the chosen output's audio to the transmitter's source." }
    send:
      - { models: *gen2, message: "IN {input:03d} ARC {enabled:map.upper_onoff}" }
    returns: none

  get_input_status:
    summary: Print one transmitter's detail report, or every transmitter's with 0; its lines update state (IN iii STATUS)
    params: { input: *input_all }
    send:
      - { models: *all, message: "IN {input:03d} STATUS" }
    returns: none

  get_input_details:
    summary: Print an ACM1000 transmitter's details (IN iii ASTPARAM)
    params: { input: *input_one }
    send:
      - { models: [acm1000], message: "IN {input:03d} ASTPARAM" }
    returns: none

  set_input_hotplug:
    summary: Turn an ACM1000 transmitter's hot plug on or off (IN iii HOTPLUG ON/OFF)
    params:
      input: *input_one
      enabled: { type: bool, required: true, label: Hot plug, description: "On asserts hot plug to the source." }
    send:
      - { models: [acm1000], message: "IN {input:03d} HOTPLUG {enabled:map.upper_onoff}" }
    returns: none

  # ── Secondary stream (ACM500) ────────────────────────────────────────────
  get_stream_status:
    summary: Print an ACM500 transmitter's secondary stream report, or every one's with 0 (IN iii SS STATUS)
    params: { input: *input_all }
    send:
      - { models: [acm500], message: "IN {input:03d} SS STATUS" }
    returns: none

  get_main_stream_url:
    summary: Print an ACM500 transmitter's main stream URL (IN iii SS MSURL)
    params: { input: *input_one }
    send:
      - { models: [acm500], message: "IN {input:03d} SS MSURL" }
    returns: none

  get_sub_stream_url:
    summary: Print an ACM500 transmitter's sub stream URL (IN iii SS SSURL)
    params: { input: *input_one }
    send:
      - { models: [acm500], message: "IN {input:03d} SS SSURL" }
    returns: none

  get_snapshot_url:
    summary: Print an ACM500 transmitter's snapshot URL (IN iii SS SNAPURL)
    params: { input: *input_one }
    send:
      - { models: [acm500], message: "IN {input:03d} SS SNAPURL" }
    returns: none

  set_main_stream:
    summary: Set an ACM500 transmitter's main stream encoding (IN iii ss MAINENCATTR E R H V B)
    params:
      input: *input_one
      codec: &codec { type: enum, values: [h264, h265], required: true, label: Codec, description: "H.264 or H.265." }
      resolution: { type: enum, values: [auto, manual], required: true, label: Resolution, description: "auto follows the input; manual uses the width and height given." }
      width: { type: int, min: 960, max: 1920, required: true, label: Width, description: "Stream width in pixels, an even number from 960 to 1920." }
      height: { type: int, min: 540, max: 1080, required: true, label: Height, description: "Stream height in pixels, an even number from 540 to 1080." }
      bitrate: { type: enum, values: ["1024", "2048", "4096", "6144", "8192", "10240", "12288", "16384", "20480"], required: true, label: Bit rate,
                 description: "The stream's bit rate in kbit/s." }
    send:
      - { models: [acm500], message: "IN {input:03d} ss MAINENCATTR E {codec:map.stream_codec} R {resolution} H {width} V {height} B {bitrate:map.main_bitrate}" }
    returns: none

  set_sub_stream:
    summary: Set an ACM500 transmitter's sub stream encoding (IN iii ss SUBENCATTR E H V B)
    params:
      input: *input_one
      codec: *codec
      width: { type: int, min: 320, max: 960, required: true, label: Width, description: "Stream width in pixels, an even number from 320 to 960." }
      height: { type: int, min: 180, max: 540, required: true, label: Height, description: "Stream height in pixels, an even number from 180 to 540." }
      bitrate: { type: enum, values: ["128", "256", "512", "1024", "2048"], required: true, label: Bit rate, description: "The stream's bit rate in kbit/s." }
    send:
      - { models: [acm500], message: "IN {input:03d} ss SUBENCATTR E {codec:map.stream_codec} H {width} V {height} B {bitrate:map.sub_bitrate}" }
    returns: none

  set_stream_enabled:
    summary: Turn an ACM500 transmitter's main, sub or picture stream on or off (IN iii SS MAIN/SUB/PIC ON/OFF)
    params:
      input: *input_one
      stream: { type: enum, values: [MAIN, SUB, PIC], required: true, label: Stream, description: "MAIN the main stream, SUB the sub stream, PIC the still picture stream." }
      enabled: { type: bool, required: true, label: Enabled, description: "On runs the stream; off stops it." }
    send:
      - { models: [acm500], message: "IN {input:03d} SS {stream} {enabled:map.upper_onoff}" }
    returns: none

  # ── EDID ─────────────────────────────────────────────────────────────────
  copy_edid:
    summary: Copy a display's EDID from an output to an input (EDID iii CP ooo)
    params:
      input: *input_one
      output: *output_one
    send:
      - { models: *all, message: "EDID {input:03d} CP {output:03d}" }
    returns: none

  set_input_edid:
    summary: Give an input one of the built-in EDIDs (EDID iii DF zz)
    params:
      input: *input_one
      edid: { type: int, min: 0, max: 33, required: true, label: EDID,
              description: "The EDID preset: 00-33 on the ACM210 and on ACM1000 IP300-350 systems (15 4K30 4:4:4 7.1 by default), 00-18 on ACM1000 IP200-250 systems, 00-23 on the ACM500 (22 and 23 the user EDIDs)." }
    send:
      - { models: *all, message: "EDID {input:03d} DF {edid:02d}" }
    returns: none

  load_user_edid:
    summary: Set an ACM500 user EDID from the file uploaded in its web GUI (EDID iii DL)
    params:
      slot: { type: int, min: 1, max: 2, required: true, label: User EDID, description: "The user EDID slot, 1 or 2." }
    send:
      - { models: [acm500], message: "EDID {slot:03d} DL" }
    returns: none

  # ── Presets, groups and macros (ACM1000) ─────────────────────────────────
  recall_preset:
    summary: Recall a preset set up in the ACM1000's web GUI (PRE xx AP)
    params:
      preset: &acm_preset { type: int, min: 1, max: 99, required: true, label: Preset, description: "The preset's index in the ACM1000's web GUI, from 1." }
    send:
      - { models: [acm1000], message: "PRE {preset:02d} AP" }
    returns: none

  trigger_macro:
    summary: Run a macro set up in the ACM1000's web GUI (MACRO xx)
    params:
      macro: { type: int, min: 1, max: 99, required: true, label: Macro, description: "The macro's index in the ACM1000's web GUI, from 1." }
    send:
      - { models: [acm1000], message: "MACRO {macro:02d}" }
    returns: none

  add_preset_route:
    summary: Add a transmitter-to-receiver route to an ACM1000 preset (PRE idx ADD RX ooo TX iii)
    params:
      preset: *acm_preset
      output: *output_one
      input: *input_one
    send:
      - { models: [acm1000], message: "PRE {preset:02d} ADD RX {output:03d} TX {input:03d}" }
    returns: none

  remove_preset_route:
    summary: Remove a transmitter-to-receiver route from an ACM1000 preset (PRE idx RM RX ooo TX iii)
    params:
      preset: *acm_preset
      output: *output_one
      input: *input_one
    send:
      - { models: [acm1000], message: "PRE {preset:02d} RM RX {output:03d} TX {input:03d}" }
    returns: none

  set_preset_enabled:
    summary: Enable or disable an ACM1000 preset (PRE idx ON/OFF)
    params:
      preset: *acm_preset
      enabled: { type: bool, required: true, label: Enabled, description: "On makes the preset available; off disables it." }
    send:
      - { models: [acm1000], message: "PRE {preset:02d} {enabled:map.upper_onoff}" }
    returns: none

  set_group_enabled:
    summary: Enable or disable an ACM1000 receiver group (GRP idx ON/OFF)
    params:
      group: &acm_group { type: int, min: 1, max: 99, required: true, label: Group, description: "The group's index in the ACM1000's web GUI, from 1." }
      enabled: { type: bool, required: true, label: Enabled, description: "On makes the group available; off disables it." }
    send:
      - { models: [acm1000], message: "GRP {group:02d} {enabled:map.upper_onoff}" }
    returns: none

  add_group_output:
    summary: Add a receiver to an ACM1000 group (GRP idx AD ooo)
    params:
      group: *acm_group
      output: *output_one
    send:
      - { models: [acm1000], message: "GRP {group:02d} AD {output:03d}" }
    returns: none

  remove_group_output:
    summary: Remove a receiver from an ACM1000 group (GRP idx RM ooo)
    params:
      group: *acm_group
      output: *output_one
    send:
      - { models: [acm1000], message: "GRP {group:02d} RM {output:03d}" }
    returns: none

  route_group:
    summary: Route an input to every receiver of an ACM1000 group (GRP idx FR iii)
    params:
      group: *acm_group
      input: *input_one
    send:
      - { models: [acm1000], message: "GRP {group:02d} FR {input:03d}" }
    returns: none

  # ── Video walls ──────────────────────────────────────────────────────────
  create_video_wall:
    summary: Create a video wall of columns by rows (VW idx CREATE ccXrr name)
    params:
      wall: &wall { type: int, min: 1, max: 9, required: true, label: Video wall, description: "The video wall, 1-9." }
      columns: { type: int, min: 1, max: 9, required: true, label: Columns, description: "Screens across, 1-9." }
      rows: { type: int, min: 1, max: 9, required: true, label: Rows, description: "Screens down, 1-9." }
      name: *device_name
    send:
      - { models: *all, message: "VW {wall:02d} CREATE {columns:02d}X{rows:02d} {name}" }
    returns: none

  rename_video_wall:
    summary: Rename a video wall (VW idx NAME name)
    params:
      wall: *wall
      name: *device_name
    send:
      - { models: *all, message: "VW {wall:02d} NAME {name}" }
    returns: none

  delete_video_wall:
    summary: Delete a video wall (VW idx DEL)
    params: { wall: *wall }
    send:
      - { models: *all, message: "VW {wall:02d} DEL" }
    returns: none

  place_video_wall_output:
    summary: Put a receiver at a screen position of a video wall, or clear the position (VW idx OUT ooo HhhVvv)
    params:
      wall: *wall
      output: { type: int, min: 0, max: 767, required: true, label: Output, description: "The receiver's output ID, or 0 to clear the position." }
      column: &column { type: int, min: 1, max: 9, required: true, label: Column, description: "The screen's column, from 1 at the left." }
      row: &row { type: int, min: 1, max: 9, required: true, label: Row, description: "The screen's row, from 1 at the top." }
    send:
      - { models: *all, message: "VW {wall:02d} OUT {output:03d} H{column:02d}V{row:02d}" }
    returns: none

  create_video_wall_config:
    summary: Create a configuration of a video wall (VW idx C cidx CREATE name)
    params:
      wall: *wall
      config: &wall_config { type: int, min: 1, max: 9, required: true, label: Configuration, description: "The wall's configuration, 1-9." }
      name: *device_name
    send:
      - { models: *all, message: "VW {wall:02d} C {config:02d} CREATE {name}" }
    returns: none

  rename_video_wall_config:
    summary: Rename a video wall configuration (VW idx C cidx NAME name)
    params:
      wall: *wall
      config: *wall_config
      name: *device_name
    send:
      - { models: *all, message: "VW {wall:02d} C {config:02d} NAME {name}" }
    returns: none

  apply_video_wall_config:
    summary: Apply a video wall configuration (VW idx C cidx APPLY)
    params:
      wall: *wall
      config: *wall_config
    send:
      - { models: *all, message: "VW {wall:02d} C {config:02d} APPLY" }
    returns: none

  delete_video_wall_config:
    summary: Delete a video wall configuration (VW idx C cidx DEL)
    params:
      wall: *wall
      config: *wall_config
    send:
      - { models: *all, message: "VW {wall:02d} C {config:02d} DEL" }
    returns: none

  set_video_wall_group_screen:
    summary: Put a screen of a video wall configuration in a group, which shows one picture across its screens (VW idx C cidx G gidx HhhVvv)
    params:
      wall: *wall
      config: *wall_config
      group: &wall_group { type: enum, values: [A, B, C, D, E, F, G, H, I, J], required: true, label: Group, description: "The screen group, A-J." }
      column: *column
      row: *row
    send:
      - { models: *all, message: "VW {wall:02d} C {config:02d} G {group} H{column:02d}V{row:02d}" }
    returns: none

  route_video_wall_group:
    summary: Route an input to a group of a video wall configuration (VW idx C cidx G gidx FR iii)
    params:
      wall: *wall
      config: *wall_config
      group: *wall_group
      input: *input_one
    send:
      - { models: *all, message: "VW {wall:02d} C {config:02d} G {group} FR {input:03d}" }
    returns: none

  set_video_wall_single_screen:
    summary: Make a screen of a video wall configuration show its own picture (VW idx C cidx S HhhVvv)
    params:
      wall: *wall
      config: *wall_config
      column: *column
      row: *row
    send:
      - { models: *all, message: "VW {wall:02d} C {config:02d} S H{column:02d}V{row:02d}" }
    returns: none

  route_video_wall_single_screen:
    summary: Route an input to a single screen of a video wall configuration (VW idx C cidx S HhhVvv FR iii)
    params:
      wall: *wall
      config: *wall_config
      column: *column
      row: *row
      input: *input_one
    send:
      - { models: *all, message: "VW {wall:02d} C {config:02d} S H{column:02d}V{row:02d} FR {input:03d}" }
    returns: none

  set_video_wall_screen_width:
    summary: Set a video wall screen's outer and visible width for bezel correction (VW idx HhhVvv OWaa VWww)
    params:
      wall: *wall
      column: *column
      row: *row
      outer: &bezel_outer { type: int, min: 100, max: 1000, required: true, label: Outer size, description: "The screen's outside size, bezel included, 100-1000 in the ACM's units." }
      visible: &bezel_visible { type: int, min: 100, max: 1000, required: true, label: Visible size, description: "The screen's picture size, 100-1000 in the same units." }
    send:
      - { models: *all, message: "VW {wall:02d} H{column:02d}V{row:02d} OW{outer} VW{visible}" }
    returns: none

  set_video_wall_screen_height:
    summary: Set a video wall screen's outer and visible height for bezel correction (VW idx HhhVvv OHaa VHww)
    params:
      wall: *wall
      column: *column
      row: *row
      outer: *bezel_outer
      visible: *bezel_visible
    send:
      - { models: *all, message: "VW {wall:02d} H{column:02d}V{row:02d} OH{outer} VH{visible}" }
    returns: none

  get_video_wall_status:
    summary: Print one video wall's report (VW idx STATUS)
    params: { wall: *wall }
    send:
      - { models: *all, message: "VW {wall:02d} STATUS" }
    returns: none

  get_all_video_wall_status:
    summary: Print every video wall's report (VW STATUS)
    send:
      - { models: *all, message: "VW STATUS" }
    returns: none

  # ── Project ──────────────────────────────────────────────────────────────
  scan:
    summary: Scan the video network for transmitters and receivers (SCAN)
    send:
      - { models: *all, message: "SCAN" }
    returns: none

  get_scan_status:
    summary: Print the scan results (SCAN STATUS)
    send:
      - { models: *all, message: "SCAN STATUS" }
    returns: none

  reset_scan:
    summary: Clear the scan results (SCAN RESET)
    send:
      - { models: *all, message: "SCAN RESET" }
    returns: none

  set_scan_osd:
    summary: Show or hide each receiver's scan index on its display (SCAN OSD ON/OFF)
    params:
      shown: { type: bool, required: true, label: Show index, description: "On shows each receiver's scan index on screen." }
    send:
      - { models: *gen2, message: "SCAN OSD {shown:map.upper_onoff}" }
    returns: none

  reset_assignments:
    summary: Clear every input, output, video wall and scan of the project (ASSIGN RESET)
    send:
      - { models: *all, message: "ASSIGN RESET" }
    returns: none

  assign_default_input:
    summary: Add the transmitter at the default address as an input, or have it replace one (ASSIGN DF IN iii [REPLACE])
    params:
      input: *input_one
      replace: &replace { type: bool, default: false, label: Replace, description: "On replaces the endpoint that has this ID; off adds the new one." }
    send:
      - { models: *gen2, message: "ASSIGN DF IN {input:03d}{replace:map.replace_word}" }
    returns: none

  assign_scanned_input:
    summary: Add a scanned transmitter as an input, or have it replace one (ASSIGN INDEX ddd IN iii [REPLACE])
    params:
      index: &scan_index { type: int, min: 1, max: 767, required: true, label: Scan index, description: "The device's index in the scan results, from 1." }
      input: *input_one
      replace: *replace
    send:
      - { models: *gen2, message: "ASSIGN INDEX {index:02d} IN {input:03d}{replace:map.replace_word}" }
    returns: none

  assign_default_output:
    summary: Add the receiver at the default address as an output, or have it replace one (ASSIGN DF OUT ooo [REPLACE])
    params:
      output: *output_one
      replace: *replace
    send:
      - { models: *gen2, message: "ASSIGN DF OUT {output:03d}{replace:map.replace_word}" }
    returns: none

  assign_scanned_output:
    summary: Add a scanned receiver as an output, or have it replace one (ASSIGN INDEX ddd OUT ooo [REPLACE])
    params:
      index: *scan_index
      output: *output_one
      replace: *replace
    send:
      - { models: *gen2, message: "ASSIGN INDEX {index:02d} OUT {output:03d}{replace:map.replace_word}" }
    returns: none

  assign_auto:
    summary: Add every newly scanned device to the project (ASSIGN AUTO)
    send:
      - { models: *all, message: "ASSIGN AUTO" }
    returns: none

  # ── GPIO ─────────────────────────────────────────────────────────────────
  set_gpio_direction:
    summary: Make a GPIO port an input or an output (GPIO gg DIR IN/OUT)
    params:
      port: &gpio_port { type: int, min: 1, max: 4, required: true, label: GPIO port, description: "The GPIO port, 1-4 (on the ACM1000, 1-2 are outputs and 3-4 inputs)." }
      direction: { type: enum, values: [IN, OUT], required: true, label: Direction, description: "IN reads a level; OUT drives one." }
    send:
      - { models: [acm210, acm500], message: "GPIO {port:02d} DIR {direction}" }
    returns: none

  set_gpio_output:
    summary: Drive a GPIO output high or low (GPIO gg SET 0/1)
    params:
      port: *gpio_port
      high: { type: bool, required: true, label: High, description: "On drives the output high; off low (0 V)." }
    send:
      - { models: *all, message: "GPIO {port:02d} SET {high:bool01}" }
    returns: none

  read_gpio:
    summary: Print a GPIO port's input level (GPIO gg GET)
    params: { port: *gpio_port }
    send:
      - { models: *all, message: "GPIO {port:02d} GET" }
    returns: none

  get_gpio_status:
    summary: Print every GPIO port's report (GPIO STATUS)
    send:
      - { models: *all, message: "GPIO STATUS" }
    returns: none

  set_gpio_vcc_voltage:
    summary: Set the ACM1000's GPIO VCC pin voltage (GPIO VCC SET VOLTS 5/12)
    params:
      volts: &gpio_volts { type: enum, values: ["5", "12"], required: true, label: Voltage, description: "5 or 12 volts." }
    send:
      - { models: [acm1000], message: "GPIO VCC SET VOLTS {volts}" }
    returns: none

  set_gpio_voltage:
    summary: Set an ACM1000 GPIO port's voltage (GPIO gg SET VOLTS 5/12)
    params:
      port: *gpio_port
      volts: *gpio_volts
    send:
      - { models: [acm1000], message: "GPIO {port:02d} SET VOLTS {volts}" }
    returns: none

  set_gpio_current:
    summary: Set an ACM1000 GPIO port's current low or high (GPIO gg SET CURR 0/1)
    params:
      port: *gpio_port
      high: { type: bool, required: true, label: High current, description: "On selects the port's high current; off its low current." }
    send:
      - { models: [acm1000], message: "GPIO {port:02d} SET CURR {high:bool01}" }
    returns: none

  # ── Network ──────────────────────────────────────────────────────────────
  set_control_dhcp:
    summary: Turn DHCP on the control LAN (LAN2) on or off (NET LAN2 DHCP ON/OFF)
    params:
      enabled: { type: bool, required: true, label: DHCP, description: "On takes the control port's address from DHCP; off uses its static address." }
    send:
      - { models: *all, message: "NET LAN2 DHCP {enabled:map.upper_onoff}" }
    returns: none

  set_ip_address:
    summary: Set a LAN port's static IP address, applied by a network reboot (NET LAN1/LAN2 IP a.b.c.d)
    params:
      lan: &lan { type: enum, values: [LAN1, LAN2], required: true, label: Port,
                  description: "LAN1 the video LAN (PoE) the endpoints are on, LAN2 the control LAN." }
      address: &ipv4 { type: string, pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$', required: true,
                       label: Address, description: "An IPv4 address in dot-decimal notation." }
    send:
      - { models: *all, message: "NET {lan} IP {address}" }
    returns: none

  set_gateway:
    summary: Set a LAN port's gateway, applied by a network reboot (NET LAN1/LAN2 GW a.b.c.d)
    params:
      lan: *lan
      address: *ipv4
    send:
      - { models: *all, message: "NET {lan} GW {address}" }
    returns: none

  set_subnet_mask:
    summary: Set a LAN port's subnet mask, applied by a network reboot (NET LAN1/LAN2 SM a.b.c.d)
    params:
      lan: *lan
      address: *ipv4
    send:
      - { models: *all, message: "NET {lan} SM {address}" }
    returns: none

  network_reboot:
    summary: Restart the network to apply new settings (NET RB)
    send:
      - { models: *all, message: "NET RB" }
    returns: none

  set_telnet:
    summary: Turn the Telnet server on or off (NET TN ON/OFF)
    params:
      enabled: { type: bool, required: true, label: Telnet, description: "On runs Telnet; off stops it, ending control over the network." }
    send:
      - { models: [acm210], message: "NET TN {enabled:map.upper_onoff}" }
    returns: none

  set_telnet_port:
    summary: Set the Telnet port (NET TN port)
    params:
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "The Telnet port; 23 by default." }
    send:
      - { models: *all, message: "NET TN {port}" }
    returns: none

  set_ssh:
    summary: Turn the SSH server on or off (NET SSH ON/OFF)
    params:
      enabled: { type: bool, required: true, label: SSH, description: "On serves the API over SSH too." }
    send:
      - { models: [acm210], message: "NET SSH {enabled:map.upper_onoff}" }
    returns: none

  set_ssh_port:
    summary: Set the SSH port (NET SSH port)
    params:
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "The SSH port." }
    send:
      - { models: [acm210], message: "NET SSH {port}" }
    returns: none

  set_web:
    summary: Turn the web GUI on or off (NET WEB ON/OFF)
    params:
      enabled: { type: bool, required: true, label: Web GUI, description: "On serves the ACM's web GUI." }
    send:
      - { models: [acm210], message: "NET WEB {enabled:map.upper_onoff}" }
    returns: none

  set_https:
    summary: Turn the web GUI's HTTPS access on or off (NET HTTPS ON/OFF)
    params:
      enabled: { type: bool, required: true, label: HTTPS, description: "On serves the web GUI over HTTPS." }
    send:
      - { models: [acm210], message: "NET HTTPS {enabled:map.upper_onoff}" }
    returns: none

  set_dns_name:
    summary: Set the DNS domain name (NET DNS name)
    params:
      name: { type: string, pattern: '^[A-Za-z0-9.-]{1,63}$', required: true, label: Name, description: "The domain name." }
    send:
      - { models: *gen2, message: "NET DNS {name}" }
    returns: none

state:
  model:                     { type: string, description: "Model named in the report title, such as ACM210 (IP Control Box ... Status Info)" }
  firmware:                  { type: string, description: "ACM firmware version (FW Version)" }
  power:                     { type: bool, description: "Whether the system is on (Power column)" }
  ir:                        { type: bool, description: "Whether the ACM's IR control input is on (IR column)" }
  serial_baud:               { type: int, description: "RS-232 baud rate (Baud column)" }
  inputs.*.edid:             { type: int, description: "Built-in EDID preset the input presents (EDID column, DFzzz)" }
  inputs.*.ip_address:       { type: string, description: "Transmitter's address on the video LAN, as the report writes it" }
  inputs.*.online:           { type: bool, description: "Whether the transmitter answers on the network (NET column)" }
  inputs.*.signal:           { type: bool, description: "Whether the transmitter has a source signal (Sig column)" }
  inputs.*.firmware:         { type: string, description: "Transmitter firmware (Ver, IN STATUS)" }
  inputs.*.audio:            { type: string, description: "Transmitter audio source, such as HDMI (Aud, IN STATUS)" }
  inputs.*.multicast:        { type: bool, description: "Whether the transmitter streams multicast (MCast, IN STATUS)" }
  inputs.*.name:             { type: string, description: "Transmitter name (Name, IN STATUS)" }
  outputs.*.input:           { type: int, description: "Input routed to the output (FromIn column)" }
  outputs.*.ip_address:      { type: string, description: "Receiver's address on the video LAN, as the report writes it" }
  outputs.*.online:          { type: bool, description: "Whether the receiver answers on the network (NET column)" }
  outputs.*.connected:       { type: bool, description: "Whether a display is connected (HDMI or HPD column)" }
  outputs.*.resolution:      { type: int, description: "Output resolution code, 0 bypass (Res column)" }
  outputs.*.mode:            { type: string, description: "Output mode: MX, or VW and the wall number such as VW02 (Mode column)" }
  outputs.*.firmware:        { type: string, description: "Receiver firmware (Ver, OUT STATUS)" }
  outputs.*.rotation:        { type: int, description: "Rotation code, 0 none, 1-3 90-270 degrees (Rotate, OUT STATUS)" }
  outputs.*.name:            { type: string, description: "Receiver name (Name, OUT STATUS)" }
  network.video.dhcp:        { type: bool, description: "Whether the video LAN (LAN1) uses DHCP" }
  network.video.ip_address:  { type: string, description: "Video LAN address, as the report writes it" }
  network.video.gateway:     { type: string, description: "Video LAN gateway" }
  network.video.subnet_mask: { type: string, description: "Video LAN subnet mask" }
  network.video.mac_address: { type: string, description: "Video LAN MAC address" }
  network.control.dhcp:        { type: bool, description: "Whether the control LAN (LAN2) uses DHCP" }
  network.control.ip_address:  { type: string, description: "Control LAN address, as the report writes it" }
  network.control.gateway:     { type: string, description: "Control LAN gateway" }
  network.control.subnet_mask: { type: string, description: "Control LAN subnet mask" }
  network.control.mac_address: { type: string, description: "Control LAN MAC address" }
  network.telnet_port:       { type: int, description: "Telnet port" }

telemetry:
  poll:
    - every_ms: 10000
      send: ["STATUS"]
  updates:
    # The STATUS report (manual p.45): a title, FW Version, then the system
    # row, an input table (In EDID IP NET/Sig), an output table (Out FromIn
    # IP NET/HDMI Res Mode), the LAN table and the Telnet and MAC row.
    - match: '^\s*IP Control Box (\S+) Status Info\s*$'
      state: { model: "{1}" }
    - match: '^\s*FW Version:\s*(\S+)\s*$'
      state: { firmware: "{1}" }
    - match: '^(On|Off)\s+(On|Off)\s+(\d{4,6})\s*$'
      state:
        power: { value: "{1}", map: { "On": true, "Off": false } }
        ir: { value: "{2}", map: { "On": true, "Off": false } }
        serial_baud: "{3}"
    - match: '^(\d{3})\s+DF(\d{3})\s+(\d{1,3}(?:\.\d{1,3}){3})\s+(On|Off)\s*/\s*(On|Off)\s*$'
      state:
        "inputs.{1}.edid": "{2}"
        "inputs.{1}.ip_address": "{3}"
        "inputs.{1}.online": { value: "{4}", map: { "On": true, "Off": false } }
        "inputs.{1}.signal": { value: "{5}", map: { "On": true, "Off": false } }
    - match: '^(\d{3})\s+(\d{3})\s+(\d{1,3}(?:\.\d{1,3}){3})\s+(On|Off)\s*/\s*(On|Off)\s+(\d+)\s+(\S+)\s*$'
      state:
        "outputs.{1}.input": "{2}"
        "outputs.{1}.ip_address": "{3}"
        "outputs.{1}.online": { value: "{4}", map: { "On": true, "Off": false } }
        "outputs.{1}.connected": { value: "{5}", map: { "On": true, "Off": false } }
        "outputs.{1}.resolution": "{6}"
        "outputs.{1}.mode": "{7}"
    - match: '^01_POE\s+(On|Off)\s+(\d{1,3}(?:\.\d{1,3}){3})\s+(\d{1,3}(?:\.\d{1,3}){3})\s+(\d{1,3}(?:\.\d{1,3}){3})\s*$'
      state:
        network.video.dhcp: { value: "{1}", map: { "On": true, "Off": false } }
        network.video.ip_address: "{2}"
        network.video.gateway: "{3}"
        network.video.subnet_mask: "{4}"
    - match: '^02_CTRL\s+(On|Off)\s+(\d{1,3}(?:\.\d{1,3}){3})\s+(\d{1,3}(?:\.\d{1,3}){3})\s+(\d{1,3}(?:\.\d{1,3}){3})\s*$'
      state:
        network.control.dhcp: { value: "{1}", map: { "On": true, "Off": false } }
        network.control.ip_address: "{2}"
        network.control.gateway: "{3}"
        network.control.subnet_mask: "{4}"
    - match: '^(\d{1,5})\s+([0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){5})\s+([0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){5})\s*$'
      state:
        network.telnet_port: "{1}"
        network.video.mac_address: "{2}"
        network.control.mac_address: "{3}"
    # OUT xxx STATUS (manual p.45): Out Net HPD Ver Mode Res Rotate Name.
    - match: '^(\d{3})\s+(On|Off)\s+(On|Off)\s+(\S+)\s+(\S+)\s+(\d+)\s+(\d)\s+(\S.*?)\s*$'
      state:
        "outputs.{1}.online": { value: "{2}", map: { "On": true, "Off": false } }
        "outputs.{1}.connected": { value: "{3}", map: { "On": true, "Off": false } }
        "outputs.{1}.firmware": "{4}"
        "outputs.{1}.mode": "{5}"
        "outputs.{1}.resolution": "{6}"
        "outputs.{1}.rotation": "{7}"
        "outputs.{1}.name": "{8}"
    # IN xxx STATUS (manual p.46): In Net Sig Ver EDID Aud MCast Name.
    - match: '^(\d{3})\s+(On|Off)\s+(On|Off)\s+(\S+)\s+DF(\d{3})\s+(\S+)\s+(On|Off)\s+(\S.*?)\s*$'
      state:
        "inputs.{1}.online": { value: "{2}", map: { "On": true, "Off": false } }
        "inputs.{1}.signal": { value: "{3}", map: { "On": true, "Off": false } }
        "inputs.{1}.firmware": "{4}"
        "inputs.{1}.edid": "{5}"
        "inputs.{1}.audio": "{6}"
        "inputs.{1}.multicast": { value: "{7}", map: { "On": true, "Off": false } }
        "inputs.{1}.name": "{8}"

quirks:
  - models: [all]
    severity: critical
    text: >
      factory_reset, reset_network, factory_reset_all (RESET ALL, confirmed
      with Yes at once), reset_assignments (ASSIGN RESET), reset_output,
      reset_input, delete_output, delete_input, delete_video_wall and the
      network commands change the system at once and cannot be undone from
      here: a reset project has to be scanned and assigned again, and a
      network change can end control. route and other commands on output 0
      change every receiver at once.
  - models: [all]
    severity: warning
    text: >
      Blustream documents no answer to any command, so commands report
      unverified and a refused one goes unnoticed. State is read from the
      STATUS report every 10 s, and from the OUT and IN detail reports when
      they are asked for; a change shows at the next report. The layouts read
      are the manual's samples, printed by an ACM200; ACM210, ACM500 and
      ACM1000 reports may differ.
  - models: [all]
    severity: info
    text: >
      set_output_resolution codes differ by model. ACM210: 0 bypass,
      1 1080p50, 2 1080p60, 3 720p60, 4 720p50, 5 1280x1024, 6 1024x768,
      7 1360x768, 8 1440x900, 9 1680x1050, 10 2160p30, 11 2160p24,
      12 2160p50, 13 2160p60, 14-17 DCI 4K at 25, 30, 50 and 60 Hz,
      18 1280x800, 19 1920x1200 (60 Hz unless stated). ACM500: 0 bypass,
      1-2 720p50/60, 3-7 1080p24/25/30/50/60, 8-12 2160p24/25/30/50/60,
      13-17 4096x2160 at 24/25/30/50/60, 18 1280x768, 19 1360x768,
      20 1680x1050, 21 1920x1200. ACM1000: 0, 3, 4 and 7-23 on IP300-350,
      0-13 on IP200-250 (its help text gives no table).
  - models: [all]
    severity: info
    text: >
      Serial guest mode (start_output_serial_guest, start_input_serial_guest)
      passes this connection's text to the endpoint's RS-232 port until
      close_serial_guest; commands sent meanwhile go to that device, not the
      ACM.
  - models: [acm1000]
    severity: info
    text: >
      The ACM1000's EVENT MACRO scheduler commands are not here: the help
      text writes their fields as TIME:HH:SS, DAY:DD and SS:1 without
      explaining them. Presets, groups and macros themselves are built in
      the ACM1000's web GUI; the ACM1000 help text gives no range for their
      indexes.
