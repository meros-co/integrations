  set_pip_position:
    summary: Set where a picture-in-picture window sits (PIP pidx POSITION LT/LB/RT/RB)
    params:
      layout: *pip_layout
      position: { type: enum, values: [LT, LB, RT, RB], required: true, label: Position, description: "LT left top, LB left bottom, RT right top, RB right bottom." }
    send:
      - { models: [acm500], message: "PIP {layout} POSITION {position}" }
    returns: none

  rename_pip_layout:
    summary: Rename a picture-in-picture layout (PIP pidx Name name)
    params:
      layout: *pip_layout
      name: *letter_name
    send:
      - { models: [acm500], message: "PIP {layout} Name {name}" }
    returns: none

  # ── Inputs (transmitters) ────────────────────────────────────────────────
  set_input_id:
    summary: Give an online transmitter another input ID, swapping with the transmitter that has it (IN iii ID id)
    params:
      input: *input_one
      id: { type: int, min: 1, max: 254, required: true, label: New ID, description: "The input ID to give it; a transmitter already holding it takes the old ID." }
    send:
      - { models: *all, message: "IN {input:03d} ID {id:03d}" }
    returns: none

  delete_input:
    summary: Remove a transmitter from the project (IN iii DEL)
    params: { input: *input_one }
    send:
      - { models: *all, message: "IN {input:03d} DEL" }
    returns: none

  reboot_input:
    summary: Restart a transmitter, applying its new settings (IN iii RB)
    params: { input: *input_one }
    send:
      - { models: *all, message: "IN {input:03d} RB" }
    returns: none

  reset_input:
    summary: Reset a transmitter to factory settings (IN iii RESET)
    params: { input: *input_one }
    send:
      - { models: *all, message: "IN {input:03d} RESET" }
    returns: none

  set_input_audio_source:
    summary: Choose the audio a transmitter sends (IN iii AUD AUTO/HDMI/ANA)
    params:
      input: *input_one
