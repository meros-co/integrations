  rename_multiview_preset:
    summary: Rename a multiview preset (MVP mvpid Name name)
    params:
      preset: *mv_preset
      name: *letter_name
    send:
      - { models: [acm500], message: "MVP {preset:02d} Name {name}" }
    returns: none

  set_multiview_preset_layout:
    summary: Set a multiview preset's layout (MVP mvpid L lo)
    params:
      preset: *mv_preset
      layout: *mv_layout
    send:
      - { models: [acm500], message: "MVP {preset:02d} L {layout:02d}" }
    returns: none

  route_multiview_preset_window:
