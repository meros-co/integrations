      output: *output_all
      seconds: *led_seconds
    send:
      - { models: *all, message: "OUT {output:03d} FLS ON {seconds}" }
    returns: none

  delete_output:
    summary: Remove a receiver from the project (OUT ooo DEL)
    params: { output: *output_one }
    send:
      - { models: *all, message: "OUT {output:03d} DEL" }
    returns: none

  set_output_resolution:
    summary: Set an output's scaler resolution (OUT ooo RES rr)
    params:
      output: *output_all
      code: { type: int, min: 0, max: 23, required: true, label: Resolution,
              description: "The model's resolution code, 0 bypass (no scaling); the quirks list each model's codes." }
    send:
      - { models: *all, message: "OUT {output:03d} RES {code}" }
    returns: none

  set_output_rotation:
    summary: Rotate an output's picture (OUT ooo ROTATE tt)
    params:
      output: *output_all
      rotation: { type: enum, values: ["0", "90", "180", "270"], required: true, label: Rotation,
                  description: "Clockwise rotation in degrees, 0 for none." }
    send:
      - { models: *gen2, message: "OUT {output:03d} ROTATE {rotation:map.rotation}" }
    returns: none

  set_output_stretch:
    summary: Stretch an output's picture to the screen or not (OUT ooo STRETCH ON/OFF)
    params:
      output: *output_all
      enabled: { type: bool, required: true, label: Stretch, description: "On stretches the picture to fill the screen." }
    send:
      - { models: *gen2, message: "OUT {output:03d} STRETCH {enabled:map.upper_onoff}" }
    returns: none

  set_output_https:
    summary: Turn a receiver's HTTPS web access on or off (OUT ooo HTTPS ON/OFF)
    params:
      output: *output_all
      enabled: { type: bool, required: true, label: HTTPS, description: "On serves the receiver's web page over HTTPS." }
    send:
      - { models: *gen2, message: "OUT {output:03d} HTTPS {enabled:map.upper_onoff}" }
    returns: none

  set_output_audio:
    summary: Choose a receiver's audio path (OUT ooo AUDSD/AUDHA/AUDHH/AUDHD/AUDDA/AUDDH)
    params:
      output: *output_all
      path: { type: enum, values: [AUDSD, AUDHA, AUDHH, AUDHD, AUDDA, AUDDH], required: true, label: Audio path,
              description: "AUDSD S/PDIF to Dante, AUDHA HDMI to analog, AUDHH HDMI to HDMI, AUDHD HDMI to Dante, AUDDA Dante to analog, AUDDH Dante to HDMI." }
    send:
      - { models: *gen2, message: "OUT {output:03d} {path}" }
    returns: none

  set_output_lan2_mode:
    summary: Set a receiver's LAN2 port mode (OUT ooo LAN2M0-4)
    params:
      output: *output_all
      mode: &lan2_mode { type: int, min: 0, max: 4, required: true, label: LAN2 mode, description: "The LAN2 mode 0-4, as the endpoint's manual numbers them." }
    send:
      - { models: *gen2, message: "OUT {output:03d} LAN2M{mode}" }
    returns: none

  set_output_arc:
    summary: Set a receiver's audio return channel source, or turn ARC off (OUT ooo ARC OFF/HDMI/OPT)
    params:
      output: *output_all
      arc: { type: enum, values: ["OFF", HDMI, OPT], required: true, label: ARC, description: "OFF no ARC, HDMI from the display's HDMI, OPT from the optical input." }
    send:
      - { models: *gen2, message: "OUT {output:03d} ARC {arc}" }
    returns: none

  send_output_cec:
    summary: Send a CEC command to an output's display (OUT ooo CEC command)
    params:
      output: *output_all
      command: &cec_command { type: string, pattern: '^[A-Z0-9]{2,24}$', required: true, label: CEC command,
                              description: "A CEC command name such as POWERON, POWEROFF, VIDEOUP, VIDEOENTER, PLAY, PAUSE, VOLUMEUP or MUTE (the ACM500 help text lists them)." }
    send:
      - { models: *all, message: "OUT {output:03d} CEC {command}" }
    returns: none

  send_output_ir:
    summary: Send an IR guest command from an output's receiver (OUT ooo IR command)
    params:
      output: *output_all
      command: &ir_command { type: string, pattern: '^[A-Za-z0-9 ]{1,200}$', required: true, label: IR command,
                             description: "The IR guest command, as the ACM's web GUI stores it." }
    send:
      - { models: [acm210], message: "OUT {output:03d} IR {command}" }
    returns: none

  set_output_name:
    summary: Name a receiver (OUT ooo NAME name)
    params:
      output: *output_one
      name: &device_name { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9 _.-]{0,15}$', required: true, label: Name,
                           description: "Up to 16 characters, starting with a letter or digit." }
    send:
      - { models: *all, message: "OUT {output:03d} NAME {name}" }
    returns: none

  set_output_mode:
    summary: Set an output to matrix, video wall or (ACM500) multiview mode (OUT ooo MODE MX/VW/MV)
    params:
      output: *output_all
      mode: { type: enum, values: [MX, VW, MV], required: true, label: Mode, description: "MX matrix, VW video wall, MV multiview (ACM500 only)." }
    send:
      - { models: *all, message: "OUT {output:03d} MODE {mode}" }
    returns: none

  set_output_tx_mode:
    summary: Turn an ACM500 receiver into a transmitter (OUT ooo TXMODE)
    params: { output: *output_one }
    send:
      - { models: [acm500], message: "OUT {output:03d} TXMODE" }
    returns: none

  set_output_debug:
    summary: Turn a receiver's debug mode on or off (OUT ooo DBG ON/OFF)
    params:
      output: *output_all
      enabled: { type: bool, required: true, label: Debug, description: "On turns the receiver's debug mode on." }
    send:
      - { models: *gen2, message: "OUT {output:03d} DBG {enabled:map.upper_onoff}" }
    returns: none

  set_output_buttons:
    summary: Enable or disable a receiver's front-panel buttons (OUT ooo BTN ON/OFF)
    params:
      output: *output_all
      enabled: { type: bool, required: true, label: Buttons, description: "On lets the receiver's buttons work; off locks them." }
    send:
      - { models: *all, message: "OUT {output:03d} BTN {enabled:map.upper_onoff}" }
    returns: none

  set_output_ir:
    summary: Enable or disable a receiver's IR receiver (OUT ooo IR ON/OFF)
    params:
      output: *output_all
      enabled: { type: bool, required: true, label: IR, description: "On accepts IR at the receiver; off ignores it." }
    send:
      - { models: *all, message: "OUT {output:03d} IR {enabled:map.upper_onoff}" }
    returns: none

  set_output_ir_voltage:
    summary: Set an ACM500 receiver's rear-panel IR voltage (OUT ooo IRVAL 5V/12V)
    params:
      output: *output_all
      volts: &ir_volts { type: enum, values: [5V, 12V], required: true, label: IR voltage, description: "The rear-panel IR line's voltage." }
    send:
      - { models: [acm500], message: "OUT {output:03d} IRVAL {volts}" }
    returns: none

  set_output_mute:
    summary: Mute or unmute an output's audio (OUT ooo MUTE ON/OFF)
    params:
      output: *output_all
      muted: { type: bool, required: true, label: Muted, description: "On mutes the receiver's audio." }
    send:
      - { models: *all, message: "OUT {output:03d} MUTE {muted:map.upper_onoff}" }
    returns: none

  set_output_pause:
    summary: Freeze or unfreeze an output's picture (OUT ooo PAUSE ON/OFF)
    params:
      output: *output_all
      paused: { type: bool, required: true, label: Paused, description: "On holds the current frame on the display." }
    send:
      - { models: *gen2, message: "OUT {output:03d} PAUSE {paused:map.upper_onoff}" }
    returns: none

  set_output_auto_on:
    summary: Let a receiver turn its display on by itself or not (OUT ooo AUTOON)
    params:
      output: *output_all
      enabled: { type: bool, required: true, label: Auto on, description: "On turns the display on when a source arrives." }
    send:
      - { models: *gen2, message: "OUT {output:03d} AUTOON {enabled:map.enabled_word}" }
      - { models: [acm500], message: "OUT {output:03d} AUTOON {enabled:map.upper_onoff}" }
    returns: none

  set_output_led_timeout:
    summary: Set when a receiver's front-panel LEDs turn off (OUT ooo LED ee)
    params:
      output: *output_all
      timeout: &led_timeout { type: int, min: 0, max: 9, required: true, label: LED timeout,
                              description: "0 keeps the LEDs on; 1-9 turns them off after 10-90 seconds." }
    send:
      - { models: *all, message: "OUT {output:03d} LED {timeout}" }
    returns: none

  set_output_serial_guest:
    summary: Set a receiver's serial guest mode and port settings (OUT ooo SG ON/OFF BR br BIT bit)
    params:
      output: *output_all
      enabled: &guest_enabled { type: bool, required: true, label: Guest mode, description: "On lets a controller reach the endpoint's RS-232 port through the ACM." }
      baud: &guest_baud { type: enum, values: ["300", "600", "1200", "2400", "4800", "9600", "19200", "38400", "57600", "115200"], required: true,
                          label: Baud rate, description: "The endpoint's RS-232 rate in bits per second." }
      format: &guest_format { type: string, pattern: '^[5-8][noe][12]$', required: true, label: Format,
                              description: "Data bits 5-8, parity n, o or e, stop bits 1 or 2, such as 8n1." }
    send:
      - { models: *gen2, message: "OUT {output:03d} SG {enabled:map.upper_onoff} BR {baud:map.guest_baud_wide} BIT {format}" }
    returns: none

  set_output_serial_guest_sdvoe:
    summary: Set an ACM500 receiver's serial guest mode and port settings, 2400-115200 (OUT ooo SG ON/OFF BR br BIT bit)
    params:
      output: *output_all
      enabled: *guest_enabled
      baud: &guest_baud_sdvoe { type: enum, values: ["2400", "4800", "9600", "19200", "38400", "57600", "115200"], required: true,
                                label: Baud rate, description: "The endpoint's RS-232 rate in bits per second." }
      format: *guest_format
    send:
      - { models: [acm500], message: "OUT {output:03d} SG {enabled:map.upper_onoff} BR {baud:map.guest_baud_narrow} BIT {format}" }
    returns: none

  start_output_serial_guest:
    summary: Open serial guest mode to a receiver's RS-232 port on this connection (OUT ooo GUEST)
    params: { output: *output_one }
    send:
      - { models: *all, message: "OUT {output:03d} GUEST" }
    returns: none

  close_serial_guest:
    summary: Close serial guest mode (CLOSEACMGUEST)
    send:
      - { models: *all, message: "CLOSEACMGUEST" }
    returns: none

  set_output_hdcp:
    summary: Set a receiver's HDCP override (OUT ooo HDCP BYP/V14/V22)
    params:
      output: *output_all
      hdcp: &hdcp { type: enum, values: [BYP, V14, V22], required: true, label: HDCP, description: "BYP bypass, V14 HDCP 1.4, V22 HDCP 2.2." }
    send:
      - { models: *gen2, message: "OUT {output:03d} HDCP {hdcp}" }
    returns: none

  set_output_system_size:
    summary: Set a receiver's system size (OUT ooo SSM L/N)
    params:
      output: *output_all
      size: &system_size { type: enum, values: [L, N], required: true, label: System size, description: "L large, N normal, as the endpoint's manual describes." }
    send:
      - { models: *gen2, message: "OUT {output:03d} SSM {size}" }
    returns: none

  get_output_status:
    summary: Print one receiver's detail report; its lines update state (OUT ooo STATUS)
