    params:
      layout: *pip_layout
      mode: { type: enum, values: [SIDEBYSIDE, OVERLAY], required: true, label: Mode, description: "SIDEBYSIDE splits the screen; OVERLAY puts the window over the background." }
    send:
      - { models: [acm500], message: "PIP {layout} MODE {mode}" }
