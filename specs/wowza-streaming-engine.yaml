commands:

  get_rest_api_info:
    summary: Retrieves the REST configuration information (Get REST API info)
    send: {method: GET, path: /restinfo}
    expect: {status: 200, json_path: $}
    returns: value

  get_machine_current_stats:
    summary: Retrieves current statistics for the machine (Get current stats)
    send: {method: GET, path: /v2/machine/monitoring/current}
    expect: {status: 200, json_path: $}
    returns: value

  get_machine_historic_stats:
    summary: Retrieves historic statistics for the machine (Get historic stats)
    send: {method: GET, path: /v2/machine/monitoring/historic}
    expect: {status: 200, json_path: $}
    returns: value

  get_server_list:
    summary: Retrieves the list of servers (Get server list)
    send: {method: GET, path: /v2/servers}
    expect: {status: 200, json_path: $}
    returns: value

  get_server:
    summary: Retrieves the server configuration (Get server)
    send: {method: GET, path: '/v2/servers/{settings.server}'}
    expect: {status: 200, json_path: $}
    returns: value

  update_server:
    summary: Updates the server configuration (Update server)
    params:
      config: {type: json, required: true, label: Configuration, description: A JSON object in the API reference's ServerConfig shape; fields left out keep their values where the reference says so.}
    send: {method: PUT, path: '/v2/servers/{settings.server}', body: '{config}', content_type: application/json}
    expect: {status: [200, 201, 204]}
    returns: ack

  server_actions:
    summary: Tells the server to perform an action (Server actions)
    params:
      action: {type: enum, values: [heapDump, restart, stackTrace, start, stop], required: true, label: Action, description: 'What to do: heapDump to write a heap dump; restart to restart; stackTrace to write a stack trace; start to start; stop to stop.'}
    send: {method: PUT, path: '/v2/servers/{settings.server}/actions/{action}'}
    expect: {status: [200, 201, 204]}
    returns: ack

  server_actions_with_file:
    summary: Tells the server to perform an action, with file (Server actions)
    params:
      action: {type: enum, values: [heapDump, restart, stackTrace, start, stop], required: true, label: Action, description: 'What to do: heapDump to write a heap dump; restart to restart; stackTrace to write a stack trace; start to start; stop to stop.'}
      filename: {type: string, pattern: \S, max_length: 1024, required: true, label: File, description: 'The file (heap dump or stack trace location, or the media cache item) the action is for.'}
    send: {method: PUT, path: '/v2/servers/{settings.server}/actions/{action}', query: {filename: '{filename}'}}
    expect: {status: [200, 201, 204]}
    returns: ack

  get_server_adv:
    summary: Retrieves the advanced server configuration (Get server (adv))
    send: {method: GET, path: '/v2/servers/{settings.server}/adv'}
    expect: {status: 200, json_path: $}
    returns: value

  update_server_adv:
    summary: Updates the advanced server configuration (Update server (adv))
    params:
      config: {type: json, required: true, label: Configuration, description: A JSON object in the API reference's ServerConfigAdv shape; fields left out keep their values where the reference says so.}
    send: {method: PUT, path: '/v2/servers/{settings.server}/adv', body: '{config}', content_type: application/json}
    expect: {status: [200, 201, 204]}
    returns: ack

  get_license_list:
    summary: Retrieves the list of server licenses (Get license list)
    send: {method: GET, path: '/v2/servers/{settings.server}/licenses'}
    expect: {status: 200, json_path: $}
    returns: value

  update_license_list:
    summary: Updates the server license list (Update license list)
    params:
      config: {type: json, required: true, label: Configuration, description: A JSON object in the API reference's ServerLicensesConfig shape; fields left out keep their values where the reference says so.}
    send: {method: PUT, path: '/v2/servers/{settings.server}/licenses', body: '{config}', content_type: application/json}
    expect: {status: [200, 201, 204]}
    returns: ack

  get_listener_list:
    summary: Retrieves the list of server listeners (Get listener list)
    send: {method: GET, path: '/v2/servers/{settings.server}/listeners'}
    expect: {status: 200, json_path: $}
    returns: value

  update_listener_list:
    summary: Updates the server listeners list (Update listener list)
    params:
      config: {type: json, required: true, label: Configuration, description: A JSON object in the API reference's ServerListenersConfig shape; fields left out keep their values where the reference says so.}
    send: {method: PUT, path: '/v2/servers/{settings.server}/listeners', body: '{config}', content_type: application/json}
    expect: {status: [200, 201, 204]}
    returns: ack

  get_log4j_config:
    summary: Retrieves the server log4j configuration (Get log4j config)
    send: {method: GET, path: '/v2/servers/{settings.server}/log4j'}
    expect: {status: 200, json_path: $}
    returns: value

  log4j_actions:
    summary: Tells the log4j system to perform an action (Log4j actions)
    params:
      action: {type: enum, values: [reload], required: true, label: Action, description: 'What to do: reload to reload.'}
    send: {method: PUT, path: '/v2/servers/{settings.server}/log4j/actions/{action}'}
    expect: {status: [200, 201, 204]}
    returns: ack

  get_webrtc_debug_log:
    summary: Reports whether webrtc2 debug logging is enabled (Reports whether webrtc2 debug logging is enabled)
    send: {method: GET, path: '/v2/servers/{settings.server}/log4j/webrtcdebuglog'}
    expect: {status: 200, json_path: $}
    returns: value

  set_webrtc_debug_log:
    summary: Enables or disables webrtc2 debug logging (Enables or disables webrtc2 debug logging)
    params:
      config: {type: json, required: true, label: Configuration, description: A JSON object in the API reference's Log4jWebRTCDebugLog shape; fields left out keep their values where the reference says so.}
    send: {method: PUT, path: '/v2/servers/{settings.server}/log4j/webrtcdebuglog', body: '{config}', content_type: application/json}
    expect: {status: [200, 201, 204]}
    returns: ack

  log4j_logger_actions:
    summary: Tells the specified log4j logger to perform an action (Log4j logger actions)
    params:
      action: {type: enum, values: [debug, error, fatal, info, reload, warn], required: true, label: Action, description: 'What to do: debug to debug; error to error; fatal to fatal; info to info; reload to reload; warn to warn.'}
      logger: {type: string, pattern: '^[^/\s][^/]*$', max_length: 256, required: true, label: Logger, description: The log4j logger's name.}
    send: {method: PUT, path: '/v2/servers/{settings.server}/log4j/{logger}/actions/{action}'}
    expect: {status: [200, 201, 204]}
    returns: ack

  get_log_list:
    summary: Retrieves the list of server log files (Get log list)
    send: {method: GET, path: '/v2/servers/{settings.server}/logfiles'}
    expect: {status: 200, json_path: $}
    returns: value

  get_log_list_ordered:
    summary: Retrieves the list of server log files, with order (Get log list)
    params:
      order: {type: enum, values: [newestFirst, oldestFirst], label: Order, description: 'The order of the log files: newestFirst or oldestFirst.', default: newestFirst}
    send: {method: GET, path: '/v2/servers/{settings.server}/logfiles', query: {order: '{order}'}}
    expect: {status: 200, json_path: $}
    returns: value

  get_log:
    summary: Retrieves the contents of a server log with the specified log name (Get log)
    params:
      log: {type: string, pattern: '^[^/\s][^/]*$', max_length: 256, required: true, label: Log file, description: 'The log file''s name, as get_log_list gives it.'}
    send: {method: GET, path: '/v2/servers/{settings.server}/logfiles/{log}'}
    expect: {status: 200, json_path: $}
    returns: value

  get_log_tail:
    summary: Retrieves the contents of a server log with the specified log name, with lines (Get log)
    params:
      lines: {type: int, min: 1, max: 1000000, required: true, label: Lines, description: How many of the last lines to return.}
