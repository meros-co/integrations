quirks:
  - models: [all]
    severity: critical
    text: >
      stop ends a recording in progress and record starts or stops one; record toggles, so sent
      while recording it stops the take. run_action, run_named_action and run_midi_editor_action
      run any REAPER action, including ones that delete items, close the project or quit REAPER,
      with no confirmation through OSC.

  - models: [all]
    severity: warning
    text: >
      REAPER must have an OSC control surface added (Preferences > Control/OSC/web, Control surface
      mode OSC, Default pattern config), set to "Configure device IP+local port": Local listen port
      the port commands go to (8000 here by default), Device IP this host and Device port the
      feedback_port setting (9000 by default). REAPER never acknowledges a message, so every
      command is reported unverified, and with no feedback configured nothing reaches the state.
      A custom pattern config that renames or removes patterns breaks the commands and feedback
      that use them.

  - models: [all]
    severity: warning
    text: >
      Track numbers address the device's track bank, not REAPER's track list directly: on
      connecting the core sets the bank size to the track_count setting, and with bank 1 selected
      track n is REAPER's track n. select_track_bank moves the bank, after which the same numbers
      address other tracks and the state's tracks.* follow the new bank. REAPER reports only the
      bank's tracks, and markers and regions only up to the marker_count and region_count
      settings, numbered by their place among those reported.

  - models: [all]
    severity: warning
    text: >
      REAPER sends feedback when something changes, so the state fills as things change; there is
      no documented request for the whole state. Running REAPER's "Control surface: Refresh all
      surfaces" action with run_action makes REAPER send everything again; its command ID is in
      REAPER's Actions list.

  - models: [all]
    severity: warning
    text: >
      The default pattern config sends a lot of feedback, including time, beat, frames and level
      meters many times a second; REAPER's own notes warn it can flood a device. The core keeps the
      latest values; comment out unwanted patterns in a copy of the config to reduce the traffic.

  - models: [all]
    severity: info
    text: >
      Fader, pan and send levels are REAPER's normalized fader positions from 0.0 to 1.0, whose dB
      depend on REAPER's fader preferences; set_track_volume_db and tracks.*.volume_db carry dB.
      FX bypass is inverted on the wire (1 is active, 0 bypassed): set_fx_bypass sends it that way
      and the state holds tracks.*.fx.*.active.

  - models: [all]
    severity: info
    text: >
      Binary values (mute, solo, arm, select, bypass, rewind, forward) are sent as OSC integers 1
      and 0, as the pattern config's b flag describes them; trigger and toggle messages are sent
      with no argument.
