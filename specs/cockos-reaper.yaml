telemetry:
  # REAPER sends each change to the device IP and port set for the control
  # surface; the core listens on the feedback port.
  updates:
    - address: '^/play$'
      state: { "transport.playing": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/stop$'
      state: { "transport.stopped": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/pause$'
      state: { "transport.paused": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/record$'
      state: { "transport.recording": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/repeat$'
      state: { "transport.repeat": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/click$'
      state: { "transport.metronome": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/replace$'
      state: { "transport.replace": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/autorecarm$'
      state: { "transport.auto_record_arm": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/rewind$'
      state: { "transport.rewinding": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/forward$'
      state: { "transport.forwarding": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/anysolo$'
      state: { "transport.any_solo": { value: "{arg0}", map: { "0": false, "1": true, "0.0": false, "1.0": true } } }
    - address: '^/time$'
      arg_types: f
      state: { "transport.time": "{arg0}" }
    - address: '^/beat/str$'
      state: { "transport.beat": "{arg0}" }
    - address: '^/frames/str$'
      state: { "transport.frames": "{arg0}" }
    - address: '^/tempo/raw$'
      state: { "transport.tempo": "{arg0}" }
    - address: '^/playrate/raw$'
