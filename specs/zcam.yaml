        - { method: GET, path: /ctrl/get, raw_query: "k=wifi" }
        - { method: GET, path: /ctrl/get, raw_query: "k=wifi_channel" }
  updates:
    # /ctrl/get?k=<key>: every setting the same way (type 1 choice, 2 range,
    # 3 string).
    - path: '^/ctrl/get\?k=([A-Za-z0-9_]+)$'
      json_match: { "$.code": "^0$" }
      json: { value: "$.value", type: "$.type", ro: "$.ro", opts: "$.opts", min: "$.min", max: "$.max", step: "$.step" }
      state:
        "settings.{1}.value": "{value}"
        "settings.{1}.kind": { value: "{type}", map: { "1": choice, "2": range, "3": string } }
        "settings.{1}.read_only": { value: "{ro}", map: { "0": false, "1": true } }
        "settings.{1}.options": "{opts}"
        "settings.{1}.min": "{min}"
        "settings.{1}.max": "{max}"
        "settings.{1}.step": "{step}"
    - path: '^/ctrl/get\?k=([A-Za-z0-9_]+)$'
      json_match: { "$.code": "^-1$" }
      json: {}
      state: { "settings.{1}.supported": "false" }
    - path: '^/ctrl/get\?k=([A-Za-z0-9_]+)$'
      json_match: { "$.code": "^0$" }
      json: {}
      state: { "settings.{1}.supported": "true" }
    # /info
    - path: '^/info$'
      json: { model: "$.model", sw: "$.sw", mac: "$.mac", ip: "$.eth_ip", sn: "$.sn" }
      state: { info.model: "{model}", info.firmware: "{sw}", info.mac: "{mac}", info.ip: "{ip}", info.serial: "{sn}" }
    # Answers of the basic shape {code, desc, msg}.
    - path: '^/ctrl/mode\?action=query$'
      json_match: { "$.code": "^0$" }
      json: { msg: "$.msg" }
      state: { mode: "{msg}" }
    - path: '^/ctrl/rec\?action=remain$'
      json_match: { "$.code": "^0$" }
      json: { msg: "$.msg" }
      state: { recording.remaining_minutes: "{msg}" }
    - path: '^/ctrl/card\?action=present$'
      json: { all: "$" }
      state: { card.present: "{all}" }
    - path: '^/ctrl/card\?action=query_free$'
      json_match: { "$.code": "^0$" }
      json: { msg: "$.msg" }
      state: { card.free: "{msg}" }
    - path: '^/ctrl/card\?action=query_total$'
      json_match: { "$.code": "^0$" }
      json: { msg: "$.msg" }
      state: { card.total: "{msg}" }
    # Answers whose fields the document does not list: kept whole, as JSON text.
    - path: '^/ctrl/tc\?action=query$'
      json: { all: "$" }
      state: { timecode: "{all}" }
    - path: '^/ctrl/nick_name$'
      json: { all: "$" }
      state: { nick_name: "{all}" }
    - path: '^/ctrl/temperature$'
      json: { all: "$" }
      state: { temperature: "{all}" }
    - path: '^/ctrl/stream_setting\?action=query&index=(stream[01])$'
      json: { all: "$" }
      state: { "streams.{1}": "{all}" }
    - path: '^/ctrl/rtmp\?action=query&index=(\d+)$'
      json: { all: "$" }
      state: { "rtmp.{1}": "{all}" }
    - path: '^/ctrl/srt\?action=query$'
      json: { all: "$" }
      state: { srt: "{all}" }
    - path: '^/ctrl/ndi\?action=query$'
      json: { all: "$" }
      state: { ndi: "{all}" }
    - path: '^/ctrl/pt\?action=query$'
      json: { all: "$" }
      state: { pan_tilt: "{all}" }
    - path: '^/ctrl/network\?action=info$'
      json: { all: "$" }
      state: { network: "{all}" }

state:
  settings.*.value: { type: string, description: "Current value of the setting with this key, as the camera reports it (a choice's text, a range's number, or a string)" }
  settings.*.kind: { type: string, description: "Kind of setting: choice, range or string" }
  settings.*.read_only: { type: bool, description: "The setting cannot be changed now" }
  settings.*.options: { type: string, description: "A choice setting's valid values, as a JSON array" }
  settings.*.min: { type: int, description: "A range setting's lowest value" }
  settings.*.max: { type: int, description: "A range setting's highest value" }
  settings.*.step: { type: int, description: "A range setting's step" }
  settings.*.supported: { type: bool, description: "The camera knows the key (false when /ctrl/get answers code -1)" }
  info.model: { type: string, description: "Camera model" }
  info.firmware: { type: string, description: "Firmware version" }
  info.mac: { type: string, description: "Ethernet MAC address" }
  info.ip: { type: string, description: "Ethernet IP address" }
  info.serial: { type: string, description: "Serial number" }
  mode: { type: string, description: "Working mode: rec, rec_ing, rec_paused, cap, pb, pb_ing, pb_paused, cap_tl_idle, cap_tl_ing, cap_burst, cap_snap_idle, cap_snap_ing, rec_tl_idle, rec_tl_ing, standby or unknown (_ing means recording or playing)" }
  recording.remaining_minutes: { type: int, unit: min, description: "Recording time left on the card, in minutes" }
  card.present: { type: string, description: "The card presence query's answer, as JSON text" }
  card.free: { type: string, description: "Free space on the card, as the camera reports it" }
  card.total: { type: string, description: "Card capacity, as the camera reports it" }
  timecode: { type: string, description: "The timecode query's answer, as JSON text (its fields are not documented)" }
  nick_name: { type: string, description: "The nickname query's answer, as JSON text" }
  temperature: { type: string, description: "The temperature query's answer, as JSON text" }
  streams.*: { type: string, description: "The stream setting query's answer for stream0 or stream1, as JSON text" }
  rtmp.*: { type: string, description: "The RTMP query's answer for the destination with this number, as JSON text" }
  srt: { type: string, description: "The SRT query's answer, as JSON text" }
  ndi: { type: string, description: "The NDI query's answer, as JSON text" }
  pan_tilt: { type: string, description: "The pan/tilt query's answer, as JSON text" }
  network: { type: string, description: "The network information query's answer, as JSON text" }

quirks:
  - models: [all]
    severity: warning
    text: >
      Most /ctrl/* commands need the control session. The first /ctrl/session request occupies it,
      and the camera answers 409 to a client while another holds it; telemetry asks for it every
      second so this client keeps it, and quit_session gives it up. A camera held by another client
      (its web page, another controller) refuses this one's commands until that client quits.
  - models: [all]
    severity: warning
    text: >
      The document leaves the camera's websocket (port 81) undescribed, so nothing is pushed: the
      session, mode and timecode are read every second, the most-used settings every 2 s and every
      other setting every 30 s. A key a model does not have answers code -1 and shows as
      settings.<key>.supported false.
  - models: [all]
    severity: info
    text: >
      Every setting is a key of /ctrl/get and /ctrl/set. The valid values depend on the model,
      firmware, video system and other settings, so the set commands take the value as text and the
      camera's own list of options (settings.<key>.options) or range (min, max, step) is in state;
      a value outside them is refused by the camera with code 1. movfmt and movvfr cannot change
      while stream 0 runs, and a stream's size only while it is stopped.
  - models: [all]
    severity: info
    text: >
      Many answers' fields are not listed in the document (timecode, stream settings, RTMP, SRT,
      NDI, pan/tilt, network, presets, framing, face database, temperature): their queries return
      the answer as it is, and the polled ones are kept in state as JSON text. Parameter ranges
      the document does not give (lens and pan/tilt speeds in api.js's fspeed, preset and trace
      numbers, framing values) are those the camera's web controller is assumed to send.
  - models: [all]
    severity: info
    text: >
      Newer firmware has user accounts (/login) and HTTPS (https_on, https_auth); the document
      does not describe how a client logs in, so this spec sends no credentials and reaches a
      camera whose web access is open. Downloading clips, thumbnails, screennails, the MJPEG
      preview and the profile export (/prf/export) returns files, which a command here cannot save.
  - models: [all]
    severity: critical
    text: >
      format_card, format_card_fat32, format_card_exfat, delete_file, clear_settings and
      run_firmware_update cannot be undone; shutdown powers the camera off, and stop_recording and
      a mode change end a take in progress.

