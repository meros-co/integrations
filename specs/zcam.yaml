    params:
      speed: { type: int, min: 0, max: 100, default: 50, label: Speed, description: "Lens drive speed, as the camera's web controller sends it; higher is faster." }
    send: { method: GET, path: /ctrl/lens, raw_query: "action=zoomin&fspeed={speed}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
