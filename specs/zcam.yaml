  # ── Camera, session, time and power ────────────────────────────────────
  get_info:
    summary: "Read the camera's model, firmware, MAC and IP address and serial number (/info)"
    send: { method: GET, path: /info }
    expect: { status: 200, json_path: "$" }
    returns: value
  get_status:
    summary: "Read the camera status (/camera_status)"
    send: { method: GET, path: /camera_status }
    expect: { status: 200, json_path: "$" }
    returns: value
  get_commit_info:
    summary: "Read the firmware build information (/commit_info)"
    send: { method: GET, path: /commit_info }
    expect: { status: 200, json_path: "$" }
    returns: value
  get_nick_name:
    summary: "Read the camera's nickname"
    send: { method: GET, path: /ctrl/nick_name }
    expect: { status: 200, json_path: "$" }
    returns: value
  set_nick_name:
    summary: "Set the camera's nickname"
    params:
      name: { type: string, max_length: 64, required: true, label: Nickname, description: "Name the camera shows for itself on the network." }
    send: { method: GET, path: /ctrl/nick_name, raw_query: "action=set&name={name:url}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  check_session:
    summary: "Check or take the control session; answers 409 while another client holds it"
    send: { method: GET, path: /ctrl/session }
    expect: { status: 200 }
    returns: ack
  occupy_session:
    summary: "Take the control session so no other client can control the camera"
    send: { method: GET, path: /ctrl/session, raw_query: "action=occupy" }
    expect: { status: 200 }
    returns: ack
  quit_session:
    summary: "Give up the control session"
    send: { method: GET, path: /ctrl/session, raw_query: "action=quit" }
    expect: { status: 200 }
    returns: ack
  set_date_time:
    summary: "Set the camera's date and time"
    params:
      date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", required: true, label: Date, description: "Date as YYYY-MM-DD." }
      time: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}$", required: true, label: Time, description: "Time of day as hh:mm:ss, 24-hour." }
    send: { method: GET, path: /datetime, raw_query: "date={date}&time={time}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  get_date_time:
    summary: "Read the camera's date, time and time zone"
    send: { method: GET, path: /datetime/get }
    expect: { status: 200, json_path: "$" }
    returns: value
  set_timezone:
    summary: "Set the camera's time zone"
    params:
      timezone: { type: string, max_length: 64, required: true, label: Time zone, description: "Time zone as the camera's web interface lists it." }
    send: { method: GET, path: /datetime, raw_query: "timezone={timezone:url}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  start_ntp:
    summary: "Synchronize the clock with an NTP server at an interval"
    params:
      server: { type: string, max_length: 253, required: true, label: NTP server, description: "Address or host name of the NTP server." }
      port: { type: int, min: 1, max: 65535, default: 123, label: Port, description: "NTP server port, 123 by default." }
      interval: { type: int, min: 1, max: 2147483647, required: true, label: Interval, description: "Time between synchronizations, in the unit the camera uses for its NTP interval." }
    send: { method: GET, path: /ctrl/sntp, raw_query: "action=start&ip_addr={server:url}&port={port}&interval={interval}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  stop_ntp:
    summary: "Stop NTP synchronization"
    send: { method: GET, path: /ctrl/sntp, raw_query: "action=stop" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  get_ntp:
    summary: "Read the NTP status"
    send: { method: GET, path: /ctrl/sntp, raw_query: "action=get" }
    expect: { status: 200, json_path: "$" }
    returns: value
  set_ntp_interval:
    summary: "Change the NTP synchronization interval"
    params:
      interval: { type: int, min: 1, max: 2147483647, required: true, label: Interval, description: "Time between synchronizations, in the unit the camera uses for its NTP interval." }
    send: { method: GET, path: /ctrl/sntp, raw_query: "action=set_interval&interval={interval}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  get_temperature:
    summary: "Read the camera temperature"
    send: { method: GET, path: /ctrl/temperature }
    expect: { status: 200, json_path: "$" }
    returns: value
  shutdown:
    summary: "Power the camera off"
    send: { method: GET, path: /ctrl/shutdown }
    expect: { status: 200 }
    returns: ack
  reboot:
    summary: "Restart the camera"
    send: { method: GET, path: /ctrl/reboot }
    expect: { status: 200 }
    returns: ack

  # ── Working mode ───────────────────────────────────────────────────────
  get_mode:
    summary: "Read the working mode (rec, rec_ing, pb, standby and others)"
