commands:

  # ── Settings by key (/ctrl/get, /ctrl/set) ─────────────────────────────
  get_setting:
    summary: "Read one setting by its key: value, type, read-only flag, options or range"
    params:
      key: { type: string, max_length: 64, pattern: "^[A-Za-z0-9_]+$", required: true, label: Key, description: "Setting key as the camera names it, such as iso, wb or movfmt." }
    send: { method: GET, path: /ctrl/get, raw_query: "k={key}" }
    expect: { status: 200, json_path: "$" }
    returns: value
  set_setting:
    summary: "Change one setting by its key, then read it back"
    params:
      key: { type: string, max_length: 64, pattern: "^[A-Za-z0-9_]+$", required: true, label: Key, description: "Setting key as the camera names it, such as iso, wb or movfmt." }
      value: { type: string, max_length: 256, required: true, label: Value, description: "New value: one of the options the camera lists for the key, or a number within its minimum and maximum." }
    send:
      - { method: GET, path: /ctrl/set, raw_query: "{key}={value:url}" }
      - { method: GET, path: /ctrl/get, raw_query: "k={key}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  get_settings_catalog:
    summary: "Read every setting of a catalog at once (/ctrl/getbatch)"
    params:
      catalog: { type: string, max_length: 64, pattern: "^[A-Za-z0-9_]+$", required: true, label: Catalog, description: "Name of the settings catalog, as the camera's web interface groups its settings." }
    send: { method: GET, path: /ctrl/getbatch, raw_query: "catalog={catalog:url}" }
    expect: { status: 200, json_path: "$" }
    returns: value
  clear_settings:
    summary: "Reset every setting to its default (/ctrl/set?action=clear)"
    send: { method: GET, path: /ctrl/set, raw_query: "action=clear" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  set_focus:
    summary: "Set focus method (AF or MF) (key focus), then read it back"
    params:
      value: { type: string, max_length: 256, required: true, label: Value, description: "New value: one of the options the camera lists for the key, or a number within its minimum and maximum." }
    send:
      - { method: GET, path: /ctrl/set, raw_query: "focus={value:url}" }
      - { method: GET, path: /ctrl/get, raw_query: "k=focus" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  set_af_mode:
    summary: "Set autofocus area type (key af_mode), then read it back"
    params:
      value: { type: string, max_length: 256, required: true, label: Value, description: "New value: one of the options the camera lists for the key, or a number within its minimum and maximum." }
