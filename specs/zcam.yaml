spec: 1
id: zcam
name: Z CAM cinema and PTZ cameras (HTTP API)
vendor: Z CAM
category: camera

# Z CAM's cameras (E2 series, the P2 PTZ cameras and the E2-F/S/M models)
# serve one HTTP API on port 80: /info identifies the camera, /ctrl/get and
# /ctrl/set read and change every menu setting by key, and /ctrl/* commands
# record, stream, drive the lens and the pan/tilt head, manage presets and
# traces, auto framing, the card and the network. Most /ctrl/* commands need
# the control session, which the first /ctrl/session request occupies.

source:
  - title: Z CAM HTTP API (E2/protocol/http/http.md)
    author: Z CAM (Imagine Vision)
    url: https://github.com/imaginevision/Z-Camera-Doc/blob/master/E2/protocol/http/http.md
    note: >
      Manufacturer document in Z CAM's documentation repository (last changed 2025-11-05), read
      2026-10-27. Sections: Basic (code 0 OK, 1 NG; desc; msg), Get camera information (/info as the
      ping: model, sw, mac, eth_ip, sn), Session (/ctrl/session, 409 when the session is held by
      another client; action=quit; action=occupy), Date/Time, NTP (/ctrl/sntp), System control
      (shutdown, reboot), Working mode (query, to_rec, to_pb, to_standby, exit_standby; the msg
      values), Video record control (start, stop, remain in minutes), Camera settings (/ctrl/get
      answers key, type 1 choice/2 range/3 string, ro, value, opts or min/max/step; /ctrl/set),
      Network setting (Router, Direct, Static with ipaddr, netmask, gateway and dns; query; info),
      Network streaming (send_stream, MJPEG at /mjpeg_stream, RTSP at /live_stream,
      /ctrl/stream_setting with index, width, height, bitrate, split, fps, venc, bitwidth and
      action=query), Focus & Zoom control (/ctrl/af, update_roi, update_roi_center, query; mf_drive;
      lens_focus_pos; lens_zoom in/out/stop; lens_zoom_pos), Magnify (/ctrl/mag), Pan Tilt control
      (/ctrl/pt directions and stop, speed 0-0x3F, UART role PelcoD), Card management, File management
      (/DCIM folders and files, act=rm, thm, scr, ct, info), WebSockets (port 81, contents not
      described), Knee/Slope (/ctrl/gamma gamma, black_level, black_gamma, knee), manual black level
      (/ctrl/manual_blc), Black Level (/ctrl/black_level).
  - title: Z CAM HTTP API reference code (E2/protocol/http/api.js)
    author: Z CAM (Imagine Vision)
    url: https://github.com/imaginevision/Z-Camera-Doc/blob/master/E2/protocol/http/api.js
    note: >
      The manufacturer's reference the HTTP document names as the list of current commands and
      supported keys ("Please check the referece code for the latest command"), read 2026-10-27 as
      documentation: every request path, its query arguments and every /ctrl/get and /ctrl/set key
      (camera, session, ctrl getbatch, lens zoom/focus with fspeed and status, AF settings and face
      trace, pt query/stop/stop_all/direction/pt/home/reset/limit, preset recall/set/del/get_info/
      set_name/preset_speed, ptrace, login users, ipac allow and deny lists, rec query/remain/
      repairing, tc query/reset/current_time/set, still capture, playback query, rtmp, srt, ndi,
      rtsp, stream_setting performance, matrix, cc, black_level, gamma, framing, ezframing, facedb,
      upgrade, DCIM, set?action=clear, temperature, freed, datetime get and timezone, snmp, sntp,
      card query_format, power, usb, wifi_ctrl). No code taken; the repository has no licence file
      and is read as documentation.

transport:
  type: http
  port: 80
  auth: none
  timeout_ms: 5000
  probe: { method: GET, path: /info }

ports:
  - { port: 80, protocol: http, role: control }

