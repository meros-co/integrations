  # ── Pan/tilt ───────────────────────────────────────────────────────────
  pan_tilt_move:
    summary: "Move the pan/tilt head in a direction until pan_tilt_stop"
    params:
      direction: { type: enum, values: [left, right, up, down, leftup, leftdown, rightup, rightdown], required: true, label: Direction, description: "Direction of the move, including the four diagonals." }
      speed: { type: int, min: 0, max: 63, default: 32, label: Speed, description: "Pan/tilt speed, 0 to 63 (0x3F); higher is faster." }
    send: { method: GET, path: /ctrl/pt, raw_query: "action={direction}&fspeed={speed}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  pan_tilt_drive:
    summary: "Move with separate pan and tilt speeds (negative is left or down)"
    params:
      pan_speed: { type: int, min: -63, max: 63, required: true, label: Pan speed, description: "Pan speed, -63 to 63: positive pans right, negative left, 0 holds." }
      tilt_speed: { type: int, min: -63, max: 63, required: true, label: Tilt speed, description: "Tilt speed, -63 to 63: positive tilts up, negative down, 0 holds." }
    send: { method: GET, path: /ctrl/pt, raw_query: "action=pt&pan_speed={pan_speed}&tilt_speed={tilt_speed}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  pan_tilt_stop:
    summary: "Stop the pan/tilt move"
    send: { method: GET, path: /ctrl/pt, raw_query: "action=stop" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  pan_tilt_stop_all:
    summary: "Stop every pan/tilt, zoom and focus move"
    send: { method: GET, path: /ctrl/pt, raw_query: "action=stop_all" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  pan_tilt_home:
    summary: "Move to the home position"
    send: { method: GET, path: /ctrl/pt, raw_query: "action=home" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  pan_tilt_reset:
    summary: "Recalibrate the pan/tilt head"
    send: { method: GET, path: /ctrl/pt, raw_query: "action=reset" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  set_pan_tilt_limit:
    summary: "Set a pan/tilt limit to a position"
    params:
      direction: { type: string, max_length: 16, pattern: "^[A-Za-z0-9_]+$", required: true, label: Limit, description: "Which limit to set, as the camera names it (the direction of the limit)." }
      pan: { type: int, min: -2147483648, max: 2147483647, required: true, label: Pan position, description: "Pan position of the limit, in the camera's position units." }
      tilt: { type: int, min: -2147483648, max: 2147483647, required: true, label: Tilt position, description: "Tilt position of the limit, in the camera's position units." }
    send: { method: GET, path: /ctrl/pt, raw_query: "action=limit&direct={direction}&pan_pos={pan}&tilt_pos={tilt}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  get_pan_tilt:
    summary: "Read the pan/tilt position"
    send: { method: GET, path: /ctrl/pt, raw_query: "action=query" }
