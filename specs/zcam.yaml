  set_snmp_contact:
    summary: "Set the SNMP contact"
    params:
      contact: { type: string, max_length: 128, required: true, label: Contact, description: "SNMP contact." }
    send: { method: GET, path: /ctrl/snmp, raw_query: "contact={contact:url}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  get_freed:
    summary: "Read the FreeD tracking output settings"
    send: { method: GET, path: /ctrl/freed }
    expect: { status: 200, json_path: "$" }
    returns: value
  set_freed_enabled:
    summary: "Turn the FreeD output on or off"
    params:
      enabled: { type: bool, required: true, label: Enabled, description: "On turns it on, off turns it off." }
    send: { method: GET, path: /ctrl/freed, raw_query: "enable={enabled:bool01}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  set_freed_camera_id:
    summary: "Set the FreeD camera ID"
    params:
      id: { type: int, min: 0, max: 255, required: true, label: Camera ID, description: "FreeD camera ID, 0 to 255." }
    send: { method: GET, path: /ctrl/freed, raw_query: "camera_id={id}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  set_freed_destination:
    summary: "Set a FreeD destination address and port"
    params:
      index: { type: int, min: 0, max: 7, required: true, label: Destination, description: "FreeD destination number, as the camera numbers them." }
      address: { type: string, max_length: 253, required: true, label: Address, description: "Destination IP address." }
      port: { type: int, min: 1, max: 65535, required: true, label: Port, description: "Destination UDP port." }
    send: { method: GET, path: /ctrl/freed, raw_query: "ip{index}={address:url}&port{index}={port}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  check_firmware:
    summary: "Check for a firmware update"
    send: { method: GET, path: /ctrl/upgrade, raw_query: "action=fw_check" }
    expect: { status: 200, json_path: "$" }
    returns: value
  run_firmware_update:
    summary: "Install the firmware update the check found"
    send: { method: GET, path: /ctrl/upgrade, raw_query: "action=run" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  check_ui_update:
    summary: "Check for a web interface update"
    send: { method: GET, path: /ctrl/upgrade, raw_query: "action=ui_check" }
    expect: { status: 200, json_path: "$" }
    returns: value

  # ── Card and files ─────────────────────────────────────────────────────
  get_card_present:
    summary: "Read whether a card is in the camera"
    send: { method: GET, path: /ctrl/card, raw_query: "action=present" }
    expect: { status: 200, json_path: "$" }
    returns: value
  get_card_free:
    summary: "Read the free space on the card"
    send: { method: GET, path: /ctrl/card, raw_query: "action=query_free" }
    expect: { status: 200, json_path: "$.msg" }
    returns: value
  get_card_total:
    summary: "Read the card's capacity"
    send: { method: GET, path: /ctrl/card, raw_query: "action=query_total" }
    expect: { status: 200, json_path: "$.msg" }
    returns: value
  get_card_format:
    summary: "Read the card's file system"
    send: { method: GET, path: /ctrl/card, raw_query: "action=query_format" }
    expect: { status: 200, json_path: "$" }
    returns: value
  format_card:
    summary: "Format the card, the camera choosing the file system"
    send: { method: GET, path: /ctrl/card, raw_query: "action=format" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  format_card_fat32:
    summary: "Format the card as FAT32"
    send: { method: GET, path: /ctrl/card, raw_query: "action=fat32" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  format_card_exfat:
    summary: "Format the card as exFAT"
    send: { method: GET, path: /ctrl/card, raw_query: "action=exfat" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  list_folders:
    summary: "List the DCIM folders on the card"
    send: { method: GET, path: /DCIM/ }
    expect: { status: 200, json_path: "$" }
    returns: value
  list_files:
    summary: "List the files in a DCIM folder"
    params:
      folder: { type: string, max_length: 64, pattern: "^[A-Za-z0-9_]+$", required: true, label: Folder, description: "DCIM folder name, such as 100ZCAME." }
    send: { method: GET, path: "/DCIM/{folder}/" }
    expect: { status: 200, json_path: "$" }
    returns: value
  delete_file:
    summary: "Delete a file from the card"
    params:
      folder: { type: string, max_length: 64, pattern: "^[A-Za-z0-9_]+$", required: true, label: Folder, description: "DCIM folder name, such as 100ZCAME." }
      file: { type: string, max_length: 128, pattern: "^[A-Za-z0-9_.-]+$", required: true, label: File, description: "File name in the folder, such as ZCAM0001_0000_202601011200.MOV." }
    send: { method: GET, path: "/DCIM/{folder}/{file}", raw_query: "act=rm" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  get_file_info:
    summary: "Read a clip's width, height, timescale, packet count and duration"
    params:
      folder: { type: string, max_length: 64, pattern: "^[A-Za-z0-9_]+$", required: true, label: Folder, description: "DCIM folder name, such as 100ZCAME." }
      file: { type: string, max_length: 128, pattern: "^[A-Za-z0-9_.-]+$", required: true, label: File, description: "File name in the folder, such as ZCAM0001_0000_202601011200.MOV." }
    send: { method: GET, path: "/DCIM/{folder}/{file}", raw_query: "act=info" }
    expect: { status: 200, json_path: "$" }
    returns: value
  get_file_created:
    summary: "Read when a file was created (Unix time)"
    params:
      folder: { type: string, max_length: 64, pattern: "^[A-Za-z0-9_]+$", required: true, label: Folder, description: "DCIM folder name, such as 100ZCAME." }
      file: { type: string, max_length: 128, pattern: "^[A-Za-z0-9_.-]+$", required: true, label: File, description: "File name in the folder, such as ZCAM0001_0000_202601011200.MOV." }
    send: { method: GET, path: "/DCIM/{folder}/{file}", raw_query: "act=ct" }
    expect: { status: 200, json_path: "$.msg" }
    returns: value


telemetry:
  # The camera's websocket on port 81 is not described, so state is polled:
  # the control session and working mode every second (the session request
  # also keeps this client's hold on it), the settings an operator changes
  # during a show every 2 s, and the rest every 30 s.
  poll:
    - every_ms: 1000
      send:
        - { method: GET, path: /ctrl/session }
        - { method: GET, path: /ctrl/mode, raw_query: "action=query" }
        - { method: GET, path: /ctrl/tc, raw_query: "action=query" }
    - every_ms: 2000
      send:
        - { method: GET, path: /ctrl/get, raw_query: "k=iso" }
        - { method: GET, path: /ctrl/get, raw_query: "k=iris" }
        - { method: GET, path: /ctrl/get, raw_query: "k=ev" }
        - { method: GET, path: /ctrl/get, raw_query: "k=wb" }
        - { method: GET, path: /ctrl/get, raw_query: "k=mwb" }
        - { method: GET, path: /ctrl/get, raw_query: "k=tint" }
        - { method: GET, path: /ctrl/get, raw_query: "k=focus" }
        - { method: GET, path: /ctrl/get, raw_query: "k=lens_focus_pos" }
        - { method: GET, path: /ctrl/get, raw_query: "k=lens_zoom_pos" }
        - { method: GET, path: /ctrl/get, raw_query: "k=eND" }
        - { method: GET, path: /ctrl/get, raw_query: "k=lut" }
        - { method: GET, path: /ctrl/get, raw_query: "k=movfmt" }
