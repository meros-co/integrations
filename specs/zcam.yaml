    summary: "Switch to video record mode"
    send:
      - { method: GET, path: /ctrl/mode, raw_query: "action=to_rec" }
      - { method: GET, path: /ctrl/mode, raw_query: "action=query" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  to_playback_mode:
    summary: "Switch to playback mode"
    send:
      - { method: GET, path: /ctrl/mode, raw_query: "action=to_pb" }
      - { method: GET, path: /ctrl/mode, raw_query: "action=query" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  to_standby:
