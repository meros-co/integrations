    send: { method: GET, path: /ctrl/tc, raw_query: "action=current_time" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  set_timecode:
    summary: "Set the timecode"
    params:
      timecode: { type: string, pattern: "^[0-9]{2}:[0-9]{2}:[0-9]{2}[:;][0-9]{2}$", required: true, label: Timecode, description: "Timecode as hh:mm:ss:ff (or hh:mm:ss;ff for drop frame)." }
    send: { method: GET, path: /ctrl/tc, raw_query: "action=set&tc={timecode:url}" }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack

  # ── Lens ───────────────────────────────────────────────────────────────
