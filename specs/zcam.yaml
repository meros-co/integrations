    returns: value
  autofocus:
    summary: "Run autofocus once (one push)"
    send: { method: GET, path: /ctrl/af }
    expect: { status: 200, json_equals: { "$.code": 0 } }
    returns: ack
  set_af_roi:
    summary: "Set the autofocus area (x, y, width, height in thousandths of the image)"
    params:
      x: { type: int, min: 0, max: 1000, required: true, label: X, description: "Left edge of the area, in thousandths of the image." }
      y: { type: int, min: 0, max: 1000, required: true, label: Y, description: "Top edge of the area, in thousandths of the image." }
      width: { type: int, min: 0, max: 1000, required: true, label: Width, description: "Width of the area, in thousandths of the image." }
      height: { type: int, min: 0, max: 1000, required: true, label: Height, description: "Height of the area, in thousandths of the image." }
    send: { method: GET, path: /ctrl/af, raw_query: "action=update_roi&x={x}&y={y}&w={width}&h={height}" }
