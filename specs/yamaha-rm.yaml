    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:ExtMic_Gate/Ch/Attack (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'mic_inputs.{1:+1}.gate_attack': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:ExtMic_Gate/Ch/Decay (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
