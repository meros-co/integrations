    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:ExtMic_Gate/Ch/On (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'mic_inputs.{1:+1}.gate_on': { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:ExtMic_Gate/Ch/Threshold (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'mic_inputs.{1:+1}.gate_threshold': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:ExtMic_Gate/Ch/Range (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
