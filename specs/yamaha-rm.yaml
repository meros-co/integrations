telemetry:
  # Asked once on connecting; every other value arrives as the reply to a
  # command or as a NOTIFY push. Parameter values are not polled: which
  # AccessIDs exist depends on the model (section 7), and a poll list is
  # shared by every model of the spec.
  poll:
    send:
      - 'devstatus runmode'
      - 'devstatus error'
      - 'devinfo protocolver'
      - 'devinfo paramsetver'
      - 'devinfo version'
      - 'devinfo productname'
      - 'devinfo serialno'
      - 'devinfo category'
      - 'devinfo deviceid'
      - 'devinfo devicename'
      - 'devinfo manufacturer'
  updates:
    - match: '^(?:OK|NOTIFY) devstatus runmode "(\w+)"$'
      state: { 'device.run_mode': '{1}' }
    - match: '^(?:OK|NOTIFY) devstatus error "(\w+)"$'
      state: { 'device.error': '{1}' }
    - match: '^OK devinfo protocolver "((?:[^"\\]|\\.)*)"$'
      state: { 'device.protocol_version': '{1}' }
    - match: '^OK devinfo paramsetver "((?:[^"\\]|\\.)*)"$'
      state: { 'device.parameter_set_version': '{1}' }
    - match: '^OK devinfo version "((?:[^"\\]|\\.)*)"$'
      state: { 'device.firmware': '{1}' }
    - match: '^OK devinfo productname "((?:[^"\\]|\\.)*)"$'
      state: { 'device.product_name': '{1}' }
    - match: '^OK devinfo serialno "((?:[^"\\]|\\.)*)"$'
      state: { 'device.serial': '{1}' }
    - match: '^OK devinfo category "((?:[^"\\]|\\.)*)"$'
      state: { 'device.category': '{1}' }
    - match: '^OK devinfo deviceid "((?:[^"\\]|\\.)*)"$'
      state: { 'device.device_id': '{1}' }
    - match: '^OK devinfo devicename "((?:[^"\\]|\\.)*)"$'
      state: { 'device.name': '{1}' }
    - match: '^OK devinfo manufacturer "((?:[^"\\]|\\.)*)"$'
      state: { 'device.manufacturer': '{1}' }
    - match: '^OK prmnum (\d+)$'
      state: { 'device.parameter_count': '{1}' }
    - match: '^OK mtrnum (\d+)$'
      state: { 'device.meter_count': '{1}' }
    - match: '^NOTIFY event RM:Alert "([0-9A-Fa-f]+):(.*),(warning|error|fault)"$'
      state: { 'alerts.last_number': '{1}', 'alerts.last_message': '{2}', 'alerts.last_severity': '{3}' }
    - match: '^NOTIFY event RM:FirmwareUpdateStarted.*$'
      state: { 'firmware_update.started': { value: "Started", map: { "Started": true } } }
    - match: '^NOTIFY event RM:FirmwareUpdateFinished "(\w+)"$'
      state: { 'firmware_update.result': '{1}' }
    - match: '^OK event RM:(?:Set|Get)TimeZone "(\d+)"$'
      state: { 'clock.time_zone': '{1}' }
    - match: '^OK event RM:(?:Set|Get)DstEnable "(Enable|Disable)"$'
      state: { 'clock.dst_enabled': { value: "{1}", map: { "Enable": true, "Disable": false } } }
    - match: '^OK event RM:(?:Set|Get)DstStartTime "([^"]*)"$'
      state: { 'clock.dst_start': '{1}' }
    - match: '^OK event RM:(?:Set|Get)DstEndTime "([^"]*)"$'
      state: { 'clock.dst_end': '{1}' }
    - match: '^OK event RM:(?:Set|Get)NtpEnable "(Enable|Disable)"$'
      state: { 'clock.ntp_enabled': { value: "{1}", map: { "Enable": true, "Disable": false } } }
    - match: '^OK event RM:(?:Set|Get)NtpServer([1-4]) "([^"]*)"$'
      state: { 'clock.ntp_servers.{1}': '{2}' }
    - match: '^NOTIFY mtr RM:(\w+) (level|gr|raw|dBm) .*$'
      state: { 'meters.{1}.type': '{2}' }
    - match: '^NOTIFY mtr RM:(\w+) (?:(?:level|gr|raw|dBm) )?([-0-9A-Fa-f ]+)$'
      state: { 'meters.{1}.values': '{2}' }
    - match: '^(?:OK|NOTIFY) sscurrent_ex config (\d+)(?: (?:un)?modified)?$'
      state: { 'snapshots.current': '{1}' }
    - match: '^OK sscurrent_ex config \d+ ((?:un)?modified)$'
      state: { 'snapshots.modified': { value: "{1}", map: { "modified": true, "unmodified": false } } }
    - match: '^(?:OK|NOTIFY) ssrecall_ex config (\d+)$'
      state: { 'snapshots.last_recalled': '{1}' }
    - match: '^NOTIFY ssupdate_ex \w+ (\d+)$'
      state: { 'snapshots.last_updated': '{1}' }
    - match: '^OK ssnum_ex config (\d+)$'
      state: { 'snapshots.count': '{1}' }
    - match: '^OK ssinfo_ex config (\d+) "((?:[^"\\]|\\.)*)" "((?:[^"\\]|\\.)*)" "(?:[^"\\]|\\.)*" (\w+)$'
      state: { 'snapshots.{1}.number_text': '{2}', 'snapshots.{1}.title': '{3}', 'snapshots.{1}.attribute': '{4}' }
    - match: '^NOTIFY event rm: ?changedcallstatus "([A-Za-z0-9_-]+)=([^"]*)"$'
      state: { 'calls.status.{1}': '{2}' }
    - match: '^NOTIFY event rm: ?changedcallconfig "([A-Za-z0-9_-]+)=([^"]*)"$'
      state: { 'calls.config.{1}': '{2}' }
    - match: '^NOTIFY event rm: ?callrecent "(\d+)=([^"]*)"$'
      state: { 'calls.recents.{1}': '{2}' }
    - match: '^NOTIFY event rm: ?changedcallcontacts "(\d+)=([^"]*)"$'
      state: { 'calls.contacts.{1}': '{2}' }
    - match: '^(?:OK|NOTIFY) event rm: ?(?:get)?bluetoothstatus "(disable|idle|connected|pairing)"$'
      state: { 'bluetooth.status': '{1}' }
    - match: '^(?:OK|NOTIFY) event rm: ?(?:get)?dectstatus "(idle|pairing)"$'
      state: { 'dect.status': '{1}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_EQ/Ch/On/On (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.eq_on': { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_EQ/Ch/Band/Bypass (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.eq.{2:+1}.bypass': { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_EQ/Ch/Band/Frequency (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.eq.{2:+1}.frequency': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_EQ/Ch/Band/Gain (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.eq.{2:+1}.gain': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_EQ/Ch/Band/Q (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.eq.{2:+1}.q': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_EQ/Ch/Band/Type (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.eq.{2:+1}.type': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_AGC/Ch/On (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.agc_on': { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_AGC/Ch/TargetLevel (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.agc_target_level': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_AGC/Ch/MaxGain (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.agc_max_gain': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_AGC/Ch/MinGain (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.agc_min_gain': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_AGC/Ch/NoiseGateOn (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.agc_noise_gate_on': { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_Fader/Ch/On (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.on': { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:FeIn_Fader/Ch/Level (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'far_end_inputs.{1:+1}.level': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:ExtMic_EQ/Ch/On/On (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'mic_inputs.{1:+1}.eq_on': { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:ExtMic_EQ/Ch/Band/Bypass (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'mic_inputs.{1:+1}.eq.{2:+1}.bypass': { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:ExtMic_EQ/Ch/Band/Frequency (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
