spec: 1
id: yamaha-rm
name: Yamaha RM series (RM-CR, RM-CG, RM-TT, RM-WAP)
vendor: Yamaha
category: other

# Yamaha Remote Control Protocol (RCP) as the RM series implements it.
# Page numbers are the document's printed page numbers, which equal the PDF
# page numbers. Parameters are addressed by fixed AccessIDs (RM:...) listed per
# model in section 7; every one of them has a typed set_/get_ command here
# (get only for the two read-only RM-WAP values). Typed commands number
# channels, bands and other sub-addresses from 1 and convert to the wire's
# 0-based X/Y; the generic set_parameter/get_parameter commands take x and y as
# sent on the wire.
source:
  - title: "RM Series (RM-CR/RM-CG/RM-TT/RM-WAP) Remote Control Protocol Specifications, Version 3.0.0 (Oct. 1, 2025)"
    author: Yamaha Corporation
    url: https://download.yamaha.com/files/tcm:39-1525882
    note: >
      Manufacturer document; applies to RM-CR/RM-CG/RM-TT V3.0.0 and later and
      RM-WAP V3.0.0 and later. Setup, TCP port 49280, up to eight controllers
      p.5; command list p.6; syntax (LF-terminated lines, quoted strings with
      \" and \\ escapes, ASCII) p.7; NOTIFY devstatus/set/setn/mtr/event p.8-9;
      devstatus p.9; scpmode p.10-11; get/getn/set/setn p.11-13;
      mtrstart/mtrstop p.13-14; devinfo p.14-17; prmnum/prminfo p.17-18;
      mtrnum/mtrinfo/identify p.19; Event List p.20-21 and Dialer Line Status
      p.22; command sequences p.23-28; meter values p.29-31; parameter value
      tables p.32-43; Parameter List p.44-51 (RM-CR, Nos. 1-135), p.52-54
      (RM-CG, 1-46), p.55-56 (RM-TT, 1-28), p.57-60 (RM-WAP, 1-48); Meter List
      p.61-66; Snapshot List (RM-CR) p.67.

transport:
  type: line-tcp
  port: 49280
  framing: terminated
  terminator: lf
  encoding: ascii
  timeout_ms: 3000
  reply: expected
  # Replies begin "OK", "OKm" (value clamped) or "ERROR"; NOTIFY pushes from
  # this or another controller can arrive at any time and are never a reply.
  reply_match: '^(OK|OKm|ERROR) '
  probe: devstatus runmode

