commands:
  get_run_mode:
    summary: 'Get the run mode, "normal" or "update" (devstatus runmode, 2-1, p.9); commands are accepted only in normal'
    send: devstatus runmode
    expect: { matches: '^OK devstatus runmode "(\w+)"' }
    returns: value

  get_error_status:
    summary: 'Get the alert status, "none", "fault", "error" or "warning" (devstatus error, 2-2, p.9)'
    send: devstatus error
    expect: { matches: '^OK devstatus error "(\w+)"' }
    returns: value

  set_encoding:
    summary: 'Set the character encoding of replies and notifications, ascii (default) or utf8 (scpmode encoding, 2-3, p.10)'
    params:
      encoding: { type: enum, values: [ascii, utf8], required: true }
    send: "scpmode encoding {encoding}"
    expect: { matches: '^OK scpmode encoding ' }
    returns: ack

  set_value_type:
    summary: 'Set whether parameter change notifications carry raw values (NOTIFY set, default) or normalized values (NOTIFY setn) (scpmode valuetype, 2-4, p.10)'
    params:
      value_type: { type: enum, values: [raw, normalized], required: true }
    send: "scpmode valuetype {value_type}"
    expect: { matches: '^OK scpmode valuetype ' }
    returns: ack

  set_normalized_resolution:
    summary: 'Set the resolution of normalized values, default 1000; "should be more than 100", no maximum given; 1023 gives raw-value resolution on faders (scpmode resolution, 2-5, p.10)'
    params:
      resolution: { type: int, min: 101, required: true }
    send: "scpmode resolution {resolution}"
    expect: { matches: '^OK scpmode resolution ' }
    returns: ack

  set_keepalive:
    summary: 'Enable the keepalive; the device closes the connection when nothing (a command or a bare LF) arrives within interval_ms plus 1 s; "should be more than 1000" ms; disabled by default (scpmode keepalive, 2-6, p.11)'
    params:
      interval_ms: { type: int, min: 1001, required: true }
    send: "scpmode keepalive {interval_ms}"
    expect: { matches: '^OK scpmode keepalive ' }
    returns: ack

  get_protocol_version:
    summary: 'Get the external control protocol version (3-1, p.14)'
    send: devinfo protocolver
    expect: { matches: '^OK devinfo protocolver "((?:[^"\\]|\\.)*)"' }
    returns: value

  get_parameter_set_version:
    summary: 'Get the parameter set version, such as "RM:1.0.0" (3-2, p.14)'
    send: devinfo paramsetver
    expect: { matches: '^OK devinfo paramsetver "((?:[^"\\]|\\.)*)"' }
    returns: value

  get_firmware_version:
    summary: 'Get the firmware version (3-3, p.15)'
    send: devinfo version
    expect: { matches: '^OK devinfo version "((?:[^"\\]|\\.)*)"' }
    returns: value

  get_product_name:
    summary: 'Get the product name, such as "RM-CR" (3-4, p.15)'
    send: devinfo productname
    expect: { matches: '^OK devinfo productname "((?:[^"\\]|\\.)*)"' }
    returns: value

  get_serial_number:
    summary: 'Get the serial number (3-5, p.15)'
    send: devinfo serialno
    expect: { matches: '^OK devinfo serialno "((?:[^"\\]|\\.)*)"' }
    returns: value

  get_category:
    summary: 'Get the device category: "processor" (RM-CR) or "microphone" (RM-CG, RM-TT, RM-WAP) (3-6, p.16)'
    send: devinfo category
    expect: { matches: '^OK devinfo category "((?:[^"\\]|\\.)*)"' }
    returns: value

  get_device_id:
    summary: 'Get the device (UNIT) ID, 3 hexadecimal digits (3-7, p.16)'
    send: devinfo deviceid
    expect: { matches: '^OK devinfo deviceid "((?:[^"\\]|\\.)*)"' }
    returns: value

  get_device_name:
    summary: 'Get the device label, up to 63 characters (3-8, p.16)'
    send: devinfo devicename
    expect: { matches: '^OK devinfo devicename "((?:[^"\\]|\\.)*)"' }
    returns: value

  get_manufacturer:
    summary: 'Get the manufacturer name, "Yamaha Corporation" (3-9, p.17)'
    send: devinfo manufacturer
    expect: { matches: '^OK devinfo manufacturer "((?:[^"\\]|\\.)*)"' }
    returns: value

  get_parameter_count:
    summary: 'Get the number of parameters (prmnum, 3-10, p.17)'
    send: prmnum
    expect: { matches: '^OK prmnum (\d+)' }
    returns: value

  get_parameter_info:
    summary: 'Get the structure of the parameter at an index numbered from 0 (up to prmnum - 1) as the device''s text, "OK prminfo <index> <address> <xnum> <ynum> <min> <max> <default> <unit> <type> <ui> <rw> <scaling>" (prminfo, 3-11, p.17-18)'
    params:
      index: { type: int, min: 0, required: true }
    send: "prminfo {index}"
    expect: { matches: '^OK prminfo ' }
    returns: text

  get_meter_count:
    summary: 'Get the number of meters (mtrnum, 3-12, p.19)'
    send: mtrnum
    expect: { matches: '^OK mtrnum (\d+)' }
    returns: value

  get_meter_info:
    summary: 'Get the structure of the meter at an index as the device''s text, "OK mtrinfo <index> <address> <count> <type>" (mtrinfo, 3-13, p.19)'
    params:
      index: { type: int, min: 0, required: true }
    send: "mtrinfo {index}"
    expect: { matches: '^OK mtrinfo ' }
    returns: text

  identify:
    summary: 'Enter identify display mode for a number of seconds (identify, 3-14, p.19); the RM document gives no range'
    params:
      seconds: { type: int, min: 0, required: true }
    send: "identify {seconds}"
    expect: { matches: '^OKm? identify ' }
    returns: ack

  set_parameter:
    summary: 'Set a parameter by AccessID (section 7) to a raw value; x and y are the sub-addresses as sent on the wire, numbered from 0 (set, 2-9, p.12). A clamped value is answered OKm'
    params:
      address: { type: string, pattern: '^RM:[A-Za-z0-9_/]+$', required: true }
      x: { type: int, min: 0, default: 0 }
      y: { type: int, min: 0, default: 0 }
      value: { type: int, required: true }
    send: "set {address} {x} {y} {value}"
    expect: { matches: '^OKm? set RM:' }
    returns: ack

  set_parameter_normalized:
    summary: 'Set a parameter by AccessID to a normalized value, 0 to the resolution (default 1000); x and y numbered from 0 (setn, 2-10, p.13)'
    params:
      address: { type: string, pattern: '^RM:[A-Za-z0-9_/]+$', required: true }
      x: { type: int, min: 0, default: 0 }
      y: { type: int, min: 0, default: 0 }
      value: { type: int, min: 0, required: true }
    send: "setn {address} {x} {y} {value}"
    expect: { matches: '^OKm? setn RM:' }
    returns: ack

  set_parameter_text:
    summary: 'Set a parameter by AccessID from its display string, printable ASCII, sent quoted with \" and \\ escapes; x and y numbered from 0 (sett; listed in the section 7 tables only, not in the command list)'
    params:
      address: { type: string, pattern: '^RM:[A-Za-z0-9_/]+$', required: true }
      x: { type: int, min: 0, default: 0 }
      y: { type: int, min: 0, default: 0 }
      text: { type: string, pattern: '^[ -~]*$', required: true }
    send: "sett {address} {x} {y} {text:json}"
    expect: { matches: '^OKm? sett RM:' }
    returns: ack

  set_parameter_relative:
    summary: 'Change a parameter by AccessID by a number of steps, negative to decrease; x and y numbered from 0 (setr; listed in the section 7 tables only, not in the command list)'
    params:
      address: { type: string, pattern: '^RM:[A-Za-z0-9_/]+$', required: true }
      x: { type: int, min: 0, default: 0 }
      y: { type: int, min: 0, default: 0 }
      steps: { type: int, required: true }
    send: "setr {address} {x} {y} {steps}"
    expect: { matches: '^OKm? setr RM:' }
    returns: ack

  get_parameter:
    summary: 'Get a parameter''s raw value by AccessID; x and y numbered from 0 (get, 2-7, p.11)'
    params:
      address: { type: string, pattern: '^RM:[A-Za-z0-9_/]+$', required: true }
      x: { type: int, min: 0, default: 0 }
      y: { type: int, min: 0, default: 0 }
    send: "get {address} {x} {y}"
    expect: { matches: '^OK get RM:\S+ \d+ \d+ (-?\d+)' }
    returns: value

  get_parameter_normalized:
    summary: 'Get a parameter''s normalized value by AccessID; x and y numbered from 0 (getn, 2-8, p.12)'
    params:
      address: { type: string, pattern: '^RM:[A-Za-z0-9_/]+$', required: true }
      x: { type: int, min: 0, default: 0 }
      y: { type: int, min: 0, default: 0 }
    send: "getn {address} {x} {y}"
    expect: { matches: '^OK getn RM:\S+ \d+ \d+ (-?\d+)' }
    returns: value

  get_parameter_text:
    summary: 'Get a parameter''s display string by AccessID; x and y numbered from 0 (gett; listed in the section 7 tables only)'
    params:
      address: { type: string, pattern: '^RM:[A-Za-z0-9_/]+$', required: true }
      x: { type: int, min: 0, default: 0 }
      y: { type: int, min: 0, default: 0 }
    send: "gett {address} {x} {y}"
    expect: { matches: '^OK gett RM:\S+ \d+ \d+ "((?:[^"\\]|\\.)*)"' }
    returns: value

  start_meter:
    summary: 'Start meter notifications (NOTIFY mtr) for a meter of section 8 at a minimum interval; they stop after 10 s unless requested again (mtrstart, 2-11, p.13, 4.4 p.28)'
    params:
      meter: { type: enum, values: ["RM:InputPort", "RM:OutputPort", "RM:FeInPostFader", "RM:ExtMicPostFader", "RM:NeInPostFader", "RM:FeOutPostFader", "RM:RoomEQPostFader", "RM:NeOutPostFader", "RM:FeInAGCIn", "RM:ExtMicGateOut", "RM:ExtMicGateGR", "RM:ExtMicCompOut", "RM:ExtMicCompGR", "RM:ExtMicAGCIn", "RM:NeInAutomixGain", "RM:NeInAutomixOut", "RM:NeInAGCIn", "RM:VL_GateOut", "RM:VL_GateGR", "RM:VL_AutomixGain", "RM:VL_AutomixOut", "RM:VL_InFader", "RM:VL_AlignFader", "RM:VL_LinkFader", "RM:VL_OutFader", "RM:VL_OscFader", "RM:AecRefPort", "RM:BeamDirection", "RM:MicLinkQualityRssi"], required: true }
      interval_ms: { type: int, min: 1, max: 10000, default: 40 }
    send: "mtrstart {meter} {interval_ms}"
    expect: { matches: '^OK mtrstart RM:' }
    returns: ack

  stop_meter:
    summary: 'Stop meter notifications for a meter (mtrstop, 2-12, p.14)'
    params:
      meter: { type: enum, values: ["RM:InputPort", "RM:OutputPort", "RM:FeInPostFader", "RM:ExtMicPostFader", "RM:NeInPostFader", "RM:FeOutPostFader", "RM:RoomEQPostFader", "RM:NeOutPostFader", "RM:FeInAGCIn", "RM:ExtMicGateOut", "RM:ExtMicGateGR", "RM:ExtMicCompOut", "RM:ExtMicCompGR", "RM:ExtMicAGCIn", "RM:NeInAutomixGain", "RM:NeInAutomixOut", "RM:NeInAGCIn", "RM:VL_GateOut", "RM:VL_GateGR", "RM:VL_AutomixGain", "RM:VL_AutomixOut", "RM:VL_InFader", "RM:VL_AlignFader", "RM:VL_LinkFader", "RM:VL_OutFader", "RM:VL_OscFader", "RM:AecRefPort", "RM:BeamDirection", "RM:MicLinkQualityRssi"], required: true }
    send: "mtrstop {meter}"
    expect: { matches: '^OK mtrstop RM:' }
    returns: ack

  get_current_snapshot:
    summary: 'Get the current preset snapshot number, 0-10 as on the wire, with "modified" or "unmodified" in the reply (sscurrent_ex config, section 9, p.67)'
    send: sscurrent_ex config
    expect: { matches: '^OK sscurrent_ex config (\d+)' }
    returns: value

  recall_snapshot:
    summary: 'Recall a preset snapshot, numbered 0-10 as on the wire (ssrecall_ex config, section 9, p.67)'
    params:
      snapshot: { type: int, min: 0, max: 10, required: true }
    send: "ssrecall_ex config {snapshot}"
    expect: { matches: '^OK ssrecall_ex config ' }
    returns: ack

  get_snapshot_count:
    summary: 'Get the number of preset snapshots (ssnum_ex config, section 9, p.67; the example answers 11)'
    send: ssnum_ex config
