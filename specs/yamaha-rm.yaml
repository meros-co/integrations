      state: { 'units.{1:+1}.aec_level': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:Mic_Dsp/Id/Nrtype (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'units.{1:+1}.nr_level': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:Mic_Dsp/Id/Derevtype (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'units.{1:+1}.dereverb_level': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:NeOut_EQ/Id/On (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'units.{1:+1}.eq_on': { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:NeOut_EQ/Id/Band/Bypass (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'units.{1:+1}.eq.{2:+1}.bypass': { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:NeOut_EQ/Id/Band/Frequency (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'units.{1:+1}.eq.{2:+1}.frequency': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:NeOut_EQ/Id/Band/Gain (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'units.{1:+1}.eq.{2:+1}.gain': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:NeOut_EQ/Id/Band/Q (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'units.{1:+1}.eq.{2:+1}.q': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:NeOut_EQ/Id/Band/Type (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'units.{1:+1}.eq.{2:+1}.type': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:Mic_Agc/Id/Agctype (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'units.{1:+1}.agc_type': '{3}' }
    - match: '^(?:OK|OKm|NOTIFY) (?:set|get) RM:Mic_Agc/Id/AgcSpeed (\d+) (\d+) (-?\d+)(?: "(?:[^"\\]|\\.)*")?$'
      state: { 'units.{1:+1}.agc_speed': '{3}' }

quirks:
  - models: [all]
    severity: critical
    text: >
      Communication start (4.1, p.24-25): the controller must send "devstatus
      runmode" at intervals of 1 second or more until it is answered "OK
      devstatus runmode "normal"", and send nothing else before that. The
      device does not accept commands in update mode. The core's fixed
      connection sequence cannot wait for a reply, so a host must hold its
      commands until device.run_mode is "normal".

  - models: [all]
    severity: warning
    text: >
      Up to eight remote controllers can connect at once (p.5). Without a
      keepalive a connection broken without a close stays "connected" on the
      device and can block new connections; set_keepalive makes the device drop
      a client that sends nothing (a command or a bare LF) for the interval plus
      1 second (p.11).

  - models: [all]
    severity: warning
    text: >
      Changes made by this controller are answered with OK/OKm; changes from
      the device itself or another controller arrive as NOTIFY set (raw value
      mode, the default) or NOTIFY setn (normalized mode), sampled at intervals
      rather than every step (4.5, p.28). The telemetry here reads raw values
      only, so set_value_type normalized stops parameter state updating from
      pushes. A clamped set is answered OKm with the value actually applied.
      After a snapshot recall the controller should query every parameter
      again (4.2, p.26).

  - models: [all]
    severity: warning
    text: >
      Meter notifications started with mtrstart stop after 10 seconds unless
      mtrstart is sent again (4.4, p.28). Meter data are 2-digit hexadecimal
      values separated by spaces, one per channel, decoded with the level/GR
      table (5.1.1, p.29); the RM-CG BeamDirection meter is raw Phi/Theta/HVAD
      data (5.1.2, p.30-31) and RM-WAP MicLinkQualityRssi is dBm -127..0
      (p.66). The meters available differ per model (section 8): RM-CR has the
      26 meters of p.61-63, RM-CG AecRefPort, OutputPort and BeamDirection,
      RM-TT AecRefPort and OutputPort, RM-WAP AecRefPort, OutputPort and
      MicLinkQualityRssi.

  - models: [all]
    severity: info
    text: >
      Strings are double-quoted with \" and \\ escapes and commands are ASCII
      only (p.7). set_parameter_text quotes and escapes its text; event
      commands that put a value inside a quoted "key=value" option
      (firmware_update, provisioning_import, set_ntp_server, call_dial) refuse
      quotes and backslashes rather than escape inside the option. In ASCII
      encoding mode the device replaces characters it cannot send with "?".

  - models: [all]
    severity: info
    text: >
      The RM document does not describe error replies. The RCP family answers a
      rejected command "ERROR <command> <code>" (the code list is in Yamaha's
      DME7 and console RCP documents); such a reply fails the command here.
      Get and set replies are matched on their AccessID but not on the
      sub-address, so a reply is assumed to answer the pending command.

  - models: [rm-cr, rm-cg, rm-tt]
    severity: info
    text: >
      The command list (2.2, p.6) names set, setn, get and getn only, but the
      RM-CR, RM-CG and RM-TT parameter tables list set, setn, sett, setr, get,
      getn and gett for every parameter; set_parameter_text,
      set_parameter_relative and get_parameter_text follow the tables and are
      not otherwise described. The RM-WAP tables list set, get and notify set
      only; setn and getn are kept for RM-WAP because the command list applies
      to the whole series.

  - models: [all]
    severity: info
    text: >
      Typed parameter commands are shared by every model with the same
      AccessID and take the widest documented range; a model answers an out of
      range sub-address with an error. Narrower per-model ranges: NeOut_Fader
      x is 0-4 on RM-CR (only 0-3 labelled), 0-1 on RM-CG and RM-TT; NeOut_EQ
      and Automix/Mixtype x is 0-1 on RM-CG and 0 on RM-TT; MicMute/Link/Enable
      is Dante out 1-2 on RM-CG/RM-TT and unit 1-32 on RM-WAP; Led/Config/Color
      y (LED) is 0-1 on RM-TT and 0 on RM-CG; DSPTOP/MicGaintype steps are 0, 15,
      30, 45 dB on RM-CG and 0, 7, 14, 21 dB on RM-TT; Mic_Agc/Agctype defaults
      to 1 on RM-CG and 2 on RM-TT.

  - models: [rm-wap-8]
    severity: warning
    text: >
      RM-WAP-8 ranges are half those of the RM-WAP-16 (p.57-60): unit IDs 1-16
      (the typed commands accept 1-32), Dante output channels 1-8, and the
      DanteOut_Patch/Output/Id source 0-34 (0-15 UC mic 1-16, 16-31 LL mic
      1-16, 32 none, 33 UC mix, 34 LL mix) instead of 0-66.

  - models: [rm-cg, rm-tt]
    severity: warning
    text: >
      NeOut_Mute/Ch/On (near-end output mute enable) is tabled as 0 : ON,
      1 : OFF with default 1 (RM-CG No. 27, RM-TT No. 19), the reverse of every
      other on/off parameter, while the RM-WAP NeOut_Mute/Id/On is 0 : OFF,
      1 : ON. set_near_end_output_mute takes "ON" as muted and sends muted true
      as 0; if the table is a typing error the sense is inverted.

  - models: [rm-cr]
    severity: warning
    text: >
      SIP functionality is not supported in firmware 3.0 and later (p.21, p.51),
      the firmware this document covers; the call_* commands, get_call_* and
      the SIP channels of the far-end tables (marked * in section 7) apply to
      earlier firmware only. The Event List marks these, Bluetooth and
      DECT/accessory events with a single model column that the extracted text
      does not place; they are assigned here by function (SIP dialer and
      Bluetooth to RM-CR, DECT pairing and accessory identify to RM-WAP).

  - models: [rm-cr]
    severity: info
    text: >
      Snapshots (section 9, p.67) use the category "config" and are numbered
      0-10 on the wire, as here; ssnum_ex answers 11. The table lists "NOTIFY
      ssupdate_ex info" and "file" while its example shows "NOTIFY ssupdate_ex
      config 1"; both are accepted. Dante output matrix outputs are Dante Out
      ch2-16 (wire 0-14), so dante_output_matrix commands take output 2-16.
      DanteIn_Patch/Output/Input x is 0-21 but only 0-15 (Dante input 1-16) and
      17-21 (labelled Voice Lift input ch1-6, five numbers for six channels)
      are described; dante_input_patch takes output 1-22 for wire 0-21.

  - models: [all]
    severity: info
    text: >
      Documentation inconsistencies taken as written: frequencies are listed in
      the parameter tables as 200 = 20 Hz .. 200000 = 20 kHz (0.1 Hz units),
      while the Frequency data table (6.6.1, p.42) lists 20000 = 20.0 Hz; the
      parameter tables' range is used. The Range, Decay, FilterType and
      Timezone data tables are referred to but not included. Several event
      names carry a stray space ("rm: callaction", "rm: getbluetoothstatus");
      the commands send them without it and replies are matched either way.
      Reply forms of the Get* events (time zone, DST, NTP) are not shown and
      are taken to repeat the set form, 'OK event RM:GetTimeZone "<xx>"'. The
      document gives no range for identify.
