    summary: Set the white shading W V PARA B
    params:
      value: { type: string, pattern: '^(?:1[C-F]|[2-9A-D][0-9A-F]|E[0-4])$', required: true, label: W V PARA B, description: 'Correction, 80 is 0, -100 to +100, as 2-digit hex 1C-E4.' }
    send: "\u0002OSL:A7:{value}\u0003"
    expect: { reply_contains: "\u0002OSL:A7:", matches: '^\x02OSL:A7:[0-9A-F]{2}\x03$' }
    returns: ack
  get_white_shading_v_para_b:
    summary: Query the white shading W V PARA B
    send: "\u0002QSL:A7\u0003"
    expect: { reply_contains: "\u0002OSL:A7:", matches: '^\x02OSL:A7:([0-9A-F]{2})\x03$' }
    returns: value
  menu_key_up:
    summary: 'Move the menu cursor up (the cursor keys; menu_up and menu_down turn the dial). Menu open only'
    send: "\u0002CUP:1\u0003"
    expect: { reply_contains: "\u0002CUP:1", matches: '^\x02CUP:1\x03$' }
    returns: ack
  menu_key_down:
    summary: 'Move the menu cursor down (the cursor keys; menu_up and menu_down turn the dial). Menu open only'
    send: "\u0002CDW:1\u0003"
    expect: { reply_contains: "\u0002CDW:1", matches: '^\x02CDW:1\x03$' }
    returns: ack
  menu_key_right:
    summary: 'Move the menu cursor right (the cursor keys; menu_up and menu_down turn the dial). Menu open only'
    send: "\u0002CRT:1\u0003"
    expect: { reply_contains: "\u0002CRT:1", matches: '^\x02CRT:1\x03$' }
    returns: ack
  menu_key_left:
    summary: 'Move the menu cursor left (the cursor keys; menu_up and menu_down turn the dial). Menu open only'
    send: "\u0002CLT:1\u0003"
    expect: { reply_contains: "\u0002CLT:1", matches: '^\x02CLT:1\x03$' }
    returns: ack
  camera_number:
    summary: Set the camera number
    params:
      number: { type: int, min: 1, max: 99, required: true, label: Camera number, description: Camera number 1 to 99. }
    send: "\u0002OSL:AE:{number:02d}\u0003"
    expect: { reply_contains: "\u0002OSL:AE:", matches: '^\x02OSL:AE:[0-9]{2}\x03$' }
    returns: ack
  get_camera_number:
    summary: Query the camera number
    send: "\u0002QSL:AE\u0003"
    expect: { reply_contains: "\u0002OSL:AE:", matches: '^\x02OSL:AE:([0-9]{2})\x03$' }
    returns: value
  camera_title_hex:
    summary: Set the camera title as hex-coded ASCII
    params:
      title: { type: string, pattern: '^[0-9A-F]{40}$', required: true, label: Camera title, description: 'The 20-character title as 40 hex digits of ASCII, padded with 00.' }
    send: "\u0002OSJ:5C:{title}\u0003"
    expect: { reply_contains: "\u0002OSJ:5C:", matches: '^\x02OSJ:5C:.*\x03$' }
    returns: ack
  get_camera_title_hex:
    summary: Query the camera title as hex-coded ASCII
    send: "\u0002QSJ:5C\u0003"
    expect: { reply_contains: "\u0002OSJ:5C:", matches: '^\x02OSJ:5C:(.*)\x03$' }
    returns: value
  detail_level:
    summary: Set the detail level (0-3)
    params:
      level: { type: int, min: 0, max: 3, required: true, label: Detail, description: 'Detail level 0 to 3; on AW-HE50/HE60/HE120/HE40/HE65/HE70/UE70 0 off, 1 low, 2 high.' }
    send: "\u0002ODT:{level}\u0003"
    expect: { reply_contains: "\u0002ODT:", matches: '^\x02ODT:[0-3]\x03$' }
    returns: ack
  get_detail_level:
    summary: Query the detail level (0-3)
    send: "\u0002QDT\u0003"
    expect: { reply_contains: "\u0002ODT:", matches: '^\x02ODT:([0-3])\x03$' }
    returns: value
  contrast:
    summary: Set the contrast
    params:
      level: { type: int, min: 0, max: 4, required: true, label: Contrast, description: Contrast 0 to 4. }
    send: "\u0002OSD:50:{level}\u0003"
    expect: { reply_contains: "\u0002OSD:50:", matches: '^\x02OSD:50:[0-4]\x03$' }
    returns: ack
  get_contrast:
    summary: Query the contrast
    send: "\u0002QSD:50\u0003"
    expect: { reply_contains: "\u0002OSD:50:", matches: '^\x02OSD:50:([0-4])\x03$' }
    returns: value
  chroma_step:
    summary: Set the chroma level (0-10)
    params:
      level: { type: string, pattern: '^0[3-9A-D]$', required: true, label: Chroma level, description: 'Chroma level, 03 (0) to 0D (10), as 2-digit hex 03-0D.' }
    send: "\u0002OCG:{level}\u0003"
    expect: { reply_contains: "\u0002OCG:", matches: '^\x02OCG:[0-9A-F]{2}\x03$' }
    returns: ack
  get_chroma_step:
    summary: Query the chroma level (0-10)
    send: "\u0002QCG\u0003"
    expect: { reply_contains: "\u0002OCG:", matches: '^\x02OCG:([0-9A-F]{2})\x03$' }
    returns: value
  slow_shutter:
    summary: Set slow shutter (longer exposures in Full Auto)
    params:
      enabled: { type: bool, required: true, label: Slow shutter, description: 'On turns slow shutter (longer exposures in Full Auto) on, off turns it off.' }
    send: "\u0002OSJ:80:{enabled:bool01}\u0003"
    expect: { reply_contains: "\u0002OSJ:80:", matches: '^\x02OSJ:80:[01]\x03$' }
    returns: ack
  get_slow_shutter:
    summary: Query slow shutter (longer exposures in Full Auto)
    send: "\u0002QSJ:80\u0003"
    expect: { reply_contains: "\u0002OSJ:80:", matches: '^\x02OSJ:80:([01])\x03$' }
    returns: value
  language:
    summary: Set the menu language
    params:
      language: { type: int, min: 0, max: 2, required: true, label: Language, description: '0 English, 1 Japanese, 2 Chinese.' }
    send: "\u0002OSJ:82:{language}\u0003"
    expect: { reply_contains: "\u0002OSJ:82:", matches: '^\x02OSJ:82:[0-2]\x03$' }
    returns: ack
  get_language:
    summary: Query the menu language
    send: "\u0002QSJ:82\u0003"
    expect: { reply_contains: "\u0002OSJ:82:", matches: '^\x02OSJ:82:([0-2])\x03$' }
    returns: value
  serial_protocol:
    summary: Set the serial protocol
    params:
      protocol: { type: int, min: 0, max: 1, required: true, label: Protocol, description: '0 Panasonic, 1 standard.' }
    send: "\u0002OVP:02:{protocol}\u0003"
    expect: { reply_contains: "\u0002OVP:02:", matches: '^\x02OVP:02:[0-1]\x03$' }
    returns: ack
  get_serial_protocol:
    summary: Query the serial protocol
    send: "\u0002QVP:02\u0003"
    expect: { reply_contains: "\u0002OVP:02:", matches: '^\x02OVP:02:([0-1])\x03$' }
    returns: value
  serial_connector:
    summary: Set the serial connector
    params:
      connector: { type: int, min: 0, max: 1, required: true, label: Connector, description: '0 RS-422, 1 RS-232C.' }
    send: "\u0002OVP:03:{connector}\u0003"
    expect: { reply_contains: "\u0002OVP:03:", matches: '^\x02OVP:03:[0-1]\x03$' }
    returns: ack
  get_serial_connector:
    summary: Query the serial connector
    send: "\u0002QVP:03\u0003"
    expect: { reply_contains: "\u0002OVP:03:", matches: '^\x02OVP:03:([0-1])\x03$' }
    returns: value
  serial_camera_address:
    summary: Set the serial camera address
    params:
      address: { type: int, min: 0, max: 7, required: true, label: Camera address, description: 'Camera address 1 to 7, or 0 for auto.' }
    send: "\u0002OVP:05:{address}\u0003"
    expect: { reply_contains: "\u0002OVP:05:", matches: '^\x02OVP:05:[0-7]\x03$' }
    returns: ack
  get_serial_camera_address:
    summary: Query the serial camera address
    send: "\u0002QVP:05\u0003"
    expect: { reply_contains: "\u0002OVP:05:", matches: '^\x02OVP:05:([0-7])\x03$' }
    returns: value

