spec: 1
id: panasonic-ptz-serial
name: Panasonic AW-series PTZ cameras on RS-422
vendor: Panasonic
category: camera

# Generated by tools/generate_panasonic_serial.py from specs/panasonic-ptz.yaml: edit those, not this
# file. The same commands as over IP, on the camera's RS-422 port: a pan-tilt head command is
# '#' + command + CR, a camera command STX + command + ETX, and the replies and update notifications
# are framed the same way (chapter 3, 4-1 and 5-2 of each interface specification).
source:
  - title: AW-UE80/UE50/UE40/UE30 HD/4K Integrated Camera Interface Specifications (2025-03-01)
    author: Panasonic Entertainment & Communication Co., Ltd.
    url: https://eww.pass.panasonic.co.jp/pro-av/support/content/guide/DEF/UE80/AW-UE80UE50UE40_InterfaceSpecification_E.pdf
    note: >
      Manufacturer document. Command types (chapter 3, p.5): pan-tilt head commands start with # and end
      with CR, camera commands start with STX (02H) and end with ETX (03H), neither needed over IP.
      Serial communication (4-1, p.6): RS-422, half duplex, 9600 bps, 8 data bits, 1 stop bit, no
      parity, no flow control; a pan-tilt command is answered with its reply, a camera command with ACK
      (06H) and then its reply; 40 ms between pan-tilt commands. Update notifications on the serial line
      (5-2, p.10): pan-tilt ones end with CR, camera ones are between STX and ETX. Error returns
      (chapter 7, p.19-20); commands chapter 9.
  - title: HD/4K Integrated Camera Interface Specifications AW-UE150/AW-HE145 (2022-04-01)
    author: Panasonic Connect Co., Ltd.
    url: https://eww.pass.panasonic.co.jp/pro-av/support/content/guide/DEF/UE150/AW-UE150HE145_InterfaceSpecification_E.pdf
    note: >
      Manufacturer document. Chapter 3, 4-1 (RS-422, half duplex, 9600 bps 8N1, no flow control, the
      same sequences) and 5-2 as in the AW-UE80 document; commands chapter 9. AW-UE155 is treated as an
      AW-UE150.
  - title: HD/4K Integrated Camera Interface Specifications AW-UE100 (2022)
    author: Panasonic Connect Co., Ltd.
    url: https://eww.pass.panasonic.co.jp/pro-av/support/content/guide/DEF/UE100/AW-UE100_InterfaceSpecification_E.pdf
    note: >
      Manufacturer document. Chapter 3, 4-1 (RS-422, half duplex, 9600 bps 8N1, no flow control) and
      5-2; commands chapter 9.
  - title: HD/4K Integrated Camera Interface Specifications AW-UE160 (2025-03-01)
    author: Panasonic Entertainment & Communication Co., Ltd.
    url: https://eww.pass.panasonic.co.jp/pro-av/support/content/guide/DEF/UE160/AW-UE160_InterfaceSpecification_E.pdf
    note: >
      Manufacturer document. Chapter 3, 4-1 (RS-422, half duplex, 9600, 38400 or 115200 bps, 8N1, no
      flow control; 16 ms between pan-tilt commands) and 5-2; menu SERIAL CONNECTION, BAUD RATE (OVP:04,
      not available while tracking data output to serial is on), chapter 8; commands chapter 9.
  - title: HD/4K Integrated Camera Interface Specifications AW-UE20/AW-HE20 (2022-04-01)
    author: Panasonic Connect Co., Ltd.
    url: https://eww.pass.panasonic.co.jp/pro-av/support/content/guide/DEF/UE20/AW-UE20HE20_InterfaceSpecification_E.pdf
    note: >
      Manufacturer document. Chapter 3, 4-1 (RS-422, half duplex, 9600 bps 8N1, no flow control) and
      5-2; menu Serial Com. Protocol (OVP:02, Panasonic or Standard), with Connector Select (OVP:03) and
      Baud Rate (OVP:04) for the Standard protocol only, chapter 8.
  - title: 'HD/4K Integrated Camera Interface Specifications, version 1.12 (2020-04-27), and version 1.07 (2017-01-10)'
    author: Panasonic Corporation
    url: https://eww.pass.panasonic.co.jp/pro-av/support/content/guide/DEF/HE50_120_IP/HDIntegratedCamera_InterfaceSpecifications-E.pdf
    note: >
      Manufacturer documents for the AW-HE40/HE50/HE60/HE65/HE70/HE120/HE130 and AW-UE70, read for a
      serial chapter: both describe control over Ethernet only (chapter 1), so those models are not in
      this spec. The AW-UE4 document has no serial chapter either.

transport:
  type: line-serial
  # Each template carries its own markers: CR after a pan-tilt head command, STX and ETX around a camera
  # command. A reply ends at CR, ETX or the ACK byte; the ACK a camera command gets first is not a reply.
  framing: delimited
  open: ""
  close: ""
  reply_framing: terminated
  reply_terminators: ["\r", "\u0003", "\u0006"]
  reply_match: '^[^\x06]'
  error_match: '^\x02?[Ee]R[1-3]:'
  timeout_ms: 4000
  # A gap of 40 ms between pan-tilt head commands (chapter 4, restriction 1; 16 ms on the AW-UE160),
  # counted from each reply.
  pacing:
    from: reply
    groups:
      pan_tilt:
        match: "^#"
        min_interval_ms: 40
        by_model: [{ models: [aw-ue160], min_interval_ms: 16 }]
  probe: "#O\r"

# The AW-UE160 writes format codes as two hex digits (OSA:87:01).
maps:
  format_two_digit: { '0': '00', '1': '01', '2': '02', '3': '03', '4': '04', '5': '05', '7': '07', '8': '08', A: '0A', B: '0B', D: '0D', '10': '10', '11': '11', '12': '12', '13': '13', '14': '14', '15': '15', '16': '16', '17': '17', '18': '18', '19': '19', '1A': '1A', '1B': '1B', '20': '20', '21': '21', '22': '22', '23': '23', '24': '24', '25': '25', '26': '26', '27': '27', '80': '80' }

settings:
  serial_port: { type: string, required: true, max_length: 256, label: Serial port, description: "The host's serial port wired to the camera's RS-422 port (through an RS-422 adapter): COM3 on Windows, /dev/ttyUSB0 on Linux, /dev/cu.usbserial-1420 on macOS." }
  baud_rate: { type: enum, values: ["9600", "38400", "115200"], default: "9600", label: Baud rate, description: "Bits per second: 9600 on every model; the AW-UE160 can be set to 38400 or 115200 in its menu (SERIAL CONNECTION, BAUD RATE)." }
  data_bits: { type: int, min: 8, max: 8, default: 8, label: Data bits, description: "Bits per character: 8 (chapter 4-1)." }
  parity: { type: enum, values: [none], default: none, label: Parity, description: "No parity (chapter 4-1)." }
  stop_bits: { type: int, min: 1, max: 1, default: 1, label: Stop bits, description: "One stop bit (chapter 4-1)." }
  flow_control: { type: enum, values: [none], default: none, label: Flow control, description: "No flow control (chapter 4-1)." }

ports:
  - { port: null, protocol: serial, role: control, setting: serial_port, note: "The camera's RS-422 port, half duplex" }

