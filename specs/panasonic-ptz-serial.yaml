      serial_protocol, get_serial_protocol, serial_connector, get_serial_connector, serial_camera_address,
      get_serial_camera_address]
    verification: none
    notes: >
      The HD model of the AW-UE20/AW-HE20 document.

commands:
  scene:
    summary: 'Select the scene file: 1-3 Scene1-3, 4 Full Auto (Scene4 on AW-HE120/HE130/UE150/HE145/UE100); AW-UE160 1-8 Scene1-8, 9 off'
    params:
      scene: { type: int, min: 1, max: 9, required: true, label: Scene file, description: '1-3 Scene1 to Scene3, 4 Full Auto (Scene4 on AW-HE120/HE130/UE150/HE145/UE100); 1-8 Scene1 to Scene8 and 9 off on AW-UE160.' }
    send: "\u0002XSF:{scene}\u0003"
    expect: { reply_contains: "\u0002XSF:", matches: '^\x02XSF:[1-9]\x03$' }
    returns: ack
  get_scene:
    summary: 'Query the scene file. The reply numbers from 0 (OSF:0 is Scene1, OSF:3 Full Auto; OSF:8 off on AW-UE160)'
    send: "\u0002QSF\u0003"
    expect: { reply_contains: "\u0002OSF:", matches: '^\x02OSF:([0-8])\x03$' }
    returns: value
  scene_copy:
    summary: 'Copy one scene file''s settings to another (1-3 Scene1-3, 4 Full Auto)'
    params:
      from_scene: { type: int, min: 1, max: 4, required: true, label: From scene, description: 'Scene file to copy from: 1-3 Scene1 to Scene3, 4 Full Auto.' }
      to_scene: { type: int, min: 1, max: 4, required: true, label: To scene, description: 'Scene file to copy to: 1-3 Scene1 to Scene3, 4 Full Auto.' }
    send: "\u0002OSJ:D6:{from_scene}:{to_scene}\u0003"
    expect: { reply_contains: "\u0002OSJ:D6:", matches: '^\x02OSJ:D6:[1-4]:[1-4]\x03$' }
    returns: ack
  picture_level:
    summary: Set the picture level (auto exposure target)
    params:
      level: { type: string, pattern: '^(?:[0-5][0-9A-F]|6[0-4])$', required: true, label: Picture level, description: 'Auto exposure target as two-digit hex 00-64; AW-HE50/HE60 read it as contrast -5 to +5 in steps of about 10, AW-HE120 as -10 to +10 in steps of 5, AW-HE130 as -50 to +50 (32 is 0), AW-HE40/HE65/HE70/UE70 as -10 to +10 (32 is 0).' }
    send: "\u0002OSD:48:{level}\u0003"
    expect: { reply_contains: "\u0002OSD:48:", matches: '^\x02OSD:48:[0-9A-F]{2}\x03$' }
    returns: ack
  get_picture_level:
    summary: 'Query the picture level as the camera sends it, hex 00-64 for -50 to +50'
    send: "\u0002QSD:48\u0003"
    expect: { reply_contains: "\u0002OSD:48:", matches: '^\x02OSD:48:([0-9A-F]{2})\x03$' }
    returns: value
  iris_mode:
    summary: Set the iris to auto or manual
    params:
      auto: { type: bool, required: true, label: Auto iris, description: 'On sets the iris to auto, off to manual.' }
    send: "\u0002ORS:{auto:bool01}\u0003"
    expect: { reply_contains: "\u0002ORS:", matches: '^\x02ORS:[01]\x03$' }
    returns: ack
  get_iris_mode:
    summary: Query whether auto iris is on
    send: "\u0002QRS\u0003"
    expect: { reply_contains: "\u0002ORS:", matches: '^\x02ORS:([01])\x03$' }
    returns: value
  auto_iris:
    summary: Set the iris to auto or manual (pan-tilt head command)
    params:
      auto: { type: bool, required: true, label: Auto iris, description: 'On sets the iris to auto, off to manual.' }
    send: "#D3{auto:bool01}\r"
    expect: { reply_contains: d3, matches: '^d3[01]$' }
    returns: ack
  get_auto_iris:
    summary: Query whether auto iris is on
    send: "#D3\r"
    expect: { reply_contains: d3, matches: '^d3([01])$' }
    returns: value
  auto_iris_speed:
    summary: 'Set the auto iris speed: 0 slow, 1 normal, 2 fast'
    params:
      speed: { type: int, min: 0, max: 2, required: true, label: Auto iris speed, description: '0 slow, 1 normal, 2 fast.' }
    send: "\u0002OSJ:01:{speed}\u0003"
    expect: { reply_contains: "\u0002OSJ:01:", matches: '^\x02OSJ:01:[0-2]\x03$' }
    returns: ack
  get_auto_iris_speed:
    summary: Query the auto iris speed
    send: "\u0002QSJ:01\u0003"
    expect: { reply_contains: "\u0002OSJ:01:", matches: '^\x02OSJ:01:([0-2])\x03$' }
    returns: value
  auto_iris_window:
    summary: 'Set the auto iris metering window: 0 normal1, 1 normal2, 2 center, 4 full'
    params:
      window: { type: enum, values: ['0', '1', '2', '4'], required: true, label: Metering window, description: '0 normal1, 1 normal2, 2 center, 4 full.' }
    send: "\u0002OSJ:02:{window}\u0003"
    expect: { reply_contains: "\u0002OSJ:02:", matches: '^\x02OSJ:02:(?:0|1|2|4)\x03$' }
    returns: ack
  get_auto_iris_window:
    summary: Query the auto iris window
    send: "\u0002QSJ:02\u0003"
    expect: { reply_contains: "\u0002OSJ:02:", matches: '^\x02OSJ:02:((?:0|1|2|4))\x03$' }
    returns: value
  iris_limit:
    summary: Set the iris limit on or off
    params:
      enabled: { type: bool, required: true, label: Iris limit, description: 'On turns the iris limit on, off turns it off.' }
    send: "\u0002OSJ:90:{enabled:bool01}\u0003"
    expect: { reply_contains: "\u0002OSJ:90:", matches: '^\x02OSJ:90:[01]\x03$' }
    returns: ack
  get_iris_limit:
    summary: Query whether iris limit is on
    send: "\u0002QSJ:90\u0003"
    expect: { reply_contains: "\u0002OSJ:90:", matches: '^\x02OSJ:90:([01])\x03$' }
    returns: value
  shutter_mode:
    summary: 'Set the shutter mode: 0 off, 1 step, 2 synchro, 3 elc'
    params:
      mode: { type: int, min: 0, max: 3, required: true, label: Shutter mode, description: '0 off, 1 step, 2 synchro, 3 ELC.' }
    send: "\u0002OSJ:03:{mode}\u0003"
    expect: { reply_contains: "\u0002OSJ:03:", matches: '^\x02OSJ:03:[0-3]\x03$' }
    returns: ack
  get_shutter_mode:
    summary: Query the shutter mode
    send: "\u0002QSJ:03\u0003"
    expect: { reply_contains: "\u0002OSJ:03:", matches: '^\x02OSJ:03:([0-3])\x03$' }
    returns: value
  shutter_step_up:
    summary: Move the step shutter up by a number of selectable steps (hex 01-64 for 1-100)
    params:
      steps: { type: string, pattern: '^(?:0[1-9A-F]|[1-5][0-9A-F]|6[0-4])$', required: true, label: Steps, description: 'Number of selectable steps as two-digit hex, 01-64 for 1 to 100.' }
    send: "\u0002OSJ:04:{steps}\u0003"
    expect: { reply_contains: "\u0002OSJ:04:", matches: '^\x02OSJ:04:[0-9A-F]{2}\x03$' }
    returns: ack
  shutter_step_down:
    summary: Move the step shutter down by a number of selectable steps (hex 01-64 for 1-100)
    params:
      steps: { type: string, pattern: '^(?:0[1-9A-F]|[1-5][0-9A-F]|6[0-4])$', required: true, label: Steps, description: 'Number of selectable steps as two-digit hex, 01-64 for 1 to 100.' }
    send: "\u0002OSJ:05:{steps}\u0003"
    expect: { reply_contains: "\u0002OSJ:05:", matches: '^\x02OSJ:05:[0-9A-F]{2}\x03$' }
    returns: ack
  shutter_step:
    summary: Set the step shutter speed by its denominator in 4-digit hex (003C is 1/60)
    params:
      denominator: { type: string, pattern: '^(?:000[1-9A-F]|00[1-9A-F][0-9A-F]|0[1-9A-F][0-9A-F]{2}|[12][0-9A-F]{3}|3[0-9A-D][0-9A-F]{2}|3E[0-7][0-9A-F]|3E80)$', required: true, label: Shutter speed, description: 'Denominator of the shutter speed as four-digit hex, such as 003C for 1/60: up to 2710 (1/10000), or 3E80 (1/16000) on AW-UE20/HE20/UE4; only the speeds the format allows.' }
    send: "\u0002OSJ:06:{denominator}\u0003"
    expect: { reply_contains: "\u0002OSJ:06:", matches: '^\x02OSJ:06:[0-9A-F]{4}\x03$' }
    returns: ack
  get_shutter_step:
    summary: 'Query the step shutter denominator as the camera sends it, 4-digit hex (003C is 1/60)'
    send: "\u0002QSJ:06\u0003"
    expect: { reply_contains: "\u0002OSJ:06:", matches: '^\x02OSJ:06:([0-9A-F]{4})\x03$' }
    returns: value
  synchro_scan_up:
    summary: Move synchro scan up by a number of selectable steps (hex 01-64 for 1-100)
    params:
      steps: { type: string, pattern: '^(?:0[1-9A-F]|[1-5][0-9A-F]|6[0-4])$', required: true, label: Steps, description: 'Number of selectable steps as two-digit hex, 01-64 for 1 to 100.' }
    send: "\u0002OSJ:07:{steps}\u0003"
    expect: { reply_contains: "\u0002OSJ:07:", matches: '^\x02OSJ:07:[0-9A-F]{2}\x03$' }
    returns: ack
  synchro_scan_down:
    summary: Move synchro scan down by a number of selectable steps (hex 01-64 for 1-100)
    params:
      steps: { type: string, pattern: '^(?:0[1-9A-F]|[1-5][0-9A-F]|6[0-4])$', required: true, label: Steps, description: 'Number of selectable steps as two-digit hex, 01-64 for 1 to 100.' }
    send: "\u0002OSJ:08:{steps}\u0003"
    expect: { reply_contains: "\u0002OSJ:08:", matches: '^\x02OSJ:08:[0-9A-F]{2}\x03$' }
    returns: ack
  synchro_scan:
    summary: 'Set synchro scan in tenths of a hertz, 5-digit hex (00258 is 60.0 Hz)'
    params:
      tenths_hz: { type: string, pattern: '^(?:0[0-9A-F]{4}|1[0-7][0-9A-F]{3}|18[0-5][0-9A-F]{2}|186[0-9][0-9A-F]|186A0)$', required: true, label: Synchro scan, description: 'Frequency in tenths of a hertz as five-digit hex, such as 00258 for 60.0 Hz.' }
    send: "\u0002OSJ:09:{tenths_hz}\u0003"
    expect: { reply_contains: "\u0002OSJ:09:", matches: '^\x02OSJ:09:[0-9A-F]{5}\x03$' }
    returns: ack
  get_synchro_scan:
    summary: 'Query the synchro scan frequency times ten, as the camera sends it in 5-digit hex'
    send: "\u0002QSJ:09\u0003"
    expect: { reply_contains: "\u0002OSJ:09:", matches: '^\x02OSJ:09:([0-9A-F]{5})\x03$' }
    returns: value
  elc_limit:
    summary: 'Set the ELC (auto shutter) limit: 2 1/100, 3 1/120, 4 1/250, 5 1/500, 6 1/1000, 7 1/2000'
    params:
      limit: { type: int, min: 2, max: 7, required: true, label: ELC limit, description: 'Slowest auto shutter: 2 1/100, 3 1/120, 4 1/250, 5 1/500, 6 1/1000, 7 1/2000.' }
    send: "\u0002OSD:BF:{limit}\u0003"
    expect: { reply_contains: "\u0002OSD:BF:", matches: '^\x02OSD:BF:[2-7]\x03$' }
    returns: ack
  get_elc_limit:
    summary: Query the ELC limit
    send: "\u0002QSD:BF\u0003"
    expect: { reply_contains: "\u0002OSD:BF:", matches: '^\x02OSD:BF:([2-7])\x03$' }
    returns: value
  gain:
    summary: 'Set the gain: hex 08-32 for 0-42 dB in 1 dB steps (05 -3 dB on AW-UE150/HE145; above 36 dB needs super gain), 80 AGC'
    params:
      gain: { type: string, pattern: '^(?:(?:0[2-9A-F]|[12][0-9A-F]|3[0-8])|80)$', required: true, label: Gain, description: 'Two-digit hex for the gain, 08 being 0 dB; AW-HE40/HE65/HE70/UE70 08-38 in 3 dB steps (0-48 dB), AW-HE50/HE60 08-1A in 3 dB steps, AW-HE120 08-1A and AW-HE130 08-2C in 1 dB steps; otherwise in 1 dB steps: 08-32 (0 to 42 dB; above 36 dB needs super gain), 05-32 (-3 to 42 dB) on AW-UE150/HE145, 02-14 (-6 to +12 dB) on AW-UE160; or 80 for AGC.' }
    send: "\u0002OGU:{gain}\u0003"
    expect: { reply_contains: "\u0002OGU:", matches: '^\x02OGU:[0-9A-F]{2}\x03$' }
    returns: ack
  get_gain:
    summary: 'Query the gain as the camera sends it: hex 08-32 for 0-42 dB, 80 AGC on'
    send: "\u0002QGU\u0003"
    expect: { reply_contains: "\u0002OGU:", matches: '^\x02OGU:([0-9A-F]{2})\x03$' }
    returns: value
  super_gain:
    summary: Set super gain on or off
    params:
      enabled: { type: bool, required: true, label: Super gain, description: 'On turns super gain, needed above 36 dB on, off turns it off.' }
    send: "\u0002OSI:28:{enabled:bool01}\u0003"
    expect: { reply_contains: "\u0002OSI:28:", matches: '^\x02OSI:28:[01]\x03$' }
    returns: ack
  get_super_gain:
    summary: Query whether super gain is on
    send: "\u0002QSI:28\u0003"
    expect: { reply_contains: "\u0002OSI:28:", matches: '^\x02OSI:28:([01])\x03$' }
    returns: value
  agc_max_gain:
    summary: 'Set the AGC maximum gain: 01 6dB, 02 12dB, 03 18dB, 04 24dB, 05 30dB, 06 36dB, 07 42dB (AW-UE20/HE20/UE4 take 04-07)'
    params:
      max_gain: { type: int, min: 1, max: 8, required: true, label: AGC maximum gain, description: '1 6 dB, 2 12 dB, 3 18 dB, 4 24 dB, 5 30 dB, 6 36 dB, 7 42 dB, 8 48 dB; AW-UE20/HE20/UE4 take 4-7, AW-HE50/HE60/HE120/HE130 1-3, AW-HE40/HE65/HE70/UE70 1-8.' }
    send: "\u0002OSD:69:{max_gain:02d}\u0003"
    expect: { reply_contains: "\u0002OSD:69:0", matches: '^\x02OSD:69:0[1-8]\x03$' }
    returns: ack
  get_agc_max_gain:
    summary: Query the AGC maximum gain
    send: "\u0002QSD:69\u0003"
    expect: { reply_contains: "\u0002OSD:69:", matches: '^\x02OSD:69:(0[1-8])\x03$' }
    returns: value
  frame_mix:
    summary: 'Set frame mix: 00 off, 06 +6dB, 0C +12dB, 12 +18dB, 18 +24dB, 80 auto'
    params:
      frame_mix: { type: enum, values: ['00', '06', '0C', '12', '18', '80'], required: true, label: Frame mix, description: '00 off, 06 +6 dB, 0C +12 dB, 12 +18 dB, 18 +24 dB, 80 auto.' }
    send: "\u0002OSA:65:{frame_mix}\u0003"
    expect: { reply_contains: "\u0002OSA:65:", matches: '^\x02OSA:65:(?:00|06|0C|12|18|80)\x03$' }
    returns: ack
  get_frame_mix:
    summary: Query the frame mix
    send: "\u0002QSA:65\u0003"
    expect: { reply_contains: "\u0002OSA:65:", matches: '^\x02OSA:65:((?:00|06|0C|12|18|80))\x03$' }
    returns: value
  auto_frame_mix_max_gain:
    summary: 'Set the auto frame mix maximum gain: 00 off, 01 6dB, 02 12dB, 03 18dB'
    params:
      max_gain: { type: int, min: 0, max: 3, required: true, label: Maximum gain, description: '0 off, 1 6 dB, 2 12 dB, 3 18 dB.' }
    send: "\u0002OSE:74:{max_gain:02d}\u0003"
    expect: { reply_contains: "\u0002OSE:74:", matches: '^\x02OSE:74:(?:00|01|02|03)\x03$' }
    returns: ack
  get_auto_frame_mix_max_gain:
    summary: Query the auto frame mix maximum gain
    send: "\u0002QSE:74\u0003"
    expect: { reply_contains: "\u0002OSE:74:", matches: '^\x02OSE:74:((?:00|01|02|03))\x03$' }
    returns: value
  backlight_compensation:
    summary: Set backlight compensation on or off
    params:
      enabled: { type: bool, required: true, label: Backlight compensation, description: 'On turns backlight compensation on, off turns it off.' }
    send: "\u0002OSE:73:{enabled:bool01}\u0003"
    expect: { reply_contains: "\u0002OSE:73:", matches: '^\x02OSE:73:[01]\x03$' }
    returns: ack
  get_backlight_compensation:
    summary: Query whether backlight compensation is on
    send: "\u0002QSE:73\u0003"
    expect: { reply_contains: "\u0002OSE:73:", matches: '^\x02OSE:73:([01])\x03$' }
    returns: value
  backlight_compensation_level:
    summary: 'Set the backlight compensation level: 0 low, 1 mid, 2 high'
    params:
      level: { type: int, min: 0, max: 2, required: true, label: Level, description: '0 low, 1 mid, 2 high.' }
    send: "\u0002OSM:40:{level}\u0003"
    expect: { reply_contains: "\u0002OSM:40:", matches: '^\x02OSM:40:[0-2]\x03$' }
    returns: ack
  get_backlight_compensation_level:
    summary: Query the backlight compensation level
    send: "\u0002QSM:40\u0003"
    expect: { reply_contains: "\u0002OSM:40:", matches: '^\x02OSM:40:([0-2])\x03$' }
    returns: value
  spotlight_compensation:
    summary: Set spotlight compensation on or off
    params:
      enabled: { type: bool, required: true, label: Spotlight compensation, description: 'On turns spotlight compensation on, off turns it off.' }
    send: "\u0002OSJ:D0:{enabled:bool01}\u0003"
    expect: { reply_contains: "\u0002OSJ:D0:", matches: '^\x02OSJ:D0:[01]\x03$' }
    returns: ack
  get_spotlight_compensation:
    summary: Query whether spotlight compensation is on
    send: "\u0002QSJ:D0\u0003"
    expect: { reply_contains: "\u0002OSJ:D0:", matches: '^\x02OSJ:D0:([01])\x03$' }
    returns: value
  flicker_suppression:
    summary: Set flicker suppression on or off
    params:
      enabled: { type: bool, required: true, label: Flicker suppression, description: 'On turns flicker suppression on, off turns it off.' }
    send: "\u0002OSJ:D1:{enabled:bool01}\u0003"
    expect: { reply_contains: "\u0002OSJ:D1:", matches: '^\x02OSJ:D1:[01]\x03$' }
    returns: ack
  get_flicker_suppression:
    summary: Query whether flicker suppression is on
    send: "\u0002QSJ:D1\u0003"
    expect: { reply_contains: "\u0002OSJ:D1:", matches: '^\x02OSJ:D1:([01])\x03$' }
    returns: value
  nd_filter:
    summary: 'Set the ND filter: 0 through, 1 1/4, 2 1/16, 3 1/64, 8 auto'
    params:
      filter: { type: enum, values: ['0', '1', '2', '3', '4', '8'], required: true, label: ND filter, description: '0 through, 1 1/4, 2 1/16, 3 1/64, 4 1/8 (AW-HE130, which has 0, 3 and 4), 8 auto.' }
    send: "\u0002OFT:{filter}\u0003"
    expect: { reply_contains: "\u0002OFT:", matches: '^\x02OFT:(?:0|1|2|3|4|8)\x03$' }
    returns: ack
  get_nd_filter:
    summary: Query the ND filter setting
    send: "\u0002QFT\u0003"
    expect: { reply_contains: "\u0002OFT:", matches: '^\x02OFT:((?:0|1|2|3|4|8))\x03$' }
    returns: value
  get_nd_filter_status:
    summary: 'Query the ND filter in use: 0 through, 1 1/4, 2 1/16, 3 1/64'
    send: "\u0002QSJ:D2\u0003"
    expect: { reply_contains: "\u0002OSJ:D2:", matches: '^\x02OSJ:D2:([0-3])\x03$' }
    returns: value
  day_night:
    summary: Set night mode on or off
    params:
      night: { type: bool, required: true, label: Night mode, description: 'On switches to night mode, off to day mode.' }
    send: "#D6{night:bool01}\r"
    expect: { reply_contains: d6, matches: '^d6[01]$' }
    returns: ack
  get_day_night:
    summary: Query whether night mode (Day/Night) is on
    send: "#D6\r"
    expect: { reply_contains: d6, matches: '^d6([01])$' }
    returns: value
  white_balance_mode:
    summary: 'Set the white balance mode: 0 ATW, 1 AWB A, 2 AWB B, 4 3200K, 5 5600K, 9 VAR'
    params:
      mode: { type: enum, values: ['0', '1', '2', '3', '4', '5', '9'], required: true, label: White balance, description: '0 ATW, 1 AWB A, 2 AWB B, 3 ATW (HE models), 4 3200K, 5 5600K, 9 VAR; AW-HE50/HE60 have 0-3, AW-HE120 0-5.' }
    send: "\u0002OAW:{mode}\u0003"
    expect: { reply_contains: "\u0002OAW:", matches: '^\x02OAW:[0-9]\x03$' }
    returns: ack
  get_white_balance_mode:
    summary: 'Query the white balance mode. The reply numbers differently from the control: 0 ATW, 2 AWB A, 3 AWB B, 4 3200K, 5 5600K, 9 VAR'
    send: "\u0002QAW\u0003"
    expect: { reply_contains: "\u0002OAW:", matches: '^\x02OAW:([0-9])\x03$' }
    returns: value
  awb:
    summary: 'Run auto white balance. The result is notified as OWS, or ER3:OWS when it fails'
    send: "\u0002OWS\u0003"
    expect: { reply_contains: "\u0002OWS", matches: '^\x02OWS\x03$' }
    returns: ack
  abb:
    summary: 'Run auto black balance. The result is notified as OAS, or ER3:OAS when it fails'
    send: "\u0002OAS\u0003"
    expect: { reply_contains: "\u0002OAS", matches: '^\x02OAS\x03$' }
    returns: ack
  color_temperature_up:
    summary: Raise the VAR colour temperature by 1-10 selectable steps (hex 1-A)
    params:
      steps: { type: string, pattern: '^[1-9A]$', required: true, label: Steps, description: 'Number of selectable steps, hex 1-A for 1 to 10.' }
    send: "\u0002OSI:1E:{steps}\u0003"
    expect: { reply_contains: "\u0002OSI:1E:", matches: '^\x02OSI:1E:[0-9A-F]\x03$' }
    returns: ack
  color_temperature_down:
    summary: Lower the VAR colour temperature by 1-10 selectable steps (hex 1-A)
    params:
      steps: { type: string, pattern: '^[1-9A]$', required: true, label: Steps, description: 'Number of selectable steps, hex 1-A for 1 to 10.' }
    send: "\u0002OSI:1F:{steps}\u0003"
    expect: { reply_contains: "\u0002OSI:1F:", matches: '^\x02OSI:1F:[0-9A-F]\x03$' }
    returns: ack
  color_temperature:
    summary: 'Set the VAR colour temperature in kelvin, 5-digit hex 007D0-03A98 (2000-15000 K)'
    params:
      kelvin: { type: string, pattern: '^(?:007[D-F][0-9A-F]|00[89A-F][0-9A-F]{2}|0[12][0-9A-F]{3}|03[0-9][0-9A-F]{2}|03A[0-8][0-9A-F]|03A9[0-8])$', required: true, label: Colour temperature, description: 'VAR colour temperature in kelvin as five-digit hex, 007D0 to 03A98 for 2000 to 15000 K.' }
    send: "\u0002OSI:20:{kelvin}\u0003"
    expect: { reply_contains: "\u0002OSI:20:", matches: '^\x02OSI:20:[0-9A-F]{5}(?::[0-2])?\x03$' }
    returns: ack
  get_color_temperature:
    summary: 'Query the VAR colour temperature: OSI:20:<5-digit hex kelvin>:<0 valid, 1 under, 2 over>'
    send: "\u0002QSI:20\u0003"
    expect: { reply_contains: "\u0002OSI:20:", matches: '^\x02OSI:20:([0-9A-F]{5}:[0-2])\x03$' }
