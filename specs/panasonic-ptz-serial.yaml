  updates:
    - match: '^\x02XSF:([1-9])\x03$'
      state:
        scene: '{1}'
    - match: '^\x02OSF:([0-8])\x03$'
      state:
        scene: '{1:+1}'
    - match: '^\x02OSD:48:([0-9A-F]{2})\x03$'
      state:
        exposure.picture_level: '{1}'
    - match: '^\x02ORS:([01])\x03$'
      state:
        iris.auto: { value: '{1}', map: { '0': false, '1': true } }
    - match: '^d3([01])$'
      state:
        iris.auto: { value: '{1}', map: { '0': false, '1': true } }
    - models: [aw-ue80, aw-ue50, aw-ue40, aw-ue30, aw-ue150, aw-ue155, aw-he145, aw-ue100, aw-ue20, aw-he20]
      match: '^\x02OSJ:01:([0-2])\x03$'
      state:
        iris.auto_speed: { value: '{1}', map: { '0': slow, '1': normal, '2': fast } }
    - models: [aw-ue80, aw-ue50, aw-ue40, aw-ue30, aw-ue150, aw-ue155, aw-he145, aw-ue100, aw-ue20, aw-he20]
      match: '^\x02OSJ:02:((?:0|1|2|4))\x03$'
      state:
        iris.auto_window: { value: '{1}', map: { '0': normal1, '1': normal2, '2': center, '4': full } }
    - match: '^\x02OSJ:90:([01])\x03$'
      state:
        iris.limit: { value: '{1}', map: { '0': false, '1': true } }
    - match: '^\x02OSJ:03:([0-3])\x03$'
      state:
        shutter.mode: { value: '{1}', map: { '0': 'off', '1': step, '2': synchro, '3': elc } }
    - match: '^\x02OSJ:06:([0-9A-F]{4})\x03$'
      state:
        shutter.step: '{1}'
    - match: '^\x02OSJ:09:([0-9A-F]{5})\x03$'
      state:
        shutter.synchro: '{1}'
    - match: '^\x02OSD:BF:([2-7])\x03$'
      state:
        shutter.elc_limit: { value: '{1}', map: { '2': '1/100', '3': '1/120', '4': '1/250', '5': '1/500', '6': '1/1000', '7': '1/2000' } }
    - match: '^\x02OGU:([0-9A-F]{2})\x03$'
      state:
        gain: '{1}'
    - match: '^\x02OSI:28:([01])\x03$'
      state:
        gain_super: { value: '{1}', map: { '0': false, '1': true } }
    - match: '^\x02OSD:69:(0[1-8])\x03$'
      state:
        gain_agc_max: { value: '{1}', map: { '01': '6dB', '02': '12dB', '03': '18dB', '04': '24dB', '05': '30dB', '06': '36dB', '07': '42dB', '08': '48dB' } }
    - match: '^\x02OSA:65:((?:00|06|0C|12|18|80))\x03$'
      state:
        frame_mix: { value: '{1}', map: { '00': 'off', '06': '+6dB', '0C': '+12dB', '12': '+18dB', '18': '+24dB', '80': auto } }
    - match: '^\x02OSE:74:((?:00|01|02|03))\x03$'
      state:
        frame_mix_auto_max_gain: { value: '{1}', map: { '00': 'off', '01': '6dB', '02': '12dB', '03': '18dB' } }
    - match: '^\x02OSE:73:([01])\x03$'
      state:
        backlight_compensation: { value: '{1}', map: { '0': false, '1': true } }
    - match: '^\x02OSM:40:([0-2])\x03$'
