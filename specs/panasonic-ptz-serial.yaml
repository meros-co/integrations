      state:
        shutter.synchro_step: '{1}'
    - match: '^\x02ORI:([0-9A-F]{3})\x03$'
      state:
        white_balance.red_gain_offset: '{1}'
    - match: '^\x02OBI:([0-9A-F]{3})\x03$'
      state:
        white_balance.blue_gain_offset: '{1}'
    - match: '^\x02OTP:([0-9A-F]{3})\x03$'
      state:
        master_pedestal_offset: '{1}'
    - match: '^\x02ODE:([01])\x03$'
      state:
        zoom.digital_extender_on: { value: '{1}', map: { '0': false, '1': true } }

quirks:
  - models: [all]
    severity: critical
    text: >
      The RS-422 line is half duplex (chapter 4-1): the core sends one message at a time and the next
      only after the reply to the one before. Panasonic asks for a gap of 40 ms between pan-tilt head
      commands (16 ms on the AW-UE160), which the core keeps (transport.pacing), counted from each
      reply; a caller streaming pan_tilt_speed updates faster than that builds a queue behind them, so
      it should send only the latest speed.

  - models: [all]
    severity: warning
    text: >
      Pan-tilt head commands are sent as # + command + CR, camera commands as STX (02H) + command + ETX
      (03H), and the replies come back framed the same way (chapter 3 and 4-1). A camera command is
      answered with ACK (06H) and then its reply; the ACK is never taken as a reply (reply_match), so a
      command succeeds on its reply text, which it names (reply_contains) so that an update notification
      arriving first is not taken for it.

  - models: [all]
    severity: warning
    text: >
      Errors are the reply text: ER1:<command> (camera commands, between STX and ETX) or eR1:<command>
      (pan-tilt head commands) for an unsupported command, ER2 when busy or in standby, ER3 when a value
      is out of range or not allowed in the current state (chapter 7). error_match ends the command at
      once with the error text. An AWB or ABB failure notification (ER3:OWS, ER2:OAS and so on) arriving
      while another command waits is taken as that command's error.

  - models: [all]
    severity: warning
    text: >
      Update notifications come on the serial line as the same framed messages, pan-tilt ones ended by
      CR and camera ones between STX and ETX (chapter 5-2); there is no registration, so the network
      spec's notification port does not apply. Only the IP sequences are documented for the periodic
      notifications (version every 60 seconds, errors every 30 seconds, lens positions every 300 ms,
      chapter 6); the state rules read them whenever they arrive.

  - models: [all]
    severity: info
    text: >
      The line runs at 9600 bps, 8 data bits, no parity, 1 stop bit, no flow control (chapter 4-1). The
      AW-UE160 can also be set to 38400 or 115200 bps (menu SERIAL CONNECTION, BAUD RATE;
      serial_baud_rate), not while tracking data goes out on the serial port; set baud_rate to match.
      The AW-UE20/HE20 take these commands with Serial Com. Protocol set to Panasonic (serial_protocol
      0); Connector Select and Baud Rate apply to the Standard protocol only.

  - models: [all]
    severity: info
    text: >
      The Web settings CGIs (streaming, RTMP, SRT, NDI, ST 2110, network, date and time, restart), the
      camera information batch (camdata.html), still pictures and preset thumbnails are network-only:
      use the panasonic-ptz spec for them. The AW-HE40/HE50/HE60/HE65/HE70/HE120/HE130, AW-UE70 and
      AW-UE4 are not in this spec: their interface specifications describe network control only.

  - models: [all]
    severity: critical
    text: >
      Send a setting command only when the setting must change, never at regular intervals (chapter 4,
      restriction 4). The settings are stored in EEPROM with a limited number of writes, and the HE
      document warns that frequent writes will eventually stop the camera working. Queries are not
      affected.

  - models: [all]
    severity: critical
    text: >
      Presets are 0-based on the wire (preset 1 is #R00, the reply s00 and the completion notification
      q00). recall_preset, save_preset, delete_preset, preset_name and power_on_preset take 1-100 and
      apply the -1 offset; the state rules add 1 back.

  - models: [all]
    severity: warning
    text: >
      Speeds (pan_speed, tilt_speed, pan_tilt_speed, zoom_speed, focus_speed) are two digits where 50 is
      stop, 01 is full speed one way and 99 full speed the other. Motion continues until a 50 is sent;
      there is no separate stop command.

  - models: [all]
    severity: warning
    text: >
      Some settings are only accepted in certain states (chapter 8): many exposure and picture settings
      are refused with ER3 in the Full Auto scene, manual focus and iris commands need manual mode,
      linear matrix and colour correction need matrix type User, and so on. Changing one setting can
      switch another off (backlight and spotlight compensation exclude each other; selecting i.Zoom or
      D.Zoom turns the digital extender off). Changing scene sends an update notification for every
      setting in the scene.

  - models: [all]
    severity: warning
    text: >
      Many values are hexadecimal on the wire and the format has no hex directive, so those parameters
      take the hex text itself (uppercase, at the documented width), held to the documented range by a
      pattern: gain 08-32 or 80, positions 555-FFF, pan/tilt 0000-FFFF, R/B gain 738-8C8 and so on.
      State paths keep the hex text as the camera sends it.

  - models: [all]
    severity: warning
    text: >
      white_balance_mode and get_white_balance_mode number AWB A and AWB B differently: the control
      takes 1 and 2, the query answers 2 and 3 (p.30; the HE document notes the same). The state rule
      therefore assigns only ATW, 3200K, 5600K and VAR. get_scene answers 0-3 for scene 1-4 (OSF), while
      scene takes 1-4 (XSF).

  - models: [all]
    severity: info
    text: >
      awb and abb answer at once; the result follows as an update notification (OWS or OAS on success,
      ER3:OWS or ER3:OAS on failure). AWB is refused with ER3 in night mode. recall_preset answers
      s<preset-1> at once and q<preset-1> when the move completes.

  - models: [aw-ue80, aw-ue50, aw-ue40, aw-ue30, aw-ue150, aw-ue155, aw-he145, aw-ue100]
    severity: info
    text: >
      The AW-UE document's usage examples for the menu keys omit the data (cmd=DUP); its command column
      and the HE document give DUP:1, which is what menu_up and the other menu keys send.

  - models: [aw-ue80, aw-ue50, aw-ue40, aw-ue30, aw-ue150, aw-ue155, aw-he145]
    severity: info
    text: >
      Colour correction Yl_Yl_G (codes 1C/1D) is listed as OSJ:1C/OSJ:1D in the command column of p.35
      but as OSD:1C/OSD:1D in the menu table (p.22) and the usage examples, and every other colour
      correction code is OSD. The spec sends OSD:1C/OSD:1D.

  - models: [all]
    severity: info
    text: >
      Frequency changes restart the camera. Formats depend on the frequency and the model: 2160/59.94p
      and 2160/50p are AW-UE80 only, and the PsF and 1080/23.98p (over 59.94i) formats AW-UE80 and
      AW-UE50 only.

  - models: [aw-ue150, aw-ue155, aw-he145, aw-ue100]
    severity: info
    text: >
      The AW-UE150/HE145 and AW-UE100 documents give several codes the AW-UE80 family uses with other
      meanings or ranges; each is one command whose description names the models: knee_mode adds 1
      manual, matrix_type numbers 1 EBU and 2 NTSC, ois numbers the AW-UE100 hybrid modes 2 and 3, gain
      goes down to 05 (-3 dB) on AW-UE150/HE145, and pan_tilt_speed_mode is named normal, fast and
      quick. State follows each model's own meanings.

  - models: [aw-ue150, aw-ue155, aw-he145, aw-ue100]
    severity: info
    text: >
      The AW-UE150/HE145 and AW-UE100 documents usage example for awb_color_temperature is "OSJ:4A:0";
      its command column takes the colour temperature (5-digit hex), which is what the command sends.

  - models: [aw-ue150, aw-ue155, aw-he145, aw-ue100, aw-ue160]
    severity: info
    text: >
      The UHD crop commands apply only in 2160 formats (crop 720 only at 2160/59.94p or 50p), and the
      crop positions only while UHD crop is on; elsewhere the camera answers ER3. Crop positions are
      pixels in hex and must be even.

  - models: [aw-ue150, aw-ue155, aw-he145, aw-ue100, aw-ue160]
    severity: info
    text: >
      The AW-UE150/HE145 document's usage example for flip_detect_angle is "#SPF5A"; the command column
      and the AW-UE160 example give #FDA, which is what the command sends.

  - models: [aw-ue160]
    severity: info
    text: >
      The AW-UE160 shares many codes with the earlier models but gives some other meanings or wire
      forms, each a command of its own: iris_window_select (OSJ:02 windows 1-5), iris_speed (OSJ:01
      speeds 1-3), master_white_clip_level (OSA:2A 50-6D for 80-109%), camera_title_hex (OSJ:5C as 40
      hex digits of ASCII). Where only the range or naming differs, the shared command takes the union
      and describes each model: scene 1-8 and 9 off, gain 02-14, colour correction 01-FE, colour bar
      tone on/off, DNR on/off, matrix type cinema1/cinema2/HD. State follows each model's meanings
      (per-model rules).

  - models: [aw-ue160]
    severity: info
    text: >
      Texts the AW-UE160 carries as hex-coded ASCII (camera title, bar IDs, return ID, scene and user
      file names) are taken and kept as the hex digits themselves, padded with 00 to the fixed length;
      the format has no hex encoding directive. The camera accepts letters, digits, space and
      !#%&'()*+,-./:;<=>?[]_.

  - models: [aw-ue160]
    severity: critical
    text: >
      scene_file_store and user_file_store overwrite a stored file, and user_file_load and scene (XSF)
      replace many paint settings at once; the camera then sends an update notification for every
      setting the file holds. The send restriction applies: change settings only when needed (EEPROM
      writes are limited).

  - models: [aw-ue160]
    severity: warning
    text: >
      The AW-UE160 asks for at least 16 ms between pan-tilt head commands (chapter 4; the core keeps
      it), and refuses many paint settings with ER3 while V-Log is on with V-Log paint off, while HDR is
      on, or while their switch (knee, gamma, black gamma, detail, matrix and so on) is off (chapter 8).

  - models: [aw-ue160]
    severity: info
    text: >
      The AW-UE160 document gives the scene and user file name commands as OSL:91:[file]:[name] with a
      30-digit name, but its usage examples carry 32 hex digits and no file number; the commands follow
      the command column. Its example for menu_key_left sends DLT:1 where the command column gives CLT.
      Its OSA:87 example sends two digits (OSA:87:01): format sends the AW-UE160 its code as two digits.

  - models: [aw-ue20, aw-he20]
    severity: info
    text: >
      On the AW-UE20/HE20 and AW-UE4 the detail command ODT takes a level 0-3 (detail_level), DRS is
      off/on, the chroma level is OCG 03-0D (chroma_step), white balance has no VAR and ABB is not
      supported (OAS answers ER3). The scene numbers differ: AW-UE20/HE20 1 Scene1, 2 Scene2, 3 Full
      Auto; AW-UE4 1 Full Auto, 2 Shutter Priority, 3 Manual. The AW-UE4 answers #APC, #AXF and #AXI
      with fixed values and sets the iris to auto (ORS:1) always.
