    summary: 'Query which presets are stored, 40 at a time: block 0 presets 1-40, 1 41-80, 2 81-100. The reply is pE<block><10-digit hex bit mask>, bit0 the block''s first preset'
    params:
      block: { type: int, min: 0, max: 2, required: true, label: Block, description: '0 presets 1-40, 1 presets 41-80, 2 presets 81-100.' }
    send: "#PE{block:02d}\r"
    expect: { reply_contains: pE, matches: '^pE[0-9]{2}([0-9A-F]{10})$' }
    returns: value
  get_last_preset:
    summary: 'Query the preset last recalled: s<preset-1>'
    send: "#S\r"
    expect: { reply_contains: s, matches: '^s([0-9]{2})$' }
    returns: value
  preset_name:
    summary: 'Name a preset, 1-100; up to 15 characters'
    params:
      preset: { type: int, min: 1, max: 100, required: true, label: Preset, description: 'Preset number 1-100, as on the camera.' }
      name: { type: string, max_length: 15, pattern: '^[ -~]{1,15}$', required: true, label: Name, description: 'Preset name, 1 to 15 printable ASCII characters.' }
    send: "\u0002OSJ:35:{preset:-1:02d}:{name}\u0003"
    expect: { reply_contains: "\u0002OSJ:35:", matches: '^\x02OSJ:35:[0-9]{2}:.*\x03$' }
    returns: ack
  get_preset_name:
    summary: 'Query a preset''s name, 1-100'
    params:
      preset: { type: int, min: 1, max: 100, required: true, label: Preset, description: 'Preset number 1-100, as on the camera.' }
    send: "\u0002QSJ:35:{preset:-1:02d}\u0003"
    expect: { reply_contains: "\u0002OSJ:35:", matches: '^\x02OSJ:35:[0-9]{2}:(.*)\x03$' }
    returns: value
  delete_preset_name:
    summary: 'Delete a preset''s name, 1-100'
    params:
      preset: { type: int, min: 1, max: 100, required: true, label: Preset, description: 'Preset number 1-100, as on the camera.' }
    send: "\u0002OSJ:36:{preset:-1:02d}\u0003"
    expect: { reply_contains: "\u0002OSJ:36:", matches: '^\x02OSJ:36:[0-9]{2}\x03$' }
    returns: ack
  delete_all_preset_names:
    summary: Delete every preset name
    send: "\u0002OSJ:37\u0003"
    expect: { reply_contains: "\u0002OSJ:37", matches: '^\x02OSJ:37\x03$' }
    returns: ack
  update_preset_thumbnail:
    summary: 'Update a preset''s thumbnail, 1-100'
    params:
      preset: { type: int, min: 1, max: 100, required: true, label: Preset, description: 'Preset number 1-100, as on the camera.' }
    send: "\u0002OSJ:39:{preset:-1:02d}\u0003"
    expect: { reply_contains: "\u0002OSJ:39:", matches: '^\x02OSJ:39:[0-9]{2}\x03$' }
    returns: ack
  delete_preset_thumbnail:
    summary: 'Delete a preset''s thumbnail, 1-100'
    params:
      preset: { type: int, min: 1, max: 100, required: true, label: Preset, description: 'Preset number 1-100, as on the camera.' }
    send: "\u0002OSJ:3A:{preset:-1:02d}\u0003"
    expect: { reply_contains: "\u0002OSJ:3A:", matches: '^\x02OSJ:3A:[0-9]{2}\x03$' }
    returns: ack
  delete_all_preset_thumbnails:
    summary: Delete every preset thumbnail
    send: "\u0002OSJ:3B\u0003"
    expect: { reply_contains: "\u0002OSJ:3B", matches: '^\x02OSJ:3B\x03$' }
    returns: ack
  get_preset_counter:
    summary: 'Query the name/thumbnail change counters for nine presets: block hex 00-0B (00 presets 1-9 ... 0B preset 100); the reply is OSJ:3C:<block>:<9-digit hex>'
    params:
      block: { type: string, pattern: '^0[0-9AB]$', required: true, label: Block, description: 'Two-digit hex 00-0B, each nine presets: 00 presets 1-9 up to 0B preset 100.' }
    send: "\u0002QSJ:3C:{block}\u0003"
    expect: { reply_contains: "\u0002OSJ:3C:", matches: '^\x02OSJ:3C:[0-9A-F]{2}:([0-9A-F]{9})\x03$' }
    returns: value
  get_gain_color_temperature_shutter_nd:
    summary: 'Query gain, colour temperature, shutter mode, step, synchro and ND together: pTG<gain 2><colour temperature 5><shutter mode 1><step 4><synchro 5><ND 1>, hex'
    send: "#PTG\r"
    expect: { matches: '^(pTG[0-9A-F]{18})$' }
    returns: value
  get_ptzfi:
    summary: 'Query pan, tilt, zoom, focus and iris together: pTV<pan 4><tilt 4><zoom 3><focus 3><iris 3>, hex'
    send: "#PTV\r"
    expect: { matches: '^(pTV[0-9A-F]{17})$' }
    returns: value
  get_ptzfi_scale:
    summary: 'Query pan, tilt, zoom scale, focus scale and iris F number: pTD<pan 4><tilt 4><zoom 000-3E7><focus 00-63><iris 00-FF>, hex'
    send: "#PTD\r"
    expect: { matches: '^(pTD[0-9A-F]{15})$' }
    returns: value
  ptzf_speed:
    summary: 'Pan, tilt, zoom and focus at a speed each: 00 no change, 01-49 one way, 50 stop, 51-99 the other'
    params:
      pan: { type: int, min: 0, max: 99, required: true, label: Pan speed, description: '00 no change, 01-49 left, 50 stop, 51-99 right; further from 50 is faster.' }
      tilt: { type: int, min: 0, max: 99, required: true, label: Tilt speed, description: '00 no change, 01-49 down, 50 stop, 51-99 up; further from 50 is faster.' }
      zoom: { type: int, min: 0, max: 99, required: true, label: Zoom speed, description: '00 no change, 01-49 wide, 50 stop, 51-99 tele; further from 50 is faster.' }
      focus: { type: int, min: 0, max: 99, required: true, label: Focus speed, description: '00 no change, 01-49 near, 50 stop, 51-99 far; further from 50 is faster.' }
    send: "#HV1{pan:02d}{tilt:02d}{zoom:02d}{focus:02d}\r"
    expect: { reply_contains: hV1, matches: '^hV1[0-9]{8}$' }
    returns: ack
  ptzf_speed_fine:
    summary: 'Pan, tilt and zoom at fine speeds (4-digit hex: 0000 no change, 7F00-8000 (stop)-8100) and focus at a speed (00 no change, 01-99, 50 stop)'
    params:
      pan: { type: string, pattern: '^(?:0000|(?:7F[0-9A-F][0-9A-F]|80[0-9A-F]{2}|8100))$', required: true, label: Pan speed, description: 'Four-digit hex: 0000 no change, 7F00 left fastest, 8000 stop, 8100 right fastest.' }
      tilt: { type: string, pattern: '^(?:0000|(?:7F[0-9A-F][0-9A-F]|80[0-9A-F]{2}|8100))$', required: true, label: Tilt speed, description: 'Four-digit hex: 0000 no change, 7F00 down fastest, 8000 stop, 8100 up fastest.' }
      zoom: { type: string, pattern: '^(?:0000|(?:7F[0-9A-F][0-9A-F]|80[0-9A-F]{2}|8100))$', required: true, label: Zoom speed, description: 'Four-digit hex: 0000 no change, 7F00 wide fastest, 8000 stop, 8100 tele fastest.' }
      focus: { type: int, min: 0, max: 99, required: true, label: Focus speed, description: '00 no change, 01-49 near, 50 stop, 51-99 far; further from 50 is faster.' }
    send: "#HV2{pan}{tilt}{zoom}{focus:02d}\r"
    expect: { reply_contains: hV2, matches: '^hV2[0-9A-F]{14}$' }
    returns: ack
  ptzf_position:
    summary: 'Move pan, tilt, zoom and focus to absolute positions: pan and tilt 4-digit hex, preset speed hex 00-1D, speed table 0-2, zoom 3-digit hex 555-FFF, zoom speed hex 01-64, focus 3-digit hex 555-FFF'
    params:
      pan: { type: string, pattern: '^[0-9A-F][0-9A-F]{3}$', required: true, label: Pan, description: 'Four-digit hex absolute position, 8000 being the centre.' }
      tilt: { type: string, pattern: '^[0-9A-F][0-9A-F]{3}$', required: true, label: Tilt, description: 'Four-digit hex absolute position, 8000 being the centre.' }
      speed: { type: string, pattern: '^(?:0[0-9A-F]|1[0-9A-D])$', required: true, label: Preset speed, description: Two-digit hex 00-1D for preset speed 1 to 30 from the chosen speed table. }
      table: { type: int, min: 0, max: 2, required: true, label: Speed table, description: '0 slow, 1 mid, 2 fast.' }
      zoom: { type: string, pattern: '^(?:55[5-9A-F]|5[6-9A-F][0-9A-F]|[6-9A-F][0-9A-F]{2})$', required: true, label: Zoom position, description: 'Three-digit hex, 555 wide to FFF tele.' }
      zoom_speed: { type: string, pattern: '^(?:0[1-9A-F]|[1-5][0-9A-F]|6[0-4])$', required: true, label: Zoom speed, description: Two-digit hex 01-64. }
      focus: { type: string, pattern: '^(?:55[5-9A-F]|5[6-9A-F][0-9A-F]|[6-9A-F][0-9A-F]{2})$', required: true, label: Focus position, description: 'Three-digit hex, 555 near to FFF far.' }
    send: "#HA1{pan}{tilt}{speed}{table}{zoom}{zoom_speed}{focus}\r"
    expect: { reply_contains: hA1, matches: '^hA1[0-9A-F]{19}$' }
    returns: ack
  menu:
    summary: Open or close the camera menu
    params:
      open: { type: bool, required: true, label: Open, description: 'On opens the camera menu, off closes it.' }
    send: "\u0002DUS:{open:bool01}\u0003"
    expect: { reply_contains: "\u0002DUS:", matches: '^\x02DUS:[01]\x03$' }
    returns: ack
  get_menu:
    summary: Query whether the camera menu is open
    send: "\u0002QUS\u0003"
    expect: { reply_contains: "\u0002OUS:", matches: '^\x02OUS:([01])\x03$' }
    returns: value
  menu_cancel:
    summary: Cancel the unconfirmed menu setting. Menu open only
    send: "\u0002DPG:1\u0003"
    expect: { reply_contains: "\u0002DPG:1", matches: '^\x02DPG:1\x03$' }
    returns: ack
  menu_enter:
    summary: Enter the selected menu item. Menu open only
    send: "\u0002DIT:1\u0003"
    expect: { reply_contains: "\u0002DIT:1", matches: '^\x02DIT:1\x03$' }
    returns: ack
  menu_up:
    summary: Move the menu cursor up. Menu open only
    send: "\u0002DUP:1\u0003"
    expect: { reply_contains: "\u0002DUP:1", matches: '^\x02DUP:1\x03$' }
    returns: ack
  menu_down:
    summary: Move the menu cursor down. Menu open only
    send: "\u0002DDW:1\u0003"
    expect: { reply_contains: "\u0002DDW:1", matches: '^\x02DDW:1\x03$' }
    returns: ack
  menu_right:
    summary: Move the menu cursor right. Menu open only
    send: "\u0002DRT:1\u0003"
    expect: { reply_contains: "\u0002DRT:1", matches: '^\x02DRT:1\x03$' }
    returns: ack
  menu_left:
    summary: Move the menu cursor left. Menu open only
    send: "\u0002DLT:1\u0003"
    expect: { reply_contains: "\u0002DLT:1", matches: '^\x02DLT:1\x03$' }
    returns: ack
  operation_lock:
    summary: 'Lock operation from other controllers, with up to 40 characters of information'
    params:
      info: { type: string, max_length: 40, pattern: '^[ -~]{1,40}$', required: true, label: Information, description: 'Text up to 40 printable ASCII characters shown to other controllers, such as who holds the lock.' }
    send: "\u0002OSJ:3E:{info}\u0003"
    expect: { reply_contains: "\u0002OSJ:3E:", matches: '^\x02OSJ:3E:.*\x03$' }
    returns: ack
  release_operation_lock:
    summary: Release the operation lock
    send: "\u0002OSJ:3F\u0003"
    expect: { reply_contains: "\u0002OSJ:3F", matches: '^\x02OSJ:3F\x03$' }
    returns: ack
  get_operation_lock:
    summary: 'Query the operation lock: OSJ:40:<0 unlocked, 1 locked>:<information>'
    send: "\u0002QSJ:40\u0003"
    expect: { reply_contains: "\u0002OSJ:40:", matches: '^\x02OSJ:40:([01]:.*)\x03$' }
    returns: value
  get_error:
    summary: 'Query the error state: 0 normal, 1 fan error (AW-UE80), 2 other error'
    send: "\u0002QER\u0003"
    expect: { reply_contains: "\u0002OER:", matches: '^\x02OER:([0-2])\x03$' }
    returns: value
  get_error_flags:
    summary: 'Query the error bits, 8-digit hex: bit0 fan, bit1 high temperature, bit2 lens, bit3 pan/tilt, bit4 sensor'
    send: "\u0002QSI:46\u0003"
    expect: { reply_contains: "\u0002OSI:46:", matches: '^\x02OSI:46:([0-9A-F]{8})\x03$' }
    returns: value
  get_latest_error:
    summary: 'Query the latest error code, rER<2-digit hex> (00 no error)'
    send: "#RER\r"
    expect: { reply_contains: rER, matches: '^rER([0-9A-F]{2})$' }
    returns: value
  get_model:
    summary: 'Query the model number, OID:<model> such as OID:AW-UE80'
    send: "\u0002QID\u0003"
    expect: { reply_contains: "\u0002OID:", matches: '^\x02OID:(.+)\x03$' }
    returns: value
  get_software_version:
    summary: 'Query the system software version, OSV:<version> such as OSV:V01.00'
    send: "\u0002QSV\u0003"
    expect: { reply_contains: "\u0002OSV:", matches: '^\x02OSV:(.+)\x03$' }
    returns: value
  get_component_version:
    summary: 'Query one component''s software version: 0 servo CPU, 1 camera CPU, ... (the numbering differs by model); the reply is qSV<component>V<version>'
    params:
      component: { type: int, min: 0, max: 9, required: true, label: Component, description: 'Component number, such as 0 servo CPU or 1 camera CPU; the numbering differs by model.' }
    send: "#QSV{component}\r"
    expect: { reply_contains: qSV, matches: '^qSV[0-9](V.*)$' }
    returns: value
  power:
    summary: 'Power on, or go to standby'
    params:
      power_on: { type: bool, required: true, label: Power on, description: 'On powers the camera on, off puts it in standby.' }
    send: "#O{power_on:bool01}\r"
    expect: { reply_contains: p, matches: '^p[01]$' }
    returns: ack
  get_power:
    summary: 'Query power: p0 standby, p1 on, p3 turning on (AW-HE120/HE130/HE40/HE65/HE70/UE70)'
    send: "#O\r"
    expect: { reply_contains: p, matches: '^p([0-3])$' }
    returns: value
  stream_resolution:
    summary: 'Set the streaming resolution: 0 640x360, 1 320x180, 2 1280x720, 3 1920x1080, 4 3840x2160 (AW-UE160)'
    params:
      resolution: { type: int, min: 0, max: 4, required: true, label: Resolution, description: '0 640x360, 1 320x180, 2 1280x720, 3 1920x1080, 4 3840x2160 (AW-UE160); AW-HE40/HE65/HE70/UE70 have 0 and 1.' }
    send: "#RZL{resolution}\r"
    expect: { reply_contains: rZL, matches: '^rZL[0-4]$' }
    returns: ack
  get_stream_resolution:
    summary: Query the streaming resolution
    send: "#RZL\r"
    expect: { reply_contains: rZL, matches: '^rZL([0-4])$' }
    returns: value
  camera_title:
    summary: 'Set the camera title, up to 40 ASCII characters'
    params:
      title: { type: string, max_length: 40, pattern: '^[ -~]{1,40}$', required: true, label: Camera title, description: Title up to 40 printable ASCII characters. }
    send: "\u0002OSJ:5C:{title}\u0003"
    expect: { reply_contains: "\u0002OSJ:5C:", matches: '^\x02OSJ:5C:.*\x03$' }
    returns: ack
  get_camera_title:
    summary: Query the camera title
    send: "\u0002QSJ:5C\u0003"
    expect: { reply_contains: "\u0002OSJ:5C:", matches: '^\x02OSJ:5C:(.*)\x03$' }
    returns: value
  auto_iris_close_limit:
    summary: Set the auto iris close limit
    params:
      limit: { type: int, min: 0, max: 3, required: true, label: Close limit, description: '0 normal, 1 F8, 2 F7, 3 F5.6.' }
    send: "\u0002OSJ:C0:{limit}\u0003"
    expect: { reply_contains: "\u0002OSJ:C0:", matches: '^\x02OSJ:C0:[0-3]\x03$' }
    returns: ack
  get_auto_iris_close_limit:
    summary: Query the auto iris close limit
    send: "\u0002QSJ:C0\u0003"
    expect: { reply_contains: "\u0002OSJ:C0:", matches: '^\x02OSJ:C0:([0-3])\x03$' }
    returns: value
  awb_color_temperature_up:
    summary: Set the AWB colour temperature up by a number of steps
    params:
      steps: { type: string, pattern: '^[1-9A]$', required: true, label: Steps, description: 'Steps among the selectable colour temperatures, as 1-digit hex 1-A.' }
    send: "\u0002OSJ:48:{steps}\u0003"
    expect: { reply_contains: "\u0002OSJ:48:", matches: '^\x02OSJ:48:[0-9A-F]{1}\x03$' }
    returns: ack
  awb_color_temperature_down:
    summary: Set the AWB colour temperature down by a number of steps
    params:
      steps: { type: string, pattern: '^[1-9A]$', required: true, label: Steps, description: 'Steps among the selectable colour temperatures, as 1-digit hex 1-A.' }
    send: "\u0002OSJ:49:{steps}\u0003"
    expect: { reply_contains: "\u0002OSJ:49:", matches: '^\x02OSJ:49:[0-9A-F]{1}\x03$' }
    returns: ack
  awb_color_temperature:
    summary: 'Set the AWB (A channel) colour temperature in kelvin, 5-digit hex 007D0-03A98 for 2000-15000 K'
    params:
      kelvin: { type: string, pattern: '^(?:007[D-F][0-9A-F]|00[8-9A-F][0-9A-F]{2}|0[1-2][0-9A-F]{3}|03[0-9][0-9A-F]{2}|03A[0-8][0-9A-F]|03A9[0-8])$', required: true, label: Colour temperature, description: 'Kelvin as 5-digit hex, 007D0 (2000 K) to 03A98 (15000 K); the camera rounds down to a selectable value.' }
    send:
      - { models: [aw-ue150, aw-ue155, aw-he145, aw-ue100], message: "\u0002OSJ:4A:{kelvin}\u0003" }
      - { models: [aw-ue160], message: "\u0002OSJ:4A:{kelvin}:0\u0003" }
    expect: { reply_contains: "\u0002OSJ:4A:", matches: '^\x02OSJ:4A:[0-9A-F]{5}(?::[0-2])?\x03$' }
    returns: ack
  awb_r_gain:
    summary: Set the AWB R gain (A channel)
    params:
      gain: { type: string, pattern: '^(?:6[7-9A-F][0-9A-F]|[7-8][0-9A-F]{2}|9[0-8][0-9A-F]|990)$', required: true, label: R gain, description: 'AWB R gain, 800 is 0 and each step 1 from -400 to +400, as 3-digit hex 670-990.' }
    send: "\u0002OSJ:4B:{gain}\u0003"
    expect: { reply_contains: "\u0002OSJ:4B:", matches: '^\x02OSJ:4B:[0-9A-F]{3}\x03$' }
    returns: ack
  get_awb_r_gain:
    summary: Query the AWB R gain (A channel)
    send: "\u0002QSJ:4B\u0003"
    expect: { reply_contains: "\u0002OSJ:4B:", matches: '^\x02OSJ:4B:([0-9A-F]{3})\x03$' }
    returns: value
  awb_b_gain:
    summary: Set the AWB B gain (A channel)
    params:
      gain: { type: string, pattern: '^(?:6[7-9A-F][0-9A-F]|[7-8][0-9A-F]{2}|9[0-8][0-9A-F]|990)$', required: true, label: B gain, description: 'AWB B gain, 800 is 0 and each step 1 from -400 to +400, as 3-digit hex 670-990.' }
    send: "\u0002OSJ:4C:{gain}\u0003"
    expect: { reply_contains: "\u0002OSJ:4C:", matches: '^\x02OSJ:4C:[0-9A-F]{3}\x03$' }
    returns: ack
  get_awb_b_gain:
    summary: Query the AWB B gain (A channel)
    send: "\u0002QSJ:4C\u0003"
    expect: { reply_contains: "\u0002OSJ:4C:", matches: '^\x02OSJ:4C:([0-9A-F]{3})\x03$' }
    returns: value
  awb_g_axis:
    summary: Set the AWB G axis (A channel)
    params:
      gain: { type: string, pattern: '^(?:6[7-9A-F][0-9A-F]|[7-8][0-9A-F]{2}|9[0-8][0-9A-F]|990)$', required: true, label: G axis, description: 'AWB G axis, 800 is 0 and each step 1 from -400 to +400, as 3-digit hex 670-990.' }
    send: "\u0002OSJ:4D:{gain}\u0003"
    expect: { reply_contains: "\u0002OSJ:4D:", matches: '^\x02OSJ:4D:[0-9A-F]{3}\x03$' }
    returns: ack
  get_awb_g_axis:
    summary: Query the AWB G axis (A channel)
    send: "\u0002QSJ:4D\u0003"
    expect: { reply_contains: "\u0002OSJ:4D:", matches: '^\x02OSJ:4D:([0-9A-F]{3})\x03$' }
    returns: value
  r_pedestal:
    summary: Set the R pedestal
    params:
      pedestal: { type: string, pattern: '^(?:0[0-9A-F]{2}|1[0-2][0-9A-F]|12C)$', required: true, label: R pedestal, description: 'R pedestal as 3-digit hex, 096 being 0: 032-0FA for -100 to +100, or 000-12C for -150 to +150 on AW-HE120.' }
    send: "\u0002ORP:{pedestal}\u0003"
    expect: { reply_contains: "\u0002ORP:", matches: '^\x02ORP:[0-9A-F]{3}\x03$' }
    returns: ack
  get_r_pedestal:
    summary: Query the R pedestal
    send: "\u0002QRP\u0003"
    expect: { reply_contains: "\u0002ORP:", matches: '^\x02ORP:([0-9A-F]{3})\x03$' }
    returns: value
  g_pedestal:
    summary: Set the G pedestal
    params:
      pedestal: { type: string, pattern: '^(?:03[2-9A-F]|0[4-9A-E][0-9A-F]|0F[0-9A])$', required: true, label: G pedestal, description: 'G pedestal, 096 is 0, -100 to +100, as 3-digit hex 032-0FA.' }
    send: "\u0002OSJ:10:{pedestal}\u0003"
    expect: { reply_contains: "\u0002OSJ:10:", matches: '^\x02OSJ:10:[0-9A-F]{3}\x03$' }
    returns: ack
  get_g_pedestal:
    summary: Query the G pedestal
    send: "\u0002QSJ:10\u0003"
    expect: { reply_contains: "\u0002OSJ:10:", matches: '^\x02OSJ:10:([0-9A-F]{3})\x03$' }
    returns: value
  b_pedestal:
    summary: Set the B pedestal
    params:
      pedestal: { type: string, pattern: '^(?:0[0-9A-F]{2}|1[0-2][0-9A-F]|12C)$', required: true, label: B pedestal, description: 'B pedestal as 3-digit hex, 096 being 0: 032-0FA for -100 to +100, or 000-12C for -150 to +150 on AW-HE120.' }
    send: "\u0002OBP:{pedestal}\u0003"
    expect: { reply_contains: "\u0002OBP:", matches: '^\x02OBP:[0-9A-F]{3}\x03$' }
    returns: ack
  get_b_pedestal:
    summary: Query the B pedestal
    send: "\u0002QBP\u0003"
    expect: { reply_contains: "\u0002OBP:", matches: '^\x02OBP:([0-9A-F]{3})\x03$' }
    returns: value
  pedestal_offset:
    summary: Set pedestal offset
    params:
      enabled: { type: bool, required: true, label: Pedestal offset, description: 'On turns pedestal offset on, off turns it off.' }
    send: "\u0002OSJ:11:{enabled:bool01}\u0003"
    expect: { reply_contains: "\u0002OSJ:11:", matches: '^\x02OSJ:11:[01]\x03$' }
    returns: ack
  get_pedestal_offset:
