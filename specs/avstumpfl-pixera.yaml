                  description: "Blend duration in seconds; 0 jumps at once." }
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.applyCueOnTimeline","params":{"timelineName":{timeline:json},"cueName":{cue:json},"blendDuration":{blend_s:.3f}}}'
    expect: { not_contains: '"error":' }
    returns: ack

  apply_cue_index:
    summary: Jump to and run a cue by its index on a timeline, both by index from 0 (Compound.applyCueAtIndexOnTimelineAtIndex)
    params:
      timeline_index: { type: int, min: 0, required: true,
                        label: Timeline index,
                        description: "Timeline's position in the timeline library, from 0." }
