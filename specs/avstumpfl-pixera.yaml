telemetry:
  # Monitoring is per connection and every subject is subscribed by default;
  # the event mode all makes PIXERA push each entry as it happens, instead of
  # holding it for Utility.pollMonitoring. The delimiter is asked for on the
  # pushed messages too (26.1).
  subscribe:
    send:
      - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Utility.setMonitoringHasDelimiter","params":{"hasDelimiter":true}}'
      - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Utility.setMonitoringEventMode","params":{"mode":"all"}}'
  # What monitoring does not push is read: the live and remote systems of the
  # session and their states, the live systems by handle, and every
  # timeline and its layers with the values an operator sets on them. Each
  # list answer asks for the details of what it lists (then_send), and each
  # answer is tied to its request, since a JSON-RPC reply names neither the
  # method nor the handle.
  poll:
    every_ms: 10000
    send:
      - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Session.getLiveSystemIps"}'
      - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Session.getRemoteSystemIps"}'
      - '{"jsonrpc":"2.0","id":1,"method":"Pixera.LiveSystems.getLiveSystems"}'
      - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.getTimelines"}'
  updates:
    # Session: live and remote systems by IP address.
    - match: '"result":\s*\['
      request_match: '"method":"Pixera\.Session\.getLiveSystemIps"\}$'
      match_each: '"([^"]+)"'
      then_send:
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Session.getLiveSystemState","params":{"ip":{1:json}}}'
    - match: '"result":\s*"((?:[^"\\]|\\.)*)"'
      request_match: '"method":"Pixera\.Session\.getLiveSystemState","params":\{"ip":"([^"]+)"\}\}$'
      state: { "session.live_systems.{2:key}.state": "{1}" }
    - match: '"result":\s*\['
      request_match: '"method":"Pixera\.Session\.getRemoteSystemIps"\}$'
      match_each: '"([^"]+)"'
      then_send:
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Session.getRemoteSystemState","params":{"ip":{1:json}}}'
    - match: '"result":\s*"((?:[^"\\]|\\.)*)"'
      request_match: '"method":"Pixera\.Session\.getRemoteSystemState","params":\{"ip":"([^"]+)"\}\}$'
      state: { "session.remote_systems.{2:key}.state": "{1}" }
    # Live systems by handle.
    - match: '"result":\s*\['
      request_match: '"method":"Pixera\.LiveSystems\.getLiveSystems"\}$'
      match_each: '(\d+)\s*[,\]]'
      then_send:
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.LiveSystems.LiveSystem.getName","params":{"handle":{1}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.LiveSystems.LiveSystem.getIp","params":{"handle":{1}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.LiveSystems.LiveSystem.getState","params":{"handle":{1}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.LiveSystems.LiveSystem.getUsagePresetName","params":{"handle":{1}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.LiveSystems.LiveSystem.getBackupRole","params":{"handle":{1}}}'
    - match: '"result":\s*"((?:[^"\\]|\\.)*)"'
      request_match: '"method":"Pixera\.LiveSystems\.LiveSystem\.getName","params":\{"handle":(\d+)\}\}$'
      state: { "live_systems.{2}.name": "{1}" }
    - match: '"result":\s*"((?:[^"\\]|\\.)*)"'
      request_match: '"method":"Pixera\.LiveSystems\.LiveSystem\.getIp","params":\{"handle":(\d+)\}\}$'
      state: { "live_systems.{2}.ip": "{1}" }
    - match: '"result":\s*"((?:[^"\\]|\\.)*)"'
      request_match: '"method":"Pixera\.LiveSystems\.LiveSystem\.getState","params":\{"handle":(\d+)\}\}$'
      state: { "live_systems.{2}.state": "{1}" }
    - match: '"result":\s*"((?:[^"\\]|\\.)*)"'
      request_match: '"method":"Pixera\.LiveSystems\.LiveSystem\.getUsagePresetName","params":\{"handle":(\d+)\}\}$'
      state: { "live_systems.{2}.usage_preset": "{1}" }
    - match: '"result":\s*(-?\d+)'
      request_match: '"method":"Pixera\.LiveSystems\.LiveSystem\.getBackupRole","params":\{"handle":(\d+)\}\}$'
      state: { "live_systems.{2}.backup_role": "{1}" }
    # Timelines and their layers, by handle.
    - match: '"result":\s*\['
      request_match: '"method":"Pixera\.Timelines\.getTimelines"\}$'
      match_each: '(\d+)\s*[,\]]'
      then_send:
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.Timeline.getName","params":{"handle":{1}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.Timeline.getOpacity","params":{"handle":{1}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.Timeline.getSpeedFactor","params":{"handle":{1}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.Timeline.getLayers","params":{"handle":{1}}}'
    - match: '"result":\s*"((?:[^"\\]|\\.)*)"'
      request_match: '"method":"Pixera\.Timelines\.Timeline\.getName","params":\{"handle":(\d+)\}\}$'
      state: { "timelines.{2}.name": "{1}" }
    - match: '"result":\s*(-?[0-9.eE+-]+)'
      request_match: '"method":"Pixera\.Timelines\.Timeline\.getOpacity","params":\{"handle":(\d+)\}\}$'
      state: { "timelines.{2}.opacity": "{1}" }
    - match: '"result":\s*(-?[0-9.eE+-]+)'
      request_match: '"method":"Pixera\.Timelines\.Timeline\.getSpeedFactor","params":\{"handle":(\d+)\}\}$'
      state: { "timelines.{2}.speed": "{1}" }
    - match: '"result":\s*\['
      request_match: '"method":"Pixera\.Timelines\.Timeline\.getLayers","params":\{"handle":(\d+)\}\}$'
      match_each: '(\d+)\s*[,\]]'
      state: { "layers.{2}.timeline": "{1}" }
      then_send:
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.Layer.getName","params":{"handle":{2}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.Layer.getBlendMode","params":{"handle":{2}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.Layer.getOpacity","params":{"handle":{2}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.Layer.getVolume","params":{"handle":{2}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.Layer.getPlaybackSpeed","params":{"handle":{2}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.Layer.getTransportMode","params":{"handle":{2}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.Layer.getIsLayerMuted","params":{"handle":{2}}}'
        - '{"jsonrpc":"2.0","id":1,"method":"Pixera.Timelines.Layer.getIsAudioMuted","params":{"handle":{2}}}'
    - match: '"result":\s*"((?:[^"\\]|\\.)*)"'
      request_match: '"method":"Pixera\.Timelines\.Layer\.getName","params":\{"handle":(\d+)\}\}$'
      state: { "layers.{2}.name": "{1}" }
    - match: '"result":\s*"((?:[^"\\]|\\.)*)"'
      request_match: '"method":"Pixera\.Timelines\.Layer\.getBlendMode","params":\{"handle":(\d+)\}\}$'
      state: { "layers.{2}.blend_mode": "{1}" }
    - match: '"result":\s*(-?[0-9.eE+-]+)'
      request_match: '"method":"Pixera\.Timelines\.Layer\.getOpacity","params":\{"handle":(\d+)\}\}$'
      state: { "layers.{2}.opacity": "{1}" }
    - match: '"result":\s*(-?[0-9.eE+-]+)'
      request_match: '"method":"Pixera\.Timelines\.Layer\.getVolume","params":\{"handle":(\d+)\}\}$'
      state: { "layers.{2}.volume": "{1}" }
    - match: '"result":\s*(-?[0-9.eE+-]+)'
      request_match: '"method":"Pixera\.Timelines\.Layer\.getPlaybackSpeed","params":\{"handle":(\d+)\}\}$'
      state: { "layers.{2}.speed": "{1}" }
    - match: '"result":\s*([1-3])\b'
      request_match: '"method":"Pixera\.Timelines\.Layer\.getTransportMode","params":\{"handle":(\d+)\}\}$'
      state:
        "layers.{2}.transport": { value: "{1}", map: { "1": play, "2": pause, "3": stop } }
    - match: '"result":\s*(true|false)'
      request_match: '"method":"Pixera\.Timelines\.Layer\.getIsLayerMuted","params":\{"handle":(\d+)\}\}$'
      state: { "layers.{2}.muted": "{1}" }
    - match: '"result":\s*(true|false)'
      request_match: '"method":"Pixera\.Timelines\.Layer\.getIsAudioMuted","params":\{"handle":(\d+)\}\}$'
      state: { "layers.{2}.audio_muted": "{1}" }
    - json_match: { "$.type": "^monEvent$", "$.name": "^timelineTransport$" }
      json_each: "$.entries"
      json: { handle: "$.handle", mode: "$.value" }
      state:
        timelines.{handle}.transport: { value: "{mode}", map: { "1": play, "2": pause, "3": stop } }
    - json_match: { "$.type": "^monEvent$", "$.name": "^timelinePositions$" }
      json_each: "$.entries"
      json: { handle: "$.handle", frame: "$.value" }
      state:
        timelines.{handle}.position_frames: "{frame}"
    - json_match: { "$.type": "^monEvent$", "$.name": "^timelineCountdowns$" }
      json_each: "$.entries"
      json: { handle: "$.handle", frames: "$.value", flag: "$.flag" }
      state:
        timelines.{handle}.countdown_frames: "{frames}"
        timelines.{handle}.countdown: { value: "{flag}", map: { "1": to_next_cue, "2": waiting_at_cue } }
    - json_match: { "$.type": "^monEvent$", "$.name": "^([A-Za-z]+)$" }
      state: { monitoring.last_event: "{1}" }

state:
  timelines.*.transport:        { type: string, description: "Transport of a timeline, keyed by its handle: play, pause or stop" }
  timelines.*.position_frames:  { type: int, unit: frames, description: "Current time of a timeline, in frames" }
  timelines.*.countdown_frames: { type: int, unit: frames, description: "Frames to the next cue, or left of the wait at a cue" }
  timelines.*.countdown:        { type: string, description: "What the countdown counts: to_next_cue while moving, waiting_at_cue while paused at a cue" }
  monitoring.last_event:        { type: string, description: "Subject of the last monitoring event, such as cueApplied or timelineAdded" }
  timelines.*.name:             { type: string, description: "Timeline name, keyed by its handle (polled)" }
  timelines.*.opacity:          { type: float, description: "Timeline opacity, 0.0 to 1.0 (polled)" }
  timelines.*.speed:            { type: float, description: "Timeline speed factor, 1.0 for normal speed (polled)" }
  layers.*.timeline:            { type: int, description: "Handle of the timeline the layer is on; keyed by the layer's handle (polled)" }
  layers.*.name:                { type: string, description: "Layer name (polled)" }
  layers.*.blend_mode:          { type: string, description: "Layer blend mode, by name (polled)" }
  layers.*.opacity:             { type: float, description: "Layer opacity (polled)" }
  layers.*.volume:              { type: float, description: "Layer audio volume (polled)" }
  layers.*.speed:               { type: float, description: "Layer playback speed factor (polled)" }
  layers.*.transport:           { type: string, description: "Layer transport: play, pause or stop (polled)" }
  layers.*.muted:               { type: bool, description: "Layer muted (polled)" }
  layers.*.audio_muted:         { type: bool, description: "Layer audio muted (polled)" }
  live_systems.*.name:          { type: string, description: "Live system name, keyed by its handle (polled)" }
  live_systems.*.ip:            { type: string, description: "Live system IP address (polled)" }
  live_systems.*.state:         { type: string, description: "Live system state, in PIXERA's own words (polled)" }
  live_systems.*.usage_preset:  { type: string, description: "Name of the live system's usage preset (polled)" }
  live_systems.*.backup_role:   { type: int, description: "Live system backup role, PIXERA's number for it (polled)" }
  session.live_systems.*.state: { type: string, description: "State of a live system of the session, keyed by its IP address, in PIXERA's own words (polled)" }
  session.remote_systems.*.state: { type: string, description: "State of a remote system of the session, keyed by its IP address, in PIXERA's own words (polled)" }

quirks:
  - models: [all]
    severity: warning
    text: >
      An API access point has to be set to JSON/TCP (dl) in Settings > API, with
      its adapter and port (1400 here, as in AV Stumpfl's examples; no default is
      documented), and PIXERA restarted. From 25.2 every API access is off by
      default, and the allowlist can refuse calls with error -32602 "Access is not
      authorized.". There is no authentication or encryption.
  - models: [all]
    severity: info
    text: >
      Messages are delimited by the text 0xPX, with no escaping: a name or path
      containing 0xPX would split a message in two. Timeline, cue and layer names
      are not unique in PIXERA; a name finds the first match.
  - models: [all]
    severity: info
    text: >
      Timeline times are in frames, except the _s commands (seconds); cue blends
      (apply_cue_blend) are in seconds; blend_to_time takes frames. Transport modes
      are 1 play, 2 pause, 3 stop. PIXERA 26.1 renamed the key of the Compound time
      methods from timelineName to name; the _legacy commands use the old key.
  - models: [all]
    severity: info
    text: >
      Monitoring state is keyed by handle; get_timeline_handle gives a timeline's
      handle and get_timeline_attributes its name. With the event mode all,
      timelinePositions and timelineCountdowns are pushed as they change, about
      once a frame per running timeline; unsubscribe_monitoring stops a subject on
      this connection. Whether handles survive reloading the project is not
      documented.
  - models: [all]
    severity: info
    text: >
      setMonitoringHasDelimiter, asked for on connecting, is listed without a
      description in the 26.1 reference; earlier versions answer it with an error
      and are taken to end pushed messages with 0xPX as they do replies.
  - models: [all]
    severity: critical
    text: >
      load_project replaces the open project, close_app quits PIXERA (saving
      first unless save is false), and save_project overwrites the project file.
      None can be undone over the API.
  - models: [all]
    severity: warning
    text: >
      set_screen_blackout and set_projector_blackout, and pause_smpte_input, take
      effect on the output at once.

  - models: [pixera-26]
    severity: critical
    text: >
      utility_run_js_script runs any JavaScript in PIXERA's Control
      scripting environment, which can do whatever the API and Control can:
      change or remove anything in the project, quit PIXERA or shut down
      machines. It cannot be undone and nothing limits what the code does;
      offer it only to trusted operators. Its answer is the function's
      result as text.

  - models: [pixera-26]
    severity: critical
    text: >
      Cannot be undone over the API: every remove_this, remove_clips,
      remove_cues and removeClipsFromJsonString; session_shutdown_system,
      session_shutdown_live_system, live_system_shut_down and
      multi_user_member_shut_down (mode 1 shut down, 2 power off where
      supported, 3 restart); session_stop_live_systems,
      session_restart_live_systems and the engine start, stop, restart,
      reset and close commands of live systems and multi-user members,
      which interrupt output; live_system_delete_unused_files_from_cache;
      resource removal and folder removal; session_save_project_as over an
      existing file; and applying a usage preset or importing mappings,
      which replace the outputs' mapping.

  - models: [pixera-26]
    severity: warning
    text: >
      The handle-based commands (timeline_*, layer_*, clip_*, cue_*,
      param_*, node_*, screen_*, studio_camera_*, perspective_*,
      projector_*, resource_*, resource_folder_*, live_system_*, output_*,
      video_stream_* and the rest) follow the 26.1 reference's request for
      each method, keyed and typed as its signature and example give them.
      The first argument is the handle of the object, which a list or
      lookup command of the same namespace answers (timelines_get_timelines,
      timeline_get_layers, layer_get_clips, screens_get_screens,
      resources_get_resource_folders and so on), and the state holds the
      handles of timelines, layers and live systems. Where the reference
      marks arguments optional, a command without them is offered, and one
      ending _with_<first optional> that sends them all; a setter whose
      every argument is optional (screen_set_position and the like) sends
      them all, as leaving one out is not described. The reference gives
      units only for some arguments: times on a timeline are in frames,
      fade times in milliseconds where named so, positions in PIXERA's
      world units and rotations in degrees as its user interface shows
      them; others are passed through in PIXERA's own terms.

  - models: [pixera-legacy]
    severity: info
    text: >
      The handle-based, Session, Resources, LiveSystems and runJsScript
      commands are listed for PIXERA 26.1 only: the 26.1 reference does not
      say which of them earlier revisions have. has_function answers whether
      a given method exists on the PIXERA connected.

  - models: [all]
    severity: info
    text: >
      The session's live and remote systems (by IP address), the live
      systems by handle (name, IP, state, usage preset, backup role), and
      every timeline (name, opacity, speed) with its layers (name, blend
      mode, opacity, volume, speed, transport, layer and audio mute) are
      polled every 10 seconds; each list answer asks for the details of
      what it lists, one request at a time, so a project with many layers
      means many requests per round. A system or layer that is gone stays
      in state until the device is opened again. Audio master volume and
      mute take a channel the reference does not number (getAudioMasterVolume
      with channel 1 in its example) and are not polled; live system and
      remote system states are PIXERA's own words, which the reference does
      not list.
