                  description: "Timeline name as shown in PIXERA; names need not be unique, and the first match is used." }
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.getOpacityOnTimeline","params":{"timelineName":{timeline:json}}}'
    expect: { not_contains: '"error":', json_path: "$.result" }
    returns: value

  apply_cue:
    summary: Jump to and run a cue, by timeline and cue name, with the cue's own blend (Compound.applyCueOnTimeline)
    params:
      timeline: { type: string, max_length: 256, required: true,
                  label: Timeline,
                  description: "Timeline name as shown in PIXERA; names need not be unique, and the first match is used." }
      cue:      { type: string, max_length: 256, required: true,
                  label: Cue,
                  description: "Cue name on the timeline; the first cue with this name is used." }
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.applyCueOnTimeline","params":{"timelineName":{timeline:json},"cueName":{cue:json}}}'
    expect: { not_contains: '"error":' }
    returns: ack

  apply_cue_blend:
    summary: Jump to and run a cue, by timeline and cue name, blending over a time in seconds (Compound.applyCueOnTimeline)
    params:
      timeline: { type: string, max_length: 256, required: true,
                  label: Timeline,
                  description: "Timeline name as shown in PIXERA; names need not be unique, and the first match is used." }
      cue:      { type: string, max_length: 256, required: true,
                  label: Cue,
                  description: "Cue name on the timeline; the first cue with this name is used." }
      blend_s:  { type: float, min: 0.0, required: true,
