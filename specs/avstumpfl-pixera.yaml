    notes: >
      The Compound time methods take "timelineName" (the _legacy commands);
      toggleTransport, getTimelineNames, getCueNames and applyCueWithNumberString
      are not in revision 204.

commands:
  play_timeline:
    summary: Play a timeline, by name (Compound.setTransportModeOnTimeline, mode 1)
    params:
      timeline: { type: string, max_length: 256, required: true,
                  label: Timeline,
                  description: "Timeline name as shown in PIXERA; names need not be unique, and the first match is used." }
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.setTransportModeOnTimeline","params":{"timelineName":{timeline:json},"mode":1}}'
    expect: { not_contains: '"error":' }
    returns: ack

  pause_timeline:
    summary: Pause a timeline, by name (Compound.setTransportModeOnTimeline, mode 2)
    params:
      timeline: { type: string, max_length: 256, required: true,
                  label: Timeline,
                  description: "Timeline name as shown in PIXERA; names need not be unique, and the first match is used." }
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.setTransportModeOnTimeline","params":{"timelineName":{timeline:json},"mode":2}}'
    expect: { not_contains: '"error":' }
    returns: ack

  stop_timeline:
    summary: Stop a timeline, by name (Compound.setTransportModeOnTimeline, mode 3)
    params:
      timeline: { type: string, max_length: 256, required: true,
                  label: Timeline,
                  description: "Timeline name as shown in PIXERA; names need not be unique, and the first match is used." }
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.setTransportModeOnTimeline","params":{"timelineName":{timeline:json},"mode":3}}'
    expect: { not_contains: '"error":' }
    returns: ack

  toggle_timeline:
    summary: Toggle a timeline between play and pause, by name (Compound.toggleTransport)
    params:
      timeline: { type: string, max_length: 256, required: true,
                  label: Timeline,
                  description: "Timeline name as shown in PIXERA; names need not be unique, and the first match is used." }
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.toggleTransport","params":{"timelineName":{timeline:json}}}'
    expect: { not_contains: '"error":' }
    returns: ack

  get_timeline_transport:
    summary: "A timeline's transport mode, by name: 1 play, 2 pause, 3 stop (Compound.getTransportModeOnTimeline)"
    params:
      timeline: { type: string, max_length: 256, required: true,
                  label: Timeline,
                  description: "Timeline name as shown in PIXERA; names need not be unique, and the first match is used." }
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.getTransportModeOnTimeline","params":{"timelineName":{timeline:json}}}'
    expect: { not_contains: '"error":', json_path: "$.result" }
    returns: value

  play_timeline_index:
    summary: Play a timeline by its index in the timeline library, from 0 (Compound.setTransportModeOnTimelineAtIndex, mode 1)
    params:
      index: { type: int, min: 0, required: true,
               label: Timeline index,
               description: "Timeline's position in the timeline library, from 0." }
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.setTransportModeOnTimelineAtIndex","params":{"index":{index},"mode":1}}'
    expect: { not_contains: '"error":', json_path: "$.result" }
    returns: value

  pause_timeline_index:
    summary: Pause a timeline by its index in the timeline library, from 0 (Compound.setTransportModeOnTimelineAtIndex, mode 2)
    params:
      index: { type: int, min: 0, required: true,
               label: Timeline index,
               description: "Timeline's position in the timeline library, from 0." }
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.setTransportModeOnTimelineAtIndex","params":{"index":{index},"mode":2}}'
    expect: { not_contains: '"error":', json_path: "$.result" }
    returns: value

  stop_timeline_index:
    summary: Stop a timeline by its index in the timeline library, from 0 (Compound.setTransportModeOnTimelineAtIndex, mode 3)
    params:
      index: { type: int, min: 0, required: true,
               label: Timeline index,
               description: "Timeline's position in the timeline library, from 0." }
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.setTransportModeOnTimelineAtIndex","params":{"index":{index},"mode":3}}'
    expect: { not_contains: '"error":', json_path: "$.result" }
    returns: value

  start_first_timeline:
    summary: Play the first timeline (Compound.startFirstTimeline)
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.startFirstTimeline"}'
    expect: { not_contains: '"error":' }
    returns: ack

  pause_first_timeline:
    summary: Pause the first timeline (Compound.pauseFirstTimeline)
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.pauseFirstTimeline"}'
    expect: { not_contains: '"error":' }
    returns: ack

  stop_first_timeline:
    summary: Stop the first timeline (Compound.stopFirstTimeline)
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.stopFirstTimeline"}'
    expect: { not_contains: '"error":' }
    returns: ack

  set_timeline_opacity:
    summary: Set a timeline's opacity, 0.0 to 1.0, by name (Compound.setOpacityOnTimeline)
    params:
      timeline: { type: string, max_length: 256, required: true,
                  label: Timeline,
                  description: "Timeline name as shown in PIXERA; names need not be unique, and the first match is used." }
      opacity:  { type: float, min: 0.0, max: 1.0, required: true,
                  label: Opacity,
                  description: "Timeline opacity, 0.0 (transparent) to 1.0 (opaque)." }
    send: '{"jsonrpc":"2.0","id":1,"method":"Pixera.Compound.setOpacityOnTimeline","params":{"timelineName":{timeline:json},"opacity":{opacity:.3f}}}'
    expect: { not_contains: '"error":' }
    returns: ack

  get_timeline_opacity:
    summary: A timeline's opacity, by name (Compound.getOpacityOnTimeline)
    params:
      timeline: { type: string, max_length: 256, required: true,
