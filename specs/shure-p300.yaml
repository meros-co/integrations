      - toggle_mute
      - get_gain
      - set_gain
      - increase_gain
      - decrease_gain
      - get_device_mute
      - set_device_mute
      - toggle_device_mute
      - get_input_level
      - set_input_level
      - get_output_level
      - set_output_level
      - get_led_brightness
      - set_led_brightness
      - get_input_meter_mode
      - set_input_meter_mode
      - get_output_meter_mode
      - set_output_meter_mode
      - get_meter_rate_in
      - set_meter_rate_in
      - get_meter_rate_out
      - set_meter_rate_out
      - get_meter_rate_proc
      - set_meter_rate_proc
      - get_meter_rate_erle
      - set_meter_rate_erle
      - get_meter_rate_agc
      - set_meter_rate_agc
      - get_aec
      - set_aec
      - toggle_aec
      - get_aec_reference
      - set_aec_reference
      - get_aec_nlp
      - set_aec_nlp
      - get_noise_reduction
      - set_noise_reduction
      - get_noise_reduction_level
      - set_noise_reduction_level
      - get_agc
      - set_agc
      - toggle_agc
      - get_agc_max_cut
      - set_agc_max_cut
      - get_agc_max_boost
      - set_agc_max_boost
      - get_agc_target
      - set_agc_target
      - get_gate_inhibit
      - set_gate_inhibit
      - toggle_gate_inhibit
      - get_automixer_mode
      - set_automixer_mode
      - get_automixer_off_attenuation
      - set_automixer_off_attenuation
      - get_automixer_gate_sensitivity
      - set_automixer_gate_sensitivity
      - get_automixer_max_open
      - set_automixer_max_open
      - get_automixer_last_mic_lock
      - set_automixer_last_mic_lock
      - toggle_automixer_last_mic_lock
      - get_automixer_hold_time
      - set_automixer_hold_time
      - get_automixer_always_on
      - set_automixer_always_on
      - toggle_automixer_always_on
      - get_automixer_priority
      - set_automixer_priority
