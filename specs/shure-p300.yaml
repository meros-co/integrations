    expect: { reply_contains: " ONHOOK_ENABLE ", matches: " ONHOOK_ENABLE \\{?(.*?) *\\}? *>$" }
    returns: value
  set_call_status_enabled:
    summary: "Turn the call status feature on or off (ONHOOK_ENABLE)"
    params:
      enabled: { type: bool, default: true }
    send: "SET ONHOOK_ENABLE {enabled:on_off}"
    expect: { reply_contains: " ONHOOK_ENABLE ", contains: " ONHOOK_ENABLE " }
    returns: ack
  get_call_state:
    summary: "Read the call status (ONHOOK or OFFHOOK) (ONHOOK_STATE)"
    send: "GET ONHOOK_STATE"
    expect: { reply_contains: " ONHOOK_STATE ", matches: " ONHOOK_STATE \\{?(.*?) *\\}? *>$" }
    returns: value
  get_matrix_route:
    summary: "Matrix mixer: whether an input is routed to an output (MATRIX_MXR_ROUTE)"
    params:
      input: { type: int, min: 0, max: 99, required: true }
      output: { type: int, min: 0, max: 99, required: true }
    send: "GET {input:02d} MATRIX_MXR_ROUTE {output:02d}"
    expect: { reply_contains: " MATRIX_MXR_ROUTE ", matches: " MATRIX_MXR_ROUTE \\d+ \\{?(.*?) *\\}? *>$" }
    returns: value
  set_matrix_route:
    summary: "Matrix mixer: route or unroute an input to an output"
    params:
      input: { type: int, min: 0, max: 99, required: true }
      output: { type: int, min: 0, max: 99, required: true }
      enabled: { type: bool, default: true }
    send: "SET {input:02d} MATRIX_MXR_ROUTE {output:02d} {enabled:on_off}"
    expect: { reply_contains: " MATRIX_MXR_ROUTE ", contains: " MATRIX_MXR_ROUTE " }
    returns: ack
  set_matrix_gain:
    summary: "Matrix mixer: a crosspoint's gain in tenths of a dB, -1100 to 300 (-110.0 to +30.0 dB)"
    params:
      input: { type: int, min: 0, max: 99, required: true }
      output: { type: int, min: 0, max: 99, required: true }
      gain_tenth_db: { type: int, min: -1100, max: 300, required: true }
    send: "SET {input:02d} MATRIX_MXR_GAIN {output:02d} {gain_tenth_db:+1100:04d}"
    expect: { reply_contains: " MATRIX_MXR_GAIN ", contains: " MATRIX_MXR_GAIN " }
    returns: ack
  get_matrix_gain:
    summary: "Matrix mixer: a crosspoint's gain (wire value, tenths of a dB offset by 1100)"
    params:
      input: { type: int, min: 0, max: 99, required: true }
      output: { type: int, min: 0, max: 99, required: true }
    send: "GET {input:02d} MATRIX_MXR_GAIN {output:02d}"
    expect: { reply_contains: " MATRIX_MXR_GAIN ", matches: " MATRIX_MXR_GAIN \\d+ ?(\\d{4}) *>$", convert: shure_gain }
    returns: value
  increase_matrix_gain:
    summary: "Matrix mixer: increase a crosspoint's gain by a step in tenths of a dB"
    params:
      input: { type: int, min: 0, max: 99, required: true }
      output: { type: int, min: 0, max: 99, required: true }
      step: { type: int, min: 1, max: 1400, required: true }
    send: "SET {input:02d} MATRIX_MXR_GAIN {output:02d} INC {step}"
    expect: { reply_contains: " MATRIX_MXR_GAIN ", contains: " MATRIX_MXR_GAIN " }
    returns: ack
  decrease_matrix_gain:
    summary: "Matrix mixer: decrease a crosspoint's gain by a step in tenths of a dB"
    params:
      input: { type: int, min: 0, max: 99, required: true }
      output: { type: int, min: 0, max: 99, required: true }
      step: { type: int, min: 1, max: 1400, required: true }
    send: "SET {input:02d} MATRIX_MXR_GAIN {output:02d} DEC {step}"
    expect: { reply_contains: " MATRIX_MXR_GAIN ", contains: " MATRIX_MXR_GAIN " }
    returns: ack
  get_peq_filter:
    summary: "Whether a PEQ filter is enabled (PEQ <block> <filter>)"
    params:
      block: { type: int, min: 0, max: 99, required: true }
      filter: { type: int, min: 0, max: 16, required: true }
    send: "GET {block:02d} PEQ {filter:02d}"
    expect: { reply_contains: " PEQ ", matches: " PEQ \\d+ (ON|OFF) *>$" }
    returns: value
  set_peq_filter:
    summary: "Enable, disable or toggle a PEQ filter (0: every block or filter)"
    params:
      block: { type: int, min: 0, max: 99, required: true }
      filter: { type: int, min: 0, max: 16, required: true }
      state: { type: enum, values: ["ON", "OFF", "TOGGLE"], required: true }
    send: "SET {block:02d} PEQ {filter:02d} {state}"
    expect: { reply_contains: " PEQ ", contains: " PEQ " }
    returns: ack

state:
  device.model: { type: string, description: "the model" }
  device.serial_number: { type: string, description: "the serial number" }
  device.firmware: { type: string, description: "the firmware version" }
  device.device_id: { type: string, description: "the device ID (name)" }
  device.ip_address: { type: string, description: "the primary audio network IP address" }
  device.subnet: { type: string, description: "the primary audio network subnet mask" }
  device.gateway: { type: string, description: "the primary audio network gateway" }
  device.na_device_name: { type: string, description: "the Dante device name" }
  device.mac_address: { type: string, description: "the control MAC address" }
  device.encryption: { type: bool, description: "audio encryption (on/true)" }
  device.usb_connected: { type: bool, description: "a USB host connected (on/true)" }
  device.preset: { type: int, description: "The preset last recalled, 1-10" }
  channels.*.name: { type: string, description: "a channel's name" }
  channels.*.mute: { type: bool, description: "a channel's mute (on/true)" }
  channels.*.gain: { type: float, unit: "dB", description: "A channel's digital gain, -110.0 to +30.0 dB (wire 0-1400 in tenths offset by 1100); set_gain takes tenths of a dB, -1100 to 300" }
  device.device_mute: { type: bool, description: "the device mute (on/true)" }
  channels.*.input_level: { type: string, description: "an analog input's level switch (11-12)" }
  channels.*.output_level: { type: string, description: "an analog output's level switch (17-18)" }
  device.led_brightness: { type: int, description: "the LED brightness (0 off, 1 dim, 2 default)" }
  device.input_meter_mode: { type: string, description: "the input meter tap" }
  device.output_meter_mode: { type: string, description: "the output meter tap" }
  device.meter_rate_in: { type: int, unit: "ms", description: "the input metering interval, ms (0: off; 1-99 refused)" }
  device.meter_rate_out: { type: int, unit: "ms", description: "the output metering interval, ms (0: off; 1-99 refused)" }
  device.meter_rate_proc: { type: int, unit: "ms", description: "the processing-block metering interval, ms (0: off; 1-99 refused)" }
  device.meter_rate_erle: { type: int, unit: "ms", description: "the AEC ERLE metering interval, ms (0: off; 1-99 refused)" }
  device.meter_rate_agc: { type: int, unit: "ms", description: "the AGC gain metering interval, ms (0: off; 1-99 refused)" }
  channels.*.aec: { type: bool, description: "the AEC of a Dante mic channel (01-08) (on/true)" }
  channels.*.aec_reference: { type: string, description: "the AEC reference source (channel 22)" }
  channels.*.aec_nlp: { type: string, description: "the AEC non-linear processing" }
  channels.*.noise_reduction: { type: bool, description: "noise reduction (on/true)" }
  channels.*.noise_reduction_level: { type: string, description: "the noise reduction level" }
  channels.*.agc: { type: bool, description: "automatic gain control (on/true)" }
  channels.*.agc_max_cut: { type: float, unit: "dB", description: "the AGC maximum cut, tenths of a dB (-200 to 0)" }
  channels.*.agc_max_boost: { type: float, unit: "dB", description: "the AGC maximum boost, tenths of a dB (0 to 200)" }
  channels.*.agc_target: { type: float, unit: "dBFS", description: "the AGC target, tenths of a dBFS (-500 to 0)" }
  channels.*.gate_inhibit: { type: bool, description: "the gate inhibit (channel 22; firmware before 4.1) (on/true)" }
  channels.*.automixer_mode: { type: string, description: "the automixer mode (channel 21)" }
  channels.*.automixer_off_attenuation: { type: float, unit: "dB", description: "the automixer off attenuation, dB (-110 to -3)" }
  channels.*.automixer_gate_sensitivity: { type: int, description: "the automixer gating sensitivity (1-9)" }
  channels.*.automixer_max_open: { type: int, description: "the automixer maximum number of open mics (1-8)" }
  channels.*.automixer_last_mic_lock: { type: bool, description: "the automixer last mic lock-on (on/true)" }
  channels.*.automixer_hold_time: { type: int, unit: "ms", description: "the automixer hold time, ms" }
  channels.*.automixer_always_on: { type: bool, description: "a channel always on in the automixer (on/true)" }
  channels.*.automixer_priority: { type: bool, description: "a channel's automixer priority (on/true)" }
  channels.*.automixer_mute: { type: bool, description: "the automixer post-gate mute (channel 21: the system mute) (on/true)" }
  channels.*.automixer_gate: { type: bool, description: "a channel's automixer gate (open) (on/true)" }
  channels.*.compressor: { type: bool, description: "the compressor (channel 21) (on/true)" }
  channels.*.compressor_threshold: { type: float, unit: "dB", description: "the compressor threshold, tenths of a dB (-600 to 0)" }
  channels.*.compressor_ratio: { type: float, description: "the compressor ratio in tenths (10 = 1.0:1 to 1000 = 100.0:1)" }
  channels.*.delay: { type: int, unit: "ms", description: "an output's delay, ms (0 off; channels 17-19)" }
  channels.*.direct_out_point: { type: int, description: "the direct output tap point (0 pre-gate/pre-processing, 1 pre-gate/post, 2 post-gate/pre, 3 post-gate/post; firmware 4.1 and later)" }
  device.call_status_enabled: { type: bool, description: "the call status feature (on/true)" }
  device.call_state: { type: string, description: "the call status (ONHOOK or OFFHOOK)" }
  matrix.*.*.routed: { type: bool, description: "Matrix mixer crosspoint routed, keyed by input then output channel" }
  matrix.*.*.gain: { type: float, unit: "dB", description: "Matrix mixer crosspoint gain, keyed by input then output channel" }
  peq.*.*.enabled: { type: bool, description: "A PEQ filter's enable, keyed by block then filter" }

telemetry:
  # Every parameter is reported once on connecting; after that the device
  # sends a REP whenever a value changes, so nothing is polled.
  poll:
    send: ["GET 00 ALL"]
  updates:
    - match: "^< REP MODEL \\{?(.*?) *\\}? >$"
      state: { "device.model": "{1}" }
    - match: "^< REP SERIAL_NUM \\{?(.*?) *\\}? >$"
      state: { "device.serial_number": "{1}" }
    - match: "^< REP FW_VER \\{?(.*?) *\\}? >$"
      state: { "device.firmware": "{1}" }
    - match: "^< REP DEVICE_ID \\{?(.*?) *\\}? >$"
      state: { "device.device_id": "{1}" }
    - match: "^< REP IP_ADDR_NET_AUDIO_PRIMARY \\{?(.*?) *\\}? >$"
      state: { "device.ip_address": "{1}" }
    - match: "^< REP IP_SUBNET_NET_AUDIO_PRIMARY \\{?(.*?) *\\}? >$"
      state: { "device.subnet": "{1}" }
    - match: "^< REP IP_GATEWAY_NET_AUDIO_PRIMARY \\{?(.*?) *\\}? >$"
      state: { "device.gateway": "{1}" }
    - match: "^< REP NA_DEVICE_NAME \\{?(.*?) *\\}? >$"
      state: { "device.na_device_name": "{1}" }
    - match: "^< REP CONTROL_MAC_ADDR \\{?(.*?) *\\}? >$"
      state: { "device.mac_address": "{1}" }
    - match: "^< REP ENCRYPTION (ON|OFF|On|Off) >$"
      state: { "device.encryption": { value: "{1}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP USB_CONNECT (ON|OFF|On|Off) >$"
      state: { "device.usb_connected": { value: "{1}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP PRESET (\\d+) >$"
      state: { "device.preset": "{1}" }
    - match: "^< REP (\\d+) CHAN_NAME \\{?(.*?) *\\}? >$"
      state: { "channels.{1}.name": "{2}" }
    - match: "^< REP (\\d+) AUDIO_MUTE (ON|OFF|On|Off) >$"
      state: { "channels.{1}.mute": { value: "{2}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) AUDIO_GAIN_HI_RES (\\d+) >$"
      state: { "channels.{1}.gain": "{2:from.shure_gain}" }
    - match: "^< REP DEVICE_AUDIO_MUTE (ON|OFF|On|Off) >$"
      state: { "device.device_mute": { value: "{1}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) AUDIO_IN_LVL_SWITCH \\{?(.*?) *\\}? >$"
      state: { "channels.{1}.input_level": "{2}" }
    - match: "^< REP (\\d+) AUDIO_OUT_LVL_SWITCH \\{?(.*?) *\\}? >$"
      state: { "channels.{1}.output_level": "{2}" }
    - match: "^< REP LED_BRIGHTNESS (-?\\d+) >$"
      state: { "device.led_brightness": "{1}" }
    - match: "^< REP INPUT_METER_MODE \\{?(.*?) *\\}? >$"
      state: { "device.input_meter_mode": "{1}" }
    - match: "^< REP OUTPUT_METER_MODE \\{?(.*?) *\\}? >$"
      state: { "device.output_meter_mode": "{1}" }
    - match: "^< REP METER_RATE_IN (-?\\d+) >$"
      state: { "device.meter_rate_in": "{1}" }
    - match: "^< REP METER_RATE_OUT (-?\\d+) >$"
      state: { "device.meter_rate_out": "{1}" }
    - match: "^< REP METER_RATE_PROC (-?\\d+) >$"
      state: { "device.meter_rate_proc": "{1}" }
    - match: "^< REP METER_RATE_ERLE (-?\\d+) >$"
      state: { "device.meter_rate_erle": "{1}" }
    - match: "^< REP METER_RATE_AGC (-?\\d+) >$"
      state: { "device.meter_rate_agc": "{1}" }
    - match: "^< REP (\\d+) AEC (ON|OFF|On|Off) >$"
      state: { "channels.{1}.aec": { value: "{2}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) AEC_REF \\{?(.*?) *\\}? >$"
      state: { "channels.{1}.aec_reference": "{2}" }
    - match: "^< REP (\\d+) AEC_NLP \\{?(.*?) *\\}? >$"
      state: { "channels.{1}.aec_nlp": "{2}" }
    - match: "^< REP (\\d+) NOISE_RED (ON|OFF|On|Off) >$"
      state: { "channels.{1}.noise_reduction": { value: "{2}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) NOISE_RED_LVL \\{?(.*?) *\\}? >$"
      state: { "channels.{1}.noise_reduction_level": "{2}" }
    - match: "^< REP (\\d+) AGC (ON|OFF|On|Off) >$"
      state: { "channels.{1}.agc": { value: "{2}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) AGC_MAX_CUT (\\d+) >$"
      state: { "channels.{1}.agc_max_cut": "{2:from.shure_agc_cut}" }
    - match: "^< REP (\\d+) AGC_MAX_BOOST (\\d+) >$"
      state: { "channels.{1}.agc_max_boost": "{2:from.shure_agc_boost}" }
    - match: "^< REP (\\d+) AGC_TARGET (\\d+) >$"
      state: { "channels.{1}.agc_target": "{2:from.shure_agc_target}" }
    - match: "^< REP (\\d+) GATE_INHIBIT (ON|OFF|On|Off) >$"
      state: { "channels.{1}.gate_inhibit": { value: "{2}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) AUTOMXR_MODE \\{?(.*?) *\\}? >$"
      state: { "channels.{1}.automixer_mode": "{2}" }
    - match: "^< REP (\\d+) AUTOMXR_OFF_ATT (\\d+) >$"
      state: { "channels.{1}.automixer_off_attenuation": "{2:from.shure_off_att}" }
    - match: "^< REP (\\d+) AUTOMXR_GATE_SEN (-?\\d+) >$"
      state: { "channels.{1}.automixer_gate_sensitivity": "{2}" }
    - match: "^< REP (\\d+) AUTOMXR_MAX_NOM (-?\\d+) >$"
      state: { "channels.{1}.automixer_max_open": "{2}" }
    - match: "^< REP (\\d+) AUTOMXR_LMLO (ON|OFF|On|Off) >$"
      state: { "channels.{1}.automixer_last_mic_lock": { value: "{2}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) AUTOMXR_HOLDTIME (-?\\d+) >$"
      state: { "channels.{1}.automixer_hold_time": "{2}" }
    - match: "^< REP (\\d+) AUTOMXR_ALWAYS_ON (ON|OFF|On|Off) >$"
      state: { "channels.{1}.automixer_always_on": { value: "{2}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) AUTOMXR_PRIORITY (ON|OFF|On|Off) >$"
      state: { "channels.{1}.automixer_priority": { value: "{2}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) AUTOMXR_MUTE (ON|OFF|On|Off) >$"
      state: { "channels.{1}.automixer_mute": { value: "{2}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) AUTOMXR_GATE (ON|OFF|On|Off) >$"
      state: { "channels.{1}.automixer_gate": { value: "{2}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) COMPRESSOR (ON|OFF|On|Off) >$"
      state: { "channels.{1}.compressor": { value: "{2}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) COMP_THRESHOLD (\\d+) >$"
      state: { "channels.{1}.compressor_threshold": "{2:from.shure_comp_threshold}" }
    - match: "^< REP (\\d+) COMP_RATIO (\\d+) >$"
      state: { "channels.{1}.compressor_ratio": "{2:from.shure_comp_ratio}" }
    - match: "^< REP (\\d+) DELAY (-?\\d+) >$"
      state: { "channels.{1}.delay": "{2}" }
    - match: "^< REP (\\d+) DIRECTOUT_POINT (-?\\d+) >$"
      state: { "channels.{1}.direct_out_point": "{2}" }
    - match: "^< REP ONHOOK_ENABLE (ON|OFF|On|Off) >$"
      state: { "device.call_status_enabled": { value: "{1}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP ONHOOK_STATE \\{?(.*?) *\\}? >$"
      state: { "device.call_state": "{1}" }
    - match: "^< REP (\\d+) MATRIX_MXR_ROUTE (\\d+) (ON|OFF) >$"
      state: { "matrix.{1}.{2}.routed": { value: "{3}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }
    - match: "^< REP (\\d+) MATRIX_MXR_GAIN (\\d+) ?(\\d{4}) >$"
      state: { "matrix.{1}.{2}.gain": "{3:from.shure_gain}" }
    - match: "^< REP (\\d+) PEQ (\\d+) (ON|OFF) >$"
      state: { "peq.{1}.{2}.enabled": { value: "{3}", map: { "ON": true, "OFF": false, "On": true, "Off": false, "on": true, "off": false } } }

quirks:
  - models: [all]
    severity: info
    text: >
      Commands are matched to their REP by the parameter name, not by the channel: a change to the
      same parameter on another channel arriving in the same moment could be taken for the answer.
      An error answer is < REP ERR >, which names nothing; it fails the command waiting.
  - models: [all]
    severity: info
    text: >
      Text values (names, model, serial number, addresses) are padded with spaces to a fixed width,
      sometimes in braces; the spaces and braces are removed. Channel 0 (or 00) means every channel,
      answered with one REP per channel.
  - models: [all]
    severity: info
    text: >
      Gains are sent and reported in tenths of a dB offset by 1100 (0000-1400 = -110.0 to +30.0 dB);
      set commands take tenths of a dB (-1100 to 300), and state holds dB. Increase and decrease
      steps are in tenths of a dB.
  - models: [all]
    severity: info
    text: >
      Metering (METER_RATE and its siblings) sends SAMPLE messages at the chosen interval until set
      to 0; it is never started here, and SAMPLE values (000-060 = -60 to 0 dBFS) are not kept in
      state. Values 1-99 ms are refused by the device.
  - models: [all]
    severity: info
    text: >
      On connecting the session sends one GET ALL; the device answers with a REP for every
      parameter, and thereafter reports every change unasked, so state stays current without
      polling. Opened for commands only, the GET ALL is not sent.
  - models: [all]
    severity: info
    text: >
      get_parameter, set_parameter, get_device_parameter and set_device_parameter reach any
      parameter the command-string document lists, with the value in the document's form, for those
      not given a command of their own.
  - models: [all]
    severity: critical
    text: >
      recall_preset replaces the device's whole configuration with the preset's, live, and cannot be
      undone except by recalling another preset.
  - models: [all]
    severity: critical
    text: >
      restore_defaults erases the device's configuration (presets aside) and cannot be undone;
      reboot restarts the device, interrupting its audio, and is not acknowledged.
  - models: [all]
    severity: info
    text: >
      AUTOMXR_MUTE on channel 21 is the system mute Shure recommends for conferencing (mute after
      the AEC, not at the microphones).
  - models: [all]
    severity: info
    text: >
      GATE_INHIBIT works only on firmware before 4.1; channels 23-28 (Dante outputs 3-8) need
      firmware 4.1 or later.
