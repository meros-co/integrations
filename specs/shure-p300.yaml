spec: 1
id: shure-p300
name: "Shure P300 IntelliMix Audio Conferencing Processor"
vendor: Shure
category: mixer

# Written from Shure's P300 command strings. The channel numbers are the
# P300's (document p.3-4): 01-08 Dante mic inputs, 09-10 Dante inputs, 11-12
# analog inputs, 13 USB in, 14 mobile in, 15-16 Dante outputs 1-2, 17-18
# analog outputs, 19 USB out, 20 mobile out, 21 automixer output, 22 AEC
# reference, 23-28 Dante outputs 3-8 (firmware 4.1 and later); 00 is all.
source:
  - title: "P300 Command Strings, Version 4.4 (2024-D)"
    author: Shure Incorporated
    url: "https://pubs.shure.com/command-strings/P300/en-US"
    note: >
      Manufacturer document, also as a PDF at
      https://pubs2-api.prod.shureweb.eu/documents/public/download/7171.pdf . TCP 2202; GET, SET,
      REP and SAMPLE; REP sent on change; channel table p.3-4; common commands p.5-41 (GET ALL,
      MODEL, SERIAL_NUM, CHAN_NAME, DEVICE_ID, FW_VER, PRESET and PRESET1-10, AUDIO_GAIN_HI_RES with
      INC/DEC, input and output level switches, AUDIO_MUTE, DEVICE_AUDIO_MUTE, FLASH, metering,
      LED_BRIGHTNESS, network, ENCRYPTION, REBOOT, PEQ, meter modes, USB_CONNECT, matrix routing and
      gain, CONTROL_MAC_ADDR, NA names, DEFAULT_SETTINGS, AEC, AEC_REF, ERLE metering, AEC_NLP,
      NOISE_RED, AGC, gate inhibit, automixer, compressor, delay, direct out tap point, call
      status).

transport:
  type: line-tcp
  port: 2202
  framing: delimited
  open: "< "
  close: " >"
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # Answers and change reports are both REP; SAMPLE (metering) never answers.
  # Commands name the parameter their REP carries (expect.reply_contains), so
  # a change pushed meanwhile is never taken for an answer.
  reply_match: "^< REP "
  error_match: "^< REP ERR"
  probe: "GET MODEL"

conversions:
  # AGC maximum boost: tenths of a dB (0-200 = 0.0 to +20.0 dB)
  shure_agc_boost:
    points: [[0, 0.0], [200, 20.0]]
  # AGC maximum cut: tenths of a dB offset by 200 (0-200 = -20.0 to 0.0 dB)
  shure_agc_cut:
    points: [[0, -20.0], [200, 0.0]]
  # AGC target: tenths of a dBFS offset by 500 (0-500 = -50.0 to 0.0 dBFS)
  shure_agc_target:
    points: [[0, -50.0], [500, 0.0]]
  # compressor ratio: tenths (0010-1000 = 1.0:1 to 100.0:1)
  shure_comp_ratio:
    points: [[10, 1.0], [1000, 100.0]]
  # compressor threshold: tenths of a dB offset by 600 (0-600 = -60.0 to 0.0 dB)
  shure_comp_threshold:
    points: [[0, -60.0], [600, 0.0]]
  # AUDIO_GAIN_HI_RES and similar: tenths of a dB offset by 1100 (0-1400 = -110.0 to +30.0 dB)
  shure_gain:
    points: [[0, -110.0], [1400, 30.0]]
  # automixer off attenuation: dB offset by 110 (0-107 = -110 to -3 dB)
  shure_off_att:
    points: [[0, -110.0], [107, -3.0]]

models:
  - id: p300
    name: "Shure P300 IntelliMix Audio Conferencing Processor"
    supports:
      - get_model
      - get_serial_number
      - get_firmware
      - get_device_id
      - get_ip_address
      - get_subnet
      - get_gateway
      - get_na_device_name
      - get_mac_address
      - get_encryption
      - get_usb_connected
      - get_preset
      - recall_preset
      - get_preset_name
      - flash
      - reboot
      - restore_defaults
      - get_all
      - get_parameter
      - set_parameter
      - get_device_parameter
      - set_device_parameter
      - get_name
      - get_mute
