commands:
  get_model:
    summary: "Read the model (MODEL)"
    send: "GET MODEL"
    expect: { reply_contains: " MODEL ", matches: " MODEL \\{?(.*?) *\\}? *>$" }
    returns: value
  get_serial_number:
    summary: "Read the serial number (SERIAL_NUM)"
    send: "GET SERIAL_NUM"
    expect: { reply_contains: " SERIAL_NUM ", matches: " SERIAL_NUM \\{?(.*?) *\\}? *>$" }
    returns: value
  get_firmware:
    summary: "Read the firmware version (FW_VER)"
    send: "GET FW_VER"
    expect: { reply_contains: " FW_VER ", matches: " FW_VER \\{?(.*?) *\\}? *>$" }
    returns: value
  get_device_id:
    summary: "Read the device ID (name) (DEVICE_ID)"
    send: "GET DEVICE_ID"
    expect: { reply_contains: " DEVICE_ID ", matches: " DEVICE_ID \\{?(.*?) *\\}? *>$" }
    returns: value
  get_ip_address:
    summary: "Read the primary audio network IP address (IP_ADDR_NET_AUDIO_PRIMARY)"
    send: "GET IP_ADDR_NET_AUDIO_PRIMARY"
    expect: { reply_contains: " IP_ADDR_NET_AUDIO_PRIMARY ", matches: " IP_ADDR_NET_AUDIO_PRIMARY \\{?(.*?) *\\}? *>$" }
    returns: value
  get_subnet:
    summary: "Read the primary audio network subnet mask (IP_SUBNET_NET_AUDIO_PRIMARY)"
    send: "GET IP_SUBNET_NET_AUDIO_PRIMARY"
    expect: { reply_contains: " IP_SUBNET_NET_AUDIO_PRIMARY ", matches: " IP_SUBNET_NET_AUDIO_PRIMARY \\{?(.*?) *\\}? *>$" }
    returns: value
  get_gateway:
    summary: "Read the primary audio network gateway (IP_GATEWAY_NET_AUDIO_PRIMARY)"
    send: "GET IP_GATEWAY_NET_AUDIO_PRIMARY"
    expect: { reply_contains: " IP_GATEWAY_NET_AUDIO_PRIMARY ", matches: " IP_GATEWAY_NET_AUDIO_PRIMARY \\{?(.*?) *\\}? *>$" }
    returns: value
  get_na_device_name:
    summary: "Read the Dante device name (NA_DEVICE_NAME)"
    send: "GET NA_DEVICE_NAME"
    expect: { reply_contains: " NA_DEVICE_NAME ", matches: " NA_DEVICE_NAME \\{?(.*?) *\\}? *>$" }
    returns: value
  get_mac_address:
    summary: "Read the control MAC address (CONTROL_MAC_ADDR)"
    send: "GET CONTROL_MAC_ADDR"
    expect: { reply_contains: " CONTROL_MAC_ADDR ", matches: " CONTROL_MAC_ADDR \\{?(.*?) *\\}? *>$" }
    returns: value
  get_encryption:
    summary: "Read audio encryption (ENCRYPTION)"
    send: "GET ENCRYPTION"
    expect: { reply_contains: " ENCRYPTION ", matches: " ENCRYPTION \\{?(.*?) *\\}? *>$" }
    returns: value
  get_usb_connected:
    summary: "Read a USB host connected (USB_CONNECT)"
    send: "GET USB_CONNECT"
    expect: { reply_contains: " USB_CONNECT ", matches: " USB_CONNECT \\{?(.*?) *\\}? *>$" }
    returns: value
  get_preset:
    summary: "The preset last recalled (PRESET), 1-10"
    send: "GET PRESET"
    expect: { reply_contains: " PRESET ", matches: " PRESET \\{?(.*?) *\\}? *>$" }
    returns: value
  recall_preset:
    summary: "Recall a preset (SET PRESET), 1-10"
    params:
      preset: { type: int, min: 1, max: 10, required: true }
    send: "SET PRESET {preset:02d}"
    expect: { reply_contains: " PRESET ", contains: " PRESET " }
    returns: ack
  get_preset_name:
    summary: "A preset's name (PRESET1-PRESET10)"
    params:
      preset: { type: int, min: 1, max: 10, required: true }
    send: "GET PRESET{preset}"
    expect: { reply_contains: " PRESET", matches: " PRESET\\d+ \\{?(.*?) *\\}? *>$" }
    returns: value
  flash:
    summary: "Flash the device's lights to identify it (FLASH); it stops by itself after about 30 s"
    params:
      enabled: { type: bool, default: true }
    send: "SET FLASH {enabled:on_off}"
    expect: { reply_contains: " FLASH ", contains: " FLASH " }
    returns: ack
  reboot:
    summary: "Reboot the device (SET REBOOT); not acknowledged"
    send: "SET REBOOT"
    returns: none
  restore_defaults:
    summary: "Restore default settings (SET DEFAULT_SETTINGS)"
    send: "SET DEFAULT_SETTINGS"
    expect: { reply_contains: "DEFAULT_SETTINGS", contains: "DEFAULT_SETTINGS" }
    returns: ack
  get_all:
    summary: "Ask for every parameter of a channel (0: the device and all channels); the answers update state"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
    send: "GET {channel:02d} ALL"
    returns: none
  get_parameter:
    summary: "Read any documented channel parameter by name (GET <channel> <PARAM>), returning its value text"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
      parameter: { type: string, pattern: "^[A-Z][A-Z0-9_]*$", max_length: 40, required: true }
    send: "GET {channel:02d} {parameter}"
    expect: { reply_contains: " {parameter} ", matches: "^< REP (?:\\d+ )?[A-Z][A-Z0-9_]* \\{?(.*?) *\\}? *>$" }
    returns: value
  set_parameter:
    summary: "Set any documented channel parameter by name (SET <channel> <PARAM> <value>), the value in the document's form"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
      parameter: { type: string, pattern: "^[A-Z][A-Z0-9_]*$", max_length: 40, required: true }
      value: { type: string, pattern: "^[^<>]+$", max_length: 64, required: true }
    send: "SET {channel:02d} {parameter} {value}"
    expect: { reply_contains: " {parameter} ", not_contains: "REP ERR" }
    returns: ack
  get_device_parameter:
    summary: "Read any documented device parameter by name (GET <PARAM>)"
    params:
      parameter: { type: string, pattern: "^[A-Z][A-Z0-9_]*$", max_length: 40, required: true }
    send: "GET {parameter}"
    expect: { reply_contains: " {parameter} ", matches: "^< REP (?:\\d+ )?[A-Z][A-Z0-9_]* \\{?(.*?) *\\}? *>$" }
    returns: value
  set_device_parameter:
    summary: "Set any documented device parameter by name (SET <PARAM> <value>)"
    params:
      parameter: { type: string, pattern: "^[A-Z][A-Z0-9_]*$", max_length: 40, required: true }
      value: { type: string, pattern: "^[^<>]+$", max_length: 128, required: true }
    send: "SET {parameter} {value}"
    expect: { reply_contains: " {parameter} ", not_contains: "REP ERR" }
    returns: ack
  get_name:
    summary: "Read a channel's name (CHAN_NAME)"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
    send: "GET {channel:02d} CHAN_NAME"
    expect: { reply_contains: " CHAN_NAME ", matches: " CHAN_NAME \\{?(.*?) *\\}? *>$" }
    returns: value
  get_mute:
    summary: "Read a channel's mute (AUDIO_MUTE)"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
    send: "GET {channel:02d} AUDIO_MUTE"
    expect: { reply_contains: " AUDIO_MUTE ", matches: " AUDIO_MUTE \\{?(.*?) *\\}? *>$" }
    returns: value
  set_mute:
    summary: "Turn a channel's mute on or off (AUDIO_MUTE)"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
      muted: { type: bool, default: true }
    send: "SET {channel:02d} AUDIO_MUTE {muted:on_off}"
    expect: { reply_contains: " AUDIO_MUTE ", contains: " AUDIO_MUTE " }
    returns: ack
  toggle_mute:
    summary: "Toggle a channel's mute (AUDIO_MUTE TOGGLE)"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
    send: "SET {channel:02d} AUDIO_MUTE TOGGLE"
    expect: { reply_contains: " AUDIO_MUTE ", contains: " AUDIO_MUTE " }
    returns: ack
  get_gain:
    summary: "Read a channel's digital gain (AUDIO_GAIN_HI_RES)"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
    send: "GET {channel:02d} AUDIO_GAIN_HI_RES"
    expect: { reply_contains: " AUDIO_GAIN_HI_RES ", matches: " AUDIO_GAIN_HI_RES \\{?(.*?) *\\}? *>$" }
    returns: value
  set_gain:
    summary: "Set a channel's digital gain (AUDIO_GAIN_HI_RES), dB"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
      gain_tenth_db: { type: int, min: -1100, max: 300, required: true }
    send: "SET {channel:02d} AUDIO_GAIN_HI_RES {gain_tenth_db:+1100:04d}"
    expect: { reply_contains: " AUDIO_GAIN_HI_RES ", contains: " AUDIO_GAIN_HI_RES " }
    returns: ack
  increase_gain:
    summary: "Increase a channel's digital gain by a step (AUDIO_GAIN_HI_RES INC)"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
      step: { type: int, min: 1, max: 1400, required: true }
    send: "SET {channel:02d} AUDIO_GAIN_HI_RES INC {step}"
    expect: { reply_contains: " AUDIO_GAIN_HI_RES ", contains: " AUDIO_GAIN_HI_RES " }
    returns: ack
  decrease_gain:
    summary: "Decrease a channel's digital gain by a step (AUDIO_GAIN_HI_RES DEC)"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
      step: { type: int, min: 1, max: 1400, required: true }
    send: "SET {channel:02d} AUDIO_GAIN_HI_RES DEC {step}"
    expect: { reply_contains: " AUDIO_GAIN_HI_RES ", contains: " AUDIO_GAIN_HI_RES " }
    returns: ack
  get_device_mute:
    summary: "Read the device mute (DEVICE_AUDIO_MUTE)"
    send: "GET DEVICE_AUDIO_MUTE"
    expect: { reply_contains: " DEVICE_AUDIO_MUTE ", matches: " DEVICE_AUDIO_MUTE \\{?(.*?) *\\}? *>$" }
    returns: value
  set_device_mute:
    summary: "Turn the device mute on or off (DEVICE_AUDIO_MUTE)"
    params:
      muted: { type: bool, default: true }
    send: "SET DEVICE_AUDIO_MUTE {muted:on_off}"
    expect: { reply_contains: " DEVICE_AUDIO_MUTE ", contains: " DEVICE_AUDIO_MUTE " }
    returns: ack
  toggle_device_mute:
    summary: "Toggle the device mute (DEVICE_AUDIO_MUTE TOGGLE)"
    send: "SET DEVICE_AUDIO_MUTE TOGGLE"
    expect: { reply_contains: " DEVICE_AUDIO_MUTE ", contains: " DEVICE_AUDIO_MUTE " }
    returns: ack
  get_input_level:
    summary: "Read an analog input's level switch (11-12) (AUDIO_IN_LVL_SWITCH)"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
    send: "GET {channel:02d} AUDIO_IN_LVL_SWITCH"
    expect: { reply_contains: " AUDIO_IN_LVL_SWITCH ", matches: " AUDIO_IN_LVL_SWITCH \\{?(.*?) *\\}? *>$" }
    returns: value
  set_input_level:
    summary: "Set an analog input's level switch (11-12) (AUDIO_IN_LVL_SWITCH)"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
      value: { type: enum, values: ["LINE_LVL", "AUX_LVL"], required: true }
    send: "SET {channel:02d} AUDIO_IN_LVL_SWITCH {value}"
    expect: { reply_contains: " AUDIO_IN_LVL_SWITCH ", contains: " AUDIO_IN_LVL_SWITCH " }
    returns: ack
  get_output_level:
    summary: "Read an analog output's level switch (17-18) (AUDIO_OUT_LVL_SWITCH)"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
    send: "GET {channel:02d} AUDIO_OUT_LVL_SWITCH"
    expect: { reply_contains: " AUDIO_OUT_LVL_SWITCH ", matches: " AUDIO_OUT_LVL_SWITCH \\{?(.*?) *\\}? *>$" }
    returns: value
  set_output_level:
    summary: "Set an analog output's level switch (17-18) (AUDIO_OUT_LVL_SWITCH)"
    params:
      channel: { type: int, min: 0, max: 99, required: true }
      value: { type: enum, values: ["LINE_LVL", "AUX_LVL", "MIC_LVL"], required: true }
    send: "SET {channel:02d} AUDIO_OUT_LVL_SWITCH {value}"
    expect: { reply_contains: " AUDIO_OUT_LVL_SWITCH ", contains: " AUDIO_OUT_LVL_SWITCH " }
    returns: ack
  get_led_brightness:
    summary: "Read the LED brightness (0 off, 1 dim, 2 default) (LED_BRIGHTNESS)"
    send: "GET LED_BRIGHTNESS"
    expect: { reply_contains: " LED_BRIGHTNESS ", matches: " LED_BRIGHTNESS \\{?(.*?) *\\}? *>$" }
    returns: value
  set_led_brightness:
    summary: "Set the LED brightness (0 off, 1 dim, 2 default) (LED_BRIGHTNESS)"
    params:
      value: { type: int, min: 0, max: 2, required: true }
    send: "SET LED_BRIGHTNESS {value}"
    expect: { reply_contains: " LED_BRIGHTNESS ", contains: " LED_BRIGHTNESS " }
    returns: ack
  get_input_meter_mode:
    summary: "Read the input meter tap (INPUT_METER_MODE)"
    send: "GET INPUT_METER_MODE"
    expect: { reply_contains: " INPUT_METER_MODE ", matches: " INPUT_METER_MODE \\{?(.*?) *\\}? *>$" }
    returns: value
  set_input_meter_mode:
    summary: "Set the input meter tap (INPUT_METER_MODE)"
    params:
      value: { type: enum, values: ["PRE_FADER", "POST_FADER"], required: true }
    send: "SET INPUT_METER_MODE {value}"
    expect: { reply_contains: " INPUT_METER_MODE ", contains: " INPUT_METER_MODE " }
    returns: ack
  get_output_meter_mode:
    summary: "Read the output meter tap (OUTPUT_METER_MODE)"
    send: "GET OUTPUT_METER_MODE"
    expect: { reply_contains: " OUTPUT_METER_MODE ", matches: " OUTPUT_METER_MODE \\{?(.*?) *\\}? *>$" }
    returns: value
  set_output_meter_mode:
    summary: "Set the output meter tap (OUTPUT_METER_MODE)"
    params:
      value: { type: enum, values: ["PRE_FADER", "POST_FADER"], required: true }
    send: "SET OUTPUT_METER_MODE {value}"
    expect: { reply_contains: " OUTPUT_METER_MODE ", contains: " OUTPUT_METER_MODE " }
    returns: ack
  get_meter_rate_in:
    summary: "Read the input metering interval, ms (0: off; 1-99 refused) (METER_RATE_IN)"
    send: "GET METER_RATE_IN"
    expect: { reply_contains: " METER_RATE_IN ", matches: " METER_RATE_IN \\{?(.*?) *\\}? *>$" }
    returns: value
  set_meter_rate_in:
    summary: "Set the input metering interval, ms (0: off; 1-99 refused) (METER_RATE_IN), ms"
    params:
      rate_ms: { type: int, min: 0, max: 99999, required: true }
    send: "SET METER_RATE_IN {rate_ms:05d}"
    expect: { reply_contains: " METER_RATE_IN ", contains: " METER_RATE_IN " }
    returns: ack
  get_meter_rate_out:
    summary: "Read the output metering interval, ms (0: off; 1-99 refused) (METER_RATE_OUT)"
    send: "GET METER_RATE_OUT"
    expect: { reply_contains: " METER_RATE_OUT ", matches: " METER_RATE_OUT \\{?(.*?) *\\}? *>$" }
    returns: value
  set_meter_rate_out:
    summary: "Set the output metering interval, ms (0: off; 1-99 refused) (METER_RATE_OUT), ms"
    params:
      rate_ms: { type: int, min: 0, max: 99999, required: true }
    send: "SET METER_RATE_OUT {rate_ms:05d}"
    expect: { reply_contains: " METER_RATE_OUT ", contains: " METER_RATE_OUT " }
    returns: ack
  get_meter_rate_proc:
    summary: "Read the processing-block metering interval, ms (0: off; 1-99 refused) (METER_RATE_PROC)"
    send: "GET METER_RATE_PROC"
    expect: { reply_contains: " METER_RATE_PROC ", matches: " METER_RATE_PROC \\{?(.*?) *\\}? *>$" }
    returns: value
  set_meter_rate_proc:
    summary: "Set the processing-block metering interval, ms (0: off; 1-99 refused) (METER_RATE_PROC), ms"
    params:
      rate_ms: { type: int, min: 0, max: 99999, required: true }
    send: "SET METER_RATE_PROC {rate_ms:05d}"
    expect: { reply_contains: " METER_RATE_PROC ", contains: " METER_RATE_PROC " }
    returns: ack
  get_meter_rate_erle:
    summary: "Read the AEC ERLE metering interval, ms (0: off; 1-99 refused) (METER_RATE_ERLE)"
    send: "GET METER_RATE_ERLE"
    expect: { reply_contains: " METER_RATE_ERLE ", matches: " METER_RATE_ERLE \\{?(.*?) *\\}? *>$" }
    returns: value
  set_meter_rate_erle:
    summary: "Set the AEC ERLE metering interval, ms (0: off; 1-99 refused) (METER_RATE_ERLE), ms"
    params:
      rate_ms: { type: int, min: 0, max: 99999, required: true }
    send: "SET METER_RATE_ERLE {rate_ms:05d}"
    expect: { reply_contains: " METER_RATE_ERLE ", contains: " METER_RATE_ERLE " }
