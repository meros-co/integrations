    # The UDP sections share their fields; the section is named by the reply.
    - path: '^/api/v2\.0/channels/([^/]+)/publishers/([^/]+)/settings$'
      json_match: { "$.status": "^ok$", "$.result.type": "^(rtp-udp|mpegts-udp|mpegts-rtp)$" }
