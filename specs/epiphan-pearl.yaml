    - path: '^/api/v2\.0/schedule/events(/[^/]+)?$'
      json_match: { "$.status": "^ok$", "$.result.id": "." }
      json: { id: "$.result.id", st: "$.result.status", title: "$.result.title", start: "$.result.start",
              finish: "$.result.finish", tags: "$.result.tags" }
      state:
