        adhoc_session.expired: "{expired}"
    # ── System ──
    - path: '^/api/v2\.0/system/status$'
      json_match: { "$.status": "^ok$" }
      json: { date: "$.result.date", uptime: "$.result.uptime", load: "$.result.cpuload", high: "$.result.cpuload_high",
              temp: "$.result.cputemp", threshold: "$.result.cputemp_threshold" }
      state:
        system.date: "{date}"
        system.uptime: "{uptime}"
        system.cpuload: "{load}"
        system.cpuload_high: "{high}"
        system.cputemp: "{temp}"
        system.cputemp_threshold: "{threshold}"
    - path: '^/api/v2\.0/system/firmware$'
      json_match: { "$.status": "^ok$" }
      json: { version: "$.result.version", revision: "$.result.revision", id: "$.result.product_id", name: "$.result.product_name" }
      state:
        firmware.version: "{version}"
        firmware.revision: "{revision}"
        firmware.product_id: "{id}"
        firmware.product_name: "{name}"
    - path: '^/api/v2\.0/system/firmware/(version|revision|product_id|product_name)$'
      json_match: { "$.status": "^ok$" }
      json: { value: "$.result" }
      state: { "firmware.{1}": "{value}" }
    - path: '^/api/v2\.0/system/ident$'
      json_match: { "$.status": "^ok$" }
      json: { name: "$.result.name", location: "$.result.location", description: "$.result.description" }
      state:
        ident.name: "{name}"
        ident.location: "{location}"
        ident.description: "{description}"
    - path: '^/api/v2\.0/system/connectivity/details$'
      json_match: { "$.status": "^ok$" }
      json: { ip: "$.result.external_ip", mdns: "$.result.mdns", dns: "$.result.dns", http: "$.result.http",
              https: "$.result.https", portal: "$.result.captive_portal", icmp: "$.result.icmp",
              edge: "$.result.epiphan_edge", vtun: "$.result.vtun" }
      state:
        connectivity.external_ip: "{ip}"
        connectivity.mdns: "{mdns}"
        connectivity.dns: "{dns}"
        connectivity.http: "{http}"
        connectivity.https: "{https}"
        connectivity.captive_portal: "{portal}"
        connectivity.icmp: "{icmp}"
        connectivity.epiphan_edge: "{edge}"
        connectivity.vtun: "{vtun}"
    - path: '^/api/v2\.0/system/connectivity/tools/speedtest(\?.*)?$'
      json_match: { "$.status": "^ok$" }
      json: { protocol: "$.result.protocol", mode: "$.result.mode", bandwidth: "$.result.bandwidth",
              limit: "$.result.bitrate_limit", duration: "$.result.duration", loss: "$.result.udp.loss" }
      replace: speedtest
      state:
        speedtest.protocol: "{protocol}"
        speedtest.mode: "{mode}"
        speedtest.bandwidth: "{bandwidth}"
        speedtest.bitrate_limit: "{limit}"
        speedtest.duration: "{duration}"
        speedtest.udp_loss: "{loss}"
    # Single Touch: the list names each control, whose state is then read.
    - path: '^/api/v2\.0/system/singletouchcontrol$'
      json_match: { "$.status": "^ok$" }
      json_each: "$.result"
      json: { id: "$.id" }
      then_send: [{ method: GET, path: "/api/v2.0/system/singletouchcontrol/{id}/state" }]
    - path: '^/api/v2\.0/system/singletouchcontrol/([^/]+)/state$'
      json_match: { "$.status": "^ok$" }
      json: { pressed: "$.result.pressed", ok: "$.result.status",
              r_total: "$.result.recorders.total", r_active: "$.result.recorders.active", r_success: "$.result.recorders.success",
              p_total: "$.result.publishers.total", p_active: "$.result.publishers.active", p_success: "$.result.publishers.success" }
      state:
        "single_touch.{1:key}.pressed": "{pressed}"
        "single_touch.{1:key}.status": "{ok}"
        "single_touch.{1:key}.recorders.total": "{r_total}"
        "single_touch.{1:key}.recorders.active": "{r_active}"
        "single_touch.{1:key}.recorders.success": "{r_success}"
        "single_touch.{1:key}.publishers.total": "{p_total}"
        "single_touch.{1:key}.publishers.active": "{p_active}"
        "single_touch.{1:key}.publishers.success": "{p_success}"
    - path: '^/api/v2\.0/system/presets\?details=true$'
      json_match: { "$.status": "^ok$" }
      json_each: "$.result"
      json: { name: "$.name", description: "$.description", hash: "$.hash", size: "$.size", readonly: "$.readonly" }
      replace: presets
      state:
        "presets.{name:key}.description": "{description}"
        "presets.{name:key}.hash": "{hash}"
        "presets.{name:key}.size": "{size}"
        "presets.{name:key}.readonly": "{readonly}"
    - path: '^/api/v2\.0/system/presets\?details=true$'
      json_match: { "$.status": "^ok$" }
      json_each: "$.result[*].sections"
      json: { name: "$^.name", section: "$" }
      state: { "presets.{name:key}.sections.{index}": "{section}" }
    # Storages: the list names each, whose status is then read; transfer
    # progress only for the external drive (main answers 405).
    - path: '^/api/v2\.0/system/storages$'
      json_match: { "$.status": "^ok$" }
      json_each: "$.result"
      json: { id: "$.id" }
      then_send: [{ method: GET, path: "/api/v2.0/system/storages/{id}/status" }]
    - path: '^/api/v2\.0/system/storages$'
      json_match: { "$.status": "^ok$" }
      json_each: "$.result"
      each_match: { "$.id": "^external$" }
      json: { id: "$.id" }
      then_send: [{ method: GET, path: "/api/v2.0/system/storages/{id}/transfer/status" }]
    - path: '^/api/v2\.0/system/storages/([^/]+)/status$'
      json_match: { "$.status": "^ok$" }
      json: { st: "$.result.state", total: "$.result.total", free: "$.result.free" }
      state:
        "storages.{1:key}.state": "{st}"
        "storages.{1:key}.total": "{total}"
        "storages.{1:key}.free": "{free}"
    - path: '^/api/v2\.0/system/storages/([^/]+)/transfer/status(\?.*)?$'
      json_match: { "$.status": "^ok$" }
      json: { st: "$.result.state", started: "$.result.session.started", completed: "$.result.session.completed",
              total_count: "$.result.session.total.count", total_size: "$.result.session.total.size",
              done_count: "$.result.session.processed.count", done_size: "$.result.session.processed.size",
              s_state: "$.result.storage.state", s_total: "$.result.storage.total", s_free: "$.result.storage.free" }
      replace: "storages.{1:key}.transfer"
      state:
        "storages.{1:key}.transfer.state": "{st}"
        "storages.{1:key}.transfer.started": "{started}"
        "storages.{1:key}.transfer.completed": "{completed}"
        "storages.{1:key}.transfer.total_count": "{total_count}"
        "storages.{1:key}.transfer.total_size": "{total_size}"
        "storages.{1:key}.transfer.processed_count": "{done_count}"
        "storages.{1:key}.transfer.processed_size": "{done_size}"
        "storages.{1:key}.state": "{s_state}"
        "storages.{1:key}.total": "{s_total}"
        "storages.{1:key}.free": "{s_free}"
    # ── Automatic File Upload ──
    - path: '^/api/v2\.0/afu/status$'
      json_match: { "$.status": "^ok$" }
      json_each: "$.result"
      json: { id: "$.id", st: "$.status.state", protocol: "$.status.protocol", files: "$.status.queue.files",
              size: "$.status.queue.size", f_recorder: "$.status.file.recorder", f_id: "$.status.file.id",
              f_uploaded: "$.status.file.uploaded", f_size: "$.status.file.size", error: "$.status.error.message" }
      replace: afu
      state:
        "afu.{id:key}.state": "{st}"
        "afu.{id:key}.protocol": "{protocol}"
        "afu.{id:key}.queue_files": "{files}"
        "afu.{id:key}.queue_size": "{size}"
        "afu.{id:key}.file.recorder": "{f_recorder}"
        "afu.{id:key}.file.id": "{f_id}"
        "afu.{id:key}.file.uploaded": "{f_uploaded}"
        "afu.{id:key}.file.size": "{f_size}"
        "afu.{id:key}.error": "{error}"
    - path: '^/api/v2\.0/afu/([^/]+)/status$'
      json_match: { "$.status": "^ok$" }
      json: { st: "$.result.state", protocol: "$.result.protocol", files: "$.result.queue.files",
              size: "$.result.queue.size", f_recorder: "$.result.file.recorder", f_id: "$.result.file.id",
              f_uploaded: "$.result.file.uploaded", f_size: "$.result.file.size", error: "$.result.error.message" }
      replace: "afu.{1:key}"
      state:
        "afu.{1:key}.state": "{st}"
        "afu.{1:key}.protocol": "{protocol}"
        "afu.{1:key}.queue_files": "{files}"
        "afu.{1:key}.queue_size": "{size}"
        "afu.{1:key}.file.recorder": "{f_recorder}"
        "afu.{1:key}.file.id": "{f_id}"
        "afu.{1:key}.file.uploaded": "{f_uploaded}"
        "afu.{1:key}.file.size": "{f_size}"
        "afu.{1:key}.error": "{error}"
