telemetry:
  # The Pearl pushes nothing: status every 2 seconds, system, storage, uploads
  # and events every 10, configuration every minute. List replies name each
  # item, whose own reads are queued with then_send.
  poll:
    - every_ms: 2000
      send:
        - { method: GET, path: /api/v2.0/channels, query: { publishers: "true", publishers-status: "true" } }
        - { method: GET, path: /api/v2.0/recorders/status }
        - { method: GET, path: /api/v2.0/system/singletouchcontrol }
    - every_ms: 10000
      send:
        - { method: GET, path: /api/v2.0/system/status }
        - { method: GET, path: /api/v2.0/afu/status }
        - { method: GET, path: /api/v2.0/system/storages }
        - { method: GET, path: /api/v2.0/schedule/events }
    - every_ms: 60000
      send:
        - { method: GET, path: /api/v2.0/channels, query: { publishers: "true", encoders: "true", active_layout: "true" } }
        - { method: GET, path: /api/v2.0/inputs }
        - { method: GET, path: /api/v2.0/outputs }
        - { method: GET, path: /api/v2.0/recorders }
        - { method: GET, path: /api/v2.0/system/firmware }
        - { method: GET, path: /api/v2.0/system/ident }
        - { method: GET, path: /api/v2.0/system/presets, query: { details: "true" } }
        - { method: GET, path: /api/v2.0/schedule/events/adhoc/session }
  updates:
    # ── Publishers' status, every channel at once ──
    - path: '^/api/v2\.0/channels\?publishers=true&publishers-status=true$'
      json_match: { "$.status": "^ok$" }
      json: {}
      replace: publishers
    - path: '^/api/v2\.0/channels\?publishers=true&publishers-status=true$'
      json_match: { "$.status": "^ok$" }
      json_each: "$.result[*].publishers"
      json:
        cid: "$^.id"
        pid: "$.id"
        type: "$.type"
        name: "$.name"
        configured: "$.status.is_configured"
        started: "$.status.started"
        st: "$.status.state"
        description: "$.status.description"
        duration: "$.status.duration"
        since: "$.status.since"
        reconnections: "$.status.reconnections"
        t_duration: "$.status.statistics.total.duration"
        t_pkt_sent: "$.status.statistics.total.pkt_sent"
        t_pkt_loss: "$.status.statistics.total.pkt_loss"
        t_pkt_retrans: "$.status.statistics.total.pkt_retrans"
        t_pkt_drop: "$.status.statistics.total.pkt_drop"
        t_latency: "$.status.statistics.total.latency"
        t_byte_sent: "$.status.statistics.total.byte_sent"
        t_byte_retrans: "$.status.statistics.total.byte_retrans"
        t_byte_drop: "$.status.statistics.total.byte_drop"
        c_duration: "$.status.statistics.current.duration"
        c_send_rate: "$.status.statistics.current.send_rate"
        c_loss_ratio: "$.status.statistics.current.loss_ratio"
        c_retrans_ratio: "$.status.statistics.current.retrans_ratio"
        c_drop_ratio: "$.status.statistics.current.drop_ratio"
        c_latency: "$.status.statistics.current.latency"
        c_rtt: "$.status.statistics.current.rtt"
        c_bandwidth: "$.status.statistics.current.estimated_bandwidth"
        c_send_buffer: "$.status.statistics.current.send_buffer"
        c_stream_id: "$.status.statistics.current.stream_id"
        c_ip: "$.status.statistics.current.ip"
      state:
        "publishers.{cid}.{pid}.type": "{type}"
        "publishers.{cid}.{pid}.name": "{name}"
        "publishers.{cid}.{pid}.is_configured": "{configured}"
        "publishers.{cid}.{pid}.started": "{started}"
        "publishers.{cid}.{pid}.state": "{st}"
        "publishers.{cid}.{pid}.description": "{description}"
        "publishers.{cid}.{pid}.duration": "{duration}"
        "publishers.{cid}.{pid}.since": "{since}"
        "publishers.{cid}.{pid}.reconnections": "{reconnections}"
        "publishers.{cid}.{pid}.statistics.total.duration": "{t_duration}"
        "publishers.{cid}.{pid}.statistics.total.pkt_sent": "{t_pkt_sent}"
        "publishers.{cid}.{pid}.statistics.total.pkt_loss": "{t_pkt_loss}"
        "publishers.{cid}.{pid}.statistics.total.pkt_retrans": "{t_pkt_retrans}"
        "publishers.{cid}.{pid}.statistics.total.pkt_drop": "{t_pkt_drop}"
        "publishers.{cid}.{pid}.statistics.total.latency": "{t_latency}"
        "publishers.{cid}.{pid}.statistics.total.byte_sent": "{t_byte_sent}"
        "publishers.{cid}.{pid}.statistics.total.byte_retrans": "{t_byte_retrans}"
        "publishers.{cid}.{pid}.statistics.total.byte_drop": "{t_byte_drop}"
        "publishers.{cid}.{pid}.statistics.current.duration": "{c_duration}"
        "publishers.{cid}.{pid}.statistics.current.send_rate": "{c_send_rate}"
        "publishers.{cid}.{pid}.statistics.current.loss_ratio": "{c_loss_ratio}"
        "publishers.{cid}.{pid}.statistics.current.retrans_ratio": "{c_retrans_ratio}"
        "publishers.{cid}.{pid}.statistics.current.drop_ratio": "{c_drop_ratio}"
        "publishers.{cid}.{pid}.statistics.current.latency": "{c_latency}"
        "publishers.{cid}.{pid}.statistics.current.rtt": "{c_rtt}"
        "publishers.{cid}.{pid}.statistics.current.estimated_bandwidth": "{c_bandwidth}"
        "publishers.{cid}.{pid}.statistics.current.send_buffer": "{c_send_buffer}"
        "publishers.{cid}.{pid}.statistics.current.stream_id": "{c_stream_id}"
        "publishers.{cid}.{pid}.statistics.current.ip": "{c_ip}"
    - path: '^/api/v2\.0/channels\?publishers=true&publishers-status=true$'
      json_match: { "$.status": "^ok$" }
      json_each: "$.result[*].publishers[*].status.warnings"
      json: { cid: "$^^.id", pid: "$^.id", text: "$.text" }
      state: { "publishers.{cid}.{pid}.warnings.{index}.text": "{text}" }
    # A publisher added: read every publisher again.
    - path: '^/api/v2\.0/channels/[^/]+/publishers$'
      json_match: { "$.status": "^ok$", "$.result.id": "." }
      json: {}
      then_send:
        - { method: GET, path: /api/v2.0/channels, query: { publishers: "true", publishers-status: "true" } }
    # A publisher deleted: its settings go too.
    - path: '^/api/v2\.0/channels/([^/]+)/publishers/([^/]+)$'
      json_match: { "$.status": "^ok$" }
      json: {}
      state: { "publisher_settings.{1}.{2}": { delete: true } }
    - path: '^/api/v2\.0/channels/([^/]+)/publishers/([^/]+)/name(\?.*)?$'
      json_match: { "$.status": "^ok$" }
      json: { name: "$.result" }
      state: { "publishers.{1}.{2}.name": "{name}" }
    # ── Publisher settings: each publisher's own GET (and PUT reply) ──
