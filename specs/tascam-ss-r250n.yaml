spec: 1
id: tascam-ss-r250n
name: TASCAM SS-CDR250N / SS-R250N / SS-R300N networking recorders (RS-232C / TELNET protocol)
vendor: TASCAM
category: recorder

# TEAC's RS-232C/TELNET protocol for the SS-CDR250N, SS-R250N and SS-R300N: the same ASCII commands on the
# RS-232C port and on the Telnet server (TCP 23, a password asked first). On the network a message is the
# machine ID "0", a two-character command and its data, ended by CR LF; on RS-232C the same message is
# preceded by LF and ended by CR. Transport and preset commands are not acknowledged; sense commands are
# answered by a return command (the command with its top bit set); the recorder pushes F6 CHANGE STATUS
# when its transport or track changes, F0 and F1 when its error or caution status changes, and F4 when it
# powers on. Functions of its own are the 7F vendor commands, answered by FF. Track, file and folder
# numbers, and minutes, are sent as four digits in the order tens, ones, thousands, hundreds ("2301" is 123).
source:
  - title: "TASCAM SS-CDR250N/SS-R250N/SS-R300N CONTROL I/O Terminals RS-232C/TELNET Protocol Specifications, Ver. 2.00 (Oct 2026)"
    author: TEAC Corporation
    url: https://tascam.com/wp-content/uploads/downloads/products/tascam/ss-r300n/rs-232c_protocol_sscdr250n_r330n_v2.00_e.pdf
    note: >
      Manufacturer document (retrieved 2026-10-27), offered for download with a protocol use agreement that
      grants its use for developing compatible devices and software; nothing of it is copied here. RS-232C
      (pp.3-4: 4800-57600 bit/s, 7 or 8 data bits, none/odd/even parity, 1 or 2 stop bits, set on the unit;
      RTS and CTS joined inside), command format on RS-232C (LF, ID, command, data, CR) and TELNET (ID,
      command, data, CR LF; the vendor command page shows LF CR) (pp.5-6), ID 0, the command sequence (no
      ACK, return commands, CHANGED STATUS, 20 ms between commands, p.7), the command and vendor command
      lists with the firmware each needs (pp.9-11), each command (pp.12-40) and the vendor commands (pp.41-58).
  - title: "TASCAM SS-CDR250N / SS-R250N Owner's Manual V2.00"
    author: TEAC Corporation
    url: https://tascam.com/wp-content/uploads/downloads/products/tascam/ss-cdr250n_ss-r250n_rc-ss150/e_ss-cdr250n_om_vf.pdf
    note: >
      Manufacturer document. "Remote control" (p.93): Telnet on port 23, password SS-CDR250N or SS-R250N by
      default (case-sensitive, set on the PASSWORD screen), press Enter after connecting, "Enter Password",
      "Login Successful", three connections at once; 232C/PARA/NETWORK lock (p.30). RS-232C settings (p.102):
      57600 bit/s, no parity, 1 stop bit and 8 data bits by default.
  - title: "bitfocus/companion-module-tascam-cd (MIT)"
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-tascam-cd
    note: "Corroboration only, not copied: the Telnet login and the 0-prefixed commands."

transport:
  type: line-tcp
  port: 23
  framing: terminated
  terminator: crlf
  encoding: utf-8
  timeout_ms: 3000
  reply: expected
  # A reply is a return command, which has its top bit set (8F to FF): an echo of a command sent (00 to
  # 7F) is never taken for one.
  reply_match: "^0[89A-F][0-9A-F]"
  error_match: "^0F2$"
  probe: "00F"
  # At least 20 ms between commands (p.7).
  pacing:
    min_interval_ms: 20

settings:
  password: { type: string, secret: true, max_length: 32, default: "", label: Password,
    description: "The recorder's Telnet password, set on its PASSWORD screen; by default SS-CDR250N or SS-R250N (the model's name), case-sensitive, to be given here." }

# Enter first, then the password at "Enter Password", on the network only. TEAC documents no answer to a
# wrong password.
on_connect:
  - send: ""
  - after_prompt: "Enter Password"
    send: "{settings.password}"

ports:
  - { port: 23, protocol: tcp, role: control, note: "the Telnet server; three connections at once" }

