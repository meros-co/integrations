  get_live_cue_number:
    summary: "The live cue number of the connected cue list (CueLists.LiveCueNumber)"
    send: { method: GET, path: /titan/get/2/CueLists/LiveCueNumber }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_next_cue_number:
    summary: "The next cue number of the connected cue list (CueLists.NextCueNumber)"
    send: { method: GET, path: /titan/get/2/CueLists/NextCueNumber }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_command_line:
    summary: "The command line text being typed or edited (Command.CommandLineText)"
    send: { method: GET, path: /titan/get/2/Command/CommandLineText }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_current_world:
    summary: "The current handle world's name (Handles.CurrentWorldName)"
    send: { method: GET, path: /titan/get/2/Handles/CurrentWorldName }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_device_info:
    summary: "The status of every connection to the console, as JSON (Titan.DeviceInfo)"
    send: { method: GET, path: /titan/get/2/Titan/DeviceInfo }
