    returns: value

  get_property:
    summary: "Read any property by provider and property name (/titan/get/2/<provider>/<property>), e.g. Masters and IsDeskBlackedOut"
    params:
      provider: { type: string, pattern: '^[A-Za-z][A-Za-z0-9]{0,63}$', required: true, label: Provider, description: "Property provider name, such as Masters." }
      property: { type: string, pattern: '^[A-Za-z][A-Za-z0-9]{0,63}$', required: true, label: Property, description: "Property name in that provider, such as IsDeskBlackedOut." }
    send: { method: GET, path: "/titan/get/2/{provider}/{property}" }
    expect: { status: 200, json_path: "$" }
    returns: value

  get_handles:
    summary: "Every programmed handle on the console, as Titan's JSON handle records (/titan/handles); can be large"
    send: { method: GET, path: /titan/handles }
