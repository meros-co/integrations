      group: { type: string, pattern: '^[A-Za-z][A-Za-z0-9]{0,31}$', required: true, label: Handle group, description: "Handle group name, case sensitive, such as Playbacks, Fixtures or Colours." }
      page:  { type: int, min: 0, max: 9999, required: true, label: Page, description: "Page of the handle group, numbered from 0." }
    send: { method: GET, path: "/titan/handles/{group}/{page}" }
    expect: { status: 200, json_path: "$" }
    returns: value

quirks:
  - models: [all]
    severity: warning
    text: >
      The WebAPI needs Titan V14 or later for the script/2 form used here, and is enabled on
      consoles and on Titan PC with a T2, T3 or Titan Net Processor; Titan One, T1 and Editor
      keys do not answer (per the community Companion module; Avolites' pages do not state the
      licensing).

  - models: [all]
    severity: warning
    text: >
      A command is acknowledged by any 200 reply. Avolites says an invalid request returns "an
      error message" without saying whether its status is 200, so a refused request may still
      report ack; a malformed request and an unknown handle are not told apart from success.

  - models: [all]
    severity: info
    text: >
      Handles are addressed by user number (default), Titan id or location (by: location, handle
      such as playback_2_1, the documentation's example), sent as handle_userNumber,
      handle_titanId or handle_location (srcHandle_* for SetPlaybackLevel, playbackHandle_* for
      the second handle of apply_palette_to_playback). User numbers are those shown on the
      console's handles and can be changed by the operator.

  - models: [all]
    severity: info
    text: >
      Titan pushes nothing over the WebAPI. /titan/handles and four properties (software version,
      desk blackout, blind and highlight) are polled every 5 s, the interval the community
      Companion module uses, so playback active state lags by up to 5 s plus the console's reply
      time. On a show with many handles the handles reply is large.

  - models: [all]
    severity: warning
    text: >
      Handle record field names differ between sources: Avolites' introduction shows Active and
      Legend, the community Companion module reads legend (lower case), userNumber and icon. Both
      spellings of the legend and of active are read; handles are keyed by titanId. The user
      number is read from userNumber.hashCode, a field Avolites does not document.

  - models: [all]
    severity: info
    text: >
      Levels are fractions 0-1 (level_level; 0.5 = 50 %) and level changes -1 to 1
      (level_leveldelta); times are seconds, sent with two decimals (fadeTime=5.00) where the
      documentation's examples use whole seconds. The grand master value is sent as 0-100, as the
      community Companion module does; Avolites gives no range. The selected-fixtures dimmer is a
      percentage ("The level as a percentage"). Bounds the documentation leaves open are chosen
      here: times 0-3600 s, cue and step numbers 0-99999, the effect speed multiplier 0-100.

  - models: [all]
    severity: info
    text: >
      tap_tempo and master_tap_tempo send an empty panelTimeStamp, and set_grand_master an empty
      oldValue, as the community Companion module does; the documentation types them TimeSpan and
      Nullable<Single> without an example value.

  - models: [all]
    severity: critical
    text: >
      kill_all_playbacks, release_all_playbacks, set_desk_blackout, set_dmx_frozen,
      clear_programmer and release_all_timelines act on the whole show at once and cannot be
      undone from here; toggle_desk_mode switches the console between run and program mode.

  - models: [all]
    severity: info
    text: >
      Methods whose parameters use types the documentation gives no wire example for
      (AcwRecordMask, AcwShapeType, AcwHSI, MenuEventTypes, AcwTimecodeSource, TimecodeTime and
      some Int32 index arguments typed {titanId}) are not offered: the programmer clear with a
      mask, effect clearing, HSI colour, handle key and fader events, timecode source selection,
      playing a timeline from a time, and fader-group levels by index. Recording (StoreCue and
      the Palette and Group store methods) is left out because recording on a live console cannot
      be undone.

state:
  "handles.*.legend": { type: string, description: "Handle legend, by Titan id, from /titan/handles (legend or Legend)" }
  "handles.*.active": { type: bool, description: "Whether the handle is active (a playback running), by Titan id, from /titan/handles (Active or active)" }
  "handles.*.type": { type: string, description: "Handle type (playbackHandle, paletteHandle, fixtureHandle, ...), by Titan id" }
  "handles.*.group": { type: string, description: "Handle group name (handleLocation.group), by Titan id" }
  "handles.*.page": { type: int, description: "Handle page, from 0 (handleLocation.page), by Titan id" }
  "handles.*.index": { type: int, description: "Handle index on its page, from 0 (handleLocation.index), by Titan id" }
  "handles.*.user_number": { type: string, description: "Handle user number as Titan reports it (userNumber.hashCode; undocumented), by Titan id" }
  system.software_version: { type: string, description: "Titan software version, from System.SoftwareVersion" }
  masters.desk_blackout: { type: bool, description: "Desk blacked out, from Masters.IsDeskBlackedOut" }
  programmer.blind: { type: bool, description: "Programmer blind mode active, from Programmer.BlindActive" }
  programmer.highlight: { type: bool, description: "Fixture highlight on, from Programmer.Editor.Fixtures.Highlight" }

telemetry:
  poll:
    send:
      - { method: GET, path: /titan/get/2/System/SoftwareVersion }
      - { method: GET, path: /titan/get/2/Masters/IsDeskBlackedOut }
      - { method: GET, path: /titan/get/2/Programmer/BlindActive }
      - { method: GET, path: /titan/get/2/Programmer/Editor/Fixtures/Highlight }
      - { method: GET, path: /titan/handles }
    every_ms: 5000
  updates:
    - path: "^/titan/get/2/System/SoftwareVersion$"
      json: { version: "$" }
      state: { system.software_version: "{version}" }
    - path: "^/titan/get/2/Masters/IsDeskBlackedOut$"
      json: { value: "$" }
      state: { masters.desk_blackout: "{value}" }
    - path: "^/titan/get/2/Programmer/BlindActive$"
      json: { value: "$" }
      state: { programmer.blind: "{value}" }
    - path: "^/titan/get/2/Programmer/Editor/Fixtures/Highlight$"
      json: { value: "$" }
      state: { programmer.highlight: "{value}" }
    - path: "^/titan/handles$"
      json_each: "$"
      json:
        id: "$.titanId"
        legend: "$.legend"
        active: "$.active"
        type: "$.type"
        group: "$.handleLocation.group"
        page: "$.handleLocation.page"
        index: "$.handleLocation.index"
        user_number: "$.userNumber.hashCode"
      state:
        "handles.{id}.legend": "{legend}"
        "handles.{id}.active": "{active}"
        "handles.{id}.type": "{type}"
        "handles.{id}.group": "{group}"
        "handles.{id}.page": "{page}"
        "handles.{id}.index": "{index}"
        "handles.{id}.user_number": "{user_number}"
    - path: "^/titan/handles$"
      json_each: "$"
      json: { id: "$.titanId", legend: "$.Legend", active: "$.Active" }
      state:
        "handles.{id}.legend": "{legend}"
        "handles.{id}.active": "{active}"
