spec: 1
id: avolites-titan
name: Avolites Titan (WebAPI)
vendor: Avolites
category: lighting

source:
  - title: Avolites Titan V19.2 API Documentation, Introduction
    author: Avolites Ltd
    url: https://api.avolites.com/19.2/
    note: >
      Retrieved 2026-10-02 (the newest of the versions listed at https://api.avolites.com/, 10.0
      to 19.2). HTTP port 4430, paths starting /titan/, JSON replies; get requests
      (/titan/get/System/SoftwareVersion, /titan/get/Show/ShowName), set requests as a POST body;
      scripts as GET with typed query parameters; the Titan-specific types Level, Level Delta,
      TitanId and User Number; "If you send an invalid request, the console will return an error
      message ... For a successful request the console will return the result, or if there is no
      result it will return a blank page"; handle requests /titan/handles, /titan/handles/<group>
      and /titan/handles/<group>/<page> (pages from 0, group names case sensitive) returning JSON
      handle records (handleLocation group, index and page, properties, titanId, type, Active,
      Legend); the Playbacks and Titan providers.
  - title: Avolites Titan V19.2 API Documentation, API reference (script/2, get/2 and set/2 forms)
    author: Avolites Ltd
    url: https://api.avolites.com/19.2/api/index.html
    note: >
      Retrieved 2026-10-02. One page per member, each with its macro syntax, HTTP form and
      examples, for example Playbacks.FirePlaybackAtLevel.html:
      /titan/script/2/Playbacks/FirePlaybackAtLevel?handle_userNumber=6&level_level=1&alwaysRefire=true,
      with handle_location=playback_2_1 and handle_titanId=1895 as the other handle forms and
      level_leveldelta=0.5 as the relative form; AcwTimeSpan parameters given in seconds
      (fadeTime=5); properties read at /titan/get/2/<Provider>/<Property> and written by POST to
      /titan/set/2/<Provider>/<Property>. Pages used: Playbacks (FirePlaybackAtLevel,
      SetPlaybackLevel, KillPlayback, KillAllPlaybacks, ReleasePlayback, ReleaseAllPlaybacks,
      ReleaseAllPlaybacksByPriority, FlashPlayback, ClearFlashPlayback, FlashTimedPlayback,
      ClearFlashTimedPlayback, SwopPlayback, ClearSwopPlayback, ToggleLatchPlayback,
      ToggleBlindPlayback, ClearAllBlindPlaybacks, Preload, SetManualCrossfadeLevel, TapTempo,
      SetEffectSpeedMultiplier, SetCueLegend), CueLists (Play, PlayWithTime, GoBack, Resume, Pause,
      FlashAndGo, SetNextCue, AdvanceNextStep, DecrementNextStep, ResetNextStep, NextStep, Review,
      SnapBack, CutNextCueToLive, PauseChase, PlayChase, LiveCueNumber, NextCueNumber), Chases
      (Play, Pause, GoBack, SetNextCue, NextStep, SetXFade), Masters (BlackOutDesk,
      SetGrandMasterFaderLevel, DeadBlackOut, Flash, ClearFlash, Latch, Take, ResetMaster,
      ResetAllMasters, TapTempo, IsDeskBlackedOut, GrandMasterOutputLevel), UserMacros
      (RecallMacro, RecallMacroById), Palette (ApplyPalette, ApplyTimedPalette, ApplyQuickPalette,
      ApplyTimedPaletteNumeric, ApplyPaletteToPlayback, SetFadeTime), Group (RecallGroup,
      RecallGroupNumeric, Flash, Swop), Programmer (Editor.ClearAll, Editor.Fixtures.Release,
      LocateSelectedFixtures, SetDimmerLevel "The level as a percentage", SetControlValueByName,
      ToggleHighlight, FlashOn, FlashOut, ClearFlash, Highlight, Editor.Selection.SelectFixture,
      Clear, PatternNext, PatternPrevious, InvertPattern, SetBlind, TryCue, BlindActive), Fixtures
      (FlashFixture, ClearFlashFixture, SwopFixture, ClearSwopFixture), Timelines (PlayTimeline,
      PauseTimeline, PlayPauseTimeline, StopTimeline, ResetTimeline, ReleaseTimeline,
      ToggleLatchTimeline, SkipTimeline, FlashTimeline, ReleaseAllTimelines), Timecode
      (SetEnabled, Play, Pause, Restart, Enabled), Dmx.FreezeDmx, Handles (SetGroupPage,
      CurrentWorldName), System (ToggleMode, SoftwareVersion, DeskMode), Show.ShowName,
      Titan (DmxOutputEnabled, DeviceInfo), Command.CommandLineText. The script/2 form is
      documented from V14.0; V10.0 to V12.0 document only the older typed-parameter form.
  - title: Bitfocus Companion module companion-module-avolites-titan (community, MIT)
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-avolites-titan
    note: >
      Community code, read for corroboration only (MIT at the top level). For Titan 14.0 onwards;
      "does NOT work with the Titan One, T1 and Editor Keys", the WebAPI being enabled "with T2
      dongles and beyond (T3, desks...)". Sends script/2 requests as above, the grand master as
      SetGrandMasterFaderLevel?oldValue=&value=<0-100>, tap tempo with an empty panelTimeStamp;
      polls /titan/handles and get/2 System/SoftwareVersion, Masters/IsDeskBlackedOut,
      Programmer/BlindActive and Programmer/Editor/Fixtures/Highlight every 5 s, and reads
      handle records with lower-case legend, titanId, type, userNumber (hashCode, userNumbers)
      and icon.

# HTTP on port 4430, no authentication. Every request is a GET to /titan/script/2/...,
# /titan/get/2/... or /titan/handles...; Titan answers 200 with the result, an empty page when
# there is none, or an error message. State is polled: Titan pushes nothing over the WebAPI.
transport:
  type: http
  port: 4430
  scheme: http
  auth: none
  timeout_ms: 4000
  probe: { method: GET, path: /titan/get/2/System/SoftwareVersion }

ports:
  - { port: 4430, protocol: http, role: control }

