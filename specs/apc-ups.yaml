spec: 1
id: apc-ups
name: APC UPS (SNMP)
vendor: APC (Schneider Electric)
category: other
implementation: native
reason: >
  SNMP: BER-encoded requests over UDP, matched to their responses, retransmitted, walked with GETBULK, and on v3
  authenticated and encrypted with keys derived from passwords (see generic-snmp). The UPS's battery, input,
  output, outlet groups, phases and diagnostics are objects and table rows the agent lists only when walked, and
  its traps arrive on a port of the core's. The integration is the SNMP manager with PowerNet-MIB's UPS objects
  named.

source:
  - title: "APC PowerNet MIB v4.6.0 (powernet460.mib, document APC_POWERNETMIB_EN), 09 Jul 2026"
    author: APC by Schneider Electric
    url: "https://www.se.com/ww/en/download/document/APC_POWERNETMIB_EN/"
    note: >
      The ups group (enterprises 318.1.1.1: identification, battery, input, output, configuration, control, test,
      communication, phases, synchronized control groups, state, outlet groups, diagnostics, parallel systems,
      physical layout, integrated ATS, DC output, universal I/O, energy efficiency and statistics), every object's
      OID, syntax, access, units and enumeration, and the TRAP-TYPEs of the apc enterprise. The MIB covers every
      APC network-enabled device but NetBotz (FAQ FA156048). Facts only (names, numbers, enumerations) are used;
      the MIB's text is not reproduced.
  - title: "Which MIB do APC network-enabled devices support?, FAQ FA156048"
    author: Schneider Electric
    url: "https://www.se.com/ww/en/faqs/FA156048/"
    note: "PowerNet-MIB serves all APC network-enabled devices except NetBotz, which has a MIB of its own."
  - title: "RFC 3416, RFC 3418 and the SNMP RFCs generic-snmp cites"
    author: IETF
    url: "https://www.rfc-editor.org/rfc/rfc3416"
    note: "The protocol (GETBULK walks, SET, traps); the system group (sysDescr, sysUpTime...)."

