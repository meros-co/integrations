quirks:
  - models: [all]
    severity: critical
    text: >
      The control commands act on the UPS's output at once and cannot be undone live: set_adv_control_ups_off,
      set_adv_control_reboot_shutdown_ups, set_adv_control_ups_sleep, set_adv_control_reboot_ups_with_or_without_ac,
      set_adv_control_bypass_switch, set_adv_control_simulate_power_fail, set_basic_control_conserve_battery and
      set_outlet_group_control_command turn off, reboot or transfer the load; set_adv_test_runtime_calibration
      discharges the battery; set_adv_control_firmware_update starts a firmware update. Each acts as PowerNet-MIB
      describes its values, gracefully or after the configured delays where the value says so.
  - models: [all]
    severity: info
    text: >
      State and commands are named after PowerNet-MIB's ups group, the "ups" prefix left off: each table is keyed by
      the row index the agent gives, enumerations are the MIB's labels in snake case, and numbers are as the MIB
      counts them (tenths of volts in the high-precision objects, TimeTicks for runtimes), with the unit in each
      key's description where the MIB states it. A UPS lists only the objects its family has.
  - models: [all]
    severity: info
    text: >
      A control object reads back as the state it caused rather than the action written (upsAdvControlUpsOff reads
      no_turn_ups_off), so each command reads its group or table again after the SET; the result of a delayed or
      graceful action shows at a later poll.
  - models: [all]
    severity: info
    text: >
      Each notification received is a message event, {event: message, address, args, source}: address is its
      snmpTrapOID (a v1 trap's as RFC 3584 §3.1 derives it, enterprises.318.0.n for PowerNet-MIB's traps), args is
      the same object as traps.last with the MIB's trap name, and a notification starts a poll half a second later.
      Point the UPS's trap receiver at the core's address and trap_port.
  - models: [all]
    severity: info
    text: >
      v1 and v2c agents drop requests with a wrong community without answering, so a wrong community looks like an
      agent that is not there (disconnected, commands time out). SETs need the write community the card is
      configured with (write_community), or a v3 user with write access.
  - models: [all]
    severity: info
    text: >
      Opening for commands only walks nothing; a GET of sysUpTime.0 each interval stays as the liveness check, and
      notifications are still received.
