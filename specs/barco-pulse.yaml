        - { models: [xdl], message: '{"jsonrpc":"2.0","method":"property.subscribe","params":{"property":["optics.filteravailable","optics.focus.calibrationstate","optics.focus.enabled","optics.focus.location","optics.focus.maxposition","optics.focus.minposition","optics.focus.position","optics.focus.safetocalibrate","optics.focus.safetooperate","optics.focus.state","optics.focus.target","optics.lens","optics.lenspresent","optics.lensshift.horizontal.calibrationstate","optics.lensshift.horizontal.enabled","optics.lensshift.horizontal.location","optics.lensshift.horizontal.maxposition","optics.lensshift.horizontal.minposition","optics.lensshift.horizontal.position","optics.lensshift.horizontal.safetocalibrate","optics.lensshift.horizontal.safetooperate","optics.lensshift.horizontal.state","optics.lensshift.horizontal.target","optics.lensshift.vertical.calibrationstate","optics.lensshift.vertical.enabled","optics.lensshift.vertical.location","optics.lensshift.vertical.maxposition","optics.lensshift.vertical.minposition","optics.lensshift.vertical.position","optics.lensshift.vertical.safetocalibrate","optics.lensshift.vertical.safetooperate","optics.lensshift.vertical.state","optics.lensshift.vertical.target","optics.shutter.enabled","optics.shutter.position","optics.shutter.target","optics.zoom.calibrationstate","optics.zoom.enabled","optics.zoom.location","optics.zoom.maxposition","optics.zoom.minposition","optics.zoom.position","optics.zoom.safetocalibrate","optics.zoom.safetooperate","optics.zoom.state","optics.zoom.target"]},"id":1}' }
        - { models: [xdl], message: '{"jsonrpc":"2.0","method":"property.get","params":{"property":"image.display.advanceddisplaymode"},"id":1}' }
        - { models: [xdl], message: '{"jsonrpc":"2.0","method":"property.get","params":{"property":"image.display.advanceddisplaymodeoverride"},"id":1}' }
        - { models: [xdl], message: '{"jsonrpc":"2.0","method":"property.get","params":{"property":"image.display.enableadvanceddisplaymodeoverride"},"id":1}' }
        - { models: [xdl], message: '{"jsonrpc":"2.0","method":"property.get","params":{"property":"image.display.listadvanceddisplaymodes"},"id":1}' }
    - json_match: { "$.method": "^signal\\.callback$" }
      json_each: "$.params.signal[*].*"
      each_match: { "$^": '^\{"modelupdated":' }
      then_send: *resync
    - json_match: { "$.method": "^signal\\.callback$" }
      json_each: "$.params.signal[*].*"
      each_match: { "$^": '^\{"notification\.(?:[a-z]+\.)?(?:emitted|dismissed)":' }
      then_send:
        - { models: [i600], message: '{"jsonrpc":"2.0","method":"notification.info.list","id":1}' }
        - { models: [i600], message: '{"jsonrpc":"2.0","method":"notification.caution.list","id":1}' }
        - { models: [i600], message: '{"jsonrpc":"2.0","method":"notification.warning.list","id":1}' }
        - { models: [i600], message: '{"jsonrpc":"2.0","method":"notification.error.list","id":1}' }
        - '{"jsonrpc":"2.0","method":"property.get","params":{"property":"notification.count"},"id":1}'
        - { models: [udm, udx, f70, f80, f90, hdx-4k, xdl], message: '{"jsonrpc":"2.0","method":"notification.list","id":1}' }
    - json_match: { "$.method": "^signal\\.callback$" }
      json_each: "$.params.signal[*].*"
      each_match: { "$^": '^\{"image\.testpattern\.(?:added|removed|changed|file\.listchanged)":' }
      then_send:
        - '{"jsonrpc":"2.0","method":"image.testpattern.list","id":1}'
        - '{"jsonrpc":"2.0","method":"image.testpattern.file.list","id":1}'
        - { models: [udm, udx, f70], message: '{"jsonrpc":"2.0","method":"image.testpattern.listinternal","id":1}' }
        - { models: [i600, f70], message: '{"jsonrpc":"2.0","method":"image.testpattern.nosignal.list","id":1}' }
    - json_match: { "$.method": "^signal\\.callback$" }
      json_each: "$.params.signal[*].*"
      each_match: { "$^": '^\{"image\.processing\.warp\.file\.listchanged":' }
      then_send:
        - '{"jsonrpc":"2.0","method":"image.processing.warp.file.list","id":1}'
    - json_match: { "$.method": "^signal\\.callback$" }
      json_each: "$.params.signal[*].*"
      each_match: { "$^": '^\{"image\.processing\.blend\.file\.listchanged":' }
      then_send:
        - '{"jsonrpc":"2.0","method":"image.processing.blend.file.list","id":1}'
    - json_match: { "$.method": "^signal\\.callback$" }
      json_each: "$.params.signal[*].*"
      each_match: { "$^": '^\{"image\.processing\.blacklevel\.file\.listchanged":' }
      then_send:
        - '{"jsonrpc":"2.0","method":"image.processing.blacklevel.file.list","id":1}'
    - json_match: { "$.method": "^signal\\.callback$" }
      json_each: "$.params.signal[*].*"
      each_match: { "$^": '^\{"system\.identificationchanged":' }
      then_send:
        - '{"jsonrpc":"2.0","method":"system.getidentifications","id":1}'
    - json_match: { "$.method": "^signal\\.callback$" }
      json_each: "$.params.signal[*].*"
      each_match: { "$^": '^\{"profile\.profileactivated":' }
      then_send:
        - { models: [i600, udm, udx], message: '{"jsonrpc":"2.0","method":"property.get","params":{"property":"profile.profiles"},"id":1}' }
        - { models: [i600, udm, udx, f70], message: '{"jsonrpc":"2.0","method":"property.get","params":{"property":"profile.presetassignments"},"id":1}' }

