  updates:
    # A pushed change: params.property is a list of single-member objects,
    # {"<property>": value}. The name is split at its dots into the state path.
    - json_match: { "$.method": "^property\\.changed$" }
      json_each: "$.params.property[*].*"
      each_match: { "$^": '^\{"([a-z0-9_-]+)\.([^"]+)":' }
      json: { value: "$" }
      state: { "{1}.{2}": "{value}" }
    # A reply to property.get of one property, tied to its request.
    - match: '"result"\s*:\s*"((?:[^"\\]|\\.)*)"'
      request_match: '^\{"jsonrpc":"2\.0","method":"property\.get","params":\{"property":"([a-z0-9_-]+)\.([a-z0-9_.-]+)"\},"id":1\}$'
      state: { "{2}.{3}": "{1}" }
    - match: '"result"\s*:\s*(-?[0-9][0-9.eE+-]*|true|false)\s*[,}]'
      request_match: '^\{"jsonrpc":"2\.0","method":"property\.get","params":\{"property":"([a-z0-9_-]+)\.([a-z0-9_.-]+)"\},"id":1\}$'
      state: { "{2}.{3}": "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"property\.get","params":\{"property":"([a-z0-9_-]+)\.([a-z0-9_.-]+)"\},"id":1\}$'
      state: { "{2}.{3}": "{1}" }
    # Lists methods answer, kept as their JSON text.
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"image\.source\.list","id":1\}$'
      state: { image.sources: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"image\.connector\.list","id":1\}$'
      state: { image.connectors: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"image\.window\.list","id":1\}$'
      state: { image.windows: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"image\.testpattern\.list","id":1\}$'
      state: { image.testpattern.patterns: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"image\.testpattern\.listinternal","id":1\}$'
      state: { image.testpattern.internal_patterns: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"image\.testpattern\.nosignal\.list","id":1\}$'
      state: { image.testpattern.nosignal.patterns: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"image\.processing\.warp\.file\.list","id":1\}$'
      state: { image.processing.warp.files: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"image\.processing\.blend\.file\.list","id":1\}$'
      state: { image.processing.blend.files: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"image\.processing\.blacklevel\.file\.list","id":1\}$'
      state: { image.processing.blacklevel.files: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"image\.testpattern\.file\.list","id":1\}$'
      state: { image.testpattern.files: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"system\.getidentifications","id":1\}$'
      state: { system.identifications: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"optics\.lens\.list","id":1\}$'
      state: { optics.lenses: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"notification\.list","id":1\}$'
      state: { notification.active: "{1}" }
    - match: '(?s)"result"\s*:\s*(\{.*\}|\[.*\])\s*(?:,[^{}\[\]]*)?\}\s*$'
      request_match: '^\{"jsonrpc":"2\.0","method":"notification\.(info|caution|warning|error)\.list","id":1\}$'
      state: { "notification.{2}.active": "{1}" }
    # environment.getcontrolblocks: a dictionary of sensor name to reading.
    - json_match: { "$.result": '^\{"environment\.' }
      json_each: "$.result.*"
      json: { value: "$" }
      state: { "environment.sensors.{key:key}": "{value}" }
    # statistics.listcounters: name, value and unit of each counter.
    - json_match: { "$.result[0].unit": '^(none|hours|minutes|seconds|number|percent)$' }
      json_each: "$.result"
      each_match: { "$.name": '^.+$', "$.unit": '^(none|hours|minutes|seconds|number|percent)$' }
      json: { name: "$.name", value: "$.value", unit: "$.unit" }
      state: { "statistics.counters.{name:key}.value": "{value}", "statistics.counters.{name:key}.unit": "{unit}" }
    # Signals: the last one pushed, and what some of them mean for state.
    - json_match: { "$.method": "^signal\\.callback$" }
      json_each: "$.params.signal[*].*"
      json: { arguments: "$" }
      state: { signals.last.name: "{key}", signals.last.arguments: "{arguments}" }
    # A state change or a model update can start or stop services: subscribe
    # and read the state-dependent properties again.
    - json_match: { "$.method": "^property\\.changed$" }
      json_each: "$.params.property[*].*"
      each_match: { "$^": '^\{"system\.state":' }
      then_send: &resync
        - { models: [i600, udm, udx, f70, f80, f90, hdx-4k], message: '{"jsonrpc":"2.0","method":"property.subscribe","params":{"property":["dmx.artnet","dmx.artnetnet","dmx.artnetuniverse","dmx.mode","dmx.monitor.channel01.function","dmx.monitor.channel02.function","dmx.monitor.channel01.offset","dmx.monitor.channel02.offset","dmx.monitor.channel01.value","dmx.monitor.channel02.value","dmx.monitor.connectionstate.active","dmx.shutdown","dmx.shutdowntimeout","dmx.startchannel"]},"id":1}' }
        - '{"jsonrpc":"2.0","method":"property.subscribe","params":{"property":["environment.alarmstate"]},"id":1}'
        - { models: [i600], message: '{"jsonrpc":"2.0","method":"property.subscribe","params":{"property":["gpio.gpo.trigger1.description","gpio.gpo.trigger2.description","gpio.gpo.trigger1.mode","gpio.gpo.trigger2.mode","gpio.gpo.trigger1.name","gpio.gpo.trigger2.name","gpio.gpo.trigger1.reserved","gpio.gpo.trigger2.reserved","gpio.gpo.trigger1.value","gpio.gpo.trigger2.value"]},"id":1}' }
        - { models: [i600], message: '{"jsonrpc":"2.0","method":"property.subscribe","params":{"property":["gsm.data.status","gsm.iccid","gsm.imei","gsm.signalstrength"]},"id":1}' }
        - { models: [i600], message: '{"jsonrpc":"2.0","method":"property.subscribe","params":{"property":["illumination.clo.allowed","illumination.clo.availability","illumination.clo.enable","illumination.clo.scale","illumination.clo.setpoint","illumination.clo.state","illumination.nosignal.dimming.enable","illumination.nosignal.dimming.power","illumination.sources.laser.actualpower","illumination.sources.laser.controlledbyclo","illumination.sources.laser.ispowerlimited","illumination.sources.laser.maxpower","illumination.sources.laser.minpower","illumination.sources.laser.power","illumination.sources.laser.powerlimitreason","illumination.sources.laser.powerprecision","illumination.sources.laser.status","illumination.sources.laser.timcuring.dmd.cureavailable","illumination.sources.laser.timcuring.dmd.state","illumination.state"]},"id":1}' }
