spec: 1
id: barco-pulse
name: Barco Pulse projectors (Pulse API, JSON-RPC)
vendor: Barco
category: display

# Barco's Pulse projectors (I600, UDM, UDX, F70, F80, F90, HDX 4K, XDL) take
# JSON-RPC 2.0 over TLS on 9091 (or raw TCP 9090, the scheme setting): bare
# JSON objects back to back, with no line ending or separator (framing: json). Every request carries "id":1, so the projector
# answers it; replies carry "result" or "error", and the projector's pushes
# (property.changed, signal.callback) carry neither and never answer a command.
#
# Properties are read with property.get and written with property.set, methods
# are called by their dotted name, and the projector pushes changes of the
# properties and signals a connection subscribes to. On connecting this spec
# subscribes to every property the model's catalog documents (statistics and
# other slow counters excepted, which are read every minute) and reads each one
# once, because a subscription does not report the current value. State keys
# are the Pulse property names themselves (system.state, optics.shutter.target),
# with the instance object names (image.connector.hdmi...) as wildcard segments.
#
# Commands: a typed set_<property> for every read-write property of the eight
# catalogs (named after the property, the instance as a parameter), a command
# for each documented method a control system uses, and get_property,
# set_property and call_method for anything else the API offers.

source:
  - title: "Command Catalog for I600 - End User - Pulse version 2.5 (TDE13250, v00)"
    author: Barco
    url: https://www.barco.com/en/support/docs/TDE13250
    note: >
      Manufacturer document, "RS232 and Network Command Catalog for JSON RPC/Pulse Based Projectors,
      For I600", Pulse API reference guide 2.5, 2024-06-15, 348 pages. Connecting (TCP 9090, RS232
      19200 8N1), JSON-RPC service API, property.get/set/subscribe/unsubscribe,
      signal.subscribe/unsubscribe, the property.changed and signal.callback notifications, introspect
      and the modelupdated signal, file endpoints over HTTP, the programmers guide (best practice,
      power, sources and connectors, illumination, picture settings, warp, blend and black level
      files, environment, ECO mode), and the alphabetical property, method, signal and file endpoint
      lists. Read in full for the I600 model.
  - title: "Command Catalog for UDM - End User - Pulse version 2.3 (TDE11168, v02)"
    author: Barco
    url: https://www.barco.com/en/support/docs/TDE11168
    note: >
      Manufacturer document, Pulse API reference guide 2.2, dated 2024-01-29, 440 pages. Same
      structure; the UDM model's properties, methods and signals.
  - title: "Command Catalog for UDX - End User - Pulse version 2.1.7 (TDE9629, v01)"
    author: Barco
    url: https://www.barco.com/en/support/docs/TDE9629
    note: >
      Manufacturer document, Pulse API reference guide 2.1, dated 2021-11-19. The UDX model's API. A
      Power User edition of version 1.7 (2019-03-04) circulates on dealer sites; not used.
  - title: "Command Catalog for F70 - End User - Pulse version 2.3 (TDE9582, v01)"
    author: Barco
    url: https://www.barco.com/en/support/docs/TDE9582
    note: >
      Manufacturer document, Pulse API reference guide 2.3, dated 2023-11-02. The F70 model's API,
      including the lens and illumination iris motors.
  - title: "Command Catalog for F80 - End User - Pulse version 2.1.5 (TDE9597, v02)"
    author: Barco
    url: https://www.barco.com/en/support/docs/TDE9597
    note: >
      Manufacturer document, Pulse API reference guide 1.7, dated 2021-11-08. The F80 model's API.
  - title: "Command Catalog for F90 - End User - Pulse version 2.1 (TDE9579, v01)"
    author: Barco
    url: https://www.barco.com/en/support/docs/TDE9579
    note: >
      Manufacturer document, Pulse API reference guide 1.7, dated 2024-01-29. The F90 model's API.
  - title: "Command Catalog for HDX 4K - End User - Pulse version 1.7 (TDE9602, v00)"
    author: Barco
    url: https://www.barco.com/en/support/docs/TDE9602
    note: >
      Manufacturer document, 2019-02-21, for HDX-4K12, HDX-4K14, HDX-4K20 FLEX. The HDX 4K model's
      API, including the xenon lamp and high contrast shutter.
  - title: "Command Catalog for XDL - End User - Pulse version 1.7 (TDE9605, v00)"
    author: Barco
    url: https://www.barco.com/en/support/docs/TDE9605
    note: >
      Manufacturer document, 2019-02-21. The XDL model's API, including its 3D (stereo glasses, left
      and right primaries) properties.
  - title: "Pulse 2.10 Existing System Integration Guide (TDE13806, v00)"
    author: Barco
    url: https://www.barco.com/en/support/docs/TDE13806
    note: >
      Manufacturer technical note, 2025-11-03, for UDM, UDX, QDX, I600, F40, F70, F400 and other Pulse
      projectors. From Pulse 2.10 HTTP on 80 and the API on 9090 are off by default (HTTPS 443 and TLS
      9091 instead), and how to turn them on again: LCD/OSD Menu > Settings > Maintenance > Security,
      Prospector Configuration > Communication > Network > Connections, or the API properties
      protocols.jsonrpc.port-raw.enable and protocols.http.enable (power user or higher); the initial
      setup (initialsetup.activate); the default user accounts no longer created (user, poweruser,
      admin, default1234, PIN codes 69905, 292920, 297081); PIN authentication off by default
      (user.pincodeauthenticationenabled); HTTP file transfers needing authentication
      (user.authenticationrequired).
  - title: "Pulse 2.10 Functional Changes (TDE13807, v00)"
    author: Barco
    url: https://www.barco.com/en/support/docs/TDE13807
    note: >
      Manufacturer technical note. The same security changes, from the operator's side.
  - title: "Pulse Prospector User guide (R5916611), 5.2 Pulse API Console and A.3 Configuring the device with the API"
    author: Barco
    url: https://www.barco.com/manuals/R5916611/w1p7s33hf4ko.html
    note: >
      Manufacturer document (HTML). The transport for external clients is TCP/IP and "HTTP is to be
      added in a future release"; the API documentation of the running firmware is in Prospector
      (Extra Options > Documentation); configuring over TLS on 9091 needs administrator or service
      rights.
  - title: "companion-module-barco-pulse (Bitfocus Companion module, MIT license)"
    author: Bitfocus
    url: https://github.com/bitfocus/companion-module-barco-pulse
    note: >
      Corroboration only, license checked: TCP 9090, replies split from the stream by counting braces
      outside strings (no delimiter), system.getidentifications and notification.list on connecting.
      No code taken.
  - title: "barco-pulse-homeassistant (Home Assistant integration, MIT license)"
    author: piemkay
    url: https://github.com/piemkay/barco-pulse-homeassistant
    note: >
      Corroboration only, license checked: each message decoded as one JSON value from the stream,
      property.changed notifications interleaved with replies, error codes -32601, -32000 and -32009
      (busy changing state). No code taken.

transport:
  type: line-tcp
  port: 9090
  # TLS on 9091 by default: Pulse 2.10 and later turn the raw port 9090 off
  # by default (TDE13806); the projector's certificate is self-signed.
  scheme: { setting: scheme }
  tls_port: 9091
  accept_invalid_certs: true
  framing: json
  encoding: utf-8
  timeout_ms: 10000
  # A reply has "result" or "error"; a notification has neither.
  reply_match: '"(?:result|error)"\s*:'
  probe: '{"jsonrpc":"2.0","method":"property.get","params":{"property":"system.state"},"id":1}'
  # The same JSON-RPC API on the RS232 port, 19200 8N1, no flow control (every catalog).
  serial:
    baud_rate: 19200
    data_bits: 8
    parity: none
    stop_bits: 1
    flow_control: none
  endpoints:
    files:
      port: { setting: http_port }
      scheme: { setting: http_scheme }
      accept_invalid_certs: true

settings:
  scheme: { type: enum, values: [tls, tcp], default: tls, label: Connection, description: "tls reaches the Pulse API over TLS on port 9091, which current firmware serves; tcp uses the raw port 9090, which Pulse 2.10 and later turn off until protocols.jsonrpc.port-raw.enable is set." }
  pin_code: { type: int, min: 0, max: 99999999, secret: true, label: PIN code, description: "PIN code of a projector user, sent with authenticate on connecting to raise the connection above end user access; leave empty for end user access, which needs none." }
  http_port: { type: int, min: 1, max: 65535, default: 80, label: HTTP port, description: "Port of the projector's web server, where the file endpoints (/api/...) answer; 80, or 443 with https." }
  http_scheme: { type: enum, values: [http, https], default: http, label: HTTP scheme, description: "http, or https for Pulse 2.10 and later, which serve HTTPS on 443 with a self-signed certificate and turn plain HTTP off by default." }

on_connect:
  - when_set: pin_code
    send: '{"jsonrpc":"2.0","method":"authenticate","params":{"code":{settings.pin_code}},"id":1}'
    await_reply: true

ports:
  - { port: 9091, protocol: tls, role: control, when: "link tcp, scheme tls", note: "Pulse API, JSON-RPC 2.0 over TLS (self-signed certificate)" }
  - { port: 9090, protocol: tcp, role: control, when: "link tcp, scheme tcp", note: "Pulse API, JSON-RPC 2.0, raw; off by default from Pulse 2.10 (see the quirks)" }
  - { port: 80, protocol: http, role: control, setting: http_port, note: "web server file endpoints (/api/...); 443 over https" }
  - { port: null, protocol: serial, role: control, setting: serial_port, when: "link serial", note: "RS232, D-sub 9 (male on the projector): a straight cable, pins 2, 3 and 5" }

