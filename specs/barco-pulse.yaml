      (2019-02-21).

commands:
  set_dmx_artnet:
    summary: "Set dmx.artnet (property.set): Artnet enabled or not."
    params:
      value: { type: "bool", required: true, label: "Value", description: "Artnet enabled or not." }
    send: '{"jsonrpc":"2.0","method":"property.set","params":{"property":"dmx.artnet","value":{value}},"id":1}'
    expect: { json_path: "$.result" }
    returns: ack
  set_dmx_artnetnet:
    summary: "Set dmx.artnetnet (property.set): Artnet net selection."
    params:
      value: { type: "int", min: 0, max: 255, required: true, label: "Value", description: "Artnet net selection." }
    send: '{"jsonrpc":"2.0","method":"property.set","params":{"property":"dmx.artnetnet","value":{value}},"id":1}'
    expect: { json_path: "$.result" }
    returns: ack
