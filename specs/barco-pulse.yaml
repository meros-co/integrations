quirks:
  - models: [all]
    severity: warning
    text: >
      The API is reached over TLS on 9091 by default (the scheme setting), with the projector's
      self-signed certificate accepted: the link is encrypted, the projector not authenticated. The
      older catalogs (Pulse 1.7 to 2.3) document only TCP 9090; a projector without the TLS port is
      opened with scheme tcp. From Pulse 2.10 (TDE13806 2.2) the raw API on TCP 9090 and HTTP on
      port 80 are off by default, and the projector serves HTTPS on 443 (http_scheme https for the
      file endpoints). To use scheme tcp, turn 9090 on first: on the LCD or OSD, Menu > Settings >
      Maintenance > Security; in Pulse Prospector, Configuration > Communication > Network >
      Connections (power user or higher); or over the API on 9091 with property.set
      protocols.jsonrpc.port-raw.enable true (and protocols.http.enable true for the file endpoints).
      A factory reset of the network domain turns both off again. Barco recommends the secure
      protocols in all cases.

  - models: [all]
    severity: warning
    text: >
      A factory-fresh projector on Pulse 2.10 or later cannot be powered on until its initial setup is
      done (language, EULA where required, an administrator password other than setup123): on the LCD,
      in Prospector, or with initialsetup.activate over the API (TDE13806 2.1). call_method can send
      that method; this spec does not do it on its own.

  - models: [all]
    severity: info
    text: >
      Access levels: a connection works as end user without authenticating. authenticate with a PIN
      code (the pin_code setting, sent on connecting) raises it; the catalogs from Pulse 2.5 mark
      authenticate deprecated, and Pulse 2.10 turns PIN authentication off by default
      (user.pincodeauthenticationenabled, administrator) and no longer creates the default user,
      poweruser and admin accounts with their well-known PIN codes. The newer login with a user name
      and a challenge signed with a key (getchallenge, login, generatenewtoken) needs a signature the
      format cannot compute and is not used. The catalogs give no failure answer for authenticate, so
      a wrong PIN code is not detected; commands needing more than end user access then fail with the
      projector's error.

  - models: [all]
    severity: info
    text: >
      The API has no freeze (still image) command or property on any of the eight catalogs; freezing
      is not available over the Pulse API. Lens memory is available as named lens positions on I600
      (optics.lens.position.list and selected; the positions' contents are read with get_property
      under optics.lens.position.<name>) and as saved motor locations per axis on the others (the
      <axis>_add_location, _go_to_location, _save_location, _recall_location and _get_locations
      commands, where the catalog lists them); profiles (profile.*) store and recall whole settings
      domains.

  - models: [all]
    severity: warning
    text: >
      Not every property or method is available at all times (each catalog's "Best practice"): in
      standby the shutter, lens and illumination services are not running, and reading or calling them
      then answers an error. A lens without a motorized zoom has no optics.zoom, a basic DMX mode
      exposes two channels only, and so on. So this spec subscribes and reads again whenever
      system.state changes and whenever the projector signals modelupdated, and a command the current
      state does not offer fails with the projector's error (JSON-RPC -32601 for a missing property or
      method, -32000 for one not available in the current state, -32009 while the projector changes
      state).

  - models: [all]
    severity: info
    text: >
      Values the catalogs type as an object of "base int" (or float) and "hints" (motor targets, laser
      power, transport delay, dark time) are written and read here as plain numbers, as the catalog
      examples write illumination.sources.laser.power. Their limits are dynamic and come with
      introspection (introspect), so those parameters have no fixed range.

  - models: [all]
    severity: info
    text: >
      Instance object names (connectors, sources, outputs, sensors, network devices, light sources)
      are the display names lowercased with every non-word character removed (HDMI is hdmi,
      DisplayPort 1 is displayport1), per the catalogs' Sources chapter. The set differs by model and
      configuration; list_connectors, list_sources (UDX, F80, F90, HDX 4K, XDL), list_windows and
      introspect list them. Polling and subscribing use the instances each model's catalog names.

  - models: [all]
    severity: warning
    text: >
      Barco asks clients to wait for each property.set to be confirmed before setting the same
      property again, since some settings (RealColor P7 coordinates) keep the projector busy. The core
      sends one request at a time and waits for its answer, so commands are never pipelined; a slider
      sending many values queues them.

  - models: [all]
    severity: info
    text: >
      Waking a projector from ECO takes Wake-on-LAN with its MAC address, its power key, the remote
      control, or the text :POWR1 followed by CR on its RS232 port (catalogs, ECO mode); the network
      API is not reachable in ECO, so power_on cannot wake it.

  - models: [all]
    severity: info
    text: >
      Serial: every catalog documents the same JSON-RPC API on the RS232 port, 19200 baud, no parity,
      8 data bits, 1 stop bit, no flow control, D-sub 9 (9-pin male on the projector, straight cable,
      pins 2, 3 and 5), identical for I600, UDM, UDX, F70, F80, F90, HDX 4K and XDL: link serial sends
      the same messages there, framed the same way. The file endpoints are the web server's: on link
      serial they are reached at the host the projector was opened with, and not at all without one.
      The scheme setting (TLS) is the network link's.

  - models: [all]
    severity: info
    text: >
      Files: the HTTP file endpoints (/api/<object path>/transfer) take uploads as multipart form data
      in a field named file (warp grids, blend and black level masks, test patterns, EDIDs, the LCD
      splash screen) and give downloads (the current warp grid, logs, screen captures, the license
      registration file, and on the UDX the current source image and the camera's image). The
      upload_* commands send a host file there, streamed; the download_* and capture_* commands save
      what the projector answers to a host file, streamed, and download_warp_grid returns the warp
      grid as XML text. From Pulse 2.10 the web server needs authentication for file transfers unless
      user.authenticationrequired is off (TDE13806 2.5); the catalogs do not say which HTTP
      authentication it takes, so none is sent.

  - models: [all]
    severity: info
    text: >
      environment.sensors.* are read every minute with environment.getcontrolblocks for the Sensor
      blocks of type Temperature and Speed; the sensor names differ by model. get_control_blocks reads
      the other kinds (Voltage, Current, Humidity ...).

  - models: [all]
    severity: critical
    text: >
      reset_domains resets the listed settings domains to factory defaults at once (system.reset);
      there is no confirmation and no undo.

  - models: [all]
    severity: critical
    text: >
      reset_all resets every settings domain, network and users included, to factory defaults
      (system.resetall); the projector may become unreachable.

  - models: [all]
    severity: critical
    text: >
      power_off takes the light down and cools the projector; it cannot be put back on until it has
      passed through deconditioning.

  - models: [all]
    severity: critical
    text: >
      go_to_eco puts the projector in ECO, where the network API no longer answers; only Wake-on-LAN,
      the keypad, the remote or RS232 wake it.

  - models: [all]
    severity: critical
    text: >
      activate_profile and activate_preset apply every setting a profile stores, live.

  - models: [all]
    severity: critical
    text: >
      delete_profile deletes a profile; the delete_*_file commands delete warp, blend, black level and
      test pattern files from the projector.

  - models: [all]
    severity: critical
    text: >
      wifi_connect and the set_network_* commands change the projector's network configuration and can
      cut this connection.

  - models: [all]
    severity: critical
    text: >
      The set_statistics_* commands overwrite runtime counters (lamp, laser, fan and maintenance
      hours); the old value is lost.

telemetry:
  # Subscriptions do not report current values: everything subscribed is
  # also read once, and the slow counters every minute.
  subscribe:
    send:
