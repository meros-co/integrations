spec: 1
id: cyberpower-pdu
name: CyberPower PDU (SNMP)
vendor: CyberPower
category: other
implementation: native
reason: >
  SNMP: BER-encoded requests over UDP, matched to their responses, retransmitted, walked with GETBULK, and on v3
  authenticated and encrypted with keys derived from passwords (see generic-snmp). The PDU's outlets, banks,
  phases, sources and sensors are table rows the agent lists only when walked, and its traps arrive on a port of
  the core's. The integration is the SNMP manager with CPS-MIB's PDU objects named.

source:
  - title: "CyberPower MIB v2.13 (CyberPower_MIB_v2.13.MIB, CPS-MIB, created 12/03/2025)"
    author: CyberPower Systems
    url: "https://www.cyberpowersystems.com/products/software/mib-files/"
    note: >
      The ePDU2 group (enterprises 3808.1.1.6: role, ident, device, phase, bank, outlet, group and source tables),
      the ePDU group (3808.1.1.3: ident, load, outlets, power supply, status), the environmentSensor and
      environmentSensor2 groups (3808.1.1.4 and .8: temperature, humidity and contacts of the EnviroSensor), every
      object's OID, syntax, access and enumeration, and the TRAP-TYPEs of the cps enterprise. Facts only (names,
      numbers, enumerations) are used; the MIB's text is not reproduced.
  - title: "RFC 3416, RFC 3418 and the SNMP RFCs generic-snmp cites"
    author: IETF
    url: "https://www.rfc-editor.org/rfc/rfc3416"
    note: "The protocol (GETBULK walks, SET, traps); the system group (sysDescr, sysUpTime...)."

models:
  - id: epdu2
    name: "CyberPower metered, switched and monitored PDUs implementing CPS-MIB's ePDU2 group (current PDU series)"
    supports: [get, walk, set, refresh, set_bank_config_low_load_threshold, set_bank_config_near_overload_threshold, set_bank_config_overload_restriction, set_bank_config_overload_threshold, set_bank_config_peak_load_reset, set_device_config_coldstart_delay, set_device_config_contact, set_device_config_current_low_load_threshold, set_device_config_current_near_overload_threshold, set_device_config_current_overload_threshold, set_device_config_display_orientation, set_device_config_energy_reset, set_device_config_location, set_device_config_name, set_device_config_peak_load_reset, set_device_config_power_low_load_threshold, set_device_config_power_near_overload_threshold, set_device_config_power_overload_threshold, set_device_control_command, set_environment2_contact_name, set_environment2_contact_normal_state, set_environment2_humid_high_threshold, set_environment2_humid_hysteresis, set_environment2_humid_low_threshold, set_environment2_humid_rate_of_change, set_environment2_ident_location, set_environment2_ident_name, set_environment2_temp_high_threshold, set_environment2_temp_hysteresis, set_environment2_temp_low_threshold, set_environment2_temp_rate_of_change, set_environment2_temp_unit, set_environment_contact_name, set_environment_contact_normal_state, set_environment_humid_high_threshold, set_environment_humid_hysteresis, set_environment_humid_low_threshold, set_environment_humid_rate_of_change, set_environment_ident_location, set_environment_ident_name, set_environment_temp_celsius_high_threshold, set_environment_temp_celsius_hysteresis, set_environment_temp_celsius_low_threshold, set_environment_temp_celsius_rate_of_change, set_environment_temp_high_threshold, set_environment_temp_hysteresis, set_environment_temp_low_threshold, set_environment_temp_rate_of_change, set_group_energy_reset, set_group_peak_record_reset, set_ident_indicator, set_outlet_metered_config_low_load_threshold, set_outlet_metered_config_name, set_outlet_metered_config_near_overload_threshold, set_outlet_metered_config_overload_threshold, set_outlet_monitored_config_name, set_outlet_switched_config_name, set_outlet_switched_config_power_off_time, set_outlet_switched_config_power_on_time, set_outlet_switched_config_reboot_duration, set_outlet_switched_control_command, set_phase_config_low_load_threshold, set_phase_config_near_overload_threshold, set_phase_config_overload_restriction, set_phase_config_overload_threshold, set_phase_config_phase_peak_load_reset, set_source_config_event_counts_reset, set_source_config_frequency_deviation, set_source_config_medium_range_value, set_source_config_narrow_range_value, set_source_config_nominal_voltage, set_source_config_preferred_source, set_source_config_transfer_voltage_range, set_source_config_voltage_sensitivity, set_source_config_wide_range_value]
    verification: none
    notes: >
      Walks CPS-MIB's ePDU2 group and the EnviroSensor groups. ePDU2 lists each PDU of a daisy chain (the role
      table says which is the host) as a row of its device, phase, bank and outlet tables.
  - id: epdu
    name: "CyberPower PDUs implementing CPS-MIB's first ePDU group (earlier switched and metered PDUs)"
    supports: [get, walk, set, refresh, set_e_pdu_ident_indicator, set_environment2_contact_name, set_environment2_contact_normal_state, set_environment2_humid_high_threshold, set_environment2_humid_hysteresis, set_environment2_humid_low_threshold, set_environment2_humid_rate_of_change, set_environment2_ident_location, set_environment2_ident_name, set_environment2_temp_high_threshold, set_environment2_temp_hysteresis, set_environment2_temp_low_threshold, set_environment2_temp_rate_of_change, set_environment2_temp_unit, set_environment_contact_name, set_environment_contact_normal_state, set_environment_humid_high_threshold, set_environment_humid_hysteresis, set_environment_humid_low_threshold, set_environment_humid_rate_of_change, set_environment_ident_location, set_environment_ident_name, set_environment_temp_celsius_high_threshold, set_environment_temp_celsius_hysteresis, set_environment_temp_celsius_low_threshold, set_environment_temp_celsius_rate_of_change, set_environment_temp_high_threshold, set_environment_temp_hysteresis, set_environment_temp_low_threshold, set_environment_temp_rate_of_change, set_ident_device_display_orientation, set_ident_device_lineto_line_voltage, set_ident_name, set_load_bank_config_low_load_threshold, set_load_bank_config_near_overload_threshold, set_load_bank_config_overload_threshold, set_load_phase_config_low_load_threshold, set_load_phase_config_near_overload_threshold, set_load_phase_config_overload_threshold, set_outlet_bank_overload_restriction, set_outlet_config_monitored_energy_reset, set_outlet_config_monitored_low_load_threshold, set_outlet_config_monitored_name, set_outlet_config_monitored_near_overload_threshold, set_outlet_config_monitored_overload_threshold, set_outlet_config_monitored_peak_load_reset, set_outlet_config_outlet_name, set_outlet_config_power_off_time, set_outlet_config_power_on_time, set_outlet_config_reboot_duration, set_outlet_control_outlet_command, set_outlet_device_dev_coldstart_delay, set_outlet_device_dev_coldstart_state, set_outlet_device_dev_command, set_outlet_phase_overload_restriction]
    verification: none
    notes: Walks CPS-MIB's ePDU group and the EnviroSensor groups.

settings:
  version: { type: enum, values: [v1, v2c, v3], default: v2c, label: SNMP version,
             description: "The SNMP version the agent is asked with: v1 and v2c use a community string, v3 a user with authentication and privacy." }
  community: { type: string, secret: true, max_length: 255, default: public, label: Community,
               description: "v1 and v2c: the community string for reads, and for SETs when no write community is set." }
  write_community: { type: string, secret: true, max_length: 255, default: "", label: Write community,
                     description: "v1 and v2c: the community string SETs are sent with, often private; empty uses the community." }
  user: { type: string, max_length: 32, default: "", label: User,
          description: "v3: the user name (securityName) the agent knows." }
  security_level: { type: enum, values: [no_auth_no_priv, auth_no_priv, auth_priv], default: auth_priv, label: Security level,
                    description: "v3: no_auth_no_priv sends messages unauthenticated, auth_no_priv authenticates them, auth_priv also encrypts them." }
  auth_protocol: { type: enum, values: [md5, sha, sha224, sha256, sha384, sha512], default: sha, label: Authentication protocol,
                   description: "v3: HMAC-MD5-96, HMAC-SHA-96 (sha) or HMAC-SHA-2 (RFC 7860), as the user is set up on the agent." }
  auth_password: { type: string, secret: true, max_length: 256, default: "", label: Authentication password,
                   description: "v3: the user's authentication password, at least 8 characters." }
  priv_protocol: { type: enum, values: [des, aes, aes192, aes256], default: aes, label: Privacy protocol,
                   description: "v3 at auth_priv: CBC-DES, AES-128 (aes, RFC 3826), or AES-192 or AES-256 as draft-blumenthal-aes-usm-04 defines them." }
  priv_password: { type: string, secret: true, max_length: 256, default: "", label: Privacy password,
                   description: "v3 at auth_priv: the user's privacy password, at least 8 characters." }
  context_name: { type: string, max_length: 32, default: "", label: Context name,
                  description: "v3: the context requests are made in, empty for the agent's default context." }
  context_engine_id: { type: string, pattern: '^[0-9A-Fa-fxX :.-]*$', max_length: 100, default: "", label: Context engine ID,
                       description: "v3: the contextEngineID in hex, for an agent proxying another engine; empty uses the agent's own snmpEngineID." }
  timeout_ms: { type: int, min: 1, max: 60000, default: 1500, label: Timeout,
                description: "Milliseconds to wait for each response before sending the request again." }
  retries: { type: int, min: 0, max: 10, default: 2, label: Retries,
             description: "How many times an unanswered request is sent again before it fails with timeout." }
  max_repetitions: { type: int, min: 1, max: 1000, default: 20, label: GETBULK repetitions,
                     description: "Objects asked for per GETBULK request while walking." }
  poll_interval_ms: { type: int, min: 100, max: 86400000, default: 10000, label: Poll interval,
                      description: "Milliseconds between walks of the device's objects, and reads of sysUpTime.0, the liveness check." }
  trap_port: { type: int, min: 1, max: 65535, label: Notification port,
               description: "The UDP port traps and informs are received on, 162 as standard; unset receives none." }
  trap_bind_address: { type: string, pattern: '^[0-9A-Fa-f.:]*$', max_length: 45, default: "", label: Notification bind address,
                       description: "The local address to receive notifications on with a port of this device's own; empty shares the port with every SNMP device of the core, each hearing its own agent." }
  trap_community: { type: string, secret: true, max_length: 255, default: "", label: Notification community,
                    description: "v1 and v2c notifications: accept only this community; empty accepts any." }
  local_engine_id: { type: string, pattern: '^[0-9A-Fa-fxX :.-]*$', max_length: 100, default: "", label: Local engine ID,
                     description: "v3 informs: this receiver's snmpEngineID in hex, 5 to 32 bytes, as configured on the agent; empty uses a random one for each opening." }

ports:
  - { port: 161, protocol: udp, role: control, note: "the agent; requests go from an ephemeral port of the core's" }
  - { port: null, protocol: udp, role: notification, listener: core, setting: trap_port, note: "traps and informs, when trap_port is set (162 as standard)" }

commands:
  get:
    summary: >
      GET objects by OID and return {varbinds: [{oid, type, value, hex}]}, for objects the named commands and state
      do not cover; an object state holds is updated from the answer too
    params:
      oids: { type: string, pattern: '^[0-9., ;]+$', max_length: 65536, required: true, label: OIDs,
              description: "One or more OIDs in dotted decimal, separated by commas or spaces, such as 1.3.6.1.2.1.1.3.0." }
    returns: value
  walk:
    summary: Every object under an OID, in order, as {varbinds}
    params:
      oid: { type: string, pattern: '^\.?[0-9]+(\.[0-9]+)+$', max_length: 1024, required: true, label: OID,
             description: "The subtree's root in dotted decimal." }
      limit: { type: int, min: 1, max: 100000000, label: Object limit,
               description: "Stop after this many objects; unset walks the whole subtree." }
    returns: value
  set:
    summary: >
      SET one object by OID to a typed value and return the agent's response as {varbinds}; fails with the agent's
      error-status (notWritable, wrongValue...) as the code
    params:
      oid: { type: string, pattern: '^\.?[0-9]+(\.[0-9]+)+$', max_length: 1024, required: true, label: OID,
             description: "The object instance to set, in dotted decimal." }
      type: { type: enum, values: [integer, string, hex, oid, ip_address, counter32, gauge32, timeticks, counter64, opaque], required: true, label: Type,
              description: "The value's SNMP type: string is UTF-8 text and hex is bytes for an OCTET STRING; gauge32 is also Unsigned32." }
      value: { type: string, max_length: 65536, required: true, label: Value,
               description: "The value as text: a decimal number, text, hex bytes, a dotted OID or an IPv4 address, as the type asks." }
    returns: value
  refresh:
    summary: Read the system group and walk every object now; answered when they have been read
    returns: ack
  set_ident_indicator:
    summary: "Set ePDU2IdentIndicator of one ePDU2IdentEntry row, then read its table back"
    params:
      index: { type: int, min: 1, max: 4, required: true, label: Ident index, description: "The row of ePDU2IdentEntry to write, by its ePDU2IdentIndex." }
      value: { type: enum, values: [no_test_indicators, test_indicators], required: true, label: Value, description: "The new ident indicator, as CPS-MIB names its values." }
    returns: ack
  set_device_config_name:
    summary: "Set ePDU2DeviceConfigName of one ePDU2DeviceConfigEntry row, then read its table back"
    params:
      index: { type: int, min: 1, max: 4, required: true, label: Device config index, description: "The row of ePDU2DeviceConfigEntry to write, by its ePDU2DeviceConfigIndex." }
      value: { type: string, max_length: 255, required: true, label: Value, description: The new device config name. }
    returns: ack
  set_device_config_location:
    summary: "Set ePDU2DeviceConfigLocation of one ePDU2DeviceConfigEntry row, then read its table back"
    params:
      index: { type: int, min: 1, max: 4, required: true, label: Device config index, description: "The row of ePDU2DeviceConfigEntry to write, by its ePDU2DeviceConfigIndex." }
      value: { type: string, max_length: 255, required: true, label: Value, description: The new device config location. }
    returns: ack
  set_device_config_contact:
    summary: "Set ePDU2DeviceConfigContact of one ePDU2DeviceConfigEntry row, then read its table back"
    params:
      index: { type: int, min: 1, max: 4, required: true, label: Device config index, description: "The row of ePDU2DeviceConfigEntry to write, by its ePDU2DeviceConfigIndex." }
      value: { type: string, max_length: 255, required: true, label: Value, description: The new device config contact. }
    returns: ack
  set_device_config_display_orientation:
