quirks:
  - models: [all]
    severity: critical
    text: >
      set_outlet_switched_control_command and set_device_control_command (ePDU2), set_outlet_control_outlet_command
      and set_outlet_device_dev_command (ePDU) switch outlets at once: turning off or rebooting cuts the power of
      whatever is plugged in, and there is no undo. Delayed actions use each outlet's configured power-on and
      power-off times.
  - models: [all]
    severity: info
    text: >
      State and commands are named after CPS-MIB: each table is keyed by the row index the agent gives,
      enumerations are the MIB's labels in snake case, and numbers are as the MIB counts them (tenths of amps,
      tenths of volts...), with the unit in each key's description where the MIB states it. EnviroSensor readings
      are under environment (environmentSensor) and environment2 (environmentSensor2), as the agent fills them.
  - models: [all]
    severity: info
    text: >
      A control object reads back as the state it caused rather than the action written, so each command reads its
      table again after the SET; the result of a delayed action shows at a later poll.
  - models: [all]
    severity: info
    text: >
      Each notification received is a message event, {event: message, address, args, source}: address is its
      snmpTrapOID (a v1 trap's as RFC 3584 §3.1 derives it, enterprises.3808.0.n for CPS-MIB's traps), args is the
      same object as traps.last with the MIB's trap name, and a notification starts a poll half a second later.
  - models: [all]
    severity: info
    text: >
      v1 and v2c agents drop requests with a wrong community without answering, so a wrong community looks like an
      agent that is not there (disconnected, commands time out). SETs need the write community the card is
      configured with (write_community), or a v3 user with write access.
  - models: [all]
    severity: info
    text: >
      Opening for commands only walks nothing; a GET of sysUpTime.0 each interval stays as the liveness check, and
      notifications are still received.
