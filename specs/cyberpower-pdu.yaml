    params:
      index: { type: int, min: 1, max: 4, required: true, label: Device config index, description: "The row of ePDU2DeviceConfigEntry to write, by its ePDU2DeviceConfigIndex." }
      value: { type: enum, values: [display_normal, display_reverse, display_rotate90, display_rotate270, display_auto], required: true, label: Value, description: "The new device config display orientation, as CPS-MIB names its values." }
    returns: ack
  set_device_config_coldstart_delay:
