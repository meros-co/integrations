commands:
  get_status:
    summary: "Read the power, volume, mute, input and picture size in one reply (0x00, §2.1.00 p.28)"
    params:
      display_id: { type: int, min: 0, max: 254, label: Display ID, description: "The display to address, by its ID; absent addresses the display_id setting's, 254 every display on the chain at once (unacknowledged)." }
    returns: value
  get_video:
    summary: "Read the video picture settings in one reply (0x04, §2.1.04 p.29)"
    params:
      display_id: { type: int, min: 0, max: 254, label: Display ID, description: "The display to address, by its ID; absent addresses the display_id setting's, 254 every display on the chain at once (unacknowledged)." }
    returns: value
  get_rgb:
    summary: "Read the PC-source picture settings and RGB gains in one reply (0x06, §2.1.06 p.30)"
    params:
      display_id: { type: int, min: 0, max: 254, label: Display ID, description: "The display to address, by its ID; absent addresses the display_id setting's, 254 every display on the chain at once (unacknowledged)." }
    returns: value
  get_pip_status:
    summary: "Read the PIP size and source (0x07, §2.1.07 p.31)"
    params:
      display_id: { type: int, min: 0, max: 254, label: Display ID, description: "The display to address, by its ID; absent addresses the display_id setting's, 254 every display on the chain at once (unacknowledged)." }
    returns: value
  get_maintenance:
    summary: "Read the maintenance status: power, PIP, lamp schedule, safety screen and video wall (0x08, §2.1.08 p.32)"
    params:
      display_id: { type: int, min: 0, max: 254, label: Display ID, description: "The display to address, by its ID; absent addresses the display_id setting's, 254 every display on the chain at once (unacknowledged)." }
    returns: value
  get_sound:
