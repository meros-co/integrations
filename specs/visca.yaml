quirks:
  - models: [all]
    severity: info
    text: >
      Opened for commands only (monitor false), the core sends no inquiry poll and no inquiry after a command
      to read back what it changed: state changes only when a reply to the host's own inquiry carries it. The
      version inquiry is still sent on the poll interval as the liveness check.
  - models: [all]
    severity: info
    text: >
      VISCA pushes nothing. The core polls zoom, focus and pan/tilt positions and the pan/tilt status
      every poll_position_ms (500 ms by default) and the settings in the state every poll_settings_ms (5
      s); an inquiry the camera answers with a syntax error is not polled again in that session. Every set
      command is followed by the matching inquiry.
  - models: [all]
    severity: info
    text: >
      A command completes on its Completion (90 5z FF), not on its ACK, so a preset recall or absolute
      move completes when the move ends. One message at a time awaits its first reply, as Sony requires
      (p.5, p.12); while both command sockets are busy further commands wait but inquiries still go, and
      'command buffer full' (90 60 03) is retried every 100 ms, up to 20 times. Errors map to device_error
      with the VISCA code: 01 message length, 02 syntax, 03 buffer full, 04 cancelled, 05 no socket, 41
      not executable.
  - models: [sony-visca-ip, sony-brc-x1000, birddog, lumens, marshall, aver, canon, datavideo]
    severity: info
    text: >
      Sony VISCA over IP: the core sends RESET (control command 01) on connecting and reports connected on
      its ACK. Sony says RESET sets the sequence number to 0 but not whether the next message must carry 0
      or 1; the core sends 1 next, and if the camera answers ERROR 0F 01 to a message that was not a
      retransmission it sends RESET and the message once more. On a reply timeout the message is sent
      again with the same sequence number; ERROR 0F 01 to that copy means the first was performed (p.12),
      and a command is then reported done.
  - models: [sony-visca-ip, sony-brc-x1000]
    severity: warning
    text: >
      Sony turns the tally lamp off when no controller has sent tally ON for 15 seconds over VISCA over IP
      (p.13). The core repeats ON every 10 s while it is on, so turning tally off from another controller
      is overridden until this session sends tally off.
  - models: [all]
    severity: warning
    text: >
      Positions, iris, shutter, gain and similar values are the camera's own codes, not degrees, f-stops
      or dB: the tables differ by model (SRG-X400 p.34-39, BRC-H800 p.29-31, PTZOptics and BirdDog give
      ranges only). Ranges in this spec are the widest any document gives; a model's own range is checked
      where the document states it (pan/tilt speeds, preset numbers and preset speeds) and otherwise the
      camera answers a syntax error.
  - models: [sony-visca-ip]
    severity: info
    text: >
      Preset numbers and preset speeds in Sony's lists are hexadecimal: presets 00-63 hex are 1-100, and
      the preset speed 01-19 hex is 25 steps, 19 being 300 deg/s pan (p.21, p.38). The SRG-X400/X120 list
      marks the matrix, gamma, knee, colour bar, overlay name, tally and H phase commands as BRC-X400/X401
      only.
  - models: [sony-visca-ip, sony-brc-x1000]
    severity: info
    text: >
      Sony's list describes the device setting command payload type as 0x0120 and the control
      command/reply as 0x0200/0x0201 (p.11), which is what the core sends.
  - models: [sony-visca-ip, sony-brc-x1000]
    severity: warning
    text: >
      Sony: do not send commands other than Address Set, IF_Clear, Cancel and power while the camera's
      menu is displayed (p.7); close it with menu off first. To cancel a pan/tilt drive, wait 200 ms after
      starting it, and wait 200 ms after 'command cancelled' before driving again (p.6).
  - models: [sony-brc-x1000]
    severity: info
    text: >
      BRC-X1000/H800 positions: pan is five nibbles, 10 degrees = 00937 to the left and FF6C9 to the right
      (H800 p.31), so left is positive; the SRG-X400 list gives DE00-2200 for -170 to +170 degrees without
      naming the direction (p.37). The core reads the pan width from each reply's length.
  - models: [ptzoptics]
    severity: warning
    text: >
      PTZOptics documents 'IP VISCA: TCP/IP-encapsulated VISCA' on TCP 5678 and UDP 1259 (HTTP API p.165,
      p.167) but not whether UDP 1259 carries Sony's 8-byte header. The core sends no header on either
      (transport raw-tcp, the default, or raw-udp); a camera that expects the header on UDP needs
      transport sony-ip and its port. Without sequence numbers, a command on UDP whose reply is lost is
      reported as a timeout rather than resent.
  - models: [ptzoptics]
    severity: warning
    text: >
      The 2026 PTZOptics VISCA API has entries that contradict the VISCA set and its own 2022 list:
      shutter up/down and direct are printed with the iris codes 0B/4B, gain direct as 0C, bright direct
      as 0D, DRC as a pan/tilt drive, FocusAFModeInq as 81 09 04 48 and FocusPosInq as 81 09 04 35, and
      the picture-effect inquiry lists 02 as off. The core uses the codes the 2022 list and Sony agree on
      (0A/4A shutter, 4C gain, 4D bright, 04 38 focus mode, 04 48 focus position).
  - models: [ptzoptics]
    severity: warning
    text: >
      On PTZOptics, recalling preset 96 (wire 5F) opens or closes the OSD menu (p.23). PTZOptics tally (81
      0A 02 02 0p), NDI mode, RTMP and other vendor commands are reachable with raw_command.
  - models: [birddog]
    severity: info
    text: >
      BirdDog writes the sequence number range as 0-0xFFFF; the core uses the full 32 bits Sony defines.
      BirdDog P400 white balance uses 04 for ATW and 05/06 for manual 1/2, so 'auto2' is ATW and the
      P400's manual 2 needs raw_command.
  - models: [lumens, marshall]
    severity: info
    text: >
      Lumens and Marshall number presets 0-127 with 3F 00/01/02 and 128-255 with 3F 10/11/12; preset 1
      here is wire 00, which Lumens says is preset 1 on the web page and remote (Lumens p.15).
  - models: [aver]
    severity: warning
    text: >
      AVer's guide documents only the transport and a few example messages. Absolute positions, limits and
      the full command set are not documented, so only drive, presets and power are listed; raw_command
      reaches the rest. AVer's example for preset 32 uses wire 20 hex, which suggests AVer numbers presets
      from 0; preset n here is wire n-1. PTZ310/330 firmware before 0.70 needs stop sent with sequence
      number 3 (p.2).
  - models: [aver]
    severity: info
    text: >
      AVer cameras can map functions (tracking on, presenter switch and so on) onto preset numbers ('VISCA
      Customized Function'); a mapped preset then runs the function instead of recalling a position (AVer
      guide p.4-6).
  - models: [canon]
    severity: warning
    text: >
      Canon's 'Standard Communication (IP)' must be enabled on the camera. With the default 'Response Port
      Number: Specified Port Number (52381)' replies go to the controller's UDP 52381, so the core binds
      52381 locally (shared with other Canon sessions); set fixed_reply_port false if the camera is set to
      reply to the source port. Canon's guide gives no command list, so only drive, presets and power are
      listed; raw_command reaches the rest.
  - models: [datavideo]
    severity: critical
    text: >
      Datavideo's protocol document covers RS-232/RS-422 only and gives no IP framing or port. The core
      defaults to Sony VISCA over IP on 52381; set transport and the port to what the camera's network
      settings show. Datavideo has no pan/tilt position inquiry, so pan/tilt is not polled successfully.
  - models: [all]
    severity: info
    text: >
      Panasonic AW cameras are not in this spec: Panasonic's own documents describe only its AW protocol
      (panasonic-ptz). A Panasonic or other camera that does speak Sony VISCA over IP can use the sony-
      visca-ip model.

state:
  power: { type: string, description: "'on', 'standby' or 'power_error'" }
  zoom.position: { type: int, description: "Zoom position, camera units (0000 wide)" }
  zoom.mode: { type: string, description: "'optical', 'clear_image' or 'digital'" }
  focus.position: { type: int, description: "Focus position, camera units" }
  focus.mode: { type: string, description: "'auto' or 'manual'" }
  focus.af_sensitivity: { type: string, description: "'high', 'normal' or 'low'" }
  focus.af_mode: { type: string, description: "'normal', 'interval' or 'zoom_trigger'" }
  focus.near_limit: { type: int, description: "Focus near limit, camera units" }
  pan_tilt.pan: { type: int, description: "Pan position, signed camera units" }
  pan_tilt.tilt: { type: int, description: "Tilt position, signed camera units" }
  pan_tilt.status.code: { type: int, description: "Raw pan/tilt status code (Sony p.39)" }
  pan_tilt.status.motion: { type: string, description: "'idle', 'moving', 'complete' or 'failed'" }
  pan_tilt.status.initialization: { type: string, description: "'not_initialized', 'initializing', 'initialized' or 'failed'" }
  pan_tilt.max_speed.pan: { type: int, description: "Maximum pan drive speed" }
  pan_tilt.max_speed.tilt: { type: int, description: "Maximum tilt drive speed" }
  pan_tilt.slow: { type: bool, description: "Pan/tilt slow mode" }
  pan_tilt.pan_reverse: { type: bool, description: "Pan reversed" }
  pan_tilt.tilt_reverse: { type: bool, description: "Tilt reversed" }
  white_balance.mode: { type: string, description: "'auto', 'indoor', 'outdoor', 'one_push', 'auto2', 'manual' or 'color_temperature'" }
  white_balance.red_gain: { type: int, description: "Red gain, 0-255 (128 = 0 on Sony)" }
  white_balance.blue_gain: { type: int, description: "Blue gain, 0-255 (128 = 0 on Sony)" }
  white_balance.speed: { type: int, description: "Auto white balance speed, 1-5" }
  white_balance.color_temperature: { type: int, description: "Colour temperature position, 0 = 2500 K, 100 K per step" }
  exposure.mode: { type: string, description: "'full_auto', 'manual', 'shutter_priority', 'iris_priority', 'bright' or 'gain_priority'" }
  exposure.iris: { type: int, description: "Iris position, camera table" }
  exposure.shutter: { type: int, description: "Shutter position, camera table" }
  exposure.gain: { type: int, description: "Gain position, camera table" }
  exposure.bright: { type: int, description: "Bright position" }
  exposure.gain_limit: { type: int, description: "Gain limit, camera table" }
  exposure.max_shutter: { type: int, description: "Fastest auto shutter, camera table" }
  exposure.min_shutter: { type: int, description: "Slowest auto shutter, camera table" }
  exposure.ae_speed: { type: int, description: "Auto exposure speed, 1-48" }
  exposure.auto_slow_shutter: { type: bool, description: "Auto slow shutter on" }
  exposure.compensation.enabled: { type: bool, description: "Exposure compensation on" }
  exposure.compensation.level: { type: int, description: "Exposure compensation level, 0-14 (7 = 0)" }
  exposure.backlight: { type: bool, description: "Backlight compensation on" }
  exposure.spotlight: { type: bool, description: "Spotlight compensation on" }
  exposure.high_sensitivity: { type: bool, description: "High sensitivity mode on" }
  exposure.visibility_enhancer: { type: bool, description: "Visibility enhancer on" }
  exposure.nd_filter: { type: string, description: "'off', 'nd4', 'nd16' or 'nd64'" }
  image.detail_level: { type: int, description: "Detail level, 0-15" }
  image.aperture_mode: { type: string, description: "Sharpness 'auto' or 'manual'" }
  image.noise_reduction: { type: int, description: "Noise reduction level (0 off; 7F on Sony means 2D/3D set separately)" }
  image.picture_effect: { type: string, description: "'off', 'negative' or 'black_white'" }
  image.flip: { type: bool, description: "Image flipped vertically" }
  image.mirror: { type: bool, description: "Image mirrored horizontally" }
  image.stabilizer: { type: bool, description: "Image stabiliser on" }
  image.freeze: { type: bool, description: "Picture frozen" }
  presets.last_recalled: { type: int, description: "Preset last recalled, from 1; null when none" }
  presets.speed_mode: { type: string, description: "'compatible', 'separate' or 'common'" }
  presets.common_speed: { type: int, description: "Recall speed shared by all presets" }
  tally.on: { type: bool, description: "Tally lamp on" }
  ir.receive: { type: bool, description: "IR remote accepted" }
  ir.cut_filter_night: { type: bool, description: "IR cut filter out (night)" }
  menu.open: { type: bool, description: "On-screen menu displayed" }
  device.vendor_id: { type: int, description: "VISCA vendor ID (0001 = Sony)" }
  device.model_id: { type: int, description: "VISCA model ID (Sony: 0617 SRG-X400, 0618 SRG-X120, 051C BRC-X400, p.6)" }
  device.rom_version: { type: int, description: "ROM revision" }
  device.sockets: { type: int, description: "Command sockets" }
  device.camera_id: { type: int, description: "Camera ID" }
