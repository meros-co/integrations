spec: 1
id: visca
name: VISCA PTZ cameras (Sony VISCA over IP, and VISCA over TCP/UDP)
vendor: Sony and others
category: camera
implementation: native
reason: >
  VISCA over IP numbers every message and the camera's replies carry that
  number; the session starts with a RESET handshake, lost messages are
  resent with the same number and the camera's sequence-error reply decides
  what happened. A command is answered twice, ACK naming one of two
  sockets and later Completion or an error for that socket, and the next
  message may go only after the previous one's first reply. Positions are
  written as nibbles whose count differs by model, and nothing is pushed,
  so state comes from paced polling.

source:
  - title: "Color Video Camera VISCA Command List, Software Version 2.00, BRC-X400/X401, SRG-X400/X402/201M2, SRG-X120/HD1M2 (E-042-100-12 (1), 2019)"
    author: "Sony Corporation"
    url: "https://shop.ccisolutions.com/StoreFront/jsp/pdf/SON-SRGX400_visca_commandList.pdf"
    note: >
      Manufacturer document, read from a dealer's copy because pro.sony refuses scripted downloads (Sony's
      own copy: https://pro.sony/support/res/manuals/5011/c63d0ae378bdbcf267ab0dc410789a99/50112501M.pdf).
      Packet, ACK/Completion/error replies, sockets and the 4V timing (p.4-5); IF_Clear, CAM_VersionInq,
      Cancel (p.6-7); camera-issued messages and error meanings (p.8); VISCA over IP: UDP 52381, up to 5
      controllers, header with payload types 0100/0110/0111/0120/0200/0201, payload length, 32-bit
      sequence number, RESET 01 and ACK 01, ERROR 0F01/0F02 (p.9-11); retransmission with the same
      sequence number and the lost-message table (p.12); limitations, including the 15-second tally expiry
      (p.13); command list (p.14-21); inquiry list (p.22-27); block inquiries (p.28-33); setting values:
      shutter, iris, gain, exposure compensation, pan/tilt range and speeds, preset speeds, zoom and focus
      positions (p.34-39); pan/tilt status code (p.39); preset modes (p.40).
  - title: "Color Video Camera Command List BRC-X1000/H800/H780 (C-456-100-14 (1), revision 2.02)"
    author: "Sony Corporation"
    url: "https://cdn.assetserver.net/_assets/sony/pdf/brch8001-manual.pdf"
    note: >
      Manufacturer document, from a reseller's asset server. Same VISCA over IP description (p.9-13, with
      the sequence-number timing charts on p.13); command list with five-nibble pan positions, ND filter,
      pan/tilt reverse, gain priority (p.14-18); inquiries (p.19-22); pan/tilt angles to position values,
      five pan nibbles (p.31); status code (p.33).
  - title: "PTZOptics VISCA API, Developer Documentation (API version 1.0, 2026-09-29)"
    author: "PTZOptics"
    url: "https://downloads.ptzoptics.com/docs/visca-api"
    note: >
      Manufacturer document (28 pages). Replies and errors (p.4-5); exposure and white balance (p.6-11),
      focus (p.12-14), image (p.15-16), pan/tilt drive and positions with VV WW and tilt speed to 0x14
      (p.17-18), zoom (p.21), network (p.22), OSD navigation (p.23), inquiries (p.24-27). Several entries
      are inconsistent; see the quirks.
  - title: "PTZOptics VISCA over IP Commands (2022-05-19)"
    author: "PTZOptics"
    url: "https://f.hubspotusercontent20.net/hubfs/418770/PTZOptics%20Documentation/Misc/PTZOptics%20VISCA%20over%20IP%20Commands.pdf"
    note: >
      Manufacturer document (3 pages): IF_Clear, presets 0-127 (CAM_Memory), the inquiry list with
      replies, and block inquiries. Used where the 2026 document omits or garbles an entry.
  - title: "PTZOptics HTTP API, Developer Documentation (API version 1.0, 2026-09-29)"
    author: "PTZOptics"
    url: "https://downloads.ptzoptics.com/docs/http-api"
    note: >
      VISCA TCP port default 5678 (p.165) and UDP port default 1259 (p.167).
  - title: "BirdDog X4 Series - VISCA over IP Commands (Rev. 2026-06-11)"
    author: "BirdDog"
    url: "https://birddog.tv/x4-series-visca-over-ip-commands/"
    note: >
      Manufacturer page: the 8-byte header with examples 01 00 00 09 00 00 00 00 81 01 06 01 09 09 03 01
      FF and 01 10 00 05 00 00 00 00 81 09 06 12 FF, default UDP port 52381, replies with type 01 11 and
      the sequence number echoed; absolute position with VV WW; 64 presets (00-3F); tally, AI tracking and
      other BirdDog extensions.
  - title: "BirdDog Eyes P400 Extended Command List (VISCA) (2021-03-22)"
    author: "BirdDog"
    url: "https://desk.birddog.tv/portal/en/kb/articles/visca-command-list-for-p400-attached"
    note: >
      Manufacturer attachment: exposure, white balance (04 ATW, 05 manual1, 06 manual2), picture and
      colour-matrix commands; block inquiry 81 09 7E 7E EE FF.
  - title: "RS135 - VC-A71P RS-232 command set (v1.4, 2021-06-28)"
    author: "Lumens"
    url: "https://www.mylumens.com/Download/RS135%20-%20VC-A71P%20RS-232%20command%20set_1_4.pdf"
    note: >
      Manufacturer document. Presets 0x00-0x7F and 128-255 through 3F 10/11/12 (p.15); pan/tilt drive
      speeds 01-18, stop 00 00 03 03, absolute and relative with VV WW and pan 0000-6A40 / 95C0-FFFF, tilt
      0000-3840 / ED40-FFFF (p.16); VISCA over IP on UDP 52381 with Sony's header (p.41-48).
  - title: "CV730-BK/WH Visca over RS232 & IP Command Set (2023-03-17)"
    author: "Marshall Electronics"
    url: "https://marshall-usa.com/pdf/CV730-BK-WH-RS-232-IP-commands-set.pdf"
    note: >
      Manufacturer document. Pan/tilt drive and absolute/relative positions with VV WW (p.12); presets
      0x00-0x7F and the second bank 3F 1x (p.14); VISCA over IP on UDP 52381 with Sony's header (p.37 on).
      The CV630-IP RS-232 command set (2020) gives the same IP section.
  - title: "AVer Pro-AV Quick Start Guide to Camera Control using Visca over IP (UDP) (updated 2024-01-26)"
    author: "AVer Information"
    url: "https://www.averusa.com/pro-av/downloads/quick-start/AVer%20Pro-AV%20QSG%20for%20PTZ%20Visca%20over%20IP-UDP%20v1.pdf"
    note: >
      Manufacturer guide: whole messages 01 00 00 09 00 00 00 01 81 01 06 01 08 08 03 01 FF (PT up), the
      inquiry 01 00 00 05 00 00 00 01 81 09 00 02 FF and power off 01 00 00 06 00 00 00 00 81 01 04 00 03
      FF (p.2); the PTZ310/330 stop quirk before firmware 0.70 (p.2); VISCA customised functions on
      presets (p.4-6); VISCA control port UDP 52381 (p.8).
  - title: "Remote Camera CR-N500/CR-N300 Settings Guide (2021)"
    author: "Canon"
    url: "https://www.adorama.com/col/productManuals/CACRN500B.pdf"
    note: >
      Manufacturer guide, read from a reseller's copy. Standard Communication (IP): enable, Response Port
      Number fixed (52381) or the source port, camera IP inquiry and network setting permissions (p.64);
      defaults, Response Port Number 'Specified Port Number (52381)' (p.103).
  - title: "The Datavideo PTZ and Block Camera Control Protocol (Rev 2.7, 2025-09-18)"
    author: "Datavideo"
    url: "https://datavideo.com/us/protocol/150/ptc-140-visca-control-protocol"
    note: >
      Manufacturer document (download 'Datavideo PTZ VISCA Commands_main V2.7_E4'). Serial VISCA only;
      presets 0-127 (p.12); pan/tilt speeds 01-12h and absolute position with five pan nibbles (p.13);
      tally and two-tally, preset speed 7E 01 0B with presets 0-50 (p.14); inquiries (p.16-20).
  - title: "Summary of PTZ Camera Control Protocol (Revision 1.01, September 2019)"
    author: "Panasonic"
    url: "https://na.panasonic.com/ns/268725_Summary_of_PRO_PTZ_Camera_Control_Protocols.pdf"
    note: >
      Panasonic's AW cameras are controlled by Panasonic's AW protocol (see panasonic-ptz); this summary
      and the AW-UE50/UE40 Operating Instructions (DVQP2618YA) name no VISCA transport, so no Panasonic
      model is listed here.

settings:
  # sony-ip (UDP with Sony's 8-byte header), raw-tcp or raw-udp (no header).
  # Unset: the model's own (raw-tcp for PTZOptics, sony-ip otherwise). The
  # port defaults to 52381, 5678 or 1259 by transport.
  transport: { type: enum, values: ["sony-ip", "raw-tcp", "raw-udp"] }
  # Bind local UDP 52381 because the camera replies there rather than to the
  # sending port. Unset: on for Canon, off otherwise.
  fixed_reply_port: { type: bool }
  # How often to poll zoom, focus and pan/tilt positions; 0 = never.
  poll_position_ms: { type: int, min: 0, max: 60000, default: 500 }
  # How often to poll the settings held in the state; 0 = never.
  poll_settings_ms: { type: int, min: 0, max: 600000, default: 5000 }

ports:
  - { port: 52381, protocol: udp, role: control, when: "transport sony-ip (the Sony, BirdDog, Lumens, Marshall, AVer, Canon and Datavideo models)" }
  - { port: 5678, protocol: tcp, role: control, when: "transport raw-tcp (PTZOptics)" }
  - { port: 1259, protocol: udp, role: control, when: "transport raw-udp (PTZOptics)" }

