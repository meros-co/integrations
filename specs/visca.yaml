commands:
  power:
    summary: "Power on, or to standby (CAM_Power 8x 01 04 00 0p: 2 on, 3 standby)"
    params:
      "on": { type: bool, default: true }
    returns: ack
  if_clear:
    summary: "Clear the camera's command buffers (IF_Clear 8x 01 00 01, sent as a device setting command; answered 90 50 FF)"
    returns: ack
  cancel:
    summary: "Cancel the command executing in a socket (8x 2z FF). The cancelled command fails with error 04"
    params:
      socket: { type: int, min: 1, max: 2, required: true }
    returns: ack
  camera_id:
    summary: "Set the camera ID, 0000-FFFF (8x 01 04 22 0p 0p 0p 0p)"
    params:
      id: { type: int, min: 0, max: 65535, required: true }
    returns: ack
  raw_command:
    summary: "Send any VISCA command, given as hex '81 01 ... FF' (3-16 bytes, FF only at the end); completes on Completion. For vendor commands not modelled here"
    params:
      hex: { type: string, max_length: 64, pattern: "^[0-9A-Fa-f ]+$", required: true }
    returns: ack
  raw_inquiry:
    summary: "Send any VISCA inquiry, given as hex '81 09 ... FF'; returns the whole reply as hex"
    params:
      hex: { type: string, max_length: 64, pattern: "^[0-9A-Fa-f ]+$", required: true }
    returns: value
  zoom:
    summary: "Zoom tele or wide, at the standard speed or a variable speed 0 (low) - 7 (high), or stop (8x 01 04 07 ...)"
    params:
      action: { type: enum, values: ["tele", "wide", "stop"], required: true }
      speed: { type: int, min: 0, max: 7 }
    returns: ack
  zoom_to:
    summary: "Zoom to a position, 0000 (wide) to the model's tele end: 4000 optical on SRG-X400, 7AC0 with digital zoom (p.39); written as four nibbles (8x 01 04 47 0z 0z 0z 0z)"
    params:
      position: { type: int, min: 0, max: 31424, required: true }
    returns: ack
  zoom_mode:
    summary: "Optical only, Clear Image Zoom or digital zoom (8x 01 04 06 0p)"
    params:
      mode: { type: enum, values: ["optical", "clear_image", "digital"], required: true }
    returns: ack
  focus:
    summary: "Focus far or near, at the standard speed or a variable speed 0-7, or stop (8x 01 04 08 ...)"
    params:
      action: { type: enum, values: ["far", "near", "stop"], required: true }
      speed: { type: int, min: 0, max: 7 }
    returns: ack
  focus_to:
    summary: "Focus to a position, 1000 (far, infinity) to F000 (near) on Sony (p.39); four nibbles (8x 01 04 48)"
    params:
      position: { type: int, min: 0, max: 61440, required: true }
    returns: ack
  focus_mode:
