codes:
  "400": command not understood
  "401": illegal video channel
  "402": parameter missing
  "403": illegal parameter
  "404": media file not found
  "500": internal server error
  "501": internal server error
  "502": media file unreadable
  "503": access error

state:
  server.version: { type: string, description: "The server's version, as VERSION answers it" }
  server.components.*: { type: string, description: "Version of a component, keyed server, flash, templatehost or cef, as VERSION <component> answers it" }
  channels.*.format: { type: string, description: "The channel's video format (PAL, 1080i5000 ...), from INFO and the OSC format message" }
  channels.*.status: { type: string, description: "The channel's status as INFO lists it (PLAYING)" }
  channels.*.profiler.actual: { type: float, description: "Seconds the channel took to render its last frame (OSC profiler/time)" }
  channels.*.profiler.expected: { type: float, description: "Seconds the channel has to render each frame (OSC profiler/time)" }
  channels.*.outputs.*.type: { type: string, description: "Type of the consumer on this output port: screen, system-audio, decklink, bluefish, file" }
  channels.*.outputs.*.frames: { type: int, description: "Frames the consumer on this port has produced" }
  channels.*.outputs.*.max_frames: { type: int, description: "Most frames the consumer on this port can produce" }
  channels.*.audio.channels: { type: int, description: "Audio channels in use on the channel (OSC mixer/audio/nb_channels)" }
  channels.*.audio.levels.*: { type: float, description: "Level of an audio channel, numbered from 1, in dBFS" }
  channels.*.mixer.master_volume: { type: float, description: "The channel's master volume, 1 its original level (MIXER MASTERVOLUME, read back)" }
  channels.*.mixer.straight_alpha_output: { type: bool, description: "Whether the channel outputs straight alpha (MIXER STRAIGHT_ALPHA_OUTPUT, read back)" }
  channels.*.layers.*.time: { type: float, description: "Seconds the layer has been active" }
  channels.*.layers.*.frame: { type: int, description: "Frames the layer has been active" }
  channels.*.layers.*.type: { type: string, description: "Type of what plays on the layer (transition, or the producer's)" }
  channels.*.layers.*.background_type: { type: string, description: "Type of what is loaded in the layer's background (empty when nothing is)" }
  channels.*.layers.*.profiler.actual: { type: float, description: "Seconds the layer took for its last frame" }
  channels.*.layers.*.profiler.expected: { type: float, description: "Seconds the layer has for each frame" }
  channels.*.layers.*.paused: { type: bool, description: "Whether the layer is paused" }
  channels.*.layers.*.loop: { type: bool, description: "Whether the file on the layer loops (OSC on 2.1 and earlier, and CALL LOOP's answer)" }
  channels.*.layers.*.host.path: { type: string, description: "File of the Flash template host on the layer" }
  channels.*.layers.*.host.width: { type: int, description: "Width of the Flash template host in pixels" }
  channels.*.layers.*.host.height: { type: int, description: "Height of the Flash template host in pixels" }
  channels.*.layers.*.host.fps: { type: float, description: "Frame rate of the Flash template host" }
  channels.*.layers.*.file.name: { type: string, description: "Name of the media file playing (2.2 onwards)" }
  channels.*.layers.*.file.path: { type: string, description: "Path of the media file playing: absolute from 2.2, relative to the media folder before" }
  channels.*.layers.*.file.elapsed: { type: float, description: "Seconds of the file played, in seconds" }
  channels.*.layers.*.file.duration: { type: float, description: "Length of the file, in seconds" }
  channels.*.layers.*.file.frame: { type: int, description: "Frames of the file played (2.1 and earlier)" }
  channels.*.layers.*.file.frames: { type: int, description: "Frames in the file (2.1 and earlier)" }
  channels.*.layers.*.file.fps: { type: float, description: "Frame rate of the file (2.1 and earlier)" }
  channels.*.layers.*.file.streams.*.fps: { type: float, description: "Frame rate of one of the file's streams, by stream id (2.2 onwards)" }
  channels.*.layers.*.file.video.width: { type: int, description: "Frame width of the video, in pixels" }
  channels.*.layers.*.file.video.height: { type: int, description: "Frame height of the video, in pixels" }
  channels.*.layers.*.file.video.field: { type: string, description: "Scan of the video: progressive or interlaced" }
  channels.*.layers.*.file.video.codec: { type: string, description: "Codec of the video" }
  channels.*.layers.*.file.audio.sample_rate: { type: int, description: "Sample rate of the audio, in hertz" }
  channels.*.layers.*.file.audio.channels: { type: int, description: "Channels in the audio track" }
  channels.*.layers.*.file.audio.format: { type: string, description: "Sample format of the audio (s16)" }
  channels.*.layers.*.file.audio.codec: { type: string, description: "Codec of the audio" }
  channels.*.layers.*.mixer.keyer: { type: bool, description: "Keyer of the layer (MIXER KEYER, read back): use this layer as the key (alpha) of the layer above, and hide it" }
  channels.*.layers.*.mixer.blend: { type: string, description: "Blend mode of the layer (MIXER BLEND, read back): how the layer is composited over what lies below it" }
  channels.*.layers.*.mixer.opacity: { type: float, description: "Opacity of the layer (MIXER OPACITY, read back): 0 transparent to 1 opaque" }
  channels.*.layers.*.mixer.brightness: { type: float, description: "Brightness of the layer (MIXER BRIGHTNESS, read back): 0 to 1, 1 unchanged" }
  channels.*.layers.*.mixer.saturation: { type: float, description: "Saturation of the layer (MIXER SATURATION, read back): 0 to 1, 1 unchanged" }
  channels.*.layers.*.mixer.contrast: { type: float, description: "Contrast of the layer (MIXER CONTRAST, read back): 0 to 1, 1 unchanged" }
  channels.*.layers.*.mixer.levels.min_input: { type: float, description: "Minimum input of the layer (MIXER LEVELS, read back): lowest RGB value accepted, 0 to 1" }
  channels.*.layers.*.mixer.levels.max_input: { type: float, description: "Maximum input of the layer (MIXER LEVELS, read back): highest RGB value accepted, 0 to 1" }
  channels.*.layers.*.mixer.levels.gamma: { type: float, description: "Gamma of the layer (MIXER LEVELS, read back): gamma applied, 1 unchanged" }
  channels.*.layers.*.mixer.levels.min_output: { type: float, description: "Minimum output of the layer (MIXER LEVELS, read back): lowest RGB value output, 0 to 1" }
  channels.*.layers.*.mixer.levels.max_output: { type: float, description: "Maximum output of the layer (MIXER LEVELS, read back): highest RGB value output, 0 to 1" }
  channels.*.layers.*.mixer.fill.x: { type: float, description: "X of the layer (MIXER FILL, read back): left edge, 0 the screen's left, 1 its right; outside 0-1 allowed" }
  channels.*.layers.*.mixer.fill.y: { type: float, description: "Y of the layer (MIXER FILL, read back): top edge, 0 the screen's top, 1 its bottom; outside 0-1 allowed" }
  channels.*.layers.*.mixer.fill.x_scale: { type: float, description: "Horizontal scale of the layer (MIXER FILL, read back): 1 the screen's width; negative flips the layer" }
  channels.*.layers.*.mixer.fill.y_scale: { type: float, description: "Vertical scale of the layer (MIXER FILL, read back): 1 the screen's height; negative flips the layer" }
  channels.*.layers.*.mixer.clip.x: { type: float, description: "X of the layer (MIXER CLIP, read back): left edge of the viewport, 0 the screen's left, 1 its right" }
  channels.*.layers.*.mixer.clip.y: { type: float, description: "Y of the layer (MIXER CLIP, read back): top edge of the viewport, 0 the screen's top, 1 its bottom" }
  channels.*.layers.*.mixer.clip.width: { type: float, description: "Width of the layer (MIXER CLIP, read back): width of the viewport, 1 the screen's width" }
  channels.*.layers.*.mixer.clip.height: { type: float, description: "Height of the layer (MIXER CLIP, read back): height of the viewport, 1 the screen's height" }
  channels.*.layers.*.mixer.anchor.x: { type: float, description: "X of the layer (MIXER ANCHOR, read back): anchor across the layer, 0 its left edge, 1 its right" }
  channels.*.layers.*.mixer.anchor.y: { type: float, description: "Y of the layer (MIXER ANCHOR, read back): anchor down the layer, 0 its top edge, 1 its bottom" }
  channels.*.layers.*.mixer.crop.left: { type: float, description: "Left of the layer (MIXER CROP, read back): how far in from the left edge the layer is cropped, 0 to 1" }
  channels.*.layers.*.mixer.crop.top: { type: float, description: "Top of the layer (MIXER CROP, read back): how far in from the top edge the layer is cropped, 0 to 1" }
  channels.*.layers.*.mixer.crop.right: { type: float, description: "Right of the layer (MIXER CROP, read back): where the right edge is cropped to, 1 not at all" }
  channels.*.layers.*.mixer.crop.bottom: { type: float, description: "Bottom of the layer (MIXER CROP, read back): where the bottom edge is cropped to, 1 not at all" }
  channels.*.layers.*.mixer.rotation: { type: float, description: "Angle of the layer (MIXER ROTATION, read back): clockwise rotation around the anchor point, in degrees" }
  channels.*.layers.*.mixer.perspective.top_left_x: { type: float, description: "Top left X of the layer (MIXER PERSPECTIVE, read back): x of the top left corner, 0 the screen's left, 1 its right" }
  channels.*.layers.*.mixer.perspective.top_left_y: { type: float, description: "Top left Y of the layer (MIXER PERSPECTIVE, read back): y of the top left corner, 0 the screen's top, 1 its bottom" }
  channels.*.layers.*.mixer.perspective.top_right_x: { type: float, description: "Top right X of the layer (MIXER PERSPECTIVE, read back): x of the top right corner" }
  channels.*.layers.*.mixer.perspective.top_right_y: { type: float, description: "Top right Y of the layer (MIXER PERSPECTIVE, read back): y of the top right corner" }
  channels.*.layers.*.mixer.perspective.bottom_right_x: { type: float, description: "Bottom right X of the layer (MIXER PERSPECTIVE, read back): x of the bottom right corner" }
  channels.*.layers.*.mixer.perspective.bottom_right_y: { type: float, description: "Bottom right Y of the layer (MIXER PERSPECTIVE, read back): y of the bottom right corner" }
  channels.*.layers.*.mixer.perspective.bottom_left_x: { type: float, description: "Bottom left X of the layer (MIXER PERSPECTIVE, read back): x of the bottom left corner" }
  channels.*.layers.*.mixer.perspective.bottom_left_y: { type: float, description: "Bottom left Y of the layer (MIXER PERSPECTIVE, read back): y of the bottom left corner" }
  channels.*.layers.*.mixer.mipmap: { type: bool, description: "Mipmapping of the layer (MIXER MIPMAP, read back): filter the layer with mipmaps, reducing aliasing when it is scaled down or distorted" }
  channels.*.layers.*.mixer.volume: { type: float, description: "Volume of the layer (MIXER VOLUME, read back): gain of the layer's audio, 1 its original level; above 1 amplifies" }
  channels.*.layers.*.mixer.chroma.enabled: { type: bool, description: "Whether the layer's chroma key is on (MIXER CHROMA, read back)" }
  channels.*.layers.*.mixer.chroma.target_hue: { type: float, description: "Chroma key target hue: hue at the center of the keyed range, in degrees" }
  channels.*.layers.*.mixer.chroma.hue_width: { type: float, description: "Chroma key hue width: width of the keyed hue range, 1 the whole 360 degrees" }
  channels.*.layers.*.mixer.chroma.min_saturation: { type: float, description: "Chroma key minimum saturation: least saturation a color needs to be keyed, 0 to 1" }
  channels.*.layers.*.mixer.chroma.min_brightness: { type: float, description: "Chroma key minimum brightness: least brightness a color needs to be keyed, 0 to 1" }
  channels.*.layers.*.mixer.chroma.softness: { type: float, description: "Chroma key softness: softness of the key's edges" }
  channels.*.layers.*.mixer.chroma.spill_suppress: { type: float, description: "Chroma key spill suppression: hue range around the target pulled to its edges, in degrees, 0 to 180" }
  channels.*.layers.*.mixer.chroma.spill_suppress_saturation: { type: float, description: "Chroma key spill saturation: saturation kept on colors whose spill was suppressed, 0 to 1" }
  channels.*.layers.*.mixer.chroma.show_mask: { type: bool, description: "Whether the chroma key shows its mask only" }
  media.*.type: { type: string, description: "Kind of media file, keyed by name: MOVIE, STILL or AUDIO (CLS)" }
  media.*.size: { type: int, description: "Size of the media file in bytes" }
  media.*.modified: { type: string, description: "When the media file was last changed, YYYYMMDDHHmmss" }
  media.*.frames: { type: int, description: "Frames in the media file" }
  media.*.frame_rate: { type: string, description: "Frame duration of the media file as a fraction of a second, 1/25 for 25 frames a second" }
  templates.*.listed: { type: bool, description: "A template, keyed by its name, is listed by TLS" }
  fonts.*: { type: string, description: "A font as FLS lists it (its name and path), in list order from 0" }
  datasets.*: { type: string, description: "A stored dataset as DATA LIST lists it, in list order from 0" }
  thumbnails.*.modified: { type: string, description: "When the thumbnail was made, YYYYMMDDTHHmmss, keyed by media name" }
  thumbnails.*.size: { type: int, description: "Size of the thumbnail in bytes" }

telemetry:
  # The OSC state the server sends this connection's address (OSC Protocol,
  # Connection): every active channel, output and layer, each frame.
  osc:
    listen_port: { setting: osc_port }
  # What OSC does not carry is read over AMCP: the channel list often, and
  # the media, template, font, dataset and thumbnail lists and the version
  # now and then (a library can hold thousands of files).
  poll:
    - every_ms: 10000
      send: ["INFO"]
    - every_ms: 60000
      send: ["VERSION", "CLS", "TLS", "FLS", "DATA LIST", "THUMBNAIL LIST"]
  updates:
    - { match: "^201 MIXER OK\\n(\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) KEYER$", state: { "channels.{2}.layers.{3}.mixer.keyer": { value: "{1}", map: { "0": false, "1": true } } } }
    - { match: "^201 MIXER OK\\n(\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) BLEND$", state: { "channels.{2}.layers.{3}.mixer.blend": "{1}" } }
    - { match: "^201 MIXER OK\\n(\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) OPACITY$", state: { "channels.{2}.layers.{3}.mixer.opacity": "{1}" } }
    - { match: "^201 MIXER OK\\n(\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) BRIGHTNESS$", state: { "channels.{2}.layers.{3}.mixer.brightness": "{1}" } }
    - { match: "^201 MIXER OK\\n(\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) SATURATION$", state: { "channels.{2}.layers.{3}.mixer.saturation": "{1}" } }
    - { match: "^201 MIXER OK\\n(\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) CONTRAST$", state: { "channels.{2}.layers.{3}.mixer.contrast": "{1}" } }
    - { match: "^201 MIXER OK\\n(\\S+) (\\S+) (\\S+) (\\S+) (\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) LEVELS$", state: { "channels.{6}.layers.{7}.mixer.levels.min_input": "{1}", "channels.{6}.layers.{7}.mixer.levels.max_input": "{2}", "channels.{6}.layers.{7}.mixer.levels.gamma": "{3}", "channels.{6}.layers.{7}.mixer.levels.min_output": "{4}", "channels.{6}.layers.{7}.mixer.levels.max_output": "{5}" } }
    - { match: "^201 MIXER OK\\n(\\S+) (\\S+) (\\S+) (\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) FILL$", state: { "channels.{5}.layers.{6}.mixer.fill.x": "{1}", "channels.{5}.layers.{6}.mixer.fill.y": "{2}", "channels.{5}.layers.{6}.mixer.fill.x_scale": "{3}", "channels.{5}.layers.{6}.mixer.fill.y_scale": "{4}" } }
    - { match: "^201 MIXER OK\\n(\\S+) (\\S+) (\\S+) (\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) CLIP$", state: { "channels.{5}.layers.{6}.mixer.clip.x": "{1}", "channels.{5}.layers.{6}.mixer.clip.y": "{2}", "channels.{5}.layers.{6}.mixer.clip.width": "{3}", "channels.{5}.layers.{6}.mixer.clip.height": "{4}" } }
    - { match: "^201 MIXER OK\\n(\\S+) (\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) ANCHOR$", state: { "channels.{3}.layers.{4}.mixer.anchor.x": "{1}", "channels.{3}.layers.{4}.mixer.anchor.y": "{2}" } }
    - { match: "^201 MIXER OK\\n(\\S+) (\\S+) (\\S+) (\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) CROP$", state: { "channels.{5}.layers.{6}.mixer.crop.left": "{1}", "channels.{5}.layers.{6}.mixer.crop.top": "{2}", "channels.{5}.layers.{6}.mixer.crop.right": "{3}", "channels.{5}.layers.{6}.mixer.crop.bottom": "{4}" } }
    - { match: "^201 MIXER OK\\n(\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) ROTATION$", state: { "channels.{2}.layers.{3}.mixer.rotation": "{1}" } }
    - { match: "^201 MIXER OK\\n(\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) PERSPECTIVE$", state: { "channels.{9}.layers.{10}.mixer.perspective.top_left_x": "{1}", "channels.{9}.layers.{10}.mixer.perspective.top_left_y": "{2}", "channels.{9}.layers.{10}.mixer.perspective.top_right_x": "{3}", "channels.{9}.layers.{10}.mixer.perspective.top_right_y": "{4}", "channels.{9}.layers.{10}.mixer.perspective.bottom_right_x": "{5}", "channels.{9}.layers.{10}.mixer.perspective.bottom_right_y": "{6}", "channels.{9}.layers.{10}.mixer.perspective.bottom_left_x": "{7}", "channels.{9}.layers.{10}.mixer.perspective.bottom_left_y": "{8}" } }
    - { match: "^201 MIXER OK\\n(\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) MIPMAP$", state: { "channels.{2}.layers.{3}.mixer.mipmap": { value: "{1}", map: { "0": false, "1": true } } } }
    - { match: "^201 MIXER OK\\n(\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) VOLUME$", state: { "channels.{2}.layers.{3}.mixer.volume": "{1}" } }
    - { match: "^201 MIXER OK\\n(\\S+)$", request_match: "^MIXER (\\d+) MASTERVOLUME$", state: { "channels.{2}.mixer.master_volume": "{1}" } }
    - { match: "^201 MIXER OK\\n(\\S+)$", request_match: "^MIXER (\\d+) STRAIGHT_ALPHA_OUTPUT$", state: { "channels.{2}.mixer.straight_alpha_output": { value: "{1}", map: { "0": false, "1": true } } } }
    - { match: "^20[12] MIXER OK\\n(\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+) (\\S+)$", request_match: "^MIXER (\\d+)-(\\d+) CHROMA$", state: { "channels.{10}.layers.{11}.mixer.chroma.enabled": { value: "{1}", map: { "0": false, "1": true } }, "channels.{10}.layers.{11}.mixer.chroma.target_hue": "{2}", "channels.{10}.layers.{11}.mixer.chroma.hue_width": "{3}", "channels.{10}.layers.{11}.mixer.chroma.min_saturation": "{4}", "channels.{10}.layers.{11}.mixer.chroma.min_brightness": "{5}", "channels.{10}.layers.{11}.mixer.chroma.softness": "{6}", "channels.{10}.layers.{11}.mixer.chroma.spill_suppress": "{7}", "channels.{10}.layers.{11}.mixer.chroma.spill_suppress_saturation": "{8}", "channels.{10}.layers.{11}.mixer.chroma.show_mask": { value: "{9}", map: { "0": false, "1": true } } } }
    - { match: "^200 INFO OK", request_match: "^INFO$", match_each: "(?m)^(\\d+) (\\S+) (\\S+)$", state: { "channels.{1}.format": "{2}", "channels.{1}.status": "{3}" } }
    - { match: "^200 CLS OK", request_match: "^CLS$", match_each: "(?m)^\"([^\"]+)\" +(MOVIE|STILL|AUDIO) +(\\d+) +(\\d+) +(\\d+) +(\\S+)", replace: "media", state: { "media.{1:key}.type": "{2}", "media.{1:key}.size": "{3}", "media.{1:key}.modified": "{4}", "media.{1:key}.frames": "{5}", "media.{1:key}.frame_rate": "{6}" } }
    - { match: "^200 TLS OK", request_match: "^TLS$", match_each: "(?m)^\"([^\"]+)\"", replace: "templates", state: { "templates.{1:key}.listed": "true" } }
    - { match: "^200 TLS OK", request_match: "^TLS$", match_each: "(?m)^([^\"\\n]+)$", replace: "templates", state: { "templates.{1:key}.listed": "true" } }
    - { match: "^200 FLS OK", request_match: "^FLS$", match_each: "(?m)^(.+)$", replace: "fonts", state: { "fonts.{index}": "{1}" } }
    - { match: "^200 DATA LIST OK", request_match: "^DATA LIST$", match_each: "(?m)^(.+)$", replace: "datasets", state: { "datasets.{index}": "{1}" } }
    - { match: "^200 THUMBNAIL LIST OK", request_match: "^THUMBNAIL LIST$", match_each: "(?m)^\"([^\"]+)\" +(\\S+) +(\\d+)", replace: "thumbnails", state: { "thumbnails.{1:key}.modified": "{2}", "thumbnails.{1:key}.size": "{3}" } }
    - { match: "^201 VERSION OK\\n(.+)$", request_match: "^VERSION$", state: { "server.version": "{1}" } }
    - { match: "^201 VERSION OK\\n(.+)$", request_match: "^VERSION (SERVER|FLASH|TEMPLATEHOST|CEF)$", state: { "server.components.{2:lower}": "{1}" } }
    - { match: "^201 CALL OK\\n([01])$", request_match: "^CALL (\\d+)-(\\d+) LOOP(?: [01])?$", state: { "channels.{2}.layers.{3}.loop": { value: "{1}", map: { "0": false, "1": true } } } }
    - { match: "^202 CLEAR OK$", request_match: "^CLEAR (\\d+)-(\\d+)$", state: { "channels.{1}.layers.{2}": { delete: true } } }
    - { match: "^202 CLEAR OK$", request_match: "^CLEAR (\\d+)$", state: { "channels.{1}.layers": { delete: true } } }
    - { match: "^202 STOP OK$", request_match: "^STOP (\\d+)-(\\d+)$", state: { "channels.{1}.layers.{2}.file": { delete: true } } }
    - { match: "^202 MIXER OK$", request_match: "^MIXER (\\d+)-(\\d+) CLEAR$", state: { "channels.{1}.layers.{2}.mixer": { delete: true } } }
    - { match: "^202 MIXER OK$", request_match: "^MIXER (\\d+) CLEAR$", state: { "channels.{1}.mixer": { delete: true } } }
    - { address: "^/channel/(\\d+)/format$", state: { "channels.{1}.format": "{arg0}" } }
    - { address: "^/channel/(\\d+)/profiler/time$", state: { "channels.{1}.profiler.actual": "{arg0}", "channels.{1}.profiler.expected": "{arg1}" } }
    - { address: "^/channel/(\\d+)/output/port/(\\d+)/type$", state: { "channels.{1}.outputs.{2}.type": "{arg0}" } }
    - { address: "^/channel/(\\d+)/output/port/(\\d+)/frame$", state: { "channels.{1}.outputs.{2}.frames": "{arg0}", "channels.{1}.outputs.{2}.max_frames": "{arg1}" } }
    - { address: "^/channel/(\\d+)/mixer/audio/nb_channels$", state: { "channels.{1}.audio.channels": "{arg0}" } }
    - { address: "^/channel/(\\d+)/mixer/audio/(\\d+)/dBFS$", state: { "channels.{1}.audio.levels.{2}": "{arg0}" } }
    - { address: "^/channel/(\\d+)/stage/layer/(\\d+)/(?:foreground/)?time$", state: { "channels.{1}.layers.{2}.time": "{arg0}" } }
    - { address: "^/channel/(\\d+)/stage/layer/(\\d+)/(?:foreground/)?frame$", state: { "channels.{1}.layers.{2}.frame": "{arg0}" } }
    - { address: "^/channel/(\\d+)/stage/layer/(\\d+)/(?:foreground/)?type$", state: { "channels.{1}.layers.{2}.type": "{arg0}" } }
    - { address: "^/channel/(\\d+)/stage/layer/(\\d+)/background/type$", state: { "channels.{1}.layers.{2}.background_type": "{arg0}" } }
    - { address: "^/channel/(\\d+)/stage/layer/(\\d+)/(?:foreground/)?profiler/time$", state: { "channels.{1}.layers.{2}.profiler.actual": "{arg0}", "channels.{1}.layers.{2}.profiler.expected": "{arg1}" } }
    - { address: "^/channel/(\\d+)/stage/layer/(\\d+)/(?:foreground/)?paused$", state: { "channels.{1}.layers.{2}.paused": { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } } }
    - { address: "^/channel/(\\d+)/stage/layer/(\\d+)/(?:foreground/)?loop$", state: { "channels.{1}.layers.{2}.loop": { value: "{arg0}", map: { "true": true, "false": false, "1": true, "0": false } } } }
    - { address: "^/channel/(\\d+)/stage/layer/(\\d+)/(?:foreground/)?host/path$", state: { "channels.{1}.layers.{2}.host.path": "{arg0}" } }
