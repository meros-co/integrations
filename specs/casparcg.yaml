spec: 1
id: casparcg
name: CasparCG Server
vendor: CasparCG
category: playback

source:
  - title: AMCP Protocol (CasparCG documentation, casparcg.com/docs/wiki, protocols/amcp-protocol)
    url: https://casparcg.com/docs/wiki/protocols/amcp-protocol
    note: >
      The project's own protocol reference, moved from the GitHub wiki
      (github.com/CasparCG/help/wiki/AMCP-Protocol, now unmaintained; the same
      content). Documentation of a GPL-licensed server, read for its facts
      only; no server code was read. Communication (UTF-8, CRLF after each
      command, case-insensitive, quoted parameters), special sequences (\",
      \\, \n), return codes 100-503, every command's syntax and examples:
      LOADBG, LOAD, PLAY, PAUSE, RESUME, STOP, CLEAR, CALL, SWAP, ADD,
      REMOVE, PRINT, LOG LEVEL and CATEGORY, SET, LOCK, PING, DATA, CG, MIXER
      (each property's set and get form and reply), CHANNEL_GRID, THUMBNAIL,
      CINF, CLS, FLS, TLS, VERSION, INFO and its forms, DIAG, GL, BYE, KILL,
      RESTART, HELP, and batching (BEGIN, COMMIT, DISCARD with REQ/RES)
  - title: OSC Protocol (CasparCG documentation, protocols/osc-protocol)
    url: https://casparcg.com/docs/wiki/protocols/osc-protocol
    note: >
      The OSC client the server starts for each AMCP connection, aimed at the
      client's address on the configured default-port (6250 in the example
      configuration), predefined clients, and the channel, output, stage
      (layer), Flash host and mixer audio addresses with their example
      arguments
  - title: FFmpeg Producer (CasparCG documentation, server/producers/ffmpeg-producer)
    url: https://casparcg.com/docs/wiki/server/producers/ffmpeg-producer
    note: >
      LOOP, SEEK, START, LENGTH and FILTER parameters; the CALL functions
      LOOP (answering its value), SEEK with REL, IN, OUT and END, START and
      LENGTH; the producer's OSC data for 2.2 onwards and for 2.1 and earlier
  - title: Mixer and Configuration (CasparCG documentation, server/mixer, server/configuration)
    url: https://casparcg.com/docs/wiki/server/mixer
    note: >
      The blend modes and the animation types (tweens) the MIXER commands
      take; the configuration page's video format table (the values of SET
      MODE) and the OSC and controller configuration; layers 0 to 9999 from
      the Channels page
  - title: companion-module-casparcg-server (MIT)
    url: https://github.com/bitfocus/companion-module-casparcg-server
    note: >
      MIT licence (top-level LICENSE). Read, not copied, as corroboration of
      the reply framing the documentation states (101, 201 and 400 followed
      by one line, 200 by lines up to a blank line), of the quoted clip name
      first on each CLS line, and of TLS lines being bare template names from
      2.2 and quoted names with more fields before (index.js)
  - title: casparcg-connection (SuperFlyTV, MIT)
    url: https://github.com/SuperFlyTV/casparcg-connection
    note: >
      MIT licence (top-level LICENSE). Read, not copied, for corroboration:
      the reply line form "[RES id ]code [command ]OK|ERROR|FAILED", the CLS
      line fields (quoted name, MOVIE|STILL|AUDIO, size, date, frames, frame
      rate as a fraction), the INFO line form "1 720p5000 PLAYING", and that
      PING takes no REQ wrapper (src/connection.ts, src/deserializers)

transport:
  type: line-tcp
  port: 5250
  framing: terminated
  terminator: crlf
  encoding: utf-8
  timeout_ms: 5000
  reply: expected
  # 200 is followed by lines up to a blank line, 101, 201, 400 and 500 by
  # one line of data; 100, 202 and the other errors are one line (Return
  # Codes). 1xx tell of events and are no reply; PING answers PONG.
  reply_framing: headed-block
  reply_block_header: "^200 "
  reply_line_header: "^(101|201|400|500) "
  reply_match: "^([2-5][0-9][0-9] |PONG)"
  probe: "VERSION"

settings:
  osc_port: { type: int, min: 1, max: 65535, default: 6250, label: OSC port, description: "Local UDP port the server sends its OSC state to: the default-port in the osc section of casparcg.config (6250 unless changed); leave empty for no OSC state." }

ports:
  - { port: 5250, protocol: tcp, role: control, note: "AMCP, the tcp controller of casparcg.config (5250 by default)" }
  - { port: 6250, protocol: udp, role: feedback, listener: core, setting: osc_port, note: "OSC state the server sends to each AMCP client's address" }

models:
  - id: server-2
    name: CasparCG Server 2.x
    supports:
      [load_background, load_background_with_parameters, load, load_with_parameters,
       play, play_clip, play_clip_with_parameters, pause,
       resume, stop, clear_layer, clear_channel,
       call, set_loop, get_loop, seek,
       seek_relative, set_start, set_length, swap_layers,
       swap_channels, add_consumer, add_consumer_at_index, remove_consumer,
       remove_consumer_at_index, print, set_log_level, set_log_category,
       set_video_mode, set_channel_layout, lock_channel, unlock_channel,
       clear_channel_lock, ping, data_store, data_retrieve,
       data_list, data_list_folder, data_remove, cg_add,
       cg_add_without_data, cg_play, cg_stop, cg_next,
       cg_remove, cg_clear, cg_update, cg_invoke,
       cg_info, cg_info_host, set_keyer, get_keyer,
       set_blend_mode, get_blend_mode, set_opacity, get_opacity,
       set_brightness, get_brightness, set_saturation, get_saturation,
       set_contrast, get_contrast, set_levels, get_levels,
       set_fill, get_fill, set_clip, get_clip,
       set_anchor, get_anchor, set_crop, get_crop,
       set_rotation, get_rotation, set_perspective, get_perspective,
       set_mipmap, get_mipmap, set_volume, get_volume,
       set_master_volume, get_master_volume, set_straight_alpha_output, get_straight_alpha_output,
       set_chroma_key, disable_chroma_key, get_chroma_key, set_invert,
       set_grid, mixer_commit, mixer_clear_layer, mixer_clear_channel,
       channel_grid, thumbnail_list, thumbnail_list_folder, thumbnail_retrieve,
       thumbnail_generate, thumbnail_generate_all, media_info, list_media,
       list_media_folder, list_fonts, list_templates, list_templates_folder,
       version, component_version, info, info_channel,
       info_layer, info_template, info_config, info_paths,
       info_system, info_server, info_queues, info_threads,
       info_channel_delay, info_layer_delay, open_diagnostics, gl_info,
       gl_gc, bye, kill, restart,
       help, help_command, help_producers, help_producer,
       help_consumers, help_consumer]
    verification: none
    notes: >
      Written from the AMCP and OSC documentation, which covers the 2.0 to
      2.1 servers and notes OSC changes from 2.2; the commands are the same
      on current servers. Some commands answer only with the producers and
      consumers a server is built with (Flash on Windows only).

maps:
  loop: { "true": " LOOP", "false": "" }
  auto: { "true": " AUTO", "false": "" }
  transforms: { "true": " TRANSFORMS", "false": "" }
  defer: { "true": " DEFER", "false": "" }

commands:
  load_background:
    summary: "Load a clip into a layer's background, ready to play (LOADBG)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
      clip: { type: "string", required: true, label: "Clip", description: "Media file name without its extension, relative to the media folder (folders separated by /), or a producer resource such as a color or a route://." }
      loop: { type: "bool", default: false, label: "Loop", description: "Loop the clip when it reaches its end." }
      transition: { type: "enum", values: ["CUT", "MIX", "PUSH", "WIPE", "SLIDE"], default: "CUT", label: "Transition", description: "Transition from what plays on the layer to the clip: CUT is immediate." }
      duration: { type: "int", min: 0, default: 0, label: "Duration", description: "Length of the transition or animation in frames of the channel; 0 for none." }
      tween: { type: "enum", values: ["linear", "easenone", "easeinquad", "easeoutquad", "easeinoutquad", "easeoutinquad", "easeincubic", "easeoutcubic", "easeinoutcubic", "easeoutincubic", "easeinquart", "easeoutquart", "easeinoutquart", "easeoutinquart", "easeinquint", "easeoutquint", "easeinoutquint", "easeoutinquint", "easeinsine", "easeoutsine", "easeinoutsine", "easeoutinsine", "easeinexpo", "easeoutexpo", "easeinoutexpo", "easeoutinexpo", "easeincirc", "easeoutcirc", "easeinoutcirc", "easeoutincirc", "easeinelastic", "easeoutelastic", "easeinoutelastic", "easeoutinelastic", "easeinback", "easeoutback", "easeinoutback", "easeoutintback", "easeoutbounce", "easeinbounce", "easeinoutbounce", "easeoutinbounce"], default: "linear", label: "Tween", description: "Easing curve of the transition or animation, from the Mixer page's animation types." }
      direction: { type: "enum", values: ["LEFT", "RIGHT"], default: "RIGHT", label: "Direction", description: "Direction a PUSH, WIPE or SLIDE transition moves in." }
      seek: { type: "int", min: 0, default: 0, label: "Start frame", description: "Frame of the file to start playing from, 0 for its first." }
      auto: { type: "bool", default: false, label: "Play automatically", description: "Start the clip by itself when the clip playing on the layer ends, rather than waiting for PLAY." }
    send: "LOADBG {channel}-{layer} {clip:json}{loop:map.loop} {transition} {duration} {tween} {direction} SEEK {seek}{auto:map.auto}"
    expect: { code_range: [200, 299] }
    returns: ack
  load_background_with_parameters:
    summary: "Load a clip into a layer's background with parameters as AMCP takes them (LOADBG)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
      clip: { type: "string", required: true, label: "Clip", description: "Media file name without its extension, relative to the media folder (folders separated by /), or a producer resource such as a color or a route://." }
      parameters: { type: "string", required: true, label: "Parameters", description: "The rest of the command as AMCP takes it (LOOP, a transition, SEEK, START, LENGTH, FILTER, AUTO, STING ...), sent as written." }
    send: "LOADBG {channel}-{layer} {clip:json} {parameters}"
    expect: { code_range: [200, 299] }
    returns: ack
  load:
    summary: "Load a clip into a layer's foreground, showing its first frame paused (LOAD)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
      clip: { type: "string", required: true, label: "Clip", description: "Media file name without its extension, relative to the media folder (folders separated by /), or a producer resource such as a color or a route://." }
      loop: { type: "bool", default: false, label: "Loop", description: "Loop the clip when it reaches its end." }
      seek: { type: "int", min: 0, default: 0, label: "Start frame", description: "Frame of the file to start playing from, 0 for its first." }
    send: "LOAD {channel}-{layer} {clip:json}{loop:map.loop} SEEK {seek}"
    expect: { code_range: [200, 299] }
    returns: ack
  load_with_parameters:
    summary: "Load a clip into a layer's foreground with parameters as AMCP takes them (LOAD)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
      clip: { type: "string", required: true, label: "Clip", description: "Media file name without its extension, relative to the media folder (folders separated by /), or a producer resource such as a color or a route://." }
      parameters: { type: "string", required: true, label: "Parameters", description: "The rest of the command as AMCP takes it (LOOP, a transition, SEEK, START, LENGTH, FILTER, AUTO, STING ...), sent as written." }
    send: "LOAD {channel}-{layer} {clip:json} {parameters}"
    expect: { code_range: [200, 299] }
    returns: ack
  play:
    summary: "Play what is loaded on a layer: the background clip, with its transition, or the paused foreground (PLAY)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
    send: "PLAY {channel}-{layer}"
    expect: { code_range: [200, 299] }
    returns: ack
  play_clip:
    summary: "Load a clip into a layer and play it at once (PLAY with a clip)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
      clip: { type: "string", required: true, label: "Clip", description: "Media file name without its extension, relative to the media folder (folders separated by /), or a producer resource such as a color or a route://." }
      loop: { type: "bool", default: false, label: "Loop", description: "Loop the clip when it reaches its end." }
      transition: { type: "enum", values: ["CUT", "MIX", "PUSH", "WIPE", "SLIDE"], default: "CUT", label: "Transition", description: "Transition from what plays on the layer to the clip: CUT is immediate." }
      duration: { type: "int", min: 0, default: 0, label: "Duration", description: "Length of the transition or animation in frames of the channel; 0 for none." }
      tween: { type: "enum", values: ["linear", "easenone", "easeinquad", "easeoutquad", "easeinoutquad", "easeoutinquad", "easeincubic", "easeoutcubic", "easeinoutcubic", "easeoutincubic", "easeinquart", "easeoutquart", "easeinoutquart", "easeoutinquart", "easeinquint", "easeoutquint", "easeinoutquint", "easeoutinquint", "easeinsine", "easeoutsine", "easeinoutsine", "easeoutinsine", "easeinexpo", "easeoutexpo", "easeinoutexpo", "easeoutinexpo", "easeincirc", "easeoutcirc", "easeinoutcirc", "easeoutincirc", "easeinelastic", "easeoutelastic", "easeinoutelastic", "easeoutinelastic", "easeinback", "easeoutback", "easeinoutback", "easeoutintback", "easeoutbounce", "easeinbounce", "easeinoutbounce", "easeoutinbounce"], default: "linear", label: "Tween", description: "Easing curve of the transition or animation, from the Mixer page's animation types." }
      direction: { type: "enum", values: ["LEFT", "RIGHT"], default: "RIGHT", label: "Direction", description: "Direction a PUSH, WIPE or SLIDE transition moves in." }
      seek: { type: "int", min: 0, default: 0, label: "Start frame", description: "Frame of the file to start playing from, 0 for its first." }
    send: "PLAY {channel}-{layer} {clip:json}{loop:map.loop} {transition} {duration} {tween} {direction} SEEK {seek}"
    expect: { code_range: [200, 299] }
    returns: ack
  play_clip_with_parameters:
    summary: "Load a clip into a layer and play it, with parameters as AMCP takes them (PLAY)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
      clip: { type: "string", required: true, label: "Clip", description: "Media file name without its extension, relative to the media folder (folders separated by /), or a producer resource such as a color or a route://." }
      parameters: { type: "string", required: true, label: "Parameters", description: "The rest of the command as AMCP takes it (LOOP, a transition, SEEK, START, LENGTH, FILTER, AUTO, STING ...), sent as written." }
    send: "PLAY {channel}-{layer} {clip:json} {parameters}"
    expect: { code_range: [200, 299] }
    returns: ack
  pause:
    summary: "Pause the clip playing on a layer (PAUSE)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
    send: "PAUSE {channel}-{layer}"
    expect: { code_range: [200, 299] }
    returns: ack
  resume:
    summary: "Resume a clip paused with PAUSE (RESUME)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
    send: "RESUME {channel}-{layer}"
    expect: { code_range: [200, 299] }
    returns: ack
  stop:
    summary: "Remove the clip playing on a layer, leaving its background (STOP)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
    send: "STOP {channel}-{layer}"
    expect: { code_range: [200, 299] }
    returns: ack
  clear_layer:
    summary: "Remove everything on a layer, foreground and background (CLEAR)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most.", required: true }
    send: "CLEAR {channel}-{layer}"
    expect: { code_range: [200, 299] }
    returns: ack
  clear_channel:
    summary: "Remove everything on every layer of a channel (CLEAR)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
    send: "CLEAR {channel}"
    expect: { code_range: [200, 299] }
    returns: ack
  call:
    summary: "Call a function of the producer on a layer with its parameters as written (CALL)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
      parameters: { type: "string", required: true, label: "Parameters", description: "The function and its parameters as the producer takes them (LOOP 1, SEEK 25, START 100, an HTML template's function), sent as written." }
    send: "CALL {channel}-{layer} {parameters}"
    expect: { code_range: [200, 299] }
    returns: text
  set_loop:
    summary: "Turn looping of the file playing on a layer on or off, and read it back (CALL LOOP)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
      loop: { type: "bool", default: true, label: "Loop", description: "Loop the clip when it reaches its end." }
    send: "CALL {channel}-{layer} LOOP {loop:bool01}"
    expect: { code_range: [200, 299] }
    returns: text
  get_loop:
    summary: "Read whether the file playing on a layer loops (CALL LOOP)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
    send: "CALL {channel}-{layer} LOOP"
    expect: { code_range: [200, 299] }
    returns: text
  seek:
    summary: "Jump the file playing on a layer to a frame (CALL SEEK)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
      frame: { type: "int", min: 0, required: true, label: "Frame", description: "Frame of the file to jump to, counted from its first." }
    send: "CALL {channel}-{layer} SEEK {frame}"
    expect: { code_range: [200, 299] }
    returns: text
  seek_relative:
    summary: "Jump the file playing on a layer by frames from a reference point (CALL SEEK REL|IN|OUT|END)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
      from: { type: "enum", values: ["REL", "IN", "OUT", "END"], required: true, label: "From", description: "REL the current position, IN the start (0 or START), OUT start plus length, END the end of the file." }
      frames: { type: "int", required: true, label: "Frames", description: "Frames from that point, negative to go back." }
    send: "CALL {channel}-{layer} SEEK {from} {frames}"
    expect: { code_range: [200, 299] }
    returns: text
  set_start:
    summary: "Set the frame a file loops back to (CALL START)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
      frame: { type: "int", min: 0, required: true, label: "Frame", description: "Frame of the file that starts it, and where it loops back to." }
    send: "CALL {channel}-{layer} START {frame}"
    expect: { code_range: [200, 299] }
    returns: text
  set_length:
    summary: "Set the last frame a file plays, or loops at (CALL LENGTH)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, default: 0, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most." }
      frames: { type: "int", min: 0, required: true, label: "Length", description: "Frames played from the start point before the file ends or loops." }
    send: "CALL {channel}-{layer} LENGTH {frames}"
    expect: { code_range: [200, 299] }
    returns: text
  swap_layers:
    summary: "Swap two layers, foreground and background, on one channel or two (SWAP)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      layer: { type: "int", min: 0, max: 9999, label: "Layer", description: "Layer of the channel, 0 the bottom-most and 9999 the top-most.", required: true }
      other_channel: { type: "int", min: 1, required: true, label: "Other channel", description: "Channel of the second layer, numbered from 1." }
      other_layer: { type: "int", min: 0, max: 9999, label: "Other layer", description: "The second layer, 0 to 9999.", required: true }
      transforms: { type: "bool", default: false, label: "Swap transforms", description: "Swap the layers' mixer transforms too." }
    send: "SWAP {channel}-{layer} {other_channel}-{other_layer}{transforms:map.transforms}"
    expect: { code_range: [200, 299] }
    returns: ack
  swap_channels:
    summary: "Swap every layer of two channels (SWAP)"
    params:
      channel: { type: "int", min: 1, required: true, label: "Channel", description: "Video channel, numbered from 1 in the order the server's configuration lists them." }
      other_channel: { type: "int", min: 1, required: true, label: "Other channel", description: "The second channel, numbered from 1." }
      transforms: { type: "bool", default: false, label: "Swap transforms", description: "Swap the layers' mixer transforms too." }
    send: "SWAP {channel} {other_channel}{transforms:map.transforms}"
    expect: { code_range: [200, 299] }
    returns: ack
  add_consumer:
    summary: "Add an output (consumer) to a channel (ADD)"
    params:
