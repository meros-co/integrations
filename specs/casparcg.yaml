      duration: { type: "int", min: 0, default: 0, label: "Duration", description: "Length of the transition or animation in frames of the channel; 0 for none." }
      tween: { type: "enum", values: ["linear", "easenone", "easeinquad", "easeoutquad", "easeinoutquad", "easeoutinquad", "easeincubic", "easeoutcubic", "easeinoutcubic", "easeoutincubic", "easeinquart", "easeoutquart", "easeinoutquart", "easeoutinquart", "easeinquint", "easeoutquint", "easeinoutquint", "easeoutinquint", "easeinsine", "easeoutsine", "easeinoutsine", "easeoutinsine", "easeinexpo", "easeoutexpo", "easeinoutexpo", "easeoutinexpo", "easeincirc", "easeoutcirc", "easeinoutcirc", "easeoutincirc", "easeinelastic", "easeoutelastic", "easeinoutelastic", "easeoutinelastic", "easeinback", "easeoutback", "easeinoutback", "easeoutintback", "easeoutbounce", "easeinbounce", "easeinoutbounce", "easeoutinbounce"], default: "linear", label: "Tween", description: "Easing curve of the transition or animation, from the Mixer page's animation types." }
      defer: { type: "bool", default: false, label: "Defer", description: "Hold the change until MIXER COMMIT on the channel, so several start on the same frame." }
    send:
      - "MIXER {channel}-{layer} CHROMA 1 {target_hue:.4f} {hue_width:.4f} {min_saturation:.4f} {min_brightness:.4f} {softness:.4f} {spill_suppress:.4f} {spill_suppress_saturation:.4f} {show_mask:bool01} {duration} {tween}{defer:map.defer}"
