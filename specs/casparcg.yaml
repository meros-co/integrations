quirks:
  - models: [all]
    severity: info
    text: >
      Every command answers with a code: 202 done, 201 one line of data, 200
      lines of data ended by a blank line, 4xx a client error (400 with a
      line naming the command not understood), 5xx a server error. The
      commands that read something return the data lines as text.
  - models: [all]
    severity: info
    text: >
      Clip, template, dataset and folder names go out quoted, with \" and \\
      escaped as AMCP's special sequences ask, so names may hold spaces; a
      dataset's line breaks go out as \n. The "parameters" of the
      *_with_parameters, call and consumer commands go out as written, for
      AMCP's own words (LOOP, SEEK 100, START, LENGTH, FILTER hflip, AUTO,
      STING mask 0 overlay, DECKLINK 1, FILE name.mov SEPARATE_KEY).
  - models: [all]
    severity: warning
    text: >
      load_background, load and play_clip always send the transition (CUT 0
      linear RIGHT by default) and SEEK (0 by default), as the documented
      defaults, and LOOP and AUTO only when asked for. That a server accepts
      CUT 0 with a tween and direction after it is read from the syntax, not
      an example.
  - models: [all]
    severity: info
    text: >
      State is OSC's first. The server sends it to the address of each AMCP
      client on its default-port (6250), set in casparcg.config's osc
      section, which osc_port must match; OSC clients defined in the
      configuration also receive it. OSC reports only what is active, every
      frame: a layer that empties stops being reported rather than being
      reported empty, so its last values stay in state. What this connection
      clears or stops (CLEAR, STOP, MIXER CLEAR) leaves state at once;
      something cleared by another client stays until the device is opened
      again.
  - models: [all]
    severity: warning
    text: >
      The OSC addresses are those documented for 2.0 to 2.1 and the FFmpeg
      producer's for 2.2 onwards. Layer addresses are read with or without a
      foreground/ segment after the layer number, in case a server puts
      producers' values under it; the documentation shows none.
  - models: [all]
    severity: info
    text: >
      The time, frame and profiler values change every frame (25 to 60 times
      a second for each channel and layer), so their state changes as often.
  - models: [all]
    severity: info
    text: >
      Mixer settings are kept in state from the read-back each set_ command
      does (the MIXER get form after the set) and from the get_ commands;
      AMCP does not push them and OSC carries only the audio levels, so a
      change made by another client shows only after a get_. MIXER INVERT and
      MIXER GRID have no documented read form. A deferred change (defer) is
      applied at mixer_commit; what its read-back returns before then is not
      documented.
  - models: [all]
    severity: warning
    text: >
      DEFER is documented only by the MIXER COMMIT example (FILL 0 0 0.5 0.5
      25 DEFER); it is sent after the tween here.
  - models: [all]
    severity: warning
    text: >
      The documentation's example answers MIXER CHROMA's read with "202 MIXER
      OK" and a line of values, where every other read answers 201. The
      read-back takes the values after 201 (and after 202 only if the line
      arrives as part of the reply); a 202 followed by a separate line would
      leave the line unread.
  - models: [all]
    severity: info
    text: >
      The channel list (INFO) is read every 10 s and the media, template,
      font, dataset and thumbnail lists and the version every minute. TLS
      lines are read both as 2.2 and later give them (bare names) and as
      earlier servers do (a quoted name and more fields). FLS and DATA LIST
      lines are kept as the server sends them, their columns not being
      documented beyond FLS's "font name and font path".
  - models: [all]
    severity: info
    text: >
      INFO for a channel or layer, INFO TEMPLATE, CONFIG, PATHS, SYSTEM,
      SERVER, QUEUES, THREADS and DELAY, CG INFO, HELP and GL INFO return
      their data as text; their XML layout differs by version and is not
      documented, so it is not read into state.
  - models: [all]
    severity: warning
    text: >
      Batching (BEGIN, COMMIT, DISCARD) is not offered: commands inside a
      batch are answered only at COMMIT, all together, which a client
      sending one command at a time and waiting for its answer cannot
      follow. REQ/RES tagging is not used, as answers come in order.
  - models: [all]
    severity: critical
    text: >
      clear_channel and clear_layer remove what is on air at once, stop does
      on its layer, swap_channels and swap_layers move it, kill and restart
      stop the server (every channel goes black), set_video_mode restarts a
      channel's outputs, and remove_consumer stops an output. None can be
      undone live.
  - models: [all]
    severity: warning
    text: >
      bye ends the AMCP connection; the core then connects again, which
      starts a new OSC client on the server. kill and restart get no answer.
  - models: [all]
    severity: warning
    text: >
      The CALL functions (LOOP, SEEK, START, LENGTH) are documented to return
      a value (LOOP its state, SEEK the frame it went to) but not how; their
      answer is taken as 201 CALL OK and a line, as other reads answer, and
      LOOP's 0 or 1 is kept in state.
  - models: [all]
    severity: info
    text: >
      PING is answered PONG, as the documentation's example shows, with no
      code; an answer of 20x PING is taken as well. The probe uses VERSION,
      which answers with a code.
  - models: [all]
    severity: info
    text: >
      The tween list is the Mixer page's, including its spelling
      "easeoutintback".
  - models: [all]
    severity: info
    text: >
      Channels count from 1 and layers from 0 to 9999 (the Channels page).
      AMCP takes signed layer numbers, but the documentation gives no meaning
      to a negative one, so none is offered.
