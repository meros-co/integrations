spec: 1
id: youtube-live
name: YouTube Live (YouTube Data API v3, live streaming)
vendor: Google
category: other

# A cloud service, not a device on the venue network: the integration is
# opened with host www.googleapis.com on port 443 and follows one broadcast,
# named by the broadcast_id setting. The consumer owns the credential: it
# registers its own Google OAuth client, runs the sign-in, and passes the
# tokens as settings; the core keeps the access token fresh with the refresh
# token and reports new tokens as credentials events. The core never runs a
# sign-in. Every request spends the consumer's Google Cloud project quota
# (10,000 units a day by default).

source:
  - title: YouTube Live Streaming API reference, liveBroadcasts (resource; list, insert, update, delete, bind, transition, cuepoint)
    author: Google
    url: https://developers.google.com/youtube/v3/live/docs/liveBroadcasts
    note: >
      Manufacturer document, retrieved 2026-10-04. Resource properties
      (snippet, status.lifeCycleStatus and its values complete, created,
      live, liveStarting, ready, revoked, testStarting, testing,
      contentDetails.boundStreamId, monitorStream, enableAutoStart,
      enableAutoStop, statistics.totalChatCount). list: GET
      /youtube/v3/liveBroadcasts, part, exactly one of broadcastStatus
      (active, all, completed, upcoming), id or mine, broadcastType (all,
      event, persistent; default event), maxResults 0 to 50 (default 5).
      transition: POST /liveBroadcasts/transition with broadcastStatus
      (testing, live, complete), id and part; the stream must be active, and
      testing needs the monitor stream; errors invalidTransition,
      redundantTransition, errorStreamInactive (403). bind: POST
      /liveBroadcasts/bind with id, part and streamId; without streamId the
      binding is removed. cuepoint: POST /liveBroadcasts/cuepoint with id and
      a body whose cueType must be cueTypeAd, durationSecs default 30.
      insert: POST /liveBroadcasts, requires snippet.title,
      snippet.scheduledStartTime and status.privacyStatus. update: PUT
      /liveBroadcasts; a mutable property left out of the body is deleted.
      delete: DELETE /liveBroadcasts with id.
  - title: YouTube Live Streaming API reference, liveStreams (resource; list, insert, update, delete)
    author: Google
    url: https://developers.google.com/youtube/v3/live/docs/liveStreams
    note: >
      Manufacturer document, retrieved 2026-10-04. status.streamStatus
      (active, created, error, inactive, ready), status.healthStatus.status
      (good, ok, bad, noData), lastUpdateTimeSeconds, configurationIssues
      (type, severity info, warning or error, reason, description), cdn
      (ingestionType dash, hls or rtmp, ingestionInfo, resolution,
      frameRate). list: GET /youtube/v3/liveStreams, part (id, snippet, cdn,
      status), id or mine, maxResults 0 to 50 (default 5).
  - title: YouTube Data API reference, videos (liveStreamingDetails, statistics)
    author: Google
    url: https://developers.google.com/youtube/v3/docs/videos
    note: >
      Manufacturer document, retrieved 2026-10-04.
      liveStreamingDetails.concurrentViewers is present only while the
      broadcast has viewers and the owner shows the count, and is not kept
      after the broadcast ends; activeLiveChatId only while live with chat.
  - title: YouTube Live Streaming API reference, liveChatMessages (list, insert, delete) and liveChatBans (insert, delete)
    author: Google
    url: https://developers.google.com/youtube/v3/live/docs/liveChatMessages
    note: >
      Manufacturer document, retrieved 2026-10-04. GET and POST
      /youtube/v3/liveChat/messages (liveChatId, part id, snippet,
      authorDetails; maxResults 200 to 2000, default 500; reply carries
      pollingIntervalMillis); insert body snippet.liveChatId, snippet.type
      textMessageEvent and snippet.textMessageDetails.messageText. POST
      /youtube/v3/liveChat/bans with snippet.liveChatId, snippet.type
      (permanent or temporary), snippet.bannedUserDetails.channelId and
      snippet.banDurationSeconds; DELETE with the ban's id.
  - title: Using OAuth 2.0 for iOS & Desktop Apps (Refreshing an access token)
    author: Google
    url: https://developers.google.com/identity/protocols/oauth2/native-app
    note: >
      Manufacturer document, retrieved 2026-10-04. The token endpoint is
      https://oauth2.googleapis.com/token; a refresh is a POST with
      client_id, client_secret (optional for installed apps), grant_type
      refresh_token and refresh_token; the answer carries access_token,
      expires_in (seconds), token_type Bearer and scope. A refresh that fails
      with invalid_grant means the refresh token expired or was revoked and
      the user must sign in again.
  - title: Using OAuth 2.0 to Access Google APIs (Refresh token expiration)
    author: Google
    url: https://developers.google.com/identity/protocols/oauth2
    note: >
      Manufacturer document, retrieved 2026-10-04. A project whose OAuth
      consent screen is for external users with publishing status Testing
      is issued refresh tokens that expire in 7 days (unless it asks only
      for basic profile scopes). There is a limit of 100 refresh tokens per
      Google Account per client ID; a new one past it invalidates the oldest
      without warning.
  - title: RFC 6749, The OAuth 2.0 Authorization Framework, section 6 (Refreshing an Access Token) and 5.2 (Error Response)
    author: IETF
    url: https://www.rfc-editor.org/rfc/rfc6749
    note: >
      The refresh request, the client authentication of section 2.3.1, a new
      refresh token in the answer replacing the old one, and invalid_grant.
  - title: YouTube Data API, Quota costs (determine_quota_cost)
    author: Google
    url: https://developers.google.com/youtube/v3/determine_quota_cost
    note: >
      Manufacturer document, retrieved again 2026-10-14 (the table changed
      since 2026-10-04). Every liveBroadcasts and liveStreams method (list,
      insert, update, delete, bind, transition, insertCuepoint) costs 1
      unit; liveChatMessages list 5, insert, delete and transition 20;
      liveChatBans insert and delete 200; liveChatModerators list 50,
      insert and delete 200; superChatEvents.list, videos.list and
      videoCategories.list 1; videos.update and thumbnails.set 50. The
      default quota is 10,000 units a day per project, reset at midnight
      Pacific Time.
  - title: YouTube Data API reference, videos.update
    author: Google
    url: https://developers.google.com/youtube/v3/docs/videos/update
    note: >
      Manufacturer document, retrieved 2026-10-14. PUT /youtube/v3/videos
      with part; writable snippet.title and snippet.categoryId (both
      required when the snippet is updated), snippet.defaultLanguage,
      snippet.description, snippet.tags[], status.embeddable,
      status.license, status.privacyStatus, status.publicStatsViewable,
      status.publishAt, status.selfDeclaredMadeForKids,
      status.containsSyntheticMedia, recordingDetails.recordingDate and
      localizations; a property left out of the request that has a value is
      deleted. 50 units.
  - title: YouTube Data API reference, thumbnails.set
    author: Google
    url: https://developers.google.com/youtube/v3/docs/thumbnails/set
    note: >
      Manufacturer document, retrieved 2026-10-14. POST
      https://www.googleapis.com/upload/youtube/v3/thumbnails/set with
      videoId; the body is the image; accepted media image/jpeg, image/png
      and application/octet-stream, at most 50 MB; about 50 quota units;
      answers a thumbnailSetResponse (kind, etag, items[] of thumbnail
      resources).
  - title: YouTube Live Streaming API reference, liveChatModerators (list, insert, delete)
    author: Google
    url: https://developers.google.com/youtube/v3/live/docs/liveChatModerators
    note: >
      Manufacturer document, retrieved 2026-10-14. GET, POST and DELETE
      /youtube/v3/liveChat/moderators; list with liveChatId, part id,snippet
      and maxResults 0 to 50 (default 5); insert body
      snippet.liveChatId and snippet.moderatorDetails.channelId; delete with
      the moderator resource's id. Owner of the chat's channel only.
  - title: YouTube Live Streaming API reference, superChatEvents (list)
    author: Google
    url: https://developers.google.com/youtube/v3/live/docs/superChatEvents
    note: >
      Manufacturer document, retrieved 2026-10-14. GET
      /youtube/v3/superChatEvents, part snippet, maxResults 1 to 50
      (default 5): the channel's Super Chats and Super Stickers of the last
      30 days, with supporterDetails, commentText, createdAt, amountMicros,
      currency, displayString, messageType (the tier) and
      isSuperStickerEvent.
  - title: YouTube Live Streaming API reference, liveChatMessages (insert pollEvent, transition)
    author: Google
    url: https://developers.google.com/youtube/v3/live/docs/liveChatMessages/transition
    note: >
      Manufacturer document, retrieved 2026-10-14. insert with snippet.type
      pollEvent and snippet.pollDetails.metadata.questionText and options
      (2 to 4, each optionText) adds a poll; one pinned active poll at a
      time (preconditionCheckFailed). POST
      /youtube/v3/liveChat/messages/transition with id, status closed and
      part ends the poll and answers the message with its tallies
      (pollDetails.metadata.options[].tally, to the owner only; status
      unknown, active or closed). 20 units each.

transport:
  type: http
  port: 443
  scheme: https
  # The access_token setting as Bearer, refreshed with refresh_token at
  # Google's token endpoint (or the token_url setting's proxy).
  auth: oauth2
  oauth:
    token_url: https://oauth2.googleapis.com/token
    refresh_ahead_s: 300
    client_auth: body
  # Google answers 403 for quota, rate limits, permissions and invalid
  # transitions; only 401 means the token was refused.
  refusal_status: [401]
  timeout_ms: 10000
  # A path that is no API method: Google answers it at once, without
  # touching the token or spending quota, so idle probes cost nothing.
  probe: { method: GET, path: /youtube/v3/ }

settings:
  client_id: { type: string, max_length: 512, default: "",
               label: OAuth client ID,
               description: "The consumer's own Google OAuth client ID (an installed or web application client), sent with each token refresh." }
  client_secret: { type: string, secret: true, max_length: 512, default: "",
                   label: OAuth client secret,
                   description: "The client's secret, sent with each token refresh when set; leave empty for an installed-app client that refreshes without one, or when token_url names a proxy that adds it." }
  refresh_token: { type: string, secret: true, max_length: 4096, default: "",
                   label: Refresh token,
                   description: "The refresh token from the consumer's sign-in (scope youtube or youtube.force-ssl); with it the core keeps the access token fresh, and without it the access token is used until Google refuses it." }
  access_token: { type: string, secret: true, max_length: 4096, default: "",
                  label: Access token,
                  description: "The current OAuth access token, about an hour long; may be left empty when a refresh token is given, and the core reports each new one in a credentials event." }
  expires_at: { type: int, min: 0,
                label: Access token expiry,
                description: "When the access token expires, in Unix seconds; the core refreshes 5 minutes before, and reports each new expiry in a credentials event." }
  token_url: { type: string, max_length: 2048, default: "",
               pattern: "^(https://[^\\s]+|http://(localhost|127\\.0\\.0\\.1|\\[::1\\])(:[0-9]+)?(/[^\\s]*)?)?$",
               label: Token endpoint override,
               description: "A token endpoint to refresh at instead of Google's, such as the consumer's own token proxy that holds the client secret; https, or http to this machine only. Empty uses Google's." }
  broadcast_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                  label: Broadcast ID,
                  description: "The id of the broadcast to follow (also its video id), from YouTube Studio's URL or list_broadcasts." }

ports:
  - { port: 443, protocol: https, role: control, note: "the cloud API at www.googleapis.com, opened by that host name" }

models:
  - id: data-api-v3
    name: YouTube Data API v3, live streaming
    supports: [list_broadcasts, get_broadcast, start_testing, go_live, complete_broadcast,
               bind_stream, unbind_stream, insert_ad_break, insert_broadcast, update_broadcast,
               delete_broadcast, list_streams, get_stream, insert_stream, update_stream,
               delete_stream, get_live_details, list_chat_messages, list_chat_messages_after, send_chat_message,
               delete_chat_message, ban_chat_user, ban_chat_user_temporarily, unban_chat_user,
               get_video, update_video, update_video_snippet, update_video_status, set_thumbnail,
               list_video_categories,
               list_chat_moderators, add_chat_moderator, remove_chat_moderator, list_super_chat_events,
               list_super_chat_events_page,
               create_chat_poll, close_chat_poll]
    verification: none
    notes: >
      Live streaming must be enabled on the channel. The integration follows
      the broadcast named by broadcast_id; the other commands take any ids.

commands:
  # ── Broadcasts ───────────────────────────────────────────────────────────
  list_broadcasts:
    summary: The channel's broadcasts with a lifecycle status, newest first, every page (liveBroadcasts.list with broadcastStatus; 1 quota unit a page)
    params:
      broadcast_status: { type: enum, values: [active, upcoming, completed, all], default: active,
                          label: Status,
                          description: "active for broadcasts now testing or live, upcoming for those not started, completed for ended ones, all for every one." }
      broadcast_type: { type: enum, values: [all, event, persistent], default: all,
                        label: Type,
                        description: "event for scheduled broadcasts, persistent for the channel's default broadcast, all for both." }
      max_results: { type: int, min: 0, max: 50, default: 25,
                     label: Broadcasts per page,
                     description: "How many broadcasts each page YouTube is asked for holds, from 0 to 50; every page is read." }
    send: { method: GET, path: /youtube/v3/liveBroadcasts,
            query: { part: "id,snippet,contentDetails,status", broadcastStatus: "{broadcast_status}",
                     broadcastType: "{broadcast_type}", maxResults: "{max_results}" },
            pages: &pages { items: "$.items", cursor: "$.nextPageToken", query: pageToken } }
    expect: { status: 200, json_path: "$.items" }
    returns: value

  get_broadcast:
    summary: One broadcast (liveBroadcasts.list with id; 1 quota unit)
    params:
      broadcast_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                      label: Broadcast ID,
                      description: "The broadcast's id, which is also its video id." }
    send: { method: GET, path: /youtube/v3/liveBroadcasts,
            query: { part: "id,snippet,contentDetails,status", id: "{broadcast_id}" } }
    expect: { status: 200, json_path: "$.items" }
    returns: value

  start_testing:
    summary: Start the broadcast's test, visible only to the channel on its monitor stream (liveBroadcasts.transition to testing; 1 quota unit)
    params:
      broadcast_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                      label: Broadcast ID,
                      description: "The broadcast to test; its bound stream must be active and its monitor stream enabled." }
    send: { method: POST, path: /youtube/v3/liveBroadcasts/transition,
            query: { broadcastStatus: testing, id: "{broadcast_id}", part: "id,snippet,contentDetails,status" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  go_live:
    summary: Make the broadcast public, live to viewers (liveBroadcasts.transition to live; 1 quota unit)
    params:
      broadcast_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                      label: Broadcast ID,
                      description: "The broadcast to take live; its bound stream must be active." }
    send: { method: POST, path: /youtube/v3/liveBroadcasts/transition,
            query: { broadcastStatus: live, id: "{broadcast_id}", part: "id,snippet,contentDetails,status" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  complete_broadcast:
    summary: End the broadcast for good (liveBroadcasts.transition to complete; 1 quota unit)
    params:
      broadcast_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                      label: Broadcast ID,
                      description: "The broadcast to end." }
    send: { method: POST, path: /youtube/v3/liveBroadcasts/transition,
            query: { broadcastStatus: complete, id: "{broadcast_id}", part: "id,snippet,contentDetails,status" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  bind_stream:
    summary: Bind a stream (an ingest point and key) to the broadcast (liveBroadcasts.bind; 1 quota unit)
    params:
      broadcast_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                      label: Broadcast ID,
                      description: "The broadcast to bind; a broadcast has at most one stream." }
      stream_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 128, required: true,
                   label: Stream ID,
                   description: "The stream to bind, from list_streams; one stream may serve several broadcasts." }
    send: { method: POST, path: /youtube/v3/liveBroadcasts/bind,
            query: { id: "{broadcast_id}", part: "id,snippet,contentDetails,status", streamId: "{stream_id}" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  unbind_stream:
    summary: Remove the broadcast's stream binding (liveBroadcasts.bind without streamId; 1 quota unit)
    params:
      broadcast_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                      label: Broadcast ID,
                      description: "The broadcast whose stream is unbound." }
    send: { method: POST, path: /youtube/v3/liveBroadcasts/bind,
            query: { id: "{broadcast_id}", part: "id,snippet,contentDetails,status" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  insert_ad_break:
    summary: Insert an ad break into the live broadcast now (liveBroadcasts.cuepoint, cueType cueTypeAd; 1 quota unit)
    params:
      broadcast_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                      label: Broadcast ID,
                      description: "The broadcast, which must be actively streaming." }
      duration_secs: { type: int, min: 1, default: 30,
                       label: Duration,
                       description: "Length of the ad break in seconds; YouTube's default is 30." }
    send: { method: POST, path: /youtube/v3/liveBroadcasts/cuepoint, query: { id: "{broadcast_id}" },
            body: '{"cueType":"cueTypeAd","durationSecs":{duration_secs}}', content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  insert_broadcast:
    summary: Create a broadcast from a liveBroadcast resource with snippet.title, snippet.scheduledStartTime and status.privacyStatus (liveBroadcasts.insert; 1 quota unit)
    params:
      broadcast: { type: json, required: true,
                   label: Broadcast,
                   description: "A liveBroadcast resource as YouTube documents it, with at least snippet.title, snippet.scheduledStartTime (ISO 8601) and status.privacyStatus (public, private or unlisted)." }
    send: { method: POST, path: /youtube/v3/liveBroadcasts, query: { part: "id,snippet,contentDetails,status" },
            body: '{broadcast}', content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  update_broadcast:
    summary: Replace a broadcast's snippet, contentDetails and status with a liveBroadcast resource; properties left out are deleted (liveBroadcasts.update; 1 quota unit)
    params:
      broadcast: { type: json, required: true,
                   label: Broadcast,
                   description: "The whole liveBroadcast resource with its id, snippet.scheduledStartTime and contentDetails.monitorStream; every mutable property left out is deleted, privacy included." }
    send: { method: PUT, path: /youtube/v3/liveBroadcasts, query: { part: "id,snippet,contentDetails,status" },
            body: '{broadcast}', content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  delete_broadcast:
    summary: Delete a broadcast (liveBroadcasts.delete; 1 quota unit)
    params:
      broadcast_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                      label: Broadcast ID,
                      description: "The broadcast to delete." }
    send: { method: DELETE, path: /youtube/v3/liveBroadcasts, query: { id: "{broadcast_id}" } }
    expect: { status: 204 }
    returns: ack

  # ── Streams ──────────────────────────────────────────────────────────────
  list_streams:
    summary: The channel's streams with their status and health, every page (liveStreams.list mine; 1 quota unit a page)
    params:
      max_results: { type: int, min: 0, max: 50, default: 25,
                     label: Streams per page,
                     description: "How many streams each page YouTube is asked for holds, from 0 to 50; every page is read." }
    send: { method: GET, path: /youtube/v3/liveStreams,
            query: { part: "id,snippet,cdn,status", mine: "true", maxResults: "{max_results}" }, pages: *pages }
    expect: { status: 200, json_path: "$.items" }
    returns: value

  get_stream:
    summary: One stream with its status and health (liveStreams.list with id; 1 quota unit)
    params:
      stream_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 128, required: true,
                   label: Stream ID,
                   description: "The stream's id, as a broadcast's contentDetails.boundStreamId names it." }
    send: { method: GET, path: /youtube/v3/liveStreams, query: { part: "id,snippet,cdn,status", id: "{stream_id}" } }
    expect: { status: 200, json_path: "$.items" }
    returns: value

  insert_stream:
    summary: Create a stream from a liveStream resource with snippet.title and cdn (liveStreams.insert; 1 quota unit)
    params:
      stream: { type: json, required: true,
                label: Stream,
                description: "A liveStream resource as YouTube documents it, with snippet.title and cdn.ingestionType, cdn.resolution and cdn.frameRate." }
    send: { method: POST, path: /youtube/v3/liveStreams, query: { part: "id,snippet,cdn,status" },
            body: '{stream}', content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  update_stream:
    summary: Replace a stream's snippet and cdn with a liveStream resource (liveStreams.update; 1 quota unit)
    params:
      stream: { type: json, required: true,
                label: Stream,
                description: "The whole liveStream resource with its id; a property left out is deleted." }
    send: { method: PUT, path: /youtube/v3/liveStreams, query: { part: "id,snippet,cdn,status" },
            body: '{stream}', content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  delete_stream:
    summary: Delete a stream and its stream key (liveStreams.delete; 1 quota unit)
    params:
      stream_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 128, required: true,
                   label: Stream ID,
                   description: "The stream to delete." }
    send: { method: DELETE, path: /youtube/v3/liveStreams, query: { id: "{stream_id}" } }
    expect: { status: 204 }
    returns: ack

  # ── Viewers ──────────────────────────────────────────────────────────────
  get_live_details:
    summary: A broadcast's video live details and statistics, with concurrent viewers while live (videos.list part liveStreamingDetails, statistics; 1 quota unit)
    params:
      video_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                  label: Video ID,
                  description: "The broadcast's id, which is also its video id." }
    send: { method: GET, path: /youtube/v3/videos, query: { part: "liveStreamingDetails,statistics", id: "{video_id}" } }
    expect: { status: 200, json_path: "$.items" }
    returns: value

  # ── Live chat ────────────────────────────────────────────────────────────
  list_chat_messages:
    summary: A live chat's messages, oldest first, with nextPageToken and pollingIntervalMillis (liveChatMessages.list; 5 quota units)
    params:
      live_chat_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 256, required: true,
                      label: Live chat ID,
                      description: "The chat's id, a broadcast's snippet.liveChatId." }
    send: { method: GET, path: /youtube/v3/liveChat/messages,
            query: { liveChatId: "{live_chat_id}", part: "id,snippet,authorDetails" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  list_chat_messages_after:
    summary: A live chat's messages since an earlier reply, with the next nextPageToken and pollingIntervalMillis (liveChatMessages.list with pageToken; 5 quota units)
    params:
      live_chat_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 256, required: true,
                      label: Live chat ID,
                      description: "The chat's id, a broadcast's snippet.liveChatId." }
      page_token: { type: string, pattern: "^[A-Za-z0-9_=-]+$", max_length: 1024, required: true,
                    label: Page token,
                    description: "The nextPageToken of the previous reply for this chat." }
    send: { method: GET, path: /youtube/v3/liveChat/messages,
            query: { liveChatId: "{live_chat_id}", part: "id,snippet,authorDetails", pageToken: "{page_token}" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  send_chat_message:
    summary: Post a text message to a live chat as the channel (liveChatMessages.insert; 20 quota units)
    params:
      live_chat_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 256, required: true,
                      label: Live chat ID,
                      description: "The chat's id, a broadcast's snippet.liveChatId." }
      text: { type: string, required: true,
              label: Message,
              description: "The message text, posted as the channel the token belongs to." }
    send: { method: POST, path: /youtube/v3/liveChat/messages, query: { part: snippet },
            body: '{"snippet":{"liveChatId":{live_chat_id:json},"type":"textMessageEvent","textMessageDetails":{"messageText":{text:json}}}}',
            content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  delete_chat_message:
    summary: Delete a live chat message (liveChatMessages.delete; 20 quota units)
    params:
      message_id: { type: string, pattern: "^[A-Za-z0-9_.-]+$", max_length: 256, required: true,
                    label: Message ID,
                    description: "The message's id, from list_chat_messages." }
    send: { method: DELETE, path: /youtube/v3/liveChat/messages, query: { id: "{message_id}" } }
    expect: { status: 204 }
    returns: ack

  ban_chat_user:
    summary: Ban a viewer from a live chat permanently (liveChatBans.insert, type permanent; 200 quota units)
    params:
      live_chat_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 256, required: true,
                      label: Live chat ID,
                      description: "The chat's id, a broadcast's snippet.liveChatId." }
      channel_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                    label: Viewer channel ID,
                    description: "The banned viewer's channel id, a chat message's authorDetails.channelId." }
    send: { method: POST, path: /youtube/v3/liveChat/bans, query: { part: snippet },
            body: '{"snippet":{"liveChatId":{live_chat_id:json},"type":"permanent","bannedUserDetails":{"channelId":{channel_id:json}}}}',
            content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  ban_chat_user_temporarily:
    summary: Time a viewer out of a live chat (liveChatBans.insert, type temporary; 200 quota units)
    params:
      live_chat_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 256, required: true,
                      label: Live chat ID,
                      description: "The chat's id, a broadcast's snippet.liveChatId." }
      channel_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                    label: Viewer channel ID,
                    description: "The viewer's channel id, a chat message's authorDetails.channelId." }
      duration_secs: { type: int, min: 1, default: 300,
                       label: Duration,
                       description: "How long the viewer is kept out of the chat, in seconds." }
    send: { method: POST, path: /youtube/v3/liveChat/bans, query: { part: snippet },
            body: '{"snippet":{"liveChatId":{live_chat_id:json},"type":"temporary","bannedUserDetails":{"channelId":{channel_id:json}},"banDurationSeconds":{duration_secs}}}',
            content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  unban_chat_user:
    summary: Lift a live chat ban (liveChatBans.delete; 200 quota units)
    params:
      ban_id: { type: string, pattern: "^[A-Za-z0-9_.-]+$", max_length: 256, required: true,
                label: Ban ID,
                description: "The ban's id, from the reply to ban_chat_user." }
    send: { method: DELETE, path: /youtube/v3/liveChat/bans, query: { id: "{ban_id}" } }
    expect: { status: 204 }
    returns: ack

  list_chat_moderators:
    summary: A live chat's moderators, kept in state (liveChatModerators.list; 50 quota units)
    params:
      live_chat_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 256, required: true,
                      label: Live chat ID,
                      description: "The chat's id, a broadcast's snippet.liveChatId." }
    send: { method: GET, path: /youtube/v3/liveChat/moderators,
            query: { liveChatId: "{live_chat_id}", part: "id,snippet", maxResults: "50" }, pages: *pages }
    expect: { status: 200, json_path: "$.items" }
    returns: value

  add_chat_moderator:
    summary: Make a viewer a moderator of a live chat (liveChatModerators.insert; 200 quota units)
    params:
      live_chat_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 256, required: true,
                      label: Live chat ID,
                      description: "The chat's id, a broadcast's snippet.liveChatId." }
      channel_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                    label: Viewer channel ID,
                    description: "The new moderator's channel id, a chat message's authorDetails.channelId." }
    send: { method: POST, path: /youtube/v3/liveChat/moderators, query: { part: snippet },
            body: '{"snippet":{"liveChatId":{live_chat_id:json},"moderatorDetails":{"channelId":{channel_id:json}}}}',
            content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  remove_chat_moderator:
    summary: Take a moderator's role in a live chat away (liveChatModerators.delete; 200 quota units)
    params:
      moderator_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 256, required: true,
                      label: Moderator ID,
                      description: "The moderator resource's id, from chat_moderators in state or list_chat_moderators (not the channel id)." }
    send: { method: DELETE, path: /youtube/v3/liveChat/moderators, query: { id: "{moderator_id}" } }
    expect: { status: 204 }
    returns: ack

  create_chat_poll:
    summary: Pin a poll in a live chat; one active poll at a time (liveChatMessages.insert, type pollEvent; 20 quota units)
    params:
      live_chat_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 256, required: true,
                      label: Live chat ID,
                      description: "The chat's id, a broadcast's snippet.liveChatId." }
      question: { type: string, pattern: "\\S", max_length: 200, required: true,
                  label: Question,
                  description: "The poll's question." }
      options: { type: json, required: true,
                 label: Options,
                 description: "A JSON array of 2 to 4 objects as YouTube documents them, each {\"optionText\": \"...\"}, shown in that order." }
    send: { method: POST, path: /youtube/v3/liveChat/messages, query: { part: snippet },
            body: '{"snippet":{"liveChatId":{live_chat_id:json},"type":"pollEvent","pollDetails":{"metadata":{"questionText":{question:json},"options":{options}}}}}',
            content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  close_chat_poll:
    summary: Close a live chat poll, answering its final tallies (liveChatMessages.transition, status closed; 20 quota units)
    params:
      message_id: { type: string, pattern: "^[A-Za-z0-9_.-]+$", max_length: 256, required: true,
                    label: Poll message ID,
                    description: "The poll's chat message id, chat_poll.message_id in state." }
    send: { method: POST, path: /youtube/v3/liveChat/messages/transition,
            query: { id: "{message_id}", status: closed, part: "id,snippet" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  list_super_chat_events:
    summary: The channel's Super Chats and Super Stickers of the last 30 days, newest first, kept in state (superChatEvents.list; 1 quota unit)
    params:
      max_results: { type: int, min: 1, max: 50, default: 50,
                     label: Events,
                     description: "How many events to return, 1 to 50." }
    send: { method: GET, path: /youtube/v3/superChatEvents, query: { part: snippet, maxResults: "{max_results}" } }
    expect: { status: 200, json_path: "$.items" }
    returns: value

  list_super_chat_events_page:
    summary: The next page of Super Chats and Super Stickers after an earlier reply, with its nextPageToken, kept in state (superChatEvents.list with pageToken; 1 quota unit)
    params:
      max_results: { type: int, min: 1, max: 50, default: 50,
                     label: Events,
                     description: "How many events to return, 1 to 50." }
      page_token: { type: string, pattern: "^[A-Za-z0-9_=-]+$", max_length: 1024, required: true,
                    label: Page token,
                    description: "The nextPageToken of the previous reply." }
    send: { method: GET, path: /youtube/v3/superChatEvents,
            query: { part: snippet, maxResults: "{max_results}", pageToken: "{page_token}" } }
    expect: { status: 200, json_path: "$" }
    returns: value

  # ── The broadcast's video ────────────────────────────────────────────────
  get_video:
    summary: A broadcast's video metadata (category, tags, description, made-for-kids, embedding, licence) with its live details and statistics (videos.list part snippet, status, liveStreamingDetails, statistics; 1 quota unit)
    params:
      video_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", max_length: 64, required: true,
                  label: Video ID,
                  description: "The broadcast's id, which is also its video id." }
    send: { method: GET, path: /youtube/v3/videos,
            query: { part: "snippet,status,liveStreamingDetails,statistics", id: "{video_id}" } }
    expect: { status: 200, json_path: "$.items" }
    returns: value

  update_video:
    summary: Replace a video's snippet and status with a video resource; properties left out are deleted (videos.update part snippet,status; 50 quota units)
    params:
      video: { type: json, required: true,
               label: Video,
               description: "A video resource as YouTube documents it, with id, snippet (title and categoryId required, description, tags, defaultLanguage) and status (privacyStatus, selfDeclaredMadeForKids, embeddable, publicStatsViewable, license, containsSyntheticMedia)." }
    send: { method: PUT, path: /youtube/v3/videos, query: { part: "snippet,status" },
            body: '{video}', content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  update_video_snippet:
    summary: Replace a video's title, category, description, tags and language with a video resource's snippet; what is left out is deleted (videos.update part snippet; 50 quota units)
    params:
      video: { type: json, required: true,
               label: Video,
               description: "A video resource with id and the whole snippet: title and categoryId required, and every description, tags and defaultLanguage to keep." }
    send: { method: PUT, path: /youtube/v3/videos, query: { part: snippet },
            body: '{video}', content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  update_video_status:
    summary: Replace a video's privacy, made-for-kids declaration, embedding, public statistics and licence with a video resource's status (videos.update part status; 50 quota units)
    params:
      video: { type: json, required: true,
               label: Video,
               description: "A video resource with id and the whole status: privacyStatus, selfDeclaredMadeForKids, embeddable, publicStatsViewable, license and containsSyntheticMedia to keep." }
    send: { method: PUT, path: /youtube/v3/videos, query: { part: status },
            body: '{video}', content_type: application/json }
    expect: { status: 200, json_path: "$" }
    returns: value

  set_thumbnail:
    summary: Upload a video's custom thumbnail image (thumbnails.set; about 50 quota units); answers the thumbnails set
    params:
      video_id: { type: string, max_length: 64, pattern: "^[A-Za-z0-9_-]+$", required: true,
                  label: Video ID,
                  description: "The id of the video (a broadcast's id is its video's) whose thumbnail is set." }
      image: { type: binary, max_length: 52428800, required: true,
               label: Image,
               description: "The thumbnail image file, given as base64 or as a host file; at most 50 MB." }
      format: { type: enum, values: [image/jpeg, image/png, application/octet-stream], default: image/jpeg,
                label: Image format,
                description: "The image's media type: JPEG, PNG, or application/octet-stream when unknown." }
    send: { method: POST, path: /upload/youtube/v3/thumbnails/set,
            query: { videoId: "{video_id}", uploadType: media },
            body: { binary: image }, content_type: "{format}" }
    expect: { status: 200, json_path: "$.items" }
    returns: value

  list_video_categories:
    summary: The video categories that can be assigned in a region, for a video's snippet.categoryId (videoCategories.list; 1 quota unit)
    params:
      region_code: { type: string, pattern: "^[A-Z]{2}$", default: "US",
                     label: Region,
                     description: "An ISO 3166-1 alpha-2 country code such as US or GB." }
    send: { method: GET, path: /youtube/v3/videoCategories, query: { part: snippet, regionCode: "{region_code}" } }
    expect: { status: 200, json_path: "$.items" }
    returns: value

quirks:
  - models: [all]
    severity: info
    text: >
      A cloud service. Open the integration with host www.googleapis.com and
      port 443; it is reached over HTTPS and the certificate is checked
      against that name. The broadcast followed is the one named by the
      broadcast_id setting; to follow another, open the integration again.

  - models: [all]
    severity: warning
    text: >
      The consumer owns the credential. It registers its own Google OAuth
      client, runs the sign-in (scope youtube or youtube.force-ssl) and
      passes client_id, client_secret (empty for an installed-app client),
      refresh_token, access_token and expires_at as settings. The access
      token is sent as Bearer and refreshed at Google's token endpoint 5
      minutes before it expires (about hourly), or at once when there is
      none; requests wait for the refresh. Each new access token and expiry
      is reported in a credentials event, which the consumer must persist:
      the core keeps tokens in memory only. A 401 from the API refreshes the
      token and sends the request once more; a second 401, or a refresh
      Google refuses (invalid_grant: the refresh token expired or was
      revoked), is terminal: the integration reports unauthorized, commands
      fail with auth, and nothing more is sent until the consumer signs in
      again and passes the new tokens with update_settings. A token endpoint
      that cannot be reached is retried with backoff. Without a refresh
      token, access_token alone is a plain bearer token, used until Google
      refuses it. Google's 403s (quota, rate limits, permissions, an invalid
      transition) are ordinary command failures, not refusals. Refreshing
      costs no YouTube quota.

  - models: [all]
    severity: warning
    text: >
      A Google Cloud project whose OAuth consent screen is for external
      users and still in publishing status Testing gets refresh tokens that
      expire after 7 days: a week after signing in, the refresh fails with
      invalid_grant and the integration reports unauthorized until the user
      signs in again. Publish the consent screen (Google's verification for
      the youtube scopes) for refresh tokens that last. Google also keeps at
      most 100 refresh tokens per Google account per client ID; signing in a
      101st time silently invalidates the oldest, so a product should reuse
      one sign-in per account rather than signing in per device.

  - models: [all]
    severity: warning
    text: >
      Every request spends the consumer's Google Cloud project quota, by
      default 10,000 units a day shared by every user of that project and
      reset at midnight Pacific Time. Every broadcast and stream method costs
      1 unit (transitions, binds and ad breaks included); reading chat costs
      5, posting or deleting a chat message, a poll or closing one 20, a ban
      or unban 200, listing chat moderators 50 and adding or removing one
      200, and a video metadata update 50. Google changes these costs: its
      quota table is the reference.
      State is polled once a minute with three lists (the broadcast, the
      channel's streams and the broadcast's video details): 3 units a minute,
      180 an hour, 4,320 a day if left open. Open the integration with
      monitoring only while a broadcast is being produced, and commands-only
      otherwise. Once the quota is spent, Google answers 403 quotaExceeded to
      everything until it resets. Idle probes ask for a path that is no API
      method, which costs nothing.

  - models: [all]
    severity: critical
    text: >
      go_live makes the broadcast public at once, and complete_broadcast ends
      it for good: a completed broadcast can't be taken live again, and
      viewers see it end. With the broadcast's enableAutoStop on, YouTube
      also completes it about a minute after the stream stops. start_testing
      and go_live need the bound stream active (receiving data), else Google
      answers 403 errorStreamInactive; a transition YouTube is still
      carrying out (testStarting, liveStarting) answers 403 too.

  - models: [all]
    severity: critical
    text: >
      delete_broadcast and delete_stream can't be undone. Deleting a stream
      deletes its stream key: an encoder still sending to it loses the
      broadcast. update_broadcast and update_stream replace the resource:
      a property left out of the body is deleted, and a broadcast's privacy
      falls back to the default.

  - models: [all]
    severity: info
    text: >
      State is polled, so a change made in YouTube Studio shows up within a
      minute; the replies to this integration's own transitions and binds
      update the broadcast at once. Stream health (streams.<id>.health) is
      YouTube's own assessment and lags the encoder by YouTube's update
      interval (health_updated is its time). The broadcast's stream is
      streams.<broadcasts.<id>.bound_stream_id>. concurrent_viewers is only
      reported while live and when the channel shows the count, and is not
      cleared when it stops being reported. Every stream of the channel is
      polled, 50 a page. YouTube reports nothing it pushes; webhooks are
      not offered for live streaming.

  - models: [all]
    severity: info
    text: >
      The list commands return the replies' items, which for streams
      include cdn.ingestionInfo.streamName, the stream key: treat it as a
      secret. The key is not copied into state. Strings YouTube leaves null
      are kept as the text null.

  - models: [all]
    severity: info
    text: >
      Live chat is read with list_chat_messages (the chat from the start)
      and then list_chat_messages_after, passing the last reply's
      nextPageToken, which the consumer polls at the reply's
      pollingIntervalMillis (5 units each) for the messages since. YouTube's
      streaming liveChatMessages.streamList is a
      server-streamed gRPC-style call the core does not speak. Chat is not
      polled into state.

  - models: [all]
    severity: warning
    text: >
      A broadcast's category, tags, description, language, made-for-kids
      declaration, embedding, public statistics and licence belong to its
      video, and are read once a minute with the video's live details at no
      extra cost (broadcasts.<id>.category_id and the rest). videos.update
      replaces a whole part: the snippet (title and categoryId are required)
      or the status. Whatever the body leaves out is deleted, so one value
      cannot be changed alone; build the body from the current values in
      state and change the one wanted. Title and privacy are the
      broadcast's as well: liveBroadcasts and videos share them. made_for_kids
      is YouTube's own decision and may differ from the channel's
      declaration (self_declared_made_for_kids), the only one that can be
      set. YouTube leaves tags out of the video when there are none, so after
      every tag is removed state keeps the last list. set_thumbnail uploads a
      video's custom thumbnail (thumbnails.set), which the channel must be
      allowed to use; the thumbnail is not kept in state.

  - models: [all]
    severity: info
    text: >
      Chat moderators (chat_moderators.<id>) are kept from the replies of
      list_chat_moderators, which replaces them when the chat has 50 or
      fewer, and of add_chat_moderator and remove_chat_moderator; they are
      not polled (50 units a list). The moderator id that
      remove_chat_moderator takes is the moderator resource's id, not the
      channel id. Only the owner of the chat's channel may change them.

  - models: [all]
    severity: info
    text: >
      Recent Super Chats and Super Stickers (super_chats.<id>) are kept from
      list_super_chat_events, each reply replacing them: the newest up to 50
      of the last 30 days. They are not polled; a consumer showing them live
      calls it on its own cadence (1 unit a call). amount_micros is the
      amount in millionths of the currency; display_string is YouTube's
      formatted amount. YouTube offers no way to change or refund them.

  - models: [all]
    severity: info
    text: >
      A live chat poll (chat_poll) is a chat message of type pollEvent with
      2 to 4 options; one active poll may be pinned at a time, and another
      is refused (preconditionCheckFailed) until it is closed. The poll is
      kept from create_chat_poll's reply, close_chat_poll's reply (with the
      final tallies) and any list_chat_messages reply that holds it. Tallies
      are given to the channel owner only, and while open only when the
      chat is read. YouTube's polls cannot be edited once posted.

state:
  broadcasts.*.title:               { type: string, description: "Broadcast title (snippet.title), keyed by broadcast id" }
  broadcasts.*.life_cycle_status:   { type: string, description: "created, ready, testStarting, testing, liveStarting, live, complete or revoked (status.lifeCycleStatus)" }
  broadcasts.*.privacy_status:      { type: string, description: "public, private or unlisted (status.privacyStatus)" }
  broadcasts.*.recording_status:    { type: string, description: "notRecording, recording or recorded (status.recordingStatus)" }
  broadcasts.*.bound_stream_id:     { type: string, description: "Id of the stream bound to the broadcast (contentDetails.boundStreamId)" }
  broadcasts.*.scheduled_start_time: { type: string, description: "Scheduled start, ISO 8601 (snippet.scheduledStartTime)" }
  broadcasts.*.actual_start_time:   { type: string, description: "When the broadcast went live, ISO 8601 (snippet.actualStartTime)" }
  broadcasts.*.actual_end_time:     { type: string, description: "When the broadcast ended, ISO 8601 (snippet.actualEndTime)" }
  broadcasts.*.live_chat_id:        { type: string, description: "Id of the broadcast's live chat (snippet.liveChatId)" }
  broadcasts.*.monitor_stream:      { type: bool, description: "The monitor stream is on, so the broadcast can be tested (contentDetails.monitorStream.enableMonitorStream)" }
  broadcasts.*.stream_delay_ms:     { type: int, unit: ms, description: "Broadcast delay behind the monitor stream (contentDetails.monitorStream.broadcastStreamDelayMs)" }
  broadcasts.*.auto_start:          { type: bool, description: "The broadcast goes live when its stream starts (contentDetails.enableAutoStart)" }
  broadcasts.*.auto_stop:           { type: bool, description: "The broadcast completes about a minute after its stream stops (contentDetails.enableAutoStop)" }
  broadcasts.*.dvr:                 { type: bool, description: "Viewers can seek back in the live stream (contentDetails.enableDvr)" }
  broadcasts.*.latency_preference:  { type: string, description: "normal, low or ultraLow (contentDetails.latencyPreference)" }
  broadcasts.*.concurrent_viewers:  { type: int, description: "People watching now, while live (video liveStreamingDetails.concurrentViewers)" }
  broadcasts.*.active_live_chat_id: { type: string, description: "Id of the live chat while live (video liveStreamingDetails.activeLiveChatId)" }
  broadcasts.*.view_count:          { type: int, description: "Video views (video statistics.viewCount)" }
  broadcasts.*.like_count:          { type: int, description: "Video likes (video statistics.likeCount)" }
  broadcasts.*.comment_count:       { type: int, description: "Video comments (video statistics.commentCount)" }
  broadcasts.*.description:         { type: string, description: "The video's description (video snippet.description)" }
  broadcasts.*.category_id:         { type: string, description: "The video's category id, from list_video_categories (video snippet.categoryId)" }
  broadcasts.*.tags:                { type: string, description: "The video's tags as a JSON array (video snippet.tags)" }
  broadcasts.*.default_language:    { type: string, description: "The language of the title and description (video snippet.defaultLanguage)" }
  broadcasts.*.made_for_kids:       { type: bool, description: "YouTube treats the video as made for kids (video status.madeForKids, read-only)" }
  broadcasts.*.self_declared_made_for_kids: { type: bool, description: "The channel declared the video made for kids (video status.selfDeclaredMadeForKids)" }
  broadcasts.*.embeddable:          { type: bool, description: "The video can be embedded on other sites (video status.embeddable)" }
  broadcasts.*.public_stats_viewable: { type: bool, description: "Viewers can see the video's statistics (video status.publicStatsViewable)" }
  broadcasts.*.license:             { type: string, description: "youtube or creativeCommon (video status.license)" }
  broadcasts.*.contains_synthetic_media: { type: bool, description: "The video is declared as holding altered or synthetic content (video status.containsSyntheticMedia)" }
  chat_moderators.*.live_chat_id:   { type: string, description: "The chat a moderator moderates, keyed by moderator resource id" }
  chat_moderators.*.channel_id:     { type: string, description: "The moderator's channel id" }
  chat_moderators.*.display_name:   { type: string, description: "The moderator's channel name" }
  super_chats.*.supporter_name:     { type: string, description: "Who sent the Super Chat or Super Sticker, keyed by event id" }
  super_chats.*.supporter_channel_id: { type: string, description: "The sender's channel id" }
  super_chats.*.comment:            { type: string, description: "The message sent with it" }
  super_chats.*.amount_micros:      { type: int, description: "The amount in millionths of the currency (amountMicros)" }
  super_chats.*.currency:           { type: string, description: "ISO 4217 currency code" }
  super_chats.*.display_string:     { type: string, description: "The amount as YouTube shows it, such as $1.00" }
  super_chats.*.tier:               { type: int, description: "The paid message's tier (messageType)" }
  super_chats.*.sticker:            { type: bool, description: "A Super Sticker rather than a Super Chat" }
  super_chats.*.created_at:         { type: string, description: "When it was sent, ISO 8601" }
  chat_poll.message_id:             { type: string, description: "The live chat poll's message id" }
  chat_poll.live_chat_id:           { type: string, description: "The chat the poll is in" }
  chat_poll.question:               { type: string, description: "The poll's question" }
  chat_poll.status:                 { type: string, description: "active, closed or unknown" }
  chat_poll.options.*.text:         { type: string, description: "An option's text; options are numbered from 0 in order" }
  chat_poll.options.*.tally:        { type: int, description: "Votes for the option, to the channel owner only" }
  streams.*.title:                  { type: string, description: "Stream title (snippet.title), keyed by stream id" }
  streams.*.stream_status:          { type: string, description: "active (receiving data), inactive, ready, created or error (status.streamStatus)" }
  streams.*.health:                 { type: string, description: "good, ok, bad or noData (status.healthStatus.status)" }
  streams.*.health_updated:         { type: int, unit: s, description: "When YouTube last assessed the health, Unix time (status.healthStatus.lastUpdateTimeSeconds)" }
  streams.*.configuration_issues:   { type: string, description: "The health's configuration issues as JSON, each with type, severity (info, warning, error), reason and description (status.healthStatus.configurationIssues)" }
  streams.*.ingestion_type:         { type: string, description: "rtmp, dash or hls (cdn.ingestionType)" }
  streams.*.resolution:             { type: string, description: "Declared resolution, such as 1080p or variable (cdn.resolution)" }
  streams.*.frame_rate:             { type: string, description: "Declared frame rate, 30fps, 60fps or variable (cdn.frameRate)" }

telemetry:
  # YouTube pushes nothing, and every request spends quota: the followed
  # broadcast, the channel's streams and the broadcast's viewers are polled
  # once a minute (3 units).
  poll:
    every_ms: 60000
    send:
      - { method: GET, path: /youtube/v3/liveBroadcasts,
          query: { part: "id,snippet,contentDetails,status", id: "{settings.broadcast_id}" } }
      - { method: GET, path: /youtube/v3/liveStreams,
          query: { part: "id,snippet,cdn,status", mine: "true", maxResults: "50" }, pages: *pages }
      - { method: GET, path: /youtube/v3/videos,
          query: { part: "snippet,status,liveStreamingDetails,statistics", id: "{settings.broadcast_id}" } }
  updates:
    - path: '^/youtube/v3/liveBroadcasts\?'
      json_each: "$.items"
      json: &broadcast
        id: "$.id"
        title: "$.snippet.title"
        life: "$.status.lifeCycleStatus"
        privacy: "$.status.privacyStatus"
        recording: "$.status.recordingStatus"
        stream: "$.contentDetails.boundStreamId"
        scheduled: "$.snippet.scheduledStartTime"
        started: "$.snippet.actualStartTime"
        ended: "$.snippet.actualEndTime"
        chat: "$.snippet.liveChatId"
        monitor: "$.contentDetails.monitorStream.enableMonitorStream"
        delay: "$.contentDetails.monitorStream.broadcastStreamDelayMs"
        auto_start: "$.contentDetails.enableAutoStart"
        auto_stop: "$.contentDetails.enableAutoStop"
        dvr: "$.contentDetails.enableDvr"
        latency: "$.contentDetails.latencyPreference"
      state: &broadcast_state
        broadcasts.{id}.title: "{title}"
        broadcasts.{id}.life_cycle_status: "{life}"
        broadcasts.{id}.privacy_status: "{privacy}"
        broadcasts.{id}.recording_status: "{recording}"
        broadcasts.{id}.bound_stream_id: "{stream}"
        broadcasts.{id}.scheduled_start_time: "{scheduled}"
        broadcasts.{id}.actual_start_time: "{started}"
        broadcasts.{id}.actual_end_time: "{ended}"
        broadcasts.{id}.live_chat_id: "{chat}"
        broadcasts.{id}.monitor_stream: "{monitor}"
        broadcasts.{id}.stream_delay_ms: "{delay}"
        broadcasts.{id}.auto_start: "{auto_start}"
        broadcasts.{id}.auto_stop: "{auto_stop}"
        broadcasts.{id}.dvr: "{dvr}"
        broadcasts.{id}.latency_preference: "{latency}"
    # A transition, bind or insert answers with the one broadcast.
    - path: '^/youtube/v3/liveBroadcasts(/transition|/bind)?\?'
      json_match: { "$.kind": "^youtube#liveBroadcast$" }
      json: *broadcast
      state: *broadcast_state
    - path: '^/youtube/v3/liveStreams\?'
      json_each: "$.items"
      json:
        id: "$.id"
        title: "$.snippet.title"
        status: "$.status.streamStatus"
        health: "$.status.healthStatus.status"
        updated: "$.status.healthStatus.lastUpdateTimeSeconds"
        issues: "$.status.healthStatus.configurationIssues"
        ingestion: "$.cdn.ingestionType"
        resolution: "$.cdn.resolution"
        frame_rate: "$.cdn.frameRate"
      state:
        streams.{id}.title: "{title}"
        streams.{id}.stream_status: "{status}"
        streams.{id}.health: "{health}"
        streams.{id}.health_updated: "{updated}"
        streams.{id}.configuration_issues: "{issues}"
        streams.{id}.ingestion_type: "{ingestion}"
        streams.{id}.resolution: "{resolution}"
        streams.{id}.frame_rate: "{frame_rate}"
    # The poll's list of the channel's streams (mine, 50 a page, every page
    # joined) is the whole list: it also replaces the streams (the rule above
    # writes them), so a deleted stream leaves the state. A lookup by id adds
    # and removes nothing.
    - path: '^/youtube/v3/liveStreams\?part=[^&]*&mine=true&maxResults=50$'
      json_match: { "$.items": '^\[' }
      json: {}
      replace: streams
    - path: '^/youtube/v3/videos\?'
      json_each: "$.items"
      json:
        id: "$.id"
        viewers: "$.liveStreamingDetails.concurrentViewers"
        chat: "$.liveStreamingDetails.activeLiveChatId"
        views: "$.statistics.viewCount"
        likes: "$.statistics.likeCount"
        comments: "$.statistics.commentCount"
      state:
        broadcasts.{id}.concurrent_viewers: "{viewers}"
        broadcasts.{id}.active_live_chat_id: "{chat}"
        broadcasts.{id}.view_count: "{views}"
        broadcasts.{id}.like_count: "{likes}"
        broadcasts.{id}.comment_count: "{comments}"
    # The video's metadata: from the poll and get_video (part snippet and
    # status), and from an update's reply (the video resource itself).
    - path: '^/youtube/v3/videos\?'
      json_each: "$.items"
      json: &video
        id: "$.id"
        description: "$.snippet.description"
        category: "$.snippet.categoryId"
        tags: "$.snippet.tags"
        language: "$.snippet.defaultLanguage"
        kids: "$.status.madeForKids"
        self_kids: "$.status.selfDeclaredMadeForKids"
        embeddable: "$.status.embeddable"
        stats: "$.status.publicStatsViewable"
        license: "$.status.license"
        synthetic: "$.status.containsSyntheticMedia"
      state: &video_state
        broadcasts.{id}.description: "{description}"
        broadcasts.{id}.category_id: "{category}"
        broadcasts.{id}.tags: "{tags}"
        broadcasts.{id}.default_language: "{language}"
        broadcasts.{id}.made_for_kids: "{kids}"
        broadcasts.{id}.self_declared_made_for_kids: "{self_kids}"
        broadcasts.{id}.embeddable: "{embeddable}"
        broadcasts.{id}.public_stats_viewable: "{stats}"
        broadcasts.{id}.license: "{license}"
        broadcasts.{id}.contains_synthetic_media: "{synthetic}"
    - path: '^/youtube/v3/videos\?'
      json_match: { "$.kind": "^youtube#video$" }
      json: *video
      state: *video_state

    # Chat moderators: every page joined is the whole list.
    - path: '^/youtube/v3/liveChat/moderators\?'
      json_each: "$.items"
      json: { id: "$.id", chat: "$.snippet.liveChatId", channel: "$.snippet.moderatorDetails.channelId",
              name: "$.snippet.moderatorDetails.displayName" }
      state:
        chat_moderators.{id}.live_chat_id: "{chat}"
        chat_moderators.{id}.channel_id: "{channel}"
        chat_moderators.{id}.display_name: "{name}"
    - path: '^/youtube/v3/liveChat/moderators\?liveChatId=[^&]+&part=[^&]*&maxResults=50$'
      json_match: { "$.items": '^\[' }
      json: {}
      replace: chat_moderators
    - path: '^/youtube/v3/liveChat/moderators\?part=snippet$'
      json_match: { "$.kind": "^youtube#liveChatModerator$" }
      json: { id: "$.id", chat: "$.snippet.liveChatId", channel: "$.snippet.moderatorDetails.channelId",
              name: "$.snippet.moderatorDetails.displayName" }
      state:
        chat_moderators.{id}.live_chat_id: "{chat}"
        chat_moderators.{id}.channel_id: "{channel}"
        chat_moderators.{id}.display_name: "{name}"
    - path: '^/youtube/v3/liveChat/moderators\?id=([A-Za-z0-9_-]+)$'
      json: {}
      state: { "chat_moderators.{1}": { delete: true } }

    # Super Chats: each list replaces the recent ones.
    - path: '^/youtube/v3/superChatEvents\?'
      json_each: "$.items"
      json:
        id: "$.id"
        name: "$.snippet.supporterDetails.displayName"
        channel: "$.snippet.supporterDetails.channelId"
        comment: "$.snippet.commentText"
        micros: "$.snippet.amountMicros"
        currency: "$.snippet.currency"
        display: "$.snippet.displayString"
        tier: "$.snippet.messageType"
        sticker: "$.snippet.isSuperStickerEvent"
        at: "$.snippet.createdAt"
      replace: super_chats
      state:
        super_chats.{id}.supporter_name: "{name}"
        super_chats.{id}.supporter_channel_id: "{channel}"
        super_chats.{id}.comment: "{comment}"
        super_chats.{id}.amount_micros: "{micros}"
        super_chats.{id}.currency: "{currency}"
        super_chats.{id}.display_string: "{display}"
        super_chats.{id}.tier: "{tier}"
        super_chats.{id}.sticker: "{sticker}"
        super_chats.{id}.created_at: "{at}"

    # A live chat poll: the insert's or transition's reply (the message), or
    # a chat list that holds it.
    - path: '^/youtube/v3/liveChat/messages(/transition)?\?'
      json_match: { "$.kind": "^youtube#liveChatMessage$", "$.snippet.type": "^pollEvent$" }
      json: { id: "$.id", chat: "$.snippet.liveChatId", question: "$.snippet.pollDetails.metadata.questionText",
              status: "$.snippet.pollDetails.metadata.status" }
      replace: chat_poll
      state:
        chat_poll.message_id: "{id}"
        chat_poll.live_chat_id: "{chat}"
        chat_poll.question: "{question}"
        chat_poll.status: "{status}"
    - path: '^/youtube/v3/liveChat/messages(/transition)?\?'
      json_match: { "$.kind": "^youtube#liveChatMessage$", "$.snippet.type": "^pollEvent$" }
      json_each: "$.snippet.pollDetails.metadata.options"
      json: { text: "$.optionText", tally: "$.tally" }
      state:
        chat_poll.options.{index}.text: "{text}"
        chat_poll.options.{index}.tally: "{tally}"
    - path: '^/youtube/v3/liveChat/messages\?'
      json_each: "$.items"
      each_match: { "$.snippet.type": "^pollEvent$" }
      json: { id: "$.id", chat: "$.snippet.liveChatId", question: "$.snippet.pollDetails.metadata.questionText",
              status: "$.snippet.pollDetails.metadata.status" }
      replace: chat_poll
      state:
        chat_poll.message_id: "{id}"
        chat_poll.live_chat_id: "{chat}"
        chat_poll.question: "{question}"
        chat_poll.status: "{status}"
    - path: '^/youtube/v3/liveChat/messages\?'
      json_each: "$.items[*].snippet.pollDetails.metadata.options"
      each_match: { "$^.snippet.type": "^pollEvent$" }
      json: { text: "$.optionText", tally: "$.tally" }
      state:
        chat_poll.options.{index}.text: "{text}"
        chat_poll.options.{index}.tally: "{tally}"
