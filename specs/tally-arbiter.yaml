  output_types.*.enabled:    { type: bool, description: "Action type available" }
  output_types.*.fields:     { type: array, description: "The fields of the action type's data" }
  camera_models.*.label:     { type: string, description: "Camera protocol name, keyed by camera model id" }
  camera_models.*.visible:   { type: bool, description: "Camera protocol offered" }
  device_sources.*.device_id: { type: string, description: "Device of the mapping, keyed by device source id" }
  device_sources.*.source_id: { type: string, description: "Source of the mapping" }
  device_sources.*.address:  { type: string, description: "The source's address that is the device" }
  device_sources.*.bus:      { type: string, description: "The source type's bus the mapping follows; empty for none" }
  device_sources.*.rename:   { type: bool, description: "Renames the input on the source after the device" }
  device_sources.*.reconnect_interval: { type: int, unit: ms, description: "Time between reconnection attempts" }
  device_sources.*.max_reconnects: { type: int, description: "Reconnection attempts before giving up" }
  device_sources.*.cloud:    { type: bool, description: "The mapping came from a relaying server" }
  device_actions.*.device_id: { type: string, description: "Device of the action, keyed by device action id" }
  device_actions.*.bus_id:   { type: string, description: "Bus whose change runs the action" }
  device_actions.*.active:   { type: bool, description: "Runs on entering the bus (true) or leaving it (false)" }
  device_actions.*.output_type_id: { type: string, description: "Action type (output_types)" }
  device_actions.*.data:     { type: object, description: "The action type's fields, keyed by field name" }
  listener_clients.*.device_id: { type: string, description: "Device the listener client shows, keyed by listener client id" }
  listener_clients.*.internal_id: { type: string, description: "The listener client's own id for itself" }
  listener_clients.*.listener_type: { type: string, description: "What the listener client is (web, m5stickc, relay and so on)" }
  listener_clients.*.ip_address: { type: string, description: "The listener client's address" }
  listener_clients.*.connected_at: { type: int, unit: ms, description: "When it connected, in Unix milliseconds" }
  listener_clients.*.inactive: { type: bool, description: "Disconnected; removed after an hour" }
  listener_clients.*.inactive_at: { type: int, unit: ms, description: "When it disconnected, in Unix milliseconds" }
  listener_clients.*.can_be_flashed: { type: bool, description: "Takes flash" }
  listener_clients.*.can_be_reassigned: { type: bool, description: "Takes reassign" }
  listener_clients.*.supports_chat: { type: bool, description: "Takes messages" }
  listener_clients.*.cloud:  { type: bool, description: "The listener client is on a relaying server" }
  tsl_clients.*.ip:          { type: string, description: "TSL client address, keyed by TSL client id" }
  tsl_clients.*.port:        { type: int, description: "TSL client port" }
  tsl_clients.*.transport:   { type: string, description: "udp or tcp" }
  tsl_clients.*.protocol:    { type: string, description: "TSL protocol version: 3.1 or 5.0" }
  tsl_clients.*.protocol_options: { type: object, description: "Tally bit mapping and brightness" }
  tsl_clients.*.connected:   { type: bool, description: "Connected (TCP)" }
  tsl_clients.*.error:       { type: bool, description: "The last send failed" }
  cloud_destinations.*.host: { type: string, description: "Destination server, keyed by cloud destination id" }
  cloud_destinations.*.port: { type: int, description: "Destination port" }
  cloud_destinations.*.key:  { type: string, description: "Cloud key the destination is relayed to with" }
  cloud_destinations.*.status: { type: string, description: "connected, disconnected, invalid_key or error" }
  cloud_destinations.*.connected: { type: bool, description: "Connected to the destination" }
  cloud_keys:                { type: array, description: "Keys other servers relay to this one with" }
  cloud_clients.*.ip_address: { type: string, description: "Relaying server's address, keyed by cloud client id" }
  cloud_clients.*.key:       { type: string, description: "Key it relays with" }
  cloud_clients.*.connected_at: { type: int, unit: ms, description: "When it connected, in Unix milliseconds" }
  cloud_clients.*.inactive:  { type: bool, description: "Disconnected" }
  users.*.roles:             { type: string, description: "The account's roles separated by semicolons, keyed by username (read with get_users, and after each user change)" }
  users.*.must_change_password: { type: bool, description: "The account must replace the shipped password before anything else" }
  default_password_users:    { type: array, description: "Accounts still on the shipped default password" }
  error_reports:             { type: array, description: "Error reports, each {id, datetime}" }
  unread_error_reports:      { type: array, description: "Unread error reports, each {id, datetime}" }
