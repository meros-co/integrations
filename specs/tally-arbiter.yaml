  sources.*.data:            { type: object, description: "The source type's fields, keyed by field name" }
  sources.*.cloud:           { type: bool, description: "The source came from a relaying server" }
  sources.*.tally.*:         { type: array, description: "Bus ids each address of the source is on, as the source last reported it (settings room)" }
  addresses.*:               { type: array, description: "Addresses a source reports, each {label, address}, keyed by source id (settings room)" }
  source_types.*.label:      { type: string, description: "Source type name, keyed by source type id" }
  source_types.*.help:       { type: string, description: "Help text for the source type" }
