telemetry:
  # Sent at once on connecting: a client that sends first is not subscribed
  # to notifications until it sends subscribe (with empty parameters).
  subscribe:
    send: ['{"command":"subscribe","parameters":{},"variables":{}}']
  poll:
    - every_ms: 5000
      send: ['{"command":"getTitleControlInfo","parameters":{},"variables":{}}']
    - every_ms: 30000
      send:
        - '{"command":"getProductInfo","parameters":{},"variables":{}}'
        - '{"command":"getVideoFormat","parameters":{},"variables":{}}'
        - '{"command":"getOutputDevice","parameters":{},"variables":{}}'
        - '{"command":"checkProjectEdited","parameters":{},"variables":{}}'
        - '{"command":"readProject","parameters":{},"variables":{}}'
  updates:
    # Every title, with its variables (getTitleControlInfo).
    - json_match: { "$.result.command": "^getTitleControlInfo$", "$.result.titles": "^\\[" }
      json_each: "$.result.titles"
      json: { id: "$.id", name: "$.name", channel: "$.channel", input: "$.input", play: "$.playStatus",
              status: "$.status", progress: "$.renderProgress", type: "$.type" }
      replace: titles
      state:
        "titles.{id:key}.name": "{name}"
        "titles.{id:key}.channel": "{channel}"
        "titles.{id:key}.input": "{input}"
        "titles.{id:key}.play_status": "{play}"
        "titles.{id:key}.render_status": "{status}"
        "titles.{id:key}.render_progress": "{progress}"
        "titles.{id:key}.type": "{type}"
    - json_match: { "$.result.command": "^getTitleControlInfo$" }
      json_each: "$.result.titles[*].variables"
      json: { id: "$^.id", variable: "$.variable", value: "$.value" }
      state: { "titles.{id:key}.variables.{variable:key}": "{value}" }
    # A title's play state, pushed as it changes.
    - json_match: { "$.notification.event": "^play$", "$.notification.id": "^\\{" }
      json: { id: "$.notification.id", play: "$.notification.play" }
      state: { "titles.{id:key}.play_status": "{play}" }
    - json_match: { "$.result.command": "^getProductInfo$" }
      json: { product: "$.result.product", version: "$.result.version", api: "$.result.api_version",
              licensed: "$.result.licensed", sku: "$.result.sku", build: "$.result.buildDate" }
      state:
        system.product: "{product}"
        system.version: "{version}"
        system.api_version: "{api}"
        system.licensed: "{licensed}"
        system.sku: "{sku}"
        system.build_date: "{build}"
    - json_match: { "$.result.command": "^getVideoFormat$" }
      json: { width: "$.result.width", height: "$.result.height", rate: "$.result.frameRate", interlaced: "$.result.interlaced" }
      state:
        video_format.width: "{width}"
        video_format.height: "{height}"
        video_format.frame_rate: "{rate}"
        video_format.interlaced: { value: "{interlaced}", map: { "0": false, "1": true } }
    - json_match: { "$.result.command": "^getOutputDevice$" }
      json: { device: "$.result.device" }
      state: { output.device: "{device}" }
    - json_match: { "$.result.command": "^checkProjectEdited$" }
      json: { path: "$.result.filePath", changed: "$.result.hasChanged", cached: "$.result.isCached",
              customized: "$.result.isCustomized", library: "$.result.isLibraryScene" }
      state:
        project.file: "{path}"
        project.changed: { value: "{changed}", map: { "0": false, "1": true } }
        project.cached: { value: "{cached}", map: { "0": false, "1": true } }
        project.customized: { value: "{customized}", map: { "0": false, "1": true } }
        project.library_scene: { value: "{library}", map: { "0": false, "1": true } }
    - json_match: { "$.result.command": "^readProject$" }
      json_each: "$.result.project[*].playlist"
      json: { channel: "$.channel", name: "$.name" }
      replace: channels
      state: { "channels.{channel}.name": "{name}" }

state:
  titles.*.name: { type: string, description: "Title (graphic layer) name, keyed by title id with its braces" }
  titles.*.channel: { type: int, description: "Channel the title is on, numbered from 0" }
  titles.*.input: { type: string, description: "Input (data controller) connected to the title; empty for none" }
  titles.*.play_status: { type: string, description: "Play status in Captivate's words, such as Off or Running" }
  titles.*.render_status: { type: string, description: "Render status in Captivate's words, such as Done" }
  titles.*.render_progress: { type: float, description: "Render progress, 0 to 1" }
  titles.*.type: { type: string, description: "Layer type, such as title" }
  titles.*.variables.*: { type: string, description: "Each title variable's value, keyed by variable name" }
  system.product: { type: string, description: "Product name, such as Captivate" }
  system.version: { type: string, description: "Product version" }
  system.api_version: { type: string, description: "API version, a date such as 250721" }
  system.licensed: { type: bool, description: "Whether the product is licensed" }
  system.sku: { type: string, description: "Product SKU" }
  system.build_date: { type: string, description: "Build date, such as Feb 21 2025" }
  video_format.width: { type: int, unit: px, description: "Project frame width" }
  video_format.height: { type: int, unit: px, description: "Project frame height" }
  video_format.frame_rate: { type: float, unit: fps, description: "Project frame rate" }
  video_format.interlaced: { type: bool, description: "Whether the project format is interlaced" }
  output.device: { type: string, description: "Output device, such as NDI" }
  project.file: { type: string, description: "Path of the current project file; empty when never saved" }
  project.changed: { type: bool, description: "Whether the project has unsaved changes" }
  project.cached: { type: bool, description: "Whether the project is cached" }
  project.customized: { type: bool, description: "Whether the project was customised" }
  project.library_scene: { type: bool, description: "Whether the project came from the library" }
  channels.*.name: { type: string, description: "Name of each channel tab, keyed by channel index from 0" }

quirks:
  - models: [all]
    severity: info
    text: >
      Channels are numbered from 0 left to right whatever their names: the tab
      labelled Channel 1 is channel 0, as the API counts them; state keys
      channels the same way. Titles are named by their name in the project
      list or their id in braces; ids are steadier, and state is keyed by id.
  - models: [all]
    severity: info
    text: >
      State comes from the play notifications Captivate pushes on the socket
      after subscribe, and from polls: the titles with their variables every
      5 s, the product, video format, output device, project and channels
      every 30 s. Data notifications are received but their shape is not
      documented, so variable changes are read from the poll. A command
      succeeds when the reply's result has success true; the reply's error
      field explains a failure.
  - models: [all]
    severity: info
    text: >
      Left out: the helper commands Captivate offers to data controllers
      running beside it, which act on the Captivate computer rather than on
      graphics (fetchUrl, getFileContent, setFileContent, getDirectoryContent,
      runDbQuery, convertToJson, encodeImage, downloadImage, openUrl,
      openFileDialog, openDirectoryDialog), getReport (user e-mail and machine
      id), getSnapShot, getPreviewFrame and getVideoFrame (images delivered
      as files or notifications), the deprecated XML command form and
      setProfile, which is XML-only.
  - models: [all]
    severity: critical
    text: >
      load_project and close_project replace or close the open project;
      clear_playlist and delete_title remove titles; set_video_format changes
      the project's format live.
  - models: [all]
    severity: info
    text: >
      The HTTP port (9022) and websocket port can be moved with the httpPort
      and webSocketPort registry or preference settings; the TCP port 9025 is
      fixed in the documents. Captivate must not find a port in use when it
      starts, or that API does not start.
