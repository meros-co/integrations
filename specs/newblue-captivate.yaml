spec: 1
id: newblue-captivate
name: NewBlue Captivate / Titler Live (Advanced API over TCP)
vendor: NewBlue
category: other

# NewBlue Captivate (and Titler Live, its earlier name) offers its scheduler
# API over a TCP socket on port 9025: JSON messages ending in CR LF, each
# answered with {"result": ...} or {"error": ...}, and, while the client is
# subscribed, notifications {"notification": ...} pushed on the same socket.
# A client that sends at once after connecting gets no welcome text and no
# notifications until it sends subscribe, which this spec does on connecting.
# The title XML is served over HTTP on port 9022.

source:
  - title: NewBlue Developer Site, Captivate API (External API Reference, All Commands Reference)
    author: NewBlue
    url: https://developers.newbluefx.com/captivate-api/advanced-api-reference/tcp-udp-and-http-connections
    note: >
      Manufacturer documents, read 2026-10-27 (the site's full text,
      https://developers.newbluefx.com/llms-full.txt). "TCP, UDP, and HTTP
      Connections": TCP port 9025, CR LF-ended JSON both ways, the welcome text
      ending in BEGIN DATA, no welcome or notifications for a client that sends
      at once until it sends subscribe; HTTP on 9022 (/api, /api/subscribe);
      UDP 9026; mDNS names. "API Communication": the scheduleCommand form
      {command, parameters, variables}, the scheduleAction form {action, input,
      title, variables}, updateInputDefinition {redefine, definition},
      saveSettings/loadSettings {input, settings}; results wrapped in
      {"result": ...}, failures {"error": "scheduleCommand failed", "data":
      ...}; notifications wrapped in {"notification": {channel, command:
      notify, event: play, id, input, play: Running, sender, title, to}}.
      "Additional HTTP Endpoints": GET /api/title/<id> (the title's XML),
      /api/tunnel, the httpPort and webSocketPort registry settings.
      "scheduleAction Method": the actions animateIn, animateOut, alert, cutIn,
      cutOut, render, update, still, hide/show, automatic, smart; title ids
      from getTitleControlInfo, whose titles carry channel, id, input, inputs,
      name, playStatus, renderProgress, status, type and variables.
      "Understanding Signals": subscribe with events play and data.
  - title: NewBlue Captivate REST API Commands (OpenAPI), API_VERSION 250721
    author: NewBlue (Jeff Mikels)
    url: https://developers.newbluefx.com/captivate-api/all-commands-reference
    note: >
      Manufacturer document, licence CC0 (api-spec.yaml linked from the All
      Commands Reference). Every command used here with its parameters and
      example replies: macro (events auto, in, out, stop, cut, update, still,
      play, setvars, show, hide, take, takein, link, unlink, activate,
      deactivate), customMessage, joinMeeting, meetingStatus, leaveMeeting,
      subscribe, getSubscriptions, getTimelineDuration, selectTitle,
      setTitleInput, removeTitleInput, setTitleName, setTitlePosition,
      newTitle, duplicateTitle, loadTitle, saveTitle, deleteTitle,
      openDesigner, closeDesigner, setOutputDevice, getOutputDevice,
      getStreamHostServer, startStreaming, stopStreaming, setPngOutPath,
      getVideoFormat, setVideoFormat, loadProject, saveProject, closeProject,
      checkProjectEdited, getCurrentProject, getRecentProjects, loadPlaylist,
      clearPlaylist, savePlaylist, attachProfile, changeInputName, setDynamic,
      assignVariable, the video and audio input commands, the replay_*
      commands, listCommands, getTime, getStats, getProductInfo, getReport,
      getAppGlobalSettings, readProject, readPlaylist, getProfileList,
      getProfile, readTitle, getRenderStatus, getPlayStatus,
      getTitlesPlayStatus, getInputsPlayStatus, isTitleConnected,
      getTitlesConnected, getTitleControlInfo, getTitleIcon, getMonitorFrame,
      setMaxCacheCount, rebuildCache, getCachePath, setCachePath,
      saveTitleCache. Channels are numbered from 0, -1 for all.

transport:
  type: line-tcp
  port: 9025
  framing: terminated
  terminator: crlf
  reply_framing: json
  encoding: utf-8
  timeout_ms: 8000
  # A reply is {"result": ...} or {"error": ...}; a notification is not.
  reply_match: '^\s*\{\s*"(result|error)"'
  probe: '{"command":"getTime","parameters":{},"variables":{}}'
  endpoints:
    http:
      port: { setting: http_port }

settings:
  http_port: { type: int, min: 1, max: 65535, default: 9022, label: HTTP port,
               description: "Captivate's HTTP API port (Generic HTML.httpPort), where the title XML is served; 9022 by default." }

ports:
  - { port: 9025, protocol: tcp, role: control, note: "Advanced API over TCP: commands, replies and notifications" }
  - { port: 9022, protocol: http, role: control, setting: http_port, note: "HTTP API: the title XML" }

models:
  - id: captivate
    name: NewBlue Captivate (Broadcast, Sport, Producer) and Titler Live 5
    supports: [schedule_action, schedule_input_action, custom_message, update_input_definition,
               save_input_settings, load_input_settings, get_title_xml, macro, select_title, set_title_input,
               remove_title_input, set_title_name, set_title_position, new_title, duplicate_title, load_title,
               save_title, delete_title, open_designer, close_designer, set_dynamic, assign_variable,
               attach_profile, rename_input, rebuild_cache, save_title_cache, get_cache_path, set_cache_path,
               set_max_cache_count, set_output_device, get_output_device, get_video_format, set_video_format,
               start_streaming, stop_streaming, get_stream_server, set_png_output_folder, load_project,
               save_project, close_project, check_project_edited, get_current_project, get_recent_projects,
               read_project, load_playlist, clear_playlist, save_playlist, read_playlist, get_all_video_inputs,
               get_video_input_info, get_opened_video_inputs, open_video_input, close_video_input,
               switch_video_input, get_all_audio_inputs, get_opened_audio_inputs, replay_is_trial,
               replay_enter_playback, replay_exit_playback, replay_get_settings, replay_set_settings,
               replay_set_speed, replay_get_speed, replay_enable, replay_get_inputs, replay_arm_inputs,
               replay_disarm_inputs, replay_get_play_info, replay_enable_scrubbing, replay_play_pause,
               replay_set_scrub_position, replay_set_in_point, replay_set_out_point, join_meeting,
               meeting_status, leave_meeting, get_time, get_stats, get_product_info, get_app_global_settings,
               get_profile_list, get_profile, read_title, read_all_titles, get_render_status, get_play_status,
               get_titles_play_status, get_inputs_play_status, is_title_connected, get_titles_connected,
               get_title_control_info, get_all_title_control_info, get_timeline_duration, get_subscriptions,
               list_commands, get_title_icon, get_monitor_frame]
    verification: none

commands:
  # ── Playback and data (scheduleAction) ──────────────────────────────────
  schedule_action:
    summary: >
      Run an action on a title with new variable values (scheduleAction):
      animate in or out, alert, cut in or out, render, update, still, hide or
      show, automatic or smart
    params:
      action: &action { type: enum, values: [animateIn, animateOut, alert, cutIn, cutOut, render, update, still,
                                              hide, show, automatic, smart],
                        required: true, label: Action,
                        description: "animateIn plays to the pause point, animateOut plays out, alert plays in, holds and out, cutIn and cutOut cut, render prepares, update animates new values, still sets them at once, hide and show toggle the named variables, automatic and smart choose for you." }
      title: { type: string, max_length: 256, required: true, label: Title,
               description: "Title (graphic layer) by its name in the project list or its id in braces." }
      variables: &variables { type: json, required: true, label: Variables,
                              description: "JSON object of variable names to values, {} for none." }
    send: '{"action":"{action}","input":"","title":{title:json},"variables":{variables}}'
    expect: &success { json_equals: { "$.result.success": true } }
    returns: ack
  schedule_input_action:
    summary: Run an action on every title connected to an input, with new variable values (scheduleAction)
    params:
      action: *action
      input: { type: string, max_length: 256, required: true, label: Input,
               description: "Full name of the input (data controller); empty for every title in the project." }
      variables: *variables
    send: '{"action":"{action}","input":{input:json},"title":"","variables":{variables}}'
    expect: *success
    returns: ack
  custom_message:
    summary: >
      Pass a message to the data controllers as a notification; it succeeds
      when the to field names a listening controller (customMessage)
    params:
      to: { type: string, max_length: 256, required: true, label: To,
            description: "Usually the name of the input (data controller) the message is for." }
      sender: { type: string, max_length: 256, default: "", label: Sender,
                description: "Sender name controllers can filter on; empty for the default sender." }
      data: { type: json, required: true, label: Data,
              description: "Any JSON value, passed to the controllers in the parameters' data field." }
    send: '{"command":"customMessage","parameters":{"to":{to:json},"sender":{sender:json},"data":{data}},"variables":{}}'
    expect: *success
    returns: ack
  update_input_definition:
    summary: Change an input's variable definitions (updateInputDefinition, {redefine, definition})
    params:
      input: { type: string, max_length: 256, required: true, label: Input,
               description: "Full name of the input (data controller) to redefine." }
      definition: { type: json, required: true, label: Definition,
                    description: "The definition object Captivate documents for updateInputDefinition, such as {\"method\": \"merge\", \"variables\": {...}}." }
    send: '{"redefine":{input:json},"definition":{definition}}'
    expect: &answered { json_path: "$.result" }
    returns: ack
  save_input_settings:
    summary: Save a controller's settings into the project (saveSettings, {input, settings})
    params:
      input: { type: string, max_length: 256, required: true, label: Input,
               description: "Full name of the input (data controller) whose settings are saved." }
      settings: { type: json, required: true, label: Settings,
                  description: "JSON object of settings to save." }
    send: '{"input":{input:json},"settings":{settings}}'
    expect: *answered
    returns: ack
  load_input_settings:
    summary: Read a controller's saved settings (loadSettings, {input, settings:"load"})
    params:
      input: { type: string, max_length: 256, required: true, label: Input,
               description: "Full name of the input (data controller) whose settings are read." }
    send: '{"input":{input:json},"settings":"load"}'
    expect: &result { json_path: "$.result" }
    returns: value
  get_title_xml:
    summary: Read a title's XML definition over HTTP (GET /api/title/<id> on port 9022)
    params:
      id: { type: string, max_length: 64, required: true, pattern: '^\{[0-9A-Fa-f-]+\}$', label: Title id,
            description: "Title id with its braces, {b960a28b-e583-4f3f-b54b-851ef481314d}." }
    send: { endpoint: http, method: GET, path: "/api/title/{id}" }
    expect: { status: 200 }
    returns: text

  # ── Commands (scheduleCommand) ──────────────────────────────────────────
  macro:
    summary: "High-level playback of titles: in, out, take, cut, update and more (macro)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
      event: { type: "enum", values: ["auto", "in", "out", "stop", "cut", "update", "still", "play", "setvars", "show", "hide", "take", "takein", "link", "unlink", "activate", "deactivate"], required: true, label: "Event", description: "Playback event: auto toggles, in and out animate, cut cuts, take and takein take, update and still update." }
    send: '{"command":"macro","parameters":{"title":{title:json},"event":"{event}"},"variables":{}}'
    expect: *success
    returns: ack
  select_title:
    summary: "Select a title, as a click on it in the interface does (selectTitle)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
    send: '{"command":"selectTitle","parameters":{"title":{title:json}},"variables":{}}'
    expect: *success
    returns: ack
  set_title_input:
    summary: "Connect an input to a title, replacing or joining its inputs (setTitleInput)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
      input: { type: "string", max_length: 256, required: true, label: "Input", description: "Full name of an input (data controller), as Captivate lists it." }
      merge: { type: "bool", default: false, label: "Merge", description: "true adds the input to the title's inputs; false replaces them." }
    send: '{"command":"setTitleInput","parameters":{"title":{title:json},"input":{input:json},"merge":"{merge:bool01}"},"variables":{}}'
    expect: *success
    returns: ack
  remove_title_input:
    summary: "Disconnect an input from a title (removeTitleInput)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
      input: { type: "string", max_length: 256, required: true, label: "Input", description: "Full name of an input (data controller), as Captivate lists it." }
    send: '{"command":"removeTitleInput","parameters":{"title":{title:json},"input":{input:json}},"variables":{}}'
    expect: *success
    returns: ack
  set_title_name:
    summary: "Rename a title (setTitleName)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
      name: { type: "string", max_length: 256, required: true, label: "New name", description: "New name of the title." }
    send: '{"command":"setTitleName","parameters":{"title":{title:json},"newName":{name:json}},"variables":{}}'
    expect: *success
    returns: ack
  set_title_position:
    summary: "Move a title in the list (setTitlePosition)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
      position: { type: "int", min: 0, required: true, label: "Position", description: "Place in the layer list." }
    send: '{"command":"setTitlePosition","parameters":{"title":{title:json},"position":{position}},"variables":{}}'
    expect: *success
    returns: ack
  new_title:
    summary: "Create a new title on a channel (newTitle)"
    params:
      name: { type: "string", max_length: 256, required: true, label: "Name", description: "Name of the new title." }
      position: { type: "int", min: 0, required: true, label: "Position", description: "Place in the layer list." }
      channel: { type: "int", min: 0, max: 63, required: true, label: "Channel", description: "Channel tab, numbered from 0 left to right (the tab labelled Channel 1 is 0)." }
    send: '{"command":"newTitle","parameters":{"newName":{name:json},"newPosition":{position},"channel":{channel}},"variables":{}}'
    expect: *success
    returns: ack
  duplicate_title:
    summary: "Copy a title under a new name (duplicateTitle)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
      name: { type: "string", max_length: 256, required: true, label: "Name", description: "Name of the copy." }
      position: { type: "int", min: 0, required: true, label: "Position", description: "Place of the copy in the layer list." }
      channel: { type: "int", min: 0, max: 63, required: true, label: "Channel", description: "Channel tab, numbered from 0 left to right (the tab labelled Channel 1 is 0)." }
    send: '{"command":"duplicateTitle","parameters":{"title":{title:json},"newName":{name:json},"newPosition":{position},"channel":{channel}},"variables":{}}'
    expect: *success
    returns: ack
  load_title:
    summary: "Load a title from an .nbtitle file onto a channel (loadTitle)"
    params:
      file: { type: "string", max_length: 1024, required: true, label: "File", description: "Full path of the .nbtitle file on the Captivate computer." }
      name: { type: "string", max_length: 256, required: true, label: "Name", description: "Name to give the title." }
      position: { type: "int", min: 0, required: true, label: "Position", description: "Place in the layer list." }
      channel: { type: "int", min: 0, max: 63, required: true, label: "Channel", description: "Channel tab, numbered from 0 left to right (the tab labelled Channel 1 is 0)." }
    send: '{"command":"loadTitle","parameters":{"file":{file:json},"newName":{name:json},"newPosition":{position},"channel":{channel}},"variables":{}}'
    expect: *success
    returns: ack
  save_title:
    summary: "Save a title to an .nbtitle file (saveTitle)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
      file: { type: "string", max_length: 1024, required: true, label: "File", description: "Full path of the .nbtitle file to write." }
    send: '{"command":"saveTitle","parameters":{"title":{title:json},"file":{file:json}},"variables":{}}'
    expect: *success
    returns: ack
  delete_title:
    summary: "Delete a title from the project (deleteTitle)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
    send: '{"command":"deleteTitle","parameters":{"title":{title:json}},"variables":{}}'
    expect: *success
    returns: ack
  open_designer:
    summary: "Open the title designer on a title (openDesigner)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
    send: '{"command":"openDesigner","parameters":{"title":{title:json}},"variables":{}}'
    expect: *success
    returns: ack
  close_designer:
    summary: "Close the title designer (closeDesigner)"
    send: '{"command":"closeDesigner","parameters":{},"variables":{}}'
    expect: *success
    returns: ack
  set_dynamic:
    summary: "Make a title variable dynamic (changeable) or static (setDynamic)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
      variable: { type: "string", max_length: 256, required: true, label: "Variable", description: "Name of the title variable." }
      dynamic: { type: "bool", required: true, label: "Dynamic", description: "true lets the variable change; false holds it." }
    send: '{"command":"setDynamic","parameters":{"title":{title:json},"variable":{variable:json},"dynamic":{dynamic:bool01}},"variables":{}}'
    expect: *success
    returns: ack
  assign_variable:
    summary: "Connect an input variable to a title variable (assignVariable)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
      input: { type: "string", max_length: 256, required: true, label: "Input", description: "Full name of an input (data controller), as Captivate lists it." }
      input_variable: { type: "string", max_length: 256, required: true, label: "Input variable", description: "Name of the input's variable." }
      title_variable: { type: "string", max_length: 256, required: true, label: "Title variable", description: "Name of the title's variable." }
    send: '{"command":"assignVariable","parameters":{"title":{title:json},"input":{input:json},"inputVar":{input_variable:json},"titleVar":{title_variable:json}},"variables":{}}'
    expect: *success
    returns: ack
  attach_profile:
    summary: "Connect an input profile (data controller) to a title (attachProfile)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
      profile: { type: "string", max_length: 256, required: true, label: "Profile", description: "Name of the profile (data controller)." }
      merge: { type: "bool", default: false, label: "Merge", description: "true adds the profile to the title's inputs; false replaces them." }
    send: '{"command":"attachProfile","parameters":{"title":{title:json},"profile":{profile:json},"merge":"{merge:bool01}"},"variables":{}}'
    expect: *success
    returns: ack
  rename_input:
    summary: "Rename an input (data controller) (changeInputName)"
    params:
      input: { type: "string", max_length: 256, required: true, label: "Input", description: "Full name of an input (data controller), as Captivate lists it." }
      name: { type: "string", max_length: 256, required: true, label: "New name", description: "New name of the input." }
    send: '{"command":"changeInputName","parameters":{"input":{input:json},"newName":{name:json}},"variables":{}}'
    expect: *success
    returns: ack
  rebuild_cache:
    summary: "Rebuild a title's cache completely (rebuildCache)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
    send: '{"command":"rebuildCache","parameters":{"title":{title:json}},"variables":{}}'
    expect: *success
    returns: ack
  save_title_cache:
    summary: "Save a title's cache now (saveTitleCache)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
    send: '{"command":"saveTitleCache","parameters":{"title":{title:json}},"variables":{}}'
    expect: *success
    returns: ack
  get_cache_path:
    summary: "Read where a title's cache is kept (getCachePath)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
    send: '{"command":"getCachePath","parameters":{"title":{title:json}},"variables":{}}'
    expect: *result
    returns: value
  set_cache_path:
    summary: "Set where a title's cache is built (setCachePath)"
    params:
      title: { type: "string", max_length: 256, required: true, label: "Title", description: "Title (graphic layer) by its name in the project list or its id in braces, {218f46f9-...}." }
      file: { type: "string", max_length: 1024, required: true, label: "Path", description: "Path for the title's cache on the Captivate computer." }
    send: '{"command":"setCachePath","parameters":{"title":{title:json},"file":{file:json}},"variables":{}}'
    expect: *success
    returns: ack
  set_max_cache_count:
    summary: "Set how many variable variations are kept in memory and saved (setMaxCacheCount)"
    params:
      cache: { type: "int", min: 0, required: true, label: "In memory", description: "Variations kept in memory." }
      save: { type: "int", min: 0, required: true, label: "Saved", description: "Variations saved to file." }
    send: '{"command":"setMaxCacheCount","parameters":{"maxCacheCount":{cache},"maxSaveCount":{save}},"variables":{}}'
    expect: *success
    returns: ack
  set_output_device:
    summary: "Choose the output device for channels, such as NDI (setOutputDevice)"
    params:
      device: { type: "string", max_length: 256, required: true, label: "Device", description: "Output device name, such as NDI." }
      channels: { type: "string", max_length: 256, pattern: "^[0-9]+(,[0-9]+)*$", required: true, label: "Channels", description: "Comma-separated channel indexes from 0 to connect to the device; only some products allow a device per channel." }
    send: '{"command":"setOutputDevice","parameters":{"device":{device:json},"channels":{channels:json}},"variables":{}}'
    expect: *success
    returns: ack
  get_output_device:
    summary: "Read the output device (getOutputDevice)"
    send: '{"command":"getOutputDevice","parameters":{},"variables":{}}'
    expect: *result
    returns: value
  get_video_format:
    summary: "Read the project's video format (getVideoFormat)"
    send: '{"command":"getVideoFormat","parameters":{},"variables":{}}'
    expect: *result
    returns: value
  set_video_format:
    summary: "Set the project's video format (setVideoFormat)"
    params:
      width: { type: "int", min: 16, max: 7680, required: true, label: "Width", description: "Frame width in pixels." }
      height: { type: "int", min: 16, max: 4320, required: true, label: "Height", description: "Frame height in pixels." }
      frame_rate: { type: "float", min: 1, max: 120, required: true, label: "Frame rate", description: "Frames per second, such as 29.97." }
    send: '{"command":"setVideoFormat","parameters":{"width":{width},"height":{height},"frameRate":{frame_rate:.3f}},"variables":{}}'
    expect: *success
    returns: ack
  start_streaming:
    summary: "Start an RTMP stream (startStreaming)"
    params:
      service: { type: "string", max_length: 128, required: true, label: "Service", description: "Service name, such as Facebook." }
      url: { type: "string", max_length: 1024, required: true, label: "Server URL", description: "RTMP or RTMPS server URL." }
      key: { type: "string", max_length: 1024, required: true, secret: true, label: "Stream key", description: "Stream key for the server." }
    send: '{"command":"startStreaming","parameters":{"choice":{service:json},"serverUrl":{url:json},"streamKey":{key:json}},"variables":{}}'
    expect: *success
    returns: ack
  stop_streaming:
    summary: "Stop the RTMP stream (stopStreaming)"
    send: '{"command":"stopStreaming","parameters":{},"variables":{}}'
