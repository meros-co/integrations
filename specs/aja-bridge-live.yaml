quirks:
  - models: [all]
    severity: critical
    text: >
      factory_reset and reinstall cannot be undone: a factory reset restores
      factory settings and a reinstallation keeps only the licenses, and both
      reboot the unit on success. Each call is synchronous and answers with
      the outcome. reboot, shutdown and restart_service stop every pipeline;
      after shutdown the unit must be powered on locally.

  - models: [all]
    severity: critical
    text: >
      replace_pipelines removes every pipeline and creates only those given;
      modify_pipeline replaces a pipeline's whole configuration, so a change
      to one field means sending the whole Pipeline object (list_pipelines or
      get_pipeline gives it). Only the input video and audio filters apply
      without restarting a running pipeline; other changes restart it.
      delete_pipeline removes the pipeline and its UUID.

  - models: [all]
    severity: warning
    text: >
      start_pipeline and stop_pipeline are refused with 503 ("try again
      later") when the pipeline is already in that state or still starting or
      stopping; read runtime.<id>.operation_state first. Pipeline state is
      polled: the list every 10 seconds, each listed pipeline's runtime state
      right after it; a start, stop, change or removal reads both back at
      once. The runtime state of a pipeline removed by another client stays
      until the core reopens the device, since only this client's removals
      are seen.

  - models: [all]
    severity: info
    text: >
      AJA's v1.16 API document addresses the unit as https://<unit>/api with
      HTTP Basic credentials (admin and the unit's password), and the manual's
      curl examples run on the unit itself at http://localhost:8080/api
      without credentials; this spec uses https on 443 by default (the
      certificate is not checked) and http on 8080 when the scheme setting
      says so. The full and current API documentation is served by the unit
      (Dashboard, API button); the public PDF is for v1.16 and the manual's
      example body ("source", "complianceWith": "TR_01", "framerate") does
      not match the v1.16 Pipeline schema, which this spec follows.

  - models: [all]
    severity: info
    text: >
      Pipelines are configured with the API document's JSON objects
      (Pipeline, Input Stream, Output Stream and their parts): their fields,
      ranges and allowed values are those of the document, and the unit
      validates them, answering {status: 400, error} for a missing or wrong
      field. Uploaded logos travel inside the Pipeline object as base64 PNG.
      list_ndi_sources searches in the background: the first call for a group
      may return none, later calls the full list.

  - models: [all]
    severity: info
    text: >
      SNMP (manual chapter 7: SNMPv2c, community public, CPU, GPU, stream,
      dropped frame and status OIDs under enterprise 50087, enabled by
      editing an .ini file) and the unit's on-box documentation are outside
      this spec.
