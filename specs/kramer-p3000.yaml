      get_ports_list, get_signals_list, route_signal, get_signal_route, mute_signal, get_signal_mute,
      set_signal_audio_level, get_signal_audio_level, set_port_label, get_port_label, set_dsp_aec,
      get_dsp_aec, set_dsp_compressor, get_dsp_compressor, set_dsp_delay, get_dsp_delay, set_dsp_expander,
      get_dsp_expander, set_dsp_high_pass, get_dsp_high_pass, set_dsp_limiter, get_dsp_limiter, set_dsp_post,
      get_dsp_post, set_dsp_eq, get_dsp_eq, set_dsp_invert, get_dsp_invert, set_signal_generator,
      get_signal_generator, get_dsp_meter, set_mix_level, get_mix_level, set_mix_mute, get_mix_mute,
      set_audio_input_mode, get_audio_input_mode, set_mic_type, get_mic_type, set_link_group, get_link_group,
      set_signal_pattern, get_signal_pattern, recall_config_preset, store_config_preset,
      set_auto_switch_mode, get_auto_switch_mode]
    verification: none
    notes: >
      As the DSP-62-AEC, plus input switching (AV-SW-MODE); from the same manual.
  - id: mv-4x
