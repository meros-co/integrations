      From the MV-4X user manual (P/N 2900-301566 Rev 5), Protocol 3000 p.60-70. Windows 1-4, inputs 1-4
      (HDMI), outputs 1 HDMI and 2 HDBaseT; AUD-LVL is its analog output, 0-100. No login.

commands:
  # ── System (mandatory on every device, p.9-13) ──────────────────────────
  handshake:
    summary: Protocol handshake; validates the connection (answered "~nn@ OK")
    send: "#"
    expect: { matches: '^~\d+@\s*OK', not_contains: "ERR" }
    returns: ack

  get_model:
    summary: Get the device model name (up to 19 printable characters)
    send: "#MODEL?"
    expect: { matches: '^~\d+@MODEL\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  get_version:
    summary: Get the firmware version (major.minor.build, XX.XX.XXXX)
    send: "#VERSION?"
    expect: { matches: '^~\d+@VERSION\s+(\S+)', not_contains: "ERR" }
    returns: value

  get_serial:
    summary: Get the factory serial number (14 decimal digits)
    send: "#SN?"
    expect: { matches: '^~\d+@SN\s+(\S+)', not_contains: "ERR" }
    returns: value

  get_protocol_version:
    summary: Get the Protocol 3000 version the device implements (XX.XX)
    send: "#PROT-VER?"
    expect: { matches: '^~\d+@PROT-VER\s+3000:(\S+)', not_contains: "ERR" }
    returns: value

  get_build_date:
    summary: Get the firmware build date and time (YYYY/MM/DD hh:mm:ss)
    send: "#BUILD-DATE?"
    expect: { matches: '^~\d+@BUILD-DATE\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  get_io_count:
    summary: Get the number of inputs and outputs, as "IN n,OUT m"
    send: "#INFO-IO?"
    expect: { matches: '^~\d+@INFO-IO\??\s+(IN\s+\d+,\s*OUT\s+\d+)', not_contains: "ERR" }
    returns: value

  get_preset_count:
    summary: Get the maximum number of video and audio presets, as "VID n,AUD m"
    send: "#INFO-PRST?"
    expect: { matches: '^~\d+@INFO-PRST\??\s+(VID\s+\d+,\s*AUD\s+\d+)', not_contains: "ERR" }
    returns: value

  get_name:
    summary: Get the machine (DNS) name
    send: "#NAME?"
    expect: { matches: '^~\d+@NAME\??\s+(\S+)', not_contains: "ERR" }
    returns: value

  set_name:
    summary: Set the machine (DNS) name; Administrator permission when security is on
    params:
      name: { type: string, max_length: 15, pattern: '^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$', required: true,
              label: Machine name,
              description: "Machine (DNS) name: letters, digits and hyphens, not starting or ending with a hyphen, up to 15 characters." }
    send: "#NAME {name}"
    expect: { matches: '^~\d+@NAME\s', not_contains: "ERR" }
    returns: ack

  reset_name:
    summary: Reset the machine (DNS) name to the factory default, KRAMER_ plus the last 4 serial digits
    send: "#NAME-RST"
    expect: { matches: '^~\d+@NAME-RST\s', not_contains: "ERR" }
    returns: ack

  identify:
    summary: Light the device's buttons or LEDs to identify it among similar devices
    send: "#IDV"
    expect: { matches: '^~\d+@IDV\s', not_contains: "ERR" }
    returns: ack

  reset:
    summary: Restart the device; Administrator permission when security is on
    send: "#RESET"
    expect: { matches: '^~\d+@RESET\s', not_contains: "ERR" }
    returns: ack

  factory_reset:
    summary: Reset to the factory default configuration, deleting all user data
    send: "#FACTORY"
    expect: { matches: '^~\d+@FACTORY\s', not_contains: "ERR" }
    returns: ack

  # ── Routing (ROUTE, p.54; layers p.140) ─────────────────────────────────
  route_video:
    summary: Route an input to an output on the video layer (layer 1)
    params:
      input:  { type: int, min: 0, required: true,
                label: Input,
                description: "Input number, from 1; 0 disconnects the output (taken from the legacy commands, not confirmed for ROUTE)." }
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#ROUTE 1,{output},{input}"
    expect: { matches: '^~\d+@ROUTE\s', not_contains: "ERR" }
    returns: ack

  route_audio:
    summary: Route an input to an output on the audio layer (layer 2)
    params:
      input:  { type: int, min: 0, required: true,
                label: Input,
                description: "Input number, from 1; 0 disconnects the output (taken from the legacy commands, not confirmed for ROUTE)." }
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#ROUTE 2,{output},{input}"
    expect: { matches: '^~\d+@ROUTE\s', not_contains: "ERR" }
    returns: ack

  route_data:
    summary: Route an input to an output on the data layer (layer 3)
    params:
      input:  { type: int, min: 0, required: true,
                label: Input,
                description: "Input number, from 1; 0 disconnects the output (taken from the legacy commands, not confirmed for ROUTE)." }
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#ROUTE 3,{output},{input}"
    expect: { matches: '^~\d+@ROUTE\s', not_contains: "ERR" }
    returns: ack

  route_ir:
    summary: Route an input to an output on the IR layer (layer 4)
    params:
      input:  { type: int, min: 0, required: true,
                label: Input,
                description: "Input number, from 1; 0 disconnects the output (taken from the legacy commands, not confirmed for ROUTE)." }
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#ROUTE 4,{output},{input}"
    expect: { matches: '^~\d+@ROUTE\s', not_contains: "ERR" }
    returns: ack

  route_usb:
    summary: Route an input to an output on the USB layer (layer 5)
    params:
      input:  { type: int, min: 0, required: true,
                label: Input,
                description: "Input number, from 1; 0 disconnects the output (taken from the legacy commands, not confirmed for ROUTE)." }
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#ROUTE 5,{output},{input}"
    expect: { matches: '^~\d+@ROUTE\s', not_contains: "ERR" }
    returns: ack

  route_video_all:
    summary: Route an input to every output on the video layer (destination "*")
    params:
      input: { type: int, min: 0, required: true,
               label: Input,
               description: "Input number, from 1; 0 disconnects the output (taken from the legacy commands, not confirmed for ROUTE)." }
    send: "#ROUTE 1,*,{input}"
    expect: { matches: '^~\d+@ROUTE\s', not_contains: "ERR" }
    returns: ack

  route_audio_all:
    summary: Route an input to every output on the audio layer (destination "*")
    params:
      input: { type: int, min: 0, required: true,
               label: Input,
               description: "Input number, from 1; 0 disconnects the output (taken from the legacy commands, not confirmed for ROUTE)." }
    send: "#ROUTE 2,*,{input}"
    expect: { matches: '^~\d+@ROUTE\s', not_contains: "ERR" }
    returns: ack

  get_route_video:
    summary: Get the input routed to an output on the video layer
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#ROUTE? 1,{output}"
    expect: { matches: '^~\d+@ROUTE\s+1,\d+,(\d+)', not_contains: "ERR" }
    returns: value

  get_route_audio:
    summary: Get the input routed to an output on the audio layer
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#ROUTE? 2,{output}"
    expect: { matches: '^~\d+@ROUTE\s+2,\d+,(\d+)', not_contains: "ERR" }
    returns: value

  get_route_data:
    summary: Get the input routed to an output on the data layer
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#ROUTE? 3,{output}"
    expect: { matches: '^~\d+@ROUTE\s+3,\d+,(\d+)', not_contains: "ERR" }
    returns: value

  get_route_ir:
    summary: Get the input routed to an output on the IR layer
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#ROUTE? 4,{output}"
    expect: { matches: '^~\d+@ROUTE\s+4,\d+,(\d+)', not_contains: "ERR" }
    returns: value

  get_route_usb:
    summary: Get the input routed to an output on the USB layer
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#ROUTE? 5,{output}"
    expect: { matches: '^~\d+@ROUTE\s+5,\d+,(\d+)', not_contains: "ERR" }
    returns: value

  # ── Legacy switching (VID/AUD/AV, p.52-55) ──────────────────────────────
  legacy_route_video:
    summary: Switch video with the legacy VID command (input 0 disconnects); prefer route_video
    params:
      input:  { type: int, min: 0, required: true,
                label: Input,
                description: "Input number, from 1; 0 disconnects the output." }
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#VID {input}>{output}"
    expect: { matches: '^~\d+@VID\s', not_contains: "ERR" }
    returns: ack

  legacy_route_audio:
    summary: Switch audio with the legacy AUD command (input 0 disconnects); in AFV mode video switches too
    params:
      input:  { type: int, min: 0, required: true,
                label: Input,
                description: "Input number, from 1; 0 disconnects the output." }
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#AUD {input}>{output}"
    expect: { matches: '^~\d+@(AUD|AV)\s', not_contains: "ERR" }
    returns: ack

  legacy_route_av:
    summary: Switch audio and video together with the legacy AV command (input 0 disconnects)
    params:
      input:  { type: int, min: 0, required: true,
                label: Input,
                description: "Input number, from 1; 0 disconnects the output." }
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#AV {input}>{output}"
    expect: { matches: '^~\d+@AV\s', not_contains: "ERR" }
    returns: ack

  legacy_get_route_video:
    summary: Get the video input on an output with the legacy VID? query (0 is disconnected)
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#VID? {output}"
    expect: { matches: '^~\d+@VID\s+(\d+)>', not_contains: "ERR" }
    returns: value

  legacy_get_route_audio:
    summary: Get the audio input on an output with the legacy AUD? query (0 is disconnected)
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#AUD? {output}"
    expect: { matches: '^~\d+@AUD\s+(\d+)>', not_contains: "ERR" }
    returns: value

  set_audio_follow_video:
    summary: Set audio-follow-video (true) or audio breakaway (false); entering AFV resets audio routes to the video routes
    params:
      follow: { type: bool, required: true,
                label: Audio follows video,
                description: "True sets audio-follow-video, which resets audio routes to the video routes; false sets audio breakaway." }
    send: "#AFV {follow:bool10}"
    expect: { matches: '^~\d+@AFV\s', not_contains: "ERR" }
    returns: ack

  get_audio_follow_video:
    summary: Get the AFV mode ("0"/"afv" audio follows video, "1"/"brk" breakaway)
    send: "#AFV?"
    expect: { matches: '^~\d+@AFV\s+(\S+)', not_contains: "ERR" }
    returns: value

  set_auto_switch_mode:
    summary: Set an output's input auto-switch mode on a layer (0 manual, 1 priority, 2 last connected)
    params:
      layer:  { type: int, min: 1, max: 5, required: true,
                label: Layer,
                description: "Signal layer: 1 video, 2 audio, 3 data, 4 IR, 5 USB." }
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
      mode:   { type: int, min: 0, max: 2, required: true,
                label: Auto-switch mode,
                description: "0 manual, 1 priority, 2 last connected." }
    send: "#AV-SW-MODE {layer},{output},{mode}"
    expect: { matches: '^~\d+@AV-SW-MODE\s', not_contains: "ERR" }
    returns: ack

  get_auto_switch_mode:
    summary: Get an output's auto-switch mode on a layer (0 manual, 1 priority, 2 last connected)
    params:
      layer:  { type: int, min: 1, max: 5, required: true,
                label: Layer,
                description: "Signal layer: 1 video, 2 audio, 3 data, 4 IR, 5 USB." }
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#AV-SW-MODE? {layer},{output}"
    expect: { matches: '^~\d+@AV-SW-MODE\s+\d+,\d+,(\d+)', not_contains: "ERR" }
    returns: value

  # ── Presets (p.32-34) ───────────────────────────────────────────────────
  store_preset:
    summary: Store the current connections, volumes and modes in a preset
    params:
      preset: { type: int, min: 1, required: true,
                label: Preset,
                description: "Preset number, from 1; the device's count is reported by INFO-PRST." }
    send: "#PRST-STO {preset}"
    expect: { matches: '^~\d*@?PRST-STO\s', not_contains: "ERR" }
    returns: ack

  recall_preset:
    summary: Recall a stored preset
    params:
      preset: { type: int, min: 1, required: true,
                label: Preset,
                description: "Preset number, from 1; the device's count is reported by INFO-PRST." }
    send: "#PRST-RCL {preset}"
    expect: { matches: '^~\d*@?PRST-RCL\s', not_contains: "ERR" }
    returns: ack

  get_preset_list:
    summary: Get the stored presets, as a comma-separated list of preset numbers
    send: "#PRST-LST?"
    expect: { matches: '^~\d+@PRST-LST\s*(.*?)\s*$', not_contains: "ERR" }
    returns: value

  get_preset_video:
    summary: Get the video input a stored preset routes to an output (0 is disconnected)
    params:
      preset: { type: int, min: 1, required: true,
                label: Preset,
                description: "Preset number, from 1; the device's count is reported by INFO-PRST." }
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#PRST-VID? {preset},{output}"
    expect: { matches: '^~\d*@?PRST-VID\s+\d+,\s*(\d+)>', not_contains: "ERR" }
    returns: value

  get_preset_audio:
    summary: Get the audio input a stored preset routes to an output (0 is disconnected)
    params:
      preset: { type: int, min: 1, required: true,
                label: Preset,
                description: "Preset number, from 1; the device's count is reported by INFO-PRST." }
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#PRST-AUD? {preset},{output}"
    expect: { matches: '^~\d*@?PRST-AUD\s+\d+,\s*(\d+)>', not_contains: "ERR" }
    returns: value

  set_preset_lock:
    summary: Make a preset read-only (true) or writable (false)
    params:
      preset: { type: int, min: 1, required: true,
                label: Preset,
                description: "Preset number, from 1; the device's count is reported by INFO-PRST." }
      locked: { type: bool, required: true,
                label: Locked,
                description: "True makes the preset read-only, false writable." }
    send: "#PRST-LOCK {preset},{locked:on_off}"
    expect: { matches: '^~\d+@PRST-LOCK\s', not_contains: "ERR" }
    returns: ack

  get_preset_lock:
    summary: Get whether a preset is read-only ("ON" or "OFF")
    params:
      preset: { type: int, min: 1, required: true,
                label: Preset,
                description: "Preset number, from 1; the device's count is reported by INFO-PRST." }
    send: "#PRST-LOCK? {preset}"
    expect: { matches: '^~\d+@PRST-LOCK\s+\d+,\s*(\S+)', not_contains: "ERR" }
    returns: value

  # ── Labels (LABEL, p.23) ────────────────────────────────────────────────
  set_input_label:
    summary: Set and enable an input's custom label
    params:
      input: { type: int, min: 1, required: true,
               label: Input,
               description: "Input number, from 1 as on the device." }
      label: { type: string, max_length: 32, pattern: '^[!-~]+$', required: true,
               label: Label,
               description: "Label text with no spaces, commas or |, up to 32 characters." }
    send: "#LABEL 0,{input},1,{label}"
    expect: { matches: '^~\d+@LABEL\s', not_contains: "ERR" }
    returns: ack

  set_output_label:
    summary: Set and enable an output's custom label
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
      label:  { type: string, max_length: 32, pattern: '^[!-~]+$', required: true,
                label: Label,
                description: "Label text with no spaces, commas or |, up to 32 characters." }
    send: "#LABEL 1,{output},1,{label}"
    expect: { matches: '^~\d+@LABEL\s', not_contains: "ERR" }
    returns: ack

  get_label:
    summary: Get a label by port number, as documented (the query carries no input/output stage); returns the label
    params:
      port: { type: int, min: 1, required: true,
              label: Port,
              description: "Port number whose label to read, from 1; the query does not say input or output." }
    send: "#LABEL? {port}"
    expect: { matches: '^~\d+@LABEL\s+\d+,\d+,[^,]*,(.*?)\s*$', not_contains: "ERR" }
    returns: value

  # ── Mutes (VMUTE p.64, MUTE p.83) ───────────────────────────────────────
  set_video_mute:
    summary: Disable (mute) or enable video on an output
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
      muted:  { type: bool, default: true,
                label: Video mute,
                description: "True disables the output's video, false enables it." }
    send: "#VMUTE {output},{muted:bool01}"
    expect: { matches: '^~\d+@VMUTE\s', not_contains: "ERR" }
    returns: ack

  get_video_mute:
    summary: Get an output's video mute flag (0 video enabled, 1 video disabled, 2 blank picture)
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#VMUTE? {output}"
    expect: { matches: '^~\d+@VMUTE\s+\d+,\s*(\d+)', not_contains: "ERR" }
    returns: value

  set_audio_mute:
    summary: Mute or unmute audio on an output
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
      muted:  { type: bool, default: true,
                label: Audio mute,
                description: "True mutes the output's audio, false unmutes it." }
    send: "#MUTE {output},{muted:bool01}"
    expect: { matches: '^~\d+@MUTE\s', not_contains: "ERR" }
    returns: ack

  get_audio_mute:
    summary: Get an output's audio mute ("0"/"OFF" unmuted, "1"/"ON" muted)
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#MUTE? {output}"
    expect: { matches: '^~\d+@MUTE\s+\d+,\s*(\S+)', not_contains: "ERR" }
    returns: value

  # ── Audio levels (AUD-LVL p.73, AUD-SIGNAL? p.76) ───────────────────────
  set_input_audio_level:
    summary: Set an input's audio level in dB (input processing stage)
    params:
      channel: { type: int, min: 1, required: true,
                 label: Input,
                 description: "Input whose audio level is set, from 1." }
      level:   { type: int, min: -80, max: 10, required: true,
                 label: Level,
                 description: "Audio level in dB, -80 to +10; the product's own range may be narrower." }
    send: "#AUD-LVL 0,{channel},{level}"
    expect: { matches: '^~\d+@AUD-LVL\s', not_contains: "ERR" }
    returns: ack

  set_output_audio_level:
    summary: Set an output's audio level in dB (output processing stage)
    params:
      channel: { type: int, min: 1, required: true,
                 label: Output,
                 description: "Output whose audio level is set, from 1." }
      level:   { type: int, min: -80, max: 10, required: true,
                 label: Level,
                 description: "Audio level in dB, -80 to +10; the product's own range may be narrower." }
    send: "#AUD-LVL 1,{channel},{level}"
    expect: { matches: '^~\d+@AUD-LVL\s', not_contains: "ERR" }
    returns: ack

  set_input_audio_level_keep_mute:
    summary: Set an input's audio level in dB without changing its mute state (mutebehavior 1)
    params:
      channel: { type: int, min: 1, required: true,
                 label: Input,
                 description: "Input whose audio level is set, from 1." }
      level:   { type: int, min: -80, max: 10, required: true,
                 label: Level,
                 description: "Audio level in dB, -80 to +10; the product's own range may be narrower." }
    send: "#AUD-LVL 0,{channel},{level},1"
    expect: { matches: '^~\d+@AUD-LVL\s', not_contains: "ERR" }
    returns: ack

  set_output_audio_level_keep_mute:
    summary: Set an output's audio level in dB without changing its mute state (mutebehavior 1)
    params:
      channel: { type: int, min: 1, required: true,
                 label: Output,
                 description: "Output whose audio level is set, from 1." }
      level:   { type: int, min: -80, max: 10, required: true,
                 label: Level,
                 description: "Audio level in dB, -80 to +10; the product's own range may be narrower." }
    send: "#AUD-LVL 1,{channel},{level},1"
    expect: { matches: '^~\d+@AUD-LVL\s', not_contains: "ERR" }
    returns: ack

  get_input_audio_level:
    summary: Get an input's audio level in dB
    params:
      channel: { type: int, min: 1, required: true,
                 label: Input,
                 description: "Input whose audio level is set, from 1." }
    send: "#AUD-LVL? 0,{channel}"
    expect: { matches: '^~\d+@AUD-LVL\s+0,\d+,\s*(-?\d+(?:\.\d+)?)', not_contains: "ERR" }
    returns: value

  get_output_audio_level:
    summary: Get an output's audio level in dB
    params:
      channel: { type: int, min: 1, required: true,
                 label: Output,
                 description: "Output whose audio level is set, from 1." }
    send: "#AUD-LVL? 1,{channel}"
    expect: { matches: '^~\d+@AUD-LVL\s+1,\d+,\s*(-?\d+(?:\.\d+)?)', not_contains: "ERR" }
    returns: value

  # ── Video output controls (VFRZ p.62, VID-PATTERN p.63) ─────────────────
  set_freeze:
    summary: Freeze or unfreeze an output's picture
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
      frozen: { type: bool, default: true,
                label: Freeze,
                description: "True freezes the output's picture, false releases it." }
    send: "#VFRZ {output},{frozen:bool01}"
    expect: { matches: '^~\d+@VFRZ\s', not_contains: "ERR" }
    returns: ack

  get_freeze:
    summary: Get an output's freeze state ("0"/"OFF" or "1"/"ON")
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#VFRZ? {output}"
    expect: { matches: '^~\d+@VFRZ\s+\d+,\s*(\S+)', not_contains: "ERR" }
    returns: value

  set_test_pattern:
    summary: Show a test pattern on an output (pattern numbers are product-specific)
    params:
      output:  { type: int, min: 1, required: true,
                 label: Output,
                 description: "Output number, from 1 as on the device." }
      pattern: { type: int, min: 1, required: true,
                 label: Test pattern,
                 description: "Test pattern number; the numbers are product-specific, see the product's manual." }
    send: "#VID-PATTERN {output},{pattern}"
    expect: { matches: '^~\d+@VID-PATTERN\s', not_contains: "ERR" }
    returns: ack

  get_test_pattern:
    summary: Get the test pattern number on an output
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#VID-PATTERN? {output}"
    expect: { matches: '^~\d+@VID-PATTERN\s+\d+,\s*(\d+)', not_contains: "ERR" }
    returns: value

  # ── Signal, HDCP and sink status (p.17-20, p.35, p.76) ──────────────────
  get_signal:
    summary: Get whether an input has a signal (0 no signal, 1 signal)
    params:
      input: { type: int, min: 1, required: true,
               label: Input,
               description: "Input number, from 1 as on the device." }
    send: "#SIGNAL? {input}"
    expect: { matches: '^~\d+@SIGNAL\s+\d+,\s*(\d+)', not_contains: "ERR" }
    returns: value

  get_audio_signal:
    summary: Get whether an input has an audio signal (0 no signal, 1 signal present)
    params:
      input: { type: int, min: 1, required: true,
               label: Input,
               description: "Input number, from 1 as on the device." }
    send: "#AUD-SIGNAL? {input}"
    expect: { matches: '^~\d+@AUD-SIGNAL\s+\d+,\s*(\d+)', not_contains: "ERR" }
    returns: value

  get_hdcp_status_input:
    summary: Get whether an input's signal is HDCP-encrypted ("ON"/"OFF")
    params:
      input: { type: int, min: 1, required: true,
               label: Input,
               description: "Input number, from 1 as on the device." }
    send: "#HDCP-STAT? 0,{input}"
    expect: { matches: '^~\d+@HDCP-STAT\s+0,\d+,\s*(\S+)', not_contains: "ERR" }
    returns: value

  get_hdcp_status_output:
    summary: Get an output's sink HDCP status ("ON"/"OFF")
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#HDCP-STAT? 1,{output}"
    expect: { matches: '^~\d+@HDCP-STAT\s+1,\d+,\s*(\S+)', not_contains: "ERR" }
    returns: value

  set_hdcp_mode:
    summary: Set an input's HDCP mode (0 off, 1 on, 2 follow input, 3 mirror output); Administrator permission when security is on
    params:
      input: { type: int, min: 1, required: true,
               label: Input,
               description: "Input number, from 1 as on the device." }
      mode:  { type: int, min: 0, max: 3, required: true,
               label: HDCP mode,
               description: "0 off, 1 on, 2 follow input, 3 mirror output." }
    send: "#HDCP-MOD {input},{mode}"
    expect: { matches: '^~\d+@HDCP-MOD\s', not_contains: "ERR" }
    returns: ack

  get_hdcp_mode:
    summary: Get an input's HDCP mode (0 off, 1 on, 2 follow input, 3 mirror output)
    params:
      input: { type: int, min: 1, required: true,
               label: Input,
               description: "Input number, from 1 as on the device." }
    send: "#HDCP-MOD? {input}"
    expect: { matches: '^~\d+@HDCP-MOD\s+\d+,\s*(\S+)', not_contains: "ERR" }
    returns: value

  get_display:
    summary: Get an output's hot-plug (sink) status (0 not valid, 1 sink valid, 2 sink and EDID valid)
    params:
      output: { type: int, min: 1, required: true,
                label: Output,
                description: "Output number, from 1 as on the device." }
    send: "#DISPLAY? {output}"
    expect: { matches: '^~\d+@DISPLAY\s+\d+,\s*(\d+)', not_contains: "ERR" }
    returns: value

  # ── Front panel lock, standby and power save (p.25, p.30, p.36) ─────────
  set_front_panel_lock:
    summary: Lock or unlock the front panel
    params:
      locked: { type: bool, default: true,
                label: Lock,
                description: "True locks the front panel, false unlocks it." }
    send: "#LOCK-FP {locked:bool01}"
    expect: { matches: '^~\d+@LOCK-FP\s', not_contains: "ERR" }
    returns: ack

  get_front_panel_lock:
    summary: Get the front panel lock (0 unlocked, 1 locked)
    send: "#LOCK-FP?"
    expect: { matches: '^~\d+@LOCK-FP\s+(\S+)', not_contains: "ERR" }
    returns: value

  set_standby:
    summary: Enter (true) or leave (false) standby
    params:
      standby: { type: bool, required: true,
                 label: Standby,
                 description: "True enters standby, false leaves it." }
    send: "#STANDBY {standby:bool01}"
    expect: { matches: '^~\d+@STANDBY\s', not_contains: "ERR" }
    returns: ack

  get_standby:
    summary: Get the standby state ("0"/"OFF" or "1"/"ON")
    send: "#STANDBY?"
    expect: { matches: '^~\d+@STANDBY\s+(\S+)', not_contains: "ERR" }
    returns: value

  set_power_save:
    summary: Activate or deactivate power-save mode; Administrator permission when security is on
    params:
      enabled: { type: bool, required: true,
                 label: Power save,
                 description: "True activates power-save mode, false deactivates it." }
    send: "#POWER-SAVE {enabled:bool01}"
    expect: { matches: '^~\d+@POWER-SAVE\s', not_contains: "ERR" }
    returns: ack

  get_power_save:
    summary: Get power-save mode ("ON" active, "OFF" inactive)
    send: "#POWER-SAVE?"
    expect: { matches: '^~\d+@POWER-SAVE\s+(\S+)', not_contains: "ERR" }
    returns: value

  # ── Extended Protocol 3000 (X- commands, p.4-7) ─────────────────────────
  route_signal:
    summary: Route an input signal to an output signal by signal ID, e.g. OUT.HDBT.4.VIDEO.1 from IN.HDMI.1.VIDEO.1
    params:
      output_signal: { type: string, max_length: 24, pattern: '^(OUT|out|BOTH|both)\.[A-Za-z0-9_]+\.[0-9]+(\.[A-Za-z0-9]+\.[0-9]+)?$', required: true,
                       label: Output signal,
                       description: "Destination signal ID, e.g. OUT.HDBT.4.VIDEO.1." }
      input_signal:  { type: string, max_length: 24, pattern: '^(IN|in|BOTH|both)\.[A-Za-z0-9_]+\.[0-9]+(\.[A-Za-z0-9]+\.[0-9]+)?$', required: true,
                       label: Input signal,
                       description: "Source signal ID, e.g. IN.HDMI.1.VIDEO.1." }
    send: "#X-ROUTE {output_signal},{input_signal}"
    expect: { matches: '^~\d+@X-ROUTE\s', not_contains: "ERR" }
    returns: ack

  get_signal_route:
    summary: Get the input signal ID routed to an output signal ID
    params:
      output_signal: { type: string, max_length: 24, pattern: '^(OUT|out|BOTH|both)\.[A-Za-z0-9_]+\.[0-9]+(\.[A-Za-z0-9]+\.[0-9]+)?$', required: true,
                       label: Output signal,
                       description: "Destination signal ID, e.g. OUT.HDBT.4.VIDEO.1." }
    send: "#X-ROUTE? {output_signal}"
    expect: { matches: '^~\d+@X-ROUTE\s+[^,]+,\s*(\S+)', not_contains: "ERR" }
    returns: value

  get_matrix_status:
    summary: Get the routing of every output as a bracketed list of [output signal ID, input signal ID] pairs
    send: "#MATRIX-STATUS?"
    expect: { matches: '^~\d+@MATRIX-STATUS\s*(.*?)\s*$', not_contains: "ERR" }
    returns: value

  get_signals_list:
    summary: Get every signal ID on the device, as a bracketed list
    send: "#SIGNALS-LIST?"
    expect: { matches: '^~\d+@SIGNALS-LIST\s*(.*?)\s*$', not_contains: "ERR" }
    returns: value

  get_ports_list:
    summary: Get every port ID on the device, as a bracketed list
    send: "#PORTS-LIST?"
    expect: { matches: '^~\d+@PORTS-LIST\s*(.*?)\s*$', not_contains: "ERR" }
    returns: value

  mute_signal:
    summary: Mute or unmute a signal by signal ID (video or audio, input or output), e.g. OUT.HDMI.1.AUDIO.1
    params:
      signal: { type: string, max_length: 32, pattern: '^(IN|in|OUT|out|BOTH|both)\.[A-Za-z0-9_]+\.[0-9]+\.[A-Za-z0-9]+\.[0-9]+$', required: true,
                label: Signal ID,
                description: "Signal ID as direction.port type.port.signal type.index, e.g. OUT.HDMI.1.AUDIO.1." }
      muted:  { type: bool, default: true,
                label: Mute,
                description: "True mutes the signal, false unmutes it." }
    send: "#X-MUTE {signal},{muted:on_off}"
    expect: { matches: '^~\d+@X-MUTE\s', not_contains: "ERR" }
    returns: ack

  get_signal_mute:
    summary: Get a signal's mute ("ON" or "OFF")
    params:
      signal: { type: string, max_length: 32, pattern: '^(IN|in|OUT|out|BOTH|both)\.[A-Za-z0-9_]+\.[0-9]+\.[A-Za-z0-9]+\.[0-9]+$', required: true,
                label: Signal ID,
                description: "Signal ID as direction.port type.port.signal type.index, e.g. OUT.HDMI.1.AUDIO.1." }
    send: "#X-MUTE? {signal}"
    expect: { matches: '^~\d+@X-MUTE\s+[^,]+,\s*(\S+)', not_contains: "ERR" }
    returns: value

  set_signal_audio_level:
    summary: Set an audio signal's level in dB by signal ID (the product's range lies within -60 to +30)
    params:
      signal: { type: string, max_length: 32, pattern: '^(IN|in|OUT|out|BOTH|both)\.[A-Za-z0-9_]+\.[0-9]+\.[A-Za-z0-9]+\.[0-9]+$', required: true,
                label: Signal ID,
                description: "Signal ID as direction.port type.port.signal type.index, e.g. OUT.HDMI.1.AUDIO.1." }
      level:  { type: int, min: -60, max: 30, required: true,
                label: Level,
                description: "Audio level in dB; the product's range lies within -60 to +30." }
    send: "#X-AUD-LVL {signal},{level}"
    expect: { matches: '^~\d+@X-AUD-LVL\s', not_contains: "ERR" }
    returns: ack

  get_signal_audio_level:
    summary: Get an audio signal's level in dB by signal ID
    params:
      signal: { type: string, max_length: 32, pattern: '^(IN|in|OUT|out|BOTH|both)\.[A-Za-z0-9_]+\.[0-9]+\.[A-Za-z0-9]+\.[0-9]+$', required: true,
                label: Signal ID,
                description: "Signal ID as direction.port type.port.signal type.index, e.g. OUT.HDMI.1.AUDIO.1." }
    send: "#X-AUD-LVL? {signal}"
    expect: { matches: '^~\d+@X-AUD-LVL\s+[^,]+,\s*(-?\d+(?:\.\d+)?)', not_contains: "ERR" }
    returns: value

  set_port_label:
    summary: Set a port's label by port ID, e.g. OUT.HDMI.5 (no spaces in the label)
    params:
      port:  { type: string, max_length: 24, pattern: '^(IN|in|OUT|out|BOTH|both)\.[A-Za-z0-9_]+\.[0-9]+$', required: true,
               label: Port ID,
               description: "Port ID as direction.port type.index, e.g. OUT.HDMI.5." }
      label: { type: string, max_length: 32, pattern: '^[!-~]+$', required: true,
               label: Label,
               description: "Label text with no spaces, commas or |, up to 32 characters." }
    send: "#X-LABEL {port},{label}"
    expect: { matches: '^~\d+@X-LABEL\s', not_contains: "ERR" }
    returns: ack

  get_port_label:
    summary: Get a port's label by port ID
    params:
      port: { type: string, max_length: 24, pattern: '^(IN|in|OUT|out|BOTH|both)\.[A-Za-z0-9_]+\.[0-9]+$', required: true,
              label: Port ID,
              description: "Port ID as direction.port type.index, e.g. OUT.HDMI.5." }
    send: "#X-LABEL? {port}"
    expect: { matches: '^~\d+@X-LABEL\s+[^,]+,(.*?)\s*$', not_contains: "ERR" }
    returns: value

  set_signal_afv:
    summary: Set audio-follow-video on an output signal by signal ID
    params:
      signal: { type: string, max_length: 32, pattern: '^(OUT|out)\.[A-Za-z0-9_]+\.[0-9]+\.[A-Za-z0-9]+\.[0-9]+$', required: true,
                label: Output signal,
                description: "Output signal ID, e.g. OUT.HDMI.1.AUDIO.1." }
      follow: { type: bool, required: true,
                label: Audio follows video,
                description: "True makes the output's audio follow its video, false breaks it away." }
    send: "#X-AFV {signal},{follow:on_off}"
    expect: { matches: '^~\d+@X-\s*AFV\s', not_contains: "ERR" }
    returns: ack

  get_signal_afv:
    summary: Get audio-follow-video on an output signal ("ON" or "OFF")
    params:
      signal: { type: string, max_length: 32, pattern: '^(OUT|out)\.[A-Za-z0-9_]+\.[0-9]+\.[A-Za-z0-9]+\.[0-9]+$', required: true,
                label: Output signal,
                description: "Output signal ID, e.g. OUT.HDMI.1.AUDIO.1." }
    send: "#X-AFV? {signal}"
    expect: { matches: '^~\d+@X-\s*AFV\s+[^,]+,\s*(\S+)', not_contains: "ERR" }
    returns: value

  get_signal_status:
    summary: Get whether an input signal is present, by signal ID (0 no signal, 1 signal)
    params:
      signal: { type: string, max_length: 32, pattern: '^(IN|in)\.[A-Za-z0-9_]+\.[0-9]+\.[A-Za-z0-9]+\.[0-9]+$', required: true,
                label: Input signal,
                description: "Input signal ID, e.g. IN.HDMI.1.VIDEO.1." }
    send: "#X-SIGNAL? {signal}"
    expect: { matches: '^~\d+@\s*X-SIGNAL\??\s+[^,]+,\s*(\d+)', not_contains: "ERR" }
    returns: value

  # ── Full control: EDID, multiviewer and scaler, step-in, I/O gateway,
  # streamer, network, time and audio DSP (guide p.89-131) ──────────────
  copy_edid:
    summary: "Copy an EDID from an input, output, the default or a custom EDID to the inputs a bitmap names (p.109)"
    params:
      src_type: { type: int, min: 0, max: 3, required: true, label: Source type, description: "Where the EDID comes from: 0 an input, 1 an output, 2 the default EDID, 3 a custom EDID." }
      src_id: { type: int, min: 0, required: true, label: Source, description: "The input, output or EDID number to copy from, as the product numbers them." }
      dst_type: { type: int, min: 0, max: 3, default: 0, label: Destination type, description: "What receives it: 0 inputs (the usual case), as the EDID Source table numbers them." }
      dest_bitmap: { type: string, pattern: '^0x[0-9A-Fa-f]{1,8}$', required: true, label: Destinations, description: "Hex bitmap of the destinations, bit 0 the first, such as 0x13 for inputs 1, 2 and 5." }
      safe_mode: { type: bool, default: true, label: Safe mode, description: "On lets the device adjust the EDID to what it supports, off copies it as it is." }
    send: "#CPEDID {src_type},{src_id},{dst_type},{dest_bitmap},{safe_mode:bool01}"
    expect: { matches: '^~\d+@CPEDID\s', not_contains: "ERR" }
    returns: ack

  get_edid_size:
    summary: "Get the size in bytes of an input's or output's EDID, 0 when it has none (p.111)"
    params:
      stage: { type: int, min: 0, max: 3, required: true, label: Stage, description: "0 input, 1 output, 2 default, as the EDID Source table numbers them." }
      stage_id: { type: int, min: 0, required: true, label: Port, description: "The input or output number." }
    send: "#GEDID? {stage},{stage_id}"
    expect: { matches: '^~\d+@GEDID\s+\d+,\s*\d+,\s*(\d+)', not_contains: "ERR" }
    returns: value

  set_edid_audio:
    summary: "Set the audio an input's EDID announces: 0 auto, 1 LPCM 2 ch, 2 LPCM 6 ch, 3 LPCM 8 ch, 4 bitstream, 5 HD (p.110)"
    params:
      input: { type: int, min: 1, required: true, label: Input, description: "Input number, from 1 as on the device." }
      format: { type: int, min: 0, max: 5, required: true, label: Audio format, description: "0 auto, 1 LPCM 2 channels, 2 LPCM 6, 3 LPCM 8, 4 bitstream, 5 HD audio." }
    send: "#EDID-AUDIO {input},{format}"
    expect: { matches: '^~\d+@EDID-AUDIO\s', not_contains: "ERR" }
