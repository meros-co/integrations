      set_name, reset, factory_reset, route_video, route_audio, get_route_video, get_route_audio,
      store_preset, recall_preset, set_output_audio_level, get_output_audio_level, set_audio_mute,
      get_audio_mute, get_signal, get_display, set_front_panel_lock, get_front_panel_lock, set_standby,
