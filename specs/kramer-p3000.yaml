telemetry:
  # Identity is asked once on connecting. Changes are pushed: every command is
  # bidirectional, so an action from the front panel, IR or another controller
  # is reported to the controller in the same form as the reply to the command
  # (p.3), and SIGNAL, AUD-SIGNAL, DISPLAY and HDCP-STAT are sent on every
  # change (p.17, p.20, p.35, p.76). Rules end in "$" after the value so that an
  # error reply ("~01@NAME x ERR 003") is never taken as state.
  poll:
    send:
      - "#MODEL?"
      - "#VERSION?"
      - "#SN?"
      - "#PROT-VER?"
      - "#NAME?"
      - "#INFO-IO?"
      - "#NET-DHCP?"
      - "#NET-IP?"
      - "#NET-MASK?"
      - "#NET-GATE?"
      - "#NET-MAC?"
      - "#ETH-PORT? TCP"
      - "#ETH-PORT? UDP"
      - "#TIME-LOC?"
      - "#TIME-SRV?"
      - "#BAUD?"
      - "#VIEW-MOD?"
      - "#IMAGE-PROP? 1"
      - "#SCLR-AS? 1"
      - "#VID-RES? 1,1,0"
      - "#KDS-OP-STAT?"
      - "#W-SRC? 1"
      - "#W-ENABLE? 1"
      - "#W-SRC? 2"
      - "#W-ENABLE? 2"
      - "#W-SRC? 3"
      - "#W-ENABLE? 3"
      - "#W-SRC? 4"
      - "#W-ENABLE? 4"
  updates:
    - match: '^~\d+@Protocol Start\s*$'
      state: { "device.started": { value: "Start", map: { Start: true } } }
    - match: '^~\d+@MODEL\s+(.+?)\s*$'
      state: { "device.model": "{1}" }
    - match: '^~\d+@VERSION\s+([0-9.]+)\s*$'
      state: { "device.firmware": "{1}" }
    - match: '^~\d+@SN\s+([0-9]+)\s*$'
      state: { "device.serial": "{1}" }
    - match: '^~\d+@PROT-VER\s+3000:([0-9.]+)\s*$'
      state: { "device.protocol_version": "{1}" }
    - match: '^~\d+@NAME\??\s+([A-Za-z0-9_-]+)\s*$'
      state: { "device.name": "{1}" }
    - match: '^~\d+@INFO-IO\??\s+IN\s+(\d+),\s*OUT\s+(\d+)\s*$'
      state: { "device.inputs": "{1}", "device.outputs": "{2}" }
    - match: '^~\d+@INFO-PRST\??\s+VID\s+(\d+),\s*AUD\s+(\d+)\s*$'
      state: { "presets.video_count": "{1}", "presets.audio_count": "{2}" }
    # Routing: ROUTE layer,dest,src (p.54) and the legacy and device-initiated
    # VID/AUD/AV in>out (p.52, p.55, p.132).
    - match: '^~\d+@ROUTE\s+1,(\d+),(\d+)\s*$'
      state: { "video.outputs.{1}.input": "{2}" }
    - match: '^~\d+@ROUTE\s+2,(\d+),(\d+)\s*$'
      state: { "audio.outputs.{1}.input": "{2}" }
    - match: '^~\d+@ROUTE\s+3,(\d+),(\d+)\s*$'
      state: { "data.outputs.{1}.input": "{2}" }
    - match: '^~\d+@ROUTE\s+4,(\d+),(\d+)\s*$'
      state: { "ir.outputs.{1}.input": "{2}" }
    - match: '^~\d+@ROUTE\s+5,(\d+),(\d+)\s*$'
      state: { "usb.outputs.{1}.input": "{2}" }
    - match: '^~\d+@VID\s+(\d+)>(\d+)\s*$'
      state: { "video.outputs.{2}.input": "{1}" }
    - match: '^~\d+@AUD\s+(\d+)>(\d+)\s*$'
      state: { "audio.outputs.{2}.input": "{1}" }
    - match: '^~\d+@AV\s+(\d+)>(\d+)\s*$'
      state: { "video.outputs.{2}.input": "{1}", "audio.outputs.{2}.input": "{1}" }
    - match: '^~\d+@AFV\s+(\S+)\s*$'
      state: { "audio_follow_video": { value: "{1}", map: { "0": true, "afv": true, "AFV": true, "1": false, "brk": false, "BRK": false } } }
    - match: '^~\d+@AV-SW-MODE\s+(\d+),(\d+),(\d+)\s*$'
      state: { "outputs.{2}.auto_switch.{1}": "{3}" }
    # Presets (p.32-34). The guide's examples show PRST-STO/PRST-RCL replies
    # without the "nn@" address, so it is optional here.
    - match: '^~(?:\d+@)?PRST-RCL\s+(\d+)\s*$'
      state: { "presets.last_recalled": "{1}" }
    - match: '^~(?:\d+@)?PRST-STO\s+(\d+)\s*$'
      state: { "presets.last_stored": "{1}" }
    - match: '^~\d+@PRST-LST\s*([0-9, ]*?)\s*$'
      state: { "presets.stored": "{1}" }
    - match: '^~\d+@PRST-LOCK\s+(\d+),\s*(ON|OFF)\s*$'
      state: { "presets.{1}.locked": { value: "{2}", map: { "ON": true, "OFF": false } } }
    # Labels (p.23): stage 0 input, 1 output.
    - match: '^~\d+@LABEL\s+0,(\d+),[^,]*,(.*?)\s*$'
      state: { "inputs.{1}.label": "{2}" }
    - match: '^~\d+@LABEL\s+1,(\d+),[^,]*,(.*?)\s*$'
      state: { "outputs.{1}.label": "{2}" }
    # Mutes, levels and output controls.
    - match: '^~\d+@VMUTE\s+(\d+),\s*([012])\s*$'
      state: { "outputs.{1}.video_mute": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^~\d+@MUTE\s+(\d+),\s*(\S+)\s*$'
      state: { "outputs.{1}.audio_mute": { value: "{2}", map: { "0": false, "1": true, "OFF": false, "ON": true } } }
    - match: '^~\d+@AUD-LVL\s+0,(\d+),\s*(-?\d+(?:\.\d+)?)\s*$'
      state: { "audio.inputs.{1}.level": "{2}" }
    - match: '^~\d+@AUD-LVL\s+1,(\d+),\s*(-?\d+(?:\.\d+)?)\s*$'
      state: { "audio.outputs.{1}.level": "{2}" }
    - match: '^~\d+@VFRZ\s+(\d+),\s*(\S+)\s*$'
      state: { "outputs.{1}.freeze": { value: "{2}", map: { "0": false, "1": true, "OFF": false, "ON": true } } }
    - match: '^~\d+@VID-PATTERN\s+(\d+),\s*(\d+)\s*$'
      state: { "outputs.{1}.test_pattern": "{2}" }
    # Signal, HDCP and sink status: pushed on every change.
    - match: '^~\d+@SIGNAL\s+(\d+),\s*([01])\s*$'
      state: { "inputs.{1}.signal": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^~\d+@AUD-SIGNAL\s+(\d+),\s*([01])\s*$'
      state: { "inputs.{1}.audio_signal": { value: "{2}", map: { "0": false, "1": true } } }
    - match: '^~\d+@HDCP-STAT\s+0,(\d+),\s*(\S+)\s*$'
      state: { "inputs.{1}.hdcp": { value: "{2}", map: { "ON": true, "OFF": false, "1": true, "0": false } } }
    - match: '^~\d+@HDCP-STAT\s+1,(\d+),\s*(\S+)\s*$'
      state: { "outputs.{1}.hdcp": { value: "{2}", map: { "ON": true, "OFF": false, "1": true, "0": false } } }
    - match: '^~\d+@HDCP-MOD\s+(\d+),\s*([0-3])\s*$'
      state: { "inputs.{1}.hdcp_mode": "{2}" }
    - match: '^~\d+@DISPLAY\s+(\d+),\s*([0-2])\s*$'
      state: { "outputs.{1}.display": "{2}" }
    # Front panel, standby, power save.
    - match: '^~\d+@LOCK-FP\s+(\S+)\s*$'
      state: { "front_panel_locked": { value: "{1}", map: { "0": false, "1": true } } }
    - match: '^~\d+@STANDBY\s+(\S+)\s*$'
      state: { "standby": { value: "{1}", map: { "0": false, "1": true, "OFF": false, "ON": true } } }
    - match: '^~\d+@POWER-SAVE\s+(\S+)\s*$'
      state: { "power_save": { value: "{1}", map: { "0": false, "1": true, "OFF": false, "ON": true } } }
    # Full control: EDID, multiviewer, I/O, streamer, network, audio DSP (the
    # replies to sets and queries, and the same messages pushed on change).
    - match: '^~\d+@EDID-AUDIO\??\s+(\d+),\s*(\d+)\s*$'
      state: { "edid.inputs.{1}.audio_format": "{2}" }
    - match: '^~\d+@EDID-CS\??\s+(\d+),\s*(\d+)\s*$'
      state: { "edid.inputs.{1}.color_space": "{2}" }
    - match: '^~\d+@EDID-DC\??\s+(\d+),\s*(\S+)\s*$'
      state: { "edid.inputs.{1}.deep_color_removed": { value: "{2}", map: { "0": false, "1": true, "OFF": false, "ON": true, "off": false, "on": true } } }
    - match: '^~\d+@LOCK-EDID\??\s+(\d+),\s*(\S+)\s*$'
      state: { "edid.inputs.{1}.locked": { value: "{2}", map: { "0": false, "1": true, "OFF": false, "ON": true, "off": false, "on": true } } }
    - match: '^~\d+@VIEW-MOD\??\s+(\d+)\s*$'
      state: { "view_mode": "{1}" }
    - match: '^~\d+@W-SRC\??\s+(\d+),\s*(\d+)\s*$'
      state: { "windows.{1}.source": "{2}" }
    - match: '^~\d+@W-LAYER\??\s+(\d+),\s*(\d+)\s*$'
      state: { "windows.{1}.layer": "{2}" }
    - match: '^~\d+@W-COLOR\??\s+(\d+),\s*(\d+)\s*$'
      state: { "windows.{1}.color": "{2}" }
    - match: '^~\d+@W-HUE\??\s+(\d+),\s*(\d+)\s*$'
      state: { "windows.{1}.hue": "{2}" }
    - match: '^~\d+@W-SATURATION\??\s+(\d+),\s*(\d+)\s*$'
      state: { "windows.{1}.saturation": "{2}" }
    - match: '^~\d+@W-SHARP\??\s+(\d+),\s*(\d+)\s*$'
      state: { "windows.{1}.sharpness": "{2}" }
    - match: '^~\d+@W-ZOOM\??\s+(\d+),\s*(\d+)\s*$'
      state: { "windows.{1}.zoom": "{2}" }
    - match: '^~\d+@BRIGHTNESS\??\s+(\d+),\s*(\d+)\s*$'
      state: { "windows.{1}.brightness": "{2}" }
    - match: '^~\d+@CONTRAST\??\s+(\d+),\s*(\d+)\s*$'
      state: { "windows.{1}.contrast": "{2}" }
    - match: '^~\d+@W-ENABLE\??\s+(\d+),\s*(\S+)\s*$'
      state: { "windows.{1}.enabled": { value: "{2}", map: { "0": false, "1": true, "OFF": false, "ON": true, "off": false, "on": true } } }
    - match: '^~\d+@W-FRZ\??\s+(\d+),\s*(\S+)\s*$'
      state: { "windows.{1}.frozen": { value: "{2}", map: { "0": false, "1": true, "OFF": false, "ON": true, "off": false, "on": true } } }
    - match: '^~\d+@WND-BRD\??\s+(\d+),\s*(\S+)\s*$'
      state: { "windows.{1}.border": { value: "{2}", map: { "0": false, "1": true, "OFF": false, "ON": true, "off": false, "on": true } } }
    - match: '^~\d+@W-POS\??\s+(\d+),\s*(\d+,\s*\d+,\s*\d+,\s*\d+)\s*$'
      state: { "windows.{1}.position": "{2}" }
    - match: '^~\d+@IMAGE-PROP\??\s+(\d+),\s*(\d+)\s*$'
      state: { "scalers.{1}.image_mode": "{2}" }
    - match: '^~\d+@SCLR-AS\??\s+(\d+),\s*(\d+)\s*$'
      state: { "scalers.{1}.auto_sync_off": "{2}" }
    - match: '^~\d+@SCLR-AUDIO-DELAY\??\s+(\d+),\s*(\d+)\s*$'
      state: { "outputs.{1}.audio_delay": "{2}" }
    - match: '^~\d+@SHOW-OSD\??\s+(\d+),\s*(\d+)\s*$'
      state: { "osd.{1}.mode": "{2}" }
    - match: '^~\d+@VID-RES\??\s+1,\s*(\d+),\s*0,\s*(\d+)\s*$'
      state: { "outputs.{1}.resolution": "{2}" }
    - match: '^~\d+@VID-RES\??\s+0,\s*(\d+),\s*0,\s*(\d+)\s*$'
      state: { "inputs.{1}.resolution": "{2}" }
    - match: '^~\d+@BTN\??\s+(\d+),\s*(\d+)\s*$'
      state: { "stepin.buttons.{1}.mode": "{2}" }
    - match: '^~\d+@GPIO-CFG\??\s+(\d+),\s*([01]),\s*([01])'
      state: { "gpio.{1}.type": "{2}", "gpio.{1}.direction": "{3}" }
    - match: '^~\d+@GPIO-STATE\??\s+(\d+),\s*(\d+)\s*$'
      state: { "gpio.{1}.state": "{2}" }
    - match: '^~\d+@GPIO-VOLT\??\s+(\d+),\s*(\d+)\s*$'
      state: { "gpio.{1}.voltage_mv": "{2}" }
    - match: '^~\d+@RELAY-STATE\??\s+(\d+),\s*(\S+)\s*$'
      state: { "relays.{1}.closed": { value: "{2}", map: { "0": false, "1": true, "OFF": false, "ON": true, "off": false, "on": true } } }
    - match: '^~\d+@UART\??\s+(\d+),\s*(\d+,.+?)\s*$'
      state: { "serial.{1}.settings": "{2}" }
    - match: '^~\d+@BAUD\??\s+(\d+)\s*$'
      state: { "control_baud": "{1}" }
    - match: '^~\d+@PORT-DIRECTION\??\s+(\d+),\s*(IN|OUT)\s*$'
      state: { "ports.{1}.direction": "{2}" }
    - match: '^~\d+@COM-ROUTE\??\s+(\d+),\s*(\d+,.+?)\s*$'
      state: { "serial.{1}.tunnel": "{2}" }
    - match: '^~\d+@KDS-ACTION\??\s+(\d+)\s*$'
      state: { "streamer.action": "{1}" }
    - match: '^~\d+@KDS-AUD\??\s+(\d+)\s*$'
      state: { "streamer.audio": "{1}" }
    - match: '^~\d+@KDS-EN\??\s+(\d+)\s*$'
      state: { "streamer.encoding": "{1}" }
    - match: '^~\d+@KDS-LATENCY\??\s+(\d+)\s*$'
      state: { "streamer.latency_ms": "{1}" }
    - match: '^~\d+@KDS-SCALE\??\s+(\d+)\s*$'
      state: { "streamer.scale": "{1}" }
    - match: '^~\d+@KDS-CONN\??\s+(\S+)\s*$'
      state: { "streamer.connection": "{1}" }
    - match: '^~\d+@KDS-OP-STAT\??\s+(\d+)\s*$'
      state: { "streamer.status": "{1}" }
    - match: '^~\d+@KDS-BR\??\s+(\d+)\s*$'
      state: { "streamer.bitrate_kbps": "{1}" }
    - match: '^~\d+@KDS-FR\??\s+(\d+)\s*$'
      state: { "streamer.frame_rate": "{1}" }
    - match: '^~\d+@KDS-ACTIVE-CLNT\??\s+(\d+)\s*$'
      state: { "streamer.clients": "{1}" }
    - match: '^~\d+@KDS-GOP\??\s+(\d+)\s*$'
      state: { "streamer.gop": "{1}" }
    - match: '^~\d+@KDS-METHOD\??\s+(\d+)\s*$'
      state: { "streamer.method": "{1}" }
    - match: '^~\d+@KDS-PROT\??\s+(\S+)\s*$'
      state: { "streamer.protocol": "{1}" }
    - match: '^~\d+@KDS-MOD\??\s+(\d+)\s*$'
      state: { "streamer.mode": "{1}" }
    - match: '^~\d+@NET-DHCP\??\s+([01])\s*$'
      state: { "network.dhcp": { value: "{1}", map: { "0": false, "1": true, "OFF": false, "ON": true, "off": false, "on": true } } }
    - match: '^~\d+@NET-IP\??\s+([0-9.]+)\s*$'
      state: { "network.address": "{1}" }
    - match: '^~\d+@NET-MASK\??\s+([0-9.]+)\s*$'
      state: { "network.netmask": "{1}" }
    - match: '^~\d+@NET-GATE\??\s+([0-9.]+)\s*$'
      state: { "network.gateway": "{1}" }
    - match: '^~\d+@NET-CONFIG\??\s+(\d+),\s*([0-9.]+),\s*([0-9.]+),\s*([0-9.]+)'
      state: { "network.interfaces.{1}.address": "{2}", "network.interfaces.{1}.netmask": "{3}", "network.interfaces.{1}.gateway": "{4}" }
    - match: '^~\d+@NET-MAC\??\s+(?:\d+,\s*)?([0-9A-Fa-f]{2}(?:[-:][0-9A-Fa-f]{2}){5})\s*$'
      state: { network.mac: "{1}" }
    - match: '^~\d+@NET-DNS\??\s+(\d+),\s*([0-9.]+)\s*$'
      state: { "network.dns.{1}": "{2}" }
    - match: '^~\d+@ETH-PORT\??\s+(TCP|UDP|0|1),\s*(\d+)\s*$'
      state: { "network.control_ports.{1}": "{2}" }
    - match: '^~\d+@TIME-LOC\??\s+(-?\d+,\s*\S+)\s*$'
      state: { "clock.location": "{1}" }
    - match: '^~\d+@TIME-SRV\??\s+(\d.+?)\s*$'
      state: { clock.server: "{1}" }
    - match: '^~\d+@TIME\??\s+([A-Za-z]{3},.+?)\s*$'
      state: { clock.time: "{1}" }
    - match: '^~\d+@AUD-EMB\??\s+(\d+),\s*(\d+),\s*(\d+)\s*$'
      state: { "audio.embedding.{1}.{2}": "{3}" }
    - match: '^~\d+@AUD-FILTER\??\s+(\d+),\s*(\d+,.+?)\s*$'
      state: { "audio.channels.{1}.filter": "{2}" }
    - match: '^~\d+@AUD-MIX\??\s+(\d+),\s*(\d+),\s*(-?\d+(?:\.\d+)?)\s*$'
      state: { "audio.channels.{1}.mix.{2}": "{3}" }
    - match: '^~\d+@EQ-FREQ\??\s+(\d+),\s*(\d+),\s*(\d+),\s*(\d+)\s*$'
      state: { "audio.eq.{1}.{2}.{3}.frequency": "{4}" }
    - match: '^~\d+@EQ-LVL\??\s+(\d+),\s*(\d+),\s*(\d+),\s*(-?\d+)\s*$'
      state: { "audio.eq.{1}.{2}.{3}.level": "{4}" }
    - match: '^~\d+@EQ-Q\??\s+(\d+),\s*(\d+),\s*(\d+)\s*$'
      state: { "audio.channels.{1}.eq_q.{2}": "{3}" }
    - match: '^~\d+@MIC-GAIN\??\s+(\d+),\s*(\d+)\s*$'
      state: { "audio.mics.{1}.gain": "{2}" }
    - match: '^~\d+@MIC-TLK\??\s+(\d+),\s*(\d+),\s*(\d+)\s*$'
      state: { "audio.talkover.{1}.{2}": "{3}" }
    - match: '^~\d+@TLK\??\s+(\d+),\s*(\d+)\s*$'
      state: { "audio.channels.{1}.talkover_mode": "{2}" }
    - match: '^~\d+@BASS\??\s+(\d+),\s*(-?\d+)\s*$'
      state: { "audio.channels.{1}.bass": "{2}" }
    - match: '^~\d+@TREBLE\??\s+(\d+),\s*(-?\d+)\s*$'
      state: { "audio.channels.{1}.treble": "{2}" }
    - match: '^~\d+@MIDRANGE\??\s+(\d+),\s*(-?\d+)\s*$'
      state: { "audio.channels.{1}.midrange": "{2}" }
    - match: '^~\d+@BALANCE\??\s+(\d+),\s*(-?\d+)\s*$'
      state: { "audio.channels.{1}.balance": "{2}" }
    - match: '^~\d+@LOUDNESS\??\s+(\d+),\s*(\S+)\s*$'
      state: { "audio.channels.{1}.loudness": { value: "{2}", map: { "0": false, "1": true, "OFF": false, "ON": true, "off": false, "on": true } } }
    - match: '^~\d+@MIC-DELAY\??\s+(\d+),\s*(\d+)\s*$'
      state: { "audio.mics.{1}.delay_ms": "{2}" }
    # Extended (X-) replies and notifications, keyed by the signal ID's fields.
    - match: '^~\d+@X-ROUTE\s+(OUT|BOTH)\.(\w+)\.(\d+)\.(\w+)\.(\d+),\s*(\S+?)\s*$'
      state: { "signals.{1}.{2}.{3}.{4}.{5}.source": "{6}" }
    - match: '^~\d+@X-MUTE\s+(IN|OUT|BOTH)\.(\w+)\.(\d+)\.(\w+)\.(\d+),\s*(ON|OFF)\s*$'
      state: { "signals.{1}.{2}.{3}.{4}.{5}.mute": { value: "{6}", map: { "ON": true, "OFF": false } } }
    - match: '^~\d+@X-AUD-LVL\s+(IN|OUT|BOTH)\.(\w+)\.(\d+)\.(\w+)\.(\d+),\s*(-?\d+(?:\.\d+)?)\s*$'
      state: { "signals.{1}.{2}.{3}.{4}.{5}.level": "{6}" }
    - match: '^~\d+@X-\s*AFV\s+(OUT)\.(\w+)\.(\d+)\.(\w+)\.(\d+),\s*(ON|OFF)\s*$'
      state: { "signals.{1}.{2}.{3}.{4}.{5}.afv": { value: "{6}", map: { "ON": true, "OFF": false } } }
    - match: '^~\d+@X-LABEL\s+(IN|OUT|BOTH)\.(\w+)\.(\d+),(.*?)\s*$'
      state: { "ports.{1}.{2}.{3}.label": "{4}" }
    # Product-specific replies and changes.
    - match: '^~\d+@#?ROTATE\s+(\d+),(\d+),([0-4])\s*$'
      state: { "mv.rotation.{1}.{2}": "{3}" }
    - match: '^~\d+@KDS-CHANNEL-SELECT\s+([A-Za-z0-9]+),(\d+)\s*$'
      state: { "kds.channels.{1:lower}": "{2}" }
    - match: '^~\d+@KDS-CHANNEL-SELECT\s+\[([^\]]*)\],(\d+)\s*$'
      match_each: '([A-Za-z0-9]+)'
      match_each_in: 1
      state: { "kds.channels.{3:lower}": "{2}" }
    - match: '^~\d+@KDS-DEFINE-CHANNEL\s+(\d+)\s*$'
      state: { kds.encoder_channel: "{1}" }
    - match: '^~\d+@KDS-VLAN-TAG\s+(\d+),(\d+)\s*$'
      state: { "kds.vlan_tags.{1}": "{2}" }
    - match: '^~\d+@VIDEO-WALL-SETUP\s+(\d+),([0-3])\s*$'
      state: { video_wall.position: "{1}", video_wall.rotation: "{2}" }
    - match: '^~\d+@X-MIX-LVL\s+(OUT\.[A-Z_]+\.\d+\.AUDIO\.\d+),(IN\.[A-Z_]+\.\d+\.AUDIO\.\d+),(-?\d+(?:\.\d+)?)\s*$'
      state: { "mixer.{1:key}.{2:key}.level": "{3}" }
    - match: '^~\d+@X-MIX-MUTE\s+(OUT\.[A-Z_]+\.\d+\.AUDIO\.\d+),(IN\.[A-Z_]+\.\d+\.AUDIO\.\d+),([01])\s*$'
      state: { "mixer.{1:key}.{2:key}.mute": { value: "{3}", map: { "0": false, "1": true } } }
    - match: '^~\d+@DSP-(AEC|COMP|DELAY|EXP|HPF|LIMITER|POST|SIGGEN)\s+([A-Za-z-]+),((?:IN|OUT)\.[A-Z_]+\.\d+\.AUDIO\.\d+),(-?\d+(?:\.\d+)?)\s*$'
      state: { "dsp.{1:lower}.{3:key}.{2:lower}": "{4}" }
    - match: '^~\d+@DSP-EQ\s+([A-Za-z-]+),((?:IN|OUT)\.[A-Z_]+\.\d+\.AUDIO\.\d+),(\d+),(-?\d+(?:\.\d+)?)\s*$'
      state: { "dsp.eq.{2:key}.{3}.{1:lower}": "{4}" }
    - match: '^~\d+@DSP-INVERT\s+((?:IN|OUT)\.[A-Z_]+\.\d+\.AUDIO\.\d+),([01])\s*$'
      state: { "dsp.invert.{1:key}.inverted": "{2}" }
    - match: '^~\d+@DSP-METER\s+((?:IN|OUT)\.[A-Z_]+\.\d+\.AUDIO\.\d+),([1-5]),(-?\d+(?:\.\d+)?)\s*$'
      state: { "meters.{1:key}.{2}": "{3}" }

quirks:
  - models: [all]
    severity: critical
    text: >
      ROUTE arguments are layer,destination,source (p.54). Destination precedes
      source, which is the reverse of most routing protocols. Transposing them
      routes the wrong way without erroring when both indices are valid. The
      legacy VID/AUD/AV commands are the other way round, input>output.

  - models: [all]
    severity: warning
    text: >
      Host messages end with CR alone; device messages end with CR LF (p.1-2).
      A command string is limited to 64 characters (p.2-3). Spaces between
      parameters are ignored by the parser (p.2), so a label or name cannot
      contain a space, and a comma or "|" in one would split it.

  - models: [all]
    severity: warning
    text: >
      Success has no single token. A command is answered by its own echo in
      long syntax ("~01@ROUTE 1,2,3"), sometimes followed by OK, and failure by
      "~nn@CMD ... ERR xxx" or "~nn@ERR xxx" (p.132). Acknowledgement is the
      echoed command name without ERR. Error codes (p.133): 001 syntax, 002
      command not available, 003 parameter out of range, 004 unauthorized,
      005 internal firmware error, 006 busy, 008 timeout, 031 device-specific,
      033 wrong operation mode, 034 not initialised.

  - models: [all]
    severity: warning
    text: >
      Every command is bidirectional (p.3): when the front panel, IR remote or
      another controller acts, the device sends the same "~nn@..." message to
      every connected controller. Such a pushed message can arrive while a
      command is waiting for its reply and, since both start with "~nn@", the
      core may take it as that reply. Commands therefore check that the reply
      echoes their own command name, so a pushed message about a different
      command fails the command rather than acknowledging it; a pushed message
      of the same command (another controller routing at the same moment) is
      indistinguishable.

  - models: [all]
    severity: warning
    text: >
      The reference guide lists the whole protocol, not one product. Each
      product implements a subset documented in its own user manual and answers
      ERR 002 to the rest; #HELP lists what a device supports. Port, channel and
      preset counts are per product: the guide gives no maximum, so none is
      enforced here, and INFO-IO? and INFO-PRST report the device's counts. A
      route to a port the product lacks returns ERR 003.

  - models: [all]
    severity: info
    text: >
      Layers (p.140) are 1 video, 2 audio, 3 data, 4 IR, 5 USB. The ROUTE entry
      (p.54) describes the destination as "* - ALL, x - disconnect, otherwise
      destination id" and gives no disconnect value for the source; the legacy
      VID/AUD/AV entries (p.52, p.55) document input 0 as disconnect. Routing
      input 0 with ROUTE follows the legacy convention and is not confirmed by
      the ROUTE entry itself.

  - models: [all]
    severity: info
    text: >
      In audio-follow-video mode an AUD command also switches video, and the
      device answers with "~nn@AV" rather than "~nn@AUD" (p.52). Moving from
      breakaway to AFV resets every audio route to its video route (p.51). In
      most products a preset stores and recalls video and audio together
      (p.22).

  - models: [all]
    severity: info
    text: >
      Documentation inconsistencies taken as written: the LABEL query (p.23)
      carries only a port number, with no input/output stage, although the set
      and the reply carry one; NAME? is answered "~nn@NAME? name" with the
      question mark, unlike other queries (p.27); INFO-PRST is listed as
      "INFO-PRST?" in the command index (p.14) but its syntax box shows
      "#INFO-PRST" (p.22) — the query form "#INFO-PRST?" is sent here. The
      PRST-STO/PRST-RCL examples (p.34) show replies without "nn@".

  - models: [all]
    severity: info
    text: >
      VMUTE flag 2 (blank picture) is listed in the Video Mute table (p.138) but
      the VMUTE entry says it is not supported (p.64); set_video_mute sends 0 or
      1 only. AUD-LVL "channel" refers to the Audio Channel table (1 master, 2
      secondary, p.143) on some products and to an input/output number on
      others; the guide does not say which a given product uses. Its range is
      -80 to +10 dB, and the optional fourth parameter 1 changes the level
      without affecting the mute state (p.73).

  - models: [all]
    severity: info
    text: >
      Permission levels apply only when security is enabled with SECUR (p.49-50).
      NAME, RESET, HDCP-MOD set and POWER-SAVE set are Administrator commands;
      FACTORY deletes all user data and may need a power cycle (p.10). The
      LOGIN command's level argument is described only as "End User or Admin"
      without its wire spelling, so login is not modelled; a device with
      security on answers unauthorised commands with ERR 004.

  - models: [p3000-extended]
    severity: info
    text: >
      Extended commands address ports as direction.type.index (IN.HDMI.1) and
      signals as port.signal_type.index (OUT.HDBT.4.VIDEO.1), case-insensitive
      (p.4-6). In X-ROUTE "VIDEO.1" is implied when omitted, and the reply
      always gives the full signal ID (p.56). SIGNALS-LIST? and PORTS-LIST? give
      the IDs a product has. The guide's X-SIGNAL and X-AFV entries carry typing
      errors in their syntax and examples (a stray space after "@" or "X-"), so
      their replies are matched leniently.

  - models: [all]
    severity: critical
    text: >
      NET-DHCP, NET-IP, NET-MASK, NET-GATE, NET-CONFIG and ETH-PORT TCP change
      how the device is reached and can end this connection at once (Admin
      permission when security is on, p.90-93); the device may come back at
      another address or port. KDS-SCALE restarts a streamer. copy_edid
      replaces the destination inputs' EDIDs, which makes their sources
      re-read them and can blank them briefly. set_com_route takes over a
      serial port for a network tunnel.

  - models: [all]
    severity: warning
    text: >
      The guide gives the command syntax; each product gives its own values,
      which the commands pass through unchecked (no maxima are enforced).
      VID-RES takes the guide's CEA VIC numbers (0 native) on some products,
      200 native to 233 on the VP-440X, VP-551X and VP-427X2, and 0-40 on the
      MV-4X. IMAGE-PROP on the MV-4X takes a window and an aspect (0 full,
      1 16:9, 2 16:10, 3 4:3, 4 best fit, 5 user), and the scalers add 7
      follow input. SCLR-AS has 3 immediate on the VP-427X2, and the MV-4X
      swaps fast and slow. AUD-EMB, AUD-LVL and MIC-GAIN count channels from 0
      on the presentation switchers; the VP-551X's MIC-GAIN takes a third
      parameter (0,mic,level), which is not offered. EQ-LVL's units and band
      numbers are the product's. VIEW-MOD and W-COLOR tables differ by
      product. The product's manual and #HELP say which commands and values
      it has.

  - models: [all]
    severity: info
    text: >
      Format limits: LDEDID loads an EDID in a second step of CRC-checked
      binary packets (p.112, p.134-135), GEDID sends the EDID as data lines
      after its first answer (p.111), and IR-SND splits a Pronto code into
      numbered packets to stay within the 64-character command limit
      (p.120): none of them can be expressed as a fixed message, so only
      CPEDID and GEDID? are offered. Commands defined only by a product's own
      manual are modelled for the products with their own model here (KDS-EN7,
      KDS-DEC7, DSP-62-AEC, DSP-62-UC, MV-4X), from those manuals; for other
      products they are not, since the generic models cannot list them
      accurately (CEC-PASS, AUDIO-BYPASS and the like). The guide names the audio delay command both
      AUD-DELAY and AUX-DELAY (p.71), so it is left out, and its KDS-ACTION
      table is a copy of another table (the KDS-EN7 manual's 0 stop, 1 play,
      2 save is used). The poll on connecting also reads the network, time,
      baud rate, layout, scaler 1, output 1's resolution, windows 1-4 and the
      streamer's state; a product answers what it lacks with ERR 002.

  - models: [kds-en7, kds-dec7, dsp-62-aec, dsp-62-uc, mv-4x]
    severity: info
    text: >
      Each product's manual writes commands without the space after the command
      name (#ROTATE1,1,3); Protocol 3000 takes a space there (guide p.2), which
      is sent here as for every other command. The manuals' tables have typing
      errors, read as their examples show: MV-4X ROTATE? and AUD-LVL? replies
      written with "#" after "@", W-SHARP-H/V examples named W-SHARPNESS-H/V;
      the DSP-62's signal generator written DSP-SIG-GEN in the table and
      DSP-SIGGEN in its syntax and example (DSP-SIGGEN is sent), DSP-METER
      written without its "?" (sent with it), DSP-AEC? and DSP-HPF? written
      with a value (sent without), and the get example of DSP-COMP written
      "attack time"; the KDS-7's NET-SRV-DSCP numbering its services 0 stream,
      1 control, unlike NET-SRV-802-1Q's 0 control, 1 stream.

  - models: [kds-en7, kds-dec7, dsp-62-aec, dsp-62-uc, mv-4x]
    severity: warning
    text: >
      Commands of the generic models that these products answer differently
      are left out of their lists: on the KDS-7, NAME (it takes an interface
      first: set_interface_name), VIEW-MOD with one value (video wall modes
      15 and 16 only), the NET-IP, NET-MASK and NET-GATE sets, COM-ROUTE (it
      uses COM-ROUTE-ADD) and the streamer commands its manual does not list;
      on the DSP-62, ETH-PORT (0 or 1 for TCP or UDP, where the generic
      command sends the word), TIME-SRV with three values (it takes four),
      IDV and the standard audio commands; on the MV-4X, the two-value HDCP-MOD
      (set_io_hdcp_mode), W-SHARP (split into horizontal and vertical),
      NAME-RST, IDV and ROUTE with "*". The DSP-62's X-PRST lists, names and
      locks, PRIORITY and the GPIO step setting, the KDS-7's EDID management,
      CEC, beacon, log, gateway message, security and firmware commands, and
      the MV-4X's UPDATE-EDID are not modelled.

  - models: [dsp-62-aec, dsp-62-uc]
    severity: critical
    text: >
      recall_config_preset replaces the whole configuration or the whole mixer
      at once; store_config_preset overwrites a preset bank with no undo (bank
      1, the factory preset, is read-only).

  - models: [kds-dec7]
    severity: warning
    text: >
      set_kds_channel and set_kds_signal_channel change what the decoder shows
      at once; channel 0 stops decoding. The video wall position needs the
      video wall mode (set_video_wall_grid or set_video_wall_mosaic) first.
