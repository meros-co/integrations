spec: 1
id: kramer-p3000
name: Kramer Protocol 3000 matrices and switchers
vendor: Kramer Electronics
category: router

# Transcribed from Kramer's Protocol 3000 Reference Guide. Page numbers below
# are the guide's printed page numbers (the PDF page is six higher).
#
# The guide is the protocol's master command list, not any one product's: each
# product implements a subset, listed in that product's own user manual, and
# answers "ERR 002" (command not available) to the rest. Operator commands for
# matrix and presentation switchers, EDID, multiviewer and scaler, step-in,
# I/O gateway, streamer, network, time and audio DSP are covered here as the
# guide defines them; firmware/FPGA/file loading, the multi-step EDID load and
# multi-packet IR are not, nor commands that only a product's own manual
# defines (see the quirks).
source:
  - title: "Protocol 3000 Reference Guide, Version 3.0 (User), P/N 2900-300489 Rev 5 (revision 3.0, 26/7/2017)"
    author: Kramer Electronics Ltd.
    url: https://k.kramerav.com/downloads/protocols/protocol_3000_3.0_master_user.pdf
    note: >
      Manufacturer document. Transport, framing and syntax p.1-3 (TCP port 5000,
      host messages "#...CR", device messages "~nn@...CR LF", 64-character limit,
      every command bidirectional so front-panel actions are reported);
      extended (X-) syntax, port and signal IDs p.4-7; mandatory system commands
      p.9-13; system commands p.14-45 (DISPLAY? p.17, HDCP-MOD p.19, HDCP-STAT?
      p.20, IDV p.21, INFO-IO?/INFO-PRST p.22, LABEL p.23, LOCK-FP p.25, NAME
      p.27, NAME-RST p.28, PORTS-LIST? and POWER-SAVE p.30, PRST-AUD?/PRST-LOCK
      p.32, PRST-LST?/PRST-RCL p.33, PRST-STO/PRST-VID? p.34, SIGNAL? and
      SIGNALS-LIST? p.35, STANDBY p.36, AV-SW-MODE p.15, X-LABEL p.39, X-SIGNAL
      p.45); switching/routing p.51-56 (AFV p.51, AUD/AV p.52, MATRIX-STATUS?
      p.53, ROUTE p.54, VID and X-AFV p.55, X-ROUTE p.56); video p.57-68 (VFRZ
      p.62, VID-PATTERN p.63, VMUTE p.64, X-MUTE p.66); audio p.69-88 (AUD-LVL
      p.73, AUD-SIGNAL? p.76, MUTE p.83, X-AUD-LVL p.85); device-initiated
      messages and error codes p.132-133; parameter tables p.136-147.
      Retrieved again 2026-10-14 for the remaining chapters: video (VID-RES
      p.64); audio (AUD-EMB p.71, AUD-FILTER p.72, AUD-MIX p.74, BALANCE p.77,
      BASS and EQ-FREQ p.78, EQ-LVL and EQ-Q p.79, LOUDNESS and MIC-DELAY
      p.80, MIC-GAIN and MIC-TLK p.81, MIDRANGE p.82, TLK p.84, TREBLE p.85);
      communication (ETH-PORT and NET-CONFIG p.90, NET-DHCP and NET-DNS p.91,
      NET-GATE and NET-IP p.92, NET-MAC and NET-MASK p.93, TIME-SRV and UART
      p.94); BAUD p.16, PORT-DIRECTION p.29, TIME and TIME-LOC p.36-37;
      multiviewer and scaler p.96-108 (BRIGHTNESS, CONTRAST, IMAGE-PROP,
      SCLR-AS, SCLR-AUDIO-DELAY, SCLR-PCAUTO, SHOW-OSD, VIEW-MOD, W-ACTIVE,
      WND-BRD, W-COLOR, W-ENABLE, W-FRZ, W-HUE, W-LAYER, W-POS, W-SATURATION,
      W-SHARP, W-SRC, W-ZOOM); EDID p.109-113 (CPEDID, EDID-AUDIO, EDID-CS,
      EDID-DC, GEDID, LDEDID, LOCK-EDID); step-in p.114-115 (BTN, STEPIN-CP);
      I/O gateway p.116-123 (COM-ROUTE, COM-ROUTE-REMOVE, ETH-TUNNEL,
      GPIO-CFG, GPIO-STATE, GPIO-THR, GPIO-VOLT, RELAY-STATE); streamer
      p.124-131 (KDS-*); packet protocol p.134-135.
  - title: "Kramer product user manuals with Protocol 3000 tables: VP-440X (P/N 2900-301382 Rev 4), VP-551X (2900-301296 Rev 6), VP-427X2 (2900-301500 Rev 1), MV-4X (2900-301566 Rev 1), KDS-EN7/DEC7 (2900-301543 Rev 1), DSP-62-AEC/UC (2900-301432 Rev 2), SWT3-21-H/41-H (2900-301680 Rev 6), VS-88UT (2900-300582 Rev 7)"
    author: Kramer Electronics Ltd.
    url: https://www.kramerav.com/downloads
    note: >
      Manufacturer documents, read for the values each product gives the
      guide's commands (quirks): VID-RES indices 200-233 on the VP-440X,
      VP-551X and VP-427X2 and 0-40 on the MV-4X; IMAGE-PROP as window and
      aspect on the MV-4X and 7 follow input on the scalers; SCLR-AS 3
      immediate on the VP-427X2 and swapped on the MV-4X; 0-based AUD-LVL,
      AUD-EMB and MIC-GAIN channels on the presentation switchers; MIC-GAIN
      with a third parameter on the VP-551X; the per-input EDID-AUDIO form on
      the VS-88UT, DSP-62 and AFM-20DSP.

  - title: "KDS-EN7 / KDS-DEC7 User Manual, P/N 2900-301543 Rev 9 (PDF of 2026-06-01)"
    author: Kramer Electronics Ltd.
    url: https://cdn.kramerav.com/web/downloads/manuals/kramer1-kds-en7__kds-dec7_um_rev_9.pdf
    note: >
      Manufacturer document; the kds-en7 and kds-dec7 models and their commands. Protocol 3000 table printed
      pp.86-103 (KDS-CHANNEL-SELECT, KDS-DEFINE-CHANNEL, KDS-METHOD, KDS-MULTICAST, KDS-MULTICAST-PREFIX,
      KDS-RATIO?, KDS-RESOL?, KDS-VLAN-TAG, NET-SRV-802-1Q, NET-SRV-DSCP, VIEW-MOD 15 and 16,
      VIDEO-WALL-SETUP, KDS-VW-BEZEL, KDS-VW-PATTERN, WND-STRETCH, KDS-OSD-DISPLAY, KDS-DAISY-CHAIN,
      KDS-SLEEP-IMAGE, HDCP-OUT, CS-CONVERT, NAME with an interface), each marked for the encoder, the
      decoder or both; default ports TCP 5000 and UDP 50000; the LOGIN admin user and SECUR.
  - title: "DSP-62-AEC, DSP-62-UC User Manual, P/N 2900-301432 Rev 3 (PDF of 2026-09-10)"
    author: Kramer Electronics Ltd.
    url: https://cdn.kramerav.com/web/downloads/manuals/kramer_dsp-62-aec_and_eu_um_rev_3_compressed.pdf
    note: >
      Manufacturer document; the dsp-62-aec and dsp-62-uc models. Protocol 3000 table printed pp.59-83:
      DSP-AEC, DSP-COMP, DSP-DELAY, DSP-EQ, DSP-EXP, DSP-HPF, DSP-INVERT, DSP-LIMITER, DSP-METER?,
      DSP-POST, DSP-SIGGEN, X-MIX-LVL, X-MIX-MUTE, X-AUD-MODE, X-MIC-TYPE, X-LINK-GROUP, X-PATTERN, X-PRST-RCL
      and X-PRST-STO with their field ids, signal IDs and ranges; AV-SW-MODE on the DSP-62-UC only.
  - title: "MV-4X User Manual, P/N 2900-301566 Rev 5 (PDF of 2026-08-03)"
    author: Kramer Electronics Ltd.
    url: https://cdn.kramerav.com/web/downloads/manuals/mv-4x_um_rev_5.pdf
    note: >
      Manufacturer document; the mv-4x model. Protocol 3000 table printed pp.60-70: ROTATE, RSTWIN,
      W-P-DEFAULT, W-SHARP-H, W-SHARP-V, the three-value HDCP-MOD and the standard multiviewer, window,
      routing, audio, EDID, network and scaler commands it shares with the guide.
transport:
  type: line-tcp
  port: 5000
  framing: terminated
  terminator: cr
  encoding: ascii
  timeout_ms: 2000
  reply: expected
  # Every device message starts with "~" (p.1-2); anything else (such as the
  # body lines of a multi-line HELP reply) is never a command's reply.
  reply_match: "^~"
  # Protocol handshaking, mandatory on every device (p.9): "#" CR, answered
  # "~nn@ OK".
  probe: "#"

ports:
  - { port: 5000, protocol: tcp, role: control }

