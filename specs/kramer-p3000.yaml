      From the KDS-EN7 / KDS-DEC7 user manual (Rev 9), commands marked for the decoder or for both: channel
      selection, the video wall and the decoder's output settings.
  - id: dsp-62-aec
    name: Kramer DSP-62-AEC audio DSP matrix
    supports:
      [handshake, get_model, get_version, get_serial, get_protocol_version, get_build_date, get_name,
      set_name, reset_name, reset, factory_reset, copy_edid, get_display, set_edid_audio, get_edid_audio,
      set_edid_color_space, get_edid_color_space, set_hdcp_mode, get_hdcp_mode, get_hdcp_status_input,
      get_hdcp_status_output, get_signal, set_gpio_config, get_gpio_config, set_net_config, get_net_config,
