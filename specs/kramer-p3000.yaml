      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
      value: { type: string, pattern: '^-?[0-9]+(\.[0-9]+)?$', max_length: 8, required: true, label: Value, description: "The value: level -100 to 15 dB, mute 0 or 1. Inputs." }
    send: "#DSP-POST {field},{signal},{value}"
    expect: { matches: '^~\d+@DSP-POST\s', not_contains: "ERR" }
    returns: ack

  get_dsp_post:
    summary: "Get one post fader setting of an audio signal (DSP-POST?)"
    params:
      field: { type: enum, values: [level, mute], required: true, label: Field, description: "The post fader setting to read." }
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
    send: "#DSP-POST? {field},{signal}"
    expect: { matches: '^~\d+@#?DSP-POST\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  set_dsp_eq:
    summary: "Set one parametric EQ band setting of an audio signal (DSP-EQ, DSP-62)"
    params:
      field: { type: enum, values: [level, freq, qfactor, band-bypass], required: true, label: Field, description: "The band setting to change." }
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
      band: { type: int, min: 0, max: 8, required: true, label: Band, description: "The EQ band: 1 to 4 on an input, 1 to 8 on an output; 0 with band-bypass for the whole EQ." }
      value: { type: string, pattern: '^-?[0-9]+(\.[0-9]+)?$', max_length: 8, required: true, label: Value, description: "The value: level -24 to 24 dB, freq 20 to 20000 Hz, qfactor 0.05 to 4 octaves, band-bypass 0 or 1." }
    send: "#DSP-EQ {field},{signal},{band},{value}"
    expect: { matches: '^~\d+@DSP-EQ\s', not_contains: "ERR" }
    returns: ack

  get_dsp_eq:
    summary: "Get one parametric EQ band setting of an audio signal (DSP-EQ?)"
    params:
      field: { type: enum, values: [level, freq, qfactor, band-bypass], required: true, label: Field, description: "The band setting to read." }
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
      band: { type: int, min: 0, max: 8, required: true, label: Band, description: "The EQ band: 1 to 4 on an input, 1 to 8 on an output; 0 with band-bypass for the whole EQ." }
    send: "#DSP-EQ? {field},{signal},{band}"
    expect: { matches: '^~\d+@#?DSP-EQ\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  set_dsp_invert:
    summary: "Invert an input's phase or not (DSP-INVERT, DSP-62)"
    params:
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
      inverted: { type: bool, required: true, label: Invert, description: "True inverts the signal's phase and false leaves it as it is." }
    send: "#DSP-INVERT {signal},{inverted:bool01}"
    expect: { matches: '^~\d+@DSP-INVERT\s', not_contains: "ERR" }
    returns: ack

  get_dsp_invert:
    summary: "Get whether an input's phase is inverted (DSP-INVERT?)"
    params:
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
    send: "#DSP-INVERT? {signal}"
    expect: { matches: '^~\d+@#?DSP-INVERT\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  set_signal_generator:
    summary: "Set one signal generator setting (DSP-SIGGEN, DSP-62)"
    params:
      field: { type: enum, values: [mode, tone-freq, tone-lvl, pink-lvl, bypass], required: true, label: Field, description: "The generator setting to change." }
      value: { type: string, pattern: '^-?[0-9]+(\.[0-9]+)?$', max_length: 8, required: true, label: Value, description: "The value: mode 1 tone or 2 pink noise, tone-freq 20 to 20000 Hz, tone-lvl and pink-lvl -100 to 15 dB, bypass 0 or 1." }
    send: "#DSP-SIGGEN {field},IN.GENERATOR.1.AUDIO.1,{value}"
    expect: { matches: '^~\d+@DSP-SIGGEN\s', not_contains: "ERR" }
    returns: ack

  get_signal_generator:
    summary: "Get one signal generator setting (DSP-SIGGEN?)"
    params:
      field: { type: enum, values: [mode, tone-freq, tone-lvl, pink-lvl, bypass], required: true, label: Field, description: "The generator setting to read." }
    send: "#DSP-SIGGEN? {field},IN.GENERATOR.1.AUDIO.1"
    expect: { matches: '^~\d+@#?DSP-SIGGEN\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  get_dsp_meter:
    summary: "Read an audio signal's meter in dBFS (DSP-METER?, DSP-62)"
    params:
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
      type: { type: int, min: 1, max: 5, required: true, label: Meter, description: "1 gain, 2 post-gain (outputs), 3 expander (inputs), 4 compressor (inputs), 5 limiter (outputs)." }
    send: "#DSP-METER? {signal},{type}"
    expect: { matches: '^~\d+@#?DSP-METER\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  set_mix_level:
    summary: "Set a mixer cross-point's level, -100 to 24 dB in 0.1 dB steps (X-MIX-LVL, DSP-62)"
    params:
      output_signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Output, description: "The mixer output as OUT.PORT.INDEX.AUDIO.CHANNEL, such as OUT.ANALOG_STEREO.1.AUDIO.1." }
      input_signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Input, description: "The mixer input as IN.PORT.INDEX.AUDIO.CHANNEL, such as IN.USB_B.1.AUDIO.2." }
      level: { type: float, min: -100.0, max: 24.0, required: true, label: Level, description: "The cross-point level in dB, -100 to 24." }
    send: "#X-MIX-LVL {output_signal},{input_signal},{level:.1f}"
    expect: { matches: '^~\d+@X-MIX-LVL\s', not_contains: "ERR" }
    returns: ack

  get_mix_level:
    summary: "Get a mixer cross-point's level (X-MIX-LVL?)"
    params:
      output_signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Output, description: "The mixer output as OUT.PORT.INDEX.AUDIO.CHANNEL, such as OUT.ANALOG_STEREO.1.AUDIO.1." }
      input_signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Input, description: "The mixer input as IN.PORT.INDEX.AUDIO.CHANNEL, such as IN.USB_B.1.AUDIO.2." }
    send: "#X-MIX-LVL? {output_signal},{input_signal}"
    expect: { matches: '^~\d+@#?X-MIX-LVL\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  set_mix_mute:
    summary: "Mute or unmute a mixer cross-point (X-MIX-MUTE, DSP-62)"
    params:
      output_signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Output, description: "The mixer output as OUT.PORT.INDEX.AUDIO.CHANNEL, such as OUT.ANALOG_STEREO.1.AUDIO.1." }
      input_signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Input, description: "The mixer input as IN.PORT.INDEX.AUDIO.CHANNEL, such as IN.USB_B.1.AUDIO.2." }
      muted: { type: bool, required: true, label: Mute, description: "True mutes the cross-point and false unmutes it." }
    send: "#X-MIX-MUTE {output_signal},{input_signal},{muted:bool01}"
    expect: { matches: '^~\d+@X-MIX-MUTE\s', not_contains: "ERR" }
    returns: ack

  get_mix_mute:
    summary: "Get whether a mixer cross-point is muted (X-MIX-MUTE?)"
    params:
      output_signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Output, description: "The mixer output as OUT.PORT.INDEX.AUDIO.CHANNEL, such as OUT.ANALOG_STEREO.1.AUDIO.1." }
      input_signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Input, description: "The mixer input as IN.PORT.INDEX.AUDIO.CHANNEL, such as IN.USB_B.1.AUDIO.2." }
    send: "#X-MIX-MUTE? {output_signal},{input_signal}"
    expect: { matches: '^~\d+@#?X-MIX-MUTE\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  set_audio_input_mode:
    summary: "Set an analog input to line or microphone level (X-AUD-MODE, DSP-62)"
    params:
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
      mode: { type: int, min: 1, max: 2, required: true, label: Mode, description: "1 line level, 2 microphone level." }
    send: "#X-AUD-MODE {signal},{mode}"
    expect: { matches: '^~\d+@X-AUD-MODE\s', not_contains: "ERR" }
    returns: ack

  get_audio_input_mode:
    summary: "Get an analog input's line or microphone mode (X-AUD-MODE?)"
    params:
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
    send: "#X-AUD-MODE? {signal}"
    expect: { matches: '^~\d+@#?X-AUD-MODE\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  set_mic_type:
    summary: "Set a microphone input's type (X-MIC-TYPE, DSP-62)"
    params:
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
      type: { type: enum, values: [dynamic, condenser], required: true, label: Microphone type, description: "dynamic, or condenser to feed it phantom power." }
    send: "#X-MIC-TYPE {signal},{type}"
    expect: { matches: '^~\d+@X-MIC-TYPE\s', not_contains: "ERR" }
    returns: ack

  get_mic_type:
    summary: "Get a microphone input's type (X-MIC-TYPE?)"
    params:
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
    send: "#X-MIC-TYPE? {signal}"
    expect: { matches: '^~\d+@#?X-MIC-TYPE\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  set_link_group:
    summary: "Link or unlink a pair of analog inputs (X-LINK-GROUP, DSP-62)"
    params:
      group: { type: int, min: 1, max: 2, required: true, label: Link group, description: "1 links inputs 2 and 3, 2 links inputs 4 and 5 as stereo pairs." }
      linked: { type: bool, required: true, label: Linked, description: "True links the pair so that it is set together and false unlinks it." }
    send: "#X-LINK-GROUP {group},{linked:on_off}"
    expect: { matches: '^~\d+@X-LINK-GROUP\s', not_contains: "ERR" }
    returns: ack

  get_link_group:
    summary: "Get whether a pair of analog inputs is linked (X-LINK-GROUP?)"
    params:
      group: { type: int, min: 1, max: 2, required: true, label: Link group, description: "1 links inputs 2 and 3, 2 links inputs 4 and 5 as stereo pairs." }
    send: "#X-LINK-GROUP? {group}"
    expect: { matches: '^~\d+@#?X-LINK-GROUP\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  set_signal_pattern:
    summary: "Show a test pattern on the HDMI output: 0 none, 1 colour bars, 2 blue, 3 green, 4 red (X-PATTERN, DSP-62)"
    params:
      pattern: { type: int, min: 0, max: 4, required: true, label: Pattern, description: "0 none, 1 colour bars, 2 blue, 3 green, 4 red." }
    send: "#X-PATTERN OUT.HDMI.1.VIDEO.1,{pattern}"
    expect: { matches: '^~\d+@X-PATTERN\s', not_contains: "ERR" }
    returns: ack

  get_signal_pattern:
    summary: "Get the test pattern on the HDMI output (X-PATTERN?)"
    send: "#X-PATTERN? OUT.HDMI.1.VIDEO.1"
    expect: { matches: '^~\d+@#?X-PATTERN\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  recall_config_preset:
    summary: "Recall a configuration or mixer preset (X-PRST-RCL, DSP-62)"
    params:
      type: { type: enum, values: [IOCONFIG.SYSTEM, IOCONFIG.SYSTEM.MIXER], required: true, label: Preset type, description: "IOCONFIG.SYSTEM for the whole configuration, IOCONFIG.SYSTEM.MIXER for the mixer alone." }
      preset: { type: int, min: 1, max: 10, required: true, label: Preset, description: "The preset bank, 1 to 10; bank 1 is the read-only factory preset." }
    send: "#X-PRST-RCL {type},{preset}"
    expect: { matches: '^~\d+@X-PRST-RCL\s', not_contains: "ERR" }
    returns: ack

  store_config_preset:
    summary: "Store the current configuration or mixer as a preset (X-PRST-STO, DSP-62; bank 1 is read-only)"
    params:
      type: { type: enum, values: [IOCONFIG.SYSTEM, IOCONFIG.SYSTEM.MIXER], required: true, label: Preset type, description: "IOCONFIG.SYSTEM for the whole configuration, IOCONFIG.SYSTEM.MIXER for the mixer alone." }
      preset: { type: int, min: 1, max: 10, required: true, label: Preset, description: "The preset bank, 1 to 10; bank 1 is the read-only factory preset." }
    send: "#X-PRST-STO {type},{preset}"
    expect: { matches: '^~\d+@X-PRST-STO\s', not_contains: "ERR" }
    returns: ack

state:
  device.model:            { type: string, description: "Model name (MODEL?)" }
  device.firmware:         { type: string, description: "Firmware version, major.minor.build (VERSION?)" }
  device.serial:           { type: string, description: "Serial number (SN?)" }
  device.protocol_version: { type: string, description: "Protocol 3000 version, XX.XX (PROT-VER?)" }
  device.name:             { type: string, description: "Machine (DNS) name (NAME)" }
  device.inputs:           { type: int, description: "Number of inputs (INFO-IO?)" }
  device.outputs:          { type: int, description: "Number of outputs (INFO-IO?)" }
  device.started:          { type: bool, description: "The device announced \"Protocol Start\" on this connection (sent on start-up)" }
  presets.video_count:     { type: int, description: "Maximum number of video presets (INFO-PRST)" }
  presets.audio_count:     { type: int, description: "Maximum number of audio presets (INFO-PRST)" }
  presets.stored:          { type: string, description: "Stored preset numbers, comma-separated, as the device lists them (PRST-LST?)" }
  presets.last_recalled:   { type: int, description: "Preset last recalled, from any controller or the front panel" }
  presets.last_stored:     { type: int, description: "Preset last stored" }
  presets.*.locked:        { type: bool, description: "The preset is read-only (PRST-LOCK)" }
  audio_follow_video:      { type: bool, description: "Audio follows video (true) or audio breakaway (false) (AFV)" }
  front_panel_locked:      { type: bool, description: "Front panel locked (LOCK-FP)" }
  standby:                 { type: bool, description: "In standby (STANDBY)" }
  power_save:              { type: bool, description: "Power-save mode active (POWER-SAVE)" }
  video.outputs.*.input:   { type: int, description: "Input routed to the output on the video layer; 0 is disconnected" }
  audio.outputs.*.input:   { type: int, description: "Input routed to the output on the audio layer; 0 is disconnected" }
  data.outputs.*.input:    { type: int, description: "Input routed to the output on the data layer; 0 is disconnected" }
  ir.outputs.*.input:      { type: int, description: "Input routed to the output on the IR layer; 0 is disconnected" }
  usb.outputs.*.input:     { type: int, description: "Input routed to the output on the USB layer; 0 is disconnected" }
  outputs.*.auto_switch.*: { type: int, description: "Auto-switch mode by output then layer number: 0 manual, 1 priority, 2 last connected" }
  inputs.*.label:          { type: string, description: "Input label (LABEL)" }
  outputs.*.label:         { type: string, description: "Output label (LABEL)" }
  inputs.*.signal:         { type: bool, description: "A signal is present on the input (SIGNAL, pushed on change)" }
  inputs.*.audio_signal:   { type: bool, description: "An audio signal is present on the input (AUD-SIGNAL, pushed on change)" }
  inputs.*.hdcp:           { type: bool, description: "The input signal is HDCP-encrypted (HDCP-STAT)" }
  inputs.*.hdcp_mode:      { type: int, description: "Input HDCP mode: 0 off, 1 on, 2 follow input, 3 mirror output (HDCP-MOD)" }
  outputs.*.hdcp:          { type: bool, description: "The output's sink uses HDCP (HDCP-STAT)" }
  outputs.*.display:       { type: int, description: "Output hot-plug status: 0 not valid, 1 sink valid, 2 sink and EDID valid (DISPLAY, pushed on change)" }
  outputs.*.video_mute:    { type: bool, description: "Video disabled on the output (VMUTE 1); a blank-picture mute (2) is not assigned" }
  outputs.*.audio_mute:    { type: bool, description: "Audio muted on the output (MUTE)" }
  outputs.*.freeze:        { type: bool, description: "Output picture frozen (VFRZ)" }
