    summary: "Get one expander setting of an audio signal (DSP-EXP?)"
    params:
      field: { type: enum, values: [attack, release, threshold, ratio, bypass], required: true, label: Field, description: "The expander setting to read." }
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
    send: "#DSP-EXP? {field},{signal}"
    expect: { matches: '^~\d+@#?DSP-EXP\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  set_dsp_high_pass:
    summary: "Set one high-pass filter setting of an audio signal (DSP-HPF, DSP-62)"
    params:
      field: { type: enum, values: [freq, bypass], required: true, label: Field, description: "The high-pass filter setting to change." }
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
      value: { type: string, pattern: '^-?[0-9]+(\.[0-9]+)?$', max_length: 8, required: true, label: Value, description: "The value: freq 20 to 20000 Hz, bypass 0 or 1. Inputs IN.ANALOG_AUDIO.2 to 5." }
    send: "#DSP-HPF {field},{signal},{value}"
    expect: { matches: '^~\d+@DSP-HPF\s', not_contains: "ERR" }
    returns: ack

  get_dsp_high_pass:
    summary: "Get one high-pass filter setting of an audio signal (DSP-HPF?)"
    params:
      field: { type: enum, values: [freq, bypass], required: true, label: Field, description: "The high-pass filter setting to read." }
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
    send: "#DSP-HPF? {field},{signal}"
    expect: { matches: '^~\d+@#?DSP-HPF\??\s+(.+?)\s*$', not_contains: "ERR" }
    returns: value

  set_dsp_limiter:
    summary: "Set one limiter setting of an audio signal (DSP-LIMITER, DSP-62)"
    params:
      field: { type: enum, values: [threshold, bypass], required: true, label: Field, description: "The limiter setting to change." }
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
      value: { type: string, pattern: '^-?[0-9]+(\.[0-9]+)?$', max_length: 8, required: true, label: Value, description: "The value: threshold -100 to 0 dB, bypass 0 or 1. Outputs OUT.ANALOG_STEREO.1 and OUT.USB_B.1." }
    send: "#DSP-LIMITER {field},{signal},{value}"
    expect: { matches: '^~\d+@DSP-LIMITER\s', not_contains: "ERR" }
    returns: ack

  get_dsp_limiter:
    summary: "Get one limiter setting of an audio signal (DSP-LIMITER?)"
    params:
      field: { type: enum, values: [threshold, bypass], required: true, label: Field, description: "The limiter setting to read." }
      signal: { type: string, pattern: '^(IN|OUT)\.[A-Z_]+\.[0-9]+\.AUDIO\.[0-9]+$', max_length: 40, required: true, label: Signal, description: "The audio signal as DIRECTION.PORT.INDEX.AUDIO.CHANNEL, such as IN.ANALOG_AUDIO.2.AUDIO.1 or OUT.USB_B.1.AUDIO.2." }
    send: "#DSP-LIMITER? {field},{signal}"
    expect: { matches: '^~\d+@#?DSP-LIMITER\??\s+(.+?)\s*$', not_contains: "ERR" }
