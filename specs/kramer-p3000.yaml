      set_window_saturation, get_window_saturation, set_brightness, get_brightness, set_contrast,
      get_contrast, set_window_enabled, get_window_enabled, set_window_border, get_window_border,
      set_window_position, get_window_position, set_image_mode, get_image_mode, set_auto_sync, get_auto_sync,
      set_osd, get_osd, set_output_resolution, get_output_resolution, get_input_resolution, set_dhcp,
      get_dhcp, set_ip_address, get_ip_address, set_netmask, get_netmask, set_gateway, get_gateway,
      get_mac_address, set_control_port, get_control_port, get_hdcp_status_input, get_hdcp_status_output,
      set_rotation, get_rotation, reset_window, reset_window_parameters, set_window_sharpness_h,
