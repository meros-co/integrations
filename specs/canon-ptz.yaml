state:
  power: { type: string, description: "Power state: idle (on), standby, or switch_idle / switch_standby while changing" }
  name: { type: string, description: "Camera name" }
  model: { type: string, description: "Camera model, as the camera names itself" }
  firmware: { type: string, description: "Firmware version" }
  protocol_version: { type: string, description: "XC protocol version" }
  mac_address: { type: string, description: "MAC address" }
  tally.state: { type: string, description: "Tally lamp state as the camera reports it (on or off), for tally.mode" }
  tally.mode: { type: string, description: "Which tally the reported tally state is (program or preview)" }
  zoom.mode: { type: string, description: "Digital zoom mode: off, dzoom, advanced or mag" }
  zoom.magnification: { type: int, unit: "%", description: "Digital magnification in percent" }
  zoom.position: { type: int, description: "Zoom position, in the camera's units" }
  zoom.soft: { type: string, description: "Soft zoom setting: off, start, stop or both" }
  image_stabilization: { type: string, description: "Image stabilisation: off, or on1 for on" }
  focus.mode: { type: string, description: "Focus mode: auto or manual" }
  focus.speed: { type: int, description: "Manual focus speed: 0 low, 1 medium, 2 high" }
  focus.position: { type: int, description: "Focus position, in the camera's units" }
  focus.detection: { type: string, description: "Face or subject detection AF mode" }
  exposure.shooting: { type: string, description: "Shooting mode: fullauto, manual or scene" }
  exposure.mode: { type: string, description: "Exposure mode: auto, tv, av or manual" }
  exposure.scene: { type: string, description: "Scene mode" }
  exposure.gain_limit: { type: int, unit: "0.1 dB", description: "AE gain limit, tenths of a dB" }
  exposure.brightness: { type: int, description: "AE brightness shift" }
  exposure.photometry: { type: string, description: "AE metering mode" }
  exposure.flicker_reduction: { type: string, description: "AE flicker reduction" }
  shutter.mode: { type: string, description: "Shutter mode: auto or speed" }
  shutter.value: { type: string, description: "Shutter value as the camera reports it" }
  iris.mode: { type: string, description: "Iris mode: auto or manual" }
  iris.value: { type: string, description: "Iris value as the camera reports it (f-number times 100)" }
  gain.mode: { type: string, description: "Gain mode: auto or manual" }
  gain.value: { type: string, description: "Gain value as the camera reports it (tenths of a dB)" }
  nd.filter: { type: string, description: "ND filter value as the camera reports it" }
  nd.mode: { type: string, description: "ND filter mode: assist or fixed" }
  pedestal: { type: int, description: "Pedestal (black level)" }
  sharpness: { type: int, description: "Sharpness" }
  noise_reduction: { type: int, description: "Noise reduction" }
  white_balance.mode: { type: string, description: "White balance mode" }
  white_balance.kelvin: { type: int, unit: "K", description: "Colour temperature" }
  white_balance.r_gain: { type: int, description: "Red gain shift" }
  white_balance.b_gain: { type: int, description: "Blue gain shift" }
  color_bars: { type: bool, description: "Colour bars shown" }
  pan_tilt.status: { type: string, description: "Pan/tilt platform status as the camera reports it" }
  preset.last: { type: int, description: "The preset recalled last" }
  preset.count: { type: int, description: "How many presets the camera has" }

telemetry:
  # info.cgi answers every setting as key:=value lines. Each rule picks one
  # key out of the whole reply ((?m) makes ^ and $ match at each line).
  poll:
    send:
      - { method: GET, path: /-wvhttp-01-/info.cgi }
    every_ms: 2000
  updates:
    - match: "(?m)^f\\.standby:=([a-z_]+)\\r?$"
      state: { "power": "{1}" }
    - match: "(?m)^c\\.1\\.name\\.utf8:=([^\\r\\n]*)\\r?$"
      state: { "name": "{1}" }
    - match: "(?m)^c\\.1\\.type:=([^\\r\\n]+)\\r?$"
      state: { "model": "{1}" }
    - match: "(?m)^s\\.firmware:=([^\\r\\n]+)\\r?$"
      state: { "firmware": "{1}" }
    - match: "(?m)^s\\.protocol:=([^\\r\\n]+)\\r?$"
      state: { "protocol_version": "{1}" }
    - match: "(?m)^s\\.hardware\\.address:=([^\\r\\n]+)\\r?$"
      state: { "mac_address": "{1}" }
    - match: "(?m)^f\\.tally:=(on|off)\\r?$"
      state: { "tally.state": "{1}" }
    - match: "(?m)^f\\.tally\\.mode:=(program|preview)\\r?$"
      state: { "tally.mode": "{1}" }
    - match: "(?m)^c\\.1\\.zoom\\.mode:=([a-z]+)\\r?$"
      state: { "zoom.mode": "{1}" }
    - match: "(?m)^c\\.1\\.zoom\\.mag:=(\\d+)\\r?$"
      state: { "zoom.magnification": "{1}" }
    - match: "(?m)^c\\.1\\.zoom:=(-?\\d+)\\r?$"
      state: { "zoom.position": "{1}" }
    - match: "(?m)^c\\.1\\.zoom\\.accel:=([a-z]+)\\r?$"
      state: { "zoom.soft": "{1}" }
    - match: "(?m)^c\\.1\\.is:=([a-z0-9]+)\\r?$"
      state: { "image_stabilization": "{1}" }
    - match: "(?m)^c\\.1\\.focus:=(auto|manual)\\r?$"
      state: { "focus.mode": "{1}" }
    - match: "(?m)^c\\.1\\.focus\\.speed:=(\\d+)\\r?$"
      state: { "focus.speed": "{1}" }
    - match: "(?m)^c\\.1\\.focus\\.value:=(-?\\d+)\\r?$"
      state: { "focus.position": "{1}" }
    - match: "(?m)^c\\.1\\.focus\\.detect:=([a-z_]+)\\r?$"
      state: { "focus.detection": "{1}" }
    - match: "(?m)^c\\.1\\.shooting:=([a-z]+)\\r?$"
      state: { "exposure.shooting": "{1}" }
    - match: "(?m)^c\\.1\\.exp:=([a-z]+)\\r?$"
      state: { "exposure.mode": "{1}" }
    - match: "(?m)^c\\.1\\.scene:=([a-z]+)\\r?$"
      state: { "exposure.scene": "{1}" }
    - match: "(?m)^c\\.1\\.ae\\.gainlimit\\.max:=(-?\\d+)\\r?$"
      state: { "exposure.gain_limit": "{1}" }
    - match: "(?m)^c\\.1\\.ae\\.brightness:=(-?\\d+)\\r?$"
      state: { "exposure.brightness": "{1}" }
    - match: "(?m)^c\\.1\\.ae\\.photometry:=([a-z]+)\\r?$"
      state: { "exposure.photometry": "{1}" }
    - match: "(?m)^c\\.1\\.ae\\.flickerreduct:=([a-z0-9]+)\\r?$"
      state: { "exposure.flicker_reduction": "{1}" }
    - match: "(?m)^c\\.1\\.me\\.shutter\\.mode:=([a-z]+)\\r?$"
      state: { "shutter.mode": "{1}" }
    - match: "(?m)^c\\.1\\.me\\.shutter:=([^\\r\\n]+)\\r?$"
      state: { "shutter.value": "{1}" }
    - match: "(?m)^c\\.1\\.me\\.diaphragm\\.mode:=([a-z]+)\\r?$"
      state: { "iris.mode": "{1}" }
    - match: "(?m)^c\\.1\\.me\\.diaphragm:=([^\\r\\n]+)\\r?$"
      state: { "iris.value": "{1}" }
    - match: "(?m)^c\\.1\\.me\\.gain\\.mode:=([a-z]+)\\r?$"
      state: { "gain.mode": "{1}" }
    - match: "(?m)^c\\.1\\.me\\.gain:=([^\\r\\n]+)\\r?$"
      state: { "gain.value": "{1}" }
    - match: "(?m)^c\\.1\\.nd\\.filter:=([^\\r\\n]+)\\r?$"
      state: { "nd.filter": "{1}" }
    - match: "(?m)^c\\.1\\.nd\\.mode:=([a-z]+)\\r?$"
      state: { "nd.mode": "{1}" }
    - match: "(?m)^c\\.1\\.blacklevel:=(-?\\d+)\\r?$"
      state: { "pedestal": "{1}" }
    - match: "(?m)^c\\.1\\.ac:=(-?\\d+)\\r?$"
      state: { "sharpness": "{1}" }
    - match: "(?m)^c\\.1\\.nr:=(\\d+)\\r?$"
      state: { "noise_reduction": "{1}" }
    - match: "(?m)^c\\.1\\.wb:=([a-z_]+)\\r?$"
      state: { "white_balance.mode": "{1}" }
    - match: "(?m)^c\\.1\\.wb\\.kelvin:=(\\d+)\\r?$"
      state: { "white_balance.kelvin": "{1}" }
    - match: "(?m)^c\\.1\\.wb\\.shift\\.rgain:=(-?\\d+)\\r?$"
      state: { "white_balance.r_gain": "{1}" }
    - match: "(?m)^c\\.1\\.wb\\.shift\\.bgain:=(-?\\d+)\\r?$"
      state: { "white_balance.b_gain": "{1}" }
    - match: "(?m)^c\\.1\\.colorbar:=(on|off)\\r?$"
      state: { "color_bars": { value: "{1}", map: { "on": true, "off": false } } }
    - match: "(?m)^c\\.1\\.platform\\.status:=([^\\r\\n]+)\\r?$"
      state: { "pan_tilt.status": "{1}" }
    - match: "(?m)^p:=(\\d+)\\r?$"
      state: { "preset.last": "{1}" }
    - match: "(?m)^p\\.count:=(\\d+)\\r?$"
      state: { "preset.count": "{1}" }

quirks:
  - models: [all]
    severity: critical
    text: >
      save_preset and save_preset_selective overwrite the preset at once with the camera's current
      position and settings; the preset that was there cannot be recovered.

  - models: [all]
    severity: warning
    text: >
      Canon's XC Protocol Specifications (BPE-7216) are available only to registered developers
      through Canon's regional developer programmes, and were not used. Apart from control.cgi's
      pan, tilt and zoom and info.cgi, which Canon describes publicly, every path, key, value and
      range here comes from the Bitfocus Companion module (which follows BPE-7216-011), so all of it
      needs checking against a camera.

  - models: [all]
    severity: warning
    text: >
      pan_left, pan_right, tilt_up, tilt_down, pan_tilt, zoom_tele, zoom_wide, focus_near and
      focus_far start a movement that lasts until the matching stop command. A stop that is lost
      or refused leaves the camera moving; send pan_tilt_stop, zoom_stop or focus_stop as a
      separate command.

  - models: [all]
    severity: warning
    text: >
      recall_preset (and its time and speed forms), pan_tilt_home, pan_tilt_zoom_to, zoom_to and the
      trace commands move the camera on air. pan_tilt_initialize drives the head through its whole
      range to recalibrate it.

  - models: [all]
    severity: warning
    text: >
      Value lists differ by model and firmware, and the camera reports each one in info.cgi (for
      example c.1.me.shutter.list, c.1.me.diaphragm.list, c.1.me.gain.min and .max, c.1.nd.filter.list,
      c.1.wb.kelvin.list, c.1.zoom.mag.list, c.1.shooting.list, c.1.exp.list). The ranges here are the
      widest the Companion module offers across models; a value a model does not list is for the
      camera to refuse.

  - models: [all]
    severity: warning
    text: >
      set_exposure_mode applies within manual shooting: the Companion module sends
      c.1.shooting=manual before c.1.exp, so send set_shooting_mode manual first.

  - models: [cr-n100, cr-n300, cr-n350, cr-n400]
    severity: warning
    text: >
      The Companion module sends the iris value to these models as me.diaphragm, without the c.1.
      prefix it uses for every other model and for the iris mode; this spec sends
      c.1.me.diaphragm to every model.

  - models: [all]
    severity: warning
    text: >
      Authentication is HTTP Digest (or Basic) with the camera's user accounts; a camera with guest
      access needs none and the username and password settings can stay empty. A refused
      credential is terminal until the device is opened again, so that repeated failures cannot
      lock the account.

  - models: [all]
    severity: info
    text: >
      info.cgi reports one tally state (f.tally) together with the tally it refers to
      (f.tally.mode), so tally.state and tally.mode describe whichever tally was set last, not
      program and preview separately. Values in state are as the camera writes them (shutter,
      iris, gain and ND as text); the camera's units for pan, tilt, zoom and focus positions are not
      public.

  - models: [all]
    severity: info
    text: >
      Not covered: the Auto Tracking add-on (RA-AT001, a separate licence under /cgi-addon/), the
      ae response setting (its range comes from the camera), live view and recording control, and
      the Cinema EOS C70, C300 Mark III, C400 and C500 Mark II, which Canon lists as XC protocol
      cameras but whose command set is only in the gated specification. The visca spec's canon
      model covers Standard Communication (VISCA over IP) on the CR-N and CR-X cameras.
