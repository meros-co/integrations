spec: 1
id: canon-ptz
name: Canon PTZ and pro video cameras (XC protocol)
vendor: Canon
category: camera

# Canon's XC protocol: HTTP GETs under /-wvhttp-01-/ on the camera's web port.
# control.cgi takes key=value settings and moves (pan, tilt, zoom, focus,
# c.1.<setting>), standby.cgi powers the camera, preset/set stores presets,
# trace/control plays traces, and info.cgi answers every setting as
# key:=value lines, which the poll below reads into state. Canon's
# specification (XC Protocol Specifications, BPE-7216) is available only
# through Canon's developer programmes and was not used: the two public
# Canon answers below give control.cgi and info.cgi, and every other path,
# key and value comes from the MIT-licensed Bitfocus Companion module, which
# follows BPE-7216-011. VISCA over IP on these cameras is the visca spec's
# canon model.

source:
  - title: "How do you control the Pan, Tilt and Zoom? (Canon Developer Community, PTZ & Remote Cameras, 2022-09-28)"
    author: Canon U.S.A.
    url: https://developercommunity.usa.canon.com/s/article/How-do-you-control-the-Pan-Tilt-and-Zoom
    note: >
      Manufacturer answer: GET /-wvhttp-01-/control.cgi?pan=&tilt=&zoom= moves to an absolute
      position, with the ranges read from info.cgi first.
  - title: "How do you retrieve camera settings? (Canon Developer Community, 2022-09-26)"
    author: Canon U.S.A.
    url: https://developercommunity.usa.canon.com/s/article/How-do-you-retrieve-camera-settings
    note: >
      Manufacturer answer: GET /-wvhttp-01-/info.cgi returns the camera settings. "What is the XC
      Protocol?" (2022-05-06) calls it a Canon proprietary RESTful API for Canon video products;
      "Who is eligible to download development tools files" (2026-05-29) says the development tools
      go only to registered developers in each Canon region.
  - title: companion-module-canon-ptz (Bitfocus Companion module, MIT licence)
    author: Joseph Adams and contributors
    url: https://github.com/bitfocus/companion-module-canon-ptz
    note: >
      Read for corroboration and as the only public source for most keys (src/api.js, src/actions.js,
      src/polling.js, src/models.js, src/choices.js, companion/HELP.md); its HELP says model
      capabilities follow BPE-7216-011. From it: the /-wvhttp-01-/ base with Digest (or Basic)
      authentication and guest access (api.js); control.cgi, standby.cgi?cmd=standby|idle,
      preset/set, trace/control?t=&cmd=prepare|start|stop and maintain?cmd=platform_reset (index.js,
      actions.js); each control.cgi key and value used below; info.cgi's key:=value lines and the
      keys read into state (polling.js); per-model features and value lists (models.js,
      choices.js): pan/tilt speeds 10-10000, zoom speed 0-127, focus speed 0-2, shutter as 1/N,
      iris as f-number times 100, gain in tenths of a dB, ND densities times 100, pedestal and
      white balance gains -50 to 50, sharpness -10 to 50, noise reduction 0-12, presets 1-100,
      preset times 2-99 s and speeds 1-100, traces 1-10.

transport:
  type: http
  port: 80
  scheme: http
  # The cameras answer a request from a user without guest access with a
  # Digest challenge (the Companion module's api.js), which the core answers
  # with the username and password settings.
  auth: digest
  timeout_ms: 4000
  probe: { method: GET, path: /-wvhttp-01-/info.cgi }

settings:
  username: { type: string, default: "" }
  password: { type: string, secret: true, default: "" }

