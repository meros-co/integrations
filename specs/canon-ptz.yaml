commands:
  power_on:
    summary: "Wake the camera from standby (standby.cgi cmd=idle)"
    send:
      method: GET
      path: /-wvhttp-01-/standby.cgi
      query:
        cmd: "idle"
    expect: { status: 200 }
    returns: ack

  power_standby:
    summary: "Put the camera into standby (standby.cgi cmd=standby)"
    send:
      method: GET
      path: /-wvhttp-01-/standby.cgi
      query:
        cmd: "standby"
    expect: { status: 200 }
    returns: ack

  set_camera_name:
    summary: "Set the camera name (c.1.name.utf8)"
    params:
      name: { type: string, max_length: 64, required: true }
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        c.1.name.utf8: "{name}"
    expect: { status: 200 }
    returns: ack

  set_tally:
    summary: "Switch the program (red) or preview (green) tally lamp on or off (tally, tally.mode)"
    params:
      mode:  { type: enum, values: [program, preview], required: true }
      state: { type: enum, values: ["on", "off"], default: "on" }
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        tally: "{state}"
        tally.mode: "{mode}"
    expect: { status: 200 }
    returns: ack

  digital_zoom_off:
    summary: "Turn digital zoom, advanced zoom and digital magnification off (c.1.zoom.mode=off)"
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        c.1.zoom.mode: "off"
    expect: { status: 200 }
    returns: ack

  digital_zoom_on:
    summary: "Turn digital zoom on (c.1.zoom.mode=dzoom)"
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        c.1.zoom.mode: "dzoom"
    expect: { status: 200 }
    returns: ack

  advanced_zoom_on:
    summary: "Turn advanced zoom on (c.1.zoom.mode=advanced)"
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        c.1.zoom.mode: "advanced"
    expect: { status: 200 }
    returns: ack

  digital_magnification_on:
    summary: "Turn digital magnification (the digital teleconverter) on (c.1.zoom.mode=mag)"
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        c.1.zoom.mode: "mag"
    expect: { status: 200 }
    returns: ack

  set_digital_magnification:
    summary: "Set the digital magnification in percent, one of the camera's c.1.zoom.mag.list values such as 100, 150, 300 or 600 (c.1.zoom.mag)"
    params:
      percent: { type: int, min: 100, max: 1000, required: true }
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        c.1.zoom.mag: "{percent}"
    expect: { status: 200 }
    returns: ack

  set_image_stabilization:
    summary: "Turn image stabilisation on (on1) or off (c.1.is)"
    params:
      mode: { type: enum, values: [on1, "off"], required: true }
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        c.1.is: "{mode}"
    expect: { status: 200 }
    returns: ack

  set_color_bars:
    summary: "Show or hide colour bars (c.1.colorbar)"
    params:
      state: { type: enum, values: ["on", "off"], required: true }
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        c.1.colorbar: "{state}"
    expect: { status: 200 }
    returns: ack

  pan_left:
    summary: "Start panning left at a speed (pan=left, pan.speed.dir)"
    params:
      speed: { type: int, min: 10, max: 10000, default: 625 }
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        pan: "left"
        pan.speed.dir: "{speed}"
    expect: { status: 200 }
    returns: ack

  pan_right:
    summary: "Start panning right at a speed (pan=right, pan.speed.dir)"
    params:
      speed: { type: int, min: 10, max: 10000, default: 625 }
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        pan: "right"
        pan.speed.dir: "{speed}"
    expect: { status: 200 }
    returns: ack

  tilt_up:
    summary: "Start tilting up at a speed (tilt=up, tilt.speed.dir)"
    params:
      speed: { type: int, min: 10, max: 10000, default: 625 }
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        tilt: "up"
        tilt.speed.dir: "{speed}"
    expect: { status: 200 }
    returns: ack

  tilt_down:
    summary: "Start tilting down at a speed (tilt=down, tilt.speed.dir)"
    params:
      speed: { type: int, min: 10, max: 10000, default: 625 }
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        tilt: "down"
        tilt.speed.dir: "{speed}"
    expect: { status: 200 }
    returns: ack

  pan_tilt:
    summary: "Start panning and tilting together, diagonally, at a speed (pan, tilt, pan.speed.dir, tilt.speed.dir)"
    params:
      pan:   { type: enum, values: [left, right], required: true }
      tilt:  { type: enum, values: [up, down], required: true }
      speed: { type: int, min: 10, max: 10000, default: 625 }
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        pan: "{pan}"
        pan.speed.dir: "{speed}"
        tilt: "{tilt}"
        tilt.speed.dir: "{speed}"
    expect: { status: 200 }
    returns: ack

  pan_tilt_stop:
    summary: "Stop panning and tilting (pan=stop, tilt=stop)"
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        pan: "stop"
        tilt: "stop"
    expect: { status: 200 }
    returns: ack

  pan_stop:
    summary: "Stop panning (pan=stop)"
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        pan: "stop"
    expect: { status: 200 }
    returns: ack

  tilt_stop:
    summary: "Stop tilting (tilt=stop)"
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        tilt: "stop"
    expect: { status: 200 }
    returns: ack

  pan_tilt_home:
    summary: "Move to the home position, pan 0 and tilt 0 (pan=0, tilt=0)"
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        pan: "0"
        tilt: "0"
    expect: { status: 200 }
    returns: ack

  pan_tilt_zoom_to:
    summary: "Move to an absolute pan, tilt and zoom position, in the camera's units; info.cgi gives the ranges (pan, tilt, zoom)"
    params:
      pan:  { type: int, required: true }
      tilt: { type: int, required: true }
      zoom: { type: int, required: true }
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        pan: "{pan}"
        tilt: "{tilt}"
        zoom: "{zoom}"
    expect: { status: 200 }
    returns: ack

  pan_tilt_initialize:
    summary: "Initialise the pan/tilt mechanism, which moves the head through its range (maintain cmd=platform_reset)"
    send:
      method: GET
      path: /-wvhttp-01-/maintain
      query:
        cmd: "platform_reset"
    expect: { status: 200 }
    returns: ack

  zoom_tele:
    summary: "Start zooming in (zoom=tele, zoom.speed.dir)"
    params:
      speed: { type: int, min: 0, max: 127, default: 8 }
    send:
      method: GET
      path: /-wvhttp-01-/control.cgi
      query:
        zoom: "tele"
        zoom.speed.dir: "{speed}"
    expect: { status: 200 }
    returns: ack

  zoom_wide:
    summary: "Start zooming out (zoom=wide, zoom.speed.dir)"
    params:
      speed: { type: int, min: 0, max: 127, default: 8 }
    send:
      method: GET
