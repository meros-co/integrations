quirks:
  - models: [all]
    severity: warning
    text: >
      Remote connections are off by default: turn on Remote Control in
      Streamlabs Desktop's settings and copy the token shown under the QR
      code's details. The API is documented over SockJS (the sample connects
      to http://<host>:59650/api); this spec opens SockJS's raw websocket at
      /api/websocket, which carries the JSON-RPC messages without SockJS's
      framing. The auth request goes first on every connection; an error in
      reply is taken as a refused token, and nothing more is sent until the
      settings change.

  - models: [all]
    severity: info
    text: >
      Replies are matched by their JSON-RPC id, which each command derives
      from what it acts on. An ack means the reply held no error; methods
      that return a promise (scene collections, toggle_streaming) answer at
      once with a subscription, and their outcome shows in the events and
      state. Item commands address an item as the API's
      SceneItem["scene","node","source"] resource, so they take the scene's,
      the node's and the source's IDs, which state gives for every item.

  - models: [all]
    severity: info
    text: >
      Events keep the active scene, items, sources, streaming, recording,
      replay buffer, studio mode and scene collections current; a structural
      event has its list read again. The API has no event for audio levels or
      mutes changed in the mixer, so audio and performance are read every two
      seconds, and every list again every thirty as a safety net. Not used:
      the SelectionService (the editor's selection, whose operations the item
      commands perform directly) and the methods that open windows on the
      streaming computer (showAddSource, showSourceProperties, showShowcase,
      showNotifications). Anything else the API offers is reachable with
      call. In studio mode the API reports one active scene only: the
      TransitionsService (ITransitionsServiceState) gives studioMode alone,
      and the ScenesService activeScene, activeSceneId, makeSceneActive and
      sceneSwitched, with no separate preview (studio) scene and no method to
      read or select one; this is an API limit.

  - models: [all]
    severity: critical
    text: >
      load_scene_collection replaces every scene and source on air at once;
      remove_scene, remove_source, clear_scene and delete_scene_collection
      cannot be undone; toggle_streaming and toggle_recording change state
      whichever way it currently is, so check streaming.status and
      recording.status first.
