spec: 1
id: tascam-da6400
name: TASCAM DA-6400 / DA-6400dp 64-track recorders (TELNET protocol)
vendor: TASCAM
category: recorder

# TEAC's TELNET protocol for the DA-6400 family, on the ETHERNET port's Telnet server (TCP 23, a password
# asked first). Every message is ASCII: the machine ID "0", a two-character command, its data, then LF and
# CR. Transport and preset commands are not acknowledged; sense commands are answered by a return command
# (the command with its top bit set, such as 50 MECHA STATUS SENSE answered by D0); the recorder pushes F6
# CHANGE STATUS when its transport or take changes, F0 and F1 when its error or caution status changes, and
# FF02F6 when the project changes. Functions of its own are the 7F vendor commands (a category and a
# sub-command after 7F), answered by FF. Numbers of takes, projects, marks and channels are sent as four
# digits in the order tens, ones, thousands, hundreds ("2301" is 123).
#
# The RS-422 port of the same recorders speaks the Sony 9-pin protocol: that is the sony-9pin spec's.
source:
  - title: "TASCAM DA-6400/DA-6400dp CONTROL I/O connector TELNET protocol specifications, Ver. 1.00 (April 2016)"
    author: TEAC Corporation
    url: https://tascam.com/wp-content/uploads/downloads/products/tascam/da-6400/telnet_protocol_da6400dp_v100_en.pdf
    note: >
      Manufacturer document (retrieved 2026-10-27), offered for download with a protocol use agreement that
      grants its use for developing compatible devices and software; nothing of it is copied here. Command
      format (ID, two-character command, data, LF CR; ID 0; ILLEGAL F2 for an unsupported command), the
      command and vendor command lists (pp.4-6), the command sequence (no ACK for transport and preset
      commands, return commands for sense commands, CHANGED STATUS pushes, at least 20 ms between
      commands, p.7), each command's data (pp.8-30) and the vendor commands by category (project, mark,
      timecode, recording, media, external control, inputs and outputs, meter, system, take editing,
      pp.31-68). Take numbers to 999 and project numbers to 99 (p.8).
  - title: "TASCAM DA-6400/DA-6400dp Owner's Manual"
    author: TEAC Corporation
    url: https://tascam.com/wp-content/uploads/downloads/products/old/891/e_da-6400dp_om_va.pdf
    note: >
      Manufacturer document. "Remote control (Telnet)" (p.43): port 23, password DA-6400 by default
      (case-sensitive, set on the PASSWORD screen), press Enter after connecting, "Enter Password", "Login
      Successful", two Telnet connections at once. Up to 99 marks per take (p.45). LOCK SETUP's EXTERNAL
      control lock (p.31).
  - title: "TASCAM DA-6400/DA-6400dp Owner's Manual Addendum V3.20 (2026-03-24)"
    author: TEAC Corporation
    url: https://tascam.com/wp-content/uploads/downloads/products/tascam/da-6400/e_da-6400_add_vk.pdf
    note: >
      Manufacturer document. The corrected Telnet NOTE (firmware 1.21): with EXTERNAL control LOCKed a
      Telnet connection is still accepted, but it can neither control the unit nor change its settings;
      STOP and PAUSE from RS-422 or Telnet stop or pause recording whatever the record key lock says.
  - title: "bitfocus/companion-module-tascam-da-6400 (MIT)"
    author: Bitfocus AS and contributors
    url: https://github.com/bitfocus/companion-module-tascam-da-6400
    note: "Corroboration only, not copied: Telnet on port 23 with the password prompt."

transport:
  type: line-tcp
  port: 23
  # Every message ends with LF then CR: the templates end with "\n", and the terminator adds the CR. The
  # recorder's own messages end with the same pair; any CR or LF ends a received line.
  framing: terminated
  terminator: cr
  encoding: utf-8
  timeout_ms: 3000
  reply: expected
  # A reply is a return command, which has its top bit set (8F to FF): an echo of a command sent (00 to
  # 7F) is never taken for one.
  reply_match: "^0[89A-F][0-9A-F]"
  error_match: "^0F2$"
  probe: "00F\n"
  # At least 20 ms between commands (p.7).
  pacing:
    min_interval_ms: 20

settings:
  password: { type: string, secret: true, max_length: 32, default: DA-6400, label: Password,
    description: "The recorder's Telnet password, set on its PASSWORD screen; DA-6400 by default, case-sensitive." }

# Enter first, then the password at "Enter Password". TEAC documents no answer to a wrong password, so a
# wrong one goes unnoticed until commands go unanswered.
on_connect:
  - send: ""
  - after_prompt: "Enter Password"
    send: "{settings.password}"

ports:
  - { port: 23, protocol: tcp, role: control, note: "the Telnet server on the ETHERNET port; two connections at once" }

models:
  - id: da-6400
    name: TASCAM DA-6400
    supports: &all [stop, play, record, record_pause, take_split, pause, search, skip, locate_take, locate_take_then,
      locate_time, locate_time_then, set_clock, get_clock, set_repeat, get_repeat, set_remote_local, get_remote_local,
      set_play_mode, get_play_mode, get_status, get_take_number, get_take_info, get_time, get_take_title, get_totals,
