      delete_nearest_mark, get_mark_number, get_mark_time, get_mark_name, get_mark_count, set_chase, get_chase,
      set_tc_start, get_tc_start, set_tc_user_bits, get_tc_user_bits, restart_timecode, set_tc_generator_mode,
      get_tc_generator_mode, set_tc_frame_type, get_tc_frame_type, set_tc_output, get_tc_output, set_clock_master,
      get_clock_master, set_word_mode, get_word_mode, set_record_function, set_record_function_all,
      get_record_function, set_input_monitor, set_input_monitor_all, get_input_monitor, set_bit_length,
      get_bit_length, set_max_file_size, set_max_file_minutes, get_max_file_size, set_pause_mode, get_pause_mode,
      set_user_word, get_user_word, set_interval_marker_time, get_interval_marker_time, set_audio_over_marker,
      get_audio_over_marker, set_time_interval_marker, get_time_interval_marker, set_sync_unlock_marker,
      get_sync_unlock_marker, set_sample_rate, get_sample_rate, set_file_name_mode, get_file_name_mode,
      get_media_remaining, get_current_media_remaining, format_media, set_aux_key, get_aux_key, set_aux_tally,
      get_aux_tally, set_input_route, get_input_routing, set_output_route, get_output_routing, set_peak_hold,
      get_peak_hold, clear_peaks, set_reference_level, get_reference_level, rename_take, erase_take, copy_take]
    verification: none
  - id: da-6400dp
    name: TASCAM DA-6400dp (dual power supply)
    supports: *all
    verification: none

