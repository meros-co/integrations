  tc_output: { generator: "00", playback: "01" }
  clock_master: { internal: "00", word: "01", video: "02", slot1: "03", slot2: "04" }
  word_mode: { out_terminated: "00", out_unterminated: "01", thru: "11" }
  bit_length: { "16": "16", "24": "24" }
