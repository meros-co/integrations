name: Hardware verification
description: Report how a real device behaved, for an item in VERIFICATION.md or anything else you tested.
title: "[verification] <spec id>: <what you checked>"
labels: ["verification"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Results that confirm the current behaviour are as useful as corrections.
        One issue per device is fine; list several items in it if you checked more than one.
  - type: input
    id: spec
    attributes:
      label: Spec id
      description: The integration, as listed in DEVICES.md.
      placeholder: behringer-x32
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and model
      placeholder: Midas M32R Live
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware or software version
      placeholder: "4.13"
    validations:
      required: true
  - type: textarea
    id: items
    attributes:
      label: Items checked
      description: Paste the item text from VERIFICATION.md, or describe what you tested if it isn't listed.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What the device did
      description: For each item, whether it matched the spec and, if not, what happened instead.
    validations:
      required: true
  - type: textarea
    id: transcript
    attributes:
      label: Bytes sent and received
      description: A terminal session, capture excerpt or log showing exactly what went over the wire. Remove passwords and other secrets.
      render: text
  - type: textarea
    id: setup
    attributes:
      label: How you tested
      description: The tool or delivery used (Rust, C, Node, Python, the HTTP service, or something else), the library version, and any non-default device settings.
