name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The G3/G4 test puts a simulated device on 127.0.0.2, which macOS does
      # not route until the address is added to the loopback interface.
      - if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up

      - run: pip install pyyaml jsonschema
      - run: python tools/validate.py
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Node binding
        working-directory: bindings/node
        run: |
          node scripts/build.mjs --debug
          npm test

      - name: Python binding
        working-directory: bindings/python
        run: |
          python build_dev.py
          python -m unittest discover -s tests

  # The core and the C binding cross-built for phones: Android with the NDK
  # the runner image carries, iOS on macOS with Xcode. Once with only the
  # integrations a tally consumer needs, and once with all of them.
  mobile:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi, aarch64-apple-ios]
        integrations: [tally, all]
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: armv7-linux-androideabi
            os: ubuntu-latest
          - target: aarch64-apple-ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ring compiles C, so the NDK's clang is the C compiler as well as the
      # linker. API level 24: the core uses getifaddrs, which Android has
      # from 24.
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
            echo "CC_armv7_linux_androideabi=$bin/armv7a-linux-androideabi24-clang"
            echo "AR_armv7_linux_androideabi=$bin/llvm-ar"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$bin/armv7a-linux-androideabi24-clang"
          } >> "$GITHUB_ENV"

      - name: Build the core and the C binding
        shell: bash
        run: |
          if [ "${{ matrix.integrations }}" = all ]; then
            features=meros-integrations/all
          else
            features=meros-integrations/blackmagic-atem,meros-integrations/vmix,meros-integrations/obs-studio,meros-integrations/newtek-tricaster,meros-integrations/rosstalk,meros-integrations/tsl-umd-listener,meros-integrations/omt,meros-integrations/omt-discovery
          fi
          cargo build --target ${{ matrix.target }} -p meros-integrations -p meros-integrations-c             --no-default-features --features "$features"
