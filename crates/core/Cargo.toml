[package]
name = "meros-integrations"
version = "0.1.0"
description = "One implementation of third-party device control and telemetry, shared by every consumer."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "meros_integrations"

# Integrations. Every spec in specs/ is one integration, built in by the
# feature named after its spec id: it embeds that spec and compiles that
# integration's native module, discovery protocol and dependencies, nothing
# else. A consumer names exactly the integrations it uses:
#   meros-integrations = { ..., features = ["sennheiser-ew-dx", "shure-wireless"] }
# A vendor group (`vendor-sennheiser`) enables every integration of one vendor,
# and `all` enables every integration; both are conveniences, never required.
# The default is no integration, so nothing is built in that was not named.
# build.rs holds the same table and fails the build for a spec not in it.
[features]
default = []
all = [
    "vendor-aes70",
    "vendor-aja",
    "vendor-allenheath",
    "vendor-analogway",
    "vendor-barco",
    "vendor-behringer",
    "vendor-birddog",
    "vendor-blackmagic",
    "vendor-brompton",
    "vendor-chamsys",
    "vendor-christie",
    "vendor-etc",
    "vendor-figure53",
    "vendor-generic",
    "vendor-h2r",
    "vendor-kramer",
    "vendor-lawo",
    "vendor-ma-lighting",
    "vendor-megapixel",
    "vendor-newtek",
    "vendor-novastar",
    "vendor-obs",
    "vendor-panasonic",
    "vendor-pjlink",
    "vendor-ptzoptics",
    "vendor-qsc",
    "vendor-renewedvision",
    "vendor-resolume",
    "vendor-roland",
    "vendor-ross",
    "vendor-sennheiser",
    "vendor-shure",
    "vendor-sony",
    "vendor-studiocoast",
    "vendor-tsl",
    "vendor-yamaha",
]

# Vendor groups: every integration of one vendor.
vendor-aes70 = ["aes70"]
vendor-aja = ["aja-kipro", "aja-kumo"]
vendor-allenheath = ["allenheath-ahm", "allenheath-cq", "allenheath-dlive", "allenheath-qu", "allenheath-sq"]
vendor-analogway = ["analogway-alta4k", "analogway-livecore", "analogway-livepremier", "analogway-midra", "analogway-midra4k", "analogway-picturall"]
vendor-barco = ["barco-eventmaster"]
vendor-behringer = ["behringer-wing", "behringer-x32", "behringer-xair"]
vendor-birddog = ["birddog"]
vendor-blackmagic = ["blackmagic-atem", "blackmagic-camera", "blackmagic-hyperdeck", "blackmagic-streaming", "blackmagic-videohub"]
vendor-brompton = ["brompton-tessera"]
vendor-chamsys = ["chamsys-magicq", "chamsys-magicq-udp"]
vendor-christie = ["christie-spyder"]
vendor-etc = ["etc-eos"]
vendor-figure53 = ["qlab"]
vendor-generic = ["generic-http", "generic-osc", "generic-tcp-udp", "http-snapshot"]
vendor-h2r = ["h2r-graphics"]
vendor-kramer = ["kramer-p3000"]
vendor-lawo = ["emberplus"]
vendor-ma-lighting = ["grandma2", "grandma3"]
vendor-megapixel = ["megapixel-helios"]
vendor-newtek = ["newtek-tricaster"]
vendor-novastar = ["novastar-coex"]
vendor-obs = ["obs-studio"]
vendor-panasonic = ["panasonic-ptz"]
vendor-pjlink = ["pjlink"]
vendor-ptzoptics = ["ptzoptics"]
vendor-qsc = ["qsys"]
vendor-renewedvision = ["propresenter", "renewedvision-pvp"]
vendor-resolume = ["resolume"]
vendor-roland = ["roland-p20hd", "roland-v160hd", "roland-v600uhd", "roland-v60hd", "roland-vr400uhd", "roland-xs42h", "roland-xs62s", "roland-xs80h"]
vendor-ross = ["ross-xpression", "ross-xpression-udp", "rosstalk"]
vendor-sennheiser = ["sennheiser-digital-6000", "sennheiser-ew-dx", "sennheiser-ew-g3-g4"]
vendor-shure = ["shure-wireless"]
vendor-sony = ["sony-camera", "visca"]
vendor-studiocoast = ["vmix"]
vendor-tsl = ["tsl-umd-display", "tsl-umd-listener"]
vendor-yamaha = ["yamaha-cl-ql", "yamaha-dm3", "yamaha-dm7", "yamaha-dme7", "yamaha-rivage", "yamaha-rm", "yamaha-tf"]

# One feature per integration (spec id).
# AES70 / OCA devices (OCP.1) (native)
aes70 = []
# AJA Ki Pro recorders (with a native extension)
aja-kipro = []
# AJA KUMO SDI routers and control panels (with a native extension)
aja-kumo = []
# Allen & Heath AHM (native)
allenheath-ahm = []
# Allen & Heath CQ (CQ-12T, CQ-18T, CQ-20B) (native)
allenheath-cq = []
# Allen & Heath dLive and Avantis (native)
allenheath-dlive = []
# Allen & Heath Qu (Qu-16, Qu-24, Qu-32, Qu-Pac, Qu-SB) (native)
allenheath-qu = []
# Allen & Heath SQ, SQ+ and Qu-5/6/7 (native)
allenheath-sq = []
# Analog Way Alta 4K (AWJ) (native)
analogway-alta4k = []
# Analog Way LiveCore series (TPP)
analogway-livecore = []
# Analog Way LivePremier / Aquilon (AWJ) (native)
analogway-livepremier = []
# Analog Way Midra series (TPP)
analogway-midra = []
# Analog Way Midra 4K (AWJ) (native)
analogway-midra4k = []
# Analog Way Picturall media servers
analogway-picturall = []
# Barco Event Master (JSON-RPC API)
barco-eventmaster = []
# Behringer WING
behringer-wing = []
# Behringer X32 / Midas M32
behringer-x32 = []
# Behringer X AIR / Midas M AIR
behringer-xair = []
# BirdDog cameras (RESTful API)
birddog = []
# Blackmagic ATEM switchers (native)
blackmagic-atem = []
# Blackmagic cameras (Camera Control REST API)
blackmagic-camera = []
# Blackmagic HyperDeck
blackmagic-hyperdeck = []
# Blackmagic Web Presenter / Streaming Encoder
blackmagic-streaming = []
# Blackmagic Videohub
blackmagic-videohub = []
# Brompton Tessera LED processors (IP Control API)
brompton-tessera = []
# ChamSys MagicQ / QuickQ
chamsys-magicq = []
# ChamSys MagicQ / QuickQ Remote Ethernet Protocol
chamsys-magicq-udp = []
# Christie Spyder X20 / X80 (external control protocol)
christie-spyder = []
# Ember+ provider (generic consumer) (native)
emberplus = []
# ETC Eos family
etc-eos = []
# Generic HTTP device (native)
generic-http = []
# Generic OSC device (native)
generic-osc = []
# Generic TCP or UDP device (native)
generic-tcp-udp = []
# MA Lighting grandMA2
grandma2 = []
# MA Lighting grandMA3
grandma3 = []
# H2R Graphics (HTTP API)
h2r-graphics = []
# Camera snapshot over HTTP (live preview from a JPEG URL) (native)
http-snapshot = []
# Kramer Protocol 3000 matrices and switchers
kramer-p3000 = []
# Megapixel HELIOS LED processing platform (Public API)
megapixel-helios = []
# NewTek / Vizrt TriCaster
newtek-tricaster = []
# NovaStar COEX controllers (OpenAPI)
novastar-coex = []
# OBS Studio (obs-websocket 5) (native)
obs-studio = []
# Panasonic AW-series PTZ cameras (with a native extension)
panasonic-ptz = []
# PJLink projectors and displays (Class 1 and Class 2) (native)
pjlink = [] # also PJLink discovery
# ProPresenter 7 (ProPresenter API)
propresenter = []
# PTZOptics cameras
ptzoptics = []
# Figure 53 QLab
qlab = []
# QSC Q-SYS Core (Q-SYS Remote Control, QRC) (native)
qsys = []
# ProVideoPlayer 3 (PVP3 HTTP API)
renewedvision-pvp = []
# Resolume Arena / Avenue (REST API)
resolume = []
# Roland P-20HD (LAN control)
roland-p20hd = []
# Roland V-160HD / V-80HD / VR-120HD / VR-6HD / V-1-4K (LAN control)
roland-v160hd = []
# Roland V-600UHD (LAN control)
roland-v600uhd = []
# Roland V-60HD (LAN control)
roland-v60hd = []
# Roland VR-400UHD (LAN control)
roland-vr400uhd = []
# Roland XS-42H / VP-42H (LAN control)
roland-xs42h = []
# Roland XS-62S (LAN control)
roland-xs62s = []
# Roland XS-82H / XS-83H / XS-84H (LAN control)
roland-xs80h = []
# Ross XPression (RossTalk)
ross-xpression = []
# Ross XPression (RossTalk over UDP)
ross-xpression-udp = []
# Ross Video production switchers (RossTalk)
rosstalk = []
# Sennheiser Digital 6000 receivers (SSC) (native)
sennheiser-digital-6000 = []
# Sennheiser Evolution Wireless Digital EW-DX receivers (SSCv2) (native)
sennheiser-ew-dx = []
# Sennheiser evolution wireless G3 / G4 (Media Control Protocol) (native)
sennheiser-ew-g3-g4 = [] # also MCP discovery
# Shure networked wireless (command strings) (native)
shure-wireless = []
# Sony cameras over Camera Control PTP 3 and PTP 2 (Alpha, FX, ZV, cinema line, pan/tilt) (native)
sony-camera = ["dep:russh"] # also SSDP discovery and the SSH tunnel (russh)
# TSL UMD tally sent to displays and multiviewers (native)
tsl-umd-display = []
# TSL UMD tally received from a switcher (native)
tsl-umd-listener = []
# VISCA PTZ cameras (Sony VISCA over IP, and VISCA over TCP/UDP) (native)
visca = []
# vMix (native)
vmix = []
# Yamaha CL and QL series digital mixing consoles (Remote Control Protocol, TCP 49280)
yamaha-cl-ql = []
# Yamaha DM3 series digital mixing consoles (Remote Control Protocol, TCP 49280)
yamaha-dm3 = []
# Yamaha DM7 series digital mixing consoles (Remote Control Protocol, TCP 49280)
yamaha-dm7 = []
# Yamaha DME7 digital signal processor
yamaha-dme7 = []
# Yamaha RIVAGE PM series digital mixing systems (Remote Control Protocol, TCP 49280)
yamaha-rivage = []
# Yamaha RM series (RM-CR, RM-CG, RM-TT, RM-WAP)
yamaha-rm = []
# Yamaha TF series digital mixing consoles (Remote Control Protocol, TCP 49280)
yamaha-tf = []

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
if-addrs = "0.15.0"
md-5 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
roxmltree = "0.21.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Only Sony cameras tunnel over SSH; see the `sony-camera` feature.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10.9"
socket2 = "0.5"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "test-util"] }
