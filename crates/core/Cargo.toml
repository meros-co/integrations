[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
if-addrs = "0.15.0"
md-5 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
roxmltree = "0.21.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Only Sony cameras tunnel over SSH; see the `sony-camera` feature.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10.9"
socket2 = "0.5"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "test-util"] }
