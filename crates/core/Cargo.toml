vendor-symetrix = ["symetrix-composer", "symetrix-jupiter"]
vendor-tsl = ["tsl-umd-display", "tsl-umd-listener"]
vendor-tvone = ["tvone-coriomaster"]
vendor-yamaha = ["yamaha-cl-ql", "yamaha-dm3", "yamaha-dm7", "yamaha-dme7", "yamaha-rivage", "yamaha-rm", "yamaha-tf"]

