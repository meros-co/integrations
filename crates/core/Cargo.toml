[package]
name = "meros-integrations"
version = "0.1.0"
description = "One implementation of third-party device control and telemetry, shared by every consumer."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "meros_integrations"

# Device families. Each embeds its specs and compiles its native modules;
# the spec engine, transports and catalogue are always built. The default is
# every family. A product that needs only some depends with
#   meros-integrations = { ..., default-features = false, features = ["sennheiser", "shure"] }
# and gets a smaller binary whose catalogue holds only those families. Which
# spec belongs to which family is listed in build.rs.
[features]
default = ["all"]
all = [
    "aja",
    "allenheath",
    "analogway",
    "barco",
    "behringer",
    "birddog",
    "blackmagic",
    "chamsys",
    "emberplus",
    "etc",
    "generic",
    "h2r",
    "kramer",
    "ma-lighting",
    "newtek",
    "obs",
    "panasonic",
    "pjlink",
    "ptzoptics",
    "qlab",
    "qsys",
    "renewedvision",
    "resolume",
    "roland",
    "ross",
    "sennheiser",
    "shure",
    "sony",
    "tsl",
    "visca",
    "vmix",
    "yamaha",
]
# AJA Ki Pro and KUMO (spec-driven, with the native config-event extension)
aja = []
# Allen & Heath dLive/Avantis, AHM, Qu, SQ and CQ (native)
allenheath = []
# Analog Way LivePremier, Midra 4K, Alta 4K (native) and LiveCore, Midra, Picturall
analogway = []
# Barco Event Master
barco = []
# Behringer WING, X32 and X Air
behringer = []
# BirdDog cameras
birddog = []
# Blackmagic ATEM (native), cameras, HyperDeck, Web Presenter / Streaming Encoder, Videohub
blackmagic = []
# ChamSys MagicQ (TCP and UDP)
chamsys = []
# Ember+ (native)
emberplus = []
# ETC Eos
etc = []
# generic HTTP, OSC and TCP/UDP devices, and HTTP JPEG snapshots (native)
generic = []
# H2R Graphics
h2r = []
# Kramer Protocol 3000
kramer = []
# MA Lighting grandMA2 and grandMA3
ma-lighting = []
# NewTek TriCaster
newtek = []
# OBS Studio (native)
obs = []
# Panasonic PTZ cameras (spec-driven, with the native update-notification extension)
panasonic = []
# PJLink projectors (native), and PJLink discovery
pjlink = []
# PTZOptics cameras
ptzoptics = []
# QLab
qlab = []
# Q-SYS (native)
qsys = []
# Renewed Vision ProPresenter and ProVideoPlayer
renewedvision = []
# Resolume
resolume = []
# Roland video switchers
roland = []
# Ross switchers (RossTalk) and XPression
ross = []
# Sennheiser EW G3/G4 (MCP), EW-DX and Digital 6000 (native), and MCP discovery
sennheiser = []
# Shure wireless (native)
shure = []
# Sony cameras (native), SSDP discovery, and the SSH tunnel they use (russh)
sony = ["dep:russh"]
# TSL UMD listener and display (native)
tsl = []
# VISCA over IP cameras (native)
visca = []
# vMix (native)
vmix = []
# Yamaha consoles, RM series and DME7
yamaha = []

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
if-addrs = "0.15.0"
md-5 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
roxmltree = "0.21.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Only Sony cameras tunnel over SSH; see the `sony` feature.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10.9"
socket2 = "0.5"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "test-util"] }
