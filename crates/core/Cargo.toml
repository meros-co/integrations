[package]
name = "meros-integrations"
version = "0.1.0"
description = "One implementation of third-party device control and telemetry, shared by every consumer."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "meros_integrations"

# Integrations. Every spec in specs/ is one integration, built in by the
# feature named after its spec id: it embeds that spec and compiles that
# integration's native module, discovery protocol and dependencies, nothing
# else. A consumer names exactly the integrations it uses:
#   meros-integrations = { ..., features = ["sennheiser-ew-dx", "shure-wireless"] }
# A vendor group (`vendor-sennheiser`) enables every integration of one vendor,
# and `all` enables every integration; both are conveniences, never required.
# The default is no integration, so nothing is built in that was not named.
# build.rs holds the same table and fails the build for a spec not in it.
[features]
default = []
all = [
    "vendor-aes70",
    "vendor-aja",
    "vendor-allenheath",
    "vendor-analogway",
    "vendor-anomes",
    "vendor-avstumpfl",
    "vendor-avolites",
    "vendor-barco",
    "vendor-behringer",
    "vendor-biamp",
    "vendor-birddog",
    "vendor-blackmagic",
    "vendor-brompton",
    "vendor-canon",
    "vendor-bss",
    "vendor-chamsys",
    "vendor-christie",
    "vendor-churchapps",
    "vendor-digico",
    "vendor-dataton",
    "vendor-disguise",
    "vendor-etc",
    "vendor-evertz",
    "vendor-extron",
    "vendor-figure53",
    "vendor-generic",
    "vendor-greenhippo",
    "vendor-h2r",
    "vendor-highend",
    "vendor-kramer",
    "vendor-lawo",
    "vendor-lightware",
    "vendor-ma-lighting",
    "vendor-magewell",
    "vendor-megapixel",
    "vendor-newtek",
    "vendor-novastar",
    "vendor-obs",
    "vendor-obsidian",
    "vendor-omt",
    "vendor-panasonic",
    "vendor-pjlink",
    "vendor-probel",
    "vendor-ptzoptics",
    "vendor-qsc",
    "vendor-renewedvision",
    "vendor-resolume",
    "vendor-roland",
    "vendor-ross",
    "vendor-sennheiser",
    "vendor-shure",
    "vendor-sony",
    "vendor-studiocoast",
    "vendor-symetrix",
    "vendor-tsl",
    "vendor-tvone",
    "vendor-yamaha",
]

# Vendor groups: every integration of one vendor.
vendor-aes70 = ["aes70"]
vendor-aja = ["aja-kipro", "aja-kumo"]
vendor-allenheath = ["allenheath-ahm", "allenheath-cq", "allenheath-dlive", "allenheath-qu", "allenheath-sq"]
vendor-analogway = ["analogway-alta4k", "analogway-livecore", "analogway-livepremier", "analogway-midra", "analogway-midra4k", "analogway-picturall"]
vendor-anomes = ["millumin"]
vendor-avstumpfl = ["avstumpfl-pixera"]
vendor-avolites = ["avolites-titan"]
vendor-barco = ["barco-eventmaster"]
vendor-behringer = ["behringer-wing", "behringer-x32", "behringer-xair"]
vendor-biamp = ["biamp-tesira"]
vendor-birddog = ["birddog", "birddog-converters"]
vendor-bss = ["bss-london"]
vendor-brompton = ["brompton-tessera"]
vendor-canon = ["canon-ptz"]
vendor-christie = ["christie-spyder"]
vendor-churchapps = ["freeshow"]
vendor-digico = ["digico-sd"]
vendor-dataton = ["dataton-watchout6", "dataton-watchout7"]
vendor-disguise = ["disguise"]
vendor-blackmagic = ["blackmagic-atem", "blackmagic-camera", "blackmagic-hyperdeck", "blackmagic-multiview", "blackmagic-smartview", "blackmagic-streaming", "blackmagic-teranex", "blackmagic-ultimatte", "blackmagic-videohub"]
vendor-chamsys = ["chamsys-magicq", "chamsys-magicq-udp"]
vendor-etc = ["etc-eos", "etc-paradigm"]
vendor-evertz = ["evertz-quartz"]
vendor-extron = ["extron-matrix", "extron-switcher"]
vendor-figure53 = ["qlab"]
vendor-generic = ["generic-http", "generic-osc", "generic-tcp-udp", "http-snapshot"]
vendor-greenhippo = ["greenhippo-hippotizer"]
vendor-h2r = ["h2r-graphics"]
vendor-highend = ["highend-hog4"]
vendor-kramer = ["kramer-p3000"]
vendor-lawo = ["emberplus"]
vendor-lightware = ["lightware-lw2", "lightware-lw3"]
vendor-ma-lighting = ["grandma2", "grandma3"]
vendor-magewell = ["magewell-proconvert"]
vendor-megapixel = ["megapixel-helios"]
vendor-newtek = ["newtek-tricaster"]
vendor-novastar = ["novastar-central-control", "novastar-coex", "novastar-h"]
vendor-obs = ["obs-studio"]
vendor-obsidian = ["obsidian-onyx", "obsidian-onyx-osc"]
vendor-omt = ["omt", "omt-discovery"]
vendor-panasonic = ["panasonic-ptz"]
vendor-pjlink = ["pjlink"]
vendor-probel = ["probel-swp08"]
vendor-ptzoptics = ["ptzoptics"]
vendor-qsc = ["qsys", "qsys-ecp"]
vendor-renewedvision = ["propresenter", "renewedvision-pvp"]
vendor-resolume = ["resolume"]
vendor-roland = ["roland-p20hd", "roland-v160hd", "roland-v600uhd", "roland-v60hd", "roland-vr400uhd", "roland-xs42h", "roland-xs62s", "roland-xs80h"]
