[dependencies]
# Secure OCP.1 (aes70, and dbaudio and focusrite-rednet, which build on it):
# TLS 1.2 and DTLS 1.2 with TLS_DHE_PSK_WITH_AES_128_CBC_SHA, which rustls does
# not offer, from RustCrypto primitives (src/modules/aes70_tls.rs).
aes = { version = "0.9.3", optional = true }
base64 = "0.22"
cbc = { version = "0.2.1", default-features = false, optional = true }
crypto-bigint = { version = "0.7.5", default-features = false, features = ["alloc", "zeroize"], optional = true }
# SNMPv3 USM's DES privacy (generic-snmp, RFC 3414 §8).
des = { version = "0.9.0", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", optional = true }
# Pure-Rust YAML parser for the specs and vectors; src/yaml.rs maps it onto serde.
granit-parser = { version = "2.0.0", default-features = false, features = ["std", "error_messages"] }
hmac = { version = "0.13.0", features = ["zeroize"], optional = true }
if-addrs = "0.15.0"
md-5 = "0.10"
# DEFLATE: Meros Camera fleet links (meros-camera) and ATEM media pool PNG files
# (blackmagic-atem).
miniz_oxide = { version = "0.8", optional = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
roxmltree = "0.21.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Only Sony cameras tunnel over SSH; see the `sony-camera` feature.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = { version = "0.11.0", default-features = false, features = ["zeroize"], optional = true }
sha2 = "0.10.9"
sha2-tls = { package = "sha2", version = "0.11.0", default-features = false, features = ["zeroize"], optional = true }
# `all` for SO_REUSEPORT, which sharing UDP 5353 with mDNSResponder needs.
socket2 = { version = "0.5", features = ["all"] }
subtle = { version = "2.6.1", optional = true }
# Glyph rasterizing for ATEM multiviewer labels drawn from text (blackmagic-atem).
swash = { version = "0.2.10", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
webpki-roots = "1"
zeroize = { version = "1.9.0", optional = true }

# Serial ports (RS-232, RS-422, USB serial adapters) on desktop systems. Phones
# have no serial port an app can open, so the transport is left out there
# (docs/MOBILE.md).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
serial2-tokio = "0.1.25"

# MIDI ports of the host (USB and other class-compliant MIDI devices) for the
# MIDI integrations: WinMM on Windows, CoreMIDI on macOS and iOS (midir).
# Android's MIDI API is reached only through Java, so the ports are left out
# there (docs/MOBILE.md).
[target.'cfg(not(any(target_os = "android", target_os = "linux")))'.dependencies]
midir = { version = "0.11.1", optional = true }

# ICMP echo without elevated privileges goes through the system's ICMP helper
# API on Windows (src/icmp.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO"] }

# On Linux the ALSA sequencer, whose library (libasound.so.2) is loaded with
# dlopen when a MIDI port is first listed or opened, never linked: building
# needs no ALSA headers, and a host without the library starts and lists no
# MIDI port (crates/core/src/midi_ports/alsa.rs).
[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.177", optional = true }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "test-util"] }
