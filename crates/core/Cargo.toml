[package]
name = "meros-integrations"
version = "0.1.0"
description = "One implementation of third-party device control and telemetry, shared by every consumer."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "meros_integrations"

# Integrations. Every spec in specs/ is one integration, built in by the
# feature named after its spec id: it embeds that spec and compiles that
# integration's native module, discovery protocol and dependencies, nothing
# else. A consumer names exactly the integrations it uses:
#   meros-integrations = { ..., features = ["sennheiser-ew-dx", "shure-wireless"] }
# A vendor group (`vendor-sennheiser`) enables every integration of one vendor,
# and `all` enables every integration; both are conveniences, never required.
# The default is no integration, so nothing is built in that was not named.
# build.rs holds the same table and fails the build for a spec not in it.
[features]
default = []
all = [
