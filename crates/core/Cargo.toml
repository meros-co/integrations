vendor-sennheiser = ["sennheiser-digital-6000", "sennheiser-ew-dx", "sennheiser-ew-g3-g4"]
vendor-shure = ["shure-ani", "shure-imx-room", "shure-mxa", "shure-mxn5", "shure-p300", "shure-wireless"]
