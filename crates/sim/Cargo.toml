[package]
name = "meros-integrations-sim"
version = "0.1.0"
description = "Simulated devices for testing every delivery of the integrations core."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "integrations-sim"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "time"] }
