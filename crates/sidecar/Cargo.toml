[package]
name = "meros-integrations-sidecar"
version = "0.1.0"
description = "The integrations core as a local HTTP service, for hosts that cannot link it."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "meros-integrations"
path = "src/main.rs"

# Which integrations are built in. The default is all of them; a product
# chooses exactly its own with
#   --no-default-features --features meros-integrations/sennheiser-ew-dx,meros-integrations/shure-wireless
# naming spec ids, vendor groups (meros-integrations/vendor-sennheiser) or
# meros-integrations/all. The list is in crates/core/Cargo.toml.
[features]
default = ["all"]
all = ["meros-integrations/all"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
meros-integrations = { path = "../core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "signal"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
