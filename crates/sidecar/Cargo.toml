[package]
name = "meros-integrations-sidecar"
version = "0.1.0"
description = "The integrations core as a local HTTP service, for hosts that cannot link it."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "meros-integrations"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
getrandom = "0.3"
meros-integrations = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "signal"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
