spec: brightsign-dws
command: set_telnet
input:
  enabled: true
expect_request:
  method: PUT
  target: /api/v1/diagnostics/telnet/
  body: '{"enabled":true,"portNumber":23,"reboot":true}'
http_reply:
  status: 200
  body: '{"success":true,"reboot":true}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      reboot: true
