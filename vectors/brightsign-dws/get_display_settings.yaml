    value:
      whiteBalance:
        redBalance: 120
        greenBalance: 121
        blueBalance: 122
      volume: 50
      brightness: 60
      contrast: 45
      idleStandbyTimeout: 600
      powerSetting: 'on'
      videoOutput: HDMI1
      sdConnection: brightsign
      alwaysConnectedEnabled: true
model: display
