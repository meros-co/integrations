spec: brightsign-dws
command: set_display_power
input:
  setting: standby
expect_request:
  method: PUT
  target: /api/v1/display-control/power-settings/
  body: '{"setting":"standby"}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "setting": "standby"}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      setting: standby
model: display
