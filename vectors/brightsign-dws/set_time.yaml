spec: brightsign-dws
command: set_time
input:
  date: '2026-10-27'
  time: '14:30'
expect_request:
  method: PUT
  target: /api/v1/time/
  body: '{"date":"2026-10-27","time":"14:30","applyTimezone":false}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
