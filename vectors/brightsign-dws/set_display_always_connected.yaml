spec: brightsign-dws
command: set_display_always_connected
input:
  enabled: true
expect_request:
  method: PUT
  target: /api/v1/display-control/always-connected/
  body: '{"enable":true}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "enable": true}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      enable: true
model: display
