spec: brightsign-dws
command: set_network_configuration
input:
  interface: eth0
  config:
    dnsServerList:
    - 192.0.2.53
expect_request:
  method: PUT
  target: /api/v1/diagnostics/network-configuration/eth0/
  body: '{"dnsServerList":["192.0.2.53"]}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
