spec: brightsign-dws
command: dns_lookup
input:
  address: example.com
expect_request:
  method: GET
  target: /api/v1/diagnostics/dns-lookup/example.com/
http_reply:
  status: 200
  body: '{"data": {"result": {"records": {"ipv4": ["192.0.2.1"]}}}}'
expect_result:
  ok:
    kind: value
    value:
      records:
        ipv4:
        - 192.0.2.1
