spec: brightsign-dws
command: set_output_mode
input:
  mode: 3840x2160x30p
expect_request:
  method: PUT
  target: /api/v1/video/hdmi/output/0/mode/
  body: '{"modeName":"3840x2160x30p"}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "reboot": true}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      reboot: true
