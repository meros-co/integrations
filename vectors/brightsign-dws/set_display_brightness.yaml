spec: brightsign-dws
command: set_display_brightness
input:
  brightness: 100
expect_request:
  method: PUT
  target: /api/v1/display-control/brightness/
  body: '{"brightness":100}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "brightness": 100}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      brightness: 100
model: display
