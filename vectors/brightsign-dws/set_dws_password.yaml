spec: brightsign-dws
command: set_dws_password
input:
  password: newpassword
  previous: oldpassword
expect_request:
  method: PUT
  target: /api/v1/control/dws-password/
  body: '{"password":"newpassword","previous_password":"oldpassword"}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "reboot": false}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      reboot: false
