spec: brightsign-dws
command: set_local_dws
input:
  enabled: false
expect_request:
  method: PUT
  target: /api/v1/control/local-dws/
  body: '{"enable":false}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "reboot": true}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      reboot: true
