spec: brightsign-dws
telemetry: display-control
inbound_http:
  path: /api/v1/display-control/
  body: '{"data": {"result": {"whiteBalance": {"redBalance": 120, "greenBalance": 121, "blueBalance":
    122}, "volume": 50, "brightness": 60, "contrast": 45, "idleStandbyTimeout": 600, "powerSetting": "on",
    "videoOutput": "HDMI1", "sdConnection": "brightsign", "alwaysConnectedEnabled": true}}}'
expect_state:
  display:
    brightness: 60
    contrast: 45
    volume: 50
    power: 'on'
    standby_timeout_s: 600
    video_output: HDMI1
    sd_connection: brightsign
    always_connected: true
    white_balance:
      red: 120
      green: 121
      blue: 122
model: display
