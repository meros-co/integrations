spec: brightsign-dws
command: set_display_standby_timeout
input:
  seconds: 60
expect_request:
  method: PUT
  target: /api/v1/display-control/standby-timeout/
  body: '{"seconds":60}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "seconds": 60}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      seconds: 60
model: display
