spec: brightsign-dws
command: set_display_contrast
input:
  contrast: 45
expect_request:
  method: PUT
  target: /api/v1/display-control/contrast/
  body: '{"contrast":45}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "contrast": 45}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      contrast: 45
model: display
