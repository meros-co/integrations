spec: brightsign-dws
command: trace_route
input:
  address: 192.0.2.1
  resolve: true
expect_request:
  method: GET
  target: /api/v1/diagnostics/trace-route/192.0.2.1/?resolveAddress=true
http_reply:
  status: 200
  body: '{"data": {"result": {"address": "192.0.2.1"}}}'
expect_result:
  ok:
    kind: value
    value:
      address: 192.0.2.1
