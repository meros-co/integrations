spec: brightsign-dws
command: set_display_volume
input:
  volume: 30
expect_request:
  method: PUT
  target: /api/v1/display-control/volume/
  body: '{"volume":30}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "volume": 30}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      volume: 30
model: display
