spec: brightsign-dws
command: set_display_video_output
input:
  output: HDMI2
expect_request:
  method: PUT
  target: /api/v1/display-control/video-output/
  body: '{"output":"HDMI2"}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "output": "HDMI2"}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      output: HDMI2
model: display
