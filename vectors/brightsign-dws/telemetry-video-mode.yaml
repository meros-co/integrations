spec: brightsign-dws
telemetry: video-mode
inbound_http:
  path: /api/v1/video-mode/
  body: '{"data": {"result": {"isAutoMode": false, "name": "1920x1080x60p", "width": "1920", "height":
    "1080", "frames": "60", "scan": "p", "mode": {"colorDepth": "8bit", "colorSpace": "rgb", "frequency":
    60, "height": 1080, "width": 1920, "modeName": "1920x1080x60p"}}}}'
expect_state:
  video:
    mode: 1920x1080x60p
    width: 1920
    height: 1080
    frame_rate: 60
    auto: false
    color_space: rgb
    color_depth: 8bit
