spec: brightsign-dws
command: set_display_white_balance
input:
  red: 120
  green: 120
  blue: 120
expect_request:
  method: PUT
  target: /api/v1/display-control/white-balance/
  body: '{"redBalance":120,"greenBalance":120,"blueBalance":120}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "redBalance": 120, "greenBalance": 120, "blueBalance":
    120}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      redBalance: 120
      greenBalance: 120
      blueBalance: 120
model: display
