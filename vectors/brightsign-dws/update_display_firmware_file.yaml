spec: brightsign-dws
command: update_display_firmware_file
input:
  path: path/to/firmware.zip
expect_request:
  method: PUT
  target: /api/v1/display-control/firmware/
  body: '{"filepath":"path/to/firmware.zip"}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "reboot": true}}}'
expect_result:
  ok:
    kind: value
    value:
      success: true
      reboot: true
model: display
