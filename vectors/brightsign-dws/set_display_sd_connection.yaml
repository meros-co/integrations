spec: brightsign-dws
command: set_display_sd_connection
input:
  connection: display
expect_request:
  method: PUT
  target: /api/v1/display-control/sd-connection/
  body: '{"connection":"display"}'
http_reply:
  status: 200
  body: '{"data": {"result": {"success": true, "connection": "display"}}}'
expect_result:
