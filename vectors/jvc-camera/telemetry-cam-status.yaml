spec: jvc-camera
telemetry: cam-status
settings:
  username: jvc
  password: pw
inbound_http:
  path: /cgi-bin/api.cgi
  body: '{"Response":{"Requested":"GetCamStatus","Result":"Success","Data":{"Camera":{"Status":"Standby","Mode":"Camera","RecMode":"Normal","TC":"12","AspectRatio":"16:9","WebAccess":"On"},"Iris":{"Status":"Auto","Value":"F2.8","Position":120},"Gain":{"Status":"Alc","Value":"6dB"},"Whb":{"Status":"Faw","Value":"5600K","WhPRScale":64,"WhPBScale":64,"WhPRPosition":32,"WhPBPosition":30,"WhPRValue":"0","WhPBValue":"-2"},"Zoom":{"Dynamic":"Off","DynamicPos":0,"Position":100,"DisplayValue":"Z100"},"Focus":{"Status":"AF","Value":"3.5m"},"Streaming":{"Status":"Stop"},"TallyLamp":{"Priority":"Camera","Lighting":"Off","StudioTally":"Off"},"SlotA":{"Status":"Select","Protect":"Unlock","Remain":"120","ClipNum":50,"RemainWarning":0},"Battery":{"Info":"Time","Level":"8","Value":"80"},"Enable":{"Iris":{"Open1":1,"Close1":0}},"ButtonString":{"User":{"Sw1":"Focus
    Assist"}}}}}'
expect_state:
  camera:
    status: Standby
    mode: Camera
    rec_mode: Normal
    timecode: '12'
    aspect_ratio: '16:9'
    web_access: 'On'
  iris:
    mode: Auto
    value: F2.8
    position: 120
  gain:
    mode: Alc
    value: 6dB
  white_balance:
    mode: Faw
    value: 5600K
    paint_red:
      scale: 64
      position: 32
      value: '0'
    paint_blue:
      scale: 64
      position: 30
      value: '-2'
  zoom:
    dynamic: 'Off'
    dynamic_position: 0
    position: 100
    display: Z100
  focus:
    mode: AF
    value: 3.5m
  streaming:
    status: Stop
  tally:
    priority: Camera
    lighting: 'Off'
    studio: 'Off'
  slots:
    a:
      status: Select
      protect: Unlock
      remaining_minutes: 120
      clips: 50
      low: false
  battery:
    info: Time
    level: '8'
    value: '80'
  buttons:
    Iris:
      Open1: true
      Close1: false
  button_names:
    User:
      Sw1: Focus Assist
