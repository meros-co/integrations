spec: foscam-ptz
command: set_time_from_ntp
input:
  server: time.nist.gov
  date_format: YYYY-MM-DD
  time_format: '24'
  time_zone: 0
  dst: false
expect_request:
  method: GET
  target: /cgi-bin/CGIProxy.fcgi?cmd=setSystemTime&timeSource=0&ntpServer=time.nist.gov&dateFormat=0&timeFormat=1&timeZone=0&isDst=0&dst=0&usr=admin&pwd=pw
settings:
  username: admin
  password: pw
