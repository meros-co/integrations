spec: foscam-ptz
telemetry: mirror-flip
settings:
  username: admin
  password: pw
inbound_http:
  path: /cgi-bin/CGIProxy.fcgi?cmd=getMirrorAndFlipSetting&usr=admin&pwd=pw
  body: <CGI_Result><result>0</result><isMirror>1</isMirror><isFlip>0</isFlip></CGI_Result>
expect_state:
  image:
    mirrored: true
    flipped: false
