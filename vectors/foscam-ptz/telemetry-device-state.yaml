spec: foscam-ptz
telemetry: device-state
settings:
  username: admin
  password: pw
inbound_http:
  path: /cgi-bin/CGIProxy.fcgi?cmd=getDevState&usr=admin&pwd=pw
  body: <CGI_Result><result>0</result><IOAlarm>0</IOAlarm><motionDetectAlarm>1</motionDetectAlarm><soundAlarm>2</soundAlarm><record>1</record><sdState>1</sdState><sdFreeSpace>1024</sdFreeSpace><sdTotalSpace>8192</sdTotalSpace><ntpState>1</ntpState><ddnspState>0</ddnspState><url></url><upnpState>2</upnpState><isWifiConnected>0</isWifiConnected><wifiConnectedAP></wifiConnectedAP><infraLedState>1</infraLedState></CGI_Result>
