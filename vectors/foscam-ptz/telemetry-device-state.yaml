    motion: none
    sound: alarm
  recording: true
  sd:
    state: ok
    free_kb: 1024
    total_kb: 8192
  ntp_state: updated
  ddns:
    state: disabled
    url: ''
  upnp_state: failed
  wifi:
    connected: false
    ssid: ''
  ir_led: true
