spec: foscam-ptz
telemetry: image
settings:
  username: admin
  password: pw
inbound_http:
  path: /cgi-bin/CGIProxy.fcgi?cmd=getImageSetting&usr=admin&pwd=pw
  body: <CGI_Result><result>0</result><brightness>50</brightness><contrast>48</contrast><hue>50</hue><saturation>52</saturation><sharpness>40</sharpness><denoiseLevel>0</denoiseLevel></CGI_Result>
expect_state:
  image:
    brightness: 50
    contrast: 48
    hue: 50
    saturation: 52
    sharpness: 40
