spec: foscam-ptz
telemetry: system-time
settings:
  username: admin
  password: pw
inbound_http:
  path: /cgi-bin/CGIProxy.fcgi?cmd=getSystemTime&usr=admin&pwd=pw
  body: <CGI_Result><result>0</result><timeSource>1</timeSource><ntpServer>time.nist.gov</ntpServer><dateFormat>0</dateFormat><timeFormat>1</timeFormat><timeZone>-3600</timeZone><isDst>0</isDst><dst>0</dst><year>2026</year><mon>10</mon><day>27</day><hour>14</hour><minute>5</minute><sec>9</sec></CGI_Result>
expect_state:
  time:
    source: manual
    ntp_server: time.nist.gov
    zone: -3600
    dst: false
    year: 2026
    month: 10
    day: 27
    hour: 14
    minute: 5
    second: 9
