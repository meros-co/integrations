spec: spx-graphics
telemetry: rundown
model: spx-broadcast
inbound_http:
  path: /api/v1/rundown/get?apikey=
  body: '{"comment": "Show", "templates": [{"itemID": "1001", "onair": "true", "description": "Name strap",
    "playserver": "OVERLAY", "playchannel": "1", "playlayer": "20", "webplayout": "20", "relpath": "softpix/Template_Pack_1.3/SPX1_INFO_LEFT.html",
    "out": "manual", "DataFields": [{"field": "f0", "ftype": "textfield", "value": "Jane Doe"}, {"field":
    "f1", "ftype": "textfield", "value": "Host"}]}, {"itemID": "1002", "onair": "false", "description":
    "Bug", "playserver": "-", "playchannel": "1", "playlayer": "5", "webplayout": "5", "relpath": "bug.html",
    "out": "4000", "DataFields": []}]}'
state_before:
  rundown:
    items:
      0999:
        description: Removed
expect_state:
  rundown:
    items:
      '1001':
        index: 1
        on_air: true
        description: Name strap
        server: OVERLAY
        channel: '1'
        layer: '20'
        web_layer: '20'
        template: softpix/Template_Pack_1.3/SPX1_INFO_LEFT.html
        out: manual
        fields:
          f0: Jane Doe
          f1: Host
      '1002':
        index: 2
        on_air: false
        description: Bug
        server: '-'
        channel: '1'
        layer: '5'
        web_layer: '5'
        template: bug.html
        out: '4000'
