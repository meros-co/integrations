spec: teradek-prism
command: get_access_token
input:
  password: wrong
expect_request:
  method: POST
  port: 443
  target: /oauth/token
  body: grant_type=password&password=wrong
  content_type: application/x-www-form-urlencoded
http_reply:
  status: 401
  body: '{"error":"invalid_grant"}'
expect_result:
  error:
    error: device_error
    code: '401'
