spec: teradek-prism
telemetry: audio-output
inbound_http:
  path: /api/v1/decoders/0/audio/settings
  body: '{"message": "Settings retrieved successfully", "settings": {"enable": true, "channel_mode": "8",
    "default-channel-map": "smpte", "delay": 0, "embedded-output-mute": false, "embedded-output-volume":
    0, "remapping": false, "selected": 0}, "status": "ok"}'
expect_state:
  audio_output:
    enable: true
    channel_mode: '8'
    channel_map: smpte
    delay: 0
    embedded_mute: false
    embedded_volume: 0
    remapping: false
    selected: 0
    settings_json: '{"enable":true,"channel_mode":"8","default-channel-map":"smpte","delay":0,"embedded-output-mute":false,"embedded-output-volume":0,"remapping":false,"selected":0}'
