spec: teradek-prism
telemetry: encoder-audio
inbound_http:
  path: /api/v1/encoders/0/audio/settings
  body: '{"message": "Settings retrieved successfully", "settings": {"codec": "aac", "bitrate_list": 128000,
    "channel_mode": "5.1", "channel_mode2": "Stereo", "samplerate": "auto", "samplerate_list": 48000,
    "default-channel-map": "remap", "delay": 0, "afterburner": true, "mute_track": false, "enable": true},
    "status": "ok"}'
expect_state:
  encoders:
    '0':
      audio:
        codec: aac
        bitrate_bps: 128000
        channel_mode: '5.1'
        channel_mode2: Stereo
        samplerate: auto
        samplerate_hz: 48000
        channel_map: remap
        delay: 0
        afterburner: true
        mute_track: false
        enable: true
        settings_json: '{"codec":"aac","bitrate_list":128000,"channel_mode":"5.1","channel_mode2":"Stereo","samplerate":"auto","samplerate_list":48000,"default-channel-map":"remap","delay":0,"afterburner":true,"mute_track":false,"enable":true}'
