spec: teradek-prism
telemetry: decoders
inbound_http:
  path: /api/v1/decoders
  body: '{"message": "Pipelines retrieved", "decoders": [{"id": 0, "name": "Decoder 1", "state": "Inactive",
    "uptime": "00:00:00", "ingests": [1], "restreams": [5], "failover_timeout_ms": 1000}], "limit": 4,
    "minimum": 1, "status": "ok"}'
expect_state:
  pools:
    decoders:
      '0':
        name: Decoder 1
  decoders:
    '0':
      name: Decoder 1
      state: Inactive
      uptime: 00:00:00
      ingests: '[1]'
      restreams: '[5]'
      failover_timeout_ms: 1000
  limits:
    decoders: 4
    decoders_minimum: 1
