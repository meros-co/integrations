spec: teradek-prism
telemetry: streams
inbound_http:
  path: /api/v1/streams
  body: '{"message": "Streams retrieved", "streams": [{"id": 0, "name": "Stream 1", "mode": "SRT", "state":
    "Running", "owner": "encoders/0"}, {"id": 5, "name": "Stream 6", "mode": "Disabled", "state": null,
    "owner": "decoders/0"}, {"id": 9, "name": "Stream 10", "mode": "RIST", "state": "Error", "owner":
    null}], "limit": 10, "minimum": 1, "protected": [0], "status": "ok"}'
expect_state:
  pools:
    streams:
      '0':
        name: Stream 1
      '5':
        name: Stream 6
      '9':
        name: Stream 10
  streams:
    '0':
      name: Stream 1
      mode: SRT
      state: Running
      owner: encoders/0
    '5':
      name: Stream 6
      mode: Disabled
      owner: decoders/0
    '9':
      name: Stream 10
      mode: RIST
      state: Error
  limits:
    streams: 10
    streams_minimum: 1
    streams_protected: '[0]'
state_before:
  pools:
    streams:
      '8':
        name: Stream 9
expect_then_send:
- method: GET
  target: /api/v1/encoders/0/info
- method: GET
  target: /api/v1/encoders/0/record/info
