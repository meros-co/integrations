spec: teradek-prism
command: set_encoder_snapshot_settings
input:
  encoder: 0
  width: 768
  height: 432
  quality: 80
expect_request:
  method: POST
  target: /api/v1/encoders/0/snapshot
  body: '{"settings":{"width":768,"height":432,"quality":80}}'
  content_type: application/json
http_reply:
  status: 200
  body: JFIF
expect_result:
  ok:
    kind: ack
