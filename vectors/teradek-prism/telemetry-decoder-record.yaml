spec: teradek-prism
telemetry: decoder-record
inbound_http:
  path: /api/v1/decoders/0/record/settings
  body: '{"message": "Settings retrieved successfully", "settings": {"mode": "RECUpload", "name": "$PN_$DATE_$TIME",
    "format": "mp4", "max-files": 144, "max-size-time": 10, "drive_id": "sd1", "auto_record": "off", "cyclic":
    false, "timecode": false}, "status": "ok"}'
expect_state:
  decoders:
    '0':
      record:
        mode: RECUpload
        name: $PN_$DATE_$TIME
        format: mp4
        max_files: 144
        max_size_time: 10
        drive_id: sd1
        auto_record: 'off'
        cyclic: false
        timecode: false
        settings_json: '{"mode":"RECUpload","name":"$PN_$DATE_$TIME","format":"mp4","max-files":144,"max-size-time":10,"drive_id":"sd1","auto_record":"off","cyclic":false,"timecode":false}'
