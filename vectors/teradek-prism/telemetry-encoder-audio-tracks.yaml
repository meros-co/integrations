spec: teradek-prism
telemetry: encoder-audio-tracks
inbound_http:
  path: /api/v1/encoders/2/audio
  body: '{"message": "Audio tracks retrieved", "tracks": [{"id": 2, "codec": "aac", "channel_mode": "5.1",
    "bitrate_list": 128000, "samplerate_list": 48000, "mute_track": false, "enable": true}], "status":
    "ok"}'
expect_state:
  encoders:
    '2':
      tracks:
        '2':
          codec: aac
          channel_mode: '5.1'
          bitrate_bps: 128000
          samplerate_hz: 48000
          mute_track: false
          enable: true
state_before:
  encoders:
    '2':
      tracks:
        '5':
          codec: aac
expect_then_send:
- method: GET
  target: /api/v1/encoders/2/audio/2/settings
