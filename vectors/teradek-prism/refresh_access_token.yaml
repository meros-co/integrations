spec: teradek-prism
command: refresh_access_token
input:
  refresh_token: bNLzvBOEqwDNYApV9jduhjlVXIoOp9kB
expect_request:
  method: POST
  port: 443
  target: /oauth/token
  body: grant_type=refresh_token&refresh_token=bNLzvBOEqwDNYApV9jduhjlVXIoOp9kB
  content_type: application/x-www-form-urlencoded
http_reply:
  status: 200
  body: '{"expires_in":3600,"token_type":"Bearer","refresh_token":"bNLzvBOEqwDNYApV9jduhjlVXIoOp9kB","access_token":"rYDVtxfHdH7Igk5qdMEWMJZAJpg1Gjvy"}'
expect_result:
  ok:
    kind: value
    value:
      expires_in: 3600
      token_type: Bearer
      refresh_token: bNLzvBOEqwDNYApV9jduhjlVXIoOp9kB
      access_token: rYDVtxfHdH7Igk5qdMEWMJZAJpg1Gjvy
