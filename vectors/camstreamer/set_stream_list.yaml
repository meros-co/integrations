spec: camstreamer
model: app-6
command: set_stream_list
input:
  config:
    streamList:
    - streamId: api_01
      platform: rtmp
      enabled: true
      active: true
      title: RTMP(S) Universal
      trigger:
        type: manual
      video:
        input:
          type: CRS
        output:
          type: video
          url: rtmp://a.rtmp.youtube.com/live2/key
          parameters: ''
      audio:
        source: none
      status:
        led: true
expect_request:
  method: POST
  target: /local/camstreamer/stream_list.cgi?action=set
  body: '{"streamList":[{"streamId":"api_01","platform":"rtmp","enabled":true,"active":true,"title":"RTMP(S)
    Universal","trigger":{"type":"manual"},"video":{"input":{"type":"CRS"},"output":{"type":"video","url":"rtmp://a.rtmp.youtube.com/live2/key","parameters":""}},"audio":{"source":"none"},"status":{"led":true}}]}'
