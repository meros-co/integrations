spec: magewell-proconvert
telemetry: general-dx
inbound_http:
  path: /api/aoip/general-info
  body: '{"status": 0, "device-lock": false, "tx-sample-rate": "48000", "unbld-in": "+12dBu", "unbld-out":
    "+12dBu", "bld-in": "-2dBV", "bld-out": "+18dBu", "igmp": "Auto", "micbias": true, "audio-pattern":
    "off", "uac-num-channels": 2}'
expect_state:
