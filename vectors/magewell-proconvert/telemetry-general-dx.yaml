    unbalanced_in_level: +12dBu
    unbalanced_out_level: +12dBu
    balanced_in_level: -2dBu
    balanced_out_level: +18dBu
    mic_bias: true
    test_tone: 'off'
  network:
    igmp: auto
  io:
    usb:
      channel_setting: 2
model: audio-dx
