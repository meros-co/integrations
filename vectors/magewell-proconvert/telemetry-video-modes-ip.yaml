spec: magewell-proconvert
telemetry: video-modes-ip
inbound_http:
  path: /api/video/mode/get
  body: '{"status": 0, "modes": [{"aspect-ratio": 1.7777777777777777, "aspect-x": 16, "aspect-y": 9, "curr-mode":
    true, "frame-rate": 6000, "height": 1080, "interlaced": false, "pref-mode": false, "width": 1920}]}'
expect_state:
  output:
    modes:
      '0':
        width: 1920
        height: 1080
        interlaced: false
        rate: 6000
        preferred: false
    mode:
      width: 1920
      height: 1080
      interlaced: false
      rate: 6000
