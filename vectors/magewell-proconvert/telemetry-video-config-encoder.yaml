spec: magewell-proconvert
telemetry: video-config-encoder
inbound_http:
  path: /mwapi?method=get-video-config
  body: '{"status": 0, "show-adv-ui": false, "in-auto-aspect": true, "in-aspect-x": 16, "in-aspect-y":
    9, "in-auto-color-fmt": true, "in-color-fmt": "rgb", "in-auto-quant-range": true, "in-quant-range":
    "full", "brightness": 0, "contrast": 100, "hue": 0, "saturation": 100, "in-crop-enabled": false, "deinterlace":
    "none", "ar-convertion": "ignore", "out-flip": false, "out-mirror": true, "out-cx": 1920, "out-cy":
    1080, "out-raw-resolution": true, "out-aspect-x": 16, "out-aspect-y": 9, "out-auto-aspect": true,
    "out-fr-convertion": "raw", "out-auto-color-fmt": true, "out-color-fmt": "bt.709", "out-auto-sat-range":
    true, "out-sat-range": "limited", "out-auto-quant-range": true, "out-quant-range": "limited", "bit-rate-ratio":
    100, "low-res-full-fr": false}'
expect_state:
  video:
    show_advanced: false
    input_aspect_auto: true
    input_aspect: '16:9'
    input_color_auto: true
    input_color_format: rgb
    input_quant_auto: true
    input_quant_range: full
    brightness: 0
    contrast: 100
    hue: 0
    saturation: 100
    deinterlace: none
    aspect_conversion: ignore
    v_flip: false
    h_flip: true
    output_width: 1920
    output_height: 1080
    output_follows_input: true
    output_aspect: '16:9'
    output_aspect_auto: true
    frame_rate_conversion: raw
    output_color_auto: true
    output_color_format: bt.709
    output_sat_auto: true
    output_sat_range: limited
    output_quant_auto: true
    output_quant_range: limited
    bitrate_ratio: 100
    low_res_full_frame_rate: false
