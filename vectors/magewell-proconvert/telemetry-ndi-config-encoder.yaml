spec: magewell-proconvert
telemetry: ndi-config-encoder
inbound_http:
  path: /mwapi?method=get-ndi-config
  body: '{"status": 0, "enable": true, "source-name": "#%board-id% (%serial-no%)", "group-name": "public",
    "enable-web-control": true, "enable-ptz-control": false, "enable-fail-over": true, "fail-over-ndi-name":
    "", "fail-over-ip-addr": "", "enable-mcast": false, "enable-rudp": false, "enable-tcp": false, "mcast-addr":
    "239.255.0.0", "mcast-mask": "255.255.0.0", "mcast-ttl": 4, "enable-udp": true, "enable-discovery":
    false, "discovery-server": "", "reference-level": 20, "vendor-name": "", "vendor-id": ""}'
expect_state:
  ndi:
    enabled: true
    source_name: '#%board-id% (%serial-no%)'
    groups: public
    web_control: true
    ptz_control: false
    failover:
      enabled: true
      name: ''
      address: ''
    transport_flags:
      multicast: false
      rudp: false
      multi_tcp: false
      udp: true
    transport: udp
    multicast:
      address: 239.255.0.0
      netmask: 255.255.0.0
      ttl: 4
    discovery:
      enabled: false
      servers: ''
    reference_level: smpte
    vendor_name: ''
    vendor_id: ''
