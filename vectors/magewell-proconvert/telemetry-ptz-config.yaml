spec: magewell-proconvert
telemetry: ptz-config
inbound_http:
  path: /mwapi?method=get-ptz-config
  body: '{"status": 0, "index": 1, "baudrate": 9600, "invert-pan": false, "invert-tilt": true, "ip-addr":
    "10.10.10.123", "pan-center": 0, "pan-left-limit": -2448, "pan-right-limit": 2448, "port": 1, "proto":
    "visca", "tilt-bottom-limit": -368, "tilt-center": 0, "tilt-top-limit": 1280, "visca-msg-hdr": false,
    "zoom-out-limit": 16384, "focus-near-limit": 0, "focus-far-limit": 2935}'
expect_state:
  ptz:
    protocol: visca
    camera: 1
    baudrate: 9600
    invert_pan: false
    invert_tilt: true
    address: 10.10.10.123
    port: 1
    visca_header: false
    limits:
      pan_left: -2448
      pan_center: 0
      pan_right: 2448
      tilt_top: 1280
      tilt_center: 0
      tilt_bottom: -368
      zoom_out: 16384
      focus_near: 0
      focus_far: 2935
