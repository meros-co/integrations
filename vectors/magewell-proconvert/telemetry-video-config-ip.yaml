spec: magewell-proconvert
telemetry: video-config-ip
inbound_http:
  path: /api/video/config/get
  body: '{"ar-convert": 0, "color-format": "rgb", "deinterlace-mode": 0, "enable-follow-input": false,
    "enable-webrtc": true, "follow-input": false, "force-deint": false, "h-flip": false, "hdr-output-mode":
    1, "ident-mode": 2, "ident-text": "2K HDMI 85", "in-color-fmt": 2, "quant-range": "limited", "safe-area":
    0, "screen-debug": true, "screen-mode": 1, "show-center-cross": false, "show-tally": true, "show-title":
    true, "show-vu-meter": true, "status": 0, "switch-mode": 0, "v-flip": false, "vu-meter-mode": 1}'
expect_state:
  video:
    aspect_conversion: windowbox
    output_color_format: rgb
    deinterlace: bob
    follow_input_allowed: false
    webrtc_preview: true
    output_follows_input: false
    force_deinterlace: false
    h_flip: false
    hdr_output_mode: disable
    ident_mode: source-name
    ident_text: 2K HDMI 85
    input_color_auto: false
    input_color_format: bt.709
    output_quant_range: limited
    safe_area: none
    screen_debug: true
    view_mode: single
    overlay:
      center_cross: false
      tally: true
      title: true
      vu_meter: true
    switch_mode: no-signal-image
    v_flip: false
    vu_meter_mode: post-dbvu
