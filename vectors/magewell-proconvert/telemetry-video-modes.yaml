spec: magewell-proconvert
telemetry: video-modes
inbound_http:
  path: /mwapi?method=get-supported-video-modes
  body: '{"status": 0, "modes": [{"width": 2560, "height": 1440, "interlaced": false, "field-rate": 5995,
    "aspect-ratio": 1.77777779, "pref-mode": true, "curr-mode": false}, {"width": 1920, "height": 1080,
    "interlaced": false, "field-rate": 5000, "aspect-ratio": 1.77777779, "pref-mode": false, "curr-mode":
    true}]}'
expect_state:
  output:
    modes:
      '0':
        width: 2560
        height: 1440
        interlaced: false
        rate: 5995
        preferred: true
      '1':
        width: 1920
        height: 1080
        interlaced: false
        rate: 5000
        preferred: false
    mode:
      width: 1920
      height: 1080
      interlaced: false
      rate: 5000
state_before:
  output:
    modes:
      '2':
        width: 720
