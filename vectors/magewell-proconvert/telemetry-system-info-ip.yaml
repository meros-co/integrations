spec: magewell-proconvert
telemetry: system-info-ip
inbound_http:
  path: /api/system/info
  body: '{"device-name": "USB Fusion", "uptime": 8410, "status": 0, "code": "Success", "datetime": {"cur-time":
    "2021-12-20 13:25:57", "zonename": "Asia/Shanghai", "ntp-enable": true, "ntp-server1": "0.pool.ntp.org",
    "ntp-server2": "1.pool.ntp.org"}, "auto-reboot": {"enable": true, "hour": 23, "min": 59, "week": [1,
    2]}}'
expect_state:
  device:
    name: USB Fusion
    uptime: 8410
  network:
    ntp_server: 0.pool.ntp.org
  auto_reboot:
    enabled: true
    hour: 23
    minute: 59
    week: '[1,2]'
