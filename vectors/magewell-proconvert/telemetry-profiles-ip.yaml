spec: magewell-proconvert
telemetry: profiles-ip
inbound_http:
  path: /api/profile/list
  body: '{"current-id": 2, "mode": 2, "status": 0, "profiles": [{"audio-idx": 0, "id": 0, "mode": 1, "name":
    "Default", "screens": [{"id": 10017, "name": "ENC (1)"}], "selected": false}, {"audio-idx": 1, "id":
    2, "mode": 2, "name": "PIP", "pip": {"mode": 0, "scale": 0.23, "x": 0.635, "y": 0.657}, "screens":
    [{"id": 10017, "name": "ENC (1)"}, {"id": 10023, "name": "ENC (2)"}], "selected": true}]}'
expect_state:
  profile:
    current_id: 2
  profiles:
    '0':
      name: Default
      view_mode: single
      audio_screen: 0
      selected: false
      screens:
        '0':
          source_id: 10017
          source_name: ENC (1)
    '2':
      name: PIP
      view_mode: pip
      audio_screen: 1
      selected: true
      screens:
        '0':
          source_id: 10017
          source_name: ENC (1)
        '1':
          source_id: 10023
          source_name: ENC (2)
state_before:
  profiles:
    '5':
      name: Gone
