spec: magewell-proconvert
telemetry: general-aes67
inbound_http:
  path: /api/aes67/general-info
  body: '{"status": 0, "tx-sample-rate": 48000, "tx-ptime": "1ms", "unbld-in": 2, "unbld-out": 2, "bld-in":
    1, "bld-out": 0, "micbias": true, "st2110": false, "igmp": 0, "aac-bitrate-kbps": 128, "audio-pattern":
    0, "uac-num-channels": 4}'
expect_state:
  aoip:
    sample_rate: 48000
    packet_time: 1ms
    st2110: false
  analog:
    unbalanced_in_level: 0dBu
    unbalanced_out_level: 0dBu
    balanced_in_level: +18dBu
    balanced_out_level: +18dBu
    mic_bias: true
    test_tone: 'off'
  network:
    igmp: auto
  stream:
    aac_bitrate_kbps: 128
  io:
    usb:
      channel_setting: 4
model: aes67
