spec: magewell-proconvert
telemetry: video-config-decoder
inbound_http:
  path: /mwapi?method=get-video-config
  body: '{"status": 0, "show-title": false, "show-tally": true, "show-vu-meter": true, "vu-meter-mode":
    "none", "show-center-cross": false, "safe-area-mode": "4:3", "ident-mode": "ident-text", "ident-text":
    "Screen 2", "h-flip": false, "v-flip": true, "switch-mode": "blank", "reset-source-on-boot": false,
    "deinterlace-mode": "bob", "in-auto-color-fmt": true, "in-color-fmt": "bt.709", "ar-convert-mode":
    "full", "alpha-disp-mode": "alpha-blend-checkerboard", "follow-input-mode": true}'
expect_state:
  video:
    overlay:
      title: false
      tally: true
      vu_meter: true
      center_cross: false
    vu_meter_mode: none
    safe_area: '4:3'
    ident_mode: ident-text
    ident_text: Screen 2
    h_flip: false
    v_flip: true
    switch_mode: blank
    reset_source_on_boot: false
    deinterlace: bob
    input_color_auto: true
    input_color_format: bt.709
    aspect_conversion: full
    output_follows_input: true
