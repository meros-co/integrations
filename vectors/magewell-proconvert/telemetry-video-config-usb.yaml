spec: magewell-proconvert
telemetry: video-config-usb
inbound_http:
  path: /api/video/config/get
  body: '{"status": 0, "code": "Success", "data": {"h_flip": true, "v_flip": false, "ar_convert_mode":
    "Windowbox"}}'
expect_state:
  video:
    h_flip: true
    v_flip: false
    aspect_conversion: windowbox
model: ip-to-usb
