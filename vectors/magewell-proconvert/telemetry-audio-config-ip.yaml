spec: magewell-proconvert
telemetry: audio-config-ip
inbound_http:
  path: /api/audio/config/get
  body: '{"channel-map": [0, 1, 2, 3, 4, 5, 6, 7], "channels": 0, "check-pts": true, "convert-mode": 1,
    "gain": 0, "sample-rate": 48000, "status": 0}'
expect_state:
  audio:
    channel_map: '[0,1,2,3,4,5,6,7]'
    channels: 0
    check_pts: true
    convert_mode: ebu
    gain: 0.0
    sample_rate: 48000
