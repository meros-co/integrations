spec: ptzoptics
telemetry: language
inbound_http:
  path: /cgi-bin/param.cgi?get_language_conf
  body: '{"status": 200, "data": {"default_language": "English", "focus_mode_status": "unlock", "isndi":
    "1", "isdante": "0", "streaming": "1", "standby": "1", "is_root_user": "0", "focusmode": "afocus"}}'
expect_state:
  system:
    language: English
    ndi_capable: true
    dante_capable: false
    streaming: '1'
    standby: '1'
  focus:
    mode_name: afocus
    locked: false
