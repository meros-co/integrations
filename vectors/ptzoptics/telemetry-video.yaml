spec: ptzoptics
telemetry: video
inbound_http:
  path: /cgi-bin/param.cgi?get_media_video
  body: 'hdmi_sdi="1"

    vinorm="60"

    ndi_mode="265P60"

    advanced="off"

    protocol_1="H265"

    profile="mainprofile"

    size_1="PIC_HD1080"

    bps_1="50000"

    qfactor_1="20"

    fps_1="60"

    gop_1="20"

    rcmode_1="CBR"

    imagegrade_1="1"

    slice_en_1="0"

    slice_mode_1="1"

    slice_size1="68"

    protocol_2="H264"

    size_2="PIC_640_360"

    bps_2="2048"

    qfactor_2="20"

    fps_2="30"

    gop_2="60"

    rcmode_2="CBR"

    imagegrade_2="1"

    slice_en_2="0"

    slice_mode_2="1"

    slice_size2="15"

    usbprotocol="H265"

    usbwidth="1920"

    usbheight="1080"

    usbframerate="60"

    vi_framerate="60"

    dial_support_4K_en="1"

    dial_support_framerate="60"

    dial_format="0"

    uhd4k="1"

    '
expect_state:
  video:
    baseband_output: hdmi
    refresh_rate: '60'
    template: 265P60
    advanced: 'off'
    profile: mainprofile
    frame_rate: 60
    uhd: true
    usb:
      protocol: H265
      width: 1920
      height: 1080
      frame_rate: 60
    streams:
      '1':
        protocol: H265
        resolution: PIC_HD1080
        bitrate: 50000
        qfactor: 20
        frame_rate: 60
        keyframe_interval: 20
        rate_control: CBR
      '2':
        protocol: H264
        resolution: PIC_640_360
        bitrate: 2048
        qfactor: 20
        frame_rate: 30
        keyframe_interval: 60
        rate_control: CBR
