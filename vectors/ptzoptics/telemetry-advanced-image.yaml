spec: ptzoptics
telemetry: advanced-image
inbound_http:
  path: /cgi-bin/param.cgi?get_advance_image_conf
  body: 'focus_mode="1"

    focus_zone="1"

    focus_sens="2"

    focuslimit="0"

    furthestpos="11"

    nearestpos="0"

    focus_mode="1"

    exposure_mode="11"

    expcomp_mode="2"

    expcomp_level="4"

    backlight="3"

    antiflicker="2"

    bright="7"

    gain_limit="5"

    manual_gain="2"

    meter="0"

    drc="3"

    shutter="5"

    iris="12"

    wb_mode="0"

    rgain_tuning="8"

    bgain_tuning="13"

    rgain="56"

    bgain="43"

    saturation="3"

    hue="8"

    temperature="40"

    style="0"

    luminance="8"

    sharpness="9"

    contrast="9"

    blackwhite_mode="0"

    imageOrientation="0"

    nr3d="9"

    nr2d="0"

    default_language="English"

    focus_mode_status="unlock"

    presetautoscan="3"

    presetfreeze="3"

    tallymode="1"

    presetinspection="3"

    trackbox="4"

    autotrack="0"

    zoommode="0"

    digitalzoom="0"

    motionsync="2"

    inversionMode="2"

    '
expect_state:
  focus:
    mode: 1
    zone: center
    sensitivity: normal
    locked: false
    limit:
      enabled: false
      near: 0
      far: 11
  exposure:
    mode: aae
    compensation: true
    compensation_level: 4
    backlight: 3
    anti_flicker: 60Hz
    bright: 7
    gain_limit: 5
    gain: 2
    meter_region: average
    dynamic_range: 3
    shutter: 5
    iris: 12
  white_balance:
    mode: auto
    red_gain_tuning: 8
    blue_gain_tuning: 13
    red_gain: 56
    blue_gain: 43
    color_temperature: 40
  image:
    saturation: 3
    hue: 8
    luminance: 8
    sharpness: 9
    contrast: 9
    style: 0
    black_and_white: false
    orientation: normal
    noise_reduction_3d: 9
    noise_reduction_2d: 0
  preset:
    auto_scan: 3
    freeze: false
    patrol: false
  tally:
    mode: 1
  tracking:
    bounding_boxes: select_target
    auto: 0
  zoom:
    mode_reported: 0
    mode: optical
  motion_sync: true
  auto_inversion: true
