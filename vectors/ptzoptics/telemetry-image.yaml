spec: ptzoptics
telemetry: image
inbound_http:
  path: /cgi-bin/param.cgi?get_image_conf
  body: 'style="0"

    luminance="8"

    sharpness="9"

    contrast="9"

    blackwhite_mode="0"

    imageOrientation="0"

    presetautoscan="3"

    presetfreeze="3"

    tallymode="1"

    presetinspection="3"

    trackbox="4"

    autotrack="0"

    zoommode="0"

    digitalzoom="0"

    motionsync="2"

    inversionMode="2"

    trackswitch="0"

    trackmode="tracking"

    boundingbox="4"

    trackcomposition="median"

    tracksens="median"

    trackzoom="2"

    trackdelay="0"

    trackdelaytime="25"

    trackstart="39"

    trackstop="-1"

    losstimeout="35"

    losspreset="22"

    bright="8"

    saturation="3"

    contrast="9"

    sharpness="9"

    hue="8"

    ldc="0"

    flip="0"

    mirror="0"

    '
expect_state:
  image:
    style: 0
    luminance: 8
    sharpness: 9
    contrast: 9
    black_and_white: false
    orientation: normal
    saturation: 3
    hue: 8
    lens_distortion_correction: 0
    flip: false
    mirror: false
  exposure:
    bright: 8
  preset:
    auto_scan: 3
    freeze: false
    patrol: false
  tally:
    mode: 1
  tracking:
    bounding_boxes: select_target
    auto: 0
    switch: 0
    mode: tracking
    composition: median
    sensitivity: median
    zoom: 2
    delay: 0
    delay_time: 25
    start: 39
    stop: -1
    loss_timeout: 35
    loss_preset: 22
  zoom:
    mode_reported: 0
    mode: optical
  motion_sync: true
  auto_inversion: true
