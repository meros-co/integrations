spec: ptzoptics
telemetry: audio
inbound_http:
  path: /cgi-bin/param.cgi?get_media_audio
  body: 'audio_switch="1"

    aeformat="AAC"

    adts_flag="0"

    samplerate="48"

    streamrate="128"

    audioinput="linein"

    vol_left_in="15"

    vol_right_in="15"

    volume_value="6"

    lineout_volume="20"

    lineout_switch="0"

    usbaudio_switch="1"

    '
expect_state:
  audio:
    encoding: 'on'
    format: AAC
    adts: false
    sample_rate: '48'
    bitrate: 128
    input: linein
    volume_left: 15
    volume_right: 15
    input_volume: 6
    line_out_volume: 20
    line_out: false
    usb: true
