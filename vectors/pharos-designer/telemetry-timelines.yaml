spec: pharos-designer
telemetry: timelines
inbound_http:
  path: /api/timeline
  body: '{"timelines": [{"num": 1, "name": "Timeline 1", "group": "Back of House", "group_num": 1, "length":
    10000, "source_bus": "internal", "timecode_format": "SMPTE30", "audio_band": 0, "audio_channel": "combined",
    "audio_peak": false, "time_offset": 5000, "state": "running", "onstage": true, "position": 10000,
    "rate_adjusted": true, "priority": "normal", "custom_properties": {}}]}'
expect_state:
  timelines:
    '1':
      name: Timeline 1
      group: Back of House
      group_num: 1
      length: 10000
      source_bus: internal
      timecode_format: SMPTE30
      audio_band: 0
      audio_channel: combined
      audio_peak: false
      time_offset: 5000
      state: running
      onstage: true
      position: 10000
      rate_adjusted: true
      priority: normal
