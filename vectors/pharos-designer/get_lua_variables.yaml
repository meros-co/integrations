spec: pharos-designer
command: get_lua_variables
input:
  variables: bob,alice
expect_request:
  method: GET
  target: /api/lua?variables=bob%2Calice
http_reply:
  status: 200
  body: '{"alice": 1234, "bob": "a string variable"}'
expect_result:
  ok:
    kind: value
    value:
      alice: 1234
      bob: a string variable
