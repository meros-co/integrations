spec: pharos-designer
command: set_ip
input:
  ip: 192.168.1.3
  subnet_mask: 255.255.255.0
  gateway: 192.168.1.1
expect_request:
  method: POST
  target: /api/config
  body: '{"ip":"192.168.1.3","subnet_mask":"255.255.255.0","gateway":"192.168.1.1"}'
http_reply:
  status: 200
  body: '{"restart":true}'
expect_result:
  ok:
    kind: value
    value: true
