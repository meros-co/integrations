spec: blackmagic-hyperdeck
telemetry: admin-network-access
model: hyperdeck-studio
inbound_http:
  path: /admin/api/v1/networkAccess
  body: '{"response": {"protocols": [{"id": "FTP", "state": "Enabled", "url": "ftp://Deck-A.local"}, {"id":
    "HTTP", "state": "SecureOnly", "url": "https://Deck-A.local"}]}, "success": true}'
expect_state:
  admin:
    network_access:
      protocols:
        FTP:
          state: Enabled
          url: ftp://Deck-A.local
        HTTP:
          state: SecureOnly
          url: https://Deck-A.local
