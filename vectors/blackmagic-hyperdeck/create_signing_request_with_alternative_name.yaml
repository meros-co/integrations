spec: blackmagic-hyperdeck
command: create_signing_request_with_alternative_name
input:
  common_name: hyperdeck.example.com
  subject_alternative_name: hyperdeck.example.net
  country: AU
  state_name: Victoria
  locality: Port Melbourne
  organization: Example
model: hyperdeck-studio
expect_request:
  method: POST
  target: /admin/api/v1/certificate/signingRequest
  port: 80
  body: '{"commonName":"hyperdeck.example.com","country":"AU","stateName":"Victoria","locality":"Port
    Melbourne","organization":"Example","subjectAlternativeName":"hyperdeck.example.net"}'
