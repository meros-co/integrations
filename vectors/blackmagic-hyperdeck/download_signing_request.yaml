spec: blackmagic-hyperdeck
command: download_signing_request
input:
  id: csr-1
model: hyperdeck-studio
expect_request:
  method: GET
  target: /admin/api/v1/certificate/signingRequest/csr-1
  port: 80
http_reply:
  status: 200
  body: '-----BEGIN CERTIFICATE REQUEST-----

    MIIB

    -----END CERTIFICATE REQUEST-----

    '
expect_result:
  ok:
    kind: value
    value: '-----BEGIN CERTIFICATE REQUEST-----

      MIIB

      -----END CERTIFICATE REQUEST-----'
