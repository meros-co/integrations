spec: blackmagic-hyperdeck
telemetry: admin-languages
model: hyperdeck-studio
inbound_http:
  path: /admin/api/v1/languages
  body: '{"response": {"languages": [{"code": "en_US.UTF-8", "name": "English"}, {"code": "ja_JP.UTF-8",
    "name": "Japanese"}]}, "success": true}'
expect_state:
  admin:
    languages:
      en_US.UTF-8:
        name: English
      ja_JP.UTF-8:
        name: Japanese
state_before:
  admin:
    languages:
      de_DE.UTF-8:
        name: German
