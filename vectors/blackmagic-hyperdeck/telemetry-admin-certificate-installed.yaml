spec: blackmagic-hyperdeck
telemetry: admin-certificate-installed
model: hyperdeck-studio
inbound_http:
  path: /admin/api/v1/certificate/summary
  body: '{"response": {"hostname": "Deck-A.local", "domain": "deck-a.example", "issuer": "Example CA"},
    "success": true}'
expect_state:
  admin:
    certificate:
      summary: '{"hostname":"Deck-A.local","domain":"deck-a.example","issuer":"Example CA"}'
      hostname: Deck-A.local
      domain: deck-a.example
      issuer: Example CA
