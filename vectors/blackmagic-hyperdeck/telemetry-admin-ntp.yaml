spec: blackmagic-hyperdeck
telemetry: admin-ntp
model: hyperdeck-studio
inbound_http:
  path: /admin/api/v1/dateAndTime/ntp
  body: '{"response": {"enabled": true, "serverUrl": "time.cloudflare.com", "state": "OffsetCorrection"},
    "success": true}'
expect_state:
  admin:
    date_time:
      ntp:
        enabled: true
        server_url: time.cloudflare.com
        state: OffsetCorrection
