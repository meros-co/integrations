spec: blackmagic-hyperdeck
telemetry: admin-network-access-options
model: hyperdeck-studio
inbound_http:
  path: /admin/api/v1/networkAccess/options
  body: '{"response": {"options": [{"protocol": "FTP", "secureOption": false, "showURL": true}, {"protocol":
    "HTTP", "secureOption": true, "showURL": true}]}, "success": true}'
expect_state:
  admin:
    network_access:
      protocols:
        FTP:
          secure_option: false
          show_url: true
        HTTP:
          secure_option: true
          show_url: true
