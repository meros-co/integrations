spec: sennheiser-tc-bar
telemetry: video-input-internal-camera-ai-access
inbound_http:
  path: /api/video/input/internalCamera/aiAccess
  body: '{"autoFramingAccessEnabled":true,"autoFramingEnabled":true,"personTilingAccessEnabled":true,"personTilingEnabled":true}'
expect_state:
  camera:
    ai:
      auto_framing_access_enabled: true
      auto_framing_enabled: true
      person_tiling_access_enabled: true
      person_tiling_enabled: true
