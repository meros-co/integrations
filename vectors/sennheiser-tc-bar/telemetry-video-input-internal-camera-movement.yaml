spec: sennheiser-tc-bar
telemetry: video-input-internal-camera-movement
inbound_http:
  path: /api/video/input/internalCamera/movement
  body: '{"panPosition":3,"tiltPosition":3,"zoomPosition":100,"zoomSpeed":"Slow","panTiltSpeed":"Slow","autoFramingSpeed":"Slow"}'
expect_state:
  camera:
    pan: 3
    tilt: 3
    zoom: 100
    zoom_speed: Slow
    pan_tilt_speed: Slow
    auto_framing_speed: Slow
