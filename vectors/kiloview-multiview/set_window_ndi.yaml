spec: kiloview-multiview
command: set_window_ndi
input:
  program: '1'
  window: '1'
  groups:
  - public
  server_enabled: true
  server_ip: 192.168.1.1
expect_request:
  method: POST
  target: /api/v2/window/ndi/set_param.json
  body: '{"pro_id":"1","win_id":"1","connection_type":"Default","netprefix":"","netmask":"","ttl":1,"group":["public"],"discovery_enable":true,"discovery_ip":"192.168.1.1"}'
  content_type: application/json
