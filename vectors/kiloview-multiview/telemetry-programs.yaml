spec: kiloview-multiview
telemetry: programs
inbound_http:
  path: /api/v2/program/list.json
  body: '{"result":"ok","data":[{"pro_id":"1","name":"program A","status":true}]}'
expect_state:
  programs:
    '1':
      name: program A
      'on': true
state_before:
  programs:
    '2':
      name: gone
expect_then_send:
- method: GET
  target: /api/v2/window/list.json?pro_id=1
- method: GET
  target: /api/v2/layout/list.json?pro_id=1
- method: GET
  target: /api/v2/program/get_param.json?pro_id=1
- method: POST
  target: /api/v2/take/get.json?pro_id=1
