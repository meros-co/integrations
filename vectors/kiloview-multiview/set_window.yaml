spec: kiloview-multiview
command: set_window
input:
  width: 1920
  height: 1080
  resolution: 2
  aspect: 1.777
  frame_rate: 60
  program: '1'
  window: '1'
  name: window_1
expect_request:
  method: POST
  target: /api/v2/window/set_param.json
  body: '{"pro_id":"1","win_id":"1","name":"window_1","resolution":{"width":1920,"height":1080,"index":2,"aspect":1.777},"frameRate":60,"number_used":false,"number_range":{"min":1,"max":16}}'
  content_type: application/json
