spec: kiloview-multiview
command: set_program
input:
  width: 1920
  height: 1080
  resolution: 2
  aspect: 1.777
  frame_rate: 60
  program: '1'
  name: programma A
expect_request:
  method: POST
  target: /api/v2/program/set_param.json
  body: '{"pro_id":"1","name":"programma A","resolution":{"width":1920,"height":1080,"index":2,"aspect":1.777},"frameRate":60}'
  content_type: application/json
