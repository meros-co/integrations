spec: kiloview-multiview
command: login
input:
  username: admin
  password: Admin123
expect_request:
  method: POST
  target: /api/v2/users/login.json
  body: '{"username":"admin","password":"Admin123"}'
  content_type: application/json
http_reply:
  status: 200
  body: '{"data":{"alias":"admin","changed":true,"role":"admin","token":"8731f577dbc347671b708d41169413dd","username":"admin"},"result":"ok"}'
expect_result:
  ok:
    kind: value
    value: 8731f577dbc347671b708d41169413dd
