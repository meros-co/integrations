spec: kiloview-multiview
telemetry: windows
inbound_http:
  path: /api/v2/window/list.json?pro_id=1
  body: '{"result":"ok","data":[{"id":"pvw","name":"PVW","layout_id":"1","modified":false,"resolution":{"width":1920,"height":1080,"index":2,"aspect":1.777},"frameRate":60}]}'
expect_state:
  windows:
    '1':
      pvw:
        name: PVW
        layout: '1'
        modified: false
        width: 1920
        height: 1080
        resolution: 2
        aspect: 1.777
        frame_rate: 60.0
state_before:
  windows:
    '1':
      '7':
        name: gone
expect_then_send:
- method: GET
  target: /api/v2/window/get.json?pro_id=1&win_id=pvw
- method: GET
  target: /api/v2/window/get_position.json?pro_id=1&win_id=pvw
- method: GET
  target: /api/v2/window/get_output_type.json?pro_id=1&win_id=pvw
- method: GET
  target: /api/v2/window/ndi/get_param.json?pro_id=1&win_id=pvw
- method: GET
  target: /api/v2/window/get_state_control.json?pro_id=1&win_id=pvw
