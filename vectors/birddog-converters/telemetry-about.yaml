spec: birddog-converters
telemetry: about
inbound_http:
  path: /about
  body: '{"FirmwareVersion":"BirdDog Firmware version","Format":"CAM 1","HostName":"birddog-device","IPAddress":"192.168.100.100","NetworkConfigMethod":"dhcp","NetworkMask":"255.255.255.0","SerialNumber":"0123456789","Status":"active"}'
expect_state:
  device:
    firmware: BirdDog Firmware version
    format: CAM 1
    hostname: birddog-device
    ip_address: 192.168.100.100
    netmask: 255.255.255.0
    network_method: dhcp
    serial: 0123456789
    status: active
