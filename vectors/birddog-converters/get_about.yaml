spec: birddog-converters
command: get_about
input: {}
expect_request:
  method: GET
  target: /about
http_reply:
  status: 200
  body: '{"FirmwareVersion":"BirdDog Firmware version","Format":"CAM 1","HostName":"birddog-device","IPAddress":"192.168.100.100","NetworkConfigMethod":"dhcp","NetworkMask":"255.255.255.0","SerialNumber":"0123456789","Status":"active"}'
expect_result:
  ok:
    kind: value
    value:
      FirmwareVersion: BirdDog Firmware version
      Format: CAM 1
      HostName: birddog-device
      IPAddress: 192.168.100.100
      NetworkConfigMethod: dhcp
      NetworkMask: 255.255.255.0
      SerialNumber: 0123456789
      Status: active
