spec: birddog-central
telemetry: generator
inbound_http:
  path: /?cmd=gen&subcmd=info&gname=Walk%20in
  body: '{"generators":[{"group_name":"Walk in","loop":"TRUE","playlist":["loop.mp4"],"status":"Playing"}]}'
expect_state:
  generators:
    Walk in:
      status: Playing
      loop: true
      playlist: '["loop.mp4"]'
