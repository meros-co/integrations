  path: /api/rest/v1/lino/shows
  body: '[{"id": 4, "name": "Engine 1", "started": true, "loadedRundownInfo": [{"id": 2}], "engines":
    [{"id": 1, "pollLevelsEnabled": true, "rundownServerPort": 30030, "remoteControlPort": 30020, "devices":
    []}]}, {"id": 5, "name": "Engine 2", "started": false, "loadedRundownInfo": []}]'
expect_state:
