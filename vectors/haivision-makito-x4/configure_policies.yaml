spec: haivision-makito-x4
command: configure_policies
input:
  policies:
    minLen: 6
    quality: Strong
    uppercase: 1
    digits: 1
    symbols: 1
    rememberedPasswords: 5
    minimumLifetime: 7
    expiration: true
    expirationDays: 90
    hsts: true
    autoLogout: false
    autoLogoutTime: 20
    limitPwdRetries: false
    limitPwdRetriesMaxAttempts: 3
    limitPwdRetriesInterval: 15
    inactiveLock: false
    inactiveLockTime: 90
    compliance: FIPS140
    ssl3: false
    tls1: true
    tls1_1: true
    tls1_2: true
settings:
  password: Secret-123
expect_request:
  method: PUT
  target: /apis/policies
  body: '{"minLen":6,"quality":"Strong","uppercase":1,"digits":1,"symbols":1,"rememberedPasswords":5,"minimumLifetime":7,"expiration":true,"expirationDays":90,"hsts":true,"autoLogout":false,"autoLogoutTime":20,"limitPwdRetries":false,"limitPwdRetriesMaxAttempts":3,"limitPwdRetriesInterval":15,"inactiveLock":false,"inactiveLockTime":90,"compliance":"FIPS140","ssl3":false,"tls1":true,"tls1_1":true,"tls1_2":true}'
