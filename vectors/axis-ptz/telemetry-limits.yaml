spec: axis-ptz
telemetry: limits
inbound_http:
  path: /axis-cgi/com/ptz.cgi?query=limits&camera=1
  body: 'MinPan=-180

    MaxPan=180

    MinTilt=-90

    MaxTilt=20

    MinZoom=1

    MaxZoom=19999

    MinIris=1

    MaxIris=9999

    MinFocus=1

    MaxFocus=9999

    MinFieldAngle=22

    MaxFieldAngle=623

    MinBrightness=1

    MaxBrightness=9999

    '
expect_state:
  limits:
    pan:
      min: -180.0
      max: 180.0
    tilt:
      min: -90.0
      max: 20.0
    zoom:
      min: 1
      max: 19999
    iris:
      min: 1
      max: 9999
    focus:
      min: 1
      max: 9999
    field_angle:
      min: 22
      max: 623
    brightness:
      min: 1
      max: 9999
