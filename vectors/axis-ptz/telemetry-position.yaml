spec: axis-ptz
telemetry: position
inbound_http:
  path: /axis-cgi/com/ptz.cgi?query=position&camera=1
  body: 'pan=-12.5

    tilt=-30.25

    zoom=4200

    focus=7000

    iris=3000

    brightness=4999

    autofocus=on

    autoiris=off

    '
