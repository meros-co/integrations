spec: pikvm
telemetry: ws-msd-images
inbound_ws: '{"event_type": "msd_state", "event": {"enabled": true, "online": true, "busy": false, "storage":
  {"images": {"ubuntu.iso": {"size": 1024, "complete": true}}}, "drive": {"image": {"name": "ubuntu.iso",
  "size": 1024, "complete": true}, "connected": true, "cdrom": true, "rw": false}}}'
expect_state:
