spec: pikvm
telemetry: ws-gpio
inbound_ws: '{"event_type": "gpio_state", "event": {"inputs": {"led1": {"online": true, "state": false}},
  "outputs": {"relay1": {"online": false, "state": false, "busy": false}}}}'
expect_state:
  gpio:
    inputs:
      led1:
        online: true
        state: false
    outputs:
      relay1:
        online: false
        state: false
        busy: false
