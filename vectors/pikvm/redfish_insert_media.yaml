spec: pikvm
command: redfish_insert_media
input:
  image: https://releases.ubuntu.com/noble/ubuntu.iso
expect_request:
  method: POST
  target: /redfish/v1/Managers/BMC/VirtualMedia/MSD/Actions/VirtualMedia.InsertMedia
  body: '{"Image":"https://releases.ubuntu.com/noble/ubuntu.iso","Inserted":true,"WriteProtected":true}'
