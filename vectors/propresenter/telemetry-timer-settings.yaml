spec: propresenter
telemetry: timer-settings
inbound_http:
  path: /v1/timers
  body: '[{"id": {"uuid": "t1", "name": "Countdown", "index": 0}, "allows_overrun": true, "countdown":
    {"duration": 300}}, {"id": {"uuid": "t2", "name": "Service", "index": 1}, "allows_overrun": false,
    "count_down_to_time": {"time_of_day": 37800, "period": "am"}}, {"id": {"uuid": "t3", "name": "Elapsed",
    "index": 2}, "allows_overrun": false, "elapsed": {"start_time": 0, "end_time": 3600}}]'
expect_state:
  timer_settings:
    t1:
      name: Countdown
      index: 0
      allows_overrun: true
      countdown_duration: 300
    t2:
      name: Service
      index: 1
      allows_overrun: false
      time_of_day: 37800
      period: am
    t3:
      name: Elapsed
      index: 2
      allows_overrun: false
      elapsed_start: 0
      elapsed_end: 3600
state_before:
  timer_settings:
    t0:
      name: Deleted
      index: 0
