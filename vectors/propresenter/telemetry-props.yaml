spec: propresenter
telemetry: props
inbound_http:
  path: /v1/props
  body: '[{"id": {"uuid": "pr1", "name": "Logo", "index": 0}, "is_active": true, "auto_clear_enabled":
    true, "auto_clear_duration": 10.0, "transition": null}, {"id": {"uuid": "pr2", "name": "Lower Third",
    "index": 1}, "is_active": false, "auto_clear_enabled": false, "auto_clear_duration": 0}]'
expect_state:
  props:
    pr1:
      name: Logo
      index: 0
      active: true
      auto_clear_enabled: true
      auto_clear_duration: 10.0
    pr2:
      name: Lower Third
      index: 1
      active: false
      auto_clear_enabled: false
      auto_clear_duration: 0.0
state_before:
  props:
    gone:
      name: Old
      active: false
