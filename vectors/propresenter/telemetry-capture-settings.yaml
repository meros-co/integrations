spec: propresenter
telemetry: capture-settings
inbound_http:
  path: /v1/capture/settings
  body: '{"source": "Audience", "audio_routing": [[1, 2]], "disk": {"file_location": "/Captures", "encoding":
    "h264", "resolution": {"width": 1920, "height": 1080}, "frame_rate": 29.97}, "rtmp": {"url": "rtmp://live.example.net/app",
    "key": "secret-key", "encoding": "h264", "save_local": true, "file_location": "/Captures/rtmp"}, "resi":
    {"event_name": "Sunday", "event_description": "", "destination_group": "", "encoding": "h264"}}'
expect_state:
  capture:
    settings:
      source: Audience
      disk:
        file_location: /Captures
        encoding: h264
        width: 1920
        height: 1080
        frame_rate: 29.97
      rtmp:
        url: rtmp://live.example.net/app
        encoding: h264
        save_local: true
        file_location: /Captures/rtmp
      resi:
        event_name: Sunday
        encoding: h264
