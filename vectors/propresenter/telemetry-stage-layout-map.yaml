spec: propresenter
telemetry: stage-layout-map
inbound_http:
  path: /v1/stage/layout_map
  body: '[{"screen": {"uuid": "sc1", "name": "Confidence", "index": 0}, "layout": {"uuid": "ly2", "name":
    "Lyrics", "index": 1}}]'
expect_state:
  stage:
    layout_map:
      sc1:
        screen_name: Confidence
        layout_uuid: ly2
        layout_name: Lyrics
state_before:
  stage:
    layout_map:
      old:
        screen_name: Removed
