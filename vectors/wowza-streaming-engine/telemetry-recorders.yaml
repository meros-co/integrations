spec: wowza-streaming-engine
telemetry: recorders
inbound_http:
  path: /v2/servers/_defaultServer_/vhosts/_defaultVHost_/applications/live/instances/_definst_/streamrecorders
  body: '{"instanceName": "_definst_", "streamrecorder": [{"recorderName": "myStream", "recorderState":
    "Waiting for stream", "currentFile": "", "currentSize": 0, "currentDuration": 0, "recordingStartTime":
    "", "outputPath": "/content", "fileFormat": "MP4", "segmentationType": "SegmentByDuration", "recorderErrorString":
    ""}]}'
expect_state:
