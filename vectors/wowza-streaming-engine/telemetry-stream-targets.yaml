spec: wowza-streaming-engine
telemetry: stream-targets
inbound_http:
  path: /v2/servers/_defaultServer_/vhosts/_defaultVHost_/applications/live/pushpublish/mapentries
  body: '{"serverName": "_defaultServer_", "mapEntries": [{"entryName": "YouTube 1", "enabled": true,
    "profile": "rtmp", "sourceStreamName": "my Stream", "host": "a.rtmp.youtube.com", "port": 1935, "application":
    "live2", "streamName": "abcd-1234", "password": "secret", "sessionStatus": "Active", "sessionFailureReason":
    ""}]}'
expect_state:
  applications:
    live:
      stream_targets:
        YouTube 1:
          enabled: true
          profile: rtmp
          source_stream: my Stream
          host: a.rtmp.youtube.com
          port: 1935
          application: live2
          stream_name: abcd-1234
          session_status: Active
          failure_reason: ''
