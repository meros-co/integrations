spec: wowza-streaming-engine
telemetry: applications
inbound_http:
  path: /v2/servers/_defaultServer_/vhosts/_defaultVHost_/applications
  body: '{"serverName": "_defaultServer_", "applications": [{"id": "live", "href": "/v2/servers/_defaultServer_/vhosts/_defaultVHost_/applications/live",
    "appType": "Live", "drmEnabled": false, "dvrEnabled": true, "transcoderEnabled": true, "streamTargetsEnabled":
    true}]}'
expect_state:
  applications:
    live:
      app_type: Live
      drm_enabled: false
      dvr_enabled: true
      transcoder_enabled: true
      stream_targets_enabled: true
expect_then_send:
- method: GET
  target: /v2/servers/_defaultServer_/vhosts/_defaultVHost_/applications/live/instances
- method: GET
  target: /v2/servers/_defaultServer_/vhosts/_defaultVHost_/applications/live/pushpublish/mapentries
- method: GET
  target: /v2/servers/_defaultServer_/vhosts/_defaultVHost_/applications/live/monitoring/current
