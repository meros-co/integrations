spec: wowza-streaming-engine
telemetry: startup-streams
inbound_http:
  path: /v2/servers/_defaultServer_/vhosts/_defaultVHost_/startupstreams
  body: '{"serverName": "_defaultServer_", "Streams": [{"appName": "live", "instance": "_definst_", "streamName":
    "camera1.stream", "mediaCasterType": "rtp"}]}'
expect_state:
  startup_streams:
    live:
      _definst_:
        camera1.stream:
          media_caster_type: rtp
