spec: wowza-streaming-engine
telemetry: stream-stats
inbound_http:
  path: /v2/servers/_defaultServer_/vhosts/_defaultVHost_/applications/live/instances/_definst_/incomingstreams/my%20Stream/monitoring/current
  body: '{"name": "my Stream", "totalConnections": 7, "bytesIn": 5000, "bytesOut": 35000, "bytesInRate":
    500000, "bytesOutRate": 3500000, "uptime": 120}'
expect_state:
  applications:
    live:
      instances:
        _definst_:
          stream_stats:
            my Stream:
              connections: 7
              bytes_in: 5000
              bytes_out: 35000
              bytes_in_rate: 500000
              bytes_out_rate: 3500000
              uptime: 120
