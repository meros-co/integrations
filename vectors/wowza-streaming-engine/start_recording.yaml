spec: wowza-streaming-engine
command: start_recording
input:
  app: live
  stream: myStream
expect_request:
  method: POST
  target: /v2/servers/_defaultServer_/vhosts/_defaultVHost_/applications/live/instances/_definst_/streamrecorders/myStream
  body: '{"recorderName":"myStream","instanceName":"_definst_","defaultRecorder":true}'
http_reply:
  status: 201
  body: '{"success": true, "message": "Recorder Created", "data": null}'
expect_result:
  ok:
    kind: ack
