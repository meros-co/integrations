spec: aws-elemental-live
telemetry: system-status
inbound_http:
  path: /api/system_status.json
  body: '{"cpu": {"pct": "1.46", "num": 0}, "mem": {"pct": 48, "num": 5}, "gpu": [{"pct": 0, "num": 0},
    {"pct": 37, "num": 1}], "status": "orange_status", "date": "Jan 20, 2015 16:01:47", "devices": [],
    "psu_status": "Status: Present, OK", "raid_status": "There was an error while trying to get information
    about the device."}'
expect_state:
