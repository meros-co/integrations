    status: orange_status
    cpu_pct: 1.46
    mem_pct: 48.0
    date: Jan 20, 2015 16:01:47
    psu_status: 'Status: Present, OK'
    raid_status: There was an error while trying to get information about the device.
    gpus:
      '0':
        pct: 0.0
      '1':
        pct: 37.0
