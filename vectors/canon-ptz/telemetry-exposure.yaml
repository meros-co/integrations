spec: canon-ptz
telemetry: exposure
inbound_http:
  path: /-wvhttp-01-/info.cgi
  body: 'c.1.shooting:=manual

    c.1.exp:=tv

    c.1.scene:=sports

    c.1.ae.gainlimit.max:=330

    c.1.ae.brightness:=-2

    c.1.ae.photometry:=center

    c.1.ae.flickerreduct:=auto

    c.1.me.shutter.mode:=speed

    c.1.me.shutter:=60

    c.1.me.diaphragm.mode:=manual

    c.1.me.diaphragm:=280

    c.1.me.gain.mode:=manual

    c.1.me.gain:=120

    c.1.nd.filter:=400

    c.1.nd.mode:=assist

    '
expect_state:
  exposure:
    shooting: manual
    mode: tv
    scene: sports
    gain_limit: 330
    brightness: -2
    photometry: center
    flicker_reduction: auto
  shutter:
    mode: speed
    value: '60'
  iris:
    mode: manual
    value: '280'
  gain:
    mode: manual
    value: '120'
  nd:
    filter: '400'
    mode: assist
