spec: canon-ptz
telemetry: lens
inbound_http:
  path: /-wvhttp-01-/info.cgi
  body: 'c.1.zoom.mode:=dzoom

    c.1.zoom.mag:=150

    c.1.zoom:=3000

    c.1.zoom.accel:=both

    c.1.is:=on1

    c.1.focus:=manual

    c.1.focus.speed:=1

    c.1.focus.value:=-120

    c.1.focus.detect:=faceonly

    '
expect_state:
  zoom:
    mode: dzoom
    magnification: 150
    position: 3000
    soft: both
  image_stabilization: on1
  focus:
    mode: manual
    speed: 1
    position: -120
    detection: faceonly
