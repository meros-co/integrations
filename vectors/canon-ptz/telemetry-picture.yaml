spec: canon-ptz
telemetry: picture
inbound_http:
  path: /-wvhttp-01-/info.cgi
  body: 'c.1.blacklevel:=-3

    c.1.ac:=10

    c.1.nr:=4

    c.1.wb:=kelvin

    c.1.wb.kelvin:=5600

    c.1.wb.shift.rgain:=5

    c.1.wb.shift.bgain:=-5

    c.1.colorbar:=off

    c.1.platform.status:=normal

    p:=3

    p.count:=100

    '
expect_state:
  pedestal: -3
  sharpness: 10
  noise_reduction: 4
  white_balance:
    mode: kelvin
    kelvin: 5600
    r_gain: 5
    b_gain: -5
  color_bars: false
  pan_tilt:
    status: normal
  preset:
    last: 3
    count: 100
