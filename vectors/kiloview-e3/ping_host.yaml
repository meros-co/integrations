spec: kiloview-e3
command: ping_host
input:
  target: 192.168.35.22
expect_request:
  method: POST
  target: /api/systemctrl/system/ping
  body: '{"target_addr":"192.168.35.22"}'
http_reply:
  status: 200
  body: '{"result":"ok","data":{"loss_rate":100,"reachable":false},"msg":null}'
expect_result:
  ok:
    kind: value
    value:
      loss_rate: 100
      reachable: false
