spec: kiloview-e3
command: add_rtmp_stream
input:
  interface: sdi
  name: YouTube
  address: rtmp://a.rtmp.youtube.com/live2/abcd-efgh
  bind_audio: 1
expect_request:
  method: POST
  target: /api/streamer/sdi/stream
  body: '{"type":"rtmp","name":"YouTube","address":"rtmp://a.rtmp.youtube.com/live2/abcd-efgh","bindAudio":1,"bindVideo":"main","connIntv":3,"connTimeout":15,"user":"","password":"","oldRtmp":false}'
