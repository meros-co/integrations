spec: kiloview-e3
command: add_stream
input:
  interface: hdmi
  stream:
    type: rtmp
    name: RTMPS
    address: rtmps://live.example/app/key
    bindAudio: 1
    connIntv: 3
    connTimeout: 15
    user: ''
    password: ''
expect_request:
  method: POST
  target: /api/streamer/hdmi/stream
  body: '{"type":"rtmp","name":"RTMPS","address":"rtmps://live.example/app/key","bindAudio":1,"connIntv":3,"connTimeout":15,"user":"","password":""}'
