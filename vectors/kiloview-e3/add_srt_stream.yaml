spec: kiloview-e3
command: add_srt_stream
input:
  interface: hdmi
  name: SRT out
  mode: caller
  address: srt://192.168.40.2
  port: 5700
  latency: 500
  bind_audio: 1
  key_length: '16'
  passphrase: 0123456789ab
expect_request:
  method: POST
  target: /api/streamer/hdmi/stream
  body: '{"type":"srt","name":"SRT out","mode":"caller","address":"srt://192.168.40.2","port":5700,"latency":500,"bindAudio":1,"bindVideo":"main","streamid":"","maxbw":-1,"pbkeylen":16,"passphrase":"0123456789ab"}'
