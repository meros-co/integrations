spec: youtube-live
command: set_thumbnail
input:
  video_id: abcDEF12345
  image: iVBORw0KGgo=
  format: image/png
settings:
  access_token: ya29.x
  broadcast_id: abcDEF12345
expect_request:
  method: POST
  target: /upload/youtube/v3/thumbnails/set?videoId=abcDEF12345&uploadType=media
  body_hex: 89504e470d0a1a0a
  content_type: image/png
http_reply:
  status: 200
  body: '{"kind": "youtube#thumbnailSetResponse", "etag": "e3", "items": [{"default": {"url": "https://i.ytimg.com/vi/x/default.jpg",
    "width": 120, "height": 90}}]}'
expect_result:
  ok:
    kind: value
    value:
    - default:
        url: https://i.ytimg.com/vi/x/default.jpg
        width: 120
        height: 90
