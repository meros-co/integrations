http_reply:
  status: 200
  body: '{"kind": "youtube#liveChatMessage", "etag": "p1", "id": "LCC.poll123", "snippet": {"type": "pollEvent",
    "liveChatId": "Cg0KC2FiY0RFRjEyMzQ1", "authorChannelId": "UCchannel", "publishedAt": "2026-10-04T16:20:00Z",
    "hasDisplayContent": true, "displayMessage": "Which song next?", "pollDetails": {"metadata": {"questionText":
