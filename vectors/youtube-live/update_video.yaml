spec: youtube-live
command: update_video
input:
  video:
    id: abcDEF12345
    snippet: &id001
      title: Sunday Service
      categoryId: '29'
      description: Live from the main hall.
      tags:
      - church
      - live
    status: &id002
      privacyStatus: public
      selfDeclaredMadeForKids: false
      embeddable: true
      publicStatsViewable: true
      license: youtube
settings:
  access_token: ya29.x
  broadcast_id: abcDEF12345
expect_request:
  method: PUT
  target: /youtube/v3/videos?part=snippet%2Cstatus
  body: '{"id":"abcDEF12345","snippet":{"title":"Sunday Service","categoryId":"29","description":"Live
    from the main hall.","tags":["church","live"]},"status":{"privacyStatus":"public","selfDeclaredMadeForKids":false,"embeddable":true,"publicStatsViewable":true,"license":"youtube"}}'
http_reply:
  status: 200
  body: '{"kind": "youtube#video", "id": "abcDEF12345", "snippet": {"title": "Sunday Service", "categoryId":
    "29", "description": "Live from the main hall.", "tags": ["church", "live"]}, "status": {"privacyStatus":
    "public", "selfDeclaredMadeForKids": false, "embeddable": true, "publicStatsViewable": true, "license":
    "youtube"}}'
expect_result:
  ok:
    kind: value
    value:
      kind: youtube#video
      id: abcDEF12345
      snippet: *id001
      status: *id002
