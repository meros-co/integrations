spec: youtube-live
command: update_video_status
input:
  video:
    id: abcDEF12345
    status:
      privacyStatus: public
      selfDeclaredMadeForKids: false
      embeddable: true
      publicStatsViewable: true
      license: youtube
settings:
  access_token: ya29.x
