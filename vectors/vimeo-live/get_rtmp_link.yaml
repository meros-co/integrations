spec: vimeo-live
command: get_rtmp_link
input:
  live_event_id: '12345'
settings:
  token: 0123456789abcdef0123456789abcdef
  live_event_id: '12345'
expect_request:
  method: GET
  target: /me/live_events/12345?fields=rtmp_link
http_reply:
  status: 200
