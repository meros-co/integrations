spec: vimeo-live
command: create_live_event
input:
  title: Sunday Service
settings:
  token: 0123456789abcdef0123456789abcdef
  live_event_id: '12345'
expect_request:
  method: POST
  target: /me/live_events
  body: '{"title":"Sunday Service","stream_privacy":{"view":"anybody"},"latency":"standard"}'
http_reply:
  status: 200
  body: '{"uri": "/live_events/67890", "title": "Sunday Service"}'
expect_result:
  ok:
    kind: value
    value: /live_events/67890
