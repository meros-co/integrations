spec: vimeo-live
command: create_live_event_custom
input:
  event:
    title: Midweek
    schedule:
      start_time: '2026-10-14T19:00:00Z'
      rrule: FREQ=WEEKLY
    dvr: true
settings:
  token: 0123456789abcdef0123456789abcdef
  live_event_id: '12345'
expect_request:
  method: POST
  target: /me/live_events
  body: '{"title":"Midweek","schedule":{"start_time":"2026-10-14T19:00:00Z","rrule":"FREQ=WEEKLY"},"dvr":true}'
