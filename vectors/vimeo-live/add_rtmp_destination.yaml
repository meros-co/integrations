spec: vimeo-live
command: add_rtmp_destination
input:
  live_event_id: '12345'
  display_name: Overflow
  stream_url: rtmp://example.com/live
  stream_key: abc123
settings:
  token: 0123456789abcdef0123456789abcdef
  live_event_id: '12345'
expect_request:
  method: POST
  target: /me/live_events/12345/destinations
  body: '{"service_name":"custom_rtmp","type":"custom","display_name":"Overflow","stream_url":"rtmp://example.com/live","stream_key":"abc123","is_enabled":true}'
http_reply:
  status: 200
  body: '{"id": 1234, "display_name": "Overflow", "is_enabled": true, "service_name": "custom_rtmp"}'
expect_result:
  ok:
    kind: value
    value: 1234
