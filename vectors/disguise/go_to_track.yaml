spec: disguise
command: go_to_track
input:
  track: track 1
  playmode: PlaySection
expect_request:
  method: POST
  target: /api/session/transport/gototrack
  body: '{"transports":[{"transport":{"name":"default"},"track":{"name":"track 1"},"playmode":"PlaySection"}]}'
http_reply:
  status: 200
  body: '{"status": {"code": 4000, "message": "invalid playmode", "details": [{"message": "LoopSection"}]}}'
expect_result:
  error:
    error: device_error
