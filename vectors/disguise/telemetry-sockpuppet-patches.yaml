spec: disguise
telemetry: sockpuppet-patches
inbound_http:
  path: /api/session/sockpuppet/patches
  body: '{"status": {"code": 0, "message": "", "details": []}, "result": [{"address": "/stage/wall", "uid":
    "1501", "description": "LED wall", "fields": [{"name": "brightness", "displayName": "Brightness",
    "type": "float", "floatMeta": {"min": 0.0, "max": 1.0, "defaultValue": 1.0, "step": 0.01}, "floatValue":
    {"value": 0.5, "duration": 2.0, "easingFunction": "linear", "startValue": 1.0, "currentValue": 0.75}},
    {"name": "blend", "displayName": "Blend mode", "type": "string", "stringMeta": {"options": ["over",
    "add"]}, "stringValue": "add"}, {"name": "video", "displayName": "Video", "type": "resource", "resourceMeta":
    {"type": "VideoClip"}, "resourceValue": {"uid": "401", "name": "intro.mov"}}]}]}'
state_before:
  sockpuppet:
    patches:
      '1500':
        address: /old
expect_state:
  sockpuppet:
    patches:
      '1501':
        address: /stage/wall
        description: LED wall
        fields:
          '0':
            name: brightness
            display_name: Brightness
            type: float
            value: 0.5
            current_value: 0.75
            min: 0.0
            max: 1.0
            default: 1.0
            step: 0.01
          '1':
            name: blend
            display_name: Blend mode
            type: string
            text: add
            options: '["over","add"]'
          '2':
            name: video
            display_name: Video
            type: resource
            resource: intro.mov
            resource_uid: '401'
            resource_type: VideoClip
