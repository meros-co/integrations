spec: disguise
command: set_live_float
input:
  patch: /stage/wall
  field: brightness
  value: 0.5
  duration: 2.0
  easing: easeInOutQuad
expect_request:
  method: POST
  target: /api/session/sockpuppet/live
  body: '{"patches":[{"address":"/stage/wall","changes":[{"field":"brightness","floatValue":{"value":0.500000,"duration":2.000,"easingFunction":"easeInOutQuad"}}]}]}'
http_reply:
  status: 200
  body: '{"status": {"code": 0, "message": "", "details": []}}'
expect_result:
  ok:
    kind: ack
