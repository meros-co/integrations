spec: disguise
command: set_note
input:
  note: running order
  text: '1. Intro

    2. Act 1'
expect_request:
  method: POST
  target: /api/session/note
  body: '{"note":{"name":"running order"},"text":"1. Intro\n2. Act 1"}'
http_reply:
  status: 200
  body: '{"status": {"code": 0, "message": "", "details": []}, "result": {"note": {"uid": "1701", "name":
    "running order"}, "text": "1. Intro\n2. Act 1"}}'
expect_result:
  ok:
    kind: value
    value:
      note:
        uid: '1701'
        name: running order
      text: '1. Intro

        2. Act 1'
