spec: aimedia-icap
command: update_access_code
input:
  code: '1234'
  broadcaster: acme
  encoder: encoder1
  service: 1
  shared_with:
  - captionco
  secondary:
  - broadcaster: acme
    encoder: encoder2
settings:
  company: acme
  username: admin
  password: secret
expect_request:
  method: PUT
  target: /api/1.0/acme/accesscodes
  body: '{"accesscode":"1234","broadcaster":"acme","primaryencoder":"encoder1","service":1,"sharedwith":["captionco"],"secondaryencoder":[{"broadcaster":"acme","encoder":"encoder2"}]}'
