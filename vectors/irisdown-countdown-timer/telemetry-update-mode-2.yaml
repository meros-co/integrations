spec: irisdown-countdown-timer
telemetry: update-mode-2
inbound: "TIME=+00:10:00&STATE=STOPPED&DISPLAY=TIMER&MESSAGE=TRUE\r\n"
expect_connect_wire:
- "UPDATEMODE 2\r\n"
- "UPDATES ON\r\n"
expect_state:
  timer:
    remaining: 00:10:00
    hours: 0
    minutes: 10
    seconds: 0
    overtime: false
    state: STOPPED
  display:
    mode: TIMER
  message:
    showing: true
