spec: renewedvision-pvp
command: get_layer
input:
  layer: '0'
expect_request:
  method: GET
  target: /api/0/data/layer/0
http_reply:
  status: 200
  body: '{"layer":{"isHidden":false,"name":"Layer 1","isMuted":false}}'
expect_result:
  ok:
    kind: value
    value:
      isHidden: false
      name: Layer 1
      isMuted: false
