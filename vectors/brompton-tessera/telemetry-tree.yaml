spec: brompton-tessera
telemetry: tree
inbound_http:
  path: /api/
  body: '{"api": {"override": {"blackout": {"enabled": true, "fade-time": 2.0}, "freeze": {"enabled":
    false}, "test-pattern": {"enabled": false, "type": "smpte-bars", "format": "from-input"}}, "presets":
    {"active": {"name": "Show", "number": 3}}, "output": {"global-colour": {"brightness": 1500, "colour-temperature":
    6504, "gains": {"red": 100.0, "green": 98.5, "blue": 100.0, "intensity": 100.0}}, "network": {"failover":
    {"state": {"is-active": true, "is-partner-present": false}}, "cable-redundancy": {"loops": {"1": {"state":
    "loop-found: A1->B1"}}}}}, "input": {"active": {"source": {"port-type": "hdmi", "port-number": 1}},
    "ports": {"hdmi": {"1": {"meta-data": {"refresh-rate": 50.0, "resolution": {"width": 3840, "height":
    2160}}}}}}, "groups": {"items": {"2": {"name": "Upstage", "brightness": 900}}}, "devices": {"statistics":
    {"online-count": 240, "error-count": 1}}, "system": {"software-version": "3.5.2", "processor-type":
    "sx40", "temperature": {"gpu": 51.5}}}}'
expect_state:
  override:
    blackout:
      enabled: true
      fade_time: 2.0
    freeze:
      enabled: false
    test_pattern:
      enabled: false
      type: smpte-bars
      format: from-input
  presets:
    active:
      name: Show
      number: 3
  output:
    global_colour:
      brightness: 1500
      colour_temperature: 6504
      gains:
        red: 100.0
        green: 98.5
        blue: 100.0
        intensity: 100.0
    network:
      failover:
        state:
          is_active: true
          is_partner_present: false
      cable_redundancy:
        loops:
          '1':
            state: 'loop-found: A1->B1'
  input:
    active:
      source:
        port_type: hdmi
        port_number: 1
    ports:
      hdmi:
        '1':
          meta_data:
            refresh_rate: 50.0
            resolution:
              width: 3840
              height: 2160
  groups:
    '2':
      name: Upstage
      brightness: 900
  devices:
    statistics:
      online_count: 240
      error_count: 1
  system:
    software_version: 3.5.2
    processor_type: sx40
    temperature:
      gpu: 51.5
