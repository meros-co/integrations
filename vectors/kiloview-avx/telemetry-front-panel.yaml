  body: '{"code":200,"message":"ok","data":{"id":1,"name":"panel1","alias":"panel1","panel_inputs":[{"id":1,"name":"input1","alias":"input1","icon_name":"input1","front_content":"input1"}],"panel_outputs":[{"id":1,"name":"output1","alias":"output1","lock":false,"input_id":1,"linked":false,"icon_name":"output1","front_content":"output1"}]}}'
