spec: kiloview-avx
command: add_panel_inputs
input:
  panel: 1
  inputs:
  - name: input1
    alias: Input 1
    c_name: Channel 1
    g_name: group1
    d_ip: 192.168.1.100
    d_port: 554
    url: 192.168.1.100:554
    enable: true
    dis_method: manual
    dis_g_name: public
    dis_d_ip: 192.168.1.100
    dis_s_ip: ''
    vlan_id: 100
    switcher_id: '0000000000000'
expect_request:
  method: POST
  target: /v1/panel/input/add
  body: '{"id":1,"inputs":[{"name":"input1","alias":"Input 1","c_name":"Channel 1","g_name":"group1","d_ip":"192.168.1.100","d_port":554,"url":"192.168.1.100:554","enable":true,"dis_method":"manual","dis_g_name":"public","dis_d_ip":"192.168.1.100","dis_s_ip":"","vlan_id":100,"switcher_id":"0000000000000"}]}'
  content_type: application/json
