spec: kiloview-avx
command: set_virtual_nic
input:
  vlan: 10
  enabled: true
  ip: 192.168.10.1
  netmask: 255.255.255.0
  type: static
  default_route: false
expect_request:
  method: POST
  target: /v1/preset/vlan/interface/set
  body: '{"vlan_id":10,"interface":{"enable":true,"ip":"192.168.10.1","netmask":"255.255.255.0","type":"static","is_default_route":false}}'
  content_type: application/json
