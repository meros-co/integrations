spec: kiloview-avx
telemetry: alarm-config
inbound_http:
  path: /v1/alarm/config/get
  body: '{"code":200,"message":"ok","data":{"cpu_enabled":true,"mem_enabled":true,"temp_enabled":false,"alarm_interval":1,"disconnect_alarm_enabled":true,"disconnect_duration":1}}'
expect_state:
  alarms:
    config:
      cpu: true
      memory: true
      temperature: false
      interval: 1
      disconnect: true
      disconnect_duration: 1
