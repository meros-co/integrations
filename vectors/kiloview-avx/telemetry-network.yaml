spec: kiloview-avx
telemetry: network
inbound_http:
  path: /api/networkmanager/report/get_network
  body: '{"code":200,"message":"ok","data":[{"name":"eth1.1","type":"eth","mac":"00:11:22:33:44:55","address":"192.168.1.100","netmask":"255.255.255.0","gw":"192.168.1.1","dns":"8.8.8.8","method":"static","status":"up","multicast":"yes","receive":102400,"transmit":51200}]}'
expect_state:
  network:
    interfaces:
      eth1.1:
        type: eth
        mac: 00:11:22:33:44:55
        ip: 192.168.1.100
        netmask: 255.255.255.0
        gateway: 192.168.1.1
        dns: 8.8.8.8
        method: static
        status: up
        multicast: 'yes'
        received: 102400
        transmitted: 51200
state_before:
  network:
    interfaces:
      eth0:
        status: down
