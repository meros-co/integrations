spec: kiloview-avx
command: modify_ptp_clock
input:
  clock: 1
  type: BC
  domain: 0
  two_step: true
  priority1: 128
  priority2: 128
  leap_second: false
  ports:
  - id: 1
    mode: e2e
    master: true
expect_request:
  method: POST
  target: /v1/ptp/modify
  body: '{"id":1,"type":"BC","domain":0,"two_step":true,"priority1":128,"priority2":128,"leap_s":false,"ports":[{"id":1,"mode":"e2e","master":true}]}'
  content_type: application/json
