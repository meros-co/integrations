spec: kiloview-avx
command: set_ports
input:
  settings:
    eee_enable: true
    poe_enable: true
    port_enable: true
    speed_duplex: auto
    ports:
    - 1
    - 3
expect_request:
  method: POST
  target: /v1/switch/port/set/batch
  body: '{"msg":{"eee_enable":true,"poe_enable":true,"port_enable":true,"speed_duplex":"auto","ports":[1,3]}}'
  content_type: application/json
