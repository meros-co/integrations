spec: kiloview-avx
telemetry: kls-binding
inbound_http:
  path: /v1/bindkls/bindinfo
  body: '{"code":200,"message":"ok","data":{"status":1,"bind_list":[{"id":1,"ip":"192.168.1.100","ifname":"1","bind_status":1}]}}'
expect_state:
  kls:
    binding_status: bound
    bindings:
      '1':
        ip: 192.168.1.100
        ifname: '1'
        status: bound
state_before:
  kls:
    bindings:
      '2':
        ip: 10.0.0.2
        status: failed
