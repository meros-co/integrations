spec: kiloview-avx
command: set_dhcp
input:
  vlan: 1
  interface_enabled: true
  interface_ip: 192.168.1.1
  interface_netmask: 255.255.255.0
  enabled: true
  pool_start: 192.168.1.100
  pool_end: 192.168.1.200
  dns: 8.8.8.8
  lease_days: 1
  lease_hours: 0
  lease_minutes: 0
expect_request:
  method: POST
  target: /v1/switch/dhcps/set
  body: '{"vlan_if":{"vlan_id":1,"enable":true,"ip":"192.168.1.1","netmask":"255.255.255.0"},"dhcp":{"vlan_id":1,"enable":true,"ip_pool":{"start":"192.168.1.100","end":"192.168.1.200"},"gateway":{"type":"default","ip":""},"dns":"8.8.8.8","lease_time":{"days":1,"hours":0,"minutes":0}}}'
  content_type: application/json
