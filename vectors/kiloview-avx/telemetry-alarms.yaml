spec: kiloview-avx
telemetry: alarms
inbound_http:
  path: /v1/alarm/events/levels/get?alarm_levels=1&alarm_levels=2&alarm_levels=3
  body: '{"code":200,"message":"ok","events_num":50,"error_total":10,"warning_total":30,"info_total":10,"data":[{"id":1,"status":1,"alarm_level":1,"time":"2024-01-01
    10:00:00","message":"CPU over 80%","source_port":1}]}'
expect_state:
