spec: kiloview-avx
command: set_alarm_config
input:
  cpu: true
  memory: true
  temperature: true
  interval: 5
  disconnect: true
  disconnect_duration: 30
expect_request:
  method: POST
  target: /v1/alarm/config/set
  body: '{"cpu_enabled":true,"mem_enabled":true,"temp_enabled":true,"alarm_interval":5,"disconnect_alarm_enabled":true,"disconnect_duration":30}'
  content_type: application/json
