spec: kiloview-avx
telemetry: front-panels
inbound_http:
  path: /v1/front/panel/query
  body: '{"code":200,"message":"ok","data":{"panels":[{"id":1,"name":"panel1","alias":"panel1"},{"id":2,"name":"panel2","alias":"panel2"}]}}'
expect_state:
  front_panels:
    '1':
      name: panel1
      alias: panel1
    '2':
      name: panel2
      alias: panel2
expect_then_send:
- method: GET
  target: /v1/front/panel/detail?panel_id=1
- method: GET
  target: /v1/front/panel/detail?panel_id=2
