spec: kiloview-avx
telemetry: topology-status-wires
inbound_http:
  path: /v1/topology/status/query
  body: '{"code":200,"message":"ok","data":{"nodes":[],"wires":[{"id":"w1","fill":"red","status":"offline","source":{"is_dev":false,"cell":"a","port":"1"},"target":{"is_dev":true,"cell":"b","port":""}}]}}'
expect_state:
  link_status:
    w1:
      status: offline
      fill: red
      source: a
      source_port: '1'
      source_is_device: false
      target: b
      target_port: ''
      target_is_device: true
