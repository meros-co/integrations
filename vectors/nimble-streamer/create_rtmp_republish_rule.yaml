spec: nimble-streamer
command: create_rtmp_republish_rule
input:
  src_app: live
  src_stream: stream
  dest_addr: 127.0.0.1
  dest_port: 1999
  dest_app: live-re
  dest_stream: dest_stream
expect_request:
  method: POST
  target: /manage/rtmp/republish
  body: '{"src_app":"live","src_stream":"stream","dest_addr":"127.0.0.1","dest_port":1999,"dest_app":"live-re","dest_stream":"dest_stream"}'
