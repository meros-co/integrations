spec: nimble-streamer
telemetry: playout
inbound_http:
  path: /manage/server_playlist_status
  body: '[{"stream": "live/first_playlist", "block_id": "33", "block_duration": 45, "main_stream": "live/stream1",
    "main_stream_type": "live", "main_stream_duration": 45, "default_stream": "/home/content/mp4/sample.mp4",
    "default_stream_type": "vod", "default_stream_duration": 45}, {"stream": "live/second_playlist", "block_id":
    "33", "block_duration": 113, "main_stream": "live/stream2", "main_stream_type": "live", "main_stream_duration":
    113}]'
expect_state:
  playout:
    live/first_playlist:
      block_id: '33'
      block_duration: 45
      main_stream: live/stream1
      main_stream_type: live
      main_stream_duration: 45
      default_stream: /home/content/mp4/sample.mp4
      default_stream_type: vod
      default_stream_duration: 45
    live/second_playlist:
      block_id: '33'
      block_duration: 113
      main_stream: live/stream2
      main_stream_type: live
      main_stream_duration: 113
