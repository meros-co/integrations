spec: shure-mxw
telemetry: transmitter-available
inbound: < REP 2 TX_AVAILABLE YES >
model: mxwapt8
expect_state:
  channels:
    '2':
      transmitter_available: 'YES'
expect_then_send:
- < GET 2 TX_STATUS >
- < GET 2 AUDIO_GAIN >
- < GET 2 BATT_RUN_TIME >
- < GET 2 BATT_CHARGE >
- < GET 2 BATT_HEALTH >
- < GET 2 BUTTON_STS >
- < GET 2 LED_STATUS >
- < GET 2 TX_TYPE >
