spec: barco-pulse
telemetry: profile-activated
model: i600
inbound: '{"jsonrpc":"2.0","method":"signal.callback","params":{"signal":[{"profile.profileactivated":{"name":"Show"}}]}}'
expect_state:
  signals:
    last:
      name: profile.profileactivated
      arguments: '{"name":"Show"}'
expect_then_send:
- '{"jsonrpc":"2.0","method":"property.get","params":{"property":"profile.profiles"},"id":1}'
- '{"jsonrpc":"2.0","method":"property.get","params":{"property":"profile.presetassignments"},"id":1}'
