spec: aja-bridge-live
command: create_pipeline
settings:
  password: password
input:
  pipeline:
    name: Pipeline 3
    inputs:
    - id: 0
      source:
        address:
          url: rtp://0.0.0.0:5003:lo
        streamType: MPEG_TS
        complianceWith: AUTO
      video:
        format: J2K
        width: 1920
        height: 1080
        sampling: '4:2:2'
        depth: 10
        scanRate: '24'
        scan: PROGRESSIVE
expect_request:
  method: POST
  target: /api/pipeline
  content_type: application/json
  body: '{"name":"Pipeline 3","inputs":[{"id":0,"source":{"address":{"url":"rtp://0.0.0.0:5003:lo"},"streamType":"MPEG_TS","complianceWith":"AUTO"},"video":{"format":"J2K","width":1920,"height":1080,"sampling":"4:2:2","depth":10,"scanRate":"24","scan":"PROGRESSIVE"}}]}'
http_reply:
  status: 201
  body: ''
expect_result:
  ok:
    kind: ack
