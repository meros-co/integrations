spec: kiloview-p3
command: set_wifi_connected
input:
  ssid: KILOVIEW_5G
  connected: false
expect_request:
  method: POST
  target: /api/networkmanager/wifi/set
  body: '{"enable":false,"wifi_ssid":"KILOVIEW_5G"}'
http_reply:
  status: 200
  body: '{"result":"ok","msg":"WiFi disconnected successfully!"}'
expect_result:
  ok:
    kind: ack
