spec: kiloview-p3
command: add_stream
input:
  config:
    type: hls
    name: HLS
    bindAudio: 1
    bindNetwork: auto
    mode: server
    segmentTime: 2
    maxSegments: 5
    session: live
    media_playlist_url: ''
expect_request:
  method: POST
  target: /api/streamer/v1/stream
  body: '{"type":"hls","name":"HLS","bindAudio":1,"bindNetwork":"auto","mode":"server","segmentTime":2,"maxSegments":5,"session":"live","media_playlist_url":""}'
http_reply:
  status: 200
  body: '{"result":"ok","msg":null}'
expect_result:
  ok:
    kind: ack
