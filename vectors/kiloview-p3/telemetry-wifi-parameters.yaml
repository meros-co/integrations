spec: kiloview-p3
telemetry: wifi-parameters
inbound_http:
  path: /api/networkmanager/hotspot/getWIFIParameter
  body: '{"result":"ok","data":{"country_code":"ALL","roaming":false,"roaming_rssi_thres":5,"roaming_scan_intv":5}}'
expect_state:
  wifi:
    country_code: ALL
    roaming: false
    roaming_rssi_threshold: 5
    roaming_scan_interval: 5
