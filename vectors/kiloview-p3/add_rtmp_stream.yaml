spec: kiloview-p3
command: add_rtmp_stream
input:
  name: YouTube
  address: rtmp://a.rtmp.youtube.com/live2/key
  bind_audio: 2
expect_request:
  method: POST
  target: /api/streamer/v1/stream
  body: '{"type":"rtmp","name":"YouTube","bindAudio":2,"bindNetwork":"auto","address":"rtmp://a.rtmp.youtube.com/live2/key","user":"","password":"","connIntv":5,"connTimeout":10}'
http_reply:
  status: 200
  body: '{"result":"ok","msg":null}'
expect_result:
  ok:
    kind: ack
