spec: kiloview-p3
command: ping
input:
  target: 192.168.35.215
expect_request:
  method: POST
  target: /api/systemctrl/system/ping
  body: '{"target_addr":"192.168.35.215"}'
http_reply:
  status: 200
  body: '{"result":"ok","data":{"loss_rate":0,"reachable":true},"msg":null}'
expect_result:
  ok:
    kind: value
    value:
      loss_rate: 0
      reachable: true
