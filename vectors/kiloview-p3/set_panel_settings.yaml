spec: kiloview-p3
command: set_panel_settings
input:
  video_source: HDMI
  codec: H265
  fps: '30'
  audio_source: HDMI
expect_request:
  method: POST
  target: /api/codec/panel/settings
  body: '{"video_source":"HDMI","codec":"H265","height":1080,"width":1920,"video_bitrate":4000,"fps":"30","audio_source":"HDMI","deinterlaceMode":"line_doubling","gain":0}'
http_reply:
  status: 200
  body: '{"result":"ok","msg":null}'
expect_result:
  ok:
    kind: ack
