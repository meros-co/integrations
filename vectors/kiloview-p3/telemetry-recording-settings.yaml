spec: kiloview-p3
telemetry: recording-settings
inbound_http:
  path: /api/record/record/get_record_info
  body: '{"result":"ok","data":{"disk_type":"largest","format":"ts","file_prefix":"REC","limit_type":"time-loop","limit_size":51200,"limit_time":60,"disk_policy":"noSpace","follow_timecode_start":false}}'
expect_state:
