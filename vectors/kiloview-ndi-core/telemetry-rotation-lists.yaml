spec: kiloview-ndi-core
telemetry: rotation-lists
inbound_http:
  path: /api/cube/v2/resource/rotation-list/all
  body: '{"result":"ok","msg":[{"id":1,"name":"aaa","src_num":2,"play_duration":20}]}'
expect_state:
  rotation_lists:
    '1':
      name: aaa
      source_count: 2
      play_duration: 20
state_before:
  rotation_lists:
    '4':
      name: gone
expect_then_send:
- method: GET
  target: /api/cube/v2/resource/rotation-list?id=1
- method: GET
  target: /api/cube/v2/resource/rotation-list/status?id=1
