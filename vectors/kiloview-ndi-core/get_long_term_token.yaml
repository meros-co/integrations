spec: kiloview-ndi-core
command: get_long_term_token
input:
  username: username
  password: password
expect_request:
  method: POST
  target: /api/cube/v2/user/token/permanent
  body: '{"username":"username","password":"password"}'
  content_type: application/json
http_reply:
  status: 200
  body: '{"result":"ok","msg":{"access_token":"eyJ.long.tok","token_type":"bearer"}}'
expect_result:
  ok:
    kind: value
    value: eyJ.long.tok
