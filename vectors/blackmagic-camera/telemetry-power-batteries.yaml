spec: blackmagic-camera
telemetry: power-batteries
inbound_http:
  path: /control/api/v1/camera/power
  body: '{"source":"AC","milliVolt":12000,"batteries":[{"milliVolt":16200,"chargeRemainingPercent":100,"statusFlags":[]},{"milliVolt":14100,"chargeRemainingPercent":35,"statusFlags":["Battery
    Is Present","Battery Is Charging"]}]}'
state_before:
  camera:
    power:
      batteries:
        '3':
          millivolt: 13000
expect_state:
  camera:
    power:
      source: AC
      millivolt: 12000
      batteries:
        '1':
          millivolt: 16200
          charge_percent: 100
          status_flags: '[]'
        '2':
          millivolt: 14100
          charge_percent: 35
          status_flags: '["Battery Is Present","Battery Is Charging"]'
          flags:
            Battery Is Present: true
            Battery Is Charging: true
