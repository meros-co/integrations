spec: blackmagic-camera
command: set_next_clip_slate
input:
  body:
    clip:
      scene: 12A
      take: 3
    lens:
      filter: ND 0.6
expect_request:
  method: PUT
  target: /control/api/v1/slates/nextClip
  body: '{"clip":{"scene":"12A","take":3},"lens":{"filter":"ND 0.6"}}'
http_reply:
  status: 200
  body: '{"clip":{"scene":"12A","take":3}}'
expect_result:
  ok:
    kind: ack
