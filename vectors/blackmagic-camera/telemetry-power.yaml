spec: blackmagic-camera
telemetry: power
inbound_http:
  path: /control/api/v1/camera/power
  body: '{"source":"Battery","milliVolt":14800,"batteries":[{"milliVolt":14800,"chargeRemainingPercent":80,"statusFlags":["Battery
    Is Present"]}]}'
expect_state:
  camera:
    power:
      source: Battery
      millivolt: 14800
      batteries:
        '1':
          millivolt: 14800
          charge_percent: 80
          status_flags: '["Battery Is Present"]'
          flags:
            Battery Is Present: true
