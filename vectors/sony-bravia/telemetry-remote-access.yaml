spec: sony-bravia
telemetry: remote-access
inbound_http:
  path: /sony/system
  request:
    method: getRemoteDeviceSettings
    id: 1
    params:
    - target: accessPermission
    version: '1.0'
  body: '{"result": [[{"currentValue": "on", "target": "accessPermission"}]], "id": 1}'
expect_state:
  remote_access: 'on'
