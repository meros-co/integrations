spec: sony-bravia
telemetry: web-app
inbound_http:
  path: /sony/appControl
  request:
    method: getWebAppStatus
    id: 1
    params: []
    version: '1.0'
  body: '{"result": [{"active": true, "url": "http://example.com/"}], "id": 1}'
expect_state:
  webapp:
    active: true
    url: http://example.com/
