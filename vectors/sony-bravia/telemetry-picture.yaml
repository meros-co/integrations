spec: sony-bravia
telemetry: picture
inbound_http:
  path: /sony/video
  request:
    method: getPictureQualitySettings
    id: 1
    params:
    - target: ''
    version: '1.0'
  body: '{"result": [[{"target": "color", "currentValue": "2", "isAvailable": true, "candidate": [{"max":
    100, "min": 0, "step": 1}]}]], "id": 1}'
expect_state:
  picture:
    color:
      value: '2'
      available: true
      candidates: '[{"max":100,"min":0,"step":1}]'
