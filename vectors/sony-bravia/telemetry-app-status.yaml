spec: sony-bravia
telemetry: app-status
inbound_http:
  path: /sony/appControl
  request:
    method: getApplicationStatusList
    id: 1
    params: []
    version: '1.0'
  body: '{"result": [[{"name": "textInput", "status": "off"}, {"name": "webBrowse", "status": "on"}]],
    "id": 1}'
expect_state:
  apps:
    status:
      textInput: 'off'
      webBrowse: 'on'
