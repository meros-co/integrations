spec: sony-bravia
telemetry: volume
inbound_http:
  path: /sony/audio
  request:
    method: getVolumeInformation
    id: 1
    params: []
    version: '1.0'
  body: '{"result": [[{"volume": 25, "minVolume": 0, "mute": false, "maxVolume": 100, "target": "speaker"},
    {"volume": 10, "minVolume": 0, "mute": true, "maxVolume": 100, "target": "headphone"}]], "id": 1}'
expect_state:
  audio:
    speaker:
      volume: 25
      mute: false
      max: 100
      min: 0
    headphone:
      volume: 10
      mute: true
      max: 100
      min: 0
