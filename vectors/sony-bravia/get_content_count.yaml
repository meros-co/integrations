spec: sony-bravia
command: get_content_count
input:
  source: extInput:hdmi
expect_request:
  method: POST
  target: /sony/avContent
  body: '{"method":"getContentCount","id":1,"params":[{"source":"extInput:hdmi"}],"version":"1.1"}'
http_reply:
  status: 200
  body: '{"result": [{"count": 4}], "id": 1}'
expect_result:
  ok:
    kind: value
    value: 4
