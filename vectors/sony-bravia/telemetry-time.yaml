spec: sony-bravia
telemetry: time
inbound_http:
  path: /sony/system
  request:
    method: getCurrentTime
    id: 1
    params: []
    version: '1.1'
  body: '{"result": [{"dateTime": "2018-10-03T13:03:59+0100", "timeZoneOffsetMinute": 60, "dstOffsetMinute":
    60}], "id": 1}'
expect_state:
  clock:
    time: 2018-10-03T13:03:59+0100
    timezone_offset_min: 60
    dst_offset_min: 60
