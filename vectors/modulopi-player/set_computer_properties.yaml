spec: modulopi-player
command: set_computer_properties
input:
  properties:
    audioMaster: 0.8
expect_wire: '{"jsonrpc":"2.0","method":"set.property.computer","params":{"properties":{"audioMaster":0.8}},"id":"set
  computer"}'
device_reply: '{"jsonrpc":"2.0","result":{"changed":["audioMaster"]},"id":"set computer"}'
expect_result:
  ok:
    kind: value
    value:
      changed:
      - audioMaster
