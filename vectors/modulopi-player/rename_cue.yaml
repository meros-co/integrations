spec: modulopi-player
command: rename_cue
input:
  playlist: Main
  cue: 1
  name: Opening
expect_wire: '{"jsonrpc":"2.0","method":"set.cue.settings","params":{"playlistname":"Main","cueindex":1,"property":"name","value":"Opening"},"id":"rename
  cue"}'
device_reply: '{"jsonrpc":"2.0","result":{"changed":["name"]},"id":"rename cue"}'
expect_result:
  ok:
    kind: value
    value:
      changed:
      - name
