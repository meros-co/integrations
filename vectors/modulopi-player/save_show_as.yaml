spec: modulopi-player
command: save_show_as
input:
  name: Copy.xml
  overwrite: true
expect_wire: '{"jsonrpc":"2.0","method":"saveas.show","params":{"name":"Copy.xml","overwrite":true},"id":"save
  as"}'
device_reply: '{"jsonrpc":"2.0","result":{"name":"Copy.xml","replaced":true},"id":"save as"}'
expect_result:
  ok:
    kind: value
    value:
      name: Copy.xml
      replaced: true
