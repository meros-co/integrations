spec: modulopi-player
command: list_backups
input:
  filter: MyShow
expect_wire: '{"jsonrpc":"2.0","method":"get.list.backups","params":{"filter":"MyShow"},"id":"backups"}'
device_reply: '{"jsonrpc":"2.0","result":{"count":0,"backups":[]},"id":"backups"}'
expect_result:
  ok:
    kind: value
    value:
      count: 0
      backups: []
