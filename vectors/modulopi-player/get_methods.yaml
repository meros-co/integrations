spec: modulopi-player
command: get_methods
input:
  prefix: mixer.
expect_wire: '{"jsonrpc":"2.0","method":"get.list.methods","params":{"prefix":"mixer."},"id":"methods"}'
device_reply: '{"jsonrpc":"2.0","result":[{"method":"mixer.take"}],"id":"methods"}'
expect_result:
  ok:
    kind: value
    value:
    - method: mixer.take
