spec: modulopi-player
command: set_cue_settings
input:
  playlist: Main
  cue: 2
  settings:
    trigger: wait
    triggerTime: 1500
expect_wire: '{"jsonrpc":"2.0","method":"set.cue.settings","params":{"playlistname":"Main","cueindex":2,"settings":{"trigger":"wait","triggerTime":1500}},"id":"cue
  settings"}'
device_reply: '{"jsonrpc":"2.0","result":{"changed":["trigger"]},"id":"cue settings"}'
expect_result:
  ok:
    kind: value
    value:
      changed:
      - trigger
