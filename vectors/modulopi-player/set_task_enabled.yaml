spec: modulopi-player
command: set_task_enabled
input:
  task: Open
  enabled: false
expect_wire: '{"jsonrpc":"2.0","method":"set.task","params":{"name":"Open","taskEnable":false},"id":"set
  task"}'
device_reply: '{"jsonrpc":"2.0","result":{"changed":["taskEnable"]},"id":"set task"}'
expect_result:
  ok:
    kind: value
    value:
      changed:
      - taskEnable
