spec: modulopi-player
command: call
input:
  method: set.playlist.fader
  params:
    playlistname: Main
    grandmaster: 0
    time: 3000
expect_wire: '{"jsonrpc":"2.0","method":"set.playlist.fader","params":{"playlistname":"Main","grandmaster":0,"time":3000},"id":"call"}'
device_reply: '{"jsonrpc":"2.0","result":{"grandMaster":0,"timeMs":3000},"id":"call"}'
expect_result:
  ok:
    kind: value
    value:
      grandMaster: 0
      timeMs: 3000
