spec: modulopi-player
command: delete_cue
input:
  playlist: Main
  cue: 4
expect_wire: '{"jsonrpc":"2.0","method":"delete.cues","params":{"playlistname":"Main","cueindex":4},"id":"delete
  cue"}'
device_reply: '{"jsonrpc":"2.0","result":{"deleted":[]},"id":"delete cue"}'
expect_result:
  ok:
    kind: value
    value:
      deleted: []
