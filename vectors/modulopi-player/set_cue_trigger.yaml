spec: modulopi-player
command: set_cue_trigger
input:
  playlist: Main
  cue: 3
  trigger: follow
expect_wire: '{"jsonrpc":"2.0","method":"set.cue.settings","params":{"playlistname":"Main","cueindex":3,"settings":{"trigger":"follow","triggerTime":0}},"id":"cue
  trigger"}'
device_reply: '{"jsonrpc":"2.0","result":{"changed":["trigger"]},"id":"cue trigger"}'
expect_result:
  ok:
    kind: value
    value:
      changed:
      - trigger
