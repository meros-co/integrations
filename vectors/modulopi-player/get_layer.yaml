spec: modulopi-player
command: get_layer
input:
  playlist: Main
  cue: 1
  layer: 2
expect_wire: '{"jsonrpc":"2.0","method":"get.object.layer","params":{"playlistname":"Main","cueindex":1,"layerindex":2},"id":"layer"}'
device_reply: '{"jsonrpc":"2.0","result":{"index":2},"id":"layer"}'
expect_result:
  ok:
    kind: value
    value:
      index: 2
