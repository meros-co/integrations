spec: modulopi-player
command: set_playlist_settings
input:
  playlist: Main
  settings:
    autoStart: true
expect_wire: '{"jsonrpc":"2.0","method":"set.playlist.settings","params":{"playlistname":"Main","settings":{"autoStart":true}},"id":"set
  playlist settings"}'
device_reply: '{"jsonrpc":"2.0","result":{"changed":["autoStart"]},"id":"set playlist settings"}'
expect_result:
  ok:
    kind: value
    value:
      changed:
      - autoStart
