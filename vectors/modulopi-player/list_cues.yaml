spec: modulopi-player
command: list_cues
input:
  playlist: Main
expect_wire: '{"jsonrpc":"2.0","method":"get.list.cues","params":{"playlistname":"Main","offset":0,"limit":200},"id":"cues"}'
device_reply: '{"jsonrpc":"2.0","result":{"total":1,"cues":[{"name":"Intro"}]},"id":"cues"}'
expect_result:
  ok:
    kind: value
    value:
      total: 1
      cues:
      - name: Intro
