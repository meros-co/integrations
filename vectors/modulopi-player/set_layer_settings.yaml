spec: modulopi-player
command: set_layer_settings
input:
  playlist: Main
  cue: 1
  layer: 2
  settings:
    opacity: 0.5
expect_wire: '{"jsonrpc":"2.0","method":"set.layer.settings","params":{"playlistname":"Main","cueindex":1,"layerindex":2,"settings":{"opacity":0.5}},"id":"layer
  settings"}'
device_reply: '{"jsonrpc":"2.0","result":{"changed":["opacity"]},"id":"layer settings"}'
expect_result:
  ok:
    kind: value
    value:
      changed:
      - opacity
