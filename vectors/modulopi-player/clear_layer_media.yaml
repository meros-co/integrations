spec: modulopi-player
command: clear_layer_media
input:
  playlist: Main
  cue: 1
  layer: 2
  slot: mask
expect_wire: '{"jsonrpc":"2.0","method":"clear.layer.media","params":{"playlistname":"Main","cueindex":1,"layerindex":2,"slot":"mask"},"id":"clear
  layer"}'
device_reply: '{"jsonrpc":"2.0","result":{"index":2},"id":"clear layer"}'
expect_result:
  ok:
    kind: value
    value:
      index: 2
