spec: modulopi-player
command: get_playlist_settings
input:
  playlist: Main
expect_wire: '{"jsonrpc":"2.0","method":"get.playlist.settings","params":{"playlistname":"Main"},"id":"playlist
  settings"}'
device_reply: '{"jsonrpc":"2.0","result":{"autoStart":false},"id":"playlist settings"}'
expect_result:
  ok:
    kind: value
    value:
      autoStart: false
