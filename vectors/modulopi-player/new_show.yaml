spec: modulopi-player
command: new_show
input:
  name: New.xml
expect_wire: '{"jsonrpc":"2.0","method":"new.show","params":{"name":"New.xml","overwrite":false},"id":"new
  show"}'
device_reply: '{"jsonrpc":"2.0","result":{"name":"New.xml","ready":true},"id":"new show"}'
expect_result:
  ok:
    kind: value
    value:
      name: New.xml
      ready: true
