spec: modulopi-player
command: set_layer_media
input:
  playlist: Main
  cue: 1
  layer: 2
  media: hello.mov
expect_wire: '{"jsonrpc":"2.0","method":"set.layer.media","params":{"playlistname":"Main","cueindex":1,"layerindex":2,"media":"hello.mov","slot":"media"},"id":"layer
  media"}'
device_reply: '{"jsonrpc":"2.0","result":{"index":2},"id":"layer media"}'
expect_result:
  ok:
    kind: value
    value:
      index: 2
