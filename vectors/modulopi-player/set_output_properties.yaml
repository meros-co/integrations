spec: modulopi-player
command: set_output_properties
input:
  output: 1
  properties:
    ndiStreamEnable: 1
expect_wire: '{"jsonrpc":"2.0","method":"set.property.output","params":{"index":1,"properties":{"ndiStreamEnable":1}},"id":"set
  output"}'
device_reply: '{"jsonrpc":"2.0","result":{"changed":["ndiStreamEnable"]},"id":"set output"}'
expect_result:
  ok:
    kind: value
    value:
      changed:
      - ndiStreamEnable
