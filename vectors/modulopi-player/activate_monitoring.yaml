spec: modulopi-player
command: activate_monitoring
input:
  preset: 1
expect_wire: '{"jsonrpc":"2.0","method":"set.property.monitoring","params":{"index":1,"property":"active","value":true},"id":"monitoring
  active"}'
device_reply: '{"jsonrpc":"2.0","result":{"changed":["active"]},"id":"monitoring active"}'
expect_result:
  ok:
    kind: value
    value:
      changed:
      - active
