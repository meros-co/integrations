spec: modulopi-player
command: move_cue
input:
  playlist: Main
  cue: 4
  to: 1
expect_wire: '{"jsonrpc":"2.0","method":"set.cue.index","params":{"playlistname":"Main","cueindex":4,"newindex":1},"id":"move
  cue"}'
device_reply: '{"jsonrpc":"2.0","result":{"index":1},"id":"move cue"}'
expect_result:
  ok:
    kind: value
    value:
      index: 1
