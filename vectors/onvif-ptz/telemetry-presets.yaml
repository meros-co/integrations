spec: onvif-ptz
telemetry: presets
settings:
  profile_token: Profile_1
  video_source_token: VideoSource_1
inbound_http:
  path: /onvif/ptz_service
  body: <?xml version="1.0" encoding="UTF-8"?><env:Envelope xmlns:env="http://www.w3.org/2003/05/soap-envelope"
    xmlns:tt="http://www.onvif.org/ver10/schema" xmlns:tptz="http://www.onvif.org/ver20/ptz/wsdl"><env:Body><tptz:GetPresetsResponse><tptz:Preset
    token="1"><tt:Name>Home</tt:Name><tt:PTZPosition><tt:PanTilt x="0" y="0"/><tt:Zoom x="0"/></tt:PTZPosition></tptz:Preset><tptz:Preset
    token="2"><tt:Name>Pulpit</tt:Name><tt:PTZPosition><tt:PanTilt x="0.3" y="-0.1"/><tt:Zoom x="0.6"/></tt:PTZPosition></tptz:Preset></tptz:GetPresetsResponse></env:Body></env:Envelope>
expect_state:
  presets:
    '1':
      name: Home
      pan: 0.0
      tilt: 0.0
      zoom: 0.0
    '2':
      name: Pulpit
      pan: 0.3
      tilt: -0.1
      zoom: 0.6
state_before:
  presets:
    '7':
      name: Gone
