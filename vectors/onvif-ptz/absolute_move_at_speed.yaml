spec: onvif-ptz
command: absolute_move_at_speed
input:
  pan: -1
  tilt: 1
  zoom: 1
  pan_tilt_speed: 0.5
  zoom_speed: 1
settings:
  profile_token: Profile_1
  video_source_token: VideoSource_1
expect_request:
  method: POST
  target: /onvif/ptz_service
  content_type: application/soap+xml; charset=utf-8
  body: <?xml version="1.0" encoding="UTF-8"?><s:Envelope xmlns:s="http://www.w3.org/2003/05/soap-envelope"
    xmlns:tt="http://www.onvif.org/ver10/schema" xmlns:tptz="http://www.onvif.org/ver20/ptz/wsdl"><s:Body><tptz:AbsoluteMove><tptz:ProfileToken>Profile_1</tptz:ProfileToken><tptz:Position><tt:PanTilt
    x="-1.0000" y="1.0000"/><tt:Zoom x="1.0000"/></tptz:Position><tptz:Speed><tt:PanTilt x="0.5000" y="0.5000"/><tt:Zoom
    x="1.0000"/></tptz:Speed></tptz:AbsoluteMove></s:Body></s:Envelope>
