spec: onvif-ptz
telemetry: video-sources
settings:
  profile_token: Profile_1
  video_source_token: VideoSource_1
inbound_http:
  path: /onvif/media_service
  body: <?xml version="1.0" encoding="UTF-8"?><env:Envelope xmlns:env="http://www.w3.org/2003/05/soap-envelope"
    xmlns:tt="http://www.onvif.org/ver10/schema" xmlns:trt="http://www.onvif.org/ver10/media/wsdl"><env:Body><trt:GetVideoSourcesResponse><trt:VideoSources
    token="VideoSource_1"><tt:Framerate>30</tt:Framerate><tt:Resolution><tt:Width>1920</tt:Width><tt:Height>1080</tt:Height></tt:Resolution></trt:VideoSources></trt:GetVideoSourcesResponse></env:Body></env:Envelope>
expect_state:
  video_sources:
    VideoSource_1:
      frame_rate: 30.0
      width: 1920
      height: 1080
