spec: onvif-ptz
command: goto_preset
input:
  preset: '9'
settings:
  profile_token: Profile_1
  video_source_token: VideoSource_1
expect_request:
  method: POST
  target: /onvif/ptz_service
  content_type: application/soap+xml; charset=utf-8
  body: <?xml version="1.0" encoding="UTF-8"?><s:Envelope xmlns:s="http://www.w3.org/2003/05/soap-envelope"
    xmlns:tt="http://www.onvif.org/ver10/schema" xmlns:tptz="http://www.onvif.org/ver20/ptz/wsdl"><s:Body><tptz:GotoPreset><tptz:ProfileToken>Profile_1</tptz:ProfileToken><tptz:PresetToken>9</tptz:PresetToken></tptz:GotoPreset></s:Body></s:Envelope>
http_reply:
  status: 500
  body: <s:Fault/>
expect_result:
  error:
    error: device_error
    code: '500'
