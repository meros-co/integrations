spec: onvif-ptz
command: continuous_move
input:
  pan: 0.5
  tilt: 0
  zoom: 0
settings:
  profile_token: Profile_1
  video_source_token: VideoSource_1
expect_request:
  method: POST
  target: /onvif/ptz_service
  content_type: application/soap+xml; charset=utf-8
  body: <?xml version="1.0" encoding="UTF-8"?><s:Envelope xmlns:s="http://www.w3.org/2003/05/soap-envelope"
    xmlns:tt="http://www.onvif.org/ver10/schema" xmlns:tptz="http://www.onvif.org/ver20/ptz/wsdl"><s:Body><tptz:ContinuousMove><tptz:ProfileToken>Profile_1</tptz:ProfileToken><tptz:Velocity><tt:PanTilt
    x="0.5000" y="0.0000"/><tt:Zoom x="0.0000"/></tptz:Velocity></tptz:ContinuousMove></s:Body></s:Envelope>
