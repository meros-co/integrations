expect_state:
  device:
    name: Ultra Encode A304201201001
    auto_check_update: true
  audio:
    sync_offset_ms: 0
    encoder:
      sample_rate: 48000
      channels: 2
      kbps: 128
    volume:
      input_on: true
      input_gain: -6.5
      line_in_on: true
      line_in_gain: 0.0
      line_out_on: true
      line_out_gain: 0.0
  network:
    udp_mtu: 1496
    softap:
      enabled: true
      visible: true
      ssid: A304201201001
    ethernet:
      config:
        dhcp: true
        ip: ''
        mask: ''
        router: ''
        dns: ''
    wifi:
      config:
        dhcp: false
        ip: 192.168.8.20
        mask: 255.255.255.0
        router: 192.168.8.1
        dns: 192.168.8.1
  video:
    deinterlace: true
    color:
      contrast: 100
      brightness: 0
      saturation: 100
      hue: 0
    input_format:
      color_auto: true
      color_format: 3
      quant_auto: true
      quant_range: 2
    output_format:
      color_auto: false
      color_format: 3
      quant_auto: true
      quant_range: 2
      sat_auto: true
      sat_range: 2
  encoder:
    main-stream:
      follow_input: false
      codec: 0
      width: 1920
      height: 1080
      frame_interval: 0
      kbps: 20480
      gop: 1
      profile: 2
      stat_seconds: 60
      full_range: false
      vbr: false
      min_qp: 0
      max_qp: 0
      timecode_sei: 0
      caption_sei: false
      aspect: 2
    sub-stream:
      enabled: true
      codec: 0
      width: 1280
      height: 720
      frame_interval: 333333
      kbps: 4096
      gop: 5
      profile: 2
      stat_seconds: 60
      full_range: true
      vbr: false
      min_qp: 0
      max_qp: 0
      timecode_sei: 0
      caption_sei: false
      aspect: 2
  live:
    servers:
      '0':
        type: 0
        service: rtmp
        name: 192.168.1.123
        enabled: false
        url: 192.168.1.123:345/live
        auth: false
        user: ''
        net_mode: 1
  nosignal:
    enabled: true
    images:
      '0':
        selected: false
        custom: false
        path: /no-signal/default0.jpg
        time: 0
      '1':
        selected: true
        custom: false
        path: /no-signal/default1.jpg
        time: 0
state_before:
  live:
    servers:
      '5':
        name: Gone
  nosignal:
    images:
      '3':
        path: /no-signal/x.jpg
