spec: magewell-ultra-encode
telemetry: wifi-scan
inbound_http:
  path: /usapi?method=scan-wifi-results
  body: '{"result": 0, "user-items": [{"name": "MWL1", "freq": 5785, "level": -35, "is-auto": 1, "is-use":
    1}], "scan-items": [{"name": "Guest", "freq": 2412, "level": -70, "is-auto": 0, "is-use": 0}]}'
