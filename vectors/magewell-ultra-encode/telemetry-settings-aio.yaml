spec: magewell-ultra-encode
telemetry: settings-aio
inbound_http:
  path: /usapi?method=get-settings
  body: '{"result": 0, "living-kbps": 32768, "enable-advanced-pcr": 0, "enable-ndi-hx3": 0, "date-time":
    {"timezone": "Asia/Shanghai", "is-auto": 1, "ntp-server": "0.pool.ntp.org", "ntp-server-backup": "1.pool.ntp.org"},
    "input-source": {"source": 1, "mixer": {"input-device": 2, "is-hdmi-top": 0, "type": 0, "location":
    2}}, "video-color": {"hdmi": {"contrast": 100, "brightness": 0, "saturation": 100, "hue": 0}, "sdi":
    {"contrast": 120, "brightness": 5, "saturation": 90, "hue": -3}}, "volume": {"is-spi": 1, "spi-gain":
    0, "is-linein": 1, "linein-gain": 127, "is-lineout": 0, "lineout-gain": -600, "enable-mic-bias": 0},
    "3d-output": {"enable": 0, "mode": 1}, "main-stream": {"is-auto": 0, "codec": 1, "cx": 1920, "cy":
    1080, "duration": 0, "kbps": 8192, "gop": 60, "profile": 0, "cbrstat": 60, "fullrange": 0, "is-vbr":
    0, "min-vbr-qp": 0, "max-vbr-qp": 0, "is-time-code-sei": 1, "is-closed-caption-sei": 0, "ar-convert-mode":
    2, "rotation": 0, "mirroring": 0}, "audio-streams": [{"sample-rate": 48000, "channels": 0, "kbps":
    256, "ch0": 0, "ch1": 1}, {"sample-rate": 48000, "channels": 2, "kbps": 32, "ch0": 2, "ch1": 1}],
    "rndis": {"ip": "192.168.66.1", "mask": "255.255.255.0"}, "stream-server": [{"id": 0, "type": 130,
    "name": "NDI HX", "is-use": 0, "source-name": "#serial-no#", "group-name": "public", "enable-discovery":
    0, "discovery-server": "", "transport-mode": 3, "mcast-addr": "", "mcast-mask": "", "mcast-ttl": 0,
    "enable-fail-over": 0, "fail-over-ndi-name": "", "fail-over-ip-addr": "", "enable-web-control": 0,
    "enable-ptz-control": 0, "main-stream": 0, "prvw-stream": 1, "audio": 2, "opt": 0, "is-media-hub":
    0}], "video-input-format": {"hdmi": {"is-color-fmt": 0, "color-fmt": 1, "is-quant-range": 0, "quant-range":
    1}, "sdi": {"is-color-fmt": 1, "color-fmt": 3, "is-quant-range": 1, "quant-range": 2}}, "video-output-format":
    {"sdi": {"is-color-fmt": 0, "color-fmt": 3, "is-quant-range": 0, "quant-range": 2, "is-sat-range":
    1, "sat-range": 3}}, "nas": [{"id": 0, "type": 2, "proto": 0, "is-use": 1, "addr": "10.10.14.193",
    "mount": "/home/magewell/nfs"}], "send-file-cloud": [{"id": 0, "type": 0, "is-use": 1, "url": "ftp.example.com",
    "port": 21, "dir-name": "rec", "user-name": "u", "net-mode": 1}], "web": {"is-http": 1, "http-port":
    80, "is-https": 0, "https-port": 443, "is-cert-valid": 0, "is-cert-key-valid": 0, "theme": 0}, "rec":
    {"is-auto": 0, "trigger-mode": 0}, "living": {"ts": {"mtu": 1497}, "hls-push": {"seg-count": 3, "seg-duration":
    3}}, "lcd-control": {"no-touch": 0, "page-idx": 3, "no-flip": 0}}'
expect_state:
  live:
    total_kbps: 32768
    advanced_pcr: false
    ts_mtu: 1497
    hls_push:
      segments: 3
      duration: 3
    servers:
      '0':
        type: 130
        service: ndi-hx
        name: NDI HX
        enabled: false
        source_name: '#serial-no#'
        groups: public
        discovery: false
        discovery_server: ''
        transport: 3
        mcast_address: ''
        mcast_mask: ''
        mcast_ttl: 0
        failover: false
        failover_name: ''
        failover_address: ''
        web_control: false
        ptz_control: false
        audio: 2
        media_hub: false
  ndi:
    hx3: false
  time:
    zone: Asia/Shanghai
    auto: true
    ntp_server: 0.pool.ntp.org
    ntp_backup: 1.pool.ntp.org
  input:
    source: 1
    mixer:
      format: 2
      hdmi_on_top: false
      type: 0
      location: 2
  inputs:
    hdmi:
      color:
        contrast: 100
        brightness: 0
        saturation: 100
        hue: 0
      input_format:
        color_auto: true
        color_format: 1
        quant_auto: true
        quant_range: 1
    sdi:
      color:
        contrast: 120
        brightness: 5
        saturation: 90
        hue: -3
      input_format:
        color_auto: false
        color_format: 3
        quant_auto: false
        quant_range: 2
      output_format:
        color_auto: true
        color_format: 3
        quant_auto: true
        quant_range: 2
        sat_auto: false
        sat_range: 3
  audio:
    volume:
      input_on: true
      input_gain: 0.0
      line_in_on: true
      line_in_gain: 1.27
      line_out_on: false
      line_out_gain: -6.0
      mic_bias: false
    streams:
      '1':
        sample_rate: 48000
        channels: 0
        kbps: 256
        map: '{"sample-rate":48000,"channels":0,"kbps":256,"ch0":0,"ch1":1}'
      '2':
        sample_rate: 48000
        channels: 2
        kbps: 32
        map: '{"sample-rate":48000,"channels":2,"kbps":32,"ch0":2,"ch1":1}'
  video:
    output_3d: false
    output_3d_mode: 1
  encoder:
    main-stream:
      follow_input: false
      codec: 1
      width: 1920
      height: 1080
      frame_interval: 0
      kbps: 8192
      gop: 60
      profile: 0
      stat_seconds: 60
      full_range: false
      vbr: false
      min_qp: 0
      max_qp: 0
      timecode_sei: 1
      caption_sei: false
      aspect: 2
      rotation: 0
      mirroring: false
  network:
    usb:
      ip: 192.168.66.1
      mask: 255.255.255.0
  storage:
    nas:
      '0':
        type: 2
        protocol: 0
        enabled: true
        address: 10.10.14.193
        mount: /home/magewell/nfs
  upload:
    servers:
      '0':
        type: 0
        enabled: true
        url: ftp.example.com
        port: 21
        folder: rec
        user: u
        net_mode: 1
  web:
    http: true
    http_port: 80
    https: false
    https_port: 443
    cert_valid: false
    key_valid: false
    theme: 0
  record:
    auto: false
    trigger: 0
  lcd:
    touch: false
    page: 3
    flip: false
model: aio
state_before:
  audio:
    streams:
      '3':
        kbps: 128
  storage:
    nas:
      '2':
        address: x
  upload:
    servers:
      '4':
        url: x
