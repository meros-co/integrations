spec: magewell-ultra-encode
telemetry: signal-hdmi
inbound_http:
  path: /usapi?method=get-signal-info&input-device=2
  body: '{"result": 0, "signal-info-types": ["video-info", "audio-info", "hdmi-info"], "hdmi-info": {"mode":
    "hdmi", "vic": 0, "hdcp": false, "it-content": false, "3d-format": false, "timing-h-total": 1650},
    "audio-info": {"codec": "lpcm", "num-channels": 2, "sample-rate": 48000, "bit-count": 16}, "video-info":
    {"codec": "uncompressed", "width": 1280, "height": 720, "scan": "progressive", "field-rate": 60.0,
    "color-depth": 8, "color-format": "bt.709", "aspect-ratio": "16:9", "sampling": "4:4:4", "quant-range":
    "limited", "sat-range": "limited", "frame-struct": "2d"}}'
expect_state:
  inputs:
    hdmi:
      info:
        video:
          codec: uncompressed
          width: 1280
          height: 720
          scan: progressive
          field_rate: 60.0
          color_depth: 8
          color_format: bt.709
          aspect_ratio: '16:9'
          sampling: '4:4:4'
          quant_range: limited
          sat_range: limited
          frame_struct: 2d
        audio:
          codec: lpcm
          channels: 2
          sample_rate: 48000
          bits: 16
        hdmi:
          mode: hdmi
          vic: 0
          hdcp: false
          it_content: false
          format_3d: false
          timing: '{"mode":"hdmi","vic":0,"hdcp":false,"it-content":false,"3d-format":false,"timing-h-total":1650}'
model: aio
