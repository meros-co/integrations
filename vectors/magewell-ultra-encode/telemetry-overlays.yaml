spec: magewell-ultra-encode
telemetry: overlays
inbound_http:
  path: /usapi?method=get-surfaces
  body: '{"result": 0, "main-surface": 1, "second-surface": 0, "surfaces": [{"id": 3, "type": 0, "is-use":
    1, "stream-index": 0, "position": 6, "x-offset": 0, "y-offset": 0, "margin": 20, "text": "Live", "font-size":
    48, "font-color": "#ffffff"}]}'
expect_state:
  overlays:
    main_enabled: true
    sub_enabled: false
    items:
      '3':
        type: 0
        enabled: true
        stream_index: 0
        position: 6
        x: 0
        y: 0
        margin: 20
        text: Live
        font_size: 48
        color: '#ffffff'
model: aio
state_before:
  overlays:
    items:
      '9':
        text: Gone
