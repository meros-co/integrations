spec: matrox-monarch-hd
telemetry: status-streaming
inbound_http:
  path: /Monarch/syncconnect/sdk.aspx?command=GetStatus
  body: "RECORD: DISABLED, STREAM:RTMP,ON, NAME:DEVICE5\r\n"
expect_state:
  device:
    name: DEVICE5
  record:
    state: DISABLED
    active: false
  stream:
    mode: RTMP
    state: 'ON'
    active: true
