spec: mediamtx
command: set_auth_internal_users
input:
  users:
  - user: any
    pass: ''
    ips: []
    permissions:
    - action: read
      path: ''
  - user: operator
    pass: s3cret
    ips:
    - 10.0.0.0/24
    permissions:
    - action: api
    - action: publish
      path: ''
expect_request:
  method: PATCH
  target: /v3/config/global/patch
  body: '{"authInternalUsers":[{"user":"any","pass":"","ips":[],"permissions":[{"action":"read","path":""}]},{"user":"operator","pass":"s3cret","ips":["10.0.0.0/24"],"permissions":[{"action":"api"},{"action":"publish","path":""}]}]}'
