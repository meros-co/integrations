spec: matrox-monarch-lcs
telemetry: status-spaced
inbound_http:
  path: /Monarch/syncconnect/sdk.aspx?command=GetStatus
  body: 'ENC1:RECORD,ON, ENC2:NONE,DISABLED,FILETRANSFER:OFF,NAME:DEVICE3

    '
expect_state:
  device:
    name: DEVICE3
  file_transfer:
    state: 'OFF'
    'on': false
  encoders:
    '1':
      mode: RECORD
      state: 'ON'
      active: true
    '2':
      mode: NONE
      state: DISABLED
      active: false
