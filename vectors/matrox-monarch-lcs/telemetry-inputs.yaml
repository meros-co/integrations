spec: matrox-monarch-lcs
telemetry: inputs
inbound_http:
  path: /Monarch/syncconnect/sdk.aspx?command=GetInputStatus
  body: 'SDI A: 1920x1080i, 29.97 fps;HDMI B: 1920x1080p, 60 fps'
expect_state:
  input:
    status: 'SDI A: 1920x1080i, 29.97 fps;HDMI B: 1920x1080p, 60 fps'
  inputs:
    a:
      connector: SDI
      width: 1920
      height: 1080
      scan: interlaced
      frame_rate: 29.97
    b:
      connector: HDMI
      width: 1920
      height: 1080
      scan: progressive
      frame_rate: 60.0
