spec: matrox-monarch-lcs
telemetry: status
inbound_http:
  path: /Monarch/syncconnect/sdk.aspx?command=GetStatus
  body: ENC1:RECORD,READY,ENC2:RTMP,READY,FILETRANSFER:ON,NAME:DEVICE1
expect_state:
  device:
    name: DEVICE1
  file_transfer:
    state: 'ON'
    'on': true
  encoders:
    '1':
      mode: RECORD
      state: READY
      active: false
    '2':
      mode: RTMP
      state: READY
      active: false
