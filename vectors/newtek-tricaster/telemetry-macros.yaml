spec: newtek-tricaster
telemetry: macros
inbound_http:
  path: /v1/dictionary?key=macros_list
  body: <macros><systemfolder><macro name="Stop All" id="{1}"/></systemfolder><sessionfolder><macro name="Open
    Show v1.2" id="{2}"/></sessionfolder></macros>
state_before:
  macros:
    Old:
      name: Old
expect_state:
  macros:
    Stop All:
      name: Stop All
      id: '{1}'
    Open Show v1.2:
      name: Open Show v1.2
      id: '{2}'
