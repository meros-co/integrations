spec: newtek-tricaster
telemetry: shortcut-states-switchers
inbound_http:
  path: /v1/dictionary?key=shortcut_states
  body: <shortcut_states><shortcut_state name="main_value" value="0.500000" type="double" sender="unknown"/><shortcut_state
    name="main_auto" value="true" type="bool" sender="unknown"/><shortcut_state name="main_speed" value="1.000000"
    type="double" sender="unknown"/><shortcut_state name="main_select_index" value="3" type="int" sender="unknown"/><shortcut_state
    name="main_ftb_value" value="1.000000" type="double" sender="unknown"/><shortcut_state name="main_dsk1_value"
