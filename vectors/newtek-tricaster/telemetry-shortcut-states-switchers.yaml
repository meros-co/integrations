    main_value: '0.500000'
    main_auto: 'true'
    main_speed: '1.000000'
    main_select_index: '3'
    main_ftb_value: '1.000000'
    main_dsk1_value: '0.000000'
    main_dsk1_select_named_input: gfx1
    main_dsk1_select: '41'
    v1_a_row: '3'
    v1_a_row_named_input: input4
    v1_dsk2_value: '0.400000'
    v1_dsk2_auto: '1'
    input1_volume: '-6.000000'
    input1_mute: 'false'
    input1_input_type: mic_and_phantom
    master_solo: '0'
    phones_volume: '-3.000000'
  switchers:
    main:
      tbar: 0.5
      auto: true
      speed: 1.0
      transition: 3
      layers:
        ftb:
          tbar: 1.0
          on_air: true
        dsk1:
          tbar: 0.0
          on_air: false
          source: gfx1
          source_index: 41
    v1:
      rows:
        a:
          index: 3
          source: input4
      layers:
        dsk2:
          tbar: 0.4
          auto: true
  audio:
    input1:
      volume: -6.0
      mute: false
      input_type: mic_and_phantom
    master:
      solo: false
    phones:
      volume: -3.0
