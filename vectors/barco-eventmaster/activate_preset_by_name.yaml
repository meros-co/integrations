spec: barco-eventmaster
command: activate_preset_by_name
input:
  name: abc
expect_request:
  method: POST
  target: /
  body: '{"params":{"presetName":"abc"},"method":"activatePreset","id":"1234","jsonrpc":"2.0"}'
http_reply:
  status: 200
  body: '{"jsonrpc": "2.0", "id": "1234", "result": {"success": 1, "response": null}}'
expect_result:
  error:
    error: device_error
