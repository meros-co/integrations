spec: barco-eventmaster
command: subscribe
input:
  hostname: 192.168.247.131
  port: 3000
  notifications:
  - ScreenDestChanged
  - AUXDestChanged
expect_request:
  method: POST
  target: /
  body: '{"params":{"hostname":"192.168.247.131","port":"3000","notification":["ScreenDestChanged","AUXDestChanged"]},"method":"subscribe","id":"1234","jsonrpc":"2.0"}'
http_reply:
  status: 200
  body: '{"jsonrpc": "2.0", "id": "1234", "result": {"success": 0, "response": {"method": "subscribe"}}}'
expect_result:
  ok:
    kind: value
    value:
      method: subscribe
