spec: barco-eventmaster
telemetry: presets
inbound_http:
  path: /
  request:
    params:
      ScreenDest: -1
      AuxDest: -1
    method: listPresets
    id: '1234'
    jsonrpc: '2.0'
  body: '{"jsonrpc": "2.0", "id": "1234", "result": {"success": 0, "response": [{"id": 0, "Name": "Preset3.00",
    "LockMode": 0, "presetSno": 3.0}, {"id": 1, "Name": "Preset4.00", "LockMode": 0, "presetSno": 4.1}]}}'
state_before:
  presets:
    '5':
      name: Old
expect_state:
  presets:
    '0':
      name: Preset3.00
      lock_mode: 0
      serial: 3.0
    '1':
      name: Preset4.00
      lock_mode: 0
      serial: 4.1
