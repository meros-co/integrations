spec: barco-eventmaster
command: list_presets
input:
  screen: 0
expect_request:
  method: POST
  target: /
  body: '{"params":{"ScreenDest":0,"AuxDest":-1},"method":"listPresets","id":"1234","jsonrpc":"2.0"}'
http_reply:
  status: 200
  body: '{"jsonrpc": "2.0", "id": "1234", "result": {"success": 0, "response": [{"id": 0, "Name": "Preset3.00",
    "LockMode": 0, "presetSno": 3.0}, {"id": 1, "Name": "Preset4.00", "LockMode": 0, "presetSno": 4.0}]}}'
expect_result:
  ok:
    kind: value
    value:
    - id: 0
      Name: Preset3.00
      LockMode: 0
      presetSno: 3.0
    - id: 1
      Name: Preset4.00
      LockMode: 0
      presetSno: 4.0
