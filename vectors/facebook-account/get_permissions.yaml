spec: facebook-account
command: get_permissions
input: {}
settings:
  token: EAAGusertoken
expect_request:
  method: GET
  target: /v26.0/me/permissions
http_reply:
  status: 200
  body: '{"data": [{"permission": "pages_show_list", "status": "granted"}, {"permission": "pages_manage_posts",
    "status": "declined"}]}'
expect_result:
  ok:
    kind: value
    value:
    - permission: pages_show_list
      status: granted
    - permission: pages_manage_posts
      status: declined
