spec: facebook-account
command: get_page_token
input:
  page_id: '1093482904102'
settings:
  token: EAAGusertoken
expect_request:
  method: GET
  target: /v26.0/1093482904102?fields=id%2Cname%2Caccess_token
http_reply:
  status: 200
  body: '{"id": "1093482904102", "name": "Grace Church", "access_token": "EAAGpagetoken"}'
expect_result:
  ok:
    kind: value
    value:
      id: '1093482904102'
      name: Grace Church
      access_token: EAAGpagetoken
