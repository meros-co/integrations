spec: teradek-vidiu
telemetry: status
inbound_http:
  path: /cgi-bin/system.cgi?command=status
  body: '{"result":"success","status":{"System-Power":"Battery:76:0:Charging","Video-Input":"HDMI:1080p30","Network-Uplink":"Wired","Broadcast-State":"Live","Codec-State":"Running","Broadcast-Error":"none","Record-Status":"1:00:10:12"}}'
expect_state:
  power:
    source: Battery
    battery_percent: 76
    charging: Charging
  video:
    input: HDMI
    state: 1080p30
  network:
    uplink: Wired
  broadcast:
    state: Live
    live: true
    error: none
  codec:
    state: Running
  recording:
    active: true
