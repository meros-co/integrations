spec: boinx-mimolive
telemetry: devices-list-dotted-id
inbound_http:
  path: /api/v1/devices
  body: '{"data": [{"type": "devices", "id": "ndi.STUDIO (CAM 1)", "attributes": {"name": "STUDIO (CAM
    1)", "connected": true, "video": true, "audio": false, "device-type": "com.boinx.devicetype.ndi",
    "tally-state": "program"}}]}'
expect_state:
  devices:
    ndi.STUDIO (CAM 1):
      name: STUDIO (CAM 1)
      connected: true
      video: true
      audio: false
      device_type: com.boinx.devicetype.ndi
      tally_state: program
