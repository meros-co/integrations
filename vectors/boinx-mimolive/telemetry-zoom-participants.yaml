spec: boinx-mimolive
telemetry: zoom-participants
inbound_http:
  path: /api/v1/zoom/participants
  body: '{"data": [{"id": 16786432, "name": "John Doe", "userRole": "Host", "isHost": true, "isCoHost":
    false, "isVideoOn": true, "isAudioOn": true, "isTalking": false, "isRaisingHand": false}]}'
