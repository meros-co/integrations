spec: boinx-mimolive
telemetry: mlcontroller-status
inbound_http:
  path: /api/status
  body: '{"availableMimoLiveApps": [{"name": "mimoLive (6.15)", "path": "/Applications/mimoLive.app"}],
    "localDocuments": ["/Users/me/Documents/show1.tvshow"], "openDocuments": [{"id": "458706932", "name":
