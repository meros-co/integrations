        id: com.boinx.mimoLive.sources.deviceVideoSource
        name: Camera
        attributes: '{"name":"Camera"}'
      '1':
        id: com.boinx.mimoLive.sources.imageSource
        name: Image
        attributes: '{"name":"Image"}'
