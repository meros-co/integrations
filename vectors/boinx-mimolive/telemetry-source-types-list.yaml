spec: boinx-mimolive
telemetry: source-types-list
inbound_http:
  path: /api/v1/sourcetypes
  body: '{"data": [{"type": "sourcetypes", "id": "com.boinx.mimoLive.sources.deviceVideoSource", "attributes":
    {"name": "Camera"}}, {"type": "sourcetypes", "id": "com.boinx.mimoLive.sources.imageSource", "attributes":
    {"name": "Image"}}]}'
state_before:
