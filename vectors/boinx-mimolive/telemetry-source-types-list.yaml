spec: boinx-mimolive
telemetry: source-types-list
inbound_http:
  path: /api/v1/sourcetypes
  body: '{"data": [{"type": "sourcetypes", "id": "com.boinx.mimoLive.sources.deviceVideoSource", "attributes":
    {"name": "Camera"}}, {"type": "sourcetypes", "id": "com.boinx.mimoLive.sources.imageSource", "attributes":
    {"name": "Image"}}]}'
state_before:
  types:
    sources:
      com.boinx.old:
        name: Old
expect_state:
  types:
    sources:
      com.boinx.mimoLive.sources.deviceVideoSource:
        name: Camera
        attributes: '{"name":"Camera"}'
      com.boinx.mimoLive.sources.imageSource:
        name: Image
        attributes: '{"name":"Image"}'
