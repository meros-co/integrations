spec: boinx-mimolive
telemetry: devices-list
inbound_http:
  path: /api/v1/devices
  body: '{"data": [{"type": "devices", "id": "BuiltInMicrophoneDevice", "attributes": {"name": "MacBook
    Pro Microphone", "connected": true, "video": false, "audio": true, "device-type": "com.boinx.devicetype.avfoundation",
    "tally-state": "off", "input-channels": ["Ch. 1"]}}]}'
state_before:
  devices:
    OldCam:
      name: Old Camera
      connected: false
expect_state:
  devices:
    BuiltInMicrophoneDevice:
      name: MacBook Pro Microphone
      connected: true
      video: false
      audio: true
      device_type: com.boinx.devicetype.avfoundation
      tally_state: 'off'
      input_channels: '["Ch. 1"]'
