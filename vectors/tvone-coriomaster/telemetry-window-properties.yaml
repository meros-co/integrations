spec: tvone-coriomaster
telemetry: window-properties
inbound: "Window1.Status = FREE\r\nWindow1.RotateDeg = 90\r\nWindow1.WDPQ = 2048\r\nWindow1.BdrPixWidth\
  \ = 1\r\nWindow1.BdrRGB = 16711680\r\nWindow1.HFlip = On\r\nWindow1.VFlip = Off\r\nWindow1.FTB = 0\r\
  \nWindow1.SCFTB = Off\r\nWindow1.SCHShrink = On\r\nWindow1.SCVShrink = Off\r\nWindow1.SCSpin = -3\r\n\
  Window1.KeyingLayer = 2\r\nWindow1.KeyingYMin = 0\r\nWindow1.KeyingYMax = 40\r\nWindow1.KeyingYSoft\
  \ = 5\r\nWindow1.Zorder = 1\r\nWindow1.Canvas = Canvas1\r\nWindow1.Alias = NULL\r\n"
expect_state:
  windows:
    '1':
      status: FREE
      rotation: 90
      quality: 2048
      border_width: 1
      border_color: 16711680
      hflip: true
      vflip: false
      fade: 0
      animate_fade: false
      animate_hshrink: true
      animate_vshrink: false
      animate_spin: -3
      keying_layer: 2
      luma_key_min: 0
      luma_key_max: 40
      luma_key_softness: 5
      zorder: 1
      canvas: Canvas1
      alias: 'NULL'
