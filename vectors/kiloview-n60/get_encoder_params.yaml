spec: kiloview-n60
command: get_encoder_params
input:
  stream: main
expect_request:
  method: POST
  target: /api/codec/encoder/main/get
http_reply:
  status: 200
  body: '{"yuv":"NV12","max_bitrate":10000,"mode":"x-h264","started":true}'
expect_result:
  ok:
    kind: value
    value:
      yuv: NV12
      max_bitrate: 10000
      mode: x-h264
      started: true
