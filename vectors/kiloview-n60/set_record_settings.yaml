spec: kiloview-n60
command: set_record_settings
input:
  disk_choose:
    nas:
    - public
    usb:
    - sda1
  limit_type: size-loop
  limit_size: 102400
  limit_time: 3600
  disk_policy: overwrite
expect_request:
  method: POST
  target: /api/record/record/settings
  body: '{"disk_choose":{"nas":["public"],"usb":["sda1"]},"auto_record":false,"format":"mov","limit_type":"size-loop","limit_size":102400,"limit_time":3600,"disk_policy":"overwrite"}'
http_reply:
  status: 200
  body: ''
expect_result:
  ok:
    kind: ack
