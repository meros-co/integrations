spec: kiloview-n60
telemetry: encoder-input
inbound_http:
  path: /api/codec/encoder/main/get_capture
  body: '{"width":1920,"height":1080,"framerate":60,"interlaced":0,"io_mode":4,"device":"/dev/video0","framerate_D":1000,"enable":1,"started":true,"signal":"none","resolution":"1920x1080p
    60Hz","source":"hdmi"}'
expect_state:
  encoders:
    main:
      enabled: true
      pipeline_started: true
      input:
        width: 1920
        height: 1080
        frame_rate: 60
        frame_rate_denominator: 1000
        interlaced: false
        io_mode: 4
        device: /dev/video0
        signal: none
        resolution: 1920x1080p 60Hz
        source: hdmi
