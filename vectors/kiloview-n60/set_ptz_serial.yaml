spec: kiloview-n60
command: set_ptz_serial
input:
  enabled: true
  device: ttyUSB0
  protocol: Pelco-d
  address: 2
expect_request:
  method: POST
  target: /api/codec/ptz/modify
  body: '{"enable":1,"typ":"serial","device":"ttyUSB0","baudrate":9600,"parity":"none","startBits":8,"endBits":1,"xonxoff":0,"rtscts":0,"ptz_protocol":"Pelco-d","ptz_addr":2}'
