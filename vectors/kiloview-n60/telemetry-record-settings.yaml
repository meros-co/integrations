spec: kiloview-n60
telemetry: record-settings
inbound_http:
  path: /api/record/record/get_record_info
  body: '{"result":"ok","data":{"auto_record":true,"format":"mov","limit_type":"size-loop","limit_size":4000000,"limit_time":3600,"disk_policy":"overwrite"}}'
expect_state:
  recording:
    auto_record: true
    format: mov
    limit_type: size-loop
    limit_size_mb: 4000000
    limit_time_s: 3600
    disk_policy: overwrite
