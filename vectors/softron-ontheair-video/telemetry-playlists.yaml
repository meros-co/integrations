spec: softron-ontheair-video
telemetry: playlists
inbound_http:
  path: /playlists
  body: '[{"unique_id": "PL-1", "name": "Main"}, {"unique_id": "PL-2", "name": "Backup"}]'
state_before:
  playlists:
    PL-0:
      name: Closed
expect_state:
  playlists:
    PL-1:
      name: Main
      index: 0
    PL-2:
      name: Backup
      index: 1
expect_then_send:
- method: GET
  target: /playlists/PL-1/items
- method: GET
  target: /playlists/PL-2/items
