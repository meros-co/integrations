spec: modulopi-kinetic
command: get_timeline_by_name
input:
  name: Main
expect_wire: '{"jsonrpc":"2.0","method":"get.object.timeline","params":{"name":"Main"},"id":"timeline
  by name"}'
device_reply: '{"jsonrpc":"2.0","result":{"name": "Main", "objectType": "timeline", "uiColor": "#00ff00",
  "uuid": "{b9ff8f5b-5a15-4422-9e25-b8eeed9f8f9a}", "timecode": 60000, "on": true, "play": true, "grandMasterFader":
  100, "lockToTc": false, "audioMaster": 80},"id":"timeline by name"}'
expect_result:
  ok:
    kind: value
    value:
      name: Main
      objectType: timeline
      uiColor: '#00ff00'
      uuid: '{b9ff8f5b-5a15-4422-9e25-b8eeed9f8f9a}'
      timecode: 60000
      'on': true
      play: true
      grandMasterFader: 100
      lockToTc: false
      audioMaster: 80
