spec: modulopi-kinetic
command: get_variable_by_name
input:
  name: count
expect_wire: '{"jsonrpc":"2.0","method":"get.object.variable","params":{"name":"count"},"id":"variable
  by name"}'
device_reply: '{"jsonrpc":"2.0","result":{"name": "count", "objectType": "variable", "variableType": "int",
  "value": 12, "uiColor": "", "uuid": "{06db974b-8811-4dc8-ac41-5fbf4c17634d}"},"id":"variable by name"}'
expect_result:
  ok:
    kind: value
    value:
      name: count
      objectType: variable
      variableType: int
      value: 12
      uiColor: ''
      uuid: '{06db974b-8811-4dc8-ac41-5fbf4c17634d}'
