spec: opensong
telemetry: status-running
inbound_http:
  path: /presentation/status
  body: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<response resource=\"presentation\" action=\"status\"\
    >\n <presentation running=\"1\">\n  <screen mode=\"N\">normal</screen>\n  <slide itemnumber=\"1\"\
    >\n   <name>Testslide</name>\n   <title>Untitled</title>\n  </slide>\n </presentation>\n</response>"
expect_state:
  presentation:
    running: true
    screen:
      mode: N
      name: normal
    slide:
      item: 1
      name: Testslide
      title: Untitled
