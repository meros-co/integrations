spec: casparcg
command: set_chroma_key
input:
  channel: 1
  layer: 1
  target_hue: 120.0
  hue_width: 0.1
  min_saturation: 0.0
  min_brightness: 0.0
  softness: 0.1
  spill_suppress: 0.1
  spill_suppress_saturation: 0.7
expect_wire:
- "MIXER 1-1 CHROMA 1 120.0000 0.1000 0.0000 0.0000 0.1000 0.1000 0.7000 0 0 linear\r\n"
- "MIXER 1-1 CHROMA\r\n"
device_reply: "202 MIXER OK\r\n201 MIXER OK\r\n1 120 0.1 0 0 0.1 0.1 0.7 0\r\n"
