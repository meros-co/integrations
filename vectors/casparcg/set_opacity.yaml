spec: casparcg
command: set_opacity
input:
  channel: 1
  layer: 0
  opacity: 0.5
  duration: 25
  tween: easeinsine
expect_wire:
- "MIXER 1-0 OPACITY 0.5000 25 easeinsine\r\n"
- "MIXER 1-0 OPACITY\r\n"
device_reply: "202 MIXER OK\r\n201 MIXER OK\r\n0.5\r\n"
expect_result:
  ok:
    kind: value
    value: '0.5'
