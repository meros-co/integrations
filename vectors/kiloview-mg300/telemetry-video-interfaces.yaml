spec: kiloview-mg300
telemetry: video-interfaces
inbound_http:
  path: /api/output/interfaces/get?output_id=1&type=video
  body: '{"data": [{"colorspace": "RGB444", "enable": false, "id": 2, "label": "HDMI2", "mode": "HDMI",
    "support": true, "visible": true}], "result": "ok"}'
expect_state:
  outputs:
    '1':
      video_interfaces:
        '2':
          label: HDMI2
          mode: HDMI
          colorspace: RGB444
          enabled: false
          supported: true
          visible: true
