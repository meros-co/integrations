spec: kiloview-mg300
telemetry: audio-mix
inbound_http:
  path: /api/output/audiomix/get?output_id=1
  body: '{"data": {"output": [{"stream_id": "a1", "name": "n60", "enable": true, "volume": -6, "mute":
    false, "pos_id": 1, "type": "output"}], "preview": [{"stream_id": "b2", "name": "n50", "enable": false,
    "volume": 0, "mute": true, "type": "preview"}]}, "result": "ok"}'
expect_state:
  outputs:
    '1':
      audio_mix:
        output:
          a1:
            name: n60
            enabled: true
            volume: -6
            muted: false
            window: 1
        preview:
          b2:
            name: n50
            enabled: false
            volume: 0
            muted: true
settings:
  password: ''
