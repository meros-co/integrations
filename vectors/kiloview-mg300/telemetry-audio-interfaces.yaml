spec: kiloview-mg300
telemetry: audio-interfaces
inbound_http:
  path: /api/output/interfaces/get?output_id=2&type=audio
  body: '{"data": [{"id": 4, "label": "LineOut", "enable": true, "samplerate": 44.1, "channels": 2, "volume":
    -3, "mute": false, "visible": true}], "result": "ok"}'
expect_state:
  outputs:
    '2':
      audio_interfaces:
        '4':
          label: LineOut
          enabled: true
          sample_rate: 44.1
          channels: 2
          volume: -3
          muted: false
          visible: true
