spec: kiloview-mg300
telemetry: http-ports
inbound_http:
  path: /api/network/http/get
  body: '{"data": {"http": true, "httpPort": 80, "https": true, "httpsPort": 443, "authEnable": false},
    "result": "ok"}'
expect_state:
  network:
    http:
      enabled: true
      port: 80
    https:
      enabled: true
      port: 443
    http_auth: false
