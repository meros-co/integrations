spec: kiloview-mg300
telemetry: overlays
inbound_http:
  path: /api/overlay/list
  body: '{"data": [{"background": "transparent", "editing": true, "id": 1, "img_path": "./data/decoder_config/overlay/preview/overlay_1.png",
    "modified": false, "name": "template_1", "selected": false, "status": 0}, {"background": "output2",
    "editing": false, "id": 2, "img_path": "", "modified": true, "name": "Logo", "selected": true, "status":
    0}], "result": "ok"}'
expect_state:
  overlays:
    '1':
      name: template_1
      selected: false
      status: 0
      background: transparent
      editing: true
      modified: false
      image: ./data/decoder_config/overlay/preview/overlay_1.png
    '2':
      name: Logo
      selected: true
      status: 0
      background: output2
      editing: false
      modified: true
      image: ''
state_before:
  overlays:
    '7':
      name: deleted
expect_then_send:
- method: GET
  target: /api/overlay/items/get?overlay_id=1
- method: GET
  target: /api/overlay/items/get?overlay_id=2
settings:
  password: ''
