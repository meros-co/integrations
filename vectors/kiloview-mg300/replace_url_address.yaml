spec: kiloview-mg300
command: replace_url_address
input:
  url: srt://192.168.1.1:13?dddddd
  address: 192.168.1.124
  port: '1234'
expect_request:
  method: POST
  target: /api/sys/ip/replace
  body: '{"url":"srt://192.168.1.1:13?dddddd","target_ip":"192.168.1.124","target_port":"1234"}'
http_reply:
  status: 200
  body: '{"data":{"url":"srt://192.168.1.124:1234?dddddd"},"result":"ok"}'
expect_result:
  ok:
    kind: value
    value: srt://192.168.1.124:1234?dddddd
