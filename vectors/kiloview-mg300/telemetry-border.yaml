spec: kiloview-mg300
telemetry: border
inbound_http:
  path: /api/output/border/get?output_id=2
  body: '{"data": {"bottom_width": 2, "color": "#00FF00", "enable": true, "hex_color": 65280, "left_width":
    3, "right_width": 3, "top_width": 2}, "result": "ok"}'
expect_state:
  outputs:
    '2':
      border:
        enabled: true
        color: '#00FF00'
        top_width: 2
        bottom_width: 2
        left_width: 3
        right_width: 3
settings:
  password: ''
