spec: kiloview-mg300
telemetry: overlay-items
inbound_http:
  path: /api/overlay/items/get?overlay_id=1
  body: '{"result": "ok", "data": {"id": 1, "name": "overlay1", "background": "transparent", "list": [{"id":
    1, "width": 100, "height": 100, "x": 10, "y": 0, "z_index": 0, "type": "image", "opacity": 0, "img_id":
    2}, {"id": 3, "x": 0, "y": 0, "z_index": 1, "width": 100, "height": 100, "text_type": "time", "format":
    "hh:mm:ss", "font_color": "0xffffff", "opacity": 0.5, "stroke_enable": false, "stroke_color": "0xffffff",
    "stroke_size": 18, "content": "", "type": "text"}]}}'
expect_state:
  overlays:
    '1':
      name: overlay1
      background: transparent
  overlay_items:
    '1':
      '1':
        type: image
        x: 10
        y: 0
        width: 100
        height: 100
        z_index: 0
        opacity: 0.0
        image_id: 2
      '3':
        type: text
        x: 0
        y: 0
        width: 100
        height: 100
        z_index: 1
        opacity: 0.5
        text_type: time
        format: hh:mm:ss
        font_color: '0xffffff'
        stroke_enabled: false
        stroke_color: '0xffffff'
        stroke_size: 18
        content: ''
state_before:
  overlay_items:
    '1':
      '2':
        type: text
