spec: kiloview-mg300
telemetry: encoder
inbound_http:
  path: /api/output/encode/get?output_id=1
  body: '{"result": "ok", "data": {"enable": false, "main": {"codec": "H264", "profile": 0, "pic_width":
    1, "pic_height": 1, "set_resolution_default": true, "grey": false, "fps": "auto", "mode": "VBR", "bitrate":
    6000, "max_bitrate": 20000, "gop": 60, "deinterlace_mode": "weave", "code_frame": 0, "out_mixer_fps":
    60}, "sub": {"pic_width": 640, "pic_height": 360, "fps": 30, "bitrate": 3000}}}'
expect_state:
  outputs:
    '1':
      encoder:
        enabled: false
        codec: H264
        profile: high
        width: 1
        height: 1
        follows_resolution: true
        grayscale: false
        fps: auto
        mode: VBR
        bitrate: 6000
        max_bitrate: 20000
        gop: 60
        deinterlace: weave
        reference_frames: 0
        mixer_fps: 60
        sub:
          width: 640
          height: 360
          fps: 30
          bitrate: 3000
