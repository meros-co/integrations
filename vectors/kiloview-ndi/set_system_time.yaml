spec: kiloview-ndi
command: set_system_time
input:
  ntp: pool.ntp.org time.example.com
  timezone: Europe/London
  time: '2026-10-23 16:50:50'
  sync: ntp
expect_request:
  method: POST
  target: /api/sys-time/set.json
  body: '{"ntp":"pool.ntp.org time.example.com","Timezone":"Europe/London","time":"2026-10-23 16:50:50","timetype":"ntp"}'
model: n5
