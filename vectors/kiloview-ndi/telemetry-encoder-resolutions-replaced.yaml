spec: kiloview-ndi
telemetry: encoder-resolutions-replaced
inbound_http:
  path: /api/encoder/ndi/get_config.json
  body: '{"result": "ok", "data": {"resolution_list": [{"name": "1280x720P 60Hz", "value": "720P60"}]}}'
  request:
    types: ndifull
expect_state:
  encoder:
    config:
      ndifull:
        resolutions:
          '0':
            name: 1280x720P 60Hz
            value: 720P60
state_before:
  encoder:
    config:
      ndifull:
        resolutions:
          '0':
            name: 1920x1080P 60Hz
            value: 1080P60
          '1':
            name: 1920x1080P 50Hz
            value: 1080P50
model: n6
