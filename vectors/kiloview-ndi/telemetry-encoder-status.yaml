spec: kiloview-ndi
telemetry: encoder-status
inbound_http:
  path: /api/v1/encoder/ndi/status
  body: '{"result": "ok", "data": {"video_signal": "hdmi", "resolution": "1920x1080p 59.94Hz", "xRes":
    1920, "yRes": 1080, "frame_rate": 59.94, "interlaced": false, "bitrate": 125000, "audio_format": "48000
    Hz/Stereo", "audio_signal": "embedded", "audio_sampling": 48000, "audio_channels": 2}}'
expect_state:
  encoder:
    status:
      ndi:
        video_signal: hdmi
        video_present: true
        resolution: 1920x1080p 59.94Hz
        width: 1920
        height: 1080
        frame_rate: 59.94
        interlaced: false
        bitrate_kbps: 125000
        audio_format: 48000 Hz/Stereo
        audio_signal: embedded
        audio_sample_rate: 48000
        audio_channels: 2
