spec: kiloview-ndi
telemetry: encoder-config-v3
inbound_http:
  path: /api/encoder/ndi/get_config.json
  body: '{"result": "ok", "data": {"device_group": "", "netmask": "255.255.0.0", "resolution": "none",
    "resolution_list": [{"name": "1920x1080P 60Hz", "value": "1080P60"}, {"name": "1920x1080P 50Hz", "value":
    "1080P50"}], "netprefix": "239.255.0.0", "channel_name": "Channel-HX", "ttl": 127, "quality": 2000,
    "ndi_connection": "tcp", "video_source": "HDMI", "codec": "H265", "hx_version": 3}}'
  request:
    types: ndihx
expect_state:
  encoder:
    config:
      ndihx:
        device_group: ''
        channel_name: Channel-HX
        ndi_connection: tcp
        netprefix: 239.255.0.0
        netmask: 255.255.0.0
        quality: 2000
        ttl: 127
        scaling: none
        video_source: HDMI
        codec: H265
        hx_version: 3
        resolutions:
          '0':
            name: 1920x1080P 60Hz
            value: 1080P60
          '1':
            name: 1920x1080P 50Hz
            value: 1080P50
model: n5
