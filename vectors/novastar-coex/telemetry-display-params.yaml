spec: novastar-coex
telemetry: display-params
inbound_http:
  path: /api/v1/screen/displayparams
  body: '{"code": 0, "message": "Success", "data": {"list": [{"screenId": "{A}", "brightness": 0.8, "colorTemperature":
    6500, "gamma": 2.8}]}}'
expect_state:
  screens:
    '{A}':
      brightness: 0.8
      color_temperature: 6500
      gamma: 2.8
