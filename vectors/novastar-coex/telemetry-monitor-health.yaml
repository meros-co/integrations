    runtime: 3600
    total_runtime: 7200
    backup_status: 109
  monitoring:
    fans:
      '0':
        speed: 3200.0
        type: 0
        status: 0
    voltages:
      '0':
        value: 1.2
        type: 0
        status: 0
    temperatures:
      '0':
        value: 45.5
        type: 1
        status: 1
    ports:
      '1':
        status: 0
    cards:
      '3':
        type: 1
        status: 0
    sources:
      '1':
        status: 1
        input_card: 0
    outputs:
      '1':
        type: 0
        status: 1
        output_card: 2
    cabinets:
      '7':
        voltage: 5.0
