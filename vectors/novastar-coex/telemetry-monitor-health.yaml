spec: novastar-coex
telemetry: monitor-health
inbound_http:
  path: /api/v1/device/monitor/info?isNeedCabinetInfo=1
  body: '{"code": 0, "message": "Success", "data": {"runtime": 3600, "totalRuntime": 7200, "backupStatus":
    109, "fanInfos": [{"fanSpeed": 3200, "fanType": 0, "status": 0}], "voltageInfos": [{"voltage": 1.2,
    "voltageType": 0, "status": 0}], "temperatureInfos": [{"temperature": 45.5, "temperatureType": 1,
    "status": 1}], "controllerPortMonitorInfos": [{"controllerPortID": 1, "status": 0}], "cardMonitorInfo":
    [{"cardID": 3, "cardType": 1, "status": 0}], "screenSourceStatus": [{"portID": 1, "status": 1, "inputCardID":
    0}], "outputStatus": [{"outputID": 1, "type": 0, "status": 1, "outputCardID": 2}]}}'
state_before:
  monitoring:
    fans:
      '1':
        speed: 1.0
