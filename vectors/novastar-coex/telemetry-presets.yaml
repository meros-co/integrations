spec: novastar-coex
telemetry: presets
inbound_http:
  path: /api/v1/preset
  body: '{"code": 0, "message": "Success", "data": {"screenPresetList": [{"screenID": "{A}", "presetList":
    [{"sequenceNumber": 1, "name": "Walk-in", "state": false, "sourceData": true, "processingData": true,
    "outputData": false, "screenData": true, "effectSwitch": 0}, {"sequenceNumber": 2, "name": "Show",
    "state": true, "sourceData": true, "processingData": false, "outputData": true, "screenData": false,
    "effectSwitch": 1}]}]}}'
state_before:
  screens:
    '{A}':
      current_preset: 9
      presets:
        '9':
          name: Old
expect_state:
  screens:
    '{A}':
      current_preset: 2
      presets:
        '1':
          name: Walk-in
          applied: false
          source_data: true
          processing_data: true
          output_data: false
          screen_data: true
          through_black: false
        '2':
          name: Show
          applied: true
          source_data: true
          processing_data: false
          output_data: true
          screen_data: false
          through_black: true
