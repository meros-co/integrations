spec: novastar-coex
telemetry: screens
inbound_http:
  path: /api/v1/screen?isNeedCabinetInfo=1
  body: '{"code": 0, "message": "Success", "data": {"screens": [{"screenID": "{A}", "screenName": "Main",
    "workingMode": 1, "lowLatency": false, "layoutMode": 0, "screenIndex": 1, "screenGroupID": "G1", "masterFrameRate":
    60, "pixToPixMode": 0, "canvases": [{"canvasID": 1, "outputCardId": 2, "position": {"x": 0, "y": 0},
    "size": {"width": 1920, "height": 1080}, "maxFrameRate": 60, "zorder": 1, "frequencyPhaseStatus":
    0}], "layersInWorkingMode": [{"workingMode": 1, "layerLayoutMode": 0, "layers": [{"id": 1, "layerIndex":
    1, "source": 3, "position": {"x": 0, "y": 0}, "zOrder": 1, "lock": false, "border": {"enable": true,
    "width": 2}, "cut": {"enable": false, "rect": {"x": 0, "y": 0, "width": 1920, "height": 1080}}, "scaler":
    {"width": 1920, "height": 1080}}]}]}], "screenGroups": [{"screenGroupID": "G1", "name": "Stage"}]}}'
state_before:
  screens:
    '{A}':
      brightness: 0.5
      canvases:
        '9':
          z_order: 2
      working_modes:
        '1':
          layers:
            '2':
              source: 1
      cabinet_positions:
        '7':
          x: 0.0
  screen_groups:
    OLD:
      name: Gone
expect_state:
  screens:
    '{A}':
      brightness: 0.5
      cabinet_positions:
        '7':
          x: 0.0
      name: Main
      working_mode: 1
      low_latency: false
      layout_mode: 0
      index: 1
      group: G1
      max_frame_rate: 60.0
      pixel_to_pixel: false
      canvases:
        '1':
          output_card: 2
          x: 0.0
          y: 0.0
          width: 1920.0
          height: 1080.0
          max_frame_rate: 60.0
          z_order: 1
          in_phase: true
      working_modes:
        '1':
          layer_layout: 0
          layers:
            '1':
              index: 1
              source: 3
              x: 0.0
              y: 0.0
              width: 1920.0
              height: 1080.0
              z_order: 1
              locked: false
              border: true
              border_width: 2.0
              crop: false
              crop_x: 0.0
              crop_y: 0.0
              crop_width: 1920.0
              crop_height: 1080.0
  screen_groups:
    G1:
      name: Stage
