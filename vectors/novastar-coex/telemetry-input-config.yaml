spec: novastar-coex
telemetry: input-config
inbound_http:
  path: /api/v1/device/input
  body: '{"code": 0, "message": "Success", "data": {"testPattern": {"mode": 16, "parameters": {"red":
    4095, "green": 0, "blue": 0, "gray": 255, "gridWidth": 8, "moveSpeed": 50, "gradientStretch": 8, "state":
    1}}, "InputPortConfig": [{"logicId": 1, "cscParameter": {"HueValue": 0, "ContrastValue": 100, "SaturationValue":
    120}, "isLimitToFull": false, "range": 255, "colorSpaceType": 255, "colorGamut": 2, "hdrParameter":
    {"overrideHdrType": 255, "realHdrType": "SDR"}}]}}'
expect_state:
  test_pattern:
    mode: 16
    'on': true
    red: 4095
    green: 0
    blue: 0
    gray: 255
    grid_width: 8
    move_speed: 50
    gradient_stretch: 8
  input_config:
    '1':
      hue: 0
      contrast: 100
      saturation: 120
      limit_to_full: false
      range: 255
      color_space: 255
      color_gamut: 2
      hdr_mode: 255
      real_hdr_mode: SDR
