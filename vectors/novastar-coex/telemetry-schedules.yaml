spec: novastar-coex
telemetry: schedules
inbound_http:
  path: /api/v1/screen/schedule/all
  body: '{"code": 0, "message": "Success", "data": [{"screenId": "{A}", "enable": true, "brightnessMappingMode":
    0, "brightnessStrategyList": [{"strategyId": "b1", "startTime": "08:00:00", "endTime": "20:00:00",
    "adjustType": 0, "brightnessRatio": 0.8, "brightnessNit": 800, "repeatEnable": true}], "presetStrategyList":
    [{"strategyId": "p1", "startTime": "19:00:00", "presetNum": 2, "presetName": "Show", "repeatEnable":
    false}]}]}'
state_before:
  screens:
    '{A}':
      schedule:
        preset_strategies:
          old:
            preset: 1
expect_state:
  screens:
    '{A}':
      schedule:
        enabled: true
        brightness_mapping_mode: 0
        brightness_strategies:
          b1:
            start: 08:00:00
            end: '20:00:00'
            adjust_type: 0
            brightness: 0.8
            nits: 800.0
            repeat: true
        preset_strategies:
          p1:
            start: '19:00:00'
            preset: 2
            preset_name: Show
            repeat: false
