spec: novastar-coex
telemetry: screen-properties
inbound_http:
  path: /api/v1/screen/base/info
  body: '{"code": 0, "message": "Success", "data": {"characteristic": 1, "multiModeInfo": [{"screenID":
    "{A}", "multiModeParam": {"currentModeId": 2, "currentCfgParam": {"cabinetName": "P2.6"}, "modeInfo":
    [{"modeId": 1, "modeName": "Normal"}, {"modeId": 2, "modeName": "HDR"}]}}]}}'
state_before:
  screens:
    '{A}':
      multimodes:
        '5':
          name: Old
expect_state:
  device:
    screen_calibrated: 1
  screens:
    '{A}':
      multimode: 2
      cabinet_file: P2.6
      multimodes:
        '1':
          name: Normal
        '2':
          name: HDR
