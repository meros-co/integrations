spec: novastar-coex
telemetry: output
inbound_http:
  path: /api/v1/screen/output
  body: '{"code": 0, "message": "Success", "data": [{"screenid": "{A}", "lowDelay": true, "additionalFrameDelay":
    1, "outputBitDepth": {"bitDepth": 255, "currentBitDepth": 1}, "threeD": {"enable": false}, "currentFrameRate":
    59.94, "genlock": {"masterLayerGroupId": 2, "selectedType": 0}, "gamutList": {"currentGamutName":
    "Rec.709"}}]}'
expect_state:
  screens:
    '{A}':
      output:
        low_latency: true
        additional_frame_delay: 1
        bit_depth: 255
        current_bit_depth: 1
        three_d: false
        frame_rate: 59.94
        genlock_group: 2
        sync_type: 0
        gamut: Rec.709
