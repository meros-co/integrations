  path: /api/v1/device/input/sources
  body: '{"code": 0, "message": "Success", "data": [{"id": 1, "groupId": 1, "type": 3, "name": "HDMI 1",
    "sourceStatus": 1, "actualResolution": {"width": 3840, "height": 2160}, "actualRefreshRate": 60, "colorSpace":
