spec: epiphan-pearl
command: add_publisher
input:
  channel: '100'
  name: New RTMP
  publisher_settings:
    rtmp:
      disable_audio: false
      url: rtmp://192.168.86.51
      stream: ''
      username: ''
      password: ''
    type: rtmp
    common:
      enabled: false
      single_touch: false
expect_request:
  method: POST
  target: /api/v2.0/channels/100/publishers
  body: '{"name":"New RTMP","settings":{"rtmp":{"disable_audio":false,"url":"rtmp://192.168.86.51","stream":"","username":"","password":""},"type":"rtmp","common":{"enabled":false,"single_touch":false}}}'
http_reply:
  status: 404
  body: '{"status":"notfound","message":"Channel not found"}'
expect_result:
  error:
    error: device_error
    code: '404'
