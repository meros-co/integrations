spec: epiphan-pearl
command: create_network_input
input:
  type: srt
  name: New SRT Listener
  input_settings:
    audio:
      delay: 0
    video:
      nosignal:
        image: ''
        timeout: 8
      force_full_color_range: true
      hwaccel_decoding: true
    srt:
      mode: listener
      latency: 83
      encryption:
        passphrase: AAAAAAAAAAAAAAAAAA
        keylength: 256
      port: 1029
expect_request:
  method: POST
  target: /api/v2.0/inputs
  body: '{"type":"srt","name":"New SRT Listener","settings":{"audio":{"delay":0},"video":{"nosignal":{"image":"","timeout":8},"force_full_color_range":true,"hwaccel_decoding":true},"srt":{"mode":"listener","latency":83,"encryption":{"passphrase":"AAAAAAAAAAAAAAAAAA","keylength":256},"port":1029}}}'
http_reply:
  status: 201
  body: '{"status":"ok","result":"SRT1"}'
expect_result:
  ok:
    kind: value
    value: SRT1
