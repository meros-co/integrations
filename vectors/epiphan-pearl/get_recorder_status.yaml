spec: epiphan-pearl
command: get_recorder_status
input:
  recorder: '1'
expect_request:
  method: GET
  target: /api/v2.0/recorders/1/status
http_reply:
  status: 200
  body: '{"status":"ok","result":{"state":"started","duration":195,"active":"1","total":"1"}}'
expect_result:
  ok:
    kind: value
    value:
      state: started
      duration: 195
      active: '1'
      total: '1'
