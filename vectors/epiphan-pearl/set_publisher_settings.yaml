spec: epiphan-pearl
command: set_publisher_settings
input:
  channel: '1'
  publisher: '2'
  publisher_settings:
    srt:
      url: srt://127.0.0.1:19863
      stream_id: streamid
      disable_audio: false
      mode: caller
      latency: 125
      bw_recovery_overhead: 25
      encryption:
        passphrase: AnyPassphrase
        keylength: 128
    type: srt
    common:
      enabled: true
      single_touch: true
expect_request:
  method: PUT
  target: /api/v2.0/channels/1/publishers/2/settings
  body: '{"srt":{"url":"srt://127.0.0.1:19863","stream_id":"streamid","disable_audio":false,"mode":"caller","latency":125,"bw_recovery_overhead":25,"encryption":{"passphrase":"AnyPassphrase","keylength":128}},"type":"srt","common":{"enabled":true,"single_touch":true}}'
