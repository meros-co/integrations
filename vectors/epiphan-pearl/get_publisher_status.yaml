spec: epiphan-pearl
command: get_publisher_status
input:
  channel: '1'
  publisher: '2'
expect_request:
  method: GET
  target: /api/v2.0/channels/1/publishers/2/status
http_reply:
  status: 200
  body: '{"status":"ok","result":{"is_configured":true,"started":false,"state":"stopped"}}'
expect_result:
  ok:
    kind: value
    value:
      is_configured: true
      started: false
      state: stopped
