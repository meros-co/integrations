spec: epiphan-pearl
telemetry: recorders
inbound_http:
  path: /api/v2.0/recorders
  body: '{"status":"ok","result":[{"id":"1","name":"HDMI-A","multisource":false},{"id":"m1","name":"Multitrack","multisource":true}]}'
expect_state:
  recorders:
    '1':
      name: HDMI-A
      multisource: false
    m1:
      name: Multitrack
      multisource: true
expect_then_send:
- method: GET
  target: /api/v2.0/recorders/1/archive/files
- method: GET
  target: /api/v2.0/recorders/m1/archive/files
