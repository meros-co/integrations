spec: epiphan-pearl
command: add_publisher
input:
  channel: '1'
  name: New RTMP
  publisher_settings: &id001
    rtmp:
      disable_audio: false
      url: rtmp://192.168.86.51
      stream: ''
      username: ''
      password: ''
    type: rtmp
    common:
      enabled: false
      single_touch: false
expect_request:
  method: POST
  target: /api/v2.0/channels/1/publishers
  body: '{"name":"New RTMP","settings":{"rtmp":{"disable_audio":false,"url":"rtmp://192.168.86.51","stream":"","username":"","password":""},"type":"rtmp","common":{"enabled":false,"single_touch":false}}}'
http_reply:
  status: 201
  body: '{"status":"ok","result":{"id":"0","name":"New RTMP","settings":{"rtmp":{"disable_audio":false,"url":"rtmp://192.168.86.51","stream":"","username":"","password":""},"type":"rtmp","common":{"enabled":false,"single_touch":false}}}}'
expect_result:
  ok:
    kind: value
    value:
      id: '0'
      name: New RTMP
      settings: *id001
