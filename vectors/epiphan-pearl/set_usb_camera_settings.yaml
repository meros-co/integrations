spec: epiphan-pearl
command: set_usb_camera_settings
input:
  input: USBA
  capture_mode: 1920x1080@30
  brightness: 50
  contrast: 50
  saturation: 60
  sharpness: 50
  pan: -10
  tilt: 5
  power_line_frequency: 2
  volume: 70
expect_request:
  method: PUT
  target: /api/v2.0/inputs/USBA/settings
  body: '{"usb":{"capture_mode":"1920x1080@30","brightness":50,"contrast":50,"saturation":60,"sharpness":50,"pan":-10,"tilt":5,"power_line_frequency":2,"volume":70}}'
http_reply:
  status: 200
  body: '{"status":"ok"}'
expect_result:
  ok:
    kind: ack
