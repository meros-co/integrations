spec: kiloview-multiview-server
command: set_grid
input:
  window: 1
  grid: 1
  name: HDMI
  size: 16
  color: '#265ddd'
  safe_area: true
  audio_meter: true
  center_cross: false
expect_request:
  method: POST
  target: /api/output/set_single_layout.json
  body: '{"output":"1","id":1,"name":"HDMI","size":16,"color":"#265ddd","safe":true,"soundColumn":true,"centerline":false}'
  content_type: application/json
