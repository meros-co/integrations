spec: kiloview-multiview-server
command: modify_layout
input:
  layout: '1'
  name: '123'
  grids:
  - y: 0
    x: 0
    height: 100
    width: 100
  - y: 69
    x: 69
    height: 30
    width: 30
expect_request:
