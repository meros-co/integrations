spec: kiloview-multiview-server
telemetry: windows
inbound_http:
  path: /api/output/tabs_get.json
  body: '{"result":"ok","data":[{"NDIStatus":false,"enable":true,"id":"1","name":"Main","takeTarget":0}]}'
expect_state:
  windows:
    '1':
      name: Main
      in_use: true
      ndi: false
      take_target: 0
state_before:
  windows:
    '2':
      name: Output 2
expect_then_send:
- method: GET
  target: /api/output/get.json?output=1
- method: GET
  target: /api/window/get_window_position.json?output=1
- method: GET
  target: /api/output/get_state_contol.json?output=1
- method: GET
  target: /api/ndi/get_status.json?output=1
- method: GET
  target: /api/ndi/get_take.json?output=1
