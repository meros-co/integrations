spec: kiloview-multiview-server
command: add_layout
input:
  layout: '11'
  name: '123'
  grids:
  - y: 0
    x: 0
    height: 100
    width: 100
  - y: 69
    x: 69
    height: 30
    width: 30
expect_request:
  method: POST
  target: /api/pattern/add.json
  body: '{"id":"11","name":"123","data":[{"y":0,"x":0,"height":100,"width":100},{"y":69,"x":69,"height":30,"width":30}]}'
  content_type: application/json
http_reply:
  status: 200
  body: '{"result":"ok"}'
expect_result:
  ok:
    kind: ack
