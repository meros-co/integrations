spec: kiloview-decoder
telemetry: overlays
inbound_http:
  path: /api/overlay/list?output_id=1
  body: '{"result": "ok", "data": [{"background": "transparent", "editing": true, "id": 1, "img_path":
    "./data/decoder_config/overlay/preview/overlay_1.png", "modified": false, "name": "template_1", "selected":
    true, "status": 0}]}'
expect_state:
  outputs:
    '1':
      overlays:
        '1':
          name: template_1
          selected: true
          status: 0
          background: transparent
          editing: true
          modified: false
          image: ./data/decoder_config/overlay/preview/overlay_1.png
