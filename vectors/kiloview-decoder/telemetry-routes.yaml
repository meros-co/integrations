spec: kiloview-decoder
telemetry: routes
inbound_http:
  path: /api/network/routing/get
  body: '{"result": "ok", "data": [{"id": 1, "device": "eth0", "ip": "192.168.38.12", "netmask": "255.255.255.0",
    "gw": "192.168.38.254", "mtu": 1500, "metric": 0, "status": 1}]}'
