spec: kiloview-decoder
telemetry: border
inbound_http:
  path: /api/output/border/get
  body: '{"result": "ok", "data": {"bottom_width": 2, "color": "#00FF00", "enable": true, "hex_color":
    65280, "left_width": 3, "right_width": 3, "top_width": 2}}'
  request:
    output_id: 2
expect_state:
  outputs:
    '2':
      border:
        enabled: true
        color: '#00FF00'
        top_width: 2
        bottom_width: 2
        left_width: 3
        right_width: 3
