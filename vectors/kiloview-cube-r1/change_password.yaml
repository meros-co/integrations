spec: kiloview-cube-r1
command: change_password
input:
  username: admin
  old_password: admin
  new_password: Admin1
expect_request:
  method: POST
  target: /api/r1/users/modify.json
  body: '{"oldpassword":"admin","username":"admin","password":"Admin1"}'
  content_type: application/json
http_reply:
  status: 200
  body: '{"result":"ok"}'
expect_result:
  ok:
    kind: ack
