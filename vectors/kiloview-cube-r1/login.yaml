spec: kiloview-cube-r1
command: login
input:
  username: admin
  password: admin
expect_request:
  method: POST
  target: /api/r1/users/login.json
  body: '{"username":"admin","password":"admin"}'
  content_type: application/json
http_reply:
  status: 200
  body: '{"data":{"alias":"admin","changed":true,"token":"3ee69a2f13b71cc57061845bc3bf04c5","username":"admin"},"result":"ok"}'
expect_result:
  ok:
    kind: value
    value: 3ee69a2f13b71cc57061845bc3bf04c5
