spec: kiloview-cube-r1
command: list_recordings
input:
  disk_id: '1'
  channel: source-1
  from: '2023-4-10 13:09:39'
expect_request:
  method: POST
  target: /api/r1/playback/getPlayList.json
  body: '{"disk_id":"1","channelName":"source-1","startTime":"2023-4-10 13:09:39","stopTime":""}'
  content_type: application/json
