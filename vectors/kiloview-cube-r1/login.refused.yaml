spec: kiloview-cube-r1
command: login
input:
  username: admin
  password: wrong
expect_request:
  method: POST
  target: /api/r1/users/login.json
  body: '{"username":"admin","password":"wrong"}'
  content_type: application/json
http_reply:
  status: 200
  body: '{"msg":"Username or password is incorrect","result":"error"}'
expect_result:
  error:
    error: device_error
