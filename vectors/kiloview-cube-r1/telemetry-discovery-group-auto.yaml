spec: kiloview-cube-r1
telemetry: discovery-group-auto
inbound_http:
  path: /api/r1/source/get_param.json?disc_id=1
  body: '{"data":{"disc_id":"1","disc_name":"Studio","disc_type":"Auto","discovery_enable":true,"discovery_ip":"192.168.1.1","group":["kiloview","NDI","test"]},"result":"ok"}'
