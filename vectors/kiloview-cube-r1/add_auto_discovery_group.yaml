spec: kiloview-cube-r1
command: add_auto_discovery_group
input:
  name: Studio
  server_enabled: true
  server: 192.168.1.1
  ndi_groups:
  - kiloview
  - NDI
  - test
expect_request:
  method: POST
  target: /api/r1/source/add.json
  body: '{"disc_name":"Studio","disc_type":"Auto","discovery_enable":true,"discovery_ip":"192.168.1.1","group":["kiloview","NDI","test"]}'
  content_type: application/json
http_reply:
  status: 200
  body: '{"result":"ok"}'
expect_result:
  ok:
    kind: ack
