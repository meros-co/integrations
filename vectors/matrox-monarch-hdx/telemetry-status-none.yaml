spec: matrox-monarch-hdx
telemetry: status-none
inbound_http:
  path: /Monarch/syncconnect/sdk.aspx?command=GetStatus
  body: "ENC1:RECORD,ON, ENC2:NONE,DISABLED, NAME:DEVICE3\r\n"
expect_state:
  device:
    name: DEVICE3
  encoders:
    '1':
      mode: RECORD
      state: 'ON'
      active: true
    '2':
      mode: NONE
      state: DISABLED
      active: false
