spec: matrox-monarch-hdx
telemetry: status
inbound_http:
  path: /Monarch/syncconnect/sdk.aspx?command=GetStatus
  body: ENC1:RECORD,READY, ENC2:RTMP,ON, NAME:DEVICE1
expect_state:
  device:
    name: DEVICE1
  encoders:
    '1':
      mode: RECORD
      state: READY
      active: false
    '2':
      mode: RTMP
      state: 'ON'
      active: true
