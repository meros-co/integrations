spec: megapixel-helios
telemetry: ws-state
expect_connect_ws:
- '{"jsonrpc":"2.0","id":1,"method":"state"}'
inbound_ws: '{"jsonrpc": "2.0", "id": 1, "result": {"dev": {"display": {"brightness": 28.2, "gamma": 1.5,
  "blackout": false, "redundancy": {"mode": "failover", "role": "main", "state": "active"}}, "ingest":
  {"input": "hdmi1", "testPattern": {"enabled": false}, "inputs": {"hdmi1": {"valid": true, "resolution":
  "3840x2160p60.00", "freq": 60}}}, "groups": {"0": {"name": "Floor", "blackout": true}}}, "sys": {"alertsCount":
  2, "alertsSeverity": 3}}}'
expect_state:
  display:
    brightness: 28.2
    gamma: 1.5
    blackout: false
    redundancy:
      mode: failover
      role: main
      state: active
  ingest:
    input: hdmi1
    test_pattern:
      enabled: false
    inputs:
      hdmi1:
        valid: true
        resolution: 3840x2160p60.00
        freq: 60.0
  groups:
    '0':
      name: Floor
      blackout: true
  sys:
    alerts_count: 2
    alerts_severity: 3
