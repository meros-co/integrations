spec: megapixel-helios
command: recall_preset_by_name
input:
  name: Global Settings
expect_request:
  method: POST
  target: /api/v1/presets/apply
  body: '{"presetName":"Global Settings"}'
http_reply:
  status: 200
  body: '{"dev":{"display":{"brightness":5.7,"cct":6504,"gamma":2.4,"blackout":false}}}'
expect_result:
  ok:
    kind: ack
