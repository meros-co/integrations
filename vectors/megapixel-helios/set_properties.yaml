spec: megapixel-helios
command: set_properties
input:
  tree:
    dev:
      display:
        brightness: 42
        gamma: 2.2
expect_request:
  method: PATCH
  target: /api/v1/public
  body: '{"dev":{"display":{"brightness":42,"gamma":2.2}}}'
http_reply:
  status: 200
  body: '{"dev":{"display":{"brightness":42,"gamma":2.200000047683716}}}'
expect_result:
  ok:
    kind: value
    value:
      dev:
        display:
          brightness: 42
          gamma: 2.200000047683716
