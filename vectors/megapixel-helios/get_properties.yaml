spec: megapixel-helios
command: get_properties
input:
  paths: dev.display.brightness&dev.display.gamma
expect_request:
  method: GET
  target: /api/v1/public?dev.display.brightness&dev.display.gamma
http_reply:
  status: 200
  body: '{"dev":{"display":{"brightness":50,"gamma":2.4}}}'
expect_result:
  ok:
    kind: value
    value:
      dev:
        display:
          brightness: 50
          gamma: 2.4
