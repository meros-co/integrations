spec: magewell-ultra-stream
telemetry: media-sd-page
inbound_http:
  path: /usapi?method=get-media-files&disk-type=1&start=100&count=100
  body: '{"result": 0, "path": "/media/disk1/REC_Folder", "thumbnail": "thumbnail", "media-files": [{"name":
    "VID_200.mov", "thumbnail-name": "VID_200.mov_1", "status": 0, "create-time": "2019-09-26 08:00:00",
    "size-bytes": 1000, "duration": 2, "width": 3840, "height": 2160, "interval": 166667, "codec": 1}]}'
expect_state:
