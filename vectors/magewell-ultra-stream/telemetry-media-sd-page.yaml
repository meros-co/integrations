    sd:
      path: /media/disk1/REC_Folder
      thumbnail_dir: thumbnail
      files:
        VID_1.mov:
          status: normal
        VID_200.mov:
          thumbnail: VID_200.mov_1
          status: recording
          created: '2019-09-26 08:00:00'
          size_bytes: 1000
          duration: 2
          width: 3840
          height: 2160
          frame_interval: 166667
          codec: hevc
state_before:
  media:
    sd:
      files:
        VID_1.mov:
          status: normal
