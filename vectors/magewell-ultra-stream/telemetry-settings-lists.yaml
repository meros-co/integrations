  body: '{"result": 0, "stream-server": [{"id": 0, "type": 0, "url": "192.168.1.123:345/live", "key":
    "aa", "is-auth": 1, "user": "op", "passwd": "pw", "is-use": 1, "token": "", "net-mode": 1, "name":
    "192.168.1.123"}, {"id": 2, "type": 100, "name": "Local RTSP", "port": 554, "is-main": 1, "main-stream-name":
