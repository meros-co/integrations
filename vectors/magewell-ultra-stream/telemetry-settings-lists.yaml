    [{"id": 0, "is-use": 1, "type": 2, "account-id": "dbid:AABnr7BK6RO5", "photo-path": "", "user-name":
    "qin qiu", "access-token": "secret", "refresh-token": "secret", "dir-name": "()", "net-mode": 2},
    {"id": 1, "is-use": 0, "type": 0, "proto": 1, "url": "ftp.example.com", "port": 22, "dir-name": "up",
    "encryption": 0, "login-type": 1, "user-name": "cam", "passwd": "secret", "mode": 1, "net-mode": 1}],
    "nosignal-files": [{"id": 0, "is-use": 0, "is-edit": 0, "file-path": "/no-signal/default0.jpg", "time":
    0}, {"id": 1, "is-use": 1, "is-edit": 1, "file-path": "/no-signal/user1.jpg", "time": 1569393321}]}'
expect_state:
  stream_servers:
    '0':
      type: rtmp
      name: 192.168.1.123
      url: 192.168.1.123:345/live
      auth: true
      user: op
      enabled: true
      network: ethernet
    '2':
      type: rtsp
      name: Local RTSP
      enabled: false
      network: ethernet
      port: 554
      main: true
      main_name: main
      sub: false
      sub_name: sub
      audio: true
  upload_servers:
    '0':
      type: dropbox
      enabled: true
      network: wifi
      account_id: dbid:AABnr7BK6RO5
      user: qin qiu
      photo_path: ''
      directory: ()
    '1':
      type: ftp
      enabled: false
      network: ethernet
      user: cam
      directory: up
      protocol: sftp
      url: ftp.example.com
      port: 22
      encryption: plain
      login: normal
      mode: passive
  no_signal:
    images:
      '0':
        selected: false
        editable: false
        path: /no-signal/default0.jpg
        time: 0
      '1':
        selected: true
        editable: true
        path: /no-signal/user1.jpg
        time: 1569393321
state_before:
  stream_servers:
    '5':
      name: Old
      type: rtmp
  no_signal:
    images:
      '3':
        path: /no-signal/gone.jpg
