spec: magewell-ultra-stream
telemetry: settings
inbound_http:
  path: /usapi?method=get-settings
  body: '{"result": 0, "name": "Ultra Stream C301191111100", "passwd": 0, "is-settings": 1, "is-ssdp":
    1, "is-startup-rec": 0, "is-startup-live": 1, "is-signal-lost": 0, "is-hdmi-rec-ctrl": 0, "is-auto-send-file":
    0, "is-auto-rec": 0, "is-low-latency": 0, "is-auto-live": 0, "is-check-update": 1, "audio-sync-offset":
    -20, "enable-key-reset": 1, "enable-key-reboot": 1, "softap": {"is-softap": 1, "is-visible": 1, "softap-ssid":
    "C301181214002", "softap-passwd": "81214002"}, "date-time": {"timezone": "UTC", "is-auto": 1}, "rec-control":
    {"mime-type": 0, "usb-option": 1, "sd-option": 2, "root-folder": "REC_Folder", "file-prefix": "VID",
    "time-unit": 5}, "video-color": {"contrast": 100, "brightness": 0, "saturation": 100, "hue": 0}, "volume":
    {"is-mic": 1, "mic-gain": 0, "is-spi": 1, "spi-gain": -6.5, "is-phone": 0, "phone-gain": 0}, "rec-stream":
    0, "live-stream": 1, "mws-stream": 1, "main-stream": {"is-auto": 0, "codec": 1, "cx": 1920, "cy":
    1080, "duration": 166667, "kbps": 4096, "gop": 1, "fourcc": 0, "profile": 0, "cbrstat": 60, "fullrange":
    0}, "sub-stream": {"cx": 1024, "cy": 768, "duration": 333333, "kbps": 1024, "gop": 1, "fourcc": 0,
    "profile": 2, "cbrstat": 60, "fullrange": 1}, "audio": {"sample-rate": 48000, "channels": 2, "kbps":
    128}, "eth": {"is-dhcp": 0, "ip": "10.10.107.212", "mask": "255.255.0.0", "router": "10.10.0.1", "dns":
    "10.0.0.3"}, "wifi": {"is-dhcp": 1, "ip": "", "mask": "", "router": "", "dns": ""}, "video-input-format":
    {"is-color-fmt": 0, "color-fmt": 1, "is-quant-range": 0, "quant-range": 1}, "video-output-format":
    {"is-color-fmt": 0, "color-fmt": 3, "is-quant-range": 0, "quant-range": 2, "is-sat-range": 1, "sat-range":
    3}, "use-nosignal-file": 1}'
expect_state:
  device:
    name: Ultra Stream C301191111100
  app:
    password_enabled: false
    settings_allowed: true
  network:
    ssdp: true
    ethernet:
      config:
        dhcp: false
        ip_address: 10.10.107.212
        netmask: 255.255.0.0
        gateway: 10.10.0.1
        dns: 10.0.0.3
    wifi:
      config:
        dhcp: true
        ip_address: ''
        netmask: ''
        gateway: ''
        dns: ''
  control:
    startup_record: false
    startup_live: true
    stop_on_signal_loss: false
    hdmi_record_control: false
    auto_record: false
    live_lock: false
    low_latency_live: false
  upload:
    auto: false
  firmware:
    auto_check: true
  keys:
    reset_enabled: true
    reboot_enabled: true
  audio:
    sync_offset_ms: -20
    mic:
      enabled: true
      gain: 0.0
    input:
      enabled: true
      gain: -6.5
    headphone:
      enabled: false
      gain: 0.0
    sample_rate: 48000
    channels: 2
    kbps: 128
  softap:
    enabled: true
    visible: true
    ssid: C301181214002
  time:
    timezone: UTC
    auto: true
  recording:
    options:
      file_type: mp4
      usb: normal
      sd: loop
      folder: REC_Folder
      file_prefix: VID
      file_minutes: 5
  video:
    contrast: 100
    brightness: 0
    saturation: 100
    hue: 0
    input_format:
      custom_color_space: false
      color_space: rgb
      custom_quant_range: false
      quant_range: full
    output_format:
      custom_color_space: false
      color_space: bt709
      custom_quant_range: false
      quant_range: limited
      custom_sat_range: true
      sat_range: extended
  streams:
    recording: main
    live: sub
    preview: sub
  encoder:
    main:
      follow_input: false
      codec: hevc
      width: 1920
      height: 1080
      frame_interval: 166667
      kbps: 4096
      gop_seconds: 1
      profile: 0
      stat_seconds: 60
      range: limited
    sub:
      width: 1024
      height: 768
      frame_interval: 333333
      kbps: 1024
      gop_seconds: 1
      profile: 2
      stat_seconds: 60
      range: full
  no_signal:
    enabled: true
