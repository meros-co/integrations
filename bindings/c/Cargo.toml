[package]
name = "meros-integrations-c"
version = "0.1.0"
description = "C interface to the integrations core."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "meros_integrations_c"
crate-type = ["staticlib", "cdylib", "rlib"]

# Every device family by default. A product that needs only some builds with
# --no-default-features --features meros-integrations/sennheiser,meros-integrations/shure
# (the families are listed in crates/core/Cargo.toml).
[features]
default = ["all"]
all = ["meros-integrations/all"]

[dependencies]
meros-integrations = { path = "../../crates/core", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
