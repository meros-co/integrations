[package]
name = "meros-integrations-c"
version = "0.1.0"
description = "C interface to the integrations core."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "meros_integrations_c"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
meros-integrations = { path = "../../crates/core" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
