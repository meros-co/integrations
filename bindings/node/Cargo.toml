[package]
name = "meros-integrations-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

# Every device family by default. A product that needs only some builds with
# --no-default-features --features meros-integrations/sennheiser,meros-integrations/shure
# (the families are listed in crates/core/Cargo.toml).
[features]
default = ["all"]
all = ["meros-integrations/all"]

[dependencies]
meros-integrations = { path = "../../crates/core", default-features = false }
napi = { version = "2", default-features = false, features = ["napi6", "serde-json", "tokio_rt"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"
