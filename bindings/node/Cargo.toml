[package]
name = "meros-integrations-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

# Which integrations are built in. The default is all of them; a product
# chooses exactly its own with
#   --no-default-features --features meros-integrations/sennheiser-ew-dx,meros-integrations/shure-wireless
# naming spec ids, vendor groups (meros-integrations/vendor-sennheiser) or
# meros-integrations/all. The list is in crates/core/Cargo.toml.
[features]
default = ["all"]
all = ["meros-integrations/all"]

[dependencies]
meros-integrations = { path = "../../crates/core", default-features = false }
napi = { version = "2", default-features = false, features = ["napi6", "serde-json", "tokio_rt"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"
