[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "meros-integrations"
version = "0.1.0"
description = "One implementation of third-party device control and telemetry, shared by every consumer."
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.maturin]
module-name = "meros_integrations._native"
python-packages = ["meros_integrations"]
