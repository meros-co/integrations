[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "meros-integrations"
version = "0.1.0"
description = "One implementation of third-party device control and telemetry, shared by every consumer."
license = { text = "MIT" }
requires-python = ">=3.9"

# Which integrations a wheel contains is chosen with cargo features of the
# core (maturin's --features, or MATURIN_PEP517_ARGS for pip); see README.md.
[tool.maturin]
module-name = "meros_integrations._native"
python-packages = ["meros_integrations"]
