[package]
name = "meros-integrations-py"
version = "0.1.0"
description = "Python binding for the integrations core."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

# Every device family by default. A product that needs only some builds with
# --no-default-features --features meros-integrations/sennheiser,meros-integrations/shure
# (the families are listed in crates/core/Cargo.toml).
[features]
default = ["all"]
all = ["meros-integrations/all"]

[dependencies]
meros-integrations = { path = "../../crates/core", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[build-dependencies]
pyo3-build-config = "0.29"
