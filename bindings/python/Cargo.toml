[package]
name = "meros-integrations-py"
version = "0.1.0"
description = "Python binding for the integrations core."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
meros-integrations = { path = "../../crates/core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
